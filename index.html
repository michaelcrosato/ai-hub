<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0910" />
    <meta
      name="description"
      content="A private arcade of games built by AI models. Pick a cabinet and play in the browser."
    />
    <title>AI Hub</title>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230c0910'/%3E%3Crect x='6' y='7' width='20' height='7' rx='1.5' fill='%23ffb43d'/%3E%3Crect x='6' y='17' width='20' height='8' rx='1' fill='%232b2334'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"
    />

    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/shell.css" />
    <link rel="stylesheet" href="/assets/css/cabinet.css" />
    <link rel="stylesheet" href="/assets/css/detail.css" />
    <link rel="stylesheet" href="/assets/css/player.css" />
    <link rel="stylesheet" href="/assets/css/shelves.css" />
    <link rel="stylesheet" href="/assets/css/dev.css" />
    <link rel="stylesheet" href="/assets/css/views.css" />
  </head>

  <body>
    <div class="room" aria-hidden="true">
      <div class="room__haze"></div>
      <div class="room__grain"></div>
    </div>

    <a class="skip" href="#wall">Skip to the games</a>

    <header class="sign">
      <div class="sign__plate">
        <h1 class="sign__name">AI Hub</h1>
        <p class="sign__blurb">
          Every game here was built by an AI model. Click a cabinet to play — nothing to install.
        </p>
      </div>
      <div class="sign__side">
        <div class="sign__search" id="search" role="search"></div>
        <p class="sign__count" id="count" aria-live="polite"></p>
      </div>
    </header>

    <nav class="shelves" id="shelves" aria-label="What to show"></nav>

    <div class="controls" id="controls"></div>

    <main class="wall" id="wall" tabindex="-1">
      <p class="wall__status" id="status">Loading the wall…</p>
    </main>

    <aside class="detail" id="detail" hidden></aside>
    <div class="player" id="player" hidden></div>
    <div class="dev" id="dev" hidden></div>

    <script type="module" src="/assets/js/app.js"></script>
    <noscript>
      <p style="padding: 2rem; color: #f3eef7; font-family: sans-serif">
        This arcade needs JavaScript to build the wall. The games themselves are plain HTML files in
        <code>/games/</code> and run fine on their own.
      </p>
    </noscript>
  </body>
</html>
