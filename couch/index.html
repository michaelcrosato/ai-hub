<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta
      name="description"
      content="The AI Hub on the big screen: one game at a time, browsed with the arrow keys or a controller."
    />
    <title>Couch — AI Hub</title>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305060a'/%3E%3Crect x='5' y='7' width='22' height='14' rx='2.5' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Cpath d='M11 25.5h10' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"
    />

    <link rel="stylesheet" href="/assets/css/views.css" />
    <link rel="stylesheet" href="/assets/css/player.css" />
    <link rel="stylesheet" href="/assets/css/couch.css" />
    <link rel="stylesheet" href="/assets/css/couch-page.css" />
    <link rel="stylesheet" href="/assets/css/couch-find.css" />
    <link rel="stylesheet" href="/assets/css/account.css" />
  </head>

  <body>
    <div class="couch" id="couch">
      <div class="stage" id="stage" aria-hidden="true"></div>
      <header class="bar" id="bar"></header>
      <main class="home" id="home">
        <section class="hero" id="hero" aria-label="Selected game"></section>
        <div class="rails" id="rails" role="region" aria-label="Games, in rows"></div>
      </main>
    </div>

    <section class="find" id="find" role="dialog" aria-modal="true" aria-label="Search" hidden></section>
    <section class="page" id="page" role="dialog" aria-modal="true" hidden></section>
    <div class="player" id="player" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/assets/js/couch/app.js"></script>
    <noscript>
      <p style="padding: 2rem; color: #f5f6fa; font-family: sans-serif">
        The Couch needs JavaScript. The games themselves are plain HTML files in
        <code>/games/</code> and run fine on their own.
      </p>
    </noscript>
  </body>
</html>
