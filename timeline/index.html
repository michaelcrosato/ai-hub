<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta data-line-content="explore.timeline.page_description" name="description" content="Travel through the collection by the day each entry joined the hub." />
    <meta name="theme-color" content="#111719" />
    <title data-line="explore.timeline.title">Timeline — AI Hub</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111719'/%3E%3Ctext x='16' y='23' text-anchor='middle' fill='white' font-size='22'%3ET%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/views.css" />
    <link rel="stylesheet" href="/assets/css/detail.css" />
    <link rel="stylesheet" href="/assets/css/player.css" />
    <link rel="stylesheet" href="/assets/css/explore.css" />
    <link rel="stylesheet" href="/assets/css/timeline.css" />
    <link rel="stylesheet" href="/assets/css/account.css" />
  </head>
  <body data-view="timeline">
    <a class="skip" href="#explore-content" data-line="explore.page.skip">Skip to the selection</a>
    <div class="explore-shell" id="explore-shell">
      <header class="explore-header">
        <a class="explore-brand" href="/">AI Hub <span data-line="explore.timeline.brand">/ Timeline</span></a>
        <div id="views"></div>
      </header>
      <div class="explore-intro">
        <div>
          <p class="explore-eyebrow" data-line="explore.timeline.eyebrow">The arrival journal</p>
          <h1 data-line="explore.timeline.page_heading">A library in the making.</h1>
        </div>
        <p class="explore-description" data-line="explore.timeline.intro">Travel through the collection by the day each entry joined the hub.</p>
      </div>
      <section class="explore-controls" aria-label="Library selection" data-line-aria-label="explore.page.library_selection">
        <label class="explore-search">
          <span class="visually-hidden" data-line="explore.page.search_label">Search the library</span>
          <input id="explore-search" type="search" data-line-placeholder="explore.page.search_placeholder" placeholder="Search titles, genres, models…" autocomplete="off" />
        </label>
        <label>
          <span class="visually-hidden" data-line="explore.page.shelf">Shelf</span>
          <select id="explore-shelf" aria-label="Shelf" data-line-aria-label="explore.page.shelf">
            <option value="games" data-line="explore.page.shelf_games">Games</option>
            <option value="all" data-line="explore.page.shelf_all">All entries</option>
            <option value="tools" data-line="explore.page.shelf_tools">Tech demos &amp; tools</option>
            <option value="unsure" data-line="explore.page.shelf_unsure">Unsure</option>
          </select>
        </label>
        <button id="explore-fav" type="button" aria-pressed="false" data-line="explore.page.favourites_only">Favourites only</button>
        <button id="explore-reset" type="button" data-line="explore.page.reset">Reset selection</button>
      </section>
      <div class="explore-status">
        <p id="explore-count" role="status" data-line="explore.page.opening">Opening the library…</p>
        <p id="explore-notice" role="status"></p>
      </div>
      <main class="explore-content" id="explore-content" tabindex="-1" aria-label="Timeline selection" data-line-aria-label="explore.timeline.selection"></main>
    </div>
    <aside class="detail" id="detail" hidden></aside>
    <div class="player" id="player" hidden></div>
    <script type="module" src="/assets/js/explore/app.js"></script>
    <noscript><p>This selection interface needs JavaScript. Games can also be opened directly from their HTML files.</p></noscript>
  </body>
</html>
