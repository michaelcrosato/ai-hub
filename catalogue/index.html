<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="The AI Hub as a reading room: every game a record to query, sort, chart, compare and play."
    />
    <title>Catalogue — AI Hub</title>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23f4f1ea'/%3E%3Cpath d='M7 9h18M7 14h18M7 19h11' stroke='%231b1916' stroke-width='2'/%3E%3Crect x='7' y='22.5' width='7' height='3' fill='%232c4fc4'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

    <link rel="stylesheet" href="/assets/css/views.css" />
    <link rel="stylesheet" href="/assets/css/player.css" />
    <link rel="stylesheet" href="/assets/css/catalogue.css" />
    <link rel="stylesheet" href="/assets/css/catalogue-record.css" />
    <link rel="stylesheet" href="/assets/css/account.css" />
  </head>

  <body data-density="compact">
    <a class="skip" href="#records">Skip to the records</a>

    <header class="masthead" id="masthead">
      <div class="masthead__mark">
        <a class="wordmark" href="/catalogue">
          <span class="wordmark__hub">AI Hub</span><span class="wordmark__dot" aria-hidden="true">·</span
          ><span class="wordmark__name">Catalogue</span>
        </a>
        <p class="masthead__colophon" id="colophon">Compiling the records…</p>
      </div>
      <div class="query" id="query" role="search"></div>
      <div class="masthead__views" id="views"></div>
    </header>

    <section class="summary" id="summary" aria-label="What the query selects"></section>

    <aside class="facets" id="facets" aria-label="Facets">
      <div class="facets__body" id="facets-body"></div>
      <div class="facets__done"><button type="button" class="btn btn--play" id="done">Show the records</button></div>
    </aside>

    <main class="desk" id="desk">
      <div class="toolbar" id="toolbar"></div>
      <div class="desk__scroll" id="scroll">
        <section class="figures" id="figures" aria-label="Figures"></section>
        <div class="records" id="records" tabindex="-1">
          <p class="desk__status">Opening the catalogue…</p>
        </div>
        <section class="compare" id="compare" aria-label="Compare" hidden></section>
      </div>
    </main>

    <aside class="sheet" id="sheet" aria-label="Record"></aside>

    <div class="player" id="player" hidden></div>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
    <p class="visually-hidden" id="announce" aria-live="polite"></p>

    <script type="module" src="/assets/js/catalogue/app.js"></script>
    <noscript>
      <p style="padding: 2rem; font-family: Georgia, serif">
        The catalogue needs JavaScript to read the records. The games themselves are plain HTML files in
        <code>/games/</code> and run fine on their own.
      </p>
    </noscript>
  </body>
</html>
