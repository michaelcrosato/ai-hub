<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <title>Kit Example — Roll the Ball</title>
  <!-- The shared 3D stack. Every 3D game carries this block unchanged. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/lib/three/three.webgpu.js",
      "three/webgpu": "/lib/three/three.webgpu.js",
      "three/tsl": "/lib/three/three.tsl.js",
      "three/addons/": "/lib/three/addons/",
      "kit/": "/lib/kit/"
    }
  }
  </script>
  <link rel="modulepreload" href="/lib/three/three.core.js" />
  <link rel="modulepreload" href="/lib/three/three.webgpu.js" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; color: #e8eef6; font: 14px/1.4 system-ui, sans-serif; }
    #hud { position: fixed; left: 12px; top: 10px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <div id="hud">Knock the crates off · <span id="score">0</span></div>
  <script type="module">
    import * as THREE from 'three/webgpu';
    import { color, sin, time, positionWorld, mix } from 'three/tsl';
    import { boot } from 'kit/boot.js';
    import { createPost } from 'kit/post.js';
    import { createPoints } from 'kit/points.js';
    import { createWorld, fixedStep } from 'kit/physics.js';

    const kit = await boot({
      title: 'Roll the Ball',
      physics: true,
      input: {
        move: { type: 'vector', keys: 'wasd+arrows', gamepad: 'leftStick+dpad', touch: 'stick' },
        look: { type: 'look', mouse: 'drag', gamepad: 'rightStick', touch: 'drag' },
        jump: { keys: ['Space'], gamepad: ['A'], touch: 'Jump' },
        reset: { keys: ['KeyR'], gamepad: ['Y'], touch: { label: 'Reset', slot: 'top' } },
      },
    });
    const { RAPIER, input } = kit;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1020);
    scene.fog = new THREE.Fog(0x0b1020, 30, 90 * kit.tier.drawDistance);
    const camera = kit.fitCamera(new THREE.PerspectiveCamera(60, 1, 0.1, 200));

    scene.add(new THREE.HemisphereLight(0x9fb7ff, 0x1a1020, 0.8));
    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(12, 20, 8);
    sun.castShadow = true;
    kit.shadow(sun, 2048); // 2048 at high, scaled for the tier, follows quality changes
    Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25 });
    scene.add(sun);
    kit.renderer.shadowMap.enabled = true;

    const world = createWorld(RAPIER);
    const step = fixedStep(60);

    // Ground: a TSL material with a moving glow line, identical on both backends.
    const groundMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.9 });
    const pulse = sin(positionWorld.x.mul(0.5).add(time.mul(2))).mul(0.5).add(0.5);
    groundMat.colorNode = mix(color(0x1b2240), color(0x243a7a), pulse.pow(8));
    const ground = new THREE.Mesh(new THREE.BoxGeometry(40, 1, 40), groundMat);
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);
    world.createCollider(RAPIER.ColliderDesc.cuboid(20, 0.5, 20).setTranslation(0, -0.5, 0));

    const ballMat = new THREE.MeshStandardNodeMaterial({ color: 0xffb347, roughness: 0.35, metalness: 0.1 });
    ballMat.emissiveNode = color(0xff6a00).mul(0.6);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 16), ballMat);
    ball.castShadow = true;
    scene.add(ball);
    const ballBody = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(0, 1, 6).setLinearDamping(0.3).setAngularDamping(0.4));
    world.createCollider(RAPIER.ColliderDesc.ball(0.6).setRestitution(0.2).setFriction(1.2).setDensity(2), ballBody);

    const crates = [];
    const crateGeo = new THREE.BoxGeometry(1, 1, 1);
    const crateMat = new THREE.MeshStandardNodeMaterial({ color: 0x5fd3ff, roughness: 0.6 });
    const spawnCrates = () => {
      for (const c of crates) {
        scene.remove(c.mesh);
        world.removeRigidBody(c.body);
      }
      crates.length = 0;
      for (let x = -2; x <= 2; x++) {
        for (let y = 0; y < 3; y++) {
          const mesh = new THREE.Mesh(crateGeo, crateMat);
          mesh.castShadow = mesh.receiveShadow = true;
          scene.add(mesh);
          const body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(x * 1.05, 0.5 + y, -4));
          world.createCollider(RAPIER.ColliderDesc.cuboid(0.5, 0.5, 0.5).setFriction(0.8), body);
          crates.push({ mesh, body, out: false });
        }
      }
    };
    spawnCrates();

    // Sized points: WebGPU would draw THREE.Points at 1px, so the kit builds sprites.
    const starCount = kit.detail(1500);
    const pos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = 70 + Math.random() * 30, a = Math.random() * Math.PI * 2, h = Math.random() * 50 + 5;
      pos.set([Math.cos(a) * r, h, Math.sin(a) * r], i * 3);
    }
    const stars = createPoints({ positions: pos, size: 2, sizeAttenuation: false, material: { color: 0xcfe0ff, fog: false } });
    scene.add(stars.object);

    const post = createPost(kit, scene, camera, { bloom: { strength: 0.9, radius: 0.35, threshold: 0.6 } });

    let yaw = 0, pitch = 0.35, score = 0;
    const scoreEl = document.getElementById('score');
    const camTarget = new THREE.Vector3();

    kit.start((dt) => {
      const look = input.look();
      yaw -= look.x;
      pitch = Math.min(1.2, Math.max(0.05, pitch + look.y));

      const mv = input.vector('move');
      // Camera-relative: forward is away from the camera, right is 90° clockwise of it.
      const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
      const impulse = 18 * dt;
      ballBody.applyImpulse({ x: (fx * mv.y + rx * mv.x) * impulse, y: 0, z: (fz * mv.y + rz * mv.x) * impulse }, true);
      if (input.pressed('jump') && ballBody.translation().y < 0.75) {
        ballBody.applyImpulse({ x: 0, y: 7, z: 0 }, true);
        input.rumble(0.3, 80);
      }
      if (input.pressed('reset')) {
        spawnCrates();
        ballBody.setTranslation({ x: 0, y: 1, z: 6 }, true);
        ballBody.setLinvel({ x: 0, y: 0, z: 0 }, true);
        score = 0;
      }

      step.advance(dt, () => world.step());

      const p = ballBody.translation();
      ball.position.set(p.x, p.y, p.z);
      const q = ballBody.rotation();
      ball.quaternion.set(q.x, q.y, q.z, q.w);
      for (const c of crates) {
        const t = c.body.translation();
        c.mesh.position.set(t.x, t.y, t.z);
        const r = c.body.rotation();
        c.mesh.quaternion.set(r.x, r.y, r.z, r.w);
        if (!c.out && t.y < -1) {
          c.out = true;
          score += 1;
        }
      }
      scoreEl.textContent = score;

      camTarget.lerp(ball.position, 1 - Math.exp(-8 * dt));
      camera.position.set(
        camTarget.x + Math.sin(yaw) * Math.cos(pitch) * 9,
        camTarget.y + Math.sin(pitch) * 9,
        camTarget.z + Math.cos(yaw) * Math.cos(pitch) * 9
      );
      camera.lookAt(camTarget);
      post.render();
    });
  </script>
</body>
</html>
