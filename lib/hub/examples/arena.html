<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Arena — AI Hub session example (versus)</title>
<meta name="description" content="A minimal versus game for the AI Hub Session Protocol: every copy moves its own player, the host runs the stars and the scores, first to ten wins.">
<meta name="theme-color" content="#1b1530">
<meta name="hub:type" content="Tech demo">
<meta name="hub:players" content="1">
<meta name="hub:session" content="1">
<meta name="hub:session-players" content="2-4">
<meta name="hub:session-mode" content="versus">
<meta name="hub:session-minutes" content="2">
<meta name="hub:session-goal" content="First to ten stars wins">
<meta name="hub:session-howto" content="Move: arrows, WASD or a stick · sprint: Space or Cross · or hold a finger">
<style>
  html, body { margin: 0; height: 100%; background: #1b1530; color: #f3eef7; font: 16px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
<script>
/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</head>
<body>
<canvas id="c" aria-label="Star Arena"></canvas>
<script>
'use strict';
// Star Arena: the smallest honest versus game, the plain form of "Versus and
// co-op: the host runs the world" (lib/hub/README.md). Every copy moves its own
// player from its own stick, at once, and never waits for the network to do
// it. The host's copy runs only what is shared, the star and the scores:
//   me     each other copy → the host, ~15 a second, unreliable: where my player is
//   s      the host → everyone, ~15 a second, unreliable: every player, its score, the star
//   claim  a copy → the host, reliable, once a star: my player touched star n
//   pick   the host → everyone, reliable: player id took star n
// The host takes each player where it says it is, and a claim scores unless
// someone else got there first. A last snapshot, reliable, ends the round.
// The host may be a server, a copy with no player of its own (AIHub.server):
// it runs the same host code, moves nobody and draws nothing.
// First to TARGET stars wins.
const W = 800, H = 600, R = 18, SPEED = 260, TARGET = 10;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const keys = new Set();
let pointer = null;
let audio = null;

addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return toggleMenu();
  if (menu.open) return menuKey(e.key);
  keys.add(e.key.toLowerCase());
  gesture();
});
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
canvas.addEventListener('pointerdown', (e) => { pointer = e; gesture(); });
canvas.addEventListener('pointermove', (e) => { if (pointer) pointer = e; });
addEventListener('pointerup', () => { pointer = null; });

function beep(freq) {
  if (!audio || muted) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = freq; g.gain.value = 0.05;
  o.connect(g).connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.08);
}

// ---- the controller, in the browser's standard mapping (a PS5 DualSense:
// Cross 0, Circle 1, Triangle 3, Create 8, Options 9, D-pad 12-15, left stick
// axes 0 and 1). Buttons count on the frame they go down.
const PAD = { cross: 0, circle: 1, triangle: 3, create: 8, options: 9, up: 12, down: 13 };
let pad = null, padNow = [], padWas = [];
function readPad() {
  pad = navigator.getGamepads ? [...navigator.getGamepads()].find((p) => p && p.connected) || null : null;
  padWas = padNow;
  padNow = pad ? pad.buttons.map((b) => b.pressed) : [];
  // Create + Options is the hub's: it opens the hub's corner bar, so Options alone opens the menu.
  if (pressed(PAD.options) && !padNow[PAD.create]) return toggleMenu();
  if (menu.open) {
    if (pressed(PAD.up)) menuKey('ArrowUp');
    if (pressed(PAD.down)) menuKey('ArrowDown');
    if (pressed(PAD.cross)) menuKey('Enter');
    if (pressed(PAD.circle)) toggleMenu();
  } else if (padNow.some((b, i) => b && !padWas[i] && i !== PAD.create && i !== PAD.options)) gesture();
}
const pressed = (b) => !!padNow[b] && !padWas[b];

// ---- the settings menu: Esc or Options, over the running game. It never
// pauses anything; while it is open your player simply stands still.
let muted = false;
const menu = {
  open: false,
  at: 0,
  items: [
    { label: () => `Sound: ${muted ? 'off' : 'on'}`, act: () => { muted = !muted; } },
    { label: () => 'Back to the game', act: () => toggleMenu() },
  ],
};
function toggleMenu() { menu.open = !menu.open; menu.at = 0; keys.clear(); }
function menuKey(key) {
  if (key === 'ArrowUp' || key === 'w') menu.at = (menu.at + menu.items.length - 1) % menu.items.length;
  if (key === 'ArrowDown' || key === 's') menu.at = (menu.at + 1) % menu.items.length;
  if (key === 'Enter' || key === ' ') menu.items[menu.at].act();
}

/** The local stick: keys, the first gamepad, or a held pointer. Still while the menu is open. */
function stick(me) {
  if (menu.open) return { x: 0, y: 0, sprint: false };
  let x = 0, y = 0;
  if (keys.has('arrowleft') || keys.has('a')) x -= 1;
  if (keys.has('arrowright') || keys.has('d')) x += 1;
  if (keys.has('arrowup') || keys.has('w')) y -= 1;
  if (keys.has('arrowdown') || keys.has('s')) y += 1;
  if (pad) {
    if (Math.abs(pad.axes[0]) > 0.2) x = pad.axes[0];
    if (Math.abs(pad.axes[1]) > 0.2) y = pad.axes[1];
    if (padNow[12]) y = -1;
    if (padNow[13]) y = 1;
    if (padNow[14]) x = -1;
    if (padNow[15]) x = 1;
  }
  if (pointer && me) {
    const p = toWorld(pointer);
    const dx = p.x - me.x, dy = p.y - me.y, d = Math.hypot(dx, dy);
    if (d > 8) { x = dx / d; y = dy / d; }
  }
  const sprint = keys.has(' ') || !!padNow[PAD.cross] || !!padNow[7];
  const len = Math.hypot(x, y);
  return len > 1 ? { x: x / len, y: y / len, sprint } : { x, y, sprint };
}

function toWorld(e) {
  const r = canvas.getBoundingClientRect(), s = Math.min(r.width / W, r.height / H);
  return { x: (e.clientX - r.left - (r.width - W * s) / 2) / s, y: (e.clientY - r.top - (r.height - H * s) / 2) / s };
}

// ---- state shared by both modes
const game = {
  phase: 'title',            // title | ready | waiting | playing | over
  players: [],               // {id, name, color, x, y, score, gone}, drawn at x, y
  star: { x: W / 2, y: H / 2, n: 0 },   // n numbers the stars, so a claim names the one it touched
  rng: Math.random,
  message: '',
  standings: null,
};
let world = 0;               // seconds this copy has advanced the arena: the harness watches it
let felt = { x: 0, y: 0, sprint: false };   // the local stick as last read

function place(players) {
  players.forEach((p, i) => {
    const a = (i / Math.max(players.length, 1)) * Math.PI * 2;
    p.tx = p.x = W / 2 + Math.cos(a) * 200; p.ty = p.y = H / 2 + Math.sin(a) * 180;
  });
}
function newStar() {
  game.star = { x: 40 + game.rng() * (W - 80), y: 40 + game.rng() * (H - 80), n: game.star.n + 1 };
}

/** Your own player, from your own stick. Every copy moves its own, every frame, host or not. */
function move(p, s, dt) {
  const speed = SPEED * (s.sprint ? 1.5 : 1);
  p.x = Math.max(R, Math.min(W - R, p.x + s.x * speed * dt));
  p.y = Math.max(R, Math.min(H - R, p.y + s.y * speed * dt));
}
const touching = (p) => Math.hypot(p.x - game.star.x, p.y - game.star.y) < R + 12;

// ---- solo: the game as it plays on its own
function solo() {
  game.players = [{ id: 0, name: 'You', color: '#f5b700', x: W / 2, y: H / 2, score: 0 }];
  game.phase = 'title';
  game.message = 'Star Arena — press any key or tap to play';
}
let soloEnds = 0;

// ---- hub mode. Every other player also has tx, ty: where it last said it is
// (and on the host, at: when). It is drawn easing toward there; your own player
// is drawn where you put it.
let hub = null;
let lastSent = 0;
let lastSnap = -Infinity;    // the newest snapshot taken, by its AIHub.time()
let claimed = -1;            // the star this copy claimed last: one claim a star

async function connect() {
  const info = await AIHub.connect({ mode: 'versus', seats: [2, 4] });
  if (!info) return solo();
  hub = info;
  game.rng = AIHub.rng('stars');
  game.players = info.players.map((p) => ({ ...p, x: 0, y: 0, score: 0, gone: false, at: -Infinity }));
  place(game.players);
  newStar();                 // the first star comes from the seed: the same on every copy
  if (info.splash || info.server) {
    // The hub's splash collects everyone's ready: ready up as soon as the arena is built.
    game.phase = 'waiting';
    game.message = 'Get ready…';
    AIHub.ready();
  } else {
    game.phase = 'ready';
    game.message = 'Press any key, click or tap when you are ready';
  }
  AIHub.on('start', () => { game.phase = 'playing'; unlockAudio(); });
  AIHub.on('message', (data, from) => {
    if (hub.isHost && data.t === 'me') heard(from, data);
    if (hub.isHost && data.t === 'claim') take(from, data.n);
    if (from === hub.host && data.t === 's') applySnapshot(data);
    if (from === hub.host && data.t === 'pick' && data.id !== hub.me) beep(330);   // your own cheered at the claim
  });
  AIHub.on('leave', ({ id }) => {
    const p = game.players.find((q) => q.id === id);
    if (p) p.gone = true;
    if (hub.isHost && game.phase === 'playing' && game.players.filter((q) => !q.gone).length < 2) finish();
  });
  AIHub.on('time-up', () => { if (hub.isHost) finish(); });
  AIHub.on('end', ({ reason, standings }) => {
    game.phase = 'over';
    game.standings = standings;
    game.message = reason === 'finished' ? 'Round over' : reason === 'sat-out' ? 'You sat this one out' : 'Round cancelled';
  });
}
const inside = (v, max) => Math.max(R, Math.min(max - R, Number(v) || 0));

/** Host: a player says where it is, and there it is, unless an older report arrived late. */
function heard(id, m) {
  const p = game.players.find((q) => q.id === id);
  if (!p || !(m.at > p.at)) return;
  p.at = m.at; p.tx = inside(m.x, W); p.ty = inside(m.y, H);
}

/** Host: player id touched star n. It scores, unless someone else got there first. */
function take(id, n) {
  const p = game.players.find((q) => q.id === id);
  if (game.phase !== 'playing' || !p || p.gone || n !== game.star.n) return;
  p.score++;
  newStar();
  beep(id === hub.me ? 660 : 330);
  AIHub.send({ t: 'pick', id, n });
  if (p.score >= TARGET) finish();
}

/** Host: one snapshot for everyone: every player still here with its score, and the star. */
function snapshot() {
  const spot = (p) => (p.id === hub.me ? [p.x, p.y] : [p.tx, p.ty]);   // the others: where they said
  return {
    t: 's',
    at: Math.round(AIHub.time()),
    p: game.players.filter((p) => !p.gone).map((p) => [p.id, ...spot(p).map(Math.round), p.score]),
    s: [Math.round(game.star.x), Math.round(game.star.y), game.star.n],
  };
}

/** Not the host: take the scores, the star and the other players from the snapshot, never your own player. */
function applySnapshot(s) {
  if (s.at < lastSnap) return;   // unreliable: an older one that arrived late
  lastSnap = s.at;
  for (const [id, x, y, score] of s.p) {
    const p = game.players.find((q) => q.id === id);
    if (!p) continue;
    p.score = score;
    if (id !== hub.me) { p.tx = x; p.ty = y; }
  }
  game.star = { x: s.s[0], y: s.s[1], n: s.s[2] };
  if (s.over) { game.phase = 'over'; game.message = 'Round over'; }
}

/** Host: standings by score, ties together, best first. A last snapshot, reliable, ends every copy on the same scores. */
function finish() {
  if (game.phase === 'over') return;
  AIHub.send({ ...snapshot(), over: 1 });
  const live = game.players.filter((p) => !p.gone).sort((a, b) => b.score - a.score);
  const standings = [];
  for (const p of live) {
    const last = standings[standings.length - 1];
    if (last && last.score === p.score) last.ids.push(p.id);
    else standings.push({ score: p.score, ids: [p.id] });
  }
  const scores = Object.fromEntries(game.players.map((p) => [p.id, p.score]));
  AIHub.finish({ standings: standings.map((g) => g.ids), scores });
  game.phase = 'over';
  game.message = 'Round over';
}

function unlockAudio() {
  if (!audio) {
    try { audio = new AudioContext(); } catch { audio = null; }
  }
  audio?.resume?.().catch(() => {});
}

function gesture() {
  unlockAudio();
  if (hub && game.phase === 'ready') {
    AIHub.ready();
    game.phase = 'waiting';
    game.message = 'Waiting for everyone…';
  } else if (!hub && (game.phase === 'title' || game.phase === 'over')) {
    solo();
    game.phase = 'playing';
    soloEnds = performance.now() + 60_000;
  }
}

// ---- the loop: advance by elapsed time, never pause
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.25);
  last = now;
  readPad();
  const me = game.players.find((p) => p.id === (hub ? hub.me : 0));
  felt = stick(me);
  if (game.phase === 'playing' && (!hub || AIHub.time() >= 0)) {
    world += dt;
    if (me) move(me, felt, dt);   // now, on every copy: your controls never wait for the network
    if (hub) play(now, dt, me);
    else {
      if (touching(me)) { me.score++; newStar(); beep(660); }
      if (now > soloEnds) { game.phase = 'over'; game.message = `Time! ${me.score} stars — press to play again`; }
    }
  }
  if (!hub?.server) draw(now);   // a server runs the world and needs no picture of it
  requestAnimationFrame(frame);
}

/** A session frame, after your own move: the star, what this copy sends, and the others eased toward where they are. */
function play(now, dt, me) {
  if (me && touching(me)) {
    if (hub.isHost) take(hub.me, game.star.n);
    else if (claimed !== game.star.n) {
      // Predict the contact: claim the star once, hide it and cheer now. The host decides the point.
      claimed = game.star.n;
      AIHub.send({ t: 'claim', n: claimed }, { to: hub.host });
      beep(660);
    }
  }
  if (game.phase === 'playing' && now - lastSent > 66) {
    lastSent = now;
    if (hub.isHost) AIHub.send(snapshot(), { reliable: false });
    else AIHub.send({ t: 'me', at: Math.round(AIHub.time()), x: Math.round(me.x), y: Math.round(me.y) }, { to: hub.host, reliable: false });
  }
  const k = 1 - Math.pow(0.001, dt);
  for (const p of game.players) if (p !== me) { p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k; }
}

function draw(now) {
  const r = canvas.getBoundingClientRect();
  const dpr = devicePixelRatio || 1;
  if (canvas.width !== Math.round(r.width * dpr) || canvas.height !== Math.round(r.height * dpr)) {
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  }
  const s = Math.min(canvas.width / W, canvas.height / H);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#120e22'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(s, 0, 0, s, (canvas.width - W * s) / 2, (canvas.height - H * s) / 2);
  ctx.fillStyle = '#1b1530'; ctx.fillRect(0, 0, W, H);

  if (game.star.n !== claimed) {   // a star you claimed is gone here until the host's next one arrives
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath(); ctx.arc(game.star.x, game.star.y, 10 + Math.sin(now / 150) * 2, 0, Math.PI * 2); ctx.fill();
  }

  ctx.textAlign = 'center';
  for (const p of game.players) {
    if (p.gone) continue;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f3eef7'; ctx.font = '14px system-ui';
    ctx.fillText(`${p.name} ${p.score}`, p.x, p.y - R - 8);
  }

  ctx.font = '22px system-ui';
  ctx.fillStyle = '#f3eef7';
  if (hub && game.phase === 'playing' && AIHub.time() < 0) {
    ctx.font = 'bold 96px system-ui';
    ctx.fillText(String(Math.ceil(-AIHub.time() / 1000)), W / 2, H / 2 + 32);
  } else if (game.phase !== 'playing') {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, H / 2 - 120, W, 240);
    ctx.fillStyle = '#f3eef7';
    ctx.fillText(game.message, W / 2, H / 2 - 70);
    const rows = game.standings
      ? game.standings.flatMap((ids, place) => ids.map((id) => [place + 1, game.players.find((p) => p.id === id)]))
      : game.players.map((p) => [null, p]);
    ctx.font = '18px system-ui';
    rows.slice(0, 4).forEach(([place, p], i) => {
      if (!p) return;
      ctx.fillStyle = p.color;
      ctx.fillText(`${place ? place + '. ' : ''}${p.name}${hub && p.id === hub.me ? ' (you)' : ''} — ${p.score}`, W / 2, H / 2 - 30 + i * 28);
    });
  }
  if (menu.open) drawMenu();
}

function drawMenu() {
  ctx.fillStyle = 'rgba(10,8,20,.82)'; ctx.fillRect(W / 2 - 170, 150, 340, 70 + menu.items.length * 40);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f3eef7'; ctx.font = 'bold 22px system-ui';
  ctx.fillText('Settings', W / 2, 186);
  ctx.font = '18px system-ui';
  menu.items.forEach((item, i) => {
    ctx.fillStyle = i === menu.at ? '#ffd34d' : '#f3eef7';
    ctx.fillText(`${i === menu.at ? '▸ ' : ''}${item.label()}`, W / 2, 226 + i * 40);
  });
}

/** For the harness (hub-check): where the game is, and what it is doing. */
AIHub.probe(() => ({
  scene: game.phase === 'title' ? 'title' : game.phase === 'playing' ? 'play' : game.phase === 'over' ? 'over' : 'ready',
  menu: menu.open,
  world: Math.round(world * 1000) / 1000,
  input: { x: Math.round(felt.x * 100) / 100, y: Math.round(felt.y * 100) / 100, sprint: felt.sprint },
}));

connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
