<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Arena — AI Hub session example (versus)</title>
<meta name="description" content="A minimal versus game for the AI Hub Session Protocol: the host runs the arena, everyone chases stars, first to ten wins.">
<meta name="theme-color" content="#1b1530">
<meta name="hub:type" content="Tech demo">
<meta name="hub:players" content="1">
<meta name="hub:session" content="1">
<meta name="hub:session-players" content="2-4">
<meta name="hub:session-mode" content="versus">
<meta name="hub:session-minutes" content="2">
<meta name="hub:session-goal" content="First to ten stars wins">
<meta name="hub:session-howto" content="Move with arrows or WASD, a gamepad stick, or hold a finger down">
<style>
  html, body { margin: 0; height: 100%; background: #1b1530; color: #f3eef7; font: 16px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
<script>
/*! aihub-session 1.1.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.1.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var MAX_BYTES = 16384;
  var RATE_PER_S = 20;
  var BURST = 40;

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var flagged = /[?&]aihub=/.test(String(root.location && root.location.search));

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
  };

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = BURST;
  var refilled = now();

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (Object.prototype.hasOwnProperty.call(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      hub.me = m.me;
      hub.host = m.host;
      hub.isHost = m.me === m.host;
      hub.players = (m.players || []).slice();
      hub.mode = m.mode;
      hub.seed = m.seed >>> 0;
      hub.limitMs = m.limitMs;
      hub.round = m.round;
      if (connecting) connecting.resolve(info());
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    }
  }

  function info() {
    return {
      me: hub.me,
      host: hub.host,
      isHost: hub.isHost,
      players: hub.players.slice(),
      mode: hub.mode,
      seed: hub.seed,
      limitMs: hub.limitMs,
      round: hub.round,
    };
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        hub.active = false;
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded and the player pressed something: call from that input handler. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > MAX_BYTES) {
      warn('send: message over ' + MAX_BYTES + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(BURST, tokens + ((t - refilled) / 1000) * RATE_PER_S);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + RATE_PER_S + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    var a = (hub.seed ^ h) >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  /** Copy the optional highlights (stats, awards) as plain JSON; the hub checks and trims them. */
  function highlights(outcome, fields) {
    for (var i = 0, keys = ['stats', 'awards']; i < keys.length; i++) {
      if (outcome[keys[i]] == null) continue;
      try {
        fields[keys[i]] = JSON.parse(JSON.stringify(outcome[keys[i]]));
      } catch (e) {
        warn(keys[i] + ' is not JSON, left out');
      }
    }
    return fields;
  }

  /** Race mode: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    outcome = outcome || {};
    var fields = {};
    if (isFinite(outcome.time)) fields.time = Number(outcome.time);
    else if (isFinite(outcome.score)) fields.score = Number(outcome.score);
    else return warn('result needs a finite time or score');
    reported = true;
    post('result', highlights(outcome, fields));
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    outcome = outcome || {};
    if (!Array.isArray(outcome.standings)) return warn('finish needs standings');
    reported = true;
    var fields = { standings: outcome.standings };
    if (outcome.scores) fields.scores = outcome.scores;
    if (typeof outcome.won === 'boolean') fields.won = outcome.won;
    post('finish', highlights(outcome, fields));
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</head>
<body>
<canvas id="c" aria-label="Star Arena"></canvas>
<script>
'use strict';
// Star Arena: the smallest honest versus game. The host's copy runs the arena
// (positions, stars, scores) and sends snapshots; every other copy sends its
// input and draws what the host says. First to TARGET stars wins.
const W = 800, H = 600, R = 18, SPEED = 260, TARGET = 10;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const keys = new Set();
let pointer = null;
let audio = null;

addEventListener('keydown', (e) => { keys.add(e.key.toLowerCase()); gesture(); });
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
canvas.addEventListener('pointerdown', (e) => { pointer = e; gesture(); });
canvas.addEventListener('pointermove', (e) => { if (pointer) pointer = e; });
addEventListener('pointerup', () => { pointer = null; });

function beep(freq) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = freq; g.gain.value = 0.05;
  o.connect(g).connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.08);
}

/** The local stick: keys, the first gamepad, or a held pointer. */
function stick(me) {
  let x = 0, y = 0;
  if (keys.has('arrowleft') || keys.has('a')) x -= 1;
  if (keys.has('arrowright') || keys.has('d')) x += 1;
  if (keys.has('arrowup') || keys.has('w')) y -= 1;
  if (keys.has('arrowdown') || keys.has('s')) y += 1;
  const pad = navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;
  if (pad) {
    if (Math.abs(pad.axes[0]) > 0.2) x = pad.axes[0];
    if (Math.abs(pad.axes[1]) > 0.2) y = pad.axes[1];
  }
  if (pointer && me) {
    const p = toWorld(pointer);
    const dx = p.x - me.x, dy = p.y - me.y, d = Math.hypot(dx, dy);
    if (d > 8) { x = dx / d; y = dy / d; }
  }
  const len = Math.hypot(x, y);
  return len > 1 ? { x: x / len, y: y / len } : { x, y };
}

function toWorld(e) {
  const r = canvas.getBoundingClientRect(), s = Math.min(r.width / W, r.height / H);
  return { x: (e.clientX - r.left - (r.width - W * s) / 2) / s, y: (e.clientY - r.top - (r.height - H * s) / 2) / s };
}

// ---- state shared by both modes
const game = {
  phase: 'title',            // title | ready | waiting | playing | over
  players: [],               // {id, name, color, x, y, score, gone}
  star: { x: W / 2, y: H / 2 },
  rng: Math.random,
  message: '',
  standings: null,
};
const inputs = new Map();    // host: the latest stick of every player

function place(players) {
  players.forEach((p, i) => {
    const a = (i / Math.max(players.length, 1)) * Math.PI * 2;
    p.x = W / 2 + Math.cos(a) * 200; p.y = H / 2 + Math.sin(a) * 180;
  });
}
function newStar() {
  game.star = { x: 40 + game.rng() * (W - 80), y: 40 + game.rng() * (H - 80) };
}

/** One step of the arena. Only the host (or a solo player) ever runs it. */
function simulate(dt) {
  for (const p of game.players) {
    if (p.gone) continue;
    const s = inputs.get(p.id) || { x: 0, y: 0 };
    p.x = Math.max(R, Math.min(W - R, p.x + s.x * SPEED * dt));
    p.y = Math.max(R, Math.min(H - R, p.y + s.y * SPEED * dt));
    if (Math.hypot(p.x - game.star.x, p.y - game.star.y) < R + 12) {
      p.score++;
      newStar();
      beep(660);
      if (hub) AIHub.send({ t: 'pick', id: p.id });
    }
  }
}

// ---- solo: the game as it plays on its own
function solo() {
  game.players = [{ id: 0, name: 'You', color: '#f5b700', x: W / 2, y: H / 2, score: 0 }];
  game.phase = 'title';
  game.message = 'Star Arena — press any key or tap to play';
}
let soloEnds = 0;

// ---- hub mode
let hub = null;
let lastSent = 0;

async function connect() {
  const info = await AIHub.connect({ mode: 'versus', seats: [2, 4] });
  if (!info) return solo();
  hub = info;
  game.rng = AIHub.rng('stars');
  game.players = info.players.map((p) => ({ ...p, x: 0, y: 0, score: 0, gone: false }));
  place(game.players);
  newStar();
  game.phase = 'ready';
  game.message = 'Press any key, click or tap when you are ready';
  AIHub.on('start', () => { game.phase = 'playing'; });
  AIHub.on('message', (data, from) => {
    if (hub.isHost && data.t === 'in') inputs.set(from, { x: clamp(data.x), y: clamp(data.y) });
    if (!hub.isHost && data.t === 's') applySnapshot(data);
    if (!hub.isHost && data.t === 'pick') beep(data.id === hub.me ? 660 : 330);
  });
  AIHub.on('leave', ({ id }) => {
    const p = game.players.find((q) => q.id === id);
    if (p) p.gone = true;
    if (hub.isHost && game.phase === 'playing' && game.players.filter((q) => !q.gone).length < 2) finish();
  });
  AIHub.on('time-up', () => { if (hub.isHost) finish(); });
  AIHub.on('end', ({ reason, standings }) => {
    game.phase = 'over';
    game.standings = standings;
    game.message = reason === 'finished' ? 'Round over' : reason === 'sat-out' ? 'You sat this one out' : 'Round cancelled';
  });
}
const clamp = (v) => Math.max(-1, Math.min(1, Number(v) || 0));

function applySnapshot(s) {
  for (const [id, x, y, score] of s.p) {
    const p = game.players.find((q) => q.id === id);
    if (p) { p.tx = x; p.ty = y; p.score = score; }
  }
  game.star = { x: s.s[0], y: s.s[1] };
}

/** Host: standings by score, ties together, best first. */
function finish() {
  if (game.phase === 'over') return;
  const live = game.players.filter((p) => !p.gone).sort((a, b) => b.score - a.score);
  const standings = [];
  for (const p of live) {
    const last = standings[standings.length - 1];
    if (last && last.score === p.score) last.ids.push(p.id);
    else standings.push({ score: p.score, ids: [p.id] });
  }
  const scores = Object.fromEntries(game.players.map((p) => [p.id, p.score]));
  AIHub.finish({ standings: standings.map((g) => g.ids), scores });
  game.phase = 'over';
  game.message = 'Round over';
}

function gesture() {
  if (!audio) {
    try { audio = new AudioContext(); } catch { audio = null; }
  }
  audio?.resume?.().catch(() => {});
  if (hub && game.phase === 'ready') {
    AIHub.ready();
    game.phase = 'waiting';
    game.message = 'Waiting for everyone…';
  } else if (!hub && (game.phase === 'title' || game.phase === 'over')) {
    solo();
    game.phase = 'playing';
    soloEnds = performance.now() + 60_000;
  }
}

// ---- the loop: advance by elapsed time, never pause
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.25);
  last = now;
  const me = game.players.find((p) => p.id === (hub ? hub.me : 0));
  if (game.phase === 'playing') {
    if (!hub) {
      inputs.set(0, stick(me));
      simulate(dt);
      if (now > soloEnds) { game.phase = 'over'; game.message = `Time! ${me.score} stars — press to play again`; }
    } else if (AIHub.time() >= 0) {
      if (hub.isHost) {
        inputs.set(hub.me, stick(me));
        simulate(dt);
        if (game.players.some((p) => p.score >= TARGET)) finish();
        else if (now - lastSent > 66) {
          lastSent = now;
          AIHub.send({ t: 's', p: game.players.filter((p) => !p.gone).map((p) => [p.id, Math.round(p.x), Math.round(p.y), p.score]), s: [Math.round(game.star.x), Math.round(game.star.y)] }, { reliable: false });
        }
      } else {
        if (now - lastSent > 66) {
          lastSent = now;
          const s = stick(me);
          AIHub.send({ t: 'in', x: +s.x.toFixed(2), y: +s.y.toFixed(2) }, { to: hub.host, reliable: false });
        }
        for (const p of game.players) if (p.tx !== undefined) {
          const k = 1 - Math.pow(0.001, dt);
          p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k;
        }
      }
    }
  }
  draw(now);
  requestAnimationFrame(frame);
}

function draw(now) {
  const r = canvas.getBoundingClientRect();
  const dpr = devicePixelRatio || 1;
  if (canvas.width !== Math.round(r.width * dpr) || canvas.height !== Math.round(r.height * dpr)) {
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  }
  const s = Math.min(canvas.width / W, canvas.height / H);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#120e22'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(s, 0, 0, s, (canvas.width - W * s) / 2, (canvas.height - H * s) / 2);
  ctx.fillStyle = '#1b1530'; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#ffd34d';
  ctx.beginPath(); ctx.arc(game.star.x, game.star.y, 10 + Math.sin(now / 150) * 2, 0, Math.PI * 2); ctx.fill();

  ctx.textAlign = 'center';
  for (const p of game.players) {
    if (p.gone) continue;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f3eef7'; ctx.font = '14px system-ui';
    ctx.fillText(`${p.name} ${p.score}`, p.x, p.y - R - 8);
  }

  ctx.font = '22px system-ui';
  ctx.fillStyle = '#f3eef7';
  if (hub && game.phase === 'playing' && AIHub.time() < 0) {
    ctx.font = 'bold 96px system-ui';
    ctx.fillText(String(Math.ceil(-AIHub.time() / 1000)), W / 2, H / 2 + 32);
  } else if (game.phase !== 'playing') {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, H / 2 - 120, W, 240);
    ctx.fillStyle = '#f3eef7';
    ctx.fillText(game.message, W / 2, H / 2 - 70);
    const rows = game.standings
      ? game.standings.flatMap((ids, place) => ids.map((id) => [place + 1, game.players.find((p) => p.id === id)]))
      : game.players.map((p) => [null, p]);
    ctx.font = '18px system-ui';
    rows.slice(0, 4).forEach(([place, p], i) => {
      if (!p) return;
      ctx.fillStyle = p.color;
      ctx.fillText(`${place ? place + '. ' : ''}${p.name}${hub && p.id === hub.me ? ' (you)' : ''} — ${p.score}`, W / 2, H / 2 - 30 + i * 28);
    });
  }
}

connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
