<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comet Dash — AI Hub session example (race)</title>
<meta name="description" content="A minimal race for the AI Hub Session Protocol: everyone runs the same seeded course on their own device and sees the others as ghosts.">
<meta name="theme-color" content="#0f1b2e">
<meta name="hub:type" content="Tech demo">
<meta name="hub:players" content="1">
<meta name="hub:session" content="1">
<meta name="hub:session-players" content="2-4">
<meta name="hub:session-mode" content="race">
<meta name="hub:session-minutes" content="1">
<meta name="hub:session-goal" content="Fastest to the end of the course wins">
<meta name="hub:session-howto" content="Steer: ← →, A D or a stick · boost: Space or Cross · or drag a finger">
<style>
  html, body { margin: 0; height: 100%; background: #0f1b2e; color: #eef3fb; font: 16px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
<script>
/*! aihub-session 1.2.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.2.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var MAX_BYTES = 16384;
  var RATE_PER_S = 20;
  var BURST = 40;

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var flagged = /[?&]aihub=/.test(String(root.location && root.location.search));

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
  };

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = BURST;
  var refilled = now();
  var probeFn = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (Object.prototype.hasOwnProperty.call(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      hub.me = m.me;
      hub.host = m.host;
      hub.isHost = m.me === m.host;
      hub.players = (m.players || []).slice();
      hub.mode = m.mode;
      hub.seed = m.seed >>> 0;
      hub.limitMs = m.limitMs;
      hub.round = m.round;
      hub.splash = m.splash === true;
      if (connecting) connecting.resolve(info());
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    }
  }

  function info() {
    return {
      me: hub.me,
      host: hub.host,
      isHost: hub.isHost,
      players: hub.players.slice(),
      mode: hub.mode,
      seed: hub.seed,
      limitMs: hub.limitMs,
      round: hub.round,
      splash: hub.splash,
    };
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        hub.active = false;
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > MAX_BYTES) {
      warn('send: message over ' + MAX_BYTES + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(BURST, tokens + ((t - refilled) / 1000) * RATE_PER_S);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + RATE_PER_S + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    var a = (hub.seed ^ h) >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  /** Copy the optional highlights (stats, awards) as plain JSON; the hub checks and trims them. */
  function highlights(outcome, fields) {
    for (var i = 0, keys = ['stats', 'awards']; i < keys.length; i++) {
      if (outcome[keys[i]] == null) continue;
      try {
        fields[keys[i]] = JSON.parse(JSON.stringify(outcome[keys[i]]));
      } catch (e) {
        warn(keys[i] + ' is not JSON, left out');
      }
    }
    return fields;
  }

  /** Race mode: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    outcome = outcome || {};
    var fields = {};
    if (isFinite(outcome.time)) fields.time = Number(outcome.time);
    else if (isFinite(outcome.score)) fields.score = Number(outcome.score);
    else return warn('result needs a finite time or score');
    reported = true;
    post('result', highlights(outcome, fields));
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    outcome = outcome || {};
    if (!Array.isArray(outcome.standings)) return warn('finish needs standings');
    reported = true;
    var fields = { standings: outcome.standings };
    if (outcome.scores) fields.scores = outcome.scores;
    if (typeof outcome.won === 'boolean') fields.won = outcome.won;
    post('finish', highlights(outcome, fields));
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</head>
<body>
<canvas id="c" aria-label="Comet Dash"></canvas>
<script>
'use strict';
// Comet Dash: the smallest honest race. Every copy runs its own comet down the
// same course (built from the session seed), sends ghost samples ten times a
// second, and draws the others as ghosts. Each copy reports its own result;
// the hub ranks them.
const W = 600, H = 800, LENGTH = 9000, SPEED = 330, R = 14, ROW = 260;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const keys = new Set();
let pointerX = null;
let audio = null;

addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return toggleMenu();
  if (menu.open) return menuKey(e.key);
  keys.add(e.key.toLowerCase());
  gesture();
});
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));

// ---- the controller, in the browser's standard mapping (a PS5 DualSense:
// Cross 0, Circle 1, Create 8, Options 9, D-pad 12-15, left stick axis 0).
// Buttons count on the frame they go down.
const PAD = { cross: 0, circle: 1, create: 8, options: 9, up: 12, down: 13, left: 14, right: 15 };
let pad = null, padNow = [], padWas = [];
function readPad() {
  pad = navigator.getGamepads ? [...navigator.getGamepads()].find((p) => p && p.connected) || null : null;
  padWas = padNow;
  padNow = pad ? pad.buttons.map((b) => b.pressed) : [];
  // Create + Options is the hub's: it opens the hub's corner bar, so Options alone opens the menu.
  if (pressed(PAD.options) && !padNow[PAD.create]) return toggleMenu();
  if (menu.open) {
    if (pressed(PAD.up)) menuKey('ArrowUp');
    if (pressed(PAD.down)) menuKey('ArrowDown');
    if (pressed(PAD.cross)) menuKey('Enter');
    if (pressed(PAD.circle)) toggleMenu();
  } else if (padNow.some((b, i) => b && !padWas[i] && i !== PAD.create && i !== PAD.options)) gesture();
}
const pressed = (b) => !!padNow[b] && !padWas[b];

// ---- the settings menu: Esc or Options, over the running race. It never
// pauses anything; while it is open your comet just flies straight.
let muted = false;
const menu = {
  open: false,
  at: 0,
  items: [
    { label: () => `Sound: ${muted ? 'off' : 'on'}`, act: () => { muted = !muted; } },
    { label: () => 'Back to the race', act: () => toggleMenu() },
  ],
};
function toggleMenu() { menu.open = !menu.open; menu.at = 0; keys.clear(); }
function menuKey(key) {
  if (key === 'ArrowUp' || key === 'w') menu.at = (menu.at + menu.items.length - 1) % menu.items.length;
  if (key === 'ArrowDown' || key === 's') menu.at = (menu.at + 1) % menu.items.length;
  if (key === 'Enter' || key === ' ') menu.items[menu.at].act();
}
canvas.addEventListener('pointerdown', (e) => { pointerX = e.clientX; gesture(); });
canvas.addEventListener('pointermove', (e) => { if (pointerX !== null) pointerX = e.clientX; });
addEventListener('pointerup', () => { pointerX = null; });

function beep(freq) {
  if (!audio || muted) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = freq; g.gain.value = 0.05;
  o.connect(g).connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.1);
}

/** Rocks in rows, the same on every device: built only from integers off the seeded generator. */
function course(rng) {
  const rocks = [];
  for (let y = 600; y < LENGTH - 200; y += ROW) {
    const gaps = 1 + Math.floor(rng() * 2);
    const lanes = [0, 1, 2, 3, 4];
    for (let i = 0; i < gaps; i++) lanes.splice(Math.floor(rng() * lanes.length), 1);
    for (const lane of lanes) if (rng() < 0.7) rocks.push({ x: 60 + lane * 120, y });
  }
  return rocks;
}

const run = {
  phase: 'title',     // title | ready | waiting | racing | done | over
  x: W / 2, d: 0, stun: 0,
  rocks: course(Math.random),
  finishedAt: null,
  message: 'Comet Dash — press any key or tap to race',
};
const ghosts = new Map();   // id -> {x, d, name, color, done}
let hub = null;
let soloStart = 0;
let lastSent = 0;
let world = 0;   // seconds this copy has raced: the harness watches it
let felt = 0;    // the local steering as last read
let boost = false;   // Space or Cross held: a little faster

function steer() {
  if (menu.open) return 0;
  let x = 0;
  if (keys.has('arrowleft') || keys.has('a')) x -= 1;
  if (keys.has('arrowright') || keys.has('d')) x += 1;
  if (pad && Math.abs(pad.axes[0]) > 0.2) x = pad.axes[0];
  if (padNow[PAD.left]) x = -1;
  if (padNow[PAD.right]) x = 1;
  if (pointerX !== null) {
    const r = canvas.getBoundingClientRect();
    const target = ((pointerX - r.left) / r.width) * W;
    x = Math.max(-1, Math.min(1, (target - run.x) / 40));
  }
  return x;
}

async function connect() {
  const info = await AIHub.connect({ mode: 'race', seats: [2, 4] });
  if (!info) return;
  hub = info;
  run.rocks = course(AIHub.rng('course'));
  for (const p of info.players) if (p.id !== info.me) ghosts.set(p.id, { ...p, x: W / 2, d: 0, done: null });
  if (info.splash) {
    // The hub's splash collects everyone's ready: ready up as soon as the course is built.
    run.phase = 'waiting';
    run.message = 'Get ready…';
    AIHub.ready();
  } else {
    run.phase = 'ready';
    run.message = 'Press any key, click or tap when you are ready';
  }
  AIHub.on('start', () => { run.phase = 'racing'; unlockAudio(); });
  AIHub.on('message', (data, from) => {
    const g = ghosts.get(from);
    if (!g) return;
    if (data.t === 'g') { g.tx = data.x; g.td = data.d; }
    if (data.t === 'done') { g.done = data.time; beep(330); }
  });
  AIHub.on('leave', ({ id }) => ghosts.delete(id));
  AIHub.on('time-up', () => {
    if (run.phase === 'racing') AIHub.result({ score: Math.floor(run.d) });
  });
  AIHub.on('end', ({ reason, standings }) => {
    run.phase = 'over';
    run.standings = standings;
    run.message = reason === 'finished' ? 'Race over' : reason === 'sat-out' ? 'You sat this one out' : 'Race cancelled';
  });
}

function unlockAudio() {
  if (!audio) {
    try { audio = new AudioContext(); } catch { audio = null; }
  }
  audio?.resume?.().catch(() => {});
}

function gesture() {
  unlockAudio();
  if (hub && run.phase === 'ready') {
    AIHub.ready();
    run.phase = 'waiting';
    run.message = 'Waiting for everyone…';
  } else if (!hub && (run.phase === 'title' || run.phase === 'over')) {
    Object.assign(run, { phase: 'racing', x: W / 2, d: 0, stun: 0, rocks: course(Math.random), finishedAt: null });
    soloStart = performance.now();
  }
}

/** Race time: the hub's shared clock in a session, the local one alone. */
const raceTime = () => (hub ? AIHub.time() : performance.now() - soloStart);

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.25);
  last = now;
  readPad();
  felt = steer();
  boost = !menu.open && (keys.has(' ') || !!padNow[PAD.cross] || !!padNow[7]);
  if (run.phase === 'racing' && raceTime() >= 0) {
    world += dt;
    run.x = Math.max(R + 20, Math.min(W - R - 20, run.x + felt * 320 * dt));
    if (run.stun > 0) run.stun -= dt;
    else run.d += SPEED * (boost ? 1.3 : 1) * dt;
    for (const rock of run.rocks) {
      if (Math.abs(rock.y - run.d) < 18 && Math.abs(rock.x - run.x) < 40 && run.stun <= 0) {
        run.stun = 0.7; run.d -= 20; beep(140);
      }
    }
    if (run.d >= LENGTH) {
      run.d = LENGTH;
      run.finishedAt = Math.round(raceTime());
      run.phase = 'done';
      run.message = `Finished in ${(run.finishedAt / 1000).toFixed(2)} s`;
      beep(880);
      if (hub) {
        AIHub.result({ time: run.finishedAt });
        AIHub.send({ t: 'done', time: run.finishedAt });
        run.message += ' — waiting for the others';
      }
    }
  }
  if (hub && (run.phase === 'racing' || run.phase === 'done') && now - lastSent > 100) {
    lastSent = now;
    AIHub.send({ t: 'g', x: Math.round(run.x), d: Math.round(run.d) }, { reliable: false });
  }
  for (const g of ghosts.values()) if (g.tx !== undefined) {
    const k = 1 - Math.pow(0.002, dt);
    g.x += (g.tx - g.x) * k; g.d += (g.td - g.d) * k;
  }
  draw();
  requestAnimationFrame(frame);
}

function draw() {
  const r = canvas.getBoundingClientRect();
  const dpr = devicePixelRatio || 1;
  if (canvas.width !== Math.round(r.width * dpr) || canvas.height !== Math.round(r.height * dpr)) {
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  }
  const s = Math.min(canvas.width / W, canvas.height / H);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#081120'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(s, 0, 0, s, (canvas.width - W * s) / 2, (canvas.height - H * s) / 2);
  ctx.fillStyle = '#0f1b2e'; ctx.fillRect(0, 0, W, H);

  const screenY = (d) => H - 160 - (d - run.d);
  ctx.fillStyle = '#5b6b86';
  for (const rock of run.rocks) {
    const y = screenY(rock.y);
    if (y > -40 && y < H + 40) ctx.fillRect(rock.x - 34, y - 12, 68, 24);
  }
  const fy = screenY(LENGTH);
  if (fy > -10 && fy < H) { ctx.fillStyle = '#eef3fb'; ctx.fillRect(0, fy - 3, W, 6); }

  ctx.textAlign = 'center';
  ctx.font = '13px system-ui';
  for (const g of ghosts.values()) {
    const y = screenY(g.d);
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = g.color;
    ctx.beginPath(); ctx.arc(g.x, Math.max(20, Math.min(H - 20, y)), R, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillText(g.name, g.x, Math.max(20, Math.min(H - 20, y)) - R - 6);
  }
  const mine = hub ? hub.players.find((p) => p.id === hub.me) : null;
  ctx.fillStyle = run.stun > 0 ? '#ffffff' : (mine?.color || '#f5b700');
  ctx.beginPath(); ctx.arc(run.x, H - 160, R, 0, Math.PI * 2); ctx.fill();

  // progress strip: everyone's distance down the course
  const bar = (d, color) => { ctx.fillStyle = color; ctx.fillRect(W - 14, H - 20 - (H - 40) * Math.min(1, d / LENGTH), 10, 4); };
  ctx.fillStyle = '#1d2c45'; ctx.fillRect(W - 14, 20, 10, H - 40);
  for (const g of ghosts.values()) bar(g.d, g.color);
  bar(run.d, mine?.color || '#f5b700');

  ctx.fillStyle = '#eef3fb';
  ctx.font = '20px system-ui';
  if (run.phase === 'racing') {
    const t = raceTime();
    if (t < 0) { ctx.font = 'bold 96px system-ui'; ctx.fillText(String(Math.ceil(-t / 1000)), W / 2, H / 2); }
    else ctx.fillText(`${(t / 1000).toFixed(1)} s`, W / 2, 34);
  } else {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, H / 2 - 130, W, 260);
    ctx.fillStyle = '#eef3fb';
    ctx.fillText(run.message, W / 2, H / 2 - 80);
    if (run.standings && hub) {
      ctx.font = '18px system-ui';
      let row = 0;
      run.standings.forEach((ids, place) => ids.forEach((id) => {
        const p = hub.players.find((q) => q.id === id) || { name: `Player ${id + 1}`, color: '#eef3fb' };
        ctx.fillStyle = p.color;
        ctx.fillText(`${place + 1}. ${p.name}${id === hub.me ? ' (you)' : ''}`, W / 2, H / 2 - 40 + row++ * 28);
      }));
    }
  }
  if (menu.open) drawMenu();
}

function drawMenu() {
  ctx.fillStyle = 'rgba(4,10,20,.85)'; ctx.fillRect(W / 2 - 160, 250, 320, 70 + menu.items.length * 40);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#eef3fb'; ctx.font = 'bold 22px system-ui';
  ctx.fillText('Settings', W / 2, 286);
  ctx.font = '18px system-ui';
  menu.items.forEach((item, i) => {
    ctx.fillStyle = i === menu.at ? '#ffd34d' : '#eef3fb';
    ctx.fillText(`${i === menu.at ? '▸ ' : ''}${item.label()}`, W / 2, 326 + i * 40);
  });
}

/** For the harness (hub-check): where the game is, and what it is doing. */
AIHub.probe(() => ({
  scene: run.phase === 'title' ? 'title' : run.phase === 'racing' || run.phase === 'done' ? 'play' : run.phase === 'over' ? 'over' : 'ready',
  menu: menu.open,
  world: Math.round(world * 1000) / 1000,
  input: { steer: Math.round(felt * 100) / 100, boost },
}));

connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
