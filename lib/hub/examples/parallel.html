<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starfall — AI Hub session example (side by side)</title>
<meta name="description" content="A minimal side-by-side game for the AI Hub Session Protocol: everyone plays their own one-minute run of the same falling stars, and the hub keeps the score.">
<meta name="theme-color" content="#15103a">
<meta name="hub:type" content="Tech demo">
<meta name="hub:players" content="1">
<meta name="hub:session" content="1">
<meta name="hub:session-players" content="1-4">
<meta name="hub:session-mode" content="parallel">
<meta name="hub:session-minutes" content="1">
<meta name="hub:session-goal" content="Most points in one minute: catch stars, dodge rocks">
<meta name="hub:session-howto" content="Move: ← →, A D or a stick · dash: Space or Cross · or drag a finger">
<style>
  html, body { margin: 0; height: 100%; background: #15103a; color: #eef3fb; font: 16px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
<script>
/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  var realStores = {};
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        realStores[stores[s]] = Object.getOwnPropertyDescriptor(root, stores[s]) || null;
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  if (hub.active && seedArg) {
    Math.random = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top.
  var realFullscreen = null;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    realFullscreen = { request: proto.requestFullscreen, webkit: proto.webkitRequestFullscreen };
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
  }

  /** No hub after all: the page gets its own storage and Math.random back. */
  function standAlone() {
    hub.active = false;
    for (var name in realStores) {
      try {
        if (realStores[name]) Object.defineProperty(root, name, realStores[name]);
        else delete root[name];
      } catch (e) {}
    }
    Math.random = realRandom;
    hub.seeded = false;
    if (realFullscreen) {
      root.Element.prototype.requestFullscreen = realFullscreen.request;
      root.Element.prototype.webkitRequestFullscreen = realFullscreen.webkit;
      delete root.document.exitFullscreen;
      delete root.document.webkitExitFullscreen;
    }
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /** The whole outcome as plain JSON: the hub checks and trims it, so new optional fields need no new client. */
  function outcomeOf(outcome) {
    var copy = json(outcome || {});
    if (!copy || typeof copy !== 'object' || Array.isArray(copy)) {
      warn('the outcome is not a plain JSON object');
      return null;
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</head>
<body>
<canvas id="c" aria-label="Starfall"></canvas>
<script>
'use strict';
// Starfall: the smallest honest side-by-side game. Every copy plays its own
// one-minute run, alone, with no game traffic at all. The stars come from
// plain Math.random, as in most games; in a side-by-side session the hub's
// client seeds Math.random before this script runs, so every copy gets the
// same stars. The game tells the hub its score once a second (progress) and
// reports once at the end (result); the hub draws the scoreboard and ranks.
const W = 600, H = 800, RUN_MS = 60_000, R = 13, CATCHER = 64;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const keys = new Set();
let pointerX = null;
let audio = null;

addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return toggleMenu();
  if (menu.open) return menuKey(e.key);
  keys.add(e.key.toLowerCase());
  gesture();
});
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));

// ---- the controller, in the browser's standard mapping (a PS5 DualSense:
// Cross 0, Circle 1, Create 8, Options 9, D-pad 12-15, left stick axis 0).
// Buttons count on the frame they go down.
const PAD = { cross: 0, circle: 1, create: 8, options: 9, up: 12, down: 13, left: 14, right: 15 };
let pad = null, padNow = [], padWas = [];
function readPad() {
  pad = navigator.getGamepads ? [...navigator.getGamepads()].find((p) => p && p.connected) || null : null;
  padWas = padNow;
  padNow = pad ? pad.buttons.map((b) => b.pressed) : [];
  // Create + Options is the hub's: it opens the hub's corner bar, so Options alone opens the menu.
  if (pressed(PAD.options) && !padNow[PAD.create]) return toggleMenu();
  if (menu.open) {
    if (pressed(PAD.up)) menuKey('ArrowUp');
    if (pressed(PAD.down)) menuKey('ArrowDown');
    if (pressed(PAD.cross)) menuKey('Enter');
    if (pressed(PAD.circle)) toggleMenu();
  } else if (padNow.some((b, i) => b && !padWas[i] && i !== PAD.create && i !== PAD.options)) gesture();
}
const pressed = (b) => !!padNow[b] && !padWas[b];

// ---- the settings menu: Esc or Options, over the running game. The run is
// on the clock, so it keeps falling while the menu is open.
let muted = false;
const menu = {
  open: false,
  at: 0,
  items: [
    { label: () => `Sound: ${muted ? 'off' : 'on'}`, act: () => { muted = !muted; } },
    { label: () => 'Back to the game', act: () => toggleMenu() },
  ],
};
function toggleMenu() { menu.open = !menu.open; menu.at = 0; keys.clear(); }
function menuKey(key) {
  if (key === 'ArrowUp' || key === 'w') menu.at = (menu.at + menu.items.length - 1) % menu.items.length;
  if (key === 'ArrowDown' || key === 's') menu.at = (menu.at + 1) % menu.items.length;
  if (key === 'Enter' || key === ' ') menu.items[menu.at].act();
}
canvas.addEventListener('pointerdown', (e) => { pointerX = e.clientX; gesture(); });
canvas.addEventListener('pointermove', (e) => { if (pointerX !== null) pointerX = e.clientX; });
addEventListener('pointerup', () => { pointerX = null; });

function beep(freq) {
  if (!audio || muted) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = freq; g.gain.value = 0.05;
  o.connect(g).connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.1);
}

const run = {
  phase: 'title',     // title | waiting | playing | done | over
  x: W / 2, score: 0, stars: 0, combo: 0, best: 0, stun: 0,
  falling: [], nextAt: 0, ms: 0,
  message: 'Starfall — press any key or tap to play',
};
let hub = null;
let soloStart = 0;
let lastProgress = -1;
let world = 0;   // seconds this copy has played: the harness watches it
let felt = 0;    // the local steering as last read
let dash = false;   // Space or Cross held: the catcher moves faster

/** The next thing to fall, from Math.random: a star, now and then a gold one or a rock. */
function spawn() {
  const roll = Math.random();
  run.falling.push({
    x: 30 + Math.random() * (W - 60),
    y: -20,
    speed: 220 + Math.random() * 160,
    kind: roll < 0.12 ? 'rock' : roll < 0.22 ? 'gold' : 'star',
  });
  run.nextAt += 250 + Math.random() * 450;
}

function steer() {
  if (menu.open) return 0;
  let x = 0;
  if (keys.has('arrowleft') || keys.has('a')) x -= 1;
  if (keys.has('arrowright') || keys.has('d')) x += 1;
  if (pad && Math.abs(pad.axes[0]) > 0.2) x = pad.axes[0];
  if (padNow[PAD.left]) x = -1;
  if (padNow[PAD.right]) x = 1;
  if (pointerX !== null) {
    const r = canvas.getBoundingClientRect();
    const target = ((pointerX - r.left) / r.width) * W;
    x = Math.max(-1, Math.min(1, (target - run.x) / 40));
  }
  return x;
}

async function connect() {
  const info = await AIHub.connect({ mode: 'parallel', seats: [1, 4] });
  if (!info) return;
  hub = info;
  // Side by side: no title, no ready prompt of our own. Ready as soon as we can play.
  run.phase = 'waiting';
  run.message = 'Get ready…';
  AIHub.ready();
  AIHub.on('start', () => { begin(); unlockAudio(); });
  AIHub.on('time-up', () => {
    if (run.phase === 'playing') finish();
  });
  AIHub.on('end', ({ reason, standings }) => {
    run.phase = 'over';
    run.standings = standings;
    run.message = reason === 'finished' ? 'Round over' : reason === 'sat-out' ? 'You sat this one out' : 'Round cancelled';
  });
}

function begin() {
  Object.assign(run, { phase: 'playing', x: W / 2, score: 0, stars: 0, combo: 0, best: 0, stun: 0, falling: [], nextAt: 0, ms: 0 });
  soloStart = performance.now();
}

/** The run is over: report it once. */
function finish() {
  run.phase = 'done';
  run.message = `${run.score} points — ${run.stars} stars`;
  beep(880);
  if (!hub) return;
  const awards = run.best >= 12 ? [{ title: 'Star streak', detail: `${run.best} in a row` }] : [];
  AIHub.result({ score: run.score, stats: { stars: run.stars, 'best streak': run.best }, awards });
  run.message += ' — waiting for the others';
}

function unlockAudio() {
  if (!audio) {
    try { audio = new AudioContext(); } catch { audio = null; }
  }
  audio?.resume?.().catch(() => {});
}

function gesture() {
  unlockAudio();
  if (!hub && (run.phase === 'title' || run.phase === 'done')) begin();
}

/** Run time: the hub's shared clock in a session, the local one alone. */
const runTime = () => (hub ? AIHub.time() : performance.now() - soloStart);

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.25);
  last = now;
  readPad();
  felt = steer();
  dash = !menu.open && (keys.has(' ') || !!padNow[PAD.cross] || !!padNow[7]);
  const t = runTime();
  if (run.phase === 'playing' && t >= 0) {
    world += dt;
    if (run.stun > 0) run.stun -= dt;
    else run.x = Math.max(CATCHER / 2, Math.min(W - CATCHER / 2, run.x + felt * (dash ? 700 : 420) * dt));
    // Spawns follow the run's clock, so every copy draws the same numbers in the same order.
    while (run.nextAt <= t && run.nextAt < RUN_MS) spawn();
    for (const f of run.falling) {
      f.y += f.speed * dt;
      if (f.y >= H - 110 && f.y <= H - 70 && Math.abs(f.x - run.x) <= CATCHER / 2 + R) {
        f.gone = true;
        if (f.kind === 'rock') { run.stun = 0.8; run.combo = 0; beep(140); continue; }
        run.combo++;
        run.best = Math.max(run.best, run.combo);
        run.stars++;
        run.score += (f.kind === 'gold' ? 50 : 10) * (1 + Math.floor(run.combo / 5));
        beep(f.kind === 'gold' ? 990 : 660);
      } else if (f.y > H) {
        f.gone = true;
        if (f.kind !== 'rock') run.combo = 0;   // a star that got away ends the streak
      }
    }
    run.falling = run.falling.filter((f) => !f.gone);
    // The hub draws the scoreboard: tell it the score about once a second.
    const second = Math.floor(t / 1000);
    if (hub && second !== lastProgress) {
      lastProgress = second;
      AIHub.progress?.({ score: run.score, label: `${run.stars} stars` });
    }
    if (t >= RUN_MS) finish();
  }
  draw(t);
  requestAnimationFrame(frame);
}

function draw(t) {
  const r = canvas.getBoundingClientRect();
  const dpr = devicePixelRatio || 1;
  if (canvas.width !== Math.round(r.width * dpr) || canvas.height !== Math.round(r.height * dpr)) {
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  }
  const s = Math.min(canvas.width / W, canvas.height / H);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b0820'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(s, 0, 0, s, (canvas.width - W * s) / 2, (canvas.height - H * s) / 2);
  ctx.fillStyle = '#15103a'; ctx.fillRect(0, 0, W, H);

  for (const f of run.falling) {
    ctx.fillStyle = f.kind === 'rock' ? '#6b6585' : f.kind === 'gold' ? '#ffd34d' : '#eef3fb';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.kind === 'gold' ? R + 3 : R, 0, Math.PI * 2); ctx.fill();
  }
  const mine = hub ? hub.players.find((p) => p.id === hub.me) : null;
  ctx.fillStyle = run.stun > 0 ? '#ffffff' : (mine?.color || '#f5b700');
  ctx.fillRect(run.x - CATCHER / 2, H - 96, CATCHER, 14);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#eef3fb';
  ctx.font = '20px system-ui';
  if (run.phase === 'playing') {
    if (t < 0) { ctx.font = 'bold 96px system-ui'; ctx.fillText(String(Math.ceil(-t / 1000)), W / 2, H / 2); }
    else {
      ctx.fillText(`${run.score}   ·   ${Math.max(0, Math.ceil((RUN_MS - t) / 1000))} s`, W / 2, 34);
      if (run.combo >= 5) { ctx.font = '16px system-ui'; ctx.fillText(`streak ${run.combo}`, W / 2, 60); }
    }
  } else {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, H / 2 - 130, W, 260);
    ctx.fillStyle = '#eef3fb';
    ctx.fillText(run.message, W / 2, H / 2 - 80);
    if (run.standings && hub) {
      ctx.font = '18px system-ui';
      let row = 0;
      run.standings.forEach((ids, place) => ids.forEach((id) => {
        const p = hub.players.find((q) => q.id === id) || { name: `Player ${id + 1}`, color: '#eef3fb' };
        ctx.fillStyle = p.color;
        ctx.fillText(`${place + 1}. ${p.name}${id === hub.me ? ' (you)' : ''}`, W / 2, H / 2 - 40 + row++ * 28);
      }));
    }
  }
  if (menu.open) drawMenu();
}

function drawMenu() {
  ctx.fillStyle = 'rgba(4,4,20,.85)'; ctx.fillRect(W / 2 - 160, 250, 320, 70 + menu.items.length * 40);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#eef3fb'; ctx.font = 'bold 22px system-ui';
  ctx.fillText('Settings', W / 2, 286);
  ctx.font = '18px system-ui';
  menu.items.forEach((item, i) => {
    ctx.fillStyle = i === menu.at ? '#ffd34d' : '#eef3fb';
    ctx.fillText(`${i === menu.at ? '▸ ' : ''}${item.label()}`, W / 2, 326 + i * 40);
  });
}

/** For the harness (hub-check): where the game is, and what it is doing. */
AIHub.probe(() => ({
  scene: run.phase === 'title' ? 'title' : run.phase === 'playing' || run.phase === 'done' ? 'play' : run.phase === 'over' ? 'over' : 'ready',
  menu: menu.open,
  world: Math.round(world * 1000) / 1000,
  input: { steer: Math.round(felt * 100) / 100, dash },
}));

connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
