<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f0">
  <meta name="description" content="Good Company — a cozy, non-explicit life and small-business sim in a little isometric town. Screen requests, plan public dates, keep your boundaries, and build a life with room in it.">
  <title>Good Company — a little life, a big possibility</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='16' fill='%23375c48'/%3E%3Ctext x='30' y='44' font-family='Georgia' font-style='italic' font-size='30' fill='%23f9faf1' text-anchor='middle'%3Egc%3C/text%3E%3Ctext x='50' y='22' font-family='Georgia' font-size='20' fill='%23d49764' text-anchor='middle'%3E%E2%9C%B3%3C/text%3E%3C/svg%3E">
  <!-- The shared 3D stack. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/lib/three/three.webgpu.js",
      "three/webgpu": "/lib/three/three.webgpu.js",
      "three/tsl": "/lib/three/three.tsl.js",
      "three/addons/": "/lib/three/addons/",
      "kit/": "/lib/kit/"
    }
  }
  </script>
  <link rel="modulepreload" href="/lib/three/three.core.js" />
  <link rel="modulepreload" href="/lib/three/three.webgpu.js" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-action="nav" data-tab="today" aria-label="Good Company home"><span class="brand-mark">gc<span>✳</span></span><span>good company<span class="brand-period">.</span><small>A LITTLE LIFE SIM</small></span></a>
    <div class="top-stats" id="top-stats"></div>
    <div class="header-actions"><button class="icon-btn" data-action="save" title="Save game" aria-label="Save game" data-icon="save"></button><button class="icon-btn" data-action="pause" title="Pause menu (P)" aria-label="Pause menu" data-icon="pause"></button><button class="icon-btn" data-action="help" title="How to play" aria-label="How to play" data-icon="help"></button><button class="profile-mini" data-action="profile" id="profile-mini" aria-label="Character and settings"></button></div>
  </header>
  <nav class="rail" aria-label="Game sections" id="rail"></nav>
  <main class="game-layout">
    <section class="world" id="world" aria-label="Interactive isometric neighborhood">
      <canvas id="renderCanvas" tabindex="0" aria-label="Town map. Click or tap to walk. Use WASD or the left stick to move, Q and E to turn the camera, F to interact."></canvas>
      <div class="world-heading"><div class="eyebrow"><span class="live-dot"></span> YOUR LITTLE CORNER OF THE WORLD</div><h1>Life looks good from here<span>.</span></h1><button class="region-link" data-action="regions" id="region-link"></button></div>
      <div class="time-box" id="time-box"></div>
      <div id="world-labels" class="world-labels"></div>
      <div class="world-event" id="world-event"></div>
      <div class="camera-tools"><button class="icon-btn" data-action="rotate" data-value="-1" title="Rotate left (Q)" aria-label="Rotate left" data-icon="rotate-left"></button><button class="icon-btn" data-action="homecamera" title="Reset camera (Home)" aria-label="Reset camera" data-icon="compass"></button><button class="icon-btn" data-action="rotate" data-value="1" title="Rotate right (E)" aria-label="Rotate right" data-icon="rotate-right"></button><span></span><button class="icon-btn" data-action="zoom" data-value="-1" title="Zoom out (−)" aria-label="Zoom out" data-icon="minus"></button><button class="icon-btn" data-action="zoom" data-value="1" title="Zoom in (+)" aria-label="Zoom in" data-icon="plus"></button></div>
      <div class="renderer-note" id="renderer-note"></div>
      <div class="walk-hint" id="walk-hint">CLICK TO WANDER <span>·</span> WASD TO WALK <span>·</span> F TO INTERACT</div>
      <section class="character-hud" id="character-hud" aria-label="Character wellbeing"></section>
    </section>
    <aside class="sidebar" id="sidebar" aria-label="Management panel"></aside>
  </main>
  <div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>
  <div class="modal-shade" id="modal-shade" hidden><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"></section></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script type="module" src="src/main.js"></script>
</body>
</html>
