================================================================================

## Source Information
- Date: 2026-10-27 16:37
- Source: Mario Kart 64 for N64
- Game Title: Flash-O-Kart 64 (FlashOKart64)
- Tech: Three.js R180 (0.180.0) WebGPU Renderer + TSL (Three Shading Language), no WebGL fallback, @dimforge/rapier3d-compat 0.19.3, Web Audio API procedural N64 synth, Gamepad API
- Art Direction: Stylized Cel-Shaded Toon Look (TSL stepped diffuse/specular/rim lighting + TSL BackSide inverted-hull ink outlines)
- Animation: Procedural hierarchical joint & transform animation (kart suspension pitch/roll/hop squash-and-stretch, wheel spin & steering, driver leaning/steering/cheering, spin-out/flip/shrink hit reactions, floating item boxes, Lakitu rescue rig)
- Testing: Lightweight headless Playwright WebGPU verification (console/pageerror assertions, RenderTarget pixel readback for split-screen viewports, state machine transitions, input/settings checks; no screenshots, visual review, or subagents)
- Environment: Antigravity CLI (headless); Linux; Chromium WebGPU headless
- Model: Google, gemini-4-argon, reasoning effort high
- Usage: unknown (estimated API cost in USD, token count, and session time not exposed to runtime environment)

## Testing Feedback
- How many issues did testing catch?: 5 issues caught during lightweight automated checks.
- How many would be considered critical issues / game breaking?: 3 critical issues (1: WebGPURenderer split-screen color clearing behavior where scene.background triggers a full-attachment WebGPU loadOp clear that wipes previous viewports unless scene.background is null and a per-camera skybox mesh is used with autoClear = false; 2: WebGPURenderer top-left Y=0 viewport/scissor origin vs WebGL bottom-left origin; 3: Headless Linux/WSL2 WebGPU canvas swapchain interop requiring Vulkan ANGLE flags and TSL node material caching across course reloads). The other 2 were minor (navigator.gpu requiring a localhost secure context rather than about:blank, and Rapier 0.19.3 init({}) expecting an options object to avoid deprecation logging).
- What was the most helpful test you ran?: Reading back split-screen RenderTarget pixels via renderer.readRenderTargetPixelsAsync() and running a full state-machine transition test across all 4 courses, 4-player split-screen, 12 items, ghost replay, and attract mode in headless WebGPU.
- What was the least helpful test you ran?: Checking navigator.gpu on about:blank before routing through http://localhost, since Chromium hides navigator.gpu on non-secure about:blank pages.

## Engine Feedback
- What did you like most about the engine?: Three.js r180 TSL (Three Shading Language) makes authoring custom WebGPU node shaders—like stepped cel-shading, view-space rim highlights, animated rainbow road bands, and vertex-extruded BackSide ink outlines—clean, composable, and free of raw WGSL boilerplate.
- Did you get stuck or guess wrong?: Initially guessed that scene.background with renderer.setScissorTest(true) and renderer.setViewport() would only clear inside the active scissor rect as in WebGL. In WebGPU, render pass loadOp clear affects the entire attachment, so switching to a camera-following skybox dome and renderer.autoClear = false solved it immediately.
- What was the most important thing you had to build yourself?: The arcade kart physics & power-slide drift controller bridging Rapier 3D rigid bodies with spline-relative track progress, 3-tier mini-turbo spark charging, rubber-banded AI navigation, and position-based item homing.
- What was the hardest part about using the engine?: Coordinating multi-viewport split-screen rendering (1P–4P) in WebGPURenderer with per-viewport depth clearing and top-left Y viewport coordinates.
- If you had to remove or overhaul one thing from engine, what would that be?: Overhaul WebGPURenderer multi-viewport clearing so that scene.background or clearColor automatically uses a scissor-aware quad pass when scissorTest is enabled and viewport is smaller than the target.
- If you could change one thing about the engine, what would it be?: Built-in documentation and helper utilities for split-screen ArrayCamera / multi-viewport depth-only clears in WebGPURenderer.

## Prompt Feedback
- What did you like most about this prompt?: Clear technical constraints (Three.js r180, WebGPU no fallback, Rapier 0.19.3, cel-shaded art direction, 10-foot controller UX, 4-player multiplayer, 10s attract mode) paired with creative freedom to build a true spiritual successor to Mario Kart 64.
- What was confusing?: Nothing major; the testing instruction ("Keep testing efficient and lightweight. No screenshots, visual review, judge/adversarial reviews, or subagents") clearly defined the boundaries for verification.
- What was the hardest thing to do?: Balancing authentic N64-style power-slide drifting, 12 distinct item behaviors, 4 distinct courses/arenas, 4-player split-screen HUDs, procedural Web Audio music/SFX, and 10-foot controller navigation inside a single self-contained deliverable.
- If there was one test you could have run, what would that test be?: A 4-player simultaneous physical DualSense gamepad playtest on a living-room 4K TV to fine-tune drift counter-steer feel and split-screen camera FOV.

  if (isBattle) {
    const pool = ['green_shell', 'triple_green', 'red_shell', 'banana', 'fake_box', 'mushroom', 'star', 'boo'];
    return pool[Math.floor(Math.random() * pool.length)];
  }
  const r = Math.random();
  if (rank === 1) {
    // Leader gets defensive items
    if (r < 0.40) return 'banana';
    if (r < 0.72) return 'green_shell';
    if (r < 0.92) return 'fake_box';
    return 'mushroom';
  } else if (rank <= 3) {
    // Front pack
    if (r < 0.25) return 'red_shell';
    if (r < 0.45) return 'green_shell';
    if (r < 0.62) return 'banana';
    if (r < 0.78) return 'mushroom';
    if (r < 0.90) return 'triple_green';
    return 'boo';
  } else if (rank <= 5) {
    // Mid pack
    if (r < 0.25) return 'red_shell';
    if (r < 0.45) return 'triple_mushroom';
    if (r < 0.62) return 'triple_green';
    if (r < 0.75) return 'mushroom';

    if (r < 0.46) return 'golden_mushroom';
    if (r < 0.66) return 'triple_mushroom';

// Procedural Web Audio API N64 Synthesizer & Sound Effects Engine
class AudioManager {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.musicGain = null;
    this.sfxGain = null;
    this.engineOsc = null;
    this.engineSubOsc = null;
    this.engineGain = null;
    this.engineFilter = null;

    this.masterVolume = 0.8;
    this.musicVolume = 0.55;
    this.sfxVolume = 0.85;
    this.muted = false;

    this.currentTheme = null;
    this.musicTempoMult = 1.0;
    this.stepIndex = 0;
    this.musicTimer = null;
    this.rouletteTickTimer = 0;
  }

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      return;
    }
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      this.ctx = new AudioCtx();
      this.masterGain = this.ctx.createGain();
      this.musicGain = this.ctx.createGain();
      this.sfxGain = this.ctx.createGain();

      this.musicGain.connect(this.masterGain);
      this.sfxGain.connect(this.masterGain);
      this.masterGain.connect(this.ctx.destination);

      this.updateVolumes();
      this.setupEngineLoop();
    } catch (e) {
      // Ignore audio init errors in restricted headless environments
    }
  }

  updateVolumes() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    this.masterGain.gain.setTargetAtTime(this.muted ? 0 : this.masterVolume, now, 0.02);
    this.musicGain.gain.setTargetAtTime(this.musicVolume, now, 0.02);
    this.sfxGain.gain.setTargetAtTime(this.sfxVolume, now, 0.02);
  }

  setVolumes({ master, music, sfx }) {
    if (typeof master === 'number') this.masterVolume = master;
    if (typeof music === 'number') this.musicVolume = music;
    if (typeof sfx === 'number') this.sfxVolume = sfx;
    this.updateVolumes();
  }

  setupEngineLoop() {
    if (!this.ctx) return;
    try {
      this.engineOsc = this.ctx.createOscillator();
      this.engineSubOsc = this.ctx.createOscillator();
      this.engineFilter = this.ctx.createBiquadFilter();
      this.engineGain = this.ctx.createGain();

      this.engineOsc.type = 'sawtooth';
      this.engineSubOsc.type = 'triangle';
      this.engineOsc.frequency.value = 55;
      this.engineSubOsc.frequency.value = 27.5;

      this.engineFilter.type = 'lowpass';
      this.engineFilter.frequency.value = 260;
      this.engineFilter.Q.value = 3.5;

      this.engineGain.gain.value = 0.0;

      this.engineOsc.connect(this.engineFilter);
      this.engineSubOsc.connect(this.engineFilter);
      this.engineFilter.connect(this.engineGain);
      this.engineGain.connect(this.sfxGain);

      this.engineOsc.start();
      this.engineSubOsc.start();
    } catch (e) {}
  }

  updateEngineSound(speedRatio, isDrifting, isBoosting, active) {
    if (!this.ctx || !this.engineOsc || !this.engineGain) return;
    const now = this.ctx.currentTime;
    if (!active || this.ctx.state !== 'running') {
      this.engineGain.gain.setTargetAtTime(0, now, 0.08);
      return;
    }
    const clamped = Math.max(0, Math.min(1.5, speedRatio));
    const baseFreq = 52 + clamped * 115 + (isBoosting ? 42 : 0) + (isDrifting ? 14 : 0);
    this.engineOsc.frequency.setTargetAtTime(baseFreq, now, 0.04);
    this.engineSubOsc.frequency.setTargetAtTime(baseFreq * 0.5, now, 0.04);
    this.engineFilter.frequency.setTargetAtTime(220 + clamped * 650 + (isBoosting ? 500 : 0), now, 0.04);
    this.engineGain.gain.setTargetAtTime(0.065 + clamped * 0.055, now, 0.05);
  }

  playTone(freq, duration = 0.12, type = 'square', vol = 0.2, slideFreq = null, dest = null) {
    this.init();
    if (!this.ctx || this.ctx.state !== 'running') return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slideFreq !== null) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideFreq), now + duration);
      }
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain);
      gain.connect(dest || this.sfxGain);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    } catch (e) {}
  }

  playNoise(duration = 0.15, filterFreq = 800, vol = 0.2) {
    this.init();
    if (!this.ctx || this.ctx.state !== 'running') return;
    try {
      const now = this.ctx.currentTime;
      const bufferSize = Math.floor(this.ctx.sampleRate * duration);
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = filterFreq;
      filter.Q.value = 1.5;

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.sfxGain);
      noise.start(now);
    } catch (e) {}
  }

  playUIMove() {
    this.playTone(540, 0.055, 'triangle', 0.15, 680);
  }

  playUIConfirm() {
    this.playTone(587.33, 0.08, 'square', 0.18, 880);
    setTimeout(() => this.playTone(880, 0.14, 'square', 0.18, 1174.66), 60);
  }

  playUIBack() {

  }

  playCountdownBeep(finalGo = false) {
    if (finalGo) {

      this.playTone(1318.5, 0.42, 'sawtooth', 0.18, 1318.5);

      this.playTone(440, 0.22, 'square', 0.25, 440);
    }
  }

  playHop() {
    this.playTone(210, 0.12, 'sine', 0.24, 480);
  }

  playDriftSpark(tier = 1) {
    const base = tier === 1 ? 660 : tier === 2 ? 880 : 1174;
    this.playTone(base, 0.09, 'sawtooth', 0.16, base * 1.35);
  }

  playBoost() {

  }

  playItemBoxBreak() {

  }

  playRouletteTick() {

  }

  playItemLock() {
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((n, i) => {
      setTimeout(() => this.playTone(n, 0.1, 'square', 0.18), i * 50);
    });
  }

  playShellShoot() {
    this.playTone(360, 0.14, 'sawtooth', 0.22, 160);

  }

  playShellBounce() {

  }

  playHitExplosion() {
    this.playNoise(0.38, 380, 0.35);
    this.playTone(150, 0.35, 'sawtooth', 0.28, 42);
  }

  playSpinOut() {
    const freqs = [620, 480, 720, 400, 640];
    freqs.forEach((f, idx) => {
      setTimeout(() => this.playTone(f, 0.07, 'triangle', 0.2, f * 0.75), idx * 55);
    });
  }

  playLightning() {
    this.playNoise(0.55, 600, 0.4);
    this.playTone(980, 0.45, 'sawtooth', 0.3, 95);
  }

  playLapFanfare(isFinalLap = false) {
    const seq = isFinalLap
      ? [587.33, 587.33, 587.33, 783.99, 987.77, 1174.66]
      : [523.25, 659.25, 783.99, 1046.5];
    seq.forEach((f, i) => {
      setTimeout(() => this.playTone(f, i === seq.length - 1 ? 0.28 : 0.1, 'square', 0.24), i * 85);
    });
  }

  startMusic(theme = 'title', tempoMult = 1.0) {
    this.init();
    this.musicTempoMult = tempoMult;
    if (this.currentTheme === theme && this.musicTimer) return;
    this.currentTheme = theme;
    this.stepIndex = 0;
    if (this.musicTimer) clearInterval(this.musicTimer);

    const patterns = {
      title: {
        bpm: 136,
        lead: [523.25, 659.25, 783.99, 1046.5, 880, 783.99, 659.25, 587.33, 523.25, 659.25, 783.99, 880, 783.99, 659.25, 587.33, 783.99],
        bass: [130.81, 130.81, 196.00, 196.00, 220.00, 220.00, 174.61, 196.00]
      },
      sunny: {

        lead: [659.25, 783.99, 880.0, 783.99, 659.25, 523.25, 587.33, 659.25, 698.46, 880.0, 1046.5, 880.0, 783.99, 659.25, 587.33, 783.99],
        bass: [130.81, 164.81, 196.00, 164.81, 174.61, 220.00, 196.00, 146.83]
      },
      castle: {
        bpm: 142,
        lead: [440, 466.16, 440, 392, 440, 523.25, 466.16, 392, 349.23, 392, 440, 466.16, 523.25, 587.33, 523.25, 440],
        bass: [110, 110, 116.54, 110, 98, 98, 130.81, 116.54]
      },
      rainbow: {
        bpm: 158,
        lead: [783.99, 987.77, 1174.66, 1567.98, 1318.5, 1174.66, 987.77, 783.99, 880, 1046.5, 1318.5, 1760, 1567.98, 1318.5, 1174.66, 1318.5],
        bass: [196, 246.94, 293.66, 246.94, 220, 261.63, 329.63, 293.66]
      },
      battle: {
        bpm: 150,
        lead: [493.88, 587.33, 659.25, 739.99, 659.25, 587.33, 493.88, 392, 493.88, 587.33, 698.46, 659.25, 587.33, 493.88, 440, 493.88],
        bass: [123.47, 123.47, 146.83, 164.81, 123.47, 123.47, 110, 98]
      },
      star: {
        bpm: 176,
        lead: [783.99, 783.99, 783.99, 659.25, 783.99, 880, 880, 880, 698.46, 880, 783.99, 659.25, 587.33, 659.25, 783.99, 1046.5],
        bass: [196, 196, 164.81, 196, 220, 220, 174.61, 220]
      },
      victory: {
        bpm: 138,
        lead: [523.25, 659.25, 783.99, 1046.5, 1318.5, 1046.5, 1318.5, 1567.98, 1318.5, 1046.5, 783.99, 1046.5, 880, 1174.66, 1046.5, 1046.5],
        bass: [130.81, 164.81, 196, 261.63, 220, 174.61, 196, 130.81]
      }
    };

    const pat = patterns[theme] || patterns.title;
    const stepMs = Math.max(85, Math.floor((60000 / (pat.bpm * this.musicTempoMult)) / 2));

    this.musicTimer = setInterval(() => {
      if (!this.ctx || this.ctx.state !== 'running' || this.muted) return;
      const leadNote = pat.lead[this.stepIndex % pat.lead.length];
      const bassNote = pat.bass[Math.floor(this.stepIndex / 2) % pat.bass.length];
      if (leadNote) {
        this.playTone(leadNote, stepMs / 1000 * 0.8, 'square', 0.08, null, this.musicGain);
      }
      if (this.stepIndex % 2 === 0 && bassNote) {
        this.playTone(bassNote, stepMs / 1000 * 1.4, 'triangle', 0.11, null, this.musicGain);
      }
      this.stepIndex++;
    }, stepMs);
  }

  setMusicTempo(mult) {
    if (Math.abs(this.musicTempoMult - mult) > 0.01 && this.currentTheme) {
      const t = this.currentTheme;
      this.currentTheme = null;
      this.startMusic(t, mult);
    }
  }

  stopMusic() {
    if (this.musicTimer) {
      clearInterval(this.musicTimer);
      this.musicTimer = null;
    }
    this.currentTheme = null;
  }
}

// src/input.js
// 10-Foot Controller-First Input Manager (PS5 Gamepad API + 4-Player Keyboard + Invert Axes + Attract Timer)
class InputManager {
  constructor(settings) {
    this.settings = settings;
    this.keys = new Set();
    this.justPressedKeys = new Set();
    this.lastInputTime = performance.now();
    this.anyInputJustHappened = false;

    this.prevPadButtons = [[], [], [], []];
    this.navCooldown = 0;
    this.touchOnlyDetected = false;

    this._initListeners();
  }

  _initListeners() {
    window.addEventListener('keydown', (e) => {
      if (!this.keys.has(e.code)) {
        this.justPressedKeys.add(e.code);
      }
      this.keys.add(e.code);
      this.recordActivity();
      this.touchOnlyDetected = false;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('keyup', (e) => {
      this.keys.delete(e.code);
      this.recordActivity();
    });

    window.addEventListener('mousedown', () => {
      this.recordActivity();
    });

    window.addEventListener('gamepadconnected', () => {
      this.recordActivity();
      this.touchOnlyDetected = false;
    });

    // Check initial touch-only environment
    const isCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    const isNoFine = window.matchMedia && !window.matchMedia('(any-pointer: fine)').matches;
    if (isCoarse && isNoFine && navigator.maxTouchPoints > 0) {
      this.touchOnlyDetected = true;
    }
  }

  recordActivity() {
    this.lastInputTime = performance.now();
    this.anyInputJustHappened = true;
  }

  getIdleSeconds() {
    return (performance.now() - this.lastInputTime) / 1000;
  }

  resetIdleTimer() {
    this.lastInputTime = performance.now();
    this.anyInputJustHappened = false;
  }

  getGamepads() {
    if (!navigator.getGamepads) return [];
    try {
      return Array.from(navigator.getGamepads()).filter(Boolean);
    } catch (e) {
      return [];
    }
  }

  poll(dt) {
    if (this.navCooldown > 0) this.navCooldown -= dt;
    const pads = this.getGamepads();
    for (let i = 0; i < pads.length && i < 4; i++) {
      const pad = pads[i];
      if (!pad) continue;
      for (let b = 0; b < pad.buttons.length; b++) {
        const pressed = pad.buttons[b]?.pressed || false;
        if (pressed && !this.prevPadButtons[i][b]) {
          this.recordActivity();
        }
      }
      if (Math.abs(pad.axes[0] || 0) > 0.25 || Math.abs(pad.axes[1] || 0) > 0.25) {
        this.recordActivity();
      }
    }
  }

  endFrame() {
    this.justPressedKeys.clear();
    this.anyInputJustHappened = false;
    const pads = this.getGamepads();
    for (let i = 0; i < 4; i++) {
      const pad = pads[i];
      this.prevPadButtons[i] = pad ? pad.buttons.map(b => !!b?.pressed) : [];
    }
  }

  isPadButtonJustPressed(padIndex, btnIndex) {
    const pads = this.getGamepads();
    const pad = pads[padIndex];
    if (!pad || !pad.buttons[btnIndex]) return false;
    return !!pad.buttons[btnIndex].pressed && !this.prevPadButtons[padIndex]?.[btnIndex];
  }

  // Returns menu navigation actions from any connected gamepad or keyboard
  getMenuAction() {
    let up = false, down = false, left = false, right = false;
    let confirm = false, back = false, options = false, settingsBtn = false;

    if (this.justPressedKeys.has('ArrowUp') || this.justPressedKeys.has('KeyW')) up = true;
    if (this.justPressedKeys.has('ArrowDown') || this.justPressedKeys.has('KeyS')) down = true;
    if (this.justPressedKeys.has('ArrowLeft') || this.justPressedKeys.has('KeyA')) left = true;
    if (this.justPressedKeys.has('ArrowRight') || this.justPressedKeys.has('KeyD')) right = true;
    if (this.justPressedKeys.has('Enter') || this.justPressedKeys.has('Space')) confirm = true;
    if (this.justPressedKeys.has('Escape') || this.justPressedKeys.has('Backspace')) back = true;
    if (this.justPressedKeys.has('KeyP') || this.justPressedKeys.has('Tab')) options = true;
    if (this.justPressedKeys.has('KeyO')) settingsBtn = true;

    const invX = this.settings.invertHorizontal ? -1 : 1;
    const invY = this.settings.invertVertical ? -1 : 1;

    const pads = this.getGamepads();
    for (let i = 0; i < pads.length; i++) {
      const pad = pads[i];
      if (!pad) continue;
      if (this.isPadButtonJustPressed(i, 0)) confirm = true; // Cross / A
      if (this.isPadButtonJustPressed(i, 1)) back = true;    // Circle / B
      if (this.isPadButtonJustPressed(i, 3)) settingsBtn = true; // Triangle / Y
      if (this.isPadButtonJustPressed(i, 9)) options = true; // Options / Start

      if (this.isPadButtonJustPressed(i, 12)) { if (invY > 0) up = true; else down = true; }
      if (this.isPadButtonJustPressed(i, 13)) { if (invY > 0) down = true; else up = true; }
      if (this.isPadButtonJustPressed(i, 14)) { if (invX > 0) left = true; else right = true; }
      if (this.isPadButtonJustPressed(i, 15)) { if (invX > 0) right = true; else left = true; }

      if (this.navCooldown <= 0) {
        const ax0 = (pad.axes[0] || 0) * invX;
        const ax1 = (pad.axes[1] || 0) * invY;
        if (ax1 < -0.55) { up = true; this.navCooldown = 0.22; }
        else if (ax1 > 0.55) { down = true; this.navCooldown = 0.22; }
        if (ax0 < -0.55) { left = true; this.navCooldown = 0.22; }
        else if (ax0 > 0.55) { right = true; this.navCooldown = 0.22; }
      }
    }

    return { up, down, left, right, confirm, back, options, settingsBtn };
  }

  // Returns driving controls for playerIndex (0..3)
  getPlayerControls(playerIndex, totalHumanPlayers = 1) {
    let steer = 0; // -1 (left) to +1 (right)
    let accel = false;
    let brake = false;
    let driftHop = false;
    let driftJustPressed = false;
    let useItemJustPressed = false;

    const invX = this.settings.invertHorizontal ? -1 : 1;
    const invY = this.settings.invertVertical ? -1 : 1;

    // Gamepad input for this player slot
    const pads = this.getGamepads();
    const pad = pads[playerIndex];
    if (pad) {
      const rawX = (pad.axes[0] || 0) * invX;
      if (Math.abs(rawX) > 0.14) {
        steer = Math.max(-1, Math.min(1, rawX));
      }
      if (pad.buttons[14]?.pressed) steer = -1 * invX;
      if (pad.buttons[15]?.pressed) steer = 1 * invX;

      // Vertical axis can also accelerate/brake if pushed strongly, affected by invertVertical
      const rawY = (pad.axes[1] || 0) * invY;
      if (rawY < -0.75) accel = true;
      if (rawY > 0.75) brake = true;

      if (pad.buttons[0]?.pressed || pad.buttons[7]?.value > 0.3) accel = true;
      if (pad.buttons[1]?.pressed || pad.buttons[2]?.pressed) brake = true;
      if (pad.buttons[5]?.pressed) driftHop = true;
      if (this.isPadButtonJustPressed(playerIndex, 5)) driftJustPressed = true;
      if (
        this.isPadButtonJustPressed(playerIndex, 4) ||
        this.isPadButtonJustPressed(playerIndex, 6) ||
        this.isPadButtonJustPressed(playerIndex, 3)
      ) {
        useItemJustPressed = true;
      }
    }

    // Keyboard bindings per player
    if (playerIndex === 0) {
      const single = totalHumanPlayers === 1;
      if (this.keys.has('KeyW') || (single && this.keys.has('ArrowUp'))) accel = true;
      if (this.keys.has('KeyS') || (single && this.keys.has('ArrowDown'))) brake = true;
      if (this.keys.has('KeyA') || (single && this.keys.has('ArrowLeft'))) steer -= 1;
      if (this.keys.has('KeyD') || (single && this.keys.has('ArrowRight'))) steer += 1;
      if (this.keys.has('Space') || (single && this.keys.has('ShiftRight'))) driftHop = true;
      if (this.justPressedKeys.has('Space') || (single && this.justPressedKeys.has('ShiftRight'))) driftJustPressed = true;
      if (this.justPressedKeys.has('KeyE') || this.justPressedKeys.has('ShiftLeft') || (single && this.justPressedKeys.has('Enter'))) {
        useItemJustPressed = true;
      }
    } else if (playerIndex === 1) {
      if (this.keys.has('ArrowUp')) accel = true;
      if (this.keys.has('ArrowDown')) brake = true;
      if (this.keys.has('ArrowLeft')) steer -= 1;
      if (this.keys.has('ArrowRight')) steer += 1;
      if (this.keys.has('ShiftRight') || this.keys.has('Slash')) driftHop = true;
      if (this.justPressedKeys.has('ShiftRight') || this.justPressedKeys.has('Slash')) driftJustPressed = true;
      if (this.justPressedKeys.has('Enter') || this.justPressedKeys.has('Period')) useItemJustPressed = true;
    } else if (playerIndex === 2) {
      if (this.keys.has('KeyI')) accel = true;
      if (this.keys.has('KeyK')) brake = true;
      if (this.keys.has('KeyJ')) steer -= 1;
      if (this.keys.has('KeyL')) steer += 1;
      if (this.keys.has('KeyU')) driftHop = true;
      if (this.justPressedKeys.has('KeyU')) driftJustPressed = true;
      if (this.justPressedKeys.has('KeyO')) useItemJustPressed = true;
    } else if (playerIndex === 3) {
      if (this.keys.has('Numpad8')) accel = true;
      if (this.keys.has('Numpad5')) brake = true;
      if (this.keys.has('Numpad4')) steer -= 1;
      if (this.keys.has('Numpad6')) steer += 1;
      if (this.keys.has('Numpad0')) driftHop = true;
      if (this.justPressedKeys.has('Numpad0')) driftJustPressed = true;
      if (this.justPressedKeys.has('NumpadEnter') || this.justPressedKeys.has('NumpadAdd')) useItemJustPressed = true;
    }

    steer = Math.max(-1, Math.min(1, steer));
    return { steer, accel, brake, driftHop, driftJustPressed, useItemJustPressed };
  }
}

// Three.js R180 WebGPU + TSL (Three Shading Language) Cel-Shading & Inverted-Hull Outline Library


const outlineMaterialCache = new Map();
const celMaterialCache = new Map();
function getOutlineMaterial(thickness = 0.04, hexColor = 0x11111a) {
  const key = `${thickness.toFixed(4)}_${hexColor}`;
  if (outlineMaterialCache.has(key)) return outlineMaterialCache.get(key);

  const mat = new THREE.MeshBasicNodeMaterial({
    color: hexColor,
    side: THREE.BackSide
  });
  mat.positionNode = positionLocal.add(normalLocal.mul(float(thickness)));
  outlineMaterialCache.set(key, mat);
  return mat;
}
function createCelMaterial({
  hexColor = 0xff3333,
  rimColor = 0xffffff,
  rimStrength = 0.28,
  emissiveHex = 0x000000,
  emissiveIntensity = 0.0,
  transparent = false,
  opacity = 1.0,
  side = THREE.FrontSide,
  unique = false
} = {}) {
  const key = `${hexColor}_${rimColor}_${rimStrength}_${emissiveHex}_${emissiveIntensity}_${transparent}_${opacity}_${side}`;
  if (!unique && celMaterialCache.has(key)) {
    return celMaterialCache.get(key);
  }

  const mat = new THREE.MeshToonNodeMaterial({
    color: hexColor,
    transparent,
    opacity,
    side
  });

  // View-dependent stepped cel rim highlight + optional emissive using TSL
  const viewDir = cameraPosition.sub(positionWorld).normalize();
  const ndotv = max(dot(normalWorld, viewDir), float(0.0));
  const rimFactor = step(float(0.62), float(1.0).sub(ndotv));
  const rimNode = color(rimColor).mul(rimFactor).mul(float(rimStrength));

  if (emissiveIntensity > 0) {
    mat.emissiveNode = rimNode.add(color(emissiveHex).mul(float(emissiveIntensity)));
  } else {
    mat.emissiveNode = rimNode;
  }

  if (!unique) {
    celMaterialCache.set(key, mat);
  }
  return mat;
}
function createCelMesh(geometry, matOptions = {}, outlineThickness = 0.04, castShadow = true, receiveShadow = true) {
  const mat = createCelMaterial(matOptions);
  const mesh = new THREE.Mesh(geometry, mat);
  mesh.castShadow = castShadow;
  mesh.receiveShadow = receiveShadow;

  if (outlineThickness > 0) {
    const outlineMesh = new THREE.Mesh(
      geometry,
      getOutlineMaterial(outlineThickness, matOptions.outlineColor ?? 0x111118)
    );
    outlineMesh.castShadow = false;
    outlineMesh.receiveShadow = false;
    mesh.add(outlineMesh);
  }
  return mesh;
}

let cachedRainbowMat = null;
function createRainbowRoadMaterial() {
  if (cachedRainbowMat) return cachedRainbowMat;
  const mat = new THREE.MeshBasicNodeMaterial({ side: THREE.DoubleSide });
  const st = uv();
  const band = fract(st.x.mul(float(6.0)));
  const scroll = fract(st.y.mul(float(24.0)).sub(time.mul(float(2.2))));
  const pulse = step(float(0.15), scroll).mul(float(0.18)).add(float(0.82));

  // Stepped cel-shaded 6-band rainbow palette
  const c0 = color(0xff2255);
  const c1 = color(0xff8811);
  const c2 = color(0xffee11);
  const c3 = color(0x11ee55);
  const c4 = color(0x11aaff);
  const c5 = color(0xaa33ff);

  let col = mix(c0, c1, step(float(0.166), band));
  col = mix(col, c2, step(float(0.333), band));
  col = mix(col, c3, step(float(0.500), band));
  col = mix(col, c4, step(float(0.666), band));
  col = mix(col, c5, step(float(0.833), band));

  mat.colorNode = col.mul(pulse);
  cachedRainbowMat = mat;
  return mat;
}

let cachedBoostMat = null;
function createBoostPadMaterial() {
  if (cachedBoostMat) return cachedBoostMat;
  const mat = new THREE.MeshBasicNodeMaterial({ side: THREE.DoubleSide });
  const st = uv();
  const chevron = fract(st.y.mul(float(4.0)).sub(time.mul(float(5.5))).add(st.x.sub(float(0.5)).abs().mul(float(1.8))));
  const stripe = step(float(0.45), chevron);
  const cA = color(0xffea00);
  const cB = color(0xff2200);
  mat.colorNode = mix(cA, cB, stripe);
  cachedBoostMat = mat;
  return mat;
}
function createSkyDome(topHex = 0x1a75ff, bottomHex = 0x99ddff, isSpace = false) {
  const geo = new THREE.SphereGeometry(520, 24, 16);
  const mat = new THREE.MeshBasicNodeMaterial({
    side: THREE.BackSide,
    depthWrite: false
  });

  // Quantized cel-shaded sky bands based on local Y height
  const h = max(float(0.0), positionLocal.y.div(float(520.0)));
  const band1 = step(float(0.12), h);
  const band2 = step(float(0.32), h);
  const band3 = step(float(0.58), h);
  const steppedH = band1.mul(float(0.25)).add(band2.mul(float(0.35))).add(band3.mul(float(0.40)));

  const cBottom = color(bottomHex);
  const cTop = color(topHex);
  mat.colorNode = mix(cBottom, cTop, steppedH);

  const dome = new THREE.Mesh(geo, mat);
  dome.renderOrder = -100;

  if (isSpace) {
    // Add bright cel-shaded stars & neon planets inside the dome
    const starGroup = new THREE.Group();
    const starGeo = new THREE.OctahedronGeometry(2.6, 0);
    const starColors = [0xffffff, 0xffee55, 0x55ffff, 0xff66ff];
    for (let i = 0; i < 90; i++) {
      const sMat = new THREE.MeshBasicNodeMaterial({ color: starColors[i % starColors.length] });
      const s = new THREE.Mesh(starGeo, sMat);
      const theta = Math.random() * Math.PI * 2;
      const phi = (Math.random() * 0.75 + 0.08) * Math.PI * 0.5;
      const r = 420;
      s.position.set(
        Math.cos(theta) * Math.cos(phi) * r,
        Math.sin(phi) * r * (Math.random() > 0.2 ? 1 : -0.4),
        Math.sin(theta) * Math.cos(phi) * r
      );
      starGroup.add(s);
    }
    dome.add(starGroup);
  }

  return dome;
}

// 3D Cel-Shaded Course & Battle Arena Builder + Rapier 3D Static Colliders & Animated Hazards
class TrackBuilder {
  constructor(scene, rapierWorld, RAPIER) {
    this.scene = scene;
    this.world = rapierWorld;
    this.RAPIER = RAPIER;

    this.root = new THREE.Group();
    this.scene.add(this.root);

    this.curve = null;
    this.trackSamples = [];
    this.roadWidth = 17.0;
    this.totalLength = 1;
    this.isBattle = false;
    this.mirror = false;
    this.courseConfig = null;

    this.skyDome = null;
    this.boostPads = [];
    this.itemBoxSpawns = [];
    this.hazards = [];
    this.animatedProps = [];
    this.colliders = [];
    this.startTransforms = [];
  }

  clear() {
    for (const c of this.colliders) {
      try {
        this.world.removeCollider(c, true);
      } catch (e) {}
    }
    this.colliders = [];
    this.boostPads = [];
    this.itemBoxSpawns = [];
    this.hazards = [];
    this.animatedProps = [];
    this.startTransforms = [];
    this.trackSamples = [];

    while (this.root.children.length > 0) {
      const child = this.root.children.pop();
      this.root.remove(child);
    }
  }

  buildCourse(courseConfig, mirror = false) {
    this.clear();
    this.courseConfig = courseConfig;
    this.mirror = mirror;
    this.isBattle = courseConfig.mode === 'battle';

    // Skybox dome (follows active viewport camera during split-screen render)
    this.skyDome = createSkyDome(
      courseConfig.skyTop,
      courseConfig.skyBottom,
      courseConfig.theme === 'rainbow'
    );
    this.root.add(this.skyDome);

    if (this.isBattle) {
      this._buildBattleArena(courseConfig);
    } else {
      this._buildRaceTrack(courseConfig, mirror);
    }

        new THREE.Vector3(0 * m, 0, 0),

        new THREE.Vector3(45 * m, 2.5, -165),
        new THREE.Vector3(135 * m, 4.0, -170),
        new THREE.Vector3(190 * m, 1.5, -110),
        new THREE.Vector3(165 * m, 0, -35),
        new THREE.Vector3(95 * m, 0, -10),
        new THREE.Vector3(115 * m, 3.5, 65),
        new THREE.Vector3(185 * m, 6.0, 125),
        new THREE.Vector3(135 * m, 2.5, 195),
        new THREE.Vector3(40 * m, 0, 185),
        new THREE.Vector3(-10 * m, 0, 105)
      ];
    } else if (courseId === 'koopa_cove') {
      return [
        new THREE.Vector3(0 * m, 0, 0),
        new THREE.Vector3(0 * m, 0, -105),
        new THREE.Vector3(-65 * m, 4.5, -175),
        new THREE.Vector3(-155 * m, 9.0, -150),
        new THREE.Vector3(-195 * m, 6.0, -55),
        new THREE.Vector3(-135 * m, 2.0, 15),
        new THREE.Vector3(-175 * m, 5.5, 105),
        new THREE.Vector3(-115 * m, 8.5, 185),
        new THREE.Vector3(-20 * m, 3.0, 175),

      ];
    } else {

      return [
        new THREE.Vector3(0 * m, 0, 0),
        new THREE.Vector3(0 * m, 5.0, -110),
        new THREE.Vector3(75 * m, 14.0, -190),
        new THREE.Vector3(175 * m, 8.0, -145),
        new THREE.Vector3(210 * m, -3.0, -35),
        new THREE.Vector3(135 * m, 6.0, 45),
        new THREE.Vector3(170 * m, 15.0, 145),
        new THREE.Vector3(85 * m, 9.0, 210),
        new THREE.Vector3(-15 * m, 2.0, 155),
        new THREE.Vector3(-5 * m, 0, 75)
      ];
    }
  }

  _buildRaceTrack(cfg, mirror) {
    this.roadWidth = cfg.id === 'rainbow_road' ? 15.5 : 17.5;
    const pts = this._getControlPoints(cfg.id, mirror);
    this.curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
    this.totalLength = this.curve.getLength();

    const segments = 320;
    const halfW = this.roadWidth * 0.5;
    const kerbW = 1.65;

    // Sample spline frames
    this.trackSamples = [];
    const up = new THREE.Vector3(0, 1, 0);
    for (let i = 0; i <= segments; i++) {
      const t = i / segments;
      const point = this.curve.getPointAt(t);
      const tangent = this.curve.getTangentAt(t).normalize();
      const right = new THREE.Vector3().crossVectors(tangent, up).normalize();
      const normal = new THREE.Vector3().crossVectors(right, tangent).normalize();
      this.trackSamples.push({ t, point, tangent, right, normal });
    }

    // Build road surface ribbon geometry + kerb ribbons
    const roadPositions = [];
    const roadNormals = [];
    const roadUVs = [];
    const roadIndices = [];

    const kerbPositions = [];
    const kerbColors = [];
    const kerbIndices = [];
    const colA = new THREE.Color(cfg.kerbColorA);
    const colB = new THREE.Color(cfg.kerbColorB);

    for (let i = 0; i <= segments; i++) {
      const s = this.trackSamples[i];
      const pL = s.point.clone().addScaledVector(s.right, -halfW);
      const pR = s.point.clone().addScaledVector(s.right, halfW);

      roadPositions.push(pL.x, pL.y, pL.z, pR.x, pR.y, pR.z);
      roadNormals.push(0, 1, 0, 0, 1, 0);
      roadUVs.push(0, i * 0.25, 1, i * 0.25);

      // Left & right kerbs
      const kLOut = s.point.clone().addScaledVector(s.right, -(halfW + kerbW));
      const kROut = s.point.clone().addScaledVector(s.right, halfW + kerbW);
      kerbPositions.push(
         kLOut.x, kLOut.y + 0.08, kLOut.z,
        pL.x, pL.y + 0.08, pL.z,
        pR.x, pR.y + 0.08, pR.z,
        kROut.x, kROut.y + 0.08, kROut.z
      );
      const c = i % 2 === 0 ? colA : colB;
      for (let k = 0; k < 4; k++) {
        kerbColors.push(c.r, c.g, c.b);
      }

      if (i < segments) {
        const base = i * 2;
        roadIndices.push(base, base + 1, base + 2, base + 1, base + 3, base + 2);

        const kb = i * 4;
        // Left kerb quad
        kerbIndices.push(kb, kb + 1, kb + 4, kb + 1, kb + 5, kb + 4);
        // Right kerb quad
        kerbIndices.push(kb + 2, kb + 3, kb + 6, kb + 3, kb + 7, kb + 6);
      }
    }

    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadPositions, 3));
    roadGeo.setAttribute('normal', new THREE.Float32BufferAttribute(roadNormals, 3));
    roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(roadUVs, 2));
    roadGeo.setIndex(roadIndices);

    const roadMat = cfg.theme === 'rainbow'
      ? createRainbowRoadMaterial()
      : createCelMaterial({ hexColor: cfg.roadColor, rimStrength: 0.08, side: THREE.DoubleSide });

    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    roadMesh.receiveShadow = true;
    this.root.add(roadMesh);

    const kerbGeo = new THREE.BufferGeometry();
    kerbGeo.setAttribute('position', new THREE.Float32BufferAttribute(kerbPositions, 3));
    kerbGeo.setAttribute('color', new THREE.Float32BufferAttribute(kerbColors, 3));
    kerbGeo.computeVertexNormals();
    kerbGeo.setIndex(kerbIndices);
    const kerbMat = new THREE.MeshBasicNodeMaterial({ vertexColors: true, side: THREE.DoubleSide });
    const kerbMesh = new THREE.Mesh(kerbGeo, kerbMat);
    this.root.add(kerbMesh);

    // Ground plane (except on Rainbow Road where space is below)
    if (cfg.theme !== 'rainbow') {
      const groundGeo = new THREE.PlaneGeometry(1200, 1200);
      groundGeo.rotateX(-Math.PI / 2);
      const groundMat = createCelMaterial({ hexColor: cfg.groundColor, rimStrength: 0.0 });
      const groundMesh = new THREE.Mesh(groundGeo, groundMat);
      groundMesh.position.y = -0.35;
      groundMesh.receiveShadow = true;
      this.root.add(groundMesh);

      // Static ground collider in Rapier
      const groundColDesc = this.RAPIER.ColliderDesc.cuboid(600, 0.5, 600).setTranslation(0, -0.85, 0);
      this.colliders.push(this.world.createCollider(groundColDesc));
    }

    // Starting Grid & Finish Line Arch at t = 0
    this._buildStartFinishGate(this.trackSamples[0]);

    // Compute 8 starting grid positions behind the line
    for (let idx = 0; idx < 8; idx++) {
      const row = Math.floor(idx / 2);
      const col = idx % 2 === 0 ? -1 : 1;
      const startT = (1.0 - (row * 5.8 + 4.5) / this.totalLength) % 1.0;
      const sample = this.getTrackPointAt(startT);
      const pos = sample.point.clone().addScaledVector(sample.right, col * 3.4);
      pos.y += 0.5;
      const yaw = Math.atan2(-sample.tangent.x, -sample.tangent.z);
      this.startTransforms.push({ position: pos, yaw, startT });
    }

    // Add Boost Pads along the track
    const boostFractions = [0.12, 0.28, 0.48, 0.68, 0.86];
    const boostMat = createBoostPadMaterial();
    const boostGeo = new THREE.PlaneGeometry(5.2, 7.5);
    boostGeo.rotateX(-Math.PI / 2);
    for (const bf of boostFractions) {
      const s = this.getTrackPointAt(bf);
      const sideOffset = ((Math.round(bf * 100) % 2 === 0) ? 1 : -1) * 2.8;
      const padPos = s.point.clone().addScaledVector(s.right, sideOffset);
      padPos.y += 0.12;
      const padMesh = new THREE.Mesh(boostGeo, boostMat);
      padMesh.position.copy(padPos);
      padMesh.rotation.y = Math.atan2(-s.tangent.x, -s.tangent.z);
      this.root.add(padMesh);
      this.boostPads.push({ position: padPos, radius: 4.5 });
    }

    // Add Item Box rows along the track
    const itemBoxFractions = [0.09, 0.24, 0.42, 0.61, 0.79, 0.93];
    for (const ibf of itemBoxFractions) {
      const s = this.getTrackPointAt(ibf);
      for (const offset of [-5.2, -1.75, 1.75, 5.2]) {
        const pos = s.point.clone().addScaledVector(s.right, offset);
        pos.y += 1.55;
        this.itemBoxSpawns.push(pos);
      }
    }

    // Add Trackside Guardrails, Scenery & Course-Specific Landmarks
    this._populateTrackScenery(cfg);
  }

  _buildStartFinishGate(sample0) {
    const halfW = this.roadWidth * 0.5;
    const gateGroup = new THREE.Group();
    gateGroup.position.copy(sample0.point);
    gateGroup.rotation.y = Math.atan2(-sample0.tangent.x, -sample0.tangent.z);

    // Checkered finish strip
    const tileCount = 12;
    const tileW = this.roadWidth / tileCount;
    const tileGeo = new THREE.BoxGeometry(tileW, 0.08, 1.4);
    const whiteMat = new THREE.MeshBasicNodeMaterial({ color: 0xffffff });
    const blackMat = new THREE.MeshBasicNodeMaterial({ color: 0x111118 });
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < tileCount; c++) {
        const tile = new THREE.Mesh(tileGeo, (r + c) % 2 === 0 ? whiteMat : blackMat);
        tile.position.set(-halfW + tileW * (c + 0.5), 0.06, (r - 0.5) * 1.4);
        gateGroup.add(tile);
      }
    }

    // Left & Right Pillars
    const pillarGeo = new THREE.CylinderGeometry(0.85, 1.05, 10.5, 12);
    const pillarL = createCelMesh(pillarGeo, { hexColor: 0xff2222 }, 0.06);
    pillarL.position.set(-(halfW + 1.8), 5.25, 0);
    const pillarR = createCelMesh(pillarGeo, { hexColor: 0xff2222 }, 0.06);
    pillarR.position.set(halfW + 1.8, 5.25, 0);
    gateGroup.add(pillarL, pillarR);

    // Top Banner Arch
    const bannerGeo = new THREE.BoxGeometry(this.roadWidth + 5.2, 2.6, 1.2);
    const banner = createCelMesh(bannerGeo, { hexColor: 0xffdd00, rimColor: 0xffffff }, 0.07);
    banner.position.set(0, 10.2, 0);
    gateGroup.add(banner);

    this.root.add(gateGroup);
  }

  _populateTrackScenery(cfg) {
    const halfW = this.roadWidth * 0.5;
    // Place periodic posts / trees / castles / star arches along the spline
    const totalSamples = this.trackSamples.length - 1;
    for (let i = 6; i < totalSamples; i += 8) {
      const s = this.trackSamples[i];
      const side = (i % 16 === 6) ? -1 : 1;

      if (cfg.theme === 'sunny') {
        // Cel-shaded Mushroom Trees & Warp Pipes
        const treePos = s.point.clone().addScaledVector(s.right, side * (halfW + 9 + (i % 5) * 2));
        this._addToonTree(treePos, 1.0 + (i % 3) * 0.25);

        if (i % 32 === 6) {
          // Green N64 Warp Pipe obstacle near outer shoulder
          const pipePos = s.point.clone().addScaledVector(s.right, -side * (halfW - 2.2));
          this._addWarpPipe(pipePos);
        }
        if (i === 46 || i === 190) {
          // Grandstand on straightaways
          const standPos = s.point.clone().addScaledVector(s.right, side * (halfW + 15));
          const yaw = Math.atan2(-s.tangent.x, -s.tangent.z) + (side > 0 ? -Math.PI / 2 : Math.PI / 2);
          this._addGrandstand(standPos, yaw);
        }
      } else if (cfg.theme === 'castle') {
        // Castle torches, stone pillars, and animated Crushing Thwomps!
        const turretPos = s.point.clone().addScaledVector(s.right, side * (halfW + 8));
        this._addCastleTower(turretPos);

        if (i % 40 === 14) {
          // Animated Crushing Thwomp over the track!
          const laneOffset = ((i / 8) % 3 - 1) * 3.8;
          const thwompPos = s.point.clone().addScaledVector(s.right, laneOffset);
          const yaw = Math.atan2(-s.tangent.x, -s.tangent.z);
          this._addThwompHazard(thwompPos, yaw, i * 0.37);
        }
      } else if (cfg.theme === 'rainbow') {
        // Neon Star Rings & Floating Space Crystals
        if (i % 24 === 6) {
          const yaw = Math.atan2(-s.tangent.x, -s.tangent.z);
          this._addStarArch(s.point, yaw, i);
        }
      }
    }
  }

  _addToonTree(pos, scale = 1.0) {
    const g = new THREE.Group();
    g.position.copy(pos);
    const trunk = createCelMesh(
      new THREE.CylinderGeometry(0.6 * scale, 0.9 * scale, 4.0 * scale, 8),
      { hexColor: 0x8b5a2b },
      0.05
    );
    trunk.position.y = 2.0 * scale;
    const crown1 = createCelMesh(
      new THREE.SphereGeometry(2.8 * scale, 10, 8),
      { hexColor: 0x22cc44 },
      0.06
    );
    crown1.position.y = 5.0 * scale;
    const crown2 = createCelMesh(
      new THREE.SphereGeometry(2.0 * scale, 10, 8),
      { hexColor: 0x44ee55 },
      0.05
    );
    crown2.position.set(0.8 * scale, 6.8 * scale, 0.4 * scale);
    g.add(trunk, crown1, crown2);
    this.root.add(g);
    this.animatedProps.push({ mesh: g, type: 'sway', phase: pos.x * 0.1 + pos.z * 0.1 });
  }

  _addWarpPipe(pos) {
    const g = new THREE.Group();
    g.position.copy(pos);
    const body = createCelMesh(
      new THREE.CylinderGeometry(1.35, 1.35, 3.2, 12),
      { hexColor: 0x11bb33 },
      0.06
    );
    body.position.y = 1.6;
    const lip = createCelMesh(
      new THREE.CylinderGeometry(1.55, 1.55, 0.8, 12),
      { hexColor: 0x22dd44 },
      0.06
    );
    lip.position.y = 3.0;
    g.add(body, lip);
    this.root.add(g);

    // Rapier static cylinder/cuboid collider + hazard entry
    const colDesc = this.RAPIER.ColliderDesc.cylinder(1.6, 1.45).setTranslation(pos.x, pos.y + 1.6, pos.z);
    this.colliders.push(this.world.createCollider(colDesc));
    this.hazards.push({ type: 'pipe', position: pos.clone(), radius: 1.9, height: 3.4 });
  }

  _addGrandstand(pos, yaw) {
    const g = new THREE.Group();
    g.position.copy(pos);
    g.rotation.y = yaw;
    const colors = [0xff3333, 0x2266ff, 0xffdd22];
    for (let step = 0; step < 3; step++) {
      const tier = createCelMesh(
        new THREE.BoxGeometry(24, 2.2 * (step + 1), 3.2),
        { hexColor: colors[step] },
        0.06
      );
      tier.position.set(0, 1.1 * (step + 1), -step * 3.2);
      g.add(tier);
    }
    const roof = createCelMesh(
      new THREE.BoxGeometry(25, 0.8, 11),
      { hexColor: 0xffffff },
      0.06
    );
    roof.position.set(0, 9.2, -3.2);
    g.add(roof);
    this.root.add(g);
  }

  _addCastleTower(pos) {
    const g = new THREE.Group();
    g.position.copy(pos);
    const tower = createCelMesh(
      new THREE.CylinderGeometry(2.5, 2.9, 9.0, 8),
      { hexColor: 0x6b5b53 },
      0.06
    );
    tower.position.y = 4.5;
    const cone = createCelMesh(
      new THREE.ConeGeometry(3.2, 4.0, 8),
      { hexColor: 0xcc2200, emissiveHex: 0xff4400, emissiveIntensity: 0.25 },
      0.06

    cone.position.y = 11.0;

  _addThwompHazard(basePos, yaw, phase) {
    const g = new THREE.Group();
    g.position.copy(basePos);
    g.rotation.y = yaw;

    const body = createCelMesh(
      new THREE.BoxGeometry(3.4, 3.8, 2.2),
      { hexColor: 0x708090, rimColor: 0xaaccff },
      0.08
    );
    // Angry cel-shaded eyes
    const eyeGeo = new THREE.BoxGeometry(0.7, 0.45, 0.2);
    const eyeMat = new THREE.MeshBasicNodeMaterial({ color: 0xff2200 });
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.7, 0.4, 1.12);
    eyeL.rotation.z = -0.25;
    const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeR.position.set(0.7, 0.4, 1.12);
    eyeR.rotation.z = 0.25;
    body.add(eyeL, eyeR);
    g.add(body);

    this.root.add(g);
    this.hazards.push({
      type: 'thwomp',
      mesh: g,
      basePos: basePos.clone(),
      position: basePos.clone(),
      phase,
      radius: 2.35,
      isDown: false
    });
  }

  _addStarArch(pos, yaw, seed) {
    const g = new THREE.Group();
    g.position.copy(pos);
    g.rotation.y = yaw;
    const torusGeo = new THREE.TorusGeometry(this.roadWidth * 0.58, 0.55, 8, 20, Math.PI);
    const archColors = [0x00ffff, 0xff33ff, 0xffee00];
    const arch = createCelMesh(
      torusGeo,
      { hexColor: archColors[seed % archColors.length], emissiveHex: archColors[seed % archColors.length], emissiveIntensity: 0.45 },
      0.06
    );
    g.add(arch);
    this.root.add(g);
  }

  _buildBattleArena(cfg) {
    // Block Fort Donut 64 Battle Arena (130 x 130 walled arena with 4 colored forts!)
    const arenaSize = 130;
    const half = arenaSize * 0.5;
    this.roadWidth = arenaSize;

    // Floor
    const floorGeo = new THREE.PlaneGeometry(arenaSize, arenaSize);
    floorGeo.rotateX(-Math.PI / 2);
    const floorMesh = new THREE.Mesh(
      floorGeo,
      createCelMaterial({ hexColor: cfg.roadColor, rimStrength: 0.05 })
    );
    floorMesh.receiveShadow = true;
    this.root.add(floorMesh);

    const groundCol = this.RAPIER.ColliderDesc.cuboid(half, 0.5, half).setTranslation(0, -0.5, 0);

    // Outer perimeter walls
    const wallHeight = 7.0;

    for (const wc of wallConfigs) {

      const colDesc = this.RAPIER.ColliderDesc.cuboid(wc.w * 0.5, wallHeight * 0.5, wc.d * 0.5)
        .setTranslation(wc.x, wallHeight * 0.5, wc.z);
      this.colliders.push(this.world.createCollider(colDesc));
    }

    // 4 Colored Block Forts in the 4 quadrants
    const forts = [
      { x: -28, z: -28, color: 0xff3333 },
      { x: 28, z: -28, color: 0x2266ff },
      { x: -28, z: 28, color: 0x22cc44 },
      { x: 28, z: 28, color: 0xffcc00 }
    ];
    for (const f of forts) {
      const fortMesh = createCelMesh(
        new THREE.BoxGeometry(20, 6.0, 20),

      );
      fortMesh.position.set(f.x, 3.0, f.z);
      this.root.add(fortMesh);

      const colDesc = this.RAPIER.ColliderDesc.cuboid(10, 3.0, 10).setTranslation(f.x, 3.0, f.z);
      this.colliders.push(this.world.createCollider(colDesc));
      this.hazards.push({ type: 'fort_pillar', position: new THREE.Vector3(f.x, 0, f.z), halfExtent: 10.5 });
    }

    // Central Donut Ring Bumper
    const centerPillar = createCelMesh(
      new THREE.CylinderGeometry(8, 9, 5.5, 16),
      { hexColor: 0xff5522 },
      0.08
    );
    centerPillar.position.set(0, 2.75, 0);
    this.root.add(centerPillar);
    this.colliders.push(
      this.world.createCollider(this.RAPIER.ColliderDesc.cylinder(2.75, 8.5).setTranslation(0, 2.75, 0))
    );
    this.hazards.push({ type: 'pipe', position: new THREE.Vector3(0, 0, 0), radius: 9.0, height: 5.5 });

    // 8 Spawn positions around the arena lanes
    const spawnCoords = [
      { x: 0, z: -48, yaw: Math.PI },
      { x: 0, z: 48, yaw: 0 },
      { x: -48, z: 0, yaw: -Math.PI / 2 },
      { x: 48, z: 0, yaw: Math.PI / 2 },
      { x: -48, z: -48, yaw: -Math.PI * 0.75 },
      { x: 48, z: -48, yaw: Math.PI * 0.75 },
      { x: -48, z: 48, yaw: -Math.PI * 0.25 },
      { x: 48, z: 48, yaw: Math.PI * 0.25 }
    ];
    for (const sc of spawnCoords) {
      this.startTransforms.push({
        position: new THREE.Vector3(sc.x, 0.5, sc.z),
        yaw: sc.yaw,
        startT: 0
      });
    }

    // 16 Item Box spawns in Battle Arena
    const boxRing = [
      [0, -28], [0, 28], [-28, 0], [28, 0],
      [-48, -24], [48, -24], [-48, 24], [48, 24],
      [-24, -48], [24, -48], [-24, 48], [24, 48],
      [-14, -14], [14, -14], [-14, 14], [14, 14]
    ];
    for (const [bx, bz] of boxRing) {
      this.itemBoxSpawns.push(new THREE.Vector3(bx, 1.55, bz));
    }

    // 4 Boost pads in outer lanes
    const boostMat = createBoostPadMaterial();
    const boostGeo = new THREE.PlaneGeometry(5, 7);
    boostGeo.rotateX(-Math.PI / 2);
    for (const [px, pz, pyaw] of [[0, -54, Math.PI / 2], [0, 54, Math.PI / 2], [-54, 0, 0], [54, 0, 0]]) {
      const pPos = new THREE.Vector3(px, 0.1, pz);
      const pm = new THREE.Mesh(boostGeo, boostMat);
      pm.position.copy(pPos);
      pm.rotation.y = pyaw;
      this.root.add(pm);
      this.boostPads.push({ position: pPos, radius: 4.5 });
    }
  }

  getTrackPointAt(t) {
    if (this.isBattle || !this.curve) {
      return {
        t: 0,
        point: new THREE.Vector3(0, 0, 0),
        tangent: new THREE.Vector3(0, 0, -1),
        right: new THREE.Vector3(1, 0, 0),
        normal: new THREE.Vector3(0, 1, 0)
      };
    }
    const wrappedT = ((t % 1.0) + 1.0) % 1.0;
    const idx = Math.min(
      this.trackSamples.length - 1,
      Math.floor(wrappedT * (this.trackSamples.length - 1))
    );
    return this.trackSamples[idx];
  }

  getClosestTrackSample(worldPos) {
    if (this.isBattle || this.trackSamples.length === 0) {
      return {
        t: 0,
        point: new THREE.Vector3(worldPos.x, 0, worldPos.z),
        tangent: new THREE.Vector3(0, 0, -1),
        right: new THREE.Vector3(1, 0, 0),
        lateralOffset: 0,
        distSq: 0
      };
    }
    let bestIdx = 0;
    let bestDistSq = Infinity;
    for (let i = 0; i < this.trackSamples.length; i++) {
      const p = this.trackSamples[i].point;
      const dx = worldPos.x - p.x;
      const dz = worldPos.z - p.z;
      const dSq = dx * dx + dz * dz;
      if (dSq < bestDistSq) {
        bestDistSq = dSq;
        bestIdx = i;
      }
    }
    const sample = this.trackSamples[bestIdx];
    const rel = new THREE.Vector3().subVectors(worldPos, sample.point);
    const lateralOffset = rel.dot(sample.right);
    return {
      ...sample,
      lateralOffset,
      distSq: bestDistSq
    };
  }

  update(dt, elapsed, karts, audio) {
    // Animate swaying trees
    for (const prop of this.animatedProps) {
      if (prop.type === 'sway') {
        prop.mesh.rotation.z = Math.sin(elapsed * 2.2 + prop.phase) * 0.05;
      }
    }

    // Animate Thwomps & check hazard collisions
    for (const h of this.hazards) {
      if (h.type === 'thwomp') {
        const cycle = (elapsed * 1.3 + h.phase) % 4.0;
        let heightOffset = 8.5;
        if (cycle < 0.35) {
          // Slam down!
          heightOffset = Math.max(1.9, 8.5 - (cycle / 0.35) * 6.6);
        } else if (cycle < 1.25) {
          // Resting on road
          heightOffset = 1.9;
        } else if (cycle < 2.8) {
          // Rising back up
          heightOffset = 1.9 + ((cycle - 1.25) / 1.55) * 6.6;
        }
        h.isDown = heightOffset < 3.6;
        h.mesh.position.y = h.basePos.y + heightOffset;
        h.position.copy(h.mesh.position);
      }

      // Check collision against karts
      for (const kart of karts) {
        if (kart.isGhost) continue;
        const dx = kart.position.x - h.position.x;
        const dz = kart.position.z - h.position.z;
        if (h.type === 'thwomp' && h.isDown) {
          if (dx * dx + dz * dz < (h.radius + 1.1) ** 2) {
            if (kart.starTimer <= 0 && kart.spinOutTimer <= 0) {
              kart.triggerSpinOut(1.3, true);
              if (kart.isHuman && audio) audio.playHitExplosion();
            }
          }
        } else if (h.type === 'pipe') {
          const distSq = dx * dx + dz * dz;
          const minR = h.radius + 1.15;
          if (distSq < minR * minR && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const nz = dz / dist;
            kart.position.x = h.position.x + nx * minR;
            kart.position.z = h.position.z + nz * minR;
            kart.speed *= 0.65;
          }
        } else if (h.type === 'fort_pillar') {
          const extent = h.halfExtent + 1.1;
          if (Math.abs(dx) < extent && Math.abs(dz) < extent) {
            if (Math.abs(dx) > Math.abs(dz)) {
              kart.position.x = h.position.x + Math.sign(dx) * extent;
            } else {
              kart.position.z = h.position.z + Math.sign(dz) * extent;
            }
            kart.speed *= 0.6;
          }
        }
      }
    }
  }
}

// 3D Cel-Shaded Kart & Character Model, Procedural Animation, Rapier Physics & AI Controller
class Kart {
  constructor({
    index,
    driver,
    isHuman = false,
    playerIndex = 0,
    isGhost = false,
    scene,
    rapierWorld,
    RAPIER
  }) {
    this.index = index;
    this.driver = driver;
    this.isHuman = isHuman;
    this.playerIndex = playerIndex;
    this.isGhost = isGhost;
    this.scene = scene;
    this.world = rapierWorld;
    this.RAPIER = RAPIER;

    this.position = new THREE.Vector3();
    this.velocity = new THREE.Vector3();
    this.yaw = 0;
    this.speed = 0;
    this.steerAngle = 0;

    // Hop & Drift state
    this.hopY = 0;
    this.hopVelY = 0;
    this.isDrifting = false;
    this.driftDir = 0; // -1 left, +1 right
    this.driftCharge = 0;
    this.driftTier = 0; // 0, 1 (Blue), 2 (Orange), 3 (Purple)

    // Boosts & statuses
    this.boostTimer = 0;
    this.boostStrength = 0;
    this.starTimer = 0;
    this.shrinkTimer = 0;
    this.booTimer = 0;
    this.spinOutTimer = 0;
    this.tumbleTimer = 0;
    this.rescueTimer = 0;
    this.draftTimer = 0;

    // Rocket start charge during countdown
    this.rocketCharge = 0;
    this.rocketBurnout = false;

    // Race & Battle state
    this.lap = 1;
    this.maxLaps = 3;
    this.trackT = 0;
    this.lastCheckpointT = 0;
    this.totalProgress = 0;
    this.rank = index + 1;
    this.finished = false;
    this.finishTime = 0;
    this.isWrongWay = false;
    this.wrongWayTimer = 0;
    this.offRoadFactor = 0;
    this.points = 0;

    // Items & Battle balloons
    this.heldItem = null;
    this.heldItemCharges = 0;
    this.goldenMushroomTimer = 0;
    this.rouletteTimer = 0;
    this.orbitShells = 0;
    this.balloons = 3;
    this.eliminated = false;

    // AI state
    this.aiTargetOffset = (Math.random() - 0.5) * 5.0;
    this.aiLaneTimer = 1.5 + Math.random() * 2.5;
    this.aiItemDelay = 1.0 + Math.random() * 2.0;

    // Build 3D hierarchy
    this.root = new THREE.Group();

      );
      dome.position.y = 0.05;
      const visor = createCelMesh(

    this.steeringWheel.rotation.x = -0.55;

    this.sparkL.position.set(-1.05, 0.25, 0.95);

      const sm = createCelMesh(shellGeo, { hexColor: 0x22cc44 }, 0.03);

      new THREE.Vector3(-0.48, 0.1, 0),
      new THREE.Vector3(0.48, 0.1, 0),
      new THREE.Vector3(0, 0.55, -0.15)
    ];

  _initRapierBody() {
    if (this.isGhost || !this.world || !this.RAPIER) return;
    const bodyDesc = this.RAPIER.RigidBodyDesc.dynamic()
      .setTranslation(0, 1, 0)
      .setLinearDamping(1.5)
      .setAngularDamping(5.0)
      .lockRotations();
    this.rigidBody = this.world.createRigidBody(bodyDesc);
    const colDesc = this.RAPIER.ColliderDesc.ball(1.05)
      .setRestitution(0.35)
      .setFriction(0.1)
      .setMass(this.driver.mass);
    this.collider = this.world.createCollider(colDesc, this.rigidBody);
  }

  destroy() {
    if (this.rigidBody && this.world) {
      try {
        this.world.removeRigidBody(this.rigidBody);
      } catch (e) {}
      this.rigidBody = null;
    }
    if (this.root && this.scene) {
      this.scene.remove(this.root);
    }
  }

  resetAtTransform(transform, isBattle = false, maxLaps = 3) {
    this.position.copy(transform.position);
    this.yaw = transform.yaw;
    this.speed = 0;
    this.velocity.set(0, 0, 0);
    this.hopY = 0;
    this.hopVelY = 0;
    this.isDrifting = false;
    this.driftDir = 0;
    this.driftCharge = 0;
    this.driftTier = 0;

    this.boostTimer = 0;
    this.boostStrength = 0;
    this.starTimer = 0;
    this.shrinkTimer = 0;
    this.booTimer = 0;
    this.spinOutTimer = 0;
    this.tumbleTimer = 0;
    this.rescueTimer = 0;
    this.draftTimer = 0;
    this.rocketCharge = 0;
    this.rocketBurnout = false;

    this.lap = 1;
    this.maxLaps = maxLaps;
    this.trackT = transform.startT || 0;
    this.lastCheckpointT = this.trackT;
    this.totalProgress = 0;
    this.finished = false;
    this.finishTime = 0;
    this.isWrongWay = false;
    this.wrongWayTimer = 0;

    this.heldItem = null;
    this.heldItemCharges = 0;
    this.goldenMushroomTimer = 0;
    this.rouletteTimer = 0;
    this.orbitShells = 0;
    this.balloons = 3;
    this.eliminated = false;
    this.balloonGroup.visible = isBattle;
    this.updateBalloonsVisual();

    if (this.rigidBody) {
      this.rigidBody.setTranslation(
        { x: this.position.x, y: this.position.y + 0.6, z: this.position.z },
        true
      );
      this.rigidBody.setLinvel({ x: 0, y: 0, z: 0 }, true);
    }
    this.syncVisuals(0, 0);
  }

  updateBalloonsVisual() {
    for (let i = 0; i < 3; i++) {
      this.balloonMeshes[i].visible = i < this.balloons;
    }
  }

  triggerBoost(duration = 1.1, strength = 15.0, audio = null) {
    this.boostTimer = Math.max(this.boostTimer, duration);
    this.boostStrength = Math.max(this.boostStrength, strength);
    this.speed = Math.max(this.speed, this.driver.topSpeed * 0.92 + strength * 0.55);
    if (this.isHuman && audio) audio.playBoost();
  }

  triggerSpinOut(duration = 1.1, isExplosion = false, audio = null, isBattle = false) {
    if (this.starTimer > 0 || this.booTimer > 0 || this.rescueTimer > 0) return;
    if (this.orbitShells > 0) {
      // Orbiting shell absorbs the hit!
      this.orbitShells--;
      if (this.isHuman && audio) audio.playShellBounce();
      return;
    }
    if (isExplosion) {
      this.tumbleTimer = duration;
    } else {
      this.spinOutTimer = duration;
    }
    this.speed *= 0.25;
    this.isDrifting = false;
    this.driftCharge = 0;
    this.driftTier = 0;

    if (isBattle && !this.eliminated) {
      this.balloons = Math.max(0, this.balloons - 1);
      this.updateBalloonsVisual();
      if (this.balloons <= 0) {
        this.eliminated = true;
      }
    }
    if (this.isHuman && audio) {
      if (isExplosion) audio.playHitExplosion();
      else audio.playSpinOut();
    }
  }

  updateCountdownInput(dt, controls, countdownTimeLeft) {
    // MK64 Rocket Start mechanic: holding accelerate starting below 1.65s gives Rocket Start;
    // holding too early (> 2.2s) overcharges and causes start burnout!
    if (controls.accel) {
      if (countdownTimeLeft > 2.25) {
        this.rocketBurnout = true;
      } else {
        this.rocketCharge += dt;
      }
    } else {
      this.rocketCharge = Math.max(0, this.rocketCharge - dt * 0.5);
    }
  }

  applyCountdownLaunch(audio) {
    if (this.rocketBurnout) {
      this.spinOutTimer = 0.85;
      if (this.isHuman && audio) audio.playSpinOut();
    } else if (this.rocketCharge > 0.45) {
      this.triggerBoost(1.25, 16.5, audio);
    }
    this.rocketCharge = 0;
    this.rocketBurnout = false;
  }

  update(dt, elapsed, controls, track, speedMult = 1.0, audio = null) {
    if (this.isGhost || this.eliminated) return;

    // Decrement active timers
    if (this.boostTimer > 0) this.boostTimer -= dt;
    if (this.starTimer > 0) this.starTimer -= dt;
    if (this.shrinkTimer > 0) this.shrinkTimer -= dt;
    if (this.booTimer > 0) this.booTimer -= dt;
    if (this.goldenMushroomTimer > 0) {
      this.goldenMushroomTimer -= dt;
      if (this.goldenMushroomTimer <= 0 && this.heldItem === 'golden_mushroom') {
        this.heldItem = null;
      }
    }
    if (this.rouletteTimer > 0) {
      this.rouletteTimer -= dt;
      if (this.rouletteTimer <= 0 && this.isHuman && audio) {
        audio.playItemLock();
      }
    }

    // Lakitu rescue state
    if (this.rescueTimer > 0) {
      this.rescueTimer -= dt;
      this.lakituGroup.visible = true;
      this.hopY = Math.sin((1.2 - this.rescueTimer) * Math.PI) * 3.0;
      if (this.rescueTimer <= 0) {
        this.hopY = 0;
        this.lakituGroup.visible = false;
      }
      this.syncVisuals(dt, elapsed);
      return;
    }

    // Spin-out or Tumble state
    if (this.spinOutTimer > 0 || this.tumbleTimer > 0) {
      if (this.spinOutTimer > 0) this.spinOutTimer -= dt;
      if (this.tumbleTimer > 0) this.tumbleTimer -= dt;
      this.speed = Math.max(0, this.speed - 28 * dt);
    } else {
      // Hop & Drift state machine
      if (controls.driftJustPressed && this.hopY <= 0.01 && Math.abs(this.speed) > 10) {
        this.hopVelY = 6.5;
        if (this.isHuman && audio) audio.playHop();
      }

      if (this.hopY > 0 || this.hopVelY > 0) {
        this.hopY += this.hopVelY * dt;
        this.hopVelY -= 26.0 * dt;
        if (this.hopY <= 0) {
          this.hopY = 0;
          this.hopVelY = 0;
          // Landed from hop: start drift if holding drift button + steering
          if (controls.driftHop && Math.abs(controls.steer) > 0.2 && this.speed > 18) {
            this.isDrifting = true;
            this.driftDir = Math.sign(controls.steer);
            this.driftCharge = 0;
            this.driftTier = 0;
          }
        }
      }

      if (this.isDrifting) {
        if (!controls.driftHop || this.speed < 14) {
          // Release drift -> trigger Mini-Turbo if charged!
          if (this.driftTier >= 1) {
            const boostDur = this.driftTier === 1 ? 0.65 : this.driftTier === 2 ? 1.1 : 1.65;
            const boostPow = this.driftTier === 1 ? 11.0 : this.driftTier === 2 ? 15.0 : 19.5;
            this.triggerBoost(boostDur, boostPow, audio);
          }
          this.isDrifting = false;
          this.driftDir = 0;
          this.driftCharge = 0;
          this.driftTier = 0;
        } else {
          // Charge Mini-Turbo sparks while drifting
          const steerMatch = controls.steer * this.driftDir > 0 ? 1.35 : 0.75;
          this.driftCharge += dt * steerMatch;
          const prevTier = this.driftTier;
          if (this.driftCharge > 2.15) this.driftTier = 3;
          else if (this.driftCharge > 1.25) this.driftTier = 2;
          else if (this.driftCharge > 0.55) this.driftTier = 1;
          if (this.driftTier > prevTier && this.isHuman && audio) {
            audio.playDriftSpark(this.driftTier);
          }
        }
      }

      // Steering
      const turnRate = this.driver.handlingRate;
      if (this.isDrifting) {
        const slideSteer = this.driftDir * 0.68 + controls.steer * 0.52;
        this.yaw -= slideSteer * turnRate * 1.12 * dt;
      } else {
        const speedTurnFactor = Math.min(1.0, Math.abs(this.speed) / 10 + 0.35);
        this.yaw -= controls.steer * turnRate * speedTurnFactor * dt;
      }
      this.steerAngle = controls.steer;

      // Top speed & Acceleration
      let maxSpd = this.driver.topSpeed * speedMult;
      if (this.shrinkTimer > 0) maxSpd *= 0.68;
      if (this.starTimer > 0) maxSpd *= 1.18;
      if (this.boostTimer > 0) maxSpd += this.boostStrength;
      if (this.offRoadFactor > 0 && this.boostTimer <= 0 && this.starTimer <= 0) {
        maxSpd *= (1.0 - this.offRoadFactor * 0.42);
      }

      if (controls.accel) {
        const accel = this.driver.accelRate * (this.boostTimer > 0 ? 2.2 : 1.0);
        if (this.speed < maxSpd) {
          this.speed = Math.min(maxSpd, this.speed + accel * dt);
        } else {
          this.speed = Math.max(maxSpd, this.speed - 18.0 * dt);
        }
      } else if (controls.brake) {
        this.speed = Math.max(-14.0, this.speed - 38.0 * dt);
      } else {
        // Natural coasting drag
        if (this.speed > 0) this.speed = Math.max(0, this.speed - 16.0 * dt);
        else if (this.speed < 0) this.speed = Math.min(0, this.speed + 16.0 * dt);
      }
    }

    // Forward movement vector
    const fwdX = -Math.sin(this.yaw);
    const fwdZ = -Math.cos(this.yaw);
    const driftSlipAngle = this.isDrifting ? this.driftDir * 0.24 : 0;
    const moveX = -Math.sin(this.yaw + driftSlipAngle) * this.speed;
    const moveZ = -Math.cos(this.yaw + driftSlipAngle) * this.speed;

    // Step via Rapier RigidBody velocity & read back resolved X/Z
    if (this.rigidBody) {
      const curVel = this.rigidBody.linvel();
      this.rigidBody.setLinvel({ x: moveX, y: curVel.y, z: moveZ }, true);
      const rPos = this.rigidBody.translation();
      this.position.x = rPos.x;
      this.position.z = rPos.z;
    } else {
      this.position.x += moveX * dt;
      this.position.z += moveZ * dt;
    }

    // Track spline projection, elevation & off-road / Lakitu rescue check
    if (!track.isBattle) {
      const sample = track.getClosestTrackSample(this.position);
      const halfW = track.roadWidth * 0.5;
      const absLat = Math.abs(sample.lateralOffset);

      // Smoothly follow track elevation
      this.position.y = THREE.MathUtils.lerp(this.position.y, sample.point.y, Math.min(1, dt * 15));

      if (track.courseConfig.theme === 'rainbow') {
        // Rainbow Road: falling off the edge triggers Lakitu Rescue!
        if (absLat > halfW + 3.2) {
          this._triggerLakituRescue(sample, audio);
          return;
        }
        this.offRoadFactor = 0;
      } else {
        if (absLat > halfW + 16.0) {
          // Soft outer guardrail clamp
          const sign = Math.sign(sample.lateralOffset);
          const clamped = sample.point.clone().addScaledVector(sample.right, sign * (halfW + 15.8));
          this.position.x = clamped.x;
          this.position.z = clamped.z;
          this.speed *= 0.85;
        }
        this.offRoadFactor = absLat > halfW + 1.2 ? Math.min(1.0, (absLat - halfW) / 6.0) : 0;
      }

      // Check wrong-way driving
      const dotTangent = fwdX * sample.tangent.x + fwdZ * sample.tangent.z;
      if (dotTangent < -0.35 && this.speed > 5) {
        this.wrongWayTimer += dt;
        this.isWrongWay = this.wrongWayTimer > 0.65;
      } else {
        this.wrongWayTimer = 0;
        this.isWrongWay = false;
      }

      // Lap & Checkpoint progression
      const prevT = this.trackT;
      this.trackT = sample.t;
      const deltaT = this.trackT - prevT;

      if (Math.abs(this.trackT - this.lastCheckpointT) < 0.28 || (this.lastCheckpointT > 0.78 && this.trackT < 0.22)) {
        if (this.lastCheckpointT > 0.82 && this.trackT < 0.18 && deltaT < -0.5) {
          // Crossed finish line forward!
          this.lap++;
          this.lastCheckpointT = this.trackT;
          if (this.lap > this.maxLaps && !this.finished) {
            this.finished = true;
          } else if (this.isHuman && audio) {
            audio.playLapFanfare(this.lap === this.maxLaps);
          }
        } else if (this.trackT > this.lastCheckpointT) {
          this.lastCheckpointT = this.trackT;
        }
      }
      this.totalProgress = (this.lap - 1) + this.trackT;
    } else {
      // Battle Arena boundary clamp
      this.position.y = 0;
      const limit = 61.5;
      if (Math.abs(this.position.x) > limit) {
        this.position.x = Math.sign(this.position.x) * limit;
        this.speed *= 0.7;
      }
      if (Math.abs(this.position.z) > limit) {
        this.position.z = Math.sign(this.position.z) * limit;
        this.speed *= 0.7;
      }
    }

    // Keep Rapier body synced to track elevation
    if (this.rigidBody) {
      this.rigidBody.setTranslation(
        { x: this.position.x, y: this.position.y + 0.65, z: this.position.z },
        true
      );
    }

    // Check Boost Pads
    for (const pad of track.boostPads) {
      const dx = this.position.x - pad.position.x;
      const dz = this.position.z - pad.position.z;
      if (dx * dx + dz * dz < pad.radius * pad.radius) {
        this.triggerBoost(0.95, 15.5, audio);
      }
    }

    this.syncVisuals(dt, elapsed);
  }

  _triggerLakituRescue(sample, audio) {
    this.rescueTimer = 1.15;
    this.position.copy(sample.point);
    this.yaw = Math.atan2(-sample.tangent.x, -sample.tangent.z);
    this.speed = 0;
    this.isDrifting = false;
    this.driftTier = 0;
    if (this.rigidBody) {
      this.rigidBody.setTranslation(
        { x: this.position.x, y: this.position.y + 0.65, z: this.position.z },
        true
      );
      this.rigidBody.setLinvel({ x: 0, y: 0, z: 0 }, true);
    }
    if (this.isHuman && audio) audio.playSpinOut();
  }

  syncVisuals(dt, elapsed) {
    this.root.position.set(this.position.x, this.position.y + this.hopY, this.position.z);
    this.root.rotation.y = this.yaw;

    // Scale for Lightning Shrink or Hop Squash-and-Stretch
    const shrinkScale = this.shrinkTimer > 0 ? 0.56 : 1.0;
    const hopStretch = this.hopY > 0.05 ? 1.14 : 1.0;
    const hopSquash = this.hopY > 0.05 ? 0.92 : 1.0;
    this.visualGroup.scale.set(
      shrinkScale * hopSquash,
      shrinkScale * hopStretch,
      shrinkScale * hopSquash
    );

    // Spin-out & Tumble rotations + Drift body roll
    if (this.tumbleTimer > 0) {
      this.visualGroup.rotation.x = elapsed * 14.0;
      this.visualGroup.rotation.y = elapsed * 10.0;
      this.visualGroup.position.y = Math.abs(Math.sin(elapsed * 10.0)) * 2.2;
    } else if (this.spinOutTimer > 0) {
      this.visualGroup.rotation.x = 0;
      this.visualGroup.rotation.y = elapsed * 16.0;
      this.visualGroup.position.y = 0;
    } else {
      this.visualGroup.rotation.x = (this.boostTimer > 0 ? -0.06 : 0);
      this.visualGroup.rotation.y = this.isDrifting ? -this.driftDir * 0.28 : 0;
      this.visualGroup.rotation.z = -this.steerAngle * 0.12 - (this.isDrifting ? this.driftDir * 0.1 : 0);
      this.visualGroup.position.y = 0;
    }

    // Animate Wheels, Steering Wheel & Driver Lean
    const wheelSpin = this.speed * dt * 1.8;
    for (const w of this.wheels) {
      w.rotation.x -= wheelSpin;
    }
    for (const fp of this.frontWheelPivots) {
      fp.rotation.y = -this.steerAngle * 0.45;
    }
    if (this.steeringWheel) {
      this.steeringWheel.rotation.z = -this.steerAngle * 0.65;
    }
    if (this.driverPivot) {
      this.driverPivot.rotation.z = -this.steerAngle * 0.18;
      this.headGroup.rotation.y = -this.steerAngle * 0.28;
    }

    // Exhaust vibration & Boost Flames
    const boosting = this.boostTimer > 0 || this.starTimer > 0;
    this.flameL.visible = boosting;
    this.flameR.visible = boosting;
    if (boosting) {
      const fScale = 0.85 + Math.sin(elapsed * 45) * 0.25;
      this.flameL.scale.set(fScale, fScale, fScale * 1.3);
      this.flameR.scale.set(fScale, fScale, fScale * 1.3);
      this.flameMat.color.setHex(this.starTimer > 0 ? 0x00ffff : 0xff6600);
    }

    // Drift Spark visibility & Tier colors
    this.sparkGroup.visible = this.isDrifting && this.driftTier > 0;
    if (this.sparkGroup.visible) {
      const sparkColor = this.driftTier === 1 ? 0x22aaff : this.driftTier === 2 ? 0xff7700 : 0xff22ff;
      this.sparkMat.color.setHex(sparkColor);
      const sPulse = 0.8 + Math.sin(elapsed * 38) * 0.35;
      this.sparkL.scale.setScalar(sPulse);
      this.sparkR.scale.setScalar(sPulse);
    }

    // Starman Rainbow flash or Boo Ghost translucency
    if (this.starTimer > 0 && this.chassisMesh) {
      const hue = (elapsed * 2.5) % 1.0;
      this.chassisMesh.material.color.setHSL(hue, 1.0, 0.55);
    } else if (this.chassisMesh) {
      this.chassisMesh.material.color.setHex(this.driver.bodyColor);
    }

    // Orbiting Triple Shells
    for (let i = 0; i < 3; i++) {
      const m = this.orbitMeshes[i];
      m.visible = i < this.orbitShells;
      if (m.visible) {
        const ang = elapsed * 4.2 + (i * Math.PI * 2) / 3;
        m.position.set(Math.cos(ang) * 1.75, 0, Math.sin(ang) * 1.75);
      }
    }

    // Lakitu Wrong-Way hover
    if (this.isWrongWay && this.rescueTimer <= 0) {
      this.lakituGroup.visible = true;
      this.lakituGroup.position.y = 3.2 + Math.sin(elapsed * 6.0) * 0.25;
    } else if (this.rescueTimer <= 0) {
      this.lakituGroup.visible = false;
    }
  }

  computeAIControls(dt, track, allKarts, aiSkill = 0.95) {
    let steer = 0;
    let accel = true;
    let brake = false;
    let driftHop = false;
    let driftJustPressed = false;
    let useItemJustPressed = false;

    this.aiLaneTimer -= dt;
    if (this.aiLaneTimer <= 0) {
      this.aiLaneTimer = 1.8 + Math.random() * 2.5;
      this.aiTargetOffset = (Math.random() - 0.5) * (track.roadWidth * 0.45);
    }

    if (track.isBattle) {
      // Battle Mode AI: steer toward nearest living opponent kart!
      let nearest = null;
      let bestDistSq = Infinity;
      for (const other of allKarts) {
        if (other === this || other.eliminated || other.isGhost) continue;
        const dx = other.position.x - this.position.x;
        const dz = other.position.z - this.position.z;
        const dSq = dx * dx + dz * dz;
        if (dSq < bestDistSq) {
          bestDistSq = dSq;
          nearest = other;
        }
      }
      if (nearest) {
        const targetYaw = Math.atan2(-(nearest.position.x - this.position.x), -(nearest.position.z - this.position.z));
        let diff = targetYaw - this.yaw;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        steer = Math.max(-1, Math.min(1, -diff * 2.2));
      }
    } else {
      // Race Course AI: look ahead along the track spline
      const lookAheadT = (this.trackT + 18.0 / track.totalLength) % 1.0;
      const targetSample = track.getTrackPointAt(lookAheadT);
      const targetPt = targetSample.point.clone().addScaledVector(targetSample.right, this.aiTargetOffset);

      const dx = targetPt.x - this.position.x;
      const dz = targetPt.z - this.position.z;
      const desiredYaw = Math.atan2(-dx, -dz);
      let angleDiff = desiredYaw - this.yaw;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

      steer = Math.max(-1, Math.min(1, -angleDiff * 2.6));

      // AI power-slide drifting on sharp corners!
      if (Math.abs(angleDiff) > 0.34 && this.speed > 28) {
        if (!this.isDrifting && this.hopY <= 0.01) {
          driftJustPressed = true;
        }
        driftHop = true;
      } else if (this.isDrifting && this.driftTier >= 2) {
        // Release drift to cash in Mini-Turbo!
        driftHop = false;
      } else if (this.isDrifting) {
        driftHop = Math.abs(angleDiff) > 0.15;
      }
    }

    // AI item usage
    if (this.heldItem && this.rouletteTimer <= 0) {
      this.aiItemDelay -= dt;
      if (this.aiItemDelay <= 0) {
        useItemJustPressed = true;
        this.aiItemDelay = 1.2 + Math.random() * 2.0;
      }
    }

    // Attract mode cheat: periodic automatic mini-turbos & items for spectacle!
    if (this.attractCheat && Math.random() < dt * 0.45 && this.boostTimer <= 0) {
      this.triggerBoost(0.9, 14.0, null);
    }

    return { steer, accel, brake, driftHop, driftJustPressed, useItemJustPressed };
  }
}
