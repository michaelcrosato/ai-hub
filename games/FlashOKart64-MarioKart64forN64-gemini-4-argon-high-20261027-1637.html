// src/items.js
// Item Box Spawner, Roulette Logic, and 12 Active MK64 Item Projectiles & Hazards
class ItemManager {
  constructor(scene, audio) {
    this.scene = scene;
    this.audio = audio;
    this.root = new THREE.Group();
    this.scene.add(this.root);

    this.itemBoxes = [];
    this.projectiles = [];
    this.explosions = [];
    this.lightningFlashTimer = 0;
  }

  clear() {
    this.itemBoxes = [];
    this.projectiles = [];
    this.explosions = [];
    this.lightningFlashTimer = 0;
    while (this.root.children.length > 0) {
      const c = this.root.children.pop();
      this.root.remove(c);
    }
  }

  spawnCourseItemBoxes(spawnPositions) {
    this.clear();
    const boxGeo = new THREE.OctahedronGeometry(1.05, 0);
    const coreGeo = new THREE.BoxGeometry(0.65, 0.65, 0.65);
    const boxColors = [0xff3366, 0x33ccff, 0xffdd22, 0x44ee66];

    spawnPositions.forEach((pos, i) => {
      const group = new THREE.Group();
      group.position.copy(pos);

      const outer = createCelMesh(
        boxGeo,
        {
          hexColor: boxColors[i % boxColors.length],
          transparent: true,
          opacity: 0.78,
          emissiveHex: boxColors[i % boxColors.length],
          emissiveIntensity: 0.25
        },
        0.04,
        false,
        false
      );
      const inner = createCelMesh(
        coreGeo,
        { hexColor: 0xffffff, emissiveHex: 0xffff88, emissiveIntensity: 0.4 },
        0,
        false,
        false
      );
      group.add(outer, inner);
      this.root.add(group);

      this.itemBoxes.push({
        group,
        outer,
        inner,
        basePos: pos.clone(),
        respawnTimer: 0,
        phase: i * 0.65
      });
    });
  }

  useKartItem(kart, allKarts, track) {
    if (!kart.heldItem && kart.orbitShells <= 0) return;
    if (kart.rouletteTimer > 0) return;

    // If kart has orbiting triple shells, pressing Use Item fires one forward
    if (kart.orbitShells > 0 && (!kart.heldItem || kart.heldItem === 'triple_green')) {
      kart.orbitShells--;
      if (kart.orbitShells <= 0 && kart.heldItem === 'triple_green') {
        kart.heldItem = null;
      }
      this._spawnShell(kart, 'green', track, allKarts);
      if (kart.isHuman && this.audio) this.audio.playShellShoot();
      return;
    }

    const item = kart.heldItem;
    if (!item) return;

    switch (item) {
      case 'mushroom':
        kart.triggerBoost(1.3, 17.5, this.audio);
        kart.heldItem = null;
        break;

      case 'triple_mushroom':
        kart.triggerBoost(1.25, 17.0, this.audio);
        kart.heldItemCharges--;
        if (kart.heldItemCharges <= 0) {
          kart.heldItem = null;
        }
        break;

      case 'golden_mushroom':
        if (kart.goldenMushroomTimer <= 0) {
          kart.goldenMushroomTimer = 6.0;
        }
        kart.triggerBoost(1.05, 17.5, this.audio);
        break;

      case 'green_shell':
        this._spawnShell(kart, 'green', track, allKarts);
        if (kart.isHuman && this.audio) this.audio.playShellShoot();
        kart.heldItem = null;
        break;

      case 'triple_green':
        kart.orbitShells = 3;
        if (kart.isHuman && this.audio) this.audio.playItemLock();
        break;

      case 'red_shell':
        this._spawnShell(kart, 'red', track, allKarts);
        if (kart.isHuman && this.audio) this.audio.playShellShoot();
        kart.heldItem = null;
        break;

      case 'blue_shell':
        this._spawnShell(kart, 'blue', track, allKarts);
        if (kart.isHuman && this.audio) this.audio.playShellShoot();
        kart.heldItem = null;
        break;

      case 'banana':
        this._spawnHazardDrop(kart, 'banana');
        if (kart.isHuman && this.audio) this.audio.playHop();
        kart.heldItem = null;
        break;

      case 'fake_box':
        this._spawnHazardDrop(kart, 'fake_box');
        if (kart.isHuman && this.audio) this.audio.playHop();
        kart.heldItem = null;
        break;

      case 'star':
        kart.starTimer = 7.5;
        kart.triggerBoost(7.5, 10.5, this.audio);
        kart.heldItem = null;
        break;

      case 'lightning':
        this.lightningFlashTimer = 0.45;
        if (this.audio) this.audio.playLightning();
        for (const other of allKarts) {
          if (other !== kart && !other.isGhost && other.starTimer <= 0 && other.booTimer <= 0) {
            other.shrinkTimer = 7.0;
            other.triggerSpinOut(0.75, false, null, track.isBattle);
          }
        }
        kart.heldItem = null;
        break;

      case 'boo': {
        kart.booTimer = 5.5;
        // Steal an item from another racer or grant a Dash Mushroom
        let stolen = 'mushroom';
        for (const other of allKarts) {
          if (other !== kart && other.heldItem && other.heldItem !== 'boo') {
            stolen = other.heldItem;
            other.heldItem = null;
            break;
          }
        }
        kart.heldItem = stolen;
        kart.heldItemCharges = stolen === 'triple_mushroom' ? 3 : 1;
        if (kart.isHuman && this.audio) this.audio.playItemLock();
        break;
      }
    }
  }

  _spawnShell(owner, shellType, track, allKarts) {
    const fwdX = -Math.sin(owner.yaw);
    const fwdZ = -Math.cos(owner.yaw);
    const spawnPos = new THREE.Vector3(
      owner.position.x + fwdX * 2.4,
      owner.position.y + 0.55,
      owner.position.z + fwdZ * 2.4
    );

    const hex = shellType === 'green' ? 0x22cc44 : shellType === 'red' ? 0xff2222 : 0x1188ff;
    const shellGeo = new THREE.SphereGeometry(0.58, 12, 10);
    const mesh = createCelMesh(
      shellGeo,
      { hexColor: hex, emissiveHex: hex, emissiveIntensity: 0.25 },
      0.045
    );
    mesh.scale.y = 0.76;
    mesh.position.copy(spawnPos);
    this.root.add(mesh);

    // Choose target for Red or Blue shell
    let targetKart = null;
    if (shellType === 'blue') {
      targetKart = allKarts.find(k => k.rank === 1 && !k.isGhost) || null;
    } else if (shellType === 'red') {
      // Find racer immediately ahead in rank, or nearest opponent in Battle Mode
      targetKart = allKarts.find(k => k.rank === Math.max(1, owner.rank - 1) && k !== owner && !k.isGhost);
      if (!targetKart) {
        targetKart = allKarts.find(k => k !== owner && !k.isGhost && !k.eliminated) || null;
      }
    }

    const baseSpeed = shellType === 'blue' ? 74.0 : 62.0;
    this.projectiles.push({
      type: `${shellType}_shell`,
      shellType,
      owner,
      targetKart,
      mesh,
      position: spawnPos,
      velocity: new THREE.Vector3(fwdX * baseSpeed, 0, fwdZ * baseSpeed),
      speed: baseSpeed,
      trackT: owner.trackT,
      bouncesLeft: 5,
      life: 9.0,
      radius: 0.85
    });
  }

  _spawnHazardDrop(owner, dropType) {
    const backX = Math.sin(owner.yaw);
    const backZ = Math.cos(owner.yaw);
    const pos = new THREE.Vector3(
      owner.position.x + backX * 2.3,
      owner.position.y + (dropType === 'banana' ? 0.45 : 1.0),
      owner.position.z + backZ * 2.3
    );

    let mesh;
    if (dropType === 'banana') {
      const geo = new THREE.ConeGeometry(0.48, 1.05, 7);
      mesh = createCelMesh(geo, { hexColor: 0xffee11 }, 0.04);
    } else {
      const geo = new THREE.OctahedronGeometry(0.95, 0);
      mesh = createCelMesh(
        geo,
        { hexColor: 0xff2244, transparent: true, opacity: 0.82, emissiveHex: 0xff0022, emissiveIntensity: 0.35 },
        0.04
      );
    }
    mesh.position.copy(pos);
    this.root.add(mesh);

    this.projectiles.push({
      type: dropType,
      owner,
      mesh,
      position: pos,
      velocity: new THREE.Vector3(0, 0, 0),
      life: 45.0,
      radius: 1.05
    });
  }

  _spawnExplosion(pos, colorHex = 0x1199ff) {
    const geo = new THREE.SphereGeometry(1.0, 14, 12);
    const mesh = createCelMesh(
      geo,
      { hexColor: colorHex, transparent: true, opacity: 0.72, emissiveHex: colorHex, emissiveIntensity: 0.6 },
      0.05,
      false,
      false
    );
    mesh.position.copy(pos);
    this.root.add(mesh);
    this.explosions.push({ mesh, timer: 0.55, maxTimer: 0.55 });
  }

  update(dt, elapsed, karts, track, isTimeTrial = false) {
    if (this.lightningFlashTimer > 0) {
      this.lightningFlashTimer = Math.max(0, this.lightningFlashTimer - dt);
    }

    // 1. Update floating Item Boxes & check collection
    for (const ib of this.itemBoxes) {
      if (ib.respawnTimer > 0) {
        ib.respawnTimer -= dt;
        ib.group.visible = ib.respawnTimer <= 0;
        continue;
      }
      ib.group.position.y = ib.basePos.y + Math.sin(elapsed * 3.2 + ib.phase) * 0.28;
      ib.outer.rotation.y = elapsed * 1.8 + ib.phase;
      ib.outer.rotation.x = elapsed * 1.1 + ib.phase;
      ib.inner.rotation.y = -elapsed * 2.6;

      if (isTimeTrial) continue;

      for (const kart of karts) {
        if (kart.isGhost || kart.eliminated) continue;
        const dx = kart.position.x - ib.group.position.x;
        const dz = kart.position.z - ib.group.position.z;
        if (dx * dx + dz * dz < 2.25 * 2.25) {
          ib.respawnTimer = 4.0;
          ib.group.visible = false;
          if (kart.isHuman && this.audio) this.audio.playItemBoxBreak();

          if (!kart.heldItem && kart.rouletteTimer <= 0) {
            const rolled = rollItemForRank(kart.rank, karts.length, track.isBattle, isTimeTrial);
            kart.heldItem = rolled;
            kart.heldItemCharges = rolled === 'triple_mushroom' ? 3 : 1;
            kart.rouletteTimer = 1.15;
          }
          break;
        }
      }
    }

    // 2. Update active projectiles & hazards
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const p = this.projectiles[i];
      p.life -= dt;
      if (p.life <= 0) {
        this.root.remove(p.mesh);
        this.projectiles.splice(i, 1);
        continue;
      }

      if (p.type === 'fake_box') {
        p.mesh.rotation.y -= dt * 2.5;
        p.mesh.rotation.x -= dt * 1.5;
      } else if (p.shellType) {
        p.mesh.rotation.y += dt * 14.0;

        if (p.shellType === 'blue' && !track.isBattle) {
          // Blue shell follows track centerline rapidly until near 1st place target
          const target = p.targetKart;
          const distToTargetSq = target
            ? (target.position.x - p.position.x) ** 2 + (target.position.z - p.position.z) ** 2
            : Infinity;

          if (target && distToTargetSq < 22 * 22) {
            const dir = new THREE.Vector3().subVectors(target.position, p.position).normalize();
            p.velocity.set(dir.x * p.speed, 0, dir.z * p.speed);
          } else {
            p.trackT = (p.trackT + (p.speed * dt) / track.totalLength) % 1.0;
            const s = track.getTrackPointAt(p.trackT);
            p.position.set(s.point.x, s.point.y + 0.65, s.point.z);
            p.velocity.set(0, 0, 0);
          }
        } else if (p.shellType === 'red' && p.targetKart && !p.targetKart.eliminated) {
          // Red shell steers toward target kart
          const dir = new THREE.Vector3().subVectors(p.targetKart.position, p.position);
          dir.y = 0;
          if (dir.lengthSq() > 0.01) {
            dir.normalize();
            p.velocity.x = THREE.MathUtils.lerp(p.velocity.x, dir.x * p.speed, dt * 6.5);
            p.velocity.z = THREE.MathUtils.lerp(p.velocity.z, dir.z * p.speed, dt * 6.5);
          }
        }

        // Advance shell position
        p.position.x += p.velocity.x * dt;
        p.position.z += p.velocity.z * dt;

        // Keep shell at track height & bounce off road boundaries for Green Shells
        if (!track.isBattle) {
          const sample = track.getClosestTrackSample(p.position);
          p.position.y = sample.point.y + 0.55;
          const maxLat = track.roadWidth * 0.5 + 1.2;
          if (p.shellType === 'green' && Math.abs(sample.lateralOffset) > maxLat) {
            // Reflect velocity across track right normal!
            const dotR = p.velocity.x * sample.right.x + p.velocity.z * sample.right.z;
            p.velocity.x -= 2 * dotR * sample.right.x;
            p.velocity.z -= 2 * dotR * sample.right.z;
            p.bouncesLeft--;
            if (this.audio) this.audio.playShellBounce();
            if (p.bouncesLeft <= 0) p.life = 0;
          }
        } else {
          const limit = 62.0;
          if (Math.abs(p.position.x) > limit) {
            p.velocity.x *= -1;
            p.bouncesLeft--;
          }
          if (Math.abs(p.position.z) > limit) {
            p.velocity.z *= -1;
            p.bouncesLeft--;
          }
          if (p.bouncesLeft <= 0) p.life = 0;
        }
        p.mesh.position.copy(p.position);
      }

      // Check collision with Karts
      for (const kart of karts) {
        if (kart.isGhost || kart.eliminated) continue;
        // Brief grace period for owner right after firing
        if (kart === p.owner && p.life > 8.65 && p.shellType) continue;
        if (kart === p.owner && p.life > 44.4 && !p.shellType) continue;

        const dx = kart.position.x - p.position.x;
        const dz = kart.position.z - p.position.z;
        const hitRadius = p.radius + 1.05;
        if (dx * dx + dz * dz < hitRadius * hitRadius) {
          const isBigBlast = p.shellType === 'blue' || p.shellType === 'red' || p.type === 'fake_box';
          kart.triggerSpinOut(isBigBlast ? 1.35 : 1.05, isBigBlast, this.audio, track.isBattle);
          if (p.shellType === 'blue') {
            this._spawnExplosion(p.position, 0x1199ff);
          }
          this.root.remove(p.mesh);
          this.projectiles.splice(i, 1);
          break;
        }
      }
    }

    // 3. Check Kart-to-Kart Starman & Orbiting Shell collisions + Slipstream drafting
    for (let i = 0; i < karts.length; i++) {
      const a = karts[i];
      if (a.isGhost || a.eliminated) continue;
      for (let j = i + 1; j < karts.length; j++) {
        const b = karts[j];
        if (b.isGhost || b.eliminated) continue;
        const dx = b.position.x - a.position.x;
        const dz = b.position.z - a.position.z;
        const distSq = dx * dx + dz * dz;
        if (distSq < 2.35 * 2.35) {
          if (a.starTimer > 0 && b.starTimer <= 0) {
            b.triggerSpinOut(1.3, true, this.audio, track.isBattle);
          } else if (b.starTimer > 0 && a.starTimer <= 0) {
            a.triggerSpinOut(1.3, true, this.audio, track.isBattle);
          } else if (a.orbitShells > 0 && b.orbitShells <= 0) {
            a.orbitShells--;
            b.triggerSpinOut(1.0, false, this.audio, track.isBattle);
          } else if (b.orbitShells > 0 && a.orbitShells <= 0) {
            b.orbitShells--;
            a.triggerSpinOut(1.0, false, this.audio, track.isBattle);
          }
        }
      }
    }

    // 4. Animate explosion spheres
    for (let i = this.explosions.length - 1; i >= 0; i--) {
      const ex = this.explosions[i];
      ex.timer -= dt;
      if (ex.timer <= 0) {
        this.root.remove(ex.mesh);
        this.explosions.splice(i, 1);
      } else {
        const prog = 1.0 - ex.timer / ex.maxTimer;
        ex.mesh.scale.setScalar(1.0 + prog * 6.5);
      }
    }
  }
}

            <ul>${SOURCE_AND_FEEDBACK_INFO.testingFeedback.map(s => `<li>${s}</li>`).join('')}</ul>
            <h3>Engine Feedback</h3>
            <ul>${SOURCE_AND_FEEDBACK_INFO.engineFeedback.map(s => `<li>${s}</li>`).join('')}</ul>
            <h3>Prompt Feedback</h3>
            <ul>${SOURCE_AND_FEEDBACK_INFO.promptFeedback.map(s => `<li>${s}</li>`).join('')}</ul>
          </div>
          <div class="btn-row">
            <button class="cel-btn primary-action" id="credits-close-btn">✕ Close (Circle / Esc)</button>

        <span><kbd>L1 / E</kbd> Use Item</span>
      </div>

    this._bindMouseEvents();
    this.refreshMenuVisuals();
  }

  _bindMouseEvents() {
    document.getElementById('touch-settings-btn')?.addEventListener('click', () => {
      this.openSettings();
    });

    const titleBtns = document.querySelectorAll('#title-menu-list .menu-item');
    titleBtns.forEach((btn, idx) => {
      btn.addEventListener('mouseenter', () => {
        this.focusIndex = idx;
        this.refreshMenuVisuals();
      });
      btn.addEventListener('click', () => {
        this.focusIndex = idx;
        this._triggerTitleSelection();
      });
    });

    document.getElementById('setup-back-btn')?.addEventListener('click', () => {
      this.app.audio.playUIBack();
      this.showScreen('title');
    });
    document.getElementById('setup-go-btn')?.addEventListener('click', () => {
      this.app.audio.playUIConfirm();
      this.app.startConfiguredSession();
    });

    const setupRows = ['setup-row-players', 'setup-row-class', 'setup-row-driver', 'setup-row-course'];
    setupRows.forEach((id, idx) => {
      document.getElementById(id)?.addEventListener('click', () => {
        this.setupStep = idx;
        this._adjustSetupOption(1);
        this.refreshMenuVisuals();
      });
    });

    document.querySelectorAll('#pause-menu-list .cel-btn').forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        this.focusIndex = idx;
        this._triggerPauseSelection();
      });
    });

    document.querySelectorAll('#settings-list .setting-item').forEach((item, idx) => {
      item.addEventListener('click', () => {
        this.settingsFocusIndex = idx;
        this._adjustSettingValue(1);
        this.refreshSettingsVisuals();
      });
    });

    document.getElementById('settings-close-btn')?.addEventListener('click', () => {
      this.closeSettings();
    });
    document.getElementById('credits-close-btn')?.addEventListener('click', () => {
      this.closeCredits();
    });
    document.getElementById('results-next-btn')?.addEventListener('click', () => {
      this.app.advanceFromResults();
    });
    document.getElementById('results-menu-btn')?.addEventListener('click', () => {
      this.app.returnToTitle();
    });
  }

  showScreen(state) {
    this.menuState = state;
    this.focusIndex = 0;
    this.setupStep = 0;

    document.getElementById('title-screen')?.classList.toggle('hidden', state !== 'title');
    document.getElementById('setup-screen')?.classList.toggle('hidden', state !== 'setup');
    document.getElementById('results-screen')?.classList.toggle('hidden', state !== 'results' && state !== 'cup_ceremony');
    document.getElementById('pause-modal')?.classList.toggle('hidden', state !== 'pause');
    document.getElementById('attract-banner')?.classList.toggle('hidden', state !== 'attract');
    document.getElementById('controller-footer')?.classList.toggle('hidden', state === 'racing' || state === 'attract');

    this.refreshMenuVisuals();
  }

  openSettings() {
    this.settingsOpen = true;
    this.settingsFocusIndex = 0;
    document.getElementById('settings-modal')?.classList.remove('hidden');
    this.refreshSettingsVisuals();
    this.app.audio.playUIConfirm();
  }

  closeSettings() {
    this.settingsOpen = false;
    document.getElementById('settings-modal')?.classList.add('hidden');
    this.app.audio.playUIBack();
  }

  openCredits() {
    this.creditsOpen = true;
    document.getElementById('credits-modal')?.classList.remove('hidden');
    this.app.audio.playUIConfirm();
  }

  closeCredits() {
    this.creditsOpen = false;
    document.getElementById('credits-modal')?.classList.add('hidden');
    this.app.audio.playUIBack();
  }

  handleMenuInput(act) {
    // Check touch-only screen
    const touchEl = document.getElementById('touch-warning-screen');
    if (touchEl) {
      touchEl.classList.toggle('hidden', !this.app.input.touchOnlyDetected);
    }

    if (act.settingsBtn) {
      if (this.settingsOpen) this.closeSettings();
      else this.openSettings();
      return;
    }

    if (this.creditsOpen) {
      if (act.back || act.confirm) this.closeCredits();
      return;
    }

    if (this.settingsOpen) {
      if (act.up) {
        this.settingsFocusIndex = (this.settingsFocusIndex + 6) % 7;
        this.app.audio.playUIMove();
        this.refreshSettingsVisuals();
      } else if (act.down) {
        this.settingsFocusIndex = (this.settingsFocusIndex + 1) % 7;
        this.app.audio.playUIMove();
        this.refreshSettingsVisuals();
      } else if (act.left) {
        this._adjustSettingValue(-1);
        this.refreshSettingsVisuals();
      } else if (act.right) {
        this._adjustSettingValue(1);
        this.refreshSettingsVisuals();
      } else if (act.confirm) {
        if (this.settingsFocusIndex === 6) {
          this.closeSettings();
        } else {
          this._adjustSettingValue(1);
          this.refreshSettingsVisuals();
        }
      } else if (act.back) {
        this.closeSettings();
      }
      return;
    }

    if (this.menuState === 'title') {
      const count = 6;
      if (act.up) {
        this.focusIndex = (this.focusIndex + count - 1) % count;
        this.app.audio.playUIMove();
        this.refreshMenuVisuals();
      } else if (act.down) {
        this.focusIndex = (this.focusIndex + 1) % count;
        this.app.audio.playUIMove();
        this.refreshMenuVisuals();
      } else if (act.confirm) {
        this._triggerTitleSelection();
      }
    } else if (this.menuState === 'setup') {
      const totalSteps = 5; // 0:Players, 1:Class, 2:Driver, 3:Course, 4:Start
      if (act.up) {
        this.setupStep = (this.setupStep + totalSteps - 1) % totalSteps;
        this.app.audio.playUIMove();
        this.refreshMenuVisuals();
      } else if (act.down) {
        this.setupStep = (this.setupStep + 1) % totalSteps;
        this.app.audio.playUIMove();
        this.refreshMenuVisuals();
      } else if (act.left) {
        this._adjustSetupOption(-1);
        this.refreshMenuVisuals();
      } else if (act.right) {
        this._adjustSetupOption(1);
        this.refreshMenuVisuals();
      } else if (act.confirm) {
        if (this.setupStep === 4) {
          this.app.audio.playUIConfirm();
          this.app.startConfiguredSession();
        } else {
          this.setupStep = 4;
          this.app.audio.playUIMove();
          this.refreshMenuVisuals();
        }
      } else if (act.back) {
        this.app.audio.playUIBack();
        this.showScreen('title');
      }
    } else if (this.menuState === 'pause') {
      const count = 4;
      if (act.up) {
        this.focusIndex = (this.focusIndex + count - 1) % count;
        this.app.audio.playUIMove();
        this.refreshMenuVisuals();
      } else if (act.down) {
        this.focusIndex = (this.focusIndex + 1) % count;
        this.app.audio.playUIMove();
        this.refreshMenuVisuals();
      } else if (act.confirm) {
        this._triggerPauseSelection();
      } else if (act.back || act.options) {
        this.app.togglePause();
      }
    } else if (this.menuState === 'results' || this.menuState === 'cup_ceremony') {
      if (act.confirm) {
        this.app.advanceFromResults();
      } else if (act.back) {
        this.app.returnToTitle();
      }
    }
  }

  _triggerTitleSelection() {
    this.app.audio.playUIConfirm();
    const cfg = this.app.sessionConfig;
    switch (this.focusIndex) {
      case 0:
        cfg.mode = 'gp';
        cfg.numPlayers = Math.min(2, cfg.numPlayers);
        cfg.courseIndex = 0;
        this.showScreen('setup');
        break;
      case 1:
        cfg.mode = 'vs';
        if (cfg.courseIndex === 3) cfg.courseIndex = 0;
        this.showScreen('setup');
        break;
      case 2:
        cfg.mode = 'tt';
        cfg.numPlayers = 1;
        if (cfg.courseIndex === 3) cfg.courseIndex = 0;
        this.showScreen('setup');
        break;
      case 3:
        cfg.mode = 'battle';
        cfg.courseIndex = 3; // Block Fort Donut 64
        this.showScreen('setup');
        break;
      case 4:
        this.openSettings();
        break;
      case 5:
        this.openCredits();
        break;
    }
  }

  _adjustSetupOption(dir) {
    const cfg = this.app.sessionConfig;
    this.app.audio.playUIMove();
    if (this.setupStep === 0) {
      // Players
      const maxP = cfg.mode === 'tt' ? 1 : cfg.mode === 'gp' ? 2 : 4;
      cfg.numPlayers = ((cfg.numPlayers - 1 + dir + maxP) % maxP) + 1;
    } else if (this.setupStep === 1) {
      // Engine class
      cfg.classIndex = (cfg.classIndex + dir + ENGINE_CLASSES.length) % ENGINE_CLASSES.length;
    } else if (this.setupStep === 2) {
      // Driver
      cfg.driverIndex = (cfg.driverIndex + dir + DRIVERS.length) % DRIVERS.length;
    } else if (this.setupStep === 3) {
      // Course
      if (cfg.mode === 'battle') {
        cfg.courseIndex = 3;
      } else {
        cfg.courseIndex = (cfg.courseIndex + dir + 3) % 3;
      }
    }
  }

  _triggerPauseSelection() {
    this.app.audio.playUIConfirm();
    if (this.focusIndex === 0) {
      this.app.togglePause();
    } else if (this.focusIndex === 1) {
      this.app.restartCurrentRace();
    } else if (this.focusIndex === 2) {
      this.openSettings();
    } else if (this.focusIndex === 3) {
      this.app.returnToTitle();
    }
  }

  _adjustSettingValue(dir) {
    const s = this.app.settings;
    this.app.audio.playUIMove();
    if (this.settingsFocusIndex === 0) {
      s.invertHorizontal = !s.invertHorizontal;
    } else if (this.settingsFocusIndex === 1) {
      s.invertVertical = !s.invertVertical;
    } else if (this.settingsFocusIndex === 2) {
      s.masterVolume = Math.max(0, Math.min(1, +(s.masterVolume + dir * 0.1).toFixed(1)));
      this.app.audio.setVolumes({ master: s.masterVolume });
    } else if (this.settingsFocusIndex === 3) {
      s.musicVolume = Math.max(0, Math.min(1, +(s.musicVolume + dir * 0.1).toFixed(1)));
      this.app.audio.setVolumes({ music: s.musicVolume });
    } else if (this.settingsFocusIndex === 4) {
      s.sfxVolume = Math.max(0, Math.min(1, +(s.sfxVolume + dir * 0.1).toFixed(1)));
      this.app.audio.setVolumes({ sfx: s.sfxVolume });
    } else if (this.settingsFocusIndex === 5) {
      s.splitVertical2P = !s.splitVertical2P;
    }
  }

  refreshSettingsVisuals() {
    const s = this.app.settings;
    document.getElementById('set-val-invx').textContent = s.invertHorizontal ? 'ON (Inverted)' : 'OFF (Normal)';
    document.getElementById('set-val-invy').textContent = s.invertVertical ? 'ON (Inverted)' : 'OFF (Normal)';
    document.getElementById('set-val-master').textContent = `${Math.round(s.masterVolume * 100)}%`;
    document.getElementById('set-val-music').textContent = `${Math.round(s.musicVolume * 100)}%`;
    document.getElementById('set-val-sfx').textContent = `${Math.round(s.sfxVolume * 100)}%`;
    document.getElementById('set-val-split').textContent = s.splitVertical2P ? 'Vertical (Left/Right)' : 'Horizontal (Top/Bottom)';

    const items = document.querySelectorAll('#settings-list .setting-item');
    items.forEach((el, idx) => {
      el.classList.toggle('focused', idx === this.settingsFocusIndex);

  buildViewportHUDs(viewports, isBattle, isTimeTrial) {
    this.hudLayer.innerHTML = '';

      if (vp.isTelemetryQuadrant) {
        div.innerHTML = `

      } else {
        div.innerHTML = `

            </div>
          </div>

  updateHUD(karts, raceTime, countdownTimer, isBattle, isTimeTrial, ghostTime) {
    const ordinals = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th'];
    const rankColors = ['#ffd700', '#e2e8f0', '#f97316', '#38bdf8', '#38bdf8', '#94a3b8', '#94a3b8', '#ef4444'];

    for (let i = 0; i < this.viewportHUDs.length; i++) {
      const hud = this.viewportHUDs[i];
      const kart = karts[i];
      if (!kart || !hud.rankEl) continue;

      // Rank
      const rIdx = Math.max(0, Math.min(7, kart.rank - 1));
      hud.rankEl.textContent = isTimeTrial ? 'TIME' : ordinals[rIdx];
      hud.rankEl.style.color = rankColors[rIdx];

      // Lap or Balloons
      if (isBattle) {
        hud.lapEl.textContent = `🎈 × ${kart.balloons}`;
      } else {
        hud.lapEl.textContent = `LAP ${Math.min(kart.maxLaps, kart.lap)}/${kart.maxLaps}`;
      }

      // Timer
      hud.timerEl.textContent = this.formatTime(kart.finished ? kart.finishTime : raceTime);

      // Item Box Roulette
      if (kart.rouletteTimer > 0) {
        const poolIcons = ['🍄', '🟢', '🔴', '🍌', '⭐', '⚡', '💠'];
        hud.itemIconEl.textContent = poolIcons[Math.floor(performance.now() / 70) % poolIcons.length];
        hud.itemLabelEl.textContent = 'ROLLING...';
        hud.itemBoxEl.classList.add('rolling');
      } else if (kart.heldItem && ITEMS[kart.heldItem]) {
        const it = ITEMS[kart.heldItem];
        hud.itemIconEl.textContent = it.icon;
        hud.itemLabelEl.textContent = kart.heldItem === 'triple_mushroom'
          ? `${it.name} (${kart.heldItemCharges})`
          : kart.orbitShells > 0
            ? `Shield (${kart.orbitShells})`
            : it.name;
        hud.itemBoxEl.classList.remove('rolling');
      } else if (kart.orbitShells > 0) {
        hud.itemIconEl.textContent = '🟢';
        hud.itemLabelEl.textContent = `Shield (${kart.orbitShells})`;
      } else {
        hud.itemIconEl.textContent = '—';
        hud.itemLabelEl.textContent = 'EMPTY';
        hud.itemBoxEl.classList.remove('rolling');
      }

      // Speed & Drift Charge Bar
      const kmh = Math.round(Math.abs(kart.speed) * 2.6);
      hud.speedEl.textContent = `${kmh}`;
      const driftPct = kart.isDrifting ? Math.min(100, (kart.driftCharge / 2.2) * 100) : 0;
      hud.driftEl.style.width = `${driftPct}%`;
      hud.driftEl.style.background = kart.driftTier === 3
        ? '#f43f5e'
        : kart.driftTier === 2
          ? '#fb923c'
          : '#38bdf8';

      // Center Status Banner (Countdown, Final Lap, Wrong Way, Finish!)
      let bannerText = '';
      if (countdownTimer > 0) {
        const countNum = Math.ceil(countdownTimer);
        bannerText = `<span class="countdown-digit">${countNum}</span>`;
      } else if (raceTime > 0 && raceTime < 1.1) {
        bannerText = `<span class="countdown-go">GO!! 🚀</span>`;
      } else if (kart.finished) {
        bannerText = `<span class="finish-text">FINISH! ${ordinals[rIdx]}!</span>`;
      } else if (kart.eliminated) {
        bannerText = `<span class="wrong-way-text">OUT OF BALLOONS!</span>`;
      } else if (kart.rescueTimer > 0) {
        bannerText = `<span class="wrong-way-text">LAKITU RESCUE! ☁️</span>`;
      } else if (kart.isWrongWay) {
        bannerText = `<span class="wrong-way-text">⚠️ WRONG WAY! ↩</span>`;
      } else if (!isBattle && kart.lap === kart.maxLaps && raceTime > 4) {
        bannerText = `<span class="final-lap-pill">🔔 FINAL LAP!</span>`;
      }
      hud.bannerEl.innerHTML = bannerText;
    }

    // Update 3P 4th quadrant telemetry if active
    const telemEl = document.getElementById('telemetry-standings');
    if (telemEl) {
      const sorted = [...karts].filter(k => !k.isGhost).sort((a, b) => a.rank - b.rank);
      telemEl.innerHTML = sorted
        .slice(0, 6)
        .map(k => `<div><strong>${k.rank}.</strong> ${k.driver.name} ${k.isHuman ? `(P${k.playerIndex + 1})` : ''}</div>`)
        .join('');
    }
  }

  drawMinimap(track, karts) {
    if (!this.minimapCtx || !this.minimapCanvas) return;
    const ctx = this.minimapCtx;
    const w = this.minimapCanvas.width;
    const h = this.minimapCanvas.height;
    ctx.clearRect(0, 0, w, h);

    // Background circle
    ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
    ctx.strokeStyle = '#111118';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(4, 4, w - 8, h - 8, 14);
    ctx.fill();
    ctx.stroke();

    const cx = w * 0.5;
    const cy = h * 0.5;
    const scale = track.isBattle ? 0.95 : 0.31;

    if (track.isBattle) {
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 3;
      ctx.strokeRect(cx - 60 * scale, cy - 60 * scale, 120 * scale, 120 * scale);
    } else if (track.trackSamples.length > 0) {
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 5;
      ctx.beginPath();
      track.trackSamples.forEach((s, idx) => {
        const x = cx + s.point.x * scale;
        const y = cy + s.point.z * scale;
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.stroke();
    }

    // Draw kart dots
    for (const k of karts) {
      if (k.eliminated) continue;
      const x = cx + k.position.x * scale;
      const y = cy + k.position.z * scale;
      ctx.fillStyle = k.isGhost ? 'rgba(255,255,255,0.6)' : `#${k.driver.bodyColor.toString(16).padStart(6, '0')}`;
      ctx.strokeStyle = k.isHuman ? '#ffffff' : '#111118';
      ctx.lineWidth = k.isHuman ? 2.5 : 1.5;
      ctx.beginPath();
      ctx.arc(x, y, k.isHuman ? 5.5 : 4.0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }

  showResultsScreen({ title, subtitle, rows, nextLabel = '✕ Continue' }) {
    document.getElementById('results-title').textContent = title;
    document.getElementById('results-subtitle').textContent = subtitle;
    document.getElementById('results-next-btn').textContent = nextLabel;

    const table = document.getElementById('results-table');
    table.innerHTML = rows
      .map(
        r => `
        <div class="result-row ${r.isHuman ? 'human-row' : ''}">
          <span class="res-rank">${r.rank}</span>
          <span class="res-name">${r.name}</span>
          <span class="res-stat">${r.stat}</span>
        </div>
      `
      )
      .join('');

    this.showScreen('results');
  }

  formatTime(sec) {
    const s = Math.max(0, sec);
    const mins = Math.floor(s / 60);
    const rem = s % 60;
    return `${String(mins).padStart(2, '0')}:${rem.toFixed(2).padStart(5, '0')}`;
  }
}

// src/main.js
// Core WebGPU Engine, Split-Screen Orchestrator, Attract Mode Director, Ghost System & State Machine
class FlashOKartApp {
  constructor() {
    this.settings = {
      invertHorizontal: false,
      invertVertical: false,
      masterVolume: 0.8,
      musicVolume: 0.55,
      sfxVolume: 0.85,
      splitVertical2P: false
    };

    this.sessionConfig = {
      mode: 'gp', // 'gp', 'vs', 'tt', 'battle'
      numPlayers: 1,
      classIndex: 1, // 100cc
      driverIndex: 0, // Captain Flash
      courseIndex: 0 // Flash Raceway 64
    };

    this.state = 'title'; // 'title', 'setup', 'attract', 'racing', 'paused', 'results', 'cup_ceremony'
    this.elapsed = 0;
    this.raceTime = 0;
    this.countdownTimer = 3.2;
    this.lastBeepSecond = 4;

    this.karts = [];
    this.humanKarts = [];
    this.ghostKart = null;
    this.currentGhostRecording = [];
    this.bestGhostRecordings = {}; // keyed by courseId

    this.cameras = [];
    this.viewports = [];
    this.podiumGroup = null;

    // Attract mode camera cycling
    this.attractTimer = 0;
    this.attractCamMode = 0;

    this.audio = new AudioManager();
    this.input = new InputManager(this.settings);
    this.ui = null;
  }

  async init() {
    // Enforce WebGPU with no fallback as required by TASK.md
    if (!navigator.gpu) {
      document.body.innerHTML = `
        <div style="color:#fff;background:#111;padding:40px;font-family:sans-serif;text-align:center;">
          <h1>WebGPU Required (No Fallback)</h1>
          <p>This build of Flash-O-Kart 64 requires Three.js R180 WebGPURenderer with native WebGPU support.</p>
        </div>`;
      throw new Error('WebGPU not supported on this browser.');
    }

    await RAPIER.init({});
    this.RAPIER = RAPIER;
    this.rapierWorld = new RAPIER.World({ x: 0, y: -24.0, z: 0 });

    const canvas = document.getElementById('game-canvas');
    this.renderer = new THREE.WebGPURenderer({
      canvas,
      antialias: true,
      forceWebGL: false
    });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = true;
    this.renderer.autoClear = false;
    await this.renderer.init();

    this.scene = new THREE.Scene();
    // Important: scene.background is kept null so WebGPU multi-viewport split-screen
    // does not trigger a full-attachment loadOp clear on subsequent viewports!
    this.scene.background = null;

    // Lighting
    this.hemiLight = new THREE.HemisphereLight(0xffffff, 0x334466, 1.15);
    this.scene.add(this.hemiLight);

    this.sunLight = new THREE.DirectionalLight(0xfff6e5, 2.2);
    this.sunLight.position.set(85, 140, 65);
    this.sunLight.castShadow = true;
    this.sunLight.shadow.mapSize.width = 1024;
    this.sunLight.shadow.mapSize.height = 1024;
    this.sunLight.shadow.camera.near = 10;
    this.sunLight.shadow.camera.far = 450;
    const d = 180;
    this.sunLight.shadow.camera.left = -d;
    this.sunLight.shadow.camera.right = d;
    this.sunLight.shadow.camera.top = d;
    this.sunLight.shadow.camera.bottom = -d;
    this.scene.add(this.sunLight);

    // Subsystems
    this.track = new TrackBuilder(this.scene, this.rapierWorld, this.RAPIER);
    this.items = new ItemManager(this.scene, this.audio);
    this.ui = new UIManager(this);

    // Create 4 viewport cameras
    for (let i = 0; i < 4; i++) {
      const cam = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.3, 1100);
      this.cameras.push(cam);
    }

    window.addEventListener('resize', () => this.onResize());

    // Build initial title background showcase course
    this._setupTitleShowcase();
    this.audio.startMusic('title', 1.0);

    this.lastFrameTime = performance.now();
    requestAnimationFrame((t) => this.loop(t));
  }

  onResize() {
    if (!this.renderer) return;
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this._updateViewportLayout();
  }

  _clearKarts() {
    for (const k of this.karts) k.destroy();
    this.karts = [];
    this.humanKarts = [];
    if (this.ghostKart) {
      this.ghostKart.destroy();
      this.ghostKart = null;
    }
    if (this.podiumGroup) {
      this.scene.remove(this.podiumGroup);
      this.podiumGroup = null;
    }
  }

  _setupTitleShowcase() {
    this._clearKarts();
    const course = COURSES[0];
    this.track.buildCourse(course, false);
    this.items.spawnCourseItemBoxes(this.track.itemBoxSpawns);

    // Spawn 8 AI demo karts driving around the circuit in the background of the Title Screen
    for (let i = 0; i < 8; i++) {
      const kart = new Kart({
        index: i,
        driver: DRIVERS[i % DRIVERS.length],
        isHuman: false,
        playerIndex: i,
        scene: this.scene,
        rapierWorld: this.rapierWorld,
        RAPIER: this.RAPIER
      });
      kart.resetAtTransform(this.track.startTransforms[i], false, 99);
      kart.attractCheat = true;
      this.karts.push(kart);
    }
    this._updateViewportLayout(1);
    document.getElementById('hud-layer').classList.add('hidden');
    document.getElementById('split-dividers').innerHTML = '';
  }

  startAttractMode() {
    this.state = 'attract';
    this.attractTimer = 0;
    this.attractCamMode = 0;
    this._clearKarts();

    // Pick a dramatic course for Attract Mode
    const attractCourses = [COURSES[0], COURSES[1], COURSES[2], COURSES[3]];
    const chosen = attractCourses[Math.floor(Math.random() * attractCourses.length)];
    this.track.buildCourse(chosen, false);
    this.items.spawnCourseItemBoxes(this.track.itemBoxSpawns);

    for (let i = 0; i < 8; i++) {
      const kart = new Kart({
        index: i,
        driver: DRIVERS[i % DRIVERS.length],
        isHuman: false,
        playerIndex: i,
        scene: this.scene,
        rapierWorld: this.rapierWorld,
        RAPIER: this.RAPIER
      });
      kart.resetAtTransform(this.track.startTransforms[i], chosen.mode === 'battle', 99);
      kart.attractCheat = true;
      kart.heldItem = i % 2 === 0 ? 'red_shell' : 'mushroom';
      this.karts.push(kart);
    }

    this._updateViewportLayout(1);
    this.ui.showScreen('attract');
    document.getElementById('hud-layer').classList.add('hidden');
    this.audio.startMusic(chosen.theme, 1.0);
    this.input.anyInputJustHappened = false;
  }

  exitAttractMode() {
    this.input.resetIdleTimer();
    this.returnToTitle();
  }

  returnToTitle() {
    this.state = 'title';
    this.ui.showScreen('title');
    this._setupTitleShowcase();
    this.audio.startMusic('title', 1.0);
    this.audio.updateEngineSound(0, false, false, false);
  }

  startConfiguredSession() {
    const cfg = this.sessionConfig;
    if (cfg.mode === 'gp') {
      cfg.courseIndex = 0;
      this.cupPoints = new Array(8).fill(0);
    }
    this._launchEvent();
  }

  restartCurrentRace() {
    this._launchEvent();
  }

  _launchEvent() {
    const cfg = this.sessionConfig;
    const engineClass = ENGINE_CLASSES[cfg.classIndex];
    const course = COURSES[cfg.courseIndex];
    const isBattle = cfg.mode === 'battle' || course.mode === 'battle';
    const isTimeTrial = cfg.mode === 'tt';

    this._clearKarts();
    this.track.buildCourse(course, engineClass.mirror);
    this.items.spawnCourseItemBoxes(isTimeTrial ? [] : this.track.itemBoxSpawns);

    const numHuman = isTimeTrial ? 1 : cfg.numPlayers;
    const totalRacers = isTimeTrial ? 1 : 8;

    // Order driver roster so P1 gets their chosen driver
    const orderedDrivers = [...DRIVERS];
    const chosenDriver = DRIVERS[cfg.driverIndex];
    const existingIdx = orderedDrivers.indexOf(chosenDriver);
    if (existingIdx > 0) {
      orderedDrivers.splice(existingIdx, 1);
      orderedDrivers.unshift(chosenDriver);
    }

    for (let i = 0; i < totalRacers; i++) {
      const isHuman = i < numHuman;
      const kart = new Kart({
        index: i,
        driver: orderedDrivers[i % orderedDrivers.length],
        isHuman,
        playerIndex: i,
        scene: this.scene,
        rapierWorld: this.rapierWorld,
        RAPIER: this.RAPIER
      });
      kart.resetAtTransform(this.track.startTransforms[i], isBattle, course.laps || 3);
      if (isTimeTrial) {
        kart.heldItem = 'triple_mushroom';
        kart.heldItemCharges = 3;
      }
      this.karts.push(kart);
      if (isHuman) this.humanKarts.push(kart);
    }

    // Time Trials: Spawn Ghost Kart if a previous recording exists for this course
    this.currentGhostRecording = [];
    if (isTimeTrial && this.bestGhostRecordings[course.id]?.frames?.length > 0) {
      this.ghostKart = new Kart({
        index: 99,
        driver: chosenDriver,
        isHuman: false,
        playerIndex: 0,
        isGhost: true,
        scene: this.scene,
        rapierWorld: this.rapierWorld,
        RAPIER: this.RAPIER
      });
      this.ghostKart.resetAtTransform(this.track.startTransforms[0], false, course.laps || 3);
    }

    this.state = 'racing';
    this.raceTime = 0;
    this.countdownTimer = 3.0;
    this.lastBeepSecond = 4;

    this._updateViewportLayout(numHuman);
    this.ui.buildViewportHUDs(this.viewports, isBattle, isTimeTrial);
    this.ui.showScreen('racing');
    document.getElementById('hud-layer').classList.remove('hidden');

    this.audio.startMusic(course.theme, 1.0);
  }

  _updateViewportLayout(numPlayersOverride = null) {
    const numP = numPlayersOverride ?? (this.state === 'racing' || this.state === 'paused' ? this.humanKarts.length : 1);
    const W = window.innerWidth;
    const H = window.innerHeight;
    this.viewports = [];
    const dividerEl = document.getElementById('split-dividers');
    if (dividerEl) dividerEl.innerHTML = '';

    if (numP <= 1) {
      this.viewports.push({
        x: 0, y: 0, w: W, h: H,
        xPct: 0, yPct: 0, wPct: 100, hPct: 100,
        cam: this.cameras[0]
      });
    } else if (numP === 2) {
      if (this.settings.splitVertical2P) {
        const hw = Math.floor(W / 2);
        this.viewports.push(
          { x: 0, y: 0, w: hw, h: H, xPct: 0, yPct: 0, wPct: 50, hPct: 100, cam: this.cameras[0] },
          { x: hw, y: 0, w: W - hw, h: H, xPct: 50, yPct: 0, wPct: 50, hPct: 100, cam: this.cameras[1] }
        );
        if (dividerEl) dividerEl.innerHTML = `<div class="split-line-v"></div>`;
      } else {
        const hh = Math.floor(H / 2);
        // Remember: in Three.js r180 WebGPURenderer, y=0 is TOP of the canvas!
        this.viewports.push(
          { x: 0, y: 0, w: W, h: hh, xPct: 0, yPct: 0, wPct: 100, hPct: 50, cam: this.cameras[0] },
          { x: 0, y: hh, w: W, h: H - hh, xPct: 0, yPct: 50, wPct: 100, hPct: 50, cam: this.cameras[1] }
        );
        if (dividerEl) dividerEl.innerHTML = `<div class="split-line-h"></div>`;
      }
    } else {
      // 3P or 4P 4-quadrant N64 split-screen (y=0 is top-left in WebGPURenderer!)
      const hw = Math.floor(W / 2);
      const hh = Math.floor(H / 2);
      this.viewports.push(
        { x: 0, y: 0, w: hw, h: hh, xPct: 0, yPct: 0, wPct: 50, hPct: 50, cam: this.cameras[0] },
        { x: hw, y: 0, w: W - hw, h: hh, xPct: 50, yPct: 0, wPct: 50, hPct: 50, cam: this.cameras[1] },
        { x: 0, y: hh, w: hw, h: H - hh, xPct: 0, yPct: 50, wPct: 50, hPct: 50, cam: this.cameras[2] },
        {
          x: hw, y: hh, w: W - hw, h: H - hh,
          xPct: 50, yPct: 50, wPct: 50, hPct: 50,
          cam: this.cameras[3],
          isTelemetryQuadrant: numP === 3
        }
      );
      if (dividerEl) {
        dividerEl.innerHTML = `<div class="split-line-h"></div><div class="split-line-v"></div>`;
      }
    }

    for (const vp of this.viewports) {
      vp.cam.aspect = Math.max(0.2, vp.w / Math.max(1, vp.h));
      vp.cam.updateProjectionMatrix();
    }
  }

  togglePause() {
    if (this.state === 'racing') {
      this.state = 'paused';
      this.ui.showScreen('pause');
      this.audio.updateEngineSound(0, false, false, false);
    } else if (this.state === 'paused') {
      this.state = 'racing';
      this.ui.showScreen('racing');
    }
  }

  _finishEvent() {
    this.state = 'results';
    document.getElementById('hud-layer').classList.add('hidden');
    this.audio.updateEngineSound(0, false, false, false);
    this.audio.startMusic('victory', 1.0);

    const cfg = this.sessionConfig;
    const course = COURSES[cfg.courseIndex];
    const isBattle = cfg.mode === 'battle' || course.mode === 'battle';
    const isTimeTrial = cfg.mode === 'tt';

    // Save Ghost Recording if Time Trial
    if (isTimeTrial && this.humanKarts[0]) {
      const finishTime = this.humanKarts[0].finishTime;
      const prevBest = this.bestGhostRecordings[course.id];
      if (!prevBest || finishTime < prevBest.bestTime) {
        this.bestGhostRecordings[course.id] = {
          bestTime: finishTime,
          frames: [...this.currentGhostRecording]
        };
      }
    }

    // Award Grand Prix Cup points (9, 6, 3, 1)
    const ptsTable = [9, 6, 3, 1, 0, 0, 0, 0];
    const sorted = [...this.karts].filter(k => !k.isGhost).sort((a, b) => a.rank - b.rank);

    if (cfg.mode === 'gp') {
      for (const k of sorted) {
        const addPts = ptsTable[k.rank - 1] || 0;
        this.cupPoints[k.index] = (this.cupPoints[k.index] || 0) + addPts;
        k.points = this.cupPoints[k.index];
      }
    }

    const rows = sorted.map(k => ({
      rank: `${k.rank}.`,
      name: `${k.driver.name} ${k.isHuman ? `(P${k.playerIndex + 1})` : '(CPU)'}`,
      stat: isBattle
        ? `🎈 × ${k.balloons}`
        : cfg.mode === 'gp'
          ? `${this.ui.formatTime(k.finishTime || this.raceTime)}  •  +${ptsTable[k.rank - 1] || 0} pts (Total: ${k.points})`
          : `${this.ui.formatTime(k.finishTime || this.raceTime)}`,
      isHuman: k.isHuman
    }));

    const nextLabel = cfg.mode === 'gp' && cfg.courseIndex < 2
      ? '✕ Next Cup Race'
      : cfg.mode === 'gp' && cfg.courseIndex === 2
        ? '🏆 Trophy Ceremony'
        : '🔄 Play Again';

    this.ui.showResultsScreen({
      title: `${course.name.toUpperCase()} — RESULTS`,
      subtitle: isTimeTrial
        ? `Best Record: ${this.ui.formatTime(this.bestGhostRecordings[course.id]?.bestTime || this.raceTime)}`
        : course.cup,
      rows,
      nextLabel
    });
  }

  advanceFromResults() {
    this.audio.playUIConfirm();
    const cfg = this.sessionConfig;
    if (this.state === 'cup_ceremony') {
      this.returnToTitle();
      return;
    }

    if (cfg.mode === 'gp') {
      if (cfg.courseIndex < 2) {
        cfg.courseIndex++;
        this._launchEvent();
      } else {
        this._showCupCeremony();
      }
    } else {
      this._launchEvent();
    }
  }

  _showCupCeremony() {
    this.state = 'cup_ceremony';
    // Build 3D Gold/Silver/Bronze Podium & Spinning Trophy at start line!
    if (this.podiumGroup) this.scene.remove(this.podiumGroup);
    this.podiumGroup = new THREE.Group();
    const s0 = this.track.getTrackPointAt(0);
    this.podiumGroup.position.copy(s0.point);

    const step1 = createCelMesh(new THREE.BoxGeometry(3.6, 2.2, 3.6), { hexColor: 0xffd700 }, 0.06);
    step1.position.set(0, 1.1, 0);
    const step2 = createCelMesh(new THREE.BoxGeometry(3.4, 1.5, 3.4), { hexColor: 0xcbd5e1 }, 0.06);
    step2.position.set(-3.6, 0.75, 0.4);
    const step3 = createCelMesh(new THREE.BoxGeometry(3.4, 1.0, 3.4), { hexColor: 0xd97706 }, 0.06);
    step3.position.set(3.6, 0.5, 0.8);

    // Golden Cup Trophy
    this.trophyMesh = createCelMesh(
      new THREE.CylinderGeometry(0.95, 0.45, 2.0, 12),
      { hexColor: 0xffdd00, emissiveHex: 0xffaa00, emissiveIntensity: 0.45 },
      0.06
    );
    this.trophyMesh.position.set(0, 4.2, 0);
    this.podiumGroup.add(step1, step2, step3, this.trophyMesh);
    this.scene.add(this.podiumGroup);

    // Sort drivers by total Grand Prix Cup Points
    const standings = [...this.karts]
      .filter(k => !k.isGhost)
      .sort((a, b) => (b.points - a.points) || (a.rank - b.rank));

    // Place top 3 karts onto the podium steps!
    const podiumOffsets = [
      new THREE.Vector3(0, 2.2, 0),
      new THREE.Vector3(-3.6, 1.5, 0.4),
      new THREE.Vector3(3.6, 1.0, 0.8)
    ];
    standings.slice(0, 3).forEach((k, idx) => {
      k.position.copy(s0.point).add(podiumOffsets[idx]);
      k.yaw = Math.PI;
      k.syncVisuals(0, this.elapsed);
    });

    const rows = standings.map((k, idx) => ({
      rank: idx === 0 ? '🥇 1st' : idx === 1 ? '🥈 2nd' : idx === 2 ? '🥉 3rd' : `${idx + 1}.`,
      name: `${k.driver.name} ${k.isHuman ? `(P${k.playerIndex + 1})` : '(CPU)'}`,
      stat: `${k.points} CUP PTS`,
      isHuman: k.isHuman
    }));

    this.ui.showResultsScreen({
      title: '🏆 MUSHROOM-FLASH CUP CHAMPIONSHIP! 🏆',
      subtitle: 'Congratulations! Final 3-Course Grand Prix Standings:',
      rows,
      nextLabel: '🏠 Return to Title Screen'
    });
    this.ui.menuState = 'cup_ceremony';
  }

  _updateRankings(isBattle) {
    const active = this.karts.filter(k => !k.isGhost);
    if (isBattle) {
      active.sort((a, b) => (b.balloons - a.balloons) || (a.index - b.index));
    } else {
      active.sort((a, b) => {
        if (a.finished && b.finished) return a.finishTime - b.finishTime;
        if (a.finished) return -1;
        if (b.finished) return 1;
        return b.totalProgress - a.totalProgress;
      });
    }
    active.forEach((k, idx) => {
      k.rank = idx + 1;
    });
  }

  _updateCameras(dt) {
    if (this.state === 'title' || this.state === 'setup') {
      // Smooth sweeping helicopter camera following demo karts on the title screen
      const targetKart = this.karts[0];
      if (targetKart) {
        const cam = this.cameras[0];
        const angle = this.elapsed * 0.35;
        cam.position.set(
          targetKart.position.x + Math.sin(angle) * 14,
          targetKart.position.y + 6.5,
          targetKart.position.z + Math.cos(angle) * 14
        );
        cam.lookAt(targetKart.position.x, targetKart.position.y + 1.2, targetKart.position.z);
      }
      return;
    }

    if (this.state === 'cup_ceremony' && this.podiumGroup) {
      const cam = this.cameras[0];
      const p = this.podiumGroup.position;
      cam.position.set(p.x + Math.sin(this.elapsed * 0.6) * 11, p.y + 4.5, p.z + 12);
      cam.lookAt(p.x, p.y + 2.2, p.z);
      if (this.trophyMesh) this.trophyMesh.rotation.y = this.elapsed * 2.0;
      return;
    }

    if (this.state === 'attract') {
      this.attractTimer += dt;
      if (this.attractTimer > 5.5) {
        this.attractTimer = 0;
        this.attractCamMode = (this.attractCamMode + 1) % 3;
      }
      const leader = this.karts.find(k => k.rank === 1) || this.karts[0];
      const cam = this.cameras[0];
      const labelEl = document.getElementById('attract-cam-label');

      if (leader) {
        if (this.attractCamMode === 0) {
          // Dynamic Chase Cam
          if (labelEl) labelEl.textContent = `LEADER CHASE CAM — ${leader.driver.name.toUpperCase()}`;
          const backX = Math.sin(leader.yaw);
          const backZ = Math.cos(leader.yaw);
          cam.position.lerp(
            new THREE.Vector3(
              leader.position.x + backX * 7.2,
              leader.position.y + 3.1,
              leader.position.z + backZ * 7.2
            ),
            Math.min(1, dt * 10)
          );
          cam.lookAt(leader.position.x - backX * 4, leader.position.y + 1.2, leader.position.z - backZ * 4);
        } else if (this.attractCamMode === 1) {
          // Dramatic Low Front-Quarter Action Cam
          if (labelEl) labelEl.textContent = `DRIFT ACTION CAM — ${leader.driver.name.toUpperCase()}`;
          const fwdX = -Math.sin(leader.yaw - 0.5);
          const fwdZ = -Math.cos(leader.yaw - 0.5);
          cam.position.set(
            leader.position.x + fwdX * 6.2,
            leader.position.y + 2.0,
            leader.position.z + fwdZ * 6.2
          );
          cam.lookAt(leader.position.x, leader.position.y + 1.0, leader.position.z);
        } else {
          // Helicopter Overhead Cam
          if (labelEl) labelEl.textContent = `N64 HELICOPTER TV CAM`;
          cam.position.set(
            leader.position.x + Math.sin(this.elapsed * 0.8) * 18,
            leader.position.y + 14.0,
            leader.position.z + Math.cos(this.elapsed * 0.8) * 18
          );
          cam.lookAt(leader.position.x, leader.position.y + 1.0, leader.position.z);
        }
      }
      return;
    }

    // Active Racing / Battle Split-Screen Chase Cameras
    for (let i = 0; i < this.viewports.length; i++) {
      const vp = this.viewports[i];
      const cam = vp.cam;
      if (vp.isTelemetryQuadrant) {
        // 3P 4th quadrant shows overhead broadcast camera of leader
        const leader = this.karts.find(k => k.rank === 1) || this.karts[0];
        if (leader) {
          cam.position.set(leader.position.x, leader.position.y + 34, leader.position.z + 18);
          cam.lookAt(leader.position.x, leader.position.y, leader.position.z);
        }
        continue;
      }

      const kart = this.humanKarts[i] || this.karts[i];
      if (!kart) continue;

      const backX = Math.sin(kart.yaw);
      const backZ = Math.cos(kart.yaw);
      const boostDistOffset = kart.boostTimer > 0 ? 1.15 : 0;
      const desiredPos = new THREE.Vector3(
        kart.position.x + backX * (6.8 + boostDistOffset),
        kart.position.y + 2.95,
        kart.position.z + backZ * (6.8 + boostDistOffset)
      );
      cam.position.lerp(desiredPos, Math.min(1, dt * 14));
      cam.lookAt(
        kart.position.x - backX * 5.0,
        kart.position.y + 1.25,
        kart.position.z - backZ * 5.0
      );

      // Dynamic FOV boost kick
      const targetFov = kart.boostTimer > 0 || kart.starTimer > 0 ? 72 : 62;
      if (Math.abs(cam.fov - targetFov) > 0.2) {
        cam.fov = THREE.MathUtils.lerp(cam.fov, targetFov, dt * 8);
        cam.updateProjectionMatrix();
      }
    }
  }

  loop(now) {
    requestAnimationFrame((t) => this.loop(t));

    const dt = Math.min(0.05, Math.max(0.001, (now - this.lastFrameTime) / 1000));
    this.lastFrameTime = now;
    this.elapsed += dt;

    this.input.poll(dt);
    const menuAct = this.input.getMenuAction();

    // Handle Attract Mode 10-second idle countdown on Title screen
    if (this.state === 'title' && !this.ui.settingsOpen && !this.ui.creditsOpen) {
      const idleSec = this.input.getIdleSeconds();
      const rem = Math.max(0, Math.ceil(10.0 - idleSec));
      const timerEl = document.getElementById('attract-timer-val');
      if (timerEl) timerEl.textContent = `${rem}`;
      if (idleSec >= 10.0) {
        this.startAttractMode();
        this.input.endFrame();
        return;
      }
    }

    // Exit Attract Mode immediately on ANY input
    if (this.state === 'attract') {
      if (this.input.anyInputJustHappened) {
        this.exitAttractMode();
        this.input.endFrame();
        return;
      }
    } else if (this.state === 'racing') {
      if (menuAct.options || menuAct.back) {
        this.togglePause();
      } else if (menuAct.settingsBtn) {
        this.togglePause();
        this.ui.openSettings();
      }
    } else {
      this.ui.handleMenuInput(menuAct);
    }

    // Update simulation
    if (this.state === 'title' || this.state === 'setup' || this.state === 'attract') {
      this.rapierWorld.step();
      for (const k of this.karts) {
        const aiCtrl = k.computeAIControls(dt, this.track, this.karts, 1.0);
        k.update(dt, this.elapsed, aiCtrl, this.track, 1.0, null);
        if (aiCtrl.useItemJustPressed) {
          this.items.useKartItem(k, this.karts, this.track);
        }
      }
      this.track.update(dt, this.elapsed, this.karts, null);
      this.items.update(dt, this.elapsed, this.karts, this.track, false);
      this._updateRankings(this.track.isBattle);
    } else if (this.state === 'racing') {
      const cfg = this.sessionConfig;
      const eng = ENGINE_CLASSES[cfg.classIndex];
      const isBattle = cfg.mode === 'battle' || this.track.isBattle;
      const isTimeTrial = cfg.mode === 'tt';

      if (this.countdownTimer > 0) {
        this.countdownTimer -= dt;
        const secCeil = Math.ceil(this.countdownTimer);
        if (secCeil < this.lastBeepSecond && secCeil >= 1) {
          this.lastBeepSecond = secCeil;
          this.audio.playCountdownBeep(false);
        }
        // Check Rocket Start input during countdown
        for (const hk of this.humanKarts) {
          const ctrl = this.input.getPlayerControls(hk.playerIndex, this.humanKarts.length);
          hk.updateCountdownInput(dt, ctrl, this.countdownTimer);
        }
        if (this.countdownTimer <= 0) {
          this.audio.playCountdownBeep(true);
          for (const hk of this.humanKarts) {
            hk.applyCountdownLaunch(this.audio);
          }
        }
      } else {
        this.raceTime += dt;
        this.rapierWorld.step();

        for (const k of this.karts) {
          let ctrl;
          if (k.isHuman && !k.finished) {
            ctrl = this.input.getPlayerControls(k.playerIndex, this.humanKarts.length);
          } else {
            ctrl = k.computeAIControls(dt, this.track, this.karts, eng.aiSkill);
          }
          k.update(dt, this.elapsed, ctrl, this.track, eng.speedMult, this.audio);

          if (ctrl.useItemJustPressed && !k.finished) {
            this.items.useKartItem(k, this.karts, this.track);
          }
          if (k.finished && k.finishTime === 0) {
            k.finishTime = this.raceTime;
          }
        }

        // Update Time Trial Ghost recording & playback
        if (isTimeTrial && this.humanKarts[0]) {
          const p1 = this.humanKarts[0];
          this.currentGhostRecording.push({
            x: p1.position.x,
            y: p1.position.y,
            z: p1.position.z,
            yaw: p1.yaw
          });
          const bestRec = this.bestGhostRecordings[COURSES[cfg.courseIndex].id];
          if (this.ghostKart && bestRec?.frames?.length > 0) {
            const frameIdx = Math.min(bestRec.frames.length - 1, this.currentGhostRecording.length - 1);
            const f = bestRec.frames[frameIdx];
            this.ghostKart.position.set(f.x, f.y, f.z);
            this.ghostKart.yaw = f.yaw;
            this.ghostKart.syncVisuals(dt, this.elapsed);
          }
        }

        this.track.update(dt, this.elapsed, this.karts, this.audio);
        this.items.update(dt, this.elapsed, this.karts, this.track, isTimeTrial);
        this._updateRankings(isBattle);

        // Modulate P1 engine audio & music tempo on Final Lap
        const p1 = this.humanKarts[0];
        if (p1) {
          this.audio.updateEngineSound(
            Math.abs(p1.speed) / p1.driver.topSpeed,
            p1.isDrifting,
            p1.boostTimer > 0,
            true
          );
          if (!isBattle && p1.lap === p1.maxLaps) {
            this.audio.setMusicTempo(1.22);
          }
        }

        // Check event completion
        if (isBattle) {
          const aliveAll = this.karts.filter(k => !k.eliminated);
          const aliveHumans = this.humanKarts.filter(k => !k.eliminated);
          if (aliveAll.length <= 1 || aliveHumans.length === 0) {
            this._finishEvent();
          }
        } else {
          const allHumansDone = this.humanKarts.every(hk => hk.finished);
          if (allHumansDone) {
            // Assign estimated finish times to remaining AI karts
            for (const k of this.karts) {
              if (!k.finished) {
                k.finished = true;
                k.finishTime = this.raceTime + (1.0 - (k.totalProgress % 1.0)) * 12 + k.rank * 0.6;
              }
            }
            this._finishEvent();
          }
        }
      }

      this.ui.updateHUD(
        this.humanKarts,
        this.raceTime,
        this.countdownTimer,
        isBattle,
        isTimeTrial
      );
      this.ui.drawMinimap(this.track, this.ghostKart ? [...this.karts, this.ghostKart] : this.karts);
    }

    // Update Lightning flash overlay
    const flashEl = document.getElementById('lightning-flash');
    if (flashEl) {
      flashEl.style.opacity = this.items.lightningFlashTimer > 0 ? String(this.items.lightningFlashTimer * 2) : '0';
    }

    this._updateCameras(dt);
    this._renderFrame();
    this.input.endFrame();
  }

  _renderFrame() {
    if (!this.renderer || this.viewports.length === 0) return;

    this.renderer.setScissorTest(false);
    this.renderer.setClearColor(0x090d16, 1.0);
    this.renderer.clear(true, true, true);

    this.renderer.setScissorTest(true);
    for (let i = 0; i < this.viewports.length; i++) {
      const vp = this.viewports[i];
      if (i > 0) {
        this.renderer.clearDepth();
      }
      this.renderer.setViewport(vp.x, vp.y, vp.w, vp.h);
      this.renderer.setScissor(vp.x, vp.y, vp.w, vp.h);

      if (this.track.skyDome) {
        this.track.skyDome.position.copy(vp.cam.position);
      }
      this.renderer.render(this.scene, vp.cam);
    }
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const app = new FlashOKartApp();
  window.gameApp = app;
  app.init().catch(err => console.error('Flash-O-Kart 64 init error:', err));
});


  </script>
