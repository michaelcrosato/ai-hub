        help() { this.modal = 'help'; this.overlay('A few things for the road', `<div class="grid"><article class="card"><h3>Touch & mouse</h3><p>Put your left thumb down anywhere low on the left to move with the floating stick. The round button beside your right thumb talks, opens chests and uses stairs; its label names what is in reach. On the world map, the Airship pill boards or lands the Airship.</p><p>You can also tap or click a visible ground tile to walk there. Tap a person or chest to approach and interact automatically. Pinch or use the mouse wheel to zoom. Menus are touch-operated; no hover is required.</p></article><article class="card"><h3>Keyboard</h3><p>WASD or arrow keys move. E, Space, or Enter interacts. M opens the atlas, J the journal, C the party, O options, F fullscreen, V the Airship, and − / + zoom. Escape or P opens the campfire menu or closes a window; F9 opens graphics and control settings.</p><p>In menus, arrow keys or Tab move the focus. In battle: 1 Attack, 2 Magic, 3 Items, 4 Defend, R plans attacks for everyone, Enter commits the round, and Escape or Backspace steps back.</p></article><article class="card"><h3>Gamepad</h3><p>Left stick or D-pad moves. A interacts or presses the focused button. B goes back or opens the campfire menu. X opens the party, Y the atlas, View the journal, Start the menu, RT the Airship, and LB / RB zoom.</p><p>In menus and battle the stick or D-pad moves the focus; LB / RB switch tabs, or the acting traveler in battle. Browser gamepad support may require pressing a button after connecting.</p></article><article class="card"><h3>Plan four actions</h3><p>Choose a command for each living traveler, then commit the round. Initiative decides the order. Unassigned travelers defend. Press a traveler’s card to revise their command.</p><p>Magic has eight charge tiers, not a shared MP bar. Learn only three spells at each tier. Armor, elemental wards, haste, and reusable enchanted gear can decide a long dungeon expedition.</p></article><article class="card"><h3>Survive the journey</h3><p>Inns restore HP, spell charges, and ailments. HEAL potions and field healing preserve your party between fights. Tents, Cabins, and Houses work outdoors. Houses also refill charges.</p><p>White magic harms undead; lightning is strong against sea creatures. Poison persists after battle. PURE cures it; SOFT cures petrification. Sanctuaries treat a party without enough gold.</p></article><article class="card"><h3>Travel & saving</h3><p>The Ship automatically carries you onto the sea. The Canoe crosses rivers. Once awakened, board or land the Airship with V or the action button away from landmarks. Land before entering a destination.</p><p>The atlas shows landmarks and local dungeon plans. The journal tracks both the main quest and clearly labeled original side quests. Export a save from Options to keep an independent backup.</p></article></div>`, btn('Set out', 'close', '', 'primary'), 'CONTROLS & FIELD GUIDE'); }
        coverage() { this.modal = 'coverage'; const a = Object.values(FO.AREAS), q = FO.QUESTS.filter(q => !q.addition), weapons = Object.values(FO.GEAR).filter(g => g.slot === 'weapon' && !g.addition), armor = Object.values(FO.GEAR).filter(g => g.slot !== 'weapon' && !g.addition); this.overlay('The source & this edition', `<div class="tabs">${btn('Content ledger', 'coverage', '', 'selected')}${btn('Bestiary', 'bestiary')}${btn('Controls', 'help')}</div><p>This is an unofficial, independently authored adaptation inspired by <b>Final Fantasy for the NES</b>. The reference is Gamer Corner Guides’ full NES walkthrough. All geometry, interface, dialogue, and procedural music are newly made; no ROM, ripped artwork, or soundtrack is embedded.</p><div class="card"><h3>What this build claims—and does not</h3><p class="muted">The full main quest chain is implemented from Coneria to Chaos and an ending. Named areas, tiered magic, classes, equipment, key-item exchanges, and an additional postgame are represented. Dungeon layouts, encounters, balance, shops, and much dialogue are adapted, not exact transcriptions.</p><p class="bad">This is not a verified 90% reproduction of every guide detail. Exact NES maps, every fixed encounter and treasure placement, encounter probabilities, original statistical tables, and all class-specific spell restrictions are not reproduced. The requested BabylonJS/Vite build stack was unavailable; this edition renders with three.js (WebGPU, with a WebGL 2 fallback) on the hub’s shared 3D kit.</p></div><div class="stat-grid" style="margin:20px 0"><div>Areas<strong>${a.length}</strong></div><div>Area floors<strong>${a.reduce((n, a) => n + a.floors, 0)}</strong></div><div>Spells<strong>${Object.keys(FO.SPELLS).length}</strong></div><div>Equipment<strong>${weapons.length + armor.length}</strong></div></div><details open><summary>Story & quest checklist · named milestones</summary>${q.map(x => `<div class="list-row"><div><b>${x.name}</b><p>${x.text}</p><small>Implementation: quest flag <code>${x.flag}</code> · ${FO.AREAS[x.where]?.name}</small></div><span class="badge">${this.state.flags[x.flag] ? '✓ Achieved' : 'Implemented'}</span></div>`).join('')}</details><details><summary>Areas & floors · adapted traversable maps</summary>${a.map(x => `<div class="list-row"><div><b>${x.name}${x.addition ? ' · Addition' : ''}</b><p>${x.floors} floor${x.floors === 1 ? '' : 's'} · ${x.kind} · implementation <code>${x.id}</code></p></div><span class="badge">${this.state.visits[x.id] ? 'Visited' : 'Available in progression'}</span></div>`).join('')}</details><details><summary>Key items · ${Object.keys(FO.KEYITEMS).length} functional progression items</summary>${Object.entries(FO.KEYITEMS).map(([id, k]) => `<p><b>${k.name}</b> — ${k.desc} <small>[${id}]</small></p>`).join('')}</details><details><summary>Weapons · ${weapons.length} named catalogue entries</summary>${weapons.map(g => `<p><b>${g.name}</b> — power ${g.power}; ${g.classes}; ${g.spell ? 'reusable ' + FO.SPELLS[g.spell].name + '; ' : ''}${g.element || g.family || 'physical'} <small>[GEAR.${g.id}]</small></p>`).join('')}</details><details><summary>Armor · ${armor.length} named catalogue entries</summary>${armor.map(g => `<p><b>${g.name}</b> — ${g.slot}; defense ${g.power}; ${g.resist?.join(', ') || 'physical protection'}${g.spell ? '; reusable ' + FO.SPELLS[g.spell].name : ''} <small>[GEAR.${g.id}]</small></p>`).join('')}</details><details><summary>Spells · all 64 named spells, rebalanced mechanics</summary>${Object.values(FO.SPELLS).map(sp => `<p><b>${sp.id} / ${sp.name}</b> — tier ${sp.level} ${sp.school}; ${sp.desc} <small>[${sp.effect}]</small></p>`).join('')}</details><details><summary>Gameplay systems & modernization</summary><p>Four-character formation; six starting classes and six promotions; experience and levels; physical multi-hit attacks; critical hits; five equipment slots; bare-fist martial artists; resistance and weakness; eight shared charge tiers; three learned spells per tier; ailment cures, KO and revival; party buffs; reusable enchanted equipment; random encounters; visible boss challenges; inn, sanctuary, shops and bulk purchases; ship, canoe and Airship; key-gated transitions; guarded and locked treasure; world and local maps; save slots and JSON export.</p><p>Modernizations: optional automatic retargeting; meaningful intelligence; repaired Temper, Saber, Lock, and weapon family/element effects; healing/save order for Houses; damage and hit feedback; visible enemy intentions; animation speed; touch movement; gamepad navigation; adjustable difficulty and encounter frequency; defeat retry with pre-battle state.</p><p>Not copied: NES memory/inventory limits, original exploitable bugs, exact initiative/stat curves, exact terrain and encounter tables, optional ship sliding-tile minigame.</p></details><details><summary>Original additions · separately identified</summary>${FO.QUESTS.filter(q => q.addition).map(q => `<p><b>${q.name}</b> — ${q.text}</p>`).join('')}<p>Six-floor Dawn Sanctum; three-floor Starfall Observatory with its orrery, four astral foes, the Eclipse Engine and the Starlit Veil; Dawn Mantle and Oathblade; fewest-round boss records; Phoenix Feathers, Sun Potions, Moon Ethers, Stardust; equipment reinforcement to +3; additional dialogue, notice boards, quest tracking, and post-ending free exploration.</p></details><details><summary>Research & player-feedback sources</summary><p>The reference guide supplies progression and names. The RPGFan NES review informed emphasis on attrition, party replayability, clear hit statistics, and animated battle feedback; these are design responses, not a claim of user playtesting.</p>${FO.SOURCES.map(([n, u]) => `<p><a href="${u}" target="_blank" rel="noopener noreferrer">${esc(n)}</a></p>`).join('')}</details><hr class="sep"><h3>Made for this journey</h3><p class="credits">Project title: Fourfold Oath — The Broken Dawn.<br>Original prompt date: September 26, 2026.<br>Original AI model: GPT-6 Astra Pro.<br>Original code, geometry, writing, interface, and synthesized music. Final Fantasy and its source characters and names belong to their respective rights holders. This is not an official Square Enix game.</p>`, btn('Export content ledger', 'exportLedger') + btn('Return', 'close', '', 'primary'), 'CREDITS & COVERAGE'); }

        ordeal: { title: 'The pillars of trial', text: 'Three pillars are etched with a crown, a flame, and an open hand. Above them: “A ruler listens before commanding. A heart warms before conquering. Courage gives before taking.”', options: ['Listen', 'Conquer', 'Warm', 'Take', 'Give'], seq: ['Listen', 'Warm', 'Give'], unit: 'choices' },

    // Windows, the title and the battle panel with a gamepad or the keyboard: the stick, D-pad or arrows move the
