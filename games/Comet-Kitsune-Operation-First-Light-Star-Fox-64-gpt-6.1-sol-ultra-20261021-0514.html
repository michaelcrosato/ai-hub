  health = 100;
  phase = 0;
  ship.position.set(0, 7, 0);
  ship.visible = true;
  yaw = 0;
  wingShips.forEach((s) => s.visible = false);
  ui.show("title");
  input.clear();
}
function pause() {
  if (mode === "playing" && !attract) {
    mode = "paused";
    ui.show("pause");
    input.clear();
  }
}
function resume() {
  if (mode === "paused") {
    mode = "playing";
    ui.show("hidden");
    input.clear();
  }
}
function fatal(message) {
  mode = "fatal";
  renderer?.setAnimationLoop(null);
  ui.show("fatal", { message });
  input.clear();
  let last = performance.now();
  const tick = (now) => {
    if (mode !== "fatal") return;
    const dt = Math.min(0.05, (now - last) / 1e3);
    last = now;
    const raw = input.poll(dt, ui.settings);
    ui.handle(raw, dt);
    ui.tick(dt);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
async function boot() {
  input = createInput();
  audio = createAudio();
  ui = createUI({ start: () => startRun(false, false), resume, restart: () => startRun(false, mode === "debrief" && health > 0 ? false : true), menu: title, setting: (key, value) => {
    audio.setVolumes(ui.settings.volume, ui.settings.music);
    if (key === "difficulty") audio.play("ui");
  } });
  ui.setAbout?.(document.getElementById("flight-credits").innerHTML);
  ui.setReady(false);
  ui.show("title");
  window.__COMET__ = { get ready() {
    return ready;
  }, get state() {
    return { mode, attract, phase: chapters[phase]?.id, phaseTime, health, score, route, ship: { x: ship?.position.x, y: ship?.position.y, z: ship?.position.z }, settings: { ...ui.settings }, screen: ui.getScreen(), stats: { ...stats }, mapping: input.mapping };
  }, startAttract: () => startRun(true, false) };
  try {
    if (!navigator.gpu) throw new Error("WebGPU is unavailable. Open this file in a WebGPU-capable browser on a secure origin (HTTPS or localhost).");
    scene = new THREE2.Scene();
    camera = new THREE2.PerspectiveCamera(66, innerWidth / innerHeight, 0.2, 2600);
    renderer = new THREE2.WebGPURenderer({ antialias: true, alpha: false });
    renderer._getFallback = null;
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE2.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.domElement.id = "flight-canvas";
    document.body.prepend(renderer.domElement);
    await renderer.init();
    if (!renderer.backend.isWebGPUBackend) throw new Error("A WebGPU backend is required. WebGL fallback is disabled.");
    stats.webgpu = true;
    renderer.backend.device.lost.then((info) => {
      if (info.reason !== "destroyed") {
        fatal("The GPU connection was lost. Reload the mission to reconnect. " + info.message);
      }
    });
    await RAPIER.init();
    world = new RAPIER.World({ x: 0, y: 0, z: 0 });
    events = new RAPIER.EventQueue(true);
    env = createEnvironment(scene);
    ship = createShip("player");
    ship.scale.setScalar(0.65);
    ship.position.set(0, 7, 0);
    scene.add(ship);
    player = physical(ship, "player", 1.45);
    for (const team of ["rook", "pip"]) {
      const s = createShip(team);
      s.scale.setScalar(0.55);
      s.visible = false;
      scene.add(s);
      wingShips.push(s);
    }
    camera.position.set(14, 13, 29);
    camera.lookAt(0, 6, -30);
    env.update(ship.position, 0, "canyon", "UNDECIDED");
    await renderer.renderAsync(scene, camera);
    ready = true;
    ui.setReady(true);
    audio.setVolumes(ui.settings.volume, ui.settings.music);
    let last = performance.now();
    renderer.setAnimationLoop((now) => {
      const dt = Math.min(0.045, Math.max(1e-3, (now - last) / 1e3));
      last = now;
      try {
        frame(dt);
      } catch (e) {
        renderer.setAnimationLoop(null);
        mode = "fatal";
        const detail = "phase=" + chapters[phase].id + " t=" + phaseTime.toFixed(2) + " bodies=" + world.bodies.len() + " shots=" + shots.length + " dt=" + dt + " position=" + ship.position.toArray().join(",");
        stats.errors.push(detail + " " + e.message);
        console.error("COMET FRAME " + detail, e);
        fatal("Flight simulation interrupted. Reload to restart. " + e.message);
      }
    });
    if (location.hash === "#attract") startRun(true, false);
  } catch (e) {
    stats.errors.push(e.message);
    fatal(e.message);
    console.error("COMET BOOT:", e);
  }
}
function frame(dt) {
  stats.frames++;
  time += dt;
  const raw = input.poll(dt, ui.settings);
  if (raw.any || raw.device === "gamepad") ui.setInputType(raw.device, raw.any && !input.touchOnly);
  if (raw.any) {
    idle = 0;
    lastActivity = performance.now();
    if (attract) {
      title();
      ui.tick(dt);
      renderer.render(scene, camera);
      return;
    }
  }
  if (raw.any) audio.unlock();
  if (mode === "title") {
    if (raw.fire || raw.boost || raw.brake || Math.abs(raw.x) + Math.abs(raw.y) > 0.3) lastActivity = performance.now();
    idle = (performance.now() - lastActivity) / 1e3;
    ui.handle(raw, dt);
    ship.position.y = 7 + Math.sin(time * 0.65) * 0.6;
    ship.position.z = -time * 10;
    ship.rotation.set(Math.sin(time * 0.5) * 0.06, Math.sin(time * 0.25) * 0.16, Math.sin(time * 0.7) * 0.12);
    camera.position.copy(ship.position).add(V(13 + Math.sin(time * 0.15) * 3, 7, 26));
    camera.lookAt(ship.position.clone().add(V(-1, 0, -5)));
    if (ui.getScreen() === "title" && idle >= 10 && !input.touchOnly) startRun(true, false);
  } else if (mode === "paused" || mode === "debrief") ui.handle(raw, dt);
  else if (mode === "playing") {
    if (raw.pause && !attract) {
      pause();
    } else {
      const controls = attract ? autopilot(dt) : raw;
      const pacing = attract ? 1.65 : 1;
      phaseTime += dt * pacing;
      missionTime += dt;
      runTime += dt;
      radioClock = Math.max(0, radioClock - dt);
      comboTime -= dt;
      if (comboTime <= 0) combo = 0;
      stageScript();
      flight(dt, controls);
      enemyUpdate(dt);
      bossUpdate(dt);
      if (attract && boss) {
        bossClock += dt;
        if (bossClock > 2.7) {
          bossClock = 0;
          const part = boss.parts.find((p) => !p.dead && !p.inactive);
          if (part) hitEnemy(part, 26);
        }
      }
      world.timestep = dt;
      world.step(events);
      stats.physicsSteps++;
      collisions();
      updateShots(dt);
      updateItems(dt);
      updateEffects(dt);
      spawnClock -= dt;
      pickupClock -= dt;
      if (spawnClock <= 0) {
        spawnClock = phase === 2 ? 5 : phase === 3 ? 9 : 4.6;
        spawnWave();
      }
      if (pickupClock <= 0) {
        pickupClock = phase === 3 ? 13 : 9;
        const pos = ship.position.clone().addScaledVector(forward(), phase === 2 ? 65 : 130);
        pos.x += Math.sin(time) * 9;
        pos.y = clamp2(ship.position.y + Math.sin(time * 0.5) * 4, 0, 18);
        spawnItem(phase === 3 ? "shield" : rings % 3 === 2 ? "gold" : Math.random() < 0.25 ? "shield" : "ring", pos);
      }
      if (phase < 3 && phaseTime >= chapters[phase].duration) enterPhase(phase + 1);
      cameraUpdate(dt, controls);
      hud();
      audio.update(dt, { mode: phase === 3 ? "boss" : phase === 2 ? "arena" : "playing", boost: controls.boost, speed, danger: health < 30, stage: chapters[phase].id });
    }
  } else if (mode === "ending") {
    endTimer -= dt;
    updateEffects(dt);
    cameraUpdate(dt);
    if (health > 0) {
      ship.position.z -= dt * 13;
      ship.position.y += dt * 1.5;
      if (boss && Math.random() < dt * 12) burst(boss.obj.position.clone().add(V((Math.random() - 0.5) * 40, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 15)), 16760182, 15, 1.6);
    }
    if (endTimer <= 0) debrief();
    hud();
  }
  if (mode === "title" || mode === "paused" || mode === "debrief") audio.update(dt, { mode: mode === "title" ? "menu" : "paused", speed: 0, boost: false, danger: false, stage: chapters[phase].id });
  env.update(ship.position, time, chapters[phase].id, route);
  ui.tick(dt);
  const flash = document.getElementById("bomb-flash");
  if (flash) {
    bombFlash = Math.max(0, bombFlash - dt * 1.8);
    flash.style.opacity = String(bombFlash * 0.75);
  }
  renderer.render(scene, camera);
}
window.addEventListener("resize", () => {
  if (!renderer) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) pause();
});
boot();

</script></body></html>
