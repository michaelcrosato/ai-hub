    /* =========================================================================
       2. PROCEDURAL WEB AUDIO SYNTHESIZER (CPS-1 1988 ARCADE INSPIRED)
       ========================================================================= */
    class ArcadeAudioEngine {
      constructor() {
        this.ctx = null;
        this.musicTimer = 0;
        this.beatIndex = 0;
        this.isPlayingMusic = false;
      }

      ensureContext() {
        if (!SETTINGS.soundEnabled) return false;
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume().catch(() => {});
        }
        return Boolean(this.ctx && this.ctx.state === "running");
      }

      playTone(freq, endFreq, duration, type = "sawtooth", gainLevel = 0.15) {
        if (!this.ensureContext()) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (endFreq !== freq) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
        }
        const scaledGain = gainLevel * SETTINGS.sfxVolume;
        gain.gain.setValueAtTime(scaledGain, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      playNoise(duration = 0.2, gainLevel = 0.2, filterFreq = 900) {
        if (!this.ensureContext()) return;
        const now = this.ctx.currentTime;
        const bufferSize = Math.floor(this.ctx.sampleRate * duration);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(filterFreq, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(gainLevel * SETTINGS.sfxVolume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }

      sfxMoveCursor() {
        this.playTone(520, 780, 0.055, "square", 0.11);
      }

      sfxConfirm() {
        this.playTone(440, 880, 0.12, "triangle", 0.18);
        setTimeout(() => this.playTone(660, 1320, 0.14, "square", 0.15), 50);
      }

      sfxCancel() {
        this.playTone(400, 210, 0.12, "sawtooth", 0.14);
      }

      sfxShoot(weaponIdx) {
        if (weaponIdx === 0) {
          this.playTone(720, 220, 0.06, "square", 0.07);
        } else if (weaponIdx === 1) {
          this.playTone(1180, 420, 0.08, "sawtooth", 0.08);
        } else if (weaponIdx === 2) {
          this.playTone(320, 95, 0.12, "sawtooth", 0.11);
        } else {
          this.playTone(980, 310, 0.07, "triangle", 0.09);
        }
      }

      sfxBlock() {
        this.playTone(1450, 920, 0.05, "triangle", 0.12);
      }

      sfxZenny() {
        this.playTone(987.77, 1318.5, 0.09, "sine", 0.16);
        setTimeout(() => this.playTone(1318.5, 1975.5, 0.12, "triangle", 0.14), 45);
      }

      sfxExplosion(large = false) {
        if (large) {
          this.playNoise(0.45, 0.32, 380);
          this.playTone(150, 32, 0.42, "sawtooth", 0.24);
        } else {
          this.playNoise(0.18, 0.18, 720);
          this.playTone(220, 65, 0.16, "square", 0.12);
        }
      }

      sfxMegacrush() {
        this.playNoise(0.65, 0.36, 520);
        this.playTone(220, 880, 0.35, "sawtooth", 0.25);
        setTimeout(() => this.playTone(880, 110, 0.45, "sawtooth", 0.25), 180);
      }

      updateMusic(dt, mode) {
        if (!SETTINGS.soundEnabled || SETTINGS.musicVolume <= 0.01) return;
        if (mode !== "PLAYING" && mode !== "SHOP") return;
        if (!this.ensureContext()) return;

        this.musicTimer -= dt;
        if (this.musicTimer <= 0) {
          this.musicTimer = 0.15; // 100 BPM 16th-note pulse
          const bassSeq = [
            110, 110, 130.81, 146.83, 164.81, 146.83, 130.81, 123.47,
            110, 110, 164.81, 146.83, 196.00, 174.61, 146.83, 130.81
          ];
          const leadSeq = [
            440, 0, 523.25, 587.33, 659.25, 0, 587.33, 523.25,
            493.88, 0, 392.00, 440, 587.33, 523.25, 493.88, 440
          ];

          const step = this.beatIndex % 16;
          const bassFreq = mode === "SHOP" ? bassSeq[step] * 0.75 : bassSeq[step];
          this.playMusicNote(bassFreq, 0.12, "sawtooth", 0.055 * SETTINGS.musicVolume);

          const leadFreq = leadSeq[step];
          if (leadFreq > 0 && (this.beatIndex % 32 < 24)) {
            this.playMusicNote(
              mode === "SHOP" ? leadFreq * 1.25 : leadFreq,
              0.11,
              "square",
              0.038 * SETTINGS.musicVolume
            );
          }
          this.beatIndex++;
        }
      }

      playMusicNote(freq, dur, type, vol) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + dur);
      }
    }

    const audio = new ArcadeAudioEngine();

    /* =========================================================================
       3. UNIFIED 10-FOOT CONTROLLER + KEYBOARD INPUT MANAGER
       ========================================================================= */
    class InputManager {
      constructor(canvas) {
        this.canvas = canvas;
        this.keys = new Set();
        this.justPressedKeys = new Set();
        this.prevGamepadButtons = new Array(20).fill(false);
        this.gamepadConnected = false;
        this.gamepadName = "No Controller Detected";
        this.lastInputTime = performance.now();
        this.anyInputTriggeredThisFrame = false;

        this.mousePos = { x: CANVAS_W * 0.7, y: CANVAS_H * 0.5 };
        this.mouseMoved = false;
        this.mouseDown = false;

        this.touchOnlyDetected = false;
        this.setupListeners();
      }

      setupListeners() {
        const isCoarsePointer = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
        const hasFinePointer = window.matchMedia && window.matchMedia("(any-pointer: fine)").matches;
        if (isCoarsePointer && !hasFinePointer) {
          this.touchOnlyDetected = true;
          this.updateTouchGateVisibility();
        }

        window.addEventListener("keydown", (e) => {
          if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Tab"].includes(e.code)) {
            e.preventDefault();
          }
          if (!this.keys.has(e.code)) {
            this.justPressedKeys.add(e.code);
          }
          this.keys.add(e.code);
          this.registerUserActivity();
          if (this.touchOnlyDetected) {
            this.touchOnlyDetected = false;
            this.updateTouchGateVisibility();
          }
        });

        window.addEventListener("keyup", (e) => {
          this.keys.delete(e.code);
        });

        window.addEventListener("gamepadconnected", (e) => {
          this.gamepadConnected = true;
          this.gamepadName = e.gamepad.id || "PS5 / Standard Controller";
          this.registerUserActivity();
          if (this.touchOnlyDetected) {
            this.touchOnlyDetected = false;
            this.updateTouchGateVisibility();
          }
        });

        window.addEventListener("gamepaddisconnected", () => {
          this.gamepadConnected = false;
          this.gamepadName = "No Controller Detected";
        });

        this.canvas.addEventListener("mousemove", (e) => {
          const rect = this.canvas.getBoundingClientRect();
          this.mousePos.x = ((e.clientX - rect.left) / rect.width) * CANVAS_W;
          this.mousePos.y = ((e.clientY - rect.top) / rect.height) * CANVAS_H;
          this.mouseMoved = true;
          this.registerUserActivity();
        });

        this.canvas.addEventListener("mousedown", (e) => {
          if (e.button === 0) {
            this.mouseDown = true;
            this.justPressedKeys.add("MouseLeft");
            this.registerUserActivity();
          }
        });

        window.addEventListener("mouseup", (e) => {
          if (e.button === 0) {
            this.mouseDown = false;
          }
        });

        // Touch Gate Settings button support
        const touchSettingsBtn = document.getElementById("touch-settings-btn");
        const touchSettingsPanel = document.getElementById("touch-settings-panel");
        const touchMuteBtn = document.getElementById("touch-mute-btn");
        const touchHalftoneBtn = document.getElementById("touch-halftone-btn");

        if (touchSettingsBtn) {
          touchSettingsBtn.addEventListener("click", () => {
            touchSettingsPanel.classList.toggle("open");
            audio.sfxConfirm();
          });
        }
        if (touchMuteBtn) {
          touchMuteBtn.addEventListener("click", () => {
            SETTINGS.soundEnabled = !SETTINGS.soundEnabled;
            touchMuteBtn.textContent = SETTINGS.soundEnabled ? "ENABLED" : "MUTED";
          });
        }
        if (touchHalftoneBtn) {
          touchHalftoneBtn.addEventListener("click", () => {
            SETTINGS.halftoneOverlay = !SETTINGS.halftoneOverlay;
            touchHalftoneBtn.textContent = SETTINGS.halftoneOverlay ? "ON" : "OFF";
          });
        }
      }

      updateTouchGateVisibility() {
        const gate = document.getElementById("touch-gate");
        if (!gate) return;
        if (this.touchOnlyDetected) {
          gate.classList.add("visible");
        } else {
          gate.classList.remove("visible");
        }
      }

      registerUserActivity() {
        this.lastInputTime = performance.now();
        this.anyInputTriggeredThisFrame = true;
        audio.ensureContext();
      }

      poll() {
        this.anyInputTriggeredThisFrame = false;
        const state = {
          moveX: 0,
          moveY: 0,
          aimStickX: 0,
          aimStickY: 0,
          aimRotateDir: 0,
          fireHeld: false,
          firePressed: false,
          specialPressed: false,
          shopInteractPressed: false,
          pausePressed: false,
          navUp: false,
          navDown: false,
          navLeft: false,
          navRight: false,
          confirmPressed: false,
          backPressed: false,
          anyUserAction: false
        };

        // Keyboard movement
        if (this.keys.has("KeyW") || this.keys.has("ArrowUp")) state.moveY -= 1;
        if (this.keys.has("KeyS") || this.keys.has("ArrowDown")) state.moveY += 1;
        if (this.keys.has("KeyA") || this.keys.has("ArrowLeft")) state.moveX -= 1;
        if (this.keys.has("KeyD") || this.keys.has("ArrowRight")) state.moveX += 1;

        // Keyboard rotational aim ("Rolling Switch" homage)
        if (this.keys.has("KeyQ") || this.keys.has("KeyJ") || this.keys.has("Comma")) state.aimRotateDir -= 1;
        if (this.keys.has("KeyE") || this.keys.has("KeyL") || this.keys.has("Period")) state.aimRotateDir += 1;

        // Keyboard actions
        if (this.keys.has("Space") || this.keys.has("KeyZ") || this.keys.has("KeyK") || this.mouseDown) {
          state.fireHeld = true;
        }
        if (
          this.justPressedKeys.has("Space") ||
          this.justPressedKeys.has("KeyZ") ||
          this.justPressedKeys.has("KeyK") ||
          this.justPressedKeys.has("MouseLeft")
        ) {
          state.firePressed = true;
        }

        if (this.justPressedKeys.has("KeyF")) {
          SETTINGS.autoFire = !SETTINGS.autoFire;
          audio.sfxConfirm();
        }

        if (this.justPressedKeys.has("KeyX") || this.justPressedKeys.has("ShiftLeft") || this.justPressedKeys.has("ShiftRight")) {
          state.specialPressed = true;
        }

        if (this.justPressedKeys.has("Enter") || this.justPressedKeys.has("KeyC")) {
          state.shopInteractPressed = true;
        }

        if (this.justPressedKeys.has("Escape") || this.justPressedKeys.has("KeyP")) {
          state.pausePressed = true;
        }

        // Menu Navigation (Keyboard)
        if (this.justPressedKeys.has("KeyW") || this.justPressedKeys.has("ArrowUp")) state.navUp = true;
        if (this.justPressedKeys.has("KeyS") || this.justPressedKeys.has("ArrowDown")) state.navDown = true;
        if (this.justPressedKeys.has("KeyA") || this.justPressedKeys.has("ArrowLeft")) state.navLeft = true;
        if (this.justPressedKeys.has("KeyD") || this.justPressedKeys.has("ArrowRight")) state.navRight = true;
        if (this.justPressedKeys.has("Enter") || this.justPressedKeys.has("Space") || this.justPressedKeys.has("KeyZ")) {
          state.confirmPressed = true;
        }
        if (this.justPressedKeys.has("Escape") || this.justPressedKeys.has("Backspace") || this.justPressedKeys.has("KeyX")) {
          state.backPressed = true;
        }

        if (this.justPressedKeys.size > 0 || this.keys.size > 0 || this.mouseMoved || this.mouseDown) {
          state.anyUserAction = true;
          this.lastInputTime = performance.now();
        }

        // Poll W3C Gamepad API (PS5 DualSense / Standard Mapping)
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        let gp = null;
        for (let i = 0; i < gamepads.length; i++) {
          if (gamepads[i] && gamepads[i].connected) {
            gp = gamepads[i];
            break;
          }
        }

        if (gp) {
          this.gamepadConnected = true;
          this.gamepadName = gp.id;
          if (this.touchOnlyDetected) {
            this.touchOnlyDetected = false;
            this.updateTouchGateVisibility();
          }

          const deadzone = 0.2;
          const lx = gp.axes[0] || 0;
          const ly = gp.axes[1] || 0;
          const rx = gp.axes[2] || 0;
          const ry = gp.axes[3] || 0;

          if (Math.hypot(lx, ly) > deadzone) {
            state.moveX = lx;
            state.moveY = ly;
            state.anyUserAction = true;
            this.lastInputTime = performance.now();
          }

          if (Math.hypot(rx, ry) > deadzone) {
            state.aimStickX = rx;
            state.aimStickY = ry;
            state.anyUserAction = true;
            this.lastInputTime = performance.now();
          }

          const btnPressed = (idx) => Boolean(gp.buttons[idx] && gp.buttons[idx].pressed);
          const btnJustPressed = (idx) => btnPressed(idx) && !this.prevGamepadButtons[idx];

          // D-Pad
          if (btnPressed(12)) { state.moveY = -1; state.anyUserAction = true; }
          if (btnPressed(13)) { state.moveY = 1; state.anyUserAction = true; }
          if (btnPressed(14)) { state.moveX = -1; state.anyUserAction = true; }
          if (btnPressed(15)) { state.moveX = 1; state.anyUserAction = true; }

          if (btnJustPressed(12)) state.navUp = true;
          if (btnJustPressed(13)) state.navDown = true;
          if (btnJustPressed(14)) state.navLeft = true;
          if (btnJustPressed(15)) state.navRight = true;

          // Stick menu nav pulse
          if (ly < -0.65 && !this._stickNavLockY) { state.navUp = true; this._stickNavLockY = true; }
          else if (ly > 0.65 && !this._stickNavLockY) { state.navDown = true; this._stickNavLockY = true; }
          else if (Math.abs(ly) < 0.3) { this._stickNavLockY = false; }

          if (lx < -0.65 && !this._stickNavLockX) { state.navLeft = true; this._stickNavLockX = true; }
          else if (lx > 0.65 && !this._stickNavLockX) { state.navRight = true; this._stickNavLockX = true; }
          else if (Math.abs(lx) < 0.3) { this._stickNavLockX = false; }

          // L1 / R1 aim rotation
          if (btnPressed(4)) state.aimRotateDir -= 1;
          if (btnPressed(5)) state.aimRotateDir += 1;

          // R2 (7) or Cross (0) to fire
          if (btnPressed(7) || btnPressed(0)) state.fireHeld = true;
          if (btnJustPressed(7) || btnJustPressed(0)) state.firePressed = true;

          // Square (2) or L2 (6) for Mega-Crush Overdrive
          if (btnJustPressed(2) || btnJustPressed(6)) state.specialPressed = true;

          // Triangle (3) or Circle (1) to enter shop
          if (btnJustPressed(3) || btnJustPressed(1)) state.shopInteractPressed = true;

          // Options (9) to Pause
          if (btnJustPressed(9)) state.pausePressed = true;

          // Cross (0) Confirm, Circle (1) Back
          if (btnJustPressed(0)) state.confirmPressed = true;
          if (btnJustPressed(1)) state.backPressed = true;

          for (let i = 0; i < gp.buttons.length && i < 20; i++) {
            const isDown = btnPressed(i);
            if (isDown) {
              state.anyUserAction = true;
              this.lastInputTime = performance.now();
            }
            this.prevGamepadButtons[i] = isDown;
          }
        }

        // Normalize movement vector if diagonal
        const mag = Math.hypot(state.moveX, state.moveY);
        if (mag > 1) {
          state.moveX /= mag;
          state.moveY /= mag;
        }

        this.justPressedKeys.clear();
        this.mouseMoved = false;
        return state;
      }

      getIdleSeconds() {
        return (performance.now() - this.lastInputTime) / 1000;
      }
    }

    /* =========================================================================
       4. CEL-SHADED / COMIC INK RENDERING HELPERS
       ========================================================================= */
    function drawInkPanel(ctx, x, y, w, h, bgColor = "#141026", accentColor = "#ffcb2e", tilt = 0) {
      ctx.save();
      if (tilt !== 0) {
        ctx.translate(x + w / 2, y + h / 2);
        ctx.rotate(tilt);
        ctx.translate(-(x + w / 2), -(y + h / 2));
      }
      // Hard comic drop shadow
      ctx.fillStyle = "#08060c";
      ctx.fillRect(x + 10, y + 10, w, h);

      ctx.fillStyle = accentColor;
      ctx.fillRect(x + 5, y + 5, w, h);

      ctx.fillStyle = bgColor;
      ctx.fillRect(x, y, w, h);

      ctx.lineWidth = 5;
      ctx.strokeStyle = "#08060c";
      ctx.strokeRect(x, y, w, h);
      ctx.restore();
    }

    function drawComicText(ctx, text, x, y, size, fill = "#ffcb2e", shadow = "#08060c", align = "left") {
      ctx.save();
      ctx.font = `900 ${size}px Impact, 'Arial Black', sans-serif`;
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.lineJoin = "round";

      ctx.fillStyle = shadow;
      ctx.fillText(text, x + 4, y + 4);

      ctx.lineWidth = Math.max(4, size * 0.16);
      ctx.strokeStyle = "#08060c";
      ctx.strokeText(text, x, y);

      ctx.fillStyle = fill;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function drawButtonBadge(ctx, label, actionText, x, y, bgColor = "#00e5ff") {
      ctx.save();
      ctx.font = "900 20px Impact, 'Arial Black', sans-serif";
      const badgeW = Math.max(46, ctx.measureText(label).width + 24);
      ctx.fillStyle = "#08060c";
      ctx.fillRect(x + 3, y - 15, badgeW, 34);
      ctx.fillStyle = bgColor;
      ctx.fillRect(x, y - 18, badgeW, 34);
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = "#08060c";
      ctx.strokeRect(x, y - 18, badgeW, 34);

      ctx.fillStyle = "#08060c";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, x + badgeW / 2, y);

      ctx.textAlign = "left";
      ctx.font = "800 21px 'Trebuchet MS', sans-serif";
      ctx.fillStyle = "#f7f1e1";
      ctx.fillText(actionText, x + badgeW + 12, y);
      ctx.restore();
      return badgeW + 24 + ctx.measureText(actionText).width;
    }
