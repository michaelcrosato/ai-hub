      /* =======================================================================
         6. AUTONOMOUS ATTRACT MODE AI PILOT
         ======================================================================= */
      computeAttractAI(dt) {
        const ai = {
          moveX: 0,
          moveY: 0,
          aimStickX: 1,
          aimStickY: 0,
          aimRotateDir: 0,
          fireHeld: true,
          firePressed: false,
          specialPressed: false,
          shopInteractPressed: false,
          pausePressed: false
        };

        const p = this.player;

        // 1. If Shop Portal is active, unvisited, and AI has >= 1200 Zenny, fly to shop and buy upgrade!
        if (this.shopPortal.active && !this.shopPortal.visited && p.zenny >= 1200) {
          const dx = this.shopPortal.x - p.x;
          const dy = this.shopPortal.y - p.y;
          const dist = Math.hypot(dx, dy);
          ai.moveX = Math.max(-1, Math.min(1, dx / 120));
          ai.moveY = Math.max(-1, Math.min(1, dy / 120));
          if (dist < this.shopPortal.radius + 36) {
            ai.shopInteractPressed = true;
          }
          return ai;
        }

        // 2. Evade nearby enemy bullets
        let threatX = 0;
        let threatY = 0;
        let urgentBullets = 0;
        for (const b of this.enemyBullets) {
          const dx = p.x - b.x;
          const dy = p.y - b.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 220) {
            threatX += (dx / Math.max(20, dist)) * (220 - dist);
            threatY += (dy / Math.max(20, dist)) * (220 - dist);
            if (dist < 110) urgentBullets++;
          }
        }

        // Trigger Mega-Crush if surrounded in Attract Mode
        if (urgentBullets >= 5 && p.overdrives > 0) {
          ai.specialPressed = true;
        }

        // 3. Move toward nearest Zenny if safe, otherwise weave smoothly in left half of screen
        let targetPosX = 380 + Math.cos(this.time * 1.4) * 160;
        let targetPosY = CANVAS_H * 0.5 + Math.sin(this.time * 2.1) * 260;

        if (this.zennies.length > 0 && urgentBullets === 0) {
          let bestZ = this.zennies[0];
          let bestD = Math.hypot(bestZ.x - p.x, bestZ.y - p.y);
          for (const z of this.zennies) {
            const d = Math.hypot(z.x - p.x, z.y - p.y);
            if (d < bestD && z.x < CANVAS_W * 0.78) {
              bestD = d;
              bestZ = z;
            }
          }
          if (bestD < 520) {
            targetPosX = bestZ.x;
            targetPosY = bestZ.y;
          }
        }

        ai.moveX = (targetPosX - p.x) * 0.012 + threatX * 0.018;
        ai.moveY = (targetPosY - p.y) * 0.012 + threatY * 0.018;
        const mag = Math.hypot(ai.moveX, ai.moveY);
        if (mag > 1) {
          ai.moveX /= mag;
          ai.moveY /= mag;
        }

        // 4. 360-degree Aim toward Boss or nearest Enemy
        let aimTarget = this.boss;
        if (!aimTarget && this.enemies.length > 0) {
          let closestDist = Infinity;
          for (const e of this.enemies) {
            const d = Math.hypot(e.x - p.x, e.y - p.y);
            if (d < closestDist) {
              closestDist = d;
              aimTarget = e;
            }
          }
        }

        if (aimTarget) {
          const ax = aimTarget.x - p.x;
          const ay = aimTarget.y - p.y;
          const len = Math.hypot(ax, ay) || 1;
          ai.aimStickX = ax / len;
          ai.aimStickY = ay / len;
        } else {
          ai.aimStickX = Math.cos(Math.sin(this.time * 1.8) * 0.45);
          ai.aimStickY = Math.sin(Math.sin(this.time * 1.8) * 0.45);
        }

        return ai;
      }

      /* =======================================================================
         7. MAIN UPDATE LOOP
         ======================================================================= */
      update(dt) {
        this.time += dt;
        const rawInput = this.input.poll();

        if (this.shakeTimer > 0) {
          this.shakeTimer = Math.max(0, this.shakeTimer - dt);
        }
        if (this.flashAlpha > 0) {
          this.flashAlpha = Math.max(0, this.flashAlpha - dt * 2.4);
        }

        audio.updateMusic(dt, this.state);

        // If in Attract Mode, ANY real player input exits immediately to Title Screen
        if (this.isAttractMode && rawInput.anyUserAction) {
          this.isAttractMode = false;
          this.state = "TITLE";
          this.menuIndex = 0;
          audio.sfxConfirm();
          return;
        }

        switch (this.state) {
          case "TITLE":
            this.updateTitle(dt, rawInput);
            break;
          case "PLAYING":
            this.updatePlaying(dt, this.isAttractMode ? this.computeAttractAI(dt) : rawInput);
            break;
          case "SHOP":
            this.updateShop(dt, rawInput);
            break;
          case "PAUSED":
            this.updatePaused(dt, rawInput);
            break;
          case "SETTINGS":
            this.updateSettings(dt, rawInput);
            break;
          case "CREDITS":
            this.updateCredits(dt, rawInput);
            break;
          case "VICTORY":
          case "GAMEOVER":
            this.updateEndScreen(dt, rawInput);
            break;
        }
      }

      updateTitle(dt, inp) {
        const itemCount = 4; // START SORTIE, ATTRACT DEMO, SETTINGS, ABOUT / CREDITS
        if (inp.navUp) {
          this.menuIndex = (this.menuIndex - 1 + itemCount) % itemCount;
          audio.sfxMoveCursor();
        }
        if (inp.navDown) {
          this.menuIndex = (this.menuIndex + 1) % itemCount;
          audio.sfxMoveCursor();
        }

        if (inp.confirmPressed) {
          audio.sfxConfirm();
          if (this.menuIndex === 0) {
            this.initSession(false);
            this.state = "PLAYING";
          } else if (this.menuIndex === 1) {
            this.initSession(true);
            this.state = "PLAYING";
          } else if (this.menuIndex === 2) {
            this.previousState = "TITLE";
            this.state = "SETTINGS";
            this.settingsIndex = 0;
          } else if (this.menuIndex === 3) {
            this.previousState = "TITLE";
            this.state = "CREDITS";
          }
          return;
        }

        // 10-Second Idle Attract Mode Trigger
        if (this.input.getIdleSeconds() >= ATTRACT_TIMEOUT_SEC) {
          this.initSession(true);
          this.state = "PLAYING";
        }
      }

      updatePaused(dt, inp) {
        const count = 4; // RESUME, RESTART SORTIE, SETTINGS, QUIT TO TITLE
        if (inp.pausePressed || inp.backPressed) {
          audio.sfxCancel();
          this.state = "PLAYING";
          return;
        }
        if (inp.navUp) {
          this.pauseIndex = (this.pauseIndex - 1 + count) % count;
          audio.sfxMoveCursor();
        }
        if (inp.navDown) {
          this.pauseIndex = (this.pauseIndex + 1) % count;
          audio.sfxMoveCursor();
        }
        if (inp.confirmPressed) {
          audio.sfxConfirm();
          if (this.pauseIndex === 0) {
            this.state = "PLAYING";
          } else if (this.pauseIndex === 1) {
            this.initSession(false);
            this.state = "PLAYING";
          } else if (this.pauseIndex === 2) {
            this.previousState = "PAUSED";
            this.state = "SETTINGS";
            this.settingsIndex = 0;
          } else if (this.pauseIndex === 3) {
            this.state = "TITLE";
            this.menuIndex = 0;
          }
        }
      }

      updateSettings(dt, inp) {
        const count = 6;
        if (inp.backPressed || inp.pausePressed) {
          audio.sfxCancel();
          this.state = this.previousState;
          return;
        }
        if (inp.navUp) {
          this.settingsIndex = (this.settingsIndex - 1 + count) % count;
          audio.sfxMoveCursor();
        }
        if (inp.navDown) {
          this.settingsIndex = (this.settingsIndex + 1) % count;
          audio.sfxMoveCursor();
        }

        const toggleOrAdjust = (dir) => {
          audio.sfxConfirm();
          if (this.settingsIndex === 0) {
            SETTINGS.soundEnabled = !SETTINGS.soundEnabled;
          } else if (this.settingsIndex === 1) {
            SETTINGS.musicVolume = Math.round(Math.max(0, Math.min(1, SETTINGS.musicVolume + dir * 0.2)) * 100) / 100;
          } else if (this.settingsIndex === 2) {
            SETTINGS.autoFire = !SETTINGS.autoFire;
          } else if (this.settingsIndex === 3) {
            SETTINGS.halftoneOverlay = !SETTINGS.halftoneOverlay;
          } else if (this.settingsIndex === 4) {
            SETTINGS.screenShake = !SETTINGS.screenShake;
          } else if (this.settingsIndex === 5 && dir === 0) {
            this.state = this.previousState;
          }
        };

        if (inp.navLeft) toggleOrAdjust(-1);
        if (inp.navRight) toggleOrAdjust(1);
        if (inp.confirmPressed) {
          if (this.settingsIndex === 5) {
            audio.sfxConfirm();
            this.state = this.previousState;
          } else {
            toggleOrAdjust(1);
          }
        }
      }

      updateCredits(dt, inp) {
        if (inp.backPressed || inp.confirmPressed || inp.pausePressed) {
          audio.sfxCancel();
          this.state = this.previousState;
        }
      }

      updateEndScreen(dt, inp) {
        if (this.isAttractMode) {
          // Loop attract mode back to Title briefly or restart demo
          this.initSession(true);
          this.state = "PLAYING";
          return;
        }
        const count = 2; // PLAY AGAIN, RETURN TO TITLE
        if (inp.navUp || inp.navLeft) {
          this.endMenuIndex = (this.endMenuIndex - 1 + count) % count;
          audio.sfxMoveCursor();
        }
        if (inp.navDown || inp.navRight) {
          this.endMenuIndex = (this.endMenuIndex + 1) % count;
          audio.sfxMoveCursor();
        }
        if (inp.confirmPressed) {
          audio.sfxConfirm();
          if (this.endMenuIndex === 0) {
            this.initSession(false);
            this.state = "PLAYING";
          } else {
            this.state = "TITLE";
            this.menuIndex = 0;
          }
        }
      }

      updateShop(dt, inp) {
        if (this.isAttractMode) {
          // Autonomous shop purchase during Attract Demo
          const p = this.player;
          if (p.zenny >= 1800) {
            p.zenny -= 1800;
            p.weaponIdx = 2;
            this.spawnCallout("EQUIPPED: SOLAR NAPALM!", p.x, p.y - 60, "#ff9100", 38);
          } else if (p.zenny >= 1200) {
            p.zenny -= 1200;
            p.weaponIdx = 1;
            this.spawnCallout("EQUIPPED: HOMING LASER!", p.x, p.y - 60, "#ff2a85", 38);
          }
          this.shopPortal.visited = true;
          this.shopPortal.active = false;
          audio.sfxConfirm();
          this.state = "PLAYING";
          return;
        }

        const cols = 3;
        const total = SHOP_ITEMS.length;
        if (inp.backPressed || inp.pausePressed) {
          audio.sfxCancel();
          this.shopPortal.visited = true;
          this.shopPortal.active = false;
          this.state = "PLAYING";
          return;
        }

        if (inp.navLeft) {
          this.shopCursor = (this.shopCursor - 1 + total) % total;
          audio.sfxMoveCursor();
        }
        if (inp.navRight) {
          this.shopCursor = (this.shopCursor + 1) % total;
          audio.sfxMoveCursor();
        }
        if (inp.navUp) {
          this.shopCursor = (this.shopCursor - cols + total) % total;
          audio.sfxMoveCursor();
        }
        if (inp.navDown) {
          this.shopCursor = (this.shopCursor + cols) % total;
          audio.sfxMoveCursor();
        }

        if (inp.confirmPressed) {
          const item = SHOP_ITEMS[this.shopCursor];
          const p = this.player;
          if (item.type === "exit") {
            audio.sfxConfirm();
            this.shopPortal.visited = true;
            this.shopPortal.active = false;
            this.state = "PLAYING";
            return;
          }

          if (p.zenny < item.cost) {
            audio.sfxCancel();
            this.TriggerShopSpeech("NOT ENOUGH ZENNY, SOLDIER! COLLECT GOLD DROPS!");
            return;
          }

          if (item.type === "weapon") {
            if (p.weaponIdx === item.weaponIdx) {
              audio.sfxCancel();
              this.TriggerShopSpeech("YOU ALREADY EQUIPPED THAT SATELLITE MODULE!");
              return;
            }
            p.zenny -= item.cost;
            p.weaponIdx = item.weaponIdx;
            audio.sfxConfirm();
            this.TriggerShopSpeech(`INSTALLED ${item.title}! MONEY TALKS!`);
          } else if (item.type === "heal") {
            if (p.hp >= p.maxHp) {
              audio.sfxCancel();
              this.TriggerShopSpeech("VITALITY ALREADY AT MAXIMUM!");
              return;
            }
            p.zenny -= item.cost;
            p.hp = Math.min(p.maxHp, p.hp + item.amount);
            audio.sfxConfirm();
            this.TriggerShopSpeech("VITALITY RESTORED! BACK IN THE FIGHT!");
          } else if (item.type === "armor") {
            p.zenny -= item.cost;
            p.maxHp += item.amount;
            p.hp = Math.min(p.maxHp, p.hp + item.amount);
            p.overdrives += 1;
            audio.sfxConfirm();
            this.TriggerShopSpeech("CEL-ARMOR REINFORCED + OVERDRIVE CHARGED!");
          }
        }
      }

      TriggerShopSpeech(msg) {
        this.shopSpeech = msg;
      }

      /* =======================================================================
         8. ACTIVE GAMEPLAY SIMULATION
         ======================================================================= */
      updatePlaying(dt, inp) {
        if (!this.isAttractMode && inp.pausePressed) {
          audio.sfxConfirm();
          this.state = "PAUSED";
          this.pauseIndex = 0;
          return;
        }

        this.levelTimer += dt;
        this.scrollDistance += this.scrollSpeed * dt;

        // Spawn scheduled stage waves
        while (
          this.waveCursor < this.stageWaves.length &&
          this.levelTimer >= this.stageWaves[this.waveCursor].time
        ) {
          this.spawnWave(this.stageWaves[this.waveCursor]);
          this.waveCursor++;
        }

        const p = this.player;
        p.scarfWave += dt * 14;
        if (p.invulnTimer > 0) p.invulnTimer = Math.max(0, p.invulnTimer - dt);

        // Player Flight Physics
        p.vx = inp.moveX * p.speed;
        p.vy = inp.moveY * p.speed;
        p.x = Math.max(90, Math.min(CANVAS_W - 110, p.x + p.vx * dt));
        p.y = Math.max(130, Math.min(CANVAS_H - 120, p.y + p.vy * dt));

        // 360-degree Rotational Aim (Stick, Bumpers/Keys, or Mouse)
        if (Math.hypot(inp.aimStickX, inp.aimStickY) > 0.2) {
          const targetAngle = Math.atan2(inp.aimStickY, inp.aimStickX);
          let diff = targetAngle - p.aimAngle;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          p.aimAngle += diff * Math.min(1, dt * 18 * SETTINGS.aimAssistSensitivity);
        } else if (inp.aimRotateDir !== 0) {
          p.aimAngle += inp.aimRotateDir * 3.6 * dt * SETTINGS.aimAssistSensitivity;
        } else if (this.input.mouseDown) {
          p.aimAngle = Math.atan2(this.input.mousePos.y - p.y, this.input.mousePos.x - p.x);
        }

        // Orbiting Satellite Pod follows aim angle smoothly
        const desiredSatAngle = p.aimAngle - 0.55;
        let satDiff = desiredSatAngle - p.satelliteAngle;
        while (satDiff > Math.PI) satDiff -= Math.PI * 2;
        while (satDiff < -Math.PI) satDiff += Math.PI * 2;
        p.satelliteAngle += satDiff * Math.min(1, dt * 12);
        const satX = p.x + Math.cos(p.satelliteAngle) * p.satelliteDist;
        const satY = p.y + Math.sin(p.satelliteAngle) * p.satelliteDist;

        // Primary Weapon + Satellite Firing
        p.fireCooldown = Math.max(0, p.fireCooldown - dt);
        const shouldFire = inp.fireHeld || SETTINGS.autoFire;
        if (shouldFire && p.fireCooldown <= 0) {
          this.firePlayerWeapons(p, satX, satY);
        }

        // Mega-Crush Overdrive Attack
        if (inp.specialPressed && (p.overdrives > 0 || p.hp > 25)) {
          if (p.overdrives > 0) {
            p.overdrives--;
          } else {
            p.hp -= 15;
          }
          this.triggerMegaCrush();
        }

        // Update Floating Paramecium Shop Portal
        if (this.shopPortal.active) {
          this.shopPortal.x -= 95 * dt;
          const distToShop = Math.hypot(p.x - this.shopPortal.x, p.y - this.shopPortal.y);
          if (distToShop < this.shopPortal.radius + 42 && inp.shopInteractPressed) {
            this.shopSpeech = "WELCOME TO SYLPH-88 EMPORIUM! PICK YOUR UPGRADE!";
            this.shopCursor = 0;
            audio.sfxConfirm();
            this.state = "SHOP";
            return;
          }
          if (this.shopPortal.x < -160) {
            this.shopPortal.active = false;
          }
        }

        // Update Player Projectiles
        for (let i = this.bullets.length - 1; i >= 0; i--) {
          const b = this.bullets[i];
          if (b.homing) {
            const target = this.findNearestTarget(b.x, b.y);
            if (target) {
              const desired = Math.atan2(target.y - b.y, target.x - b.x);
              let dAng = desired - b.angle;
              while (dAng > Math.PI) dAng -= Math.PI * 2;
              while (dAng < -Math.PI) dAng += Math.PI * 2;
              b.angle += dAng * Math.min(1, dt * 9);
              const spd = Math.hypot(b.vx, b.vy);
              b.vx = Math.cos(b.angle) * spd;
              b.vy = Math.sin(b.angle) * spd;
            }
          }
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.life -= dt;
          if (
            b.life <= 0 ||
            b.x < -80 ||
            b.x > CANVAS_W + 80 ||
            b.y < -80 ||
            b.y > CANVAS_H + 80
          ) {
            this.bullets.splice(i, 1);
          }
        }

        // Update Enemies
        this.updateEnemies(dt, p, satX, satY);

        // Update Stage 1 Boss (BIOS-GARUDA '88)
        if (this.boss) {
          this.updateBoss(dt, p);
        }

        // Update Enemy Projectiles & Satellite Bullet-Blocking
        for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
          const eb = this.enemyBullets[i];
          eb.x += eb.vx * dt;
          eb.y += eb.vy * dt;
          eb.life -= dt;

          // Check Satellite Pod Shield Block!
          const distSat = Math.hypot(eb.x - satX, eb.y - satY);
          if (distSat < 34 + eb.radius) {
            this.enemyBullets.splice(i, 1);
            p.satellitePulse = 0.25;
            p.score += 25;
            audio.sfxBlock();
            this.spawnExplosion(satX, satY, "#00e5ff", 5, 0.45);
            continue;
          }

          // Check Player Hit
          const distPlayer = Math.hypot(eb.x - p.x, eb.y - p.y);
          if (distPlayer < 26 + eb.radius && p.invulnTimer <= 0) {
            this.enemyBullets.splice(i, 1);
            this.damagePlayer(eb.damage || 14);
            continue;
          }

          if (
            eb.life <= 0 ||
            eb.x < -80 ||
            eb.x > CANVAS_W + 80 ||
            eb.y < -80 ||
            eb.y > CANVAS_H + 80
          ) {
            this.enemyBullets.splice(i, 1);
          }
        }

        // Update Zenny Coins (Magnetize when player is nearby)
        for (let i = this.zennies.length - 1; i >= 0; i--) {
          const z = this.zennies[i];
          z.spin += dt * 6;
          z.life -= dt;
          z.vy += 140 * dt; // gentle gravity drift
          z.vy = Math.min(z.vy, 110);

          const dx = p.x - z.x;
          const dy = p.y - z.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 280) {
            z.vx += (dx / Math.max(10, dist)) * 950 * dt;
            z.vy += (dy / Math.max(10, dist)) * 950 * dt;
          }

          z.x += z.vx * dt;
          z.y += z.vy * dt;
          z.y = Math.max(120, Math.min(CANVAS_H - 95, z.y));

          if (dist < 44 + z.radius) {
            p.zenny += z.value;
            p.score += z.value * 2;
            audio.sfxZenny();
            this.spawnCallout(`+${z.value}Z`, z.x, z.y - 20, "#ffcb2e", 26);
            this.zennies.splice(i, 1);
            continue;
          }

          if (z.life <= 0 || z.x < -90) {
            this.zennies.splice(i, 1);
          }
        }

        // Update Particles & Callouts
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const pt = this.particles[i];
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.life -= dt;
          if (pt.life <= 0) this.particles.splice(i, 1);
        }

        for (let i = this.callouts.length - 1; i >= 0; i--) {
          const c = this.callouts[i];
          c.y += c.vy * dt;
          c.life -= dt;
          if (c.life <= 0) this.callouts.splice(i, 1);
        }
      }

      firePlayerWeapons(p, satX, satY) {
        const w = WEAPON_CATALOG[p.weaponIdx];
        p.fireCooldown = w.fireRate;
        p.shotsFired++;
        audio.sfxShoot(p.weaponIdx);

        const cos = Math.cos(p.aimAngle);
        const sin = Math.sin(p.aimAngle);
        const muzzleX = p.x + cos * 42;
        const muzzleY = p.y + sin * 42;

        // Main gun shot
        this.bullets.push({
          x: muzzleX,
          y: muzzleY,
          vx: cos * 1180,
          vy: sin * 1180,
          angle: p.aimAngle,
          radius: p.weaponIdx === 2 ? 14 : 9,
          damage: w.damage,
          color: w.color,
          homing: false,
          life: 1.6
        });

        // Satellite Module secondary fire
        if (p.weaponIdx === 0) {
          // Twin Vulcan Satellite Shot
          this.bullets.push({
            x: satX,
            y: satY,
            vx: cos * 1120,
            vy: sin * 1120,
            angle: p.aimAngle,
            radius: 7,
            damage: 10,
            color: "#ffcb2e",
            homing: false,
            life: 1.5
          });
        } else if (p.weaponIdx === 1) {
          // Homing Prism Satellite Bolt
          this.bullets.push({
            x: satX,
            y: satY,
            vx: cos * 960,
            vy: sin * 960,
            angle: p.aimAngle,
            radius: 10,
            damage: 16,
            color: "#ff2a85",
            homing: true,
            life: 2.0
          });
        } else if (p.weaponIdx === 2) {
          // Wide Napalm Scatter
          for (const spread of [-0.22, 0.22]) {
            const ang = p.aimAngle + spread;
            this.bullets.push({
              x: satX,
              y: satY,
              vx: Math.cos(ang) * 920,
              vy: Math.sin(ang) * 920,
              angle: ang,
              radius: 11,
              damage: 18,
              color: "#ff9100",
              homing: false,
              life: 1.2
            });
          }
        } else {
          // Omega Rail-Buster Tri-Stream + Homing
          for (const spread of [-0.15, 0, 0.15]) {
            const ang = p.aimAngle + spread;
            this.bullets.push({
              x: satX,
              y: satY,
              vx: Math.cos(ang) * 1240,
              vy: Math.sin(ang) * 1240,
              angle: ang,
              radius: 10,
              damage: 18,
              color: "#76ff03",
              homing: spread !== 0,
              life: 1.7
            });
          }
        }
      }

      triggerMegaCrush() {
        audio.sfxMegacrush();
        this.flashAlpha = 0.85;
        this.triggerShake(26, 0.5);
        this.spawnCallout("MEGA-CRUSH OVERDRIVE!!", this.player.x, this.player.y - 75, "#00e5ff", 46);

        // Clear all enemy bullets and convert them into score sparks
        for (const eb of this.enemyBullets) {
          this.spawnExplosion(eb.x, eb.y, "#00e5ff", 4, 0.5);
        }
        this.enemyBullets.length = 0;

        // Damage all active enemies
        for (let i = this.enemies.length - 1; i >= 0; i--) {
          this.enemies[i].hp -= 95;
          if (this.enemies[i].hp <= 0) {
            this.killEnemy(i);
          }
        }

        if (this.boss) {
          this.boss.hp -= 140;
          this.boss.hitFlash = 0.25;
        }
      }

      findNearestTarget(x, y) {
        let best = this.boss;
        let bestDist = best ? Math.hypot(best.x - x, best.y - y) : Infinity;
        for (const e of this.enemies) {
          const d = Math.hypot(e.x - x, e.y - y);
          if (d < bestDist) {
            bestDist = d;
            best = e;
          }
        }
        return best;
      }

      updateEnemies(dt, p, satX, satY) {
        for (let i = this.enemies.length - 1; i >= 0; i--) {
          const e = this.enemies[i];
          e.phase += dt * 3.2;
          e.x += e.vx * dt;

          if (e.type === "DRONE") {
            e.y = e.baseY + Math.sin(e.phase) * 75;
          } else if (e.type === "SERPENT_HEAD" || e.type === "SERPENT_BODY") {
            e.y = e.baseY + Math.sin(e.phase + e.x * 0.008) * 140;
          } else if (e.type === "CRUISER") {
            if (e.x < CANVAS_W - 340) e.vx = -35;
            e.y += Math.sin(e.phase * 0.7) * 45 * dt;
          }

          // Enemy firing logic
          e.fireTimer -= dt;
          if (e.fireTimer <= 0 && e.x < CANVAS_W - 40 && e.x > 120) {
            const aim = Math.atan2(p.y - e.y, p.x - e.x);
            if (e.type === "DRONE" || e.type === "SERPENT_HEAD") {
              e.fireTimer = 1.9;
              this.enemyBullets.push({
                x: e.x,
                y: e.y,
                vx: Math.cos(aim) * 420,
                vy: Math.sin(aim) * 420,
                radius: 10,
                damage: 12,
                color: "#ff2a85",
                life: 4.5
              });
            } else if (e.type === "WALKER") {
              e.fireTimer = 1.5;
              for (const offset of [-0.25, 0, 0.25]) {
                this.enemyBullets.push({
                  x: e.x,
                  y: e.y - 24,
                  vx: Math.cos(aim + offset) * 460,
                  vy: Math.sin(aim + offset) * 460,
                  radius: 11,
                  damage: 14,
                  color: "#ff9100",
                  life: 4.5
                });
              }
            } else if (e.type === "CRUISER") {
              e.fireTimer = 1.35;
              for (let k = -2; k <= 2; k++) {
                const a = aim + k * 0.18;
                this.enemyBullets.push({
                  x: e.x - 40,
                  y: e.y,
                  vx: Math.cos(a) * 490,
                  vy: Math.sin(a) * 490,
                  radius: 12,
                  damage: 16,
                  color: "#ff2a85",
                  life: 5.0
                });
              }
            }
          }

          // Player bullet hits on enemy
          let killed = false;
          for (let j = this.bullets.length - 1; j >= 0; j--) {
            const b = this.bullets[j];
            if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + b.radius) {
              e.hp -= b.damage;
              this.player.shotsHit++;
              this.bullets.splice(j, 1);
              this.spawnExplosion(b.x, b.y, b.color, 4, 0.4);
              if (e.hp <= 0) {
                this.killEnemy(i);
                killed = true;
                break;
              }
            }
          }
          if (killed) continue;

          // Contact with Player or Satellite
          if (Math.hypot(e.x - satX, e.y - satY) < e.radius + 26) {
            e.hp -= 120 * dt;
            if (e.hp <= 0) {
              this.killEnemy(i);
              continue;
            }
          }

          if (Math.hypot(e.x - p.x, e.y - p.y) < e.radius + 26 && p.invulnTimer <= 0) {
            this.damagePlayer(18);
          }

          if (e.x < -160) {
            this.enemies.splice(i, 1);
          }
        }
      }

      killEnemy(index) {
        const e = this.enemies[index];
        if (!e) return;
        this.player.score += e.scoreValue;
        this.player.kills++;
        audio.sfxExplosion(e.radius > 42);
        this.spawnExplosion(e.x, e.y, "#ff5722", e.radius > 42 ? 22 : 12, e.radius > 42 ? 1.2 : 0.85);

        if (e.type === "CARRIER") {
          for (let k = 0; k < 4; k++) {
            this.spawnZenny(e.x + (k - 1.5) * 24, e.y, 500);
          }
          this.spawnCallout("JACKPOT ZENNY!", e.x, e.y - 30, "#ffcb2e", 34);
        } else {
          this.spawnZenny(e.x, e.y, e.zennyValue);
        }

        if (e.radius > 45) {
          this.spawnCallout("KRA-KOOM!", e.x, e.y - 25, "#ff5722", 32);
          this.triggerShake(10, 0.2);
        }
        this.enemies.splice(index, 1);
      }

      updateBoss(dt, p) {
        const b = this.boss;
        if (!b) return;

        if (b.hitFlash > 0) b.hitFlash = Math.max(0, b.hitFlash - dt);
        b.armAngle += dt * 2.2;

        // Move into arena position
        if (b.x > b.targetX) {
          b.x -= 140 * dt;
        } else {
          b.y += b.vy * dt;
          if (b.y < 260) { b.y = 260; b.vy = Math.abs(b.vy); }
          if (b.y > CANVAS_H - 260) { b.y = CANVAS_H - 260; b.vy = -Math.abs(b.vy); }
        }

        // Boss Attack Patterns
        b.attackTimer -= dt;
        if (b.attackTimer <= 0) {
          b.patternIndex = (b.patternIndex + 1) % 3;
          const rage = b.hp < b.maxHp * 0.5 ? 0.72 : 1.0;

          if (b.patternIndex === 0) {
            // Pattern A: Radial Sunburst Ring
            b.attackTimer = 1.65 * rage;
            const spokes = b.hp < b.maxHp * 0.5 ? 14 : 10;
            for (let i = 0; i < spokes; i++) {
              const ang = (Math.PI * 2 * i) / spokes + this.time;
              this.enemyBullets.push({
                x: b.x - 60,
                y: b.y,
                vx: Math.cos(ang) * 440,
                vy: Math.sin(ang) * 440,
                radius: 13,
                damage: 15,
                color: "#ffcb2e",
                life: 5.0
              });
            }
          } else if (b.patternIndex === 1) {
            // Pattern B: Aimed Shoulder Cannon Barrage
            b.attackTimer = 1.3 * rage;
            const aim = Math.atan2(p.y - b.y, p.x - b.x);
            for (let s = -2; s <= 2; s++) {
              const a = aim + s * 0.14;
              this.enemyBullets.push({
                x: b.x - 85,
                y: b.y - 70,
                vx: Math.cos(a) * 560,
                vy: Math.sin(a) * 560,
                radius: 12,
                damage: 16,
                color: "#ff2a85",
                life: 5.0
              });
              this.enemyBullets.push({
                x: b.x - 85,
                y: b.y + 70,
                vx: Math.cos(a) * 560,
                vy: Math.sin(a) * 560,
                radius: 12,
                damage: 16,
                color: "#00e5ff",
                life: 5.0
              });
            }
          } else {
            // Pattern C: Spawn Escort Drones + Zenny Bonus
            b.attackTimer = 2.1 * rage;
            this.spawnWave({ type: "DRONE_SQUAD", y: b.y, count: 3 });
          }
        }

        // Player Bullets vs Boss
        for (let j = this.bullets.length - 1; j >= 0; j--) {
          const bul = this.bullets[j];
          if (Math.hypot(bul.x - b.x, bul.y - b.y) < b.radius + bul.radius) {
            b.hp -= bul.damage;
            b.hitFlash = 0.08;
            this.player.shotsHit++;
            this.bullets.splice(j, 1);
            this.spawnExplosion(bul.x, bul.y, bul.color, 5, 0.5);

            if (b.hp <= 0) {
              // Boss Defeated!
              this.player.score += 15000;
              this.player.zenny += 5000;
              this.player.kills++;
              audio.sfxExplosion(true);
              this.triggerShake(32, 0.9);
              this.flashAlpha = 1.0;
              this.spawnExplosion(b.x, b.y, "#ffcb2e", 55, 1.8);
              this.boss = null;
              this.endMenuIndex = 0;
              this.state = "VICTORY";
              return;
            }
          }
        }
      }

      damagePlayer(amount) {
        const p = this.player;
        if (this.isAttractMode) {
          // Keep attract mode running smoothly while still showing impact feedback
          p.hp = Math.max(25, p.hp - amount * 0.4);
          p.invulnTimer = 0.9;
          this.triggerShake(10, 0.2);
          return;
        }

        p.hp = Math.max(0, p.hp - amount);
        p.invulnTimer = 1.15;
        this.triggerShake(16, 0.3);
        audio.sfxExplosion(false);
        this.spawnCallout("HULL HIT!", p.x, p.y - 45, "#ff2a85", 30);

        if (p.hp <= 0) {
          audio.sfxExplosion(true);
          this.spawnExplosion(p.x, p.y, "#ff2a85", 40, 1.5);
          this.endMenuIndex = 0;
          this.state = "GAMEOVER";
        }
      }

      /* =======================================================================
         9. CEL-SHADED & INK RENDERING PIPELINE
         ======================================================================= */
      render() {
        const ctx = this.ctx;
        ctx.save();

        // Screen shake transform
        if (this.shakeTimer > 0 && SETTINGS.screenShake) {
          const sx = (Math.random() - 0.5) * this.shakeIntensity * 2;
          const sy = (Math.random() - 0.5) * this.shakeIntensity * 2;
          ctx.translate(sx, sy);
        }

        this.renderBackground(ctx);

        if (this.state !== "TITLE") {
          this.renderShopPortal(ctx);
          this.renderZennies(ctx);
          this.renderEnemies(ctx);
          if (this.boss) this.renderBoss(ctx);
          this.renderPlayer(ctx);
          this.renderProjectiles(ctx);
          this.renderParticlesAndCallouts(ctx);
          this.renderHUD(ctx);
        }

        // Screen Flash
        if (this.flashAlpha > 0) {
          ctx.fillStyle = `rgba(255, 250, 225, ${this.flashAlpha})`;
          ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        }

        // State Overlays
        if (this.state === "TITLE") this.renderTitleScreen(ctx);
        else if (this.state === "SHOP") this.renderShopOverlay(ctx);
        else if (this.state === "PAUSED") this.renderPauseOverlay(ctx);
        else if (this.state === "SETTINGS") this.renderSettingsOverlay(ctx);
        else if (this.state === "CREDITS") this.renderCreditsOverlay(ctx);
        else if (this.state === "VICTORY" || this.state === "GAMEOVER") this.renderEndOverlay(ctx);

        // Attract Mode Kiosk Banner
        if (this.isAttractMode && this.state === "PLAYING") {
          this.renderAttractBanner(ctx);
        }

        // Comic Halftone Ink Lines Overlay
        if (SETTINGS.halftoneOverlay) {
          this.renderComicInkFrame(ctx);
        }

        ctx.restore();
      }

      renderBackground(ctx) {
        // Dramatic 1988 Sunset / Ruined Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
        if (this.currentPhase === 3) {
          grad.addColorStop(0, "#1c0b2b");
          grad.addColorStop(0.55, "#59133c");
          grad.addColorStop(1, "#ff5722");
        } else {
          grad.addColorStop(0, "#0d0b1e");
          grad.addColorStop(0.5, "#261947");
          grad.addColorStop(1, "#8c2d4b");
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        // Cel-shaded Giant Ruined Moon / Sunburst with thick ink border
        const sunX = 1420;
        const sunY = 290;
        ctx.save();
        ctx.beginPath();
        ctx.arc(sunX, sunY, 165, 0, Math.PI * 2);
        ctx.fillStyle = "#ffcb2e";
        ctx.fill();
        ctx.lineWidth = 7;
        ctx.strokeStyle = "#08060c";
        ctx.stroke();

        // Cel shadow crescent on moon
        ctx.beginPath();
        ctx.arc(sunX + 28, sunY + 18, 135, 0.4, Math.PI * 1.35);
        ctx.fillStyle = "#ff9100";
        ctx.fill();
        ctx.restore();

        // Far Parallax Ruined Classical Pillars & Skyscrapers
        const farScroll = (this.scrollDistance * 0.35) % (this.bgPillars.length * 190);
        for (const b of this.bgPillars) {
          let bx = b.x - farScroll;
          if (bx < -250) bx += this.bgPillars.length * 190;
          if (bx > CANVAS_W + 100) continue;

          const by = CANVAS_H - 110 - b.h;
          // Deep shadow block
          ctx.fillStyle = "#090712";
          ctx.fillRect(bx + 12, by + 10, b.w, b.h);

          // Main cel body
          ctx.fillStyle = "#1f183b";
          ctx.fillRect(bx, by, b.w, b.h);

          // Left cel highlight strip
          ctx.fillStyle = "#3a2d66";
          ctx.fillRect(bx, by, 18, b.h);

          // Ink outline
          ctx.lineWidth = 4.5;
          ctx.strokeStyle = "#08060c";
          ctx.strokeRect(bx, by, b.w, b.h);
        }

        // Foreground Shattered Highway / Aqueduct Deck
        const deckY = CANVAS_H - 115;
        ctx.fillStyle = "#171329";
        ctx.fillRect(0, deckY, CANVAS_W, 115);
        ctx.fillStyle = "#ff9100";
        ctx.fillRect(0, deckY, CANVAS_W, 14);
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#08060c";
        ctx.beginPath();
        ctx.moveTo(0, deckY);
        ctx.lineTo(CANVAS_W, deckY);
        ctx.stroke();

        const girderOffset = this.scrollDistance % 160;
        for (let x = -girderOffset; x < CANVAS_W + 160; x += 160) {
          ctx.lineWidth = 5;
          ctx.strokeStyle = "#08060c";
          ctx.beginPath();
          ctx.moveTo(x, deckY);
          ctx.lineTo(x - 65, CANVAS_H);
          ctx.stroke();
        }
      }

      renderShopPortal(ctx) {
        if (!this.shopPortal.active) return;
        const s = this.shopPortal;
        ctx.save();
        ctx.translate(s.x, s.y);

        // Pulsing dimensional aura
        const pulse = Math.sin(this.time * 6) * 8;
        ctx.beginPath();
        ctx.arc(0, 0, s.radius + pulse, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0, 229, 255, 0.22)";
        ctx.fill();
        ctx.lineWidth = 5;
        ctx.strokeStyle = "#00e5ff";
        ctx.stroke();

        // Classical Paramecium Doorway Arch
        drawInkPanel(ctx, -64, -78, 128, 156, "#241642", "#ffcb2e");
        ctx.fillStyle = "#00e5ff";
        ctx.fillRect(-44, -56, 88, 114);
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#08060c";
        ctx.strokeRect(-44, -56, 88, 114);

        drawComicText(ctx, "SHOP", 0, -96, 30, "#ffcb2e", "#08060c", "center");

        const dist = Math.hypot(this.player.x - s.x, this.player.y - s.y);
        if (dist < s.radius + 55) {
          drawComicText(ctx, "PRESS [CIRCLE / ENTER] TO ENTER", 0, 108, 24, "#00e5ff", "#08060c", "center");
        }
        ctx.restore();
      }

      renderPlayer(ctx) {
        const p = this.player;
        ctx.save();

        // Blink when invulnerable
        if (p.invulnTimer > 0 && Math.floor(this.time * 20) % 2 === 0) {
          ctx.globalAlpha = 0.55;
        }

        // 1. Draw Orbiting Satellite Pod & Tether Line
        const satX = p.x + Math.cos(p.satelliteAngle) * p.satelliteDist;
        const satY = p.y + Math.sin(p.satelliteAngle) * p.satelliteDist;

        ctx.beginPath();
        ctx.setLineDash([8, 6]);
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(satX, satY);
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#00e5ff";
        ctx.stroke();
        ctx.setLineDash([]);

        // Satellite Pod Sprite (Cel-shaded Orb + Barrel)
        ctx.save();
        ctx.translate(satX, satY);
        ctx.rotate(p.aimAngle);

        if (p.satellitePulse > 0) {
          p.satellitePulse = Math.max(0, p.satellitePulse - 0.016);
          ctx.beginPath();
          ctx.arc(0, 0, 38, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(0, 229, 255, 0.45)";
          ctx.fill();
        }

        ctx.fillStyle = "#ffcb2e";
        ctx.fillRect(8, -7, 24, 14);
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#08060c";
        ctx.strokeRect(8, -7, 24, 14);

        ctx.beginPath();
        ctx.arc(0, 0, 19, 0, Math.PI * 2);
        ctx.fillStyle = WEAPON_CATALOG[p.weaponIdx].color;
        ctx.fill();
        ctx.lineWidth = 5;
        ctx.strokeStyle = "#08060c";
        ctx.stroke();
        ctx.restore();

        // 2. Draw Sky-Mercenary Hero (Cel-shaded Jetpack Soldier + Scarf + 360 Cannon)
        ctx.translate(p.x, p.y);

        // Flowing red comic scarf trailing behind
        ctx.beginPath();
        ctx.moveTo(-14, -10);
        for (let i = 1; i <= 4; i++) {
          const sx = -14 - i * 16;
          const sy = -10 + Math.sin(p.scarfWave - i * 0.9) * (6 + i * 3);
          ctx.lineTo(sx, sy);
        }
        ctx.lineWidth = 13;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#08060c";
        ctx.stroke();
        ctx.lineWidth = 7;
        ctx.strokeStyle = "#ff2a85";
        ctx.stroke();

        // Jetpack Flame Plume
        const flameLen = 24 + Math.sin(this.time * 45) * 9;
        ctx.beginPath();
        ctx.moveTo(-20, -4);
        ctx.lineTo(-20 - flameLen, 8);
        ctx.lineTo(-20, 18);
        ctx.closePath();
        ctx.fillStyle = "#00e5ff";
        ctx.fill();
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = "#08060c";
        ctx.stroke();

        // Armored Torso & Jetpack
        ctx.fillStyle = "#2b3a67";
        ctx.fillRect(-22, -16, 16, 32);
        ctx.strokeRect(-22, -16, 16, 32);

        ctx.fillStyle = "#00e5ff";
        ctx.fillRect(-12, -20, 26, 40);
        ctx.fillStyle = "#187bcd";
        ctx.fillRect(-12, 2, 26, 18);
        ctx.lineWidth = 5;
        ctx.strokeStyle = "#08060c";
        ctx.strokeRect(-12, -20, 26, 40);

        // Hero Head + Gold Visor
        ctx.beginPath();
        ctx.arc(2, -26, 14, 0, Math.PI * 2);
        ctx.fillStyle = "#f7f1e1";
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#ffcb2e";
        ctx.fillRect(2, -31, 14, 8);
        ctx.strokeRect(2, -31, 14, 8);

        // 360-Degree Rotating Heavy Rifle & Laser Sight Line
        ctx.save();
        ctx.rotate(p.aimAngle);

        // Subtle aiming guide line
        ctx.beginPath();
        ctx.setLineDash([10, 12]);
        ctx.moveTo(46, 0);
        ctx.lineTo(240, 0);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(255, 203, 46, 0.45)";
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = "#f7f1e1";
        ctx.fillRect(4, -8, 38, 16);
        ctx.fillStyle = WEAPON_CATALOG[p.weaponIdx].color;
        ctx.fillRect(26, -10, 18, 20);
        ctx.lineWidth = 4.5;
        ctx.strokeStyle = "#08060c";
        ctx.strokeRect(4, -8, 38, 16);
        ctx.restore();

        ctx.restore();
      }

      renderEnemies(ctx) {
        for (const e of this.enemies) {
          ctx.save();
          ctx.translate(e.x, e.y);

          if (e.type === "DRONE") {
            ctx.fillStyle = "#ff5722";
            ctx.beginPath();
            ctx.moveTo(-28, 0);
            ctx.lineTo(10, -24);
            ctx.lineTo(28, 0);
            ctx.lineTo(10, 24);
            ctx.closePath();
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = "#08060c";
            ctx.stroke();

            ctx.fillStyle = "#ffcb2e";
            ctx.beginPath();
            ctx.arc(-4, 0, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          } else if (e.type === "WALKER") {
            drawInkPanel(ctx, -40, -38, 80, 76, "#37275c", "#ff9100");
            ctx.fillStyle = "#ff2a85";
            ctx.fillRect(-52, -16, 26, 20);
            ctx.strokeRect(-52, -16, 26, 20);
          } else if (e.type === "CARRIER") {
            drawInkPanel(ctx, -44, -32, 88, 64, "#ffcb2e", "#f7f1e1");
            drawComicText(ctx, "ZENNY", 0, 0, 22, "#08060c", "#ff9100", "center");
          } else if (e.type === "SERPENT_HEAD" || e.type === "SERPENT_BODY") {
            ctx.beginPath();
            ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
            ctx.fillStyle = e.type === "SERPENT_HEAD" ? "#76ff03" : "#00e5ff";
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = "#08060c";
            ctx.stroke();
          } else if (e.type === "CRUISER") {
            drawInkPanel(ctx, -64, -46, 128, 92, "#59133c", "#ff2a85");
            ctx.fillStyle = "#ffcb2e";
            ctx.fillRect(-35, -20, 70, 40);
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#08060c";
            ctx.strokeRect(-35, -20, 70, 40);
          }
          ctx.restore();
        }
      }

      renderBoss(ctx) {
        const b = this.boss;
        ctx.save();
        ctx.translate(b.x, b.y);

        const baseColor = b.hitFlash > 0 ? "#f7f1e1" : "#ff5722";
        const subColor = b.hitFlash > 0 ? "#ffcb2e" : "#241642";

        // Orbiting War-God Halo Rings
        ctx.save();
        ctx.rotate(b.armAngle);
        ctx.strokeStyle = "#ffcb2e";
        ctx.lineWidth = 8;
        ctx.strokeRect(-145, -145, 290, 290);
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#08060c";
        ctx.strokeRect(-145, -145, 290, 290);
        ctx.restore();

        // Upper & Lower Shoulder Turrets
        drawInkPanel(ctx, -95, -135, 130, 58, subColor, "#00e5ff");
        drawInkPanel(ctx, -95, 77, 130, 58, subColor, "#ff2a85");

        // Central Colossus Armored Core
        drawInkPanel(ctx, -85, -82, 170, 164, baseColor, "#ffcb2e");

        // Glowing War-God Eye
        ctx.beginPath();
        ctx.arc(-25, 0, 42, 0, Math.PI * 2);
        ctx.fillStyle = "#00e5ff";
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#08060c";
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(-32, 0, 16, 0, Math.PI * 2);
        ctx.fillStyle = "#08060c";
        ctx.fill();

        ctx.restore();

        // Boss Health Bar at Top Center
        const barW = 740;
        const barX = (CANVAS_W - barW) / 2;
        const barY = 108;
        drawInkPanel(ctx, barX, barY, barW, 34, "#120d24", "#ff2a85");
        const pct = Math.max(0, b.hp / b.maxHp);
        ctx.fillStyle = "#ff2a85";
        ctx.fillRect(barX + 6, barY + 6, (barW - 12) * pct, 22);
        drawComicText(ctx, b.name, CANVAS_W / 2, barY - 20, 28, "#ffcb2e", "#08060c", "center");
      }

      renderZennies(ctx) {
        for (const z of this.zennies) {
          ctx.save();
          ctx.translate(z.x, z.y);
          const scaleX = Math.max(0.35, Math.abs(Math.cos(z.spin)));
          ctx.scale(scaleX, 1);

          ctx.beginPath();
          ctx.arc(0, 0, z.radius, 0, Math.PI * 2);
          ctx.fillStyle = z.value >= 500 ? "#00e5ff" : "#ffcb2e";
          ctx.fill();
          ctx.lineWidth = 4.5;
          ctx.strokeStyle = "#08060c";
          ctx.stroke();

          ctx.fillStyle = "#08060c";
          ctx.font = "900 18px Impact, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("Z", 0, 1);
          ctx.restore();
        }
      }

      renderProjectiles(ctx) {
        for (const b of this.bullets) {
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(b.angle);
          ctx.fillStyle = b.color;
          ctx.fillRect(-16, -b.radius * 0.65, 32, b.radius * 1.3);
          ctx.lineWidth = 3.5;
          ctx.strokeStyle = "#08060c";
          ctx.strokeRect(-16, -b.radius * 0.65, 32, b.radius * 1.3);
          ctx.restore();
        }

        for (const eb of this.enemyBullets) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
          ctx.fillStyle = eb.color;
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = "#08060c";
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(eb.x - 3, eb.y - 3, eb.radius * 0.4, 0, Math.PI * 2);
          ctx.fillStyle = "#f7f1e1";
          ctx.fill();
          ctx.restore();
        }
      }

      renderParticlesAndCallouts(ctx) {
        for (const pt of this.particles) {
          const alpha = Math.max(0, pt.life / pt.maxLife);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.radius * alpha, 0, Math.PI * 2);
          ctx.fillStyle = pt.color;
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#08060c";
          ctx.stroke();
          ctx.restore();
        }

        for (const c of this.callouts) {
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.tilt);
          drawComicText(ctx, c.text, 0, 0, c.size, c.color, "#08060c", "center");
          ctx.restore();
        }
      }

      /* =======================================================================
         10. 10-FOOT HUD & CONTROLLER-FIRST MENU SCREENS
         ======================================================================= */
      renderHUD(ctx) {
        const p = this.player;
        const w = WEAPON_CATALOG[p.weaponIdx];

        // Top-Left Vitality & Overdrive Panel
        drawInkPanel(ctx, 32, 24, 520, 74, "#141026", "#00e5ff");
        drawComicText(ctx, "VITALITY", 54, 48, 24, "#00e5ff");

        const barX = 175;
        const barY = 34;
        const barW = 240;
        ctx.fillStyle = "#08060c";
        ctx.fillRect(barX, barY, barW, 26);
        const hpRatio = Math.max(0, p.hp / p.maxHp);
        ctx.fillStyle = hpRatio > 0.35 ? "#76ff03" : "#ff2a85";
        ctx.fillRect(barX + 3, barY + 3, (barW - 6) * hpRatio, 20);
        ctx.strokeStyle = "#f7f1e1";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(barX, barY, barW, 26);

        drawComicText(ctx, `OVERDRIVE x${p.overdrives}`, 54, 78, 21, "#ffcb2e");
        drawComicText(ctx, `MODULE: ${w.name}`, 215, 78, 21, w.color);

        // Top-Center Zenny Bank
        drawInkPanel(ctx, 730, 24, 460, 64, "#141026", "#ffcb2e");
        drawComicText(ctx, `ZENNY: ${p.zenny.toLocaleString()} Z`, 960, 56, 34, "#ffcb2e", "#08060c", "center");

        // Top-Right Score & Stage Progress
        drawInkPanel(ctx, 1360, 24, 528, 74, "#141026", "#ff2a85");
        drawComicText(ctx, `SCORE: ${p.score.toLocaleString()}`, 1385, 48, 26, "#f7f1e1");
        const zoneName = this.currentPhase === 1
          ? "ZONE 1: AQUEDUCT"
          : this.currentPhase === 2
          ? "ZONE 2: SKYLINE SHOP"
          : "ZONE 3: WAR GOD";
        drawComicText(ctx, zoneName, 1385, 78, 21, "#ffcb2e");

        // Bottom 10-Foot Controller Prompt Bar
        drawInkPanel(ctx, 32, CANVAS_H - 68, CANVAS_W - 64, 52, "rgba(12, 10, 22, 0.92)", "#ffcb2e");
        let bx = 56;
        const by = CANVAS_H - 42;
        bx += drawButtonBadge(ctx, "L-STICK / WASD", "FLY", bx, by, "#00e5ff") + 36;
        bx += drawButtonBadge(ctx, "R-STICK / L1-R1 / J-L", "360° AIM & SATELLITE", bx, by, "#ffcb2e") + 36;
        bx += drawButtonBadge(ctx, "R2 / SPACE", SETTINGS.autoFire ? "AUTO-FIRE ON (F)" : "FIRE", bx, by, "#76ff03") + 36;
        bx += drawButtonBadge(ctx, "SQUARE / SHIFT", "MEGA-CRUSH", bx, by, "#ff2a85") + 36;
        drawButtonBadge(ctx, "OPTIONS / ESC", "PAUSE", bx, by, "#f7f1e1");
      }

      renderTitleScreen(ctx) {
        // Dim background slightly
        ctx.fillStyle = "rgba(9, 7, 16, 0.55)";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        // Heroic Title Banner
        drawInkPanel(ctx, 210, 85, 1500, 245, "#191233", "#ffcb2e", -0.012);
        drawComicText(ctx, "CAPCOM 1988 SPIRITUAL SUCCESSOR", 960, 135, 30, "#00e5ff", "#08060c", "center");
        drawComicText(ctx, GAME_META.title, 960, 215, 92, "#ffcb2e", "#08060c", "center");
        drawComicText(ctx, GAME_META.subtitle, 960, 288, 32, "#ff2a85", "#08060c", "center");

        // Left Preview Card: Mechanics Summary
        drawInkPanel(ctx, 180, 390, 680, 470, "#141026", "#00e5ff");
        drawComicText(ctx, "HOW TO SURVIVE THE DUST WORLD", 520, 440, 34, "#00e5ff", "#08060c", "center");

        const tips = [
          "1. 360° AIMING: Rotate your rifle & Satellite Module",
          "   independently of your flight direction!",
          "2. SATELLITE GUARD: Position your orbiting pod to",
          "   block enemy plasma bolts on contact.",
          "3. MONEY TALKS: Collect gold ZENNY drops and enter",
          "   the mid-stage Paramecium Shop for heavy weapons!",
          "4. MEGA-CRUSH: Trigger full-screen EMP bursts when",
          "   surrounded by enemy squadrons."
        ];
        ctx.font = "800 24px 'Trebuchet MS', sans-serif";
        ctx.fillStyle = "#f7f1e1";
        tips.forEach((line, idx) => {
          ctx.fillText(line, 215, 505 + idx * 40);
        });

        // Right Interactive 10-Foot Menu Card
        drawInkPanel(ctx, 940, 390, 800, 470, "#141026", "#ffcb2e");
        const menuItems = [
          { title: "START SORTIE (1 PLAYER)", sub: "Launch into Stage 1: The Dust Metropolis" },
          { title: "WATCH ATTRACT DEMO", sub: "Autonomous AI Pilot Kiosk Showcase" },
          { title: "CONTROLLER & AUDIO SETTINGS", sub: "Configure Auto-Fire, Synth Volume & Ink FX" },
          { title: "ABOUT & SOURCE INFORMATION", sub: "Credits, Tech Stack & 1988 Heritage" }
        ];

        menuItems.forEach((item, idx) => {
          const isSelected = this.menuIndex === idx;
          const iy = 425 + idx * 102;
          drawInkPanel(
            ctx,
            980,
            iy,
            720,
            84,
            isSelected ? "#ff2a85" : "#231c3d",
            isSelected ? "#ffcb2e" : "#08060c"
          );
          drawComicText(
            ctx,
            isSelected ? `▶  ${item.title}` : item.title,
            1010,
            iy + 32,
            32,
            isSelected ? "#ffcb2e" : "#f7f1e1"
          );
          ctx.font = "700 20px 'Trebuchet MS', sans-serif";
          ctx.fillStyle = isSelected ? "#f7f1e1" : "#b8b0d4";
          ctx.fillText(item.sub, 1015, iy + 64);
        });

        // Attract Mode Countdown Indicator & Controller Status
        const idleRemaining = Math.max(0, Math.ceil(ATTRACT_TIMEOUT_SEC - this.input.getIdleSeconds()));
        drawInkPanel(ctx, 180, 905, 1560, 105, "#110d20", "#76ff03");
        const gpStatus = this.input.gamepadConnected
          ? `CONTROLLER READY: ${this.input.gamepadName.slice(0, 38)}`
          : "DUALSENSE / GAMEPAD OR KEYBOARD READY";
        drawComicText(ctx, gpStatus, 220, 942, 26, "#76ff03");
        drawComicText(
          ctx,
          `ATTRACT DEMO IN ${idleRemaining}s`,
          1700,
          942,
          26,
          "#ffcb2e",
          "#08060c",
          "right"
        );

        let bx = 220;
        bx += drawButtonBadge(ctx, "D-PAD / L-STICK / W-S", "NAVIGATE", bx, 982, "#00e5ff") + 45;
        drawButtonBadge(ctx, "CROSS (X) / ENTER / SPACE", "CONFIRM SELECTION", bx, 982, "#ffcb2e");
      }

      renderAttractBanner(ctx) {
        if (Math.floor(this.time * 2.5) % 2 === 0) {
          drawInkPanel(ctx, 490, 900, 940, 82, "#ff2a85", "#ffcb2e");
          drawComicText(
            ctx,
            "ATTRACT DEMO MODE — PRESS ANY BUTTON OR MOVE STICK TO START",
            960,
            941,
            32,
            "#ffcb2e",
            "#08060c",
            "center"
          );
        }
      }

      renderShopOverlay(ctx) {
        ctx.fillStyle = "rgba(8, 6, 16, 0.84)";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        drawInkPanel(ctx, 150, 90, 1620, 890, "#191233", "#00e5ff");
        drawComicText(
          ctx,
          "PARAMECIUM SKY EMPORIUM — 'MONEY TALKS!'",
          960,
          150,
          50,
          "#ffcb2e",
          "#08060c",
          "center"
        );

        // Shopkeeper Dialogue Box
        drawInkPanel(ctx, 200, 200, 1520, 110, "#261b47", "#ff2a85");
        drawComicText(ctx, "SYLPH-88:", 235, 240, 30, "#00e5ff");
        drawComicText(
          ctx,
          this.shopSpeech || "CHOOSE YOUR SATELLITE MODULE OR ARMOR UPGRADE!",
          380,
          240,
          30,
          "#f7f1e1"
        );
        drawComicText(
          ctx,
          `AVAILABLE ZENNY: ${this.player.zenny.toLocaleString()} Z`,
          235,
          282,
          28,
          "#ffcb2e"
        );

        // 2x3 Grid of 10-Foot Shop Cards
        SHOP_ITEMS.forEach((item, idx) => {
          const col = idx % 3;
          const row = Math.floor(idx / 3);
          const cx = 200 + col * 520;
          const cy = 350 + row * 245;
          const selected = this.shopCursor === idx;

          drawInkPanel(
            ctx,
            cx,
            cy,
            480,
            210,
            selected ? "#37225e" : "#141026",
            selected ? "#ffcb2e" : item.color
          );

          drawComicText(ctx, item.title, cx + 24, cy + 46, 30, selected ? "#ffcb2e" : item.color);
          ctx.font = "800 21px 'Trebuchet MS', sans-serif";
          ctx.fillStyle = "#f7f1e1";
          ctx.fillText(item.subtitle, cx + 24, cy + 92);

          const priceText = item.cost > 0 ? `COST: ${item.cost} Z` : "FREE — RESUME";
          const canAfford = this.player.zenny >= item.cost;
          drawComicText(
            ctx,
            priceText,
            cx + 24,
            cy + 158,
            32,
            item.cost === 0 ? "#00e5ff" : canAfford ? "#76ff03" : "#ff2a85"
          );

          if (selected) {
            drawComicText(ctx, "◀ SELECTED ▶", cx + 450, cy + 158, 24, "#ffcb2e", "#08060c", "right");
          }
        });

        let bx = 220;
        bx += drawButtonBadge(ctx, "D-PAD / L-STICK", "SELECT ITEM", bx, 915, "#00e5ff") + 45;
        bx += drawButtonBadge(ctx, "CROSS (X) / ENTER", "PURCHASE / EQUIP", bx, 915, "#76ff03") + 45;
        drawButtonBadge(ctx, "CIRCLE (O) / ESC", "EXIT SHOP", bx, 915, "#ff2a85");
      }

      renderPauseOverlay(ctx) {
        ctx.fillStyle = "rgba(8, 6, 16, 0.82)";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        drawInkPanel(ctx, 560, 220, 800, 620, "#181230", "#ffcb2e");
        drawComicText(ctx, "SORTIE PAUSED", 960, 290, 56, "#ffcb2e", "#08060c", "center");

        const opts = [
          "RESUME SORTIE",
          "RESTART STAGE 1",
          "SETTINGS & CONTROLS",
          "RETURN TO TITLE SCREEN"
        ];

        opts.forEach((label, idx) => {
          const sel = this.pauseIndex === idx;
          const oy = 370 + idx * 96;
          drawInkPanel(ctx, 630, oy, 660, 74, sel ? "#ff2a85" : "#241b42", sel ? "#ffcb2e" : "#08060c");
          drawComicText(ctx, sel ? `▶  ${label}` : label, 960, oy + 37, 32, sel ? "#ffcb2e" : "#f7f1e1", "#08060c", "center");
        });
      }

      renderSettingsOverlay(ctx) {
        ctx.fillStyle = "rgba(8, 6, 16, 0.88)";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        drawInkPanel(ctx, 360, 130, 1200, 820, "#181230", "#00e5ff");
        drawComicText(ctx, "SYSTEM & CONTROLLER SETTINGS", 960, 200, 52, "#00e5ff", "#08060c", "center");

        const rows = [
          { name: "MASTER SYNTH AUDIO", val: SETTINGS.soundEnabled ? "ENABLED" : "MUTED" },
          { name: "CPS-1 MUSIC VOLUME", val: `${Math.round(SETTINGS.musicVolume * 100)}%` },
          { name: "CONTINUOUS AUTO-FIRE", val: SETTINGS.autoFire ? "ON (RECOMMENDED)" : "MANUAL HOLD" },
          { name: "COMIC INK HALFTONE FRAME", val: SETTINGS.halftoneOverlay ? "ON" : "OFF" },
          { name: "EXPLOSION SCREEN SHAKE", val: SETTINGS.screenShake ? "ON" : "OFF" },
          { name: "SAVE & RETURN", val: "CONFIRM" }
        ];

        rows.forEach((r, idx) => {
          const sel = this.settingsIndex === idx;
          const ry = 275 + idx * 92;
          drawInkPanel(ctx, 430, ry, 1060, 74, sel ? "#37225e" : "#221a3d", sel ? "#ffcb2e" : "#08060c");
          drawComicText(ctx, r.name, 465, ry + 37, 30, sel ? "#ffcb2e" : "#f7f1e1");
          drawComicText(ctx, `◀  ${r.val}  ▶`, 1450, ry + 37, 30, sel ? "#76ff03" : "#00e5ff", "#08060c", "right");
        });

        let bx = 440;
        bx += drawButtonBadge(ctx, "D-PAD UP/DOWN", "SELECT", bx, 890, "#00e5ff") + 45;
        bx += drawButtonBadge(ctx, "LEFT/RIGHT / CROSS", "TOGGLE VALUE", bx, 890, "#ffcb2e") + 45;
        drawButtonBadge(ctx, "CIRCLE / ESC", "BACK", bx, 890, "#ff2a85");
      }

      renderCreditsOverlay(ctx) {
        ctx.fillStyle = "rgba(8, 6, 16, 0.9)";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        drawInkPanel(ctx, 240, 110, 1440, 860, "#181230", "#ffcb2e");
        drawComicText(ctx, "ABOUT & SOURCE INFORMATION", 960, 180, 52, "#ffcb2e", "#08060c", "center");

        const infoLines = [
          ["GAME TITLE", `${GAME_META.title} (${GAME_META.subtitle})`],
          ["INITIAL DATE", GAME_META.initialDate],
          ["SOURCE GAME", GAME_META.source],
          ["TECH / ENGINE", GAME_META.techEngine],
          ["ENVIRONMENT", GAME_META.environment],
          ["MODEL & EFFORT", GAME_META.modelEffort],
          ["ART DIRECTION", "Cel-Shaded / Heavy Comic Ink Outlines + Procedural CPS-1 Audio Synth"],
          ["UX PHILOSOPHY", "10-Foot Living Room Controller-First (PS5 DualSense + Keyboard Mapping)"]
        ];

        infoLines.forEach(([k, v], idx) => {
          const ly = 265 + idx * 72;
          drawInkPanel(ctx, 300, ly, 1320, 58, "#231b42", "#00e5ff");
          drawComicText(ctx, `${k}:`, 325, ly + 29, 25, "#ffcb2e");
          ctx.font = "700 22px 'Trebuchet MS', sans-serif";
          ctx.fillStyle = "#f7f1e1";
          ctx.fillText(v, 610, ly + 36);
        });

        drawButtonBadge(ctx, "CROSS (X) / CIRCLE (O) / ENTER / ESC", "RETURN TO TITLE MENU", 680, 910, "#76ff03");
      }

      renderEndOverlay(ctx) {
        ctx.fillStyle = "rgba(8, 6, 16, 0.84)";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        const won = this.state === "VICTORY";
        const p = this.player;
        const acc = p.shotsFired > 0 ? Math.round((p.shotsHit / p.shotsFired) * 100) : 0;

        drawInkPanel(ctx, 420, 170, 1080, 740, "#191233", won ? "#76ff03" : "#ff2a85");
        drawComicText(
          ctx,
          won ? "THE DUST WORLD IS LIBERATED!" : "SKY-MERCENARY DOWN!",
          960,
          255,
          60,
          won ? "#76ff03" : "#ff2a85",
          "#08060c",
          "center"
        );
        drawComicText(
          ctx,
          won ? "'I WILL END YOU, BIOS!' — MISSION COMPLETE" : "THE WAR GOD STILL REIGNS OVER NEO-BABYLON",
          960,
          325,
          28,
          "#ffcb2e",
          "#08060c",
          "center"
        );

        // Stats breakdown
        const stats = [
          `FINAL SCORE: ${p.score.toLocaleString()} PTS`,
          `ZENNY RESERVE: ${p.zenny.toLocaleString()} Z`,
          `HOSTILES DESTROYED: ${p.kills}   |   ACCURACY: ${acc}%`
        ];
        stats.forEach((st, idx) => {
          drawComicText(ctx, st, 960, 415 + idx * 58, 34, "#f7f1e1", "#08060c", "center");
        });

        const choices = ["PLAY SORTIE AGAIN", "RETURN TO TITLE SCREEN"];
        choices.forEach((ch, idx) => {
          const sel = this.endMenuIndex === idx;
          const cy = 635 + idx * 102;
          drawInkPanel(ctx, 580, cy, 760, 78, sel ? "#ff2a85" : "#251c47", sel ? "#ffcb2e" : "#08060c");
          drawComicText(ctx, sel ? `▶  ${ch}` : ch, 960, cy + 39, 34, sel ? "#ffcb2e" : "#f7f1e1", "#08060c", "center");
        });
      }

      renderComicInkFrame(ctx) {
        // Subtle comic scanline/ink hatching in corners + outer thick comic page border
        ctx.save();
        ctx.strokeStyle = "rgba(8, 6, 12, 0.22)";
        ctx.lineWidth = 2;
        for (let y = 0; y < CANVAS_H; y += 9) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(CANVAS_W, y);
          ctx.stroke();
        }

        ctx.lineWidth = 14;
        ctx.strokeStyle = "#08060c";
        ctx.strokeRect(7, 7, CANVAS_W - 14, CANVAS_H - 14);
        ctx.restore();
      }
    }

    /* =========================================================================
       11. BOOTSTRAP & REQUESTANIMATIONFRAME LOOP
       ========================================================================= */
    window.addEventListener("DOMContentLoaded", () => {
      const canvas = document.getElementById("game-canvas");
      const game = new MisrememberedWorldsGame(canvas);

      let lastTime = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;

        game.update(dt);
        game.render();
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    });
  </script>
</body>
</html>
