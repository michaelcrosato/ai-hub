.reticle {

}

.reticle > i,
.reticle > b,

	position: absolute;

	height: 12px;
	border-color: currentColor;
	border-style: solid;
	border-width: 0;
}
.reticle > span {
	left: 0;
	top: 0;
	border-left-width: 1px;
	border-top-width: 1px;
}
.reticle > i {
	right: 0;
	top: 0;
	border-right-width: 1px;
	border-top-width: 1px;
}
.reticle > b {
	left: 0;
	bottom: 0;
	border-left-width: 1px;
	border-bottom-width: 1px;
}
.reticle > em {
	right: 0;
	bottom: 0;
	border-right-width: 1px;
	border-bottom-width: 1px;
}
.reticle-dot {
	position: absolute;
	width: 3px;
	height: 3px;
	border-radius: 50%;

.lock-target > b {

	right: 0;

	border-bottom: 0;
}
.lock-target > em {

@keyframes screen-enter {
	from {
		opacity: 0;
	}
	to {
		opacity: 1;
	}
}
@keyframes radio-in {

		opacity: 0;

	to {

		transform: translateX(0);

}

	to {

		transform: translate(-50%, 0);
	}
}
@keyframes wave {

		height: 2px;
		opacity: 0.4;
	}

@keyframes warning-pulse {
