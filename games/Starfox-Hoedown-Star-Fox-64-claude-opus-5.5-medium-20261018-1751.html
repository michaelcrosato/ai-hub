var Particles = class {

    this.v = new Float32Array(count * 3);

    this.max = new Float32Array(count);

    this.grow = new Float32Array(count);
    this.kind = new Uint8Array(count);

    this.c = new THREE.Color();

      this.mesh.setMatrixAt(k, this.m);

  emit(x, y, z, vx, vy, vz, life, size, grow = 0, kind = 0) {

    this.v.set([vx, vy, vz], k * 3);
    this.life[k] = life;
    this.max[k] = life;
    this.size[k] = size;
    this.grow[k] = grow;

  }

      this.life[k] -= dt;
      const j = k * 3;
      if (this.life[k] <= 0) {
        this.m.makeScale(0, 0, 0);
        this.mesh.setMatrixAt(k, this.m);

      this.v[j] *= dr;
      this.v[j + 1] = this.v[j + 1] * dr + this.gravity * dt;

      p.vy *= 0.3;

      p.boostState = -1;
    }
    if (inp.pressed(B.CIRCLE) && !p.boostCool) this.audio.boost();

    if (planet) p.pos.y = Math.max(p.pos.y, heightAt(p.x, p.pos.z) + 2.5);

  updatePlayerAllRange(dt) {
    const p = this.p, inp = this.input;
    let sx = inp.lx, sy = -inp.ly;
    if (this.settings.invert) sy = -sy;
    if (p.dead) {
      sx = 0;
      sy = 0;
    }
    const now = this.time;
    if (!p.dead) {
      if (inp.pressed(B.L1)) {
        if (now - p.tapL < 0.32) this.barrelRoll(-1);
        p.tapL = now;
      }
      if (inp.pressed(B.R1)) {
        if (now - p.tapR < 0.32) this.barrelRoll(1);
        p.tapR = now;
      }
      if (inp.pressed(B.TRIANGLE) && p.loopT <= 0 && p.uturnT <= 0) {
        if (sy < -0.5) {
          p.uturnT = 1;
          p.uturnStartPitch = p.pitch;
        } else p.loopT = 1.5;
        this.audio.boost();
      }
    }
    const bank = (inp.down(B.R1) ? 1 : 0) - (inp.down(B.L1) ? 1 : 0);
    const turn = 1.55 * (bank !== 0 ? 1.6 : 1);
    if (p.lasso) {
      const hp = p.lasso.src.pos;
      _v.subVectors(hp, p.pos).normalize();
      p.pos.addScaledVector(_v, 34 * dt);
      p.lasso.t += dt;
      p.shield -= 5 * dt * this.diff.dmg;
      if (p.shield <= 0 && !this.demo) this.playerDie();
      if (p.lasso && p.lasso.t > 4) p.lasso = null;
    }
    if (p.loopT > 0) {
      p.loopT -= dt;
      p.pitch += Math.PI * 2 / 1.5 * dt;
      if (p.loopT <= 0) p.pitch = Math.atan2(Math.sin(p.pitch), Math.cos(p.pitch));
    } else if (p.uturnT > 0) {
      p.uturnT -= dt;
      if (p.uturnT > 0.25) p.pitch += (Math.PI - p.uturnStartPitch) / 0.75 * dt;
      else if (!p.uturnFlipped) {
        p.uturnFlipped = true;
        p.yaw += Math.PI;
        p.pitch = Math.PI - p.pitch;
        p.pitch = Math.atan2(Math.sin(p.pitch), Math.cos(p.pitch));
        p.uturnRoll = Math.PI;
      }
      if (p.uturnT <= 0) p.uturnFlipped = false;
    } else {
      p.yaw -= sx * turn * dt;
      p.pitch = clamp(p.pitch + sy * 1.25 * dt, -1.3, 1.3);
    }
    p.uturnRoll = damp(p.uturnRoll, 0, 5, dt);
    const out = Math.hypot(p.pos.x, p.pos.z) > 640 || Math.abs(p.pos.y) > 260;
    if (out && p.loopT <= 0 && p.uturnT <= 0) {
      const want = Math.atan2(p.pos.x, p.pos.z);
      let dy = want - p.yaw;
      dy = Math.atan2(Math.sin(dy), Math.cos(dy));
      p.yaw += clamp(dy, -2.2 * dt, 2.2 * dt);
      p.pitch = damp(p.pitch, clamp(-p.pos.y / 300, -0.6, 0.6), 2, dt);
      if (!this.allRange.outT) {
        this.ui.toast("Leaving the corral \u2014 turning back!", 2);
        this.allRange.outT = 4;
      }
    }
    if (this.allRange.outT > 0) this.allRange.outT = Math.max(0, this.allRange.outT - dt);
    let target = 56;
    p.boostState = 0;
    if (!p.dead && !p.boostCool && inp.down(B.CIRCLE) && p.boost > 0) {
      target = 100;
      p.boostState = 1;
    } else if (!p.dead && !p.boostCool && inp.down(B.L2) && p.boost > 0) {
      target = 24;
      p.boostState = -1;
    }
    if (inp.pressed(B.CIRCLE) && !p.boostCool) this.audio.boost();
    if (inp.pressed(B.L2) && !p.boostCool) this.audio.brake();
    if (p.boostState) {
      p.boost -= dt * 0.5;
      if (p.boost <= 0) {
        p.boost = 0;
        p.boostCool = true;
      }
    } else {
      p.boost = Math.min(1, p.boost + dt * 0.3);
      if (p.boost >= 1) p.boostCool = false;
    }
    p.speed = damp(p.speed, p.dead ? 0 : target, 3, dt);
    _e.set(p.pitch, p.yaw, 0, "YXZ");
    p.fwd.set(0, 0, -1).applyEuler(_e);
    p.up.set(0, 1, 0).applyEuler(_e);
    p.prevZ = p.pos.z;
    if (!p.dead) p.pos.addScaledVector(p.fwd, p.speed * dt);
    if (p.rollT > 0) {
      p.rollT -= dt;
      p.rollAng = p.rollDir * (1 - Math.max(0, p.rollT) / 0.55) * Math.PI * 4;
    } else p.rollAng = 0;
    p.bankVis = damp(p.bankVis, bank * 1.2 + sx * 0.7, 6, dt);
    _e.set(p.pitch, p.yaw, -p.bankVis + p.rollAng + p.uturnRoll, "YXZ");
    p.obj.quaternion.setFromEuler(_e);
    p.obj.position.copy(p.pos);
    p.vx = 0;
    p.vy = 0;
    this.shipFx(dt);
    this.weapons(dt);
  }

var DEMO = [
