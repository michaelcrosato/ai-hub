class Particles {
  constructor(scene, count, colorHex, sizeMul, mode) {
    this.count = count; this.mode = mode; this.sizeMul = sizeMul;
    const geo = new THREE.IcosahedronGeometry(1, 0);
    this.mesh = new THREE.InstancedMesh(geo, toon(colorHex, { unique: true }), count);
    this.mesh.frustumCulled = false; this.mesh.castShadow = false;
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.p = new Float32Array(count * 3); this.v = new Float32Array(count * 3); this.life = new Float32Array(count); this.max = new Float32Array(count); this.size = new Float32Array(count);
    this.next = 0; this.dummy = new THREE.Object3D();
    const c = new THREE.Color();
    for (let i = 0; i < count; i++) { c.setHSL(0.55, 0.3, 0.88 + Math.random() * 0.12); this.mesh.setColorAt(i, c); this.dummy.scale.setScalar(0); this.dummy.updateMatrix(); this.mesh.setMatrixAt(i, this.dummy.matrix); }
    scene.add(this.mesh);
  }
  emit(x, y, z, vx, vy, vz, life, size) {
    const i = this.next; this.next = (this.next + 1) % this.count;
    this.p[i * 3] = x; this.p[i * 3 + 1] = y; this.p[i * 3 + 2] = z;
    this.v[i * 3] = vx; this.v[i * 3 + 1] = vy; this.v[i * 3 + 2] = vz;
    this.life[i] = life; this.max[i] = life; this.size[i] = size;
  }
  update(dt) {
    const d = this.dummy;
    for (let i = 0; i < this.count; i++) {
      if (this.life[i] <= 0) continue;
      this.life[i] -= dt;
      const k = i * 3;
      if (this.mode === 'spray') {
        this.v[k + 1] -= GRAV * 0.7 * dt;
        this.p[k] += this.v[k] * dt; this.p[k + 1] += this.v[k + 1] * dt; this.p[k + 2] += this.v[k + 2] * dt;
        const wh = waveHeight(this.p[k], this.p[k + 2]);
        if (this.p[k + 1] < wh - 0.3) this.life[i] = Math.min(this.life[i], 0.08);
      } else if (this.mode === 'snow') {
        this.p[k] += this.v[k] * dt; this.p[k + 1] += this.v[k + 1] * dt; this.p[k + 2] += this.v[k + 2] * dt;
      } else {
        this.v[k] *= 1 - 1.5 * dt; this.v[k + 2] *= 1 - 1.5 * dt;
        this.p[k] += this.v[k] * dt; this.p[k + 2] += this.v[k + 2] * dt;
        this.p[k + 1] = waveHeight(this.p[k], this.p[k + 2]) + 0.05;
      }
      const t = this.life[i] / this.max[i];
      const s = this.life[i] <= 0 ? 0 : this.size[i] * this.sizeMul * (this.mode === 'foam' ? Math.sin(Math.min(1, (1 - t) * 4) * Math.PI * 0.5) * t + 0.15 * t : Math.min(1, t * 2.5));
      d.position.set(this.p[k], this.p[k + 1], this.p[k + 2]);
      if (this.mode === 'foam') d.scale.set(s * 1.3, s * 0.35, s * 1.3); else d.scale.setScalar(s);
      d.rotation.set(i, i * 0.7, 0);
      d.updateMatrix(); this.mesh.setMatrixAt(i, d.matrix);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
}

class Track {
  constructor(pts) {

  nearest(x, z, hint = -1, win = 60) {

    for (let k = -win; k <= win; k++) { const i = this.wrap(hint + k); const d = (this.px[i] - x) ** 2 + (this.pz[i] - z) ** 2; if (d < best) { best = d; bi = i; } }
    return bi;
  }

  }

function applyBuoyancy(body, pts, kPer, cPer, dt, tmp) {
  const t = body.translation(), r = body.rotation(), lv = body.linvel(), av = body.angvel();
  tmp.q.set(r.x, r.y, r.z, r.w);

  for (const p of pts) {
    tmp.v.copy(p).applyQuaternion(tmp.q); const wx = t.x + tmp.v.x, wy = t.y + tmp.v.y, wz = t.z + tmp.v.z;
    const depth = waveHeight(wx, wz) - wy;
    if (depth > 0) {
      sub++;
      const vy = lv.y + (av.z * tmp.v.x - av.x * tmp.v.z);
      const f = Math.max(kPer * Math.min(depth, 1.4) - cPer * vy, -kPer * 0.3);
      body.applyImpulseAtPoint({ x: 0, y: f * dt, z: 0 }, { x: wx, y: wy, z: wz }, true);

}

}

    this.data = data; this.model = buildSkiModel(RIDERS.find((r) => r.id === data.rider) || RIDERS[0], true); game.scene.add(this.model.root); this.game = game;
  }
  update(t) {
    const d = this.data.frames, idx = t / 0.1, i = Math.floor(idx), f = idx - i;
    if (i >= d.length - 1) { this.model.root.visible = false; return; }
    const a = d[i], b = d[i + 1];
    this.model.root.visible = true;
    this.model.root.position.set(lerp(a[0], b[0], f), lerp(a[1], b[1], f), lerp(a[2], b[2], f));
    this.model.root.rotation.set(0, lerp(a[3], a[3] + wrapAngle(b[3] - a[3]), f), 0);
  }
  dispose() { this.game.scene.remove(this.model.root); }
}

// ===== Race sessions: championship, time trial, stunt, tutorial, attract =====
const CHAMP_POINTS = [7, 4, 2, 1];
const DIFF_MUL = [0.9, 0.965, 1.02];
const TUTORIAL_STEPS = [
  { text: () => `Hold ${glyph('cross')} or ${glyph('r2')} to open the throttle`, check: (r, p) => p.speed > 14 },
  { text: () => `Steer with ${glyph('stick')} — carve a big circle`, check: (r) => r.tut.yaw > Math.PI * 1.2 },
  { text: () => `Hold the stick <b>back</b> while turning for a tight carve`, check: (r) => r.tut.carve > 1.2 },
  { text: () => `Pass <b class="red">right of RED</b> buoys and <b class="yel">left of YELLOW</b> — fill 3 Power pips`, check: (r, p) => p.power >= 3 },
  { text: () => `Hit a ramp (or a big swell) to catch air`, check: (r) => r.tut.maxAir > 0.7 },
  { text: () => `In the air, flick ${glyph('stick')} left / right for a Barrel Roll`, check: (r) => r.tut.tricks.has('Barrel Roll') },
  { text: () => `Flick up / down for flips, or press ${glyph('triangle')} for a Helicopter`, check: (r) => r.tut.tricks.has('Front Flip') || r.tut.tricks.has('Back Flip') || r.tut.tricks.has('Helicopter') },
  { text: () => `Hold ${glyph('triangle')} on the water for a Handstand (style points!)`, check: (r) => r.tut.hand > 1.5 },
  { text: () => `Tuck in behind the pacer's wake to DRAFT for extra speed`, check: (r) => r.tut.draft > 2, enter: (r) => r.spawnPacer() },
  { text: () => `Lesson complete — you're ready to race!`, check: (r) => r.tut.stepT > 4, done: true },
];

class Race {
  constructor(game, cfg) {
    this.game = game; this.cfg = cfg; this.mode = cfg.mode; this.attract = !!cfg.attract;
    this.def = COURSES[cfg.course];
    this.useBuoys = this.mode !== 'stunt';
    this.course = game.loadCourse(this.def, { buoys: this.useBuoys, rings: this.mode === 'stunt' });
    this.laps = this.mode === 'tutorial' ? 9999 : this.mode === 'stunt' ? 2 : cfg.laps || Settings.laps;
    this.baseDiff = DIFF_MUL[Settings.difficulty];
    this.time = 0; this.countdown = this.mode === 'tutorial' ? 1.2 : 3.6; this.state = 'countdown'; this.lastCount = 4;
    this.skis = []; this.finishOrder = []; this.endTimer = -1; this.score = 0; this.chain = 0; this.stuntLimit = 150;
    this.tut = { step: 0, yaw: 0, carve: 0, maxAir: 0, tricks: new Set(), hand: 0, draft: 0, stepT: 0 };
    const T = this.course.track;
    const riderP = RIDERS.find((r) => r.id === cfg.rider) || RIDERS[0];
    const grid = (k) => { const row = Math.floor(k / 2), lat = (k % 2 ? 5 : -5) + (row % 2 ? 2.5 : -2.5); const s = T.len - 14 - row * 9; const p = T.pointAt(s, lat); return { pos: p, yaw: T.yaw(T.idx(s)) }; };
    const solo = this.mode === 'trial' || this.mode === 'stunt' || this.mode === 'tutorial';
    const others = RIDERS.filter((r) => r !== riderP);
    const order = solo ? [riderP] : [others[0], riderP, others[1], others[2]];
    order.forEach((rd, k) => {
      const g = solo ? grid(1) : grid(k);
      const isP = rd === riderP;
      const ski = new Ski(game, rd, { pos: g.pos, yaw: g.yaw, player: isP, ai: !isP || this.attract, cheat: isP && this.attract, diffMul: isP ? 1 : this.baseDiff });
      ski.s = T.idx(T.len - 14) * T.ds; ski.lap = 0; ski.half = true;
      this.skis.push(ski); if (isP) this.player = ski;
    });
    this.ghost = null; this.ghostFrames = []; this.ghostT = 0;
    if (this.mode === 'trial') { const gd = Store.get('ghost:' + this.def.id, null); if (gd && gd.frames) this.ghost = new Ghost(game, gd); }
    if (this.mode === 'stunt') this.course.resetRings();
    this.best = this.mode === 'trial' ? Store.get('best:' + this.def.id, null) : this.mode === 'stunt' ? Store.get('stunt:' + this.def.id, 0) : null;
    if (cfg.showcase) this.player.isPlayer = false;
    game.hud.setup(this);
    if (!cfg.showcase) Audio2.playMusic(this.def.music);
    Audio2.startAmbient(this.def.amp);
  }
  canDrive(ski) { return this.state !== 'countdown' && !(ski.dq && !this.attract); }
  spawnPacer() {
    if (this.pacer) return;
    const T = this.course.track, p = this.player; const s = (p.s + 25) % T.len; const pt = T.pointAt(s, 0);
    const rd = RIDERS.find((r) => r !== p.rider);
    const pacer = new Ski(this.game, rd, { pos: pt, yaw: T.yaw(T.idx(s)), ai: true, diffMul: 0.9 });
    pacer.body.setLinvel({ x: T.fx[T.idx(s)] * 16, y: 0, z: T.fz[T.idx(s)] * 16 }, true);
    pacer.s = s; pacer.lap = 1; pacer.pacer = true; this.pacer = pacer; this.skis.push(pacer);
  }
  physicsStep(dt) {
    for (const s of this.skis) s.physicsStep(dt, this);
  }
  update(dt) {
    const T = this.course.track;
    if (this.state === 'countdown') {
      this.countdown -= dt; const c = Math.ceil(this.countdown);
      if (c < this.lastCount && c <= 3 && c >= 1) { this.lastCount = c; Audio2.sfx('count'); this.game.hud.big(String(c)); }
      if (this.countdown <= 0) { this.state = 'race'; Audio2.sfx('go'); this.game.hud.big(this.mode === 'tutorial' ? 'LET\'S RIDE!' : 'GO!'); Input.rumble(0.5, 0.5, 200); }
    } else if (this.state === 'race' || this.state === 'post') this.time += dt;
    // controls
    const inp = Input.axes;
    for (const ski of this.skis) {
      if (ski.ai || (ski.isPlayer && (ski.finished || ski.dq))) ski.aiDrive(dt, this);
      else ski.setInputs(inp.lx, inp.ly, Math.max(inp.r2, Input.held('cross') ? 1 : 0), Math.max(inp.l2, Input.held('square') ? 1 : 0), Input.held('triangle'));
      ski.frameUpdate(dt, this);
      this.track(ski, dt);
    }
    // drafting
    for (const a of this.skis) {
      let d = false;
      for (const b of this.skis) {
        if (a === b) continue; _v.subVectors(a.pos, b.pos); const al = _v.x * b.fwd.x + _v.z * b.fwd.z, lt = Math.abs(_v.x * -b.fwd.z + _v.z * b.fwd.x);
        if (al < -2 && al > -16 && lt < 2.8 && b.speed > 8) d = true;
      }
      a.draft = d ? Math.min(1.5, a.draft + dt) : Math.max(0, a.draft - dt * 2);
      if (a.isPlayer && d && this.mode === 'tutorial') this.tut.draft += dt;
    }
    // standings
    const racers = this.skis.filter((s) => !s.pacer);
    const ranked = [...racers].sort((a, b) => (a.finished && b.finished ? a.finishTime - b.finishTime : a.finished ? -1 : b.finished ? 1 : (a.dq - b.dq) || b.progress - a.progress));
    ranked.forEach((s, k) => (s.place = k + 1));
    if (this.ghost) { this.ghost.update(this.time); }
    if (this.mode === 'trial' && this.state === 'race' && !this.player.finished) {
      this.ghostT += dt; if (this.ghostT >= 0.1 || !this.ghostFrames.length) { this.ghostT = 0; const p = this.player.pos; this.ghostFrames.push([+p.x.toFixed(2), +p.y.toFixed(2), +p.z.toFixed(2), +Math.atan2(this.player.fwd.x, this.player.fwd.z).toFixed(3)]); }
    }
    if (this.mode === 'stunt' && this.state === 'race' && this.time >= this.stuntLimit && !this.player.finished) this.finishSki(this.player);
    if (this.mode === 'tutorial') this.updateTutorial(dt);
    if (this.endTimer >= 0) { this.endTimer -= dt; if (this.endTimer < 0) this.end(); }
    this.game.hud.update(this, dt);
  }
  track(ski, dt) {
    const T = this.course.track;
    ski.prevS = ski.s;
    ski.trackIdx = T.nearest(ski.pos.x, ski.pos.z, ski.trackIdx, 30);
    const s = ski.trackIdx * T.ds; ski.s = s;
    if (s > T.len * 0.35 && s < T.len * 0.65) ski.half = true;
    if (ski.prevS > T.len * 0.8 && s < T.len * 0.2) {
      if (ski.half) {
        ski.half = false; ski.lap++;
        if (ski.lap > 1) { ski.lapTimes.push(this.time - ski.lapStart); }
        ski.lapStart = this.time;
        if (this.mode === 'stunt' && ski.isPlayer && ski.lap > 1) this.course.resetRings();
        if (ski.lap > this.laps && !ski.finished) this.finishSki(ski);
        else if (ski.isPlayer && ski.lap > 1 && this.mode !== 'tutorial') { Audio2.sfx('lap'); this.game.hud.big(ski.lap === this.laps ? 'FINAL LAP' : `LAP ${ski.lap}`); }
      }
    } else if (ski.prevS < T.len * 0.2 && s > T.len * 0.8) ski.half = false;
    ski.progress = (ski.lap - 1) * T.len + s - (ski.lap === 0 ? -T.len : 0) * 0;
    if (ski.lap === 0) ski.progress = s - T.len;
    if (ski.finished) return;
    // buoys
    const by = this.course.buoys;
    if (this.useBuoys && by.length && ski.lap >= 1 && this.state !== 'countdown') {
      const nb = by[ski.nextBuoy % by.length];
      let ds = nb.s - s; if (ds < -T.len / 2) ds += T.len; if (ds > T.len / 2) ds -= T.len;
      if (ds < 0 && ds > -45) {
        const lat = T.lateral(ski.pos.x, ski.pos.z, ski.trackIdx);
        const ok = (nb.red ? lat > nb.lat : lat < nb.lat) && Math.abs(lat - nb.lat) < 38;
        ski.nextBuoy++;
        this.onBuoy(ski, nb, ok);
      }
    }
    // rings
    const rg = this.course.rings;
    if (rg.length && ski.lap >= 1) {
      const r = rg[ski.nextRing % rg.length];
      let ds = r.s - s; if (ds < -T.len / 2) ds += T.len; if (ds > T.len / 2) ds -= T.len;
      if (ds < 0 && ds > -30) {
        const lat = T.lateral(ski.pos.x, ski.pos.z, ski.trackIdx); const dy = ski.pos.y + 0.5 - r.h;
        const hit = Math.hypot(lat - r.lat, dy) < 3.6 + (ski.cheat ? 3 : 0);
        ski.nextRing++;
        if (ski.isPlayer) this.onRing(ski, r, hit);
      }
    }
    // off course / wrong way
    const dist = Math.hypot(ski.pos.x - T.px[ski.trackIdx], ski.pos.z - T.pz[ski.trackIdx]);
    ski.offTrack = dist > 75 ? ski.offTrack + dt : 0;
    const dirDot = ski.fwd.x * T.fx[ski.trackIdx] + ski.fwd.z * T.fz[ski.trackIdx];
    ski.wrongWay = dirDot < -0.4 && ski.speed > 5 ? (ski.wrongWay || 0) + dt : 0;
    ski.stuck = this.state === 'race' && ski.speed < 3 && ski.inputs.thr > 0.5 && ski.wipe <= 0 ? (ski.stuck || 0) + dt : 0;
    if (ski.offTrack > 4 || (ski.ai && ski.wrongWay > 3) || ski.stuck > (ski.ai ? 2.5 : 6)) { ski.stuck = 0; ski.respawn(); }
  }
  onBuoy(ski, b, ok) {
    if (ok) {
      ski.power = Math.min(5, ski.power + 1);
      if (ski.isPlayer) { if (ski.power === 5) { Audio2.sfx('maxpower'); this.game.hud.flash('MAX POWER!', 'good'); } else { Audio2.sfx('buoy'); this.game.hud.flash('NICE!', 'good', 0.7); } Input.rumble(0, 0.4, 80); }
    } else {
      ski.power = 0; ski.misses++;
      if (ski.isPlayer) {
        Audio2.sfx('miss'); Input.rumble(0.6, 0.2, 200);
        if (this.mode === 'champ' && ski.misses >= 5 && !this.attract) { ski.dq = true; this.game.hud.big('DISQUALIFIED'); this.finishSki(ski, true); }
        else this.game.hud.flash(this.mode === 'champ' ? `MISSED  ${ski.misses}/5` : 'MISSED', 'bad');
      }
    }
  }
  onRing(ski, r, hit) {
    if (hit) {
      r.hit = true; this.chain = Math.min(8, this.chain + 1); const pts = (r.high ? 250 : 100) * this.chain; this.score += pts;
      Audio2.sfx('ring'); this.game.hud.flash(`RING +${pts}${this.chain > 1 ? `  ×${this.chain}` : ''}`, 'good', 0.8); Input.rumble(0, 0.3, 60);
    } else { if (this.chain > 1) this.game.hud.flash('CHAIN BROKEN', 'bad', 0.8); this.chain = 0; }
  }
  onTrickDone(ski, tr, n) {
    if (ski.isPlayer) {
      if (this.mode === 'tutorial') this.tut.tricks.add(tr.name);
      const pts = tr.pts * n; if (this.mode === 'stunt' || this.attract) this.score += pts;
      this.game.hud.trick(`${tr.name}${n > 1 ? ` ×${n}` : ''}`, this.mode === 'stunt' ? `+${pts}` : '');
    }
  }
  onLanded(ski, list) {
    if (ski.isPlayer) { const bonus = this.mode === 'stunt' ? 100 * list.length * list.length : 0; this.score += bonus; this.game.hud.flash(list.length > 1 ? `COMBO LANDED! +BOOST` : 'CLEAN LANDING +BOOST', 'good', 0.9); Input.rumble(0.2, 0.5, 150); }
  }
  onHandstand(ski, dt) {
    if (!ski.isPlayer) return;
    if (this.mode === 'stunt') this.score += 60 * dt;
    if (this.mode === 'tutorial') this.tut.hand = Math.max(this.tut.hand, ski.handstand);
  }
  onWipeout(ski) { if (ski.isPlayer && this.mode === 'stunt') this.chain = 0; }
  updateTutorial(dt) {
    const p = this.player, t = this.tut; if (this.state !== 'race') return;
    t.stepT += dt; t.yaw += Math.abs(p.body.angvel().y) * dt * (p.speed > 6 ? 1 : 0);
    if (p.leanIn > 0.45 && Math.abs(p.steer) > 0.5 && p.inWater && p.speed > 6) t.carve += dt;
    if (!p.inWater) t.maxAir = Math.max(t.maxAir, p.air);
    const st = TUTORIAL_STEPS[t.step];
    if (st.check(this, p) && t.stepT > 1) {
      if (st.done) { Store.set('tutorialDone', true); this.end(); return; }
      t.step++; t.stepT = 0; Audio2.sfx('step'); this.game.hud.flash('GREAT!', 'good', 0.8);
      const nx = TUTORIAL_STEPS[t.step]; if (nx.enter) nx.enter(this);
    }
  }
  finishSki(ski, dq = false) {
    if (ski.finished) return;
    ski.finished = true; ski.finishTime = dq ? Infinity : this.time; if (!dq) this.finishOrder.push(ski);
    if (ski.isPlayer) {
      if (!dq) { Audio2.sfx('finish'); this.game.hud.big(this.mode === 'stunt' ? 'TIME!' : ski.place === 1 ? '1ST PLACE!' : 'FINISH!'); }
      this.state = 'post'; this.endTimer = 3.2; Input.rumble(0.4, 0.8, 400);
    }
  }
  results() {
    const T = this.course.track;
    const racers = this.skis.filter((s) => !s.pacer);
    const rows = racers.map((s) => {
      let time = s.finishTime;
      if (!s.finished) { const remain = this.laps * T.len - s.progress; time = this.time + Math.max(0, remain) / (s.rider.top * 0.86 * s.diffMul); }
      return { ski: s, name: s.rider.name, rider: s.rider, time: s.dq ? Infinity : time, dq: s.dq, misses: s.misses, best: s.lapTimes.length ? Math.min(...s.lapTimes) : NaN, player: s.isPlayer };
    });
    rows.sort((a, b) => a.time - b.time);
    rows.forEach((r, k) => (r.place = k + 1, r.points = r.dq ? 0 : CHAMP_POINTS[k] || 0));
    return rows;
  }
  end() {
    if (this.ended) return; this.ended = true;
    if (this.attract) { this.game.nextAttract(); return; }
    if (this.mode === 'tutorial') { UI.tutorialDone(); return; }
    const rows = this.results(); const p = this.player;
    let record = false;
    if (this.mode === 'trial' && p.finished && !p.dq) {
      const prev = Store.get('best:' + this.def.id, null);
      if (!prev || p.finishTime < prev.time) { record = true; Store.set('best:' + this.def.id, { time: p.finishTime, rider: p.rider.id }); Store.set('ghost:' + this.def.id, { rider: p.rider.id, time: p.finishTime, frames: this.ghostFrames }); }
    }
    if (this.mode === 'stunt') { const prev = Store.get('stunt:' + this.def.id, 0); if (this.score > prev) { record = true; Store.set('stunt:' + this.def.id, Math.round(this.score)); } }
    UI.showResults(this, rows, record);
  }
  dispose() {
    for (const s of this.skis) s.dispose();
    if (this.ghost) this.ghost.dispose();
    Audio2.stopAmbient();
  }
}

// ===== UI: 10-foot controller-first menus + HUD =====
const OPTS = {
  difficulty: ['Easy', 'Normal', 'Hard'], laps: [1, 2, 3, 4, 5], camera: ['Chase', 'Close', 'Cinematic'], speedUnit: ['km/h', 'mph'],
};
const UI = {
  root: null, stack: [], screen: null, focus: 0, items: [],
  init() { this.root = $('#ui'); this.prompt = $('#prompts'); },
  onPadChange() { if (this.screen) this.render(); if (Game.hud) Game.hud.refreshGlyphs(); },
  // ---------- generic screen engine ----------
  open(def, push = true) { if (push && this.screen) this.stack.push({ def: this.screen, focus: this.focus }); this.screen = def; this.focus = def.focus || 0; this.root.classList.remove('hidden'); this.render(); },
  replace(def) { this.screen = def; this.focus = def.focus || 0; this.render(); },
  back() {
    if (this.screen && this.screen.onBack) { Audio2.sfx('back'); this.screen.onBack(); return; }
    if (!this.stack.length) return;
    Audio2.sfx('back'); const prev = this.stack.pop(); this.screen = prev.def; this.focus = prev.focus; this.render();
  },
  close() { this.screen = null; this.stack = []; this.root.classList.add('hidden'); this.root.innerHTML = ''; this.prompt.innerHTML = ''; },
  render() {
    const d = this.screen; if (!d) return;
    this.items = typeof d.items === 'function' ? d.items() : d.items || [];
    this.focus = clamp(this.focus, 0, Math.max(0, this.items.length - 1));
    const layout = d.layout || 'list';
    let body = '';
    if (layout === 'list') {
      body = `<div class="menu-list">${this.items.map((it, i) => `<div class="mi ${i === this.focus ? 'focus' : ''} ${it.disabled ? 'disabled' : ''}" data-i="${i}">
        <span class="mi-label">${it.label}</span>${it.values ? `<span class="mi-val"><b class="arr" data-a="-1">‹</b><span>${it.display ? it.display() : it.values[it.get()]}</span><b class="arr" data-a="1">›</b></span>` : ''}</div>`).join('')}</div>`;
      const cur = this.items[this.focus];
      if (d.side !== false) body += `<div class="menu-side">${cur && cur.desc ? `<div class="side-card">${typeof cur.desc === 'function' ? cur.desc() : cur.desc}</div>` : ''}</div>`;
    } else if (layout === 'cards') {
      body = `<div class="cards">${this.items.map((it, i) => `<div class="card ${i === this.focus ? 'focus' : ''}" data-i="${i}" style="--c:${it.color || '#3cf'}">${it.html}</div>`).join('')}</div>`;
    } else if (layout === 'panel') body = `<div class="panel">${d.html()}</div>${this.items.length ? `<div class="menu-list row">${this.items.map((it, i) => `<div class="mi ${i === this.focus ? 'focus' : ''}" data-i="${i}"><span class="mi-label">${it.label}</span></div>`).join('')}</div>` : ''}`;
    this.root.className = 'screen ' + (d.cls || '');
    this.root.innerHTML = `${d.title ? `<h1 class="scr-title">${d.title}</h1>` : ''}${d.sub ? `<div class="scr-sub">${d.sub}</div>` : ''}<div class="scr-body ${layout}">${body}</div>`;
    this.root.querySelectorAll('[data-i]').forEach((el) => {
      el.addEventListener('mouseenter', () => { const i = +el.dataset.i; if (i !== this.focus) { this.focus = i; Audio2.sfx('move'); this.render(); } });
      el.addEventListener('click', (e) => {
        const i = +el.dataset.i; this.focus = i; const a = e.target.closest('.arr');
        if (a) this.adjust(+a.dataset.a); else this.activate();
      });
    });
    if (d.onConfirm) this.root.querySelector('.scr-body').addEventListener('click', d.onConfirm);
    const hints = d.hints || (layout === 'cards' ? [['stick', 'Choose'], ['cross', 'Select'], ['circle', 'Back']] : [['stick', 'Move'], ['cross', 'Select'], ['circle', 'Back']]);
    this.prompt.innerHTML = hints.map(([g, t]) => `<span class="hint">${glyph(g)} ${t}</span>`).join('');
  },
  adjust(dir) {
    const it = this.items[this.focus]; if (!it || !it.values) return;
    const n = it.values.length; it.set((it.get() + dir + n) % n); Audio2.sfx('adjust'); this.render();
  },
  activate() {
    const it = this.items[this.focus];
    if (!it && this.screen.onConfirm) { this.screen.onConfirm(); return; }
    if (!it || it.disabled) return;
    if (it.values && !it.action) { this.adjust(1); return; }
    Audio2.sfx('confirm'); it.action && it.action();
  },
  tick() {
    if (!this.screen) return;
    const nav = Input.nav, layout = this.screen.layout || 'list';
    const horiz = layout === 'cards' || (layout === 'panel' && this.screen.items);
    if (nav) {
      const prevF = this.focus;
      if ((nav === 'up' && !horiz) || (nav === 'left' && horiz)) this.focus = (this.focus - 1 + this.items.length) % Math.max(1, this.items.length);
      else if ((nav === 'down' && !horiz) || (nav === 'right' && horiz)) this.focus = (this.focus + 1) % Math.max(1, this.items.length);
      else if (!horiz && (nav === 'left' || nav === 'right')) this.adjust(nav === 'left' ? -1 : 1);
      if (prevF !== this.focus) { Audio2.sfx('move'); this.render(); }
    }
    if (Input.pressed('cross')) this.activate();
    else if (Input.pressed('circle')) this.back();
    else if (this.screen.onKey) this.screen.onKey();
  },
  // ---------- screens ----------

// ---------- HUD ----------
class HUD {
  constructor() {
    this.el = $('#hud'); this.msgs = $('#msgs'); this.bigEl = $('#big'); this.trickEl = $('#trick');
    this.el.innerHTML = `
      <div class="hud-tl"><div id="h-place" class="place">1<sup>st</sup></div><div id="h-sub" class="sub"></div></div>
      <div class="hud-tr"><div id="h-lap" class="lap"></div><div id="h-time" class="time"></div><div id="h-best" class="best"></div></div>
      <div class="hud-tc"><div id="h-buoy" class="buoy"></div><div id="h-warn" class="warn"></div></div>
      <div class="hud-bl"><div id="h-power" class="power"></div><div id="h-speed" class="speed"></div><div id="h-draft" class="draft">DRAFT</div></div>
      <div class="hud-br"><canvas id="h-map" width="240" height="240"></canvas></div>
      <div id="h-tut" class="tut"></div><div id="h-score" class="score"></div>
      <div id="h-demo" class="demo"><b>DEMO PLAY</b><span>Press any button</span></div>`;
    this.map = $('#h-map'); this.ctx = this.map.getContext('2d');
    this.cache = {};
  }
  set(id, html) { if (this.cache[id] !== html) { this.cache[id] = html; $('#' + id).innerHTML = html; } }
  show(v) { this.el.classList.toggle('hidden', !v); }
  setup(race) {
    this.race = race; this.cache = {}; this.show(true); this.msgs.innerHTML = ''; this.bigEl.className = ''; this.trickEl.className = '';
    this.el.className = 'mode-' + race.mode + (race.attract ? ' attract' : '');
    // pre-render minimap track
    const T = race.course.track; let minx = 1e9, maxx = -1e9, minz = 1e9, maxz = -1e9;
    for (let i = 0; i < T.N; i++) { minx = Math.min(minx, T.px[i]); maxx = Math.max(maxx, T.px[i]); minz = Math.min(minz, T.pz[i]); maxz = Math.max(maxz, T.pz[i]); }
    const sc = 200 / Math.max(maxx - minx, maxz - minz), ox = 120 - ((minx + maxx) / 2) * sc, oz = 120 - ((minz + maxz) / 2) * sc;
    this.mp = (x, z) => [240 - (x * sc + ox), z * sc + oz];
    const off = document.createElement('canvas'); off.width = off.height = 240; const g = off.getContext('2d');
    g.lineCap = g.lineJoin = 'round';
    for (const [w, c] of [[14, 'rgba(10,20,40,.55)'], [8, 'rgba(255,255,255,.85)']]) { g.strokeStyle = c; g.lineWidth = w; g.beginPath(); for (let i = 0; i <= T.N; i += 4) { const [x, y] = this.mp(T.px[i % T.N], T.pz[i % T.N]); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.closePath(); g.stroke(); }
    const [sx, sy] = this.mp(T.px[0], T.pz[0]); g.fillStyle = '#111'; g.fillRect(sx - 6, sy - 6, 12, 12); g.fillStyle = '#fff'; g.fillRect(sx - 6, sy - 6, 6, 6); g.fillRect(sx, sy, 6, 6);
    this.mapBg = off;
  }
  refreshGlyphs() { this.cache.tut = null; }
  flash(text, kind = '', dur = 1.1) {
    const d = document.createElement('div'); d.className = 'msg ' + kind; d.textContent = text; this.msgs.appendChild(d);
    setTimeout(() => d.remove(), dur * 1000 + 400); while (this.msgs.children.length > 3) this.msgs.firstChild.remove();
  }
  big(text) { this.bigEl.textContent = text; this.bigEl.className = ''; void this.bigEl.offsetWidth; this.bigEl.className = 'show'; }
  trick(name, pts) { this.trickEl.innerHTML = `<b>${name}</b>${pts ? `<span>${pts}</span>` : ''}`; this.trickEl.className = ''; void this.trickEl.offsetWidth; this.trickEl.className = 'show'; }
  update(race, dt) {
    const p = race.player; const T = race.course.track;
    const racing = race.mode === 'champ';
    if (racing) { this.set('h-place', `${p.place}<sup>${ordinal(p.place).slice(-2)}</sup>`); this.set('h-sub', `of ${race.skis.filter((s) => !s.pacer).length}`); }
    else if (race.mode === 'stunt') { this.set('h-place', `${Math.round(race.score)}`); this.set('h-sub', race.chain > 1 ? `Chain ×${race.chain}` : 'Score'); }
    else if (race.mode === 'trial') { this.set('h-place', '<small>TIME</small>'); this.set('h-sub', race.ghost ? 'vs ghost' : 'solo'); }
    else { this.set('h-place', '<small>LESSON</small>'); this.set('h-sub', `${race.tut.step + 1} / ${TUTORIAL_STEPS.length}`); }
    if (race.mode !== 'tutorial') this.set('h-lap', `LAP <b>${clamp(p.lap, 1, race.laps)}</b>/${race.laps}`); else this.set('h-lap', '');
    const tShow = race.mode === 'stunt' ? Math.max(0, race.stuntLimit - race.time) : p.finished ? p.finishTime : race.time;
    this.set('h-time', race.mode === 'tutorial' ? '' : fmtTime(tShow));
    if (race.mode === 'trial' && race.best) this.set('h-best', `BEST ${fmtTime(race.best.time)}`);
    else if (race.mode === 'stunt' && race.best) this.set('h-best', `HI ${race.best}`);
    else this.set('h-best', p.lapTimes.length ? `LAST ${fmtTime(p.lapTimes[p.lapTimes.length - 1])}` : '');
    let pw = ''; for (let i = 0; i < 5; i++) pw += `<i class="${i < p.power ? 'on' : ''}"></i>`;
    this.set('h-power', race.mode === 'stunt' ? '' : `<span>POWER</span>${pw}${p.power >= 5 ? '<b>MAX</b>' : ''}`);
    const sp = Settings.speedUnit ? p.speed * 2.237 : p.speed * 3.6;
    this.set('h-speed', `${Math.round(sp)}<small>${OPTS.speedUnit[Settings.speedUnit]}</small>`);
    $('#h-draft').classList.toggle('on', p.draft > 0.3);
    // next buoy indicator
    if (race.useBuoys && race.course.buoys.length && !p.finished) {
      const nb = race.course.buoys[p.nextBuoy % race.course.buoys.length]; let ds = nb.s - p.s; if (ds < 0) ds += T.len;
      const miss = race.mode === 'champ' ? `<span class="miss">${'✖'.repeat(p.misses)}${'·'.repeat(Math.max(0, 5 - p.misses))}</span>` : '';
      this.set('h-buoy', ds < 140 ? `<div class="bi ${nb.red ? 'red' : 'yel'}">${nb.red ? '' : '◀ '}PASS ${nb.red ? 'RIGHT ▶' : 'LEFT'}<small>${Math.round(ds)} m</small></div>${miss}` : miss);
    } else this.set('h-buoy', '');
    let warn = '';
    if (p.offTrack > 0.5) warn = 'RETURN TO COURSE'; else if (p.wrongWay > 1.2) warn = 'WRONG WAY';
    this.set('h-warn', warn);
    if (race.mode === 'tutorial') {
      const st = TUTORIAL_STEPS[race.tut.step];
      const txt = st.text(); if (this.cache.tut !== txt) { this.cache.tut = txt; $('#h-tut').innerHTML = `<small>STEP ${race.tut.step + 1}</small>${txt}`; }
    }
    if (race.mode === 'stunt') this.set('h-score', race.time > race.stuntLimit - 10 && race.state === 'race' ? `<b class="hurry">${Math.ceil(race.stuntLimit - race.time)}</b>` : '');
    // minimap
    const g = this.ctx; g.clearRect(0, 0, 240, 240); g.drawImage(this.mapBg, 0, 0);
    if (race.useBuoys) for (const b of race.course.buoys) { const [x, y] = this.mp(b.x, b.z); g.fillStyle = b.red ? '#f33' : '#fd3'; g.fillRect(x - 2, y - 2, 4, 4); }
    for (const r of race.course.rings) if (!r.hit) { const [x, y] = this.mp(r.x, r.z); g.strokeStyle = r.high ? '#f5d' : '#5e6'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, 3.5, 0, 7); g.stroke(); }
    const dots = [...race.skis].sort((a, b) => a.isPlayer - b.isPlayer);
    for (const s of dots) {
      const [x, y] = this.mp(s.pos.x, s.pos.z); g.fillStyle = '#' + s.rider.color.toString(16).padStart(6, '0'); g.strokeStyle = s.isPlayer ? '#fff' : '#112'; g.lineWidth = s.isPlayer ? 3 : 2;
      g.beginPath(); g.arc(x, y, s.isPlayer ? 7 : 5, 0, 7); g.fill(); g.stroke();
    }
    if (race.ghost && race.ghost.model.root.visible) { const gp = race.ghost.model.root.position; const [x, y] = this.mp(gp.x, gp.z); g.strokeStyle = '#8ff'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, 5, 0, 7); g.stroke(); }
  }
}

    this.camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.3, 6000); this.camera.position.set(0, 8, -20);
    this.hemi = new THREE.HemisphereLight(0xffffff, 0x336677, 1.2); scene.add(this.hemi);
    this.sun = new THREE.DirectionalLight(0xffffff, 2.5); this.sun.castShadow = true; this.sun.shadow.mapSize.set(2048, 2048);
    const sc = this.sun.shadow.camera; sc.left = sc.bottom = -70; sc.right = sc.top = 70; sc.near = 1; sc.far = 400; this.sun.shadow.bias = -0.0008; this.sun.shadow.normalBias = 0.04;
    scene.add(this.sun, this.sun.target);
    scene.add(createSky()); scene.add(createWater());
    scene.fog = new THREE.Fog(0xbfe9ff, 260, 1500);
    this.fx = {
      foam: new Particles(scene, 3000, 0xffffff, 1, 'foam'), spray: new Particles(scene, 2000, 0xe6fbff, 1, 'spray'), spark: new Particles(scene, 600, 0xfff06a, 1, 'spray'),
      splash: (pos, vel, n) => {
        for (let k = 0; k < n; k++) { const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5; this.fx.spray.emit(pos.x, pos.y, pos.z, Math.cos(a) * sp + vel.x * 0.2, 3 + Math.random() * 6, Math.sin(a) * sp + vel.z * 0.2, 1.1, 0.25 + Math.random() * 0.2); }
        for (let k = 0; k < n / 2; k++) { const a = (k / (n / 2)) * Math.PI * 2; this.fx.foam.emit(pos.x + Math.cos(a), 0, pos.z + Math.sin(a), Math.cos(a) * 4, 0, Math.sin(a) * 4, 2.2, 1.2); }
      },
    };
    this.hud = new HUD(); this.hud.show(false); UI.init(); Input.init();
    addEventListener('resize', () => { r.setSize(innerWidth, innerHeight); this.camera.aspect = innerWidth / innerHeight; this.camera.updateProjectionMatrix(); });
    this.menuBackdrop();
    $('#loading').classList.add('hidden');
    const touchOnly = navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
    if (touchOnly && !Input.pad()) this.touchBlock(); else UI.title();
    this.last = performance.now();
    r.setAnimationLoop(() => this.frame());
    window.__foam = { Game, Input, UI, Settings, Audio2 };
  },
  touchBlock() {
    const el = $('#touch'); el.classList.remove('hidden'); this.blocked = true;
    $('#touch-settings').onclick = () => { el.classList.add('hidden'); UI.settings(() => { UI.close(); el.classList.remove('hidden'); }); };
    const unblock = () => { if (!this.blocked) return; this.blocked = false; el.classList.add('hidden'); UI.close(); UI.title(); };
    addEventListener('keydown', unblock, { once: true }); addEventListener('gamepadconnected', unblock, { once: true });
  },
  applyTheme(def) {
    const c = (n) => new THREE.Color(n);
    SkyU.top.value.copy(c(def.sky[0])); SkyU.hor.value.copy(c(def.sky[1])); SkyU.sunCol.value.copy(c(def.sunCol));
    WaterU.sun.value.set(...def.sun).normalize(); WaterU.deep.value.copy(c(def.water[0])); WaterU.shallow.value.copy(c(def.water[1]));
    WaterU.sky.value.copy(c(def.sky[1])); WaterU.foamAmt.value = def.foam;
    this.scene.fog.color.set(def.fog[0]); this.scene.fog.near = def.fog[1]; this.scene.fog.far = def.fog[2];
    this.sun.color.set(def.sunCol); this.sun.intensity = def.sunI; this.hemi.color.set(def.hemi[0]); this.hemi.groundColor.set(def.hemi[1]); this.hemi.intensity = def.hemi[2];
    this.sunDir = new V3(...def.sun).normalize();
  },
  loadCourse(def, opts) {
    if (this.race) { this.race.dispose(); this.race = null; }
    if (this.course) { this.course.dispose(); this.course = null; }
    if (this.world) { this.world.free(); this.world = null; }
    this.world = new RAPIER.World({ x: 0, y: -GRAV, z: 0 }); this.world.timestep = 1 / 60;
    this.applyTheme(def); this.acc = 0;
    this.course = new Course(def, this.scene, this.world, opts);
    return this.course;
  },
  menuBackdrop() {
    this.attract = false;
    const c = RACE_COURSES[this.showcaseIdx++ % RACE_COURSES.length];
    this.race = new Race(this, { mode: 'champ', course: c, attract: true, showcase: true, rider: RIDERS[Math.floor(Math.random() * 4)].id, laps: 99 });
    this.race.countdown = 0.01; this.hud.show(false); this.attractT = 0;
    Audio2.playMusic('title');
  },
  startAttract() {
    UI.close(); this.attract = true; this.attractT = 0;
    const cfg = ATTRACT_PLAYLIST[this.attractIdx++ % ATTRACT_PLAYLIST.length];
    this.race = new Race(this, { ...cfg, attract: true, rider: RIDERS[this.attractIdx % 4].id, laps: 2 });
    this.race.countdown = 1.5;
  },
  nextAttract() { if (this.race && this.race.cfg.showcase) { this.menuBackdrop(); return; } if (this.attract) this.startAttract(); },
  stopAttract() { this.attract = false; this.menuBackdrop(); UI.title(); },
  startRace(cfg) { UI.close(); this.attract = false; this.paused = false; this.lastCfg = cfg; this.race = new Race(this, cfg); this.camSnap = true; },
  restart() { if (this.champ && this.lastCfg.mode === 'champ') this.champRace(); else this.startRace(this.lastCfg); },
  startChampionship(rider) { this.champ = { rider, round: 0, table: RIDERS.map((r) => ({ rider: r, pts: 0, player: r.id === rider })) }; this.champRace(); },
  champRace() { this.startRace({ mode: 'champ', course: RACE_COURSES[this.champ.round], rider: this.champ.rider }); },
  champNext(rows) {
    for (const r of rows) { const e = this.champ.table.find((t) => t.rider === r.rider); if (e) e.pts += r.points; }
    this.champ.round++;
    UI.standings(this.champ.table, this.champ.round, this.champ.round >= RACE_COURSES.length);
  },
  toMenu() { this.champ = null; this.paused = false; this.menuBackdrop(); UI.title(); UI.main(); },
  shake(a) { this.shakeAmt = Math.max(this.shakeAmt, a); },
  inMenu() { return !!(this.race && this.race.cfg.showcase && UI.screen && !this.blocked); },
  frame() {
    const now = performance.now(); const dt = Math.min(0.05, (now - this.last) / 1000); this.last = now;
    Input.poll(dt);
    const race = this.race;
    if (this.attract && (Input.anyPressed || Input.mouseClicked)) { this.stopAttract(); Input.endFrame(); return; }
    if (UI.screen) UI.tick();
    else if (race && !race.attract && !this.paused) {
      if (Input.pressed('options') || Input.pressed('circle')) UI.pause();
      if (Input.pressed('r1')) { Settings.camera = (Settings.camera + 1) % 3; saveSettings(); this.hud.flash(`CAMERA: ${OPTS.camera[Settings.camera].toUpperCase()}`, '', 0.8); }
    }
    if (!this.paused && this.race) {
      const R = this.race;
      this.simT += dt; WaveState.t = this.simT; uWaveT.value = this.simT;
      this.acc += dt; let n = 0;
      while (this.acc >= 1 / 60 && n < 4) { R.physicsStep(1 / 60); this.course.physicsStep(1 / 60); this.world.step(); this.acc -= 1 / 60; n++; }
      if (n === 4) this.acc = 0;
      R.update(dt); this.course.update(dt, this.camera);
      this.fx.foam.update(dt); this.fx.spray.update(dt); this.fx.spark.update(dt);
      if (R.attract && !R.cfg.showcase) { this.attractT += dt; if (this.attractT > 42) this.nextAttract(); }
      if (R.cfg.showcase) { this.attractT += dt; if (this.attractT > 70) this.menuBackdrop(); }
    }
    this.updateCamera(dt);
    if (this.inMenu() && now - Input.lastActivity > 10000) this.startAttract();
    this.renderer.render(this.scene, this.camera);
    Input.endFrame();
  },
  updateCamera(dt) {
    const R = this.race; if (!R) return;
    let target = R.player;
    if (R.cfg.showcase) { target = R.skis.reduce((a, b) => (b.progress > a.progress ? b : a)); }
    const cam = this.camera, p = target.pos;
    const yaw = Math.atan2(target.fwd.x, target.fwd.z);
    this.camYaw = this.camYaw == null || this.camSnap ? yaw : this.camYaw + wrapAngle(yaw - this.camYaw) * Math.min(1, dt * 4);
    let dist = [9.5, 6.5, 13][Settings.camera], h = [3.8, 2.5, 1.6][Settings.camera], fov = [62, 66, 52][Settings.camera];
    let cy = this.camYaw;
    if (R.cfg.showcase) { cy = this.simT * 0.15; dist = 18; h = 6; fov = 55; }
    else if (R.state === 'countdown') { const k = clamp(R.countdown / 3.6, 0, 1); cy = this.camYaw + Math.PI * k * k; dist = 9.5 + k * 6; h = 3.8 + k * 3; }
    else if (R.attract && Math.floor(this.attractT / 9) % 3 === 2) { cy = this.camYaw + Math.PI * 0.6; dist = 11; h = 2.2; }
    const want = new V3(p.x - Math.sin(cy) * dist, p.y + h, p.z - Math.cos(cy) * dist);
    want.y = Math.max(want.y, waveHeight(want.x, want.z) + 1.2);
    if (this.camSnap) { cam.position.copy(want); this.camSnap = false; } else {
      const k = 1 - Math.exp(-dt * 6); cam.position.lerp(want, k);
    }
    cam.position.y = Math.max(cam.position.y, waveHeight(cam.position.x, cam.position.z) + 1);
    const look = new V3(p.x + target.fwd.x * 5, p.y + 1.2, p.z + target.fwd.z * 5);
    if (this.shakeAmt > 0) { look.x += (Math.random() - 0.5) * this.shakeAmt; look.y += (Math.random() - 0.5) * this.shakeAmt; this.shakeAmt = Math.max(0, this.shakeAmt - dt * 2.5); }
    cam.lookAt(look);
    const fv = fov + clamp(target.speed - 10, 0, 20) * 0.45 + (target.landBoost > 0 ? 6 : 0);
    cam.fov = damp(cam.fov, fv, 4, dt); cam.updateProjectionMatrix();
    // sun follows the action so shadows stay crisp
    const sd = this.sunDir || new V3(0.4, 0.8, 0.3);
    this.sun.position.set(p.x + sd.x * 150, p.y + sd.y * 150, p.z + sd.z * 150); this.sun.target.position.copy(p);
  },
};
Game.boot().catch((e) => { console.error(e); const f = $('#fatal'); f.innerHTML = `<div><h1>${TITLE}</h1><p>Failed to start: ${String(e && e.message || e)}</p></div>`; f.classList.remove('hidden'); });

</script>
