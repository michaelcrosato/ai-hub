    }
    if (b.dead) {
      bossMesh.rotation.z += finishTimer * 0.06;
      bossMesh.position.y -= 5 - finishTimer;
      bossMesh.scale.setScalar(Math.max(0.7, finishTimer / 5));
      if (Math.random() < dt * 14) world.explosion(bossMesh.position.clone().add(new THREE2.Vector3((Math.random() - 0.5) * 22, (Math.random() - 0.5) * 10, 0)), 16761212, 30);
    }
  }
  if (beamMesh) {
    beamMesh.visible = !!sim.laser;
    if (sim.laser && sim.boss) {
      const end = new THREE2.Vector3(sim.laser.x, sim.laser.y, 9), start = new THREE2.Vector3(sim.boss.x, sim.boss.y, sim.boss.z + 2), delta = end.clone().sub(start);
      beamMesh.position.copy(start).addScaledVector(delta, 0.5);
      beamMesh.quaternion.setFromUnitVectors(new THREE2.Vector3(0, 1, 0), delta.clone().normalize());
      const width = sim.laser.charge > 0 ? 0.09 : 3.2;
      beamMesh.scale.set(width, delta.length(), width);
      beamMesh.material.opacity = sim.laser.charge > 0 ? 0.3 : 0.8;
    }
  }
  supportVisual = Math.max(0, supportVisual - dt);
  wingMeshes.forEach((wing, i) => {
    wing.visible = sim.wingHealth > 0 && sim.status !== "defeat";
    const sign = i === 0 ? -1 : 1;
    wing.position.set(p.x + sign * (supportVisual > 0 ? 7 : 13), p.y + 2 + Math.sin(time + i) * 0.6, supportVisual > 0 ? -12 : 4);
    wing.rotation.z = shipRoll * 0.5;
    world.animateShip(wing, time, 0.65);
  });
  const camX = p.x * 0.3, camY = 3 + p.y * 0.22;
  camera.position.lerp(new THREE2.Vector3(camX, camY, sim.lastBoost ? 32 : 28), 1 - Math.exp(-3 * dt));
  if (!settings.reducedMotion && shake > 0) {
    camera.position.x += (Math.random() - 0.5) * shake;
    camera.position.y += (Math.random() - 0.5) * shake;
  }
  camera.lookAt(p.x * 0.34, p.y * 0.28, -55);
  camera.fov = THREE2.MathUtils.lerp(camera.fov, sim.lastBoost ? 66 : 58, dt * 3);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  world.update(dt, { time, speed: sim.status === "playing" ? sim.speed : 25, stage: sim.stage, playerX: p.x, playerY: p.y, boost: sim.lastBoost, title: false });
  renderTargets();
  ui.updateHUD({ shield: p.health, score: sim.score, combo: sim.combo, mission: sim.practice ? "FLIGHT SCHOOL" : MISSION.stages[sim.stage].name, objective: sim.practice ? "Try every control \xB7 shields protected" : MISSION.stages[sim.stage].objective, progress: sim.practice ? sim.time / 70 : sim.stage < 2 ? sim.time / 164 : 1, speed: sim.speed, boost: sim.energy / 100, lock: sim.lockTargets.length / 3, bombs: sim.bombs, support: sim.support / 100, boss: sim.boss && !sim.boss.dead ? { name: "SUN EATER / " + (sim.bossPhase === 0 ? "SHIELD PYLONS" : sim.bossPhase === 1 ? "EXPOSED HEART" : "OVERLOAD"), health: sim.boss.health / sim.boss.maxHealth } : null, demo: mode === "attract", checkpoint: MISSION.stages[sim.stage].checkpoint, wingHealth: sim.wingHealth, weapon: sim.weapon, rings: sim.rings, route: sim.route });
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(1e-3, (now - last) / 1e3));
  last = now;
  if (pausedByVisibility) return;
  time += dt;
  const control = input.poll(dt);
  document.body.classList.toggle("gamepad-present", control.gamepad);
  if (control.gamepad && !gamepadWasConnected) ui.toast("CONTROLLER CONNECTED", "Left stick to navigate \xB7 \xD7 to select");
  gamepadWasConnected = control.gamepad;
  if (attractExit) {
    attractExit = false;
    returnTitle();
    return;
  }
  if (mode === "title" && ui.screen === "title") {
    idle = control.any ? 0 : idle + dt;
    if (idle >= 10 && ready) startFlight(true);
  }
  if (["title", "paused", "settings", "about", "school", "results", "error"].includes(mode)) {
    if (control.navY) ui.navigate(control.navY > 0 ? "down" : "up");
    if (control.navX) ui.navigate(control.navX > 0 ? "right" : "left");
    if (control.confirm) ui.activate();
    if (control.back) ui.back();
  } else if (mode === "playing" && control.pause) pause();
  const flying = mode === "playing" || mode === "attract";
  overlays.hidden = !flying;
  if (flying && sim) {
    if (sim.status === "playing") {
      sim.update(dt, control);
      consumeEvents();
    } else if (finishTimer > 0) {
      finishTimer -= dt;
      if (finishTimer <= 0) {
        if (mode === "attract") {
          startFlight(true);
          return;
        } else {
          mode = "results";
          ui.show("results", { ...sim.stats(), highScore, bestScore: highScore });
          cinema.style.opacity = 0;
          overlays.hidden = true;
          input.clear();
        }
      }
    }
    updateVisuals(dt);
  } else if (world && ready && (!sim || mode === "title" || mode === "about" || mode === "school")) {
    wingMeshes.forEach((w) => w.visible = false);
    world.player.visible = true;
    world.player.position.set(8, 1.4 + Math.sin(time * 0.75) * 0.5, -4);
    world.player.scale.setScalar(1.65);
    world.player.rotation.set(-0.09, Math.sin(time * 0.2) * 0.09 - 0.38, -0.2 + Math.sin(time * 0.4) * 0.045);
    world.animateShip(world.player, time, 1.2);
    camera.position.lerp(new THREE2.Vector3(-1, 4, 29), 1 - Math.exp(-4 * dt));
    camera.lookAt(1, 0, -45);
    camera.fov = 58;
    camera.updateProjectionMatrix();
    world.update(dt, { time, speed: 20, stage: 0, playerX: 0, playerY: 0, boost: false, title: true });
  }
  stageFade = Math.max(0, stageFade - dt * 1.6);
  stageWash.style.opacity = settings.reducedMotion ? "0" : Math.min(0.22, stageFade * 0.22);
  shake = Math.max(0, shake - dt * 2);
  damageWash.style.opacity = Math.max(0, Number(damageWash.style.opacity || 0) - dt * 2);
  ui.idle = idle;
  ui.update(dt);
  audio.update(dt, { mode: mode === "playing" ? "playing" : mode === "paused" || mode === "settings" ? "pause" : mode === "attract" ? "title" : mode, stage: sim?.stage || 0, speed: (sim?.speed || 20) / 42, boost: sim?.lastBoost || false, danger: sim ? 1 - sim.player.health / 100 : 0 });
  if (renderer && ready) {
    try {
      renderer.render(scene, camera);
    } catch (error) {
      ready = false;
      mode = "error";
      ui.setError(`The WebGPU renderer stopped: ${error.message}`);
      console.error(error);
    }
  }
}
requestAnimationFrame(frame);
async function boot() {
  try {
    if (!navigator.gpu) throw new Error("WebGPU is unavailable. Open this game in a WebGPU-capable browser over HTTPS or localhost.");
    ui.setLoading("Connecting to WebGPU\u2026");
    renderer = new THREE2.WebGPURenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer._getFallback = null;
    await renderer.init();
    if (!renderer.backend.isWebGPUBackend) throw new Error("A WebGPU device is required. No fallback is enabled.");
    renderer.setPixelRatio(devicePixelRatio || 1);
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE2.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE2.PCFSoftShadowMap;
    renderer.domElement.id = "game-canvas";
    renderer.domElement.style.cssText = "position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block";
    document.body.prepend(renderer.domElement);
    ui.setLoading("Calibrating flight physics\u2026");
    await RAPIER.init();
    scene = new THREE2.Scene();
    camera = new THREE2.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 2600);
    camera.position.set(-1, 4, 29);
    camera.lookAt(1, 0, -45);
    world = new WorldView(scene);
    beamMesh = new THREE2.Mesh(new THREE2.CylinderGeometry(1, 1, 1, 16), new THREE2.MeshBasicMaterial({ color: 16742749, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE2.AdditiveBlending }));
    beamMesh.visible = false;
    scene.add(beamMesh);
    for (let i = 0; i < 2; i++) {
      const wing = world.createEnemy("scout");
      wing.rotation.y = Math.PI;
      wing.scale.setScalar(0.65);
      wing.visible = false;
      scene.add(wing);
      wingMeshes.push(wing);
    }
    ready = true;
    mode = "title";
    ui.show("title", { highScore });
    document.querySelector(".boot-cover")?.remove();
    if (renderer.backend.device?.lost) renderer.backend.device.lost.then((info) => {
      if (info.reason !== "destroyed") {
        ready = false;
        mode = "error";
        ui.setError("The WebGPU device was lost. Reload the page to reconnect.");
      }
    });
  } catch (error) {
    console.error(error);
    mode = "error";
    ui.setError(error.message);
    document.querySelector(".boot-cover")?.remove();
  }
}
boot();
</script>
