// ---- 11-control.js ----
// ============================================================================
// 11-control.js — the commander's hands: cursor picking, context commands,
// box select, control groups, build placement, sell/repair/superweapon modes,
// camera pan/zoom/edge-scroll.
// ============================================================================
const Control = (() => {
  const ctl = {
    mode: null, placeType: null, ghost: null, ghostOK: false, hover: null, hoverLabel: '', cursorKind: 'select', cursorLabel: '',
    box: null, press: null, markers: [], ground: null, showCursor: true, lastScreenTap: -9, lastClick: { t: -9, e: null }, l1dir: null,
  };
  const ghostMats = { ok: null, bad: null };
  function clampCam() {
    const W = Game.G.map.N * TILE, c = Gfx.cam;
    c.x = Math.max(4, Math.min(W - 4, c.x)); c.z = Math.max(8, Math.min(W + 6, c.z));
  }
  function updateCamera(dt, allowKeys = true) {
    const c = Gfx.cam, sp = (24 + c.dist * 0.9) * Settings.get('panSpeed');
    let { x, y } = Input.pan();
    if (!allowKeys) { const a = Input.axes(); x = a[2]; y = a[3]; }
    // edge scroll with the cursor (mouse or virtual)
    const m = 14, cx = Input.cursor.x, cy = Input.cursor.y;
    if (document.hasFocus() && !UI.trayOpen()) {
      if (cx <= m) x -= 1; else if (cx >= innerWidth - m - 1) x += 1;
      if (cy <= m) y -= 1; else if (cy >= innerHeight - m - 1) y += 1;
    }
    c.x += Math.max(-1, Math.min(1, x)) * sp * dt; c.z += Math.max(-1, Math.min(1, y)) * sp * dt;
    const z = Input.zoom();
    if (z) c.targetDist = Math.max(c.minDist, Math.min(c.maxDist, c.targetDist - z * dt * 40));
    clampCam();
  }
  function centerOn(x, z) { Gfx.cam.x = x; Gfx.cam.z = z + 2; clampCam(); }

  // ---------- picking ----------
  function pick(sx, sy) {
    const G = Game.G; let best = null, bd = 1e9;
    for (const u of G.units) {
      if (!u.alive || !u.mesh.visible) continue;
      const p = Gfx.project(u.x, (u.y || 0) + u.model.h * 0.5, u.z); if (p.behind) continue;
      const rad = (u.def.kind === 'veh' ? 30 : 20) * 34 / Gfx.cam.dist;
      const d = Math.hypot(p.x - sx, p.y - sy);
      if (d < rad && d < bd) { bd = d; best = u; }
    }
    if (best) return best;
    const g = Gfx.screenToGround(sx, sy);
    for (const s of G.structures) {
      if (!s.alive || !s.mesh.visible) continue;
      if (g && g.x > s.tx * TILE - 0.3 && g.x < (s.tx + s.w) * TILE + 0.3 && g.z > s.tz * TILE - 0.3 && g.z < (s.tz + s.h) * TILE + 0.3) return s;
      const p = Gfx.project(s.x, s.model.h * 0.6, s.z);
      if (Math.hypot(p.x - sx, p.y - sy) < 26 * 34 / Gfx.cam.dist) return s;
    }
    return null;
  }
  function onOre(g) { const M = Game.G.map, t = M.toTile(g.x, g.z); return M.inb(t.tx, t.tz) && M.ore[t.tz * M.N + t.tx] > 0; }

  // what pressing CONFIRM would do right now
  function context(h, g) {
    const sU = Selection.units(), sS = Selection.structure();
    if (ctl.mode === 'place') return { kind: ctl.ghostOK ? 'place' : 'nope', label: ctl.ghostOK ? 'Place' : 'Blocked' };
    if (ctl.mode === 'super') return { kind: 'super', label: 'Fire' };
    if (ctl.mode === 'sell') return h && h.isStructure && h.owner === 0 ? { kind: 'sell', label: 'Sell $' + Math.floor(h.def.cost * ECON.sellRefund * h.hp / h.maxHp) } : { kind: 'nope', label: 'Sell' };
    if (ctl.mode === 'repair') return h && h.isStructure && h.owner === 0 ? { kind: 'repair', label: h.repairing ? 'Stop repair' : 'Repair' } : { kind: 'nope', label: 'Repair' };
    if (UI.minimapHit(Input.cursor.x, Input.cursor.y)) return { kind: 'select', label: 'Jump' };
    if (sU.length) {
      if (h && h.owner !== 0) {
        if (h.isStructure && sU.some((u) => u.def.engineer) && h.owner !== OWNER_NEUTRAL) return { kind: 'capture', label: 'Capture' };
        if (sU.some((u) => u.def.weapon) && (Game.isEnemy(0, h.owner) || h.owner === OWNER_NEUTRAL)) return { kind: 'attack', label: h.owner === OWNER_NEUTRAL ? 'Force attack' : 'Attack' };
      }
      if (h && h.owner === 0 && h.isStructure) {
        if (sU.some((u) => u.def.engineer) && h.hp < h.maxHp) return { kind: 'repair', label: 'Repair' };
        if (h.def.repairs && sU.some((u) => u.def.kind === 'veh')) return { kind: 'move', label: 'Repair bay' };
        if (h.type === 'refinery' && sU.some((u) => u.def.harvester)) return { kind: 'harvest', label: 'Unload' };
      }
      if (h && h.owner === 0 && h.isUnit && !Selection.has(h)) return { kind: 'select', label: 'Select' };
      if (g && sU.some((u) => u.def.harvester) && onOre(g)) return { kind: 'harvest', label: 'Harvest' };
      if (g && sU.length === 1 && sU[0].def.deploys && h === sU[0]) return { kind: 'deploy', label: 'Deploy' };
      return { kind: 'move', label: 'Move' };
    }
    if (sS && sS.owner === 0 && sS.def.produces && sS.def.produces !== 'structure' && !h) return { kind: 'rally', label: 'Rally point' };
    if (h) return { kind: 'select', label: h.owner === 0 ? '' : h.isStructure ? Game.structName(h.type, h.owner) : h.def.name };
    return { kind: 'select', label: '' };
  }

  function issue(h, g) {
    const sU = Selection.units();
    if (!g) return;
    if (h && h.owner !== 0) {
      if (h.isStructure && h.owner !== OWNER_NEUTRAL && sU.some((u) => u.def.engineer)) { Game.orderCapture(sU.filter((u) => u.def.engineer), h); const rest = sU.filter((u) => !u.def.engineer); if (rest.length) Game.orderAttack(rest, h, true); mark(h.x, h.z, '#ffd34a'); return; }
      if (Game.isEnemy(0, h.owner) || h.owner === OWNER_NEUTRAL) { Game.orderAttack(sU, h); mark(h.x, h.z, '#ff4a3a'); return; }
    }
    if (h && h.owner === 0 && h.isStructure) {
      const eng = sU.filter((u) => u.def.engineer);
      if (eng.length && h.hp < h.maxHp) { Game.orderCapture(eng, h); mark(h.x, h.z, '#60ff60'); return; }
      if (h.def.repairs) { const v = sU.filter((u) => u.def.kind === 'veh'); if (v.length) { Game.orderRepairBay(v, h); mark(h.x, h.z, '#60ff60'); return; } }
      if (h.type === 'refinery') { const hv = sU.filter((u) => u.def.harvester); if (hv.length) { hv.forEach((u) => { u.order = { type: 'harvest' }; u.hstate = 'return'; u.path = null; }); Game.ack(hv[0], 'move'); mark(h.x, h.z, '#9cff3a'); return; } }
    }
    const harv = sU.filter((u) => u.def.harvester);
    if (harv.length && onOre(g)) { Game.orderHarvest(harv, g.x, g.z); const rest = sU.filter((u) => !u.def.harvester); if (rest.length) Game.orderMove(rest, g.x, g.z, false, true); mark(g.x, g.z, '#9cff3a'); return; }
    Game.orderMove(sU, g.x, g.z, false); mark(g.x, g.z, '#7dff7d');
  }
  function mark(x, z, color) { ctl.markers.push({ x, z, color, t: 0 }); }

  function selectAt(h) {
    const now = performance.now();
    if (!h) { if (Selection.list.length) Sound.sfx('ui_back'); Selection.clear(); return; }
    // double press: everything of that type on screen
    if (ctl.lastClick.e === h && now - ctl.lastClick.t < 400 && h.owner === 0 && h.isUnit) {
      Selection.set(onScreenUnits().filter((u) => u.type === h.type));
    } else Selection.set([h]);
    ctl.lastClick = { t: now, e: h };
    Sound.sfx('ui_move');
    if (h.isUnit && h.owner === 0) Game.ack(h, 'select');
  }
  function onScreenUnits() {
    return Game.G.units.filter((u) => {
      if (!u.alive || u.owner !== 0) return false;
      const p = Gfx.project(u.x, 0.5, u.z);
      return !p.behind && p.x > 0 && p.y > 0 && p.x < innerWidth && p.y < innerHeight;
    });
  }
  function boxSelect(b) {
    const x0 = Math.min(b.x0, b.x1), x1 = Math.max(b.x0, b.x1), y0 = Math.min(b.y0, b.y1), y1 = Math.max(b.y0, b.y1);
    const sel = Game.G.units.filter((u) => {
      if (!u.alive || u.owner !== 0) return false;
      const p = Gfx.project(u.x, (u.y || 0) + 0.6, u.z);
      return p.x >= x0 && p.x <= x1 && p.y >= y0 && p.y <= y1;
    });
    const combat = sel.filter((u) => !u.def.harvester);
    Selection.set(combat.length ? combat : sel);
    if (Selection.list.length) { Sound.sfx('ui_move'); Game.ack(Selection.list[0], 'select'); }
  }

  // ---------- modes ----------
  function setMode(m, type) {
    if (ctl.ghost) { Gfx.scene.remove(ctl.ghost); ctl.ghost = null; }
    ctl.mode = m; ctl.placeType = type || null;
    if (m === 'place') {
      ctl.ghost = Models.ghost(type, Game.P(0).faction);
      if (!ghostMats.ok) { ghostMats.ok = Gfx.basic(0x80ff9a, { transparent: true, opacity: 0.45 }); ghostMats.bad = Gfx.basic(0xff5a4a, { transparent: true, opacity: 0.45 }); }
      Gfx.scene.add(ctl.ghost);
      UI.toast('Placing ' + Game.structName(type, 0) + ': {CONFIRM} place, {CANCEL} cancel');
    }
    if (m === 'sell') UI.toast('Sell mode: {CONFIRM} on a structure to sell it');
    if (m === 'repair') UI.toast('Repair mode: {CONFIRM} on a structure to repair it');
    if (m === 'super') UI.toast('Choose a target: {CONFIRM} to fire');
  }
  function updateGhost(g) {
    if (!ctl.ghost || !g) return;
    const [w, h] = STRUCTURES[ctl.placeType].size;
    const tx = Math.round(g.x / TILE - w / 2), tz = Math.round(g.z / TILE - h / 2);
    ctl.ghostTile = { tx, tz };
    ctl.ghostOK = Game.footprintOK(0, ctl.placeType, tx, tz);
    ctl.ghost.position.set((tx + w / 2) * TILE, 0.02, (tz + h / 2) * TILE);
    const mat = ctl.ghostOK ? ghostMats.ok : ghostMats.bad;
    ctl.ghost.traverse((o) => { if (o.isMesh && !o.userData.isOutline) o.material = mat; });
  }

  // ---------- frame ----------
  function update(dt, onPause) {
    const G = Game.G, p = Game.P(0);
    ctl.showCursor = true;
    if (Input.hit('menu') && !UI.trayOpen()) { if (ctl.mode) { setMode(null); Sound.sfx('ui_back'); } else onPause(); return; }
    if (UI.trayOpen()) { updateCamera(dt, false); UI.updateTray(); ctl.box = null; ctl.press = null; ctl.cursorKind = 'select'; ctl.cursorLabel = ''; ctl.hover = null; return; }
    updateCamera(dt);
    const cx = Input.cursor.x, cy = Input.cursor.y;
    const g = Gfx.screenToGround(cx, cy);
    ctl.ground = g;
    const overHud = document.elementFromPoint(cx, cy);
    const onUI = overHud && overHud.closest && overHud.closest('#selPanel,#prompts,#topbar,#queueStrip,#intel,#hint');
    ctl.hover = onUI ? null : pick(cx, cy);
    if (ctl.mode === 'place') updateGhost(g);
    const c = context(ctl.hover, g);
    ctl.cursorKind = c.kind; ctl.cursorLabel = c.label; ctl.hoverLabel = c.label;

    if (Input.hit('intel')) UI.toggleIntel();
    if (Input.hit('build')) { setMode(null); UI.openTray(p.queues.structure.ready ? 0 : undefined); return; }
    if (Input.hit('super') && !Input.down('groupMod')) {
      if (p.superReady) setMode('super');
      else { Sound.sfx('ui_error'); const SW = SUPERWEAPONS[p.faction] || SUPERWEAPONS.usc; Game.eva('swnr', p.hasSuper ? `${SW.name} charging: ${Math.floor(p.superCharge / SW.charge * 100)}%.` : `${SW.name} requires an ${Game.structName('uplink', 0)}.`, { cooldown: 1.5 }); }
    }
    if (Input.hit('repair') && !Input.down('groupMod')) { const s = Selection.structure(); if (s && s.owner === 0) Game.toggleRepair(s); else setMode(ctl.mode === 'repair' ? null : 'repair'); }
    if (Input.hit('sell') && !Input.down('groupMod')) { const s = Selection.structure(); if (s && s.owner === 0) { Game.sellStructure(s); Selection.clear(); } else setMode(ctl.mode === 'sell' ? null : 'sell'); }
    if (Input.hit('stop') && !Input.down('groupMod')) {
      const sU = Selection.units();
      const mcv = sU.filter((u) => u.def.deploys);
      if (mcv.length) mcv.forEach((u) => Game.orderDeploy(u));
      else if (sU.length) { Game.orderStop(sU); Sound.sfx('ui_back'); }
    }
    if (Input.hit('center')) { const L = Selection.list; if (L.length) { const ax = L.reduce((a, e) => a + e.x, 0) / L.length, az = L.reduce((a, e) => a + e.z, 0) / L.length; centerOn(ax, az); } }
    if (Input.hit('alert') && G.alertPos) centerOn(G.alertPos.x, G.alertPos.z);
    if (Input.hit('screen') && !UI.trayOpen()) {
      const now = performance.now();
      const all = now - ctl.lastScreenTap < 400;
      ctl.lastScreenTap = now;
      const pool = all ? G.units.filter((u) => u.alive && u.owner === 0) : onScreenUnits();
      Selection.set(pool.filter((u) => u.def.weapon && !u.def.harvester));
      if (Selection.list.length) { Sound.sfx('ui_move'); Game.ack(Selection.list[0], 'select'); UI.toast(all ? 'All combat units selected' : 'Combat units on screen selected'); }
    }
    // control groups: L1 + d-pad (tap select, hold assign) or 1-4 / Ctrl+1-4
    const gk = Input.groupKey;
    if (gk) groupAction(gk.n, gk.assign);
    if (Input.down('groupMod')) {
      for (let i = 0; i < 4; i++) if (Input.padDpadHit(i)) ctl.l1dir = { i, t: 0, done: false };
    }
    if (ctl.l1dir) {
      const btn = 12 + ctl.l1dir.i;
      if (Input.padDown(btn)) { ctl.l1dir.t += dt; if (ctl.l1dir.t > 0.6 && !ctl.l1dir.done) { ctl.l1dir.done = true; groupAction([0, 2, 3, 1][ctl.l1dir.i], true); } }
      else { if (!ctl.l1dir.done) groupAction([0, 2, 3, 1][ctl.l1dir.i], false); ctl.l1dir = null; }
    }
    if (Input.hit('amove') && Selection.units().length && g) {
      const sU = Selection.units();
      if (ctl.hover && Game.isEnemy(0, ctl.hover.owner)) Game.orderAttack(sU, ctl.hover); else Game.orderMove(sU, g.x, g.z, true);
      mark(g.x, g.z, '#ff6a5a');
    }
    if (Input.hit('cancel')) {
      if (ctl.mode) { setMode(null); Sound.sfx('ui_back'); }
      else if (Selection.list.length) { Selection.clear(); Sound.sfx('ui_back'); }
    }
    // modern mouse: right click commands
    if (Input.hit('mouseCmd')) {
      if (ctl.mode) setMode(null);
      else if (Selection.units().length) issue(ctl.hover, g);
      else if (Selection.structure() && g) setRally(g);
    }
    // confirm: press / drag / release
    if (Input.hit('confirm') && !onUI) ctl.press = { x: cx, y: cy, t: 0 };
    if (ctl.press) {
      ctl.press.t += dt;
      if (Input.down('confirm')) {
        if (!ctl.mode && (Math.hypot(cx - ctl.press.x, cy - ctl.press.y) > 12 || (Input.device === 'pad' && ctl.press.t > 0.35))) ctl.box = { x0: ctl.press.x, y0: ctl.press.y, x1: cx, y1: cy };
        if (ctl.box) { ctl.box.x1 = cx; ctl.box.y1 = cy; }
      } else {
        if (ctl.box && Math.hypot(ctl.box.x1 - ctl.box.x0, ctl.box.y1 - ctl.box.y0) > 12) boxSelect(ctl.box);
        else click(ctl.hover, g);
        ctl.box = null; ctl.press = null;
      }
    }
  }
  function setRally(g) {
    const s = Selection.structure();
    s.rally = { x: g.x, z: g.z }; mark(g.x, g.z, '#7dff7d'); Sound.sfx('ui_ok');
    if (s.type === 'barracks' || s.type === 'factory') { Game.G.structures.forEach((o) => { if (o.owner === 0 && o.type === s.type) o.primary = o === s; }); }
  }
  function click(h, g) {
    const p = Game.P(0);
    const mm = UI.minimapHit(Input.cursor.x, Input.cursor.y);
    if (mm && !ctl.mode) { centerOn(mm.x, mm.z); return; }
    if (ctl.mode === 'place') {
      if (!ctl.ghostTile) return;
      const s = Game.placeStructure(0, ctl.placeType, ctl.ghostTile.tx, ctl.ghostTile.tz);
      if (s) setMode(null);
      return;
    }
    if (ctl.mode === 'super') { if (g && Game.fireSuper(0, g.x, g.z)) setMode(null); return; }
    if (ctl.mode === 'sell') { if (h && h.isStructure && h.owner === 0) Game.sellStructure(h); else Sound.sfx('ui_error'); return; }
    if (ctl.mode === 'repair') { if (h && h.isStructure && h.owner === 0) Game.toggleRepair(h); else Sound.sfx('ui_error'); return; }
    const sU = Selection.units();
    const commandAllowed = Input.device === 'pad' || !Settings.get('rightClickCommand');
    if (sU.length && commandAllowed) {
      if (h && h.owner === 0 && h.isUnit && !Selection.has(h)) { selectAt(h); return; }
      if (h && h.owner === 0 && h.isUnit && Selection.has(h) && sU.length === 1) { if (h.def.deploys) { Game.orderDeploy(h); return; } selectAt(h); return; }
      issue(h, g); return;
    }
    const sS = Selection.structure();
    if (sS && sS.owner === 0 && sS.def.produces && sS.def.produces !== 'structure' && !h && g) { setRally(g); return; }
    selectAt(h);
  }
  function groupAction(n, assign) {
    const p = Game.P(0);
    if (assign) {
      const sel = Selection.units(); if (!sel.length) return;
      p.groups.forEach((gr, i) => { p.groups[i] = gr.filter((u) => !sel.includes(u)); });
      p.groups[n] = [...sel]; UI.toast(`Group ${n + 1} assigned (${sel.length})`); Sound.sfx('ui_ok');
    } else {
      const gr = p.groups[n].filter((u) => u.alive);
      if (!gr.length) { Sound.sfx('ui_error'); return; }
      const already = gr.every((u) => Selection.has(u)) && Selection.list.length === gr.length;
      Selection.set(gr); Sound.sfx('ui_move');
      if (already) { const ax = gr.reduce((a, e) => a + e.x, 0) / gr.length, az = gr.reduce((a, e) => a + e.z, 0) / gr.length; centerOn(ax, az); }
    }
  }
  UI.onPlace = (type) => setMode('place', type);
  function reset() { setMode(null); ctl.box = null; ctl.press = null; ctl.markers.length = 0; Selection.clear(); }
  return { ctl, update, reset, centerOn, updateCamera, setMode };
})();

// ============================================================================
// 12-main.js — boot, state machine (title / attract / briefing / play /
// pause / results / hub session), the frame loop and the About screen.

const ABOUT_HTML = document.getElementById('about-src').innerHTML;

const App = (() => {

  const progress = (() => { try { return JSON.parse(localStorage.getItem('cnc-conker-progress') || '{}'); } catch (e) { return {}; } })();
  const saveProgress = () => { try { localStorage.setItem('cnc-conker-progress', JSON.stringify(progress)); } catch (e) {} };
  const skirmishOpts = { faction: 'usc', difficulty: 'normal', size: 'medium', credits: 10000, seedMode: 'random', seed: 1 };

  function applyAudioSettings() { Sound.setVolumes({ master: Settings.get('master'), music: Settings.get('music'), sfx: Settings.get('sfx'), voice: Settings.get('voice') }); }

  // ---------- menus ----------
  const logo = () => `<div class="logo"><div class="l1">COMMANDER</div><div class="amp">&amp;</div><div class="l2">CONKER</div><div class="tag">TACTICAL CONKERIUM WARFARE</div></div>`;
  function titleMenu() {
    S.state = 'title'; S.idle = 0;
    UI.showHUD(false);
    Sound.music('menu');
    UI.closeMenus();
    UI.openMenu({
      cls: 'title', header: logo(), escBack: false,
      items: [
        { label: 'Campaign', action: campaignMenu },
        { label: 'Skirmish', action: skirmishMenu },
        { label: 'Settings', action: settingsMenu },
        { label: 'How to Play', action: howToMenu },
        { label: 'About & Credits', action: aboutMenu },
      ],
      body: `<p class="hintline">${UI.glyphs('{NAV} move · {CONFIRM} select')} &nbsp;·&nbsp; Idle for 10 s to watch a demo battle</p>`,
      footer: false,
    }, false);
  }
  function campaignMenu() {
    UI.openMenu({
      title: 'Campaign — United Shield Command',
      body: `<p class="dim">Three operations in the Varno Valley. Each one teaches new systems.</p>`,
      items: Missions.CAMPAIGN.map((M, i) => ({ label: `${i + 1}. ${M.title}${progress[M.id] ? '  ✔' : ''}`, note: M.subtitle, action: () => startBriefing(i) })).concat([{ label: 'Back', action: UI.backMenu }]),
    });
  }
  function skirmishMenu() {
    const o = skirmishOpts;
    UI.openMenu({
      title: 'Skirmish',
      body: `<p class="dim">You versus the computer commander on a generated battlefield. Destroy every enemy structure.</p>`,
      items: [
        { type: 'select', label: 'Your faction', get: () => o.faction, set: (v) => (o.faction = v), options: [{ v: 'usc', label: 'United Shield Command' }, { v: 'husk', label: 'Brotherhood of the Husk' }] },
        { type: 'select', label: 'Enemy commander', get: () => o.difficulty, set: (v) => (o.difficulty = v), options: [{ v: 'easy', label: 'Easy' }, { v: 'normal', label: 'Normal' }, { v: 'hard', label: 'Hard' }] },
        { type: 'select', label: 'Battlefield', get: () => o.size, set: (v) => (o.size = v), options: [{ v: 'small', label: 'Small' }, { v: 'medium', label: 'Medium' }, { v: 'large', label: 'Large' }] },
        { type: 'select', label: 'Starting credits', get: () => o.credits, set: (v) => (o.credits = v), options: [{ v: 5000, label: '$5,000' }, { v: 10000, label: '$10,000' }, { v: 20000, label: '$20,000' }] },
        { type: 'select', label: 'Map seed', get: () => o.seedMode, set: (v) => (o.seedMode = v), options: [{ v: 'random', label: 'Random' }, { v: 'valley', label: 'Varno Valley (fixed)' }, { v: 'delta', label: 'Delta Crossing (fixed)' }] },
        { label: 'Start Battle', action: () => startSkirmish() },
        { label: 'Back', action: UI.backMenu },
      ],
    });
  }
  function settingsMenu() {
    const sl = (label, key, min, max, step, fmt) => ({ type: 'slider', label, min, max, step, fmt, get: () => Settings.get(key), set: (v) => { Settings.set(key, v); applyAudioSettings(); } });
    const tg = (label, key, after) => ({ type: 'toggle', label, get: () => Settings.get(key), set: (v) => { Settings.set(key, v); after && after(v); } });
    UI.openMenu({
      title: 'Settings', cls: 'settings',
      items: [
        sl('Master volume', 'master', 0, 1, 0.1), sl('Music', 'music', 0, 1, 0.1), sl('Sound effects', 'sfx', 0, 1, 0.1), sl('Voices', 'voice', 0, 1, 0.1),
        tg('Invert horizontal axis (pad)', 'invertX'), tg('Invert vertical axis (pad)', 'invertY'),
        sl('Cursor speed', 'cursorSpeed', 0.4, 2, 0.1, (v) => v.toFixed(1) + '×'), sl('Camera pan speed', 'panSpeed', 0.4, 2, 0.1, (v) => v.toFixed(1) + '×'),
        { type: 'select', label: 'Game speed', get: () => Settings.get('gameSpeed'), set: (v) => Settings.set('gameSpeed', v), options: [{ v: 0.75, label: 'Slow' }, { v: 1, label: 'Normal' }, { v: 1.25, label: 'Fast' }, { v: 1.5, label: 'Fastest' }] },
        tg('Right-click commands (mouse)', 'rightClickCommand'), tg('Shadows', 'shadows', (v) => Gfx.setShadows(v)), tg('Screen shake', 'shake'), tg('Subtitles', 'subtitles'),
        { label: 'Restore defaults', action: () => { Settings.reset(); applyAudioSettings(); Gfx.setShadows(Settings.get('shadows')); UI.renderMenu(); } },
        { label: 'Back', action: UI.backMenu },
      ],
    });
  }
  function howToMenu() {
    let page = 0;
    const pages = [
      { t: 'Controls', b: () => `<div class="howto"><div class="col"><h4>DualSense / controller</h4>${rows('pad')}</div><div class="col"><h4>Keyboard &amp; mouse</h4>${rows('kbm')}</div></div>` },
      { t: 'Economy & Power', b: () => `<ul class="big">
        <li><b>Conkerium</b> crystals are money. Harvesters mine them and unload at a Refinery. Spore trees regrow fields.</li>
        <li>Building costs are paid gradually while the bar fills. Out of credits? Production waits.</li>
        <li><b>Power</b>: every structure draws power. Low power halves production, shuts down defenses and radar, and pauses superweapons.</li>
        <li>Place new structures within ${ECON.buildRadius} tiles of your base. Sell for half value, repair for credits.</li></ul>` },
      { t: 'Combat', b: () => `<ul class="big">
        <li>Riflemen shred infantry, rockets crack armor, cannons punch vehicles, flames melt infantry and buildings.</li>
        <li>Tanks <b>crush</b> enemy infantry they drive over. Units gain <b>Veteran</b> and <b>Elite</b> ranks with kills.</li>
        <li>Engineers capture enemy structures or fully repair your own.</li>
        <li>Wraith stealth tanks are invisible until they fire or come close. Superweapons charge only while powered.</li>
        <li>Win by destroying every enemy structure (or by completing mission objectives).</li></ul>` },
    ];
    function rows(dev) {
      const R = [['CURSOR', 'Move cursor'], ['CONFIRM', 'Select / command'], ['HOLD', 'Box select'], ['CANCEL', 'Deselect / cancel'], ['AMOVE', 'Attack-move'], ['BUILD', 'Build menu'], ['SCREEN', 'Army on screen (×2 all)'], ['GROUP', 'Control groups'], ['STOP', 'Stop / deploy MCV'], ['SUPER', 'Superweapon'], ['REPAIR', 'Repair'], ['SELL', 'Sell'], ['PAN', 'Pan camera'], ['ZOOM', 'Zoom'], ['CENTER', 'Center on selection'], ['ALERT', 'Jump to alert'], ['INTEL', 'Objectives'], ['MENU', 'Pause / settings']];
      const saved = Input.device;
      const html = R.map(([k, l]) => `<div class="row">${glyphFor(k, dev)}<span>${l}</span></div>`).join('');
      return html;
    }
    const show = () => UI.openMenu({
      title: `How to Play — ${pages[page].t} (${page + 1}/${pages.length})`, cls: 'wide', body: pages[page].b() + `<p class="dim">${UI.glyphs('{NAV}')} ◀ ▶ change page</p>`,
      items: [{ label: page < pages.length - 1 ? 'Next page ▶' : 'Back', action: () => { if (page < pages.length - 1) { page++; UI.backMenu(); show(); } else UI.backMenu(); } }],
      onLR: (d) => { page = (page + d + pages.length) % pages.length; UI.backMenu(); show(); },
    });
    show();
  }
  function glyphFor(k, dev) {
    const old = Object.getOwnPropertyDescriptor(Input, 'device');
    // render glyphs for a specific device without changing the live device
    const fake = dev === 'pad';
    const html = fake ? padGlyph(k) : keyGlyph(k);
    return `<span class="gl">${html}</span>`;
  }
  const PG = { CURSOR: 'L-STICK', CONFIRM: '✕', HOLD: '✕ hold', CANCEL: '○', AMOVE: '□', BUILD: '△', SCREEN: 'R1', GROUP: 'L1 + ✚', STOP: '✚↓', SUPER: '✚↑', REPAIR: '✚←', SELL: '✚→', PAN: 'R-STICK', ZOOM: 'L2 / R2', CENTER: 'L3', ALERT: 'R3', INTEL: 'CREATE', MENU: 'OPTIONS' };
  const KG = { CURSOR: 'Mouse', CONFIRM: 'LMB', HOLD: 'LMB drag', CANCEL: 'RMB', AMOVE: 'F', BUILD: 'B', SCREEN: 'Q', GROUP: '1-4 / Ctrl+1-4', STOP: 'X', SUPER: 'G', REPAIR: 'R', SELL: 'V', PAN: 'WASD / edges', ZOOM: 'Wheel', CENTER: 'C', ALERT: 'H', INTEL: 'Tab', MENU: 'Esc' };
  const padGlyph = (k) => { const v = PG[k]; const cls = v.startsWith('✕') ? 'gx' : v === '○' ? 'go' : v === '□' ? 'gs' : v === '△' ? 'gt' : 'gp'; return `<i class="g ${cls}">${v}</i>`; };
  const keyGlyph = (k) => `<i class="k">${KG[k]}</i>`;
  function aboutMenu() {
    UI.openMenu({ title: 'About & Credits', cls: 'wide about', body: `<div class="scroll">${ABOUT_HTML}</div>`, scrollFirst: true, items: [{ label: 'Back', action: UI.backMenu }] });
  }
  function pauseMenu() {
    S.state = 'paused';
    UI.closeTray();
    const sess = Game.G.session;
    UI.openMenu({
      title: 'Paused', escBack: true,
      items: [
        { label: 'Resume', action: resume },
        { label: 'Objectives & Controls', action: () => { resume(); UI.toggleIntel(); } },
        { label: 'Settings', action: settingsMenu },
        { label: 'How to Play', action: howToMenu },
        { label: 'Restart', disabled: sess, note: sess ? 'Not available in a hub round' : '', action: () => { UI.closeMenus(); restart(); } },
        { label: 'Quit to Title', disabled: sess, note: sess ? 'Not available in a hub round' : '', action: () => { UI.closeMenus(); Game.G.map && teardown(); titleMenu(); } },
      ],
      onBack: () => { resume(); return false; },
    }, false);
  }
  function resume() { UI.closeMenus(); S.state = 'play'; }

  // ---------- starting matches ----------
  function teardown() { Control.reset(); UI.clearComms(); UI.resetMinimap(); }
  function begin(cfg, kind) {
    teardown();
    UI.closeMenus();
    S.kind = kind; S.cfg = cfg; S.resultsShown = false;
    Game.newMatch(cfg);
    S.state = kind === 'attract' ? 'attract' : 'play';
    UI.showHUD(kind !== 'attract');
    $('attract').classList.toggle('hidden', kind !== 'attract');
    Sound.music(kind === 'attract' ? 'battle' : cfg.mission && cfg.mission.id === 'm3' ? 'tension' : 'battle');
    if (kind !== 'attract') UI.drawMinimap(0, true);
  }
  function startBriefing(i) {
    S.missionIdx = i; S.state = 'briefing';
    Sound.music('tension');
    const M = Missions.CAMPAIGN[i];
    UI.briefing(M, () => begin(Missions.campaignConfig(i), 'campaign'), () => { titleMenu(); campaignMenu(); });
  }
  function startSkirmish() {
    const o = skirmishOpts;
    const seed = o.seedMode === 'valley' ? 77 : o.seedMode === 'delta' ? 4242 : (Math.random() * 1e9) | 0;
    S.skirmish = { ...o, seed };
    begin(Missions.skirmishConfig({ ...o, seed }), 'skirmish');
  }
  function restart() {
    if (S.kind === 'campaign') begin(Missions.campaignConfig(S.missionIdx), 'campaign');
    else if (S.kind === 'skirmish') begin(Missions.skirmishConfig(S.skirmish), 'skirmish');
  }
  function startAttract() {
    S.attractT = 0; S.camDirT = 0;
    begin(Missions.attractConfig((Math.random() * 1e9) | 0), 'attract');
    Gfx.cam.targetDist = 46;
  }

  // ---------- results ----------
  function showResults() {
    const G = Game.G, p = Game.P(0), win = G.over.win;
    S.state = 'results'; S.resultsShown = true;
    Sound.music(null); Sound.stinger(win);
    UI.closeTray();
    const tm = `${Math.floor(G.over.time / 60)}:${String(Math.floor(G.over.time % 60)).padStart(2, '0')}`;
    const objs = (G.objectives || []).filter((o) => o.done).length + ' / ' + (G.objectives || []).length;
    const tiles = [['Time', tm], ['Enemies destroyed', String(p.stats.kills)], ['Units lost', String(p.stats.losses)], ['Conkerium harvested', '$' + Math.floor(p.stats.harvested).toLocaleString()], ['Structures razed', String(p.stats.razed)], [G.objectives && G.objectives.length ? 'Objectives' : 'Score', G.objectives && G.objectives.length ? objs : String(Math.floor(p.stats.score))]];
    const btn = [];
    if (S.kind === 'campaign') {
      if (win) { progress[Missions.CAMPAIGN[S.missionIdx].id] = true; saveProgress(); }
      if (win && S.missionIdx < Missions.CAMPAIGN.length - 1) btn.push({ label: 'Next Mission ▶', action: () => { teardown(); startBriefing(S.missionIdx + 1); } });
      if (win && S.missionIdx === Missions.CAMPAIGN.length - 1) btn.push({ label: 'Epilogue', action: epilogue });
    }
    btn.push({ label: win ? 'Play Again' : 'Retry', action: () => { UI.closeMenus(); restart(); } });
    btn.push({ label: 'Quit to Title', action: () => { teardown(); titleMenu(); } });
    UI.showHUD(false);
    UI.results(win, { reason: G.over.reason, tiles }, btn);
  }
  function epilogue() {
    UI.openMenu({
      cls: 'brief', title: 'Epilogue', escBack: false,
      header: `<div class="bbody"><div class="bvid"><div class="portrait big">${UI.PORTRAITS.kaigan()}</div><b>Prophet Kaigan</b></div><div class="btext"><p class="type">The Temple burns, and the soldiers cheer. Let them. Every shell they crack scatters the seed a little further. Somewhere beneath the Varno Valley, something old is waking up. We will speak again, Commander.</p><p class="dim">Thanks for playing the Commander &amp; Conker demo. The engine, editor-ready trigger system and both factions are ready for more missions.</p></div></div>`,
      items: [{ label: 'Return to Title', action: () => { teardown(); titleMenu(); } }, { label: 'Credits', action: aboutMenu }],
    }, false);
    Sound.voice('The Temple burns, and the soldiers cheer. Let them. Every shell they crack scatters the seed a little further.', 'kaigan');
  }

  // ---------- attract director ----------
  function updateAttract(dt) {
    S.attractT += dt; S.camDirT -= dt;
    const G = Game.G;
    if (S.camDirT <= 0) {
      S.camDirT = 5 + Math.random() * 3;
      const hot = G.projectiles.length ? G.projectiles[(Math.random() * G.projectiles.length) | 0] : null;
      const pool = hot ? [hot] : G.supers.length ? G.supers : G.structures.filter((s) => s.alive);
      const t = pool[(Math.random() * pool.length) | 0];
      if (t) S.camGoal = { x: t.x, z: t.z };
      Gfx.cam.targetDist = 30 + Math.random() * 22;
    }
    if (S.camGoal) { Gfx.cam.x += (S.camGoal.x - Gfx.cam.x) * Math.min(1, dt * 0.8); Gfx.cam.z += (S.camGoal.z + 4 - Gfx.cam.z) * Math.min(1, dt * 0.8); }
    if (G.over || S.attractT > 170) startAttract();
    if (Input.anyHit || performance.now() - Input.lastActivity < 300 && S.attractT > 1.5) { $('attract').classList.add('hidden'); teardown(); Game.G.map = null; titleScene(); titleMenu(); }
  }
  function titleScene() {
    // a quiet diorama behind the title menu
    const cfg = Missions.skirmishConfig({ size: 'small', faction: 'usc', credits: 0, difficulty: 'easy', seed: 9090 });
    cfg.revealAll = true; cfg.attract = true; cfg.players[1].ai = null; cfg.triggers = [];
    Game.newMatch(cfg);
    S.titleCam = 0;
  }

  // ---------- hub session ----------
  async function startSession() {
    const info = await AIHub.connect({ mode: 'parallel', seats: [1, 4] });
    if (!info) return false;
    const seed = Math.floor(AIHub.rng('deal')() * 1e9);
    const cfg = Missions.sessionConfig(seed);
    S.session = { started: false, reported: false, ended: false, lastScore: -1 };
    begin(cfg, 'session');
    S.state = 'session-wait';
    AIHub.on('start', () => { Sound.ensure(); Sound.music('battle'); });
    AIHub.on('time-up', () => reportSession());
    AIHub.on('end', () => {
      S.session.ended = true; S.state = 'session-end';
      Sound.stopAll(); Sound.setMuted(true);
      UI.closeTray(); UI.closeMenus();
      $('countdown').textContent = 'ROUND OVER'; $('countdown').classList.remove('hidden');
    });
    AIHub.ready();
    return true;
  }
  function sessionScore() {
    const G = Game.G, p = Game.P(0);
    let s = Math.floor(p.stats.score);
    if (G.over && G.over.win) s += 5000 + Math.max(0, Math.floor((AIHub.limitMs || 720000) / 1000 - G.over.time)) * 10;
    return s;
  }
  function reportSession() {
    if (!S.session || S.session.reported) return;
    S.session.reported = true;
    const p = Game.P(0), G = Game.G;
    const awards = [];
    if (G.over && G.over.win) awards.push({ title: 'Base Breaker', detail: 'Razed the Husk base' });
    if (p.stats.kills >= 20) awards.push({ title: 'Iron Fist', detail: `${p.stats.kills} enemies destroyed` });
    if (p.stats.supers > 0) awards.push({ title: 'Hammer of Heaven', detail: 'Called down the Orbital Lance' });
    AIHub.result({ score: sessionScore(), stats: { kills: p.stats.kills, losses: p.stats.losses, harvested: Math.floor(p.stats.harvested), razed: p.stats.razed, 'units built': p.stats.unitsBuilt }, awards });
  }

  // ---------- frame ----------
  let last = performance.now();
  function frame() {
    const now = performance.now();
    let dt = Math.min(0.05, (now - last) / 1000); last = now;
    Input.update(dt);
    const st = S.state;
    if (st === 'touch') { UI.updateMenu(); }
    else if (st === 'title' || st === 'briefing' || st === 'results') {
      UI.updateMenu();
      if (Game.G.map && st === 'title') { S.titleCam = (S.titleCam || 0) + dt * 0.05; const N = Game.G.map.N * TILE; Gfx.cam.x = N / 2 + Math.cos(S.titleCam) * N * 0.3; Gfx.cam.z = N / 2 + Math.sin(S.titleCam) * N * 0.25; Gfx.cam.targetDist = 50; Game.update(dt * 0.5); }
      if (st === 'title' && performance.now() - Input.lastActivity > 10000 && !Game.G.session) startAttract();
      if (st === 'results' && Game.G.map) Game.update(dt * 0.3);
    } else if (st === 'attract') {
      Game.update(dt * 1.2);
      updateAttract(dt);
    } else if (st === 'play') {
      Control.update(dt, pauseMenu);
      if (S.state === 'play') Game.update(dt * Settings.get('gameSpeed'));
      const G = Game.G;
      if (G.over && !S.resultsShown) { S.endT = (S.endT || 0) + dt; if (S.endT > 3) { S.endT = 0; if (S.kind === 'session') { reportSession(); S.state = 'session-done'; } else showResults(); } }
    } else if (st === 'paused') {
      UI.updateMenu();
    } else if (st === 'session-wait') {
      const t = AIHub.time();
      $('countdown').classList.remove('hidden');
      $('countdown').textContent = t === -Infinity ? 'Waiting for the other commanders…' : t < 0 ? String(Math.ceil(-t / 1000)) : 'GO!';
      Control.updateCamera(dt);
      if (t >= 0) { S.state = 'play'; setTimeout(() => $('countdown').classList.add('hidden'), 700); }
    } else if (st === 'session-done') {
      Game.update(dt * 0.3);
      $('countdown').textContent = Game.G.over && Game.G.over.win ? 'VICTORY — score sent' : 'DEFEAT — score sent'; $('countdown').classList.remove('hidden');
    } else if (st === 'session-end') {
      // quiet: no input, no sound, final frame stays
    }
    if (S.session && !S.session.reported && (st === 'play')) {
      const sc = sessionScore();
      if (sc !== S.session.lastScore) { S.session.lastScore = sc; AIHub.progress({ score: sc, label: `${Game.P(0).stats.razed} razed · ${Game.P(0).stats.kills} kills` }); }
    }
    if (Game.G.map) {
      Particles.update(dt);
      Gfx.updateFlashes(dt);
    }
    Gfx.updateCamera(dt);
    Gfx.render();
    const ctl = Control.ctl;
    ctl.showCursor = (st === 'play') && !UI.menuOpen;
    UI.updateHUD(dt, ctl);
    UI.drawOverlay(dt, ctl);
    if (st === 'play' || st === 'paused' || st === 'session-wait') UI.drawMinimap(dt);
    document.body.classList.toggle('pad', Input.device === 'pad');
    document.body.classList.toggle('playing', st === 'play' && !UI.menuOpen);
    Input.endFrame();
  }

  // ---------- boot ----------
  async function boot() {
    applyAudioSettings();
    Sound.setListener(() => ({ x: Gfx.cam.x, z: Gfx.cam.z - 4, range: 50 + Gfx.cam.dist }));
    AIHub.probe(() => ({
      scene: { title: 'title', attract: 'title', briefing: 'menu', play: 'play', paused: 'play', results: 'over', 'session-wait': 'ready', 'session-done': 'over', 'session-end': 'over', touch: 'title', boot: 'title' }[S.state] || 'menu',
      menu: S.state === 'paused' || (UI.menuOpen && S.state === 'play'),
      world: Game.G.time,
      input: { x: Input.pan().x || Input.axes()[0], y: Input.pan().y || Input.axes()[1], fire: Input.down('confirm') },
    }));
    const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches && !navigator.getGamepads?.().some((g) => g);
    try {
      $('loading').textContent = 'Initialising WebGPU…';
      await Gfx.init();
      $('loading').textContent = 'Loading Rapier physics…';
      await Physics.init();
      Gfx.setShadows(Settings.get('shadows'));
    } catch (e) {
      $('loading').classList.add('hidden');
      $('fatal').classList.remove('hidden');
      $('fatal').innerHTML = `<h2>WebGPU required</h2><p>${esc(e.message || e)}</p><p>${esc(GAME_TITLE)} renders with WebGPU only (no fallback). Try a current Chrome, Edge or another WebGPU-enabled browser.</p>`;
      if (AIHub.active) AIHub.fail('WebGPU unavailable: ' + (e.message || e));
      return;
    }
    $('loading').classList.add('hidden');
    Gfx.renderer.setAnimationLoop(frame);
    if (AIHub.active) {
      const ok = await startSession();
      if (ok) return;
    }
    if (touchOnly) {
      S.state = 'touch';
      UI.openMenu({ cls: 'title', header: logo() + `<h2 class="warn">Controller or keyboard required</h2><p class="dim">Connect a controller or keyboard to command your forces. Touch controls are not supported.</p>`, items: [{ label: 'Settings', action: settingsMenu }], escBack: false }, false);
      addEventListener('keydown', () => { if (S.state === 'touch') { titleScene(); titleMenu(); } }, { once: true });
      addEventListener('gamepadconnected', () => { if (S.state === 'touch') { titleScene(); titleMenu(); } }, { once: true });
      return;
    }
    titleScene();
    titleMenu();
  }
  return { boot, S, begin, startSkirmish, startBriefing, startAttract, showResults, titleMenu };
})();
window.__CC = { Game, App, Selection, Control, Input, Missions, AI, Gfx, UI };
App.boot();

</script>
