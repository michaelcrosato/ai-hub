// ---- src/sim.js
// ============================================================================
// sim.js — the fight engine. Fixed 60 Hz, renderer-independent. A Match holds
// 2-4 Fighters, projectiles and the round flow. Fighters can be local (driven
// by input frames) or remote puppets (driven by network samples).
// ============================================================================

const STAGE_HALF = 7.4;
const MAX_SEP = 6.0;
const GRAB_INV = 8;

const MOTION_PRIORITY = { QCF2: 0, CHARGE_DB2: 0, '360': 1, DP: 2, CHARGE_DU: 3, CHARGE_BF: 3, HCB: 4, QCF: 5, QCB: 5, MASH_K: 6 };
for (const id of CHAR_ORDER) {
  const c = CHARS[id];
  c.specialsSorted = c.specials.slice().sort((a, b) => MOTION_PRIORITY[a.motion] - MOTION_PRIORITY[b.motion]);
}

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const sgn = (v) => (v < 0 ? -1 : 1);
const btnStrength = (bits, kind) => {
  const base = kind === 'K' ? 3 : 0;
  if (bits & (1 << (base + 2))) return 2;
  if (bits & (1 << (base + 1))) return 1;
  if (bits & (1 << base)) return 0;
  return -1;
};
const popcount = (b) => { let n = 0; while (b) { n += b & 1; b >>= 1; } return n; };

/** An input frame: x,y in -1..1 (y up), held/pressed button bitmasks, macro flags. */
const NO_INPUT = Object.freeze({ x: 0, y: 0, held: 0, pressed: 0, cc: false, roll: false, any: false });

class Fighter {
  constructor(match, id, charId, opts = {}) {
    this.match = match;
    this.id = id;
    this.ch = CHARS[charId];
    this.charId = charId;
    this.name = opts.name || this.ch.name;
    this.color = opts.color || null;
    this.remote = !!opts.remote;
    this.cpu = opts.cpu || null;
    this.palette = opts.palette || 0;
    this.hist = [];
    this.buf = [];
    this.wins = 0;
    this.marks = [];
    this.stats = { dmg: 0, maxCombo: 0, supers: 0, counters: 0, ccs: 0, kos: 0, perfects: 0, throws: 0 };
    this.atkSeq = 0;
    this.resetRound(opts.spawnX || 0, opts.spawnFace || 1);
  }

  resetRound(x, face) {
    const s = this.ch.stats;
    this.x = x; this.y = 0; this.vx = 0; this.vy = 0; this.facing = face;
    this.hp = s.hp; this.maxHp = s.hp;
    this.meter = this.meter || 0; // the super gauge carries between rounds, as in the Alpha series
    this.stun = 0; this.stunT = 0;
    this.state = 'stand'; this.st = 0;
    this.move = null; this.mf = 0; this.atkId = 0; this.hitMask = 0; this.contact = false; this.contactAt = -99;
    this.hitstop = 0; this.stunLeft = 0; this.combo = 0; this.comboDmg = 0; this.comboShow = 0;
    this.fallJuggle = false; this.kdOnLand = false; this.cc = 0; this.ccMax = 0;
    this.inv = 0; this.throwInv = 0; this.armorHits = 0;
    this.grabbed = null; this.grabber = null; this.grabT = 0; this.soft = false;
    this.charge = { b: 0, d: 0, db: 0, bfReady: 0, duReady: 0, dbReady: 0 };
    this.jx = 0; this.dashT = 0; this.landT = 0;
    this.blockCrouch = false; this.hitCrouch = false; this.hitHigh = false;
    this.dizzy = 0; this.koT = 0; this.alive = true;
    this.lastHitBy = null; this.wasCounter = 0; this.reversalWindow = 0; this.techHint = 0;
    this.hist.length = 0; this.buf.length = 0;
    this.input = NO_INPUT;
    this.guarding = false; this.airBlock = false;
    this.flash = 0; this.afterimage = 0;
    this.ccKill = false;
    this.target = null;
  }

  get grounded() { return this.y <= 0.0001; }
  get crouching() {
    if (this.state === 'crouch' || (this.state === 'block' && this.blockCrouch) || (this.state === 'hit' && this.hitCrouch)) return true;
    if (this.state === 'attack' && this.move && this.move.crouch) return true;
    return false;
  }

  // ---------------------------------------------------------------- input
  relDir(inp, face = this.facing) {
    const x = inp.x * face;
    return 5 + x + 3 * inp.y;
  }

  pushInput(inp) {
    this.input = inp;
    this.hist.push({ x: inp.x, y: inp.y, p: inp.pressed });
    if (this.hist.length > 64) this.hist.shift();
    for (const b of this.buf) b.age++;
    while (this.buf.length && this.buf[0].age > 5) this.buf.shift();
    if (inp.pressed) this.buf.push({ b: inp.pressed, age: 0 });
    if (inp.cc) this.buf.push({ b: BTN.LP | BTN.MP | BTN.LK, age: 0, cc: true });
    if (inp.roll) this.buf.push({ b: 0, age: 0, roll: true });
    // charge tracking, relative to current facing
    const d = this.relDir(inp);
    const c = this.charge;
    const back = d === 1 || d === 4 || d === 7, down = d === 1 || d === 2 || d === 3;
    if (back) c.b++; else { if (c.b >= 36) c.bfReady = 12; c.b = 0; }
    if (down) c.d++; else { if (c.d >= 36) c.duReady = 12; c.d = 0; }
    if (d === 1) c.db++; else { if (c.db >= 36) c.dbReady = 30; c.db = 0; }
    if (c.bfReady > 0) c.bfReady--;
    if (c.duReady > 0) c.duReady--;
    if (c.dbReady > 0) c.dbReady--;
    if (this.state === 'dizzy' && (inp.pressed || (inp.x || inp.y))) this.dizzy -= inp.pressed ? 4 : 0.6;
  }

  pressedBits() { let b = 0; for (const e of this.buf) b |= e.b; return b; }
  hasRoll() { return this.buf.some((e) => e.roll); }
  hasCC() {
    if (this.buf.some((e) => e.cc)) return true;
    const b = this.pressedBits();
    return popcount(b & PUNCHES) >= 2 && popcount(b & KICKS) >= 1;
  }
  consume() { this.buf.length = 0; }

  /** Compressed history string of relative directions over the last n frames. */
  motionStr(n) {
    let s = '', last = '';
    const h = this.hist;
    for (let i = Math.max(0, h.length - n); i < h.length; i++) {
      const d = String(this.relDir(h[i]));
      if (d !== last) { s += d; last = d; }
    }
    return s;
  }

  matchMotion(m) {
    const c = this.charge;
    const d = this.relDir(this.input);
    switch (m) {
      case 'QCF': return /23?5?6/.test(this.motionStr(16));
      case 'QCB': return /21?5?4/.test(this.motionStr(16));
      case 'DP': return /(6[35]?[12]?2[1]?3|323)[2]?$/.test(this.motionStr(18));
      case 'HCB': return /63?2?1?4/.test(this.motionStr(22));
      case 'QCF2': return /23?5?6[35]{0,2}23?5?6/.test(this.motionStr(34));
      case 'CHARGE_BF': return (c.bfReady > 0 || c.b >= 36) && (d === 6 || d === 3 || d === 9);
      case 'CHARGE_DU': return (c.duReady > 0 || c.d >= 36) && (d === 7 || d === 8 || d === 9);
      case 'CHARGE_DB2': return c.dbReady > 0 && /3.*1.*9/.test(this.motionStr(30));
      case '360': {
        const s = this.motionStr(42);
        let k = 0;
        for (const q of ['6', '2', '4', '8']) if (s.includes(q)) k++;
        return k >= 3 && /[2]/.test(s) && /[46]/.test(s);
      }
      case 'MASH_K': {
        let k = 0;
        for (let i = Math.max(0, this.hist.length - 24); i < this.hist.length; i++) if (this.hist[i].p & KICKS) k++;
        return k >= 3;
      }
    }
    return false;
  }

  // ---------------------------------------------------------------- moves
  startMove(mv, opts = {}) {
    this.move = mv; this.mf = 0; this.state = 'attack'; this.st = 0;
    this.atkId = ++this.atkSeq;
    this.hitMask = 0; this.contact = false; this.armorHits = 0;
    this.consume();
    if (!opts.keepVel) {
      if (this.grounded) { this.vx = 0; this.vy = 0; }
    }
    if (mv.type !== 'normal' && mv.voice) this.match.emit({ t: 'voice', who: this.id, line: mv.voice, ch: this.charId, name: mv.name });
    if (mv.type === 'super') {
      this.meter -= mv.lvl * 100;
      this.stats.supers++;
      this.match.superFlash(this, mv);
    } else if (mv.type === 'counter') {
      this.meter -= mv.cost;
      this.stats.counters++;
      this.match.emit({ t: 'announce', text: ANNOUNCE.alpha, who: this.id, small: true });
      this.match.flashFreeze(this, 12, 'counter');
    } else if (mv.type === 'special' || mv.type === 'normal') {
      this.match.emit({ t: 'whoosh', who: this.id, cls: mv.hits[0] ? mv.hits[0].cls : 'L' });
    }
    if (this.reversalWindow > 0 && mv.type !== 'normal') this.revFlag = true;
  }

  firstHitFrame() { return this.move && this.move.hits.length ? this.move.hits[0].f : 999; }

  /** Try specials and supers from current buffer. Returns true if something started. */
  trySpecials(allowSupers = true, inAir = false, onlySupers = false) {
    const pressed = this.pressedBits();
    if (!pressed) return false;
    const ch = this.ch;
    if (allowSupers && this.meter >= 100) {
      for (const sp of ch.supers) {
        const mask = sp.btn === 'P' ? PUNCHES : KICKS;
        if (!(pressed & mask)) continue;
        if (inAir && !sp.airOK) continue;
        if (!this.matchMotion(sp.motion)) continue;
        const str = btnStrength(pressed, sp.btn);
        const lvl = Math.max(1, Math.min(str + 1, Math.floor(this.meter / 100)));
        this.startMove(sp.levels[lvl], { keepVel: inAir });
        return true;
      }
    }
    if (onlySupers) return false;
    for (const sp of ch.specialsSorted) {
      const mask = sp.btn === 'P' ? PUNCHES : KICKS;
      if (!(pressed & mask)) continue;
      if (inAir && !(sp.airOK || sp.airOnly)) continue;
      if (!inAir && sp.airOnly) continue;
      if (!this.matchMotion(sp.motion)) continue;
      const str = Math.max(0, btnStrength(pressed, sp.btn));
      this.startMove(sp.v[str], { keepVel: inAir });
      if (sp.motion === 'CHARGE_BF') { this.charge.b = 0; this.charge.bfReady = 0; }
      if (sp.motion === 'CHARGE_DU') { this.charge.d = 0; this.charge.duReady = 0; }
      return true;
    }
    return false;
  }

  tryThrow() {
    const p = this.pressedBits();
    const d = this.relDir(this.input);
    if (!(p & (BTN.HP | BTN.HK))) return false;
    if (!(d === 4 || d === 6)) return false;
    const t = this.target;
    if (!t || !this.canBeThrown(t)) return false;
    if (Math.abs(t.x - this.x) > 0.95 + 0.1 * (this.ch.look.bulk - 1)) return false;
    const mv = p & BTN.HP ? this.ch.throwP : this.ch.throwK;
    if (this.remote) return false;
    this.startMove(mv);
    this.throwBack = d === 4;
    this.match.beginGrab(this, t, mv, false);
    return true;
  }

  canBeThrown(t) {
    if (!t.alive || !t.grounded || t.throwInv > 0 || t.inv > 0) return false;
    if (['hit', 'block', 'fall', 'down', 'getup', 'thrown', 'ko', 'jumpSquat'].includes(t.state)) return false;
    if (t.state === 'attack' && t.move && t.move.inv && t.mf >= t.move.inv[0] && t.mf <= t.move.inv[1]) return false;
    return true;
  }

  tryNormal(inAir = false) {
    const p = this.pressedBits();
    if (!p) return false;
    const d = this.relDir(this.input);
    if (!inAir) {
      for (const cm of this.ch.commands) {
        const need = Number(cm.input[0]);
        const b = BTN[cm.input.slice(1)];
        if (d === need && (p & b)) { this.startMove(cm); return true; }
      }
    }
    const order = ['HP', 'HK', 'MP', 'MK', 'LP', 'LK'];
    for (const k of order) {
      if (!(p & BTN[k])) continue;
      const pre = inAir ? 'j' : d <= 3 ? 'c' : 's';
      const mv = this.ch.normals[pre + k];
      if (!mv) continue;
      mv.crouch = pre === 'c';
      this.startMove(mv, { keepVel: inAir });
      return true;
    }
    return false;
  }

  tryCC() {
    if (this.meter < 100 || !this.grounded || this.cc > 0) return false;
    if (!this.hasCC()) return false;
    const lv = Math.min(3, Math.floor(this.meter / 100));
    this.cc = this.ccMax = 80 + 70 * lv;
    this.meter = 0;
    this.stats.ccs++;
    this.consume();
    this.state = 'stand'; this.st = 0; this.move = null;
    this.inv = 30;
    this.match.flashFreeze(this, 30, 'cc');
    this.match.emit({ t: 'announce', text: ANNOUNCE.custom, who: this.id, small: true });
    this.match.emit({ t: 'voice', who: this.id, line: 'custom', ch: this.charId, name: 'Custom Combo' });
    return true;
  }

  tryRoll() {
    if (!this.hasRoll()) return false;
    const d = this.relDir(this.input);
    this.startMove(d === 4 || d === 1 || d === 7 ? BACKROLL : ROLL);
    return true;
  }

  isBlockingStance(attacker) {
    if (!attacker) return false;
    const away = sgn(this.x - attacker.x);
    return this.input.x !== 0 && Math.sign(this.input.x) === away;
  }

  // ---------------------------------------------------------------- frame logic
  neutral() {
    const inp = this.input;
    const d = this.relDir(inp);
    if (this.tryCC()) return;
    if (this.trySpecials()) return;
    if (this.tryRoll()) return;
    if (this.tryThrow()) return;
    if (this.tryNormal()) return;
    // dash: double-tap
    const ms = this.motionStr(12);
    if (this.hist.length > 2 && (d === 6 || d === 4) && this.hist[this.hist.length - 2] && this.relDir(this.hist[this.hist.length - 2]) === 5) {
      if (/[6]5[6]$/.test(ms) && d === 6) { this.state = 'dash'; this.st = 0; this.dashDir = 1; return; }
      if (/[4]5[4]$/.test(ms) && d === 4) { this.state = 'dash'; this.st = 0; this.dashDir = -1; this.inv = 6; return; }
    }
    if (inp.y > 0) { this.state = 'jumpSquat'; this.st = 0; this.jx = inp.x; return; }
    const s = this.ch.stats;
    const spdMul = this.cc > 0 ? 1.25 : 1;
    if (inp.y < 0) {
      this.state = 'crouch'; this.vx = 0;
      this.guarding = d === 1 && this.threatened();
      return;
    }
    if (d === 4 && this.threatened()) {
      this.state = 'guard'; this.vx = 0; this.guarding = true; return;
    }
    this.guarding = false;
    if (d === 6) { if (this.state !== 'walkF') this.st = 0; this.state = 'walkF'; this.vx = s.walkF * this.facing * spdMul; }
    else if (d === 4) { if (this.state !== 'walkB') this.st = 0; this.state = 'walkB'; this.vx = -s.walkB * this.facing * spdMul; }
    else { if (this.state !== 'stand') this.st = 0; this.state = 'stand'; this.vx = 0; }
  }

  /** Is an enemy attack or projectile close enough that holding back should guard in place? */
  threatened() {
    for (const o of this.match.fighters) {
      if (o === this || !o.alive) continue;
      if (o.state === 'attack' && o.move && o.move.hits.length && Math.abs(o.x - this.x) < 2.8) return true;
    }
    for (const p of this.match.projs) if (p.owner !== this && Math.abs(p.x - this.x) < 2.6) return true;
    return false;
  }

  step() {
    const m = this.match;
    const s = this.ch.stats;
    if (this.inv > 0) this.inv--;
    if (this.throwInv > 0) this.throwInv--;
    if (this.reversalWindow > 0) this.reversalWindow--;
    if (this.flash > 0) this.flash--;
    if (this.cc > 0) { this.cc--; this.afterimage = 1; if (this.cc === 0) m.emit({ t: 'ccEnd', who: this.id }); } else this.afterimage = 0;
    this.stunT++;
    if (this.stunT > 90 && this.stun > 0 && this.state !== 'dizzy') this.stun = Math.max(0, this.stun - 0.4);
    if (this.comboShow > 0) this.comboShow--;
    this.st++;
    const grav = s.grav;
    switch (this.state) {
      case 'stand': case 'crouch': case 'walkF': case 'walkB': case 'guard':
        this.neutral();
        break;
      case 'land':
        this.vx = 0;
        if (this.st >= this.landT) { this.state = 'stand'; this.st = 0; this.neutral(); }
        break;
      case 'dash': {
        const T = this.dashDir > 0 ? 16 : 20;
        const k = 1 - this.st / T;
        this.vx = this.dashDir * this.facing * s.dash * Math.max(0, k) * 1.4;
        if (this.dashDir < 0 && this.st < 12) this.y = Math.sin((this.st / 12) * Math.PI) * 0.18; else this.y = 0;
        if (this.st >= T) { this.state = 'stand'; this.st = 0; this.vx = 0; this.y = 0; }
        else if (this.cc > 0 && this.pressedBits()) { this.y = 0; if (!this.trySpecials()) this.tryNormal(); }
        break;
      }
      case 'jumpSquat':
        this.vx = 0;
        if (this.trySpecials()) break; // 360 / supers buffered through prejump
        if (this.st >= 4) {
          this.state = 'air'; this.st = 0;
          this.vy = s.jumpV; this.vx = this.jx * s.jumpX * (this.cc > 0 ? 1.2 : 1);
          this.jumpFacing = this.facing;
          m.emit({ t: 'jump', who: this.id });
        }
        break;
      case 'air':
        if (this.trySpecials(true, true)) break;
        if (this.tryNormal(true)) break;
        this.vy -= grav;
        this.airBlock = this.isBlockingStance(this.target);
        break;
      case 'attack': this.stepMove(); break;
      case 'hit':
        this.vx *= 0.86;
        if (--this.stunLeft <= 0) this.recover();
        break;
      case 'block':
        this.vx *= 0.86;
        if (this.grounded && this.meter >= 100 && this.tryAlphaCounter()) break;
        if (!this.grounded) this.vy -= grav;
        if (--this.stunLeft <= 0) { this.recover(); }
        break;
      case 'fall':
        this.vy -= grav * (this.floaty ? 0.6 : 1);
        if (this.pressedBits() && popcount(this.pressedBits()) >= 1) this.techHint = 8;
        if (this.techHint > 0) this.techHint--;
        break;
      case 'down':
        this.vx *= 0.8;
        if (!this.alive) break;
        if (this.st >= 36) { this.state = 'getup'; this.st = 0; this.inv = 24; }
        break;
      case 'getup':
        this.vx = 0;
        if (this.st >= 22) { this.state = 'stand'; this.st = 0; this.throwInv = 6; this.reversalWindow = 5; this.neutral(); }
        break;
      case 'dizzy':
        this.vx = 0;
        this.dizzy -= 1;
        if (this.dizzy <= 0) { this.state = 'stand'; this.st = 0; this.stun = 0; }
        break;
      case 'thrown':
        // positioned by the grabber
        break;
      case 'ko':
        this.vx *= 0.9;
        break;
      case 'win': case 'intro': case 'idle':
        this.vx = 0;
        break;
    }
    this.physics();
  }

  tryAlphaCounter() {
    const p = this.pressedBits();
    const d = this.relDir(this.input);
    const ok = (p & PUNCHES) && (p & KICKS) && (d === 6 || d === 3 || this.buf.some((e) => e.cc));
    if (!ok) return false;
    this.blockCrouch = false;
    this.startMove(this.ch.counter);
    return true;
  }

  recover() {
    this.stunLeft = 0;
    if (this.stun >= this.ch.stats.stunMax && this.alive && this.match.phase === 'fight') {
      this.state = 'dizzy'; this.st = 0; this.dizzy = 150; this.stun = 0;
      this.match.emit({ t: 'announce', text: ANNOUNCE.dizzy, who: this.id, small: true });
      this.match.emit({ t: 'dizzy', who: this.id });
      return;
    }
    if (!this.grounded) { this.state = 'air'; this.st = 10; return; }
    this.state = this.input.y < 0 ? 'crouch' : 'stand'; this.st = 0;
    this.combo = 0; this.comboDmg = 0;
    this.reversalWindow = 4;
    this.neutral();
  }

  stepMove() {
    const mv = this.move;
    const s = this.ch.stats;
    const f = this.mf;
    // velocity script
    let scripted = false;
    for (const [a, b, vx, vy] of mv.vel) {
      if (f >= a && f < b) {
        this.vx = vx * this.facing * (this.cc > 0 ? 1.15 : 1);
        if (vy !== 0 || mv.holdY || !mv.gravity) this.vy = vy;
        scripted = true;
      }
    }
    if (!this.grounded || mv.air) {
      if (mv.gravity !== false && !(scripted && mv.vel.some(([a, b, , vy]) => f >= a && f < b && vy !== 0))) {
        if (!mv.holdY || this.y > 0) this.vy -= s.grav;
      } else if (mv.holdY && !scripted) {
        this.vy = 0;
      }
    } else if (!scripted) {
      this.vx *= 0.7;
    }
    if (mv.proj && f === mv.proj.f) this.match.spawnProj(this, mv.proj.spec);
    if (mv.tele && f === mv.tele.at) this.teleport(mv.tele);
    if (mv.grab && mv.grab.cmd && f === mv.grab.at && !this.remote) {
      const t = this.target;
      if (t && this.canBeThrown(t) && Math.abs(t.x - this.x) < mv.grab.range && Math.abs(t.y - this.y) < 0.3) {
        this.match.beginGrab(this, t, mv, true);
        return;
      }
    }
    // cancels
    if (this.canCancel()) {
      if (this.cc > 0) {
        if (this.trySpecials(false, !this.grounded) || (this.grounded ? this.tryNormal(false) : this.tryNormal(true))) return;
        if (this.grounded && this.input.y > 0 && this.contact) { this.state = 'jumpSquat'; this.st = 2; this.jx = this.input.x; this.move = null; return; }
      } else if (mv.cancel === 'sp' && this.trySpecials(true)) return;
      else if (mv.type === 'special' && this.contact && this.trySpecials(true, !this.grounded, true)) return;
    }
    this.mf++;
    if (mv.air && this.grounded && f > 2 && this.vy <= 0) {
      this.endMove(true);
      return;
    }
    if (this.mf >= mv.len) this.endMove(false);
  }

  canCancel() {
    const mv = this.move;
    if (!mv) return false;
    if (this.cc > 0) {
      const last = mv.hits.length ? mv.hits[mv.hits.length - 1] : null;
      return this.contact || (last && this.mf >= last.f + last.n) || (!last && this.mf > 8);
    }
    if (!this.contact) return false;
    return this.match.frame - this.contactAt <= 14;
  }

  endMove(landed) {
    const mv = this.move;
    this.move = null;
    if (!this.grounded && !landed) { this.state = 'air'; this.st = 20; return; }
    if (landed || mv.air) {
      this.y = 0; this.vy = 0; this.vx = 0;
      this.state = 'land'; this.st = 0; this.landT = mv.landRec || 3;
      this.match.emit({ t: 'land', who: this.id, heavy: false });
      return;
    }
    this.state = 'stand'; this.st = 0;
    this.neutral();
  }

  teleport(t) {
    const tgt = this.target;
    if (!tgt) return;
    let nx;
    if (t.onTarget) { nx = tgt.x; this.y = t.y; this.vy = 0; }
    else if (t.behind) nx = tgt.x + sgn(tgt.x - this.x) * 1.0;
    else nx = this.x + this.facing * t.dx;
    this.x = clamp(nx, -STAGE_HALF, STAGE_HALF);
    if (!t.onTarget) this.facing = sgn(tgt.x - this.x);
    this.match.emit({ t: 'teleport', who: this.id });
  }

  physics() {
    if (this.state === 'thrown') return;
    this.x += this.vx;
    this.y += this.vy;
    const st = this.state;
    if (this.y <= 0 && (this.vy < 0 || this.y < 0)) {
      this.y = 0;
      if (st === 'air') {
        this.vy = 0; this.vx = 0; this.state = 'land'; this.st = 0; this.landT = 3;
        this.match.emit({ t: 'land', who: this.id });
      } else if (st === 'fall') {
        this.vy = 0;
        this.land();
      } else if (st === 'block' || st === 'hit') {
        this.vy = 0;
      } else if (st === 'ko') {
        this.vy = 0; this.vx *= 0.5;
      } else if (st === 'attack' && this.move && !this.move.air && this.vy < 0) {
        this.vy = 0;
      } else if (st === 'dash') {
        this.vy = 0;
      } else this.vy = 0;
    }
    this.x = clamp(this.x, -STAGE_HALF, STAGE_HALF);
  }

  land() {
    this.floaty = false;
    if (!this.alive) {
      this.state = 'ko'; this.st = 0; this.vx *= 0.4;
      this.match.emit({ t: 'land', who: this.id, heavy: true });
      return;
    }
    if (!this.kdOnLand) {
      this.state = 'land'; this.st = 0; this.landT = 4; this.vx = 0;
      this.match.emit({ t: 'land', who: this.id });
      return;
    }
    this.kdOnLand = false;
    this.match.emit({ t: 'land', who: this.id, heavy: true });
    if (this.techHint > 0 && this.match.phase === 'fight' && !this.noTech) {
      this.techHint = 0;
      this.match.emit({ t: 'announce', text: ANNOUNCE.tech, who: this.id, small: true });
      this.startMove(TECHROLL);
      this.combo = 0; this.comboDmg = 0;
      return;
    }
    this.noTech = false;
    this.state = 'down'; this.st = 0; this.vx *= 0.3;
    this.combo = 0; this.comboDmg = 0;
  }

  // ---------------------------------------------------------------- boxes
  hurtbox() {
    const L = this.ch.look;
    const H = L.scale, W = 0.26 + 0.06 * L.bulk;
    const st = this.state;
    if (!this.alive || st === 'down' || st === 'getup' || st === 'ko' || st === 'thrown' || st === 'win' || st === 'intro') return null;
    if (this.inv > 0) return null;
    if (st === 'fall' && !this.fallJuggle) return null;
    if (st === 'attack' && this.move) {
      const iv = this.move.inv;
      if (iv && this.mf >= iv[0] && this.mf <= iv[1] && iv[2] === 'all') return null;
      if (this.move.type === 'roll' && iv && this.mf >= iv[0] && this.mf <= iv[1]) return null;
    }
    if (st === 'fall') return [this.x, this.y + 0.5, 0.55, 0.35];
    if (this.crouching) return [this.x, this.y + 0.55 * H, W + 0.04, 0.55 * H];
    if (!this.grounded) return [this.x, this.y + 0.95 * H, W, 0.7 * H];
    return [this.x, this.y + 0.9 * H, W, 0.9 * H];
  }

  projInvuln() {
    if (this.state !== 'attack' || !this.move || !this.move.inv) return false;
    const iv = this.move.inv;
    return this.mf >= iv[0] && this.mf <= iv[1] && (iv[2] === 'proj' || iv[2] === 'all');
  }
  strikeInvuln() {
    if (this.state !== 'attack' || !this.move || !this.move.inv) return false;
    const iv = this.move.inv;
    return this.mf >= iv[0] && this.mf <= iv[1] && (iv[2] === 'strike' || iv[2] === 'all');
  }

  /** Active hitboxes this frame: [{hit, index, box:[cx,cy,hw,hh]}]. */
  activeHits() {
    if (this.state !== 'attack' || !this.move) return [];
    const out = [];
    const mv = this.move;
    for (let i = 0; i < mv.hits.length; i++) {
      const h = mv.hits[i];
      if (this.mf >= h.f && this.mf < h.f + h.n && !(this.hitMask & (1 << i))) {
        out.push({ hit: h, index: i, box: [this.x + this.facing * h.box[0], this.y + h.box[1], h.box[2], h.box[3]] });
      }
    }
    return out;
  }
}

function overlap(a, b) {
  return Math.abs(a[0] - b[0]) < a[2] + b[2] && Math.abs(a[1] - b[1]) < a[3] + b[3];
}

// ============================================================================
// Match
// ============================================================================
class Match {
  constructor(opts) {
    this.opts = Object.assign({
      rounds: 2, time: 99, training: false, stage: 'shrine', net: null, attract: false, speed: 1,
      dummy: 'stand', infiniteMeter: false, cheat: null, ffa: false,
    }, opts);
    this.fighters = [];
    this.projs = [];
    this.events = [];
    this.frame = 0;
    this.round = 0;
    this.phase = 'intro';
    this.pt = 0;
    this.freeze = 0;
    this.freezeWho = null;
    this.freezeKind = null;
    this.timer = this.opts.time;
    this.timerSub = 0;
    this.projSeq = 0;
    this.slowmo = 0;
    this.firstAttack = false;
    this.winner = null;
    this.matchWinner = null;
    this.shake = 0;
    this.drawCount = 0;
    this.history = [];
  }

  emit(e) { e.frame = this.frame; this.events.push(e); }

  add(f) { this.fighters.push(f); return f; }

  spawnPoints() {
    const n = this.fighters.length;
    if (n === 2) return [[-1.6, 1], [1.6, -1]];
    const pts = [];
    for (let i = 0; i < n; i++) { const x = -3 + (6 * i) / (n - 1); pts.push([x, x < 0 ? 1 : -1]); }
    return pts;
  }

  startRound() {
    this.round++;
    const pts = this.spawnPoints();
    this.fighters.forEach((f, i) => {
      if (f.gone) return;
      f.resetRound(pts[i][0], pts[i][1]);
      f.state = this.round === 1 && !this.opts.training && !this.opts.skipIntro ? 'intro' : 'stand';
    });
    this.projs.length = 0;
    this.timer = this.opts.time; this.timerSub = 0;
    this.firstAttack = false;
    this.winner = null;
    this.phase = this.round === 1 && !this.opts.training && !this.opts.skipIntro ? 'intro' : 'ready';
    this.pt = 0;
    this.slowmo = 0;
    this.superKO = false;
    this.winSet = false;
    this.emit({ t: 'roundStart', round: this.round });
  }

  isFinalRound() {
    const need = this.opts.rounds;
    return this.fighters.filter((f) => !f.gone).every((f) => f.wins === need - 1) && this.fighters.length === 2;
  }

  superFlash(f, mv) {
    this.freeze = 42; this.freezeWho = f; this.freezeKind = 'super';
    f.flash = 42;
    this.emit({ t: 'superflash', who: f.id, lvl: mv.lvl, name: mv.name });
  }
  flashFreeze(f, n, kind) {
    this.freeze = n; this.freezeWho = f; this.freezeKind = kind;
    f.flash = n;
    this.emit({ t: kind === 'cc' ? 'ccflash' : 'counterflash', who: f.id });
  }

  living() { return this.fighters.filter((f) => f.alive && !f.gone); }

  pickTargets() {
    for (const f of this.fighters) {
      let best = null, bd = 1e9;
      for (const o of this.fighters) {
        if (o === f || o.gone) continue;
        if (!o.alive && this.living().length > 1 && o !== f.target) continue;
        const d = Math.abs(o.x - f.x) + (o.alive ? 0 : 50);
        if (d < bd) { bd = d; best = o; }
      }
      f.target = best;
    }
  }

  /** One 60 Hz step. inputs: array of input frames per fighter index (local fighters only). */
  step(inputs) {
    this.events.length = 0;
    this.frame++;
    if (this.shake > 0) this.shake *= 0.85;
    const fs = this.fighters;
    this.pickTargets();
    // inputs are recorded even during freezes so motions can be buffered
    fs.forEach((f, i) => {
      if (f.remote || f.gone) return;
      const inp = inputs[i] || NO_INPUT;
      f.pushInput(this.phase === 'fight' || (this.phase === 'ko' && f.state === 'fall') ? inp : NO_INPUT);
    });
    if (this.opts.infiniteMeter) fs.forEach((f) => { if (!f.remote) f.meter = 300; });
    if (this.opts.cheat) this.opts.cheat(this);

    if (this.freeze > 0) {
      this.freeze--;
      if (this.freeze === 0) this.freezeWho = null;
      this.flowStep(true);
      return;
    }
    if (this.slowmo > 0) {
      this.slowmo--;
      if (this.slowmo % 3 !== 0) { this.flowStep(true); return; }
    }

    for (const f of fs) {
      if (f.gone) continue;
      if (f.remote) { if (f.grabbed && !f.grabbed.remote) this.stepGrab(f); continue; }
      if (f.hitstop > 0) { f.hitstop--; continue; }
      if (f.grabbed && f.state === 'attack') { this.stepGrab(f); continue; }
      f.step();
    }
    if (this.opts.net) this.opts.net.stepPuppets();
    this.stepFacing();
    this.pushApart();
    this.stepProjs();
    this.resolveHits();
    this.flowStep(false);
  }

  stepFacing() {
    for (const f of this.fighters) {
      if (f.remote || f.gone || !f.target) continue;
      const st = f.state;
      if ((st === 'stand' || st === 'crouch' || st === 'walkF' || st === 'walkB' || st === 'guard' || st === 'land' || st === 'jumpSquat' || st === 'getup' || st === 'dizzy') && f.grounded) {
        const nf = sgn(f.target.x - f.x);
        if (Math.abs(f.target.x - f.x) > 0.05 && nf !== f.facing) {
          f.facing = nf;
          if (st === 'walkF' || st === 'walkB') f.state = 'stand';
        }
      }
    }
  }

  pushApart() {
    const fs = this.fighters.filter((f) => !f.gone && f.state !== 'thrown' && f.state !== 'ko' && f.alive);
    for (let i = 0; i < fs.length; i++) {
      for (let j = i + 1; j < fs.length; j++) {
        const a = fs[i], b = fs[j];
        const wa = 0.24 + 0.06 * a.ch.look.bulk, wb = 0.24 + 0.06 * b.ch.look.bulk;
        const ha = a.crouching ? 1.0 : 1.7, hb = b.crouching ? 1.0 : 1.7;
        if (Math.abs(a.y - b.y) > Math.max(ha, hb) * 0.75) continue;
        if (a.state === 'down' || b.state === 'down') continue;
        if ((a.move && a.move.type === 'roll') || (b.move && b.move.type === 'roll')) continue;
        const dx = b.x - a.x;
        const pen = wa + wb - Math.abs(dx);
        if (pen > 0) {
          const dir = Math.abs(dx) < 1e-4 ? (a.facing > 0 ? 1 : -1) : sgn(dx);
          let ma = a.remote ? 0 : 0.5, mb = b.remote ? 0 : 0.5;
          if (!a.remote && b.remote) ma = 1;
          if (a.remote && !b.remote) mb = 1;
          a.x -= dir * pen * ma; b.x += dir * pen * mb;
          // walls: whoever is cornered stays, the other is pushed
          for (const [p, q, d] of [[a, b, -dir], [b, a, dir]]) {
            if (Math.abs(p.x) > STAGE_HALF) {
              const over = Math.abs(p.x) - STAGE_HALF;
              p.x = clamp(p.x, -STAGE_HALF, STAGE_HALF);
              if (!q.remote) q.x -= d * over;
            }
          }
        }
      }
    }
    // camera-width limit (1v1 only)
    if (fs.length === 2 && !this.opts.ffa) {
      const [a, b] = fs;
      const sep = Math.abs(a.x - b.x);
      if (sep > MAX_SEP) {
        const over = sep - MAX_SEP;
        const dir = sgn(b.x - a.x);
        const ma = a.remote ? 0 : b.remote ? 1 : 0.5, mb = b.remote ? 0 : a.remote ? 1 : 0.5;
        a.x += dir * over * ma; b.x -= dir * over * mb;
      }
    }
    for (const f of fs) f.x = clamp(f.x, -STAGE_HALF, STAGE_HALF);
  }

  // ---------------------------------------------------------------- projectiles
  spawnProj(f, spec, net) {
    const p = {
      id: net ? net.id : f.id * 10000 + (++this.projSeq), owner: f, spec,
      x: net ? net.x : f.x + f.facing * 0.7, y: net ? net.y : f.y + spec.y * (f.grounded ? 1 : 0.6) + (f.grounded ? 0 : 0.4),
      vx: (net ? net.face : f.facing) * spec.spd, face: net ? net.face : f.facing, life: spec.life, hitsLeft: spec.hits, cd: 0, alive: true, age: 0,
      superF: spec.superF,
    };
    if (net && net.age) for (let i = 0; i < net.age && p.alive; i++) { p.x += p.vx; p.age++; p.life--; }
    this.projs.push(p);
    this.emit({ t: 'proj', p, who: f.id, kind: spec.kind });
    return p;
  }

  stepProjs() {
    for (const p of this.projs) {
      if (!p.alive) continue;
      p.x += p.vx; p.age++;
      if (p.cd > 0) p.cd--;
      if (--p.life <= 0 || Math.abs(p.x) > STAGE_HALF + 3) p.alive = false;
    }
    // projectile clashes
    for (let i = 0; i < this.projs.length; i++) {
      const a = this.projs[i];
      if (!a.alive) continue;
      for (let j = i + 1; j < this.projs.length; j++) {
        const b = this.projs[j];
        if (!b.alive || a.owner === b.owner) continue;
        if (overlap([a.x, a.y, a.spec.hw, a.spec.hh], [b.x, b.y, b.spec.hw, b.spec.hh])) {
          const ha = a.hitsLeft, hb = b.hitsLeft;
          a.hitsLeft -= a.superF && !b.superF ? 1 : hb;
          b.hitsLeft -= b.superF && !a.superF ? 1 : ha;
          if (a.hitsLeft <= 0) a.alive = false;
          if (b.hitsLeft <= 0) b.alive = false;
          this.emit({ t: 'clash', x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
        }
      }
    }
    this.projs = this.projs.filter((p) => p.alive || p.age < 0);
  }

  // ---------------------------------------------------------------- hits
  resolveHits() {
    const net = this.opts.net;
    const fs = this.fighters.filter((f) => !f.gone);
    for (const a of fs) {
      const hits = a.activeHits();
      if (!hits.length) continue;
      for (const { hit, index, box } of hits) {
        for (const t of fs) {
          if (t === a || !t.alive) continue;
          if (a.remote && t.remote) continue;
          const hb = t.hurtbox();
          if (!hb) continue;
          if (t.state === 'fall' && !t.fallJuggle && !hit.juggle && !(a.cc > 0)) continue;
          if (!overlap(box, hb)) continue;
          if (t.strikeInvuln()) continue;
          if (net && t.remote) {
            // predicted contact: the victim's copy decides; we show it and allow cancels now
            if (a.predicted && a.predicted[t.id + ':' + a.atkId + ':' + index]) continue;
            a.predicted = a.predicted || {};
            a.predicted[t.id + ':' + a.atkId + ':' + index] = 1;
            a.hitMask |= 1 << index;
            a.contact = true; a.contactAt = this.frame;
            a.hitstop = HITCLASS[hit.cls].stop;
            continue;
          }
          if (net && a.remote) {
            const key = a.id + ':' + a.atkId + ':' + index;
            t.seenHits = t.seenHits || new Set();
            if (t.seenHits.has(key)) continue;
            t.seenHits.add(key);
            if (t.seenHits.size > 200) t.seenHits = new Set([...t.seenHits].slice(-100));
          } else {
            a.hitMask |= 1 << index;
          }
          this.applyHit(a, t, hit, a.move, false, null);
          break;
        }
      }
    }
    for (const p of this.projs) {
      if (!p.alive) continue;
      if (p.cd > 0) continue;
      const pb = [p.x, p.y, p.spec.hw, p.spec.hh];
      for (const t of fs) {
        if (t === p.owner || !t.alive || t.remote) continue;
        const hb = t.hurtbox();
        if (!hb || t.projInvuln()) continue;
        if (t.state === 'fall' && !t.fallJuggle && !p.superF) continue;
        if (!overlap(pb, hb)) continue;
        const s = p.spec;
        const h = { dmg: s.dmg, stun: s.stun, hs: s.hs, bs: s.bs, guard: 'mid', kd: s.kd && p.hitsLeft <= 1 ? 1 : 0, launch: s.launch, chip: s.chip, cls: s.cls, push: 0.08, juggle: s.superF, proj: true };
        this.applyHit(p.owner, t, h, { type: s.superF ? 'super' : 'special', id: 'proj' }, true, p);
        p.hitsLeft--; p.cd = s.gap;
        if (p.hitsLeft <= 0) p.alive = false;
        break;
      }
    }
  }

  canBlock(t, a, h, isProj) {
    if (h.guard === 'unb') return false;
    if (this.opts.training && t.dummyBlock) return this.dummyBlocks(t, h);
    const st = t.state;
    const away = sgn(t.x - (isProj ? (h.srcX !== undefined ? h.srcX : a.x) : a.x));
    const holdingAway = t.input.x !== 0 && Math.sign(t.input.x) === away;
    if (!holdingAway && st !== 'block') return false;
    if (st === 'block' && !holdingAway) return false;
    const groundOK = st === 'stand' || st === 'crouch' || st === 'walkB' || st === 'walkF' || st === 'guard' || st === 'block' || st === 'land';
    if (!t.grounded) {
      // air guard: projectiles and air attacks only, never ground normals
      if (!(st === 'air' || (st === 'block' && !t.grounded))) return false;
      if (!(isProj || h.air || (a.move && a.move.type !== 'normal'))) return false;
      return true;
    }
    if (!groundOK) return false;
    const crouch = t.input.y < 0;
    if (h.guard === 'low' && !crouch) return false;
    if (h.guard === 'over' && crouch) return false;
    return true;
  }

  dummyBlocks(t, h) {
    if (!t.grounded) return false;
    if (h.guard === 'low') { t.input = { ...t.input, y: -1 }; }
    else if (h.guard === 'over') { t.input = { ...t.input, y: 0 }; }
    return ['stand', 'crouch', 'guard', 'block', 'walkB', 'walkF'].includes(t.state);
  }

  /** The victim takes a hit (or blocks it). Called only where the victim is simulated. */
  applyHit(a, t, h, mv, isProj, proj) {
    const net = this.opts.net;
    const dir = isProj ? proj.face : sgn(t.x - a.x) || a.facing;
    const blocked = this.canBlock(t, a, Object.assign({ srcX: proj ? proj.x - proj.face : undefined }, h), isProj);
    const cls = HITCLASS[h.cls] || HITCLASS.M;
    const sx = isProj ? proj.x : (a.x + t.x) / 2 + dir * 0.1;
    const sy = isProj ? proj.y : Math.min(t.y + 1.6, Math.max(t.y + 0.2, a.y + h.box[1]));
    const isSuper = mv.type === 'super';
    let result;
    // armor: absorb one hit
    if (!blocked && t.state === 'attack' && t.move && t.move.armor > t.armorHits && !isSuper && t.mf < (t.move.hits[0] ? t.move.hits[0].f + t.move.hits[0].n : 99)) {
      t.armorHits++;
      const dmg = Math.round(h.dmg * 0.5);
      t.hp -= dmg;
      t.hitstop = a.hitstop = cls.stop;
      t.flash = 6;
      this.emit({ t: 'hit', x: sx, y: sy, cls: h.cls, armor: true, who: t.id, by: a.id });
      result = { r: 'armor', dmg };
      if (t.hp <= 0) this.ko(t, a, isSuper, false);
      this.afterHit(a, t, result, proj);
      return result;
    }
    if (blocked) {
      const chip = mv.type === 'normal' ? 0 : Math.max(1, Math.round(h.dmg * (h.chip || 0.25)));
      t.hp -= chip;
      t.state = 'block'; t.st = 0; t.stunLeft = h.bs; t.move = null;
      t.blockCrouch = t.input.y < 0;
      t.vx = dir * (h.push || 0.08) * 1.15;
      t.hitstop = Math.max(4, cls.stop - 3);
      if (!isProj) a.hitstop = t.hitstop;
      if (!t.grounded) { t.vy = Math.max(t.vy, 0.02); }
      a.meter = Math.min(300, a.meter + (mv.type === 'normal' ? 3 : mv.type === 'super' ? 0 : 5));
      t.meter = Math.min(300, t.meter + 2);
      this.emit({ t: 'block', x: sx, y: sy, cls: h.cls, who: t.id, by: a.id });
      result = { r: 'block', dmg: chip };
      if (t.hp <= 0) { t.hp = 0; this.ko(t, a, isSuper, true); result.r = 'ko'; }
      this.afterHit(a, t, result, proj);
      // corner pushback goes to the attacker
      if (!isProj && Math.abs(t.x) >= STAGE_HALF - 0.05 && !a.remote) a.vx = -dir * 0.06;
      return result;
    }
    // counter hit: victim was in startup of an attack
    const counter = t.state === 'attack' && t.move && t.move.hits.length && t.mf < t.move.hits[0].f && t.move.type !== 'roll';
    const scaleTable = [1, 1, 0.85, 0.75, 0.65, 0.55, 0.5, 0.45, 0.4, 0.35];
    let scale = scaleTable[Math.min(t.combo, scaleTable.length - 1)];
    if (isSuper) scale = Math.max(scale, 0.55);
    if (a.cc > 0) scale *= 0.78;
    let dmg = Math.max(1, Math.round(h.dmg * scale * (counter ? 1.25 : 1)));
    if (this.opts.training && t.dummyNoDie) dmg = Math.min(dmg, Math.max(0, t.hp - 1));
    t.hp -= dmg;
    t.combo++; t.comboDmg += dmg; t.comboShow = 90;
    a.stats.dmg += dmg;
    a.stats.maxCombo = Math.max(a.stats.maxCombo, t.combo);
    t.lastHitBy = a;
    if (!this.firstAttack && this.phase === 'fight' && !this.opts.training) {
      this.firstAttack = true;
      this.emit({ t: 'announce', text: ANNOUNCE.first, who: a.id, small: true });
    }
    if (counter) this.emit({ t: 'announce', text: ANNOUNCE.counter, who: a.id, small: true, tiny: true });
    if (a.revFlag && t.combo === 1) { this.emit({ t: 'announce', text: ANNOUNCE.reversal, who: a.id, small: true, tiny: true }); }
    a.revFlag = false;
    t.stun += (h.stun || 0) * (counter ? 1.5 : 1); t.stunT = 0;
    if (!isSuper) a.meter = Math.min(300, a.meter + (mv.type === 'normal' ? 5 : mv.type === 'special' ? 9 : 0));
    t.meter = Math.min(300, t.meter + 3);
    const wasAir = !t.grounded;
    const crouchHit = t.crouching;
    t.move = null;
    t.hitstop = cls.stop + (counter ? 3 : 0);
    if (!isProj) a.hitstop = t.hitstop;
    t.floaty = false;
    if (t.state === 'dizzy') { t.dizzy = 0; }
    if (h.kd || wasAir || t.hp <= 0 || (a.cc > 0 && wasAir)) {
      t.state = 'fall'; t.st = 0;
      const L = h.launch || [0.05, 0.1];
      t.vx = dir * L[0];
      t.vy = Math.max(L[1], wasAir ? 0.07 : 0.04);
      t.kdOnLand = !!h.kd || t.hp <= 0;
      t.fallJuggle = !!h.juggle || a.cc > 0;
      if (a.cc > 0) { t.floaty = true; t.vy = Math.max(0.065, Math.min(t.vy, 0.09)); t.vx = dir * 0.025; t.kdOnLand = true; }
      if (!h.kd && wasAir && !(a.cc > 0) && !h.juggle) { t.kdOnLand = false; t.vy = 0.06; t.vx = dir * 0.035; }
      if (h.kd && !wasAir) t.y = Math.max(t.y, 0.01);
    } else {
      t.state = 'hit'; t.st = 0;
      t.stunLeft = h.hs + (counter ? 4 : 0);
      t.vx = dir * (h.push || 0.09);
      t.hitCrouch = crouchHit;
      t.hitHigh = h.box ? h.box[1] > 1.0 : true;
      if (Math.abs(t.x) >= STAGE_HALF - 0.05 && !isProj && !a.remote) a.vx = -dir * 0.07;
    }
    this.shake = Math.max(this.shake, h.cls === 'H' || isSuper ? 0.12 : h.cls === 'M' ? 0.06 : 0.03);
    this.emit({ t: 'hit', x: sx, y: sy, cls: h.cls, counter, who: t.id, by: a.id, combo: t.combo, dmg, super: isSuper, dir });
    result = { r: 'hit', dmg, counter };
    if (t.hp <= 0) { t.hp = 0; this.ko(t, a, isSuper, false); result.r = 'ko'; }
    this.afterHit(a, t, result, proj);
    return result;
  }

  afterHit(a, t, res, proj) {
    if (!a.remote) { a.contact = true; a.contactAt = this.frame; }
    if (this.opts.net) this.opts.net.reportHit(a, t, res, proj);
    if (this.onHit) this.onHit(a, t, res);
  }

  ko(t, a, isSuper, chip) {
    if (!t.alive) return;
    if (this.opts.training) { t.hp = 1; return; }
    t.alive = false;
    t.koBy = a.id;
    t.state = 'fall'; t.kdOnLand = true; t.fallJuggle = false;
    t.vx = sgn(t.x - a.x) * 0.06; t.vy = 0.14;
    t.move = null;
    a.stats.kos++;
    this.superKO = this.superKO || isSuper;
    this.koChip = chip;
    this.slowmo = 75;
    this.emit({ t: 'ko', who: t.id, by: a.id, super: isSuper, chip });
    if (this.onKO) this.onKO(t, a);
  }

  // ---------------------------------------------------------------- throws
  beginGrab(a, t, mv, cmd) {
    if (this.opts.net && t.remote && !a.remote) { this.opts.net.requestGrab(a, t, mv, cmd); return; }
    a.grabbed = t; t.grabber = a;
    a.grabT = 0; a.grabCmd = cmd; a.grabMove = mv;
    t.state = 'thrown'; t.st = 0; t.move = null; t.soft = false; t.vx = 0; t.vy = 0;
    t.combo = 0;
    a.stats.throws++;
    a.vx = 0;
    if (mv.type === 'super') { /* flash already happened */ }
    this.emit({ t: 'grab', who: a.id, target: t.id, cmd });
  }

  stepGrab(a) {
    const t = a.grabbed;
    const mv = a.grabMove;
    const g = mv.grab;
    a.grabT++;
    const T = a.grabT;
    // throw softening: victim presses a button early
    if (!a.grabCmd && T <= 8 && !t.soft && t.input && (t.input.pressed & (PUNCHES | KICKS))) {
      t.soft = true;
      this.emit({ t: 'announce', text: ANNOUNCE.soft, who: t.id, small: true, tiny: true });
    }
    const anim = g.anim || 'throw';
    const total = anim === 'atomic' ? 78 : anim === 'piledriver' ? 56 : 30;
    a.grabAnim = anim; a.grabTotal = total;
    // position the victim
    const over = !!g.swap !== !!a.throwBack; // over-the-shoulder toss lands behind the thrower
    if (t.remote) {
      if (anim !== 'throw') a.y = Math.max(0, Math.sin(Math.min(1, (T / total) * 1.2) * Math.PI) * (anim === 'atomic' ? 2.6 : 1.8));
      if (T >= total) { a.grabbed = null; a.y = 0; a.vy = 0; a.move = null; a.state = 'land'; a.st = 0; a.landT = 12; this.shake = 0.2; }
      return;
    }
    if (anim === 'throw') {
      const k = Math.min(1, T / total);
      if (over) {
        const ang = Math.max(0, (k - 0.3) / 0.7) * Math.PI;
        t.x = a.x + a.facing * 0.72 * Math.cos(ang);
        t.y = 0.15 + Math.sin(ang) * 1.25;
      } else {
        t.x = a.x + a.facing * (0.7 + k * 0.2);
        t.y = 0.15 + Math.sin(k * Math.PI) * 0.5;
      }
      t.grabSpin = over ? k : 0;
    } else {
      const k = T / total;
      const up = anim === 'atomic' ? Math.sin(Math.min(1, k * 1.3) * Math.PI) * 2.6 : Math.sin(Math.min(1, k * 1.15) * Math.PI) * 1.8;
      a.y = Math.max(0, up);
      t.x = a.x + a.facing * 0.25; t.y = a.y + 1.2;
      t.grabSpin = k;
    }
    if (T >= total) {
      let dmg = g.dmg;
      if (t.soft) dmg = Math.round(dmg * 0.5);
      if (this.opts.training && t.dummyNoDie) dmg = Math.min(dmg, t.hp - 1);
      t.hp -= dmg;
      a.stats.dmg += dmg;
      t.combo = 1; t.comboDmg = dmg; t.comboShow = 90;
      t.grabber = null; a.grabbed = null;
      a.y = 0; a.vy = 0;
      const dirOut = anim === 'throw' && over ? -a.facing : a.facing;
      t.state = 'fall'; t.st = 0; t.kdOnLand = true; t.fallJuggle = false;
      t.vx = dirOut * g.toss[0]; t.vy = g.toss[1];
      t.noTech = !t.soft;
      if (anim !== 'throw') { t.x = a.x + a.facing * 0.4; t.y = 0.5; t.vy = 0.06; }
      if (t.soft) t.techHint = 8;
      t.x = clamp(t.x, -STAGE_HALF, STAGE_HALF);
      this.shake = 0.2;
      this.emit({ t: 'hit', x: t.x, y: Math.max(0.3, t.y), cls: 'H', who: t.id, by: a.id, throw: true, dmg, super: mv.type === 'super' });
      a.meter = Math.min(300, a.meter + (mv.type === 'super' ? 0 : 8));
      const res = { r: 'hit', dmg, grab: true };
      if (t.hp <= 0) { t.hp = 0; this.ko(t, a, mv.type === 'super', false); res.r = 'ko'; }
      this.afterHit(a, t, res, null);
      a.move = null; a.state = 'land'; a.st = 0; a.landT = anim === 'throw' ? 10 : 18;
      if (a.grabMove.type === 'super') a.landT = 24;
    }
  }

  // ---------------------------------------------------------------- flow
  flowStep(frozen) {
    this.pt++;
    const live = this.living();
    switch (this.phase) {
      case 'intro':
        if (this.pt === 1) this.emit({ t: 'intro' });
        if (this.pt >= 150 || this.skipIntro) {
          this.phase = 'ready'; this.pt = 0; this.skipIntro = false;
          this.fighters.forEach((f) => { if (f.state === 'intro') { f.state = 'stand'; f.st = 0; } });
        }
        break;
      case 'ready':
        if (this.pt === 2) this.emit({ t: 'announce', text: ANNOUNCE.round(this.round, this.isFinalRound()), big: true, voice: 'round' + (this.isFinalRound() ? 'F' : this.round) });
        if (this.pt === 70) this.emit({ t: 'announce', text: ANNOUNCE.fight, big: true, voice: 'fight' });
        if (this.pt >= 80) { this.phase = 'fight'; this.pt = 0; }
        break;
      case 'fight':
        if (frozen) break;
        if (!this.opts.training && this.opts.time > 0 && (!this.opts.net || this.opts.net.isHost)) {
          if (++this.timerSub >= 50) { this.timerSub = 0; this.timer = Math.max(0, this.timer - 1); if (this.timer <= 10 && this.timer > 0) this.emit({ t: 'tick' }); }
          if (this.timer <= 0) { if (this.opts.net) this.opts.net.hostTimeOver(); else this.endRound('time'); break; }
        }
        if (live.length <= 1 && !this.opts.training && !this.opts.net) this.endRound('ko');
        if (this.opts.net && this.opts.net.flowCheck) this.opts.net.flowCheck(this);
        break;
      case 'ko':
        if (this.pt >= 70 && this.winner && !this.winSet && this.winner.grounded && ['stand', 'crouch', 'walkF', 'walkB', 'guard', 'land', 'block', 'hit'].includes(this.winner.state)) {
          const w = this.winner;
          this.winSet = true;
          w.state = 'win'; w.st = 0; w.vx = 0; w.move = null;
          this.emit({ t: 'roundWin', who: w.id });
        }
        if (this.pt === 90) {
          const w = this.winner;
          if (w) {
            const perfect = w.hp >= w.maxHp;
            if (perfect) { this.emit({ t: 'announce', text: ANNOUNCE.perfect, big: true, voice: 'perfect' }); w.stats.perfects++; }
            else if (this.endReason === 'time') this.emit({ t: 'announce', text: ANNOUNCE.timeOver, big: true, voice: 'timeover' });
          } else this.emit({ t: 'announce', text: this.endReason === 'time' ? ANNOUNCE.draw : ANNOUNCE.doubleKo, big: true, voice: 'draw' });
        }
        if (this.pt >= 220) { if (this.opts.net) { if (this.pt === 220) this.opts.net.afterRound(); } else this.afterRound(); }
        break;
      case 'matchEnd':
        break;
    }
  }

  endRound(reason) {
    if (this.phase !== 'fight') return;
    this.phase = 'ko'; this.pt = 0;
    this.endReason = reason;
    const live = this.living();
    let w = null;
    if (reason === 'time') {
      this.emit({ t: 'announce', text: ANNOUNCE.timeOver, big: true, voice: 'timeover' });
      this.pt = 30;
      let best = -1, tie = false;
      for (const f of live) {
        const r = f.hp / f.maxHp;
        if (r > best + 1e-6) { best = r; w = f; tie = false; } else if (Math.abs(r - best) < 1e-6) tie = true;
      }
      if (tie) w = null;
      for (const f of live) if (f !== w) { f.state = 'stand'; }
    } else {
      w = live.length === 1 ? live[0] : null;
      this.emit({ t: 'announce', text: w ? ANNOUNCE.ko : ANNOUNCE.doubleKo, big: true, voice: 'ko', super: this.superKO });
    }
    this.winner = w;
    if (w) {
      w.wins++;
      const perfect = w.hp >= w.maxHp;
      w.marks.push(perfect ? 'P' : reason === 'time' ? 'T' : this.superKO ? 'S' : this.koChip ? 'C' : this.ccKO ? 'X' : 'V');
    } else {
      this.drawCount++;
      for (const f of live) { f.wins++; f.marks.push('D'); }
      if (!live.length) for (const f of this.fighters.filter((q) => !q.gone)) { f.wins++; f.marks.push('D'); }
    }
  }

  afterRound() {
    const need = this.opts.rounds;
    const fs = this.fighters.filter((f) => !f.gone);
    const champs = fs.filter((f) => f.wins >= need);
    const maxRounds = need * 2 + 1;
    if (champs.length === 1 || (champs.length > 1 && this.round >= maxRounds)) {
      this.phase = 'matchEnd'; this.pt = 0;
      this.matchWinner = champs.length === 1 ? champs[0] : null;
      this.emit({ t: 'matchEnd', winner: this.matchWinner ? this.matchWinner.id : -1 });
      return;
    }
    if (champs.length > 1) { champs.forEach((f) => { f.wins = need - 1; }); }
    this.startRound();
  }

  /** Training reset: both fighters back to centre, full health. */
  resetPositions() {
    const pts = this.spawnPoints();
    this.fighters.forEach((f, i) => { const m = f.meter; f.resetRound(pts[i][0], pts[i][1]); f.meter = m; });
    this.projs.length = 0;
  }
}

// ---- src/ai.js
// ============================================================================
// ai.js — CPU opponents. The CPU produces the same input frames a player
// would (directions + button presses), so it obeys every rule of the sim.
// ============================================================================

const MOTION_SEQ = {
  QCF: [2, 3, 6], QCB: [2, 1, 4], DP: [6, 2, 3], QCF2: [2, 3, 6, 2, 3, 6], HCB: [6, 3, 2, 1, 4],
  '360': [6, 3, 2, 1, 4, 7, 8],
};

class CPU {
  constructor(fighter, level = 4, opts = {}) {
    this.f = fighter;
    this.level = level; // 1..8
    this.plan = [];
    this.wait = 0;
    this.rng = opts.rng || Math.random;
    this.attract = !!opts.attract;
    this.kit = this.classify(fighter.ch);
    this.lastDecision = '';
  }

  classify(ch) {
    const kit = { proj: null, aa: null, rush: [], grab: null, supers: ch.supers, airProj: null, tele: null };
    for (const sp of ch.specials) {
      const m = sp.v[0];
      if (m.proj && !kit.proj && !sp.airOnly) kit.proj = sp;
      if (m.proj && sp.airOK) kit.airProj = sp;
      else if ((sp.motion === 'DP' || sp.motion === 'CHARGE_DU') && m.inv && m.hits.length && !kit.aa) kit.aa = sp;
      else if (m.grab) kit.grab = sp;
      else if (m.tele) kit.tele = sp;
      else if (!sp.airOnly) kit.rush.push(sp);
    }
    return kit;
  }

  r() { return this.rng(); }

  /** Queue a motion + button. Directions are relative (6 = toward the target). */
  queueMotion(motion, btn) {
    const P = [];
    const hold = 2;
    if (motion === 'CHARGE_BF') { for (let i = 0; i < 40; i++) P.push({ d: 4 }); P.push({ d: 6, p: btn }); }
    else if (motion === 'CHARGE_DU') { for (let i = 0; i < 40; i++) P.push({ d: 1 }); P.push({ d: 8, p: btn }); }
    else if (motion === 'CHARGE_DB2') { for (let i = 0; i < 40; i++) P.push({ d: 1 }); P.push({ d: 3 }, { d: 3 }, { d: 2 }, { d: 1 }, { d: 1 }, { d: 4 }, { d: 7 }, { d: 9, p: btn }); }
    else if (motion === 'MASH_K') { for (let i = 0; i < 4; i++) { P.push({ d: 5, p: btn }); P.push({ d: 5 }); P.push({ d: 5 }); } }
    else {
      const seq = MOTION_SEQ[motion] || [5];
      seq.forEach((d, i) => { for (let k = 0; k < hold; k++) P.push({ d, p: i === seq.length - 1 && k === hold - 1 ? btn : 0 }); });
    }
    this.plan.push(...P);
  }
  queue(d, p = 0, n = 1) { for (let i = 0; i < n; i++) this.plan.push({ d, p: i === 0 ? p : 0 }); }
  hold(d, n) { for (let i = 0; i < n; i++) this.plan.push({ d }); }

  /** Convert a relative plan step into an input frame using current facing. */
  toInput(step) {
    const d = step.d || 5;
    const rx = ((d - 1) % 3) - 1;
    const y = d >= 7 ? 1 : d <= 3 ? -1 : 0;
    const x = rx * this.f.facing;
    const p = step.p || 0;
    return { x, y, held: p, pressed: p, cc: !!step.cc, roll: !!step.roll, any: false };
  }

  canAct() {
    const st = this.f.state;
    return st === 'stand' || st === 'crouch' || st === 'walkF' || st === 'walkB' || st === 'guard' || st === 'land' || st === 'block' || st === 'air' || st === 'dash';
  }

  think(match) {
    const f = this.f, t = f.target;
    if (!t || match.phase !== 'fight') { this.plan.length = 0; return NO_INPUT; }
    if (this.plan.length) return this.toInput(this.plan.shift());
    if (f.state === 'dizzy') return this.toInput({ d: this.r() < 0.5 ? 4 : 6, p: BTN.LP << Math.floor(this.r() * 6) });
    if (f.state === 'fall' || f.state === 'thrown') {
      if (this.r() < 0.04 * this.level) return this.toInput({ d: 5, p: BTN.LP | BTN.LK });
      return NO_INPUT;
    }
    if (!this.canAct()) {
      // buffer a cancel during our own attack on contact
      if (f.state === 'attack' && f.contact && f.move && f.move.cancel === 'sp' && this.r() < 0.12 * this.level) this.comboFinisher();
      return NO_INPUT;
    }
    if (this.wait > 0) { this.wait--; return this.toInput({ d: this.idleDir() }); }
    this.decide(match);
    this.wait = Math.max(0, Math.round((9 - this.level) * 2.2 * this.r()));
    return this.plan.length ? this.toInput(this.plan.shift()) : NO_INPUT;
  }

  idleDir() {
    // charge characters keep a charge while they wait
    const ch = this.f.ch;
    if (ch.specials.some((s) => s.motion.startsWith('CHARGE'))) return this.f.state === 'crouch' || this.r() < 0.5 ? 1 : 4;
    return 5;
  }

  comboFinisher() {
    const f = this.f, k = this.kit;
    if (f.meter >= 100 && this.r() < 0.5) {
      const s = k.supers[Math.floor(this.r() * k.supers.length)];
      if (s.motion !== 'CHARGE_DB2') { this.queueMotion(s.motion, this.strBtn(s.btn, Math.min(2, Math.floor(f.meter / 100) - 1))); return; }
    }
    const opts = [k.proj, ...k.rush, k.aa].filter(Boolean).filter((s) => !s.motion.startsWith('CHARGE') || this.chargeReady(s.motion));
    if (!opts.length) return;
    const s = opts[Math.floor(this.r() * opts.length)];
    if (s.motion.startsWith('CHARGE')) this.plan.push({ d: s.motion === 'CHARGE_BF' ? 6 : 8, p: this.strBtn(s.btn, 2) });
    else this.queueMotion(s.motion, this.strBtn(s.btn, Math.floor(this.r() * 3)));
  }

  chargeReady(m) {
    const c = this.f.charge;
    if (m === 'CHARGE_BF') return c.b >= 36 || c.bfReady > 0;
    if (m === 'CHARGE_DU') return c.d >= 36 || c.duReady > 0;
    return false;
  }

  strBtn(kind, s) { return kind === 'P' ? [BTN.LP, BTN.MP, BTN.HP][s] : [BTN.LK, BTN.MK, BTN.HK][s]; }

  decide(match) {
    const f = this.f, t = f.target, k = this.kit, L = this.level;
    const dist = Math.abs(t.x - f.x);
    const r = this.r();
    const tAttacking = t.state === 'attack' && t.move && t.move.hits.length;
    const incoming = match.projs.find((p) => p.owner !== f && Math.sign(p.vx) === Math.sign(f.x - p.x) && Math.abs(p.x - f.x) < 3.4);
    const attract = this.attract;

    if (f.state === 'air') {
      if (dist < 1.6 && f.vy < 0.04 && r < 0.6) this.queue(5, [BTN.HK, BTN.MK, BTN.HP, BTN.MP][Math.floor(this.r() * 4)]);
      else if (k.airProj && f.y > 1 && r < 0.05 * L) this.queueMotion(k.airProj.motion, BTN.MP);
      else if (f.ch.specials.find((s) => s.airOnly) && f.y > 1.2 && dist < 3 && r < 0.05 * L) this.queueMotion('QCF', BTN.MK);
      return;
    }
    // blocking stance: alpha counter
    if (f.state === 'block') {
      if (f.meter >= 100 && r < 0.05 * L + (attract ? 0.3 : 0)) { this.queue(6, BTN.LP | BTN.LK); return; }
      this.hold(t.move && t.move.hits[0] && t.move.hits[0].guard === 'low' ? 1 : 4, 6);
      return;
    }
    // defend against an incoming projectile
    if (incoming) {
      if (r < 0.25 + 0.05 * L) {
        const c = this.r();
        if (k.proj && c < 0.35) this.queueMotion(k.proj.motion, BTN.MP);
        else if (c < 0.6 && dist < 4.5) this.queue(9, 0, 1);
        else if (c < 0.75) this.queue(5, 0, 0), this.plan.push({ d: 6, roll: true });
        else this.hold(4, 16);
        return;
      }
    }
    // react to an attack
    if (tAttacking && dist < 2.4 && r < 0.18 + 0.08 * L) {
      const low = t.move.hits[0].guard === 'low' || t.crouching;
      this.hold(low ? 1 : 4, 10 + Math.floor(this.r() * 10));
      return;
    }
    // anti-air
    if (t.state === 'air' && dist < 2.6 && Math.sign(t.vx) === Math.sign(f.x - t.x) && r < 0.12 + 0.09 * L) {
      if (k.aa && (k.aa.motion === 'DP' || this.chargeReady(k.aa.motion))) {
        if (k.aa.motion === 'DP') this.queueMotion('DP', this.strBtn(k.aa.btn, 2));
        else this.plan.push({ d: 8, p: this.strBtn(k.aa.btn, 2) });
      } else this.queue(2, BTN.HP);
      return;
    }
    // custom combo or supers with a full gauge
    if (f.meter >= 200 && dist < 1.5 && r < (attract ? 0.4 : 0.05 * L)) {
      this.plan.push({ d: 5, cc: true });
      this.hold(5, 30);
      const seq = [[3, BTN.LK], [3, BTN.MK], [2, BTN.MP], [5, BTN.HP], [2, BTN.HK]];
      for (let i = 0; i < 8; i++) { const [d, b] = seq[i % seq.length]; this.queue(d, b); this.hold(d, 5); }
      if (k.aa && k.aa.motion === 'DP') this.queueMotion('DP', this.strBtn(k.aa.btn, 2));
      return;
    }
    if (f.meter >= 100 && dist < 2.2 && r < (attract ? 0.25 : 0.015 * L)) {
      const s = k.supers[Math.floor(this.r() * k.supers.length)];
      this.queueMotion(s.motion, this.strBtn(s.btn, Math.min(2, Math.floor(f.meter / 100) - 1)));
      return;
    }
    if (dist < 0.95 && r < 0.3 && f.grounded) {
      if (k.grab && r < 0.15) this.queueMotion('360', this.strBtn('P', 2));
      else this.queue(this.r() < 0.5 ? 6 : 4, this.r() < 0.5 ? BTN.HP : BTN.HK);
      return;
    }
    if (dist < 1.4) {
      const c = this.r();
      if (c < 0.3) { this.queue(2, BTN.MK); this.hold(2, 6); if (this.r() < 0.1 * L) this.comboFinisher(); }
      else if (c < 0.45) { this.queue(2, BTN.LK); this.hold(2, 9); this.queue(2, BTN.LK); this.hold(2, 9); this.queue(5, BTN.LP); }
      else if (c < 0.58) { this.queue(2, BTN.HK); this.hold(2, 20); }
      else if (c < 0.7) { this.queue(5, BTN.MP); if (this.r() < 0.1 * L) { this.hold(5, 6); this.comboFinisher(); } }
      else if (c < 0.8) { const cm = f.ch.commands[0]; this.queue(Number(cm.input[0]), BTN[cm.input.slice(1)]); }
      else if (c < 0.88) this.hold(4, 14);
      else this.plan.push({ d: 4, roll: true });
      return;
    }
    if (dist < 3) {
      const c = this.r();
      if (c < 0.3) this.hold(6, 10 + Math.floor(this.r() * 14));
      else if (c < 0.45) { this.queue(9); this.hold(9, 3); }
      else if (c < 0.6) { this.queue(2, BTN.MK); this.hold(2, 8); }
      else if (c < 0.7 && k.rush.length) { const s = k.rush[Math.floor(this.r() * k.rush.length)]; if (!s.motion.startsWith('CHARGE') || this.chargeReady(s.motion)) this.queueMotion(s.motion.startsWith('CHARGE') ? 'QCF' : s.motion, this.strBtn(s.btn, Math.floor(this.r() * 3))); }
      else if (c < 0.78 && k.tele) this.queueMotion(k.tele.motion, this.strBtn(k.tele.btn, 2));
      else if (c < 0.86) { this.queue(6); this.queue(5); this.queue(6); this.hold(6, 4); }
      else this.hold(this.idleDir(), 12);
      return;
    }
    // far away
    const c = this.r();
    if (k.proj && c < 0.35) {
      if (k.proj.motion === 'CHARGE_BF') this.queueMotion('CHARGE_BF', this.strBtn('P', Math.floor(this.r() * 3)));
      else this.queueMotion(k.proj.motion, this.strBtn(k.proj.btn, Math.floor(this.r() * 3)));
    } else if (c < 0.55) this.hold(6, 20 + Math.floor(this.r() * 20));
    else if (c < 0.68) { this.queue(9); this.hold(9, 3); }
    else if (c < 0.78) { this.queue(6); this.queue(5); this.queue(6); this.hold(6, 4); }
    else if (k.tele && c < 0.85) this.queueMotion(k.tele.motion, this.strBtn(k.tele.btn, Math.floor(this.r() * 3)));
    else this.hold(this.idleDir(), 15);
  }
}

/** Training dummy behaviours. */
function dummyInput(f, mode, match) {
  const t = f.target;
  f.dummyBlock = mode === 'block';
  f.dummyNoDie = true;
  if (mode === 'crouch') return { x: 0, y: -1, held: 0, pressed: 0 };
  if (mode === 'jump') return { x: 0, y: f.grounded && f.state !== 'land' ? 1 : 0, held: 0, pressed: 0 };
  if (mode === 'block' && t) return { x: Math.sign(f.x - t.x), y: 0, held: 0, pressed: 0 };
  if (mode === 'tech') {
    if (f.state === 'fall' || f.state === 'thrown') return { x: 0, y: 0, held: BTN.LP | BTN.LK, pressed: match.frame % 2 ? BTN.LP | BTN.LK : 0 };
    return NO_INPUT;
  }
  return NO_INPUT;
}

// ---- src/input.js
// ============================================================================
// input.js — keyboard + standard-mapping gamepads, controller-first.
// Game input is read per sim step (presses accumulate between steps);
// menu input is read per render frame.
// ============================================================================

const PAD = { CROSS: 0, CIRCLE: 1, SQUARE: 2, TRIANGLE: 3, L1: 4, R1: 5, L2: 6, R2: 7, CREATE: 8, OPTIONS: 9, L3: 10, R3: 11, UP: 12, DOWN: 13, LEFT: 14, RIGHT: 15 };
// Fighting layout on a DualSense: punches on Square / Triangle / R1, kicks on Cross / Circle / R2.
const PAD_ATTACK = { [PAD.SQUARE]: BTN.LP, [PAD.TRIANGLE]: BTN.MP, [PAD.R1]: BTN.HP, [PAD.CROSS]: BTN.LK, [PAD.CIRCLE]: BTN.MK, [PAD.R2]: BTN.HK };

const KEYMAPS = {
  kb1: { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'],
    LP: ['KeyU'], MP: ['KeyI'], HP: ['KeyO'], LK: ['KeyJ'], MK: ['KeyK'], HK: ['KeyL'], cc: ['KeyY'], roll: ['KeyH'] },
  kb2: { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'],
    LP: ['Numpad4', 'Insert'], MP: ['Numpad5', 'Home'], HP: ['Numpad6', 'PageUp'], LK: ['Numpad1', 'Delete'], MK: ['Numpad2', 'End'], HK: ['Numpad3', 'PageDown'], cc: ['Numpad7', 'NumpadAdd'], roll: ['Numpad0', 'NumpadEnter'] },
};

const Input = {
  held: new Set(),
  edge: new Set(),          // keys pressed for this frame's menu read
  edgeQ: [],                // queued key presses: a repeat of the same key waits for the next frame, so no press is lost
  takeEdges() {
    this.edge = new Set();
    const rest = [];
    for (const c of this.edgeQ) { if (this.edge.has(c)) rest.push(c); else this.edge.add(c); }
    this.edgeQ = rest;
  },
  gameEdge: [0, 0, 0, 0],   // per slot: attack bits pressed since last game read
  gameFlags: [{}, {}, {}, {}],
  padPrev: [],
  padNow: [],
  lastInputAt: performance.now(),
  anyEdge: false,
  settings: { invertX: false, invertY: false },
  slots: [{ kb: ['kb1', 'kb2'], pads: 'all' }, { kb: [], pads: [] }],
  createHeld: false,
  lastDevice: 'keyboard',
  probe: { x: 0, y: 0, held: 0 },

  init() {
    window.addEventListener('keydown', (e) => {
      if (e.repeat) { if (this.isGameKey(e.code)) e.preventDefault(); return; }
      this.held.add(e.code);
      this.edgeQ.push(e.code);
      this.anyEdge = true;
      this.lastInputAt = performance.now();
      this.lastDevice = 'keyboard';
      for (let s = 0; s < this.slots.length; s++) this.accumulateKey(s, e.code);
      if (this.isGameKey(e.code) || e.code === 'Space' || e.code === 'Tab') e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { this.held.delete(e.code); });
    window.addEventListener('blur', () => this.held.clear());
    window.addEventListener('pointerdown', () => { this.lastInputAt = performance.now(); this.anyEdge = true; });
    window.addEventListener('mousemove', () => { this.lastInputAt = performance.now(); });
  },

  isGameKey(code) {
    return code.startsWith('Arrow') || code.startsWith('Numpad') || /^Key[WASDUIOJKLYH]$/.test(code);
  },

  setLocal2P(on) {
    const pads = this.connectedPads();
    if (!on) { this.slots = [{ kb: ['kb1', 'kb2'], pads: 'all' }, { kb: [], pads: [] }]; return; }
    if (pads.length >= 2) this.slots = [{ kb: ['kb1'], pads: [pads[0].index] }, { kb: ['kb2'], pads: [pads[1].index] }];
    else if (pads.length === 1) this.slots = [{ kb: [], pads: [pads[0].index] }, { kb: ['kb1', 'kb2'], pads: [] }];
    else this.slots = [{ kb: ['kb1'], pads: [] }, { kb: ['kb2'], pads: [] }];
  },
  slotDescription(i) {
    const s = this.slots[i];
    if (!s) return '—';
    const parts = [];
    if (s.pads === 'all' || s.pads.length) parts.push('Controller');
    if (s.kb.length === 2) parts.push('Keyboard');
    else if (s.kb[0] === 'kb1') parts.push('Keys WASD + U I O / J K L');
    else if (s.kb[0] === 'kb2') parts.push('Keys Arrows + Numpad');
    return parts.join(' / ') || '—';
  },

  accumulateKey(slot, code) {
    const s = this.slots[slot];
    if (!s) return;
    for (const k of s.kb) {
      const m = KEYMAPS[k];
      for (const b of BTN_ORDER) if (m[b].includes(code)) this.gameEdge[slot] |= BTN[b];
      if (m.cc.includes(code)) this.gameFlags[slot].cc = true;
      if (m.roll.includes(code)) this.gameFlags[slot].roll = true;
    }
  },

  connectedPads() {
    const list = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter((p) => p && p.connected) : [];
    return list;
  },

  /** Poll gamepads once per render frame; records edges into game slots and menu state. */
  poll() {
    const pads = this.connectedPads();
    this.padNow = pads;
    this.createHeld = false;
    for (const p of pads) {
      const prev = this.padPrev[p.index] || [];
      const cur = p.buttons.map((b) => b.pressed || b.value > 0.5);
      if (cur[PAD.CREATE]) this.createHeld = true;
      for (let i = 0; i < cur.length; i++) {
        if (cur[i] && !prev[i]) {
          this.anyEdge = true;
          this.lastInputAt = performance.now();
          this.lastDevice = 'pad';
          for (let s = 0; s < this.slots.length; s++) {
            const sl = this.slots[s];
            if (sl.pads === 'all' || sl.pads.includes(p.index)) {
              if (PAD_ATTACK[i]) this.gameEdge[s] |= PAD_ATTACK[i];
              if (i === PAD.L1) this.gameFlags[s].cc = true;
              if (i === PAD.L2) this.gameFlags[s].roll = true;
            }
          }
          this.padEdges.push({ pad: p.index, b: i });
        }
      }
      // stick edges per pad (synthetic D-pad presses) for two-player menus
      const [sx, sy] = this.stickDir(p);
      const sk = sx + ',' + sy, pk = this.stickPrev[p.index] || '0,0';
      if (sk !== pk && (sx || sy)) {
        if (sx < 0) this.padEdges.push({ pad: p.index, b: PAD.LEFT, stick: true });
        if (sx > 0) this.padEdges.push({ pad: p.index, b: PAD.RIGHT, stick: true });
        if (sy > 0) this.padEdges.push({ pad: p.index, b: PAD.UP, stick: true });
        if (sy < 0) this.padEdges.push({ pad: p.index, b: PAD.DOWN, stick: true });
      }
      this.stickPrev[p.index] = sk;
      const ax = Math.abs(p.axes[0] || 0) > 0.5 || Math.abs(p.axes[1] || 0) > 0.5;
      if (ax) { this.lastInputAt = performance.now(); }
      if (ax && !this.padAxisPrev[p.index]) this.anyEdge = true;
      this.padAxisPrev[p.index] = ax;
      this.padPrev[p.index] = cur;
    }
  },
  padEdges: [],
  padAxisPrev: [],
  stickPrev: [],
  stickDir(p) {
    const x = p.axes[0] || 0, y = p.axes[1] || 0;
    let dx = Math.abs(x) > 0.6 ? Math.sign(x) : 0, dy = Math.abs(y) > 0.6 ? -Math.sign(y) : 0;
    if (this.settings.invertX) dx = -dx;
    if (this.settings.invertY) dy = -dy;
    return [dx, dy];
  },

  padDir(p) {
    let x = p.axes[0] || 0, y = p.axes[1] || 0;
    const b = (i) => p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.5);
    let dx = Math.abs(x) > 0.42 ? Math.sign(x) : 0;
    let dy = Math.abs(y) > 0.42 ? -Math.sign(y) : 0;
    if (b(PAD.LEFT)) dx = -1; if (b(PAD.RIGHT)) dx = 1;
    if (b(PAD.UP)) dy = 1; if (b(PAD.DOWN)) dy = -1;
    if (this.settings.invertX) dx = -dx;
    if (this.settings.invertY) dy = -dy;
    return [dx, dy];
  },

  /** Held state for a slot without consuming presses (the probe reads this). */
  peek(slot) {
    const s = this.slots[slot];
    if (!s) return { x: 0, y: 0, held: 0 };
    let x = 0, y = 0, held = 0;
    for (const k of s.kb) {
      const m = KEYMAPS[k];
      const h = (arr) => arr.some((c) => this.held.has(c));
      if (h(m.left)) x -= 1; if (h(m.right)) x += 1;
      if (h(m.up)) y += 1; if (h(m.down)) y -= 1;
      for (const b of BTN_ORDER) if (h(m[b])) held |= BTN[b];
    }
    for (const p of this.connectedPads()) {
      if (!(s.pads === 'all' || s.pads.includes(p.index))) continue;
      const [dx, dy] = this.padDir(p);
      if (dx) x = dx; if (dy) y = dy;
      for (const i in PAD_ATTACK) if (p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.5)) held |= PAD_ATTACK[i];
    }
    return { x: Math.sign(x), y: Math.sign(y), held };
  },

  /** One sim step of input for a player slot: held directions and buttons, plus presses since the last read. */
  readGame(slot) {
    const s = this.slots[slot];
    if (!s) return NO_INPUT;
    let x = 0, y = 0, held = 0;
    for (const k of s.kb) {
      const m = KEYMAPS[k];
      const h = (arr) => arr.some((c) => this.held.has(c));
      if (h(m.left)) x -= 1; if (h(m.right)) x += 1;
      if (h(m.up)) y += 1; if (h(m.down)) y -= 1;
      for (const b of BTN_ORDER) if (h(m[b])) held |= BTN[b];
    }
    for (const p of this.padNow) {
      if (!(s.pads === 'all' || s.pads.includes(p.index))) continue;
      const [dx, dy] = this.padDir(p);
      if (dx) x = dx; if (dy) y = dy;
      for (const i in PAD_ATTACK) if (p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.5)) held |= PAD_ATTACK[i];
    }
    x = Math.sign(x); y = Math.sign(y);
    const pressed = this.gameEdge[slot];
    const f = this.gameFlags[slot];
    this.gameEdge[slot] = 0;
    this.gameFlags[slot] = {};
    const out = { x, y, held, pressed, cc: !!f.cc, roll: !!f.roll, any: !!pressed };
    if (slot === 0) this.probe = { x, y, held };
    return out;
  },
  clearGame() { this.gameEdge = [0, 0, 0, 0]; this.gameFlags = [{}, {}, {}, {}]; },

  /** Menu actions since last call (any device). */
  menu() {
    const e = this.edge;
    const k = (...codes) => codes.some((c) => e.has(c));
    const m = {
      up: k('ArrowUp', 'KeyW'), down: k('ArrowDown', 'KeyS'), left: k('ArrowLeft', 'KeyA'), right: k('ArrowRight', 'KeyD'),
      confirm: k('Enter', 'Space', 'KeyU', 'KeyJ', 'NumpadEnter'), back: k('Escape', 'Backspace'), start: k('Escape'),
      tabL: k('KeyQ', 'PageUp'), tabR: k('KeyE', 'PageDown'), alt: k('KeyX', 'KeyI'), any: this.anyEdge, pause: k('Escape', 'Enter') && false,
      padStart: false, source: e.size ? 'keyboard' : null,
    };
    for (const pe of this.padEdges) {
      if (pe.stick) continue;
      const b = pe.b;
      let up = b === PAD.UP, down = b === PAD.DOWN, left = b === PAD.LEFT, right = b === PAD.RIGHT;
      if (this.settings.invertX && (left || right)) { const t = left; left = right; right = t; }
      if (this.settings.invertY && (up || down)) { const t = up; up = down; down = t; }
      m.up ||= up; m.down ||= down; m.left ||= left; m.right ||= right;
      if (b === PAD.CROSS) m.confirm = true;
      if (b === PAD.CIRCLE) m.back = true;
      if (b === PAD.TRIANGLE) m.alt = true;
      if (b === PAD.L1) m.tabL = true;
      if (b === PAD.R1) m.tabR = true;
      if (b === PAD.OPTIONS && !this.createHeld) m.padStart = true;
      m.source = 'pad';
    }
    // analogue stick menu navigation with repeat
    const now = performance.now();
    for (const p of this.padNow) {
      const [dx, dy] = this.padDir(p);
      const rawStick = Math.abs(p.axes[0] || 0) > 0.6 || Math.abs(p.axes[1] || 0) > 0.6;
      if (!rawStick) continue;
      const key = dx + ',' + dy;
      if (key !== this.stickKey || now > this.stickNext) {
        const first = key !== this.stickKey;
        this.stickKey = key;
        this.stickNext = now + (first ? 380 : 140);
        if (dy > 0) m.up = true; if (dy < 0) m.down = true;
        if (dx < 0) m.left = true; if (dx > 0) m.right = true;
      }
    }
    if (!this.padNow.some((p) => Math.abs(p.axes[0] || 0) > 0.6 || Math.abs(p.axes[1] || 0) > 0.6)) this.stickKey = null;
    this.edge = new Set();
    this.padEdges = [];
    this.anyEdge = false;
    return m;
  },
  stickKey: null,
  stickNext: 0,

  isTouchOnly() {
    const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    const fine = window.matchMedia && matchMedia('(any-pointer: fine)').matches;
    return ('ontouchstart' in window || navigator.maxTouchPoints > 0) && coarse && !fine && this.connectedPads().length === 0;
  },
};

// ---- src/audio.js
// ============================================================================
// audio.js — everything you hear is synthesised here with WebAudio:
// a step sequencer for the music, synth SFX, and gibberish "Animalese"
// voices for the announcer and fighters.
// ============================================================================

const Snd = {
  ctx: null, master: null, music: null, sfx: null, voice: null, verb: null, comp: null,
  vol: { master: 0.8, music: 0.55, sfx: 0.8, voice: 0.8 },
  song: null, songName: null, nextStep: 0, step: 0, timer: null, muted: false, noiseBuf: null,
  quiet: false,

  unlock() {
    if (this.quiet) return;
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      const c = this.ctx;
      this.comp = c.createDynamicsCompressor();
      this.comp.threshold.value = -14; this.comp.ratio.value = 4;
      this.master = c.createGain();
      this.master.connect(this.comp); this.comp.connect(c.destination);
      this.music = c.createGain(); this.sfx = c.createGain(); this.voice = c.createGain();
      this.music.connect(this.master); this.sfx.connect(this.master); this.voice.connect(this.master);
      this.verb = c.createConvolver();
      this.verb.buffer = this.impulse(2.2, 2.5);
      this.verbSend = c.createGain(); this.verbSend.gain.value = 0.35;
      this.verbSend.connect(this.verb); this.verb.connect(this.master);
      const len = c.sampleRate * 1.5;
      this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.applyVolumes();
      this.timer = setInterval(() => this.schedule(), 25);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },

  applyVolumes() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(this.muted ? 0 : this.vol.master, t, 0.05);
    this.music.gain.setTargetAtTime(this.vol.music * 0.5, t, 0.05);
    this.sfx.gain.setTargetAtTime(this.vol.sfx, t, 0.05);
    this.voice.gain.setTargetAtTime(this.vol.voice, t, 0.05);
  },
