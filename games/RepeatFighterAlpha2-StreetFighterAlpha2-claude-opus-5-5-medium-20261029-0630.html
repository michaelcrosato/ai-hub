<!DOCTYPE html>
<!--
ABOUT & CREDITS

REPEAT FIGHTER ALPHA 2 — an original spiritual successor to Street Fighter Alpha 2. All characters, story, art, music and code are original.

Source Information

- Date: 2026-10-29 06:30

- Source: Street Fighter Alpha 2 (Capcom, 1996)

- Tech: Three.js r180 (three.webgpu.js, WebGPURenderer, TSL node materials, PostProcessing + BloomNode), WebGPU only with no WebGL fallback, Rapier 0.19.3 (@dimforge/rapier3d-compat) for stage props and debris, Gamepad API, Web Audio API, plain ES modules from the jsDelivr CDN, AI Hub session client 1.3.0

- Art Direction: stylised cel shading: MeshToonNodeMaterial with a 3-step gradient ramp, inverted-hull ink outlines, flat gradient skies, additive glow effects with bloom, procedural low-poly characters and stages

- Animation: procedural pose-based rig. Each fighter is a hips → chest → head hierarchy, with arms and legs solved by analytic two-bone IK toward hand and foot targets. Moves are keyframed poses sampled by sim frame with smoothstep blending, plus spring secondary motion (hair, headband tails, cape, scarf) and additive afterimage ghosts

- Audio: all code-written in Web Audio: a step-sequencer soundtrack with 10 procedurally composed themes (drums, bass, pads, lead), synthesised SFX (hits, blocks, whooshes, projectiles, KO, UI), and Animalese-style gibberish voices for the announcer and every fighter: every letter of the line becomes one quick formant-filtered blip (10-16 a second) with its own pitch step, on top of each fighter's own voice pitch

- Online: AI Hub Session Protocol v1, versus mode for 2–4 players (1v1, or a free-for-all battle royal for 3–4): each copy owns its fighter, the victim decides hits, the host runs rounds and the timer, and server hosting is supported. Local 2-player versus works on one device. No other network features

- Testing: lightweight. A headless Node sim test (scripted specials, supers, throws, 360 grabs, blocks, custom combos, all 25 CPU-vs-CPU matchups to the end of the match, 3- and 4-player free-for-alls, fireball hits, Alpha Counter, fall break, guard vs projectiles, dizzy, time over and throw softening), node -check of the bundle, headless Chrome (SwiftShader WebGPU) scene sweeps with render-target readback snapshots, a feature test (attract after 10 s idle and exit on input, measured audio output for music, SFX and voice, invert toggles, settings saving, 2-player keyboard split, keyboard special move, pause, touch-only screen), a two-copy networked combat test through the hub harness (remote hit, HP agreement on both copies, networked KO and round award), offline-rendered voice analysis (about one blip per letter at 10+ a second, each fighter within 15% of its designed pitch, deep-to-high casting order) and a check that every stage theme sounds different, and the AI Hub harness at 2/3/4 players with 150 ms latency, 50 ms jitter and 5% loss, host-leave and server scenarios

- Environment: Claude Code CLI (headless); Linux; browser unknown

- Model: Anthropic, claude-opus-5-5, reasoning effort medium

- Usage: API cost and token totals unknown (no usage counter is visible from inside the session); session time about 1.5 hours (06:30 to 08:00)

Testing Feedback

- Issues caught: 14. Voices playing one blip per syllable instead of Animalese's one blip per letter, Valka's voice too thin and quiet to carry pitch, a session world that only advanced on rendered frames (it would pause in a hidden tab, and under heavy load the hub's menu checks failed; a backup timer now keeps it running), gibberish syllables running together without the blippy Animalese gaps, menu key presses arriving in the same frame collapsing into one (seen at headless frame rates), a broken command-grab branch from a bad edit (syntax error), intro state ignoring skip-intro, a server-hosted copy whose probe never saw input, ink outlines too thin to read, super glow washing fighters out to white, the combo counter on the wrong side, the pause list overflowing, a KO/round-check ordering bug, and attract demos wasting time on intros.

- Critical / game-breaking: 3: the session world pausing when rendering stalls (breaks the hub's never-pause rule), the syntax error (the page would not run at all) and the server-mode probe failure (the hub would keep the game out of sessions).

- Most helpful test: the AI Hub harness run headless (2 and 4 players on a lossy network, host leaving, server-hosted), together with render-target readback snapshots of real WebGPU frames.

- Least helpful test: plain headless page screenshots: the WebGPU canvas never presents in headless Chrome, so they only ever showed a white or black rectangle.

Engine Feedback

- Liked most: TSL node materials. Outlines, skies, water and the portal are each a few lines of positionNode/colorNode, and MeshToonNodeMaterial gives a cel look out of the box.

- Stuck / guessed wrong: mostly API-version guesswork (PostProcessing vs RenderPipeline naming, how instanceColor works with node materials, and Rapier's compat init), checked against the CDN builds.

- Built myself: the whole fighting-game core: a frame-exact 60 Hz sim with motion/charge/360 input parsing, hit/hurt boxes, cancels, supers, Alpha Counters, Custom Combos and rounds. Neither engine has anything for this.

- Hardest part: WebGPU with no fallback means headless testing depends on the machine's GPU path, and silent shader/pipeline failures are hard to see without a visible browser.

- Would overhaul: the split of three.webgpu / three.tsl / addons entry points and their import-map wiring for single-file builds.

- Would change: a built-in outline/toon post pass for WebGPU that is documented as stable, so inverted hulls are not needed.

Prompt Feedback

- Liked most: clear deliverable rules (single file, naming, credits in three places) and a concrete protocol document for multiplayer.

- Confusing: "Three.js R180, WebGPU, no fallback" against the hub rule asking for a WebGL 2 fallback (solved with the hub:webgpu=required meta), and how a 2–4 seat versus mode should apply to a 1v1 genre (solved with a free-for-all for 3–4).

- Hardest: fitting a feature-complete fighting game (5 fighters, 5 stages, every Alpha 2 system, arcade, training, attract, local and hub multiplayer) into one session with only light testing.

- One test I wish I could run: a real GPU browser session with a physical DualSense, recorded, to judge feel, input latency and visual polish frame by frame.

Credits

Design, code, music, sound, voices and story: generated by Claude (Anthropic) in Claude Code. Libraries: Three.js (MIT), Rapier (Apache-2.0). Street Fighter Alpha 2 is a trademark of Capcom; this is an unaffiliated homage.

THANK YOU FOR PLAYING
-->

/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

import * as THREE from 'three/webgpu';
import { positionLocal, normalLocal, float, vec3, color, mix, smoothstep, sin, time, uv, length, pass } from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';
import RAPIER from '@dimforge/rapier3d-compat';
// ---- src/data.js
// ============================================================================
// data.js — characters, moves, stages and story. Pure data + small builders.
// Everything a designer would tune lives here: frame data is in 60 Hz frames,
// distances in metres, damage against 1000 HP.
// ============================================================================

const BTN = { LP: 1, MP: 2, HP: 4, LK: 8, MK: 16, HK: 32 };
const PUNCHES = 7, KICKS = 56;
const BTN_ORDER = ['LP', 'MP', 'HP', 'LK', 'MK', 'HK'];
const STR = { L: 0, M: 1, H: 2 };

// Hit strength presets: hitstop, spark size, sound.
const HITCLASS = {
  L: { stop: 6, spark: 0.55, sfx: 'hitL' },
  M: { stop: 9, spark: 0.8, sfx: 'hitM' },
  H: { stop: 12, spark: 1.1, sfx: 'hitH' },
  S: { stop: 4, spark: 0.9, sfx: 'hitS' }, // super multi-hit
};

/** Normalise a move: fill defaults so the sim never checks for undefined. */
function mkMove(id, m) {
  const mv = Object.assign({
    id, name: id, type: 'normal', len: 20, hits: [], cancel: null, pose: 'jab', wind: null, anim: null,
    vel: [], air: false, inv: null, proj: null, grab: null, meter: 0, voice: null, cost: 0, lvl: 0,
    landRec: 3, armor: 0, tele: null, fx: null, gravity: true, airOK: false, track: false, holdY: false,
  }, m);
  mv.hits = mv.hits.map((h) => Object.assign({
    f: 4, n: 2, dmg: 30, stun: 4, hs: 12, bs: 9, box: [0.7, 1.35, 0.25, 0.12], guard: 'mid', kd: 0,
    launch: null, push: 0.09, chip: 0, cls: 'L', air: false, juggle: false,
  }, h));
  if (!mv.hits.length && !mv.grab && !mv.proj && !mv.tele) mv.hits = [];
  return mv;
}

/** A single-hit normal from a compact row. */
function N(id, pose, cls, f, n, rec, dmg, box, extra = {}) {
  const s = { L: [4, 12, 9], M: [8, 17, 13], H: [12, 22, 17] }[cls];
  const len = f + n + rec;
  return mkMove(id, Object.assign({
    pose, len,
    hits: [Object.assign({ f, n, dmg, stun: s[0], hs: s[1], bs: s[2], box, cls, push: { L: 0.07, M: 0.09, H: 0.11 }[cls] }, extra.hit || {})],
    cancel: extra.cancel === undefined ? (cls === 'H' ? 'sp' : 'sp') : extra.cancel,
  }, extra, { hit: undefined }));
}

/** The common set of normals; each character overrides reach, speed and damage. */
function baseNormals(o = {}) {
  const r = o.reach || 1, d = o.dmg || 1, sp = o.speed || 0;
  const B = (x, y, w, h) => [x * r, y, w * r, h];
  const D = (v) => Math.round(v * d);
  const moves = {
    sLP: N('sLP', 'jab', 'L', 3 + sp, 2, 6, D(30), B(0.72, 1.38, 0.24, 0.12)),
    sMP: N('sMP', 'strong', 'M', 5 + sp, 3, 11, D(60), B(0.82, 1.36, 0.28, 0.14)),
    sHP: N('sHP', 'fierce', 'H', 7 + sp, 4, 19, D(95), B(0.92, 1.38, 0.32, 0.17), { cancel: o.hpCancel ? 'sp' : null, wind: 'fiercewind' }),
    sLK: N('sLK', 'shortk', 'L', 4 + sp, 3, 8, D(30), B(0.78, 0.65, 0.26, 0.14)),
    sMK: N('sMK', 'fwdk', 'M', 6 + sp, 3, 13, D(65), B(0.95, 0.95, 0.32, 0.15), { cancel: o.mkCancel === false ? null : 'sp' }),
    sHK: N('sHK', 'rhk', 'H', 8 + sp, 4, 20, D(100), B(1.02, 1.3, 0.36, 0.2), { cancel: null, wind: 'rhkwind' }),
    cLP: N('cLP', 'cjab', 'L', 3 + sp, 2, 6, D(28), B(0.7, 0.86, 0.24, 0.12)),
    cMP: N('cMP', 'cstrong', 'M', 5 + sp, 3, 10, D(55), B(0.8, 0.88, 0.28, 0.13)),
    cHP: N('cHP', 'uppercut', 'H', 6 + sp, 5, 20, D(90), B(0.55, 1.45, 0.3, 0.45), { wind: 'cstrong' }),
    cLK: N('cLK', 'clk', 'L', 4 + sp, 2, 7, D(25), B(0.74, 0.14, 0.28, 0.12), { hit: { guard: 'low' } }),
    cMK: N('cMK', 'cmk', 'M', 6 + sp, 3, 12, D(55), B(0.98, 0.14, 0.34, 0.12), { hit: { guard: 'low' } }),
    cHK: N('cHK', 'sweep', 'H', 7 + sp, 4, 24, D(85), B(1.06, 0.14, 0.4, 0.14), { cancel: null, hit: { guard: 'low', kd: 1, launch: [0.02, 0.0] } }),
    jLP: N('jLP', 'jpunch', 'L', 4, 8, 4, D(35), B(0.55, 0.85, 0.28, 0.24), { air: true, cancel: null, hit: { guard: 'mid', air: true } }),
    jMP: N('jMP', 'jpunch', 'M', 5, 6, 6, D(65), B(0.6, 0.8, 0.3, 0.26), { air: true, cancel: null, hit: { guard: 'mid', air: true } }),

  };
  for (const k of ['jLP', 'jMP', 'jHP', 'jLK', 'jMK', 'jHK']) moves[k].len = 60; // air attacks last until landing
  return moves;
}

}

  c.supers.forEach((s) => { s.levels = [null, 1, 2, 3].map((l) => (l ? s.lv(l) : null)); s.levels.slice(1).forEach((m) => { m.superOf = s.id; add(m); }); });
  [c.counter, c.throwP, c.throwK, ROLL, BACKROLL, TECHROLL].forEach(add);
}

// Notation for the move list (controller glyphs are drawn by the UI).
