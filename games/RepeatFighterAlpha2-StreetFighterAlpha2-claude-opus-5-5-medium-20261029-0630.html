    Game.match = null;
    World.clearFighters();
    World.setStage('select');
    World.cam.focus = null;
    this.cur = [0, this.two ? 1 : 1];
    this.done = [false, false];
    this.picks = [null, null];
    this.stage2 = !this.two && (a.mode === 'vscpu' || a.mode === 'training'); // P1 also picks the opponent
    this.phase = 0;
    this.views = [null, null];
    UI.setScreen(`
      <div class="selhead">${{ arcade: 'ARCADE', versus: 'VERSUS', vscpu: 'VERSUS CPU', training: 'TRAINING' }[a.mode]} — SELECT YOUR FIGHTER</div>
      <div class="selinfo p0" id="si0"></div><div class="selinfo p1" id="si1"></div>
      <div class="grid" id="grid">${CHAR_ORDER.map((id, i) => `<div class="card" data-i="${i}" style="--c:${CHARS[id].look.aura}"><div class="ini">${CHARS[id].name.split(' ').map((w) => w[0]).join('')}</div><div class="cn">${esc(CHARS[id].name)}</div></div>`).join('')}</div>
      <div class="devs" id="devs"></div>`, 'select');
    $('#grid').querySelectorAll('.card').forEach((c) => {
      c.onmouseenter = () => { const p = this.activeSide(); if (p >= 0) { this.cur[p] = +c.dataset.i; this.refresh(); } };
      c.onclick = () => { const p = this.activeSide(); if (p >= 0) { this.cur[p] = +c.dataset.i; this.pick(p, 0); } };
    });
    UI.setPrompts([['lr', 'Choose'], ['confirm', 'Pick'], ['alt', 'Pick alt. colour'], ['back', 'Back']]);
    Snd.playMusic('select');
    this.refresh();
  },
  activeSide() { if (this.two) return !this.done[0] ? 0 : !this.done[1] ? 1 : -1; return this.done[0] ? (this.stage2 && !this.done[1] ? 1 : -1) : 0; },
  refresh() {
    document.querySelectorAll('#grid .card').forEach((c) => {
      const i = +c.dataset.i;
      c.classList.toggle('c0', this.cur[0] === i && (!this.done[0] || this.two || !this.stage2));
      c.classList.toggle('c1', (this.two || (this.stage2 && this.done[0])) && this.cur[1] === i);
      c.classList.toggle('lock0', this.done[0] && this.picks[0] && this.picks[0].char === CHAR_ORDER[i]);
      c.classList.toggle('lock1', this.done[1] && this.picks[1] && this.picks[1].char === CHAR_ORDER[i]);
    });
    for (let p = 0; p < 2; p++) {
      const show = p === 0 || this.two || (this.stage2 && this.done[0]);
      const el = $('#si' + p);
      if (!show) { el.innerHTML = this.mode === 'arcade' ? '<div class="who">CHALLENGERS AWAIT</div>' : ''; this.setView(p, null); continue; }
      const id = CHAR_ORDER[this.done[p] ? CHAR_ORDER.indexOf(this.picks[p].char) : this.cur[p]];
      const c = CHARS[id];
      const label = p === 0 ? 'P1' : this.two ? 'P2' : this.mode === 'training' ? 'DUMMY' : 'CPU';
      el.innerHTML = `<div class="who">${label}${this.done[p] ? ' — READY' : ''}</div><div class="nm">${esc(c.name)}</div><div class="tt">${esc(c.title)}</div>
        <div class="meta">${esc(c.country)} · ${esc(c.style)} · ${esc(c.height)}</div>
        <div class="sp">${c.specials.map((s) => `<span>${esc(s.name)}</span>`).join('')}</div>`;
      this.setView(p, id, this.done[p] ? this.picks[p].palette : 0);
    }
    const devs = $('#devs');
    devs.innerHTML = this.two ? `<span class="d0">P1: ${esc(Input.slotDescription(0))}</span><span class="d1">P2: ${esc(Input.slotDescription(1))}</span>` : '';
  },
  setView(p, id, palette = 0) {
    const key = id ? id + ':' + palette : null;
    if (this.views[p] && this.views[p].key === key) return;
    if (this.views[p]) { World.scene.remove(this.views[p].v.root); this.views[p] = null; }
    if (!id) return;
    const v = new FighterView(id, palette);
    World.scene.add(v.root);
    this.views[p] = { key, v, f: { state: 'stand', st: 0, x: p ? 2.4 : -2.4, y: 0, vx: 0, vy: 0, facing: p ? -1 : 1, id: p, charId: id, wins: 0, hist: [] } };
  },
  pick(p, palette) {
    if (this.two && this.done[1 - p] && this.picks[1 - p].char === CHAR_ORDER[this.cur[p]] && this.picks[1 - p].palette === palette) palette = 1 - palette;
    if (!this.two && p === 1 && this.picks[0].char === CHAR_ORDER[this.cur[p]] && this.picks[0].palette === palette) palette = 1 - palette;
    this.picks[p] = { char: CHAR_ORDER[this.cur[p]], palette };
    this.done[p] = true;
    Snd.play('select');
    const c = CHARS[this.picks[p].char];
    Snd.speak(c.name, Object.assign({ verb: true }, c.voice));
    if (this.views[p]) { this.views[p].f.state = 'win'; this.views[p].f.st = 0; }
    this.refresh();
    const all = this.two ? this.done[0] && this.done[1] : this.stage2 ? this.done[0] && this.done[1] : this.done[0];
    if (all) setTimeout(() => this.finish(), 700);
  },
  finish() {
    if (Game.sceneName !== 'select') return;
    const mode = this.mode;
    if (mode === 'arcade') Game.go('story', { char: this.picks[0].char, palette: this.picks[0].palette });
    else Game.go('stage', { mode, picks: this.picks });
  },
  update(dt, m) {
    for (const v of this.views) if (v) { v.f.st++; v.v.update(v.f, World.t); }
    World.cam.x += (0 - World.cam.x) * 0.1;
    World.camera.position.set(0, 1.6, 8.2); World.camera.lookAt(0, 1.05, 0);
    const side = this.activeSide();
    const nav = this.two ? Input.menuSlots : null;
    const handleSide = (p, mm) => {
      if (mm.left) { this.cur[p] = (this.cur[p] + 4) % 5; Snd.play('move'); this.refresh(); }
      if (mm.right) { this.cur[p] = (this.cur[p] + 1) % 5; Snd.play('move'); this.refresh(); }
      if (mm.confirm) this.pick(p, 0);
      else if (mm.alt) this.pick(p, 1);
    };
    if (this.two && nav) {
      for (let p = 0; p < 2; p++) if (!this.done[p]) handleSide(p, nav[p]);
      if (m.back) {
        if (this.done[1]) { this.done[1] = false; this.refresh(); } else if (this.done[0]) { this.done[0] = false; this.refresh(); } else { Input.setLocal2P(false); Game.go('menu', { at: 1 }); }
      }
      return;
    }
    if (side >= 0) handleSide(side, m);
    if (m.back) {
      Snd.play('back');
      if (this.done[1]) { this.done[1] = false; this.refresh(); }
      else if (this.done[0]) { this.done[0] = false; this.refresh(); }
      else Game.go('menu', { at: { arcade: 0, versus: 1, vscpu: 2, training: 3 }[this.mode] });
    }
  },
  exit() { for (const v of this.views) if (v) World.scene.remove(v.v.root); this.views = [null, null]; },
};

    const c = CHARS[a.char];
    const others = CHAR_ORDER.filter((id) => id !== a.char && id !== c.rival && id !== (a.char === 'vexen' ? 'kaito' : 'vexen'));
    for (let i = others.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [others[i], others[j]] = [others[j], others[i]]; }
    const boss = a.char === 'vexen' ? 'kaito' : 'vexen';
    const ladder = [...others.slice(0, 2), c.rival, boss];
    Game.arcade = { char: a.char, palette: a.palette, ladder, stage: 0, score: 0, continues: 0 };
    World.clearFighters();
    World.setStage(c.stage);
    UI.setScreen(`<div class="story"><div class="snm">${esc(c.name)}</div><div class="stt">${esc(c.title)}</div><p class="type" id="stype"></p></div>`, 'storybg');
    UI.setPrompts([['confirm', 'Continue']]);
    this.text = c.story.intro; this.n = 0; this.t = 0;
    Snd.playMusic('select');
    Snd.speak(this.text.slice(0, 60), Object.assign({ verb: true }, c.voice));
  },
  update(dt, m) {
    World.camera.position.set(Math.sin(World.t * 0.15) * 4, 2.5, 11); World.camera.lookAt(0, 1.8, -4);
    this.t += dt;
    this.n = Math.min(this.text.length, Math.floor(this.t * 55));
    $('#stype').textContent = this.text.slice(0, this.n);
    if (m.confirm || m.back) {
      if (this.n < this.text.length) { this.t = 99; return; }
      arcadeNext();
    }
  },
};

function arcadeNext() {
  const A = Game.arcade;
  const opp = A.ladder[A.stage];
  const D = Settings.d;
  const lvl = clamp(D.difficulty - 1 + A.stage, 1, 8);
  const oc = CHARS[opp];
  const talk = A.stage === A.ladder.length - 1 ? CHARS[A.char].bossTalk : A.stage === A.ladder.length - 2 ? CHARS[A.char].rivalTalk : null;
  Game.go('vs', {
    talk, banner: A.stage === A.ladder.length - 1 ? 'FINAL BATTLE' : A.stage === A.ladder.length - 2 ? 'RIVAL BATTLE' : `STAGE ${A.stage + 1}`,
    next: { mode: 'arcade', opts: { stage: oc.stage, time: D.time, rounds: D.rounds }, picks: [{ char: A.char, palette: A.palette, tag: 'P1' }, { char: opp, palette: opp === A.char ? 1 - A.palette : 0, cpu: true, level: lvl, tag: 'CPU' }] },
  });
}

// ---------------------------------------------------------------- fight
SCENES.fight = {
  enter(a) {
    this.a = a;
    this.mode = a.mode;
    Input.setLocal2P(a.mode === 'versus');
    Input.clearGame();
    UI.clearScreen();
    const m = Game.newMatch(Object.assign({}, a.opts, { skipIntro: a.mode === 'training' }), a.picks);
    UI.buildHud(m);
    Game.training = a.mode === 'training' ? Training.init(m) : null;
    this.endT = 0;
    UI.setPrompts(a.mode === 'training' ? [['options', 'Training menu']] : [['options', 'Pause']]);
    this.paused = false;
  },
  update(dt, m) {
    const match = Game.match;
    if (this.paused) { this.pauseCtl.handle(m); Game.renderMatch(0); return; }
    if (m.padStart || (m.back && Input.edgeHadEscape)) { this.openPause(); return; }
    if (match.phase === 'intro' && m.confirm) match.skipIntro = true;
    Game.stepMatch(dt, (f, i) => {
      if (Game.training && i === 1) return Game.training.dummy(f, match);
      return Game.defaultInput(f, i);
    });
    Game.renderMatch(dt);
    if (match.phase === 'matchEnd') {
      this.endT += dt;
      if (this.endT > 2.2) this.afterMatch();
    }
  },
  openPause() {
    this.paused = true;
    Snd.play('ok');
    const train = this.mode === 'training';
    UI.overlay.style.display = 'flex';
    UI.overlay.innerHTML = `<div class="panel center"><div class="mtitle">${train ? 'TRAINING' : 'PAUSE'}</div><div class="list" id="plist"></div></div>`;
    const close = () => { this.paused = false; UI.overlay.style.display = 'none'; Input.clearGame(); };
    const items = [{ label: 'Resume', action: close }];
    if (train) items.push(...Training.menuItems());
    items.push(
      { label: 'Move List', action: () => SubScreens.moveList(Game.match.fighters[0].charId, () => this.openPause()) },
      { label: 'Settings', action: () => SubScreens.settings(() => this.openPause()) },
      { label: 'Restart', action: () => { close(); Game.go('fight', this.a); } },
      { label: 'Character Select', action: () => { close(); Game.go('select', { mode: this.mode === 'arcade' ? 'arcade' : this.mode }); } },
      { label: 'Main Menu', action: () => { close(); Game.go('menu'); } },
    );
    this.pauseCtl = UI.list($('#plist'), items, { onBack: close });
    UI.setPrompts([['confirm', 'Select'], ['lr', 'Change'], ['back', 'Resume']]);
  },
  afterMatch() {
    const match = Game.match;
    const w = match.matchWinner;
    if (this.mode === 'arcade') {
      const A = Game.arcade;
      if (w && w.id === 0) {
        const f = w;
        const bonus = Math.round(f.hp / f.maxHp * 30000) + match.timer * 300 + f.stats.perfects * 50000;
        A.score += Math.round(f.stats.dmg * 50) + bonus;
        A.stage++;
        Game.go('result', { winner: f, loser: match.fighters[1], next: A.stage >= A.ladder.length ? 'ending' : 'arcade', bonus });
      } else Game.go('continue');
    } else Game.go('result', { winner: w, loser: w ? match.fighters[1 - w.id] : null, next: 'versus' });
  },
  exit() { this.paused = false; UI.overlay.style.display = 'none'; },
};

const Training = {
  init(m) {
    this.m = m;
    this.mode = 'stand';
    this.inputs = true;
    this.meterInf = true;
    m.opts.infiniteMeter = true;
    Hitboxes.on = false;
    this.lastMove = null;
    m.onHit = (a, t, res) => { if (a.id === 0) this.lastHit = { mv: a.move, res, t: m.frame }; };
    return this;
  },
  menuItems() {
    const modes = ['stand', 'crouch', 'jump', 'block', 'tech', 'cpu'];
    const names = { stand: 'Stand', crouch: 'Crouch', jump: 'Jump', block: 'Block All', tech: 'Fall Break', cpu: 'CPU Opponent' };
    return [
      { label: 'Dummy', value: () => names[this.mode], left: () => { this.mode = modes[(modes.indexOf(this.mode) + modes.length - 1) % modes.length]; this.setCpu(); }, right: () => { this.mode = modes[(modes.indexOf(this.mode) + 1) % modes.length]; this.setCpu(); } },
      { label: 'Hitboxes', value: () => (Hitboxes.on ? 'On' : 'Off'), left: () => { Hitboxes.on = !Hitboxes.on; }, right: () => { Hitboxes.on = !Hitboxes.on; } },
      { label: 'Super Gauge', value: () => (this.meterInf ? 'Infinite' : 'Normal'), left: () => this.toggleMeter(), right: () => this.toggleMeter() },
      { label: 'Input Display', value: () => (this.inputs ? 'On' : 'Off'), left: () => { this.inputs = !this.inputs; }, right: () => { this.inputs = !this.inputs; } },
      { label: 'Reset Positions', action: () => { this.m.resetPositions(); World.resetProps(); } },
    ];
  },
  toggleMeter() { this.meterInf = !this.meterInf; this.m.opts.infiniteMeter = this.meterInf; if (!this.meterInf) this.m.fighters.forEach((f) => { f.meter = 0; }); },
  setCpu() { const f = this.m.fighters[1]; this.cpu = this.mode === 'cpu' ? new CPU(f, Settings.d.difficulty) : null; f.dummyBlock = false; },
  dummy(f, m) {
    if (this.cpu) { f.dummyNoDie = true; return this.cpu.think(m); }
    // refill health once a combo has ended
    if (f.combo === 0 && f.hp < f.maxHp && (f.state === 'stand' || f.state === 'crouch')) f.hp = Math.min(f.maxHp, f.hp + 20);
    if (m.fighters[0].hp < m.fighters[0].maxHp && m.fighters[0].state === 'stand') m.fighters[0].hp = Math.min(m.fighters[0].maxHp, m.fighters[0].hp + 20);
    return dummyInput(f, this.mode, m);
  },
  draw(m) {
    const f = m.fighters[0];
    const mv = f.move || (this.lastHit && this.lastHit.mv);
    let html = `<div><b>DUMMY</b> ${this.mode.toUpperCase()}</div>`;
    if (mv && mv.hits && mv.hits.length) {
      const h = mv.hits[0];
      const last = mv.hits[mv.hits.length - 1];
      const rec = mv.len - (last.f + last.n);
      const advH = h.hs - (mv.len - h.f), advB = h.bs - (mv.len - h.f);
      html += `<div><b>${esc(mv.name || mv.id)}</b></div><div>Startup ${h.f + 1}f · Active ${last.f + last.n - h.f}f · Recovery ${rec}f</div><div>On hit ${advH >= 0 ? '+' : ''}${advH} · On block ${advB >= 0 ? '+' : ''}${advB}</div><div>Damage ${mv.hits.reduce((s, x) => s + x.dmg, 0)} · Guard ${h.guard.toUpperCase()}</div>`;
    }
    if (this.lastHit && m.frame - this.lastHit.t < 240) html += `<div>Combo ${m.fighters[1].combo || '—'} · ${m.fighters[1].comboDmg || 0} dmg</div>`;
    if (m.frame % 10 === 0) UI.trainingInfo(html);
  },
};

        ${a.next !== 'versus' ? `<div class="score">SCORE ${Game.arcade.score.toLocaleString()} <small>(bonus ${a.bonus.toLocaleString()})</small></div>` : ''}</div>
        <div class="panel bottomc"><div class="list" id="rlist"></div></div>`, 'resultbg');
      Snd.speak(q, Object.assign({ verb: true }, w.ch.voice));
      // the winner's pose stays on screen; the loser kneels

    }
    Snd.playMusic('victory');
    const items = a.next === 'arcade' ? [{ label: 'Next Battle', action: () => arcadeNext() }]
      : a.next === 'ending' ? [{ label: 'Continue', action: () => Game.go('ending') }]
        : [{ label: 'Rematch', action: () => Game.go('fight', SCENES.fight.a) }, { label: 'Character Select', action: () => Game.go('select', { mode: SCENES.fight.mode }) }, { label: 'Main Menu', action: () => Game.go('menu') }];
    this.ctl = UI.list($('#rlist'), items, {});
    UI.setPrompts([['confirm', 'Select']]);

      World.updateFighters(match, World.t);

      if (w) { World.camera.position.set(w.x + 0.6, 1.5, 4.2); World.camera.lookAt(w.x, 1.25, 0); }

  },
};

SCENES.continue = {
  enter() {
    this.t = 10.99;
    UI.hideHud();
    UI.setScreen(`<div class="cont"><div class="ct">CONTINUE?</div><div class="cn" id="ccount">9</div><div class="cs">Press ✕ / Enter to fight on</div></div>`, 'contbg');
    UI.setPrompts([['confirm', 'Continue'], ['back', 'Give up']]);
    const L = Game.match.fighters[0];
    L.state = 'lose'; L.alive = true; L.y = 0;
    Snd.stopMusic();
  },
  update(dt, m) {
    const match = Game.match;
    match.fighters.forEach((f) => { f.st++; });
    World.updateFighters(match, World.t);
    const L = match.fighters[0];
    World.camera.position.set(L.x, 1.3, 4.5); World.camera.lookAt(L.x, 0.8, 0);
    const before = Math.floor(this.t);
    this.t -= dt * (m.left || m.right ? 4 : 1);
    const n = Math.floor(this.t);
    if (n !== before && n >= 0) { $('#ccount').textContent = n; Snd.play('tick'); Snd.announcer(['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'][n] || ''); }
    if (m.confirm) { Game.arcade.continues++; Game.arcade.score = 0; Snd.play('select'); arcadeNext(); return; }
    if (this.t < 0 || m.back) {
      UI.setScreen(`<div class="cont"><div class="ct over">GAME OVER</div></div>`, 'contbg');
      Snd.announcer('game over');
      this.t = 99;
      setTimeout(() => { if (Game.sceneName === 'continue') Game.go('title'); }, 3000);

};

function moveListHtml(id) {
  const c = CHARS[id];
  const row = (name, inp, note = '') => `<div class="mrow"><span class="mn">${esc(name)}</span><span class="mi">${inp}</span>${note ? `<span class="mnote">${esc(note)}</span>` : ''}</div>`;
  const sp = c.specials.map((s) => row(s.name, `${s.airOnly ? '(air) ' : s.airOK ? '(also air) ' : ''}${esc(motionGlyph(s.motion))} + ${BTN_GLYPH(s.btn)}`)).join('');
  const su = c.supers.map((s) => row(s.name, `${esc(motionGlyph(s.motion))} + ${BTN_GLYPH(s.btn)}`, 'L/M/H = Lv 1/2/3')).join('');
  const cm = c.commands.map((m) => row(m.name.split(' (')[0], esc(m.name.match(/\((.*)\)/)[1]))).join('');
  return `<div class="mlhead"><span class="arrow">◀ L1</span><div><div class="mtitle">${esc(c.name)}</div><div class="stt">${esc(c.title)} · ${esc(c.style)}</div></div><span class="arrow">R1 ▶</span></div>
  <div class="mcols"><div><h3>Special Moves</h3>${sp}<h3>Command Normals</h3>${cm}</div><div><h3>Super Combos (1+ level)</h3>${su}
  <h3>Universal</h3>${row('Alpha Counter', 'While blocking: → + P + K', '1 level')}${row('Custom Combo', 'P + P + K  (L1 / Y)', '1+ level, uses all')}${row('Alpha Roll', 'L2 / H  (← + roll = back)')}${row('Throw', 'Close: ← or → + HP / HK')}${row('Fall Break', 'Press buttons as you land')}</div></div>`;
}

SCENES.settings = {
  enter(a) {
    this.back = a.back || 'menu';
    UI.hideHud();
    UI.setScreen(`<div class="panel center wide"><div class="mtitle">SETTINGS</div><div class="list" id="setl"></div><div class="hint in" id="seth"></div></div>`, 'menu dim');
    this.ctl = UI.list($('#setl'), SubScreens.settingsItems(() => SubScreens.controls(() => Game.go('settings', { back: this.back }))), { onBack: () => Game.go(this.back, { at: 6 }), onFocus: (it) => { $('#seth').textContent = it.sub || ''; } });
    UI.setPrompts([['lr', 'Change'], ['back', 'Back']]);
  },
  update(dt, m) {
    Game.renderBackdrop(dt);
    this.ctl.handle(m);
    if (m.padStart && this.ctl.items) Game.go(this.back, { at: 6 });
  },
};

const HOWTO = [
  ['THE BASICS', ['Move with the stick or D-pad. Up jumps, down crouches.', 'Hold AWAY from your opponent to block. Crouch-block low attacks, stand-block overheads.', 'Three punches and three kicks: light is fast, heavy hits hard.', 'First to win two rounds takes the match. The timer counts down from 99.']],
  ['SPECIAL MOVES', ['Roll the stick, then press a button: ↓↘→ + P throws Kaito\'s Tenkai Fist.', '[←] → means hold back for a moment, then forward: a charge move.', 'Cancel a medium or light normal into a special the moment it connects for a combo.', 'Every special has light, medium and heavy versions: speed, distance and damage change.']],
  ['SUPER COMBO GAUGE', ['Attacking and getting hit fills the gauge at the bottom. It stores up to 3 levels.', '↓↘→↓↘→ + attack unleashes a Super Combo. Light = Lv 1, Medium = Lv 2, Heavy = Lv 3.', 'Supers start invincible and freeze the screen. Finishing a round with one is a SUPER K.O.', 'Your gauge carries over between rounds.']],
  ['ALPHA COUNTER', ['While blocking, press → + Punch + Kick (or L1) to counter at once.', 'It costs one level, is invincible as it starts and knocks the attacker down.', 'Perfect for breaking pressure when you are trapped in the corner.']],
  ['CUSTOM COMBO', ['With at least one level, press two punches + one kick together (L1 or Y).', 'You glow and leave afterimages: for a few seconds every attack cancels into any other.', 'Airborne opponents float and stay juggleable. More levels = more time.', 'Build your own combo: chain normals, specials, jumps... it is the Alpha 2 signature.']],
  ['DEFENCE & MOVEMENT', ['Air Block: hold away in the air to block jump-ins and fireballs (not ground normals).', 'Alpha Roll (L2 / H): an invincible roll through fireballs. Hold back for a back roll.', 'Fall Break: press any button as you land from a knockdown to roll back to your feet.', 'Throw: close in, hold ← or → and press HP or HK. Press a button the moment you are grabbed to soften it.', 'Double-tap → or ← to dash. Mash buttons to shake off DIZZY.']],
];

SCENES.howto = {
  enter(a) {
    this.back = a.back || 'menu'; this.p = 0;
    this.draw();
    UI.setPrompts([['lr', 'Page'], ['back', 'Back']]);
  },
  draw() {
    const [t, lines] = HOWTO[this.p];
    UI.setScreen(`<div class="panel center wide howto"><div class="pg">${this.p + 1} / ${HOWTO.length}</div><div class="mtitle">${esc(t)}</div>${lines.map((l) => `<p>${esc(l)}</p>`).join('')}<div class="pgnav">◀ ▶</div></div>`, 'menu dim');
  },
  update(dt, m) {
    Game.renderBackdrop(dt);
    if (m.right || m.confirm || m.tabR) { if (this.p < HOWTO.length - 1) { this.p++; this.draw(); Snd.play('move'); } else if (m.confirm) Game.go(this.back, { at: 4 }); }
    if (m.left || m.tabL) { if (this.p > 0) { this.p--; this.draw(); Snd.play('move'); } }
    if (m.back) Game.go(this.back, { at: 4 });
  },
};

SCENES.movelist = {
  enter(a) { this.back = a.back || 'menu'; this.i = 0; this.draw(); UI.setPrompts([['tabs', 'Fighter'], ['back', 'Back']]); },
  draw() { UI.setScreen(`<div class="panel center wide movelist">${moveListHtml(CHAR_ORDER[this.i])}</div>`, 'menu dim'); },
  update(dt, m) {
    Game.renderBackdrop(dt);
    if (m.left || m.tabL) { this.i = (this.i + 4) % 5; this.draw(); Snd.play('move'); }
    if (m.right || m.tabR) { this.i = (this.i + 1) % 5; this.draw(); Snd.play('move'); }
    if (m.back || m.confirm) Game.go(this.back, { at: 5 });
  },
};

SCENES.credits = {
  enter(a) {
    this.back = a.back || 'menu'; this.roll = !!a.roll;
    UI.setScreen(`<div class="panel center wide credits" id="cred">${CREDITS_HTML}</div>`, 'menu dim');
    this.el = $('#cred'); this.y = 0;
    UI.setPrompts([['lr', 'Scroll'], ['back', 'Back']]);
    if (this.roll) Snd.playMusic('ending');
  },
  update(dt, m) {
    Game.renderBackdrop(dt);
    if (this.roll) this.el.scrollTop += dt * 40;
    if (m.down) this.el.scrollTop += 140;
    if (m.up) this.el.scrollTop -= 140;

// ---------------------------------------------------------------- AI Hub session
SCENES.session = {
  enter() {
    UI.setScreen('<div class="cont"><div class="cs">Connecting to the hub…</div></div>', 'contbg');
    this.ready = false; this.started = false; this.ended = false;
    this.settingsOpen = false;
  },
  begin(info) {
    const m = Net.buildMatch();
    Game.match = m;
    World.clearFighters();
    World.setStage(m.opts.stage);
    World.resetProps();
    UI.clearScreen();
    UI.buildHud(m);
    Snd.playMusic(STAGES[m.opts.stage].music);
    Net.onStart = () => { this.started = true; };
    Net.onEnded = (e) => this.onEnd(e);
    if (info.splash || info.server) { this.ready = true; AIHub.ready(); }
    else {
      UI.setScreen(`<div class="cont"><div class="cs">${info.players.map((p) => `<div style="color:${p.color}">${esc(p.name)}${p.id === info.me ? ' (you)' : ''}</div>`).join('')}</div><div class="cs">Press any key, click or tap when you are ready</div></div>`, 'contbg');
      const go = () => { if (this.ready) return; this.ready = true; Snd.unlock(); AIHub.ready(); UI.setScreen('<div class="cont"><div class="cs">Waiting for everyone…</div></div>', 'contbg'); };
      window.addEventListener('keydown', go, { once: true });
      window.addEventListener('pointerdown', go, { once: true });
      this.padReady = go;
    }
    UI.setPrompts([['options', 'Settings']]);
  },
  onEnd(e) {
    this.ended = true;
    Snd.fadeOut(1.2);
    UI.overlay.style.display = 'none';
    Game.menuOpen = false;
    const m = Game.match;
    const w = m && m.matchWinner;
    UI.setScreen(`<div class="cont"><div class="ct">${e.reason === 'finished' ? (w ? esc(w.name) + ' WINS' : 'ROUND OVER') : e.reason === 'sat-out' ? 'YOU SAT THIS ONE OUT' : 'ROUND CANCELLED'}</div></div>`, 'contbg');
  },
  update(dt, m) {
    const match = Game.match;
    if (!match) return;
    if (!this.ready && this.padReady && m.any) this.padReady();
    if (this.ended) { Game.renderMatch(0); return; }
    // the settings menu never pauses the shared world
    if (this.settingsOpen) {
      if (Game.overlayCtl) Game.overlayCtl.handle(m);
      if (m.padStart) this.closeSettings();
    } else if (m.padStart) this.openSettings();
    Game.menuOpen = this.settingsOpen;
    const t = AIHub.time();
    if (this.started && t >= 0) {
      if (UI.screen.style.display !== 'none' && !this.ended) UI.clearScreen();
      this.stepSim(dt);
    } else {
      Input.readGame(0);
      if (this.started && t < 0 && t > -10000) UI.setScreen(`<div class="count">${Math.ceil(-t / 1000)}</div>`, 'countbg');
    }
    Game.renderMatch(dt);
  },
  /** Advance the shared world. Called by the render loop, or by the backup timer when rendering stalls. */
  stepSim(dt) {
    if (!Game.match || this.ended || !this.started || AIHub.time() < 0) return;
    Game.stepMatch(dt, (f) => (f === Net.me ? Game.defaultInput(f, 0) : NO_INPUT));
  },
  /** Esc toggles the settings menu straight from the key event, so it responds even when frames are slow. */
  onEscKey() {
    if (!Game.match || this.ended) return;
    if (this.settingsOpen) this.closeSettings(); else this.openSettings();
    Game.menuOpen = this.settingsOpen;
  },
  openSettings() {
    this.settingsOpen = true;
    this.setCtl = SubScreens.settings(() => this.closeSettings());
    Game.overlayCtl = this.setCtl;
  },
  closeSettings() { this.settingsOpen = false; Game.menuOpen = false; UI.overlay.style.display = 'none'; Game.overlayCtl = null; Snd.play('back'); UI.setPrompts([['options', 'Settings']]); },
};

// ---------------------------------------------------------------- boot
async function boot() {
  Input.init();
  UI.init();
  Settings.load();
  const canvas = $('#gl');
  try {
    await World.init(canvas);
  } catch (e) {
    console.error(e);
    $('#boot').innerHTML = `<div class="fatal"><h1>WebGPU required</h1><p>${esc(e.message)}</p><p>Repeat Fighter Alpha 2 renders with WebGPU only. Please use a current Chrome, Edge or another browser with WebGPU enabled.</p></div>`;
    if (AIHub.active) AIHub.fail('WebGPU unavailable: ' + e.message);
    return;
  }
  Settings.apply();
  $('#boot').style.display = 'none';
  AIHub.probe(() => ({
    scene: Game.probeScene(),
    menu: !!(Game.menuOpen || (SCENES.fight.paused && Game.sceneName === 'fight')),
    world: Math.round(Game.worldTime * 1000) / 1000,
    input: (() => { const q = Input.peek(0); return { x: q.x, y: q.y, b: q.held }; })(),
  }));
  World.renderer.setAnimationLoop((now) => Game.frame(now));
  if (AIHub.active) {
    // The shared world never pauses: if rendering stalls (hidden tab, heavy load), a timer keeps the sim and network going.
    setInterval(() => {
      const now = performance.now();
      if (Game.sceneName !== 'session' || now - (Game.lastFrameAt || 0) < 120) return;
      const dt = Math.min(0.1, (now - Game.last) / 1000);
      Game.last = now; // shared clock: the next rendered frame will not re-simulate this time
      Input.poll();
      SCENES.session.stepSim(dt);
      Net.tick(now);
    }, 33);
    window.addEventListener('keydown', (e) => {
      if (e.code !== 'Escape' || e.repeat || Game.sceneName !== 'session') return;
      Input.edgeQ = Input.edgeQ.filter((c) => c !== 'Escape'); // handled here, not again by the frame loop
      SCENES.session.onEscKey();
    });
    Game.go('session');
    const info = await Net.start();
    if (info) { SCENES.session.begin(info); return; }
  }
  if (Input.isTouchOnly()) { Game.touchBlock = true; $('#touch').style.display = 'flex'; }
  Game.go('title');
}

Game.probeScene = function () {
  const s = this.sceneName;
  if (s === 'session') {
    const m = this.match;
    if (!m) return 'ready';
    if (SCENES.session.ended || m.phase === 'matchEnd') return 'over';
    return SCENES.session.started && AIHub.time() >= 0 ? 'play' : 'ready';
  }
  if (s === 'title' || s === 'attract') return 'title';
  if (s === 'fight') return this.match && this.match.phase === 'matchEnd' ? 'over' : 'play';
  if (s === 'result' || s === 'continue' || s === 'ending') return 'over';
  return 'menu';
};

// Esc doubles as "back" and "pause": remember whether this frame's back came from Esc/Options.
(function patchMenuEsc() {
  const orig = Input.menu.bind(Input);
  Input.menu = function () {
    this.takeEdges();
    const hadEsc = this.edge.has('Escape');
    const slots = [0, 1].map((s) => {
      const sl = this.slots[s] || { kb: [], pads: [] };
      const r = { left: false, right: false, up: false, down: false, confirm: false, alt: false, back: false };
      for (const k of sl.kb) {
        const mp = KEYMAPS[k];
        const e = (arr) => arr.some((c) => this.edge.has(c));
        r.left ||= e(mp.left); r.right ||= e(mp.right); r.up ||= e(mp.up); r.down ||= e(mp.down);
        r.confirm ||= e(mp.LP) || e(mp.LK) || (k === 'kb1' ? this.edge.has('Space') : this.edge.has('Enter'));
        r.alt ||= e(mp.MP);
      }
      for (const pe of this.padEdges) {
        if (!(sl.pads === 'all' || sl.pads.includes(pe.pad))) continue;
        let { b } = pe;
        if (!pe.stick && this.settings.invertX && (b === PAD.LEFT || b === PAD.RIGHT)) b = b === PAD.LEFT ? PAD.RIGHT : PAD.LEFT;
        if (!pe.stick && this.settings.invertY && (b === PAD.UP || b === PAD.DOWN)) b = b === PAD.UP ? PAD.DOWN : PAD.UP;
        r.left ||= b === PAD.LEFT; r.right ||= b === PAD.RIGHT; r.up ||= b === PAD.UP; r.down ||= b === PAD.DOWN;
        r.confirm ||= b === PAD.CROSS; r.alt ||= b === PAD.TRIANGLE; r.back ||= b === PAD.CIRCLE;
      }
      return r;
    });
    const padOpt = this.padEdges.some((pe) => pe.b === PAD.OPTIONS) && !this.createHeld;
    const m = orig();
    this.edgeHadEscape = hadEsc || padOpt;
    this.menuSlots = slots;
    return m;
  };
})();

// Analogue stick for per-slot select navigation is folded into menu(); pads also report their stick there.
window.addEventListener('gamepadconnected', () => { UI.toast('Controller connected'); if (Game.touchBlock) Game.checkTouch(); });
window.addEventListener('gamepaddisconnected', () => UI.toast('Controller disconnected'));
document.addEventListener('visibilitychange', () => { if (document.hidden && Game.sceneName === 'fight' && !SCENES.fight.paused) SCENES.fight.openPause(); });
$('#touchSettings') && ($('#touchSettings').onclick = () => { $('#touch').style.display = 'none'; Game.touchBlock = false; Game.go('settings', { back: 'title' }); });
// Debug handle (used by automated smoke tests to read back a frame without relying on canvas presentation).
window.__rfa = {
  World, Game, Settings, Input, Snd, SCENES,
  async snap(w = 640, h = 360) {
    const r = World.renderer;
    const rt = new THREE.RenderTarget(w, h);
    const cam = World.camera.clone(); cam.aspect = w / h; cam.updateProjectionMatrix();
    r.setRenderTarget(rt); r.render(World.scene, cam); r.setRenderTarget(null);
    const px = await r.readRenderTargetPixelsAsync(rt, 0, 0, w, h);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); const img = g.createImageData(w, h);
    const lut = new Uint8Array(256); for (let i = 0; i < 256; i++) lut[i] = Math.round(255 * Math.pow(i / 255, 1 / 2.2));
    for (let i = 0; i < w * h * 4; i++) img.data[i] = (i & 3) === 3 ? 255 : lut[px[i]];
    g.putImageData(img, 0, 0);
    rt.dispose();
    return c.toDataURL('image/png');
  },
};
boot();
