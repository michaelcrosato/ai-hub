<!DOCTYPE html>
<!--
BLARING RED — a spiritual successor to Red Alarm (single-file WebGPU demo)

SOURCE INFORMATION
- Date: 2026-10-29 02:01
- Source: Red Alarm (T&E Soft, Nintendo Virtual Boy, 1995)
- Tech: Three.js r180 (WebGPURenderer, WebGPU only, no fallback; TSL post-processing: toonOutlinePass + BloomNode + custom grade), Rapier 3D 0.19.3 (@dimforge/rapier3d-compat) for collision queries, kinematic enemies and rigid-body debris, Gamepad API, Web Audio API, AI Hub session client 1.3.0 (unmodified), vanilla ES modules from jsDelivr CDN
- Art Direction: stylized cel shading — MeshToonMaterial with a 3-step gradient ramp, inked toon outlines, bloom on emissives, crimson Virtual-Boy-inspired palette with an optional red-monochrome "VB Mode"
- Animation: procedural, code-driven (ship banking and barrel rolls, orbiting/opening boss parts, eyelids, turrets tracking), Rapier rigid-body debris, pooled particle bursts and point-light flashes
- Audio: all code-written with Web Audio — step-sequenced synth music (7 tracks), synthesized SFX (klaxon, vulcan, missiles, lasers, explosions, UI), Animalese-style gibberish voice acting for ORACLE, KAOS and WARDEN
- Online: AI Hub Session Protocol v1, side-by-side (parallel) score attack for 1-4 players; no other network features
- Testing: lightweight headless Chrome (WebGPU through SwiftShader/Vulkan) smoke tests via Playwright: boot, menus, attract mode across all sectors and bosses, stage clear/tally/game-over flow, AI Hub harness auto-check (1 player, 2 players, player leaving: all pass)
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort medium
- Usage: unknown

TESTING FEEDBACK
- Issues caught: 9 (menu taps shorter than one frame were dropped; Back from a title sub-menu closed the whole menu; the settings list overflowed the screen; planet and girders crowded the flight lane; core shaft strips were too bright; headless canvas captures came back white, traced to the capture path not the game; 3 test-script parsing bugs)
- Critical / game breaking: 2 (the dropped menu taps and the sub-menu Back that closed the title menu)
- Most helpful test: driving the attract-mode AI through every sector and boss with a sim speed-up while reading back render-target pixels
- Least helpful test: plain page screenshots of the WebGPU canvas in headless Chrome (always white)

ENGINE FEEDBACK
- Liked most: TSL post-processing — toonOutlinePass gives inked outlines on every toon mesh in one line; Rapier's castRay / intersectionsWithShape made hit detection trivial
- Stuck / guessed wrong: guessed r180 naming (PostProcessing still exists alongside RenderPipeline) and had to read the source to learn only toon materials get outlines; headless canvas capture misled me into thinking rendering was broken
- Most important thing built myself: the rail-flight framework (arc-length track frames, path-relative spawning, boss arenas, scripted events) plus the music sequencer and voice synth
- Hardest part: keeping world-space physics and rail-relative gameplay space in sync; async WebGPU init ordering
- Remove / overhaul: the implicit "toon materials only" outline rule — an explicit per-object outline flag would be clearer
- Change one thing: a stable, documented post-processing API name across releases

PROMPT FEEDBACK
- Liked most: precise deliverable naming, the controller-first 10-foot UX brief and the explicit attract-mode spec
- Confusing: "Multiplayer ... for the game on its own" — read as: integrate AI Hub sessions and keep the game fully playable solo
- Hardest: fitting a complete rail-shooter vertical slice (3 sectors, 3 bosses, attract AI, hub mode, settings) into one file
- One more test: a real-GPU session with a real DualSense to tune feel, difficulty and frame pacing

-->

/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script type="module">
// ---- 01_core.js ----
// ===== Blaring Red — core: imports, utilities, settings, credits text =====
import * as THREE from 'three/webgpu';
import { toonOutlinePass, uniform, vec3, vec4, mix, luminance, float, screenUV, sin, fract } from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import RAPIER from '@dimforge/rapier3d-compat';

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const V3 = () => new THREE.Vector3();
const _v1 = V3(), _v2 = V3(), _v3 = V3(), _v4 = V3();
const _q1 = new THREE.Quaternion();
const _m1 = new THREE.Matrix4();

// ---------- persistent settings ----------
const SETTINGS_KEY = 'blaringred.settings.v1';
const DEFAULT_SETTINGS = {
  master: 0.8, music: 0.6, sfx: 0.8, voice: 0.8,
  invertX: false, invertY: false, // gamepad axis fixes (some pads report inverted axes)
  pilotPitch: false,              // flight-sim style: push up to dive
  camera: 'chase', rumble: true, shake: true, vbMode: false,
  difficulty: 'normal', textSpeed: 'normal', hudScale: 1,
};
const settings = Object.assign({}, DEFAULT_SETTINGS);
try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')); } catch (e) { /* first launch */ }
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) { /* storage blocked */ } }
let hiScore = 0;
try { hiScore = Number(localStorage.getItem('blaringred.hi') || 0) || 0; } catch (e) { /* storage blocked */ }
function saveHi(s) { if (s > hiScore) { hiScore = s; try { localStorage.setItem('blaringred.hi', String(s)); } catch (e) { /* blocked */ } } }
const DIFF = {
  easy: { dmg: 0.55, fire: 0.7, hp: 0.8 },
  normal: { dmg: 1, fire: 1, hp: 1 },
  hard: { dmg: 1.45, fire: 1.35, hp: 1.25 },
};

// ---------- source information / feedback (also in the HTML comment and chat reply) ----------
const CREDITS = {
  title: 'BLARING RED',
  sections: [
    ['SOURCE INFORMATION', [
      ['Date', '2026-10-29 02:01'],
      ['Source', 'Red Alarm (T&E Soft, Virtual Boy, 1995) — spiritual successor'],
      ['Tech', 'Three.js r180 (WebGPURenderer, WebGPU only, TSL post: toonOutlinePass + BloomNode), Rapier 3D 0.19.3 (compat build), Gamepad API, Web Audio API, AI Hub session client 1.3.0, vanilla ES modules'],
      ['Art Direction', 'Stylized cel shading: MeshToonMaterial with a 3-step gradient ramp, inked outlines, bloom on emissives, crimson Virtual-Boy-inspired palette (optional monochrome "VB Mode")'],
      ['Animation', 'Procedural code-driven animation (banking, barrel rolls, orbiting boss parts, tweens), Rapier rigid-body debris, pooled particle bursts'],
      ['Audio', 'All code-written with Web Audio: step-sequenced synth music (7 tracks: title, 3 sectors, boss, clear, game over), synthesized SFX (klaxon, vulcan, missiles, explosions), Animalese-style gibberish voice acting'],
      ['Online', 'AI Hub Session Protocol v1, side-by-side (parallel) score attack for 1-4 players; no other network features'],
      ['Testing', 'Lightweight: headless Chrome (WebGPU via SwiftShader/Vulkan) smoke tests through Playwright — boot, menus, attract mode, every sector, boss phases, hub harness check'],
      ['Environment', 'Claude Code CLI (headless); Linux; browser unknown'],
      ['Model', 'Anthropic, claude-opus-5-5, reasoning effort medium'],
      ['Usage', 'unknown'],
    ]],
    ['TESTING FEEDBACK', [
      ['Issues caught', '9 (white headless captures traced to the capture path, not the game; menu taps shorter than a frame dropped; Back from a title sub-menu closed the menu; settings list overflowed the screen; planet/girders crowding the lane; over-bright core shaft strips; smoke-script parsing bugs ×3)'],
      ['Critical', '2 — the dropped menu taps and the sub-menu Back that closed the title menu would have stranded players'],
      ['Most helpful', 'Driving the attract-mode AI through every sector with a sim speed-up while reading back render-target pixels'],
      ['Least helpful', 'Plain page screenshots of the WebGPU canvas in headless Chrome (always white)'],
    ]],
    ['ENGINE FEEDBACK', [
      ['Liked most', 'TSL post-processing: one line of toonOutlinePass gave inked cel outlines on every toon mesh; Rapier queries (castRay / intersectionsWithShape) made hit detection trivial'],
      ['Stuck / guessed', 'Guessed r180 naming (PostProcessing still exists alongside RenderPipeline); had to read the source to learn only toon materials get outlines; white headless canvas captures briefly looked like a rendering bug'],
      ['Built myself', 'The rail-flight framework: arc-length track frames, path-relative spawning, boss arenas, plus the sequencer/voice synth'],
      ['Hardest part', 'Keeping physics (world space) and rail-relative gameplay space in sync; WebGPU async init ordering'],
      ['Remove / overhaul', 'The implicit per-material outline rule — an explicit per-object outline flag would be clearer'],
      ['Change one thing', 'Ship a documented, stable post-processing API name across releases'],
    ]],
    ['PROMPT FEEDBACK', [
      ['Liked most', 'Clear deliverable naming, controller-first 10-foot UX focus and the explicit attract-mode spec'],
      ['Confusing', '"Multiplayer … for the game on its own" — read as: integrate the hub, and keep the game fully playable solo'],
      ['Hardest', 'Fitting a full rail-shooter vertical slice (3 sectors, 3 bosses, attract AI, hub mode) into one file'],
      ['One more test', 'A real-GPU, real-DualSense play session to tune feel and difficulty'],
    ]],
  ],
};

// ---- 02_audio.js ----
// ===== Audio: code-written synth music, SFX and Animalese-style voices =====
const Audio = (() => {
  let ctx = null, master, musicBus, sfxBus, voiceBus, noiseBuf, comp;
  let song = null, songName = '', nextStep = 0, stepIdx = 0, schedTimer = null, musicGain = null;
  let muted = false;

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      master = ctx.createGain(); master.connect(comp); comp.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.connect(master);
      voiceBus = ctx.createGain(); voiceBus.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      applyVolumes();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function applyVolumes() {
    if (!ctx) return;
    master.gain.value = muted ? 0 : settings.master;
    musicBus.gain.value = settings.music * 0.55;
    sfxBus.gain.value = settings.sfx * 0.7;
    voiceBus.gain.value = settings.voice * 0.8;
  }
  function setMuted(m) { muted = m; applyVolumes(); }

  // ---------- primitive voices ----------
  function env(g, t, a, peak, dcy, sus = 0.0001) {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(sus, 0.0001), t + a + dcy);
  }
  function tone(bus, { type = 'square', f = 440, f2 = null, t = 0, dur = 0.15, vol = 0.2, a = 0.004, cut = 0, q = 1, detune = 0 }) {
    if (!ctx) return;
    const T = ctx.currentTime + t;
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, T); o.detune.value = detune;
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(f2, 20), T + dur);
    const g = ctx.createGain(); env(g, T, a, vol, dur);
    let n = o;
    if (cut) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = cut; fl.Q.value = q; o.connect(fl); n = fl; }
    n.connect(g); g.connect(bus);
    o.start(T); o.stop(T + a + dur + 0.05);
  }
  function noise(bus, { t = 0, dur = 0.2, vol = 0.3, type = 'lowpass', f = 2000, f2 = null, q = 1, a = 0.003 }) {
    if (!ctx) return;
    const T = ctx.currentTime + t;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, T); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(Math.max(f2, 20), T + dur);
    const g = ctx.createGain(); env(g, T, a, vol, dur);
    s.connect(fl); fl.connect(g); g.connect(bus);
    s.start(T, Math.random()); s.stop(T + a + dur + 0.05);
  }

  // ---------- sound effects ----------
  let lastShot = 0;
  const sfx = {
    shoot(level = 1) {
      if (!ctx || ctx.currentTime - lastShot < 0.05) return; lastShot = ctx.currentTime;
      tone(sfxBus, { type: 'square', f: 1400 + level * 120, f2: 300, dur: 0.07, vol: 0.06 });
      noise(sfxBus, { dur: 0.04, vol: 0.05, type: 'highpass', f: 3000 });
    },
    enemyShot() { tone(sfxBus, { type: 'sawtooth', f: 520, f2: 180, dur: 0.12, vol: 0.05, cut: 2400 }); },
    hitEnemy() { tone(sfxBus, { type: 'triangle', f: 900, f2: 600, dur: 0.04, vol: 0.06 }); },
    clank() { noise(sfxBus, { dur: 0.06, vol: 0.08, type: 'bandpass', f: 2600, q: 6 }); },
    explodeSmall() {
      noise(sfxBus, { dur: 0.45, vol: 0.32, f: 2400, f2: 120 });
      tone(sfxBus, { type: 'sine', f: 160, f2: 40, dur: 0.35, vol: 0.25 });
    },
    explodeBig() {
      noise(sfxBus, { dur: 1.6, vol: 0.5, f: 1800, f2: 60, a: 0.01 });
      tone(sfxBus, { type: 'sine', f: 90, f2: 25, dur: 1.2, vol: 0.5 });
      noise(sfxBus, { t: 0.15, dur: 0.9, vol: 0.25, type: 'bandpass', f: 900, f2: 200, q: 2 });
    },
    lock(n = 0) { tone(sfxBus, { type: 'square', f: 880 + n * 110, dur: 0.06, vol: 0.07, cut: 5000 }); },
    missile() { noise(sfxBus, { dur: 0.5, vol: 0.18, type: 'bandpass', f: 800, f2: 3000, q: 1.5 }); tone(sfxBus, { type: 'sawtooth', f: 200, f2: 900, dur: 0.3, vol: 0.05, cut: 1800 }); },
    bomb() {
      tone(sfxBus, { type: 'sawtooth', f: 60, f2: 1200, dur: 0.6, vol: 0.18, cut: 3000 });
      noise(sfxBus, { t: 0.4, dur: 2.0, vol: 0.5, f: 3000, f2: 50 });
      tone(sfxBus, { t: 0.4, type: 'sine', f: 70, f2: 20, dur: 1.6, vol: 0.5 });
    },
    hurt() { tone(sfxBus, { type: 'sawtooth', f: 240, f2: 60, dur: 0.3, vol: 0.2, cut: 1500 }); noise(sfxBus, { dur: 0.25, vol: 0.25, f: 1200 }); },
    scrape() { noise(sfxBus, { dur: 0.12, vol: 0.12, type: 'bandpass', f: 4000, q: 3 }); },
    pickup() { [0, 4, 7, 12].forEach((s, i) => tone(sfxBus, { type: 'square', f: 660 * 2 ** (s / 12), t: i * 0.05, dur: 0.08, vol: 0.07 })); },
    oneUp() { [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => tone(sfxBus, { type: 'triangle', f: 523 * 2 ** (s / 12), t: i * 0.06, dur: 0.12, vol: 0.12 })); },
    roll() { noise(sfxBus, { dur: 0.35, vol: 0.12, type: 'bandpass', f: 600, f2: 2400, q: 2 }); },
    boost() { noise(sfxBus, { dur: 0.5, vol: 0.12, type: 'lowpass', f: 400, f2: 2000 }); },
    menuMove() { tone(sfxBus, { type: 'square', f: 660, dur: 0.04, vol: 0.05, cut: 3000 }); },
    menuOk() { tone(sfxBus, { type: 'square', f: 880, dur: 0.06, vol: 0.06 }); tone(sfxBus, { type: 'square', f: 1320, t: 0.06, dur: 0.08, vol: 0.06 }); },
    menuBack() { tone(sfxBus, { type: 'square', f: 520, f2: 330, dur: 0.1, vol: 0.06 }); },
    // The titular klaxon: two-tone blare.
    klaxon(times = 3) {
      for (let i = 0; i < times; i++) {
        tone(sfxBus, { type: 'sawtooth', f: 440, f2: 660, t: i * 0.7, dur: 0.32, vol: 0.12, cut: 2600, a: 0.02 });
        tone(sfxBus, { type: 'sawtooth', f: 660, f2: 440, t: i * 0.7 + 0.33, dur: 0.32, vol: 0.12, cut: 2600, a: 0.02 });
      }
    },
    warn() { tone(sfxBus, { type: 'square', f: 980, dur: 0.08, vol: 0.06 }); tone(sfxBus, { type: 'square', f: 980, t: 0.14, dur: 0.08, vol: 0.06 }); },
    gate() { tone(sfxBus, { type: 'sawtooth', f: 110, dur: 0.25, vol: 0.06, cut: 600 }); },
    laserCharge() { tone(sfxBus, { type: 'sawtooth', f: 100, f2: 1600, dur: 1.2, vol: 0.08, cut: 2400, a: 0.05 }); },
    laserFire() { noise(sfxBus, { dur: 1.4, vol: 0.2, type: 'bandpass', f: 1200, q: 0.8 }); tone(sfxBus, { type: 'sawtooth', f: 80, dur: 1.4, vol: 0.12, cut: 900 }); },
  };

  // ---------- music: step sequencer over generated songs ----------
  const NOTE = (m) => 440 * 2 ** ((m - 69) / 12);
  const MINOR = [0, 2, 3, 5, 7, 8, 10];
  function makeSong(def) {
    const r = mulberry(def.seed);
    const bars = def.prog.length;
    const lead = [];
    for (let b = 0; b < bars; b++) {
      const deg = def.prog[b];
      for (let s = 0; s < 16; s++) {
        const on = def.leadRhythm[s] === 'x' && r() < def.leadDensity;
        if (!on) { lead.push(null); continue; }
        const chordTones = [0, 2, 4, 7].map((k) => deg + k);
        const pick = chordTones[Math.floor(r() * chordTones.length)];
        const oct = Math.floor(pick / 7), idx = ((pick % 7) + 7) % 7;
        lead.push(def.root + 12 + MINOR[idx] + 12 * oct + (r() < 0.15 ? 12 : 0));
      }
    }

// ===== Input: controller-first; keyboard and mouse map onto the pad's model =====
const Input = (() => {
  const keys = new Set(), keysHit = new Set();
  const mouse = { l: false, r: false, lHit: false, rHit: false };
  let pad = null, prevBtn = [], btn = [], btnHit = [], axes = [0, 0, 0, 0];
  let lastActivity = performance.now(), anyThisFrame = false, padIndex = -1;
  let navHeld = { dir: null, t: 0, next: 0 };
  const state = {
    x: 0, y: 0, fire: false, lock: false, lockHit: false, lockReleased: false, bomb: false, camera: false,
    rollL: false, rollR: false, boost: 0, brake: 0, pause: false,
    up: false, down: false, left: false, right: false, ok: false, back: false, any: false, usingPad: false,
  };
  let prevLock = false;

  addEventListener('keydown', (e) => {
    if (e.repeat) { if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault(); return; }
    keys.add(e.code); keysHit.add(e.code); activity(); state.usingPad = false;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
  });
  addEventListener('keyup', (e) => keys.delete(e.code));
  addEventListener('blur', () => { keys.clear(); mouse.l = mouse.r = false; });
  addEventListener('mousedown', (e) => {
    activity(); if (e.button === 0) { mouse.l = true; mouse.lHit = true; } if (e.button === 2) { mouse.r = true; mouse.rHit = true; }
  });
  addEventListener('mouseup', (e) => { if (e.button === 0) mouse.l = false; if (e.button === 2) mouse.r = false; });
  addEventListener('contextmenu', (e) => e.preventDefault());
  addEventListener('mousemove', () => { lastActivity = performance.now(); });
  addEventListener('gamepadconnected', () => activity());

  function activity() { lastActivity = performance.now(); anyThisFrame = true; Audio.ensure(); }
  const k = (...codes) => codes.some((c) => keys.has(c));
  const kh = (...codes) => codes.some((c) => keysHit.has(c));

  function readPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    pad = null;
    if (padIndex >= 0 && pads[padIndex] && pads[padIndex].connected) pad = pads[padIndex];
    else for (const p of pads) if (p && p.connected) { pad = p; padIndex = p.index; break; }
    prevBtn = btn;
    btn = pad ? pad.buttons.map((b) => b.pressed || b.value > 0.5) : [];
    btnHit = btn.map((b, i) => b && !prevBtn[i]);
    axes = pad ? [0, 1, 2, 3].map((i) => pad.axes[i] || 0) : [0, 0, 0, 0];
    if (pad && (btnHit.some(Boolean) || axes.some((a) => Math.abs(a) > 0.5))) { activity(); state.usingPad = true; }
  }
  const dz = (v) => (Math.abs(v) < 0.18 ? 0 : (v - Math.sign(v) * 0.18) / 0.82);
  const B = (i) => !!btn[i];
  const BH = (i) => !!btnHit[i];
  const val = (i) => (pad && pad.buttons[i] ? pad.buttons[i].value : 0);

  function update(dt) {
    readPad();
    const createHeld = B(8);
    let ax = dz(axes[0]), ay = dz(axes[1]);
    if (settings.invertX) ax = -ax;
    if (settings.invertY) ay = -ay;
    let kx = (k('KeyD', 'ArrowRight') ? 1 : 0) - (k('KeyA', 'ArrowLeft') ? 1 : 0);
    let ky = (k('KeyS', 'ArrowDown') ? 1 : 0) - (k('KeyW', 'ArrowUp') ? 1 : 0);
    if (B(12)) ky = -1; if (B(13)) ky = 1; if (B(14)) kx = -1; if (B(15)) kx = 1;
    state.x = clamp(ax + kx, -1, 1);
    // screen-space: up on the stick = climb (unless pilot pitch is on)
    const rawY = clamp(ay + ky, -1, 1);
    state.y = settings.pilotPitch ? rawY : -rawY;
    state.fire = B(0) || k('KeyJ', 'Space') || mouse.l;
    const lockNow = B(2) || k('KeyK') || mouse.r;
    state.lockHit = lockNow && !prevLock; state.lockReleased = !lockNow && prevLock; state.lock = lockNow; prevLock = lockNow;
    state.bomb = BH(3) || kh('KeyL', 'KeyB');
    state.camera = BH(1) || BH(11) || kh('KeyC', 'KeyV');
    state.rollL = BH(4) || kh('KeyQ');
    state.rollR = BH(5) || kh('KeyE');
    state.boost = Math.max(val(7), k('ShiftLeft', 'ShiftRight') ? 1 : 0);
    state.brake = Math.max(val(6), k('ControlLeft', 'ControlRight', 'KeyZ') ? 1 : 0);
    state.pause = (BH(9) && !createHeld) || kh('Escape', 'KeyP');
    // menu navigation with auto-repeat (stick, d-pad, arrows, WASD)
    let nx = (Math.abs(ax) > 0.5 ? Math.sign(ax) : 0) || (B(14) ? -1 : B(15) ? 1 : 0) || (k('ArrowLeft', 'KeyA') ? -1 : k('ArrowRight', 'KeyD') ? 1 : 0);
    let ny = (Math.abs(ay) > 0.5 ? Math.sign(ay) : 0) || (B(12) ? -1 : B(13) ? 1 : 0) || (k('ArrowUp', 'KeyW') ? -1 : k('ArrowDown', 'KeyS') ? 1 : 0);
    const dir = ny < 0 ? 'up' : ny > 0 ? 'down' : nx < 0 ? 'left' : nx > 0 ? 'right' : null;
    state.up = state.down = state.left = state.right = false;
    // taps shorter than a frame still count
    if (kh('ArrowUp', 'KeyW')) state.up = true; if (kh('ArrowDown', 'KeyS')) state.down = true;
    if (kh('ArrowLeft', 'KeyA')) state.left = true; if (kh('ArrowRight', 'KeyD')) state.right = true;
    if (BH(12)) state.up = true; if (BH(13)) state.down = true; if (BH(14)) state.left = true; if (BH(15)) state.right = true;
    const now = performance.now();
    if (dir) {
      if (navHeld.dir !== dir) { navHeld = { dir, t: now, next: now + 380 }; if (!state.up && !state.down && !state.left && !state.right) state[dir] = true; }
      else if (now >= navHeld.next) { navHeld.next = now + 110; state[dir] = true; }
    } else navHeld.dir = null;
    state.ok = BH(0) || kh('Enter', 'Space', 'KeyJ');
    state.back = BH(1) || kh('Escape', 'Backspace');
    state.any = anyThisFrame || btnHit.some(Boolean);
    anyThisFrame = false;
    keysHit.clear(); mouse.lHit = mouse.rHit = false;
  }
  function rumble(strong = 0.5, weak = 0.5, ms = 120) {
    if (!settings.rumble || !pad || !pad.vibrationActuator) return;
    try { pad.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong, weakMagnitude: weak }); } catch (e) { /* unsupported */ }
  }
  return { state, update, rumble, idleMs: () => performance.now() - lastActivity, poke: activity, hasPad: () => !!pad };
})();

let renderer, scene, camera, post, vbUniform, flashUniform;

async function initRenderer() {
  if (!navigator.gpu) throw new Error('This browser has no WebGPU. Blaring Red needs a WebGPU browser (Chrome/Edge 113+, Safari 26+, Firefox 141+).');
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error('WebGPU is present but no GPU adapter is available.');
  renderer = new THREE.WebGPURenderer({ canvas: $('gl'), antialias: true, forceWebGL: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  await renderer.init();
  if (!renderer.backend || !renderer.backend.isWebGPUBackend) throw new Error('WebGPU backend failed to start (no WebGL fallback by design).');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0004);
  scene.fog = new THREE.Fog(0x0a0004, 120, 520);
  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 3000);

  hemi = new THREE.HemisphereLight(0xffd8d0, 0x502030, 2.2); scene.add(hemi);
  sun = new THREE.DirectionalLight(0xffffff, 4.2);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);

  sun.shadow.bias = -0.0008;
  scene.add(sun, sun.target);

  // post: inked toon outlines + bloom + optional Virtual-Boy monochrome + damage flash
  post = new THREE.PostProcessing(renderer);
  const scenePass = toonOutlinePass(scene, camera, new THREE.Color(0x050003), 0.005, 1);
  const glow = bloom(scenePass, 0.75, 0.35, 0.62);
  vbUniform = uniform(settings.vbMode ? 1 : 0);
  flashUniform = uniform(0);
  const lit = scenePass.add(glow);
  const lum = luminance(lit.rgb);
  const scan = sin(screenUV.y.mul(900)).mul(0.08).add(0.92);
  const vb = vec3(lum.mul(1.25).mul(scan), lum.mul(0.08), lum.mul(0.06));
  const graded = mix(lit.rgb, vb, vbUniform);
  const flashed = mix(graded, vec3(1.0, 0.08, 0.05), flashUniform.mul(0.45));
  post.outputNode = vec4(flashed, 1.0);

  buildStarfield();
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

let world;
const G = { STATIC: 0x1, ENEMY: 0x2, DEBRIS: 0x4, QUERY: 0x8 };
const groups = (member, filter) => ((member & 0xffff) << 16) | (filter & 0xffff);

  await RAPIER.init();
  world = new RAPIER.World({ x: 0, y: 0, z: 0 });
}
function resetPhysics() {
  if (world) world.free();
  world = new RAPIER.World({ x: 0, y: 0, z: 0 });
  colliderOwner.clear();
}
function addStaticBox(cx, cy, cz, hx, hy, hz, quat) {
  const body = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(cx, cy, cz).setRotation(quat || { x: 0, y: 0, z: 0, w: 1 }));
  const col = world.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setCollisionGroups(groups(G.STATIC, G.DEBRIS | G.QUERY)), body);
  return col;
}
function addStaticBall(cx, cy, cz, r) {
  const body = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(cx, cy, cz));
  return world.createCollider(RAPIER.ColliderDesc.ball(r).setCollisionGroups(groups(G.STATIC, G.DEBRIS | G.QUERY)), body);
}
function addKinematic(owner, shapeDesc) {
  const body = world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased());
  const col = world.createCollider(shapeDesc.setCollisionGroups(groups(G.ENEMY, G.QUERY)), body);
  colliderOwner.set(col.handle, owner);

// ===== Gameplay: player, weapons, enemies, hazards, pickups, scoring =====
const Game = {
  running: false, paused: false, stageIdx: 0, stage: null, track: null, t: 0,
  player: null, enemies: [], ebullets: [], pbullets: [], missiles: [], pickups: [], hazards: [], boss: null,
  events: [], evIdx: 0, arena: null, score: 0, chain: 0, chainT: 0, stats: null, demo: false, session: false,
  ctl: null, shake: 0, lowAlarmT: 0, stageDone: false, onStageEnd: null, onGameOver: null, hintShown: {},

const diff = () => (Game.demo ? DIFF.easy : DIFF[settings.difficulty] || DIFF.normal);

// ---------- player ----------
function newPlayer(keep) {
  const P = {
    d: 0, z: 0, x: 0, y: 0, vx: 0, vy: 0, speed: 30, pos: V3(), prevPos: V3(), fwd: V3(), up: V3(), right: V3(),
    shield: 100, maxShield: 100, lives: 3, bombs: 3, weapon: 1, boostMeter: 100, missiles: 6, missileRegen: 0,
    locks: [], lockTimer: 0, locking: false, fireT: 0, rollT: 0, rollDir: 0, rollCd: 0, invuln: 2, alive: true, respawnT: 0,
    bank: 0, camMode: settings.camera, boosting: false, scrapeT: 0, volley: null, mesh: null,

}

function updatePlayer(dt) {

  const base = S.baseSpeed;
  P.prevPos.copy(P.pos);
  if (!P.alive) {
    P.respawnT -= dt;
    if (!Game.arena) P.d += base * 0.6 * dt;
    if (P.respawnT <= 0) respawn();
    tr.toWorld(dEff(), P.x, P.y, P.pos);
    return;
  }
  // throttle: afterburner / brake (in boss arenas it moves you forward/back instead)
  P.boosting = c.boost > 0.2 && P.boostMeter > 1;
  if (P.boosting && !P.wasBoosting) Audio.sfx.boost();
  P.wasBoosting = P.boosting;
  if (P.boosting) P.boostMeter = Math.max(0, P.boostMeter - (Game.boss && Game.boss.chase ? 20 : 30) * dt * (Game.demo ? 0 : 1));
  else P.boostMeter = Math.min(100, P.boostMeter + 14 * dt);
  const braking = c.brake > 0.2;
  if (Game.arena) {
    const vz = (P.boosting ? 18 : 0) - (braking ? 18 : 0);
    P.z = clamp(P.z + vz * dt, -16, 14);
    P.speed = damp(P.speed, Math.abs(vz) + 6, 4, dt);
  } else {
    const target = P.boosting ? base * 1.75 : braking ? base * 0.38 : base;
    P.speed = damp(P.speed, target, 2.6, dt);
    P.d += P.speed * dt;
  }

  const maxV = 21;
  P.vx = damp(P.vx, c.x * maxV, 7, dt); P.vy = damp(P.vy, c.y * maxV, 7, dt);
  // barrel roll: i-frames + lateral dash, deflects bullets
  P.rollCd -= dt;
  if ((c.rollL || c.rollR) && P.rollCd <= 0) {
    P.rollDir = c.rollL ? -1 : 1; P.rollT = 0.55; P.rollCd = 0.75; Audio.sfx.roll(); Input.rumble(0.1, 0.4, 90);
  }
  let rollX = 0;
  if (P.rollT > 0) { P.rollT -= dt; rollX = P.rollDir * 22 * Math.min(1, P.rollT / 0.3); }
  P.x += (P.vx + rollX) * dt; P.y += P.vy * dt;
  // bounds of the corridor
  const b = S.bounds(P.d);
  let scraped = false;
  if (b.round) {
    const nx = P.x / b.w, ny = P.y / b.h, r = Math.hypot(nx, ny);
    if (r > 1) { P.x /= r; P.y /= r; scraped = true; }
  } else {
    if (Math.abs(P.x) > b.w) { P.x = Math.sign(P.x) * b.w; scraped = b.walls; }
    if (Math.abs(P.y) > b.h) { P.y = Math.sign(P.y) * b.h; scraped = scraped || b.walls; }
  }
  if (scraped && !Game.demo) {
    P.scrapeT -= dt;
    if (P.scrapeT <= 0) { P.scrapeT = 0.12; Audio.sfx.scrape(); FX.sparks(P.pos, 4); damagePlayer(2.5, true); Input.rumble(0.3, 0.1, 60); }
  }
  // world transform
  const F = tr.frame(dEff(), _F);
  P.fwd.copy(F.t); P.up.copy(F.u); P.right.copy(F.r);
  P.pos.copy(F.p).addScaledVector(F.r, P.x).addScaledVector(F.u, P.y);

  tr.orient(P.mesh, dEff(), P.bank + spin, -P.vx * 0.012, P.vy * 0.02);
  P.mesh.position.copy(P.pos);
  P.mesh.visible = P.camMode === 'chase' && !(P.invuln > 0 && Math.floor(P.invuln * 12) % 2 === 0);
  const fl = P.mesh.userData.flames, th = P.boosting ? 2.0 : braking ? 0.5 : 1;
  for (const f of fl) { f.scale.y = damp(f.scale.y, 1.2 * th + Math.random() * 0.3, 12, dt); f.material.color.setHex(P.boosting ? 0xffe0a0 : 0x60c8ff); }
  const sh = P.mesh.userData.shield; sh.material.opacity = damp(sh.material.opacity, 0, 6, dt); sh.rotation.y += dt * 3;
  P.invuln = Math.max(0, P.invuln - dt);

  weapons(dt);
  if (c.camera) { P.camMode = P.camMode === 'chase' ? 'cockpit' : 'chase'; Audio.sfx.menuMove(); }
  // collisions with level geometry and enemy bodies (Rapier queries)
  if (!Game.demo && P.invuln <= 0 && P.rollT <= 0) {
    let hitStatic = false, rammed = null;
    overlaps(P.pos, 1.1, G.STATIC | G.ENEMY, (col, owner) => {

    });
    if (hitStatic) { damagePlayer(14); P.x *= 0.8; P.y *= 0.8; P.speed *= 0.6; P.invuln = Math.max(P.invuln, 0.9); FX.sparks(P.pos, 12); Audio.sfx.clank(); }

  }

function pathPoints(seed, n, step, ampX, ampY) {
  const r = mulberry(seed), pts = [];
  let x = 0, y = 0;
  for (let i = 0; i < n; i++) {
    pts.push([x, y, -i * step]);
    if (i > 0) { x += (r() * 2 - 1) * ampX; y = clamp(y + (r() * 2 - 1) * ampY, -ampY * 2, ampY * 2); }
  }
  return pts;
}
// merge many transformed boxes into one geometry per chunk (fewer draw calls)
function mergedBoxes(list) {
  const geos = list.map(({ m }) => GEO.box.clone().applyMatrix4(m));
  return mergeGeometries(geos, false);
}
function frameMatrix(track, d, x, y, sx, sy, sz, rotZ = 0) {
  const F = track.frame(d, makeFrame());
  _m1.makeBasis(F.r, F.u, _v4.copy(F.t).negate());
  const q = new THREE.Quaternion().setFromRotationMatrix(_m1);
  if (rotZ) q.multiply(_q1.setFromAxisAngle(_v4.set(0, 0, 1), rotZ));
  const p = V3().copy(F.p).addScaledVector(F.r, x).addScaledVector(F.u, y);
  return { m: new THREE.Matrix4().compose(p, q, new THREE.Vector3(sx, sy, sz)), p, q };
}
function rockAt(track, d, x, y, s, collide = true) {
  const p = track.toWorld(d, x, y, V3());
  const m = mesh(Math.random() < 0.5 ? GEO.ico : GEO.ico1, toon(PAL.rock), envGroup, p.x, p.y, p.z);
  m.scale.set(s * rand(0.8, 1.2), s * rand(0.7, 1.1), s * rand(0.8, 1.3));
  m.rotation.set(rand(0, 6), rand(0, 6), rand(0, 6));
  m.userData.spin = V3().set(rand(-0.3, 0.3), rand(-0.3, 0.3), 0);
  Stage.spinners.push(m);
  if (collide) addStaticBall(p.x, p.y, p.z, s * 0.85);
  return m;
}
function rockField(track, d0, d1, density, bounds, seed) {
  const r = mulberry(seed);
  for (let d = d0; d < d1; d += 14 / density) {
    // in-corridor obstacles (dodge them)
    if (r() < 0.75) rockAt(track, d + r() * 10, (r() * 2 - 1) * bounds.w * 0.9, (r() * 2 - 1) * bounds.h * 0.9, 1.8 + r() * 2.6);

    rockAt(track, d + r() * 10, Math.cos(a) * R, Math.sin(a) * R * 0.6, 3 + r() * 9, false);

}

      g.fillStyle = '#ffb8a0'; g.beginPath(); g.ellipse(60, 55, 26, 32, 0, 0, 7); g.fill();
      g.fillStyle = '#c01828'; g.beginPath(); g.ellipse(60, 38, 32, 26, 0, Math.PI, 0); g.fill(); g.fillRect(28, 38, 10, 40); g.fillRect(82, 38, 10, 40);
      g.fillStyle = '#000'; g.fillRect(46, 52, 8, 4); g.fillRect(66, 52, 8, 4);
      g.fillStyle = '#7a1020'; g.fillRect(52, 72, 16, 2 + talk);
      g.strokeStyle = '#59f0ff'; g.lineWidth = 3; g.beginPath(); g.arc(88, 48, 9, 0, 7); g.stroke();

      g.fillStyle = '#ff1030'; g.beginPath(); g.arc(60, 60, 18 + talk, 0, 7); g.fill();
      g.fillStyle = '#000'; g.beginPath(); g.arc(60, 60, 7, 0, 7); g.fill();
      g.strokeStyle = '#ff2080'; g.lineWidth = 2; for (let i = 0; i < 8; i++) { const a = i * 0.785 + t; g.beginPath(); g.moveTo(60 + Math.cos(a) * 40, 60 + Math.sin(a) * 40); g.lineTo(60 + Math.cos(a) * 56, 60 + Math.sin(a) * 56); g.stroke(); }
    } else {
      g.fillStyle = '#4a3a48'; g.fillRect(24, 26, 72, 70);

      g.fillStyle = '#2a1a22'; g.fillRect(40, 76, 40, 8);

  }
  function update(dt) {
    if (!cur && queue.length) {

})();

// ===== Menus: 10-foot, controller-first focus navigation (mouse and keyboard map onto it) =====
const UI = (() => {
  const root = $('ui');
  let screen = null, items = [], focus = 0, stack = [];
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function render() {
    root.innerHTML = '';
    if (!screen) return;
    const s = h('div', 'screen' + (screen.clear ? ' clear' : ''));
    if (screen.logo) {
      const l = h('div', 'logo'); l.innerHTML = 'BLARING <span>RED</span>'; s.appendChild(l);
      s.appendChild(h('div', 'tag', screen.tag || 'A SPIRITUAL SUCCESSOR TO RED ALARM'));
    }
    if (screen.title) s.appendChild(h('div', 'h1', screen.title));
    if (screen.body) s.appendChild(screen.body());
    items = screen.items || [];
    if (items.length) {
      const m = h('div', 'menu' + (items.length > 7 ? ' long' : ''));
      items.forEach((it, i) => {
        const row = h('div', 'item' + (i === focus ? ' focus' : '') + (it.disabled ? ' disabled' : ''));
        row.appendChild(h('span', '', it.label));
        if (it.value) row.appendChild(h('span', 'val', (it.left ? '◀ ' : '') + it.value() + (it.right ? ' ▶' : '')));
        row.addEventListener('mouseenter', () => { if (focus !== i) { focus = i; Audio.sfx.menuMove(); paint(); } });
        row.addEventListener('click', (e) => { focus = i; activate(e.clientX > row.getBoundingClientRect().left + row.offsetWidth * 0.6 ? 'right' : 'ok'); });
        m.appendChild(row);
      });
      s.appendChild(m);
    }
    const hint = h('div', 'hint');
    hint.innerHTML = glyphs(screen.hint || (items.length ? '{OK} SELECT   ' + (screen.back ? '{BACK} BACK' : '') : '{OK} CONTINUE'));
    s.appendChild(hint);
    root.appendChild(s);
    paint();
    if (screen.onRender) screen.onRender(s);
  }
  function paint() {
    const rows = root.querySelectorAll('.item');
    rows.forEach((r, i) => {
      r.classList.toggle('focus', i === focus);
      if (i === focus && r.scrollIntoView) r.scrollIntoView({ block: 'nearest' });
      const it = items[i];
      if (it && it.value) r.lastChild.textContent = (it.left ? '◀ ' : '') + it.value() + (it.right ? ' ▶' : '');
    });
  }
  function open(def, push = true) {
    if (push && screen && !screen.noStack) stack.push({ screen, focus });
    screen = def; focus = def.focus || 0;
    while (items[focus] && items[focus].disabled) focus++;
    render();
  }
  function replace(def) { screen = def; focus = def.focus || 0; render(); }
  function close() { screen = null; stack = []; items = []; root.innerHTML = ''; }
  function back() {
    if (!screen) return;
    if (screen.onBack) { Audio.sfx.menuBack(); screen.onBack(); return; }
    if (!screen.back) return;
    Audio.sfx.menuBack();
    const prev = stack.pop();
    if (prev) { screen = prev.screen; focus = prev.focus; render(); } else close();
  }
  function activate(kind) {
    const it = items[focus];
    if (!screen) return;
    if (!it) { if (kind === 'ok' && screen.onOk) { Audio.sfx.menuOk(); screen.onOk(); } return; }
    if (it.disabled) return;
    if (kind === 'left' && it.left) { it.left(); Audio.sfx.menuMove(); paint(); return; }
    if (kind === 'right' && it.right) { it.right(); Audio.sfx.menuMove(); paint(); return; }
    if (kind === 'ok') {
      if (it.action) { Audio.sfx.menuOk(); it.action(); }
      else if (it.right) { it.right(); Audio.sfx.menuMove(); paint(); }
    }
  }
  function update() {
    if (!screen) return;
    const s = Input.state;
    if (items.length) {
      const move = (dir) => { let n = focus; do { n = (n + dir + items.length) % items.length; } while (items[n].disabled && n !== focus); focus = n; Audio.sfx.menuMove(); paint(); };
      if (s.up) move(-1);
      if (s.down) move(1);
      if (s.left) activate('left');
      if (s.right) activate('right');
    }
    if (s.ok) activate('ok');
    else if (s.back || (s.pause && screen.pauseCloses)) back();
    if (screen && screen.tick) screen.tick();
  }
  return { open, replace, close, back, update, render, get screen() { return screen; }, h };
})();

function loadStage(idx, opts = {}) {
  const keep = opts.keepPlayer && Game.player ? { lives: Game.player.lives, bombs: Game.player.bombs, weapon: Game.player.weapon } : null;
  clearWorld();
  const S = STAGES[idx];
  Game.stageIdx = idx; Game.stage = S; Game.track = S.track();
  Game.events = S.events.slice().sort((a, b) => a[0] - b[0]); Game.evIdx = 0;
  Game.stats = { kills: 0, spawned: 0, hits: 0, time: 0, start: App.simTime };
  Game.stageDone = false; Game.chain = 0; Game.chainT = 0; Game.t = 0; Game.lowAlarmT = 0;
  scene.background.setHex(S.sky[0]); scene.fog.color.setHex(S.fog[0]); scene.fog.near = S.fog[1]; scene.fog.far = S.fog[2];
  sun.color.setHex(S.sunColor);
  starfield.visible = idx !== 1;
  S.env(Game.track);
  Game.player = newPlayer(keep);
  const P = Game.player;
  P.d = opts.startD || 0; P.speed = S.baseSpeed;
  while (Game.evIdx < Game.events.length && Game.events[Game.evIdx][0] < P.d - 1) Game.evIdx++;
  if (opts.startD) { Game.evIdx = Math.max(0, Game.evIdx); }
  Game.track.toWorld(P.d, 0, 0, P.pos);
  camPos.copy(P.pos).addScaledVector(Game.track.frame(P.d, _F).t, -12);
  Game.running = true; Game.paused = false;
  HUD.show(true);
  Audio.music(S.music);
}

function endStage() {
  if (Game.stageDone) return;
  Game.stageDone = true;
  const P = Game.player, st = Game.stats;
  st.time = App.simTime - st.start;
  const killPct = st.spawned ? Math.round((st.kills / st.spawned) * 100) : 100;
  const bossBonus = Game.boss ? (Game.boss.escaped ? 0 : 10000) : 0;
  const noHit = st.hits === 0 ? 5000 : 0;
  const shieldBonus = Math.round(P.shield) * 20;
  const killBonus = killPct * 60;
  const bonus = bossBonus + noHit + shieldBonus + killBonus;
  const rank = killPct >= 85 && st.hits <= 3 ? 'S' : killPct >= 70 && st.hits <= 8 ? 'A' : killPct >= 50 ? 'B' : 'C';
  const res = { killPct, hits: st.hits, time: st.time, bossBonus, noHit, shieldBonus, killBonus, bonus, rank, escaped: Game.boss && Game.boss.escaped };
  if (!Game.demo) { Game.score += bonus; if (Game.session) AIHub.progress({ score: Game.score, label: `Sector ${Game.stageIdx + 1} clear` }); }
  Game.ranks = (Game.ranks || []).concat(rank);
  HUD.banner(`${Game.stage.name} CLEAR`, `RANK ${rank}`, 3);
  Audio.music('clear');
  setTimeout(() => {
    if (!Game.stageDone || App.state !== 'play' || Game.demo) return;
    if (Game.stageIdx === STAGES.length - 1) showEnding(res); else showTally(res);
  }, 3200);
}

// ---------- attract mode (AI pilot, cheats freely) ----------
const ATTRACT_SEQ = [
  { stage: 0, d: 0, dur: 24, cam: 'chase' },
  { stage: 0, d: 2200, dur: 26, cam: 'chase' },
  { stage: 1, d: 260, dur: 24, cam: 'cockpit' },
  { stage: 1, d: 1830, dur: 24, cam: 'chase' },
  { stage: 2, d: 840, dur: 40, cam: 'chase' },
];
function startAttract() {
  App.state = 'attract'; App.backdrop = false;
  UI.close();
  App.attract = { seg: -1, t: 0, ai: { x: 0, y: 0, fire: true, lock: false, bomb: false, camera: false, rollL: false, rollR: false, boost: 0, brake: 0, lockT: 0, bombT: 12, rollT: 2 } };
  nextAttractSegment();
}
function nextAttractSegment() {
  const A = App.attract;
  A.seg = (A.seg + 1) % ATTRACT_SEQ.length; A.t = 0;
  const seg = ATTRACT_SEQ[A.seg];
  loadStage(seg.stage, { startD: seg.d });
  Game.demo = true; Game.score = 0;
  Game.player.camMode = seg.cam; Game.player.lives = 3;
  HUD.banner(Game.stage.name, Game.stage.title, 2);
}
function attractAI(dt) {
  const A = App.attract, ai = A.ai, P = Game.player;
  // pick the nearest live target ahead and steer the lane offset toward it
  let best = null, bestD = Infinity;
  for (const e of Game.enemies) {
    if (!e.alive || !e.lockable) continue;
    _v1.copy(e.pos).sub(P.pos); const fwd = _v1.dot(P.fwd);
    if (fwd < 8 || fwd > 160) continue;
    if (fwd < bestD) { bestD = fwd; best = e; }
  }
  let tx = Math.sin(App.simTime * 0.4) * 6, ty = Math.cos(App.simTime * 0.3) * 3;
  if (best) { _v1.copy(best.pos).sub(P.pos); tx = P.x + _v1.dot(P.right); ty = P.y + _v1.dot(P.up); }
  // dodge gates: aim for the green ring
  for (const hz of Game.hazards) if (hz.kind === 'gate' && hz.d > P.d && hz.d - P.d < 60) { tx = hz.hx; ty = hz.hy; }
  ai.x = clamp((tx - P.x) * 0.25, -1, 1); ai.y = clamp((ty - P.y) * 0.25, -1, 1);
  ai.fire = true;
  ai.lockT -= dt;
  ai.lock = ai.lockT > 0;
  if (ai.lockT < -2.2) ai.lockT = 1.0;
  ai.bombT -= dt; ai.bomb = ai.bombT <= 0; if (ai.bomb) ai.bombT = 14;
  ai.rollT -= dt; ai.rollL = ai.rollR = false;
  if (ai.rollT <= 0) { ai.rollT = rand(3, 6); if (Math.random() < 0.5) ai.rollL = true; else ai.rollR = true; }
  const gap = Game.boss && Game.boss.chase ? Game.boss.d - P.d : 0;
  ai.boost = (Game.arena && Game.boss && Math.sin(App.simTime * 0.5) > 0.6) || gap > 60 ? 1 : 0;
  ai.brake = Game.arena && Math.sin(App.simTime * 0.5) < -0.7 ? 1 : 0;
  ai.camera = false;
  P.invuln = Math.max(P.invuln, 0.05);
  P.shield = P.maxShield; P.missiles = 6;
  A.t += dt;
  if (A.t > ATTRACT_SEQ[A.seg].dur || Game.stageDone || (Game.boss && Game.boss.dead && A.t > 8)) nextAttractSegment();
  return ai;
}

function reportResult(why) {
  if (!Game.session || App.reported) return;
  App.reported = true;
  const st = Game.stats || { kills: 0 };
  const awards = [];
  if ((Game.ranks || []).includes('S')) awards.push({ title: 'S-Rank Sector', detail: 'Flawless flying' });

// ---- 12_main.js ----
// ===== Main loop, camera, boot, AI Hub session wiring =====
const camPos = V3(), camLook = V3(), camUp = V3(0, 1, 0);
const IDLE_CTL = { x: 0, y: 0, fire: false, lock: false, bomb: false, camera: false, rollL: false, rollR: false, boost: 0, brake: 0 };

function updateCamera(dt) {
  const P = Game.player, tr = Game.track;
  const F = tr.frame(dEff(), _F);
  if (P.camMode === 'cockpit') {
    _v1.copy(P.pos).addScaledVector(F.u, 0.45).addScaledVector(F.t, 0.4);
    camPos.copy(_v1);
    tr.toWorld(dEff() + 60, P.x + P.vx * 0.4, P.y + P.vy * 0.4, camLook);
    camUp.copy(F.u).applyAxisAngle(F.t, -P.bank * 1.2 - (P.rollT > 0 ? P.rollDir * (1 - P.rollT / 0.55) * Math.PI * 2 : 0));
  } else {
    tr.toWorld(dEff() - 11 - (P.boosting ? 2.5 : 0), P.x * 0.82, P.y * 0.82 + 3.2, _v1);
    camPos.x = damp(camPos.x, _v1.x, 9, dt); camPos.y = damp(camPos.y, _v1.y, 9, dt); camPos.z = damp(camPos.z, _v1.z, 9, dt);
    if (camPos.distanceTo(_v1) > 30) camPos.copy(_v1);
    tr.toWorld(dEff() + 24, P.x * 0.6, P.y * 0.6 + 1, camLook);
    camUp.copy(F.u).applyAxisAngle(F.t, -P.bank * 0.3);
  }
  camera.position.copy(camPos);
  if (Game.shake > 0 && settings.shake) {
    camera.position.x += rand(-1, 1) * Game.shake * 0.6; camera.position.y += rand(-1, 1) * Game.shake * 0.6;
  }
  Game.shake = Math.max(0, Game.shake - dt * 2.2);
  camera.up.copy(camUp);
  camera.lookAt(camLook);
  const fov = P.camMode === 'cockpit' ? 78 : 70 + (P.boosting ? 8 : 0);
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = damp(camera.fov, fov, 5, dt); camera.updateProjectionMatrix(); }
  starfield.position.copy(camera.position);
  sun.position.copy(P.pos).add(_v1.set(40, 90, 30)); sun.target.position.copy(P.pos);
}

function simStep(dt) {
  Game.t += dt;
  const P = Game.player;
  // scripted events by distance travelled
  while (Game.evIdx < Game.events.length && P.d >= Game.events[Game.evIdx][0]) {
    const ev = Game.events[Game.evIdx++];
    ev[1]();
  }
  updatePlayer(dt);
  if (Game.boss) Game.boss.update(dt);
  for (const e of Game.enemies.slice()) if (e.alive) e.update(dt);
  world.timestep = Math.min(dt, 1 / 30);
  world.step();
  updatePBullets(dt);
  updateMissiles(dt);
  updateEBullets(dt);
  updatePickups(dt);
  for (const hz of Game.hazards) hz.update(dt);
  Game.hazards = Game.hazards.filter((h) => !h.dead);
  FX.update(dt);
  for (const s of Stage.spinners) { s.rotation.x += s.userData.spin.x * dt; s.rotation.y += s.userData.spin.y * dt; }
  for (const p of Stage.pulsers) p.material.opacity = 0.55 + 0.35 * Math.sin(Game.t * 3 + p.id);
  Game.chainT -= dt; if (Game.chainT <= 0) Game.chain = 0;
  // stage completion
  if (!Game.stageDone) {
    if (Game.arena && Game.boss && Game.boss.dead) { Game.bossDeadT = (Game.bossDeadT || 0) + dt; if (Game.bossDeadT > 3.4) endStage(); }
    else if (!Game.arena && P.d >= Game.track.length - 30) endStage();
    else Game.bossDeadT = 0;
    if (Game.boss && Game.boss.chase && Game.boss.dead && !Game.boss.escaped && P.d < Game.track.length - 200) {
      // carrier destroyed: skip the rest of the run-out
      Game.chaseT = (Game.chaseT || 0) + dt; if (Game.chaseT > 4) { Game.chaseT = 0; endStage(); }
    }
  }
  if (App.backdrop && P.d > Game.track.length - 80) { P.d = 60; }
}

let last = performance.now(), probeInput = { x: 0, y: 0, fire: false };
function frame() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  Input.update(dt);
  const I = Input.state;
  probeInput = { x: +I.x.toFixed(2), y: +I.y.toFixed(2), fire: I.fire };
  flashUniform.value = Math.max(0, flashUniform.value - dt * 2.5);

  // attract mode: 10 s of no input on the title
  if (App.state === 'title' && !Game.session && Input.idleMs() > 10000 && UI.screen) startAttract();
  if (App.state === 'attract' && I.any) { Input.poke(); showTitle(); }

  if (App.state === 'play' && I.pause && !Game.stageDone) pauseMenu();
  else UI.update();

  const simulate = Game.running && !Game.paused && !(Game.session && (App.sessionEnded || AIHub.time() < 0));
  if (simulate) {
    App.simTime += dt;
    if (App.state === 'attract') Game.ctl = attractAI(dt);
    else if (App.state === 'play') Game.ctl = I;
    else Game.ctl = Object.assign(IDLE_CTL, { x: Math.sin(App.simTime * 0.3) * 0.4, y: Math.sin(App.simTime * 0.21) * 0.3 });
    for (let i = 0, n = window.__steps || 1; i < n && Game.running; i++) simStep(dt);
  }
  if (Game.player) {
    updateCamera(simulate ? dt : 0);
    if (App.state !== 'title') HUD.update(dt);
  }
  Comms.update(dt);
  post.render();
  requestAnimationFrame(frame);
}

function fatal(msg) {

function touchOnly() {

}

async function boot() {
  try {

  }

  renderer.setRenderTarget(null);
  const px = await renderer.readRenderTargetPixelsAsync(rt, 0, 0, w, h);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), img = g.createImageData(w, h);
  img.data.set(px.length === w * h * 4 ? px : new Uint8Array(px.buffer).slice(0, w * h * 4));
  g.putImageData(img, 0, 0); rt.dispose();
  return c.toDataURL('image/png');
};

</script>
