.fatal{position:fixed;inset:0;z-index:100;display:grid;place-content:center;text-align:center;background:#111d1e;color:#f5e4bd;font:20px Georgia;padding:2rem}.fatal h1{font-size:40px}canvas{display:block;width:100%;height:100%}</style></head><body><script>/* Local side-by-side score sharing. AI Hub sessions use AIHub directly. */
(function (root) {
  'use strict';
  var channel = null;
  var timer = null;
  var peers = new Map();
  var id = (root.crypto && root.crypto.randomUUID) ? root.crypto.randomUUID() : String(Date.now()) + '-' + String(Math.random());
  var me = { score: 0, label: 'Beginning', done: false };
  var changed = function () {};

  function emit() {
    changed(Array.from(peers.values()).map(function (p) {
      return { score: p.score, label: p.label, done: p.done };
    }));
  }
  function announce() {
    if (channel) channel.postMessage({ type: 'state', id: id, score: me.score, label: me.label, done: me.done });
  }
  function close() {
    if (channel) {
      channel.postMessage({ type: 'leave', id: id });
      channel.close();
      channel = null;
    }
    if (timer) clearInterval(timer);
    timer = null;
    peers.clear();
    emit();
  }
  root.LanternLocalRace = {
    // Tabs must run under the same origin and browser profile.
    start: function (onChange) {
      close();
      changed = typeof onChange === 'function' ? onChange : function () {};
      if (!root.BroadcastChannel) return false;
      try {
        channel = new BroadcastChannel('last-lantern-local-race-v1');
        channel.onmessage = function (event) {
          var d = event.data;
          if (!d || d.id === id) return;
          if (d.type === 'leave') { peers.delete(d.id); emit(); return; }
          if (d.type !== 'state' || typeof d.id !== 'string' || !Number.isFinite(d.score)) return;
          var isNew = !peers.has(d.id);
          peers.set(d.id, { score: d.score, label: String(d.label || '').slice(0, 24), done: !!d.done, seen: Date.now() });
          emit();
          if (isNew) announce();
        };
        announce();
        timer = setInterval(function () {
          var now = Date.now();
          var removed = false;
          peers.forEach(function (p, key) { if (now - p.seen > 6500) { peers.delete(key); removed = true; } });
          if (removed) emit();
          announce();
        }, 2000);
        return true;
      } catch (_) { close(); return false; }
    },
    progress: function (score, label, done) {
      me = { score: Number.isFinite(score) ? score : 0, label: String(label || '').slice(0, 24), done: !!done };
      announce();
    },
    close: close
  };
  root.addEventListener('pagehide', close);
})(window);
</script>
<script>/* Original synthesized music, effects, and character murmurs. */
class LanternAudio {
  constructor(){this.ctx=null;this.master=null;this.musicOn=true;this.soundOn=true;this.timer=0;this.step=0;}
  start(){if(!this.ctx){this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=.18;this.master.connect(this.ctx.destination);}if(this.ctx.state==='suspended')this.ctx.resume();}
  tone(freq,duration,type='triangle',volume=.2,delay=0,slide=1){if(!this.ctx||!this.master)return;const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(30,freq),t);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+duration);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+duration+.02);}
  update(dt){if(!this.ctx||!this.musicOn)return;this.timer-=dt;if(this.timer>0)return;this.timer=.31;const lead=[0,3,7,10,7,3,2,3,0,3,7,12,10,7,5,3,0,5,8,12,8,5,3,5,2,3,7,10,7,3,2,-2];const note=lead[this.step%lead.length];const f=130.81*Math.pow(2,note/12);this.tone(f*2,.48,'triangle',.07);if(this.step%4===0){this.tone(f/2,1.4,'sine',.10);this.tone(f,.9,'sine',.035,.04);}if(this.step%8===4)this.tone(f*1.5,.8,'sine',.035);this.step++;}
  sound(name){if(!this.soundOn||!this.ctx||this.ctx.state!=='running')return;if(name==='attack'||name==='swing'){this.tone(190,.12,'sawtooth',.18,0,.35);this.tone(80,.18,'triangle',.12,.05,.4);}else if(name==='spell'){[0,.07,.14].forEach((d,i)=>this.tone(430+i*180,.28,'sine',.15,d,1.8));}else if(name==='hit'||name==='hurt'){this.tone(130,.18,'square',.12,0,.35);}else if(name==='pickup'||name==='chest'||name==='heal'){[440,660,880].forEach((f,i)=>this.tone(f,.25,'sine',.12,i*.08));}else if(name==='voice'){for(let i=0;i<5;i++){let f=160+Math.random()*140;this.tone(f,.10,'triangle',.10,i*.085,1.25);}}else if(name==='door'){this.tone(90,.5,'sawtooth',.12,0,.65);}else if(name==='win'){[392,494,587,784].forEach((f,i)=>this.tone(f,.6,'triangle',.13,i*.14));}else {this.tone(330,.12,'sine',.1);}}
}
</script>
<script>/* Lands of the Last Lantern — world and rules */
class LoreWorld {
  constructor(THREE, RAPIER, scene, callbacks={}) {
    this.T=THREE; this.R=RAPIER; this.scene=scene; this.cb=callbacks;

  }

  sound(t){ this.cb.sound?.(t); }
  reset(){
    const T=this.T,R=this.R;
    this.root.clear();
    if(this.physics) this.physics.free();
    this.physics=new R.World({x:0,y:0,z:0});
    this.rows=[
      '#################',
      '#.......#.......#',
      '#.......#.......#',
      '#.......#.......#',
      '#.......D.......#',
      '#.......#.......#',
      '###.#####.#######',
      '#.......#.......#',
      '#.......D.......#',
      '#.......#.......#',
      '#.......#.......#',
      '#.......#.......#',
      '#################'
    ];
    this.tile=3; this.time=0; this.allyTimer=3; this.message=''; this.messageTime=0; this.cool=0; this.spellCool=0;
    this.demo=null; this.hp=100; this.mana=70; this.potions=3; this.gold=0; this.xp=0; this.level=1; this.won=false; this.dead=false;
    this.quest={met:false,key:false,gate:false,ward:false,relic:false,returned:false};
    this.inventory=[]; this.enemies=[]; this.objects=[]; this.doors=[]; this.decor=[];
    this.player={x:3*3,z:10*3,angle:-Math.PI/2};
    this.body=this.physics.createRigidBody(R.RigidBodyDesc.kinematicPositionBased().setTranslation(this.player.x,0.85,this.player.z));
    this.collider=this.physics.createCollider(R.ColliderDesc.capsule(0.5,0.33),this.body);
    this.controller=this.physics.createCharacterController(0.04);
    this.controller.setApplyImpulsesToDynamicBodies(false);
    this.mat={
      wall:new T.MeshToonMaterial({color:0x4d625c}), wall2:new T.MeshToonMaterial({color:0x66766a}),
      mortar:new T.MeshToonMaterial({color:0x293b39}), floor:new T.MeshToonMaterial({color:0x3d514a}),
      floor2:new T.MeshToonMaterial({color:0x485c52}), gold:new T.MeshToonMaterial({color:0xd5a74a}),
      dark:new T.MeshToonMaterial({color:0x263a39}), wood:new T.MeshToonMaterial({color:0x79533b}),
      skin:new T.MeshToonMaterial({color:0xd69b72}), cloth:new T.MeshToonMaterial({color:0x8a5365}),
      green:new T.MeshToonMaterial({color:0x819a62}), purple:new T.MeshToonMaterial({color:0x746391}),
      red:new T.MeshToonMaterial({color:0x963e43}), bone:new T.MeshToonMaterial({color:0xd5c7a0}),
      glow:new T.MeshBasicMaterial({color:0xffd26b}), blue:new T.MeshBasicMaterial({color:0x75dfd5}),

    this.box=box;

    for(let z=0;z<this.rows.length;z++) for(let x=0;x<this.rows[z].length;x++){
      const ch=this.rows[z][x],X=x*3,Z=z*3;

        this.physics.createCollider(R.ColliderDesc.cuboid(1.5,1.7,1.5).setTranslation(X,1.7,Z));
        // block seams lend the halls a hand-hewn silhouette

      } else {
        if((x+z)%2===0) box(2.94,0.025,2.94,this.mat.floor2,X,0.015,Z);
        if((x*7+z*11)%9===0) {box(0.9,0.035,0.035,this.mat.dark,X+0.45,0.035,Z+0.6);box(0.035,0.035,0.5,this.mat.dark,X+0.02,0.035,Z+0.35);}

      if(ch==='D'){
        const g=new T.Group();g.position.set(X,0,Z);this.root.add(g);
        box(0.23,3.2,2.7,this.mat.wood,0,1.6,0,g);
        box(0.29,0.14,2.8,this.mat.gold,0,2.5,0,g);box(0.29,0.14,2.8,this.mat.gold,0,0.8,0,g);
        const c=this.physics.createCollider(R.ColliderDesc.cuboid(0.2,1.6,1.45).setTranslation(X,1.6,Z));
        this.doors.push({x:X,z:Z,group:g,collider:c,kind:z===8?'gate':'wardDoor',open:false});

      const l=new T.PointLight(0xffb45e,13,8);l.position.y=2;g.add(l);this.decor.push({flame:f,light:l,phase:x+z});
    }
    this.makeNPC(4,10);
    this.makeObject('chest',3,7,'Wayfarer’s chest');
    this.makeObject('shrine',13,10,'Well of Quiet Waters');
    this.makeObject('ward',13,8,'Wardstone');
    this.makeObject('relic',3,2,'The Last Lantern');
    this.makeObject('cache',14,3,'Forgotten coffer');
    this.makeEnemy(6,8,'Thornling'); this.makeEnemy(11,9,'Mire guard'); this.makeEnemy(13,5,'Mire guard'); this.makeEnemy(5,3,'Ash warden');

  makeNPC(x,z){

    this.box(0.8,1.2,0.5,this.mat.cloth,0,0.85,0,g);this.box(0.65,0.65,0.55,this.mat.skin,0,1.75,0,g);
    this.box(0.8,0.16,0.72,this.mat.dark,0,2.12,0,g);this.box(0.45,0.45,0.45,this.mat.dark,0,2.35,0,g);

  makeObject(kind,x,z,label){
    const T=this.T,g=new T.Group();g.position.set(x*3,0,z*3);this.root.add(g);
    if(kind==='chest'||kind==='cache'){
      this.box(1.1,0.65,0.7,this.mat.wood,0,0.36,0,g);this.box(1.15,0.2,0.75,this.mat.gold,0,0.73,0,g);this.box(0.16,0.35,0.78,this.mat.dark,0,0.5,0,g);

      this.box(1.1,0.3,1.1,this.mat.wall2,0,0.15,0,g);this.box(0.6,0.8,0.6,this.mat.dark,0,0.68,0,g);
      let mesh=new T.Mesh(new T.OctahedronGeometry(kind==='relic'?0.5:0.6),kind==='relic'?this.mat.glow:this.mat.blue);mesh.position.y=1.6;g.add(mesh);
      let l=new T.PointLight(kind==='relic'?0xffd66d:0x67ede4,18,10);l.position.y=1.8;g.add(l);this.decor.push({crystal:mesh,phase:x+z});
    }
    this.objects.push({kind,x:x*3,z:z*3,group:g,label,used:false});
  }
  makeEnemy(x,z,name){
    const T=this.T,g=new T.Group();g.position.set(x*3,0,z*3);this.root.add(g);
    const color=name==='Thornling'?this.mat.green:name==='Ash warden'?this.mat.purple:this.mat.red;
    this.box(0.75,1,0.5,color,0,1,0,g);this.box(0.65,0.65,0.55,name==='Thornling'?this.mat.green:this.mat.bone,0,1.8,0,g);
    this.box(0.2,0.8,0.23,color,-0.55,0.95,0,g);this.box(0.2,0.8,0.23,color,0.55,0.95,0,g);
    this.box(0.22,0.65,0.25,this.mat.dark,-0.22,0.32,0,g);this.box(0.22,0.65,0.25,this.mat.dark,0.22,0.32,0,g);
    this.box(0.1,0.1,0.07,this.mat.glow,-0.16,1.84,0.29,g);this.box(0.1,0.1,0.07,this.mat.glow,0.16,1.84,0.29,g);
    this.box(0.1,1.1,0.12,this.mat.gold,0.7,0.9,0,g);
    this.enemies.push({name,x:x*3,z:z*3,homeX:x*3,homeZ:z*3,group:g,hp:name==='Ash warden'?75:45,maxHp:name==='Ash warden'?75:45,attack:1.5,flash:0,alive:true});
  }
  move(forward,strafe,turn,dt){
    if(this.dead||this.won)return;
    this.player.angle+=turn*dt*1.9;
    const a=this.player.angle,s=Math.sin(a),c=Math.cos(a),speed=4.2;
    const dx=(-s*forward+c*strafe)*speed*dt, dz=(-c*forward-s*strafe)*speed*dt;
    this.controller.computeColliderMovement(this.collider,{x:dx,y:0,z:dz});
    const m=this.controller.computedMovement();
    this.player.x+=m.x;this.player.z+=m.z;
    this.body.setNextKinematicTranslation({x:this.player.x,y:0.85,z:this.player.z});
  }
  nearestEnemy(range,front=true){
    let best=null,dist=range;const p=this.player;
    for(const e of this.enemies){if(!e.alive)continue;const dx=e.x-p.x,dz=e.z-p.z,d=Math.hypot(dx,dz);const dot=(-Math.sin(p.angle)*dx-Math.cos(p.angle)*dz)/(d||1);if(d<dist&&(!front||dot>0.38)){best=e;dist=d;}}
    return best;
  }
  damage(e,amount){
    e.hp-=amount;e.flash=0.18;this.sound('hit');
    if(e.hp<=0){e.alive=false;this.root.remove(e.group);this.xp+=25;this.gold+=8;this.say(`${e.name} falls. +25 lore, +8 crowns.`); if(this.xp>=50&&this.level===1){this.level=2;this.hp=Math.min(120,this.hp+25);this.mana=70;this.say('The party grows stronger! Rank 2.');}}
    else this.say(`${e.name} takes ${amount} damage.`);
  }
  action(type){
    if(this.dead||this.won)return;
    if(type==='attack'){
      if(this.cool>0)return;this.cool=0.65;this.sound('swing');const e=this.nearestEnemy(4.1);if(e)this.damage(e,18+(this.level-1)*5);else this.say('Your blade finds only air.');
    }else if(type==='spell'){
      if(this.spellCool>0)return;if(this.mana<18){this.say('Not enough magic. Wait for it to return.');return;}
      this.mana-=18;this.spellCool=0.9;this.sound('spell');const e=this.nearestEnemy(12);if(e)this.damage(e,32+(this.level-1)*6);else this.say('Your starfire vanishes into the dark.');
    }else if(type==='potion'){
      if(!this.potions){this.say('No potions remain.');return;}if(this.hp>=this.maxHp()){this.say('The party is already at full health.');return;}
      this.potions--;this.hp=Math.min(this.maxHp(),this.hp+45);this.sound('heal');this.say('A restorative draught warms the party.');
    }else if(type==='interact')this.interact();
  }
  interact(){
    const p=this.player;let target=null,best=4.5;
    for(const o of [...this.objects,...this.doors]){const d=Math.hypot(o.x-p.x,o.z-p.z);if(d<best&&!(o.open)){target=o;best=d;}}
    if(!target){this.say('There is nothing within reach.');return;}
    const o=target;
    if(o.kind==='keeper'){
      this.sound('voice');
      if(this.quest.relic){this.quest.returned=true;this.won=true;this.say('Orin: The lantern burns again. You have given our kingdom a dawn.');this.cb.finish?.();}
      else if(!this.quest.met){this.quest.met=true;this.say('Orin: The Last Lantern lies beyond the ward. Find my key, still hidden in the chest to the north.');}
      else if(!this.quest.key)this.say('Orin: My key rests in the chest north of here. Mind the thornlings.');
      else if(!this.quest.ward)this.say('Orin: Cross the eastern gate and silence the wardstone.');
      else this.say('Orin: The northern vault is open. Bring the lantern home.');
    }else if(o.kind==='chest'){
      if(!o.used){o.used=true;this.quest.key=true;this.inventory.push('Keeper’s brass key');this.gold+=12;this.sound('chest');this.say('You find Orin’s brass key and 12 crowns.');}else this.say('The chest is empty.');
    }else if(o.kind==='cache'){
      if(!o.used){o.used=true;this.potions+=2;this.gold+=20;this.sound('chest');this.say('A forgotten coffer! You find two potions and 20 crowns.');}else this.say('Only dust remains.');
    }else if(o.kind==='shrine'){
      if(!o.used){o.used=true;this.hp=this.maxHp();this.mana=70;this.potions++;this.sound('heal');this.say('The waters restore the party and yield a potion.');}else this.say('The waters have grown still.');
    }else if(o.kind==='gate'){
      if(!this.quest.key){this.say('The eastern gate is locked. A brass key should fit.');return;}
      this.openDoor(o);this.quest.gate=true;this.say('The brass key turns. The eastern halls await.');
    }else if(o.kind==='ward'){
      if(!o.used){o.used=true;this.quest.ward=true;this.sound('spell');this.say('The wardstone dims. A gate opens in the northern hall.');const d=this.doors.find(d=>d.kind==='wardDoor');if(d)this.openDoor(d);o.group.scale.setScalar(0.7);}else this.say('The wardstone is silent.');
    }else if(o.kind==='wardDoor'){
      this.say('A blue ward holds the gate. Seek its stone to the southeast.');
    }else if(o.kind==='relic'){
      if(!o.used){o.used=true;this.quest.relic=true;this.inventory.push('The Last Lantern');this.root.remove(o.group);this.sound('heal');this.say('The Last Lantern is yours. Return it to Keeper Orin.');} 
    }
  }
  openDoor(d){d.open=true;this.root.remove(d.group);this.physics.removeCollider(d.collider,true);this.sound('door');}
  attract(dt){
    if(!this.demo){
      this.demo={i:0,hold:0,points:[
        [4,10,'Keeper Orin: A kingdom waits upon one small flame.'],
        [3,8,'Face the creatures of the forgotten halls.'],
        [3,7,'Discover keys and treasure in hidden chests.'],
        [7,8,'Pass through the eastern gate.'],
        [11,8,'Steel and starfire together can turn the tide.'],
        [13,8,'Silence the ancient wardstone.'],
        [13,10,'Rest at the Well of Quiet Waters.'],
        [9,7,'Explore the winding halls.'],
        [9,4,'The northern vault lies beyond the ward.'],
        [6,4,'The Last Lantern waits in the dark.'],
        [3,2,'Find the light. Bring it home.'],
        [3,4,'Every journey begins with a single step.']
      ]};
      for(const d of this.doors)if(!d.open)this.openDoor(d);
      this.quest.met=true;this.quest.key=true;this.quest.gate=true;this.quest.ward=true;
      this.hp=120;this.mana=70;
    }
    const demo=this.demo,p=demo.points[demo.i],dx=p[0]*3-this.player.x,dz=p[1]*3-this.player.z,dist=Math.hypot(dx,dz);
    this.hp=120;this.mana=70;this.dead=false;
    if(dist<0.5){
      if(!demo.hold){demo.hold=1.8;this.say(p[2]);}
      demo.hold-=dt;
      if(demo.hold<=0){demo.hold=0;demo.i++;if(demo.i>=demo.points.length){this.reset();this.demo=null;}}
    }else{
      const a=Math.atan2(-dx,-dz),delta=Math.atan2(Math.sin(a-this.player.angle),Math.cos(a-this.player.angle));
      this.player.angle+=delta*Math.min(1,dt*3);
      this.player.x+=dx/dist*Math.min(dist,dt*4);this.player.z+=dz/dist*Math.min(dist,dt*4);
      this.body.setNextKinematicTranslation({x:this.player.x,y:0.85,z:this.player.z});
      const e=this.nearestEnemy(4);if(e&&this.cool<=0){this.cool=0.8;this.damage(e,30);}
    }
  }
  maxHp(){return this.level===1?100:120;}
  update(dt){
    dt=Math.min(dt,0.05);this.time+=dt;this.cool=Math.max(0,this.cool-dt);this.spellCool=Math.max(0,this.spellCool-dt);this.messageTime-=dt;
    this.mana=Math.min(70,this.mana+dt*1.6);
    for(const d of this.decor){if(d.flame){d.flame.scale.y=0.85+0.2*Math.sin(this.time*8+d.phase);d.light.intensity=11+3*Math.sin(this.time*6+d.phase);}if(d.crystal){d.crystal.rotation.y+=dt;d.crystal.position.y=1.6+Math.sin(this.time*2+d.phase)*0.12;}}
    if(!this.dead&&!this.won) for(const e of this.enemies){
      if(!e.alive)continue;const dx=this.player.x-e.x,dz=this.player.z-e.z,dist=Math.hypot(dx,dz);e.flash=Math.max(0,e.flash-dt);
      e.group.rotation.y=Math.atan2(dx,dz);e.group.position.y=Math.sin(this.time*5+e.homeX)*0.035;
      if(dist<9&&dist>2.1){const v=1.05*dt;const nx=e.x+dx/dist*v,nz=e.z+dz/dist*v;const tx=Math.round(nx/3),tz=Math.round(nz/3);if(this.rows[tz]?.[tx]!== '#'&& !this.doors.some(d=>!d.open&&Math.hypot(d.x-nx,d.z-nz)<1.5)){e.x=nx;e.z=nz;e.group.position.x=nx;e.group.position.z=nz;}}
      e.attack-=dt;if(dist<2.8&&e.attack<=0){e.attack=2.2;this.hp=Math.max(0,this.hp-9);this.sound('hurt');this.say(`${e.name} strikes the party for 9!`);if(this.hp<=0){this.dead=true;this.say('The dark closes in. Your tale need not end here.');}}
    }
    // Companions act on their own when an enemy enters the party's reach.
    if(!this.dead&&!this.won){
      this.allyTimer-=dt;
      const foe=this.nearestEnemy(5.3,false);
      if(foe&&this.allyTimer<=0){this.allyTimer=4.5;this.damage(foe,8);if(foe.alive)this.say(`Mara lends her blade: ${foe.name} takes 8 damage.`);}
    }
    this.physics.step();
  }
  getState(){
    const q=this.quest;
    const objective=!q.met?'Speak with Keeper Orin':!q.key?'Find Orin’s key in the northern chest':!q.gate?'Unlock the eastern gate':!q.ward?'Silence the wardstone in the east':!q.relic?'Claim the Last Lantern in the northern vault':'Return the lantern to Orin';
    const e=this.nearestEnemy(12);let near=null,dist=4.5;for(const o of [...this.objects,...this.doors]){if(o.open)continue;let d=Math.hypot(o.x-this.player.x,o.z-this.player.z);if(d<dist){near=o;dist=d;}}
    return {hp:Math.ceil(this.hp),maxHp:this.maxHp(),mana:Math.floor(this.mana),maxMana:70,potions:this.potions,gold:this.gold,level:this.level,xp:this.xp,objective,quest:q,party:[{name:'You',hp:Math.ceil(this.hp),maxHp:this.maxHp()},{name:'Mara',hp:Math.ceil(this.hp),maxHp:this.maxHp()},{name:'Pip',hp:Math.ceil(this.hp),maxHp:this.maxHp()}],map:{rows:this.rows,px:this.player.x/3,pz:this.player.z/3,dir:this.player.angle},message:this.messageTime>0?this.message:'',target:e?{name:e.name,hp:Math.max(0,e.hp),maxHp:e.maxHp}:null,near:near?.label|| (near?.kind==='gate'?'Eastern gate':near?.kind==='wardDoor'?'Sealed gate':null),inventory:this.inventory,won:this.won,dead:this.dead};
  }
}
</script>
<script>/* Controller-first interface for Lands of the Last Lantern. */
class GameUI {
  constructor(options = {}) {
    this.options = options;
    this.title = options.title || 'Lands of the Last Lantern';
    this.onAction = options.onAction || (() => {});
    this.settings = {invertX: false, invertY: false, volume: true};
    try { Object.assign(this.settings, JSON.parse(localStorage.getItem('lantern-settings') || '{}')); } catch (_) {}
    this.state = {};
    this.screen = 'title';
    this.previous = 'title';
    this.index = 0;
    this.attract = false;
    this.root = document.createElement('div');
    this.root.id = 'game-ui';
    document.body.appendChild(this.root);
    this.show('title');
  }
  escape(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  button(label, action, extra = '') { return `<button class="${extra || 'action-btn'}" data-action="${action}">${label}</button>`; }
  controls() { return `<span class="key">L</span> Move &nbsp; <span class="key">R</span> Look<br><span class="key">R2</span> Attack &nbsp; <span class="key">L2</span> Spell &nbsp; <span class="key">✕</span> Interact<br><span class="key">△</span> Potion &nbsp; <span class="key">□</span> Pack &nbsp; <span class="key">☰</span> Pause`; }
  hud() {
    return `<div class="hud"><div class="damage-vignette"></div><div class="hud-top"><div class="chapter">THE LANTERN'S CALL</div><div class="quest" id="ui-quest"></div><div class="quest-detail" id="ui-quest-detail"></div></div><div class="hud-top-right"><div class="location" id="ui-location">THE GREENWOOD</div><div class="location-sub" id="ui-online">THE THRONE OF SHADOWS AWAITS</div></div><div class="reticle"></div><div class="enemy-target hidden" id="ui-enemy"></div><div class="prompt hidden" id="ui-prompt"></div><div class="notice hidden" id="ui-notice"></div><div class="hud-bottom"><div class="party" id="ui-party"></div><div class="hud-controls">${this.controls()}</div></div><div class="attract-tag hidden" id="ui-attract">A TALE IN MOTION<small>Press any button to return</small></div></div>`;
  }
  panel(kicker,title,body,actions='') { return `<div class="screen panel-screen"><div class="panel"><div class="eyebrow">${kicker}</div><h2>${title}</h2><div class="rule"></div>${body}<div class="panel-actions">${actions}</div></div></div>`; }
  render() {
    let content = ['title','touch'].includes(this.screen) || (['settings','help','credits'].includes(this.screen) && ['title','touch'].includes(this.previous)) ? '' : this.hud();
    if (this.screen === 'title') content += `<div class="screen title-screen"><div class="title-content"><div class="title-kicker eyebrow">A tale of courage &amp; cunning</div><h1>${this.escape(this.title)}</h1><div class="subtitle">The throne of shadows</div><p class="title-copy">The king's light is failing. Beyond the Greenwood, an ancient darkness stirs. Gather your courage, wayfarer; the realm has need of you.</p><div class="menu-list">${this.button('Begin the journey','start','menu-btn')}${this.button('How to play','help','menu-btn')}${this.button('Settings','settings','menu-btn')}${this.button('About &amp; credits','credits','menu-btn')}</div></div><div class="title-footer"><span>✦ &nbsp; A first-person fantasy adventure</span><span>Controller recommended &nbsp; · &nbsp; Keyboard supported</span></div></div>`;
    if (this.screen === 'settings') content += this.panel('Make yourself at home','Settings',`<p>Adjust the journey to your liking. Your choices are remembered on this device.</p><div class="setting-row"><div><strong>Invert horizontal look</strong><small>Reverse the right stick's left and right direction.</small></div>${this.button(this.settings.invertX?'On':'Off','toggle-x')}</div><div class="setting-row"><div><strong>Invert vertical look</strong><small>Reverse the right stick's up and down direction.</small></div>${this.button(this.settings.invertY?'On':'Off','toggle-y')}</div><div class="setting-row"><div><strong>Sound &amp; music</strong><small>Turn the realm's sounds on or off.</small></div>${this.button(this.settings.volume?'On':'Off','toggle-volume')}</div>`,this.button('Back','back'));
    if (this.screen === 'help') content += this.panel('A wayfarer’s guide','How to play',`<div class="inventory-layout"><div><h3>On the road</h3><p>Move with the left stick and look with the right. Press <b>✕</b> to speak, open and use things. Follow the objective at the top left; explore the corners of each place.</p><p>Keyboard: <b>W A S D</b> move, arrow keys look, <b>E</b> interact.</p></div><div><h3>In a fight</h3><p><b>R2</b> strikes; <b>L2</b> casts a spell. Keep your distance and watch your shared party vitality; Mara strikes nearby foes automatically. <b>△</b> drinks a potion. Open the pack with <b>□</b> and pause with Options.</p><p>Keyboard: <b>Space</b> attacks, <b>F</b> casts, <b>Q</b> drinks, <b>I</b> opens the pack, <b>M</b> opens the map, <b>Esc</b> pauses.</p></div></div>`,this.button('Back','back'));
    if (this.screen === 'credits') content += this.panel('The story behind the story','About & credits',this.creditContent(),this.button('Back','back'));
    if (this.screen === 'pause') content += this.panel('Take a breath','Journey paused',`<p>The dark can wait a moment. Your journey will resume where you left it.</p><div class="menu-list">${this.button('Continue','resume','menu-btn')}${this.button('Inventory','inventory','menu-btn')}${this.button('Map','map','menu-btn')}${this.button('How to play','help','menu-btn')}${this.button('Settings','settings','menu-btn')}${this.button('Return to title','quit','menu-btn')}</div>`);
    if (this.screen === 'inventory') content += this.panel('Your provisions','The adventurer’s pack',this.inventory(),this.button('Use potion','potion')+this.button('Back','back'));
    if (this.screen === 'map') content += this.panel('Find your way','Map of the realm',this.map(),this.button('Back','back'));
    if (this.screen === 'win') content += this.panel('The light endures','A realm saved',`<p>The last lantern burns bright once more. The darkness has been driven back, and the realm shall remember your courage.</p><p>For now, rest, brave wayfarer. Many roads still lie beyond the horizon.</p>`,this.button('Journey again','restart')+this.button('Title','quit'));
    if (this.screen === 'dead') content += this.panel('The light grows dim','Fallen in battle',`<p>Even the bravest may stumble in the dark. Take heart: the realm has not forgotten you.</p>`,this.button('Try again','restart')+this.button('Title','quit'));
    if (this.screen === 'touch') content += `<div class="screen touch-screen"><div class="panel"><div class="eyebrow">A journey awaits</div><h2>Controller or keyboard required</h2><p>Connect a controller or keyboard to venture into the realm.</p><div class="panel-actions" style="justify-content:center">${this.button('Settings','settings')}</div></div></div>`;
    this.root.innerHTML = content;
    this.buttons = [...this.root.querySelectorAll('.screen button')];
    this.index = Math.min(this.index, Math.max(0,this.buttons.length-1));
    this.buttons.forEach((el,i) => { el.addEventListener('click', () => { this.index=i; this.action(el.dataset.action); }); el.addEventListener('mouseenter',()=>{this.index=i;this.focus();}); });
    this.focus();
    this.update(this.state);
    this.setAttract(this.attract);
  }
  creditContent() {
    if (this.options.credits) return this.options.credits;
    return `<div class="credits-grid"><div><h3>Source information</h3><p><b>Date:</b> 2026-10-29 09:25<br><b>Inspiration:</b> Lands of Lore: The Throne of Chaos<br><b>Tech:</b> Three.js R180, WebGPU, Rapier 0.19.3, Gamepad API<br><b>Art:</b> Stylized cel-shaded 3D<br><b>Animation:</b> Procedural animation<br><b>Audio:</b> Code-written music and sound effects; synthesized gibberish voices<br><b>Online:</b> See game networking information<br><b>Testing:</b> Efficient and lightweight<br><b>Environment:</b> Codex CLI (headless); Linux; browser unknown<br><b>Model:</b> OpenAI, gpt-6.1-terra, reasoning effort ultra<br><b>Usage:</b> unknown</p></div><div><h3>Engine feedback</h3><p><b>Liked most:</b> unknown<br><b>Stuck or guessed wrong:</b> unknown<br><b>Most important custom work:</b> unknown<br><b>Hardest part:</b> unknown<br><b>Remove or overhaul:</b> unknown<br><b>One change:</b> unknown</p><h3>Prompt feedback</h3><p><b>Liked most:</b> unknown<br><b>Confusing:</b> unknown<br><b>Hardest:</b> unknown<br><b>One test:</b> unknown</p><h3>Testing feedback</h3><p><b>Issues caught:</b> unknown<br><b>Critical:</b> unknown<br><b>Most helpful test:</b> unknown<br><b>Least helpful test:</b> unknown</p></div></div>`;
  }
  inventory() {
    const s=this.state; const items = Array.isArray(s.inventory) ? s.inventory : [];
    return `<div class="inventory-layout"><div><h3>Supplies</h3><div class="inventory-list"><div class="item-row"><b>Healing potions</b> &nbsp; × ${this.escape(s.potions ?? 0)}</div><div class="item-row"><b>Gold</b> &nbsp; ${this.escape(s.gold ?? 0)}</div>${items.map(x=>`<div class="item-row">${this.escape(typeof x==='string'?x:x.name)}</div>`).join('')}</div></div><div><h3>The company</h3><p>Level ${this.escape(s.level ?? 1)} &nbsp; · &nbsp; ${this.escape(s.xp ?? 0)} experience</p><p>Health ${this.escape(Math.ceil(s.hp ?? 0))} / ${this.escape(s.maxHp ?? 100)}<br>Mana ${this.escape(Math.ceil(s.mana ?? 0))} / ${this.escape(s.maxMana ?? 100)}</p><p>Potions restore health. Magic uses mana, which returns with time.</p></div></div>`;
  }
  map() {
    const m=this.state.map;
    if (!m || !Array.isArray(m.rows)) return `<p>Keep exploring to reveal the roads ahead.</p>`;
    const rows=m.rows; const width=Math.max(...rows.map(r=>r.length));
    let html=`<p>Gold marks your position. Rose marks a place of interest.</p><div class="map-grid" style="grid-template-columns:repeat(${width},1fr)">`;
    rows.forEach((row,z)=>{[...row].forEach((c,x)=>{const player=x===Math.round(m.px)&&z===Math.round(m.pz); const wall=c==='#'||c===1; const special=!wall && c!=='.'&&c!==' '&&c!==0; html+=`<span class="map-cell ${player?'player':wall?'wall':special?'special':''}"></span>`;});});
    return html+'</div>';
  }
  update(s={}) {
    this.state=s || {};
