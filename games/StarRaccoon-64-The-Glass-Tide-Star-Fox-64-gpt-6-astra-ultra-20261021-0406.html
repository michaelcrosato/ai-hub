    rod(g, [s * 4, 1.8, -4.5], [s * 7.8, 2.3, 5], .15, glow(C.cyan));
  }
  const core = new THREE.Group(); core.position.z = -7.7; g.add(core);
  mesh(core, new THREE.TorusGeometry(3.2, .6, 7, 16), orange, [0, 0, .6]);
  mesh(core, new THREE.TorusGeometry(2.6, .22, 5, 16), glow(C.cyan), [0, 0, -.1]);
  const eye = mesh(core, new THREE.IcosahedronGeometry(2, 2), mat(0x77e5df, .65, .15, 0x37c5d6, 1.4));
  core.userData.face = eye; g.userData.core = core;
  for (let i = 0; i < 6; i++) cube(g, [2.3, .12, .3], [0, 3.2 - i * .12, 2 + i * 1.15], metallic);
  g.userData.type = 'boss'; g.userData.engines = []; return g;
}

function createRing(color = C.gold) {
  const g = new THREE.Group();
  mesh(g, new THREE.TorusGeometry(3.25, .2, 5, 32), mat(color, .7, .25, color, .5));
  mesh(g, new THREE.TorusGeometry(2.97, .035, 3, 40), glow(color, .8));
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    const m = cube(g, [.6, .65, .38], [Math.cos(a) * 3.25, Math.sin(a) * 3.25, 0], mat(C.ivory)); m.rotation.z = a;
    mesh(g, new THREE.SphereGeometry(.13, 5, 4), glow(C.cyan), [Math.cos(a) * 3.25, Math.sin(a) * 3.25, .25]);
  }
  return g;
}

function randomGenerator(seed) {
  return () => {seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296;};
}

function rockGeometry(radius, height, rng) {
  const n = 7, levels = 6, pts = [], indices = [], colors = [];
  const bands = [0x704a42, 0x925c49, 0xc17b5b, 0x9c604b, 0xd18c67, 0xe3ab7e];
  const angleOffset = rng() * TAU;
  const radii = Array.from({length: n}, () => .8 + rng() * .35);
  for (let j = 0; j < levels; j++) {
    const taper = 1 - j * .085;
    const color = new THREE.Color(bands[j]);
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + angleOffset, r = radius * radii[i] * taper * (.94 + rng() * .12);
      pts.push(Math.cos(a) * r, j / (levels - 1) * height + (j ? (rng() - .5) * height * .055 : 0), Math.sin(a) * r);
      const shade = .8 + rng() * .3; colors.push(color.r * shade, color.g * shade, color.b * shade);
    }
  }
  for (let j = 0; j < levels - 1; j++) for (let i = 0; i < n; i++) {
    const a = j * n + i, b = j * n + (i + 1) % n; indices.push(a, a + n, b, b, a + n, b + n);
  }
  for (let i = 1; i < n - 1; i++) indices.push((levels - 1) * n, (levels - 1) * n + i + 1, (levels - 1) * n + i);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3)); g.setIndex(indices); g.computeVertexNormals(); return g;
}

function makeArch() {
  const g = new THREE.Group(), stone = mat(0xc6ac8b, .2, .8), dark = mat(C.ink, .35, .6);
  mesh(g, new THREE.TorusGeometry(45, 3.1, 5, 24, Math.PI), stone, [0, 6, 0]);
  mesh(g, new THREE.TorusGeometry(42.7, .18, 4, 32, Math.PI), glow(0x8fd8ca), [0, 6, 3]);
  for (const s of [-1, 1]) {
    cube(g, [6.4, 17, 7], [45 * s, -2.5, 0], stone);
    cube(g, [8, 3, 10], [45 * s, -7.5, 0], dark);
    cube(g, [.3, 13, .3], [41.6 * s, -.5, 3.4], glow(C.cyan));
  }
  for (let i = 2; i < 15; i++) {
    const a = i / 16 * Math.PI;
    const block = cube(g, [1, 7, 8], [Math.cos(a) * 45, 6 + Math.sin(a) * 45, 0], dark);
    block.rotation.z = a - Math.PI / 2;
  }
  cube(g, [12, 4, 8], [0, 52, 0], mat(C.orange));
  cube(g, [6, .5, .3], [0, 51.7, 4.1], glow(C.gold));
  return g;
}

function makeBuilding(rng, width, height, depth) {
  const g = new THREE.Group(), white = mat(0xd9c7a8, .3, .7), shade = mat(0x344f51, .35, .65);
  cube(g, [width, height, depth], [0, height / 2, 0], white);
  cube(g, [width * 1.07, .6, depth * 1.07], [0, height, 0], shade);
  cube(g, [width * .74, 1.1, depth * .7], [0, height + .55, 0], white);
  for (let i = 0; i < Math.floor(height / 3); i++) {
    const y = 1.9 + i * 3;
    cube(g, [width * .77, .65, .06], [0, y, depth / 2 + .04], shade);
    cube(g, [.06, .65, depth * .65], [width / 2 + .04, y, 0], shade);
    if (rng() > .4) cube(g, [width * .25, .25, .08], [-width * .2, y, depth / 2 + .08], glow(0xa2cfc0));
  }
  if (height > 13) {
    rod(g, [0, height, 0], [0, height + 7, 0], .13, shade);
    mesh(g, new THREE.SphereGeometry(.22, 5, 4), glow(C.cyan), [0, height + 7, 0]);
  }
  return g;
}

function makeIndustrial(rng) {
  const g = new THREE.Group(), dark = mat(0x315257, .6, .5), white = mat(0xbfc5b3, .4, .55), orange = mat(0xc5784e);
  for (const s of [-1, 1]) {
    const p = new THREE.Group(); p.position.set(s * 51, -9, 0); g.add(p);
    cube(p, [14, 4, 31], [0, 2, 0], dark);
    cube(p, [8, 48, 10], [0, 26, 0], white);
    cube(p, [10, 3, 12], [0, 49, 0], orange);
    cube(p, [.25, 30, .3], [-s * 4.1, 29, 5.2], glow(C.cyan));
    for (let i = 0; i < 4; i++) cube(p, [9, 1, 11], [0, 9 + i * 10, 0], dark);
    rod(p, [s * 3, 4, 0], [s * 18, 48, 0], .6, dark);
    for (let i = 0; i < 3; i++) {
      const tank = mesh(p, new THREE.CylinderGeometry(3.8, 3.8, 16, 10), white, [s * (12 + i * 9), 8, 0]);
      mesh(p, new THREE.TorusGeometry(3.9, .35, 4, 10), orange, [tank.position.x, 13, 0], [Math.PI / 2, 0, 0]);
    }
    if (rng() > .5) {
      cube(p, [22, 1.7, 2], [s * 7, 49, 0], dark);
      rod(p, [0, 54, 0], [s * 18, 49, 0], .18, dark);
    }
  }
  cube(g, [110, 2.2, 8], [0, 39, 0], dark);
  for (let x = -49; x <= 49; x += 7) {
    cube(g, [.6, 7, .6], [x, 42.5, 3.8], white);
    rod(g, [x, 39.5, 3.8], [x + 7, 45.5, 3.8], .22, white);
  }
  cube(g, [111, .6, .6], [0, 46, 3.8], orange);
  return g;
}

function createWorld(scene) {
  const root = new THREE.Group(); root.name = 'The Brine Reach'; scene.add(root);
  const rng = randomGenerator(640127);
  scene.background = new THREE.Color(0x6c9998);
  scene.fog = new THREE.FogExp2(0x779b96, .00105);
  const hemi = new THREE.HemisphereLight(0xd8f8ee, 0x513c36, 2.3); scene.add(hemi);
  const sunLight = new THREE.DirectionalLight(0xffd4a0, 3.5); sunLight.position.set(-180, 280, -160); scene.add(sunLight);
  const rim = new THREE.DirectionalLight(0x77c9cf, 1.5); rim.position.set(150, 80, 120); scene.add(rim);
  const skyGeometry = new THREE.SphereGeometry(3900, 40, 24);
  const skyColors = [], skyPos = skyGeometry.getAttribute('position');
  const top = new THREE.Color(0x163f50), middle = new THREE.Color(0x6d9b9c), bottom = new THREE.Color(0xe9ba8e);
  for (let i = 0; i < skyPos.count; i++) {
    const y = skyPos.getY(i) / 3900;
    const color = y > .08 ? middle.clone().lerp(top, clamp((y - .08) * 1.7, 0, 1)) : bottom.clone().lerp(middle, clamp((y + .08) / .16, 0, 1));
    skyColors.push(color.r, color.g, color.b);
  }
  skyGeometry.setAttribute('color', new THREE.Float32BufferAttribute(skyColors, 3));
  const sky = mesh(root, skyGeometry, new THREE.MeshBasicMaterial({vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false}));
  sky.renderOrder = -10;
  const sun = mesh(root, new THREE.SphereGeometry(90, 32, 20), new THREE.MeshBasicMaterial({color: 0xffd5a0, fog: false, toneMapped: false}), [-670, 380, -2300]);
  const haloMat = new THREE.MeshBasicMaterial({color: 0xffd9af, transparent: true, opacity: .045, depthWrite: false, fog: false});
  for (let i = 0; i < 4; i++) mesh(root, new THREE.SphereGeometry(102 + i * 15, 24, 16), haloMat, sun.position.toArray());

  const planetGeometry = new THREE.SphereGeometry(360, 48, 32), planetColors = [];
  const pp = planetGeometry.getAttribute('position');
  const p1 = new THREE.Color(0xc2bca5), p2 = new THREE.Color(0x7c9b95);
  for (let i = 0; i < pp.count; i++) {
    const y = pp.getY(i), x = pp.getX(i);
    const band = (Math.sin(y * .045 + Math.sin(x * .01) * .55) + Math.sin(y * .13) * .22 + 1.3) / 2.6;
    const c = p1.clone().lerp(p2, band * .64); planetColors.push(c.r, c.g, c.b);
  }
  planetGeometry.setAttribute('color', new THREE.Float32BufferAttribute(planetColors, 3));
  const planet = mesh(root, planetGeometry, new THREE.MeshStandardMaterial({vertexColors: true, roughness: 1, fog: false}), [580, 565, -2400]); planet.rotation.z = -.3;
  const planetRing = mesh(root, new THREE.RingGeometry(440, 505, 100), new THREE.MeshBasicMaterial({color: 0xc3c4ac, transparent: true, opacity: .38, side: THREE.DoubleSide, fog: false, depthWrite: false}), planet.position.toArray());
  planetRing.rotation.set(1.1, .1, -.28);
  const starPositions = [];
  for (let i = 0; i < 330; i++) {
    const theta = rng() * TAU, y = .18 + rng() * .75, r = Math.sqrt(1 - y * y);
    starPositions.push(Math.cos(theta) * r * 3300, y * 3300, Math.sin(theta) * r * 3300);
  }
  const starsG = new THREE.BufferGeometry(); starsG.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
  const stars = new THREE.Points(starsG, new THREE.PointsMaterial({size: 2.7, color: 0xe7ece1, transparent: true, opacity: .45, fog: false, sizeAttenuation: true})); root.add(stars);

  const waterMaterial = new THREE.MeshStandardMaterial({color: C.water, metalness: .55, roughness: .27, flatShading: true});
  const waterGeometry = new THREE.PlaneGeometry(6200, 6200, 100, 120); waterGeometry.rotateX(-Math.PI / 2);
  const waterPositions = waterGeometry.attributes.position;
  for (let i = 0; i < waterPositions.count; i++) waterPositions.setY(i, Math.sin(waterPositions.getX(i) * .03 + waterPositions.getZ(i) * .07) * .28);
  waterGeometry.computeVertexNormals();
  const water = mesh(root, waterGeometry, waterMaterial, [0, -9, -500]);
  const waterGlints = new THREE.Group(); root.add(waterGlints);
  const glintMat = new THREE.MeshBasicMaterial({color: 0x98c6bd, transparent: true, opacity: .22});
  for (let i = 0; i < 180; i++) {
    const m = cube(waterGlints, [1 + rng() * 11, .035, .18 + rng() * .25], [(rng() - .5) * 220, -8.56, -rng() * 1900], glintMat);
    m.userData.z = m.position.z; m.userData.x = m.position.x;
  }
  // Distant silhouettes stay on the horizon; the nearer canyon streams past.
  const farMountains = new THREE.Group(); root.add(farMountains);
  for (let i = 0; i < 23; i++) {
    const x = (i - 11) * 140, height = 100 + rng() * 310;
    const g = rockGeometry(85 + rng() * 90, height, rng);
    const m = mesh(farMountains, g, new THREE.MeshStandardMaterial({color: i % 2 ? 0x6d8580 : 0x858f7f, flatShading: true, roughness: 1}), [x, -15, -1650 - rng() * 500]);
    m.scale.z = 1.8;
  }
  // The all-range encounter can turn the camera through a full circle.
  // Complete the distant horizon without putting scenery inside the flight volume.
  const rearMountainMaterial = mat(0x7a8e83, .05, .95);
  for (let i = 0; i < 21; i++) {
    const angle = -.15 + i / 20 * Math.PI * 1.3;
    const radius = 1450 + rng() * 400;
    const mountain = mesh(farMountains, rockGeometry(100 + rng() * 100, 130 + rng() * 240, rng), rearMountainMaterial,
      [Math.cos(angle) * radius, -16, Math.sin(angle) * radius]);
    mountain.rotation.y = -angle; mountain.scale.z = 1.4;
  }
  const cloudMaterial = new THREE.MeshBasicMaterial({color: 0xe1ccb0, transparent: true, opacity: .19, depthWrite: false, fog: false});
  const clouds = new THREE.Group(); root.add(clouds);
  for (let i = 0; i < 23; i++) {
    const x = (rng() - .5) * 3700, y = 165 + rng() * 320, z = -1000 - rng() * 1800;
    const c = mesh(clouds, new THREE.IcosahedronGeometry(1, 1), cloudMaterial, [x, y, z]); c.scale.set(110 + rng() * 180, 4 + rng() * 9, 20 + rng() * 35); c.userData.x = x;
  }

  const chunks = [], rockMaterial = new THREE.MeshStandardMaterial({vertexColors: true, roughness: .9, flatShading: true, metalness: .05});
  const green = mat(0x3e6560, .1, .95), trunkMat = mat(0x70574a), leafMat = mat(0xcf805b, .1, .9);
  for (let i = 0; i < 20; i++) {
    const chunk = new THREE.Group(); chunk.userData.baseZ = -i * 97.5; root.add(chunk);
    const sideGroups = [];
    for (const side of [-1, 1]) {
      const sideGroup = new THREE.Group(); sideGroups.push(sideGroup); chunk.add(sideGroup); sideGroup.userData.side = side;
      const mainHeight = 23 + rng() * 55;
      for (let j = 0; j < 4; j++) {
        const radius = 20 + rng() * 28, height = j ? 35 + rng() * 115 : mainHeight;
        const x = side * (50 + j * 39 + rng() * 20), z = (rng() - .5) * 85;
        const r = mesh(sideGroup, rockGeometry(radius, height, rng), rockMaterial, [x, -12, z]);
        r.scale.z = 1.2 + rng() * .55;
        if (j < 2) {
          const topRadius = radius * .46;
          mesh(sideGroup, new THREE.CylinderGeometry(topRadius, topRadius * 1.15, 1.1, 7), green, [x, height - 11.5, z]);
          if ((i + j) % 3 === 0) {
            const b = makeBuilding(rng, 5 + rng() * 6, 9 + rng() * 17, 7 + rng() * 5); b.position.set(x, height - 11, z); sideGroup.add(b);
            for (let k = 0; k < 2; k++) {
              const b2 = makeBuilding(rng, 3 + rng() * 4, 4 + rng() * 8, 4 + rng() * 5); b2.position.set(x + side * (9 + k * 7), height - 12, z - 3 + k * 7); sideGroup.add(b2);
            }
          } else {
            for (let k = 0; k < 3; k++) {
              const tx = x + (rng() - .5) * topRadius, tz = z + (rng() - .5) * topRadius, h = 2 + rng() * 5;
              rod(sideGroup, [tx, height - 11, tz], [tx + .5, height - 11 + h, tz], .2, trunkMat);
              const crown = mesh(sideGroup, new THREE.IcosahedronGeometry(1, 0), leafMat, [tx + .5, height - 11 + h, tz]); crown.scale.set(2.5 + rng() * 2, 1.3, 2.5 + rng() * 2);
            }
          }
        }
      }
      // A low, angular shore gives the water a bright edge at close range.
      const shore = mesh(sideGroup, rockGeometry(19 + rng() * 9, 5 + rng() * 8, rng), rockMaterial, [side * (39 + rng() * 8), -13, -25 + rng() * 55]); shore.scale.z = 1.8;
      if (i % 4 === 2) {
        const antenna = new THREE.Group(); antenna.position.set(side * 68, mainHeight - 9, 3); sideGroup.add(antenna);
        rod(antenna, [0, 0, 0], [0, 26, 0], .4, mat(C.ivory));
        const dish = mesh(antenna, new THREE.SphereGeometry(4, 12, 8, 0, TAU, 0, Math.PI / 2), mat(0xc0baa1, .55, .4), [0, 21, 0]); dish.rotation.z = side * .6; dish.scale.y = .25;
        mesh(antenna, new THREE.SphereGeometry(.4, 6, 4), glow(C.cyan), [0, 27, 0]);
      }
    }
    if (i % 5 === 3) { const arch = makeArch(); chunk.add(arch); chunk.userData.arch = arch; }
    const industrial = i % 4 === 1 ? makeIndustrial(rng) : null;
    if (industrial) {chunk.add(industrial); industrial.visible = false;}
    chunk.userData.sides = sideGroups; chunk.userData.industrial = industrial; chunks.push(chunk);
  }

  // The basin is deliberately much wider than the 195-unit playable radius.
  // These island piers frame every heading while leaving generous camera clearance.
  const basin = new THREE.Group(); basin.visible = false; root.add(basin);
  const basinRotors = [];
  for (let i = 0; i < 16; i++) {
    const angle = i / 16 * TAU + .12, radius = 410 + rng() * 85;
    const island = new THREE.Group(); island.position.set(Math.cos(angle) * radius, -12, Math.sin(angle) * radius); basin.add(island);
    const height = 28 + rng() * 45, width = 30 + rng() * 20;
    mesh(island, rockGeometry(width, height, rng), rockMaterial);
    mesh(island, rockGeometry(width * .65, height * .7, rng), rockMaterial, [width * .65, 0, width * .3]);
    mesh(island, new THREE.CylinderGeometry(width * .42, width * .52, 1.2, 7), green, [0, height, 0]);
    const building = makeBuilding(rng, 9 + rng() * 5, 8 + rng() * 12, 10 + rng() * 8);
    building.position.set(0, height + .4, 0); island.add(building);
    if (i % 4 === 1) {
      const tower = new THREE.Group(); tower.position.set(-7, height, 4); island.add(tower);
      mesh(tower, new THREE.CylinderGeometry(3, 5, 29, 6), mat(C.ivory), [0, 14.5, 0]);
      mesh(tower, new THREE.CylinderGeometry(6.5, 4, 3, 8), mat(C.orange), [0, 30, 0]);
      mesh(tower, new THREE.TorusGeometry(5.5, .3, 5, 20), glow(C.cyan), [0, 30, 0], [Math.PI / 2, 0, 0]);
      const radar = new THREE.Group(); radar.position.y = 33; tower.add(radar); basinRotors.push(radar);
      cube(radar, [12, 2, .6], [0, 0, 0], mat(C.dark));
      cube(radar, [10, .18, .08], [0, 0, .35], glow(C.gold));
      rod(tower, [0, 32, 0], [0, 39, 0], .2, mat(C.ivory));
      mesh(tower, new THREE.SphereGeometry(.45, 6, 4), glow(C.cyan), [0, 39, 0]);
    }
    // Receding landing jetties point inward, well outside the combat area.
    const inward = new THREE.Group(); inward.rotation.y = -angle; island.add(inward);
    cube(inward, [28, 2, 12], [-width * .8, height * .32, 0], mat(C.ink));
    for (let j = 0; j < 4; j++) cube(inward, [.6, .3, .6], [-width * .8 - 11 + j * 7, height * .32 + 1.15, 5.2], glow(C.gold));
  }
  // Clone only the island materials so their arrival can fade smoothly without
  // changing the shared ship, building, or terrain materials elsewhere.
  const basinMaterials = new Map();
  basin.traverse(object => {
    if (!object.isMesh) return;
    const cloneMaterial = original => {
      if (!basinMaterials.has(original)) {
        const copy = original.clone(); copy.transparent = true; copy.opacity = 0;
        copy.userData.shared = false; basinMaterials.set(original, copy);
      }
      return basinMaterials.get(original);
    };
    object.material = Array.isArray(object.material) ? object.material.map(cloneMaterial) : cloneMaterial(object.material);
  });

  // An orbital tether and its suspended dock establish a destination at the horizon.
  const station = new THREE.Group(); station.position.set(-300, 135, -1380); root.add(station);
  const stationDark = mat(0x4e6764, .6, .5), stationIvory = mat(0xc4c4ad, .45, .6);
  cube(station, [10, 480, 10], [0, 220, 0], stationIvory);
  const dock = mesh(station, new THREE.TorusGeometry(72, 6, 5, 48), stationDark, [0, 35, 0], [Math.PI / 2, 0, 0]);
  mesh(station, new THREE.TorusGeometry(67, .8, 4, 48), glow(0xb5d6be), [0, 35, 0], [Math.PI / 2, 0, 0]);
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * TAU; rod(station, [0, 65, 0], [Math.cos(a) * 70, 35, Math.sin(a) * 70], 1.5, stationIvory);
    cube(station, [9, 12, 20], [Math.cos(a) * 72, 35, Math.sin(a) * 72], stationIvory, [0, -a, 0]);
  }

  let chapterBlend = 0, arenaBlend = 0, elapsed = 0;
  return {
    root,
    update(dt, {time = 0, distance = 0, mode = 'title', chapter = 0, player, arena = false} = {}) {
      elapsed += dt;
      const target = typeof chapter === 'number' ? clamp(chapter, 0, 2) : 0;
      chapterBlend += (target - chapterBlend) * Math.min(dt * .4, 1);
      arenaBlend += ((arena ? 1 : 0) - arenaBlend) * (1 - Math.exp(-dt * 1.8));
      const title = mode === 'title' || mode === 'menu';
      const travel = title ? elapsed * 9 : distance;
      for (const chunk of chunks) {
        chunk.position.z = ((chunk.userData.baseZ + travel + 1800) % 1950 + 1950) % 1950 - 1800;
        for (const side of chunk.userData.sides) side.position.x = side.userData.side * (14 - Math.min(chapterBlend, 1) * 14 + arenaBlend * 265);
        if (chunk.userData.arch) {
          chunk.userData.arch.position.y = -arenaBlend * 120;
          chunk.userData.arch.visible = arenaBlend < .65;
        }
        if (chunk.userData.industrial) {
          chunk.userData.industrial.visible = chapterBlend > .95 && arenaBlend < .65;
          chunk.userData.industrial.position.y = -Math.max(0, 1.75 - chapterBlend) * 65 - arenaBlend * 120;
        }
      }
      basin.visible = arenaBlend > .002;
      for (const material of basinMaterials.values()) material.opacity = arenaBlend;
      for (const radar of basinRotors) radar.rotation.y = elapsed * .26;
      for (const glint of waterGlints.children) {
        glint.position.z = ((glint.userData.z + travel * .9 + 1800) % 2000 + 2000) % 2000 - 1800 + arenaBlend * 350;
        glint.position.x = glint.userData.x * (1 + arenaBlend * 2.8);
      }
      water.position.y = -9 + Math.sin(elapsed * .4) * .08;
      for (const cloud of clouds.children) cloud.position.x = cloud.userData.x + Math.sin(elapsed * .007 + cloud.userData.x) * 25;
      dock.rotation.z = elapsed * .005;
      const fogTarget = new THREE.Color(chapterBlend > 1.4 ? 0x6b9390 : 0x779b96);
      scene.fog.color.lerp(fogTarget, Math.min(dt * .2, 1));
    },
    dispose() {
      scene.remove(root, hemi, sunLight, rim);
      const geometries = new Set(); root.traverse(o => {if (o.geometry && o.geometry !== cubeGeometry) geometries.add(o.geometry);});
      geometries.forEach(g => g.dispose());
      basinMaterials.forEach(m => m.dispose());
    },
  };
}

return {createWorld,createShip,createEnemy,createBoss,createRing};

// systems.js
const {Input,AudioEngine} = (()=>{
// Controller-first input and original procedural audio. No external audio assets.
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const number = (v, fallback) => Number.isFinite(Number(v)) ? Number(v) : fallback;

class Input {
  constructor(settings = {}, onActivity = () => {}) {
    this.settings = settings;
    this.onActivity = onActivity;
    this.keys = new Set();
    this.presses = new Set();
    this.mouse = new Set();
    this.mousePresses = new Set();
    this.previous = {};
    this.padIndex = null;
    this.pad = null;
    this.activity = false;
    this.navigation = { x: 0, y: 0, tx: 0, ty: 0 };
    this.suppressedButtons = new Set();
    this.listeners = [];
    this.gameKeys = new Set([
      'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD',
      'Space', 'KeyC', 'ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight',
      'KeyQ', 'KeyE', 'KeyF', 'KeyR', 'KeyX', 'Escape', 'KeyP', 'Enter', 'NumpadEnter',
    ]);
    this.listen(window, 'keydown', (event) => {
      if (this.gameKeys.has(event.code)) event.preventDefault();
      if (!event.repeat) this.presses.add(event.code);
      this.keys.add(event.code);
      this.markActivity();
    });
    this.listen(window, 'keyup', (event) => {
      if (this.gameKeys.has(event.code)) event.preventDefault();
      this.keys.delete(event.code);
    });
    this.listen(window, 'pointerdown', (event) => {
      if (event.pointerType === 'mouse') {
        this.mouse.add(event.button);
        this.mousePresses.add(event.button);
      }
      this.markActivity();
    });
    this.listen(window, 'pointerup', (event) => this.mouse.delete(event.button));
    this.listen(window, 'pointercancel', (event) => this.mouse.delete(event.button));
    this.listen(window, 'pointermove', (event) => {
      if (event.pointerType === 'mouse' && Math.abs(event.movementX) + Math.abs(event.movementY) > 2) this.markActivity();
    });
    this.listen(window, 'contextmenu', (event) => event.preventDefault());
    this.listen(window, 'blur', () => this.reset());
    this.listen(document, 'visibilitychange', () => { if (document.hidden) this.reset(); });
    this.listen(window, 'gamepadconnected', (event) => {
      this.padIndex = event.gamepad.index;
      this.previous = {};
      this.markActivity();
    });
    this.listen(window, 'gamepaddisconnected', (event) => {
      if (this.padIndex === event.gamepad.index) {
        this.padIndex = null;
        this.pad = null;
        this.previous = {};
        this.suppressedButtons.clear();
      }
    });
  }

  listen(target, name, callback) {
    target.addEventListener(name, callback, { passive: false });
    this.listeners.push([target, name, callback]);
  }

  markActivity() {
    this.activity = true;
    this.onActivity();
  }

  readPad() {
    let pads;
    try { pads = navigator.getGamepads?.() || []; } catch { pads = []; }
    let selected = this.padIndex == null ? null : pads[this.padIndex];
    for (const candidate of pads) {
      if (!candidate?.connected) continue;
      const active = candidate.buttons.some((b) => b.pressed || b.value > 0.25)
        || candidate.axes.some((a) => Math.abs(a) > 0.3);
      if (!selected || (active && candidate.index !== selected.index)) selected = candidate;
    }
    this.pad = selected?.connected ? selected : null;
    this.padIndex = this.pad?.index ?? null;
    return this.pad;
  }

  poll(dt = 1 / 60) {
    const pad = this.readPad();
    const key = (...names) => names.some((name) => this.keys.has(name));
    const press = (...names) => names.some((name) => this.presses.has(name));
    const rawButton = (i) => !!pad?.buttons[i] && (pad.buttons[i].pressed || pad.buttons[i].value > 0.35);
    for (const i of this.suppressedButtons) if (!rawButton(i)) this.suppressedButtons.delete(i);
    const button = (i) => !this.suppressedButtons.has(i) && rawButton(i);
    const deadzone = clamp(number(this.settings.deadzone, 0.16), 0.05, 0.5);
    let axisX = number(pad?.axes[0], 0);
    let axisY = -number(pad?.axes[1], 0);
    const radius = Math.hypot(axisX, axisY);
    if (radius > deadzone) {
      const scale = Math.min(1, (radius - deadzone) / (1 - deadzone)) / radius;
      axisX *= scale;
      axisY *= scale;
    } else { axisX = 0; axisY = 0; }
    const digitalX = Number(key('ArrowRight', 'KeyD')) - Number(key('ArrowLeft', 'KeyA'));
    const digitalY = Number(key('ArrowUp', 'KeyW')) - Number(key('ArrowDown', 'KeyS'));
    const sensitivity = clamp(number(this.settings.sensitivity, 1), 0.35, 2.5);
    let x = clamp((digitalX || axisX) * sensitivity, -1, 1);
    let y = clamp((digitalY || axisY) * sensitivity, -1, 1);
    if (this.settings.invertX || this.settings.invertHorizontal) x *= -1;
    if (this.settings.invertY || this.settings.invertVertical) y *= -1;

    const held = {
      fire: button(7) || button(0) || key('Space') || this.mouse.has(0),
      charge: button(6) || key('KeyC') || this.mouse.has(2),
      boost: button(5) || key('ShiftLeft', 'ShiftRight'),
      brake: button(4) || key('ControlLeft', 'ControlRight'),
      rollLeft: button(2) || key('KeyQ'),
      rollRight: button(1) || key('KeyE'),
      bomb: button(3) || key('KeyF'),
      wing: button(12) || key('KeyR'),
      flip: button(13) || key('KeyX'),
      pause: button(9) || key('Escape', 'KeyP'),
      confirm: button(0) || key('Enter', 'NumpadEnter'),
      back: button(1) || key('Escape'),
    };
    const edge = (name, ...names) => (held[name] && !this.previous[name]) || press(...names);
    const horizontal = digitalX || Number(button(15)) - Number(button(14)) || (Math.abs(axisX) > 0.55 ? Math.sign(axisX) : 0);
    // Menu Y follows screen coordinates; flight Y points up.
    const vertical = -digitalY || Number(button(13)) - Number(button(12)) || (Math.abs(axisY) > 0.55 ? -Math.sign(axisY) : 0);
    const navX = this.repeatNavigation('x', horizontal, dt);
    const navY = this.repeatNavigation('y', vertical, dt);
    const padActive = !!pad && (Math.abs(axisX) + Math.abs(axisY) > 0 || pad.buttons.some((b) => b.pressed || b.value > 0.35));
    if (padActive) this.markActivity();
    const result = {
      x, y,
      fire: held.fire || press('Space') || this.mousePresses.has(0),
      charge: held.charge,
      boost: held.boost,
      brake: held.brake,
      rollLeft: edge('rollLeft', 'KeyQ'),
      rollRight: edge('rollRight', 'KeyE'),
      bomb: edge('bomb', 'KeyF'),
      wing: edge('wing', 'KeyR'),
      flip: edge('flip', 'KeyX'),
      pause: edge('pause', 'Escape', 'KeyP'),
      confirm: edge('confirm', 'Enter', 'NumpadEnter'),
      back: edge('back', 'Escape'),
      navX, navY,
      any: this.activity || padActive || this.presses.size > 0 || this.mousePresses.size > 0,
      gamepad: !!pad,
    };
    this.previous = held;
    this.presses.clear();
    this.mousePresses.clear();
    this.activity = false;
    return result;
  }

  repeatNavigation(axis, value, dt) {
    value = Math.sign(value);
    const timer = axis === 'x' ? 'tx' : 'ty';
    if (value !== this.navigation[axis]) {
      this.navigation[axis] = value;
      this.navigation[timer] = 0.34;
      return value;
    }
    if (!value) { this.navigation[timer] = 0; return 0; }
    this.navigation[timer] -= Math.min(0.1, Math.max(0, dt));
    if (this.navigation[timer] <= 0) {
      this.navigation[timer] = 0.12;
      return value;
    }
    return 0;
  }

  reset() {
    this.keys.clear();
    this.presses.clear();
    this.mouse.clear();
    this.mousePresses.clear();
    this.activity = false;
    this.previous = {};
    this.navigation = { x: 0, y: 0, tx: 0, ty: 0 };
    // Changing screens must not consume the same held controller press twice.
    this.suppressedButtons.clear();
    const pad = this.readPad();
    pad?.buttons.forEach((b, i) => { if (b.pressed || b.value > 0.35) this.suppressedButtons.add(i); });
  }

  rumble(strength = 0.4, duration = 100) {
    const actuator = this.pad?.vibrationActuator;
    if (!actuator?.playEffect) return;
    try {
      const result = actuator.playEffect('dual-rumble', {
        startDelay: 0, duration: clamp(duration, 0, 1000),
        weakMagnitude: clamp(strength * 0.7, 0, 1), strongMagnitude: clamp(strength, 0, 1),
      });
      result?.catch?.(() => {});
    } catch { /* Optional controller feature. */ }
  }

  destroy() {
    for (const [target, name, callback] of this.listeners) target.removeEventListener(name, callback);
    this.listeners.length = 0;
    this.reset();
  }
}

class AudioEngine {
  constructor(settings = {}) {
    this.settings = settings;
    this.ctx = null;
    this.available = true;
    this.state = { speed: 0, combat: false, boss: false, health: 100, paused: false, attract: false };
    this.nextStep = 0;
    this.step = 0;
    this.lastSfx = {};
    this.warningTimer = 0;
    this.unlockPromise = null;
  }

  async unlock() {
    if (!this.available) return false;
    if (this.unlockPromise) return this.unlockPromise;
    this.unlockPromise = this.initialize();
    try { return await this.unlockPromise; }
    finally { this.unlockPromise = null; }
  }

  async initialize() {
    try {
      if (!this.ctx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) { this.available = false; return false; }
        this.ctx = new AudioContext({ latencyHint: 'interactive' });
        this.master = this.ctx.createGain();
        this.master.gain.value = 0;
        this.musicBus = this.ctx.createGain();
        this.sfxBus = this.ctx.createGain();
        this.engineBus = this.ctx.createGain();
        this.musicBus.connect(this.master);
        this.sfxBus.connect(this.master);
        this.engineBus.connect(this.master);
        const compressor = this.ctx.createDynamicsCompressor();
        compressor.threshold.value = -16;
        compressor.knee.value = 22;
        compressor.ratio.value = 4;
        compressor.attack.value = 0.004;
        compressor.release.value = 0.18;
        this.master.connect(compressor);
        compressor.connect(this.ctx.destination);
        this.noiseBuffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
        const noise = this.noiseBuffer.getChannelData(0);
        let last = 0;
        for (let i = 0; i < noise.length; i++) {
          last = (last + (Math.random() * 2 - 1) * 0.035) / 1.035;
          noise[i] = last * 5.5;
        }
        this.createEngine();
        this.nextStep = this.ctx.currentTime + 0.06;
      }
      if (this.ctx.state === 'suspended') await this.ctx.resume();
      this.setSettings(this.settings);
      return this.ctx.state === 'running';
    } catch {
      // Audio availability must never prevent the flight simulation from running.
      this.available = false;
      return false;
    }
  }

  level(value, fallback) {
    const v = number(value, fallback);
    return clamp(v > 1 ? v / 100 : v, 0, 1);
  }

  setSettings(settings) {
    this.settings = settings || {};
    if (!this.ctx || !this.master) return;
    const now = this.ctx.currentTime;
    const volume = this.level(this.settings.volume ?? this.settings.masterVolume, 0.8);
    const silent = this.settings.muted || this.state.attract;
    this.master.gain.setTargetAtTime(silent ? 0 : volume, now, 0.06);
    this.musicBus.gain.setTargetAtTime(this.level(this.settings.music ?? this.settings.musicVolume, 0.65) * (this.state.paused ? 0.3 : 1), now, 0.08);
    this.sfxBus.gain.setTargetAtTime(this.level(this.settings.sfx ?? this.settings.sfxVolume, 0.8), now, 0.04);
  }

  createEngine() {
    const ctx = this.ctx;
    this.engineFilter = ctx.createBiquadFilter();
    this.engineFilter.type = 'lowpass';
    this.engineFilter.frequency.value = 340;
    this.engineFilter.Q.value = 0.8;
    this.engineFilter.connect(this.engineBus);
    this.engineOscillators = [ctx.createOscillator(), ctx.createOscillator()];
    this.engineOscillators.forEach((osc, i) => {
      osc.type = i ? 'triangle' : 'sawtooth';
      osc.frequency.value = i ? 68.6 : 34;
      const gain = ctx.createGain();
      gain.gain.value = i ? 0.12 : 0.065;
      osc.connect(gain);
      gain.connect(this.engineFilter);
      osc.start();
    });
    const exhaust = ctx.createBufferSource();
    exhaust.buffer = this.noiseBuffer;
    exhaust.loop = true;
    this.exhaustFilter = ctx.createBiquadFilter();
    this.exhaustFilter.type = 'bandpass';
    this.exhaustFilter.frequency.value = 420;
    this.exhaustFilter.Q.value = 0.4;
    this.exhaustGain = ctx.createGain();
    this.exhaustGain.gain.value = 0.09;
    exhaust.connect(this.exhaustFilter);
    this.exhaustFilter.connect(this.exhaustGain);
    this.exhaustGain.connect(this.engineBus);
    exhaust.start();
    this.engineBus.gain.value = 0;
  }

  update(dt, state = {}) {
    Object.assign(this.state, state);
    if (!this.ctx || this.ctx.state !== 'running') return;
    const now = this.ctx.currentTime;
    this.setSettings(this.settings);
    const rawSpeed = Math.max(0, number(this.state.speed, 0));
    const speed = clamp(rawSpeed > 2 ? rawSpeed / 85 : rawSpeed, 0, 2);
    this.engineOscillators[0].frequency.setTargetAtTime(31 + speed * 25, now, 0.15);
    this.engineOscillators[1].frequency.setTargetAtTime(62.6 + speed * 50, now, 0.15);
    this.engineFilter.frequency.setTargetAtTime(240 + speed * 410, now, 0.2);
    this.exhaustFilter.frequency.setTargetAtTime(300 + speed * 700, now, 0.2);
    const engineLevel = (this.state.paused || this.state.attract) ? 0 : (0.08 + speed * 0.18) * this.level(this.settings.sfx ?? this.settings.sfxVolume, 0.8);
    this.engineBus.gain.setTargetAtTime(engineLevel, now, 0.15);
    if (this.nextStep < now - 0.3) this.nextStep = now + 0.03;
    let queued = 0;
    while (this.nextStep < now + 0.13 && queued++ < 8) {
      if (!this.state.attract) this.musicStep(this.step, this.nextStep);
      this.step++;
      const bpm = this.state.boss ? 128 : this.state.combat ? 116 : 104;
      this.nextStep += 60 / bpm / 4;
    }
    const health = number(this.state.health, 100);
    const fraction = health > 1 ? health / 100 : health;
    this.warningTimer -= Math.max(0, dt);
    if (fraction > 0 && fraction < 0.25 && this.state.combat && !this.state.paused && !this.state.attract && this.warningTimer <= 0) {
      this.warningTimer = 2.8;
      this.sfx('warning');
    }
  }

  tone(frequency, duration, type = 'sine', gain = 0.1, bus = this.sfxBus, when = this.ctx.currentTime, pan = 0, endFrequency = null, cutoff = 0) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    const amp = ctx.createGain();
    const stereo = ctx.createStereoPanner();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(12, frequency), when);
    if (endFrequency != null) osc.frequency.exponentialRampToValueAtTime(Math.max(12, endFrequency), when + duration);
    amp.gain.setValueAtTime(0.0001, when);
    amp.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), when + Math.min(0.014, duration * 0.15));
    amp.gain.exponentialRampToValueAtTime(0.0001, when + duration);
    stereo.pan.value = clamp(pan, -1, 1);
    let filter;
    if (cutoff) {
      filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = cutoff;
      osc.connect(filter);
      filter.connect(amp);
    } else osc.connect(amp);
    amp.connect(stereo);
    stereo.connect(bus);
    osc.start(when);
    osc.stop(when + duration + 0.02);
    osc.onended = () => { osc.disconnect(); filter?.disconnect(); amp.disconnect(); stereo.disconnect(); };
  }

  noise(duration, gain, cutoff, when = this.ctx.currentTime, pan = 0, bus = this.sfxBus, type = 'lowpass', endCutoff = null) {
    const ctx = this.ctx;
    const source = ctx.createBufferSource();
    source.buffer = this.noiseBuffer;
    const filter = ctx.createBiquadFilter();
    filter.type = type;
    filter.frequency.setValueAtTime(cutoff, when);
    if (endCutoff) filter.frequency.exponentialRampToValueAtTime(endCutoff, when + duration);
    filter.Q.value = 0.65;
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, when);
    amp.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), when + 0.009);
    amp.gain.exponentialRampToValueAtTime(0.0001, when + duration);
    const stereo = ctx.createStereoPanner();
    stereo.pan.value = clamp(pan, -1, 1);
    source.connect(filter);
    filter.connect(amp);
    amp.connect(stereo);
    stereo.connect(bus);
    source.start(when, Math.random() * 0.4);
    source.stop(when + duration + 0.02);
    source.onended = () => { source.disconnect(); filter.disconnect(); amp.disconnect(); stereo.disconnect(); };
  }

  musicStep(step, when) {
    const bus = this.musicBus;
    const combat = !!this.state.combat;
    const boss = !!this.state.boss;
    const midi = (note) => 440 * Math.pow(2, (note - 69) / 12);
    const chord = Math.floor(step / 32) % 4;
    const roots = boss ? [38, 37, 34, 33] : [38, 34, 41, 36];
    const root = roots[chord];
    const beat = step % 16;
    const fifth = 7;
    const third = [3, 4, 4, 4][chord];
    if (step % 32 === 0) {
      for (const [i, offset] of [0, third, fifth, 12].entries()) {
        this.tone(midi(root + 24 + offset), 3.8, 'sine', 0.027, bus, when + i * 0.018, (i - 1.5) * 0.38);
      }
    }
    if (step % (combat ? 2 : 4) === 0) {
      const bassNote = root + (step % 16 === 14 ? 12 : 0);
      this.tone(midi(bassNote), combat ? 0.23 : 0.38, 'triangle', combat ? 0.14 : 0.09, bus, when, 0, null, 700);
    }
    const arpeggio = [12, 19, 24, 19, 15, 22, 27, 22, 12, 19, 24, 31, 27, 24, 22, 19];
    if (step % 2 === 0) {
      const note = root + arpeggio[Math.floor(step / 2) % arpeggio.length];
      this.tone(midi(note), 0.24, 'triangle', combat ? 0.035 : 0.027, bus, when, Math.sin(step * 0.7) * 0.65, null, 2600);
      this.tone(midi(note), 0.4, 'sine', 0.011, bus, when + 0.19, -Math.sin(step * 0.7) * 0.65);
    }
    // A sparse, repeating original call-and-response melody over four chords.
    const phrase = [24, null, 27, null, 31, 29, 27, null, 24, null, 22, null, 19, null, 22, null];
    if (step % 4 === 0 && (combat || Math.floor(step / 64) % 2 === 1)) {
      const note = phrase[Math.floor(step / 4) % phrase.length];
      if (note != null) this.tone(midi(root + note), 0.48, 'sine', combat ? 0.055 : 0.035, bus, when, -0.12);
    }
    if (combat) {
      if (beat === 0 || beat === 8 || (boss && beat === 11)) {
        this.tone(135, 0.22, 'sine', 0.26, bus, when, 0, 40);
        this.noise(0.035, 0.055, 1800, when, 0, bus);
      }
      if (beat === 4 || beat === 12) {
        this.noise(0.16, 0.16, 1600, when, 0.12, bus, 'highpass', 800);
        this.tone(185, 0.09, 'triangle', 0.055, bus, when, 0.12, 120);
      }
      if (step % 2 === 0 || boss) this.noise(0.055, step % 4 === 0 ? 0.075 : 0.04, 6000, when, step % 4 ? -0.28 : 0.28, bus, 'highpass');
      if (boss && step % 8 === 6) this.tone(midi(root + 12), 0.12, 'sawtooth', 0.035, bus, when, -0.3, null, 1100);
    } else if (beat === 0 || beat === 8) {
      this.tone(84, 0.18, 'sine', 0.1, bus, when, 0, 42);
    }
  }

  sfx(name, pan = 0) {
    if (!this.ctx || this.ctx.state !== 'running' || this.state.attract || this.settings.muted) return;
    if (this.state.paused && !['menu', 'confirm'].includes(name)) return;
    const now = this.ctx.currentTime;
    const limits = { laser: 0.045, explosion: 0.07, hit: 0.09, charge: 0.2, lock: 0.18, warning: 0.5, menu: 0.05 };
    if (now - (this.lastSfx[name] ?? -100) < (limits[name] || 0.025)) return;
    this.lastSfx[name] = now;
    const tone = (f, d, type, gain, end, offset = 0, p = pan) => this.tone(f, d, type, gain, this.sfxBus, now + offset, p, end);
    const noise = (d, gain, cutoff, end = null, offset = 0, type = 'lowpass') => this.noise(d, gain, cutoff, now + offset, pan, this.sfxBus, type, end);
    switch (name) {
      case 'laser':
        tone(1550, 0.11, 'sawtooth', 0.045, 310);
        tone(2350, 0.065, 'sine', 0.085, 780);
        break;
      case 'charge':
        tone(160, 0.46, 'triangle', 0.13, 720);
        tone(240, 0.48, 'sine', 0.07, 1080);
        break;
      case 'lock':
        tone(880, 0.09, 'sine', 0.11, 880);
        tone(1320, 0.14, 'sine', 0.13, 1320, 0.09);
        break;
      case 'missile':
        tone(240, 0.44, 'sawtooth', 0.1, 65);
        noise(0.6, 0.32, 1900, 220);
        break;
      case 'explosion':
        tone(90, 0.5, 'sine', 0.34, 20);
        noise(0.65, 0.65, 2600, 100);
        noise(0.16, 0.24, 4800, 700);
        break;
      case 'hit':
        noise(0.25, 0.35, 1200, 160);
        tone(120, 0.2, 'triangle', 0.2, 48);
        break;
      case 'roll':
        noise(0.4, 0.25, 2200, 180, 0, 'bandpass');
        tone(420, 0.28, 'sine', 0.1, 900);
        tone(840, 0.28, 'sine', 0.07, 1800, 0.08, -pan);
        break;
      case 'boost':
        noise(0.65, 0.4, 300, 2900, 0, 'bandpass');
        tone(55, 0.55, 'sawtooth', 0.08, 185);
        break;
      case 'bomb':
        tone(720, 0.6, 'sine', 0.22, 35);
        tone(55, 1.45, 'sine', 0.55, 19, 0.1);
        noise(1.5, 0.8, 5400, 90, 0.08);
        break;
      case 'ring':
        [740, 932, 1110].forEach((f, i) => tone(f, 0.3, 'sine', 0.11, null, i * 0.065));
        break;
      case 'pickup':
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.32, 'triangle', 0.09, null, i * 0.075));
        break;
      case 'menu':
        tone(660, 0.055, 'sine', 0.08, 780);
        break;
      case 'confirm':
        tone(523.25, 0.14, 'triangle', 0.09, null);
        tone(1046.5, 0.23, 'sine', 0.11, null, 0.08);

const EMBLEM = `<svg viewBox="0 0 100 80" fill="none" aria-hidden="true"><path d="M16 31 11 4 35 15 50 12 65 15 89 4 84 31 95 48 79 68 50 80 21 68 5 48Z" fill="currentColor"/><path d="m14 42 29-9 7 13 7-13 29 9-14 16-15-1-7 8-7-8-15 1Z" fill="#071d27"/><path d="m24 43 14-3-5 8-9-1Zm52 0-14-3 5 8 9-1Z" fill="#f7f0dc"/><path d="m44 63 6-3 6 3-6 5Z" fill="#071d27"/></svg>`;
const WING = `<svg viewBox="0 0 50 50" fill="none" aria-hidden="true"><path d="m25 2 6 21 17 13-17-3-6 13-6-13-17 3 17-13Z" fill="currentColor"/><path d="M25 13v22" stroke="#071d27" stroke-width="3"/></svg>`;
const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number = value => Math.round(Number(value) || 0).toLocaleString('en-US');
const clamp = (n, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, Number(n) || 0));
const clock = sec => `${Math.floor((Number(sec) || 0) / 60)}:${String(Math.floor((Number(sec) || 0) % 60)).padStart(2,'0')}`;

class UI {
  constructor(callbacks = {}, settings = {}) {
    this.callbacks = callbacks;
    this.settings = settings;
    this.gamepad = false;
    this.ready = false;
    this.loading = 'ESTABLISHING UPLINK';
    this.screenName = 'title';
    this.page = 0;
    this.selected = 0;
    this.attract = false;
    this.touchOnly = false;
    this.hudData = {};
    const style = document.createElement('style');
    style.textContent = STYLE;
    document.head.append(style);
    this.root = document.createElement('div');
    this.root.id = 'sr-ui';
    this.root.innerHTML = `<div class="sr-hud" hidden>
      <div class="sr-hud-top"><div class="sr-shield-block"><div class="sr-shield-heading"><span class="sr-hud-tiny">R-64 / SHIELD</span><strong id="sr-health">100</strong></div><div class="sr-meter"><div class="sr-meter-fill" id="sr-health-fill"></div></div><div class="sr-energy-meter"><div class="sr-meter-fill" id="sr-energy-fill"></div></div><div class="sr-weapon-label" id="sr-weapon">PULSE LASER · MK I</div></div><div class="sr-hud-score"><strong id="sr-score">000000</strong><div class="sr-hud-tiny">MISSION SCORE</div><div class="sr-combo" id="sr-combo" hidden>CHAIN × 1</div></div></div>
      <div class="sr-mission-hud"><div class="sr-mission-name" id="sr-chapter">01 / SALTWATER REACH</div><div class="sr-track"><span></span><span></span><span></span><span></span></div><div class="sr-objective" id="sr-objective">Follow the tide.</div></div>
      <div class="sr-boss" hidden><div class="sr-boss-heading"><span id="sr-boss-name">THE UNDERTOW</span><span id="sr-boss-phase">I</span></div><div class="sr-meter"><div class="sr-meter-fill" id="sr-boss-fill"></div></div></div>
      <div class="sr-hud-bottom"><div class="sr-wingman-block"><div class="sr-wingman-icon">${WING}</div><div class="sr-wingman-info"><div class="sr-wingman-name" id="sr-wingman-name">WING / READY</div><div class="sr-meter"><div class="sr-meter-fill" id="sr-wingman-fill"></div></div><div class="sr-wingman-status" id="sr-wingman-status"></div></div></div><div class="sr-abilities"><div><div class="sr-bombs" id="sr-bombs"></div><div class="sr-ability-key" id="sr-bomb-key"></div></div><div class="sr-ability-key" id="sr-roll-key"></div><div class="sr-ability-key" id="sr-pause-key"></div></div></div>
      <div class="sr-hud-hint" id="sr-hint" hidden></div><div class="sr-speed"><span id="sr-speed">240</span><small>FLIGHT SPEED</small></div><div class="sr-charge" hidden><div class="sr-charge-label" id="sr-charge-label">CHARGING</div><div class="sr-meter"><div class="sr-meter-fill" id="sr-charge-fill"></div></div></div>
    </div><div class="sr-radio" role="status" aria-live="polite"><div class="sr-radio-portrait">${EMBLEM}</div><div><div class="sr-radio-speaker"><span id="sr-radio-speaker"></span><span class="sr-radio-signal">▂▄▆</span></div><div class="sr-radio-text" id="sr-radio-text"></div></div></div><div class="sr-announcement"><h2></h2><p></p></div><div class="sr-toast" role="status" aria-live="polite"></div><div class="sr-damage"></div><div class="sr-screen"></div><div class="sr-attract" hidden><strong>AUTOPILOT / ATTRACT MODE</strong><span>Press any button to take command</span></div><div class="sr-touch" hidden>Controller or keyboard required<button class="sr-button compact" data-external="settings">Settings <span class="sr-arrow">↗</span></button></div>`;
    document.body.append(this.root);
    this.menu = this.root.querySelector('.sr-screen');
    this.hud = this.root.querySelector('.sr-hud');
    this.refs = {};
    for (const el of this.root.querySelectorAll('[id]')) this.refs[el.id.replace('sr-','')] = el;
    this.root.addEventListener('click', event => {
      const external = event.target.closest('[data-external]');
      if (external) { this.callbacks.action?.(external.dataset.external); return; }
      const target = event.target.closest('button');
      if (!target || target.disabled || !this.menu.contains(target)) return;
      this.selected = this.items.indexOf(target);
      this._highlight();
      this._activate(target);
    });
    this.root.addEventListener('pointermove', event => {
      const target = event.target.closest('button');
      if (!target || target.disabled || !this.menu.contains(target)) return;
      const index = this.items.indexOf(target);
      if (index >= 0 && index !== this.selected) { this.selected = index; this._highlight(); }
    });
    this._inputLabels();
    this.screen('title');
  }

  _key(key, cls = '') { return `<span class="sr-key ${cls}">${escape(key)}</span>`; }
  _confirmKey() { return this.gamepad ? this._key('×','round sr-gamepad-cross') : this._key('ENTER'); }
  _backKey() { return this.gamepad ? this._key('○','round sr-gamepad-circle') : this._key('ESC'); }
  _button(id, title, primary = false, other = '') { return `<button class="sr-button${primary ? ' primary' : ''}" data-action="${id}" ${other}><span>${title}</span><span class="sr-arrow">${primary ? '↗' : '→'}</span></button>`; }
  _chrome() { return `<div class="sr-chrome"><div class="sr-brand">${EMBLEM}<span>ORBITAL SALVAGE CLUB</span><span class="sr-build">/ R-64</span></div><div class="sr-online ${this.ready ? '' : 'loading'}">${escape(this.ready ? 'ALL SYSTEMS NOMINAL' : this.loading)}</div></div>`; }
  _footer(back = true, extra = '') { return `<div class="sr-title-footer"><span class="sr-footnote">${extra || 'A little reckless. A long way from home.'}</span><div class="sr-input-hints"><span>${this.gamepad ? this._key('↕') : this._key('↑↓')} Navigate</span><span>${this._confirmKey()} Select</span>${back ? `<button class="sr-footer-back" data-action="back">${this._backKey()} Back</button>` : ''}</div></div>`; }
  _pageHeader(kicker, title, total) { return `<div class="sr-eyebrow">${kicker}</div><div class="sr-page-head"><h1>${title}</h1><div class="sr-page-count"><span><strong>${String(this.page+1).padStart(2,'0')}</strong> / ${String(total).padStart(2,'0')}</span><div class="sr-page-controls"><button class="sr-button compact" data-page="-1" aria-label="Previous page">←</button><button class="sr-button compact" data-page="1" aria-label="Next page">→</button></div></div></div>`; }

  screen(name, data = {}) {
    const same = name === this.screenName;
    this.screenName = name;
    this.data = data;
    if (!same) { this.page = 0; this.selected = 0; }
    this.menu.className = `sr-screen ${['settings','controls','about','results','error'].includes(name) ? 'full-shade' : name === 'none' ? '' : 'menu-shade'}`;
    this.hud.hidden = name !== 'none';
    this.root.querySelector('.sr-radio').style.visibility = name === 'none' ? 'visible' : 'hidden';
    this.root.querySelector('.sr-announcement').style.visibility = name === 'none' ? 'visible' : 'hidden';
    if (name === 'none') this.menu.innerHTML = '';
    else if (name === 'title') this.menu.innerHTML = this._title();
    else if (name === 'briefing') this.menu.innerHTML = this._briefing();
    else if (name === 'pause') this.menu.innerHTML = this._pause();
    else if (name === 'settings') this.menu.innerHTML = this._settings();
    else if (name === 'controls') this.menu.innerHTML = this._controls();
    else if (name === 'about') this.menu.innerHTML = this._about();
    else if (name === 'results') this.menu.innerHTML = this._results(data);
    else if (name === 'error') this.menu.innerHTML = this._error(data);
    this.items = [...this.menu.querySelectorAll('button:not(:disabled)')];
    this.selected = Math.max(0, Math.min(this.selected, this.items.length - 1));
    this._highlight();
    this._updateTouch();
  }

  _title() {
    return `${this._chrome()}<div class="sr-title-main"><div class="sr-eyebrow">THE GLASS TIDE / A FLIGHT ADVENTURE</div><h1 class="sr-wordmark">STAR<span style="color:var(--cream)">RACCOON</span><span class="sr-sixtyfour">64</span></h1><p class="sr-tagline">Take the scenic route.<br>Save the system.</p><nav class="sr-title-nav" aria-label="Main menu">${this._button('start', this.ready ? 'Launch expedition' : 'Preparing your ship…', true, this.ready ? '' : 'disabled')}${this._button('controls','Flight manual')}${this._button('settings','Settings')}${this._button('about','About & credits')}</nav></div><div class="sr-hero-meta"><div><div class="sr-small">NEXT DESTINATION</div><strong>Saltwater Reach</strong><div class="sr-small">07° 43′ N / 64° 12′ E</div></div><div class="sr-coordinate">01</div></div>${this._footer(false, 'WEBGPU FLIGHT SYSTEM · AUTOPILOT AFTER 10 SECONDS')}`;
  }

  _briefing() {
    return `${this._chrome()}<div class="sr-panel"><div class="sr-eyebrow">EXPEDITION 01 / THE GLASS TIDE</div><h1>Somebody has to<br>make the delivery.</h1><p>The Sunken Array has gone rogue. Follow the coast, slip through Needle Canyon, and shut down the machine pulling our world apart.</p><div class="sr-mission-steps"><div class="sr-mission-step"><b>01 / FLY</b><span>Stay with the squad.<br>Collect rings to repair.</span></div><div class="sr-mission-step"><b>02 / CHOOSE</b><span>Take the left or right gate.<br>Your route changes the fight.</span></div><div class="sr-mission-step"><b>03 / SURVIVE</b><span>Break the Undertow.<br>Bring everybody home.</span></div></div><div class="sr-nav">${this._button('launch','Let’s make some waves',true)}${this._button('controls','Review flight controls')}${this._button('back','Back')}</div></div><div class="sr-briefing-route"><svg viewBox="0 0 400 430" fill="none" aria-hidden="true"><path d="M70 350 90 250 230 175 190 65 325 45" stroke="#a5d9cb25" stroke-width="60"/><path d="M70 350 90 250 230 175 190 65 325 45" stroke="#7de9dd" stroke-width="2" stroke-dasharray="5 7"/><path d="m90 250 55-75 85 0" stroke="#ff8b4b" stroke-width="2" stroke-dasharray="4 8"/><circle cx="70" cy="350" r="9" fill="#ff8b4b"/><circle cx="230" cy="175" r="8" fill="#7de9dd"/><circle cx="325" cy="45" r="10" stroke="#ff8b4b" stroke-width="2"/><circle cx="325" cy="45" r="19" stroke="#ff8b4b" opacity=".3"/><text x="95" y="357" class="sr-route-point">SALTWATER REACH</text><text x="245" y="202" class="sr-route-point">NEEDLE</text><text x="245" y="224" class="sr-route-point">CANYON</text><text x="120" y="26" class="sr-route-point">THE SUNKEN ARRAY</text><path d="M30 65v25h25M350 350v-25h-25" stroke="#f7f0dc55" stroke-width="2"/></svg><div class="sr-route-caption">MULTIPLE ROUTES. ONE WAY HOME.</div></div>${this._footer(true,'ESTIMATED FLIGHT / 4–6 MINUTES')}`;
  }

  _pause() {
    return `${this._chrome()}<div class="sr-panel"><div class="sr-eyebrow">FLIGHT SYSTEM / HOLDING PATTERN</div><h1>Catch your breath.</h1><p>The coast can wait a moment.</p><nav class="sr-nav" aria-label="Pause menu">${this._button('resume','Back to the sky',true)}${this._button('settings','Settings')}${this._button('controls','Flight manual')}${this._button('retryCheckpoint','Restart checkpoint')}${this._button('quit','Return to title')}</nav></div>${this._footer(true,'MISSION PAUSED')}`;
  }

  _settings() {
    const s = this.settings;
    const row = (key, title, detail, value) => `<button class="sr-setting" data-setting="${key}"><span>${title}<span class="sr-setting-detail">${detail}</span></span><span class="sr-setting-value">${value}</span></button>`;
    const percent = n => `${Math.round((Number(n) || 0) * 100)}%`;
    return `${this._chrome()}<div class="sr-full-panel"><div class="sr-eyebrow">MAKE YOURSELF AT HOME</div><h1>Flight settings</h1><div class="sr-settings-grid">${row('invertX','Invert horizontal','Reverse left / right stick input',s.invertX ? 'ON' : 'OFF')}${row('invertY','Invert vertical','Reverse up / down stick input',s.invertY ? 'ON' : 'OFF')}${row('sensitivity','Steering sensitivity','How quickly your ship responds',`${Number(s.sensitivity ?? 1).toFixed(1)}×`)}${row('deadzone','Stick deadzone','Ignore small unwanted stick movement',percent(s.deadzone ?? .14))}${row('assist','Aim assistance','Gentle guidance toward nearby targets',s.assist !== false ? 'ON' : 'OFF')}${row('difficulty','Flight difficulty','Incoming damage and enemy pressure',s.difficulty === 'veteran' ? 'VETERAN' : s.difficulty === 'relaxed' ? 'RELAXED' : 'STANDARD')}${row('music','Music volume','Procedural flight soundtrack',percent(s.music ?? .65))}${row('sfx','Effects volume','Lasers, engines, and radio cues',percent(s.sfx ?? .8))}${row('shake','Camera shake','Impact and boost camera movement',s.shake !== false ? 'ON' : 'OFF')}<button class="sr-setting" data-action="fullscreen"><span>Fullscreen<span class="sr-setting-detail">Give the sky the whole screen</span></span><span class="sr-setting-value">TOGGLE</span></button></div><div class="sr-setting-bottom">${this._button('back','Done',false,'style="min-width:160px"')}<span class="sr-setting-tip">${this.gamepad ? this._key('← →') : this._key('← →')} Adjust · Saved automatically on this device</span></div></div>${this._footer(true,'CONTROL PREFERENCES / LOCAL SAVE')}`;
  }

  _controls() {

      const target = this.items[this.selected];

    this.refs.chapter.textContent = `${String((d.chapter || 0)+1).padStart(2,'0')} / ${d.chapterName || 'SALTWATER REACH'}`;
    const progress = clamp(d.progress,0,1);

    this.refs.objective.textContent = d.objective || '';
    this.refs.hint.textContent = d.hint || '';
    this.refs.hint.hidden = !d.hint;
    this.refs.speed.textContent = Math.round(d.speed || 0);

      this.refs.bombs.innerHTML = Array.from({length:Math.max(3,bombs)},(_,i) => `<i class="sr-bomb-icon ${i < bombs ? '' : 'used'}"></i>`).join('');

    this.refs['wingman-fill'].style.width = `${wingHealth}%`;

    if (wing.cooldown > 0) this.refs['wingman-status'].textContent = `SUPPORT IN ${Math.ceil(wing.cooldown)}s`;
    else this.refs['wingman-status'].textContent = this.gamepad ? 'D-PAD ↑ · CALL SUPPORT' : 'R · CALL SUPPORT';

    if (hasBoss) {

      this.refs['boss-name'].textContent = d.bossName || 'THE UNDERTOW';
      this.refs['boss-phase'].textContent = d.bossPhase != null ? `PHASE ${d.bossPhase}` : '';

    this.root.querySelector('.sr-charge').hidden = charge <= .01;
    this.refs['charge-fill'].style.width = `${charge * 100}%`;
    this.refs['charge-label'].textContent = d.lock >= 1 ? 'LOCK CONFIRMED · RELEASE' : charge >= .98 ? 'CHARGED · ACQUIRE TARGET' : 'CHARGING';
    this.root.querySelector('.sr-damage').style.opacity = clamp(d.damage ?? 0,0,1) * .7;

  radio({speaker = 'SQUAD',text = '',mood} = {}) {

}

return {UI};

  }else{
    const destination=desired?desired.pos:new THREE.Vector3(Math.sin(time*.4)*11,10+Math.sin(time*.7)*5,0);
    const isAim=desired&&(desired.type==='enemy'||desired.type==='bossPart');
    const x=isAim?destination.x/1.8:destination.x,y=isAim?10+(destination.y-10)/1.6:destination.y;
    controls.x=clamp((x-P.pos.x)*.22,-1,1);controls.y=clamp((y-P.pos.y)*.22,-1,1);
    controls.charge=!!desired&&isAim&&(simTime%4)<1.6;
    controls.boost=!desired&&(time%19)<2;
    controls.bomb=Math.floor(time)%32===0&&time>30&&Math.floor((time-dtFixed))!==Math.floor(time);
    controls.wing=wingCooldown<=0&&time>120;
  }
  if(entities.some(e=>e.type==='enemyShot'&&e.pos.distanceToSquared(P.pos)<500)&&P.rollCD<=0)controls.rollRight=true;
  return controls;
}
const dtFixed=1/60;
function project(pos){const projected=pos.clone().project(camera);return{x:(projected.x*.5+.5)*innerWidth,y:(-.5*projected.y+.5)*innerHeight,visible:projected.z>0&&projected.z<1&&Math.abs(projected.x)<1.2&&Math.abs(projected.y)<1.2};}
function place(el,pos){const p=project(pos);el.style.left=`${p.x}px`;el.style.top=`${p.y}px`;el.hidden=!p.visible;return p.visible;}
function drawRadar(){
  if(!arena||!radarCtx)return;
  const ctx=radarCtx;ctx.clearRect(0,0,200,200);ctx.fillStyle='#09272bba';ctx.strokeStyle='#d2ecdb66';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(100,100,79,0,TAU);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(100,100,40,0,TAU);ctx.stroke();
  ctx.beginPath();ctx.moveTo(21,100);ctx.lineTo(179,100);ctx.moveTo(100,21);ctx.lineTo(100,179);ctx.stroke();
  ctx.fillStyle='#ff9c68';ctx.fillRect(96,96,8,8);
  ctx.save();ctx.translate(100+P.pos.x*.38,100+P.pos.z*.38);ctx.rotate(-heading);ctx.fillStyle='#e6f9df';ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(5,6);ctx.lineTo(0,3);ctx.lineTo(-5,6);ctx.closePath();ctx.fill();ctx.restore();
  ctx.fillStyle='#e6f9df';ctx.font='700 11px system-ui';ctx.textAlign='center';ctx.fillText('ALL-RANGE / 360°',100,195);
}
function updateCamera(dt){
  if(['title','briefing','loading'].includes(mode)||mode==='error'||(!['play','attract','attractOutro','pause','results'].includes(mode))){
    P.pos.set(5+Math.sin(simTime*.24)*.8,8+Math.sin(simTime*.7)*.5,0);playerMesh.position.copy(P.pos);playerMesh.rotation.set(-.05,-.18+Math.sin(simTime*.17)*.05,-.08);
    camera.position.set(20+Math.sin(simTime*.1)*2,13,32);camera.lookAt(-9,7,-20);
    escortMeshes.forEach((m,i)=>{m.visible=true;m.position.set(13+i*13,10+i*6,-24-i*25);m.rotation.set(0,0,Math.sin(simTime+i)*.09);});
  }else{
    let desired,look;
    if(arena){
      const f=new THREE.Vector3(-Math.sin(heading),0,-Math.cos(heading));desired=P.pos.clone().addScaledVector(f,-22);desired.y+=7;
      look=P.pos.clone().addScaledVector(f,65);look.y+=3;
    }else{desired=new THREE.Vector3(P.pos.x*.35,13+(P.pos.y-10)*.35,27);look=new THREE.Vector3(P.pos.x*.6,10+(P.pos.y-10)*.55,-75);}
    camera.position.lerp(desired,1-Math.exp(-dt*5.5));
    if(settings.shake&&shake>0){camera.position.x+=(Math.random()-.5)*shake*.6;camera.position.y+=(Math.random()-.5)*shake*.4;}
    camera.lookAt(look);
  }
  camera.fov=damp(camera.fov,(mode==='play'||mode==='attract')?57+(speed-46)*.15:51,3,dt);camera.updateProjectionMatrix();camera.updateMatrixWorld(true);
}
function updatePresentation(dt){
  const flying=['play','attract','attractOutro'].includes(mode);targetLayer.style.display=flying?'block':'none';radar.style.display=flying&&arena?'block':'none';
  if(flying){
    place(aimEl,aim);aimEl.classList.toggle('locked',lock>.95);
    if(target&&charge>.1){place(lockEl,target.pos);lockEl.classList.toggle('acquiring',lock<.95);const size=54+(1-lock)*32;lockEl.style.width=`${size}px`;lockEl.style.height=`${size}px`;}
    else lockEl.hidden=true;
    for(let i=0;i<2;i++){const e=entities.find(e=>e.type==='route'&&e.index===i);if(e){place(routeLabels[i],e.pos.clone().add(new THREE.Vector3(0,9,0)));routeLabels[i].innerHTML=i===0?'NEEDLE CANYON<small>HIGH RISK / HIGH SALVAGE</small>':'HIGH SKYWAY<small>SAFER PASSAGE</small>';}else routeLabels[i].hidden=true;}
    combatTag.textContent='';
    if(arena&&boss&&!boss.dead){const p=project(boss.mesh.position);if(!p.visible){
      const delta=boss.mesh.position.clone().sub(P.pos),wanted=Math.atan2(-delta.x,-delta.z),err=Math.atan2(Math.sin(wanted-heading),Math.cos(wanted-heading));
      combatTag.textContent=err<0?'UNDERTOW  ›  TURN RIGHT':'TURN LEFT  ‹  UNDERTOW';
    }}
    const bossHealth=boss?(boss.phase===0?boss.parts.filter(e=>e.part!=='core').reduce((n,e)=>n+Math.max(0,e.health),0)/48:boss.health/boss.maxHealth):0;
    ui.updateHUD({health:P.health,energy:P.energy,score,combo,bombs,weapon:['','PULSE','TWIN PULSE','HYPER PULSE'][weapon],chapter,chapterName:chapter===1&&route==='HIGH SKYWAY'?route:MISSION.chapters[chapter]?.name,progress:Math.min(time/210,1),speed:Math.round(speed*12),lock,charge,bossHealth:boss?bossHealth:undefined,bossName:boss?'THE UNDERTOW':'',bossPhase:boss?(boss.phase===0?'CAPACITORS':boss.phase===1?'EXPOSED CORE':'OVERDRIVE'):'',wingman:{health:P.wingHealth,name:'PIP',status:rescueActive?'IN TROUBLE':rescued?'WING SECURE':'ON YOUR WING',cooldown:wingCooldown},wingCooldown,attract,objective,hint:simTime<hintUntil?currentHint:'',damage:flash<1?flash:0,route,rings,elapsed:time,checkpoint:!!checkpoint});
    drawRadar();
  }
  damageWash.style.opacity=flying&&flash>0&&flash<1?String(flash*.55):'0';novaWash.style.opacity=flying&&flash>=1?String((flash-1)*.7):'0';
  audio.update(dt,{speed,combat:flying,boss:!!boss&&!boss.dead,health:P.health,paused:mode==='pause'||['settings','about','controls'].includes(ui.screenName),attract:attract||mode==='title'||mode==='briefing'});
}
let pending={};
function frame(now){
  const dt=Math.min((now-frameTime)/1000,.08);frameTime=now;
  const c=input.poll(dt);ui.setInput(c.gamepad);if(c.gamepad&&isTouch)ui.setTouchOnly(false);
  if((mode==='attract'||mode==='attractOutro')&&(c.any||activity)){toTitle();activity=false;renderer.render(scene,camera);return;}
  activity=false;
  if(mode==='title'&&now-lastActivity>=10000){attractCycle++;launch(false,true);}
  if(mode==='play'&&c.pause)pauseGame();
  else if(mode==='play'||mode==='attract'){
    for(const key of ['rollLeft','rollRight','bomb','wing','flip'])if(c[key])pending[key]=true;
    accumulator+=dt;
    while(accumulator>=dtFixed&&(mode==='play'||mode==='attract')){
      const controls=attract?pilotAI():{...c,...pending};step(dtFixed,controls);pending={};
      for(const key of ['rollLeft','rollRight','bomb','wing','flip'])c[key]=false;
      accumulator-=dtFixed;
    }
  }else if(mode==='attractOutro'){
    simTime+=dt;updateEffects(dt);scenery.update(dt,{time:simTime,distance,mode,chapter:chapter===1&&route==='HIGH SKYWAY'?.35:chapter,player:P.pos,arena});if(simTime>=gameOverTime){attractCycle++;launch(false,true);}
  }else{
    accumulator=0;
    if(c.navX||c.navY){ui.navigate(c.navX,c.navY);audio.sfx('menu');}
    if(c.confirm){ui.confirm();input.reset();}
    else if(c.back){if(mode==='pause'&&ui.screenName==='pause')handleAction('resume');else ui.back();}
    if(mode==='title'||mode==='briefing'){simTime+=dt;distance+=dt*7;scenery.update(dt,{time:simTime,distance,mode,chapter:0,player:P.pos});}
  }
  updateCamera(dt);updatePresentation(dt);renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
window.addEventListener('gamepaddisconnected',()=>{if(mode==='play'){pauseGame();ui.toast('CONTROLLER DISCONNECTED · RECONNECT OR USE KEYBOARD');}});
setupPhysics();ui.setReady();document.getElementById('boot-panel')?.remove();toTitle();
renderer.setAnimationLoop((now)=>{try{frame(now);}catch(error){renderer.setAnimationLoop(null);window.flightFailure(error);console.error(error);}});

} catch(error) { console.error(error); window.bootFailure(error); }
})();
</script>
