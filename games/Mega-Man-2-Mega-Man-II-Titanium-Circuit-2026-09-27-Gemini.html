# CO55 engine: API card (v0.4.0)

CO55 makes crisp pixel-art games in any 2D camera view. Characters are 3D skeletons, posed by math every step and drawn as pixel shapes, so motion is fluid and one game renders as isometric, three-quarter, top-down, brawler or side view.

## Make a game from this file
1. Keep the engine script unchanged. Replace only the code between `GAME START` and `GAME END`.
2. Create `new CO55.Game({ canvas, view })`, build a `TileMap`, create rigs, then call `game.start({ update, draw })`.
3. In `update(dt)`, read input, move things in world units, collide them, and update rigs. World axes: x points east, y points south, z points up. One tile is 16 units.
4. In `draw(r)`, call `map.drawFloor(r)`, then `r.shadow(...)`, then `map.queueWalls(r)`. Add characters with `r.actor(...)`, props and effects with `r.queue(...)`, and lights with `game.lights.add(...)`.
5. Check the result in every view (`game.setView(id)`) and with the skeleton overlay on (`rig.debug(r)`).

## Rules
- Keep all game logic in world units. Never store screen pixels.
- Draw only with `CO55.px.*`. Never use `ctx.arc`, `stroke`, `fillText` or gradients on the game buffer; they anti-alias.
- Fade things with dithering (`px.polyDither`, `px.ddisc`, `r.glowDisc`), not with alpha.
- Anything that can overlap something else must go through `r.queue` or `r.actor`, which sort by depth.
- Use `dt` everywhere. `update` runs in fixed steps of about 1/120 s.
- Animate with continuous math (phases, easing, springs), never frame lists.

## Game: `new CO55.Game({ canvas, view, minH=190, maxW=560, maxH=330, bg, input })`
- `view` is one of `'iso'`, `'threequarter'`, `'topdown'`, `'brawler'` or `'side'`.
- Methods:
  - `start({ update(dt), draw(r) })`
  - `setView(id)`
  - `focus(x, y, z)`: the camera target; call it every update.
  - `freeze(seconds)`: hit-stop.
  - `shake(n)`
  - `mouseGround()`: returns `[x, y]` or `null`.
  - `enableGPU({ map })`: returns `gpu`.
- Fields: `timeScale`, `time`, `stats` (`{ updateMs, renderMs, actors, items }`), `particles`, `lights`, `input`, `view`, `cam` (`{ smooth, bounds(view) }`), and `screen.setOptions({ minH, minW, maxW, maxH })`. `CO55.current` is the latest game.

- **Generation Date**: September 2026
- **AI Model**: Gemini
- **Source**: Mega Man 2 (Capcom, NES, 1988)

- [x] **Industrial Factory Atmosphere**: Riveted metal girders, caution safety stripes, rotating background cogs, steamy machinery, and warning beacons mapped across the stage.
- [x] **Conveyor Belts**: Left and right directional conveyor belts with animated chevron treads that shift Mega Man's ground speed and affect jumping momentum.
- [x] **Mole Drill Robots**: Ceiling and floor dispensers spawning spinning drill bots that arc towards the player and can be farmed for energy pickups.
- [x] **Pierrobot on Spiked Gear**: Clown robots perched atop rolling spiked cogs with dual hitboxes (clown can be shot or gear battered).
- [x] **Press Stompers**: Heavy hydraulic crushing anvils that shake the floor when slamming down and punish mistimed runs.
- [x] **Vertical Platforming & Ladders**: Smooth ladder climbing with one-handed shooting mechanics.
- [x] **Double Security Shutter Doors**: Authentic ratcheting two-stage airlock corridor leading into the boss chamber with camera transitions.

- [x] **Pause / Weapons Screen**: Accessible anytime with E-Tank consumption, sound settings, and weapon selection.
- [x] **Stage Clear & Weapon Get Screen**: "YOU GOT METAL BLADE" results presentation with performance ratings and New Game+ replay options.
- [x] **Chiptune Audio Synthesizer**: Complete Web Audio NES APU sound engine recreating Title, Metal Man Stage, Boss Battle, and Victory Fanfare with 12 distinct sound effects.

## 2. Additions Beyond Source
- **Quality Presets**: Auto, High, and Balanced presets dynamically tuning particle limits, dynamic lighting passes, and background complexity.
- **Optional Modern Slide**: Toggleable in pause settings for players who enjoy Mega Man 3+ style mobility.
- **Interactive Diagnostics Overlay**: Real-time display of engine version, view mode, lighting backend, preset, FPS, and frame latency.
- **Touch Screen Gamepad**: Ergonomic on-screen D-pad and circular action buttons on mobile devices.
- **New Game+ / Rematch Mode**: Ability to replay the stage wielding the 8-directional Metal Blade from the outset.

## 3. Excluded Content

// Guide Viewer Logic
(() => {
  const g = document.getElementById('guide'),
        open = v => { g.hidden = !v; if (v) document.getElementById('guideClose').focus(); },
        tabReport = document.getElementById('tabReportBtn'),
        tabApi = document.getElementById('tabApiBtn'),
        textEl = document.getElementById('guideText');

  let curTab = 'report';
  const showTab = t => {
    curTab = t;
    tabReport.setAttribute('aria-pressed', String(t === 'report'));
    tabApi.setAttribute('aria-pressed', String(t === 'api'));
    textEl.textContent = (t === 'report' 
      ? document.getElementById('completion-report').textContent 
      : document.getElementById('co55-api').textContent).trim();
  };

  showTab('report');
  document.getElementById('guideBtn').addEventListener('click', () => { showTab('report'); open(true); });
  document.getElementById('guideClose').addEventListener('click', () => open(false));
  tabReport.addEventListener('click', () => showTab('report'));
  tabApi.addEventListener('click', () => showTab('api'));
  addEventListener('keydown', e => { 
    if (e.key === '?') { open(g.hidden); } 
    else if (e.key === 'Escape' && !g.hidden) { open(false); } 
  });
})();
</script>

/* -------------------------------------------------------------------------

 * ------------------------------------------------------------------------- */
const T = 16;

const MAP_H = 22;
const LEVEL_DATA = new Uint8Array(MAP_W * MAP_H);

// Tile types:
// 0: Empty, 1: Solid Metal Block, 2: Conveyor Left, 3: Conveyor Right,
// 4: Ladder, 5: Hazard Spikes, 6: Pipe Wall, 7: Shutter Door
const TILE = { EMPTY: 0, SOLID: 1, CONV_L: 2, CONV_R: 3, LADDER: 4, SPIKE: 5, PIPE: 6, SHUTTER: 7 };

function buildStage() {
  const set = (x, z, t) => {
    if (x >= 0 && x < MAP_W && z >= 0 && z < MAP_H) LEVEL_DATA[z * MAP_W + x] = t;
  };
  const rect = (x0, z0, w, h, t) => {

  // Ceiling

  rect(29, 0, 2, 2, TILE.SPIKE); // bottomless spike pit

  // High pipe overhang
  rect(36, 12, 14, 2, TILE.PIPE);

  rect(112, 2, 1, 14, TILE.LADDER);
  rect(113, 2, 8, 1, TILE.SOLID);
  rect(104, 15, 16, 1, TILE.SOLID);
  // High alcove holding E-Tank & 1-Up (x: 104..110, z: 16)
  rect(102, 15, 1, 5, TILE.SOLID);

  // Section 6: Press Stomper Gauntlet #2 & Spikes (x: 121..146)
  rect(120, 15, 14, 1, TILE.CONV_R);
  rect(134, 13, 2, 2, TILE.SPIKE);
  rect(136, 15, 12, 1, TILE.CONV_L);

  // Drop down to Boss Gates
  rect(148, 2, 1, 14, TILE.LADDER);
  rect(149, 2, 31, 1, TILE.SOLID);

  // Security Shutter Gates (x: 153 and x: 160)
  rect(153, 3, 1, 4, TILE.SHUTTER);
  rect(160, 3, 1, 4, TILE.SHUTTER);

  // Boss Arena: Metal Man's Gear Chamber (x: 161..179)
  rect(161, 2, 18, 1, TILE.CONV_R);

buildStage();

function getTile(x, z) {
  const tx = Math.floor(x / T), tz = Math.floor(z / T);
  if (tx < 0 || tx >= MAP_W || tz < 0 || tz >= MAP_H) return TILE.SOLID;
  return LEVEL_DATA[tz * MAP_W + tx];
}

/* -------------------------------------------------------------------------
 * SECTION 3: MEGA MAN CONTROLLER & WEAPONS

const player = {
  x: 48, z: 48, vx: 0, vz: 0,

  hp: 28, maxHp: 28,
  weaponEnergy: 28,

function shootPlayer() {
  if (player.state === 'hurt' || player.state === 'spawn' || player.state === 'victory') return;
  const maxActive = player.weapon === 0 ? 3 : 4;
  if (player.bullets.filter(b => b.alive).length >= maxActive) return;

  if (player.weapon === 1) {
    if (player.weaponEnergy <= 0) { audio.sfx('clink'); return; }
    player.weaponEnergy = Math.max(0, player.weaponEnergy - 0.5);
  }

  const sz = player.z + (player.state === 'slide' ? 6 : 14);

  let dirX = player.facing, dirZ = 0;
  if (player.weapon === 1) {
    const inp = game.input;
    const up = inp.down('up'), down = inp.down('down');
    if (up && !inp.down('left') && !inp.down('right')) { dirX = 0; dirZ = 1; }
    else if (down && !inp.down('left') && !inp.down('right')) { dirX = 0; dirZ = -1; }
    else if (up) { dirX = player.facing * 0.707; dirZ = 0.707; }

  player.bullets.push({
    x: sx, z: sz,
    vx: dirX * (player.weapon === 0 ? 290 : 250),
    vz: dirZ * (player.weapon === 0 ? 0 : 250),
    type: player.weapon,
    rot: 0,
    alive: true,
    life: 2.5

function hurtPlayer(dmg, pushDir = 1) {
  if (player.invTimer > 0 || player.state === 'victory' || player.hp <= 0) return;
  player.hp = Math.max(0, player.hp - dmg);
  player.invTimer = 1.6;
  player.hurtTimer = 0.32;
  player.state = 'hurt';
  player.climbing = false;
  player.vx = -pushDir * 80;
  player.vz = 90;
  audio.sfx('hurt');
  game.shake(3.5);
  game.freeze(0.06);

  if (player.hp <= 0) {
    killPlayer();
  }
}

function killPlayer() {
  player.hp = 0;
  player.state = 'hurt';
  audio.sfx('explode');
  game.particles.bits(player.x, 0, player.z + 10, 28, ['#00e8d8', '#004088', '#ffffff', '#ffb800']);
  game.shake(6);
  game.freeze(0.1);
  setTimeout(() => {
    player.lives--;
    if (player.lives >= 0) {
      respawnPlayer();
    } else {
      gameState = 'gameover';
    }
  }, 1200);
}

function respawnPlayer() {
  player.x = 48; player.z = 80;
  player.vx = 0; player.vz = 0;
  player.hp = player.maxHp;
  player.state = 'spawn';
  player.invTimer = 2.0;
  player.climbing = false;
}

/* -------------------------------------------------------------------------
 * SECTION 4: ENEMIES & HAZARDS (MOLES, PIERROBOTS, PRESSES, PICKUPS)

const enemies = [];
const pickups = [];

function spawnMole(x, z, dirZ = -1) {

    type: 'mole',

  });
}

function spawnPierrobot(x, z) {

  });
}

function spawnPress(x, topZ, restZ) {

function spawnPickup(x, z, kind) {

// Initial Level Enemy Layout

initEnemies();

/* -------------------------------------------------------------------------
 * SECTION 5: METAL MAN BOSS AI & ARENA
 * ------------------------------------------------------------------------- */
const boss = {
  x: 174 * T, z: 48,
  vx: 0, vz: 0,
  hp: 28, maxHp: 28,
  active: false,
  state: 'intro', // intro, wait, jump, throw, land, defeat
  facing: -1,
  timer: 0,
  blades: [],
  conveyorDir: 1, // 1 = right, -1 = left
  jumpCount: 0
};

function activateBoss() {
  boss.active = true;
  boss.state = 'intro';
  boss.hp = 0;
  boss.timer = 0;
  audio.playTrack('boss');
}

function updateBoss(dt) {
  if (!boss.active) return;
  boss.timer += dt;

  if (boss.state === 'intro') {
    if (boss.timer > 0.05 && boss.hp < boss.maxHp) {
      boss.hp++;
      boss.timer = 0;
      audio.sfx('bossFill');
    }
    if (boss.hp >= boss.maxHp && boss.timer > 0.4) {
      boss.state = 'wait';
      boss.timer = 0;
    }
    return;
  }

  if (boss.state === 'defeat') {
    if (Math.random() < 0.4) {
      game.particles.sparks(boss.x + (Math.random() - .5) * 20, 0, boss.z + 12 + (Math.random() - .5) * 16, 5, null, { color: '#ffea40' });
    }
    return;
  }

  boss.facing = player.x < boss.x ? -1 : 1;

  // React to player shooting by jumping!
  if (boss.state === 'wait') {
    const playerJustShot = player.shootTimer > 0.18;
    if (playerJustShot || boss.timer > 2.0) {
      boss.state = 'jump';
      boss.vz = 260;
      boss.vx = (player.x > boss.x ? 1 : -1) * 35;
      boss.timer = 0;
      audio.sfx('jump');
    }
  } else if (boss.state === 'jump') {
    boss.vz -= 680 * dt;
    boss.z += boss.vz * dt;
    boss.x += boss.vx * dt;

    // Peak of jump: throw Metal Blade
    if (boss.vz <= 60 && boss.timer > 0.25 && boss.state !== 'throw') {
      boss.state = 'throw';
      throwBossBlade();
    }
  } else if (boss.state === 'throw') {
    boss.vz -= 680 * dt;
    boss.z += boss.vz * dt;
    boss.x += boss.vx * dt;

    if (boss.z <= 48) {
      boss.z = 48;
      boss.vz = 0;
      boss.vx = 0;
      boss.state = 'land';
      boss.timer = 0;
      audio.sfx('land');
      // Flip arena conveyor direction every 2 jumps!
      boss.jumpCount++;
      if (boss.jumpCount % 2 === 0) {
        boss.conveyorDir = -boss.conveyorDir;
      }
    }
  } else if (boss.state === 'land') {
    if (boss.timer > 0.35) {
      boss.state = 'wait';
      boss.timer = 0;
    }
  }

  // Update Boss Metal Blades
  for (const b of boss.blades) {
    if (!b.alive) continue;
    b.x += b.vx * dt;
    b.z += b.vz * dt;
    b.rot += 18 * dt;
    if (b.x < 155 * T || b.x > 180 * T || b.z < 32 || b.z > 220) b.alive = false;

    // Hit Mega Man
    if (Math.hypot(b.x - player.x, b.z - (player.z + 10)) < 12) {
      hurtPlayer(4, Math.sign(b.vx));
      b.alive = false;
    }
  }
}

function throwBossBlade() {
  const dx = player.x - boss.x, dz = (player.z + 8) - (boss.z + 12);
  const dist = Math.hypot(dx, dz) || 1;
  const spd = 210;
  boss.blades.push({
    x: boss.x + boss.facing * 10,
    z: boss.z + 12,
    vx: (dx / dist) * spd,
    vz: (dz / dist) * spd,
    rot: 0,
    alive: true
  });
  audio.sfx('blade');
}

function hurtBoss(dmg) {
  if (boss.hp <= 0 || boss.state === 'intro') return;
  boss.hp = Math.max(0, boss.hp - dmg);
  audio.sfx('enemyHit');
  game.freeze(0.04);
  game.shake(2);

  if (boss.hp <= 0) {
    boss.state = 'defeat';
    audio.sfx('explode');
    audio.playTrack('victory');
    game.particles.bits(boss.x, 0, boss.z + 14, 30, ['#e01020', '#ffd000', '#ffffff', '#606060']);
    setTimeout(() => {
      gameState = 'victory';
      player.hasMetalBlade = true;
    }, 2800);
  }
}

/* -------------------------------------------------------------------------
 * SECTION 6: GAME LOOP: UPDATE, CAMERA, SHUTTER TRANSITIONS
 * ------------------------------------------------------------------------- */
const game = new E.Game({
  canvas: document.getElementById('screen'),
  view: 'side',
  minH: 210,
  maxW: 520,
  bg: '#05040a'
});

let gameState = 'title'; // title, play, paused, victory, gameover
let shutterState = 'none'; // none, gate1_open, gate1_walk, gate2_open, gate2_walk
let shutterTimer = 0;
let moleSpawnTimer = 0;
let qualityPreset = 'High'; // High, Balanced, Auto
let showDiagnostics = false;
let modernSlideEnabled = true;

function updatePhysics(dt) {
  const inp = game.input;

  // 1. Horizontal Movement & Conveyor Drag
  let moveX = 0;
  if (inp.down('left')) { moveX -= 1; player.facing = -1; }
  if (inp.down('right')) { moveX += 1; player.facing = 1; }

  // Detect ground tile beneath feet
  const footTile = getTile(player.x, player.z - 1);
  const onConvL = footTile === TILE.CONV_L;
  const onConvR = footTile === TILE.CONV_R;
  player.onConveyor = onConvL ? -50 : onConvR ? 50 : 0;
  if (boss.active && footTile >= TILE.CONV_L && footTile <= TILE.CONV_R) {
    player.onConveyor = boss.conveyorDir * 50;
  }

  if (player.state === 'slide') {
    player.slideTimer -= dt;
    player.vx = player.facing * 165 + player.onConveyor * 0.4;
    if (player.slideTimer <= 0 || inp.buffered('jump')) {
      player.state = 'stand';
    }
  } else if (!player.climbing) {
    const runSpeed = 85;
    player.vx = moveX * runSpeed + player.onConveyor;
  }

  // 2. Slide Activation
  if (modernSlideEnabled && inp.buffered('dash') && player.onGround && player.state !== 'slide') {
    inp.consume('dash');
    player.state = 'slide';
    player.slideTimer = 0.28;
    audio.sfx('jump');
    game.particles.dust(player.x, 0, player.z, 3);
  }

  // 3. Jump & Gravity
  const grav = 680;
  if (!player.climbing) {
    if (inp.buffered('jump') && player.onGround && player.state !== 'slide') {
      inp.consume('jump');
      player.vz = 245;
      player.onGround = false;
      player.state = 'jump';
      audio.sfx('jump');
    }
    // Variable jump height cut
    if (!inp.down('jump') && player.vz > 90) {
      player.vz *= 0.55;
    }

    player.vz -= grav * dt;
    player.z += player.vz * dt;
  }

  // 4. Horizontal Integration & Wall Collision
  player.x += player.vx * dt;
  const bodyR = 6;
  if (getTile(player.x - bodyR, player.z + 8) === TILE.SOLID || getTile(player.x - bodyR, player.z + 16) === TILE.SOLID) {
    player.x = (Math.floor((player.x - bodyR) / T) + 1) * T + bodyR;
  }
  if (getTile(player.x + bodyR, player.z + 8) === TILE.SOLID || getTile(player.x + bodyR, player.z + 16) === TILE.SOLID) {
    player.x = Math.floor((player.x + bodyR) / T) * T - bodyR;
  }

  // 5. Floor & Ceiling Vertical Collision
  if (!player.climbing) {
    if (player.vz <= 0) {
      const tileL = getTile(player.x - 4, player.z);
      const tileR = getTile(player.x + 4, player.z);
      const isSolidBelow = (tileL >= 1 && tileL <= 3) || (tileR >= 1 && tileR <= 3);
      if (isSolidBelow && player.z % T <= 6) {
        player.z = Math.floor(player.z / T) * T;
        player.vz = 0;
        if (!player.onGround) audio.sfx('land');
        player.onGround = true;
        if (player.state === 'jump') player.state = 'stand';
      } else {
        player.onGround = false;
      }
    } else {
      player.onGround = false;
      if (getTile(player.x, player.z + 22) === TILE.SOLID) {
        player.vz = 0;
      }
    }
  }

  // 6. Ladder Climbing Interaction
  const curTile = getTile(player.x, player.z + 8);
  if (curTile === TILE.LADDER) {
    if (inp.down('up') || inp.down('down')) {
      player.climbing = true;
      player.ladderX = Math.floor(player.x / T) * T + 8;
      player.x = player.ladderX;
      player.vx = 0;
      player.vz = inp.down('up') ? 60 : -60;
      player.z += player.vz * dt;
      player.state = 'climb';
    }
  } else if (player.climbing) {
    player.climbing = false;
    player.state = 'stand';
  }

  // 7. Hazard Spikes Instant Damage
  if (getTile(player.x, player.z) === TILE.SPIKE) {
    hurtPlayer(28, player.facing);
  }

  // 8. Shooting Input
  if (inp.buffered('attack', 0.16)) {
    inp.consume('attack');
    shootPlayer();
  }

  // 9. Timers & Weapon Bullets
  if (player.shootTimer > 0) player.shootTimer -= dt;
  if (player.invTimer > 0) player.invTimer -= dt;
  if (player.hurtTimer > 0) {
    player.hurtTimer -= dt;
    if (player.hurtTimer <= 0) player.state = 'stand';
  }

  for (const b of player.bullets) {
    if (!b.alive) continue;
    b.x += b.vx * dt;
    b.z += b.vz * dt;
    b.rot += 20 * dt;
    b.life -= dt;
    if (b.life <= 0 || getTile(b.x, b.z) === TILE.SOLID) {
      b.alive = false;
      game.particles.sparks(b.x, 0, b.z, 3, null, { color: '#ffff60' });
    }
    // Collide with enemies
    for (const e of enemies) {
      if (!e.alive) continue;
      if (Math.hypot(b.x - e.x, b.z - (e.z + 8)) < 12) {
        e.hp -= (b.type === 1 ? 3 : 1);
        b.alive = (b.type === 1); // Metal Blade pierces!
        audio.sfx('enemyHit');
        game.particles.sparks(e.x, 0, e.z + 8, 4);
        if (e.hp <= 0) {
          e.alive = false;
          audio.sfx('explode');
          game.particles.bits(e.x, 0, e.z + 8, 12, ['#ffffff', '#ff9900', '#00e8d8']);
          if (Math.random() < 0.45) {
            spawnPickup(e.x, e.z, Math.random() < 0.6 ? 'smallEnergy' : 'largeEnergy');
          }
        }
      }
    }
    // Collide with Boss
    if (boss.active && boss.hp > 0) {
      if (Math.hypot(b.x - boss.x, b.z - (boss.z + 14)) < 14) {
        hurtBoss(b.type === 1 ? 4 : 1);
        b.alive = false;
      }
    }
  }

  // 10. Mole Spawners (in Section 2 & Core Run)
  moleSpawnTimer += dt;
  if (moleSpawnTimer > 1.4) {
    moleSpawnTimer = 0;
    if (player.x > 32 * T && player.x < 52 * T) {
      spawnMole(player.x + (Math.random() - .5) * 40, 11 * T, -1);
    }
  }

  // Update Enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.type === 'mole') {
      e.z += e.vz * dt;
      if (e.z <= 2.5 * T) {
        e.vz = 0;
        e.vx = e.facing * 65;
        e.x += e.vx * dt;
      }
      if (Math.hypot(e.x - player.x, e.z - player.z) < 12) hurtPlayer(3, e.facing);
    } else if (e.type === 'pierrobot') {
      e.rot += (e.vx / 10) * dt;
      e.x += e.vx * dt;
      if (getTile(e.x - 8, e.z + 4) === TILE.SOLID || e.x < 50 * T) e.vx = -e.vx;
      if (Math.hypot(e.x - player.x, e.z - player.z) < 14) hurtPlayer(4, Math.sign(e.vx));
    } else if (e.type === 'press') {
      e.timer += dt;
      if (e.state === 'wait') {
        if (Math.abs(player.x - e.x) < 28 && e.timer > 0.4) {
          e.state = 'drop';
          e.timer = 0;
        }
      } else if (e.state === 'drop') {
        e.z -= 320 * dt;
        if (e.z <= e.restZ) {
          e.z = e.restZ;
          e.state = 'rest';
          e.timer = 0;
          game.shake(2.5);
          audio.sfx('land');
          game.particles.dust(e.x, 0, e.z, 6);
        }
      } else if (e.state === 'rest') {
        if (e.timer > 0.5) e.state = 'rise';
      } else if (e.state === 'rise') {
        e.z += 65 * dt;
        if (e.z >= e.topZ) {
          e.z = e.topZ;
          e.state = 'wait';
          e.timer = 0;
        }
      }
      // Press crush collision
      if (Math.abs(player.x - e.x) < 14 && player.z >= e.z - 4 && player.z <= e.z + 20) {
        hurtPlayer(e.state === 'drop' ? 14 : 5, player.facing);
      }
    }
  }

  // Update Pickups
  for (const p of pickups) {
    if (!p.alive) continue;
    p.life -= dt;
    if (p.life <= 0) p.alive = false;
    if (Math.hypot(p.x - player.x, p.z - (player.z + 8)) < 12) {
      p.alive = false;
      if (p.kind === 'smallEnergy') { player.hp = Math.min(player.maxHp, player.hp + 3); audio.sfx('energy'); }
      else if (p.kind === 'largeEnergy') { player.hp = Math.min(player.maxHp, player.hp + 10); audio.sfx('energy'); }
      else if (p.kind === 'etank') { player.eTanks++; audio.sfx('oneUp'); }
      else if (p.kind === 'oneup') { player.lives++; audio.sfx('oneUp'); }
    }
  }

  // 11. Shutter Gates Sequence (x: 153 -> 160)
  if (shutterState === 'none') {
    if (player.x >= 152 * T && player.x < 154 * T) {
      shutterState = 'gate1_open';
      shutterTimer = 0;
      audio.sfx('door');
    }
  } else if (shutterState === 'gate1_open') {
    shutterTimer += dt;
    if (shutterTimer > 0.45) shutterState = 'gate1_walk';
  } else if (shutterState === 'gate1_walk') {
    player.x += 40 * dt;
    if (player.x >= 157 * T) {
      shutterState = 'gate2_open';
      shutterTimer = 0;
      audio.sfx('door');
    }
  } else if (shutterState === 'gate2_open') {
    shutterTimer += dt;
    if (shutterTimer > 0.45) shutterState = 'gate2_walk';
  } else if (shutterState === 'gate2_walk') {
    player.x += 40 * dt;
    if (player.x >= 163 * T) {
      shutterState = 'in_arena';
      activateBoss();
    }
  }

  // Boss Logic
  updateBoss(dt);
}

function update(dt) {
  if (gameState === 'title') {
    if (game.input.buffered('attack') || game.input.buffered('jump')) {
      audio.init();
      audio.playTrack('stage');
      gameState = 'play';
    }
    return;
  }
  if (gameState === 'paused') {
    if (game.input.buffered('dash') && player.eTanks > 0 && player.hp < player.maxHp) {
      player.eTanks--;
      player.hp = player.maxHp;
      audio.sfx('energy');
    }
    return;
  }

  updatePhysics(dt);

  // Dynamic Camera Tracking
  let targetCamX = player.x;
  let targetCamZ = Math.max(70, player.z + 18);
  if (boss.active) {
    targetCamX = 170 * T;
    targetCamZ = 6 * T;
  }
  game.focus(targetCamX, 0, targetCamZ);
}

/* -------------------------------------------------------------------------
 * SECTION 7: RENDERER: PROCEDURAL PIXELS, PALETTES, RIGS, & HUD
 * ------------------------------------------------------------------------- */
function drawMegaMan(g, ox, oy) {
  const f = player.facing;
  const isBlade = player.weapon === 1;
  const colArmor = isBlade ? '#c87010' : '#00e8d8';
  const colTrim  = isBlade ? '#783808' : '#004088';
  const colSkin  = '#ffcca0';
  const colWhite = '#ffffff';

  // Flashing on invulnerability
  if (player.invTimer > 0 && Math.floor(game.real * 24) % 2 === 0) return;

  if (player.state === 'slide') {
    // Sliding compressed pose
    px.rect(g, ox - f * 8, oy - 8, 16, 8, colTrim);
    px.rect(g, ox - f * 4, oy - 12, 12, 6, colArmor);
    px.disc(g, ox + f * 6, oy - 7, 5, colTrim);
    px.rect(g, ox + f * 7, oy - 8, 3, 3, colSkin);
    return;
  }

  // Legs & Boots
  const step = Math.sin(game.real * 18);
  const legOff1 = (player.state === 'run') ? step * 4 : 0;
  const legOff2 = (player.state === 'run') ? -step * 4 : 0;
  px.rect(g, ox - 4 + legOff1, oy - 6, 4, 6, colTrim);
  px.rect(g, ox + 1 + legOff2, oy - 6, 4, 6, colTrim);

  // Torso
  px.rect(g, ox - 5, oy - 14, 10, 8, colArmor);
  px.rect(g, ox - 3, oy - 12, 6, 4, colTrim);

  // Head & Helmet
  px.disc(g, ox, oy - 18, 6.5, colTrim);
  px.rect(g, ox - 2, oy - 23, 4, 3, colArmor); // Crest
  px.rect(g, ox + (f > 0 ? 0 : -4), oy - 19, 5, 5, colSkin); // Face
  px.rect(g, ox + (f > 0 ? 2 : -3), oy - 18, 1, 2, '#000000'); // Eye

  // Buster Arm
  if (player.shootTimer > 0) {
    px.rect(g, ox + f * 5, oy - 15, 8, 4, colTrim);
    px.rect(g, ox + f * 12, oy - 16, 2, 6, '#ffe000'); // Muzzle flash
  } else {
    px.rect(g, ox + f * 4, oy - 13, 4, 6, colArmor);
  }
}

function drawMetalMan(g, ox, oy) {
  const f = boss.facing;
  const cRed = '#d81820', cBurgundy = '#680810', cGold = '#f0c000';

  if (boss.hp <= 0 && Math.floor(game.real * 20) % 2 === 0) return;

  // Legs
  px.rect(g, ox - 5, oy - 8, 4, 8, cBurgundy);
  px.rect(g, ox + 2, oy - 8, 4, 8, cBurgundy);

  // Torso
  px.rect(g, ox - 6, oy - 17, 12, 9, cRed);
  px.rect(g, ox - 3, oy - 15, 6, 5, cGold);

  // Helmet & Saw Crest
  px.disc(g, ox, oy - 22, 7, cRed);
  px.rect(g, ox - 1, oy - 29, 2, 7, '#e0e0e0'); // Sawblade crest
  px.rect(g, ox - 4, oy - 31, 8, 2, '#ffffff');
  px.rect(g, ox + (f > 0 ? 0 : -5), oy - 23, 5, 4, '#ffb880'); // Face
  px.rect(g, ox + (f > 0 ? 2 : -3), oy - 22, 1, 1, '#ffff00'); // Glowing eye

  // Arm & Blade Ready
  if (boss.state === 'throw') {
    px.rect(g, ox - 2, oy - 34, 4, 10, cRed);
    px.disc(g, ox, oy - 36, 6, '#ffd000');
  } else {
    px.rect(g, ox + f * 6, oy - 16, 4, 7, cRed);
  }
}

function draw(r) {
  const g = r.ctx;

  // 1. Parallax Industrial Background
  const camX = r.ix / 1.5;
  r.queue(camX, -50, 60, () => {
    // Distant Factory Silhouettes
    for (let i = 0; i < 8; i++) {
      const bx = (i * 90 - (camX * 0.25) % 90);
      px.rect(g, bx, r.H - 140, 60, 140, '#0c0c18');
      px.rect(g, bx + 12, r.H - 160, 14, 20, '#0c0c18'); // smokestacks
    }
    // Rotating Giant Background Cogs
    const cogRot = game.real * 0.8;
    const [cgX, cgY] = r.w(camX + 60, -20, 120);
    px.disc(g, cgX, cgY, 28, '#141424');
    for (let a = 0; a < 8; a++) {
      const ang = cogRot + a * (Math.PI / 4);
      px.rect(g, cgX + Math.cos(ang) * 26 - 3, cgY + Math.sin(ang) * 26 - 3, 6, 6, '#18182c');
    }
  });

  // 2. Foreground Level Tile Blocks
  const x0 = Math.max(0, Math.floor((camX - 160) / T));
  const x1 = Math.min(MAP_W, Math.ceil((camX + 220) / T));
  for (let z = 0; z < MAP_H; z++) {
    for (let x = x0; x < x1; x++) {
      const tile = LEVEL_DATA[z * MAP_W + x];
      if (tile === TILE.EMPTY) continue;
      const wx = x * T, wz = z * T;
      r.queue(wx, 0, wz, () => {
        const [sx, sy] = r.w(wx, 0, wz);
        if (tile === TILE.SOLID || tile === TILE.PIPE) {
          px.rect(g, sx, sy - 24, 24, 24, '#24243a');
          px.rect(g, sx + 2, sy - 22, 20, 20, '#363654');
          px.dot(g, sx + 3, sy - 21, '#66668a'); // rivets
          px.dot(g, sx + 19, sy - 21, '#66668a');
          px.dot(g, sx + 3, sy - 5, '#66668a');
          px.dot(g, sx + 19, sy - 5, '#66668a');
        } else if (tile === TILE.CONV_L || tile === TILE.CONV_R) {
          // Conveyor Belt with animated chevron rollers
          px.rect(g, sx, sy - 24, 24, 24, '#1b1b2a');
          px.rect(g, sx, sy - 24, 24, 6, '#e09800'); // caution yellow edge
          const shift = Math.floor(game.real * (tile === TILE.CONV_L ? -24 : 24)) % 12;
          for (let k = -1; k < 3; k++) {
            px.line(g, sx + k * 12 + shift, sy - 23, sx + k * 12 + 6 + shift, sy - 19, '#000', 1);
          }
        } else if (tile === TILE.LADDER) {
          px.rect(g, sx + 4, sy - 24, 2, 24, '#4890c0');
          px.rect(g, sx + 18, sy - 24, 2, 24, '#4890c0');
          for (let r = 0; r < 24; r += 6) px.rect(g, sx + 4, sy - 24 + r, 16, 2, '#70c0f0');
        } else if (tile === TILE.SPIKE) {
          for (let sp = 0; sp < 3; sp++) {
            px.poly(g, [[sx + sp * 8, sy], [sx + sp * 8 + 4, sy - 14], [sx + sp * 8 + 8, sy]], '#d8d8e8');
          }
        } else if (tile === TILE.SHUTTER) {
          px.rect(g, sx, sy - 24, 24, 24, '#485068');
          for (let s = 0; s < 4; s++) px.rect(g, sx + 2, sy - 22 + s * 6, 20, 4, '#1c202c');
        }
      });
    }
  }

  // 3. Actors: Mega Man, Metal Man, Enemies, Pickups
  if (player.hp > 0 && gameState !== 'title') {
    r.actor(player.x, 10, player.z, (ag, ox, oy) => drawMegaMan(ag, ox, oy));
  }

  if (boss.active) {
    r.actor(boss.x, 10, boss.z, (ag, ox, oy) => drawMetalMan(ag, ox, oy));
    // Draw Boss Blades
    for (const b of boss.blades) {
      if (!b.alive) continue;
      r.queue(b.x, 12, b.z, () => {
        const [bx, by] = r.w(b.x, 0, b.z);
        px.disc(g, bx, by, 6, '#ffd000');
        px.rect(g, bx - 1, by - 1, 3, 3, '#ffffff');
      });
    }
  }

  // Player Bullets
  for (const b of player.bullets) {
    if (!b.alive) continue;
    r.queue(b.x, 12, b.z, () => {
      const [bx, by] = r.w(b.x, 0, b.z);
      if (b.type === 0) {
        px.disc(g, bx, by, 3, '#ffff80');
        px.disc(g, bx, by, 1.5, '#ffffff');
      } else {
        px.disc(g, bx, by, 5, '#e07000');
        px.disc(g, bx, by, 2, '#ffffff');
      }
    });
  }

  // Enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    r.queue(e.x, 8, e.z, () => {
      const [ex, ey] = r.w(e.x, 0, e.z);
      if (e.type === 'mole') {
        px.rect(g, ex - 4, ey - 10, 8, 10, '#b07030');
        px.poly(g, [[ex - 3, ey - 10], [ex, ey - 15], [ex + 3, ey - 10]], '#e0e0e8'); // drill bit
        px.dot(g, ex + (e.facing > 0 ? 2 : -2), ey - 6, '#ff0000');
      } else if (e.type === 'pierrobot') {
        px.disc(g, ex, ey - 8, 9, '#506078'); // gear
        px.disc(g, ex, ey - 8, 3, '#ffffff');
        px.disc(g, ex, ey - 22, 6, '#ffffff'); // clown head
        px.dot(g, ex, ey - 21, '#ff0000'); // red nose
        px.poly(g, [[ex - 4, ey - 27], [ex, ey - 33], [ex + 4, ey - 27]], '#00d8f0'); // hat
      } else if (e.type === 'press') {
        px.rect(g, ex - 2, ey - 40, 4, 30, '#8890a0'); // piston rod
        px.rect(g, ex - 14, ey - 18, 28, 18, '#303848'); // anvil head
        // hazard yellow bottom
        for (let hz = 0; hz < 28; hz += 8) px.rect(g, ex - 14 + hz, ey - 4, 4, 4, '#f0c000');
      }
    });
  }

  // Pickups
  for (const p of pickups) {
    if (!p.alive) continue;
    r.queue(p.x, 5, p.z, () => {
      const [pxx, pyy] = r.w(p.x, 0, p.z);
      if (p.kind === 'smallEnergy') px.disc(g, pxx, pyy, 3, '#ffe040');
      else if (p.kind === 'largeEnergy') px.disc(g, pxx, pyy, 5, '#ffe040');
      else if (p.kind === 'etank') {
        px.rect(g, pxx - 5, pyy - 8, 10, 8, '#00d8f0');
        E.font.text(g, 'E', pxx - 2, pyy - 7, '#ffffff');
      } else if (p.kind === 'oneup') {
        px.disc(g, pxx, pyy - 4, 5, '#004088');
        px.rect(g, pxx - 2, pyy - 4, 4, 3, '#ffcc99');
      }
    });
  }

  // 4. Overlays & HUD (Authentic NES 28-Segment Bars)
  r.overlay(og => {
    if (gameState === 'title') {
      // Title Screen Screen Art
      px.rect(og, 0, 0, r.W, r.H, '#06050e');
      E.font.text(og, 'MEGA MAN II', r.W / 2 - 28, 48, '#00e8d8');
      E.font.text(og, 'TITANIUM CIRCUIT', r.W / 2 - 38, 62, '#ffe040');
      E.font.text(og, 'PRESS FIRE OR JUMP TO START', r.W / 2 - 62, 115, '#ffffff');
      E.font.text(og, 'MISSION: INFILTRATE METAL MAN STAGE', r.W / 2 - 76, 142, '#ab9dc0');
      E.font.text(og, 'SEP 2026 / GEMINI / CO55 V0.4.0', r.W / 2 - 64, r.H - 18, '#55506a');
      return;
    }

    if (gameState === 'victory') {
      px.rect(og, 16, 16, r.W - 32, r.H - 32, '#0c1024');
      px.rect(og, 18, 18, r.W - 36, r.H - 36, '#060812');
      E.font.text(og, 'YOU GOT METAL BLADE!', r.W / 2 - 46, 36, '#ffe040');
      // Giant Spinning Metal Blade in Center
      const [cx, cy] = [r.W / 2, 75];
      px.disc(og, cx, cy, 18, '#e07000');
      px.disc(og, cx, cy, 6, '#ffffff');
      E.font.text(og, '8-DIRECTIONAL HIGH-SPEED CUTTER', r.W / 2 - 64, 112, '#00e8d8');
      E.font.text(og, 'PRESS ESC TO PLAY AGAIN (NEW GAME+)', r.W / 2 - 74, 145, '#ffffff');
      return;
    }

    if (gameState === 'gameover') {
      px.rect(og, 0, 0, r.W, r.H, '#000');
      E.font.text(og, 'GAME OVER', r.W / 2 - 20, 80, '#e01020');
      E.font.text(og, 'PRESS JUMP TO RETRY', r.W / 2 - 42, 110, '#ffffff');
      if (game.input.buffered('jump')) {
        player.lives = 3;
        player.score = 0;
        respawnPlayer();
        initEnemies();
        boss.active = false;
        shutterState = 'none';
        gameState = 'play';
      }
      return;
    }

    // Health Bar (Left)
    const barX = 14, barY = 16;
    px.rect(og, barX - 1, barY - 1, 8, 60, '#000000');
    for (let i = 0; i < 28; i++) {
      const c = (i < player.hp) ? '#f0c000' : '#222222';
      px.rect(og, barX, barY + 56 - i * 2, 6, 1, c);
    }
    E.font.text(og, 'P', barX + 1, barY + 62, '#00e8d8');

    // Weapon Energy Bar
    if (player.hasMetalBlade) {
      const wBarX = 26;
      px.rect(og, wBarX - 1, barY - 1, 8, 60, '#000000');
      for (let i = 0; i < 28; i++) {
        const c = (i < player.weaponEnergy) ? '#c87010' : '#222222';
        px.rect(og, wBarX, barY + 56 - i * 2, 6, 1, c);
      }
      E.font.text(og, 'M', wBarX + 1, barY + 62, '#ffe040');
    }

    // Boss Health Bar (Right)
    if (boss.active) {
      const bBarX = r.W - 20;
      px.rect(og, bBarX - 1, barY - 1, 8, 60, '#000000');
      for (let i = 0; i < 28; i++) {
        const c = (i < boss.hp) ? '#e01020' : '#222222';
        px.rect(og, bBarX, barY + 56 - i * 2, 6, 1, c);
      }
      E.font.text(og, 'B', bBarX + 1, barY + 62, '#ff4040');
    }

    // Status Counters (Top Center)
    E.font.text(og, 'LIVES ' + player.lives, r.W / 2 - 34, 8, '#ffffff');
    E.font.text(og, 'E ' + player.eTanks, r.W / 2 + 18, 8, '#00d8f0');

    // Pause Screen Overlay
    if (gameState === 'paused') {
      px.rect(og, 28, 28, r.W - 56, r.H - 56, '#060614');
      px.rect(og, 30, 30, r.W - 60, r.H - 60, '#101428');
      E.font.text(og, 'PAUSE / WEAPONS', r.W / 2 - 32, 42, '#ffe040');
      E.font.text(og, '1: MEGA BUSTER [EQUIPPED]', 42, 64, player.weapon === 0 ? '#00e8d8' : '#888');
      E.font.text(og, player.hasMetalBlade ? '2: METAL BLADE' : '2: LOCKED', 42, 78, player.weapon === 1 ? '#ffe040' : '#888');
      E.font.text(og, 'E-TANK (PRESS SLIDE TO USE): ' + player.eTanks, 42, 98, '#00d8f0');
      E.font.text(og, 'PRESS ESC TO RESUME', r.W / 2 - 42, 130, '#ffffff');
    }

    // Small Diagnostics Overlay
    if (showDiagnostics) {
      px.rect(og, 6, r.H - 34, 150, 28, 'rgba(0,0,0,0.85)');
      E.font.text(og, 'CO55 V0.4.0 (SIDE VIEW)', 10, r.H - 30, '#00e8d8');
      E.font.text(og, 'PRESET: ' + qualityPreset + ' (' + game.fps + ' FPS)', 10, r.H - 20, '#ffffff');
      E.font.text(og, 'TIME: ' + game.stats.frameMs.toFixed(1) + 'MS', 10, r.H - 10, '#ab9dc0');
    }
  });
}

/* -------------------------------------------------------------------------
 * SECTION 8: MENUS, PRESETS, & INPUT BINDINGS
 * ------------------------------------------------------------------------- */
const $ = id => document.getElementById(id);

function togglePause() {
  if (gameState === 'play') {
    gameState = 'paused';
    audio.sfx('pause');
  } else if (gameState === 'paused') {
    gameState = 'play';
    audio.sfx('pause');
  } else if (gameState === 'victory') {
    // Restart in New Game+ with Metal Blade equipped!
    player.weapon = 1;
    player.hasMetalBlade = true;
    player.hp = player.maxHp;
    respawnPlayer();
    initEnemies();
    boss.active = false;
    shutterState = 'none';
    gameState = 'play';
    audio.playTrack('stage');
  }
}

$('pauseBtn').addEventListener('click', togglePause);

$('presetBtn').addEventListener('click', () => {
  if (qualityPreset === 'High') {
    qualityPreset = 'Balanced';
    game.particles.max = 100;
  } else if (qualityPreset === 'Balanced') {
    qualityPreset = 'Auto';
  } else {
    qualityPreset = 'High';
    game.particles.max = 350;
  }
  $('presetBtn').textContent = 'Preset: ' + qualityPreset;
});

$('audioBtn').addEventListener('click', () => {
  audio.init();
  const m = !audio.muted;
  audio.setMute(m);
  $('audioBtn').setAttribute('aria-pressed', String(!m));$('audioBtn').textContent = 'Audio: ' + (!m ? 'ON' : 'OFF');
});

$('diagBtn').addEventListener('click', () => {
  showDiagnostics = !showDiagnostics;
  $('diagBtn').setAttribute('aria-pressed', String(showDiagnostics));
});

// Weapon Switching & Hotkeys
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'KeyM') $('audioBtn').click();
  else if (e.code === 'KeyP') $('presetBtn').click();
  else if (e.code === 'Escape' || e.code === 'Enter') togglePause();
  else if (e.code === 'KeyQ' || e.code === 'KeyE') {
    if (player.hasMetalBlade) {
      player.weapon = player.weapon === 0 ? 1 : 0;
      audio.sfx('pause');
    }
  } else if (e.code === 'Digit1') {
    player.weapon = 0;
  } else if (e.code === 'Digit2' && player.hasMetalBlade) {
    player.weapon = 1;
    audio.sfx('pause');
  }
});

game.input.bindButtons(document);
game.start({ update, draw });

// Expose state for diagnostics and headless verification
window.__megaman = { player, boss, enemies, audio, game };
})();
/* =============================== GAME END =============================== */
</script>
</body>
</html>
