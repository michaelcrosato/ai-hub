<script type="module">
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (current, target, lambda, dt) => current + (target - current) * (1 - Math.exp(-lambda * dt));
const angleDelta = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));

const BALANCE = Object.freeze({
  playerSpeed: 13.2,
  maxHp: 100,
  cannonDamage: 18,
  cannonInterval: 0.17,
  rocketDamage: 76,
  rocketBlast: 5.4,
  rockets: 3,
  level2XP: 110,
  level3XP: 220,
  rescueXP: 55,
  killXP: { infantry: 12, turret: 22, buggy: 28, boss: 160 }
});

const ENEMY_BALANCE = Object.freeze({
  infantry: Object.freeze({hp:34,speed:3.1,range:15,rate:1.4,damage:7,radius:.65}),
  turret: Object.freeze({hp:70,speed:0,range:22,rate:1.15,damage:10,radius:1.15}),
  buggy: Object.freeze({hp:92,speed:4.2,range:18,rate:.9,damage:10,radius:1.35}),
  boss: Object.freeze({hp:360,speed:2.2,range:28,rate:.9,damage:9,radius:2.3})
});

class AudioBus {
  constructor() { this.ctx = null; this.master = null; this.lastShot = 0; }
  unlock() {
    if (this.ctx) { this.ctx.resume?.(); return; }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.19;
    this.master.connect(this.ctx.destination);
  }
  tone(freq, duration, type = 'square', gain = 0.08, slide = 0) {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const now = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, now);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), now + duration);
    g.gain.setValueAtTime(gain, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    o.connect(g); g.connect(this.master);
    o.start(now); o.stop(now + duration);
  }
  shot() {
    const t = performance.now(); if (t - this.lastShot < 48) return; this.lastShot = t;
    this.tone(165, .045, 'square', .05, -80);
  }
  rocket() { this.tone(110, .16, 'sawtooth', .08, -70); }
  hit() { this.tone(88, .08, 'square', .06, 40); }
  rescue() { this.tone(440, .08, 'square', .06, 160); setTimeout(() => this.tone(660, .12, 'square', .05, 120), 80); }
  upgrade() { this.tone(330, .08, 'square', .05, 100); setTimeout(() => this.tone(520, .16, 'triangle', .05, 200), 70); }
  boom() { this.tone(72, .24, 'sawtooth', .09, -35); }
  hurt() { this.tone(95, .11, 'square', .075, -40); }
  complete() {
    [330, 440, 550, 740].forEach((f, i) => setTimeout(() => this.tone(f, .18, 'square', .05, 100), i * 110));
  }
}

class Input {
  constructor(ui) {
    this.ui = ui;
    this.keys = new Set();
    this.move = { x: 0, y: 0 };
    this.fire = false;
    this.rocket = false;
    this.pointer = { x: 0, y: 0, active: false };
    this.zoomDelta = 0;
    this.touchPointers = new Map();
    this.stickId = null;
    this.stickOrigin = { x: 0, y: 0 };
    this.pinchDistance = null;

    addEventListener('keydown', e => { this.keys.add(e.code); if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
    addEventListener('keyup', e => this.keys.delete(e.code));
    addEventListener('blur', () => { this.keys.clear(); this.fire = false; this.rocket = false; });
    addEventListener('wheel', e => { this.zoomDelta += Math.sign(e.deltaY) * .08; }, { passive: true });

    const root = document.getElementById('app');
    root.addEventListener('pointermove', e => {
      if (e.pointerType === 'mouse') {
        this.pointer.x = (e.clientX / innerWidth) * 2 - 1;
        this.pointer.y = -(e.clientY / innerHeight) * 2 + 1;
        this.pointer.active = true;
      }
      if (this.touchPointers.has(e.pointerId)) {
        this.touchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        this.updatePinch();
      }
      if (e.pointerId === this.stickId) this.updateStick(e.clientX, e.clientY);
    });
    root.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button === 0 && !e.target.closest('button')) this.fire = true;
      if (e.pointerType === 'touch' && !e.target.closest('#stickZone') && !e.target.closest('.action')) {
        this.touchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        this.updatePinch();
      }
    });
    const release = e => {
      if (e.pointerType === 'mouse' && e.button === 0) this.fire = false;
      this.touchPointers.delete(e.pointerId); this.updatePinch();
      if (e.pointerId === this.stickId) this.endStick();
    };
    root.addEventListener('pointerup', release); root.addEventListener('pointercancel', release);

    ui.stickZone.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'touch' || this.stickId !== null) return;
      this.stickId = e.pointerId; this.stickOrigin = { x: e.clientX, y: e.clientY };
      ui.stickBase.style.display = 'block';
      ui.stickBase.style.left = `${e.clientX}px`; ui.stickBase.style.top = `${e.clientY}px`;
      ui.stickZone.setPointerCapture?.(e.pointerId); this.updateStick(e.clientX, e.clientY);
    });
    const bindHold = (el, prop) => {
      el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture?.(e.pointerId); this[prop] = true; el.classList.add('active'); });
      const up = e => { e.preventDefault(); this[prop] = false; el.classList.remove('active'); };
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', e => { if (e.buttons === 0) up(e); });
    };
    bindHold(ui.fireBtn, 'fire'); bindHold(ui.rocketBtn, 'rocket');
  }
  updatePinch() {
    const pts = [...this.touchPointers.values()];
    if (pts.length < 2) { this.pinchDistance = null; return; }
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (this.pinchDistance !== null) this.zoomDelta += (this.pinchDistance - d) * .0026;
    this.pinchDistance = d;
  }
  updateStick(x, y) {
    const dx = x - this.stickOrigin.x, dy = y - this.stickOrigin.y;
    const max = 42, len = Math.hypot(dx, dy), s = len > max ? max / len : 1;
    const kx = dx * s, ky = dy * s;
    this.ui.stickKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
    this.move.x = clamp(dx / max, -1, 1); this.move.y = clamp(-dy / max, -1, 1);
  }
  endStick() {
    this.stickId = null; this.move.x = 0; this.move.y = 0;
    this.ui.stickBase.style.display = 'none';
    this.ui.stickKnob.style.transform = 'translate(-50%,-50%)';
  }
  sample() {
    let x = this.move.x, y = this.move.y;
    if (this.keys.has('KeyA') || this.keys.has('ArrowLeft')) x -= 1;
    if (this.keys.has('KeyD') || this.keys.has('ArrowRight')) x += 1;
    if (this.keys.has('KeyW') || this.keys.has('ArrowUp')) y += 1;
    if (this.keys.has('KeyS') || this.keys.has('ArrowDown')) y -= 1;
    const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
    return {
      x, y,
      fire: this.fire || this.keys.has('Space') || this.keys.has('KeyJ'),
      rocket: this.rocket || this.keys.has('KeyK') || this.keys.has('ShiftLeft') || this.keys.has('ShiftRight')
    };
  }
  consumeZoom() { const z = this.zoomDelta; this.zoomDelta = 0; return z; }
}

class Game {
  constructor(T, renderer, backend, ui) {
    this.T = T; this.renderer = renderer; this.backend = backend; this.ui = ui;
    this.isTouch = matchMedia('(pointer: coarse)').matches;
    this.audio = new AudioBus(); this.input = new Input(ui);
    this.running = false; this.ended = false; this.startedAt = 0;
    this.prevTime = 0; this.toastTimer = 0; this.hurtCooldown = 0; this.rocketLatch = false;
    this.enemies = []; this.projectiles = []; this.particles = []; this.pickups = []; this.rescues = []; this.obstacles = [];
    this.dynamicMeshes = []; this.bound = { minX: -28, maxX: 28, minZ: -224, maxZ: 16 };
    this.stats = {
      hp: BALANCE.maxHp, maxHp: BALANCE.maxHp, xp: 0, level: 1, onboard: 0,
      rockets: BALANCE.rockets, maxRockets: BALANCE.rockets, cannonInterval: BALANCE.cannonInterval,
      cannonDamage: BALANCE.cannonDamage, score: 0
    };
    this.shotCooldown = 0; this.boss = null; this.bossTriggered = false;
    this.zoom = this.isTouch ? 1.03 : .94; this.targetZoom = this.zoom;
    this.pixelRatio = Math.min(devicePixelRatio, this.isTouch ? 1.35 : 1.85);
    this.pixelRatioCap = this.pixelRatio; this.fpsFrames = 0; this.fpsTimer = 0;

    this.scene = new T.Scene();
    this.scene.background = new T.Color(0x8a7554);
    this.scene.fog = new T.Fog(0xa58a64, 40, 104);
    this.camera = new T.PerspectiveCamera(this.isTouch ? 43 : 39, innerWidth / innerHeight, .1, 180);
    this.camera.position.set(0, 30, 20);
    this.cameraTarget = new T.Vector3();
    this.raycaster = new T.Raycaster(); this.groundPlane = new T.Plane(new T.Vector3(0,1,0), 0);
    this.aimPoint = new T.Vector3(0,0,-10);

    this.renderer.setPixelRatio(this.pixelRatio);
    this.renderer.setSize(innerWidth, innerHeight);
    this.renderer.shadowMap.enabled = true;
    if (T.PCFSoftShadowMap !== undefined) this.renderer.shadowMap.type = T.PCFSoftShadowMap;
    if ('outputColorSpace' in this.renderer && T.SRGBColorSpace) this.renderer.outputColorSpace = T.SRGBColorSpace;
    if ('toneMapping' in this.renderer && T.AgXToneMapping !== undefined) this.renderer.toneMapping = T.AgXToneMapping;
    if ('toneMappingExposure' in this.renderer) this.renderer.toneMappingExposure = 1.08;
    ui.canvasHost.appendChild(this.renderer.domElement);

    this.materials = {
      sand: this.mat(0xb58b56, .96), road: this.mat(0x6f634f, 1), rock: this.mat(0x665846, 1),
      metal: this.mat(0x3d4b49, .62, .18), dark: this.mat(0x242b2a, .7, .12), red: this.mat(0xa94535, .68),
      tan: this.mat(0xd0ad6f, .88), green: this.mat(0x677848, .88), enemy: this.mat(0x6f4038, .82),
      blue: this.mat(0x4f7483, .75), white: this.mat(0xe9dfbf, .85), yellow: this.mat(0xd7aa3f, .74),
      glow: this.mat(0xffa84a, .45, .05, 0xff641f, .75)
    };

    this.buildLighting(); this.buildWorld(); this.buildPlayer(); this.bindUI(); this.resize();
    addEventListener('resize', () => this.resize());
  }

  mat(color, roughness = .8, metalness = 0, emissive = 0x000000, emissiveIntensity = 0) {
    const m = new this.T.MeshStandardMaterial({ color, roughness, metalness, flatShading: true, emissive, emissiveIntensity });
    return m;
  }

  buildLighting() {
    const T = this.T;
    const hemi = new T.HemisphereLight(0xffefd0, 0x42392f, 2.1); this.scene.add(hemi);
    const sun = new T.DirectionalLight(0xffe5b3, 4.2); sun.position.set(-22, 35, 18); sun.castShadow = true;
    const s = sun.shadow; if (s?.mapSize) { s.mapSize.set(this.isTouch ? 1024 : 2048, this.isTouch ? 1024 : 2048); s.camera.left=-34; s.camera.right=34; s.camera.top=38; s.camera.bottom=-38; s.camera.near=1; s.camera.far=90; s.bias=-0.0003; }
    this.scene.add(sun); this.sun = sun;
  }

  box(x,y,z,w,h,d,mat, collision = false, receive = true, cast = true) {
    const T = this.T; const mesh = new T.Mesh(new T.BoxGeometry(w,h,d), mat); mesh.position.set(x,y,z); mesh.castShadow=cast; mesh.receiveShadow=receive; this.scene.add(mesh);
    if (collision) this.obstacles.push({ x, z, hw:w/2, hd:d/2, mesh });
    return mesh;
  }

  cyl(x,y,z,r,h,mat, sides=8, cast=true) {
    const T=this.T; const mesh=new T.Mesh(new T.CylinderGeometry(r,r,h,sides),mat); mesh.position.set(x,y,z); mesh.castShadow=cast; mesh.receiveShadow=true; this.scene.add(mesh); return mesh;
  }

  buildWorld() {
    const T = this.T;
    const ground = new T.Mesh(new T.PlaneGeometry(74, 272), this.materials.sand); ground.rotation.x=-Math.PI/2; ground.position.z=-104; ground.receiveShadow=true; this.scene.add(ground);
    this.box(0,.035,-104,18,.07,250,this.materials.road,false,true,false);
    this.box(12,.04,-67,15,.08,24,this.materials.road,false,true,false);
    this.box(-12,.04,-37,14,.08,24,this.materials.road,false,true,false);
    this.box(-13,.04,-144,14,.08,24,this.materials.road,false,true,false);
    this.box(12,.04,-162,14,.08,22,this.materials.road,false,true,false);
    this.box(21,.03,-96,8,.07,34,this.materials.road,false,true,false);

    // canyon edge blocks and stylized rocks
    for (let z=10; z>-226; z-=15) {
      this.box(-32,1.9,z,6,3.8,10,this.materials.rock,true);
      this.box(32,1.9,z-6,6,3.8,10,this.materials.rock,true);
    }
    const rockPts=[[-23,-18],[-21,-57],[24,-38],[22,-124],[-22,-112],[23,-183],[-20,-202],[19,-20],[-19,-174]];
    rockPts.forEach(([x,z],i)=>{ const r=this.cyl(x,.9,z,1.3+(i%3)*.28,1.8+(i%2)*.6,this.materials.rock,6); r.rotation.y=i*.6; });

    // Start checkpoint and roadside signs.
    this.addSign(-8,-8,'DUSTLINE');
    this.addSign(8,-27,'LEFT: CAMP');
    this.addSign(-8,-60,'RIGHT: DEPOT');

    // Camp 1: fenced left yard, wide entrance facing road.
    this.fenceRect(-13,-37,15,19,'east');
    this.box(-18,1,-42,5,2,5,this.materials.tan,true);
    this.box(-16,.6,-31,4,1.2,3,this.materials.green,true);
    this.addStairs(-20,-37,1);
    this.spawnRescue(-12,-38,0);
    this.spawnEnemy('infantry',-8,-34); this.spawnEnemy('infantry',-17,-45); this.spawnEnemy('turret',-19,-28);
    this.spawnPickup('repair',-20,-45);

    // Depot right branch.
    this.fenceRect(13,-69,16,21,'west');
    this.box(17,1,-76,6,2,5,this.materials.metal,true);
    this.box(8,.75,-72,3,1.5,5,this.materials.tan,true);
    this.spawnRescue(14,-69,1);
    this.spawnEnemy('infantry',9,-65); this.spawnEnemy('infantry',17,-64); this.spawnEnemy('buggy',14,-80);
    this.spawnPickup('rockets',21,-76);

    // Trench + bridge + side ford. Railings are collisions to keep the car on bridge.
    this.box(0,-.16,-96,56,.3,8,this.materials.dark,false,false,false);
    this.box(0,.28,-96,15,.55,9,this.materials.metal,false,true,true);
    for (const x of [-7.8,7.8]) this.box(x,1.05,-96,.45,1.6,10,this.materials.yellow,true);
    for (let z=-100; z<=-92; z+=2) { this.cyl(-7.8,1.8,z,.18,1.5,this.materials.dark,6); this.cyl(7.8,1.8,z,.18,1.5,this.materials.dark,6); }
    this.box(21,.12,-96,8,.24,9,this.materials.road,false,true,false);
    this.addSign(10,-87,'BRIDGE | FORD →');

    // Relay area with cover and a small watch platform with stairs/railings.
    this.box(-11,1,-114,6,2,5,this.materials.tan,true);
    this.box(12,1,-118,5,2,5,this.materials.tan,true);
    this.addStairs(18,-116,-1);
    this.box(20,2.4,-116,6,.6,6,this.materials.metal,true);
    this.box(20,3.05,-118.8,6,.35,.35,this.materials.yellow,true);

  fenceRect(cx,cz,w,d,opening='east') {
    const m=this.materials.dark, y=.9, t=.26;
    const open = 5.8;
    this.box(cx,y,cz-d/2,w,1.8,t,m,true); this.box(cx,y,cz+d/2,w,1.8,t,m,true);
    if (opening==='east') {
      this.box(cx-w/2,y,cz,t,1.8,d,m,true);
      this.box(cx+w/2,y,cz-(d-open)/4,t,1.8,(d-open)/2,m,true);
      this.box(cx+w/2,y,cz+(d-open)/4,t,1.8,(d-open)/2,m,true);
    } else {
      this.box(cx+w/2,y,cz,t,1.8,d,m,true);
      this.box(cx-w/2,y,cz-(d-open)/4,t,1.8,(d-open)/2,m,true);
      this.box(cx-w/2,y,cz+(d-open)/4,t,1.8,(d-open)/2,m,true);
    }
  }

  addStairs(x,z,dir=1) {
    for (let i=0;i<4;i++) this.box(x, .18+i*.16, z+dir*(i*.65), 3, .36+i*.02, .7, this.materials.metal, true);
  }

  addSign(x,z,text) {
    const T=this.T; const c=document.createElement('canvas'); c.width=256; c.height=80; const ctx=c.getContext('2d');
    ctx.fillStyle='#28302e'; ctx.fillRect(0,0,c.width,c.height); ctx.strokeStyle='#e6ba55'; ctx.lineWidth=9; ctx.strokeRect(5,5,c.width-10,c.height-10);
    ctx.fillStyle='#f7e4a7'; ctx.font='bold 25px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text,128,41);
    const tex=new T.CanvasTexture(c); if (T.SRGBColorSpace) tex.colorSpace=T.SRGBColorSpace;
    const mat=new T.MeshBasicMaterial({ map:tex, side:T.DoubleSide }); const mesh=new T.Mesh(new T.PlaneGeometry(5.6,1.75),mat); mesh.position.set(x,2.2,z); mesh.rotation.x=-.11; this.scene.add(mesh);
    this.box(x,.9,z+.28,.22,2.5,.22,this.materials.dark,false);
  }

  buildPlayer() {
    const T=this.T; const g=new T.Group(); g.position.set(0,.7,8); this.scene.add(g); this.player=g; this.velocity=new T.Vector3();
    const body=new T.Mesh(new T.BoxGeometry(2.6,.75,3.6),this.materials.green); body.position.y=.25; body.castShadow=true; body.receiveShadow=true; g.add(body);
    const hood=new T.Mesh(new T.BoxGeometry(2.2,.52,1.35),this.materials.tan); hood.position.set(0,.67,-.86); hood.castShadow=true; g.add(hood);
    const cabin=new T.Mesh(new T.BoxGeometry(2.1,.7,1.45),this.materials.dark); cabin.position.set(0,.86,.56); cabin.castShadow=true; g.add(cabin);
    this.turret=new T.Group(); this.turret.position.set(0,1.32,-.08); g.add(this.turret);
    const ring=new T.Mesh(new T.CylinderGeometry(.55,.55,.22,10),this.materials.metal); ring.castShadow=true; this.turret.add(ring);
    const gun=new T.Mesh(new T.BoxGeometry(.28,.25,1.65),this.materials.dark); gun.position.set(0,.08,-.88); gun.castShadow=true; this.turret.add(gun);
    for (const x of [-1.38,1.38]) for (const z of [-1.1,1.1]) { const w=new T.Mesh(new T.CylinderGeometry(.46,.46,.38,10),this.materials.dark); w.rotation.z=Math.PI/2; w.position.set(x,.02,z); w.castShadow=true; g.add(w); }
    const antenna=new T.Mesh(new T.CylinderGeometry(.045,.045,1.5,6),this.materials.dark); antenna.position.set(.75,1.25,.6); antenna.rotation.z=-.1; g.add(antenna);
    this.playerRadius=1.45; this.player.rotation.y=0;
  }

  spawnRescue(x,z,id) {
    const T=this.T; const g=new T.Group(); g.position.set(x,.6,z); this.scene.add(g);
    const torso=new T.Mesh(new T.BoxGeometry(.7,.85,.45),this.materials.blue); torso.position.y=.4; torso.castShadow=true; g.add(torso);
    const head=new T.Mesh(new T.BoxGeometry(.48,.48,.48),this.materials.tan); head.position.y=1.05; head.castShadow=true; g.add(head);
    const beacon=new T.PointLight(0x77d7ff,1.8,5); beacon.position.y=1.6; g.add(beacon);
    this.rescues.push({ id,x,z,mesh:g,collected:false,phase:Math.random()*6.28 });
  }

  spawnPickup(type,x,z) {
    const T=this.T; const mat=type==='repair'?this.materials.white:this.materials.yellow; const g=new T.Group(); g.position.set(x,.55,z); this.scene.add(g);
    const b=new T.Mesh(new T.BoxGeometry(1.3,1.05,1.3),mat); b.castShadow=true; g.add(b);
    const crossMat=this.materials.red;
    if (type==='repair') { const a=new T.Mesh(new T.BoxGeometry(.85,.18,.12),crossMat), c=new T.Mesh(new T.BoxGeometry(.18,.85,.12),crossMat); a.position.z=-.66; c.position.z=-.66; g.add(a,c); }
    else { const r=new T.Mesh(new T.CylinderGeometry(.16,.16,.95,8),this.materials.red); r.rotation.z=Math.PI/2; r.position.y=.1; g.add(r); }
    this.pickups.push({type,x,z,mesh:g,taken:false,phase:Math.random()*6.28});

  createEnemyMesh(type) {
    const T=this.T, g=new T.Group(), mat=this.materials.enemy;
    if (type==='infantry') {
      const body=new T.Mesh(new T.BoxGeometry(.72,.85,.55),mat); body.position.y=.46; body.castShadow=true; g.add(body);
      const head=new T.Mesh(new T.BoxGeometry(.5,.48,.5),this.materials.tan); head.position.y=1.1; head.castShadow=true; g.add(head);
      const gun=new T.Mesh(new T.BoxGeometry(.16,.16,.9),this.materials.dark); gun.position.set(.38,.72,-.32); gun.rotation.y=.15; g.add(gun);
    } else {
      const s=type==='boss'?1.55:1;
      const body=new T.Mesh(new T.BoxGeometry(2.4*s,.75*s,3.1*s),mat); body.position.y=.45*s; body.castShadow=true; g.add(body);
      const top=new T.Mesh(new T.BoxGeometry(1.65*s,.55*s,1.45*s),this.materials.dark); top.position.y=1.0*s; top.castShadow=true; g.add(top);
      const turret=new T.Group(); turret.position.set(0,1.35*s,-.1*s); g.add(turret); g.userData.turret=turret;
      const ring=new T.Mesh(new T.CylinderGeometry(.5*s,.5*s,.25*s,10),this.materials.metal); turret.add(ring);
      const barrel=new T.Mesh(new T.BoxGeometry(.24*s,.2*s,1.55*s),this.materials.dark); barrel.position.z=-.86*s; turret.add(barrel);
      for (const x of [-1.25*s,1.25*s]) for (const z of [-.9*s,.9*s]) { const w=new T.Mesh(new T.CylinderGeometry(.4*s,.4*s,.36*s,8),this.materials.dark); w.rotation.z=Math.PI/2; w.position.set(x,.18*s,z); g.add(w); }
      if (type==='boss') { const light=new T.PointLight(0xff4c2e,4,9); light.position.set(0,1.8,-1.2); g.add(light); }
    }
    return g;
  }

  spawnEnemy(type,x,z) {
    const cfg=ENEMY_BALANCE[type];
    const mesh=this.createEnemyMesh(type); mesh.position.set(x,.55,z); this.scene.add(mesh);
    const e={type,mesh,hp:cfg.hp,maxHp:cfg.hp,speed:cfg.speed,range:cfg.range,rate:cfg.rate,damage:cfg.damage,radius:cfg.radius,fireTimer:.5+Math.random(),dead:false,strafe:Math.random()>.5?1:-1};
    this.enemies.push(e); if(type==='boss') this.boss=e; return e;
  }

  bindUI() {
    this.ui.startBtn.onclick=()=>{ this.audio.unlock(); this.ui.intro.style.display='none'; this.running=true; this.startedAt=performance.now(); this.toast('RESCUE 4 ENGINEERS — REACH EXTRACTION',2.5); };
    this.ui.restartBtn.onclick=()=>location.reload(); this.ui.retryBtn.onclick=()=>location.reload();
  }

  setRenderFunction(fn) { this.renderFunction = fn; }

  resize() {
    const w=innerWidth,h=innerHeight; this.camera.aspect=w/h; this.camera.updateProjectionMatrix(); this.renderer.setSize(w,h,false);
  }

  toast(text, seconds=1.6) { this.ui.toast.textContent=text; this.ui.toast.classList.add('show'); this.toastTimer=seconds; }

  addXP(amount) {
    this.stats.xp += amount; this.stats.score += amount*10;
    if (this.stats.level===1 && this.stats.xp>=BALANCE.level2XP) {
      this.stats.level=2; this.stats.cannonInterval=.145; this.stats.maxHp=116; this.stats.hp=Math.min(this.stats.maxHp,this.stats.hp+30); this.audio.upgrade(); this.toast('FIELD UPGRADE: FAST CYCLER + ARMOR');
    }
    if (this.stats.level===2 && this.stats.xp>=BALANCE.level3XP) {
      this.stats.level=3; this.stats.cannonDamage=23; this.stats.maxHp=124; this.stats.hp=Math.min(this.stats.maxHp,this.stats.hp+18); this.stats.maxRockets=4; this.stats.rockets=Math.min(4,this.stats.rockets+1); this.audio.upgrade(); this.toast('FIELD UPGRADE: HEAVY CANNON + ROCKET RACK');
    }
  }

  collideCircle(x,z,r, ignoreMesh=null) {
    if (x-r<this.bound.minX || x+r>this.bound.maxX || z-r<this.bound.minZ || z+r>this.bound.maxZ) return true;
    for (const o of this.obstacles) {
      if (o.mesh===ignoreMesh) continue;
      const qx=clamp(x,o.x-o.hw,o.x+o.hw), qz=clamp(z,o.z-o.hd,o.z+o.hd);
      if ((x-qx)**2+(z-qz)**2 < r*r) return true;
    }
    return false;
  }

  updatePlayer(dt, inp) {
    const T=this.T; this.shotCooldown-=dt; this.hurtCooldown-=dt;
    const move=new T.Vector3(inp.x,0,-inp.y); const mag=Math.min(1,move.length()); if(mag>0.001) move.normalize();
    const targetV=move.multiplyScalar(BALANCE.playerSpeed*mag*(this.stats.hp<30?.9:1));
    this.velocity.lerp(targetV, 1-Math.exp(-7*dt));
    const oldX=this.player.position.x, oldZ=this.player.position.z;
    this.player.position.x += this.velocity.x*dt; this.player.position.z += this.velocity.z*dt;
    if (this.collideCircle(this.player.position.x,this.player.position.z,this.playerRadius)) { this.player.position.x=oldX; this.player.position.z=oldZ; this.velocity.multiplyScalar(.22); }

    // Trench hazard: bridge center and east ford are safe.
    if (this.player.position.z < -91.7 && this.player.position.z > -100.3) {
      const x=this.player.position.x, safe=Math.abs(x)<7 || (x>17 && x<25);
      if(!safe) { this.velocity.multiplyScalar(.7); if(this.hurtCooldown<=0){ this.damagePlayer(6); this.toast('TRENCH — USE BRIDGE OR EAST FORD',1.1); } }
    }

    if (mag>.12) {
      const yaw=Math.atan2(inp.x, inp.y); this.player.rotation.y += angleDelta(this.player.rotation.y,yaw)*(1-Math.exp(-8*dt));
    }
    const aim=this.computeAimDirection(inp); const turretWorldYaw=Math.atan2(aim.x,-aim.z); this.turret.rotation.y = angleDelta(this.player.rotation.y,turretWorldYaw) + 0;

    if(inp.fire && this.shotCooldown<=0) { this.fireCannon(aim); this.shotCooldown=this.stats.cannonInterval; }
    if(inp.rocket && !this.rocketLatch && this.stats.rockets>0) { this.fireRocket(aim); this.rocketLatch=true; }
    if(!inp.rocket) this.rocketLatch=false;

    // Trigger boss before final gate.
    if(!this.bossTriggered && this.player.position.z < -176) { this.bossTriggered=true; this.spawnEnemy('boss',0,-190); this.audio.boom(); this.toast('GATE BREAKER INBOUND',2); }
  }

  computeAimDirection(inp) {
    const T=this.T; const p=this.player.position;
    if (this.input.pointer.active && matchMedia('(pointer:fine)').matches) {
      this.raycaster.setFromCamera(this.input.pointer,this.camera); const hit=new T.Vector3();
      if(this.raycaster.ray.intersectPlane(this.groundPlane,hit)) { this.aimPoint.copy(hit); const d=hit.clone().sub(p); d.y=0; if(d.lengthSq()>.001) return d.normalize(); }
    }
    const heading=new T.Vector3(Math.sin(this.player.rotation.y),0,-Math.cos(this.player.rotation.y));
    let best=null,bestScore=1e9;
    for(const e of this.enemies) if(!e.dead){ const v=e.mesh.position.clone().sub(p); v.y=0; const dist=v.length(); if(dist>30) continue; const dir=v.clone().normalize(); const dot=heading.dot(dir); if(dot<.32 && !this.isTouch) continue; if(dot<-.05 && this.isTouch) continue; const score=dist+(1-dot)*12; if(score<bestScore){bestScore=score;best=dir;} }
    return best || heading;
  }

  projectileMesh(kind, enemy=false) {
    const T=this.T;
    if(kind==='rocket'){ const m=new T.Mesh(new T.CylinderGeometry(.16,.2,.75,8), enemy?this.materials.red:this.materials.yellow); m.rotation.x=Math.PI/2; m.castShadow=true; return m; }
    const m=new T.Mesh(new T.SphereGeometry(enemy?.14:.11,6,4), enemy?this.materials.red:this.materials.glow); m.castShadow=false; return m;
  }

  fireCannon(dir) {
    const origin=this.player.position.clone(); origin.y=1.72; origin.add(dir.clone().multiplyScalar(1.9)); const mesh=this.projectileMesh('bullet'); mesh.position.copy(origin); this.scene.add(mesh);
    this.projectiles.push({team:'player',kind:'bullet',mesh,vel:dir.clone().multiplyScalar(42),damage:this.stats.cannonDamage,radius:.18,life:1.2}); this.audio.shot();
  }

  fireRocket(dir) {
    const origin=this.player.position.clone(); origin.y=1.55; origin.add(dir.clone().multiplyScalar(1.7)); const mesh=this.projectileMesh('rocket'); mesh.position.copy(origin); mesh.lookAt(origin.clone().add(dir)); this.scene.add(mesh);
    this.projectiles.push({team:'player',kind:'rocket',mesh,vel:dir.clone().multiplyScalar(26),damage:BALANCE.rocketDamage,radius:.3,life:2.2}); this.stats.rockets--; this.audio.rocket();
  }

  fireEnemy(e, spread=0) {
    const T=this.T; const p=e.mesh.position, dir=this.player.position.clone().sub(p); dir.y=0; dir.normalize(); if(spread){ const a=Math.atan2(dir.x,-dir.z)+spread; dir.set(Math.sin(a),0,-Math.cos(a)); }
    const origin=p.clone(); origin.y=e.type==='infantry'?1.1:1.6; origin.add(dir.clone().multiplyScalar(e.radius+.35)); const mesh=this.projectileMesh('bullet',true); mesh.position.copy(origin); this.scene.add(mesh);
    this.projectiles.push({team:'enemy',kind:'bullet',mesh,vel:dir.multiplyScalar(e.type==='boss'?25:20),damage:e.damage,radius:.2,life:2.3});
  }

  updateEnemies(dt) {
    const T=this.T,p=this.player.position;
    for(const e of this.enemies){ if(e.dead) continue; e.fireTimer-=dt; const to=p.clone().sub(e.mesh.position); to.y=0; const dist=to.length(); const dir=dist>.001?to.normalize():new T.Vector3();
      if(e.type!=='infantry' && e.mesh.userData.turret) { const wy=Math.atan2(dir.x,-dir.z); e.mesh.userData.turret.rotation.y=angleDelta(e.mesh.rotation.y,wy); }
      if(e.speed>0 && dist<30 && dist>(e.type==='boss'?13:8)) {
        let move=dir.clone(); if(e.type==='boss') { const side=new T.Vector3(-dir.z,0,dir.x).multiplyScalar(e.strafe*.55); move.add(side).normalize(); }
        const ox=e.mesh.position.x, oz=e.mesh.position.z; e.mesh.position.addScaledVector(move,e.speed*dt); if(this.collideCircle(e.mesh.position.x,e.mesh.position.z,e.radius)){e.mesh.position.set(ox,e.mesh.position.y,oz); e.strafe*=-1;}
        e.mesh.rotation.y += angleDelta(e.mesh.rotation.y,Math.atan2(move.x,-move.z))*(1-Math.exp(-5*dt));
      }
      if(dist<e.range && e.fireTimer<=0) {
        if(e.type==='boss'){ this.fireEnemy(e,-.13); this.fireEnemy(e,0); this.fireEnemy(e,.13); }
        else this.fireEnemy(e); e.fireTimer=e.rate*(.88+Math.random()*.25);
      }
    }
  }

  updateProjectiles(dt) {
    const T=this.T;
    for(const p of this.projectiles){ if(p.dead) continue; p.life-=dt; const old=p.mesh.position.clone(); p.mesh.position.addScaledVector(p.vel,dt); if(p.kind==='rocket') p.mesh.lookAt(p.mesh.position.clone().add(p.vel));
      if(p.life<=0 || this.collideCircle(p.mesh.position.x,p.mesh.position.z,p.radius)) { if(p.kind==='rocket'&&p.team==='player') this.explode(p.mesh.position, p.damage, BALANCE.rocketBlast); p.dead=true; continue; }
      if(p.team==='player') {
        for(const e of this.enemies){ if(e.dead) continue; const dx=e.mesh.position.x-p.mesh.position.x,dz=e.mesh.position.z-p.mesh.position.z; if(dx*dx+dz*dz<(e.radius+p.radius)**2){ if(p.kind==='rocket') this.explode(p.mesh.position,p.damage,BALANCE.rocketBlast); else this.hitEnemy(e,p.damage,p.mesh.position); p.dead=true; break; } }
      } else {
        const dx=this.player.position.x-p.mesh.position.x,dz=this.player.position.z-p.mesh.position.z; if(dx*dx+dz*dz<(this.playerRadius+p.radius)**2){ this.damagePlayer(p.damage); p.dead=true; }
      }
    }
    this.projectiles=this.projectiles.filter(p=>{ if(p.dead){this.scene.remove(p.mesh); p.mesh.geometry?.dispose?.(); return false;} return true; });
  }

  hitEnemy(e,damage,pos) { e.hp-=damage; this.spark(pos,2,0xffa84a); this.audio.hit(); if(e.hp<=0) this.killEnemy(e); }
  killEnemy(e) { e.dead=true; this.addXP(BALANCE.killXP[e.type]||10); this.explosionFx(e.mesh.position,e.type==='boss'?14:7); this.scene.remove(e.mesh); this.audio.boom(); if(e.type==='boss'){ this.toast('ARMORED GATE DESTROYED — GET TO EXTRACTION',2.4); } }

  explode(position, damage, radius) {
    this.explosionFx(position,10); this.audio.boom();
    for(const e of this.enemies){ if(e.dead) continue; const d=e.mesh.position.distanceTo(position); if(d<radius+e.radius) this.hitEnemy(e,Math.round(damage*(1-d/(radius+e.radius))*.8+damage*.35),position); }
  }

  spark(position,count=3,color=0xffc052) {
    const T=this.T,mat=new T.MeshBasicMaterial({color});
    for(let i=0;i<count;i++){ const m=new T.Mesh(new T.BoxGeometry(.16,.16,.16),mat); m.position.copy(position); m.position.y+=.4; this.scene.add(m); this.particles.push({mesh:m,vel:new T.Vector3((Math.random()-.5)*5,2+Math.random()*3,(Math.random()-.5)*5),life:.25+.25*Math.random(),gravity:8}); }
  }
  explosionFx(position,count=8) { this.spark(position,count,0xff8d38); this.spark(position,Math.ceil(count/2),0x3b3028); }

  damagePlayer(amount) {
    if(this.hurtCooldown>0) return; this.hurtCooldown=.28; this.stats.hp=Math.max(0,this.stats.hp-amount); this.audio.hurt(); this.spark(this.player.position.clone().add(new this.T.Vector3(0,1,0)),4,0xff5f3d); if(this.stats.hp<=0) this.gameOver();
  }

  updateParticles(dt) {
    for(const p of this.particles){ p.life-=dt; p.vel.y-=p.gravity*dt; p.mesh.position.addScaledVector(p.vel,dt); p.mesh.rotation.x+=dt*5; p.mesh.rotation.z+=dt*4; }
    this.particles=this.particles.filter(p=>{ if(p.life<=0){this.scene.remove(p.mesh); p.mesh.geometry?.dispose?.(); return false;} return true; });
  }

  updateInteractions(dt,time) {
    for(const r of this.rescues){ if(r.collected) continue; r.mesh.position.y=.58+Math.sin(time*3+r.phase)*.1; r.mesh.rotation.y+=dt*.8; const d=Math.hypot(r.mesh.position.x-this.player.position.x,r.mesh.position.z-this.player.position.z); if(d<2.4){ r.collected=true; this.scene.remove(r.mesh); this.stats.onboard++; this.addXP(BALANCE.rescueXP); this.audio.rescue(); this.toast(`ENGINEER RESCUED  ${this.stats.onboard}/4`,1.5); } }
    for(const p of this.pickups){ if(p.taken) continue; p.mesh.position.y=.5+Math.sin(time*2.4+p.phase)*.12; p.mesh.rotation.y+=dt*.8; const d=Math.hypot(p.mesh.position.x-this.player.position.x,p.mesh.position.z-this.player.position.z); if(d<2.2){ p.taken=true; this.scene.remove(p.mesh); if(p.type==='repair'){this.stats.hp=Math.min(this.stats.maxHp,this.stats.hp+42);this.toast('FIELD REPAIR +42');}else{this.stats.rockets=this.stats.maxRockets;this.toast('ROCKET RACK FULL');} this.addXP(15); this.audio.upgrade(); } }
    if(this.bossTriggered && this.boss?.dead && this.player.position.z<-205 && Math.abs(this.player.position.x)<9) {
      if(this.stats.onboard>=4) this.complete(); else this.toast(`EXTRACTION NEEDS ALL ENGINEERS (${this.stats.onboard}/4)`,1.1);
    }
  }

  updateCamera(dt) {
    this.targetZoom=clamp(this.targetZoom+this.input.consumeZoom(),.76,1.28); this.zoom=damp(this.zoom,this.targetZoom,8,dt);
    const p=this.player.position; const desired=new this.T.Vector3(p.x,29*this.zoom,p.z+17*this.zoom); this.camera.position.lerp(desired,1-Math.exp(-5.7*dt));
    this.cameraTarget.set(p.x,0,p.z-8.5*this.zoom); this.camera.lookAt(this.cameraTarget);
    if(this.sun){ this.sun.position.set(p.x-22,35,p.z+18); this.sun.target.position.set(p.x,0,p.z-20); if(!this.sun.target.parent) this.scene.add(this.sun.target); }
  }

  updateHUD() {
    const s=this.stats; this.ui.hpFill.style.width=`${(s.hp/s.maxHp)*100}%`; this.ui.hpText.textContent=`${Math.ceil(s.hp)}/${s.maxHp}`;
    this.ui.levelText.textContent=`LV ${s.level}`; this.ui.xpText.textContent=`XP ${s.xp}`; this.ui.rescueText.textContent=`ENG ${s.onboard}/4`; this.ui.rocketText.textContent=`RKT ${s.rockets}/${s.maxRockets}`;
    let objective='RESCUE 4 ENGINEERS';
    if(s.onboard>=4 && !this.bossTriggered) objective='PUSH TO THE ARMORED GATE';
    else if(this.bossTriggered && this.boss && !this.boss.dead) objective='DESTROY THE GATE BREAKER';
    else if(this.boss?.dead) objective='REACH EXTRACTION PAD';
    this.ui.objective.textContent=objective;
    if(this.bossTriggered && this.boss && !this.boss.dead){ this.ui.bossbar.style.display='block'; this.ui.bossFill.style.width=`${Math.max(0,this.boss.hp/this.boss.maxHp)*100}%`; } else this.ui.bossbar.style.display='none';
  }

  updateAdaptiveQuality(dt) {
    this.fpsFrames++; this.fpsTimer+=dt; if(this.fpsTimer<3) return; const fps=this.fpsFrames/this.fpsTimer; this.fpsFrames=0; this.fpsTimer=0;
    let next=this.pixelRatio; if(fps<44) next=Math.max(.72,next-.1); else if(fps>58) next=Math.min(this.pixelRatioCap,next+.05); if(Math.abs(next-this.pixelRatio)>.02){this.pixelRatio=next;this.renderer.setPixelRatio(next);this.renderer.setSize(innerWidth,innerHeight,false);} this.ui.backend.textContent=`${this.backend.toUpperCase()} · ${Math.round(fps)} FPS · ${this.pixelRatio.toFixed(2)}x`;
  }

  complete() {
    if(this.ended) return; this.ended=true; this.running=false; this.audio.complete(); const seconds=Math.max(1,(performance.now()-this.startedAt)/1000); this.ui.completeStats.textContent=`${this.stats.onboard}/4 rescued · LV ${this.stats.level} · ${Math.ceil(this.stats.hp)} HP · ${Math.round(seconds)}s`; this.ui.complete.style.display='grid';
  }
  gameOver() { if(this.ended)return; this.ended=true; this.running=false; this.ui.gameover.style.display='grid'; }

  frame(timeMs) {
    const time=timeMs*.001; const dt=this.prevTime?Math.min(.035,time-this.prevTime):.016; this.prevTime=time;
    if(this.toastTimer>0){this.toastTimer-=dt;if(this.toastTimer<=0)this.ui.toast.classList.remove('show');}
    if(this.running){ const inp=this.input.sample(); this.updatePlayer(dt,inp); this.updateEnemies(dt); this.updateProjectiles(dt); this.updateParticles(dt); this.updateInteractions(dt,time); this.updateCamera(dt); this.updateHUD(); this.updateAdaptiveQuality(dt); }
    else { this.updateCamera(dt); }
    if(this.renderFunction) this.renderFunction(); else this.renderer.render(this.scene,this.camera);
  }
}



const app = document.getElementById('app');
app.innerHTML = `
  <div id="canvasHost"></div>
  <div id="hud">
    <div id="topbar">
      <div id="stats" class="panel">
        <div class="row"><span>HULL</span><div class="meter"><i id="hpFill"></i></div><span id="hpText">100/100</span></div>
        <div class="row"><span id="levelText">LV 1</span><span id="xpText">XP 0</span><span id="rescueText">ENG 0/4</span><span id="rocketText">RKT 3/3</span></div>
      </div>
      <div id="mission" class="panel"><strong>MISSION</strong><br><span id="objective">RESCUE 4 ENGINEERS</span></div>
    </div>
    <div id="toast" class="panel">MOVE OUT</div>
    <div id="bossbar" class="panel">GATE BREAKER<div class="meter"><i id="bossFill"></i></div></div>
  </div>
  <div id="controls">
    <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
    <button id="rocketBtn" class="action" aria-label="Rocket">RKT</button>
    <button id="fireBtn" class="action" aria-label="Fire">FIRE</button>
    <div id="zoomHint">PINCH TO ZOOM</div>
  </div>
  <div id="intro">
    <div class="card">
      <h1 class="logo">RIVET RAIDERS</h1>
      <div class="subtitle">DUSTLINE RESCUE</div>
      <p>Punch through the Dustline, collect four captured field engineers, destroy the armored gate breaker, and reach the extraction pad.</p>
      <p class="keys"><span class="desktopHelp">WASD / arrows: drive · mouse: aim · Space/J: cannon · Shift/K: rocket · wheel: zoom</span><span class="touchHelp">Left thumb: drive · FIRE: cannon · RKT: rocket · pinch: zoom · controls support simultaneous touch</span></p>
      <button id="startBtn" class="primary">START MISSION</button>
      <div id="backend">Detecting renderer…</div>
    </div>
  </div>
  <div id="complete"><div class="card"><h2 class="logo">MISSION CLEAR</h2><p id="completeStats"></p><p>The engineers are aboard. The Dustline is open.</p><button id="restartBtn" class="primary">RUN AGAIN</button></div></div>
  <div id="gameover"><div class="card"><h2 class="logo">JEEP LOST</h2><p>The route stays open: repairs and rockets on the side roads can make the next push easier.</p><button id="retryBtn" class="primary">RETRY</button></div></div>
  <div id="warning"><div><h2>Renderer unavailable</h2><p>This browser needs WebGPU, WebGL2, or WebGL1.</p></div></div>`;

const $ = id => document.getElementById(id);
const ui = Object.fromEntries(['canvasHost','hpFill','hpText','levelText','xpText','rescueText','rocketText','objective','toast','bossbar','bossFill','stickZone','stickBase','stickKnob','fireBtn','rocketBtn','intro','startBtn','backend','complete','completeStats','restartBtn','gameover','retryBtn','warning'].map(id=>[id,$(id)]));

const touch = matchMedia('(pointer: coarse)').matches;
document.querySelector('.desktopHelp').style.display = touch ? 'none' : 'inline';
document.querySelector('.touchHelp').style.display = touch ? 'inline' : 'none';

function supportsWebGL(version) {
  try { const c=document.createElement('canvas'); return !!c.getContext(version,{failIfMajorPerformanceCaveat:false}); } catch { return false; }
}

const hasGPU = !!navigator.gpu;
const hasGL2 = supportsWebGL('webgl2');
const hasGL1 = supportsWebGL('webgl') || supportsWebGL('experimental-webgl');
let backend = hasGPU ? 'webgpu' : hasGL2 ? 'webgl2' : hasGL1 ? 'webgl1' : 'none';

if (backend === 'none') {
  ui.intro.style.display='none'; ui.warning.style.display='grid';
} else {
  let T, renderer;
  const initLegacy = async () => {
    backend='webgl1';
    T = await import('three-legacy');
    const canvas=document.createElement('canvas');
    const context=canvas.getContext('webgl',{antialias:true,alpha:false,powerPreference:'high-performance'}) || canvas.getContext('experimental-webgl');
    if (!context) throw new Error('WebGL1 context unavailable');
    renderer=new T.WebGLRenderer({canvas,context,antialias:true,alpha:false,powerPreference:'high-performance'});
  };
  if (backend === 'webgl1') {
    await initLegacy();
  } else {
    try {
      T = await import('three/webgpu');
      renderer=new T.WebGPURenderer({antialias:true,alpha:false,forceWebGL:backend==='webgl2',powerPreference:'high-performance'});
      await renderer.init();
      if (renderer.backend?.isWebGPUBackend === false) backend='webgl2';
    } catch (err) {
      console.warn('Modern renderer init failed; trying WebGL1 compatibility path.',err);
      if (!hasGL1) throw err;
      await initLegacy();
    }
  }
  const game=new Game(T,renderer,backend,ui);
  window.__RIVET_RAIDERS__ = game;

  if (backend !== 'webgl1') {
    try {
      const tsl = await import('three/tsl');
      const pipeline = new T.RenderPipeline(renderer);
      const scenePass = tsl.pass(game.scene,game.camera);
      const color = scenePass.getTextureNode('output');
      const bloom = tsl.bloom(color, touch ? .10 : .16, .15, .92);
      pipeline.outputNode = color.add(bloom);
      game.setRenderFunction(()=>pipeline.render());
    } catch (err) {
      console.warn('Post pipeline unavailable; using direct renderer.',err);
    }
  }

  ui.backend.textContent = backend==='webgpu' ? 'WEBGPU · THREE r186' : backend==='webgl2' ? 'WEBGL2 FALLBACK · THREE r186' : 'WEBGL1 LEGACY FALLBACK · THREE r162';
  renderer.setAnimationLoop(t=>game.frame(t));
}
