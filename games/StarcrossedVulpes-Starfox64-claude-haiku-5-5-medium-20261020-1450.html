<!--
  SOURCE INFORMATION
  - Date: 2026-10-20 14:50
  - Source: Starfox 64 for N64
  - Tech: three.js 0.186.1 (WebGL, shadows, UnrealBloomPass via EffectComposer); esbuild 0.28.2 bundled into one HTML file; vanilla ES modules; Web Audio API; DOM UI
  - Art Direction: low-poly, flat-shaded, N64-inspired; sunset Plains, gunmetal Fortress, deep-space Asteroid Belt and Dreadnought; neon accents and bloom
  - Animation: procedural (critically damped flight/camera smoothing, instanced particle pool, shockwave and flash pools, timed boss sequences)
  - Testing: the prompt placed no restriction on testing
  - Environment: Claude Code CLI (headless); Linux; browser unknown
  - Model: Anthropic, claude-haiku-5-5, reasoning effort medium
  - Usage: unknown

  ENGINE FEEDBACK
  - Liked most: three.js shadows, fog and bloom with little setup; procedural geometry removes the need for assets
  - Stuck or guessed: tone mapping and color space for custom shaders and post passes (OutputPass needed once bloom is on)
  - Built myself: stage runtime (event timeline), lock-on and homing, medal rules, boss phases, input layer
  - Hardest part: keeping the DOM HUD in step with the three.js frame (target projection after camera moves)
  - Would overhaul: per-frame allocations in projection and steering helpers
  - Would change: a built-in screen-projection helper that stays in sync with the camera

  PROMPT FEEDBACK
  [PROMPT]
  - Liked most: the 10-foot controller-first brief and the explicit "no TODOs or stubs" completion rule
  - Confusing: whether CDN use and the single-file rule both hold; resolved by inlining everything
  - Hardest: fitting a feature-complete demo (route, boss, attract, settings, medals) into one bundle without a real controller to test
  - One test I'd want: a real PlayStation or Xbox pad on Chrome and Safari, checking inversion and lock-on feel
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Starcrossed Vulpes</title>
<style>
/* Starcrossed Vulpes: 10-foot UI. Big type, high contrast, one focus style everywhere. */
:root {
  --ink: #eef6ff;
  --dim: #9fb3c8;
  --accent: #66e0ff;
  --gold: #ffd54a;
  --bad: #ff5a5a;
  --good: #7dff8a;
  --panel: rgba(8, 14, 28, 0.82);
  --line: rgba(160, 210, 255, 0.28);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #03040a;
  color: var(--ink); font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
#app { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }

/* ---- HUD ---------------------------------------------------------------- */
#hud { position: absolute; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; }
.hud-top { position: absolute; top: 22px; left: 28px; right: 28px; display: flex; justify-content: space-between; align-items: flex-start; }
.hud-id { display: flex; gap: 14px; align-items: center; font-size: 1.05rem; letter-spacing: 0.12em; text-shadow: 0 2px 6px #000; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; background: rgba(0,0,0,0.35); font-weight: 700; }
.timer { font-size: 2.1rem; font-weight: 800; letter-spacing: 0.06em; text-shadow: 0 2px 8px #000; }
.lbl { font-size: 0.8rem; letter-spacing: 0.16em; color: var(--dim); }
.boss { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); width: min(520px, 60vw); text-align: center; }
.boss-name { font-weight: 800; letter-spacing: 0.2em; font-size: 1rem; color: #ffb37a; margin-bottom: 6px; text-shadow: 0 2px 6px #000; }
.bar { position: relative; height: 12px; border: 1px solid var(--line); background: rgba(0,0,0,0.45); border-radius: 3px; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, #3ac8ff, #9ff0ff); transition: width 0.12s linear; }
.bar.wide { height: 14px; }
.bar.wide i { background: linear-gradient(90deg, #ff7a3a, #ffd54a); }
.hud-bl { position: absolute; left: 28px; bottom: 26px; width: min(360px, 40vw); }
.shield .bar.big { height: 22px; margin: 6px 0 8px; }
.shield b { font-size: 2rem; font-weight: 800; text-shadow: 0 2px 6px #000; }
.shield.crit b { color: var(--bad); animation: blink 0.5s steps(2) infinite; }
.shield.crit .bar i { background: linear-gradient(90deg, #ff3b3b, #ff9a7a); }
.spares { margin-top: 10px; display: flex; gap: 14px; align-items: baseline; }
.spares span:last-child { font-size: 1.3rem; color: var(--accent); font-weight: 800; }
.hud-br { position: absolute; right: 28px; bottom: 26px; display: grid; grid-template-columns: repeat(2, auto); gap: 12px 26px; text-align: right; }
.stat { display: flex; flex-direction: column; align-items: flex-end; min-width: 120px; }
.stat b { font-size: 1.6rem; font-weight: 800; text-shadow: 0 2px 6px #000; }
#hLockWrap.charging b { color: var(--gold); animation: blink 0.25s steps(2) infinite; }
.reticle { position: absolute; left: 0; top: 0; width: 56px; height: 56px; }
.reticle::before, .reticle::after { content: ""; position: absolute; background: rgba(120, 255, 170, 0.9); }
.reticle::before { left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; }
.reticle::after { top: 50%; left: 0; right: 0; height: 2px; margin-top: -1px; }
.reticle { border: 2px solid rgba(120, 255, 170, 0.75); border-radius: 50%; }
#hTargets { position: absolute; inset: 0; pointer-events: none; }
.tgt { position: absolute; left: 0; top: 0; width: 46px; height: 46px; border: 2px dashed rgba(102, 224, 255, 0.85); }
.tgt.lock { border: 3px solid var(--gold); border-style: solid; box-shadow: 0 0 12px rgba(255, 213, 74, 0.8); }
.dialog { position: absolute; left: 28px; bottom: 170px; width: min(680px, 60vw); padding: 16px 22px; background: var(--panel); border-left: 5px solid var(--speaker, var(--accent)); border-radius: 6px; box-shadow: 0 8px 26px rgba(0,0,0,0.45); }
.dialog.pop { animation: pop 0.25s ease-out; }
.dialog .who { font-size: 0.95rem; letter-spacing: 0.2em; font-weight: 800; color: var(--speaker, var(--accent)); }
.dialog .text { font-size: 1.35rem; line-height: 1.35; margin-top: 4px; }
.banner { position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(2rem, 5vw, 4rem); font-weight: 900; letter-spacing: 0.12em; text-shadow: 0 4px 18px #000; animation: pop 0.4s ease-out; white-space: nowrap; }
.banner.good { color: var(--good); }
.banner.bad { color: var(--bad); }
.toast { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); font-size: 1.6rem; font-weight: 800; letter-spacing: 0.1em; opacity: 0; color: var(--gold); text-shadow: 0 2px 10px #000; transition: opacity 0.2s; }
.toast.on { opacity: 1; animation: pop 0.25s ease-out; }
.hurt { position: absolute; inset: 0; opacity: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(255, 40, 40, 0.55) 100%); }
.hurt.on { animation: hurt 0.5s ease-out; }
.hints { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); font-size: 0.95rem; letter-spacing: 0.1em; color: var(--ink); background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 999px; opacity: 0; transition: opacity 0.4s; white-space: nowrap; }
.hints.show { opacity: 0.92; }
.attract { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 18px; border-radius: 4px; background: rgba(255, 213, 74, 0.9); color: #111; font-weight: 900; letter-spacing: 0.2em; animation: blink 1.2s steps(2) infinite; pointer-events: none; }

/* ---- Menus ------------------------------------------------------------------ */
#ui { position: absolute; inset: 0; pointer-events: none; }
.screen { position: absolute; inset: 0; pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px; background: linear-gradient(90deg, rgba(3,5,12,0.92) 0%, rgba(3,5,12,0.55) 55%, rgba(3,5,12,0.2) 100%); animation: fade 0.35s ease-out; }
.screen header { width: min(980px, 92vw); margin-bottom: 26px; }
.screen h1 { margin: 0; font-size: clamp(2.2rem, 4.6vw, 4rem); letter-spacing: 0.12em; font-weight: 900; text-shadow: 0 0 22px rgba(102, 224, 255, 0.45); }
.screen .sub { margin: 10px 0 0; font-size: clamp(1rem, 1.6vw, 1.35rem); color: var(--dim); max-width: 60ch; line-height: 1.4; }
.menu .items { list-style: none; margin: 0; padding: 0; width: min(980px, 92vw); }
.item { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 18px 26px 18px 34px; margin-bottom: 10px; background: rgba(8, 14, 28, 0.55); border: 1px solid var(--line); border-radius: 6px; font-size: clamp(1.25rem, 2.1vw, 1.8rem); font-weight: 700; letter-spacing: 0.04em; cursor: pointer; transition: background 0.12s, transform 0.12s; }
.item .text { display: flex; flex-direction: column; }
.item .sub { font-size: 1rem; font-weight: 400; color: var(--dim); margin-top: 4px; letter-spacing: 0; }
.item .val { font-size: 1.2rem; font-weight: 800; color: var(--accent); white-space: nowrap; }
.item .val.on { color: var(--good); }
.item.focus { background: rgba(102, 224, 255, 0.16); border-color: var(--accent); transform: translateX(8px); }
.item.focus::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 6px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.item.info { cursor: default; background: rgba(8, 14, 28, 0.35); font-weight: 500; font-size: clamp(1.1rem, 1.7vw, 1.4rem); color: var(--ink); }
.item.info::before { content: "◆"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 0.9rem; }
.item.disabled { opacity: 0.42; cursor: not-allowed; }
.item.disabled .val { color: var(--dim); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: min(980px, 92vw); margin: 0 0 28px; }
.stats div { border: 1px solid var(--line); background: var(--panel); padding: 14px 18px; border-radius: 6px; }
.stats dt { font-size: 0.9rem; letter-spacing: 0.16em; color: var(--dim); }
.stats dd { margin: 6px 0 0; font-size: 2rem; font-weight: 800; }
.screen footer { margin-top: 26px; color: var(--dim); font-size: 1rem; letter-spacing: 0.08em; }

.panel .panel-body { width: min(1040px, 92vw); max-height: 66vh; overflow-y: auto; padding: 22px 26px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 1.12rem; line-height: 1.5; color: var(--ink); scroll-behavior: smooth; }
.panel-body h2 { font-size: 1.35rem; letter-spacing: 0.12em; color: var(--accent); margin: 22px 0 10px; text-transform: uppercase; }
.panel-body h2:first-child { margin-top: 0; }
.panel-body p { margin: 0 0 12px; }
.panel-body ul { padding-left: 1.2em; margin: 0 0 12px; }
.panel-body li { margin-bottom: 8px; }
.panel-body ul.kv { list-style: none; padding: 0; }
.panel-body table.keys { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
.panel-body table.keys td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.panel-body table.keys td:first-child { color: var(--gold); font-weight: 700; white-space: nowrap; padding-right: 26px; width: 34%; }
.panel footer { color: var(--dim); }

@keyframes blink { 50% { opacity: 0.25; } }
@keyframes pop { from { transform: translate(-50%, -40%) scale(0.92); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
@keyframes hurt { 0% { opacity: 1; } 100% { opacity: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-id"><span id="hStage"></span><span id="hMode" class="pill">ARWING</span></div>
      <div id="hTimer" class="timer">00:00</div>
    </div>
    <div id="hBoss" class="boss hidden">
      <div id="hBossName" class="boss-name"></div>
      <div class="bar wide"><i id="hBossBar"></i></div>
    </div>

    <div class="hud-bl">
      <div class="shield">
        <span class="lbl">SHIELD</span>
        <div class="bar big"><i id="hShield"></i></div>
        <b id="hShieldNum">100</b>
      </div>
      <div class="spares"><span class="lbl">SPARE SHIPS</span><span id="hSpares">▲▲</span></div>
    </div>

    <div class="hud-br">
      <div class="stat"><span class="lbl">BOMBS</span><b id="hBombs">× 3</b></div>
      <div class="stat"><span class="lbl">LASER</span><b id="hLaser">LV 1 / 3</b></div>
      <div class="stat" id="hRingsWrap"><span class="lbl">RINGS</span><b id="hRings">0 / 0</b></div>
      <div class="stat" id="hLockWrap"><span class="lbl">KILLS</span><b id="hKills">0</b></div>
    </div>

    <div id="hReticle" class="reticle hidden"></div>
    <div id="hTargets"></div>

    <div id="hudDialog" class="dialog hidden">
      <div id="hdWho" class="who"></div>
      <div id="hdText" class="text"></div>
    </div>
    <div id="hudBanner" class="banner hidden"></div>
    <div id="hToast" class="toast"></div>
    <div id="hHurt" class="hurt"></div>
    <div id="hHints" class="hints"></div>
  </div>

  <div id="attract" class="attract hidden">DEMO · PRESS ANY BUTTON TO PLAY</div>
  <div id="ui"></div>
</div>
