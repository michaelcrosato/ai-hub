    } else if (b.phase === "attack") {
      if (b.hp <= 2 && b.timer < 1.5 && b.ringSpawned === 0) {
        this.spawnRing(0, 72, 0.2);
        b.ringSpawned = 1;
      }
      if (b.timer <= 0) {
        b.phase = "open";
        b.timer = 5;
        this.sound.play("checkpoint");
      }
    } else if (b.phase === "open") {
      if (p.spin > 0 && Math.hypot(p.x, p.z - 69.7) < 2.5 && p.feet < 2.7)
        this.damageBoss();
      else if (b.timer <= 0) {
        b.phase = "tell";
        b.timer = 1.7;
      }
    } else if (b.phase === "hurt" && b.timer <= 0) {
      b.phase = "tell";
      b.timer = 1.6;
    }
  }
  damageBoss() {
    const b = this.level.bossState;
    if (!b || b.phase !== "open" || b.dead) return;
    b.hp--;
    b.phase = "hurt";
    b.timer = 1.1;
    this.sound.play("boom");
    this.shake = 0.38;
    this.rumble(0.7, 200);
    this.burst(0, 2, 70, C.gold, 32, 6);
    this.features.add("boss-hit");
    this.player.invuln = 2;
    if (b.hp <= 0) {
      b.dead = true;
      b.phase = "defeated";
      this.sound.play("win");
      this.rings.forEach((r) => r.life = 0);
      this.level.bossCollider?.setEnabled(false);
      this.projectiles.forEach((q) => q.life = 0);
      this.features.add("boss-defeated");
      if (!this.demo)
        this.ui.toast(
          "The Root Regent, uprooted",
          "The last Sunseed is through the arch!"
        );
      this.burst(0, 4, 72, C.mint, 60, 8);
    }
  }
  spawnRing(x, z, y) {
    const mesh = this.art.torus(
      this.scene,
      C.orange,
      1,
      0.09,
      [x, y, z],
      [Math.PI / 2, 0, 0],
      true
    );
    this.rings.push({ mesh, x, z, y, radius: 1, life: 3.2 });
  }
  updateRings(dt) {
    const p = this.player;
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.life -= dt;
      r.radius += dt * 6.3;
      r.mesh.scale.set(r.radius, r.radius, 1);
      if (Math.abs(distance(p, r) - r.radius) < 0.45 && p.feet < 0.55 && p.feet > -0.5)
        this.hurt("shockwave");
      if (r.life <= 0) {
        this.scene.remove(r.mesh);
        r.mesh.geometry.dispose();
        this.rings.splice(i, 1);
      }
    }
  }
  hurt(reason, fall = false) {
    const p = this.player;
    if (this.demo) {
      if (fall) this.demoRescue();
      return;
    }
    if (this.deathTimer > 0 || !fall && p.invuln > 0) return;
    if (fall && this.settings.assist) {
      p.health = Math.max(1, p.health - 1);
      p.shield = Math.max(1, p.shield);
      this.penalty += 5;
      if (this.bonus) this.leaveBonus();
      else
        this.teleport(
          this.checkpoint.x,
          this.checkpoint.z,
          this.checkpoint.y + 0.1
        );
      p.invuln = 2;
      this.sound.play("shield");
      if (this.level.chase) this.level.chase.z = p.z - 20;
      this.ui.toast(
        "A sun moth catches you",
        "Trail assist \xB7 Back on your feet, with a guardian."
      );
      return;
    }
    if (fall) p.health = 0;
    else if (p.shield > 0) {
      p.shield--;
      this.sound.play("shield");
    } else p.health--;
    p.invuln = 1.65;
    this.shake = 0.27;
    this.flash = 0.3;
    this.sound.play("hurt");
    this.rumble(0.6, 180);
    this.burst(p.x, p.feet + 1, p.z, C.orange, 14, 3);
    if (p.health <= 0) {
      this.deathTimer = 0.65;
      this.penalty += 5;
      p.fallCount++;
      this.ui.hintUntil = 0;
      this.ui.toast(
        reason === "fall" ? "A little tumble." : reason === "harvester" ? "Caught by the canopy." : "Shake it off, Cap.",
        this.bonus ? "Back to the secret doorway. Nothing collected is lost." : "Back to your sun totem. Nothing collected is lost."
      );
    }
  }
  respawn() {
    if (this.bonus) {
      this.leaveBonus();
      this.player.health = this.maxHealth();
      return;
    }
    const falls = this.player.fallCount;
    this.spawnPlayer(this.checkpoint);
    this.player.fallCount = falls;
    this.player.shield = this.settings.assist ? 1 : 0;
    this.hero.root.visible = true;
    this.hero.root.scale.setScalar(1);
    this.cameraSnap = true;
    if (this.level.chase) {
      this.level.chase.z = this.checkpoint.z - 20;
      this.level.chase.active = this.checkpoint.z > 52 && this.checkpoint.z < 239;
      this.level.chase.finished = this.checkpoint.z >= 239;
    }
    const b = this.level.bossState;
    if (b && !b.dead) {
      b.active = false;
      b.phase = "sleep";
      b.timer = 0;
    }
    for (const q of this.projectiles) this.scene.remove(q.mesh);
    this.projectiles = [];
    for (const r of this.rings) {
      this.scene.remove(r.mesh);
      r.mesh.geometry.dispose();
    }
    this.rings = [];
  }
  enterBonus() {
    this.bonus = true;
    this.teleport(19, 98);
    this.ui.chapter(0, true);
    this.sound.play("gem");
    this.features.add("bonus-route");
    this.ui.hint(
      "No lives to lose here. Follow the spring crates to the moon opal.",
      "jump",
      6500
    );
  }
  leaveBonus() {
    this.bonus = false;
    this.teleport(-1.5, 114);
    this.player.invuln = 2;
    this.sound.play("checkpoint");
    this.features.add("bonus-return");
    if (!this.demo)
      this.ui.toast(
        "Back on the trail",
        this.gem ? "With a pocket full of moonlight." : "The secret will still be there when you return."
      );
  }
  complete() {
    if (this.state !== "playing" || this.demo) return;
    this.state = "results";
    this.result = {
      stage: this.stage,
      fruit: this.fruit,
      crates: this.crates,
      total: this.level.totalCrates,
      gem: this.gem,
      time: this.trialTime()
    };
    const rec = this.save.records[this.stage] || {};
    rec.complete = true;
    rec.gem = !!rec.gem || this.gem;
    rec.allCrates = !!rec.allCrates || this.crates === this.level.totalCrates;
    rec.crates = Math.max(rec.crates || 0, this.crates);
    if (this.trial)
      rec.trialBest = Math.min(rec.trialBest || Infinity, this.trialTime());
    else rec.best = Math.min(rec.best || Infinity, this.elapsed);
    this.save.records[this.stage] = rec;
    this.save.unlocked = Math.min(
      2,
      Math.max(this.save.unlocked, this.stage + 1)
    );
    this.save.resume = Math.min(2, this.stage + 1);
    this.save.started = true;
    if (this.stage === 2) this.save.completed = true;
    this.persist();
    this.ui.saved();
    this.ui.show(this.stage === 2 && !this.trial ? "ending" : "results");
    this.ui.hintUntil = 0;
    this.sound.play("win");
    this.rumble(0.35, 250);
  }
  rumble(strength, duration) {
    if (this.settings.vibration && !this.demo)
      this.input.rumble(strength, duration);
  }
  burst(x, y, z, hex, count = 8, power = 2, physical = false) {
    for (let i = 0; i < count; i++) {
      const scale = physical ? 0.1 + Math.random() * 0.15 : 0.035 + Math.random() * 0.1;
      const mesh = this.art.mesh(
        this.scene,
        physical ? "box" : "ico",
        hex,
        [x, y, z],
        [scale, scale, scale],
        false,
        !physical
      );
      const a = Math.random() * Math.PI * 2, v = power * (0.3 + Math.random() * 0.7);
      const vx = Math.cos(a) * v, vy = (0.3 + Math.random()) * power, vz = Math.sin(a) * v;
      let body = null;
      if (physical && i < 5) {
        body = this.level.physics.createRigidBody(
          RAPIER2.RigidBodyDesc.dynamic().setTranslation(x, y, z).setLinvel(vx, vy, vz).setAngvel({ x: Math.random() * 8, y: 3, z: 4 })
        );
        const col = RAPIER2.ColliderDesc.cuboid(scale / 2, scale / 2, scale / 2).setRestitution(0.4).setCollisionGroups(131074);
        this.level.physics.createCollider(col, body);
      }
      this.effects.push({
        mesh,
        x,
        y,
        z,
        vx,
        vy,
        vz,
        life: physical ? 1.7 : 0.65 + Math.random() * 0.3,
        max: physical ? 1.7 : 1,
        body,
        scale
      });
    }
  }
  updateEffects(dt) {
    this.shake = Math.max(0, this.shake - dt);
    this.flash = Math.max(0, this.flash - dt * 1.5);
    document.getElementById("flash").style.opacity = this.settings.reducedMotion ? 0 : this.flash * 0.6;
    for (let i = this.effects.length - 1; i >= 0; i--) {
      const e = this.effects[i];
      e.life -= dt;
      if (e.body) {
        const p = e.body.translation(), q = e.body.rotation();
        e.mesh.position.copy(p);
        e.mesh.quaternion.copy(q);
      } else {
        e.vy -= dt * 9;
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        e.z += e.vz * dt;
        e.mesh.position.set(e.x, e.y, e.z);
        e.mesh.rotation.x += dt * 5;
        e.mesh.rotation.z += dt * 3;
      }
      e.mesh.scale.setScalar(e.scale * Math.min(1, e.life * 3));
      if (e.life <= 0) {
        this.scene.remove(e.mesh);
        if (e.body) this.level.physics.removeRigidBody(e.body);
        this.effects.splice(i, 1);
      }
    }
  }
  updateCamera(dt) {
    if (!this.camera || !this.player) return;
    const p = this.player;
    const desired = new THREE3.Vector3(), target = new THREE3.Vector3();
    if (this.state === "title") {
      desired.set(8 + Math.sin(this.time * 0.15) * 0.4, 4.2, 13.6);
      target.set(-0.5, 1.3, 6);
      this.shadow.visible = false;
    } else if (this.level.bossState?.active && !this.level.bossState.dead) {
      desired.set(p.x * 0.4, 8.6 + this.lookY, Math.min(p.z - 12, 54));
      target.set(p.x * 0.22, 1.5, 69);
    } else if (this.level.chase?.active) {
      desired.set(p.x * 0.5 + 6.6, 8.5 + this.lookY, p.z - 15.8);
      target.set(p.x * 0.6, 0.9, p.z + 3);
    } else {
      desired.set(
        p.x * 0.8 + this.lookX,
        Math.max(0, p.feet) * 0.55 + 5.3 + this.lookY,
        p.z - 9.7
      );
      target.set(p.x * 0.85, Math.max(0, p.feet) * 0.55 + 1.05, p.z + 4.3);
    }
    const lerp = this.cameraSnap ? 1 : 1 - Math.exp(-dt * 6);
    this.camera.position.lerp(desired, lerp);
    if (!this.cameraTarget) this.cameraTarget = target.clone();
    this.cameraTarget.lerp(target, lerp);
    if (!this.settings.reducedMotion && this.shake > 0) {
      this.camera.position.x += (Math.random() - 0.5) * this.shake * 0.4;
      this.camera.position.y += (Math.random() - 0.5) * this.shake * 0.35;
    }
    this.camera.lookAt(this.cameraTarget);
    this.cameraSnap = false;
    const lightX = this.state === "title" ? 0 : p.x, lightZ = this.state === "title" ? 6 : p.z;
    this.sun.position.set(lightX - 14, 25, lightZ - 12);
    this.sun.target.position.set(lightX, 0, lightZ + 4);
    this.sun.target.updateMatrixWorld();
  }
  snapshot() {
    return {
      ready: !!this.ready,
      state: this.state,
      page: this.ui.page,
      stage: this.stage,
      backend: this.renderer?.backend.isWebGPUBackend ? "WebGPU" : "unavailable",
      three: THREE3.REVISION,
      rapier: this.level ? RAPIER2.version() : "initializing",
      frames: this.frames,
      steps: this.steps,
      controls: CONTROL_MAP,
      inputKind: this.input.kind,
      pad: !!this.input.pad,
      input: { ...this.input.last },
      player: this.player ? {
        x: this.player.x,
        y: this.player.y,
        z: this.player.z,
        grounded: this.player.grounded,
        health: this.player.health,
        spin: this.player.spin,
        slide: this.player.slide,
        jumps: this.player.jumps
      } : null,
      demo: this.demo,
      demoIndex: this.demoIndex,
      demoLoops: this.demoLoops,
      demoTransitions: this.demoTransitions,
      demoIdleDelay: this.demoStartedAt - this.demoIdleSince,
      features: Array.from(this.features),
      crates: this.crates,
      totalCrates: this.level?.totalCrates,
      gem: this.gem,
      bonus: this.bonus,
      boss: this.level?.bossState ? { ...this.level.bossState } : null,
      gpuErrors: this.gpuErrors || 0
    };
  }
};

// src/main.js
var game = new Game();
window.canopy = Object.freeze({ snapshot: () => game.snapshot() });
if (new URLSearchParams(location.search).get("diagnostics") === "1")
  window.canopyDiagnostics = game;
game.init().catch((error) => game.fail(error));
</script>
