<!--
## Source Information
- Date: 2026-11-01 18:43
- Source movie: Jurassic Park (1993). Game title: Jurassic Parsec (title picked at random by code from 50 brainstormed riffs).
- Genre and Perspective: third-person stealth/survival action with tranquilizer-dart combat. Main view is third person (PerspectiveCamera); the player can switch with R3 / V to first person (PerspectiveCamera) or top-down (OrthographicCamera).
- Tech: Three.js r180 (WebGPURenderer, automatic WebGL2 fallback), Rapier 0.19.3 (rapier3d-compat, kinematic character controller, dynamic props, breakable fence panels), Web Audio API, Gamepad API, esbuild bundling. Three.js and Rapier load from jsDelivr CDN through an import map.
- Art Direction: engine-native look: low-poly primitives with standard PBR materials, real-time shadows, fog, a moon-lit night with a ringed gas giant in the sky.
- Animation: engine-native THREE.AnimationMixer with code-built AnimationClips (QuaternionKeyframeTrack / VectorKeyframeTrack), layered upper/lower body for the player, crossfades for every creature.
- Audio: all synthesized in code (Web Audio): generative music (title fanfare, explore, danger and finale layers, victory), procedural sound effects, and Animalese-style gibberish voices with five voice profiles (PARSEC, Ferd Hargrove, Dr. Malkin, Pip, D. Nedder) plus subtitles. No audio files.
- Online: AI Hub Session Protocol v1, mode parallel (1-4 players, same seeded world, live score, hub-reported result, 7 minute rounds), session.js pasted unmodified; the game also plays fully on its own. No other network use.
- Testing: headless Chromium (SwiftShader) with Playwright; AI Hub harness (auto check passes at 1, 2, 3 and 4 players); full scripted run by the attract bot (about 200 simulated seconds, start to escape); mocked DualSense pad flow; touch-only emulation; audio smoke test; real WebGPU backend boot check. Not tested on real GPU hardware or a physical controller.
- Research: none beyond reading the AI Hub protocol README and the harness; Three.js and Rapier APIs were written from memory and checked against the vendored packages.
- Environment: Claude Code CLI (headless); Linux (WSL2); browser unknown (tested with headless Chromium).
- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium
- Usage: unknown (token counts and cost are not exposed inside the session). Session time: about 50 minutes of wall clock.
## Testing Feedback
- How many issues did testing catch? About 14: detached limbs (cylinder half-height convention), scene far too dark, creature necks leaning backwards, bot input pulses lost between frames, demo bot never solved the terminal, Rex went idle in the finale, hub keyboard/menu checks failing at low frame rates, too many point lights for software rendering, missing animation track warnings, overlapping title and subtitles, flipped screenshot readback under WebGL, stale chapter card on the title, a self-inflicted pkill, and a busy port.
- How many would be considered critical or game-breaking? 3: the bot stalling the attract mode, the hub keyboard/menu checks failing, and the unsolvable terminal in the demo.
- What was the most helpful test you ran? Stepping the whole game with the attract bot at a fixed time step without rendering (6000 steps in about 100 s): it exercised every chapter, the terminal, the Rex finale and the escape in one go. The AI Hub harness was a close second.
- What was the least helpful test you ran? Single screenshots under SwiftShader to judge lighting (render targets skip tone mapping, so they looked darker than the real page), and the 4-player harness run, which only measured how slow software rendering is.
## Engine Feedback
- What did you like most about the engine? WebGPURenderer falls back to WebGL2 by itself, AnimationMixer plus procedural keyframe tracks gave full skeletal-style animation without any assets, and InstancedMesh made 300 trees plus flora trivial. Rapier's kinematic character controller made the player and dinosaurs collide properly with little code.
- Did you get stuck or guess wrong? Yes: CylinderGeometry height is the full height (I assumed half), leg and neck rotation signs, the Rapier package file is rapier.mjs (not rapier.es.js), readRenderTargetPixelsAsync is vertically flipped on the WebGL backend, and RAPIER.init warns about deprecated parameters.
- What was the most important thing you had to build yourself? Everything around the engines: camera rig with three perspectives and wall-aware spring arm, creature AI with senses and pack flanking, the menu/HUD layer, the synth audio engine, save/checkpoints and the hub glue.
- What was the hardest part about using the engine? Judging performance and lighting without a GPU: many point lights are very costly on the software path, and a headless run is two orders of magnitude slower than a real machine.
- If you had to remove or overhaul one thing from engine, what would that be? The split between three, three/webgpu and three/tsl entry points, which makes import maps and bundling fiddly for a single-file game.
- If you could change one thing about the engine, what would it be? A documented, consistent orientation for render-target readback across backends, and a built-in way to bind clips to nodes without relying on unique node names.
## Prompt Feedback
- What did you like most about this prompt? The clear definition of done (single file, no stubs), the explicit 10-foot controller-first rules and the invert-axis toggle, and the ready-made AI Hub protocol with a harness to test against.
- What was confusing? The literal template words (SOURCE, pick a famous movie, GameTitle) mixed with real instructions, the typo in CRTICAL, "engine" wording for a library like Three.js, and that the hub link is a folder rather than a single document.
- What was the hardest thing to do? Delivering a complete vertical slice with infrastructure, polish, audio, hub integration and an attract mode in one pass while verifying it only with software rendering.
- If there was one test you could of run, what would that be? A 10 minute soak on real hardware with a physical DualSense, the WebGPU backend and four live hub players.

<script>/*! aihub-session 1.4.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {

  var VERSION = '1.4.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

      getItem: function (k) {

      },
      removeItem: function (k) {

      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {

      },
    };

      },
      has: function (t, k) {

      },
      deleteProperty: function (t, k) {

        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null, card: opts.card === true });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  /** On the game's own card (connect({ card: true })): this player is 'ready', or asks for 'more' time (again takes it back). */

    if (!welcomed || ended || goAt !== null) return;
    if (what !== 'ready' && what !== 'more') return warn('answer is ready or more');

  };

    if (pending[type] && !pending[type].flushing) {

        var queued = pending[type];

    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);

    };

    opts = opts || {};

    try {

    } catch (e) {

      return false;
    }

    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }

    refilled = t;

      return null;

  }

  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');

    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;

var ABOUT_HTML = "<h3>Source Information</h3>\n<ul>\n<li>Date: 2026-11-01 18:43</li>\n<li>Source movie: Jurassic Park (1993). Game title: Jurassic Parsec (title picked at random by code from 50 brainstormed riffs).</li>\n<li>Genre and Perspective: third-person stealth/survival action with tranquilizer-dart combat. Main view is third person (PerspectiveCamera); the player can switch with R3 / V to first person (PerspectiveCamera) or top-down (OrthographicCamera).</li>\n<li>Tech: Three.js r180 (WebGPURenderer, automatic WebGL2 fallback), Rapier 0.19.3 (rapier3d-compat, kinematic character controller, dynamic props, breakable fence panels), Web Audio API, Gamepad API, esbuild bundling. Three.js and Rapier load from jsDelivr CDN through an import map.</li>\n<li>Art Direction: engine-native look: low-poly primitives with standard PBR materials, real-time shadows, fog, a moon-lit night with a ringed gas giant in the sky.</li>\n<li>Animation: engine-native THREE.AnimationMixer with code-built AnimationClips (QuaternionKeyframeTrack / VectorKeyframeTrack), layered upper/lower body for the player, crossfades for every creature.</li>\n<li>Audio: all synthesized in code (Web Audio): generative music (title fanfare, explore, danger and finale layers, victory), procedural sound effects, and Animalese-style gibberish voices with five voice profiles (PARSEC, Ferd Hargrove, Dr. Malkin, Pip, D. Nedder) plus subtitles. No audio files.</li>\n<li>Online: AI Hub Session Protocol v1, mode parallel (1-4 players, same seeded world, live score, hub-reported result, 7 minute rounds), session.js pasted unmodified; the game also plays fully on its own. No other network use.</li>\n<li>Testing: headless Chromium (SwiftShader) with Playwright; AI Hub harness (auto check passes at 1, 2, 3 and 4 players); full scripted run by the attract bot (about 200 simulated seconds, start to escape); mocked DualSense pad flow; touch-only emulation; audio smoke test; real WebGPU backend boot check. Not tested on real GPU hardware or a physical controller.</li>\n<li>Research: none beyond reading the AI Hub protocol README and the harness; Three.js and Rapier APIs were written from memory and checked against the vendored packages.</li>\n<li>Environment: Claude Code CLI (headless); Linux (WSL2); browser unknown (tested with headless Chromium).</li>\n<li>Model: Anthropic, claude-sonnet-5-5, reasoning effort medium</li>\n<li>Usage: unknown (token counts and cost are not exposed inside the session). Session time: about 50 minutes of wall clock.</li>\n</ul>\n<h3>Testing Feedback</h3>\n<ul>\n<li>How many issues did testing catch? About 14: detached limbs (cylinder half-height convention), scene far too dark, creature necks leaning backwards, bot input pulses lost between frames, demo bot never solved the terminal, Rex went idle in the finale, hub keyboard/menu checks failing at low frame rates, too many point lights for software rendering, missing animation track warnings, overlapping title and subtitles, flipped screenshot readback under WebGL, stale chapter card on the title, a self-inflicted pkill, and a busy port.</li>\n<li>How many would be considered critical or game-breaking? 3: the bot stalling the attract mode, the hub keyboard/menu checks failing, and the unsolvable terminal in the demo.</li>\n<li>What was the most helpful test you ran? Stepping the whole game with the attract bot at a fixed time step without rendering (6000 steps in about 100 s): it exercised every chapter, the terminal, the Rex finale and the escape in one go. The AI Hub harness was a close second.</li>\n<li>What was the least helpful test you ran? Single screenshots under SwiftShader to judge lighting (render targets skip tone mapping, so they looked darker than the real page), and the 4-player harness run, which only measured how slow software rendering is.</li>\n</ul>\n<h3>Engine Feedback</h3>\n<ul>\n<li>What did you like most about the engine? WebGPURenderer falls back to WebGL2 by itself, AnimationMixer plus procedural keyframe tracks gave full skeletal-style animation without any assets, and InstancedMesh made 300 trees plus flora trivial. Rapier&#x27;s kinematic character controller made the player and dinosaurs collide properly with little code.</li>\n<li>Did you get stuck or guess wrong? Yes: CylinderGeometry height is the full height (I assumed half), leg and neck rotation signs, the Rapier package file is rapier.mjs (not rapier.es.js), readRenderTargetPixelsAsync is vertically flipped on the WebGL backend, and RAPIER.init warns about deprecated parameters.</li>\n<li>What was the most important thing you had to build yourself? Everything around the engines: camera rig with three perspectives and wall-aware spring arm, creature AI with senses and pack flanking, the menu/HUD layer, the synth audio engine, save/checkpoints and the hub glue.</li>\n<li>What was the hardest part about using the engine? Judging performance and lighting without a GPU: many point lights are very costly on the software path, and a headless run is two orders of magnitude slower than a real machine.</li>\n<li>If you had to remove or overhaul one thing from engine, what would that be? The split between three, three/webgpu and three/tsl entry points, which makes import maps and bundling fiddly for a single-file game.</li>\n<li>If you could change one thing about the engine, what would it be? A documented, consistent orientation for render-target readback across backends, and a built-in way to bind clips to nodes without relying on unique node names.</li>\n</ul>\n<h3>Prompt Feedback</h3>\n<ul>\n<li>What did you like most about this prompt? The clear definition of done (single file, no stubs), the explicit 10-foot controller-first rules and the invert-axis toggle, and the ready-made AI Hub protocol with a harness to test against.</li>\n<li>What was confusing? The literal template words (SOURCE, pick a famous movie, GameTitle) mixed with real instructions, the typo in CRTICAL, &quot;engine&quot; wording for a library like Three.js, and that the hub link is a folder rather than a single document.</li>\n<li>What was the hardest thing to do? Delivering a complete vertical slice with infrastructure, polish, audio, hub integration and an attract mode in one pass while verifying it only with software rendering.</li>\n<li>If there was one test you could of run, what would that be? A 10 minute soak on real hardware with a physical DualSense, the WebGPU backend and four live hub players.</li>\n</ul>\n<h3>Credits</h3>\n<ul>\n<li>Design, code and writing by Claude (claude-sonnet-5-5) for the cc-matrix comparison. Original characters inspired by the tone of the film: PARSEC, Ferd Hargrove, Dr. Iona Malkin, Pip Okafor and Denny Nedder.</li>\n</ul>";
