<!DOCTYPE html>
<!--Source Information
Date: 2026-10-29 11:56 America/Vancouver.
Source: Rock n' Roll Racing. Original spiritual successor; no source-game assets or songs.
Title: Riff Rocket Riot, selected from 50 candidates with Python secrets.randbelow and operating-system randomness.
Tech: Three.js R180 (0.180.0), WebGPU only with fallback disabled, Rapier 3D 0.19.3, Gamepad API, Web Audio API, PeerJS 1.5.5, AI Hub Session Protocol v1 / client 1.3.0, JavaScript, HTML, CSS.
Art Direction: Procedural cel shading, faceted alien scenery, ink outlines, chunky armored cars, and bold motorsport broadcast typography.
Animation: Procedural steering, wheel rotation, body lean, exhaust, particles, animated props, Rapier rigid-body motion, and interpolated remote transforms.
Audio: Original code-written rock music, synthesized engines and combat effects, and synthesized Animalese-style gibberish pit announcements. No recordings or licensed songs.
Online: AI Hub shared-course races for 1–4 seats with AI fill; standalone WebRTC room-code races via PeerJS public signaling. Solid rivals, reliable combat events, shared pickup claims, progress/results, and player-leave handling. No chat or voice communication.
Testing: Efficient, focused checks; no FPS target or performance benchmark. All three circuits, core combat/progression, ghost saving, controller protocol checks, and real two-browser standalone connection tested.
Environment: Codex CLI (headless); Linux/WSL2; tested browser Chrome for Testing 156.0.8078.4 under Xvfb with SwiftShader/Vulkan WebGPU. The player's browser is unknown.
Model: OpenAI, gpt-6-astra, reasoning effort xhigh.
Usage: Estimated API cost unknown; token total and breakdown unknown; session time approximately 47 minutes.

Testing Feedback
Issues caught: One runtime input defect: short controller presses could be missed while software rendering stalled. Fixed with independent input polling. Review also corrected starting-ammo upgrades, post-finish network simulation, and end-of-session audio/input behavior.
Critical issues: The controller timing defect could block controller navigation during long rendering stalls; classified as one potentially game-breaking issue. Fixed. No remaining critical failure was observed in the final tested scenarios.
Most helpful test: The official AI Hub harness with an emulated DualSense, 150 ms latency, 50 ms jitter, and 5% packet loss. All 96 checks passed across 2-, 3-, and 4-player races and host departure.
Additional checks: AI completed three laps on each circuit. Rockets, mines, EMP, destruction/rebuilding, pickups, gate ordering, upgrades, and time-trial ghost persistence passed. Championship completion, saved rewards, both axis-inversion toggles, and all four About tabs passed final checks. Two standalone browser clients connected through real PeerJS signaling and entered a shared race without JavaScript errors.
Least helpful test: The initial system-Chrome screenshot run reported readiness but produced blank captures. It tested browser configuration more than the game; bundled Chromium with explicit software Vulkan flags resolved it.
Testing limits: Physical DualSense hardware, four separate remote machines, mixed browsers, and real-world NAT combinations were not tested. Software emulation verifies mappings, not physical controller feel.

Engine Feedback
Liked most: Three.js toon node materials and procedural geometry gave direct control over the art; Rapier supplied dependable collisions and fixed-step rigid bodies.
Stuck or guessed wrong: The system browser's WebGPU capture path was unreliable. Rendering worked with bundled Chromium and explicit SwiftShader/Vulkan flags. Tying input solely to rendering also missed short presses under stalls.
Most important custom system: The arcade vehicle controller, including momentum, grip, charged drifting, ordered checkpoints, combat, and local ownership of networked racers.
Hardest part: Keeping steering immediate while remote racers stay solid, combat resolves on the victim's copy, and the world continues behind multiplayer menus.
Remove or overhaul: Implicit renderer backend fallback. A strict rendering requirement should be explicit and easy to enforce; this game disables the fallback.
Change one thing: Add a documented public require-WebGPU option so applications do not need the renderer's internal fallback hook.

Prompt Feedback
Liked most: Strong source inspiration, cel-shaded art direction, code-written audio, and controller-first UX established a clear creative identity.
Confusing: Feature-complete does not specify a content count. This demo interprets it as a complete three-event championship plus repeatable quick races, time attack, and multiplayer, rather than a full commercial campaign.
Hardest part: Making racing, combat, progression, synthesized audio, and two multiplayer transports form one coherent, shareable HTML game.
One additional test: A four-person playtest with real DualSense controllers on different WebGPU devices and home networks, covering a complete championship-length session.
-->

<script>/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

				p.x + d.z * (offset + (side * width) / 2),
				y,
				p.z - d.x * (offset + (side * width) / 2),
			);
			norm.push(0, 1, 0);
		}
	}
	for (let i = 0; i < segments; i++) {
		const n = i * 2;
		idx.push(n, n + 2, n + 1, n + 1, n + 2, n + 3);
	}
	const g = new THREE.BufferGeometry();
	g.setAttribute("position", new THREE.Float32BufferAttribute(a, 3));
	g.setAttribute("normal", new THREE.Float32BufferAttribute(norm, 3));
	g.setIndex(idx);
	const m = mesh(g, color);
	m.material.side = THREE.DoubleSide;
	return m;
}

					Math.cos(a) * 0.68,
				);

	box(2.9, 0.09, 0.15, color, g, 0, 2.27, -1.86);
	box(2.7, 0.22, 0.3, 0xb5b5a0, g, 0, 0.65, 1.99, true);
	for (const s of [-1, 1])

	if (type === 2) {

			box(0.22, 0.4, 0.25, 0xbac0b3, g, i * 0.6, 0.8, 2.27);

	return g;
}

function clearWorld() {
	if (world) world.free();
	world = new RAPIER.World({ x: 0, y: -20, z: 0 });
	world.timestep = 1 / 60;
	if (trackGroup) {
		scene.remove(trackGroup);
		trackGroup.traverse((o) => {
			if (o.geometry) o.geometry.dispose();
			if (o.material?.map) {
				o.material.map.dispose();
				o.material.dispose();
			}
		});
	}
	trackGroup = new THREE.Group();
	scene.add(trackGroup);
	cars = [];
	projectiles = [];
	mines = [];
	particles = [];
	pickups = [];
	decor = [];
	ghost = null;
	hero = null;
	heroPad = null;
	pickupClaims.clear();
	remoteShots.clear();
}

	for (let i = 0; i < 10; i++) {

		const w = glowBox(

		hero.rotation.y = 0.45;
		heroPad.add(hero);
	}
}

function spawnCar(id, type, color, name, ai = false, remote = false, slot = 0) {
	const start = pathAt(0.986 - slot * 0.011, (slot % 2 ? 1 : -1) * 3.1),
		m = makeCar(type, color, id + 1);
	trackGroup.add(m);
	const desc = remote
		? RAPIER.RigidBodyDesc.kinematicPositionBased()
		: RAPIER.RigidBodyDesc.dynamic();
	desc
		.setTranslation(start.p.x, 0.16, start.p.z)

function checkpointCar(c) {

		near = nearest(pos.x, pos.z);

	c.trackT = near.t;

	if (
		Math.hypot(cp.x - pos.x, cp.z - pos.z) <
		TRACKS[trackIndex].width * 0.9 + 1
	) {
		c.checkpoint = c.nextCP;
		c.nextCP = (c.nextCP + 1) % 12;
		if (c.checkpoint === 0) {
			c.lap++;
			const lt = raceTime - c.lapStart;
			c.best = Math.min(c.best, lt);
			c.lapStart = raceTime;
			if (c === localCar) {
				audio.fxSound("pickup");
				if (c.lap < 3)
					say(
						c.lap === 2
							? "FINAL LAP! Leave nothing in the tank!"
							: "One down. The crowd wants more!",
					);
				const key = trackIndex + ":" + mode;
				if (!net && !attract && (!save.best[key] || lt < save.best[key])) {
					save.best[key] = lt;
					persist();
				}

			if (c.lap >= 3) {
				c.finish = raceTime;
				if (c === localCar) finishRace();
			}
		}
	}
	// Ordered gates prevent reverse driving, shortcuts across the entire map, and false laps.
	const segment = (c.nextCP + 11) % 12;
	let fraction = wrap(near.t - segment / 12) * 12;
	if (fraction > 2) fraction = 0;
	c.progress = c.lap + (segment + clamp(fraction, 0, 1)) / 12;

function aiControls(c, dt) {

		target = pathAt(n.t + look, Math.sin(c.id * 2.7 + raceTime * 0.1) * 2.5);

		err = angleDiff(desired, c.yaw);

		resetCar(c);
		c.stuck = 0;
	}
	const turn = clamp(-err * 2.8, -1, 1);
	const aggression = [0.73, 0.88, 1.0][settings.difficulty];
	const throttle = (Math.abs(err) > 0.95 ? 0.5 : 1) * aggression;
	const drift = Math.abs(err) > 0.35 && Math.abs(err) < 1.2 && c.speed > 15;
	const fire = c.cooldown <= 0 && Math.random() < dt * (attract ? 2 : 0.45);

			? Math.floor(raceTime / 7) % 3
			: Math.floor(Math.random() * 3);
	}
	return {
		x: turn,
		y: throttle,
		brake: Math.abs(err) > 1.2 ? 0.35 : 0,
		boost:
			(Math.abs(err) < 0.22 && c.nitro > 45) ||

		drift,
		fire,

function resetCar(c) {

	c.yaw = p.yaw;
	c.invulnerable = 2;
	c.resetCD = 3;
	c.offroad = 0;
	c.stuck = 0;
	c.stun = 0;

function respawn(c) {

	c.hp = c.maxHp;
	c.ammo = c.ammo.map((n, i) => Math.max(n, [3, 1, 1][i]));

	c.nitro = Math.max(c.nitro, 45);

function damage(c, amount, source) {
	if (c.invulnerable > 0 || c.dead > 0 || c.finish !== null || c.remote) return;
	c.hp -= amount;
	c.hits++;
	if (c === localCar) {
		shake = 1;
		haptic(0.6);
		audio.fxSound("boom");
	}
	const p = c.body.translation();
	emitParticles(p.x, 1.5, p.z, 0xffb957, 8, 4);
	if (c.hp <= 0) {
		c.dead = 2.3;
		c.hp = 0;
		c.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
		emitParticles(p.x, 1.2, p.z, 0xff9c48, 35, 11);
		const killer = cars.find((r) => r.id === source);
		if (killer) killer.kills++;
		if (net) sendNet({ t: "wreck", id: c.id, source, at: netClock() });
		if (c === localCar) say("You have been remixed. Rebuilding!");
		else if (source === localCar?.id) {

}

function spawnShot(s) {

		const m = new THREE.Group();

		body.rotation.x = Math.PI / 2;

			new THREE.ConeGeometry(0.23, 0.55, 6),

			0,
			0,

		);

			s.x + Math.sin(s.yaw) * 2.8,

			mesh: m,

		ring.position.set(s.x, 1, s.z);

		particles.push({
			mesh: ring,
			vx: 0,
			vy: 0,
			vz: 0,
			life: 0.65,
			max: 0.65,
			ring: true,

			const p = c.body.translation();

function emitParticles(x, y, z, color, count, speed) {
	for (let i = 0; i < count; i++) {
		const m = mesh(geos.particle, color, trackGroup, x, y, z);
		m.scale.setScalar(0.25 + Math.random() * 0.45);
		m.castShadow = false;
		const a = Math.random() * Math.PI * 2,
			v = (0.4 + Math.random()) * speed;
		particles.push({
			mesh: m,
			vx: Math.sin(a) * v,
			vy: Math.random() * speed * 0.7 + 2,
			vz: Math.cos(a) * v,
			life: 0.4 + Math.random() * 0.6,
			max: 1,
		});

function updateProjectiles(dt) {

		const p = s.mesh.position;
		s.travel += dt;
		p.x += s.vx * dt;
		p.z += s.vz * dt;
		let hit = false;
		for (const c of cars) {
			if (c.id === s.owner || c.dead > 0 || c.invulnerable > 0) continue;
			const cp = c.body.translation();
			if (
				Math.hypot(cp.x - p.x, cp.z - p.z) < 2.5 &&
				Math.abs(cp.y + 0.8 - p.y) < 2.6
			) {
				if (isOwner(c)) {
					damage(c, 34, s.owner);
					const v = c.body.linvel();
					c.body.setLinvel(
						{ x: v.x + s.vx * 0.06, y: v.y + 1, z: v.z + s.vz * 0.06 },
						true,
					);
					c.stun = 0.35;
				}
				hit = true;
				break;
			}
		}
		if (hit || s.life <= 0) {
			emitParticles(p.x, p.y, p.z, 0xffb06a, hit ? 12 : 3, 5);
			trackGroup.remove(s.mesh);
			projectiles.splice(i, 1);
		}

	for (let i = mines.length - 1; i >= 0; i--) {
		const s = mines[i];
		s.life -= dt;
		s.arm -= dt;
		s.mesh.rotation.y += dt * 2;
		const p = s.mesh.position;
		let hit = false;
		if (s.arm < 0)
			for (const c of cars) {
				if (c.id === s.owner || c.dead > 0) continue;
				const cp = c.body.translation();
				if (Math.hypot(cp.x - p.x, cp.z - p.z) < 2.5) {
					if (isOwner(c)) {
						damage(c, 45, s.owner);
						c.stun = 1.3;
						const v = c.body.linvel();
						c.body.setLinvel({ x: v.x * 0.4, y: 5, z: v.z * 0.4 }, true);
					}
					hit = true;
				}
			}

			if (hit) emitParticles(p.x, 0.6, p.z, 0xffad65, 20, 7);

function grantPickup(c, type, mult = 1) {

function updateVisuals(dt) {

			c.mesh.rotation.z,
			-(c.wasDrifting ? 0.09 : 0) * Math.sin(c.yaw * 3),

			c.mesh.rotation.x,

				0x65e4ef,
				1,
				1.5,

function fixedUpdate(dt) {
	if (ended) return;
	simTime += dt;

		updateVisuals(dt);
		return;
	}
	if (overlay && !net) {
		updateVisuals(dt);
		return;
	}
	if (net) {
		const t = netClock();
		countdown = t < 0 ? -t / 1000 : 0;
		if (!Number.isFinite(countdown)) countdown = 99;
		if (t >= 0) raceTime = t / 1000;

	else raceTime += dt;

		$("countdown").textContent =
			countdown > 10 ? "GET READY" : Math.ceil(countdown);
		world.step();
		updateVisuals(dt);
		return;
	}
	if (!raceStarted) {
		raceStarted = true;
		audio.tone(900, 0.3, "square", 0.2);
		say("LET THE RIOT BEGIN!");
	}
	$("countdown").textContent = raceTime < 0.8 ? "GO!" : "";
	for (const c of cars) {
		if (c.remote) {
			updateRemote(c);
			continue;
		}
		const u = c.ai
			? aiControls(c, dt)
			: overlay
				? { x: 0, y: 0, brake: 0, fire: false, boost: false, drift: false }
				: input;
		controlCar(c, u, dt);
	}
	world.step();
	for (const c of cars)
		if (!c.remote && c.dead <= 0 && c.finish === null) checkpointCar(c);
	updateProjectiles(dt);
	updatePickups(dt);
	updateVisuals(dt);

		localCar &&
		Math.floor(raceTime * 10) > ghostRecord.length &&
		mode === "trial" &&
		localCar.finish === null
	) {
		const p = localCar.body.translation();
		ghostRecord.push([
			+p.x.toFixed(2),
			+p.y.toFixed(2),
			+p.z.toFixed(2),
			+localCar.yaw.toFixed(3),
		]);
	}
	if (net) {
		netTimer += dt;
		if (netTimer > 1 / 15) {
			netTimer = 0;
			sendState();
		}
		if (AIHub.active && localCar)
			AIHub.progress({
				score: Math.round(localCar.progress * roadLength),
				label: `Lap ${Math.min(3, localCar.lap + 1)} of 3`,
			});
	}

}
function sortedCars() {
	return [...cars].sort((a, b) =>

			? a.finish - b.finish

				? -1

	);

function finishRace(timeUp = false) {

		setTimeout(() => {
			if (attract) startRace("attract", (trackIndex + 1) % 3);
		}, 2400);
		raceFinished = true;
		return;
	}
	raceFinished = true;
	const order = sortedCars(),
		rank = order.indexOf(localCar) + 1,
		reward =
			Math.max(150, 850 - rank * 100) +
			(localCar?.kills || 0) * 150 +
			(localCar?.drifts || 0) * 25;
	results = {
		order: order.map((c) => ({
			id: c.id,
			name: c.name,
			time: c.finish,
			progress: c.progress,
		})),
		rank,
		reward,
		time: raceTime,
		best: localCar?.best,
		kills: localCar?.kills || 0,
		drifts: localCar?.drifts || 0,
		pickups: localCar?.pickups || 0,
		timeUp,
	};
	if (net) {
		if (localCar) {
			sendNet({
				t: "done",
				id: localCar.id,
				time: localCar.finish,
				at: netClock(),
			});
			if (AIHub.active) {
				const out = {
					stats: {
						laps: localCar.lap,
						wrecks: localCar.kills,
						"best lap": Number.isFinite(localCar.best)
							? clockString(localCar.best)
							: "—",
					},
				};
				if (timeUp) out.score = Math.round(localCar.progress * roadLength);
				else out.time = Math.round(netClock());

			}
		}
		showResults();

	}
	save.credits += reward;
	if (mode === "championship" && campaign) {
		const points = [12, 9, 7, 5, 3, 1];
		order.forEach(
			(c, i) =>
				(campaign.points[c.id] = (campaign.points[c.id] || 0) + points[i]),

		campaign.round++;
		save.campaign = campaign.round < 3 ? campaign : null;
	}
	if (mode === "trial" && !timeUp) {
		const old = save.ghosts[trackIndex];
		if (!old || raceTime < old.time) {
			save.ghosts[trackIndex] = { time: raceTime, frames: ghostRecord };
			results.record = true;
		}
	}
	persist();
	showResults();
	audio.voice();
}

function drawMap() {
	const ctx = $("minimap").getContext("2d"),
		w = 300,
		h = 230;
	ctx.clearRect(0, 0, w, h);
	const sx = (x) => w / 2 + x * 1.92,
		sz = (z) => h / 2 + z * 1.75;
	ctx.lineJoin = "round";
	ctx.lineWidth = 14;
	ctx.strokeStyle = "#546275";
	ctx.beginPath();
	samples.forEach((p, i) =>
		i ? ctx.lineTo(sx(p.x), sz(p.z)) : ctx.moveTo(sx(p.x), sz(p.z)),
	);
	ctx.closePath();
	ctx.stroke();
	ctx.lineWidth = 9;
	ctx.strokeStyle = "#202c40";
	ctx.stroke();
	const start = pathAt(0).p;
	ctx.fillStyle = "#ffffff";
	ctx.fillRect(sx(start.x) - 3, sz(start.z) - 5, 6, 10);
	for (const c of cars) {
		if (c.dead > 0) continue;
		const p = c.body.translation();
		ctx.beginPath();
		ctx.arc(sx(p.x), sz(p.z), c === localCar ? 5.5 : 3.4, 0, Math.PI * 2);
		ctx.fillStyle = c.color;
		ctx.fill();
		if (c === localCar) {
			ctx.strokeStyle = "#ffffff";
			ctx.lineWidth = 2;
			ctx.stroke();
		}
	}
	ctx.font = "700 10px sans-serif";
	ctx.fillStyle = "#bdc4ca";
	ctx.fillText("LIVE TRACK", 12, 20);
}

// Shared-course networking: the same game protocol rides on the Hub or WebRTC.
function sendNet(data, opts = {}) {
	if (net && !ended) net.send(data, opts);
}
function sendState(teleport = false) {
	if (!net || !localCar || ended) return;
	const owned = cars.filter((c) => !c.remote);
	const state = owned.map((c) => {
		const p = c.body.translation(),
			v = c.body.linvel();
		return [
			c.id,
			+p.x.toFixed(2),
			+p.y.toFixed(2),
			+p.z.toFixed(2),
			+v.x.toFixed(2),
			+v.y.toFixed(2),
			+v.z.toFixed(2),
			+c.yaw.toFixed(3),
			+c.speed.toFixed(2),
			Math.round(c.hp),
			Math.round(c.nitro),
			c.lap,
			+c.progress.toFixed(4),
			c.finish,
			+c.dead.toFixed(2),
			c.boosting ? 1 : 0,
			c.nextCP,

	});

		{ t: "p", at: netClock(), s: state, warp: teleport },

function receiveNet(d, from) {
	if (!d || typeof d !== "object" || ended) return;
	const aiOwner = net ? Math.min(...net.players.map((p) => p.id)) : -1;
	if (d.t === "p" && Array.isArray(d.s) && Number.isFinite(d.at))
		for (const a of d.s) {
			if (
				!Array.isArray(a) ||
				a.length < 17 ||
				!a.slice(0, 13).every(Number.isFinite)
			)
				continue;
			const c = cars.find((c) => c.id === a[0]);
			if (
				!c ||
				!c.remote ||
				!(c.id === from || (c.ai && from === aiOwner)) ||
				d.at <= c.lastNet
			)
				continue;
			c.lastNet = d.at;
			c.hp = a[9];
			c.nitro = a[10];
			c.lap = a[11];
			c.progress = a[12];
			c.finish = a[13];
			c.dead = a[14];
			c.boosting = !!a[15];
			c.nextCP = a[16];
			c.checkpoint = (c.nextCP + 11) % 12;
			c.speed = a[8];
			const s = {
				at: d.at,
				x: a[1],
				y: a[2],
				z: a[3],
				vx: a[4],
				vy: a[5],
				vz: a[6],
				yaw: a[7],
			};
			if (
				d.warp ||
				!c.samples.length ||
				Math.hypot(c.samples.at(-1).x - s.x, c.samples.at(-1).z - s.z) > 30
			) {
				c.samples = [s];
				c.body.setTranslation({ x: s.x, y: s.y, z: s.z }, true);
			} else {
				c.samples.push(s);
				if (c.samples.length > 8) c.samples.shift();
			}
		}
	if (
		d.t === "shot" &&
		(d.owner === from || (from === aiOwner && d.owner >= 100)) &&
		[d.x, d.y, d.z, d.yaw, d.at].every(Number.isFinite) &&
		[0, 1, 2].includes(d.w)
	)
		spawnShot(d);
	if (d.t === "take" && Number.isInteger(d.id) && Number.isFinite(d.at)) {
		const p = pickups.find((p) => p.id === d.id),
			old = pickupClaims.get(d.id);
		if (!p) return;
		const wins =
			!old ||
			d.at > old.at + 8500 ||
			d.at < old.at ||
			(d.at === old.at && d.by < old.by);
		if (wins) {
			if (old?.by === localCar?.id && d.at < old.at + 8500) {
				grantPickup(localCar, p.type, -1);
			}
			pickupClaims.set(d.id, { at: d.at, by: d.by });
			p.until = d.at / 1000 + 9;
		}
	}
	if (d.t === "wreck") {
		const killer = cars.find((c) => c.id === d.source);
		if (killer && !killer.remote) {
			killer.kills++;
			if (killer === localCar) {
				toast("RIVAL WRECKED · CLEAN HIT");
				audio.fxSound("pickup");
			}
		}
	}
	if (d.t === "done") {
		const c = cars.find((c) => c.id === from);
		if (c && Number.isFinite(d.time)) {
			c.finish = d.time;
			c.progress = 3;
		}
	}
}
function updateRemote(c) {
	if (!c.samples.length) return;
	const now = netClock(),
		last = c.samples.at(-1),
		p = localCar?.body.translation(),
		close = p && Math.hypot(p.x - last.x, p.z - last.z) < 18;
	const wanted = now - (close ? 0 : 130);
	let a = c.samples[0],
		b = a;
	for (const s of c.samples) {
		if (s.at <= wanted) a = s;
		if (s.at >= wanted) {
			b = s;
			break;
		}
		b = s;
	}
	let x, y, z, yaw;
	if (wanted > last.at) {
		const dt = clamp((wanted - last.at) / 1000, 0, 0.2);
		x = last.x + last.vx * dt;
		y = last.y + last.vy * dt;
		z = last.z + last.vz * dt;
		yaw = last.yaw;
	} else {
		const f = a.at === b.at ? 0 : clamp((wanted - a.at) / (b.at - a.at), 0, 1);
		x = lerp(a.x, b.x, f);
		y = lerp(a.y, b.y, f);
		z = lerp(a.z, b.z, f);
		yaw = a.yaw + angleDiff(b.yaw, a.yaw) * f;
	}
	c.body.setNextKinematicTranslation({ x, y, z });
	c.body.setNextKinematicRotation({
		x: 0,
		y: Math.sin(yaw / 2),
		z: 0,
		w: Math.cos(yaw / 2),
	});
	c.yaw = yaw;
}
function removePlayer(id) {
	if (!net) return;
	net.players = net.players.filter((p) => p.id !== id);
	const c = cars.find((c) => c.id === id);
	if (c) {
		world.removeRigidBody(c.body);
		trackGroup.remove(c.mesh);
		cars = cars.filter((q) => q !== c);
	}
	if (isAiOwner())
		for (const ai of cars.filter((c) => c.ai && c.remote)) {
			const p = ai.body.translation();
			ai.body.setBodyType(RAPIER.RigidBodyType.Dynamic, true);
			ai.remote = false;
			ai.samples = [];
			ai.body.setTranslation(p, true);
		}

}

async function loadPeer() {
	if (window.Peer) return;
	await new Promise((resolve, reject) => {
		const s = document.createElement("script");
		s.src = "https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js";
		s.onload = resolve;
		s.onerror = () =>
			reject(
				new Error("Could not load the room service. Check your connection."),
			);
		document.head.append(s);
	});
}
function closeRoom() {
	if (room) {
		room.peer?.destroy();
		room = null;
	}
	net = null;
}
async function createRoom(joinCode = null) {
	closeRoom();
	showLobby("Connecting to the room service…");
	try {
		await loadPeer();
		const code =
				joinCode ||
				String(
					(crypto.getRandomValues(new Uint32Array(1))[0] % 900000) + 100000,
				),
			host = !joinCode;
		const peer = new Peer(host ? "rrr-v1-" + code : undefined, { debug: 0 });
		room = {
			peer,
			code,
			host,
			connections: new Map(),
			players: [],
			me: host ? 0 : null,
			nextId: 1,
			started: false,
		};
		const r = room;
		const timer = setTimeout(() => {
			if (room === r && !r.open)
				showLobby("Connection timed out. Check your network, then try again.");
		}, 15000);
		peer.on("error", (e) => {
			if (room !== r) return;
			const message =
				e.type === "unavailable-id"
					? "That room code is busy. Create a new room."
					: e.type === "peer-unavailable"
						? "Room not found. Check the six digits."
						: "Connection failed: " + e.type;
			toast(message);
			showLobby(message);
		});
		peer.on("open", () => {
			if (room !== r) return;
			r.open = true;
			clearTimeout(timer);
			if (host) {
				r.players = [{ id: 0, name: "LIME COMET", color: PALETTE[0] }];
				showLobby("Room open. Share the six digits in your own app.");
			} else {
				const conn = peer.connect("rrr-v1-" + code, { reliable: true });
				r.hostConn = conn;
				conn.on("open", () => {
					conn.send({ kind: "join" });
					showLobby("Connected. Waiting for the grid…");
				});
				conn.on("data", (m) => handlePeerMessage(m, 0));
				conn.on("close", () => {
					if (room !== r) return;
					if (r.started) {
						net = null;
						for (const c of cars.filter((c) => c.remote)) {
							c.remote = false;
							c.ai = true;
							c.body.setBodyType(RAPIER.RigidBodyType.Dynamic, true);
						}
						toast("Room closed. Computer drivers take over.");
					} else
						showLobby(
							"Host disconnected. Return to the online menu to reconnect.",
						);
				});
			}
		});
		if (host)
			peer.on("connection", (conn) => {
				if (room !== r) return;
				let id = null;
				conn.on("data", (m) => {
					if (m.kind === "join") {
						if (r.started || r.players.length >= 4) {
							conn.send({
								kind: "reject",
								reason: r.started ? "Race already started." : "Room is full.",
							});
							setTimeout(() => conn.close(), 400);
							return;
						}
						if (id !== null) return;
						id = r.nextId++;
						if (id > 3) {
							conn.send({
								kind: "reject",
								reason: "Please create a fresh room.",
							});
							return;
						}
						r.connections.set(id, conn);
						r.players.push({
							id,
							name: ["LIME COMET", "EMBER FOX", "CYAN VIPER", "VIOLET ACE"][id],
							color: PALETTE[id],
						});
						conn.send({ kind: "welcome", me: id, players: r.players });
						broadcastPeer({ kind: "roster", players: r.players });
						showLobby("Grid ready. The host starts the race.");
					} else if (id !== null) handlePeerMessage(m, id);
				});
				conn.on("close", () => {
					if (id === null || room !== r) return;
					r.connections.delete(id);
					r.players = r.players.filter((p) => p.id !== id);
					broadcastPeer({ kind: "leave", id });
					if (r.started) removePlayer(id);
					else showLobby("A seat is open.");
				});
			});
	} catch (e) {
		showLobby(e.message);
	}
}
function broadcastPeer(m, except = null) {
	if (!room) return;
	for (const [id, c] of room.connections)
		if (id !== except && c.open) c.send(m);
}
function handlePeerMessage(m, from) {
	if (!room || !m || typeof m !== "object") return;
	if (m.kind === "welcome") {
		room.me = m.me;
		room.players = m.players;
		showLobby("Ready. Waiting for the host to start.");
	}
	if (m.kind === "roster") {
		room.players = m.players;
		showLobby("Ready. Waiting for the host to start.");
	}
	if (m.kind === "reject") {
		showLobby(m.reason);
	}
	if (m.kind === "leave") removePlayer(m.id);
	if (m.kind === "start" && !room.host) beginPeerRace(m);
	if (m.kind === "game") {
		if (room.host) {
			const env = { kind: "game", from, data: m.data };
			broadcastPeer(env, from);
			receiveNet(m.data, from);
		} else receiveNet(m.data, m.from);
	}
}
function beginPeerRace(m = null) {
	if (!room) return;
	if (room.host && !m) {
		m = {
			kind: "start",
			goAt: Date.now() + 4000,
			track: selectedTrack,
			players: room.players,
		};
		broadcastPeer(m);
	}
	room.started = true;
	room.players = m.players;
	netStartedAt = performance.now() + m.goAt - Date.now();
	net = {
		me: room.me,
		players: room.players.map((p) => ({ ...p })),
		kind: "peer",
		send: (d, o) => {
			if (room?.host) broadcastPeer({ kind: "game", from: room.me, data: d });
			else if (room?.hostConn?.open)
				room.hostConn.send({ kind: "game", data: d });
		},
	};
	startRace("online", m.track);
}

	$("loadfill").style.background = "#ff8058";
	$("loadtext").innerHTML =
		`<strong>${escapeHTML(e.message || String(e))}</strong><br><br>This game requires WebGPU in a secure context (HTTPS or localhost). Use a browser with WebGPU enabled. Reload after checking your browser and connection.<br><br><button id="retry" class="action primary">RELOAD</button>`;
	$("retry").onclick = () => location.reload();
}
async function boot() {
	try {
		$("loadtext").textContent = "Loading Three.js R180 and Rapier 0.19.3…";
		const libs = await Promise.all([import("three"), import("rapier")]);
		THREE = libs[0];
		RAPIER = libs[1].default;
		$("loadfill").style.width = "35%";
		if (!navigator.gpu)
			throw new Error("WebGPU is not available in this browser.");
		const [adapter] = await Promise.all([
			navigator.gpu.requestAdapter(),
			RAPIER.init(),
		]);
		if (!adapter) throw new Error("No WebGPU graphics adapter was found.");
		renderer = new THREE.WebGPURenderer({
			canvas: $("world"),
			antialias: true,
			alpha: false,
		});
		renderer._getFallback = null;
		await renderer.init();
		if (!renderer.backend.isWebGPUBackend)
			throw new Error("A WebGPU backend is required.");
		renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
		renderer.setSize(innerWidth, innerHeight);
		renderer.shadowMap.enabled = true;
		renderer.shadowMap.type = THREE.PCFShadowMap;
		renderer.outputColorSpace = THREE.SRGBColorSpace;
		renderer.toneMapping = THREE.ACESFilmicToneMapping;
		renderer.toneMappingExposure = 1.2;
		renderer.onDeviceLost = (info) => {
			console.error("WebGPU device loss", info);
			failBoot(
				new Error(
					"The WebGPU device was lost. Reload to resume your saved tour.",
				),
			);
		};
		scene = new THREE.Scene();
		camera = new THREE.OrthographicCamera(-60, 60, 32, -32, 0.1, 600);
		camLook = new THREE.Vector3(2, 1, 0);
		camPos = new THREE.Vector3(92, 88, 105);
		const sun = new THREE.DirectionalLight(0xffdfae, 3.1);
		sun.position.set(-55, 90, 40);
		sun.castShadow = true;
		sun.shadow.mapSize.set(2048, 2048);
		Object.assign(sun.shadow.camera, {
			left: -105,
			right: 105,
			top: 100,
			bottom: -100,
			near: 1,
			far: 230,
		});
		sun.shadow.normalBias = 0.06;
		sun.shadow.bias = -0.001;
		scene.add(sun);
		scene.add(new THREE.HemisphereLight(0xe5efff, 0x73517a, 2));
		const rim = new THREE.DirectionalLight(0x98e8f1, 1.2);
		rim.position.set(40, 20, -50);
		scene.add(rim);
		gradient = new THREE.DataTexture(
			new Uint8Array([65, 135, 235]),
			3,
			1,
			THREE.RedFormat,
		);
		gradient.minFilter = THREE.NearestFilter;
		gradient.magFilter = THREE.NearestFilter;
		gradient.needsUpdate = true;
		outlineMat = new THREE.LineBasicNodeMaterial({ color: 0x192437 });
		geos.particle = new THREE.BoxGeometry(1, 1, 1);
		$("loadfill").style.width = "70%";
		$("loadtext").textContent =
			"Building the Cinder Circuit. Soundcheck in progress…";
		addEventListener("resize", resize);
		AIHub.probe(() => ({
			scene:
				ended || screen === "results"
					? "over"
					: screen === "race"
						? raceStarted
							? "play"
							: "ready"
						: screen === "title"
							? "title"
							: "menu",
			menu: !!overlay,
			world: simTime,
			input: { x: input.x, y: input.y, fire: input.fire, brake: input.brake },
		}));
		const connected = AIHub.active ? await setupHub() : false;
		if (!connected) showTitle();
		await renderer.compileAsync(scene, camera);
		if (AIHub.active && localReady) AIHub.ready();
		$("loadfill").style.width = "100%";
		$("loading").classList.add("hidden");
		lastInput = performance.now();
		setInterval(pollInput, 1000 / 60);
		renderer.setAnimationLoop(frame);
		// A read-only inspection surface for lightweight QA and designer iteration.
		window.Riot = {
			version: "1.0.0",
			inspect: () => ({
				screen,
				overlay: overlay?.kind,
				attract,
				mode,
				track: trackIndex,
				time: raceTime,
				countdown,
				backend: renderer.backend.constructor.name,
				rapier: RAPIER.version(),
				cars: cars.map((c) => ({
					id: c.id,
					name: c.name,
					hp: c.hp,
					lap: c.lap,
					nextCP: c.nextCP,
					progress: c.progress,
					finish: c.finish,
					speed: c.speed,
					remote: c.remote,
					position: c.body.translation(),
				})),
				network: net?.kind || null,
				settings: { ...settings },
				save: structuredClone(save),
			}),
			get ready() {
				return !!renderer;
			},
		};
	} catch (e) {
		failBoot(e);
	}
}
boot();
</script>
