<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#75d5f2" />
  <meta name="description" content="Lemonade Day — plan a lemonade stand across a colorful low-poly town: read the forecast, tune the recipe, schedule the Sunshine Crew and win over the neighborhood in seven summer days." />
  <title>Lemonade Day</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- The shared 3D stack. Every 3D game carries this block unchanged. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/lib/three/three.webgpu.js",
      "three/webgpu": "/lib/three/three.webgpu.js",
      "three/tsl": "/lib/three/three.tsl.js",
      "three/addons/": "/lib/three/addons/",
      "kit/": "/lib/kit/"
    }
  }
  </script>
  <link rel="modulepreload" href="/lib/three/three.core.js" />
  <link rel="modulepreload" href="/lib/three/three.webgpu.js" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root">
    <main class="game-shell" id="game-shell" data-layer="game" data-base="true" hidden>
      <header class="game-topbar" id="topbar"></header>
      <section class="game-stage" id="stage">
        <div class="world-panel">
          <div class="scene-mount weather-sunny" id="scene-mount"></div>
          <div class="world-ui" id="world-ui"></div>
        </div>
        <aside class="planner" id="planner" aria-label="Daily stand planner"></aside>
      </section>
    </main>
    <div id="title-root"></div>
    <div id="overlay-root"></div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
