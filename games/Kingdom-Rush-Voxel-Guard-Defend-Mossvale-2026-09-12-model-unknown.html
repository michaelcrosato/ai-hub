class AudioCues {
  constructor(){this.muted=false;this.ctx=null;this.last=0;try{this.muted=localStorage.getItem('voxel-guard-muted')==='true';}catch{}}
  unlock(){if(this.muted)return;try{this.ctx??=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();}catch{}}
  tone(freq=500,duration=.07,volume=.025,type='triangle'){if(this.muted||!this.ctx||this.ctx.state!=='running')return;const now=this.ctx.currentTime;if(now-this.last<.045)return;this.last=now;const osc=this.ctx.createOscillator(),gain=this.ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);osc.frequency.exponentialRampToValueAtTime(Math.max(30,freq*.5),now+duration);gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain).connect(this.ctx.destination);osc.start(now);osc.stop(now+duration);}
  toggle(){this.muted=!this.muted;this.unlock();try{localStorage.setItem('voxel-guard-muted',String(this.muted));}catch{}updateSound();}
}
const audio=new AudioCues();
// Browsers start audio only inside a user gesture.
for(const type of ['pointerdown','keydown'])addEventListener(type,()=>audio.unlock(),{capture:true,passive:true});
function updateSound(){$('#sound-button').innerHTML=icon(audio.muted?'mute':'sound');$('#sound-button').title=audio.muted?'Sound off [M]':'Sound on [M]';$('#sound-button').setAttribute('aria-label',audio.muted?'Enable sound':'Mute sound');}
function toast(text,type='info'){const div=document.createElement('div');div.className='toast '+type;div.innerHTML=icon(type==='error'?'shield':type==='success'?'check':'cube');const span=document.createElement('span');span.textContent=text;div.append(span);$('#toasts').append(div);while($('#toasts').children.length>3)$('#toasts').firstChild.remove();setTimeout(()=>div.remove(),4200);}

function openGuide(tab='waves'){const tabs=`<div class="guide-tabs">${[['waves','Wave plan'],['enemies','Enemy guide'],['weapons','Weapons'],['controls','Controls']].map(([key,name])=>`<button data-guide-tab="${key}" class="${key===tab?'active':''}">${name}</button>`).join('')}</div>`;let content='';

  if(tab==='enemies')content=`<p class="guide-note">Base health is shown below. Enemy health and shields rise by 6.5% of base per wave after wave 1. Difficulty also changes health.</p><div class="field-grid">${ENEMIES.map(e=>`<article class="field-card"><img src="${images.enemies[e.id]}" alt="${e.name}"><div><h3>${e.name}${e.boss?'<span class="boss-tag">BOSS</span>':''}</h3><span class="field-stats">${e.hp} HP${e.shield?` + ${e.shield} shield`:''} · ${e.speed} m/s · ${e.leak} base damage</span><p>${e.desc}</p><strong class="counter">Counter: ${e.counter}</strong></div></article>`).join('')}</div>`;
  if(tab==='weapons')content=`<div class="field-grid">${TOWERS.map(t=>`<article class="field-card"><img src="${images.towers[t.id]}" alt="${t.name}"><div><h3>${t.name}<span class="field-cost">${t.cost} coins</span></h3><span class="field-stats">${t.damage} damage · ${t.range} m · ${(1/t.interval).toFixed(1)} shots/s</span><p>${t.desc}</p><strong class="counter">${t.air?'Ground and air':'Ground only'} · ${t.element} damage</strong></div></article>`).join('')}</div>`;
  if(tab==='controls')content=`<div class="control-guide"><section><h3>Build, then defend.</h3><p>Select a tower from the armory. Click clear grass to place it. The dotted line shows its range. Shift-click to place more than one.</p><p>Click a built tower to upgrade it, change its target rule, or sell it. A sale returns 70% of the coins spent. The two free starter towers have no sale value until you upgrade them.</p><p>Keep enemies away from your keep. Clear all 20 waves to win. The game saves at build phases. Reloading restores the last build phase, not a wave in progress.</p></section><section><h3>Stay involved.</h3><p>Right-click the map to move your hero. The hero walks around solid objects, attacks on its own, and gains levels from kills across the map.</p><p>Skyfall and targeted hero skills need a map click. Deep freeze and Rook's Overdrive take effect at once. Cancel a target without spending its cooldown.</p><div class="key-table">${[['1–9, 0, −, =','Select a tower'],['Q / W / E','Skyfall / Freeze / Hero skill'],['H','Move hero'],['Space','Start a wave, or pause / resume'],['P','Pause / resume'],['F','Cycle 1×, 2×, 3× speed'],['M','Mute / enable sound'],['I','Open the field guide'],['F2','Open the test lab'],['F9','Graphics settings'],['Esc / Right-click','Cancel placement or targeting'],['Mouse wheel','Zoom the map']].map(([k,v])=>`<div><kbd>${k}</kbd><span>${v}</span></div>`).join('')}</div></section><section class="pad-guide"><h3>Controller and touch.</h3><p>On a controller, the left stick moves a cursor over the map and the menus. On a touch screen, tap to build, select, and target. Press and hold the map to move your hero. Pinch to zoom.</p><div class="key-table">${[['Left stick','Move the cursor'],['D-pad','Jump between buttons'],['A','Click · place · confirm'],['B','Cancel · close · deselect'],['X','Move hero to the cursor'],['Y','Start a wave, or pause / resume'],['LT / RT','Previous / next tower'],['LB / RB','Zoom out / in'],['Right stick','Rotate the map · scroll lists'],['R3','Reset the view'],['View','Open the field guide'],['Start','Pause / resume']].map(([k,v])=>`<div><kbd>${k}</kbd><span>${v}</span></div>`).join('')}</div></section></div>`;
  openModal(`${modalHeader('KNOW YOUR DEFENSE','Field guide')}${tabs}<div class="guide-body">${content}</div>`,'guide-modal');$$('[data-guide-tab]').forEach(b=>b.onclick=()=>openGuide(b.dataset.guideTab));if(via()==='gamepad')padCursor.snapTo($(`[data-guide-tab="${tab}"]`));}

point exceeds the 2 MB limit.');const data=JSON.parse(await file.text());Game.restore(data);openModal(`${modalHeader('RESTORE CHECKPOINT','Replace the current defense?')}<p class="modal-intro">The checked file has ${data.wave} completed waves and ${data.towers.length} towers. This replaces the current game.</p><div class="result-actions"><button id="import-cancel" class="secondary-button">Cancel</button><button id="import-confirm" class="primary-button">Restore checkpoint</button></div>`);$('#import-cancel').onclick=openSettings;$('#import-confirm').onclick=()=>{const restored=Game.restore(data,handleEvent);view.clear();lab=false;game=restored;selectedTowerId=null;action=null;accumulator=0;closeModal(true);renderArmory();renderInspector();save();updateUI();if(!game.hero)openHeroes();toast('Checkpoint restored.','success');};}catch(error){toast('Checkpoint rejected: '+error.message,'error');}};$('#export-save').onclick=()=>{let snapshot=game.checkpoint();if(!snapshot){try{snapshot=JSON.parse(localStorage.getItem(SAVE_KEY));}catch{}}if(snapshot)downloadJSON(snapshot,'voxel-guard-checkpoint.json');else toast('No build-phase checkpoint is available yet.','error');};$('#open-lab').onclick=openLab;$('#new-game').onclick=()=>newGame($('#new-difficulty').value);}

b-jump').onclick=()=>{enableLab();game.enemies=[];game.projectiles=[];game.pendingSpawns=[];game.queue=[];game.lives=SETTINGS.startingLives;game.cooldowns={meteor:0,freeze:0,hero:0};game.phase='build';game.wave=Number($('#lab-wave').value)-1;game.paused=false;game.auto=false;view.clear();closeModal(true);toast(`Wave ${game.wave+1} is ready. Press Start wave.`);updateUI();};$('#lab-export').onclick=()=>downloadJSON({version:VERSION,mode:game.mode,testLab:lab,seed:game.seed,renderer:{backend:kit.backend,three:THREE.REVISION,tier:kit.tier.name},stats:game.stats,waves:game.metrics,towers:game.towers.map(t=>({type:t.type,level:t.level,x:t.x,z:t.z,kills:t.kills,damage:Math.round(t.damage),spent:t.paid})),hero:game.hero?{id:game.hero.id,level:game.hero.level,kills:game.hero.kills,damage:Math.round(game.hero.damage)}:null},'voxel-guard-balance-report.json');$('#lab-return').onclick=()=>closeModal();}

/** Controller cursor: the left stick moves it over the map and every menu, the D-pad jumps between buttons, A clicks. */
const padCursor=(()=>{
  const el=document.createElement('div');el.className='pad-cursor';el.hidden=true;el.setAttribute('aria-hidden','true');document.body.append(el);
  const CLICKABLE='button:not([disabled]),select,summary,a[href]';
  let x=innerWidth*.38,y=innerHeight*.45,active=false,hot=null,drawn='',repeatAt=0,repeatDir=null;
  const scope=()=>modalOpen?$('#modal'):$('#app');
  const visible=b=>{if(b.offsetParent===null&&getComputedStyle(b).position!=='fixed')return false;const r=b.getBoundingClientRect();return r.width>0&&r.height>0;};
  const clamp=()=>{x=Math.max(2,Math.min(innerWidth-2,x));y=Math.max(2,Math.min(innerHeight-2,y));};
  function under(){const hit=document.elementFromPoint(x,y);if(!hit)return null;if(hit===kit.canvas)return 'map';const b=hit.closest(CLICKABLE);return b&&scope().contains(b)?b:null;}
  function setHot(next){if(next===hot)return;if(hot&&hot!=='map')hot.classList.remove('pad-hover');hot=next;if(hot&&hot!=='map')hot.classList.add('pad-hover');}
  function draw(){const t=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;if(t!==drawn){drawn=t;el.style.transform=t;}}
  function snapTo(b){if(!b||!active)return;b.scrollIntoView?.({block:'nearest',inline:'nearest'});const r=b.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2;clamp();draw();}
  /** Spatial navigation: the nearest button in that direction, favouring ones in line with the cursor. */
  function jump(dir){const [dx,dy]=dir==='Up'?[0,-1]:dir==='Down'?[0,1]:dir==='Left'?[-1,0]:[1,0];let best=null,score=Infinity;
    for(const b of scope().querySelectorAll(CLICKABLE)){if(!visible(b))continue;const r=b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,along=(cx-x)*dx+(cy-y)*dy,across=Math.abs((cx-x)*dy)+Math.abs((cy-y)*dx);if(along<6||across>along*1.5)continue;const s=along+across*2.5;if(s<score){score=s;best=b;}}
    if(best)snapTo(best);}
  const scrollable=n=>{if(n.scrollHeight<=n.clientHeight+2)return false;const o=getComputedStyle(n).overflowY;return o==='auto'||o==='scroll';};
  /** Right stick: scroll the list under the cursor, or the open dialog's list. */
  function scrollUnder(amount){let n=document.elementFromPoint(x,y);while(n&&n!==document.body){if(scrollable(n)){n.scrollTop+=amount;return;}n=n.parentElement;}if(modalOpen){const box=[...$('#modal').querySelectorAll('.guide-body,.hero-choices')].find(scrollable)||$('#modal');box.scrollTop+=amount;}}
  return {
    snapTo,
    get active(){return active;},
    update(dt){const on=kit.input.source==='gamepad'&&!kit.menu.isOpen;if(on!==active){active=on;el.hidden=!on;if(!on)setHot(null);else{clamp();draw();}}if(!on)return;
      const v=kit.input.vector('cursor'),m=Math.hypot(v.x,v.y);if(m>0){const speed=Math.min(innerWidth,innerHeight)*1.5*m;x+=v.x*speed*dt;y-=v.y*speed*dt;clamp();}
      const now=performance.now();for(const dir of ['Up','Down','Left','Right']){const name='nav'+dir;if(kit.input.pressed(name)){jump(dir);repeatDir=dir;repeatAt=now+380;}else if(repeatDir===dir&&kit.input.down(name)&&now>repeatAt){jump(dir);repeatAt=now+130;}else if(repeatDir===dir&&!kit.input.down(name))repeatDir=null;}
      const look=kit.input.look('look');if(look.y)scrollUnder(look.y*420);
      draw();const target=under();setHot(target);
      if(target==='map'){const p=view.local(x,y),g=view.groundAt(p.x,p.y);if(!hoverPoint||Math.abs(g.x-hoverPoint.x)>1e-4||Math.abs(g.z-hoverPoint.z)>1e-4){hoverPoint=g;if(action)updatePlacement();}}},
    /** A: click the button under the cursor, or the map. */
    click(){if(!active)return;const target=under();if(target==='map'){const p=view.local(x,y);mapClick(p.x,p.y,false);}else if(target?.tagName==='SELECT'){target.selectedIndex=(target.selectedIndex+1)%target.options.length;target.dispatchEvent(new Event('change',{bubbles:true}));}else target?.click();},
    /** X: send the hero to the point under the cursor. */
    heroHere(){if(!active||modalOpen)return;if(under()==='map'){const p=view.local(x,y);mapAlt(p.x,p.y);}},
  };
})();

// A HUD button clicked or tapped hands focus back, so Space keeps starting and pausing waves
// (as the original's document Space handler did). The kit's :focus-visible test is not enough here:
// Chromium and WebKit mark a mouse-focused button focus-visible as soon as a key goes down.

document.addEventListener('click',e=>{if(!e.detail)return;const b=e.target.closest?.('button,a[href]');if(b&&!b.closest('#modal-layer')&&$('#app').contains(b))b.blur();},true);
// Keep keyboard focus inside an open dialog.
document.addEventListener('keydown',e=>{if(!modalOpen||e.code!=='Tab')return;const els=[...$('#modal').querySelectorAll('button:not([disabled]),select,input,[tabindex="0"]')];if(els.length){if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus();}}});

let wasOver=false,lastPX=NaN,lastPY=NaN,tap=null;
function handleInput(dt){
  const inp=kit.input,p=inp.pointer;
  padCursor.update(dt);
  // The mouse left the map: drop the hover preview (a lifted finger keeps it).
  if(wasOver&&!p.over&&p.type!=='touch'){hoverPoint=null;if(action){view.ghost=null;view.range=null;}}wasOver=p.over;
  if(!padCursor.active&&(p.x!==lastPX||p.y!==lastPY)){lastPX=p.x;lastPY=p.y;if(p.over||p.type==='touch'){hoverPoint=view.groundAt(p.x,p.y);if(action)updatePlacement();}}
  if(inp.pressed('back')){if(modalOpen)closeModal();else if(action)cancelAction();else if(selectedTowerId!==null){selectedTowerId=null;view.range=null;renderInspector();}}
  if(inp.pressed('confirm'))padCursor.click();
  if(modalOpen||!ready)return;
  // The map: mouse, touch taps (hold to move the hero), wheel and pinch, controller zoom and rotation.
  if(inp.pressed('click'))mapClick(p.x,p.y,inp.down('keep'));
  if(inp.pressed('alt'))mapAlt(p.x,p.y);
  if(p.type==='touch'){const now=performance.now();if(p.justDown)tap={x:p.x,y:p.y,t:now,ok:true};if(tap?.ok&&(Math.hypot(p.x-tap.x,p.y-tap.y)>14||inp.zoom()))tap.ok=false;if(tap?.ok&&p.down&&now-tap.t>550){tap.ok=false;mapAlt(tap.x,tap.y);}if(p.justUp&&tap){if(tap.ok)mapClick(tap.x,tap.y,false);tap=null;}}
  let zoom=inp.zoom()*.1;if(inp.down('zoomIn'))zoom+=dt*.6;if(inp.down('zoomOut'))zoom-=dt*.6;const look=inp.look('look');
  if(zoom||look.x){view.zoomBy(zoom);view.rotateBy(look.x);if(action)updatePlacement();}
  if(inp.pressed('resetView')){view.camera('reset');updatePlacement();}
  if(inp.pressed('heroHere'))padCursor.heroHere();
  if(inp.pressed('start')){if(game.paused)togglePause();else if(game.phase==='build')startWave();else togglePause();}
  if(inp.pressed('pause'))togglePause();
  if(inp.pressed('meteor'))requestAbility('meteor');if(inp.pressed('freeze'))requestAbility('freeze');if(inp.pressed('heroSkill'))requestAbility('hero');
  if(inp.pressed('heroMove')){if(game.hero){action={kind:'move'};updatePlacement();}else openHeroes();}
  if(inp.pressed('speed'))cycleSpeed();if(inp.pressed('mute'))audio.toggle();if(inp.pressed('guide'))openGuide();if(inp.pressed('lab'))openLab();
  for(let i=0;i<TOWERS.length;i++)if(inp.pressed('tower'+i))selectBuild(TOWERS[i].id);
  const step=(inp.pressed('nextTower')?1:0)-(inp.pressed('prevTower')?1:0);if(step){const i=TOWERS.findIndex(t=>t.id===(action?.kind==='build'?action.type:selectedType));selectBuild(TOWERS[(i+step+TOWERS.length)%TOWERS.length].id);}
}
function frame(dt){
  dt=Math.min(dt,.08);
  handleInput(dt);
  if(!modalOpen&&!game.paused){accumulator+=dt*game.speed;let steps=0;try{while(accumulator>=SETTINGS.step&&steps<16){game.update(SETTINGS.step);view.update(SETTINGS.step);accumulator-=SETTINGS.step;steps++;}}catch(error){game.paused=true;accumulator=0;console.error(error);toast('The game stopped: '+(error?.message||error),'error');}}else accumulator=0;
  view.render();
  const now=performance.now();if(now-lastUI>100){updateUI();lastUI=now;}
}
kit.start(frame);
ready=true;updateUI();
if(!game.hero)openHeroes();else if(resumed)toast(`Checkpoint restored. ${game.wave} waves clear.`,'success');
// Read access for automated UI tests and local balance work.
window.voxelGuard={get game(){return game;},get view(){return view;},get action(){return action;},get modalOpen(){return modalOpen;},get backend(){return kit.backend;},save,version:VERSION};
</script>
