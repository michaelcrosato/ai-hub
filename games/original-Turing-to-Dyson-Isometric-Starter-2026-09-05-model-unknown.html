<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Turing to Dyson — Isometric Starter</title>
<meta name="description" content="Run an isometric compute lab from vacuum-tube racks to a Dyson swarm: install and upgrade 48 racks, keep the room cool, fix faults and push through five eras of AI.">
<meta name="theme-color" content="#101a26">
<script type="importmap">
{
  "imports": {
    "three": "/lib/three/three.webgpu.js",
    "three/webgpu": "/lib/three/three.webgpu.js",
    "three/tsl": "/lib/three/three.tsl.js",
    "three/addons/": "/lib/three/addons/",
    "kit/": "/lib/kit/"
  }
}
</script>
<link rel="modulepreload" href="/lib/three/three.core.js" />
<link rel="modulepreload" href="/lib/three/three.webgpu.js" />
<style>
:root{--bg:#101a26;--panel:rgba(14,24,34,.88);--line:#2a3b49;--muted:#95a8b9;--text:#e5edf3;--era:#e4b879;--good:#7ad1be;--bad:#f2948c;--warn:#f3c26b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.hud{pointer-events:none}
.panel{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body:not(.playing) #top,body:not(.playing) #card,body.finale #card,body.finale .lab-buttons{display:none}

/* top HUD */
#top{position:fixed;z-index:10;left:0;right:0;top:calc(8px + env(safe-area-inset-top));padding:0 calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px}
#stats{width:min(560px,60vw)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.mark{width:28px;height:28px;border:1px solid var(--era);transform:rotate(45deg);display:grid;place-items:center;flex:none;margin:0 4px}
.mark span{transform:rotate(-45deg);font:15px ui-monospace,monospace;color:var(--era)}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:var(--era);font-weight:650}
.era-name{font-size:17px;font-weight:680;letter-spacing:-.3px}
.era-pips{margin-left:auto;display:flex;gap:5px;flex:none}
.era-pips i{width:10px;height:10px;border-radius:2px;background:#1c2a36;border:1px solid #3a4d5c}
.era-pips i.now{background:var(--era);border-color:var(--era);box-shadow:0 0 8px var(--era)}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.label{font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);display:block;white-space:nowrap}
.stat b{display:block;font:600 18px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{display:block;font-size:10px;color:var(--muted);white-space:nowrap}
.neg{color:var(--bad)!important}.pos{color:var(--good)!important}
.goal{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 120px;align-items:center;gap:10px;font-size:11px;margin-top:4px}
.bar-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:4px;background:#1c2a36;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;background:var(--era);border-radius:inherit;transition:width .2s}
.bar i.full{background:var(--good)}
.tip{margin-top:7px;font-size:11.5px;color:#d6e4ec;min-height:1.4em}
.tip:empty{display:none}
#lab{width:250px}
.temp-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.temp-head b{font:600 18px ui-monospace,monospace}
.bar.heat{height:8px;margin:6px 0 4px}
.bar.heat i{background:var(--good)}
.bar.heat i.warm{background:var(--warn)}.bar.heat i.hot{background:#f59a5a}.bar.heat i.crit{background:#ff5a4a}
.bar.heat em{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.5)}
#lab small{display:block;font-size:10px;color:var(--muted)}
.lab-buttons{display:grid;gap:6px;margin-top:10px}
.hbtn{appearance:none;display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;background:#172633;border:1px solid #344857;border-radius:8px;cursor:pointer;text-align:left;color:var(--text);line-height:1.2}
.hbtn:hover{border-color:var(--era);background:#1f3040}
.hbtn:focus-visible{outline:2px solid var(--era);outline-offset:2px}
.hbtn .bl{flex:1;font-weight:600}
.hbtn .bc{font:11px ui-monospace,monospace;color:var(--muted);white-space:nowrap}
.hbtn.cant{opacity:.7}.hbtn.cant .bc{color:var(--bad)}
.hbtn.locked{opacity:.45}
.hbtn.ready{border-color:var(--era);background:#223444;box-shadow:0 0 0 1px var(--era),0 0 16px rgba(228,184,121,.35)}
.hbtn.primary{background:var(--era);border-color:var(--era);color:#15212b;font-weight:700}
.hbtn.primary .bc{color:#2c3b46}
.hbtn[hidden]{display:none}
kbd{font:600 10px ui-monospace,monospace;padding:1px 5px;border-radius:4px;border:1px solid #4a5f70;color:#c5d5df;background:#0f1a24;white-space:nowrap}
.hbtn.primary kbd{background:rgba(0,0,0,.15);border-color:rgba(0,0,0,.3);color:#15212b}
kbd[hidden]{display:none}
.split{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kit-touch-on #bMenu{display:none}
.kit-touch-on .split{grid-template-columns:1fr}
#lab{margin-top:var(--kit-touch-top,0px)}
#banner{flex-basis:100%;display:flex;justify-content:center}
#banner[hidden]{display:none}
.banner{max-width:min(520px,100%);padding:9px 14px;border-radius:10px;background:rgba(14,24,34,.94);border:1px solid var(--era);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.banner b{display:block;font-size:14px}.banner span{font-size:12px;color:#c9d7e0}
.banner.bad{border-color:var(--bad)}.banner.bad b{color:var(--bad)}
.banner.good{border-color:var(--good)}

/* selected rack card */
#card{position:fixed;z-index:10;left:calc(8px + env(safe-area-inset-left));bottom:calc(8px + env(safe-area-inset-bottom));width:340px;max-width:calc(100vw - 16px - var(--kit-touch-right,0px))}
.card-head{display:flex;align-items:center;gap:8px}
.card-head b{font-size:15px}
.tag{margin-left:auto;font:700 9px ui-monospace,monospace;letter-spacing:1px;text-transform:uppercase;padding:3px 6px;border-radius:5px;border:1px solid #3c5060;color:#c8d6df}
.tag:empty{display:none}
.tag.on{color:var(--good);border-color:var(--good)}
.tag.fault{color:#fff;background:#a8372e;border-color:#ff6a5a}
.tag.halt{color:#15212b;background:var(--warn);border-color:var(--warn)}
.tag.off,.tag.empty{color:var(--muted)}
.card-hw{font-size:11px;color:var(--era);margin-top:2px;min-height:1.3em}
.card-text{font-size:12px;color:#c3d2dc;margin-top:4px;min-height:2.8em}
.card-buttons{display:flex;gap:6px;margin-top:9px}
.card-buttons .hbtn{flex:1;justify-content:center;text-align:center}
.msg{font-size:11px;min-height:1.3em;margin-top:6px;color:var(--good)}
.msg.bad{color:var(--bad)}
#card.shake{animation:shake .26s}
@keyframes shake{20%{transform:translateX(-5px)}60%{transform:translateX(4px)}}

/* menus */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 40%,rgba(16,26,38,.3),rgba(8,12,18,.78));overflow:auto}
.overlay[hidden]{display:none}
.screen{width:min(470px,100%);background:rgba(14,24,34,.95);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.screen h1{margin:6px 0 8px;font-size:clamp(26px,6vw,34px);letter-spacing:-.6px}
.screen h2{margin:6px 0 6px;font-size:22px}
.lede{color:#bfd0db;margin:0 0 12px}
.menu-btn{appearance:none;display:block;width:100%;margin-top:8px;padding:11px 14px;text-align:left;background:#172633;border:1px solid #344857;border-radius:10px;cursor:pointer;color:var(--text);font-weight:650}
.menu-btn small{display:block;font-weight:450;font-size:11px;color:var(--muted);margin-top:2px}
.menu-btn.primary{background:var(--era);color:#15212b;border-color:var(--era)}
.menu-btn.primary small{color:#2c3b46}
.menu-btn:focus{outline:none}
.menu-btn:hover,.menu-btn.is-focus{border-color:var(--era);outline:2px solid var(--era);outline-offset:2px}
.best{margin:14px 0 0;font-size:11px;color:var(--muted)}
.newbest{color:var(--good);font-weight:700}
.how{margin:0 0 10px;padding-left:18px;color:#c9d7e0;font-size:12px}
.how li{margin:4px 0}
.controls{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0 4px}
.controls td{padding:5px 4px;border-bottom:1px solid #22323f;vertical-align:top}
.controls td:last-child{text-align:right;color:#d7e4ec;font:11px ui-monospace,monospace}
.results{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:8px 0 6px;font-size:12px}
.results div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #22323f;padding:4px 0}
.results b{font-family:ui-monospace,monospace}

/* phones: stack the HUD and keep it compact */
@media (max-width:760px){
  #top{flex-direction:column;align-items:stretch;padding-top:var(--kit-touch-top,0px);gap:6px}
  #stats{width:auto;padding:8px 10px}
  #lab{width:auto;margin-top:0;padding:8px 10px}
  .brand{margin-bottom:5px}.mark{display:none}.era-name{font-size:14px}
  .stat-grid{gap:6px}.stat b{font-size:14px}.stat small{font-size:9px}
  .goal{margin-top:6px;padding-top:6px}
  .bar-row{grid-template-columns:minmax(0,1fr) 80px;font-size:10px;margin-top:2px}
  .tip{font-size:11px;margin-top:4px}
  .temp-head b{font-size:14px}.bar.heat{margin:4px 0 2px}
  .lab-buttons{grid-template-columns:repeat(auto-fit,minmax(64px,1fr));margin-top:6px}
  .split{display:contents}
  .hbtn{flex-direction:column;align-items:stretch;gap:1px;padding:6px 4px;text-align:center;font-size:11px}
  .hbtn .bc{font-size:10px}
  #top kbd{display:none}
  #card{width:auto;right:calc(8px + var(--kit-touch-right,0px));max-width:none;padding:9px 11px}
  .card-text{min-height:0}
}
@media (max-width:420px){.eyebrow#eraSub{display:none}.stat .label{letter-spacing:.6px}}
/* short landscape screens */
@media (max-height:560px) and (min-width:761px){
  #stats{padding:8px 12px}.brand{margin-bottom:4px}.mark{display:none}
  .stat b{font-size:15px}.goal{margin-top:6px;padding-top:6px}
  #lab{padding:8px 10px}.lab-buttons{margin-top:6px;gap:4px;grid-template-columns:1fr 1fr}
  .split{display:contents}
  .hbtn{padding:6px 8px;font-size:12px}
  #card{padding:8px 11px;width:300px}.card-text{min-height:0}
}
</style>
</head>
<body>
<!-- Turing to Dyson — Isometric Starter. The recovered low-poly lab (a 16 m slab, 48 racks, a warm key light
     and an isometric camera) now carries the lab simulation its fixed 0.2 s step was waiting for. -->
<div id="top" class="hud">
  <section id="stats" class="panel" aria-label="Lab status">
    <div class="brand">
      <div class="mark" aria-hidden="true"><span>τ</span></div>
      <div><div class="eyebrow" id="eraSub"></div><div class="era-name" id="eraName"></div></div>
      <div class="era-pips" id="eraPips" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="stat-grid">
      <div class="stat"><span class="label">Capital</span><b id="vCash"></b><small id="vFlow"></small></div>
      <div class="stat"><span class="label">Research</span><b id="vRp"></b><small id="vRpRate"></small></div>
      <div class="stat"><span class="label">Running</span><b id="vRacks"></b><small id="vFaults"></small></div>
      <div class="stat"><span class="label">Lab time</span><b id="vTime"></b><small id="vSpeed"></small></div>
    </div>
    <div class="goal">
      <span class="label" id="goalTitle"></span>
      <div class="bar-row"><span id="goalRpText"></span><div class="bar"><i id="goalRp"></i></div></div>
      <div class="bar-row"><span id="goalRackText"></span><div class="bar"><i id="goalRack"></i></div></div>
      <div class="tip" id="tip"></div>
    </div>
  </section>
  <section id="lab" class="panel" aria-label="Lab controls">
    <div class="temp-head"><span class="label">Lab temperature</span><b id="vTemp"></b></div>
    <div class="bar heat"><i id="tempBar"></i><em style="left:48%"></em><em style="left:92%"></em></div>
    <small id="vHeat"></small>
    <div class="lab-buttons">
      <button id="bCool" class="hbtn" type="button"><span class="bl">Add cooling</span><span class="bc" id="cCool"></span><kbd data-k="cool"></kbd></button>
      <button id="bDrone" class="hbtn" type="button"><span class="bl">Repair drone</span><span class="bc" id="cDrone"></span><kbd data-k="drone"></kbd></button>
      <button id="bAdvance" class="hbtn" type="button"><span class="bl" id="lAdvance">Advance era</span><span class="bc" id="cAdvance"></span><kbd data-k="advance"></kbd></button>
      <div class="split">
        <button id="bSpeed" class="hbtn" type="button"><span class="bl" id="lSpeed">1× speed</span><kbd data-k="speed"></kbd></button>
        <button id="bMenu" class="hbtn" type="button"><span class="bl">Menu</span><kbd data-k="pause"></kbd></button>
      </div>
    </div>
  </section>
  <div id="banner" hidden><div class="banner" id="bannerBox"><b id="bannerTitle"></b><span id="bannerText"></span></div></div>
</div>
<section id="card" class="panel hud" aria-label="Selected rack">
  <div class="card-head"><b id="cardTitle"></b><span id="cardTag" class="tag"></span></div>
  <div id="cardHw" class="card-hw"></div>
  <div id="cardText" class="card-text"></div>
  <div class="card-buttons">
    <button id="bAct" class="hbtn primary" type="button"><span id="lAct">Install</span><span class="bc" id="cAct"></span><kbd data-k="act"></kbd></button>
    <button id="bToggle" class="hbtn" type="button"><span id="lToggle">Power down</span><kbd data-k="toggle"></kbd></button>
  </div>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
</section>
<div id="overlay" class="overlay" hidden></div>

<script type="module">
import * as THREE from 'three/webgpu';
import { boot } from 'kit/boot.js';
import { createPoints } from 'kit/points.js';
import { MOUSE_LOOK, TOUCH_LOOK } from 'kit/input.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ───────────────────────── rules (fictional balance values) ───────────────────────── */

const TICK = 0.2; // the starter's fixed simulation step, in seconds of lab time
const COLS = 8;
const ROWS = 6;
const RACKS = COLS * ROWS;
const STARTER = [19, 20, 27, 28]; // the four racks the lab opens with
const FIRST_BAY = 21; // an empty bay to point new players at
const MAX_COOL = 8;
const ERAS = [
  { name: 'The Foundations', sub: 'Vacuum & logic · 1950–1979', accent: '#e4b879', hw: 'Vacuum computer', research: 400, need: 12 },
  { name: 'The Neural Revival', sub: 'The silicon era · 1980–2019', accent: '#97bbff', hw: 'GPU workstation', research: 4000, need: 16 },
  { name: 'Generative & Agentic', sub: 'The hyperscale era · 2020s', accent: '#72e4d4', hw: 'Accelerator rack', research: 30000, need: 24 },
  { name: 'Synthetic Society', sub: 'The cognitive era · speculative scenario', accent: '#c2b4ff', hw: 'Cognitive compute pod', research: 180000, need: 32 },
  { name: 'Cosmological Intelligence', sub: 'The Dyson era · far-future thought experiment', accent: '#ffc674', hw: 'Orbital compute node', research: 800000, need: 40 },
];
// Per rack, per second of lab time. Tier t is the hardware of era t-1.
const TIER = [
  null,
  { gross: 1, upkeep: 0.2, rp: 1, heat: 1, up: 0, repair: 10 },
  { gross: 3, upkeep: 0.6, rp: 4, heat: 1.6, up: 150, repair: 25 },
  { gross: 8.6, upkeep: 1.6, rp: 15, heat: 2.6, up: 550, repair: 80 },
  { gross: 26, upkeep: 4, rp: 55, heat: 4.2, up: 2000, repair: 250 },
  { gross: 70, upkeep: 10, rp: 200, heat: 6.8, up: 6000, repair: 700 },
];
const CUM_UP = [0, 0];
for (let t = 2; t <= 5; t++) CUM_UP[t] = CUM_UP[t - 1] + TIER[t].up;
const DRONES = [
  { era: 2, cost: 3000 },
  { era: 3, cost: 20000 },
];
const DIFF = {
  relaxed: { label: 'Relaxed', desc: 'More capital, fewer faults, gentler heat.', cash: 800, fault: 0.5, heat: 0.85, bad: 0.6 },
  standard: { label: 'Standard', desc: 'The intended balance.', cash: 500, fault: 1, heat: 1, bad: 1 },
  hard: { label: 'Hard', desc: 'Tight budget, hotter racks, frequent faults.', cash: 350, fault: 1.6, heat: 1.15, bad: 1.4 },
};
const DIFF_ORDER = ['relaxed', 'standard', 'hard'];
const EVENTS = {
  grant: { name: 'Research grant', good: true, dur: 0 },
  breakthrough: { name: 'Benchmark breakthrough', good: true, dur: 20, text: 'Research output ×2' },
  rush: { name: 'Inference rush', good: true, dur: 25, text: 'Income ×1.5' },
  heatwave: { name: 'Heatwave', good: false, dur: 30, text: 'Cooling capacity −30%' },
  surge: { name: 'Grid surge', good: false, dur: 0 },
};
const has = (obj, key) => typeof key === 'string' && Object.hasOwn(obj, key);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const throttle = (T) => (T < 60 ? 1 : Math.max(0.35, 1 - (T - 60) / 40));

/* ───────────────────────── storage ───────────────────────── */

const SAVE_KEY = 'ttd-iso.save.v1';
const BEST_KEY = 'ttd-iso.best.v1';
const PREF_KEY = 'ttd-iso.prefs.v1';
const store = {
  get(k) {
    try {
      const v = localStorage.getItem(k);
      return v ? JSON.parse(v) : null;
    } catch {
      return null;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(k, JSON.stringify(v));
    } catch {
      /* private mode or full storage: the run just is not kept */
    }
  },
  del(k) {
    try {
      localStorage.removeItem(k);
    } catch {
      /* ignore */
    }
  },
};
const rawPrefs = store.get(PREF_KEY);
const prefs = {
  muted: !!(rawPrefs && rawPrefs.muted === true),
  diff: rawPrefs && has(DIFF, rawPrefs.diff) ? rawPrefs.diff : 'standard',
};
const savePrefs = () => store.set(PREF_KEY, prefs);
const readBest = () => {
  const b = store.get(BEST_KEY);
  const out = {};
  if (b && typeof b === 'object') for (const d of DIFF_ORDER) if (Number.isFinite(b[d]) && b[d] > 0) out[d] = b[d];
  return out;
};

/* ───────────────────────── boot ───────────────────────── */

const kit = await boot({
  title: 'Turing to Dyson',
  gear: 'none', // the pause and title menus carry a Settings button (F9 works too)
  accent: '#e4b879',
  background: '#101a26',
  touch: { top: 'right', topOffset: 10 },
  input: {
    move: { type: 'vector', keys: 'wasd+arrows', gamepad: 'leftStick+dpad' },
    look: { type: 'look', mouse: 'drag', gamepad: 'rightStick', touch: 'drag' },
    act: { keys: ['Space', 'Enter', 'NumpadEnter'], gamepad: ['A'], touch: 'Act' },
    toggle: { keys: ['KeyK', 'ShiftLeft', 'ShiftRight', 'Backspace'], gamepad: ['B'] },
    cool: { keys: ['KeyC'], gamepad: ['X'] },
    advance: { keys: ['KeyR'], gamepad: ['Y'] },
    drone: { keys: ['KeyG'], gamepad: ['LS'] },
    // Touch pills show only when useful (a fault to jump to, a view that was panned or zoomed).
    next: { keys: ['KeyQ'], gamepad: ['RT'], touch: { label: 'Fault', slot: 'top' } },
    center: { keys: ['KeyH', 'Home'], gamepad: ['RS'], touch: { label: 'Center', slot: 'top' } },
    zoomIn: { keys: ['Equal', 'NumpadAdd'], gamepad: ['RB'] },
    zoomOut: { keys: ['Minus', 'NumpadSubtract'], gamepad: ['LB'] },
    speed: { keys: ['KeyF'], gamepad: ['Back'] },
    mute: { keys: ['KeyM'] },
    pause: { keys: ['Escape', 'KeyP'], gamepad: ['Start'], touch: { label: 'II', slot: 'top' } },
  },
});
const input = kit.input;
kit.touch?.setShown('next', false);
kit.touch?.setShown('center', false);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
kit.loading.progress(0.75, 'Building the lab…');

const renderer = kit.renderer;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap; // PCFSoftShadowMap is WebGL-only; radius softens instead

/* ───────────────────────── scene: the recovered lab ───────────────────────── */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101a26);

const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 120);
const CAM_OFF = new THREE.Vector3(18, 18, 18);
camera.position.copy(CAM_OFF);
camera.lookAt(0, 0, 0); // the orientation never changes: only the target pans

scene.add(new THREE.HemisphereLight(0xd8e8ff, 0x29333e, 2));

/* ───────────────────────── state ───────────────────────── */

function newState(diff) {
  const st = {
    v: 1,
    diff,
    seed: ((Math.random() * 4294967295) >>> 0) || 1,
    cash: DIFF[diff].cash,
    research: 0,
    researchTotal: 0,
    era: 0,
    temp: 24,
    units: 1, // the starter lab comes with one cooling unit
    drones: 0,
    time: 0,
    real: 0,
    speed: 1,
    trip: 0,
    event: null,
    nextEvent: 80,
    done: false,
    won: false,
    launched: false,
    racks: [],
    stats: { installs: 0, upgrades: 0, faults: 0, repairs: 0, droneRepairs: 0, peak: 24, trips: 0, earned: 0 },
  };
  for (let i = 0; i < RACKS; i++) st.racks.push({ t: 0, on: false, fault: false });
  for (const i of STARTER) st.racks[i] = { t: 1, on: true, fault: false };
  return st;
}

function loadGame() {
  const d = store.get(SAVE_KEY);
  if (!d || typeof d !== 'object' || d.v !== 1 || !has(DIFF, d.diff) || !Array.isArray(d.racks) || d.racks.length !== RACKS) return null;
  const num = (v, lo, hi, def) => (Number.isFinite(v) ? clamp(v, lo, hi) : def);
  const st = newState(d.diff);
  st.seed = (d.seed >>> 0) || 1;
  st.cash = num(d.cash, -1e12, 1e15, st.cash);
  st.research = num(d.research, 0, 1e15, 0);
  st.researchTotal = num(d.researchTotal, 0, 1e15, st.research);
  st.era = Math.round(num(d.era, 0, 4, 0));
  st.temp = num(d.temp, 0, 200, 24);
  st.units = Math.round(num(d.units, 0, MAX_COOL, 0));
  st.drones = Math.round(num(d.drones, 0, DRONES.length, 0));
  st.time = num(d.time, 0, 1e9, 0);
  st.real = num(d.real, 0, 1e9, 0);
  st.speed = [1, 2, 4].includes(d.speed) ? d.speed : 1;
  st.trip = num(d.trip, 0, 8, 0);
  st.nextEvent = num(d.nextEvent, 0, 200, 80);
  st.done = !!d.done;
  st.won = !!d.won;
  st.launched = !!d.launched;
  if (d.event && has(EVENTS, d.event.id) && EVENTS[d.event.id].dur) st.event = { id: d.event.id, left: num(d.event.left, 0, 60, 0) };
  st.racks = d.racks.map((r) => {
    const t = Math.min(st.era + 1, Math.round(num(r && r.t, 0, 5, 0)));
    return { t, on: !!(t && r.on), fault: !!(t && r.fault) };
  });
  if (d.stats && typeof d.stats === 'object') for (const k of Object.keys(st.stats)) st.stats[k] = num(d.stats[k], 0, 1e15, st.stats[k]);
  return st;
}

let s = loadGame() || newState(prefs.diff);
let live = false; // true while a real run is on (saving allowed); the title shows a preview
let mode = 'title'; // title | play | finale | results
let sel = -1;
let hover = -1;
let visDirty = true;
let hudDirty = true;
let frameNo = 0;
let acc = 0;
let saveT = 0;
let hudT = 0;
let faultSfxT = 0;
let fanAngle = 0;
let shake = 0;
let finT = 0;
const M = { gross: 0, upkeep: 0, net: 0, rp: 0, heat: 0, cap: 8, load: 0, perf: 1, working: 0, installed: 0, online: 0, faults: 0, atTier: 0 };

function rng() {
  let x = s.seed | 0 || 1;
  x ^= x << 13;
  x ^= x >>> 17;
  x ^= x << 5;
  s.seed = x >>> 0;
  return s.seed / 4294967296;
}

const installedCount = () => {
  let n = 0;
  for (const r of s.racks) if (r.t) n++;
  return n;
};
const installCost = () => Math.round(40 * 1.075 ** installedCount()) + CUM_UP[s.era + 1];
const coolCost = () => Math.round(150 * 2.2 ** Math.max(0, s.units - 1));
const unitCap = () => 10 * (1 + s.era * 0.9);
const coolCap = () => 8 + s.units * unitCap();
const debtLimit = () => -(300 + 700 * s.era);

function measure() {
  let gross = 0;
  let upkeep = 0;
  let rp = 0;
  let heat = 0;
  let working = 0;
  let installed = 0;
  let online = 0;
  let faults = 0;
  let atTier = 0;
  const need = s.era + 1;
  for (const r of s.racks) {
    if (!r.t) continue;
    installed++;
    if (r.t >= need) atTier++;
    if (r.fault) faults++;
    if (!r.on) continue; // powered down: no heat, no upkeep, no output
    online++;
    upkeep += TIER[r.t].upkeep;
    if (r.fault || s.trip > 0) continue;
    working++;
    gross += TIER[r.t].gross;
    rp += TIER[r.t].rp;
    heat += TIER[r.t].heat;
  }
  const ev = s.event ? s.event.id : '';
  M.perf = throttle(s.temp);
  M.gross = gross * M.perf * (ev === 'rush' ? 1.5 : 1);
  M.upkeep = upkeep + s.units * 0.4 * (1 + s.era);
  M.net = M.gross - M.upkeep;
  M.rp = rp * M.perf * (ev === 'breakthrough' ? 2 : 1);
  M.heat = heat * DIFF[s.diff].heat;
  M.cap = coolCap() * (ev === 'heatwave' ? 0.7 : 1);
  M.load = M.heat / M.cap;
  M.working = working;
  M.installed = installed;
  M.online = online;
  M.faults = faults;
  M.atTier = atTier;
}

function gate() {
  const e = ERAS[s.era];
  const rpOk = s.research >= e.research;
  const rackOk = M.atTier >= e.need;
  return { e, rpOk, rackOk, ready: !s.done && rpOk && rackOk };
}

/* ───────────────────────── simulation ───────────────────────── */

function simTick(h) {
  measure();
  const d = DIFF[s.diff];
  s.time += h;
  s.cash += M.net * h;
  s.stats.earned += M.gross * h;
  s.research += M.rp * h;
  s.researchTotal += M.rp * h;

  const target = s.trip > 0 ? 20 : M.load <= 1 ? 20 + 30 * M.load : 50 + 70 * (M.load - 1);
  s.temp += (target - s.temp) * (1 - Math.exp(-h / 5));
  if (s.temp > s.stats.peak) s.stats.peak = s.temp;

  if (s.trip > 0) {
    s.trip = Math.max(0, s.trip - h);
    if (!s.trip) {
      flash('Racks restarting after the emergency shutdown.');
      audio.play('power');
    }
  } else if (s.temp >= 92 && M.working > 0) {
    triggerTrip();
  }

  if (!s.trip) {
    const lam = d.fault * (0.0006 + Math.max(0, s.temp - 48) * 0.0012) * h;
    for (let i = 0; i < RACKS; i++) {
      const r = s.racks[i];
      if (r.t && r.on && !r.fault && rng() < lam) faultRack(i);
    }
  }

  if (s.event) {
    s.event.left -= h;
    if (s.event.left <= 0) s.event = null;
  } else if ((s.nextEvent -= h) <= 0) {
    s.nextEvent = 60 + rng() * 60;
    rollEvent();
  }

  visDirty = true;
  if (!s.done && s.cash < debtLimit()) finish(false);
}

function pickWorking(n) {
  const list = [];
  for (let i = 0; i < RACKS; i++) {
    const r = s.racks[i];
    if (r.t && r.on && !r.fault) list.push(i);
  }
  for (let i = 0; i < Math.min(n, list.length); i++) {
    const j = i + Math.floor(rng() * (list.length - i));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list.slice(0, n);
}

function faultRack(i, quiet = false) {
  const r = s.racks[i];
  if (!r.t || r.fault) return;
  r.fault = true;
  s.stats.faults++;
  visDirty = hudDirty = true;
  const p = slotPos[i];
  emit(p.x, 1.4, p.z, 12, SPARK_COL, 1.8, 2.6, 0.7);
  if (!quiet) {
    if (faultSfxT <= 0) {
      audio.play('fault');
      faultSfxT = 0.5;
    }
    input.rumble(0.35, 110);
  }
}

function triggerTrip() {
  s.trip = 8;
  s.stats.trips++;
  for (const i of pickWorking(2 + (rng() < 0.5 ? 1 : 0))) faultRack(i, true);
  audio.play('alarm');
  input.rumble(0.9, 450);
  if (!reducedMotion) shake = 0.3;
  hudDirty = true;
}

function rollEvent() {
  const bad = DIFF[s.diff].bad;
  const pool = [];
  for (const [id, ev] of Object.entries(EVENTS)) {
    if (id === 'surge' && M.working < 6) continue;
    pool.push([id, ev.good ? 1 : bad]);
  }
  let sum = 0;
  for (const p of pool) sum += p[1];
  let x = rng() * sum;
  let pick = pool[0][0];
  for (const [id, w] of pool) {
    x -= w;
    if (x <= 0) {
      pick = id;
      break;
    }
  }
  startEvent(pick);
}

function startEvent(id) {
  const ev = EVENTS[id];
  if (id === 'grant') {
    const amt = Math.max(250, Math.round((Math.max(0, M.net) * 40) / 10) * 10);
    s.cash += amt;
    banner(ev.name, `A public grant funds the lab: +${fmt(amt)} cr.`, 5, 'good');
    audio.play('event');
  } else if (id === 'surge') {
    const hit = pickWorking(2 + Math.floor(rng() * 3));
    for (const i of hit) faultRack(i, true);
    banner(ev.name, `A power surge trips ${hit.length} racks. Repair them.`, 5, 'bad');
    audio.play('bad');
    input.rumble(0.6, 200);
    if (!reducedMotion) shake = Math.max(shake, 0.15);
  } else {
    s.event = { id, left: ev.dur };
    audio.play(ev.good ? 'event' : 'bad');
  }
  measure();
  hudDirty = true;
}

/* ───────────────────────── player actions ───────────────────────── */

function rackName(i) {
  return `Bay ${String.fromCharCode(65 + Math.floor(i / COLS))}${(i % COLS) + 1}`;
}

function actInfo(i) {
  const r = s.racks[i];
  if (!r.t) return { kind: 'install', label: `Install ${ERAS[s.era].hw}`, short: 'Install', cost: installCost() };
  if (r.fault) return { kind: 'repair', label: 'Repair', short: 'Repair', cost: TIER[r.t].repair };
  if (!r.on) return { kind: 'power', label: 'Power on', short: 'Power', cost: 0 };
  if (r.t <= s.era) return { kind: 'upgrade', label: `Upgrade to ${ERAS[s.era].hw}`, short: 'Upgrade', cost: CUM_UP[s.era + 1] - CUM_UP[r.t] };
  return { kind: 'none', label: s.era < 4 ? 'Latest hardware' : 'Fully upgraded', short: 'Act', cost: 0 };
}

/** Actions only apply while the lab is being played (not during the launch or behind a menu). */
const busy = () => mode !== 'play' || !!screen;

function changed() {
  measure();
  visDirty = hudDirty = true;
}

function act(i) {
  if (busy() || (s.done && !s.won)) return;
  if (i < 0) return deny(input.source === 'touch' ? 'Tap a rack first.' : 'Select a rack first.');
  const r = s.racks[i];
  const info = actInfo(i);
  if (info.kind === 'none') return deny(s.era < 4 ? `Already on ${ERAS[r.t - 1].hw} hardware. Advance the era for more.` : 'This rack is fully upgraded.');
  if (info.cost > s.cash) return deny(`Needs ${fmt(info.cost)} cr; you have ${fmt(s.cash)}.`);
  s.cash -= info.cost;
  const p = slotPos[i];
  if (info.kind === 'install') {
    r.t = s.era + 1;
    r.on = true;
    r.fault = false;
    s.stats.installs++;
    audio.play('install');
    emit(p.x, 1.5, p.z, 14, ACCENT[r.t - 1], 1.6, 3, 0.8);
    flash(`${ERAS[r.t - 1].hw} installed in ${rackName(i)}.`);
    input.rumble(0.2, 60);
  } else if (info.kind === 'repair') {
    r.fault = false;
    r.on = true;
    s.stats.repairs++;
    audio.play('repair');
    emit(p.x, 1.5, p.z, 10, REPAIR_COL, 1.4, 2.2, 0.6);
    flash(`${rackName(i)} repaired.`);
    input.rumble(0.2, 60);
  } else if (info.kind === 'power') {
    r.on = true;
    audio.play('power');
    flash(`${rackName(i)} powered on.`);
  } else if (info.kind === 'upgrade') {
    r.t = s.era + 1;
    s.stats.upgrades++;
    audio.play('upgrade');
    emit(p.x, 1.5, p.z, 18, ACCENT[r.t - 1], 1.8, 3.4, 0.9);
    flash(`${rackName(i)} upgraded to ${ERAS[r.t - 1].hw}.`);
    input.rumble(0.25, 80);
  }
  changed();
}

function togglePower(i) {
  if (busy() || (s.done && !s.won)) return;
  if (i < 0) return deny(input.source === 'touch' ? 'Tap a rack first.' : 'Select a rack first.');
  const r = s.racks[i];
  if (!r.t) return deny('This bay is empty. Install a rack first.');
  r.on = !r.on;
  audio.play(r.on ? 'power' : 'off');
  flash(r.on ? `${rackName(i)} powered on.` : `${rackName(i)} powered down: no heat, no upkeep, no output.`);
  changed();
}

function buyCooling() {
  if (busy() || (s.done && !s.won)) return;
  if (s.units >= MAX_COOL) return deny('All eight cooling bays are in use.');
  const c = coolCost();
  if (s.cash < c) return deny(`A cooling unit costs ${fmt(c)} cr.`);
  s.cash -= c;
  unitAnim[s.units] = 0;
  s.units++;
  audio.play('cool');
  flash(`Cooling unit ${s.units} online: +${Math.round(unitCap())} kW of capacity.`);
  input.rumble(0.2, 80);
  changed();
}

function buyDrone() {
  if (busy() || (s.done && !s.won)) return;
  if (s.drones >= DRONES.length) return deny('Both drone docks are in use.');
  const d = DRONES[s.drones];
  if (s.era < d.era) return deny(`Repair drone ${s.drones + 1} unlocks in ${ERAS[d.era].name}.`);
  if (s.cash < d.cost) return deny(`A repair drone costs ${fmt(d.cost)} cr.`);
  s.cash -= d.cost;
  const D = drones[s.drones];
  D.pos.copy(D.dock);
  D.mode = 'dock';
  D.target = -1;
  s.drones++;
  audio.play('drone');
  flash('Repair drone online. It fixes faulted racks by itself.');
  changed();
}

function advance() {
  if (busy()) return;
  if (s.done) return deny(s.won ? 'The swarm is already online.' : '');
  const g = gate();
  if (!g.ready) {
    const miss = [];
    if (!g.rpOk) miss.push(`${fmt(g.e.research)} RP`);
    if (!g.rackOk) miss.push(`${g.e.need} racks on ${g.e.hw} hardware (${M.atTier} now)`);
    return deny(`${s.era < 4 ? 'Next era' : 'Launch'} needs ${miss.join(' and ')}.`);
  }
  if (s.era === 4) return launch();
  s.research -= g.e.research;
  s.era++;
  measure();
  applyEraLook();
  const e = ERAS[s.era];
  banner(`Era ${s.era + 1}: ${e.name}`, `${e.sub}. ${e.hw}s unlocked; cooling refitted to ${Math.round(unitCap())} kW per unit.`, 6, 'good');
  audio.play('era');
  input.rumble(0.5, 250);
  for (let i = 0; i < RACKS; i++) if (s.racks[i].t && Math.random() < 0.5) emit(slotPos[i].x, 1.55, slotPos[i].z, 3, ACCENT[s.era], 0.9, 3.2, 0.9);
  visDirty = hudDirty = true;
  saveGame();
}

function cycleSpeed() {
  if (busy() || (s.done && !s.won)) return;
  s.speed = s.speed === 1 ? 2 : s.speed === 2 ? 4 : 1;
  flash(`Lab speed ${s.speed}×.`);
  audio.play('select');
  hudDirty = true;
}

function nextFault() {
  for (let k = 1; k <= RACKS; k++) {
    const i = (Math.max(0, sel) + k) % RACKS;
    if (s.racks[i].fault) {
      select(i, true);
      return;
    }
  }
  flash('No faulted racks.');
}

function select(i, follow = false) {
  if (i === sel) return;
  sel = i;
  visDirty = hudDirty = true;
  audio.play('select');
  if (follow && i >= 0 && zoom > 1.1) {
    _v.copy(slotPos[i]).project(camera);
    if (Math.abs(_v.x) > 0.72 || Math.abs(_v.y) > 0.55) camGoal.set(clamp(slotPos[i].x, -6, 6), 0, clamp(slotPos[i].z, -6, 6));
  }
}

function moveCursor(dir) {
  if (sel < 0) return select(FIRST_BAY, true);
  let col = sel % COLS;
  let row = Math.floor(sel / COLS);
  if (dir === 'R') col = Math.min(COLS - 1, col + 1);
  else if (dir === 'L') col = Math.max(0, col - 1);
  else if (dir === 'U') row = Math.max(0, row - 1);
  else if (dir === 'D') row = Math.min(ROWS - 1, row + 1);
  select(row * COLS + col, true);
}

/* ───────────────────────── drones ───────────────────────── */

function flyToward(D, tx, ty, tz, step) {
  const p = D.pos;
  const cruise = 2.35;
  const hd = Math.hypot(tx - p.x, tz - p.z);
  if (hd > 0.03) {
    D.heading = Math.atan2(tx - p.x, tz - p.z);
    if (p.y < cruise - 0.01) {
      p.y = Math.min(cruise, p.y + step);
      return false;
    }
    const m = Math.min(step, hd);
    p.x += ((tx - p.x) / hd) * m;
    p.z += ((tz - p.z) / hd) * m;
    return false;
  }
  p.x = tx;
  p.z = tz;
  const vd = ty - p.y;
  if (Math.abs(vd) > 0.01) {
    p.y += Math.sign(vd) * Math.min(step, Math.abs(vd));
    return false;
  }
  p.y = ty;
  return true;
}

function faultFor(k) {
  const D = drones[k];
  let best = -1;
  let bestD = Infinity;
  for (let i = 0; i < RACKS; i++) {
    if (!s.racks[i].fault) continue;
    let taken = false;
    for (let j = 0; j < s.drones; j++) if (j !== k && drones[j].target === i && drones[j].mode !== 'dock') taken = true;
    if (taken) continue;
    const dd = Math.hypot(slotPos[i].x - D.pos.x, slotPos[i].z - D.pos.z);
    if (dd < bestD) {
      bestD = dd;
      best = i;
    }
  }
  return best;
}

function updateDrones(ds) {
  for (let k = 0; k < s.drones; k++) {
    const D = drones[k];
    const step = 4.2 * ds;
    if (D.mode === 'dock' || D.mode === 'return') {
      const tgt = faultFor(k);
      if (tgt >= 0) {
        D.target = tgt;
        D.mode = 'fly';
      }
    }
    if ((D.mode === 'fly' || D.mode === 'work') && !(s.racks[D.target] && s.racks[D.target].fault)) {
      D.mode = 'return';
      D.target = -1;
    }
    if (D.mode === 'fly') {
      const p = slotPos[D.target];
      if (flyToward(D, p.x, 1.95, p.z, step)) {
        D.mode = 'work';
        D.work = 2.2;
      }
    } else if (D.mode === 'work') {
      D.work -= ds;
      D.sparkT -= ds;
      const p = slotPos[D.target];
      if (D.sparkT <= 0) {
        D.sparkT = 0.12;
        emit(p.x + (Math.random() - 0.5) * 0.4, 1.55, p.z + (Math.random() - 0.5) * 0.4, 2, REPAIR_COL, 1.1, 1.4, 0.45);
      }
      if (D.work <= 0) {
        const r = s.racks[D.target];
        r.fault = false;
        s.stats.droneRepairs++;
        emit(p.x, 1.5, p.z, 10, REPAIR_COL, 1.4, 2.2, 0.6);
        audio.play('drone');
        D.mode = 'return';
        D.target = -1;
        changed();
      }
    } else if (D.mode === 'return') {
      if (flyToward(D, D.dock.x, D.dock.y, D.dock.z, step)) D.mode = 'dock';
    }
  }
}

/* ───────────────────────── finale and results ───────────────────────── */

function launch() {
  s.research -= ERAS[4].research;
  s.launched = true;
  setMode('finale');
  finT = 0;
  beam.visible = true;
  beam.scale.set(1, 0.001, 1);
  beamMat.opacity = 0;
  camGoal.set(0, 0, 0);
  zoomGoal = 0.8;
  audio.play('launch');
  input.rumble(1, 900);
  banner('Launching the Dyson swarm', 'Every rack streams to the orbital collectors…', 6, 'good');
  // Not saved here: a tab closed mid-launch resumes from the last save, research intact.
}

function updateFinale(dt) {
  finT += dt;
  const k = Math.min(1, finT / 2.8);
  beam.scale.y = Math.max(0.001, k * k * (3 - 2 * k));
  beamMat.opacity = 0.15 + 0.45 * k;
  if (!reducedMotion) shake = Math.max(shake, 0.05 * (1 - k * 0.6));
  const i = Math.floor(Math.random() * RACKS);
  if (s.racks[i].t) emit(slotPos[i].x, 1.55, slotPos[i].z, 3, ACCENT[4], 0.8, 5, 1.2);
  emit(0, 0.4, 0, 2, ACCENT[4], 2.4, 6, 1.4);
  if (finT > 6.5) finish(true);
}

function finish(won) {
  s.done = true;
  s.won = won;
  setMode('results');
  let newBest = false;
  const best = readBest();
  if (won) {
    const t = Math.round(s.time);
    if (!best[s.diff] || t < best[s.diff]) {
      best[s.diff] = t;
      newBest = true;
      store.set(BEST_KEY, best);
    }
    beamMat.opacity = 0.32;
    beam.scale.y = 1;
    saveGame();
    audio.play('win');
  } else {
    store.del(SAVE_KEY);
    live = false;
    audio.play('lose');
    input.rumble(0.8, 500);
  }
  showResults(won, newBest, best[s.diff]);
}

/* ───────────────────────── saving ───────────────────────── */

function saveGame() {
  if (live && mode !== 'finale') store.set(SAVE_KEY, s);
}

/* ───────────────────────── sparks ───────────────────────── */

function emit(x, y, z, n, col, speed = 2, up = 2.5, life = 0.8) {
  for (let k = 0; k < n && spN < SPARK_MAX; k++) {
    const o = spN++ * SP;
    const a = Math.random() * Math.PI * 2;
    const r = speed * (0.35 + Math.random() * 0.65);
    spData[o] = x;
    spData[o + 1] = y;
    spData[o + 2] = z;
    spData[o + 3] = Math.cos(a) * r;
    spData[o + 4] = up * (0.5 + Math.random());
    spData[o + 5] = Math.sin(a) * r;
    spData[o + 6] = spData[o + 7] = life * (0.6 + Math.random() * 0.6);
    spData[o + 8] = col.r;
    spData[o + 9] = col.g;
    spData[o + 10] = col.b;
  }
}

function updateSparks(dt) {
  const pos = sparks.positions.array;
  const col = sparks.colors.array;
  for (let i = 0; i < spN; ) {
    const o = i * SP;
    spData[o + 6] -= dt;
    if (spData[o + 6] <= 0) {
      spN--;
      if (i !== spN) spData.copyWithin(o, spN * SP, spN * SP + SP);
      continue;
    }
    spData[o + 4] -= 7 * dt;
    spData[o] += spData[o + 3] * dt;
    spData[o + 1] += spData[o + 4] * dt;
    spData[o + 2] += spData[o + 5] * dt;
    if (spData[o + 1] < 0) {
      spData[o + 1] = 0;
      spData[o + 4] *= -0.35;
      spData[o + 3] *= 0.6;
      spData[o + 5] *= 0.6;
    }
    const f = spData[o + 6] / spData[o + 7];
    pos[i * 3] = spData[o];
    pos[i * 3 + 1] = spData[o + 1];
    pos[i * 3 + 2] = spData[o + 2];
    col[i * 3] = spData[o + 8] * f;
    col[i * 3 + 1] = spData[o + 9] * f;
    col[i * 3 + 2] = spData[o + 10] * f;
    i++;
  }
  sparks.object.visible = spN > 0;
  sparks.setCount(Math.max(1, spN));
  if (spN || spLast) {
    sparks.positions.needsUpdate = true;
    sparks.colors.needsUpdate = true;
  }
  spLast = spN;
}

/* ───────────────────────── painting the world ───────────────────────── */

const markersShown = () => mode === 'play' && !screen;

function paintRacks() {
  const marks = markersShown();
  for (let i = 0; i < RACKS; i++) {
    const r = s.racks[i];
    _c.copy(RACK_BASE);
    if (!r.t) _c.multiplyScalar(0.42);
    else {
      if (r.t > 1) _c.lerp(ACCENT[r.t - 1], 0.08 * (r.t - 1));
      if (r.fault) _c.lerp(FAULT_TINT, 0.4);
      if (!r.on) _c.multiplyScalar(0.6);
    }
    if (marks && i === sel) _c.multiplyScalar(1.28);
    else if (marks && i === hover) _c.multiplyScalar(1.12);
    rackMesh.setColorAt(i, _c);
    const lit = r.on && !r.fault ? 1 : 0.45;
    for (let k = 0; k < 5; k++) pips.setColorAt(i * 5 + k, k < r.t ? _c2.copy(ACCENT[k]).multiplyScalar(lit) : PIP_OFF);
  }
  rackMesh.instanceColor.needsUpdate = true;
  pips.instanceColor.needsUpdate = true;

  for (let k = 0; k < MAX_COOL; k++) {
    if (k < s.units) _c.copy(PAD_BUILT);
    else if (k === s.units) _c.copy(ACCENT[s.era]).multiplyScalar(s.cash >= coolCost() ? 0.55 : 0.2);
    else _c.copy(PAD_EMPTY);
    padMesh.setColorAt(k, _c);
  }
  for (let k = 0; k < DOCKS.length; k++) {
    if (k < s.drones) _c.copy(PAD_BUILT);
    else if (k === s.drones && s.era >= DRONES[k].era) _c.copy(ACCENT[s.era]).multiplyScalar(s.cash >= DRONES[k].cost ? 0.55 : 0.2);
    else _c.copy(PAD_EMPTY);
    dockMesh.setColorAt(k, _c);
  }
  padMesh.instanceColor.needsUpdate = true;
  dockMesh.instanceColor.needsUpdate = true;
}

function paintLeds(t) {
  const blink = (t * 3) % 1 < 0.5;
  const hot = s.temp > 60 ? Math.min(0.6, (s.temp - 60) / 40) : 0;
  for (let i = 0; i < RACKS; i++) {
    const r = s.racks[i];
    if (!r.t) _c.copy(LED_OFF);
    else if (r.fault) _c.copy(blink ? (r.on ? FAULT_ON : FAULT_DIM) : r.on ? FAULT_DIM : LED_OFF);
    else if (!r.on) _c.copy(LED_OFF);
    else if (mode === 'finale') _c.copy(ACCENT[4]).multiplyScalar(blink ? 1.2 : 0.7);
    else if (s.trip > 0) _c.copy(TRIP_COL).multiplyScalar(blink ? 1 : 0.35);
    else {
      const w = Math.sin(t * 7 + i * 1.91);
      _c.copy(ACCENT[r.t - 1]).multiplyScalar(0.7 + 0.3 * w * w);
      if (hot) _c.lerp(HOT_COL, hot);
    }
    leds.setColorAt(i, _c);
  }
  leds.instanceColor.needsUpdate = true;
}

function updateWorld(dt, t) {
  if (faultSfxT > 0) faultSfxT -= dt;
  if (visDirty) {
    visDirty = false;
    paintRacks();
  }
  paintLeds(t);

  // Cooling units drop in when bought; their fans follow the heat load.
  const running = mode === 'play' || mode === 'finale';
  fanAngle += dt * (s.trip > 0 || !running ? 1.5 : 4 + 10 * Math.min(1.5, M.load));
  for (let k = 0; k < s.units; k++) {
    if (unitAnim[k] < 1) unitAnim[k] = Math.min(1, unitAnim[k] + dt * 1.8);
    const e = 1 - (1 - unitAnim[k]) ** 3;
    const drop = (1 - e) * 3;
    const p = COOL_SLOTS[k];
    resetDummy();
    dummy.position.set(p.x, 0.6 + drop, p.z);
    dummy.updateMatrix();
    coolUnits.setMatrixAt(k, dummy.matrix);
    dummy.position.y = 1.23 + drop;
    dummy.updateMatrix();
    coolHousing.setMatrixAt(k, dummy.matrix);
    dummy.position.y = 1.27 + drop;
    dummy.rotation.y = fanAngle + k * 0.7;
    dummy.updateMatrix();
    coolBlades.setMatrixAt(k, dummy.matrix);
  }
  coolUnits.count = coolHousing.count = coolBlades.count = s.units;
  if (s.units) coolUnits.instanceMatrix.needsUpdate = coolHousing.instanceMatrix.needsUpdate = coolBlades.instanceMatrix.needsUpdate = true;

  // Selection marker and hover frame.
  const marks = markersShown();
  selFrame.visible = chevron.visible = marks && sel >= 0;
  if (selFrame.visible) {
    const p = slotPos[sel];
    selFrame.position.x = chevron.position.x = p.x;
    selFrame.position.z = chevron.position.z = p.z;
    chevron.position.y = 2.05 + Math.sin(t * 4) * 0.08;
    chevron.rotation.y = t * 1.5;
  }
  hovFrame.visible = marks && hover >= 0 && hover !== sel;
  if (hovFrame.visible) {
    hovFrame.position.x = slotPos[hover].x;
    hovFrame.position.z = slotPos[hover].z;
  }

  // Heat glow.
  const glow = clamp((s.temp - 42) / 50, 0, 0.5);
  heatGlow.visible = glow > 0.01;
  heatMat.opacity = glow * (0.85 + 0.15 * Math.sin(t * 2.3));

  // Drones.
  for (let k = 0; k < drones.length; k++) {
    const D = drones[k];
    D.mesh.visible = k < s.drones;
    if (!D.mesh.visible) continue;
    D.mesh.position.copy(D.pos);
    if (D.mode !== 'dock') D.mesh.position.y += Math.sin(t * 5 + k * 2) * 0.04;
    const turn = ((D.heading - D.mesh.rotation.y + Math.PI * 3) % (Math.PI * 2)) - Math.PI; // shortest way round
    let rot = D.mesh.rotation.y + turn * Math.min(1, dt * 6);
    if (rot > Math.PI) rot -= Math.PI * 2;
    else if (rot < -Math.PI) rot += Math.PI * 2;
    D.mesh.rotation.y = rot;
  }

  if (beam.visible && mode !== 'finale') beamMat.opacity = 0.3 + 0.05 * Math.sin(t * 2);
  updateSparks(dt);
}

/* ───────────────────────── camera ───────────────────────── */

const R_AX = new THREE.Vector3(1, 0, -1).normalize(); // screen right on the floor
const U_AX = new THREE.Vector3(-1, 0, -1).normalize(); // screen up on the floor
const FORESHORTEN = 1 / Math.sqrt(3); // how much a floor step along U_AX moves on screen
const camTarget = new THREE.Vector3();
const camGoal = new THREE.Vector3();
let zoom = 1;
let zoomGoal = 1;
let viewShiftPx = 0;
let layoutDirty = true;
const compactMQ = matchMedia('(max-width: 760px)');

function measureLayout() {
  layoutDirty = false;
  viewShiftPx = 0;
  if (!compactMQ.matches || !document.body.classList.contains('playing')) return;
  // Phones stack the HUD: centre the lab in the space between the top panels and the rack card.
  const top = document.getElementById('top').getBoundingClientRect().bottom;
  const card = document.getElementById('card').getBoundingClientRect();
  const bottom = card.height ? innerHeight - card.top : 0;
  viewShiftPx = clamp((top - bottom) / 2, -220, 220);
}

function cameraInput(dt) {
  const lk = input.look('look');
  if (lk.x || lk.y) {
    if (input.source === 'gamepad') {
      const k = 2.7 / zoom;
      camGoal.addScaledVector(R_AX, lk.x * k).addScaledVector(U_AX, (-lk.y * k) / FORESHORTEN);
    } else {
      // Drag the floor with the pointer: convert the kit's look radians back to pixels, undoing the
      // look sensitivity and invert-Y settings so the floor stays under the finger or cursor.
      const ks = kit.settings.get();
      const per = (input.source === 'touch' ? TOUCH_LOOK : MOUSE_LOOK) * (ks.lookSensitivity || 1);
      const inv = ks.invertY ? -1 : 1;
      const wpp = (camera.top - camera.bottom) / zoom / kit.size.height;
      camGoal.addScaledVector(R_AX, -(lk.x / per) * wpp).addScaledVector(U_AX, ((inv * lk.y) / per) * wpp / FORESHORTEN);
    }
    camGoal.x = clamp(camGoal.x, -6, 6);
    camGoal.z = clamp(camGoal.z, -6, 6);
  }
  const z = input.zoom();
  if (z) zoomGoal *= Math.exp(z * 0.15);
  if (input.down('zoomIn')) zoomGoal *= Math.exp(1.3 * dt);
  if (input.down('zoomOut')) zoomGoal *= Math.exp(-1.3 * dt);
  zoomGoal = clamp(zoomGoal, 0.6, 2.5);
}

function updateCamera(dt) {
  zoom += (zoomGoal - zoom) * (1 - Math.exp(-12 * dt));
  camTarget.lerp(camGoal, 1 - Math.exp(-14 * dt));
  if (layoutDirty) measureLayout();
  const W = kit.size.width;
  const H = kit.size.height;
  const aspect = W / H;
  const halfH = Math.max(9, 6.9 / aspect); // portrait phones keep the whole lab across
  const cy = (viewShiftPx * (2 * halfH)) / zoom / H;
  camera.left = -halfH * aspect;
  camera.right = halfH * aspect;
  camera.top = halfH + cy;
  camera.bottom = -halfH + cy;
  camera.zoom = zoom;
  camera.updateProjectionMatrix();
  camera.position.copy(camTarget).add(CAM_OFF);
  if (shake > 0) {
    camera.position.x += (Math.random() - 0.5) * shake;
    camera.position.z += (Math.random() - 0.5) * shake;
    shake = Math.max(0, shake - dt * 0.9);
  }
}
kit.onResize(() => (layoutDirty = true));

/* ───────────────────────── audio (synthesised, unlocked on the first gesture) ───────────────────────── */

const audio = (() => {
  let ctx = null;
  let master = null;
  let sfx = null;
  let hum = null;
  let noiseBuf = null;
  let humLevel = 0;
  let active = true;
  const init = () => {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      ctx = new AC();
    } catch {
      ctx = null;
      return false;
    }
    master = ctx.createGain();
    master.gain.value = prefs.muted ? 0 : 0.8;
    master.connect(ctx.destination);
    sfx = ctx.createGain();
    sfx.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    // Server-room hum: brown noise through a low-pass plus a mains tone.
    const len = ctx.sampleRate * 2;
    const hb = ctx.createBuffer(1, len, ctx.sampleRate);
    const hd = hb.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
      hd[i] = last * 3.5;
    }
    hum = ctx.createGain();
    hum.gain.value = 0;
    hum.connect(master);
    const src = ctx.createBufferSource();
    src.buffer = hb;
    src.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 260;
    src.connect(lp).connect(hum);
    src.start();
    const osc = ctx.createOscillator();
    osc.frequency.value = 60;
    const og = ctx.createGain();
    og.gain.value = 0.25;
    osc.connect(og).connect(hum);
    osc.start();
    return true;
  };
  const running = () => ctx && ctx.state === 'running' && !prefs.muted;
  const tone = (f, dur, type = 'sine', vol = 0.1, delay = 0, f2 = 0) => {
    const t0 = ctx.currentTime + delay;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(sfx);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  };
  const noise = (dur, vol, freq, delay = 0) => {
    const t0 = ctx.currentTime + delay;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = freq;
    bp.Q.value = 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.05, dur / 3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp).connect(g).connect(sfx);
    src.start(t0);
    src.stop(t0 + dur + 0.05);
  };
  const chord = (list, dur, type, vol, gap) => list.forEach((f, i) => tone(f, dur, type, vol, i * gap));
  return {
    unlock() {
      if (!init()) return;
      if (active && ctx.state === 'suspended') ctx.resume().catch(() => {});
    },
    setActive(on) {
      active = on;
      if (!ctx) return;
      if (on && ctx.state === 'suspended') ctx.resume().catch(() => {});
      else if (!on && ctx.state === 'running') ctx.suspend().catch(() => {});
    },
    setHum(level) {
      // Called with every HUD refresh: only schedule a ramp when the level really moves.
      if (!ctx || Math.abs(level - humLevel) < 0.002) return;
      humLevel = level;
      hum.gain.setTargetAtTime(level, ctx.currentTime, 0.5);
    },
    setMuted(m) {
      prefs.muted = m;
      savePrefs();
      if (ctx) master.gain.setTargetAtTime(m ? 0 : 0.8, ctx.currentTime, 0.05);
    },
    play(name) {
      if (!running()) return;
      switch (name) {
        case 'select': tone(880, 0.05, 'square', 0.03); break;
        case 'install': tone(220, 0.2, 'sawtooth', 0.06, 0, 660); tone(990, 0.1, 'sine', 0.05, 0.14); break;
        case 'upgrade': chord([523, 659, 784, 1047], 0.12, 'triangle', 0.07, 0.06); break;
        case 'power': tone(330, 0.14, 'sine', 0.06, 0, 520); break;
        case 'off': tone(520, 0.16, 'sine', 0.05, 0, 200); break;
        case 'repair': noise(0.12, 0.1, 2400); tone(392, 0.1, 'square', 0.04, 0.08); tone(587, 0.14, 'square', 0.04, 0.17); break;
        case 'fault': tone(880, 0.09, 'square', 0.05); tone(622, 0.14, 'square', 0.05, 0.1); break;
        case 'deny': tone(130, 0.16, 'sawtooth', 0.06); break;
        case 'cool': noise(0.6, 0.09, 500); tone(196, 0.35, 'sine', 0.05); break;
        case 'drone': tone(1320, 0.06, 'sine', 0.035); tone(1760, 0.06, 'sine', 0.03, 0.07); break;
        case 'event': tone(740, 0.12, 'sine', 0.05); tone(988, 0.16, 'sine', 0.05, 0.11); break;
        case 'bad': tone(300, 0.2, 'triangle', 0.06); tone(220, 0.26, 'triangle', 0.06, 0.16); break;
        case 'alarm': for (let i = 0; i < 6; i++) tone(i % 2 ? 520 : 780, 0.14, 'square', 0.05, i * 0.17); break;
        case 'era': chord([392, 494, 587, 784], 0.7, 'triangle', 0.05, 0.09); break;
        case 'launch': tone(110, 3.2, 'sawtooth', 0.045, 0, 880); noise(3, 0.07, 300); chord([523, 659, 784, 1047, 1319], 1.2, 'triangle', 0.045, 0.12); break;
        case 'win': chord([523, 659, 784, 1047], 0.9, 'triangle', 0.05, 0.12); break;
        case 'lose': chord([392, 330, 262, 196], 0.45, 'triangle', 0.06, 0.22); break;
      }
    },
  };
})();
for (const type of ['pointerdown', 'pointerup', 'keydown', 'touchend', 'click']) addEventListener(type, () => audio.unlock(), { capture: true, passive: true });
kit.onPause((p) => audio.setActive(!p && !document.hidden));

const $ = (id) => document.getElementById(id);
const hud = {};
for (const id of ['eraSub', 'eraName', 'eraPips', 'vCash', 'vFlow', 'vRp', 'vRpRate', 'vRacks', 'vFaults', 'vTime', 'vSpeed', 'goalTitle', 'goalRpText', 'goalRp', 'goalRackText', 'goalRack', 'tip', 'vTemp', 'tempBar', 'vHeat', 'bCool', 'cCool', 'bDrone', 'cDrone', 'bAdvance', 'lAdvance', 'cAdvance', 'bSpeed', 'lSpeed', 'bMenu', 'banner', 'bannerBox', 'bannerTitle', 'bannerText', 'card', 'cardTitle', 'cardTag', 'cardHw', 'cardText', 'bAct', 'lAct', 'cAct', 'bToggle', 'lToggle', 'msg']) hud[id] = $(id);
const setText = (node, text) => {
  if (node._t !== text) {
    node._t = text;
    node.textContent = text;
  }
};
const setClass = (node, cls, on) => {
  if (node.classList.contains(cls) !== !!on) node.classList.toggle(cls, !!on);
};
const setWidth = (node, frac) => {
  const w = `${Math.round(clamp(frac, 0, 1) * 1000) / 10}%`;
  if (node._w !== w) {
    node._w = w;
    node.style.width = w;
  }
};

function fmt(n) {
  const a = Math.abs(n);
  const sign = n < 0 && a >= 0.5 ? '−' : '';
  if (a < 1000) return sign + Math.round(a).toLocaleString('en-US');
  if (a < 1e6) return sign + (a / 1e3).toFixed(a < 1e4 ? 2 : a < 1e5 ? 1 : 0) + 'k';
  return sign + (a / 1e6).toFixed(a < 1e7 ? 2 : 1) + 'M';
}
const fmtRate = (n) => `${n < 0 ? '−' : '+'}${Math.abs(n) < 10 ? Math.abs(n).toFixed(1) : fmt(Math.abs(n))}/s`;
function fmtTime(sec) {
  const t = Math.max(0, Math.floor(sec));
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const ss = String(t % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}

const PROMPTS = {
  keyboard: { act: 'Space', toggle: 'K', cool: 'C', advance: 'R', drone: 'G', next: 'Q', center: 'H', speed: 'F', pause: 'Esc' },
  gamepad: { act: 'A', toggle: 'B', cool: 'X', advance: 'Y', drone: 'L3', next: 'RT', center: 'R3', speed: 'View', pause: 'Start' },
  touch: {},
};
const key = (name) => {
  const v = (PROMPTS[input.source] || {})[name];

};
function paintPrompts() {
  const map = PROMPTS[input.source] || {};

    k.hidden = !v;
  }

}
input.onSourceChange(() => {
  paintPrompts();

if (typeof ResizeObserver === 'function') {

  ro.observe($('card'), { box: 'border-box' });

let bannerState = null;

function applyEraLook() {

function currentHint() {
  if (mode === 'finale') return '';
  if (s.done) return s.won ? 'The swarm is online. Keep tuning the lab, or start a new run from the menu.' : '';
  if (s.trip > 0) return `Emergency shutdown: racks restart in ${Math.ceil(s.trip)} s. Add cooling${key('cool')} or power racks down.`;
  if (s.cash < 0) return `In debt: repair or power down faulted racks. Insolvency below ${fmt(debtLimit())} cr.`;
  if (M.faults && s.stats.repairs + s.stats.droneRepairs === 0) return `A rack has faulted (blinking red). Select it${key('next')} and repair it${key('act')}.`;
  if (s.temp > 44 && M.load > 0.9 && s.units < MAX_COOL) return `Heat is climbing. Add a cooling unit${key('cool')} before the lab passes 48 °C.`;
  if (s.stats.installs === 0) return `Select a dark, empty bay and install a rack${key('act')}.`;
  const g = gate();
  if (g.ready) return s.era < 4 ? `Ready: advance to ${ERAS[s.era + 1].name}${key('advance')}.` : `Everything is ready: launch the Dyson swarm${key('advance')}!`;
  if (s.era >= 2 && s.drones === 0 && M.faults) return `Repair drones${key('drone')} fix faulted racks for you.`;
  if (g.rpOk && !g.rackOk) return `Research done. Now get ${g.e.need} racks on ${g.e.hw} hardware.`;
  if (s.era > 0 && M.atTier < M.installed) return `Upgrade older racks to ${g.e.hw} hardware${key('act')}.`;
  return '';
}

let touchLabel = '';
let pillFault = null;
let pillCenter = null;
function updateHud() {
  const now = performance.now() / 1000;
  setText(hud.eraName, ERAS[s.era].name);
  setText(hud.eraSub, ERAS[s.era].sub);
  setText(hud.vCash, `${fmt(s.cash)} cr`);
  setClass(hud.vCash, 'neg', s.cash < 0);
  setText(hud.vFlow, fmtRate(M.net));
  setClass(hud.vFlow, 'neg', M.net < 0);
  setText(hud.vRp, fmt(s.research));
  setText(hud.vRpRate, fmtRate(M.rp));
  setText(hud.vRacks, `${M.working}/${M.installed}`);
  setText(hud.vFaults, s.trip > 0 ? 'shutdown' : M.faults ? `${M.faults} fault${M.faults > 1 ? 's' : ''}` : 'all nominal');
  setClass(hud.vFaults, 'neg', M.faults > 0 || s.trip > 0);
  setText(hud.vTime, fmtTime(s.time));
  setText(hud.vSpeed, `${s.speed}× speed`);

  const g = gate();
  if (s.done) {
    setText(hud.goalTitle, s.won ? 'Dyson swarm online · sandbox' : 'Lab closed');
    setText(hud.goalRpText, `Research generated ${fmt(s.researchTotal)}`);
    setText(hud.goalRackText, `Racks installed ${M.installed}/${RACKS}`);
    setWidth(hud.goalRp, 1);
    setWidth(hud.goalRack, M.installed / RACKS);
  } else {
    setText(hud.goalTitle, s.era < 4 ? `Next era · ${ERAS[s.era + 1].name}` : 'Final goal · launch the Dyson swarm');
    setText(hud.goalRpText, `Research ${fmt(Math.min(s.research, g.e.research))} / ${fmt(g.e.research)} RP`);
    setText(hud.goalRackText, `${g.e.hw} racks ${Math.min(M.atTier, g.e.need)} / ${g.e.need}`);
    setWidth(hud.goalRp, s.research / g.e.research);
    setWidth(hud.goalRack, M.atTier / g.e.need);
  }
  setClass(hud.goalRp, 'full', s.done || g.rpOk);
  setClass(hud.goalRack, 'full', s.done || g.rackOk);
  setText(hud.tip, currentHint());

  setText(hud.vTemp, `${Math.round(s.temp)} °C`);
  setWidth(hud.tempBar, s.temp / 100);
  setClass(hud.tempBar, 'warm', s.temp >= 44 && s.temp < 60);
  setClass(hud.tempBar, 'hot', s.temp >= 60 && s.temp < 80);
  setClass(hud.tempBar, 'crit', s.temp >= 80);
  setText(hud.vHeat, `Heat ${M.heat.toFixed(1)} / ${Math.round(M.cap)} kW cooling${s.event && s.event.id === 'heatwave' ? ' (heatwave)' : ''}`);

  const cc = coolCost();
  setText(hud.cCool, s.units >= MAX_COOL ? 'max' : `${fmt(cc)} cr`);
  setClass(hud.bCool, 'cant', s.units < MAX_COOL && s.cash < cc);
  setClass(hud.bCool, 'locked', s.units >= MAX_COOL);
  const dn = DRONES[s.drones];
  setText(hud.cDrone, !dn ? `${s.drones}/2` : s.era < dn.era ? `era ${dn.era + 1}` : `${fmt(dn.cost)} cr`);
  setClass(hud.bDrone, 'locked', !dn || s.era < dn.era);
  setClass(hud.bDrone, 'cant', !!dn && s.era >= dn.era && s.cash < dn.cost);
  setText(hud.lAdvance, s.done ? (s.won ? 'Swarm online' : 'Lab closed') : s.era < 4 ? 'Advance era' : 'Launch swarm');
  setText(hud.cAdvance, s.done ? '' : `${fmt(g.e.research)} RP`);
  setClass(hud.bAdvance, 'ready', g.ready);
  setClass(hud.bAdvance, 'locked', !g.ready);
  setText(hud.lSpeed, `${s.speed}× speed`);

  // Banner: shutdown first, then one-off news, then a running event.
  let b = null;
  if (s.trip > 0) b = { title: 'Emergency shutdown', text: `The lab passed 92 °C. Racks restart in ${Math.ceil(s.trip)} s.`, kind: 'bad' };
  else if (bannerState && bannerState.until > now) b = bannerState;
  else if (s.event) {
    const ev = EVENTS[s.event.id];
    b = { title: `${ev.name} · ${Math.ceil(s.event.left)} s`, text: ev.text, kind: ev.good ? 'good' : 'bad' };
  }
  hud.banner.hidden = !b;
  if (b) {
    setText(hud.bannerTitle, b.title);
    setText(hud.bannerText, b.text);
    setClass(hud.bannerBox, 'bad', b.kind === 'bad');
    setClass(hud.bannerBox, 'good', b.kind === 'good');
  }

  paintCard();
  const short = sel >= 0 ? actInfo(sel).short : 'Act';
  if (short !== touchLabel) {
    touchLabel = short;
    kit.touch?.setLabel('act', short);
  }
  const showFault = mode === 'play' && M.faults > 0;
  if (showFault !== pillFault) {
    pillFault = showFault;
    kit.touch?.setShown('next', showFault);
  }
  const showCenter = mode === 'play' && (camGoal.lengthSq() > 1 || Math.abs(zoomGoal - 1) > 0.15);
  if (showCenter !== pillCenter) {
    pillCenter = showCenter;
    kit.touch?.setShown('center', showCenter);
  }
  audio.setHum(mode === 'play' && !screen ? 0.03 + 0.07 * (M.working / RACKS) : mode === 'finale' ? 0.1 : 0);
}

/* ───────────────────────── menus (mouse, touch, keyboard and gamepad) ───────────────────────── */

const overlay = $('overlay');
let screen = null;
let navDir = '';
let navHold = 0;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function button(label, onClick, { cls = '', sub = '', cycle = null } = {}) {
  const b = el('button', `menu-btn ${cls}`.trim());
  b.type = 'button';
  b.append(el('span', 'mb-l', label));
  if (sub) b.append(el('small', 'mb-s', sub));
  b.addEventListener('click', () => {
    audio.play('select');
    onClick(b);
  });
  if (cycle) b.cycle = (dir) => cycle(dir, b);
  b.addEventListener('pointerenter', (e) => {
    if (e.pointerType !== 'mouse' || !screen) return;
    const i = screen.items.indexOf(b);
    if (i >= 0) focusItem(i, true);
  });
  return b;
}
function setButton(b, label, sub) {
  b.querySelector('.mb-l').textContent = label;
  const small = b.querySelector('.mb-s');
  if (small && sub != null) small.textContent = sub;
}

function showScreen(name, build, back = null, start = 0) {
  const panel = el('div', 'screen');
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-modal', 'true');
  build(panel);
  overlay.replaceChildren(panel);
  overlay.hidden = false;
  screen = { name, items: [...panel.querySelectorAll('button')], index: 0, back, opened: frameNo };
  kit.touch?.suspend(true, 'screen');
  navDir = '';
  visDirty = hudDirty = true;
  focusItem(start < 0 ? screen.items.length - 1 : start, false);
}

function closeScreen() {
  overlay.hidden = true;
  overlay.replaceChildren();
  screen = null;
  kit.touch?.suspend(false, 'screen');
  input.settle();
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  kit.canvas?.focus?.({ preventScroll: true });
  visDirty = hudDirty = true;
  layoutDirty = true;
}

function focusItem(i, hoverOnly = false) {
  if (!screen || !screen.items.length) return;
  const n = screen.items.length;
  screen.index = ((i % n) + n) % n;
  screen.items.forEach((b, k) => b.classList.toggle('is-focus', k === screen.index));
  screen.items[screen.index].focus({ preventScroll: hoverOnly });
}

/** One discrete step from the move action, with key-repeat when held. */
function navStep(dt) {
  const v = input.vector('move');
  let dir = '';
  if (Math.abs(v.x) > 0.5 || Math.abs(v.y) > 0.5) dir = Math.abs(v.x) > Math.abs(v.y) ? (v.x > 0 ? 'R' : 'L') : v.y > 0 ? 'U' : 'D';
  if (!dir) {
    navDir = '';
    return '';
  }
  if (dir !== navDir) {
    navDir = dir;
    navHold = 0.38;
    return dir;
  }
  navHold -= dt;
  if (navHold <= 0) {
    navHold = 0.11;
    return dir;
  }
  return '';
}

function menuNav(dt) {
  if (!screen || screen.opened === frameNo) return;
  const dir = navStep(dt);
  const item = screen.items[screen.index];
  if (dir === 'U') focusItem(screen.index - 1);
  else if (dir === 'D') focusItem(screen.index + 1);
  else if ((dir === 'L' || dir === 'R') && item && item.cycle) {
    item.cycle(dir === 'R' ? 1 : -1);
    audio.play('select');
  } else if (dir === 'L' || dir === 'R') focusItem(screen.index + (dir === 'R' ? 1 : -1));
  if (input.pressed('act')) {
    if (item) item.click();
  } else if ((input.pressed('toggle') || input.pressed('pause')) && screen && screen.back) {
    audio.play('select');
    screen.back();
  }
}

function setMode(m) {
  mode = m;
  document.body.classList.toggle('playing', m === 'play' || m === 'finale');
  document.body.classList.toggle('finale', m === 'finale');
  if (m === 'finale') kit.touch?.suspend(true, 'screen');
  layoutDirty = visDirty = hudDirty = true;
}

const diffLabel = (d) => `Difficulty: ${DIFF[d].label}`;
function bestLine() {
  const b = readBest();
  return `Best lab times · ${DIFF_ORDER.map((d) => `${DIFF[d].label} ${b[d] ? fmtTime(b[d]) : '—'}`).join(' · ')}`;
}

function showTitle() {
  if (mode === 'play') saveGame();
  live = false;
  setMode('title');
  const saved = loadGame();
  showScreen('title', (p) => {
    p.append(el('div', 'eyebrow', 'The AI Evolution · Isometric Starter'));
    p.append(el('h1', null, 'Turing to Dyson'));
    p.append(el('p', 'lede', 'Run a compute lab from vacuum-tube racks to a Dyson swarm. Install and upgrade 48 racks, keep the room cool, fix faults and push through five eras of AI.'));
    if (saved) {
      p.append(
        button('Continue', () => continueGame(), {
          cls: 'primary',
          sub: `${ERAS[saved.era].name} · ${fmtTime(saved.time)} · ${DIFF[saved.diff].label}${saved.won ? ' · swarm online' : ''}`,
        })
      );
    }
    p.append(
      button('New game', () => (saved ? confirmScreen('Start a new lab?', 'Your saved lab will be replaced.', () => startNew(prefs.diff), showTitle) : startNew(prefs.diff)), {
        cls: saved ? '' : 'primary',
        sub: saved ? '' : 'Four racks, 500 credits and a lot of heat to come.',
      })
    );
    const diffBtn = button(diffLabel(prefs.diff), () => diffBtn.cycle(1), {
      sub: DIFF[prefs.diff].desc,
      cycle: (dir, b) => {
        const i = DIFF_ORDER.indexOf(prefs.diff);
        prefs.diff = DIFF_ORDER[(i + dir + DIFF_ORDER.length) % DIFF_ORDER.length];
        savePrefs();
        setButton(b, diffLabel(prefs.diff), DIFF[prefs.diff].desc);
      },
    });
    p.append(diffBtn);
    p.append(button('How to play', () => showHelp(showTitle)));
    p.append(button('Settings', () => kit.menu.open(), { sub: 'Graphics, touch layout, vibration (F9)' }));
    p.append(el('p', 'best', bestLine()));
  });
}

function confirmScreen(title, text, yes, no) {
  showScreen(
    'confirm',
    (p) => {
      p.append(el('h2', null, title));
      p.append(el('p', 'lede', text));
      p.append(button('Yes', yes, { cls: 'primary' }));
      p.append(button('Cancel', no));
    },
    no,
    1
  );
}

const HOW = [
  'Racks earn capital (cr) and research (RP) while they run. Select a rack and Act to install, repair, power on or upgrade it.',
  'Every running rack makes heat. Keep the lab under 48 °C with cooling units: hotter racks throttle and fault more, and at 92 °C the lab trips into an emergency shutdown.',
  'Faulted racks blink red. They earn nothing but still cost upkeep: repair them, or power them down. Debt past the limit closes the lab.',
  'Advance the era once you have the research and enough racks on that era’s hardware. Each era refits the cooling and unlocks faster racks.',
  'From the Generative era on, repair drones fix faults by themselves. Lab events bring grants, rushes, heatwaves and grid surges.',
  'In the Dyson era, launch the swarm to finish. Your best lab time is kept for each difficulty.',
];
const CONTROLS = {
  keyboard: [
    ['Select a rack', 'Click · WASD / arrows'],
    ['Act: install, repair, power, upgrade', 'Space / Enter'],
    ['Power the rack on or off', 'K / Shift'],

  ],
  gamepad: [

    ['Act: install, repair, power, upgrade', 'A'],
    ['Power the rack on or off', 'B'],
    ['Add cooling', 'X'],

    ['Buy a repair drone', 'L3 (press left stick)'],

  ],

    ['Act: install, repair, power, upgrade', 'ACT button or the rack card'],
    ['Power the rack on or off', 'Rack card'],

    ['Jump to the next fault', 'FAULT (top, when a rack faults)'],
    ['Pan · zoom', 'Drag · pinch'],
    ['Recenter the view', 'CENTER (top, after panning)'],

  ],
};
const DEVICE_NAMES = { keyboard: 'Keyboard & mouse', gamepad: 'Controller', touch: 'Touch' };
const DEVICE_ORDER = ['keyboard', 'gamepad', 'touch'];

function showHelp(back) {
  let dev = DEVICE_ORDER.includes(input.source) ? input.source : 'keyboard';
  showScreen(
    'help',
    (p) => {
      p.append(el('div', 'eyebrow', 'How to play'));
      p.append(el('h2', null, 'Run the lab'));
      const ul = el('ul', 'how');
      for (const line of HOW) ul.append(el('li', null, line));
      p.append(ul);
      const table = el('table', 'controls');
      const fill = () => {
        table.replaceChildren();
        for (const [a, b] of CONTROLS[dev]) {
          const tr = el('tr');
          tr.append(el('td', null, a), el('td', null, b));
          table.append(tr);
        }
      };
      const devBtn = button(`Controls: ${DEVICE_NAMES[dev]}`, () => devBtn.cycle(1), {
        sub: 'Switch with ◂ ▸ or select',
        cycle: (dir, b) => {
          dev = DEVICE_ORDER[(DEVICE_ORDER.indexOf(dev) + dir + DEVICE_ORDER.length) % DEVICE_ORDER.length];
          setButton(b, `Controls: ${DEVICE_NAMES[dev]}`);
          fill();
        },
      });
      fill();
      p.append(devBtn, table);
      p.append(button('Back', back, { cls: 'primary' }));
    },
    back,
    -1
  );
}

function openPause() {
  if (mode !== 'play' || screen) return;
  saveGame();
  showPause();
}

function showPause() {
  showScreen(
    'pause',
    (p) => {
      p.append(el('div', 'eyebrow', `${DIFF[s.diff].label} · ${ERAS[s.era].name}`));
      p.append(el('h2', null, 'Paused'));
      p.append(el('p', 'lede', `Lab time ${fmtTime(s.time)} · ${fmt(s.cash)} cr · ${fmt(s.research)} RP`));
      p.append(button('Resume', closeScreen, { cls: 'primary' }));
      p.append(button('How to play', () => showHelp(showPause)));
      p.append(button('Settings', () => kit.menu.open(), { sub: 'Graphics, touch layout, vibration (F9)' }));
      const snd = button(`Sound: ${prefs.muted ? 'off' : 'on'}`, () => snd.cycle(1), {
        cycle: (dir, b) => {
          audio.setMuted(!prefs.muted);
          setButton(b, `Sound: ${prefs.muted ? 'off' : 'on'}`);
        },
      });
      p.append(snd);
      p.append(button('Restart lab', () => confirmScreen('Restart this lab?', 'This run’s progress will be lost.', () => startNew(s.diff), showPause), { sub: `Same difficulty (${DIFF[s.diff].label})` }));
      p.append(button('Save and quit to title', showTitle));
    },
    closeScreen
  );
}

function showResults(won, newBest, best) {
  const rows = [
    ['Lab time', fmtTime(s.time)],
    ['Real time', fmtTime(s.real)],
    ['Racks installed', `${M.installed} / ${RACKS}`],
    ['Upgrades', s.stats.upgrades],
    ['Faults', s.stats.faults],
    ['Repairs · drone', `${s.stats.repairs} · ${s.stats.droneRepairs}`],
    ['Peak temperature', `${Math.round(s.stats.peak)} °C`],
    ['Shutdowns', s.stats.trips],
    ['Research made', fmt(s.researchTotal)],
    ['Capital earned', fmt(s.stats.earned)],
  ];
  showScreen('results', (p) => {
    p.append(el('div', 'eyebrow', won ? 'Campaign report · Cosmological Intelligence' : `Campaign report · ${ERAS[s.era].name}`));
    p.append(el('h2', null, won ? 'The Dyson swarm is online' : 'Insolvency'));
    p.append(
      el(
        'p',
        'lede',
        won
          ? `From vacuum tubes to orbital compute in ${fmtTime(s.time)} of lab time on ${DIFF[s.diff].label}.`
          : `Debt passed ${fmt(debtLimit())} cr and the lab closed. Faulted racks cost upkeep: repair them or power them down sooner.`
      )
    );
    if (won) p.append(el('p', newBest ? 'best newbest' : 'best', newBest ? 'New best lab time for this difficulty!' : `Best on ${DIFF[s.diff].label}: ${fmtTime(best)}`));
    const grid = el('div', 'results');
    for (const [a, b] of rows) {
      const d = el('div');
      d.append(el('span', null, a), el('b', null, String(b)));
      grid.append(d);
    }
    p.append(grid);
    if (won) {
      p.append(
        button('Keep running the lab', () => {
          live = true;
          setMode('play');
          closeScreen();
        }, { cls: 'primary', sub: 'Sandbox: no more goals, the lab keeps going.' })
      );
    }
    p.append(button('New game', () => startNew(s.diff), { cls: won ? '' : 'primary', sub: `${DIFF[s.diff].label}` }));
    p.append(button('Title screen', showTitle));
  });
}

function resetWorld() {
  acc = 0;
  spN = 0;
  hover = -1;
  shake = 0;
  finT = 0;
  unitAnim.fill(1);
  for (const D of drones) {
    D.pos.copy(D.dock);
    D.mode = 'dock';
    D.target = -1;
    D.work = 0;
  }
  beam.visible = !!s.won;
  beam.scale.set(1, 1, 1);
  beamMat.opacity = 0.32;
  camGoal.set(0, 0, 0);
  zoomGoal = 1;
  bannerState = null;
  measure();
  applyEraLook();
  visDirty = hudDirty = layoutDirty = true;
}

function startNew(diff) {
  s = newState(diff);
  live = true;
  resetWorld();
  sel = FIRST_BAY;
  setMode('play');
  closeScreen();
  banner(`Era 1: ${ERAS[0].name}`, `${ERAS[0].sub}. ${DIFF[diff].label} difficulty.`, 5);
  saveGame();
}

function continueGame() {
  const st = loadGame();
  if (!st) return startNew(prefs.diff);
  s = st;
  live = true;
  resetWorld();
  sel = -1;
  setMode('play');
  closeScreen();
  banner(`Welcome back · ${ERAS[s.era].name}`, s.won ? 'The swarm is online; the lab keeps running.' : `Lab time ${fmtTime(s.time)}.`, 4);
}

/* ───────────────────────── in-game input ───────────────────────── */

let downX = 0;
let downY = 0;
let dragMax = 0;
let hoverX = -1;
let hoverY = -1;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const hits = [];
function pickRack(nx, ny) {
  ndc.set(nx, ny);
  raycaster.setFromCamera(ndc, camera);
  hits.length = 0;
  raycaster.intersectObject(rackMesh, false, hits);
  return hits.length ? hits[0].instanceId : -1;
}
function setHover(i) {
  if (i === hover) return;
  hover = i;
  visDirty = true;
}

function playInput(dt) {
  if (input.pressed('pause')) return openPause();
  const p = input.pointer;
  if (p.justDown) {
    downX = p.x;
    downY = p.y;
    dragMax = 0;
  }
  if (p.down || p.justUp) dragMax = Math.max(dragMax, Math.hypot(p.x - downX, p.y - downY));
  if (p.justUp && dragMax < 10) {
    const id = pickRack(p.nx, p.ny);
    if (id >= 0) select(id);
  }
  if (p.type === 'mouse' && p.over && !p.down) {
    if (p.x !== hoverX || p.y !== hoverY) {
      hoverX = p.x;
      hoverY = p.y;
      setHover(pickRack(p.nx, p.ny));
    }
  } else if (hover >= 0 && (p.type !== 'mouse' || !p.over)) {
    hoverX = hoverY = -1;
    setHover(-1);
  }

  const dir = navStep(dt);
  if (dir) moveCursor(dir);
  if (input.pressed('act')) act(sel);
  if (input.pressed('toggle')) togglePower(sel);
  if (input.pressed('cool')) buyCooling();
  if (input.pressed('advance')) advance();
  if (input.pressed('drone')) buyDrone();
  if (input.pressed('next')) nextFault();
  if (input.pressed('speed')) cycleSpeed();
  if (input.pressed('mute')) toggleMute();
  if (input.pressed('center')) {
    camGoal.set(0, 0, 0);
    zoomGoal = 1;
  }
  cameraInput(dt);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    saveGame();
    audio.setActive(false);
    if (mode === 'play' && !screen) openPause();
  } else if (!kit.paused) {
    audio.setActive(true);
  }
});
addEventListener('pagehide', saveGame);
// Back from the kit's settings panel: give the focus back to the game's own menu.
kit.onPause((p) => {
  if (!p && screen) focusItem(screen.index, true);
});

/* ───────────────────────── start ───────────────────────── */

paintPrompts();
resetWorld();

// Pre-warm every pipeline (units, drones, beam, sparks) so the first purchase does not stutter.
for (const m of [coolUnits, coolHousing, coolBlades]) m.count = MAX_COOL;
for (const D of drones) D.mesh.visible = true;
const beamWas = beam.visible;
beam.visible = heatGlow.visible = sparks.object.visible = selFrame.visible = hovFrame.visible = chevron.visible = true;
sparks.setCount(1);
try {
  await renderer.compileAsync(scene, camera);
} catch (err) {
  console.warn('Pipeline pre-warm skipped:', err);
}
for (const m of [coolUnits, coolHousing, coolBlades]) m.count = s.units;
for (const D of drones) D.mesh.visible = false;
beam.visible = beamWas;
heatGlow.visible = sparks.object.visible = selFrame.visible = hovFrame.visible = chevron.visible = false;

showTitle();

kit.start((dt, t) => {
  frameNo++;
  if (screen) menuNav(dt);
  else if (mode === 'play') playInput(dt);
  else if (mode === 'finale') cameraInput(dt);

  if (mode === 'play' && !screen) {
    acc += dt * s.speed;
    let n = 0;
    while (acc >= TICK && n < 12 && mode === 'play') {
      simTick(TICK);
      acc -= TICK;
      n++;
    }
    if (n >= 12) acc = 0;
    if (mode === 'play') {
      s.real += dt;
      updateDrones(dt * s.speed);
      saveT += dt;
      if (saveT > 10) {
        saveT = 0;
        saveGame();
      }
    }
  } else if (mode === 'finale') {
    updateFinale(dt);
  }

  updateCamera(dt);
  updateWorld(dt, t);
  hudT -= dt;
  if (hudT <= 0 || hudDirty) {
    hudT = 0.1;
    hudDirty = false;
    updateHud();
  }
  renderer.render(scene, camera);
});
</script>
