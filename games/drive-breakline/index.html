0, 92, 82, 38], [65, 98, 69, 30], [72, 94, 78, 42], [73, 93, 79, 40],\n    [82, 87, 81, 53], [86, 84, 86, 57], [81, 94, 83, 47], [91, 67, 96, 87], [89, 72, 94, 98],\n    [99, 68, 89, 76], [86, 89, 87, 75], [92, 81, 91, 73], [98, 73, 88, 78], [94, 76, 94, 93],\n    [72, 88, 83, 42], [68, 93, 74, 33], [67, 94, 71, 35], [74, 88, 78, 41], [84, 86, 82, 55],\n    [90, 66, 93, 86], [85, 70, 91, 93], [94, 75, 86, 82],\n];\nconst SKINS = ['#a86443', '#e8b58a', '#76482f', '#d99970', '#bd7c55', '#f0c8a3'];\nconst HAIR = ['#272020', '#4a2f23', '#211b20', '#c39251', '#382620'];\nexport function makePlayers() {\n    const out = [];\n    for (const team of [0, 1])\n        for (let i = 0; i < 23; i++) {\n            const b = BASE[i];\n            const boost = team === 0 ? 2 : -2;\n            out.push({ id: team * 23 + i, team, number: i + 1, name: NAMES[team][i], position: POSITIONS[i],\n                speed: Math.min(99, b[0] + boost), power: Math.min(99, b[1] - boost), handling: b[2], kicking: b[3],\n                x: 0, z: 0, vx: 0, vz: 0, facing: team === 0 ? Math.PI / 2 : -Math.PI / 2, stamina: 100, down: 0, dodge: 0, cooldown: 0,\n                active: i < 15, used: false, yellowUntil: 0, yellows: 0, red: false, offside: false, protectedUntil: 0, slot: i,\n                skin: SKINS[(i + team * 2) % SKINS.length], hair: HAIR[(i * 3 + team) % HAIR.length] });\n        }\n    return out;\n}\nexport const DEFAULT_SETTINGS = {\n    team: 0, duration: 6, difficulty: 'club',\n    sound: true, volume: 0.6, shake: true, replay: true, autoSwitch: true, redReplacement: false,\n    quality: 'high', contrast: false,\n};\nexport const CONTROL_GROUPS = [\n    { title: 'RUN THE SHOW', items: [['W A S D / ↑ ← ↓ →', 'Move your selected player'], ['SHIFT', 'Sprint • uses stamina'], ['Q / E', 'Pass left / right • backwards only'], ['SPACE', 'Sidestep, tackle, or ground a try'], ['R / TAB', 'Switch to the best-positioned teammate'], ['B', 'Overdrive • spend a full energy bar']] },\n Manage substitutions at a stoppage. A yellow card is 10 match minutes. Full red cards are permanent; the optional 20-minute replacement variation is configurable.'],\n];\n","rules.js":"import { FIELD, clamp, other } from './types.js';\n/** Directions are world-space, and flip at half-time. */\nexport function direction(team, half) {\n    return ((team === 0 ? 1 : -1) * (half === 1 ? 1 : -1));\n}\nexport function isForwardPass(from, to, dir) {\n    return (to.x - from.x) * dir > 0.12;\n}\nexport function inOwn22(x, dir) { return x * dir <= -28; }\nexport function inOppositionGoal(x, z, dir) {\n    return x * dir >= FIELD.tryX && x * dir < FIELD.deadX && Math.abs(z) < FIELD.touchZ;\n}\nexport function goalCrossing(previous, now, dir) {\n    const line = FIELD.tryX * dir;\n    if ((previous.x - line) * dir >= 0 || (now.x - line) * dir < 0)\n        return false;\n    const t = (line - previous.x) / (now.x - previous.x);\n    const y = previous.y + (now.y - previous.y) * t;\n    const z = previous.z + (now.z - previous.z) * t;\n    return y > FIELD.crossbar && Math.abs(z) < FIELD.posts;\n}\nexport function touchDecision(ball, half) {\n    if (ball.kickTeam !== null) {\n        const dir = direction(ball.kickTeam, half);\n        if (ball.penaltyTouch)\n            return { team: ball.kickTeam, x: clamp(ball.x, -45, 45), reason: 'Penalty to touch • your throw' };\n        if (ball.kickType !== 'restart' && !ball.carriedBackHalf && ball.bounced && ball.kickOriginX * dir <= 0 && ball.x * dir >= 28) {\n            return { team: ball.kickTeam, x: clamp(ball.x, -45, 45), reason: '50:22 • kicking side keeps the throw' };\n        }\n        const noGain = !ball.bounced && (!inOwn22(ball.kickOriginX, dir) || ball.carriedBack22);\n        const x = noGain ? (dir > 0 ? Math.min(ball.x, ball.kickOriginX) : Math.max(ball.x, ball.kickOriginX)) : ball.x;\n        return { team: other(ball.lastTeam), x: clamp(x, -45, 45), reason: noGain ? 'Direct to touch • no gain in ground' : 'Touc
