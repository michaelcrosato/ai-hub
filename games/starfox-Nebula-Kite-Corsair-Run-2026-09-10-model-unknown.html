<script type="module">
import * as THREE from 'three/webgpu';
import { boot } from 'kit/boot.js';
import { createPost } from 'kit/post.js';
import { createPoints } from 'kit/points.js';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------- helpers
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
/** Keep the items that pass, in place (no new array every step). */
function prune(list, keep) {
  let n = 0;
  for (let i = 0; i < list.length; i++) if (keep(list[i])) list[n++] = list[i];
  list.length = n;
}
const root = document.documentElement;
const shakeScale = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.35 : 1;

// ---------------------------------------------------------------- save data: best scores, unlocks, options
const SAVE_KEY = 'nebula-kite.corsair-run.v1';
const save = { best: {}, unlocked: 1, diff: 1, muted: false };
try {
  const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (raw && typeof raw === 'object') {
    if (raw.best && typeof raw.best === 'object') for (const [k, v] of Object.entries(raw.best)) if (Number.isFinite(v)) save.best[k] = v;
    save.unlocked = raw.unlocked === 2 ? 2 : 1;
    if ([0, 1, 2].includes(raw.diff)) save.diff = raw.diff;
    save.muted = !!raw.muted;
  }
} catch {
  /* private mode or bad data: start fresh */
}
function persist() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch {
    /* storage blocked: progress lasts for this visit */
  }
}

// ---------------------------------------------------------------- boot
const kit = await boot({
  title: 'Nebula Kite: Corsair Run',
  gear: 'none', // the title and pause menus have a Settings button (F9 works too)
  accent: '#9ed7ff',
  background: '#02040a',
  touch: { top: 'center', topOffset: 10 },
  input: {
    move: { type: 'vector', keys: 'wasd+arrows', gamepad: 'leftStick+dpad', touch: 'stick' },
    fire: { keys: ['Space', 'KeyJ'], mouse: [0], gamepad: ['A', 'RT'], touch: 'Fire' },
    boost: { keys: ['ShiftLeft', 'ShiftRight', 'KeyK'], mouse: [2], gamepad: ['X'], touch: 'Boost' },
    brake: { keys: ['KeyC'], gamepad: ['LT'], touch: 'Brake' },
    roll: { touch: 'Roll' },
    bomb: { keys: ['KeyB'], gamepad: ['B'], touch: 'Bomb' },
    bankL: { keys: ['KeyQ'], gamepad: ['LB'] },
    bankR: { keys: ['KeyE'], gamepad: ['RB'] },
    pause: { keys: ['Escape', 'KeyP'], gamepad: ['Start'], touch: { label: 'II', slot: 'top' } },
    confirm: { keys: ['Enter', 'NumpadEnter'] },
    restart: { keys: ['KeyR'] },
    mute: { keys: ['KeyM'] },
  },
});
const input = kit.input;
kit.canvas.setAttribute('aria-label', 'Nebula Kite game view');

// ---------------------------------------------------------------- content
const DIFFS = [
  { id: 'cadet', name: 'CADET', dmg: 0.6, fire: 1.35, bombs: 4, time: 10, note: 'Cadet: softer hits, slower enemy fire, 4 Nova Bombs and 10 s more at the gate.' },
  { id: 'corsair', name: 'CORSAIR', dmg: 1, fire: 1, bombs: 3, time: 0, note: 'Corsair: the original run with 3 Nova Bombs.' },
  { id: 'ace', name: 'ACE', dmg: 1.35, fire: 0.8, bombs: 2, time: -4, note: 'Ace: harder hits, faster enemy fire, 2 Nova Bombs and a tighter gate.' },
];
const SORTIES = [
  {
    name: 'ASTEROID RELAY', bossName: 'RAIDER CARRIER', deadline: 66, theme: 0,
    intro: 'CONTROL: KEEP MOVING',
    music: [98, 147, 196, 165, 123, 185, 220, 196],
    timeline: [[2.5, 'wave', 3], [5.5, 'rocks', 5], [8, 'wave', 4], [11, 'gate', 1], [14, 'wave', 5], [17.5, 'rocks', 7], [20, 'ace', 2], [23, 'wave', 5], [27, 'gate', 2], [30, 'boss', 1]],
    winTitle: 'RUN COMPLETE', winSub: 'JUMP GATE SECURED', winText: 'The command carrier is scrap. The convoy has a clear route home.',
  },
  {
    name: 'CINDER WAKE', bossName: 'TWIN FRIGATE', deadline: 72, theme: 1,
    intro: 'SORTIE 2 // CINDER WAKE',
    music: [110, 165, 131, 196, 147, 220, 175, 131],
    timeline: [[2, 'wave', 4], [4.5, 'mine', 3], [7, 'lancer', 2], [9.5, 'rocks', 6], [11.5, 'cell', 1], [12.5, 'wave', 5], [15.5, 'mine', 4], [18, 'lancer', 3], [20.5, 'ace', 2], [23, 'gate', 2], [25.5, 'cell', 1], [26.5, 'wave', 5], [29, 'lancer', 2], [31, 'mine', 3], [34, 'frigate', 1]],
    winTitle: 'WAKE CLEARED', winSub: 'TWIN FRIGATE DOWN', winText: 'Both frigate guns are slag and the Cinder Wake is open. The convoy follows you home.',
  },
];
const TYPE_OF = { wave: 'fighter', rocks: 'rock' };
const POINTS = { fighter: 100, ace: 180, lancer: 160, mine: 120 };
const FIRST_SEEN = {
  gate: 'BARRIER SCREEN // FLY AROUND IT',
  mine: 'PROXIMITY MINES // SHOOT BEFORE THEY ARM',
  lancer: 'LANCERS ON THE FLANKS',
  cell: 'SHIELD CELL // FLY THROUGH IT',
};
const THEMES = [
  { bg: [[0, '#061021'], [0.48, '#111b38'], [0.49, '#20142d'], [1, '#05050a']], cross: '#21375a', long: '#132743', far: '#20142d', near: '#05050a', star: '#bee1ff' },
  { bg: [[0, '#13060f'], [0.48, '#2a1024'], [0.49, '#3b1a18'], [1, '#090305']], cross: '#5c2838', long: '#3a1626', far: '#3b1a18', near: '#090305', star: '#ffbd8c' },
];
const HELP = {
  keyboard: {
    rows: [['WASD / ARROWS', 'steer'], ['SPACE / CLICK', 'laser'], ['SHIFT / RIGHT CLICK', 'boost'], ['C', 'brake'], ['Q / E', 'bank; double-tap roll'], ['B', 'Nova Bomb'], ['P / ESC', 'pause'], ['R', 'restart'], ['M', 'sound'], ['F9', 'settings']],
    note: 'Mouse: move pointer to steer. Click to fire. Keyboard and mouse can be mixed.',
  },
  gamepad: {
    rows: [['L STICK / D-PAD', 'steer'], ['A / RT', 'laser'], ['X', 'boost'], ['LT', 'brake'], ['LB / RB', 'bank; double-tap roll'], ['B', 'Nova Bomb'], ['START', 'pause'], ['A / B', 'choose / back in menus']],
    note: 'Barrel-roll through red shots to deflect them for points.',
  },
  touch: {
    rows: [['LEFT THUMB', 'steer'], ['FIRE', 'laser (hold)'], ['BOOST', 'fast dodge'], ['BRAKE', 'steady aim'], ['ROLL', 'barrel roll'], ['BOMB', 'Nova Bomb'], ['II', 'pause']],
    note: 'Barrel-roll through red shots to deflect them for points.',
  },
};
const ROLL_TIME = 0.62, ROLL_COOLDOWN = 0.45;
// Enemy shots hit within this distance of the ship. The old 0.13 reached ~140 px from a 76 px wide
// ship (shots that visibly missed still hit); 0.09 is still forgiving but reads true.
const SHOT_HIT = 0.09;
const SHIP_Z = 3.3, SHIP_PITCH = 1.0, FOLLOW = 0.72;
const MAX_SHOTS = 96, MAX_ESHOTS = 160, MAX_SPARKS = 640;

// ---------------------------------------------------------------- audio (starts on the first gesture)
let ac = null, master = null, noiseBuf = null;
function initAudio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
    } catch {
      return;
    }
    master = ac.createGain();
    master.gain.value = save.muted ? 0 : 1;
    master.connect(ac.destination);
    // One shared noise buffer for every explosion instead of a fresh one per blast.
    const len = Math.floor(ac.sampleRate * 0.5);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac.state !== 'running' && !kit.paused && !document.hidden) ac.resume().catch(() => {});
}
for (const type of ['pointerdown', 'keydown', 'touchend']) addEventListener(type, initAudio, true);
// A suspended context would replay a pile of queued sounds later, so nothing is scheduled then.
const audible = () => !!ac && !save.muted && ac.state === 'running';
function tone(f = 440, d = 0.06, type = 'square', vol = 0.035, slide = 0, delay = 0) {
  if (!audible()) return;
  const now = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, now);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), now + d);
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + d);
  o.connect(g).connect(master);
  o.start(now);
  o.stop(now + d + 0.02);
}
function noise(d = 0.1, vol = 0.04) {
  if (!audible()) return;
  const now = ac.currentTime;
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = noiseBuf;
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + d);
  s.connect(g).connect(master);
  s.start(now, Math.random() * Math.max(0, noiseBuf.duration - d), d);
}
const soundLabel = () => 'SOUND: ' + (save.muted ? 'OFF' : 'ON');

// ---------------------------------------------------------------- camera: the old projection, in three.js
// The software renderer drew a game point (x right, y down, z away) at
//   screen = (W/2 + x·F/z, 0.46·H + y·F/z),  F = 0.78·7.6·min(W, H).
// three.js looks down -z with y up, so the point sits at (x, -y, -z); the field of view and a view
// offset reproduce F and put the principal point 46 % down the screen. The camera now follows the
// ship (the old fixed view let the ship fly off screen), so the world shifts the way it does in
// every rail shooter.
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(10, 1, 0.4, 140);
const view = { W: 1, H: 1, F: 1, fullH: 1, offY: 0, sc: 1, px: 1, sx: 0, sy: 0 };
kit.onResize((w, h) => {
  view.W = w;
  view.H = h;
  view.F = 0.78 * 7.6 * Math.min(w, h);
  view.fullH = h * 1.08;
  view.offY = h * 0.08;
  view.sc = Math.min(w, h) / 540;
  view.px = clamp(view.sc, 0.75, 1.6); // size of the flat sprites (bolts, sparks), as on the 540-line original
  camera.fov = (2 * Math.atan(view.fullH / 2 / view.F) * 180) / Math.PI;
  view.sx = view.sy = 0;
  camera.setViewOffset(w, view.fullH, 0, view.offY, w, h); // also sets the aspect and the projection
});

// Screen-space background gradient (the old canvas fill), repainted per sortie.
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 4;
bgCanvas.height = 512;
const bgTex = new THREE.CanvasTexture(bgCanvas);
bgTex.colorSpace = THREE.SRGBColorSpace;
bgTex.generateMipmaps = false;
bgTex.minFilter = THREE.LinearFilter;
scene.background = bgTex;

// Tuned so faces turned to the light show the old flat fill colours; the rest shade darker.
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a2040, 1.5));
const sun = new THREE.DirectionalLight(0xfff4e6, 2.2);
sun.position.set(2, 3, 4);
scene.add(sun);

// ---------------------------------------------------------------- materials (few, shared)
const _c = new THREE.Color();
const hdr = (hex, k) => new THREE.Color(hex).multiplyScalar(k);
const matSolid = new THREE.MeshLambertMaterial({ vertexColors: true });
const matFlash = new THREE.MeshBasicMaterial({ color: 0xffffff });
const matGlowRed = new THREE.MeshBasicMaterial({ color: hdr('#ff5b4f', 1.3) });
const matGlowMint = new THREE.MeshBasicMaterial({ color: hdr('#79e0b2', 1.8) });
const matBarrier = new THREE.MeshBasicMaterial({ color: '#ff4a4a', transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
const matLaser = new THREE.MeshBasicMaterial({ color: hdr('#aefaff', 2.2) });
const matEShot = new THREE.MeshBasicMaterial({ color: hdr('#ff6c5d', 2.2) });
const matSpark = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
const matFlame = new THREE.MeshBasicMaterial({ color: hdr('#9cf6ff', 2), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
const matRing = new THREE.MeshBasicMaterial({ color: hdr('#ffe9a8', 1.6), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });

// ---------------------------------------------------------------- low-poly models (flat colours per part, like the old polygons)
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
/** Flat normals and one colour (with optional per-face shade jitter) on a non-indexed geometry. */
function paint(geo, hex, jitter = 0) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  if (g !== geo) geo.dispose();
  g.clearGroups();
  g.deleteAttribute('uv');
  g.computeVertexNormals();
  const n = g.attributes.position.count, col = new Float32Array(n * 3);
  _c.set(hex);
  for (let i = 0; i < n; i += 3) {
    const k = jitter ? 1 + (Math.random() * 2 - 1) * jitter : 1;
    for (let j = i; j < Math.min(n, i + 3); j++) {
      col[j * 3] = _c.r * k;
      col[j * 3 + 1] = _c.g * k;
      col[j * 3 + 2] = _c.b * k;
    }
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}
const hull = (pts, hex, jitter = 0) => paint(new ConvexGeometry(pts), hex, jitter);
function merged(parts) {
  const g = mergeGeometries(parts);
  for (const p of parts) p.dispose();
  g.computeBoundingSphere();
  return g;
}
function box3(x0, x1, y0, y1, z0, z1) {
  const pts = [];
  for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1]) pts.push(V3(x, y, z));
  return pts;
}

/** The Nebula Kite, in the old sprite's pixel units (forward is -z): the same arrow, wings, canopy and engines. */
function shipGeometry() {
  const parts = [
    hull([V3(0, 0.5, -18), V3(-10, 0, 11), V3(10, 0, 11), V3(0, 4, 2), V3(0, 3, 10), V3(0, -3, 4), V3(0, -2, 10)], '#bdd7e8'),
    hull([V3(-3, 2.2, -7), V3(3, 2.2, -7), V3(-3, 2.6, 4), V3(3, 2.6, 4), V3(0, 5.4, -2), V3(0, 5.2, 3)], '#69d5ff'),
    hull([V3(-0.6, 3, 5), V3(0.6, 3, 5), V3(-0.6, 9.5, 13), V3(0.6, 9.5, 13), V3(-0.6, 3, 12), V3(0.6, 3, 12)], '#a9c4d6'),
  ];
  for (const s of [-1, 1]) {
    const wing = [];
    for (const [x, z] of [[8, 3], [38, 15], [22, 0], [5, -4]]) {

const pools = {};
function definePool(type, make) {

}
function acquire(type) {

  if (!o.parent) scene.add(o);
  o.visible = true;
  return o;
}
function release(type, o) {
  o.visible = false;
  pools[type].free.push(o);
}

      e.x = 0; e.y = 0.05; e.z = 48 + i * 12; e.vz = 8; e.r = 0.52; e.hp = 99;
    } else if (type === 'ace') {

function firePlayer() {
  const P = player;
  if (P.fireCd > 0) return;
  P.fireCd = 0.115;
  shots.push({ x: P.x - 0.035, y: P.y, z: 3, vz: 46, life: 1.4 });
  shots.push({ x: P.x + 0.035, y: P.y, z: 3, vz: 46, life: 1.4 });
  fired += 2;

}
function startRoll(dir) {
  const P = player;
  if (P.rollT > 0 || P.rollCd > 0) return; // no chaining rolls into permanent invulnerability
  P.rollT = ROLL_TIME;
  P.rollDir = dir;
  tone(310, 0.12, 'square', 0.025, 120);
  input.rumble(0.2, 80);
}
function bomb() {
  const P = player;
  if (P.bombs <= 0) {
    tone(120, 0.08, 'square', 0.02);
    return;
  }
  P.bombs--;
  flash = 0.35;
  shake = 10;
  bombFx = 0;
  bombX = P.x;
  bombY = P.y;
  tone(90, 0.45, 'sawtooth', 0.07, 600);
  input.rumble(0.8, 320);
  for (const e of ents) {
    if (e.dead || e.z >= 48 || e.type === 'rock' || e.type === 'gate' || e.type === 'cell') continue;
    if (e.type === 'frigate') {
      for (const p of e.pods) {
        if (p.hp <= 0) continue;
        p.hp = Math.max(0, p.hp - 5);
        p.hitT = 0.1;
        if (p.hp <= 0) podDown(e, p);
      }
      if (e.open) {
        e.hp -= 8;
        e.hitT = 0.1;
        if (e.hp <= 0 && !e.dead) killEnemy(e, true);
      }
      continue;
    }
    e.hp -= e.boss ? 8 : 99;
    e.hitT = 0.1;
    if (e.hp <= 0 && !e.dead) killEnemy(e, true);
  }
  eshots.length = 0;
}
function enemyShot(e) {
  eshots.push({ x: e.x, y: e.y, z: e.z - 1, vx: 0, vy: 0, vz: -18, life: 3 });
  tone(190, 0.05, 'sawtooth', 0.012, -60);

function aimedShot(x, y, z, ox, oy) {
  const P = player, T = Math.max(0.6, (z - 4) / 18);
  eshots.push({ x, y, z: z - 1, vx: clamp((P.x - x) / T + ox, -0.9, 0.9), vy: clamp((P.y - y) / T + oy, -0.9, 0.9), vz: -18, life: 3.2 });

}
function hitPlayer(dmg) {
  const P = player;
  if (!P.alive || outro || P.inv > 0 || P.rollT > 0) return;
  dmg *= diff.dmg;
  P.shield -= dmg;
  damageTaken += dmg;
  P.inv = 0.55;
  shake = 9;
  flash = 0.12;
  noise(0.1, 0.07);
  say('SHIELDS ' + Math.max(0, Math.ceil(P.shield)) + '%', 1.1);
  input.rumble(0.55, 160);
  if (P.shield <= 0) {
    P.shield = 0;
    P.alive = false;
    explode({ x: P.x, y: P.y, z: 4 }, true);
    outro = { t: 1.1, won: false, reason: 'shield' };
    input.rumble(1, 600);
  }
}

  // Bolts already in flight can finish the boss after the ship is lost or the gate has shut: the
  // kill scores, but the run stays lost (the old timers let a late kill overwrite the loss).
  if (outro) return;
  say('CORE COLLAPSE // CORRIDOR CLEAR', 2.5);
  eshots.length = 0;
  outro = { t: 1.3, won: true, reason: 'win' };
}
function podDown(e, p) {
  kills++;
  score += 300;
  explode({ x: e.x + p.ox, y: e.y, z: e.z }, false);
  input.rumble(0.4, 150);
  if (!e.open && e.pods[0].hp <= 0 && e.pods[1].hp <= 0) {
    e.open = true;
    e.fire = 0.8;
    say('CORE SHUTTER OPEN // FIRE!', 2.2);
    tone(440, 0.2, 'square', 0.03, 220);
  }
}
/** Bolt against the frigate: pods first, then the core (shuttered until both pods are gone), then the hull. */
function hitFrigate(e, s) {
  for (const p of e.pods) {
    if (p.hp > 0 && Math.hypot(s.x - (e.x + p.ox), s.y - e.y) < 0.2) {
      s.life = 0;
      landed++;
      p.hp--;
      p.hitT = 0.08;
      if (p.hp <= 0) podDown(e, p);
      else burst(s.x, s.y, e.z, 3, SPARK.white, SPARK.cyan, 0.5, 0.1, 0.3);
      return true;
    }
  }
  if (Math.hypot(s.x - e.x, s.y - e.y) < 0.22) {
    s.life = 0;
    if (e.open) {
      landed++;
      e.hp--;
      e.hitT = 0.08;
      if (e.hp <= 0) killEnemy(e, false);
      else burst(s.x, s.y, e.z, 3, SPARK.white, SPARK.red, 0.5, 0.1, 0.3);
    } else {
      burst(s.x, s.y, e.z + 0.3, 3, SPARK.white, SPARK.white, 0.4, 0.08, 0.2);
      tone(1200, 0.025, 'square', 0.01);
    }
    return true;
  }
  if (Math.abs(s.x - e.x) < 0.53 && Math.abs(s.y - e.y) < 0.15) {
    s.life = 0;
    burst(s.x, s.y, e.z + 0.3, 2, SPARK.white, SPARK.white, 0.3, 0.08, 0.18);
    return true;
  }
  return false;
}
function frigateFire(e, dt) {
  if (e.z > 40) return;
  e.fire -= dt;
  if (e.fire > 0) return;
  if (!e.open) {
    let p = e.pods[e.nextPod];
    if (p.hp <= 0) {
      e.nextPod ^= 1;
      p = e.pods[e.nextPod];
    }
    e.nextPod ^= 1;
    aimedShot(e.x + p.ox, e.y, e.z, 0, 0);
    e.fire = 0.55 * diff.fire;
  } else {
    for (let i = -1; i <= 1; i++) aimedShot(e.x, e.y, e.z, i * 0.3, 0);
    e.fire = 0.6 * diff.fire;
  }
}
function detonate(e) {
  e.dead = true;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    eshots.push({ x: e.x, y: e.y, z: e.z - 0.5, vx: Math.cos(a) * 0.42, vy: Math.sin(a) * 0.42, vz: -15, life: 3 });
  }
  burst(e.x, e.y, e.z, kit.detail(14, 10), SPARK.red, SPARK.orange, 0.9, 0.2, 0.6);
  noise(0.16, 0.05);
  tone(150, 0.12, 'sawtooth', 0.03, -60);
}
function collectCell(e) {
  const P = player;
  P.shield = Math.min(100, P.shield + 20);
  score += 50;
  say('SHIELD CELL +20%', 1.4);
  tone(660, 0.08, 'triangle', 0.04, 330);
  tone(990, 0.14, 'triangle', 0.03, 0, 0.08);
  burst(e.x, e.y, 4.2, 10, SPARK.mint, SPARK.white, 0.6, 0.2, 0.5);
  input.rumble(0.2, 60);
}
function music(dt) {
  if (!audible()) return;
  musicT -= dt;
  if (musicT > 0) return;
  musicT = 0.18;
  const notes = SORTIES[sortie].music, f = notes[musicStep++ % notes.length];
  tone(f, 0.13, 'square', 0.012);
  if (musicStep % 4 === 0) tone(f / 2, 0.16, 'triangle', 0.018);
  if (bossEnt && musicStep % 2 === 0) tone(f * 2, 0.06, 'square', 0.006);
}

// ---------------------------------------------------------------- simulation (fixed 60 Hz, the original rules)
const shotAlive = (s) => s.life > 0 && s.z < 80;
const eshotAlive = (s) => s.life > 0 && s.z > -2;
const sparkAlive = (p) => p.life > 0;

function update(dt) {
  if (state !== 'play' || paused) return;
  const P = player, S = SORTIES[sortie];
  t += dt;
  stageT += dt;
  music(dt);
  P.fireCd -= dt;
  P.inv -= dt;
  P.rollCd -= dt;
  msgT -= dt;
  flash -= dt;
  shake *= Math.pow(0.02, dt);
  if (outro) {
    outro.t -= dt;
    if (outro.t <= 0) {
      finish(outro.won, outro.reason);
      return;
    }
  }

  if (P.alive) {
    const dx = ctl.dx, dy = ctl.dy;
    let speed = 2.15;
    P.boosting = P.braking = false;
    if (ctl.boost && P.boost > 0) {
      speed = 3.15;
      P.boost = Math.max(0, P.boost - 36 * dt);
      P.boosting = true;
    } else if (ctl.brake && P.boost > 0) {
      speed = 1.25;
      P.boost = Math.max(0, P.boost - 24 * dt);
      P.braking = true;
    } else P.boost = Math.min(100, P.boost + 18 * dt);
    const k = 1 - Math.pow(0.001, dt);
    P.vx = lerp(P.vx, dx * speed, k);
    P.vy = lerp(P.vy, dy * speed, k);
    P.x = clamp(P.x + P.vx * dt, -1.12, 1.12);
    P.y = clamp(P.y + P.vy * dt, -0.72, 0.78);
    if (ctl.tapQ) {
      if (t - P.lastQ < 0.28) startRoll(-1);
      P.lastQ = t;
    }
    if (ctl.tapE) {
      if (t - P.lastE < 0.28) startRoll(1);
      P.lastE = t;
    }
    if (ctl.tapRoll) startRoll(dx < -0.2 ? -1 : 1);
    if (P.rollT > 0) {
      P.rollT -= dt;
      if (P.rollT <= 0) {
        P.rollT = 0;
        P.rollCd = ROLL_COOLDOWN;
      }
    } else {
      const bankHeld = ctl.bank;
      P.roll = lerp(P.roll, bankHeld * 0.72, 1 - Math.pow(0.01, dt));
      if (bankHeld && Math.sign(dx) === bankHeld) P.vx += bankHeld * 0.9 * dt;
    }
    if (!outro) {
      if (ctl.fire) firePlayer();
      if (ctl.bomb) bomb();
    }
    alarmT -= dt;
    if (P.shield < 30 && alarmT <= 0) {
      alarmT = 1.1;
      tone(880, 0.07, 'square', 0.016);
    }
  } else P.boosting = P.braking = false;
  ctl.tapQ = ctl.tapE = ctl.tapRoll = ctl.bomb = false;

  const tl = S.timeline;
  while (spawnCursor < tl.length && stageT >= tl[spawnCursor][0]) {
    const row = tl[spawnCursor++];
    spawn(TYPE_OF[row[1]] || row[1], row[2]);
  }

  for (const s of shots) {
    s.z += s.vz * dt;
    s.life -= dt;
  }
  for (const s of eshots) {
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.z += s.vz * dt;
    s.life -= dt;
    if (P.alive && !outro && s.z < 5 && s.z > 1 && Math.hypot(s.x - P.x, s.y - P.y) < SHOT_HIT) {
      s.life = 0;
      if (P.rollT > 0) {
        score += 25;
        tone(520, 0.04, 'square', 0.02);
        burst(s.x, s.y, s.z, 5, SPARK.cyan, SPARK.white, 0.5, 0.15, 0.35);
      } else hitPlayer(9);
    }
  }

  for (const e of ents) {
    if (e.dead) continue;
    if (e.hitT > 0) e.hitT -= dt;
    e.phase += dt * (e.type === 'ace' ? 3 : 1.8);
    switch (e.type) {
      case 'boss':
        e.z = Math.max(24, e.z - e.vz * dt);
        e.x = Math.sin(e.phase * 0.45) * 0.38;
        e.y = Math.sin(e.phase * 0.7) * 0.18;
        break;
      case 'frigate':
        e.z = Math.max(26, e.z - e.vz * dt);
        e.x = Math.sin(e.phase * 0.4) * 0.5;
        e.y = Math.sin(e.phase * 0.65) * 0.16;
        if (e.open) e.openT = Math.min(1, e.openT + dt * 2.5);
        for (const p of e.pods) if (p.hitT > 0) p.hitT -= dt;
        break;
      case 'lancer':
        e.z -= e.vz * dt;
        e.x += e.vx * dt;
        e.y += Math.sin(e.phase * 1.4) * dt * 0.12;
        break;
      case 'mine':
        e.z -= e.vz * dt;
        e.x += Math.sin(e.phase) * dt * 0.12;
        break;
      default:
        e.z -= e.vz * dt;
        if (e.type === 'fighter') e.x += Math.sin(e.phase) * dt * 0.33;
        else if (e.type === 'ace') {
          e.x += Math.sin(e.phase) * dt * 0.52;
          e.y += Math.cos(e.phase * 1.3) * dt * 0.22;
        }
    }
    if (!outro) {
      if (e.type === 'fighter' || e.type === 'ace' || e.type === 'boss') {
        if (e.z < 36) {
          e.fire -= dt;
          if (e.fire <= 0) {
            e.fire = (e.type === 'boss' ? 0.35 : rnd(0.7, 1.5)) * diff.fire;
            enemyShot(e);
          }
        }
      } else if (e.type === 'lancer') {
        if (e.z < 34) {
          e.fire -= dt;
          if (e.fire <= 0) {
            e.fire = rnd(0.9, 1.4) * diff.fire;
            aimedShot(e.x, e.y, e.z, 0, 0);
          }
        }
      } else if (e.type === 'frigate') frigateFire(e, dt);
      else if (e.type === 'mine' && e.z < 13) {
        detonate(e);
        continue;
      }
    }
    if (e.z < 4.5) {
      if (P.alive && !outro) {
        const d = Math.hypot(e.x - P.x, e.y - P.y);
        if (e.type === 'cell') {
          if (d < 0.22) collectCell(e);
        } else if (e.type === 'rock' || e.type === 'gate') {
          if (d < e.r * 0.9) hitPlayer(e.type === 'gate' ? 18 : 15);
        } else if (d < e.r + 0.1) hitPlayer(12);
      }
      e.dead = true;
    }
  }

  for (const s of shots) {
    if (s.life <= 0) continue;
    for (const e of ents) {
      if (e.dead || e.type === 'rock' || e.type === 'gate' || e.type === 'cell') continue;
      if (Math.abs(s.z - e.z) >= 1.9) continue;
      if (e.type === 'frigate') {
        if (hitFrigate(e, s)) break;
        continue;
      }
      if (Math.hypot(s.x - e.x, s.y - e.y) >= e.r) continue;
      s.life = 0;
      landed++;
      e.hp--;
      e.hitT = 0.08;
      if (e.hp <= 0) killEnemy(e, false);
      else {
        burst(s.x, s.y, e.z, 4, SPARK.white, SPARK.cyan, 0.5, 0.1, 0.3);
        tone(240, 0.03, 'square', 0.015);
      }
      break;
    }
  }

  prune(shots, shotAlive);
  prune(eshots, eshotAlive);
  let n = 0;
  for (let i = 0; i < ents.length; i++) {
    const e = ents[i];
    if (!e.dead && e.z > -4 && Math.abs(e.x) < 2.2) ents[n++] = e;
    else {
      if (e === bossEnt) bossEnt = null;
      if (e.obj) release(e.type, e.obj);
      e.obj = null;
    }
  }
  ents.length = n;

  // The jump gate: only while the boss still flies (the old check also fired after a kill).
  if (bossEnt && !outro) {
    const end = deadline();
    if (stageT > end - 11) say('JUMP GATE CLOSING', 0.3);
    if (stageT > end) {
      say('JUMP GATE CLOSED', 2);
      outro = { t: 0.9, won: false, reason: 'gate' };
      tone(140, 0.6, 'sawtooth', 0.05, -90);
      input.rumble(0.8, 400);
    }
  }
}

// ---------------------------------------------------------------- flow: start, pause, results
const panel = $('panel'), card = $('card'), topBtns = $('topBtns'), muteBtn = $('mute'), pauseBtn = $('pauseBtn');
let panelShown = false, panelAt = 0, mouseSteer = false, lastPX = -1, lastPY = -1;
let camX = 0, camY = 0, camRoll = 0, acc = 0;

function clearWorld() {
  for (const e of ents) if (e.obj) release(e.type, e.obj);
  ents.length = shots.length = eshots.length = particles.length = 0;
  bossEnt = null;
  outro = null;
  bombFx = -1;
}
function startSortie(i) {
  initAudio();
  sortie = i;
  diff = DIFFS[save.diff];
  clearWorld();
  player = basePlayer();
  t = stageT = score = kills = shake = flash = 0;
  fired = landed = damageTaken = 0;
  bossSpawned = false;
  spawnCursor = 0;
  won = false;
  musicT = musicStep = alarmT = 0;
  seen.clear();
  Object.assign(ctl, { dx: 0, dy: 0, fire: false, boost: false, brake: false, bank: 0, tapQ: false, tapE: false, tapRoll: false, bomb: false });
  mouseSteer = false;
  camX = camY = 0;
  acc = 0;
  applyTheme(SORTIES[i].theme);
  state = 'play';
  paused = false;
  hidePanel();
  say(SORTIES[i].intro, 2.2);
  tone(220, 0.08, 'square', 0.03);
  tone(330, 0.1, 'square', 0.02, 0, 0.08);
  input.settle();
}
function goTitle() {
  clearWorld();
  state = 'title';
  paused = false;
  player = basePlayer();
  applyTheme(0);
  renderTitle('start0');
}
function openPause() {
  if (state !== 'play' || paused) return;
  paused = true;
  const S = SORTIES[sortie];
  showPanel(
    `<h1>PAUSED</h1><h2>SORTIE ${sortie + 1} // ${S.name} · ${diff.name}</h2>
    <div class="col"><button class="primary" data-act="resume">RESUME</button><button data-act="restart">RESTART SORTIE</button><button data-act="settings">SETTINGS</button><button data-act="mute">${soundLabel()}</button><button data-act="title">QUIT TO TITLE</button></div>
    <div class="grid" id="keys"></div><p class="dim note" id="keysNote"></p>
    <div class="small">P / ESC / START or RESUME to continue.</div>`,
    'resume'
  );
}
function resume() {
  if (state !== 'play' || !paused) return;
  paused = false;
  hidePanel();
  input.settle();
}
function finish(win, reason) {
  outro = null;
  state = 'end';
  won = win;
  const S = SORTIES[sortie];
  const bonus = win ? Math.round(Math.max(0, player.shield)) * 10 : 0;
  const total = score + bonus;
  const key = `${sortie}-${diff.id}`;
  const prev = save.best[key] || 0;
  const isBest = total > prev;
  if (isBest) save.best[key] = total;
  const unlockedNow = win && sortie === 0 && save.unlocked < 2;
  if (win && sortie === 0) save.unlocked = 2;
  persist();
  const accuracy = fired ? Math.round((landed / fired) * 100) : 0;
  const sub = win ? S.winSub : reason === 'gate' ? 'THE JUMP GATE CLOSED' : 'THE RAIDERS HOLD THE LANE';
  const text = win ? S.winText : reason === 'gate' ? 'The carrier slipped through the jump gate. Hit it harder and faster next run.' : 'The corridor is still hot. Re-arm and try the run again.';
  const next = win && sortie === 0;
  showPanel(
    `<h1>${win ? S.winTitle : 'KITE DOWN'}</h1><h2>${sub}</h2>
    <p>Hits scored: <b>${kills}</b> &nbsp; Flight score: <b>${score}</b></p>
    <div class="stats"><span>Accuracy</span><b>${accuracy}%</b><span>Shield taken</span><b>${Math.round(damageTaken)}</b>${win ? `<span>Shield bonus</span><b>+${bonus}</b>` : ''}<span>Final score</span><b>${total}</b><span>Best · ${diff.name}</span><b>${Math.max(total, prev)}${isBest && total > 0 ? ' <em class="new">NEW BEST</em>' : ''}</b></div>
    <p>${text}</p>${unlockedNow ? '<p class="new">SORTIE 2 · CINDER WAKE UNLOCKED</p>' : ''}
    <div class="btns">${next ? '<button class="primary" data-act="next">CONTINUE TO SORTIE 2</button><button data-act="again">FLY AGAIN</button>' : '<button class="primary" data-act="again">FLY AGAIN</button>'}<button data-act="title">BACK TO TITLE</button></div>
    <div class="small">R also restarts immediately.</div>`,
    next ? 'next' : 'again'
  );
  tone(win ? 523 : 180, 0.7, 'sawtooth', 0.05, win ? 523 : -140);
}
function renderTitle(focusAct) {

    `<h1>NEBULA KITE</h1>

    <div class="sortie">${save.unlocked >= 2 ? `<button data-act="start1">LAUNCH · SORTIE 2 · CINDER WAKE</button><span class="best">BEST ${best(1)}</span>` : '<div class="locked">SORTIE 2 · CINDER WAKE · clear Sortie 1 to unlock</div>'}</div>
    <div class="btns"><button data-act="diff">DIFFICULTY: ${d.name}</button><button data-act="settings">SETTINGS</button><button data-act="mute">${soundLabel()}</button></div>

function fillKeys() {

input.onSourceChange(() => {

function showPanel(html, focusAct) {

function hidePanel() {

function toggleMute() {
  save.muted = !save.muted;

  if (master) master.gain.value = save.muted ? 0 : 1;
  if (!save.muted) initAudio();
  const label = soundLabel();

  for (const b of card.querySelectorAll('[data-act="mute"]')) b.textContent = label;

function act(a) {
  switch (a) {
    case 'start0': startSortie(0); break;
    case 'start1': if (save.unlocked >= 2) startSortie(1); break;
    case 'next': startSortie(1); break;
    case 'restart': case 'again': startSortie(sortie); break;
    case 'resume': resume(); break;
    case 'title': goTitle(); break;
    case 'settings': kit.menu.open(); break;
    case 'mute': toggleMute(); break;

}
card.addEventListener('click', (e) => {

pauseBtn.addEventListener('click', () => (paused ? resume() : openPause()));

muteBtn.textContent = soundLabel();

// ---------------------------------------------------------------- controls (every device through kit.input actions)
let navHeld = false;
function menuInput() {
  const mv = input.vector('move');
  if (Math.max(Math.abs(mv.x), Math.abs(mv.y)) < 0.5) navHeld = false;
  else if (!navHeld) {
    navHeld = true;
    const list = [...card.querySelectorAll('button')];
    if (list.length) {
      const dir = Math.abs(mv.y) >= Math.abs(mv.x) ? (mv.y > 0 ? -1 : 1) : mv.x > 0 ? 1 : -1;
      const i = list.indexOf(document.activeElement);
      const b = list[i < 0 ? 0 : (i + dir + list.length) % list.length];
      for (const o of card.querySelectorAll('.navfocus')) o.classList.remove('navfocus');
      b.classList.add('navfocus');
      b.focus();
    }
  }
  if (performance.now() - panelAt < 450) return; // fire held through the last blast must not skip the results
  if (state === 'play' && paused && (input.pressed('pause') || input.pressed('bomb'))) {
    resume();
    return;
  }
  const padStart = input.source === 'gamepad' && input.pressed('pause') && state !== 'play';
  if (input.pressed('confirm') || input.pressed('fire') || padStart) {
    const f = document.activeElement;
    const b = f && f.tagName === 'BUTTON' && card.contains(f) ? f : card.querySelector('.primary');
    b?.click();
  }
}
function controls() {
  if (input.pressed('mute')) toggleMute();

    startSortie(sortie);
    return;
  }
  if (panelShown) {
    menuInput();
    return;
  }
  if (state !== 'play' || paused) return;
  if (input.pressed('pause')) {
    openPause();
    return;
  }
  const mv = input.vector('move');
  let dx = mv.x, dy = -mv.y; // the game's y points down
  // Mouse steering: the pointer's offset from the centre of the screen steers, as before. It
  // switches on when the mouse moves over the view and gives way to keys, pad or stick.
  const p = input.pointer;
  if (p.type === 'touch' || !p.over) mouseSteer = false;
  else if (p.x !== lastPX || p.y !== lastPY) mouseSteer = true;
  lastPX = p.x;
  lastPY = p.y;
  if (Math.abs(dx) + Math.abs(dy) > 0.05) mouseSteer = false;
  else if (mouseSteer) {
    const mx = p.nx * 0.8, my = -p.ny * 0.75 - 0.03;
    dx = Math.abs(mx) < 0.04 ? 0 : mx;
    dy = Math.abs(my) < 0.04 ? 0 : my;
  }
  const mag = Math.hypot(dx, dy);
  if (mag > 1) {
    dx /= mag;
    dy /= mag;
  }
  ctl.dx = dx;
  ctl.dy = dy;
  ctl.fire = input.down('fire');
  ctl.boost = input.down('boost');
  ctl.brake = input.down('brake');
  ctl.bank = (input.down('bankR') ? 1 : 0) - (input.down('bankL') ? 1 : 0);
  if (input.pressed('bankL')) ctl.tapQ = true;
  if (input.pressed('bankR')) ctl.tapE = true;
  if (input.pressed('roll')) ctl.tapRoll = true;
  if (input.pressed('bomb')) ctl.bomb = true;
}

// ---------------------------------------------------------------- rendering
const _m = new THREE.Matrix4(), _v = new THREE.Vector3();
let scroll = 0, clock = 0, warmFrames = 2;
const warmObjs = POOL_TYPES.map((type) => [type, acquire(type)]);
const warmFlash = new THREE.Mesh(fighterGeo, matFlash);
scene.add(warmFlash);

/** Stars, floor grid and sparks keep moving on the title and results screens; a pause freezes them. */
function ambient(dt) {
  const P = player;
  if (state === 'play' && paused) return;
  clock += dt;
  const speed = 14.4 * (state === 'play' ? (P.boosting ? 1.6 : P.braking ? 0.6 : 1) : state === 'end' ? 0.5 : 1);
  scroll += speed * dt;
  for (let i = 0; i < STARS; i++) {
    const s = starData[i];
    s.z -= speed * dt;
    if (s.z < 2) {
      s.z = 80;
      s.x = Math.random() * 2 - 1;
      s.y = Math.random() * 2 - 1;
    }
    const a = clamp(1 - s.z / 80, 0.18, 0.9);
    starPos[i * 3] = s.x * 4;
    starPos[i * 3 + 1] = -s.y * 2.5;
    starPos[i * 3 + 2] = -s.z;
    starCol[i * 3] = theme.star.r * a;
    starCol[i * 3 + 1] = theme.star.g * a;
    starCol[i * 3 + 2] = theme.star.b * a;
    starSize[i] = 0.9 + s.s;
  }
  stars.positions.needsUpdate = stars.colors.needsUpdate = stars.sizes.needsUpdate = true;

  // Cross lines scroll toward the ship and fade in at the bottom and out at the horizon.
  const base = scroll % 7;
  for (let k = 0; k < CROSS; k++) {
    const z = 8 + k * 7 - base, o = k * 6;
    gridPos[o] = -2.4; gridPos[o + 1] = -0.95; gridPos[o + 2] = -z;
    gridPos[o + 3] = 2.4; gridPos[o + 4] = -0.95; gridPos[o + 5] = -z;
    const f = clamp((z - 5) / 4, 0, 1) * clamp((78 - z) / 16, 0, 1);
    _c.copy(z < 40 ? theme.near : theme.far).lerp(theme.cross, f);
    gridCol[o] = gridCol[o + 3] = _c.r;
    gridCol[o + 1] = gridCol[o + 4] = _c.g;
    gridCol[o + 2] = gridCol[o + 5] = _c.b;
  }
  gridPosAttr.needsUpdate = gridColAttr.needsUpdate = true;

  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    p.life -= dt;
  }
  prune(particles, sparkAlive);
  if (bombFx >= 0) {
    bombFx += dt;
    if (bombFx > 0.5) bombFx = -1;
  }
}

function render3D(dt) {
  const P = player, live = state === 'play' && !paused;

  // Camera: follows the ship with some lag and keeps it on screen at every window shape.
  const k = 1 - Math.exp(-7 * dt);
  if (state === 'title') {
    camX -= camX * k;
    camY -= camY * k;
    camRoll -= camRoll * k;
  } else {
    if (live) {
      camX += (P.x * FOLLOW - camX) * k;
      camY += (P.y * FOLLOW - camY) * k;
      camRoll += (clamp(-P.vx * 0.015, -0.035, 0.035) - camRoll) * k;
    }
    const ppu = view.F / SHIP_Z;
    const halfX = Math.max(0, (view.W / 2 - 40 * view.sc - 16) / ppu);
    camX = clamp(camX, P.x - halfX, P.x + halfX);
    const touchB = root.classList.contains('kit-touch-on') ? Math.min(view.H * 0.28, 150) : 0;
    const lo = P.y - (view.H * 0.54 - (40 * view.sc + 24 + touchB)) / ppu;
    const hi = P.y + (view.H * 0.46 - Math.max(40 * view.sc + 24, view.H * 0.12)) / ppu; // clear of the top HUD
    camY = lo <= hi ? clamp(camY, lo, hi) : (lo + hi) / 2;
  }
  camera.position.set(camX, -camY, 0);
  camera.rotation.set(0, 0, camRoll);
  let sx = 0, sy = 0;
  if (live && shake > 0.3) {
    const s = shake * shakeScale;
    sx = rnd(-s, s);
    sy = rnd(-s, s);
  }
  if (sx !== view.sx || sy !== view.sy) {
    view.sx = sx;
    view.sy = sy;
    camera.setViewOffset(view.W, view.fullH, sx, view.offY + sy, view.W, view.H);
  }
  camera.updateMatrixWorld();

  // The ship.
  const showShip = state === 'title' || (P.alive && (state === 'play' || won));
  shipRoot.visible = showShip;
  if (showShip) {
    const titleBob = state === 'title';
    shipRoot.position.set(titleBob ? 0 : P.x, -(titleBob ? 0.15 + Math.sin(clock * 1.4) * 0.03 : P.y), -SHIP_Z);
    const bankHeld = clamp(P.roll, -0.8, 0.8);
    shipRoot.rotation.z = -(clamp(P.vx * 0.07, -0.18, 0.18) + bankHeld * 0.28);
    shipPitch.rotation.x = SHIP_PITCH + clamp(-P.vy * 0.12, -0.2, 0.2);
    const spin = P.rollT > 0 ? P.rollDir * (1 - P.rollT / ROLL_TIME) * Math.PI * 4 : 0;
    shipModel.rotation.z = -(clamp(P.vx * 0.2, -0.45, 0.45) + bankHeld) - spin;
    shipMesh.material = P.inv > 0 && Math.floor(t * 18) % 2 ? matFlash : matSolid;
    const boosting = live && P.boosting;
    flameL.visible = flameR.visible = boosting;
    if (boosting) {
      flameL.scale.set(1, 1, rnd(8, 18));
      flameR.scale.set(1, 1, rnd(8, 18));
    }
  }

  // Raiders, rocks, gates, mines, cells and the bosses.
  matBarrier.opacity = 0.2 + 0.08 * Math.sin(clock * 7);
  for (const e of ents) {
    const o = e.obj;
    if (!o) continue;
    o.position.set(e.x, -e.y, -e.z);
    const u = o.userData;
    switch (e.type) {
      case 'fighter':
      case 'ace':
        o.scale.setScalar(e.r * 1.03);
        o.rotation.set(0, Math.sin(e.phase * 0.7) * 0.35, -Math.sin(e.phase) * 0.35);
        break;
      case 'lancer':
        o.scale.setScalar(e.r * 1.05);
        o.rotation.set(0, Math.sin(e.phase) * 0.3, -e.vx * 0.9);
        break;
      case 'rock':
        o.scale.setScalar(e.r);
        o.rotation.set(e.phase * e.sx, e.phase * e.sy, e.phase * 0.2);
        break;
      case 'gate':
        o.scale.setScalar(e.r * 1.03);
        o.rotation.set(0, 0, e.phase * 0.25);
        break;
      case 'mine':
        o.scale.setScalar(e.r);
        u.main.rotation.set(e.phase * 0.6, e.phase * 0.9, 0);
        u.eye.visible = Math.sin(clock * (e.z < 22 ? 16 : 5)) > 0;
        break;
      case 'cell':
        o.scale.setScalar(e.r * 0.8);
        o.rotation.set(clock * 1.3, clock * 2.1, 0);
        break;
      case 'boss':
        o.scale.setScalar(0.534);
        o.rotation.set(0, Math.sin(e.phase * 0.45) * 0.18, Math.sin(e.phase * 0.7) * 0.04);
        break;
      case 'frigate':
        o.scale.setScalar(0.68);
        o.rotation.set(0, Math.sin(e.phase * 0.4) * 0.15, 0);
        for (let i = 0; i < 2; i++) {
          u.pods[i].visible = e.pods[i].hp > 0;
          u.pods[i].material = e.pods[i].hitT > 0 ? matFlash : matSolid;
        }
        u.shutL.position.x = -0.13 - e.openT * 0.3;
        u.shutR.position.x = 0.13 + e.openT * 0.3;
        break;
    }
    u.main.material = e.hitT > 0 ? matFlash : matSolid;
  }

  // Bolts keep the old 4×16 px bars; red shots grow as they close in; sparks are 4 px squares.
  let n = 0;
  for (const s of shots) {
    if (n >= MAX_SHOTS) break;
    const w = s.z / view.F;
    _m.makeScale(4 * view.px * w, 16 * view.px * w, 1).setPosition(s.x, -s.y, -s.z);
    laserMesh.setMatrixAt(n++, _m);
  }
  laserMesh.count = n;
  laserMesh.instanceMatrix.needsUpdate = true;
  n = 0;
  for (const s of eshots) {
    if (n >= MAX_ESHOTS) break;
    if (s.z < 0.6) continue;
    const r = Math.max(0.012, (2.6 * view.px * s.z) / view.F);
    _m.makeScale(r, r, r).setPosition(s.x, -s.y, -s.z);
    eshotMesh.setMatrixAt(n++, _m);
  }
  eshotMesh.count = n;
  eshotMesh.instanceMatrix.needsUpdate = true;
  n = 0;
  for (const p of particles) {
    if (n >= MAX_SPARKS) break;
    if (p.z < 0.6) continue;
    const w = (4 * view.px * p.z) / view.F;
    _m.makeScale(w, w, 1).setPosition(p.x, -p.y, -p.z);
    sparkMesh.setMatrixAt(n, _m);
    sparkMesh.setColorAt(n, _c.copy(p.c).multiplyScalar(clamp(p.life * 2, 0, 1)));
    n++;
  }
  sparkMesh.count = n;
  sparkMesh.instanceMatrix.needsUpdate = true;
  sparkMesh.instanceColor.needsUpdate = true;

  bombRing.visible = bombFx >= 0;
  if (bombFx >= 0) {
    const f = bombFx / 0.5;
    bombRing.position.set(bombX, -bombY, -(4 + f * 40));
    bombRing.scale.setScalar(0.15 + f * 2.2);
    matRing.opacity = (1 - f) * 0.85;
  }

  // The first frames draw one of everything, tiny and far off, so no shader compiles mid-flight.
  if (warmFrames > 0) {
    warmFrames--;
    for (const [, o] of warmObjs) {
      o.visible = true;
      o.position.set(0, 0, -60);
      o.scale.setScalar(0.001);
    }
    warmFlash.position.set(0, 0, -60);
    warmFlash.scale.setScalar(0.001);
    _m.makeScale(0.001, 0.001, 0.001).setPosition(0, 0, -60);
    for (const m of [laserMesh, eshotMesh, sparkMesh]) {
      if (m.count === 0) {
        m.setMatrixAt(0, _m);
        m.count = 1;
      }
    }
    bombRing.visible = flameL.visible = flameR.visible = true;
    bombRing.position.set(0, 0, -60);
    bombRing.scale.setScalar(0.001);
    flameL.scale.setScalar(0.001);
    flameR.scale.setScalar(0.001);
    if (warmFrames === 0) {
      for (const [type, o] of warmObjs) release(type, o);
      scene.remove(warmFlash);
    }
  }
}

// ---------------------------------------------------------------- HUD (DOM, written only when a value changes)
const hudEl = $('hud'), flashEl = $('flash'), reticle = $('reticle');
const E = { shTxt: $('shTxt'), shBar: $('shBar'), shBox: $('shBox'), hits: $('hits'), bombs: $('bombs'), rollSt: $('rollSt'), score: $('score'), boBar: $('boBar'), hudC: $('hudC'), bossName: $('bossName'), bossBar: $('bossBar'), gateT: $('gateT'), msg: $('msg') };
const last = {};
const changed = (key, v) => (last[key] !== v ? ((last[key] = v), true) : false);
function setBar(key, el, f) {
  f = Math.round(clamp(f, 0, 1) * 400) / 400;
  if (changed(key, f)) el.style.transform = `scaleX(${f})`;
}
function drawHud() {
  const playing = state === 'play';
  if (changed('hud', playing)) hudEl.hidden = !playing;
  const fo = playing ? Math.round(Math.max(0, flash) * 100) / 100 : 0;
  if (changed('flash', fo)) flashEl.style.opacity = fo;
  if (!playing) return;
  const P = player;
  const sh = Math.max(0, Math.ceil(P.shield));
  if (changed('sh', sh)) E.shTxt.textContent = sh + '%';
  setBar('shBar', E.shBar, P.shield / 100);
  if (changed('low', P.shield <= 35)) E.shBox.classList.toggle('low', P.shield <= 35);
  if (changed('hits', kills)) E.hits.textContent = 'HITS ' + String(kills).padStart(2, '0');
  if (changed('bombs', P.bombs)) E.bombs.textContent = 'BOMBS ' + P.bombs;
  const rs = P.rollT > 0 ? 1 : P.rollCd > 0 ? 2 : 0;
  if (changed('roll', rs)) {
    E.rollSt.textContent = rs === 1 ? 'ROLLING' : rs === 2 ? 'ROLL ...' : 'ROLL READY';
    E.rollSt.className = rs ? 'dim' : 'ok';
  }
  if (changed('score', score)) E.score.textContent = 'SCORE ' + score;
  setBar('boost', E.boBar, P.boost / 100);
  const b = bossEnt;
  if (changed('boss', !!b)) E.hudC.hidden = !b;
  if (b) {
    if (changed('bossName', sortie)) E.bossName.textContent = SORTIES[sortie].bossName;
    const hp = b.type === 'frigate' ? (Math.max(0, b.pods[0].hp) + Math.max(0, b.pods[1].hp) + Math.max(0, b.hp)) / b.maxHp : b.hp / b.maxHp;
    setBar('bossHp', E.bossBar, hp);
    const left = Math.max(0, Math.ceil((deadline() - stageT) * 10) / 10);
    if (changed('gate', left)) E.gateT.textContent = 'GATE CLOSES ' + left.toFixed(1) + 's';
  }
  const m = msgT > 0 ? msg : '';
  if (changed('msg', m)) E.msg.textContent = m;
  // The reticle marks where the bolts meet a target 30 units out (it follows the 3D view).
  const showRet = P.alive && !outro;
  if (changed('ret', showRet)) reticle.hidden = !showRet;
  if (showRet) {
    _v.set(P.x, -P.y, -30).project(camera);
    const rx = Math.round(((_v.x + 1) / 2) * view.W), ry = Math.round(((1 - _v.y) / 2) * view.H);
    if (changed('rx', rx) | changed('ry', ry)) reticle.style.transform = `translate(${rx}px,${ry}px)`;
  }
}

// ---------------------------------------------------------------- the loop
const STEP = 1 / 60;
kit.start((dt) => {
  controls();
  if (state === 'play' && !paused) {
    acc = Math.min(acc + dt, STEP * 6);
    while (acc >= STEP) {
      update(STEP);
      acc -= STEP;
      if (state !== 'play' || paused) {
        acc = 0;
        break;
      }
    }
  } else acc = 0;
  ambient(dt);
  render3D(dt);
  post.render();
  drawHud();
});

applyTheme(0);
renderTitle('start0');

// Small test API for local verification only.
window.__nebulaTest = {
  getState: () => ({ state, paused, sortie, difficulty: diff.id, stageT, shield: player?.shield, bombs: player?.bombs, kills, score, bossSpawned, entities: ents.length, shots: shots.length, won, playerX: player?.x, roll: player?.roll, rollT: player?.rollT }),
  start: () => startSortie(0),
  startSortie: (i) => startSortie(i === 1 ? 1 : 0),
  restart: () => startSortie(sortie),
  step: (seconds) => {
    for (let q = 0; q < seconds; q += 1 / 60) update(1 / 60);
  },
  spawnBoss: () => spawn(sortie === 1 ? 'frigate' : 'boss', 1),
  weakenBoss: () => {
    const b = bossEnt;
    if (!b) return;
    b.hp = 1;
    if (b.pods) for (const p of b.pods) p.hp = Math.min(p.hp, 1);
  },
  unlockAll: () => {
    save.unlocked = 2;
    persist();
    if (state === 'title') renderTitle('start1');
  },
};
</script>
</body>
