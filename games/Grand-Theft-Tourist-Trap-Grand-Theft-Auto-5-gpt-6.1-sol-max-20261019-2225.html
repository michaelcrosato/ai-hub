<script>/*!
my-3D2dge AGENT EDITION v0.59.1: the essential engine in one file, for AI coding agents
https://github.com/michaelcrosato/my-3d2dge (MIT License)

Retro-modern 2D games drawn entirely by code: no image or sound files, no dependencies, no network.
This is a curated subset of the full engine (dist/my-3d2dge.js). A game written against this file runs
unchanged on the full engine, which adds the pause, settings and controls menus, lighting (game.lights,
game.enableGPU), props, parallax backdrops, touch controls, camera zoom and turn, dialog portraits, x-ray silhouettes,
replayable sessions, and more.

AGENTS: this header is the whole manual. Build games from it; you do not need to read the code below.
Read a section only to debug: each starts with "// ---- N. NAME" (grep "// ---- 10." for the Humanoid). With the
handoff package, grep API-INDEX.md for a name first: one line each (a † marks the full engine's only).

## Host it
<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}
#screen{width:100%;height:100%;display:block;image-rendering:pixelated}</style></head>
<body><canvas id="screen"></canvas><script src="my-3d2dge-agent.js"><\/script><script src="game.js"><\/script></body></html>
For a single-file game, paste both scripts inline. Start every game with: const E = My3D2dge;

## Mental model
- The world is 3D: x east, y south, z up; one tile = 16 units. Game logic uses world units and dt, never pixels.
- A view projects the world to the screen. 'iso' (Diablo), 'threequarter' (Zelda), 'topdown', 'brawler' (Final
  Fight), 'side' (Mario: x right, z up, y = 0), 'overhead' (shmups, puzzles: world x/y = screen pixels once you call
  game.focus(W / 2, H / 2)). The same game runs in every view. In ground views, turn the stick or keys into a world
  direction with game.view.screenDirToGround(mx, my).
- update(dt) runs in exact fixed steps: 1/120 s of real time each, dt = 1/120 * timeScale, the same steps at any
  refresh rate. Read input only there.
- Tests: new E.Game({ headless: true }) (the default in Node) has no screen; game.advance(seconds) runs fixed steps at
  once, game.input.tap('jump') / hold('right', on) script input, game.debug = { snapshot() {...} } is the game's handle.
- draw(r) order: backgrounds first (r.sky, map.drawFloor + map.queueWalls, level.draw), then everything that can
  overlap through r.actor / r.sprite / r.queue (depth sorted), then the HUD through r.text / r.overlay (screen pixels).
- Characters are procedural rigs posed every step (E.Humanoid, E.Blob) or string sprites (E.sprite).
- Draw only with E.px, E.font, E.ui and r.*: they snap to whole pixels. ctx.arc / stroke / fillText and canvas
  gradients blur the pixel look.
- Errors show in a red box on screen and in the console; warnings start with "my-3D2dge:". Fix the first one first.

## Quick start: a complete game (title, play, win or lose)
```js quickstart
(() => {
const E = My3D2dge;
const game = new E.Game({ canvas: 'screen', res: 'ps1', view: 'threequarter', views: ['threequarter', 'iso', 'topdown'] });
const map = new E.TileMap({
  rows: ['################',
         '#@.....#.......#',
         '#......#...s...#',
         '#..s.......##..#',
         '#......~~.....s#',
         '################'],
  legend: { '#': 1, '@': 'hero', s: 'slime', '~': { floor: 'water', block: true } },   // number = wall type, string = spawn tag
  types: { 1: { h: 28, top: '#7a7090', side: '#4a4560', cut: true } },   // cut: walls in front of the floor drop low
  floorTex: (x, y, tag) => tag === 'water' ? E.tex.water(x, y) : E.tex.grass(x, y)
});
const flow = new E.FlowField(map);
let hero, rig, sword, slimes, hp, msg = '';
const title = {
  update() { if (game.input.pressed('start')) game.go('play'); },
  draw(r) {
    r.sky(['#101848', '#5a3a80']);
    r.overlay(g => E.font.title(g, 'SLIME FIELD', r.W / 2, 70, { scale: 3, align: 'center' }));
    r.text('PRESS ENTER', r.W / 2, 150, '#ffffff', { align: 'center', shadow: '#000', outline: false });
  }
};
const play = {
  pausable: true,
  enter() {
    const s = map.find('hero');
    hero = new E.Body({ x: s.x, y: s.y, r: 5 }); hero.facing = 0; hero.hurt = 0; hp = 3;
    rig = new E.Humanoid({ size: 1.3, outfit: 'tunic', hat: 'cap', colors: { cloth: '#3a8a4a', hair: '#e0b040' } });
    sword = new E.Attack('slash');
    slimes = map.findAll('slime').map(p => ({ body: new E.Body({ x: p.x, y: p.y, r: 6 }), rig: new E.Blob(), hp: 3, hit: 0 }));
    game.cam.bounds = v => map.bounds(v); game.follow(hero);
    game.audio.music('adventure');
  },
  update(dt) {
    const inp = game.input, m = inp.move(), d = game.view.screenDirToGround(m[0], m[1]);   // screen push -> ground direction
    hero.vx = d[0] * 85; hero.vy = d[1] * 85; hero.update(dt, map);
    if (Math.hypot(d[0], d[1]) > .1) hero.facing = Math.atan2(d[1], d[0]);
    if (inp.buffered('attack') && sword.start()) { inp.consume('attack'); game.audio.sfx('swing'); }
    sword.update(dt);
    sword.hits(slimes, s => E.inArc(hero, hero.facing, s.body, 24, 1.3), s => {
      s.hp--; s.hit = .15; E.knockback(hero, s.body, 200, 80);
      game.hitFx(s.body.x, s.body.y, 8, { damage: 1, angle: hero.facing });
    });
    flow.update(hero.x, hero.y); hero.hurt -= dt;
    for (const s of slimes) {
      const dir = flow.dir(s.body.x, s.body.y, hero.x, hero.y);
      s.body.vx = E.approach(s.body.vx, dir[0] * 30, 300 * dt); s.body.vy = E.approach(s.body.vy, dir[1] * 30, 300 * dt);
      s.body.update(dt, map); s.hit -= dt;
      s.rig.update(dt, { look: dir, squash: Math.sin(game.time * 9 + s.body.x) * .15 });
      if (E.overlap(hero, s.body) && hero.hurt <= 0) { hp--; hero.hurt = 1; E.knockback(s.body, hero, 220); game.audio.sfx('hurt'); game.shake(3); }
      if (s.hp <= 0) game.particles.explosion(s.body.x, s.body.y, 6, .7);
    }
    E.prune(slimes, s => s.hp <= 0);
    rig.update(dt, { x: hero.x, y: hero.y, z: hero.z, vx: hero.vx, vy: hero.vy, facing: hero.facing, attack: sword.state, hurt: hero.hurt > .7 });
    if (hp <= 0) game.go('end', 'GAME OVER'); else if (!slimes.length) game.go('end', 'YOU WIN');
  },
  draw(r) {
    map.drawFloor(r); map.queueWalls(r);                                   // background first, then depth-sorted things
    r.shadow(hero.x, hero.y, 6);
    r.actor(hero.x, hero.y, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view), { alpha: hero.hurt > 0 ? .6 : 1 });
    for (const s of slimes) {
      r.shadow(s.body.x, s.body.y, 6);
      r.actor(s.body.x, s.body.y, s.body.z, (g, ox, oy) => s.rig.draw(g, ox, oy, r.view), { flash: s.hit > 0 && '#ffffff' });
    }
    r.overlay(g => E.ui.hearts(g, 6, 6, hp, 3));                        // HUD in screen pixels
  }
};
const end = {
  enter(text) { msg = text; game.audio.music(null); game.audio.sfx(text === 'YOU WIN' ? 'powerup' : 'die'); },
  update() { if (game.input.pressed('start')) game.go('title'); },
  draw(r) { r.sky(['#000000', '#301830']); r.text(msg, r.W / 2, 100, '#ffe08a', { align: 'center', scale: 2 }); }
};
game.start({ scene: 'title', scenes: { title, play, end } });
})();
```

## API
Game: new E.Game({ canvas: 'screen', res, expand, view, views, input, bg })
  res: 'nes' 256x240 | 'snes' 256x224 | 'genesis' 320x224 | 'gb' 160x144 | 'gba' 240x160 | 'ps1' 320x240 | 'wide' 400x225 | [w, h]
  expand: true fills any window with no bars: res is the least it shows, r.W x r.H grows; anchor the HUD to r.W and r.H
  input: 'DEFAULT' | 'PLATFORMER' | 'SHMUP' | your own { action: ['KeyQ', 'Pad0', 'Mouse0'] }
  start({ update(dt), draw(r) }) or start({ scene: 'title', scenes: { title: {...}, play: {...} } })
  scene: { enter(data), exit(), update(dt), draw(r), pausable, view, views, input, res, expand }; go(name, data, { fade: .22 })
  camera: follow(obj, { z: 16, lead }) once, or focus(x, y, z) every update; cam.bounds = v => map.bounds(v);
    cam.room = [w, h] for screen-by-screen rooms (cam.moving is true while it slides); cam.smooth = .18 (0 = locked)
  juice: hitFx(x, y, z, { power: 1, damage, angle, color, sound }), freeze(s), shake(n), flash(color, s), timeScale = .25
  timers in game time: after(s, fn), every(s, fn) -> { cancel() }, cleared on scene change
  also: setView(id), nextView() (cycles views), note(text, s), mouseGround() -> [x, y] or null
  fields: W, H, time, real, paused, input, audio, particles, view, cam, errors
Input (game.input): down(a) held, pressed(a) this step only, released(a), repeat(a, delay .3, rate .08) for menus,
  buffered(a, window .15) + consume(a) for combat, consumeAll(), anyPressed(), move() -> [x, y] on screen (length <= 1)
  every preset: up down left right (WASD, arrows, d-pad), start (Enter), pause (Esc, P), confirm (Enter, Space, J, Z),
    cancel (Esc, Backspace, X, K); the gamepad d-pad, A, B and Start work too, and its left stick moves
  DEFAULT: attack (J, X, click), dash (Space, Shift, K), skill (L, E, right click), jump (Z)
  PLATFORMER: jump (Space, Z, K), attack (X, J, click), dash (Shift, C, L), skill (E, V)
  SHMUP: fire (Space, Z, J, click), bomb (X, K, right click)
  label('jump') -> its key or button on the device in use, for prompts: 'Space', 'A', '✕'
Standard, with no code: game.settings (saved per game: volume music effects sound motion shake flashes scale deadzone
  glyphs; set(key, v) checks, saves, applies; yours: new E.Game({ menu: { settings: [{ key: 'hints', value: true }] } })),
  game.fullscreen (a phone's first tap, a top-right button; toggle() from a key or click), and a pausable scene pausing
  when the page is hidden or the controller unplugs (pause(reason), resume(), pauseReason). Don't build your own. Leave
  out: fullscreen: 'button' | false, corner: false, autoPause: false. The full engine adds the menu screens.
Boot: start({ ..., boot: { title, steps: [['Raising the harbour', () => build()]], messages: ['Counting the bells'] } }) runs heavy
  setup one step a frame behind a boot screen; an error before play shows a report to screenshot (E.diagnose() any time).
Drawing (r in draw(r); r.W, r.H = screen size in pixels)
  r.sky(['#top', '#mid', '#bottom']); r.starfield({ count: 70, speed: 30, dir: 'down' | 'up' | 'left' | 'right', height: 0..1 })
  r.actor(x, y, z, (g, ox, oy) => rig.draw(g, ox, oy, r.view), { outline: true, flash: '#ffffff', flashMix: .5, alpha, bias })
  r.sprite(x, y, z, spr, { anchor: 'bottom' | 'center' | 'top', flip, flash, outline, alpha })
  r.queue(x, y, z, g => {...}, { bias }) for any depth-sorted drawing; inside it r.box(g, x0, y0, z0, x1, y1, z1, top, side)
  r.shadow(x, y, radius, alpha .5, color, surfaceZ); floor marks: r.decal(() => r.groundDisc(x, y, rad, color, alpha)),
    r.groundRing(x, y, rad, color, alpha), r.groundArc(x, y, r0, r1, a0, a1, color, alpha)
  r.text(str, x, y, color, opts); r.textAt(x, y, z, str, color); r.overlay(g => {...}); r.glowDisc(g, x, y, rad, color, 0..1)
  r.marker(x, y, z, { label, color }): an objective marker, an arrow at the screen's edge when it is off screen
  r.w(x, y, z) -> [px, py] where a world point lands; r.visible(x, y, z); r.view
Pixels (g is a canvas context from r.queue, r.overlay or r.actor): E.px.rect(g, x, y, w, h, c), dot(g, x, y, c),
  line(g, x0, y0, x1, y1, c, width), disc(g, x, y, r, c), ell(g, x, y, rx, ry, c), poly(g, [[x, y], ...], c),
  polyDither(g, pts, c, alpha), ddisc(g, x, y, r, c, alpha), blend(g, alpha, 'add' | 'multiply' | 'screen' | 'normal', () => {...}),
  sprite(g, spr, x, y, flip). Colors are '#rrggbb' or '#rgb'.
Sprites: const COIN = E.sprite(['.yy.', 'yYYy', '.yy.'], { y: '#f0b020', Y: '#fff0a0' }, scale); '.' and ' ' are clear
Text: E.font.text(g, str, x, y, color, { outline: '#0b0814' | false, shadow, gradient: [top, bottom], scale, align, wrap: px })

## Recipes
Side-scroller (Mario, Mega Man): PlatformMap + Platformer + Humanoid, view 'side'.
```js platformer
(() => {
const E = My3D2dge;
const game = new E.Game({ canvas: 'screen', res: 'snes', view: 'side', views: ['side', 'brawler'], input: 'PLATFORMER' });
const level = new E.PlatformMap({
  rows: ['                                  ',
         '               ?                  ',
         '        ===             ==        ',
         '  @           g     ^^       g  F ',
         '#################  ###############'],
  legend: { '#': 1, '=': 2, '?': 3, '^': 4, '@': 'hero', g: 'walker', F: 'flag' },
  types: { 1: { style: 'ground', side: '#8a5a32' }, 2: { kind: 'oneway' }, 3: { style: 'bonus', side: '#e8a830' }, 4: { kind: 'hazard' } }
});
const start = level.find('hero'), flag = level.find('flag');
const hero = new E.Platformer({ x: start.x, z: start.z });
const rig = new E.Humanoid({ hat: 'cap', weapon: null, colors: { cloth: '#d83a2a', pants: '#3050c0' } });
const foes = level.findAll('walker').map(p => ({ x: p.x, z: p.z, w: 12, h: 12, vx: 0, vz: 0, dir: -1, rig: new E.Blob({ feet: true, colors: { base: '#a06030', dk: '#5a3018', lt: '#d09060' } }) }));
game.cam.bounds = v => level.bounds(v);
game.particles.ground = (x, y, z) => level.groundBelow(x, z);           // sparks and debris land on platforms
game.start({
  update(dt) {
    hero.update(dt, level, game.input);
    if (hero.jumped) game.audio.sfx('jump');
    if (hero.bumped && level.types[hero.bumped.id].style === 'bonus') { level.set(hero.bumped.cx, hero.bumped.cz, 1); game.audio.sfx('coin'); game.particles.glints(hero.x, 0, hero.z + 30, 6); }
    if (level.touching(hero, 'hazard') || hero.z < -40) { Object.assign(hero, { x: start.x, z: start.z, vx: 0, vz: 0 }); game.audio.sfx('hurt'); }
    for (const f of foes) {
      f.vz -= 800 * dt; f.vx = f.dir * 25; level.move(f, dt);
      const ahead = level.groundBelow(f.x + f.dir * 8, f.z);
      if (f.hitWall || ahead === null || ahead < f.z - 4) f.dir = -f.dir;   // turn at walls and ledges
      f.rig.update(dt, { look: [f.dir, 0], walk: 1 });
      if (!f.dead && E.overlapBox(hero, f)) {
        if (hero.vz < 0 && hero.z > f.z + f.h / 2) { f.dead = true; hero.vz = 220; game.audio.sfx('stomp'); game.particles.dust(f.x, 0, f.z, 8); }
        else { hero.knock(hero.x < f.x ? -1 : 1); game.audio.sfx('hurt'); }
      }
    }
    E.prune(foes, f => f.dead);
    if (Math.abs(hero.x - flag.x) < 8) { game.audio.sfx('powerup'); Object.assign(hero, { x: start.x, z: start.z }); }
    rig.update(dt, hero.rigState());
    game.focus(hero.x, 0, hero.z + 24);                                   // side view: y = 0, z is up
  },
  draw(r) {
    r.sky(['#5c94fc', '#a8c8ff']);
    level.draw(r);
    r.queue(flag.x, 0, flag.z, g => { const [x, y] = r.w(flag.x, 0, flag.z); E.px.rect(g, x, y - 40, 2, 40, '#e8e8e8'); E.px.poly(g, [[x + 2, y - 40], [x + 14, y - 35], [x + 2, y - 30]], '#40c040'); });
    for (const f of foes) r.actor(f.x, 0, f.z, (g, ox, oy) => f.rig.draw(g, ox, oy, r.view));
    r.actor(hero.x, 0, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view));
  }
});
})();
```
Shoot-'em-up (1942): view 'overhead', sprites, Bullets, a starfield.
```js shmup
(() => {
const E = My3D2dge, W = 224, H = 256;
const game = new E.Game({ canvas: 'screen', res: [W, H], view: 'overhead', views: ['overhead'], input: 'SHMUP' });
const SHIP = E.sprite(['...w...', '..wbw..', '.wwbww.', 'wwrwrww', 'w..r..w'], { w: '#e8f0ff', b: '#3a7aff', r: '#ff5030' }, 2);
const FOE = E.sprite(['r.....r', '.rrrrr.', 'rryyyrr', '.r.r.r.'], { r: '#d03040', y: '#ffd040' }, 2);
const shots = new E.Bullets(game), ship = { x: W / 2, y: H - 30, r: 4 }, foes = [];
let score = 0, cool = 0, spawn = 0;
game.start({
  update(dt) {
    game.focus(W / 2, H / 2);                                            // overhead: world x/y = screen pixels
    const m = game.input.move();
    ship.x = E.clamp(ship.x + m[0] * 120 * dt, 8, W - 8); ship.y = E.clamp(ship.y + m[1] * 120 * dt, 8, H - 8);
    if ((cool -= dt) <= 0 && game.input.down('fire')) { cool = .12; shots.fire({ x: ship.x, y: ship.y - 10, vy: -300, team: 'player' }); game.audio.sfx('shoot'); }
    if ((spawn -= dt) <= 0) { spawn = .9; foes.push({ x: E.rand(20, W - 20), y: -10, r: 7, hp: 3, t: 0 }); }
    for (const f of foes) {
      f.t += dt; f.y += 40 * dt; f.x += Math.sin(f.t * 3) * 40 * dt;
      if (E.chance(dt * .6)) shots.burst({ x: f.x, y: f.y, team: 'foe', color: '#ff6080' }, [E.pattern.aim(f, ship, 90)]);
    }
    shots.update(dt);
    shots.hit(foes, (b, f) => { f.hp--; game.particles.sparks(b.x, b.y, 0, 4); }, 'player');
    for (const f of foes) if (f.hp <= 0) { score += 100; game.particles.explosion(f.x, f.y, 0, .8); }
    E.prune(foes, f => f.hp <= 0 || f.y > H + 20);
    if (shots.hit([ship], () => {}, 'foe')) { game.flash('#ff4040', .2); game.audio.sfx('hurt'); score = 0; }
  },
  draw(r) {
    r.sky(['#000010', '#101040']); r.starfield({ dir: 'down', speed: 40 });
    for (const f of foes) r.sprite(f.x, f.y, 0, FOE, { anchor: 'center' });
    r.sprite(ship.x, ship.y, 0, SHIP, { anchor: 'center' });
    shots.draw(r);
    r.text('SCORE ' + score, 4, 4, '#ffffff', { shadow: '#000', outline: false });
  }
});
})();

## Rules
1. World units and dt everywhere. Feel numbers (units per second, tile = 16): walk 70-90, run 95-140, jump 250-320
   with gravity 800, dash 200-260, player bullets 250-320, enemy bullets 70-120, enemies 25-45.
2. At 320x240, heroes are 40-60 px tall (Humanoid size 1.2-1.4), bosses size 1.8-2.4; hitboxes smaller than the art.
3. Every hit gets game.hitFx; deaths get particles.explosion; sounds on jump, hit, pickup and death; music per scene.
4. A title scene, play scenes with pausable: true, and a game-over or win path back to the title.
5. Dress every character (outfit, hat, colors) and give each its own moves; enemies wind up slower than the hero.
6. Nothing on screen? The camera looks elsewhere: game.follow(hero) or game.focus(...) every update (side: y = 0).

(function (root) {
'use strict';
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const E = { version: '0.59.1', build: 'dev-build', edition: 'agent', name: 'my-3D2dge', TAU, DEG, current: null };   // build: the commit, stamped at deploy
E.versionLabel = () => 'v' + E.version + ' · ' + E.build;
const _warned = new Set();   // one console warning per distinct problem, prefixed 'my-3D2dge:'
const warn = (key, msg) => { if (_warned.has(key)) return; _warned.add(key); console.warn('my-3D2dge: ' + msg); };
E.warn = warn;

// ---- 1. MATH, COLOR, HELPERS ----
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (a, b, s) => a < b ? Math.min(b, a + s) : Math.max(b, a - s);
const ease = {
  outCubic: u => 1 - Math.pow(1 - u, 3),
  outQuad: u => 1 - (1 - u) * (1 - u),
  inQuad: u => u * u,
  inOut: u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2,
  outBack: u => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); }
};
const angDiff = (a, b) => ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const lerpAng = (a, b, t) => a + angDiff(a, b) * t;
const approachAng = (a, b, s) => { const d = angDiff(a, b); return Math.abs(d) <= s ? b : a + Math.sign(d) * s; };
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}
function smoothDamp(cur, target, vel, st, dt) {
  const om = 2 / st, x = om * dt, ex = 1 / (1 + x + .48 * x * x + .235 * x * x * x), ch = cur - target, tmp = (vel + om * ch) * dt;
  return [target + (ch + tmp) * ex, (vel - om * tmp) * ex];
}
const hex = h => {
  if (Array.isArray(h)) return h.slice(0, 3);
  let s = String(h).trim(); if (s[0] === '#') s = s.slice(1);
  if (s.length === 3 || s.length === 4) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
  const n = parseInt(s.slice(0, 6), 16);
  if (s.length < 6 || isNaN(n)) { warn('hex:' + h, 'color "' + h + '" is not a "#rrggbb" hex color (drawn magenta)'); return [255, 0, 255]; }

function drive(dt) {

	S.hero.y = c.y;
	S.hero.z = c.z;
	S.stats.distance += Math.abs(c.speed) * dt;

function updateTimers(dt) {

		"focus",
		"jam",
		"iron",
		"hurt",
		"dodge",
		"fireWait",
		"stuntCooldown",
		"wantedGrace",
	])
		S[name] = Math.max(0, S[name] - dt);
	S.charge.forEach((v, i) => {
		S.charge[i] = Math.min(100, v + dt * 4.5);
	});
	if (S.reload > 0) {
		S.reload -= dt;
		if (S.reload <= 0) {
			const i = S.weapon,
				take = Math.min(WEAPONS[i].mag - S.ammo[i], S.reserve[i]);
			S.ammo[i] += take;
			S.reserve[i] -= take;
			game.audio.sfx("confirm", { vol: 0.22 });

		points.push({ x: a.x, y: from.y });

	points.push(a);
	let x = a.x,
		y = a.y;
	// All streets form a connected grid; every segment remains on a road centerline.
	while (x !== b.x) {
		x += Math.sign(b.x - x) * 240;
		points.push({ x, y });
	}
	while (y !== b.y) {
		y += Math.sign(b.y - y) * 240;
		points.push({ x, y });
	}
	points.push({ x: b.x, y: to.y }, { x: to.x, y: to.y });
	return points;
}
function updateTraffic(dt, title = false) {
	for (const c of S.cars) {
		if (c === S.car || !c.traffic || c.wreck) continue;
		c.stop = Math.max(0, c.stop - dt);
		let speed = c.stop > 0 ? 0 : c.cruise;
		if (!title && dist(c, pos()) < 65 && S.car && Math.abs(S.car.speed) < 8)
			speed *= 0.15;
		c.speed = approach(c.speed, speed, dt * 65);
		if (c.axis === "x") {
			c.x += c.dir * c.speed * dt;
			c.y = c.lane - c.dir * 13;
			c.a = c.dir > 0 ? 0 : PI;
			if (c.x > 1220) c.x = 75;
			if (c.x < 70) c.x = 1215;
		} else {
			c.y += c.dir * c.speed * dt;
			c.x = c.lane + c.dir * 13;
			c.a = c.dir > 0 ? PI / 2 : -PI / 2;
			if (c.y > 1215) c.y = 70;
			if (c.y < 65) c.y = 1210;
		}
		c.moveAngle = c.a;
	}
	for (const p of S.pedestrians) {
		if (p.down > 0) {
			p.down -= dt;
			p.rig.update(dt, { x: p.x, y: p.y, facing: p.face || 0, down: 1 });
			continue;
		}
		p.panic = Math.max(0, p.panic - dt);
		const a =
			p.axis === "x" ? (p.dir > 0 ? 0 : PI) : p.dir > 0 ? PI / 2 : -PI / 2;
		p.vx = Math.cos(a) * (p.panic ? 85 : 21);
		p.vy = Math.sin(a) * (p.panic ? 85 : 21);
		p.face = a;
		p.update(dt, world.map);
		if (
			p.hitWall ||
			Math.abs(p.x - p.baseX) > 85 ||
			Math.abs(p.y - p.baseY) > 85
		)
			p.dir *= -1;
		p.rig.update(dt, {
			x: p.x,
			y: p.y,
			z: p.z,
			vx: p.vx,
			vy: p.vy,
			facing: a,
			sprint: p.panic > 0,
			expr: p.panic ? "wince" : "smile",
		});
	}
}
function vehicleCollisions() {
	const c = S.car;
	if (!c || c.type === "boat" || c.z > 10 || collisionTimer > 0) return;
	for (const v of [...S.cars, ...S.cops])
		if (
			v !== c &&
			!v.wreck &&
			v.type !== "boat" &&
			dist(c, v) < 28 &&
			Math.abs(c.speed) > 35
		) {
			const impact = Math.abs(c.speed - (v.speed || 0));
			c.hp -= impact * 0.055;
			v.hp -= impact * 0.1;
			v.stop = 2.5;
			c.speed *= 0.5;
			v.x += Math.cos(c.a) * 9;
			v.y += Math.sin(c.a) * 9;
			collisionTimer = 0.55;
			game.particles.sparks((c.x + v.x) / 2, (c.y + v.y) / 2, 8, 7, c.a);
			game.audio.sfx("bump", { vol: 0.45 });
			game.shake(2);
			addHeat(v.type === "police" ? 0.75 : 0.35);
			if (v.hp <= 0) wreckCar(v);
			break;
		}
	for (const p of S.pedestrians)
		if (!p.down && dist(c, p) < 22 && Math.abs(c.speed) > 45) {
			p.down = 6;
			p.panic = 10;
			p.x += Math.cos(c.a) * 12;
			p.y += Math.sin(c.a) * 12;
			c.speed *= 0.87;
			game.particles.dust(p.x, p.y, 0, 8);
			addHeat(0.8);
			collisionTimer = 0.5;
		}
}

function updatePolice(dt) {
	const p = pos();
	S.sight = false;
	if (S.wanted > 0.05) {
		S.spawnWait -= dt;
		const maxCops = Math.min(6, 1 + Math.ceil(S.wanted));
		if (S.spawnWait <= 0 && S.cops.filter((c) => !c.wreck).length < maxCops) {
			spawnCop();
			S.spawnWait = 3.5;
		}
	}
	for (const c of S.cops) {
		if (c.wreck || c === S.car) continue;
		const d = dist(c, p),
			sees =
				S.jam <= 0 &&
				d < 300 &&
				world.map.sight({ ...c, z: 5 }, { ...p, z: 3 });
		if (sees && S.wanted > 0) S.sight = true;
		c.targetTimer -= dt;
		c.fireTimer -= dt;
		if (c.targetTimer <= 0) {
			c.route = navPath(c, p);
			c.routeIndex = 1;
			c.targetTimer = 1.3;
		}
		let target = c.route[c.routeIndex] || p;
		if (dist(c, target) < 34) {
			c.routeIndex++;
			target = c.route[c.routeIndex] || p;
		}
		if (sees && d < 170) target = p;
		const desired = Math.atan2(target.y - c.y, target.x - c.x);
		const turn = Math.abs(angDiff(c.a, desired));
		c.a = approachAng(c.a, desired, dt * 2.4);
		const speed = S.wanted > 0 ? (turn > 0.7 ? 70 : 150 + S.wanted * 9) : 50;
		c.speed = approach(c.speed, d < 45 ? 35 : speed, dt * 110);
		c.vx = Math.cos(c.a) * c.speed;
		c.vy = Math.sin(c.a) * c.speed;
		c.update(dt, world.map);
		if (c.hitWall) {
			c.a += 0.045;
			c.speed *= 0.97;
		}
		if (d < 40 && S.wanted > 0 && !S.car) {
			if (!c.officer) c.officer = makeGuard(c.x + 18, c.y, "police");
		}
		if (c.officer) updateEnemy(c.officer, dt);
		if (sees && d < 175 && c.fireTimer <= 0 && S.wanted > 1.6) {
			const a = Math.atan2(p.y - c.y, p.x - c.x) + (rng() - 0.5) * 0.19;
			bullets.fire({
				x: c.x,
				y: c.y,
				z: 15,
				vx: Math.cos(a) * 190,
				vy: Math.sin(a) * 190,
				team: "security",
				color: "#ff947b",
				dmg: 8,
				life: 1.2,
			});
			c.fireTimer = 0.95;
		}
	}
	if (S.wanted > 0) {
		if (S.sight) S.unseen = 0;
		else S.unseen += dt;
		if (S.unseen > 5) S.wanted = Math.max(0, S.wanted - dt * 0.33);
		if (S.wanted <= 0.01) {
			S.wanted = 0;
			S.cops.forEach((c) => {
				c.officer = null;
			});
			if (!demo) {
				toast("OFF THE RADAR", "Coral Bay has a very short attention span.");
				game.audio.sfx("secret", { vol: 0.3 });
			}
		}
	}
	E.prune(S.cops, (c) => S.wanted === 0 && dist(c, p) > 500);
	if (S.wanted >= 3.5 && !S.helicopter)
		S.helicopter = { x: p.x + 150, y: p.y - 120, a: 0 };
	if (S.helicopter) {
		const h = S.helicopter;
		h.a += dt * 0.23;
		h.x = lerp(h.x, p.x + Math.cos(h.a) * 125, dt * 0.55);
		h.y = lerp(h.y, p.y + Math.sin(h.a) * 125, dt * 0.55);
		// Searchlight shows the search, but never sees through solid roofs or a blackout.
		if (S.wanted < 3.1) S.helicopter = null;
	}
}

function updateEnemy(e, dt) {
	if (e.dead) {
		e.rig.update(dt, { x: e.x, y: e.y, facing: e.a, down: 1 });
		return;
	}
	e.fire -= dt;
	e.hit = Math.max(0, e.hit - dt);
	const wasWinding = e.wind > 0;
	e.wind = Math.max(0, e.wind - dt);
	const h = S.hero,
		d = dist(e, h),
		sight = currentMap().sight(e, h);
	e.a = Math.atan2(h.y - e.y, h.x - e.x);
	const speed = d > 135 ? 34 : d < 62 ? -17 : 0;
	e.vx = sight ? Math.cos(e.a) * speed : 0;
	e.vy = sight ? Math.sin(e.a) * speed : 0;
	e.update(dt, currentMap());
	if (sight && d < 300 && e.fire <= 0) {
		e.wind = 0.55;
		e.fire = 1.9 + rng() * 0.4;
	}
	if (wasWinding && e.wind <= 0 && sight) {
		const a = e.a + (rng() - 0.5) * 0.18;
		bullets.fire({
			x: e.x + Math.cos(a) * 12,
			y: e.y + Math.sin(a) * 12,
			z: 18,
			vx: Math.cos(a) * 195,
			vy: Math.sin(a) * 195,
			team: "security",
			color: "#ff9a76",
			dmg: 10,
			life: 1.5,
		});
		game.audio.sfx("shoot", { vol: 0.18, pitch: 0.8 });
	}
	e.rig.update(dt, {
		x: e.x,
		y: e.y,
		z: e.z,
		vx: e.vx,
		vy: e.vy,
		facing: e.a,
		point: true,
		hurt: e.hit > 0,
		stance: "ready",
	});
}

function carBox(r, g, c, f0, s0, z0, f1, s1, z1, top, side) {

		{
			pts: [P(f0, s0, z0), P(f1, s0, z0), P(f1, s0, z1), P(f0, s0, z1)],
			normal: [Math.sin(c.a), -Math.cos(c.a)],
			color: E.shade(side, -0.18),
		},
		{
			pts: [P(f1, s1, z0), P(f0, s1, z0), P(f0, s1, z1), P(f1, s1, z1)],
			normal: [-Math.sin(c.a), Math.cos(c.a)],
			color: side,
		},
		{
			pts: [P(f0, s1, z0), P(f0, s0, z0), P(f0, s0, z1), P(f0, s1, z1)],
			normal: [-Math.cos(c.a), -Math.sin(c.a)],
			color: E.shade(side, -0.26),
		},
		{
			pts: [P(f1, s0, z0), P(f1, s1, z0), P(f1, s1, z1), P(f1, s0, z1)],
			normal: [Math.cos(c.a), Math.sin(c.a)],
			color: E.shade(side, 0.1),
		},
	];
	for (const f of faces)
		if (f.normal[0] * r.view.fx + f.normal[1] * r.view.fy > 0.01)
			px.poly(g, f.pts, f.color);

}

function citySVG({
	mini = false,
	center = pos(),
	target = objectivePoint(),
} = {}) {
	const spanX = mini ? 340 : 1500,
		spanY = mini ? 260 : 1500,
		x0 = mini ? center.x - 170 : 0,
		y0 = mini ? center.y - 130 : 0;
	let s = `<g transform="translate(${-x0},${-y0})"><rect x="-2000" y="-2000" width="5000" height="5000" fill="#244d5c"/><rect width="1248" height="1248" fill="#65766b"/><rect x="1150" width="98" height="1248" fill="#b0a785"/>`;
	for (const p of world.parks)
		s += `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="#7f9675"/>`;
	for (const a of ROADS)
		s += `<path d="M48 ${a}H1218 M${a} 48V1218" fill="none" stroke="#273c43" stroke-width="71"/><path d="M48 ${a}H1218 M${a} 48V1218" fill="none" stroke="#7e8b7e" stroke-width="2"/>`;
	for (const b of world.buildings)
		s += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.d}" fill="#9f9d88" stroke="#516b63" stroke-width="3"/>`;
	s +=
		'<path d="M1120 1200V1290 M1070 1290H1170" fill="none" stroke="#bdaf87" stroke-width="30"/>';
	if (target && !S.inside) {
		const path = navPath(center, target)
			.map((p) => `${p.x},${p.y}`)
			.join(" ");
		s += `<polyline points="${path}" fill="none" stroke="#ffd285" stroke-width="${mini ? 5 : 9}" stroke-linejoin="round"/><circle cx="${target.x}" cy="${target.y}" r="${mini ? 8 : 17}" fill="#ffd285" stroke="#1b303b" stroke-width="4"/>`;
	}
	for (const p of PLACES)
		s += `<circle cx="${p.x}" cy="${p.y}" r="${mini ? 7 : 20}" fill="${p.color}" stroke="#253b43" stroke-width="3"/>${mini ? "" : `<text x="${p.x}" y="${p.y + 6}" text-anchor="middle" fill="#22313b" font-family="Arial" font-size="20" font-weight="bold">${p.symbol}</text>`}`;
	if (!mini) {
		s +=
			'<text x="720" y="70" text-anchor="middle" fill="#d0d1b5" font-family="Arial" font-size="24" letter-spacing="6">CORAL BAY</text><text x="1370" y="760" text-anchor="middle" fill="#76a4a3" font-family="Arial" font-size="22" transform="rotate(90 1370 760)" letter-spacing="8">PACIFIC OCEAN</text>';
		for (let i = 0; i < world.postcards.length; i++)
			if (S.postcards.has(i)) {
				const p = world.postcards[i];
				s += `<circle cx="${p.x}" cy="${p.y}" r="7" fill="#f2deac"/>`;
			}
	}
	for (const c of S.cops)
		if (S.wanted > 0 && !c.wreck)
			s += `<circle cx="${c.x}" cy="${c.y}" r="${mini ? 6 : 12}" fill="#ef8f83" opacity=".9"/>`;
	const facing = S.car ? S.car.a : S.face,
		rotate = (facing * 180) / PI + 90;
	s += `<path d="M0 -${mini ? 10 : 21}L${mini ? 7 : 15} ${mini ? 8 : 17}L0 ${mini ? 4 : 8}L-${mini ? 7 : 15} ${mini ? 8 : 17}Z" fill="#a2f0d5" stroke="#152f37" stroke-width="${mini ? 2 : 4}" transform="translate(${center.x} ${center.y}) rotate(${rotate})"/></g>`;
	return { markup: s, viewBox: `0 0 ${spanX} ${spanY}` };
}

function updateMenu(dt) {
	if (!menu) return;
	const I = game.input,
		m = menu;
	if (m.kind === "hack") {
		m.phase += dt * (1.7 + m.pins * 0.25);
		m.needle = 0.5 + Math.sin(m.phase) * 0.46;
		const needle = $("hack-needle");
		if (needle) needle.style.left = `${m.needle * 100}%`;
		if (I.pressed("crew")) {
			changeCrew();
		}
		if (I.pressed("ability")) useAbility();
		if (I.pressed("confirm")) hackPin(false);
		if (I.pressed("cancel")) goBack();
		return;
	}
	const count = m.entries?.length || 0;
	let move = 0;
	if (I.repeat("up", 0.32, 0.16)) move = -1;
	if (I.repeat("down", 0.32, 0.16)) move = 1;
	if (m.kind === "briefing") {
		if (I.repeat("left")) move = -1;
		if (I.repeat("right")) move = 1;
	}
	if (move && count) {
		m.index = (m.index + move + count) % count;
		if (m.kind === "briefing") m.approach = m.index;
		if (m.kind === "map") renderMenu();
		else highlightMenu();
		game.audio.sfx("select", { vol: 0.24 });
	}
	if (m.entries?.[m.index]?.adjust) {
		if (I.repeat("left", 0.3, 0.12)) m.entries[m.index].adjust(-1);
		if (I.repeat("right", 0.3, 0.12)) m.entries[m.index].adjust(1);
	}
	if (I.pressed("confirm") || (m.kind === "title" && I.pressed("start")))
		chooseMenu();
	else if (I.pressed("cancel") || (I.pressed("pause") && m.kind !== "title"))
		goBack();
}
function hackPin(automatic) {
	if (menu?.kind !== "hack") return;
	if (automatic || (menu.needle >= 0.36 && menu.needle <= 0.64)) {
		menu.pins++;
		game.audio.sfx("key", { vol: 0.28 });
		if (menu.pins === 3) {
			S.camerasOff = true;
			closeMenu();
			setStory(2);
			return;
		}
		menu.message = "PIN LOCKED. NEXT TRACE.";
		menu.phase += 0.8;
		renderMenu();
	} else {
		menu.message = "MISSED. SAME PIN, ANOTHER TRY.";
		game.audio.sfx("cancel", { vol: 0.2 });
		$("hack-message").textContent = menu.message;
	}
}

function scriptDrive(dt, speed) {
	const c = S.car;
	if (!c) return;
	const target = demo.path[demo.point];
	if (!target) {
		demo.point = 1;
		c.x = demo.path[0].x;
		c.y = demo.path[0].y;
		game.cam.snap = true;
		return;
	}
	const d = dist(c, target),
		a = Math.atan2(target.y - c.y, target.x - c.x),
		step = Math.min(d, speed * dt);
	c.a = approachAng(c.a, a, dt * 8);
	c.moveAngle = a;
	c.speed = speed;
	c.vx = Math.cos(a) * speed;
	c.vy = Math.sin(a) * speed;
	c.x += Math.cos(a) * step;
	c.y += Math.sin(a) * step;
	if (d < speed * dt + 4) demo.point++;
	S.hero.x = c.x;
	S.hero.y = c.y;
	S.hero.z = c.z;
	c.hp = 100;
}

			return;
		}
		if (performance.now() < inputQuietUntil) return;
		S.time += dt;
		updateTimers(dt);
		if (I.pressed("crew")) changeCrew();
		if (I.pressed("ability")) useAbility();
		if (I.pressed("view") && !S.inside) {
			game.setView(game.view.id === "coast" ? tacticalView : coastView);
			game.cam.snap = true;
		}
		if (I.pressed("radio")) {
			S.radio = (S.radio + 1) % 4;
			setRadio(S.radio);
			toast(
				S.radio === 3 ? "RADIO OFF" : "FIND YOUR FREQUENCY",
				$("radio-title").textContent,
			);
		}
		if (I.pressed("interact")) {
			const context = getContext();
			if (context) context.fn();
		}
		if (menu) return;
		if (S.car) drive(dt);
		else walk(dt);
		const worldDt = S.focus > 0 ? dt * 0.35 : dt;
		if (!S.inside) {
			updateTraffic(worldDt);
			updatePolice(worldDt);
			vehicleCollisions();
		}
		updateCrew(dt);
		updateStory(worldDt);
		updateCombat(worldDt);
		updateActivity(dt);
		updateCitySound(dt);
		if (
			S.hero.x < 35 ||
			S.hero.y < 35 ||
			S.hero.x > WORLD - 15 ||
			S.hero.y > WORLD - 15
		) {
			S.hero.x = 160;
			S.hero.y = 200;
			S.hero.z = 0;
			game.cam.snap = true;
		}
		if (
			!menu &&
			ambientTimer <= 0 &&
			!S.inside &&
			S.wanted === 0 &&
			!S.activity
		) {
			ambientTimer = 38 + rng() * 22;
			const lines = [
				[
					"MILO",
					"Oceanfront parking. Costs more than my first car. Which I also borrowed.",
				],
				[
					"INEZ",
					"The city app says crime is down. They stopped counting the expensive kind.",
				],
				[
					"ROOK",
					"I could get used to this place. Needs fewer security guards.",
				],
			];
			if (S.story < 0) say(...pick(lines));
		}
		focusCamera();
	}
	uiClock += dt;
	if (uiClock > 0.095) {
		uiClock = 0;
		updateHUD();
	}
}
function updateCitySound(dt) {
	engineSoundClock -= dt;
	sirenSoundClock -= dt;
	footstepClock -= dt;
	if (S.car && engineSoundClock <= 0) {
		const boat = S.car.type === "boat",
			moving = Math.abs(S.car.speed);
		game.audio.sfx({
			wave: boat ? "triangle" : "saw",
			freq: 43 + moving * 0.9,
			to: 45 + moving * 1.02,
			dur: 0.18,
			vol: 0.022 + moving / 11000,
			filter: "lowpass",
		});
		if (boat && moving > 25)
			game.audio.sfx({
				wave: "noise",
				freq: 900,
				to: 450,
				dur: 0.22,
				vol: 0.025,
				filter: "lowpass",
			});
		engineSoundClock = 0.14;
	}
	if (
		S.wanted > 0 &&
		!S.inside &&
		S.cops.some((c) => !c.wreck && dist(c, pos()) < 260) &&
		sirenSoundClock <= 0
	) {
		const high = Math.floor(S.time * 2) % 2;
		game.audio.sfx({
			wave: "sine",
			freq: high ? 710 : 470,
			to: high ? 490 : 730,
			dur: 0.46,
			vol: S.jam > 0 ? 0.015 : 0.055,
		});
		sirenSoundClock = 0.46;
	}
	if (
		!S.car &&
		Math.hypot(S.hero.vx, S.hero.vy) > 20 &&
		S.hero.onGround &&
		footstepClock <= 0
	) {
		game.audio.sfx("step", { vol: 0.45 });
		footstepClock = game.input.down("sprint") ? 0.2 : 0.32;
	}
}
function recordActivity(event) {
	if (event.type === "keydown") {
		hadKeyboard = true;
		syncVisibility();
	}
	if (
		event.type === "pointermove" &&
		event.movementX === 0 &&
		event.movementY === 0
	)
		return;
	lastActivity = performance.now();
	if (demo) {
		exitDemo();
		event.preventDefault();
		event.stopImmediatePropagation();
	}
}
for (const type of ["keydown", "pointerdown", "pointermove", "wheel"])
	window.addEventListener(type, recordActivity, {
		capture: true,
		passive: false,
	});
window.addEventListener("blur", () => {
	if (S?.playing && !demo && !menu) openMenu("pause", { parent: null });
});
document.addEventListener("visibilitychange", () => {
	if (document.hidden && S?.playing && !demo && !menu)
		openMenu("pause", { parent: null });
});
window.addEventListener("gamepaddisconnected", () => {
	if (S?.playing && !demo && !menu) {
		openMenu("pause", { parent: null });
		toast("CONTROLLER DISCONNECTED", "Reconnect or continue with keyboard.");
	}
});
$("corner-settings").addEventListener("click", () =>
	openMenu("settings", { parent: S.playing ? "pause" : "title" }),
);
$("touch-settings").addEventListener("click", () =>
	openMenu("settings", { parent: "title" }),
);
// Read-only inspection supports the requested boot / controls / attract checks.
game.debug = {
	snapshot() {
		return {
			title: "Grand Theft Tourist Trap",
			engine: E.version,
			scene: game.sceneName,
			mode: demo ? "attract" : menu?.kind || "play",
			hero: S
				? [S.hero.x, S.hero.y, S.hero.z].map((n) => Math.round(n * 10) / 10)
				: null,
			crew: S ? CREW[S.crew].name : null,
			vehicle: S?.car?.type || null,
			vehicleHeading: S?.car ? Math.round(S.car.a * 1000) / 1000 : null,
			aim: S ? Math.round(S.face * 1000) / 1000 : null,
			abilities: S ? { focus: S.focus, blackout: S.jam, armor: S.iron } : null,
			speed: Math.round(S?.car?.speed || 0),
			inside: !!S?.inside,
			story: S?.story ?? -1,
			wanted: Math.round((S?.wanted || 0) * 10) / 10,
			hp: S?.hp,
			ammo: S?.ammo,
			camera: game.view.id,
			demo: demo
				? {
						segment: DEMO_SEGMENTS[demo.segment]?.kind,
						elapsed: Math.round(demo.elapsed),
						cycle: demo.cycle,
						seen: [...new Set(demo.seen)],
						segmentTime: demo.segmentTime,
						sequence: DEMO_SEGMENTS.map(({ kind, duration }) => ({
							kind,
							duration,
						})),
					}
				: null,
			entities: S
				? {
						buildings: world.buildings.length,
						cars: S.cars.length,
						pedestrians: S.pedestrians.length,
						police: S.cops.length,
						guards: S.guards.length,
						bullets: bullets.list.length,
					}
				: {},
			settings: Object.fromEntries(
				["invertX", "invertY", "aimX", "aimY", "deadzone", "autoAim"].map(
					(k) => [k, game.settings[k]],
				),
			),
			controls: INPUT,
			errors: game.errors.map((e) => e.message),
		};
	},
};
window.TouristTrap = Object.freeze({
	game,
	snapshot: () => game.debug.snapshot(),
});
world = buildWorld();
newRun("free");
S.playing = false;
game.start({
	boot: false,
	scene: "title",
	scenes: {
		title: { update: updateGame, draw: drawWorld },
		play: { update: updateGame, draw: drawWorld },
		attract: { update: updateGame, draw: drawWorld },
	},
});
openMenu("title", { parent: null });
$("boot-label").remove();
syncVisibility();

})();
/* GAME END */</script>
