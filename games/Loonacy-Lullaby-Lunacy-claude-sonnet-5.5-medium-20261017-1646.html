<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loonacy Lullaby</title>
<style>
html,body{margin:0;height:100%;background:#07061a;overflow:hidden}
canvas{display:block;position:absolute;touch-action:none;background:#07061a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const W=1280,H=720,WW=2200,WH=1500,CYCLE=50;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.style.left=(innerWidth-W*s)/2+'px';cv.style.top=(innerHeight-H*s)/2+'px';}
addEventListener('resize',fit);fit();
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const INK='#0a0618';

/* ---------- settings ---------- */
const S={vol:7,music:true,calm:false,shake:true};
try{Object.assign(S,JSON.parse(localStorage.getItem('ll_s')||'{}'));}catch(e){}
const saveS=()=>{try{localStorage.setItem('ll_s',JSON.stringify(S));}catch(e){}};

/* ---------- audio ---------- */
let AC=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
}
function tone(f,d,type,v,slide){
  if(!AC||S.vol<=0)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),vv=(v||.15)*S.vol/10;
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vv,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
}
const sfx={
  move(){tone(520,.05,'triangle',.08);},ok(){tone(660,.09,'square',.1);tone(990,.12,'square',.08);},
  back(){tone(400,.1,'triangle',.1,-150);},dash(){tone(300,.14,'sawtooth',.08,500);},
  flash(){tone(880,.35,'sine',.18,-600);tone(1320,.25,'triangle',.1,-900);},
  shard(){tone(988,.1,'square',.12);setTimeout(()=>tone(1319,.2,'square',.12),90);},
  lull(){[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.18,'sine',.16),i*90));},
  hurt(){tone(160,.3,'sawtooth',.18,-100);},open(){[392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.16),i*120));},
  win(){[523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.28,'triangle',.18),i*140));},
  lose(){[330,311,294,262].forEach((f,i)=>setTimeout(()=>tone(f,.4,'sawtooth',.12),i*220));}
};
const MEL=[220,262,330,392,330,262,247,294,370,440,370,294,196,247,294,392];
let step=0;
setInterval(()=>{
  if(!AC||!S.music||document.hidden)return;
  if(scene==='pause'||scene==='blocked')return;
  const m=G?moon():.3;
  tone(MEL[step%16]*(m>.6?2:1),.2,'triangle',.05);
  if(step%4===0)tone(MEL[step%16]/2,.5,'sine',.07);
  step++;
},230);

/* ---------- input ---------- */
const keys={},kp={},kr={};
let device='kb',anyIn=false,hw=false,ptr={x:-1,y:-1,click:false,moved:false};
addEventListener('keydown',e=>{
  if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
  if(!e.repeat)kp[e.code]=1;
  kr[e.code]=1;keys[e.code]=1;device='kb';anyIn=true;hw=true;audio();
});
addEventListener('keyup',e=>{keys[e.code]=0;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;});
function ptrPos(e){const r=cv.getBoundingClientRect();ptr.x=(e.clientX-r.left)*W/r.width;ptr.y=(e.clientY-r.top)*H/r.height;}
cv.addEventListener('pointermove',e=>{ptrPos(e);ptr.moved=true;if(e.pointerType==='mouse'){device='kb';anyIn=true;}});
cv.addEventListener('pointerdown',e=>{ptrPos(e);ptr.click=true;anyIn=true;audio();});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('gamepadconnected',()=>{hw=true;});
let pprev=[],stickDir='',stickT=0;
function poll(now){
  const I={mx:0,my:0,ok:0,back:0,flash:0,dash:0,pause:0,nu:0,nd:0,nl:0,nr:0,any:anyIn,hw:false};
  const K=c=>keys[c]?1:0,P=c=>kp[c]?1:0,R=c=>kr[c]?1:0;
  I.mx=K('ArrowRight')+K('KeyD')-K('ArrowLeft')-K('KeyA');
  I.my=K('ArrowDown')+K('KeyS')-K('ArrowUp')-K('KeyW');
  I.ok=P('Enter')||P('Space');I.back=P('Escape')||P('Backspace');
  I.dash=P('Space')||P('ShiftLeft')||P('ShiftRight');
  I.flash=P('KeyJ')||P('KeyZ')||P('KeyX')||P('KeyE')||P('KeyK');
  I.pause=P('Escape')||P('KeyP')||P('Enter');
  I.nu=R('ArrowUp')||R('KeyW');I.nd=R('ArrowDown')||R('KeyS');I.nl=R('ArrowLeft')||R('KeyA');I.nr=R('ArrowRight')||R('KeyD');
  if(anyIn&&kp.__x===undefined&&Object.keys(kp).length)I.hw=true;
  let g=null;const gps=navigator.getGamepads?navigator.getGamepads():[];
  for(const p of gps){if(p&&p.connected){g=p;break;}}
  if(g){
    const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed),e=i=>b(i)&&!pprev[i];
    let ax=g.axes[0]||0,ay=g.axes[1]||0;
    if(Math.hypot(ax,ay)<.22){ax=0;ay=0;}
    if(b(15))ax=1;if(b(14))ax=-1;if(b(13))ay=1;if(b(12))ay=-1;
    if(ax||ay){I.mx=ax;I.my=ay;}
    let act=false;
    for(let i=0;i<g.buttons.length;i++)if(e(i))act=true;
    if(e(0)){I.ok=1;I.dash=1;}if(e(1))I.back=1;
    if(e(2)||e(4)||e(5)||e(7))I.flash=1;
    if(e(9)||e(8))I.pause=1;
    // stick / d-pad menu navigation with repeat
    let d='';if(Math.abs(ax)>.6||Math.abs(ay)>.6)d=Math.abs(ax)>Math.abs(ay)?(ax>0?'r':'l'):(ay>0?'d':'u');
    if(d&&(d!==stickDir||now-stickT>260)){stickDir=d;stickT=now;if(d==='u')I.nu=1;if(d==='d')I.nd=1;if(d==='l')I.nl=1;if(d==='r')I.nr=1;}
    if(!d)stickDir='';
    if(act||Math.abs(ax)>.5||Math.abs(ay)>.5){I.any=true;I.hw=true;device='pad';}
    pprev=g.buttons.map(x=>x.pressed);
  }
  if(I.any&&anyIn&&!g)I.hw=I.hw||false;
  if(hw){I.hw=true;hw=false;}
  anyIn=false;
  for(const k in kp)delete kp[k];for(const k in kr)delete kr[k];
  return I;
}

/* ---------- level ---------- */
const WALLS=[
  {x:0,y:0,w:WW,h:40},{x:0,y:WH-40,w:WW,h:40},{x:0,y:0,w:40,h:WH},{x:WW-40,y:0,w:40,h:WH},
  {x:800,y:500,w:500,h:260,m:1},
  {x:300,y:300,w:40,h:500},{x:300,y:300,w:400,h:40},
  {x:1500,y:300,w:40,h:500},{x:1500,y:760,w:400,h:40},
  {x:1000,y:1000,w:40,h:360},{x:500,y:1000,w:400,h:40},
  {x:1400,y:1100,w:500,h:40},{x:1700,y:1100,w:40,h:300},
  {x:1930,y:300,w:230,h:30}
];
const BARRIER={x:1900,y:40,w:30,h:260};
const GATE={x:2040,y:170};
const SHARDS=[[180,160],[560,640],[1100,1050],[1700,560],[1600,1300]];
const FOES=[[500,1150],[900,1250],[700,200],[1200,300],[1000,880],[1300,900],[1700,650],[1800,1000],[1900,1300],[560,520],[170,700]];
const TUFTS=[];(function(){let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<160;i++)TUFTS.push([60+r()*(WW-120),60+r()*(WH-120),r()]);})();
function wallsNow(){return G&&!G.open?WALLS.concat([BARRIER]):WALLS;}
function circleHit(x,y,r,list){
  for(const w of list){const cx=cl(x,w.x,w.x+w.w),cy=cl(y,w.y,w.y+w.h);if((x-cx)**2+(y-cy)**2<r*r)return true;}
  return false;
}
function collide(o,r,list){
  for(const w of list){
    const cx=cl(o.x,w.x,w.x+w.w),cy=cl(o.y,w.y,w.y+w.h);let dx=o.x-cx,dy=o.y-cy;const d=Math.hypot(dx,dy);
    if(d<r){
      if(d>0.001){o.x=cx+dx/d*r;o.y=cy+dy/d*r;}
      else{const l=o.x-w.x,rr=w.x+w.w-o.x,t=o.y-w.y,b=w.y+w.h-o.y,m=Math.min(l,rr,t,b);
        if(m===l)o.x=w.x-r;else if(m===rr)o.x=w.x+w.w+r;else if(m===t)o.y=w.y-r;else o.y=w.y+w.h+r;}
    }
  }
}

/* ---------- game state ---------- */
let G=null,scene='title',sel=0,idle=0,demo=false,demoWait=0,settingsFrom='title',hits=[],dtotal=0;
const touchOnly=window.matchMedia&&matchMedia('(hover: none) and (pointer: coarse)').matches;
function newGame(){
  return {
    p:{x:200,y:1300,vx:0,vy:0,fx:1,fy:0,hp:3,inv:0,dash:0,dcd:0,en:100,dx:1,dy:0,r:16},
    en:FOES.map((f,i)=>({x:f[0],y:f[1],r:20,ang:Math.random()*6.28,wt:Math.random()*2,stun:0,lulled:false,sleep:false,id:i})),
    shards:SHARDS.map(s=>({x:s[0],y:s[1],got:false})),
    got:0,open:false,t:8,time:0,score:0,lulled:0,fx:[],rings:[],shake:0,flashW:0,msg:'',msgT:0,over:null,bot:null,hint:9
  };
}
G=newGame();
const moon=()=>0.5-0.5*Math.cos(G.t*2*Math.PI/CYCLE);
function say(s,t){G.msg=s;G.msgT=t||2.5;}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*180;G.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6+Math.random()*.4,c,s:3+Math.random()*4});}}

function update(dt,I){
  const p=G.p,m=moon();
  G.t+=dt;G.time+=dt;G.hint=Math.max(0,G.hint-dt);G.msgT-=dt;G.shake=Math.max(0,G.shake-dt);G.flashW=Math.max(0,G.flashW-dt);
  p.inv=Math.max(0,p.inv-dt);p.dcd=Math.max(0,p.dcd-dt);p.en=Math.min(100,p.en+16*dt);
  let mx=I.mx,my=I.my;const ml=Math.hypot(mx,my);
  if(ml>1){mx/=ml;my/=ml;}
  if(ml>.05){p.fx=mx/Math.max(ml,1);p.fy=my/Math.max(ml,1);const fl=Math.hypot(p.fx,p.fy)||1;p.fx/=fl;p.fy/=fl;}
  if(I.dash&&p.dcd<=0&&p.dash<=0){p.dash=.18;p.dcd=.75;p.inv=Math.max(p.inv,.3);p.dx=p.fx;p.dy=p.fy;sfx.dash();burst(p.x,p.y,'#9fe3ff',8);}
  if(p.dash>0){p.dash-=dt;p.vx=p.dx*720;p.vy=p.dy*720;}
  else{p.vx+=(mx*300-p.vx)*Math.min(1,dt*14);p.vy+=(my*300-p.vy)*Math.min(1,dt*14);}
  p.x+=p.vx*dt;p.y+=p.vy*dt;collide(p,p.r,wallsNow());
  if(I.flash&&p.en>=35){
    p.en-=35;sfx.flash();G.rings.push({x:p.x,y:p.y,r:10,l:.6});
    const R=230+60*m;
    for(const e of G.en)if(!e.lulled&&Math.hypot(e.x-p.x,e.y-p.y)<R){e.stun=5;burst(e.x,e.y,'#ffffff',6);}
    G.shake=S.shake?.2:0;G.flashW=S.calm?0:.3;
  }
  for(const e of G.en){
    if(e.lulled)continue;
    e.sleep=false;
    const d=Math.hypot(p.x-e.x,p.y-e.y);
    if(e.stun>0){e.stun-=dt;}
    else if(m<.12){e.sleep=true;}
    else{
      let sp,tx,ty;
      if(d<150+300*m){sp=55+120*m;tx=p.x-e.x;ty=p.y-e.y;}
      else{e.wt-=dt;if(e.wt<=0){e.ang+=(Math.random()-.5)*3;e.wt=1.5+Math.random()*1.5;}sp=35+40*m;tx=Math.cos(e.ang);ty=Math.sin(e.ang);}
      const l=Math.hypot(tx,ty)||1;e.x+=tx/l*sp*dt;e.y+=ty/l*sp*dt;
      const ox=e.x,oy=e.y;collide(e,e.r,wallsNow());if(Math.abs(e.x-ox)+Math.abs(e.y-oy)>.5)e.ang+=2;
    }
    if(d<e.r+p.r){
      if(e.stun>0){
        e.lulled=true;G.lulled++;G.score+=150;sfx.lull();burst(e.x,e.y,'#ff9ec7',14);
        if(G.lulled%3===0&&p.hp<3){p.hp++;say('A lullaby mends your heart!');}else say('Lulled to sleep! +150');
      }else if(!e.sleep&&p.inv<=0&&p.dash<=0){
        p.hp--;p.inv=1.6;sfx.hurt();G.shake=S.shake?.35:0;burst(p.x,p.y,'#ff5577',12);
        const l=d||1;p.vx=(p.x-e.x)/l*500;p.vy=(p.y-e.y)/l*500;
      }
    }
  }
  for(const s of G.shards){
    if(!s.got&&Math.hypot(s.x-p.x,s.y-p.y)<32){
      s.got=true;G.got++;G.score+=500;sfx.shard();burst(s.x,s.y,'#ffe66b',16);
      if(G.got===SHARDS.length){G.open=true;sfx.open();say('All moon shards found! The gate is open!',4);}
      else say('Moon shard '+G.got+' / '+SHARDS.length);
    }
  }
  for(const f of G.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.94;f.vy*=.94;f.l-=dt;}
  G.fx=G.fx.filter(f=>f.l>0);
  for(const r of G.rings){r.r+=520*dt;r.l-=dt;}
  G.rings=G.rings.filter(r=>r.l>0);
  if(p.hp<=0){G.over='lose';}
  else if(G.open&&Math.hypot(p.x-GATE.x,p.y-GATE.y)<50){G.over='win';}
}

/* ---------- AI (attract mode) ---------- */
const CS=40,GC=Math.ceil(WW/CS),GR=Math.ceil(WH/CS);
const BLK={closed:null,open:null};
function buildBlk(open){
  const list=open?WALLS:WALLS.concat([BARRIER]),a=new Uint8Array(GC*GR);
  for(let r=0;r<GR;r++)for(let c=0;c<GC;c++)a[r*GC+c]=circleHit(c*CS+CS/2,r*CS+CS/2,26,list)?1:0;
  return a;
}
BLK.closed=buildBlk(false);BLK.open=buildBlk(true);
function field(tx,ty,blk){
  const d=new Int16Array(GC*GR).fill(-1),q=[];
  const c0=cl(Math.floor(tx/CS),0,GC-1),r0=cl(Math.floor(ty/CS),0,GR-1);
  d[r0*GC+c0]=0;q.push(r0*GC+c0);
  for(let h=0;h<q.length;h++){
    const i=q[h],c=i%GC,r=(i/GC)|0;
    for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nc=c+dc,nr=r+dr;if(nc<0||nr<0||nc>=GC||nr>=GR)continue;
      const j=nr*GC+nc;if(d[j]>=0||blk[j])continue;d[j]=d[i]+1;q.push(j);
    }
  }
  return d;
}
function botInput(dt){
  const p=G.p,I={mx:0,my:0,ok:0,back:0,flash:0,dash:0,pause:0},B=G.bot||(G.bot={cd:0,fc:0,key:'',f:null});
  B.cd-=dt;B.fc-=dt;
  let tx=GATE.x,ty=GATE.y,bd=1e9;
  for(const s of G.shards)if(!s.got){const d=Math.hypot(s.x-p.x,s.y-p.y);if(d<bd){bd=d;tx=s.x;ty=s.y;}}
  let thr=null,td=1e9,stunned=null,sd=1e9;
  for(const e of G.en){
    if(e.lulled)continue;const d=Math.hypot(e.x-p.x,e.y-p.y);
    if(e.stun>0){if(d<sd){sd=d;stunned=e;}}
    else if(!e.sleep&&d<td){td=d;thr=e;}
  }
  if(thr&&td<135&&p.en>=35&&B.cd<=0){I.flash=1;B.cd=.6;}
  if(thr&&td<80&&p.dcd<=0&&B.cd<=0&&Math.random()<.2){I.dash=1;}
  let gx=tx,gy=ty;
  if(stunned&&sd<190){gx=stunned.x;gy=stunned.y;I.mx=(gx-p.x)/sd;I.my=(gy-p.y)/sd;return I;}
  const blk=G.open?BLK.open:BLK.closed,key=(G.open?'o':'c')+tx+','+ty;
  if(B.key!==key||B.fc<=0){B.f=field(tx,ty,blk);B.key=key;B.fc=.3;}
  const c=cl(Math.floor(p.x/CS),0,GC-1),r=cl(Math.floor(p.y/CS),0,GR-1),f=B.f;
  let best=f[r*GC+c]<0?9999:f[r*GC+c],nx=null;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(!dc&&!dr)continue;const nc=c+dc,nr=r+dr;if(nc<0||nr<0||nc>=GC||nr>=GR)continue;
    const j=nr*GC+nc;if(f[j]<0||blk[j])continue;
    if(dc&&dr&&(blk[r*GC+nc]||blk[nr*GC+c]))continue;
    const sc=f[j]+(dc&&dr?.4:0);
    if(sc<best){best=sc;nx=[nc*CS+CS/2,nr*CS+CS/2];}
  }
  if(best===0||f[r*GC+c]===0||!nx)nx=[tx,ty];
  const dx=nx[0]-p.x,dy=nx[1]-p.y,l=Math.hypot(dx,dy)||1;
  I.mx=dx/l;I.my=dy/l;
  return I;
}

/* ---------- drawing helpers ---------- */
function ink(fill,lw){if(fill){ctx.fillStyle=fill;ctx.fill();}ctx.lineWidth=lw||4;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const FONT='"Trebuchet MS","Segoe UI",Impact,sans-serif';
function txt(s,x,y,size,fill,align,outline){
  ctx.font='900 '+size+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.lineJoin='round';
  if(outline!==false){ctx.lineWidth=Math.max(4,size*.2);ctx.strokeStyle=INK;ctx.strokeText(s,x,y);}
  ctx.fillStyle=fill||'#fff';ctx.fillText(s,x,y);
}
function heart(x,y,s,fill){
  ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.7,y-s*1.1,x,y-s*.4);ctx.bezierCurveTo(x+s*.7,y-s*1.1,x+s*1.5,y-s*.1,x,y+s*.9);ctx.closePath();ink(fill,4);
}
function ghostPath(x,y,r,t){
  ctx.beginPath();ctx.arc(x,y-4,r,Math.PI,0);const n=4,bw=2*r/n;ctx.lineTo(x+r,y+r*.7);
  for(let i=0;i<n;i++){const xx=x+r-bw*i;ctx.quadraticCurveTo(xx-bw/2,y+r*.7+(i%2?-9:9)+Math.sin(t*6+i)*3,xx-bw,y+r*.7);}
  ctx.closePath();
}
const dotPat=(function(){const c=document.createElement('canvas');c.width=c.height=7;const x=c.getContext('2d');x.fillStyle='rgba(90,70,170,.55)';x.beginPath();x.arc(3.5,3.5,1.9,0,6.3);x.fill();return ctx.createPattern(c,'repeat');})();
const dk=document.createElement('canvas');dk.width=W;dk.height=H;const dctx=dk.getContext('2d');

function drawWorld(cx,cy,lx,ly,dim){
  const m=moon(),t=G.t;
  ctx.save();
  let sx=0,sy=0;if(G.shake>0){sx=(Math.random()-.5)*14;sy=(Math.random()-.5)*14;}
  ctx.translate(-cx+sx,-cy+sy);
  // ground: flat cel tiles
  const i0=Math.floor(cx/100),i1=Math.ceil((cx+W)/100),j0=Math.floor(cy/100),j1=Math.ceil((cy+H)/100);
  for(let j=j0;j<j1;j++)for(let i=i0;i<i1;i++){
    ctx.fillStyle=(i+j)&1?'#3a3978':'#312f6b';ctx.fillRect(i*100,j*100,100,100);
  }
  ctx.strokeStyle='rgba(10,6,24,.4)';ctx.lineWidth=2;
  for(let i=i0;i<=i1;i++){ctx.beginPath();ctx.moveTo(i*100,cy);ctx.lineTo(i*100,cy+H);ctx.stroke();}
  for(let j=j0;j<=j1;j++){ctx.beginPath();ctx.moveTo(cx,j*100);ctx.lineTo(cx+W,j*100);ctx.stroke();}
  ctx.strokeStyle='#4fae8c';ctx.lineWidth=3;ctx.lineCap='round';
  for(const f of TUFTS){if(f[0]<cx-20||f[0]>cx+W+20||f[1]<cy-20||f[1]>cy+H+20)continue;
    ctx.beginPath();ctx.moveTo(f[0]-6,f[1]);ctx.lineTo(f[0]-8,f[1]-10);ctx.moveTo(f[0],f[1]);ctx.lineTo(f[0],f[1]-14);ctx.moveTo(f[0]+6,f[1]);ctx.lineTo(f[0]+8,f[1]-10);ctx.stroke();}
  // gate zone
  ctx.beginPath();ctx.arc(GATE.x,GATE.y,50+Math.sin(t*3)*3,0,6.3);ink(G.open?'#ffe66b':'#4a3d8f',5);
  ctx.beginPath();ctx.arc(GATE.x,GATE.y,26,0,6.3);ink(G.open?'#fffbe0':'#2a2260',4);
  // walls
  for(const w of WALLS.concat(G.open?[]:[BARRIER])){
    if(w.x>cx+W||w.x+w.w<cx||w.y>cy+H+20||w.y+w.h<cy)continue;
    const isB=w===BARRIER;
    ctx.fillStyle='#120e33';ctx.fillRect(w.x,w.y+16,w.w,w.h);ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.strokeRect(w.x,w.y+16,w.w,w.h);
    ctx.fillStyle=isB?'#b36bff':(w.m?'#8b5aa6':'#2f9a6f');ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.fillStyle=isB?'#e0b8ff':(w.m?'#b784cf':'#58c895');ctx.fillRect(w.x+4,w.y+4,Math.max(0,w.w-8),Math.min(12,w.h-8));
    if(w.m){
      ctx.fillStyle='#ffd45e';
      for(let k=0;k<5;k++){const wx=w.x+40+k*95,wy=w.y+90;ctx.fillRect(wx,wy,44,64);ctx.strokeRect(wx,wy,44,64);ctx.beginPath();ctx.moveTo(wx+22,wy);ctx.lineTo(wx+22,wy+64);ctx.stroke();}
    }
    ctx.strokeRect(w.x,w.y,w.w,w.h);
  }
  // shards
  for(const s of G.shards){
    if(s.got)continue;const by=Math.sin(t*3+s.x)*5;
    ctx.beginPath();ctx.arc(s.x,s.y+22,12,0,6.3);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fill();
    ctx.beginPath();ctx.moveTo(s.x,s.y-22+by);ctx.lineTo(s.x+14,s.y+by);ctx.lineTo(s.x,s.y+22+by);ctx.lineTo(s.x-14,s.y+by);ctx.closePath();ink('#ffe66b',4);
    ctx.beginPath();ctx.moveTo(s.x,s.y-14+by);ctx.lineTo(s.x+6,s.y+by);ctx.lineTo(s.x,s.y+by);ctx.closePath();ctx.fillStyle='#fffbe0';ctx.fill();
  }
  // enemies
  for(const e of G.en){
    const bob=Math.sin(t*3+e.id)*3,y=e.y+bob;
    ctx.beginPath();ctx.ellipse(e.x,e.y+e.r+8,e.r,6,0,0,6.3);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill();
    const sc=e.lulled?.75:1;
    ctx.save();ctx.translate(e.x,y);ctx.scale(sc,sc);ctx.translate(-e.x,-y);
    ghostPath(e.x,y,e.r,t+e.id);
    ink(e.lulled?'#ffb6d5':e.stun>0?'#a8ecff':e.sleep?'#4a3d8f':'#7b4bd6',4);
    // cel shade band
    ctx.save();ghostPath(e.x,y,e.r,t+e.id);ctx.clip();ctx.fillStyle='rgba(10,6,24,.28)';ctx.fillRect(e.x+2,y-e.r-8,e.r,e.r*2.4);ctx.restore();
    if(e.lulled||e.sleep){ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(e.x-7,y-4,4,0.1,3);ctx.arc(e.x+9,y-4,4,0.1,3);ctx.stroke();}
    else if(e.stun>0){txt('✦',e.x-7,y-4,14,'#2a6a90',false);txt('✦',e.x+8,y-4,14,'#2a6a90',false);}
    else{
      const dx=cl(G.p.x-e.x,-1,1)*Math.min(3,Math.abs(G.p.x-e.x)/20),dy=cl(G.p.y-e.y,-1,1)*Math.min(3,Math.abs(G.p.y-e.y)/20);
      for(const ox of [-7,8]){ctx.beginPath();ctx.arc(e.x+ox,y-4,6,0,6.3);ink('#fff',3);ctx.beginPath();ctx.arc(e.x+ox+dx,y-4+dy,2.5,0,6.3);ctx.fillStyle=INK;ctx.fill();}
      ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.beginPath();ctx.moveTo(e.x-14,y-14);ctx.lineTo(e.x-3,y-9);ctx.moveTo(e.x+15,y-14);ctx.lineTo(e.x+4,y-9);ctx.stroke();
    }
    ctx.restore();
    if(e.sleep&&!e.lulled)txt('z',e.x+18,y-24-Math.sin(t*2+e.id)*4,18,'#cfc6ff');
    if(e.lulled)heart(e.x,y-e.r-12-Math.sin(t*3)*3,6,'#ff4f8b');
  }
  // player
  const p=G.p;
  if(!(p.inv>0&&Math.floor(p.inv*14)%2)){
    ctx.beginPath();ctx.ellipse(p.x,p.y+p.r+6,p.r,6,0,0,6.3);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill();
    if(p.dash>0){ctx.globalAlpha=.4;ctx.beginPath();ctx.arc(p.x-p.dx*26,p.y-p.dy*26,p.r,0,6.3);ink('#9fe3ff',3);ctx.globalAlpha=1;}
    ctx.beginPath();ctx.moveTo(p.x-17,p.y+18);ctx.quadraticCurveTo(p.x,p.y-24,p.x+17,p.y+18);ctx.closePath();ink('#fff4e0',4);
    ctx.save();ctx.beginPath();ctx.moveTo(p.x-17,p.y+18);ctx.quadraticCurveTo(p.x,p.y-24,p.x+17,p.y+18);ctx.closePath();ctx.clip();ctx.fillStyle='rgba(120,100,190,.45)';ctx.fillRect(p.x+2,p.y-30,30,60);ctx.restore();
    ctx.beginPath();ctx.arc(p.x,p.y-10,12,0,6.3);ink('#ffdcb8',4);
    ctx.beginPath();ctx.moveTo(p.x-13,p.y-12);ctx.quadraticCurveTo(p.x,p.y-34,p.x+16,p.y-14);ctx.closePath();ink('#e0475b',4);
    ctx.beginPath();ctx.arc(p.x+16,p.y-16,5,0,6.3);ink('#fff',3);
    ctx.fillStyle=INK;ctx.beginPath();ctx.arc(p.x+p.fx*3-4,p.y-9+p.fy*2,2,0,6.3);ctx.arc(p.x+p.fx*3+5,p.y-9+p.fy*2,2,0,6.3);ctx.fill();
    const lx=p.x+p.fx*26,ly=p.y+4+p.fy*20;
    ctx.beginPath();ctx.arc(lx,ly,9,0,6.3);ink('#ffe66b',3);
  }
  // rings, fx
  for(const r of G.rings){ctx.globalAlpha=Math.max(0,r.l/.6);ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.3);ctx.lineWidth=10;ctx.strokeStyle='#fffbe0';ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();ctx.globalAlpha=1;}
  for(const f of G.fx){ctx.globalAlpha=Math.max(0,f.l);ctx.fillStyle=f.c;ctx.fillRect(f.x-f.s/2,f.y-f.s/2,f.s,f.s);ctx.globalAlpha=1;}
  ctx.restore();
  // darkness with stepped (cel) light cut-outs and ink halftone
  const dark=.9-.5*m;
  dctx.globalCompositeOperation='source-over';dctx.clearRect(0,0,W,H);
  dctx.fillStyle='rgba(8,6,34,'+(dark*(dim||1))+')';dctx.fillRect(0,0,W,H);
  dctx.fillStyle=dotPat;dctx.fillRect(0,0,W,H);
  dctx.globalCompositeOperation='destination-out';
  const R=170+260*m,px=lx-cx,py=ly-cy;
  for(const [k,a] of [[1,.35],[.72,.4],[.45,.6]]){dctx.fillStyle='rgba(0,0,0,'+a+')';dctx.beginPath();dctx.arc(px,py,R*k,0,6.3);dctx.fill();}
  for(const s of G.shards){if(s.got)continue;dctx.fillStyle='rgba(0,0,0,.7)';dctx.beginPath();dctx.arc(s.x-cx,s.y-cy,60+30*Math.sin(t*3),0,6.3);dctx.fill();}
  if(G.open){dctx.fillStyle='rgba(0,0,0,.8)';dctx.beginPath();dctx.arc(GATE.x-cx,GATE.y-cy,110,0,6.3);dctx.fill();}
  ctx.drawImage(dk,0,0);
  if(G.flashW>0){ctx.fillStyle='rgba(255,251,224,'+G.flashW*.7+')';ctx.fillRect(0,0,W,H);}
}

function moonIcon(x,y,r){
  const m=moon(),ph=(G.t%CYCLE)/CYCLE;
  ctx.beginPath();ctx.arc(x,y,r,0,6.3);ink('#ffe66b',5);
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,6.3);ctx.clip();
  ctx.beginPath();ctx.arc(x+(ph<.5?-1:1)*m*r*2.1,y,r,0,6.3);ctx.fillStyle='#1d1650';ctx.fill();
  ctx.fillStyle='rgba(10,6,24,.25)';for(const c of [[-.3,-.3,.18],[.25,.1,.22],[-.1,.45,.12]]){ctx.beginPath();ctx.arc(x+c[0]*r,y+c[1]*r,c[2]*r,0,6.3);ctx.fill();}
  ctx.restore();
  ctx.beginPath();ctx.arc(x,y,r,0,6.3);ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.stroke();
}

/* ---------- menus ---------- */
function items(){
  switch(scene){
    case 'title':return [
      {label:'Play',ok(){startGame(false);}},
      {label:'Settings',ok(){settingsFrom='title';go('settings');}},
      {label:'About & Credits',ok(){go('about');}}];
    case 'pause':return [
      {label:'Resume',ok(){go('play');}},
      {label:'Settings',ok(){settingsFrom='pause';go('settings');}},
      {label:'Quit to Title',ok(){toTitle();}}];
    case 'win':return [{label:'Play Again',ok(){startGame(false);}},{label:'Title',ok(){toTitle();}}];
    case 'lose':return [{label:'Try Again',ok(){startGame(false);}},{label:'Title',ok(){toTitle();}}];
    case 'about':return [{label:'Back',ok(){go('title');}}];
    case 'blocked':return [{label:'Settings',ok(){settingsFrom='blocked';go('settings');}}];
    case 'settings':return [
      {label:'Volume',val:()=>S.vol+' / 10',l(){S.vol=Math.max(0,S.vol-1);saveS();sfx.move();},r(){S.vol=Math.min(10,S.vol+1);saveS();sfx.move();},ok(){S.vol=S.vol>=10?0:S.vol+1;saveS();sfx.move();}},
      {label:'Music',val:()=>S.music?'On':'Off',l(){S.music=!S.music;saveS();},r(){S.music=!S.music;saveS();},ok(){S.music=!S.music;saveS();}},
      {label:'Calm Visuals',val:()=>S.calm?'On':'Off',l(){S.calm=!S.calm;saveS();},r(){S.calm=!S.calm;saveS();},ok(){S.calm=!S.calm;saveS();}},
      {label:'Screen Shake',val:()=>S.shake?'On':'Off',l(){S.shake=!S.shake;saveS();},r(){S.shake=!S.shake;saveS();},ok(){S.shake=!S.shake;saveS();}},
      {label:'Back',ok(){go(settingsFrom);}}];
  }
  return [];
}
function go(s){scene=s;sel=0;idle=0;if(s==='about'||s==='settings')ptr.moved=false;}
function startGame(isDemo){G=newGame();if(isDemo)G.hint=0;demo=isDemo;demoWait=0;go('play');if(!isDemo)sfx.ok();}
function toTitle(){demo=false;G=newGame();go('title');}
function goBack(){
  if(scene==='settings')go(settingsFrom);
  else if(scene==='about')go('title');
  else if(scene==='pause')go('play');
  else if(scene==='win'||scene==='lose')toTitle();
}
function menuUpdate(I){
  const it=items();if(!it.length)return;
  if(ptr.moved){for(const h of hits)if(ptr.x>=h.x&&ptr.x<=h.x+h.w&&ptr.y>=h.y&&ptr.y<=h.y+h.h&&sel!==h.i){sel=h.i;sfx.move();}ptr.moved=false;}
  if(ptr.click){for(const h of hits)if(ptr.x>=h.x&&ptr.x<=h.x+h.w&&ptr.y>=h.y&&ptr.y<=h.y+h.h){sel=h.i;const m=it[h.i];if(m.ok){m.ok();if(!m.val)sfx.ok();}break;}ptr.click=false;return;}
  if(I.nu){sel=(sel+it.length-1)%it.length;sfx.move();}
  if(I.nd){sel=(sel+1)%it.length;sfx.move();}
  const m=it[sel];if(!m)return;
  if(I.nl&&m.l)m.l();
  if(I.nr&&m.r)m.r();
  if(I.ok&&m.ok){m.ok();if(!m.val)sfx.ok();}
  else if(I.back){goBack();sfx.back();}
}
function drawMenu(y0,gap){
  const it=items();hits=[];
  it.forEach((m,i)=>{
    const y=y0+i*gap,on=i===sel,w=660,h=68,x=W/2-w/2;
    rr(x,y-h/2,w,h,18);ink(on?'#ffe66b':'rgba(24,18,70,.92)',5);
    txt(m.label,x+34,y+2,36,on?'#1a1240':'#e8e0ff','left',false);
    if(m.val){txt((on?'◀  ':'')+m.val()+(on?'  ▶':''),x+w-34,y+2,34,on?'#1a1240':'#ffe66b','right',false);}
    hits.push({x,y:y-h/2,w,h,i});
  });
}
function footer(){
  const g=GL();
  txt((device==='pad'?'↕ Select':'↑↓ Select')+'     '+g.ok+' Confirm'+(scene==='title'||scene==='blocked'?'':'     '+g.back+' Back'),W/2,H-34,24,'#cfc6ff');
}

/* ---------- main loop ---------- */
let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  const I=poll(ts);
  if(scene==='blocked'&&I.hw){go('title');I.ok=0;I.back=0;I.nu=I.nd=I.nl=I.nr=0;}
  if(scene==='title'||scene==='about'||(scene==='settings'&&settingsFrom==='title')){
    if(I.any)idle=0;else idle+=dt;
    if(idle>=10&&scene!=='blocked'){startGame(true);}
  }
  if(scene==='title'||scene==='about'||scene==='blocked'||scene==='settings'||scene==='pause'||scene==='win'||scene==='lose')G.t+=scene==='pause'?0:dt;
  switch(scene){
    case 'title':titleScreen(ts);menuUpdate(I);break;
    case 'about':aboutScreen(ts);menuUpdate(I);break;
    case 'blocked':blockedScreen(ts);menuUpdate(I);break;
    case 'settings':settingsScreen(ts);menuUpdate(I);break;
    case 'play':{
      if(demo){
        if(I.any){toTitle();break;}
        if(G.over){demoWait+=dt;if(demoWait>2.5){startGame(true);}}
        else update(dt,botInput(dt));
        playDraw();hud();
        ctx.fillStyle='rgba(10,6,36,.7)';ctx.fillRect(0,H-90,W,90);
        txt('LOONACY LULLABY — DEMO',W/2,H-62,28,'#ffe66b');
        if(Math.floor(ts/600)%2)txt('Press any button to play',W/2,H-28,26,'#fff');
        break;
      }
      if(I.pause){go('pause');sfx.back();playDraw();hud();break;}
      update(dt,I);playDraw();hud();
      if(G.over){const o=G.over;G.over=null;go(o);(o==='win'?sfx.win:sfx.lose)();}
      break;
    }
    case 'pause':playDraw();hud();ctx.fillStyle='rgba(10,6,36,.7)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,170,90,'#ffe66b');drawMenu(330,86);footer();menuUpdate(I);
      if(I.pause&&scene==='pause'&&!I.ok&&!I.back){go('play');}
      break;
    case 'win':playDraw();endScreen(true);menuUpdate(I);break;
    case 'lose':playDraw();endScreen(false);menuUpdate(I);break;
  }
  ptr.click=false;
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scene==='play'&&!demo)go('pause');});
if(touchOnly)scene='blocked';
requestAnimationFrame(frame);
</script>
