let hurtCD=0;function damage(n){if(attract||roll>0||clock<hurtCD)return;player.hp-=n;hurtCD=clock+.5;shake=.5;sound(80,.2,'triangle');if(player.hp<=0)finish(false)}
function project(x,y,z){let scale=Math.min(W,H)*.92/(z+24);return {x:W*.5+(x-(player?.x||0)*.25)*scale,y:H*.48-(y-(player?.y||0)*.2)*scale,s:scale}}
let polys=[];function poly(points,color){let p=points.map(v=>project(...v));polys.push({z:points.reduce((s,v)=>s+v[2],0)/points.length,p,color})}function mesh(x,y,z,size,color,bank=0,enemy=false){let vertices=[[0,0,-3],[-3.4,0,1],[0,.7,.3],[3.4,0,1],[0,-.4,1.5],[0,1.4,1.6]];let v=vertices.map(([a,b,c])=>[x+(a*Math.cos(bank)-b*Math.sin(bank))*size,y+(a*Math.sin(bank)+b*Math.cos(bank))*size,z+c*size]);[[0,1,2],[0,2,3],[0,4,1],[0,3,4],[2,4,5]].forEach((f,i)=>poly(f.map(j=>v[j]),[color,enemy?'#913e50':'#d7edf5',enemy?'#502337':'#416379','#263b57','#6affe0'][i]));}
function line3(a,b,col,width=2){let p=project(...a),q=project(...b);ctx.strokeStyle=col;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
function text(s,x,y,size=18,color='#dafaff',align='left'){ctx.font=`700 ${size}px Arial`;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(s,x,y)}
function draw(){let playing=state!=='title';let t=playing?total:clock;ctx.fillStyle='#040d20';ctx.fillRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,stage===0?'#0b1933':'#03091b');g.addColorStop(.6,stage===0?'#533b4e':'#192442');g.addColorStop(1,'#0a152a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let s of stars){let yy=(s.y*H+t*(3+s.z*12))%H;ctx.fillStyle=s.z>.5?'#9fbdd8':'#4c6686';ctx.fillRect(s.x*W,yy,1+s.z,1+s.z)}ctx.fillStyle='#bd7859';ctx.beginPath();ctx.arc(W*.76,H*.27,Math.min(W,H)*.12,0,7);ctx.fill();ctx.fillStyle='#23354d';ctx.beginPath();ctx.arc(W*.75,H*.25,Math.min(W,H)*.12,0,7);ctx.fill();
ctx.save();if(settings.shake&&shake>0)ctx.translate((Math.random()-.5)*shake*15,(Math.random()-.5)*shake*12);polys=[];
for(let j=18;j>=0;j--){let z=j*13-(t*29%13);for(let side of [-1,1]){let x=side*(32+Math.sin(j*1.8)*8);let y=-16;let ht=stage===0?18+Math.sin(j*3)*10:3;poly([[x,y,z],[x+side*18,y+ht,z+7],[x+side*35,y-4,z+13],[x,y,z+13]],j%2?'#273548':'#344359');poly([[x,y,z],[x,y,z+13],[x-side*7,y-8,z+13],[x-side*7,y-8,z]],'#17283c')}}
for(let e of enemies){if(e.type==='boss'){let x=e.x,y=e.y,z=e.z;poly([[x-24,y-3,z+8],[x+24,y-3,z+8],[x+19,y+3,z],[x-19,y+3,z]],'#566273');poly([[x-19,y+3,z],[x+19,y+3,z],[x+10,y+9,z+8],[x-10,y+9,z+8]],'#303e56');for(let i=0;i<2;i++){let cx=x+(i?13:-13);poly([[cx-4,y-2,z-1],[cx+4,y-2,z-1],[cx+4,y+3,z-1],[cx-4,y+3,z-1]],e.core[i]>0?'#ff9b38':'#1a2938')}poly([[x-4,y+3,z-2],[x+4,y+3,z-2],[x+3,y+7,z-2],[x-3,y+7,z-2]],e.core.every(v=>v===0)?'#72ffe0':'#577fb0')}else mesh(e.x,e.y,e.z,e.type==='heavy'?1.4:1,'#ef7868',Math.sin(e.t)*.3,true)}
if(player)mesh(player.x,player.y,1,1.3,'#9fc8de',roll>0?roll*Math.PI*4:clamp(-((keys.KeyD?1:0)-(keys.KeyA?1:0))*.45,-.6,.6));else mesh(0,Math.sin(t)*2,15,3,'#c1e0ef',Math.sin(t*.3)*.3);
polys.sort((a,b)=>b.z-a.z);for(let p of polys){ctx.beginPath();p.p.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));ctx.closePath();ctx.fillStyle=p.color;ctx.fill();ctx.strokeStyle='#b1d4ed16';ctx.lineWidth=1;ctx.stroke()}
for(let r of rings){let p=project(r.x,r.y,r.z);ctx.strokeStyle=r.rescue?'#79ffbc':'#ffc478';ctx.lineWidth=Math.max(2,p.s*.35);ctx.beginPath();ctx.ellipse(p.x,p.y,p.s*5,p.s*5,0,0,7);ctx.stroke();if(r.rescue)text('RESCUE',p.x,p.y-p.s*6,13,'#79ffbc','center')}
for(let s of shots)line3([s.x,s.y,s.z],[s.x,s.y,s.z-5],s.charged?'#d2a4ff':'#78ffe4',s.charged?5:3);for(let b of hostile){let p=project(b.x,b.y,b.z);ctx.fillStyle='#ff775d';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(3,p.s*.5),0,7);ctx.fill()}for(let p of particles){let q=project(p.x,p.y,p.z);ctx.globalAlpha=Math.min(1,p.life);ctx.fillStyle=p.color;ctx.fillRect(q.x,q.y,Math.max(2,q.s*.3),Math.max(2,q.s*.3))}ctx.globalAlpha=1;for(let p of pickups){let q=project(p.x,p.y,p.z);text('+',q.x,q.y,Math.max(18,q.s*2),'#7affd8','center')}
if(player){let p=project(player.x,player.y,0);ctx.fillStyle='#6dceff';ctx.beginPath();ctx.moveTo(p.x-9,p.y+8);ctx.lineTo(p.x,p.y+25+Math.random()*20);ctx.lineTo(p.x+9,p.y+8);ctx.fill()}
if(bombFX>0){ctx.globalAlpha=bombFX*.55;ctx.fillStyle='#a9eeff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}ctx.restore();if(playing&&player)hud();}
function bar(x,y,w,h,v,color){ctx.fillStyle='#112437';ctx.fillRect(x,y,w,h);ctx.fillStyle=color;ctx.fillRect(x,y,w*clamp(v,0,1),h)}
function hud(){let margin=Math.max(25,W*.045);text('COMET / 01',margin,42,16,'#79ffdc');text(chapters[stage]?.name||'',margin,69,20);text(score.toString().padStart(7,'0'),W-margin,46,30,'#fff','right');text('SCORE'+(combo>1?'   ×'+Math.min(combo,5):''),W-margin,68,12,'#8aadc2','right');bar(margin,H-65,Math.min(240,W*.25),12,player.hp/100,'#76ffd0');text('SHIELD '+Math.ceil(player.hp)+'%',margin,H-77,13);bar(margin,H-40,Math.min(240,W*.25),6,player.energy/100,'#72baff');text('NOVA '+('◆ '.repeat(bombs))+'   LASER '+upgrade,W-margin,H-38,16,'#b9ddeb','right');text(rollCD>0?'ROLL '+Math.max(0,rollCD).toFixed(1)+'s':'ROLL READY',W-margin,H-65,13,'#7affd8','right');
let p=project(player.x+player.aimX*26,player.y+player.aimY*19,65);ctx.strokeStyle=lock?'#ffa850':'#8af5e0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,20,0,7);ctx.moveTo(p.x-30,p.y);ctx.lineTo(p.x-12,p.y);ctx.moveTo(p.x+12,p.y);ctx.lineTo(p.x+30,p.y);ctx.moveTo(p.x,p.y-30);ctx.lineTo(p.x,p.y-12);ctx.stroke();if(lock){let q=project(lock.x,lock.y,lock.z);ctx.strokeStyle='#ffac59';ctx.strokeRect(q.x-24,q.y-24,48,48);text(charge>.9?'LOCKED':'ACQUIRING',q.x,q.y-33,12,'#ffbd73','center')}
if(stageTime<7){text(chapters[stage].sub,W/2,H*.19,18,'#d6faff','center');if(stage===0)text('STEER: LEFT STICK / WASD   •   FIRE: ✕ / SPACE',W/2,H*.24,16,'#7affd8','center')}
let boss=enemies.find(e=>e.type==='boss');if(boss){text('DREADNOUGHT / '+(boss.core.some(v=>v>0)?'SHIELD CORES':'BRIDGE EXPOSED'),W/2,100,14,'#ffb975','center');bar(W*.3,112,W*.4,7,boss.hp/boss.max,'#ff9773');for(let i=0;i<2;i++)bar(W*.3+i*W*.21,126,W*.19,4,boss.core[i]/65,'#ffc55c')}
if(radio.time>0){let rw=Math.min(590,W*.64),rx=(W-rw)/2;ctx.fillStyle='#051522df';ctx.fillRect(rx,H-145,rw,64);ctx.fillStyle='#7affd8';ctx.fillRect(rx,H-145,3,64);text(radio.who,rx+18,H-122,12,'#7affd8');ctx.font='15px Arial';ctx.textAlign='left';ctx.fillStyle='#e4f6fa';let words=radio.text.split(' '),line='',yy=H-100;for(let word of words){if(ctx.measureText(line+word).width>rw-40){ctx.fillText(line,rx+18,yy);yy+=18;line=''}line+=word+' '}ctx.fillText(line,rx+18,yy)}

if(stage===1){let rx=W-margin-70,ry=H*.28;ctx.strokeStyle='#5f819b';ctx.beginPath();ctx.arc(rx,ry,55,0,7);ctx.stroke();ctx.fillStyle='#7affd8';ctx.fillRect(rx-2,ry+40,4,5);for(let e of enemies){ctx.fillStyle='#ff987d';ctx.fillRect(rx+clamp(e.x-player.x,-30,30)*1.5,ry+40-e.z*.7,4,4)}}}
