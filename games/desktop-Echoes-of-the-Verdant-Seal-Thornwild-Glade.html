<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echoes of the Verdant Seal — Thornwild Glade</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #0c140d;
  color: #e8e0c8;
  font-family: Georgia, 'Times New Roman', serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.wrap { width: 984px; max-width: 98vw; padding: 12px 0 20px; }
.stage {
  position: relative;
  width: 960px; max-width: 96vw;
  margin: 0 auto;
  border: 3px solid #3f5a37;
  outline: 1px solid #101a10;
  background: #060a06;
}
canvas { display: block; width: 100%; height: auto; cursor: crosshair; }
#screen {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(6, 10, 6, 0.82);
  text-align: center;
  z-index: 2;
}
#screen.hidden { display: none; }
.panel {
  max-width: 640px;
  padding: 28px 36px;
  border: 1px solid #3f5a37;
  background: rgba(10, 18, 10, 0.88);
  box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), inset 0 0 40px rgba(47, 107, 58, 0.12);
}
.panel h1 {
  margin: 0 0 10px;
  font-size: 40px;
  letter-spacing: 1px;
  color: #ffd76e;
  font-weight: normal;
  text-shadow: 0 0 26px rgba(255, 215, 110, 0.35);
}
.panel h1.dim { color: #8fa08a; }
.panel h1.gold { color: #ffd76e; }
.panel .sub { font-style: italic; color: #bcd0b0; margin: 0 0 14px; }
.panel p { line-height: 1.5; margin: 10px 0; }
.controls {
  font-family: Verdana, sans-serif;
  font-size: 13px;
  line-height: 1.9;
  color: #d8e4c8;
  border-top: 1px solid #3f5a37;
  border-bottom: 1px solid #3f5a37;
  padding: 10px 0;
  margin: 12px 0;
}
.controls b { color: #ffd76e; }
.panel button {
  font-family: Georgia, serif;
  font-size: 19px;
  margin-top: 14px;
  padding: 11px 34px;
  background: #2f6b3a;
  color: #fff8e8;
  border: 2px solid #8a9a5b;
  cursor: pointer;
}
.panel button:hover { background: #3f8a4d; }
.results {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 30px;
  font-family: Verdana, sans-serif;
  font-size: 14px;
  margin: 12px auto;
  max-width: 420px;
  text-align: left;
  color: #bcd0b0;
}
.results b { color: #ffd76e; float: right; }
.help {
  display: flex; flex-wrap: wrap; gap: 8px 22px;
  justify-content: center;
  margin-top: 10px;
  font-family: Verdana, sans-serif;
  font-size: 12px;
  color: #8fa08a;
}
.help b { color: #d8e4c8; }
@media (prefers-reduced-motion: reduce) {
  .panel button { transition: none; }
}

</style>

  // All tuning in one place. Time in seconds, distance in world px.

<script>
/* ===== inlined js/input.js ===== */
(function () {
  const V = globalThis.VERDANT = globalThis.VERDANT || {};
  // Remappable keyboard map: action -> list of e.code. Edit bindings to remap.
  const I = V.Input = {
    bindings: {
      up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'],
      left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
      attack: ['KeyJ', 'KeyZ'], dash: ['ShiftLeft', 'ShiftRight'],
      ring: ['Tab', 'Space', 'KeyK'], confirm: ['Enter', 'KeyJ', 'KeyZ', 'Space'],
      cancel: ['Escape', 'Tab', 'KeyX'], mute: ['KeyM'], pause: ['KeyP'],
    },
    heldCodes: new Set(),
    pressedActions: new Set(),
    pressedCodes: new Set(), // physical e.code edges (avoids binding-collision ambiguity)
    virtualHeld: new Set(),     // headless/test injection (action names)
    virtualPressed: new Set(),  // headless/test injection (action names)
    mouse: { x: 0, y: 0, down: false, clicked: false },
    _codeToAction: new Map(),
    _ready: false,
  };
  function rebuild() {
    I._codeToAction.clear();
    for (const [action, codes] of Object.entries(I.bindings))
      for (const c of codes) I._codeToAction.set(c, action);
  }
  rebuild();
  I.remap = function (action, codes) { I.bindings[action] = codes.slice(); rebuild(); };
  I.down = function (a) {
    if (I.virtualHeld.has(a)) return true;
    const codes = I.bindings[a] || [];
    for (const c of codes) if (I.heldCodes.has(c)) return true;
    if (a === 'attack' && I.mouse.down) return true;
    return false;
  };
  I.pressed = function (a) {
    if (I.virtualPressed.has(a)) return true;
    return I.pressedActions.has(a);
  };
  I.axis = function () {
    let x = 0, y = 0;
    if (I.down('left')) x -= 1;
    if (I.down('right')) x += 1;
    if (I.down('up')) y -= 1;
    if (I.down('down')) y += 1;
    if (x && y) { x *= Math.SQRT1_2; y *= Math.SQRT1_2; }
    return { x, y };
  };
  // Test/headless helpers
  I.vhold = function (a) { I.virtualHeld.add(a); };
  I.vrelease = function (a) { I.virtualHeld.delete(a); };
  I.vpress = function (a) { I.virtualPressed.add(a); I.virtualHeld.add(a); };
  I.vclear = function () { I.virtualHeld.clear(); I.virtualPressed.clear(); };
  I.endFrame = function () {
    I.pressedActions.clear();
    I.pressedCodes.clear();
    I.virtualPressed.clear();
    I.mouse.clicked = false;
  };
  I.pressedCode = function (c) { return I.pressedCodes.has(c); };
  I.init = function (canvas) {
    if (I._ready || !canvas || !canvas.addEventListener) return;
    I._ready = true;
    window.addEventListener('keydown', (e) => {
      const a = I._codeToAction.get(e.code);
      if (a === 'ring' || a === undefined) { /* allow tab default? no—prevent */ }
      if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      if (!e.repeat) {
        const act = I._codeToAction.get(e.code);
        if (act) I.pressedActions.add(act);
        I.pressedCodes.add(e.code);
      }
      I.heldCodes.add(e.code);
    });
    window.addEventListener('keyup', (e) => { I.heldCodes.delete(e.code); });
    window.addEventListener('blur', () => { I.heldCodes.clear(); I.mouse.down = false; });
    const pos = (e) => {
      const r = canvas.getBoundingClientRect();
      const sx = canvas.width / Math.max(1, r.width), sy = canvas.height / Math.max(1, r.height);
      return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
    };
    canvas.addEventListener('mousemove', (e) => { const p = pos(e); I.mouse.x = p.x; I.mouse.y = p.y; });
    canvas.addEventListener('mousedown', (e) => {
      const p = pos(e); I.mouse.x = p.x; I.mouse.y = p.y;
      if (e.button === 0) { I.mouse.down = true; I.mouse.clicked = true; }
    });
    window.addEventListener('mouseup', (e) => { if (e.button === 0) I.mouse.down = false; });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  };
})();

</script>
<script>
/* ===== inlined js/audio.js ===== */
(function () {
  const V = globalThis.VERDANT = globalThis.VERDANT || {};
  // Procedural WebAudio SFX. All calls are safe no-ops when WebAudio is
  // unavailable (headless) or before the first user gesture unlocks it.
  const A = V.Audio = {
    ctx: null, muted: false, available: false,
    _chargeOsc: null, _chargeGain: null, _master: null,
  };
  A.unlock = function () {
    if (A.ctx || A.muted) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      A.ctx = new AC();
      A._master = A.ctx.createGain();
      A._master.gain.value = 0.5;
      A._master.connect(A.ctx.destination);
      // Gentle glue compressor keeps stacked SFX + music from clipping.
      try {
        A._comp = A.ctx.createDynamicsCompressor();
        A._comp.threshold.value = -18; A._comp.ratio.value = 6;
        A._master.disconnect(); A._master.connect(A._comp); A._comp.connect(A.ctx.destination);
      } catch (e) { /* no compressor, still fine */ }
      // Separate buses so music can be balanced/ducked under SFX.
      A._sfx = A.ctx.createGain(); A._sfx.gain.value = 0.9; A._sfx.connect(A._master);
      A._music = A.ctx.createGain(); A._music.gain.value = 0.32; A._music.connect(A._master);
      A.available = true;
      // Start the generative music scheduler (browser only; headless stays silent).
      A._nextT = A.ctx.currentTime + 0.2; A._step = 0;
      if (!A._timer && typeof setInterval !== 'undefined') {
        A._timer = setInterval(function () { A._sched(); }, 110);
      }
    } catch (e) { A.ctx = null; A.available = false; }
  };
  A.toggleMute = function () {
    A.muted = !A.muted;
    if (A._master) A._master.gain.value = A.muted ? 0 : 0.5;
    if (A.muted) A.chargeStop();
    return A.muted;
  };
  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!A.ctx || A.muted || !A.available) return;
    try {
      const t = A.ctx.currentTime + (delay || 0);
      const o = A.ctx.createOscillator(), g = A.ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
      g.gain.setValueAtTime(vol || 0.3, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(A._sfx || A._master);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* ignore */ }
  }
  function noise(dur, vol, lowpass, delay) {
    if (!A.ctx || A.muted || !A.available) return;
    try {
      const t = A.ctx.currentTime + (delay || 0);
      const len = Math.max(1, Math.floor(A.ctx.sampleRate * dur));
      const buf = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = A.ctx.createBufferSource(); src.buffer = buf;
      const f = A.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lowpass || 1200;
      const g = A.ctx.createGain(); g.gain.value = vol || 0.3;
      src.connect(f); f.connect(g); g.connect(A._sfx || A._master);
      src.start(t);
    } catch (e) { /* ignore */ }
  }
  // Named SFX used across the game.
  A.sfx = function (name, opt) {
    if (!A.ctx || A.muted || !A.available) return;
    opt = opt || {};
    switch (name) {
      case 'swing': noise(0.12, 0.25, 2600); tone(320, 0.08, 'triangle', 0.12, 140); break;
      case 'hit': noise(0.08, 0.4, 1500); tone(180, 0.1, 'square', 0.2, 90); break;
      case 'chargedHit': noise(0.25, 0.5, 900); tone(120, 0.3, 'sawtooth', 0.3, 40); tone(660, 0.2, 'sine', 0.2, 990, 0.03); break;
      case 'hurt': tone(220, 0.2, 'sawtooth', 0.3, 90); break;
      case 'dash': noise(0.16, 0.25, 3200); break;
      case 'enemyDie': tone(400, 0.25, 'square', 0.22, 60); noise(0.15, 0.3, 800, 0.03); break;
      case 'orb': tone(880, 0.12, 'sine', 0.25, 1320); break;
      case 'tide': noise(0.4, 0.4, 1800); tone(300, 0.35, 'sine', 0.3, 900); break;
      case 'mend': tone(520, 0.3, 'sine', 0.25, 780); tone(780, 0.4, 'sine', 0.2, 1040, 0.12); break;
      case 'cinder': noise(0.5, 0.45, 700); tone(150, 0.4, 'sawtooth', 0.25, 60); break;
      case 'bell': tone(660, 1.2, 'sine', 0.4, 655); tone(990, 0.9, 'sine', 0.2, 984, 0.02); tone(1320, 0.6, 'sine', 0.12, 1310, 0.04); break;
      case 'gate': noise(0.8, 0.35, 400); tone(80, 0.8, 'sawtooth', 0.25, 40); break;
      case 'bossRoar': tone(70, 0.9, 'sawtooth', 0.4, 45); noise(0.7, 0.35, 500, 0.1); break;
      case 'slam': noise(0.3, 0.55, 350); tone(60, 0.35, 'sine', 0.5, 30); break;
      case 'ring': tone(440, 0.1, 'sine', 0.2, 660); break;
      case 'select': tone(660, 0.08, 'sine', 0.22, 880); break;
      case 'chest': tone(392, 0.15, 'triangle', 0.3); tone(523, 0.15, 'triangle', 0.3, null, 0.12); tone(659, 0.25, 'triangle', 0.3, null, 0.24); break;
      case 'revive': tone(440, 0.2, 'sine', 0.25, 880); break;
      case 'win': [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, 'triangle', 0.3, null, i * 0.15)); break;
      case 'lose': [400, 340, 280, 200].forEach((f, i) => tone(f, 0.35, 'triangle', 0.28, f * 0.9, i * 0.18)); break;
      case 'levelup': tone(600, 0.12, 'square', 0.2, 900); tone(900, 0.2, 'square', 0.18, 1200, 0.1); break;
      default: tone(440, 0.08, 'sine', 0.15); break;
    }
  };
  // Continuous rising tone while charging (0..1 progress).
  A.chargeStart = function () {
    if (!A.ctx || A.muted || !A.available || A._chargeOsc) return;
    try {
      A._chargeOsc = A.ctx.createOscillator();
      A._chargeGain = A.ctx.createGain();
      A._chargeOsc.type = 'sine';
      A._chargeOsc.frequency.value = 160;
      A._chargeGain.gain.value = 0.08;
      A._chargeOsc.connect(A._chargeGain); A._chargeGain.connect(A._sfx || A._master);
      A._chargeOsc.start();
    } catch (e) { A._chargeOsc = null; }
  };
  A.chargeUpdate = function (p) {
    if (A._chargeOsc && A.ctx && !A.muted) {
      try { A._chargeOsc.frequency.value = 160 + p * 560; } catch (e) { /* ignore */ }
    }
  };
  A.chargeStop = function () {
    if (A._chargeOsc) {
      try { A._chargeOsc.stop(); } catch (e) { /* ignore */ }
      A._chargeOsc = null; A._chargeGain = null;
    }
  };

  // ---- Generative procedural music (zero audio files) ----
  // Moods: 'title' (sparse pads), 'calm' (pads + bass + wandering flute),
  // 'boss' (driving pulse + tension stabs). All scheduling is at-time so
  // tempo stays rock-steady regardless of frame rate.
  A._mood = 'title'; A._step = 0; A._nextT = 0; A._timer = null; A._mel = 3;
  A.setMood = function (m) { if (A._mood !== m) A._mood = m; };
  A.setDucked = function (d) {
    if (A._music && A.ctx && !A.muted) {
      try { A._music.gain.value = d ? 0.10 : 0.32; } catch (e) { /* ignore */ }
    }
  };
  A._mtone = function (freq, dur, type, vol, t) {
    if (!A.ctx || A.muted || !A.available) return;
    try {
      const o = A.ctx.createOscillator(), g = A.ctx.createGain();
      o.type = type; o.frequency.value = Math.max(1, freq);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.4, dur * 0.3));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(A._music || A._master);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) { /* ignore */ }
  };
  A._mnoise = function (dur, vol, lowpass, t) {
    if (!A.ctx || A.muted || !A.available) return;
    try {
      const len = Math.max(1, Math.floor(A.ctx.sampleRate * dur));
      const buf = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = A.ctx.createBufferSource(); src.buffer = buf;
      const f = A.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lowpass;
      const g = A.ctx.createGain(); g.gain.value = vol;
      src.connect(f); f.connect(g); g.connect(A._music || A._master);
      src.start(t);
    } catch (e) { /* ignore */ }
  };
  A._sched = function () {
    if (!A.ctx || A.muted || !A.available) return;
    try {
      const now = A.ctx.currentTime;
      if (A._nextT < now - 0.1) A._nextT = now + 0.05; // resync after mute/tab-hide
      const stepDur = A._mood === 'boss' ? 0.26 : (A._mood === 'calm' ? 0.40 : 0.55);
      let guard = 0;
      while (A._nextT < now + 0.4 && guard++ < 12) {
        A._playStep(A._step, A._nextT, A._mood);
        A._nextT += stepDur; A._step++;
      }
    } catch (e) { /* ignore */ }
  };
  A._playStep = function (s, t, mood) {
    const PENTA = [0, 3, 5, 7, 10, 12, 15];
    const ROOTS = [0, -4, 3, -2]; // Am-flavored loop, semitones from A
    const bar = Math.floor(s / 8) % 4, root = ROOTS[bar];
    const f = (semi, base) => base * Math.pow(2, semi / 12);
    if (s % 8 === 0) { // slow pad chord: root + fifth
      A._mtone(f(root, 110), 3.8, 'triangle', 0.055, t);
      A._mtone(f(root + 7, 110), 3.8, 'sine', 0.045, t);
    }
    if (mood === 'boss') {
      A._mtone(f(root, 55), 0.16, 'square', 0.045, t);      // driving pulse
      if (s % 2 === 0) A._mnoise(0.05, 0.04, 6000, t);       // tick
      if (s % 4 === 0) A._mtone(f(root, 55), 0.4, 'sine', 0.10, t); // weight
      if (s % 16 === 14) A._mtone(f(root + 1, 220), 0.35, 'sawtooth', 0.035, t); // tension stab
    } else {
      if (s % 4 === 0) A._mtone(f(root, 55), 0.5, 'sine', 0.09, t); // bass root
      const p = mood === 'calm' ? 0.30 : 0.15;              // wandering flute
      if (Math.random() < p) {
        A._mel += [-2, -1, 1, 2][(Math.random() * 4) | 0];
        A._mel = Math.max(0, Math.min(PENTA.length - 1, A._mel));
        A._mtone(f(root + PENTA[A._mel], 220), 0.55, 'triangle', 0.055, t);
      }
    }
  };
})();

</script>
<script>
/* ===== inlined js/particles.js ===== */
(function () {
  const V = globalThis.VERDANT = globalThis.VERDANT || {};
  // Pooled particles + floating damage numbers + screen shake + hit-stop.
  const P = V.Particles = {};
  const MAX = 320;
  P.create = function () {
    return { list: [], texts: [], trauma: 0, hitstop: 0, slowmo: 0 };
  };
  P.quality = 1; // adaptive spawn scale (0..1), driven by frame-time EMA
  P.spawn = function (G, x, y, opt) {
    opt = opt || {};
    if (opt.ambient && Math.random() > (P.quality || 1)) return; // shed ambience first
    const s = G.particles;
    if (s.list.length >= MAX) s.list.shift();
    const a = (opt.angle !== undefined ? opt.angle : Math.random() * Math.PI * 2);
    const sp = opt.speed !== undefined ? opt.speed : 120;
    s.list.push({
      x, y,
      vx: Math.cos(a) * sp * (0.4 + Math.random() * 0.8) + (opt.vx || 0),
      vy: Math.sin(a) * sp * (0.4 + Math.random() * 0.8) + (opt.vy || 0),
      t: 0, life: opt.life || 0.5,
      size: opt.size || 4, color: opt.color || '#fff',
      grav: opt.grav || 0, shape: opt.shape || 'circle',
    });
  };
  P.burst = function (G, x, y, n, opt) {
    for (let i = 0; i < n; i++) P.spawn(G, x, y, opt);
  };
  P.text = function (G, x, y, txt, color, size) {
    const s = G.particles;
    if (s.texts.length > 40) s.texts.shift();
    s.texts.push({ x, y, txt: String(txt), color: color || '#fff', t: 0, life: 0.9, size: size || 15 });
  };
  P.shake = function (G, amt) {
    G.particles.trauma = Math.min(1, G.particles.trauma + amt);
  };
  P.hitstop = function (G, t) {
    G.particles.hitstop = Math.max(G.particles.hitstop, t);
  };
  P.slowmo = function (G, t) { G.particles.slowmo = Math.max(G.particles.slowmo, t); };
  P.update = function (G, dt) {
    const s = G.particles;
    s.trauma = Math.max(0, s.trauma - dt * 1.6);
    for (let i = s.list.length - 1; i >= 0; i--) {
      const p = s.list[i];
      p.t += dt;
      if (p.t >= p.life) { s.list.splice(i, 1); continue; }
      p.vy += p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= (1 - 2.2 * dt); p.vy *= (1 - 2.2 * dt);
    }
    for (let i = s.texts.length - 1; i >= 0; i--) {
      const t = s.texts[i];
      t.t += dt; t.y -= 46 * dt;
      if (t.t >= t.life) s.texts.splice(i, 1);
    }
  };
  // Ambient life: drifting spores/leaves across the view + arena embers.
  P.ambient = function (G, dt) {
    if (G.state !== 'play' && G.state !== 'title') return;
    if (G.particles.list.length > 260) return;
    const vw = V.Config.canvas.w, vh = V.Config.canvas.h;
    if (Math.random() < dt * 7) {
      P.spawn(G, G.camera.x + Math.random() * vw, G.camera.y + Math.random() * vh, {
        ambient: true, color: Math.random() < 0.55 ? '#a8e08a' : '#ffe9a3',
        speed: 10, life: 3.4, size: 2.5, vx: -12 - Math.random() * 12, vy: 7,
      });
    }
    if (G.bossActive && Math.random() < dt * 18) {
      const L = V.Level, a = Math.random() * Math.PI * 2, d = Math.random() * L.arenaR;
      P.spawn(G, L.arenaCx + Math.cos(a) * d, L.arenaCy + Math.sin(a) * d, {
        ambient: true, color: Math.random() < 0.5 ? '#ff9d4d' : '#ff5d5d',
        speed: 18, life: 0.9, size: 3, vy: -46,
      });
    }
  };
  P.shakeOffset = function (G) {
    const tr = G.particles.trauma;
    if (tr <= 0) return { x: 0, y: 0 };
    const m = tr * tr * 14;
    return { x: (Math.random() * 2 - 1) * m, y: (Math.random() * 2 - 1) * m };
  };
})();

<script>
/* ===== inlined js/entities.js ===== */
(function () {
  const V = globalThis.VERDANT = globalThis.VERDANT || {};
  const E = V.Entities = {};
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  E.makePlayer = function (x, y) {
    const c = V.Config.player;
    return {
      kind: 'player', x, y, vx: 0, vy: 0, r: c.r,
      hp: c.hp, maxhp: c.hp, mp: c.mp, maxmp: c.mp,
      face: -Math.PI / 2, atkCd: 0, charge: -1, dashT: 0, dashCd: 0,
      ifr: 0, flash: 0, swingT: 0, swingCharge: 0, dead: false, moving: false,
    };
  };
  E.makePip = function (x, y) {
    const c = V.Config.pip;
    return { kind: 'pip', x, y, vx: 0, vy: 0, r: c.r, hp: c.hp, maxhp: c.hp, face: 0, fireCd: 1, ko: 0, flash: 0, wob: Math.random() * 6 };
  };
  E.makeMoss = function (x, y) {
    const c = V.Config.moss;
    return { kind: 'moss', x, y, vx: 0, vy: 0, r: c.r, hp: c.hp, maxhp: c.hp, face: 0, atkCd: 0, ko: 0, flash: 0, lungeT: 0 };
  };
  E.makeNib = function (x, y) {
    const c = V.Config.nibblet;
    return { kind: 'nib', x, y, vx: 0, vy: 0, r: c.r, hp: c.hp, maxhp: c.hp, face: 0, touchCd: 0, hopT: Math.random(), flash: 0, wx: x, wy: y, wt: 0 };
  };
  E.makeSpit = function (x, y) {
    const c = V.Config.spitter;
    return { kind: 'spit', x, y, vx: 0, vy: 0, r: c.r, hp: c.hp, maxhp: c.hp, face: 0, fireCd: 1 + Math.random(), flash: 0 };
  };
  E.makeBoss = function (x, y) {
    const c = V.Config.boss;
    return {
      kind: 'boss', x, y, vx: 0, vy: 0, r: c.r, hp: c.hp, maxhp: c.hp,
      face: Math.PI / 2, mode: 'chase', modeT: 0, slamCd: 1.5, slamX: 0, slamY: 0,
      addsSpawned: false, enraged: false, touchCd: 0, flash: 0,
    };
  };
  E.makeBolt = function (x, y, tx, ty, speed, dmg) {
    const a = Math.atan2(ty - y, tx - x);
    return { kind: 'bolt', x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5, dmg, t: 0, life: 1.6 };
  };
  E.makeEnemyOrb = function (x, y, tx, ty, speed, dmg) {
    const a = Math.atan2(ty - y, tx - x);
    return { kind: 'enemyOrb', x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 8, dmg, t: 0, life: 4 };
  };
  E.makePickup = function (kind, x, y) {
    return { kind, x, y, vx: (Math.random() - 0.5) * 90, vy: (Math.random() - 0.5) * 90, t: Math.random() * 6 };
  };

  E.friends = function (G) {
    const out = [];
    if (!G.player.dead) out.push(G.player);
    for (const c of G.companions) if (!c.ko) out.push(c);
    return out;
  };
  E.nearestFriend = function (G, x, y) {
    let best = null, bd = 1e9;
    for (const f of E.friends(G)) {
      const d = Math.hypot(f.x - x, f.y - y);
      if (d < bd) { bd = d; best = f; }
    }
    return best;
  };
  E.nearestFoe = function (G, x, y, maxD) {
    let best = null, bd = maxD === undefined ? 1e9 : maxD;
    for (const e of G.enemies) {
      if (e.dead) continue;
      const d = Math.hypot(e.x - x, e.y - y);
      if (d < bd) { bd = d; best = e; }
    }
    if (G.boss && !G.boss.dead && G.bossActive) {
      const d = Math.hypot(G.boss.x - x, G.boss.y - y);
      if (d < bd) { bd = d; best = G.boss; }
    }
    return best;
  };
  function lerpAngle(a, b, t) {
    let d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return a + d * Math.min(1, Math.max(0, t));
  }
  function moveToward(G, e, tx, ty, speed, dt) {
    const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
    if (d < 1) return d;
    const s = Math.min(d, speed * dt);
    V.Level.moveCollide(G, e, (dx / d) * s, (dy / d) * s);
    e.face = lerpAngle(e.face, Math.atan2(dy, dx), dt * 10); // eased turns, no snapping
    return d;
  }

  E.update = function (G, dt) {
    for (const c of G.companions) E.updateCompanion(G, c, dt);
    for (let i = G.enemies.length - 1; i >= 0; i--) {
      const e = G.enemies[i];
      if (e.dead) { G.enemies.splice(i, 1); continue; }
      if (e.kind === 'nib') E.updateNib(G, e, dt);
      else if (e.kind === 'spit') E.updateSpit(G, e, dt);
      e.flash = Math.max(0, e.flash - dt);
    }
    if (G.boss && !G.boss.dead && G.bossActive) { E.updateBoss(G, G.boss, dt); G.boss.flash = Math.max(0, G.boss.flash - dt); }
    E.updateProjectiles(G, dt);
    E.updatePickups(G, dt);
  };

  E.updateCompanion = function (G, c, dt) {
    c.flash = Math.max(0, c.flash - dt);
    if (c.ko) {
      c.ko -= dt;
      if (c.ko <= 0) {
        c.ko = 0; c.hp = Math.ceil(c.maxhp / 2);
        c.x = G.player.x + 30; c.y = G.player.y + 40;
        V.Particles.burst(G, c.x, c.y, 14, { color: '#9fe8ff', speed: 160, life: 0.6 });
        V.Particles.text(G, c.x, c.y - 24, 'Revived!', '#9fe8ff', 15);
        V.Audio.sfx('revive');
      }
      return;
    }
    const cautious = G.flags.stance === 'cautious';
    if (c.kind === 'pip') {
      const cfg = V.Config.pip;
      c.wob += dt * 5; c.fireCd -= dt;
      const engage = cautious ? cfg.cautiousEngage : cfg.engage;
      const foe = E.nearestFoe(G, c.x, c.y, engage + 120);
      const anchor = { x: G.player.x - 52, y: G.player.y + 44 };
      if (foe && Math.hypot(foe.x - c.x, foe.y - c.y) < engage) {
        const d = Math.hypot(foe.x - c.x, foe.y - c.y);
        const kite = cautious ? cfg.kite + 70 : cfg.kite;
        c.face = Math.atan2(foe.y - c.y, foe.x - c.x);
        if (d > kite + 50) moveToward(G, c, foe.x, foe.y, cfg.speed, dt);
        else if (d < kite - 50) moveToward(G, c, c.x * 2 - foe.x, c.y * 2 - foe.y, cfg.speed * 0.9, dt);
        else { // strafe orbit
          const a = Math.atan2(c.y - foe.y, c.x - foe.x) + dt * 1.2;
          moveToward(G, c, foe.x + Math.cos(a) * kite, foe.y + Math.sin(a) * kite, cfg.speed * 0.6, dt);
          c.face = Math.atan2(foe.y - c.y, foe.x - c.x);
        }
        if (c.fireCd <= 0 && d < engage + 60) {
          c.fireCd = cfg.fireCd;
          G.projectiles.push(E.makeBolt(c.x, c.y, foe.x, foe.y, cfg.boltSpeed, cfg.boltDmg));
          V.Audio.sfx('swing');
          V.Particles.spawn(G, c.x, c.y, { color: '#c8ff9e', speed: 60, life: 0.25, size: 5 });
        }
      } else {
        const d = Math.hypot(anchor.x - c.x, anchor.y - c.y);
        if (d > cfg.followDist) moveToward(G, c, anchor.x, anchor.y, cfg.speed, dt);
        c.face = Math.atan2(G.player.y - c.y, G.player.x - c.x);
      }
    } else { // moss: melee companion
      const cfg = V.Config.moss;
      c.atkCd -= dt; c.lungeT = Math.max(0, c.lungeT - dt);
      const engage = cautious ? cfg.cautiousEngage : cfg.engage;
      const foe = E.nearestFoe(G, c.x, c.y, engage);
      const anchor = { x: G.player.x + 52, y: G.player.y + 44 };
      if (foe) {
        const d = moveToward(G, c, foe.x, foe.y, cfg.speed, dt);
        if (d < 40 && c.atkCd <= 0) {
          c.atkCd = cfg.atkCd; c.lungeT = 0.18;
          V.Combat.hurt(G, foe, cfg.dmg, c, { kx: Math.cos(c.face) * 160, ky: Math.sin(c.face) * 160 });
          V.Particles.burst(G, foe.x, foe.y, 5, { color: '#ffd76e', speed: 150, life: 0.3, size: 4 });
          V.Audio.sfx('swing');
        }
      } else {
        const d = Math.hypot(anchor.x - c.x, anchor.y - c.y);
        if (d > cfg.followDist) moveToward(G, c, anchor.x, anchor.y, cfg.speed, dt);
        c.face = Math.atan2(G.player.y - c.y, G.player.x - c.x);
      }
    }
  };

  E.updateNib = function (G, e, dt) {
    const cfg = V.Config.nibblet;
    e.touchCd -= dt; e.hopT += dt * 9;
    const f = E.nearestFriend(G, e.x, e.y);
    if (f && Math.hypot(f.x - e.x, f.y - e.y) < cfg.aggro) {
      moveToward(G, e, f.x, f.y, cfg.speed, dt);
      const d = Math.hypot(f.x - e.x, f.y - e.y);
      if (d < e.r + f.r + 4 && e.touchCd <= 0) {
        e.touchCd = cfg.touchCd;
        V.Combat.hurtFriend(G, f, cfg.dmg, e);
      }
    } else { // wander around home
      e.wt -= dt;
      if (e.wt <= 0) { e.wt = 1 + Math.random() * 2; e.wx = e.x + (Math.random() - 0.5) * 200; e.wy = e.y + (Math.random() - 0.5) * 200; }
      moveToward(G, e, e.wx, e.wy, cfg.speed * 0.3, dt);
    }
  };

  E.updateSpit = function (G, e, dt) {
    const cfg = V.Config.spitter;
    e.fireCd -= dt;
    const f = E.nearestFriend(G, e.x, e.y);
    if (!f) return;
    const d = Math.hypot(f.x - e.x, f.y - e.y);
    e.face = Math.atan2(f.y - e.y, f.x - e.x);
    if (d < cfg.range && e.fireCd <= 0) {
      e.fireCd = cfg.orbCd;
      G.projectiles.push(E.makeEnemyOrb(e.x, e.y, f.x, f.y, cfg.orbSpeed, cfg.dmg));
      V.Particles.spawn(G, e.x, e.y, { color: '#c77dff', speed: 80, life: 0.3, size: 6 });
    }
  };

  E.updateBoss = function (G, b, dt) {
    const cfg = V.Config.boss;
    const frac = b.hp / b.maxhp;
    if (!b.enraged && frac < 0.25) {
      b.enraged = true;
      V.Audio.sfx('bossRoar');
      V.Particles.text(G, b.x, b.y - 70, 'GNARLMAW ENRAGED', '#ff5d5d', 22);
      V.Particles.burst(G, b.x, b.y, 26, { color: '#ff5d5d', speed: 260, life: 0.7 });
    }
    if (!b.addsSpawned && frac <= 0.5) {
      b.addsSpawned = true;
      b.mode = 'summon'; b.modeT = 1.2;
      V.Audio.sfx('bossRoar');
      V.Particles.text(G, b.x, b.y - 70, 'Gnarlmaw calls its brood!', '#ffb84d', 18);
      const L = V.Level;
      [[-120, 0], [120, 0]].forEach(([ox, oy]) => {
        const n = E.makeNib(L.arenaCx + ox, L.arenaCy + 120 + oy);
        G.enemies.push(n);
        V.Particles.burst(G, n.x, n.y, 12, { color: '#7ee06e', speed: 180, life: 0.5 });
      });
      return;
    }
    b.touchCd -= dt; b.slamCd -= dt;
    const speed = b.enraged ? cfg.enragedSpeed : cfg.speed;
    const f = E.nearestFriend(G, b.x, b.y) || G.player;
    const teleLen = cfg.telegraph * (b.enraged ? 0.75 : 1);
    if (b.mode === 'chase') {
      moveToward(G, b, f.x, f.y, speed, dt);
      const d = Math.hypot(f.x - b.x, f.y - b.y);
      if (d < b.r + f.r + 6 && b.touchCd <= 0) { b.touchCd = cfg.touchCd; V.Combat.hurtFriend(G, f, cfg.contactDmg, b); }
      const cd = b.enraged ? cfg.enragedCd : cfg.slamCd;
      if (d < 260 && b.slamCd <= 0) {
        b.mode = 'windup'; b.modeT = teleLen;
        b.slamX = f.x; b.slamY = f.y;
        V.Audio.sfx('bossRoar');
      }
    } else if (b.mode === 'windup') {
      b.modeT -= dt;
      b.face = Math.atan2(b.slamY - b.y, b.slamX - b.x);
      if (b.modeT <= 0) {
        b.mode = 'recover'; b.modeT = 0.7;
        const cd = b.enraged ? cfg.enragedCd : cfg.slamCd;
        b.slamCd = cd;
        V.Audio.sfx('slam');
        V.Particles.shake(G, 0.7);
        G.hitFlash = Math.max(G.hitFlash || 0, 0.7);
        V.Particles.burst(G, b.slamX, b.slamY, 24, { color: '#8a5a2b', speed: 320, life: 0.6, size: 6 });
        V.Particles.burst(G, b.slamX, b.slamY, 12, { color: '#ff5d5d', speed: 200, life: 0.5, size: 5 });
        for (const fr of E.friends(G)) {
          if (Math.hypot(fr.x - b.slamX, fr.y - b.slamY) < cfg.slamRadius + fr.r * 0.5)
            V.Combat.hurtFriend(G, fr, cfg.slamDmg, b);
        }
      }
    } else if (b.mode === 'recover') {
      b.modeT -= dt;
      if (b.modeT <= 0) b.mode = 'chase';
    } else if (b.mode === 'summon') {
      b.modeT -= dt;
      if (b.modeT <= 0) b.mode = 'chase';
    }
  };

  E.updateProjectiles = function (G, dt) {
    const L = V.Level;
    for (let i = G.projectiles.length - 1; i >= 0; i--) {
      const p = G.projectiles[i];
      p.t += dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      let kill = p.t >= p.life;
      if (!kill && L.pointBlocked(G, p.x, p.y)) kill = true;
      if (!kill && p.kind === 'bolt') {
        const foes = G.boss && !G.boss.dead && G.bossActive ? G.enemies.concat([G.boss]) : G.enemies;
        for (const e of foes) {
          if (e.dead) continue;
          if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r) {
            V.Combat.hurt(G, e, p.dmg, G.player, { kx: p.vx * 0.4, ky: p.vy * 0.4 });
            kill = true; break;
          }
        }
      } else if (!kill && p.kind === 'enemyOrb') {
        for (const f of E.friends(G)) {
          if (Math.hypot(f.x - p.x, f.y - p.y) < f.r + p.r) {
            V.Combat.hurtFriend(G, f, p.dmg, null);
            V.Particles.burst(G, p.x, p.y, 8, { color: '#c77dff', speed: 140, life: 0.4 });
            kill = true; break;
          }
        }
      }
      if (kill) G.projectiles.splice(i, 1);
    }
  };

  E.updatePickups = function (G, dt) {
    const p = G.player;
    for (let i = G.pickups.length - 1; i >= 0; i--) {
      const o = G.pickups[i];
      o.t += dt;
      o.x += o.vx * dt; o.y += o.vy * dt;
      o.vx *= (1 - 3 * dt); o.vy *= (1 - 3 * dt);
      const d = Math.hypot(p.x - o.x, p.y - o.y);
      if (d < 90 && !p.dead) { o.x += (p.x - o.x) / d * 220 * dt; o.y += (p.y - o.y) / d * 220 * dt; }
      if (d < 24 && !p.dead) {
        const cfg = V.Config.orbs;
        if (o.kind === 'orb-hp') {
          p.hp = Math.min(p.maxhp, p.hp + cfg.hpAmt);
          V.Particles.text(G, p.x, p.y - 26, '+' + cfg.hpAmt + ' HP', '#7ee06e', 14);
        } else if (o.kind === 'orb-mp') {
          p.mp = Math.min(p.maxmp, p.mp + cfg.mpAmt);
          V.Particles.text(G, p.x, p.y - 26, '+' + cfg.mpAmt + ' MP', '#5db9ff', 14);
        } else if (o.kind === 'fragment') {
          V.Main.winGame(G);
          G.pickups.splice(i, 1);
          continue;
        }
        V.Audio.sfx('orb');
        V.Particles.burst(G, o.x, o.y, 8, { color: '#fff', speed: 120, life: 0.4 });
        G.pickups.splice(i, 1);
      }
    }
  };
})();

</script>
<script>
/* ===== inlined js/combat.js ===== */
(function () {
  const V = globalThis.VERDANT = globalThis.VERDANT || {};
  const C = V.Combat = {};
  const I = () => V.Input;

  C.blade = function (G) {
    const g = V.Config.bladeGrowth, h = G.stats.hits;
    let lvl = 1;
    if (h >= g.hitsToLevel[2]) lvl = 3; else if (h >= g.hitsToLevel[1]) lvl = 2;
    return { level: lvl, mult: g.dmgMult[lvl - 1], rangeBonus: g.rangeBonus[lvl - 1] };
  };

  // Player movement / dash / charge / attack. Called only in 'play' state.
  C.updatePlayer = function (G, dt) {
    const p = G.player, cfg = V.Config.player, inp = I();
    if (p.dead) return;
    p.atkCd -= dt; p.ifr -= dt; p.dashCd -= dt; p.flash = Math.max(0, p.flash - dt);
    p.swingT = Math.max(0, p.swingT - dt);
    p.mp = Math.min(p.maxmp, p.mp + cfg.mpRegen * dt);

    const ax = inp.axis();
    p.moving = !!(ax.x || ax.y);

    // Dash
    if (inp.pressed('dash') && p.dashCd <= 0 && p.dashT <= 0) {
      if (p.moving) p.face = Math.atan2(ax.y, ax.x);
      p.dashT = cfg.dashTime; p.dashCd = cfg.dashCd;
      p.charge = -1; V.Audio.chargeStop();
      V.Audio.sfx('dash');
      V.Particles.burst(G, p.x, p.y, 8, { color: '#cfe8ff', speed: 120, life: 0.3, size: 4 });
    }
    if (p.dashT > 0) {
      p.dashT -= dt;
      p.ifr = Math.max(p.ifr, 0.05);
      V.Level.moveCollide(G, p, Math.cos(p.face) * cfg.dashSpeed * dt, Math.sin(p.face) * cfg.dashSpeed * dt);
      V.Particles.spawn(G, p.x, p.y, { color: '#cfe8ff', speed: 20, life: 0.3, size: 8 });
      return;
    }

    const atkHeld = inp.down('attack') || inp.mouse.down;
    const atkPressed = inp.pressed('attack') || inp.mouse.clicked;
    // Click attacks aim at the cursor.
    if (inp.mouse.clicked && p.charge < 0) {
      const wx = inp.mouse.x + G.camera.x, wy = inp.mouse.y + G.camera.y;
      if (Math.hypot(wx - p.x, wy - p.y) > 4) p.face = Math.atan2(wy - p.y, wx - p.x);
    }

    if (p.charge >= 0) {
      // Charging: moving cancels, release fires.
      if (p.moving) {
        p.charge = -1; V.Audio.chargeStop();
      } else {
        p.charge = Math.min(1, p.charge + dt / cfg.chargeTime);
        V.Audio.chargeUpdate(p.charge);
        if (!atkHeld) { C.releaseCharge(G); }
      }
    } else if (atkPressed && atkHeld && p.atkCd <= 0) {
      // Begin charge on press; quick tap = quick slash handled on early release.
      p.charge = 0;
      V.Audio.chargeStart();
    }

    if (p.charge < 0 && p.moving) {
      const sp = cfg.speed * (p.swingT > 0 ? 0.45 : 1);
      let want = Math.atan2(ax.y, ax.x), d = want - p.face; // eased facing
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      p.face += d * Math.min(1, dt * 14);
      V.Level.moveCollide(G, p, ax.x * sp * dt, ax.y * sp * dt);
    }
  };

  C.releaseCharge = function (G) {
    const p = G.player, cfg = V.Config.player;
    const ch = Math.max(0, p.charge);
    p.charge = -1;
    V.Audio.chargeStop();
    p.atkCd = cfg.attackCd;
    p.swingT = 0.22; p.swingCharge = ch;
    const blade = C.blade(G);
    const dmg = cfg.attackDmg * blade.mult * (1 + ch * 2); // 1x..3x
    const range = cfg.attackRange + blade.rangeBonus + ch * 46;
    const arc = cfg.attackArc + ch * 0.7;
    V.Audio.sfx(ch > 0.55 ? 'chargedHit' : 'swing');
    if (ch > 0.55) {
      V.Particles.shake(G, 0.25 + ch * 0.3); V.Particles.hitstop(G, 0.05 + ch * 0.05);
      G.hitFlash = Math.max(G.hitFlash || 0, 0.45);
    }
    C.meleeArc(G, p, p.face, range, arc, dmg, ch);
  };

  // Arc melee vs enemies, boss, and props (grass/chest/bells).
  C.meleeArc = function (G, attacker, face, range, arc, dmg, charge) {
    charge = charge || 0;
    let hitAny = false;
    const foes = G.enemies.slice();
    if (G.boss && !G.boss.dead && G.bossActive) foes.push(G.boss);
    for (const e of foes) {
      if (e.dead) continue;
      const dx = e.x - attacker.x, dy = e.y - attacker.y;
      const d = Math.hypot(dx, dy);
      if (d > range + e.r) continue;
      let da = Math.atan2(dy, dx) - face;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      if (Math.abs(da) > arc / 2 + Math.atan2(e.r, Math.max(20, d))) continue;
      hitAny = true;
      const wasCharge = attacker.kind === 'player' && charge >= 0.5;
      C.hurt(G, e, dmg, attacker, {
        kx: (dx / (d || 1)) * (140 + charge * 320),
        ky: (dy / (d || 1)) * (140 + charge * 320),
        isCharge: wasCharge,
      });
    }
    for (const pr of G.props) {
      if (pr.gone) continue;
      const dx = pr.x - attacker.x, dy = pr.y - attacker.y;
      const d = Math.hypot(dx, dy);
      if (d > range + (pr.r || 16)) continue;
      let da = Math.atan2(dy, dx) - face;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      if (Math.abs(da) > arc / 2 + 0.35) continue;
      hitAny = true;
      V.Level.hitProp(G, pr, attacker.kind === 'player' ? charge : 0);
    }
    if (hitAny && attacker.kind === 'player') {
      const before = C.blade(G).level;
      G.stats.hits++;
      const after = C.blade(G).level;
      if (after > before) {
        V.Audio.sfx('levelup');
        V.Particles.text(G, attacker.x, attacker.y - 34, 'Thornblade Lv' + after + '!', '#ffd76e', 18);
      }
    }
    // Arc swoosh particles
    V.Particles.spawn(G, attacker.x + Math.cos(face) * range * 0.6, attacker.y + Math.sin(face) * range * 0.6,
      { color: charge > 0.5 ? '#ffe9a3' : '#e8f4ff', speed: 60, life: 0.2, size: 10 });
    return hitAny;
  };

  // Damage to a foe (enemy or boss).
  C.hurt = function (G, e, dmg, src, opt) {
    if (!e || e.dead) return;
    opt = opt || {};
    dmg = Math.max(1, Math.round(dmg));
    e.hp -= dmg; e.flash = 0.12;
    if (opt.kx || opt.ky) {
      const kb = e.kind === 'boss' ? 0.08 : 1;
      V.Level.moveCollide(G, e, (opt.kx || 0) * 0.06 * kb, (opt.ky || 0) * 0.06 * kb);
    }
    V.Particles.text(G, e.x + (Math.random() - 0.5) * 20, e.y - e.r - 8, dmg,
      opt.isCharge ? '#ffd76e' : '#ffffff', opt.isCharge ? 19 : 14);
    V.Particles.burst(G, e.x, e.y, opt.isCharge ? 10 : 5, {
      color: opt.isCharge ? '#ffd76e' : '#ff9d6e', speed: 170, life: 0.35, size: 4,
    });
    if (src && src.kind === 'player') V.Audio.sfx('hit');
    if (e.hp <= 0) {
      e.hp = 0; e.dead = true;
      if (e.kind === 'boss') { V.Main.bossDown(G); return; }
      if (opt.isCharge) G.stats.chargeKills++;
      G.stats.kills++;
      V.Audio.sfx('enemyDie');
      V.Particles.burst(G, e.x, e.y, 16, { color: '#7ee06e', speed: 220, life: 0.55 });
      if (Math.random() < 0.35)
        G.pickups.push(V.Entities.makePickup(Math.random() < 0.55 ? 'orb-hp' : 'orb-mp', e.x, e.y));
      V.Level.onEnemyDown(G, e);
    }
  };

  // Damage to player-side actor (player or companion).
  C.hurtFriend = function (G, f, dmg, src) {
    if (!f || G.state !== 'play') return;
    dmg = Math.max(1, Math.round(dmg));
    if (f.kind === 'player') {
      if (f.dead || f.ifr > 0 || f.dashT > 0) return;
      f.hp -= dmg; f.ifr = V.Config.player.iframes; f.flash = 0.2;
      f.charge = -1; V.Audio.chargeStop();
      G.stats.damageTaken += dmg;
      V.Audio.sfx('hurt');
      V.Particles.shake(G, 0.35);
      G.hitFlash = Math.max(G.hitFlash || 0, 0.3);
      V.Particles.text(G, f.x, f.y - 28, '-' + dmg, '#ff6e6e', 16);
      V.Particles.burst(G, f.x, f.y, 10, { color: '#ff6e6e', speed: 200, life: 0.4 });
      if (f.hp <= 0) { f.hp = 0; f.dead = true; V.Main.playerDown(G); }
    } else {
      if (f.ko) return;
      f.hp -= dmg; f.flash = 0.15;
      V.Particles.text(G, f.x, f.y - 24, '-' + dmg, '#ff9d9d', 13);
      if (f.hp <= 0) {
        f.hp = 0; f.ko = f.kind === 'pip' ? V.Config.pip.revive : V.Config.moss.revive;
        V.Particles.text(G, f.x, f.y - 30, 'KO! (' + Math.round(f.ko) + 's)', '#c9b8ff', 14);
        V.Particles.burst(G, f.x, f.y, 14, { color: '#c9b8ff', speed: 180, life: 0.5 });
      }
    }
  };
})();

</script>
<script>
/* ===== inlined js/magic.js ===== */
(function () {
  const V = globalThis.VERDANT = globalThis.VERDANT || {};
  const M = V.Magic = {};
  M.SPELLS = [
    { id: 'tide', name: 'Tide Lash', desc: 'Piercing line blast', color: '#5db9ff' },
    { id: 'mend', name: 'Mend Dew', desc: 'Heal 40% HP', color: '#7ee06e' },
    { id: 'cinder', name: 'Cinder Bloom', desc: 'AoE burn (DoT)', color: '#ff9d4d', needsEmber: true },
  ];
  M.power = function (G) {
    const c = V.Config.magic;
    return 1 + Math.min(c.powerMax, G.stats.casts * c.powerPerCast);
  };
  M.unlocked = function (G, id) {
    if (id === 'cinder') return !!G.flags.ember;
    return true;
  };
  M.cost = function (id) { return V.Config.magic[id].cost; };
  M.canCast = function (G, id) {
    return M.unlocked(G, id) && G.player.mp >= M.cost(id) && !G.player.dead && G.state === 'play';
  };
  M.cast = function (G, id) {
    if (!M.canCast(G, id)) return false;
    const p = G.player, cfg = V.Config.magic, pow = M.power(G);
    p.mp -= cfg[id].cost;
    G.stats.casts++;
    G.castVignette = 1.0;
    V.Particles.slowmo(G, 0.35);
    if (id === 'tide') {
      V.Audio.sfx('tide');
      const dmg = cfg.tide.dmg * pow;
      const fx = p.x + Math.cos(p.face) * cfg.tide.len / 2, fy = p.y + Math.sin(p.face) * cfg.tide.len / 2;
      G.effects.push({ kind: 'tide', x: p.x, y: p.y, face: p.face, len: cfg.tide.len, width: cfg.tide.width, t: 0, life: 0.35 });
      V.Particles.burst(G, fx, fy, 20, { color: '#5db9ff', speed: 260, life: 0.5 });
      const foes = G.enemies.slice();
      if (G.boss && !G.boss.dead && G.bossActive) foes.push(G.boss);
      for (const e of foes) {
        if (e.dead) continue;
        const rx = e.x - p.x, ry = e.y - p.y;
        const along = rx * Math.cos(p.face) + ry * Math.sin(p.face);
        const side = Math.abs(-rx * Math.sin(p.face) + ry * Math.cos(p.face));
        if (along > -10 && along < cfg.tide.len + e.r && side < cfg.tide.width / 2 + e.r)
          V.Combat.hurt(G, e, dmg, p, { kx: Math.cos(p.face) * 260, ky: Math.sin(p.face) * 260 });
      }
    } else if (id === 'mend') {
      V.Audio.sfx('mend');
      const amt = Math.round(p.maxhp * cfg.mend.healFrac);
      p.hp = Math.min(p.maxhp, p.hp + amt);
      for (const c of G.companions) if (!c.ko) c.hp = Math.min(c.maxhp, c.hp + Math.round(c.maxhp * cfg.mend.healFrac));
      V.Particles.text(G, p.x, p.y - 30, '+' + amt + ' HP', '#7ee06e', 18);
      V.Particles.burst(G, p.x, p.y, 22, { color: '#7ee06e', speed: 130, life: 0.8, vy: -60 });
      G.effects.push({ kind: 'mend', x: p.x, y: p.y, t: 0, life: 0.8 });
    } else if (id === 'cinder') {
      V.Audio.sfx('cinder');
      const tx = p.x + Math.cos(p.face) * 170, ty = p.y + Math.sin(p.face) * 170;
      G.effects.push({
        kind: 'cinder', x: tx, y: ty, r: cfg.cinder.radius, t: 0,
        life: 1.2 + cfg.cinder.dotTime, tick: 0, dmg: cfg.cinder.dmg * pow,
        dot: cfg.cinder.dot * pow, hitDone: false,
      });
      V.Particles.shake(G, 0.4);
      V.Particles.burst(G, tx, ty, 30, { color: '#ff9d4d', speed: 300, life: 0.7 });
    }
    return true;
  };
  M.update = function (G, dt) {
    const cfg = V.Config.magic;
    for (let i = G.effects.length - 1; i >= 0; i--) {
      const e = G.effects[i];
      e.t += dt;
      if (e.kind === 'cinder') {
        // Initial blast
        if (!e.hitDone && e.t > 0.08) {
          e.hitDone = true;
          const foes = G.enemies.slice();
          if (G.boss && !G.boss.dead && G.bossActive) foes.push(G.boss);
          for (const f of foes) {
            if (f.dead) continue;
            if (Math.hypot(f.x - e.x, f.y - e.y) < e.r + f.r) {
              V.Combat.hurt(G, f, e.dmg, G.player, { kx: (f.x - e.x) * 3, ky: (f.y - e.y) * 3 });
              f.burnT = cfg.cinder.dotTime; f.burnDps = e.dot;
            }
          }
        }
        // Embers + apply burn tick damage
        if (Math.random() < 0.5)
          V.Particles.spawn(G, e.x + (Math.random() - 0.5) * e.r * 1.6, e.y + (Math.random() - 0.5) * e.r * 1.2,
            { color: Math.random() < 0.5 ? '#ff9d4d' : '#ff5d5d', speed: 60, life: 0.5, size: 5, vy: -70 });
        e.tick -= dt;
        if (e.tick <= 0 && e.t > 0.5) {
          e.tick = 1.0;
          const foes = G.enemies.slice();
          if (G.boss && !G.boss.dead && G.bossActive) foes.push(G.boss);
          for (const f of foes) {
            if (f.dead || !f.burnT || f.burnT <= 0) continue;
            if (Math.hypot(f.x - e.x, f.y - e.y) < e.r + f.r + 40) {
              f.burnT -= 1;
              V.Combat.hurt(G, f, f.burnDps || e.dot, G.player, {});
              V.Particles.spawn(G, f.x, f.y - 10, { color: '#ff9d4d', speed: 70, life: 0.4, size: 5, vy: -60 });
            }
          }
        }
      }
      if (e.t >= e.life) G.effects.splice(i, 1);
    }
  };
})();

<script>
/* ===== inlined js/ringmenu.js ===== */
(function () {
  const V = globalThis.VERDANT = globalThis.VERDANT || {};
  // Radial ring menu. While open the world is paused (main skips world update).
  const R = V.Ring = {};
  R.create = function () {
    return { open: false, anim: 0, sel: 0, menu: 'root', msg: '', msgT: 0 };
  };
  R.options = function (G) {
    const r = G.ring;
    if (r.menu === 'magic') {
      const opts = V.Magic.SPELLS.map((s) => {
        const locked = !V.Magic.unlocked(G, s.id);
        const afford = G.player.mp >= V.Magic.cost(s.id);
        return {
          id: 'spell:' + s.id, label: s.name, sub: locked ? 'Locked — find Ember Seed' : (V.Magic.cost(s.id) + ' MP'),
          color: s.color, disabled: locked || !afford,
        };
      });
      opts.push({ id: 'back', label: 'Back', sub: '', color: '#c9b8ff' });
      return opts;
    }
    return [
      { id: 'magic', label: 'Magic', sub: G.player.mp + ' MP', color: '#5db9ff' },
      { id: 'stance', label: 'Allies: ' + (G.flags.stance === 'cautious' ? 'Cautious' : 'Aggressive'), sub: 'Toggle tactics', color: '#7ee06e' },
      { id: 'dew', label: 'Dew Vial ×' + G.flags.vials, sub: 'Heal 30% HP', color: '#9fe8ff', disabled: G.flags.vials <= 0 },
      { id: 'resume', label: 'Resume', sub: '', color: '#e8e0c8' },
    ];
  };
  R.toggle = function (G, open) {
    const r = G.ring;
    const want = open === undefined ? !r.open : open;
    if (want === r.open) return;
    r.open = want; r.menu = 'root'; r.sel = 0; r.msg = ''; r.msgT = 0;
    r._mx = V.Input.mouse.x; r._my = V.Input.mouse.y;
    V.Audio.sfx('ring');
  };
  R.say = function (G, msg) { G.ring.msg = msg; G.ring.msgT = 1.6; };
  R.activate = function (G, opt) {
    if (!opt || opt.disabled) { R.say(G, opt && opt.id.indexOf('spell:') === 0 ? 'Cannot cast that now' : 'Nothing to use'); return; }
    const id = opt.id;
    if (id === 'resume') { R.toggle(G, false); return; }
    if (id === 'back') { G.ring.menu = 'root'; G.ring.sel = 0; V.Audio.sfx('select'); return; }
    if (id === 'magic') { G.ring.menu = 'magic'; G.ring.sel = 0; V.Audio.sfx('select'); return; }
    if (id === 'stance') {
      G.flags.stance = G.flags.stance === 'cautious' ? 'aggro' : 'cautious';
      V.Audio.sfx('select');
      R.say(G, G.flags.stance === 'cautious' ? 'Allies will hang back' : 'Allies will press the attack');
      return;
    }
    if (id === 'dew') {
      const p = G.player;
      if (p.hp >= p.maxhp) { R.say(G, 'Already at full health'); return; }
      G.flags.vials--;
      const amt = Math.round(p.maxhp * V.Config.dewVialHealFrac);
      p.hp = Math.min(p.maxhp, p.hp + amt);
      V.Audio.sfx('mend');
      V.Particles.text(G, p.x, p.y - 30, '+' + amt + ' HP', '#9fe8ff', 18);
      V.Particles.burst(G, p.x, p.y, 16, { color: '#9fe8ff', speed: 150, life: 0.6 });
      R.toggle(G, false);
      return;
    }
    if (id.indexOf('spell:') === 0) {
      const sid = id.slice(6);
      if (V.Magic.cast(G, sid)) { R.toggle(G, false); }
      else R.say(G, 'Cannot cast that now');
      return;
    }
  };
  R.update = function (G, dt) {
    const r = G.ring, inp = V.Input;
    r.anim = Math.min(1, Math.max(0, r.anim + (r.open ? dt * 6 : -dt * 8)));
    r.msgT = Math.max(0, r.msgT - dt);
    if (!r.open) return;
    const opts = R.options(G);
    // Keyboard nav
    if (inp.pressed('up') || inp.pressed('left')) { r.sel = (r.sel + opts.length - 1) % opts.length; V.Audio.sfx('select'); }
    if (inp.pressed('down') || inp.pressed('right')) { r.sel = (r.sel + 1) % opts.length; V.Audio.sfx('select'); }
    if (inp.pressed('ring') || inp.pressed('cancel')) {
      if (r.menu === 'magic') { r.menu = 'root'; r.sel = 0; }
      else R.toggle(G, false);
      return;
    }
    // Mouse nav: hover selects by angle only while the mouse is moving,
    // so a resting cursor never fights keyboard navigation.
    const vw = V.Config.canvas.w, vh = V.Config.canvas.h;
    const cx = vw / 2, cy = vh / 2;
    if (inp.mouse.x !== r._mx || inp.mouse.y !== r._my) {
      r._mx = inp.mouse.x; r._my = inp.mouse.y;
      const dx = inp.mouse.x - cx, dy = inp.mouse.y - cy;
      if (Math.hypot(dx, dy) > 40) {
        let a = Math.atan2(dy, dx) + Math.PI / 2;
        if (a < 0) a += Math.PI * 2;
        r.sel = Math.floor(a / (Math.PI * 2) * opts.length) % opts.length;
      }
    }
    if (inp.pressed('confirm') || inp.mouse.clicked) R.activate(G, opts[r.sel]);
  };
})();

</script>
<script>
/* ===== inlined js/level.js ===== */
(function () {
  const V = globalThis.VERDANT = globalThis.VERDANT || {};
  const L = V.Level = {};
  // Key geography (world 2600x1800, y grows downward, north = -y).
  L.start = { x: 1300, y: 1620 };
  L.c1 = { x: 1300, y: 1420, r: 240 };
  L.c2 = { x: 640, y: 940, r: 300 };
  L.c3 = { x: 1960, y: 940, r: 300 };
  L.bridge = { x: 1300, y: 600 };
  L.bellPos = [{ x: 1020, y: 400 }, { x: 1580, y: 400 }];
  L.arenaCx = 1300; L.arenaCy = 150; L.arenaR = 300;
  L.gateRect = { x: 880, y: 262, w: 840, h: 34 };       // bramble gate (bells)
  L.tutGateRect = { x: 1060, y: 1252, w: 480, h: 30 };  // tutorial brambles

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function inSafe(px, py) {
    const zones = [
      [L.start.x, L.start.y, 200], [L.c1.x, L.c1.y, 300], [L.c2.x, L.c2.y, 350],
      [L.c3.x, L.c3.y, 350], [L.bridge.x, L.bridge.y, 260], [1300, 400, 300],
      [L.arenaCx, L.arenaCy, 380],
    ];
    for (const [zx, zy, zr] of zones) if (Math.hypot(px - zx, py - zy) < zr) return true;
    if (px > 1120 && px < 1480 && py > 280 && py < 1680) return true;  // N-S path
    if (py > 780 && py < 1100 && px > 380 && px < 2220) return true;   // E-W path
    return false;
  }

  L.create = function (G) {
    const W = V.Config.world, rnd = mulberry32(1337);
    const lv = G.level = {
      obstacles: [], decor: { trees: [], rocks: [], flowers: [], fireflies: [] },
      encA: 0, encB: 0, ambush: 0, tutorialNib: null,
      bellsRung: 0, gateOpen: false, tutGateOpen: false,
      bossStarted: false, visited: {},
    };
    // Border tree walls
    for (let x = 40; x < W.w; x += 56) {
      lv.decor.trees.push({ x: x + rnd() * 20, y: 30 + rnd() * 30, s: 0.9 + rnd() * 0.5 });
      lv.decor.trees.push({ x: x + rnd() * 20, y: W.h - 30 - rnd() * 30, s: 0.9 + rnd() * 0.5 });
    }
    for (let y = 60; y < W.h; y += 56) {
      lv.decor.trees.push({ x: 30 + rnd() * 30, y, s: 0.9 + rnd() * 0.5 });
      lv.decor.trees.push({ x: W.w - 30 - rnd() * 30, y, s: 0.9 + rnd() * 0.5 });
    }
    // Scattered obstacles (trees/rocks) outside safe zones
    let placed = 0, guard = 0;
    while (placed < 130 && guard++ < 3000) {
      const x = 120 + rnd() * (W.w - 240), y = 120 + rnd() * (W.h - 240);
      if (inSafe(x, y)) continue;
      const s = 0.8 + rnd() * 0.6;
      lv.decor.trees.push({ x, y, s });
      lv.obstacles.push({ x, y: y + 10 * s, r: 13 * s });
      placed++;
    }
    placed = 0; guard = 0;
    while (placed < 34 && guard++ < 2000) {
      const x = 120 + rnd() * (W.w - 240), y = 120 + rnd() * (W.h - 240);
      if (inSafe(x, y)) continue;
      lv.decor.rocks.push({ x, y, s: 0.7 + rnd() * 0.7, rot: rnd() * 6 });
      lv.obstacles.push({ x, y, r: 15 });
      placed++;
    }
    for (let i = 0; i < 140; i++) {
      const x = 80 + rnd() * (W.w - 160), y = 80 + rnd() * (W.h - 160);
      lv.decor.flowers.push({ x, y, c: ['#ff8fb3', '#ffd76e', '#c9b8ff', '#ff6e6e'][i % 4], ph: rnd() * 6 });
    }
    for (let i = 0; i < 26; i++)
      lv.decor.fireflies.push({ x: rnd() * W.w, y: rnd() * W.h, ph: rnd() * 6, sp: 0.3 + rnd() * 0.5 });
    // Arena ring stones (visual; seal handled in moveCollide)
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 26) {
      const x = L.arenaCx + Math.cos(a) * (L.arenaR + 26), y = L.arenaCy + Math.sin(a) * (L.arenaR + 26);
      if (y > L.arenaCy + L.arenaR - 60 && Math.abs(x - L.arenaCx) < 170) continue; // south entrance gap
      lv.decor.rocks.push({ x, y, s: 1.1, rot: a });
    }
    // Boss-arena set piece: thorn pillars, glowing rune stones, braziers.
    // Fixed layout (not from rnd) so the rest of the map stays identical.
    lv.decor.pillars = []; lv.decor.runes = []; lv.decor.braziers = [];
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2 + 0.31;
      const x = L.arenaCx + Math.cos(a) * (L.arenaR + 66), y = L.arenaCy + Math.sin(a) * (L.arenaR + 66);
      if (y > L.arenaCy + L.arenaR - 40 && Math.abs(x - L.arenaCx) < 210) continue;
      lv.decor.pillars.push({ x, y, s: 0.85 + ((i * 37) % 40) / 100, ph: (i * 1.3) % 6 });
    }
    [0.3, 1.9, 3.4, 4.9].forEach((a, i) => {
      lv.decor.runes.push({
        x: L.arenaCx + Math.cos(a) * (L.arenaR - 70),
        y: L.arenaCy + Math.sin(a) * (L.arenaR - 70), ph: i * 1.7,
      });
    });
    lv.decor.braziers.push({ x: L.arenaCx - 205, y: L.arenaCy + L.arenaR - 40 });
    lv.decor.braziers.push({ x: L.arenaCx + 205, y: L.arenaCy + L.arenaR - 40 });
    // Grass tufts (destructible props) inside clearings
    const tuftSpots = [L.c1, L.c2, L.c3, { x: 1300, y: 1150, r: 150 }, { x: 1300, y: 480, r: 130 }];
    for (const s of tuftSpots) {
      for (let i = 0; i < 14; i++) {
        const a = rnd() * Math.PI * 2, d = rnd() * s.r;
        G.props.push({ kind: 'grass', x: s.x + Math.cos(a) * d, y: s.y + Math.sin(a) * d, r: 12, ph: rnd() * 6 });
      }
    }
    // Chest (hidden cache, east clearing behind trees)
    G.props.push({ kind: 'chest', x: 2140, y: 800, r: 22, opened: false });
    lv.obstacles.push({ x: 2140, y: 800, r: 20, prop: true });
    lv.decor.trees.push({ x: 2090, y: 760, s: 1.2 }); lv.obstacles.push({ x: 2090, y: 772, r: 15 });
    lv.decor.trees.push({ x: 2190, y: 770, s: 1.1 }); lv.obstacles.push({ x: 2190, y: 781, r: 14 });
    // Sealbells
    for (const b of L.bellPos) {
      G.props.push({ kind: 'bell', x: b.x, y: b.y, r: 22, rung: false });
      lv.obstacles.push({ x: b.x, y: b.y, r: 20, prop: true });
    }
    // Tutorial nibblet in clearing 1
    const nib = V.Entities.makeNib(L.c1.x, L.c1.y - 60);
    G.enemies.push(nib);
    lv.tutorialNib = nib;
    // Gate visuals are drawn from flags; collision via rects below.
  };

  function rectBlock(rect, e) {
    const nx = Math.max(rect.x, Math.min(e.x, rect.x + rect.w));
    const ny = Math.max(rect.y, Math.min(e.y, rect.y + rect.h));
    const dx = e.x - nx, dy = e.y - ny, d = Math.hypot(dx, dy);
    if (d < e.r) {
      if (d > 0.01) { e.x = nx + (dx / d) * e.r; e.y = ny + (dy / d) * e.r; }
      else e.y = rect.y + rect.h + e.r; // inside: push south (coyote-friendly)
    }
  }

  L.moveCollide = function (G, e, dx, dy) {
    const W = V.Config.world, lv = G.level;
    e.x += dx;
    for (const o of lv.obstacles) {
      const ox = e.x - o.x, oy = e.y - o.y, d = Math.hypot(ox, oy), min = e.r + o.r;
      if (d < min && d > 0.01) { e.x = o.x + (ox / d) * min; }
    }
    e.y += dy;
    for (const o of lv.obstacles) {
      const ox = e.x - o.x, oy = e.y - o.y, d = Math.hypot(ox, oy), min = e.r + o.r;
      if (d < min && d > 0.01) { e.y = o.y + (oy / d) * min; }
    }
    if (G.bossActive && (e.kind === 'player' || e.kind === 'pip' || e.kind === 'moss' || e.kind === 'boss' || e.kind === 'nib')) {
      // Arena seal: friends stay in during boss; boss/adds stay in.
      const inArena = Math.hypot(e.x - L.arenaCx, e.y - L.arenaCy);
      const wantIn = (e.kind === 'player' || e.kind === 'pip' || e.kind === 'moss' || e.kind === 'boss');
      if (wantIn && inArena > L.arenaR - e.r) {
        const a = Math.atan2(e.y - L.arenaCy, e.x - L.arenaCx);
        e.x = L.arenaCx + Math.cos(a) * (L.arenaR - e.r);
        e.y = L.arenaCy + Math.sin(a) * (L.arenaR - e.r);
      }
    }
    if (!lv.tutGateOpen) rectBlock(L.tutGateRect, e);
    if (!lv.gateOpen) rectBlock(L.gateRect, e);
    e.x = Math.max(50 + e.r, Math.min(W.w - 50 - e.r, e.x));
    e.y = Math.max(50 + e.r, Math.min(W.h - 50 - e.r, e.y));
  };

  L.pointBlocked = function (G, x, y) {
    const W = V.Config.world, lv = G.level;
    if (!lv) return false;
    if (x < 40 || y < 40 || x > W.w - 40 || y > W.h - 40) return true;
    for (const o of lv.obstacles) if (Math.hypot(x - o.x, y - o.y) < o.r) return true;
    if (!lv.gateOpen && x > L.gateRect.x && x < L.gateRect.x + L.gateRect.w && y > L.gateRect.y - 6 && y < L.gateRect.y + L.gateRect.h + 6) return true;
    if (!lv.tutGateOpen && x > L.tutGateRect.x && x < L.tutGateRect.x + L.tutGateRect.w && y > L.tutGateRect.y - 6 && y < L.tutGateRect.y + L.tutGateRect.h + 6) return true;
    return false;
  };

  L.hitProp = function (G, pr, charge) {
    const E = V.Entities;
    if (pr.kind === 'grass' && !pr.gone) {
      pr.gone = true;
      V.Particles.burst(G, pr.x, pr.y, 7, { color: '#4d9e4d', speed: 130, life: 0.4, size: 4 });
      if (Math.random() < 0.4)
        G.pickups.push(E.makePickup(Math.random() < 0.55 ? 'orb-hp' : 'orb-mp', pr.x, pr.y));
    } else if (pr.kind === 'chest' && !pr.opened) {
      pr.opened = true;
      G.flags.ember = true;
      G.flags.vials = Math.min(5, G.flags.vials + 1);
      V.Audio.sfx('chest');
      V.Particles.text(G, pr.x, pr.y - 34, 'Ember Seed! Cinder Bloom unlocked', '#ff9d4d', 17);
      V.Particles.burst(G, pr.x, pr.y, 24, { color: '#ff9d4d', speed: 200, life: 0.7 });
      G.checkpoint = { x: pr.x - 60, y: pr.y + 80, label: 'East clearing cache' };
    } else if (pr.kind === 'bell' && !pr.rung) {
      if (charge >= V.Config.bellNeedCharge) {
        pr.rung = true;
        G.level.bellsRung++;
        V.Audio.sfx('bell');
        V.Particles.burst(G, pr.x, pr.y, 26, { color: '#ffe9a3', speed: 240, life: 0.8 });
        V.Particles.text(G, pr.x, pr.y - 40, 'Sealbell rung! (' + G.level.bellsRung + '/2)', '#ffe9a3', 18);
        if (G.level.bellsRung >= 2) {
          G.level.gateOpen = true;
          V.Audio.sfx('gate');
          V.Particles.shake(G, 0.5);
          V.Particles.text(G, 1300, 250, 'The bramble gate recoils!', '#7ee06e', 20);
          G.checkpoint = { x: 1300, y: 360, label: 'Bramble gate' };
        }
      } else {
        V.Particles.text(G, pr.x, pr.y - 34, 'Strike while charged 50%+', '#c9c9c9', 13);
        V.Audio.sfx('hit');
      }
    }
  };

  L.onEnemyDown = function (G, e) {
    const lv = G.level;
    if (lv.tutorialNib === e) {
      lv.tutorialNib = null;
      lv.tutGateOpen = true;
      V.Audio.sfx('gate');
      V.Particles.text(G, 1300, 1230, 'The way north opens!', '#7ee06e', 18);
      G.objectiveFlags.tutorial = true;
      G.checkpoint = { x: L.c1.x, y: L.c1.y + 60, label: 'Glade center' };
    }
  };

  function spawnGroup(G, list) {
    for (const [kind, x, y] of list) {
      const e = kind === 'nib' ? V.Entities.makeNib(x, y) : V.Entities.makeSpit(x, y);
      G.enemies.push(e);
      V.Particles.burst(G, x, y, 10, { color: '#7ee06e', speed: 170, life: 0.5 });
    }
  }

  L.update = function (G, dt) {
    const lv = G.level, p = G.player, F = G.objectiveFlags;
    const near = (x, y, r) => Math.hypot(p.x - x, p.y - y) < r;
    // Encounter A: west clearing
    if (!lv.encA && near(L.c2.x, L.c2.y, L.c2.r)) {
      lv.encA = 1;
      spawnGroup(G, [['nib', L.c2.x - 90, L.c2.y - 60], ['nib', L.c2.x + 90, L.c2.y - 40], ['nib', L.c2.x, L.c2.y + 100]]);
      G.checkpoint = { x: L.c2.x + 180, y: L.c2.y + 220, label: 'West clearing' };
      V.Particles.text(G, p.x, p.y - 40, 'Ambush in the ferns!', '#ffb84d', 17);
    }
    if (lv.encA === 1 && !F.west && G.enemies.length === 0 && !G.bossActive) { F.west = true; }
    // Encounter B: east clearing
    if (!lv.encB && near(L.c3.x, L.c3.y, L.c3.r)) {
      lv.encB = 1;
      spawnGroup(G, [['nib', L.c3.x - 100, L.c3.y], ['nib', L.c3.x + 60, L.c3.y + 90], ['spit', L.c3.x + 40, L.c3.y - 110]]);
      G.checkpoint = { x: L.c3.x - 180, y: L.c3.y + 220, label: 'East clearing' };
      V.Particles.text(G, p.x, p.y - 40, 'Spitters in the thorns!', '#ffb84d', 17);
    }
    if (lv.encB === 1 && !F.east && G.enemies.length === 0 && !G.bossActive) { F.east = true; }
    // Ambush at bridge
    if (!lv.ambush && p.y < 700 && p.x > 1000 && p.x < 1600) {
      lv.ambush = 1;
      spawnGroup(G, [['nib', 1150, 640], ['nib', 1450, 640], ['nib', 1300, 520], ['spit', 1300, 740]]);
      G.checkpoint = { x: 1300, y: 780, label: 'Old bridge' };
      V.Particles.text(G, p.x, p.y - 40, 'Ambush on the bridge!', '#ff6e6e', 18);
      V.Audio.sfx('bossRoar');
    }
    if (lv.ambush === 1 && !F.bridge && G.enemies.length === 0 && !G.bossActive) { F.bridge = true; }
    // Boss trigger (gate must be open so the fight can't start south of it)
    if (!lv.bossStarted && lv.gateOpen && near(L.arenaCx, L.arenaCy, L.arenaR - 60)) {
      lv.bossStarted = true;
      G.boss = V.Entities.makeBoss(L.arenaCx, L.arenaCy - 90);
      G.bossActive = true;
      G.flags.vials = Math.min(5, G.flags.vials + 2);
      G.checkpoint = { x: L.arenaCx, y: L.arenaCy + L.arenaR - 30, label: 'Arena gate' };
      V.Audio.sfx('bossRoar');
      V.Particles.text(G, L.arenaCx, L.arenaCy - 160, 'GNARLMAW, the Bramble Behemoth', '#ff5d5d', 22);
      V.Particles.shake(G, 0.6);
      G.hitFlash = 0.8; // set-piece intro flash (visual only)
    }
    // Seed light: after boss, fragment waits north of arena
    if (F.bossDown && !F.fragmentSpawned) {
      F.fragmentSpawned = true;
      G.pickups.push(V.Entities.makePickup('fragment', L.arenaCx, L.arenaCy - 170));
    }
  };

  L.objectiveText = function (G) {
    const F = G.objectiveFlags, lv = G.level;
    if (!F.tutorial) return 'Slay the Nibblet barring the path (hold attack to charge)';
    // Later progress marks earlier zones done so the tracker can't stall on skips.
    const w = F.west || lv.encB || lv.ambush || lv.bellsRung > 0 || lv.bossStarted;
    const e = F.east || lv.ambush || lv.bellsRung > 0 || lv.bossStarted;
    const br = F.bridge || lv.bellsRung > 0 || lv.bossStarted;
    if (!w && !lv.encA) return 'Push north-west into the fern clearing';
    if (!e && !lv.encB) return 'Search the east clearing for a hidden cache';
    if (!br && !lv.ambush) return 'Cross the old bridge to the north';
    if (lv.bellsRung < 2) return 'Ring both Sealbells with charged strikes (' + lv.bellsRung + '/2)';
    if (!lv.bossStarted) return 'Enter the arena — face Gnarlmaw';
    if (!F.bossDown) return 'Defeat Gnarlmaw!';
    return 'Claim the Verdant Seed fragment';
  };
})();

</script>
<script>
/* ===== inlined js/draw.js ===== */
(function () {

    ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineWidth = lw || 2; ctx.strokeStyle = stroke; ctx.stroke(); }
  };
  D.ellipse = function (ctx, x, y, rx, ry, rot, fill, stroke) {
    ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  };
  // Viewport cull (perf): skip anything fully outside the camera view.
  D.inView = function (G, x, y, m) {
    const cam = G.camera, vw = V.Config.canvas.w, vh = V.Config.canvas.h;
    return x > cam.x - m && x < cam.x + vw + m && y > cam.y - m && y < cam.y + vh + m;
  };
  // Deterministic 0..1 hash for procedural placement (no storage, no rnd drift).
  D.hash = function (x, y) {
    const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    return n - Math.floor(n);
  };

  D.world = function (ctx, G) {
    const vw = V.Config.canvas.w, vh = V.Config.canvas.h;
    const cam = G.camera;
    ctx.save();
    ctx.translate(-cam.x, -cam.y);
    D.ground(ctx, G);
    D.props(ctx, G);
    D.pickups(ctx, G);
    D.telegraphs(ctx, G);
    // Y-sorted actors
    const actors = [];
    for (const e of G.enemies) if (!e.dead) actors.push(e);
    for (const c of G.companions) actors.push(c);
    if (G.boss && !G.boss.dead && (G.bossActive || G.level.bossStarted)) actors.push(G.boss);
    actors.push(G.player);

    for (const a of actors) D.actor(ctx, G, a);

    D.effects(ctx, G);
    D.particles(ctx, G);
    D.lights(ctx, G);
    ctx.restore();
    D.letterbox(ctx, G);
    D.foreground(ctx, G);
    // Screen-space vignette handled by HUD.
  };

  D.ground = function (ctx, G) {
    const W = V.Config.world, L = V.Level, t = G.time;
    const g = ctx.createLinearGradient(0, 0, 0, W.h);
    g.addColorStop(0, '#1d3a24'); g.addColorStop(0.5, '#24522c'); g.addColorStop(1, '#1a4023');
    ctx.fillStyle = g; ctx.fillRect(G.camera.x - 20, G.camera.y - 20, V.Config.canvas.w + 40, V.Config.canvas.h + 40);
