    ctx.fillStyle = '#5a4a2f';
    ctx.fillRect(1150, 280, 300, 1400);       // N-S
    ctx.fillRect(400, 800, 1820, 300);        // E-W
    ctx.fillStyle = '#6b5a3a';
    ctx.fillRect(1170, 280, 260, 1400);
    ctx.fillRect(400, 830, 1820, 240);
    // Clearings
    for (const c of [L.c1, L.c2, L.c3]) {
      D.circle(ctx, c.x, c.y, c.r, '#2c6b35');
      D.circle(ctx, c.x, c.y, c.r * 0.72, '#33803f');
    }
    // Bridge planks
    ctx.fillStyle = '#7a5c33';
    for (let i = 0; i < 7; i++) ctx.fillRect(1200, 540 + i * 22, 200, 16);
    ctx.fillStyle = '#4a3820';
    ctx.fillRect(1192, 540, 12, 150); ctx.fillRect(1396, 540, 12, 150);
    // Arena floor + rim
    D.circle(ctx, L.arenaCx, L.arenaCy, L.arenaR, '#31482e');
    D.circle(ctx, L.arenaCx, L.arenaCy, L.arenaR - 26, '#3a5a37');
    ctx.save();
    ctx.beginPath(); ctx.arc(L.arenaCx, L.arenaCy, L.arenaR - 8, 0, Math.PI * 2);
    ctx.lineWidth = 10; ctx.strokeStyle = '#6e6e6e'; ctx.stroke();
    ctx.restore();
    // Sealbell dais
    D.ellipse(ctx, 1300, 420, 220, 60, 0, '#2c5b46');
    // Far canopy layer (parallax): slow-drifting shadow crowns + light dapples.
    // Far layer moves at 0.55x camera, so draw at world + cam*0.45 in world space.
    (function () {
      const step = 430, vw = V.Config.canvas.w, vh = V.Config.canvas.h;
      const px = G.camera.x * 0.55, py = G.camera.y * 0.55;
      const ox = G.camera.x * 0.45, oy = G.camera.y * 0.45;
      const x0 = Math.floor((px - 140) / step) * step, x1 = px + vw + 140;
      const y0 = Math.floor((py - 140) / step) * step, y1 = py + vh + 140;
      for (let gx = x0; gx < x1; gx += step) {
        for (let gy = y0; gy < y1; gy += step) {
          const h = D.hash(gx, gy);
          if (h < 0.35) continue;
          const drift = ((t * 9 + h * 300) % 70) - 35;
          const r = 60 + h * 95;
          D.ellipse(ctx, gx + ox + drift, gy + oy, r, r * 0.55, 0, 'rgba(6,18,8,0.30)');
          if (h > 0.72) D.ellipse(ctx, gx + ox + drift + 70, gy + oy + 40, 34, 18, 0.3, 'rgba(255,240,190,0.10)');
        }
      }
    })();
    // Decor: rocks, flowers, fireflies, trees (trees after actors? trunks occlude—draw small ones here)
    const dc = G.level.decor;
    for (const r of dc.rocks) {
      if (!D.inView(G, r.x, r.y, 40)) continue;
      ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot || 0); ctx.scale(r.s, r.s);
      ctx.fillStyle = '#6e6e6e';
      ctx.beginPath(); ctx.moveTo(-16, 8); ctx.lineTo(-8, -10); ctx.lineTo(8, -12); ctx.lineTo(16, 6); ctx.lineTo(0, 12); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8f8f8f';
      ctx.beginPath(); ctx.moveTo(-8, -10); ctx.lineTo(8, -12); ctx.lineTo(4, -2); ctx.lineTo(-6, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    for (const f of dc.flowers) {
      if (!D.inView(G, f.x, f.y, 16)) continue;
      const s = 3 + Math.sin(t * 2 + f.ph) * 0.8;
      D.circle(ctx, f.x, f.y, s + 2, f.c);
      D.circle(ctx, f.x, f.y, s * 0.5, '#fff8d8');
    }
    for (const fl of dc.fireflies) {
      const x = fl.x + Math.sin(t * fl.sp + fl.ph) * 60, y = fl.y + Math.cos(t * fl.sp * 0.7 + fl.ph) * 40;
      if (!D.inView(G, x, y, 16)) continue;
      const a = 0.4 + 0.6 * Math.abs(Math.sin(t * 2 + fl.ph));
      ctx.globalAlpha = a;
      D.circle(ctx, x, y, 3, '#fff3a3');
      ctx.globalAlpha = 1;
    }
    for (const tr of dc.trees) {
      if (!D.inView(G, tr.x, tr.y - 20 * tr.s, 70 * tr.s)) continue;
      D.tree(ctx, tr.x, tr.y, tr.s);
    }
  };

  D.tree = function (ctx, x, y, s) {
    ctx.fillStyle = '#4a3220';
    ctx.fillRect(x - 5 * s, y - 6 * s, 10 * s, 22 * s);
    D.circle(ctx, x, y - 26 * s, 22 * s, '#1e4d28');
    D.circle(ctx, x - 14 * s, y - 14 * s, 14 * s, '#276035');
    D.circle(ctx, x + 14 * s, y - 14 * s, 14 * s, '#276035');
    D.circle(ctx, x - 6 * s, y - 32 * s, 9 * s, '#3f8a4d');
  };

  D.props = function (ctx, G) {
    const t = G.time, lv = G.level, L = V.Level;
    D.arenaSetPiece(ctx, G);
    for (const pr of G.props) {
      if (pr.gone) continue;
      if (!D.inView(G, pr.x, pr.y, 70)) continue;
      if (pr.kind === 'grass') {
        ctx.strokeStyle = '#4d9e4d'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        for (let b = -2; b <= 2; b++) {
          const sway = Math.sin(t * 3 + pr.ph + b) * 3;
          ctx.beginPath(); ctx.moveTo(pr.x + b * 5, pr.y + 6);
          ctx.quadraticCurveTo(pr.x + b * 5 + sway, pr.y - 8, pr.x + b * 6 + sway * 1.6, pr.y - 14 - Math.abs(b) * -2);
          ctx.stroke();
        }
      } else if (pr.kind === 'chest') {
        const bob = pr.opened ? 0 : Math.sin(t * 2) * 2;
        ctx.fillStyle = 'rgba(255,200,90,0.25)';
        ctx.fillRect(pr.x - 26, pr.y - 40 + bob, 52, 56);
        ctx.fillStyle = '#6b4a26'; ctx.fillRect(pr.x - 22, pr.y - 18 + bob, 44, 30);
        ctx.fillStyle = pr.opened ? '#3d2a14' : '#8a6134'; ctx.fillRect(pr.x - 22, pr.y - (pr.opened ? 34 : 28) + bob, 44, 12);
        ctx.fillStyle = '#ffd76e'; ctx.fillRect(pr.x - 5, pr.y - 14 + bob, 10, 12);
        if (pr.opened) { D.circle(ctx, pr.x, pr.y - 40 + bob, 8, '#ff9d4d'); }
      } else if (pr.kind === 'bell') {
        ctx.fillStyle = '#5c5c5c'; ctx.fillRect(pr.x - 18, pr.y + 6, 36, 16);
        ctx.fillStyle = '#7a7a7a'; ctx.fillRect(pr.x - 12, pr.y - 26, 24, 34);
        const glow = pr.rung ? (0.6 + 0.4 * Math.sin(t * 4)) : 0;
        if (glow) { ctx.globalAlpha = 0.35 * glow; D.circle(ctx, pr.x, pr.y - 34, 30, '#ffe9a3'); ctx.globalAlpha = 1; }
        ctx.fillStyle = pr.rung ? '#ffe9a3' : '#c8a24d';
        ctx.beginPath(); ctx.arc(pr.x, pr.y - 30, 14, Math.PI, 0);
        ctx.lineTo(pr.x + 18, pr.y - 14); ctx.lineTo(pr.x - 18, pr.y - 14); ctx.closePath(); ctx.fill();
        D.circle(ctx, pr.x, pr.y - 12, 4, '#7a5c1e');
        if (!pr.rung) {
          ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('charge 50%+', pr.x, pr.y + 38);
        }
      }
    }
    // Gates (bramble walls)
    if (!lv.tutGateOpen) D.brambles(ctx, L.tutGateRect, t, '#3d6b2f');
    if (!lv.gateOpen) D.brambles(ctx, L.gateRect, t, '#4d2f6b');
    // Arena seal shimmer during boss
    if (G.bossActive) {
      ctx.save();
      ctx.beginPath(); ctx.arc(L.arenaCx, L.arenaCy, L.arenaR - 4, 0, Math.PI * 2);
      ctx.lineWidth = 6 + Math.sin(t * 5) * 2; ctx.strokeStyle = 'rgba(255,93,93,0.7)'; ctx.stroke();
      ctx.restore();
    }
  };

  D.brambles = function (ctx, r, t, color) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(r.x - 6, r.y - 26, r.w + 12, r.h + 52);
    for (let x = r.x; x < r.x + r.w; x += 26) {
      const h = 34 + Math.sin(t * 1.5 + x) * 5;
      ctx.strokeStyle = color; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, r.y + r.h);
      ctx.quadraticCurveTo(x + 8, r.y + r.h / 2, x - 4, r.y - h + r.h);
      ctx.stroke();
      ctx.fillStyle = '#1d2b1d';
      for (let k = 0; k < 3; k++) {
        const ty = r.y + r.h - 8 - k * 16;
        ctx.beginPath(); ctx.moveTo(x + 2, ty); ctx.lineTo(x + 12, ty - 4); ctx.lineTo(x + 3, ty - 9); ctx.closePath(); ctx.fill();
      }
    }
  };

  D.pickups = function (ctx, G) {
    for (const o of G.pickups) {
      if (!D.inView(G, o.x, o.y, 240)) continue;
      const bob = Math.sin(o.t * 4) * 4;
      if (o.kind === 'fragment') {
        // Light column + seed
        const gr = ctx.createLinearGradient(0, o.y - 220, 0, o.y + 20);
        gr.addColorStop(0, 'rgba(255,240,180,0)'); gr.addColorStop(1, 'rgba(255,240,180,0.55)');
        ctx.fillStyle = gr; ctx.fillRect(o.x - 34, o.y - 220, 68, 240);
        ctx.globalAlpha = 0.5 + 0.3 * Math.sin(o.t * 3);
        D.circle(ctx, o.x, o.y + bob * 0.5, 20, '#ffe9a3');
        ctx.globalAlpha = 1;
        D.ellipse(ctx, o.x, o.y + bob * 0.5, 7, 12, o.t, '#fff8d8', '#c8a24d');
      } else {
        const c = o.kind === 'orb-hp' ? '#7ee06e' : '#5db9ff';
        ctx.globalAlpha = 0.35; D.circle(ctx, o.x, o.y + bob, 12, c); ctx.globalAlpha = 1;
        ctx.fillStyle = c;
        ctx.beginPath(); ctx.arc(o.x, o.y + bob, 6, 0, Math.PI * 2); ctx.fill();
        D.circle(ctx, o.x - 2, o.y + bob - 2, 2, '#fff');
      }
    }
  };

  // Colorblind-safe telegraph: red fill + white stripes + dark rim + glyph.
  D.telegraphs = function (ctx, G) {
    const b = G.boss;
    if (!b || b.dead || !G.bossActive || b.mode !== 'windup') return;
    const cfg = V.Config.boss;
    const frac = Math.max(0, b.modeT / (cfg.telegraph * (b.enraged ? 0.75 : 1)));
    const x = b.slamX, y = b.slamY, r = cfg.slamRadius;
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,60,60,' + (0.18 + 0.25 * (1 - frac)) + ')'; ctx.fill();
    ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 8;
    for (let i = -r; i < r; i += 26) {
      ctx.beginPath(); ctx.moveTo(x + i - r, y - r); ctx.lineTo(x + i + r, y + r); ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.lineWidth = 4 + 2 * Math.sin(G.time * 10); ctx.strokeStyle = '#3a0d0d'; ctx.stroke();
    // shrinking timing ring
    ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r * frac), 0, Math.PI * 2);
    ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke();
    // expanding warning pulse (shape cue, readable without color)
    const pr = ((G.time * 140) % 70);
    ctx.globalAlpha = 0.55 * (1 - pr / 70);
    ctx.beginPath(); ctx.arc(x, y, r + pr, 0, Math.PI * 2);
    ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.globalAlpha = 1;
    // warning triangle glyph
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(x, y - 16); ctx.lineTo(x + 15, y + 10); ctx.lineTo(x - 15, y + 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a00'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('!', x, y + 7);
    ctx.restore();
  };

  D.actor = function (ctx, G, a) {
    // shadow
    ctx.globalAlpha = 0.3;
    D.ellipse(ctx, a.x, a.y + a.r * 0.9, a.r * 0.9, a.r * 0.35, 0, '#000');
    ctx.globalAlpha = 1;
    const flash = a.flash > 0;
    ctx.save();
    if (a.kind === 'player' && a.ifr > 0 && Math.floor(G.time * 16) % 2 === 0) ctx.globalAlpha = 0.45;
    if (a.kind === 'pip' && a.ko) { D.koGhost(ctx, a, '#9fe8ff'); ctx.restore(); return; }
    if (a.kind === 'moss' && a.ko) { D.koGhost(ctx, a, '#b8e09e'); ctx.restore(); return; }
    switch (a.kind) {
      case 'player': D.player(ctx, G, a); break;
      case 'pip': D.pip(ctx, G, a); break;
      case 'moss': D.moss(ctx, G, a); break;
      case 'nib': D.nib(ctx, G, a); break;
      case 'spit': D.spit(ctx, G, a); break;
      case 'boss': D.boss(ctx, G, a); break;
    }
    if (flash) {
      // Hit flash: white core pop + expanding ring, scaled by remaining flash.
      const k = Math.min(1, a.flash / 0.12);
      ctx.globalAlpha = 0.55 * k; D.circle(ctx, a.x, a.y, a.r + 4, '#fff'); ctx.globalAlpha = 1;
      ctx.globalAlpha = 0.5 * k; ctx.lineWidth = 3; ctx.strokeStyle = '#fff';
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r + 8 + (1 - k) * 22, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    // HP pips for wounded enemies
    if ((a.kind === 'nib' || a.kind === 'spit') && a.hp < a.maxhp) {
      const w = 30;
      ctx.fillStyle = '#222'; ctx.fillRect(a.x - w / 2, a.y - a.r - 14, w, 5);
      ctx.fillStyle = '#ff6e6e'; ctx.fillRect(a.x - w / 2, a.y - a.r - 14, w * (a.hp / a.maxhp), 5);
    }
  };

  D.koGhost = function (ctx, a, color) {
    ctx.globalAlpha = 0.4;
    D.circle(ctx, a.x, a.y, a.r, color);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(Math.ceil(a.ko) + 's', a.x, a.y - a.r - 6);
  };

  D.player = function (ctx, G, p) {
    // Run bob + dash lean (eased procedural rig; shadow stays planted).
    const bob = (p.moving && p.dashT <= 0 && !p.dead) ? Math.sin(G.time * 13) * 2.2 : 0;
    ctx.save(); ctx.translate(0, bob);
    if (p.dashT > 0) {
      ctx.translate(p.x, p.y); ctx.rotate(p.face); ctx.scale(1.22, 0.82);
      ctx.rotate(-p.face); ctx.translate(-p.x, -p.y);
    }
    // charge aura
    if (p.charge >= 0) {
      const pr = p.r + 8 + p.charge * 14 + Math.sin(G.time * 12) * 3;
      ctx.globalAlpha = 0.35 + p.charge * 0.4;
      D.circle(ctx, p.x, p.y, pr, p.charge > 0.5 ? '#ffe9a3' : '#9fe8ff');
      ctx.globalAlpha = 1;
    }
    // cloak (triangle toward facing)
    const sway = p.moving ? Math.sin(G.time * 9) * 0.08 : Math.sin(G.time * 2) * 0.03;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.face + Math.PI / 2 + sway);
    ctx.fillStyle = '#2f6b3a';
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-13, 12); ctx.lineTo(13, 12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3f8a4d';
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-7, 10); ctx.lineTo(7, 10); ctx.closePath(); ctx.fill();
    ctx.restore();
    D.circle(ctx, p.x, p.y - 4, 10, '#e8b88a');              // head
    ctx.save(); ctx.translate(p.x, p.y - 4); ctx.rotate(p.face); // leaf hat points along facing
    ctx.fillStyle = '#276035';
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.quadraticCurveTo(4, -12, 18, -2); ctx.quadraticCurveTo(4, 6, -12, 0); ctx.fill();
    ctx.restore();
    D.circle(ctx, p.x + Math.cos(p.face) * 5, p.y - 4 + Math.sin(p.face) * 5, 2.4, '#222'); // eye
    // thornblade + swing arc
    const bladeLen = 26 + V.Combat.blade(G).rangeBonus * 0.5;
    const bx = p.x + Math.cos(p.face) * 14, by = p.y + Math.sin(p.face) * 14;
    ctx.strokeStyle = '#8a9a5b'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx, by);
    ctx.lineTo(bx + Math.cos(p.face) * bladeLen, by + Math.sin(p.face) * bladeLen); ctx.stroke();
    if (p.swingT > 0) {
      const cfg = V.Config.player;
      const range = cfg.attackRange + V.Combat.blade(G).rangeBonus + p.swingCharge * 46;
      ctx.globalAlpha = 0.5 * (p.swingT / 0.22);
      ctx.fillStyle = p.swingCharge > 0.5 ? '#ffe9a3' : '#e8f4ff';
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.arc(p.x, p.y, range, p.face - cfg.attackArc / 2, p.face + cfg.attackArc / 2);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // dash streak
    if (p.dashT > 0) {
      ctx.globalAlpha = 0.4;
      D.ellipse(ctx, p.x - Math.cos(p.face) * 26, p.y - Math.sin(p.face) * 26, 22, 10, p.face, '#cfe8ff');
      ctx.globalAlpha = 1;
    }
    ctx.restore(); // dash-lean / bob frame
  };

  D.pip = function (ctx, G, c) {
    const w = Math.sin(c.wob) * 0.5, fy = c.y + Math.sin(c.wob * 0.7) * 3;
    ctx.save(); ctx.translate(c.x, fy); ctx.rotate(c.face);
    ctx.globalAlpha = 0.8; ctx.fillStyle = '#cfe8ff';
    ctx.save(); ctx.rotate(-0.5 - w); D.ellipse(ctx, -4, -10, 5, 11, 0, '#cfe8ff'); ctx.restore();
    ctx.save(); ctx.rotate(0.5 + w); D.ellipse(ctx, -4, 10, 5, 11, 0, '#cfe8ff'); ctx.restore();
    ctx.globalAlpha = 1; ctx.restore();
    D.circle(ctx, c.x, fy, c.r, '#7fd8c8', '#2f6b5a', 2);
    D.circle(ctx, c.x + Math.cos(c.face) * 5, fy + Math.sin(c.face) * 5 - 2, 3, '#123');
    D.circle(ctx, c.x + Math.cos(c.face) * 5 - 1, fy + Math.sin(c.face) * 5 - 3, 1, '#fff');
    ctx.fillStyle = '#ffe9a3';
    ctx.beginPath(); ctx.arc(c.x, fy, 4, 0, Math.PI * 2); ctx.fill();
  };

  D.moss = function (ctx, G, c) {
    const sq = c.lungeT > 0 ? 1.25 : 1 + Math.sin(G.time * 6) * 0.04;
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(sq, 1 / sq);
    D.circle(ctx, 0, 0, c.r, '#3f6b2f', '#1e3a1a', 2);
    D.circle(ctx, 0, 4, c.r * 0.55, '#6fae5a');
    // ears
    ctx.fillStyle = '#3f6b2f';
    ctx.beginPath(); ctx.moveTo(-8, -9); ctx.lineTo(-12, -20); ctx.lineTo(-3, -13); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, -9); ctx.lineTo(12, -20); ctx.lineTo(3, -13); ctx.closePath(); ctx.fill();
    ctx.restore();
    const ex = c.x + Math.cos(c.face) * 5, ey = c.y + Math.sin(c.face) * 5;
    D.circle(ctx, ex - 4, ey - 3, 2.6, '#123'); D.circle(ctx, ex + 4, ey - 3, 2.6, '#123');
  };

  D.nib = function (ctx, G, e) {
    const hop = Math.abs(Math.sin(e.hopT));
    const sy = 1 - hop * 0.18, y = e.y - hop * 10;
    ctx.save(); ctx.translate(e.x, y); ctx.rotate(Math.sin(e.hopT * 0.5) * 0.08); ctx.scale(1 / sy, sy);
    D.ellipse(ctx, 0, 0, 14, 11, 0, '#e8d8b8', '#8a7355');
    // ears
    ctx.fillStyle = '#e8d8b8';
    ctx.save(); ctx.rotate(-0.3); D.ellipse(ctx, -4, -18, 4, 11, 0, '#e8d8b8', '#8a7355'); ctx.restore();
    ctx.save(); ctx.rotate(0.3); D.ellipse(ctx, 5, -18, 4, 11, 0, '#e8d8b8', '#8a7355'); ctx.restore();
    ctx.restore();
    const ex = e.x + Math.cos(e.face) * 7, ey = y + Math.sin(e.face) * 4;
    D.circle(ctx, ex - 3, ey - 3, 2.8, '#c00'); D.circle(ctx, ex + 4, ey - 3, 2.8, '#c00');
  };

  D.spit = function (ctx, G, e) {
    const open = e.fireCd < 0.5 ? 1 : 0.3;
    D.ellipse(ctx, e.x, e.y + 6, 12, 9, 0, '#d8c8a8', '#8a7355');   // stem base
    ctx.fillStyle = '#d8c8a8'; ctx.fillRect(e.x - 7, e.y - 12, 14, 18);
    D.ellipse(ctx, e.x, e.y - 12, 17, 11, 0, '#7b4fa6', '#4a2f6b'); // cap
    D.circle(ctx, e.x - 7, e.y - 15, 3, '#e8d8ff'); D.circle(ctx, e.x + 6, e.y - 10, 2.4, '#e8d8ff');
    const mx = e.x + Math.cos(e.face) * 9, my = e.y + 2 + Math.sin(e.face) * 5;
    D.circle(ctx, mx, my, 4 + open * 4, '#2a1a3a');                  // mouth
    D.circle(ctx, mx, my, 2 + open * 2, '#c77dff');
  };

  D.boss = function (ctx, G, b) {
    const enr = b.enraged;
    // Deterministic windup tremor (smooth sin, not per-frame random jitter).
    const shake = b.mode === 'windup' ? 3 : 0;
    const x = b.x + Math.sin(G.time * 43) * shake, y = b.y + Math.cos(G.time * 37) * shake;
    // Windup squash-and-stretch anticipation.
    const sq = b.mode === 'windup' ? 1 + Math.sin(G.time * 20) * 0.035 : 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(sq, 1 / sq); ctx.translate(-x, -y);
    const body = enr ? '#5a2a2a' : '#3a4a2a', dark = enr ? '#8a3a3a' : '#2a3a22';
    // bramble mass: clustered blobs
    const blobs = [[0, 0, 44], [-30, 10, 26], [30, 10, 26], [-14, -28, 24], [16, -26, 24], [0, 24, 28]];
    for (const [ox, oy, r] of blobs) D.circle(ctx, x + ox, y + oy, r, body, dark, 3);
    // thorn spikes
    ctx.fillStyle = '#1d2b1d';
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2 + 0.3;
      const sx = x + Math.cos(a) * 40, sy = y + Math.sin(a) * 38;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(a);
      ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(22, 0); ctx.lineTo(0, 7); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // glowing maw + eyes toward facing
    const fx = Math.cos(b.face), fy = Math.sin(b.face);
    const open = b.mode === 'windup' || b.mode === 'summon' ? 1 : 0.4;
    D.ellipse(ctx, x + fx * 30, y + fy * 26 + 8, 16, 8 + open * 10, Math.atan2(fy, fx), '#1a0d0d');
    D.circle(ctx, x + fx * 30, y + fy * 26 + 8, 4 + open * 4, enr ? '#ff3d3d' : '#ff9d4d');
    D.circle(ctx, x + fx * 22 - fy * 14, y + fy * 18 - 14, 7, enr ? '#ff3d3d' : '#ffd76e');
    D.circle(ctx, x + fx * 22 + fy * 14, y + fy * 18 - 14, 7, enr ? '#ff3d3d' : '#ffd76e');
    D.circle(ctx, x + fx * 22 - fy * 14, y + fy * 18 - 14, 3, '#200');
    D.circle(ctx, x + fx * 22 + fy * 14, y + fy * 18 - 14, 3, '#200');
    if (enr) { ctx.globalAlpha = 0.3 + 0.2 * Math.sin(G.time * 8); D.circle(ctx, x, y, 56, '#ff3d3d'); ctx.globalAlpha = 1; }
    ctx.restore(); // windup squash frame
  };

  D.projectiles = function (ctx, G) {
    for (const p of G.projectiles) {
      if (!D.inView(G, p.x, p.y, 30)) continue;
      if (p.kind === 'bolt') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.fillStyle = '#c8ff9e';
        ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-4, -4); ctx.lineTo(-7, 0); ctx.lineTo(-4, 4); ctx.closePath(); ctx.fill();
        ctx.restore();
      } else {
        const pu = 1 + Math.sin(p.t * 10) * 0.15;
        ctx.globalAlpha = 0.4; D.circle(ctx, p.x, p.y, p.r * 1.6 * pu, '#c77dff'); ctx.globalAlpha = 1;
        D.circle(ctx, p.x, p.y, p.r * pu, '#8a4fd8', '#3a1a5a', 2);
      }
    }
  };

  D.effects = function (ctx, G) {
    for (const e of G.effects) {
      if (e.kind === 'tide') {
        const a = 1 - e.t / e.life;
        ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.face);
        ctx.globalAlpha = 0.75 * a;
        ctx.fillStyle = '#5db9ff';
        ctx.fillRect(0, -e.width / 2, e.len * Math.min(1, e.t * 8 + 0.3), e.width);
        ctx.globalAlpha = 0.9 * a; ctx.fillStyle = '#d8f0ff';
        ctx.fillRect(0, -e.width / 6, e.len * Math.min(1, e.t * 8 + 0.3), e.width / 3);
        ctx.globalAlpha = 1; ctx.restore();
      } else if (e.kind === 'mend') {
        const a = 1 - e.t / e.life;
        ctx.globalAlpha = 0.5 * a;
        ctx.lineWidth = 5; ctx.strokeStyle = '#7ee06e';
        ctx.beginPath(); ctx.arc(e.x, e.y, 30 + e.t * 60, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (e.kind === 'cinder') {
        const fade = e.t < 1 ? 1 : Math.max(0, 1 - (e.t - 1) / (e.life - 1));
        ctx.globalAlpha = 0.45 * fade;
        D.circle(ctx, e.x, e.y, e.r, '#ff5d3d');
        D.circle(ctx, e.x, e.y, e.r * 0.6, '#ff9d4d');
        ctx.globalAlpha = 1;
      }
    }
  };

  D.particles = function (ctx, G) {
    const s = G.particles;
    for (const p of s.list) {
      if (!D.inView(G, p.x, p.y, 12)) continue;
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      if (p.shape === 'rect') {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      } else D.circle(ctx, p.x, p.y, p.size * (1 - p.t / p.life * 0.5), p.color);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    for (const t of s.texts) {
      ctx.globalAlpha = Math.max(0, 1 - t.t / t.life);
      ctx.font = 'bold ' + t.size + 'px sans-serif';
      ctx.lineWidth = 3; ctx.strokeStyle = '#111';
      ctx.strokeText(t.txt, t.x, t.y);
      ctx.fillStyle = t.color; ctx.fillText(t.txt, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  };

  // Boss-arena set piece: thorn pillars, pulsing rune stones, lit braziers.
  D.arenaSetPiece = function (ctx, G) {
    const t = G.time, dc = G.level.decor, active = G.bossActive;
    for (const r of dc.runes || []) {
      if (!D.inView(G, r.x, r.y, 60)) continue;
      const pu = 0.5 + 0.5 * Math.sin(t * 3 + r.ph);
      const c = active ? '#ff5d5d' : '#7ee06e', soft = active ? '#ff9d9d' : '#c8ff9e';
      ctx.globalAlpha = 0.22 + 0.33 * pu; D.circle(ctx, r.x, r.y, 26, c); ctx.globalAlpha = 1;
      ctx.strokeStyle = soft; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(r.x, r.y, 16 + pu * 4, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(r.x - 8, r.y); ctx.lineTo(r.x + 8, r.y);
      ctx.moveTo(r.x, r.y - 8); ctx.lineTo(r.x, r.y + 8);
      ctx.stroke();
    }
    for (const p of dc.pillars || []) {
      if (!D.inView(G, p.x, p.y - 60 * p.s, 90 * p.s)) continue;
      const sway = Math.sin(t * 1.2 + p.ph) * 2, s = p.s, tip = active ? '#ff5d5d' : '#7ee06e';
      ctx.fillStyle = '#241a2e'; ctx.fillRect(p.x - 14 * s + sway * 0.3, p.y - 110 * s, 28 * s, 120 * s);
      ctx.fillStyle = '#3a2a4a'; ctx.fillRect(p.x - 14 * s + sway * 0.3, p.y - 110 * s, 10 * s, 120 * s);
      ctx.fillStyle = '#171020';
      for (let k = 0; k < 3; k++) {
        const by = p.y - 100 * s + k * 34 * s;
        ctx.beginPath(); ctx.moveTo(p.x - 14 * s, by); ctx.lineTo(p.x - 26 * s, by + 8); ctx.lineTo(p.x - 14 * s, by + 14); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(p.x + 14 * s, by + 6); ctx.lineTo(p.x + 26 * s, by + 14); ctx.lineTo(p.x + 14 * s, by + 20); ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 0.3; D.circle(ctx, p.x, p.y - 116 * s, 15 * s, tip); ctx.globalAlpha = 1;
      D.circle(ctx, p.x + sway * 0.3, p.y - 116 * s, 7 * s, tip);
    }
    for (const b of dc.braziers || []) {
      if (!D.inView(G, b.x, b.y - 20, 120)) continue;
      const fl = Math.sin(t * 13 + b.x) * 2 + Math.sin(t * 29) * 1.5;
      ctx.fillStyle = '#3a2a1a'; ctx.fillRect(b.x - 6, b.y - 26, 12, 26);
      D.ellipse(ctx, b.x, b.y - 28, 14, 7, 0, '#5a4a2a', '#2a1f14');
      D.ellipse(ctx, b.x + fl * 0.4, b.y - 38, 8 + fl * 0.5, 13 + fl, 0, '#ff9d4d');
      D.ellipse(ctx, b.x, b.y - 36, 4, 7, 0, '#ffe9a3');
    }
  };

  // Additive world-space lights: hero glow, brazier flicker, charge, boss.
  D.lights = function (ctx, G) {
    const t = G.time;
    const lights = [{ x: G.player.x, y: G.player.y, r: 230, c: '255,220,150', a: 0.16 }];
    if (G.player.charge >= 0)
      lights.push({ x: G.player.x, y: G.player.y, r: 150 + G.player.charge * 90, c: G.player.charge > 0.5 ? '255,220,120' : '150,220,255', a: 0.25 });
    for (const b of G.level.decor.braziers || [])
      lights.push({ x: b.x, y: b.y - 30, r: 150 + Math.sin(t * 11 + b.x) * 12, c: '255,160,80', a: 0.26 });
    for (const o of G.pickups)
      if (o.kind === 'fragment') lights.push({ x: o.x, y: o.y, r: 220, c: '255,240,180', a: 0.30 });
    if (G.boss && !G.boss.dead && G.bossActive && G.boss.enraged)
      lights.push({ x: G.boss.x, y: G.boss.y, r: 200, c: '255,60,60', a: 0.20 });
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const l of lights) {
      if (!D.inView(G, l.x, l.y, l.r)) continue;
      const g = ctx.createRadialGradient(l.x, l.y, 10, l.x, l.y, l.r);
      g.addColorStop(0, 'rgba(' + l.c + ',' + l.a + ')');
      g.addColorStop(1, 'rgba(' + l.c + ',0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  };

  // Cinematic letterbox that eases in while the boss seals the arena.
  D.letterbox = function (ctx, G) {
    const k = G.letterT || 0;
    if (k <= 0.01) return;
    const e = 1 - Math.pow(1 - k, 3), h = 30 * e;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, V.Config.canvas.w, h);
    ctx.fillRect(0, V.Config.canvas.h - h, V.Config.canvas.w, h);
  };

  // Foreground fronds along the screen bottom: near-camera depth layer.
  D.foreground = function (ctx, G) {
    const vw = V.Config.canvas.w, vh = V.Config.canvas.h, t = G.time;
    ctx.save();
    for (let x = 0; x < vw; x += 24) {
      const h = D.hash(x, 7), bh = 26 + h * 46, sway = Math.sin(t * 1.6 + x * 0.05) * 6;
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = h < 0.5 ? '#0e2412' : '#12301a';
      ctx.beginPath();
      ctx.moveTo(x, vh);
      ctx.quadraticCurveTo(x + sway, vh - bh * 0.6, x + sway * 1.8, vh - bh);
      ctx.lineTo(x + 11, vh);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  };
})();

<script>
/* ===== inlined js/hud.js ===== */
(function () {
  const V = globalThis.VERDANT = globalThis.VERDANT || {};
  const H = V.HUD = {};
  const D = () => V.Draw;

  H.draw = function (ctx, G) {
    const vw = V.Config.canvas.w, vh = V.Config.canvas.h;
    if (G.state === 'title') return;
    H.bars(ctx, G);
    H.objective(ctx, G);
    if (G.bossActive && G.boss && !G.boss.dead) H.bossBar(ctx, G);
    H.companions(ctx, G);
    H.chargeRing(ctx, G);
    H.prompt(ctx, G);
    H.minimap(ctx, G);
    H.vignette(ctx, G);
    if (G.paused) H.pausedBadge(ctx, G);
    if (G.ring.open || G.ring.anim > 0) H.ring(ctx, G);
    if (V.Audio.muted) {
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right';
      ctx.fillText('muted (M)', vw - 12, vh - 12);
    }
  };

  H.bar = function (ctx, x, y, w, h, frac, fill, label) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = '#222'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = fill; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(label, x + 5, y + h - 4);
  };

  H.bars = function (ctx, G) {
    const p = G.player;
    const hpf = p.hp / p.maxhp;
    H.bar(ctx, 14, 14, 210, 18, hpf, hpf > 0.5 ? '#58c24d' : (hpf > 0.25 ? '#e0a83c' : '#e04c4c'), 'HP ' + Math.ceil(p.hp) + '/' + p.maxhp);
    H.bar(ctx, 14, 38, 210, 14, p.mp / p.maxmp, '#4d9de0', 'MP ' + Math.floor(p.mp) + '/' + p.maxmp);
    const blade = V.Combat.blade(G);
    ctx.fillStyle = '#ffd76e'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('Thornblade Lv' + blade.level + '  •  Dew ×' + G.flags.vials + '  •  Allies: ' + (G.flags.stance === 'cautious' ? 'Cautious' : 'Aggressive'), 14, 70);
    if (G.stats.casts > 0) {
      ctx.fillStyle = '#c9b8ff';
      ctx.fillText('Magic +' + Math.round((V.Magic.power(G) - 1) * 100) + '%', 14, 86);
    }
  };

  H.objective = function (ctx, G) {
    const vw = V.Config.canvas.w;
    const txt = '✦ ' + V.Level.objectiveText(G);
    ctx.font = '13px sans-serif';
    const w = Math.min(vw - 260, ctx.measureText(txt).width + 24);
    ctx.fillStyle = 'rgba(20,30,16,0.72)';
    ctx.fillRect((vw - w) / 2, 10, w, 24);
    ctx.strokeStyle = '#8a9a5b'; ctx.lineWidth = 1;
    ctx.strokeRect((vw - w) / 2, 10, w, 24);
    ctx.fillStyle = '#f0e8c8'; ctx.textAlign = 'center';
    ctx.fillText(txt, vw / 2, 27);
  };

  H.bossBar = function (ctx, G) {
    const vw = V.Config.canvas.w, b = G.boss;
    const w = 420, x = (vw - w) / 2, y = 42;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - 2, y - 2, w + 4, 22);
    ctx.fillStyle = '#2a0d0d'; ctx.fillRect(x, y, w, 18);
    ctx.fillStyle = b.enraged ? '#ff3d3d' : '#b84d4d';
    ctx.fillRect(x, y, w * (b.hp / b.maxhp), 18);
    // phase ticks at 50% and 25%
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + w * 0.5 - 1, y, 2, 18);
    ctx.fillRect(x + w * 0.75 - 1, y, 2, 18);
    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd8d8';
    ctx.fillText('GNARLMAW' + (b.enraged ? ' — ENRAGED' : ''), vw / 2, y + 14);
  };

  H.companions = function (ctx, G) {
    let y = V.Config.canvas.h - 58;
    for (const c of G.companions) {
      const name = c.kind === 'pip' ? 'Pip' : 'Moss';
      ctx.textAlign = 'left';
      if (c.ko) {
        ctx.fillStyle = '#c9b8ff'; ctx.font = 'bold 12px sans-serif';
        ctx.fillText(name + ' KO… ' + Math.ceil(c.ko) + 's', 14, y + 12);
      } else {
        H.bar(ctx, 14, y, 120, 12, c.hp / c.maxhp, c.kind === 'pip' ? '#7fd8c8' : '#6fae5a', name + ' ' + Math.ceil(c.hp));
      }
      y += 20;
    }
  };

  H.chargeRing = function (ctx, G) {
    const p = G.player;
    if (p.charge < 0 || p.dead) return;
    const sx = p.x - G.camera.x, sy = p.y - G.camera.y;
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.arc(sx, sy, p.r + 12, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = p.charge >= 1 ? '#ffffff' : (p.charge > 0.5 ? '#ffd76e' : '#9fe8ff');
    ctx.beginPath(); ctx.arc(sx, sy, p.r + 12, -Math.PI / 2, -Math.PI / 2 + p.charge * Math.PI * 2); ctx.stroke();
    if (p.charge >= V.Config.bellNeedCharge) {
      ctx.fillStyle = '#ffd76e'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('BELL-READY', sx, sy - p.r - 18);
    }
  };

  H.prompt = function (ctx, G) {
    if (G.state !== 'play' || G.ring.open) return;
    const F = G.objectiveFlags;
    let txt = '';
    if (!F.moved) txt = 'Move with WASD / arrow keys';
    else if (G.stats.hits === 0) txt = 'Attack: J / Z / click — HOLD to charge, release for a power strike';
    else if (!F.tutorial) txt = 'Slay the Nibblet! Charged hits deal up to 3× damage';
    else if (!F.ringHint) txt = 'Tab / Space: ring menu — magic, allies, dew vials';
    else if (G.level.bellsRung < 2 && G.level.gateOpen === false && Math.hypot(G.player.x - 1300, G.player.y - 400) < 420)
      txt = 'Hold ATTACK until the ring passes 50%, then release beside a Sealbell';
    else if (G.bossActive) txt = 'Dodge the striped slam zones! Shift: dash (' + (G.player.dashCd > 0 ? '…' : 'ready') + ')';
    if (!txt) return;
    ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
    const w = ctx.measureText(txt).width + 28;
    ctx.fillStyle = 'rgba(10,16,10,0.72)';
    ctx.fillRect((V.Config.canvas.w - w) / 2, V.Config.canvas.h - 34, w, 24);
    ctx.fillStyle = '#f0e8c8';
    ctx.fillText(txt, V.Config.canvas.w / 2, V.Config.canvas.h - 17);
  };

  H.minimap = function (ctx, G) {
    const W = V.Config.world, mw = 150, mh = Math.round(mw * W.h / W.w);
    const x0 = V.Config.canvas.w - mw - 12, y0 = V.Config.canvas.h - mh - 12;
    const sx = (x) => x0 + (x / W.w) * mw, sy = (y) => y0 + (y / W.h) * mh;
    ctx.fillStyle = 'rgba(8,14,8,0.72)'; ctx.fillRect(x0 - 4, y0 - 4, mw + 8, mh + 8);
    ctx.fillStyle = '#1d3a24'; ctx.fillRect(x0, y0, mw, mh);
    ctx.fillStyle = '#6b5a3a'; ctx.fillRect(sx(1150), sy(280), (300 / W.w) * mw, (1400 / W.h) * mh);
    const dot = (x, y, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(sx(x), sy(y), r, 0, Math.PI * 2); ctx.fill(); };
    for (const pr of G.props) {
      if (pr.gone) continue;
      if (pr.kind === 'bell' && !pr.rung) dot(pr.x, pr.y, 3, '#ffd76e');
      if (pr.kind === 'chest' && !pr.opened) dot(pr.x, pr.y, 3, '#ff9d4d');
    }
    for (const e of G.enemies) if (!e.dead) dot(e.x, e.y, 2, '#ff6e6e');
    if (G.bossActive && G.boss && !G.boss.dead) dot(G.boss.x, G.boss.y, 4, '#ff3d3d');
    for (const c of G.companions) if (!c.ko) dot(c.x, c.y, 2, '#7ee06e');
    dot(G.player.x, G.player.y, 3, '#ffffff');
    // view rect
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
    ctx.strokeRect(sx(G.camera.x), sy(G.camera.y), (V.Config.canvas.w / W.w) * mw, (V.Config.canvas.h / W.h) * mh);
  };

  H.pausedBadge = function (ctx, G) {
    const vw = V.Config.canvas.w;
    ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
    const txt = '❚❚  PAUSED — P to resume';
    const w = ctx.measureText(txt).width + 30;
    ctx.fillStyle = 'rgba(10,16,10,0.8)';
    ctx.fillRect((vw - w) / 2, 96, w, 28);
    ctx.strokeStyle = '#8a9a5b'; ctx.lineWidth = 1;
    ctx.strokeRect((vw - w) / 2, 96, w, 28);
    ctx.fillStyle = '#ffd76e';
    ctx.fillText(txt, vw / 2, 115);
  };

  H.vignette = function (ctx, G) {
    const vw = V.Config.canvas.w, vh = V.Config.canvas.h;
    if ((G.hitFlash || 0) > 0) { // impact flash (charged hits, slams, boss events)
      ctx.fillStyle = 'rgba(255,250,235,' + (G.hitFlash * 0.22).toFixed(3) + ')';
      ctx.fillRect(0, 0, vw, vh);
    }
    if (G.castVignette > 0) {
      ctx.globalAlpha = Math.min(0.55, G.castVignette * 0.55);
      const g = ctx.createRadialGradient(vw / 2, vh / 2, vh * 0.3, vw / 2, vh / 2, vh * 0.75);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(150,220,255,0.9)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
      ctx.globalAlpha = 1;
    }
    const hpf = G.player.hp / G.player.maxhp;
    if (G.state === 'play' && hpf < 0.3 && !G.player.dead) {
      ctx.globalAlpha = 0.25 + 0.15 * Math.sin(G.time * 6);
      const g = ctx.createRadialGradient(vw / 2, vh / 2, vh * 0.3, vw / 2, vh / 2, vh * 0.75);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(220,40,40,0.9)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
      ctx.globalAlpha = 1;
    }
  };

  H.ring = function (ctx, G) {
    const vw = V.Config.canvas.w, vh = V.Config.canvas.h;
    const r = G.ring, cx = vw / 2, cy = vh / 2;
    const a = Math.max(0.001, r.anim);
    ctx.globalAlpha = 0.55 * a;
    ctx.fillStyle = '#060a06'; ctx.fillRect(0, 0, vw, vh);
    ctx.globalAlpha = a;
    const opts = V.Ring.options(G);
    const back = 1 + 2.70158 * Math.pow(a - 1, 3) + 1.70158 * Math.pow(a - 1, 2); // easeOutBack pop
    const R = 118 * (0.6 + 0.4 * Math.max(0.55, back));
    // spokes + orbs
    opts.forEach((o, i) => {
      const ang = -Math.PI / 2 + (i / opts.length) * Math.PI * 2;
      const ox = cx + Math.cos(ang) * R, oy = cy + Math.sin(ang) * R;
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ox, oy); ctx.stroke();
      const sel = i === r.sel;
      if (sel) { ctx.globalAlpha = a * 0.35; D().circle(ctx, ox, oy, 36, '#ffffff'); ctx.globalAlpha = a; }
      ctx.globalAlpha = a * (o.disabled ? 0.35 : 1);
      D().circle(ctx, ox, oy, 28, '#101a10', o.color, sel ? 4 : 2);
      // glyph per option
      ctx.fillStyle = o.color; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
      const glyph = o.id.indexOf('spell:') === 0 ? '✦' : { magic: '✦', stance: '⚔', dew: '❚', resume: '▶', back: '◀' }[o.id] || '•';
      ctx.fillText(glyph, ox, oy + 6);
      ctx.font = 'bold 12px sans-serif';
      ctx.fillStyle = o.disabled ? '#888' : '#fff';
      ctx.fillText(o.label, ox, oy + 46);
      if (o.sub) { ctx.font = '11px sans-serif'; ctx.fillStyle = '#bcd0b0'; ctx.fillText(o.sub, ox, oy + 60); }
      ctx.globalAlpha = a;
    });
    D().circle(ctx, cx, cy, 30, '#101a10', '#e8e0c8', 2);
    ctx.fillStyle = '#e8e0c8'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(r.menu === 'magic' ? 'MAGIC' : 'RING', cx, cy + 4);
    if (r.msg && r.msgT > 0) {
      ctx.fillStyle = '#ffd76e'; ctx.font = 'bold 14px sans-serif';
      ctx.fillText(r.msg, cx, cy + R + 78);
    } else {
      ctx.fillStyle = '#8fa08a'; ctx.font = '12px sans-serif';
      ctx.fillText('arrows / mouse • Enter: choose • Esc: close', cx, cy + R + 78);
    }
    ctx.globalAlpha = 1;
  };

  // ---- DOM overlay screens (title / defeat / victory) ----
  H._el = function () {
    if (typeof document === 'undefined') return null;
    return document.getElementById('screen');
  };
  H.show = function (html) {
    const el = H._el();
    if (!el) return;
    el.innerHTML = html;
    el.classList.remove('hidden');
  };
  H.hide = function () {
    const el = H._el();
    if (!el) return;
    el.classList.add('hidden');
  };
  H.titleScreen = function (onStart) {
    H.show(
      '<div class="panel"><h1>Echoes of the Verdant Seal</h1>' +
      '<p class="sub">A Thornwild Glade tale — Wren the seedwarden, Pip the spriteling, and Moss the mossling pup.</p>' +
      '<div class="controls"><b>Move</b> WASD / arrows &nbsp;•&nbsp; <b>Attack</b> J / Z / click (hold = charge) &nbsp;•&nbsp; <b>Dash</b> Shift<br>' +
      '<b>Ring menu</b> Tab / Space &nbsp;•&nbsp; <b>Pause</b> P &nbsp;•&nbsp; <b>Mute</b> M<br>' +
      'Ring: arrows+Enter or mouse &nbsp;•&nbsp; generative music reacts to the boss</div>' +
      '<p>Ring both Sealbells with charged strikes, face Gnarlmaw, and claim the Seed.</p>' +
      '<button id="btn-start">Enter the Glade</button></div>'
    );
    if (typeof document !== 'undefined') {
      const b = document.getElementById('btn-start');
      if (b) b.addEventListener('click', onStart);
    }
  };
  H.deadScreen = function (G, onRetry) {
    const s = G.stats, mm = Math.floor(s.time / 60), ss = Math.floor(s.time % 60);
    H.show(
      '<div class="panel"><h1 class="dim">The glade dims…</h1>' +
      '<p>Wren falls, but the forest remembers. Retry from <b>' + G.checkpoint.label + '</b> at full health.</p>' +
      '<div class="results">' +
      '<div>Survived <b>' + mm + ':' + String(ss).padStart(2, '0') + '</b></div>' +
      '<div>Foes felled <b>' + s.kills + '</b></div>' +
      '<div>Blade level <b>' + V.Combat.blade(G).level + '</b></div>' +
      '<div>Spells cast <b>' + s.casts + '</b></div></div>' +
      '<p class="sub">Last trail: ' + V.Level.objectiveText(G) + '</p>' +
      '<button id="btn-retry">Rise again</button>' +
      '<p class="sub">or press Enter</p></div>'
    );
    if (typeof document !== 'undefined') {
      const b = document.getElementById('btn-retry');
      if (b) b.addEventListener('click', onRetry);
    }
  };
  H.pauseScreen = function (G, onResume) {
    H.show(
      '<div class="panel"><h1>Paused</h1>' +
      '<p class="sub">' + V.Level.objectiveText(G) + '</p>' +
      '<div class="controls"><b>Move</b> WASD / arrows &nbsp;•&nbsp; <b>Attack</b> J / Z / click (hold = charge) &nbsp;•&nbsp; <b>Dash</b> Shift<br>' +
      '<b>Ring menu</b> Tab / Space &nbsp;•&nbsp; <b>Pause</b> P &nbsp;•&nbsp; <b>Mute</b> M</div>' +
      '<button id="btn-resume">Resume</button>' +
      '<p class="sub">or press P</p></div>'
    );
    if (typeof document !== 'undefined') {
      const b = document.getElementById('btn-resume');
      if (b) b.addEventListener('click', onResume);
    }
  };
  H.winScreen = function (G, onAgain) {
    const s = G.stats, mm = Math.floor(s.time / 60), ss = Math.floor(s.time % 60);
    H.show(
      '<div class="panel"><h1 class="gold">The Verdant Seal holds!</h1>' +
      '<p>Wren lifts the Seed fragment; light threads back through the thorns.</p>' +
      '<div class="results">' +
      '<div>Time <b>' + mm + ':' + String(ss).padStart(2, '0') + '</b></div>' +
      '<div>Foes felled <b>' + s.kills + '</b></div>' +
      '<div>Damage taken <b>' + s.damageTaken + '</b></div>' +
      '<div>Charge kills <b>' + s.chargeKills + '</b></div>' +
      '<div>Spells cast <b>' + s.casts + '</b></div>' +
      '<div>Blade level <b>' + V.Combat.blade(G).level + '</b></div></div>' +
      '<button id="btn-again">Play again</button>' +
      '<p class="sub">or press Enter</p></div>'
    );
    if (typeof document !== 'undefined') {
      const b = document.getElementById('btn-again');
      if (b) b.addEventListener('click', onAgain);
    }
  };
})();

</script>
<script>
/* ===== inlined js/main.js ===== */
(function () {
  const V = globalThis.VERDANT = globalThis.VERDANT || {};
  const M = V.Main = {};
  const FIXED = 1 / 60;

  M.createGame = function () {
    const G = {
      state: 'title', time: 0, deadT: 0,
      player: null, companions: [], enemies: [], projectiles: [], pickups: [], props: [], effects: [],
      particles: V.Particles.create(),
      ring: V.Ring.create(),
      level: null, camera: { x: 0, y: 0 },
      flags: { ember: false, stance: 'aggro', vials: 2 },
      objectiveFlags: { tutorial: false, west: false, east: false, bridge: false, bossDown: false, moved: false, ringHint: false, fragmentSpawned: false },
      stats: { time: 0, kills: 0, damageTaken: 0, chargeKills: 0, casts: 0, hits: 0 },
      checkpoint: { x: V.Level.start.x, y: V.Level.start.y, label: 'Glade edge' },
      boss: null, bossActive: false, castVignette: 0,
      paused: false, stateT: 0, letterT: 0, hitFlash: 0, _camSnap: true,
    };
    G.player = V.Entities.makePlayer(V.Level.start.x, V.Level.start.y);
    G.companions = [
      V.Entities.makePip(G.player.x - 50, G.player.y + 40),
      V.Entities.makeMoss(G.player.x + 50, G.player.y + 40),
    ];
    V.Level.create(G);
    M.centerCamera(G);
    return G;
  };

  M.centerCamera = function (G, dt) {
    const vw = V.Config.canvas.w, vh = V.Config.canvas.h, W = V.Config.world;
    let tx, ty;
    if (G.state === 'title') { // slow drift over the glade behind the title
      tx = V.Level.start.x + Math.cos(G.time * 0.12) * 80 - vw / 2;
      ty = V.Level.start.y + Math.sin(G.time * 0.09) * 60 - vh / 2;
    } else { // eased follow + slight lookahead toward facing
      const p = G.player, lh = p.moving ? 26 : 0;
      tx = p.x + Math.cos(p.face) * lh - vw / 2;
      ty = p.y + Math.sin(p.face) * lh - vh / 2;
    }
    tx = Math.max(0, Math.min(W.w - vw, tx));
    ty = Math.max(0, Math.min(W.h - vh, ty));
    if (dt === undefined || G._camSnap) { G.camera.x = tx; G.camera.y = ty; G._camSnap = false; }
    else {
      const k = 1 - Math.exp(-6 * dt);
      G.camera.x += (tx - G.camera.x) * k;
      G.camera.y += (ty - G.camera.y) * k;
    }
  };

  // One fixed update step. Pure logic — safe to drive headless.
  M.tick = function (G, dt) {
    G.time += dt;
    const inp = V.Input;
    if (inp.pressed('mute')) {
      const muted = V.Audio.toggleMute();
      if (G.state === 'play') V.Particles.text(G, G.player.x, G.player.y - 30, muted ? 'Muted' : 'Sound on', '#ccc', 13);
    }
    if (G.state === 'title') {
      V.Particles.update(G, dt);
      V.Particles.ambient(G, dt);
      M.centerCamera(G, dt);
      V.Audio.setMood('title');
      if (inp.pressed('confirm') || inp.mouse.clicked) M.beginPlay(G);
      return;
    }
    if (G.state === 'win' || G.state === 'dead') {
      V.Particles.update(G, dt);
      G.stateT += dt;
      V.Audio.setMood('title');
      // Keyboard shortcut past the end screens (1s guard against instant skip).
      if (G.stateT > 1 && inp.pressed('confirm')) {
        if (G.state === 'dead') M.retry(G); else M.reset(G);
      }
      return;
    }
    // state === 'play'
    if (inp.pressed('pause') && !G.player.dead) {
      G.paused = !G.paused;
      if (G.paused) {
        V.Audio.chargeStop();
        V.Audio.setDucked(true);
        V.HUD.pauseScreen(G, () => { G.paused = false; V.HUD.hide(); V.Audio.setDucked(false); });
      } else { V.HUD.hide(); V.Audio.setDucked(false); }
    }
    if (G.paused) return;
    // Tab/Space share bindings with cancel/confirm, so detect their physical
    // edges directly: all three documented keys open the ring when closed.
    // (When open, K toggles shut here; Tab/Esc back out via Ring.update.)
    if ((inp.pressed('ring') || (!G.ring.open && (inp.pressedCode('Tab') || inp.pressedCode('Space')))) && !G.player.dead) {
      const was = G.ring.open;
      V.Ring.toggle(G);
      if (G.ring.open) G.objectiveFlags.ringHint = true;
      if (!was && G.ring.open) return; // opened: skip nav + world this frame
    }
    const wasOpen = G.ring.open;
    V.Ring.update(G, dt);
    // Eat the closing keypress edge so it can't start a charge the same frame.
    if (wasOpen && !G.ring.open) { inp.pressedActions.clear(); inp.pressedCodes.clear(); inp.virtualPressed.clear(); inp.mouse.clicked = false; }
    if (G.ring.open) return; // ring pauses the world
    // hit-stop: freeze world briefly
    if (G.particles.hitstop > 0) { G.particles.hitstop -= dt; return; }
    let sdt = dt;
    if (G.particles.slowmo > 0) { G.particles.slowmo -= dt; sdt = dt * 0.35; }
    G.stats.time += sdt;
    G.castVignette = Math.max(0, G.castVignette - dt);
    G.hitFlash = Math.max(0, G.hitFlash - dt * 2.2);
    G.letterT += (((G.bossActive && !G.player.dead) ? 1 : 0) - G.letterT) * Math.min(1, dt * 2.5);
    V.Audio.setMood(G.bossActive ? 'boss' : 'calm');
    if (!G.objectiveFlags.moved && (inp.down('up') || inp.down('down') || inp.down('left') || inp.down('right')))
      G.objectiveFlags.moved = true;
    if (G.player.dead) {
      G.deadT -= dt;
      V.Entities.update(G, sdt);
      V.Particles.update(G, sdt);
      if (G.deadT <= 0) {
        G.state = 'dead';
        G.stateT = 0;
        V.Audio.sfx('lose');
        V.HUD.deadScreen(G, () => M.retry(G));
      }
      return;
    }
    V.Combat.updatePlayer(G, sdt);
    V.Entities.update(G, sdt);
    V.Magic.update(G, sdt);
    V.Level.update(G, sdt);
    V.Particles.update(G, sdt);
    V.Particles.ambient(G, sdt);
    M.centerCamera(G, dt);
  };

  M.beginPlay = function (G) {
    if (G.state !== 'title') return;
    G.state = 'play';
    G.stateT = 0;
    G._camSnap = true; M.centerCamera(G);
    V.Audio.unlock();
    V.Audio.setMood('calm');
    V.HUD.hide();
    V.Particles.text(G, G.player.x, G.player.y - 40, 'Wren wakes…', '#f0e8c8', 16);
    V.Particles.text(G, G.companions[0].x, G.companions[0].y - 30, 'Pip: This way! Stick close!', '#9fe8ff', 14);
  };

  M.playerDown = function (G) {
    if (G.player.dead && G.deadT > 0) return;
    G.deadT = 1.4;
    V.Particles.burst(G, G.player.x, G.player.y, 24, { color: '#ff6e6e', speed: 240, life: 0.7 });
    V.Particles.shake(G, 0.8);
  };

  M.bossDown = function (G) {
    const b = G.boss;
    G.bossActive = false;
    G.objectiveFlags.bossDown = true;
    G.stats.kills++;
    V.Audio.sfx('enemyDie');
    V.Audio.sfx('gate');
    V.Particles.shake(G, 0.9);
    G.hitFlash = 1;
    V.Particles.burst(G, b.x, b.y, 60, { color: '#7ee06e', speed: 340, life: 1.0, size: 6 });
    V.Particles.burst(G, b.x, b.y, 30, { color: '#ffe9a3', speed: 240, life: 0.9 });
    V.Particles.text(G, b.x, b.y - 70, 'Gnarlmaw defeated!', '#ffe9a3', 24);
    // clear remaining adds + enemy orbs
    for (const e of G.enemies) {
      if (!e.dead) { e.dead = true; V.Particles.burst(G, e.x, e.y, 10, { color: '#7ee06e', speed: 180, life: 0.5 }); }
    }
    G.projectiles.length = 0;
  };

  M.winGame = function (G) {
    if (G.state !== 'play') return;
    G.state = 'win';
    G.stateT = 0;
    V.Audio.sfx('win');
    V.Particles.burst(G, G.player.x, G.player.y, 60, { color: '#ffe9a3', speed: 300, life: 1.2 });
    V.HUD.winScreen(G, () => M.reset(G));
  };

  M.phaseStartFrac = function (b) {
    const f = b.hp / b.maxhp;
    if (f > 0.5) return 1;
    if (f > 0.25) return 0.5;
    return 0.25;
  };

  M.retry = function (G) {
    const cp = G.checkpoint;
    const p = G.player;
    p.dead = false; p.hp = p.maxhp; p.mp = p.maxmp;
    p.x = cp.x; p.y = cp.y; p.charge = -1; p.ifr = 1; p.dashT = 0; p.dashCd = 0;
    V.Audio.chargeStop();
    G.companions[0].x = cp.x - 50; G.companions[0].y = cp.y + 40;
    G.companions[1].x = cp.x + 50; G.companions[1].y = cp.y + 40;
    for (const c of G.companions) { c.hp = c.maxhp; c.ko = 0; }
    G.enemies.length = 0; G.projectiles.length = 0; G.effects.length = 0;
    G.ring.open = false; G.ring.anim = 0;
    G.state = 'play';
    G.paused = false; G.stateT = 0; G.hitFlash = 0;
    V.Audio.setDucked(false);
    V.HUD.hide();
    // Boss reset to phase start when retrying at the arena.
    if (cp.label === 'Arena gate' && G.level.bossStarted && !G.objectiveFlags.bossDown && G.boss) {
      const b = G.boss;
      b.dead = false;
      b.hp = Math.ceil(b.maxhp * M.phaseStartFrac(b));
      b.mode = 'chase'; b.modeT = 0; b.slamCd = 2;
      b.x = V.Level.arenaCx; b.y = V.Level.arenaCy - 90;
      b.addsSpawned = b.hp / b.maxhp <= 0.5;
      b.enraged = b.hp / b.maxhp < 0.25;
      G.bossActive = true;
      // re-arm the mid-fight adds only if the phase genuinely restarts above them
      V.Particles.text(G, p.x, p.y - 40, 'Gnarlmaw stirs anew…', '#ff9d9d', 16);
    } else {
      G.bossActive = false;
      // Re-arm the encounter guarding the checkpoint's zone so retry replays the fight.
      if (cp.label === 'West clearing') G.level.encA = 0;
      if (cp.label === 'East clearing') G.level.encB = 0;
      if (cp.label === 'Old bridge') G.level.ambush = 0;
    }
    G._camSnap = true; M.centerCamera(G);
    V.Particles.text(G, p.x, p.y - 40, 'Back on your feet!', '#7ee06e', 16);
  };

  M.reset = function (G) {
    const fresh = M.createGame();
    fresh.state = 'play';
    for (const k of Object.keys(fresh)) G[k] = fresh[k];
    G.time = 0;
    V.HUD.hide();
  };

  M.render = function (ctx, G) {
    const vw = V.Config.canvas.w, vh = V.Config.canvas.h;
    ctx.fillStyle = '#060a06'; ctx.fillRect(0, 0, vw, vh);
    ctx.save();
    const sh = V.Particles.shakeOffset(G);
    ctx.translate(Math.round(sh.x), Math.round(sh.y));
    V.Draw.world(ctx, G);
    ctx.restore();
    V.HUD.draw(ctx, G);
  };

  // Browser boot.
  M.start = function (canvasId) {
    const canvas = document.getElementById(canvasId || 'game');
    canvas.width = V.Config.canvas.w; canvas.height = V.Config.canvas.h;
    const ctx = canvas.getContext('2d');
    V.Input.init(canvas);
    const G = M.createGame();
    M.game = G;
    V.HUD.titleScreen(() => { V.Audio.unlock(); M.beginPlay(G); });
    canvas.addEventListener('mousedown', () => V.Audio.unlock(), { once: true });
    window.addEventListener('keydown', () => V.Audio.unlock(), { once: true });
    let last = performance.now(), acc = 0, emaMs = 16;
    function frame(now) {
      let dt = (now - last) / 1000;
      last = now;
      // Adaptive quality: shed ambient particles first if frames run long.
      emaMs = emaMs * 0.94 + Math.min(50, dt * 1000) * 0.06;
      V.Particles.quality = emaMs > 19 ? 0.45 : (emaMs > 17 ? 0.7 : 1);
      if (dt > 0.25) dt = 0.25;
      acc += dt;
      let steps = 0;
      while (acc >= FIXED && steps < 5) { M.tick(G, FIXED); acc -= FIXED; steps++; }
      if (steps === 5) acc = 0;
      M.render(ctx, G);
      V.Input.endFrame();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    return G;
  };
})();

</script>
<script>
  window.addEventListener('DOMContentLoaded', function () { VERDANT.Main.start('game'); });
</script>
</body>
</html>
