<!--
Source Information
Date: 2026-10-29 15:27 (America/Vancouver)
Game Title: Far Feral Five. Randomly chosen from 50 candidates using Python secrets.randbelow.
Source: Far Cry 5. Original, unofficial spiritual successor; no source assets, dialogue, characters or music reused.
Tech: Three.js r180 / 0.180.0, strict WebGPU with fallback disabled; Rapier 3D 0.19.3 WebAssembly; Gamepad API; native ES modules and browser APIs; esbuild 0.28.2 for single-file packaging.
Art Direction: Procedural cel shading with quantized TSL lighting, faceted Montana landscape, illustrated signage and cinematic controller-first UI.
Animation: Procedural articulated character and animal gait, recoil, vehicle wheels, birds, wind, flags and particle effects.
Audio: Original procedural Web Audio plucked score, ambience and synthesized effects. Optional browser SpeechSynthesis radio voices; available voice identity unknown and browser-dependent. No recorded music or voice actors.
Online: AI Hub Session Protocol v1, unmodified client 1.3.0. Synchronized 1-4 player parallel resistance score challenge with seed, clock, progress, results and player-leave handling; separate worlds. No standalone lobby or shared-world co-op.
Testing: Efficient targeted checks; 36 full-mission integration checks; 24/24 upstream Hub checks including host leave; standalone keyboard/standard-pad checks; feature checks; eight WebKit phone/tablet layouts; rendered WebGPU at 960x600, 2560x1080 and 640x960. Screenshots inspected. No performance benchmark or FPS target. WebKit tested the required-WebGPU state and menus, not 3D gameplay. Real iOS Safari unknown/unavailable.
Environment: Codex CLI (headless); Linux, WSL2 Ubuntu 26.04 per supplied environment; end-user browser unknown. Automated test engines: Chromium and WebKit.
Model: OpenAI, gpt-6.1-sol, reasoning effort ultra.
Usage: Estimated API cost in USD unknown; total tokens in K/M unknown; breakdown unknown. Session time approximately 36 minutes.

Testing Feedback
Issues caught by testing and code review: 17, all corrected; four potentially critical/game-breaking (software WebGPU blank rendering, guards inside solid buildings, obstructed windscreen, vehicle boundary trap).
Most helpful test: Upstream AI Hub harness; it exposed input/menu lifecycle failures and verified results/end behavior.
Least helpful test: Adapter availability alone; a valid adapter did not establish that frames rendered.
Final results: 36/36 mission checks and 24/24 Hub checks passed with zero JavaScript/protocol errors. Attract started after 10.21 seconds and exited on input. Responsive screenshots had zero horizontal overflow. Physical DualSense hardware unknown/not tested.

Engine Feedback
Liked most: Three.js procedural geometry and TSL materials make a coherent original cel-shaded world practical; Rapier provides useful character sweeps and rigid bodies.
Stuck or guessed wrong: I initially treated WebGPU adapter availability as evidence of working rendering. Software-driver rendering needed the correct Graphite flags and a paced GPU queue. Polling input behind GPU completion then missed short taps; input/simulation now run independently.
Most important custom work: Perception AI, mission progression, combat, contextual controller interactions, checkpoints and the companion.
Hardest part: Keeping input, physics, camera, simulation and asynchronous rendering in agreement.
Remove or overhaul: Implicit backend fallback selection and opaque device-loss diagnostics; this build explicitly disables fallback.
One desired engine change: A reusable controller-first character/camera/interaction toolkit with explicit render scheduling.

Prompt Feedback
Liked most: Concrete controller UX, pinned technology, deployment and attract-mode requirements.
Confusing: The boundary of a feature-complete spiritual successor is open-ended. This demo defines a complete three-act county-liberation story plus exploration and score sessions.
Hardest: Joining the systemic combat, driving, ally, stealth and narrative routes into a coherent single-file vertical slice.
One additional test: A full mission on a physical DualSense with a native WebGPU PC connected to a TV-distance display.

-->
