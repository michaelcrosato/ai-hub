const payload = {"modules": {"content.js": "/** Historical reference dates are distinct from the game's alternate-history unlock dates.\n * Prices, resource units, dependencies, product markets and risk scores are game abstractions.\n * Source links point to primary papers or their original institutional archives. */\nexport const ERAS = [\n  {id:0, start:1943, end:1956, name:'Before intelligence', short:'Prologue', color:'#9faca0', grant:1, blurb:'Logic, artificial neurons, and feedback. Read the foundations in the codex.'},\n  {id:1, start:1956, end:1974, name:'The Golden Age', short:'Golden Age', color:'#738773', grant:1, blurb:'A room, a blackboard, and an unreasonable idea. Can a machine learn?'},\n  {id:2, start:1974, end:1980, name:'The First AI Winter', short:'First Winter', color:'#869ba4', grant:.30, blurb:'Promises outran the hardware. Grants shrink; useful products keep the lights on.'},\n  {id:3, start:1980, end:1987, name:'The Expert Systems Boom', short:'Expert Systems', color:'#918876', grant:1.2, blurb:'Knowledge becomes a business. Rules pay the bills, but maintaining them is expensive.'},\n  {id:4, start:1987, end:1993, name:'The Second AI Winter', short:'Second Winter', color:'#8897a5', grant:.38, blurb:'The specialist hardware market contracts. Adapt, downsize, or disappear.'},\n  {id:5, start:1993, end:2012, name:'The Statistical Age', short:'Statistical Learning', color:'#72929c', grant:1.3, blurb:'Stop writing every rule. Learn the patterns hiding in a connected world.'},\n  {id:6, start:2012, end:2023, name:'The Deep Learning Revolution', short:'Deep Learning', color:'#668ca8', grant:1.7, blurb:'Data, accelerators, and gradients meet. Scale changes what is practical.'},\n  {id:7, start:2023, end:2030, name:'Generative & Scaling', short:'Generative AI', color:'#8c8bad', grant:1.9, roadmap:true, blurb:'Expansion roadmap. Historical foundations; future outcomes are not predetermined.'},\n  {id:8, start:2030, end:2045, name:'The AGI Race', short:'AGI Race', color:'#a39bc0', grant:2, roadmap:true, speculative:true, blurb:'Speculative scenario: autonomous research, compute sovereignty, and uncertain capabilities.'},\n  {id:9, start:2045, end:2070, name:'Alignment & Superintelligence', short:'Alignment', color:'#b3a0bd', grant:2, roadmap:true, speculative:true, blurb:'Speculative scenario: corrigibility, governance, and the consequences of delegating power.'},\n  {id:10, start:2070, end:2151, name:'Beyond the Singularity', short:'Post-Singularity', color:'#b5a4d0', grant:2, roadmap:true, speculative:true, blurb:'Speculative scenario, not a forecast: emulation, exotic compute, and interstellar exploration.'}\n];\nconst tech = (id,name,year,branch,prereqs,compute,data,work,cost,lesson,eli5,source,authors,note='') => ({id,name,year,branch,prereqs,compute,data,work,cost,lesson,eli5,source,authors,note});\nexport const TECHS = [\n tech('neuron','The artificial neuron',1943,'Theory',[],0,0,0,0,'perceptron','A tiny logical switch receives several signals and turns on when their combined input crosses a threshold. McCulloch and Pitts showed how networks of these idealized switches could represent logical operations. This is a mathematical model, not a complete model of a biological brain.','https://doi.org/10.1007/BF02478259','McCulloch & Pitts','Foundation, already in your archive. The 1936 Turing machine predates this era.'),\n tech('logic','Logic Theorist',1956,'Symbolic AI',['neuron'],.4,80,22,2200,'perceptron','Instead of checking every possible proof, a program uses rules and promising shortcuts to search for one. Logic Theorist explored symbolic reasoning: manipulate representations of statements, then test whether the steps form a valid proof. A useful heuristic saves time, but is not a guarantee that a solution will be found.','https://doi.org/10.1109/TIT.1956.1056797','Newell & Simon','The perceptron lab is a contrasting demonstration of learned versus hand-written rules, not a simulation of theorem proving.'),\n tech('perceptron','The perceptron',1958,'Neural networks',['neuron'],.7,150,28,2800,'perceptron','A perceptron scores an example by multiplying each input by a weight and adding a bias. If its prediction is wrong, it nudges those weights. In two dimensions, its decision boundary is a straight line. Some patterns, such as XOR, cannot be separated by one line, however long you train.','https://doi.org/10.1037/h0042519','Frank Rosenblatt','The 1958 paper followed earlier 1957 work. Our threshold lesson uses the standard perceptron update.'),\n tech('adaline','ADALINE',1960,'Neural networks',['perceptron'],1.0,350,38,3600,'perceptron','ADALINE learns a weighted sum too, but its learning rule minimizes squared error using the continuous output before thresholding. The size of the error therefore matters, not just whether the classification was wrong. It is an early example of learning by following an error gradient.','https://isl.stanford.edu/~widrow/papers/c1960adaptiveswitching.pdf','Widrow & Hoff','The shared lesson illustrates linear boundaries; its update button demonstrates a perceptron, not the ADALINE rule.'),\n tech('eliza','ELIZA',1966,'Symbolic AI',['logic'],1.2,500,44,4200,'attention','ELIZA recognizes patterns in text and uses scripted transformations to form replies. Its DOCTOR script echoed a style of psychotherapeutic questioning. The experience could feel meaningful even though the program had no understanding of the person. A fluent reply is not evidence of comprehension or clinical competence.','https://doi.org/10.1145/365153.365168','Joseph Weizenbaum','The attention lab is a modern contrast: ELIZA did not use attention. The fictional product is a disclosed demonstration, not therapy.'),\n tech('expert','Rule-based expert systems',1980,'Symbolic AI',['logic','eliza'],4,2500,82,8000,'attention','An expert system stores domain knowledge as explicit rules and follows those rules to make recommendations. R1 configured computer orders at DEC. Narrow expertise can be valuable, but collecting and maintaining thousands of rules is hard, and an unfamiliar case may defeat the system.','https://doi.org/10.1016/0004-3702(82)90021-2','John McDermott','R1 deployed in 1980; the cited journal article appeared in 1982. Curriculum links are not claims of strict historical dependency.'),\n tech('backprop','Backpropagation',1986,'Neural networks',['adaline'],6,3500,90,9200,'perceptron','A multilayer network makes a prediction; a loss measures its error. Backpropagation applies the chain rule to work backward through the network and calculate how every weight contributed. An optimizer uses those gradients to change the weights. Hidden layers can learn representations a single straight-line classifier cannot.','https://doi.org/10.1038/323533a0','Rumelhart, Hinton & Williams','The 1986 paper popularized this approach; backpropagation has earlier mathematical and computational antecedents. The lesson shows why one layer is limited.'),\n tech('qlearning','Q-learning',1989,'Agents',['adaline'],7,4500,94,8500,'perceptron','An agent learns how useful an action is by trying it, observing a reward, and revising its estimate of future return. Q-learning learns action values without first learning a model of the world. Maximizing a specified reward does not ensure that the reward describes what people actually wanted.','https://doi.org/10.1007/BF00992698','Watkins & Dayan','Watkins introduced Q-learning in his 1989 thesis; this is the 1992 convergence paper. Lesson: a linear function approximator, not full Q-learning.'),\n tech('svm','Support-vector machines',1995,'Statistical learning',['adaline'],10,6500,100,11000,'perceptron','Many lines may separate two groups. A support-vector machine chooses a boundary with a wide margin to the closest examples. Kernels can compare examples as though they lived in a richer feature space. Good features and a well-chosen objective can outperform simply making a model larger.','https://doi.org/10.1007/BF00994018','Cortes & Vapnik','The linear-boundary lesson illustrates separation, not the SVM optimization algorithm.'),\n tech('lstm','Long short-term memory',1997,'Sequence models',['backprop'],13,9000,110,12500,'attention','A recurrent network carries information from one step of a sequence to the next. An LSTM adds gates that control what to keep, read, and forget, helping gradients and information persist over longer spans. It processes sequences recurrently; it is not an attention-only transformer.','https://doi.org/10.1162/neco.1997.9.8.1735','Hochreiter & Schmidhuber','The attention lab contrasts later direct token-to-token access with recurrent memory.'),\n tech('lenet','LeNet-5',1998,'Computer vision',['backprop'],14,12000,120,14000,'cnn','A small filter slides across an image and looks for the same local feature everywhere. Stacking convolution and subsampling layers lets later layers combine simple patterns into more complex shapes. LeNet-5 applied this approach to document recognition, including handwritten digits.','https://doi.org/10.1109/5.726791','LeCun, Bottou, Bengio & Haffner','Earlier convolutional networks and LeNet versions predate the 1998 LeNet-5 paper.'),\n tech('pagerank','PageRank',1998,'Statistical learning',['logic'],12,18000,112,14500,'attention','A web page receives importance from links pointing to it, especially links from other important pages. Repeatedly passing a score through the link graph gives a ranking. The random-surfer interpretation includes occasional jumps, so isolated loops do not trap all the importance.','http://infolab.stanford.edu/~backrub/google.html','Brin & Page','Attention is used as a visual analogy for weighted connections, not as the PageRank algorithm.'),\n tech('alexnet','The AlexNet moment',2012,'Computer vision',['lenet'],35,50000,155,22000,'cnn','A deeper convolutional network, trained with GPUs on a large labeled image dataset, made a major jump in ImageNet classification. Architecture, data, hardware, and training techniques worked together. It was not the invention of neural networks, convolution, or backpropagation.','https://papers.nips.cc/paper/4824-imagenet-classification-with-deep-convolutional-neural-networks','Krizhevsky, Sutskever & Hinton','A compute-heavy implementation milestone, not a prerequisite for the invention of attention.'),\n tech('attention','Learning to attend',2014,'Sequence models',['lstm'],32,45000,145,21000,'attention','When producing a translated word, a model can look back at different parts of the input instead of squeezing the entire sentence into one fixed summary. Attention assigns weights to those parts and blends their information. The weights depend on the current context.','https://arxiv.org/abs/1409.0473','Bahdanau, Cho & Bengio','Preprint 2014, ICLR 2015. The lesson uses later scaled dot-product attention, not the original additive formulation.'),\n tech('transformer','Attention is all you need',2017,'Sequence models',['attention'],65,100000,210,34000,'attention','A transformer uses attention to exchange information between token representations. Queries and keys determine weights; values supply the information to combine. Multiple heads can capture different relationships. Positions must also be represented because attention alone does not know the order of the sequence.','https://arxiv.org/abs/1706.03762','Vaswani et al.','Attention(Q,K,V) = softmax(QKᵀ / √dₖ)V. The lesson uses hand-designed vectors, not a trained language model.'),\n tech('preferences','Learning from preferences',2017,'Alignment',['qlearning'],28,35000,155,22000,'perceptron','A person compares two behaviors rather than writing down a perfect reward formula. A model learns to predict those preferences, and an agent is trained using that learned reward. The preferences can be incomplete or biased; optimizing the learned proxy too hard can still cause failures.','https://arxiv.org/abs/1706.03741','Christiano et al.','A foundation of modern RLHF, not a proof of general alignment. The shared lesson illustrates learned classification of examples.'),\n tech('kaplan','Neural scaling laws',2020,'Scaling',['transformer'],85,140000,190,32000,'attention','Across the experiments studied, language-model loss followed smooth power-law trends as model size, data, and compute changed. This helps plan training budgets. These are empirical relationships within particular experimental settings, not a law that bigger models must become conscious, aligned, or generally intelligent.','https://arxiv.org/abs/2001.08361','Kaplan et al.','Open the Scaling bench for the published compute-allocation exponents and their assumptions.'),\n tech('diffusion','Denoising diffusion',2020,'Computer vision',['alexnet'],85,120000,185,31000,'cnn','Training adds noise to examples and teaches a network to undo it. At generation time, repeated denoising transforms random noise into a sample. This is different from retrieving a single stored image, but training data, memorization, and rights still require care.','https://arxiv.org/abs/2006.11239','Ho, Jain & Abbeel','The convolution lab shows a common image-processing building block, not a complete diffusion sampler.'),\n tech('chinchilla','Compute-optimal training',2022,'Scaling',['kaplan'],110,200000,210,38000,'attention','A large model can be undertrained when it sees too little data. Hoffmann and colleagues found that, in their training regime, model size and training tokens should grow roughly together as compute grows. A smaller model trained longer can beat a larger one given the same training budget.','https://arxiv.org/abs/2203.15556','Hoffmann et al.','The scaling bench implements the paper’s parametric loss fit. Approximately 20 tokens per parameter is a historical heuristic, not a universal optimum.'),\n tech('rlhf','Instruction following with RLHF',2022,'Alignment',['transformer','preferences'],100,160000,225,39000,'attention','Start with examples of helpful responses. Then collect human comparisons, fit a reward model, and optimize the language model using that feedback with constraints. This can improve instruction following, but human ratings and reward models are imperfect and do not certify safety.','https://arxiv.org/abs/2203.02155','Ouyang et al.','Game safety scores are fictional management indicators, not measured existential-risk probabilities.')\n];\nexport const TECH = Object.fromEntries(TECHS.map(t=>[t.id,t]));\nexport const BUILDINGS = {\n desk:{name:'Research desk',category:'People',price:2400,power:.3,heat:.1,upkeep:25,capacity:1,year:1956,icon:'desk',desc:'One workstation for one researcher. No desk means lower morale and output.'},\n vacuum:{name:'Vacuum computer',category:'Compute',price:5200,power:3,heat:2.4,upkeep:105,compute:1.2,flops:2e4,year:1956,icon:'server',desc:'Hot, temperamental, and extraordinary. 1.2 compute units; illustrative 20 kFLOP/s.'},\n mainframe:{name:'Mainframe',category:'Compute',price:10500,power:4,heat:3,upkeep:170,compute:6,flops:1e6,year:1964,icon:'server',desc:'Shared institutional computing. 6 compute units, 4 kW draw.'},\n micro:{name:'LISP workstation',category:'Compute',price:13800,power:2,heat:1.6,upkeep:210,compute:13,flops:1e8,year:1980,icon:'server',desc:'Specialist workstations for the expert-systems era. 13 compute units.'},\n cluster:{name:'CPU cluster',category:'Compute',price:20000,power:3.8,heat:3.5,upkeep:270,compute:28,flops:2e11,year:1993,icon:'server',desc:'Networked commodity machines. 28 compute units, hungry for data.'},\n gpu:{name:'GPU cluster',category:'Compute',price:34500,power:7,heat:6.5,upkeep:480,compute:82,flops:8e13,year:2010,icon:'gpu',desc:'Parallel matrix arithmetic. 82 compute units; heat can erase the advantage.'},\n tpu:{name:'Tensor accelerator',category:'Compute',price:51000,power:6,heat:5.5,upkeep:600,compute:155,flops:3e14,year:2016,icon:'gpu',desc:'Specialized tensor processing. Efficient, but a substantial capital commitment.'},\n power:{name:'Power distribution',ca Okafor',trait:'Visionary',skill:1.5,salary:650,specialty:'Sequence models',color:'#b28d79',bio:'Connects distant ideas. Needs autonomy.'},\n {id:'jules',name:'Jules Moreno',trait:'Hacker',skill:1.2,salary:480,specialty:'Statistical learning',color:'#9c9ab8',bio:'Turns elegant ideas into running code.'},\n {id:'ravi',name:'Ravi Sen',trait:'Theorist',skill:1.45,salary:600,specialty:'Alignment',color:'#adac79',bio:'Asks what the objective actually rewards.'},\n {id:'lina',name:'Lina Park',trait:'Engineer',skill:1.3,salary:540,specialty:'Computer vision',color:'#8dabb0',bio:'Treats datasets as engineered systems.'},\n {id:'noor',name:'Noor Bell',trait:'Visionary',skill:1.65,salary:790,specialty:'Scaling',color:'#ccaf74',bio:'Runs careful experiments on ambitious ideas.'},\n {id:'sam',name:'Sam Rivers',trait:'Hacker',skill:1.15,salary:450,specialty:'Symbolic AI',color:'#90a585',bio:'Makes narrow systems reliably useful.'}\n];\nexport const PATHS = [\n {id:'academic',name:'The Academic',desc:'Publish 16 discoveries and earn 1,500 citations by the end of 2022.',icon:'book'},\n {id:'capitalist',name:'The Builder',desc:'Build a $1M lab valuation and reach $12,000 monthly product revenue by the end of 2022.',icon:'chart'},\n {id:'safe',name:'The Steward',desc:'Research RLHF, keep safety ≥85 and reputation ≥70, and survive to 2022.',icon:'shield'},\n {id:'open',name:'The Commons',desc:'Open-release 12 discoveries, reach reputation ≥85, and survive to 2022.',icon:'globe'},\n {id:'accelerator',name:'The Pioneer',desc:'Finish the Transformer, scaling laws, and diffusion before 2020. Speed is not safety.',icon:'bolt'}\n];\nexport const FOUNDATIONS = [\n {name:'Turing machines',year:1936,authors:'Alan Turing',source:'https://doi.org/10.1112/plms/s2-42.1.230',eli5:'Imagine a machine that reads a symbol, follows a rule, writes a symbol, and moves along a tape. Turing used this simple abstraction to reason precisely about what an algorithm can compute. It also reveals limits: some well-defined problems cannot be solved by a general algorithm.'},\n {name:'Cybernetics',year:1948,authors:'Norbert Wiener',source:'https://mitpress.mit.edu/9780262730099/cybernetics/',eli5:'A thermostat compares the temperature it senses with the temperature you requested, then changes the heating. Cybernetics studies this kind of feedback and control in machines and living systems. A system can correct its behavior without being intelligent in the everyday sense.'}\n];\nexport const GRID = {w:10,h:8};\nexport const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];\n", "simulation.js": "import {ERAS,TECHS,TECH,BUILDINGS,CONDUITS,PRODUCTS,CANDIDATES,PATHS,GRID} from './content.js';\nexport const VERSION=1, SAVE_KEY='singularity-tycoon-v1';\nexport const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));\nconst key=(x,z)=>`${x},${z}`;\nconst clone=o=>JSON.parse(JSON.stringify(o));\nexport function newGame(path='academic',startYear=1956){\n const state={version:VERSION,year:1956,month:0,elapsed:0,paused:true,speed:1,path,resources:{capital:42000,data:700,quality:82,bias:12,reputation:35,safety:78,citations:0},techTreeUnlocked:['neuron'],research:null,labLayout:[\n {id:1,type:'power',x:0,z:1,rotation:0},{id:2,type:'cooling',x:0,z:3,rotation:0},{id:3,type:'network',x:0,z:5,rotation:0},\n {id:4,type:'vacuum',x:2,z:2,rotation:0},{id:5,type:'desk',x:5,z:2,rotation:0},{id:6,type:'desk',x:6,z:2,rotation:0},{id:7,type:'archive',x:8,z:2,rotation:0}],\n conduits:{power:[],cooling:[],network:[]},talent:CANDIDATES.slice(0,2).map(t=>({...t,morale:85})),products:[],releases:{},policy:{open:true,safety:12,publishing:60},\n learned:[],events:[],event:null,seenEvents:[],logs:[{date:'JAN 1956',text:'The university approved your founding grant. A new laboratory begins.',type:'milestone'}],\n grantCooldown:0,auditCooldown:0,licensing:0,competition:10,rng:1456,nextId:8,discovered:0,gameOver:null,completed:false,history:[],objectives:[],training:null,revision:0}; dit\" style=\"margin-top:15px\" ${state.auditCooldown?'disabled':''}>${state.auditCooldown?'Next audit in '+state.auditCooldown+' months':'Independent audit · '+money(2200+d.compute*25)}<\/button><\/div><\/div><\/div>`;\n $('#publishing').oninput=e=>{$('#publishing-value').textContent=e.target.value+'%';};$('#publishing').onchange=e=>{state.policy.publishing=Number(e.target.value);render();};$('#safety').oninput=e=>{$('#safety-value').textContent=e.target.value+' / 100';};$('#safety').onchange=e=>{state.policy.safety=Number(e.target.value);render();};\n }else if(page==='codex'){\n const available=TECHS.filter(t=>(codexAll||state.techTreeUnlocked.includes(t.id))&&`${t.name} ${t.eli5} ${t.authors}`.toLowerCase().includes(searchTerm.toLowerCase()));\n el.innerHTML=pageHeader('THE LIVING ENCYCLOPEDIA','Understand what you build.','Your archive grows with every discovery. Original explanations, primary paper links, and three reusable interactive notebooks.')+`<div class=\"codex-tools\"><input type=\"search\" id=\"codex-search\" placeholder=\"Search concepts, authors, ideas…\" aria-label=\"Search encyclopedia\" value=\"${esc(searchTerm)}\"><button class=\"btn small\" data-action=\"codex-all\">${codexAll?'Show discovered only':'Browse all papers'}<\/button><\/div><div class=\"card-grid\">${Object.entries(LESSONS).map(([id,l])=>`<article class=\"card\"><div class=\"card-label\">INTERACTIVE NOTEBOOK · ${l.number}<\/div><h3>${l.title}<\/h3><p>${l.intro}<\/p><div class=\"card-bottom\"><small>${state.learned.includes(id)?'Notebook completed':'Experiment, then test your intuition'}<\/small><button class=\"btn small\" data-action=\"learn\" data-id=\"${id}\">Open lesson ${icon('arrow',13)}<\/button><\/div><\/article>`).join('')}<\/div><div class=\"section-title\"><h2>${codexAll?'The paper archive.':'On your bookshelf.'}<\/h2><p>${available.length} papers · ${state.techTreeUnlocked.length} discovered<\/p><\/div><div class=\"card-grid\">${available.map(t=>`<article class=\"card codex-card\"><div class=\"card-label\">${t.year} · ${t.branch}<\/div><h3>${t.name}<\/h3><div class=\"authors\">${t.authors}<\/div><p>${t.eli5}<\/p><div class=\"source-note\">${t.note}<\/div><div class=\"card-bottom\"><a href=\"${t.source}\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"text-btn\">Original paper ${icon('arrow',13)}<\/a><button class=\"btn small\" data-action=\"learn\" data-id=\"${t.lesson}\" data-tech=\"${t.id}\">Notebook ${LESSONS[t.lesson].number}<\/button><\/div><\/article>`).join('')||'<div class=\"notice\">No matching concepts in this view. Try browsing all papers.<\/div>'}<\/div><div class=\"section-title\"><h2>Before the lab.<\/h2><\/div><div class=\"card-grid\">${FOUNDATIONS.map(f=>`<article class=\"card codex-card\"><div class=\"card-label\">${f.year} · PROLOGUE<\/div><h3>${f.name}<\/h3><div class=\"authors\">${f.authors}<\/div><p>${f.eli5}<\/p><div class=\"card-bottom\"><a class=\"text-btn\" href=\"${f.source}\" target=\"_blank\" rel=\"noopener noreferrer\">Primary source ${icon('arrow',13)}<\/a><\/div><\/article>`).join('')}<\/div>`;\n $('#codex-search').oninput=e=>{const pos=e.target.selectionStart;searchTerm=e.target.value;renderPage();$('#codex-search').focus();$('#codex-search').setSelectionRange(pos,pos);};\n }else if(page==='journal'){\n el.innerHTML=pageHeader('A RECORD OF DECISIONS','The laboratory journal.','Discoveries, choices, and turning points. This is your alternate history, recorded one month at a time.')+`<div class=\"card\"><div class=\"log-list\">${state.logs.map(l=>`<div class=\"log-entry ${l.type}\"><small>${esc(l.date)}<\/small><span>${esc(l.text)}<\/span><\/div>`).join('')}<\/div><\/div>`;\n }\n}\nfunction render(){const d=derive(state);document.documentElement.dataset.era=eraFor(state.year).id;renderHUD(d);renderDock();renderSelection();world?.sync(state,d);if(page!=='lab'&&!['INPUT','SELECT'].includes(document.activeElement?.tagName))renderPage();syncEvent();}\nfunction openModal(content,className='',type='gene ates. Shift-click removes a selected conduit. Space pauses. Keys 1, 2, 3 set 1×, 6×, 24× speed. R opens research; B opens construction; S saves; Esc closes a view.<\/p><p style=\"margin-top:14px\">At 1×, one month takes five seconds. Reading a modal pauses time. The game never simulates time while the browser tab is hidden. Saves stay on this device; export JSON for a portable backup.<\/p><p class=\"source-note\">20 paper-based nodes, six playable eras, one modular room, three reusable lessons. Numerical economy, hardware performance, risk scores, and fictional staff are game abstractions. No real AI models are trained; no API key is needed.<\/p><div class=\"modal-footer\"><small>Historical MVP · 1956–2022<\/small><button class=\"btn primary\" data-action=\"close-modal\">Back to the blackboard ${icon('arrow',15)}<\/button><\/div>`,'','help');}\nfunction showSettings(){openModal(`<div class=\"modal-header\"><div><span class=\"eyebrow\">LABORATORY ADMINISTRATION<\/span><h1>A place for the essentials.<\/h1><\/div><button class=\"icon-btn\" data-action=\"close-modal\" aria-label=\"Close settings\">${icon('close')}<\/button><\/div><p>Saves use this browser’s local storage. Download a portable JSON backup before clearing browsing data or moving computers. Imported saves are validated.<\/p><div class=\"button-row\" style=\"margin:23px 0\"><button class=\"btn primary\" data-action=\"save\">${icon('save',15)} Save lab<\/button><button class=\"btn\" data-action=\"export\">${icon('download',15)} Export JSON<\/button><button class=\"btn\" data-action=\"import\">${icon('upload',15)} Import JSON<\/button><button class=\"btn\" data-action=\"load\">Load saved lab<\/button><\/div><div class=\"ledger-line\"><span>Subtle interface sound<\/span><button class=\"btn small\" data-action=\"sound\">${sound.enabled?'On · turn off':'Off · turn on'}<\/button><\/div><div class=\"section-title\"><h2>Begin a different chapter.<\/h2><\/div><p>New scenarios replace the active lab after confirmation aria-label=\"Close scaling bench\">${icon('close')}<\/button><\/div><div class=\"science-grid\"><div><p>Change parameter count and training tokens. The plot holds the resulting compute budget fixed and varies how it is divided. Lower predicted loss is better.<\/p><label class=\"range-label\">Model parameters (N)<output id=\"param-output\">${compact(N)}<\/output><input id=\"scale-n\" type=\"range\" min=\"7\" max=\"11\" step=\".05\" value=\"${scaleN}\"><\/label><label class=\"range-label\">Training tokens (D)<output id=\"token-output\">${compact(D)}<\/output><input id=\"scale-d\" type=\"range\" min=\"8\" max=\"13\" step=\".05\" value=\"${scaleD}\"><\/label><div id=\"scaling-numbers\"><\/div><div class=\"equation\">L(N,D) = 1.69 + 406.4 / N⁰·³⁴<br>+ 410.7 / D⁰·²⁸<br>C ≈ 6ND<\/div><\/div><div><div id=\"scaling-chart\"><\/div><h3 style=\"margin:18px 0 8px\">Two allocation models.<\/h3><p>Kaplan (2020): N ∝ C⁰·⁷³ and D ∝ C⁰·²⁷. Chinchilla’s first approach (2022): both scale approximately as C⁰·⁵. The fitted-loss optimum used here is a different approach in that same paper and need not have a fixed tokens-per-parameter ratio.<\/p><div class=\"source-note\">N and D are raw counts. The fit describes a particular pretraining regime; extrapolating can be misleading. It predicts neither consciousness nor specific emergent abilities, general intelligence, safety, or downstream utility.<\/div><\/div><\/div><div class=\"modal-footer\"><div><a class=\"text-btn\" href=\"https://arxiv.org/abs/2203.15556\" target=\"_blank\" rel=\"noopener noreferrer\">Hoffmann et al. (2022) ${icon('arrow',13)}<\/a><a class=\"text-btn\" href=\"https://arxiv.org/abs/2001.08361\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"margin-left:12px\">Kaplan et al. (2020)<\/a><\/div><button class=\"btn primary\" data-action=\"train-scaling\" ${!state.techTreeUnlocked.includes('kaplan')||state.training?'disabled':''}>${state.training?'Experiment running':'Fund experiment'}<\/button><\/div><p class=\"source-note\">The bench is always available for learning. Funding a simulated run requires the scaling-laws node; its compute throughput is compressed for gameplay and does not use the illustrative hardware FLOP/s. It trains no real model.<\/p>`,'large','scaling');updateScaling();$('#scale-n').oninput=e=>{scaleN=Number(e.target.value);updateScaling();};$('#scale-d').oninput=e=>{scaleD=Number(e.target.value);updateScaling();};}\nfunction updateScaling(){const N=10**scaleN,D=10**scaleD,C=6*N*D,opt=optimalAllocation(C);$('#param-output').textContent=compact(N);$('#token-output').textContent=compact(D);$('#scaling-chart').innerHTML=scalingChart(N,D);$('#scaling-numbers').innerHTML=`<div class=\"ledger-line\"><span>Predicted pretraining loss<\/span><strong>${scalingLoss(N,D).toFixed(3)}<\/strong><\/div><div class=\"ledger-line\"><span>Approximate training compute<\/span><strong>${C.toExponential(2)} FLOPs<\/strong><\/div><div class=\"ledger-line\"><span>Tokens per parameter<\/span><strong>${(D/N).toFixed(1)}<\/strong><\/div><div class=\"ledger-line\"><span>Fitted optimum at this budget<\/span><strong>${compact(opt.N)} params · ${compact(opt.D)} tokens<\/strong><\/div>`;}\nfunction syncEvent(){if(state.gameOver||state.completed){if(!endShown){endShown=true;const sc=score(state),d=derive(state);openModal(`<div class=\"modal-header\"><div><span class=\"eyebrow\">${state.gameOver?'THE LABORATORY CLOSES':'THE HISTORICAL CAMPAIGN ENDS'}<\/span><h1>${state.gameOver?'Every experiment teaches.':sc.won?'A legacy of intelligence.':'The next question is yours.'}<\/h1><\/div><button class=\"icon-btn\" data-action=\"close-modal\" aria-label=\"Review laboratory\">${icon('close')}<\/button><\/div><p>${esc(state.gameOver||'You have reached the end of 2022. This MVP stops here; 2023–2150 remains the expansion roadmap.')}<\/p><div class=\"tech-summary\"><div><span>DISCOVERIES<\/span><strong>${state.discovered}<\/strong><\/div><div><span>CITATIONS<\/span><strong>${Math.floor(state.resources.cita   message.style.cssText='padding:32px;max-width:700px;margin:auto;font:16px/1.6 sans-serif';
  message.textContent='The game could not start in this browser. Please use a current browser with JavaScript enabled, or run the modular source project with a local web server. Details: '+error.message;
  document.getElementById('app').replaceChildren(message);
});

</script>
