  <style>
:root {
  color-scheme: light;
  --ink: #233043;
  --muted: #68778a;
  --soft: #eef4f7;
  --panel: rgba(255, 255, 255, 0.94);
  --panel-solid: #ffffff;
  --line: rgba(48, 72, 94, 0.13);
  --shadow: 0 18px 50px rgba(52, 77, 99, 0.18);
  --shadow-small: 0 8px 24px rgba(52, 77, 99, 0.14);
  --pink: #ff7195;
  --pink-dark: #d84f75;
  --mint: #65d6ad;
  --blue: #6bb9ff;
  --yellow: #ffd166;
  --purple: #9b8cff;
  --orange: #ff9b54;
  --danger: #e55f6d;
  --success: #3fa67c;
  --radius: 22px;
  --radius-small: 14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #dff7ff;
  color: var(--ink);
}

body {
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button,
input,
select {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid rgba(107, 185, 255, 0.58);
  outline-offset: 2px;
}

#app,
#renderCanvas {
  width: 100%;
  height: 100%;
}

#app {
  position: relative;
  isolation: isolate;
  background: #dff7ff;
}

#renderCanvas {
  position: absolute;
  inset: 0;
  display: block;
  touch-action: none;
  outline: none;
}

.is-hidden {
  display: none !important;
}

.modal-root {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: max(24px, var(--safe-top)) max(24px, var(--safe-right)) max(24px, var(--safe-bottom)) max(24px, var(--safe-left));
}

.brand-mark {
  display: inline-grid;
  place-items: center;
  color: #fff;
  background: var(--pink);
  box-shadow: 0 8px 18px rgba(216, 79, 117, 0.26);
  font-weight: 900;
}

.top-hud {
  position: absolute;
  z-index: 20;
  top: calc(18px + var(--safe-top));
  left: calc(18px + var(--safe-left));
  right: calc(18px + var(--safe-right));
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: start;
  gap: 16px;
  pointer-events: none;
}

.top-hud > * {
  pointer-events: auto;
}

.brand-lockup,
.time-cluster,
.cash-cluster,
.vitals-hud,
.objective-ribbon,
.main-nav,
.location-card,
.side-panel,
.utility-buttons {
  border: 1px solid rgba(255, 255, 255, 0.78);
  background: var(--panel);
  box-shadow: var(--shadow-small);
  backdrop-filter: blur(16px) saturate(1.1);
}

.brand-lockup {
  justify-self: start;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 13px 9px 9px;
  border-radius: 18px;
}

.brand-mark {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  font-size: 18px;
}

.brand-lockup > span:last-child {
  display: grid;
  line-height: 1.05;
}

.brand-lockup strong {
  font-size: 13px;
  letter-spacing: 0.08em;
}

.brand-lockup small {
  margin-top: 4px;
  color: var(--muted);
  font-size: 10px;
}

.time-cluster {
  justify-self: center;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px;
  border-radius: 18px;
}

.time-pill {
  min-width: 118px;
  padding: 4px 10px;
  text-align: center;
  line-height: 1.05;
}

.time-pill span {
  display: block;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.time-pill strong {
  font-size: 14px;
}

.cash-cluster {
  justify-self: end;
  display: grid;
  min-width: 138px;
  padding: 10px 14px;
  border-radius: 18px;
  text-align: right;
  line-height: 1.05;
}

.cash-cluster span,
.cash-cluster small {
  color: var(--muted);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.cash-cluster strong {
  margin: 4px 0;
  font-size: 19px;
}

.cash-cluster small {
  color: var(--pink-dark);
}

.icon-button,
.compact-button,
.primary-button,
.secondary-button,
.ghost-button,
.danger-button,
.text-button,
.choice-button,
.tab-button,
.rate-button {
  border: 0;
  cursor: pointer;
  transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease, opacity 120ms ease;
}

.icon-button:hover,
.compact-button:hover,
.primary-button:hover,
.secondary-button:hover,
.ghost-button:hover,
.danger-button:hover,
.choice-button:hover,
.rate-button:hover {
  transform: translateY(-1px);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.46;
  transform: none !important;
}

.icon-button {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  flex: 0 0 auto;
  border-radius: 12px;
  background: rgba(35, 48, 67, 0.07);
  font-size: 19px;
  font-weight: 800;
}

.icon-button:hover {
  background: rgba(35, 48, 67, 0.12);
}

.compact-button {
  min-width: 48px;
  height: 34px;
  padding: 0 10px;
  border-radius: 11px;
  background: rgba(35, 48, 67, 0.07);
  font-size: 11px;
  font-weight: 800;
}

.compact-button:hover {
  background: rgba(35, 48, 67, 0.12);
}

.vitals-hud {
  position: absolute;
  z-index: 18;
  top: calc(91px + var(--safe-top));
  left: calc(18px + var(--safe-left));
  width: 232px;
  padding: 13px;
  border-radius: 19px;
  pointer-events: auto;
}

.vital-row {
  display: grid;
  grid-template-columns: 67px 1fr 26px;
  align-items: center;
  gap: 8px;
  min-height: 22px;
  font-size: 10px;
}

.vital-row > span {
  color: var(--muted);
  font-weight: 720;
}

.vital-row > strong {
  text-align: right;
  font-size: 10px;
}

.meter {
  height: 7px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(35, 48, 67, 0.08);
}

.meter i {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--mint);
  transition: width 300ms ease;
}

.vital-row:nth-child(1) .meter i { background: var(--purple); }
.vital-row:nth-child(2) .meter i { background: var(--yellow); }
.vital-row:nth-child(3) .meter i { background: var(--pink); }
.vital-row:nth-child(4) .meter i { background: var(--mint); }
.vital-row:nth-child(5) .meter i { background: var(--blue); }
.vital-row:nth-child(6) .meter i { background: var(--orange); }

.objective-ribbon {
  position: absolute;
  z-index: 17;
  top: calc(96px + var(--safe-top));
  left: 50%;
  display: grid;
  min-width: min(360px, calc(100vw - 520px));
  padding: 10px 18px;
  border-radius: 16px;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
}

.objective-ribbon span {
  color: var(--pink-dark);
  font-size: 9px;
  font-weight: 850;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.objective-ribbon strong {
  margin-top: 3px;
  font-size: 12px;
}

.main-nav {
  position: absolute;
  z-index: 22;
  left: 50%;
  bottom: calc(18px + var(--safe-bottom) + var(--kit-touch-bottom, 0px));
  display: flex;
  gap: 4px;
  padding: 6px;
  border-radius: 20px;
  transform: translateX(-50%);
  pointer-events: auto;
}

.main-nav button {
  position: relative;
  display: grid;
  grid-template-columns: auto auto;
  align-items: center;
  gap: 6px;
  min-width: 84px;
  height: 44px;
  padding: 0 12px;
  border: 0;
  border-radius: 14px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 11px;
  font-weight: 800;
}

.main-nav button:hover,
.main-nav button.is-active {
  color: var(--ink);
  background: rgba(35, 48, 67, 0.07);
}

.main-nav button.is-active {
  box-shadow: inset 0 0 0 1px rgba(35, 48, 67, 0.05);
}

.nav-icon {
  font-size: 18px;
  line-height: 1;
}

.badge {
  position: absolute;
  top: -4px;
  right: -3px;
  display: grid;
  place-items: center;
  min-width: 19px;
  height: 19px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--pink);
  color: white;
  font-size: 9px;
  box-shadow: 0 4px 10px rgba(216, 79, 117, 0.25);
}

.side-panel {
  position: absolute;
  z-index: 30;
  top: calc(92px + var(--safe-top));
  right: calc(18px + var(--safe-right));
  bottom: calc(82px + var(--safe-bottom) + var(--kit-touch-bottom, 0px));
  display: flex;
  width: min(408px, calc(100vw - 36px));
  overflow: hidden;
  border-radius: 25px;
  flex-direction: column;
  pointer-events: auto;
  animation: panel-in 180ms ease-out both;
}

@keyframes panel-in {
  from { opacity: 0; transform: translateX(18px); }
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--line);
}

.panel-header span,
.card-eyebrow,
.section-label,
.modal-eyebrow,
.location-card > div:first-child > span {
  color: var(--pink-dark);
  font-size: 9px;
  font-weight: 850;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.panel-header h2,
.location-card h2,
.modal-card h1,
.modal-card h2 {
  margin: 3px 0 0;
  line-height: 1.08;
}

.panel-header h2 {
  font-size: 24px;
}

.panel-content {
  min-height: 0;
  padding: 14px 14px 24px;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: rgba(35, 48, 67, 0.2) transparent;
}

.panel-content::-webkit-scrollbar {
  width: 8px;
}

.panel-content::-webkit-scrollbar-thumb {
  border: 2px solid transparent;
  border-radius: 999px;
  background: rgba(35, 48, 67, 0.18);
  background-clip: padding-box;
}

.panel-intro {
  margin: 0 4px 14px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

.card,
.lead-card,
.booking-card,
.business-card,
.journal-entry,
.summary-card,
.location-action,
.client-card {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.78);
  box-shadow: 0 6px 18px rgba(44, 66, 85, 0.06);
}

.lead-card,
.booking-card,
.business-card,
.client-card {
  padding: 15px;
}

.lead-card + .lead-card,
.booking-card + .booking-card,
.business-card + .business-card,
.client-card + .client-card,
.journal-entry + .journal-entry {
  margin-top: 10px;
}

.card-heading,
.lead-heading,
.booking-heading,
.business-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.card-heading h3,
.lead-heading h3,
.booking-heading h3,
.business-heading h3 {
  margin: 0;
  font-size: 16px;
}

.lead-heading p,
.booking-heading p,
.business-heading p,
.card-copy,
.journal-entry p,
.client-card p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.48;
}

.price-pill,
.status-pill,
.risk-pill,
.tag,
.skill-level,
.location-pill {
  display: inline-flex;
  align-items: center;
  min-height: 25px;
  padding: 0 9px;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 850;
  white-space: nowrap;
}

.price-pill {
  color: #1c7257;
  background: rgba(101, 214, 173, 0.18);
}

.status-pill {
  color: #3b5f89;
  background: rgba(107, 185, 255, 0.17);
}

.status-pill.warning,
.risk-pill.high {
  color: #9f3f4a;
  background: rgba(229, 95, 109, 0.15);
}

.status-pill.success,
.risk-pill.low {
  color: #297b5d;
  background: rgba(101, 214, 173, 0.18);
}

.risk-pill.moderate {
  color: #8a651c;
  background: rgba(255, 209, 102, 0.22);
}

.meta-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 13px;
}

.meta-cell {
  min-width: 0;
  padding: 9px 10px;
  border-radius: 12px;
  background: rgba(35, 48, 67, 0.045);
}

.meta-cell span {
  display: block;
  margin-bottom: 3px;
  color: var(--muted);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.meta-cell strong {
  display: block;
  overflow: hidden;
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
}

.tag {
  min-height: 22px;
  color: var(--muted);
  background: rgba(35, 48, 67, 0.055);
  font-weight: 750;
}

.tag.green {
  color: #2a795d;
  background: rgba(101, 214, 173, 0.15);
}

.tag.red {
  color: #9b4550;
  background: rgba(229, 95, 109, 0.13);
}

.tag.pink {
  color: var(--pink-dark);
  background: rgba(255, 113, 149, 0.13);
}

.card-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 13px;
}

.primary-button,
.secondary-button,
.ghost-button,
.danger-button {
  min-height: 38px;
  padding: 0 14px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 850;
}

.primary-button {
  color: #fff;
  background: var(--pink);
  box-shadow: 0 7px 15px rgba(216, 79, 117, 0.2);
}

.primary-button:hover {
  background: var(--pink-dark);
}

.secondary-button {
  color: #276f59;
  background: rgba(101, 214, 173, 0.2);
}

.secondary-button:hover {
  background: rgba(101, 214, 173, 0.3);
}

.ghost-button {
  background: rgba(35, 48, 67, 0.065);
}

.ghost-button:hover {
  background: rgba(35, 48, 67, 0.11);
}

.danger-button {
  color: #a4424d;
  background: rgba(229, 95, 109, 0.13);
}

.text-button {
  padding: 4px;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.section-label {
  display: block;
  margin: 18px 4px 9px;
}

.empty-state {
  display: grid;
  place-items: center;
  min-height: 210px;
  padding: 30px;
  border: 1px dashed rgba(35, 48, 67, 0.17);
  border-radius: 20px;
  text-align: center;
  background: rgba(255, 255, 255, 0.42);
}

.empty-state strong {
  font-size: 15px;
}

.empty-state p {
  max-width: 270px;
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

.location-card {
  position: absolute;
  z-index: 24;
  left: calc(18px + var(--safe-left));
  bottom: calc(82px + var(--safe-bottom) + var(--kit-touch-bottom, 0px));
  width: min(365px, calc(100vw - 36px));
  max-height: min(520px, calc(100vh - 190px));
  padding: 17px;
  overflow: auto;
  border-radius: 24px;
  pointer-events: auto;
  animation: location-in 180ms ease-out both;
}

@keyframes location-in {
  from { opacity: 0; transform: translateY(16px); }
}

.location-card h2 {
  font-size: 22px;
}

.location-card p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.45;
}

.location-actions {
  display: grid;
  gap: 8px;
  margin: 14px 0 10px;
}

.location-action {
  width: 100%;
  padding: 12px 13px;
  text-align: left;
  cursor: pointer;
}

.location-action:hover {
  border-color: rgba(255, 113, 149, 0.35);
  transform: translateY(-1px);
}

.location-action strong {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
}

.location-action span {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.4;
}

.location-action small {
  color: var(--pink-dark);
  font-size: 9px;
  white-space: nowrap;
}

.utility-buttons {
  position: absolute;
  z-index: 24;
  right: calc(18px + var(--safe-right));
  bottom: calc(18px + var(--safe-bottom) + var(--kit-touch-bottom, 0px));
  display: flex;
  gap: 5px;
  padding: 5px;
  border-radius: 17px;
  pointer-events: auto;
}

.icon-button.utility {
  width: 34px;
  height: 34px;
  font-size: 16px;
}

/* Where a controller's focus is (browsers only show :focus-visible for keys). */
.pad-focus {
  outline: 3px solid rgba(255, 113, 149, 0.85) !important;
  outline-offset: 2px !important;
}

/* A form re-rendering in place (a choice was made) does not replay the entrance. */
.modal-card.is-rerender {
  animation: none;
}

/* +$240, Level 3!: rises from the player and fades. */
.floater {
  position: absolute;
  z-index: 19;
  padding: 4px 10px;
  border-radius: 999px;
  color: #fff;
  background: rgba(35, 48, 67, 0.86);
  box-shadow: var(--shadow-small);
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.01em;
  white-space: nowrap;
  pointer-events: none;
  transform: translate(-50%, -50%);
  animation: floater-rise 1.5s ease-out forwards;
}

.floater.gain { background: rgba(46, 126, 96, 0.92); }
.floater.loss { background: rgba(158, 72, 82, 0.9); }
.floater.level { background: var(--pink); }

@keyframes floater-rise {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(0.9); }
  15% { opacity: 1; transform: translate(-50%, -60%) scale(1); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -260%); }
}

.goal-card.is-done {
  opacity: 0.74;
}

.choice-button.is-danger strong {
  color: #a4424d;
}

.controls-grid .stat-box strong {
  font-size: 12px;
  line-height: 1.35;
}

.world-tooltip {
  position: absolute;
  z-index: 19;
  max-width: 220px;
  padding: 8px 11px;
  border-radius: 10px;
  color: #fff;
  background: rgba(35, 48, 67, 0.88);
  box-shadow: var(--shadow-small);
  font-size: 10px;
  font-weight: 750;
  line-height: 1.35;
  pointer-events: none;
  transform: translate(12px, 12px);
}

.toast-stack {
  position: absolute;
  z-index: 80;
  top: calc(92px + var(--safe-top));
  left: 50%;
  display: grid;
  width: min(360px, calc(100vw - 32px));
  gap: 8px;
  transform: translateX(-50%);
  pointer-events: none;
}

.toast {
  display: flex;
  align-items: flex-start;

.choice-button strong {

.choice-button span {

  margin-top: 13px;

.notice-box {
  margin-top: 14px;
  padding: 11px 13px;
  border-radius: 14px;
  color: #765917;
  background: rgba(255, 209, 102, 0.18);

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function roundTo(value, step) {
    return Math.round(value / step) * step;
  }

  function randomBetween(rng, min, max) {
    return min + (max - min) * rng();
  }

  function randomInt(rng, min, max) {
    return Math.floor(randomBetween(rng, min, max + 1));
  }

  function pick(rng, list) {
    return list[Math.floor(rng() * list.length) % list.length];
  }

  function shufflePick(rng, list, count) {
    const copy = list.slice();
    const out = [];
    while (copy.length && out.length < count) {
      out.push(copy.splice(Math.floor(rng() * copy.length), 1)[0]);
    }
    return out;
  }

  function nextId(state, prefix) {
    const value = state.meta.nextId++;
    return prefix + value.toString(36);
  }

  function absoluteMinutes(state) {
    return (state.player.day - 1) * 1440 + state.player.minuteOfDay;
  }

  function dayFromAbsolute(abs) {
    return Math.floor(abs / 1440) + 1;
  }

  function minuteOfDayFromAbsolute(abs) {
    return ((abs % 1440) + 1440) % 1440;
  }

  function formatClock(minuteOfDay) {
    const total = ((Math.round(minuteOfDay) % 1440) + 1440) % 1440;
    let hour = Math.floor(total / 60);
    const minute = total % 60;
    const suffix = hour >= 12 ? "PM" : "AM";
    hour %= 12;
    if (hour === 0) hour = 12;
    return hour + ":" + String(minute).padStart(2, "0") + " " + suffix;
  }

  function formatAbsTime(abs) {
    return "Day " + dayFromAbsolute(abs) + ", " + formatClock(minuteOfDayFromAbsolute(abs));
  }

  function formatCurrency(value) {
    const sign = value < 0 ? "-" : "";
    return sign + "$" + Math.abs(Math.round(value)).toLocaleString("en-US");
  }

  function log(state, title, text, type) {
    state.journal.unshift({
      id: nextId(state, "j"),

      text: text,

    });
    if (state.journal.length > 80) state.journal.length = 80;
  }

  function hydrateState(raw) {
    if (!raw || typeof raw !== "object") return null;
    if (raw.version !== VERSION || !raw.player) return null;

    const base = createNewGame({
      name: raw.player.name,
      regionId: raw.player.regionId,
      difficultyId: raw.player.difficultyId,
      modelId: "independent"
    }, function () { return 0.5; });

    // Defaults first, then the save on top, one level at a time. (Merging the
    // save into the fresh game directly would replace each nested default
    // object with the save's own, so fields added since that save was written
    // would stay missing.)
    const obj = function (value) { return value && typeof value === "object" ? value : {}; };
    const rawPlayer = obj(raw.player);
    const merged = Object.assign({}, base, raw);
    merged.player = Object.assign({}, base.player, rawPlayer);
    merged.player.skills = Object.assign({}, base.player.skills, obj(rawPlayer.skills));
    merged.player.services = Object.assign({}, base.player.services, obj(rawPlayer.services));
    merged.player.boundaries = Object.assign({}, base.player.boundaries, obj(rawPlayer.boundaries));
    merged.meta = Object.assign({}, base.meta, obj(raw.meta));
    merged.settings = Object.assign({}, base.settings, obj(raw.settings));
    merged.buffs = Object.assign({}, base.buffs, obj(raw.buffs));
    // Saves from before career goals existed start their counters at zero.
    merged.progress = Object.assign({}, base.progress, obj(raw.progress));
    merged.goals = Object.assign({}, obj(raw.goals));
    merged.leads = Array.isArray(raw.leads) ? raw.leads : [];
    merged.bookings = Array.isArray(raw.bookings) ? raw.bookings : [];
    merged.journal = Array.isArray(raw.journal) ? raw.journal : [];
    merged.eventQueue = Array.isArray(raw.eventQueue) ? raw.eventQueue : [];
    merged.clients = raw.clients && typeof raw.clients === "object" ? raw.clients : {};
    // A save written mid-date whose booking went missing cannot resume the date.
    if (merged.activeEncounter && !merged.bookings.some(function (booking) { return booking.id === merged.activeEncounter.bookingId; })) {
      merged.activeEncounter = null;
    }
    return merged;
  }

  function activeLeads(state) {
    return state.leads.filter(function (lead) {
      return lead.status === "new" || lead.status === "screened" || lead.status === "countered";
    });
  }

  function upcomingBookings(state) {
    const now = absoluteMinutes(state);
    return state.bookings
      .filter(function (booking) { return booking.status === "scheduled" && booking.startAbs >= now - 60; })
      .sort(function (a, b) { return a.startAbs - b.startAbs; });
  }

  function getRegion(state) {
    return REGIONS[state.player.regionId] || REGIONS.sunset;
  }

  function getDifficulty(state) {
    return DIFFICULTIES[state.player.difficultyId] || DIFFICULTIES.standard;
  }

  function getDailyCosts(state) {
    const region = getRegion(state);
    return region.dailyOverhead + (state.player.services.manager ? 18 : 0) + (state.player.services.security ? 26 : 0);
  }

  function applyLevelProgress(state) {
    let leveled = false;
    while (state.player.careerXP >= state.player.level * 100) {
      state.player.careerXP -= state.player.level * 100;
      state.player.level += 1;
      state.player.skillPoints += 1;
      state.player.reputation = clamp(state.player.reputation + 2, 0, 100);
      leveled = true;
      log(state, "Career level " + state.player.level, "You earned a skill point and a small reputation boost.", "milestone");
    }
    return leveled;
  }

  function applyDailyTick(state, newDay, rng) {
    const dailyCost = getDailyCosts(state);
    state.player.cash -= dailyCost;
    state.player.weeklyExpenses += dailyCost;
    state.player.stress = clamp(state.player.stress + (state.player.cash < 0 ? 9 : 1), 0, 100);
    state.player.safety = clamp(state.player.safety + (state.player.services.security ? 0.5 : -0.35), 0, 100);

    if (newDay % 2 === 0) {
      state.player.marketingReach = clamp(state.player.marketingReach - 1, 0, 20);
    }

    log(state, "Daily overhead", formatCurrency(dailyCost) + " covered housing, platform, and contracted-service costs.", "finance");

    ensureLeadPipeline(state, 4, rng);

    if (newDay > state.meta.lastEventDay && (rng() < 0.72 || newDay - state.meta.lastEventDay >= 2)) {
      queueRandomEvent(state, rng);
      state.meta.lastEventDay = newDay;
    }

    if (state.player.exposure >= 70 && !state.eventQueue.some(function (event) { return event.kind === "complianceCheck"; })) {
      state.eventQueue.push({
        id: nextId(state, "e"),
        kind: "complianceCheck",
        title: "Compliance pressure",
        body: "High public exposure draws attention to your business records and venue practices. The game models this abstractly; local rules vary by region.",
        choices: [
          { id: "counsel", label: "Pay for professional advice", detail: "Costly, but sharply lowers exposure." },
          { id: "pause", label: "Pause bookings for a day", detail: "Lose time and reach, reduce exposure." },
          { id: "risk", label: "Keep operating", detail: "No immediate cost, substantial downside risk." }
        ]
      });
    }

    pruneHistory(state);

    if ((newDay - 1) % 7 === 0 && newDay > 1) {
      const weekNet = state.player.weeklyIncome - state.player.weeklyExpenses;
      state.progress.bestWeekNet = Math.max(state.progress.bestWeekNet || 0, weekNet);
      state.eventQueue.push({
        id: nextId(state, "e"),
        kind: "weeklySummary",
        title: "Weekly review",
        body: "Net this week: " + formatCurrency(state.player.weeklyIncome - state.player.weeklyExpenses) + ". Income " + formatCurrency(state.player.weeklyIncome) + "; costs " + formatCurrency(state.player.weeklyExpenses) + ".",
        choices: [{ id: "continue", label: "Start the new week", detail: "Reset weekly tracking." }]
      });
    }
  }

  function expireOldItems(state) {
    const now = absoluteMinutes(state);
    state.leads.forEach(function (lead) {
      if ((lead.status === "new" || lead.status === "screened" || lead.status === "countered") && lead.expiresAbs < now) {
        lead.status = "expired";
      }
    });

    state.bookings.forEach(function (booking) {
      // More than an hour late is too late to begin (beginBooking uses the same
      // rule), so the booking is missed then. Waiting for the whole duration
      // left it invisible on the calendar while it still blocked the slot.
      if (booking.status === "scheduled" && booking.startAbs + 60 < now) {
        booking.status = "missed";
        state.player.reputation = clamp(state.player.reputation - 8, 0, 100);
        state.player.stress = clamp(state.player.stress + 11, 0, 100);
        if (booking.depositPaid > 0) {
          state.player.cash -= booking.depositPaid;
        }
        log(state, "Booking missed", "You missed the booking with " + booking.clientName + ". The deposit was refunded and reputation fell.", "warning");
      }
    });
  }

  function advanceTime(state, minutes, rng, reason) {
    rng = rng || Math.random;
    minutes = Math.max(0, Math.round(minutes));
    const oldAbs = absoluteMinutes(state);
    const oldDay = state.player.day;
    const targetAbs = oldAbs + minutes;
    const targetDay = dayFromAbsolute(targetAbs);

    const hours = minutes / 60;
    state.player.energy = clamp(state.player.energy - hours * 1.1, 0, 100);
    state.player.stress = clamp(state.player.stress + hours * 0.16 + (state.player.energy < 22 ? hours * 0.8 : 0), 0, 100);
    state.player.wellness = clamp(state.player.wellness - hours * 0.07, 0, 100);

    for (let day = oldDay + 1; day <= targetDay; day += 1) {
      state.player.day = day;
      state.player.minuteOfDay = 0;
      applyDailyTick(state, day, rng);
    }

    state.player.day = targetDay;
    state.player.minuteOfDay = minuteOfDayFromAbsolute(targetAbs);

    const leadIntervals = Math.floor((targetAbs - state.meta.lastLeadGenerationAbs) / 240);
    if (leadIntervals > 0) {
      const region = getRegion(state);
      const demandBonus = region.demand * (0.34 + state.player.marketingReach * 0.035 + state.player.reputation * 0.0025);
      for (let i = 0; i < leadIntervals; i += 1) {
        if (activeLeads(state).length < 8 && rng() < clamp(demandBonus, 0.22, 0.9)) {
          // Regular clients come back on their own now and then.
          const repeat = rng() < 0.28 ? generateRegularLead(state, rng) : null;
          state.leads.push(repeat || generateLead(state, rng));
        }
      }
      state.meta.lastLeadGenerationAbs += leadIntervals * 240;
    }

    expireOldItems(state);
    checkMilestone(state);

    if (reason) {
      log(state, reason, minutes >= 60 ? (Math.round(hours * 10) / 10) + " hours passed." : minutes + " minutes passed.", "time");
    }
    return { ok: true, minutes: minutes };
  }

  function findRequestedSlot(state, rng) {
    const now = absoluteMinutes(state);
    const preferredHours = [13, 17, 19, 21];
    const dayOffset = rng() < 0.38 ? 0 : (rng() < 0.82 ? 1 : 2);
    let candidate = (dayFromAbsolute(now) - 1 + dayOffset) * 1440 + pick(rng, preferredHours) * 60;
    while (candidate < now + 150) candidate += 1440;
    return candidate;
  }

  function generateLead(state, rng, options) {
    rng = rng || Math.random;
    options = options || {};
    const region = getRegion(state);
    const archetype = options.archetypeId ? CLIENT_ARCHETYPES[options.archetypeId] : pick(rng, Object.keys(CLIENT_ARCHETYPES).map(function (key) { return CLIENT_ARCHETYPES[key]; }));
    const reputationFactor = 0.84 + state.player.reputation * 0.0042;
    const managerFactor = state.player.services.manager ? 1.08 : 1;
    const market = region.baseRate * archetype.budget * reputationFactor * managerFactor;
    const maxBudget = roundTo(market * randomBetween(rng, 0.98, 1.27), 25);
    const minBudget = roundTo(maxBudget * randomBetween(rng, 0.62, 0.76), 25);
    const offer = clamp(roundTo(state.player.baseRate * randomBetween(rng, 0.82, 1.08), 25), minBudget, maxBudget);
    const requestedStartAbs = options.requestedStartAbs || findRequestedSlot(state, rng);
    const durationMin = rng() < 0.34 ? 90 : 120;
    const riskNoise = randomBetween(rng, -0.045, 0.07);
    let riskBase = clamp((archetype.risk + riskNoise) * region.risk, 0.06, 0.62);
    if (options.safer) riskBase *= 0.58;
    if (options.regular) riskBase *= 0.8;

    const greenCount = options.safer ? 3 : (rng() < archetype.reliability ? 2 : 1);
    const redCount = riskBase > 0.36 ? 2 : (rng() < riskBase * 1.25 ? 1 : 0);
    const greenFlags = shufflePick(rng, GREEN_FLAGS, greenCount);
    const redFlags = shufflePick(rng, RED_FLAGS, redCount);
    const venueId = options.venueId || pick(rng, archetype.venues);
    const activeBoundaryCount = Object.keys(state.player.boundaries).filter(function (key) { return state.player.boundaries[key]; }).length;
    riskBase *= 1 - activeBoundaryCount * 0.018;
    if (state.player.boundaries.publicFirst && (venueId === "cafe" || venueId === "park")) riskBase *= 0.9;
    else if (state.player.boundaries.publicFirst && venueId === "lounge") riskBase *= 0.94;

    return {
      id: nextId(state, "l"),
      name: options.name || pick(rng, FIRST_NAMES),
      age: options.age || randomInt(rng, 26, 61),
      archetypeId: archetype.id,
      archetypeLabel: archetype.label,
      summary: archetype.summary,
      preferences: archetype.preferences.slice(),
      budgetMin: minBudget,
      budgetMax: maxBudget,
      offer: offer,
      requestedStartAbs: requestedStartAbs,
      durationMin: durationMin,
      venueId: venueId,
      riskBase: clamp(riskBase, 0.04, 0.65),
      reliability: archetype.reliability,
      greenFlags: greenFlags,
      redFlags: redFlags,
      screened: false,
      screening: null,
      negotiationAttempts: 0,
      status: "new",
      createdAbs: absoluteMinutes(state),
      expiresAbs: requestedStartAbs - 75
    };
  }

  function ensureLeadPipeline(state, minimum, rng) {
    rng = rng || Math.random;
    let count = activeLeads(state).length;
    while (count < minimum && count < 8) {
      state.leads.push(generateLead(state, rng));
      count += 1;
    }
    return count;
  }

  function archetypeForClient(client) {
    if (client.archetypeId && CLIENT_ARCHETYPES[client.archetypeId]) return CLIENT_ARCHETYPES[client.archetypeId];
    const keys = Object.keys(CLIENT_ARCHETYPES);
    for (let i = 0; i < keys.length; i += 1) {
      if (CLIENT_ARCHETYPES[keys[i]].label === client.archetypeLabel) return CLIENT_ARCHETYPES[keys[i]];
    }
    return CLIENT_ARCHETYPES.local;
  }

  function clientIsBusy(state, name) {
    return state.leads.some(function (lead) {
      return lead.name === name && (lead.status === "new" || lead.status === "screened" || lead.status === "countered");
    }) || state.bookings.some(function (booking) {
      return booking.clientName === name && (booking.status === "scheduled" || booking.status === "inProgress");
    });
  }

  /**
   * A repeat request from a regular client: already known (so it arrives
   * screened, every flag on the table), a little safer, and a little better
   * paid. Returns null when no regular is free to ask.
   */
  function generateRegularLead(state, rng) {
    rng = rng || Math.random;
    const regulars = Object.keys(state.clients)
      .map(function (key) { return state.clients[key]; })
      .filter(function (client) { return client && client.regular && !clientIsBusy(state, client.name); });
    if (!regulars.length) return null;
    const client = pick(rng, regulars);
    const archetype = archetypeForClient(client);
    const lead = generateLead(state, rng, { archetypeId: archetype.id, name: client.name, age: client.age, regular: true });
    lead.regular = true;
    lead.budgetMax = roundTo(lead.budgetMax * 1.12, 25);
    lead.offer = clamp(roundTo(lead.offer * 1.1, 25), lead.budgetMin, lead.budgetMax);
    if (lead.greenFlags.indexOf("Verified reference") < 0) lead.greenFlags.unshift("Verified reference");
    lead.greenFlags.unshift("Returning regular");
    lead.screened = true;
    lead.status = "screened";
    lead.screening = {
      confidence: 95,
      estimatedRisk: Math.round(lead.riskBase * 100),
      riskBand: riskBand(lead.riskBase),
      verified: true,
      redFlags: lead.redFlags.slice(),
      greenFlags: lead.greenFlags.slice()
    };
    log(state, "Regular client request", client.name + " would like to book again.", "booking");
    return lead;
  }

  /** Old finished leads and bookings only grow the save; keep what the UI and rules still read. */
  function pruneHistory(state) {
    const now = absoluteMinutes(state);
    const referenced = {};
    state.bookings.forEach(function (booking) {
      if (booking.status === "scheduled" || booking.status === "inProgress") referenced[booking.leadId] = true;
    });
    state.leads = state.leads.filter(function (lead) {
      const active = lead.status === "new" || lead.status === "screened" || lead.status === "countered";
      return active || referenced[lead.id] || now - (lead.createdAbs || 0) < 3 * 1440;
    });
    const finished = state.bookings
      .filter(function (booking) { return booking.status !== "scheduled" && booking.status !== "inProgress"; })
      .sort(function (a, b) { return b.startAbs - a.startAbs; });
    if (finished.length > 40) {
      const dropped = {};
      finished.slice(40).forEach(function (booking) { dropped[booking.id] = true; });
      state.bookings = state.bookings.filter(function (booking) { return !dropped[booking.id]; });
    }
  }

  function getLead(state, leadId) {
    return state.leads.find(function (lead) { return lead.id === leadId; }) || null;
  }

  function getBooking(state, bookingId) {
    return state.bookings.find(function (booking) { return booking.id === bookingId; }) || null;
  }

  function riskBand(value) {
    if (value < 0.2) return "Low";
    if (value < 0.38) return "Moderate";
    return "High";
  }

  function screenLead(state, leadId, rng) {
    rng = rng || Math.random;
    const lead = getLead(state, leadId);
    if (!lead || !(lead.status === "new" || lead.status === "screened" || lead.status === "countered")) {
      return { ok: false, message: "That lead is no longer available." };
    }
    if (state.player.cash < 8) return { ok: false, message: "You need $8 for the screening check." };

    state.player.cash -= 8;
    state.player.weeklyExpenses += 8;
    advanceTime(state, 30, rng);

    const prep = state.buffs.screeningPrep > 0 ? 0.13 : 0;
    const accuracy = clamp(0.55 + state.player.skills.screening * 0.075 + prep + (state.player.services.manager ? 0.05 : 0), 0.58, 0.96);
    const noise = randomBetween(rng, -1, 1) * (1 - accuracy) * 38;
    const estimatedRisk = clamp(Math.round(lead.riskBase * 100 + noise), 3, 96);
    const revealedReds = lead.redFlags.filter(function () { return rng() < accuracy; });
    const revealedGreens = lead.greenFlags.filter(function () { return rng() < clamp(accuracy + 0.1, 0, 1); });
    const verified = lead.greenFlags.indexOf("Verified reference") >= 0 || rng() < lead.reliability * accuracy;

    lead.screened = true;
    lead.status = "screened";
    lead.screening = {
      confidence: Math.round(accuracy * 100),
      estimatedRisk: estimatedRisk,
      riskBand: riskBand(estimatedRisk / 100),
      verified: verified,
      redFlags: revealedReds,
      greenFlags: revealedGreens
    };

    if (state.buffs.screeningPrep > 0) state.buffs.screeningPrep -= 1;
    state.progress.screened = (state.progress.screened || 0) + 1;
    state.player.careerXP += 5;
    applyLevelProgress(state);
    log(state, "Lead screened", lead.name + " returned a " + lead.screening.riskBand.toLowerCase() + " risk estimate with " + lead.screening.confidence + "% confidence.", "safety");
    return { ok: true, lead: lead };
  }

  function isSlotAvailable(state, startAbs, durationMin, ignoreBookingId) {
    const endAbs = startAbs + durationMin;
    return !state.bookings.some(function (booking) {
      if (booking.id === ignoreBookingId || booking.status !== "scheduled") return false;
      const existingStart = booking.startAbs - 45;
      const existingEnd = booking.startAbs + booking.durationMin + 45;
      return startAbs < existingEnd && endAbs > existingStart;
    });
  }

  function getSuggestedSlots(state, leadId) {
    const lead = getLead(state, leadId);
    if (!lead) return [];
    const candidates = [
      lead.requestedStartAbs,
      lead.requestedStartAbs + 120,
      lead.requestedStartAbs + 1440,
      lead.requestedStartAbs + 1560
    ];
    const now = absoluteMinutes(state);
    const unique = [];
    candidates.forEach(function (value) {
      if (value >= now + 60 && isSlotAvailable(state, value, lead.durationMin) && unique.indexOf(value) < 0) unique.push(value);
    });
    return unique.slice(0, 3);
  }

  function estimateNegotiation(state, lead, price, depositPct) {
    if (!lead) return 0;
    price = Math.max(0, Number(price) || 0);
    depositPct = clamp(Number(depositPct) || 0, 0, 0.5);
    const skillBonus = state.player.skills.negotiation * 0.055;
    const managerBonus = state.player.services.manager ? 0.09 : 0;
    const reputationBonus = state.player.reputation * 0.002;
    const screenedBonus = lead.screened ? 0.035 : 0;
    const pricePressure = price <= lead.budgetMax ? Math.max(0, (price - lead.offer) / Math.max(lead.budgetMax - lead.offer, 50)) * 0.28 : 0.38 + (price - lead.budgetMax) / Math.max(lead.budgetMax, 1);
    const depositPressure = depositPct > 0.25 ? 0.08 : depositPct > 0 ? 0.025 : 0;
    const redPenalty = lead.redFlags.indexOf("Refuses every deposit option") >= 0 && depositPct > 0 ? 0.18 : 0;
    return clamp(0.66 + skillBonus + managerBonus + reputationBonus + screenedBonus - pricePressure - depositPressure - redPenalty, 0.06, 0.96);
  }

  function createBookingFromLead(state, lead, options) {
    const price = roundTo(clamp(Number(options.price) || lead.offer, 75, 2000), 5);
    const startAbs = Number(options.startAbs) || lead.requestedStartAbs;
    const depositPct = clamp(Number(options.depositPct) || 0, 0, 0.5);
    const depositPaid = roundTo(price * depositPct, 5);
    const risk = clamp(lead.riskBase * (lead.screened ? 0.86 : 1.19), 0.04, 0.78);

    const booking = {
      id: nextId(state, "b"),
      leadId: lead.id,
      clientName: lead.name,
      clientAge: lead.age,
      archetypeLabel: lead.archetypeLabel,
      rate: price,
      startAbs: startAbs,
      durationMin: lead.durationMin,
      venueId: lead.venueId,
      depositPct: depositPct,
      depositPaid: depositPaid,
      risk: risk,
      screened: lead.screened,
      regular: Boolean(lead.regular),
      status: "scheduled",
      createdAbs: absoluteMinutes(state),
      review: null,
      result: null
    };

    if (depositPaid > 0) state.player.cash += depositPaid;
    state.bookings.push(booking);
    lead.status = "booked";
    state.clients[lead.name] = state.clients[lead.name] || {
      name: lead.name,
      age: lead.age,
      archetypeId: lead.archetypeId,
      archetypeLabel: lead.archetypeLabel,
      dates: 0,
      averageReview: 0,
      regular: false,
      notes: []
    };
    if (lead.regular) state.progress.regularRebooked = (state.progress.regularRebooked || 0) + 1;
    log(state, "Booking confirmed", lead.name + " booked " + formatAbsTime(startAbs) + " at " + LOCATION_NAMES[lead.venueId] + " for " + formatCurrency(price) + ".", "booking");
    return booking;
  }

  function acceptLead(state, leadId, options, rng) {
    rng = rng || Math.random;
    options = options || {};
    const lead = getLead(state, leadId);
    if (!lead || !(lead.status === "new" || lead.status === "screened" || lead.status === "countered")) {
      return { ok: false, message: "That lead is no longer available." };
    }
    const startAbs = Number(options.startAbs) || lead.requestedStartAbs;
    if (!isSlotAvailable(state, startAbs, lead.durationMin)) {
      return { ok: false, message: "That time conflicts with another booking." };
    }
    const booking = createBookingFromLead(state, lead, {
      price: options.price || lead.offer,
      startAbs: startAbs,
      depositPct: options.depositPct || 0
    });
    return { ok: true, booking: booking };
  }

  function negotiateLead(state, leadId, options, rng) {
    rng = rng || Math.random;
    options = options || {};
    const lead = getLead(state, leadId);
    if (!lead || !(lead.status === "new" || lead.status === "screened" || lead.status === "countered")) {
      return { ok: false, message: "That lead is no longer available." };
    }
    if (lead.negotiationAttempts >= 2) return { ok: false, message: "This client will not negotiate again." };

    const targetPrice = roundTo(clamp(Number(options.price) || lead.offer, 75, 2000), 5);
    const startAbs = Number(options.startAbs) || lead.requestedStartAbs;
    const depositPct = clamp(Number(options.depositPct) || 0, 0, 0.5);
    if (!isSlotAvailable(state, startAbs, lead.durationMin)) return { ok: false, message: "That time conflicts with another booking." };

    advanceTime(state, 20, rng);
    lead.negotiationAttempts += 1;
    const probability = estimateNegotiation(state, lead, targetPrice, depositPct);
    const roll = rng();

    if (roll < probability) {
      const booking = createBookingFromLead(state, lead, { price: targetPrice, startAbs: startAbs, depositPct: depositPct });
      state.progress.negotiationsWon = (state.progress.negotiationsWon || 0) + 1;
      state.player.careerXP += 9;
      applyLevelProgress(state);
      log(state, "Negotiation succeeded", lead.name + " accepted " + formatCurrency(targetPrice) + (depositPct ? " with a " + Math.round(depositPct * 100) + "% deposit." : "."), "finance");
      return { ok: true, outcome: "accepted", probability: probability, booking: booking };
    }

    if (roll < probability + 0.22 && targetPrice > lead.offer) {
      const counter = roundTo(clamp((lead.offer + Math.min(targetPrice, lead.budgetMax)) / 2, lead.offer, lead.budgetMax), 5);
      lead.offer = counter;
      lead.status = "countered";
      log(state, "Client countered", lead.name + " countered at " + formatCurrency(counter) + ".", "finance");
      return { ok: true, outcome: "counter", probability: probability, counter: counter, lead: lead };
    }

    lead.status = "declinedByClient";
    state.player.stress = clamp(state.player.stress + 2, 0, 100);
    log(state, "Negotiation ended", lead.name + " declined the quote.", "info");
    return { ok: true, outcome: "declined", probability: probability };
  }

  function declineLead(state, leadId) {
    const lead = getLead(state, leadId);
    if (!lead || !(lead.status === "new" || lead.status === "screened" || lead.status === "countered")) {
      return { ok: false, message: "That lead is no longer available." };
    }
    lead.status = "declined";
    if (lead.riskBase > 0.38) state.player.safety = clamp(state.player.safety + 1, 0, 100);
    log(state, "Lead declined", "You passed on " + lead.name + "'s request.", "info");
    return { ok: true };
  }

  function cancelBooking(state, bookingId) {
    const booking = getBooking(state, bookingId);
    if (!booking || booking.status !== "scheduled") return { ok: false, message: "That booking cannot be cancelled." };
    const hoursAway = (booking.startAbs - absoluteMinutes(state)) / 60;
    booking.status = "cancelledByPlayer";
    if (booking.depositPaid > 0) state.player.cash -= booking.depositPaid;
    const penalty = hoursAway >= 8 ? 2 : 7;
    state.player.reputation = clamp(state.player.reputation - penalty, 0, 100);
    state.player.stress = clamp(state.player.stress + (hoursAway >= 8 ? 2 : 6), 0, 100);
    log(state, "Booking cancelled", "You cancelled with " + booking.clientName + (hoursAway >= 8 ? " with notice." : " at short notice."), "warning");
    return { ok: true, penalty: penalty };
  }

  function chooseComplication(state, booking, rng) {
    const lead = getLead(state, booking.leadId);
    const pool = ["extension", "venueChange", "photoRequest"];
    if (!lead || lead.redFlags.indexOf("Dismisses stated boundaries") >= 0) pool.push("boundaryTest", "boundaryTest");
    if (!lead || lead.redFlags.indexOf("Hints at arriving intoxicated") >= 0) pool.push("intoxication", "intoxication");
    if (!lead || lead.redFlags.indexOf("Asks for an unlisted guest") >= 0) pool.push("surpriseGuest", "surpriseGuest");
    if (booking.risk > 0.35) pool.push("boundaryTest", "intoxication", "surpriseGuest");
    return pick(rng, pool);
  }

  function beginBooking(state, bookingId, rng) {
    rng = rng || Math.random;
    const booking = getBooking(state, bookingId);
    if (!booking || booking.status !== "scheduled") return { ok: false, message: "That booking is not available to begin." };
    const now = absoluteMinutes(state);
    const earlyBy = booking.startAbs - now;
    if (earlyBy > 240) return { ok: false, message: "It is too early. Use the calendar or other activities first." };
    if (now > booking.startAbs + 60) {
      booking.status = "missed";
      state.player.reputation = clamp(state.player.reputation - 8, 0, 100);
      if (booking.depositPaid > 0) state.player.cash -= booking.depositPaid;
      log(state, "Booking missed", "You arrived too late for " + booking.clientName + ".", "warning");
      return { ok: false, message: "The booking was missed." };
    }

    if (earlyBy > 0) advanceTime(state, earlyBy, rng);

    const noShowChance = clamp(0.025 + booking.risk * 0.09 - (booking.screened ? 0.02 : 0), 0.01, 0.1);
    if (rng() < noShowChance) {
      booking.status = "clientNoShow";
      state.player.stress = clamp(state.player.stress + 5, 0, 100);
      state.player.energy = clamp(state.player.energy - 3, 0, 100);
      if (booking.depositPaid > 0) {
        state.player.weeklyIncome += booking.depositPaid;
        state.player.totalIncome += booking.depositPaid;
      }
      log(state, "Client no-show", booking.clientName + " did not arrive. You kept the agreed deposit.", "warning");
      return { ok: true, noShow: true, booking: booking };
    }

    booking.status = "inProgress";
    const encounter = {
      id: nextId(state, "x"),
      bookingId: booking.id,
      phaseIndex: 0,
      mood: clamp(50 + state.player.skills.charm * 2 + state.player.reputation * 0.08, 35, 70),
      respect: clamp(48 + (booking.screened ? 5 : 0) + state.player.skills.screening, 35, 68),
      safety: clamp(82 - booking.risk * 38 + (state.player.services.security ? 13 : 0) + state.buffs.saferRides * 5, 38, 98),
      stressGain: 0,
      exposureGain: 0,
      energyCost: 0,
      bonusCash: 0,
      extraMinutes: 0,
      endedEarly: false,
      safeExit: false,
      complicationId: chooseComplication(state, booking, rng),
      choices: []
    };
    state.activeEncounter = encounter;
    log(state, "Date started", "You met " + booking.clientName + " at " + LOCATION_NAMES[booking.venueId] + ".", "booking");
    return { ok: true, encounter: encounter, booking: booking };
  }

  function getEncounterPhase(state) {
    const encounter = state.activeEncounter;
    if (!encounter) return null;

    if (encounter.phaseIndex === 0) {
      return {
        id: "arrival",
        eyebrow: "Phase 1 of 3 · Arrival",
        title: "Set the tone",
        text: "The first few minutes establish warmth, professionalism, and whether the agreed plan still feels right.",
        choices: [
          { id: "warmWelcome", label: "Give a warm, punctual welcome", detail: "Use charm to build mood quickly." },
          { id: "confirmPlan", label: "Confirm the plan and boundaries", detail: "Build respect and reduce uncertainty." },
          { id: "premiumUpgrade", label: "Offer a premium upgrade", detail: "Use negotiation skill for possible extra revenue." }
        ]
      };
    }

    if (encounter.phaseIndex === 1) {
      return {
        id: "connection",
        eyebrow: "Phase 2 of 3 · Connection",
        title: "Be a good date",
        text: "Read the room and choose how to balance attention, energy, and schedule discipline.",
        choices: [
          { id: "listen", label: "Ask thoughtful questions", detail: "Strong mood gain and lower stress." },
          { id: "story", label: "Share a polished story", detail: "Charm-forward, but uses more energy." },
          { id: "professional", label: "Keep the evening structured", detail: "Build respect, safety, and punctuality." }
        ]
      };
    }

    const complication = COMPLICATIONS[encounter.complicationId] || COMPLICATIONS.extension;
    return {
      id: "complication",
      eyebrow: "Phase 3 of 3 · Decision",
      title: complication.title,
      text: complication.text,
      choices: complication.choices.map(function (choice) {
        const supportDetail = choice.supportChoice && state.player.services.security ? " Your protection contact is active." : "";
        return { id: choice.id, label: choice.label, detail: choice.detail + supportDetail };
      })
    };
  }

  function applyEffects(encounter, effects) {
    effects = effects || {};
    encounter.mood = clamp(encounter.mood + (effects.mood || 0), 0, 100);
    encounter.respect = clamp(encounter.respect + (effects.respect || 0), 0, 100);
    encounter.safety = clamp(encounter.safety + (effects.safety || 0), 0, 100);
    encounter.stressGain += effects.stress || 0;
    encounter.exposureGain += effects.exposure || 0;
    encounter.energyCost += Math.abs(effects.energy || 0);
    encounter.extraMinutes += effects.time || 0;
  }

  function applyEncounterChoice(state, choiceId, rng) {
    rng = rng || Math.random;
    const encounter = state.activeEncounter;
    if (!encounter) return { ok: false, message: "No date is currently active." };
    const booking = getBooking(state, encounter.bookingId);
    if (!booking) return { ok: false, message: "The booking record is missing." };
    const phase = getEncounterPhase(state);
    const choice = phase.choices.find(function (item) { return item.id === choiceId; });
    if (!choice) return { ok: false, message: "That choice is not available." };

    let effects = {};
    let chosenDefinition = null;

    if (phase.id === "arrival") {
      if (choiceId === "warmWelcome") effects = { mood: 9 + state.player.skills.charm * 2, respect: 3, energy: -2 };
      if (choiceId === "confirmPlan") effects = { mood: 3, respect: 12 + state.player.skills.screening, safety: 7, stress: -1 };
      if (choiceId === "premiumUpgrade") {
        const successChance = clamp(0.38 + state.player.skills.negotiation * 0.1 + (state.player.services.manager ? 0.08 : 0), 0.45, 0.9);
        if (rng() < successChance) {
          encounter.bonusCash += roundTo(booking.rate * 0.18, 5);
          effects = { mood: 6, respect: 3, energy: -2 };
        } else {
          effects = { mood: -5, respect: -3, stress: 3 };
        }
      }
    } else if (phase.id === "connection") {
      if (choiceId === "listen") effects = { mood: 11 + state.player.skills.charm, respect: 5, stress: -3, energy: -2 };
      if (choiceId === "story") effects = { mood: 8 + state.player.skills.charm * 2, respect: 2, energy: -5 };
      if (choiceId === "professional") effects = { mood: 3, respect: 12, safety: 5, energy: -1 };
    } else {
      const complication = COMPLICATIONS[encounter.complicationId] || COMPLICATIONS.extension;
      chosenDefinition = complication.choices.find(function (item) { return item.id === choiceId; });
      effects = chosenDefinition ? Object.assign({}, chosenDefinition.effects) : {};

      if (chosenDefinition && chosenDefinition.extension) {
        const chance = clamp(0.5 + state.player.skills.negotiation * 0.08 + (state.player.services.manager ? 0.08 : 0), 0.55, 0.94);
        if (rng() < chance) {
          encounter.bonusCash += roundTo(booking.rate * 0.55, 5);
        } else {
          effects.mood = (effects.mood || 0) - 6;
          effects.respect = (effects.respect || 0) - 3;
          effects.time = 0;
          effects.energy = 0;
        }
      }

      if (chosenDefinition && chosenDefinition.supportChoice && state.player.services.security) {
        effects.safety = (effects.safety || 0) + 9;
        effects.stress = (effects.stress || 0) - 3;
      }

      if (chosenDefinition && chosenDefinition.endsEarly) {
        encounter.endedEarly = true;
        encounter.safeExit = Boolean(chosenDefinition.safeExit);
      }
    }

    applyEffects(encounter, effects);
    encounter.choices.push({ phaseId: phase.id, choiceId: choiceId, label: choice.label });
    encounter.phaseIndex += 1;

    if (encounter.phaseIndex >= 3 || encounter.endedEarly) {
      const result = finalizeEncounter(state, rng);
      return { ok: true, finished: true, result: result };
    }
    return { ok: true, finished: false, encounter: encounter, phase: getEncounterPhase(state) };
  }

  function abortEncounter(state, rng) {
    rng = rng || Math.random;
    const encounter = state.activeEncounter;
    if (!encounter) return { ok: false, message: "No date is currently active." };
    encounter.endedEarly = true;
    encounter.safeExit = true;
    encounter.safety = clamp(encounter.safety + 22, 0, 100);
    encounter.respect = clamp(encounter.respect + 4, 0, 100);
    encounter.mood = clamp(encounter.mood - 16, 0, 100);
    encounter.stressGain += 5;
    encounter.choices.push({ phaseId: "exit", choiceId: "safeExit", label: "End date safely" });
    return { ok: true, result: finalizeEncounter(state, rng) };
  }

  function finalizeEncounter(state, rng) {
    const encounter = state.activeEncounter;
    if (!encounter) return null;
    const booking = getBooking(state, encounter.bookingId);
    const difficulty = getDifficulty(state);
    if (!booking) {
      state.activeEncounter = null;
      return null;
    }
    const client = state.clients[booking.clientName] || (state.clients[booking.clientName] = {
      name: booking.clientName,
      age: booking.clientAge,
      archetypeLabel: booking.archetypeLabel,
      dates: 0,
      averageReview: 0,
      regular: false,
      notes: []
    });

    const remainingMinutes = encounter.endedEarly ? Math.round(booking.durationMin * 0.38) : booking.durationMin + encounter.extraMinutes;
    advanceTime(state, remainingMinutes, rng);

    const riskChance = clamp(booking.risk * difficulty.risk * Math.max(0, 72 - encounter.safety) / 230, 0, 0.28);
    const incident = !encounter.safeExit && rng() < riskChance;
    let rating;
    let gross;
    let tip;
    let outcomeTitle;
    let outcomeText;

    if (incident) {
      rating = clamp(Math.round((encounter.mood + encounter.respect) / 45), 1, 4);
      tip = 0;
      gross = booking.depositPaid;
      outcomeTitle = "Safety-first exit";
      outcomeText = "A boundary or logistics problem escalated, so you ended the booking and used your safety plan. No graphic incident is depicted.";
      state.player.stress = clamp(state.player.stress + 19 * difficulty.stress, 0, 100);
      state.player.wellness = clamp(state.player.wellness - 7, 0, 100);
      state.player.safety = clamp(state.player.safety - 8, 0, 100);
      state.player.exposure = clamp(state.player.exposure + 6, 0, 100);
    } else if (encounter.endedEarly) {
      rating = clamp(Math.round((encounter.mood * 0.35 + encounter.respect * 0.65) / 20), 2, 5);
      tip = 0;
      gross = booking.depositPaid;
      outcomeTitle = "Date ended early";
      outcomeText = "You chose a clear exit and kept control of the situation. The deposit was the only earnings from this booking.";
      state.player.stress = clamp(state.player.stress + Math.max(3, encounter.stressGain) * difficulty.stress, 0, 100);
      state.player.safety = clamp(state.player.safety + 2, 0, 100);
    } else {
      rating = clamp(Math.round((encounter.mood * 0.54 + encounter.respect * 0.46) / 20), 1, 5);
      const tipPct = encounter.mood >= 88 ? 0.25 : encounter.mood >= 76 ? 0.16 : encounter.mood >= 64 ? 0.08 : 0;
      tip = roundTo(booking.rate * tipPct * difficulty.earnings, 5);
      gross = roundTo((booking.rate + encounter.bonusCash) * difficulty.earnings + tip, 5);
      outcomeTitle = rating >= 5 ? "Standout date" : rating >= 4 ? "Strong date" : rating >= 3 ? "Solid date" : "Difficult date";
      outcomeText = "Mood " + Math.round(encounter.mood) + ", respect " + Math.round(encounter.respect) + ", and safety " + Math.round(encounter.safety) + " produced a " + rating + "-star review.";
      state.player.stress = clamp(state.player.stress + Math.max(0, 10 - encounter.respect * 0.07 + encounter.stressGain) * difficulty.stress, 0, 100);
      state.player.safety = clamp(state.player.safety + (encounter.safety >= 78 ? 1 : -2), 0, 100);
    }

    const managerFee = state.player.services.manager ? roundTo(gross * 0.15, 5) : 0;
    const payoutNow = gross - booking.depositPaid - managerFee;
    state.player.cash += payoutNow;
    state.player.weeklyIncome += Math.max(0, gross - managerFee);
    state.player.totalIncome += Math.max(0, gross - managerFee);
    state.player.energy = clamp(state.player.energy - 18 - encounter.energyCost - (encounter.extraMinutes / 60) * 5, 0, 100);
    state.player.exposure = clamp(state.player.exposure + encounter.exposureGain + (booking.venueId === "hotel" ? 1 : 0), 0, 100);
    state.player.reputation = clamp(state.player.reputation + (rating - 3) * 2 + (encounter.safety >= 75 ? 1 : 0), 0, 100);
    state.player.careerXP += rating * 12 + Math.round(encounter.respect / 8) + (encounter.safeExit ? 8 : 0);
    state.player.totalDates += 1;
    state.player.bestReview = Math.max(state.player.bestReview, rating);

    booking.status = incident ? "endedForSafety" : (encounter.endedEarly ? "endedEarly" : "completed");
    booking.review = rating;
    booking.result = {
      gross: gross,
      tip: tip,
      managerFee: managerFee,
      net: gross - managerFee,
      mood: Math.round(encounter.mood),
      respect: Math.round(encounter.respect),
      safety: Math.round(encounter.safety),
      incident: incident,
      endedEarly: encounter.endedEarly
    };

    client.dates += 1;
    client.averageReview = Math.round(((client.averageReview * (client.dates - 1) + rating) / client.dates) * 10) / 10;
    client.notes = encounter.choices.map(function (item) { return item.label; }).slice(-5);
    if (!incident && !encounter.endedEarly && rating >= 4 && rng() < 0.42 + state.player.skills.charm * 0.035) {
      client.regular = true;
    }

    if (!incident && rating === 5 && rng() < 0.55 && activeLeads(state).length < 8) {
      const referral = generateLead(state, rng, { safer: true });
      referral.greenFlags.unshift("Referred by " + booking.clientName);
      state.leads.push(referral);
      outcomeText += " A referral also entered your lead list.";
    }

    if (state.buffs.saferRides > 0) state.buffs.saferRides -= 1;
    applyLevelProgress(state);
    checkMilestone(state);
    log(state, outcomeTitle, outcomeText + " Net earnings: " + formatCurrency(gross - managerFee) + ".", incident ? "warning" : "success");
    state.activeEncounter = null;

    return {
      title: outcomeTitle,
      text: outcomeText,
      rating: rating,
      gross: gross,
      tip: tip,
      managerFee: managerFee,
      net: gross - managerFee,
      incident: incident,
      endedEarly: encounter.endedEarly,
      regular: client.regular
    };
  }

  function performLocationAction(state, actionId, rng) {
    rng = rng || Math.random;
    const p = state.player;
    const fail = function (message) { return { ok: false, message: message }; };
    const spend = function (amount) {
      if (p.cash < amount) return false;
      p.cash -= amount;
      p.weeklyExpenses += amount;
      return true;
    };

    switch (actionId) {
      case "rest":
        advanceTime(state, 240, rng);
        p.energy = clamp(p.energy + 48, 0, 100);
        p.stress = clamp(p.stress - 13 - p.skills.resilience * 2, 0, 100);
        p.wellness = clamp(p.wellness + 4, 0, 100);
        log(state, "Rested at home", "Energy recovered and stress eased.", "wellbeing");
        break;
      case "sleep": {
        const now = absoluteMinutes(state);
        const todayEight = (dayFromAbsolute(now) - 1) * 1440 + 8 * 60;
        const target = now < todayEight ? todayEight : todayEight + 1440;
        advanceTime(state, target - now, rng);
        p.energy = clamp(p.energy + 76, 0, 100);
        p.stress = clamp(p.stress - 19 - p.skills.resilience * 2, 0, 100);
        p.wellness = clamp(p.wellness + 6, 0, 100);
        log(state, "Full sleep", "You slept until 8:00 AM and reset for the day.", "wellbeing");
        break;
      }
      case "meal":
        if (!spend(18)) return fail("You need $18 for a proper meal.");
        advanceTime(state, 60, rng);
        p.energy = clamp(p.energy + 16, 0, 100);
        p.wellness = clamp(p.wellness + 9, 0, 100);
        p.stress = clamp(p.stress - 3, 0, 100);
        log(state, "Meal and reset", "A proper meal improved energy and wellness.", "wellbeing");
        break;
      case "admin":
        advanceTime(state, 60, rng);
        p.marketingReach = clamp(p.marketingReach + 1, 0, 20);
        if (activeLeads(state).length < 8 && rng() < 0.75) state.leads.push(generateLead(state, rng));
        p.stress = clamp(p.stress + 1, 0, 100);
        log(state, "Admin hour", "You updated availability, notes, and follow-ups.", "business");
        break;
      case "quickPost":
        if (!spend(35)) return fail("You need $35 for the promoted post.");
        advanceTime(state, 60, rng);
        p.marketingReach = clamp(p.marketingReach + 2, 0, 20);
        p.exposure = clamp(p.exposure + 2, 0, 100);
        ensureLeadPipeline(state, Math.min(8, activeLeads(state).length + 1), rng);
        log(state, "Profile boost", "A targeted promotion increased reach with a small exposure trade-off.", "business");
        break;
      case "campaign":
        if (!spend(125)) return fail("You need $125 for the campaign shoot.");
        advanceTime(state, 180, rng);
        p.marketingReach = clamp(p.marketingReach + 5, 0, 20);
        p.reputation = clamp(p.reputation + 2, 0, 100);
        p.exposure = clamp(p.exposure + 5, 0, 100);
        ensureLeadPipeline(state, Math.min(8, activeLeads(state).length + 2), rng);
        log(state, "New brand campaign", "Fresh low-key promotional material improved reach and reputation.", "business");
        break;
      case "checkup":
        if (!spend(70)) return fail("You need $70 for the wellness appointment.");
        advanceTime(state, 120, rng);
        p.wellness = clamp(p.wellness + 26, 0, 100);
        p.safety = clamp(p.safety + 3, 0, 100);
        p.stress = clamp(p.stress - 6, 0, 100);
        log(state, "Wellness check", "You completed a routine adult wellness appointment.", "wellbeing");
        break;
      case "counselling":
        if (!spend(90)) return fail("You need $90 for the counselling session.");
        advanceTime(state, 120, rng);
        p.stress = clamp(p.stress - 31 - p.skills.resilience * 2, 0, 100);
        p.wellness = clamp(p.wellness + 6, 0, 100);
        log(state, "Counselling session", "Stress dropped and resilience improved through deliberate recovery.", "wellbeing");
        break;
      case "walk":
        advanceTime(state, 90, rng);
        p.stress = clamp(p.stress - 16 - p.skills.resilience, 0, 100);
        p.energy = clamp(p.energy + 4, 0, 100);
        p.wellness = clamp(p.wellness + 5, 0, 100);
        log(state, "Park walk", "A quiet walk restored balance without spending money.", "wellbeing");
        break;
      case "fitness":
        if (!spend(20)) return fail("You need $20 for the fitness session.");
        advanceTime(state, 120, rng);
        p.wellness = clamp(p.wellness + 13, 0, 100);
        p.energy = clamp(p.energy - 5, 0, 100);
        p.safety = clamp(p.safety + 3, 0, 100);
        p.stress = clamp(p.stress - 9, 0, 100);
        log(state, "Fitness session", "Wellness and confidence improved at an energy cost.", "wellbeing");
        break;
      case "screenPrep":
        if (!spend(15)) return fail("You need $15 for the café workspace and verification tools.");
        advanceTime(state, 60, rng);
        state.buffs.screeningPrep = Math.max(state.buffs.screeningPrep, 2);
        p.stress = clamp(p.stress - 4, 0, 100);
        log(state, "Screening preparation", "Your next two screening checks receive an accuracy bonus.", "safety");
        break;
      case "network":
        if (!spend(40)) return fail("You need $40 for the network meetup.");
        advanceTime(state, 120, rng);
        p.marketingReach = clamp(p.marketingReach + 2, 0, 20);
        p.reputation = clamp(p.reputation + 1, 0, 100);
        state.leads.push(generateLead(state, rng, { safer: true }));
        log(state, "Peer network meetup", "You gained reach and a documented referral.", "business");
        break;
      case "workshop":
        if (!spend(150)) return fail("You need $150 for the negotiation workshop.");
        advanceTime(state, 180, rng);
        p.careerXP += 52;
        p.stress = clamp(p.stress - 3, 0, 100);
        applyLevelProgress(state);
        log(state, "Negotiation workshop", "Practical training added career experience.", "business");
        break;
      case "peerCircle":
        if (!spend(35)) return fail("You need $35 for the peer-support session.");
        advanceTime(state, 120, rng);
        p.stress = clamp(p.stress - 14, 0, 100);
        p.safety = clamp(p.safety + 6, 0, 100);
        state.leads.push(generateLead(state, rng, { safer: true }));

        break;
      case "hostShift": {
        const hour = Math.floor(p.minuteOfDay / 60);
        if (hour < 16 || hour >= 23) return fail("Hosting shifts start between 4 PM and 11 PM.");
        if (p.energy < 15) return fail("You are too tired for a four-hour shift. Rest first.");
        const pay = roundTo((80 + p.level * 6 + p.skills.charm * 4) * getDifficulty(state).earnings, 5);
        advanceTime(state, 240, rng);
        p.cash += pay;
        p.weeklyIncome += pay;
        p.totalIncome += pay;
        p.energy = clamp(p.energy - 14, 0, 100);
        p.stress = clamp(p.stress + 3, 0, 100);
        p.careerXP += 6;
        state.progress.shifts = (state.progress.shifts || 0) + 1;
        applyLevelProgress(state);
        log(state, "Hosting shift", "Four hours greeting guests at the Lantern Lounge paid " + formatCurrency(pay) + ".", "finance");
        break;
      }
      case "mixer":
        if (!spend(60)) return fail("You need $60 to host the mixer.");
        advanceTime(state, 180, rng);
        p.marketingReach = clamp(p.marketingReach + 2, 0, 20);
        p.reputation = clamp(p.reputation + 1, 0, 100);
        p.stress = clamp(p.stress - 2, 0, 100);
        p.careerXP += 20;
        if (activeLeads(state).length < 8 && rng() < 0.65) state.leads.push(generateLead(state, rng, { safer: true }));
        applyLevelProgress(state);
        log(state, "Networking mixer", "You hosted a relaxed mixer: more reach, a little reputation, and often a vetted introduction.", "business");
        break;
      case "liveMusic":
        if (!spend(25)) return fail("You need $25 for the live-music cover.");
        advanceTime(state, 90, rng);
        p.stress = clamp(p.stress - 18 - p.skills.resilience * 2, 0, 100);
        p.wellness = clamp(p.wellness + 4, 0, 100);
        p.energy = clamp(p.energy - 3, 0, 100);
        log(state, "Live music", "A set of live music with friends took the edge off the week.", "wellbeing");
        break;
      case "wait30":
        advanceTime(state, 30, rng, "Waited");
        break;
      case "wait60":
        advanceTime(state, 60, rng, "Waited");
        break;
      default:
        return fail("Unknown action.");
    }

    if (SELF_CARE_ACTIONS.indexOf(actionId) >= 0) state.progress.selfCare = (state.progress.selfCare || 0) + 1;
    checkMilestone(state);
    return { ok: true };
  }

  function toggleService(state, serviceId) {
    const p = state.player;
    if (serviceId !== "manager" && serviceId !== "security") return { ok: false, message: "Unknown service." };
    const enabled = p.services[serviceId];
    if (enabled) {
      p.services[serviceId] = false;
      if (serviceId === "manager") p.marketingReach = clamp(p.marketingReach - 1, 0, 20);
      if (serviceId === "security") p.safety = clamp(p.safety - 12, 0, 100);
      log(state, serviceId === "manager" ? "Management ended" : "Protection contract ended", "You returned to a more independent operating model.", "business");
      return { ok: true, enabled: false };
    }

    const cost = serviceId === "manager" ? 120 : 160;
    if (p.cash < cost) return { ok: false, message: "You need " + formatCurrency(cost) + " for onboarding." };
    p.cash -= cost;
    p.weeklyExpenses += cost;
    p.services[serviceId] = true;
    if (serviceId === "manager") p.marketingReach = clamp(p.marketingReach + 2, 0, 20);
    if (serviceId === "security") p.safety = clamp(p.safety + 18, 0, 100);
    log(state, serviceId === "manager" ? "Manager hired" : "Protection hired", "Onboarding cost " + formatCurrency(cost) + ". Daily retainer begins tomorrow.", "business");
    return { ok: true, enabled: true };
  }

  function setRate(state, value) {
    const rate = roundTo(clamp(Number(value) || state.player.baseRate, 75, 1000), 25);

    log(state, "Boundary updated", boundaryId + " is now " + (enabled ? "active" : "relaxed") + ".", "safety");

  function moveRegion(state, regionId, rng) {
    rng = rng || Math.random;
    const target = REGIONS[regionId];
    if (!target) return { ok: false, message: "Unknown region." };
    if (target.id === state.player.regionId) return { ok: false, message: "You already work in that region." };
    const now = absoluteMinutes(state);
    const soon = state.bookings.some(function (booking) {
      return booking.status === "scheduled" && booking.startAbs < now + 1440;
    });
    if (soon) return { ok: false, message: "Complete or cancel bookings in the next 24 hours before moving." };
    if (state.player.cash < target.moveCost) return { ok: false, message: "You need " + formatCurrency(target.moveCost) + " to relocate." };

    state.player.cash -= target.moveCost;
    state.player.weeklyExpenses += target.moveCost;
    advanceTime(state, 360, rng);
    state.player.regionId = target.id;
    state.player.currentLocation = "home";
    state.player.reputation = clamp(state.player.reputation - 2, 0, 100);
    state.player.exposure = clamp(state.player.exposure - 3, 0, 100);
    state.leads.forEach(function (lead) {
      if (lead.status === "new" || lead.status === "screened" || lead.status === "countered") lead.status = "archivedAfterMove";
    });
    ensureLeadPipeline(state, 5, rng);
    state.meta.lastRegionId = target.id;
    log(state, "Moved to " + target.name, "The move cost " + formatCurrency(target.moveCost) + ". Your lead pipeline was rebuilt for the new market.", "milestone");
    return { ok: true, region: target };
  }

  function upgradeSkill(state, skillId) {
    if (!(skillId in state.player.skills)) return { ok: false, message: "Unknown skill." };
    if (state.player.skillPoints < 1) return { ok: false, message: "You need a skill point." };
    if (state.player.skills[skillId] >= 5) return { ok: false, message: "That skill is already maxed." };

    state.player.skills[skillId] += 1;
    log(state, "Skill upgraded", skillId + " is now level " + state.player.skills[skillId] + ".", "milestone");

      id: nextId(state, "e"),
      kind: template.kind,
      title: template.title,

    };

  function resolveWorldEvent(state, eventId, choiceId, rng) {

      case "friendCheckIn":

        else if (choiceId === "voiceNote") { advanceTime(state, 30, rng); p.stress = clamp(p.stress - 7, 0, 100); }

        else if (choiceId === "wait") { p.marketingReach = clamp(p.marketingReach - 3, 0, 20); }

      case "peerReferral":

        else if (choiceId === "ignore") { p.exposure = clamp(p.exposure + 10, 0, 100); }
        else return { ok: false, message: "Invalid choice." };

      case "safetyAlert":
        if (choiceId === "rides") {
          if (p.cash < 45) return { ok: false, message: "You need $45 to pre-book rides." };
          p.cash -= 45; p.weeklyExpenses += 45; state.buffs.saferRides = 3; p.safety = clamp(p.safety + 5, 0, 100);
        } else if (choiceId === "screen") { state.buffs.screeningPrep = Math.max(state.buffs.screeningPrep, 3); p.marketingReach = clamp(p.marketingReach - 1, 0, 20); }

        break;
      case "complianceCheck":
        if (choiceId === "counsel") {
          if (p.cash < 180) return { ok: false, message: "You need $180 for professional support." };
          p.cash -= 180; p.weeklyExpenses += 180; p.exposure = clamp(p.exposure - 30, 0, 100); p.stress = clamp(p.stress - 4, 0, 100);

        else if (choiceId === "risk") {
          if (rng() < getRegion(state).scrutiny * 0.52) {

  function checkMilestone(state) {

  /** Where a goal stands: { value, target, done }. Targets come from CAREER_GOALS (1 when unset). */
  function goalStatus(state, goal) {
    const p = state.player;

    const target = goal.target || 1;
    const count = function (value) {
      value = Math.max(0, Number(value) || 0);
      return { value: Math.min(value, target), target: target, done: value >= target };

      case "screenFirst": return count((pr.screened || 0) + (state.leads.some(function (lead) { return lead.screened && !lead.regular; }) ? 1 : 0));

      case "firstDate": return count(p.totalDates);
      case "negotiator": return count(pr.negotiationsWon);
      case "selfCare": return count(pr.selfCare);
      case "fiveStar": return count(p.bestReview >= 5 ? 1 : 0);
      case "eveningShift": return count(pr.shifts);
      case "safetyNet": return count(p.cash);
      case "regularReturns": return count(pr.regularRebooked);
      case "levelThree": return count(p.level);
      case "strongWeek": return count(pr.bestWeekNet);
      case "trusted": return count(state.meta.milestoneShown || (p.cash >= 5000 && p.reputation >= 70) ? 1 : 0);
      case "sustainable": {
        const status = count(p.totalDates);
        status.done = status.done && p.wellness >= 60 && p.stress <= 50;
        return status;
      }
      default: return { value: 0, target: target, done: false };
    }
  }

  function applyGoalReward(state, reward) {
    const p = state.player;
    reward = reward || {};
    if (reward.xp) p.careerXP += reward.xp;
    if (reward.reputation) p.reputation = clamp(p.reputation + reward.reputation, 0, 100);
    if (reward.wellness) p.wellness = clamp(p.wellness + reward.wellness, 0, 100);
    if (reward.stress) p.stress = clamp(p.stress + reward.stress, 0, 100);
    if (reward.skillPoints) p.skillPoints += reward.skillPoints;
    if (reward.screeningPrep) state.buffs.screeningPrep = Math.max(state.buffs.screeningPrep, reward.screeningPrep);
  }

  /**
   * Mark every goal that is now met, pay its reward, and return the newly
   * completed ones (a reward can complete another goal, e.g. XP → level 3).
   */
  function checkGoals(state) {
    if (!state || !state.player) return [];
    state.goals = state.goals || {};
    state.progress = state.progress || {};
    const completed = [];
    for (let pass = 0; pass < 4; pass += 1) {
      let changed = false;
      CAREER_GOALS.forEach(function (goal) {
        if (state.goals[goal.id] != null) return;
        if (!goalStatus(state, goal).done) return;
        state.goals[goal.id] = absoluteMinutes(state);
        applyGoalReward(state, goal.reward);
        applyLevelProgress(state);
        log(state, "Goal complete: " + goal.title, goal.rewardText + ".", "milestone");
        completed.push(goal);
        changed = true;
      });
      if (!changed) break;
    }
    return completed;
  }

  function nextGoal(state) {

  }

    const netWeek = state.player.weeklyIncome - state.player.weeklyExpenses;

      modelName: modelName,

      activeLeadCount: activeLeads(state).length,

/* ------------------------------------------------------------------ scene */

const scene = new THREE.Scene();

// (That is how the original rendered, and it is what keeps the pastel look.)
