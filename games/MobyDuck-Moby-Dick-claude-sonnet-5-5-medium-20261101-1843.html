<!--
Moby Duck: a Moby-Dick spiritual successor

SOURCE INFORMATION
- Date: 2026-11-01 18:43
- Book: Moby-Dick; or, The Whale (Herman Melville). Game title: MOBY DUCK (title picked by RNG from 50 brainstormed riffs).
- Genre and Perspective: Arcade whaling action with rope-physics "Nantucket sleigh-ride" towing and a three-phase boss. Main perspective: third-person chase camera (PerspectiveCamera). Switchable at any time to top-down (OrthographicCamera) and first-person bow view.
- Tech: Three.js r180 (three@0.180.0, WebGPURenderer with automatic WebGL 2 fallback), Rapier 0.19.3 (@dimforge/rapier3d-compat) for physics, Web Audio API, Gamepad API, plain ES modules bundled with Bun 1.3.14 into one HTML file; three.js and Rapier load from the jsDelivr CDN through an import map; AI Hub session client 1.3.0 inlined unmodified.
- Art Direction: engine-native look: flat-shaded low-poly procedural meshes with three.js standard PBR materials, real-time shadow-mapped sun, hemisphere light, fog, ACES tone mapping and a vertex-displaced sea. No textures or imported assets.
- Animation: three.js AnimationMixer driving procedurally authored AnimationClips (quaternion/vector keyframe tracks) for rowing crew, harpoon throw, whale swim/thrash, tail slam and Moby's quack; boats and whales ride the same summed-sine wave function as the water mesh.
- Audio: everything written in code: six procedural sea-shanty moods (menu, calm, storm, boss, win, sad) from a lookahead Web Audio scheduler, about 30 synthesized sound effects, wind bed, and Animalese-style gibberish voices (one per speaker: Ishmael, Ahab, Queequeg, Starbuck, Stubb, narrator, Moby Duck's quack) synced to typewriter subtitles.
- Online: AI Hub session protocol v1, side-by-side (parallel) mode for 1 to 4 players: session meta tags, hub hello sent at once, seeded level deal via AIHub.rng, progress and result reporting, probe, time-up and end handling. No custom networking. Plays fully on its own outside a session.
- Testing: headless Chromium via Playwright (SwiftShader, WebGL 2 and WebGPU paths); AI Hub harness conformance at 1, 2 and 4 players (all PASS); scripted full-voyage playthroughs by the attract-mode bot (all three acts, boss phases); keyboard-only and emulated-DualSense menu/gameplay checks; touch-device emulation; audio smoke test of every sound and mood; defeat, retry and victory paths. No real GPU, real speakers or physical controller.
- Research: read the AI Hub lib/hub README, session client and harness, and the Rapier 0.19.3 typings. No web research on the book; the quotations are public-domain text from memory.
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium
- Usage: unknown (no cost or token estimate available to the session). Wall-clock session time about 45 minutes (18:43 to about 19:30).

TESTING FEEDBACK
- How many issues did testing catch? 11: black canvas (render never called), menu Back infinite recursion, hub hello sent too late, attract mode never exiting on input, attract reopening the title menu, touch notice hidden behind the title menu, Moby dying in 20 s to the bot, edge-on sail, HUD overlaps, red damage vignette on the title, dead shop income. One more (spyglass key never firing) was found by reading the code.
- How many were critical or game-breaking? 5: black canvas, menu recursion crash, late hub hello (hub failed the game), attract mode never exiting, spyglass dead.
- Most helpful test: the AI Hub harness (found the hello timing bug that a normal run never shows) together with the bot playing whole acts through a step hook.
- Least helpful test: static screenshots under software GL; slow and not representative of real lighting.

ENGINE FEEDBACK
- What did you like most about the engine? WebGPURenderer falls back to WebGL 2 with the same scene code, and standard materials, shadows, fog and AnimationMixer worked straight away. Rapier gave a rope joint, ray casts and contact events in a few lines, which made the sleigh-ride feel physical.
- Did you get stuck or guess wrong? Yes: Rapier's rope joint has no setLength (I rebuild it when reeling); a camera looking down +Z has its right-hand side on -X, which flipped my first stick-aim maths; WebGPU canvases screenshot blank so visual checks used the WebGL path; and the three plus three/webgpu import-map aliasing needed care.
- What was the most important thing you had to build yourself? The gameplay layer: unified controller/keyboard input and menu navigation, the three-perspective camera rig, whale and boss AI with telegraphs, the sea wave function shared by visuals and buoyancy, the instanced particle system, the procedural audio engine and the DOM UI.
- What was the hardest part about using the engine? There is no built-in water, particles or UI, and the big webgpu module graph loads slowly enough that anything the hub needs early (hello) must live outside the module.
- If you had to remove or overhaul one thing from engine, what would that be? The split between the `three` and `three/webgpu` entry points; a single entry point would remove a class of import mistakes.
- If you could change one thing about the engine, what would it be? A built-in cheap instanced particle and water helper so every game does not rewrite them.

PROMPT FEEDBACK
- What did you like most about this prompt? The concrete controller-first rules (with the axis-invert escape hatch), the attract mode spec, the AI Hub link, and permission to treat performance as unlimited.
- What was confusing? Placeholder tokens like "Pick a famous book" and SOURCE read as both a choice and a name; the filename brackets; "single html file" versus "dependencies need not be included"; and the 50 KB hub README versus "do not read files you do not need".
- What was the hardest thing to do? Satisfying every requirement in one file without being able to hear the audio or feel the controller, while keeping hub timing and controller-only menus correct.
- If there was one test you could of run, what would that test be? A headed, real-GPU playtest with a physical DualSense and audible output, recording frame pacing and audio levels.

  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */

  var framed = false;
  try {

  } catch (e) {

  }

    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */

    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */

      },

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */

      var t = a;

      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.

      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }

  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.

  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;

  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */

      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;

      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';

      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);

      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);

      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];

    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }

    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

      return false;

  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;

    delete fields.score;

    if (finite(given.score)) fields.score = Number(given.score);

    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();

    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  shopMenu(onDone) {
    const items = [];
    const names = Object.keys(UPG);
    for (const k of names) {
      const lvl = () => save.upg[k], cost = () => UPG[k].cost[lvl()];
      items.push({ label: () => `${UPG[k].name}  ${"●".repeat(lvl())}${"○".repeat(3 - lvl())}`, sub: () => (lvl() >= 3 ? "Fully fitted.  " : `${cost()} doubloons.  `) + UPG[k].desc, disabled: () => lvl() >= 3 || save.doubloons < cost(), action: () => {
        if (lvl() >= 3 || save.doubloons < cost()) {
          audio.sfx("back");
          return;
        }
        save.doubloons -= cost();
        save.upg[k]++;
        saveGame();
        audio.sfx("coin");
        this.ui.renderValues();
        this.ui.buildMenu();
      } });
    }
    items.push({ label: onDone ? "Back to the sea" : "Back", action: () => onDone ? onDone() : this.ui.back() });
    return { title: "The Spouter-Inn", sub: () => "", style: "center", onBack: onDone ? undefined : undefined, items, shop: true, get sub() {
      return `Doubloons: ${save.doubloons}   ·   “It was a queer sort of place; a gable-ended house, and not a single patch of sail.”`;
    } };
  },
  async startVoyage() {
    audio.ensure();
    this.ui.closeMenu();
    this.scene = "play";
    this.ended = false;
    this.resultSent = false;
    const g = this.game;
    g.hubGate = false;
    audio.setMood("calm");
    this.ui.setHud(true);
    g.newRun({ demo: false, session: false, act: 1 });
    g.locked = true;
    this.engine.setView(settings.view);
    save.voyages++;
    saveGame();
    const id = g.runId;
    const alive = () => g.runId === id && this.scene === "play";
    await this.cutscene(alive, [
      ["card", "Chapter 1", "Loomings", "Call me Ishmael. Some years ago—never mind how long precisely—having little money in my purse, I thought I would sail about a little and see the watery part of the world."],
      ["say", "ishmael", "Call me Ishmael. Having little money and a great deal of damp, I shipped aboard the Pequod to hunt the whale."],
      ["say", "starbuck", "Mind the line, Mr. Ishmael. A whale is a fish that mistakes itself for a mountain."],
      ["say", "queequeg", "Queequeg throw iron. Ishmael row. Whale pay the rent."]
    ]);
    if (!alive())
      return;
    await this.runActs(id);
  },
  async cutscene(alive, steps, quick = false) {
    for (const s of steps) {
      if (!alive())
        return;
      if (s[0] === "card")
        await this.ui.card(s[1], s[2], s[3], quick ? 1800 : 5200);
      else if (s[0] === "say")
        await this.ui.say(s[1], s[2]);
    }
  },
  async runActs(id) {
    const g = this.game;
    const alive = () => g.runId === id && this.scene === "play";
    for (let act = 1;act <= 3; act++) {
      if (!alive())
        return;
      if (act > 1)
        g.beginAct(act);
      g.locked = true;
      audio.setMood(act === 1 ? "calm" : act === 2 ? "storm" : "boss");
      const intro = [
        null,
        [["card", "Act I", "The Fishery", "“There she blows! There she blows! A hump like a snow-hill!”"], ["say", "stubb", "Thar she blows! Three spouters off the bow — fill the hold, boys!"]],
        [["card", "Act II", "The Gale", "“The sea had jeered and flouted at them; the storm was in their bones.”"], ["say", "starbuck", "The glass is falling. Whales or no whales, the gale will have its due."]],
        [["card", "Act III", "The Chase", "“Towards thee I roll, thou all-destroying but unconquering whale.”"], ["say", "ahab", "There he is — the White Whale! And he wears the face of a pond toy! Strike him, men, strike him!"]]
      ][act];
      await this.cutscene(alive, intro);
      if (!alive())
        return;
      g.locked = false;
      this.ui.toast(act === 1 ? "Find a spout. Hold " + label("throw") + " to charge, release to throw." : act === 2 ? "Watch the red rings — lightning!" : "Lance Moby when he is dazed!", 3600);
      await g.until(() => !alive() || g.actDone() || g.over);
      if (!alive())
        return;
      if (g.over)
        return;
      if (act < 3) {
        const bonus = Math.max(0, Math.round(300 - g.actT * 2));
        if (bonus)
          g.addScore(bonus, "speed bonus");
        audio.sfx("fanfare");
        await this.ui.card("Act complete", ["", "The Fishery", "The Gale"][act] + " — cleared", `Score ${Math.floor(g.score)}  ·  Oil ${g.oil}  ·  Doubloons earned ${g.doubloons}`, 3200);
        if (!alive())
          return;
        save.doubloons += g.doubloons + Math.floor((g.score - g.actStartScore) / 50);
        g.doubloons = 0;
        saveGame();
        g.locked = true;
        this.ui.setHud(false);
        await new Promise((res) => {
          this.ui.showMenu(this.shopMenu(() => {
            this.ui.closeMenu();
            res();
          }));
        });
        this.ui.setHud(true);
      }
    }
    if (alive())
      await this.victory();
  },
  async victory() {
    const g = this.game;
    this.ended = true;
    audio.setMood("win");
    audio.sfx("fanfare");
    const id = g.runId;
    g.locked = true;
    g.boat.vis.act.cheer.reset().play();
    const timeBonus = Math.max(0, Math.round(2400 - g.runTime * 4)), hullBonus = Math.round(g.boat.hp / g.boat.maxHp * 800);
    g.addScore(timeBonus + hullBonus, "finale");
    await this.ui.card("Victory", "The White Whale is Taken", "“Because one did survive the wreck.”", 3600);
    this.ui.say("ishmael", "And so the great white thing slid under, quacking once, softly, like a door in a dream.");
    this.finishRun(true, timeBonus, hullBonus);
  },
  finishRun(win, timeBonus = 0, hullBonus = 0) {
    const g = this.game;
    this.ended = true;
    this.ui.setHud(false);
    const score = Math.floor(g.score);
    if (hub.active) {
      this.sendResult(win);
      this.ui.showMenu({ style: "center", title: win ? "Voyage complete" : "The Pequod is lost", sub: `Score ${score}  ·  waiting for the hub…`, noBack: true, footer: false, items: [{ kind: "text", label: win ? "The White Whale is taken." : "And I only am escaped alone to tell thee." }] });
      return;
    }
    const earned = Math.floor(score / 150) + g.doubloons;
    save.doubloons += g.doubloons + Math.floor(score / 150);
    const newBest = score > save.best;
    if (newBest)
      save.best = score;
    if (win)
      save.wins++;
    saveGame();
    const t = (l, v) => ({ kind: "text", html: `<span style="display:inline-block;width:62%">${l}</span><b style="color:var(--gold)">${v}</b>` });
    this.ui.showMenu({ title: win ? `The Epilogue — "The drama's done."` : "And I only am escaped alone to tell thee", sub: win ? "The Pequod sails home, lighter by one white whale." : "The sea closes over the Pequod. Ishmael floats on a barrel.", noBack: true, style: "center", items: [
      t("Score", score + (newBest ? "  — NEW BEST!" : "")),
      t("Whales taken", g.kills),
      t("Barrels of oil", g.oil),
      t("Time", fmtTime(g.runTime)),
      t("Lances landed", g.stats.lances),
      t("Hull remaining", Math.round(g.boat.hp / g.boat.maxHp * 100) + "%"),
      t("Doubloons earned", earned),
      { label: win ? "Sail Again" : "Try Again", action: () => this.startVoyage() },
      { label: "The Spouter-Inn", action: () => this.ui.showMenu(this.shopMenu(), true) },
      { label: "Return to Title", action: () => this.toTitle() }
    ] });
  },
  abandon() {
    this.game.runId++;
    this.ui.closeMenu();
    this.toTitle();
  },
  openPause() {
    audio.ensure();
    this.game.setPaused(true);
    this.ui.showMenu(this.settingsMenu(true));
    this.ui.menu.title = "Paused";
    this.ui.buildMenu();
    audio.sfx("ok");
  },
  resume() {
    this.ui.closeMenu();
    this.game.setPaused(false);
    audio.sfx("back");
  },
  onGameEvent(name, v) {
    if (name === "defeat") {
      if (this.attract)
        return;
      const g = this.game;
      this.ended = true;
      if (hub.active) {
        this.finishRun(false);
        return;
      }
      this.ui.setHud(false);
      this.ui.say("narrator", "The whale has stove the boat. The sea takes what it likes.");
      const id = g.runId;
      this.ui.showMenu({ title: "Stove in!", sub: "The boat goes down, and Ishmael with it. Almost.", noBack: true, items: [
        { label: "Retry this act", action: () => {
          this.ui.closeMenu();
          this.retryAct();
        } },
        { label: "End voyage", action: () => this.finishRun(false) }
      ] });
    }
    if (name === "phase")
      audio.setMood("boss");
  },
  retryAct() {
    const g = this.game;
    this.ended = false;
    this.ui.setHud(true);
    g.score = g.actStartScore;
    g.over = false;
    g.beginAct(g.act);
    g.boat.hp = g.boat.maxHp;
    g.locked = false;
    g.accum = 0;
    this.ui.toast("The sea gives you another chance.", 2400);
  },
  async startSession() {
    const g = this.game;
    this.scene = "play";
    this.ui.closeMenu();
    this.ui.setHud(true);
    g.hubGate = true;
    this.engine.setView(settings.view);
    g.newRun({ demo: false, session: true, act: 1 });
    g.locked = false;
    audio.setMood("calm");
    this.sessionAct = 1;
    AI.on("start", () => audio.ensure());
    AI.on("time-up", () => {
      if (!this.resultSent)
        this.finishRun(false);
    });
    AI.on("end", () => {
      this.ended = true;
      g.running = false;
      this.ui.skipSay();
      audio.setMood("off");
      audio.setMuted(true);
      input.injected = null;
    });
    this.ui.toast("Harpoon 3 spouters — hold " + label("throw") + " to throw", 4000);
    AI.ready();
    this.sessionFlow(g.runId);
  },
  async sessionFlow(id) {
    const g = this.game;
    const alive = () => g.runId === id && !this.ended;
    for (let act = 1;act <= 3; act++) {
      if (act > 1) {
        g.beginAct(act);
        g.locked = false;
        audio.setMood(act === 2 ? "storm" : "boss");
        this.ui.card("Act " + ["", "I", "II", "III"][act], ["", "The Fishery", "The Gale", "The Chase"][act], "", 1800);
      }
      await g.until(() => !alive() || g.actDone() || g.over);
      if (!alive() || g.over)
        return;
      if (act < 3)
        g.addScore(Math.max(0, Math.round(300 - g.actT * 2)), "speed bonus");
    }
    if (alive()) {
      const tb = Math.max(0, Math.round(2400 - g.runTime * 4)), hb = Math.round(g.boat.hp / g.boat.maxHp * 800);
      g.addScore(tb + hb, "finale");
      this.finishRun(true, tb, hb);
    }
  },
  sendResult(win) {
    if (this.resultSent)
      return;
    this.resultSent = true;
    const g = this.game;
    const score = Math.floor(g.score);
    const awards = [];
    if (win)
      awards.push({ title: "Quacked the White Whale", detail: fmtTime(g.runTime) });
    if (g.stats.lances >= 8)
      awards.push({ title: "Lance master", detail: g.stats.lances + " strikes" });
    if (g.oil >= 25)
      awards.push({ title: "Oil baron", detail: g.oil + " barrels" });
    try {
      AI.result({ score, stats: { whales: g.kills, oil: g.oil, lances: g.stats.lances, time: fmtTime(g.runTime), hull: Math.round(g.boat.hp / g.boat.maxHp * 100) + "%" }, awards: awards.slice(0, 3) });
    } catch (e) {}
  },
  watchHub() {
    if (!hub.active)
      return;
    const g = this.game;
    const s = Math.floor(g.score);
    if (s !== this.lastProg) {
      this.lastProg = s;
      AI.progress({ score: s, label: ("Act " + g.act + " · " + g.kills + " whales").slice(0, 24) });
    }
  },
  startAttract() {
    if (this.attract || touchOnly() && false)
      return;
    const g = this.game;
    this.attract = true;
    this.attractT = 0;
    this.attractAct = 1;
    this.attractStage = 0;
    this.ui.closeMenu();
    this.ui.setHud(true);
    document.getElementById("attract").style.display = "block";
    this.scene = "title";
    g.hubGate = false;
    g.newRun({ demo: true, act: 1 });
    g.locked = false;
    this.engine.setView("chase");
    audio.setMood("calm");
    this.stageT = 0;
  },
  driveAttract() {
    const g = this.game;
    this.stageT = (this.stageT || 0) + 1 / 60;
    const next = this.stageT > [55, 60, 80][this.attractAct - 1] || g.actDone() && this.stageT > 4;
    if (g.boat.sinking || g.over) {
      g.boat.hp = g.boat.maxHp;
      g.boat.sinking = 0;
      g.over = false;
    }
    if (next) {
      this.attractAct = this.attractAct % 3 + 1;
      this.stageT = 0;
      g.beginAct(this.attractAct);
      g.locked = false;
      audio.setMood(this.attractAct === 1 ? "calm" : this.attractAct === 2 ? "storm" : "boss");
      this.ui.toast(["", "Act I — The Fishery", "Act II — The Gale", "Act III — The Chase"][this.attractAct], 2400);
    }
  },
  stopAttract() {
    this.attract = false;
    input.injected = null;
    const g = this.game;
    g.demo = false;
    g.botAim = undefined;
    g.running = false;
    g.paused = false;
    document.getElementById("attract").style.display = "none";
    this.ui.setHud(false);
    this.ui.skipSay();
    this.engine.setView(settings.view);
    this.toTitle();
    audio.setMood("menu");
    input.lastActivity = performance.now();
  },
  tickHints() {
    const g = this.game;
    if (this.scene !== "play" && !this.attract) {
      g.hint = "";
      return;
    }
    const b = g.boat;
    let h = "";
    if (g.demo)
      h = "";
    else if (g.locked)
      h = "";
    else if (g.act === 1 && g.runTime < 25)
      h = !g.stats.throws ? `Aim ${label("aim")} · hold ${label("throw")} to charge · release to throw` : "";
    else if (b.rope && b.rope.dist > 16 && g.act < 3)
      h = `Hold ${label("reel")} to reel in · ${label("lance")} to lance when close`;
    else if (b.rope && b.rope.dist <= 16)
      h = `${label("lance")}: LANCE!`;
    else if (b.hp < b.maxHp * 0.35 && b.planks > 0)
      h = `${label("repair")}: patch the hull`;
    if (g.act === 3 && g.boss && g.boss.alive && g.boss.stun > 0 && !g.locked && !g.demo)
      h = `Moby is dazed — ${label("lance")}!`;
    g.hint = h;
  }
};
window.addEventListener("DOMContentLoaded", () => App.boot().catch((e) => {
  console.error(e);
  document.getElementById("loadmsg").textContent = "Failed to start: " + e.message;
  if (AI && AI.active)
    AI.fail(String(e.message));
}));
</script>

he engine?\n- If you had to remove or overhaul one thing from engine, what woudl that be?\n- If you could change one thing about the engine, what would it be?"},"promptFeedback":{"id":"pf-4q","text":"- What did you like most about this prompt?\n- What was confusing? \n- What was the hardest thing to do? \n- If there was one test you could of run, what would that test be?"},"goal":{"id":"on","text":"the bundled single .html file exists in this folder's root, every feature in TASK.md is implemented with no TODOs, placeholders or stubs, and your final reply contains the Source Information, Engine Feedback and Prompt Feedback sections."}},"promptNumber":5,"prompt":"SOURCE: Pick a famous book\n\nGenre: pick what would make the most interesting game\n\nPerspective: use one of the games engine native perspectives, allow the player to switch perspectives, but pick a main one\n\nGame Title: A playful riff on SOURCE's name. Silently brainstorm 50 titles, then pick one with a real random number generator (e.g., run code).\n\nResearch: Whether and how much to research is your choice.\n\nPackage: For ease of deployment and sharing provide a single html file [GameTitle-SOURCE-claude-sonnet-5-5-medium-20261101-1843.html]. Dependencies that can be downloaded do not have to be include in the html file if that is easier.\n\nTech Stack: Use Three.js R180, WEBGPU, rapier 0.19.3 for physics, Web Audio, Gamepad API; The rest of the tech stack is yours to choose.\n\nArt Direction: use the engine native style\n\nAnimation: use the engine native system\n\nAudio: Use code written Music and sound effects and Animalese / Simlish” / gibberish voice acting for any \"voice\" work.\n\nOnline: https://github.com/michaelcrosato/ai-hub/tree/main/lib/hub\n\nWorking Environment and deliverable:\nCreate a subfolder called [GameTitle-SOURCE-claude-sonnet-5-5-medium-20261101-1843] here you can keep all your dev files. You can develop separate modules, then bundle into a single file [GameTitle-SOURCE-claude-sonnet-5-5-medium-20261101-1843].html in root when the goal has been completed. You may use external CDN dependencies. Do not read files outside what you need - other agents share this directory.\n\nPerformance: Treat it as unlimited. Add as much detail, enemies, effects, lights, and shadows as the scene needs. Out of scope (handled later): FPS targets, optimization.\n\nTesting: Keep testing efficient and lightweight.\n\n## Goal\n\nBuild an original spiritual successor to Pick a famous book.\n\nScope\n\nCreate a feature-complete demo inspired by Pick a famous book. Capture what makes the source distinctive while modernizing and improving its mechanics, pacing, and UX wherever it benefits the game. The demo must be long enough to show ALL features and gameplay mechanics so a player can clearly understand how the game plays and feels, and what they can and cannot do. Treat the demo as a complete, polished vertical slice / game engine. It should contain all the infrastructure, systems, and polish needed so the remainder of the game could later be built out with normal designer tools.\n\nAttract Mode: After 10 seconds without input on the title/menu screen, start a looping AI-played demo or scripted replay (arcade/kiosk style); any input exits it. The AI (or replay) can be simple and may cheat freely (infinite health, ammo, abilities, no clip, etc). Its only job is to show as much of the demo as possible, the attract mode is not meant to balance the game. \n\nMultiplayer: Follow https://github.com/michaelcrosato/ai-hub/tree/main/lib/hub for multiplayer integration into ai-hub as well as for the game on its own.\n\nNarrative tone: Use a writing style similar to the Pick a famous book.\n\n## UI & UX: 10-Foot Controller-First Philosophy\nDesign all interfaces and interactions for a \"10-foot experience\" with a PS5-compatible controller as the primary input. Keyboard and mouse are secondary inputs that map to the controller's interaction model, not a separate desktop paradigm. Apply modern UX principles. Use your judgment to balance deep systemic information with clean, uncluttered presentation.\n\nCommon Issue (~10%): Gamepad horizontal/vertical input is intermittently inverted. As a quick fix, add toggles in Settings to invert horizontal and vertical axes.\n\nDo not use overly dense, web-style data screens.\n\nTouch-only devices: no touch controls; show \"Controller or keyboard required\" and the settings button. Allow the attract mode run.\n\n## Done\nNo TODOs, placeholders, or stubbed features. The demo is complete.\n\n## Source Information\nCRTICAL: Put Source Information, Engine Feedback and Prompt Feedback in your chat reply, an in-game About/Credits screen, and an HTML comment at the top of the file. Write \"unknown\" for anything you can't confirm.\n- Date: YYYY-MM-DD HH:MM\n- Pick a famous book\n- Genre and Perspective: genre and camera perspective used\n- Tech: stack, libraries/engines, with versions if applicable\n- Art Direction: style used\n- Animation: system used\n- Audio: music, sound effects and voice used\n- Online: network features used, or none\n- Testing: testing parameters allowed\n- Research: research done, or none\n- Environment: Claude Code CLI (headless); Linux; browser unknown\n- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium\n- Usage: the estimated API cost in USD, total number of tokens in K or M  (provide break down if available) and session time, only if estimates are available.\n\nTesting Feedback\n\n- How many issues did testing catch?\n- How many would be considered critical issues / game breaking?\n- What was the most helpful test you ran?\n- What was the least helpful test you ran? \n\nEngine Feedback\n\n- What did you like most about the engine?\n- Did you get stuck or guess wrong?\n- What was the most important thing you had to build yourself?\n- What was the hardest part about using the engine?\n- If you had to remove or overhaul one thing from engine, what woudl that be?\n- If you could change one thing about the engine, what would it be?\n\nPrompt Feedback \n\n- What did you like most about this prompt?\n- What was confusing? \n- What was the hardest thing to do? \n- If there was one test you could of run, what would that test be?\n","reply":"Moby Duck is built and works. The single-file deliverable is `MobyDuck-Moby-Dick-claude-sonnet-5-5-medium-20261101-1843.html` in this folder's root, with the dev files in the same-named subfolder.\n\nAll three acts, every menu, attract mode, the game's touch-device behaviour and the hub run all worked in headless Chromium. I haven't tried it on a real GPU or a real DualSense, and I couldn't listen to the audio. I only checked that every sound, mood and voice plays without errors.\n\nYou play Ishmael in a whaleboat. Three.js r180 WebGPU renders it (falling back to WebGL 2) with Rapier 0.19.3 physics. A harpoon sets a rope joint, so a hooked whale tows the boat.\n- **Acts:** The Fishery (3 spouters), The Gale (2 bulls plus a spouter, lightning and rogue waves), then The Chase against Moby Duck. He is a white whale with a duck's bill, in three phases with telegraphed slam, ram, breach and duckling attacks.\n- **Perspectives:** third-person chase is the main view. Top-down and bow first-person are one button away.\n- **Controls:** DualSense first, with keyboard and mouse mapped onto the same actions. Settings include invert horizontal and vertical axes.\n- **Extras:** the Spouter-Inn upgrade shop, saved progress, and an About/Credits screen.\n- **Attract mode:** after 10 seconds idle, a bot plays all three acts in a loop, and any input exits it.\n- **Touch-only devices:** show \"Controller or keyboard required\" with a Settings button, and attract mode still runs.\n- **AI Hub:** side-by-side mode for 1–4 players. The harness gives PASS at 1, 2 and 4 players.\n\nI wasn't given an API cost or token count, so Usage is \"unknown\". Wall-clock time was about 45 minutes.\n\n## Source Information\n- Date: 2026-11-01 18:43\n- Book: Moby-Dick; or, The Whale (Herman Melville). Game title: MOBY DUCK, picked by RNG from 50 brainstormed riffs.\n- Genre and Perspective: arcade whaling action with a rope-towing sleigh-ride and a three-phase boss. Main view is third-person chase (PerspectiveCamera), switchable to top-down (OrthographicCamera) and first-person bow.\n- Tech: Three.js r180 (WebGPURenderer, WebGL 2 fallback), Rapier 0.19.3, Web Audio, Gamepad API, ES modules bundled with Bun 1.3.14. Three and Rapier load from jsDelivr via an import map. AI Hub session client 1.3.0 is inlined unmodified.\n- Art Direction: engine-native flat-shaded low-poly procedural meshes with standard PBR materials, shadow-mapped sun, fog, ACES tone mapping and a vertex-displaced sea. No textures or imported assets.\n- Animation: three.js AnimationMixer with procedurally authored AnimationClips for the crew, harpoon throw, whale swim and thrash, tail slam and Moby's quack. Boats and whales ride the same summed-sine wave function as the water mesh.\n- Audio: all written in code.\n  - Six procedural sea-shanty moods from a Web Audio scheduler.\n  - About 30 synthesized sound effects plus a wind bed.\n  - Animalese-style gibberish voices per speaker, synced to typewriter subtitles.\n- Online: AI Hub session protocol v1, side-by-side (parallel) mode for 1–4 players. It sends hello at once, deals the level from `AIHub.rng`, reports progress and result, and registers the probe. There is no custom networking.\n- Testing: headless Chromium with Playwright (SwiftShader, both WebGL 2 and WebGPU).\n  - AI Hub harness conformance at 1, 2 and 4 players.\n  - Full-voyage runs by the attract bot, plus keyboard and emulated-DualSense checks.\n  - Touch emulation, an audio smoke test, and the defeat, retry and victory paths.\n- Research: read the AI Hub `lib/hub` README, session client and harness, and the Rapier 0.19.3 typings. No web research on the book; quotations are public-domain text from memory.\n- Environment: Claude Code CLI (headless); Linux; browser unknown\n- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium\n- Usage: unknown (no estimate available). Session time about 45 minutes.\n\n## Testing Feedback\n- **Issues caught:** 11, from the checks listed in the file's About screen. One more (a spyglass key that never fired) came from reading the code.\n- **Critical or game-breaking:** 5. The canvas was never rendered, menu Back recursed until the stack overflowed, the hub hello was sent too late (the hub would reject the game), attract mode never exited on input, and the spyglass key was dead.\n- **Most helpful:** the AI Hub harness, which exposed the hello-timing bug a normal run never shows. The bot playing whole acts through a step hook was close behind.\n- **Least helpful:** static screenshots under software GL, which are slow and not representative of real lighting.\n\n## Engine Feedback\n- **Liked most:** WebGPURenderer falls back to WebGL 2 with the same scene code. Standard materials, shadows, fog and AnimationMixer worked straight away. Rapier gave a rope joint, ray casts and contact events in a few lines.\n- **Stuck or guessed wrong:** Rapier's rope joint has no `setLength`, so I rebuild it when reeling. A camera looking down +Z has its right-hand side on -X, which flipped my first aim maths. WebGPU canvases screenshot blank, so visual checks used the WebGL path. The `three` and `three/webgpu` import-map aliases needed care.\n- **Most important thing I built myself:** the gameplay layer. That covers unified input and menus, the three-perspective camera rig, whale and boss AI with telegraphs, the shared wave function, instanced particles, the procedural audio engine and the DOM UI.\n- **Hardest part:** there is no built-in water, particles or UI. The large webgpu module graph also loads slowly, so anything the hub needs early (the hello) has to live outside the module.\n- **Remove or overhaul:** the split between the `three` and `three/webgpu` entry points.\n- **Change one thing:** a built-in cheap instanced particle and water helper.\n\n## Prompt Feedback\n- **Liked most:** the concrete controller-first rules (with the axis-invert escape hatch), the attract-mode spec, the AI Hub link, and treating performance as unlimited.\n- **Confusing:** the \"Pick a famous book\" and SOURCE tokens read as both a choice and a name. The filename brackets were unclear. \"Single html file\" sits oddly beside \"dependencies need not be included\". The 50 KB hub README conflicts with \"do not read files you don't need\".\n- **Hardest:** meeting every requirement in one file without being able to hear the audio or feel the controller, while keeping hub timing and controller-only menus correct.\n- **One test I'd run:** a headed, real-GPU playtest with a physical DualSense and audible output, recording frame pacing and audio levels."}</script>
