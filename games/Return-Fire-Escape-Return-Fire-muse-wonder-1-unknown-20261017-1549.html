<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Return Fire Escape</title>
<style>

<div id="wrap"><canvas id="cv" width="1280" height="720" aria-label="Return Fire Escape game"></canvas></div>
<div id="touchBlock"><div class="card"><h1>🎮 Controller or keyboard required</h1>
<p>Return Fire Escape has no touch controls.<br>Connect a PS5 DualSense controller or a keyboard to play.</p>
<button id="touchSettings" type="button">⚙ SETTINGS</button>
<p style="font-size:13px">Press any key or connect a controller and this screen will go away.</p></div></div>
<script>
'use strict';
/* ============ RETURN FIRE ESCAPE — capture the flag, 3DO-style ============ */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=1280,H=720,WORLD_W=2400,WORLD_H=1800;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rnd=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;
function angLerp(a,b,t){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return a+d*t}
function rectHit(px,py,r,o){return px+r>o.x&&px-r<o.x+o.w&&py+r>o.y&&py-r<o.y+o.h}

/* ---------- settings / persistence ---------- */
const SETKEY='rfe-ju-settings';
let settings={music:true,sfx:true,shake:true,volume:0.7};
try{const s=JSON.parse(localStorage.getItem(SETKEY));if(s)settings={...settings,...s}}catch(e){}
function saveSettings(){try{localStorage.setItem(SETKEY,JSON.stringify(settings))}catch(e){}}

/* ---------- audio (all synthesized, no files) ---------- */
let AC=null,musicTimer=null,musicStep=0;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,type='square',v=0.15,slide=0){if(!settings.sfx||!audio())return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(v*settings.volume,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}
function noiseBurst(d=0.3,v=0.3){if(!settings.sfx||!audio())return;const t=AC.currentTime,n=AC.createBufferSource(),buf=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);n.buffer=buf;const g=AC.createGain();g.gain.value=v*settings.volume;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;n.connect(f).connect(g).connect(AC.destination);n.start(t)}
const sfx={
 shoot(){beep(720,0.08,'square',0.08,-400)},missile(){noiseBurst(0.25,0.12);beep(220,0.25,'sawtooth',0.1,-140)},
 boom(){noiseBurst(0.45,0.35);beep(70,0.4,'sine',0.3,-30)},hit(){beep(180,0.07,'square',0.1,-60)},
 pickup(){beep(660,0.09,'square',0.14);setTimeout(()=>beep(990,0.14,'square',0.14),90)},
 hurt(){beep(120,0.15,'sawtooth',0.16,-40)},empty(){beep(1400,0.05,'square',0.07)},
 win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'square',0.16),i*130))},
 lose(){[392,330,262,196].forEach((f,i)=>setTimeout(()=>beep(f,0.25,'triangle',0.16),i*150))},
 ui(){beep(880,0.05,'square',0.08)},back(){beep(440,0.06,'square',0.08)}
};
// public-domain classical motif (Ride of the Valkyries, Wagner 1851) as chip loop
const MELODY=[[392,.18],[392,.18],[392,.18],[494,.36],[587,.54],[494,.36],[392,.18],[494,.18],[587,.9],[0,.2],
[392,.18],[392,.18],[392,.18],[494,.36],[587,.54],[494,.36],[659,.18],[587,.18],[494,.9],[0,.3]];
function musicTick(){if(!settings.music||!AC)return;const[f,d]=MELODY[musicStep%MELODY.length];musicStep++;
 if(f)beep(f,d*0.92,'triangle',0.07);musicTimer=setTimeout(musicTick,d*1000)}
function startMusic(){if(musicTimer||!settings.music||!audio())return;musicTick()}
function stopMusic(){if(musicTimer)clearTimeout(musicTimer);musicTimer=null}

/* ---------- input ---------- */
const keys={},pad={x:0,y:0,ax:0,ay:0,fire:false,missile:false,any:false};
let lastInputAt=performance.now(),padConnected=false,prevPadBtns=[];
function markInput(){lastInputAt=performance.now();hideTouchIfReady()}
addEventListener('keydown',e=>{keys[e.code]=true;markInput();audio();startMusic();
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();onPress(e.code)});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('mousedown',()=>{markInput();audio();startMusic()});
addEventListener('gamepadconnected',()=>{padConnected=true;markInput()});
function pollPad(){
 const gps=navigator.getGamepads?navigator.getGamepads():[];let g=null;
 for(const c of gps)if(c&&c.connected){g=c;break}
 pad.x=0;pad.y=0;pad.ax=0;pad.ay=0;pad.fire=false;pad.missile=false;
 if(!g){prevPadBtns=[];return}
 const dz=v=>Math.abs(v)>0.18?v:0;
 pad.x=dz(g.axes[0]||0);pad.y=dz(g.axes[1]||0);pad.ax=dz(g.axes[2]||0);pad.ay=dz(g.axes[3]||0);
 pad.fire=!!(g.buttons[7]&&g.buttons[7].pressed)||!!(g.buttons[0]&&g.buttons[0].pressed&&state==='PLAY');
 pad.missile=!!(g.buttons[6]&&g.buttons[6].pressed)||!!(g.buttons[1]&&g.buttons[1].pressed&&state==='PLAY');
 const now=g.buttons.map(b=>!!b.pressed);
 const names=['Cross','Circle','Square','Triangle','L1','R1','L2','R2','Share','Options','L3','R3','Up','Down','Left','Right'];
 now.forEach((p,i)=>{if(p&&!prevPadBtns[i]){markInput();audio();startMusic();onPress('Pad'+(names[i]||i))}});
 // dpad as axes fallback for menus handled via buttons 12-15 above
 if(now.some((p,i)=>p&&!prevPadBtns[i]))pad.any=true;
 prevPadBtns=now;
 if(Math.abs(pad.x)>0||Math.abs(pad.y)>0||Math.abs(pad.ax)>0||Math.abs(pad.ay)>0)markInput();
}
/* ---------- vehicles & world ---------- */
const VEHICLES={
 TANK:{name:'TANK',hp:150,speed:135,r:20,dmg:36,rate:340,ammo:50,missiles:6,fuel:100,color:'#5b7f3c',desc:'Slow • heavy gun • tough'},
 JEEP:{name:'JEEP',hp:75,speed:245,r:16,dmg:15,rate:150,ammo:130,missiles:3,fuel:100,color:'#c98a2d',desc:'Fast • light gun • fragile'},
 HELI:{name:'HELICOPTER',hp:100,speed:265,r:19,dmg:19,rate:170,ammo:160,missiles:8,fuel:100,color:'#3f7f9f',desc:'Flies over ground • versatile'}};
const BASE={x:WORLD_W/2-110,y:WORLD_H-190,w:220,h:130};
const FLAG_HOME={x:WORLD_W/2,y:170};
let buildings=[],turrets=[],trees=[],enemies=[],bullets=[],parts=[],pickups=[];
function buildWorld(){
 buildings=[];turrets=[];trees=[];enemies=[];bullets=[];parts=[];pickups=[];
 const B=(x,y,w,h,hp,c,kind)=>buildings.push({x,y,w,h,hp,maxHp:hp,c,kind:kind||'block',dead:false});
 // enemy compound (top)
 B(FLAG_HOME.x-70,FLAG_HOME.y-60,140,110,260,'#8a4a3a','bunker');
 B(300,120,150,100,120,'#9c6b4f');B(1850,120,150,100,120,'#9c6b4f');
 B(520,300,120,90,100,'#7a7f52');B(1720,300,120,90,100,'#7a7f52');
 B(950,430,110,90,110,'#9c6b4f');B(1250,430,110,90,110,'#9c6b4f');
 // midfield cover
 B(420,760,170,90,100,'#8a8f5a');B(1810,760,170,90,100,'#8a8f5a');
 B(1050,820,200,80,120,'#9c6b4f');B(700,1080,150,90,100,'#7a7f52');B(1550,1080,150,90,100,'#7a7f52');
 B(500,1330,140,90,90,'#9c6b4f');B(1760,1330,140,90,90,'#9c6b4f');
 B(1080,1420,240,90,110,'#8a4a3a');
 const T=(x,y)=>turrets.push({x,y,hp:70,maxHp:70,cool:rnd(0,800),angle:0,dead:false});
 T(FLAG_HOME.x-170,FLAG_HOME.y+30);T(FLAG_HOME.x+170,FLAG_HOME.y+30);T(880,560);T(1420,560);T(620,950);T(1780,950);T(1150,1180);
 for(let i=0;i<46;i++){const x=rnd(60,WORLD_W-60),y=rnd(60,WORLD_H-60);
  if(Math.hypot(x-BASE.x-110,y-BASE.y)>260&&Math.hypot(x-FLAG_HOME.x,y-FLAG_HOME.y)>240)trees.push({x,y,r:rnd(14,24)})}
 pickups=[{x:360,y:980,kind:'fuel',taken:false},{x:2040,y:980,kind:'ammo',taken:false},{x:1150,y:640,kind:'repair',taken:false}];
 const E=(x,y,type)=>enemies.push({x,y,type,hp:type==='TANK'?120:65,angle:rnd(0,TAU),cool:rnd(0,600),wp:0,dead:false,hasFlag:false});
 E(700,360,'JEEP');E(1700,360,'JEEP');E(1150,700,'TANK');E(600,1250,'JEEP');
}
function burst(x,y,c,n=14,sp=260){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(40,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.3,0.8),t:0,c,r:rnd(2,6)})}}

/* ---------- game state ---------- */
let state='TITLE'; // TITLE BRIEF PLAY PAUSE WIN LOSE ABOUT HOW SETTINGS ATTRACT
let prevState='TITLE',menuIdx=0,vehicleIdx=0,settingIdx=0,shake=0,timeMs=0;
let player=null,fleet=6,flag=null,missionT=0,kills=0,shotsFired=0;
let cam={x:WORLD_W/2,y:WORLD_H-300};
const MENUS={
 TITLE:['DEPLOY — VEHICLE SELECT','HOW TO PLAY','ABOUT / CREDITS','SETTINGS'],
 PAUSE:['RESUME','RESTART MISSION','SETTINGS','QUIT TO TITLE'],
 WIN:['PLAY AGAIN','TITLE SCREEN'],LOSE:['TRY AGAIN','TITLE SCREEN'],
 SETTINGS:['MUSIC: ','SFX: ','SCREEN SHAKE: ','VOLUME: ','BACK TO TITLE']};
function newPlayer(type){
 const v=VEHICLES[type];
 player={x:BASE.x+BASE.w/2,y:BASE.y+40,type,hp:v.hp,maxHp:v.hp,ammo:v.ammo,maxAmmo:v.ammo,
  missiles:v.missiles,fuel:100,angle:-Math.PI/2,turret:-Math.PI/2,cool:0,mcool:0,hasFlag:false,dead:false,speedV:0};
 flag={x:FLAG_HOME.x,y:FLAG_HOME.y,state:'bunker',carrier:null}; // bunker | free | carried | done
}
function startMission(type){buildWorld();fleet=6;kills=0;shotsFired=0;missionT=0;newPlayer(type);state='PLAY';sfx.pickup()}
function loseVehicle(reason){
 if(!player||player.dead)return;player.dead=true;burst(player.x,player.y,'#e4572e',30,340);burst(player.x,player.y,'#171512',18,200);sfx.boom();shake=settings.shake?14:0;
 if(player.hasFlag&&flag){flag.state='free';flag.x=player.x;flag.y=player.y;flag.carrier=null;player.hasFlag=false}
 fleet--;
 const savedFlag=flag?{state:flag.state,x:flag.x,y:flag.y}:null;
 setTimeout(()=>{if(state!=='PLAY'&&state!=='ATTRACT')return;
  if(fleet<=0){state=state==='ATTRACT'?'ATTRACT':'LOSE';if(state==='LOSE')sfx.lose()}
  else{const t=player?player.type:'TANK';newPlayer(t);if(flag&&flag.state==='carried')flag.state='free';
   // preserve dropped flag position
   if(savedFlag){flag.state=savedFlag.state;flag.x=savedFlag.x;flag.y=savedFlag.y;flag.carrier=null}
  }},900);
}
/* ---------- menu / screen input ---------- */
function menuList(){return MENUS[state]||[]}
function settingsLabel(i){
 const s=MENUS.SETTINGS[i];
 if(i===0)return s+(settings.music?'ON':'OFF');if(i===1)return s+(settings.sfx?'ON':'OFF');
 if(i===2)return s+(settings.shake?'ON':'OFF');if(i===3)return s+Math.round(settings.volume*100)+'%';return s}
function activateMenu(){
 const list=menuList();if(!list.length)return;const idx=state==='SETTINGS'?settingIdx:menuIdx;sfx.ui();
 if(state==='TITLE'){
  if(idx===0){state='BRIEF';vehicleIdx=0}
  else if(idx===1){prevState='TITLE';state='HOW'}
  else if(idx===2){prevState='TITLE';state='ABOUT'}
  else if(idx===3){prevState='TITLE';settingIdx=0;state='SETTINGS'}}
 else if(state==='PAUSE'){
  if(idx===0)state='PLAY';
  else if(idx===1)startMission(player?player.type:'TANK');
  else if(idx===2){prevState='PAUSE';settingIdx=0;state='SETTINGS'}
  else if(idx===3){state='TITLE';menuIdx=0;stopMusic()}}
 else if(state==='WIN'||state==='LOSE'){
  if(idx===0)startMission(player?player.type:'TANK');else{state='TITLE';menuIdx=0}}
 else if(state==='SETTINGS'){
  if(settingIdx===0){settings.music=!settings.music;if(settings.music)startMusic();else stopMusic()}
  else if(settingIdx===1)settings.sfx=!settings.sfx;
  else if(settingIdx===2)settings.shake=!settings.shake;
  else if(settingIdx===3){settings.volume=settings.volume>=1?0.2:Math.round((settings.volume+0.2)*10)/10}
  else if(settingIdx===4){saveSettings();state=prevState==='PAUSE'?'PAUSE':'TITLE';menuIdx=0}
  saveSettings()}
}
function onPress(code){
 // any input exits attract
 if(state==='ATTRACT'){state='TITLE';menuIdx=0;lastInputAt=performance.now();return}
 const up=code==='ArrowUp'||code==='KeyW'&&state!=='PLAY'||code==='PadUp';
 const dn=code==='ArrowDown'||code==='KeyS'&&state!=='PLAY'||code==='PadDown';
 const lf=code==='ArrowLeft'||code==='KeyA'&&state!=='PLAY'||code==='PadLeft';
 const rt=code==='ArrowRight'||code==='KeyD'&&state!=='PLAY'||code==='PadRight';
 const ok=code==='Enter'||code==='Space'&&state!=='PLAY'||code==='PadCross'||code==='NumpadEnter';
 const back=code==='Escape'||code==='PadCircle';
 if(state==='PLAY'){
  if(code==='KeyP'||code==='Escape'||code==='PadOptions'){state='PAUSE';menuIdx=0;sfx.back()}
  if(code==='KeyM'){settings.music=!settings.music;saveSettings();if(!settings.music)stopMusic();else startMusic()}
  if(code==='Digit1')switchVehicle('TANK');if(code==='Digit2')switchVehicle('JEEP');if(code==='Digit3')switchVehicle('HELI');
  return}
 if(state==='PAUSE'&&(code==='KeyP'||code==='PadOptions')){state='PLAY';return}
 if(back){
  if(state==='HOW'||state==='ABOUT'){state=prevState==='PAUSE'?'PAUSE':'TITLE';sfx.back()}
  else if(state==='SETTINGS'){saveSettings();state=prevState==='PAUSE'?'PAUSE':'TITLE';sfx.back()}
  else if(state==='BRIEF'){state='TITLE';sfx.back()}
  else if(state==='PAUSE'){state='PLAY';sfx.back()} return}
 if(state==='BRIEF'){
  if(lf){vehicleIdx=(vehicleIdx+2)%3;sfx.ui()} if(rt){vehicleIdx=(vehicleIdx+1)%3;sfx.ui()}
  if(up){vehicleIdx=(vehicleIdx+2)%3;sfx.ui()} if(dn){vehicleIdx=(vehicleIdx+1)%3;sfx.ui()}
  if(ok){startMission(['TANK','JEEP','HELI'][vehicleIdx])} return}
 if(state==='SETTINGS'){
  const n=MENUS.SETTINGS.length;
  if(up){settingIdx=(settingIdx+n-1)%n;sfx.ui()} if(dn){settingIdx=(settingIdx+1)%n;sfx.ui()}
  if((lf||rt)&&settingIdx===3){settings.volume=clamp(Math.round((settings.volume+(rt?0.1:-0.1))*10)/10,0,1);saveSettings()}
  if(ok)activateMenu(); return}
 if(['TITLE','PAUSE','WIN','LOSE'].includes(state)){
  const n=menuList().length;
  if(up){menuIdx=(menuIdx+n-1)%n;sfx.ui()} if(dn){menuIdx=(menuIdx+1)%n;sfx.ui()}
  if(ok)activateMenu()}
}
function switchVehicle(type){
 if(!player||player.dead)return;
 const onBase=rectHit(player.x,player.y,0,{x:BASE.x-10,y:BASE.y-10,w:BASE.w+20,h:BASE.h+20});
 if(!onBase)return;const keepFlag=player.hasFlag;
 const savedF=flag?{state:flag.state,x:flag.x,y:flag.y}:null;
 const fx=player.x,fy=player.y;newPlayer(type);
 if(savedF&&flag){flag.state=savedF.state;flag.x=savedF.x;flag.y=savedF.y}
 // preserve flag after vehicle swap
 if(flag){if(keepFlag){flag.state='carried';flag.carrier=player;player.hasFlag=true}else if(flag.state==='carried'){flag.state='free';flag.x=fx;flag.y=fy}}
 player.x=fx;player.y=fy;sfx.pickup();
}
function atBase(p){return p.x>BASE.x&&p.x<BASE.x+BASE.w&&p.y>BASE.y&&p.y<BASE.y+BASE.h}
/* ---------- combat & simulation ---------- */
function fireBullet(owner,x,y,angle,dmg,fromPlayer,missile=false){
 bullets.push({x,y,vx:Math.cos(angle)*(missile?420:560),vy:Math.sin(angle)*(missile?420:560),dmg,fromPlayer,missile,life:1.4})}
function collideWorld(e,isHeli){
 e.x=clamp(e.x,24,WORLD_W-24);e.y=clamp(e.y,24,WORLD_H-24);
 if(isHeli)return;
 for(const b of buildings)if(!b.dead&&rectHit(e.x,e.y,e.r||16,b)){
  const dx1=Math.abs(e.x-b.x),dx2=Math.abs(e.x-(b.x+b.w)),dy1=Math.abs(e.y-b.y),dy2=Math.abs(e.y-(b.y+b.h));
  const m=Math.min(dx1,dx2,dy1,dy2);
  if(m===dx1)e.x=b.x-(e.r||16);else if(m===dx2)e.x=b.x+b.w+(e.r||16);else if(m===dy1)e.y=b.y-(e.r||16);else e.y=b.y+b.h+(e.r||16)}
 for(const t of trees){const d=Math.hypot(e.x-t.x,e.y-t.y);if(d<(e.r||16)+t.r*0.5){const a=Math.atan2(e.y-t.y,e.x-t.x);e.x=t.x+Math.cos(a)*((e.r||16)+t.r*0.5);e.y=t.y+Math.sin(a)*((e.r||16)+t.r*0.5)}}
}
function damageBuilding(b,dmg){
 if(b.dead)return;b.hp-=dmg;burst(b.x+b.w/2,b.y+b.h/2,'#d9c27a',4,140);
 if(b.hp<=0){b.dead=true;burst(b.x+b.w/2,b.y+b.h/2,'#e4572e',26,300);burst(b.x+b.w/2,b.y+b.h/2,'#171512',16,180);sfx.boom();shake=settings.shake?Math.max(shake,8):shake;
  if(b.kind==='bunker'&&flag&&flag.state==='bunker'){flag.state='free';flag.x=FLAG_HOME.x;flag.y=FLAG_HOME.y+10;sfx.pickup()}}}
function updateBullets(dt){
 for(const bl of bullets){bl.x+=bl.vx*dt;bl.y+=bl.vy*dt;bl.life-=dt;
  if(bl.missile&&Math.random()<0.6)parts.push({x:bl.x,y:bl.y,vx:rnd(-20,20),vy:rnd(-20,20),life:0.3,t:0,c:'#888',r:4})}
 bullets=bullets.filter(bl=>{
  if(bl.life<=0||bl.x<0||bl.y<0||bl.x>WORLD_W||bl.y>WORLD_H)return false;
  // buildings
  for(const b of buildings)if(!b.dead&&bl.x>b.x&&bl.x<b.x+b.w&&bl.y>b.y&&bl.y<b.y+b.h){
   if(bl.fromPlayer||true)damageBuilding(b,bl.dmg);burst(bl.x,bl.y,'#ffd23f',5,160);return false}
  for(const t of turrets)if(!t.dead&&Math.hypot(bl.x-t.x,bl.y-t.y)<20){
   if(bl.fromPlayer){t.hp-=bl.dmg;burst(bl.x,bl.y,'#ffd23f',6,160);if(t.hp<=0){t.dead=true;burst(t.x,t.y,'#e4572e',22,280);sfx.boom();kills++}}return false}
  if(bl.fromPlayer){
   for(const e of enemies)if(!e.dead&&Math.hypot(bl.x-e.x,bl.y-e.y)<20){e.hp-=bl.dmg;burst(bl.x,bl.y,'#ffd23f',6,170);
    if(e.hp<=0){e.dead=true;burst(e.x,e.y,'#e4572e',24,300);sfx.boom();kills++}return false}
  }else if(player&&!player.dead&&Math.hypot(bl.x-player.x,bl.y-player.y)<(player.r)){

function updatePlayer(dt,ai){
 if(!player||player.dead)return;
 let mx=0,my=0,aim=null,wantFire=false,wantMissile=false;
 if(ai){
  // attract AI: objective-driven steering
  let target=null;
  if(flag&&flag.state==='bunker')target={x:FLAG_HOME.x+180,y:FLAG_HOME.y+120};
  else if(flag&&flag.state==='free')target={x:flag.x,y:flag.y};
  else if(player.hasFlag)target={x:BASE.x+BASE.w/2,y:BASE.y+50};
  else target={x:FLAG_HOME.x,y:FLAG_HOME.y};
  // nearest threat to shoot
  let threat=null,bd=420;
  for(const t of turrets)if(!t.dead){const d=dist(player,t);if(d<bd){bd=d;threat=t}}
  for(const e of enemies)if(!e.dead){const d=dist(player,e);if(d<bd){bd=d;threat=e}}
  if(threat)target=threat.hp!==undefined&&dist(player,threat)<260?player:target; // hold-ish: still move to objective below
  const goal=player.hasFlag?{x:BASE.x+BASE.w/2,y:BASE.y+50}:(flag&&flag.state==='free'?{x:flag.x,y:flag.y}:{x:FLAG_HOME.x+150,y:FLAG_HOME.y+140});
  const a=Math.atan2(goal.y-player.y,goal.x-player.x);
  // obstacle wiggle
  const wob=Math.sin(timeMs*0.0012)*0.5;
  mx=Math.cos(a+wob);my=Math.sin(a+wob);aim=threat?Math.atan2(threat.y-player.y,threat.x-player.x):a;
  wantFire=!!threat&&bd<380;wantMissile=!!threat&&bd<300&&Math.random()<0.02;
  if(!threat&&flag&&flag.state==='bunker'){const bd2=Math.hypot(player.x-FLAG_HOME.x,player.y-FLAG_HOME.y);
   if(bd2<380){aim=Math.atan2(FLAG_HOME.y-player.y,FLAG_HOME.x-player.x);wantFire=true;wantMissile=bd2<300&&Math.random()<0.03;if(bd2<170){mx=0;my=0}}}
  if(player.fuel<25&&!player.hasFlag){mx=Math.cos(Math.atan2(BASE.y-player.y,BASE.x+110-player.x));my=Math.sin(Math.atan2(BASE.y-player.y,BASE.x+110-player.x))}
 }else{
  mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+pad.x;
  my=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+pad.y;
  const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m}
  if(Math.hypot(pad.ax,pad.ay)>0.25)aim=Math.atan2(pad.ay,pad.ax);
  else if(m>0.1)aim=Math.atan2(my,mx);
  wantFire=!!(keys.Space||keys.KeyJ||pad.fire);wantMissile=!!(keys.KeyK||keys.ShiftLeft||keys.ShiftRight||pad.missile);
 }
 const v=VEHICLES[player.type];
 if(player.fuel<=0){if(!ai)loseVehicle('fuel');else player.fuel=60;return}
 const moving=Math.hypot(mx,my)>0.08;
 if(moving){player.angle=angLerp(player.angle,Math.atan2(my,mx),0.18);
  player.x+=mx*v.speed*dt;player.y+=my*v.speed*dt;player.fuel=Math.max(0,player.fuel-dt*(player.type==='HELI'?2.2:1.4));
  if(Math.random()<0.25)parts.push({x:player.x-Math.cos(player.angle)*16,y:player.y-Math.sin(player.angle)*16,vx:rnd(-15,15),vy:rnd(-15,15),life:0.35,t:0,c:'#b8a878',r:3})}
 player.turret=aim!==null?angLerp(player.turret,aim,0.3):player.angle;
 if(aim===null)player.turret=player.angle;
 collideWorld(player,player.type==='HELI');
 player.cool-=dt*1000;player.mcool-=dt*1000;
 if(wantFire&&player.cool<=0){
  if(player.ammo>0){player.ammo--;shotsFired++;player.cool=v.rate;fireBullet(player,player.x+Math.cos(player.turret)*24,player.y+Math.sin(player.turret)*24,player.turret,v.dmg,true,false);sfx.shoot()}
  else if(!ai){sfx.empty();player.cool=220}}
 if(wantMissile&&player.mcool<=0){
  if(player.missiles>0){player.missiles--;player.mcool=650;fireBullet(player,player.x+Math.cos(player.turret)*24,player.y+Math.sin(player.turret)*24,player.turret,70,true,true);sfx.missile()}
  else if(!ai){sfx.empty();player.mcool=300}}
 // base services
 if(atBase(player)){player.fuel=Math.min(100,player.fuel+dt*22);player.hp=Math.min(player.maxHp,player.hp+dt*16);player.ammo=Math.min(player.maxAmmo,player.ammo+dt*22)}
 // flag pickup / delivery
 if(flag){
  if(flag.state==='free'&&Math.hypot(player.x-flag.x,player.y-flag.y)<34){flag.state='carried';flag.carrier=player;player.hasFlag=true;sfx.pickup()}
  if(player.hasFlag){flag.x=player.x;flag.y=player.y-22;
   if(atBase(player)){flag.state='done';player.hasFlag=false;if(ai){/* attract loops: reset flag run */}
    else{state='WIN';sfx.win();stopMusic()}}}
 }
 for(const pk of pickups)if(!pk.taken&&Math.hypot(player.x-pk.x,player.y-pk.y)<30){pk.taken=true;sfx.pickup();
  if(pk.kind==='fuel')player.fuel=100;if(pk.kind==='ammo')player.ammo=player.maxAmmo;if(pk.kind==='repair')player.hp=player.maxHp;burst(pk.x,pk.y,'#2fbf71',16,200)}

}
function updateEnemies(dt){
 for(const e of enemies){if(e.dead)continue;
  const d=player&&!player.dead?dist(e,player):9999;
  let tx=e.x,ty=e.y;
  if(player&&!player.dead&&d<430){tx=player.x;ty=player.y}
  else{const wps=[[700,360],[1700,360],[1150,700],[600,1250],[1800,1250]];const w=wps[e.wp%wps.length];tx=w[0];ty=w[1];if(Math.hypot(e.x-tx,e.y-ty)<40)e.wp++}
  const a=Math.atan2(ty-e.y,tx-e.x),sp=e.type==='TANK'?82:128;
  if(d>70||!player||player.dead){e.x+=Math.cos(a)*sp*dt;e.y+=Math.sin(a)*sp*dt;e.angle=angLerp(e.angle,a,0.1)}
  collideWorld(e,false);e.cool-=dt*1000;
  if(player&&!player.dead&&d<330&&e.cool<=0){e.cool=e.type==='TANK'?850:620;fireBullet(e,e.x+Math.cos(a)*22,e.y+Math.sin(a)*22,a,e.type==='TANK'?15:9,false,false);sfx.shoot()}
 }
 for(const t of turrets){if(t.dead||!player||player.dead)continue;const d=dist(t,player);t.cool-=dt*1000;
  t.angle=Math.atan2(player.y-t.y,player.x-t.x);
  if(d<330&&t.cool<=0){t.cool=780;fireBullet(t,t.x+Math.cos(t.angle)*20,t.y+Math.sin(t.angle)*20,t.angle,11,false,false)}}
}
function update(dt){
 timeMs+=dt*1000;pollPad();
 if(shake>0)shake=Math.max(0,shake-dt*30);
 for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.96;p.vy*=0.96}
 parts=parts.filter(p=>p.t<p.life);
 if(state==='TITLE'&&performance.now()-lastInputAt>10000){startAttract();return}
 if(state==='PLAY'||state==='ATTRACT'){
  missionT+=dt;const ai=state==='ATTRACT';
  updatePlayer(dt,ai);updateEnemies(dt);updateBullets(dt);
