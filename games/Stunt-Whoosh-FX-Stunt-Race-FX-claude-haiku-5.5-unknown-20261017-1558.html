/* =====================================================================================

const TITLE = 'Stunt Whoosh FX';
const G = 26;                       // arcade gravity
const ROAD_HALF = 9.5, WALL_X = ROAD_HALF - 1.2;
const LAPS = 3, FIELD = 4, STEP = 1 / 120;
const NAMES = ['YOU', 'BEBOP', 'SCAT', 'TRILL'];
const CAR_COLORS = [0xff3b7f, 0x19d3c1, 0xffc21a, 0x7a5cff];
const SKEY = 'stuntwhooshfx.v1', BKEY = 'stuntwhooshfx.best';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;

  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },

const DIFF = [{ n: 'Easy', s: [0.86, 0.89, 0.92] }, { n: 'Normal', s: [0.92, 0.95, 0.98] }, { n: 'Hard', s: [0.97, 1.0, 1.03] }];

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* =====================================================================================

   ===================================================================================== */
const Input = (() => {
  const keys = new Set(), q = [], just = { add: a => q.push(a) };

   ===================================================================================== */
const Sfx = (() => {

      else if (a === 'accept') { if (page < d.pages.length - 1) { page++; render(); Sfx.nav(); } else back(); }
      else if (a === 'back') back();
      return;
    }
    const its = d.items || [];
    if (a === 'up' || a === 'down') { if (!its.length) return; setFocus((focus + (a === 'down' ? 1 : its.length - 1)) % its.length); Sfx.nav(); }
    else if (a === 'left' || a === 'right') {
      const it = its[focus]; if (!it) return; const dir = a === 'right' ? 1 : -1;
      if (it.type === 'choice') { it.set((it.get() + dir + it.options.length) % it.options.length); refreshItem(focus); Sfx.nav(); }
      else if (it.type === 'slider') { it.set(clamp(Math.round((it.get() + dir * 0.1) * 10) / 10, 0, 1)); refreshItem(focus); Sfx.nav(); }
    }
    else if (a === 'accept') {
      const it = its[focus]; if (!it) return;
      if (it.type === 'choice') { it.set((it.get() + 1) % it.options.length); refreshItem(focus); Sfx.nav(); }
      else if (it.type === 'slider') { it.set(it.get() >= 1 ? 0 : Math.min(1, Math.round((it.get() + 0.1) * 10) / 10)); refreshItem(focus); Sfx.nav(); }
      else if (it.action) it.action();
    }
    else if (a === 'back') back();
  }
  wrap.addEventListener('mousemove', e => { const li = e.target.closest('.item'); if (li) setFocus(+li.dataset.i); });
  wrap.addEventListener('click', e => { const li = e.target.closest('.item'); if (li) { setFocus(+li.dataset.i); lock = 0; const it = cur.items[+li.dataset.i]; if (it.type === 'choice' || it.type === 'slider') act('accept'); else act('accept'); } });
  hints.addEventListener('click', e => { const s = e.target.closest('span[data-a]'); if (s) { lock = 0; act(s.dataset.a); } });
  return { open, reset, clear, back, act, tick(dt) { if (lock > 0) lock -= dt; }, get active() { return !!cur; }, get depth() { return stack.length; }, rerender() { if (cur) render(); }, top: () => cur };
})();

function setVol(k) { return v => { settings[k] = v; saveSettings(); Sfx.applyVolumes(); }; }
function settingsMenu() {
  return {
    title: 'Settings', center: false,
    items: [
      { label: 'Master volume', type: 'slider', get: () => settings.master, set: setVol('master') },
      { label: 'Music', type: 'slider', get: () => settings.music, set: setVol('music') },
      { label: 'Effects', type: 'slider', get: () => settings.sfx, set: setVol('sfx') },
      { label: 'AI difficulty', type: 'choice', options: DIFF.map(d => d.n), get: () => settings.diff, set: v => { settings.diff = v; saveSettings(); } },
      { label: 'Camera', type: 'choice', options: CAMS, get: () => settings.camera, set: v => { settings.camera = v; saveSettings(); } },
      { label: 'Vibration', type: 'choice', options: ['Off', 'On'], get: () => settings.rumble ? 1 : 0, set: v => { settings.rumble = !!v; saveSettings(); if (v) Input.rumble(0.5, 0.5, 200); } },
      { label: 'Calm visuals', type: 'choice', options: ['Off', 'On'], get: () => settings.calm ? 1 : 0, set: v => { settings.calm = !!v; saveSettings(); } },
      { label: 'Fullscreen', type: 'choice', options: ['Off', 'On'], get: () => document.fullscreenElement ? 1 : 0, set: v => { try { if (v && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => { }); else if (!v && document.fullscreenElement) document.exitFullscreen(); } catch (e) { /* not allowed */ } setTimeout(() => Menu.rerender(), 400); } },
      { label: 'Back', action: () => Menu.back() }
    ]
  };
}
const aboutMenu = () => ({
  title: 'About', pages: [
    `<p><b style="color:var(--pink)">Stunt Whoosh FX</b> is an original spiritual successor to <b>Stunt Race FX</b> (SNES, 1994): chunky flat-shaded polygons, a raised toy-box circuit, ramps over gaps, damage that matters, and pure arcade speed — redrawn in ink and cel-shading with a swung jazz soundtrack.</p>
     <p>One course, three laps, three rivals. Finish in the top two to win the cup.</p>`,
    `<dl><dt>Initial date</dt><dd>2026-10-17</dd>
     <dt>Source</dt><dd>Stunt Race FX — Nintendo EAD / Argonaut, Super Nintendo (inspiration only; no assets reused)</dd>
     <dt>Tech / engine</dt><dd>three.js 0.177.0 (pinned CDN) · custom ink post-process · Web Audio synth · HTML/CSS UI</dd></dl>`,
    `<dl><dt>Environment</dt><dd>CLI (Claude Code) · Ubuntu on WSL2 · verified in headless Chromium</dd>
     <dt>Model &amp; effort</dt><dd>Anthropic, Claude Haiku 5.5 (claude-haiku-5-5) · effort level: unknown</dd>
     <dt>Title</dt><dd>Drawn at random from 90 candidates after the 10 closest names to the source were removed</dd></dl>`
  ]
});
const controlsMenu = () => ({
  title: 'Controls', pages: [
    `<div class="cols"><div><h3>Controller</h3><table>
      <tr><td>R2 / L2</td><td>Accelerate / Brake</td></tr><tr><td>Left stick</td><td>Steer</td></tr>
      <tr><td>✕ or □</td><td>Boost</td></tr><tr><td>L1 / R1</td><td>Air roll (stunt!)</td></tr>
      <tr><td>△</td><td>Change camera</td></tr><tr><td>Options</td><td>Pause</td></tr></table></div>
     <div><h3>Keyboard</h3><table>
      <tr><td>W / ↑ · S / ↓</td><td>Accelerate / Brake</td></tr><tr><td>A D / ← →</td><td>Steer</td></tr>
      <tr><td>Space</td><td>Boost</td></tr><tr><td>Q / E</td><td>Air roll (stunt!)</td></tr>
      <tr><td>C</td><td>Change camera</td></tr><tr><td>Esc / P</td><td>Pause</td></tr></table></div></div>`,
    `<dl><dt>Stunts</dt><dd>Hit the ramp fast (at least ~140 km/h) to clear the gap. In the air, roll a full turn with L1/R1 (Q/E) and land wheels-down for a big boost.</dd>
     <dt>Pickups</dt><dd>Stars fill the boost meter. Cyan pads give a speed kick. Green plus pads repair your body.</dd>
     <dt>Danger</dt><dd>Walls and rivals wear down your body meter. At zero you are wrecked.</dd></dl>`
  ]
});
function titleMenu() {
  return {
    logo: true, noBack: true,
    header: () => { const b = store.get(BKEY, null); return b ? 'Best race: <b>' + fmt(b) + '</b>' : 'Top two of four wins the cup'; },
    items: [
      { label: 'Race', action: () => { Sfx.ok(); startRace(false); } },
      { label: 'Settings', action: () => Menu.open(settingsMenu()) },
      { label: 'Controls', action: () => Menu.open(controlsMenu()) },
      { label: 'About', action: () => Menu.open(aboutMenu()) }
    ]
  };
}
function gateMenu() {
  return { center: true, noBack: true, title: 'Controller or keyboard required', header: 'Connect a controller or use a keyboard to play.', okLabel: 'Select',
    items: [{ label: 'Settings', action: () => Menu.open(settingsMenu()) }] };
}
function pauseMenu() {
  return { title: 'Paused', noBack: false, onBack: resumeRace, items: [
    { label: 'Resume', action: resumeRace },
    { label: 'Restart race', action: () => { startRace(false); } },
    { label: 'Settings', action: () => Menu.open(settingsMenu()) },
    { label: 'Quit to title', action: toTitle }
  ] };
}
let prePausePhase = 'racing';
function pauseRace() {
  if (!['racing', 'countdown', 'finished'].includes(phase)) return;
  prePausePhase = phase; phase = 'paused'; Sfx.engine(0, 0, false, false); Sfx.music(true, 'menu');
  setHud(true); Menu.reset(pauseMenu());
}
function resumeRace() { Menu.clear(); phase = prePausePhase; Sfx.music(true, 'race'); }
function toTitle() {
  toMenuScene(); phase = 'menu'; idle = 0; Menu.reset(titleMenu()); Sfx.music(true, 'menu'); Sfx.engine(0, 0, false, false);
}
const ORD = ['1st', '2nd', '3rd', '4th'];
function showResults() {
  const R = race, p = R.player;
  const list = rankCars();
  let place = p.dead ? 4 : (p.finalPlace || p.rank), win = !p.dead && place <= 2;
  const head = p.dead ? 'Wrecked' : place === 1 ? 'Victory!' : place === 2 ? 'Podium!' : place === 3 ? 'Almost' : 'Last place';
  const sub = p.dead ? 'Your body meter hit zero.' : win ? 'You win the cup!' : 'Top two wins the cup. Run it back?';
  let best = store.get(BKEY, null), newBest = false;
  if (!p.dead && p.finished && (!best || p.finishTime < best)) { best = p.finishTime; store.set(BKEY, best); newBest = true; }
  phase = 'results'; Sfx.music(true, 'menu'); Sfx.engine(0, 0, false, false); setHud(false);
  const rows = list.map((c, i) => {
    const t = c === p && p.dead ? 'WRECKED' : c.finished ? fmt(c.finishTime) : 'RACING';
    return '<li class="' + (c === p ? 'me' : '') + '"><span>' + (i + 1) + '</span><span>' + c.name + '</span><span>' + t + '</span></li>';
  }).join('');
  Menu.reset({
    title: head, titleClass: win ? 'win' : '', noBack: true, okLabel: 'Select',
    header: sub + (newBest ? ' <b>New best time!</b>' : ''),
    note: '<ul class="rank">' + rows + '</ul><div class="stats"><div>Stunts<b>' + score.stunts + '</b></div><div>Best lap<b>' + (isFinite(p.bestLap) ? fmt(p.bestLap) : '--') + '</b></div><div>Body<b>' + Math.round(p.hp) + '%</b></div></div>',
    items: [
      { label: 'Race again', action: () => startRace(false) },
      { label: 'Title screen', action: toTitle }
    ]
  });
}

/* =====================================================================================
   CAMERA & VISUAL SYNC
   ===================================================================================== */
function updateCamera(dt) {
  const t = performance.now() / 1000;
  const calm = settings.calm;
  if (!race || phase === 'menu' || phase === 'results' || phase === 'gate') {
    // slow showpiece orbit around the grid
    cam.orbit += dt * 0.16;
    const c = cars[0], i = c.idx, cx = c.x + Math.sin(c.yaw) * 6, cz = c.z + Math.cos(c.yaw) * 6;
    const r = 24 + Math.sin(cam.orbit * 0.7) * 5;
    camera.position.set(cx + Math.sin(cam.orbit) * r, HH[i] + 6 + Math.sin(cam.orbit * 1.3) * 2.2, cz + Math.cos(cam.orbit) * r);
    camera.lookAt(cx, HH[i] + 1.8, cz);
    camera.fov = lerp(camera.fov, 52, 0.1); camera.updateProjectionMatrix(); comp.uniforms.uBoost.value = 0;
    return;
  }
  let target = race.player;
  if (phase === 'wrecked' || target.dead) target = { x: target.x, y: target.y, z: target.z, yaw: cam.yaw, vx: 0, vz: 0, grounded: true };
  const spd = Math.hypot(target.vx, target.vz);
  const mode = race.demo ? (Math.floor(race.t / 14) % 2 ? 1 : 0) : settings.camera;
  const velYaw = spd > 6 ? Math.atan2(target.vx, target.vz) : target.yaw;
  const desired = angLerp(target.yaw, velYaw, 0.4);
  cam.yaw = angLerp(cam.yaw, desired, 1 - Math.exp(-dt * (mode === 2 ? 14 : 5)));
  cam.ty += (target.y - cam.ty) * (1 - Math.exp(-dt * (target.grounded ? 9 : 3)));
  const dist = [9.5, 15, 0][mode], hgt = [3.7, 6.2, 1.25][mode];
  let px, py, pz, lx, ly, lz;
  if (mode === 2) {
    const yw = cam.yaw; px = target.x + Math.sin(yw) * 0.4; pz = target.z + Math.cos(yw) * 0.4; py = cam.ty + hgt;
    lx = target.x + Math.sin(yw) * 24; lz = target.z + Math.cos(yw) * 24; ly = cam.ty + 1.6;
  } else {
    px = target.x - Math.sin(cam.yaw) * dist; pz = target.z - Math.cos(cam.yaw) * dist; py = cam.ty + hgt;
    lx = target.x + Math.sin(cam.yaw) * 7; lz = target.z + Math.cos(cam.yaw) * 7; ly = cam.ty + 1.5;
  }
  if (phase === 'countdown') {
    cam.introT += dt;
    const k = clamp(cam.introT / 3.2, 0, 1), e = k * k * (3 - 2 * k), a = (1 - e) * 2.3 + target.yaw + Math.PI;
    const ox = target.x + Math.sin(a) * (1 - e) * 26 + (px - target.x) * e, oz = target.z + Math.cos(a) * (1 - e) * 26 + (pz - target.z) * e;
    px = lerp(ox, px, 0); pz = oz; py = lerp(target.y + 11, py, e);
  }
  if (cam.shake > 0 && !calm) { px += (Math.random() - 0.5) * cam.shake * 0.7; py += (Math.random() - 0.5) * cam.shake * 0.7; }
  cam.shake = Math.max(0, cam.shake - dt * 2.2);
  camera.position.set(px, py, pz); camera.lookAt(lx, ly, lz);
  const boosting = !!(race.player.padBoost > 0 || (Input.state.boost && race.player.boost > 0 && race.player.human && !race.demo));
  const fov = 66 + clamp(spd, 0, 60) * 0.22 + (boosting && !calm ? 9 : 0);
  camera.fov = lerp(camera.fov, fov, 1 - Math.exp(-dt * 4)); camera.updateProjectionMatrix();
  comp.uniforms.uBoost.value = lerp(comp.uniforms.uBoost.value, boosting && !calm ? 1 : 0, 1 - Math.exp(-dt * 6));
  void t;
}

function syncCars(dt) {
  for (const c of cars) {
    const v = c.v, r = v.root;
    if (c.dead) continue;
    const slope = c.slope * (Math.sin(c.yaw) * TX[c.idx] + Math.cos(c.yaw) * TZ[c.idx]);
    const wantPitch = c.grounded ? -Math.atan(slope) : -Math.atan2(c.vy, Math.max(8, Math.hypot(c.vx, c.vz))) * 0.7;
    c.pitch = lerp(c.pitch, wantPitch, 1 - Math.exp(-dt * 10));
    c.rollVis *= Math.exp(-dt * 9);
    r.position.set(c.x, c.y, c.z);
    r.rotation.set(c.pitch, c.yaw, c.grounded ? c.rollVis + (-c.steerVis * Math.min(1, Math.hypot(c.vx, c.vz) / 50)) * 0.06 : c.roll);
    c.wheelSpin += c.vf * dt / 0.48;
    for (const w of v.wheels) { w.g.children[0].rotation.x = c.wheelSpin; w.g.children[1].rotation.x = c.wheelSpin; if (w.front) w.g.rotation.y = -c.steerVis * 0.45; }
    const boosting = c.padBoost > 0 || (c === race?.player && Input.state.boost && c.boost > 0 && c.human && !race.demo);
    for (const f of v.flames) { f.visible = !!boosting; if (boosting) f.scale.set(1, 1, 0.8 + Math.random() * 0.7); }
    if (boosting && Math.random() < 0.6) emit(c.x - Math.sin(c.yaw) * 3, c.y + 0.7, c.z - Math.cos(c.yaw) * 3, (Math.random() - 0.5) * 2, 0.5, (Math.random() - 0.5) * 2, 0xffa23a, 0.3, 0.6, -0.5, 0);
    r.visible = c.invul > 0 ? (Math.floor(performance.now() / 70) % 2 === 0) : true;
    v.shadow.position.set(c.x, (c.surf ? c.h : c.y - 3) + 0.06, c.z); v.shadow.rotation.y = c.yaw;
    v.shadow.scale.setScalar(c.grounded ? 1 : clamp(1 - (c.y - c.h) * 0.08, 0.4, 1));
    v.shadow.visible = c.surf && !c.dead;
  }
  for (const s of stars) if (s.on) { s.m.rotation.y += dt * 2.5; s.m.position.y = s.y + Math.sin(performance.now() / 300 + s.x) * 0.15; }
  for (const p of pads) p.tex.offset.y -= dt * 0.9;
}

/* =====================================================================================
   MAIN LOOP
   ===================================================================================== */
let idle = 0, lastT = performance.now();
const TOUCH_ONLY = matchMedia('(hover: none) and (pointer: coarse)').matches;

function handleInput(dt, realDt) {
  Menu.tick(realDt);
  const any = Input.consumeAny();
  if (any) { Sfx.unlock(); }
  if (phase === 'gate') {
    if (any && (Input.kbSeen || Input.hasPad())) { Menu.clear(); toTitle(); Input.flush(); return; }
  }
  if (phase === 'demo') {
    if (any) { Input.flush(); toTitle(); return; }
    return;
  }
  if (any) idle = 0;
  for (const a of Input.drain()) {
    if (Menu.active) {
      if (a === 'pause') { if (phase === 'paused' && Menu.depth === 1) resumeRace(); }
      else if (a !== 'cam') Menu.act(a);
    } else if (a === 'pause' || a === 'back') pauseRace();
    else if (a === 'cam') { settings.camera = (settings.camera + 1) % 3; saveSettings(); toast('Camera: ' + CAMS[settings.camera]); }
  }
  // attract mode: idle on the title / menu screens
  if (phase === 'menu') {
    idle += realDt;
    if (idle >= 10) { idle = 0; Menu.clear(); startRace(true); }
  }
  // gamepad loss pauses a race
  if (['racing', 'countdown'].includes(phase) && lostPad) { lostPad = false; pauseRace(); }
}
let lostPad = false;
addEventListener('gamepaddisconnected', () => { lostPad = true; });
addEventListener('gamepadconnected', () => { if (phase === 'gate') { Menu.clear(); toTitle(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseRace(); });

function frame(now) {
  requestAnimationFrame(frame);
  const realDt = Math.max(0.001, (now - lastT) / 1000), dt = Math.min(0.05, realDt); lastT = now;
  Input.poll(dt);
  handleInput(dt, realDt);
  if (race && ['countdown', 'racing', 'finished', 'wrecked', 'demo'].includes(phase)) {
    acc += dt; let n = 0;
    while (acc >= STEP && n++ < 10) { stepRace(STEP); acc -= STEP; if (!race) break; }
    if (n >= 10) acc = 0;
    if (race) {
      const p = race.player;
      Sfx.engine(Math.hypot(p.vx, p.vz), p.thr || 0, p.padBoost > 0 || (Input.state.boost && p.boost > 0 && p.human && !race.demo), !p.dead);
    }
  }
  updateParts(dt);
  syncCars(dt);
  updateCamera(dt);
  if (race && ['countdown', 'racing', 'finished', 'wrecked', 'demo', 'paused'].includes(phase)) updateHud();
  sky.position.copy(camera.position);
  render(now / 1000);
}

/* ---- boot ---- */
resize();
Sfx.music(true, 'menu');
toMenuScene();
if (TOUCH_ONLY && !Input.hasPad()) { phase = 'gate'; Menu.reset(gateMenu()); }
else { phase = 'menu'; Menu.reset(titleMenu()); }
$('loading').classList.add('off');
requestAnimationFrame(frame);
</script>
