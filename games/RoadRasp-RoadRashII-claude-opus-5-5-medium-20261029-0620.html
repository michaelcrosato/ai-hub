<!--
  ROAD RASP — a spiritual successor to Road Rash II
  ===================================================
  SOURCE INFORMATION
  - Date: 2026-10-29 06:20
  - Source: Road Rash II (Electronic Arts, 1992, Sega Genesis / Mega Drive)
  - Tech: Three.js r180 (WebGPURenderer, TSL node materials, WebGPU only, no fallback) · Rapier 3D 0.19.3 (@dimforge/rapier3d-compat, WASM) · Gamepad API · Web Audio API · PeerJS 1.5.4 (transport for the standalone online mode) · lib/hub round.js + bridge.js bundled unmodified · AI Hub Session Protocol v1, client 1.3.0 · bundled with Bun 1.3.14
  - Art Direction: Stylized cel shading: 3-band toon ramp (MeshToonNodeMaterial with a nearest-filtered gradient map), inverted-hull ink outlines built in TSL, flat saturated per-biome palettes, distance fog, real-time directional shadows
  - Animation: Procedural, code-driven: hierarchical rider rigs with lean, punch, kick and weapon-swing poses blended per frame; running cycle for remounting; Rapier rigid-body tumbling for crashed riders, bikes and roadside debris; camera shake and speed FOV
  - Audio: All code-written with Web Audio: layered oscillator engines tied to RPM, noise-burst punches, crashes, sirens and skids, a step-sequenced garage-rock soundtrack (5 songs, one per region, plus title and results cues), and gibberish "Animalese" voices for rider taunts
  - Online: AI Hub Session Protocol v1 (lib/hub), race mode, both inside the hub and on its own. In a hub session: 1–4 seats, shared course from the hub seed, computer rivals run by the lowest seat (or by the hub’s server copy when there is one), deterministic traffic on the shared clock, the victim decides hits. On its own (Online Race): friends join a 4-letter PeerJS room; each round is a real lib/hub round — the host page runs lib/hub round.js as coordinator, every page runs lib/hub bridge.js in front of the game loaded in a session frame, and PeerJS only carries the hub envelopes
  - Testing: Lightweight: Bun bundling (syntax/import check); Playwright-driven headed Chrome under Xvfb with SwiftShader WebGPU (career, quick race, mechanics, menus, attract, two browsers playing a full lib/hub round over PeerJS: welcome, start, traffic, results, ranked standings and end); AI Hub harness at 2, 3 and 4 players on a bad network, host-leave, and the playerless server copy (all checks passed on the final build; one earlier 4-player run stalled under software rendering); emulated standard gamepad in a standalone race (stick, R2, Square, Options/Circle menu); measured output level: 0.164 RMS racing, 0.069 RMS gibberish voice alone, 0.000 muted
  - Environment: Claude Code CLI (headless); Linux; browser unknown
  - Model: Anthropic, claude-opus-5-5, reasoning effort medium
  - Usage: unknown

  TESTING FEEDBACK
  - Issues caught by testing: 6 in the game (backwards-wound road and terrain triangles made the ground invisible; attract mode never advanced its race; the race froze under the settings overlay, failing the AI Hub "world keeps moving" and "keeps sending" checks; computer rivals too slow; the last HUD flash lingered; the subtitle bubble covered the results table), plus 2 test-rig problems (a port clash with another agent, blank headless WebGPU captures).
  - Critical / game-breaking: 3 (invisible road and ground, dead attract mode, hub session menu freezing the shared race).
  - Most helpful test: headed Chrome under xvfb-run with software (SwiftShader) WebGPU, driven by Playwright, with screenshots and game-state reads; the AI Hub harness (2 players; 4 players at 150 ms / 50 ms jitter / 5% loss; host leaving) then passed every check. A gamepad-only standalone run checked controller input, and an output-level meter measured real sound: 0.164 RMS racing, 0.069 RMS voice alone, 0.000 muted.
  - Least helpful test: headless Chromium. WebGPU reported an adapter but the device was lost and every capture came back blank.

  ENGINE FEEDBACK
  - Liked most: TSL node materials — the inverted-hull ink outline is one line of node maths, and MeshToonNodeMaterial gives the cel ramp for free.
  - Stuck / guessed wrong: WebGPURenderer quietly falls back to WebGL 2 unless you check backend.isWebGPUBackend; headless WebGPU loses its device so nothing could be captured until I switched to a headed browser under Xvfb; Rapier 0.19.3 logs a deprecation warning from its own bundled init.
  - Most important thing built myself: the track-space riding model (distance + lateral offset with curve force, crest launches and landings) — physics engines do not give you arcade bikes.
  - Hardest part: keeping the cel look readable at speed — outlines on hundreds of parts, fog and shadows that follow a 3 km road.
  - Would overhaul: the split between three/webgpu and three/tsl entry points plus import-map plumbing; one module would be simpler.
  - Would change: first-class outline / toon post-process in the WebGPU renderer instead of hand-built hulls.

  PROMPT FEEDBACK
  - Liked most: a clear, concrete source game plus an explicit multiplayer contract (the hub README) to build against.
  - Confusing: "multiplayer … for the game on its own". Resolved by running real lib/hub rounds (round.js coordinator + bridge.js) between friends’ browsers, with PeerJS only as the wire.
  - Hardest: fitting career, combat, cops, physics crashes, attract mode, hub race netcode and own online play into one polished single file.
  - Test I wish I could run: the AI Hub harness with a real GPU and four emulated DualSense pads, plus a long soak race.

<script>/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

class Particles {
  constructor(scene, n = 400) {
    this.n = n;
    const geo = new THREE.IcosahedronGeometry(0.25, 0);
    this.mesh = new THREE.InstancedMesh(geo, toon(16777215, { params: { fog: true } }), n);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    this.mesh.castShadow = false;
    this.col = new THREE.Color;
    for (let i = 0;i < n; i++)
      this.mesh.setColorAt(i, this.col.setHex(16777215));
    this.p = Array.from({ length: n }, () => ({ life: 0, max: 1, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, s: 1, g: 0 }));
    this.i = 0;
    this.m = new THREE.Matrix4;
    this.zero = new THREE.Matrix4().makeScale(0, 0, 0);
    for (let i = 0;i < n; i++)
      this.mesh.setMatrixAt(i, this.zero);
    scene.add(this.mesh);
  }
  emit(x, y, z, count, { color: color2 = 16777215, speed = 4, up = 2, life = 0.6, size = 1, gravity = 9, spread = 1 } = {}) {
    for (let k = 0;k < count; k++) {
      const p = this.p[this.i];
      this.mesh.setColorAt(this.i, this.col.setHex(color2));
      this.i = (this.i + 1) % this.n;
      p.life = p.max = life * (0.6 + Math.random() * 0.8);
      p.x = x + (Math.random() - 0.5) * spread;
      p.y = y;
      p.z = z + (Math.random() - 0.5) * spread;
      p.vx = (Math.random() - 0.5) * speed * 2;
      p.vy = Math.random() * up + up * 0.3;
      p.vz = (Math.random() - 0.5) * speed * 2;
      p.s = size * (0.6 + Math.random() * 0.8);
      p.g = gravity;
    }
    if (this.mesh.instanceColor)
      this.mesh.instanceColor.needsUpdate = true;
  }
  update(dt) {
    for (let i = 0;i < this.n; i++) {
      const p = this.p[i];
      if (p.life <= 0)
        continue;
      p.life -= dt;
      if (p.life <= 0) {
        this.mesh.setMatrixAt(i, this.zero);
        continue;
      }
      p.vy -= p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.z += p.vz * dt;
      const s = p.s * Math.min(1, p.life / p.max * 2);
      this.m.makeScale(s, s, s).setPosition(p.x, p.y, p.z);
      this.mesh.setMatrixAt(i, this.m);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
}

    } else
      this.hint.textContent = "";
  }
}

class Showroom {
  constructor(trackIdx = 0) {
    this.def = TRACKS[trackIdx];
    this.track = new Track(this.def, LEVELS[0]);
    this.track.build(G.scene, null);
    setPalette(this.def);
    this.t = 0;
    this.s = 60;
    this.group = new THREE.Group;
    G.scene.add(this.group);
    this.setBike(BIKES[app.career ? BIKES.findIndex((b) => b.id === app.career.bike) : 4] || BIKES[0]);
  }
  setBike(b) {
    if (this.bikeObj)
      this.group.remove(this.bikeObj);
    const g = new THREE.Group;
    const bike = makeBike(b.color, b.accent);
    const rider = makeRider(16119285, 15221818);
    rider.torso.rotation.x = 0.6;
    rider.neck.rotation.x = -0.5;
    rider.armL.sh.rotation.set(-1.25, 0, 0.18);
    rider.armR.sh.rotation.set(-1.25, 0, -0.18);
    rider.legL.hip.rotation.set(-1.25, 0, 0.15);
    rider.legR.hip.rotation.set(-1.25, 0, -0.15);
    rider.legL.knee.rotation.x = 1.75;
    rider.legR.knee.rotation.x = 1.75;
    g.add(bike.group, rider.root);
    const f = this.track.frame(this.s);
    g.position.copy(this.track.world(this.s, 2, new THREE.Vector3));
    g.rotation.y = Math.PI / 2 - f.th;
    this.group.add(g);
    this.bikeObj = g;
    this.bike = bike;
  }
  update(dt) {
    this.t += dt;
    const p = this.bikeObj.position;
    const a = this.t * 0.18;
    G.camera.position.set(p.x + Math.cos(a) * 6.5, p.y + 2 + Math.sin(this.t * 0.3) * 0.4, p.z + Math.sin(a) * 6.5);
    G.camera.lookAt(p.x, p.y + 0.9, p.z);
    G.camera.fov = 50;
    G.camera.updateProjectionMatrix();
    this.bike.fw.rotation.x += dt * 2;
    this.bike.rw.rotation.x += dt * 2;
    G.sun.position.set(p.x + 50, p.y + 90, p.z + 30);
    G.sun.target.position.copy(p);
    G.sky.position.copy(G.camera.position);
    G.clouds.position.set(G.camera.position.x, 0, G.camera.position.z);
  }
  dispose() {
    G.scene.remove(this.group);
    this.track.dispose(G.scene);
  }
}

      });

      if (E.down)

function Lobby(hosting, joinCode) {

}
function OnlineRound(link) {

    cls: "online-round",
    scene: "play",
    build(root) {
      frame = el("iframe", "hubframe", null, root);

    enter() {

      app.suspended = true;

        coordinator = createRound({
          round,
          mode: "race",
          seed: link.seed,
          limitMs: limitFor(3),
          hostKey: "p0",
          gate: true,
          players: link.players.map((p) => ({ key: "p" + p.id, slot: p.id, name: p.name })),
          deliver: (key, m) => hubEnd.send(key, { k: "h", r: round, m })
        });

          if (env && env.k === "c" && env.r === round)
            coordinator.receive(from, env.m);
        });
        offs.push(link.on("leave", ({ id }) => coordinator.leave("p" + id, "disconnected")));
        coordinator.release();
      }
      const ep = link.endpoint(myKey);
      const post = postTo(frame);
      const bridge = createBridge({
        key: myKey,
        round,
        coordinator: "hub",
        net: ep,
        clock: { now: () => link.hostDate() },
        post: (msg) => {
          post(msg);
          if (msg.type === "end")

        onProgress: (id, p) => coordinator?.progress(id, p.score),
        onFullscreen: (on) => {

            document.exitFullscreen?.();
        }

      ep.onMessage((from, env) => bridge.fromNet(from, env));
      window.__hubRound = { get phase() {
        return coordinator?.phase ?? null;
      }, get record() {
        return coordinator?.record ?? null;
      }, bridge };
      detach = attachFrame(frame, (msg) => bridge.fromGame(msg));
      offs.push(link.on("hostlost", () => {
        if (!ended)

      frame.addEventListener("load", () => {

    onEnd(msg) {

        window.focus();

    },
    update(dt, E) {
      if (ended && this.banner.style.display === "" && (E.confirm || E.back))
        pop();
    },
    exit() {
      for (const off of offs)
        off();
      detach?.();
      frame?.remove();
      link.endpoints.clear();
      app.suspended = false;
    }
  };
}
function TouchBlock() {

    scene: "title",

async function runSession() {
  const info = await H.connect({ mode: "race", seats: [1, 4] });
  if (!info)
    return false;
  app.session = info;
  const net = hubNet(info);
  const trackIndex = Math.floor(H.rng("course")() * TRACKS.length);
  const opts = { mode: "net", trackIndex, level: LEVELS[1], bike: BIKES[4], net, seed: info.seed, cops: true, session: true };
  const scr = SessionRace(opts);
  push(scr);
  H.on("start", () => Audio.unlock());
  if (info.splash)

    scr.waitReady = true;

}
function SessionRace(opts) {
  const base = RaceScreen(opts);

      return;
    reported = true;

  };

    ...base,
    cls: "race",
    get scene() {
      if (ended)
        return "over";
      const r = base.race;

    },
    enter() {
      base.enter();
      const race = base.race;

        const p = race.player;

          report({ score: Math.max(0, Math.floor(p.progress)), stats: this.stats() });

      if (st.copsDowned >= 1)
        a.push({ title: "Cop Dropper", detail: "Knocked a cop off his bike" });

      return a.slice(0, 3);
    },
    showEnd() {
      const root = el("div", "screen overlay end", null, ui);
      const box2 = el("div", "panel", null, root);
      const r = ended.reason;
      el("div", "h1", r === "finished" ? "RACE OVER" : r === "sat-out" ? "YOU SAT THIS ONE OUT" : "RACE CALLED OFF", box2);
      if (ended.standings)
        ended.standings.forEach((ids, place) => ids.forEach((id) => {
          const p = H.players.find((q) => q.id === id) || (app.session.players || []).find((q) => q.id === id);
          const row = el("div", "res-row", null, box2);
          el("span", "rp", String(place + 1), row);

            n.style.color = p.color;

        return;

      if (this.waitReady) {

          this.waitReady = false;

      base.update(dt, E);

        return;

        if (p.finished && !reported) {

        }
      }
    }
  };
  const baseUpdate = base.update.bind(base);
  base.update = (dt, E) => {
    const race = base.race;
    if (!race)
      return;
    const menuOpen = top() !== s;
    if (E.pause && !menuOpen)
      push(Pause(race, opts));
    const ctl = menuOpen || s.waitReady ? { steer: 0, throttle: 0, brake: 0, strike: false, kick: false, nitro: false, look: false, pitch: 0 } : { ...Input.play, strike: Input.edge.strike, kick: Input.edge.kick, nitro: Input.edge.nitro };
    race.update(dt, ctl);
    for (const ev of race.events.splice(0))

}
var NO_EDGES = { strike: false, kick: false, nitro: false, pause: false, up: false, down: false, left: false, right: false, confirm: false, back: false, any: false, tabL: false, tabR: false };
var last = performance.now();
function frame(now) {

H.probe(() => {

for (const ev of ["keydown", "mousedown", "touchstart", "pointerdown"])
