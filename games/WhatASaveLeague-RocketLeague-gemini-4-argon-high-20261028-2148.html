// Shared global uniforms updated every frame
const SharedTSLUniforms = {
  uSunDir: uniform(new THREE.Vector3(0.45, 0.82, 0.35).normalize()),
  uFillDir: uniform(new THREE.Vector3(-0.5, 0.4, -0.6).normalize()),
  uBallPos: uniform(new THREE.Vector3(0, 2.35, 0)),
  uBallColor: uniform(new THREE.Color('#00e5ff')),
  uArenaGlow: uniform(new THREE.Color('#00e5ff')),
  uTurfA: uniform(new THREE.Color('#133c2e')),
  uTurfB: uniform(new THREE.Color('#0f3025'))
};

/**
 * Updates shared TSL uniforms for ball-tracking arena shaders and cel lighting.
 */
function updateSharedShaderUniforms(ballPos, ballTeamColorHex, theme) {
  if (ballPos) {
    SharedTSLUniforms.uBallPos.value.copy(ballPos);
  }
  if (ballTeamColorHex) {
    SharedTSLUniforms.uBallColor.value.set(ballTeamColorHex);
  }
  if (theme) {
    SharedTSLUniforms.uArenaGlow.value.set(theme.gridGlow);
    SharedTSLUniforms.uTurfA.value.set(theme.turfA);
    SharedTSLUniforms.uTurfB.value.set(theme.turfB);
  }
}

/**
 * Creates a stylized Cel-Shaded NodeMaterial using Three.js R180 TSL.
 * Features:
 * - 4-band quantized toon diffuse ramp
 * - Crisp stepped specular highlight band
 * - Fresnel rim lighting in team/accent color
 * - Procedural decal patterns (stripes, flames, cyber hex, lightning)
 * - Automatic comic ink-edge darkening at grazing angles
 */
function createCelMaterial({
  baseColor = '#0088ff',
  rimColor = '#66e0ff',
  decalType = 'none',
  decalColor = '#ffffff',
  steps = 4.0,
  specSize = 0.84,
  specStrength = 0.65,
  rimPower = 2.6,
  rimStrength = 0.75,
  emissiveStrength = 0.0
} = {}) {
  const mat = new THREE.MeshBasicNodeMaterial();

  const uBase = uniform(new THREE.Color(baseColor));
  const uRim = uniform(new THREE.Color(rimColor));
  const uDecalCol = uniform(new THREE.Color(decalColor));
  const uSteps = float(steps);
  const uSpecSize = float(specSize);
  const uSpecStr = float(specStrength);
  const uRimPow = float(rimPower);
  const uRimStr = float(rimStrength);
  const uEmissive = float(emissiveStrength);

  mat.colorNode = Fn(() => {
    const nW = normalize(normalWorld);
    const vDir = normalize(cameraPosition.sub(positionWorld));
    const lDir = SharedTSLUniforms.uSunDir;

    // Procedural Decal Layer in local coordinates
    let surfaceColor = uBase;
    const pLocal = positionLocal;

    if (decalType === 'stripes') {
      // Twin racing stripes along Z axis
      const absX = abs(pLocal.x);
      const stripeMask = smoothstep(float(0.16), float(0.18), absX).mul(
        float(1.0).sub(smoothstep(float(0.42), float(0.44), absX))
      );
      surfaceColor = mix(uBase, uDecalCol, stripeMask.mul(0.9));
    } else if (decalType === 'flames') {
      const wave = sin(pLocal.z.mul(4.5).add(abs(pLocal.x).mul(7.0))).mul(0.28);
      const flameMask = smoothstep(float(0.1), float(0.25), pLocal.z.mul(0.35).add(wave).sub(abs(pLocal.x).mul(0.45)));
      surfaceColor = mix(uBase, uDecalCol, clamp(flameMask, 0.0, 1.0));
    } else if (decalType === 'cyber') {
      const gx = abs(fract(pLocal.x.mul(2.5)).sub(0.5));
      const gz = abs(fract(pLocal.z.mul(2.5)).sub(0.5));
      const grid = step(float(0.42), max(gx, gz));
      surfaceColor = mix(uBase, uDecalCol, grid.mul(0.75));
    } else if (decalType === 'lightning') {
      const jag = abs(pLocal.x.sub(sin(pLocal.z.mul(5.0)).mul(0.25)));
      const bolt = float(1.0).sub(smoothstep(float(0.12), float(0.18), jag));
      surfaceColor = mix(uBase, uDecalCol, bolt);
    }

    // 1. Quantized Toon Diffuse Lighting (Multi-Step Cel Shading)
    const ndotl = dot(nW, lDir).mul(0.5).add(0.5);
    const quantized = floor(ndotl.mul(uSteps)).div(uSteps);
    const smoothEdge = smoothstep(float(0.0), float(0.06), fract(ndotl.mul(uSteps)));
    const celBand = clamp(quantized.add(smoothEdge.div(uSteps).mul(0.35)), float(0.28), float(1.05));

    // Secondary sky/fill bounce so shadows stay rich & stylized
    const fillDot = max(dot(nW, SharedTSLUniforms.uFillDir), float(0.0)).mul(0.18);
    const shadowTint = vec3(0.09, 0.06, 0.18);
    const litBase = mix(shadowTint, surfaceColor, celBand.add(fillDot));

    // 2. Stepped Cel Specular Highlight
    const halfVec = normalize(lDir.add(vDir));
    const ndoth = max(dot(nW, halfVec), float(0.0));
    const specBand = smoothstep(uSpecSize, uSpecSize.add(0.03), ndoth).mul(uSpecStr);

    // 3. Fresnel Team Rim Highlight & Grazing Ink Contour
    const ndotv = max(dot(nW, vDir), float(0.0));
    const fresnel = pow(float(1.0).sub(ndotv), uRimPow);
    const steppedRim = smoothstep(float(0.38), float(0.46), fresnel).mul(uRimStr);

    // Crisp dark ink edge right at the extreme silhouette grazing angle
    const inkSilhouette = smoothstep(float(0.14), float(0.20), ndotv);

    const combined = litBase
      .add(vec3(specBand))
      .add(uRim.mul(steppedRim))
      .add(surfaceColor.mul(uEmissive));

    return mix(vec3(0.03, 0.03, 0.06), combined, inkSilhouette);
  })();

  mat.userData.uBase = uBase;
  mat.userData.uRim = uRim;
  return mat;
}

/**
 * Creates an inverted-hull BackSide outline material for bold comic-book silhouettes.
 */
function createInkOutlineMaterial(thickness = 0.065, hexColor = '#070810') {
  const mat = new THREE.MeshBasicNodeMaterial({
    side: THREE.BackSide
  });
  const uThick = float(thickness);
  const uCol = color(hexColor);

  mat.positionNode = Fn(() => {
    return positionLocal.add(normalLocal.mul(uThick));
  })();

  mat.colorNode = uCol;
  return mat;
}

/**
 * Helper to wrap any Mesh in a cel-shaded mesh + inverted-hull ink outline pair.
 */
function attachInkOutline(mesh, thickness = 0.065, hexColor = '#070810') {
  const outlineMat = createInkOutlineMaterial(thickness, hexColor);
  const outlineMesh = new THREE.Mesh(mesh.geometry, outlineMat);
  outlineMesh.name = `${mesh.name || 'mesh'}_outline`;
  mesh.add(outlineMesh);
  return outlineMesh;
}

/**
 * Creates the Cel-Shaded Geodesic Soccer Ball TSL Material.
 * Pulses with the last-touched team color along its energy seams.
 */
function createBallCelMaterial() {
  const mat = new THREE.MeshBasicNodeMaterial();

  mat.colorNode = Fn(() => {
    const nL = normalize(normalLocal);
    const nW = normalize(normalWorld);
    const vDir = normalize(cameraPosition.sub(positionWorld));
    const lDir = SharedTSLUniforms.uSunDir;

    // Procedural geodesic panel pattern on the sphere
    const gx = abs(sin(nL.x.mul(7.5))).add(abs(cos(nL.y.mul(7.5)))).add(abs(sin(nL.z.mul(7.5))));
    const panelMask = smoothstep(float(1.42), float(1.48), gx);
    const seamMask = smoothstep(float(1.36), float(1.40), gx).sub(panelMask);

    // Base metallic white vs dark carbon panels
    const whitePanel = vec3(0.92, 0.95, 1.0);
    const darkPanel = vec3(0.16, 0.20, 0.28);
    const baseBall = mix(whitePanel, darkPanel, panelMask);

    // Quantized cel lighting
    const ndotl = dot(nW, lDir).mul(0.5).add(0.5);
    const celStep = floor(ndotl.mul(3.5)).div(3.5).clamp(0.32, 1.0);

    // Stepped specular
    const halfV = normalize(lDir.add(vDir));
    const spec = smoothstep(float(0.86), float(0.89), max(dot(nW, halfV), float(0.0))).mul(0.85);

    // Fresnel + Seam glow colored by last team touch
    const ndotv = max(dot(nW, vDir), float(0.0));
    const rim = smoothstep(float(0.52), float(0.60), pow(float(1.0).sub(ndotv), float(2.4)));
    const pulse = sin(time.mul(6.0)).mul(0.25).add(0.85);
    const seamGlow = SharedTSLUniforms.uBallColor.mul(seamMask.mul(2.2).add(rim.mul(0.9)).mul(pulse));

    return baseBall.mul(celStep).add(vec3(spec)).add(seamGlow);
  })();

  return mat;
}

/**
 * Creates the Stadium Pitch Floor TSL Material.
 * Includes mowing stripes, field markings, center circle, penalty boxes,
 * and a live dynamic Ball-Landing Ring projected directly onto the floor!
 */
function createPitchFloorMaterial() {
  const mat = new THREE.MeshBasicNodeMaterial();

  mat.colorNode = Fn(() => {
    const wp = positionWorld;
    const lDir = SharedTSLUniforms.uSunDir;

    // 1. Alternating turf mowing bands along Z
    const band = step(float(0.5), fract(wp.z.mul(0.0625)));
    const turf = mix(SharedTSLUniforms.uTurfA, SharedTSLUniforms.uTurfB, band);

    // Subtle hex micro-pattern on turf
    const hx = abs(fract(wp.x.mul(0.5)).sub(0.5));
    const hz = abs(fract(wp.z.mul(0.5)).sub(0.5));
    const hexLine = smoothstep(float(0.46), float(0.49), max(hx, hz)).mul(0.08);

    // 2. Crisp Stadium Pitch Markings
    // Center line (z = 0)
    const centerLine = float(1.0).sub(smoothstep(float(0.22), float(0.32), abs(wp.z)));
    // Center circle (radius = 12)
    const distCenter = sqrt(wp.x.mul(wp.x).add(wp.z.mul(wp.z)));
    const centerCircle = float(1.0).sub(smoothstep(float(0.25), float(0.38), abs(distCenter.sub(12.0))));

    // Penalty box lines at z = -42 and z = +42 (|x| <= 20)
    const inBoxX = step(abs(wp.x), float(20.2));
    const boxLineZ = float(1.0).sub(smoothstep(float(0.22), float(0.34), abs(abs(wp.z).sub(42.0)))).mul(inBoxX);
    const inBoxZ = step( float(42.0), abs(wp.z) );
    const boxLineX = float(1.0).sub(smoothstep(float(0.22), float(0.34), abs(abs(wp.x).sub(20.0)))).mul(inBoxZ);

    // Team side tinting (Blue half -Z, Orange half +Z)
    const teamZoneTint = mix(
      vec3(0.0, 0.35, 0.85),
      vec3(0.95, 0.38, 0.0),
      smoothstep(float(-8.0), float(8.0), wp.z)
    );

    const lineMask = clamp(centerLine.add(centerCircle).add(boxLineZ).add(boxLineX), float(0.0), float(1.0));
    const lineCol = mix(vec3(0.85, 0.95, 1.0), SharedTSLUniforms.uArenaGlow, float(0.35));

    // 3. Dynamic Ball Ground-Projection Target Ring (Vital for 3D depth perception!)
    const ballXZDist = sqrt(
      wp.x.sub(SharedTSLUniforms.uBallPos.x).mul(wp.x.sub(SharedTSLUniforms.uBallPos.x)).add(
        wp.z.sub(SharedTSLUniforms.uBallPos.z).mul(wp.z.sub(SharedTSLUniforms.uBallPos.z))
      )
    );
    const ballHeightFactor = clamp(SharedTSLUniforms.uBallPos.y.mul(0.18), float(0.4), float(4.5));
    const outerRadius = float(2.5).add(ballHeightFactor);
    const outerRing = float(1.0).sub(smoothstep(float(0.18), float(0.35), abs(ballXZDist.sub(outerRadius))));
    const innerRing = float(1.0).sub(smoothstep(float(0.12), float(0.25), abs(ballXZDist.sub(2.1))));
    const ballShadow = float(1.0).sub(smoothstep(float(0.2), outerRadius, ballXZDist)).mul(0.45);

    // Combine layers
    const baseTurf = turf
      .add(teamZoneTint.mul(0.08))
      .add(SharedTSLUniforms.uArenaGlow.mul(hexLine))
      .mul(float(1.0).sub(ballShadow));

    const withLines = mix(baseTurf, lineCol, lineMask.mul(0.85));
    const ringGlow = SharedTSLUniforms.uBallColor.mul(outerRing.add(innerRing.mul(1.25)));

    return withLines.add(ringGlow);
  })();

  return mat;
}

/**
 * Creates the Curved Arena Wall & Ceiling Energy Shield TSL Material.
 * Lights up with a glowing neon hex ring wherever the ball or cars approach!
 */
function createArenaWallMaterial() {
  const mat = new THREE.MeshBasicNodeMaterial({
    transparent: true,
    opacity: 0.42,
    side: THREE.DoubleSide,
    depthWrite: false
  });

  mat.colorNode = Fn(() => {
    const wp = positionWorld;
    // Grid pattern along wall coordinates
    const gx = abs(fract(wp.x.mul(0.25)).sub(0.5));
    const gy = abs(fract(wp.y.mul(0.25)).sub(0.5));
    const gz = abs(fract(wp.z.mul(0.25)).sub(0.5));
    const grid = smoothstep(float(0.44), float(0.49), max(max(gx, gy), gz));

    // Distance from 3D ball to this wall point
    const dBall = distance(wp, SharedTSLUniforms.uBallPos);
    const proximityGlow = float(1.0).sub(smoothstep(float(2.0), float(16.0), dBall));
    const proximityRing = float(1.0).sub(smoothstep(float(0.3), float(0.9), abs(dBall.sub(5.5))));

    // Team color split along Z
    const wallTeamCol = mix(
      vec3(0.0, 0.55, 1.0),
      vec3(1.0, 0.42, 0.05),
      smoothstep(float(-15.0), float(15.0), wp.z)
    );

    const baseWall = wallTeamCol.mul(grid.mul(0.55).add(0.06));
    const ballHighlight = SharedTSLUniforms.uBallColor.mul(proximityGlow.mul(0.9).add(proximityRing.mul(1.4)));

    return baseWall.add(ballHighlight);
  })();

  return mat;
}

/**
 * Creates the Goal Mouth Laser Shield TSL Material.
 */
function createGoalNetMaterial(teamHex = '#0088ff') {
  const mat = new THREE.MeshBasicNodeMaterial({
    transparent: true,
    opacity: 0.52,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const uTeam = color(teamHex);

  mat.colorNode = Fn(() => {
    const wp = positionWorld;
    const wave = sin(wp.y.mul(3.0).sub(time.mul(5.0))).mul(0.5).add(0.5);
    const gx = abs(fract(wp.x.mul(0.6)).sub(0.5));
    const gy = abs(fract(wp.y.mul(0.6)).sub(0.5));
    const netLine = smoothstep(float(0.40), float(0.48), max(gx, gy));
    return uTeam.mul(netLine.mul(1.3).add(wave.mul(0.35)));
  })();

  return mat;
}


// --- MODULE: audio.js ---
// ============================================================================
// What A Save! League — Web Audio API Music, SFX, Engine & Voice Synthesizer
// ============================================================================
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.initialized = false;

    this.settings = {
      masterVolume: 0.8,
      musicVolume: 0.55,
      sfxVolume: 0.85,
      voiceVolume: 0.9,
      engineVolume: 0.6,
      muted: false
    };

    this.masterGain = null;
    this.musicGain = null;
    this.sfxGain = null;
    this.voiceGain = null;
    this.engineGain = null;

    this.noiseBuffer = null;
    this.musicTimer = null;
    this.musicStep = 0;
    this.musicMode = 'menu'; // 'menu' | 'match' | 'overtime' | 'goal'

    // Continuous car engine & boost nodes for local player(s)
    this.carAudioNodes = [];
  }

  init() {
    if (this.initialized) {
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      return;
    }
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      this.ctx = new AudioCtx();

      this.masterGain = this.ctx.createGain();
      this.musicGain = this.ctx.createGain();
      this.sfxGain = this.ctx.createGain();
      this.voiceGain = this.ctx.createGain();
      this.engineGain = this.ctx.createGain();

      this.musicGain.connect(this.masterGain);
      this.sfxGain.connect(this.masterGain);
      this.voiceGain.connect(this.masterGain);
      this.engineGain.connect(this.masterGain);
      this.masterGain.connect(this.ctx.destination);

      this.applyVolumes();
      this._createNoiseBuffer();
      this._setupCarAudioNode();
      this._startMusicLoop();

      this.initialized = true;
    } catch (_e) {
      // Safe fallback if audio context is blocked
    }
  }

  applyVolumes() {
    if (!this.ctx || !this.masterGain) return;
    const now = this.ctx.currentTime;
    const m = this.settings.muted ? 0 : this.settings.masterVolume;
    this.masterGain.gain.setTargetAtTime(m, now, 0.03);
    this.musicGain.gain.setTargetAtTime(this.settings.musicVolume, now, 0.03);
    this.sfxGain.gain.setTargetAtTime(this.settings.sfxVolume, now, 0.03);
    this.voiceGain.gain.setTargetAtTime(this.settings.voiceVolume, now, 0.03);
    this.engineGain.gain.setTargetAtTime(this.settings.engineVolume, now, 0.03);
  }

  _createNoiseBuffer() {
    const sr = this.ctx.sampleRate;
    const length = sr * 2;
    this.noiseBuffer = this.ctx.createBuffer(1, length, sr);
    const data = this.noiseBuffer.getChannelData(0);
    let lastOut = 0.0;
    for (let i = 0; i < length; i++) {
      const white = Math.random() * 2 - 1;
      // Pinkish-white blend for rich boost/explosion texture
      lastOut = (lastOut + 0.06 * white) / 1.06;
      data[i] = lastOut * 1.8 + white * 0.35;
    }
  }

  _setupCarAudioNode() {
    if (!this.ctx) return;
    // Primary local car engine oscillator + boost jet filter
    const engineOsc = this.ctx.createOscillator();
    const subOsc = this.ctx.createOscillator();
    const engineFilter = this.ctx.createBiquadFilter();
    const engineAmp = this.ctx.createGain();

    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 65;
    subOsc.type = 'triangle';
    subOsc.frequency.value = 32.5;

    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 260;
    engineAmp.gain.value = 0.0;

    engineOsc.connect(engineFilter);
    subOsc.connect(engineFilter);
    engineFilter.connect(engineAmp);
    engineAmp.connect(this.engineGain);

    engineOsc.start();
    subOsc.start();

    // Boost jet noise + turbine oscillator
    const boostNoise = this.ctx.createBufferSource();
    boostNoise.buffer = this.noiseBuffer;
    boostNoise.loop = true;

    const boostFilter = this.ctx.createBiquadFilter();
    boostFilter.type = 'bandpass';
    boostFilter.frequency.value = 900;
    boostFilter.Q.value = 1.4;

    const turbineOsc = this.ctx.createOscillator();
    turbineOsc.type = 'sine';
    turbineOsc.frequency.value = 340;

    const boostAmp = this.ctx.createGain();
    boostAmp.gain.value = 0.0;

    boostNoise.connect(boostFilter);
    turbineOsc.connect(boostFilter);
    boostFilter.connect(boostAmp);
    boostAmp.connect(this.engineGain);

    boostNoise.start();
    turbineOsc.start();

    this.carAudioNodes.push({
      engineOsc,
      subOsc,
      engineFilter,
      engineAmp,
      boostFilter,
      turbineOsc,
      boostAmp
    });
  }

  updateCarAudio(speedRatio = 0, isBoosting = false, isDrifting = false, isActive = true) {
    if (!this.initialized || !this.ctx || this.carAudioNodes.length === 0) return;
    const node = this.carAudioNodes[0];
    const now = this.ctx.currentTime;

    if (!isActive) {
      node.engineAmp.gain.setTargetAtTime(0, now, 0.08);
      node.boostAmp.gain.setTargetAtTime(0, now, 0.06);
      return;
    }

    const clampedSpeed = Math.min(1.3, Math.max(0, speedRatio));
    const baseFreq = 58 + clampedSpeed * 135 + (isDrifting ? 22 : 0);
    node.engineOsc.frequency.setTargetAtTime(baseFreq, now, 0.04);
    node.subOsc.frequency.setTargetAtTime(baseFreq * 0.5, now, 0.04);
    node.engineFilter.frequency.setTargetAtTime(220 + clampedSpeed * 680, now, 0.05);
    node.engineAmp.gain.setTargetAtTime(0.08 + clampedSpeed * 0.08, now, 0.05);

    if (isBoosting) {
      node.boostAmp.gain.setTargetAtTime(0.24, now, 0.03);
      node.boostFilter.frequency.setTargetAtTime(850 + clampedSpeed * 950, now, 0.04);
      node.turbineOsc.frequency.setTargetAtTime(380 + clampedSpeed * 520, now, 0.04);
    } else {
      node.boostAmp.gain.setTargetAtTime(0.0, now, 0.05);
    }
  }

  setMusicMode(mode) {
    this.musicMode = mode;
  }

  _startMusicLoop() {
    if (this.musicTimer) clearInterval(this.musicTimer);
    // 132 BPM 16th-note step sequencer (approx 113ms per 16th step)
    const stepMs = 114;
    const bassScaleMenu = [55, 55, 65.41, 73.42, 82.41, 73.42, 65.41, 49.0];
    const bassScaleMatch = [65.41, 65.41, 77.78, 87.31, 98.0, 87.31, 77.78, 58.27];
    const leadNotes = [261.63, 311.13, 349.23, 392.0, 466.16, 523.25, 392.0, 349.23];

    this.musicTimer = setInterval(() => {
      if (!this.initialized || !this.ctx || this.ctx.state !== 'running' || this.settings.muted) return;
      const s = this.musicStep % 16;
      const bar = Math.floor(this.musicStep / 16) % 4;
      const now = this.ctx.currentTime;

      const isOvertime = this.musicMode === 'overtime';
      const isGoal = this.musicMode === 'goal';

      // 1. Kick Drum on beats 0, 4, 8, 12 (or breakbeat on match/overtime)
      if (s === 0 || s === 4 || s === 8 || s === 12 || (isOvertime && s === 14)) {
        this._playDrumKick(now, isGoal ? 0.28 : 0.2);
      }

      // 2. Snare / Clap on beats 4 and 12
      if (s === 4 || s === 12) {
        this._playDrumSnare(now, isOvertime ? 0.16 : 0.11);
      }

      // 3. Offbeat Hi-Hat on odd steps
      if (s % 2 === 1) {
        this._playHiHat(now, s % 4 === 3 ? 0.06 : 0.03);
      }

      // 4. Driving Synth Bassline
      const scale = this.musicMode === 'menu' ? bassScaleMenu : bassScaleMatch;
      const rootFreq = scale[(bar * 2 + (s >= 8 ? 1 : 0)) % scale.length] * (isOvertime ? 1.122 : 1.0);
      if (s % 2 === 0) {
        this._playBassNote(now, rootFreq, 0.09, 0.12);
      }

      // 5. Arpeggiated Synth Lead
      if (this.musicMode === 'menu' || isGoal || (this.musicMode === 'match' && s % 2 === 0) || isOvertime) {
        const noteFreq = leadNotes[(s + bar * 3) % leadNotes.length] * (isGoal ? 1.5 : 1.0);
        this._playSynthPluck(now, noteFreq, 0.08, isGoal ? 0.09 : 0.05);
      }

      this.musicStep++;
    }, stepMs);
  }

  _playDrumKick(time, vol = 0.2) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(135, time);
    osc.frequency.exponentialRampToValueAtTime(36, time + 0.11);
    gain.gain.setValueAtTime(vol, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.14);
    osc.connect(gain);
    gain.connect(this.musicGain);
    osc.start(time);
    osc.stop(time + 0.15);
  }

  _playDrumSnare(time, vol = 0.11) {
    if (!this.noiseBuffer) return;
    const noise = this.ctx.createBufferSource();
    noise.buffer = this.noiseBuffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 600;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.11);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.musicGain);
    noise.start(time);
    noise.stop(time + 0.12);
  }

  _playHiHat(time, vol = 0.04) {
    if (!this.noiseBuffer) return;
    const noise = this.ctx.createBufferSource();
    noise.buffer = this.noiseBuffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 5500;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.045);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.musicGain);
    noise.start(time);
    noise.stop(time + 0.05);
  }

  _playBassNote(time, freq, dur = 0.1, vol = 0.12) {
    const osc = this.ctx.createOscillator();
    const filter = this.ctx.createBiquadFilter();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, time);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(650, time);
    filter.frequency.exponentialRampToValueAtTime(160, time + dur);
    gain.gain.setValueAtTime(vol, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.musicGain);
    osc.start(time);
    osc.stop(time + dur + 0.01);
  }

  _playSynthPluck(time, freq, dur = 0.09, vol = 0.05) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(vol, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
    osc.connect(gain);
    gain.connect(this.musicGain);
    osc.start(time);
    osc.stop(time + dur + 0.01);
  }

  // --- UI & Gameplay SFX ---

  playUIMove() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.exponentialRampToValueAtTime(780, now + 0.045);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + 0.055);
  }

  playUIConfirm() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [523.25, 659.25, 1046.5].forEach((f, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now + idx * 0.035);
      gain.gain.setValueAtTime(0.16, now + idx * 0.035);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.035 + 0.12);
      osc.connect(gain);
      gain.connect(this.sfxGain);
      osc.start(now + idx * 0.035);
      osc.stop(now + idx * 0.035 + 0.13);
    });
  }

  playUIBack() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(480, now);
    osc.frequency.exponentialRampToValueAtTime(260, now + 0.09);
    gain.gain.setValueAtTime(0.14, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + 0.11);
  }

  playJump(isDoubleJump = false) {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = isDoubleJump ? 'sawtooth' : 'triangle';
    const startF = isDoubleJump ? 240 : 160;
    const endF = isDoubleJump ? 680 : 440;
    osc.frequency.setValueAtTime(startF, now);
    osc.frequency.exponentialRampToValueAtTime(endF, now + 0.14);
    gain.gain.setValueAtTime(0.24, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + 0.17);
  }

  playBallHit(intensity = 0.5) {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const clamped = Math.min(1.0, Math.max(0.15, intensity));

    // Sub-bass rubber/metallic thud
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(140 + clamped * 110, now);
    osc.frequency.exponentialRampToValueAtTime(38, now + 0.18);
    gain.gain.setValueAtTime(0.38 * clamped, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + 0.21);

    // High-impact comic ping on booming shots
    if (clamped > 0.55) {
      const ping = this.ctx.createOscillator();
      const pingGain = this.ctx.createGain();
      ping.type = 'triangle';
      ping.frequency.setValueAtTime(620 + clamped * 280, now);
      ping.frequency.exponentialRampToValueAtTime(210, now + 0.14);
      pingGain.gain.setValueAtTime(0.22 * clamped, now);
      pingGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      ping.connect(pingGain);
      pingGain.connect(this.sfxGain);
      ping.start(now);
      ping.stop(now + 0.16);
    }
  }

  playPostClang() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [540, 815, 1220].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = i === 0 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.2 / (i + 1), now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.connect(gain);
      gain.connect(this.sfxGain);
      osc.start(now);
      osc.stop(now + 0.46);
    });
  }

  playBoostPickup(isFullOrb = false) {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const notes = isFullOrb ? [440, 554.37, 659.25, 880] : [587.33, 880];
    notes.forEach((f, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + idx * 0.04);
      gain.gain.setValueAtTime(isFullOrb ? 0.18 : 0.12, now + idx * 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.16);
      osc.connect(gain);
      gain.connect(this.sfxGain);
      osc.start(now + idx * 0.04);
      osc.stop(now + idx * 0.04 + 0.17);
    });
  }

  playSupersonicBoom() {
    this.init();
    if (!this.ctx || !this.noiseBuffer) return;
    const now = this.ctx.currentTime;
    const noise = this.ctx.createBufferSource();
    noise.buffer = this.noiseBuffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1400, now);
    filter.frequency.exponentialRampToValueAtTime(180, now + 0.28);
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.32, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.sfxGain);
    noise.start(now);
    noise.stop(now + 0.31);
  }

  playDemolition() {
    this.init();
    if (!this.ctx || !this.noiseBuffer) return;
    const now = this.ctx.currentTime;
    const noise = this.ctx.createBufferSource();
    noise.buffer = this.noiseBuffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, now);
    filter.frequency.exponentialRampToValueAtTime(80, now + 0.65);
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.55, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.sfxGain);
    noise.start(now);
    noise.stop(now + 0.72);
  }

  playGoalHorn() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    // Stadium brass horn chord + crowd roar
    [130.81, 196.0, 261.63, 329.63].forEach((freq) => {
      const osc = this.ctx.createOscillator();
      const filter = this.ctx.createBiquadFilter();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, now);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1100, now);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.setValueAtTime(0.16, now + 0.75);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.35);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(this.sfxGain);
      osc.start(now);
      osc.stop(now + 1.4);
    });
    this.playCrowdCheer();
  }

  playCrowdCheer() {
    this.init();
    if (!this.ctx || !this.noiseBuffer) return;
    const now = this.ctx.currentTime;
    const noise = this.ctx.createBufferSource();
    noise.buffer = this.noiseBuffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(750, now);
    filter.Q.value = 0.9;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.25, now + 0.25);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.6);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.sfxGain);
    noise.start(now);
    noise.stop(now + 1.65);
  }

  playPowerupActivate(type = 'haymaker') {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type === 'freezer' ? 'sine' : 'sawtooth';
    osc.frequency.setValueAtTime(type === 'freezer' ? 1200 : 280, now);
    osc.frequency.exponentialRampToValueAtTime(type === 'freezer' ? 320 : 960, now + 0.25);
    gain.gain.setValueAtTime(0.24, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + 0.3);
  }

  /**
   * Stadium Announcer Voice Work:
   * Uses SpeechSynthesis when available AND layers a Web Audio Formant/Fanfare
   * vocal synth so every announcement has unmistakable arcade presence!
   */
  announce(phrase, priority = false) {
    this.init();
    if (this.settings.muted || this.settings.voiceVolume <= 0.01) return;

    // 1. Web Audio Formant / Stadium Chime Signature
    if (this.ctx) {
      const now = this.ctx.currentTime;
      const syllables = Math.min(4, Math.max(1, phrase.split(/\s+/).length));
      for (let i = 0; i < syllables; i++) {
        const osc = this.ctx.createOscillator();
        const f1 = this.ctx.createBiquadFilter();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        const basePitch = phrase.includes('GOAL') || phrase.includes('SAVE') ? 220 + i * 55 : 175 + i * 30;
        osc.frequency.setValueAtTime(basePitch, now + i * 0.09);
        f1.type = 'bandpass';
        f1.frequency.setValueAtTime(720 + i * 180, now + i * 0.09);
        f1.Q.value = 3.5;
        g.gain.setValueAtTime(0.14 * this.settings.voiceVolume, now + i * 0.09);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.085);
        osc.connect(f1);
        f1.connect(g);
        g.connect(this.voiceGain);
        osc.start(now + i * 0.09);
        osc.stop(now + i * 0.09 + 0.09);
      }
    }

    // 2. Browser SpeechSynthesis Stadium Voice
    try {
      if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
        if (priority) {
          window.speechSynthesis.cancel();
        }
        const utter = new SpeechSynthesisUtterance(phrase);
        utter.rate = 1.12;
        utter.pitch = 0.92;
        utter.volume = Math.min(1, this.settings.masterVolume * this.settings.voiceVolume);
        window.speechSynthesis.speak(utter);
      }
    } catch (_e) {
      // Ignore if speechSynthesis is restricted
    }
  }
}


// --- MODULE: input.js ---
// ============================================================================
// What A Save! League — 10-Foot Controller-First Input & Spatial UI Navigation
// ============================================================================
class InputManager {
  constructor(audio) {
    this.audio = audio;

    // Settings including the required Gamepad Horizontal & Vertical Axis Inversion fixes
    this.settings = {
      invertHorizontal: false,
      invertVertical: false,
      invertCameraHorizontal: false,
      invertCameraVertical: false,
      deadzone: 0.14,
      steeringSensitivity: 1.0,
      aerialSensitivity: 1.0,
      vibrationEnabled: true,
      forceTouchOnlyTest: false
    };

    this.keys = new Set();
    this.justPressedKeys = new Set();
    this.mouseButtons = new Set();
    this.justPressedMouse = new Set();

    // Per-player previous button state for edge-triggered actions (jump, ballCam, powerup, pause)
    this.prevPlayerState = [
      this._emptyButtons(),
      this._emptyButtons(),
      this._emptyButtons(),
      this._emptyButtons()
    ];

    this.prevMenuNav = {
      up: false,
      down: false,
      left: false,
      right: false,
      confirm: false,
      back: false,
      tabLeft: false,
      tabRight: false,
      lastRepeatTime: 0
    };

    this.lastInputTime = performance.now();
    this.anyInputJustOccurred = false;
    this.activeGamepadsCount = 0;
    this.isTouchOnlyDevice = this._detectTouchOnly();

    this.onQuickChatCallback = null;
    this.onPauseToggleCallback = null;
    this.onBackCallback = null;

    this._bindEvents();
  }

  _emptyButtons() {
    return {
      jump: false,
      boost: false,
      drift: false,
      ballCam: false,
      powerup: false,
      resetShot: false,
      pause: false
    };
  }

  _detectTouchOnly() {
    if (typeof window === 'undefined') return false;
    const coarseOnly =
      window.matchMedia &&
      window.matchMedia('(pointer: coarse)').matches &&
      !window.matchMedia('(pointer: fine)').matches;
    return Boolean(coarseOnly);
  }

  _markInput() {
    this.lastInputTime = performance.now();
    this.anyInputJustOccurred = true;
  }

  _bindEvents() {
    window.addEventListener('keydown', (e) => {
      if (!this.keys.has(e.code)) {
        this.justPressedKeys.add(e.code);
      }
      this.keys.add(e.code);
      this._markInput();

      // Quick chat hotkeys Digit1..Digit8
      if (e.code.startsWith('Digit') && this.onQuickChatCallback) {
        const digit = parseInt(e.code.replace('Digit', ''), 10);
        if (digit >= 1 && digit <= 8) {
          this.onQuickChatCallback(0, digit - 1);
        }
      }
      if ((e.code === 'Escape' || e.code === 'KeyP') && this.onPauseToggleCallback) {
        this.onPauseToggleCallback();
      }
    });

    window.addEventListener('keyup', (e) => {
      this.keys.delete(e.code);
    });

    window.addEventListener('mousedown', (e) => {
      this.mouseButtons.add(e.button);
      this.justPressedMouse.add(e.button);
      this._markInput();
    });

    window.addEventListener('mouseup', (e) => {
      this.mouseButtons.delete(e.button);
    });

    window.addEventListener('mousemove', () => {
      this._markInput();
    });

    window.addEventListener('gamepadconnected', () => {
      this._markInput();
      this._updateGamepadCount();
    });

    window.addEventListener('gamepaddisconnected', () => {
      this._updateGamepadCount();
    });
  }

  _updateGamepadCount() {
    if (!navigator.getGamepads) {
      this.activeGamepadsCount = 0;
      return;
    }
    const pads = navigator.getGamepads();
    let count = 0;
    for (let i = 0; i < pads.length; i++) {
      if (pads[i] && pads[i].connected) count++;
    }
    this.activeGamepadsCount = count;
  }

  _applyDeadzone(val) {
    const dz = this.settings.deadzone;
    if (Math.abs(val) < dz) return 0;
    return (Math.abs(val) - dz) / (1 - dz) * Math.sign(val);
  }

  /**
   * Triggers DualSense / Standard Gamepad rumble haptics.
   */
  triggerRumble(playerIdx = 0, durationMs = 120, strong = 0.6, weak = 0.4) {
    if (!this.settings.vibrationEnabled || !navigator.getGamepads) return;
    try {
      const pads = navigator.getGamepads();
      const pad = pads[playerIdx];
      if (pad && pad.vibrationActuator && pad.vibrationActuator.playEffect) {
        pad.vibrationActuator.playEffect('dual-rumble', {
          startDelay: 0,
          duration: durationMs,
          weakMagnitude: Math.min(1, Math.max(0, weak)),
          strongMagnitude: Math.min(1, Math.max(0, strong))
        }).catch(() => {});
      }
    } catch (_e) {
      // Ignore if browser/controller doesn't support vibrationActuator
    }
  }

  /**
   * Polls gamepads for activity and updates 10-foot spatial UI focus when a menu is open.
   */
  updateMenuNavigation(isMenuOpen) {
    this._updateGamepadCount();
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];

    // Check if any gamepad stick or button was moved to reset Attract Mode idle timer
    for (let i = 0; i < pads.length; i++) {
      const p = pads[i];
      if (!p || !p.connected) continue;
      for (let b = 0; b < p.buttons.length; b++) {
        if (p.buttons[b]?.pressed) {
          this._markInput();
          break;
        }
      }
      for (let a = 0; a < Math.min(4, p.axes.length); a++) {
        if (Math.abs(p.axes[a]) > 0.25) {
          this._markInput();
          break;
        }
      }
    }

    if (!isMenuOpen) {
      this.justPressedKeys.clear();
      this.justPressedMouse.clear();
      return;
    }

    const pad0 = pads[0];
    const invX = this.settings.invertHorizontal ? -1 : 1;
    const invY = this.settings.invertVertical ? -1 : 1;

    const stickX = pad0 ? this._applyDeadzone(pad0.axes[0] || 0) * invX : 0;
    const stickY = pad0 ? this._applyDeadzone(pad0.axes[1] || 0) * invY : 0;

    const up =
      (pad0 && pad0.buttons[12]?.pressed) ||
      stickY < -0.55 ||
      this.justPressedKeys.has('ArrowUp') ||
      this.justPressedKeys.has('KeyW');
    const down =
      (pad0 && pad0.buttons[13]?.pressed) ||
      stickY > 0.55 ||
      this.justPressedKeys.has('ArrowDown') ||
      this.justPressedKeys.has('KeyS');
    const left =
      (pad0 && pad0.buttons[14]?.pressed) ||
      stickX < -0.55 ||
      this.justPressedKeys.has('ArrowLeft') ||
      this.justPressedKeys.has('KeyA');
    const right =
      (pad0 && pad0.buttons[15]?.pressed) ||
      stickX > 0.55 ||
      this.justPressedKeys.has('ArrowRight') ||
      this.justPressedKeys.has('KeyD');

    const confirm =
      (pad0 && pad0.buttons[0]?.pressed) || // PS5 Cross / Xbox A
      this.justPressedKeys.has('Enter') ||
      this.justPressedKeys.has('Space');

    const back =
      (pad0 && pad0.buttons[1]?.pressed) || // PS5 Circle / Xbox B
      this.justPressedKeys.has('Backspace') ||
      this.justPressedKeys.has('Escape');

    const now = performance.now();
    const canRepeat = now - this.prevMenuNav.lastRepeatTime > 190;

    if ((up && (!this.prevMenuNav.up || canRepeat)) ||
        (down && (!this.prevMenuNav.down || canRepeat)) ||
        (left && (!this.prevMenuNav.left || canRepeat)) ||
        (right && (!this.prevMenuNav.right || canRepeat))) {
      const dir = up ? 'up' : down ? 'down' : left ? 'left' : 'right';
      this._moveSpatialFocus(dir);
      this.prevMenuNav.lastRepeatTime = now;
    }

    if (confirm && !this.prevMenuNav.confirm) {
      this._activateFocusedElement();
    }

    if (back && !this.prevMenuNav.back && this.onBackCallback) {
      this.onBackCallback();
    }

    this.prevMenuNav.up = Boolean(up);
    this.prevMenuNav.down = Boolean(down);
    this.prevMenuNav.left = Boolean(left);
    this.prevMenuNav.right = Boolean(right);
    this.prevMenuNav.confirm = Boolean(confirm);
    this.prevMenuNav.back = Boolean(back);

    this.justPressedKeys.clear();
    this.justPressedMouse.clear();
  }

  _getVisibleNavElements() {
    const all = Array.from(document.querySelectorAll('[data-nav]:not([disabled])'));
    return all.filter((el) => {
      const style = window.getComputedStyle(el);
      if (style.display === 'none' || style.visibility === 'hidden' || style.opacity === '0') return false;
      const rect = el.getBoundingClientRect();
      return rect.width > 0 && rect.height > 0;
    });
  }

  ensureFocus() {
    const visible = this._getVisibleNavElements();
    if (visible.length === 0) return;
    const current = document.querySelector('[data-nav].controller-focus');
    if (!current || !visible.includes(current)) {
      visible.forEach((el) => el.classList.remove('controller-focus'));
      visible[0].classList.add('controller-focus');
    }
  }

  _moveSpatialFocus(direction) {
    const visible = this._getVisibleNavElements();
    if (visible.length === 0) return;

    let current = document.querySelector('[data-nav].controller-focus');
    if (!current || !visible.includes(current)) {
      visible[0].classList.add('controller-focus');
      if (this.audio) this.audio.playUIMove();
      return;
    }

    // If current element is an input range slider and direction is left/right, adjust slider directly!
    if (current.tagName === 'INPUT' && current.type === 'range' && (direction === 'left' || direction === 'right')) {
      const step = parseFloat(current.step) || 0.05;
      const min = parseFloat(current.min) || 0;
      const max = parseFloat(current.max) || 1;
      const val = parseFloat(current.value) || 0;
      const next = Math.min(max, Math.max(min, val + (direction === 'right' ? step : -step)));
      current.value = String(next);
      current.dispatchEvent(new Event('input', { bubbles: true }));
      if (this.audio) this.audio.playUIMove();
      return;
    }

    const curRect = current.getBoundingClientRect();
    const curX = curRect.left + curRect.width * 0.5;
    const curY = curRect.top + curRect.height * 0.5;

    let bestEl = null;
    let bestScore = Infinity;

    for (const candidate of visible) {
      if (candidate === current) continue;
      const r = candidate.getBoundingClientRect();
      const cx = r.left + r.width * 0.5;
      const cy = r.top + r.height * 0.5;
      const dx = cx - curX;
      const dy = cy - curY;

      let valid = false;
      let primaryDist = 0;
      let orthoDist = 0;

      if (direction === 'up' && dy < -8) {
        valid = true;
        primaryDist = -dy;
        orthoDist = Math.abs(dx);
      } else if (direction === 'down' && dy > 8) {
        valid = true;
        primaryDist = dy;
        orthoDist = Math.abs(dx);
      } else if (direction === 'left' && dx < -8) {
        valid = true;
        primaryDist = -dx;
        orthoDist = Math.abs(dy);
      } else if (direction === 'right' && dx > 8) {
        valid = true;
        primaryDist = dx;
        orthoDist = Math.abs(dy);
      }

      if (valid) {
        const score = primaryDist + orthoDist * 2.25;
        if (score < bestScore) {
          bestScore = score;
          bestEl = candidate;
        }
      }
    }

    // Fallback wrap-around if at edge of list
    if (!bestEl) {
      const idx = visible.indexOf(current);
      if (direction === 'down' || direction === 'right') {
        bestEl = visible[(idx + 1) % visible.length];
      } else {
        bestEl = visible[(idx - 1 + visible.length) % visible.length];
      }
    }

    if (bestEl && bestEl !== current) {
      visible.forEach((el) => el.classList.remove('controller-focus'));
      bestEl.classList.add('controller-focus');
      bestEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      if (this.audio) this.audio.playUIMove();
    }
  }

  _activateFocusedElement() {
    this.ensureFocus();
    const current = document.querySelector('[data-nav].controller-focus');
    if (!current) return;
    if (this.audio) this.audio.playUIConfirm();
    current.click();
  }

  /**
   * Returns normalized driving/aerial input state for Player `playerIndex` (0..3).
   */
  getPlayerInput(playerIndex = 0) {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const pad = pads[playerIndex];

    const invX = this.settings.invertHorizontal ? -1 : 1;
    const invY = this.settings.invertVertical ? -1 : 1;
    const invCamX = this.settings.invertCameraHorizontal ? -1 : 1;
    const invCamY = this.settings.invertCameraVertical ? -1 : 1;

    let throttle = 0;
    let steer = 0;
    let pitch = 0;
    let yaw = 0;
    let airRoll = 0;
    let camYaw = 0;
    let camPitch = 0;

    let jumpDown = false;
    let boostDown = false;
    let driftDown = false;
    let ballCamDown = false;
    let powerupDown = false;
    let resetShotDown = false;

    // 1. Gamepad Input (PS5 DualSense / Standard Mapping)
    if (pad && pad.connected) {
      const lx = this._applyDeadzone(pad.axes[0] || 0) * invX * this.settings.steeringSensitivity;
      const ly = this._applyDeadzone(pad.axes[1] || 0) * invY * this.settings.aerialSensitivity;
      const rx = this._applyDeadzone(pad.axes[2] || 0) * invCamX;
      const ry = this._applyDeadzone(pad.axes[3] || 0) * invCamY;

      // R2 (button 7) = Forward Throttle, L2 (button 6) = Reverse Throttle
      const r2 = pad.buttons[7] ? pad.buttons[7].value : 0;
      const l2 = pad.buttons[6] ? pad.buttons[6].value : 0;
      throttle = r2 - l2;

      // Also allow left stick Y to drive if triggers aren't held
      if (Math.abs(throttle) < 0.08 && Math.abs(ly) > 0.25) {
        throttle = -ly;
      }

      steer = -lx; // Positive steer = turn left in right-handed +Z forward coords
      pitch = ly;
      yaw = -lx;
      camYaw = -rx;
      camPitch = -ry;

      // Cross (0) = Jump/Dodge, Circle (1) or R1 (5) = Boost, Square (2) or L1 (4) = Powerslide/AirRoll, Triangle (3) = Ball Cam
      jumpDown = Boolean(pad.buttons[0]?.pressed);
      boostDown = Boolean(pad.buttons[1]?.pressed || pad.buttons[5]?.pressed);
      driftDown = Boolean(pad.buttons[2]?.pressed || pad.buttons[4]?.pressed);
      ballCamDown = Boolean(pad.buttons[3]?.pressed);
      powerupDown = Boolean(pad.buttons[10]?.pressed || pad.buttons[8]?.pressed);
      resetShotDown = Boolean(pad.buttons[8]?.pressed);

      if (driftDown) {
        airRoll = lx;
      }

      // D-pad Quick Chat on Gamepad
      if (this.onQuickChatCallback) {
        if (pad.buttons[12]?.pressed && !this._dpadLatch) {
          this._dpadLatch = true;
          this.onQuickChatCallback(playerIndex, 0); // What a save!
        } else if (pad.buttons[13]?.pressed && !this._dpadLatch) {
          this._dpadLatch = true;
          this.onQuickChatCallback(playerIndex, 1); // Calculated.
        } else if (pad.buttons[14]?.pressed && !this._dpadLatch) {
          this._dpadLatch = true;
          this.onQuickChatCallback(playerIndex, 2); // Nice shot!
        } else if (pad.buttons[15]?.pressed && !this._dpadLatch) {
          this._dpadLatch = true;
          this.onQuickChatCallback(playerIndex, 3); // I got it!
        } else if (
          !pad.buttons[12]?.pressed &&
          !pad.buttons[13]?.pressed &&
          !pad.buttons[14]?.pressed &&
          !pad.buttons[15]?.pressed
        ) {
          this._dpadLatch = false;
        }
      }
    }

    // 2. Player 1 Keyboard & Mouse Secondary Mapping (Controller Interaction Model)
    if (playerIndex === 0) {
      const kForward = this.keys.has('KeyW') ? 1 : 0;
      const kReverse = this.keys.has('KeyS') ? 1 : 0;
      const kLeft = this.keys.has('KeyA') ? 1 : 0;
      const kRight = this.keys.has('KeyD') ? 1 : 0;

      if (kForward || kReverse) throttle = kForward - kReverse;
      if (kLeft || kRight) {
        steer = (kLeft - kRight) * invX * this.settings.steeringSensitivity;
        yaw = (kLeft - kRight) * invX * this.settings.aerialSensitivity;
      }
      if (kForward || kReverse) {
        pitch = (kReverse - kForward) * invY * this.settings.aerialSensitivity;
      }

      if (this.keys.has('KeyQ')) airRoll = -1;
      if (this.keys.has('KeyE')) airRoll = 1;

      if (this.keys.has('Space') || this.mouseButtons.has(2)) jumpDown = true;
      if (this.keys.has('ShiftLeft') || this.keys.has('KeyJ') || this.mouseButtons.has(0)) boostDown = true;
      if (this.keys.has('ControlLeft') || this.keys.has('KeyK')) driftDown = true;
      if (this.keys.has('KeyC') || this.keys.has('Tab') || this.keys.has('KeyL')) ballCamDown = true;
      if (this.keys.has('KeyF') || this.keys.has('KeyR')) powerupDown = true;
      if (this.keys.has('KeyB')) resetShotDown = true;
    }

    // 3. Player 2 Keyboard Split-Screen Mapping (Arrows + Numpad / Right Modifiers)
    if (playerIndex === 1) {
      const kForward = this.keys.has('ArrowUp') ? 1 : 0;
      const kReverse = this.keys.has('ArrowDown') ? 1 : 0;
      const kLeft = this.keys.has('ArrowLeft') ? 1 : 0;
      const kRight = this.keys.has('ArrowRight') ? 1 : 0;

      if (kForward || kReverse) throttle = kForward - kReverse;
      if (kLeft || kRight) {
        steer = (kLeft - kRight) * invX * this.settings.steeringSensitivity;
        yaw = (kLeft - kRight) * invX * this.settings.aerialSensitivity;
      }
      if (kForward || kReverse) {
        pitch = (kReverse - kForward) * invY * this.settings.aerialSensitivity;
      }

      if (this.keys.has('Numpad0') || this.keys.has('Enter')) jumpDown = true;
      if (this.keys.has('ShiftRight') || this.keys.has('Numpad1')) boostDown = true;
      if (this.keys.has('ControlRight') || this.keys.has('Numpad2')) driftDown = true;
      if (this.keys.has('Backslash') || this.keys.has('Numpad3')) ballCamDown = true;
      if (this.keys.has('Slash') || this.keys.has('Numpad5')) powerupDown = true;
    }

    const prev = this.prevPlayerState[playerIndex];
    const out = {
      throttle: Math.max(-1, Math.min(1, throttle)),
      steer: Math.max(-1, Math.min(1, steer)),
      pitch: Math.max(-1, Math.min(1, pitch)),
      yaw: Math.max(-1, Math.min(1, yaw)),
      airRoll: Math.max(-1, Math.min(1, airRoll)),
      camYaw,
      camPitch,
      jump: jumpDown,
      jumpJustPressed: jumpDown && !prev.jump,
      boost: boostDown,
      drift: driftDown,
      ballCamJustPressed: ballCamDown && !prev.ballCam,
      powerupJustPressed: powerupDown && !prev.powerup,
      resetShotJustPressed: resetShotDown && !prev.resetShot
    };

    prev.jump = jumpDown;
    prev.boost = boostDown;
    prev.drift = driftDown;
    prev.ballCam = ballCamDown;
    prev.powerup = powerupDown;
    prev.resetShot = resetShotDown;

    return out;
  }
}
