// ============================================================================
// What A Save! League — Core WebGPU Application, Cameras & Game Loop
// ============================================================================
class WhatASaveLeagueApp {
  constructor() {
    this.audio = new AudioEngine();
    this.input = new InputManager(this.audio);
    this.network = new NetworkManager();
    this.botAI = new BotAIManager();
    this.replay = new ReplayRecorder();

    // Player 1 Garage Customization Profile
    this.playerProfile = {
      bodyId: 'octane_x',
      colorName: 'Cobalt Surge',
      primaryColor: '#0088ff',
      rimColor: '#66e0ff',
      decal: 'stripes',
      decalColor: '#ffffff',
      wheel: 'aero_disc',
      boostId: 'gold',
      boostPrimary: '#ffaa00',
      boostSecondary: '#ff3300',
      topper: 'halo',
      goalExplosion: 'comic_boom'
    };

    // Match & Mutator Configuration
    this.matchConfig = {
      modeId: 'soccar',
      arenaId: 'neo_dome',
      teamSize: 2,          // 1v1, 2v2, 3v3, 4v4
      localPlayers: 1,      // 1..4 Local Split-Screen players
      splitComparison: 'horizontal', // 'horizontal' (Top/Bottom) or 'vertical' (Left/Right)
      gravityLabel: 'Normal',
      gravity: -26.0,
      ballShape: 'sphere',
      ballSizeMult: 1.0,
      unlimitedBoost: false
    };

    // Three.js WebGPU Renderer & Scene
    this.renderer = null;
    this.scene = null;
    this.cameras = []; // Up to 4 cameras for 1–4P split-screen
    this.vfx = null;
    this.physics = null;
    this.arenaRefs = null;
    this.ballMesh = null;
    this.tetherLineGroup = null;

    // Menu Showcase Car
    this.showcaseGroup = null;
    this.showcaseCarPos = new THREE.Vector3(0, 0.55, 0);

    // Match State Machine
    this.inMatch = false;
    this.inAttractMode = false;
    this.isPaused = false;
    this.matchPhase = 'menu'; // 'menu' | 'countdown' | 'playing' | 'goal_celebration' | 'replay' | 'postmatch'
    this.phaseTimer = 0;
    this.lastCountdownInt = 0;

    this.blueScore = 0;
    this.orangeScore = 0;
    this.matchTimeRemaining = 180;
    this.isOvertime = false;
    this.pendingGoalInfo = null;

    this.attractTimer = 0;
    this.attractCamMode = 0;

    this.ui = null;
  }

  async init() {
    // 1. Initialize Rapier 0.19.3 Physics WASM
    await initRapierEngine();

    // 2. Initialize Three.js R180 WebGPURenderer (No WebGL Fallback)
    const container = document.createElement('div');
    container.id = 'game-canvas-container';
    document.body.appendChild(container);

    this.renderer = new THREE.WebGPURenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    await this.renderer.init();
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.autoClear = false;
    container.appendChild(this.renderer.domElement);

    // 3. Create Scene & 4 Split-Screen Perspective Cameras
    this.scene = new THREE.Scene();
    for (let i = 0; i < 4; i++) {
      const cam = new THREE.PerspectiveCamera(
        68,
        window.innerWidth / window.innerHeight,
        0.3,
        420
      );
      cam.position.set(0, 6, -15);
      this.cameras.push(cam);
    }

    // 4. Stadium Lighting
    this.ambientLight = new THREE.AmbientLight('#48689a', 1.4);
    this.scene.add(this.ambientLight);

    this.sunLight = new THREE.DirectionalLight('#fff5e0', 2.4);
    this.sunLight.position.set(45, 82, 35);
    this.scene.add(this.sunLight);

    // 5. VFX & Physics World
    this.vfx = new VFXManager(this.scene);
    this.tetherLineGroup = new THREE.Group();
    this.scene.add(this.tetherLineGroup);

    this.physics = new PhysicsArenaWorld(this.audio, this.vfx, (type, payload) =>
      this._handlePhysicsEvent(type, payload)
    );

    // Build initial Stadium & Menu Showcase
    const theme = ARENA_THEMES.find((t) => t.id === this.matchConfig.arenaId) || ARENA_THEMES[0];
    this.applyArenaTheme(theme);
    this._rebuildStadiumScene();
    this.refreshShowcaseCar();

    // 6. Initialize UI & Input Callbacks
    this.ui = new UIManager(this);

    this.input.onQuickChatCallback = (playerIdx, chatIdx) => {
      this._triggerQuickChat(playerIdx, chatIdx);
    };

    this.input.onPauseToggleCallback = () => {
      if (this.inAttractMode) {
        this.exitAttractMode();
        return;
      }
      if (this.inMatch && this.matchPhase !== 'postmatch') {
        this.togglePause(!this.isPaused);
      }
    };

    this.input.onBackCallback = () => {
      if (this.inAttractMode) {
        this.exitAttractMode();
        return;
      }
      if (this.ui.activeScreen !== 'main_menu' && !this.inMatch) {
        this.audio.playUIBack();
        this.ui.showScreen('main_menu');
      } else if (this.isPaused) {
        this.togglePause(false);
      }
    };

    // Network callbacks
    this.network.onLobbyUpdate = () => {
      if (this.ui.activeScreen === 'online') {
        this.ui.renderCurrentScreen();
      }
    };
    this.network.onMatchStart = (modeId, arenaId) => {
      this.matchConfig.modeId = modeId || this.matchConfig.modeId;
      this.matchConfig.arenaId = arenaId || this.matchConfig.arenaId;
      this.startMatch();
    };
    this.network.onStateSnapshot = (snap) => this._applyNetworkSnapshot(snap);
    this.network.onQuickChatNet = (slot, chatIdx) => this._triggerQuickChat(slot, chatIdx, true);

    window.addEventListener('resize', () => this._onResize());

    // 7. Start 60fps Main Loop
    this.lastFrameTime = performance.now();
    this._animate();
  }

  applyArenaTheme(theme) {
    if (!theme) return;
    this.scene.background = new THREE.Color(theme.skyTop);
    if (this.ambientLight) this.ambientLight.color.set(theme.ambientColor);
    if (this.sunLight) this.sunLight.color.set(theme.sunColor);
    updateSharedShaderUniforms(null, null, theme);
  }

  _rebuildStadiumScene() {
    if (this.arenaRefs?.arenaGroup) {
      this.scene.remove(this.arenaRefs.arenaGroup);
    }
    if (this.ballMesh) {
      this.scene.remove(this.ballMesh);
    }
    for (const c of this.physics.cars) {
      if (c.mesh) this.scene.remove(c.mesh);
    }
    this.physics.cars.length = 0;

    const modeObj = GAME_MODES.find((m) => m.id === this.matchConfig.modeId) || GAME_MODES[0];
    const theme = ARENA_THEMES.find((t) => t.id === this.matchConfig.arenaId) || ARENA_THEMES[0];

    this.arenaRefs = buildStadiumArena(this.scene, theme, modeObj);

    const shape = modeObj.puck ? 'puck' : this.matchConfig.ballShape;
    const radius = ARENA.ballRadius * this.matchConfig.ballSizeMult;
    this.ballMesh = buildBallMesh(shape, radius);
    this.scene.add(this.ballMesh);

    this.physics.buildWorld(
      modeObj,
      {
        gravity: this.matchConfig.gravity,
        ballSizeMult: this.matchConfig.ballSizeMult,
        ballShape: shape,
        unlimitedBoost: this.matchConfig.unlimitedBoost || Boolean(modeObj.unlimitedBoost)
      },
      this.arenaRefs.boostPadVisuals,
      this.arenaRefs.dropshotTiles
    );
  }

  refreshShowcaseCar() {
    if (this.showcaseGroup) {
      this.scene.remove(this.showcaseGroup);
    }
    this.showcaseGroup = buildBattleCarMesh(this.playerProfile.bodyId, this.playerProfile);
    this.showcaseGroup.position.set(-4.5, 0.55, 0);
    this.showcaseGroup.rotation.y = 0.55;

    // Show boost flames gently pulsing on garage turntable
    const ud = this.showcaseGroup.userData;
    if (ud?.boostFlames) {
      ud.boostFlames.forEach((f) => {
        f.visible = true;
      });
    }
    this.scene.add(this.showcaseGroup);

    if (this.ballMesh) {
      this.ballMesh.position.set(4.5, ARENA.ballRadius, 1.5);
    }
  }

  /**
   * Launches a playable match (Singleplayer, Local Split-Screen 1-4P, or Online 1-4P).
   */
  startMatch(isAttract = false) {
    this.audio.init();
    this.inMatch = !isAttract;
    this.inAttractMode = isAttract;
    this.isPaused = false;
    this.replay.clear();

    if (this.showcaseGroup) {
      this.showcaseGroup.visible = false;
    }

    // In Attract Mode, enable Rumble + Soccar hybrid for maximum spectacle
    const savedMode = this.matchConfig.modeId;
    if (isAttract) {
      this.matchConfig.modeId = 'rumble';
    }
    this._rebuildStadiumScene();
    if (isAttract) {
      this.matchConfig.modeId = savedMode;
    }

    const modeObj = GAME_MODES.find((m) => m.id === (isAttract ? 'rumble' : this.matchConfig.modeId)) || GAME_MODES[0];

    this.blueScore = 0;
    this.orangeScore = 0;
    this.matchTimeRemaining = modeObj.matchDuration || 180;
    this.isOvertime = false;

    // Spawn Battle-Cars for the match
    this._spawnMatchCars(modeObj, isAttract);
    this.physics.resetKickoff(0);

    if (isAttract) {
      this.matchPhase = 'playing';
      this.attractTimer = 0;
      this.attractCamMode = 0;
      this.audio.setMusicMode('match');
      this.ui.showScreen('attract');
    } else {
      this.matchPhase = modeObj.id === 'freeplay' ? 'playing' : 'countdown';
      this.phaseTimer = modeObj.id === 'freeplay' ? 0 : 3.4;
      this.lastCountdownInt = 4;
      this.audio.setMusicMode('match');
      this.ui.showScreen('hud');
      if (modeObj.id === 'freeplay') {
        this.ui.showBanner('FREE PLAY LAB', 'Unlimited Boost · Press [B] to Launch Pass', 2600);
      }
    }
  }

  _spawnMatchCars(modeObj, isAttract) {
    const localCount = isAttract ? 0 : this.matchConfig.localPlayers;
    const perTeam = isAttract ? 2 : Math.max(modeObj.id === 'freeplay' ? 1 : this.matchConfig.teamSize, Math.ceil(localCount / 2));
    const totalCars = modeObj.id === 'freeplay' ? localCount : perTeam * 2;

    let botCursor = 0;
    for (let i = 0; i < totalCars; i++) {
      const isBlue = modeObj.id === 'freeplay' ? true : i % 2 === 0;
      const team = isBlue ? 'blue' : 'orange';
      const isLocalHuman = !isAttract && i < localCount;

      let custom;
      let bodyId;
      let playerName;

      if (isLocalHuman && i === 0) {
        bodyId = this.playerProfile.bodyId;
        custom = { ...this.playerProfile };
        playerName = 'Player 1';
      } else {
        bodyId = CAR_BODIES[i % CAR_BODIES.length].id;
        const palette = isBlue ? CUSTOMIZATION_OPTIONS.blueColors : CUSTOMIZATION_OPTIONS.orangeColors;
        const col = palette[i % palette.length];
        const boostOpt = CUSTOMIZATION_OPTIONS.boostColors[i % CUSTOMIZATION_OPTIONS.boostColors.length];
        custom = {
          primaryColor: col.hex,
          rimColor: col.rim,
          decal: CUSTOMIZATION_OPTIONS.decals[i % CUSTOMIZATION_OPTIONS.decals.length].id,
          decalColor: '#ffffff',
          wheel: CUSTOMIZATION_OPTIONS.wheels[i % CUSTOMIZATION_OPTIONS.wheels.length].id,
          boostPrimary: boostOpt.primary,
          boostSecondary: boostOpt.secondary,
          topper: CUSTOMIZATION_OPTIONS.toppers[(i + 1) % CUSTOMIZATION_OPTIONS.toppers.length].id,
          goalExplosion: CUSTOMIZATION_OPTIONS.goalExplosions[i % CUSTOMIZATION_OPTIONS.goalExplosions.length].id
        };
        playerName = isLocalHuman ? `Player ${i + 1}` : BOT_NAMES[botCursor++ % BOT_NAMES.length];
      }

      const carMesh = buildBattleCarMesh(bodyId, custom);
      this.scene.add(carMesh);

      this.physics.createCarEntity({
        id: `car_${i}`,
        name: playerName,
        team,
        isBot: !isLocalHuman,
        localPlayerIndex: isLocalHuman ? i : -1,
        bodyId,
        customization: custom,
        mesh: carMesh
      });
    }
  }

  /**
   * Exits Attract Mode immediately upon any user input and returns to the Title Menu.
   */
  exitAttractMode() {
    if (!this.inAttractMode) return;
    this.inAttractMode = false;
    this.exitToMainMenu();
  }

  exitToMainMenu() {
    this.inMatch = false;
    this.inAttractMode = false;
    this.isPaused = false;
    this.matchPhase = 'menu';
    this.replay.clear();
    this.audio.updateCarAudio(0, false, false, false);
    this.audio.setMusicMode('menu');

    this._rebuildStadiumScene();
    this.refreshShowcaseCar();
    if (this.showcaseGroup) this.showcaseGroup.visible = true;
    this.ui.showScreen('main_menu');
  }

  togglePause(paused) {
    this.isPaused = paused;
    if (this.isPaused) {
      this.audio.updateCarAudio(0, false, false, false);
      this.ui.showScreen('pause');
    } else {
      this.ui.showScreen('hud');
    }
  }

  _triggerQuickChat(playerSlot, chatIdx, fromNetwork = false) {
    const msgObj = QUICK_CHAT_MESSAGES[chatIdx % QUICK_CHAT_MESSAGES.length];
    if (!msgObj) return;
    const car = this.physics.cars[playerSlot] || this.physics.cars[0];
    const name = car ? car.name : `Player ${playerSlot + 1}`;
    const team = car ? car.team : 'blue';

    this.ui.addQuickChat(name, team, msgObj.text);
    this.audio.playUIMove();

    if (!fromNetwork && this.network.role !== 'offline') {
      this.network.sendQuickChat(playerSlot, chatIdx);
    }
  }

  _handlePhysicsEvent(type, payload) {
    if (this.inAttractMode) {
      if (type === 'save' || type === 'medal') {
        this.ui.showBanner(payload.title, `${payload.car.name} (+${payload.points})`, 1400);
      }
      return;
    }

    if (type === 'save' || type === 'medal') {
      if (payload.car.localPlayerIndex >= 0) {
        this.input.triggerRumble(payload.car.localPlayerIndex, 180, 0.75, 0.5);
      }
      this.ui.showBanner(payload.title, `${payload.car.name} +${payload.points}`, 1600);
    } else if (type === 'demolition') {
      this.ui.showBanner('💥 DEMOLITION!', `${payload.attacker.name} demolished ${payload.victim.name}!`, 1800);
    }
  }

  /**
   * Computes viewport layout rectangles for 1P, 2P, 3P, or 4P Split-Screen.
   */
  getViewportRects() {
    const count = this.inMatch ? this.matchConfig.localPlayers : 1;
    if (count <= 1) {
      return [{ leftPct: 0, topPct: 0, widthPct: 100, heightPct: 100 }];
    }
    if (count === 2) {
      if (this.matchConfig.splitComparison === 'vertical') {
        return [
          { leftPct: 0, topPct: 0, widthPct: 50, heightPct: 100 },
          { leftPct: 50, topPct: 0, widthPct: 50, heightPct: 100 }
        ];
      }
      return [
        { leftPct: 0, topPct: 0, widthPct: 100, heightPct: 50 },
        { leftPct: 0, topPct: 50, widthPct: 100, heightPct: 50 }
      ];
    }
    if (count === 3) {
      return [
        { leftPct: 0, topPct: 0, widthPct: 100, heightPct: 50 },
        { leftPct: 0, topPct: 50, widthPct: 50, heightPct: 50 },
        { leftPct: 50, topPct: 50, widthPct: 50, heightPct: 50 }
      ];
    }
    // 4-Player Quadrant Split-Screen
    return [
      { leftPct: 0, topPct: 0, widthPct: 50, heightPct: 50 },
      { leftPct: 50, topPct: 0, widthPct: 50, heightPct: 50 },
      { leftPct: 0, topPct: 50, widthPct: 50, heightPct: 50 },
      { leftPct: 50, topPct: 50, widthPct: 50, heightPct: 50 }
    ];
  }

  _onResize() {
    if (!this.renderer) return;
    this.renderer.setSize(window.innerWidth, window.innerHeight);
  }

  _animate() {
    requestAnimationFrame(() => this._animate());

    const now = performance.now();
    const dt = Math.min(0.05, (now - this.lastFrameTime) * 0.001);
    this.lastFrameTime = now;

    this.input.anyInputJustOccurred = false;
    const isMenuScreen = !this.inMatch && !this.inAttractMode;
    this.input.updateMenuNavigation(isMenuScreen || this.isPaused || this.matchPhase === 'postmatch');

    // Check 10-second Idle Timer on Title/Menu screens -> Launch Attract Mode!
    if (isMenuScreen && now - this.input.lastInputTime >= 10000) {
      this.startMatch(true);
      return;
    }

    // Exit Attract Mode immediately on ANY input!
    if (this.inAttractMode && this.input.anyInputJustOccurred) {
      this.exitAttractMode();
      return;
    }

    if (isMenuScreen) {
      this._updateMenuShowcase(dt, now);
    } else if (this.inAttractMode) {
      this._updateAttractMode(dt, now);
    } else if (this.inMatch && !this.isPaused) {
      this._updateMatchLoop(dt, now);
    }

    // Update Crowd & VFX & Shader Uniforms
    this.vfx.update(dt);
    this._updateCrowdAnimation(now * 0.001);
    const ballTeamColor =
      this.physics.ballState.lastTeamTouch === 'orange' ? '#ff6a00' : '#00e5ff';
    updateSharedShaderUniforms(this.physics.ballState.pos, ballTeamColor, null);

    // Render Scene across active Viewports
    this._renderSceneViewports();
  }

  _updateMenuShowcase(dt, now) {
    const t = now * 0.001;
    if (this.showcaseGroup) {
      this.showcaseGroup.rotation.y = t * 0.48;
      const ud = this.showcaseGroup.userData;
      if (ud?.wheels) {
        for (const w of ud.wheels) w.spinGroup.rotation.x = t * 4.0;
      }
    }
    if (this.ballMesh) {
      this.ballMesh.rotation.y = -t * 0.65;
      this.ballMesh.position.y = ARENA.ballRadius + Math.sin(t * 2.5) * 0.25;
      this.physics.ballState.pos.copy(this.ballMesh.position);
    }

    const cam = this.cameras[0];
    const radius = 14.5;
    cam.position.set(Math.sin(t * 0.22) * radius + 3.0, 4.4, Math.cos(t * 0.22) * radius);
    cam.lookAt(-1.0, 1.4, 0);
  }

  _updateAttractMode(dt, _now) {
    this.attractTimer += dt;

    // Cycle showcase feature callouts and camera angles every 7.5 seconds
    const callouts = [
      'Showcasing: Cel-Shaded Aerial Flight, Wall-Driving & Flip Resets',
      'Showcasing: Rumble Overdrive Power-Ups (Haymaker, Grapple, Cryo-Freeze, Magnet)',
      'Showcasing: What-A-Save! Goalie Reflexes & Booming Power-Shots',
      'Showcasing: Supersonic Demolitions & Multi-Band TSL Cel Shaders'
    ];
    const phaseIdx = Math.floor(this.attractTimer / 7.5) % callouts.length;
    this.attractCamMode = phaseIdx;
    const calloutEl = document.getElementById('attract-feature-callout');
    if (calloutEl) {
      calloutEl.textContent = callouts[phaseIdx];
    }

    // Run supercharged Attract Mode AI
    this.botAI.updateBots(this.physics, dt, true);
    const goalEvent = this.physics.step(dt, true);

    if (this.ballMesh) {
      this.ballMesh.position.copy(this.physics.ballState.pos);
      this.ballMesh.quaternion.copy(this.physics.ballState.quat);
    }

    if (goalEvent) {
      if (goalEvent.scoringTeam === 'blue') this.blueScore++;
      else this.orangeScore++;
      this.ui.showBanner(`⚽ ${goalEvent.scoringTeam.toUpperCase()} GOAL!`, `${goalEvent.scorerName} (${goalEvent.speedKmh} KM/H)`, 2200);
      this.physics.resetKickoff(Math.floor(Math.random() * 4));
    }

    // Keep ball lively in Attract Mode
    if (this.physics.ballState.vel.length() < 6.0 && Math.random() < 0.03) {
      this.physics.ballState.vel.y += 16.0;
      if (this.physics.ballBody) {
        this.physics.ballBody.setLinvel(this.physics.ballState.vel, true);
      }
    }

    this.ui.updateLiveHUD(this.blueScore, this.orangeScore, 'DEMO', false, [], null);
    this._updateTetherLines();

    // Update Attract Mode Director Camera
    const cam = this.cameras[0];
    const bPos = this.physics.ballState.pos;
    const leadCar = this.physics.cars[0];

    if (this.attractCamMode === 1 && leadCar) {
      this._updatePlayerCamera(cam, leadCar, bPos, dt);
    } else if (this.attractCamMode === 2) {
      // Goal-line dramatic camera
      const targetCam = new THREE.Vector3(14, 7.5, bPos.z >= 0 ? 52 : -52);
      cam.position.lerp(targetCam, Math.min(1, dt * 3.5));
      cam.lookAt(bPos.x, bPos.y + 1.0, bPos.z);
    } else {
      // Broadcast Sideline Director Camera
      const targetCam = new THREE.Vector3(
        28 * Math.sin(this.attractTimer * 0.35),
        12 + Math.sin(this.attractTimer * 0.5) * 4,
        bPos.z * 0.65 - 18
      );
      cam.position.lerp(targetCam, Math.min(1, dt * 4.0));
      cam.lookAt(bPos.x, bPos.y, bPos.z);
    }
  }

  _updateMatchLoop(dt, _now) {
    const localCars = this.physics.cars.filter((c) => c.localPlayerIndex >= 0);

    // 1. Gather Input for Local Players (1..4) and Bot AI
    for (const car of localCars) {
      car.input = this.input.getPlayerInput(car.localPlayerIndex);
    }

    if (this.network.role === 'client') {
      // Send local input to Host & interpolate snapshot
      if (localCars[0]) {
        this.network.sendClientInput(localCars[0].input);
      }
    } else {
      // Apply remote peer inputs if Host
      for (const [slot, rInput] of this.network.remoteInputs.entries()) {
        const remoteCar = this.physics.cars[slot];
        if (remoteCar) {
          remoteCar.isBot = false;
          remoteCar.input = rInput;
        }
      }
      this.botAI.updateBots(this.physics, dt, false);
    }

    // 2. Handle Match Phase (Countdown, Playing, Goal Celebration, Instant Replay, Postmatch)
    if (this.matchPhase === 'countdown') {
      this.phaseTimer -= dt;
      const ceilSec = Math.ceil(this.phaseTimer);
      if (ceilSec !== this.lastCountdownInt && ceilSec >= 1 && ceilSec <= 3) {
        this.lastCountdownInt = ceilSec;
        this.ui.showBanner(String(ceilSec), 'GET READY!', 850);
        this.audio.playUIMove();
        this.audio.announce(String(ceilSec), true);
      }
      if (this.phaseTimer <= 0) {
        this.matchPhase = 'playing';
        this.ui.showBanner('GO!', 'WHAT A SAVE! LEAGUE', 1100);
        this.audio.playUIConfirm();
        this.audio.announce('GO!', true);
      }
      this.physics.step(dt, false);
    } else if (this.matchPhase === 'playing') {
      // Advance Match Clock
      const modeObj = GAME_MODES.find((m) => m.id === this.matchConfig.modeId) || GAME_MODES[0];
      if (modeObj.matchDuration > 0) {
        if (this.isOvertime) {
          this.matchTimeRemaining += dt;
        } else {
          const prevSec = Math.ceil(this.matchTimeRemaining);
          this.matchTimeRemaining = Math.max(0, this.matchTimeRemaining - dt);
          const curSec = Math.ceil(this.matchTimeRemaining);

          if (curSec !== prevSec) {
            if (curSec === 30) {
              this.ui.showBanner('30 SECONDS REMAINING', '', 1500);
              this.audio.announce('Thirty seconds remaining!');
            } else if (curSec >= 1 && curSec <= 5) {
              this.ui.showBanner(String(curSec), '', 750);
              this.audio.playUIMove();
            }
          }

          // Rocket League 0-Second Rule: Match ends when timer == 0 AND ball touches floor!
          if (this.matchTimeRemaining <= 0 && this.physics.ballState.pos.y <= this.physics.ballState.radius + 0.45) {
            if (this.blueScore === this.orangeScore && !modeObj.gauntlet) {
              this.isOvertime = true;
              this.matchTimeRemaining = 0;
              this.audio.setMusicMode('overtime');
              this.audio.announce('OVERTIME! NEXT GOAL WINS!', true);
              this.ui.showBanner('⚡ OVERTIME!', 'NEXT GOAL WINS!', 2500);
              this.physics.resetKickoff(1);
              this.matchPhase = 'countdown';
              this.phaseTimer = 3.2;
              this.lastCountdownInt = 4;
              return;
            } else {
              this._endMatch();
              return;
            }
          }
        }
      }

      const goalEvent = this.physics.step(dt, true);
      this.replay.recordFrame(this.physics);

      if (goalEvent) {
        if (goalEvent.scoringTeam === 'blue') this.blueScore++;
        else this.orangeScore++;

        this.pendingGoalInfo = goalEvent;
        this.matchPhase = 'goal_celebration';
        this.phaseTimer = 2.2;
        this.audio.setMusicMode('goal');

        const assistStr = goalEvent.assisterName ? ` · Assist: ${goalEvent.assisterName}` : '';
        this.ui.showBanner(
          `⚽ ${goalEvent.scoringTeam.toUpperCase()} GOAL!`,
          `Scored by ${goalEvent.scorerName} (${goalEvent.speedKmh} KM/H)${assistStr}`,
          2200
        );

        localCars.forEach((c) => {
          this.input.triggerRumble(c.localPlayerIndex, 350, 1.0, 0.8);
        });
      }
    } else if (this.matchPhase === 'goal_celebration') {
      this.phaseTimer -= dt;
      this.physics.step(dt, true);
      this.replay.recordFrame(this.physics);

      if (this.phaseTimer <= 0) {
        if (this.isOvertime) {
          this._endMatch();
          return;
        }
        // Start Instant Goal Replay!
        if (this.replay.startPlayback(this.pendingGoalInfo)) {
          this.matchPhase = 'replay';
        } else {
          this._resumeNextKickoff();
        }
      }
    } else if (this.matchPhase === 'replay') {
      const stillPlaying = this.replay.updatePlayback(
        dt,
        this.physics,
        this.ballMesh,
        this.cameras[0]
      );
      const skipPressed = localCars.some((c) => c.input.jumpJustPressed);
      if (!stillPlaying || skipPressed) {
        this.replay.stopPlayback();
        this._resumeNextKickoff();
      }
    }

    // Sync Ball Mesh when not in Replay
    if (this.matchPhase !== 'replay' && this.ballMesh) {
      this.ballMesh.position.copy(this.physics.ballState.pos);
      this.ballMesh.quaternion.copy(this.physics.ballState.quat);
    }

    // Update Local Player Cameras & Car Audio
    if (this.matchPhase !== 'replay') {
      localCars.forEach((car, idx) => {
        const cam = this.cameras[idx];
        if (cam) {
          this._updatePlayerCamera(cam, car, this.physics.ballState.pos, dt);
        }
      });
    }

    if (localCars[0]) {
      const p0 = localCars[0];
      this.audio.updateCarAudio(
        p0.vel.length() / 32.0,
        p0.isBoosting,
        p0.isDrifting,
        this.matchPhase === 'playing' || this.matchPhase === 'goal_celebration'
      );
    }

    // Broadcast online state if Host
    if (this.network.role === 'host') {
      this.network.broadcastStateSnapshot(
        this.physics,
        this.blueScore,
        this.orangeScore,
        this.matchTimeRemaining,
        this.isOvertime
      );
    }

    // Update HUD Clock & Boost Dials
    const mins = Math.floor(this.matchTimeRemaining / 60);
    const secs = Math.floor(this.matchTimeRemaining % 60);
    const clockStr = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    this.ui.updateLiveHUD(
      this.blueScore,
      this.orangeScore,
      clockStr,
      this.isOvertime,
      localCars,
      this.replay
    );

    this._updateTetherLines();
  }

  _resumeNextKickoff() {
    this.audio.setMusicMode(this.isOvertime ? 'overtime' : 'match');
    this.physics.resetKickoff(this.blueScore + this.orangeScore);
    this.replay.clear();
    this.matchPhase = 'countdown';
    this.phaseTimer = 3.2;
    this.lastCountdownInt = 4;
  }

  _endMatch() {
    this.matchPhase = 'postmatch';
    this.audio.updateCarAudio(0, false, false, false);
    this.audio.setMusicMode('goal');
    const winPhrase = this.blueScore >= this.orangeScore ? 'BLUE TEAM WINS!' : 'ORANGE TEAM WINS!';
    this.audio.announce(`WINNER! ${winPhrase}`, true);
    this.ui.showScreen('postmatch');
  }

  /**
   * Updates a player's camera in either Ball Cam (tracking the ball from behind the car)
   * or Car Cam (following behind the car's forward vector).
   */
  _updatePlayerCamera(camera, car, ballPos, dt) {
    // Dynamic FOV scaling with speed & Supersonic state!
    const speed = car.vel.length();
    const targetFov = 68 + Math.min(14, (speed / 40.0) * 14);
    if (Math.abs(camera.fov - targetFov) > 0.1) {
      camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 8);
      camera.updateProjectionMatrix();
    }

    const camDist = 11.2;
    const camHeight = 3.5;

    let desiredPos = new THREE.Vector3();
    let desiredLook = new THREE.Vector3();

    if (car.ballCam) {
      // BALL CAM: Position camera behind the car along the line from Ball -> Car
      const ballToCar = new THREE.Vector3().subVectors(car.pos, ballPos);
      // Flatten vertical angle slightly so camera doesn't clip through floor when ball is high overhead
      const horizDist = Math.hypot(ballToCar.x, ballToCar.z);
      let dirXZ = new THREE.Vector3(ballToCar.x, 0, ballToCar.z);
      if (horizDist < 0.5) {
        dirXZ.copy(car.forward).negate();
        dirXZ.y = 0;
      }
      dirXZ.normalize();

      desiredPos
        .copy(car.pos)
        .addScaledVector(dirXZ, camDist)
        .add(new THREE.Vector3(0, camHeight, 0));

      // Blend lookAt between car and ball
      desiredLook.copy(ballPos).lerp(car.pos, 0.22);
      desiredLook.y = Math.max(1.2, desiredLook.y);
    } else {
      // CAR CAM: Follow behind car's forward vector + manual right-stick look
      const fwd = new THREE.Vector3(car.forward.x, 0, car.forward.z);
      if (fwd.lengthSq() < 0.01) fwd.set(0, 0, 1);
      fwd.normalize();

      if (Math.abs(car.input.camYaw) > 0.05) {
        fwd.applyAxisAngle(new THREE.Vector3(0, 1, 0), car.input.camYaw * 1.4);
      }

      desiredPos
        .copy(car.pos)
        .addScaledVector(fwd, -camDist)
        .add(new THREE.Vector3(0, camHeight + car.input.camPitch * 3.0, 0));

      desiredLook.copy(car.pos).addScaledVector(fwd, 10.0);
      desiredLook.y += 1.4;
    }

    // Clamp camera inside stadium walls & above floor
    desiredPos.x = THREE.MathUtils.clamp(desiredPos.x, -ARENA.width * 0.48, ARENA.width * 0.48);
    desiredPos.y = THREE.MathUtils.clamp(desiredPos.y, 1.35, ARENA.height - 1.5);
    desiredPos.z = THREE.MathUtils.clamp(
      desiredPos.z,
      -ARENA.length * 0.5 - ARENA.goalDepth + 1.5,
      ARENA.length * 0.5 + ARENA.goalDepth - 1.5
    );

    car.camPos.lerp(desiredPos, Math.min(1, dt * 11.5));
    car.camLookAt.lerp(desiredLook, Math.min(1, dt * 14.0));

    camera.position.copy(car.camPos);
    camera.lookAt(car.camLookAt);
  }

  _updateTetherLines() {
    while (this.tetherLineGroup.children.length > 0) {
      const child = this.tetherLineGroup.children[0];
      child.geometry?.dispose();
      child.material?.dispose();
      this.tetherLineGroup.remove(child);
    }

    for (const t of this.physics.activeTethers) {
      const dir = new THREE.Vector3().subVectors(t.to, t.from);
      const len = dir.length();
      if (len < 0.2) continue;
      const geo = new THREE.CylinderGeometry(0.14, 0.14, len, 6);
      geo.rotateX(Math.PI * 0.5);
      const mat = new THREE.MeshBasicMaterial({ color: t.color });
      const beam = new THREE.Mesh(geo, mat);
      beam.position.copy(t.from).lerp(t.to, 0.5);
      beam.lookAt(t.to);
      this.tetherLineGroup.add(beam);
    }
  }

  _updateCrowdAnimation(timeSec) {
    if (!this.arenaRefs?.crowdInstanced) return;
    const inst = this.arenaRefs.crowdInstanced;
    const data = this.arenaRefs.crowdData;
    const dummy = new THREE.Object3D();
    const excitement = this.matchPhase === 'goal_celebration' ? 2.4 : 1.0;

    for (let i = 0; i < data.length; i++) {
      const d = data[i];
      const bounce = Math.abs(Math.sin(timeSec * 5.0 * excitement + d.phase)) * 0.65 * excitement;
      dummy.position.set(d.x, d.y + bounce, d.z);
      dummy.lookAt(0, 2, d.z * 0.5);
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
  }

  _applyNetworkSnapshot(snap) {
    this.blueScore = snap.blueScore;
    this.orangeScore = snap.orangeScore;
    this.matchTimeRemaining = snap.matchTimeRemaining;
    this.isOvertime = snap.isOvertime;

    if (snap.ball) {
      this.physics.ballState.pos.set(snap.ball.x, snap.ball.y, snap.ball.z);
      this.physics.ballState.vel.set(snap.ball.vx, snap.ball.vy, snap.ball.vz);
      this.physics.ballState.quat.set(snap.ball.qx, snap.ball.qy, snap.ball.qz, snap.ball.qw);
      this.physics.ballState.lastTeamTouch = snap.ball.lastTeamTouch;
    }

    if (snap.cars) {
      for (const cs of snap.cars) {
        const car = this.physics.cars.find((c) => c.id === cs.id);
        if (!car) continue;
        car.pos.set(cs.x, cs.y, cs.z);
        car.quat.set(cs.qx, cs.qy, cs.qz, cs.qw);
        car.boost = cs.boost;
        car.isBoosting = cs.isBoosting;
        car.demolished = cs.demolished;
        if (car.mesh) {
          car.mesh.visible = !cs.demolished;
          car.mesh.position.copy(car.pos);
          car.mesh.quaternion.copy(car.quat);
        }
      }
    }
  }

  /**
   * Renders the 3D WebGPU scene across 1, 2, 3, or 4 Split-Screen Viewports!
   */
  _renderSceneViewports() {
    if (!this.renderer || !this.scene) return;
    const W = window.innerWidth;
    const H = window.innerHeight;

    const viewports =
      this.inMatch && this.matchPhase !== 'replay' && this.matchPhase !== 'postmatch'
        ? this.getViewportRects()
        : [{ leftPct: 0, topPct: 0, widthPct: 100, heightPct: 100 }];

    if (viewports.length === 1) {
      this.renderer.setScissorTest(false);
      this.renderer.setViewport(0, 0, W, H);
      const cam = this.cameras[0];
      cam.aspect = W / H;
      cam.updateProjectionMatrix();
      this.renderer.clear();
      this.renderer.render(this.scene, cam);
      return;
    }

    // Multi-Viewport Split-Screen Rendering
    this.renderer.setScissorTest(true);
    for (let i = 0; i < viewports.length; i++) {
      const vp = viewports[i];
      const vx = Math.floor((vp.leftPct / 100) * W);
      const vw = Math.floor((vp.widthPct / 100) * W);
      const vh = Math.floor((vp.heightPct / 100) * H);
      // Note: WebGPU / Three.js viewport Y coordinate from top vs bottom
      const vy = Math.floor(((100 - vp.topPct - vp.heightPct) / 100) * H);

      const cam = this.cameras[i] || this.cameras[0];
      cam.aspect = Math.max(0.1, vw / Math.max(1, vh));
      cam.updateProjectionMatrix();

      this.renderer.setViewport(vx, vy, vw, vh);
      this.renderer.setScissor(vx, vy, vw, vh);
      this.renderer.render(this.scene, cam);
    }
    this.renderer.setScissorTest(false);
  }
}

// Boot the game
window.addEventListener('DOMContentLoaded', async () => {
  const app = new WhatASaveLeagueApp();
  window.__WASL_APP__ = app;
  await app.init();
});
