/**
 * Builds an articulated Cel-Shaded Battle-Car 3D hierarchy.
 */
function buildBattleCarMesh(bodyId = 'octane_x', custom = {}) {
  const root = new THREE.Group();
  root.name = `BattleCar_${bodyId}`;

  const primaryHex = custom.primaryColor || '#0088ff';
  const rimHex = custom.rimColor || '#66e0ff';
  const decalType = custom.decal || 'stripes';
  const decalHex = custom.decalColor || '#ffffff';
  const boostPrimary = custom.boostPrimary || '#ffaa00';
  const boostSecondary = custom.boostSecondary || '#ff3300';
  const wheelStyle = custom.wheel || 'aero_disc';
  const topperId = custom.topper || 'none';

  const bodyMat = createCelMaterial({
    baseColor: primaryHex,
    rimColor: rimHex,
    decalType,
    decalColor: decalHex,
    steps: 4.0,
    specSize: 0.82,
    specStrength: 0.75,
    rimStrength: 0.85
  });

  const darkTrimMat = createCelMaterial({
    baseColor: '#1b202e',
    rimColor: '#5c6b8a',
    decalType: 'none',
    steps: 3.0,
    specSize: 0.88,
    specStrength: 0.4
  });

  const canopyMat = createCelMaterial({
    baseColor: '#0c1324',
    rimColor: '#88eeff',
    decalType: 'none',
    steps: 3.0,
    specSize: 0.76,
    specStrength: 0.95,
    rimStrength: 0.9
  });

  const neonMat = new THREE.MeshBasicMaterial({ color: rimHex });

  // Chassis suspension group (tilts on pitch/roll/acceleration)
  const chassis = new THREE.Group();
  chassis.position.y = 0.55;
  root.add(chassis);

  // Build body silhouette based on bodyId
  if (bodyId === 'dominus_gt') {
    // Low-slung wide muscle car
    const mainHull = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.55, 4.15), bodyMat);
    mainHull.position.set(0, 0.15, 0);
    attachInkOutline(mainHull, 0.055);
    chassis.add(mainHull);

    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.45, 1.9), canopyMat);
    cabin.position.set(0, 0.55, -0.25);
    attachInkOutline(cabin, 0.045);
    chassis.add(cabin);

    // Supercharger hood blower
    const blower = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.32, 0.85), darkTrimMat);
    blower.position.set(0, 0.5, 1.05);
    attachInkOutline(blower, 0.04);
    chassis.add(blower);

    // Ducktail rear wing
    const wing = new THREE.Mesh(new THREE.BoxGeometry(2.35, 0.25, 0.35), bodyMat);
    wing.position.set(0, 0.55, -1.95);
    wing.rotation.x = 0.35;
    attachInkOutline(wing, 0.045);
    chassis.add(wing);
  } else if (bodyId === 'fennec_box') {
    // Compact rally hatchback
    const lowerBox = new THREE.Mesh(new THREE.BoxGeometry(2.28, 0.58, 3.65), bodyMat);
    lowerBox.position.set(0, 0.16, 0);
    attachInkOutline(lowerBox, 0.055);
    chassis.add(lowerBox);

    const hatch = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.56, 2.25), canopyMat);
    hatch.position.set(0, 0.65, -0.35);
    attachInkOutline(hatch, 0.045);
    chassis.add(hatch);

    const roofCap = new THREE.Mesh(new THREE.BoxGeometry(1.88, 0.14, 2.15), bodyMat);
    roofCap.position.set(0, 0.96, -0.35);
    attachInkOutline(roofCap, 0.04);
    chassis.add(roofCap);

    const rallyWing = new THREE.Mesh(new THREE.BoxGeometry(2.15, 0.14, 0.52), darkTrimMat);
    rallyWing.position.set(0, 1.08, -1.52);
    rallyWing.rotation.x = 0.22;
    attachInkOutline(rallyWing, 0.04);
    chassis.add(rallyWing);
  } else if (bodyId === 'venom_v8') {
    // Sleek cyber interceptor
    const fuselage = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.52, 4.05), bodyMat);
    fuselage.position.set(0, 0.18, 0);
    attachInkOutline(fuselage, 0.055);
    chassis.add(fuselage);

    const noseCone = new THREE.Mesh(new THREE.ConeGeometry(1.05, 1.4, 4), bodyMat);
    noseCone.rotation.x = Math.PI * 0.5;
    noseCone.rotation.y = Math.PI * 0.25;
    noseCone.position.set(0, 0.12, 2.15);
    attachInkOutline(noseCone, 0.05);
    chassis.add(noseCone);

    const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.85, 16, 12), canopyMat);
    canopy.scale.set(0.95, 0.58, 1.65);
    canopy.position.set(0, 0.52, -0.1);
    attachInkOutline(canopy, 0.045);
    chassis.add(canopy);

    // Twin vertical tail fins
    [-0.85, 0.85].forEach((xPos) => {
      const fin = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.72, 0.95), bodyMat);
      fin.position.set(xPos, 0.65, -1.55);
      fin.rotation.z = xPos > 0 ? -0.18 : 0.18;
      attachInkOutline(fin, 0.04);
      chassis.add(fin);
    });
  } else {
    // Default: Octane-X (Iconic sloped buggy with high rear wing & side pods)
    const coreBody = new THREE.Mesh(new THREE.BoxGeometry(1.72, 0.56, 3.65), bodyMat);
    coreBody.position.set(0, 0.18, -0.05);
    attachInkOutline(coreBody, 0.055);
    chassis.add(coreBody);

    // Sloped nose wedge
    const nose = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.38, 1.35), bodyMat);
    nose.position.set(0, 0.12, 1.35);
    nose.rotation.x = 0.22;
    attachInkOutline(nose, 0.05);
    chassis.add(nose);

    // Side turbo pods
    [-0.96, 0.96].forEach((xSide) => {
      const pod = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.42, 2.1), darkTrimMat);
      pod.position.set(xSide, 0.14, -0.2);
      attachInkOutline(pod, 0.045);
      chassis.add(pod);
    });

    // Angled roll-cage cockpit
    const cockpit = new THREE.Mesh(new THREE.BoxGeometry(1.48, 0.52, 1.75), canopyMat);
    cockpit.position.set(0, 0.62, -0.28);
    cockpit.rotation.x = -0.12;
    attachInkOutline(cockpit, 0.045);
    chassis.add(cockpit);

    // Iconic Octane Bi-Plane Rear Wing
    const wingBlade = new THREE.Mesh(new THREE.BoxGeometry(2.15, 0.12, 0.62), bodyMat);
    wingBlade.position.set(0, 1.02, -1.68);
    wingBlade.rotation.x = 0.24;
    attachInkOutline(wingBlade, 0.045);
    chassis.add(wingBlade);

    [-0.65, 0.65].forEach((wx) => {
      const strut = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.55, 0.28), darkTrimMat);
      strut.position.set(wx, 0.72, -1.62);
      chassis.add(strut);
    });
  }

  // Headlights (+Z front)
  [-0.62, 0.62].forEach((hx) => {
    const lamp = new THREE.Mesh(
      new THREE.BoxGeometry(0.36, 0.16, 0.1),
      new THREE.MeshBasicMaterial({ color: '#e6ffff' })
    );
    lamp.position.set(hx, 0.22, 1.98);
    chassis.add(lamp);
  });

  // Twin Rear Rocket Thruster Nozzles (-Z back)
  const boostFlames = [];
  [-0.45, 0.45].forEach((bx) => {
    const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 0.42, 12), darkTrimMat);
    nozzle.rotation.x = Math.PI * 0.5;
    nozzle.position.set(bx, 0.28, -2.02);
    attachInkOutline(nozzle, 0.035);
    chassis.add(nozzle);

    // Inner glowing core + Outer flame cone
    const flameGroup = new THREE.Group();
    flameGroup.position.set(bx, 0.28, -2.25);

    const outerCone = new THREE.Mesh(
      new THREE.ConeGeometry(0.28, 1.65, 10),
      new THREE.MeshBasicMaterial({ color: boostSecondary, transparent: true, opacity: 0.85 })
    );
    outerCone.rotation.x = -Math.PI * 0.5;
    outerCone.position.z = -0.75;
    flameGroup.add(outerCone);

    const innerCone = new THREE.Mesh(
      new THREE.ConeGeometry(0.16, 1.1, 8),
      new THREE.MeshBasicMaterial({ color: boostPrimary })
    );
    innerCone.rotation.x = -Math.PI * 0.5;
    innerCone.position.z = -0.5;
    flameGroup.add(innerCone);

    flameGroup.visible = false;
    chassis.add(flameGroup);
    boostFlames.push(flameGroup);
  });

  // Undercarriage Flip-Available Indicator Ring (glows cyan when dodge/flip is available!)
  const flipRingGeo = new THREE.RingGeometry(0.85, 1.12, 24);
  const flipRingMat = new THREE.MeshBasicMaterial({
    color: '#00ffcc',
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.75
  });
  const flipRing = new THREE.Mesh(flipRingGeo, flipRingMat);
  flipRing.rotation.x = Math.PI * 0.5;
  flipRing.position.set(0, -0.18, 0);
  chassis.add(flipRing);

  // Customizable Roof Topper
  if (topperId && topperId !== 'none') {
    const topperGroup = _buildTopperMesh(topperId);
    topperGroup.position.set(0, 1.08, -0.25);
    chassis.add(topperGroup);
    root.userData.topperGroup = topperGroup;
  }

  // 4 Articulated Wheels (Front-Left, Front-Right, Rear-Left, Rear-Right)
  const wheelOffsets = [
    { x: -1.16, y: 0.45, z:  1.25, front: true },
    { x:  1.16, y: 0.45, z:  1.25, front: true },
    { x: -1.18, y: 0.48, z: -1.25, front: false },
    { x:  1.18, y: 0.48, z: -1.25, front: false }
  ];

  const wheels = [];
  wheelOffsets.forEach((wo) => {
    const steerPivot = new THREE.Group();
    steerPivot.position.set(wo.x, wo.y, wo.z);

    const spinGroup = new THREE.Group();
    const radius = wo.front ? 0.45 : 0.49;
    const width = wo.front ? 0.38 : 0.44;

    const tireGeo = new THREE.CylinderGeometry(radius, radius, width, 18);
    tireGeo.rotateZ(Math.PI * 0.5);
    const tireMesh = new THREE.Mesh(tireGeo, darkTrimMat);
    attachInkOutline(tireMesh, 0.04);
    spinGroup.add(tireMesh);

    // Rim Hub & Spokes
    const hubGeo = new THREE.CylinderGeometry(radius * 0.65, radius * 0.65, width + 0.04, 12);
    hubGeo.rotateZ(Math.PI * 0.5);
    const hubMat =
      wheelStyle === 'neon_blade'
        ? neonMat
        : createCelMaterial({ baseColor: '#d8e4f8', rimColor: rimHex, steps: 3.0 });
    const hubMesh = new THREE.Mesh(hubGeo, hubMat);
    spinGroup.add(hubMesh);

    // Crossbar spoke so wheel rotation is clearly visible
    const spoke = new THREE.Mesh(
      new THREE.BoxGeometry(width + 0.06, radius * 1.15, 0.12),
      new THREE.MeshBasicMaterial({ color: rimHex })
    );
    spinGroup.add(spoke);

    steerPivot.add(spinGroup);
    root.add(steerPivot);
    wheels.push({ steerPivot, spinGroup, front: wo.front, baseY: wo.y });
  });

  root.userData = {
    ...root.userData,
    chassis,
    wheels,
    boostFlames,
    flipRing,
    flipRingMat,
    bodyMat
  };

  return root;
}

function _buildTopperMesh(topperId) {
  const g = new THREE.Group();
  if (topperId === 'halo') {
    const torus = new THREE.Mesh(
      new THREE.TorusGeometry(0.45, 0.07, 12, 24),
      new THREE.MeshBasicMaterial({ color: '#ffee55' })
    );
    torus.rotation.x = Math.PI * 0.5;
    torus.position.y = 0.25;
    attachInkOutline(torus, 0.03);
    g.add(torus);
  } else if (topperId === 'crown') {
    const goldMat = createCelMaterial({ baseColor: '#ffcc00', rimColor: '#ffffaa', steps: 3.0 });
    const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.32, 0.34, 8), goldMat);
    crown.position.y = 0.15;
    attachInkOutline(crown, 0.035);
    g.add(crown);
  } else if (topperId === 'horns') {
    const hornMat = createCelMaterial({ baseColor: '#ff1133', rimColor: '#ffaa00', steps: 3.0 });
    [-0.38, 0.38].forEach((hx) => {
      const horn = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.55, 10), hornMat);
      horn.position.set(hx, 0.22, 0.05);
      horn.rotation.z = hx > 0 ? -0.45 : 0.45;
      horn.rotation.x = 0.25;
      attachInkOutline(horn, 0.03);
      g.add(horn);
    });
  } else if (topperId === 'shades') {
    const shadeMat = new THREE.MeshBasicMaterial({ color: '#050508' });
    const bar = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.22, 0.15), shadeMat);
    bar.position.set(0, -0.15, 0.85);
    g.add(bar);
  } else if (topperId === 'shark') {
    const finMat = createCelMaterial({ baseColor: '#00d2ff', rimColor: '#ffffff', steps: 3.0 });
    const fin = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.7, 4), finMat);
    fin.position.set(0, 0.28, -0.1);
    fin.rotation.x = -0.35;
    attachInkOutline(fin, 0.035);
    g.add(fin);
  }
  return g;
}

/**
 * Builds the Game Ball (Geodesic Soccar Sphere, Snow Day Cyber-Puck, or Mutator Cube).
 */
function buildBallMesh(shapeType = 'sphere', radius = ARENA.ballRadius) {
  const group = new THREE.Group();
  const ballMat = createBallCelMaterial();

  let coreMesh;
  if (shapeType === 'puck') {
    const geo = new THREE.CylinderGeometry(radius * 1.15, radius * 1.15, radius * 0.72, 24);
    coreMesh = new THREE.Mesh(geo, ballMat);
    attachInkOutline(coreMesh, 0.085);
  } else if (shapeType === 'cube') {
    const s = radius * 1.55;
    const geo = new THREE.BoxGeometry(s, s, s);
    coreMesh = new THREE.Mesh(geo, ballMat);
    attachInkOutline(coreMesh, 0.085);
  } else {
    const geo = new THREE.IcosahedronGeometry(radius, 3);
    coreMesh = new THREE.Mesh(geo, ballMat);
    attachInkOutline(coreMesh, 0.085);
  }

  group.add(coreMesh);
  group.userData.coreMesh = coreMesh;
  return group;
}

/**
 * Builds the entire Cel-Shaded Stadium Arena, Boost Pads, Goals, Hoops, Dropshot Hex-Floor,
 * Overhead Scoreboard, Floodlights, and Animated Instanced Crowd.
 */
function buildStadiumArena(scene, theme, modeConfig = {}) {
  const arenaGroup = new THREE.Group();
  arenaGroup.name = 'StadiumArena';

  const W = ARENA.width;
  const L = ARENA.length;
  const H = ARENA.height;
  const GW = ARENA.goalWidth;
  const GH = ARENA.goalHeight;
  const GD = ARENA.goalDepth;

  // 1. Pitch Floor (or Dropshot Interactive Hex Tiles)
  const floorMat = createPitchFloorMaterial();
  const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(W, L, 1, 1), floorMat);
  floorMesh.rotation.x = -Math.PI * 0.5;
  floorMesh.position.y = 0;
  arenaGroup.add(floorMesh);

  // Dropshot Hexagonal Breakable Tiles
  const dropshotTiles = [];
  if (modeConfig.dropshot) {
    floorMesh.position.y = -0.15; // Slightly lower base floor so hex tiles sit on top
    const tileRadius = 6.2;
    const hexGeo = new THREE.CylinderGeometry(tileRadius * 0.94, tileRadius * 0.94, 0.35, 6);
    const rows = [-44, -31, -18, 18, 31, 44];
    const cols = [-26, -13, 0, 13, 26];

    rows.forEach((zPos, rIdx) => {
      cols.forEach((xBase, cIdx) => {
        const xOffset = rIdx % 2 === 0 ? 0 : 6.5;
        const xPos = xBase + xOffset;
        if (Math.abs(xPos) > W * 0.42) return;
        const team = zPos < 0 ? 'blue' : 'orange';
        const baseColor = team === 'blue' ? '#124078' : '#783212';
        const mat = createCelMaterial({
          baseColor,
          rimColor: team === 'blue' ? '#00d2ff' : '#ff8800',
          steps: 3.0
        });
        const tileMesh = new THREE.Mesh(hexGeo, mat);
        tileMesh.position.set(xPos, 0.0, zPos);
        attachInkOutline(tileMesh, 0.05);
        arenaGroup.add(tileMesh);
        dropshotTiles.push({
          mesh: tileMesh,
          mat,
          x: xPos,
          z: zPos,
          radius: tileRadius,
          team,
          state: 0, // 0 = intact, 1 = damaged/charged, 2 = broken open goal pit!
          respawnTimer: 0
        });
      });
    });
  }

  // 2. Curved Wall-to-Floor Transition Ramps (45-degree beveled fillet strips)
  const rampMat = createCelMaterial({
    baseColor: '#1b263b',
    rimColor: theme.gridGlow,
    steps: 3.0,
    specStrength: 0.3
  });

  // Left & Right side wall transition ramps (along Z)
  const fSize = ARENA.wallFillet;
  [-1, 1].forEach((sideX) => {
    const rampGeo = new THREE.BoxGeometry(fSize * 1.414, 0.6, L - 16);
    const ramp = new THREE.Mesh(rampGeo, rampMat);
    ramp.position.set(sideX * (W * 0.5 - fSize * 0.5), fSize * 0.5, 0);
    ramp.rotation.z = sideX * (Math.PI * 0.25);
    arenaGroup.add(ramp);

    // Upper ceiling transition bevel
    const topRamp = new THREE.Mesh(rampGeo, rampMat);
    topRamp.position.set(sideX * (W * 0.5 - fSize * 0.5), H - fSize * 0.5, 0);
    topRamp.rotation.z = -sideX * (Math.PI * 0.25);
    arenaGroup.add(topRamp);
  });

  // 3. 45-Degree Stadium Corner Walls
  const cornerBevel = ARENA.cornerBevel;
  const cornerWidth = cornerBevel * Math.SQRT2;
  const cornerGeo = new THREE.BoxGeometry(cornerWidth, H, 1.2);
  [
    { x: -W * 0.5 + cornerBevel * 0.5, z: -L * 0.5 + cornerBevel * 0.5, rotY:  Math.PI * 0.25 },
    { x:  W * 0.5 - cornerBevel * 0.5, z: -L * 0.5 + cornerBevel * 0.5, rotY: -Math.PI * 0.25 },
    { x: -W * 0.5 + cornerBevel * 0.5, z:  L * 0.5 - cornerBevel * 0.5, rotY: -Math.PI * 0.25 },
    { x:  W * 0.5 - cornerBevel * 0.5, z:  L * 0.5 - cornerBevel * 0.5, rotY:  Math.PI * 0.25 }
  ].forEach((c) => {
    const cornerMesh = new THREE.Mesh(cornerGeo, rampMat);
    cornerMesh.position.set(c.x, H * 0.5, c.z);
    cornerMesh.rotation.y = c.rotY;
    arenaGroup.add(cornerMesh);
  });

  // 4. Translucent Energy-Dome Side Walls & Ceiling (with live ball-proximity shader!)
  const wallMat = createArenaWallMaterial();
  const sideWallGeo = new THREE.PlaneGeometry(L, H);
  [-W * 0.5, W * 0.5].forEach((xPos) => {
    const wall = new THREE.Mesh(sideWallGeo, wallMat);
    wall.position.set(xPos, H * 0.5, 0);
    wall.rotation.y = xPos < 0 ? Math.PI * 0.5 : -Math.PI * 0.5;
    arenaGroup.add(wall);
  });

  const ceilingMesh = new THREE.Mesh(new THREE.PlaneGeometry(W, L), wallMat);
  ceilingMesh.position.set(0, H, 0);
  ceilingMesh.rotation.x = Math.PI * 0.5;
  arenaGroup.add(ceilingMesh);

  // 5. Blue (-Z) & Orange (+Z) Goal Structures & Backboards
  [
    { team: 'blue', zSign: -1, color: '#0088ff', rim: '#66e0ff' },
    { team: 'orange', zSign: 1, color: '#ff6a00', rim: '#ffdd55' }
  ].forEach((g) => {
    const zLine = g.zSign * (L * 0.5);
    const frameMat = createCelMaterial({
      baseColor: g.color,
      rimColor: g.rim,
      steps: 4.0,
      emissiveStrength: 0.35
    });

    // Left & Right Goal Posts
    [-GW * 0.5, GW * 0.5].forEach((px) => {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, GH, 14), frameMat);
      post.position.set(px, GH * 0.5, zLine);
      attachInkOutline(post, 0.08);
      arenaGroup.add(post);
    });

    // Crossbar
    const crossbar = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.68, GW + 1.2, 14), frameMat);
    crossbar.rotation.z = Math.PI * 0.5;
    crossbar.position.set(0, GH, zLine);
    attachInkOutline(crossbar, 0.08);
    arenaGroup.add(crossbar);

    if (!modeConfig.dropshot && !modeConfig.hoops) {
      // Recessed Goal Box Interior
      const netMat = createGoalNetMaterial(g.color);
      const backNet = new THREE.Mesh(new THREE.PlaneGeometry(GW, GH), netMat);
      backNet.position.set(0, GH * 0.5, zLine + g.zSign * GD);
      arenaGroup.add(backNet);

      const topNet = new THREE.Mesh(new THREE.PlaneGeometry(GW, GD), netMat);
      topNet.rotation.x = Math.PI * 0.5;
      topNet.position.set(0, GH, zLine + g.zSign * (GD * 0.5));
      arenaGroup.add(topNet);

      [-GW * 0.5, GW * 0.5].forEach((sx) => {
        const sideNet = new THREE.Mesh(new THREE.PlaneGeometry(GD, GH), netMat);
        sideNet.rotation.y = Math.PI * 0.5;
        sideNet.position.set(sx, GH * 0.5, zLine + g.zSign * (GD * 0.5));
        arenaGroup.add(sideNet);
      });
    }

    // Hoops Mode Elevated Basketball Dunk Rims
    if (modeConfig.hoops) {
      const hoopZ = g.zSign * 38;
      const hoopRadius = 6.8;
      const hoopY = 6.2;
      const rimTorus = new THREE.Mesh(
        new THREE.TorusGeometry(hoopRadius, 0.45, 14, 32),
        frameMat
      );
      rimTorus.rotation.x = Math.PI * 0.5;
      rimTorus.position.set(0, hoopY, hoopZ);
      attachInkOutline(rimTorus, 0.07);
      arenaGroup.add(rimTorus);

      // Glowing Backboard
      const backboard = new THREE.Mesh(
        new THREE.BoxGeometry(16, 9, 0.6),
        createGoalNetMaterial(g.color)
      );
      backboard.position.set(0, hoopY + 4.2, hoopZ + g.zSign * hoopRadius);
      arenaGroup.add(backboard);
    }
  });

  // 6. 24 Boost Pads (6 Full 100-Boost Orbs + 18 Small 12-Boost Pads)
  const boostPadVisuals = [];
  const basePadMat = createCelMaterial({ baseColor: '#25324a', rimColor: '#88aacc', steps: 3.0 });
  const orbMat = new THREE.MeshBasicMaterial({ color: '#ffbb00' });
  const smallCrystalMat = new THREE.MeshBasicMaterial({ color: '#ffdd44' });

  BOOST_PAD_LAYOUT.forEach((pad, idx) => {
    const padGroup = new THREE.Group();
    padGroup.position.set(pad.x, 0.08, pad.z);

    const baseRadius = pad.full ? 2.1 : 1.25;
    const basePlate = new THREE.Mesh(
      new THREE.CylinderGeometry(baseRadius, baseRadius * 1.15, 0.18, 16),
      basePadMat
    );
    attachInkOutline(basePlate, 0.04);
    padGroup.add(basePlate);

    // Cooldown ring indicator
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(baseRadius * 0.72, baseRadius * 0.92, 24),
      new THREE.MeshBasicMaterial({ color: '#ffaa00', side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI * 0.5;
    ring.position.y = 0.12;
    padGroup.add(ring);

    // Floating energy orb or diamond crystal
    let emitter;
    if (pad.full) {
      emitter = new THREE.Mesh(new THREE.OctahedronGeometry(1.15, 1), orbMat);
      emitter.position.y = 1.65;
      attachInkOutline(emitter, 0.06, '#ff5500');
    } else {
      emitter = new THREE.Mesh(new THREE.OctahedronGeometry(0.55, 0), smallCrystalMat);
      emitter.position.y = 0.85;
      attachInkOutline(emitter, 0.04, '#ff7700');
    }
    padGroup.add(emitter);
    arenaGroup.add(padGroup);

    boostPadVisuals.push({
      id: idx,
      x: pad.x,
      z: pad.z,
      full: pad.full,
      active: true,
      cooldown: 0,
      maxCooldown: pad.full ? 10.0 : 4.0,
      emitter,
      ring
    });
  });

  // 7. Overhead Center Jumbotron & 4 Corner Floodlight Towers
  const jumboGroup = new THREE.Group();
  jumboGroup.position.set(0, H - 2.5, 0);
  const jumboBox = new THREE.Mesh(
    new THREE.BoxGeometry(14, 4.5, 14),
    createCelMaterial({ baseColor: '#121828', rimColor: '#00e5ff', steps: 3.0 })
  );
  attachInkOutline(jumboBox, 0.08);
  jumboGroup.add(jumboBox);
  arenaGroup.add(jumboGroup);

  // 8. Instanced Animated Stadium Crowd in Grandstands (320 spectators!)
  const crowdCount = 320;
  const specGeo = new THREE.CapsuleGeometry(0.45, 0.9, 4, 8);
  const specMat = new THREE.MeshBasicMaterial({ color: '#ffffff' });
  const crowdInstanced = new THREE.InstancedMesh(specGeo, specMat, crowdCount);
  const dummy = new THREE.Object3D();
  const crowdData = [];

  for (let i = 0; i < crowdCount; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const tier = Math.floor(i / 80);
    const xPos = side * (W * 0.5 + 8 + tier * 4.5);
    const yPos = 6 + tier * 3.8;
    const zPos = ((i % 80) / 80 - 0.5) * (L * 0.9);

    dummy.position.set(xPos, yPos, zPos);
    dummy.lookAt(0, 2, zPos * 0.5);
    dummy.updateMatrix();
    crowdInstanced.setMatrixAt(i, dummy.matrix);

    const isBlueFan = zPos < 0 || (Math.abs(zPos) < 15 && i % 3 === 0);
    crowdInstanced.setColorAt(
      i,
      new THREE.Color(isBlueFan ? '#00aaff' : '#ff7700').offsetHSL(0, 0, (Math.random() - 0.5) * 0.15)
    );
    crowdData.push({ x: xPos, y: yPos, z: zPos, phase: Math.random() * Math.PI * 2 });
  }
  arenaGroup.add(crowdInstanced);

  scene.add(arenaGroup);

  return {
    arenaGroup,
    boostPadVisuals,
    dropshotTiles,
    crowdInstanced,
    crowdData,
    jumboGroup
  };
}

/**
 * Manages Cel-Shaded Particle Puffs, Boost Trails, Impact Rings & Goal Explosions.
 */
class VFXManager {
  constructor(scene) {
    this.scene = scene;
    this.particles = [];
    this.poolGroup = new THREE.Group();
    this.poolGroup.name = 'VFXPool';
    this.scene.add(this.poolGroup);

    const sphereGeo = new THREE.IcosahedronGeometry(0.42, 1);
    const ringGeo = new THREE.RingGeometry(0.65, 1.0, 20);

    for (let i = 0; i < 140; i++) {
      const isRing = i >= 115;
      const mat = new THREE.MeshBasicMaterial({
        color: '#ffaa00',
        transparent: true,
        opacity: 0.9,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(isRing ? ringGeo : sphereGeo, mat);
      mesh.visible = false;
      this.poolGroup.add(mesh);
      this.particles.push({
        mesh,
        mat,
        isRing,
        active: false,
        life: 0,
        maxLife: 1,
        vx: 0,
        vy: 0,
        vz: 0,
        scaleStart: 1,
        scaleEnd: 0.1
      });
    }
  }

  spawnBoostPuff(pos, backwardDir, primaryHex = '#ffaa00', secondaryHex = '#ff3300') {
    const p = this._acquire(false);
    if (!p) return;
    p.active = true;
    p.life = 0;
    p.maxLife = 0.32;
    p.mesh.position.copy(pos).addScaledVector(backwardDir, 2.1);
    p.mesh.position.y += (Math.random() - 0.5) * 0.25;
    p.vx = backwardDir.x * 12 + (Math.random() - 0.5) * 3;
    p.vy = backwardDir.y * 12 + 1.5 + Math.random() * 2;
    p.vz = backwardDir.z * 12 + (Math.random() - 0.5) * 3;
    p.scaleStart = 0.75;
    p.scaleEnd = 0.08;
    p.mat.color.set(Math.random() > 0.4 ? primaryHex : secondaryHex);
    p.mesh.visible = true;
  }

  spawnImpactBurst(pos, hexColor = '#00e5ff', count = 12) {
    // Spawn shockwave ring
    const ring = this._acquire(true);
    if (ring) {
      ring.active = true;
      ring.life = 0;
      ring.maxLife = 0.45;
      ring.mesh.position.copy(pos);
      ring.mesh.lookAt(pos.x + 1, pos.y + 1, pos.z);
      ring.vx = 0;
      ring.vy = 0;
      ring.vz = 0;
      ring.scaleStart = 0.6;
      ring.scaleEnd = 5.5;
      ring.mat.color.set(hexColor);
      ring.mesh.visible = true;
    }

    // Spawn cel-shaded puff sparks
    for (let i = 0; i < count; i++) {
      const p = this._acquire(false);
      if (!p) break;
      p.active = true;
      p.life = 0;
      p.maxLife = 0.4 + Math.random() * 0.35;
      p.mesh.position.copy(pos);
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI;
      const spd = 8 + Math.random() * 18;
      p.vx = Math.sin(phi) * Math.cos(theta) * spd;
      p.vy = Math.cos(phi) * spd + 4;
      p.vz = Math.sin(phi) * Math.sin(theta) * spd;
      p.scaleStart = 0.9;
      p.scaleEnd = 0.05;
      p.mat.color.set(i % 2 === 0 ? hexColor : '#ffffff');
      p.mesh.visible = true;
    }
  }

  spawnGoalExplosion(pos, teamColor = '#0088ff', style = 'comic_boom') {
    const palette =
      style === 'neon_party'
        ? ['#ff00aa', '#00ffcc', '#ffee00', '#0088ff']
        : style === 'supernova'
        ? ['#7700ff', '#00e5ff', '#ffffff', teamColor]
        : [teamColor, '#ffbb00', '#ffffff', '#ff2244'];

    // Multiple shockwave rings
    for (let r = 0; r < 5; r++) {
      const ring = this._acquire(true);
      if (!ring) break;
      ring.active = true;
      ring.life = -r * 0.07;
      ring.maxLife = 0.85;
      ring.mesh.position.copy(pos);
      ring.mesh.rotation.set(Math.random() * 3, Math.random() * 3, 0);
      ring.vx = 0;
      ring.vy = 0;
      ring.vz = 0;
      ring.scaleStart = 1.0;
      ring.scaleEnd = 18.0 + r * 3;
      ring.mat.color.set(palette[r % palette.length]);
      ring.mesh.visible = true;
    }

    // Massive burst of cel spheres
    for (let i = 0; i < 48; i++) {
      const p = this._acquire(false);
      if (!p) break;
      p.active = true;
      p.life = 0;
      p.maxLife = 0.8 + Math.random() * 0.7;
      p.mesh.position.copy(pos);
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI;
      const spd = 14 + Math.random() * 36;
      p.vx = Math.sin(phi) * Math.cos(theta) * spd;
      p.vy = Math.abs(Math.cos(phi)) * spd + 5;
      p.vz = Math.sin(phi) * Math.sin(theta) * spd;
      p.scaleStart = 1.8 + Math.random() * 1.2;
      p.scaleEnd = 0.1;
      p.mat.color.set(palette[i % palette.length]);
      p.mesh.visible = true;
    }
  }

  _acquire(wantRing = false) {
    for (const p of this.particles) {
      if (p.isRing === wantRing && !p.active) return p;
    }
    return null;
  }

  update(dt) {
    for (const p of this.particles) {
      if (!p.active) continue;
      p.life += dt;
      if (p.life < 0) continue;
      if (p.life >= p.maxLife) {
        p.active = false;
        p.mesh.visible = false;
        continue;
      }
      const t = p.life / p.maxLife;
      p.mesh.position.x += p.vx * dt;
      p.mesh.position.y += p.vy * dt;
      p.mesh.position.z += p.vz * dt;
      if (!p.isRing) {
        p.vy -= 18 * dt;
      }
      const s = p.scaleStart + (p.scaleEnd - p.scaleStart) * t;
      p.mesh.scale.setScalar(Math.max(0.01, s));
      p.mat.opacity = (1.0 - t) * 0.9;
    }
  }
}
