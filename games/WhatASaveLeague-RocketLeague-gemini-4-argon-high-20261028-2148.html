let rapierInitialized = false;
async function initRapierEngine() {
  if (!rapierInitialized) {
    await RAPIER.init();
    rapierInitialized = true;
  }
  return RAPIER;
}
class PhysicsArenaWorld {
  constructor(audio, vfx, onGameEvent) {
    this.audio = audio;
    this.vfx = vfx;
    this.onGameEvent = onGameEvent; // callback(type, payload)

    this.world = null;
    this.ballBody = null;
    this.ballCollider = null;

    this.mutators = {
      gravity: -26.0,
      ballSizeMult: 1.0,
      ballBounciness: 0.84,
      ballMaxSpeed: 68.0,
      boostMult: 1.0,
      unlimitedBoost: false,
      ballShape: 'sphere', // 'sphere' | 'puck' | 'cube'
      demoOnContact: false
    };

    this.modeConfig = {
      id: 'soccar',
      rumble: false,
      hoops: false,
      dropshot: false,
      puck: false,
      gauntlet: false
    };

    this.ballState = {
      pos: new THREE.Vector3(0, ARENA.ballRadius + 0.5, 0),
      vel: new THREE.Vector3(0, 0, 0),
      angVel: new THREE.Vector3(0, 0, 0),
      quat: new THREE.Quaternion(),
      radius: ARENA.ballRadius,
      lastTeamTouch: null, // 'blue' | 'orange'
      lastPlayerTouch: null,
      assistPlayerTouch: null,
      shotOnGoalTeam: null, // which team's goal the ball is currently threatening
      shotCheckedForSave: false,
      frozenTimer: 0,
      frozenVelBackup: new THREE.Vector3(),
      firstTouchAwarded: false
    };

    this.cars = [];
    this.boostPads = [];
    this.dropshotTiles = [];
    this.activeTethers = []; // Visual lines for Grapple / Plunger / Magnet / Haymaker
    this.gauntletCannonTimer = 3.0;
  }

  buildWorld(modeConfig = {}, mutators = {}, boostPadVisuals = [], dropshotTiles = []) {
    this.modeConfig = { ...this.modeConfig, ...modeConfig };
    this.mutators = { ...this.mutators, ...mutators };
    this.boostPads = boostPadVisuals;
    this.dropshotTiles = dropshotTiles;

    if (this.modeConfig.puck) {
      this.mutators.ballShape = 'puck';
    }

    const gY = this.mutators.gravity;
    this.world = new RAPIER.World({ x: 0.0, y: gY, z: 0.0 });

    const W = ARENA.width;
    const L = ARENA.length;
    const H = ARENA.height;
    const GW = ARENA.goalWidth;
    const GH = ARENA.goalHeight;
    const GD = ARENA.goalDepth;

    // 1. Static Arena Colliders in Rapier 0.19.3
    const fixedBody = this.world.createRigidBody(RAPIER.RigidBodyDesc.fixed());

    // Floor slab (unless Dropshot pit opens)
    this.world.createCollider(
      RAPIER.ColliderDesc.cuboid(W * 0.5 + 10, 1.0, L * 0.5 + 15)
        .setTranslation(0, -1.0, 0)
        .setRestitution(0.75)
        .setFriction(0.4),
      fixedBody
    );

    // Ceiling slab
    this.world.createCollider(
      RAPIER.ColliderDesc.cuboid(W * 0.5 + 10, 1.0, L * 0.5 + 15)
        .setTranslation(0, H + 1.0, 0)
        .setRestitution(0.75)
        .setFriction(0.2),
      fixedBody
    );

    // Left & Right Side Walls
    [-1, 1].forEach((sx) => {
      this.world.createCollider(
        RAPIER.ColliderDesc.cuboid(1.0, H * 0.5, L * 0.5 + 5)
          .setTranslation(sx * (W * 0.5 + 1.0), H * 0.5, 0)
          .setRestitution(0.82)
          .setFriction(0.15),
        fixedBody
      );

      // 45-degree Floor-to-Wall Curved Ramp Colliders
      const f = ARENA.wallFillet;
      const qRot = new THREE.Quaternion().setFromAxisAngle(
        new THREE.Vector3(0, 0, 1),
        sx * (Math.PI * 0.25)
      );
      this.world.createCollider(
        RAPIER.ColliderDesc.cuboid(f * 0.72, 0.35, L * 0.5 - 6)
          .setTranslation(sx * (W * 0.5 - f * 0.48), f * 0.48, 0)
          .setRotation({ x: qRot.x, y: qRot.y, z: qRot.z, w: qRot.w })
          .setRestitution(0.82)
          .setFriction(0.1),
        fixedBody
      );
    });

    // 45-Degree Corner Walls
    const cb = ARENA.cornerBevel;
    [
      { x: -W * 0.5 + cb * 0.5, z: -L * 0.5 + cb * 0.5, ang:  Math.PI * 0.25 },
      { x:  W * 0.5 - cb * 0.5, z: -L * 0.5 + cb * 0.5, ang: -Math.PI * 0.25 },
      { x: -W * 0.5 + cb * 0.5, z:  L * 0.5 - cb * 0.5, ang: -Math.PI * 0.25 },
      { x:  W * 0.5 - cb * 0.5, z:  L * 0.5 - cb * 0.5, ang:  Math.PI * 0.25 }
    ].forEach((c) => {
      const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), c.ang);
      this.world.createCollider(
        RAPIER.ColliderDesc.cuboid(cb * 0.75, H * 0.5, 0.8)
          .setTranslation(c.x, H * 0.5, c.z)
          .setRotation({ x: q.x, y: q.y, z: q.z, w: q.w })
          .setRestitution(0.82)
          .setFriction(0.1),
        fixedBody
      );
    });

    // Back Walls (-Z and +Z) with Goal Cutouts in Soccar/Rumble/SnowDay/Gauntlet
    [-1, 1].forEach((sz) => {
      const zWall = sz * (L * 0.5 + 1.0);
      if (this.modeConfig.dropshot || this.modeConfig.hoops) {
        // Solid back wall when goals are Hoops or Dropshot floor tiles
        this.world.createCollider(
          RAPIER.ColliderDesc.cuboid(W * 0.5, H * 0.5, 1.0)
            .setTranslation(0, H * 0.5, zWall)
            .setRestitution(0.82)
            .setFriction(0.15),
          fixedBody
        );
      } else {
        // Left & Right Wall Segments beside Goal Mouth
        const sideSegW = (W - GW) * 0.25;
        const sideCenterX = GW * 0.5 + sideSegW;
        [-1, 1].forEach((sx) => {
          this.world.createCollider(
            RAPIER.ColliderDesc.cuboid(sideSegW, H * 0.5, 1.0)
              .setTranslation(sx * sideCenterX, H * 0.5, zWall)
              .setRestitution(0.82)
              .setFriction(0.15),
            fixedBody
          );
        });
        // Upper Wall Segment above Goal Crossbar
        const topSegH = (H - GH) * 0.5;
        this.world.createCollider(
          RAPIER.ColliderDesc.cuboid(GW * 0.5, topSegH, 1.0)
            .setTranslation(0, GH + topSegH, zWall)
            .setRestitution(0.82)
            .setFriction(0.15),
          fixedBody
        );
        // Goal Back Net & Side Walls inside recessed Goal
        this.world.createCollider(
          RAPIER.ColliderDesc.cuboid(GW * 0.5, GH * 0.5, 0.8)
            .setTranslation(0, GH * 0.5, sz * (L * 0.5 + GD))
            .setRestitution(0.5),
          fixedBody
        );
      }
    });

    // 2. Dynamic Ball RigidBody in Rapier 0.19.3
    const radius = ARENA.ballRadius * this.mutators.ballSizeMult;
    this.ballState.radius = radius;

    const ballBodyDesc = RAPIER.RigidBodyDesc.dynamic()
      .setTranslation(0, radius + 0.6, 0)
      .setLinearDamping(this.modeConfig.puck ? 0.18 : 0.24)
      .setAngularDamping(0.28)
      .setCcdEnabled(true);

    this.ballBody = this.world.createRigidBody(ballBodyDesc);

    let ballColliderDesc;
    if (this.mutators.ballShape === 'puck') {
      ballColliderDesc = RAPIER.ColliderDesc.cylinder(radius * 0.36, radius * 1.15)
        .setRestitution(0.65)
        .setFriction(0.08)
        .setMass(1.6);
    } else if (this.mutators.ballShape === 'cube') {
      ballColliderDesc = RAPIER.ColliderDesc.cuboid(radius * 0.78, radius * 0.78, radius * 0.78)
        .setRestitution(0.76)
        .setFriction(0.35)
        .setMass(1.2);
    } else {
      ballColliderDesc = RAPIER.ColliderDesc.ball(radius)
        .setRestitution(this.mutators.ballBounciness)
        .setFriction(0.32)
        .setMass(1.0);
    }

    this.ballCollider = this.world.createCollider(ballColliderDesc, this.ballBody);
  }

  /**
   * Registers a Battle-Car entity into the physics world.
   */
  createCarEntity({
    id,
    name,
    team, // 'blue' | 'orange'
    isBot = false,
    localPlayerIndex = -1,
    bodyId = 'octane_x',
    customization = {},
    mesh
  }) {
    const bodyPreset = CAR_BODIES.find((b) => b.id === bodyId) || CAR_BODIES[0];

    // Kinematic velocity-based body in Rapier so it participates in Rapier queries
    const rbDesc = RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(0, 1.0, 0);
    const rapierBody = this.world
      ? this.world.createRigidBody(rbDesc)
      : null;
    if (this.world && rapierBody) {
      this.world.createCollider(
        RAPIER.ColliderDesc.cuboid(bodyPreset.width * 0.5, bodyPreset.height * 0.5, bodyPreset.length * 0.5)
          .setRestitution(0.4),
        rapierBody
      );
    }

    const car = {
      id,
      name,
      team,
      isBot,
      localPlayerIndex,
      bodyPreset,
      customization,
      mesh,
      rapierBody,

      // Transform & Kinematics
      pos: new THREE.Vector3(0, 0.55, 0),
      vel: new THREE.Vector3(0, 0, 0),
      quat: new THREE.Quaternion(),
      forward: new THREE.Vector3(0, 0, 1),
      right: new THREE.Vector3(1, 0, 0),
      up: new THREE.Vector3(0, 1, 0),
      surfaceNormal: new THREE.Vector3(0, 1, 0),

      yaw: 0,
      pitch: 0,
      roll: 0,
      angVel: new THREE.Vector3(0, 0, 0),

      // Driving & Aerial State
      grounded: true,
      onWallOrCeiling: false,
      boost: 33.3,
      isBoosting: false,
      isDrifting: false,
      isSupersonic: false,
      hasFlip: true,
      airTime: 0,
      flipTimer: 0,
      flipAxis: new THREE.Vector3(1, 0, 0),
      wheelSpinAngle: 0,
      steerVisual: 0,

      // Demolition & Respawn
      demolished: false,
      respawnTimer: 0,

      // Camera State (per car for split-screen!)
      ballCam: true,
      camPos: new THREE.Vector3(0, 5, -12),
      camLookAt: new THREE.Vector3(0, 2, 0),

      // Rumble Power-Up State
      powerup: null,
      powerupTimer: 4.5,
      activeEffect: null,
      activeEffectTimer: 0,

      // Match Scoreboard Stats
      stats: {
        score: 0,
        goals: 0,
        assists: 0,
        saves: 0,
        shots: 0,
        demos: 0
      },

      // Latest input command
      input: {
        throttle: 0,
        steer: 0,
        pitch: 0,
        yaw: 0,
        airRoll: 0,
        camYaw: 0,
        camPitch: 0,
        jump: false,
        jumpJustPressed: false,
        boost: false,
        drift: false,
        ballCamJustPressed: false,
        powerupJustPressed: false,
        resetShotJustPressed: false
      },

      lastBallHitTime: -10
    };

    this.cars.push(car);
    return car;
  }

  /**
   * Resets ball and all cars to kickoff formation.
   */
  resetKickoff(randomOffset = 0) {
    const r = this.ballState.radius;
    const startY = this.modeConfig.hoops ? r + 4.5 : r + 0.4;
    this.ballState.pos.set(0, startY, 0);
    this.ballState.vel.set(0, this.modeConfig.hoops ? 8.0 : 0, 0);
    this.ballState.angVel.set(0, 0, 0);
    this.ballState.lastTeamTouch = null;
    this.ballState.lastPlayerTouch = null;
    this.ballState.assistPlayerTouch = null;
    this.ballState.shotOnGoalTeam = null;
    this.ballState.shotCheckedForSave = false;
    this.ballState.frozenTimer = 0;
    this.ballState.firstTouchAwarded = false;

    if (this.ballBody) {
      this.ballBody.setTranslation({ x: 0, y: startY, z: 0 }, true);
      this.ballBody.setLinvel({ x: 0, y: this.modeConfig.hoops ? 8.0 : 0, z: 0 }, true);
      this.ballBody.setAngvel({ x: 0, y: 0, z: 0 }, true);
    }

    // Reset boost pads
    for (const pad of this.boostPads) {
      pad.active = true;
      pad.cooldown = 0;
      if (pad.emitter) pad.emitter.visible = true;
    }

    // Position Blue & Orange cars
    let blueIdx = 0;
    let orangeIdx = 0;
    for (const car of this.cars) {
      const spawns = car.team === 'blue' ? KICKOFF_SPAWNS.blue : KICKOFF_SPAWNS.orange;
      const idx = (car.team === 'blue' ? blueIdx++ : orangeIdx++) + randomOffset;
      const sp = spawns[idx % spawns.length];

      car.pos.set(sp.x, 0.55, sp.z);
      car.vel.set(0, 0, 0);
      car.angVel.set(0, 0, 0);
      car.yaw = sp.yaw;
      car.pitch = 0;
      car.roll = 0;
      car.quat.setFromEuler(new THREE.Euler(0, car.yaw, 0, 'YXZ'));
      car.surfaceNormal.set(0, 1, 0);
      car.grounded = true;
      car.onWallOrCeiling = false;
      car.hasFlip = true;
      car.flipTimer = 0;
      car.airTime = 0;
      car.demolished = false;
      car.respawnTimer = 0;
      car.isBoosting = false;
      car.isSupersonic = false;
      car.boost = this.mutators.unlimitedBoost || this.modeConfig.unlimitedBoost ? 100 : 33.3;
      car.activeEffect = null;
      car.activeEffectTimer = 0;
      if (car.mesh) {
        car.mesh.visible = true;
        car.mesh.position.copy(car.pos);
        car.mesh.quaternion.copy(car.quat);
      }
    }
  }

  /**
   * Launches a training / What-A-Save Gauntlet cannon shot toward the Blue Goal!
   */
  fireGauntletShot(difficulty = 1.0) {
    const startX = (Math.random() - 0.5) * 44;
    const startY = 3.5 + Math.random() * 8.0;
    const startZ = 10 + Math.random() * 24;

    const targetX = (Math.random() - 0.5) * (ARENA.goalWidth * 0.78);
    const targetY = 1.8 + Math.random() * (ARENA.goalHeight * 0.72);
    const targetZ = -ARENA.length * 0.5 - 2;

    const dir = new THREE.Vector3(targetX - startX, targetY - startY + 6.5, targetZ - startZ).normalize();
    const speed = (36 + Math.random() * 16) * difficulty;

    this.ballState.pos.set(startX, startY, startZ);
    this.ballState.vel.copy(dir).multiplyScalar(speed);
    this.ballState.lastTeamTouch = 'orange';
    this.ballState.shotOnGoalTeam = 'blue';
    this.ballState.shotCheckedForSave = false;

    if (this.ballBody) {
      this.ballBody.setTranslation({ x: startX, y: startY, z: startZ }, true);
      this.ballBody.setLinvel({ x: this.ballState.vel.x, y: this.ballState.vel.y, z: this.ballState.vel.z }, true);
    }

    if (this.vfx) {
      this.vfx.spawnImpactBurst(this.ballState.pos, '#ff5500', 14);
    }
    if (this.audio) {
      this.audio.playBallHit(0.95);
    }
  }

  /**
   * Steps Rapier 0.19.3 physics, car simulation, collisions, boost pads, and scoring.
   */
  step(dt, canMoveCars = true) {
    if (!this.world || dt <= 0) return null;
    const clampedDt = Math.min(dt, 0.033);
    this.activeTethers.length = 0;

    // 1. Update Cars
    for (const car of this.cars) {
      this._updateCarPhysics(car, clampedDt, canMoveCars);
    }

    // 2. Car-to-Car Collisions & Supersonic Demolitions
    this._resolveCarToCarCollisions();

    // 3. Step Rapier 0.19.3 World & Update Ball State
    this._updateBallPhysics(clampedDt, canMoveCars);

    // 4. Car-to-Ball Collisions (Rocket League Power-Shots, Aerials, Saves & Flip Resets!)
    this._resolveCarToBallCollisions();

    // 5. Update Boost Pads & Dropshot Tiles
    this._updateBoostPads(clampedDt);
    if (this.modeConfig.dropshot) {
      this._updateDropshotTiles(clampedDt);
    }

    // 6. What-A-Save! Gauntlet Cannon Mode
    if (this.modeConfig.gauntlet && canMoveCars) {
      this.gauntletCannonTimer -= clampedDt;
      if (this.gauntletCannonTimer <= 0) {
        this.gauntletCannonTimer = 4.8;
        this.fireGauntletShot(1.05);
      }
    }

    // 7. Check Goal Scoring Conditions
    return this._checkGoalScored();
  }

  _updateCarPhysics(car, dt, canMove) {
    if (car.demolished) {
      car.respawnTimer -= dt;
      if (car.respawnTimer <= 0) {
        car.demolished = false;
        const zHome = car.team === 'blue' ? -44 : 44;
        const xHome = (Math.random() > 0.5 ? 1 : -1) * 18;
        car.pos.set(xHome, 0.6, zHome);
        car.vel.set(0, 0, 0);
        car.yaw = car.team === 'blue' ? 0 : Math.PI;
        car.pitch = 0;
        car.roll = 0;
        car.boost = Math.max(car.boost, 33.3);
        if (car.mesh) car.mesh.visible = true;
        if (this.vfx) this.vfx.spawnImpactBurst(car.pos, '#00ffcc', 10);
      }
      return;
    }

    const inp = car.input;
    if (inp.ballCamJustPressed) {
      car.ballCam = !car.ballCam;
    }

    // Free Play / Training Shot Reset hotkey
    if (inp.resetShotJustPressed && (this.modeConfig.id === 'freeplay' || this.modeConfig.gauntlet)) {
      this.fireGauntletShot(0.95);
    }

    // Rumble Power-Up Cooldown & Activation
    if (this.modeConfig.rumble && canMove) {
      if (!car.powerup && !car.activeEffect) {
        car.powerupTimer -= dt;
        if (car.powerupTimer <= 0) {
          car.powerup = RUMBLE_POWERUPS[Math.floor(Math.random() * RUMBLE_POWERUPS.length)];
          car.powerupTimer = 7.5;
        }
      }
      if (inp.powerupJustPressed && car.powerup) {
        this._activateRumblePowerup(car);
      }
      if (car.activeEffect) {
        this._updateActiveRumbleEffect(car, dt);
      }
    }

    if (!canMove) {
      // During 3-2-1 countdown: rev engine & spin wheels in place
      car.isBoosting = false;
      this._syncCarVisuals(car, dt);
      return;
    }

    const maxNormalSpeed = 28.5 * car.bodyPreset.speedMult;
    const maxBoostSpeed = 42.0 * car.bodyPreset.speedMult;
    const supersonicThreshold = 36.5;

    // Recompute basis vectors from current orientation
    car.forward.set(0, 0, 1).applyQuaternion(car.quat).normalize();
    car.right.set(1, 0, 0).applyQuaternion(car.quat).normalize();
    car.up.set(0, 1, 0).applyQuaternion(car.quat).normalize();

    if (car.grounded) {
      car.airTime = 0;
      car.hasFlip = true;
      car.flipTimer = 0;

      // Steering (tighter turn radius when drifting / powersliding!)
      const speedAlongForward = car.vel.dot(car.forward);
      const speedMag = car.vel.length();
      car.isDrifting = inp.drift && speedMag > 4.0;

      const turnRate = (car.isDrifting ? 3.85 : 2.55) * car.bodyPreset.turnMult;
      const reverseSign = speedAlongForward < -1.0 ? -1 : 1;
      const steerFactor = Math.min(1.0, Math.max(0.28, speedMag / 10.0));
      car.yaw += inp.steer * turnRate * steerFactor * reverseSign * dt;

      // Rebuild ground orientation aligned with current surfaceNormal (floor, wall ramp, or wall)
      const qYaw = new THREE.Quaternion().setFromAxisAngle(car.surfaceNormal, car.yaw);
      const baseUp = new THREE.Vector3(0, 1, 0);
      const qAlign = new THREE.Quaternion().setFromUnitVectors(baseUp, car.surfaceNormal);
      car.quat.copy(qYaw).multiply(qAlign);
      car.forward.set(0, 0, 1).applyQuaternion(car.quat).normalize();
      car.right.set(1, 0, 0).applyQuaternion(car.quat).normalize();
      car.up.copy(car.surfaceNormal);

      // Throttle Acceleration
      if (Math.abs(inp.throttle) > 0.05) {
        const accel = inp.throttle > 0 ? 34.0 : 24.0;
        car.vel.addScaledVector(car.forward, inp.throttle * accel * dt);
      } else {
        // Coasting drag
        car.vel.multiplyScalar(Math.max(0, 1.0 - 2.2 * dt));
      }

      // Lateral tire grip (drifting allows smooth controlled slide + sparks!)
      const lateralSpeed = car.vel.dot(car.right);
      const grip = car.isDrifting ? 3.2 : 12.5;
      car.vel.addScaledVector(car.right, -lateralSpeed * Math.min(1.0, grip * dt));

      // Sticky downforce onto curved walls when moving fast
      if (car.onWallOrCeiling && speedMag > 11.0) {
        car.vel.addScaledVector(car.surfaceNormal, -18.0 * dt);
      }

      // First Jump off Ground / Wall
      if (inp.jumpJustPressed) {
        car.vel.addScaledVector(car.surfaceNormal, 13.8);
        car.grounded = false;
        car.onWallOrCeiling = false;
        car.airTime = 0.01;
        if (this.audio) this.audio.playJump(false);
        if (this.vfx) this.vfx.spawnImpactBurst(car.pos, '#ffffff', 6);
      }
    } else {
      // IN-AIR PHYSICS (Aerial Pitch/Yaw/Roll + Directional Dodge/Flip!)
      car.airTime += dt;
      car.isDrifting = false;

      // Gravity (reduced slightly during active dodge flip so cars dash horizontally like Rocket League!)
      const gravMult = car.flipTimer > 0 ? 0.25 : 1.0;
      car.vel.y += this.mutators.gravity * gravMult * dt;

      if (car.flipTimer > 0) {
        car.flipTimer -= dt;
      } else {
        // Aerial Pitch, Yaw, and Air Roll control
        const rotSpeed = 3.6;
        const dPitch = inp.pitch * rotSpeed * dt;
        const dYaw = inp.yaw * rotSpeed * dt;
        const dRoll = inp.airRoll * (rotSpeed * 1.35) * dt;

        const qDelta = new THREE.Quaternion().setFromEuler(new THREE.Euler(dPitch, dYaw, dRoll, 'YXZ'));
        car.quat.multiply(qDelta).normalize();

        // Subtle auto-leveling when player isn't touching air roll
        if (Math.abs(inp.airRoll) < 0.05 && Math.abs(inp.pitch) < 0.05) {
          const euler = new THREE.Euler().setFromQuaternion(car.quat, 'YXZ');
          euler.z *= Math.max(0, 1.0 - 2.5 * dt);
          car.quat.setFromEuler(euler);
        }
      }

      // Second Jump / Directional Dodge Flip in Mid-Air!
      if (inp.jumpJustPressed && car.hasFlip && car.airTime < 1.75) {
        car.hasFlip = false;
        const dodgeMag = Math.hypot(inp.steer, inp.pitch);

        if (dodgeMag > 0.24) {
          // Directional Dodge Flip!
          car.flipTimer = 0.48;
          // Flat horizontal forward & right directions for the dodge impulse
          const flatFwd = new THREE.Vector3(car.forward.x, 0, car.forward.z);
          if (flatFwd.lengthSq() < 0.01) flatFwd.set(0, 0, 1);
          flatFwd.normalize();
          const flatRight = new THREE.Vector3(flatFwd.z, 0, -flatFwd.x);

          const fwdDir = -inp.pitch; // Stick forward (-pitch) = Front flip
          const sideDir = -inp.steer;
          const dodgeVec = new THREE.Vector3()
            .addScaledVector(flatFwd, fwdDir)
            .addScaledVector(flatRight, sideDir)
            .normalize();

          car.vel.y = Math.max(car.vel.y * 0.25, 1.5);
          car.vel.addScaledVector(dodgeVec, 16.5);

          // Set 360-degree flip visual axis
          car.flipAxis.set(fwdDir, 0, sideDir).normalize();
          if (this.audio) this.audio.playJump(true);
          if (this.vfx) this.vfx.spawnImpactBurst(car.pos, car.customization.rimColor || '#00e5ff', 10);
        } else {
          // Neutral Double-Jump (vertical boost)
          car.vel.addScaledVector(car.up, 11.5);
          if (this.audio) this.audio.playJump(true);
          if (this.vfx) this.vfx.spawnImpactBurst(car.pos, '#ffffff', 8);
        }
      }
    }

    // ROCKET BOOST THRUST (Works both on ground and in full 3D Aerial flight!)
    const unlimited = this.mutators.unlimitedBoost || this.modeConfig.unlimitedBoost;
    if (inp.boost && (car.boost > 0 || unlimited)) {
      car.isBoosting = true;
      if (!unlimited) {
        car.boost = Math.max(0, car.boost - 30.0 * dt);
      }
      const boostAccel = 45.0 * this.mutators.boostMult;
      car.vel.addScaledVector(car.forward, boostAccel * dt);

      if (this.vfx && Math.random() < 0.65) {
        const backDir = car.forward.clone().negate();
        this.vfx.spawnBoostPuff(
          car.pos,
          backDir,
          car.customization.boostPrimary || '#ffaa00',
          car.customization.boostSecondary || '#ff3300'
        );
      }
    } else {
      car.isBoosting = false;
    }

    // Clamp max velocity & check Supersonic state
    const currentSpeed = car.vel.length();
    const wasSupersonic = car.isSupersonic;
    const allowedMax = car.isBoosting || car.flipTimer > 0 || currentSpeed > maxNormalSpeed + 2
      ? maxBoostSpeed
      : maxNormalSpeed;

    if (currentSpeed > allowedMax) {
      car.vel.multiplyScalar(allowedMax / currentSpeed);
    }

    car.isSupersonic = currentSpeed >= supersonicThreshold;
    if (car.isSupersonic && !wasSupersonic) {
      if (this.audio && car.localPlayerIndex >= 0) {
        this.audio.playSupersonicBoom();
      }
      if (this.vfx) {
        this.vfx.spawnImpactBurst(car.pos, '#ff00ff', 8);
      }
    }

    // Integrate Position & Arena Surface Constraints (Floor, Curved Ramps, Walls & Ceiling)
    car.pos.addScaledVector(car.vel, dt);
    this._constrainCarToArena(car);

    // Update Rapier kinematic body position
    if (car.rapierBody) {
      car.rapierBody.setNextKinematicTranslation({ x: car.pos.x, y: car.pos.y, z: car.pos.z });
      car.rapierBody.setNextKinematicRotation({
        x: car.quat.x,
        y: car.quat.y,
        z: car.quat.z,
        w: car.quat.w
      });
    }

    this._syncCarVisuals(car, dt);
  }

  _constrainCarToArena(car) {
    const halfW = ARENA.width * 0.5 - 1.35;
    const halfL = ARENA.length * 0.5 - 1.35;
    const maxH = ARENA.height - 1.1;
    const fillet = ARENA.wallFillet;

    // Compute floor height (including curved wall fillet ramp along X and Z edges!)
    const absX = Math.abs(car.pos.x);
    const absZ = Math.abs(car.pos.z);
    const inGoalMouthX = absX < ARENA.goalWidth * 0.5 - 1.1 && car.pos.y < ARENA.goalHeight - 0.8;

    let rampHeight = 0;
    let normal = new THREE.Vector3(0, 1, 0);
    let onRampOrWall = false;

    // Side wall curved ramp transition
    if (absX > halfW - fillet) {
      const t = Math.min(1, (absX - (halfW - fillet)) / fillet);
      rampHeight = Math.max(rampHeight, t * t * fillet * 0.85);
      normal.set(-Math.sign(car.pos.x) * t * 0.85, 1.0 - t * 0.45, 0).normalize();
      onRampOrWall = true;
    }

    // Back wall curved ramp transition (outside of goal mouth)
    if (!inGoalMouthX && absZ > halfL - fillet) {
      const tz = Math.min(1, (absZ - (halfL - fillet)) / fillet);
      const rz = tz * tz * fillet * 0.85;
      if (rz > rampHeight) {
        rampHeight = rz;
        normal.set(0, 1.0 - tz * 0.45, -Math.sign(car.pos.z) * tz * 0.85).normalize();
        onRampOrWall = true;
      }
    }

    const groundY = 0.55 + rampHeight;

    if (car.pos.y <= groundY) {
      car.pos.y = groundY;
      if (car.vel.y < 0) car.vel.y = 0;
      car.grounded = true;
      car.onWallOrCeiling = onRampOrWall;
      car.surfaceNormal.copy(normal);
      const euler = new THREE.Euler().setFromQuaternion(car.quat, 'YXZ');
      car.yaw = euler.y;
    } else {
      car.grounded = false;
      car.onWallOrCeiling = false;
      car.surfaceNormal.set(0, 1, 0);
    }

    // Ceiling clamp
    if (car.pos.y > maxH) {
      car.pos.y = maxH;
      if (car.vel.y > 0) car.vel.y = -car.vel.y * 0.3;
      // Touching ceiling with wheels grants a Ceiling Flip Reset!
      car.hasFlip = true;
    }

    // Side Wall Clamping
    if (Math.abs(car.pos.x) > halfW) {
      const sx = Math.sign(car.pos.x);
      car.pos.x = sx * halfW;
      // Convert horizontal X velocity into upward wall climb if approaching fast along the ramp!
      if (sx * car.vel.x > 0) {
        if (car.pos.y < fillet + 2.0 && Math.abs(car.vel.x) > 8.0) {
          car.vel.y = Math.max(car.vel.y, Math.abs(car.vel.x) * 0.72);
        }
        car.vel.x = -car.vel.x * 0.25;
      }
    }

    // Corner 45-degree bevel clamp
    const cornerLimit = halfW + halfL - ARENA.cornerBevel * 0.9;
    if (Math.abs(car.pos.x) + Math.abs(car.pos.z) > cornerLimit) {
      const excess = (Math.abs(car.pos.x) + Math.abs(car.pos.z) - cornerLimit) * 0.5;
      car.pos.x -= Math.sign(car.pos.x) * excess;
      car.pos.z -= Math.sign(car.pos.z) * excess;
    }

    // Back Wall & Goal Interior Clamping
    const maxZ = inGoalMouthX && !this.modeConfig.dropshot && !this.modeConfig.hoops
      ? halfL + ARENA.goalDepth - 1.2
      : halfL;

    if (Math.abs(car.pos.z) > maxZ) {
      const sz = Math.sign(car.pos.z);
      car.pos.z = sz * maxZ;
      if (sz * car.vel.z > 0) {
        car.vel.z = -car.vel.z * 0.25;
      }
    }
  }

  _syncCarVisuals(car, dt) {
    if (!car.mesh) return;
    car.mesh.position.copy(car.pos);
    car.mesh.quaternion.copy(car.quat);

    const ud = car.mesh.userData;
    if (!ud) return;

    // 360-degree Dodge Flip visual rotation on chassis
    if (car.flipTimer > 0) {
      const progress = 1.0 - car.flipTimer / 0.48;
      const angle = progress * Math.PI * 2.0;
      ud.chassis.quaternion.setFromAxisAngle(car.flipAxis, angle);
    } else {
      // Subtle pitch squat on boost/acceleration and roll lean on steering
      const pitchTilt = -car.input.throttle * 0.06 - (car.isBoosting ? 0.05 : 0);
      const rollTilt = car.input.steer * 0.08;
      ud.chassis.rotation.set(pitchTilt, 0, rollTilt);
    }

    // Spin & Steer all 4 wheels
    const fwdSpeed = car.vel.dot(car.forward);
    car.wheelSpinAngle += fwdSpeed * dt * 2.2;
    car.steerVisual += (car.input.steer * 0.42 - car.steerVisual) * Math.min(1, dt * 14);

    if (ud.wheels) {
      for (const w of ud.wheels) {
        if (w.front) {
          w.steerPivot.rotation.y = car.steerVisual;
        }
        w.spinGroup.rotation.x = car.wheelSpinAngle;
      }
    }

    // Rocket Boost Flame Cones
    if (ud.boostFlames) {
      for (const flame of ud.boostFlames) {
        flame.visible = car.isBoosting;
        if (car.isBoosting) {
          const flicker = 0.85 + Math.random() * 0.45;
          flame.scale.set(1.0, 1.0, flicker);
        }
      }
    }

    // Undercarriage Flip-Available Indicator Ring
    if (ud.flipRingMat) {
      ud.flipRingMat.color.set(car.hasFlip ? '#00ffcc' : '#ff4422');
      ud.flipRingMat.opacity = car.grounded ? 0.35 : car.hasFlip ? 0.85 : 0.25;
    }
  }

  _resolveCarToCarCollisions() {
    const n = this.cars.length;
    for (let i = 0; i < n; i++) {
      const a = this.cars[i];
      if (a.demolished) continue;
      for (let j = i + 1; j < n; j++) {
        const b = this.cars[j];
        if (b.demolished) continue;

        const diff = new THREE.Vector3().subVectors(b.pos, a.pos);
        const dist = diff.length();
        const minDist = 3.1;

        if (dist < minDist && dist > 0.001) {
          const normal = diff.divideScalar(dist);

          // Check for Supersonic Demolition!
          const aDemoB =
            (a.isSupersonic || this.mutators.demoOnContact) &&
            a.team !== b.team &&
            a.vel.dot(normal) > 18.0;
          const bDemoA =
            (b.isSupersonic || this.mutators.demoOnContact) &&
            b.team !== a.team &&
            -b.vel.dot(normal) > 18.0;

          if (aDemoB) {
            this._triggerDemolition(a, b);
            continue;
          }
          if (bDemoA) {
            this._triggerDemolition(b, a);
            continue;
          }

          // Standard car-to-car bump
          const overlap = (minDist - dist) * 0.5;
          a.pos.addScaledVector(normal, -overlap);
          b.pos.addScaledVector(normal, overlap);

          const relVel = new THREE.Vector3().subVectors(b.vel, a.vel);
          const sepSpeed = relVel.dot(normal);
          if (sepSpeed < 0) {
            const impulse = -(1.45) * sepSpeed * 0.5;
            a.vel.addScaledVector(normal, -impulse);
            b.vel.addScaledVector(normal, impulse);
            if (this.audio && Math.abs(sepSpeed) > 8) {
              this.audio.playBallHit(0.35);
            }
          }
        }
      }
    }
  }

  _triggerDemolition(attacker, victim) {
    victim.demolished = true;
    victim.respawnTimer = 3.0;
    if (victim.mesh) victim.mesh.visible = false;
    attacker.stats.demos += 1;
    attacker.stats.score += 35;

    if (this.vfx) {
      this.vfx.spawnGoalExplosion(victim.pos, '#ff3300', 'comic_boom');
    }
    if (this.audio) {
      this.audio.playDemolition();
      this.audio.announce('DEMOLITION!');
    }
    if (this.onGameEvent) {
      this.onGameEvent('demolition', { attacker, victim });
    }
  }

  _updateBallPhysics(dt, canMove) {
    if (!this.ballBody) return;

    // Cryo-Freeze Rumble Power-Up
    if (this.ballState.frozenTimer > 0) {
      this.ballState.frozenTimer -= dt;
      this.ballBody.setLinvel({ x: 0, y: 0, z: 0 }, true);
      this.ballBody.setAngvel({ x: 0, y: 0, z: 0 }, true);
      if (this.ballState.frozenTimer <= 0) {
        this.ballBody.setLinvel(
          {
            x: this.ballState.frozenVelBackup.x,
            y: this.ballState.frozenVelBackup.y,
            z: this.ballState.frozenVelBackup.z
          },
          true
        );
      }
    }

    if (canMove) {
      this.world.timestep = dt;
      this.world.step();
    }

    const t = this.ballBody.translation();
    const lv = this.ballBody.linvel();
    const av = this.ballBody.angvel();
    const rot = this.ballBody.rotation();

    this.ballState.pos.set(t.x, t.y, t.z);
    this.ballState.vel.set(lv.x, lv.y, lv.z);
    this.ballState.angVel.set(av.x, av.y, av.z);
    this.ballState.quat.set(rot.x, rot.y, rot.z, rot.w);

    // Clamp max ball speed
    const spd = this.ballState.vel.length();
    if (spd > this.mutators.ballMaxSpeed) {
      const s = this.mutators.ballMaxSpeed / spd;
      this.ballState.vel.multiplyScalar(s);
      this.ballBody.setLinvel(
        { x: this.ballState.vel.x, y: this.ballState.vel.y, z: this.ballState.vel.z },
        true
      );
    }

    // Check Goal Post / Crossbar metallic CLANG!
    const halfL = ARENA.length * 0.5;
    const halfGW = ARENA.goalWidth * 0.5;
    const r = this.ballState.radius;
    if (Math.abs(Math.abs(this.ballState.pos.z) - halfL) < r + 0.8) {
      const nearPost = Math.abs(Math.abs(this.ballState.pos.x) - halfGW) < r + 0.7 && this.ballState.pos.y < ARENA.goalHeight + r;
      const nearCrossbar = Math.abs(this.ballState.pos.y - ARENA.goalHeight) < r + 0.7 && Math.abs(this.ballState.pos.x) < halfGW + r;
      if ((nearPost || nearCrossbar) && spd > 14.0) {
        if (!this._postClangCooldown || performance.now() - this._postClangCooldown > 350) {
          this._postClangCooldown = performance.now();
          if (this.audio) this.audio.playPostClang();
          if (this.vfx) this.vfx.spawnImpactBurst(this.ballState.pos, '#ffee55', 14);
        }
      }
    }

    // Keep ball strictly inside arena safety bounds
    const maxW = ARENA.width * 0.5 - r;
    if (Math.abs(this.ballState.pos.x) > maxW) {
      this.ballState.pos.x = Math.sign(this.ballState.pos.x) * maxW;
      this.ballState.vel.x = -this.ballState.vel.x * 0.82;
      this.ballBody.setTranslation(this.ballState.pos, true);
      this.ballBody.setLinvel(this.ballState.vel, true);
    }
    if (this.ballState.pos.y < r) {
      this.ballState.pos.y = r;
      if (this.ballState.vel.y < 0) this.ballState.vel.y = -this.ballState.vel.y * 0.75;
      this.ballBody.setTranslation(this.ballState.pos, true);
      this.ballBody.setLinvel(this.ballState.vel, true);
    }
  }

  _resolveCarToBallCollisions() {
    const now = performance.now() * 0.001;
    const bPos = this.ballState.pos;
    const bRadius = this.ballState.radius;

    for (const car of this.cars) {
      if (car.demolished) continue;

      const diff = new THREE.Vector3().subVectors(bPos, car.pos);
      const dist = diff.length();
      const hitRadius = bRadius + 2.05;

      if (dist < hitRadius && dist > 0.001) {
        const normal = diff.clone().divideScalar(dist);

        // Push ball outside car hull so it never clips
        const penetration = hitRadius - dist;
        bPos.addScaledVector(normal, penetration + 0.05);

        // Check if this hit is a Mid-Air Flip Reset (ball touches underside of airborne car!)
        if (!car.grounded && normal.dot(car.up) < -0.45 && !car.hasFlip) {
          car.hasFlip = true;
          if (this.onGameEvent) {
            this.onGameEvent('medal', { car, title: 'FLIP RESET!', points: 40 });
          }
        }

        // Prevent multi-hit spam within 90ms
        if (now - car.lastBallHitTime < 0.09) continue;
        car.lastBallHitTime = now;

        // Break Cryo-Freeze if frozen
        this.ballState.frozenTimer = 0;

        // Calculate Rocket League Power-Shot Velocity Transfer!
        const carSpeed = car.vel.length();
        const relVel = new THREE.Vector3().subVectors(car.vel, this.ballState.vel);
        const approachSpeed = Math.max(0, relVel.dot(normal));

        // Blend contact normal with car's forward vector and upward arc lift
        const shotDir = normal
          .clone()
          .addScaledVector(car.forward, 0.42)
          .add(new THREE.Vector3(0, 0.22, 0))
          .normalize();

        const dodgeBonus = car.flipTimer > 0 ? 1.32 : 1.0;
        const basePower = Math.max(carSpeed * 1.22, approachSpeed * 1.15, 16.0);
        const finalShotSpeed = Math.min(
          this.mutators.ballMaxSpeed,
          basePower * dodgeBonus * car.bodyPreset.hitPowerMult
        );

        this.ballState.vel.copy(shotDir).multiplyScalar(finalShotSpeed);

        // Apply spin (Magnus visual spin)
        this.ballState.angVel.set(
          shotDir.z * 6.0,
          (Math.random() - 0.5) * 4.0,
          -shotDir.x * 6.0
        );

        if (this.ballBody) {
          this.ballBody.setTranslation({ x: bPos.x, y: bPos.y, z: bPos.z }, true);
          this.ballBody.setLinvel(
            { x: this.ballState.vel.x, y: this.ballState.vel.y, z: this.ballState.vel.z },
            true
          );
          this.ballBody.setAngvel(
            { x: this.ballState.angVel.x, y: this.ballState.angVel.y, z: this.ballState.angVel.z },
            true
          );
        }

        // Audio & VFX + Controller Haptics
        const impactStrength = Math.min(1.0, finalShotSpeed / 48.0);
        if (this.audio) this.audio.playBallHit(impactStrength);
        if (this.vfx) {
          const teamHex = car.team === 'blue' ? '#00d2ff' : '#ff7700';
          this.vfx.spawnImpactBurst(bPos, teamHex, Math.floor(8 + impactStrength * 12));
        }

        // Check Medals: First Touch, Aerial Hit, Shot on Goal, What A Save!
        this._evaluateTouchMedals(car, bPos, this.ballState.vel);
      }
    }
  }

  _evaluateTouchMedals(car, ballPos, ballVel) {
    // 1. First Touch of Kickoff
    if (!this.ballState.firstTouchAwarded) {
      this.ballState.firstTouchAwarded = true;
      car.stats.score += 20;
      if (this.onGameEvent) {
        this.onGameEvent('medal', { car, title: 'FIRST TOUCH!', points: 20 });
      }
    }

    // 2. Check if defender just made a WHAT A SAVE! / EPIC SAVE!
    const ownGoalZ = car.team === 'blue' ? -ARENA.length * 0.5 : ARENA.length * 0.5;
    const distToOwnGoal = Math.abs(ballPos.z - ownGoalZ);
    const movingAwayFromOwnGoal =
      (car.team === 'blue' && ballVel.z > 4.0) || (car.team === 'orange' && ballVel.z < -4.0);

    if (
      this.ballState.shotOnGoalTeam === car.team &&
      !this.ballState.shotCheckedForSave &&
      distToOwnGoal < 34.0 &&
      movingAwayFromOwnGoal
    ) {
      this.ballState.shotCheckedForSave = true;
      this.ballState.shotOnGoalTeam = null;
      const isEpic = distToOwnGoal < 14.5;
      car.stats.saves += 1;
      car.stats.score += isEpic ? 75 : 50;

      if (this.audio) {
        this.audio.playCrowdCheer();
        this.audio.announce(isEpic ? 'EPIC SAVE! WHAT A SAVE!' : 'WHAT A SAVE!', true);
      }
      if (this.onGameEvent) {
        this.onGameEvent('save', {
          car,
          isEpic,
          title: isEpic ? 'EPIC SAVE!' : 'WHAT A SAVE!',
          points: isEpic ? 75 : 50
        });
      }
    }

    // 3. Check if this touch is an Aerial Hit!
    if (!car.grounded && ballPos.y > 7.5) {
      car.stats.score += 45;
      if (this.audio) this.audio.announce('AERIAL HIT!');
      if (this.onGameEvent) {
        this.onGameEvent('medal', { car, title: 'AERIAL HIT!', points: 45 });
      }
    }

    // 4. Check if this hit is a Shot on the Opponent's Goal!
    const enemyTeam = car.team === 'blue' ? 'orange' : 'blue';
    const enemyGoalZ = enemyTeam === 'orange' ? ARENA.length * 0.5 : -ARENA.length * 0.5;
    const dz = enemyGoalZ - ballPos.z;
    if ((enemyTeam === 'orange' && ballVel.z > 14.0) || (enemyTeam === 'blue' && ballVel.z < -14.0)) {
      const timeToGoal = Math.abs(dz / ballVel.z);
      const projectedX = ballPos.x + ballVel.x * timeToGoal;
      if (timeToGoal < 2.6 && Math.abs(projectedX) < ARENA.goalWidth * 0.62) {
        this.ballState.shotOnGoalTeam = enemyTeam;
        this.ballState.shotCheckedForSave = false;
        car.stats.shots += 1;
        car.stats.score += 15;
        if (this.onGameEvent) {
          this.onGameEvent('medal', { car, title: 'SHOT ON GOAL!', points: 15 });
        }
      }
    }

    // Track touch history for Goal + Assist credit
    if (this.ballState.lastPlayerTouch && this.ballState.lastPlayerTouch !== car) {
      if (this.ballState.lastPlayerTouch.team === car.team) {
        this.ballState.assistPlayerTouch = this.ballState.lastPlayerTouch;
      } else {
        this.ballState.assistPlayerTouch = null;
      }
    }
    this.ballState.lastPlayerTouch = car;
    this.ballState.lastTeamTouch = car.team;
  }

  _activateRumblePowerup(car) {
    const p = car.powerup;
    car.powerup = null;
    if (!p) return;

    if (this.audio) this.audio.playPowerupActivate(p.id);
    const bPos = this.ballState.pos;

    if (p.id === 'haymaker') {
      // Giant boxing glove punch toward opponent goal!
      const targetZ = car.team === 'blue' ? ARENA.length * 0.5 : -ARENA.length * 0.5;
      const punchDir = new THREE.Vector3(0 - bPos.x * 0.3, 6.0, targetZ - bPos.z).normalize();
      this.ballState.vel.copy(punchDir).multiplyScalar(54.0);
      if (this.ballBody) {
        this.ballBody.setLinvel(this.ballState.vel, true);
      }
      this.activeTethers.push({ from: car.pos.clone(), to: bPos.clone(), color: '#ff3344' });
      this._evaluateTouchMedals(car, bPos, this.ballState.vel);
    } else if (p.id === 'freezer') {
      this.ballState.frozenVelBackup.copy(this.ballState.vel);
      this.ballState.frozenTimer = 2.6;
      if (this.vfx) this.vfx.spawnImpactBurst(bPos, '#66ffff', 16);
    } else if (p.id === 'disruptor') {
      car.boost = 100;
      for (const other of this.cars) {
        if (other.team !== car.team && !other.demolished) {
          other.vel.y += 14.0;
          other.vel.x += (Math.random() - 0.5) * 28.0;
        }
      }
      if (this.vfx) this.vfx.spawnImpactBurst(car.pos, '#ffee00', 18);
    } else {
      // Sustained tether effect: grapple, magnet, or plunger
      car.activeEffect = p.id;
      car.activeEffectTimer = p.id === 'magnet' ? 4.5 : 1.6;
    }
  }

  _updateActiveRumbleEffect(car, dt) {
    car.activeEffectTimer -= dt;
    const bPos = this.ballState.pos;
    const toBall = new THREE.Vector3().subVectors(bPos, car.pos);
    const dist = Math.max(0.5, toBall.length());
    const dir = toBall.divideScalar(dist);

    if (car.activeEffect === 'grapple') {
      car. grounded = false;
      car.vel.copy(dir).multiplyScalar(42.0);
      this.activeTethers.push({ from: car.pos.clone(), to: bPos.clone(), color: '#00e5ff' });
      if (dist < this.ballState.radius + 2.4) {
        car.activeEffect = null;
      }
    } else if (car.activeEffect === 'magnet') {
      if (dist < 26.0) {
        this.ballState.vel.addScaledVector(dir, -34.0 * dt);
        if (this.ballBody) this.ballBody.setLinvel(this.ballState.vel, true);
        this.activeTethers.push({ from: car.pos.clone(), to: bPos.clone(), color: '#ffaa00' });
      }
    } else if (car.activeEffect === 'plunger') {
      this.ballState.vel.addScaledVector(dir, -62.0 * dt);
      if (this.ballBody) this.ballBody.setLinvel(this.ballState.vel, true);
      this.activeTethers.push({ from: car.pos.clone(), to: bPos.clone(), color: '#ff44cc' });
    }

    if (car.activeEffectTimer <= 0) {
      car.activeEffect = null;
    }
  }

  _updateBoostPads(dt) {
    const now = performance.now() * 0.001;
    for (const pad of this.boostPads) {
      if (pad.emitter) {
        pad.emitter.rotation.y = now * 2.4 + pad.id;
      }

      if (!pad.active) {
        pad.cooldown -= dt;
        if (pad.cooldown <= 0) {
          pad.active = true;
          if (pad.emitter) pad.emitter.visible = true;
        }
        continue;
      }

      // Check if any non-demolished car drives over this boost pad
      const pickupRadius = pad.full ? 3.2 : 2.3;
      for (const car of this.cars) {
        if (car.demolished || car.boost >= 99.9) continue;
        const dx = car.pos.x - pad.x;
        const dz = car.pos.z - pad.z;
        if (dx * dx + dz * dz < pickupRadius * pickupRadius && car.pos.y < 4.2) {
          pad.active = false;
          pad.cooldown = pad.maxCooldown;
          if (pad.emitter) pad.emitter.visible = false;
          car.boost = Math.min(100, car.boost + (pad.full ? 100 : 12));
          if (this.audio && car.localPlayerIndex >= 0) {
            this.audio.playBoostPickup(pad.full);
          }
          break;
        }
      }
    }
  }

  _updateDropshotTiles(dt) {
    const bPos = this.ballState.pos;
    const bVel = this.ballState.vel;

    for (const tile of this.dropshotTiles) {
      if (tile.state === 2) {
        tile.respawnTimer -= dt;
        if (tile.respawnTimer <= 0) {
          tile.state = 0;
          tile.mesh.visible = true;
          const baseHex = tile.team === 'blue' ? '#124078' : '#783212';
          if (tile.mat?.userData?.uBase) tile.mat.userData.uBase.value.set(baseHex);
        }
        continue;
      }

      // Check if ball slams onto this hex tile
      if (bPos.y < this.ballState.radius + 0.85 && bVel.y <= 2.0) {
        const dx = bPos.x - tile.x;
        const dz = bPos.z - tile.z;
        if (dx * dx + dz * dz < tile.radius * tile.radius * 0.82) {
          // Damage tile if ball was last touched by enemy team (or any hard slam)
          const enemyTouch =
            (tile.team === 'blue' && this.ballState.lastTeamTouch !== 'blue') ||
            (tile.team === 'orange' && this.ballState.lastTeamTouch !== 'orange');
          if (enemyTouch && (!tile._lastHit || performance.now() - tile._lastHit > 550)) {
            tile._lastHit = performance.now();
            tile.state += 1;
            if (tile.state === 1) {
              if (tile.mat?.userData?.uBase) tile.mat.userData.uBase.value.set('#ffbb00');
              if (this.vfx) this.vfx.spawnImpactBurst(new THREE.Vector3(tile.x, 0.3, tile.z), '#ffbb00', 8);
            } else if (tile.state >= 2) {
              tile.mesh.visible = false;
              tile.respawnTimer = 14.0;
              if (this.vfx) this.vfx.spawnImpactBurst(new THREE.Vector3(tile.x, 0.3, tile.z), '#ff2244', 16);
            }
          }
        }
      }
    }
  }

  _checkGoalScored() {
    const bPos = this.ballState.pos;
    const r = this.ballState.radius;

    // 1. Hoops Mode: Ball drops down through either elevated Basketball Hoop!
    if (this.modeConfig.hoops) {
      for (const hoop of [
        { teamDefending: 'blue', z: -38, scoringTeam: 'orange' },
        { teamDefending: 'orange', z: 38, scoringTeam: 'blue' }
      ]) {
        const distXZ = Math.hypot(bPos.x, bPos.z - hoop.z);
        if (distXZ < 5.6 && bPos.y > 4.2 && bPos.y < 6.8 && this.ballState.vel.y < -1.0) {
          return this._buildGoalEvent(hoop.scoringTeam);
        }
      }
      return null;
    }

    // 2. Dropshot Mode: Ball drops into a broken (state === 2) floor hex tile!
    if (this.modeConfig.dropshot) {
      for (const tile of this.dropshotTiles) {
        if (tile.state === 2) {
          const distXZ = Math.hypot(bPos.x - tile.x, bPos.z - tile.z);
          if (distXZ < tile.radius * 0.85 && bPos.y <= r + 0.55) {
            const scoringTeam = tile.team === 'blue' ? 'orange' : 'blue';
            return this._buildGoalEvent(scoringTeam);
          }
        }
      }
      return null;
    }

    // 3. Standard Soccar / Rumble / Snow Day / Gauntlet Goal Line Check
    const goalLineZ = ARENA.length * 0.5 + r * 0.45;
    if (Math.abs(bPos.x) < ARENA.goalWidth * 0.5 && bPos.y < ARENA.goalHeight) {
      if (bPos.z > goalLineZ) {
        // Ball entered Orange's goal (+Z) -> Blue Scores!
        return this._buildGoalEvent('blue');
      }
      if (bPos.z < -goalLineZ) {
        // Ball entered Blue's goal (-Z) -> Orange Scores!
        return this._buildGoalEvent('orange');
      }
    }

    return null;
  }

  _buildGoalEvent(scoringTeam) {
    const speedKmh = Math.round(Math.max(42, this.ballState.vel.length() * 3.1));
    let scorer = this.ballState.lastPlayerTouch;
    if (!scorer || scorer.team !== scoringTeam) {
      scorer = this.cars.find((c) => c.team === scoringTeam) || this.cars[0];
    }
    const assister =
      this.ballState.assistPlayerTouch &&
      this.ballState.assistPlayerTouch !== scorer &&
      this.ballState.assistPlayerTouch.team === scoringTeam
        ? this.ballState.assistPlayerTouch
        : null;

    if (scorer) {
      scorer.stats.goals += 1;
      scorer.stats.score += 100;
    }
    if (assister) {
      assister.stats.assists += 1;
      assister.stats.score += 50;
    }

    // Launch all nearby cars away from the Goal Explosion shockwave!
    const bPos = this.ballState.pos.clone();
    for (const car of this.cars) {
      const push = new THREE.Vector3().subVectors(car.pos, bPos);
      const d = Math.max(2.0, push.length());
      push.normalize().multiplyScalar(Math.min(42.0, 260.0 / d));
      push.y = Math.max(12.0, push.y + 10.0);
      car.grounded = false;
      car.vel.copy(push);
    }

    const expStyle = scorer?.customization?.goalExplosion || 'comic_boom';
    const teamColor = scoringTeam === 'blue' ? '#0088ff' : '#ff6a00';
    if (this.vfx) {
      this.vfx.spawnGoalExplosion(bPos, teamColor, expStyle);
    }
    if (this.audio) {
      this.audio.playGoalHorn();
      this.audio.announce('GOAL!', true);
    }

    return {
      scoringTeam,
      scorerName: scorer ? scorer.name : scoringTeam.toUpperCase(),
      assisterName: assister ? assister.name : null,
      speedKmh,
      ballPos: bPos
    };
  }
}


// --- MODULE: ai.js ---
// ============================================================================
// What A Save! League — Tactical Soccar Bot AI & Attract Mode Showcase AI
// ============================================================================
class BotAIManager {
  constructor() {
    this.botTimers = new Map();
  }

  /**
   * Computes driving/aerial input for all AI-controlled cars (or all cars during Attract Mode).
   */
  updateBots(physicsWorld, dt, isAttractMode = false) {
    const cars = physicsWorld.cars;
    const ball = physicsWorld.ballState;
    const boostPads = physicsWorld.boostPads;

    // Group active cars by team to assign Striker vs Defender roles
    const teams = { blue: [], orange: [] };
    for (const c of cars) {
      if (!c.demolished) {
        teams[c.team]?.push(c);
      }
    }

    // Sort each team by distance to ball: closest = Striker (index 0), others = Rotator / Goalie
    for (const teamKey of ['blue', 'orange']) {
      teams[teamKey].sort(
        (a, b) => a.pos.distanceToSquared(ball.pos) - b.pos.distanceToSquared(ball.pos)
      );
    }

    for (const car of cars) {
      if (!car.isBot && !isAttractMode) continue;
      if (car.demolished) continue;

      if (isAttractMode) {
        // Attract mode cheats freely: unlimited boost & frequent power-ups!
        car.boost = 100;
      }

      const teamList = teams[car.team] || [car];
      const roleIndex = teamList.indexOf(car);
      const isStriker = roleIndex <= 0 || teamList.length === 1;

      this._computeBotInput(car, isStriker, ball, boostPads, physicsWorld, dt, isAttractMode);
    }
  }

  _computeBotInput(car, isStriker, ball, boostPads, physicsWorld, dt, isAttractMode) {
    let state = this.botTimers.get(car.id);
    if (!state) {
      state = { dodgeCooldown: 0, secondJumpDelay: 0, aerialCommitTimer: 0 };
      this.botTimers.set(car.id, state);
    }
    state.dodgeCooldown = Math.max(0, state.dodgeCooldown - dt);

    const enemyGoalZ = car.team === 'blue' ? ARENA.length * 0.5 : -ARENA.length * 0.5;
    const ownGoalZ = car.team === 'blue' ? -ARENA.length * 0.5 : ARENA.length * 0.5;

    const enemyGoalPos = new THREE.Vector3(0, 2.5, enemyGoalZ);
    const ownGoalPos = new THREE.Vector3(0, 2.0, ownGoalZ);

    // Predict ball position 0.32s ahead
    const predBall = ball.pos.clone().addScaledVector(ball.vel, 0.32);
    predBall.x = Math.max(-ARENA.width * 0.45, Math.min(ARENA.width * 0.45, predBall.x));
    predBall.z = Math.max(-ARENA.length * 0.48, Math.min(ARENA.length * 0.48, predBall.z));

    let targetPos = new THREE.Vector3();
    let wantBoost = false;
    let wantJump = false;
    let wantDrift = false;
    let wantPitch = 0;

    const distToBall = car.pos.distanceTo(ball.pos);
    const ballDistToOwnGoal = Math.abs(ball.pos.z - ownGoalZ);

    if (!isStriker && ballDistToOwnGoal > 36.0 && !isAttractMode) {
      // DEFENDER / GOALIE ROLE: Guard the home net & collect corner boost if low
      if (car.boost < 36) {
        const nearestPad = this._findNearestActivePad(car.pos, boostPads, ownGoalZ);
        if (nearestPad) {
          targetPos.set(nearestPad.x, 0.55, nearestPad.z);
          wantBoost = true;
        } else {
          targetPos.set( THREE.MathUtils.clamp(ball.pos.x * 0.45, -9, 9), 0.55, ownGoalZ * 0.84 );
        }
      } else {
        targetPos.set(
          THREE.MathUtils.clamp(ball.pos.x * 0.55, -10, 10),
          0.55,
          ownGoalZ * 0.82
        );
      }
    } else {
      // STRIKER / EMERGENCY SAVE ROLE: Line up behind the ball toward enemy goal!
      const ballToEnemyGoal = new THREE.Vector3().subVectors(enemyGoalPos, predBall).normalize();
      const approachOffset = distToBall > 14.0 ? 5.5 : 1.4;
      targetPos.copy(predBall).addScaledVector(ballToEnemyGoal, -approachOffset);

      // Check if bot is on the wrong side of the ball (would hit ball toward own goal)
      const wrongSide =
        (car.team === 'blue' && car.pos.z > ball.pos.z + 2.5) ||
        (car.team === 'orange' && car.pos.z < ball.pos.z - 2.5);

      if (wrongSide && ballDistToOwnGoal > 18.0) {
        // Arc sideways around the ball so we never own-goal
        const sideOffset = car.pos.x >= ball.pos.x ? 9.5 : -9.5;
        targetPos.x = THREE.MathUtils.clamp(ball.pos.x + sideOffset, -ARENA.width * 0.44, ARENA.width * 0.44);
        targetPos.z = ball.pos.z + (car.team === 'blue' ? -8.0 : 8.0);
      }
    }

    // Compute local steering angle toward targetPos
    const toTarget = new THREE.Vector3().subVectors(targetPos, car.pos);
    const flatToTarget = new THREE.Vector3(toTarget.x, 0, toTarget.z);
    const flatDist = Math.max(0.01, flatToTarget.length());
    flatToTarget.divideScalar(flatDist);

    const flatFwd = new THREE.Vector3(car.forward.x, 0, car.forward.z).normalize();
    const flatRight = new THREE.Vector3(car.right.x, 0, car.right.z).normalize();

    const forwardDot = flatFwd.dot(flatToTarget);
    const rightDot = flatRight.dot(flatToTarget);

    // Steering: rightDot > 0 means target is to our right -> steer right (negative steer)
    let steer = THREE.MathUtils.clamp(-rightDot * 2.4, -1.0, 1.0);
    let throttle = 1.0;

    // Powerslide if sharp turn required
    if (forwardDot < 0.25 && car.vel.length() > 10.0 && car.grounded) {
      wantDrift = true;
    }

    // Boost when reasonably aligned and chasing ball
    if (forwardDot > 0.72 && (flatDist > 10.0 || distToBall < 14.0 || isAttractMode)) {
      wantBoost = true;
    }

    // STRIKE DODGE OR AERIAL LAUNCH!
    const alignedForStrike = forwardDot > 0.82 && distToBall < 8.5;
    const ballHighUp = ball.pos.y > 4.6 && ball.pos.y < 17.5 && distToBall < 22.0 && forwardDot > 0.78;

    if (car.grounded && state.dodgeCooldown <= 0) {
      if (alignedForStrike && ball.pos.y < 4.5) {
        // Jump + queue front-flip dodge into the ball!
        wantJump = true;
        state.secondJumpDelay = 0.14;
        state.dodgeCooldown = 1.4;
      } else if (ballHighUp && (car.boost > 25 || isAttractMode)) {
        // Launch for Aerial Hit!
        wantJump = true;
        state.aerialCommitTimer = 1.1;
        state.dodgeCooldown = 1.8;
      }
    }

    // Handle queued second jump (Front-Flip Dodge Strike!)
    if (!car.grounded && state.secondJumpDelay > 0) {
      state.secondJumpDelay -= dt;
      if (state.secondJumpDelay <= 0 && car.hasFlip) {
        wantJump = true;
        wantPitch = -1.0; // Stick forward for front-flip power shot!
      }
    }

    // Handle active Aerial Flight Steering in 3D!
    if (!car.grounded && (state.aerialCommitTimer > 0 || isAttractMode)) {
      state.aerialCommitTimer = Math.max(0, state.aerialCommitTimer - dt);
      const dir3D = new THREE.Vector3().subVectors(predBall, car.pos).normalize();
      const pitchError = dir3D.y - car.forward.y;
      wantPitch = THREE.MathUtils.clamp(-pitchError * 2.6, -1.0, 1.0);
      wantBoost = dir3D.dot(car.forward) > 0.45;

      // Attract mode cheat: gentle homing force toward high aerial balls for guaranteed spectacle!
      if (isAttractMode && ball.pos.y > 4.0 && distToBall < 24.0) {
        car.vel.addScaledVector(dir3D, 22.0 * dt);
      }
    }

    // Activate Rumble Power-Up if available and within range
    const wantPowerup = Boolean(car.powerup && distToBall < 24.0 && Math.random() < 0.08);

    const prevJump = car.input.jump;
    car.input = {
      throttle,
      steer,
      pitch: wantPitch,
      yaw: steer,
      airRoll: 0,
      camYaw: 0,
      camPitch: 0,
      jump: wantJump,
      jumpJustPressed: wantJump && !prevJump,
      boost: wantBoost,
      drift: wantDrift,
      ballCamJustPressed: false,
      powerupJustPressed: wantPowerup,
      resetShotJustPressed: false
    };
  }

  _findNearestActivePad(pos, boostPads, preferredZSign) {
    let best = null;
    let bestDist = Infinity;
    for (const pad of boostPads) {
      if (!pad.active) continue;
      if (preferredZSign && Math.sign(pad.z) !== Math.sign(preferredZSign)) continue;
      const d = (pad.x - pos.x) ** 2 + (pad.z - pos.z) ** 2;
      const weight = pad.full ? d * 0.45 : d;
      if (weight < bestDist) {
        bestDist = weight;
        best = pad;
      }
    }
    return best;
  }
}


// --- MODULE: replay.js ---
// ============================================================================
// What A Save! League — Ring-Buffer Instant Goal Replay System
// ============================================================================
class ReplayRecorder {
  constructor(maxSeconds = 5.5, sampleHz = 60) {
    this.maxFrames = Math.floor(maxSeconds * sampleHz);
    this.frames = [];
    this.isPlaying = false;
    this.playCursor = 0;
    this.goalInfo = null;
  }

  clear() {
    this.frames.length = 0;
    this.isPlaying = false;
    this.playCursor = 0;
    this.goalInfo = null;
  }

  /**
   * Captures a frame snapshot of the ball and all cars.
   */
  recordFrame(physicsWorld) {
    if (this.isPlaying) return;

    const b = physicsWorld.ballState;
    const carSnaps = physicsWorld.cars.map((c) => ({
      id: c.id,
      x: c.pos.x,
      y: c.pos.y,
      z: c.pos.z,
      qx: c.quat.x,
      qy: c.quat.y,
      qz: c.quat.z,
      qw: c.quat.w,
      isBoosting: c.isBoosting,
      demolished: c.demolished,
      wheelSpin: c.wheelSpinAngle,
      steerVisual: c.steerVisual
    }));

    this.frames.push({
      ball: {
        x: b.pos.x,
        y: b.pos.y,
        z: b.pos.z,
        qx: b.quat.x,
        qy: b.quat.y,
        qz: b.quat.z,
        qw: b.quat.w,
        teamColor: b.lastTeamTouch === 'orange' ? '#ff6a00' : '#00e5ff'
      },
      cars: carSnaps
    });

    if (this.frames.length > this.maxFrames) {
      this.frames.shift();
    }
  }

  /**
   * Starts playing back the buffered goal sequence.
   */
  startPlayback(goalInfo) {
    if (this.frames.length < 10) return false;
    this.isPlaying = true;
    // Start 4.0 seconds before the end of the buffer
    this.playCursor = Math.max(0, this.frames.length - 240);
    this.goalInfo = goalInfo;
    return true;
  }

  stopPlayback() {
    this.isPlaying = false;
    this.goalInfo = null;
  }

  /**
   * Advances the replay playback and applies transforms to the 3D scene meshes.
   * Returns false when replay finishes.
   */
  updatePlayback(dt, physicsWorld, ballMesh, camera) {
    if (!this.isPlaying || this.frames.length === 0) return false;

    // Slight slow-motion right at the final 0.6s of the goal!
    const remaining = this.frames.length - this.playCursor;
    const speedFactor = remaining < 45 ? 0.55 : 1.0;
    this.playCursor += dt * 60 * speedFactor;

    if (this.playCursor >= this.frames.length - 1) {
      this.stopPlayback();
      return false;
    }

    const idx = Math.min(this.frames.length - 1, Math.floor(this.playCursor));
    const snap = this.frames[idx];

    if (ballMesh && snap.ball) {
      ballMesh.position.set(snap.ball.x, snap.ball.y, snap.ball.z);
      ballMesh.quaternion.set(snap.ball.qx, snap.ball.qy, snap.ball.qz, snap.ball.qw);
      physicsWorld.ballState.pos.set(snap.ball.x, snap.ball.y, snap.ball.z);
    }

    for (const cSnap of snap.cars) {
      const car = physicsWorld.cars.find((c) => c.id === cSnap.id);
      if (!car || !car.mesh) continue;
      car.mesh.visible = !cSnap.demolished;
      car.mesh.position.set(cSnap.x, cSnap.y, cSnap.z);
      car.mesh.quaternion.set(cSnap.qx, cSnap.qy, cSnap.qz, cSnap.qw);

      const ud = car.mesh.userData;
      if (ud?.boostFlames) {
        for (const f of ud.boostFlames) f.visible = cSnap.isBoosting;
      }
    }

    // Position the Replay Director Camera overlooking the ball and the goal!
    if (camera && snap.ball) {
      const bPos = new THREE.Vector3(snap.ball.x, snap.ball.y, snap.ball.z);
      const goalZ = this.goalInfo?.scoringTeam === 'blue' ? 60 : -60;
      const goalCenter = new THREE.Vector3(0, 4.0, goalZ);
      const fromGoalToBall = new THREE.Vector3().subVectors(bPos, goalCenter).normalize();

      const desiredCamPos = bPos
        .clone()
        .addScaledVector(fromGoalToBall, 18.0)
        .add(new THREE.Vector3(8.5, 6.5, 0));
      desiredCamPos.x = THREE.MathUtils.clamp(desiredCamPos.x, -36, 36);
      desiredCamPos.y = THREE.MathUtils.clamp(desiredCamPos.y, 3.0, 22.0);
      desiredCamPos.z = THREE.MathUtils.clamp(desiredCamPos.z, -55, 55);

      camera.position.lerp(desiredCamPos, Math.min(1, dt * 6.0));
      camera.lookAt(bPos.x, bPos.y + 0.5, bPos.z);
    }

    return true;
  }
}


// --- MODULE: network.js ---
// ============================================================================
// What A Save! League — Online P2P WebRTC (PeerJS) + BroadcastChannel Multiplayer
// ============================================================================
class NetworkManager {
  constructor() {
    this.role = 'offline'; // 'offline' | 'host' | 'client'
    this.roomCode = '';
    this.peer = null;
    this.connections = []; // WebRTC DataConnections (when host)
    this.hostConn = null;  // WebRTC DataConnection to host (when client)
    this.bc = null;        // BroadcastChannel for zero-latency local multi-tab/window sync

    this.clientId = `peer_${Math.random().toString(36).slice(2, 8)}`;
    this.assignedSlot = 0; // 0 = Host, 1..3 = Remote Clients
    this.lobbyPlayers = []; // Up to 4 player entries: { slot, id, name, team, isBot, ping }
    this.remoteInputs = new Map(); // slot -> latest input packet

    this.onLobbyUpdate = null;
    this.onMatchStart = null;
    this.onStateSnapshot = null;
    this.onQuickChatNet = null;
    this.statusText = 'Offline';
  }

  disconnect() {
    if (this.bc) {
      this.bc.close();
      this.bc = null;
    }
    if (this.peer) {
      try {
        this.peer.destroy();
      } catch (_e) {}
      this.peer = null;
    }
    this.connections = [];
    this.hostConn = null;
    this.role = 'offline';
    this.assignedSlot = 0;
    this.remoteInputs.clear();
    this.statusText = 'Offline';
  }

  /**
   * Hosts a 4-player online room using both BroadcastChannel and WebRTC (PeerJS).
   */
  hostRoom(customCode = '') {
    this.disconnect();
    this.role = 'host';
    this.assignedSlot = 0;
    this.roomCode =
      customCode.trim().toUpperCase() ||
      `RL-${Math.floor(1000 + Math.random() * 9000)}`;

    this.lobbyPlayers = [
      { slot: 0, id: this.clientId, name: 'Player 1 (Host)', team: 'blue', isBot: false, ping: 0 },
      { slot: 1, id: 'bot_1', name: '[BOT] SquishyCel', team: 'blue', isBot: true, ping: 12 },
      { slot: 2, id: 'bot_2', name: '[BOT] Kronovi-X', team: 'orange', isBot: true, ping: 18 },
      { slot: 3, id: 'bot_3', name: '[BOT] JSTN-Zero', team: 'orange', isBot: true, ping: 15 }
    ];

    this.statusText = `Hosting Room ${this.roomCode} — Waiting for players (or Start anytime)...`;
    this._notifyLobby();

    // 1. BroadcastChannel for immediate multi-tab / multi-window connections
    if (typeof BroadcastChannel !== 'undefined') {
      this.bc = new BroadcastChannel(`wasl_room_${this.roomCode}`);
      this.bc.onmessage = (ev) => this._handleHostMessage(ev.data, null);
    }

    // 2. PeerJS WebRTC P2P Server
    try {
      const peerId = `wasl-net-${this.roomCode.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
      this.peer = new Peer(peerId);
      this.peer.on('open', () => {
        this.statusText = `Room ${this.roomCode} Live (WebRTC + Local Mesh Ready)`;
        this._notifyLobby();
      });
      this.peer.on('connection', (conn) => {
        this.connections.push(conn);
        conn.on('data', (data) => this._handleHostMessage(data, conn));
        conn.on('close', () => {
          this.connections = this.connections.filter((c) => c !== conn);
        });
      });
      this.peer.on('error', () => {
        // Keep BroadcastChannel + Local lobby operational even if public PeerJS broker is unreachable
        this.statusText = `Room ${this.roomCode} Ready (Local Mesh Mode)`;
        this._notifyLobby();
      });
    } catch (_e) {
      this.statusText = `Room ${this.roomCode} Ready (Local Mesh Mode)`;
      this._notifyLobby();
    }

    return this.roomCode;
  }

  /**
   * Joins an existing 4-player room by Room Code.
   */
  joinRoom(code) {
    const clean = (code || '').trim().toUpperCase();
    if (!clean) return;
    this.disconnect();
    this.role = 'client';
    this.roomCode = clean;
    this.statusText = `Connecting to Room ${this.roomCode}...`;
    this._notifyLobby();

    const joinPacket = {
      type: 'join_request',
      clientId: this.clientId,
      name: `Player_${this.clientId.slice(-3).toUpperCase()}`
    };

    // 1. Try BroadcastChannel first (instant across browser windows)
    if (typeof BroadcastChannel !== 'undefined') {
      this.bc = new BroadcastChannel(`wasl_room_${this.roomCode}`);
      this.bc.onmessage = (ev) => this._handleClientMessage(ev.data);
      this.bc.postMessage(joinPacket);
    }

    // 2. Try PeerJS WebRTC DataChannel
    try {
      this.peer = new Peer();
      this.peer.on('open', () => {
        const hostPeerId = `wasl-net-${this.roomCode.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
        const conn = this.peer.connect(hostPeerId, { reliable: false });
        this.hostConn = conn;
        conn.on('open', () => {
          conn.send(joinPacket);
        });
        conn.on('data', (data) => this._handleClientMessage(data));
      });
      this.peer.on('error', () => {});
    } catch (_e) {}
  }

  _handleHostMessage(msg, conn) {
    if (!msg || typeof msg !== 'object') return;

    if (msg.type === 'join_request') {
      // Find first bot slot (1..3) to replace with this human client
      let slotEntry = this.lobbyPlayers.find((p) => p.id === msg.clientId);
      if (!slotEntry) {
        slotEntry = this.lobbyPlayers.find((p) => p.slot > 0 && p.isBot);
        if (slotEntry) {
          slotEntry.id = msg.clientId;
          slotEntry.name = msg.name || `Player ${slotEntry.slot + 1}`;
          slotEntry.isBot = false;
          slotEntry.ping = 16;
        }
      }

      const assignedSlot = slotEntry ? slotEntry.slot : 1;
      const welcome = {
        type: 'lobby_state',
        roomCode: this.roomCode,
        targetClientId: msg.clientId,
        assignedSlot,
        lobbyPlayers: this.lobbyPlayers
      };
      this._broadcastFromHost(welcome, conn);
      this.statusText = `${msg.name} joined Slot ${assignedSlot + 1}!`;
      this._notifyLobby();
    } else if (msg.type === 'client_input') {
      this.remoteInputs.set(msg.slot, msg.input);
    } else if (msg.type === 'quick_chat') {
      if (this.onQuickChatNet) {
        this.onQuickChatNet(msg.slot, msg.chatIndex);
      }
      this._broadcastFromHost(msg);
    }
  }

  _handleClientMessage(msg) {
    if (!msg || typeof msg !== 'object') return;

    if (msg.type === 'lobby_state') {
      if (msg.targetClientId === this.clientId) {
        this.assignedSlot = msg.assignedSlot;
      }
      this.lobbyPlayers = msg.lobbyPlayers || this.lobbyPlayers;
      this.statusText = `Connected to ${this.roomCode} as Slot ${this.assignedSlot + 1}`;
      this._notifyLobby();
    } else if (msg.type === 'match_start') {
      if (this.onMatchStart) {
        this.onMatchStart(msg.modeId, msg.arenaId);
      }
    } else if (msg.type === 'state_snapshot') {
      if (this.onStateSnapshot) {
        this.onStateSnapshot(msg);
      }
    } else if (msg.type === 'quick_chat') {
      if (this.onQuickChatNet) {
        this.onQuickChatNet(msg.slot, msg.chatIndex);
      }
    }
  }

  _broadcastFromHost(packet, specificConn = null) {
    if (this.bc) {
      try {
        this.bc.postMessage(packet);
      } catch (_e) {}
    }
    if (specificConn && specificConn.open) {
      specificConn.send(packet);
    } else {
      for (const c of this.connections) {
        if (c && c.open) {
          c.send(packet);
        }
      }
    }
  }

  /**
   * Host starts the online match and notifies all connected peers.
   */
  broadcastMatchStart(modeId, arenaId) {
    if (this.role !== 'host') return;
    this._broadcastFromHost({
      type: 'match_start',
      modeId,
      arenaId,
      lobbyPlayers: this.lobbyPlayers
    });
  }

  /**
   * Host broadcasts authoritative physics state to all clients.
   */
  broadcastStateSnapshot(physicsWorld, blueScore, orangeScore, matchTimeRemaining, isOvertime) {
    if (this.role !== 'host') return;
    const b = physicsWorld.ballState;
    const packet = {
      type: 'state_snapshot',
      blueScore,
      orangeScore,
      matchTimeRemaining,
      isOvertime,
      ball: {
        x: b.pos.x,
        y: b.pos.y,
        z: b.pos.z,
        vx: b.vel.x,
        vy: b.vel.y,
        vz: b.vel.z,
        qx: b.quat.x,
        qy: b.quat.y,
        qz: b.quat.z,
        qw: b.quat.w,
        lastTeamTouch: b.lastTeamTouch
      },
      cars: physicsWorld.cars.map((c) => ({
        id: c.id,
        x: c.pos.x,
        y: c.pos.y,
        z: c.pos.z,
        qx: c.quat.x,
        qy: c.quat.y,
        qz: c.quat.z,
        qw: c.quat.w,
        boost: c.boost,
        isBoosting: c.isBoosting,
        demolished: c.demolished
      }))
    };
    this._broadcastFromHost(packet);
  }

  /**
   * Client sends its local controller/keyboard input frame to the Host.
   */
  sendClientInput(inputState) {
    if (this.role !== 'client') return;
    const packet = {
      type: 'client_input',
      slot: this.assignedSlot,
      input: inputState
    };
    if (this.bc) {
      try {
        this.bc.postMessage(packet);
      } catch (_e) {}
    }
    if (this.hostConn && this.hostConn.open) {
      this.hostConn.send(packet);
    }
  }

  sendQuickChat(slot, chatIndex) {
    const packet = { type: 'quick_chat', slot, chatIndex };
    if (this.role === 'host') {
      this._broadcastFromHost(packet);
    } else if (this.role === 'client') {
      if (this.bc) this.bc.postMessage(packet);
      if (this.hostConn && this.hostConn.open) this.hostConn.send(packet);
    }
  }

  _notifyLobby() {
    if (this.onLobbyUpdate) {
      this.onLobbyUpdate(this.lobbyPlayers, this.statusText, this.roomCode, this.role);
    }
  }
}

  _buildDOM() {
    const root = document.createElement('div');
    root.id = 'ui-root';
    document.body.appendChild(root);
    this.root = root;

    this.renderCurrentScreen();
  }

  showScreen(screenName) {
    this.activeScreen = screenName;
    this.renderCurrentScreen();
    setTimeout(() => {
      if (this.app.input) this.app.input.ensureFocus();
    }, 30);
  }

  addQuickChat(playerName, team, text) {
    this.quickChatLog.push({
      playerName,
      team,
      text,
      time: performance.now()
    });
    if (this.quickChatLog.length > 5) {
      this.quickChatLog.shift();
    }
    this._refreshQuickChatDOM();
  }

  _refreshQuickChatDOM() {
    const box = document.getElementById('qc-feed');
    if (!box) return;
    box.innerHTML = this.quickChatLog
      .map((item) => {
        const col = item.team === 'orange' ? '#ff9933' : '#44e5ff';
        return `<div class="qc-item" style="border-left-color:${col}">
          <span style="color:${col}">[${item.team.toUpperCase()}] ${item.playerName}:</span> ${item.text}
        </div>`;
      })
      .join('');
  }

  showBanner(mainText, subText = '', durationMs = 1800) {
    const mainEl = document.getElementById('hud-banner-main');
    const subEl = document.getElementById('hud-banner-sub');
    if (!mainEl || !subEl) return;

    mainEl.textContent = mainText;
    subEl.textContent = subText;
    if (this.bannerTimer) clearTimeout(this.bannerTimer);
    if (durationMs > 0) {
      this.bannerTimer = setTimeout(() => {
        if (mainEl) mainEl.textContent = '';
        if (subEl) subEl.textContent = '';
      }, durationMs);
    }
  }

  renderCurrentScreen() {
    // Check touch-only guard first
    if (
      (this.app.input.isTouchOnlyDevice || this.app.input.settings.forceTouchOnlyTest) &&
      this.activeScreen !== 'settings'
    ) {
      this._renderTouchGuardScreen();
      return;
    }

    switch (this.activeScreen) {
      case 'main_menu':
        this._renderMainMenu();
        break;
      case 'modes':
        this._renderModesScreen();
        break;
      case 'splitscreen':
        this._renderSplitScreenLobby();
        break;
      case 'online':
        this._renderOnlineLobby();
        break;
      case 'garage':
        this._renderGarageScreen();
        break;
      case 'settings':
        this._renderSettingsScreen();
        break;
      case 'about':
        this._renderAboutScreen();
        break;
      case 'hud':
        this._renderMatchHUD();
        break;
      case 'pause':
        this._renderPauseScreen();
        break;
      case 'postmatch':
        this._renderPostMatchScreen();
        break;
      case 'attract':
        this._renderAttractOverlay();
        break;
      default:
        this._renderMainMenu();
    }
  }

  _headerHTML(subtitle = '10-Foot Controller-First Cel-Shaded Arena Soccar') {
    const pads = this.app.input.activeGamepadsCount;
    const padLabel =
      pads > 0 ? `🎮 ${pads} Controller${pads > 1 ? 's' : ''} Connected` : '🎮 Controller / Keyboard Ready';
    return `
      <div class="brand-header">
        <div class="game-logo">
          <div class="game-logo-title">WHAT A SAVE! LEAGUE</div>
          <div class="game-logo-sub">${subtitle}</div>
        </div>
        <div class="controller-status-pill">
          <span>${padLabel}</span>
        </div>
      </div>
    `;
  }

  _footerHTML(extraHint = '') {
    return `
      <div class="footer-prompts">
        <div class="prompt-group">
          <span><b class="btn-badge">✕ / ENTER</b> Select</span>
          <span><b class="btn-badge">○ / ESC</b> Back</span>
          <span><b class="btn-badge">D-PAD / STICK</b> Navigate</span>
          ${extraHint}
        </div>
        <div style="color:var(--blue-glow)">Three.js R180 WebGPU · Rapier 0.19.3</div>
      </div>
    `;
  }

  _renderTouchGuardScreen() {
    this.root.innerHTML = `
      <div class="interactive-screen active" style="justify-content:center; align-items:center; text-align:center;">
        <div class="panel-card" style="max-width:620px;">

  updateLiveHUD(blueScore, orangeScore, clockStr, isOvertime, localCars, replayRecorder) {
    const bEl = document.getElementById('hud-score-blue');
    const oEl = document.getElementById('hud-score-orange');
    const cEl = document.getElementById('hud-clock');
    const rBar = document.getElementById('hud-replay-bar');
    const rInfo = document.getElementById('hud-replay-info');

    if (bEl) bEl.textContent = String(blueScore);
    if (oEl) oEl.textContent = String(orangeScore);
    if (cEl) {
      cEl.textContent = isOvertime ? `+${clockStr}` : clockStr;
      cEl.style.color = isOvertime ? '#ffdd00' : '#ffffff';
    }

    if (rBar) {
      if (replayRecorder && replayRecorder.isPlaying) {
        rBar.style.display = 'inline-flex';
        const g = replayRecorder.goalInfo;
        if (rInfo && g) {
          rInfo.textContent = `${g.scorerName} (${g.speedKmh} KM/H)`;
        }
      } else {
        rBar.style.display = 'none';
      }
    }

    localCars.forEach((car, idx) => {
      const boostEl = document.getElementById(`vp-boost-${idx}`);
      const dialEl = document.getElementById(`vp-dial-${idx}`);
      const speedEl = document.getElementById(`vp-speed-${idx}`);
      const camEl = document.getElementById(`vp-cam-${idx}`);
      const flipEl = document.getElementById(`vp-flip-${idx}`);
      const pwrEl = document.getElementById(`vp-powerup-${idx}`);

      if (boostEl) boostEl.textContent = String(Math.round(car.boost));
      if (dialEl) {
        const col = car.boost > 66 ? '#ff5500' : car.boost > 25 ? '#ffaa00' : '#00b8ff';
        dialEl.style.boxShadow = `0 0 0 4px ${col}, 0 8px 20px rgba(0,0,0,0.8)`;
      }
      if (speedEl) {
        const kmh = Math.round(car.vel.length() * 2.8);
        speedEl.textContent = car.isSupersonic ? `⚡ ${kmh} KM/H SUPERSONIC` : `${kmh} KM/H`;
        speedEl.style.color = car.isSupersonic ? '#ffdd00' : '#ffffff';
      }
      if (camEl) {
        camEl.textContent = car.ballCam ? `P${idx + 1} · 🎯 BALL CAM [△/C]` : `P${idx + 1} · 🚘 CAR CAM [△/C]`;
        camEl.style.borderColor = car.ballCam ? '#00e5ff' : '#ffaa00';
      }
      if (flipEl) {
        flipEl.textContent = car.hasFlip ? '⚡ DODGE / FLIP READY' : '⏳ IN AIR (TOUCH FLOOR/BALL)';
        flipEl.style.color = car.hasFlip ? '#00ffcc' : '#ff7755';
      }
      if (pwrEl) {
        if (this.app.matchConfig.modeId === 'rumble') {
          pwrEl.style.display = 'inline-flex';
          pwrEl.textContent = car.powerup
            ? `${car.powerup.icon} ${car.powerup.name} [F / L3]`
            : `⏳ Power-Up in ${Math.ceil(car.powerupTimer)}s`;
        } else {
          pwrEl.style.display = 'none';
        }
      }
    });
  }
