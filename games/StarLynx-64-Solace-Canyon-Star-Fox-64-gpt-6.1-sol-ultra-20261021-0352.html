        new THREE2.Vector3(e.vx, e.vy, e.vz).normalize()
      );
    } else if (e.kind === "seeker") {
      obj.rotation.z += dt * 6;
      obj.rotation.y += dt * 4;
    }
    if (obj.userData.flash > 0) {
      obj.userData.flash -= dt;
      obj.scale.multiplyScalar(1.07);
    }
  }
  if (bossModel && engine.boss) {
    const b = engine.boss;
    bossModel.position.set(b.x, b.y, b.z);
    bossModel.rotation.z = Math.sin(b.age * 0.4) * 0.025;
    if (b.phase === 3) {
      bossModel.rotation.z += b.age * 2e-3;
      bossModel.position.y -= Math.max(0, engine.time - (engine.finishedTime - 3.5)) * 4;
    }
  }
  if (routeGroup) {
    for (const g of routeGroup.children) {
      g.position.z = -75 + Math.max(0, engine.time - 54) * 6;
      g.rotation.z = elapsed * 0.1;
    }
  }
}
function updateWings(dt, playing) {
  const p = playing ? engine.player : { x: 7, y: -1 };
  if (!p) return;
  wingA.visible = !playing || engine.wingA > 0;
  wingB.visible = true;
  const chase = playing && engine.time > 85 && engine.time < 109 && !engine.rescueResolved;
  for (const [i, w] of [wingA, wingB].entries()) {
    const target = new THREE2.Vector3(
      p.x * 0.25 + (i === 0 ? -7 : 8),
      p.y * 0.2 + 1.7 + Math.sin(elapsed * 1.3 + i) * 0.6,
      -8 - i * 4
    );
    if (chase && i === 0) target.set(10 + Math.sin(elapsed) * 3, 5, -42);
    if (!playing) target.add(new THREE2.Vector3(0, 1, -8));
    w.position.lerp(target, 1 - Math.exp(-dt * 3));
    w.rotation.set(
      Math.sin(elapsed + i) * 0.05,
      Math.sin(elapsed * 0.7 + i) * 0.06,
      Math.sin(elapsed * 1.1 + i) * 0.09
    );
    w.scale.setScalar(playing ? 0.65 : 0.8);
  }
}
function handleDeviceError(message) {
  if (renderer?._initialized) renderer.setAnimationLoop(null);
  lastErrorMessage = message;
  mode = "error";
  screen = "error";
  ui.setAttract(false);
  ui.show("error", { message });
  gpuLabel.textContent = "WEBGPU DEVICE UNAVAILABLE";
  audio.setPaused(true);
  document.getElementById("boot")?.remove();
  if (!errorLoopStarted) {
    errorLoopStarted = true;
    let old = performance.now();
    const menuFrame = (now) => {
      const dt = Math.min(0.1, (now - old) / 1e3);
      old = now;
      if (mode === "error") {
        input?.poll(dt, true);
        audio.update(dt, 0.2, 0);
      }
      requestAnimationFrame(menuFrame);
    };
    requestAnimationFrame(menuFrame);
  }
}
async function boot() {
  window.__starLoaded = true;
  if (!window.isSecureContext)
    throw new Error(
      "WebGPU needs a secure context. Serve this file over HTTPS or http://localhost."
    );
  if (!navigator.gpu)
    throw new Error(
      "WebGPU is required. Open this game in a browser with WebGPU enabled. There is no WebGL fallback."
    );
  const adapter = await navigator.gpu.requestAdapter({
    powerPreference: "high-performance"
  });
  if (!adapter)
    throw new Error(
      "No WebGPU adapter is available. Enable hardware acceleration and use a WebGPU-capable browser."
    );
  const device = await adapter.requestDevice();
  renderer = new THREE2.WebGPURenderer({
    antialias: true,
    alpha: false,
    device
  });
  renderer._getFallback = null;
  await renderer.init();
  if (!renderer.backend.isWebGPUBackend)
    throw new Error("A strict WebGPU backend is required.");
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE2.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE2.PCFShadowMap;
  renderer.domElement.id = "flight-canvas";
  renderer.domElement.setAttribute(
    "aria-label",
    "StarLynx 64 three-dimensional flight scene"
  );
  document.getElementById("stage").append(renderer.domElement);
  renderer.onDeviceLost = (info) => handleDeviceError(
    `The WebGPU device was lost: ${info.message || "unknown reason"}. Reload to reconnect.`
  );
  scene = new THREE2.Scene();
  camera = new THREE2.PerspectiveCamera(
    62,
    innerWidth / innerHeight,
    0.15,
    2300
  );
  camera.position.set(0, 5, 23);
  camera.lookAt(0, 1, -80);
  world = new FlightWorld(scene);
  initMaterials();
  playerModel = world.makeShip("player");
  scene.add(playerModel);
  wingA = world.makeShip("wingA");
  wingB = world.makeShip("wingB");
  scene.add(wingA, wingB);
  await initPhysics();
  engine = new MissionEngine(onEvent);
  document.body.classList.toggle("high-contrast", !!settings.highContrast);
  window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && mode === "playing" && !screen) pause();
  });
  window.addEventListener("blur", () => {
    if (mode === "playing" && !screen) pause();
  });
  window.addEventListener("gamepaddisconnected", () => {
    if (mode === "playing" && !screen) {
      pause();
      ui.toast(
        "CONTROLLER DISCONNECTED",
        "Reconnect your controller or continue with the keyboard"
      );
    }
  });
  title();
  window.__starReady = true;
  document.getElementById("boot")?.remove();
  let previous = performance.now();
  renderer.setAnimationLoop((now) => {
    try {
      const dt = Math.min((now - previous) / 1e3, 0.08);
      previous = now;
      elapsed += dt;
      attractCooldown = Math.max(0, attractCooldown - dt);
      const controls = input.poll(dt, !!screen);
      controls.x *= settings.invertX ? -1 : 1;
      controls.y *= settings.invertY ? -1 : 1;
      if (mode === "title" && screen === "title") {
        idle += dt;
        if (idle >= 10) start(true);
      }
      const playing = mode === "playing" || mode === "attract";
      const running = playing && !screen && engine.state === "playing";
      if (running) engine.tick(dt, controls);
      if (playing) {
        if (!screen) {
          syncEntities(dt);
          updateEffects(dt);
        }
        const p = engine.player;
        if (p) {
          const targetPos = new THREE2.Vector3(
            p.x * 0.32,
            5 + p.y * 0.3,
            23 + (engine.speed - 48) * 0.035
          );
          camera.position.lerp(targetPos, 1 - Math.exp(-dt * 4));
          if (settings.shake && shake > 0)
            camera.position.add(
              new THREE2.Vector3(
                (Math.random() - 0.5) * shake,
                (Math.random() - 0.5) * shake,
                0
              )
            );
          camera.lookAt(p.x * 0.27, 1 + p.y * 0.25, -85);
          camera.fov += (62 + (engine.speed - 48) * 0.22 - camera.fov) * Math.min(1, dt * 4);
          camera.updateProjectionMatrix();
          const hud = engine.hud;
          hud.target = null;
          hud.reticle = project(p.x, p.y, -80);
          if (engine.target)
            hud.target = {
              ...project(engine.target.x, engine.target.y, engine.target.z),
              locked: engine.lockTime >= 0.8,
              health: engine.target.hp / engine.target.maxHP
            };
          ui.updateHUD(hud);
        }
        if (recentResult) {
          finishDelay -= dt;
          if (finishDelay <= 0) {
            if (mode === "attract") start(true);
            else {
              mode = "debrief";
              playerModel.visible = true;
              setScreen("debrief", recentResult);
            }
          }
        }
      } else {
        playerModel.visible = true;
        playerModel.position.set(8, -1 + Math.sin(elapsed * 0.7) * 0.5, 0);
        playerModel.rotation.set(
          0.025 + Math.sin(elapsed * 0.4) * 0.035,
          -0.12 + Math.sin(elapsed * 0.27) * 0.05,
          -0.12 + Math.sin(elapsed * 0.6) * 0.035
        );
        playerModel.scale.setScalar(1.8);
        camera.position.lerp(new THREE2.Vector3(0, 5, 24), Math.min(1, dt * 2));
        camera.lookAt(0, 3, -85);
        camera.fov = 62;
        camera.updateProjectionMatrix();
        updateEffects(dt);
      }
      if (!screen || mode === "title" || mode === "debrief")
        world.update(
          dt,
          elapsed,
          playing ? engine.speed : 15,
          playing ? engine.chapter?.id : "canyon"
        );
      updateWings(dt, playing);
      shake = Math.max(0, shake - dt * 2.4);
      audio.update(
        dt,
        playing ? engine.speed / 48 : 0.3,
        playing ? 1 - engine.health / 100 : 0
      );
      renderer.render(scene, camera);
    } catch (err) {
      console.error(err);
      renderer.setAnimationLoop(null);
      handleDeviceError(
        `Flight systems stopped: ${err?.message || String(err)}`
      );
    }
  });
}
input = new InputManager({
  onActivity: activity,
  onMenu: navigate,
  onPause: pause,
  onBack: back,
  onMute: () => {
    settings.volume = settings.volume > 0 ? 0 : 0.65;
    ui.settings.volume = settings.volume;
    audio.setVolume(settings.volume);
    storage.set("starlynx.settings", settings);
    ui.toast(settings.volume ? "AUDIO ON" : "AUDIO MUTED", "M to toggle");
  }
});
boot().catch((err) => {
  console.error(err);
  handleDeviceError(err?.message || String(err));
});

</script>
