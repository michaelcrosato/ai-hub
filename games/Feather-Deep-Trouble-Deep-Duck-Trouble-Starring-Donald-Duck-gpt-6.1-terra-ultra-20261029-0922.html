 boss=makeBoss();const treasure=new THREE.Group();scene.add(treasure);box(0,.55,0,1.5,1.1,1,0xa86a39,treasure);box(0,1.15,0,1.6,.25,1.1,0xf7c74c,treasure);box(0,.55,.56,.25,1.1,.08,0xf7c74c,treasure);treasure.position.set(146,0,0);const ts=textSprite('TIDE CHARM');ts.position.set(146,2.2,0);scene.add(ts);

function resize(){if(!renderer)return;let w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.left=-5.625*w/h;camera.right=5.625*w/h;camera.top=5.625;camera.bottom=-5.625;camera.updateProjectionMatrix()}
function reset(){score=0;health=3;checkpoint=3;pepper=0;invuln=0;bossHealth=3;bossActive=false;won=false;elapsed=0;lastProgress=0;facing=1;buildWorld();resize();updateHud()}
function updateHud(){ $('#score').textContent=String(score).padStart(5,'0');$('#hearts').textContent='♥'.repeat(Math.max(0,health))+'♡'.repeat(3-Math.max(0,health));$('#power').textContent=pepper>0?'PEPPER '+Math.ceil(pepper)+'s':'';$('#bossbar').style.display=bossActive?'block':'none';$('#bossfill').style.width=(bossHealth/3*100)+'%';}
function showToast(s,seconds=2.8){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toastEl.classList.remove('show'),seconds*1000)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setMenu(name){menu=name;menuIndex=0;state=name==='title'?'title':'menu';idle=0;renderMenu()}
function renderMenu(){hud.classList.add('hidden');overlay.classList.remove('hidden');let html='';menuItems=[];
 const button=(label,action,sub='')=>{const i=menuItems.length;menuItems.push(action);return `<button class="choice ${i===menuIndex?'selected':''}" data-i="${i}"><span>${label}</span>${sub?`<small>${sub}</small>`:''}</button>`};
 if(menu==='title'){html=`<div class="title-card"><div class="eyebrow">A QUACKING ISLAND ADVENTURE</div><h1>FEATHER<br><em>DEEP</em> TROUBLE</h1><p class="tagline">One duck. One stolen charm. A whole heap of trouble.</p><div class="choices">${button('Start adventure',()=>startGame())}${button('Play together',()=>setMenu('online'),'2–4 players · parallel runs')}${button('How to play',()=>setMenu('help'))}${button('Settings',()=>{settingsReturn='title';setMenu('settings')})}${button('About & credits',()=>setMenu('about'))}</div><div class="hint">✕ SELECT &nbsp; · &nbsp; ↑↓ CHOOSE &nbsp; · &nbsp; CONTROLLER FIRST</div></div>`}
 if(menu==='help'){html=`<div class="panel"><div class="eyebrow">FIELD GUIDE</div><h2>Ready to ruffle feathers?</h2><p>Recover the tide charm from the ruins and rescue Auntie from a most unfortunate puffing-up spell.</p><div class="guide"><div><b>MOVE</b><span>Left stick / D-pad<br>Arrow keys or A / D</span></div><div><b>JUMP & STOMP</b><span>✕ / Space<br>Land on enemies from above</span></div><div><b>KICK</b><span>□ / X or J<br>Send crates into trouble</span></div><div><b>PAUSE</b><span>Options / Esc<br>Catch your breath</span></div></div><p>Collect coins, grab peppers for a short invincible charge, and find the flag checkpoint. Stomp the guardian three times, then claim the charm!</p>${button('Back',()=>setMenu('title'))}</div>`}
 if(menu==='settings'){html=`<div class="panel narrow"><div class="eyebrow">MAKE IT YOURS</div><h2>Settings</h2>${button('Horizontal axis',()=>{invertX=!invertX;saveSettings();renderMenu()},invertX?'INVERTED':'NORMAL')}${button('Vertical axis',()=>{invertY=!invertY;saveSettings();renderMenu()},invertY?'INVERTED':'NORMAL')}${button('Sound',()=>{sound=!sound;audio.setEnabled(sound);saveSettings();renderMenu()},sound?'ON':'OFF')}${button('Back',()=>settingsReturn==='play'?resume():setMenu(settingsReturn))}</div>`}
 if(menu==='about'){html=`<div class="panel about"><div class="eyebrow">A LITTLE COLOPHON</div><h2>About & credits</h2><p><b>Feather Deep Trouble</b> is an original island romp inspired by <i>Deep Duck Trouble Starring Donald Duck</i>.</p><p><b>Source information</b><br>Date: 2026-10-29 09:22<br>Source: Deep Duck Trouble Starring Donald Duck<br>Tech: Three.js r180 WebGPU, Rapier 0.19.3, Gamepad API, Web Audio, PeerJS 1.5.5, AI Hub Session 1.3.0<br>Art: original procedural cel-shaded 3D<br>Animation: procedural transforms and physics<br>Audio: synthesized music, effects and gibberish voice<br>Online: AI Hub parallel sessions and standalone WebRTC rooms via PeerJS signalling<br>Testing: lightweight Chrome headless smoke and syntax checks; headless GPU canvas failed to render, so visual and full-play verification remain open<br>Environment: Codex CLI (headless); Linux; browser Google Chrome<br>Model: OpenAI, gpt-6.1-terra, reasoning effort ultra<br>Usage: unknown</p><p><b>Testing feedback</b><br>Issues caught: 1 observed rendering failure in headless Chrome; critical: 1 in that test environment. Code review also found and fixed 10 integration and interface issues. Most helpful: browser smoke test. Least helpful: syntax check alone.</p><p><b>Engine feedback</b><br>Liked: expressive 3D scene composition. Guessing: WebGPU availability varies by browser. Built: platformer controls, content and menus. Hardest: physics and rendering integration. Overhaul: implicit renderer fallback. Change: clearer WebGPU initialization errors.</p><p><b>Prompt feedback</b><br>Liked: a clear controller-first creative brief. Confusing: standalone multiplayer protocol was unspecified. Hardest: fitting a complete adventure and networking into one file. Desired test: a real four-controller online playthrough.</p>${button('Back',()=>setMenu('title'))}</div>`}
 if(menu==='online'){html=`<div class="panel narrow"><div class="eyebrow">PARALLEL ADVENTURES</div><h2>Play together</h2><p>Race for the highest score on your own island. Share a six-letter room code with up to three friends.</p>${button('Create room',createRoom)}${button('Join room',()=>setMenu('code'))}${button('Back',()=>setMenu('title'))}<p class="fine">Internet and WebRTC required. AI Hub sessions connect automatically.</p></div>`}
 if(menu==='code'){html=`<div class="panel narrow"><div class="eyebrow">JOIN A FRIEND</div><h2>Enter room code</h2><p>Left / right choose a letter. Up / down change it.</p><div class="code">${[...lobbyCode].map((c,i)=>`<span class="${i===lobbyCursor?'active':''}">${c}</span>`).join('')}</div>${button('Connect',joinRoom)}${button('Back',()=>setMenu('online'))}</div>`}
 if(menu==='lobby'){html=`<div class="panel narrow"><div class="eyebrow">ISLAND PARTY</div><h2>Room ${escapeHtml(room?.code||'…')}</h2><p>Share this code. Everyone plays their own course; scores travel together.</p><div class="roster">${lobbyPlayers.map(p=>`<div>PLAYER ${p.seat}<span>${escapeHtml(p.label)}</span></div>`).join('')}</div>${room?.isHost?button('Start adventure',()=>room.start()):'<p>Waiting for the host to start…</p>'}${button('Leave room',()=>{room?.close();room=null;setMenu('online')})}</div>`}
 if(menu==='pause'){html=`<div class="panel narrow"><div class="eyebrow">TAKE A BREATHER</div><h2>Paused</h2>${button('Resume',resume)}${button('How to play',()=>{settingsReturn='pause';setMenu('pausehelp')})}${button('Settings',()=>{settingsReturn='pause';setMenu('settings')})}${button('Quit to title',()=>{room?.close();room=null;setMenu('title')})}</div>`}
 if(menu==='pausehelp'){html=`<div class="panel narrow"><h2>On the trail</h2><p>Move with the left stick. ✕ jumps; □ kicks nearby crates. Stomp enemies, collect coins, and use peppers to charge through trouble. Stomp the guardian three times to open the treasure.</p>${button('Back',()=>setMenu('pause'))}</div>`}
 if(menu==='over'){html=`<div class="panel narrow"><div class="eyebrow">${won?'CHARM RECOVERED':'A LITTLE SETBACK'}</div><h2>${won?'What a quacking rescue!':'Feathers everywhere!'}</h2><p>${won?'The tide charm is safe. Auntie is back to her usual size… and has quite a lot to say about it.':'The island got the better of you this time. Dust off those feathers and try again!'}</p><div class="result">${String(score).padStart(5,'0')} <small>POINTS</small></div>${room?`<div class="roster">${lobbyPlayers.map(p=>`<div>PLAYER ${p.seat}<span>${p.score} · ${escapeHtml(p.label)}</span></div>`).join('')}</div>`:''}${window.AIHub?.active?'':button('Play again',()=>{room?.close();room=null;startGame()})+button('Title',()=>{room?.close();room=null;setMenu('title')})}</div>`}
 overlay.innerHTML=html;overlay.querySelectorAll('button[data-i]').forEach(el=>{el.addEventListener('mouseenter',()=>{menuIndex=+el.dataset.i;highlight()});el.addEventListener('click',()=>{audio.unlock();menuIndex=+el.dataset.i;activate()})});}
let settingsReturn='title';
function highlight(){overlay.querySelectorAll('.choice').forEach((el,i)=>{el.classList.toggle('selected',i===menuIndex);if(i===menuIndex)el.scrollIntoView({block:'nearest'})})}
function activate(){if(menuItems[menuIndex]){audio.sfx('menu');menuItems[menuIndex]()}}
function saveSettings(){localStorage.setItem('feather-settings',JSON.stringify({invertX,invertY,sound}))}
function loadSettings(){try{const s=JSON.parse(localStorage.getItem('feather-settings')||'{}');invertX=!!s.invertX;invertY=!!s.invertY;sound=s.sound!==false;audio.setEnabled(sound)}catch{}}
function startGame(isAttract=false){attract=isAttract;paused=false;reset();state='play';overlay.classList.add('hidden');hud.classList.remove('hidden');$('#attract').classList.toggle('hidden',!attract);showToast(isAttract?'DEMO PLAY · PRESS ANY BUTTON':'Find the tide charm!',3);if(!isAttract)audio.voice()}
function resume(){state='play';paused=false;overlay.classList.add('hidden');hud.classList.remove('hidden')}
function finish(victory){if(state!=='play' && !(window.AIHub?.active && !won))return;won=victory;state='menu';menu='over';menuIndex=0;audio.sfx(victory?'win':'hurt');audio.voice();room?.progress(score,victory?'Finished':'Out');if(window.AIHub?.active)AIHub.result({score});renderMenu()}
function hurt(){if(invuln>0||pepper>0||attract)return;health--;invuln=1.5;audio.sfx('hurt');audio.voice();updateHud();if(health<=0){finish(false);return}body.setLinvel({x:-facing*5,y:8,z:0},true)}
function kick(){if(attackCooldown>0)return;attackCooldown=.35;audio.sfx('kick');playerParts.wing.rotation.z=-1;let p=body.translation();for(const c of crates){let q=c.rb.translation();if(Math.abs(q.x-p.x)<2.1&&Math.abs(q.y-p.y)<1.5&&Math.sign(q.x-p.x)===facing){c.rb.setLinvel({x:facing*13,y:3,z:0},true);c.hit=1.3;score+=10;break}}updateHud()}
function burst(x,y,color){for(let i=0;i<7;i++){let m=sphere(x,y,.6,.1,color);particles.push({m,vx:(Math.random()-.5)*5,vy:Math.random()*5+2,life:.6})}}
function pollInput(){let x=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),y=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);let jump=!!(keys.Space||keys.KeyZ),fire=!!(keys.KeyX||keys.KeyJ),back=!!keys.Backspace,pause=!!keys.Escape;const gp=Array.from(navigator.getGamepads?.()||[]).find(Boolean);if(gp){let gx=Math.abs(gp.axes[0])>.23?gp.axes[0]:0,gy=Math.abs(gp.axes[1])>.23?gp.axes[1]:0;x=gx||((gp.buttons[15]?.pressed?1:0)-(gp.buttons[14]?.pressed?1:0))||x;y=gy||((gp.buttons[13]?.pressed?1:0)-(gp.buttons[12]?.pressed?1:0))||y;jump=jump||!!gp.buttons[0]?.pressed;fire=fire||!!gp.buttons[2]?.pressed;back=back||!!gp.buttons[1]?.pressed;pause=pause||(!!gp.buttons[9]?.pressed&&!gp.buttons[8]?.pressed)}if(invertX)x=-x;if(invertY)y=-y;const now={x,y,jump,fire,back,pause};const edge={jump:jump&&!gpPrev.jump,fire:fire&&!gpPrev.fire,back:back&&!gpPrev.back,pause:pause&&!gpPrev.pause,x:Math.abs(x)>.5&&Math.abs(gpPrev.x||0)<.5,y:Math.abs(y)>.5&&Math.abs(gpPrev.y||0)<.5};Object.assign(gpPrev,now);lastInput={x,y,fire};return {now,edge}}
function inputMenu(now,edge){if(edge.y){if(menu==='code'&&menuIndex===0){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let i=alphabet.indexOf(lobbyCode[lobbyCursor]);let arr=[...lobbyCode];arr[lobbyCursor]=alphabet[(i+(now.y>0?1:-1)+alphabet.length)%alphabet.length];lobbyCode=arr.join('');renderMenu()}else if(menuItems.length){menuIndex=(menuIndex+(now.y>0?1:-1)+menuItems.length)%menuItems.length;highlight();audio.sfx('menu')}}if(edge.x&&menu==='code'){lobbyCursor=(lobbyCursor+(now.x>0?1:-1)+6)%6;renderMenu()}if(edge.jump)activate();if(edge.back||edge.pause){if(menu==='pause')resume();else if(menu==='settings'){if(settingsReturn==='play')resume();else setMenu(settingsReturn)}else if(menu==='lobby'){room?.close();room=null;setMenu('online')}else if(menu==='code')setMenu('online');else if(menu==='title'){settingsReturn='title';setMenu('settings')}else setMenu('title')}}
function roomEvent(type,data){if(type==='lobby'){lobbyPlayers=data.players;if(menu==='lobby')renderMenu()}if(type==='scores'){lobbyPlayers=data.players;if(menu==='over')renderMenu()}if(type==='start'){startAt=data.startAt;startGame();showToast('Race begins in 3…',3)}if(type==='error'||type==='end'){showToast(data.text||data.reason||'Connection closed',4)} }
async function createRoom(){try{room=new ParallelRoom(roomEvent);showToast('Opening room…',12);await room.host();lobbyPlayers=room.players;setMenu('lobby')}catch(e){room?.close();room=null;showToast('Could not create room: '+e.message,5)}}
async function joinRoom(){try{room=new ParallelRoom(roomEvent);showToast('Connecting…',12);await room.join(lobbyCode);lobbyPlayers=room.players;setMenu('lobby')}catch(e){room?.close();room=null;showToast('Could not join: '+e.message,5)}}
function simulate(dt,inp){elapsed+=dt;pepper=Math.max(0,pepper-dt);invuln=Math.max(0,invuln-dt);attackCooldown=Math.max(0,attackCooldown-dt);jumpBuffer=Math.max(0,jumpBuffer-dt);coyote=Math.max(0,coyote-dt);
 let p=body.translation(),vel=body.linvel();let x=inp.now.x;if(attract){x=1;if(elapsed%2.5<.15&&grounded)jumpBuffer=.2;if(elapsed>36){setMenu('title');attract=false;return}if(p.y<-2||elapsed%8<dt){body.setTranslation({x:Math.min(136,3+elapsed*4),y:4,z:0},true)}if(p.x>124&&elapsed%1<dt)jumpBuffer=.2;if(p.x>145){setMenu('title');attract=false;return}}
 if(startAt>Date.now() || (window.AIHub?.active && AIHub.time()<0)) return;
 if(inp.edge.jump)jumpBuffer=.16;if(inp.edge.fire)kick();if(x)facing=Math.sign(x);moveAxis=x;
 if(grounded)coyote=.12;if(jumpBuffer>0&&coyote>0){vel.y=10.5;jumpBuffer=0;coyote=0;grounded=false;audio.sfx('jump')}
 body.setLinvel({x:x*(pepper>0?9:6.3),y:vel.y,z:0},true);world.timestep=dt;world.step();p=body.translation();vel=body.linvel();
 // Downward ray provides forgiving ground detection across platforms and crates.
 const ray=new RAPIER.Ray({x:p.x,y:p.y-.75,z:0},{x:0,y:-1,z:0});const hit=world.castRay(ray,.22,true,undefined,undefined,undefined,body);grounded=!!hit&&vel.y<=.5;
 player.position.set(p.x,p.y-.83,0);player.rotation.y=facing<0?Math.PI:0;player.visible=invuln<=0||Math.floor(invuln*12)%2===0;playerParts.l.rotation.z=Math.sin(elapsed*13)*Math.abs(x)*.5;playerParts.r.rotation.z=-playerParts.l.rotation.z;playerParts.wing.rotation.z*=.8;
 if(p.y< -4){if(attract){body.setTranslation({x:Math.min(136,p.x+5),y:4,z:0},true)}else{hurt();body.setTranslation({x:checkpoint,y:3,z:0},true);body.setLinvel({x:0,y:0,z:0},true);showToast('Back to the last flag!')}}
 if(p.x>103&&checkpoint<100){checkpoint=103;audio.sfx('checkpoint');showToast('Checkpoint!');}
 for(const c of crates){const q=c.rb.translation();c.mesh.position.set(q.x,q.y,q.z);c.hit=Math.max(0,c.hit-dt);if(q.y< -6){c.mesh.visible=false}for(const e of enemies){if(e.alive&&c.hit>0&&Math.abs(q.x-e.x)<1&&Math.abs(q.y-.5)<1.5){e.alive=false;e.g.visible=false;score+=100;burst(e.x,.5,0xffc159);audio.sfx('stomp')}}}
 for(const e of enemies){if(!e.alive)continue;e.x+=e.dir*dt*1.3;if(Math.abs(e.x-e.base)>2)e.dir*=-1;e.g.position.x=e.x;e.g.rotation.z=Math.sin(elapsed*7)*.06;if(Math.abs(p.x-e.x)<.85&&Math.abs(p.y-1)<1.2){if(pepper>0||(vel.y< -1&&p.y>1.3)){e.alive=false;e.g.visible=false;score+=100;burst(e.x,.5,0xffc159);audio.sfx('stomp');if(pepper<=0)body.setLinvel({x:vel.x,y:8,z:0},true)}else hurt()}}
 for(const item of pickups){if(!item.alive)continue;item.g.rotation.y+=dt*2;item.g.position.y=item.y+Math.sin(elapsed*3+item.x)*.12;if(Math.abs(p.x-item.x)<.8&&Math.abs(p.y-item.y)<1){item.alive=false;item.g.visible=false;if(item.type==='coin'){score+=25;audio.sfx('collect')}else if(item.type==='pepper'){pepper=8;score+=50;audio.sfx('power');showToast('PEPPER POWER! Charge through trouble!')}else{health=Math.min(3,health+1);audio.sfx('collect')}burst(item.x,item.y,0xffe27b)}}
 bossActive=p.x>125&&bossHealth>0;boss.hit=Math.max(0,boss.hit-dt);if(bossHealth>0){boss.x+=boss.dir*dt*1.8;if(boss.x>141||boss.x<132)boss.dir*=-1;boss.g.position.x=boss.x;boss.g.position.y=Math.abs(Math.sin(elapsed*3))*.15;boss.g.visible=boss.hit===0||Math.floor(boss.hit*12)%2===0;if(Math.abs(p.x-boss.x)<1.5&&p.y<3.4){if(boss.hit===0&&(pepper>0||(vel.y< -1&&p.y>2))){bossHealth--;boss.hit=1;score+=500;audio.sfx('stomp');body.setLinvel({x:vel.x,y:10,z:0},true);burst(boss.x,2,0xffd84c);showToast(bossHealth?'Bonk! '+bossHealth+' hits to go!':'Guardian defeated! Grab the charm!')}else if(boss.hit===0)hurt()}}else boss.g.visible=false;
 if(p.x>145&&bossHealth<=0)finish(true);
 for(const v of particles){v.life-=dt;v.m.position.x+=v.vx*dt;v.m.position.y+=v.vy*dt;v.vy-=15*dt;v.m.scale.setScalar(Math.max(.01,v.life*1.6));if(v.life<=0){scene.remove(v.m)}}particles=particles.filter(v=>v.life>0);
 camera.position.x+=(p.x+2-camera.position.x)*Math.min(1,dt*3);camera.lookAt(camera.position.x,2,0);updateHud();if(elapsed-lastProgress>1){lastProgress=elapsed;room?.progress(score,`Island ${Math.min(100,Math.floor(p.x/146*100))}%`);if(window.AIHub?.active)AIHub.progress({score,label:`Island ${Math.min(100,Math.floor(p.x/146*100))}%`})}
}
async function init(){loadSettings();try{if(!navigator.gpu)throw Error('WebGPU is unavailable');await RAPIER.init();renderer=new THREE.WebGPURenderer({canvas,antialias:true});await renderer.init();if(!renderer.backend.isWebGPUBackend)throw Error('WebGPU adapter unavailable');renderer.setPixelRatio(Math.min(devicePixelRatio,2));reset();setMenu('title');resize();window.addEventListener('resize',resize);AIHub.probe(()=>({scene:state==='ready'||(AIHub.active&&state==='play'&&AIHub.time()<0)?'ready':state==='play'?'play':menu==='title'?'title':menu==='over'?'over':'menu',menu:menu==='settings',world:elapsed,input:lastInput}));if(window.AIHub?.active){state='ready';overlay.innerHTML='<div class="panel narrow"><h2>Getting ready…</h2></div>';AIHub.on('end',()=>{state='ended';audio.setEnabled(false);overlay.innerHTML='<div class="panel"><h2>Round complete</h2><p>Return to the hub for results.</p></div>';overlay.classList.remove('hidden')});AIHub.on('time-up',()=>finish(false));AIHub.connect({mode:'parallel',seats:[1,4]}).then(info=>{if(info){startGame();AIHub.ready()}else setMenu('title')})}
 renderer.setAnimationLoop(loop)}catch(e){console.error(e);if(window.AIHub?.active)AIHub.fail(e.message);overlay.innerHTML=`<div class="panel narrow"><div class="eyebrow">ONE SMALL SNAG</div><h2>WebGPU required</h2><p>This adventure needs a browser and device with WebGPU enabled. ${escapeHtml(e.message)}</p><button class="choice" onclick="location.reload()">Try again</button></div>`}}
function loop(){const dt=Math.min(clock.getDelta(),.033);audio.update();const inp=pollInput();const activity=Math.abs(inp.now.x)>.25||Math.abs(inp.now.y)>.25||inp.now.jump||inp.now.fire||inp.now.back||inp.now.pause||Object.keys(pressed).length>0;if(activity){idle=0;audio.unlock();if(attract){attract=false;setMenu('title');Object.assign(gpPrev,inp.now);inp.edge.jump=false;inp.edge.fire=false;inp.edge.pause=false;inp.edge.x=false;inp.edge.y=false}}else if(state==='title'){idle+=dt;if(idle>10)startGame(true)}if(state==='title'||state==='menu')inputMenu(inp.now,inp.edge);else if(state==='play'){if(inp.edge.pause&&!attract){if(window.AIHub?.active){settingsReturn='play';setMenu('settings')}else setMenu('pause');paused=true}else simulate(dt,inp)}for(const k in pressed)delete pressed[k];if(scene&&camera)renderer.render(scene,camera)}
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!keys[e.code])pressed[e.code]=true;keys[e.code]=true;audio.unlock()});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('pointerdown',()=>{idle=0;audio.unlock();if(attract){attract=false;setMenu('title')}});
if(matchMedia('(pointer: coarse)').matches&&!matchMedia('(pointer: fine)').matches){$('#touchNotice').classList.remove('hidden');$('#touchSettings').onclick=()=>{settingsReturn='title';setMenu('settings')}}
init();
