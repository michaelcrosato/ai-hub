<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Vesper Lane</title>
    <!--
      Initial Date: 2026-10-13
      SOURCE: Star Fox for SNES
      GAME ENGINE: Pixel Engine 0.29.0 (build 2026-10-12 2855472)
      Environment: Linux (WSL2), Grok Build CLI, Chromium
      Model and Effort Level: Grok 4.7. Effort level was not stated in the session. The prompt flag --budget nolimit is a budget flag, not a confirmed effort setting.
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #07060f; color: #efe7d2; font: 18px/1.45 ui-sans-serif, system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      #file-help { display: none; box-sizing: border-box; min-height: 100%; padding: 8vh 8vw; max-width: 42rem; }
      #file-help h1 { font-size: 2rem; margin: 0 0 0.6rem; }
      #file-help pre { background: #161226; padding: 0.8rem 1rem; overflow: auto; }
      #file-help a { color: #9ad7ff; }
    </style>
  </head>
  <body>
    <div id="file-help">
      <h1>Serve Vesper Lane over HTTP</h1>
      <p>This game is an ES module. Opening this file from a <code>file://</code> address does not load it, so the screen would stay blank.</p>
      <p>From the folder that contains this file, run:</p>
      <pre>python3 -m http.server 8000</pre>
      <p>Then open <a href="http://localhost:8000/">http://localhost:8000/</a>.</p>
    </div>
    <div id="app"></div>
    <script>
      if (location.protocol === 'file:') {
        document.getElementById('file-help').style.display = 'block';
      } else {
        const script = document.createElement('script');
        script.type = 'module';
        script.src = './game.js';
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
