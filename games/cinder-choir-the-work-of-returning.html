## Host it

For a single-file game, paste both scripts inline. Start every game with: const E = My3D2dge;

## Mental model
- The world is 3D: x east, y south, z up; one tile = 16 units. Game logic uses world units and dt, never pixels.
- A view projects the world to the screen. 'iso' (Diablo), 'threequarter' (Zelda), 'topdown', 'brawler' (Final
  Fight), 'side' (Mario: x right, z up, y = 0), 'overhead' (shmups, puzzles: world x/y = screen pixels once you call
  game.focus(W / 2, H / 2)). The same game runs in every view. In ground views, turn the stick or keys into a world
  direction with game.view.screenDirToGround(mx, my).
- update(dt) runs in fixed steps of about 1/120 s. Read input only there.
- draw(r) order: backgrounds first (r.sky, map.drawFloor + map.queueWalls, level.draw), then everything that can
  overlap through r.actor / r.sprite / r.queue (depth sorted), then the HUD through r.text / r.overlay (screen pixels).
- Characters are procedural rigs posed every step (E.Humanoid, E.Blob) or string sprites (E.sprite).
- Draw only with E.px, E.font, E.ui and r.*: they snap to whole pixels. ctx.arc / stroke / fillText and canvas
  gradients blur the pixel look.
- Errors show in a red box on screen and in the console; warnings start with "my-3D2dge:". Fix the first one first.

## Quick start: a complete game (title, play, win or lose)
```js quickstart
(() => {
const E = My3D2dge;
const game = new E.Game({ canvas: 'screen', res: 'ps1', view: 'threequarter', views: ['threequarter', 'iso', 'topdown'] });
const map = new E.TileMap({
  rows: ['################',
         '#@.....#.......#',
         '#......#...s...#',
         '#..s.......##..#',
         '#......~~.....s#',
         '################'],
  legend: { '#': 1, '@': 'hero', s: 'slime', '~': { floor: 'water', block: true } },   // number = wall type, string = spawn tag
  types: { 1: { h: 28, top: '#7a7090', side: '#4a4560', cut: true } },   // cut: walls in front of the floor drop low
  floorTex: (x, y, tag) => tag === 'water' ? E.tex.water(x, y) : E.tex.grass(x, y)
});
const flow = new E.FlowField(map);
let hero, rig, sword, slimes, hp, msg = '';
const title = {
  update() { if (game.input.pressed('start')) game.go('play'); },
  draw(r) {
    r.sky(['#101848', '#5a3a80']);
    r.overlay(g => E.font.title(g, 'SLIME FIELD', r.W / 2, 70, { scale: 3, align: 'center' }));
    r.text('PRESS ENTER', r.W / 2, 150, '#ffffff', { align: 'center', shadow: '#000', outline: false });
  }
};
const play = {
  pausable: true,
  enter() {
    const s = map.find('hero');
    hero = new E.Body({ x: s.x, y: s.y, r: 5 }); hero.facing = 0; hero.hurt = 0; hp = 3;
    rig = new E.Humanoid({ size: 1.3, outfit: 'tunic', hat: 'cap', colors: { cloth: '#3a8a4a', hair: '#e0b040' } });
    sword = new E.Attack('slash');
    slimes = map.findAll('slime').map(p => ({ body: new E.Body({ x: p.x, y: p.y, r: 6 }), rig: new E.Blob(), hp: 3, hit: 0 }));
    game.cam.bounds = v => map.bounds(v); game.follow(hero);
    game.audio.music('adventure');
  },
  update(dt) {
    const inp = game.input, m = inp.move(), d = game.view.screenDirToGround(m[0], m[1]);   // screen push -> ground direction
    hero.vx = d[0] * 85; hero.vy = d[1] * 85; hero.update(dt, map);
    if (Math.hypot(d[0], d[1]) > .1) hero.facing = Math.atan2(d[1], d[0]);
    if (inp.buffered('attack') && sword.start()) { inp.consume('attack'); game.audio.sfx('swing'); }
    sword.update(dt);
    sword.hits(slimes, s => E.inArc(hero, hero.facing, s.body, 24, 1.3), s => {
      s.hp--; s.hit = .15; E.knockback(hero, s.body, 200, 80);
      game.hitFx(s.body.x, s.body.y, 8, { damage: 1, angle: hero.facing });
    });
    flow.update(hero.x, hero.y); hero.hurt -= dt;
    for (const s of slimes) {
      const dir = flow.dir(s.body.x, s.body.y, hero.x, hero.y);
      s.body.vx = E.approach(s.body.vx, dir[0] * 30, 300 * dt); s.body.vy = E.approach(s.body.vy, dir[1] * 30, 300 * dt);
      s.body.update(dt, map); s.hit -= dt;
      s.rig.update(dt, { look: dir, squash: Math.sin(game.time * 9 + s.body.x) * .15 });
      if (E.overlap(hero, s.body) && hero.hurt <= 0) { hp--; hero.hurt = 1; E.knockback(s.body, hero, 220); game.audio.sfx('hurt'); game.shake(3); }
      if (s.hp <= 0) game.particles.explosion(s.body.x, s.body.y, 6, .7);
    }
    E.prune(slimes, s => s.hp <= 0);
    rig.update(dt, { x: hero.x, y: hero.y, z: hero.z, vx: hero.vx, vy: hero.vy, facing: hero.facing, attack: sword.state, hurt: hero.hurt > .7 });
    if (hp <= 0) game.go('end', 'GAME OVER'); else if (!slimes.length) game.go('end', 'YOU WIN');
  },
  draw(r) {
    map.drawFloor(r); map.queueWalls(r);                                   // background first, then depth-sorted things
    r.shadow(hero.x, hero.y, 6);
    r.actor(hero.x, hero.y, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view), { alpha: hero.hurt > 0 ? .6 : 1 });
    for (const s of slimes) {
      r.shadow(s.body.x, s.body.y, 6);
      r.actor(s.body.x, s.body.y, s.body.z, (g, ox, oy) => s.rig.draw(g, ox, oy, r.view), { flash: s.hit > 0 && '#ffffff' });
    }
    r.overlay(g => E.ui.hearts(g, 6, 6, hp, 3));                        // HUD in screen pixels
  }
};
const end = {
  enter(text) { msg = text; game.audio.music(null); game.audio.sfx(text === 'YOU WIN' ? 'powerup' : 'die'); },
  update() { if (game.input.pressed('start')) game.go('title'); },
  draw(r) { r.sky(['#000000', '#301830']); r.text(msg, r.W / 2, 100, '#ffe08a', { align: 'center', scale: 2 }); }
};
game.start({ scene: 'title', scenes: { title, play, end } });
})();
```

## API
Game: new E.Game({ canvas: 'screen', res, view, views, input, bg })
  res: 'nes' 256x240 | 'snes' 256x224 | 'genesis' 320x224 | 'gb' 160x144 | 'gba' 240x160 | 'ps1' 320x240 | 'wide' 400x225 | [w, h]
  input: 'DEFAULT' | 'PLATFORMER' | 'SHMUP' | your own { action: ['KeyQ', 'Pad0', 'Mouse0'] }
  start({ update(dt), draw(r) }) or start({ scene: 'title', scenes: { title: {...}, play: {...} } })
  scene: { enter(data), exit(), update(dt), draw(r), pausable, view, views, input, res }; go(name, data, { fade: .22 })
  camera: follow(obj, { z: 16, lead }) once, or focus(x, y, z) every update; cam.bounds = v => map.bounds(v);
    cam.room = [w, h] for screen-by-screen rooms (cam.moving is true while it slides); cam.smooth = .18 (0 = locked)
  juice: hitFx(x, y, z, { power: 1, damage, angle, color, sound }), freeze(s), shake(n), flash(color, s), timeScale = .25
  timers in game time: after(s, fn), every(s, fn) -> { cancel() }, cleared on scene change
  also: setView(id), nextView() (cycles views), note(text, s), mouseGround() -> [x, y] or null

## Recipes
Side-scroller (Mario, Mega Man): PlatformMap + Platformer + Humanoid, view 'side'.
```js platformer
(() => {
const E = My3D2dge;
const game = new E.Game({ canvas: 'screen', res: 'snes', view: 'side', views: ['side', 'brawler'], input: 'PLATFORMER' });
const level = new E.PlatformMap({
  rows: ['                                  ',
         '               ?                  ',
         '        ===             ==        ',
         '  @           g     ^^       g  F ',
         '#################  ###############'],
  legend: { '#': 1, '=': 2, '?': 3, '^': 4, '@': 'hero', g: 'walker', F: 'flag' },
  types: { 1: { style: 'ground', side: '#8a5a32' }, 2: { kind: 'oneway' }, 3: { style: 'bonus', side: '#e8a830' }, 4: { kind: 'hazard' } }
});
const start = level.find('hero'), flag = level.find('flag');
const hero = new E.Platformer({ x: start.x, z: start.z });
const rig = new E.Humanoid({ hat: 'cap', weapon: null, colors: { cloth: '#d83a2a', pants: '#3050c0' } });
const foes = level.findAll('walker').map(p => ({ x: p.x, z: p.z, w: 12, h: 12, vx: 0, vz: 0, dir: -1, rig: new E.Blob({ feet: true, colors: { base: '#a06030', dk: '#5a3018', lt: '#d09060' } }) }));
game.cam.bounds = v => level.bounds(v);
game.particles.ground = (x, y, z) => level.groundBelow(x, z);           // sparks and debris land on platforms
game.start({
  update(dt) {
    hero.update(dt, level, game.input);
    if (hero.jumped) game.audio.sfx('jump');
    if (hero.bumped && level.types[hero.bumped.id].style === 'bonus') { level.set(hero.bumped.cx, hero.bumped.cz, 1); game.audio.sfx('coin'); game.particles.glints(hero.x, 0, hero.z + 30, 6); }
    if (level.touching(hero, 'hazard') || hero.z < -40) { Object.assign(hero, { x: start.x, z: start.z, vx: 0, vz: 0 }); game.audio.sfx('hurt'); }
    for (const f of foes) {
      f.vz -= 800 * dt; f.vx = f.dir * 25; level.move(f, dt);
      const ahead = level.groundBelow(f.x + f.dir * 8, f.z);
      if (f.hitWall || ahead === null || ahead < f.z - 4) f.dir = -f.dir;   // turn at walls and ledges
      f.rig.update(dt, { look: [f.dir, 0], walk: 1 });
      if (!f.dead && E.overlapBox(hero, f)) {
        if (hero.vz < 0 && hero.z > f.z + f.h / 2) { f.dead = true; hero.vz = 220; game.audio.sfx('stomp'); game.particles.dust(f.x, 0, f.z, 8); }
        else { hero.knock(hero.x < f.x ? -1 : 1); game.audio.sfx('hurt'); }
      }
    }
    E.prune(foes, f => f.dead);
    if (Math.abs(hero.x - flag.x) < 8) { game.audio.sfx('powerup'); Object.assign(hero, { x: start.x, z: start.z }); }
    rig.update(dt, hero.rigState());
    game.focus(hero.x, 0, hero.z + 24);                                   // side view: y = 0, z is up
  },
  draw(r) {
    r.sky(['#5c94fc', '#a8c8ff']);
    level.draw(r);
    r.queue(flag.x, 0, flag.z, g => { const [x, y] = r.w(flag.x, 0, flag.z); E.px.rect(g, x, y - 40, 2, 40, '#e8e8e8'); E.px.poly(g, [[x + 2, y - 40], [x + 14, y - 35], [x + 2, y - 30]], '#40c040'); });
    for (const f of foes) r.actor(f.x, 0, f.z, (g, ox, oy) => f.rig.draw(g, ox, oy, r.view));
    r.actor(hero.x, 0, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view));
  }
});
})();
```
Shoot-'em-up (1942): view 'overhead', sprites, Bullets, a starfield.
```js shmup
(() => {
const E = My3D2dge, W = 224, H = 256;
const game = new E.Game({ canvas: 'screen', res: [W, H], view: 'overhead', views: ['overhead'], input: 'SHMUP' });
const SHIP = E.sprite(['...w...', '..wbw..', '.wwbww.', 'wwrwrww', 'w..r..w'], { w: '#e8f0ff', b: '#3a7aff', r: '#ff5030' }, 2);
const FOE = E.sprite(['r.....r', '.rrrrr.', 'rryyyrr', '.r.r.r.'], { r: '#d03040', y: '#ffd040' }, 2);
const shots = new E.Bullets(game), ship = { x: W / 2, y: H - 30, r: 4 }, foes = [];
let score = 0, cool = 0, spawn = 0;
game.start({
  update(dt) {
    game.focus(W / 2, H / 2);                                            // overhead: world x/y = screen pixels
    const m = game.input.move();
    ship.x = E.clamp(ship.x + m[0] * 120 * dt, 8, W - 8); ship.y = E.clamp(ship.y + m[1] * 120 * dt, 8, H - 8);
    if ((cool -= dt) <= 0 && game.input.down('fire')) { cool = .12; shots.fire({ x: ship.x, y: ship.y - 10, vy: -300, team: 'player' }); game.audio.sfx('shoot'); }
    if ((spawn -= dt) <= 0) { spawn = .9; foes.push({ x: E.rand(20, W - 20), y: -10, r: 7, hp: 3, t: 0 }); }
    for (const f of foes) {
      f.t += dt; f.y += 40 * dt; f.x += Math.sin(f.t * 3) * 40 * dt;
      if (E.chance(dt * .6)) shots.burst({ x: f.x, y: f.y, team: 'foe', color: '#ff6080' }, [E.pattern.aim(f, ship, 90)]);
    }
    shots.update(dt);
    shots.hit(foes, (b, f) => { f.hp--; game.particles.sparks(b.x, b.y, 0, 4); }, 'player');
    for (const f of foes) if (f.hp <= 0) { score += 100; game.particles.explosion(f.x, f.y, 0, .8); }
    E.prune(foes, f => f.hp <= 0 || f.y > H + 20);
    if (shots.hit([ship], () => {}, 'foe')) { game.flash('#ff4040', .2); game.audio.sfx('hurt'); score = 0; }
  },
  draw(r) {
    r.sky(['#000010', '#101040']); r.starfield({ dir: 'down', speed: 40 });
    for (const f of foes) r.sprite(f.x, f.y, 0, FOE, { anchor: 'center' });
    r.sprite(ship.x, ship.y, 0, SHIP, { anchor: 'center' });
    shots.draw(r);
    r.text('SCORE ' + score, 4, 4, '#ffffff', { shadow: '#000', outline: false });
  }
});
})();
```

## Rules
1. World units and dt everywhere. Feel numbers (units per second, tile = 16): walk 70-90, run 95-140, jump 250-320
   with gravity 800, dash 200-260, player bullets 250-320, enemy bullets 70-120, enemies 25-45.
2. At 320x240, heroes are 40-60 px tall (Humanoid size 1.2-1.4), bosses size 1.8-2.4; hitboxes smaller than the art.
3. Every hit gets game.hitFx; deaths get particles.explosion; sounds on jump, hit, pickup and death; music per scene.
4. A title scene, play scenes with pausable: true, and a game-over or win path back to the title.
5. Dress every character (outfit, hat, colors) and give each its own moves; enemies wind up slower than the hero.
6. Nothing on screen? The camera looks elsewhere: game.follow(hero) or game.focus(...) every update (side: y = 0).

(function (root) {
'use strict';
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const E = { version: '0.17.2', build: 'dev-build', edition: 'agent', name: 'my-3D2dge', TAU, DEG, current: null };   // build: the commit, stamped at deploy
E.versionLabel = () => 'v' + E.version + ' · ' + E.build;
const _warned = new Set();   // one console warning per distinct problem, prefixed 'my-3D2dge:'
const warn = (key, msg) => { if (_warned.has(key)) return; _warned.add(key); console.warn('my-3D2dge: ' + msg); };
E.warn = warn;

// ---- 1. MATH, COLOR, HELPERS ----
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (a, b, s) => a < b ? Math.min(b, a + s) : Math.max(b, a - s);
const ease = {
  outCubic: u => 1 - Math.pow(1 - u, 3),
  outQuad: u => 1 - (1 - u) * (1 - u),
  inQuad: u => u * u,
  inOut: u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2,
  outBack: u => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); }
};
const angDiff = (a, b) => ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;

  "quests": [
    {
      "id": "harbor",
      "title": "What the Water Kept",
      "arc": "main",
      "location": "quay",
      "summary": "Challenge a false cargo claim. Choose what a repaired harbor should protect.",
      "requires": [],
      "steps": [
        {
          "id": "brief",
          "title": "Speak to Ada at the harbor desk",
          "target": "quay:ada",
          "kind": "talk",
          "lines": [
            {
              "who": "Ada",
              "text": "The engine is taking cargo from boats that arrived during the flood. It says their owners used a closed landing. That landing was the only dry one."
            },
            {
              "who": "Iona",
              "text": "Who can release the claim?"
            },
            {
              "who": "Ada",
              "text": "A clerk with two independent records. Or a machine with no power. I would prefer a record that survives after we leave."
            },
            {
              "who": "Brann",
              "text": "Then we make both safe. The people first. The record after."
            }
          ]
        },
        {
          "id": "proof",
          "title": "Find two independent records",
          "target": [
            "quay:ledger",
            "quay:witness",
            "quay:soundings"
          ],
          "kind": "gather",
          "lines": [
            {
              "who": "Pax",
              "text": "Dates tell us when somebody wrote a thing. They do not prove when it happened. Compare the water, the bell, and the boat."
            },
            {
              "who": "Ada",
              "text": "Two records let me stop the order. A third will also let us isolate the engine before it fights. You can inspect all three before you proceed."
            }
          ],
          "need": 2
        },
        {
          "id": "channels",
          "title": "Set a safe tide distribution",
          "target": "quay:tideboard",
          "kind": "puzzle",
          "lines": [
            {
              "who": "Nera",
              "text": "Water never reads a permit. Give it a route before you touch the chain."
            },
            {
              "who": "Pax",
              "text": "The old outer pipe can take one measure at most. The center sluice can take the load."
            }
          ],
          "puzzle": {
            "type": "dials",
            "labels": [
              "Inner",
              "Center",
              "Outer"
            ],
            "max": 3,
            "initial": [
              0,
              0,
              0
            ],
            "rule": "tide",
            "hint": "Send six measures in total. Center ≥ 2. Outer ≤ 1. More than one plan works."
          },
          "effects": {
            "sluice": true
          }
        },
        {
          "id": "engine",
          "title": "Stop the seizure engine",
          "target": "quay:chain",
          "kind": "battle",
          "lines": [
            {
              "who": "Ada",
              "text": "I have suspended the order. It is still turning."
            },
            {
              "who": "Brann",
              "text": "An instruction can outlive its reason. We will stop the teeth without dropping the chain on the boats."
            }
          ],
          "battle": "seizure"
        },
        {
          "id": "policy",
          "title": "Choose the harbor settlement",
          "target": "quay:ada",
          "kind": "choice",
          "lines": [
            {
              "who": "Ada",
              "text": "There is enough money for one immediate change. A public claims desk would make this harder to hide. A return fund would put damaged boats back in the water."
            },
            {
              "who": "Iona",
              "text": "Which is the right answer?"
            },
            {
              "who": "Ada",
              "text": "They answer different injuries. Tell me which one we start with. I will write down the work we still owe."
            }
          ],
          "choices": [
            {
              "id": "records",
              "label": "Open a public claims desk",
              "detail": "The desk funds one free tool upgrade. Returning residents discuss their claims.",
              "flag": "harborPolicy"
            },
            {
              "id": "boats",
              "label": "Start a boat return fund",
              "detail": "Gain two extra tonics at each rest. Returning residents repair the ferry.",
              "flag": "harborPolicy"
            }
          ]
        },
        {
          "id": "bridge",
          "title": "Release the return bridge",
          "target": "quay:bridge",
          "kind": "repair",
          "lines": [
            {
              "who": "Brann",
              "text": "There. Not a ceremonial opening. A hinge anybody can reach."
            },
            {
              "who": "Nera",
              "text": "People used to have to call across the water for permission."
            },
            {
              "who": "Iona",
              "text": "Now they can cross close enough to be heard."
            }
          ],
          "effects": {
            "quayBridge": true
          }
        },
        {
          "id": "report",
          "title": "Return to Ada",
          "target": "quay:ada",
          "kind": "talk",
          "lines": [
            {
              "who": "Ada",
              "text": "The boats are free. The owners have their names back. I have put a copy of the ruling where rain cannot reach it."
            },
            {
              "who": "Pax",
              "text": "The mine needs an anchor repaired. The theater needs a signal lens. Both feed the relay above the ridge."
            },
            {
              "who": "Ada",
              "text": "Go in either order. For once, the whole city does not need to stand in one queue."
            }
          ]
        }
      ],
      "reward": {
        "gold": 65

      "epilogue": "Ada keeps the false claim beside its correction. Neither page is allowed to stand alone."

    {

            {
              "who": "Brann",
              "text": "We can shut the pumps down."

              "who": "Leto",
              "text": "Not until the surveyor is clear. She stayed to mark the air pockets. The machine thinks she is a pressure sensor."

              "text": "Do not follow the red needle. Follow the water mark. Salt has reached the air line."

function shop(){setPanel('shop','Dena’s tool bench','ONE TOOL, MADE SOUND',()=>{para('Each improvement adds 3 attack, 12 HP, and 2 MP. Each tool has two improvements. No tool or pattern is consumed.');para('Gold: '+s.gold);for(const h of s.heroes){const free=s.flags.harborPolicy==='records'&&!s.flags.freeTool,cost=free?0:50,t=R.stats(h);const b=button(t.name+' · '+(h.upgrade>=2?'fully improved':'+1 tool · '+cost+' gold'),()=>{if(R.upgrade(s,h.id)){save();shop();toast('Tool improved: '+t.name);}else toast('Not enough gold, or the tool is already finished.');},undefined,'wide');b.disabled=h.upgrade>=2||s.gold<cost;}button('Back',closePanel);});}
function download(name,text){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function menu(){setPanel('menu','A moment on the road','MENU',()=>{button('Resume',closePanel,undefined,'wide primary');button('Company and preparation',()=>party(),undefined,'wide');button('Available work and journal',journal,undefined,'wide');button('Local map and connected places',localMap,undefined,'wide');button('Save this pack',()=>{if(save())toast('Side-story save written.');},undefined,'wide');button('Export this pack’s save',()=>download('cinder-return-save.json',JSON.stringify(s,null,2)),undefined,'wide');
 const file=document.createElement('input');file.type='file';file.accept='.json,application/json';file.hidden=true;$('panelbody').appendChild(file);button('Import this pack’s save',()=>file.click(),undefined,'wide');file.onchange=async()=>{const f=file.files[0];if(!f)return;try{if(f.size>2e6)throw new Error('File is too large.');const next=R.validate(JSON.parse(await f.text()));closePanel();start(next,false);toast('Side-story save imported.');}catch(e){toast('Import rejected: '+e.message,true);}};
 const settings=document.createElement('div');settings.className='settings';$('panelbody').appendChild(settings);
 for(const [k,label]of [['sound','Original music and sound'],['motion','Motion and battle effects']]){const l=document.createElement('label'),v=document.createElement('input');v.type='checkbox';v.checked=s.options[k];v.onchange=()=>{s.options[k]=v.checked;game.reduceMotion=!s.options.motion;music();save();};l.append(v,document.createTextNode(label));settings.appendChild(l);}
 const lab=document.createElement('label'),select=document.createElement('select');for(const [value,text]of [['normal','Normal challenge'],['story','Story · lower enemy health']]){const o=document.createElement('option');o.value=value;o.textContent=text;select.appendChild(o);}select.value=s.options.difficulty;select.disabled=!!s.battle;select.onchange=()=>{s.options.difficulty=select.value;save();};lab.append('Difficulty ',select);settings.appendChild(lab);
 button('Full screen',()=>{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();p?.catch(()=>toast('Full screen is not available in this browser.'));},undefined,'wide');button('Controls and help',help,undefined,'wide');button('About this pack',about,undefined,'wide');if(s.flags.finished)button('Read the ending again',ending,undefined,'wide');});}
function help(){setPanel('help','Controls and play','FIELD GUIDE',()=>{para('Move: WASD, arrow keys, touch arrows, or controller stick. E or Space: interact. Shift: run. M: map. J: journal. Escape: menu. Dialogues and menus accept Enter and direction keys.');para('Open the local map for the exact route. Gates and water use real collision. Each stage names its next object. You can change the tracked quest from Journal.');para('Battle time stops while you choose. A skill costs 4 MP. Weakness hits build Break. At three Break, the enemy loses its pending timing and recovers slowly. Cover protects the whole party and the worker. Focus restores MP and removes Silence.');para('Mend and tonics revive fallen allies. Chorus attacks every enemy at 60 points. In the pump encounter, Secure wins after three uses, but the worker must survive.');para('Wrong puzzle settings have no penalty. Partial settings are saved. Rest is free. Retry and retreat restore pre-battle resources. Use Menu → Export to keep a backup.');button('Back to menu',menu);});}
function ending(){const lines=[{who:'West Relay',text:s.flags.ending==='watch'?'On the first morning, a clerk, a miner, and a musician take turns at the return horn. Each writes down the calls they could not answer. A promise becomes a schedule, and the schedule can be challenged.':'On the first morning, three districts call at once. Nobody can understand them. They try again, taking turns by agreement instead of permission. An open channel becomes a practice, not a miracle.'},...D.quests.filter(q=>R.done(s,q.id)).map(q=>({who:q.title,text:q.epilogue})),{who:'Iona',text:'The roads are not finished. They are being used. For now, that is the better promise.'}];dialogue('The work of returning',lines,()=>{setPanel('ending','A return, not a conclusion','SIDE STORY COMPLETE',()=>{para('Completed quests: '+D.quests.filter(q=>R.done(s,q.id)).length+' / '+D.quests.length+'. You can finish the side stories and revisit the changed residents. The ending record will include that work.');button('Keep exploring',closePanel,undefined,'primary');button('Read the field record',fieldRecord);});});}
function companyHTML(h,battle=false){const t=battle?h:R.stats(h),max=battle?h.max:t.hp,mpmax=battle?h.maxMP:t.mp;return '<div class="company-card '+(battle&&s.battle.ready===h.id?'ready':'')+'"><b>'+esc(t.name)+'</b><small>'+Math.ceil(h.hp)+' / '+max+' HP</small><div class="bar"><i style="width:'+100*h.hp/max+'%"></i></div><div class="bar mp"><i style="width:'+100*h.mp/mpmax+'%"></i></div></div>';}
function syncUI(){const combat=!!s.battle;$('hud').hidden=!active;$('objective').hidden=!active||combat;$('interact').hidden=!active||combat||!near;$('company').hidden=!active||combat;$('touch').hidden=!active||combat||!matchMedia('(pointer:coarse)').matches;$('battlehud').hidden=!active||!combat;$('region').textContent=D.maps[s.map].region;$('place').textContent=D.maps[s.map].name;
 document.body.classList.toggle('touch-mode',matchMedia('(pointer:coarse)').matches);$('company').innerHTML=s.heroes.map(h=>companyHTML(h)).join('');
 const q=R.Q[s.tracked],st=R.step(s,s.tracked),target=R.objects[currentTarget()];$('questlabel').textContent=q?.title||'THE COMPANY';$('tasktitle').textContent=st?.title||'Return to the places you changed.';$('taskdetail').textContent=s.escort?'Escort in progress · stay near Edda':target?D.maps[target.map].name+' · '+target.name:'All eight stories can be completed.';if(near)$('interact').firstChild.textContent=R.objects[near].kind==='exit'?'Travel ':R.objects[near].kind==='rest'?'Rest ':'Interact ';if(combat)battleUI();}
function battleUI(){const b=s.battle,key=[b.status,b.ready,b.serial,selectedCommand].join(':');if(battleUiKey===key)return;battleUiKey=key;const el=$('battlehud');el.replaceChildren();el.innerHTML='<div class="eyebrow">WAIT-MODE BATTLE</div><div class="battle-title">'+esc(D.encounters[b.id].name)+'</div>';
 for(const e of b.foes.filter(x=>x.hp>0)){const d=document.createElement('div');d.className='intent';d.innerHTML='<strong>'+esc(e.name)+'</strong> · '+esc(e.weak)+' weakness<br>'+esc(R.intent(e).name)+' · '+Math.ceil(e.hp)+' HP · Break '+e.break+'/3';el.appendChild(d);}
 const cards=document.createElement('div');cards.className='battle-party';cards.innerHTML=b.heroes.map(h=>companyHTML(h,true)).join('');el.appendChild(cards);para('Chorus '+b.chorus+'/100'+(b.worker!==null?' · Worker '+b.worker+'/100 · Locks '+b.secure+'/3':''),el,'battle-note');
 if(b.status==='won'){button('Keep the result and continue',()=>{if(R.settleBattle(s)){selectedCommand=null;resetField();save();syncUI();toast('The field work continues.');}},el,'wide primary');return;}
 if(b.status==='lost'){para('The company must withdraw. No resources are lost on retry.',el);button('Retry encounter',()=>{const {id,quest,token}=b;R.retreat(s);R.startBattle(s,id,quest,token);battleUiKey='';selectedCommand=null;save();battleUI();},el,'wide primary');button('Return to the field',()=>{R.retreat(s);resetField();save();syncUI();},el,'wide');return;}
 if(b.ready){const h=b.heroes.find(x=>x.id===b.ready);para(h.name+' · '+h.mp+' MP · '+(h.status.silence?'Silenced':'Choose an action'),el,'battle-who');if(selectedCommand){const c=R.commands(s).find(x=>x.id===selectedCommand);if(c){para(c.text,el,'battle-note');for(const t of c.target==='foe'?b.foes.filter(x=>x.hp>0):b.heroes)button(t.name+' · '+Math.ceil(t.hp)+'/'+t.max+' HP'+(t.team==='foe'?' · '+t.weak:''),()=>doCommand(selectedCommand,t.id),el,'target-button');button('Back to commands',()=>{selectedCommand=null;battleUiKey='';battleUI();},el);}}else{const grid=document.createElement('div');grid.className='battle-commands';el.appendChild(grid);for(const c of R.commands(s)){const x=button(c.name,()=>{if(['foe','hero'].includes(c.target)){selectedCommand=c.id;battleUiKey='';battleUI();}else doCommand(c.id,null);},grid);x.disabled=!c.enabled;x.title=c.text;}}}else para('Gauges are filling. Read the announced enemy intent.',el,'battle-note');
 para(b.log.at(-1),el,'battle-note');button('Retreat · restore entry resources',()=>{setPanel('retreat','Withdraw safely?','BATTLE',()=>{para('Return to the field with your pre-battle HP, MP, and tonics. The encounter will still be waiting.');button('Withdraw',()=>{R.retreat(s);closePanel();resetField();save();syncUI();},undefined,'primary');button('Stay in battle',closePanel);});},el,'wide');}
function doCommand(c,t){if(R.command(s,c,t)){selectedCommand=null;battleUiKey='';A.battleEvent(s,game);save();battleUI();}}
function battleLayout(){const box=$('battlehud').getBoundingClientRect(),scale=game.W/innerWidth,side=(innerWidth>900||innerHeight<=520);return {w:side?Math.max(190,box.left*scale-10):game.W,h:side?game.H-18:Math.max(170,box.top*scale-14),top:Math.min(80,75*scale)};}
function modalInput(){const I=game.input;if(I.pressed('cancel')||I.pressed('pause')){closePanel();return;}const list=[...$('panelbody').querySelectorAll('button:not(:disabled),input:not([hidden]),select')];let i=list.indexOf(document.activeElement);if(I.repeat('down'))list[(i+1)%list.length]?.focus();if(I.repeat('up'))list[(i-1+list.length)%list.length]?.focus();if(I.pressed('confirm')&&document.activeElement?.tagName==='BUTTON')document.activeElement.click();}
function update(dt){if(toastTime>0&&(toastTime-=dt)<=0)$('toast').classList.remove('on');if(!active){A.update(dt,s,hero,trail);game.focus(hero.x-30,hero.y-45,0);return;}if($('panel').open){modalInput();return;}
 if(game.input.pressed('pause')){menu();return;}if(game.input.pressed('map')){localMap();return;}if(game.input.pressed('journal')){journal();return;}
 s.seconds+=dt;
 if(s.battle){R.tickBattle(s,dt);A.battleEvent(s,game);A.stepFx(dt);A.update(dt,s,hero,trail);if((hudTime+=dt)>.1){hudTime=0;syncUI();}if((saveTime+=dt)>3){saveTime=0;save();}return;}
 const m=game.input.move(),v=game.view.screenDirToGround(m[0],m[1]),speed=game.input.down('run')?115:76;
 const old=[hero.x,hero.y];hero.vx=v[0]*speed;hero.vy=v[1]*speed;hero.update(dt,A.mapView(s.map,s.flags).map);if(Math.hypot(...v)>.01)hero.facing=Math.atan2(v[1],v[0]);s.pos=[hero.x,hero.y];
 if(!trail.length||Math.hypot(trail[0][0]-hero.x,trail[0][1]-hero.y)>2.5){trail.unshift([hero.x,hero.y]);trail.length=Math.min(55,trail.length);}
 if(R.moveEscort(s,dt)){save();toast('Edda reached clear air. The escort is complete.');}
 A.update(dt,s,hero,trail);game.cam.offset=[0,-Math.min(45,game.H*.07)];game.focus(hero.x,hero.y,12);
 near=D.maps[s.map].objects.map(o=>s.map+':'+o.id).filter(k=>R.inRange(s,k)).sort((a,b)=>Math.hypot(s.pos[0]-(R.objects[a].x+.5)*16,s.pos[1]-(R.objects[a].y+.5)*16)-Math.hypot(s.pos[0]-(R.objects[b].x+.5)*16,s.pos[1]-(R.objects[b].y+.5)*16))[0]||null;
 const tar=routeTarget&&R.objects[routeTarget].map===s.map?routeTarget:fieldTarget(),rk=[s.map,s.pos.map(n=>Math.floor(n/16)),tar,!!s.flags.quayBridge].join('|');if(rk!==routeKey){routeKey=rk;const o=R.objects[tar];route=o?R.path(R.geometry(s.map,s.flags),s.pos.map(n=>n/16),[o.x,o.y]):null;}
 if(game.input.pressed('interact'))interact();if((hudTime+=dt)>.16){hudTime=0;syncUI();}if((saveTime+=dt)>3){saveTime=0;save();}}
function draw(r){if(active&&s.battle)A.battle(r,s,battleLayout());else A.field(r,s,hero,trail,routeTarget||fieldTarget(),route);}
$('interact').onclick=()=>interact();$('mapbutton').onclick=localMap;$('hintbutton').onclick=localMap;$('journalbutton').onclick=journal;$('menubutton').onclick=menu;
for(const b of document.querySelectorAll('[data-move],#run')){const k=b.id==='run'?'TouchRun':'Touch'+b.dataset.move[0].toUpperCase()+b.dataset.move.slice(1);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);game.input.press(k);};for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>game.input.release(k));}
addEventListener('blur',()=>{if(active){save();if(!$('panel').open)menu();}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){save();if(!$('panel').open)menu();}});addEventListener('pagehide',save);addEventListener('resize',()=>{game.screen.setOptions({minW:innerWidth<600?320:480,maxW:1400,maxH:1400});game.cam.snap=true;});
resetField();game.start({update,draw});
// Test handles are opt-in. The regular game exposes only a read-only snapshot.
rootSnapshot();function rootSnapshot(){globalThis.returnSnapshot=()=>R.clone({map:s.map,quests:s.quests,flags:s.flags,position:s.pos,battle:s.battle,errors:game.errors});}
if(globalThis.RETURN_TEST===true||new URLSearchParams(location.search).has('test'))globalThis.__returnTest={get state(){return s;},get game(){return game;},get near(){return near;},R,start,task,taskControl,interact,localMap,journal,menu,ending,save,closePanel,currentTarget,step(dt){update(dt);},teleport(key){const o=R.objects[key];if(!o)throw Error('Unknown target');if(!R.visit(s,o.map)&&s.map!==o.map)throw Error('Locked map');s.pos=[(o.x+.5)*16,(o.y+.5)*16];resetField();near=key;syncUI();},load(raw){start(R.validate(raw),false);},get route(){return route;}};
})();
