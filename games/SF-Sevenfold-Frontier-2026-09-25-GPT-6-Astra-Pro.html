ing can raise a fallen ally only while LP remains. WP powers physical arts and JP powers magic.</p><p>Inns and waystones restore the entire party for credits. Sanctuary Stones restore it for free. Healing supplies are usable from Inventory and in battle.</p></section><section class="card"><h3>${SF.icon('spark')} Four kinds of growth</h3><p>Humans improve through actions. Sword and fist arts may glimmer with an open skill slot; gun techniques develop after battles. Equip no more than eight arts.</p><p>Mecs grow from equipment and downloaded programs. Monsters absorb abilities and change form. Mystics gain attributes and arts by finishing suitable enemies with mystic weapons. Asellus can follow both paths.</p></section><section class="card"><h3>${SF.icon('book')} Gifts and specialization</h3><p>Owning spells is not the same as earning their gift. Regional trials unlock advanced schools. Opposite gifts and magic schools are incompatible until Blue’s story changes that rule.</p><p>Equip at least six physical arts with no magic, or six magic arts with no physical ones, to receive a one-point resource discount. Passive arts and equipment traits work in battle.</p></section><section class="card"><h3>${SF.icon('save')} Explore without losing your place</h3><p>Each of the seven journeys has its own local save. Export saves from Options for portability. A lost battle offers Retry or a paid retreat; a dungeon recall is also available from Options.</p><p>Challenge, effects, battle speed and touch controls are adjustable. This fan edition adds explicit guidance and forgiving recovery; its maps and trial interactions are original reconstructions.</p></section></div>`, { wide: true, menu: 'help', kicker: 'CONTROLS & FIELD MANUAL', footer: `<span>Touch targets, dialogue and every command are also mouse-accessible.</span>${this.btn('Understood', 'close', '', 'primary')}` }); }
