  const fov = c.boosting ? 70 : 62;
  if (Math.abs(camera.fov - fov) > 0.1) {
    camera.fov += (fov - camera.fov) * dt * 4;
    camera.updateProjectionMatrix();
  }
}
function frame(now2) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.07, (now2 - lastFrame) / 1e3);
  lastFrame = now2;
  clock += dt;
  ownInput = readInput(now2);
  if (!ready) return;
  const settingsOpen = menu === "settings";
  const paused = settingsOpen && !net.active;
  if (paused)
    audio.update(dt, { speed: 0, throttle: 0, boost: false, skid: 0 });
  const hasRound = round && (state === "play" || state === "countdown");
  if (hasRound && !paused && !net.ended) {
    if (state === "countdown") {
      if (net.active) {
        if (net.time() >= 0) {
          state = "play";
          audio.play("go");
          audio.voice("go");
        }
      } else {
        countdown -= dt;
        if (countdown <= 0) {
          state = "play";
          audio.play("go");
          audio.voice("go");
        }
      }
      const n = Math.ceil(net.active ? -net.time() / 1e3 : countdown);
      if (n < lastCount && n > 0) {
        lastCount = n;
        audio.play("countdown");
      }
    }
    if (state === "play") {
      accumulator = Math.min(accumulator + dt, 0.1);
      const localId = net.active ? net.localId : 0;
      while (accumulator >= 1 / 60) {
        const inputs = {
          ...remoteInputs,
          [localId]: settingsOpen ? {} : ownInput
        };
        if (attract) inputs[0] = round.inputAI(round.cars[0], 1 / 60);
        round.step(1 / 60, inputs, !net.active || net.isHost);
        worldSeconds += 1 / 60;
        accumulator -= 1 / 60;
      }
      if (net.active) {
        const c2 = round.local(localId);
        if (c2 && !net.isHost) {
          const v = c2.body.linvel();
          net.sendInput({
            ...ownInput,
            teleport: c2.netTeleport,
            pose: [c2.x, c2.z, c2.yaw, v.x, v.z].map(
              (n) => Math.round(n * 100) / 100
            )
          });
        }
        if (net.isHost) net.sendSnapshot(round.snapshot());
        if (c2) net.progress(c2.score, `${c2.kills} totalled`);
        if (net.hub && net.time() > 0 && net.isHost)
          round.time = net.time() / 1e3;
      }
      if (attract) {
        attractTime += dt;
        if (attractTime > 35 || round.over) {
          attractIndex = (attractIndex + 1) % 3;
          startRound({
            mode: ["arena", "race", "survival"][attractIndex],
            car: attractIndex,
            attract: true
          });
        }
      }
    }
    const c = round.local(net.active ? net.localId : 0) || round.cars[0];
    audio.update(dt, {
      speed: Math.abs(c.speed),
      throttle: ownInput.throttle || attract ? 1 : 0,
      boost: c.boosting,
      skid: !!ownInput.handbrake
    });
  }
  if (menu === "title" && !attract) {
    const idle = (now2 - lastInputTime) / 1e3;
    const hint = $("#idlehint");
    if (hint)
      hint.textContent = `EXHIBITION IN ${Math.max(0, Math.ceil(10 - idle))}s`;
    if (idle >= 10) startAttract();
  }
  flash = Math.max(0, flash - dt * 1.5);
  shake = Math.max(0, shake - dt * 3);
  $("#flash").style.opacity = flash;
  updateVisuals(paused ? 0 : dt);
  updateHUD();
  renderer.render(scene, camera);
}
async function boot() {
  try {
    if (!navigator.gpu)
      throw new Error(
        "WebGPU is required. Open on HTTPS or localhost in a WebGPU-enabled browser."
      );
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter)
      throw new Error(
        "No WebGPU adapter is available. Enable hardware acceleration in your browser."
      );
    await initPhysics();
    scene = new THREE2.Scene();
    camera = new THREE2.PerspectiveCamera(
      62,
      innerWidth / innerHeight,
      0.1,
      1e3
    );
    renderer = new THREE2.WebGPURenderer({
      canvas: $("#canvas"),
      antialias: true,
      forceWebGL: false
    });
    await renderer.init();
    if (!renderer.backend.isWebGPUBackend)
      throw new Error(
        "This game requires native WebGPU; WebGL fallback is disabled."
      );
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE2.PCFSoftShadowMap;
    renderer.toneMapping = THREE2.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;
    ready = true;
    window.__crunchReady = true;
    saveSettings();
    bootResolve();
    $("#loading").classList.add("hidden");
    if (!net.hub) title();
    else state = "ready";
    if (matchMedia("(pointer:coarse)").matches && !navigator.getGamepads?.().some(Boolean))
      $("#touch").classList.remove("hidden");
    window.addEventListener(
      "gamepadconnected",
      () => $("#touch").classList.add("hidden")
    );
    net.probe(() => ({
      scene: state === "play" ? "play" : state === "countdown" || state === "ready" ? "ready" : state === "results" ? "over" : menu === "title" ? "title" : "menu",
      menu: menu === "settings",
      world: worldSeconds,
      input: {
        x: ownInput.steer || 0,
        y: (ownInput.brake || 0) - (ownInput.throttle || 0),
        fire: !!ownInput.boost
      },
      players: round?.cars.filter((c) => c.playerId !== null).map((c) => ({
        id: c.playerId,
        x: c.x,
        z: c.z,
        score: c.score,
        health: c.health
      })) || []
    }));
    window.__crunch = {
      get state() {
        return state;
      },
      get round() {
        return round;
      },
      get net() {
        return net;
      },
      get settings() {
        return settings;
      },
      startRound,
      showSettings,
      title,
      showCredits,
      showSetup,
      get renderer() {
        return renderer;
      }
    };
    requestAnimationFrame(frame);
  } catch (e) {
    console.error(e);
    $("#loadtext").textContent = e.message;
    $(".spinner")?.classList.add("hidden");
    AIHub?.fail(e.message);
  }
}
window.addEventListener("resize", () => {
  if (!renderer) return;
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});
boot();
</script></body></html>
