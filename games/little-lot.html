function renderCatalog(){$('catalog').innerHTML=`<div class="catalog-top"><span>Good things for small spaces.</span><small>${movingId?'Move this item · R to turn · Esc to cancel':'Click an item, then choose a clear spot · R to turn · Esc to cancel'}</small><div class="floor-swatches" title="Change the floor for $35"><span style="font-size:9px;font-weight:400;color:#8c9a7c">Floor · $35</span>${['#d5af7e','#bfcead','#c7a7a2'].map((c,i)=>`<button style="background:${c}" data-floor="${i}" aria-label="Floor color ${i+1}"></button>`).join('')}</div></div><div class="catalog-items">${SHOP.map(s=>`<button class="shop-item ${placing===s.type?'selected':''}" data-shop="${s.type}" title="${s.desc}">${icon(s.icon)}<div><div class="shop-name">${s.name}</div><div class="shop-price">$${s.price}</div></div></button>`).join('')}</div>`;$('catalog').querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>{const s=SHOP.find(s=>s.type===b.dataset.shop);if(state.money<s.price){toast('Save a little more.','Try a freelance job at your desk to earn money.','wallet',true);return}placing=b.dataset.shop;movingId=null;placeRotation=0;ghostPos=null;renderCatalog();updateBuildStatus();clickSound()});$('catalog').querySelectorAll('[data-floor]').forEach(b=>b.onclick=()=>{const f=+b.dataset.floor;if(f===state.floor)return;if(state.money<35){toast('Not enough money.','A floor change costs $35.','wallet',true);return}state.money-=35;state.floor=f;state.flags.decor=true;buildWorld();checkGoals();saveGame();updateUI();toast('A fresh look underfoot.','Your new floor makes this place your own.','rug')})}
function updateBuildStatus(){if(mode!=='buy')return;$('build-status').classList.remove('hidden');const s=SHOP.find(s=>s.type===placing);$('build-status').textContent=placing?`${movingId?'Move':'Place'} ${s.name} · R to turn · Esc to cancel`:'Time is paused. Make yourself at home.'}
function canPlace(item,x,z,rot,ignore=movingId){const [w,d]=dims({...item,rot});if(Math.abs(x)+w/2>8.6||z-d/2< -5.95||z+d/2>9.1)return false;if(insideRect(actor.x,actor.z,x,z,w,d,.35)||(npc.visible&&insideRect(npc.x,npc.z,x,z,w,d,.35)))return false;if(item.type==='rug'){if(x-w/2<-5.38||x+w/2>5.38||z-d/2<-4.35||z+d/2>4.3)return false;return !objects.some(o=>o.id!==ignore&&o.type==='rug'&&insideRect(x,z,o.x,o.z,w+o.w,d+o.d,0))}
 const rects=[...staticRects,[-7.55,-2.5,2,3],[-7.75,-5.5,2.2,2.2],[7.7,-5.3,2.8,2.8],[7.8,6.8,2.5,2.5],[7.2,-2.1,1.1,6]];for(const r of rects)if(insideRect(x,z,r[0],r[1],r[2]+w,r[3]+d,.07))return false;for(const o of objects){if(o.id===ignore||o.type==='rug'||o.virtual||o.nonSolid)continue;const[ow,od]=dims(o);if(insideRect(x,z,o.x,o.z,w+ow,d+od,.12))return false}return true}
function commitPlacement(x,z,repeat=false){const item=SHOP.find(s=>s.type===placing);if(!item||!canPlace(item,x,z,placeRotation)){toast('That spot needs more room.','Choose a clear tile and leave a walking path.','chair',true);return false}if(!movingId&&state.money<item.price){toast('Not enough money.','Earn a little more at your desk.','wallet',true);return false}const current=movingId&&objects.find(o=>o.id===movingId);const candidate={...item,id:movingId||'added'+state.nextId,x,z,rot:placeRotation,placed:true,outdoor:Math.abs(x)>5.5||z>4.5||z< -4.5};let old=current?{...current}:null;if(current)Object.assign(current,candidate);else objects.push(candidate);
 let safe=true;if(item.type!=='rug'){for(const id of ['fridge','bed','toilet','shower','computer','mailbox']){const ob=objById(id);if(!findPath(actor.x,actor.z,...standFor(ob))){safe=false;break}}}if(!safe){if(current)Object.assign(current,old);else objects.pop();toast('Keep a little path open.','That spot blocks an important part of your home.','walk',true);return false}if(!movingId){state.money-=item.price;state.stats.bought++;state.nextId++;state.flags.decor=true;toast('A little more you.','Your new '+item.name.toLowerCase()+' is right at home.','bag')}else toast('A change of scenery.','That looks good right there.','chair');movingId=null;if(!repeat){placing=null;ghostPos=null}buildWorld();refreshRoutes();checkGoals();saveGame();renderCatalog();updateBuildStatus();updateUI();positiveSound();return true}
function refreshRoutes(){if(actor.current&&actor.phase==='walking'&&actor.current.target){const path=findPath(actor.x,actor.z,...actor.current.target);if(path)actor.path=path;else{toast('Your plans need a new path.','Choose another action or make more room.','walk',true);cancelCurrent()}}for(const guest of[npc,friend2]){if(guest.path?.length){const end=guest.path[guest.path.length-1];guest.path=findPath(guest.x,guest.z,end.x,end.z)||[]}}}
function sellObject(o){if(!o?.placed)return;state.money+=Math.floor(o.price*.75);objects=objects.filter(x=>x.id!==o.id);actor.queue=actor.queue.filter(q=>q.objId!==o.id);if(actor.current?.objId===o.id)cancelCurrent();closeContext();placing=null;movingId=null;ghostPos=null;buildWorld();refreshRoutes();saveGame();renderCatalog();updateBuildStatus();updateUI();toast('Room for something new.','You sold the item for $'+Math.floor(o.price*.75)+'.','wallet')}
function inPoly(x,y,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let a=poly[i],b=poly[j];if(((a.y>y)!==(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x))inside=!inside}return inside}
function pick(x,y){const lx=x-centerX-pan.x,ly=y-centerY-pan.y;let elems=[...sceneElements.filter(e=>e.object),actorVisual,...(npc.visible&&npcVisual?[npcVisual]:[]),...(friend2.visible&&friend2Visual?[friend2Visual]:[])].filter(Boolean);elems.sort((a,b)=>(b.depth||0)-(a.depth||0));for(const e of elems){const h=e.hit;if(!h||lx<h.minx||lx>h.maxx||ly<h.miny||ly>h.maxy)continue;for(let i=h.faces.length-1;i>=0;i--){let f=h.faces[i];if(f.alpha<.9)continue;if(inPoly(lx,ly,f.p))return e.object||objById(e.id)}}return null}
function onPointerMove(e){mouse={x:e.clientX,y:e.clientY};if(pointerDown){const dx=e.clientX-pointerDown.x,dy=e.clientY-pointerDown.y;if(pointerDown.dragging||Math.hypot(dx,dy)>6){pointerDown.dragging=true;pan.x=clamp(pointerDown.panx+dx,-W*.9,W*.9);pan.y=clamp(pointerDown.pany+dy,-H*.6,H*.6);hoverId=null;$('tooltip').classList.add('hidden');canvas.style.cursor='grabbing';return}}
 if(mode==='buy'&&placing){const p=groundPoint(e.clientX,e.clientY);ghostPos={x:Math.round(p.x*2)/2,z:Math.round(p.z*2)/2};canvas.style.cursor='crosshair';return}if(modalOpen||!$('context').classList.contains('hidden'))return;const o=pick(e.clientX,e.clientY);hoverId=o?.id||null;canvas.style.cursor=o?'pointer':'grab';if(o){$('tooltip').innerHTML=`<strong>${esc(o.name)}</strong><small>${mode==='buy'?(o.placed?'Click to move or sell':'Your starter home'):'Click to choose an action'}</small>`;$('tooltip').classList.remove('hidden');$('tooltip').style.left=clamp(e.clientX+15,10,W-185)+'px';$('tooltip').style.top=clamp(e.clientY+14,67,H-85)+'px'}else $('tooltip').classList.add('hidden')}
canvas.addEventListener('pointerdown',e=>{if(modalOpen)return;canvas.setPointerCapture(e.pointerId);pointerDown={x:e.clientX,y:e.clientY,panx:pan.x,pany:pan.y,dragging:false,button:e.button};$('tooltip').classList.add('hidden')});
canvas.addEventListener('pointermove',onPointerMove);
canvas.addEventListener('pointerup',e=>{if(!pointerDown)return;const down=pointerDown;pointerDown=null;canvas.style.cursor='grab';if(down.dragging)return;if(e.button===2){if(placing){placing=null;movingId=null;ghostPos=null;renderCatalog();updateBuildStatus()}else closeContext();return}if(e.button!==0)return;if(mode==='buy'&&placing){const p=groundPoint(e.clientX,e.clientY);commitPlacement(Math.round(p.x*2)/2,Math.round(p.z*2)/2,e.shiftKey);return}let o=pick(e.clientX,e.clientY);if(o){openContext(o,e.clientX,e.clientY);return}if(!started){closeContext();return}closeContext();if(mode==='live'){let p=groundPoint(e.clientX,e.clientY);if(walkable(p.x,p.z)){clickMarker={...p,t:0};queueAction('ground','walk',{id:'ground',x:p.x,z:p.z,stand:[p.x,p.z]})}}});
canvas.addEventListener('pointercancel',()=>{pointerDown=null});canvas.addEventListener('pointerleave',()=>{hoverId=null;$('tooltip').classList.add('hidden')});canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*(e.deltaY>0?.91:1.1))},{passive:false});
function setZoom(z){zoom=clamp(z,.72,1.75);resize();closeContext();$('tooltip').classList.add('hidden')}
function rotateView(dir){yaw+=dir*Math.PI/2;resize();closeContext();$('tooltip').classList.add('hidden');clickSound()}
function homeView(){zoom=1;yaw=Math.PI/4;pan={x:0,y:0};resize();closeContext()}
function focusActor(){const p=residentPosition(),s=screenPoint(p.x,.2,p.z);pan.x+=W*.53-s.x;pan.y+=(H-document.querySelector('.hud').offsetHeight)*.52-s.y;closeContext()}
addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;const k=e.key.toLowerCase();if(k==='escape'){if(modalOpen)hideModal();else if(placing){placing=null;movingId=null;ghostPos=null;renderCatalog();updateBuildStatus()}else if(!$('context').classList.contains('hidden'))closeContext();else if(mode==='buy')setMode('live');return}if(modalOpen)return;if(k===' '){e.preventDefault();if(mode==='live')setSpeed(gameSpeed?0:lastSpeed)}else if(['1','2','3'].includes(k)){setSpeed(+k)}else if(k==='b'){setMode(mode==='live'?'buy':'live')}else if(k==='r'&&placing){placeRotation=(placeRotation+Math.PI/2)%(Math.PI*2);clickSound()}else if(k==='q'){rotateView(-1)}else if(k==='e'){rotateView(1)}else if(k==='+'||k==='='){setZoom(zoom*1.1)}else if(k==='-'){setZoom(zoom*.9)}else if(k==='home'){e.preventDefault();homeView()}else if(k==='?'||k==='h'){showHelp()}else if(k==='delete'&&mode==='buy'&&selection){sellObject(objById(selection))}});
$('modal-wrap').addEventListener('click',e=>{if(e.target===$('modal-wrap'))hideModal()});
// A small original music box score, made with Web Audio. No sound files.
let audioCtx=null,masterGain=null,musicTimer=null,musicStep=0;
function ensureAudio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;audioCtx=new AC();masterGain=audioCtx.createGain();masterGain.gain.value=.2;masterGain.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return true}
function tone(freq,start,duration=.35,volume=.2,type='sine'){if(!audioCtx||!soundOn)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(volume,start+.015);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g);g.connect(masterGain);o.start(start);o.stop(start+duration+.03)}
function clickSound(){if(soundOn&&ensureAudio())tone(720,audioCtx.currentTime,.055,.07,'sine')}
function positiveSound(){if(soundOn&&ensureAudio()){tone(523.25,audioCtx.currentTime,.19,.09);tone(659.25,audioCtx.currentTime+.1,.23,.085);tone(783.99,audioCtx.currentTime+.21,.28,.07)}}
function toggleSound(){soundOn=!soundOn;if(soundOn&&!ensureAudio()){soundOn=false;toast('Sound is not available here.','The game still works with sound off.','mute',true)}$('sound-btn').innerHTML=icon(soundOn?'volume':'mute');$('sound-btn').title=soundOn?'Turn sound off':'Turn sound on';$('sound-btn').setAttribute('aria-label',$('sound-btn').title);if(soundOn){clickSound();if(!musicTimer)musicTimer=setInterval(musicTick,340)}else{clearInterval(musicTimer);musicTimer=null}}
function musicTick(){if(!soundOn||!audioCtx||document.hidden)return;const melody=[64,67,71,74,71,67,64,62,60,64,67,72,67,64,60,62,62,65,69,72,69,65,62,60,59,62,67,71,67,62,59,62];let note=melody[musicStep%melody.length];let t=audioCtx.currentTime;const freq=n=>440*Math.pow(2,(n-69)/12);tone(freq(note),t,.62,.075,'sine');tone(freq(note+12),t,.2,.012,'triangle');if(musicStep%8===0)tone(freq([48,45,50,43][Math.floor(musicStep/8)%4]),t,2.2,.08,'sine');musicStep++}
function confetti(n=70){for(let i=0;i<n;i++)confettiPieces.push({x:W*(.2+Math.random()*.6),y:H*.3+Math.random()*H*.1,vx:(Math.random()-.5)*200,vy:-70-Math.random()*160,r:Math.random()*6.28,vr:(Math.random()-.5)*8,life:3+Math.random()*2,size:3+Math.random()*5,color:['#86a66b','#e3bb6e','#d59c8a','#8eafa1','#e6d3a0'][i%5]})}
function renderConfetti(dt){let c=$('confetti').getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);for(const p of confettiPieces){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=95*dt;p.r+=p.vr*dt;p.life-=dt;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.globalAlpha=Math.min(1,p.life);c.fillStyle=p.color;c.fillRect(-p.size/2,-2,p.size,4);c.restore()}confettiPieces=confettiPieces.filter(p=>p.life>0&&p.y<H+20)}
function initUI(){$('help-btn').innerHTML=icon('help');$('settings-btn').innerHTML=icon('settings');$('sound-btn').innerHTML=icon('mute');$('live-btn').innerHTML=icon('play')+'<span class="full-label">Live mode</span><span class="short-label">Live</span> <span class="key">1</span>';$('buy-btn').innerHTML=icon('chair')+'<span class="full-label">Buy & decorate</span><span class="short-label">Buy</span> <span class="key">B</span>';$('life-btn').innerHTML=icon('heart')+'<span class="full-label">My little life</span><span class="short-label">My life</span>';$('needs').innerHTML=NEEDS.map(([k,t,ic])=>`<div class="need" role="button" tabindex="0" data-need="${k}" title="Click to take care of ${t.toLowerCase()}"><div class="need-top">${icon(ic)}<span>${t}</span><span class="need-num" id="num-${k}"></span></div><div class="need-track"><div class="need-fill" id="need-${k}"></div></div></div>`).join('');$('needs').querySelectorAll('[data-need]').forEach(el=>{el.onclick=()=>autoNeed(el.dataset.need);el.onkeydown=e=>{if(e.key==='Enter')autoNeed(el.dataset.need)}});$('camera-tools').innerHTML=`<button id="rotate-left" title="Turn left (Q)" aria-label="Turn left">${icon('rotate')}</button><button id="rotate-right" title="Turn right (E)" aria-label="Turn right" style="transform:scaleX(-1)">${icon('rotate')}</button><div class="divider"></div><button id="zoom-out" title="Zoom out (−)" aria-label="Zoom out">${icon('minus')}</button><button id="zoom-in" title="Zoom in (+)" aria-label="Zoom in">${icon('plus')}</button><div class="divider"></div><button id="home-view" title="Reset the view (Home)" aria-label="Reset the view">${icon('home')}</button>`;$('rotate-left').onclick=()=>rotateView(-1);$('rotate-right').onclick=()=>rotateView(1);$('zoom-in').onclick=()=>setZoom(zoom*1.1);$('zoom-out').onclick=()=>setZoom(zoom*.9);$('home-view').onclick=homeView;$('help-btn').onclick=showHelp;$('settings-btn').onclick=showSettings;$('sound-btn').onclick=toggleSound;$('save-btn').onclick=()=>saveGame(true);$('live-btn').onclick=()=>setMode('live');$('buy-btn').onclick=()=>setMode(mode==='live'?'buy':'live');$('life-btn').onclick=showLife;$('autonomy-btn').onclick=()=>{state.autonomy=!state.autonomy;updateUI();saveGame();toast(state.autonomy?'A little free will.':'You are in charge.',state.autonomy?'Mara will care for low needs when the queue is empty.':'Choose the next little thing for Mara to do.','smile')};$('neighbor-btn').onclick=()=>{const p=screenPoint(npc.x,1,npc.z);openContext(objById('june'),clamp(p.x,280,W-290),clamp(p.y,100,H-350))};$('portrait').onclick=focusActor;updateStory();renderSpeed();updateUI();updatePortraits()}
let lastFrame=performance.now(),lastDraw=0;
function frame(now){const dt=Math.min((now-lastFrame)/1000,.08);lastFrame=now;realTime+=dt;simulation(dt);for(const f of floaters)f.t+=dt;floaters=floaters.filter(f=>f.t<2.7);if(clickMarker){clickMarker.t+=dt;if(clickMarker.t>1.8)clickMarker=null}uiTimer+=dt;saveTimer+=dt;if(uiTimer>.22){updateUI();uiTimer=0}if(saveTimer>25&&started){saveGame();saveTimer=0}if(now-lastDraw>26){drawWorld();lastDraw=now;frameCount++}if(confettiPieces.length)renderConfetti(dt);else if($('confetti').dataset.dirty){$('confetti').getContext('2d').clearRect(0,0,W*DPR,H*DPR);delete $('confetti').dataset.dirty}if(confettiPieces.length)$('confetti').dataset.dirty='1';requestAnimationFrame(frame)}
addEventListener('resize',resize);addEventListener('beforeunload',()=>{if(started)saveGame()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&started){saveGame();if(gameSpeed>0){lastSpeed=gameSpeed;gameSpeed=0;renderSpeed()}}});
// Build the complete lot before the first frame.
initUI();buildWorld();resize();drawWorld();requestAnimationFrame(frame);
// A small read-only state view helps with browser tests without changing play.
window.LittleLot={get state(){return JSON.parse(JSON.stringify(state))},get actor(){return{x:actor.x,z:actor.z,phase:actor.phase,action:actor.current?.actionId,queue:actor.queue.map(x=>x.actionId)}},get objects(){return objects.map(({el,...o})=>o)},get view(){return{unit,centerX,centerY,yaw,zoom}},get frames(){return frameCount}};
