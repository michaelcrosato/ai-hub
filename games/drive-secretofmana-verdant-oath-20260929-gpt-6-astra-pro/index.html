VERDANT OATH
A Secret of Mana (SNES) Underground Palace vertical slice
Generated: 2026-09-29
AI model: GPT-6 Astra Pro
Engine: my-3D2dge v0.6.0
Purpose: internal, non-commercial testing; unofficial fan work.

LAUNCH
Open this HTML directly in a modern browser. No server, installation, build step, network request, or external asset is needed. Press Enter or select Begin the expedition. Sound starts after the first interaction. Landscape is recommended on phones. Keyboard, mouse, standard gamepads, and the engine's touch stick/buttons are supported. Browsers may restrict localStorage, fullscreen, gamepads, Web Audio, or WebGPU for local files; Canvas remains the default renderer.

CONTROLS
Move: WASD / arrows / left stick / D-pad (Pad12-15) / left touch stick.
Attack: J or X / mouse left / A (Pad0; also Pad7) / HIT.
Charge: keep attack held through the 100% refill; release after Lv1 or Lv2.
Run: hold Space, Shift or K / B (Pad1) / RUN, starting at 100%.
Interact: E / X (Pad2) / USE.
Ring: Q or Tab / mouse right / Y (Pad3) / RING.
Caster ring: C / LB (Pad4) / MAGIC.
Change leader: R / RB (Pad5) / HERO.
Quick spell targeting: F / LT (Pad6). Primm opens Cure Water; others open Popoi's Freeze.
Target cycle: T / Back (Pad8).
Pause: Escape or P / Start (Pad9) / PAUSE.
Confirm: J, Enter, Space / A (Pad0); tap a ring icon or menu row.
Back: Escape, Backspace, K / B (Pad1) / BACK.
Mute: M / left-stick click (Pad10).
Fullscreen: F10 / right-stick click (Pad11), or Options.
Menu navigation: arrows / WASD / D-pad or stick; tap entries; drag touch menus to scroll.
Co-op: additional standard controllers press Start to join an available companion. Start again leaves; disconnection restores companion AI. The primary input device retains the shared camera and scene interactions. All players can attack and issue ring commands; opening a ring pauses the shared world.

WHAT TO PLAY
Rest or buy supplies in Gaia's Navel, optionally forge the two starting weapon orbs, and enter the palace to the north. Freeze the lava orb, light both seals, raise the bridge, equip the whip to cross between stakes, and fight through the guard stair and chess court. Defeat Fire Gigas, meet Gnome, and seal the Mana Seed. Try the new earth spells against Gnome's sentries. Use the Magic Rope to return to camp, forge the Axe Orb with Watts, and leave south for the results screen.

 if(e.kind==='goblin'){e.summonT-=dt;if(e.summonT<=0&&e.spawned<1&&enemies.filter(q=>!q.dead).length<8){e.spawned++;e.summonT=8;const q=enemy('ma','spawn-'+e.id,e.x+21,e.y+8);if(q)room.map.collide(q);P.glints(e.x,e.y,24,6,'#e3a8ce');P.text(e.x,e.y,35,'MA GOBLIN!',COL.red);}}
 if(e.kind==='ma'){e.summonT-=dt;if(e.summonT<=0){e.summonT=7;const ally=enemies.find(q=>!q.dead&&q!==e&&q.hp<q.maxHp*.7&&E.dist(q,e)<100);if(ally){ally.hp=Math.min(ally.maxHp,ally.hp+25);P.text(ally.x,ally.y,31,'+25',COL.mint);P.glints(ally.x,ally.y,12,6,COL.mint);}else fireShots(e,1);}}

 }else if(e.state==='wind'){
  e.vx=e.vy=0;e.attack.update(dt);
  if(e.timer<=0){
   if(e.kind==='knight'){e.state='leap';e.leapT=0;e.leapFrom={x:e.x,y:e.y};e.leapTo=e.aim;}
   else{if(Math.hypot(h.x-e.x,h.y-e.y)<31)damageHero(h,e.power,e,e.kind==='slime'||e.kind==='bat'?'poison':'physical');e.state='recover';e.timer=.65;}

  if(d>(e.kind==='knight'?70:22)){let dx=Math.cos(e.facing),dy=Math.sin(e.facing);if(!room.map.los(e.x,e.y,h.x,h.y)){const dr=flow.dir(e.x,e.y,h.x,h.y);dx=dr[0];dy=dr[1];}e.vx=dx*speed;e.vy=dy*speed;}

function updateEnemyRig(e,dt){if(e.rig instanceof E.Humanoid)e.rig.update(dt,{x:e.x,y:e.y,z:e.z,vx:e.vx,vy:e.vy,facing:e.facing,attack:e.attack.state,hurt:e.hurt>0,air:e.z>4,pose:e.state==='wind'?'cast':null});else e.rig.update(dt,{look:[Math.cos(e.facing),Math.sin(e.facing)],walk:Math.min(1,Math.hypot(e.vx,e.vy)/30),squash:e.state==='wind'?-.18:0,squint:e.hurt>0,flap:e.kind==='bat'?1:0});}

 for(const h of party){const cp=coop.find(q=>q.hero===h.index);stepHero(h,dt,cp?pads.input(cp):h.index===S.active&&!coop.some(q=>q.hero===S.active)?game.input:null);if(ring||panel||transitioning||crossing)return;}

 hash.build(enemies.filter(e=>!e.dead));for(const e of enemies){if(e.dead||e.kind==='boss'||e.kind==='dummy')continue;hash.near(e.x,e.y,20,q=>{if(q===e||q.dead)return;const dx=e.x-q.x,dy=e.y-q.y,d=Math.hypot(dx,dy)||1,r=e.r+q.r;if(d<r){e.x+=dx/d*(r-d)*dt*3;e.y+=dy/d*(r-d)*dt*3;}});room.map.collide(e);}

 shots.hit(enemies,(b,e)=>{const h=party[b.data.owner];damageEnemy(e,b.dmg,h,h.buff.ice?'Undine':h.buff.stone?'Gnome':null,b.data.level);},'party');
 shots.hit(party.filter(h=>h.hp>0),(b,h)=>damageHero(h,b.dmg,b,b.data&&b.data.kind||'physical'),'enemy');
