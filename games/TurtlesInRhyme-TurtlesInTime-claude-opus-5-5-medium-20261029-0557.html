<!--
TURTLES IN RHYME — an original spiritual successor to Turtles in Time
Four shells. One villain. All of time.

SOURCE INFORMATION
- Date: 2026-10-29 05:57
- Source: Turtles in Time
- Tech: Three.js r180 (WebGPURenderer, WebGPU only, no fallback; TSL node materials; PostProcessing + BloomNode), Rapier 3D 0.19.3 (@dimforge/rapier3d-compat, cosmetic rigid bodies: props and debris), Gamepad API (standard mapping, DualSense first), Web Audio API, Canvas 2D (textures, portraits, screen cracks), DOM/CSS UI, AI Hub session client 1.3.0 (Session Protocol v1). Plain JavaScript ES modules, bundled into one HTML file; libraries from the jsDelivr CDN.
- Art Direction: stylized cel shading — 3-band toon ramp (MeshToonNodeMaterial), inverted-hull ink outlines written in TSL, bloom for neon and specials, comic-book hit words (POW! WHAM!), blob shadows for depth reading, and a screen-crack overlay when foes are thrown into the screen.
- Animation: procedural hierarchical rigs (Object3D joints) with code-keyframed poses per state (combo hits, kicks, grabs, slams, throws, specials, hurt, knockdown, hoverboard stance), blended by exponential smoothing; separate gait systems for robo-raptors, the T-rex boss and chomp bots; Rapier-simulated props and debris.
- Audio: everything synthesized in code — a Web Audio step sequencer with 6 looping songs (title, select, street, jurassic, neon, boss) and 3 jingles; synthesized sound effects (hits, slashes, clanks, explosions, lasers, glass cracks, pickups, UI); Animalese-style gibberish voices (formant-filtered blips per letter, pitched per character) for all dialogue and battle quips.
- Online: AI Hub Session Protocol v1 in co-op mode — the host runs the world (enemies, stage, score), every copy moves its own turtle; snapshots ~12/s unreliable, reliable event and claim batches; server-hosted rounds, players leaving, time-up and results with stats and awards. On its own: local couch co-op for 1-4 players (keyboard + controllers, drop-in at any time). No other network features.
- Testing: headless Chromium (Playwright) with SwiftShader WebGPU (render-target readback for screenshots), headless Node runs of the whole simulation, the AI Hub harness automatic checks (2 players; 4 players at 150 ms latency, 50 ms jitter, 5% loss with a player leaving; host leaving; server-hosted), an emulated standard gamepad.
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort medium
- Usage: cost unknown; tokens unknown; session time about 1 hour (05:57 to about 07:00).

HOW IT PLAYS
Four stages across time: Big Apple Bop (Neo York, 3 A.M.), Jurassic Jam (1,000,000 B.C.), Neon Nightriders (2105 A.D., an auto-scrolling hoverboard run), and the Clockwork Keep (the end of time). Three bosses: Big Slam Sam, Tyranno-Rhymes and Count Couplet.
Move with the stick or WASD; Square/J attack (4-hit combo), Cross/K jump (flying kick, dive), R2/Shift run (dash attack), Circle/I dodge roll, Triangle/L special (meter or a little health), R1/U grab — then Square to knee and slam, or Cross to hurl the foe INTO THE SCREEN. Hazards: manholes, a fire hydrant, lava geysers, falling rocks, laser gates and mines. Pickups: pizza slices, whole pizzas, rhyme scrolls and time gems. Options/Esc pauses; Settings has volume, invert horizontal/vertical stick, vibration, shake, hints, difficulty, bloom and outlines. Ten seconds idle on the title starts an AI demo.

TESTING FEEDBACK
- Issues caught by testing: 7 in the game — title-screen turtles leaking into every stage, the "press to join" HUD slot layout breaking, the boss bar hidden under the dialogue box, Count Couplet's quill far too long, the neon road too shallow for the camera, the select-screen player tag overlapping the header, cramped session name tags — plus 2 in my own test tooling (headless WebGPU screenshots were blank; render-target rows are padded).
- Critical / game breaking: 0. The full four-stage run completed with zero exceptions in every mode tested.
- Most helpful test: running the plain-data simulation headless in Node with the attract-mode AI — the whole game (4 AI players with cheats, 1 player without, a 2-player host) played to the final boss's defeat in seconds of wall time, proving the stage flow, bosses and scoring end to end. The AI Hub harness was a close second.
- Least helpful test: Playwright page screenshots of the WebGPU canvas (always blank white in headless SwiftShader) and long held presses on the emulated pad (they triggered menu auto-repeat at 2-4 fps).

ENGINE FEEDBACK
- Liked most: TSL node materials — the inverted-hull ink outline is one line (positionNode = positionLocal + normalLocal * width), and MeshToonNodeMaterial with a gradient ramp plus a BloomNode pass gave the cel look with almost no shader code.
- Stuck or guessed wrong: headless Chrome never presents a WebGPU canvas, so I built a render-target readback for screenshots; readRenderTargetPixelsAsync pads rows to 256 bytes; Rapier 0.19's init() warns about deprecated parameters (the expected argument shape is not obvious); WebGPURenderer silently falls back to WebGL 2, so honouring "no fallback" needs a manual backend check.
- Most important thing I built myself: the beat-'em-up simulation as plain data (combos, grabs and throws, attack tokens for fair crowds, bosses, hazards, stage flow) written so the same code runs solo, as the hub host, as a client and as a server, plus the procedural rig/pose animation system and the synth audio engine.
- Hardest part: verifying visuals without a GPU (software WebGPU at a few frames per second), and per-character hit flashes needing per-rig material instances.
- Remove or overhaul: the automatic WebGL fallback inside WebGPURenderer — make it opt-in.
- Change one thing: a first-class outline/toon pipeline (or an official toon outline node for meshes) and a documented headless capture path.

PROMPT FEEDBACK
- Liked most: the controller-first 10-foot brief, the precise attract-mode rules, and a multiplayer protocol that ships its own conformance harness.
- Confusing: "follow the hub for multiplayer as well as for the game on its own" (I read it as local couch co-op on its own, hub co-op in sessions); the hub asks for a WebGL 2 fallback while the prompt forbids one (resolved with hub:webgpu=required); what "testing parameters allowed" should list.
- Hardest thing: a host-authoritative co-op beat-'em-up (grabs and throws across the network, server-hosted rounds) that still feels immediate for every player, inside one complete pass.
- The one test I would add: the hub's own hub-check.mjs run (emulated DualSense in every frame) on a machine with a real GPU, followed by a human four-player playthrough.

const ABOUT_TEXT = "TURTLES IN RHYME — an original spiritual successor to Turtles in Time\nFour shells. One villain. All of time.\n\nSOURCE INFORMATION\n- Date: 2026-10-29 05:57\n- Source: Turtles in Time\n- Tech: Three.js r180 (WebGPURenderer, WebGPU only, no fallback; TSL node materials; PostProcessing + BloomNode), Rapier 3D 0.19.3 (@dimforge/rapier3d-compat, cosmetic rigid bodies: props and debris), Gamepad API (standard mapping, DualSense first), Web Audio API, Canvas 2D (textures, portraits, screen cracks), DOM/CSS UI, AI Hub session client 1.3.0 (Session Protocol v1). Plain JavaScript ES modules, bundled into one HTML file; libraries from the jsDelivr CDN.\n- Art Direction: stylized cel shading — 3-band toon ramp (MeshToonNodeMaterial), inverted-hull ink outlines written in TSL, bloom for neon and specials, comic-book hit words (POW! WHAM!), blob shadows for depth reading, and a screen-crack overlay when foes are thrown into the screen.\n- Animation: procedural hierarchical rigs (Object3D joints) with code-keyframed poses per state (combo hits, kicks, grabs, slams, throws, specials, hurt, knockdown, hoverboard stance), blended by exponential smoothing; separate gait systems for robo-raptors, the T-rex boss and chomp bots; Rapier-simulated props and debris.\n- Audio: everything synthesized in code — a Web Audio step sequencer with 6 looping songs (title, select, street, jurassic, neon, boss) and 3 jingles; synthesized sound effects (hits, slashes, clanks, explosions, lasers, glass cracks, pickups, UI); Animalese-style gibberish voices (formant-filtered blips per letter, pitched per character) for all dialogue and battle quips.\n- Online: AI Hub Session Protocol v1 in co-op mode — the host runs the world (enemies, stage, score), every copy moves its own turtle; snapshots ~12/s unreliable, reliable event and claim batches; server-hosted rounds, players leaving, time-up and results with stats and awards. On its own: local couch co-op for 1-4 players (keyboard + controllers, drop-in at any time). No other network features.\n- Testing: headless Chromium (Playwright) with SwiftShader WebGPU (render-target readback for screenshots), headless Node runs of the whole simulation, the AI Hub harness automatic checks (2 players; 4 players at 150 ms latency, 50 ms jitter, 5% loss with a player leaving; host leaving; server-hosted), an emulated standard gamepad.\n- Environment: Claude Code CLI (headless); Linux; browser unknown\n- Model: Anthropic, claude-opus-5-5, reasoning effort medium\n- Usage: cost unknown; tokens unknown; session time about 1 hour (05:57 to about 07:00).\n\nHOW IT PLAYS\nFour stages across time: Big Apple Bop (Neo York, 3 A.M.), Jurassic Jam (1,000,000 B.C.), Neon Nightriders (2105 A.D., an auto-scrolling hoverboard run), and the Clockwork Keep (the end of time). Three bosses: Big Slam Sam, Tyranno-Rhymes and Count Couplet.\nMove with the stick or WASD; Square/J attack (4-hit combo), Cross/K jump (flying kick, dive), R2/Shift run (dash attack), Circle/I dodge roll, Triangle/L special (meter or a little health), R1/U grab — then Square to knee and slam, or Cross to hurl the foe INTO THE SCREEN. Hazards: manholes, a fire hydrant, lava geysers, falling rocks, laser gates and mines. Pickups: pizza slices, whole pizzas, rhyme scrolls and time gems. Options/Esc pauses; Settings has volume, invert horizontal/vertical stick, vibration, shake, hints, difficulty, bloom and outlines. Ten seconds idle on the title starts an AI demo.\n\nTESTING FEEDBACK\n- Issues caught by testing: 7 in the game — title-screen turtles leaking into every stage, the \"press to join\" HUD slot layout breaking, the boss bar hidden under the dialogue box, Count Couplet's quill far too long, the neon road too shallow for the camera, the select-screen player tag overlapping the header, cramped session name tags — plus 2 in my own test tooling (headless WebGPU screenshots were blank; render-target rows are padded).\n- Critical / game breaking: 0. The full four-stage run completed with zero exceptions in every mode tested.\n- Most helpful test: running the plain-data simulation headless in Node with the attract-mode AI — the whole game (4 AI players with cheats, 1 player without, a 2-player host) played to the final boss's defeat in seconds of wall time, proving the stage flow, bosses and scoring end to end. The AI Hub harness was a close second.\n- Least helpful test: Playwright page screenshots of the WebGPU canvas (always blank white in headless SwiftShader) and long held presses on the emulated pad (they triggered menu auto-repeat at 2-4 fps).\n\nENGINE FEEDBACK\n- Liked most: TSL node materials — the inverted-hull ink outline is one line (positionNode = positionLocal + normalLocal * width), and MeshToonNodeMaterial with a gradient ramp plus a BloomNode pass gave the cel look with almost no shader code.\n- Stuck or guessed wrong: headless Chrome never presents a WebGPU canvas, so I built a render-target readback for screenshots; readRenderTargetPixelsAsync pads rows to 256 bytes; Rapier 0.19's init() warns about deprecated parameters (the expected argument shape is not obvious); WebGPURenderer silently falls back to WebGL 2, so honouring \"no fallback\" needs a manual backend check.\n- Most important thing I built myself: the beat-'em-up simulation as plain data (combos, grabs and throws, attack tokens for fair crowds, bosses, hazards, stage flow) written so the same code runs solo, as the hub host, as a client and as a server, plus the procedural rig/pose animation system and the synth audio engine.\n- Hardest part: verifying visuals without a GPU (software WebGPU at a few frames per second), and per-character hit flashes needing per-rig material instances.\n- Remove or overhaul: the automatic WebGL fallback inside WebGPURenderer — make it opt-in.\n- Change one thing: a first-class outline/toon pipeline (or an official toon outline node for meshes) and a documented headless capture path.\n\nPROMPT FEEDBACK\n- Liked most: the controller-first 10-foot brief, the precise attract-mode rules, and a multiplayer protocol that ships its own conformance harness.\n- Confusing: \"follow the hub for multiplayer as well as for the game on its own\" (I read it as local couch co-op on its own, hub co-op in sessions); the hub asks for a WebGL 2 fallback while the prompt forbids one (resolved with hub:webgpu=required); what \"testing parameters allowed\" should list.\n- Hardest thing: a host-authoritative co-op beat-'em-up (grabs and throws across the network, server-hosted rounds) that still feels immediate for every player, inside one complete pass.\n- The one test I would add: the hub's own hub-check.mjs run (emulated DualSense in every frame) on a machine with a real GPU, followed by a human four-player playthrough.\n\nCREDITS\nDesign, code, art, music, sound and voices: generated in code by Claude (claude-opus-5-5) in Claude Code. Three.js © three.js authors (MIT). Rapier © Dimforge (Apache-2.0). AI Hub session client © AI Hub. Inspired by Turtles in Time; all characters, names, story and assets here are original.";

  const m = /^([A-G])([#b]?)(-?\d)$/.exec(tok);

}

const Sound = {
  ctx: null, out: null, bus: {}, noise: null, song: null, songName: '', step: 0, nextT: 0, timer: 0, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {}); return; }
    try { this.ctx = new AudioContext(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    this.out = c.createGain();
    this.out.connect(comp).connect(c.destination);
    for (const b of ['music', 'sfx', 'voice']) { this.bus[b] = c.createGain(); this.bus[b].connect(this.out); }
    // a short room reverb for the music bus, from decaying noise
    const ir = c.createBuffer(2, c.sampleRate * 1.4, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); }
    this.verb = c.createConvolver(); this.verb.buffer = ir;
    this.verbGain = c.createGain(); this.verbGain.gain.value = 0.18;
    this.verb.connect(this.verbGain).connect(this.out);
    this.noise = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const nd = this.noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  applyVolumes() {

    this.bus.music.gain.value = v(settings.music) * 0.55;
    this.bus.sfx.gain.value = v(settings.sfx) * 0.9;
    this.bus.voice.gain.value = v(settings.voice) * 0.7;

      t += rate;
    }
  },

// ---------------------------------------------------------------- input: controller-first; the keyboard maps onto the same pad model
const BTN = { cross: 0, circle: 1, square: 2, triangle: 3, l1: 4, r1: 5, l2: 6, r2: 7, create: 8, options: 9, l3: 10, r3: 11, up: 12, down: 13, left: 14, right: 15 };

  KeyJ: 'square', KeyK: 'cross', Space: 'cross', KeyL: 'triangle', KeyU: 'r1', KeyI: 'circle', ShiftLeft: 'r2', ShiftRight: 'r2',
  Enter: 'options', Escape: 'options', Backspace: 'circle',
  KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right', ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',

const Input = {
  keys: new Set(), downEv: new Set(), pressedNow: new Set(), clickEv: false, rightEv: false, pads: [], padPrev: [], lastDevice: 'kb', idle: 0, anyPressed: false, mouseClick: false, mouseRight: false,
  repeat: {}, frameEdges: null,

  poll(dt) {

      const p = gp[i];

  keyDown(code) { return this.keys.has(code); },
  keyPressed(code) { return this.pressedNow.has(code); },

  padPressed(i, b) { const p = this.pads[i]; const q = this.padPrev[i]; return !!(p && p.b[b] && !(q && q[b])); },

  menuFrame() {

    const dirs = { up: false, down: false, left: false, right: false };

    if (k('ArrowRight') || k('KeyD')) dirs.right = true;

      if (this.padHeld(i, BTN.left) || s.x < -0.55) dirs.left = true;
      if (this.padHeld(i, BTN.right) || s.x > 0.55) dirs.right = true;

  p._ai = p._ai || { t: 0, press: 0, plan: null, planT: 0, grabT: 0 };
  const A = p._ai; A.t += dt; A.press -= dt; A.planT -= dt;
  const H = HEROES[p.hero];
  // show off the drop-in and keep up with the camera (it cheats: no clip)
  if (p.x < world.camX - HALF_W + 0.6 && world.phase !== 'auto') p.x = world.camX - HALF_W + 1;
  if (p.st === 'grab') {
    A.grabT += dt;
    if (A.grabT > 0.25 && A.press <= 0) {
      A.press = 0.2;
      if (A.plan === 'toss' || A.grabT > 0.9) I.jmp = true; else I.atk = true;
    }
    return I;
  }
  A.grabT = 0;
  const foes = world.enemies.filter((e) => world.hittable(e) && Math.abs(e.x - world.camX) < HALF_W + 0.5);
  let tgt = null, bd = 1e9;
  for (const e of foes) { const d = Math.abs(e.x - p.x) + Math.abs(e.z - p.z) * 2 + (e.id % 4 === p.id % 4 ? -1 : 0); if (d < bd) { bd = d; tgt = e; } }
  if (!tgt) {
    const b = world.breakables.find((q) => q.alive && q.k !== 'mine' && Math.abs(q.x - p.x) < 6);
    if (b) {
      const gx = b.x - sign(b.x - p.x) * 0.9;
      I.mx = clamp((gx - p.x) * 2, -1, 1); I.mz = clamp((b.z - p.z) * 2, -1, 1);
      if (Math.abs(gx - p.x) < 0.4 && Math.abs(b.z - p.z) < 0.4) { p.face = sign(b.x - p.x); if (A.press <= 0) { I.atk = true; A.press = 0.18; } }
      return I;
    }
    I.mx = world.phase === 'auto' ? clamp((world.camX - 3 + p.id * 1.6 + Math.sin(A.t * 0.7 + p.id) - p.x) * 0.8, -1, 1) : 1;
    I.mz = clamp((-0.4 + (p.id - 1.5) * 0.9 - p.z) * 1.5, -1, 1);
    I.run = world.phase === 'scroll';
    if (Math.random() < 0.004) I.jmp = true;
    return I;
  }
  const big = ENEMIES[tgt.type].boss;
  const side = sign(p.x - tgt.x) || 1;
  const gx = tgt.x + side * (big ? 1.6 : H.reach * 0.75 + 0.3), gz = tgt.z;
  const dx = gx - p.x, dz = gz - p.z;
  I.mx = clamp(dx * 2, -1, 1); I.mz = clamp(dz * 3, -1, 1);
  const close = Math.abs(dx) < 0.45 && Math.abs(dz) < 0.3;
  if (close) {
    I.mx = 0; I.mz = 0; p.face = -side;
    if (A.press <= 0) {
      A.press = 0.16;
      const r = Math.random();
      if (p.meter >= 50 && foes.length >= 2 && r < 0.25) I.spc = true;
      else if (ENEMIES[tgt.type].grab && (tgt.st === 'hurt' ? r < 0.5 : r < 0.18)) { I.grab = true; A.plan = Math.random() < 0.6 ? 'toss' : 'slam'; }
      else if (r < 0.08) I.jmp = true;
      else if (r < 0.12) I.dodge = true;
      else I.atk = true;
    }
  } else if (Math.abs(dz) < 0.3 && Math.abs(dx) > 3 && Math.abs(dx) < 5 && Math.random() < 0.02) {
    I.run = true; I.mx = sign(dx);
  }
  if (p.st === 'jump' && A.press <= 0 && p.vy < 3) { I.atk = true; A.press = 0.5; }
  if (p.st === 'run' && Math.abs(tgt.x - p.x) < 2.2 && A.press <= 0) { I.atk = true; A.press = 0.3; }
  return I;
}

// ---------------------------------------------------------------- graphics core: WebGPU only, cel shading, inverted-hull outlines, procedural rigs
const INK = 0x140c1c;
const GFX = { renderer: null, scene: null, camera: null, post: null, ready: false, gradient: null, outlineMats: {}, geo: {} };

async function initGfx(canvas) {
  if (!navigator.gpu) throw new Error('This browser has no WebGPU. Turtles in Rhyme needs a WebGPU browser (recent Chrome, Edge or Safari).');
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error('WebGPU is present but no GPU adapter is available on this device.');
  const renderer = new THREE.WebGPURenderer({ canvas, antialias: true });
  await renderer.init();
  if (!renderer.backend || !renderer.backend.isWebGPUBackend) throw new Error('WebGPU could not start (the renderer fell back), and this game has no fallback.');
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  GFX.renderer = renderer;
  const scene = new THREE.Scene();
  GFX.scene = scene;
  const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 400);
  GFX.camera = camera;
  // three-band toon ramp
  const ramp = new Uint8Array([70, 70, 70, 255, 165, 165, 165, 255, 255, 255, 255, 255]);
  const g = new THREE.DataTexture(ramp, 3, 1, THREE.RGBAFormat);
  g.minFilter = g.magFilter = THREE.NearestFilter; g.generateMipmaps = false; g.needsUpdate = true;

  GFX.hemi = new THREE.HemisphereLight(0xbfd8ff, 0x3a2a40, 1.3); scene.add(GFX.hemi);
  const sun = new THREE.DirectionalLight(0xfff1d6, 2.4);
  sun.position.set(6, 14, 10); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 12, bottom: -10, near: 1, far: 50 });
  sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.03;
  scene.add(sun); scene.add(sun.target); GFX.sun = sun;
  const rim = new THREE.DirectionalLight(0x9fb8ff, 1.2); rim.position.set(-4, 6, -10); scene.add(rim); GFX.rim = rim;
  // post: bloom for neon, lasers and specials
  const post = new THREE.PostProcessing(renderer);

  post.outputNode = sceneColor.add(GFX.bloomNode);

}
function resizeGfx() {

}
function renderFrame() {

// ---- materials
function toon(c, o = {}) {
  const m = new THREE.MeshToonNodeMaterial({ color: c, gradientMap: GFX.gradient });
  if (o.emissive != null) { m.emissive = new THREE.Color(o.emissive); m.emissiveIntensity = o.ei ?? 1; }
  if (o.transparent) { m.transparent = true; m.opacity = o.opacity ?? 1; }

}
function glowMat(c, opacity = 1, additive = true) {

  if (additive) m.blending = THREE.AdditiveBlending;
  return m;
}
function outlineMat(w) {

  const m = new THREE.MeshBasicNodeMaterial({ color: INK, side: THREE.BackSide });
  m.positionNode = positionLocal.add(normalLocal.mul(float(w)));

}
// ---- geometry cache
const Geo = {
  key(n, a) { return n + ':' + a.join(','); },
  get(n, a, make) { const k = this.key(n, a); return GFX.geo[k] || (GFX.geo[k] = make()); },
  box: (w, h, d) => Geo.get('b', [w, h, d], () => new THREE.BoxGeometry(w, h, d, 1, 1, 1)),
  rbox: (w, h, d, r = 0.05) => Geo.get('rb', [w, h, d, r], () => roundedBox(w, h, d, r)),
  sph: (r, a = 18, b = 12) => Geo.get('s', [r, a, b], () => new THREE.SphereGeometry(r, a, b)),
  cap: (r, l) => Geo.get('c', [r, l], () => new THREE.CapsuleGeometry(r, Math.max(0.001, l), 4, 10)),
  cyl: (rt, rb, h, s = 14, open = false) => Geo.get('y', [rt, rb, h, s, open], () => new THREE.CylinderGeometry(rt, rb, h, s, 1, open)),
  cone: (r, h, s = 12) => Geo.get('n', [r, h, s], () => new THREE.ConeGeometry(r, h, s)),
  tor: (r, t, a = 10, b = 20) => Geo.get('t', [r, t, a, b], () => new THREE.TorusGeometry(r, t, a, b)),
  ico: (r, d = 0) => Geo.get('i', [r, d], () => new THREE.IcosahedronGeometry(r, d)),
  dode: (r) => Geo.get('d', [r], () => new THREE.DodecahedronGeometry(r, 0)),
  plane: (w, h) => Geo.get('p', [w, h], () => new THREE.PlaneGeometry(w, h)),
  circ: (r, s = 24) => Geo.get('ci', [r, s], () => new THREE.CircleGeometry(r, s)),
  ring: (a, b, s = 32) => Geo.get('ri', [a, b, s], () => new THREE.RingGeometry(a, b, s)),

function roundedBox(w, h, d, r) {
  const g = new THREE.BoxGeometry(w, h, d, 4, 4, 4);
  const p = g.attributes.position; const v = new THREE.Vector3();
  const hw = w / 2 - r, hh = h / 2 - r, hd = d / 2 - r;

    v.fromBufferAttribute(p, i);
    const c = new THREE.Vector3(clamp(v.x, -hw, hw), clamp(v.y, -hh, hh), clamp(v.z, -hd, hd));
    const n = v.clone().sub(c); if (n.lengthSq() > 0) n.setLength(r);
    v.copy(c.add(n)); p.setXYZ(i, v.x, v.y, v.z);

}
/** Add a cel mesh (with an ink outline shell) to a parent. */
function part(parent, geo, mat, x = 0, y = 0, z = 0, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (o.r) m.rotation.set(o.r[0], o.r[1], o.r[2]);
  if (o.s) { if (typeof o.s === 'number') m.scale.setScalar(o.s); else m.scale.set(o.s[0], o.s[1], o.s[2]); }

// ---------------------------------------------------------------- rigs
const JOINTS = ['hips', 'spine', 'head', 'uaL', 'laL', 'uaR', 'laR', 'ulL', 'llL', 'ulR', 'llR'];
function newPose() { const p = { bob: 0, spin: 0, roll: 0, scale: 1 }; for (const j of JOINTS) p[j] = [0, 0, 0]; return p; }

/** A humanoid: heroes, Clank ninjas, Big Slam Sam and Count Couplet share this skeleton and its animations. */
function buildHumanoid(o) {
  const root = new THREE.Group();
  const rig = { root, j: {}, mats: [], kind: 'hum', o, cur: newPose(), tag: o.tag };
  const M = (c, mo) => { const m = toon(c, mo); rig.mats.push(m); return m; };
  const body = grp(root); body.scale.setScalar(o.s || 1); rig.body = body;
  const hips = grp(body, 0, o.hipH, 0); rig.j.hips = hips;
  const spine = grp(hips, 0, 0.04, 0); rig.j.spine = spine;
  const [tw, th, td] = o.torso;
  const skin = M(o.skin), bodyM = M(o.body), limbM = M(o.limb ?? o.skin), accent = M(o.accent ?? 0xffd23f), dark = M(0x2a2030);
  rig.matSkin = skin; rig.matBody = bodyM;

  part(spine, Geo.rbox(tw, th, td, Math.min(tw, td) * 0.35), bodyM, 0, th / 2, 0);
  const head = grp(spine, 0, th + o.headR * 0.75, 0.02); rig.j.head = head;
  const armLen = o.armLen, legLen = o.legLen, r = o.limbR;
  const limb = (parentG, len, mat, rr) => { part(parentG, Geo.cap(rr, len - rr * 2), mat, 0, -len / 2, 0); };
  for (const side of [1, -1]) {
    const L = side > 0 ? 'L' : 'R';
    const sh = grp(spine, side * (tw / 2 + r * 0.55), th * 0.86, 0);
    const ua = grp(sh); rig.j['ua' + L] = ua; limb(ua, armLen * 0.5, limbM, r);
    const la = grp(ua, 0, -armLen * 0.5, 0); rig.j['la' + L] = la; limb(la, armLen * 0.5, limbM, r * 0.92);
    const hand = grp(la, 0, -armLen * 0.5, 0); rig['hand' + L] = hand;
    part(hand, Geo.sph(r * 1.25, 12, 8), o.handMat === 'body' ? bodyM : skin, 0, -r * 0.4, 0);
    const hp = grp(hips, side * tw * 0.26, 0, 0);
    const ul = grp(hp); rig.j['ul' + L] = ul; limb(ul, legLen * 0.5, limbM, r * 1.1);
    const ll = grp(ul, 0, -legLen * 0.5, 0); rig.j['ll' + L] = ll; limb(ll, legLen * 0.5, limbM, r);
    const foot = part(ll, Geo.rbox(r * 2.4, r * 1.3, r * 3.4, r * 0.5), o.footMat === 'dark' ? dark : limbM, 0, -legLen * 0.5 + r * 0.45, r * 0.7);
    rig['foot' + L] = foot;
  }
  const helpers = { M, skin, bodyM, limbM, accent, dark, head, spine, hips, tw, th, td, r };
  if (o.decorate) o.decorate(rig, helpers);
  root.traverse((m) => { if (m.isMesh && !m.userData.outline) m.castShadow = true; });
  return rig;
}

function heroRig(i) {
  const h = HEROES[i];
  return buildHumanoid({
    tag: 'hero', s: 1.0, hipH: 0.72, legLen: 0.7, armLen: 0.72, limbR: 0.095, torso: [0.62, 0.62, 0.42], headR: 0.27,
    skin: h.skin, body: 0xe6c86a, limb: h.skin, accent: h.mask,
    decorate(rig, k) {
      const { M, head, spine, th, td, accent } = k;
      const shellM = M(0x6b4a2a), shellRim = M(0xc9a35a), maskM = M(h.mask), white = M(0xffffff), black = M(0x111111), belt = M(0x7a4a26);
      // shell and plastron
      part(spine, Geo.sph(0.44, 20, 14), shellM, 0, th * 0.55, -td * 0.42, { s: [1, 1.08, 0.62] });
      part(spine, Geo.tor(0.4, 0.05, 8, 24), shellRim, 0, th * 0.55, -td * 0.3, { s: [1.05, 1.15, 0.6] });
      for (let a = 0; a < 3; a++) part(spine, Geo.sph(0.1, 8, 6), M(0x8a6436), (a - 1) * 0.2, th * 0.6 + (a % 2) * 0.1, -td * 0.76, { s: [1, 1, 0.4], outline: false });
      part(spine, Geo.rbox(0.5, 0.56, 0.1, 0.05), M(0xf0d27a), 0, th * 0.5, td * 0.42);
      for (let y = 0; y < 3; y++) part(spine, Geo.box(0.42, 0.015, 0.02), M(0xb89640), 0, th * 0.3 + y * 0.15, td * 0.48, { outline: false });
      part(spine, Geo.tor(0.31, 0.05, 8, 20), belt, 0, 0.04, 0, { r: [Math.PI / 2, 0, 0], s: [1, 0.72, 1] });
      part(spine, Geo.rbox(0.16, 0.12, 0.05, 0.02), M(0xffd23f), 0, 0.05, td * 0.42);
      // head
      part(head, Geo.sph(k.r * 0 + 0.27, 20, 14), k.skin, 0, 0, 0.03, { s: [1, 0.95, 1.08] });
      part(head, Geo.cyl(0.285, 0.285, 0.12, 22, true), maskM, 0, 0.05, 0.03, { outline: false, s: [1, 1, 1.08] });
      for (const s of [-1, 1]) {
        part(head, Geo.sph(0.075, 12, 8), white, s * 0.1, 0.06, 0.27, { s: [1, 1.15, 0.5], outline: false });
        part(head, Geo.sph(0.032, 8, 6), black, s * 0.09, 0.06, 0.305, { outline: false });
      }
      part(head, Geo.box(0.14, 0.02, 0.02), M(0x1a3a1a), 0, -0.1, 0.28, { outline: false });
      // bandana tails: animated by the view from movement
      const tails = grp(head, 0, 0.05, -0.27); rig.tails = [];
      for (const s of [-1, 1]) { const t = grp(tails, s * 0.05, 0, 0); part(t, Geo.box(0.07, 0.035, 0.36), maskM, 0, 0, -0.18, { ow: 0.012 }); t.rotation.set(0.5, s * 0.25, 0); rig.tails.push(t); }
      // pads
      for (const L of ['L', 'R']) { part(rig.j['la' + L], Geo.sph(0.11, 10, 8), accent, 0, 0.0, 0, { s: [1, 0.7, 1] }); part(rig.j['ll' + L], Geo.sph(0.12, 10, 8), accent, 0, 0, 0.02, { s: [1, 0.7, 1] }); }
      buildWeapon(rig, h.weapon, M);

}
function buildWeapon(rig, kind, M) {
  const hand = rig.handR; const w = grp(hand, 0, -0.08, 0); rig.weapon = w;
  w.rotation.x = -Math.PI / 2;

    part(w, Geo.cyl(0.03, 0.03, 0.22, 8), M(0x3a2a20), 0, 0.05, 0);
    part(w, Geo.box(0.3, 0.04, 0.06), M(0xffd23f), 0, 0.17, 0);
    part(w, Geo.box(0.07, 1.0, 0.025), M(0xdfeaff, { emissive: 0x335577, ei: 0.4 }), 0, 0.68, 0);
    part(w, Geo.cone(0.05, 0.14, 4), M(0xdfeaff), 0, 1.24, 0, { s: [1, 1, 0.4] });
    part(w, Geo.cone(0.12, 0.5, 6), M(0x4fa0ff), 0.08, 0.5, -0.03, { s: [0.5, 1, 0.15], r: [0, 0, -0.15], outline: false });
  } else if (kind === 'brush') {

      const b = hnd === rig.handR ? w : grp(hnd, 0, -0.08, 0); if (hnd !== rig.handR) { b.rotation.x = -Math.PI / 2; rig.weapon2 = b; }
      part(b, Geo.cyl(0.035, 0.035, 0.62, 8), M(0xb3542a), 0, 0.22, 0);
      part(b, Geo.cyl(0.04, 0.04, 0.05, 8), M(0xffd23f), 0, 0.5, 0);
      part(b, Geo.cone(0.07, 0.22, 10), M(0x151515), 0, 0.64, 0, { r: [Math.PI, 0, 0] });

  } else if (kind === 'bass') {
    part(w, Geo.box(0.07, 0.9, 0.04), M(0x5a3420), 0, 0.35, 0);
    part(w, Geo.rbox(0.12, 0.22, 0.05, 0.02), M(0x222222), 0, -0.12, 0);
    part(w, Geo.sph(0.3, 16, 10), M(0xe8443a), 0.02, 0.92, 0, { s: [1, 1.15, 0.22] });
    part(w, Geo.sph(0.24, 16, 10), M(0xe8443a), -0.02, 1.22, 0, { s: [1, 1.1, 0.22] });
    part(w, Geo.box(0.36, 0.06, 0.07), M(0x111111), 0, 1.0, 0.03, { outline: false });

    part(w, Geo.sph(0.11, 12, 8), M(0xd0d4e0), 0, 1.38, 0, { s: [1, 1.2, 1] });

    part(w, Geo.cone(0.2, 0.8, 6), M(0x7a2cff), 0.1, 0.6, -0.03, { s: [0.5, 1, 0.12], r: [0, 0, -0.2], outline: false });
    part(w, Geo.box(0.42, 0.06, 0.08), M(0xffd23f), 0, 0.15, 0);

}

const THEME_TINT = {

// ---- the screen itself: cracks from enemies thrown into it, flashes
const Overlay = {
  cracks: [], flash: 0, flashC: '#fff', ctx: null,
  init() { this.ctx = $('#fx2d').getContext('2d'); },
  crack(sx, sy) {
    const r = mulberry((Math.random() * 1e9) | 0); const lines = [];
    const n = 9 + Math.floor(r() * 5);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + r() * 0.4; let x = 0, y = 0; const pts = [[0, 0]]; const len = 80 + r() * 220;
      for (let s = 0; s < 6; s++) { const aa = a + (r() - 0.5) * 0.6; x += Math.cos(aa) * len / 6; y += Math.sin(aa) * len / 6; pts.push([x, y]); }
      lines.push(pts);
    }
    this.cracks.push({ x: sx, y: sy, t: 0, lines, r: 30 + r() * 20 });
    this.flash = 0.25; this.flashC = '#fff';
  },
  draw(dt) {
    const g = this.ctx; if (!g) return;
    const W = g.canvas.width, H = g.canvas.height;
    g.clearRect(0, 0, W, H);
    const s = Math.min(W, H) / 900;
    for (let i = this.cracks.length - 1; i >= 0; i--) {
      const c = this.cracks[i]; c.t += dt;
      if (c.t > 2.6) { this.cracks.splice(i, 1); continue; }
      const a = c.t < 2 ? 1 : 1 - (c.t - 2) / 0.6;
      g.save(); g.translate(c.x, c.y); g.scale(s, s); g.globalAlpha = a;
      g.fillStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.arc(0, 0, c.r, 0, TAU); g.fill();
      for (const [w, col] of [[7, 'rgba(20,12,28,.8)'], [2.5, 'rgba(255,255,255,.95)']]) {
        g.lineWidth = w; g.strokeStyle = col; g.lineJoin = 'round';
        for (const pts of c.lines) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const p of pts) g.lineTo(p[0], p[1]); g.stroke(); }
        g.beginPath(); for (let k = 0; k < c.lines.length; k++) { const p = c.lines[k][2]; if (k) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); } g.closePath(); g.stroke();
      }
      g.restore();
    }
    if (this.flash > 0) { g.globalAlpha = Math.min(1, this.flash * 3); g.fillStyle = this.flashC; g.fillRect(0, 0, W, H); g.globalAlpha = 1; this.flash -= dt; }
  },
  clear() { this.cracks = []; this.flash = 0; this.ctx?.clearRect(0, 0, this.ctx.canvas.width, this.ctx.canvas.height); },

const UI = {
  stack: [], root: null, cur: null,
  init() { this.root = $('#screens'); },
  show(name, opts = {}) { this.stack = []; this.push(name, opts); },
  push(name, opts = {}) {
    if (this.cur) this.cur.el.remove();
    const def = SCREENS[name];
    const el = el2('div', 'scr ' + (def.cls || '')); this.root.appendChild(el);
    const s = { name, def, el, items: [], focus: 0, opts };
    this.stack.push(s); this.cur = s;
    def.build(s, opts);
    this.bindMouse(s); this.renderFocus();
    return s;
  },
  pop() {
    const s = this.stack.pop(); if (s) s.el.remove();
    this.cur = this.stack[this.stack.length - 1] || null;
    if (this.cur) { this.root.appendChild(this.cur.el); this.cur.def.build(this.cur, this.cur.opts, true); this.bindMouse(this.cur); this.renderFocus(); }
  },
  close() { for (const s of this.stack) s.el.remove(); this.stack = []; this.cur = null; },
  top() { return this.cur ? this.cur.name : null; },
  bindMouse(s) {
    s.items.forEach((it, i) => {
      it.el.onmouseenter = () => { s.focus = i; this.renderFocus(); };
      it.el.onclick = (e) => { s.focus = i; this.renderFocus(); if (it.right && e.offsetX > it.el.clientWidth / 2) it.right(); else if (it.left && e.offsetX < it.el.clientWidth / 3) it.left(); else it.act?.(); Sound.sfx('ok'); this.refresh(); };
    });
  },
  renderFocus() { const s = this.cur; if (!s) return; s.items.forEach((it, i) => it.el.classList.toggle('f', i === s.focus)); },
  refresh() { const s = this.cur; if (s && s.def.refresh) s.def.refresh(s); },
  frame(dt) {
    const s = this.cur; if (!s) return;
    const a = Input.menu();
    if (s.def.frame && s.def.frame(s, dt, a) === true) return;
    if (!s.items.length) { if (a.back && s.def.back) { Sound.sfx('back'); s.def.back(s); } return; }
    if (a.up) { s.focus = (s.focus + s.items.length - 1) % s.items.length; Sound.sfx('move'); this.renderFocus(); }
    if (a.down) { s.focus = (s.focus + 1) % s.items.length; Sound.sfx('move'); this.renderFocus(); }
    const it = s.items[s.focus];
    if (a.left && it.left) { it.left(); Sound.sfx('move'); this.refresh(); }
    if (a.right && it.right) { it.right(); Sound.sfx('move'); this.refresh(); }
    if (a.ok && it.act) { Sound.sfx('ok'); it.act(); this.refresh(); }
    else if ((a.back || (a.options && s.def.optionsCloses)) && s.def.back) { Sound.sfx('back'); s.def.back(s); }

function settingRows(s, box) {
  const segs = (v) => `<span class="seg">${Array.from({ length: 10 }, (_, i) => `<b class="${i < v ? 'on' : ''}"></b>`).join('')}</span>`;
  const rows = [
    ['Master Volume', 'master', 'vol'], ['Music', 'music', 'vol'], ['Sound Effects', 'sfx', 'vol'], ['Voices', 'voice', 'vol'],
    ['Invert Horizontal (stick)', 'invertX', 'bool'], ['Invert Vertical (stick)', 'invertY', 'bool'],
    ['Vibration', 'rumble', 'bool'], ['Screen Shake', 'shake', 'bool'], ['Tutorial Hints', 'hints', 'bool'],
    ['Difficulty', 'difficulty', 'diff'], ['Bloom Glow', 'bloom', 'bool'], ['Ink Outlines', 'outlines', 'bool'],
  ];
  const list = el2('div', 'rows'); box.appendChild(list);
  const render = (it, [label, key, kind]) => {
    const v = settings[key];
    const val = kind === 'vol' ? segs(v) : kind === 'bool' ? `<span class="arrows">${v ? 'ON' : 'OFF'}</span>` : `<span class="arrows">${DIFF[v].name}</span>`;
    it.el.innerHTML = `<span>${label}${key === 'outlines' ? ' <small style="opacity:.6">(next stage)</small>' : ''}${key === 'difficulty' && Game.world ? ' <small style="opacity:.6">(next game)</small>' : ''}</span><span class="v">${val}</span>`;
  };
  for (const r of rows) {

    const change = (d) => {
      if (kind === 'vol') settings[key] = clamp(settings[key] + d, 0, 10);
      else if (kind === 'bool') settings[key] = !settings[key];

      saveSettings(); Sound.applyVolumes(); render(it, r);

    const it = UI.item(s, list, '', () => change(1), { cls: 'row', left: () => change(-1), right: () => change(1) });

  }

  void reset;
}

function awardsFor(w, p) {

  if (best((q) => q.maxChain) || (ps.length === 1 && p.maxChain >= 15)) out.push({ title: 'Combo Poet', detail: `${p.maxChain}-hit combo` });

// ==== 12_net.js
// ---------------------------------------------------------------- AI Hub co-op: the host runs the world, every copy moves its own turtle
// host -> all   's' snapshot ~12/s unreliable · 'e' event batch ≤5/s reliable (fx, hurts aimed at one player, dialogue)
// client -> host 'm' my turtle ~12/s unreliable · 'c' claim batch ≤6/s reliable (hits, grabs, throws, breakables)
const PHASES = ['intro', 'scroll', 'fight', 'auto', 'boss', 'clear', 'warp', 'done'];
const PROBE_INPUT = { x: 0, y: 0, attack: false, jump: false };
const HubNet = {
  on: false, info: null, me: -1, world: null, lastSnap: 0, lastEv: 0, lastM: 0, lastC: 0, claims: [], snapAt: -Infinity, finished: false, ended: false,
  claim(c) { this.claims.push(c); },
  attach(world, info) {
    this.on = true; this.info = info; this.me = info.me; this.world = world;
    world.net = this;
  },
  tick() {
    const w = this.world; if (!w || this.ended) return;
    const now = performance.now(); const at = Math.round(AIHub.time());
    if (AIHub.isHost) {
      if (now - this.lastSnap > 80) { this.lastSnap = now; AIHub.send(this.snapshot(at), { reliable: false }); }
      if (w.outbox.length && now - this.lastEv > 200) {
        this.lastEv = now;
        const evs = w.outbox.splice(0, 60).map(packEvent);
        AIHub.send({ t: 'e', at, v: evs });
      }
    } else {
      const me = w.players.find((p) => p.local);
      if (me && now - this.lastM > 80) {
        this.lastM = now;
        AIHub.send({ t: 'm', at, s: [r2(me.x), r2(me.y), r2(me.z), me.face, PST.indexOf(me.st), r2(me.t), Math.round(me.hp), me.lives, Math.round(me.meter), me.held, me.combo, (me.jumpAtk ? 1 : 0) | (me.dive ? 2 : 0), me.inv > 0 ? 1 : 0, me.tosses, me.maxChain, me.pizzas, me.deaths, me.chain, me.knees] }, { to: AIHub.host, reliable: false });
      }

  },
  snapshot(at) {

      t: 's', at, st: w.stageIdx, sg: w.segIdx, ph: PHASES.indexOf(w.phase), cx: r2(w.camX), ht: r2(w.ht), el: Math.round(w.elapsed),
      p: w.players.filter((p) => !p.gone).map((p) => [p.id, r2(p.x), r2(p.y), r2(p.z), p.face, PST.indexOf(p.st), r2(p.t), Math.round(p.hp), p.lives, Math.round(p.meter), p.held, p.combo, (p.jumpAtk ? 1 : 0) | (p.dive ? 2 : 0), w.score[p.id] || 0, p.kos, p.knees, p.inv > 0 ? 1 : 0]),
      e: w.enemies.map((e) => [e.id, ENEMY_TYPES.indexOf(e.type), r2(e.x), r2(e.y), r2(e.z), e.face, EST.indexOf(e.st), r2(e.t), Math.round(e.hp), e.maxhp, e.heldBy, MOVE_ID.indexOf(e.move), e.flash > 0 ? 1 : 0]),
      q: w.projs.map((q) => [q.id, PROJ_K.indexOf(q.k), r2(q.x), r2(q.y), r2(q.z), r2(q.t), q.mark ? 1 : 0]),
      k: w.pickups.map((k) => [k.id, Object.keys(PICKUPS).indexOf(k.k), r2(k.x), r2(k.z), r2(k.y), r2(k.t)]),
      b: w.breakables.map((b) => (b.alive ? 1 : 0)),
      hy: (w.hydrants || []).map((h) => (h.spray > 0 ? 1 : 0)),
      fz: w.freezeT > 0 ? 1 : 0, ov: w.over ? 1 : 0, won: w.won ? 1 : 0,
    };
  },
  message(data, from) {
    const w = this.world; if (!w || this.ended || !data) return;
    if (AIHub.isHost) {
      const p = w.players.find((q) => q.id === from);
      if (!p || p.local) return;
      if (data.t === 'm' && Array.isArray(data.s)) {
        if (data.at < (p.netAt ?? -Infinity)) return;

        p.x = num(s[0], p.x); p.y = num(s[1], 0); p.z = clamp(num(s[2], p.z), Z_MIN, Z_MAX); p.face = s[3] < 0 ? -1 : 1;
        const st = PST[s[4]] || 'idle'; if (st !== p.st) p.st = st; p.t = num(s[5], 0); p.hp = clamp(num(s[6], 100), 0, 100); p.lives = s[7] | 0; p.meter = num(s[8], 0);

  },
  applySnapshot(s) {

      if (p.local) continue;

      seen.add(id);
      let e = w.enemies.find((q) => q.id === id);
      if (!e) { e = { id, type: ENEMY_TYPES[ti], x, y, z, face, st: 'idle', t: 0, hp, maxhp, heldBy: 0, flash: 0, move: 'none' }; w.enemies.push(e); }
      e.x = x; e.y = y; e.z = z; e.face = face; e.hp = hp; e.maxhp = maxhp; e.heldBy = heldBy; e.move = MOVE_ID[mv] || 'none';
      const ns = EST[st] || 'idle'; if (ns !== e.st) { e.st = ns; e.t = t; } else if (Math.abs(e.t - t) > 0.3) e.t = t;
      if (fl && e.flash <= 0) e.flash = 0.1;
    }

  leave(id) {

  },
  /** Host: the round is decided (or time is up). Everyone still here is ranked by score; the team won if the Count fell. */
  finish(won) {

      scores[p.id] = w.score[p.id] || 0;
      stats[p.id] = { 'K.O.s': p.kos, 'into screen': p.tosses, 'best combo': p.maxChain, pizzas: p.pizzas, falls: p.deaths, turtle: HEROES[p.hero].name };

    }

const r2 = (v) => Math.round(v * 100) / 100;

// ==== 13_main.js
// ---------------------------------------------------------------- game flow and the frame loop
const Game = {
  state: 'boot', world: null, setup: null, menuOpen: false, server: false, session: false, attractT: 0, attractStage: 0, readyPrompt: false, last: performance.now(),
  probeInput: PROBE_INPUT, outroDone: false,
  async boot() {
    UI.init(); Input.init(); Overlay.init();
    UI.show('loading');
    const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches && navigator.maxTouchPoints > 0;
    if (AIHub.active) {
      const info = await AIHub.connect({ mode: 'co-op', seats: [1, 4] });
      if (info) return this.bootSession(info);
    }
    try { await this.loadEngine(); } catch (e) { return this.fatal(e); }
    if (touchOnly && !Input.connectedPads().length) {
      this.state = 'touch'; View.showTitle(); UI.show('touch');
      addEventListener('gamepadconnected', () => { if (this.state === 'touch') this.toTitle(); });
      addEventListener('keydown', () => { if (this.state === 'touch') this.toTitle(); }, { once: true });
      requestAnimationFrame((t) => this.frame(t));
      return;
    }
    this.toTitle();
    requestAnimationFrame((t) => this.frame(t));
  },
  async loadEngine() {
    const msg = (t, p) => { const m = $('#loadmsg'); if (m) m.textContent = t; const b = $('#loadbar'); if (b) b.style.width = p + '%'; };
    msg('Waking up the GPU…', 20);
    await initGfx($('#gl'));
    msg('Loading physics…', 55);
    try { await Phys.init(GFX.scene); } catch (e) { console.warn('Rapier failed to load; props will stay still.', e); }
    msg('Tuning the bass…', 85);
    View.init();
    // warm the shader cache with a stage and every character so the first fight does not stutter
    const warm = new World({ role: 'solo', players: [0, 1, 2, 3].map((i) => ({ id: i, hero: i, local: false })), stage: 0 });
    View.loadStage(warm);
    for (const t of ENEMY_TYPES) warm.spawnEnemy(t, 'R');
    View.sync(warm, 0.016, new Set());
    await GFX.renderer.compileAsync(GFX.scene, GFX.camera).catch(() => {});
    renderFrame();
    View.clearSet();
    msg('Ready!', 100);
  },
  fatal(e) {
    const m = String(e && e.message || e);
    console.error(e);
    UI.show('error', { msg: m.replace(/[<>&]/g, '') });
    if (this.session) AIHub.fail(m);
  },
  // ---------------------------------------------------------------- local play
  toTitle() {
    this.state = 'title'; this.world = null; this.menuOpen = false; HUD.hide(); Dialog.clear();
    View.showTitle(); UI.show('title'); Sound.play('title'); Input.idle = 0;
  },
  startIntro(setup) {
    this.setup = setup; this.state = 'intro'; UI.close(); Sound.play('select');
    const box = el2('div', 'scr'); box.innerHTML = `<div class="tagline outline" style="position:absolute;top:6vh">CHANNEL 9 ACTION NEWS · LIVE</div><div class="foot outline" style="position:absolute;bottom:2vh">${glyphs('{ok} next · {opt} skip')}</div>`;
    $('#screens').appendChild(box); this.introEl = box;
    $('#hud').classList.remove('hidden'); $('#pp').innerHTML = '';
    Dialog.play(INTRO, { auto: false, onDone: () => this.startGame(setup) });
  },
  startGame(setup, stage = 0) {
    this.introEl?.remove(); this.introEl = null; Dialog.clear(); UI.close();
    this.setup = setup; this.state = 'play'; this.menuOpen = false; this.outroDone = false;
    this.world = new World({ role: 'solo', players: setup.map((p) => ({ ...p })), stage });
    HUD.build(this.world);
    View.loadStage(this.world);
    this.handleEvents(this.world);
  },
  restart() { this.startGame(this.setup.map((p) => ({ ...p }))); },
  startAttract() {
    this.state = 'attract'; UI.close(); Dialog.clear();
    const stage = this.attractStage++ % STAGES.length;
    this.world = new World({ role: 'solo', attract: true, players: [0, 1, 2, 3].map((i) => ({ id: i, hero: i, local: true, ai: true })), stage });
    this.attractT = 0; HUD.build(this.world); View.loadStage(this.world); Sound.play(STAGES[stage].music);
  },
  openMenu() {
    if (this.menuOpen) return;
    this.menuOpen = true; UI.show('pause', { session: this.session });
  },
  closeMenu() { this.menuOpen = false; UI.close(); },
  /** Free pads (and the keyboard) can drop in mid-game by pressing Cross / J / Enter. */
  dropIn() {
    const w = this.world; if (!w || this.session || w.attract) return;
    const used = new Set(w.players.filter((p) => !p.gone).map((p) => p.dev));
    if (w.players.filter((p) => !p.gone).length >= 4) return;
    for (const dev of ['kb', ...Input.connectedPads()]) {
      if (used.has(dev)) continue;
      const pressed = dev === 'kb' ? Input.keyPressed('Enter') || Input.keyPressed('KeyJ') : Input.padPressed(dev, BTN.cross) || Input.padPressed(dev, BTN.options);
      if (!pressed) continue;
      const id = [0, 1, 2, 3].find((n) => !w.players.some((p) => p.id === n && !p.gone));
      const hero = [0, 1, 2, 3].find((h) => !w.players.some((p) => p.hero === h && !p.gone)) ?? 0;
      w.players = w.players.filter((p) => p.id !== id);
      const p = makePlayer({ id, hero, local: true, dev }); w.players.push(p); w.score[id] = 0;
      w.respawn(p); Sound.sfx('join'); HUD.banner(`${HEROES[hero].name} JOINS!`, `PLAYER ${id + 1}`, 1.6);
      this.setup.push({ id, hero, local: true, dev });
      return;
    }
  },
  readLocal(p) {
    if (p.ai) return aiInput(this.world, p, this.dt);
    if (this.menuOpen) return NO_INPUT;
    if (p.dev === 'any') {
      const k = Input.read('kb'); const pads = Input.connectedPads(); const g = pads.length ? Input.read(pads[0]) : NO_INPUT;
      const r = {}; for (const key in k) r[key] = typeof k[key] === 'number' ? (Math.abs(g[key]) > Math.abs(k[key]) ? g[key] : k[key]) : k[key] || g[key];
      return r;
    }
    return Input.read(p.dev);
  },
  handleEvents(w) {
    const evs = w.events; w.events = [];
    for (const ev of evs) {
      if (ev.k === 'ouch' || ev.k === 'heal' || ev.k === 'grabno') { if (ev.to != null && !w.auth) continue; continue; }
      if (!this.server) View.onEvent(ev, w);
      switch (ev.k) {
        case 'stage': { const st = STAGES[ev.i]; HUD.banner(`STAGE ${ev.i + 1}`, `${st.name}  ·  ${st.era}`, 3.5); Sound.play(st.music); break; }
        case 'say': { const lines = STAGES[ev.s]?.say[ev.w]; if (lines && !w.attract) Dialog.play(lines, { auto: true }); break; }
        case 'hint': if (!w.attract) HUD.hint(ev.h); break;
        case 'go': HUD.goT = 3.2; Sound.sfx('tick'); break;
        case 'clear': HUD.banner(ev.i === undefined && w.phase === 'clear' ? 'STAGE CLEAR!' : 'STAGE CLEAR!', 'TOTALLY RHYME-TASTIC', 3); Sound.jingle('stage'); break;
        case 'warp': HUD.banner('INTO THE RHYME WARP!', 'NEXT STOP: ' + (STAGES[ev.i]?.era || ''), 3); break;
        case 'victory': this.victory(); break;
        case 'final': if (!w.auth) { w.over = true; w.won = !!ev.won; } break;
        default: break;
      }
    }
  },
  victory() {
    const w = this.world;
    saveHi(Math.max(...Object.values(w.score)));
    if (this.session) { if (AIHub.isHost) HubNet.finish(true); return; }
    if (w.attract) return;
    Sound.jingle('victory');
    setTimeout(() => { if (this.world !== w) return; this.state = 'outro'; Dialog.play(OUTRO, { auto: false, onDone: () => { UI.show('results', { world: w, won: true }); this.state = 'results'; Sound.play('title'); } }); }, 2500);
  },
  // ---------------------------------------------------------------- AI Hub session
  async bootSession(info) {
    this.session = true; this.server = !!info.server;
    HubNet.on = true;
    if (!this.server) {
      try { await this.loadEngine(); } catch (e) { return this.fatal(e); }
    }
    const players = info.players.map((p) => ({ id: p.id, hero: p.id % 4, name: p.name, color: p.color, local: !info.server && p.id === info.me, dev: 'any' }));
    const w = new World({ role: info.isHost ? 'host' : 'client', session: true, players, rng: AIHub.rng('deal'), difficulty: 1 });
    this.world = w; HubNet.attach(w, info);
    AIHub.on('message', (d, from) => HubNet.message(d, from));
    AIHub.on('leave', ({ id }) => HubNet.leave(id));
    AIHub.on('start', () => { Sound.init(); this.state = 'play'; this.readyPrompt = false; $('#countdown').classList.remove('hidden'); });
    AIHub.on('time-up', () => { if (AIHub.isHost) HubNet.finish(w.won); });
    AIHub.on('end', ({ reason }) => {
      HubNet.ended = true; this.state = 'ended'; Sound.silence(); this.menuOpen = false;
      if (!this.server) { UI.show('results', { world: w, won: w.won, session: true }); const t = el2('div', 'tagline outline'); t.textContent = reason === 'finished' ? 'Round over — thanks for playing!' : reason === 'sat-out' ? 'You sat this one out.' : 'Round cancelled.'; UI.cur.el.appendChild(t); }
    });
    if (!this.server) { UI.close(); HUD.build(w); View.loadStage(w); }

    if (info.splash || info.server) AIHub.ready();
    else {
      this.readyPrompt = true;
      const s = el2('div', 'scr dim'); s.id = 'readyp';
      s.innerHTML = `<div class="panel"><h2>TURTLES IN RHYME</h2><div class="rows"></div><div class="tagline" style="margin-top:2vmin">Press any key, click or tap when you are ready</div></div>`;
      for (const p of info.players) { const r = el2('div', 'row'); r.textContent = `${p.name} — ${HEROES[p.id % 4].name}${p.id === info.me ? ' (you)' : ''}`; r.style.color = p.color; $('.rows', s).appendChild(r); }
      $('#screens').appendChild(s);
    }
    requestAnimationFrame((t) => this.frame(t));
  },
  // ---------------------------------------------------------------- the loop
  frame(now) {
    const dt = Math.min(0.05, Math.max(0.0005, (now - this.last) / 1000)); this.last = now; this.dt = dt;
    try { this.tick(dt); } catch (e) { console.error(e); }

  },
  tick(dt) {

        break;
      }
      case 'attract': {

        this.handleEvents(w);

        View.sync(w, dt, new Set()); HUD.update(w, dt);
        break;
      }
      case 'intro': {
        View.time += dt; View.updateTitle(dt);
        const a = Input.menu();
        if (a.options) { Dialog.clear(); this.startGame(this.setup); break; }
        Dialog.update(dt, a.ok);
        break;
      }
      case 'play': case 'outro': case 'results': {
        if (this.state === 'play') {
          const pauseReq = w.players.some((p) => p.local && !p.ai && !p.gone && Input.read(p.dev).options) || (Input.menu().options && !this.menuOpen);
          if (pauseReq && !this.menuOpen) { this.openMenu(); Sound.sfx('ok'); }
          else if (this.menuOpen) UI.frame(dt);
        } else if (this.state === 'results') UI.frame(dt);
        const paused = this.menuOpen;
        if (!paused) {
          if (this.state === 'play') this.dropIn();
          for (const p of w.players) if (p.local && !p.gone) p.input = this.state === 'play' ? this.readLocal(p) : NO_INPUT;
          w.step(dt);
          this.handleEvents(w);
          if (this.state === 'outro') Dialog.update(dt, Input.menu().ok);
          else Dialog.update(dt, false);
          // game over: every turtle out of continues
          const live = w.players.filter((p) => !p.gone);

      }
      default: break;
    }
    if (GFX.ready) { FX.update(dt); Phys.step(dt); renderFrame(); Overlay.draw(dt); }
  },
  sessionTick(dt) {
    const w = this.world;
    if (this.readyPrompt && Input.anyPressed) { this.readyPrompt = false; $('#readyp')?.remove(); AIHub.ready(); Sound.init(); }
    const time = AIHub.time();
    const live = this.state === 'play' && time >= 0;

      const cd = $('#countdown');

      else if (!cd.classList.contains('hidden')) { if (time >= 0 && time < 900) cd.textContent = 'GO!'; else cd.classList.add('hidden'); }

        const r = me ? this.readLocal(me) : NO_INPUT;
        const raw = Input.read('kb'); const pads = Input.connectedPads(); const g = pads.length ? Input.read(pads[0]) : NO_INPUT;
        if ((raw.options || g.options) && !this.menuOpen) { this.openMenu(); Sound.sfx('ok'); }
        else if (this.menuOpen) UI.frame(dt);
        if (me) { me.input = live ? r : NO_INPUT; this.probeInput = { x: r2(r.mx), y: r2(r.mz), attack: !!r.aHeld, jump: !!r.jHeld }; }
        if (AIHub.limitMs && time >= 0) { const tm = $('#timer'); tm.classList.remove('hidden'); tm.textContent = 'TIME ' + fmtTime(Math.max(0, (AIHub.limitMs - time) / 1000)); }
      } else if (this.state === 'ended') UI.frame(dt);
    }
    if (live && !HubNet.ended) {
      w.step(dt);
      if (AIHub.isHost && w.over && !HubNet.finished) HubNet.finish(w.won);
      HubNet.tick();
    }
    if (!this.server) {
      this.handleEvents(w);
      Dialog.update(dt, false);
      View.sync(w, HubNet.ended ? 0 : dt, new Set()); HUD.update(w, dt);
      if (GFX.ready) { FX.update(dt); Phys.step(dt); renderFrame(); Overlay.draw(dt); }
    } else { w.events = []; }
  },
};

AIHub.probe(() => ({
  scene: Game.state === 'title' || Game.state === 'attract' || Game.state === 'touch' ? (UI.top() && UI.top() !== 'title' ? 'menu' : 'title')
    : Game.state === 'intro' ? 'menu' : Game.state === 'play' || Game.state === 'outro' ? 'play' : Game.state === 'session-wait' ? 'ready' : Game.state === 'results' || Game.state === 'ended' ? 'over' : 'title',
  menu: !!Game.menuOpen || (Game.state === 'title' && UI.top() === 'settings'),
  world: Game.world ? Math.round(Game.world.time * 1000) / 1000 : 0,
  input: Game.probeInput,
}));

window.__turtles = { HUD,
  Game, View, GFX, settings, Input,
  /** Test hook: headless Chrome cannot present a WebGPU canvas, so render the scene to a target and show it as an image under the HUD. */
  async snap() {
    const r = GFX.renderer, w = innerWidth, h = innerHeight;
    const rt = new THREE.RenderTarget(w, h); rt.texture.colorSpace = THREE.SRGBColorSpace;
    r.setRenderTarget(rt); r.render(GFX.scene, GFX.camera);

    g.putImageData(id, 0, 0); g.drawImage($('#fx2d'), 0, 0);

    img.src = c.toDataURL('image/png');
    await new Promise((res) => { img.onload = res; });
  },
  unsnap() { document.getElementById('__snap')?.remove(); },
};
Game.boot();
