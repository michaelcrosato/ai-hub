<!--
STARFOX BARREL 64 · single-file demo
Source Information
- Date: 2026-10-20 19:15
- Source: Starfox 64 for N64 (Nintendo, 1997). Starfox Barrel 64 is an original spiritual successor and parody title; no original assets, names or audio are used.
- Tech: Three.js r180 (three/webgpu WebGPURenderer, TSL node materials, toonOutlinePass, BloomNode, PostProcessing) · WebGPU only, no fallback · Rapier 0.19.3 (@dimforge/rapier3d-compat) for colliders, ray-cast lasers, shape overlap tests, dynamic debris and zero-g asteroids · Web Audio API (fully synthesized SFX, procedural music tracker, radio voice blips) · Gamepad API (PS5 standard mapping + vibration) · vanilla ES modules bundled with esbuild 0.25 into one HTML file · Three.js and Rapier loaded from the jsDelivr CDN.
- Art Direction: stylized cel shading. 3-step toon ramp, faceted flat-shaded low-poly models, screen-space inverted-hull ink outlines, banded sky gradient, emissive bloom on lasers and engines, cartoon fireball explosions.
- Animation: procedural code-driven animation. Spline rails with arc-length parameterisation, quaternion flight dynamics (bank, barrel roll, somersault, U-turn), sinusoidal walk-cycle rig for the walker boss, ribbon trails, pooled particles and physics-simulated debris. No keyframe files.
- Testing: the prompt placed no restrictions on testing ("No restriction on testing"). It asked for checks across small phones, tablets and wide screens and in WebKit. Automated checks ran in headless Chromium (SwiftShader WebGPU) via Playwright. Real iOS Safari was not available.
- Environment: Claude Code CLI (headless); Linux; browser unknown.
- Model: Anthropic, claude-opus-5-5, reasoning effort medium.
- Usage: unknown (no reliable cost/token meter available in-session).

Engine Feedback
- Liked most: TSL + WebGPURenderer make custom effects (ocean waves via positionNode, the sky shader, a vignette/flash post chain) short and composable, and toonOutlinePass gave ink lines almost for free. Rapier's query API (castRay, intersectionsWithShape) maps neatly onto arcade lasers and hit-boxes.
- Stuck / guessed wrong: Object3D.lookAt points +Z at the target, unlike cameras, which matters for quaternion flight math. navigator.gpu only exists in secure contexts, so about:blank testing silently fails. Rapier ray hits renamed toi to timeOfImpact.
- Most important thing built by hand: the rail system (arc-length Catmull-Rom frames, branching routes, a closed boss loop) plus the event timeline that drives spawns, radio and checkpoints.
- Hardest part: toon outlines on hard-edged boxes need merged-vertex smooth normals for a closed hull, while faceted shading still needs flat normals (flatShading on the toon node material).
- Would remove or overhaul: WebGPURenderer's silent automatic WebGL2 fallback. A strict-mode flag would make a WebGPU-only requirement explicit.
- Would change: ship a per-object outline thickness/colour on toonOutlinePass and an official BVH raycast helper for large terrain meshes.

Prompt Feedback
- Prompt: TASK.md, which asks for an original spiritual successor to Starfox 64 as a feature-complete single-file demo.
- Liked most: clear "feature-complete demo" reference points (MGS2 Tanker, Doom E1) and the controller-first 10-foot UX direction.
- Confusing: "[PROMPT]" under Prompt Feedback looks like an unfilled template slot. The GameTitle-SOURCE file naming does not say how to format spaces or punctuation.
- Hardest: fitting rail mode, all-range mode, two bosses, wingmen, branching, attract mode and full menus into one coherent, bug-free slice in a single session.
- One test to run: a long soak test on real hardware with a DualSense, playing both missions start to finish on all three difficulties while logging frame time, memory and any console errors.

var ABOUT_SECTIONS = [
  { h: "Source Information", p: [
    "Date: 2026-10-20 19:15",
    "Source: Starfox 64 for N64 (Nintendo, 1997). Starfox Barrel 64 is an original spiritual successor and parody title; no original assets, names or audio are used.",
    "Tech: Three.js r180 (three/webgpu WebGPURenderer, TSL node materials, toonOutlinePass, BloomNode, PostProcessing) \xB7 WebGPU only, no fallback \xB7 Rapier 0.19.3 (@dimforge/rapier3d-compat) for colliders, ray-cast lasers, shape overlap tests, dynamic debris and zero-g asteroids \xB7 Web Audio API (fully synthesized SFX, procedural music tracker, radio voice blips) \xB7 Gamepad API (PS5 standard mapping + vibration) \xB7 vanilla ES modules bundled with esbuild 0.25 into one HTML file \xB7 Three.js and Rapier loaded from the jsDelivr CDN.",
    "Art Direction: stylized cel shading. 3-step toon ramp, faceted flat-shaded low-poly models, screen-space inverted-hull ink outlines, banded sky gradient, emissive bloom on lasers and engines, cartoon fireball explosions.",
    "Animation: procedural code-driven animation. Spline rails with arc-length parameterisation, quaternion flight dynamics (bank, barrel roll, somersault, U-turn), sinusoidal walk-cycle rig for the walker boss, ribbon trails, pooled particles and physics-simulated debris. No keyframe files.",
    'Testing: the prompt placed no restrictions on testing ("No restriction on testing"). It asked for checks across small phones, tablets and wide screens and in WebKit. Automated checks ran in headless Chromium (SwiftShader WebGPU) via Playwright. Real iOS Safari was not available.',
    "Environment: Claude Code CLI (headless); Linux; browser unknown.",
    "Model: Anthropic, claude-opus-5-5, reasoning effort medium.",
    "Usage: unknown (no reliable cost/token meter available in-session)."
  ] },
  { h: "Engine Feedback", p: [
    "Liked most: TSL + WebGPURenderer make custom effects (ocean waves via positionNode, the sky shader, a vignette/flash post chain) short and composable, and toonOutlinePass gave ink lines almost for free. Rapier's query API (castRay, intersectionsWithShape) maps neatly onto arcade lasers and hit-boxes.",
    "Stuck / guessed wrong: Object3D.lookAt points +Z at the target, unlike cameras, which matters for quaternion flight math. navigator.gpu only exists in secure contexts, so about:blank testing silently fails. Rapier ray hits renamed toi to timeOfImpact.",
    "Most important thing built by hand: the rail system (arc-length Catmull-Rom frames, branching routes, a closed boss loop) plus the event timeline that drives spawns, radio and checkpoints.",
    "Hardest part: toon outlines on hard-edged boxes need merged-vertex smooth normals for a closed hull, while faceted shading still needs flat normals (flatShading on the toon node material).",
    "Would remove or overhaul: WebGPURenderer's silent automatic WebGL2 fallback. A strict-mode flag would make a WebGPU-only requirement explicit.",
    "Would change: ship a per-object outline thickness/colour on toonOutlinePass and an official BVH raycast helper for large terrain meshes."

.pop{position:absolute;font-weight:900;font-size:3vmin;color:#fff;text-shadow:0 0 1vmin #39d0ff,0 .3vmin 0 #000;transform:translate(-50%,-50%);animation:rise .9s forwards}
@keyframes rise{to{transform:translate(-50%,-260%);opacity:0}}
.card-big{position:absolute;left:0;right:0;top:30vh;text-align:center}
.card-big .k{font-size:3vmin;letter-spacing:.5em;color:#9fe3ff}
.card-big .t{font-size:11vmin;font-weight:900;font-style:italic;line-height:1;text-shadow:0 .6vmin 0 #062048,0 0 3vmin rgba(60,190,255,.9);animation:slidein .5s}
.card-big .s{font-size:3vmin;letter-spacing:.2em;margin-top:1.2vmin}
@keyframes slidein{from{transform:translateX(-30vw) skewX(-20deg);opacity:0}}
.warning{position:absolute;left:0;right:0;top:40vh;text-align:center;font-size:9vmin;font-weight:900;letter-spacing:.3em;color:#ff3a4a;text-shadow:0 0 3vmin #f00;animation:blink .5s 6}
.attract{position:absolute;left:0;right:0;top:3vh;text-align:center;font-size:3.4vmin;font-weight:900;letter-spacing:.4em;color:#fff;text-shadow:0 0 1.5vmin #39d0ff}
.attract2{position:absolute;left:0;right:0;bottom:17vh;text-align:center;font-size:3vmin;font-weight:800;animation:blink 1.4s infinite}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.results{width:min(110vmin,90vw);padding:3vmin 4vmin;pointer-events:auto}
.results h2{font-size:5vmin;margin:0;font-style:italic}
.rrow{display:flex;justify-content:space-between;font-size:3vmin;padding:.8vmin 0;border-bottom:.15vmin solid rgba(120,160,255,.25)}
.rrow b{color:var(--gold)}
.medalbig{font-size:4vmin;font-weight:900;margin:2vmin 0;color:var(--gold);text-shadow:0 0 2vmin #fa0}
.teamres{display:flex;gap:3vmin;justify-content:center;margin:2vmin 0}
.teamres div{text-align:center;font-size:2.2vmin}.teamres canvas{width:11vmin;height:11vmin;border-radius:1vmin;border:.3vmin solid #9fe3ff;display:block;margin:0 auto .6vmin}
.brief{width:min(120vmin,90vw);padding:3vmin 4vmin;pointer-events:auto}
.brief .line{text-align:left;display:flex;gap:2vmin;align-items:center;margin:1.4vmin 0;font-size:2.8vmin;opacity:.25;transition:opacity .3s}
.brief .line.on{opacity:1}
.brief canvas{width:10vmin;height:10vmin;border-radius:1vmin;border:.25vmin solid #9fe3ff;flex:none}
.block{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#0c2050,#02040c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;text-align:center;padding:6vmin;pointer-events:auto}
.block h1{font-size:6vmin;margin:0}.block p{font-size:3vmin;max-width:80vmin;color:#cfe3ff}
.btn{pointer-events:auto;font-size:3.4vmin;font-weight:800;padding:2vmin 5vmin;border-radius:1.6vmin;border:.35vmin solid var(--accent);background:rgba(57,208,255,.2);color:#fff;cursor:pointer}
.fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .4s;pointer-events:none}.fade.on{opacity:1}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3vmin;letter-spacing:.3em;background:#02040c}
