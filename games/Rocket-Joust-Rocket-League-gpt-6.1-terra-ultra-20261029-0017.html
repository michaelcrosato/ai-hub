      }
    }
    car.jumpHeld=jumping;
    body.setLinvel({x:forwardX*forwardSpeed+sideX*sideSpeed,y:vy,z:forwardZ*forwardSpeed+sideZ*sideSpeed},true);
    body.setRotation({x:0,y:Math.sin(car.yaw/2),z:0,w:Math.cos(car.yaw/2)},true);

  }

    this.phase='finished'; this.phaseTimer=0;

  }
  dispose() { this.world.free(); }
}

/* Peer-to-peer, host-authoritative transport. Signaling codes are exchanged out of band.
   Host: hostOffer(1..3) -> guestAnswer(code) -> hostAccept(slot, code).
   Events: {type:'status',slot,status}, {type:'message',slot,data},
           {type:'error',slot,error}. broadcast() is host-only, send() is guest-only. */
class ArenaNetwork {
  constructor(onEvent = () => {}) {
    this.onEvent = onEvent;
    this.role = null;
    this.slot = 0;
    this.peers = new Map();
    this.configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
  }

  emit(event) {
    try { this.onEvent({ role: this.role, localSlot: this.slot, ...event, ...(event.type === 'status' ? { connectionState: event.status } : {}) }); } catch (error) { console.error('Network event handler:', error); }
  }

  static encode(value) {
    return 'RJ1.' + btoa(unescape(encodeURIComponent(JSON.stringify(value))));
  }

  static decode(code, kind) {
    try {
      const clean = String(code).trim().replace(/\s+/g, '');
      if (!clean.startsWith('RJ1.')) throw new Error('Wrong code prefix');
      const packet = JSON.parse(decodeURIComponent(escape(atob(clean.slice(4)))));
      if (packet.v !== 1 || packet.kind !== kind || !Number.isInteger(packet.slot) || packet.slot < 1 || packet.slot > 3 || typeof packet.token !== 'string' || typeof packet.sdp !== 'string' || !packet.sdp) throw new Error('Invalid code');
      return packet;
    } catch (_) {
      throw new Error('That ' + kind + ' code is invalid. Copy the complete code and try again.');
    }
  }

  static async gathered(pc) {
    if (pc.iceGatheringState === 'complete') return;
    await new Promise((resolve, reject) => {
      let timer;
      const done = () => {
        if (pc.iceGatheringState !== 'complete') return;
        cleanup();
        resolve();
      };
      const cleanup = () => {
        clearTimeout(timer);
        pc.removeEventListener('icegatheringstatechange', done);
      };
      pc.addEventListener('icegatheringstatechange', done);
      timer = setTimeout(() => {
        cleanup();
        // Local candidates can be usable even if a STUN server never responds.
        if (pc.localDescription?.sdp?.includes('a=candidate:')) resolve();
        else reject(new Error('Could not gather a network address. Check your connection and try again.'));
      }, 12000);
      done();
    });
  }

  makePeer(slot, token) {
    if (typeof RTCPeerConnection === 'undefined') throw new Error('This browser does not support WebRTC.');
    this.closePeer(slot);
    const pc = new RTCPeerConnection(this.configuration);
    const peer = { pc, channel: null, token, lastStatus: '' };
    this.peers.set(slot, peer);
    const status = (value) => {
      if (this.peers.get(slot) !== peer || peer.lastStatus === value) return;
      peer.lastStatus = value;
      this.emit({ type: 'status', slot, status: value });
    };
    peer.status = status;
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed') status('failed');
      else if (pc.connectionState === 'disconnected') status('disconnected');
      else if (pc.connectionState === 'closed') status('closed');
      else if (pc.connectionState === 'connecting') status('connecting');
    };
    pc.onicecandidateerror = () => { /* Other candidates may still connect. */ };
    pc.ondatachannel = (event) => this.attachChannel(slot, peer, event.channel);
    return peer;
  }

  attachChannel(slot, peer, channel) {
    peer.channel = channel;
    channel.onopen = () => peer.status('connected');
    channel.onclose = () => peer.status('disconnected');
    channel.onerror = () => this.emit({ type: 'error', slot, error: 'The player connection encountered an error.' });
    channel.onmessage = (event) => {
      if (this.peers.get(slot) !== peer || typeof event.data !== 'string' || event.data.length > 262144) return;
      try { this.emit({ type: 'message', slot, data: JSON.parse(event.data) }); }
      catch (_) { this.emit({ type: 'error', slot, error: 'Received an invalid network message.' }); }
    };
    if (channel.readyState === 'open') peer.status('connected');
  }

  async hostOffer(slot) {
    if (!Number.isInteger(slot) || slot < 1 || slot > 3) throw new Error('Choose guest slot 1, 2, or 3.');
    if (this.role === 'guest') throw new Error('Leave the current game before hosting.');
    this.role = 'host';
    const token = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
    const peer = this.makePeer(slot, token);
    this.attachChannel(slot, peer, peer.pc.createDataChannel('arena'));
    peer.status('preparing');
    try {
      await peer.pc.setLocalDescription(await peer.pc.createOffer());
      await ArenaNetwork.gathered(peer.pc);
      peer.status('waiting for answer');
      return ArenaNetwork.encode({ v: 1, kind: 'offer', slot, token, sdp: peer.pc.localDescription.sdp });
    } catch (error) {
      this.closePeer(slot);
      throw error;
    }
  }

  async guestAnswer(code) {
    if (this.role === 'host' || this.peers.size) throw new Error('Leave the current game before joining another.');
    const packet = ArenaNetwork.decode(code, 'offer');
    this.role = 'guest';
    this.slot = packet.slot;
    const peer = this.makePeer(packet.slot, packet.token);
    peer.status('preparing');
    try {
      await peer.pc.setRemoteDescription({ type: 'offer', sdp: packet.sdp });
      await peer.pc.setLocalDescription(await peer.pc.createAnswer());
      await ArenaNetwork.gathered(peer.pc);
      peer.status('send answer to host');
      return ArenaNetwork.encode({ v: 1, kind: 'answer', slot: packet.slot, token: packet.token, sdp: peer.pc.localDescription.sdp });
    } catch (error) {
      this.close();
      throw new Error('Could not use that invitation: ' + error.message);
    }
  }

  async hostAccept(slot, code) {
    if (this.role !== 'host') throw new Error('Create an invitation first.');
    const packet = ArenaNetwork.decode(code, 'answer');
    const peer = this.peers.get(slot);
    if (!peer || packet.slot !== slot || packet.token !== peer.token) throw new Error('This answer belongs to a different invitation.');
    if (peer.pc.signalingState !== 'have-local-offer') throw new Error('This invitation has already been used.');
    await peer.pc.setRemoteDescription({ type: 'answer', sdp: packet.sdp });
    peer.status('connecting');
  }

  sendTo(slot, data) {
    const channel = this.peers.get(slot)?.channel;
    if (!channel || channel.readyState !== 'open') return false;
    // Avoid unbounded buffering if a peer is slow or temporarily disconnected.
    if (channel.bufferedAmount > 262144) return false;
    try { channel.send(JSON.stringify(data)); return true; } catch (_) { return false; }
  }

  broadcast(data) {
    if (this.role !== 'host') return 0;
    let sent = 0;
    for (const slot of this.peers.keys()) if (this.sendTo(slot, data)) sent++;
    return sent;
  }

  send(data) {
    return this.role === 'guest' && this.sendTo(this.slot, data);
  }

  closePeer(slot) {
    const peer = this.peers.get(slot);
    if (!peer) return;
    this.peers.delete(slot);
    if (peer.channel) peer.channel.close();
    peer.pc.close();
  }

  close() {
    for (const slot of Array.from(this.peers.keys())) this.closePeer(slot);
    this.role = null;
    this.slot = 0;
  }
}
