        });

                e.preventDefault();

                this.game.keys.add(key);

                e.preventDefault();
                void this.audio.unlock();
                this.game.primaryDown();

        });
        window.addEventListener('pointerup', e => {
            const key = this.touchKeys.get(e.pointerId);

                this.touchKeys.delete(e.pointerId);

                this.game.line = Number(input.value);
            }
            if (input.id === 'length') {
                this.game.length = Number(input.value);
            }
            if (input.id === 'volume') {
                this.audio.setVolume(Number(input.value));
                this.settingsSaved();
            }
        });
        this.root.addEventListener('change', e => {
            const input = e.target;
            if (input.id === 'difficulty') {
                this.config.difficulty = input.value;
                this.persistConfig();

            if (input.id === 'mode') {
                this.config.mode = input.value;
                this.persistConfig();
                this.showMenu();
            }
            if (input.id === 'autorun') {
                this.game.autoRun = input.checked;
                this.settingsSaved();
            }
            if (input.id === 'bowler') {
                this.game.setBowler(Number(input.value));
            }
        });
        window.addEventListener('keydown', e => {
            const el = e.target;
            if (['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName))
                return;
            if (this.modalName) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    if (['toss', 'interval', 'result'].includes(this.modalName))
                        return;
                    this.dismissModal();
                }
                if (e.key === 'Tab')
                    this.trapFocus(e);
                return;
            }
            if (e.code === 'Escape') {
                e.preventDefault();
                if (!this.game.menu)
                    this.showPause();
                return;
            }
            if (e.code === 'KeyM') {
                this.action('sound', '');
                return;
            }
            if (this.game.menu)
                return;
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code))
                e.preventDefault();
            this.game.keys.add(e.code);

                void this.audio.unlock();
                this.game.primaryDown();
            }
            if (e.code === 'KeyR')
                this.game.requestRun();
            if (e.code === 'KeyX')
                this.game.cancelRun();
            if (e.code === 'KeyF')
                this.game.fieldAction();
            if (e.code === 'KeyE')

    action(action, value) {
        if (action === 'home') {
            this.showMenu();
            return;
        }
        if (action === 'team') {
            this.config.team = value;
            this.persistConfig();
            this.showMenu();
            return;
        }
        if (action === 'overs') {
            this.config.overs = Number(value);
            this.persistConfig();
            this.showMenu();
            return;
        }
        if (action === 'practice-role') {
            this.config.practiceRole = value;
            this.persistConfig();
            this.showMenu();
            return;
        }
        if (action === 'start')
            this.startToss();
        if (action === 'call')
            this.toss(value);
        if (action === 'toss-choice') {
            this.tossChoice = value;
            this.beginMatch();
        }
        if (action === 'begin')
            this.beginMatch();
        if (action === 'resume-save') {
            const saved = restoreMatch(readStorage(SAVE_KEY));

                this.dismissModal(false);
                this.game.start(saved);
                this.renderGame();
            }
            else
                this.toast('No valid saved match found.');
        }
        if (action === 'sound') {
            this.audio.setMuted(!this.audio.muted);
            this.settingsSaved();
            this.header.innerHTML = this.headerHTML(!this.game.menu);
            if (this.modalName === 'settings')
                this.showSettings();
        }
        if (action === 'fullscreen') {
            if (document.fullscreenElement)
                void document.exitFullscreen().catch(() => { });
            else
                void document.documentElement.requestFullscreen?.().catch(() => this.toast('Fullscreen is not available in this browser.'));
        }
        if (action === 'help')
            this.showHelp();
        if (action === 'settings')
            this.showSettings();
        if (action === 'rosters') {
            this.rosterTeam = this.config.team;
            this.showRosters();
        }
        if (action === 'roster-tab') {
            this.rosterTeam = value;
            this.showRosters();
        }
        if (action === 'roster-player')
            this.togglePlayer(value);
        if (action === 'order-up' || action === 'order-down')
            this.reorder(value, action === 'order-up' ? -1 : 1);
        if (action === 'close' || action === 'resume')
            this.dismissModal();
        if (action === 'pause')
            this.showPause();
        if (action === 'quit') {
            if (this.game.match)
                saveMatch(this.game.match);
            this.showMenu();
        }
        if (action === 'scorecard') {
            this.scoreTab = this.game.match?.current ?? 0;
            this.showScorecard();
        }
        if (action === 'score-tab') {
            this.scoreTab = Number(value);
            this.showScorecard();
        }
        if (action === 'shot') {
            this.game.shot = value;
            this.renderGame();
        }
        if (action === 'delivery-type') {
            if (this.game.phase === 'ready') {
                this.game.deliveryType = value;
                this.renderGame();
            }
        }
        if (action === 'field') {
            this.game.setField(value);
        }
        if (action === 'run')
            this.game.requestRun();
        if (action === 'cancel-run')
            this.game.cancelRun();
        if (action === 'field-action')
            this.game.fieldAction();
        if (action === 'boost') {
            this.game.toggleBoost();
            this.renderGame();
        }
        if (action === 'auto-run') {
            this.game.autoRun = !this.game.autoRun;
            this.settingsSaved();
            this.renderGame();
        }
        if (action === 'camera') {
            const a = ['broadcast', 'close', 'overhead'];
            this.game.camera = a[(a.indexOf(this.game.camera) + 1) % 3];
            this.toast(`${this.game.camera.toUpperCase()} CAMERA`);

        if (action === 'replay')

            if (this.game.match) {
