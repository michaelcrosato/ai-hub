<!--
MYTHMUSTERS: an original spiritual successor to MythBusters. Not affiliated with or endorsed by the show or its makers. All characters (Dot, Moss, Bucky) are original.

## Source Information
Date: 2026-11-01 18:43
Source: MythBusters (TV series, 2003–2018): hosts test myths, build rigs, film with high-speed cameras, deliver Confirmed / Plausible / Busted verdicts, and often blow things up anyway.
Genre and Perspective: physics experiment / sandbox puzzle with light driving and walking. Main perspective: third-person chase camera (PerspectiveCamera). Switchable: first person, and an orthographic "Blueprint" view (OrthographicCamera).
Tech: single HTML file; Three.js r180 (three.webgpu.js, WebGPURenderer with automatic WebGL 2 fallback, TSL node material sky); Rapier 0.19.3 (@dimforge/rapier3d-compat) for rigid bodies, joints, CCD, the kinematic character controller and the ray-cast vehicle controller; Web Audio API; Gamepad API; AI Hub Session Protocol v1 client 1.3.0. Libraries load from the jsDelivr CDN.
Art Direction: Three.js engine-native look: MeshStandardMaterial PBR, a directional sun with soft shadow maps, hemisphere fill, fog, procedural canvas textures, primitive-built models.
Animation: Three.js AnimationMixer with keyframe clips (idle, walk, run, cheer, shrug, point, jump) and cross-fades; Rapier drives every physical prop; a recorder plays physics back as a slow-motion "high-speed camera" replay.
Audio: all code-written with Web Audio: a step sequencer playing four original tracks (blues-rock theme, workshop groove, tension pulse, results reel); synthesized sound effects (cannon, explosions, bricks, dominoes, engine, steam, creaks); gibberish "Animalese" voices with formant filters for the narrator, Dot, Moss and Bucky.
Online: AI Hub session support in side-by-side (parallel) mode for 1–4 players: seeded start, live progress, a result with stats and awards. Local hot-seat Showdown for 2–4 players. No other network features.
Testing: headless Chromium (Playwright) with SwiftShader WebGPU/WebGL, CDN routed to local copies, deterministic frame stepping; AI Hub harness check at 1 and 2 players and with a player leaving.
Research: none beyond the AI Hub protocol README and the Rapier vehicle/character-controller type definitions; the show's format is from memory.
Environment: Claude Code CLI (headless); Linux; browser unknown
Model: Anthropic, claude-opus-5-5, reasoning effort medium
Usage: session time about 1 h 55 min (18:43 to about 20:38). API cost and token counts: unknown (not visible to the agent from inside the session).

## Testing Feedback
How many issues did testing catch? About 19: cannonballs stopping dead in a rigid brick stack, shots over the wall counted as "through", a camera method name collision, dominoes too fragile and then too forgiving, a Rapier aliasing crash from stale rig references, the car driving backwards, late takeoff detection, sleeping roof planks, ceiling planks jamming on the roof joists, a weak heater thrust, the AI Hub hello arriving after 10 s, real-time fades stalling stepped simulation, attract mode skipping myths, a disposed texture crashing the renderer, the Blueprint camera blocked by scenery, the car's first-person eye inside the dummy's head, menu overflow, a jump on menu confirm and over-long replays.
How many would be considered critical / game breaking? 7: the camera crash, the Rapier aliasing crash, the texture crash, the hub hello timeout, the reversed car, the jammed heater and the stalled fades.
Most helpful test: deterministic stepping with parameter sweeps (run a myth at several dial settings and print the verdicts). That exposed most of the physics and balance bugs in seconds without rendering.
Least helpful test: render-target screenshots on the WebGPU backend. They failed for an unrelated reason at first and cost time before a real crash was isolated.

## Engine Feedback
What did you like most? Rapier's built-in controllers: the ray-cast vehicle and the kinematic character controller gave driving and walking almost for free, and Three.js WebGPURenderer falls back to WebGL 2 on its own.
Did you get stuck or guess wrong? Yes: the vehicle's forward direction comes from the axle cross the ground normal, so the first guess drove backwards; and a sleeping Rapier body did not reliably wake when pushed from below by a CCD body.
Most important thing built myself: the experiment framework (dials, measured verdicts, goals), a transform recorder for slow-motion "high-speed camera" replays, and a mortar-fracture model, because rigid dry-stacked bricks spread a cannonball's impulse across the whole wall.
Hardest part: Rapier's wasm aliasing error. One bad remove() on an already-freed body leaves the world unusable, with a stack trace pointing at a later, innocent call.
Remove or overhaul: Three.js WebGPU texture lifetime. Disposing a texture still cached in render bindings crashes a later render pass instead of failing at dispose().
One change: Rapier breakable joints (or a fracture threshold) so walls, mortar and planks can break physically without game-side hacks.

## Prompt Feedback
What did you like most? The freedom to pick the show and the genre, together with very concrete technical constraints (versions, the controller-first UX, attract mode, the hub protocol).
What was confusing? "pick a famous tv show" is inserted literally into the Goal and Narrative lines; and "multiplayer for the game on its own" did not say whether local or online play was wanted (this build does local hot-seat).
Hardest thing to do? Making the physics produce fair, readable Confirmed / Plausible / Busted outcomes across all dial settings, so that every verdict is reachable and none is guaranteed.
One test I wish I could have run: a real browser on a real GPU with a physical DualSense, to check frame pacing, audio mix and how the controller feels. Headless SwiftShader cannot judge game feel.

<script>/*! aihub-session 1.4.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.4.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null, card: opts.card === true });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  /** On the game's own card (connect({ card: true })): this player is 'ready', or asks for 'more' time (again takes it back). */
  hub.answer = function (what) {
    if (!welcomed || ended || goAt !== null) return;
    if (what !== 'ready' && what !== 'more') return warn('answer is ready or more');
    post('answer', { answer: what });
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);

    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */

    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;

    tokens -= 1;

    return true;
  };

  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

    var h = 2166136261;

  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */

    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

<script type="module">
const ABOUT_TEXT = "MYTHMUSTERS: an original spiritual successor to MythBusters. Not affiliated with or endorsed by the show or its makers. All characters (Dot, Moss, Bucky) are original.\n\n## Source Information\nDate: 2026-11-01 18:43\nSource: MythBusters (TV series, 2003\u20132018): hosts test myths, build rigs, film with high-speed cameras, deliver Confirmed / Plausible / Busted verdicts, and often blow things up anyway.\nGenre and Perspective: physics experiment / sandbox puzzle with light driving and walking. Main perspective: third-person chase camera (PerspectiveCamera). Switchable: first person, and an orthographic \"Blueprint\" view (OrthographicCamera).\nTech: single HTML file; Three.js r180 (three.webgpu.js, WebGPURenderer with automatic WebGL 2 fallback, TSL node material sky); Rapier 0.19.3 (@dimforge/rapier3d-compat) for rigid bodies, joints, CCD, the kinematic character controller and the ray-cast vehicle controller; Web Audio API; Gamepad API; AI Hub Session Protocol v1 client 1.3.0. Libraries load from the jsDelivr CDN.\nArt Direction: Three.js engine-native look: MeshStandardMaterial PBR, a directional sun with soft shadow maps, hemisphere fill, fog, procedural canvas textures, primitive-built models.\nAnimation: Three.js AnimationMixer with keyframe clips (idle, walk, run, cheer, shrug, point, jump) and cross-fades; Rapier drives every physical prop; a recorder plays physics back as a slow-motion \"high-speed camera\" replay.\nAudio: all code-written with Web Audio: a step sequencer playing four original tracks (blues-rock theme, workshop groove, tension pulse, results reel); synthesized sound effects (cannon, explosions, bricks, dominoes, engine, steam, creaks); gibberish \"Animalese\" voices with formant filters for the narrator, Dot, Moss and Bucky.\nOnline: AI Hub session support in side-by-side (parallel) mode for 1\u20134 players: seeded start, live progress, a result with stats and awards. Local hot-seat Showdown for 2\u20134 players. No other network features.\nTesting: headless Chromium (Playwright) with SwiftShader WebGPU/WebGL, CDN routed to local copies, deterministic frame stepping; AI Hub harness check at 1 and 2 players and with a player leaving.\nResearch: none beyond the AI Hub protocol README and the Rapier vehicle/character-controller type definitions; the show's format is from memory.\nEnvironment: Claude Code CLI (headless); Linux; browser unknown\nModel: Anthropic, claude-opus-5-5, reasoning effort medium\nUsage: session time about 1 h 55 min (18:43 to about 20:38). API cost and token counts: unknown (not visible to the agent from inside the session).\n\n## Testing Feedback\nHow many issues did testing catch? About 19: cannonballs stopping dead in a rigid brick stack, shots over the wall counted as \"through\", a camera method name collision, dominoes too fragile and then too forgiving, a Rapier aliasing crash from stale rig references, the car driving backwards, late takeoff detection, sleeping roof planks, ceiling planks jamming on the roof joists, a weak heater thrust, the AI Hub hello arriving after 10 s, real-time fades stalling stepped simulation, attract mode skipping myths, a disposed texture crashing the renderer, the Blueprint camera blocked by scenery, the car's first-person eye inside the dummy's head, menu overflow, a jump on menu confirm and over-long replays.\nHow many would be considered critical / game breaking? 7: the camera crash, the Rapier aliasing crash, the texture crash, the hub hello timeout, the reversed car, the jammed heater and the stalled fades.\nMost helpful test: deterministic stepping with parameter sweeps (run a myth at several dial settings and print the verdicts). That exposed most of the physics and balance bugs in seconds without rendering.\nLeast helpful test: render-target screenshots on the WebGPU backend. They failed for an unrelated reason at first and cost time before a real crash was isolated.\n\n## Engine Feedback\nWhat did you like most? Rapier's built-in controllers: the ray-cast vehicle and the kinematic character controller gave driving and walking almost for free, and Three.js WebGPURenderer falls back to WebGL 2 on its own.\nDid you get stuck or guess wrong? Yes: the vehicle's forward direction comes from the axle cross the ground normal, so the first guess drove backwards; and a sleeping Rapier body did not reliably wake when pushed from below by a CCD body.\nMost important thing built myself: the experiment framework (dials, measured verdicts, goals), a transform recorder for slow-motion \"high-speed camera\" replays, and a mortar-fracture model, because rigid dry-stacked bricks spread a cannonball's impulse across the whole wall.\nHardest part: Rapier's wasm aliasing error. One bad remove() on an already-freed body leaves the world unusable, with a stack trace pointing at a later, innocent call.\nRemove or overhaul: Three.js WebGPU texture lifetime. Disposing a texture still cached in render bindings crashes a later render pass instead of failing at dispose().\nOne change: Rapier breakable joints (or a fracture threshold) so walls, mortar and planks can break physically without game-side hacks.\n\n## Prompt Feedback\nWhat did you like most? The freedom to pick the show and the genre, together with very concrete technical constraints (versions, the controller-first UX, attract mode, the hub protocol).\nWhat was confusing? \"pick a famous tv show\" is inserted literally into the Goal and Narrative lines; and \"multiplayer for the game on its own\" did not say whether local or online play was wanted (this build does local hot-seat).\nHardest thing to do? Making the physics produce fair, readable Confirmed / Plausible / Busted outcomes across all dial settings, so that every verdict is reachable and none is guaranteed.\nOne test I wish I could have run: a real browser on a real GPU with a physical DualSense, to check frame pacing, audio mix and how the controller feels. Headless SwiftShader cannot judge game feel.\n\n## Credits\nDesign, code, music, sound and voices: generated by Claude (claude-opus-5-5) for this build.\nEngine: Three.js (MIT) \u00b7 Rapier physics by Dimforge (Apache 2.0).\nRemember: the people in this game are pretend professionals. Please don't fire cannons at walls, jump buses or overheat water heaters at home.";
// ===== 01 core: imports, utils, settings, input =====
import * as THREE from 'three/webgpu';
import RAPIER from '@dimforge/rapier3d-compat';

const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const fmt = (v, d = 1) => (Math.round(v * 10 ** d) / 10 ** d).toFixed(d);
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const QS = new URLSearchParams(location.search);

// ---------- settings ----------
const SETTINGS_KEY = 'mythmusters.settings.v1';
const DEFAULT_SETTINGS = {
  master: 0.8, music: 0.55, sfx: 0.9, voice: 0.8,
  invertX: false, invertY: false, sens: 1.0,
  shadows: 'high', subtitles: true, shake: true, replays: true, defaultCam: 0,
};
const Settings = Object.assign({}, DEFAULT_SETTINGS);
try { Object.assign(Settings, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')); } catch (e) { /* first launch */ }
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(Settings)); } catch (e) { /* storage blocked */ } }

// ---------- input ----------
// Controller-first: everything maps onto DualSense-style actions; keyboard/mouse feed the same actions.
const PAD = { confirm: 0, back: 1, boom: 2, cam: 3, l1: 4, r1: 5, l2: 6, r2: 7, create: 8, pause: 9, l3: 10, r3: 11, up: 12, down: 13, left: 14, right: 15 };
const KEYMAP = {
  confirm: ['Enter', 'Space'], back: ['Backspace'], boom: ['KeyF'], cam: ['KeyC'], l1: ['KeyQ'], r1: ['KeyE'],
  pause: ['Escape', 'KeyP'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'], left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
  r2: ['KeyW', 'ArrowUp', 'ShiftLeft'], l2: ['KeyS', 'ArrowDown'],
};
const Input = {
  keys: new Set(), keysDown: new Set(), padPrev: [], padNow: [], padAx: [0, 0, 0, 0], padConnected: false,
  mouseDX: 0, mouseDY: 0, wheel: 0, dragging: false, lastDevice: 'kb', activity: false, sawKeyboard: false,
  repeatT: {}, synthetic: {}, // synthetic: test/AI hooks { action: true }
  lock: false, // when true, gameplay input is suppressed (menus)
  init() {
    addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace', 'Tab'].includes(e.code)) e.preventDefault();
      if (!this.keys.has(e.code)) this.keysDown.add(e.code);
      this.keys.add(e.code); this.lastDevice = 'kb'; this.activity = true; this.sawKeyboard = true;
      Sound.resume();
    });
    addEventListener('keyup', (e) => this.keys.delete(e.code));
    addEventListener('blur', () => this.keys.clear());
    addEventListener('mousedown', (e) => { if (e.button === 0 || e.button === 2) this.dragging = true; this.activity = true; this.lastDevice = 'kb'; Sound.resume(); });
    addEventListener('mouseup', () => (this.dragging = false));
    addEventListener('mousemove', (e) => {
      if (this.dragging || document.pointerLockElement) { this.mouseDX += e.movementX; this.mouseDY += e.movementY; }
      if (Math.abs(e.movementX) + Math.abs(e.movementY) > 6) this.activity = true;
    });
    addEventListener('wheel', (e) => { this.wheel += Math.sign(e.deltaY); this.activity = true; }, { passive: true });
    addEventListener('contextmenu', (e) => e.preventDefault());
    addEventListener('gamepadconnected', () => { this.padConnected = true; });
  },
  poll(dt) {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let pad = null;
    for (const p of pads) if (p && p.connected) { pad = p; break; }
    this.padPrev = this.padNow;
    this.padNow = [];
    if (pad) {
      this.padConnected = true;
      for (let i = 0; i < pad.buttons.length; i++) this.padNow[i] = pad.buttons[i].value > 0.4 || pad.buttons[i].pressed ? pad.buttons[i].value || 1 : 0;
      const dz = (v) => (Math.abs(v) < 0.15 ? 0 : (v - Math.sign(v) * 0.15) / 0.85);
      const ix = Settings.invertX ? -1 : 1, iy = Settings.invertY ? -1 : 1;
      this.padAx = [dz(pad.axes[0] || 0) * ix, dz(pad.axes[1] || 0) * iy, dz(pad.axes[2] || 0) * ix, dz(pad.axes[3] || 0) * iy];
      if (this.padNow.some((v, i) => v && !this.padPrev[i]) || this.padAx.some((a) => Math.abs(a) > 0.35)) { this.activity = true; this.lastDevice = 'pad'; Sound.resume(); }
    } else this.padAx = [0, 0, 0, 0];
    // menu-style repeat for directions
    this.dirPulse = {};
    const dirs = { up: this.my() < -0.5, down: this.my() > 0.5, left: this.mx() < -0.5, right: this.mx() > 0.5 };
    for (const d in dirs) {
      const h = dirs[d] || this.btn(PAD[d]) || this.anyKey(KEYMAP[d]);
      if (h) {
        if (this.repeatT[d] === undefined) { this.repeatT[d] = 0.38; this.dirPulse[d] = true; }
        else { this.repeatT[d] -= dt; if (this.repeatT[d] <= 0) { this.repeatT[d] = 0.09; this.dirPulse[d] = true; } }
      } else delete this.repeatT[d];
    }
  },
  endFrame() { this.keysDown.clear(); this.mouseDX = 0; this.mouseDY = 0; this.wheel = 0; this.synthetic = {}; this.activity = false; },
  consume() { this.keysDown.clear(); this.padPrev = this.padNow.slice(); this.synthetic = {}; this.dirPulse = {}; },
  btn(i) { return !!this.padNow[i]; },
  btnDown(i) { return !!this.padNow[i] && !this.padPrev[i]; },
  anyKey(list) { return list && list.some((k) => this.keys.has(k)); },
  anyKeyDown(list) { return list && list.some((k) => this.keysDown.has(k)); },
  // pressed this frame
  pressed(a) {
    if (this.synthetic[a]) return true;
    if (a === 'pause' && this.btn(PAD.create)) return false; // Create+Options belongs to the hub
    if (['up', 'down', 'left', 'right'].includes(a)) return !!this.dirPulse[a];
    return this.btnDown(PAD[a]) || this.anyKeyDown(KEYMAP[a]);
  },
  held(a) {
    if (this.synthetic[a]) return true;
    return this.btn(PAD[a]) || this.anyKey(KEYMAP[a]);
  },
  analog(a) { // r2 / l2 as 0..1
    if (this.synthetic[a] !== undefined && this.synthetic[a] !== false) return typeof this.synthetic[a] === 'number' ? this.synthetic[a] : 1;
    const v = this.padNow[PAD[a]] || 0;
    return Math.max(v, this.anyKey(KEYMAP[a]) ? 1 : 0);
  },
  mx() { let k = 0; if (this.keys.has('KeyA') || this.keys.has('ArrowLeft')) k -= 1; if (this.keys.has('KeyD') || this.keys.has('ArrowRight')) k += 1; return this.synthetic.mx ?? (k || this.padAx[0]); },
  my() { let k = 0; if (this.keys.has('KeyW') || this.keys.has('ArrowUp')) k -= 1; if (this.keys.has('KeyS') || this.keys.has('ArrowDown')) k += 1; return this.synthetic.my ?? (k || this.padAx[1]); },

    moss: { f: 128, wave: 'sawtooth', rate: 0.07, spread: 0.12 },
    host: { f: 180, wave: 'triangle', rate: 0.062, spread: 0.25 },

const NOTE = (n) => 440 * Math.pow(2, (n - 69) / 12);
const TRACKS = {
  // "Hypothesis Boogie": blues-rock shuffle in E, I–I–IV–I–V–IV–I–V
  theme: {
    bpm: 132,
    step(S, s, t, spb) {
      const bar = Math.floor(s / 16) % 8, i = s % 16, prog = [0, 0, 5, 0, 7, 5, 0, 7][bar], root = 40 + prog;
      if (i % 8 === 0 || i === 10) S.kick(t);
      if (i % 8 === 4) S.snare(t);
      if (i % 2 === 0) S.hat(t, i % 4 === 2 ? 1 : 0.6, i === 14);
      const bl = [0, null, 0, 7, null, 9, 10, null, 12, null, 10, 9, null, 7, 5, null][i];
      if (bl !== null) S.bass(t, NOTE(root + bl - 12), spb * 1.6);
      if (i === 0 || i === 6 || i === 8 || i === 12) S.guitar(t, NOTE(root), spb * (i === 8 ? 3.5 : 1.6), 1);
      if (bar % 2 === 1 && (i === 14)) S.guitar(t, NOTE(root + 3), spb * 1.5, 0.8);
    },
  },
  // "Shop Time": light workshop groove for building rigs
  build: {
    bpm: 104,
    step(S, s, t, spb) {
      const bar = Math.floor(s / 16) % 4, i = s % 16, root = [45, 45, 41, 43][bar];
      if (i === 0 || i === 7 || i === 10) S.kick(t, 0.7);
      if (i === 4 || i === 12) S.clap(t, 0.6);
      if (i % 2 === 1) S.hat(t, 0.4);
      if ([0, 3, 6, 8, 11, 14].includes(i)) S.bass(t, NOTE(root - 12 + (i === 6 ? 7 : i === 14 ? 5 : 0)), spb * 1.2, 0.8);
      const arp = [0, 4, 7, 12, 7, 4, 0, 4];
      if (i % 2 === 0) S.bell(t, NOTE(root + 24 + arp[(i / 2 + bar) % 8]), spb * 3, 0.7);
      if (i === 0) S.pad(t, NOTE(root + 12), spb * 15, 1);
    },
  },
  // "Rig Is Hot": tense pulse for live tests
  tense: {
    bpm: 150,
    step(S, s, t, spb) {
      const i = s % 16, bar = Math.floor(s / 16) % 4;
      if (i % 4 === 0) S.kick(t, 0.8);
      if (i % 2 === 0) S.hat(t, 0.35);
      if (i % 4 === 2) S.bass(t, NOTE(28 + (bar === 3 ? 1 : 0)), spb * 1.5, 1);
      if (i === 0 && bar % 2 === 0) S.pad(t, NOTE(52 + bar), spb * 30, 0.8);
      if (i === 8) S.osc('square', NOTE(76 + (bar % 2)), t, 0.05, 0.03, S.mus);
    },
  },
  // "Results Reel": triumphant-ish wrap-up
  results: {
    bpm: 116,
    step(S, s, t, spb) {
      const bar = Math.floor(s / 16) % 4, i = s % 16, root = [40, 45, 47, 40][bar];
      if (i % 4 === 0) S.kick(t, 0.8);
      if (i % 8 === 4) S.snare(t, 0.8);
      if (i % 2 === 0) S.hat(t, 0.5);
      if (i % 4 === 0) S.bass(t, NOTE(root - 12), spb * 3);
      if (i === 0 || i === 8) S.guitar(t, NOTE(root), spb * 6, 0.8);
      if (i % 4 === 2) S.bell(t, NOTE(root + 24 + [0, 7, 12, 7][i / 4 | 0]), spb * 2, 0.6);
    },
  },
};

// ===== 03 gfx: renderer, scene, lights, cameras, materials, FX =====

const Gfx = {

// ---------- camera rig: chase (third person, main), first person, blueprint (orthographic) ----------
const CAM_MODES = ['CHASE CAM', 'FIRST PERSON', 'BLUEPRINT'];
class CamRig {
  constructor(G) {
    this.G = G; this.mode = 0; this.target = V3(); this.smoothTarget = V3(); this.yaw = 0.6; this.pitch = 0.35; this.dist = 12;
    this.minDist = 3; this.maxDist = 60; this.fpEye = V3(); this.fpYaw = 0; this.fpPitch = 0; this.shakeT = 0; this.shakeA = 0;
    this.blueDir = V3(0, 1, 0.0001); this.blueZoom = 14; this.blueUp = V3(0, 0, -1);
    this.cut = true; this.override = null; this.pos = V3(); this.lookV = V3();
  }
  setMode(m) { this.mode = (m + 3) % 3; this.G.camera = this.mode === 2 ? this.G.ortho : this.G.persp; this.cut = true; this.updateOrtho(); }
  cycle() { this.setMode(this.mode + 1); return CAM_MODES[this.mode]; }
  shake(a, t = 0.5) { if (!Settings.shake) return; this.shakeA = Math.max(this.shakeA, a); this.shakeT = Math.max(this.shakeT, t); }
  updateOrtho() {
    const o = this.G.ortho, a = innerWidth / innerHeight, z = this.blueZoom;
    o.left = -z * a; o.right = z * a; o.top = z; o.bottom = -z; o.updateProjectionMatrix();
  }
  // free-look input applied to whichever mode is active
  look(dt, allowZoom = true) {
    const lx = Input.lx(), ly = Input.ly(), mouse = Input.lookIsMouse();
    const k = mouse ? 1 : dt;
    if (this.mode === 0) { this.yaw -= lx * k; this.pitch = clamp(this.pitch + ly * k, -0.15, 1.35); if (allowZoom) this.dist = clamp(this.dist * (1 + Input.wheel * 0.1), this.minDist, this.maxDist); }
    else if (this.mode === 1) { this.fpYaw -= lx * k; this.fpPitch = clamp(this.fpPitch - ly * k, -1.3, 1.3); }
    else if (allowZoom) { this.blueZoom = clamp(this.blueZoom * (1 + Input.wheel * 0.1), 4, 80); this.updateOrtho(); }
  }
  update(dt) {
    const cam = this.G.camera;
    this.smoothTarget.copy(this.cut ? this.target : this.smoothTarget.lerp(this.target, 1 - Math.exp(-8 * dt)));
    if (this.override) { // scripted shot (replays, intros)
      this.pos.copy(this.override.pos); this.lookV.copy(this.override.look);
      if (cam !== this.G.persp) this.G.camera = this.G.persp;
    } else if (this.mode === 0) {

      const want = V3(t.x + Math.sin(this.yaw) * Math.cos(this.pitch) * d, t.y + Math.sin(this.pitch) * d, t.z + Math.cos(this.yaw) * Math.cos(this.pitch) * d);
      want.y = Math.max(want.y, 0.4);
      if (this.cut) this.pos.copy(want); else this.pos.lerp(want, 1 - Math.exp(-10 * dt));
      this.lookV.copy(t);
    } else if (this.mode === 1) {
      this.pos.copy(this.fpEye);
      this.lookV.set(this.pos.x - Math.sin(this.fpYaw) * Math.cos(this.fpPitch), this.pos.y + Math.sin(this.fpPitch), this.pos.z - Math.cos(this.fpYaw) * Math.cos(this.fpPitch));
    } else {
      const t = this.smoothTarget;
      this.pos.copy(t).addScaledVector(this.blueDir, 60); this.lookV.copy(t);

    c.position.copy(this.pos);
    if (this.shakeT > 0) { this.shakeT -= dt; const a = this.shakeA * Math.max(0, this.shakeT); c.position.x += rand(-a, a); c.position.y += rand(-a, a); c.position.z += rand(-a, a); }

// ---------- particles ----------
class FX {
  constructor(scene) {
    this.scene = scene; this.parts = []; this.pool = []; this.rings = []; this.lights = [];
    this.flash = new THREE.PointLight(0xffaa55, 0, 60, 1.5); scene.add(this.flash); this.flashT = 0;
  }
  sprite() {

      s = new THREE.Sprite(m);

    }

  }
  emit(type, pos, n = 10, opt = {}) {

      const s = this.sprite(), m = s.material;
      const p = { s, t: 0, type, vel: V3(), grow: 1, g: 0, drag: 1, life: 1, c0: new THREE.Color(), c1: new THREE.Color(), a0: 1, size: 1 };
      const sp = opt.speed ?? 1, sc = opt.scale ?? 1;
      const dir = V3(rand(-1, 1), rand(-0.2, 1), rand(-1, 1)).normalize();
      s.position.copy(pos).addScaledVector(dir, rand(0, opt.spread ?? 0.3));
      m.blending = THREE.NormalBlending;
      switch (type) {
        case 'fire': p.vel.copy(dir).multiplyScalar(rand(4, 14) * sp); p.drag = 3; p.life = rand(0.5, 1.1); p.size = rand(1.5, 3.5) * sc; p.grow = 2.2; p.c0.set(0xfff0a0); p.c1.set(0xb02000); m.blending = THREE.AdditiveBlending; p.g = -2; break;
        case 'smoke': p.vel.copy(dir).multiplyScalar(rand(2, 7) * sp); p.drag = 1.6; p.life = rand(2, 4); p.size = rand(2, 4) * sc; p.grow = 3; p.c0.set(0x4a4038); p.c1.set(0x9a948c); p.g = -1.5; p.a0 = 0.65; break;
        case 'spark': p.vel.copy(dir).multiplyScalar(rand(8, 26) * sp); p.drag = 0.6; p.life = rand(0.4, 1.0); p.size = rand(0.15, 0.35) * sc; p.grow = 0.2; p.c0.set(0xffffc0); p.c1.set(0xff6000); p.g = 14; m.blending = THREE.AdditiveBlending; break;
        case 'dust': p.vel.copy(dir).multiplyScalar(rand(1, 4) * sp); p.vel.y = Math.abs(p.vel.y) * 0.5; p.drag = 2; p.life = rand(0.8, 1.8); p.size = rand(0.6, 1.4) * sc; p.grow = 2.5; p.c0.set(0xc8a878); p.c1.set(0xe0d0b0); p.a0 = 0.6; break;
        case 'water': p.vel.copy(dir).multiplyScalar(rand(3, 9) * sp); p.vel.y = Math.abs(p.vel.y) * 1.5; p.drag = 0.5; p.life = rand(0.6, 1.4); p.size = rand(0.3, 0.7) * sc; p.grow = 1.5; p.c0.set(0xe8f4ff); p.c1.set(0x88bbee); p.g = 9.8; p.a0 = 0.8; break;
        case 'steam': p.vel.copy(dir).multiplyScalar(rand(1, 3) * sp); p.drag = 1.2; p.life = rand(1, 2); p.size = rand(0.5, 1.2) * sc; p.grow = 3; p.c0.set(0xffffff); p.c1.set(0xdde4ea); p.g = -2.5; p.a0 = 0.5; break;
        case 'confetti': p.vel.copy(dir).multiplyScalar(rand(4, 9) * sp); p.vel.y = Math.abs(p.vel.y) * 2 + 3; p.drag = 1.2; p.life = rand(1.5, 3); p.size = rand(0.12, 0.25) * sc; p.grow = 0; p.c0.setHSL(Math.random(), 0.9, 0.6); p.c1.copy(p.c0); p.g = 4; break;
      }
      if (opt.vel) p.vel.add(opt.vel);
      if (opt.color) { p.c0.set(opt.color); p.c1.set(opt.color); }
      m.color.copy(p.c0); m.opacity = p.a0; s.scale.setScalar(p.size);

  }
  explosion(pos, power = 1) {
    this.emit('fire', pos, Math.round(26 * power), { speed: power, scale: power });
    this.emit('smoke', pos, Math.round(22 * power), { speed: power, scale: power * 1.3 });
    this.emit('spark', pos, Math.round(30 * power), { speed: power });
    this.emit('dust', V3(pos.x, 0.3, pos.z), Math.round(16 * power), { speed: power * 2, scale: power * 2, spread: 2 });
    this.ring(pos, power);
    this.flash.position.copy(pos).add(V3(0, 1.5, 0)); this.flash.intensity = 4000 * power; this.flashT = 0.35;
  }
  ring(pos, power = 1) {

    const r = new THREE.Mesh(new THREE.RingGeometry(0.8, 1, 48), m); r.rotation.x = -Math.PI / 2; r.position.set(pos.x, 0.15, pos.z);
    this.scene.add(r); this.rings.push({ r, t: 0, power });
  }
  update(dt) {
    for (let i = this.parts.length - 1; i >= 0; i--) {

      R.r.scale.setScalar(sc); R.r.material.opacity = Math.max(0, 0.7 - R.t * 1.4);
      if (R.t > 0.5) { this.scene.remove(R.r); R.r.geometry.dispose(); R.r.material.dispose(); this.rings.splice(i, 1); }

  }
  clear() { for (const p of this.parts) { p.s.visible = false; this.pool.push(p.s); } this.parts.length = 0; }
}

// ===== 04 physics: Rapier world, body helpers, scoped rigs, replay recorder =====
const Phys = {
  world: null, objs: [], scope: null, events: null,
  async init() {
    await RAPIER.init();
    this.world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
    this.world.timestep = 1 / 60;
    this.events = new RAPIER.EventQueue(true);
  },
  // create a body + collider + mesh. shape: 'box' {size}, 'ball' {r}, 'cyl' {r,h}, 'capsule' {r,h}
  add(o) {
    const W = this.world;
    const type = o.fixed ? RAPIER.RigidBodyDesc.fixed() : o.kinematic ? RAPIER.RigidBodyDesc.kinematicPositionBased() : RAPIER.RigidBodyDesc.dynamic();
    const p = o.pos || V3();

    if (o.ccd) type.setCcdEnabled(true);
    if (o.linDamp) type.setLinearDamping(o.linDamp);
    if (o.angDamp) type.setAngularDamping(o.angDamp);
    if (o.sleep === false) type.setCanSleep(false);
    const body = W.createRigidBody(type);
    let cd, geo;
    const s = o.size;
    switch (o.shape || 'box') {
      case 'ball': cd = RAPIER.ColliderDesc.ball(o.r); geo = new THREE.SphereGeometry(o.r, 20, 14); break;
      case 'cyl': cd = RAPIER.ColliderDesc.cylinder(o.h / 2, o.r); geo = new THREE.CylinderGeometry(o.r, o.r, o.h, 20); break;
      case 'capsule': cd = RAPIER.ColliderDesc.capsule(o.h / 2, o.r); geo = new THREE.CapsuleGeometry(o.r, o.h, 6, 12); break;
      default: cd = RAPIER.ColliderDesc.cuboid(s[0] / 2, s[1] / 2, s[2] / 2); geo = new THREE.BoxGeometry(s[0], s[1], s[2]);
    }
    if (o.density !== undefined) cd.setDensity(o.density);
    if (o.mass !== undefined) cd.setMass(o.mass);
    cd.setFriction(o.friction ?? 0.7); cd.setRestitution(o.restitution ?? 0.05);
    if (o.events) cd.setActiveEvents(RAPIER.ActiveEvents.COLLISION_EVENTS | RAPIER.ActiveEvents.CONTACT_FORCE_EVENTS);
    const collider = W.createCollider(cd, body);
    let mesh = o.mesh;
    if (mesh === undefined) {
      mesh = new THREE.Mesh(geo, o.material || mat('def', { color: 0x999999, roughness: 0.8 }));
      mesh.castShadow = o.cast ?? true; mesh.receiveShadow = true;
    } else geo.dispose();
    if (mesh) { (o.parent || Gfx.scene).add(mesh); mesh.position.copy(p); if (o.quat) mesh.quaternion.copy(o.quat); }
    const obj = { body, collider, mesh, tag: o.tag || '', fixed: !!o.fixed, start: p.clone(), data: o.data || {} };
    this.objs.push(obj);
    if (this.scope) this.scope.push(obj);
    return obj;
  },
  // static decor collider only (no mesh)
  staticBox(pos, size, quat) {
    const b = this.world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(pos.x, pos.y, pos.z));
    if (quat) b.setRotation({ x: quat.x, y: quat.y, z: quat.z, w: quat.w }, false);
    const c = this.world.createCollider(RAPIER.ColliderDesc.cuboid(size[0] / 2, size[1] / 2, size[2] / 2).setFriction(0.8), b);
    const obj = { body: b, collider: c, mesh: null, fixed: true, tag: 'static' };
    if (this.scope) this.scope.push(obj);
    return obj;
  },
  joint(a, b, anchorA, anchorB) {
    const j = this.world.createImpulseJoint(RAPIER.JointData.spherical(anchorA, anchorB), a.body, b.body, true);
    if (this.scope) this.scope.push({ joint: j });
    return j;
  },
  remove(obj) {
    if (obj.joint) { try { this.world.removeImpulseJoint(obj.joint, true); } catch (e) { /* already gone with its body */ } return; }
    if (obj.vehicle) { try { this.world.removeVehicleController(obj.vehicle); } catch (e) { /* gone */ } return; }
    if (obj.body) { try { this.world.removeRigidBody(obj.body); } catch (e) { /* gone */ } }

    const i = this.objs.indexOf(obj); if (i >= 0) this.objs.splice(i, 1);
  },
  beginScope() { this.scope = []; return this.scope; },
  endScope() { const s = this.scope; this.scope = null; return s; },
  clearScope(list) {
    if (!list) return;
    for (const o of list) if (o.joint) this.remove(o);
    for (const o of list) if (o.vehicle) this.remove(o);
    for (const o of list) if (!o.joint && !o.vehicle) this.remove(o);
    list.length = 0;
  },
  step(dt) {
    this.world.timestep = dt;
    this.world.step(this.events);
    this.contacts = [];
    this.events.drainContactForceEvents((e) => this.contacts.push(e.totalForceMagnitude()));
    this.events.drainCollisionEvents(() => {});
    for (const o of this.objs) {
      if (o.fixed || !o.mesh || !o.body) continue;
      const t = o.body.translation(), r = o.body.rotation();

  },
  syncAll() { this.step(0.000001); },
  // explosion impulse; returns displaced mass score
  blast(center, radius, power) {
    let moved = 0;
    for (const o of this.objs) {
      if (o.fixed || !o.body || o.body.isFixed() || o.body.isKinematic()) continue;
      const t = o.body.translation();
      const d = V3(t.x - center.x, t.y - center.y, t.z - center.z);

      d.y += 0.6 * dist + 0.5; d.normalize();

      moved += Math.min(m, 400) * (1 - dist / radius);
    }
    return moved;
  },
};

// ---------- high-speed camera: record transforms, replay in slow motion ----------
const Recorder = {
  tracks: [], frames: 0, t: [], events: [], on: false, maxFrames: 60 * 40,
  start(objects) {
    this.tracks = objects.filter((o) => o).map((o) => ({ o, data: [] }));
    this.t = []; this.events = []; this.frames = 0; this.on = true; this.time = 0;
  },
  add(object3d) { if (this.on && object3d) this.tracks.push({ o: object3d, data: new Array(this.frames).fill(null) }); },
  capture(dt) {
    if (!this.on || this.frames >= this.maxFrames) return;
    this.time += dt; this.t.push(this.time);
    for (const tr of this.tracks) {
      const o = tr.o;
      tr.data.push([o.position.x, o.position.y, o.position.z, o.quaternion.x, o.quaternion.y, o.quaternion.z, o.quaternion.w, o.visible]);
    }

  },
  event(kind, pos, arg) { if (this.on) this.events.push({ t: this.time, kind, pos: pos.clone(), arg }); },
  stop() { this.on = false; this.final = this.tracks.map((tr) => [tr.o.position.clone(), tr.o.quaternion.clone(), tr.o.visible]); },
  duration() { return this.t.length ? this.t[this.t.length - 1] : 0; },
  // apply recorded state at time t; fires events crossed since lastT
  apply(t, lastT, fire) {
    if (!this.frames) return;
    let i = 0; const T = this.t;
    let lo = 0, hi = T.length - 1;

// ===== 08 range: walkable hub with a kinematic character controller =====
const Range = {
  init() {
    this.char = new Character({ shirt: 0xffb000, hat: 'hardhat', pants: 0x334455 });
    Gfx.scene.add(this.char.root);
    const W = Phys.world;
    this.body = W.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(0, 0.95, 12));
    this.col = W.createCollider(RAPIER.ColliderDesc.capsule(0.55, 0.35).setFriction(0.2), this.body);
    const k = (this.kcc = W.createCharacterController(0.04));
    k.enableAutostep(0.45, 0.2, true); k.enableSnapToGround(0.35); k.setApplyImpulsesToDynamicBodies(true); k.setCharacterMass(90);
    k.setMaxSlopeClimbAngle(0.6);
    this.vy = 0; this.grounded = true; this.facing = Math.PI; this.near = null; this.speed = 0; this.active = false;
    this.pos = V3(0, 0.95, 12);
  },
  enter(at) {
    this.active = true; this.char.root.visible = true;
    if (at) { this.pos.copy(at); this.body.setTranslation({ x: at.x, y: at.y, z: at.z }, true); }
    const c = Gfx.cam; c.minDist = 3; c.maxDist = 22; c.dist = 7.5; c.pitch = 0.32; c.yaw = 0; c.blueDir.set(0, 1, 0.0001); c.blueUp.set(0, 0, -1); c.blueZoom = 13; c.updateOrtho();
    c.fpYaw = 0; c.fpPitch = -0.05; c.override = null; c.cut = true;
    this.update(0);
  },
  leave() { this.active = false; },
  tint(color) { this.char.shirt.color.set(color); },
  step(dt, ai) { // fixed-step movement
    if (!this.active) return;
    const c = Gfx.cam;
    let mx = Input.mx(), my = Input.my();
    if (ai) { mx = ai.x; my = ai.y; }
    if (UI.open || Game.paused) { mx = 0; my = 0; }
    let fx, fz;
    if (c.mode === 0) { fx = -Math.sin(c.yaw); fz = -Math.cos(c.yaw); } else if (c.mode === 1) { fx = -Math.sin(c.fpYaw); fz = -Math.cos(c.fpYaw); } else { fx = 0; fz = -1; }
    const rx = -fz, rz = fx;
    let dx = fx * -my + rx * mx, dz = fz * -my + rz * mx;
    const len = Math.hypot(dx, dz); if (len > 1) { dx /= len; dz /= len; }
    const run = Input.btn(PAD.r2) || Input.btn(PAD.l3) || Input.keys.has('ShiftLeft') || Input.keys.has('ShiftRight') || (ai && ai.run);
    const sp = run ? 7.5 : 4.2;
    this.vy -= 22 * dt;
    if (this.grounded && this.vy < 0) this.vy = -1;
    if (this.wantJump && this.grounded) { this.vy = 8; this.grounded = false; Sound.play2('jump'); this.char.play('jump', 0.1); this.jumpT = 0.5; }
    this.wantJump = false;
    const des = { x: dx * sp * dt, y: this.vy * dt, z: dz * sp * dt };
    this.kcc.computeColliderMovement(this.col, des);
    const m = this.kcc.computedMovement();
    this.grounded = this.kcc.computedGrounded();
    const t = this.body.translation();
    this.pos.set(t.x + m.x, t.y + m.y, t.z + m.z);
    if (this.pos.y < -5) this.pos.set(0, 1, 12);
    this.body.setNextKinematicTranslation({ x: this.pos.x, y: this.pos.y, z: this.pos.z });
    this.speed = Math.hypot(m.x, m.z) / Math.max(dt, 1e-4);
    if (len > 0.1) this.facing = Math.atan2(-dx, -dz);
  },
  update(dt) {
    if (!this.active) return;
    const r = this.char.root;
    r.position.set(this.pos.x, this.pos.y - 0.9, this.pos.z);
    r.rotation.y = damp(r.rotation.y + Math.round((this.facing - r.rotation.y) / (Math.PI * 2)) * Math.PI * 2, this.facing, 12, dt);
    if (this.jumpT > 0) this.jumpT -= dt;
    this.char.locomote = !(this.jumpT > 0 && !this.grounded);
    this.char.update(dt, this.grounded ? this.speed : 0);
    const c = Gfx.cam;
    c.target.set(this.pos.x, this.pos.y + 0.7, this.pos.z);
    c.fpEye.set(this.pos.x, this.pos.y + 0.75, this.pos.z);
    this.char.root.visible = c.mode !== 1;
    // stations
    this.near = null;
    for (const s of World.stations) {
      const d = Math.hypot(this.pos.x - s.pos.x, this.pos.z - s.pos.z);
      s.ring.material.emissiveIntensity = d < 2 ? 1.6 + Math.sin(Game.simTime * 6) * 0.5 : 0.5;
      s.beacon.rotation.y += dt * 2;
      if (d < 2) this.near = s;
    }
  },
};

// ===== 09 game: state machine, modes, myth flow, attract, hub session, main loop =====
const PLAYER_COLORS = ['#e8443a', '#3b82f6', '#22c55e', '#f5b700'];
const GOAL_BONUS = 250;
const Game = {
  state: 'boot', mode: 'episode', simTime: 0, paused: false, players: [], cur: 0, idleT: 0, acc: 0, timeScale: 1, stopped: false,
  M: null, // current myth run { myth, phase, sel, ... }
  playerName() { const p = this.players[this.cur]; return p ? p.name : 'You'; },
  newPlayers(n, names) {
    this.players = [];
    for (let i = 0; i < n; i++) this.players.push({ name: names ? names[i] : n > 1 ? `Player ${i + 1}` : 'You', color: PLAYER_COLORS[i % 4], myth: {} });
    this.cur = 0;
  },
  mythScore(p, id) { const r = p.myth[id]; if (!r) return 0; return (r.best ? r.best.points : 0) + r.goals.filter(Boolean).length * GOAL_BONUS + (r.boom || 0); },
  total(p = this.players[this.cur]) { return p ? MYTHS.reduce((s, m) => s + this.mythScore(p, m.id), 0) : 0; },
  tested(p = this.players[this.cur]) { return MYTHS.filter((m) => p.myth[m.id] && p.myth[m.id].best).length; },

  // ---------------- boot ----------------
  async boot() {
    const bar = (f, m) => { $('#bootbar').style.width = f * 100 + '%'; if (m) $('#bootmsg').textContent = m; };
    const hub = AIHub.active ? AIHub.connect({ mode: 'parallel', seats: [1, 4] }) : null;
    Input.init();
    bar(0.1, 'Warming up the physics…');
    await Phys.init();
    bar(0.4, 'Building the test range…');
    await Gfx.init();
    World.build(); Range.init();
    bar(0.8, 'Polishing the blast shields…');
    for (const m of MYTHS) World.setStationStatus(m.id, m, null);
    Gfx.cam.setMode(0);
    window.__game = this; window.__THREE = THREE; window.__gfx = Gfx; window.__phys = Phys; window.__ui = UI; window.__input = Input; window.__myths = MYTHS; window.__range = Range;
    AIHub.probe(() => ({
      scene: this.state === 'title' || this.state === 'attract' ? 'title' : this.state === 'results' || this.state === 'final' ? 'over' : this.state === 'wait' ? 'ready' : UI.open && this.state !== 'range' && this.state !== 'myth' ? 'menu' : 'play',
      menu: !!(this.pauseOpen && UI.open), world: this.simTime,
      input: { x: Input.mx(), y: Input.my(), fire: Input.held('confirm') },
    }));
    Gfx.renderer.setAnimationLoop(() => this.loop());
    bar(1);
    $('#boot').style.display = 'none';
    if (hub) {
      const info = await hub;
      if (info) return this.startSession(info);
    }
    this.touchCheck();
    this.toTitle();
  },
  touchCheck() {
    const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches && !Input.padConnected;
    if (!touchOnly) return;
    const tb = $('#touchBlock'); tb.style.display = 'flex';
    $('#touchSettings').onclick = () => { tb.style.display = 'none'; this.openSettings(() => { tb.style.display = 'flex'; }); };
    const hide = () => { tb.style.display = 'none'; };
    addEventListener('keydown', hide, { once: true }); addEventListener('gamepadconnected', hide, { once: true });
    this.touchOnly = true;
  },

  // ---------------- main loop ----------------
  last: 0,
  loop() {
    const now = performance.now(); let dt = this.last ? (now - this.last) / 1000 : 1 / 60; this.last = now;
    dt = Math.min(dt, 0.1);
    if (this.manual) return; // test harness drives frames
    this.frame(dt);
  },
  advance(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) this.frame(dt); }, // deterministic stepping for tests
  frame(dt) {
    Input.poll(dt);
    this.updateFade(dt);
    if (this.stopped) { Gfx.fx.update(dt); Gfx.cam.update(dt); Gfx.render(); Input.endFrame(); return; }
    if (this.attractOn() && Input.activity && this.attractGrace <= 0) this.exitAttract();
    if (this.attractGrace > 0) this.attractGrace -= dt;
    // pause / settings menu
    if (Input.pressed('pause') && !UI.open && ['range', 'myth', 'myth-loading'].includes(this.state) && this.mode !== 'attract') { this.openPause(); Input.keysDown.clear(); Input.padPrev = Input.padNow.slice(); }
    const menuConsumed = UI.open ? UI.updateMenu() : false;
    this.paused = (this.pauseOpen && UI.open) || false;
    if (!this.pauseOpen) this.pauseOpenPrev = false;
    if (!this.paused) {
      this.simTime += dt;
      this.update(dt, menuConsumed);
      // fixed-step physics
      const physOn = this.physicsRunning();
      if (physOn) {
        this.acc += dt * this.timeScale; let steps = 0;
        while (this.acc >= 1 / 60 && steps < 4) { this.fixedStep(1 / 60); this.acc -= 1 / 60; steps++; }
        if (steps === 4) this.acc = 0;
      }
    }
    // animation + effects
    for (const id in World.hosts) { World.hosts[id].dot.update(dt, null); World.hosts[id].moss.update(dt, null); }
    if (this.M && this.M.myth.frame && this.M.phase !== 'replay') this.M.myth.frame();
    Range.update(this.paused ? 0 : dt);
    UI.updateTalk(this.paused ? 0 : dt);
    Gfx.fx.update(this.paused ? 0 : dt * (this.state === 'myth' && this.M && this.M.phase === 'replay' ? Math.max(0.3, this.M.replayDur / 8) : 1));
    Gfx.cam.update(dt);
    Gfx.focusShadows(Gfx.cam.smoothTarget);
    if (!this.noRender) Gfx.render();
    Input.endFrame();
  },
  physicsRunning() {
    if (this.state === 'range' || this.state === 'title' || this.state === 'attract-range') return true;
    if (this.state === 'myth' && this.M) return ['setup', 'run', 'boomRun', 'countdown', 'verdict', 'brief', 'boomArm'].includes(this.M.phase);
    return this.state === 'wait';
  },
  fixedStep(dt) {
    if (Range.active) Range.step(dt, this.rangeAI);
    if (this.M && (this.M.phase === 'run' || this.M.phase === 'boomRun') && this.M.myth.stepPhysics) this.M.myth.stepPhysics(dt);
    Phys.step(dt);
    if (this.M && (this.M.phase === 'run' || this.M.phase === 'boomRun')) Recorder.capture(dt);
  },
  update(dt, menuConsumed) {
    switch (this.state) {
      case 'title': this.updateTitle(dt); break;
      case 'range': this.updateRange(dt, menuConsumed); break;
      case 'attract-range': this.updateAttractRange(dt); break;
      case 'myth': this.updateMyth(dt, menuConsumed); break;
      case 'wait': this.updateWait(dt); break;
    }
  },

  // ---------------- title & menus ----------------
  toTitle() {
    this.teardownMyth(); this.exitAttractUI();
    this.state = 'title'; this.mode = 'episode'; this.idleT = 0; this.pauseOpen = false;
    Range.enter(V3(0, 0.95, 12)); Range.leave(); Range.char.root.visible = true;
    UI.hideHud(); UI.clearTalk(); Sound.play('theme'); Sound.silenceLoops();

    UI.menu({
      layout: 'left', clear: true, noBack: true,
      logo: `<h1 class="big">Myth<br>musters</h1><div class="sub">A science-y, explode-y spiritual successor to <b>MythBusters</b>.<br>Four myths. One crash-test dummy. Zero sensible precautions.</div><div class="hazard"></div>`,
      items: [
        { label: 'Start Episode', desc: 'Walk the range and test all four myths', action: () => this.startEpisode() },
        { label: 'Showdown', desc: 'Hot-seat for 2–4 build teams, pass the controller', action: () => this.showdownMenu() },
        { label: 'Quick Test', desc: 'Jump straight into one myth', action: () => this.quickMenu() },
        { label: 'How to Play', action: () => this.howTo() },

        { label: 'About & Credits', action: () => this.about() },

      foot: `<span>${glyph('updown')} Choose</span><span>${glyph('confirm')} Select</span>`,
    });
  },
  updateTitle(dt) {

  showdownMenu() {

    UI.menu({

  quickMenu() {

      title: 'Quick Test', sub: 'Pick a myth. Results here do not count toward an episode.',
      items: MYTHS.map((m) => ({ label: m.title, desc: m.claim, action: () => { UI.closeAll(); this.mode = 'quick'; this.newPlayers(1); this.startMyth(MYTHS.indexOf(m)); } })).concat([{ label: 'Back', action: () => UI.back() }]),

  settingsItems() {

  // ---------------- showdown ----------------
