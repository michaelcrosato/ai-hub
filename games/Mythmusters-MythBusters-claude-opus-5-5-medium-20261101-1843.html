  // ---------------- myth flow ----------------
  teardownMyth() {
    if (this.M) { this.M.myth.teardown(); if (this.M.charge) Gfx.scene.remove(this.M.charge); }
    this.M = null; Sound.silenceLoops(); UI.gauge(false); this.timeScale = 1; Gfx.cam.override = null; Gfx.fx.clear();
  },
  startMyth(i, keepDials, instant) {
    const myth = MYTHS[i];
    (instant ? (fn) => fn() : (fn) => this.fadeThen(fn))(() => {
      this.teardownMyth(); Range.leave(); Range.char.root.visible = false;
      if (!keepDials && this.mode !== 'attract') myth.resetDials();
      if (this.mode === 'attract') for (const k in myth.ai.dials) { const D = myth.dials.find((d) => d.key === k); D.value = D.def; }
      myth.build();
      this.state = 'myth';
      this.M = { myth, idx: i, phase: 'brief', sel: 0, t: 0, boomed: false, attempt: 0 };
      if (!this.players.length) this.newPlayers(1);
      const pr = this.players[this.cur];
      if (!pr.myth[myth.id]) pr.myth[myth.id] = { best: null, goals: [false, false, false], boom: 0 };
      this.mythCam(true);
      UI.hideHud(); UI.mythTag(myth, this.mode === 'showdown' ? `MYTH ${i + 1} OF 4 · ${pr.name.toUpperCase()}` : `MYTH ${i + 1} OF 4`); this.mythHud();
      Sound.play('build');
      const lines = this.mode === 'attract' ? myth.intro.slice(0, 2) : myth.intro;
      UI.queue(lines, () => { if (this.M && this.M.phase === 'brief') this.toSetup(); });
    });
  },
  mythHud() {
    const p = this.players[this.cur], r = p.myth[this.M.myth.id];
    UI.score(this.total(p), this.mode === 'session' ? `Myth ${this.M.idx + 1} of 4` : this.mode === 'showdown' ? p.name : `${this.tested(p)} / 4 myths tested`);
    UI.goals(this.M.myth, r ? r.goals : null);
    UI.camLabel(CAM_MODES[Gfx.cam.mode]);
  },
  mythCam(reset) {
    const m = this.M.myth, c = Gfx.cam, ci = m.camInit;
    if (reset) {
      c.setMode(Settings.defaultCam); c.yaw = ci.yaw; c.pitch = ci.pitch; c.dist = ci.dist; c.minDist = 3; c.maxDist = 70;
      c.target.copy(m.P(...ci.target)); c.cut = true;
      const f = m.fp(); c.fpYaw = f.yaw; c.fpPitch = -0.04;
    }
    this.applyMythCam(reset);
  },
  applyMythCam(reset) {
    if (this.state !== 'myth' || !this.M) return;
    const m = this.M.myth, c = Gfx.cam;
    c.blueDir.copy(m.blue.dir); c.blueUp.copy(m.blue.up);
    if (reset) { c.blueZoom = m.blue.zoom; c.updateOrtho(); }
    if (c.mode === 2 && !(this.M.phase === 'run' || this.M.phase === 'boomRun')) c.target.copy(m.P(...m.blue.target));
    else if (c.mode === 0 && reset && this.M.phase !== 'run') c.target.copy(m.P(...m.camInit.target));
    const f = m.fp(); c.fpEye.copy(f.eye); if (f.live || reset) c.fpYaw = f.yaw;
    UI.camLabel(CAM_MODES[c.mode]);
  },
  toSetup() {
    const M = this.M; M.phase = 'setup'; M.sel = 0;
    UI.clearTalk();
    if (this.mode === 'attract') { M.aiT = 0; M.aiStep = 0; }
    UI.say('narrator', this.mode === 'attract' ? 'Time to build the rig.' : pick(['Time to build the rig. Dial it in.', 'With the rig in place, it is time to set it up.', 'The build team gets to work.']));
    this.setupHud();
  },
  setupHud() {
    const M = this.M, m = M.myth;
    UI.dials(m, M.sel, m.setupHint ? m.setupHint() : null);
    const pr = [['updown', 'Select'], ['dpad', 'Adjust'], ['confirm', 'Run the test'], ['cam', 'Camera']];
    if (m.setupKeys) pr.splice(2, 0, ['r1', 'Place domino'], ['l1', 'Undo']);
    if (this.mode === 'episode' || this.mode === 'quick') pr.push(['back', 'Leave']);
    UI.prompts(pr);
    UI.show('#meters', false);
  },
  updateMyth(dt, menuConsumed) {
    const M = this.M; if (!M) return;
    const m = M.myth, c = Gfx.cam;
    M.t += dt;
    const live = !UI.open && this.mode !== 'attract';
    if (live && Input.pressed('cam') && M.phase !== 'replay') { c.cycle(); this.applyMythCam(true); Sound.play2('ui'); }
    if (M.phase !== 'replay' && !UI.open) c.look(dt);
    if (c.mode === 1 && M.phase !== 'replay') { const f = m.fp(); c.fpEye.copy(f.eye); if (f.live) c.fpYaw = f.yaw; }
    if (c.mode === 2 && M.phase !== 'run' && M.phase !== 'boomRun' && M.phase !== 'replay') c.target.copy(m.P(...m.blue.target));
    if (UI.open && menuConsumed) return;
    switch (M.phase) {
      case 'brief':
        if (live && Input.pressed('confirm')) UI.skipLine();
        if (live && Input.pressed('back')) { UI.clearTalk(); this.toSetup(); }
        UI.prompts([['confirm', 'Next'], ['back', 'Skip briefing']]);
        break;
      case 'setup': this.updateSetup(dt); break;
      case 'countdown': {
        const n = 3 - Math.floor(M.t);
        if (n !== M.cd && n > 0) { M.cd = n; Sound.play2('beep', 1); UI.center(`<div class="big" style="font-size:22vh;color:var(--hz);text-shadow:0 1vh 3vh #000">${n}</div>`); }
        if (M.t >= 3) { UI.center(null); Sound.play2('beep', 2); this.beginRun(); }
        break;
      }
      case 'run': {
        if (this.mode === 'attract') this.attractRunAI(m);
        const done = m.runUpdate(dt);
        UI.meters(m.meters());
        if (done) this.endRun();
        break;
      }
      case 'replay': this.updateReplay(dt); break;
      case 'verdict': this.updateVerdict(dt); break;
      case 'boomArm': {
        const n = 3 - Math.floor(M.t);
        if (M.charge) M.charge.children[0].visible = Math.floor(M.t * 6) % 2 === 0;
        if (n !== M.cd && n > 0) { M.cd = n; Sound.play2('beep', 1.5); UI.center(`<div class="big" style="font-size:18vh;color:#ff5a1f;text-shadow:0 1vh 3vh #000">${n}</div>`); }
        if (M.t >= 3) { UI.center(null); this.detonate(); }
        break;
      }
      case 'boomRun': {
        if (M.t > 0.25 && M.t < 1.6) this.timeScale = 0.35; else this.timeScale = 1;
        if (M.t > 4.5) { this.timeScale = 1; Recorder.stop(); if (Settings.replays || this.mode === 'attract') this.startReplay('boomDone'); else this.boomDone(); }
        break;
      }
    }
  },
  updateSetup(dt) {
    const M = this.M, m = M.myth;
    if (this.mode === 'attract') { this.attractSetupAI(dt); return; }
    if (UI.open) return;
    if (Input.pressed('up')) { M.sel = (M.sel - 1 + m.dials.length) % m.dials.length; Sound.play2('tick'); this.setupHud(); }
    if (Input.pressed('down')) { M.sel = (M.sel + 1) % m.dials.length; Sound.play2('tick'); this.setupHud(); }
    const D = m.dials[M.sel];
    const adj = Input.pressed('left') ? -1 : Input.pressed('right') ? 1 : 0;
    if (adj) this.adjustDial(D, adj);
    if (m.setupInput) { const before = m.dominoes ? m.dominoes.length : 0; m.setupInput(); if (m.dominoes && m.dominoes.length !== before) this.setupHud(); }
    if (Input.pressed('confirm')) { this.startCountdown(); return; }
    if (Input.pressed('back') && (this.mode === 'episode' || this.mode === 'quick')) { Sound.play2('back'); if (this.mode === 'quick') this.fadeThen(() => this.toTitle()); else this.backToRange(); }
    void dt;
  },
  adjustDial(D, dir) {
    const m = this.M.myth, old = D.value;
    if (D.options) D.value = (D.value + dir + D.options.length) % D.options.length;
    else D.value = clamp(Math.round((D.value + dir * D.step) / D.step) * D.step, D.min, D.max);
    if (D.value !== old) { Sound.play2('tick'); m.dialChanged(D.key); this.setupHud(); }
  },
  startCountdown() {
    const M = this.M; M.phase = 'countdown'; M.t = 0; M.cd = 0;
    UI.show('#dials', false); UI.prompts([['cam', 'Camera']]);
    UI.say('narrator', pick(['Three... two... one...', 'Here we go. Three, two, one.', 'Cameras rolling. In three, two, one.']));
    Sound.play('tense');
  },
  beginRun() {
    const M = this.M, m = M.myth; M.phase = 'run'; M.t = 0;
    Recorder.start(m.recordables());
    m.begin();
    const pr = { cannon: [['cam', 'Camera']], domino: [['cam', 'Camera']], car: [['r2', 'Gas'], ['l2', 'Brake'], ['move', 'Steer'], ['boom', 'Nitrous'], ['cam', 'Camera']], heater: [['r2', 'Hold: heat'], ['confirm', 'Pop the bottom'], ['cam', 'Camera']] }[m.id];
    UI.prompts(pr);
  },
  endRun() {
    const M = this.M, m = M.myth;
    M.result = m.measure(); Recorder.stop(); UI.show('#meters', false); Sound.silenceLoops(); UI.gauge(false);
    if (Settings.replays || this.mode === 'attract') this.startReplay('verdict'); else this.showVerdict();
  },
  // ---------------- high-speed replay ----------------
  startReplay(next) {
    const M = this.M, m = M.myth; M.phase = 'replay'; M.t = 0; M.rt = 0; M.replayNext = next;
    M.rc = m.replayCam(); M.replayDur = Recorder.duration();
    UI.show('#rec', true); UI.show('#letter', true); UI.show('#scoreTag', false); UI.prompts([['confirm', 'Skip replay']]); UI.show('#cam', false); UI.show('#goals', false);
    Sound.play2('shutter'); Sound.play(null); Sound.track = null;
    UI.say('narrator', next === 'boomDone' ? 'Let us see that again. In glorious slow motion.' : pick(['Let us look at that on the high-speed camera.', 'Back to the high-speed footage.', 'In slow motion, you can really see what happened.']));
    Gfx.cam.override = { pos: V3(), look: V3() };
  },
  updateReplay(dt) {
    const M = this.M, rc = M.rc, last = M.rt;
    M.rt += dt * Math.max(0.3, M.replayDur / 8);
    Recorder.apply(M.rt, last, (e) => {
      if (e.kind === 'muzzle') { Gfx.fx.emit('fire', e.pos, 10, { scale: 0.6 }); Gfx.fx.emit('smoke', e.pos, 10); Sound.play2('cannon'); }
      else if (e.kind === 'blast') { Gfx.fx.explosion(e.pos, e.arg || 1.4); Sound.play2('boom', 1.2); }
      else if (e.kind === 'launch') { Gfx.fx.emit('steam', e.pos, 30, { scale: 1.5, speed: 3 }); Sound.play2('pop'); }
      else if (e.kind === 'nitro') Sound.play2('nitro');
      else { Gfx.fx.emit('dust', e.pos, 14, { scale: e.arg || 1.2 }); Sound.play2('thud', 1); }
    });
    const hero = rc.hero ? rc.hero.position.clone() : rc.follow ? rc.follow() : M.myth.P(0, 1, -10);
    if (rc.clampLook) { hero.z = clamp(hero.z, Math.min(rc.clampLook[0].z, rc.clampLook[1].z), Math.max(rc.clampLook[0].z, rc.clampLook[1].z)); }
    const o = Gfx.cam.override;
    o.pos.copy(rc.pos).add(V3(Math.sin(M.rt * 0.5) * 0.6, 0, 0));
    if (rc.hero && hero.distanceTo(rc.pos) > 25) o.pos.copy(hero).add(rc.pos.clone().sub(hero).setLength(16)).setY(Math.max(2, hero.y + 2));
    o.look.lerp(hero, M.rt < 0.05 ? 1 : 1 - Math.exp(-6 * dt));
    if ((this.mode !== 'attract' && Input.pressed('confirm')) || M.rt >= M.replayDur) this.endReplay();
  },
  endReplay() {
    const M = this.M; Recorder.restore(); Gfx.cam.override = null; Gfx.cam.cut = true;
    UI.show('#rec', false); UI.show('#letter', false); UI.show('#scoreTag', true); UI.clearTalk(); Gfx.fx.clear();
    if (M.replayNext === 'boomDone') this.boomDone(); else this.showVerdict();
  },
  // ---------------- verdict ----------------
  showVerdict() {
    const M = this.M, m = M.myth, r = M.result, p = this.players[this.cur], rec = p.myth[m.id];
    M.phase = 'verdict'; M.t = 0; M.attempt++;
    const newGoals = m.goalsMet(r); let goalPts = 0;
    newGoals.forEach((g, i) => { if (g && !rec.goals[i]) { rec.goals[i] = true; goalPts += GOAL_BONUS; } });
    const isBest = !rec.best || r.points > rec.best.points;
    if (isBest) rec.best = { verdict: r.verdict, points: r.points, stat: r.stat };
    M.goalPts = goalPts; M.isBest = isBest;
    UI.stamp(r.verdict); Sound.play2('stamp' + r.verdict); Sound.play('results');
    if (r.verdict === 'C') { Sound.play2('cheer'); Gfx.fx.emit('confetti', Gfx.cam.smoothTarget.clone().add(V3(0, 2, 0)), 80, { spread: 3 }); }
    m.hostsReact(r.verdict);
    if (this.mode === 'episode') World.setStationStatus(m.id, m, rec.best);
    UI.queue(r.lines);
    this.verdictHud();
    this.mythHud();
    if (this.mode === 'session') AIHub.progress({ score: this.total(p), label: `Myth ${M.idx + 1} of 4` });
  },
  verdictHud() {
    const M = this.M, r = M.result;
    const pr = [['confirm', 'Continue']];
    if (!M.boomed) pr.push(['boom', 'Make it happen']);
    if (this.mode !== 'showdown' && this.mode !== 'attract') pr.push(['r1', 'Retest']);
    pr.push(['cam', 'Camera']);
    UI.prompts(pr);
    UI.meters([{ k: 'RESULT', v: r.stat }, { k: 'TEST POINTS', v: r.points.toLocaleString() }, { k: 'GOAL BONUS', v: '+' + M.goalPts }].concat(M.boomPts !== undefined ? [{ k: 'BOOM BONUS', v: '+' + M.boomPts }] : []));
  },
  updateVerdict(dt) {
    const M = this.M;
    if (M.t > 1.2) UI.stampOff();
    if (this.mode === 'attract') { if (M.t > 3 && !M.boomed) this.armBoom(); else if (M.t > 4 && M.boomed) this.attractNext(); return; }
    if (UI.open) return;
    if (UI.talking() && Input.pressed('back')) UI.skipLine();
    if (M.t < 0.6) return;
    if (Input.pressed('boom') && !M.boomed) { this.armBoom(); return; }
    if (Input.pressed('r1') && this.mode !== 'showdown') { this.retest(); return; }
    if (Input.pressed('confirm')) this.continueAfterMyth();
    void dt;
  },
  retest() {
    const M = this.M, i = M.idx;
    UI.clearTalk(); UI.stampOff();
    this.fadeThen(() => {
      const myth = M.myth; myth.build(); this.M = Object.assign(M, { phase: 'setup', t: 0, boomed: false, boomPts: undefined, charge: null });
      if (M.charge) Gfx.scene.remove(M.charge);
      this.mythCam(true); UI.hideHud(); UI.mythTag(myth, `MYTH ${i + 1} OF 4 · RETEST`); this.mythHud(); Sound.play('build');
      UI.say('moss', pick(['Right. Again, but better.', 'Reset the rig. Change one variable.', 'Science is mostly doing it twice.']));
      this.setupHud();
    });
  },
  continueAfterMyth() {
    UI.clearTalk(); UI.stampOff(); UI.show('#meters', false);
    if (this.mode === 'episode') this.backToRange();
    else if (this.mode === 'quick') this.fadeThen(() => this.toTitle());
    else if (this.mode === 'showdown') this.fadeThen(() => { this.teardownMyth(); this.showdownNext(); });
    else if (this.mode === 'session') {
      if (this.M.idx < MYTHS.length - 1) this.startMyth(this.M.idx + 1);
      else this.fadeThen(() => { this.sessionResult(); this.teardownMyth(); this.showResults(); });
    }
  },
  // ---------------- make it happen ----------------
  armBoom() {
    const M = this.M, m = M.myth; M.phase = 'boomArm'; M.t = 0; M.cd = 0; M.boomed = true;
    UI.stampOff(); UI.show('#meters', false); UI.prompts([]);
    const g = new THREE.Group(), c = m.boomCenter();
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.4), mat('charge', { color: 0xd8c8a0, roughness: 0.8 }));
    const led = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff2020 })); led.position.set(0, 0.25, 0);
    g.add(led, box); g.position.copy(c); Gfx.scene.add(g); M.charge = g;
    UI.queue([['narrator', pick(["Whatever the verdict, there's only one way to end a myth like this.", 'The myth is tested. Now for the part everyone actually tunes in for.'])], ['dot', 'If it did not work... we make it happen!']]);
    Sound.play('tense');
    Gfx.cam.setMode(0); Gfx.cam.target.copy(c); Gfx.cam.dist = 22; Gfx.cam.pitch = 0.3; UI.camLabel(CAM_MODES[0]);
  },
  detonate() {
    const M = this.M, m = M.myth, c = M.charge.position.clone();
    Gfx.scene.remove(M.charge); M.charge = null;
    // wake everything in the rig so it all reacts
    for (const o of m.scope || []) if (o.body && !o.fixed) o.body.wakeUp();
    Recorder.start(m.recordables());
    Recorder.event('blast', c, 1.6);
    const moved = Phys.blast(c, 14, 75);
    M.boomPts = Math.min(500, Math.round(moved * 0.12) + 100);
    Gfx.fx.explosion(c, 1.6); Sound.play2('boom', 1.3); Gfx.cam.shake(0.9, 1.2);
    for (const id in World.hosts) if (id === m.id) { World.hosts[id].dot.react('cheer', 3); World.hosts[id].moss.react('cheer', 3); }
    M.phase = 'boomRun'; M.t = 0;
    UI.say('dot', pick(['NOW THAT is a result!', 'Woo! Look at it go!', 'Ohhh, that is going in the highlight reel!']));
  },
  boomDone() {
    const M = this.M, p = this.players[this.cur], rec = p.myth[M.myth.id];
    rec.boom = Math.max(rec.boom, M.boomPts);
    M.phase = 'verdict'; M.t = 0.6;
    UI.toast(`MADE IT HAPPEN: +${M.boomPts} pts`, 2.5); Sound.play2('cheer'); Sound.play('results');
    this.verdictHud(); this.mythHud();
    if (this.mode === 'session') AIHub.progress({ score: this.total(p), label: `Myth ${M.idx + 1} of 4` });
  },

  // ---------------- results ----------------
  rank(t) { return t >= 9000 ? 'Mythmuster Legend' : t >= 7000 ? 'Senior Build Team' : t >= 5000 ? 'Build Team' : t >= 3000 ? 'Shop Assistant' : 'Intern (Probationary)'; },
  showResults() {
    this.state = this.mode === 'session' ? 'final' : 'results'; UI.hideHud(); UI.clearTalk(); Sound.play('results');
    Range.leave();
    const ps = this.players.slice().sort((a, b) => this.total(b) - this.total(a));
    let h = '<table class="res"><tr><td></td>' + MYTHS.map((m) => `<td style="font-size:1.8vh;opacity:.7">${esc(m.short)}</td>`).join('') + '<td class="r" style="font-size:1.8vh;opacity:.7">TOTAL</td></tr>';
    for (const p of ps) {
      h += `<tr><td><span style="color:${p.color}">■</span> ${esc(p.name)}</td>` + MYTHS.map((m) => { const r = p.myth[m.id]; return `<td>${r && r.best ? `<span class="vb ${r.best.verdict}">${VERDICT_NAME[r.best.verdict]}</span> <span style="font-size:1.8vh">${this.mythScore(p, m.id)} · ${'★'.repeat(r.goals.filter(Boolean).length)}</span>` : '—'}</td>`; }).join('') + `<td class="r big">${this.total(p).toLocaleString()}</td></tr>`;
    }
    h += '</table>';
    const best = ps[0];
    const title = this.mode === 'showdown' ? `${best.name} wins!` : "That's a wrap!";
    const sub = `${this.mode === 'showdown' ? 'Showdown results' : 'Episode results'} · Rank: <b style="color:var(--hz)">${this.rank(this.total(best))}</b>`;
    const items = this.mode === 'session' ? null : this.mode === 'episode'
      ? [{ label: 'Keep testing on the Range', action: () => { UI.closeAll(); this.enterRange(V3(0, 0.95, 12)); } }, { label: 'Back to Title', action: () => this.toTitle() }]
      : [{ label: 'Back to Title', action: () => this.toTitle() }];
    UI.closeAll();
    UI.menu({ title, sub, html: h + (this.mode === 'session' ? '<div class="sub" style="margin-top:2vh">Waiting for the hub to wrap the round…</div>' : ''), items, noBack: true, foot: this.mode === 'session' ? '' : undefined });
    Gfx.cam.setMode(0); Gfx.cam.target.set(0, 2, -6); Gfx.cam.dist = 24; Gfx.cam.pitch = 0.25;
    UI.say('narrator', this.mode === 'showdown' ? `And the top build team is ${best.name}, with ${this.total(best).toLocaleString()} points.` : `Four myths tested. ${this.total(best).toLocaleString()} Science Points. Another episode in the can.`);
  },

  // ---------------- attract mode ----------------
  attractOn() { return this.mode === 'attract'; },
  startAttract() {
    UI.closeAll(); this.mode = 'attract'; this.newPlayers(1, ['Demo']); this.attractGrace = 0.5;
    $('#attractTag').style.display = 'block';
    this.attractIdx = 0; this.attractRange();
  },
  attractRange() {
    this.teardownMyth(); this.state = 'attract-range'; Range.enter(V3(0, 0.95, 12)); Gfx.cam.setMode(0); UI.hideHud(); Sound.play('theme');
    this.rangeAI = { x: 0, y: 0, run: true }; this.aT = 0;
    UI.say('narrator', 'Coming up on Mythmusters...');
  },
  updateAttractRange(dt) {
    this.aT += dt;
    const st = World.stations[this.attractIdx % 4], p = Range.pos;
    const dx = st.pos.x - p.x, dz = st.pos.z - p.z, d = Math.hypot(dx, dz);
    // convert world direction to stick relative to chase cam yaw
    const c = Gfx.cam, fx = -Math.sin(c.yaw), fz = -Math.cos(c.yaw), rx = -fz, rz = fx;
    const wx = dx / (d || 1), wz = dz / (d || 1);
    this.rangeAI.x = d > 1 ? wx * rx + wz * rz : 0; this.rangeAI.y = d > 1 ? -(wx * fx + wz * fz) : 0;
    c.yaw = damp(c.yaw, Math.atan2(-wx, -wz) + 0.4, 1.5, dt);
    if (d < 1.2 || this.aT > 9) { this.rangeAI = null; this.startMyth(this.attractIdx % 4); this.state = 'attract-wait'; }
  },
  attractSetupAI(dt) {
    const M = this.M, m = M.myth; M.aiT += dt;
    if (M.aiT < 0.45) return; M.aiT = 0;
    if (m.id === 'domino' && M.aiStep >= m.dials.length) { const n = m.next(); if (n.ok) { Input.synthetic.r1 = true; m.setupInput(); this.setupHud(); return; } }
    if (M.aiStep < m.dials.length) {
      const D = m.dials[M.aiStep]; M.sel = M.aiStep; const want = m.ai.dials[D.key];
      if (D.value !== want) { const dir = D.options ? 1 : Math.sign(want - D.value); this.adjustDial(D, dir); if (!D.options && Math.abs(D.value - want) < D.step / 2) D.value = want; return; }
      M.aiStep++; this.setupHud(); return;
    }
    this.startCountdown();
  },
  attractRunAI(m) {
    if (m.id === 'car') m.aiDrive = true;
    if (m.id === 'heater') { m.aiHeat = 1; if (m.state === 'heat' && m.p >= m.seamLimit - 12) m.aiPop = true; }
  },
  attractNext() { if (this.fadeQ) return; this.fadeThen(() => { this.attractIdx++; this.teardownMyth(); for (const mm of MYTHS) { mm.aiDrive = false; mm.aiHeat = undefined; } this.attractRange(); }); },
  exitAttract() {
    for (const mm of MYTHS) { mm.aiDrive = false; mm.aiHeat = undefined; mm.aiPop = false; }

    if (this.touchOnly && $('#touchBlock').style.display !== 'none') { /* touch-only: keep demo; message stays */ }
    this.toTitle(); this.idleT = 0;
  },
  exitAttractUI() { $('#attractTag').style.display = 'none'; },

  // ---------------- AI Hub session (side by side) ----------------
  startSession(info) {
    this.mode = 'session';
    const me = info.players.find((p) => p.id === info.me);
    this.newPlayers(1, [me ? me.name : 'You']); if (me) this.players[0].color = me.color;
    this.reported = false;
    AIHub.on('time-up', () => { if (!this.reported) this.sessionResult(); if (this.state !== 'final') { this.teardownMyth(); this.showResults(); } });
    AIHub.on('end', () => { this.stopped = true; Sound.stopAll(); UI.clearTalk(); });

    this.state = 'wait';

      const names = info.players.map((p) => `<div style="color:${p.color}">${esc(p.name)}</div>`).join('');
      UI.center(`<div class="card"><h2 class="big">Mythmusters</h2><div class="sub">${names}</div><div style="font-size:2.6vh">Press any key, click or tap when you are ready</div></div>`);
      const go = () => { removeEventListener('keydown', go); removeEventListener('pointerdown', go); clearInterval(this.padReady); AIHub.ready(); UI.center('<div class="big" style="font-size:5vh">Waiting for the others…</div>'); Sound.resume(); };
      addEventListener('keydown', go); addEventListener('pointerdown', go);
      this.padReady = setInterval(() => { const ps = navigator.getGamepads ? navigator.getGamepads() : []; for (const p of ps) if (p && p.buttons.some((b) => b.pressed)) go(); }, 100);
    }
  },
  updateWait() {
    const t = AIHub.time();
    if (t > -Infinity && t < 0) UI.center(`<div class="big" style="font-size:20vh;color:var(--hz)">${Math.ceil(-t / 1000)}</div>`);

  },
  sessionResult() {
    if (this.reported) return; this.reported = true;
    const p = this.players[0];
    const conf = MYTHS.filter((m) => p.myth[m.id] && p.myth[m.id].best && p.myth[m.id].best.verdict === 'C').length;
    const stars = MYTHS.reduce((s, m) => s + (p.myth[m.id] ? p.myth[m.id].goals.filter(Boolean).length : 0), 0);
    const awards = [];
    if (conf >= 3) awards.push({ title: 'Myth Confirmer', detail: `${conf} myths confirmed` });
    if (stars >= 6) awards.push({ title: 'Goal Getter', detail: `${stars} build goals` });
    if (MYTHS.every((m) => p.myth[m.id] && p.myth[m.id].boom)) awards.push({ title: 'Made It Happen', detail: 'Blew up every rig' });
    AIHub.result({ score: this.total(p), stats: { confirmed: conf, stars, tested: this.tested(p) }, awards });
  },
};

// ===== 10 main: boot =====
Game.boot().catch((err) => {
  console.error(err);
  const msg = String(err && err.message ? err.message : err);
  const b = document.getElementById('boot');
  if (b) { b.style.display = 'flex'; b.innerHTML = `<div class="big" style="color:#ffb000;font-size:5vh">Mythmusters could not start</div><div style="max-width:60vw;text-align:center;font-size:2.4vh">${msg.replace(/</g, '&lt;')}</div><div style="font-size:2vh;opacity:.7">This game needs WebGPU or WebGL 2.</div>`; }
  if (window.AIHub && AIHub.active) AIHub.fail('Could not start: ' + msg.slice(0, 120));
});

t shows your result, plus barrels and crates to kick around.\n- **Cameras:** chase cam is the main view; Triangle / C switches to first person or an orthographic \"Blueprint\" side view.\n- **Modes:** Episode, Quick Test, a 2–4 player pass-the-controller Showdown, and AI Hub sessions in side-by-side mode. The game's 5-minute hub rounds are the four myths.\n- **Required extras:**\n  - Attract mode starts after 10 s idle on the title.\n  - Settings include invert controller X/Y.\n  - Touch-only devices get the \"Controller or keyboard required\" screen with a settings button.\n\nTwo choices to know about:\n- **Brick walls:** loose stacked bricks just absorbed the cannonball, so impacts use a simple \"mortar\" model. The ball spends energy to break the bricks in its path.\n- **Multiplayer \"on its own\":** I read this as local hot-seat (Showdown), not online play.\n\n## Source Information\n- **Date:** 2026-11-01 18:43\n- **Source:** MythBusters (TV series, 2003–2018)\n- **Genre and Perspective:** physics experiment / sandbox puzzle with light driving and walking. Main view is a third-person chase camera; you can switch to first person or the orthographic Blueprint view.\n- **Tech:** single HTML file; Three.js r180 (WebGPU renderer with automatic WebGL 2 fallback; the sky uses a TSL node material); Rapier 0.19.3 (rigid bodies, joints, fast-projectile collision, character controller, vehicle controller); Web Audio; Gamepad API; AI Hub session client 1.3.0.\n- **Art Direction:** Three.js's standard look: PBR materials, soft shadows from one sun, hemisphere light, fog, generated textures, models built from primitives.\n- **Animation:** Three.js AnimationMixer clips (idle, walk, run, cheer, shrug, point, jump) with cross-fades; physics-driven props; recorded transforms replayed in slow motion.\n- **Audio:** all written in code: a step sequencer playing four original tracks, synthesized sound effects, and gibberish \"Animalese\" voices for the narrator, the hosts Dot and Moss, and Bucky.\n- **Online:** AI Hub side-by-side sessions (seeded start, live progress, result with stats and awards); local hot-seat Showdown; nothing else.\n- **Testing:** headless Chromium (Playwright) on SwiftShader WebGPU/WebGL with CDN files served locally; frame-by-frame stepping; parameter sweeps; the AI Hub harness.\n- **Research:** only the AI Hub protocol README and Rapier's type definitions; the show's format from memory.\n- **Environment:** Claude Code CLI (headless); Linux; browser unknown\n- **Model:** Anthropic, claude-opus-5-5, reasoning effort medium\n- **Usage:** session time about 1 h 55 min. API cost and token counts: unknown.\n\n## Testing Feedback\n- **Issues caught:** about 19, including:\n  - cannonballs stopping dead in the brick wall\n  - the car driving backwards\n  - ceiling planks jamming the water heater\n  - a Rapier crash from stale references\n  - a crash from disposing a texture\n  - the AI Hub hello arriving too late\n  - timer-based fades stalling the stepped tests\n  - attract mode skipping myths\n  - the Blueprint view blocked by scenery\n  - menu overflow\n- **Critical / game breaking:** 7 — the camera method collision, the Rapier crash, the texture crash, the hub hello timeout, the reversed car, the jammed heater and the stalled fades.\n- **Most helpful test:** running a myth at many dial settings with rendering off and printing the verdicts.\n- **Least helpful test:** render-target screenshots on the WebGPU backend; they hid the real texture crash at first.\n\n## Engine Feedback\n- **Liked most:** Rapier's vehicle and character controllers; WebGPURenderer's automatic WebGL 2 fallback.\n- **Stuck or guessed wrong:** the vehicle's forward axis (the car first drove backwards), and a sleeping body that didn't wake when pushed from below.\n- **Most important thing built myself:** the experiment framework (dials, measured verdicts, goals), the slow-motion replay recorder, and the brick-breaking model.\n- **Hardest part:** Rapier's
