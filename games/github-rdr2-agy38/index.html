<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DEAD HORIZON: 1899 — An Outlaw's Redemption</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0d0a08;
      color: #ede4d1;
      font-family: 'Georgia', serif;
      overflow: hidden;
      user-select: none;
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at center, #1c1510 0%, #0d0a08 100%);
    }

    /* Top Bar */
    header {
      height: 38px;
      background: linear-gradient(180deg, #2a1a12 0%, #17100b 100%);
      border-bottom: 2px solid #5a3a22;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 10;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .title-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      color: #e59866;
      text-shadow: 1px 1px 2px #000;
    }
    .badge {
      background: #78281f;
      color: #f5b041;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      border: 1px solid #b03a2e;
    }
    .header-controls {
      display: flex;
      gap: 6px;
    }
    .btn-hdr {
      background: #3e2619;
      border: 1px solid #6e472e;
      color: #f5eeda;
      padding: 4px 10px;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-hdr:hover { background: #5d3821; border-color: #d4ac0d; }

    /* Canvas Screen */
    #viewport {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }
    #screen {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Mobile / Tablet Touch Controls Overlay */
    #touch-controls {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 20;
    }
    .touch-btn-cluster {
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
    }
    .touch-row {
      display: flex;
      gap: 8px;
    }
    .touch-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(35, 24, 16, 0.85);
      border: 2px solid #8c5d3d;
      color: #f9e79f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6);
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .touch-btn:active {
      background: #8c5d3d;
      color: #fff;
      transform: scale(0.95);
    }
    .touch-btn.primary {
      width: 66px;
      height: 66px;
      background: rgba(140, 40, 30, 0.9);
      border-color: #f1c40f;
      color: #fff;
    }

    /* Quick Access Action Bar */
    #quick-bar {
      position: absolute;
      top: 46px;
      left: 12px;
      display: flex;
      gap: 6px;
      z-index: 15;
    }
    .bar-btn {
      background: rgba(25, 18, 13, 0.85);
      border: 1px solid #784212;
      color: #f4d03f;
      padding: 5px 9px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .bar-btn:hover { background: #56331a; }

    /* CRT scanline filter (optional toggle) */
    .crt-effect::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 8;
    }
    /* Small Screen / Mobile Responsiveness */
    @media (max-width: 600px) {
      header { height: 34px; padding: 0 6px; font-size: 11px; }
      .title-banner span:first-child { display: none; }
      .badge { font-size: 9px; padding: 2px 4px; }
      .header-controls { gap: 4px; }
      .btn-hdr { padding: 3px 6px; font-size: 9px; }
      #quick-bar { top: 40px; left: 6px; gap: 4px; }
      .bar-btn { padding: 3px 6px; font-size: 9px; }
      .touch-btn { width: 50px; height: 50px; font-size: 8px; }
      .touch-btn.primary { width: 58px; height: 58px; }
    }
  </style>
</head>
<body>
  <div id="app-container">
    <header>
      <div class="title-banner">
        <span>DEAD HORIZON: 1899</span>
        <span class="badge">153 MISSIONS</span>
      </div>
      <div class="header-controls">
        <button class="btn-hdr" id="btn-view" onclick="cycleView()">VIEW: 3/4</button>
        <button class="btn-hdr" id="btn-crt" onclick="toggleCRT()">CRT: ON</button>
        <button class="btn-hdr" onclick="openMissions()">MISSIONS (M)</button>
        <button class="btn-hdr" onclick="openJournal()">JOURNAL (J)</button>
      </div>
    </header>

    <div id="viewport" class="crt-effect">
      <canvas id="screen"></canvas>

      <!-- Quick Action Buttons -->
      <div id="quick-bar">
        <button class="bar-btn" onclick="triggerMount()">🏇 MOUNT (E)</button>
        <button class="bar-btn" onclick="triggerDeadeye()">👁 DEAD EYE (Q)</button>
        <button class="bar-btn" onclick="triggerWhistle()">📯 WHISTLE (H)</button>
        <button class="bar-btn" onclick="triggerPoker()">♠ POKER (P)</button>
      </div>

      <!-- Touch Overlay for Small Phones and Tablets -->
      <div id="touch-controls">
        <div class="touch-btn-cluster">
          <div class="touch-row">
            <button class="touch-btn" onclick="triggerWhistle()"><span>📯</span>Whistle</button>
            <button class="touch-btn" onclick="triggerMount()"><span>🏇</span>Mount</button>
          </div>
          <div class="touch-row">
            <button class="touch-btn" onclick="openJournal()"><span>📖</span>Journal</button>
            <button class="touch-btn" onclick="openMissions()"><span>★</span>153 Quest</button>
          </div>
        </div>

        <div class="touch-btn-cluster">
          <div class="touch-row">
            <button class="touch-btn" onclick="triggerDeadeye()"><span>👁</span>Dead Eye</button>
            <button class="touch-btn" onclick="triggerReload()"><span>🔄</span>Reload</button>
          </div>
          <div class="touch-row">
            <button class="touch-btn primary" onclick="triggerShoot()"><span>💥</span>FIRE</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="my-3d2dge-agent.js"></script>
  <script type="module" src="src/game.js"></script>

  <script>
    function triggerShoot() { if (window.RDR2Game) window.RDR2Game.shoot(); }
    function triggerDeadeye() { if (window.RDR2Game) window.RDR2Game.deadeye(); }
    function triggerMount() { if (window.RDR2Game) window.RDR2Game.mount(); }
    function triggerWhistle() { if (window.RDR2Game) window.RDR2Game.whistle(); }
    function triggerReload() { if (window.RDR2Game) window.RDR2Game.reload(); }
    function openJournal() { if (window.RDR2Game) window.RDR2Game.journal(); }
    function openMissions() { if (window.RDR2Game) window.RDR2Game.missions(); }
    function triggerPoker() { if (window.RDR2Game) window.RDR2Game.poker(); }

    const views = ['threequarter', 'iso', 'topdown', 'brawler'];
    let vIdx = 0;
    function cycleView() {
      vIdx = (vIdx + 1) % views.length;
      if (window.RDR2Game && window.RDR2Game.game) {
        window.RDR2Game.game.setView(views[vIdx]);
      }
      document.getElementById('btn-view').textContent = 'VIEW: ' + views[vIdx].toUpperCase();
    }

    let crtOn = true;
    function toggleCRT() {
      crtOn = !crtOn;
      document.getElementById('viewport').className = (crtOn ? 'crt-effect' : '');
      document.getElementById('btn-crt').textContent = 'CRT: ' + (crtOn ? 'ON' : 'OFF');
    }
  </script>
</body>
</html>
