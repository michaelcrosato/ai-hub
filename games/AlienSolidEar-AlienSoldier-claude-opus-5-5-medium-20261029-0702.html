<!--
== ALIEN SOLID EAR ==
  An original spiritual successor to Alien Soldier (Treasure, Sega Mega Drive, 1995). Boss-rush run-and-gun: 3 stages, 4 bosses, 5 enemy types, 6 weapons, solo or local 2-player co-op / versus / race.
  Title picked at random (cryptographic RNG, 1 of 50 brainstormed riffs on the source name).

== Source Information ==
  Date: 2026-10-29 07:02
  Source: Alien Soldier
  Tech: Three.js r180 (three.webgpu.js, WebGPURenderer, WebGPU only, no fallback; TSL PostProcessing + BloomNode), Rapier 2D 0.19.3 (@dimforge/rapier2d-compat: kinematic character controller, dynamic bodies, ray casts), Gamepad API, Web Audio API, plain ES modules from jsDelivr, AI Hub Session Protocol v1 client 1.3.0 (session.js, unmodified)
  Art Direction: stylized cel-shading: MeshToonMaterial with a hard 3-step ramp, inverted-hull ink outlines on every model, unlit glow materials + bloom for shots and lights, flat neon palettes per stage
  Animation: procedural code animation of hierarchical primitive rigs (run/jump/hover/ceiling-flip/aim/dash poses for the hero; scripted boss rigs), generator-coroutine boss scripts, instanced particles, Rapier-simulated debris
  Audio: all code-written in Web Audio: a step sequencer playing 7 authored tracks (title, two stage themes, boss, final boss, clear, results), synthesized SFX (oscillators + filtered noise), and gibberish formant-blip voice acting (Animalese style) for story, taunts and dialogue
  Online: AI Hub session integration (side-by-side / parallel mode: seeded start, progress, result with stats and awards, time-up and end handling, probe). On its own: local 2-player CO-OP, VERSUS and RACE modes (second controller). No chat
  Testing: lightweight: node —check syntax checks, headless Chrome (SwiftShader WebGPU) scripted smoke runs with screenshots, the AI Hub harness
  Environment: Claude Code CLI (headless); Linux; browser unknown
  Model: Anthropic, claude-opus-5-5, reasoning effort medium
  Usage: unknown — no token, cost or timing counter is visible to the model. Rough session time: about 1.5 hours (07:02 start). Cost and token totals: unknown

== Testing Feedback ==
  How many issues did testing catch? 11: missed key taps between slow frames; a page freeze from hit-flash material clones forcing new WebGPU pipeline compiles; the camera clamping to an uncleared arena and losing the player; the weapon-select Deploy prompt sharing Esc with Back; AI Hub progress never reported while a menu was open; an over-bright acid hazard; the DEMO PLAY label covering the boss name; over-dark toon ramp on ceilings; a doubled arrow in Stage Select; the mid-boss shell took too little damage (0.45x) for an uncheated bot to win, raised to 0.6x; a Rapier panic in the final boss fight (expired debris bodies were still updated after removal)
  How many would be considered critical / game breaking? 3: the material-clone freeze (the page stopped responding mid boss fight), the Rapier panic in the final boss's falling-rock phase (physics stopped), and the missing progress reports (the AI Hub check failed)
  Most helpful test: scripted headless Chrome runs (SwiftShader WebGPU) that teleport into each boss arena, force HP thresholds and screenshot every phase, plus the AI Hub harness, an emulated standard gamepad (stick, Cross, R2, R1, Circle, Square, Options, Create+Options, invert toggles), a touch-only device check, and uncheated bot fights against every boss on SUPEREASY
  Least helpful test: timing-sensitive keyboard tests at full resolution: software WebGPU ran at about 5 fps, so short key holds produced false failures (e.g. a jump that never reached the ceiling)

== Engine Feedback ==
  What I liked most: three.js r180 WebGPU accepts the classic MeshToonMaterial / InstancedMesh API unchanged, and TSL PostProcessing + BloomNode added glow in three lines. Rapier's 2D KinematicCharacterController made ceiling walking easy: flip its up vector and gravity
  Did I get stuck or guess wrong? Yes: cloning materials per object for hit flashes looked harmless but every clone compiles a new WebGPU pipeline, which stalled the page. Rapier ray-hit field names changed between versions (timeOfImpact vs toi), so I guessed carefully. Headless tests needed SwiftShader flags to get a WebGPU adapter at all
  Most important thing I built myself: the game layer on top of the libraries: a fixed-step loop, the character state machine (hover, ceiling walk, dash, Phoenix, Counter), generator-coroutine boss scripts, bullet / beam / ring collision, and a controller-first menu system
  Hardest part: knowing what costs a pipeline compile in WebGPU and keeping debugging cheap, since software WebGPU is slow and gives little feedback
  If I could remove or overhaul one thing: the implicit fallback. WebGPURenderer silently drops to WebGL2, so 'WebGPU, no fallback' needs a manual navigator.gpu and backend check
  If I could change one thing: built-in, cheap per-instance flash / tint overrides for node materials, and a warning when a new pipeline compiles mid-frame

== Prompt Feedback ==
  What I liked most: a clear, testable 'Done' definition plus concrete UX constraints (10-foot controller-first, invert-axis quick fix, touch-only notice, attract mode)
  What was confusing: Alien Soldier is single-player while the multiplayer section asks to 'follow' the hub, so mode choice was left open (I picked side by side, the protocol's natural fit). 'No fallback' for WebGPU sits against the hub's advice to ship a WebGL 2 fallback (resolved with hub:webgpu required)
  Hardest thing: fitting a full boss-rush vertical slice (4 bosses, ceiling walking, 6 weapons, attract AI, session mode) into one file while keeping each system data-driven
  One test I wish I could run: a real-GPU browser playthrough with a physical DualSense, to tune feel, frame pacing and controller glyphs

== Credits ==
  Design, code, music, sound, voices: generated by claude-opus-5-5 in Claude Code
  Libraries: three.js (MIT), Rapier (Apache-2.0), AI Hub session client
  Fonts: Russo One, Chakra Petch (Google Fonts, OFL)
  Alien Soldier is a trademark of Sega / Treasure. This is an unaffiliated homage.

/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

const ABOUT = [["ALIEN SOLID EAR",["An original spiritual successor to Alien Soldier (Treasure, Sega Mega Drive, 1995). Boss-rush run-and-gun: 3 stages, 4 bosses, 5 enemy types, 6 weapons, solo or local 2-player co-op / versus / race.","Title picked at random (cryptographic RNG, 1 of 50 brainstormed riffs on the source name)."]],["Source Information",["Date: 2026-10-29 07:02","Source: Alien Soldier","Tech: Three.js r180 (three.webgpu.js, WebGPURenderer, WebGPU only, no fallback; TSL PostProcessing + BloomNode), Rapier 2D 0.19.3 (@dimforge/rapier2d-compat: kinematic character controller, dynamic bodies, ray casts), Gamepad API, Web Audio API, plain ES modules from jsDelivr, AI Hub Session Protocol v1 client 1.3.0 (session.js, unmodified)","Art Direction: stylized cel-shading: MeshToonMaterial with a hard 3-step ramp, inverted-hull ink outlines on every model, unlit glow materials + bloom for shots and lights, flat neon palettes per stage","Animation: procedural code animation of hierarchical primitive rigs (run/jump/hover/ceiling-flip/aim/dash poses for the hero; scripted boss rigs), generator-coroutine boss scripts, instanced particles, Rapier-simulated debris","Audio: all code-written in Web Audio: a step sequencer playing 7 authored tracks (title, two stage themes, boss, final boss, clear, results), synthesized SFX (oscillators + filtered noise), and gibberish formant-blip voice acting (Animalese style) for story, taunts and dialogue","Online: AI Hub session integration (side-by-side / parallel mode: seeded start, progress, result with stats and awards, time-up and end handling, probe). On its own: local 2-player CO-OP, VERSUS and RACE modes (second controller). No chat","Testing: lightweight: node --check syntax checks, headless Chrome (SwiftShader WebGPU) scripted smoke runs with screenshots, the AI Hub harness","Environment: Claude Code CLI (headless); Linux; browser unknown","Model: Anthropic, claude-opus-5-5, reasoning effort medium","Usage: unknown — no token, cost or timing counter is visible to the model. Rough session time: about 1.5 hours (07:02 start). Cost and token totals: unknown"]],["Testing Feedback",["How many issues did testing catch? 11: missed key taps between slow frames; a page freeze from hit-flash material clones forcing new WebGPU pipeline compiles; the camera clamping to an uncleared arena and losing the player; the weapon-select Deploy prompt sharing Esc with Back; AI Hub progress never reported while a menu was open; an over-bright acid hazard; the DEMO PLAY label covering the boss name; over-dark toon ramp on ceilings; a doubled arrow in Stage Select; the mid-boss shell took too little damage (0.45x) for an uncheated bot to win, raised to 0.6x; a Rapier panic in the final boss fight (expired debris bodies were still updated after removal)","How many would be considered critical / game breaking? 3: the material-clone freeze (the page stopped responding mid boss fight), the Rapier panic in the final boss's falling-rock phase (physics stopped), and the missing progress reports (the AI Hub check failed)","Most helpful test: scripted headless Chrome runs (SwiftShader WebGPU) that teleport into each boss arena, force HP thresholds and screenshot every phase, plus the AI Hub harness, an emulated standard gamepad (stick, Cross, R2, R1, Circle, Square, Options, Create+Options, invert toggles), a touch-only device check, and uncheated bot fights against every boss on SUPEREASY","Least helpful test: timing-sensitive keyboard tests at full resolution: software WebGPU ran at about 5 fps, so short key holds produced false failures (e.g. a jump that never reached the ceiling)"]],["Engine Feedback",["What I liked most: three.js r180 WebGPU accepts the classic MeshToonMaterial / InstancedMesh API unchanged, and TSL PostProcessing + BloomNode added glow in three lines. Rapier's 2D KinematicCharacterController made ceiling walking easy: flip its up vector and gravity","Did I get stuck or guess wrong? Yes: cloning materials per object for hit flashes looked harmless but every clone compiles a new WebGPU pipeline, which stalled the page. Rapier ray-hit field names changed between versions (timeOfImpact vs toi), so I guessed carefully. Headless tests needed SwiftShader flags to get a WebGPU adapter at all","Most important thing I built myself: the game layer on top of the libraries: a fixed-step loop, the character state machine (hover, ceiling walk, dash, Phoenix, Counter), generator-coroutine boss scripts, bullet / beam / ring collision, and a controller-first menu system","Hardest part: knowing what costs a pipeline compile in WebGPU and keeping debugging cheap, since software WebGPU is slow and gives little feedback","If I could remove or overhaul one thing: the implicit fallback. WebGPURenderer silently drops to WebGL2, so 'WebGPU, no fallback' needs a manual navigator.gpu and backend check","If I could change one thing: built-in, cheap per-instance flash / tint overrides for node materials, and a warning when a new pipeline compiles mid-frame"]],["Prompt Feedback",["What I liked most: a clear, testable 'Done' definition plus concrete UX constraints (10-foot controller-first, invert-axis quick fix, touch-only notice, attract mode)","What was confusing: Alien Soldier is single-player while the multiplayer section asks to 'follow' the hub, so mode choice was left open (I picked side by side, the protocol's natural fit). 'No fallback' for WebGPU sits against the hub's advice to ship a WebGL 2 fallback (resolved with hub:webgpu required)","Hardest thing: fitting a full boss-rush vertical slice (4 bosses, ceiling walking, 6 weapons, attract AI, session mode) into one file while keeping each system data-driven","One test I wish I could run: a real-GPU browser playthrough with a physical DualSense, to tune feel, frame pacing and controller glyphs"]],["Credits",["Design, code, music, sound, voices: generated by claude-opus-5-5 in Claude Code","Libraries: three.js (MIT), Rapier (Apache-2.0), AI Hub session client","Fonts: Russo One, Chakra Petch (Google Fonts, OFL)","Alien Soldier is a trademark of Sega / Treasure. This is an unaffiliated homage."]]];

function readPad(pad) {
  const b = (i) => !!(pad.buttons[i] && pad.buttons[i].pressed);
  const create = b(8);
  let ax = pad.axes[0] || 0, ay = -(pad.axes[1] || 0);
  if (Math.hypot(ax, ay) < 0.25) { ax = 0; ay = 0; }
  let dx = (b(15) ? 1 : 0) - (b(14) ? 1 : 0), dy = (b(12) ? 1 : 0) - (b(13) ? 1 : 0);
  if (settings.invertX) { ax = -ax; dx = -dx; }
  if (settings.invertY) { ay = -ay; dy = -dy; }
  const px = dx || ax, py = dy || ay;
  const btn = {
    jump: b(0), confirm: b(0), back: b(1), dash: b(1), counter: b(3), phoenix: b(2), fire: b(7) || b(11),
    aim: b(6), prev: b(4), next: b(5), pause: b(9) && !create,
    up: py > 0.5, down: py < -0.5, left: px < -0.5, right: px > 0.5,
  };
  let rx = pad.axes[2] || 0, ry = -(pad.axes[3] || 0);
  if (settings.invertX) rx = -rx; if (settings.invertY) ry = -ry;

/** cmd: { mx, my, jump, jumpHeld, fire, aim, aimX?, aimY?, dash, counter, phoenix, prev, next } */
function updatePlayer(dt, cmd) {

    P.deadT -= dt; rig.root.visible = false;
    return;
  }
  P.invT = Math.max(0, P.invT - dt); P.dashCd -= dt; P.phoenixCd -= dt; P.counterCd -= dt; P.fireCd -= dt; P.counterT -= dt;
  const gdir = P.onCeil ? 1 : -1; // gravity direction in y
  // weapon cycling
  if (cmd.prev) { P.wi = (P.wi + P.weapons.length - 1) % P.weapons.length; audio.play('swap'); }
  if (cmd.next) { P.wi = (P.wi + 1) % P.weapons.length; audio.play('swap'); }

  if (settings.aimMode === 'toggle') { if (cmd.aimPressed) P.aimToggle = !P.aimToggle; P.aiming = P.aimToggle; } else P.aiming = cmd.aim;
  // aim direction: 8-way from stick in fixed shot, free shot aims facing (+up diagonals)
  let ax = cmd.mx, ay = cmd.my;

      P.aimX = Math.cos(a); P.aimY = Math.sin(a); if (Math.abs(P.aimX) > 0.2) P.face = sign(P.aimX);
    } else { P.aimX = P.face; P.aimY = 0; }
  } else {
    let up = cmd.my > 0.5 ? 1 : cmd.my < -0.5 && !P.onGround ? -1 : 0;
    if (P.onCeil) up = cmd.my < -0.5 ? -1 : cmd.my > 0.5 && !P.onGround ? 1 : 0;
    const moving = Math.abs(cmd.mx) > 0.3;
    if (up !== 0 && moving) { P.aimX = P.face * 0.7071; P.aimY = up * 0.7071; } else if (up !== 0) { P.aimX = 0; P.aimY = up; } else { P.aimX = P.face; P.aimY = 0; }
  }
  // ---- special moves ----
  if (cmd.dash && P.dashCd <= 0 && P.phoenixT <= 0) {
    P.dashT = PHYS.dashTime; P.dashCd = 0.45; P.invT = Math.max(P.invT, PHYS.dashTime + 0.08);
    const dx = Math.abs(cmd.mx) > 0.3 ? sign(cmd.mx) : P.face; P.dashDir = { x: dx, y: Math.abs(cmd.my) > 0.5 && !P.onGround ? sign(cmd.my) * 0.5 : 0 };
    P.face = dx; audio.play('dash'); P.stats.dashes++;
    burst(P.x, P.y, 0x7ffcff, 10, 4, 0.25, 0.3);
  }
  if (cmd.phoenix && P.phoenixCd <= 0 && P.dashT <= 0) {
    if (P.hp >= P.maxHp * 0.5 || P.cheat) {
      P.phoenixT = PHYS.phoenixTime; P.phoenixCd = 1.4; P.invT = Math.max(P.invT, PHYS.phoenixTime + 0.15); P.phoenixHit.clear();
      if (!P.cheat) P.hp = Math.max(1, P.hp - 8);
      const dx = Math.abs(cmd.mx) > 0.3 ? sign(cmd.mx) : P.face; P.face = dx;
      P.dashDir = { x: dx * Math.cos(Math.abs(cmd.my) > 0.5 ? 0.6 : 0), y: Math.abs(cmd.my) > 0.5 ? sign(cmd.my) * 0.56 : 0 };
      if (P.onCeil && P.dashDir.y < 0) P.dashDir.y = 0;
      audio.play('phoenix'); screenShake(0.3); flashLight(P.x, P.y, 0xff7a1a, 60, 0.5, 12); P.stats.phoenix++;
    } else { audio.play('back'); showToast('PHOENIX FORCE needs 50% HP'); P.phoenixCd = 0.3; }
  }
  if (cmd.counter && P.counterCd <= 0) { P.counterT = 0.34; P.counterCd = 0.9; audio.play('counter'); }
  // ---- movement ----
  let desX, desY;
  if (P.dashT > 0 || P.phoenixT > 0) {

    P.vx = P.dashDir.x * sp; P.vy = P.dashDir.y * sp;
    if (P.dashT > 0) { P.dashT -= dt; for (let i = 0; i < 2; i++) spawnParticle({ x: P.x + rand(-0.3, 0.3), y: P.y + rand(-0.8, 0.8), size: 0.3, life: 0.25, color: 0x7ffcff, color1: 0x2040ff }); if (P.dashT <= 0) { P.vx *= 0.3; P.vy = 0; } }

      P.phoenixT -= dt;
      for (let i = 0; i < 4; i++) spawnParticle({ x: P.x + rand(-0.8, 0.8), y: P.y + rand(-0.9, 0.9), vx: -P.dashDir.x * rand(2, 8), vy: rand(-2, 3), size: rand(0.3, 0.6), life: 0.45, color: 0xffe080, color1: 0xff2000 });

    if (!P.aiming && Math.abs(cmd.mx) > 0.2) P.face = sign(cmd.mx);

        if (Math.random() < 0.15) audio.play('hover');
      } else P.hovering = false;

  }

  const mv = P.ctrl.computedMovement();
  const grounded = P.ctrl.computedGrounded();

  const againstG = -gdir; // +1 normal (up), -1 ceiling-walk (down)
  if (desY * againstG > 0.001 && mv.y * againstG < desY * againstG * 0.5) {

      burst(P.x, P.y + 0.9, 0xffffff, 6, 3, 0.15, 0.2);
    } else P.vy = 0;
  }
  if (Math.abs(desX) > 0.001 && Math.abs(mv.x) < Math.abs(desX) * 0.3) P.vx = 0;
  P.x += mv.x; P.y += mv.y;
  P.body.setNextKinematicTranslation({ x: P.x, y: P.y });
  const wasG = P.onGround; P.onGround = grounded;
  if (P.onCeil && !grounded && P.dashT <= 0 && P.phoenixT <= 0) { // walked off the ceiling edge
    P.ceilGrace = (P.ceilGrace || 0) + dt;
    if (P.ceilGrace > 0.08) { P.onCeil = false; P.ctrl.setUp({ x: 0, y: 1 }); P.vy = -1; }
  } else P.ceilGrace = 0;
  if (grounded) {
    P.hoverT = PHYS.hoverTime; if (!P.onCeil) { if (P.vy < 0) P.vy = 0; } else if (P.vy > 0) P.vy = 0;
    if (!wasG) { audio.play('land'); P.landT = 0.15; burst(P.x, P.y + gdir * HALF_H, 0xd0c8e0, 5, 2.5, 0.18, 0.25); }
    if (!P.onCeil && !hazardAt(P.x, P.y - 1.2, 0.3) && !hazardAt(P.x + 1.2, P.y - 1.2) && !hazardAt(P.x - 1.2, P.y - 1.2)) { P.lastSafe.x = P.x; P.lastSafe.y = P.y; }
  }
  // hazards (acid): hurt and return to safe ground
  if (hazardAt(P.x, P.y - HALF_H + 0.1, 0.2) && P.dashT <= 0) {
    hurtPlayer(20, true);
    if (P.alive) { P.x = P.lastSafe.x; P.y = P.lastSafe.y + 0.3; P.vx = 0; P.vy = 0; P.onCeil = false; P.ctrl.setUp({ x: 0, y: 1 }); P.body.setNextKinematicTranslation({ x: P.x, y: P.y }); burst(P.x, P.y, 0x8aff3a, 12, 5); }
  }

    const active = w === wid && P.firing;
    if (!active) P.energy[w] = Math.min(100, P.energy[w] + dt * (P.weak[w] ? 9 : 6));

function muzzlePos() {
  const ox = P.aimX * 1.05, oy = P.aimY * 1.05 + (P.onCeil ? -0.15 : 0.15);

function fireWeapon(wid) {

  }

  P.fireCd = W.rate;
  const px = -ay, py = ax; // perpendicular

const ui = { stack: [], repeatT: 0, lastDir: 0, hudCache: {} };

/** A menu: { title, sub, items:[{label, type:'action'|'choice'|'slider'|'toggle', ...}], onBack, html? } */
function openMenu(m) { ui.stack.push(m); m.sel = m.sel || firstEnabled(m); renderMenu(); }
function closeMenu() { const m = ui.stack.pop(); if (m && m.onClose) m.onClose(); renderMenu(); }
function closeAllMenus() { ui.stack.length = 0; renderMenu(); }
function topMenu() { return ui.stack[ui.stack.length - 1]; }
function firstEnabled(m) { const i = (m.items || []).findIndex((it) => !it.disabled); return i < 0 ? 0 : i; }
function itemValue(it) {
  if (it.type === 'slider') return `<span class="arr">◀</span>${'■'.repeat(Math.round(it.get() * 10))}${'□'.repeat(10 - Math.round(it.get() * 10))}<span class="arr">▶</span>`;
  if (it.type === 'toggle') return `<span class="arr">◀</span>${it.get() ? 'ON' : 'OFF'}<span class="arr">▶</span>`;
  if (it.type === 'choice') return `<span class="arr">◀</span>${it.label2 ? it.label2(it.get()) : it.get()}<span class="arr">▶</span>`;
  return '';
}
function renderMenu() {
  const el = $('menu'); const m = topMenu();
  if (!m) { el.classList.add('hidden'); el.innerHTML = ''; return; }
  el.classList.remove('hidden'); el.classList.toggle('dim', m.dim !== false);
  if (m.render) { el.innerHTML = m.render(); bindMenuMouse(m); return; }
  const items = m.items.map((it, i) => `<div class="mitem ${i === m.sel ? 'sel' : ''} ${it.disabled ? 'dis' : ''}" data-i="${i}"><span>${it.label}</span><span class="val">${itemValue(it)}</span></div>`).join('');
  const help = m.help !== false ? `<div class="mhelp"><span>${glyph('confirm')} Select</span>${m.items.some((i) => i.type && i.type !== 'action') ? `<span>◀ ▶ Change</span>` : ''}${m.onBack !== null ? `<span>${glyph('back')} Back</span>` : ''}</div>` : '';
  el.innerHTML = `<div class="mpanel" style="${m.style || ''}"><div class="mtitle">${m.title || ''}</div>${m.sub ? `<div class="msub">${m.sub}</div>` : ''}${items}${help}</div>`;
  bindMenuMouse(m);
}
function bindMenuMouse(m) {
  $('menu').querySelectorAll('[data-i]').forEach((d) => {
    const i = +d.dataset.i;
    d.onmouseenter = () => { if (m.sel !== i && !(m.items && m.items[i] && m.items[i].disabled)) { m.sel = i; audio.play('move'); renderMenu(); } };
    d.onclick = (ev) => { m.sel = i; if (m.onClickItem) m.onClickItem(i); else { const it = m.items[i]; if (it.type && it.type !== 'action') changeItem(it, ev.offsetX < d.clientWidth / 2 ? -1 : 1); else activateItem(m, it); } renderMenu(); };
  });
}
function activateItem(m, it) { if (!it || it.disabled) return; audio.play('ok'); if (it.type && it.type !== 'action') changeItem(it, 1); else if (it.action) it.action(); }
function changeItem(it, d) {
  if (it.type === 'slider') it.set(clamp(Math.round(it.get() * 10 + d) / 10, 0, 1));
  else if (it.type === 'toggle') it.set(!it.get());
  else if (it.type === 'choice') { const o = it.options; const i = o.indexOf(it.get()); it.set(o[(i + d + o.length) % o.length]); }
  audio.play('move'); if (it.after) it.after();
}
function menuInput(dt) {
  const m = topMenu(); if (!m) return false;
  // directional repeat
  const dir = input.held('up') ? -1 : input.held('down') ? 1 : 0; const hdir = input.held('left') ? -1 : input.held('right') ? 1 : 0;
  const key = dir * 10 + hdir;
  let step = 0;
  if (key !== ui.lastDir) { ui.lastDir = key; ui.repeatT = 0.4; step = 1; } else if (key !== 0) { ui.repeatT -= dt; if (ui.repeatT <= 0) { ui.repeatT = 0.11; step = 1; } }
  if (m.onInput) { m.onInput(step ? dir : 0, step ? hdir : 0); return true; }
  if (step && dir) {
    let s = m.sel; for (let k = 0; k < m.items.length; k++) { s = (s + dir + m.items.length) % m.items.length; if (!m.items[s].disabled) break; }
    if (s !== m.sel) { m.sel = s; audio.play('move'); renderMenu(); }
  }
  if (step && hdir) { const it = m.items[m.sel]; if (it && it.type && it.type !== 'action') { changeItem(it, hdir); renderMenu(); } }
  if (input.pressed('confirm')) { activateItem(m, m.items[m.sel]); renderMenu(); }
  else if ((input.pressed('back') || (m.pauseCloses && input.pressed('pause'))) && m.onBack !== null) { audio.play('back'); if (m.onBack) m.onBack(); else closeMenu(); }
  return true;
}

  if (players.length > 1 && !game.arena && game.mp !== 'race') for (const pl of players) if (pl !== lead && pl.alive && lead.alive && lead.x - pl.x > 20) {
    setPlayer(pl); P.x = lead.lastSafe.x - 1.2; P.y = lead.lastSafe.y; P.vx = P.vy = 0; P.onCeil = false; P.ctrl.setUp({ x: 0, y: 1 });
    P.body.setNextKinematicTranslation({ x: P.x, y: P.y }); burst(P.x, P.y, 0x7ffcff, 14, 5); setPlayer(players[0]);
  }
  // spawns ahead of the player
  st.spawns.forEach((sp, i) => {
    if (game.spawned.has(i) || lead.x < sp.x - 17 || game.arena) return;
    game.spawned.add(i);
    makeEnemy(sp.type, sp.x, sp.y ?? 0, { ceil: !!sp.ceil });
  });
  // tutorial hints
  if (settings.hints && !game.attract) {
    let hi = -1; st.hints.forEach((h, i) => { if (lead.x >= h[0] && lead.x < h[0] + 8) hi = i; });
    if (hi !== game.hintIdx) { game.hintIdx = hi; $('hint').classList.toggle('hidden', hi < 0); }
    if (hi >= 0) setText('hint', glyphText(st.hints[hi][1]));
  } else $('hint').classList.add('hidden');
  // checkpoints
  for (let i = game.cpIdx + 1; i < st.checkpoints.length; i++) if (lead.x > st.checkpoints[i][0] && lead.alive) { game.cpIdx = i; level.checkpoint = { x: st.checkpoints[i][0], y: st.checkpoints[i][1] }; if (!game.attract) { showToast('CHECKPOINT'); audio.play('checkpoint'); } }
  // arenas
  if (game.mp === 'race') {
    // race: the first boss gate is the finish line
    const gate = st.arenas[0].x0;
    if (!game.raceWinner && lead.alive && lead.x >= gate) {
      game.raceWinner = lead; showBanner('RACE', `PLAYER ${lead.id + 1} WINS!`, 'First to the boss gate', 3.5);
      audio.setTrack('clear'); audio.speak('winner winner!', 240); game.stageClearT = 3.6;
    }
  } else if (!game.arena && lead.alive) st.arenas.forEach((a, i) => {
    if (game.arenaCleared.has(i) || lead.x <= a.x0 + 2.5 || lead.x >= a.x1) return;
    startArena(a, i);
    // bring every partner inside before the doors close
    allPlayers((pl) => { if (pl.alive && pl.x < a.x0 + 1.5) { P.x = a.x0 + 2.5; P.y = 1; P.vx = P.vy = 0; P.onCeil = false; P.ctrl.setUp({ x: 0, y: 1 }); P.body.setNextKinematicTranslation({ x: P.x, y: P.y }); } });
  });
  arenaIntroUpdate(dt);
  updateEnemies(dt); updateShots(dt); updateBeams(dt); updatePickups(dt); updateDoors(dt);
  world.step(); updateDynamics(dt);
  // acid bubbles
  for (const h of level.hazards) if (Math.random() < dt * 8) { const x = rand(h.x0, h.x1); if (Math.abs(x - gfx.camX) < 25) spawnParticle({ x, y: h.y1, vy: rand(1, 3), size: rand(0.15, 0.35), life: 0.6, color: 0xc8ff6a, color1: 0x2a8a10 }); }
  if (game.stageClearT > 0) { game.stageClearT -= dt; if (game.stageClearT <= 0) nextStage(); }
  if (game.attract) { game.attractT += dt; if (game.attractT > 95) stopAttract(); }
  updateCamera(dt);
}
function updateCamera(dt) {
  const st = level.stage; let tx, ty, tz = 16;
  if (game.arena) {
    const a = game.arena; tx = (a.x0 + a.x1) / 2; ty = a.ceil / 2 + 0.6;
    const halfW = (a.x1 - a.x0) / 2 + 1.5; tz = Math.max(16, halfW / (Math.tan(THREE.MathUtils.degToRad(21)) * camera.aspect));
  } else {
    tx = P.x + P.face * 2.5 + P.vx * 0.15; ty = clamp(P.y * 0.55 + 3.2, 3.2, Math.max(3.2, st.ceilY - 2.5));
    const live = players.filter((p) => p.alive);
    if (live.length > 1) { // co-op: frame both players and pull back as they spread out
      const xs = live.map((p) => p.x), span = Math.max(...xs) - Math.min(...xs);
      tx = (Math.max(...xs) + Math.min(...xs)) / 2 + 1.5; ty = clamp(live.reduce((a, p) => a + p.y, 0) / live.length * 0.55 + 3.2, 3.2, Math.max(3.2, st.ceilY - 2.5));
      tz = Math.max(16, (span / 2 + 6) / (Math.tan(THREE.MathUtils.degToRad(21)) * camera.aspect));
    }
    if (st.ceilY < 6) ty = st.ceilY / 2 + 0.8;
    // keep the camera inside the stage bounds
    const maxX = Math.min(...st.arenas.filter((a, i) => !game.arenaCleared.has(i) && a.x0 > leadPlayer().x - 3).map((a) => a.x0 + 2), 9999);
    tx = clamp(tx, 4, maxX === 9999 ? tx : Math.max(4, maxX));
    if (!players.some((p) => p.alive)) tx = gfx.camX;
  }
  const k = Math.min(1, dt * 4);
  gfx.camX = lerp(gfx.camX, tx, k); gfx.camY = lerp(gfx.camY, ty, k); gfx.camZ = lerp(gfx.camZ, tz, Math.min(1, dt * 2));
  updateDecor();
}

// ---------- ai-hub session ----------
function sessionLabel() {
  const st = level.stage; if (!st) return 'Starting';
  if (game.boss) return `S${st.id} · ${game.boss.name}`.slice(0, 24);
  return `Stage ${st.id} · ${Math.max(0, Math.round(P.x))}m`;
}
function sessionProgress() {
  if (!game.session || game.resultSent) return;
  // further = higher: score dominates; bosses/stages are already worth big points
  AIHub.progress({ score: game.score, label: sessionLabel() });
}
function sessionFinish() {
  if (game.resultSent) return; game.resultSent = true;
  const s = P.stats; const awards = [];
  if (s.noHitBosses > 0) awards.push({ title: 'Untouchable', detail: `${s.noHitBosses} boss${s.noHitBosses > 1 ? 'es' : ''} without damage` });
  if (s.absorbed >= 20) awards.push({ title: 'Counter Force', detail: `${s.absorbed} bullets absorbed` });
  if (game.bossesDown >= 5) awards.push({ title: 'Silence Breaker', detail: 'Defeated XI-TYMPAN' });
  AIHub.result({ score: game.score, stats: { bosses: game.bossesDown, kills: s.kills, absorbed: s.absorbed, continues: s.deaths, stage: level.stage ? level.stage.id : 1 }, awards: awards.slice(0, 3) });
  $('hint').classList.add('hidden'); showBanner('RUN COMPLETE', String(game.score), 'Waiting for the other players…', 9999);
  game.state = 'sessionDone';
}
function bootSession() {
  AIHub.on('start', () => { audio.sessionStarted = true; audio.unlock(); audio.setTrack('stage'); });
  AIHub.on('time-up', () => { if (!game.resultSent) sessionFinish(); });
  AIHub.on('end', () => { game.ended = true; game.state = 'ended'; audio.stopAll(); closeAllMenus(); });
  AIHub.connect({ mode: 'parallel', seats: [1, 4] }).then((info) => {
    if (!info) { game.session = false; boot2(); return; }
    game.session = true;
    $('loading').classList.add('hidden');
    startRun(0, { loadout: ['BUSTER', 'FLAME', 'LANCER', 'HOMING'] });
    game.state = 'sessionWait';
    AIHub.ready();
  });
}

// ---------- main loop ----------
let lastT = performance.now(), acc = 0;
function frame() {
  const now = performance.now(); let dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const playing = game.state === 'play' || game.state === 'sessionWait';
  pollInput(dt, playing && !topMenu());
  if (input.anyPressed) audio.unlock();
  updateOverlays(dt);
  switch (game.state) {
    case 'title':
      menuInput(dt);
      gfx.camX = 20 + Math.sin(gfx.time * 0.15) * 8; gfx.camY = 4.5; updateDecor();
      if (input.idle > 10 && ui.stack.length === 1) startAttract();
      break;
    case 'story': updateStory(dt); break;
    case 'results': case 'menu': menuInput(dt); break;
    case 'touch': menuInput(dt); if (input.anyPressed || navigator.getGamepads && [...navigator.getGamepads()].some((p) => p && p.connected)) { $('touch').classList.add('hidden'); if (!topMenu()) toTitle(); } break;
    case 'sessionWait': {
      const t = AIHub.time();
      if (t >= 0) { game.state = 'play'; hideBanner(); }
      else if (t > -Infinity) showBanner('GET READY', String(Math.ceil(-t / 1000)), 'Most points wins', 0.2);
      updateCamera(dt); if (P.rig) animatePlayer(dt, {}, WEAPONS[P.weapons[P.wi]]);
      break;
    }
    case 'play': {
      if (game.attract) { if (input.anyPressed || input.idle === 0) { stopAttract(); break; } }
      if (topMenu()) { menuInput(dt); if (!topMenu()) game.menuOpen = false; break; }
      if ((input.pressed('pause') || (coop.on && input2.pressed('pause'))) && !game.attract && !game.ended) { openPause(); break; }
      acc += dt; let first = true; let n = 0;
      const cmd = playerCommand(), cmd2 = coop.on ? player2Command() : null;
      const noEdges = { jump: false, dash: false, counter: false, phoenix: false, prev: false, next: false, aimPressed: false };
      while (acc >= 1 / 60 && n < 4) {
        stepPlay(1 / 60, first ? cmd : Object.assign({}, cmd, noEdges), cmd2 && (first ? cmd2 : Object.assign({}, cmd2, noEdges)));
        first = false; acc -= 1 / 60; n++;
        if (game.state !== 'play') break;
      }
      if (acc > 0.1) acc = 0;
      if (game.state === 'play' || game.state === 'sessionDone') updateHud();
      break;
    }
    case 'sessionDone': case 'ended': updateCamera(dt); break;
  }
  if (game.session && game.state === 'play' && AIHub.time() >= 0) sessionProgress();
  if (game.state !== 'play') input.mouse.moved = false;
  updateParticles(dt);
  renderFrame(dt);
}

// ---------- boot ----------
function isTouchOnly() {
  return navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
}
async function boot() {
  try {
    await initRenderer();
    await RAPIER.init();
  } catch (err) {
    $('loading').classList.add('hidden'); $('err').classList.remove('hidden'); $('errmsg').textContent = String(err && err.message || err);
    if (SESSION) AIHub.fail('WebGPU is required: ' + String(err && err.message || err));
    return;
  }
  initShots();
  buildStage(0);
  AIHub.probe(() => ({
    scene: game.state === 'title' || game.attract ? 'title' : game.state === 'play' ? 'play' : game.state === 'sessionWait' ? 'ready' : game.state === 'results' || game.state === 'sessionDone' || game.state === 'ended' ? 'over' : 'menu',
    menu: !!game.menuOpen, world: +game.worldT.toFixed(3),
    input: { x: input.lx, y: input.ly, fire: input.held('fire'), jump: input.held('jump') },
  }));
  renderer.setAnimationLoop(frame);
  if (SESSION) bootSession(); else boot2();
}
function boot2() {
  $('loading').classList.add('hidden');
  if (isTouchOnly()) {
    game.state = 'touch'; $('touch').classList.remove('hidden');
    $('touchSettings').onclick = () => { const m = settingsMenu(); m.onClose = () => $('touch').classList.remove('hidden'); $('touch').classList.add('hidden'); openMenu(m); };
    return;
  }
  toTitle();
}
window.__ase = { game, P, players, coop, toTitle, allPlayers, mpFinish, eshot: (o) => addEShot(o), level, enemies, STAGES, settings, startRun, closeAllMenus, killEnemy, scene: () => scene, teleport: (x, y = 1) => { P.x = x; P.y = y; P.body.setNextKinematicTranslation({ x, y }); } };
boot();

</script>
