<!-- Source Information
Date: 2026-10-29 15:58 (America/Vancouver).
Source: BattleBlock Theater. Original spiritual successor; no source assets or dialogue.
Title: DabbleBlock Drama; candidate 17 of 50, selected with Python secrets.randbelow.
Tech: Three.js r180 / 0.180.0, WebGPU only (no WebGL fallback), Rapier 3D compat 0.19.3, Gamepad API, Web Audio API, AI Hub Session Protocol v1 (client 1.3.0).
Art Direction: original procedural cel-shaded paper theater with ink outlines and layered cardboard scenery.
Animation: procedural puppet rigs, squash/stretch, movement-driven limbs, stage machinery and particles.
Audio: original synthesized vaudeville waltz and procedural sound effects; optional browser speech synthesis, voice unknown.
Online: 1-4 player host-authoritative co-op through the supplied AI Hub protocol; solo outside sessions.
Testing: efficient functional Playwright checks, simulated standard gamepad, official hub harness on an adverse network, phone/tablet/ultrawide screenshots and WebKit requirement/settings checks. Real iOS Safari unavailable.
Environment: Codex CLI (headless); Linux; browser unknown. Test engines: Chromium and Linux WebKit.
Model: OpenAI, gpt-6.1-sol, reasoning effort high.
Usage: estimated API cost unknown; total tokens and breakdown unknown; session time approximately 20 minutes.

Testing Feedback
Issues caught: 6 product issues, all fixed; 1 was game-breaking. These concerned the toon texture format, texture disposal across stage changes, title contrast, the preview actor blinking out, settings on unsupported browsers, and undersized exit lettering. Most helpful: the official AI Hub harness with latency, jitter, packet loss, disconnects, a playerless host, and simulated DualSense controls. Least helpful: the syntax-only check, which could not detect rendering defects. Functional checks cover movement, double jumps, death/respawn, pickups, exits, portals, springs, the boss, settings, axis inversion, controller-only startup and attract interruption. Six phone/tablet/ultrawide browser configurations had no horizontal overflow. Linux WebKit verified the WebGPU requirement message and settings, not gameplay. Real iOS Safari and physical DualSense hardware were unavailable.

Engine Feedback
Liked most: the Three.js scene graph made layered scenery and procedural puppets easy to compose; Rapier handled contacts and props. Stuck or guessed wrong: I initially used an incompatible gradient format and disposed stage textures too early; browser tests exposed both. Most important custom system: responsive platformer movement and the host-authoritative co-op state model. Hardest engine task: managing GPU resources and new scene materials across level changes. Remove or overhaul: implicit renderer backend fallback, in favor of a clear capability contract. One change: a first-class cel-shaded outline material that works directly in WebGPU.

Prompt Feedback
Liked most: the precise stack, single-file delivery, and controller-first philosophy. Confusing: the expected demo duration and exact source mechanics were unspecified. Hardest: combining a complete four-act campaign with immediate local control and shared co-op progression. One additional test: a real four-player DualSense playthrough over a variable-latency connection.

<script>/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {

  }
  var search = String(root.location && root.location.search);

  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {

        return i >= 0 && i < keys.length ? keys[i] : null;

        if (typeof k === 'symbol' || k in t) return t[k];

      },
      has: function (t, k) {
        return k in data || k in t;
      },

      },
      getOwnPropertyDescriptor: function (t, k) {

      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.

        warn('could not give the game a fresh ' + stores[s]);
      }

  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {

    hub.seeded = true;
  }

  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.

  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };

  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);

      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);

    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }

    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };

    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

    var h = 2166136261;

      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.

      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {

      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;

}else if(kind==='help'){inner=`<div class="eyebrow">THE SURVIVAL PROGRAM</div><h2>A little stage direction.</h2><div class="help-grid"><div class="help-card"><b>× / SPACE · Two jumps</b><p>Jump again in midair. Hold to rise higher; release for a short hop. Jump against a wall to kick away.</p></div><div class="help-card"><b>□ / X · Slap some sense in</b><p>Stun an usher, break orange props, or bounce on an enemy’s head. Walk into a crate to push it.</p></div><div class="help-card"><b>R2 / C · A paper bomb</b><p>Unlimited, briefly cooled down. Toss toward props, ushers, or an exposed moth heart. Your own bombs are harmless to you.</p></div><div class="help-card"><b>○ / Z · Dash through trouble</b><p>A short invincible burst. Also defeats ushers on contact. Refills automatically, even in midair.</p></div><div class="help-card"><b>Read the stage</b><p>Yellow springs launch you. Fans lift you. Portals come in pairs. Red lasers blink; orange spikes do not. Pale cracked blocks crumble, then return.</p></div><div class="help-card"><b>Bring home the encore</b><p>Collect the gem toll and find the EXIT. Extra gems and secret yarn boost your score. Flags save your place. Unlimited retries. Four acts, one very large moth.</p></div></div><p>Options / Esc opens settings. Both stick axes can be inverted. No touch controls.</p>${button('I accept these working conditions','close','primary')}`;
}else if(kind==='acts'){inner=`<div class="eyebrow">TONIGHT’S PROGRAM</div><h2>Choose your misfortune.</h2><div class="act-list">${ACTS.map((a,i)=>button(`<span class="num">0${i+1}</span><span><b>${a.name}</b><small>${a.subtitle}${best[i]?` · Best ${best[i]}`:''}</small></span><span class="arrow">↗</span>`,`act:${i}`,'act-button')).join('')}</div><p>Every act is open for rehearsal. Start with Act 01 for the full story.</p>`;
}else if(kind==='online'){inner=`<div class="eyebrow">MISERY LOVES A CAST</div><h2>Better with witnesses.</h2><p>Play the four-act campaign with up to four performers through <b>AI Hub</b>. Everyone moves immediately; gems, props, enemies and the finale are shared.</p><p class="online-note">Launch this HTML from an AI Hub session with 1–4 seats. The hub handles invitations, player names, networking and the shared start. This game joins automatically.</p><div class="help-grid"><div class="help-card"><b>One stage. One team.</b><p>Any performer can collect the toll or open the next act. Everyone shares the encore score.</p></div><div class="help-card"><b>No one left backstage.</b><p>Checkpoints benefit the whole cast. A disconnected performer can leave; the remaining show continues.</p></div></div><p>Requires WebGPU on every participating browser. Play solo directly from this file.</p>${button('Back to the bill','close','primary')}`;
}else if(kind==='about'||kind.startsWith('about:')){let page=kind.split(':')[1]||'source';inner=`<div class="eyebrow">THE PROGRAM NOTES</div><h2>Credits & curious details.</h2><div class="menu-row" style="margin-bottom:22px">${['source','testing','engine','prompt'].map(k=>button(k.toUpperCase(),`about:${k}`)).join('')}</div>`;if(page==='source'){inner+=`<p>An original production by <b>The Odd Sock Players</b>.<br>Inspired by the slapstick platforming and theatrical mischief of BattleBlock Theater. No source-game assets, music or dialogue are used.</p><div class="credits-section">${Object.entries(META).map(([k,v])=>`<p><b>${k[0].toUpperCase()+k.slice(1)}:</b> ${v}</p>`).join('')}</div><p>Title selected by a cryptographic random draw from 50 original candidates: #17, DabbleBlock Drama. Typeface: Barlow Condensed and DM Sans, Google Fonts. Libraries: Three.js (MIT), Rapier (Apache-2.0), AI Hub client (license unknown).</p>`}if(page==='testing')inner+=`<div class="credits-section"><h3>Testing feedback</h3><p>${FEEDBACK.testing}</p></div>`;if(page==='engine')inner+=`<div class="credits-section"><h3>Engine feedback</h3><p>${FEEDBACK.engine}</p></div>`;if(page==='prompt')inner+=`<div class="credits-section"><h3>Prompt feedback</h3><p>${FEEDBACK.prompt}</p></div>`;
}return panel(inner,kind==='help'||kind.startsWith('about'))}
function intermissionHTML(){let a=ACTS[act];return `<div class="scrim"><section class="panel act-card"><div class="eyebrow">A SURPRISINGLY SUCCESSFUL DISASTER</div><h2>Act ${act+1}.<br>In the bag.</h2><p>${['The critics called you “technically alive.” High praise.','You have escaped the prop department. The props are appealing.','Occupational safety has been informed. They laughed.'][act]}</p><div class="stat-grid"><div><b>${levelGems}</b><small>GEMS LIBERATED</small></div><div><b>${levelYarn?'1 / 1':'0 / 1'}</b><small>SECRET SPOOL</small></div><div><b>${fmtTime(stageTimer)}</b><small>STAGE TIME</small></div></div><p>UP NEXT · ${ACTS[act+1].name}</p>${button(`${glyph('×')} Next act <span class="arrow">↗</span>`,'next','primary')}${button('Back to the bill','title','menu-btn return-btn')}</section></div>`}
function completeHTML(){return `<div class="scrim"><section class="panel act-card"><div class="eyebrow">${act===3&&boss&&!boss.alive?'THE AUDIENCE DEMANDS AN ENCORE':'THE CURTAIN HAS FALLEN'}</div><h2>${act===3&&boss&&!boss.alive?'Unreasonably<br>triumphant.':'What a show.'}</h2><p>${act===3&&boss&&!boss.alive?'You toppled the impresario, freed the cast, and irreparably damaged the deposit. Your pay remains unchanged.':'The cast gave it everything. The theater will be sending an itemized bill.'}</p><div class="stat-grid"><div><b>${score}</b><small>ENCORE SCORE</small></div><div><b>${totalGems}</b><small>GEMS LIBERATED</small></div><div><b>${deaths}</b><small>REHEARSAL DEATHS</small></div></div><p>${yarns} secret spool${yarns===1?'':'s'} found · ${fmtTime(gameTime)} on the clock</p>${!net?button(`${glyph('×')} One more performance`,'start','primary')+button('Program & credits','about','menu-btn return-btn')+button('Back to the bill','title','menu-btn return-btn'):'<p>Waiting for the hub’s next production.</p>'}</section></div>`}
function handleAction(a){sfx('ui');idle=0;if(a==='reload'){location.reload();return}if(a==='start'){saved.hasRun=true;startGame(0)}else if(a==='continue')startGame(unlocked);else if(a==='next')nextAct();else if(a==='close')closeMenu();else if(a==='title')toTitle();else if(a.startsWith('act:'))startGame(+a.split(':')[1]);else if(a.startsWith('setting:')){let key=a.split(':')[1];if(key==='music'||key==='sfx'){let options=[0,.2,.35,.5,.65,.8,1],i=options.findIndex(v=>Math.abs(v-settings[key])<.01);settings[key]=options[(i+1)%options.length]}else if(key==='fullscreen'){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch{}}else settings[key]=!settings[key];document.body.classList.toggle('low-motion',!settings.motion);save();renderUI()}else openMenu(a)}
let tutorialSeen=new Set();
const TIPS=[[[4,'Space / Cross: jump twice. Hold for height. Release for a polite little hop.'],[19,'Walk into the crate to push it. Stand on the yellow plate to lift the gate.'],[35,'X / Square slaps. C / R2 throws a harmless-to-you paper bomb. Orange props are deeply breakable.']],[[4,'Yellow spring: complimentary altitude. You can still jump again in the air.'],[17,'The teal and coral rings are linked portals. Enter either for an unscheduled relocation.'],[40,'The fan gives you lift. The laser blinks off. Please combine those two facts.']],[[4,'C / R2 throws a paper bomb. Z / Circle dashes — briefly invincible, permanently dramatic.'],[10,'Ride the yellow platforms. Their route is predictable. Their motives are not.'],[33,'Cracked blocks collapse underfoot, then return. Keep your exit strategy moving.']],[[23,'The impresario opens its heart between volleys. Bombs and slaps both count as constructive criticism.'],[31,'Closed heart: wait or dodge. Glowing yellow heart: jump and throw. The yellow springs can help.']]];
function contextualTips(){if(mode!=='play'||menu||!player||narrationTime>0)return;let x=player.body.translation().x;for(let [at,text]of TIPS[act]){let key=act+':'+at;if(x>=at&&!tutorialSeen.has(key)){tutorialSeen.add(key);say(text,6);break}}}
function resize(){if(!renderer)return;const aspect=innerWidth/innerHeight;let height=aspect<.8?22:aspect<1.25?19:17.5;camera.left=-height*aspect/2;camera.right=height*aspect/2;camera.top=height/2;camera.bottom=-height/2;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2))}
function fail(error){console.error(error);startupError=error;loaded=true;mode='unsupported';menu=null;const loading=$('loading');if(loading)loading.remove();if(renderer)renderer.setAnimationLoop(null);renderUI();AIHub.fail(error.message||String(error));let prev=performance.now();function fallbackFrame(t){if(mode!=='unsupported')return;readInput(Math.min(.06,(t-prev)/1000));prev=t;pressed.clear();requestAnimationFrame(fallbackFrame)}requestAnimationFrame(fallbackFrame)}

async function init(){try{if(!navigator.gpu)throw new Error('WebGPU is unavailable in this browser.');const [adapter]=await Promise.all([navigator.gpu.requestAdapter({powerPreference:'high-performance'}),RAPIER.init()]);if(!adapter)throw new Error('No WebGPU adapter is available.');const device=await adapter.requestDevice();device.lost.then(info=>{if(info.reason!=='destroyed')fail(new Error('The WebGPU device was lost. Reload to raise the curtain again.'))});renderer=new THREE.WebGPURenderer({canvas:$('game'),device,antialias:true,alpha:false});await renderer.init();if(!renderer.backend.isWebGPUBackend)throw new Error('This production requires the WebGPU backend.');renderer.setClearColor(0x153f3c);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;
scene=new THREE.Scene();camera=new THREE.OrthographicCamera(-15,15,9,-9,.1,150);gradient=new THREE.DataTexture(new Uint8Array([80,150,255]),3,1,THREE.RedFormat);gradient.minFilter=THREE.NearestFilter;gradient.magFilter=THREE.NearestFilter;gradient.needsUpdate=true;
scene.add(new THREE.HemisphereLight(0xfff5d9,0x385a54,2.3));let key=new THREE.DirectionalLight(0xffedce,3.2);key.position.set(-8,18,18);scene.add(key);let fill=new THREE.DirectionalLight(0x94dbc9,.8);fill.position.set(20,4,-6);scene.add(fill);buildCurtains();loaded=true;buildLevel(0,true);resize();window.addEventListener('resize',resize);$('load-status').textContent='Teaching the moth to accept criticism…';await renderer.compileAsync(scene,camera);await renderer.renderAsync(scene,camera);$('loading').remove();await connectHub();renderUI();last=performance.now();renderer.setAnimationLoop(frame);
window.__game={get state(){return{mode,act,menu,score,deaths,levelGems,world:simTime,stageTimer,player:player?{...player.body.translation(),health:player.health}:null,boss:boss?{x:boss.x,y:boss.y,hp:boss.hp,vulnerable:boss.vulnerable}:null,backend:renderer.backend.isWebGPUBackend?'WebGPU':'other'}},acts:ACTS,settings,start:startGame,teleport(x,y){player.body.setTranslation({x,y,z:0},true);player.body.setLinvel({x:0,y:0,z:0},true);player.inv=0},action(k){applyAction(player,k)},exit:tryExit,attract(){mode='attract';menu=null;score=0;attractActT=0;buildLevel(0);say(ACTS[0].intro,6)},setIdle(v){idle=v}};
}catch(e){fail(e)}}
let uiTick=0;
function frame(now){let dt=Math.min(.06,Math.max(0,(now-last)/1000));last=now;readInput(dt);if(ended){pressed.clear();return}if(!net&&mode==='title'&&!menu){idle+=dt;let f=$('idle-fill');if(f)f.style.width=Math.min(100,idle*10)+'%';if(idle>=10){mode='attract';menu=null;score=0;deaths=0;attractT=0;attractActT=0;tutorialSeen.clear();buildLevel(0);say(ACTS[0].intro,6)}}
let run=activePlay()&&(!menu||!!net)&&(net?AIHub.time()>=0:true);if(run){dtAccum+=dt;let steps=0;while(dtAccum>=1/60&&steps<4){updateWorld(1/60);dtAccum-=1/60;steps++}}else{dtAccum=0;if(mode==='title')simTime+=dt}
if(!menu||net){if(narrationTime>0){narrationTime-=dt;if(narrationTime<=0)renderUI()}if(toastTime>0){toastTime-=dt;if(toastTime<=0)renderUI()}}contextualTips();updateVisuals(dt);networkTick(dt);musicTick();uiTick+=dt;if(uiTick>.25){uiTick=0;let g=$('gem-value'),s=$('score-value'),hp=$('boss-hp');if(g)g.textContent=`${levelGems} / ${ACTS[act].goal}`;if(s)s.textContent=String(score).padStart(5,'0');if(hp&&boss){hp.style.width=boss.hp*10+'%';let label=hp.parentElement.parentElement.querySelector('span');if(label)label.textContent=boss.vulnerable?'HEART EXPOSED':'SHELL CLOSED'}}renderer.render(scene,camera);pressed.clear()}
init();
</script></body></html>
