<!DOCTYPE html>
<!--
LEAPING FLASH 2 — Kaboomie's Bottle Bonanza
An original spiritual successor to Jumping Flash! 2. Not affiliated with or endorsed by its makers.

SOURCE INFORMATION
- Date: 2026-10-29 04:34
- Source: Jumping Flash! 2
- Tech: Three.js r180 (WebGPURenderer, TSL, MeshToonNodeMaterial, toonOutlinePass, BloomNode; WebGPU only, no fallback), Rapier 0.19.3 (@dimforge/rapier3d-compat: kinematic character controller, kinematic platforms, dynamic crates and debris, ray casts), PeerJS 1.5.5 (Online Derby lobby only), Gamepad API, Web Audio API, Pointer Lock API, AI Hub Session Protocol v1 (session.js client 1.3.0). Plain ES modules from the jsDelivr CDN, no build framework; a small Node script bundles the source into this single file.
- Art Direction: stylized cel shading — 3-band toon ramps, screen-space ink outlines, soft bloom, pastel sky gradients, floating islands over a sea of clouds; every model is built from primitives in code.
- Animation: procedural code animation — run cycles, squash and stretch on jumps and landings, spring-simulated ears, spinning props, bobbing pickups; enemies and the boss are animated by their AI state.
- Audio: all generated in code with Web Audio — a procedural composer for 6 songs (bass, arpeggio, pad, lead, drums) from chord-progression data, synthesized sound effects, jingles, and Animalese-style gibberish voices (formant-filtered blips per letter, a different voice for each character).
- Online: AI Hub Session Protocol v1, race mode ("Sky Derby"): 1-4 players on one seeded course, state at 15 Hz, interpolated rivals, solid contact, stomp "hit" events decided by the victim, progress and result reporting, leave handling; computer rivals when playing solo. Outside the hub: Online Derby, the game's own lobby — host or join with a 4-letter room code (PeerJS 1.5.5 over WebRTC, public PeerJS matchmaking server, host relays, ping/pong clock sync), the same netcode through a second transport adapter. In a hub session only the hub network is used.
- Testing: headless Chrome through Playwright with SwiftShader WebGPU: boot smoke tests, scripted play checks through the probe, frame readback captures, an audio signal check, an emulated DualSense, a boss fight with real shots and stomps, a two-browser Online Derby run over the public PeerJS server, full AI playthroughs of 1-1 and 1-2 on real physics with teleporting off (cleared in 50 s and 63 s of simulated time), measured jump arcs (6.5 m single, 15.6 m triple), and the AI Hub harness (1-4 players, bad network, host leaving).
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort medium
- Usage: API cost unknown; tokens unknown (no usage meter is visible inside the session); session time about 1 hour 35 minutes

TESTING FEEDBACK
- How many issues did testing catch? 12: one-press-burns-all-three-jumps (edge inputs ran on every physics sub-step), quick key taps lost in menus, Sky Derby starting in the wrong state (frozen race, no pause), a stray recursive boot() that restarted the session round over and over, a double removal of the loading overlay, the title menu overflowing at 720p, the probe missing input on very slow frames, a Puff floating 1.2 m above its platform in 1-1, the pause flag carrying over into a newly started stage, a mesa Puff in 1-1 that needed a near-impossible jump, Spiky Tops able to juggle an invulnerable player forever, and trees spawning on key spots with trunks you could stand on inside the foliage.
- How many would be considered critical issues / game breaking? 6: the jump input bug, the frozen race, the recursive boot in AI Hub sessions, the pause carry-over, the near-unreachable mesa Puff and the Spiky Top juggle.
- What was the most helpful test you ran? Stepping the fixed 60 Hz simulation directly with the AI on a designer-placed route and no teleport. It is independent of render speed, and it found three level and gameplay bugs that scripted checks missed. The AI Hub harness was a close second: it found the recursive boot.
- What was the least helpful test you ran? Plain page screenshots. Headless SwiftShader WebGPU shows the canvas as blank white, so they looked like a rendering bug that wasn't there. Reading frames back from an offscreen render target fixed that.

ENGINE FEEDBACK
- What did you like most about the engine? The toonOutlinePass and MeshToonNodeMaterial together give a real cel-shaded look in two lines, and Rapier's KinematicCharacterController does the slopes, steps and snapping a platformer needs.
- Did you get stuck or guess wrong? Briefly. I took the blank headless captures for a renderer bug. I also had to check that the Rapier 0.19 ray hit field is timeOfImpact and that r180 still calls it PostProcessing (newer builds rename it RenderPipeline).
- What was the most important thing you had to build yourself? Carrying riders on moving and spinning platforms (matrix deltas applied to the character), plus the fixed-step loop that keeps button presses edge-triggered.
- What was the hardest part about using the engine? Verifying output. WebGPU-only rendering can't be screenshotted headlessly without a render-target readback, and post-processing has to be routed by hand to capture it.
- If you had to remove or overhaul one thing from engine, what would that be? The split between WebGL-era names and node-material names (PostProcessing/RenderPipeline, MeshToonMaterial/MeshToonNodeMaterial), which makes version-correct code guesswork.
- If you could change one thing about the engine, what would it be? A built-in, documented way to capture the final post-processed frame to pixels for automated tests.

PROMPT FEEDBACK
- What did you like most about this prompt? The clear "done" bar: a single file, no stubs, attract mode, invert toggles and the hub protocol. Plus room to choose the mechanics.
- What was confusing? "Follow the hub for multiplayer integration as well as for the game on its own." I read it as: the hub session protocol, with the game still fully playable alone (it also has a solo Sky Derby against computer rivals). Also, "Usage" asks for numbers the agent can't see.
- What was the hardest thing to do? Covering every Jumping Flash! 2 pillar (triple jump, look-down landing, stomps, 4 rescues per stage, a boss, a story) and also a networked race, in one session, while testing on a software GPU at about 3 FPS.
- If there was one test you could have run, what would that test be? A real-GPU, real-time playthrough with a physical DualSense, to tune jump feel and camera speeds at 60 FPS.

CREDITS
Design, code, art, music, sound and voices: generated by Claude (claude-opus-5-5) for this demo.
Libraries: three.js (MIT), Rapier by Dimforge (Apache-2.0), AI Hub session client (michaelcrosato/ai-hub).
Inspired by Jumping Flash! 2 (1996). All characters and names here are original.
-->

<script>
/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

const ABOUT_TEXT = "LEAPING FLASH 2 — Kaboomie's Bottle Bonanza\nAn original spiritual successor to Jumping Flash! 2. Not affiliated with or endorsed by its makers.\n\nSOURCE INFORMATION\n- Date: 2026-10-29 04:34\n- Source: Jumping Flash! 2\n- Tech: Three.js r180 (WebGPURenderer, TSL, MeshToonNodeMaterial, toonOutlinePass, BloomNode; WebGPU only, no fallback), Rapier 0.19.3 (@dimforge/rapier3d-compat: kinematic character controller, kinematic platforms, dynamic crates and debris, ray casts), PeerJS 1.5.5 (Online Derby lobby only), Gamepad API, Web Audio API, Pointer Lock API, AI Hub Session Protocol v1 (session.js client 1.3.0). Plain ES modules from the jsDelivr CDN, no build framework; a small Node script bundles the source into this single file.\n- Art Direction: stylized cel shading — 3-band toon ramps, screen-space ink outlines, soft bloom, pastel sky gradients, floating islands over a sea of clouds; every model is built from primitives in code.\n- Animation: procedural code animation — run cycles, squash and stretch on jumps and landings, spring-simulated ears, spinning props, bobbing pickups; enemies and the boss are animated by their AI state.\n- Audio: all generated in code with Web Audio — a procedural composer for 6 songs (bass, arpeggio, pad, lead, drums) from chord-progression data, synthesized sound effects, jingles, and Animalese-style gibberish voices (formant-filtered blips per letter, a different voice for each character).\n- Online: AI Hub Session Protocol v1, race mode (\"Sky Derby\"): 1-4 players on one seeded course, state at 15 Hz, interpolated rivals, solid contact, stomp \"hit\" events decided by the victim, progress and result reporting, leave handling; computer rivals when playing solo. Outside the hub: Online Derby, the game's own lobby — host or join with a 4-letter room code (PeerJS 1.5.5 over WebRTC, public PeerJS matchmaking server, host relays, ping/pong clock sync), the same netcode through a second transport adapter. In a hub session only the hub network is used.\n- Testing: headless Chrome through Playwright with SwiftShader WebGPU: boot smoke tests, scripted play checks through the probe, frame readback captures, an audio signal check, an emulated DualSense, a boss fight with real shots and stomps, a two-browser Online Derby run over the public PeerJS server, full AI playthroughs of 1-1 and 1-2 on real physics with teleporting off (cleared in 50 s and 63 s of simulated time), measured jump arcs (6.5 m single, 15.6 m triple), and the AI Hub harness (1-4 players, bad network, host leaving).\n- Environment: Claude Code CLI (headless); Linux; browser unknown\n- Model: Anthropic, claude-opus-5-5, reasoning effort medium\n- Usage: API cost unknown; tokens unknown (no usage meter is visible inside the session); session time about 1 hour 35 minutes\n\nTESTING FEEDBACK\n- How many issues did testing catch? 12: one-press-burns-all-three-jumps (edge inputs ran on every physics sub-step), quick key taps lost in menus, Sky Derby starting in the wrong state (frozen race, no pause), a stray recursive boot() that restarted the session round over and over, a double removal of the loading overlay, the title menu overflowing at 720p, the probe missing input on very slow frames, a Puff floating 1.2 m above its platform in 1-1, the pause flag carrying over into a newly started stage, a mesa Puff in 1-1 that needed a near-impossible jump, Spiky Tops able to juggle an invulnerable player forever, and trees spawning on key spots with trunks you could stand on inside the foliage.\n- How many would be considered critical issues / game breaking? 6: the jump input bug, the frozen race, the recursive boot in AI Hub sessions, the pause carry-over, the near-unreachable mesa Puff and the Spiky Top juggle.\n- What was the most helpful test you ran? Stepping the fixed 60 Hz simulation directly with the AI on a designer-placed route and no teleport. It is independent of render speed, and it found three level and gameplay bugs that scripted checks missed. The AI Hub harness was a close second: it found the recursive boot.\n- What was the least helpful test you ran? Plain page screenshots. Headless SwiftShader WebGPU shows the canvas as blank white, so they looked like a rendering bug that wasn't there. Reading frames back from an offscreen render target fixed that.\n\nENGINE FEEDBACK\n- What did you like most about the engine? The toonOutlinePass and MeshToonNodeMaterial together give a real cel-shaded look in two lines, and Rapier's KinematicCharacterController does the slopes, steps and snapping a platformer needs.\n- Did you get stuck or guess wrong? Briefly. I took the blank headless captures for a renderer bug. I also had to check that the Rapier 0.19 ray hit field is timeOfImpact and that r180 still calls it PostProcessing (newer builds rename it RenderPipeline).\n- What was the most important thing you had to build yourself? Carrying riders on moving and spinning platforms (matrix deltas applied to the character), plus the fixed-step loop that keeps button presses edge-triggered.\n- What was the hardest part about using the engine? Verifying output. WebGPU-only rendering can't be screenshotted headlessly without a render-target readback, and post-processing has to be routed by hand to capture it.\n- If you had to remove or overhaul one thing from engine, what would that be? The split between WebGL-era names and node-material names (PostProcessing/RenderPipeline, MeshToonMaterial/MeshToonNodeMaterial), which makes version-correct code guesswork.\n- If you could change one thing about the engine, what would it be? A built-in, documented way to capture the final post-processed frame to pixels for automated tests.\n\nPROMPT FEEDBACK\n- What did you like most about this prompt? The clear \"done\" bar: a single file, no stubs, attract mode, invert toggles and the hub protocol. Plus room to choose the mechanics.\n- What was confusing? \"Follow the hub for multiplayer integration as well   const skyMat = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide, depthWrite: false });
  const h = normalWorld.y;
  skyMat.colorNode = mix(R.skyBot, R.skyTop, smoothstep(float(-0.15), float(0.55), h));
  R.sky = new THREE.Mesh(new THREE.SphereGeometry(1800, 32, 16), skyMat);
  R.sky.renderOrder = -10; scene.add(R.sky);
  // lights
  R.hemi = new THREE.HemisphereLight(0xdff3ff, 0x8a6fa8, 1.3); scene.add(R.hemi);
  const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
  sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
  const sc = sun.shadow.camera; sc.left = -90; sc.right = 90; sc.top = 90; sc.bottom = -90; sc.near = 1; sc.far = 400;
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
  scene.add(sun); scene.add(sun.target); R.sun = sun;
  // post: toon outlines + gentle bloom

  R.nodes = { full: scenePass.add(bloom(scenePass, 0.35, 0.3, 0.82)), outline: scenePass };

  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
  Particles.init(scene);
}

// ── particles: pooled cel-shaded bits (sparkles, smoke, confetti, explosions) ──
const Particles = {
  list: [], pool: [], group: null,
  init(scene) { this.group = new THREE.Group(); scene.add(this.group); },
  spawn(pos, o) {
    let p = this.pool.pop();
    if (!p) { p = { m: new THREE.Mesh(GEO.sphereLo, glow('#fff')) }; p.m.castShadow = false; this.group.add(p.m); }
    p.m.visible = true;
    p.m.material = o.glow ? glow(o.color, 1) : toon(o.color, { flat: true });
    p.m.position.copy(pos);
    p.vel = o.vel ? o.vel.clone() : V(rnd(-1, 1), rnd(0, 1), rnd(-1, 1)).multiplyScalar(o.speed ?? 6);
    p.life = p.max = o.life ?? 0.8; p.size = o.size ?? 0.4; p.grav = o.grav ?? 0; p.drag = o.drag ?? 1.5; p.grow = o.grow ?? -1;
    p.m.scale.setScalar(p.size);
    this.list.push(p);
  },
  burst(pos, color, n = 16, speed = 9, size = 0.45, life = 0.7, glowing = true) {
    for (let i = 0; i < n; i++) this.spawn(pos, { color, speed, size: size * rnd(0.6, 1.2), life: life * rnd(0.7, 1.2), glow: glowing, grav: -8, drag: 2 });
  },
  explosion(pos, scale = 1) {
    this.burst(pos, '#ffef7a', 14 * scale, 12 * scale, 0.7 * scale, 0.5);
    this.burst(pos, '#ff7b39', 14 * scale, 8 * scale, 0.9 * scale, 0.7);
    for (let i = 0; i < 8 * scale; i++) this.spawn(pos, { color: '#e9e2f5', speed: 4 * scale, size: 1.1 * scale, life: 1.2, grav: 2, drag: 1.2, grow: 1.2 });
  },
  confetti(pos, n = 40) {
    const cols = ['#ff5d8f', '#ffc93c', '#4fe0b0', '#4cc3ff', '#c48bff'];
    for (let i = 0; i < n; i++) this.spawn(pos, { color: cols[i % cols.length], vel: V(rnd(-6, 6), rnd(6, 16), rnd(-6, 6)), size: 0.3, life: 2, glow: true, grav: -12, drag: 0.8 });
  },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.life -= dt;
      if (p.life <= 0) { p.m.visible = false; this.pool.push(p); this.list.splice(i, 1); continue; }
      p.vel.y += p.grav * dt; p.vel.multiplyScalar(Math.exp(-p.drag * dt));
      p.m.position.addScaledVector(p.vel, dt);
      const k = p.life / p.max;
      p.m.scale.setScalar(Math.max(0.01, p.size * (p.grow > 0 ? 1 + (1 - k) * p.grow : k)));
    }
  },
  clear() { for (const p of this.list) { p.m.visible = false; this.pool.push(p); } this.list.length = 0; },
};

function part(geo, hex, sx, sy, sz, x = 0, y = 0, z = 0, opts) {
  const m = mesh(geo, toon(hex, opts)); m.scale.set(sx, sy, sz); m.position.set(x, y, z); return m;
}
function rot(m, x = 0, y = 0, z = 0) { m.rotation.set(x, y, z); return m; }
function pivot(x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); return g; }

/** The hero / rivals: a robo-rabbit with springy ears, piston legs and jet boots. Origin at the feet. */
function makeHopper(main = '#fdfdfd', accent = '#ff4f6d', visor = '#46d3ff') {
  const g = new THREE.Group(); const body = pivot(0, 1.25, 0); g.add(body);
  body.add(part(GEO.sphere, main, 0.75, 0.82, 0.7));

  body.add(part(GEO.cyl, '#59607a', 0.2, 0.5, 0.2, 0.45, 0.1, -0.55));
  const head = pivot(0, 0.95, 0.05); body.add(head);
  head.add(part(GEO.sphere, main, 0.62, 0.55, 0.6));
  head.add(part(GEO.sphere, visor, 0.48, 0.2, 0.3, 0, 0.05, 0.42, { emissive: visor, ei: 0.6 }));
  head.add(part(GEO.sphere, accent, 0.12, 0.1, 0.1, 0, -0.18, 0.58));
  const ears = [];
  for (const s of [-1, 1]) {
    const ear = pivot(s * 0.25, 0.4, -0.05); head.add(ear);
    ear.add(part(GEO.capsule, main, 0.13, 0.55, 0.09, 0, 0.6, 0));
    ear.add(part(GEO.capsule, accent, 0.07, 0.42, 0.05, 0, 0.62, 0.06));
    ear.rotation.z = -s * 0.15; ears.push(ear);
  }
  const legs = [];
  for (const s of [-1, 1]) {
    const leg = pivot(s * 0.38, -0.55, 0); body.add(leg);
    leg.add(part(GEO.cyl, '#8d93ad', 0.13, 0.5, 0.13, 0, -0.28, 0));
    const foot = part(GEO.sphere, accent, 0.28, 0.18, 0.48, 0, -0.6, 0.12); leg.add(foot);
    const jet = mesh(GEO.cone, glow('#ffd46b', 0.85), false); jet.scale.set(0.16, 0.5, 0.16); jet.rotation.x = Math.PI; jet.position.set(0, -0.85, -0.05); jet.visible = false; leg.add(jet);
    leg.userData.jet = jet; legs.push(leg);
  }
  const arms = [];
  for (const s of [-1, 1]) {
    const arm = pivot(s * 0.72, 0.15, 0.05); body.add(arm);
    arm.add(part(GEO.capsule, main, 0.14, 0.25, 0.14, 0, -0.25, 0));
    arm.add(part(GEO.sphere, accent, 0.2, 0.2, 0.2, 0, -0.55, 0.05));
    arms.push(arm);
  }
  g.userData = { body, head, ears, legs, arms, earVel: [0, 0], earAng: [0, 0], phase: 0, squash: 1 };
  return g;
}
/** Procedural animation: run cycle, squash & stretch on jump/land, springy ears that lag behind motion. */
function animateHopper(model, st, dt) {
  const u = model.userData;
  const speed = st.hspeed || 0;
  u.phase += dt * (4 + speed * 0.9);
  const run = st.grounded ? clamp(speed / 8, 0, 1) : 0;
  const sw = Math.sin(u.phase * 2) * 0.9 * run;
  u.legs[0].rotation.x = st.grounded ? sw : -0.6; u.legs[1].rotation.x = st.grounded ? -sw : 0.4;
  u.arms[0].rotation.x = -sw * 0.8 + (st.grounded ? 0 : -2.2); u.arms[1].rotation.x = sw * 0.8 + (st.grounded ? 0 : -2.2);
  for (const l of u.legs) l.userData.jet.visible = !st.grounded && st.vy > 0;
  const targetSquash = st.landT > 0 ? 0.72 : st.grounded ? 1 + Math.abs(Math.sin(u.phase * 2)) * 0.05 * run : clamp(1 + st.vy * 0.012, 0.85, 1.25);
  u.squash = damp(u.squash, targetSquash, 18, dt);
  u.body.scale.set(1 / Math.sqrt(u.squash), u.squash, 1 / Math.sqrt(u.squash));
  u.body.position.y = 1.25 * u.squash + (st.grounded ? Math.abs(Math.sin(u.phase * 2)) * 0.12 * run : 0);
  // ear springs driven by vertical acceleration and forward speed
  for (let i = 0; i < 2; i++) {
    const target = -st.vy * 0.03 - speed * 0.04 + (st.stun > 0 ? Math.sin(performance.now() / 60 + i) * 0.8 : 0);
    const f = (target - u.earAng[i]) * 90 - u.earVel[i] * 8;
    u.earVel[i] += f * dt; u.earAng[i] += u.earVel[i] * dt;
    u.ears[i].rotation.x = u.earAng[i];
  }
  u.body.rotation.y = st.stun > 0 ? performance.now() / 90 : 0;
  u.head.rotation.x = st.grounded ? 0 : clamp(-st.vy * 0.02, -0.4, 0.4);
}

function makeSpringModel() {

  g.add(part(GEO.cyl, '#ffc93c', 0.8, 0.37, 0.8, 0, 1.36, 0));

}

function newStats() { return { enemies: 0, stomps: 0, bestCombo: 0, jumps: 0, shots: 0, maxAlt: 0, rivalStomps: 0, crates: 0 }; }

// ── level construction ──
function clearLevel() {
  if (Game.root) { R.scene.remove(Game.root); Game.root.traverse((o) => { if (o.isMesh && o.geometry && !Object.values(GEO).includes(o.geometry)) o.geometry.dispose(); }); }
  if (Game.world) { Game.world.free(); Game.world = null; }
  Particles.clear();
  for (const k of ['actors', 'enemies', 'items', 'puffs', 'projectiles', 'crates', 'debris', 'springs', 'platforms', 'props']) Game[k] = [];
  Game.platformByHandle.clear(); Game.crateByHandle.clear();
  Game.boss = null; Game.exit = null; Game.player = null;

}

function seededRng(seed) { let s = seed >>> 0 || 1; return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function buildLevel(id, opts = {}) {
  clearLevel();

  Game.levelId = id; Game.level = L;
  Game.root = new THREE.Group(); R.scene.add(Game.root);
  const world = new RAPIER.World({ x: 0, y: -28, z: 0 });
  Game.world = world;
  const cc = world.createCharacterController(0.06);
  cc.setSlideEnabled(true); cc.enableAutostep(0.7, 0.3, false); cc.enableSnapToGround(0.5);
  cc.setMaxSlopeClimbAngle((50 * Math.PI) / 180); cc.setMinSlopeSlideAngle((40 * Math.PI) / 180);
  cc.setApplyImpulsesToDynamicBodies(true); cc.setCharacterMass(40);
  Game.cc = cc;
  setSky(L.sky[0], L.sky[1], L.sky[2]);
  const rng = seededRng(id.charCodeAt(0) * 131 + id.charCodeAt(2) * 7);
  // cloud sea far below, and drifting clouds around
  const sea = mesh(new THREE.CircleGeometry(1400, 48), toon('#ffffff', { soft: true }), false); sea.rotation.x = -Math.PI / 2; sea.position.y = -60; Game.root.add(sea);
  for (let i = 0; i < 26; i++) { const c = PROP_MODELS.cloud(rnd(1.5, 4)); const a = rng() * Math.PI * 2, d = 150 + rng() * 350; c.position.set(Math.cos(a) * d, -55 + rng() * 90, Math.sin(a) * d - 60); Game.root.add(c); Game.props.push({ m: c, drift: rnd(0.5, 2) }); }
  for (const p of L.parts) addPart(p, rng);
  for (const e of L.enemies) spawnEnemy(e.t, V(...e.p));
  for (const it of L.items) addItem(it.t, V(...it.p), it.respawn);
  // puffs: adventure uses the level's four; race picks four spots from the seed
  let puffSpots = L.puffs;
  if (opts.race && L.raceSpots) {
    const r = opts.rng || Math.random; const pool = L.raceSpots.slice(); puffSpots = [];
    while (puffSpots.length < 4) puffSpots.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
  }
  puffSpots.forEach((p, i) => { const m = makePuff(PUFF_COLORS[i % 4]); m.position.set(...p); Game.root.add(m); Game.puffs.push({ pos: V(...p), m, rescued: false, flyT: 0, idx: i }); });
  if (L.exit) { const m = makeExitModel(); m.position.set(...L.exit); Game.root.add(m); Game.exit = { pos: V(...L.exit), m }; }
  if (L.boss) Game.boss = createBoss();
  world.step();
  Game.rescued = 0; Game.hintsShown = new Set();
  return L;
}

function staticBody(desc, x, y, z, q) {
  const body = Game.world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(x, y, z));
  if (q) body.setRotation(q, false);
  return Game.world.createCollider(desc.setCollisionGroups(STATIC_GROUPS).setFriction(0.8), body);
}

function addPart(p, rng) {
  const root = Game.root;
  const [x, y, z] = p.p || [0, 0, 0];
  if (p.t === 'isle') {
    const [topC, sideC] = TOP_COLORS[p.top || 'grass'];
    const g = new THREE.Group(); g.position.set(x, y, z); root.add(g);
    const top = mesh(new THREE.CylinderGeometry(p.r, p.r * 0.97, 1.4, 40), toon(topC)); top.position.y = -0.7; g.add(top);
    const depth = Math.max(6, p.r * 0.9);
    const under = mesh(new THREE.CylinderGeometry(p.r * 0.96, p.r * 0.25, depth, 14, 2), toon(sideC, { flat: true })); under.position.y = -1.4 - depth / 2; g.add(under);
    const drip = mesh(GEO.cone6, toon(sideC, { flat: true })); drip.scale.set(p.r * 0.25, depth * 0.6, p.r * 0.25); drip.rotation.x = Math.PI; drip.position.y = -1.4 - depth - depth * 0.25; g.add(drip);
    staticBody(RAPIER.ColliderDesc.cylinder(0.7, p.r), x, y - 0.7, z);
    const flip = new THREE.Quaternion().setFromAxisAngle(V(1, 0, 0), Math.PI);
    staticBody(RAPIER.ColliderDesc.cone(depth / 2, p.r * 0.96), x, y - 1.4 - depth / 2, z, flip);

      const k = rng();

      else if (p.top === 'candy') m = PROP_MODELS.flower('#ff5d8f');
      else if (k < 0.3 && d > 4 && p.r > 6 && !nearKeyPoint(x + dx, y, z + dz)) { m = rng() < 0.5 ? PROP_MODELS.tree(rnd(0.8, 1.3), ['#4fd65a', '#7be36b', '#ffb3d1'][Math.floor(rng() * 3)]) : PROP_MODELS.pine(rnd(0.8, 1.2)); staticBody(RAPIER.ColliderDesc.cylinder(2.6, 0.9), x + dx, y + 2.6, z + dz); }

    const g = new THREE.Group(); g.position.set(x, y, z); root.add(g);
    const body = mesh(GEO.box, toon(sideC)); body.scale.set(w, h, d); body.position.y = -h / 2; g.add(body);
    const cap = mesh(GEO.box, toon(topC)); cap.scale.set(w + 0.3, 0.8, d + 0.3); cap.position.y = -0.4; g.add(cap);
    // little stripes so tall blocks read as climbable cliffs
    for (let yy = 4; yy < h - 1; yy += 5) { const s = mesh(GEO.box, toon(topC)); s.scale.set(w + 0.12, 0.35, d + 0.12); s.position.y = -yy; g.add(s); }
    staticBody(RAPIER.ColliderDesc.cuboid(w / 2, h / 2, d / 2), x, y - h / 2, z);
  } else if (p.t === 'mover' || p.t === 'gear') {
    const isGear = p.t === 'gear';
    const m = isGear ? PROP_MODELS.gear(p.r) : (() => { const g = new THREE.Group(); const b = mesh(GEO.box, toon('#ffc93c')); b.scale.set(...p.s); g.add(b); const st = mesh(GEO.box, toon('#ff5d8f')); st.scale.set(p.s[0] + 0.1, p.s[1] * 0.4, p.s[2] + 0.1); g.add(st); return g; })();
    const halfH = isGear ? 0.4 : p.s[1] / 2;
    const c0 = V(x, y - halfH, z);
    m.position.copy(c0); root.add(m);
    const body = Game.world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(c0.x, c0.y, c0.z));
    const col = Game.world.createCollider((isGear ? RAPIER.ColliderDesc.cylinder(0.4, p.r + 0.4) : RAPIER.ColliderDesc.cuboid(p.s[0] / 2, p.s[1] / 2, p.s[2] / 2)).setCollisionGroups(STATIC_GROUPS), body);
    const plat = { m, body, col, a: c0.clone(), b: p.to ? V(p.to[0], p.to[1] - halfH, p.to[2]) : c0.clone(), period: p.period || 6, speed: p.speed || 0, angle: 0, isGear,
      mat: new THREE.Matrix4().makeTranslation(c0.x, c0.y, c0.z), prev: new THREE.Matrix4().makeTranslation(c0.x, c0.y, c0.z), dyaw: 0 };

    let m;
    if (p.k === 'windmill') m = PROP_MODELS.windmill();
    else if (p.k === 'carrotTower') m = PROP_MODELS.carrotTower(p.h || 12);
    else if (p.k === 'clockFace') m = PROP_MODELS.clockFace(p.s || 5);

    else if (p.k === 'cloud') m = PROP_MODELS.cloud(p.s || 2);
    m.position.set(x, y, z); root.add(m);
    Game.props.push({ m, kind: p.k });

    if (p.k === 'carrotTower') staticBody(RAPIER.ColliderDesc.cylinder((p.h || 12) / 2, 1.4), x, y + (p.h || 12) / 2, z);

  }
}

/** Keep solid decorations off Puffs, pickups, enemies, springs, the exit and the AI route. */
function nearKeyPoint(x, y, z) {
  const L = Game.level; if (!L) return false;
  const pts = [...(L.puffs || []), ...(L.raceSpots || []), ...(L.items || []).map((i) => i.p), ...(L.enemies || []).map((e) => e.p), ...(L.route || []).map((r) => r.p), ...(L.exit ? [L.exit] : []), L.spawn.p,
    ...L.parts.filter((q) => q.t === 'spring' || q.t === 'crates' || q.t === 'sign').map((q) => q.p)];
  return pts.some((q) => Math.hypot(q[0] - x, q[2] - z) < 5 && Math.abs(q[1] - y) < 6);
}
function addCrate(pos) {
  const m = new THREE.Group();
  const b = mesh(GEO.box, toon('#e8a868')); b.scale.setScalar(1.4); m.add(b);
  for (const ax of ['x', 'z']) { const s = mesh(GEO.box, toon('#9b6a43')); s.scale.set(ax === 'x' ? 1.45 : 0.25, 1.45, ax === 'z' ? 1.45 : 0.25); m.add(s); }
  Game.root.add(m);
  const body = Game.world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(pos.x, pos.y, pos.z).setLinearDamping(0.3).setAngularDamping(0.5));
  const col = Game.world.createCollider(RAPIER.ColliderDesc.cuboid(0.7, 0.7, 0.7).setDensity(0.6).setCollisionGroups(STATIC_GROUPS).setFriction(0.9), body);
  const c = { m, body, col, alive: true };
  Game.crates.push(c); Game.crateByHandle.set(col.handle, c);
}
function breakCrate(c) {
  if (!c.alive) return;
  c.alive = false; Game.crateByHandle.delete(c.col.handle);
  const p = c.body.translation(); const pos = V(p.x, p.y, p.z);
  Game.world.removeRigidBody(c.body); Game.root.remove(c.m);
  Sound.sfx('crate'); Particles.burst(pos, '#e8a868', 10, 7, 0.35, 0.6, false);
  for (let i = 0; i < 5; i++) spawnDebris(pos, '#e8a868', 0.5);
  if (Game.player) Game.stats.crates++;
  addScore(50, pos);
  const roll = Math.random();
  const drop = roll < 0.35 ? 'carrot' : roll < 0.55 ? SPECIALS[Math.floor(Math.random() * 3)] : roll < 0.65 ? 'clock' : null;
  if (drop) addItem(drop, V(pos.x, pos.y - 0.5, pos.z));
}
function spawnDebris(pos, hex, size = 0.5) {
  if (!Game.world) return;
  const m = mesh(GEO.box, toon(hex)); m.scale.setScalar(size); Game.root.add(m);
  const body = Game.world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(pos.x + rnd(-0.5, 0.5), pos.y + rnd(0, 0.8), pos.z + rnd(-0.5, 0.5))
    .setLinvel(rnd(-6, 6), rnd(5, 12), rnd(-6, 6)).setAngvel({ x: rnd(-8, 8), y: rnd(-8, 8), z: rnd(-8, 8) }));
  Game.world.createCollider(RAPIER.ColliderDesc.cuboid(size / 2, size / 2, size / 2).setRestitution(0.5).setCollisionGroups(DEBRIS_GROUPS), body);

function addItem(type, pos, respawn) {
  const m = ITEM_MODELS[type](); const holder = new THREE.Group(); holder.add(m); holder.position.copy(pos); Game.root.add(holder);
  const halo = mesh(GEO.ring, glow('#fff7c2', 0.5), false); halo.rotation.x = -Math.PI / 2; halo.scale.setScalar(1.1); halo.position.y = 0.05; holder.add(halo);
  Game.items.push({ type, pos: pos.clone(), m: holder, inner: m, taken: false, respawn, t: Math.random() * 6, respawnT: 0 });

// ── enemies ──
const ENEMY_DEF = {
  bobbler: { hp: 2, score: 200, stomp: true, dmg: 1 },
  copter: { hp: 2, score: 300, stomp: true, dmg: 1 },
  top: { hp: 4, score: 400, stomp: false, dmg: 1 },
  clam: { hp: 3, score: 300, stomp: true, dmg: 1 },
  boomling: { hp: 1, score: 250, stomp: true, dmg: 2 },
};
function spawnEnemy(type, pos) {
  const m = ENEMY_MODELS[type](); m.position.copy(pos); Game.root.add(m);
  const d = ENEMY_DEF[type];
  const e = { type, m, u: m.userData, pos: pos.clone(), home: pos.clone(), vel: V(), hp: d.hp, def: d, alive: true, t: Math.random() * 3, yaw: Math.random() * 6, state: 'idle', cd: rnd(0.5, 2), grounded: true, flash: 0, fuse: 0 };
  if (type === 'copter') e.pos.y += 0; // hovers at given height
  Game.enemies.push(e);
  return e;
}
function groundBelow(pos, up = 2, max = 60) {
  const ray = new RAPIER.Ray({ x: pos.x, y: pos.y + up, z: pos.z }, { x: 0, y: -1, z: 0 });
  const hit = Game.world.castRay(ray, max, true, undefined, WORLD_QUERY);
  return hit ? { y: pos.y + up - hit.timeOfImpact, handle: hit.collider.handle } : null;
}
function nearestTargetActor(pos, maxD) {
  let best = null, bd = maxD;
  for (const a of Game.actors) { if (a.dead || a.remote) continue; const d = a.pos.distanceTo(pos); if (d < bd) { bd = d; best = a; } }
  return best;
}
function updateEnemy(e, dt) {
  e.t += dt; e.cd -= dt; e.flash = Math.max(0, e.flash - dt);
  const tgt = nearestTargetActor(e.pos, 45);
  const toT = tgt ? _v1.subVectors(tgt.pos, e.pos) : null;
  const dist = toT ? Math.hypot(toT.x, toT.z) : 1e9;
  if (tgt && e.type !== 'top') e.yaw = damp(e.yaw, e.yaw + angDiff(e.yaw, Math.atan2(toT.x, toT.z)), 6, dt);
  const leash = e.pos.distanceTo(e.home) > 14;
  switch (e.type) {
    case 'bobbler': {
      if (e.grounded) {
        if (e.cd <= 0) {
          const dir = tgt && dist < 26 && !leash ? V(toT.x, 0, toT.z).normalize() : V(e.home.x - e.pos.x, 0, e.home.z - e.pos.z).normalize().add(V(rnd(-0.7, 0.7), 0, rnd(-0.7, 0.7))).normalize();
          const sp = tgt && dist < 26 ? 7 : 3;
          e.vel.set(dir.x * sp, 11, dir.z * sp); e.grounded = false; e.cd = rnd(0.9, 1.6);
        }
      } else {
        e.vel.y -= 30 * dt; e.pos.addScaledVector(e.vel, dt);
        const g = groundBelow(e.pos, 1.5, 4);
        if (e.vel.y < 0 && g && e.pos.y <= g.y) { e.pos.y = g.y; e.grounded = true; e.vel.set(0, 0, 0); }
        else if (!g && e.vel.y < 0) { // about to hop off a ledge: steer home
          const back = V(e.home.x - e.pos.x, 0, e.home.z - e.pos.z).normalize(); e.vel.x = back.x * 6; e.vel.z = back.z * 6;
          if (e.pos.y < e.home.y - 8) { e.pos.copy(e.home); e.vel.set(0, 0, 0); e.grounded = true; }
        }
      }
      const sq = e.grounded ? 1 - Math.max(0, 0.3 - (e.cd > 0.6 ? 0 : (0.6 - e.cd))) * 0.6 : 1.15;
      e.u.b.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
      break;
    }
    case 'copter': {
      e.u.prop.rotation.y += dt * 25;
      const orbit = V(e.home.x + Math.cos(e.t * 0.6) * 6, e.home.y + Math.sin(e.t * 1.3) * 1.5, e.home.z + Math.sin(e.t * 0.6) * 6);
      if (tgt && dist < 32) { orbit.x = damp(orbit.x, tgt.pos.x, 0.5, 1); orbit.z = damp(orbit.z, tgt.pos.z, 0.5, 1); orbit.y = Math.max(orbit.y, tgt.pos.y + 5); }
      e.pos.x = damp(e.pos.x, orbit.x, 1.2, dt); e.pos.y = damp(e.pos.y, orbit.y, 1.2, dt); e.pos.z = damp(e.pos.z, orbit.z, 1.2, dt);
      if (tgt && dist < 36 && e.cd <= 0) { e.cd = 2.2; enemyShoot(e.pos.clone().add(V(0, 0, 0)), tgt.pos.clone().add(V(0, 1.6, 0)), 13, 'pellet'); }
      e.u.b.rotation.z = Math.sin(e.t * 2) * 0.15;
      break;
    }
    case 'top': {
      e.u.b.rotation.y += dt * 14;
      const want = tgt && dist < 22 && !leash ? V(toT.x, 0, toT.z).normalize().multiplyScalar(4.5) : V(e.home.x - e.pos.x, 0, e.home.z - e.pos.z).multiplyScalar(0.5);
      e.vel.x = damp(e.vel.x, want.x, 1.5, dt); e.vel.z = damp(e.vel.z, want.z, 1.5, dt);
      const nx = e.pos.x + e.vel.x * dt, nz = e.pos.z + e.vel.z * dt;
      const g = groundBelow(V(nx, e.pos.y, nz), 1.5, 3);
      if (g) { e.pos.x = nx; e.pos.z = nz; e.pos.y = g.y; } else { e.vel.multiplyScalar(-0.5); }
      e.u.b.rotation.x = Math.sin(e.t * 3) * 0.08;
      break;
    }
    case 'clam': {
      const open = (e.t % 3.2) > 2.0;
      e.u.lid.rotation.x = damp(e.u.lid.rotation.x, open ? -0.9 : 0, 10, dt);
      if (open && tgt && dist < 42 && e.cd <= 0) { e.cd = 3.2; lobBomb(e.pos.clone().add(V(0, 1.4, 0)), tgt.pos.clone(), 'bomb'); }
      break;
    }
    case 'boomling': {
      if (e.fuse > 0) {
        e.fuse -= dt; e.u.spark.scale.setScalar(0.25 + Math.sin(e.t * 40) * 0.1); e.u.b.scale.setScalar(1 + (1.2 - e.fuse) * 0.25);
        if (Math.random() < 0.3) Sound.sfx('fuse');
        if (e.fuse <= 0) { explode(e.pos.clone().add(V(0, 1, 0)), 4.5, 2, 'enemy'); killEnemy(e, null, true); }
        break;
      }
      const want = tgt && dist < 20 && !leash ? V(toT.x, 0, toT.z).normalize().multiplyScalar(5) : V(e.home.x - e.pos.x, 0, e.home.z - e.pos.z).multiplyScalar(0.3);
      e.vel.x = damp(e.vel.x, want.x, 4, dt); e.vel.z = damp(e.vel.z, want.z, 4, dt);
      const nx = e.pos.x + e.vel.x * dt, nz = e.pos.z + e.vel.z * dt;
      const g = groundBelow(V(nx, e.pos.y, nz), 1.5, 3);
      if (g) { e.pos.x = nx; e.pos.z = nz; e.pos.y = g.y; }
      const sp = Math.hypot(e.vel.x, e.vel.z);
      e.u.feet[0].position.z = 0.1 + Math.sin(e.t * 14) * 0.3 * (sp / 5); e.u.feet[1].position.z = 0.1 - Math.sin(e.t * 14) * 0.3 * (sp / 5);
      e.u.spark.scale.setScalar(0.15 + Math.random() * 0.06);
      if (tgt && tgt.pos.distanceTo(e.pos) < 3.2) { e.fuse = 1.2; Sound.sfx('fuse'); }
      break;
    }
  }
  e.m.position.copy(e.pos); e.m.rotation.y = e.yaw;
  e.m.visible = e.flash <= 0 || Math.floor(e.flash * 30) % 2 === 0;
}
function damageEnemy(e, dmg, src) {
  if (!e.alive) return;
  e.hp -= dmg; e.flash = 0.25; Sound.sfx('hit');
  Particles.burst(e.pos.clone().add(V(0, 1, 0)), '#ffffff', 5, 6, 0.25, 0.3);

// ───────────────────────────── flow: states, camera, visuals, attract mode, AI Hub race ─────────────────────────────
const Flow = { storyShown: new Set(), lookDown: 0, camMode: null, titleAng: 0, sendT: 0 };

// ── attract mode: AI plays the demo with cheats on, any input exits ──
const Attract = {

  next() { this.i = (this.i + 1) % this.seq.length; this.load(); },
  update(dt) { this.t += dt; if (this.t > (this.seq[this.i] === '1-3' ? 40 : 34)) this.next(); },

// ── per-frame state machine ──
function frame(dt) {
  pollInput(dt);
  UI.update(dt);
  const st = Game.state;
  if (st === 'title' && UI.atTitleRoot() && performance.now() - Input.lastInput > 10000 && !Net.active) Attract.start();
  if (st === 'attract') { if (Input.v.anyP) { Attract.stop(); return render(dt); } Attract.update(dt); }
  // pause toggle (in a session race the world never pauses — the menu just overlays)
  if (Input.v.pauseP && ['play', 'race', 'intro'].includes(Game.state) && !UI.blocking()) UI.pause();
  if (Input.v.camP && Game.player && !UI.blocking()) { Settings.camera = Settings.camera === 'first' ? 'chase' : 'first'; saveSettings(); UI.toast(Settings.camera === 'first' ? 'First-person view' : 'Chase view', 1, true); }
  if (st === 'intro') { Game.introT += dt; }
  if (st === 'play' && Game.player) getHint(Game.player);
  // simulation
  const hubRace = Net.active;
  const runSim = Game.world && !['boot', 'results', 'gameover'].includes(st) && !(Game.paused && !hubRace) && !(UI.dialogOpen() && !hubRace) && st !== 'intro';
  if (runSim) {
    Game.acc = Math.min(Game.acc + dt, STEP * 5);
    while (Game.acc >= STEP) {
      if (st === 'warp') stepWarp(STEP);
      else if (st === 'dead') stepDead(STEP);
      else simStep(STEP);
      Game.acc -= STEP;
      // edge-triggered buttons count once per frame, not once per sub-step
      const v = Input.v; v.jumpP = v.specialP = v.cycleP = v.l1P = v.r1P = false;
    }
  }
  if (st === 'race' && Game.race) raceFrame(dt);
  render(dt);
}
function stepWarp(dt) {
  Game.warpT += dt; const p = Game.player;
  p.pos.y += dt * (4 + Game.warpT * 14); p.yaw += dt * Game.warpT * 8;
  if (Math.random() < 0.5) Particles.spawn(p.pos.clone().add(V(rnd(-1, 1), 0, rnd(-1, 1))), { color: '#7dffd8', glow: true, vel: V(0, -6, 0), size: 0.3, life: 0.6 });

}
function stepDead(dt) {
  Game.deadT += dt;
  for (const e of Game.enemies) if (e.alive) updateEnemy(e, dt);
  updateProjectiles(dt);
  if (Game.deadT > 2.2 && Game.state === 'dead') {
    Game.lives--;
    if (Game.lives <= 0) { Game.state = 'gameover'; Sound.jingle('gameover'); UI.gameOver(); return; }
    const p = Game.player; p.dead = false; p.hearts = p.maxHearts; p.invuln = 2.5;
    if (Game.time <= 0) Game.time = 60;

}
function raceFrame(dt) {

}

// ── visuals & camera ──
function render(dt) {
  Particles.update(dt);
  const T = performance.now() / 1000;
  for (const a of Game.actors) {
    if (a.remote) Net.interpolate(a);
    const hs = Math.hypot(a.vel.x, a.vel.z);
    a.model.position.copy(a.pos); a.model.rotation.y = a.yaw + Math.PI;
    animateHopper(a.model, { hspeed: hs, grounded: a.remote ? a.pos.y - (a.groundY ?? a.pos.y) < 0.3 : a.grounded, vy: a.vel.y, landT: a.landT || 0, stun: a.stun || 0 }, dt);
    const firstPerson = a === Game.player && Settings.camera === 'first' && Game.mode !== 'attract' && Game.state !== 'warp' && Game.state !== 'results';
    a.model.visible = !a.dead && !firstPerson && (a.invuln <= 0 || Math.floor(a.invuln * 15) % 2 === 0);
    if (a.shadow) {
      const h = a.pos.y - a.groundY;
      a.shadow.visible = !a.dead && a.groundY > -900 && h < 120;
      a.shadow.position.set(a.pos.x, a.groundY + 0.06, a.pos.z);
      const s = 0.8 + Math.min(h, 30) * 0.05; a.shadow.scale.setScalar(s);
    }

  }
  for (const it of Game.items) { if (it.taken) continue; it.t += dt; it.inner.rotation.y = it.t * 2; it.inner.position.y = 1.1 + Math.sin(it.t * 3) * 0.25; }

    const near = Game.player && p.pos.distanceTo(Game.player.pos) < 16;
    if (p.rescued) {
      if (p.flyT > 0) { p.flyT += dt; p.m.position.y = p.pos.y + p.flyT * p.flyT * 6; p.m.rotation.y += dt * 6; animatePuff(p.m, dt, true); if (p.flyT > 2.5) { p.m.visible = false; p.flyT = 0; } }
    } else { animatePuff(p.m, dt, near); if (Game.player) p.m.rotation.y = Math.atan2(Game.player.pos.x - p.pos.x, Game.player.pos.z - p.pos.z); }

    if (pr.drift) pr.m.position.x += Math.sin(T * 0.05 + pr.drift) * dt * pr.drift;
    if (pr.kind === 'windmill') pr.m.userData.spin.rotation.z += dt * 1.2;
    if (pr.kind === 'gear') pr.m.rotation.y += dt * 0.15;
    if (pr.kind === 'clockFace') { pr.m.userData.hands[0].rotation.z = -T * 0.8; pr.m.userData.hands[1].rotation.z = -T * 0.07; }

    const open = Game.player ? Game.player.puffs.filter(Boolean).length >= 4 : false;
    const u = Game.exit.m.userData; u.ring.rotation.z += dt * (open ? 3 : 0.5);
    u.beam.visible = open; u.ring.position.y = 0.55 + (open ? Math.sin(T * 4) * 0.3 : 0);
  }

  R.sun.position.copy(R.camera.position).add(V(60, 120, 40)); R.sun.target.position.copy(R.camera.position).add(V(0, -10, 0));
  R.sky.position.copy(R.camera.position);
  UI.updateHUD(dt);

function updateCamera(dt) {
  const cam = R.camera; const p = Game.player;
  let shakeV = V();
  if (R.shakeT > 0) { R.shakeT -= dt; const a = R.shakeAmp * Math.min(1, R.shakeT * 4); shakeV.set(rnd(-a, a), rnd(-a, a), rnd(-a, a)); } else R.shakeAmp = 0;

    Flow.titleAng += dt * 0.06;

    cam.position.set(c.x + Math.sin(Flow.titleAng) * 95, 42 + Math.sin(Flow.titleAng * 0.7) * 10, c.z + Math.cos(Flow.titleAng) * 95);
    cam.lookAt(c); return;
  }
  // JF signature: when falling high above the ground the view tips down to show your landing spot
  const h = p.pos.y - p.groundY;
  let want = 0;
  if (Settings.autoLook && !p.grounded && p.vel.y < 2 && h > 3.5) want = -0.95 * clamp((h - 3.5) / 9, 0, 1);
  if (Input.v.lookDown && !UI.blocking()) want = -1.25;
  Flow.lookDown = damp(Flow.lookDown, want, want < Flow.lookDown ? 3.2 : 4.5, dt);
  const pitch = clamp(p.pitch + Flow.lookDown, -1.5, 1.2);
  p.aimPitch = pitch;
  const fp = Settings.camera === 'first' && Game.mode !== 'attract' && Game.state !== 'warp';
  const dir = V(-Math.sin(p.yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(p.yaw) * Math.cos(pitch));
  if (fp && !p.dead) {
    const eye = p.pos.clone().add(V(0, 2.25 - (p.landT > 0 ? 0.25 : 0), 0));
    cam.position.copy(eye).add(shakeV);
    cam.lookAt(eye.clone().add(dir));
  } else {
    const target = p.pos.clone().add(V(0, 2.2, 0));
    const back = Game.mode === 'attract' ? 11 : 8.5;
    const camPitch = clamp(pitch - 0.25, -1.2, 0.6);
    const off = V(Math.sin(p.yaw) * Math.cos(camPitch) * back, -Math.sin(camPitch) * back + 1.5, Math.cos(p.yaw) * Math.cos(camPitch) * back);

}

// ── race netcode, written once against a small transport: { time, send, on, progress, result } ──
// Two adapters: the AI Hub session (hubTransport) and the game's own online lobby (PeerNet, 07-peer.js).
const hubTransport = {
  time: () => AIHub.time(), send: (d, o) => AIHub.send(d, o), on: (t, f) => AIHub.on(t, f),
  progress: (p) => AIHub.progress(p), result: (r) => AIHub.result(r),

const Net = {
  active: false, mode: null, tx: null, info: null, ended: false, sendT: 0, finishedSent: false, readySent: false, waitingGesture: false,
  async boot() {

    if (!info) return false;
    this.info = info;
    this.startRace({ mode: 'hub', tx: hubTransport, players: info.players, me: info.me, rng: AIHub.rng('course') });
    AIHub.on('start', () => { Sound.init(); });
    AIHub.on('time-up', () => { if (!this.finishedSent) this.reportScore(); });
    AIHub.on('end', ({ reason, standings }) => { this.ended = true; Sound.mute(true); releaseLock(); UI.hubEnd(reason, standings); });

    const slot = Math.max(0, players.findIndex((q) => q.id === me));

      tx.on('leave', ({ id }) => { if (this.tx === tx) this.removeRemote(id); });
    }
  },
  /** Leave a peer race and return to normal single-device play. */
  reset() { Object.assign(this, { active: false, mode: null, tx: null, ended: false, finishedSent: false }); },
  gesture() {
    if (this.waitingGesture && !this.readySent) { this.readySent = true; this.waitingGesture = false; AIHub.ready(); UI.hubWaiting(null); UI.toast('Waiting for everyone…', 2, true); }
  },
  addRemote(p, idx) {

    const tag = nameTag(p.name, p.color); Game.root.add(tag);

      this.tx.send({ t: 'p', at: Math.round(t), p: [r2(p.pos.x), r2(p.pos.y), r2(p.pos.z)], v: [r2(p.vel.x), r2(p.vel.y), r2(p.vel.z)], y: r2(p.yaw), s: p.stun > 0 ? 1 : 0, n, g: r2(p.groundY) }, { reliable: false });
    }
  },
  hit(id) { this.tx.send({ t: 'hit', kind: 'stomp', at: Math.round(this.tx.time()) }, { to: id }); },
  finished(t) {
    if (this.finishedSent) return; this.finishedSent = true;
    const s = Game.stats;
    const awards = [];
    if (s.rivalStomps >= 2) awards.push({ title: 'Bunny Bonker', detail: `${s.rivalStomps} rivals stomped` });
    if (s.maxAlt >= 35) awards.push({ title: 'Sky High', detail: `reached ${Math.round(s.maxAlt)} m` });
    this.tx.result({ time: t, stats: { puffs: 4, jumps: s.jumps, stomps: s.stomps + s.rivalStomps, 'top height': `${Math.round(s.maxAlt)} m` }, awards });
    this.tx.send({ t: 'done', time: t });
  },
  reportScore() {
    this.finishedSent = true; const p = Game.player; const s = Game.stats;
    this.tx.result({ score: Math.round(raceProgress(p)), stats: { puffs: p.puffs.filter(Boolean).length, jumps: s.jumps, stomps: s.stomps + s.rivalStomps } });
  },
};

};
const glyphs = (s) => s.replace(/\{(\w+)\}/g, (m, k) => (GLYPH[Input.device === 'pad' ? 'pad' : 'keyboard'][k] || m));

const UI = {
  stack: [], hudBuilt: false, h: {}, toastT: 0, hintT: 0, dlg: null, cardT: 0, attract: false, popPool: [], specialFlash: 0, lastDevice: null,
  root() { return $('ui'); },
  clear() { this.stack = []; this.root().innerHTML = ''; if (this.dlg && this.dlg.el) this.dlg.el.remove(); this.dlg = null; },
  blocking() { return this.stack.length > 0 || !!this.dlg; },
  dialogOpen() { return !!this.dlg; },
  menuOpen() { return this.stack.some((p) => p.id === 'pause' || p.pauseChild); },
  atTitleRoot() { return this.stack.length === 1 && this.stack[0].id === 'title' && !this.dlg; },

  // ── generic panel stack ──
  push(panel) {
    panel.sel = panel.sel ?? 0;
    this.stack.push(panel);
    this.render();
  },
  pop() {
    const p = this.stack.pop();
    if (p && p.onClose) p.onClose();
    this.render();
    return p;
  },
  render() {
    const root = this.root();
    root.innerHTML = '';
    const p = this.stack[this.stack.length - 1];
    if (!p) return;
    const el = document.createElement('div');
    el.className = 'screen ' + (p.dim === false ? '' : 'dim');
    el.innerHTML = p.html ? p.html() : '';
    if (p.items) {
      const menu = document.createElement('div'); menu.className = 'menu';
      p.items.forEach((it, i) => {
        const d = document.createElement('div');
        d.className = 'item' + (i === p.sel ? ' sel' : '') + (it.locked ? ' locked' : '');
        const lab = document.createElement('span'); lab.innerHTML = esc(typeof it.label === 'function' ? it.label() : it.label) + (it.desc ? `<span class="desc">${esc(it.desc)}</span>` : '');
        d.appendChild(lab);
        if (it.value) { const v = document.createElement('span'); v.className = 'val'; v.textContent = '◀ ' + it.value() + ' ▶'; d.appendChild(v); }
        d.addEventListener('mouseenter', () => { if (p.sel !== i) { p.sel = i; Sound.sfx('menu'); this.render(); } });
        d.addEventListener('click', (e) => { e.stopPropagation(); p.sel = i; if (it.adjust) { it.adjust(1); Sound.sfx('menu'); this.render(); } else this.activate(p, it); });
        menu.appendChild(d);
      });
      (el.querySelector('.menu-slot') || el).appendChild(menu);
    }
    if (p.prompts !== false) {
      const pr = document.createElement('div'); pr.className = 'prompts';
      pr.innerHTML = glyphs(p.prompts || (p.items ? `<span>{OK} Select</span>` : '') + (p.back !== false && p.onBack ? `<span>{BACK} Back</span>` : ''));
      el.appendChild(pr);
    }
    root.appendChild(el);
    p.el = el;
    if (p.after) p.after(el);
  },
  activate(p, it) {
    if (it.locked) { Sound.sfx('back'); return; }
    Sound.sfx('confirm');
    it.action && it.action();
  },
  update(dt) {
    if (this.lastDevice !== Input.device) { this.lastDevice = Input.device; if (this.stack.length) this.render(); }
    const v = Input.v;
    if (this.dlg) { this.updateDialog(dt); return; }
    const p = this.stack[this.stack.length - 1];
    if (!p) return;
    if (v.pauseP && this.menuOpen()) { v.pauseP = false; Sound.sfx('back'); this.closePause(); return; }
    if (p.update) p.update(dt);
    if (p.items && p.items.length) {
      if (v.up) { p.sel = (p.sel + p.items.length - 1) % p.items.length; Sound.sfx('menu'); this.render(); }
      if (v.down) { p.sel = (p.sel + 1) % p.items.length; Sound.sfx('menu'); this.render(); }
      const it = p.items[p.sel];
      if (it && it.adjust && (v.left || v.right)) { it.adjust(v.left ? -1 : 1); Sound.sfx('menu'); this.render(); }
      if (v.confirmP && it) { if (it.adjust && !it.action) { it.adjust(1); Sound.sfx('menu'); this.render(); } else this.activate(p, it); return; }
    } else if (v.confirmP && p.onConfirm) { Sound.sfx('confirm'); p.onConfirm(); return; }
    if (v.backP && p.onBack) { v.pauseP = false; Sound.sfx('back'); p.onBack(); }

  advanceDialog() {
    const d = this.dlg; if (!d) return;

    if (d.ch < text.length) { d.ch = text.length; d.txt.textContent = text; return; }
    d.i++; d.ch = 0; d.acc = 0; Sound.sfx('menu');
    if (d.i >= d.lines.length) { const cb = d.onDone; d.el.remove(); this.dlg = null; if (cb) cb(); return; }

  },
  updateDialog(dt) {
    const d = this.dlg; const v = Input.v;

    if (v.backP) { d.i = d.lines.length - 1; d.ch = 1e9; this.advanceDialog(); return; }
    const [who, text] = d.lines[d.i];
    if (d.ch < text.length) {
      d.acc += dt * [20, 34, 60][Settings.textSpeed];
      while (d.acc >= 1 && d.ch < text.length) { d.acc -= 1; const c = text[d.ch++]; if (d.ch % 2 === 0) Sound.blip(c, Object.assign({ question: text.trim().endsWith('?') }, VOICES[who])); }

  },
  bark(who, line) { // a one-line voice pop that doesn't block play
    const vo = VOICES[who]; let i = 0;
    const tick = () => { if (i < line.length) { if (i % 2 === 0) Sound.blip(line[i], vo); i++; setTimeout(tick, 40); } };
    tick();
    this.hint(`${vo.face} <b>${esc(vo.name)}:</b> ${esc(line)}`, 2.2, true);

  // ── HUD ──
  buildHUD() {

      <div class="tc"><div class="timer" id="hTimer"></div><div class="puffs" id="hPuffs"></div><div class="compass" id="hComp"><div class="arrow" id="hArrow"></div><div class="dist" id="hDist"></div></div></div>
      <div class="tr"><div class="score" id="hScore"></div><div style="font-size:18px" id="hStage"></div></div>
      <div class="bl"><div class="jumps" id="hJumps"><i></i><i></i><i></i></div><div class="alt" id="hAlt"></div></div>
      <div class="br"><div class="special" id="hSpecial"></div></div>
      <div class="bossbar hidden" id="hBoss"><div style="text-align:center;font-size:22px">BIG BUBBLER</div><div class="bar"><div class="fill" id="hBossFill"></div></div></div>
      <div id="hToast"></div><div id="hHint"></div><div id="hCount" class="screen hidden" style="pointer-events:none"></div><div id="hPops"></div>`;
    for (const id of ['hVig', 'hCross', 'hHearts', 'hLives', 'hRivals', 'hTimer', 'hPuffs', 'hComp', 'hArrow', 'hDist', 'hScore', 'hStage', 'hJumps', 'hAlt', 'hSpecial', 'hBoss', 'hBossFill', 'hToast', 'hHint', 'hCount', 'hPops']) this.h[id] = $(id);
    this.hudBuilt = true;
  },
  showHUD(on) { if (!this.hudBuilt) this.buildHUD(); $('hud').classList.toggle('hidden', !on); },
  toast(text, dur = 1.6, small = false) {
    if (!this.hudBuilt) return;

  },
  hint(html, dur = 6, raw = false) {

  flashSpecial() { this.specialFlash = 0.3; },
  popScore(n, pos) {
    if (!this.hudBuilt || !R.camera) return;

    const el = document.createElement('div');

  updateHUD(dt) {

    if (this.hintT > 0) { this.hintT -= dt; if (this.hintT <= 0) this.h.hHint.innerHTML = ''; }
    const p = Game.player; const h = this.h;

    const race = Game.mode === 'race';

      h.hRivals.innerHTML = rows.map((r, i) => `<div style="color:${r.a.color}">${i + 1}. ${esc(r.a.name)}${r.a === p ? ' ★' : ''} — ${r.a.done ? '🏁' : (r.a.remote ? r.a.nPuffs : r.a.puffs.filter(Boolean).length) + '/4'}</div>`).join('');

      else if (Number.isFinite(t) && t < 900) { h.hCount.classList.remove('hidden'); h.hCount.innerHTML = '<div class="countdown">GO!</div>'; if (this.lastCount !== 0) { this.lastCount = 0; Sound.sfx('count', 1); } }
      else if (!Number.isFinite(t)) { h.hCount.classList.remove('hidden'); h.hCount.innerHTML = '<div class="sub">Get ready…</div>'; }
      else h.hCount.classList.add('hidden');
    } else {
      h.hTimer.textContent = fmtTime(Game.time); h.hTimer.classList.toggle('low', Game.time <= 30); h.hRivals.innerHTML = ''; h.hCount.classList.add('hidden');
    }
    const boss = Game.boss;
    h.hBoss.classList.toggle('hidden', !boss || !boss.alive);
    if (boss) h.hBossFill.style.width = `${Math.max(0, ((boss.core - 1) + (boss.props[0] + boss.props[1]) / (2 * boss.propMax)) / 3) * 100}%`;
    const n = p.puffs.filter(Boolean).length;
    h.hPuffs.innerHTML = Game.puffs.length ? Game.puffs.map((_, i) => `<span class="${p.puffs[i] ? '' : 'off'}">☁️</span>`).join('') : '';
    h.hScore.textContent = race ? '' : String(Game.score).padStart(7, '0');
    h.hStage.textContent = Game.level ? `${Game.level.id} ${Game.level.name}` : '';
    // compass to nearest target
    const tgt = botTarget(p) || (boss && boss.alive ? boss.pos : null);
    h.hComp.style.visibility = tgt ? 'visible' : 'hidden';
    if (tgt) {
      const ang = Math.atan2(-(tgt.x - p.pos.x), -(tgt.z - p.pos.z));
