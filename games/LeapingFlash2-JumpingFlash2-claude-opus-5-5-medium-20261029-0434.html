      h.hArrow.style.borderBottomColor = n >= 4 ? '#4fe0b0' : '#ff5d8f';
      h.hDist.textContent = `${Math.round(tgt.distanceTo(p.pos))} m${tgt.y - p.pos.y > 4 ? ' ▲' : tgt.y - p.pos.y < -4 ? ' ▼' : ''}`;
    }
    const used = p.grounded ? 0 : Math.max(1, p.jumps);
    [...h.hJumps.children].forEach((el, i) => el.classList.toggle('used', i < used));
    h.hAlt.textContent = `ALT ${Math.max(0, Math.round(p.pos.y))} m`;
    const k = SPECIALS[p.sel];
    this.specialFlash = Math.max(0, this.specialFlash - dt);
    h.hSpecial.style.transform = this.specialFlash > 0 ? 'scale(1.15)' : '';
    h.hSpecial.innerHTML = race ? '' : `${SPECIAL_ICONS[k]} ${SPECIAL_NAMES[k]} <b>×${p.cheat ? '∞' : p.specials[k]}</b>`;
    h.hSpecial.style.display = race ? 'none' : '';
    const fp = Settings.camera === 'first';
    h.hCross.style.display = fp && !p.dead ? '' : 'none';
    if (fp) h.hCross.classList.toggle('lock', !!(Settings.aimAssist && assistTarget(p, aimDir(p))));
  },
};

// ───────────────────────────── online derby: the game's own lobby (outside AI Hub sessions only) ─────────────────────────────
// Star topology over WebRTC (PeerJS): the host's peer id is derived from a 4-letter room code; guests send to
// the host, which relays. A shared clock comes from ping/pong offsets. Names are seat labels, never typed text.
const SEATS = [['Red Rabbit', '#e8443a'], ['Blue Rabbit', '#3b82f6'], ['Green Rabbit', '#22c55e'], ['Gold Rabbit', '#f5b700']];
const CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const PeerNet = {
  Peer: null, peer: null, conns: new Map(), hostConn: null, isHost: false, me: 0, players: [], handlers: {}, offset: 0, bestRtt: 1e9,
  startAt: null, seed: 0, code: '', status: '', started: false, pingTimer: null,
  async lib() {
    if (!this.Peer) { const m = await import('peerjs'); this.Peer = m.Peer || (m.default && (m.default.Peer || m.default)); }
    return this.Peer;
  },
  on(t, f) { (this.handlers[t] = this.handlers[t] || []).push(f); },
  emit(t, ...a) { for (const f of this.handlers[t] || []) f(...a); },
  now() { return performance.now() + (this.isHost ? 0 : this.offset); },
  time() { return this.startAt == null ? -Infinity : this.now() - this.startAt; },
  progress() { /* standings are shown locally at the end of an online race */ },
  result() { /* the 'done' message carries the finish time to everyone */ },
  roster() { return this.players.map((p) => ({ ...p })); },
  setStatus(s) { this.status = s; this.emit('status', s); },
  openPeer(id) {
    return new Promise((res, rej) => {
      const P = this.Peer; const peer = id ? new P(id) : new P();
      const to = setTimeout(() => rej(new Error('The matchmaking server did not answer.')), 12000);
      peer.on('open', () => { clearTimeout(to); res(peer); });
      peer.on('error', (e) => { clearTimeout(to); rej(e); });
    });
  },
  async host() {
    this.leave(); this.isHost = true; this.me = 0; this.started = false;
    this.setStatus('Opening a room…');
    await this.lib();
    for (let tries = 0; tries < 4 && !this.peer; tries++) {
      this.code = Array.from({ length: 4 }, () => CODE_ABC[Math.floor(Math.random() * CODE_ABC.length)]).join('');
      try { this.peer = await this.openPeer('lf2derby-' + this.code); } catch (e) { if (e.type !== 'unavailable-id') throw e; }
    }
    if (!this.peer) throw new Error('Could not open a room.');
    this.players = [{ id: 0, name: SEATS[0][0], color: SEATS[0][1] }];
    this.peer.on('connection', (c) => this.onGuest(c));
    this.peer.on('disconnected', () => this.setStatus('Lost the matchmaking server — guests already in the room stay connected.'));
    this.setStatus('Room open! Share the code.');
    this.emit('roster');
  },
  onGuest(conn) {
    conn.on('open', () => {
      const free = [1, 2, 3].find((i) => !this.players.some((p) => p.id === i));
      if (this.started || free === undefined) { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 300); return; }
      const id = free; conn.lf2id = id;
      this.conns.set(id, conn);
      this.players.push({ id, name: SEATS[id][0], color: SEATS[id][1] }); this.players.sort((a, b) => a.id - b.id);
      conn.send({ t: 'welcome', me: id });
      this.broadcast({ t: 'roster', players: this.players });
      this.emit('roster'); Sound.sfx('confirm');
    });
    conn.on('data', (d) => this.hostRecv(conn.lf2id, d));
    conn.on('close', () => this.dropGuest(conn.lf2id));
    conn.on('error', () => this.dropGuest(conn.lf2id));
  },
  dropGuest(id) {
    if (id == null || !this.conns.has(id)) return;
    this.conns.delete(id); this.players = this.players.filter((p) => p.id !== id);
    this.broadcast({ t: 'leave', id }); this.broadcast({ t: 'roster', players: this.players });
    this.emit('leave', { id }); this.emit('roster');
  },
  broadcast(m, except) { for (const [id, c] of this.conns) if (id !== except && c.open) c.send(m); },
  hostRecv(from, d) {
    if (!d || typeof d !== 'object' || from == null) return;
    if (d.t === 'ping') { const c = this.conns.get(from); if (c && c.open) c.send({ t: 'pong', c: d.c, h: performance.now() }); return; }
    if (d.t === 'relay') {
      const env = { t: 'relay', from, data: d.data };
      if (d.to == null) { this.emit('message', d.data, from); this.broadcast(env, from); }
      else if (d.to === 0) this.emit('message', d.data, from);
      else { const c = this.conns.get(d.to); if (c && c.open) c.send(env); }
    }
  },
  async join(code) {
    this.leave(); this.isHost = false; this.started = false; this.code = code;
    this.setStatus(`Looking for room ${code}…`);
    await this.lib();
    this.peer = await this.openPeer();
    await new Promise((res, rej) => {
      const conn = this.peer.connect('lf2derby-' + code, { reliable: true });
      const to = setTimeout(() => rej(new Error(`No room called ${code} answered.`)), 12000);
      this.peer.on('error', (e) => { clearTimeout(to); rej(new Error(e.type === 'peer-unavailable' ? `No room called ${code}.` : String(e.message || e))); });
      conn.on('open', () => { clearTimeout(to); this.hostConn = conn; res(); });
      conn.on('data', (d) => this.guestRecv(d));
      conn.on('close', () => { if (this.hostConn === conn) { this.hostConn = null; this.emit('host-left'); } });
    });
    this.pingTimer = setInterval(() => { if (this.hostConn && this.hostConn.open) this.hostConn.send({ t: 'ping', c: performance.now() }); }, 700);
    this.setStatus('Joined! Waiting for the host to start…');
  },
  guestRecv(d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'welcome') { this.me = d.me; this.emit('roster'); }
    else if (d.t === 'roster') { this.players = d.players; this.emit('roster'); }
    else if (d.t === 'full') { this.setStatus('That room is full or already racing.'); this.emit('full'); }
    else if (d.t === 'pong') { const now = performance.now(); const rtt = now - d.c; if (rtt <= this.bestRtt * 1.5) { this.bestRtt = Math.min(this.bestRtt, rtt); this.offset = d.h + rtt / 2 - now; } }
    else if (d.t === 'start') { this.seed = d.seed; this.startAt = d.startAt; this.players = d.players; this.started = true; this.emit('start'); }
    else if (d.t === 'leave') this.emit('leave', { id: d.id });
    else if (d.t === 'relay') this.emit('message', d.data, d.from);
  },
  send(data, opts = {}) {
    if (this.isHost) { const env = { t: 'relay', from: 0, data }; if (opts.to == null) this.broadcast(env); else { const c = this.conns.get(opts.to); if (c && c.open) c.send(env); } }
    else if (this.hostConn && this.hostConn.open) this.hostConn.send({ t: 'relay', to: opts.to ?? null, data });
    return true;
  },
  startRace() {
    if (!this.isHost) return;
    this.seed = (Math.random() * 2 ** 32) >>> 0; this.startAt = performance.now() + 4000; this.started = true;
    this.broadcast({ t: 'start', seed: this.seed, startAt: this.startAt, players: this.players });
    this.emit('start');
  },
  leave() {
    if (this.pingTimer) clearInterval(this.pingTimer);
    this.pingTimer = null;
    try { if (this.peer) this.peer.destroy(); } catch (e) { /* already gone */ }
    Object.assign(this, { peer: null, hostConn: null, conns: new Map(), players: [], startAt: null, started: false, offset: 0, bestRtt: 1e9 });
  },
};
// one-time wiring: lobby → race, and the host dropping out mid-race
PeerNet.on('start', () => {
  UI.clear(); Sound.init();
  Net.startRace({ mode: 'peer', tx: PeerNet, players: PeerNet.roster(), me: PeerNet.me, rng: seededRng(PeerNet.seed ^ 0x9e3779b9) });
});
PeerNet.on('host-left', () => {
  if (Net.mode === 'peer' && Game.state === 'race') { UI.toast('The host left — race over', 2.5); Net.ended = true; raceOver(); }
  else if (UI.stack.some((p) => p.id === 'lobby')) { UI.clear(); UI.title(); UI.online(); UI.toast('The host closed the room', 2.5, true); }
});

// ── lobby screens (controller-first: no text typing needed) ──
Object.assign(UI, {
  online() {
    this.push({ id: 'online', items: [
      { label: 'Host a Room', desc: 'Get a 4-letter code for up to 3 friends', action: () => this.lobby(true) },
      { label: 'Join a Room', desc: "Enter a friend's room code", action: () => this.joinCode() },
    ], html: () => '<div class="title-h">Online Derby</div><div class="sub" style="margin-bottom:20px">Same course, real rivals, first to the warp pad wins.</div><div class="menu-slot"></div>',
    onBack: () => this.pop() });
  },
  lobby(asHost, code) {
    const panel = { id: 'lobby', err: '',
      items: asHost ? [{ label: 'Start Race', desc: 'Needs at least 2 rabbits', action: () => { if (PeerNet.players.length >= 2) PeerNet.startRace(); else { Sound.sfx('back'); this.toastLobby('Wait for at least one friend to join'); } } }, { label: 'Close Room', action: () => leave() }]
        : [{ label: 'Leave Room', action: () => leave() }],
      html: () => `<div class="title-h">${asHost ? 'Your Room' : 'Room'}</div>
        <div class="card" style="text-align:center;min-width:min(80vw,560px)"><div class="sub">Room code</div><div class="big" style="letter-spacing:.2em">${esc(PeerNet.code || '····')}</div>
        <div style="margin:14px 0">${PeerNet.players.map((p) => `<div style="color:${p.color};font-weight:800">● ${esc(p.name)}${p.id === PeerNet.me ? ' (you)' : ''}</div>`).join('') || '—'}</div>
        <div class="sub" style="font-size:20px">${esc(panel.err || PeerNet.status)}</div></div><div class="menu-slot" style="margin-top:18px"></div>`,
      onBack: () => leave() };
    const leave = () => { PeerNet.leave(); this.pop(); };
    this.push(panel);
    const refresh = () => { if (this.stack[this.stack.length - 1] === panel) this.render(); };
    if (!this.lobbyWired) { this.lobbyWired = true; PeerNet.on('roster', () => this.refreshLobby()); PeerNet.on('status', () => this.refreshLobby()); }
    this.refreshLobby = refresh;
    const fail = (e) => { panel.err = 'Could not connect: ' + (e && e.message ? e.message : e); refresh(); };
    (asHost ? PeerNet.host() : PeerNet.join(code)).then(refresh, fail);
  },
  toastLobby(text) { this.toast(text, 1.6, true); },
  joinCode() {
    const letters = ['A', 'A', 'A', 'A']; let at = 0;
    const panel = { id: 'join',
      html: () => `<div class="title-h">Join a Room</div><div class="card" style="text-align:center"><div class="sub">Enter the room code</div>
        <div style="display:flex;gap:18px;justify-content:center;margin:18px 0">${letters.map((l, i) => `<div class="big" style="width:1.1em;border-bottom:6px solid ${i === at ? 'var(--sun)' : '#3a2a5c'}">${l}</div>`).join('')}</div>
        <div style="font-size:20px">⬆⬇ change letter · ⬅➡ move · type letters on a keyboard</div></div>`,
      prompts: '<span>{OK} Join</span><span>{BACK} Back</span>',
      update: () => {
        const v = Input.v; let ch = false; const typing = Input.typed.length > 0;
        if (typing) { /* typed letters win over WASD navigation this frame */ } else if (v.up || v.down) { const k = CODE_ABC.indexOf(letters[at]); letters[at] = CODE_ABC[(k + (v.up ? 1 : CODE_ABC.length - 1)) % CODE_ABC.length]; ch = true; }
        if (!typing && (v.left || v.right)) { at = (at + (v.right ? 1 : 3)) % 4; ch = true; }
        for (const c of Input.typed) { const L = c.toUpperCase(); if (CODE_ABC.includes(L)) { letters[at] = L; at = Math.min(3, at + 1); ch = true; } }
        Input.typed.length = 0;
        if (ch) { Sound.sfx('menu'); this.render(); }
      },
      onConfirm: () => { this.pop(); this.lobby(false, letters.join('')); },
      onBack: () => this.pop() };
    Input.typed.length = 0;
    this.push(panel);
  },
});

// ───────────────────────────── boot ─────────────────────────────
AIHub.probe(() => {
  const st = Game.state; const v = Input.v;
  const t = Game.mode === 'race' ? raceElapsed() : 0;
  const scene = st === 'title' || st === 'attract' || st === 'boot' ? (UI.stack.length > 1 ? 'menu' : 'title')
    : st === 'intro' || (st === 'race' && !(t >= 0)) ? 'ready'
      : st === 'results' || st === 'gameover' || Net.ended ? 'over' : 'play';
  const r2 = (x) => Math.round(x * 100) / 100;
  // read held keys and the pad live too, so a slow frame never hides the controls from the harness
  const K = Input.keys; const pad = navigator.getGamepads ? [...navigator.getGamepads()].find((q) => q && q.connected) : null;
  const btn = (i) => !!(pad && pad.buttons[i] && (pad.buttons[i].pressed || pad.buttons[i].value > 0.5));
  let x = v.mx, y = v.my;
  if (!x) x = (K.has('KeyD') || K.has('ArrowRight') ? 1 : 0) - (K.has('KeyA') || K.has('ArrowLeft') ? 1 : 0) || (pad ? dz(pad.axes[0] || 0) * (Settings.invertX ? -1 : 1) : 0);
  if (!y) y = (K.has('KeyS') ? 1 : 0) - (K.has('KeyW') ? 1 : 0) || (pad ? dz(pad.axes[1] || 0) * (Settings.invertY ? -1 : 1) : 0);
  return { scene, menu: UI.menuOpen(), world: Math.round(Game.simTime * 1000) / 1000, input: { x: r2(x), y: r2(y), jump: !!v.jump || K.has('Space') || btn(0), fire: !!v.fire || K.has('KeyJ') || btn(2) || btn(7) } };
});

async function boot() {
