function ship(x,y,z,size,color,bank=0,enemy=false){let p=proj(x,y,z);g.save();g.translate(p.x,p.y);g.scale(p.k*size,p.k*size);g.rotate(bank);g.shadowColor=color;g.shadowBlur=12;g.fillStyle=color;g.beginPath();g.moveTo(0,-30);g.lineTo(17,-2);g.lineTo(67,19);g.lineTo(56,29);g.lineTo(12,18);g.lineTo(0,29);g.lineTo(-12,18);g.lineTo(-56,29);g.lineTo(-67,19);g.lineTo(-17,-2);g.closePath();g.fill();g.shadowBlur=0;g.fillStyle=enemy?'#392936':'#324e6e';g.beginPath();g.moveTo(0,-23);g.lineTo(12,19);g.lineTo(0,12);g.lineTo(-12,19);g.fill();g.fillStyle='#8ffcff';g.fillRect(-4,-10,8,18);g.fillStyle=enemy?'#ff756e':'#79eaff';g.beginPath();g.moveTo(-14,23);g.lineTo(-5,23);g.lineTo(-9,40+Math.random()*20);g.fill();g.beginPath();g.moveTo(5,23);g.lineTo(14,23);g.lineTo(9,40+Math.random()*20);g.fill();g.restore()}

let items=[...hazards.map(e=>({...e,render:'hazard'})),...enemies.map(e=>({...e,render:'enemy'})),...rings.map(e=>({...e,render:'ring'})),...enemyShots.map(e=>({...e,render:'bullet'})),...sparks.map(e=>({...e,render:'spark'})),...shots.map(e=>({...e,render:'laser'}))].sort((a,b)=>b.z-a.z);
if(boss){let b=boss;poly([[b.x-410,-180,b.z],[b.x+410,-180,b.z],[b.x+520,150,b.z],[b.x-520,150,b.z]],'#30425c','#8ba7ba');poly([[b.x-280,-180,b.z],[b.x+280,-180,b.z],[b.x+160,-310,b.z+100],[b.x-160,-310,b.z+100]],'#1c2b43','#57748e');boss.parts.forEach(p=>{let a=proj(b.x+p.x,p.y,b.z-40);g.fillStyle=p.hp<=0?'#171d30':p.x===0&&!boss.phase?'#71c5d6':'#ff9c63';g.shadowBlur=24;g.shadowColor=g.fillStyle;g.beginPath();g.arc(a.x,a.y,p.r*a.k*.7,0,7);g.fill();g.shadowBlur=0;g.strokeStyle='#95e8ff';g.lineWidth=2;g.strokeRect(a.x-p.r*a.k,a.y-p.r*a.k,p.r*a.k*2,p.r*a.k*2)})}
items.forEach(e=>{if(e.z<-150)return;let p=proj(e.x,e.y,e.z);if(e.render==='hazard'){g.fillStyle='#324959';g.strokeStyle='#c49a76';g.lineWidth=2;g.beginPath();for(let i=0;i<7;i++){let an=i/7*Math.PI*2,rr=e.r*p.k*(.8+(i%2)*.25);let xx=p.x+Math.cos(an)*rr,yy=p.y+Math.sin(an)*rr;i?g.lineTo(xx,yy):g.moveTo(xx,yy)}g.closePath();g.fill();g.stroke();g.strokeStyle='#ffba7366';g.beginPath();g.arc(p.x,p.y,e.r*p.k+7,0,7);g.stroke()}if(e.render==='enemy'){ship(e.x,e.y,e.z,e.kind==='ace'?1.3:1,'#e5848b',Math.sin(t+e.phase)*.2,true);if(e.lock>.2){g.strokeStyle=e.lock>.8?'#ffd175':'#78dfff';g.lineWidth=2;g.strokeRect(p.x-28,p.y-28,56,56);g.fillStyle=g.strokeStyle;g.font='12px Arial';g.fillText(e.lock>.8?'LOCK':'TRACK',p.x-20,p.y-36)}}if(e.render==='ring'){g.strokeStyle=e.type==='health'?'#82ffd3':'#ffd48b';g.lineWidth=9*p.k;g.shadowBlur=16;g.shadowColor=g.strokeStyle;g.beginPath();g.ellipse(p.x,p.y,90*p.k,90*p.k,0,0,7);g.stroke();g.shadowBlur=0;g.fillStyle='#e8ffff';g.font=`${Math.max(12,22*p.k)}px Arial`;g.fillText('+',p.x-7,p.y+6)}if(e.render==='bullet'){g.fillStyle='#ff8c80';g.shadowColor='#ff544f';g.shadowBlur=16;g.beginPath();g.arc(p.x,p.y,Math.max(3,10*p.k),0,7);g.fill();g.shadowBlur=0}if(e.render==='laser')line(e.x,e.y,e.z,e.x,e.y,e.z-130,'#9ffff0',Math.max(1,p.k*4));if(e.render==='spark'){g.globalAlpha=Math.min(1,e.life*2);g.fillStyle=e.col;g.fillRect(p.x,p.y,Math.max(2,5*p.k),Math.max(2,5*p.k));g.globalAlpha=1}});
