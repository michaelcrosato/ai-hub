<!--
Ghost Bustlers — a spiritual successor to Ghostbusters (1984)

== Source Information ==
Date: 2026-11-01 18:43
Source: Ghostbusters (1984, dir. Ivan Reitman) — a famous movie. Ghost Bustlers is an original spiritual successor: new characters, new city locations, new ghosts, original music and writing in the movie's deadpan, wisecracking, small-business-in-over-its-head tone.
Genre and Perspective: co-op third-person action ("ghost wrangling") with a light business layer (bounties, collateral damage, upgrades). Main view: over-the-shoulder perspective camera. Switchable any time to first person (perspective camera) or top-down tactical (orthographic camera).
Tech: Three.js r180 (WebGPURenderer — WebGPU with automatic WebGL 2 fallback — TSL node materials, PostProcessing + BloomNode), Rapier 3D 0.19.3 (@dimforge/rapier3d-compat: rigid bodies, kinematic character controller, spherical joints, contact-force events, ray/shape queries), Web Audio API, Gamepad API (incl. vibration), Pointer Lock. Plain ES modules bundled with Bun 1.3 into one HTML file; three and Rapier load from the jsDelivr CDN. AI Hub Session Protocol v1 client 1.3.0.
Art Direction: the engine-native look — Three.js PBR standard/physical materials on primitive geometry, canvas-generated textures, real-time lights and soft shadows, TSL shaders for ghosts (fresnel glow, vertex wobble), streams, trap cones, the portal and the storm sky, plus bloom.
Animation: the engine-native system — THREE.AnimationMixer with keyframe clips (QuaternionKeyframeTrack/VectorKeyframeTrack) on jointed rigs, two layers (lower/upper body) with cross-fades; ghosts and the giant use mixer clips too.
Audio: all code-written Web Audio: a step sequencer with synthesized bass, organ, pads, choir, bells, a theremin lead and drums (five original tracks with adaptive intensity layers); synthesized SFX (stream hum, crackle, traps, slams, explosions, slime, UI); Animalese-style gibberish voices from formant-filtered oscillators, one voice per character.
Online: AI Hub sessions, co-op mode, 1–4 players: the host runs the shared ballroom (ghosts, props, traps, score) and sends snapshots at 15 Hz; every copy moves its own Bustler; interpolation, reliable events, leave handling, server-hosted rounds, standings/stats/awards. Outside a session: single-player story and Ghost Rush with AI partners. No other network features.
Testing: headless Chromium (Playwright) with SwiftShader WebGPU/WebGL; scripted smoke tests per level and per mode, screenshots, console-error checks, and the AI Hub harness (harness.html) in co-op at 1–4 players, host-leave and server scenarios.
Research: none beyond reading the AI Hub protocol README, harness and example, and checking the three r180 / Rapier 0.19.3 APIs in their packages.
Environment: Claude Code CLI (headless); Linux; browser unknown
Model: Anthropic, claude-opus-5-5, reasoning effort xhigh
Usage: unknown (no reliable token or cost estimate is available inside the session)

== Testing Feedback ==
How many issues did testing catch? 26. Examples: PKE scans that reset every frame, a job board that locked every job, stage bookkeeping that broke progression, point lights added at runtime forcing every material to recompile (multi-second stalls), a finale portal check that could never fire, a top-down view blocked by ceilings, three AI Hub conformance failures (ready waiting on a timer, the world stalling behind slow renders, the first copy starving the others while compiling shaders), plus UI overlaps, blown-out bloom and menu focus/touch-gate issues.
How many were critical / game breaking? 9 (the scan reset, the locked job board, stage progression, the shader-recompile stalls, the portal check, the blocked top-down view, and the three hub conformance failures).
Most helpful test: letting the attract-mode AI play the local Bustler ("autopilot") through every level with a fast-forward hook, then asserting on game state (objective text, captures, story stage) and screenshots — plus the AI Hub harness at 1–4 players, host-leave and server scenarios.
Least helpful test: fixed-length gamepad taps and fixed sleeps in headless Chromium — software rendering runs at ~1 frame a second there, so they produced false failures until every step waited on a condition.

== Engine Feedback ==
What I liked most: WebGPURenderer + TSL. One node graph gives fresnel ghosts, wobbling vertices, scrolling trap cones and a churning sky, and the same code runs on WebGPU or WebGL 2. Rapier's kinematic character controller (autostep, snap-to-ground, pushing props) did a lot for free.
Did I get stuck or guess wrong? Small things: smoothstep with reversed edges is undefined in WGSL, so I rewrote those as oneMinus; Rapier hits now use timeOfImpact; headless screenshots of a WebGPU canvas are blank.
Most important thing I built myself: the ghost-wrangling loop — tether, pull-against-the-bolt, slam, trap capture — and the stream renderer (CPU-built tubes with a TSL material).
Hardest part: there is no animation authoring path for procedural rigs, so every clip is hand-typed Euler keyframes, and layering upper/lower body needs a split rig because AnimationMixer blends by weight, not by mask.
Overhaul one thing: post-processing setup. Swapping cameras or scenes in a pass node is undocumented, and toggling shadows needs material recompiles.
Change one thing: built-in billboarded particle and trail/tube primitives for WebGPU that update on the GPU.

== Prompt Feedback ==
What I liked most: the freedom to pick the movie and genre, plus concrete constraints (engine versions, controller-first UX, attract mode, hub protocol) that make the result testable.
What was confusing: "pick a famous movie" is substituted literally into SOURCE throughout, and "Multiplayer: follow lib/hub for ai-hub as well as for the game on its own" can be read as either "hub only" or "also add standalone multiplayer".
Hardest thing: fitting a full campaign, a co-op netcode path and attract mode into one vertical slice while keeping every feature finished.
One test I wish I could run: a real DualSense on real hardware across Chrome and Firefox, to verify the standard mapping, the inverted-axis quick fix and rumble.

      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.

      } catch (e) {

      }
    }

  // a generator seeded by the hub, so every copy builds the same start.

  var seededRandom = null;

    hub.seeded = true;
  }

  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.

    var asks = function (on) {

        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };

    } catch (e) {}
  }

   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.

    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */

  /** A plain JSON copy, or undefined when it is not JSON. */

    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;

      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);

      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }

    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);

      emit(m.type, [detail]);

    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];

    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {

        warn('no hub answered; playing normally');
        done(null);
        return;

    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */

    if (!welcomed || ended || reported || !p || !finite(p.score)) return;

    probeFn = typeof fn === 'function' ? fn : null;

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {

    }
  };

    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

function sky(world, top, bottom) {

  moon.position.set(-160, 190, -320);
  world.scene.add(moon);

function cityBlock(k, rng, x0, x1, z0, z1, n, hMin, hMax, baseY = 0) {
  const g = new THREE10.BoxGeometry(1, 1, 1);
  const m2 = mat("windows");
  const mesh2 = new THREE10.InstancedMesh(g, m2, n);
  const M3 = new THREE10.Matrix4;
  for (let i = 0;i < n; i++) {
    const w = 8 + rng() * 14, d = 8 + rng() * 14, h = hMin + rng() * (hMax - hMin);
    const x = x0 + rng() * (x1 - x0), z = z0 + rng() * (z1 - z0);
    M3.compose(V3(x, baseY + h / 2, z), new THREE10.Quaternion, V3(w, h, d));
    mesh2.setMatrixAt(i, M3);
  }
  mesh2.receiveShadow = true;
  k.scene.add(mesh2);
  return mesh2;
}

  constructor(world, form) {

  setState(s) {

      this.w.sfx("roar", this.weakPos, { pitch: this.def.voicePitch * 0.8 });
    }
    if (s === "fight")
      this.play("idle");
    if (s === "hurt") {

  step(dt) {
    if (this.dead)
      return;
    this.stateT += dt;
    const w = this.w;
    if (this.state === "rising") {
      this.rise = clamp(this.stateT / 6, 0, 1);

      } catch {}

  }

var STOP = Symbol("stop");

class Director {
  constructor(game, world) {
    this.g = game;
    this.w = world;
    this.waits = [];
    this.dead = false;
    this.skipping = false;
    this.inCutscene = false;
    this.offs = [];
    this.barkT = 0;
    this.lineActive = false;
  }
  _wait(check) {
    if (this.dead)
      return Promise.reject(STOP);
    return new Promise((res, rej) => this.waits.push({ check, res, rej }));
  }
  update(dt) {
    if (this.barkT > 0) {
      this.barkT -= dt;
      if (this.barkT <= 0 && !this.lineActive)
        UI.dialog(null);
    }
    const ws = this.waits;
    this.waits = [];
    for (const w of ws) {
      let done = false;
      try {
        done = w.check(dt);
      } catch (e) {
        w.rej(e);
        continue;
      }
      if (done)
        w.res(done);
      else
        this.waits.push(w);
    }
  }
  kill() {
    this.dead = true;
    for (const w of this.waits)
      w.rej(STOP);
    this.waits = [];
    for (const off of this.offs)
      off();
    this.offs = [];
    UI.dialog(null);
  }
  run(fn) {
    fn(this, this.g).catch((e) => {
      if (e !== STOP)
        console.error("script error", e);
    });
  }
  wait(sec) {
    let t = 0;
    return this._wait((dt) => this.skipping && this.inCutscene || (t += dt) >= sec);
  }
  until(fn) {
    return this._wait(() => fn());
  }
  event(name, filter = () => true) {
    let hit = null;
    const off = this.w.on(name, (...a) => {
      if (!hit && filter(...a))
        hit = a;
    });
    this.offs.push(off);
    return this._wait(() => hit).then((a) => {
      off();
      return a;
    });
  }
  async say(who, text, o = {}) {
    if (this.dead)
      throw STOP;
    if (this.skipping && this.inCutscene)
      return;
    this.lineActive = true;
    UI.dialog(who, text, o.color);
    const SP = { teddy: "teddy", vera: "vera", rudy: "rudy", dolores: "dolores", pruitt: "pruitt", landlord: "landlord", hush: "hush", gulper: "ghost", narrator: "narrator", rookie: "rookie" };
    const dur = audio.speak(text, SP[who] || "ghost");
    let t = 0;
    const min = Math.min(0.6, dur);
    await this._wait((dt) => {
      t += dt;
      return this.skipping && this.inCutscene || t > dur + 0.9 || t > min && input.pressed("confirm") && !this.g.menuOpen;
    });
    this.lineActive = false;
    UI.dialog(null);
  }
  bark(who, text) {
    if (this.lineActive)
      return;
    UI.dialog(who, text);
    audio.speak(text, { gulper: "ghost" }[who] || who);
    this.barkT = Math.max(2.2, text.length * 0.06);
  }
  objective(title, text) {
    UI.objective(title, text);
    this.g.objective = text;
  }
  tip(text) {
    UI.tip(text);
  }
  cutscene(on) {
    this.inCutscene = on;
    if (!on)
      this.skipping = false;
    this.g.setCutscene(on);
  }
  shot(s) {
    this.g.cam.shot(s);
  }
  endShot() {
    this.g.cam.clearShot();
  }
  banner(a, b) {
    UI.banner(a, b);
  }
  music(n) {
    audio.music(n);
  }
  spawn(type, pos, opts) {
    return this.w.addGhost(type, pos, opts);
  }
  captured(g) {
    return this.until(() => !this.w.ghosts.includes(g));

async function countCaptures(D, list, label, title) {
  const total = list.length;
  const update = () => {
    const n = list.filter((g) => !D.w.ghosts.includes(g)).length;
    D.objective(title, `${label} (${n}/${total})`);
    return n >= total;
  };
  update();
  const off = D.w.on("captured", update);
  D.offs.push(off);
  await D.until(() => list.every((g) => !D.w.ghosts.includes(g)));
  off();
}

function openSettings(back, tab = 0) {
  const tabs = ["Audio", "Controls", "Camera", "Video", "Accessibility"];
  const fields = SCHEMA.filter((s) => s.tab === tabs[tab]);

    const it = { label: f.label, hint: f.hint || "" };

      it.value = () => settings[f.key] ? "On" : "Off";
      it.left = it.right = () => apply(f.key, !settings[f.key]);
    } else if (f.type === "range") {
      it.value = () => f.max <= 1 ? Math.round(settings[f.key] * 100) + "%" : String(Math.round(settings[f.key] * 10) / 10);
      it.meter = () => (settings[f.key] - f.min) / (f.max - f.min);
      it.left = () => apply(f.key, clamp(Math.round((settings[f.key] - f.step) * 100) / 100, f.min, f.max));
      it.right = () => apply(f.key, clamp(Math.round((settings[f.key] + f.step) * 100) / 100, f.min, f.max));
    } else if (f.type === "enum") {
      const idx = () => f.options.indexOf(settings[f.key]);
      it.value = () => f.names[Math.max(0, idx())];
      it.left = () => apply(f.key, f.options[(idx() + f.options.length - 1) % f.options.length]);
      it.right = () => apply(f.key, f.options[(idx() + 1) % f.options.length]);
    }
    return it;
  });
  if (tab === 1)
    items.push({ label: "Reset all settings", hint: "Back to defaults (keeps your save).", action: () => {
      resetSettings();
      openSettings(back, tab);
    } });
  if (tab === 4)
    items.push({ label: "Erase save data", hint: "Deletes story progress, money, upgrades and the Field Guide.", action: () => confirmBox("Erase everything?", "This cannot be undone.", () => {
      resetSave();
      openSettings(back, tab);
    }, () => openSettings(back, tab)) });
  items.push({ label: "Back", action: back });
  UI.open({ title: "Settings", subtitle: "Changes save automatically.", tabs, tab, onTab: (d) => openSettings(back, (tab + d + tabs.length) % tabs.length), items, onBack: back, footer: [["confirm", "Select"], ["move", "Change"], ["back", "Back"]] });
}
function apply(key, v) {

e or overhaul one thing from engine, what woudl that be?\n- If you could change one thing about the engine, what would it be?\n\nPrompt Feedback \n\n- What did you like most about this prompt?\n- What was confusing? \n- What was the hardest thing to do? \n- If there was one test you could of run, what would that test be?\n","reply":"I built **Ghost Bustlers**, an original spiritual successor to *Ghostbusters* (1984), as a single 451 KB HTML file. It plays from title to credits with no console errors on both WebGPU and WebGL 2. The AI Hub test harness passes in every scenario the hub requires (1–4 players, a lossy network, the host leaving, and a server-hosted round).\n\n**Deliverable:** `GhostBustlers-Ghostbusters-claude-opus-5-5-xhigh-20261101-1843.html` in the folder root. three.js and Rapier load from the jsDelivr CDN, so the first launch needs internet. Source modules, build script and test tools are in the `GhostBustlers-…-1843/` subfolder.\n\n**What's in it**\n- **Story (\"Night One\"):** an intro, a tutorial in the firehouse practice pen, then three jobs (a hotel ballroom, a library, a rooftop finale). There are cutscenes, a business layer (bounties, an itemised collateral-damage bill, upgrades) and credits, then free play.\n- **Core loop:** you lock a stream onto a ghost and pull against the direction it bolts. You can slam it into the furniture, which costs you money. Once it's weak you drag it over a trap. Other tools: explosive darts, PKE goggles that reveal and scan hidden ghosts, and a \"perfect vent\" timing mechanic for heat. Crossing two streams causes a big explosion, except in the finale, where it is how you win.\n- **Finale:** the villain makes you choose the form of a 30-metre giant (rubber duck, gingerbread man or parade hot dog). You stagger it, then cross the streams at the portal.\n- **Views:** over-the-shoulder is the main one; first person and a top-down view are one button away.\n- **Attract mode:** starts after 10 seconds idle and cycles AI-played demos of all three levels; any input exits.\n- **Co-op (\"Ghost Rush\"):** works through AI Hub sessions, and also plays standalone with three AI partners.\n- **Controller-first UI:** PS5 button prompts that switch automatically between controller and keyboard. Settings include separate horizontal and vertical stick-invert toggles. Touch-only devices see \"Controller or keyboard required\" with a Settings button while the demo plays behind it.\n- **Audio:** five synthesized music tracks, all sound effects and gibberish voices are generated in code.\n\n**What I could not verify**\n- I couldn't hear the audio. It runs without errors, but music and voice quality are untested by ear.\n- The controller was an emulated pad, not a real DualSense, so rumble and real-pad axis behaviour are unconfirmed.\n- Headless software rendering runs at about one frame a second, so frame rate on real hardware is unmeasured. Before the first save, a session tops out at roughly 2 fps.\n- Balance comes from AI autopilot runs only. The autopilot breaks a lot of furniture, so I added a flat $600 call-out fee so every finished job pays enough for at least one upgrade.\n\n---\n\n## Source Information\n- **Date:** 2026-11-01 18:43\n- **Source:** Ghostbusters (1984). Ghost Bustlers is an original spiritual successor with its own characters, locations, ghosts, music and writing in the movie's deadpan tone.\n- **Genre and Perspective:** co-op third-person ghost-wrangling action with a light business layer. Main view is over-the-shoulder (perspective camera), switchable to first person (perspective) or top-down tactical (orthographic).\n- **Tech:** Three.js r180 WebGPURenderer (WebGPU, automatic WebGL 2 fallback) with TSL node materials and bloom post-processing; Rapier 0.19.3 (character controller, joints, contact-force events, queries); Web Audio; Gamepad API with vibration; Pointer Lock; AI Hub session client 1.3.0; bundled with Bun 1.3.\n- **Art Direction:** the engine's native look: PBR materials on primitive shapes, canvas-drawn textures, real-time lights and soft shadows, TSL shaders for ghosts, streams, trap cones, portal and sky, plus bloom.\n- **Animation:** the engine's native AnimationMixer with keyframe clips on jointed rigs, in two layers (upper and lower body) with cross-fades.\n- **Audio:** code-written music sequencer (five tracks with intensity layers), synthesized sound effects, and Animalese-style gibberish voices.\n- **Online:** AI Hub co-op sessions for 1–4 players. The host runs the shared world and sends snapshots at 15 Hz with reliable events; the game handles players leaving, server-hosted rounds, and reports standings, stats and awards. No other network features.\n- **Testing:** headless Chromium (Playwright) on a software GPU with WebGPU and WebGL 2; autopilot runs of every level with state checks and screenshots; controller-only and touch-device tests; the AI Hub harness in every scenario its README requires.\n- **Research:** none beyond the AI Hub README, harness and example, and the three r180 and Rapier 0.19.3 package APIs.\n- **Environment:** Claude Code CLI (headless); Linux; browser unknown\n- **Model:** Anthropic, claude-opus-5-5, reasoning effort xhigh\n- **Usage:** unknown (no reliable cost or token estimate is available inside the session)\n\n**Testing Feedback**\n- **Issues caught:** 26.\n- **Critical:** 9:\n  - PKE scans reset every frame, so hidden ghosts could never be revealed.\n  - The job board showed every job as locked.\n  - Story progression broke when a job started.\n  - Lights added at runtime forced every material to recompile, causing multi-second stalls.\n  - The finale's portal check could never fire.\n  - The top-down view was blocked by ceilings.\n  - Three AI Hub conformance failures, all in co-op sessions: ready() waited on a timer, the shared world stalled behind slow rendering, and the first copy to load starved the others.\n- **Most helpful test:** letting the AI autopilot play the player through every level with a fast-forward hook, checking game state at each step, plus the hub harness.\n- **Least helpful test:** fixed-length gamepad taps and fixed sleeps, which gave false failures at about one frame a second.\n\n## Engine Feedback\n- **What I liked most:** WebGPURenderer with TSL. One shader graph produced the ghosts, streams, portal and sky, and the same code runs on WebGPU or WebGL 2. Rapier's character controller (stepping up, snapping to ground, pushing props) did a lot for free.\n- **Got stuck or guessed wrong?** Reversed-edge `smoothstep` is undefined in WebGPU's shader language, so I rewrote those calls. I also wrongly assumed adding and removing lights at runtime was cheap; it recompiles every lit material.\n- **Most important thing I built myself:** the wrangling loop (tether, pull against the bolt, slam, trap capture) and a CPU-built stream tube with a TSL material.\n- **Hardest part:** there's no animation authoring path for code-built rigs, so every clip is hand-typed keyframes. Layering upper and lower body needed a split rig because AnimationMixer blends by weight, not by body-part mask.\n- **Remove or overhaul one thing:** the post-processing setup. Swapping a pass's camera is undocumented, and toggling shadows forces recompiles.\n- **Change one thing:** add built-in, GPU-updated billboard particles and trail/tube primitives for WebGPU.\n\n## Prompt Feedback\n- **What I liked most:** the free choice of movie and genre, paired with testable constraints (engine versions, controller-first UI, attract mode, the hub protocol).\n- **What was confusing:** \"pick a famous movie\" is pasted literally wherever SOURCE appears. \"Follow lib/hub… as well as for the game on its own\" can mean \"hub only\" or \"also add standalone multiplayer\"; I did hub co-op plus standalone co-op with AI partners.\n- **Hardest thing:** fitting a full campaign, co-op networking and attract mode into one vertical slice with every feature finished.\n- **One test I
