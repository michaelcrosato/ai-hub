    animate(dt){this.time+=dt;const motion=!this.game.s.settings.reducedMotion;let dx=0,dz=0;const modalOpen=!document.getElementById('modal-shade').hidden;
      if(!modalOpen&&!this.game.s.activeDate){const forward=(this.keys.has('w')||this.keys.has('arrowup')?1:0)-(this.keys.has('s')||this.keys.has('arrowdown')?1:0),right=(this.keys.has('d')||this.keys.has('arrowright')?1:0)-(this.keys.has('a')||this.keys.has('arrowleft')?1:0);if(forward||right){dx=-Math.sin(this.yaw)*forward+Math.cos(this.yaw)*right;dz=-Math.cos(this.yaw)*forward-Math.sin(this.yaw)*right;const l=Math.hypot(dx,dz);dx=dx/l*dt*4;dz=dz/l*dt*4;this.destination.hidden=true;this.routeDots.forEach(d=>d.hidden=true);}else if(this.path.length){const p=this.path[0],x=p.x-this.player.x,z=p.z-this.player.z,dist=Math.hypot(x,z);if(dist<.16){this.path.shift();this.updateRoute();if(!this.path.length){const intent=this.intent;this.intent=null;this.destination.hidden=true;this.routeDots.forEach(d=>d.hidden=true);if(intent)setTimeout(()=>this.callbacks.arrive?.(intent),0);}}else{const step=Math.min(dist,dt*4);dx=x/dist*step;dz=z/dist*step;}}}
      this.isWalking=!!(dx||dz);if(this.isWalking){if(this.walkable(this.player.x+dx,this.player.z+dz)){this.player.x+=dx;this.player.z+=dz;}else if(this.walkable(this.player.x+dx,this.player.z))this.player.x+=dx;else if(this.walkable(this.player.x,this.player.z+dz))this.player.z+=dz;this.player.rotation=Math.atan2(dx,dz);}
      this.game.s.avatar.x=this.player.x;this.game.s.avatar.z=this.player.z;this.player.y=this.isWalking&&motion?Math.abs(Math.sin(this.time*12))*.045:0;
      this.player.limbs.forEach((l,i)=>l.y=.32+(this.isWalking&&motion?Math.sin(this.time*12+i*Math.PI)*.09:0));this.playerMarker.rotation=motion?this.time*.9:0;
      if(motion){for(const n of this.npcs){n.g[n.axis]=n[n.axis]+Math.sin(this.time*.2+n.phase)*n.span;n.g.rotation=n.axis==='x'?Math.cos(this.time*.2+n.phase)>0?Math.PI/2:-Math.PI/2:Math.cos(this.time*.2+n.phase)>0?0:Math.PI;n.g.y=Math.abs(Math.sin(this.time*8+n.phase))*.025;}this.car.x=((this.time*1.3+4)%35)-19;this.car2.x=15-((this.time*1.05+20)%34);}
      const active=this.game.s.activeDate;this.dateCompanion.hidden=!active;if(active){const b=this.game.s.bookings.find(b=>b.id===active.bookingId),v=VENUES[b.venue];this.dateCompanion.x=v.x+.75;this.dateCompanion.z=v.z;this.dateCompanion.rotation=-Math.PI/2;this.player.rotation=Math.PI/2;}
    }
    start(){const tick=now=>{const dt=Math.min((now-(this.lastTime||now))/1000,.05);this.lastTime=now;this.animate(dt);if(this.renderer==='babylon')this.syncBabylon();else if(now-this.lastPaint>33){this.paintSoftware();this.lastPaint=now;}if(this.frame++%3===0)this.callbacks.labels?.(this);this.callbacks.tick?.(dt);this.raf=requestAnimationFrame(tick);};this.raf=requestAnimationFrame(tick);}
    rotate(dir){this.yaw+=dir*Math.PI/2;this.updateBabylonCamera();}
    adjustZoom(dir){this.zoom=clamp(this.zoom+dir*.12,.65,1.7);this.resize();}
    resetCamera(){this.yaw=-Math.PI/4;this.zoom=1;this.resize();}
    rebuild(){if(this.scene){for(const s of this.shapes)s.mesh?.dispose();for(const g of this.groups)g.node?.dispose();Object.values(this.materials||{}).forEach(m=>m.dispose());}this.build();if(this.scene)this.makeBabylonMeshes();this.resize();}
    teleport(x,z){this.path=[];this.intent=null;this.player.x=x;this.player.z=z;this.game.s.avatar.x=x;this.game.s.avatar.z=z;this.destination.hidden=true;this.routeDots.forEach(d=>d.hidden=true);}
  }
  root.GCTown=Town;
})(window);

e:'m6 6 12 12M6 18 18 6',compass:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18m4 5-2 6-6 2 2-6Z','rotate-left':'M3 10a9 9 0 1 1 3 9M3 4v6h6','rotate-right':'M21 10a9 9 0 1 0-3 9m3-15v6h-6',energy:'m13 2-9 12h7l-1 8 10-12h-7Z',chat:'M21 12a8 8 0 0 1-8 8H3l2-4a8 8 0 1 1 16-4ZM8 10h8m-8 4h5',megaphone:'m3 10 16-6v16L3 14Zm0 0v4m3 1 2 6h3l-2-5M22 9v6',book:'M3 4h7a2 2 0 0 1 2 2 2 2 0 0 1 2-2h7v16h-7a2 2 0 0 0-2 2 2 2 0 0 0-2-2H3Zm9 2v16',download:'M12 3v12m-5-5 5 5 5-5M3 16v5h18v-5',upload:'M12 16V4m-5 5 5-5 5 5M3 16v5h18v-5',lock:'M6 10V7a6 6 0 0 1 12 0v3M4 10h16v11H4Zm8 5v2',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Zm10-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6',checkcircle:'M21 11v1a9 9 0 1 1-5.3-8.2M21 3l-9 9-3-3',flag:'M4 22V3s4-2 8 0 8 0 8 0v10s-4 2-8 0-8 0-8 0',trend:'m3 17 6-6 4 4 8-11M15 4h6v6',bell:'M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8m-12 8v2h6v-2',info:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18m0 8v6m0-10h.01',gift:'M3 8h18v4H3Zm2 4v9h14v-9M12 8v13m0-13s-7 1-7-3a2 2 0 0 1 3-2c2 1 4 5 4 5Zm0 0s7 1 7-3a2 2 0 0 0-3-2c-2 1-4 5-4 5Z',bag:'M5 7h14l2 14H3ZM9 8V5a3 3 0 0 1 6 0v3'};
  function icon(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.sparkles}"/></svg>`;}
  function portrait(p){const skin=esc(p.skin||'#d4a27c'),hair=esc(p.hair||'#4a382b'),outfit=esc(p.outfit||'#a5b69c'),bg=esc(p.bg||'#e7ecdb');return `<svg viewBox="0 0 80 80" aria-hidden="true"><rect width="80" height="80" fill="${bg}"/><ellipse cx="40" cy="86" rx="30" ry="29" fill="${outfit}"/><path d="M33 48h14v15q-7 9-14 0Z" fill="${skin}"/><ellipse cx="40" cy="33" rx="19" ry="22" fill="${hair}"/><ellipse cx="40" cy="36" rx="16" ry="20" fill="${skin}"/><path d="M23 34Q18 10 39 10q23 0 20 26l-6-8q-18 1-23-7l-4 16Z" fill="${hair}"/><ellipse cx="34" cy="36" rx="1.1" ry="1.5" fill="#46392e"/><ellipse cx="46" cy="36" rx="1.1" ry="1.5" fill="#46392e"/><path d="M35 46q5 4 10 0" stroke="#946246" fill="none" stroke-width="1.2" stroke-linecap="round"/><path d="m28 63 12 10 12-10" fill="none" stroke="#ffffff44" stroke-width="2"/></svg>`;}
  let game,loadWarning='';
  try {const stored=localStorage.getItem(SAVE_KEY);game=new Game(stored?JSON.parse(stored):null);}catch(error){game=new Game();loadWarning=error.name==='SecurityError'?'Browser storage is unavailable. Use Settings → Export save to keep your progress.':'The saved game could not be read. A fresh session is open; import a backup to restore it.';}
  const ui={tab:'today',sub:'requests',businessSub:'studio',calendarDay:game.s.day,clientFilter:'all',modalType:null,lastFocus:null,status:'Taking it all in',saveOK:true,lastSaved:0,dayNotice:0};
  let town,tickAccumulator=0,saveAccumulator=0,sidebarFingerprint='';
  const state=()=>game.s;
  const weekday=day=>['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][(day-1)%7];
  const ageLine=p=>`${p.age} · ${esc(p.pronouns)}`;
  function toast(message,warning=false){const el=document.createElement('div');el.className='toast'+(warning?' warning':'');el.innerHTML=icon(warning?'info':'checkcircle',16)+`<span>${esc(message)}</span>`;$('toasts').appendChild(el);setTimeout(()=>el.remove(),5500);}
  function save(silent=true){try{localStorage.setItem(SAVE_KEY,game.serialize());ui.saveOK=true;ui.lastSaved=Date.now();if(!silent)toast('Saved in this browser. Export a backup for another device.');}catch(error){ui.saveOK=false;if(!silent)toast('Browser storage is unavailable. Export a save file instead.',true);}updateFooter();}
  function act(fn,message){try{const result=fn();save();render();if(message)toast(typeof message==='function'?message(result):message);return {ok:true,value:result};}catch(error){console.error(error);toast(error.message||'That action could not be completed.',true);return {ok:false};}}
  function setGame(next){game=next;town.game=game;ui.calendarDay=game.s.day;town.rebuild();ui.status='A fresh start';render();save();window.GCApp.game=game;}
  function topStats(){const s=state();$('top-stats').innerHTML=`<div class="top-stat"><span class="stat-icon">${icon('wallet',17)}</span><div><small>YOUR BALANCE</small><b>${money(s.money)}</b></div></div><div class="top-stat"><span class="stat-icon">${icon('star',17)}</span><div><small>REPUTATION</small><b>${s.reputation.toFixed(1)}<span class="minor">/ 5</span></b></div></div><div class="top-stat"><span class="stat-icon">${icon('people',17)}</span><div><small>YOUR REACH</small><b>${s.followers}<span class="minor">people</span></b></div></div>`;$('profile-mini').innerHTML=portrait(s.avatar);}
  function rail(){const items=[['today','town','Neighborhood'],['calendar','calendar','Planner'],['clients','people','Clients'],['business','briefcase','Business'],['life','leaf','My life']];$('rail').innerHTML=items.map(([id,i,label])=>`<button class="nav-btn ${ui.tab===id?'active':''}" data-action="nav" data-tab="${id}" aria-label="${label}" ${ui.tab===id?'aria-current="page"':''}>${icon(i)}<span>${label}</span></button>`).join('')+`<button class="nav-btn nav-bottom" data-action="profile" aria-label="Character and settings">${icon('settings')}<span>Settings</span></button>`;}
  function need(label,key,i){const v=Math.round(state()[key]);return `<div class="need"><div class="need-head"><span>${icon(i,12)}${label}</span><b>${v}%</b></div><div class="meter ${key} ${v<30?'low':''}" role="meter" aria-label="${label}" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><i style="width:${v}%"></i></div></div>`;}
  function hud(){const s=state();$('character-hud').innerHTML=`<div class="player-block"><button class="avatar-large" data-action="profile" title="Edit character">${portrait(s.avatar)}</button><div class="player-meta"><b>${esc(s.avatar.name)}</b><small>Level ${s.level} · ${s.model==='independent'?'Independent':s.model==='supported'?'Supported':'Collective'}</small><div class="status-text">${s.activeDate?'Making a connection':town?.isWalking?'On the way…':esc(ui.status)}</div></div></div><div class="hud-divider"></div><div class="needs-row">${need('Energy','energy','energy')}${need('Calm','calm','leaf')}${need('Style','style','sparkles')}</div><button class="hud-rest" data-action="visit" data-venue="home" title="Go home to rest">${icon('moon',14)} Recharge</button>`;}
  function timeUI(){const s=state(),night=s.minute>=1140;$('time-box').innerHTML=`<span style="color:#a9a573">${icon(night?'moon':'sun',21)}</span><div class="clock-label"><b>${weekday(s.day).slice(0,3)}, day ${s.day}</b><small>${clock(s.minute)} · ${s.settings.speed===0?'clock paused':night?'evening':'a lovely day'}</small></div><div class="time-controls"><button data-action="speed" data-value="0" class="${s.settings.speed===0?'active':''}" aria-label="Pause clock">${icon('pause',12)}</button><button data-action="speed" data-value="1" class="${s.settings.speed===1?'active':''}" aria-label="Normal clock speed">1×</button><button data-action="speed" data-value="3" class="${s.settings.speed===3?'active':''}" aria-label="Fast clock speed">3×</button></div>`;}

  function requestCard(r){const p=PERSON(r.person),c=game.contact(p.id),fee=Math.round(state().baseRate*p.duration/60),risk=p.risk;return `<article class="request-card"><div class="client-top"><button class="portrait" data-action="contact" data-id="${p.id}" title="Open ${esc(p.name)}’s profile">${portrait(p)}</button><div><div class="client-name">${esc(p.name)}${c.visits?` <span class="accent-text">✦</span>`:''}</div><div class="client-role">${esc(p.job)} · ${p.age}</div></div><div class="right"><div class="price">${money(fee)}<small>your ${p.duration===90?'90 min':'1 hr'} rate</small></div></div></div><p class="client-tagline">${esc(p.note)}</p><div class="tags"><span class="tag">${icon(VENUES[p.venue].icon,10)} ${p.venue==='lounge'?'Dinner':p.venue==='gallery'?'Art date':p.venue==='park'?'A little outdoors':'Coffee date'}</span><span class="tag ${r.screened?(risk?'warn':'outline'):'peach'}">${icon(r.screened?'shield':'eye',10)} ${r.screened?(risk?'Discuss boundaries':'References checked'):'Not screened'}</span>${c.visits?'<span class="tag purple">Regular</span>':''}</div><div class="card-actions"><button class="btn secondary" data-action="screen" data-id="${r.id}" ${r.screened?'disabled':''}>${icon(r.screened?'check':'shield',12)} ${r.screened?'Checked':'Screen · '+money(game.screeningCost())}</button><button class="btn primary flex" data-action="negotiate" data-id="${r.id}">View request ${icon('arrow',12)}</button></div></article>`;}
  function bookingCard(b){const p=PERSON(b.person),done=!['scheduled','active'].includes(b.status);return `<div class="booking ${done?'done':''}"><div class="booking-time">${clock(b.start)}</div><div class="booking-content"><b>${esc(p.name)}</b><p>${VENUES[b.venue].name} · ${b.duration} min · ${money(b.price)}</p><div class="tags"><span class="tag ${done?'outline':''}">${b.status==='completed'?`${b.rating.toFixed(1)} stars`:b.status==='scheduled'?'Booked':esc(b.status)}</span>${b.screened?`<span class="tag outline">${icon('shield',9)} Screened</span>`:''}</div>${b.status==='scheduled'?`<div class="card-actions"><button class="btn primary" data-action="meet" data-id="${b.id}">${icon('pin',11)} ${b.day===state().day?'Head to date':'View booking'}</button><button class="btn secondary" data-action="cancel-booking" data-id="${b.id}">Cancel</button></div>`:b.status==='active'?'<button class="btn primary mt" data-action="resume-date">Continue date</button>':''}</div></div>`;}
  function renderToday(){const s=state(),today=s.bookings.filter(b=>b.day===s.day).sort((a,b)=>a.start-b.start);const tabs=`<div class="panel-tabs"><button data-action="sub" data-tab="requests" class="${ui.sub==='requests'?'active':''}">Requests <span class="tiny-count">${s.requests.length}</span></button><button data-action="sub" data-tab="day" class="${ui.sub==='day'?'active':''}">My day <span class="tiny-count">${today.filter(b=>b.status==='scheduled').length}</span></button><button data-action="sub" data-tab="journal" class="${ui.sub==='journal'?'active':''}">Journal</button></div>`;
      let body='';if(ui.sub==='requests'){const next=today.find(b=>b.status==='scheduled');if(next)body+=`<div class="notice">${icon('calendar',16)}<div>Next up: <b>${esc(PERSON(next.person).name.split(' ')[0])} at ${clock(next.start)}</b>.<br><button class="text-btn" data-action="meet" data-id="${next.id}">Make your way to ${VENUES[next.venue].short}</button></div></div>`;

        body+=s.requests.length?s.requests.map(requestCard).join(''):`<div class="empty">${icon('coffee',27)}<h3>Your inbox is all caught up.</h3><p>Run a campaign, make a connection at The Marigold, or enjoy the rest of your day.</p><button class="btn mt" data-action="nav" data-tab="business">Visit your business studio</button></div>`;
        body+=goalCard();
      }else if(ui.sub==='day'){body+=`<div class="section-label"><span>${weekday(s.day).toUpperCase()} · YOUR TIME, YOUR CHOICE</span></div>`;body+=today.length?today.map(bookingCard).join(''):`<div class="empty">${icon('calendar',27)}<h3>A little space for something good.</h3><p>Screen a request and agree to a date to start filling your day.</p></div>`;body+=`<button class="btn secondary full mt" data-action="sleep">${icon('moon',13)} Close the day</button>`;}else{body=s.journal.map(j=>`<div class="log-item"><small>DAY ${j.day} · ${clock(j.time)}</small>${esc(j.message)}</div>`).join('');}

  function renderCalendar(){const d=ui.calendarDay,s=state(),bookings=s.bookings.filter(b=>b.day===d).sort((a,b)=>a.start-b.start);return panelHeader('MAKE ROOM FOR WHAT MATTERS','Your day, by design.','Every booking includes a little breathing room.')+`<div class="panel-body"><div class="day-nav"><button class="icon-btn" data-action="calendar-day" data-value="-1" aria-label="Previous day" ${d<=1?'disabled':''}>${icon('chevron',14).replace('<svg ','<svg style="transform:rotate(180deg)" ')}</button><b>${weekday(d)} · day ${d}</b><button class="icon-btn" data-action="calendar-day" data-value="1" aria-label="Next day" ${d>=s.day+1?'disabled':''}>${icon('chevron',14)}</button></div>${bookings.length?bookings.map(bookingCard).join(''):`<div class="empty mb">${icon('calendar',27)}<h3>Nothing on the calendar. Yet.</h3><p>Agree on a time and fee from an incoming request.</p></div>`}<div class="notice mt">${icon('clock',15)}<div>Travel buffer: <b>20 minutes</b> between bookings.<br>Check in no later than 30 minutes after the agreed start.</div></div><button class="btn secondary full" data-action="wait">${icon('clock',13)} Take a little time · 30 min</button><button class="btn full mt" data-action="sleep">${icon('moon',13)} Turn in for the night</button>${goalCard()}</div>`+footer();}
  function renderClients(){const s=state();const known=PEOPLE.filter(p=>s.requests.some(r=>r.person===p.id)||s.bookings.some(b=>b.person===p.id)||s.contacts[p.id]?.notes||s.contacts[p.id]?.favorite||s.contacts[p.id]?.blocked);const filtered=known.filter(p=>ui.clientFilter==='all'||(ui.clientFilter==='regulars'?game.contact(p.id).visits>0:game.contact(p.id).blocked));const tabs=`<div class="panel-tabs">${[['all','All contacts'],['regulars','Regulars'],['blocked','Blocked']].map(([id,name])=>`<button data-action="client-filter" data-tab="${id}" class="${ui.clientFilter===id?'active':''}">${name}</button>`).join('')}</div>`;return panelHeader('CONNECTIONS, NOT JUST CONTACTS','Your kind of people.','Keep the details that make a date feel thoughtful.',tabs)+`<div class="panel-body">${filtered.length?filtered.map(p=>{const c=game.contact(p.id);return `<article class="request-card"><div class="client-top"><span class="portrait">${portrait(p)}</span><div><div class="client-name">${esc(p.name)} ${c.favorite?'✦':''}</div><div class="client-role">${c.visits?c.visits+' completed date'+(c.visits>1?'s':''):'A new connection'}</div></div><span style="margin-left:auto;color:#b09a65">${c.lastRating?c.lastRating.toFixed(1):''}</span></div><div class="tags mt">${p.interests.map(i=>`<span class="tag outline">${i}</span>`).join('')}${c.blocked?'<span class="tag warn">Blocked</span>':''}</div>${c.notes?`<p class="client-tagline">${esc(c.notes.slice(0,100))}</p>`:''}<button class="btn secondary full mt" data-action="contact" data-id="${p.id}">View notes & preferences ${icon('arrow',11)}</button></article>`;}).join(''):`<div class="empty">${icon('people',25)}<h3>${ui.clientFilter==='blocked'?'A clear list.':'Good connections take time.'}</h3><p>Client history will grow as you complete dates.</p></div>`}</div>`+footer();}
  function renderBusiness(){const s=state(),model=game.model();const tabs=`<div class="panel-tabs"><button data-action="business-sub" data-tab="studio" class="${ui.businessSub==='studio'?'active':''}">Your studio</button><button data-action="business-sub" data-tab="numbers" class="${ui.businessSub==='numbers'?'active':''}">The numbers</button><button data-action="business-sub" data-tab="support" class="${ui.businessSub==='support'?'active':''}">Support</button></div>`;let body='';if(ui.businessSub==='studio'){body=`<div class="settings-group"><h3>Your time has value.</h3><p>Your base rate sets the starting quote. Client budgets respond to region, demand, and your reputation.</p><label class="range-label" for="base-rate">Hourly companionship rate <b id="rate-value">${money(s.baseRate)}</b></label><input type="range" id="base-rate" min="60" max="400" step="10" value="${s.baseRate}" aria-label="Hourly rate"><div class="range-ticks"><span>$60 · approachable</span><span>$400 · premium</span></div></div><div class="section-label mt"><span>A LITTLE MORE VISIBILITY</span>${icon('megaphone',12)}</div>${['photos','campaign','network'].map(id=>activityCard(id)).join('')}<button class="choice-card" data-action="regions"><div class="choice-head">${game.region().name}${icon('arrow',13)}</div><p>${game.region().market}<br>${money(game.region().rent)} daily living costs.</p></button>${permitCard()}<div class="settings-group"><h3>What comes after independent?</h3><p>A peer-run shared studio earns $65 daily in workspace income. Unlock at 8 completed dates, 4.5 reputation, and $3,000 savings.</p><button class="btn full mt" data-action="agency" ${s.flags.agency?'disabled':''}>${s.flags.agency?'Your shared studio is open': 'Launch studio · $1,800'}</button></div>`;
      }else if(ui.businessSub==='support'){body=`<div class="notice">${icon('shield',16)}<div>Support can lower pressure without limiting your boundaries. You can always end a date safely.</div></div>`+Object.values(MODELS).map(m=>`<button class="choice-card ${s.model===m.id?'selected':''}" data-action="model" data-id="${m.id}"><div class="choice-head">${m.name}${s.model===m.id?icon('check',14):''}</div><p>${m.description}</p><div class="tags mt"><span class="tag">${m.fee?'22% revenue share':m.daily?money(m.daily)+' / day':'Keep 100%'}</span><span class="tag outline">${m.safety?'-'+m.safety+' pressure points':'Full autonomy'}</span></div></button>`).join('');
      }else{const net=s.ledger.filter(t=>t.day>=s.day-6).reduce((v,t)=>v+t.amount,0),owed=s.bookings.filter(b=>b.status==='scheduled').reduce((v,b)=>v+b.price-b.deposit,0);body=`<div class="stat-grid"><div class="stat-tile"><small>Net cash flow · 7 days</small><b>${money(net)}</b></div><div class="stat-tile"><small>Date earnings · lifetime</small><b>${money(s.totalEarned)}</b></div></div><div class="settings-group"><h3>The little details add up.</h3><p>Daily living: ${money(game.region().rent)}<br>Daily support: ${money(model.daily)}<br>Agency share: ${Math.round(model.fee*100)}% of date revenue<br>Unpaid booking balances: ${money(owed)}</p></div><div class="section-label"><span>RECENT CASH MOVEMENTS</span>${icon('wallet',12)}</div>${s.ledger.length?s.ledger.slice(0,35).map(t=>`<div class="ledger-row"><div>${esc(t.label)}<small>Day ${t.day} · ${clock(t.time)}</small></div><strong class="${t.amount>=0?'positive':'negative'}">${t.amount>=0?'+':''}${money(t.amount)}</strong></div>`).join(''):'<div class="empty">Your first chapter starts with $680. Your ledger begins with your first transaction.</div>'}<p class="panel-sub mt">Deposits appear when received and are deducted from final payments. Net cash flow includes expenses and refunds.</p>`;}
      return panelHeader('A BUSINESS THAT FITS YOUR LIFE','Make it your own.','Set your pace, your price, and your support.',tabs)+`<div class="panel-body">${body}</div>`+footer();

  function permitCard(){const s=state(),r=game.region();return r.permit?`<div class="notice ${s.permitUntil<s.day?'warning':''}">${icon('briefcase',16)}<div><b>Fictional city business permit</b><br>${s.permitUntil>=s.day?'Current through day '+s.permitUntil: 'Renew before accepting a booking.'}<br><button class="text-btn" data-action="permit">7-day permit · ${money(r.permit)}</button></div></div>`:'';}
  function activityCard(id){const a=ACTIVITIES[id],changes=Object.entries(a.effect).map(([k,v])=>`${v>0?'+':''}${v} ${k}`).join(' · ');return `<button class="choice-card" data-action="activity-visit" data-id="${id}"><div class="choice-head"><span>${icon(a.icon,14)} &nbsp;${a.name}</span><small>${a.cost?money(a.cost):'Free'}</small></div><p>${a.text}</p><div class="tags mt"><span class="tag outline">${icon('clock',10)} ${a.time} min</span><span class="tag outline">${a.skill?'+1 '+a.skill:a.followers?'+'+a.followers+' reach':changes}</span></div></button>`;}
  function renderLife(){const s=state();return panelHeader('YOU ARE MORE THAN YOUR WORK','A little care goes far.','Build a life you have the energy to enjoy.')+`<div class="panel-body"><div class="settings-group"><div class="needs-row mb">${need('Health','health','leaf')}${need('Nourished','hunger','coffee')}</div><div class="needs-row">${need('Privacy','privacy','lock')}${need('Connection','connection','heart')}</div></div><div class="settings-group"><div class="bond-row"><span class="portrait">${portrait({skin:'#b78564',hair:'#40372c',outfit:'#b2b6a0',bg:'#e8e7d9'})}</span><div><b>Jamie · your friend</b><p>${s.connection>65?'“Let’s make time for something ordinary.”':s.connection>30?'“I miss our little catch-ups.”':'“It feels like it’s been a while.”'}</p><div class="meter"><i style="width:${s.connection}%"></i></div></div></div><button class="btn secondary full" data-action="activity-visit" data-id="friend">${icon('heart',12)} Make some time · 30 min</button></div><div class="section-label mt"><span>GROW AT YOUR OWN PACE</span><span>${s.skillPoints} POINT${s.skillPoints===1?'':'S'}</span></div><div class="settings-group">${Object.entries(s.skills).map(([k,v])=>`<div class="skill-row"><div><b>${k.charAt(0).toUpperCase()+k.slice(1)}</b><div class="skill-dots">${[1,2,3,4,5].map(i=>`<i class="${i<=v?'on':''}"></i>`).join('')}</div></div><button class="btn secondary" data-action="upgrade" data-id="${k}" ${s.skillPoints<1||v>=5?'disabled':''}>${icon('plus',11)} Learn</button></div>`).join('')}<div class="xp-row"><span>Level ${s.level}</span><span>${s.xp} / 100 XP</span></div><div class="meter"><i style="width:${s.xp}%"></i></div></div><div class="section-label mt"><span>SMALL THINGS THAT HELP</span>${icon('leaf',12)}</div>${['rest','meal','unwind','freshen','wellness'].map(activityCard).join('')}</div>`+footer();}
  function render(){topStats();rail();hud();timeUI();worldUI();const body=ui.tab==='calendar'?renderCalendar():ui.tab==='clients'?renderClients():ui.tab==='business'?renderBusiness():ui.tab==='life'?renderLife():renderToday();const scroll=$('sidebar').querySelector('.panel-body')?.scrollTop||0;$('sidebar').innerHTML=body;if($('sidebar').querySelector('.panel-body'))$('sidebar').querySelector('.panel-body').scrollTop=scroll;renderLabels();}
  function renderLabels(){const s=state();$('world-labels').innerHTML=Object.entries(VENUES).map(([id,v])=>{const booked=s.bookings.some(b=>b.venue===id&&b.day===s.day&&['scheduled','active'].includes(b.status));return `<button class="map-label ${booked?'booked':''}" id="label-${id}" data-action="visit" data-venue="${id}" aria-label="Walk to ${v.name}">${icon(v.icon,12)}${v.short}${booked?' · date':''}</button>`;}).join('');if(town)positionLabels(town);}

  function modal(title,body,kicker='A LITTLE POSSIBILITY',type='generic',wide=false,closable=true){if($('modal-shade').hidden)ui.lastFocus=document.activeElement;ui.modalType=type;town?.keys.clear();$('modal').className='modal'+(wide?' wide':'');$('modal').innerHTML=`<div class="modal-head"><div><div class="eyebrow">${kicker}</div><h2 id="modal-title">${title}</h2></div>${closable?`<button class="icon-btn" data-action="close" aria-label="Close dialog">${icon('close',18)}</button>`:''}</div>${body}`;$('modal-shade').hidden=false;$('modal').focus({preventScroll:true});}

  function openNegotiation(id){const r=game.request(id),p=PERSON(r.person),s=state();let day=s.day,start=Math.max(660,Math.ceil((s.minute+25)/30)*30);if(start+p.duration>1290){day++;start=660;}const value=Math.round(s.baseRate*p.duration/60);modal('A good date starts here.',`<div class="modal-client"><span class="portrait">${portrait(p)}</span><div><h3>${esc(p.name)}</h3><p>${esc(p.job)} · ${ageLine(p)}</p><div class="tags">${p.interests.map(i=>`<span class="tag">${i}</span>`).join('')}</div></div></div><p class="modal-sub">${esc(p.note)}<br><b>${p.kind}</b> · ${p.duration} minutes. Your quote covers companionship and conversation only.</p><div id="screening-message" class="notice ${!r.screened||p.risk?'warning':''}">${icon('shield',16)}<div>${r.screened?(p.risk?'References checked. A personal-contact or venue-change request needs a clear boundary.':'References checked. Payment history looks reliable; a public venue is agreed.'):'References have not been checked. Screening takes 20 minutes and helps avoid unreliable bookings.'}${!r.screened?`<br><button class="text-btn" data-action="screen-modal" data-id="${id}">Screen this request · ${money(game.screeningCost())}</button>`:''}</div></div><div class="round-meta"><span>Estimated pressure · ${game.risk({screened:r.screened,person:r.person})} / 100</span><span>${MODELS[s.model].name}</span></div><p class="panel-sub mb">Pressure affects calm after the date. Screening and support reduce it; boundaries always remain yours.</p><form id="booking-form" data-request="${id}"><div class="field-grid"><label class="field">Day<select name="day"><option value="${s.day}" ${day===s.day?'selected':''}>Today · day ${s.day}</option><option value="${s.day+1}" ${day>s.day?'selected':''}>Tomorrow · day ${s.day+1}</option></select></label><label class="field">Start time<input name="start" type="time" min="10:00" max="${clock(1290-p.duration)}" step="1800" value="${clock(start)}" required></label><label class="field">Public venue<select name="venue">${['cafe','gallery','lounge','park'].map(v=>`<option value="${v}" ${p.venue===v?'selected':''}>${VENUES[v].name}</option>`).join('')}</select></label><label class="field">Total date fee ($)<input name="price" type="number" min="40" max="1500" step="1" value="${value}" required></label></div><label class="check-row"><input name="deposit" type="checkbox" checked> Take a 25% booking deposit</label><label class="check-row"><input name="boundaries" type="checkbox" checked> Confirm public venue, professional contact & mutual consent</label><div id="offer-response"></div><div class="quote-summary"><span>Clear terms. No pressure.<br>You can decline or leave at any time.</span><span>Client’s indicated budget <b>${r.screened?money(r.budget):'Unverified'}</b></span></div><div class="modal-actions"><button type="button" class="btn secondary" data-action="decline" data-id="${id}">Not a fit</button><button type="submit" class="btn primary">Propose this date ${icon('arrow',13)}</button></div></form>`,'NEW REQUEST','negotiate');}
  function offerSubmit(form){const fd=new FormData(form),parts=String(fd.get('start')).split(':');const start=Number(parts[0])*60+Number(parts[1]);const opts={day:Number(fd.get('day')),start,price:Number(fd.get('price')),venue:String(fd.get('venue')),deposit:fd.get('deposit')==='on',boundaries:fd.get('boundaries')==='on'};const result=act(()=>game.offer(form.dataset.request,opts));if(!result.ok)return;if(!result.value.accepted){$('offer-response').innerHTML=`<div class="notice warning mt">${icon('chat',16)}<div>“That’s a little above my budget. Could we do <b>${money(result.value.counter)}</b>?”<br><button type="button" class="text-btn" data-action="accept-counter" data-value="${result.value.counter}">Use their counteroffer</button></div></div>`;return;}const b=result.value.booking;closeModal();ui.sub='day';ui.tab='today';render();toast(`Booked ${PERSON(b.person).name.split(' ')[0]} for ${clock(b.start)}. ${b.deposit?money(b.deposit)+' deposit received.':'No deposit taken.'}`);}
  function goVenue(id,intent=null){if(state().activeDate){toast('Finish or safely end your current date first.',true);return;}closeModal();ui.status='On the way to '+VENUES[id].short;town.visit(id,intent||{venue:id});hud();}

  function openDate(){const d=state().activeDate;if(!d)return;const b=game.booking(d.bookingId),p=PERSON(b.person),prompt=game.datePrompt();modal('Make a little connection.',`<div class="date-scene"><span class="portrait">${portrait(p)}</span><h3>${esc(p.name.split(' ')[0])} & you</h3><p>${VENUES[b.venue].name} · ${p.kind}</p></div><div class="round-meta"><span>${prompt.title.toUpperCase()}</span><span>MOMENT ${d.round+1} OF 3</span></div><div class="meter"><i style="width:${d.rapport}%"></i></div><div class="round-meta" style="margin-top:6px"><span>Connection</span><span>${Math.round(d.rapport)} / 100</span></div>${d.feedback?`<div class="feedback">${esc(d.feedback)}</div>`:''}<p class="dialogue">${esc(prompt.text)}</p>${prompt.choices.map((c,i)=>`<button class="date-choice" data-action="date-choice" data-value="${i}"><span class="choice-index">${i+1}</span><span>${esc(c.text)}</span>${c.exit?icon('shield',14):''}</button>`).join('')}<div class="quote-summary"><span>${icon('lock',12)} Your boundaries stay yours.</span><button class="text-btn" data-action="exit-date">End date safely</button></div>`,'COMPANIONSHIP & CONVERSATION','date',false,false);}

  function askExit(){modal('It’s okay to call it a day.',`<p class="modal-sub">End the date on your own terms. You’ll receive proportionate payment for time spent, with <b>no reputation penalty</b>.</p><div class="modal-actions"><button class="btn secondary" data-action="resume-date">Continue the date</button><button class="btn primary" data-action="confirm-exit">End safely</button></div>`,'YOUR CHOICE, ALWAYS','exit',false,false);}
  function openContact(id){const p=PERSON(id),c=game.contact(id),s=state(),known=s.requests.find(r=>r.person===id);modal('The little things matter.',`<div class="modal-client"><span class="portrait">${portrait(p)}</span><div><h3>${esc(p.name)}</h3><p>${esc(p.job)} · ${ageLine(p)}</p><div class="tags">${p.interests.map(i=>`<span class="tag">${i}</span>`).join('')}</div></div></div><div class="stat-grid"><div class="stat-tile"><small>Dates together</small><b>${c.visits}</b></div><div class="stat-tile"><small>Last review</small><b>${c.lastRating?c.lastRating.toFixed(1)+' / 5':'A new face'}</b></div></div><p class="modal-sub">${esc(p.note)}${known?.screened?'<br><b>Screening:</b> '+(p.risk?'Discuss personal-contact and venue boundaries.':'References checked; reliable public-meeting preferences.'):''}</p><form id="contact-form" data-person="${id}"><label class="field">Your private notes<textarea name="notes" maxlength="600" placeholder="Favorite topics, little preferences, things to remember…">${esc(c.notes)}</textarea></label><label class="check-row"><input type="checkbox" name="favorite" ${c.favorite?'checked':''}> Prioritize this contact for referrals</label><div class="modal-actions"><button type="button" class="btn danger" data-action="block-contact" data-id="${id}">${c.blocked?'Unblock contact':'Block contact'}</button><button type="submit" class="btn primary">Save little details ${icon('check',12)}</button></div></form>`,'YOUR CLIENT JOURNAL','contact');}
  function openRegions(){const s=state();modal('Where will your next chapter be?',`<p class="modal-sub">Three fictional regions, three different rhythms. Moving costs $100 plus any initial permit. Finish or cancel upcoming bookings first. Region rules are invented game mechanics, not real-world legal guidance.</p><div class="region-options">${Object.values(REGIONS).map(r=>`<div class="choice-card ${s.region===r.id?'selected':''}"><div class="region-swatch" style="background:${r.color}">${icon(r.id==='coast'?'sun':r.id==='arts'?'art':'tree',28)}</div><div class="choice-head">${r.name}</div><p>${r.description}</p><div class="region-facts">Client budgets · ×${r.demand.toFixed(2)}<br>Living costs · ${money(r.rent)} / day<br>Permit · ${r.permit?money(r.permit)+' / 7 days':'not required'}<br>Base pressure · ${r.risk} / 100</div><button class="btn ${s.region===r.id?'secondary':'primary'} full" data-action="move-region" data-id="${r.id}" ${s.region===r.id?'disabled':''}>${s.region===r.id?'You are here':'Move · '+money(100+r.permit)}</button></div>`).join('')}</div>`,'A CHANGE OF SCENERY','regions',true);}
  function openSleep(){const s=state(),pending=s.bookings.filter(b=>b.day===s.day&&b.status==='scheduled');modal('Close the books. Open tomorrow.',`<p class="modal-sub">A little sleep will restore energy and calm. Tomorrow brings a fresh inbox, a new market mood, and another chance to build the life you want.</p><div class="stat-grid"><div class="stat-tile"><small>Daily living costs</small><b>${money(game.region().rent)}</b></div><div class="stat-tile"><small>Support costs</small><b>${money(game.model().daily)}</b></div></div>${pending.length?`<div class="notice warning">${icon('calendar',16)}<div>You have <b>${pending.length} unfinished booking${pending.length>1?'s':''}</b> today. Turning in cancels them and refunds their deposits.</div></div>`:''}<div class="modal-actions"><button class="btn secondary" data-action="close">A little longer</button><button class="btn primary" data-action="confirm-sleep">Goodnight, ${game.region().name} ${icon('moon',13)}</button></div>`,'THE END OF A LITTLE DAY','sleep');}
  function sleep(){const result=act(()=>game.nextDay());if(!result.ok)return;town.teleport(state().avatar.x,state().avatar.z);ui.calendarDay=state().day;ui.status='A fresh start';ui.tab='today';ui.sub='requests';const r=result.value;modal('Another day, another possibility.',`<p class="modal-sub">Day ${r.day} is behind you. Here is how it came together.</p><div class="stat-grid"><div class="stat-tile"><small>Completed dates</small><b>${r.completed}</b></div><div class="stat-tile"><small>Net cash flow</small><b>${money(r.income)}</b></div></div><div class="notice">${icon(game.event().icon,18)}<div><b>Today: ${game.event().name}</b><br>${game.event().description}</div></div>${r.grant?'<div class="notice">A one-time $200 community restart grant is in your balance. There is always room for a fresh start.</div>':''}<p class="modal-sub">Needs have recovered with sleep. Make time for breakfast and a fresh outfit before your first date.</p><div class="modal-actions"><button class="btn primary" data-action="close">Let’s see what today brings ${icon('arrow',13)}</button></div>`,'GOOD MORNING','summary');render();}
  function openProfile(){const s=state(),a=s.avatar;modal('A life that feels like yours.',`<form id="profile-form"><div class="modal-client"><span class="portrait">${portrait(a)}</span><div><h3>${esc(a.name)}</h3><p>Level ${s.level} · ${a.age} · ${esc(a.pronouns)}</p><div class="tags"><span class="tag">All characters are adults</span></div></div></div><div class="field-grid"><label class="field full">Name<input name="name" maxlength="30" value="${esc(a.name)}" required></label><label class="field">Age (21–75)<input name="age" type="number" min="21" max="75" step="1" value="${a.age}" required></label><label class="field">Pronouns<select name="pronouns">${['they / them','she / her','he / him'].map(p=>`<option ${p===a.pronouns?'selected':''}>${p}</option>`).join('')}</select></label><label class="field">Outfit color<input name="outfit" type="color" value="${a.outfit}"></label><label class="field">Skin tone<input name="skin" type="color" value="${a.skin}"></label><label class="field">Hair color<input name="hair" type="color" value="${a.hair}"></label><label class="field">Starting background<select name="background" ${a.customized||s.bookings.length?'disabled':''}><option value="fresh" ${a.background==='fresh'?'selected':''}>Fresh start · +1 screening</option><option value="people" ${a.background==='people'?'selected':''}>People person · +1 conversation · −$80</option><option value="business" ${a.background==='business'?'selected':''}>Business savvy · +1 negotiation · −$80</option></select></label></div><p class="panel-sub">Appearance and pronouns are cosmetic, not risk or income modifiers. A starting background can be chosen once, before your first booking.</p><label class="check-row"><input name="reducedMotion" type="checkbox" ${s.settings.reducedMotion?'checked':''}> Reduce decorative animation</label><div class="modal-actions"><button class="btn primary" type="submit">Make it mine ${icon('check',13)}</button></div></form><hr><h3>Your progress, kept safe.</h3><p class="panel-sub">Autosaves stay in this browser. Export a save to keep a portable backup. Imported saves replace this session.</p><div class="export-row"><button class="btn secondary" data-action="export">${icon('download',13)} Export save</button><button class="btn secondary" data-action="import">${icon('upload',13)} Import save</button></div><div class="export-row"><button class="btn secondary" data-action="help">How to play</button><button class="btn danger" data-action="reset">Start a new life</button></div>`,'CHARACTER & SETTINGS','profile');}
  function help(){modal('A little ambition. A lot of possibility.',`<p class="modal-sub">You’re building an adult, non-explicit companionship business in a bright little town. Your time, your boundaries, and your definition of success come first.</p><div class="help-grid"><div><h3>01 · Start with a good fit</h3><p>Screen a request, discuss boundaries, and propose a public venue, time, and total fee. Clients may counteroffer. Deposits protect against unreliable bookings.</p></div><div><h3>02 · Make the connection</h3><p>Use <b>Head to date</b> to walk to your booking. Listen, notice preferences, and keep the date within agreed terms. Reviews, tips, and regulars follow good care.</p></div><div><h3>03 · Build at your own pace</h3><p>Set rates in Business, run campaigns, and choose independence, trusted support, or a collective. Regions change demand and costs. Skills improve with experience.</p></div><div><h3>04 · Have a life, too</h3><p>Rest, eat, reconnect, and invest in wellbeing. Dates use energy. Daily costs are deducted when you turn in. There is no deadline on your first milestone.</p></div></div><hr><h3>A few little controls</h3><p class="modal-sub mt"><kbd>Click</kbd> walk or visit a venue &nbsp; <kbd>W A S D</kbd> move<br><kbd>Q</kbd> <kbd>E</kbd> rotate &nbsp; <kbd>+</kbd> <kbd>−</kbd> zoom &nbsp; <kbd>F</kbd> interact<br><kbd>Space</kbd> pause the clock &nbsp; <kbd>Esc</kbd> close a dialog<br>The clock pauses while a dialog is open. Walking still works when the clock is paused. On a date, you can always leave safely.</p><div class="notice">${icon('info',17)}<div>All clients are 21+. No explicit sexual content. Business permits and regional rules are fictional. There are no real payments, external accounts, or gameplay uploads.</div></div><p class="panel-sub">Babylon.js is loaded when available. The same procedural town and full gameplay work in the offline isometric compatibility renderer. Settings includes reduced decorative motion, portable save export, and character customization.</p><div class="modal-actions"><button class="btn primary" data-action="close">Let’s make a little life ${icon('arrow',13)}</button></div>`,'WELCOME TO GOOD COMPANY','help',true);}
  function exportSave(){const blob=new Blob([JSON.stringify(state(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`good-company-day-${state().day}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('A portable save has been exported.');}
  function tick(dt){tickAccumulator+=dt;saveAccumulator+=dt;if(!state().activeDate&&$('modal-shade').hidden&&state().settings.speed>0){game.advance(dt*.65*state().settings.speed);if(state().minute>=1320&&ui.dayNotice!==state().day){ui.dayNotice=state().day;toast('The day is winding down. Turn in at home when you’re ready.');}}if(tickAccumulator>=1){tickAccumulator=0;timeUI();hud();topStats();const fingerprint=state().bookings.map(b=>b.id+b.status).join('|');if(fingerprint!==sidebarFingerprint){sidebarFingerprint=fingerprint;render();} }if(saveAccumulator>20){saveAccumulator=0;save();}}
  function routeAction(el,e){const a=el.dataset.action,id=el.dataset.id,v=el.dataset.value;
    if(a==='nav'){ui.tab=el.dataset.tab;ui.calendarDay=state().day;render();return;}
    if(a==='sub'){ui.sub=el.dataset.tab;render();return;}
    if(a==='business-sub'){ui.businessSub=el.dataset.tab;render();return;}
    if(a==='client-filter'){ui.clientFilter=el.dataset.tab;render();return;}
    if(a==='close'){closeModal();return;}
    if(a==='help'){help();return;}
    if(a==='profile'){openProfile();return;}
    if(a==='save'){save(false);return;}
    if(a==='speed'){state().settings.speed=Number(v);save();timeUI();return;}
    if(a==='rotate'){town.rotate(Number(v));return;}
    if(a==='zoom'){town.adjustZoom(Number(v));return;}
    if(a==='homecamera'){town.resetCamera();return;}
    if(a==='calendar-day'){ui.calendarDay=clamp(ui.calendarDay+Number(v),1,state().day+1);render();return;}
    if(a==='visit'){goVenue(el.dataset.venue);return;}
    if(a==='screen'||a==='screen-modal'){const result=act(()=>game.screen(id));if(result.ok){toast(result.value);if(a==='screen-modal')openNegotiation(id);}return;}
    if(a==='negotiate'){try{openNegotiation(id);}catch(error){toast(error.message,true);}return;}
    if(a==='decline'){const result=act(()=>game.decline(id));if(result.ok){closeModal();toast('Not every request needs to be a yes.');}return;}
    if(a==='accept-counter'){$('booking-form').elements.price.value=v;$('offer-response').innerHTML='<div class="feedback">Counteroffer entered. Check the time and terms, then propose the date again.</div>';return;}
    if(a==='meet'){meet(id);return;}
    if(a==='begin-date'){beginDate(id);return;}
    if(a==='resume-date'){openDate();return;}
    if(a==='date-choice'){const result=act(()=>game.dateChoice(Number(v)));if(result.ok){if(result.value.done)dateResult(result.value.result);else openDate();}return;}
    if(a==='exit-date'){askExit();return;}
    if(a==='confirm-exit'){const result=act(()=>game.finishDate(true));if(result.ok)dateResult(result.value);return;}
    if(a==='cancel-booking'){const b=game.booking(id);modal('Leave a little room.',`<p class="modal-sub">Cancel your date with <b>${esc(PERSON(b.person).name)}</b> on day ${b.day} at ${clock(b.start)}? The ${money(b.deposit)} deposit will be refunded. There is no reputation penalty.</p><div class="modal-actions"><button class="btn secondary" data-action="close">Keep the date</button><button class="btn danger" data-action="confirm-cancel" data-id="${id}">Cancel & refund</button></div>`,'BOOKING CHANGE','cancel');return;}
    if(a==='confirm-cancel'){const result=act(()=>game.cancel(id));if(result.ok){closeModal();toast('Booking cancelled. Deposit refunded.');}return;}
    if(a==='activity-visit'){const venue=activityVenue(id);goVenue(venue,{venue,activity:id});return;}
    if(a==='do-activity'){const result=act(()=>game.activity(id));if(result.ok){closeModal();ui.status=ACTIVITIES[id].name;toast('A little time well spent.');}return;}
    if(a==='wait'){act(()=>{game.advance(30);game.log('Took a little time to enjoy the neighborhood.');},'Half an hour, just for you.');return;}
    if(a==='contact'){openContact(id);return;}
    if(a==='block-contact'){const c=game.contact(id);if(c.blocked){act(()=>game.setContact(id,{blocked:false}),'Contact unblocked.');openContact(id);}else modal('Keep your circle comfortable.',`<p class="modal-sub">Block ${esc(PERSON(id).name)}? Their requests will stop. Any upcoming dates with them will be cancelled and deposits refunded.</p><div class="modal-actions"><button class="btn secondary" data-action="contact" data-id="${id}">Go back</button><button class="btn danger" data-action="confirm-block" data-id="${id}">Block & cancel bookings</button></div>`,'CLIENT BOUNDARIES','block');return;}
    if(a==='confirm-block'){act(()=>game.setContact(id,{blocked:true}),'Contact blocked. Your boundaries are yours.');closeModal();return;}
    if(a==='upgrade'){act(()=>game.upgrade(id),'A little more confidence, a little more skill.');return;}
    if(a==='model'){act(()=>game.setModel(id),'Business structure updated.');return;}
    if(a==='regions'){openRegions();return;}
    if(a==='move-region'){const result=act(()=>game.moveRegion(id));if(result.ok){town.rebuild();closeModal();ui.status='A new chapter';render();toast('Welcome to '+game.region().name+'.');}return;}
    if(a==='permit'){act(()=>game.permit(),'Your fictional city permit is up to date.');return;}
    if(a==='agency'){act(()=>game.startAgency(),'Your community studio is open. A new chapter begins.');return;}
    if(a==='sleep'){if(state().activeDate){toast('Finish the current date before turning in.',true);return;}openSleep();return;}
    if(a==='confirm-sleep'){sleep();return;}
    if(a==='export'){exportSave();return;}
    if(a==='import'){$('import-file').click();return;}
    if(a==='reset'){modal('Begin a different little life?',`<p class="modal-sub">This replaces your current browser save. Export a backup first to keep this chapter.</p><div class="modal-actions"><button class="btn secondary" data-action="export">Export current save</button><button class="btn danger" data-action="confirm-reset">Start fresh</button></div>`,'A NEW BEGINNING','reset');return;}
    if(a==='confirm-reset'){setGame(new Game());closeModal();toast('A new beginning in Meadow Bay.');return;}
  }
  document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled){e.preventDefault();try{routeAction(el,e);}catch(error){console.error(error);toast(error.message||'That action is unavailable.',true);}}});
  document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(form.id==='booking-form')offerSubmit(form);if(form.id==='contact-form'){const fd=new FormData(form);const r=act(()=>game.setContact(form.dataset.person,{notes:String(fd.get('notes')),favorite:fd.get('favorite')==='on'}));if(r.ok){closeModal();toast('Little details saved.');}}if(form.id==='profile-form'){const fd=new FormData(form);const values=Object.fromEntries(fd.entries());values.background=fd.get('background')||state().avatar.background;const r=act(()=>{game.customize(values);state().settings.reducedMotion=fd.get('reducedMotion')==='on';});if(r.ok){town.rebuild();closeModal();render();toast('A little more you.');}}});
  document.addEventListener('input',e=>{if(e.target.id==='base-rate'){state().baseRate=Number(e.target.value);$('rate-value').textContent=money(state().baseRate);}});
  document.addEventListener('change',e=>{if(e.target.id==='base-rate'){save();toast('Base rate updated. Existing bookings keep their agreed price.');}});
  $('import-file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>2e6)throw new Error('This save file is too large.');const candidate=new Game(JSON.parse(await f.text()));window.__pendingImport=candidate;modal('Continue a saved chapter?',`<p class="modal-sub">Restore <b>${esc(candidate.s.avatar.name)}</b> on day <b>${candidate.s.day}</b>, with <b>${money(candidate.s.money)}</b>? This will replace the current browser save.</p><div class="modal-actions"><button class="btn secondary" data-action="close">Keep this session</button><button class="btn primary" id="confirm-import">Restore this save</button></div>`,'PORTABLE SAVE','import');$('confirm-import').onclick=()=>{setGame(window.__pendingImport);window.__pendingImport=null;closeModal();if(state().activeDate)openDate();toast('Your saved chapter is restored.');};}catch(error){toast('Save not imported: '+error.message,true);}finally{e.target.value='';}});
  document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);if(!$('modal-shade').hidden){if(e.key==='Escape'&&!state().activeDate){e.preventDefault();closeModal();}if(e.key==='Tab'){const focusables=[...$('modal').querySelectorAll('button:not(:disabled),a,input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')];if(focusables.length){const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('modal'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===$('modal'))){e.preventDefault();first.focus();}}}return;}if(typing)return;if(e.code==='Space'){e.preventDefault();state().settings.speed=state().settings.speed?0:1;save();timeUI();}else if(e.key.toLowerCase()==='q')town.rotate(-1);else if(e.key.toLowerCase()==='e')town.rotate(1);else if(e.key.toLowerCase()==='f')town.interact();else if(['+','='].includes(e.key))town.adjustZoom(1);else if(e.key==='-')town.adjustZoom(-1);else if(e.key==='Escape'){town.path=[];town.intent=null;}});
  window.addEventListener('beforeunload',()=>save());document.addEventListener('visibilitychange',()=>{if(document.hidden){save();town.keys.clear();}});
  document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
  render();town=new GCTown($('renderCanvas'),game,{venue:id=>goVenue(id),arrive,moving:intent=>{ui.status=intent?'On the way to '+VENUES[intent.venue].short:'A little wander';},notice:toast,labels:positionLabels,renderer:name=>$('renderer-note').textContent=name,tick});
  window.GCApp={game,town,ui,render,act,openNegotiation,beginDate,openDate,help,setGame};
  save();if(loadWarning)toast(loadWarning,true);if(state().activeDate)setTimeout(openDate,100);
})();

</script>
</body>
</html>
