<script>
"use strict";

// ============================================================
//  Constants & tuning
// ============================================================
const TAU = Math.PI * 2;
const W = 1280, H = 720;
const INK = "#1b1518";
const PAPER = "#efe4c8";
const FLOOR = "#dcca9f";
const STONE = "#6d5a4b";
const ARENA = { x0: 60, y0: 120, x1: 1220, y1: 590 };
const PILLARS = [
  { x: 430, y: 250, r: 38 }, { x: 850, y: 250, r: 38 },
  { x: 430, y: 460, r: 38 }, { x: 850, y: 460, r: 38 },
  { x: 640, y: 355, r: 30 },
];
const WAVES = [
  { wisp: 6, shade: 0 },
  { wisp: 4, shade: 2 },
  { wisp: 5, shade: 3 },
];
const ATTRACT_DELAY = 10;
const CARDS = {
  lance: { name: "LANCE MOTE", cd: 1.1, color: "#ffcf4a" },
  echo:  { name: "ECHO RING",  cd: 5,   color: "#8fd3ff" },
  ward:  { name: "WARD BLOOM", cd: 8,   color: "#9be38a" },
  rend:  { name: "REND FAN",   cd: 2.2, color: "#ff9a8a" },
};
const COLORS = {
  wisp:  ["#49c7b5", "#1f6f67"],
  shade: ["#a77ae8", "#5b3a9c"],
  boss:  ["#d24a5a", "#6e1a2b"],
};
const SFX = {
  swing: [420, 180, 0.08, "triangle"],
  hit:   [260, 90, 0.07, "square"],
  cast:  [640, 260, 0.16, "sawtooth"],
  shot:  [700, 380, 0.09, "square"],
  hurt:  [160, 50, 0.22, "sawtooth"],
  pop:   [520, 160, 0.12, "sine"],
  pick:  [880, 1320, 0.18, "sine"],
  tick:  [600, 600, 0.03, "square"],
  win:   [523, 1046, 0.6, "triangle"],
  lose:  [330, 70, 0.9, "sawtooth"],
};

// ============================================================
//  Helpers
// ============================================================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angDiff = (a, b) => Math.abs((((a - b + Math.PI) % TAU) + TAU) % TAU - Math.PI);

// ============================================================
//  Canvas & view
// ============================================================
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let dpr = 1;
let view = { s: 1, ox: 0, oy: 0 };

function resize() {
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  const s = Math.min(innerWidth / W, innerHeight / H);
  view = { s, ox: (innerWidth - W * s) / 2, oy: (innerHeight - H * s) / 2 };
}
window.addEventListener("resize", resize);
resize();

function toLogical(e) {
  return { x: (e.clientX - view.ox) / view.s, y: (e.clientY - view.oy) / view.s };
}

function makePattern(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"));
  return ctx.createPattern(c, "repeat");
}
const hatchPattern = makePattern(14, 14, (g) => {
  g.strokeStyle = "rgba(27,21,24,0.10)";
  g.lineWidth = 2;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(14, 14); g.stroke();
});
const dotPattern = makePattern(14, 14, (g) => {
  g.fillStyle = "rgba(27,21,24,0.14)";
  g.beginPath(); g.arc(7, 7, 2.2, 0, TAU); g.fill();
});

// ============================================================
//  Options & persistence
// ============================================================
const opts = { sound: true, shake: true, hints: true };
try {
  Object.assign(opts, JSON.parse(localStorage.getItem("pdb-opts") || "{}"));
} catch (e) { /* storage unavailable: keep defaults */ }
function saveOpts() {
  try { localStorage.setItem("pdb-opts", JSON.stringify(opts)); } catch (e) { /* ignore */ }
}

// ============================================================
//  Audio (tiny WebAudio blips, created lazily after a gesture)
// ============================================================
let actx = null;
function audioInit() {
  if (!actx && navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume().catch(() => {});
  } catch (e) { actx = null; }
}
function sfx(name) {
  if (!opts.sound || !actx || actx.state !== "running") return;
  const [f0, f1, d, type] = SFX[name];
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d);
  g.gain.setValueAtTime(0.07, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + d);
  o.connect(g).connect(actx.destination);
  o.start(t);
  o.stop(t + d + 0.02);
}

// ============================================================
//  Input: keyboard, gamepad (standard mapping), pointer
// ============================================================
const BIND = {
  up:      { keys: ["ArrowUp", "KeyW"],                pad: [12] },
  down:    { keys: ["ArrowDown", "KeyS"],              pad: [13] },
  left:    { keys: ["ArrowLeft", "KeyA"],              pad: [14] },
  right:   { keys: ["ArrowRight", "KeyD"],             pad: [15] },
  confirm: { keys: ["Enter", "Space"],                 pad: [0] },
  back:    { keys: ["Escape", "Backspace"],            pad: [1] },
  pause:   { keys: ["Escape", "KeyP"],                 pad: [9] },
  attack:  { keys: ["KeyJ", "KeyZ"],                   pad: [2] },
  dash:    { keys: ["KeyK", "KeyX", "Space"],          pad: [0] },
  slot0:   { keys: ["KeyI"],                           pad: [3] },
  slot1:   { keys: ["KeyU"],                           pad: [4] },
  slot2:   { keys: ["KeyO"],                           pad: [5] },
};
const STICK = {
  up:    (gp) => gp.axes[1] < -0.5,
  down:  (gp) => gp.axes[1] > 0.5,
  left:  (gp) => gp.axes[0] < -0.5,
  right: (gp) => gp.axes[0] > 0.5,
};
const keys = new Set();
const pendingKeyActions = new Set();   // catches taps shorter than one frame
const prevHeld = new Set();
let clickPending = false;
let lastDevice = "kb";

window.addEventListener("keydown", (e) => {
  if (e.isTrusted) audioInit();
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);
  lastDevice = "kb";
  for (const a in BIND) if (BIND[a].keys.includes(e.code)) pendingKeyActions.add(a);
  pendingKeyActions.add("any");
});
window.addEventListener("keyup", (e) => keys.delete(e.code));
window.addEventListener("blur", () => keys.clear());

canvas.addEventListener("pointerdown", (e) => {
  if (e.isTrusted) audioInit();
  lastDevice = "mouse";
  const p = toLogical(e);
  if (!pointerActivate(p)) clickPending = true;
});
canvas.addEventListener("pointermove", (e) => {
  const p = toLogical(e);
  for (const r of menuRects) {
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
      sel = r.i;
      break;
    }
  }
});

function readInput() {
  const held = new Set();
  const padHeld = new Set();
  let mx = 0, my = 0, stick = null;

  for (const a in BIND) if (BIND[a].keys.some((c) => keys.has(c))) held.add(a);
  for (const gp of navigator.getGamepads ? navigator.getGamepads() : []) {
    if (!gp) continue;
    for (const a in BIND) if (BIND[a].pad.some((i) => gp.buttons[i] && gp.buttons[i].pressed)) padHeld.add(a);
    for (const a in STICK) if (STICK[a](gp)) padHeld.add(a);
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (Math.hypot(ax, ay) > 0.2) stick = [ax, ay];
  }
  padHeld.forEach((a) => held.add(a));

  if (stick) { mx = stick[0]; my = stick[1]; }
  else {
    if (held.has("left")) mx -= 1;
    if (held.has("right")) mx += 1;
    if (held.has("up")) my -= 1;
    if (held.has("down")) my += 1;
  }

  const pressed = new Set();
  for (const a of held) if (!prevHeld.has(a)) pressed.add(a);
  pendingKeyActions.forEach((a) => pressed.add(a));
  pendingKeyActions.clear();
  if (clickPending) { pressed.add("click"); clickPending = false; }
  if ([...pressed].some((a) => padHeld.has(a))) lastDevice = "pad";

  prevHeld.clear();
  held.forEach((a) => prevHeld.add(a));
  const len = Math.hypot(mx, my);
  if (len > 1) { mx /= len; my /= len; }
  return { held, pressed, mx, my };
}

// ============================================================
//  Menus (shared by every menu screen; keyboard, pad and pointer)
// ============================================================
let sel = 0;
let menuRects = [];

function handleMenu(items, inp) {
  if (items.length === 0) return;
  sel = clamp(sel, 0, items.length - 1);
  const n = items.length;
  if (inp.pressed.has("up")) { sel = (sel + n - 1) % n; sfx("tick"); }
  if (inp.pressed.has("down")) { sel = (sel + 1) % n; sfx("tick"); }
  const it = items[sel];
  if (inp.pressed.has("left") && it.adjust) it.adjust(-1);
  if (inp.pressed.has("right") && it.adjust) it.adjust(1);
  if (inp.pressed.has("confirm")) activate(it);
}
function activate(it) {
  sfx("tick");
  if (it.adjust) it.adjust(1);
  else if (it.run) it.run();
}
function pointerActivate(p) {
  for (const r of menuRects) {
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
      sel = r.i;
      activate(r.item);
      return true;
    }
  }
  return false;
}

// ============================================================
//  Scene management
// ============================================================
let scene = "title";
let returnTo = "title";
let run = null;
let idle = 0;
let last = performance.now();
let clock = 0;

function go(s, from) {
  scene = s;
  if (from !== undefined) returnTo = from;
  sel = 0;
}
function toTitle() {
  run = null;
  idle = 0;
  go("title");
}
function startDemo() {
  newRun(true);
  scene = "play";
  sel = 0;
}
function startRun() {
  newRun(false);
  go("play");
}

// ============================================================
//  Cel-shading primitives
// ============================================================
// shape(x, y, k): builds a path centred on (x, y), scaled by k.
// Draws a flat base colour, a hard-edged shade band on the lower-right, and an ink outline.
function cel(x, y, r, base, shade, shape, lw = 3.5) {
  ctx.save();
  ctx.beginPath(); shape(x, y, 1); ctx.clip();
  ctx.fillStyle = shade;
  ctx.fillRect(x - r * 1.6, y - r * 1.6, r * 3.2, r * 3.2);
  ctx.beginPath(); shape(x - r * 0.18, y - r * 0.22, 0.9);
  ctx.fillStyle = base; ctx.fill();
  ctx.restore();
  ctx.beginPath(); shape(x, y, 1);
  ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.lineJoin = "round"; ctx.stroke();
}
const circleShape = (r) => (x, y, k) => { ctx.moveTo(x + r * k, y); ctx.arc(x, y, r * k, 0, TAU); };
const ghostShape = (r) => (x, y, k) => {
  const R = r * k;
  ctx.moveTo(x - R, y + r * 0.2);
  ctx.arc(x, y - r * 0.2, R, Math.PI, 0);
  ctx.lineTo(x + R, y + r * 0.9);
  for (let i = 0; i < 4; i++) {
    const xm = x + R - (i + 0.5) * (R / 2);
    const xe = x + R - (i + 1) * (R / 2);
    ctx.quadraticCurveTo(xm, y + r * 1.35, xe, y + r * 0.9);
  }
  ctx.closePath();
};

function ellipseShadow(x, y, rx, ry, a = 0.28) {
  ctx.fillStyle = `rgba(27,21,24,${a})`;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill();
}

function text(str, x, y, o = {}) {
  const { font = "34px Bangers", fill = "#fff", stroke = INK, lw = 6, align = "center", base = "middle" } = o;
  ctx.font = font;
  ctx.textAlign = align;
  ctx.textBaseline = base;
  if (stroke && lw > 0) {
    ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = "round";
    ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}

function extruded(str, x, y, size, fill, depth = 9) {
  ctx.font = `${size}px Bangers`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = INK;
  for (let i = depth; i > 0; i--) ctx.fillText(str, x + i, y + i);
  ctx.lineWidth = 10; ctx.strokeStyle = INK; ctx.lineJoin = "round";
  ctx.strokeText(str, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function panel(x, y, w, h, fill = PAPER, shadow = 8) {
  ctx.fillStyle = INK;
  rrect(x + shadow, y + shadow, w, h, 18); ctx.fill();
  ctx.fillStyle = fill;
  rrect(x, y, w, h, 18); ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
}

// ============================================================
//  Menu drawing
// ============================================================
function drawMenu(items, cx, top, gap = 84) {
  const w = 480, h = 64;
  menuRects = [];
  items.forEach((it, i) => {
    const x = cx - w / 2, y = top + i * gap;
    const on = i === sel;
    ctx.fillStyle = INK;
    rrect(x + 6, y + 6, w, h, 14); ctx.fill();
    ctx.fillStyle = on ? "#ffcf4a" : "#f7efdc";
    rrect(x, y, w, h, 14); ctx.fill();
    ctx.lineWidth = on ? 5 : 3; ctx.strokeStyle = INK; ctx.stroke();
    if (on) {
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.moveTo(x - 26, y + h / 2 - 12); ctx.lineTo(x - 8, y + h / 2); ctx.lineTo(x - 26, y + h / 2 + 12);
      ctx.closePath(); ctx.fill();
    }
    text(it.label, cx, y + h / 2 + 2, { font: "36px Bangers", fill: INK, stroke: null });
    menuRects.push({ x, y, w, h, i, item: it });
  });
}

function hintLine() {
  if (lastDevice === "pad") return "D-PAD / STICK move   ·   CROSS select   ·   CIRCLE back";
  if (lastDevice === "mouse") return "CLICK select   ·   ARROWS / WASD also work";
  return "ARROWS / WASD move   ·   ENTER select   ·   ESC back";
}

// ============================================================
//  Title & backdrop
// ============================================================
const MOTES = Array.from({ length: 70 }, () => ({
  x: rnd(0, W), y: rnd(0, H), s: rnd(6, 18), p: rnd(0, 9),
}));

function drawBackdrop(t) {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.rotate(t * 0.05);
  ctx.fillStyle = "rgba(27,21,24,0.06)";
  for (let i = 0; i < 24; i++) {
    ctx.rotate(TAU / 24);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-30, 1400); ctx.lineTo(30, 1400); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = dotPattern;
  ctx.fillRect(0, 0, W, H);
  for (const m of MOTES) {
    const x = m.x + Math.sin(t * 0.5 + m.p) * 30;
    const y = (((m.y - t * m.s) % H) + H) % H;
    ctx.fillStyle = m.p > 4.5 ? "rgba(255,95,80,0.75)" : "rgba(27,21,24,0.55)";
    ctx.beginPath(); ctx.arc(x, y, 2.5 + (m.p % 3), 0, TAU); ctx.fill();
  }
}

function drawTitle(t) {
  drawBackdrop(t);
  const bob = Math.sin(t * 2) * 4;
  ctx.save();
  ctx.translate(W / 2, 168 + bob);
  ctx.rotate(-0.04);
  extruded("PHANTOM", 0, 0, 120, "#f6efdc");
  ctx.restore();
  ctx.save();
  ctx.translate(W / 2, 290 - bob);
  ctx.rotate(0.03);
  extruded("DUSTBUNNY", 0, 0, 118, "#ff7a6b");
  ctx.restore();
  text("AN ORIGINAL SPIRITUAL SUCCESSOR  ·  VERTICAL SLICE", W / 2, 360, { font: "24px Inter", fill: INK, stroke: null, base: "middle" });
  drawMenu(titleItems(), W / 2, 404);
  text(hintLine(), W / 2, 702, { font: "20px Inter", fill: INK, stroke: null });
}

function titleItems() {
  return [
    { label: "START RUN", run: startRun },
    { label: "OPTIONS", run: () => go("options", "title") },
    { label: "ABOUT & CREDITS", run: () => go("about", "title") },
  ];
}

// ============================================================
//  Options & About & Touch-block screens
// ============================================================
function optionItems() {
  return [
    { label: `SOUND: ${opts.sound ? "ON" : "OFF"}`, adjust: () => { opts.sound = !opts.sound; saveOpts(); if (opts.sound) audioInit(); } },
    { label: `SCREEN SHAKE: ${opts.shake ? "ON" : "OFF"}`, adjust: () => { opts.shake = !opts.shake; saveOpts(); } },
    { label: `CONTROL HINTS: ${opts.hints ? "ON" : "OFF"}`, adjust: () => { opts.hints = !opts.hints; saveOpts(); } },
    { label: "BACK", run: () => go(returnTo) },
  ];
}
function drawOptions(t) {
  drawBackdrop(t);
  text("OPTIONS", W / 2, 130, { font: "84px Bangers", fill: "#ff7a6b", lw: 10 });
  drawMenu(optionItems(), W / 2, 210);
  text("Left / Right or Enter toggles  ·  Escape goes back", W / 2, 650, { font: "20px Inter", fill: INK, stroke: null });
}

// [font, size, text, space-below]
const ABOUT_LINES = [

  ["20px Inter", 0, "An original spiritual successor, built as a single-file vertical slice.", 34],
  ["20px Inter", 0, "Inspired by Phantom Dust (Xbox, 2004). Names, art and code are original.", 40],
  ["800 22px Inter", 0, "Source Information", 34],
  ["18px Inter", 0, "Initial Date: 2026-10-17  ·  SOURCE: Phantom Dust (Xbox, 2004)", 30],
  ["18px Inter", 0, "Tech/Engine: Vanilla JavaScript (ES2022) + HTML5 Canvas 2D; Bangers & Inter (Google Fonts)", 30],
  ["18px Inter", 0, "Environment: CLI (Claude Code); Linux on WSL2; browser: unknown", 30],
  ["18px Inter", 0, "Model and Effort Level: Anthropic Claude Haiku 5.5 (claude-haiku-5-5); effort: unknown", 0],
];
function drawAbout(t) {
  drawBackdrop(t);
  panel(170, 80, 940, 430, "#f7efdc");
  let y = 150;
  for (const [font, , line, below] of ABOUT_LINES) {

function touchItems() {
  return [{ label: "SETTINGS", run: () => go("options", "touch") }];
}
function drawTouchBlock(t) {

  extruded("PHANTOM DUSTBUNNY", W / 2, 230, 88, "#f6efdc");

  text("Connect a PS5-compatible controller or a keyboard to play.", W / 2, 404, { font: "24px Inter", fill: INK, stroke: null });

// ============================================================
//  Run: creation & level flow
// ============================================================
function newPlayer() {
  return {
    x: 640, y: 470, vx: 0, vy: 0, kvx: 0, kvy: 0, r: 18,
    hp: 100, maxHp: 100, face: -Math.PI / 2,
    dashT: 0, dashCd: 0, dashDx: 0, dashDy: 0,
    invuln: 0, atkT: 0, atkCd: 0, swingA: 0,
    slots: [{ card: "lance", cd: 0 }, { card: "echo", cd: 0 }, { card: "ward", cd: 0 }],
  };
}

function newRun(demo) {
  run = {
    demo, time: 0, kills: 0, wave: -1, phase: "intro", timer: 1.6, endT: 0,
    banner: { text: "ASHEN CLOISTER", t: 1.6, max: 1.6 },
    spawnQ: [], pending: [], spawnT: 0.6,
    enemies: [], shots: [], pshots: [], orbs: [], fx: [], parts: [],
    boss: null, shake: 0, player: newPlayer(),
  };
}

function setBanner(t, dur) { run.banner = { text: t, t: dur, max: dur }; }

function startWave(i) {
  run.wave = i;
  const w = WAVES[i];
  const q = [];
  for (let k = 0; k < w.wisp; k++) q.push("wisp");
  for (let k = 0; k < w.shade; k++) q.push("shade");
  run.spawnQ = q.sort(() => Math.random() - 0.5);
  run.spawnT = 0.6;
  run.phase = "wave";
  setBanner(`WAVE ${i + 1} / ${WAVES.length}`, 1.4);
}

function edgeSpawn() {
  const p = run.player;
  let best = null;
  for (let i = 0; i < 8; i++) {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = rnd(ARENA.x0 + 40, ARENA.x1 - 40); y = ARENA.y0 + 40; }
    else if (side === 1) { x = rnd(ARENA.x0 + 40, ARENA.x1 - 40); y = ARENA.y1 - 40; }
    else if (side === 2) { x = ARENA.x0 + 40; y = rnd(ARENA.y0 + 40, ARENA.y1 - 40); }
    else { x = ARENA.x1 - 40; y = rnd(ARENA.y0 + 40, ARENA.y1 - 40); }
    best = { x, y };
    if (Math.hypot(x - p.x, y - p.y) > 220) break;
  }
  return best;
}

function spawnTick(dt) {
  const r = run;
  r.spawnT -= dt;
  if (r.spawnQ.length && r.spawnT <= 0 && r.enemies.length + r.pending.length < 7) {
    const type = r.spawnQ.pop();
    const pos = edgeSpawn();
    r.pending.push({ type, x: pos.x, y: pos.y, t: 0.9, max: 0.9 });
    r.spawnT = 0.55;
  }
}

function updatePending(dt) {
  const r = run;
  r.pending = r.pending.filter((s) => {
    s.t -= dt;
    if (s.t > 0) return true;
    r.enemies.push(makeEnemy(s.type, s.x, s.y));
    burst(s.x, s.y, "#fff7d6", 8, 160);
    sfx("pop");
    return false;
  });
}

function makeEnemy(type, x, y) {
  if (type === "wisp") {
    return { type, x, y, vx: 0, vy: 0, kvx: 0, kvy: 0, r: 20, hp: 30, maxHp: 30, flash: 0, hitCd: 0, stun: 0, t: rnd(0, 9), face: 0, dead: false };
  }
  return { type: "shade", x, y, vx: 0, vy: 0, kvx: 0, kvy: 0, r: 24, hp: 50, maxHp: 50, flash: 0, cool: rnd(1.2, 2), stun: 0, strafe: Math.random() < 0.5 ? 1 : -1, hitCd: 0, t: 0, dead: false };
}

function makeBoss() {
  return {
    isBoss: true, x: 640, y: 225, r: 58, hp: 600, max: 600, phase: "A",
    state: "idle", timer: 1.4, tx: 640, ty: 225, mt: 1,
    flash: 0, spin: 0, spawnCool: 4, aimX: 0, aimY: 0, dirX: 0, dirY: 0,
    hitDone: false, ringOff: 0, dead: false, kvx: 0, kvy: 0,
  };
}

// ============================================================
//  Collision & world helpers
// ============================================================
function collide(o) {
  o.x = clamp(o.x, ARENA.x0 + o.r, ARENA.x1 - o.r);
  o.y = clamp(o.y, ARENA.y0 + o.r, ARENA.y1 - o.r);
  for (const q of PILLARS) {
    const dx = o.x - q.x, dy = o.y - q.y;
    const d = Math.hypot(dx, dy), min = o.r + q.r;
    if (d < min && d > 0.001) {
      const k = (min - d) / d;
      o.x += dx * k; o.y += dy * k;
    }
  }
}
function hitsWall(s) {
  if (s.x < ARENA.x0 || s.x > ARENA.x1 || s.y < ARENA.y0 || s.y > ARENA.y1) return true;
  for (const q of PILLARS) if (Math.hypot(s.x - q.x, s.y - q.y) < q.r + s.r) return true;
  return false;
}

function allTargets() {
  const list = run.enemies.filter((e) => !e.dead);
  if (run.boss && !run.boss.dead) list.push(run.boss);
  return list;
}

// ============================================================
//  Effects
// ============================================================
function burst(x, y, color, n, spd = 200) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(spd * 0.3, spd);
    run.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.3, 0.7), t: 0, c: color, s: rnd(3, 7) });
  }
}
function floatText(x, y, str, color) {
  run.fx.push({ k: "text", x, y, text: str, color, t: 0, life: 1.2 });
}
function ringFx(x, y, r1, color, life = 0.4) {
  run.fx.push({ k: "ring", x, y, r1, t: 0, life, color });
}

function updateFx(dt) {
  const r = run;
  for (const f of r.fx) f.t += dt;
  r.fx = r.fx.filter((f) => f.t < f.life);
  for (const p of r.parts) {
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.exp(-dt * 4); p.vy *= Math.exp(-dt * 4);
  }
  r.parts = r.parts.filter((p) => p.t < p.life);
}

// ============================================================
//  Damage
// ============================================================
function hurtTarget(t, dmg, dx = 0, dy = 0, force = 0) {
  if (t.hp <= 0) return;
  t.hp -= dmg;
  t.flash = 0.12;
  if (!t.isBoss) {
    const d = Math.hypot(dx, dy) || 1;
    t.kvx += (dx / d) * force;
    t.kvy += (dy / d) * force;
  }
  burst(t.x, t.y, "#fffbe8", 5, 160);
  sfx("hit");
}

function hurtPlayer(amt, fx, fy) {
  const r = run, p = r.player;
  if (p.hp <= 0 || p.invuln > 0 || p.dashT > 0) return;
  p.hp = Math.max(0, p.hp - amt);
  p.invuln = 0.6;
  const d = Math.hypot(p.x - fx, p.y - fy) || 1;
  p.kvx += ((p.x - fx) / d) * 260;
  p.kvy += ((p.y - fy) / d) * 260;
  r.shake = Math.max(r.shake, 0.35);
  burst(p.x, p.y, "#c4283a", 10, 220);
  sfx("hurt");
  if (p.hp <= 0) {
    r.phase = "lost";
    r.endT = 0;
    burst(p.x, p.y, "#3d7fd6", 24, 300);
    sfx("lose");
  }
}

// ============================================================
//  Player
// ============================================================
function attack() {
  const r = run, p = r.player;
  p.atkCd = 0.36;
  p.atkT = 0.2;
  sfx("swing");
  let near = null, nd = 150;
  for (const t of allTargets()) {
    const d = Math.hypot(t.x - p.x, t.y - p.y);
    if (d < nd) { nd = d; near = t; }
  }
  if (near) p.face = Math.atan2(near.y - p.y, near.x - p.x);
  p.swingA = p.face;
  for (const t of allTargets()) {
    const dx = t.x - p.x, dy = t.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d < t.r + 80 && angDiff(Math.atan2(dy, dx), p.face) < 1.05) {
      hurtTarget(t, 26, dx, dy, 300);
    }
  }
}

function cast(i) {
  const r = run, p = r.player;
  const s = p.slots[i];
  if (s.cd > 0 || p.hp <= 0) return;
  const c = CARDS[s.card];
  s.cd = c.cd;
  sfx("cast");
  const cs = Math.cos(p.face), sn = Math.sin(p.face);
  switch (s.card) {
    case "lance":
      r.pshots.push({ x: p.x + cs * 24, y: p.y + sn * 24, vx: cs * 620, vy: sn * 620, dmg: 34, r: 12, life: 0.9, pierce: true, hit: new Set(), color: c.color });
      break;
    case "rend":
      for (const d of [-0.28, 0, 0.28]) {
        const a = p.face + d;
        r.pshots.push({ x: p.x, y: p.y, vx: Math.cos(a) * 540, vy: Math.sin(a) * 540, dmg: 14, r: 9, life: 0.6, pierce: false, hit: new Set(), color: c.color });
      }
      break;
    case "echo":
      ringFx(p.x, p.y, 200, c.color, 0.4);
      for (const t of allTargets()) {
        const dx = t.x - p.x, dy = t.y - p.y;
        if (Math.hypot(dx, dy) < 200 + t.r) {
          hurtTarget(t, t.isBoss ? 30 : 18, dx, dy, 280);
          if (!t.isBoss) t.stun = 1.2;
        }
      }
      break;
    case "ward":
      p.hp = Math.min(p.maxHp, p.hp + 30);
      ringFx(p.x, p.y, 70, c.color, 0.5);
      floatText(p.x, p.y - 30, "+30", c.color);
      break;
  }
}

function updatePlayer(dt, inp) {
  const r = run, p = r.player;
  if (p.hp <= 0) return;
  p.atkCd = Math.max(0, p.atkCd - dt);
  p.atkT = Math.max(0, p.atkT - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.dashT = Math.max(0, p.dashT - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  for (const s of p.slots) s.cd = Math.max(0, s.cd - dt);
  p.kvx *= Math.exp(-dt * 9);
  p.kvy *= Math.exp(-dt * 9);

  const len = Math.hypot(inp.mx, inp.my);
  if (len > 0.15 && p.dashT <= 0) p.face = Math.atan2(inp.my, inp.mx);

  if (inp.pressed.has("dash") && p.dashCd <= 0 && p.dashT <= 0) {
    const dx = len > 0.15 ? inp.mx / len : Math.cos(p.face);
    const dy = len > 0.15 ? inp.my / len : Math.sin(p.face);
    p.dashDx = dx; p.dashDy = dy;
    p.dashT = 0.18; p.dashCd = 0.7;
    p.invuln = Math.max(p.invuln, 0.18);
    p.face = Math.atan2(dy, dx);
    sfx("swing");
    r.fx.push({ k: "trail", x: p.x, y: p.y, face: p.face, t: 0, life: 0.3 });
  }

  if (p.dashT > 0) { p.vx = p.dashDx * 760; p.vy = p.dashDy * 760; }
  else { p.vx = inp.mx * 250; p.vy = inp.my * 250; }

  if (inp.pressed.has("attack") && p.atkCd <= 0) attack();
  if (inp.pressed.has("slot0")) cast(0);
  if (inp.pressed.has("slot1")) cast(1);
  if (inp.pressed.has("slot2")) cast(2);

  p.x += (p.vx + p.kvx) * dt;
  p.y += (p.vy + p.kvy) * dt;
  collide(p);
}

// ============================================================
//  Enemies
// ============================================================
function updateEnemies(dt) {
  const r = run, p = r.player;
  for (const e of r.enemies) {
    e.t += dt;
    e.flash = Math.max(0, e.flash - dt);
    e.hitCd = Math.max(0, e.hitCd - dt);
    e.stun = Math.max(0, e.stun - dt);
    e.kvx *= Math.exp(-dt * 7);
    e.kvy *= Math.exp(-dt * 7);

    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    let vx = 0, vy = 0;

    if (e.stun <= 0) {
      if (e.type === "wisp") {
        const w = Math.sin(e.t * 5) * 50;
        vx = ux * 120 - uy * w;
        vy = uy * 120 + ux * w;
        e.face = Math.atan2(vy, vx);
        if (d < e.r + p.r + 2 && e.hitCd <= 0) {
          hurtPlayer(10, e.x, e.y);
          e.hitCd = 0.9;
        }
      } else {
        const sp = d < 200 ? -90 : d > 300 ? 70 : 0;
        if (d > 200 && d < 300 && Math.random() < 0.004) e.strafe *= -1;
        vx = ux * sp - uy * 60 * e.strafe;
        vy = uy * sp + ux * 60 * e.strafe;
        e.cool -= dt;
        if (e.cool <= 0 && d < 640) {
          e.cool = rnd(2.2, 2.8);
          r.shots.push({ x: e.x, y: e.y, vx: ux * 230, vy: uy * 230, r: 9, dmg: 12, life: 4 });
          sfx("shot");
        }
      }
    }
    e.x += (vx + e.kvx) * dt;
    e.y += (vy + e.kvy) * dt;
    collide(e);
  }
}

function cleanupEnemies() {
  const r = run;
  for (const e of r.enemies) {
    if (e.hp <= 0 && !e.dead) {
      e.dead = true;
      r.kills++;
      burst(e.x, e.y, COLORS[e.type][0], 16, 260);
      if (Math.random() < (e.type === "shade" ? 0.7 : 0.25)) dropOrb(e.x, e.y);
      sfx("pop");
    }
  }
  r.enemies = r.enemies.filter((e) => !e.dead);
}

// ============================================================
//  Boss: The Hollow Mother
// ============================================================
function updateBoss(dt) {
  const r = run, b = r.boss, p = r.player;
  if (!b || b.dead) return;
  b.flash = Math.max(0, b.flash - dt);
  b.spin += dt;
  b.timer -= dt;
  b.kvx *= Math.exp(-dt * 7);
  b.kvy *= Math.exp(-dt * 7);

  if (b.phase === "A" && b.hp <= 300) {
    b.phase = "B";
    setBanner("THE MOTHER SHRIEKS", 1.8);
    r.shake = 0.8;
    for (let i = 0; i < 2; i++) r.enemies.push(makeEnemy("wisp", b.x + rnd(-80, 80), b.y + rnd(60, 120)));
  }

  if (b.state === "idle") {
    let tx, ty, sp;
    if (b.phase === "A") {
      b.mt -= dt;
      if (b.mt <= 0) { b.tx = rnd(ARENA.x0 + 120, ARENA.x1 - 120); b.ty = rnd(ARENA.y0 + 100, ARENA.y1 - 100); b.mt = rnd(2, 3.5); }
      tx = b.tx; ty = b.ty; sp = 60;
    } else {
      tx = p.x; ty = p.y; sp = 70;
    }
    const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy);
    if (d > 4 && (b.phase === "A" || d > 180)) {
      b.x += (dx / d) * sp * dt;
      b.y += (dy / d) * sp * dt;
    }
    if (b.timer <= 0) {
      if (Math.random() < (b.phase === "B" ? 0.55 : 0.3)) {
        b.state = "aim"; b.timer = 0.85;
        b.aimX = p.x; b.aimY = p.y;
      } else {
        b.state = "ring"; b.timer = 0.95;
      }
    }
  } else if (b.state === "ring") {
    if (b.timer <= 0) {
      for (let i = 0; i < 16; i++) {
        const a = b.ringOff + (i * TAU) / 16;
        r.shots.push({ x: b.x, y: b.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, r: 10, dmg: 12, life: 5 });
      }
      b.ringOff += rnd(0.1, 0.3);
      sfx("shot");
      b.state = "idle"; b.timer = 1.5;
    }
  } else if (b.state === "aim") {
    if (b.timer <= 0) {
      const dx = b.aimX - b.x, dy = b.aimY - b.y, d = Math.hypot(dx, dy) || 1;
      b.dirX = dx / d; b.dirY = dy / d;
      b.state = "charge"; b.timer = 0.5; b.hitDone = false;
      sfx("cast");
    }
  } else if (b.state === "charge") {
    b.x += b.dirX * 680 * dt;
    b.y += b.dirY * 680 * dt;
    const hitWall = b.x <= ARENA.x0 + b.r || b.x >= ARENA.x1 - b.r || b.y <= ARENA.y0 + b.r || b.y >= ARENA.y1 - b.r;
    collide(b);
    if (!b.hitDone && Math.hypot(p.x - b.x, p.y - b.y) < b.r + p.r) {
      hurtPlayer(22, b.x, b.y);
      b.hitDone = true;
    }
    if (b.timer <= 0 || hitWall) {
      b.state = "idle"; b.timer = 1.4;
      r.shake = Math.max(r.shake, 0.5);
      burst(b.x, b.y, "#d24a5a", 12, 240);
    }
  }
  if (b.state !== "charge") {
    collide(b);
    if (b.state !== "aim" && Math.hypot(p.x - b.x, p.y - b.y) < b.r + p.r - 4) hurtPlayer(9, b.x, b.y);
  }

  if (b.phase === "B") {
    b.spawnCool -= dt;
    if (b.spawnCool <= 0) {
      b.spawnCool = 4.5;
      if (r.enemies.filter((e) => e.type === "wisp").length < 4) {
        r.enemies.push(makeEnemy("wisp", b.x + rnd(-70, 70), b.y + rnd(70, 120)));
        burst(b.x, b.y + 90, "#49c7b5", 8, 140);
      }
    }
  }

  if (b.hp <= 0) {
    b.dead = true;
    r.shake = 1;
    burst(b.x, b.y, "#d24a5a", 60, 420);
    for (const e of r.enemies) { burst(e.x, e.y, COLORS[e.type][0], 10, 200); }
    r.enemies = [];
    r.shots = [];
    r.phase = "won";
    r.endT = 0;
    sfx("win");
  }
}

// ============================================================
//  Shots, orbs & cards on the floor
// ============================================================
function updateShots(dt) {
  const r = run, p = r.player;
  r.pshots = r.pshots.filter((s) => {
    s.life -= dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.life <= 0 || hitsWall(s)) return false;
    for (const t of allTargets()) {
      if (s.hit.has(t)) continue;
      if (Math.hypot(t.x - s.x, t.y - s.y) < t.r + s.r) {
        s.hit.add(t);
        hurtTarget(t, s.dmg, s.vx, s.vy, 140);
        if (!s.pierce) return false;
      }
    }
    return true;
  });
  r.shots = r.shots.filter((s) => {
    s.life -= dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.life <= 0 || hitsWall(s)) return false;
    if (Math.hypot(p.x - s.x, p.y - s.y) < p.r + s.r) {
      hurtPlayer(s.dmg, s.x, s.y);
      return false;
    }
    return true;
  });
}

function dropOrb(x, y) {
  const pool = Object.keys(CARDS).filter((k) => k !== run.player.slots[2].card);
  run.orbs.push({ x, y, kind: pool[Math.floor(Math.random() * pool.length)], t: 0 });
}

function updateOrbs(dt) {
  const p = run.player;
  run.orbs = run.orbs.filter((o) => {
    o.t += dt;
    if (o.t > 14) return false;
    if (Math.hypot(p.x - o.x, p.y - o.y) < p.r + 22) {
      p.slots[2] = { card: o.kind, cd: 0 };
      sfx("pick");
      floatText(p.x, p.y - 44, `${CARDS[o.kind].name} ON R1`, CARDS[o.kind].color);
      return false;
    }
    return true;
  });
}

// ============================================================
//  Run update
// ============================================================
function updateRun(dt, inp) {
  const r = run;
  r.time += dt;
  r.shake = Math.max(0, r.shake - dt);
  if (r.banner) {
    r.banner.t -= dt;
    if (r.banner.t <= 0) r.banner = null;
  }

  const over = r.phase === "won" || r.phase === "lost";
  if (over) {
    r.endT += dt;
  } else {
    switch (r.phase) {
      case "intro":
        r.timer -= dt;
        if (r.timer <= 0) startWave(0);
        break;
      case "wave":
        spawnTick(dt);
        if (!r.spawnQ.length && !r.pending.length && !r.enemies.length) {
          if (r.wave < WAVES.length - 1) {
            r.phase = "cleared"; r.timer = 1.6;
            setBanner("CLEARED", 1.6);
          } else {
            r.phase = "bossintro"; r.timer = 2.4;
            setBanner("THE HOLLOW MOTHER", 2.4);
          }
        }
        break;
      case "cleared":
        r.timer -= dt;
        if (r.timer <= 0) startWave(r.wave + 1);
        break;
      case "bossintro":
        r.timer -= dt;
        if (r.timer <= 0) { r.phase = "boss"; r.boss = makeBoss(); }
        break;
    }
    updatePending(dt);
    updatePlayer(dt, inp);
    updateEnemies(dt);
    updateBoss(dt);
    updateShots(dt);
    updateOrbs(dt);
    cleanupEnemies();
  }
  updateFx(dt);
}

// ============================================================
//  AI pilot for attract mode (plays the same game through the same input contract)
// ============================================================
function aiInput() {
  const r = run, p = r.player;
  const pressed = new Set();
  let ax = 0, ay = 0;
  const live = allTargets();
  const near = live.filter((t) => !t.isBoss).sort((a, b) => dist(a, p) - dist(b, p))[0];
  const boss = r.boss && !r.boss.dead ? r.boss : null;
  const tgt = boss && (!near || dist(near, p) > 200) ? boss : (near || boss);

  let d = Infinity;
  if (tgt) {
    const dx = tgt.x - p.x, dy = tgt.y - p.y;
    d = Math.hypot(dx, dy) || 1;
    const pref = d > 150 ? 1 : d < 85 ? -0.6 : 0.15;
    ax += (dx / d) * pref; ay += (dy / d) * pref;
    const wob = Math.sin(r.time * 2.1) * 0.7;
    ax += (-dy / d) * wob; ay += (dx / d) * wob;
  } else if (r.orbs.length) {
    const o = r.orbs[0];
    const dx = o.x - p.x, dy = o.y - p.y, od = Math.hypot(dx, dy) || 1;
    ax += dx / od; ay += dy / od;
  }

  let threat = null;
  for (const s of r.shots) if (Math.hypot(s.x - p.x, s.y - p.y) < 95) { threat = s; break; }
  if (!threat && r.boss && !r.boss.dead && (r.boss.state === "charge" || r.boss.state === "aim") && dist(r.boss, p) < 230) threat = r.boss;
  if (threat) {
    const tx = p.x - threat.x, ty = p.y - threat.y, td = Math.hypot(tx, ty) || 1;
    let sx = -ty / td, sy = tx / td;
    if (sx * (640 - p.x) + sy * (355 - p.y) < 0) { sx = -sx; sy = -sy; }
    ax += sx * 2; ay += sy * 2;
    if (td < 55 && p.dashCd <= 0) pressed.add("dash");
  }

  const m = 110;
  if (p.x < ARENA.x0 + m) ax += 1.2;
  if (p.x > ARENA.x1 - m) ax -= 1.2;
  if (p.y < ARENA.y0 + m) ay += 1.2;
  if (p.y > ARENA.y1 - m) ay -= 1.2;

  const len = Math.hypot(ax, ay);
  const mx = len > 0.05 ? ax / len : 0;
  const my = len > 0.05 ? ay / len : 0;

  if (tgt && d < 120) pressed.add("attack");
  if (tgt && d > 300 && p.dashCd <= 0 && Math.random() < 0.01) pressed.add("dash");
  if (tgt && d > 110 && d < 520) pressed.add("slot0");
  const crowd = live.filter((t) => !t.isBoss && dist(t, p) < 200).length;
  if (crowd >= 2 || (tgt && !tgt.isBoss && d < 170)) pressed.add("slot1");
  if (p.slots[2].card === "ward") { if (p.hp < 55) pressed.add("slot2"); }
  else if (tgt && d < 480) pressed.add("slot2");

  return { held: new Set(), pressed, mx, my };
}

// ============================================================
//  Rendering: world
// ============================================================
function drawArena() {
  const { x0, y0, x1, y1 } = ARENA;
  const w = x1 - x0, h = y1 - y0;
  ctx.fillStyle = INK;
  rrect(x0 - 18 + 8, y0 - 18 + 8, w + 36, h + 36, 26); ctx.fill();
  ctx.fillStyle = STONE;
  rrect(x0 - 18, y0 - 18, w + 36, h + 36, 26); ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();

  ctx.fillStyle = FLOOR;
  rrect(x0, y0, w, h, 10); ctx.fill();
  ctx.save();
  rrect(x0, y0, w, h, 10); ctx.clip();
  ctx.fillStyle = dotPattern; ctx.fillRect(x0, y0, w, h);
  ctx.fillStyle = hatchPattern; ctx.fillRect(x0, y0, w, h);
  ctx.fillStyle = "#b9a47e";
  ctx.fillRect(x0, y0, w, 16);
  ctx.fillRect(x0, y0, 12, h);
  ctx.fillRect(x1 - 12, y0, 12, h);
  ctx.fillRect(x0, y1 - 12, w, 12);
  ctx.restore();
  ctx.lineWidth = 4; ctx.strokeStyle = INK;
  rrect(x0, y0, w, h, 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0, y0 + 16); ctx.lineTo(x1, y0 + 16); ctx.stroke();
}

function drawPillar(q) {
  ellipseShadow(q.x + 10, q.y + 14, q.r * 1.05, q.r * 0.6, 0.32);
  cel(q.x, q.y, q.r, "#ece0c0", "#9c8457", circleShape(q.r), 4);
  ctx.beginPath();
  ctx.arc(q.x, q.y, q.r * 0.55, 0, TAU);
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(27,21,24,0.5)"; ctx.stroke();
}

function drawPending(s) {
  const k = 1 - s.t / s.max;
  ctx.save();
  ctx.setLineDash([8, 7]);
  ctx.lineWidth = 3; ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.arc(s.x, s.y, 28, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = `rgba(255,247,214,${0.25 + k * 0.5})`;
  ctx.beginPath(); ctx.arc(s.x, s.y, 6 + k * 22, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawOrb(o) {
  const c = CARDS[o.kind].color;
  const y = o.y - 8 + Math.sin(o.t * 4) * 3;
  ellipseShadow(o.x, o.y + 12, 12, 5, 0.25);
  cel(o.x, y, 14, c, shadeOf(c), circleShape(14), 3.5);
  drawCardIcon(o.kind, o.x, y, 0.7, INK);
}

function shadeOf(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * 0.6), g = Math.round(((n >> 8) & 255) * 0.6), b = Math.round((n & 255) * 0.6);
  return `rgb(${r},${g},${b})`;
}

function drawCardIcon(kind, x, y, s, col) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 3;
  if (kind === "lance") {
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(12, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(4, -6); ctx.lineTo(4, 6); ctx.closePath(); ctx.fill();
  } else if (kind === "echo") {
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.stroke();
  } else if (kind === "ward") {
    for (let i = 0; i < 4; i++) {
      const a = (i * TAU) / 4;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 6, Math.sin(a) * 6, 5, 0, TAU); ctx.fill();
    }
  } else if (kind === "rend") {
    for (const a of [-0.5, 0, 0.5]) {
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a - Math.PI / 2) * 14, Math.sin(a - Math.PI / 2) * 14); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawPlayer(p) {
  if (p.hp <= 0) return;
  const blink = p.invuln > 0 && Math.floor(p.invuln * 14) % 2 === 0;
  ctx.save();
  if (blink) ctx.globalAlpha = 0.4;
  ellipseShadow(p.x + 4, p.y + 18, 20, 7, 0.32);
  const c = Math.cos(p.face), s = Math.sin(p.face);
  ctx.beginPath();
  ctx.moveTo(p.x - c * 6 - s * 14, p.y - s * 6 + c * 14);
  ctx.lineTo(p.x - c * 34, p.y - s * 34);
  ctx.lineTo(p.x - c * 6 + s * 14, p.y - s * 6 - c * 14);
  ctx.closePath();
  ctx.fillStyle = "#24406e"; ctx.fill();
  ctx.lineWidth = 3.5; ctx.strokeStyle = INK; ctx.lineJoin = "round"; ctx.stroke();
  cel(p.x, p.y, 18, "#3d7fd6", "#1f3f78", circleShape(18), 3.5);
  ctx.beginPath();
  ctx.ellipse(p.x + c * 6, p.y + s * 6, 7, 11, p.face, 0, TAU);
  ctx.fillStyle = "#f6efdc"; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
  ctx.fillStyle = INK;
  for (const sg of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(p.x + c * 9 - s * 4 * sg, p.y + s * 9 + c * 4 * sg, 1.8, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  if (p.atkT > 0) {
    const a = p.swingA, al = p.atkT / 0.2;
    ctx.save();
    ctx.globalAlpha = al;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 88, a - 1.05, a + 1.05);
    ctx.arc(p.x, p.y, 40, a + 1.05, a - 1.05, true);
    ctx.closePath();
    ctx.fillStyle = "#fff8e6"; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
    ctx.restore();
  }
}

function drawWisp(e) {
  const wob = 1 + 0.06 * Math.sin(e.t * 8);
  const r = e.r * wob;
  const [base, shade] = COLORS.wisp;
  const f = e.face;
  ctx.beginPath();
  ctx.moveTo(e.x - Math.cos(f) * r * 1.9 + Math.sin(f) * r * 0.6, e.y - Math.sin(f) * r * 1.9 - Math.cos(f) * r * 0.6);
  ctx.lineTo(e.x - Math.cos(f) * r * 0.2, e.y - Math.sin(f) * r * 0.2);
  ctx.lineTo(e.x - Math.cos(f) * r * 1.9 - Math.sin(f) * r * 0.6, e.y - Math.sin(f) * r * 1.9 + Math.cos(f) * r * 0.6);
  ctx.closePath();
  ctx.fillStyle = shade; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  cel(e.x, e.y, r, base, shade, circleShape(r), 3.5);
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(e.x - 6, e.y - 4, 4, 0, TAU); ctx.arc(e.x + 6, e.y - 4, 4, 0, TAU); ctx.fill();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(e.x - 6 + Math.cos(e.face) * 1.5, e.y - 4 + Math.sin(e.face) * 1.5, 2, 0, TAU);
  ctx.arc(e.x + 6 + Math.cos(e.face) * 1.5, e.y - 4 + Math.sin(e.face) * 1.5, 2, 0, TAU); ctx.fill();
  if (e.flash > 0) hitFlash(e.x, e.y, e.r, e.flash);
  if (e.stun > 0) stunStars(e.x, e.y - e.r - 8, e.t);
}

function drawShade(e) {
  const [base, shade] = COLORS.shade;
  const charging = e.cool < 0.45 && e.stun <= 0;
  const r = e.r;
  ellipseShadow(e.x, e.y + 26, 18, 6, 0.25);
  cel(e.x, e.y, r, charging ? "#c79cff" : base, shade, ghostShape(r), 3.5);
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(e.x - 8, e.y - 6, 3, 0, TAU); ctx.arc(e.x + 8, e.y - 6, 3, 0, TAU); ctx.fill();
  if (charging) {
    ctx.strokeStyle = "rgba(255,80,90,0.9)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(e.x, e.y, r + 8 + Math.sin(e.t * 30) * 2, 0, TAU); ctx.stroke();
  }
  if (e.flash > 0) hitFlash(e.x, e.y, e.r, e.flash);
  if (e.stun > 0) stunStars(e.x, e.y - e.r - 8, e.t);
}

function hitFlash(x, y, r, t) {
  ctx.save();
  ctx.globalAlpha = Math.min(1, t * 8);
  ctx.fillStyle = "#fffbe8";
  ctx.beginPath(); ctx.arc(x, y, r + 2, 0, TAU); ctx.fill();
  ctx.restore();
}

function stunStars(x, y, t) {
  ctx.save();
  ctx.fillStyle = "#ffcf4a"; ctx.strokeStyle = INK; ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    const a = t * 5 + (i * TAU) / 3;
    const sx = x + Math.cos(a) * 16, sy = y + Math.sin(a) * 5;
    ctx.beginPath(); ctx.arc(sx, sy, 5, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawBoss(b, p) {
  if (b.dead) return;
  const [base, shade] = COLORS.boss;
  ellipseShadow(b.x + 10, b.y + 54, 70, 18, 0.3);
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.spin * 0.3);
  for (let i = 0; i < 10; i++) {
    const a = (i * TAU) / 10;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - 0.22) * b.r * 0.8, Math.sin(a - 0.22) * b.r * 0.8);
    ctx.lineTo(Math.cos(a) * b.r * 1.38, Math.sin(a) * b.r * 1.38);
    ctx.lineTo(Math.cos(a + 0.22) * b.r * 0.8, Math.sin(a + 0.22) * b.r * 0.8);
    ctx.closePath();
    ctx.fillStyle = shade; ctx.fill();
    ctx.lineWidth = 3.5; ctx.strokeStyle = INK; ctx.stroke();
  }
  ctx.restore();
  cel(b.x, b.y, b.r, base, shade, circleShape(b.r), 5);

  const ang = Math.atan2(p.y - b.y, p.x - b.x);
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(ang);
  ctx.beginPath(); ctx.ellipse(18, 0, 22, 30, 0, 0, TAU);
  ctx.fillStyle = "#ffe27a"; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(22, 0, 5, 22, 0, 0, TAU);
  ctx.fillStyle = INK; ctx.fill();
  ctx.restore();
  if (b.flash > 0) hitFlash(b.x, b.y, b.r, b.flash);
}

function drawBossTelegraph(b, p) {
  if (!b || b.dead) return;
  if (b.state === "ring") {
    const k = 1 - Math.max(0, b.timer) / 0.95;
    ctx.save();
    ctx.setLineDash([14, 10]);
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(210,40,60,0.85)";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 30 + k * 260, 0, TAU); ctx.stroke();
    ctx.restore();
  } else if (b.state === "aim") {
    ctx.save();
    ctx.setLineDash([12, 8]);
    ctx.lineWidth = 6; ctx.strokeStyle = "rgba(210,40,60,0.85)";
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.aimX, b.aimY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(b.aimX, b.aimY, 22 + Math.sin(clock * 20) * 3, 0, TAU);
    ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
    ctx.restore();
  }
}

function drawShot(s, base, shade, glow) {
  ellipseShadow(s.x, s.y + 6, s.r, s.r * 0.5, 0.2);
  cel(s.x, s.y, s.r, base, shade, circleShape(s.r), 3);
  if (glow) {
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r + 4, 0, TAU);
    ctx.strokeStyle = "rgba(255,247,214,0.6)"; ctx.lineWidth = 2; ctx.stroke();
  }
}

function drawFx() {
  for (const f of run.fx) {
    const k = f.t / f.life;
    if (f.k === "ring") {
      ctx.save();
      ctx.globalAlpha = 1 - k;
      ctx.lineWidth = 8 * (1 - k) + 2;
      ctx.strokeStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r1 * (0.3 + k * 0.7), 0, TAU); ctx.stroke();
      ctx.lineWidth = 3; ctx.strokeStyle = INK;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r1 * (0.3 + k * 0.7) + 5, 0, TAU); ctx.stroke();
      ctx.restore();
    } else if (f.k === "trail") {
      ctx.save();
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = "round";
      const dx = Math.cos(f.face), dy = Math.sin(f.face);
      ctx.beginPath(); ctx.moveTo(f.x - dx * 10, f.y - dy * 10); ctx.lineTo(f.x - dx * 70, f.y - dy * 70); ctx.stroke();
      ctx.restore();
    } else if (f.k === "text") {
      ctx.save();
      ctx.globalAlpha = 1 - k * k;
      text(f.text, f.x, f.y - k * 40, { font: "30px Bangers", fill: f.color, lw: 7 });
      ctx.restore();
    }
  }
  for (const p of run.parts) {
    const k = 1 - p.t / p.life;
    ctx.save();
    ctx.globalAlpha = k;
    ctx.fillStyle = p.c;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (0.4 + k * 0.6), 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

function drawWorld(r) {
  ctx.save();
  if (opts.shake && r.shake > 0) {
    const m = r.shake * 14;
    ctx.translate(rnd(-m, m), rnd(-m, m));
  }
  drawArena();
  for (const q of PILLARS) drawPillar(q);
  for (const s of r.pending) drawPending(s);
  for (const o of r.orbs) drawOrb(o);
  drawBossTelegraph(r.boss, r.player);

  const list = [];
  for (const e of r.enemies) list.push({ y: e.y, draw: () => (e.type === "wisp" ? drawWisp(e) : drawShade(e)) });
  if (r.boss && !r.boss.dead) list.push({ y: r.boss.y, draw: () => drawBoss(r.boss, r.player) });
  list.push({ y: r.player.y, draw: () => drawPlayer(r.player) });
  list.sort((a, b) => a.y - b.y);
  for (const it of list) it.draw();

  for (const s of r.shots) drawShot(s, "#7a2f8f", "#3e1a4f", false);
  for (const s of r.pshots) drawShot(s, s.color, shadeOf(s.color), true);
  drawFx();
  ctx.restore();
}

// ============================================================
//  Rendering: HUD
// ============================================================
function drawHUD(r) {
  const p = r.player;
  const ctrl = lastDevice === "pad";

  text("ASHEN CLOISTER", 60, 46, { font: "30px Bangers", fill: "#f6efdc", align: "left", lw: 7 });
  text(`WAVE ${Math.max(1, r.wave + 1)} / ${WAVES.length}${r.phase === "boss" || r.phase === "bossintro" ? " · BOSS" : ""}`, 60, 80, { font: "22px Inter", fill: "#f6efdc", align: "left", lw: 4, stroke: INK });
  const mm = Math.floor(r.time / 60), ss = Math.floor(r.time % 60);
  text(`${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`, 1220, 46, { font: "30px Bangers", fill: "#f6efdc", align: "right", lw: 7 });

  if (r.boss && !r.boss.dead) {
    const b = r.boss;
    text("THE HOLLOW MOTHER", W / 2, 34, { font: "30px Bangers", fill: "#ff7a6b", lw: 7 });
    panel(W / 2 - 300, 46, 600, 26, "#f7efdc", 4);
    ctx.fillStyle = "#d24a5a";
    rrect(W / 2 - 292, 54, 584 * clamp(b.hp / b.max, 0, 1), 10, 5); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  }

  const hx = 60, hy = 618, hw = 300, hh = 44;
  panel(hx, hy, hw, hh, "#f7efdc", 5);
  ctx.fillStyle = "#e2534b";
  rrect(hx + 10, hy + 10, (hw - 20) * clamp(p.hp / p.maxHp, 0, 1), hh - 20, 6); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  text(`HP ${Math.ceil(p.hp)} / ${p.maxHp}`, hx + hw / 2, hy + hh / 2 + 1, { font: "24px Bangers", fill: INK, stroke: null });

  const cw = 170, ch = 80, gap = 16;
  const total = 3 * cw + 2 * gap;
  const cx0 = W / 2 - total / 2;
  const labels = ctrl ? ["TRIANGLE", "L1", "R1"] : ["I", "U", "O"];
  p.slots.forEach((s, i) => {
    const x = cx0 + i * (cw + gap), y = 606;
    const def = CARDS[s.card];
    panel(x, y, cw, ch, "#f7efdc", 5);
    ctx.fillStyle = def.color;
    rrect(x + 8, y + 8, cw - 16, ch - 16, 8); ctx.fill();
    if (s.cd > 0) {
      ctx.fillStyle = "rgba(27,21,24,0.6)";
      ctx.fillRect(x + 8, y + 8, cw - 16, (ch - 16) * (s.cd / def.cd));
    }
    ctx.lineWidth = 3; ctx.strokeStyle = INK;
    ctx.beginPath(); ctx.rect(x + 8, y + 8, cw - 16, ch - 16); ctx.stroke();
    drawCardIcon(s.card, x + 34, y + ch / 2, 1.1, INK);
    text(def.name, x + 98, y + 34, { font: "20px Bangers", fill: INK, stroke: null });
    text(labels[i], x + 98, y + 56, { font: "600 15px Inter", fill: INK, stroke: null });
  });

  if (opts.hints && r.time < 40) {
    const s = ctrl
      ? "SQUARE attack  ·  CROSS dash  ·  TRIANGLE / L1 / R1 cards  ·  OPTIONS pause"
      : "J attack  ·  K or SPACE dash  ·  I / U / O cards  ·  ESC pause";
    text(s, W / 2, 700, { font: "20px Inter", fill: "#f6efdc", lw: 5, stroke: INK });
  }
  if (r.banner) drawBanner(r.banner);
}

function drawBanner(b) {
  const k = 1 - b.t / b.max;
  const pop = Math.min(1, k * 6);
  ctx.save();
  ctx.translate(W / 2, 380);
  ctx.scale(0.8 + pop * 0.2, 0.8 + pop * 0.2);
  ctx.globalAlpha = Math.min(1, b.t * 3, 0.2 + pop);
  extruded(b.text, 0, 0, 88, "#f6efdc", 8);
  ctx.restore();
}

function drawDemoTag(r) {
  if (!r.demo) return;
  const blink = Math.floor(clock * 2) % 2 === 0;
  text("ATTRACT MODE · DEMO", W - 60, 80, { font: "22px Inter", fill: "#ff7a6b", align: "right", lw: 4 });
  if (blink) text("PRESS ANY BUTTON TO PLAY", W / 2, 700, { font: "30px Bangers", fill: "#ffcf4a", lw: 7 });
}

// ============================================================
//  Overlay panels: pause, win, lose
// ============================================================
function overlayDim() {
  ctx.fillStyle = "rgba(16,12,14,0.55)";
  ctx.fillRect(0, 0, W, H);
}

function drawPauseScene(t) {
  drawWorld(run);
  overlayDim();
  panel(340, 70, 600, 580, "#f7efdc", 10);
  text("PAUSED", W / 2, 130, { font: "84px Bangers", fill: INK, stroke: null });
  const p = run.player;
  const mm = Math.floor(run.time / 60), ss = Math.floor(run.time % 60);
  text(`HP ${Math.ceil(p.hp)}   ·   KILLS ${run.kills}   ·   TIME ${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`, W / 2, 190, { font: "26px Inter", fill: INK, stroke: null });
  drawMenu(pauseItems(), W / 2, 230, 76);
}
function pauseItems() {
  return [
    { label: "RESUME", run: () => go("play") },
    { label: "RESTART", run: startRun },
    { label: "OPTIONS", run: () => go("options", "pause") },
    { label: "ABOUT", run: () => go("about", "pause") },
    { label: "QUIT TO TITLE", run: toTitle },
  ];
}

function drawEndScene(won) {
  drawWorld(run);
  overlayDim();
  panel(320, 120, 640, 420, "#f7efdc", 10);
  text(won ? "THE DUST SETTLES" : "DUST CLAIMED", W / 2, 200, { font: "84px Bangers", fill: won ? "#2f8f5b" : "#c4283a", stroke: null });
  const mm = Math.floor(run.time / 60), ss = Math.floor(run.time % 60);
  text(`TIME ${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}   ·   KILLS ${run.kills}`, W / 2, 262, { font: "28px Inter", fill: INK, stroke: null });
  text(won ? "The Hollow Mother is quiet. The cloister breathes again." : "The dust gathers around you. Try again?", W / 2, 306, { font: "22px Inter", fill: INK, stroke: null });
  drawMenu(endItems(), W / 2, 340);
}
function endItems() {
  return [
    { label: "RETRY", run: startRun },
    { label: "TITLE", run: toTitle },
  ];
}

// ============================================================
//  Scene dispatch
// ============================================================
function step(dt, inp) {
  switch (scene) {
    case "touch":
      if ([...inp.pressed].some((a) => a !== "click")) { toTitle(); break; }
      handleMenu(touchItems(), inp);
      break;
    case "title":
      if (inp.pressed.size) idle = 0; else idle += dt;
      if (idle >= ATTRACT_DELAY) { startDemo(); break; }
      handleMenu(titleItems(), inp);
      break;
    case "options":
      if (inp.pressed.has("back")) { go(returnTo); break; }
      handleMenu(optionItems(), inp);
      break;
    case "about":
      if (inp.pressed.has("back")) { go(returnTo); break; }
      handleMenu([{ label: "BACK", run: () => go(returnTo) }], inp);
      break;
    case "play":
      if (run.demo) {
        if (inp.pressed.size) { toTitle(); break; }
        updateRun(dt, aiInput());
      } else {
        if (inp.pressed.has("pause")) { go("pause"); break; }
        updateRun(dt, inp);
      }
      if (run.phase === "won" || run.phase === "lost") {
        if (run.demo) { if (run.endT >= 3) startDemo(); }
        else if (run.endT >= 1.3) go(run.phase === "won" ? "win" : "lose");
      }
      break;
    case "pause":
      if (inp.pressed.has("pause") || inp.pressed.has("back")) { go("play"); break; }
      handleMenu(pauseItems(), inp);
      break;
    case "win":
    case "lose":
      handleMenu(endItems(), inp);
      break;
  }
}

function render(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#120e10";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.ox, dpr * view.oy);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  switch (scene) {
    case "touch": drawTouchBlock(t); break;
    case "title": drawTitle(t); break;
    case "options": drawOptions(t); break;
    case "about": drawAbout(t); break;
    case "play":
      drawWorld(run);
      drawHUD(run);
      drawDemoTag(run);
      break;
    case "pause": drawPauseScene(t); break;
    case "win": drawEndScene(true); break;
    case "lose": drawEndScene(false); break;
  }
  ctx.restore();
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  clock += dt;
  const inp = readInput();
  menuRects = [];
  step(dt, inp);
  render(clock);
  requestAnimationFrame(frame);
}

// ============================================================
//  Boot
// ============================================================
if (matchMedia("(any-pointer: coarse)").matches && !matchMedia("(any-pointer: fine)").matches) {
  scene = "touch";
}
window.addEventListener("gamepadconnected", () => { lastDevice = "pad"; audioInit(); });
requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
</script>
</body>
</html>
