	.night-shell .esh-ttl > div {
		width: min(620px, 85vw);
		max-width: 85vw;
		padding-left: 0;
	}
	.night-shell .esh-ttl h1 {
		font-size: clamp(48px, 9.5vw, 78px);
	}
	.night-shell .esh-ttl > div > p {
		max-width: 37ch;
	}
	.night-shell .esh-ttl .esh-btns {
		max-width: 390px;
	}
	.night-shell .esh-mod {
		width: min(720px, 94vw);
		padding: 24px;
	}
	.night-shell .esh-grid {
		grid-template-columns: minmax(145px, 0.9fr) 1.1fr;
		gap: 0 14px;
	}
	.night-shell .esh-grid kbd {
		font-size: 14px;
	}
	.night-shell .esh-grid span {
		font-size: 15px;
	}
	.night-shell .esh-bind {
		grid-template-columns: 1fr minmax(90px, 0.7fr) minmax(90px, 0.7fr);
		gap: 8px;
	}
	.night-shell .esh-bind button {
		font-size: 12px;
		padding: 8px;
	}
	.night-shell .esh-obj {
		max-width: 44vw;
		padding: 12px 14px;
	}
	.night-shell .esh-obj b {
		font-size: 18px;
	}
	.night-shell .esh-obj .esh-m {
		font-size: 12px;
	}
	.night-shell .esh-vit {
		min-width: 160px;
		padding: 12px;
	}
	.night-shell .esh-mini {
		width: 155px;
	}
	.night-shell .esh-keys {
		max-width: 80vw;
		overflow: hidden;
	}
	.night-radio {
		width: min(570px, 65vw);

		gap: 12px;
		padding: 14px;

	.night-radio-sigil {
		width: 45px;
		height: 58px;
		font-size: 25px;
	}
	.night-radio-text {
		font-size: 15px;
	}
	.night-shell .esh-stats {

		gap: 16px 24px;
	}
}

@media (max-height: 600px) {
	.night-shell {
		--pt: 15px;
		--pb: 15px;
	}
	.night-shell .esh-ttl > div::before {
		display: none;
	}
	.night-shell .esh-ttl h1 {
		font-size: 47px;
		max-width: 18ch;
	}
	.night-shell .esh-ttl > div > p {
		margin-top: 10px;
		font-size: 14px;
	}
	.night-shell .esh-ttl .esh-sub {
		margin-top: 10px;
		font-size: 14px;
	}
	.night-shell .esh-ttl .esh-btns {
		margin-top: 14px;
		gap: 4px;
	}
	.night-shell .esh-ttl button {
		min-height: 33px;
		padding: 5px 15px;
		font-size: 15px;

	.night-shell .esh-tags {
		margin-top: 12px;

	.night-shell .esh-ttl > div > .esh-m:last-child {

	.night-shell .esh-obj .esh-m {

	.night-shell .esh-keys {
		display: none;
	}

		bottom: var(--pb);
	}

@media (prefers-reduced-motion: reduce) {
	.night-radio,
	.night-shell button,
	.night-shell .esh-bar i {
		transition: none;

#field-overlay {
	position: fixed;
	inset: 0;
	z-index: 25;
	pointer-events: none;
	color: #eef4e6;
	font-family: "Segoe UI", Arial, sans-serif;
	font-variant-numeric: tabular-nums;
}
[hidden] {
	display: none !important;
}
.kit-readout {
	position: absolute;
	bottom: 11vh;
	right: 3.2vw;
	text-align: right;
	padding: 12px 18px;
	background: linear-gradient(90deg, transparent, #071720db);
	border-right: 3px solid #79dfdc;
	font-size: clamp(15px, 1.4vw, 23px);
	letter-spacing: 0.09em;
}
.kit-readout small {
	display: block;
	color: #a4bbc0;
	font-size: 0.7em;
	margin-top: 4px;
}
.combo-readout {
	position: absolute;
	left: 3.5vw;
	top: 37%;
	font-size: clamp(35px, 5vw, 70px);
	font-weight: 300;
	color: #b4ffff;
	text-shadow: 0 2px 8px #000;
}
.combo-readout small {
	display: block;
	font-weight: 600;
	font-size: clamp(12px, 1vw, 17px);
	color: #e6c99b;
	letter-spacing: 0.12em;
}
.boss-readout {
	position: absolute;
	left: 32%;
	right: 32%;
	top: 4vh;
	text-align: center;
	font-size: clamp(14px, 1.3vw, 21px);
	letter-spacing: 0.1em;
	text-shadow: 0 2px 5px #000;
}
.boss-readout progress {
	display: block;
	width: 100%;
	height: 7px;
	margin-top: 9px;
	accent-color: #de9b79;
}
.hack-readout {
	position: absolute;
	left: 50%;
	top: 45%;
	transform: translate(-50%, -50%);
	padding: 26px 44px;
	text-align: center;
	background: #071720ed;
	border: 1px solid #7dddda;
	box-shadow: 0 15px 70px #0009;
}
.hack-readout small {
	font-size: clamp(14px, 1.3vw, 22px);
	letter-spacing: 0.19em;
	color: #87d6d8;
}
.hack-readout b {
	display: block;
	white-space: nowrap;
	font-size: clamp(35px, 4vw, 65px);
	letter-spacing: 0.12em;
	margin-top: 16px;
}
.hack-readout b span {
	color: #6b8594;
}
.hack-readout b .done {
	color: #85e5bb;
}
.hack-readout b .current {
	color: #fff3cf;
	border-bottom: 3px solid #7ef3ee;
}
.hack-readout p {
	margin-bottom: 0;
	color: #acbdc5;
	font-size: clamp(15px, 1.4vw, 22px);
}
#mode-badge {
	position: fixed;
	top: 0;
	left: 0;
	right: 0;
	z-index: 35;
	padding: 9px;
	background: #071620e6;
	border-bottom: 1px solid #74e0d755;
	text-align: center;
	font:
		600 clamp(12px, 1.1vw, 18px) "Segoe UI",
		Arial,
		sans-serif;
	letter-spacing: 0.11em;
	color: #cde8d9;
	pointer-events: none;
}
#touch-notice {
	position: fixed;
	z-index: 110;
	bottom: 30px;
	left: 50%;
	transform: translateX(-50%);
	padding: 22px;
	width: min(430px, 80vw);
	background: #071720f5;
	border: 1px solid #7cdcd5;
	text-align: center;
	color: #f0ebdc;
	font:
		18px "Segoe UI",
		Arial,
		sans-serif;
}
#touch-notice strong {
	font-size: 22px;
}
#touch-notice p {
	color: #b6c8ca;
}
#touch-notice button {
	padding: 12px 28px;
	border: 0;
	background: #7de1d5;
	color: #081722;
	font:
		600 18px "Segoe UI",
		Arial,
		sans-serif;
}
.esh:has(.esh-sh) ~ #field-overlay {
	visibility: hidden;
}
.night-shell.night-menu-open .esh-hb,
.night-shell.night-menu-open .esh-obj,
.night-shell.night-menu-open .esh-col,
.night-shell.night-menu-open .esh-mini {
	visibility: hidden;
}
body:has(.night-menu-open) #field-overlay {
	visibility: hidden;
}
@media (max-width: 800px) {
	.kit-readout {
		bottom: 17vh;
		max-width: 38%;
		font-size: 13px;
		padding: 8px;
	}
	.boss-readout {
		left: 30%;
		right: 30%;
	}
	.hack-readout {
		padding: 22px;
	}
}
@media (prefers-reduced-motion: reduce) {
	* {
		transition: none !important;
	}
}
