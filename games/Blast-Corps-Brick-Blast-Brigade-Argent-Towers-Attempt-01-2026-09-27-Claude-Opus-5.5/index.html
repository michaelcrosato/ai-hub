<h3>BRICK BLAST BRIGADE — vertical slice “Argent Towers”</h3>
<p>An original-title homage to <b>Blast Corps</b> (Rare / Nintendo, N64, 1997), rebuilt as a one-level browser vertical slice in a low-poly, brick-built toy style. A runaway nuclear missile carrier crawls along a fixed route through Argent Towers and cannot stop or steer. You must smash every building in its way before it arrives. Then you can keep going for 100%: flatten the whole map, light the RDU beacons, rescue survivors, find the comm points and the hidden scientist.</p>

<h3>The mission, step by step</h3>
<ol>
<li><b>Clear the carrier’s path.</b> Seven buildings stand on the route. Arrows above them shift from green through yellow, orange and red to dark red as the carrier closes in. The carrier bar at the top shows each obstacle. You start in the <b>SWINGBACK</b> dump truck: hold ACTION while turning to power-slide its armoured tailgate into walls.</li>
<li><b>Go underground.</b> South of HQ, a concrete block hides a staircase. Shove it aside with the truck, then walk down to the service tunnels. There you’ll find the <b>BULLRAM</b> bulldozer and a TNT crate. Push the TNT into the sealed blast door before the fuse runs out.</li>
<li><b>Ride the subway</b> to the walled north compound. The <b>PATROL CAR</b> can race the hedge maze. A scientist waits in a cave across from a flashing beacon.</li>
<li>Take the <b>ARBALEST</b> missile bike up the ramp and shoot open the hangar shutter. Inside is the <b>SKYSTOMPER</b> jet mech, the only machine that can flatten the three reinforced Argent Towers. It can also reach the comm point on top of the rock pillar.</li>
<li>When you’re done, return to the <b>HQ truck</b> and press ENTER there to end the mission and see your results.</li>
</ol>

<section data-tab="Launch">
<h3>Launch instructions</h3>
<ol>
<li>Open the game from the ai-hub wall in a current desktop or mobile browser: Chrome, Edge, Firefox, or Safari 17+. It loads three.js, Rapier and the 3D kit from the hub, and its sounds from its own <code>audio/</code> folder.</li>
<li>Wait for the loading bar. The first load builds the brick city and compiles shaders, which takes a few seconds.</li>
<li>Press any key, click, tap or press a gamepad button. A key, click or tap also unlocks audio. Then choose <b>START MISSION</b>.</li>
</ol>
<ul>
<li><b>Rendering</b>: the game uses WebGPU when the browser exposes it and falls back to WebGL2 automatically. The same scene and materials render on both paths (three.js node materials). Append <code>?kit-backend=webgl2</code> to the URL (or pick the backend in Graphics settings) to force WebGL2 for comparison. The diagnostics overlay (F3) shows the active backend, the quality tier and preset, and the frame time.</li>
<li><b>Quality</b>: Options → Graphics settings (or F9) opens the hub’s settings panel. Auto picks Medium on phones and tablets and High on desktops, and dynamic resolution holds the frame rate.
<ul>
<li><b>High and Ultra tiers → High preset</b>: 55 m soft-shadow area, GTAO ambient occlusion, stronger bloom, SMAA, 320 physics debris bodies, 1600 crumble bricks, explosion point-light flashes.</li>
<li><b>Low and Medium tiers → Balanced preset</b>: 45 m shadow area with a smaller PCF filter, no GTAO (baked vertex contact shading only), lighter bloom, FXAA, 110 debris bodies, 800 crumble bricks, no point-light flashes.</li>
</ul>
The tier also sets the pixel-ratio cap and the shadow-map size (2048² on High).</li>
<li><b>Saving</b>: medals, best times and options are stored in <code>localStorage</code>. When storage is blocked (some private modes), the game still runs and the options screen says progress won’t persist.</li>
</ul>
</section>

<h3>Placeholder audio</h3>
<p>All audio goes through one manifest in the page (<code>&lt;script id="audio-manifest" type="application/json"&gt;</code>); the sounds themselves are files in the game’s <code>audio/</code> folder. Gameplay code only asks for ids such as <code>level</code>, <code>level_critical</code>, <code>hit_heavy</code> or <code>rdu</code>. To replace a placeholder, drop a file into <code>audio/</code>, point that entry’s <code>src</code> at it and adjust its loop points. No code changes are needed.</p>

<li><b>Music</b>: placeholders from <b>Zophar’s Domain</b>, “Blast Corps (Nintendo 64) USF” rip (<code>https://www.zophar.net/music/nintendo-64-usf/blast-corps</code>), composed by Graeme Norgate for Rare. They were transcoded to 64 kbps MP3 at 32 kHz, loudness-normalised, and cut to seamless loops.</li>
<li><b>Sound effects</b>: the requested source, <code>https://sounds.spriters-resource.com/nintendo_64/blastcorps/</code>, returned HTTP 403 to the fetch tool during this build and could not be retrieved. Every SFX is therefore an original procedurally synthesized placeholder. Each one keeps a stable manifest id so the original effects can be dropped in later.</li>

<h3>Selected level</h3>
<p><b>Argent Towers</b> is the source’s most system-dense early carrier mission. It combines a Backlash-driven carrier run with an underground TNT/bulldozer puzzle, a subway, a police-car maze with a scientist, a missile-bike door and a J-Bomb finale. That makes it the best single-level showcase of the game’s defining features.</p>

<h3>Defining systems (all playable)</h3>
<p>Unstoppable carrier and time-to-collision pressure · physics destruction of brick buildings (stud-connectivity collapse, debris, rubble) · six controllable machines with distinct destruction mechanics · on-foot crew and vehicle swapping · environmental puzzles (push block, TNT and door, subway, missile door) · collectibles (RDUs, survivors, comm points, scientist) · medals, results and time trial · surface and underground area transitions.</p>
</section>

<section data-tab="Additions & scope">
<h3 class="add">Additions (not from the source)</h3>
<ul>
<li>Modern HUD: minimap (rotates with the camera), carrier progress bar with obstacle markers and a countdown to the next obstacle, building HP bars, floating callouts, contextual tips, toasts.</li>
<li>Camera: lazy auto-follow “Chase” (default) or “Classic” fixed angle, free orbit and zoom, a blended carrier view, tighter framing on foot. These address reviewers’ complaints about the restrictive camera.</li>
<li>Controls: touch point-to-go joystick and buttons, full gamepad support, keyboard or gamepad menu navigation.</li>
<li>Accessibility and comfort: “Relaxed” carrier pace (−25%), screen-shake slider, volume, mute, fullscreen.</li>
<li>Forgiveness tweaks: side hits count heavily while sliding, missiles have a light lock-on, the SKYSTOMPER shows a landing reticle and a fuel meter, the TNT respawns until the door is open, and the Time Trial unlocks after the first carrier save instead of after gold on every level.</li>
<li>Demolition medal tiers (bronze 50% / silver 80%) below the source’s all-or-nothing gold.</li>
<li>Destruction depth: real per-brick knock-outs, stud-connectivity collapses, physics debris that settles into static rubble piles, dust, sparks, hit-stop, screen shake.</li>
<li>World dressing: named buildings, parked cars you can shove, breakable trees and street lamps, drifting clouds, the depot “safe zone”, a rock-pillar landmark, framing hills.</li>
<li>Two quality presets driven by the hub’s quality tiers, dynamic resolution and a diagnostics overlay.</li>
</ul>
<h3>Intentionally outside this slice</h3>
<ul>
<li>The other ~56 source missions, bonus and moon/planet stages, the world map, rank promotions, and cross-level scientist totals.</li>
<li>Vehicles not in Argent Towers: Skyfall, Sideswipe, Thunderfist, Cyclone Suit, Muscle Car, American Dream, A-Team van, boats. Cranes are also left out: one guide summary mentions “crane activation” here, but no detailed walkthrough places a crane in this level.</li>
<li>An ambiguous FAQ line (“destroy starting lightbulb”) was not reproduced.</li>
<li>Exact original geometry and camera. The layout is a reconstruction from the walkthrough sequence, not a copy of the source map.</li>
</ul>
</section>

<section data-tab="Known issues">
<h3>Known issues and limitations</h3>
<ul>
<li>The original build was verified headless in Chromium with SwiftShader (software) on both paths: automated playthroughs, a scripted autopilot that saved the carrier, and screenshots. The move to the hub’s 3D stack was checked on a desktop RTX 3060 Ti (WebGPU and WebGL2, about 57 fps at High in a 1280×720 window), with keyboard, a gamepad and touch, and in a phone profile. Real phones were not measured; Auto quality and dynamic resolution adapt at runtime.</li>
<li>Building collision is one box per building until it collapses. A badly smashed building still blocks vehicles (and the carrier) as a box until its HP reaches zero.</li>
<li>Rubble, trees and lamps have no collision: vehicles drive through them. Physics debris does collide while it is moving.</li>
<li>The SKYSTOMPER can stand on the flat top of a building’s collision box.</li>
<li>No mid-mission save. Only medals, bests and options persist.</li>
<li>Music loops were cut automatically. The <code>title</code> and <code>fail</code> loops use baked crossfades and may smear briefly at the loop point.</li>
<li>Placeholder SFX are synthesized, not the original game sounds, because the requested source was unreachable. Music is ripped game audio and is <b>for internal testing only</b>.</li>
<li>Older Chromium builds with an outdated WebGPU texture-view dictionary are shimmed. If a WebGPU device fails, the hub’s kit offers a restart on WebGL2.</li>
<li>Safari: WebGPU support varies by version; the WebGL2 path is used otherwise.</li>
</ul>
</section>
