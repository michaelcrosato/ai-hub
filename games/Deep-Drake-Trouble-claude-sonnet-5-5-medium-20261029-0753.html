<!--
Deep Drake Trouble

SOURCE INFORMATION
- Date: 2026-10-29 07:53
- Source game: Deep Duck Trouble Starring Donald Duck (original beyond this: unknown details of its plot; this is an original spiritual successor, hero and story are new)
- Tech: Three.js r180 (WebGPURenderer + TSL node materials, no fallback), Rapier 0.19.3 (rapier3d-compat) for physics, Gamepad API, WebAudio, AI Hub session client 1.3.0, plain ES modules bundled into one HTML file (libraries load from jsDelivr CDN)
- Art Direction: stylized cel shading: 4-step toon ramp, inverted-hull outlines, merged stone/grass terrain with shader-drawn brick mortar, parallax 3D silhouette backdrops, shadow-mapped sun plus 4 reassigned torch point lights
- Animation: procedural rigs (hierarchical meshes driven by code: walk cycle, squash and stretch, flutter wings, pound, hurt, boss telegraphs) plus state machines; no imported clips
- Audio: all code-written. Sequenced chiptune music (title, 3 levels, boss, victory), synthesized SFX, Animalese-style gibberish voices (per-letter formant blips, one voice per character) with subtitles
- Online: AI Hub parallel (side-by-side) session mode via lib/hub session.js: seeded start, progress reports, one result (score, stats, awards), time-up and end handling, probe. No other networking
- Testing: lightweight headless Chromium (SwiftShader WebGPU) via Playwright, including an emulated DualSense (start, stick, jump, bubble, Options/Circle, invert toggle): offscreen render-target screenshots, stepped simulation with the attract AI on all 3 levels, the AI Hub harness at 1 and 2 players, keyboard flow check, idle-to-attract check
- Environment: Claude Code CLI (headless); Linux (WSL2); browser unknown (tested in headless Chromium)
- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium
- Usage: unknown

TESTING FEEDBACK
- Issues caught by testing: 12 (pad presses missed between slow frames and Esc/Options blocked by the intro dialog, both found by the hub's own hub-check.mjs; plus kinematic move had no z component so the player could not walk; read-only property crash building the grotto backdrop; screenshot row-stride smear; attract AI stalled on NPC dialog; attract AI pit loops and life drain; Rapier world.free() borrow error on overlapping level loads; no progress reports in session; Esc missed at low frame rate; NPC auto-dialog blocked play in a session; sticky key edges)
- Critical / game-breaking: 4 (z component, backdrop crash, session auto-dialog, missing progress report that failed the hub check)
- Most helpful test: stepping the simulation headlessly with the attract AI across all three levels, plus the AI Hub harness
- Least helpful test: raw screenshots of the WebGPU canvas (blank/garbled until switched to render-target readback)

ENGINE FEEDBACK
- Liked most: Three.js TSL/node materials made cel shading with outlines and a shader-drawn brick pattern very small amounts of code; Rapier's character controller gave solid platformer collisions, one-way filtering and crate pushing almost for free
- Stuck / guessed wrong: Rapier's computeColliderMovement silently returns zero when the translation object lacks z; readRenderTargetPixelsAsync pads rows to 256 bytes; WebGPURenderer quietly falls back to WebGL2 unless the backend is checked
- Most important thing built myself: the tile-grid level format and merged geometry builder, the platformer feel layer (coyote time, variable jump, flutter, pound), the boss state machine and the whole menu/HUD/dialog UI
- Hardest part: verifying visuals and input headlessly, since WebGPU canvases screenshot blank and run at 2-5 fps in software
- Overhaul candidate: the silent-failure behaviour of Rapier JS bindings (NaN or missing fields instead of an error)
- One change: a built-in cel-shading/outline material and a documented offscreen screenshot helper in three/webgpu

PROMPT FEEDBACK
- Liked most: a clear single deliverable, a concrete 10-foot controller-first UX brief, and the explicit AI Hub contract with a harness to prove it
- Confusing: 'no fallback' for WebGPU versus the hub's advice to add a WebGL2 fallback; the file-name placeholder [GameTitle-SOURCE-...] and whether SOURCE means the source game's name; what 'testing parameters allowed' should contain
- Hardest: scoping a feature-complete vertical slice (3 levels, boss, UI, audio, attract mode, hub) into one session while testing lightly
- One test I would run: a real headed WebGPU run with a physical DualSense, to validate feel, axis inversion and audio mix

own</p><h3>Testing Feedback</h3><p>Issues caught by testing: 12 (pad presses missed between slow frames and Esc/Options blocked by the intro dialog, both found by the hub's own hub-check.mjs; plus kinematic move had no z component so the player could not walk; read-only property crash building the grotto backdrop; screenshot row-stride smear; attract AI stalled on NPC dialog; attract AI pit loops and life drain; Rapier world.free() borrow error on overlapping level loads; no progress reports in session; Esc missed at low frame rate; NPC auto-dialog blocked play in a session; sticky key edges)</p><p>Critical / game-breaking: 4 (z component, backdrop crash, session auto-dialog, missing progress report that failed the hub check)</p><p>Most helpful test: stepping the simulation headlessly with the attract AI across all three levels, plus the AI Hub harness</p><p>Least helpful test: raw screenshots of the WebGPU canvas (blank/garbled until switched to render-target readback)</p><h3>Engine Feedback</h3><p>Liked most: Three.js TSL/node materials made cel shading with outlines and a shader-drawn brick pattern very small amounts of code; Rapier&#x27;s character controller gave solid platformer collisions, one-way filtering and crate pushing almost for free</p><p>Stuck / guessed wrong: Rapier&#x27;s computeColliderMovement silently returns zero when the translation object lacks z; readRenderTargetPixelsAsync pads rows to 256 bytes; WebGPURenderer quietly falls back to WebGL2 unless the backend is checked</p><p>Most important thing built myself: the tile-grid level format and merged geometry builder, the platformer feel layer (coyote time, variable jump, flutter, pound), the boss state machine and the whole menu/HUD/dialog UI</p><p>Hardest part: verifying visuals and input headlessly, since WebGPU canvases screenshot blank and run at 2-5 fps in software</p><p>Overhaul candidate: the silent-failure behaviour of Rapier JS bindings (NaN or missing fields instead of an error)</p>< /* ---------- Particles (instanced) ---------- */
const Particles = (() => {
  const N = 700;
  let mesh; const P = [];
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  function init() {
    mesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.5, 0), basicMat(0xffffff), N);
    mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N * 3), 3);
    mesh.frustumCulled = false; mesh.count = N;
    for (let i = 0; i < N; i++) { P.push({ life: 0 }); dummy.scale.set(0, 0, 0); dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix); mesh.setColorAt(i, col.set(0xffffff)); }
    GFX.scene.add(mesh);
  }
  let cursor = 0;
  function emit(x, y, z, n, color, o = {}) {
    for (let i = 0; i < n; i++) {
      const p = P[cursor]; cursor = (cursor + 1) % N;
      const a = Math.random() * TAU, sp = (o.speed || 4) * (0.4 + Math.random() * 0.8);
      p.x = x + (Math.random() - 0.5) * (o.spread || 0); p.y = y + (Math.random() - 0.5) * (o.spread || 0); p.z = z + (Math.random() - 0.5) * 0.6;
      p.vx = Math.cos(a) * sp * (o.dirx != null ? 0.5 : 1) + (o.dirx || 0); p.vy = Math.sin(a) * sp * (o.flat ? 0.4 : 1) + (o.up || 0); p.vz = (Math.random() - 0.5) * 2;
      p.g = o.gravity != null ? o.gravity : 12; p.life = p.max = (o.life || 0.6) * (0.6 + Math.random() * 0.6); p.size = (o.size || 0.2) * (0.6 + Math.random() * 0.8);
      p.col = (Array.isArray(color) ? color[(Math.random() * color.length) | 0] : color);
      col.set(p.col); mesh.setColorAt((cursor + N - 1) % N, col);
    }
    mesh.instanceColor.needsUpdate = true;
  }
  function update(dt) {
    for (let i = 0; i < N; i++) {
      const p = P[i];
      if (p.life <= 0) { if (p.on) { dummy.scale.set(0, 0, 0); dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix); p.on = false; } continue; }
      p.on = true; p.life -= dt; p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      const s = p.size * Math.max(0, p.life / p.max);
      dummy.position.set(p.x, p.y, p.z); dummy.scale.set(s, s, s); dummy.rotation.set(p.life * 5, p.life * 3, 0); dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
  }
  return { init, emit, update };
})();

/* ---------- Floating text popups (DOM, projected from world space) ---------- */
const Popups = (() => {
  const list = [];
  const v = new THREE.Vector3();
  function add(text, x, y, cls = '') {
    const el = document.createElement('div'); el.className = 'pop ' + cls; el.textContent = text;
    $('#popups').appendChild(el); list.push({ el, x, y, t: 0 });
  }
  function update(dt) {
    for (let i = list.length - 1; i >= 0; i--) {
      const p = list[i]; p.t += dt;
      v.set(p.x, p.y + p.t * 1.6, 0).project(GFX.camera);
      p.el.style.transform = `translate(${((v.x * 0.5 + 0.5) * innerWidth).toFixed(1)}px, ${((-v.y * 0.5 + 0.5) * innerHeight).toFixed(1)}px) translate(-50%,-50%)`;
      p.el.style.opacity = Math.max(0, 1 - Math.max(0, p.t - 0.7) / 0.5);
      if (p.t > 1.2) { p.el.remove(); list.splice(i, 1); }
    }
  }
  const clear = () => { list.forEach((p) => p.el.remove()); list.length = 0; };
  return { add, update, clear };
})();

/* ===== Entities: pickups, interactables, platforms, enemies, boss, projectiles ===== */
const G = { lives: 3, hp: 3, maxHp: 3, coins: 0, score: 0, power: 0, combo: 0, lvl: null, god: false, shardsAll: [[false, false, false], [false, false, false], [false, false, false]], kills: 0 };
function newLevelStats() { return { coins: 0, coinsTotal: 0, shards: [false, false, false], kills: 0, time: 0, deaths: 0, hits: 0 }; }
const addScore = (n, x, y, label) => { G.score += n; if (label !== false && x != null) Popups.add(label || '+' + n, x, y + 1.3); Game.onScore(); };
const addEnt = (e) => { W.ents.push(e); return e; };
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const playerCenter = () => ({ x: W.player.x, y: W.player.y + 0.75 });

function spawnEntities(def) {
  G.lvl = newLevelStats();
  for (const e of def.ents) { const f = SPAWN[e[0]]; if (f) f(...e.slice(1)); }
  for (const e of W.ents) if (e.kind === 'coin') G.lvl.coinsTotal++;
  G.lvl.coinsTotal += 0;
}

/* ----- pickups ----- */
function makePickupMesh(kind) {
  const g = new THREE.Group();
  if (kind === 'coin') {
    const c = part(cyl(0.3, 0.3, 0.1), 0xffd23f, { rx: Math.PI / 2, mat: toon(0xffd23f, { emissive: new THREE.Color(0x6a4a00) }), outline: 0.03 });
    g.add(c);
    g.add(part(cyl(0.18, 0.18, 0.12), 0xffa818, { rx: Math.PI / 2, outline: 0, cast: false }));
  } else if (kind === 'heart') {
    const m = toon(0xff3b5c, { emissive: new THREE.Color(0x5a0818) });
    g.add(part(sph(0.2), 0xff3b5c, { x: -0.14, y: 0.08, mat: m })); g.add(part(sph(0.2), 0xff3b5c, { x: 0.14, y: 0.08, mat: m }));
    g.add(part(cone(0.3, 0.45), 0xff3b5c, { y: -0.14, rz: Math.PI, mat: m }));
  } else if (kind === 'shard') {
    const m = toon(0x7af0ff, { emissive: new THREE.Color(0x1a7a8c) });
    g.add(part(new THREE.OctahedronGeometry(0.5, 0), 0x7af0ff, { mat: m, outline: 0.05 }));
    g.add(part(new THREE.OctahedronGeometry(0.22, 0), 0xffffff, { outline: 0, cast: false, mat: basicMat(0xffffff, 0.9) }));
  } else if (kind === 'fizz') {
    g.add(part(cyl(0.22, 0.22, 0.55), 0xff7a2a, { mat: toon(0xff7a2a, { emissive: new THREE.Color(0x401800) }) }));
    g.add(part(cyl(0.24, 0.24, 0.12), 0xffffff, { y: 0.32 }));
    g.add(part(sph(0.1), 0x9be8ff, { y: 0.52, outline: 0, mat: basicMat(0x9be8ff, 0.8) }));
  }
  return g;
}
function pickup(kind, x, y, extra = {}) {
  const mesh = makePickupMesh(kind); mesh.position.set(x, y, 0); W.root.add(mesh);
  const e = addEnt({ kind, x, y, mesh, t: Math.random() * 6, r: kind === 'shard' ? 0.7 : 0.55, ...extra });
  e.update = function (dt) {
    this.t += dt;
    this.mesh.position.y = this.y + Math.sin(this.t * 3) * (kind === 'coin' ? 0.07 : 0.15);
    this.mesh.rotation.y += dt * (kind === 'coin' ? 4 : 2);
    const P = W.player; if (!P || P.dead) return;
    let d = dist(P.x, P.y + 0.75, this.x, this.y);
    if (kind === 'coin' && d < 2.2 && G.power > 0) { this.x = lerp(this.x, P.x, 0.2); this.y = lerp(this.y, P.y + 0.75, 0.2); d = dist(P.x, P.y + 0.75, this.x, this.y); }
    if (d < this.r + 0.35) collect(this);
  };
  return e;
}
function collect(e) {
  e.dead = true; W.root.remove(e.mesh);
  const P = W.player;
  if (e.kind === 'coin') {
    G.coins++; if (!e.drop) G.lvl.coins++; addScore(10, e.x, e.y, false); Aud.sfx('coin', 1 + (G.lvl.coins % 5) * 0.06);
    Particles.emit(e.x, e.y, 0.5, 5, 0xffe27a, { speed: 3, life: 0.4, size: 0.18, gravity: 2 });
    if (G.coins % 100 === 0) { G.lives++; Aud.sfx('oneup'); Popups.add('1UP!', e.x, e.y + 1.4, 'big'); Game.onScore(); }
  } else if (e.kind === 'heart') {
    if (G.hp < G.maxHp) { G.hp++; Popups.add('+1 HP', e.x, e.y + 1, 'heal'); } else addScore(50, e.x, e.y);
    Aud.sfx('heart'); Particles.emit(e.x, e.y, 0.5, 10, 0xff6a8a, { speed: 3, up: 3, life: 0.7, gravity: -2 }); Game.onScore();
  } else if (e.kind === 'shard') {
    G.lvl.shards[e.idx] = true; addScore(500, e.x, e.y, 'LAMP SHARD!'); Aud.sfx('shard');
    Particles.emit(e.x, e.y, 0.5, 30, [0x7af0ff, 0xffffff], { speed: 7, life: 0.9, size: 0.3, gravity: 3 }); Game.shake(0.15);
  } else if (e.kind === 'fizz') {
    G.power = 18; Aud.sfx('power'); Popups.add('TRIPLE BUBBLES!', e.x, e.y + 1.4, 'big');
    Particles.emit(e.x, e.y, 0.5, 20, [0xff7a2a, 0x9be8ff], { speed: 6, life: 0.7 });
  }
}

function openGate(id) {

  g.rising = true; Aud.sfx('door'); Game.shake(0.2);
}
function closeGate(id) {
  const g = W.gates[id]; if (!g || !g.open) return;
  g.open = false; g.rising = false; g.mesh.visible = true; g.mesh.position.y = g.y; g.col = addStaticBox(g.x + 0.5, g.y + g.h / 2, 0.5, g.h / 2);

  Aud.sfx('door'); Game.shake(0.3);
}
function updateGates(dt) {
  for (const id in W.gates) {
    const g = W.gates[id];
    if (g.rising) { g.mesh.position.y += dt * 6; if (g.mesh.position.y > g.y + g.h + 1) { g.mesh.visible = false; g.rising = false; } }
  }
}

/* ----- interactables (signs & NPCs) ----- */
function interactable(x, y, mesh, lines, type, range) {
  const mark = new THREE.Group(); mark.position.set(0, 2.4, 0); mark.visible = true;
  mark.add(part(sph(0.22), 0xffd23f, { mat: basicMat(0xffd23f), outline: 0.03, cast: false }));
  mark.add(part(cyl(0.05, 0.05, 0.28), 0x15101f, { y: 0.0, outline: 0, cast: false, z: 0.2 }));
  W.root.add(mark);
  const e = addEnt({ kind: type, x, y, lines, range, t: Math.random() * 6, mark, mesh, near: false, talked: false });
  e.update = function (dt) {
    this.t += dt; this.mark.position.set(this.x, this.y + (type === 'npc' ? 1.9 : 1.7) + Math.sin(this.t * 3) * 0.1, 0.6);

}

function killEnemy(e, style) {

function enemyUpdate(e, dt) {
  const D = e.D, P = W.player, rig = e.rig;

  const px = P ? P.x : 0, py = P ? P.y + 0.75 : 0;
  if (e.trapped > 0) {
    e.trapped -= dt; e.y += 1.4 * dt; e.x += Math.sin(e.t * 2) * 0.3 * dt; e.bub.scale.setScalar(1 + Math.sin(e.t * 6) * 0.04);

        break;
      }
      case 'frog': {
        e.vy -= 40 * dt; e.y += e.vy * dt;
        const gy = enemyGround(e);
        if (gy !== null && e.y <= gy + 0.01 && e.vy <= 0) { if (!e.grounded) e.vx = 0; e.y = gy; e.vy = 0; e.grounded = true; } else e.grounded = false;

        } else if (e.state === 'back') {
          e.st += dt * 0.8; const t = Math.min(1, e.st); e.x = lerp(e.sx, e.ox, t); e.y = lerp(e.sy, e.oy, t);

}

/* ----- Snapjaw, the Vizier (boss) ----- */
function spawnBoss(x, y) {

}

    if (b.intro && !Game.dialogOpen) { b.state = 'roar'; b.t = 0; Aud.sfx('roar'); Game.shake(0.5); Game.bossBar = true; Game.music('boss'); }
    return;
  }
  if (b.dead) return;
  const px = P ? P.x : b.x;
  const sx = (v) => Math.max(A.x0 + 1.5, Math.min(A.x1 - 1.5, v));
  const standing = b.state !== 'leap';
  if (b.hurtT > 0) b.hurtT -= dt;

  const faceTo = (px > b.x ? 1 : -1);
  switch (b.state) {
    case 'roar': rig.jaw.rotation.z = -0.6; b.face = faceTo; if (b.t > 1.3) { b.state = 'idle'; b.t = 0; } break;
    case 'idle': {
      b.face = faceTo; rig.jaw.rotation.z = -0.08;
      if (b.t > (bossPhase(b) === 3 ? 0.6 : 1.0)) { b.atkN++; const ph = bossPhase(b); const opts = ph === 1 ? ['charge', 'spit'] : ph === 2 ? ['charge', 'spit', 'leap'] : ['charge', 'leap', 'rain', 'spit']; b.state = opts[(b.atkN + (b.atkN >> 2)) % opts.length]; b.t = 0; b.shotN = 0; b.stage = 0; }
      break;
    }
    case 'charge': {
      if (b.t < 0.9) { b.face = faceTo; rig.root.scale.set(1.05 * (1 + Math.sin(b.t * 40) * 0.01), 1.05 * 0.92, 1.05); rig.jaw.rotation.z = -0.4; if (b.t < 0.05) Aud.sfx('warn'); b.vx = 0; }
      else { rig.root.scale.setScalar(1.05); const sp = bossPhase(b) === 3 ? 17 : 14; b.vx = b.face * sp; b.x += b.vx * dt; rig.jaw.rotation.z = -0.5 + Math.sin(b.t * 30) * 0.15; if (Math.floor(b.t * 8) !== Math.floor((b.t - dt) * 8)) { Particles.emit(b.x - b.face * 1, b.y + 0.2, 0.5, 4, 0xe8d9a0, { speed: 3, life: 0.4 }); Game.shake(0.04); }
        if (b.x <= A.x0 + 1.5 || b.x >= A.x1 - 1.5) { b.x = sx(b.x); b.state = 'dazed'; b.t = 0; b.vx = 0; Game.shake(0.6); Aud.sfx('boom'); Particles.emit(b.x + b.face * 1.5, b.y + 2, 0.5, 26, [0xe8d9a0, 0xffffff], { speed: 8, life: 0.8, size: 0.3 }); for (let i = 0; i < 3; i++) { const cx = b.x - b.face * (2 + i * 3); spawnEnemy('crab', cx, b.y + 11 + i); } } }
      break;
    }

        const val = it.get ? `<span class="v">${it.left ? '<u data-d="-1">&#9664;</u>' : ''}<span class="vt">${it.get()}</span>${it.right ? '<u data-d="1">&#9654;</u>' : ''}</span>` : '';

    if (m.onRender) m.onRender(m);
  }
  function sel() { const m = stack[stack.length - 1]; if (!m || !m.items) return; [...root.querySelectorAll('.item')].forEach((el, i) => el.classList.toggle('sel', i === m.index)); refresh(); }
  function refresh() {
    const m = stack[stack.length - 1]; if (!m || !m.items) return;
    root.querySelectorAll('.item').forEach((el, i) => { const it = m.items[i]; const vt = el.querySelector('.vt'); if (vt && it.get) vt.innerHTML = it.get(); el.classList.toggle('dis', !!(it.disabled && it.disabled())); });
  }

/* ----- Dialogue box with Animalese typewriter ----- */
const Dialog = (() => {
  const box = $('#dialog'), who = box.querySelector('.who'), txt = box.querySelector('.txt'), more = box.querySelector('.more');
  const NAMES = { drake: 'Drake', pip: 'Pip', bagley: 'Uncle Bagley', snapjaw: 'Vizier Snapjaw', sign: 'Sign' };
  let lines = [], i = 0, pos = 0, cb = null, full = '', open = false, acc = 0, hold = 0;
  const expand = (s) => s.replace(/\{(\w+)\}/g, (_, k) => Glyph(k));

  function update(dt) {

    if (this.state === 'title') { this.titleT += dt; tx = 12 + (Math.sin(this.titleT * 0.12) * 0.5 + 0.5) * 55; ty = 7.5; }

    if (boss && W.arena) { tx = (W.arena.x0 + W.arena.x1) / 2 * 0.35 + tx * 0.65; ty = Math.max(ty, W.boss.gy + 5.5); }
    const lo = vw / 2 - 1, hi = W.w - vw / 2 + 1;
    tx = hi > lo ? clamp(tx, lo, hi) : W.w / 2;
    ty = Math.max(vh / 2 - 4.5, Math.min(ty, W.h - vh / 2 + 2));
    this.camX = snap ? tx : damp(this.camX, tx, 5.5, dt); this.camY = snap ? ty : damp(this.camY, ty, 4.5, dt);
    let sx = 0, sy = 0;
    if (GFX.shake > 0.001) { if (Settings.shake) { sx = (Math.random() - 0.5) * GFX.shake * 1.4; sy = (Math.random() - 0.5) * GFX.shake * 1.4; } GFX.shake = Math.max(0, GFX.shake - dt * 1.6); }
    cam.position.set(this.camX + sx, this.camY + 1.4 + sy, this.camDist);
    cam.lookAt(this.camX + sx, this.camY + sy - 0.4, 0);
    GFX.sun.position.set(this.camX + 9, this.camY + 16, 14); GFX.sun.target.position.set(this.camX, this.camY, 0); GFX.sun.target.updateMatrixWorld();
    /* torch lights: reassign the 4 point lights to the nearest torches */
    const near = W.torches.map((t) => ({ t, d: Math.abs(t.x - this.camX) + Math.abs(t.y - this.camY) * 0.5 })).sort((a, b) => a.d - b.d);
    GFX.torches.forEach((L, i) => { const n = near[i]; if (n && n.d < 30) { L.position.set(n.t.x, n.t.y, 2.4); L.intensity = 38 + Math.sin(W.time * 11 + i * 3) * 6; L.color.set(W.def.theme.torch); } else L.intensity = 0; });
    for (const t of W.torches) { t.t += dt; t.mesh.scale.set(1 + Math.sin(t.t * 13) * 0.12, 1 + Math.sin(t.t * 9) * 0.2, 1); }
  },
};
const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

/* ---------- menus ---------- */
function pct(k) { return Math.round(Settings[k] * 100) + '%'; }
function vol(k) { return { label: k === 'music' ? 'Music volume' : k === 'sfx' ? 'Effects volume' : 'Voice volume', get: () => pct(k), left: () => { Settings[k] = clamp(Math.round((Settings[k] - 0.1) * 10) / 10, 0, 1); Aud.volumes(); saveSettings(); }, right: () => { Settings[k] = clamp(Math.round((Settings[k] + 0.1) * 10) / 10, 0, 1); Aud.volumes(); saveSettings(); }, act: () => Aud.sfx('coin') }; }
function toggle(label, k, hint) { const f = () => { Settings[k] = !Settings[k]; saveSettings(); }; return { label, hint, get: () => (Settings[k] ? 'On' : 'Off'), left: f, right: f, act: f }; }
const ARROW = (v, pos, neg, z) => (v > 0.4 ? pos : v < -0.4 ? neg : z);
function settingsMenu() {
  UI.open({
    title: 'SETTINGS', index: 0,
    items: [
      vol('music'), vol('sfx'), vol('voice'),
      toggle('Invert horizontal', 'invertX', 'gamepad'), toggle('Invert vertical', 'invertY', 'gamepad'),
      { label: 'Stick test', hint: 'push the stick', get: () => `${ARROW(Input.real.x, '&#9654;', '&#9664;', '&middot;')} ${ARROW(Input.real.y, '&#9650;', '&#9660;', '&middot;')}`, act: () => {} },
      toggle('Screen shake', 'shake'), toggle('Damage flash', 'flashes'), toggle('Subtitles', 'subtitles'), toggle('Button prompts', 'hints'),
      { label: 'Back', act: () => UI.close() },
    ],
    tick: (dt, m) => UI.refresh(),
    foot: `If the stick feels flipped, switch Invert on. ${Glyph('back')} Back`,
  });
}
function controlsMenu() {
  const rows = [['Action', 'Controller', 'Keyboard / mouse'], ['Move', 'Left stick / D-pad', 'Arrows / WASD'], ['Jump (hold higher)', '✕', 'Space / Z'], ['Flutter in air', 'Hold ✕', 'Hold Space'], ['Bubble (hold = big)', '□ / R2', 'X / click'], ['Ground pound', '○ / L2', 'C / Shift'], ['Talk / read', '△', 'E'], ['Aim bubbles up', 'Stick up + □', 'Up + X'], ['Drop through ledge', 'Down + ✕', 'Down + Space'], ['Pause / settings', 'Options', 'Esc / P']];
  UI.open({ title: 'CONTROLS', body: `<div class="grid2">${rows.map((r, i) => r.map((c) => `<span class="${i === 0 ? 'hd' : ''}">${c}</span>`).join('')).join('')}</div><div class="sub" style="margin-top:1em">Tip: stomp crabs and frogs. Spiky foes need a bubble first. Pop trapped foes by touching them.</div>`, onConfirm: () => UI.close() });
}
function aboutMenu() {
  UI.open({ title: 'ABOUT & CREDITS', scroll: true, body: ABOUT_HTML, foot: `${Input.kind === 'pad' ? 'Left stick' : 'Arrows / mouse wheel'} Scroll &nbsp; ${Glyph('back')} Back`, onConfirm: () => UI.close() });
}
function levelSelect() {
  UI.open({
    title: 'LEVEL SELECT', sub: 'Each level starts a fresh run with three lives.',
    items: [...LEVELS.map((l, i) => ({
      label: `${l.id}  ${l.name}`, hint: i <= progress.unlocked ? `best ${progress.best[i]}  ${'◆'.repeat(progress.shards[i])}${'◇'.repeat(3 - progress.shards[i])}` : 'locked',
      disabled: () => i > progress.unlocked, act: () => Game.startRun(i),
    })), { label: 'Back', act: () => UI.close() }],
  });
}
function openTitle() {
  UI.open({
    cls: 'title', logo: true, noBack: true, foot: `${Glyph('confirm')} Select`, title: '',
    items: [
      { label: 'Play', act: () => Game.startRun(0) },
      { label: 'Level select', act: levelSelect },
      { label: 'Settings', act: settingsMenu },
      { label: 'How to play', act: controlsMenu },
      { label: 'About & credits', act: aboutMenu },
    ],
  });
}
function pauseMenu() {
  if (UI.isOpen) return;
  const items = [{ label: 'Resume', act: () => UI.clear() }, { label: 'Settings', act: settingsMenu }, { label: 'Controls', act: controlsMenu }];
  if (!Game.session) { items.push({ label: 'Restart level', act: () => { UI.clear(); const sc = Game.levelStartScore; G.score = sc; G.hp = G.maxHp; Game.loadLevel(W.idx); } }); items.push({ label: 'Quit to title', act: () => Game.toTitle() }); }
  Aud.sfx('ok'); UI.open({ title: 'PAUSED', sub: LEVELS[W.idx].name, items, onBack: () => UI.clear() });
}

/* ---------- attract-mode AI (cheats freely: god mode, warps when stuck) ---------- */
let aiStuck = 0, aiLastX = 0, aiSafe = null;
function aiThink(dt) {
  const P = W.player, a = Input.ai; if (!P) return;
  Input.clearAI(); G.lives = 3;
  if (P.dead) { if (P.deadT > 0.8) { P.deadT = 9; } return; }
  if (Game.dialogOpen) return;
  if (P.grounded && !P.riding) aiSafe = { x: P.x, y: P.y };
  if (P.y < -1.5 && aiSafe) { P.x = aiSafe.x; P.y = aiSafe.y + 0.5; P.vy = 0; P.vx = 0; warpForward(P); warpForward(P); }
  G.hp = G.maxHp; P.inv = Math.max(P.inv, 0.5);
  const boss = W.boss && W.boss.intro && !W.boss.dead ? W.boss : null;
  a.x = 1;
  const ahead = (d, h) => solidAt(P.x + d, P.y + h);
  let jump = false;
  if (ahead(1.1, 0.4) || ahead(1.1, 1.3)) jump = true;
  if (P.grounded && !solidAt(P.x + 1.6, P.y - 0.5) && !solidAt(P.x + 1.6, P.y - 1.5) && !solidAt(P.x + 1.6, P.y - 2.5) && cellAt(Math.floor(P.x + 1.6), Math.floor(P.y - 0.5)) !== 2 && !waterAt(P.x + 1.6, P.y)) jump = true;
  let target = null;
  for (const e of W.ents) {
    if (e.dead) continue;
    if (e.enemy && e.trapped <= 0) { const dx = e.x - P.x; if (dx > 0 && dx < 7 && Math.abs(e.y - P.y) < 2.5) { target = e; if (!e.D.stomp || e.spiky || dx > 3) a.firePressed = a.fire = P.fireCool <= 0; if (dx < 3.2 && P.grounded && e.D.stomp && !e.spiky) jump = true; } }
    if (e.kind === 'spike' && e.x - P.x > 0 && e.x - P.x < 3 && P.grounded) jump = true;
    if (e.kind === 'mover' && !P.riding) { /* hop on platforms when gap ahead */ }
    if (e.enemy && e.trapped > 0 && Math.abs(e.x - P.x) < 4) a.x = Math.sign(e.x - P.x) || 1;
  }
  for (const [, b] of W.bricks) if (b.x - P.x > 0 && b.x - P.x < 4) { a.x = b.x - P.x > 2.5 ? 1 : 0; if (P.grounded && b.x - P.x < 4) jump = true; if (!P.grounded && P.vy < 2) a.poundPressed = true; }
  if (P.inWater) { a.jump = P.y < 8; if (waterAt(P.x, P.y + 2)) a.jump = true; }
  if (jump) { a.jump = true; a.jumpPressed = P.grounded; }
  if (!P.grounded && P.vy < 0 && (!solidAt(P.x + 2.5, P.y - 2) || G.lvl.time % 3 < 1.5)) a.jump = true;
  if (W.switches.g1 && !W.switches.g1.on) { if (P.x > 96) openGate('g1'), (W.switches.g1.on = true); }
  if (W.arena && W.gates.arena && !W.gates.arena.open) { /* in arena */ }
  if (boss) {
    const dx = boss.x - P.x;
    a.x = boss.state === 'dazed' ? Math.sign(dx) * (Math.abs(dx) > 0.6 ? 1 : 0) : (Math.abs(dx) < 8 ? -Math.sign(dx) : Math.sign(dx)) * 0.6;
    if (boss.state === 'dazed') { if (Math.abs(dx) < 3 && P.grounded) { a.jump = true; a.jumpPressed = true; } if (!P.grounded && P.y > boss.y + 2.4) a.poundPressed = Math.abs(dx) < 1.4; }
    else if (['charge', 'leap'].includes(boss.state) && Math.abs(dx) < 7 && P.grounded) { a.jump = true; a.jumpPressed = true; }
    if (shots.length) { a.firePressed = a.fire = P.fireCool <= 0; }
  }
  /* stuck handling: nudge, then warp forward */
  aiStuck = Math.abs(P.x - aiLastX) < 0.35 * dt * 60 * 0.1 ? aiStuck + dt : 0; aiLastX = P.x;
  if (aiStuck > 1.1 && P.grounded) { a.jump = true; a.jumpPressed = true; }
  if (aiStuck > 2.8 && !boss) { warpForward(P); aiStuck = 0; }
  Game.attractT += dt;
  if (Game.attractT > (boss ? 75 : 80) && !Game.levelDone) { Game.levelDone = true; Game.attractNext(); }
}
function warpForward(P) {
  for (let dx = 5; dx < 22; dx++) {
    const nx = Math.min(W.w - 3, Math.floor(P.x) + dx + 0.5);
    for (let y = W.h - 2; y > 0; y--) if (!solidAt(nx, y) && !solidAt(nx, y + 1) && solidAt(nx, y - 1) && !waterAt(nx, y)) { P.x = nx; P.y = y; P.vy = 0; P.vx = 0; Particles.emit(P.x, P.y + 1, 0.5, 14, [0xffffff, 0xffd23f], { speed: 5 }); return; }
  }
}

Input.pauseHook = () => { if (Game.state === 'play' && !UI.isOpen && !Game.stopped && W.def) { pauseMenu(); Input.clearEdges(Input.real, ['pausePressed', 'backPressed', 'confirmPressed']); return true; } return false; };

/* ---------- main loop ---------- */
let last = performance.now(), frameN = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; frameN++;
  try { Game.step(dt); } catch (e) { console.error(e); window.__ddtErr = (window.__ddtErr || []).concat(String(e && e.stack || e)).slice(-5); }
  if (!Game.crashed) GFX.renderer.render(GFX.scene, GFX.camera);
}
Game.step = function (dt) {
  Input.poll(dt);
  const I = Input.real;
  if (Game.touchOnly) { if (Input.kind === 'kb' && Input.takeActivity() || Input.hasPad) { Game.touchOnly = false; $('#touch').style.display = 'none'; } }
  if (Game.state === 'boot' || Game.stopped) { Input.clearEdges(I, ['confirmPressed', 'backPressed', 'pausePressed', 'navX', 'navY', 'jumpPressed', 'firePressed', 'poundPressed', 'interactPressed']); return; }
  const st = Game.state;
  /* idle -> attract */
  if (!Game.session && !Game.busy) {
    if (st === 'title' && !Game.touchOnly && Input.idleMs > 10000) { Game.startAttract(); }
    else if (st === 'attract' && Input.takeActivity()) { Game.stopAttract(); Input.clearEdges(I, ['confirmPressed', 'jumpPressed', 'firePressed', 'pausePressed', 'backPressed']); return; }
  }
  /* menus / dialogue */
  if (UI.isOpen) UI.update(dt);
  else if (st === 'play' && I.pausePressed) { pauseMenu(); Input.clearEdges(I, ['pausePressed', 'backPressed', 'confirmPressed']); }
  if (Dialog.open && !UI.isOpen) Dialog.update(dt);
  /* simulation */
  const sessionGo = !Game.session || (AIHub.time() >= 0 && !Game.over);
  const sim = !Game.busy && W.player && ((st === 'title') || (st === 'attract') || (st === 'play' && !UI.isOpen && sessionGo)) && !Dialog.open;
  let ticks = 0;
  if (sim) {
    if (st === 'attract') aiThink(dt);
    Game.acc += dt;
    while (Game.acc >= 1 / 60 && ticks < 5) { simTick(1 / 60); Game.acc -= 1 / 60; ticks++; }
    if (ticks === 5) Game.acc = 0;
    if (ticks > 0) Input.clearEdges(Input.ctl, ['jumpPressed', 'firePressed', 'poundPressed', 'interactPressed', 'jumpReleased', 'fireReleased']);
  } else Input.clearEdges(Input.ctl, ['jumpPressed', 'firePressed', 'poundPressed', 'interactPressed', 'jumpReleased', 'fireReleased']);
  if (st === 'play' || st === 'attract') { const P = W.player; if (P && !Game.busy) { HUD.bars(); } }
  if (W.player) { Game.updateCamera(dt, false); updateGears(dt); }
  Particles.update(dt); Popups.update(dt);
  if (Game.session) {
    if (AIHub.time() >= 0 && W.def) Game.reportProgress();
    const t = AIHub.time();
    const c = $('#count'); if (t < 0 && isFinite(t)) { c.style.display = 'block'; c.textContent = Math.ceil(-t / 1000); } else c.style.display = 'none';
  }
};
function simTick(dt) {
  const st = Game.state, P = W.player; if (!P) return;
  const ctl = Input.ctl;
  W.time += dt; if (st === 'play') G.lvl.time += dt;
  for (const m of W.movers) m.update(dt);
  if (st === 'title') { P.update(dt, { x: 0, y: 0, jump: false, fire: false, jumpPressed: false, firePressed: false, poundPressed: false, jumpReleased: false, fireReleased: false }); }
  else P.update(dt, ctl);
  for (const e of W.ents) if (e.kind !== 'mover' && !e.dead) e.update(dt);
  if (W.ents.some((e) => e.dead)) W.ents = W.ents.filter((e) => !e.dead);
  updateBubbles(dt); updateShots(dt); updateDebris(dt); updateGates(dt);
  W.world.step();
}

/* ===== Boot ===== */
function showError(msg) {
  $('#loading').classList.add('off'); $('#fade').classList.add('clear');
  $('#errmsg').textContent = msg + ' Deep Drake Trouble needs a WebGPU-capable browser (recent Chrome, Edge or Safari) and has no fallback renderer.';
  $('#err').style.display = 'flex';
  if (window.AIHub && AIHub.active) AIHub.fail('WebGPU is required: ' + msg);
}
async function boot() {
  const hub = window.AIHub;
  const sessionP = hub && hub.active ? hub.connect({ mode: 'parallel', seats: [1, 4] }) : null;
  if (matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches && !Input.hasPad && !hub?.active) {
    Game.touchOnly = true; $('#touch').style.display = 'flex'; $('#touchSettings').onclick = () => { if (!UI.isOpen) settingsMenu(); };
  }
  try { await initGfx(); } catch (e) { showError(e.message || String(e)); return; }
  await RAPIER.init(); W.RAP = RAPIER;
  if (hub) hub.probe(() => ({
    scene: Game.state === 'title' || Game.state === 'attract' ? 'title' : Game.over || Game.resultSent ? 'over' : Game.session && !(hub.time() >= 0) ? 'ready' : 'play',
    menu: UI.isOpen, world: W.time || 0, input: { x: Input.real.x, y: Input.real.y, fire: Input.real.fire },
  }));
  const info = sessionP ? await sessionP : null;
  window.__ddt = { Dialog, Game, G, W, UI, Input, simTick, LEVELS, GFX, THREE, aiThink, shot: debugShot, stop: () => GFX.renderer.setAnimationLoop(null), step: (n, dt = 1 / 60) => { for (let i = 0; i < n; i++) Game.step(dt); } };
  if (info) {
    Game.session = true; Game.resetRun(); G.god = false; Game.state = 'play'; Game.runStart = performance.now();
    $('#loading').classList.add('off'); HUD.show(true);
    await Game.loadLevel(0, { fade: false, first: true });
    hub.on('start', () => { Aud.ensure(); Game.music(LEVELS[W.idx].music); });
    hub.on('time-up', () => { if (!Game.resultSent) { Game.sendResult('time-up'); Game.over = true; } });
    hub.on('end', () => { Game.stopped = true; Aud.silence(); UI.clear(); });
    GFX.renderer.setAnimationLoop(frame);
    hub.ready();
    return;
  }
  Game.resetRun(); G.god = true; Game.state = 'title';
  await Game.loadLevel(0, { showcase: true, fade: false, first: true });
  $('#loading').classList.add('off');
  openTitle();
  GFX.renderer.setAnimationLoop(frame);
}
/** Debug aid: render one frame to an offscreen target and return it as a PNG data URL (canvas screenshots of WebGPU can come back blank). */
async function debugShot(w = 640, h = 360) {
  const r = GFX.renderer, rt = new THREE.RenderTarget(w, h, { type: THREE.UnsignedByteType });
  r.setRenderTarget(rt); r.render(GFX.scene, GFX.camera); r.setRenderTarget(null);
  const buf = await r.readRenderTargetPixelsAsync(rt, 0, 0, w, h);
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); const im = x.createImageData(w, h);
  for (let i = 0; i < w * h; i++) for (let k = 0; k < 3; k++) im.data[i * 4 + k] = Math.round(255 * Math.pow(buf[i * 4 + k] / 255, 1 / 2.2)); 
  for (let i = 0; i < w * h; i++) im.data[i * 4 + 3] = 255;
  x.putImageData(im, 0, 0); rt.dispose(); return c.toDataURL('image/png');
}
boot().catch((e) => { console.error(e); showError(String(e && e.message || e)); });
