      <section class="screen panel-screen" data-screen="about"><div class="panel-wrap"><header class="panel-header"><div><div class="eyebrow">An original flight, a familiar spirit</div><h2 class="panel-heading" id="aboutHeading">Source information</h2></div><span class="panel-number" id="aboutNumber">01/03</span></header><div class="about-tabs"><i class="about-tab active"></i><i class="about-tab"></i><i class="about-tab"></i></div><div class="about-content"><article class="about-page active" data-about-page="0"><h3>Stardust Squadron</h3><p>An original arcade flight adventure inspired by <strong>StarFox 64</strong>: expressive flying, a lively squadron, branching routes, spectacular battles, and one more run.</p><div class="about-meta"><div><b>Date / source</b><span id="aboutDate">2026-10-21 07:10 UTC</span><br>Source inspiration: StarFox 64</div><div><b>Technology</b>Three.js r180 (0.180.0), native WebGPU only.<br>Rapier 0.19.3 \xB7 Web Audio API \xB7 Gamepad API.</div><div><b>Art direction / animation</b>Procedural faceted sci-fi dioramas.<br>Spring flight, articulated meshes, particles, and scripted choreography.</div><div><b>Environment / model</b>Codex CLI \xB7 Ubuntu 26.04.1 / WSL2.<br>Browser: <span id="aboutBrowser">Chrome 154.0.8037.57, headless Vulkan SwiftShader</span>.<br>OpenAI \xB7 requested gpt-6.1-sol \xB7 ultra effort.<br>Actual runtime model: unknown.</div><div><b>Testing</b><span id="aboutTesting">Syntax suite: 5 runs; 2 isolated syntax checks. UI lint: 2 runs. Browser: 5 attempts, 4 loaded; final checks passed, 0 page errors. Six code/UI findings fixed; 1 critical headless GPU failure resolved. Rapier init warning remains. Physical PS5 / full human mission unverified. Test cost: unknown.</span></div><div><b>Usage</b><span data-gpt-hub-usage>Usage: Session time 31m 03s; tokens 4,285,116 total (4,221,155 input including 4,071,296 cached and 0 cache-write; 63,961 output including 18,300 reasoning); API cost $1.346458 USD (Estimated standard API token cost; not subscription billing).</span></div></div></article><article class="about-page" data-about-page="1"><h3>Engine feedback</h3><p><strong>Best part:</strong> Three.js makes a complete, expressive 3D world possible with direct control over geometry, lighting, cameras, and animation.</p><p><strong>Friction / wrong guesses:</strong> Rapier 0.19.3 uses rapier.mjs rather than rapier.es.js. Three.js r180 installs a WebGL fallback internally; this build explicitly disables it. Headless WebGPU needed Vulkan flags. The hardest integration was coordinating fixed-step physics, cameras, and input through every game state.</p><p><strong>Built for this flight:</strong> the encounter director, flight model, route logic, lock-on combat, squadron behaviors, camera choreography, controller menus, and synthesized audio.</p><p><strong>One overhaul:</strong> replace implicit backend fallback with an explicit capability policy. <strong>One improvement:</strong> clearer WebGPU errors and a documented fixed-step physics and presentation recipe.</p></article><article class="about-page" data-about-page="2"><h3>Prompt feedback <span style="color:var(--ui-orange)">404299fcd4</span></h3><p><strong>Best part:</strong> the controller-first requirement and ten-second attract mode make the game feel like a finished arcade experience from the first screen.</p><p><strong>Unclear:</strong> a \u201Cfeature-complete\u201D spiritual successor leaves the intended campaign length open. This build treats one authored, branching mission as the complete vertical slice.</p><p><strong>Hardest part:</strong> making the flight, combat, pacing, squadron, and visual feedback work together as one coherent experience inside a shareable HTML file.</p><p><strong>Most valuable additional test:</strong> a full mission playthrough with a physical PS5 controller, including both routes, pause/settings changes, and attract-mode exit.</p></article></div><footer class="panel-footer"><div class="button-group interactive">${small("about-prev", "\u2190 Previous")}${small("about-next", "Next \u2192")}</div><span class="about-pagination" id="aboutPagination">01 / 03</span>${small("back", "Back")}</footer></div></section>

    p.invulnerable = 5;
    p.health = Math.min(100, p.health + 40);
    p.energy = 100;
    p.bombs = Math.max(2, p.bombs);
    p.laser = Math.max(2, p.laser);
    p.body.setTranslation(p.pos, true);
    this.bossTime = 0;
    this.bossMesh.position.set(0, 14, -88);
    this.bossMesh.rotation.set(0, 0, 0);
    this.bossMesh.scale.setScalar(1);
    this.bossMesh.visible = true;
    this.bossMesh.updateMatrixWorld(true);
    this.boss = { targets: [], coreOpen: false, destroyed: false, fire: 2.5, spawn: 13, pulse: 11, pulseState: null };
    this.bossMesh.userData.weakpoints.forEach((mesh2, index) => {
      mesh2.visible = true;
      mesh2.material.color.setHex(16761217);
      mesh2.material.emissive.setHex(index === 2 ? 3234672 : 16739896);
      mesh2.material.emissiveIntensity = index === 2 ? 0.4 : 2.1;
      const pos = mesh2.getWorldPosition(V());
      const body = this.world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(pos.x, pos.y, pos.z));
      const collider = this.world.createCollider(RAPIER.ColliderDesc.ball(index < 2 ? 5.6 : 6).setSensor(true).setActiveCollisionTypes(RAPIER.ActiveCollisionTypes.ALL), body);
      const hp = index < 2 ? 55 : 125;
      const t = { kind: "boss", type: "boss", index, mesh: mesh2, pos, body, collider, hp, maxHp: hp, alive: true };
      this.boss.targets.push(t);
      this.colliderMap.set(collider.handle, t);
    });
    this.setSector();
    this.audio.setPhase("boss");
    this.saveCheckpoint();
    this.ui.toast("ALL-RANGE FLIGHT", "Left stick turns and climbs. Destroy the two glowing engine pods.");
    this.ui.radio("PIP / SYSTEMS", "Free flight is live. Red marks are hostile. Keep the carrier ahead of you and watch for the pulse wave.", "cyan", 6);
  }
  updateBoss(dt) {
    const b = this.boss;
    if (b.destroyed) return;
    b.fire -= dt;
    b.spawn -= dt;
    b.pulse -= dt;
    this.bossMesh.position.set(Math.sin(this.bossTime * 0.1) * 18, 14 + Math.sin(this.bossTime * 0.22) * 5, -88 + Math.cos(this.bossTime * 0.11) * 12);
    this.bossMesh.rotation.y = Math.sin(this.bossTime * 0.13) * 0.5;
    this.bossMesh.rotation.z = Math.sin(this.bossTime * 0.18) * 0.055;
    this.bossMesh.updateMatrixWorld(true);
    for (const t of b.targets) if (t.alive) {
      t.mesh.getWorldPosition(t.pos);
      t.body.setNextKinematicTranslation(t.pos);
      t.mesh.material.emissiveIntensity = t.index === 2 && !b.coreOpen ? 0.3 : 1.8 + Math.sin(this.time * 5) * 0.4;
    }
    if (b.fire <= 0) {
      const origin = this.bossMesh.position.clone().add(V(0, 5, 5));
      const dir = this.player.pos.clone().sub(origin).normalize();
      for (let i = -2; i <= 2; i++) {
        const vel = dir.clone().applyAxisAngle(V(0, 1, 0), i * 0.11).multiplyScalar(b.coreOpen ? 86 : 68);
        this.spawnBullet(origin.clone().add(V(i * 3, 0, 0)), vel, false);
      }
      if (b.coreOpen) {
        for (let i = 0; i < 12; i++) {
          const angle = i / 12 * Math.PI * 2 + this.bossTime * 0.1;
          this.spawnBullet(origin, V(Math.sin(angle) * 65, Math.sin(angle * 2) * 8, Math.cos(angle) * 65), false);
        }
      }
      b.fire = b.coreOpen ? 1.5 : 2.3;
    }
    if (b.spawn <= 0 && this.enemies.filter((e) => e.alive).length < 4) {
      for (let i = 0; i < (b.coreOpen ? 3 : 2); i++) this.spawnEnemy("interceptor", V((i ? 1 : -1) * 70, 20, -110), "arena", i + Math.floor(this.bossTime / 10));
      b.spawn = 18;
    }
    if (b.pulse <= 0 && !b.pulseState) {
      const material = new THREE3.MeshBasicMaterial({ color: 16754535, transparent: true, opacity: 0.85, depthWrite: false, side: THREE3.DoubleSide, blending: THREE3.AdditiveBlending });
      const mesh2 = new THREE3.Mesh(new THREE3.TorusGeometry(1, 0.028, 6, 96), material);
      mesh2.rotation.x = Math.PI / 2;
      this.scene.add(mesh2);
      b.pulseState = { mesh: mesh2, time: -2.3, radius: 2, center: this.bossMesh.position.clone() };
      this.ui.toast("PULSE WAVE CHARGING", "Climb above the orange ring, or barrel roll through it.");
      this.audio.sfx("alert");
    }
    if (b.pulseState) {
      const pulse = b.pulseState;
      pulse.time += dt;
      pulse.radius = pulse.time > 0 ? 8 + pulse.time * 55 : 8 + Math.sin(pulse.time * 10) * 0.8;
      pulse.mesh.position.copy(pulse.center);
      pulse.mesh.scale.setScalar(pulse.radius);
      pulse.mesh.material.opacity = pulse.time < 0 ? 0.4 + Math.sin(pulse.time * 12) * 0.2 : 0.85;
      if (pulse.time > 0) {
        const offset = this.player.pos.clone().sub(pulse.center);
        if (Math.abs(Math.hypot(offset.x, offset.z) - pulse.radius) < 4 && Math.abs(offset.y) < 6) this.damagePlayer(18);
      }
      if (pulse.time > 3.5) {
        this.scene.remove(pulse.mesh);
        pulse.mesh.geometry.dispose();
        pulse.mesh.material.dispose();
        b.pulseState = null;
        b.pulse = b.coreOpen ? 8 : 12;
      }
    }
    if (this.attract && this.bossTime > 48) {
      const live = b.targets.find((t) => t.alive && (t.index < 2 || b.coreOpen));
      if (live) this.damageTarget(live, dt * 25);
    }
  }
  destroyBossPart(t) {
    t.alive = false;
    t.hp = 0;
    this.colliderMap.delete(t.collider.handle);
    this.world.removeRigidBody(t.body);
    this.fx.burst(t.pos, 16761725, 140, 28);
    this.makeDebris(t.pos);
    this.audio.sfx("bomb");
    t.mesh.material.emissive.setHex(925738);
    t.mesh.material.color.setHex(1516331);
    t.mesh.material.emissiveIntensity = 0.2;
    this.cameraShake = settings.shake ? 1.8 : 0;
    this.input.rumble(0.8, 240);
    this.addScore(t.index === 2 ? 5e3 : 1500);
    if (t.index < 2) {
      const remaining = this.boss.targets.slice(0, 2).filter((e) => e.alive).length;
      if (remaining === 0) {
        this.boss.coreOpen = true;
        this.player.health = Math.min(100, this.player.health + 20);
        this.boss.targets[2].mesh.material.emissive.setHex(16732709);
        this.ui.radio("LYRA / FLIGHT LEAD", "Both pods are down! The core is exposed. Finish this, Kestrel!", "orange", 5);
        this.ui.toast("CORE EXPOSED", "Carrier weapons overloading \xB7 Strike the central core");
      } else this.ui.toast("ENGINE POD DESTROYED", "One pod remaining");
    } else {
      this.boss.destroyed = true;
      this.victoryCountdown = 5;
      this.target = null;
      this.audio.setPhase("victory");
      this.audio.sfx("win");
      this.ui.toast("MERIDIAN SILENCED", "Mission accomplished");
      this.ui.radio("LYRA / FLIGHT LEAD", "Look at that sky. The whole squadron owes you one, captain. Let us go home.", "cyan", 6);
      if (this.boss.pulseState) {
        this.scene.remove(this.boss.pulseState.mesh);
        this.boss.pulseState.mesh.geometry.dispose();
        this.boss.pulseState.mesh.material.dispose();
        this.boss.pulseState = null;
      }
      for (const bullet of this.bullets) this.scene.remove(bullet.mesh);
      this.bullets.length = 0;
    }
  }
  autopilot() {
    const input = { down: {}, pressed: {}, released: {}, x: 0, y: 0, aimX: 0, aimY: 0 };
    const cycle = this.actualTime % 2.8;
    input.down.fire = cycle < 2.6;
    input.released.fire = cycle >= 2.6 && cycle < 2.6 + 1 / 60;
    const available = this.enemies.filter((e) => e.alive && e.pos.z < -12);
    let target = available.find((e) => e.rescue !== void 0) || available.sort((a, b) => a.pos.z - b.pos.z).at(-1);
    if (this.allRange && this.boss) {
      target = this.boss.targets.find((t) => t.alive && (t.index < 2 || this.boss.coreOpen));
      if (target) {
        const delta = target.pos.clone().sub(this.player.pos), direction = delta.clone().normalize();
        const heading = Math.atan2(-direction.x, -direction.z);
        const difference = Math.atan2(Math.sin(heading - this.player.heading), Math.cos(heading - this.player.heading));
        input.x = clamp2(-difference * 2.3, -1, 1);
        input.y = clamp2((target.pos.y - this.player.pos.y) * 0.1, -1, 1);
        input.down.brake = Math.abs(difference) > 0.7 || delta.length() < 50;
      }
    } else {
      const nextRing = this.pickups.filter((e) => !e.collected && e.pos.z < 0 && e.pos.z > -90).sort((a, b) => b.pos.z - a.pos.z)[0];
      const desiredX = this.flightTime > 74 && this.flightTime < 82 ? this.attractLoop % 2 ? -14 : 14 : nextRing ? nextRing.pos.x : target ? target.pos.x : Math.sin(this.actualTime * 0.3) * 9;
      const desiredY = nextRing ? nextRing.pos.y : target ? target.pos.y : Math.cos(this.actualTime * 0.4) * 5;
      input.x = clamp2((desiredX - this.player.pos.x) * 0.12, -0.75, 0.75);
      input.y = clamp2((desiredY - this.player.pos.y) * 0.14, -0.7, 0.7);
      input.down.boost = this.actualTime % 24 > 19 && this.flightTime < 170;
    }
    if (target) {
      const offset = target.pos.clone().sub(this.player.pos);
      input.aimX = clamp2(offset.dot(this.right()) / 30, -1, 1);
      input.aimY = clamp2(offset.y / 22, -1, 1);
    }
    if (this.actualTime % 11 < 1 / 60) input.pressed.rollRight = true;
    if (this.actualTime % 32 < 1 / 60 && this.enemies.length > 4) input.pressed.bomb = true;
    if (this.actualTime % 22 < 1 / 60) input.pressed.wing = true;
    return input;
  }
  renderFlight(dt) {
    if (!this.player) return;
    const p = this.player, f = this.forward(), right = this.right();
    this.environment.update(this.distance, this.time, this.sector.phase);
    this.ship.position.copy(p.pos);
    let bank = this.allRange ? Math.atan2(-Math.sin(p.heading - (this.lastHeading ?? p.heading)), Math.cos(p.heading - (this.lastHeading ?? p.heading))) * 24 : -p.vel.x * 0.016;
    bank = clamp2(bank, -0.75, 0.75);
    this.lastHeading = p.heading;
    const rollAngle = p.roll > 0 ? (1 - p.roll / 0.72) * Math.PI * 2 * p.rollDir : 0;
    this.ship.rotation.set(damp(this.ship.rotation.x, p.vel.y * 8e-3, 8, dt), p.heading, bank + rollAngle);
    this.ship.visible = p.health > 0;
    if (this.defeatCountdown > 0) this.ship.visible = false;
    const desiredCamera = this.allRange ? p.pos.clone().addScaledVector(f, -29).add(V(0, 10, 0)) : V(p.pos.x * 0.2, 9 + p.pos.y * 0.15, 33);
    this.camera.position.lerp(desiredCamera, 1 - Math.exp(-dt * (this.allRange ? 4.6 : 5)));
    this.lookTarget.copy(p.pos).addScaledVector(f, this.allRange ? 65 : 100);
    this.lookTarget.y += 1.5;
    this.camera.lookAt(this.lookTarget);
    if (settings.shake && this.cameraShake > 0) {
      this.camera.position.add(V((Math.random() - 0.5) * this.cameraShake * 0.35, (Math.random() - 0.5) * this.cameraShake * 0.3, 0));
    }
    const desiredFov = this.speed > 45 ? 72 : this.speed < 25 ? 59 : 63;
    this.camera.fov = damp(this.camera.fov, desiredFov, 4, dt);
    this.camera.updateProjectionMatrix();
    this.animateEngines(this.ship, this.time, this.speed / 36);
    this.shield.position.copy(p.pos);
    this.shield.material.opacity = p.roll > 0 ? 0.15 : p.invulnerable > 0 && p.invulnerable < 1 ? 0.13 + Math.sin(this.time * 30) * 0.06 : 0;
    this.shield.rotation.z += dt * 2;
    const aim = this.aimPoint.clone().project(this.camera);
    const bossHealth = this.boss ? this.boss.targets.reduce((total, t) => total + Math.max(0, t.hp), 0) / 235 : void 0;
    const wingReady = p.wingCooldown > 0 ? ` \xB7 STRIKE ${Math.ceil(p.wingCooldown)}s` : " \xB7 STRIKE READY";
    this.ui.update({
      health: p.health,
      maxHealth: 100,
      energy: p.energy / 100,
      score: this.score,
      combo: this.combo,
      bombs: p.bombs,
      sector: this.sector.name,
      objective: this.uiNotice || (this.allRange ? this.boss.coreOpen ? "Destroy the exposed central core" : "Destroy both glowing engine pods" : this.route !== "UNDECIDED" ? this.route + " / " + this.sector.objective : this.sector.objective),
      progress: this.allRange ? 0.82 + (1 - bossHealth) * 0.18 : this.flightTime / MISSION.railEnd * 0.82,
      speed: this.speed * 10,
      lock: this.lock,
      laserLevel: p.laser,
      attract: this.attract,
      bossHealth,
      bossName: this.boss?.coreOpen ? "HOLLOW CROWN / CORE EXPOSED" : "HOLLOW CROWN / ENGINE PODS",
      wingmates: this.wingmates.map((a) => ({ name: a.name + (a.danger > 0 ? " \xB7 HELP!" : ""), health: a.health / 100 })),
      aim: { x: clamp2(aim.x, -0.92, 0.92), y: clamp2(aim.y, -0.85, 0.85) }
    });
    const strike = document.getElementById("wingStrikeStatus");
    if (strike) strike.textContent = (this.input.kind === "gamepad" ? "\u25B3" : "[R]") + wingReady;
    const bearing = document.getElementById("carrierBearing");
    if (bearing && this.allRange && this.boss && !this.boss.destroyed) {
      const delta = this.bossMesh.position.clone().sub(p.pos);
      const angle = Math.atan2(delta.dot(right), delta.dot(f));
      const offAxis = Math.abs(angle) > 0.65;
      bearing.style.display = offAxis ? "block" : "none";
      bearing.textContent = (angle < 0 ? "\u25C0  " : "") + "CARRIER \xB7 " + Math.round(delta.length()) + " SU" + (angle > 0 ? "  \u25B6" : "");
    } else if (bearing) bearing.style.display = "none";
    if (this.bracket) {
      if (this.target?.alive) {
        const point = this.target.pos.clone().project(this.camera);
        const visible = point.z < 1 && Math.abs(point.x) < 1 && Math.abs(point.y) < 1;
        this.bracket.style.display = visible ? "block" : "none";
        this.bracket.style.left = `${(point.x + 1) * 50}%`;
        this.bracket.style.top = `${(1 - point.y) * 50}%`;
        this.bracket.style.borderColor = this.lock >= 0.98 ? "#ffd18b" : this.target.rescue !== void 0 ? "#ffae77" : "#83f1eb";
        this.bracket.style.transform = `translate(-50%,-50%) rotate(${this.lock >= 0.98 ? 45 : 0}deg)`;
      } else this.bracket.style.display = "none";
    }
    const vignette = document.getElementById("damageVignette");
    if (vignette && this.hitFlash > 0) vignette.style.opacity = String(this.hitFlash);
    this.drawRadar();
  }
  animateEngines(ship, time, power) {
    const engines = ship.userData.engines || [];
    for (let i = 0; i < engines.length; i++) {
      const e = engines[i];
      if (!e.userData.originalScale) e.userData.originalScale = e.scale.clone();
      const scale = e.userData.originalScale;
      e.scale.copy(scale);
      const pulse = 0.88 + Math.sin(time * 38 + i * 3) * 0.1 + power * 0.18;
      if (e.geometry?.type === "ConeGeometry") e.scale.y = scale.y * pulse * (0.65 + power * 0.5);
      else e.scale.multiplyScalar(pulse);
    }
  }
  drawRadar() {
    const canvas = this.radar;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const center = w / 2, radius = w * 0.43;
    ctx.strokeStyle = "#78b8c344";
    ctx.lineWidth = 1;
    for (const r of [radius * 0.5, radius]) {
      ctx.beginPath();
      ctx.arc(center, center, r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(center, 10);
    ctx.lineTo(center, h - 10);
    ctx.moveTo(10, center);
    ctx.lineTo(w - 10, center);
    ctx.stroke();
    ctx.fillStyle = "#c5fff2";
    ctx.beginPath();
    ctx.moveTo(center, center - 6);
    ctx.lineTo(center - 4, center + 4);
    ctx.lineTo(center + 4, center + 4);
    ctx.closePath();
    ctx.fill();
    const forward = this.forward(), right = this.right();
    const plot = (pos, color, size = 2.5) => {
      const delta = pos.clone().sub(this.player.pos);
      let x = delta.dot(right) * 0.38, y = -delta.dot(forward) * 0.38;
      const dist = Math.hypot(x, y);
      if (dist > radius - 3) {
        x *= (radius - 3) / dist;
        y *= (radius - 3) / dist;
      }
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(center + x, center + y, size, 0, Math.PI * 2);
      ctx.fill();
    };
    for (const e of this.enemies) if (e.alive) plot(e.pos, e.rescue !== void 0 ? "#ffdb84" : "#ff8b81");
    for (const e of this.pickups) if (!e.collected) plot(e.pos, "#a7e8b8", 1.5);
    if (this.boss && !this.boss.destroyed) plot(this.bossMesh.position, "#ffbb72", 5);
    this.wingShips.forEach((s, i) => {
      if (this.wingmates[i].health > 0) plot(s.position, "#81dfe0", 2);
    });
  }
  finish(success) {
    if (this.attract) {
      this.attractLoop = (this.attractLoop || 0) + 1;
      this.start(true);
      return;
    }
    this.mode = "results";
    this.audio.setPhase(success ? "victory" : "menu");
    if (success) {
      this.addScore(Math.round(this.player.health * 25) + this.wingmates.filter((a) => a.health > 0).length * 1e3);
      saved.best = Math.max(saved.best || 0, this.score);
      saved.completions = (saved.completions || 0) + 1;
      persist();
    }
    const rank = !success ? "D" : this.score >= 26e3 && this.rescues === 2 ? "S" : this.score >= 19e3 ? "A" : this.score >= 12e3 ? "B" : "C";
    this.show("results", {
      success,
      checkpoint: this.checkpoint > 0,
      score: this.score,
      kills: this.kills,
      accuracy: this.shots ? Math.min(1, this.hits / this.shots) : 0,
      rank,
      route: this.route === "UNDECIDED" ? "AMBER REACH" : this.route,
      time: this.actualTime,
      rescues: this.rescues,
      medal: !success ? "The next flight is yours" : rank === "S" ? "Meridian legend" : rank === "A" ? "Meridian ace" : "Squadron guardian",
      best: saved.best || this.score
    });
    this.input.consume();
  }
  saveCheckpoint() {
    this.checkpointSnapshot = { at: this.checkpoint, laser: this.player.laser, bombs: this.player.bombs };
    for (const key2 of ["score", "kills", "shots", "hits", "rescues", "actualTime", "route"]) this.checkpointSnapshot[key2] = this[key2];
  }
  errorMenu() {
    if (this.errorLoopRunning) return;
    this.errorLoopRunning = true;
    const loop = () => {
      const input = this.input.sample(settings);
      this.ui.setInputKind(this.input.kind);
      this.menuInput(input, 1 / 60);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
};
var game = new SquadronGame();
game.init().catch((error) => {
  console.error(error);
  document.getElementById("boot")?.remove();
  game.mode = "error";
  game.show("error", { message: error.message || "Flight systems could not initialize." });
  game.errorMenu();
});
