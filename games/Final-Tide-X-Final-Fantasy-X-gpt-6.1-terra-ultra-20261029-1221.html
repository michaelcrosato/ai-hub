async function init(){try{await RAPIER.init();world=new RAPIER.World({x:0,y:-9.81,z:0});scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc9d1);scene.fog=new THREE.Fog(0x9cced1,35,100);camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,200);if(!navigator.gpu)throw new Error("WebGPU is not available");renderer=new THREE.WebGPURenderer({antialias:true});await renderer.init();if(!renderer.backend.isWebGPUBackend){renderer.dispose();throw new Error("WebGPU initialization failed")}renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));$('stage').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe5fff4,0x286176,2.4));let sun=new THREE.DirectionalLight(0xffe3ae,2);sun.position.set(-10,25,5);scene.add(sun);
water=mesh(new THREE.PlaneGeometry(200,200),0x45a8b5,0,-.55,-20);water.rotation.x=-Math.PI/2;mesh(new THREE.BoxGeometry(13,1,75),0xd7c9a2,0,-.6,-30);for(let i=0;i<34;i++){let z=-i*2-1;mesh(new THREE.BoxGeometry(12,.14,.12),0xb6ab8d,0,-.05,z);for(let s of [-1,1]){mesh(new THREE.CylinderGeometry(.2,.25,2.1,6),0xd8d2b5,s*6,1,z);if(i%4===0){let crystal=mesh(new THREE.OctahedronGeometry(.48),0x7be6d8,s*6,2.4,z);stars.push(crystal)}}}for(let z of [-20,-42,-63]){for(let s of [-1,1])mesh(new THREE.BoxGeometry(1,5,1),0xd9d1ac,s*5,2.5,z);mesh(new THREE.BoxGeometry(11,1,1),0xd9d1ac,0,5,z)}for(let i=0;i<16;i++){let s=i%2?1:-1,x=s*(12+(i%4)*6),z=-i*6;mesh(new THREE.ConeGeometry(4,4,5),0x5e9c94,x,1,z);mesh(new THREE.CylinderGeometry(.3,.5,5,7),0x8b8b71,x,1,z)}let stone=mesh(new THREE.OctahedronGeometry(.8),0x9bfff0,0,1.6,-6);stars.push(stone);player=person(0xe8c45b,0,0);characters=[person(0xd4e7df,-1.5,2),person(0x9b6675,1.5,3)];enemyMesh=person(0x715a9d,0,-8);enemyMesh.scale.setScalar(1.7);enemyMesh.visible=false;let rb=world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(0,1,0));world.createCollider(RAPIER.ColliderDesc.capsule(.6,.3),rb);playerBody=rb;menu();updateHud();if(isTouch)show('touch');requestAnimationFrame(loop)}catch(err){console.error(err);modal(`<h2>WebGPU unavailable</h2><p>This game requires a browser and device with WebGPU enabled. There is no fallback renderer.</p><p class="small">${String(err.message||err)}</p><button class="action" id="openSettings">Settings</button><button class="action" id="openAbout">About & credits</button>`);$('openSettings').onclick=settingsMenu;$('openAbout').onclick=about}}
let autoTick=0;function loop(now){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);pad();if(state.mode==='title'&&!isTouch&&now-state.lastInput>10000){fresh();start();state.attract=true;toast('Attract mode · Press any button to play')}if(state.attract&&!state.paused&&now-autoTick>1100){autoTick=now;if(state.mode==='dialogue')advance();else if(state.mode==='battle')battleAction();else if(state.mode==='explore'&&state.chapter===0){player.position.z=-6;interact()}}
if(state.mode==='explore'&&!state.paused){let g=navigator.getGamepads?.()[0],x=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),z=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);if(g){x+=g.axes[0]||0;z+=g.axes[1]||0}if(state.attract)z=-1;x*=settings.invertX?-1:1;z*=settings.invertY?-1:1;if(Math.abs(x)<.15)x=0;if(Math.abs(z)<.15)z=0;player.position.x=THREE.MathUtils.clamp(player.position.x+x*dt*5,-5,5);player.position.z=THREE.MathUtils.clamp(player.position.z+z*dt*5,-68,4);if(x||z){player.rotation.y=Math.atan2(x,z);state.step+=dt;player.position.y=Math.abs(Math.sin(state.step*9))*.07}playerBody.setNextKinematicTranslation({x:player.position.x,y:1,z:player.position.z});world.step();characters.forEach((c,i)=>{c.position.x=THREE.MathUtils.lerp(c.position.x,player.position.x+(i?1.3:-1.3),dt*2);c.position.z=THREE.MathUtils.lerp(c.position.z,player.position.z+2+i,dt*2);c.rotation.y=player.rotation.y});if(state.chapter>0&&!state.won&&player.position.z<[-100,-19,-40,-61][state.chapter])battle(state.chapter)}
let targetZ=state.mode==='title'? -14:player.position.z;camera.position.lerp(new THREE.Vector3(state.mode==='title'?13:10,12,targetZ+18),dt*1.4);camera.lookAt(0,1,targetZ-3);stars.forEach((s,i)=>{s.rotation.y+=dt*.7;s.position.y+=Math.sin(now*.002+i)*dt*.08});renderer.render(scene,camera)}
addEventListener('resize',()=>{if(renderer){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}});init();
