  var ended = false;
  var connecting = null;

  var reported = false;

  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;

  }

  hub.connect = function (opts) {

    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });

  };

function toggleSettings(){if(settingsOpen)closeSettings();else openSettings();}
function processPads(){
  const list=gamepads();for(const p of list){const prev=padsPrev[p.index]||[];const pressed=p.buttons.map((b,i)=>!!b.pressed&&!prev[i]);const a=axes(p),dirX=(a.x>.6?1:a.x<-.6?-1:0),dirY=(a.y>.6?1:a.y<-.6?-1:0);const any=pressed.some(Boolean)||((dirX||dirY)&&!padAxisLatch);
    if(any){physicalInput();if(exitAttract()){padsPrev[p.index]=p.buttons.map(b=>b.pressed);return;}if(handleReadyGesture()){padsPrev[p.index]=p.buttons.map(b=>b.pressed);return;}}
    if(pressed[9]&&!button(p,8)){toggleSettings();padsPrev[p.index]=p.buttons.map(b=>b.pressed);return;}
    if(settingsOpen||!['play','attract','ready'].includes(currentScreen)){
      if(pressed[1])back();else if(pressed[0])confirmMenu();else if(pressed[12])navigate(-1);else if(pressed[13])navigate(1);else if(pressed[14])moveHorizontal(-1);else if(pressed[15])moveHorizontal(1);
      else if(!padAxisLatch&&(dirX||dirY)){if(dirY)navigate(dirY);else moveHorizontal(dirX);}
    }
    padAxisLatch=!!(dirX||dirY);padsPrev[p.index]=p.buttons.map(b=>!!b.pressed);
  }
  if(!list.length)padAxisLatch=false;
}
document.addEventListener('keydown',e=>{
  physicalInput();if(exitAttract()){e.preventDefault();return;}if(handleReadyGesture())return;
  if(e.target instanceof HTMLInputElement){if(e.key==='Escape'){e.target.blur();toggleSettings();e.preventDefault();}else if(e.key==='Enter'){e.target.blur();joinRoom();e.preventDefault();}return;}
  keys.add(e.code);if(!e.repeat&&['KeyW','ArrowUp','KeyJ','KeyK','KeyL','KeyI','KeyU','KeyO','Numpad0','Numpad4','Numpad5','Numpad6','Numpad7','Numpad9'].includes(e.code))keyPulses.add(e.code);if(e.repeat)return;
  if(e.code==='Escape'){toggleSettings();e.preventDefault();return;}
  if(settingsOpen||!['play','attract','ready'].includes(currentScreen)){
    if(e.code==='ArrowUp'||e.code==='KeyW'){navigate(-1);e.preventDefault();}
    else if(e.code==='ArrowDown'||e.code==='KeyS'){navigate(1);e.preventDefault();}
    else if(e.code==='ArrowLeft'||e.code==='KeyA'){moveHorizontal(-1);e.preventDefault();}
    else if(e.code==='ArrowRight'||e.code==='KeyD'){moveHorizontal(1);e.preventDefault();}
    else if(e.code==='Enter'||e.code==='Space'){confirmMenu();e.preventDefault();}
    else if(e.code==='Backspace'){back();e.preventDefault();}
  }else if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
});
document.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>{keys.clear();mouseLight=false;mouseHeavy=false;});
document.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch')physicalInput();else {idleAt=performance.now();unlockAudio();}
  if(exitAttract()){e.preventDefault();return;}handleReadyGesture();
  if(currentScreen==='play'&&!settingsOpen&&e.target.id!=='quickSettings'&&e.pointerType==='mouse'){if(e.button===0)mouseLight=true;if(e.button===2)mouseHeavy=true;}
});
document.addEventListener('pointerup',e=>{if(e.button===0)mouseLight=false;if(e.button===2)mouseHeavy=false;});
document.addEventListener('contextmenu',e=>e.preventDefault());
screenEl.addEventListener('click',e=>{const card=e.target.closest('[data-card]');if(card){selection=Number(card.dataset.card);pickCharacter(selection);return;}const item=e.target.closest('[data-menu]');if(item){menuIndex=Number(item.dataset.menu);confirmMenu();return;}const direct=e.target.closest('[data-action]');if(direct)act(direct.dataset.action);});
screenEl.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const item=e.target.closest('[data-menu]');if(item&&Number(item.dataset.menu)!==menuIndex){menuIndex=Number(item.dataset.menu);for(const b of screenEl.querySelectorAll('[data-menu]'))b.classList.toggle('selected',Number(b.dataset.menu)===menuIndex);}const card=e.target.closest('[data-card]');if(card&&Number(card.dataset.card)!==selection){selection=Number(card.dataset.card);for(const b of screenEl.querySelectorAll('[data-card]'))b.classList.toggle('selected',Number(b.dataset.card)===selection);}});
overlayEl.addEventListener('click',e=>{const item=e.target.closest('[data-setting]');if(item){menuIndex=Number(item.dataset.setting);changeSetting(menuIndex);}});
$('quickSettings').addEventListener('click',e=>{e.stopPropagation();toggleSettings();});
$('touchSettings').addEventListener('click',()=>{openSettings();$('touchNotice').classList.remove('visible');});
function fatal(message){$('loading').classList.add('hide');$('fatalText').textContent=message;fatalPending=true;if(hasPhysicalInput||!$('touchNotice').classList.contains('visible'))$('fatal').classList.add('visible');if(AIHub.active)AIHub.fail(message);}
function frame(ms){
  if(gpuLost)return;
  const elapsed=clamp((ms-lastTime)/1000,0,.12);lastTime=ms;processPads();musicTick(elapsed);
  if(!hub&&['title','versus','select','howto','about','online'].includes(currentScreen)&&ms-idleAt>10000){if(settingsOpen)closeSettings();beginAttract();}
  accumulator+=elapsed;let steps=0;while(accumulator>=FIXED&&steps++<6){fixedUpdate(FIXED);keyPulses.clear();accumulator-=FIXED;}if(steps>=6)accumulator=0;
  networkTick();stageUpdate(ms/1000);updateParticles(elapsed);drawFighters(ms/1000);updateHud();
  if(cameraShake>0&&settings.shake){cameraShake=Math.max(0,cameraShake-elapsed);camera.position.x=(Math.random()-.5)*cameraShake*.8;camera.position.y=4.5+(Math.random()-.5)*cameraShake*.6;}else{camera.position.x=0;camera.position.y=4.5;}
  camera.lookAt(0,2,0);renderer.render(scene,camera);requestAnimationFrame(frame);
}
AIHub.probe(()=>({scene:currentScreen==='attract'?'play':currentScreen==='select'||currentScreen==='versus'||currentScreen==='online'||currentScreen==='host'||currentScreen==='join'||currentScreen==='lobby'||currentScreen==='howto'||currentScreen==='about'?'menu':currentScreen,menu:settingsOpen,world:Math.round(worldSeconds*1000)/1000,input:inputProbe,phase:match?.phase||'',fighters:match?match.fighters.map(f=>({id:f.id,team:f.team,hp:f.hp,meter:f.meter,damage:f.damage,state:f.state,x:Math.round(f.body.translation().x*100)/100})):[]}));
async function boot(){
  if(matchMedia('(pointer: coarse)').matches&&!matchMedia('(pointer: fine)').matches&&!hasPhysicalInput)$('touchNotice').classList.add('visible');
  try{
    if(!navigator.gpu){fatal('This game requires WebGPU. Open it in a current WebGPU-capable browser on a supported graphics device.');return;}
    const adapter=await navigator.gpu.requestAdapter();if(!adapter){fatal('No WebGPU adapter was found. Enable WebGPU and try again.');return;}
    const [three,rapier]=await Promise.all([import('/lib/vendor/three/0.180.0/build/three.webgpu.js'),import('/lib/vendor/rapier/0.19.3/rapier3d-compat/rapier.mjs')]);THREE=three;RAPIER=rapier.default;await RAPIER.init();
    renderer=new THREE.WebGPURenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));await renderer.init();
    if(!renderer.backend.isWebGPUBackend){renderer.dispose();fatal('WebGPU could not start on this device. This game does not use a WebGL fallback.');return;}
    renderer.backend.device?.lost?.then(()=>{gpuLost=true;fatal('The WebGPU device was lost. Reload the game to try again.');});renderer.outputColorSpace=THREE.SRGBColorSpace;viewport.appendChild(renderer.domElement);
    camera=new THREE.OrthographicCamera(-8,8,4.25,-4.25,.1,100);camera.position.set(0,4.5,17);camera.lookAt(0,2,0);makeStage();createShowcase();resize();window.addEventListener('resize',resize);
    $('loading').classList.add('hide');setScreen('title');
    if(matchMedia('(pointer: coarse)').matches&&!matchMedia('(pointer: fine)').matches&&!hasPhysicalInput)$('touchNotice').classList.add('visible');
    if(AIHub.active)connectHub();lastTime=performance.now();requestAnimationFrame(frame);
  }catch(e){console.error(e);fatal('The festival could not start: '+e.message);}
}
boot();

</script></body></html>
