    </div>
    <button class="primary-button centered-button" data-act="journey" data-autofocus>Choose a garden</button>
  </section>`;
}

function creditsHtml() {
  return `<section class="credits-screen panel-screen compact-panel">
    <header class="panel-header"><button class="icon-button back-button" data-act="title" aria-label="Back" data-autofocus>←</button><div><span class="eyebrow">MADE WITH CARE</span><h1>Credits</h1></div></header>
    <div class="credits-copy">
      <span class="credit-flower" aria-hidden="true">✿</span>
      <h2>Sproutbound: Skygarden Rescue</h2>
      <p>Designed as a bright little reminder that every big garden begins with one seed.</p>
      <dl>
        <div><dt>Game design &amp; direction</dt><dd>OpenAI Codex with Michael</dd></div>
        <div><dt>3D engine</dt><dd>three.js r${THREE.REVISION} · ${kit.backendLabel}</dd></div>
        <div><dt>Technology</dt><dd>JavaScript · WebGPU · Web Audio</dd></div>
      </dl>
      <small>No trackers. No ads. Progress stays on this device.</small>
    </div>
  </section>`;
}

function pauseHtml() {
  const m = MISSIONS[ui.missionIndex];
  const h = game.hud;
  return `<div class="modal-scrim"><section class="modal-card pause-card" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <span class="eyebrow">TAKE A BREATH</span>
    <h1 id="pause-title">Garden paused</h1>
    <p>${m.title} · ${h.delivered ?? 0}/${h.goal ?? m.goal} seeds restored</p>
    <div class="modal-actions">
      <button class="primary-button" data-act="resume" data-autofocus>Resume</button>
      <button class="secondary-button" data-act="settings" data-arg="paused">Settings</button>
      <button class="secondary-button" data-act="restart">Restart garden</button>
      <button class="text-button" data-act="leave">Return to garden map</button>
    </div>
    <small class="modal-hint" data-hint>${pauseHint()}</small>
  </section></div>`;
}

// Upgrade and results screens take no autofocus: a burst pressed as they open must not pick for the player.
function upgradeHtml() {
  return `<div class="modal-scrim upgrade-scrim"><section class="upgrade-panel" role="dialog" aria-modal="true" aria-labelledby="upgrade-title">
    <span class="eyebrow">THE GARDEN ANSWERS</span>
    <h1 id="upgrade-title">Choose a little boost</h1>
    <p>Your choice lasts for this garden.</p>
    <div class="upgrade-grid">${ui.upgrades
      .map((u, i) => `<button class="upgrade-card color-${u.color}" data-act="upgrade" data-arg="${i}"><span class="upgrade-icon">${u.icon}</span><span class="upgrade-count">0${i + 1}</span><strong>${u.name}</strong><small>${u.description}</small><b>Choose</b></button>`)
      .join('')}</div>
  </section></div>`;
}

function resultsHtml() {
  const r = ui.result;
  if (!r) return '';
  const next = MISSIONS[r.missionId + 1];
  const canNext = r.won && next && next.id <= save.unlockedMission;
  const title = r.won ? (r.missionId === STORY_FINALE ? 'The sky is blooming!' : r.missionId === MISSIONS.length - 1 ? 'The canopy sings!' : 'Bright work, Pip!') : 'One more sprout?';
  const badges = [];
  if (r.newBest) badges.push('<span class="best">New best score!</span>');
  else if (r.prevBest) badges.push(`<span>Best ${fmtNum(r.prevBest)}</span>`);
  for (const u of r.unlocks || []) badges.push(`<span class="unlock">${u}</span>`);
  const primary = r.won ? (canNext ? ['next', 'Next garden'] : ['journey', 'Garden map']) : ['restart', 'Try again'];
  const secondary = r.won ? ['restart', 'Play again'] : ['journey', 'Garden map'];
  return `<div class="modal-scrim results-scrim ${r.won ? 'victory' : 'failure'}"><section class="results-card" role="dialog" aria-modal="true" aria-labelledby="results-title">
    <span class="result-flower" aria-hidden="true">${r.won ? '✿' : '❧'}</span>
    <span class="eyebrow">${r.won ? 'GARDEN RESTORED' : 'SUNSET FOR NOW'}</span>
    <h1 id="results-title">${title}</h1>
    <p>${r.diagnosis}</p>
    ${r.won ? `<div class="result-stars">${starsHtml(r.stars)}</div>` : ''}
    ${badges.length ? `<div class="result-badges">${badges.join('')}</div>` : ''}
    <div class="result-stats">
      <span><small>SCORE</small><strong>${fmtNum(r.score)}</strong></span>
      <span><small>TIME LEFT</small><strong>${fmtTime(r.timeRemaining)}</strong></span>
      <span><small>PESTS CLEARED</small><strong>${r.pestsCleared}</strong></span>
    </div>
    <div class="modal-actions horizontal-actions">
      <button class="primary-button" data-act="${primary[0]}">${primary[1]}</button>
      <button class="secondary-button" data-act="${secondary[0]}">${secondary[1]}</button>
    </div>
    ${canNext ? '<button class="text-button" data-act="journey">Garden map</button>' : ''}
  </section></div>`;
}

function rangeRow(key, label, min, max, value) {
  return `<label class="range-row"><span>${label} <b data-val="${key}">${Math.round(value * 100)}%</b></span><input type="range" min="${min}" max="${max}" step="0.05" value="${value}" data-set="${key}"></label>`;
}

function toggleRow(key, label, detail, checked, disabled = false) {
  return `<label class="toggle-row ${disabled ? 'disabled' : ''}" data-row="${key}"><span><strong>${label}</strong><small>${detail}</small></span><input type="checkbox" data-set="${key}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}><i aria-hidden="true"><b></b></i></label>`;
}

function settingsHtml() {
  const st = save.settings;
  const inMission = ui.settingsReturn === 'paused';
  const modes = [['default', 'Garden original'], ['deuteranopia', 'Magenta threats'], ['tritanopia', 'Orange threats']];
  return `<div class="modal-scrim settings-scrim"><section class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <header><div><span class="eyebrow">MAKE IT YOURS</span><h1 id="settings-title">Settings</h1></div><button class="icon-button" data-act="close-settings" aria-label="Close settings">×</button></header>
    <div class="settings-columns">
      <div class="settings-group">
        <h2>Garden pace</h2>
        <div class="difficulty-options">${Object.keys(DIFFICULTY_INFO)
          .map((k) => `<button class="${st.difficulty === k ? 'selected' : ''}" data-act="difficulty" data-arg="${k}" ${st.difficulty === k ? 'data-autofocus' : ''}><strong>${DIFFICULTY_INFO[k].name}</strong><small>${DIFFICULTY_INFO[k].detail}</small></button>`)
          .join('')}</div>
        ${inMission ? '<p class="settings-note">A new pace starts with the next garden.</p>' : ''}
        <h2>Sound</h2>
        ${rangeRow('masterVolume', 'Master volume', 0, 1, st.masterVolume)}
        ${rangeRow('musicVolume', 'Music', 0, 1, st.musicVolume)}
        ${rangeRow('effectsVolume', 'Effects', 0, 1, st.effectsVolume)}
      </div>
      <div class="settings-group">
        <h2>Comfort &amp; access</h2>
        ${rangeRow('uiScale', 'Interface size', 0.9, 1.35, st.uiScale)}
        ${toggleRow('reducedMotion', 'Reduced motion', 'Stops bobbing and camera shake', st.reducedMotion)}
        ${toggleRow('cameraShake', 'Camera shake', 'A small bump when Pip is hit', st.cameraShake, st.reducedMotion)}
        ${toggleRow('highContrast', 'High contrast', 'Stronger glow on useful objects', st.highContrast)}
        ${toggleRow('captions', 'Sound captions', 'Shows important garden sounds', st.captions)}
        ${toggleRow('leftHanded', 'Left-handed touch', 'Mirrors touch controls', st.leftHanded)}
        <label class="select-row"><span><strong>Color palette</strong><small>Changes threat accents</small></span><select data-set="colorMode">${modes
          .map(([v, l]) => `<option value="${v}" ${st.colorMode === v ? 'selected' : ''}>${l}</option>`)
          .join('')}</select></label>
      </div>
    </div>
    <footer><span>${kit.backendLabel} renderer · three.js r${THREE.REVISION}</span><div class="footer-actions"><button class="secondary-button" data-act="graphics">Graphics &amp; controls</button><button class="primary-button" data-act="close-settings">Done</button></div></footer>
  </section></div>`;
}

function renderScreen() {
  const s = ui.screen;
  const html = s === 'title' ? titleHtml() : s === 'journey' ? journeyHtml() : s === 'guide' ? guideHtml() : s === 'credits' ? creditsHtml() : s === 'paused' ? pauseHtml() : s === 'upgrade' ? upgradeHtml() : s === 'results' ? resultsHtml() : s === 'settings' ? settingsHtml() : '';
  screenLayer.innerHTML = html;
  ui.layer = screenLayer.firstElementChild;
  renderTutorial();
  const af = screenLayer.querySelector('[data-autofocus]');
  if (af && !af.disabled) af.focus({ preventScroll: true });
}

function setScreen(next) {
  ui.screen = next;
  const worldVisible = ['playing', 'paused', 'upgrade', 'results'].includes(next) || (next === 'settings' && ui.settingsReturn === 'paused');
  shell.classList.toggle('world-visible', worldVisible);
  shell.classList.toggle('menu-world', !worldVisible);
  shell.dataset.screen = next;
  hudLayer.hidden = !worldVisible;
  renderScreen();
  kit.touch?.suspend(next !== 'playing', 'game');
  kit.input.settle();
  nav.needRelease = true;
  syncAudio();
  if (next === 'playing') {
    game.holdDash = true;
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    layoutTouch();
  } else if (!worldVisible) {
    game.calm();
  }
}

/* ------------------------------------------------------------------ actions */

function play(id) {
  const m = MISSIONS[id];
  if (!m || id > save.unlockedMission) return;
  const charm = CHARMS.find((c) => c.id === save.selectedCharm);
  const charmId = charm && totalStars(save) >= charm.unlockStars ? charm.id : 'ribbon';
  ui.missionIndex = id;
  ui.result = null;
  ui.tutorial = id === 0 && !save.seenIntro ? 0 : -1;
  hudPrev = {};
  refs.title.textContent = m.title;
  game.startMission(id, charmId, save.settings.difficulty, ui.tutorial === 0);
  setScreen('playing');
}

function pauseGame() {
  if (ui.screen !== 'playing' || game.finished) return;
  game.pause();
  setScreen('paused');
}

function resumeGame() {
  if (game.finished) {
    setScreen('journey');
    return;
  }
  game.resume();
  setScreen('playing');
}

function openSettings(ret) {
  ui.settingsReturn = ret === 'paused' ? 'paused' : 'title';
  if (ui.settingsReturn === 'paused') game.pause();
  setScreen('settings');
}

function closeSettings() {
  setScreen(ui.settingsReturn);
}

function selectCharm(id) {
  const c = CHARMS.find((x) => x.id === id);
  if (!c || totalStars(save) < c.unlockStars) return;
  persist({ ...save, selectedCharm: id });
  screenLayer.querySelectorAll('[data-act="charm"]').forEach((b) => {
    const on = b.dataset.arg === id;
    b.classList.toggle('selected', on);
    b.setAttribute('aria-pressed', String(on));
  });
}

function chooseUpgrade(i) {
  const up = ui.upgrades[i];
  if (!up || ui.screen !== 'upgrade') return;
  if (!game.applyUpgrade(up)) setScreen('playing');
}

function handleComplete(r) {
  const prevBest = save.bestScores[r.missionId] ?? 0;
  r.prevBest = prevBest;
  r.newBest = r.won && r.score > prevBest;
  r.unlocks = [];
  if (r.won) {
    const before = totalStars(save);
    const prevStars = save.stars[r.missionId] ?? 0;
    const next = {
      ...save,
      unlockedMission: Math.max(save.unlockedMission, Math.min(MISSIONS.length - 1, r.missionId + 1)),
      stars: { ...save.stars, [r.missionId]: Math.max(prevStars, r.stars) },
      bestScores: { ...save.bestScores, [r.missionId]: Math.max(prevBest, r.score) },
      totalSeeds: save.totalSeeds + r.delivered,
      seenIntro: true,
      completedGame: save.completedGame || r.missionId >= STORY_FINALE,
      canopyComplete: save.canopyComplete || r.missionId === MISSIONS.length - 1,
    };
    const after = totalStars(next);
    for (const c of CHARMS) if (c.unlockStars > before && c.unlockStars <= after) r.unlocks.push(`Charm unlocked: ${c.name}`);
    const nm = MISSIONS[r.missionId + 1];
    if (nm && nm.chapter !== MISSIONS[r.missionId].chapter && save.unlockedMission < nm.id) r.unlocks.push(`New chapter: ${CHAPTERS[nm.chapter - 1].name}`);
    persist(next);
  }
  ui.result = r;
  ui.tutorial = -1;
  setScreen('results');
}

function act(name, arg) {
  switch (name) {
    case 'journey': setScreen('journey'); break;
    case 'title': setScreen('title'); break;
    case 'guide': setScreen('guide'); break;
    case 'credits': setScreen('credits'); break;
    case 'settings': openSettings(arg); break;
    case 'close-settings': closeSettings(); break;
    case 'graphics': kit.menu.open(); break;
    case 'difficulty':
      if (!DIFF[arg]) break;
      applySettings({ difficulty: arg });
      screenLayer.querySelectorAll('[data-act="difficulty"]').forEach((b) => b.classList.toggle('selected', b.dataset.arg === arg));
      break;
    case 'play': play(Number(arg)); break;
    case 'next': play(ui.missionIndex + 1); break;
    case 'restart': play(ui.missionIndex); break;
    case 'charm': selectCharm(arg); break;
    case 'resume': resumeGame(); break;
    case 'leave':
      game.abandon();
      setScreen('journey');
      break;
    case 'upgrade': chooseUpgrade(Number(arg)); break;
    case 'pause': pauseGame(); break;
    case 'dismiss-tutorial':
      ui.tutorial = -1;
      game.tutorialStep = -1;
      renderTutorial();
      break;
    default: break;
  }
}

/* ------------------------------------------------------------------ menu input (keyboard, gamepad) */

const FOCUSABLE = 'button:not([disabled]), input:not([disabled]), select:not([disabled])';

function focusables(layer) {
  return [...layer.querySelectorAll(FOCUSABLE)].filter((el) => el.getClientRects().length > 0);
}

function focusDefault(layer) {
  const el = layer.querySelector('[data-autofocus]:not([disabled])') || focusables(layer)[0];
  el?.focus();
}

function moveFocus(layer, dir) {
  const cur = document.activeElement;
  const items = focusables(layer);
  if (!cur || !items.includes(cur)) {
    focusDefault(layer);
    return;
  }
  if (cur.type === 'range' && (dir === 'left' || dir === 'right')) {
    const step = Number(cur.step) || 0.05;
    const v = clamp(Number(cur.value) + (dir === 'right' ? step : -step), Number(cur.min), Number(cur.max));
    cur.value = String(Math.round(v * 100) / 100);
    cur.dispatchEvent(new Event('input', { bubbles: true }));
    return;
  }
  if (cur.tagName === 'SELECT' && (dir === 'left' || dir === 'right')) {
    const n = cur.options.length;
    cur.selectedIndex = (cur.selectedIndex + (dir === 'right' ? 1 : -1) + n) % n;
    cur.dispatchEvent(new Event('change', { bubbles: true }));
    return;
  }
  const r = cur.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  let best = null;
  let bestScore = Infinity;
  for (const el of items) {
    if (el === cur) continue;
    const b = el.getBoundingClientRect();
    const dx = b.left + b.width / 2 - cx;
    const dy = b.top + b.height / 2 - cy;
    const main = dir === 'up' ? -dy : dir === 'down' ? dy : dir === 'left' ? -dx : dx;
    const cross = dir === 'up' || dir === 'down' ? dx : dy;
    if (main <= 4) continue;
    const score = main + Math.abs(cross) * 2.2;
    if (score < bestScore) {
      bestScore = score;
      best = el;
    }
  }
  best?.focus();
}

function confirmFocus(layer) {
  const cur = document.activeElement;
  if (cur && cur !== document.body && layer.contains(cur) && cur.matches(FOCUSABLE)) {
    if (cur.type === 'range' || cur.tagName === 'SELECT') return;
    cur.click();
  } else {
    focusDefault(layer);
  }
}

function goBack() {
  switch (ui.screen) {
    case 'journey':
    case 'guide':
    case 'credits':
      setScreen('title');
      break;
    case 'settings':
      closeSettings();
      break;
    case 'paused':
      resumeGame();
      break;
    case 'results':
      setScreen('journey');
      break;
    default:
      break;
  }
}

function menuInput() {
  const layer = ui.layer;
  if (!layer || !layer.isConnected || kit.menu.isOpen) return;
  const inp = kit.input;
  const mv = inp.vector('move');
  let dir = '';
  if (Math.abs(mv.y) > 0.55 && Math.abs(mv.y) >= Math.abs(mv.x)) dir = mv.y > 0 ? 'up' : 'down';
  else if (Math.abs(mv.x) > 0.55) dir = mv.x > 0 ? 'right' : 'left';
  const now = performance.now();
  if (nav.needRelease) {
    // A stick still held from gameplay must come back to centre before it moves focus.
    if (!dir) nav.needRelease = false;
  } else if (dir && (dir !== nav.lastDir || now >= nav.repeatAt)) {
    nav.repeatAt = now + (dir !== nav.lastDir ? 380 : 140);
    moveFocus(layer, dir);
  }
  nav.lastDir = dir;
  if (inp.pressed('confirm')) confirmFocus(layer);
  else if (inp.pressed('back') || inp.pressed('pause')) goBack();
}

/* ------------------------------------------------------------------ wiring */

shell.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled || !shell.contains(el)) return;
  audio.unlock();
  act(el.dataset.act, el.dataset.arg);
  if (el.dataset.act !== 'pause') audio.play('select');
});

screenLayer.addEventListener('input', (e) => {
  const el = e.target;
  if (el.type !== 'range' || !el.dataset.set) return;
  const key = el.dataset.set;
  const v = Number(el.value);
  applySettings({ [key]: v });
  const out = screenLayer.querySelector(`[data-val="${key}"]`);
  if (out) out.textContent = `${Math.round(v * 100)}%`;
});

screenLayer.addEventListener('change', (e) => {
  const el = e.target;
  const key = el.dataset?.set;
  if (!key) return;
  if (el.type === 'checkbox') {
    applySettings({ [key]: el.checked });
    if (key === 'reducedMotion') {
      const row = screenLayer.querySelector('[data-row="cameraShake"]');
      row?.classList.toggle('disabled', el.checked);
      const box = row?.querySelector('input');
      if (box) box.disabled = el.checked;
    }
  } else if (el.tagName === 'SELECT') {
    applySettings({ [key]: el.value });
  }
});

// The kit leaves keys alone while a slider or list has focus; Escape still closes the panel.
screenLayer.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && /^(INPUT|SELECT)$/.test(e.target.tagName)) {
    e.preventDefault();
    e.target.blur();
    goBack();
  }
});

// Audio can only start from a gesture; try on every press until it runs.
const unlockAudio = () => {
  audio.unlock();
  if (audio.running) {
    removeEventListener('pointerdown', unlockAudio, true);
    removeEventListener('keydown', unlockAudio, true);
  }
};
addEventListener('pointerdown', unlockAudio, true);
addEventListener('keydown', unlockAudio, true);

document.addEventListener('visibilitychange', () => {
  if (document.hidden && ui.screen === 'playing') pauseGame();
  syncAudio();
});
kit.onPause((p) => {
  kitPaused = p;
  syncAudio();
});
kit.input.onSourceChange(() => refreshPrompts());

/* ------------------------------------------------------------------ loop */

let renderClock = 1;
kit.start((dt) => {
  if (ui.screen === 'playing') {
    if (kit.input.pressed('pause')) pauseGame();
  } else {
    menuInput();
  }
  game.frame(dt);
  // Menus only need a calm backdrop: redraw the blurred world at 30 fps there.
  renderClock += dt;
  if (ui.screen === 'playing' || game.pendingComplete || renderClock >= 1 / 30) {
    renderClock = 0;
    post.render();
  }
});

setScreen('title');
refreshPrompts();
</script>
</body>
</html>
