 updatePerson(state.players[0],dt,inp.x,inp.y);if(state.local2){let i=readMovement(1);let p=state.players[1];if(pressed['f']||padEdge(1,2))strike(p);if(pressed['g']||padEdge(1,0)){if(p.y===0)p.vy=7.5}if(pressed['h']||padEdge(1,3))cast(p);if(pressed['t']||padEdge(1,1)){p.dash=.24;p.inv=.3}updatePerson(p,dt,i.x,i.y)}for(const e of state.enemies)aiStep(e,dt);collectPickups(dt);
 for(let i=state.enemies.length-1;i>=0;i--){let e=state.enemies[i];if(e.dead){e.g.rotation.z=Math.min(1.5,e.g.rotation.z+dt*5);e.ai-=dt;if(e.ai< -1){removePerson(e);state.enemies.splice(i,1)}}}
 if(state.spawned&&state.enemies.every(e=>e.dead)){state.transition+=dt;if(state.transition>3){if(state.stage<2){for(const e of state.enemies)removePerson(e);state.enemies=[];setupStage(state.stage+1)}else if(state.attract){startGame(true)}else finish(true)}}if(state.players.every(p=>p.dead)&&!state.attract)finish(false);
 cameraX+=(state.players[0].x+2-cameraX)*Math.min(1,dt*2);camera.position.x=cameraX;camera.lookAt(cameraX,0,0);world.timestep=dt;world.step();for(let i=state.debris.length-1;i>=0;i--){let d=state.debris[i],pos=d.rb.translation();d.m.position.set(pos.x,pos.y,pos.z);d.life-=dt;if(d.life<=0){scene.remove(d.m);world.removeRigidBody(d.rb);state.debris.splice(i,1)}}if(AIHub.active&&state.score!==state.lastProgress){AIHub.progress({score:state.score,label:stages[state.stage].name.slice(0,24)});state.lastProgress=state.score}music(dt)}
function gp(i){return navigator.getGamepads?.()[i]||null}function padEdge(i,b){let p=gp(i);return !!p?.buttons[b]?.pressed&&!padPrev[i]?.[b]}function axis(v){return Math.abs(v||0)>.18?v:0}function readMovement(i){let p=gp(i),x=axis(p?.axes[0]),y=axis(p?.axes[1]);if(p){x+=(p.buttons[15]?.pressed?1:0)-(p.buttons[14]?.pressed?1:0);y+=(p.buttons[13]?.pressed?1:0)-(p.buttons[12]?.pressed?1:0)}if(i===0){x+=(keys['arrowright']?1:0)-(keys['arrowleft']?1:0);y+=(keys['arrowdown']?1:0)-(keys['arrowup']?1:0)}else{x+=(keys['d']?1:0)-(keys['a']?1:0);y+=(keys['s']?1:0)-(keys['w']?1:0)}return{x:Math.max(-1,Math.min(1,x))*(state.invertX?-1:1),y:Math.max(-1,Math.min(1,y))*(state.invertY?-1:1)}}
function menuOptions(){if(state.menu)return ['VOLUME  '+Math.round(state.volume*100)+'%','INVERT HORIZONTAL  '+(state.invertX?'ON':'OFF'),'INVERT VERTICAL  '+(state.invertY?'ON':'OFF'),'CONTROLS & STORY','CLOSE SETTINGS'];if(state.scene==='title')return ['BEGIN THE QUEST','HOW TO PLAY','SETTINGS','ABOUT / CREDITS'];if(state.scene==='instructions'||state.scene==='about')return ['BACK'];if(state.scene==='over'&&!AIHub.active)return ['PLAY AGAIN','TITLE SCREEN'];return []}
function saveSettings(){try{localStorage.setItem('gw-settings',JSON.stringify({volume:state.volume,invertX:state.invertX,invertY:state.invertY}))}catch(e){}}
function activate(i=state.menuIndex,dir=1){audioStart();sound(420,.08,'triangle',.07,120);if(state.menu){if(i===0)state.volume=(Math.round(state.volume*10)+dir+11)%11/10;else if(i===1)state.invertX=!state.invertX;else if(i===2)state.invertY=!state.invertY;else if(i===3){state.menu=false;state.returnScene=state.scene;state.scene='instructions'}else state.menu=false;saveSettings()}else if(state.scene==='title'){if(i===0)startGame();if(i===1){state.scene='instructions';state.returnScene='title'}if(i===2)state.menu=true;if(i===3)state.scene='about'}else if(state.scene==='instructions'){state.scene=state.returnScene||'title'}else if(state.scene==='about'){state.scene='title'}else if(state.scene==='over'&&!AIHub.active){if(i===0)startGame();else{state.scene='title';state.idle=0;state.ended=false}}state.menuIndex=0;renderUI()}
function back(){if(state.attract){state.attract=false;state.scene='title';state.idle=0}else if(state.menu)state.menu=false;else if(state.scene==='instructions')state.scene=state.returnScene||'title';else if(state.scene==='about')state.scene='title';else if(state.scene==='play')state.menu=true;else if(state.scene==='over'&&!AIHub.active)state.scene='title';state.menuIndex=0;renderUI()}
function list(options){return `<div class="menu">${options.map((o,i)=>`<button data-i="${i}" class="${i===state.menuIndex?'selected':''}">${o}</button>`).join('')}</div>`}
function instructions(){return `<div class="center"><div class="box"><div class="eyebrow">THE WARRIOR'S HANDBOOK</div><h2>Steel, speed & sorcery</h2><p>The Iron King has stolen the crown. Cross the borderlands, the witchwood and the keep. Defeat every foe to advance.</p><div class="columns"><p><span class="key">LEFT STICK / ARROWS</span><br>Move along the road and between lanes</p><p><span class="key">SQUARE / J or SPACE</span><br>Swing your axe. Strike close and face your foe.</p><p><span class="key">CROSS / K</span><br>Jump; attack in the air for a heavier blow.</p><p><span class="key">CIRCLE / SHIFT</span><br>Dodge through danger with brief invulnerability.</p><p><span class="key">TRIANGLE / L</span><br>Spend a rune to strike nearby enemies with magic.</p><p><span class="key">OPTIONS / ESC</span><br>Open settings. Change volume or invert either axis.</p></div><p>Earn points by striking and defeating enemies. Every five defeats can restore a rune; health recovers between chapters. Red flasks dropped by foes restore health when collected. On one device, a second controller presses Options to join; player two can also press 2 and use WASD, F attack, G jump, H magic and T dodge.</p>${list(['BACK'])}<div class="hint">CROSS / ENTER TO SELECT · CIRCLE / ESC TO GO BACK</div></div></div>`}
function about(){return `<div class="center"><div class="box"><div class="eyebrow">ABOUT THIS QUEST</div><h2>Credits & field notes</h2><p><b>Gilded Whacks II</b> is an original arcade fantasy inspired by Golden Axe II. Created 2026-10-29 09:35.</p><p><b>Technology:</b> Three.js r180 WebGPU, Rapier 0.19.3, Web Audio, Gamepad API and AI Hub Session Protocol v1. <b>Art:</b> original geometric cel-shaded figures and scenery. <b>Animation:</b> procedural articulated limbs and physics-driven fragments. <b>Audio:</b> synthesized music and effects; no voice. <b>Online:</b> AI Hub parallel score sessions; standalone local co-op. <b>Testing:</b> headless Chrome smoke, accelerated campaign progression, two-player AI Hub harness, simulated standard gamepad and touch-only notice; physical controller untested. <b>Environment:</b> Codex CLI (headless), Linux; browser: Chrome. <b>Model:</b> OpenAI gpt-6.1-terra, xhigh. <b>Usage:</b> unknown.</p><p><b>Testing feedback:</b> One issue was found: the initial headless Chrome graphics configuration produced a blank canvas; switching the test to Vulkan/SwiftShader rendered the scene. No game-breaking issue was identified in the checks. Most helpful: the AI Hub session harness. Least helpful: the initial blank-canvas screenshot.</p><p><b>Engine feedback:</b> Three.js makes scene composition approachable. I initially guessed the headless GPU flags wrong. Combat, animation and campaign flow had to be built for this demo. WebGPU initialization and headless compatibility were the hardest parts; clearer initialization diagnostics would be the best improvement, and the implicit renderer fallback is the behavior I would overhaul for WebGPU-only projects.</p><p><b>Prompt feedback:</b> The controller-first and attract-mode requirements were especially useful. “Feature-complete” leaves room for interpretation. The hardest part was fitting combat, campaign and multiplayer into one portable file. A full playthrough with a physical DualSense would be the most valuable additional test.</p>${list(['BACK'])}</div></div>`}
function renderUI(win=false){settingsBtn.hidden=!touchBlocked;if(state.loadError&&!touchBlocked&&!state.menu){screen.innerHTML='<div class="error"><div class="box"><h2>Unable to begin</h2><p>This game requires WebGPU and an internet connection for its engine libraries.</p></div></div>';return}if(touchBlocked&&!state.menu){screen.innerHTML='<div class="error"><div class="box"><h2>Controller or keyboard required</h2><p>Connect a controller or use a keyboard to begin.</p></div></div>';return}if(state.menu){screen.innerHTML=`<div class="center"><div class="box"><div class="eyebrow">YOUR DEVICE</div><h2>Settings</h2><p>Use left / right or select to change a setting.</p>${list(menuOptions())}<div class="hint">OPTIONS / ESC OR CIRCLE TO CLOSE</div></div></div>`}
 else if(state.scene==='title')screen.innerHTML=`<div class="veil"><div class="panel"><div class="eyebrow">A SWORD & SORCERY ARCADE ADVENTURE</div><h1 class="title">GILDED<br>WHACKS <small>II</small></h1><p class="intro">The crown is stolen. The kingdom is in chains. Take up your axe and carve a path to the Iron King.</p>${list(menuOptions())}<div class="hint">D-PAD / STICK TO CHOOSE &nbsp; · &nbsp; CROSS / ENTER TO SELECT</div></div><div class="foot">1–2 LOCAL PLAYERS &nbsp; / &nbsp; THREE CHAPTERS</div></div>`;
 else if(state.scene==='instructions')screen.innerHTML=instructions();else if(state.scene==='about')screen.innerHTML=about();else if(state.scene==='over')screen.innerHTML=`<div class="center"><div class="box"><div class="eyebrow">THE TALE ${win?'IS TOLD':'ENDS HERE'}</div><h2>${win?'The crown is free':'The road claims another'}</h2><p>${win?'The Iron King falls, and the people of the borderlands breathe once more. Your legend will be sung for ages.':'Your courage will be remembered. Gather your strength and take up the axe again.'}</p><p class="key">${state.score.toLocaleString()} POINTS &nbsp; · &nbsp; ${state.kills} FOES DEFEATED</p>${AIHub.active?'':list(menuOptions())}</div></div>`;else if(state.scene==='play')drawHud();else screen.innerHTML='';screen.querySelectorAll('button[data-i]').forEach(b=>{b.addEventListener('mouseenter',()=>{state.menuIndex=Number(b.dataset.i);screen.querySelectorAll('button[data-i]').forEach(x=>x.classList.toggle('selected',x===b))});b.addEventListener('click',()=>activate(Number(b.dataset.i)))})}
function drawHud(){let p=state.players[0],p2=state.players[1],boss=state.enemies.find(e=>e.kind==='boss'&&!e.dead);if(!p)return;const health=p=>`<div class="healthbox"><div class="name">${p.index?'THE COMPANION':'THE WANDERER'}</div><div class="bar"><div class="fill" style="width:${Math.max(0,p.hp/p.maxhp*100)}%"></div></div><div class="mana">${'◆'.repeat(p.magic)}${'◇'.repeat(5-p.magic)}</div></div>`;screen.innerHTML=`<div class="hud"><div class="top">${health(p)}${p2?health(p2):''}<div class="score">${state.score.toLocaleString()}<br><span style="font:800 12px Nunito Sans;letter-spacing:.1em">POINTS</span></div></div><div class="stage">${stages[state.stage].chapter}<br>${stages[state.stage].name}</div>${boss?`<div class="boss">THE IRON KING<div class="bar"><div class="fill" style="width:${Math.max(0,boss.hp/boss.maxhp*100)}%"></div></div></div>`:''}${state.toast>0?`<div class="toast">${state.toastText}<span class="subtoast">${state.toastSub}</span></div>`:''}${state.attract?'<div class="attract">DEMONSTRATION · PRESS ANY BUTTON</div>':'<div class="bottomhud">□ ATTACK &nbsp; × JUMP &nbsp; ○ DODGE &nbsp; △ MAGIC &nbsp; · &nbsp; OPTIONS SETTINGS</div>'}</div>`}
function noteInput(){state.idle=0;if(state.attract){state.attract=false;state.scene='title';state.ended=false;renderUI();return true}return false}
window.addEventListener('keydown',e=>{if(state.ended&&AIHub.active)return;if(touchBlocked){touchBlocked=false;settingsBtn.hidden=true;renderUI()}let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','escape'].includes(k))e.preventDefault();if(noteInput())return;if(!keys[k])pressed[k]=true;keys[k]=true;if(k==='escape'){back();return}if(state.menu||state.scene!=='play'){let options=menuOptions();if(!state.menu&&(state.scene==='about'||state.scene==='instructions')&&(k==='arrowdown'||k==='arrowup')){screen.querySelector('.box')?.scrollBy({top:k==='arrowdown'?130:-130,behavior:'smooth'})}else if(k==='arrowdown'||k==='s'){state.menuIndex=(state.menuIndex+1)%options.length;renderUI()}else if(k==='arrowup'||k==='w'){state.menuIndex=(state.menuIndex+options.length-1)%options.length;renderUI()}else if(k==='enter'||k===' '){activate()}else if((k==='arrowleft'||k==='arrowright')&&state.menu)activate(state.menuIndex,k==='arrowleft'?-1:1)}});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});window.addEventListener('pointerdown',()=>{noteInput()});window.addEventListener('pointermove',()=>{if(state.attract)noteInput();else if(state.scene==='title')state.idle=0});
function padMenu(){if(state.ended&&AIHub.active)return;let other=gp(1);if(state.attract&&other&&(other.buttons.some(b=>b.pressed)||other.axes.some(a=>Math.abs(a)>.5))){noteInput();return}let p=gp(0);if(!p)return;if(touchBlocked&&p.buttons.some(b=>b.pressed)){touchBlocked=false;settingsBtn.hidden=true;renderUI()}let buttons=p.buttons;let any=buttons.some((b,i)=>b.pressed&&!menuPadPrev[i]);let ax=axis(p.axes[0]),ay=axis(p.axes[1]);if((any||Math.abs(ax)>.5||Math.abs(ay)>.5)&&state.attract){noteInput();menuPadPrev=buttons.map(b=>b.pressed);return}if(any)state.idle=0;if(padEdge(0,9)&&!buttons[8]?.pressed){if(state.menu)back();else{state.menu=true;state.menuIndex=0;renderUI()}}else if(state.menu||state.scene!=='play'){let opts=menuOptions();if(opts.length){if(!state.menu&&(state.scene==='about'||state.scene==='instructions')&&(padEdge(0,13)||padEdge(0,12)||(Math.abs(ay)>.6&&!menuPadPrev.down&&!menuPadPrev.up))){screen.querySelector('.box')?.scrollBy({top:(padEdge(0,12)||ay<-.6)?-130:130,behavior:'smooth'})}else if(padEdge(0,13)||(ay>.6&&!menuPadPrev.down)){state.menuIndex=(state.menuIndex+1)%opts.length;renderUI()}if(!(!state.menu&&(state.scene==='about'||state.scene==='instructions'))&&(padEdge(0,12)||(ay<-.6&&!menuPadPrev.up))){state.menuIndex=(state.menuIndex+opts.length-1)%opts.length;renderUI()}if(padEdge(0,0))activate();if(padEdge(0,1))back();if(state.menu&&(padEdge(0,14)||padEdge(0,15)))activate(state.menuIndex,padEdge(0,14)?-1:1)}}menuPadPrev=buttons.map(b=>b.pressed);menuPadPrev.down=ay>.6;menuPadPrev.up=ay<-.6}
function loop(now){requestAnimationFrame(loop);let elapsed=(now-clock)/1000,dt=Math.min(.05,elapsed);clock=now;padMenu();if(state.scene==='title'&&!state.menu&&!touchBlocked&&!AIHub.active){state.idle+=elapsed;if(state.idle>10)startGame(true)}if(state.scene==='play'){update(dt);if(!state.menu)drawHud()}else if(scene&&camera){camera.position.x+=dt*.12;camera.lookAt(camera.position.x,0,0)}if(renderer&&scene)renderer.renderAsync(scene,camera);padPrev=[0,1].map(i=>gp(i)?.buttons.map(b=>b.pressed)||[]);pressed={}}
const hubConnection=AIHub.active?AIHub.connect({mode:'parallel',seats:[1,4]}):null;
async function init(){try{if(!navigator.gpu || !(await navigator.gpu.requestAdapter()))throw Error('WebGPU is unavailable in this browser. Enable WebGPU or try a supported desktop browser.');await RAPIER.init();renderer=new THREE.WebGPURenderer({antialias:true});await renderer.init();if(!renderer.backend.isWebGPUBackend)throw Error('WebGPU initialization failed.');renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;$('#view').appendChild(renderer.domElement);buildWorld();let display=makePerson('hero',3,0);display.g.rotation.y=-.3;let foe=makePerson('brute',7,-.7);foe.g.rotation.y=Math.PI;titleActors=[display,foe];renderUI();requestAnimationFrame(loop);if(AIHub.active){const info=await hubConnection;if(info){startGame();AIHub.on('time-up',()=>{if(state.scene==='play')finish(false)});AIHub.on('end',()=>{state.ended=true;state.scene='over';state.menu=false;if(audioCtx)audioCtx.suspend();renderUI(state.victory)});AIHub.ready()}}}catch(e){console.error(e);state.loadError=String(e.message||e);renderUI();AIHub.fail(state.loadError)}}
window.addEventListener('resize',()=>{if(!renderer)return;renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});settingsBtn.onclick=()=>{state.menu=true;renderUI()};AIHub.probe(()=>({scene:state.menu?'menu':state.scene==='instructions'||state.scene==='about'?'menu':state.scene,menu:state.menu,world:state.world,input:state.input}));if(touchBlocked)renderUI();init();
</script></body></html>
