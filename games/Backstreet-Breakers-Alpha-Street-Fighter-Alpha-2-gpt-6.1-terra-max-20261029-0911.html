  var ended = false;
  var connecting = null;

  var reported = false;

  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;

  hub.connect = function (opts) {

    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });

    }

        done(null);
        return;

  };

<body>
<div id="stage"></div>
<div id="vignette"></div>
<div id="ui">
  <div id="loading"><span class="eyebrow">BACKSTREET BREAKERS ALPHA</span><div class="loading-mark">✦</div><p id="loadingText">Warming up the block…</p></div>
  <div id="hud" class="hidden">

      <div class="side left"><div class="identity"><span id="p1Name">RIN</span><small id="p1Label">PLAYER 1</small></div><div class="life-track"><div class="life-fill" id="p1Life"></div></div><div class="win-dots" id="p1Wins"></div></div>

      <div class="side right"><div class="identity"><span id="p2Name">ROOK</span><small id="p2Label">CPU</small></div><div class="life-track"><div class="life-fill" id="p2Life"></div></div><div class="win-dots" id="p2Wins"></div></div>
    </div>

  <div id="toast" aria-live="polite"></div>
</div>
<script type="module">
/* Backstreet Breakers Alpha — original arcade fighting demo. */
const $ = (id) => document.getElementById(id);
const clamp = (n,a,b) => Math.max(a,Math.min(b,n));
const lerp = (a,b,t) => a+(b-a)*t;
const rand = (a,b) => a+Math.random()*(b-a);
const CHARACTERS = [
  {id:'rin',name:'RIN',title:'THE COMET',style:'Quick hands · balanced reach',color:0xffc746,accent:0xf4616c,skin:0xdf9874,hair:0x1c2239,scale:1,speed:4.4,power:1,special:'COMET WAVE',line:'Every street has a rhythm. I intend to find it.'},
  {id:'rook',name:'ROOK',title:'THE WALL',style:'Big hits · steady pressure',color:0x468ccb,accent:0x71ebe6,skin:0x986250,hair:0x292431,scale:1.08,speed:3.65,power:1.18,special:'BREAKWATER',line:'Show me the weight behind those words.'},
  {id:'nova',name:'NOVA',title:'THE SPARK',style:'Fast feet · tricky angles',color:0xad75d7,accent:0x77f6d5,skin:0xb8785d,hair:0xf1d8a8,scale:.95,speed:4.65,power:.92,special:'SPARK LINE',line:'No shortcuts. Just a brighter way through.'},
];
const MOVES = {
  light:{duration:.37,start:.09,end:.19,damage:6,range:1.34,stun:.22,meter:13,knock:1.2},
  heavy:{duration:.66,start:.22,end:.37,damage:11,range:1.65,stun:.36,meter:18,knock:2.5},
  special:{duration:.78,start:.24,end:.30,damage:10,range:0,stun:.34,meter:16,knock:2.0},
  throw:{duration:.65,start:.15,end:.26,damage:14,range:1.05,stun:.45,meter:15,knock:3.2},
  super:{duration:1.05,start:.30,end:.38,damage:22,range:0,stun:.55,meter:0,knock:3.8},
  counter:{duration:.58,start:.08,end:.22,damage:9,range:1.55,stun:.35,meter:0,knock:2.7},
};
const STAGE_LIMIT=5.3, FIXED=1/60;
let THREE, RAPIER, renderer, scene, camera, world, ground, fighters=[], projectiles=[], particles=[], crowd=[];
let state='loading', previousState='title', selected=0, nav=[], screenBack=null, settingsOpen=false, settingsIndex=0, savedNav=[], savedSelection=0;
let selectedChar=0, selectedChar2=1, selectMode='arcade', selectStep=0, infoPage=0, roomDigits=[0,0,0,0,0], roomCursor=0;
let config={music:65,sfx:80,invertX:false,invertY:false};
try { Object.assign(config, JSON.parse(localStorage.getItem('bba-settings')||'{}')); } catch {}
let match=null, network=null, peer=null, peerConnection=null, hubInfo=null, hubReadyPending=false, lastSnapshot=-Infinity, lastSend=0, remoteInputs=new Map();
let lastInteraction=performance.now(), simTime=0, accumulator=0, lastFrame=performance.now(), ended=false, eventSeq=0, lastInput={x:0,y:0,fire:false}, backgroundTimer=null, backgroundLast=0;
let touchOnly = matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints>0;
let audio=null, master=null, musicGain=null, sfxGain=null, nextBeat=0, beatNo=0;
let keys=new Set(), justKeys=new Set(), padPrev=[[],[],[],[]], padUpPrev=[false,false], lastPadNavigation=0, systemOptionsHeld=false, systemButtonsPrev=[], userHasInput=false;
let screenMessage='', messageUntil=0, toastTimer=0, comboUntil=0;
let aiHubEnded=false;

function saveSettings(){try{localStorage.setItem('bba-settings',JSON.stringify(config));}catch{}}
function tone(freq, duration=.12, type='square', gain=.12, slide=1, when=0, target=sfxGain){
  if(!audio || !target || audio.state!=='running')return;
  const t=when||audio.currentTime, o=audio.createOscillator(), g=audio.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(30,freq),t);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+duration);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);
  o.connect(g).connect(target);o.start(t);o.stop(t+duration+.02);
}
function sound(kind){
  if(!audio)return;
  if(kind==='hit'){tone(125,.15,'sawtooth',.22,.35);tone(410,.07,'square',.07,.5)}
  if(kind==='guard'){tone(740,.11,'triangle',.16,.6)}
  if(kind==='swing'){tone(240,.10,'sawtooth',.045,1.8)}
  if(kind==='special'){tone(320,.28,'sawtooth',.12,2.2);tone(670,.20,'sine',.08,1.3)}
  if(kind==='super'){tone(145,.45,'sawtooth',.17,2.6);tone(810,.32,'square',.08,1.4)}
  if(kind==='select'){tone(620,.07,'square',.07,1.25)}
  if(kind==='confirm'){tone(470,.09,'square',.08,1.5);tone(700,.12,'triangle',.08,1.2,audio.currentTime+.07)}
  if(kind==='ko'){tone(250,.5,'sawtooth',.19,.25);tone(100,.6,'triangle',.14,.6)}
  if(kind==='jump'){tone(230,.12,'triangle',.06,1.8)}
}
function voice(seed=0){
  if(!audio||audio.state!=='running')return;
  for(let i=0;i<4;i++)tone(185+seed*32+[0,80,35,110][i],.07,'triangle',.045,1.12,audio.currentTime+i*.065);
}
function audioUnlock(){
  try{
    if(!audio){audio=new AudioContext();master=audio.createGain();musicGain=audio.createGain();sfxGain=audio.createGain();musicGain.connect(master);sfxGain.connect(master);master.connect(audio.destination);nextBeat=audio.currentTime+.1;updateVolume()}
    audio.resume().catch(()=>{});
  }catch{}
}
function updateVolume(){if(!audio)return;master.gain.value=.55;musicGain.gain.value=config.music/100*.42;sfxGain.gain.value=config.sfx/100*.65}
function musicTick(){
  if(!audio||audio.state!=='running'||aiHubEnded)return;
  const notes=[110,110,164.81,146.83,130.81,130.81,196,164.81,110,110,164.81,220,196,164.81,146.83,130.81];
  while(nextBeat<audio.currentTime+.08){
    const n=beatNo%16;
    tone(notes[n],.15,'sawtooth',.16,.98,nextBeat,musicGain);
    if(n%4===0){tone(90,.12,'sine',.3,.45,nextBeat,musicGain);tone(notes[n]*2,.28,'triangle',.05,1,nextBeat,musicGain)}
    if(n%4===2)tone(200,.06,'square',.035,.2,nextBeat,musicGain);
    if(n%2===1)tone(1900,.025,'square',.012,.7,nextBeat,musicGain);
    beatNo++;nextBeat+=.16;
  }
}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');toastTimer=2.5}
function say(text, seconds=1.5){screenMessage=text;messageUntil=simTime+seconds;$('fightCallout').textContent=text}
function showCombo(text){$('combo').textContent=text;comboUntil=simTime+1.1}
function uiButton(label,index,cls='menu-button'){return `<button class="${cls}" data-nav="${index}">${label}</button>`}
function setNav(root, handlers, index=0){
  nav=[...root.querySelectorAll('[data-nav]')];selected=clamp(index,0,Math.max(0,nav.length-1));
  nav.forEach((el,i)=>el.addEventListener('click',(event)=>{event.stopPropagation();registerGesture();if(state==='attract'){showTitle();return}selected=i;paintNav();handlers[i]?.()}));paintNav();
}
function paintNav(){nav.forEach((el,i)=>el.classList.toggle('selected',i===selected))}
function moveNav(delta){if(!nav.length)return;selected=(selected+delta+nav.length)%nav.length;paintNav();sound('select');nav[selected]?.scrollIntoView({block:'nearest'})}
function setScreen(html,className='panel-screen'){$('screen').innerHTML=html;$('screen').className=className;lastInteraction=performance.now()}
function clearScreen(){$('screen').className='hidden';$('screen').innerHTML='';nav=[]}
function panel(title,inside,small=false){return `<div class="panel ${small?'panel-small':''}"><div class="panel-header"><h1>${title}</h1><span class="eyebrow">BACKSTREET / α</span></div>${inside}</div>`}
function showTitle(){
  if(network?.kind==='peer')closePeer();network=null;hubInfo=null;match=null;clearFight();state='title';settingsOpen=false;$('settings').classList.add('hidden');$('hud').classList.add('hidden');$('touchNotice').classList.toggle('hidden',!touchOnly);createTitleActors();
  const labels=['ARCADE STORY','TRAINING','LOCAL VERSUS','ONLINE VERSUS','HOW TO PLAY','SETTINGS','ABOUT / CREDITS'];
  setScreen(`<div class="title-wrap"><div class="brand-kicker">A NEW CHALLENGE IS WAITING</div><div class="logo">BACKSTREET<br>BREAKERS<span>ALPHA</span></div><p class="subline">FIGHT FOR YOUR PLACE IN THE CITY.</p><div class="menu-list">${labels.map((x,i)=>uiButton(x,i)).join('')}</div></div><div class="footer-hint"><span class="button-icon">✕</span> SELECT &nbsp;&nbsp; STICK / D-PAD NAVIGATE &nbsp;&nbsp; OPTIONS SETTINGS</div>`,'title-screen');
  setNav($('screen'),[()=>startSelect('arcade'),()=>startSelect('training'),()=>startSelect('local'),showOnline,()=>showGuide(0),openSettings,()=>showAbout(0)]);
}
function startSelect(mode){selectMode=mode;selectStep=0;selectedChar=0;selectedChar2=1;showSelect()}
function showSelect(){
  state='select';let who=selectMode==='local'&&selectStep===1?'PLAYER 2':'PLAYER 1';
  const cards=CHARACTERS.map((c,i)=>`<button class="fighter-card" style="--c:#${c.color.toString(16).padStart(6,'0')}" data-nav="${i}"><span class="number">0${i+1}</span><div class="swatch"></div><span class="eyebrow">${c.title}</span><h3>${c.name}</h3><p>${c.style}</p><p class="small">${c.special}</p></button>`).join('');
  setScreen(panel(`CHOOSE <em>${who}</em>`,`<p>Every fighter has the same core controls and a different rhythm.</p><div class="select-grid">${cards}</div><p class="small">← / → OR STICK TO CHOOSE &nbsp; · &nbsp; CROSS / ENTER TO LOCK IN</p><div class="panel-actions">${uiButton('BACK',3)}</div>`));
  const choice=i=>{sound('confirm');voice(i);if(selectStep===0)selectedChar=i;else selectedChar2=i;if(selectMode==='local'&&selectStep===0){selectStep=1;showSelect();return}if(selectMode==='online-host')hostRoom();else if(selectMode==='online-join')joinRoomScreen();else if(selectMode==='arcade')showStoryIntro(0);else startMatch(selectMode)};
  setNav($('screen'),[()=>choice(0),()=>choice(1),()=>choice(2),()=>{if(selectMode==='local'&&selectStep===1){selectStep=0;showSelect()}else if(selectMode.startsWith('online'))showOnline();else showTitle()}],selectStep?selectedChar2:selectedChar);
}
function showStoryIntro(stage){
  state='story';const rivalIndex=(selectedChar+stage+1)%3, hero=CHARACTERS[selectedChar],rival=CHARACTERS[rivalIndex];
  const captions=['A rumor draws you to the midnight market. One more fighter stands between you and the next block.','The crowd parts. A familiar name steps into the light, ready to settle the score.','The final challenge is waiting at the end of the avenue. The city holds its breath.'];
  setScreen(panel(`STAGE 0${stage+1} <em>VS ${rival.name}</em>`,`<p>${captions[stage]}</p><div class="line"></div><div class="panel-grid"><div><span class="eyebrow">${hero.name}</span><p><strong>“${hero.line}”</strong></p></div><div><span class="eyebrow">${rival.name}</span><p><strong>“${rival.line}”</strong></p></div></div><div class="panel-actions">${uiButton('FIGHT!',0)}${uiButton('BACK',1)}</div>`));

  AIHub.on('start',()=>{if(!info.server)audioUnlock()});
  AIHub.on('time-up',()=>{if(network?.isHost)finishHub()});
  AIHub.on('end',()=>{aiHubEnded=true;state='match-over';if(match)match.phase='over';$('fightCallout').textContent='MATCH COMPLETE';if(master&&audio)master.gain.setTargetAtTime(0,audio.currentTime,.08)});
  if(info.splash||info.server){AIHub.ready();hubReadyPending=false}else{hubReadyPending=true;$('fightCallout').textContent='PRESS ANY INPUT TO READY'}
}
function closePeer(){if(peerConnection){try{peerConnection.close()}catch{}peerConnection=null}if(peer){try{peer.destroy()}catch{}peer=null}if(network?.kind==='peer')network=null}
async function peerClass(){const m=await import('https://cdn.jsdelivr.net/npm/peerjs@1.5.5/+esm');return m.Peer||m.default}
function peerNet(isHost){return {kind:'peer',isHost,me:isHost?0:1,host:0,server:false,players:[],send:(data)=>{if(peerConnection?.open)peerConnection.send(data)}}}
function peerError(e){let message=e?.type==='peer-unavailable'?'Room not found. Check the code.':e?.type==='unavailable-id'?'That room code is busy. Try again.':'Connection failed. Please try again.';closePeer();showOnline();toast(message)}
async function hostRoom(){
  state='room-wait';let code=String(crypto.getRandomValues(new Uint32Array(1))[0]%100000).padStart(5,'0');waitingRoom(code,'Opening the room…');
  try{const Peer=await peerClass();if(state!=='room-wait')return;peer=new Peer('bba-'+code);peer.on('error',peerError);peer.on('open',()=>waitingRoom(code,'Waiting for a challenger…'));peer.on('connection',conn=>{
    if(peerConnection){conn.close();return}peerConnection=conn;network=peerNet(true);conn.on('open',()=>conn.send({t:'host-hello',charIndex:selectedChar}));
    conn.on('data',data=>{if(data?.t==='join-hello'){network.players=[{id:0,name:'PLAYER 1',charIndex:selectedChar},{id:1,name:'PLAYER 2',charIndex:clamp(Number(data.charIndex)||0,0,2)}];conn.send({t:'begin',players:network.players});startMatch('online')}else handleNetworkMessage(data,1)});
    conn.on('close',()=>{if(network?.kind==='peer'){toast('CHALLENGER DISCONNECTED');closePeer();showTitle()}});
  });}catch(e){peerError(e)}
}
async function connectRoom(code){
  state='room-connecting';setScreen(panel('CONNECTING',`<p>Finding room <strong>${code}</strong>…</p><div class="panel-actions">${uiButton('CANCEL',0)}</div>`,true));setNav($('screen'),[()=>{closePeer();showOnline()}]);
  try{const Peer=await peerClass();if(state!=='room-connecting')return;peer=new Peer();peer.on('error',peerError);peer.on('open',()=>{peerConnection=peer.connect('bba-'+code,{reliable:true});let conn=peerConnection;network=peerNet(false);conn.on('open',()=>conn.send({t:'join-hello',charIndex:selectedChar}));conn.on('data',data=>{if(data?.t==='begin'){network.players=data.players;startMatch('online')}else if(data?.t!=='host-hello')handleNetworkMessage(data,0)});conn.on('error',peerError);conn.on('close',()=>{if(network?.kind==='peer'){toast('HOST DISCONNECTED');closePeer();showTitle()}})});}catch(e){peerError(e)}
}
function registerGesture(){lastInteraction=performance.now();audioUnlock();if(hubReadyPending){hubReadyPending=false;AIHub.ready();$('fightCallout').textContent='WAITING FOR RIVALS'}}
function dismissTouch(){if(touchOnly){touchOnly=false;$('touchNotice').classList.add('hidden')}}
window.addEventListener('keydown',event=>{
  dismissTouch();registerGesture();if(state==='attract'){event.preventDefault();showTitle();return}
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Backspace','Escape'].includes(event.code))event.preventDefault();
  if(event.code==='Escape'&&!event.repeat){if(settingsOpen)closeSettings();else openSettings();return}
  if(state==='room-code'&&!settingsOpen){const c=event.code;if(c==='ArrowLeft'||c==='KeyA'||c==='ArrowRight'||c==='KeyD'){roomCursor=(roomCursor+((c==='ArrowRight'||c==='KeyD')?1:4))%5;renderRoomCode();return}if(c==='ArrowUp'||c==='KeyW'||c==='ArrowDown'||c==='KeyS'){roomDigits[roomCursor]=(roomDigits[roomCursor]+((c==='ArrowUp'||c==='KeyW')?1:9))%10;renderRoomCode();return}}
  if(!keys.has(event.code))justKeys.add(event.code);keys.add(event.code);
});
window.addEventListener('keyup',event=>keys.delete(event.code));window.addEventListener('blur',()=>{keys.clear();justKeys.clear();const f=fighters.find(q=>q.id===localId());if(f){f.intentX=0;f.intentY=0}});
document.addEventListener('visibilitychange',()=>{
  if(backgroundTimer){clearInterval(backgroundTimer);backgroundTimer=null}
  lastFrame=performance.now();
  if(document.hidden&&network){backgroundLast=performance.now();backgroundTimer=setInterval(()=>{if(!document.hidden||!network||!match||aiHubEnded)return;const now=performance.now(),dt=clamp((now-backgroundLast)/1000,0,.12);backgroundLast=now;accumulator=Math.min(accumulator+dt,.12);while(accumulator>=FIXED){fixedStep(FIXED);accumulator-=FIXED}networkTick(now)},100)}
});
window.addEventListener('pointerdown',event=>{registerGesture();if(state==='attract'){event.preventDefault();showTitle()}},true);
$('settingsButton').addEventListener('click',()=>{registerGesture();if(settingsOpen)closeSettings();else openSettings()});
$('touchSettings').addEventListener('click',()=>{registerGesture();openSettings()});
function readPads(){
  let raw=[];try{raw=Array.from(navigator.getGamepads?.()||[]).filter(Boolean)}catch{}
  return raw.map(p=>{const pressed=p.buttons.map(b=>b.pressed||b.value>.6),previous=padPrev[p.index]||[],edge=pressed.map((v,i)=>v&&!previous[i]);padPrev[p.index]=pressed;return {raw:p,pressed,edge,axes:p.axes||[]}});
}
setInterval(()=>{
  let pad;try{pad=Array.from(navigator.getGamepads?.()||[]).find(Boolean)}catch{}
  const pressed=pad?pad.buttons.map(b=>b.pressed||b.value>.6):[],edge=pressed.map((v,i)=>v&&!systemButtonsPrev[i]);systemButtonsPrev=pressed;
  const options=!!pressed[9],create=!!pressed[8];
  if(options&&!systemOptionsHeld&&!create){dismissTouch();registerGesture();if(state==='attract')showTitle();else if(settingsOpen)closeSettings();else openSettings()}
  systemOptionsHeld=options;
  if(pad&&(settingsOpen||['title','select','story','online','guide','about','room-code','room-wait','room-connecting','match-over'].includes(state)))handleMenuInput({pressed,edge,axes:pad.axes||[]},performance.now(),false);
},30);
function direction(pad){
  if(!pad)return {x:0,y:0};let ax=pad.axes[0]||0,ay=pad.axes[1]||0;if(config.invertX)ax=-ax;if(config.invertY)ay=-ay;if(Math.abs(ax)<.25)ax=0;if(Math.abs(ay)<.25)ay=0;
  let x=(pad.pressed[15]?1:0)-(pad.pressed[14]?1:0),y=(pad.pressed[13]?1:0)-(pad.pressed[12]?1:0);return {x:x||ax,y:y||ay};
}
function collectInput(pad,player=0){
  const d=direction(pad),p=pad?.pressed||[],e=pad?.edge||[];let x,y,jump,actions=[];
  if(player===0){x=((keys.has('ArrowRight')||keys.has('KeyD'))?1:0)-((keys.has('ArrowLeft')||keys.has('KeyA'))?1:0);y=((keys.has('ArrowDown')||keys.has('KeyS'))?1:0)-((keys.has('ArrowUp')||keys.has('KeyW'))?1:0);jump=!!(e[0]||justKeys.has('ArrowUp')||justKeys.has('KeyW')||justKeys.has('Space'));if(e[2]||justKeys.has('KeyJ'))actions.push('light');if(e[3]||justKeys.has('KeyK'))actions.push('heavy');if(e[1]||justKeys.has('KeyL'))actions.push('special');if(e[4]||justKeys.has('KeyI'))actions.push('throw');if(e[5]||justKeys.has('KeyU'))actions.push('super')}
  else{x=(keys.has('Numpad6')?1:0)-(keys.has('Numpad4')?1:0);y=(keys.has('Numpad5')?1:0)-(keys.has('Numpad8')?1:0);jump=!!(e[0]||justKeys.has('Numpad8'));if(e[2]||justKeys.has('Numpad1'))actions.push('light');if(e[3]||justKeys.has('Numpad2'))actions.push('heavy');if(e[1]||justKeys.has('Numpad3'))actions.push('special');if(e[4]||justKeys.has('Numpad0'))actions.push('throw');if(e[5]||justKeys.has('NumpadDecimal'))actions.push('super')}
  if(pad){x=x||d.x;y=y||d.y;const up=d.y<-.7;if(up&&!padUpPrev[player])jump=true;padUpPrev[player]=up}
  return {x:clamp(x,-1,1),y:clamp(y,-1,1),jump,actions};
}
function handleMenuInput(pad,now,keyboard=true){
  const key=code=>keyboard&&justKeys.has(code);const e=pad?.edge||[],d=direction(pad);let up=key('ArrowUp')||key('KeyW')||e[12],down=key('ArrowDown')||key('KeyS')||e[13],left=key('ArrowLeft')||key('KeyA')||e[14],right=key('ArrowRight')||key('KeyD')||e[15];
  if(now-lastPadNavigation>260){if(d.y<-.65)up=true;else if(d.y>.65)down=true;else if(d.x<-.65)left=true;else if(d.x>.65)right=true;if(up||down||left||right)lastPadNavigation=now}
  if(state==='room-code'&&!settingsOpen){if(left||right){roomCursor=(roomCursor+(right?1:4))%5;renderRoomCode()}if(up||down){roomDigits[roomCursor]=(roomDigits[roomCursor]+(up?1:9))%10;renderRoomCode()}}
  else{if(up||left)moveNav(-1);if(down||right)moveNav(1)}
  if(settingsOpen)settingsIndex=selected;
  if(key('Enter')||key('Space')||e[0]){nav[selected]?.click()}
  if(key('Backspace')||e[1]){if(settingsOpen)closeSettings();else if(state==='select'){if(selectMode==='local'&&selectStep===1){selectStep=0;showSelect()}else if(selectMode.startsWith('online'))showOnline();else showTitle()}else if(['story','guide','about','online'].includes(state))showTitle();else if(['room-code','room-wait','room-connecting'].includes(state)){closePeer();showOnline()}}
}
function fixedStep(dt){
  if(!match||aiHubEnded)return;const authority=!network||network.isHost;simTime+=dt;match.phaseTime+=dt;
  if(match.phase==='ready'){
    if(network?.kind==='hub'&&AIHub.time()>=0){match.phase='fight';state='fight';match.phaseTime=0;say('FIGHT!',.8)}
    return;
  }
  if(match.phase==='intro'&&match.phaseTime>=1.65){match.phase='fight';match.phaseTime=0;if(match.mode!=='attract')state='fight';say('FIGHT!',.7);voice(1)}
  if(match.phase==='fight'){
    if(authority){for(const f of fighters)stepAI(f,dt);if(match.mode!=='training')match.timer=Math.max(0,match.timer-dt)}
    for(const f of fighters){if(authority||f.id===network?.me)stepFighter(f,dt,authority)}
    world.timestep=dt;world.step();
    for(const f of fighters){const p=f.body.translation();f.x=clamp(p.x,-STAGE_LIMIT,STAGE_LIMIT);f.y=p.y;if(f.x!==p.x)f.body.setTranslation({x:f.x,y:p.y,z:0},true)}
    stepProjectiles(dt);if(authority)evaluateRound();
  }else if(match.phase==='round-end'&&authority&&match.phaseTime>2.4){
    if(match.mode==='attract'){match.wins=[0,0];match.round=1;resetRound();fighters.forEach(f=>f.meter=200)}
    else if(match.wins.some(n=>n>=2))finishMatch();else{match.round++;resetRound()}
  }
  animateParticles(dt);
}
function frame(now){
  let dt=clamp((now-lastFrame)/1000,0,.12);lastFrame=now;const pads=readPads();let pad=pads[0];let activity=pad&&(pad.edge.some(Boolean)||Math.abs(pad.axes[0]||0)>.7||Math.abs(pad.axes[1]||0)>.7);
  if(activity){dismissTouch();registerGesture();if(state==='attract'){showTitle();justKeys.clear();return requestAnimationFrame(frame)}}
  if(!settingsOpen&&['title','select','story','online','guide','about','room-code'].includes(state)&&now-lastInteraction>=10000&&!touchOnly){selectedChar=0;startMatch('attract')}
  if(settingsOpen||['title','select','story','online','guide','about','room-code','room-wait','room-connecting','match-over'].includes(state))handleMenuInput(null,now,true);
  let input=collectInput(pad,0);lastInput={x:input.x,y:input.y,fire:!!([0,1,2,3,4,5].some(i=>pad?.pressed[i])||['Space','KeyJ','KeyK','KeyL','KeyI','KeyU'].some(k=>keys.has(k)))};
  if(match&&match.phase==='fight'&&(!settingsOpen||network)&&!aiHubEnded){
    if(settingsOpen)input={x:0,y:0,jump:false,actions:[]};
    let local=fighters.find(f=>f.id===localId());if(local&&!network?.server)applyLocalActions(local,input);
    if(match.mode==='local')applyLocalActions(fighters.find(f=>f.id===1),collectInput(pads[1],1));
  }
  if(match&&(!settingsOpen||network)&&!aiHubEnded&&(!document.hidden||!network)){accumulator=Math.min(accumulator+dt,.12);while(accumulator>=FIXED){fixedStep(FIXED);accumulator-=FIXED}networkTick(now);updateHUD()}
  for(const f of fighters)updateVisual(f,simTime);for(const f of titleActors)updateVisual(f,now/1000);
  for(const c of crowd)c.g.rotation.z=Math.sin(now*.003+c.phase)*.07;
  if(messageUntil&&simTime>messageUntil){$('fightCallout').textContent='';messageUntil=0}if(comboUntil&&simTime>comboUntil){$('combo').textContent='';comboUntil=0}
  if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.remove('show')}
  musicTick();if(renderer&&scene&&camera&&!network?.server&&!document.hidden)renderer.render(scene,camera);justKeys.clear();requestAnimationFrame(frame);
}
AIHub.probe(()=>({scene:state==='title'?'title':state==='ready'?'ready':state==='match-over'?'over':['fight','intro','round-end','attract'].includes(state)?'play':'menu',menu:settingsOpen,world:simTime,input:lastInput}));
const hubPromise=AIHub.active?AIHub.connect({mode:'versus',seats:[1,4]}):null;
$('touchNotice').classList.toggle('hidden',!touchOnly);
try{
  const info=hubPromise?await hubPromise:null;await initEngine(!!info?.server);$('loading').classList.add('hidden');if(info)await connectHub(Promise.resolve(info));else showTitle();lastFrame=performance.now();requestAnimationFrame(frame);
}catch(error){console.error(error);if(AIHub.active)AIHub.fail(error.message||'WebGPU initialization failed');$('loadingText').textContent=error.message||'Could not start the game.';$('loading').classList.remove('hidden');$('loading').querySelector('.loading-mark').textContent='!';}

</script>
