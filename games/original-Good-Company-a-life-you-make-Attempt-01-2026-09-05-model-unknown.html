// Soft synthesized interface sounds. Nothing is downloaded; the audio context starts on a gesture once sound is on.
const NOTE = { E4: 329.63, G4: 392, A4: 440, C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880, C6: 1046.5 };
class Sound {
  constructor() {
    this.ctx = null; this.master = null; this.enabled = false; this.paused = false;
    const unlock = () => { if (this.enabled) this.unlock(); };
    addEventListener('pointerdown', unlock, { capture: true, passive: true });
    addEventListener('keydown', unlock, { capture: true });
  }
  setEnabled(on) {
    this.enabled = !!on;
    if (!on && this.ctx?.state === 'running') this.ctx.suspend().catch(() => {});
  }
  /** Call from a click or key press: starts (or wakes) the audio context. Resolves when it can play. */
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return Promise.resolve();
      try { this.ctx = new AC(); } catch { return Promise.resolve(); }
      this.master = this.ctx.createGain(); this.master.gain.value = 0.3; this.master.connect(this.ctx.destination);
    }
    return this.ctx.state === 'suspended' && !this.paused ? this.ctx.resume().catch(() => {}) : Promise.resolve();
  }
  /** The kit's settings panel pauses the game: hush until it closes. */
  suspend(on) {
    this.paused = on;

    (on ? this.ctx.suspend() : this.ctx.resume()).catch(() => {});
  }

    const ctx = this.ctx, t = ctx.currentTime + when, osc = ctx.createOscillator(), env = ctx.createGain();

    if (slide) osc.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    env.gain.setValueAtTime(0.0001, t); env.gain.exponentialRampToValueAtTime(gain, t + 0.014); env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  }
  play(name = 'tap') {
    if (!this.enabled || this.paused || !this.ctx || this.ctx.state !== 'running') return;
    const n = NOTE;
    switch (name) {
      case 'tap': this.tone(450, 0, 0.2, { gain: 0.1, slide: 1.16 }); break;
      case 'open': this.tone(n.G4, 0, 0.13, { gain: 0.06 }); this.tone(n.C5, 0.05, 0.17, { gain: 0.06 }); break;
      case 'arrive': this.tone(n.C5, 0, 0.11, { gain: 0.07 }); this.tone(n.E5, 0.07, 0.15, { gain: 0.07 }); break;
      case 'success': [n.C5, n.E5, n.G5, n.C6].forEach((f, i) => this.tone(f, i * 0.085, 0.3, { type: 'triangle', gain: 0.1 })); break;
      case 'book': this.tone(n.C5, 0, 0.14, { type: 'triangle', gain: 0.11 }); this.tone(n.G5, 0.09, 0.24, { type: 'triangle', gain: 0.11 }); break;
      case 'coin': this.tone(n.A5, 0, 0.1, { gain: 0.1 }); this.tone(n.E5 * 2, 0.08, 0.32, { gain: 0.09 }); break;
      case 'warn': this.tone(n.E4, 0, 0.2, { type: 'triangle', gain: 0.08, slide: 0.85 }); break;
      case 'night': [n.G5, n.E5, n.C5, n.G4].forEach((f, i) => this.tone(f, i * 0.14, 0.45, { gain: 0.07 })); break;

// D-pad / stick / arrow keys move focus between controls by direction; A presses; left and right adjust sliders and lists.
function createPadNav(input) {

  const list = (root) => [...root.querySelectorAll(FOCUSABLE)].filter(usable);
  const idOf = (el) => {
    if (el.id) return `#${CSS.escape(el.id)}`;
    if (!el.dataset.act) return null;
    let sel = `[data-act="${CSS.escape(el.dataset.act)}"]`;
    for (const k of ['tab', 'id', 'kind', 'place', 'choice', 'look', 'key', 'region', 'name']) if (el.dataset[k] != null) sel += `[data-${k}="${CSS.escape(el.dataset[k])}"]`;
    return sel;
  };
  const mark = (el) => { if (node && node !== el) node.classList.remove('pad-focus'); node = el; identity = el ? idOf(el) : null; el?.classList.add('pad-focus'); };
  const focus = (el) => { if (!el) return; el.focus({ preventScroll: true }); el.scrollIntoView?.({ block: 'nearest' }); mark(el); };
  const preferred = (root) => {
    const all = list(root);
    for (const sel of ['.choice', '.primary', '.action-card', '.mini-btn', '.secondary']) { const el = all.find((e) => e.matches(sel)); if (el) return el; }
    return all.find((el) => !el.matches('.sheet-close')) || all[0] || null;
  };
  const step = (root, from, dx, dy) => {
    const r = from.getBoundingClientRect(), cx = (r.left + r.right) / 2, cy = (r.top + r.bottom) / 2;
    let best = null, bestScore = Infinity;
    for (const el of list(root)) {
      if (el === from) continue;
      const c = el.getBoundingClientRect(), ex = (c.left + c.right) / 2, ey = (c.top + c.bottom) / 2;
      let along, gap, offset;
      if (dy) { if (dy > 0 ? ey <= cy + 1 : ey >= cy - 1) continue; along = dy > 0 ? c.top - r.bottom : r.top - c.bottom; gap = Math.max(0, c.left - r.right, r.left - c.right); offset = Math.abs(ex - cx); }
      else { if (dx > 0 ? ex <= cx + 1 : ex >= cx - 1) continue; along = dx > 0 ? c.left - r.right : r.left - c.right; gap = Math.max(0, c.top - r.bottom, r.top - c.bottom); offset = Math.abs(ey - cy); }
      const score = Math.max(0, along) + gap * 3 + offset * 0.15;
      if (score < bestScore) { bestScore = score; best = el; }
    }
    return best;
  };
  const adjust = (el, dir) => {
    if (el.tagName === 'INPUT' && el.type === 'range') { const st = Number(el.step) || 1; el.value = String(clampN(Number(el.value) + dir * st, Number(el.min) || 0, Number(el.max) || 100)); }
    else if (el.tagName === 'SELECT') el.selectedIndex = clampN(el.selectedIndex + dir, 0, el.options.length - 1);
    else return false;
    el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true }));
    return true;
  };
  addEventListener('pointerdown', () => { node?.classList.remove('pad-focus'); node = null; identity = null; }, true);
  const current = (root) => {
    if (node && node.isConnected && root.contains(node) && usable(node)) return node;
    const a = document.activeElement;
    return a && a !== document.body && root.contains(a) && a.matches(FOCUSABLE) && usable(a) ? a : null;
  };
  return {
    clear() { node?.classList.remove('pad-focus'); node = null; },
    /** After a panel opens or re-renders: back to the same control if it is still there, else the natural first one. */
    restore(root) { const again = identity ? root.querySelector(identity) : null; focus(again && usable(again) ? again : preferred(root)); },
    update(root, dir, confirm) {
      if (node && (!node.isConnected || !root.contains(node))) { const again = identity ? root.querySelector(identity) : null; node.classList.remove('pad-focus'); node = null; if (again && usable(again)) mark(again); }
      const ax = Math.abs(dir.x) > 0.5 ? Math.sign(dir.x) : 0, ay = Math.abs(dir.y) > 0.5 ? Math.sign(dir.y) : 0;
      const d = ay ? (ay > 0 ? 'up' : 'down') : ax ? (ax > 0 ? 'right' : 'left') : null;
      const now = performance.now();
      let fire = false;
      if (d && d !== held) { fire = true; repeatAt = now + 380; } else if (d && now >= repeatAt) { fire = true; repeatAt = now + 130; }

      if (fire) {

        if (!cur) focus(preferred(root));

        else { const next = step(root, cur, ay ? 0 : ax, ay ? -ay : 0); if (next) focus(next); else mark(cur); } // step() takes screen directions (down is +y)

}

function renderPlace(id) {

function datePage() {

    const alt = c.topic === 'art' ? 'travel' : 'art'; const names = { art: 'That little exhibition across town', travel: 'Places we would love to explore', food: 'The café you cannot stop talking about', nature: 'A favorite place to get some fresh air' };
    const opts = [{ id: alt, title: names[alt], detail: 'Share a story and see what connects.' }, { id: 'ask', title: 'What has made you smile this week?', detail: 'Invite them into the conversation.' }, { id: c.topic, title: names[c.topic], detail: 'A small detail from their profile.' }];

    const shift = c.id % 3; for (let i = 0; i < 3; i++) { const o = opts[(i + shift) % 3]; html += choice(o.id, o.title, o.detail, i); }

    else { html += `<div class="callout">${a.attention >= 10 ? 'You catch the little details. They feel heard.' : a.attention >= 5 ? 'A thoughtful pause. You bring your attention back.' : 'Your mind wanders a little. You can still make the moment count.'}</div>${choice('calm', 'Find a quiet bench', 'Slow down and give the conversation room.', 0)}${choice('bright', market ? 'Make it a playful lap of the stalls' : 'Make it a playful little stroll', 'Share something surprising you noticed.', 1)}${choice('ask', 'Ask what would feel good right now', 'Check in rather than assume.', 2)}`; }
  } else {
    const pressure = c.risky;
    const prompt = pressure ? (c.limits.venue ? 'Could we change the plan and go somewhere private?' : c.limits.photos ? 'Can I take a photo of us, even though we agreed not to?' : 'Could you stay longer, without changing the price?') : market ? LINES.marketGoodbye : LINES.goodbye[(c.id + a.score) % 3];

  }
  html += `<button class="text-btn danger" data-act="safe-exit">${icon('shield')} End the date safely</button>`;

  if (a.phase === 1 && a.attention === null) { attentionStart = performance.now(); attentionPos = 0.5; attentionLive = true; }
}

function week() {
  const s = sim.s; s.weekSeen = true; sound('success'); kit.input.rumble(0.3, 140);
  showSheet('Seven days, a little wiser', 'Your first chapter is not your whole story.', 'flag', `<div class="welcome-hero"><h2>${esc(sim.ending())}<em>.</em></h2></div><p class="intro">You found your way through a working week. These are the things you carry into the next one.</p><div class="stat-grid"><div class="stat-tile"><strong>${G.money(s.cash - s.debt)}</strong><small>cash less debt</small></div><div class="stat-tile"><strong>${s.completed}</strong><small>dates completed</small></div><div class="stat-tile"><strong>${s.reputation.toFixed(1)}</strong><small>reputation</small></div></div><div class="stat-grid"><div class="stat-tile"><strong>${s.best.rating ? s.best.rating.toFixed(1) : '—'}</strong><small>best review</small></div><div class="stat-tile"><strong>${G.money(s.best.dayIncome)}</strong><small>best day</small></div><div class="stat-tile"><strong>${Math.round(s.balance)}</strong><small>life balance</small></div></div><div class="callout">${s.balance >= 40 ? 'There is still room for your own life. Protect that.' : 'Your own life could use a little more space. That is a choice you can make next week.'} ${s.studioOwned ? 'And now you have a studio of your own.' : ''}</div>${primary('Continue my story', 'continue-week', '', 'arrow')}<button class="text-btn" data-act="export">Export this chapter</button>`, 'week', 'A FIRST-WEEK REFLECTION');
}
function dateExitShortcut() { showSheet('Your boundaries travel with you', 'You can finish this date, or safely step away.', 'shield', `<p class="intro">No booking obliges you to continue. A safe exit returns the deposit and never changes your reputation.</p>${primary('Continue the date', 'go', `data-place="${sim.dateTarget()}"`, 'heart')}<button class="text-btn danger" data-act="safe-exit">End the date safely</button>`, 'safety', 'YOUR CHOICE, THROUGHOUT'); }
function restoreWorld() {
  world.player = world.closestFree(sim.s.position?.x || 0, sim.s.position?.z ?? 3);
  world.companion = null; world.setLook(world.playerAv, sim.s.look); marketKey = ''; syncMarket(); syncCompanion();
}

function handle(act, b) {
  const s = sim.s; switch (act) {
    case 'look': selectedLook = Number(b.dataset.look); document.querySelectorAll('.look-picker button').forEach((x) => x.classList.toggle('selected', Number(x.dataset.look) === selectedLook)); world.setLook(world.playerAv, selectedLook); break;
    case 'start': sim.start({ name: $('#player-name').value, look: selectedLook, background: $('#background-select').value, region: $('#region-select').value, cozy: $('#tone-select').value === 'cozy' }); sheet.kind = 'place'; closeSheet(); toast(kit.input.source === 'touch' ? 'Tap Book to walk to your first inquiry. Your time is yours.' : 'Head to Book for your first inquiry. Your time is yours.'); sound('success'); break;
    case 'close': closeSheet(); break;
    case 'go': go(b.dataset.place); break;
    case 'lounge-tab': lounge(b.dataset.tab); break;
    case 'lead': lead(b.dataset.id); break;
    case 'screen': sim.screen(b.dataset.id); lead(b.dataset.id); toast('References checked. Read the details before you decide.'); break;
    case 'pricing': pricing(); break;
    case 'limit': sim.at('lounge'); s.limits[b.dataset.key] = !s.limits[b.dataset.key]; sim.emit(); b.classList.toggle('on', s.limits[b.dataset.key]); b.setAttribute('aria-pressed', s.limits[b.dataset.key]); break;
    case 'save-rate': sim.setRate($('#base-rate').value); lounge(); toast('Your rate is saved. Existing bookings keep their agreed price.'); break;
    case 'negotiate': { const r = sim.negotiate(b.dataset.id, $('#quote-rate').value); lead(b.dataset.id); toast(r.accepted ? 'A clear agreement. Now choose a time.' : `They countered at ${G.money(r.quote)}.`); if (r.accepted) sound('choice'); break; }
    case 'accept': { const r = sim.accept(b.dataset.id, $('#booking-delay').value); closeSheet(); toast(`${r.name} is booked for ${G.clock(r.time)}. Deposit received.`); sound('book'); kit.input.rumble(0.25, 90); go(r.venue); break; }
    case 'cancel': sim.cancel(b.dataset.id); lounge('bookings'); toast('Booking cancelled. Deposit returned.'); break;
    case 'block': sim.block(b.dataset.name); lounge('clients'); toast('This client will not appear in future inquiries.'); break;
    case 'client-note': notePage(b.dataset.name); break;
    case 'save-note': sim.saveNote(b.dataset.name, $('#client-note').value); lounge('clients'); toast('Private note saved.'); break;
    case 'check-in': { const r = sim.startDate(b.dataset.id); if (r.noShow) { showSheet('They did not make it', 'A no-show is not a reflection of your worth.', 'clock', `<p class="intro">You waited, but the client did not arrive. You keep the deposit for the time you reserved.</p>${primary('Take a breather', 'close', '', 'leaf')}`, 'result', 'A LITTLE UNCERTAINTY'); } else datePage(); break; }
    case 'listen': { const score = s.settings.untimed ? 12 : attentionPos >= 0.35 && attentionPos <= 0.65 ? 12 : Math.max(2, Math.round(10 - Math.abs(attentionPos - 0.5) * 16)); attentionLive = false; sim.attention(score); if (score >= 10) kit.input.rumble(0.15, 50); datePage(); break; }
    case 'date-choice': { const r = sim.dateChoice(b.dataset.choice); if (r.finished) resultPage(r); else { closeSheet(); toast(r.feedback); sound('choice'); go(sim.dateTarget()); } break; }
    case 'safe-exit': { const name = s.active?.client.name; sim.safeExit(); showSheet('You are in charge of your time', 'A safe exit is always a valid choice.', 'shield', `<p class="intro">Your date with ${esc(name)} has ended. The deposit was returned, your reputation is unchanged, and you have a little room to recover.</p>${primary('A little time at the park', 'go', 'data-place="park"', 'leaf')}<button class="text-btn" data-act="close">Keep exploring</button>`, 'exit', 'YOUR BOUNDARIES MATTER'); break; }
    case 'activity': { const k = b.dataset.kind; const msg = sim.action(k); renderPlace(sim.s.at); toast(msg); sound(k === 'booth' || k === 'shift' ? 'coin' : 'success'); break; }
    case 'support': sim.support(b.dataset.kind); agency(); toast('Your support arrangement has been updated.'); break;
    case 'buy-studio': sim.buyStudio(); studio(); toast('A place of your own. Daily campaigns are now free.'); sound('success'); kit.input.rumble(0.3, 120); break;
    case 'move-region': sim.move(b.dataset.region); station(); toast(`A new chapter in ${sim.region().name}.`); break;
    case 'permit': sim.permit(); station(); toast('Business badge active. You can accept local bookings.'); break;
    case 'sleep': {
      const r = sim.sleep(); sound('night'); marketKey = ''; syncMarket();
      if (s.day >= 8 && !s.weekSeen) week();
      else showSheet('Good morning, a little lighter', `Day ${s.day} · a fresh set of possibilities`, 'sun', `<p class="intro">Yesterday, you received ${G.money(r.income)} and covered ${G.money(r.rent)} in living costs. Today starts with room to choose again.</p><div class="stat-grid"><div class="stat-tile"><strong>${Math.round(s.energy)}</strong><small>energy</small></div><div class="stat-tile"><strong>${Math.round(s.stress)}</strong><small>stress</small></div><div class="stat-tile"><strong>${G.money(s.cash)}</strong><small>cash on hand</small></div></div>${sim.marketDay() ? `<div class="callout">${icon('lantern')} It is ${DAYS[(s.day - 1) % 7]}: the night market sets up around Fountain square, and its stalls open at 5:00 PM.</div>` : ''}${primary('See who is in town', 'go', 'data-place="lounge"', 'calendar')}<button class="text-btn" data-act="close">Start with a slow morning</button>`, 'morning', 'A NEW DAY');
      break;
    }
    case 'repay': sim.repay(); home(); toast('Deferred living costs repaid.'); break;
    case 'journal-tab': journal(b.dataset.tab); break;
    case 'settings': settings(); break;
    case 'controls': controls(); break;
    case 'graphics': kit.menu.open(); break;
    case 'setting': s.settings[b.dataset.key] = !s.settings[b.dataset.key]; sim.emit(); b.classList.toggle('on', s.settings[b.dataset.key]); b.setAttribute('aria-pressed', s.settings[b.dataset.key]); if (b.dataset.key === 'sound') soundToggled(); break;
    case 'export': { save(); const url = URL.createObjectURL(new Blob([sim.serialize()], { type: 'application/json' })); const a = document.createElement('a'); a.href = url; a.download = `good-company-day-${s.day}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); toast('Save exported.'); break; }
    case 'import': { const input = document.createElement('input'); input.type = 'file'; input.accept = '.json,application/json'; input.onchange = async () => { try { const f = input.files[0]; if (!f || f.size > 250000) throw new Error('Choose a Good Company save under 250 KB.'); const restored = G.Sim.restore(await f.text()); if (!restored) throw new Error('That file is not a valid Good Company save.'); sim = restored; connectSim(); restoreWorld(); sim.emit(); closeSheet(); toast('Your story has been restored.'); } catch (e) { toast(e.message); } }; input.click(); break; }
    case 'reset-confirm': showSheet('Start a different story?', 'This replaces the save in this browser.', 'info', `<p class="intro">Export your current save first to keep it. Your existing local run will be replaced only when you choose Start over.</p><div class="two-col">${secondary('Export first', 'export', '', 'download')}${secondary('Keep my story', 'settings', '', 'back')}</div><div class="gap-top">${primary('Start over', 'reset', '', 'arrow')}</div>`, 'confirm', 'A NEW BEGINNING'); break;
    case 'reset': { try { localStorage.removeItem('good-company-v1'); } catch { /* storage blocked */ } sim = new G.Sim(); connectSim(); world.stop(); world.player = { x: 0, z: 3 }; world.companion = null; world.zoomTarget = 1; selectedLook = 0; marketKey = ''; syncMarket(); updateHUD(); welcome(); break; }
    case 'continue-week': s.weekSeen = true; sim.emit(); closeSheet(); break;
    default: break;
  }
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  try { sound(); handle(b.dataset.act, b); }
  catch (err) {
    if (err instanceof G.RuleError) { toast(err.message); sound('warn'); kit.input.rumble(0.12, 60); }
    else { toast('Something interrupted that action. Your current save is preserved.'); console.error(err); }
  }
});
document.addEventListener('input', (e) => { if (e.target.id === 'base-rate') $('#rate-value').textContent = G.money(e.target.value); if (e.target.id === 'quote-rate') $('#quote-value').textContent = G.money(e.target.value); });
$('#sheet-close').onclick = closeSheet;
$('#journal-btn').onclick = () => { if (sim.s.started) journal(); };
$('#map-btn').onclick = () => { if (sim.s.started) places(); };
$('#pause-btn').onclick = () => { if (sim.s.started) pause(); };
$('#settings-btn').onclick = () => { if (sim.s.started) settings(); else kit.menu.open(); };
$('#sound-btn').onclick = () => { sim.s.settings.sound = !sim.s.settings.sound; sim.emit(); soundToggled(); };
function soundToggled() { sfx.setEnabled(sim.s.settings.sound); if (sim.s.settings.sound) sfx.unlock().then(() => sound('success')); }
$('#booking-pill').onclick = () => { if (sim.s.active) dateExitShortcut(); else journal('schedule'); };
$('#interact').onclick = () => interact();
$('#sheet-layer').addEventListener('pointerdown', (e) => { if (e.target.id === 'sheet-layer') closeSheet(); });
// Panels keep keyboard focus inside them; Escape in a text field first lets go of the field.
document.addEventListener('keydown', (e) => {
  if (!sheet) return;
  const editable = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (e.key === 'Escape' && editable) { e.preventDefault(); e.target.blur(); return; }
  if (e.key === 'Tab') { const fs = [...$('#sheet').querySelectorAll('button:not([disabled]):not(.hidden),input,select,textarea')].filter((n) => n.offsetParent !== null); if (fs.length) { const f = fs[0], l = fs.at(-1); if (e.shiftKey && document.activeElement === f) { e.preventDefault(); l.focus(); } else if (!e.shiftKey && document.activeElement === l) { e.preventDefault(); f.focus(); } } }
});
addEventListener('blur', save);
document.addEventListener('visibilitychange', () => { save(); if (!document.hidden && sim.s.started && !sheet) pause(); });
addEventListener('pagehide', save);

// Map labels: buttons over the town that follow the camera.
const labelEls = {};
let labelsVersion = -1, minHomeY = 0;
const _proj = { x: 0, y: 0 };
function labels() {
  $('#labels').innerHTML = G.PLACES.map((p) => `<button class="place-label ${p.id === 'fountain' || p.id === 'market' ? 'hidden' : ''}" data-place="${p.id}" style="--place-color:${p.color}" aria-label="Walk to ${p.name}"><span class="pill">${icon(p.icon)}${p.short}</span></button>`).join('');
  $('#labels').querySelectorAll('button').forEach((b) => { labelEls[b.dataset.place] = b; b.onclick = () => { if (sim.s.started && !sheet) go(b.dataset.place); }; });
  measureLabels(); positionLabels();
}
function measureLabels() { minHomeY = $('#goal').getBoundingClientRect().bottom + 44; }
function positionLabels() {
  labelsVersion = world.viewVersion;
  const W = world.w, H = world.h, portrait = !(W > 850 && W / H > 1.12), zoomed = world.zoom > 1.02;
  for (const p of G.PLACES) {
    const el = labelEls[p.id]; if (!el) continue;
    const q = world.project(p.x, LABEL_HEIGHT[p.id], p.z, _proj);
    let x = q.x, y = q.y, off = false;
    if (zoomed) off = x < -20 || x > W + 20 || y < 30 || y > H + 20;
    else { x = Math.max(32, Math.min(W - 32, x)); if (portrait && p.id === 'home') y = Math.max(y, minHomeY); }
    setStyle(el, 'left', `${Math.round(x)}px`); setStyle(el, 'top', `${Math.round(y)}px`); setStyle(el, 'visibility', off ? 'hidden' : '');
  }
}
let hoverPlace = null, hoverKey = '';
function setHover(place) {
  if (place === hoverPlace) return;
  if (hoverPlace) labelEls[hoverPlace.id]?.classList.remove('hover');
  hoverPlace = place;
  if (place) labelEls[place.id]?.classList.add('hover');
  kit.canvas.style.cursor = place ? 'pointer' : '';
}
function pickPlace(q) { return G.PLACES.find((a) => placeShown(a.id) && Math.hypot(a.x - q.x, a.z - q.z) < 2.1) || null; }
function tapAt(x, y) {
  const q = world.unproject(x, y), selected = pickPlace(q);
  if (selected) go(selected.id);
  else if (world.route(q.x, q.z)) { $('#route-status').classList.add('hidden'); sound(); }
}
// Kit sizes the canvas; the camera framing (and the labels) follow.
kit.onResize((w, h) => { world.resize(w, h); measureLabels(); positionLabels(); });

/* ------------------------------------------------------------ per frame */
let accum = 0, uiClock = 0, saveClock = 0, lastMinute = -1, tapStart = null;
let markerX = '', markerY = '';
const E = { interact: $('#interact'), interactLabel: $('#interact-label'), marker: $('#you-marker'), game: $('#game'), route: $('#route-status'), sheet: $('#sheet'), sheetContent: $('#sheet-content') };
function sheetControls() {
  const inp = kit.input, root = E.sheet;
  pad.update(root, inp.vector('move'), inp.pressed('confirm'));
  if (!sheet) return;
  if ((inp.pressed('back') || inp.pressed('pause')) && sheet.kind !== 'welcome') { closeSheet(); return; }
  const dir = (inp.pressed('zoomIn') ? 1 : 0) - (inp.pressed('zoomOut') ? 1 : 0);
  if (dir) { const tabs = [...root.querySelectorAll('.tabs button')]; const i = tabs.findIndex((t) => t.classList.contains('active')); const next = tabs[i + dir]; if (next) { next.click(); sound(); } }
  const sc = inp.look('scroll');
  if (sc.y) E.sheetContent.scrollTop += sc.y * 260;
}
function playControls(dt) {
  const inp = kit.input, mv = inp.vector('move');
  world.input.x = mv.x; world.input.y = -mv.y;
  if (mv.x || mv.y) E.route.classList.add('hidden');
  if (inp.pressed('interact') || inp.pressed('confirm')) interact();
  else if (inp.pressed('journal')) journal();
  else if (inp.pressed('places')) places();
  else if (inp.pressed('pause') || inp.pressed('breather')) pause();
  if (sheet) return;
  let f = 1; const z = inp.zoom();
  if (z) f *= Math.exp(z * 0.16);
  if (inp.down('zoomIn')) f *= Math.exp(1.3 * dt);
  if (inp.down('zoomOut')) f *= Math.exp(-1.3 * dt);
  if (f !== 1) world.zoomBy(f);
  // Taps and clicks on the town walk there (a drag or a pinch is not a tap).
  const p = inp.pointer;
  if (p.justDown) tapStart = { x: p.x, y: p.y, zoom: world.zoomTarget };
  if (tapStart && Math.abs(world.zoomTarget - tapStart.zoom) > 1e-3) tapStart.zoom = NaN;
  if (p.justUp && tapStart) { const st = tapStart; tapStart = null; if (st.zoom === st.zoom && Math.hypot(p.x - st.x, p.y - st.y) <= 12) tapAt(p.x, p.y); }
  // Mouse hover shows which place a click would visit.
  if (p.type === 'mouse' && p.over) { const key = `${Math.round(p.x)},${Math.round(p.y)},${world.viewVersion}`; if (key !== hoverKey) { hoverKey = key; setHover(pickPlace(world.unproject(p.x, p.y))); } }
  else if (hoverPlace) { hoverKey = ''; setHover(null); }
}
function clockEvents(prev, now) {
  if (!sim.s.started || prev < 0 || now < prev) return;
  if (prev < G.MARKET_OPEN && now >= G.MARKET_OPEN && sim.marketDay()) { toast('The night market is open. Lanterns are up around Fountain square.'); sound('arrive'); }
  if (prev < 1320 && now >= 1320) toast('The workday is over. Head home and start fresh tomorrow.');
}
function frame(dt, t) {
  const s = sim.s;
  if (sheet) sheetControls();
  else if (s.started) playControls(dt);
  const paused = !!sheet || !s.started;
  if (paused) { world.input.x = 0; world.input.y = 0; tapStart = null; if (hoverPlace) setHover(null); }
  world.update(Math.min(dt, 0.05), t, paused);
  s.at = world.nearest()?.id || null;
  if (!paused) { accum += dt; if (accum >= 1) { const m = Math.floor(accum); accum -= m; sim.advance(m, true); uiClock += m; saveClock += m; } }
  if (s.minute !== lastMinute) {
    const prev = lastMinute; lastMinute = s.minute;
    const sky = world.setDaylight(s.minute), g = E.game;
    setStyle(g, '--sky-a', sky[0]); setStyle(g, '--sky-b', sky[1]); setStyle(g, '--sky-c', sky[2]); setStyle(g, '--sky-d', sky[3]);
    syncMarket(); clockEvents(prev, s.minute);
  }
  if (uiClock >= 2) { uiClock = 0; updateHUD(); }
  if (saveClock >= 15) { saveClock = 0; save(); }
  world.updateView(dt);
  if (world.viewVersion !== labelsVersion) positionLabels();
  world.render(t);
  // HUD bits that follow the player.
  const mp = world.project(world.player.x, 1.94, world.player.z, _proj), mx = `${Math.round(mp.x)}px`, my = `${Math.round(mp.y)}px`;
  if (mx !== markerX || my !== markerY) { markerX = mx; markerY = my; E.marker.style.left = mx; E.marker.style.top = my; }
  const n = world.nearest();
  setText(E.interactLabel, n ? (s.active && sim.dateTarget() === n.id ? 'Share a moment' : n.verb) : 'Explore the town');
  const dis = !n || paused; if (E.interact.disabled !== dis) E.interact.disabled = dis;
  if (attentionLive && sheet?.kind === 'date') {
    attentionPos = s.settings.untimed ? 0.5 : (Math.sin((performance.now() - attentionStart) / 900) + 1) / 2;
    const cursor = $('#attention-cursor'); if (cursor) cursor.style.left = `calc(${(attentionPos * 100).toFixed(2)}% - 3px)`;
  }
}

/* ------------------------------------------------------------ prompts that follow the device in use */
function updatePrompts(src) {
  const root = document.documentElement;
  for (const k of ['keyboard', 'gamepad', 'touch']) root.classList.toggle(`gc-src-${k}`, k === src);
  for (const el of document.querySelectorAll('.kbd[data-key]')) setText(el, src === 'gamepad' ? el.dataset.pad : el.dataset.key);
  kit.canvas.setAttribute('aria-label', src === 'touch' ? `Isometric neighborhood. Tap a destination to walk, or drag in the ${stickCorner()} corner to wander.` : 'Isometric neighborhood. Click a destination to walk, or use the arrow keys to wander.');
}
kit.input.onSourceChange((src) => { updatePrompts(src); updateHUD(); });
updatePrompts(kit.input.source);

/* ------------------------------------------------------------ start */
setText($('#engine-label'), `${kit.backendLabel.toUpperCase()} · CHARACTER-LED CAREER SIM`);
connectSim();
if (sim.s.started) restoreWorld(); else syncMarket();
labels(); updateHUD(); syncCompanion();
kit.loading.progress(0.9, 'Setting the table…');
try {
  // Compile every material the town uses, including people and stalls that appear later.
  const hidden = [world.companionAv.group, world.marketMesh, world.lanternMesh, ...world.vendorAvs.map((v) => v.group)].filter((o) => o && !o.visible);
  hidden.forEach((o) => (o.visible = true));
  await kit.renderer.compileAsync(world.scene, world.camera);
  hidden.forEach((o) => (o.visible = false));
} catch (err) {
  console.warn('[good-company] pre-compile skipped:', err);
}
kit.start(frame);
if (!sim.s.started) welcome(); else { updateHUD(); toast('Your story is right where you left it.'); }

// Read-only diagnostics aid acceptance testing without giving UI remote-management shortcuts.
Object.defineProperty(window, 'goodCompany', { value: { get state() { return JSON.parse(sim.serialize()); }, get diagnostics() { return { backend: kit.backend, fps: Math.round(window.__kit?.fps || 0), drawCalls: world.drawCalls, triangles: world.triangles, position: { ...world.player }, nearest: world.nearest()?.id, routeLength: world.path.length, zoom: +world.zoom.toFixed(2), buffer: [kit.canvas.width, kit.canvas.height] }; } }, writable: false });
</script></body></html>
