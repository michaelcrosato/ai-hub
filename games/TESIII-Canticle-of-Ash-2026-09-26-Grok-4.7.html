m:"anumidium_plans",itemName:"anumidium plans"},{id:"mis_091",title:"Restored: Writ for Neloth",cat:"miscellaneous",origin:"addition",uesp:"addition",summary:"A restored writ: the Tong once considered Neloth. The writ was removed. This addition puts it back in your hands, clearly marked as not part of the shipped Tong list.",giver:"eno_hlaalu",giverName:"Eno Hlaalu",at:"vivec",kind:"kill",dest:"sadrith_mora",destName:"Tel Naga",hub:"sadrith_mora",needs:"mis_090",place:"wild",target:"neloth_writ",targetName:"neloth writ"}],Xa={id:"folio_01",title:"The Singer Under the Slip",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Ralosi Pendas, a net-mender in Khuul, hears a drowned fisher still singing under the flooded slip. His last verse can leave by a private rite that opens the sluice, or stay muffled if a neighbor boards that sluice shut.",giver:"folio_01_giver",location:"khuul",stages:[{journal:"Wet hemp cuts Ralosi Pendas's fingers as she works a torn net on the Khuul shingle, and she keeps glancing at the slip as if the water had spoken. A low voice has been singing under the flooded Brine-Latch Boathouse since the last hard tide, four lines and then a stop. She says it is a drowned fisher, not a sign sent for you. Speak with her on this shore before you go down.",complete:{op:"all",of:[{op:"at",location:"khuul"},{op:"talk",npc:"folio_01_giver"}]}},{journal:"Inside the Brine-Latch Boathouse the water stands at the ribs of the racks, green and cold, and the sluice ticks like a slow clock. The verse comes up in broken breaths, too muffled to answer. A salt-ear shell rests among cut net-floats in the flooded workroom. Take it while you are here. Ralosi Pendas has followed you down. Speak with her in the boathouse, shell in hand, and she will let the matter go on.",complete:{op:"all",of:[{op:"at",location:"folio_01_site"},{op:"item",id:"folio_01_shell"},{op:"talk",npc:"folio_01_giver",at:"folio_01_site"}]}},{journal:"The shell fills with a man's voice, hoarse and close, naming a net he never hauled the rest of the way in. Jorund Saltrow is in the water to his chest, a fisher drowned before his neighbors could finish the private rite they keep for their own dead. The last line stays in his mouth until someone in this room decides the sluice. Speak with him here.",complete:{op:"all",of:[{op:"at",location:"folio_01_site"},{op:"talk",npc:"folio_01_singer"}]}},{journal:"Cold air over the sluice smells of tar, wet reed, and fish oil, and Jorund's last line hangs there unfinished. Speak with Tavri Melur if the private rite should be finished: she will cut the latch-cord and open the sluice so the verse leaves with the tide. Speak with Elda Brant if the sluice should be boarded shut, tarred boards nailed across it so the house stays quiet and the singing stays under the water. One talk or the other finishes it, and only this room will keep the result.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"folio_01_rite"}]},{op:"all",of:[{op:"talk",npc:"folio_01_board"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"folio_01_rite"}]},reward:{gold:65,flags:["folio_01_a"],items:[{id:"folio_01_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"folio_01_board"}]},reward:{gold:30,flags:["folio_01_b"],items:[{id:"folio_01_keepsake_b"}]}}]}],sites:[{id:"folio_01_site",name:"Brine-Latch Boathouse",hub:"khuul",place:"interior"}],spawns:[{location:"khuul",npc:"folio_01_giver",name:"Ralosi Pendas"},{location:"folio_01_site",npc:"folio_01_giver",name:"Ralosi Pendas"},{location:"folio_01_site",npc:"folio_01_singer",name:"Jorund Saltrow"},{location:"folio_01_site",npc:"folio_01_rite",name:"Tavri Melur"},{location:"folio_01_site",npc:"folio_01_board",name:"Elda Brant"},{location:"folio_01_site",item:"folio_01_shell",name:"Salt-ear shell"}]},et={id:"folio_02",title:"The Bead in the Wrong Bundle",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"A minor hearth at Erabenimsun Camp has sewn an aunt's burial bead into the wrong cousin's pack. Seralu-Padi wants the bead restored to her bundle. Juben-Padi would trade it for salt.",giver:"folio_02_giver",location:"erabenimsun_camp",stages:[{journal:"Tolmas-Padi mends cords for a minor hearth at Erabenimsun Camp and will not accuse his own kin inside the yurt. His sister Seralu-Padi's burial bead was sewn into cousin Juben-Padi's salt-run pack, and Juben means to trade that bead for salt. Speak with Tolmas-Padi in the camp before you open the pack.",complete:{op:"all",of:[{op:"at",location:"erabenimsun_camp"},{op:"talk",npc:"folio_02_giver"}]}},{journal:"The burial bead is still sewn into Juben-Padi's pack inside the Salt-Cord Tent, the small stitch-room off the camp. Take the bead while you are there. Tolmas-Padi stands at the tent flap. Speak with him there, bead in hand. He will look at it, though he will not cut it free himself.",complete:{op:"all",of:[{op:"at",location:"folio_02_site"},{op:"item",id:"folio_02_bead"},{op:"talk",npc:"folio_02_giver",at:"folio_02_site"}]}},{journal:"Eshara-Padi held the thread when the bead went into the wrong pack. She will say what she saw only inside the Salt-Cord Tent, where the rest of the camp cannot hear. Speak with her there. She knows which bundle the bead was meant for, and whether Juben-Padi still means to sell it for salt.",complete:{op:"all",of:[{op:"at",location:"folio_02_site"},{op:"talk",npc:"folio_02_witness"}]}},{journal:"Eshara-Padi says the bead belongs in Seralu-Padi's burial bundle, and that Juben-Padi will trade it for a sack of salt if nobody stops him. Speak with Seralu-Padi to put the bead back in her bundle. Or speak with Juben-Padi and let the trade stand. If both have already heard you, the aunt's restoration is the branch that is kept.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"folio_02_aunt"}]},{op:"all",of:[{op:"talk",npc:"folio_02_cousin"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"folio_02_aunt"}]},reward:{gold:90,flags:["folio_02_a"],items:[{id:"folio_02_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"folio_02_cousin"}]},reward:{gold:45,flags:["folio_02_b"],items:[{id:"folio_02_keepsake_b"}]}}]}],sites:[{id:"folio_02_site",name:"Salt-Cord Tent",hub:"erabenimsun_camp",place:"interior"}],spawns:[{location:"erabenimsun_camp",npc:"folio_02_giver",name:"Tolmas-Padi"},{location:"erabenimsun_camp",npc:"folio_02_aunt",name:"Seralu-Padi"},{location:"erabenimsun_camp",npc:"folio_02_cousin",name:"Juben-Padi"},{location:"folio_02_site",npc:"folio_02_giver",name:"Tolmas-Padi"},{location:"folio_02_site",npc:"folio_02_witness",name:"Eshara-Padi"},{location:"folio_02_site",item:"folio_02_bead",name:"Burial bead"}]},at={id:"folio_03",title:"Whose Lantern on the Mud",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Two fishers at Hla Oad each claim one brass skiff-lantern, and the dock clerk will not judge the tie. The lamp waits on a mud-stuck skiff beside a witness who saw both of them hang it.",giver:"folio_03_giver",location:"hla_oad",stages:[{journal:"Neris Calo keeps the landing slate at Hla Oad and will not say whose brass skiff-lantern is whose. Brelan Ometh and Vessa Tirn each swear the lamp came off their own hook, and each has already signed the wrong box. Calo says the slate has no column for a tie, and that judging is not in the wage. The lantern is out on a skiff stuck in the mud; go and see it, and bring the dispute nothing but the facts.",complete:{op:"all",of:[{op:"at",location:"hla_oad"},{op:"talk",npc:"folio_03_giver"}]}},{journal:"The brass skiff-lantern hangs on the mud-stuck skiff, crusted with salt and still warm from argument. Two names are scratched in the brass, one cut across the other, and neither scratch looks older. Take the lamp from the hook. Neris Calo has walked out onto the mud. Speak with him on the skiff, lamp in hand, before you ask the man under the hull.",complete:{op:"all",of:[{op:"at",location:"folio_03_site"},{op:"item",id:"folio_03_lantern"},{op:"talk",npc:"folio_03_giver",at:"folio_03_site"}]}},{journal:"Oldo Pask is on the skiff. He watched both fishers hang the lantern, then both of them take it down, then both of them blame the mud. The tide did not steal it, and he will not pick a winner, because picking is how he earned his last black eye. Carry the lamp back to Hla Oad and let one of them pay you to stop listening.",complete:{op:"all",of:[{op:"at",location:"folio_03_site"},{op:"talk",npc:"folio_03_witness"}]}},{journal:"Oldo Pask has had his say, and the brass skiff-lantern is in hand. Speak with Brelan Ometh to give him the claim: he offers 50 gold and calls that fairness. Speak with Vessa Tirn to give her the claim: she offers 80 gold and calls that rent. Neris Calo will write down whichever name you choose and still refuse to call the line a judgment.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"folio_03_fisher_a"}]},{op:"all",of:[{op:"talk",npc:"folio_03_fisher_b"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"folio_03_fisher_a"}]},reward:{gold:50,flags:["folio_03_a"],items:[{id:"folio_03_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"folio_03_fisher_b"}]},reward:{gold:80,flags:["folio_03_b"],items:[{id:"folio_03_keepsake_b"}]}}]}],sites:[{id:"folio_03_site",name:"Mud-Stuck Skiff",hub:"hla_oad",place:"ship"}],spawns:[{location:"hla_oad",npc:"folio_03_giver",name:"Neris Calo"},{location:"folio_03_site",npc:"folio_03_giver",name:"Neris Calo"},{location:"folio_03_site",npc:"folio_03_witness",name:"Oldo Pask"},{location:"hla_oad",npc:"folio_03_fisher_a",name:"Brelan Ometh"},{location:"hla_oad",npc:"folio_03_fisher_b",name:"Vessa Tirn"},{location:"folio_03_site",item:"folio_03_lantern",name:"Brass skiff-lantern"}]},tt={id:"folio_04",title:"The Unsent Supper",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"A tray-runner in Pelagiad has found a supper note the fort cook wrote for the tavern barmaid and then held back. The paper can be carried to her, or burned in the kitchen hearth.",giver:"folio_04_giver",location:"pelagiad",stages:[{journal:"Tavri Bendal waits in Pelagiad with word of a folded scrap she will not read aloud in the street. She carries plates between the tavern and the fort kitchen, and tonight a supper note was still under the bread board when the cook walked out. Speak with her in town before you go up to the kitchen. She will not take the note herself.",complete:{op:"all",of:[{op:"at",location:"pelagiad"},{op:"talk",npc:"folio_04_giver"}]}},{journal:"The unsent supper note lies in the fort kitchen at Pelagiad. Calvus Rett wrote it for Seryne Halvu, the barmaid, and then kept it back. Take the note from where it sits under the bread board. Tavri Bendal has come as far as the doorway. Speak with her in the kitchen, note in hand, before you ask the cook.",complete:{op:"all",of:[{op:"at",location:"folio_04_site"},{op:"item",id:"folio_04_note"},{op:"talk",npc:"folio_04_giver",at:"folio_04_site"}]}},{journal:'The note is in your hands in the fort kitchen, and it is addressed to Seryne Halvu. Calvus Rett writes that she asked him to forget the second cup behind the cask, that he has set her late plate of bitter broth and saltrice cakes every night and eaten it himself before the watch changes, and that he is "only failing at the one kindness you wanted, which was silence." The last line says that if she is reading it, someone else decided his promise was smaller than her hunger. Speak with Calvus here; he will not choose for you.',complete:{op:"all",of:[{op:"at",location:"folio_04_site"},{op:"talk",npc:"folio_04_cook"}]}},{journal:"Calvus cannot send the note and will not watch it burn. Carry it to Seryne Halvu and speak with her if you believe she should know the supper was kept for her, even though it breaks the privacy she asked of him. Or speak with the kitchen hearth and burn the paper if the kinder act is to leave his promise unsent. Either way, the plate will not be set the same tomorrow.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"folio_04_barmaid"}]},{op:"all",of:[{op:"talk",npc:"folio_04_hearth"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"folio_04_barmaid"}]},reward:{gold:60,flags:["folio_04_a"],items:[{id:"folio_04_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"folio_04_hearth"}]},reward:{gold:20,flags:["folio_04_b"],items:[{id:"folio_04_keepsake_b"}]}}]}],sites:[{id:"folio_04_site",name:"Fort Kitchen",hub:"pelagiad",place:"interior"}],spawns:[{location:"pelagiad",npc:"folio_04_giver",name:"Tavri Bendal"},{location:"folio_04_site",npc:"folio_04_giver",name:"Tavri Bendal"},{location:"folio_04_site",npc:"folio_04_cook",name:"Calvus Rett"},{location:"pelagiad",npc:"folio_04_barmaid",name:"Seryne Halvu"},{location:"folio_04_site",npc:"folio_04_hearth",name:"Kitchen hearth"},{location:"folio_04_site",item:"folio_04_note",name:"Unsent supper note"}]},it={id:"folio_05",title:"The Cistern Sick-Chit",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Tienius Lepidus, a fevered trooper, hides in the cistern under Buckmoth Legion Fort. File his sick-chit with the fort clerk so he can stay below until the fever passes, or kill the cistern nix-hound and let that death stand as proof he abandoned his post.",giver:"folio_05_giver",location:"buckmoth_fort",stages:[{journal:"Coryn Sittius waits inside Buckmoth Legion Fort. He is an orderly, not an officer, and he says trooper Tienius Lepidus went down into the cistern with a fever and missed roll. The fever is ordinary, and Coryn will not write the book himself. Speak with Coryn at the fort before you go below.",complete:{op:"all",of:[{op:"at",location:"buckmoth_fort"},{op:"talk",npc:"folio_05_giver"}]}},{journal:"Tienius Lepidus hides in the cistern under the fort, waiting out the fever where the berm watch will not drag him up. He asks you to carry a sick-chit so the roll will mark him ill and leave him below until the fever passes. Speak with him there. A nix-hound dens in the same water, yet killing it is not a step he wants: the carcass would be taken as proof he abandoned his post.",complete:{op:"all",of:[{op:"at",location:"folio_05_site"},{op:"talk",npc:"folio_05_soldier"}]}},{journal:"The sick-chit lies in the cistern, wet but still readable. Take it while you are down here. Coryn Sittius has come down the ladder behind you. Speak with him in the cistern, paper in hand. The fort clerk will file that paper with the hound still alive, so do not treat the beast as a task on the way. Killing the cistern nix-hound is a different ending, and that death alone would close the quest as proof Tienius abandoned his post.",complete:{op:"all",of:[{op:"at",location:"folio_05_site"},{op:"item",id:"folio_05_chit"},{op:"talk",npc:"folio_05_giver",at:"folio_05_site"}]}},{journal:"Speak with clerk Aemilia Carbo and let her file the sick-chit. She will do it so Tienius can stay hidden until the fever passes, and she does not ask you to kill anything first. Or kill the cistern nix-hound and let that death stand as proof he abandoned his post. The kill is an ending by itself, not a key the clerk demands before she will help.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"folio_05_clerk"}]},{op:"all",of:[{op:"dead",npc:"folio_05_foe"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"folio_05_clerk"}]},reward:{gold:75,flags:["folio_05_a"],items:[{id:"folio_05_keepsake_a"}]}},{when:{op:"all",of:[{op:"dead",npc:"folio_05_foe"}]},reward:{gold:140,flags:["folio_05_b"],items:[{id:"folio_05_keepsake_b"}]}}]}],sites:[{id:"folio_05_site",name:"Buckmoth Cistern",hub:"buckmoth_fort",place:"interior"}],spawns:[{location:"buckmoth_fort",npc:"folio_05_giver",name:"Coryn Sittius"},{location:"folio_05_site",npc:"folio_05_giver",name:"Coryn Sittius"},{location:"folio_05_site",npc:"folio_05_soldier",name:"Tienius Lepidus"},{location:"folio_05_site",npc:"folio_05_foe",name:"Cistern nix-hound",hostile:!0,hp:46},{location:"folio_05_site",item:"folio_05_chit",name:"Sick-chit"},{location:"buckmoth_fort",npc:"folio_05_clerk",name:"Aemilia Carbo"}]},nt={id:"folio_06",title:"The Cap That Answered",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"A mushroom cap in a side growing-room of Tel Branora repeats insults it overheard, while a cap-hound guards the voice. Kill the hound and silence the cap, or take lull-spores so the hound sleeps and one kinder line remains.",giver:"folio_06_giver",location:"tel_branora",stages:[{journal:"Brindel Kethys stands in Tel Branora, head tipped toward a side stem, as if the tower had cleared its throat. A hush-keeper by trade, Brindel says a mushroom cap in a side growing-room has begun repeating insults it overheard on the stair. Speak with Brindel here before you go in; a cap-hound guards that room, and Brindel will not follow you past the door.",complete:{op:"all",of:[{op:"at",location:"tel_branora"},{op:"talk",npc:"folio_06_giver"}]}},{journal:"Inside the side growing-room, a pressed echo-rind lies where the cap shed it, still holding the quarrel in its skin. Take the rind while you stand in the room. Brindel Kethys has come as far as the stem door. Speak with Brindel in the growing-room, rind in hand. Mottle, the cap-hound, paces between you and Softmouth, but this step asks only for the rind and that word, not for a fight.",complete:{op:"all",of:[{op:"at",location:"folio_06_site"},{op:"item",id:"folio_06_echo"},{op:"talk",npc:"folio_06_giver",at:"folio_06_site"}]}},{journal:'Stand in the growing-room and speak with Softmouth until the insults run out. Under them the cap keeps one kinder line, spoken smaller, the words "Set the bowl down." The hound still guards the voice, and the cap seems glad someone stayed for the gentle part.',complete:{op:"all",of:[{op:"at",location:"folio_06_site"},{op:"talk",npc:"folio_06_cap"}]}},{journal:"Softmouth is still answering, and Mottle still guards the growing-room. Kill the cap-hound and silence the cap if you want the insults gone and the room mute. Or take the bowl of lull-spores so the hound sleeps and the cap keeps its one kinder line. The galleries will be easier either way, and only the room will remember which you chose.",complete:{op:"any",of:[{op:"all",of:[{op:"dead",npc:"folio_06_foe"}]},{op:"all",of:[{op:"item",id:"folio_06_lull"}]}]},outcomes:[{when:{op:"all",of:[{op:"dead",npc:"folio_06_foe"}]},reward:{gold:160,flags:["folio_06_a"],items:[{id:"folio_06_keepsake_a"}]}},{when:{op:"all",of:[{op:"item",id:"folio_06_lull"}]},reward:{gold:110,flags:["folio_06_b"],items:[{id:"folio_06_keepsake_b"}]}}]}],sites:[{id:"folio_06_site",name:"Softmouth Growing-Room",hub:"tel_branora",place:"interior"}],spawns:[{location:"tel_branora",npc:"folio_06_giver",name:"Brindel Kethys"},{location:"folio_06_site",npc:"folio_06_giver",name:"Brindel Kethys"},{location:"folio_06_site",npc:"folio_06_cap",name:"Softmouth"},{location:"folio_06_site",npc:"folio_06_foe",name:"Mottle the cap-hound",hostile:!0,hp:46},{location:"folio_06_site",item:"folio_06_echo",name:"Pressed echo-rind"},{location:"folio_06_site",item:"folio_06_lull",name:"Bowl of lull-spores"}]},ot={id:"folio_07",title:"Salt on the IOUs",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"A drowned Nord trader left a pouch of neighbor IOUs aboard his coaster at Dagon Fel. Nessira Holt asks you to sink the papers with a tide-priest, so the debts die with the man, or to pay 40 gold toward the smallest claim.",giver:"folio_07_giver",location:"dagon_fel",stages:[{journal:"Nessira Holt keeps the ice-house tally on the Dagon Fel quay. Bram Keelholm, a Nord trader, drowned off his coaster and left a pouch of IOUs in the stern locker. Find Nessira at Dagon Fel and speak with her. She will not spend the paper, and she will not choose who eats the loss.",complete:{op:"all",of:[{op:"at",location:"dagon_fel"},{op:"talk",npc:"folio_07_giver"}]}},{journal:"The pouch lies in the stern locker of the Salt Ledger, Bram Keelholm's coaster, still moored off Dagon Fel. Board the ship and take the pouch of IOUs. The papers are neighbor-debts, not a prize. Nessira Holt has come as far as the rail. Speak with her aboard, pouch in hand, before you hear the smallest claim.",complete:{op:"all",of:[{op:"at",location:"folio_07_site"},{op:"item",id:"folio_07_pouch"},{op:"talk",npc:"folio_07_giver",at:"folio_07_site"}]}},{journal:"Fevyn Sarel sold Bram tarred twine and a lamp he broke. Her claim is the smallest: forty gold. Speak with her on the Salt Ledger and hear that number. She will not take coin on the ship. The rite, later, needs no gold: a tide-priest can put the whole pouch under the water, and the debts die with Bram.",complete:{op:"all",of:[{op:"at",location:"folio_07_site"},{op:"talk",npc:"folio_07_creditor"}]}},{journal:"Choose one ending. Speak with Halven Reed, the tide-priest, and let him sink the pouch. The rite costs nothing, even if your purse already holds forty gold. The debts die with Bram, and you receive fifty gold and a salt-cord. Or find Fevyn Sarel ashore in Dagon Fel and pay her forty gold toward the claim. That coin is taken only if you pay her there. Fifteen gold is returned, and she leaves you the wick-key from the broken lamp. The rite is mercy. The forty is money. There is no third way, and no fight.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"folio_07_priest"}]},{op:"all",of:[{op:"gold",amount:40,consume:!0},{op:"talk",npc:"folio_07_creditor",at:"dagon_fel"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"folio_07_priest"}]},reward:{gold:50,flags:["folio_07_a"],items:[{id:"folio_07_keepsake_a"}]}},{when:{op:"all",of:[{op:"gold",amount:40,consume:!0},{op:"talk",npc:"folio_07_creditor",at:"dagon_fel"}]},reward:{gold:15,flags:["folio_07_b"],items:[{id:"folio_07_keepsake_b"}]}}]}],sites:[{id:"folio_07_site",name:"Salt Ledger",hub:"dagon_fel",place:"ship"}],spawns:[{location:"dagon_fel",npc:"folio_07_giver",name:"Nessira Holt"},{location:"folio_07_site",npc:"folio_07_giver",name:"Nessira Holt"},{location:"folio_07_site",npc:"folio_07_creditor",name:"Fevyn Sarel"},{location:"dagon_fel",npc:"folio_07_creditor",name:"Fevyn Sarel"},{location:"dagon_fel",npc:"folio_07_priest",name:"Halven Reed"},{location:"folio_07_site",item:"folio_07_pouch",name:"Pouch of IOUs"}]},rt={id:"folio_08",title:"The Brand on the Stray",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"A stray guar outside Caldera wears two brands. Fence-warden Vaden Relas wants the older mark read before a rustler takes the animal or a knife settles the yard.",giver:"folio_08_giver",location:"caldera",stages:[{journal:'Vaden Relas stands the stock fence in Caldera and says, "A stray guar came in with two brands, and I will not cut either one." Miners are gathering, and he will not leave his post to judge the hide. Speak with him before the rope is cut.',complete:{op:"all",of:[{op:"at",location:"caldera"},{op:"talk",npc:"folio_08_giver"}]}},{journal:'Two-Mark Flat lies just west of Caldera, where the stray is hitched. Take the charcoal rubbing of the older brand, the healed scar under the fresh burn. Vaden Relas has walked out to the hitching post. Speak with him on the flat, rubbing in hand. He was plain: "Read the old mark. Do not bleed the beast."',complete:{op:"all",of:[{op:"at",location:"folio_08_site"},{op:"item",id:"folio_08_brand"},{op:"talk",npc:"folio_08_giver",at:"folio_08_site"}]}},{journal:'Brevyn Sedri waits on the flat and tells you, "That older brand is mine, and Madal burned his over it last night." Hear him at Two-Mark Flat. Gorvyn Madal is armed nearby, but you do not have to kill him to finish this talk.',complete:{op:"all",of:[{op:"at",location:"folio_08_site"},{op:"talk",npc:"folio_08_herder"}]}},{journal:`The claim is still open. Kill Gorvyn Madal if the rustler's fresh brand is going to end with him. Or show the older rubbing to Fevyn Andas, who keeps the brand book, and let Sedri keep the guar on paper. Andas will say, "If the book holds the old mark, the new burn is theft."`,complete:{op:"any",of:[{op:"all",of:[{op:"dead",npc:"folio_08_foe"}]},{op:"all",of:[{op:"talk",npc:"folio_08_clerk"}]}]},outcomes:[{when:{op:"all",of:[{op:"dead",npc:"folio_08_foe"}]},reward:{gold:130,flags:["folio_08_a"],items:[{id:"folio_08_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"folio_08_clerk"}]},reward:{gold:70,flags:["folio_08_b"],items:[{id:"folio_08_keepsake_b"}]}}]}],sites:[{id:"folio_08_site",name:"Two-Mark Flat",hub:"caldera",place:"wild"}],spawns:[{location:"caldera",npc:"folio_08_giver",name:"Vaden Relas"},{location:"folio_08_site",npc:"folio_08_giver",name:"Vaden Relas"},{location:"folio_08_site",npc:"folio_08_herder",name:"Brevyn Sedri"},{location:"folio_08_site",item:"folio_08_brand",name:"Older brand rubbing"},{location:"folio_08_site",npc:"folio_08_foe",name:"Gorvyn Madal",hostile:!0,hp:46},{location:"caldera",npc:"folio_08_clerk",name:"Fevyn Andas"}]},st={id:"folio_09",title:"The Anklet and the Name",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"A letter-runner in Suran finds his own name on a ticket looped through a dancer anklet he never pledged. Returning the silver can keep that name off a morning copy. Selling the name pays better and costs him the work that feeds him.",giver:"folio_09_giver",location:"suran",stages:[{journal:"Rilos Ondasi waits in Suran with a name that should not be written down. He carries sealed notes between houses, and a ticket in a rented room lists him under a dancer anklet he never pledged. Speak with him in town before you go looking for the silver.",complete:{op:"all",of:[{op:"at",location:"suran"},{op:"talk",npc:"folio_09_giver"}]}},{journal:"The silver anklet lies in the Quiet Pledge Room, a rented interior off a Suran lane, with the ticket still looped through the clasp. Take the anklet from that room. Rilos Ondasi has stepped inside after all, far enough to see the ticket and no farther. Speak with him in the room, anklet in hand, before the name is read aloud in the street.",complete:{op:"all",of:[{op:"at",location:"folio_09_site"},{op:"item",id:"folio_09_anklet"},{op:"talk",npc:"folio_09_giver",at:"folio_09_site"}]}},{journal:"Ylsa Nerethi dances in Suran, and the anklet was hers to pledge. Speak with her before you decide what that written name is worth. She is the one who set the name of Rilos Ondasi on a debt he does not owe.",complete:{op:"all",of:[{op:"talk",npc:"folio_09_dancer"}]}},{journal:"Speak with Hodras Belvyn, the pawn broker, to return the anklet and strike the name. He pays 55 gold, and the cost of that quiet is the larger purse you do not take. Speak with Saevor Tindral, the name-broker, to sell the name from the ticket. He pays 200 gold, and the cost is Rilos Ondasi, who will lose the letter-work that keeps him.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"folio_09_pawn"}]},{op:"all",of:[{op:"talk",npc:"folio_09_broker"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"folio_09_pawn"}]},reward:{gold:55,flags:["folio_09_a"],items:[{id:"folio_09_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"folio_09_broker"}]},reward:{gold:200,flags:["folio_09_b"],items:[{id:"folio_09_keepsake_b"}]}}]}],sites:[{id:"folio_09_site",name:"Quiet Pledge Room",hub:"suran",place:"interior"}],spawns:[{location:"suran",npc:"folio_09_giver",name:"Rilos Ondasi"},{location:"folio_09_site",npc:"folio_09_giver",name:"Rilos Ondasi"},{location:"suran",npc:"folio_09_dancer",name:"Ylsa Nerethi"},{location:"suran",npc:"folio_09_pawn",name:"Hodras Belvyn"},{location:"suran",npc:"folio_09_broker",name:"Saevor Tindral"},{location:"folio_09_site",item:"folio_09_anklet",name:"Pawned silver anklet"}]},lt={id:"folio_10",title:"The Recut Tally",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"In Gnisis, a lamp-tender finds that someone lengthened the tally stick of an eggminer so the notches count for someone else. The stick can be shown to the shift recorder, or recut by a carver so the count is honest and nobody is named.",giver:"folio_10_giver",location:"gnisis",stages:[{journal:"Ithrin Vaden keeps the shift lamps at the mine mouth in Gnisis. He will not close the count for the week while a tally stick hangs longer than the blank he issued. Find him in town and hear which peg held the altered stick.",complete:{op:"all",of:[{op:"at",location:"gnisis"},{op:"talk",npc:"folio_10_giver"}]}},{journal:"The lengthened tally stick hangs in the Peg Gallery, a dry interior cut beside the upper entry of the Gnisis eggmine. It is a stick room, not a nest and not a vent. Take the stick. The scarf joint at the butt shifts the notches Nirasi Telvon cut into the span of another worker on the measuring rule. Ithrin Vaden has come as far as the pegs. Speak with him in the gallery, stick in hand, before the count is argued in town.",complete:{op:"all",of:[{op:"at",location:"folio_10_site"},{op:"item",id:"folio_10_stick"},{op:"talk",npc:"folio_10_giver",at:"folio_10_site"}]}},{journal:"Nirasi Telvon waits in Gnisis, off shift, and the extra length moved the eggs she brought up. She cut the notches, and the joint is not her work. Speak with her before the stick is read or recut. She will say what dignity she wants from the count.",complete:{op:"all",of:[{op:"talk",npc:"folio_10_miner"}]}},{journal:"Nirasi Telvon will not put a name to the hand that lengthened the stick. Speak with Ulvos Merath, the shift recorder, if the splice should be read in the open and her eggs put back on her line. Speak with Daras Drathas, the stick-carver, if the stick should be recut to an honest length and no one named. One conversation settles it.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"folio_10_recorder"}]},{op:"all",of:[{op:"talk",npc:"folio_10_carver"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"folio_10_recorder"}]},reward:{gold:85,flags:["folio_10_a"],items:[{id:"folio_10_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"folio_10_carver"}]},reward:{gold:40,flags:["folio_10_b"],items:[{id:"folio_10_keepsake_b"}]}}]}],sites:[{id:"folio_10_site",name:"Peg Gallery",hub:"gnisis",place:"interior"}],spawns:[{location:"gnisis",npc:"folio_10_giver",name:"Ithrin Vaden"},{location:"folio_10_site",npc:"folio_10_giver",name:"Ithrin Vaden"},{location:"gnisis",npc:"folio_10_miner",name:"Nirasi Telvon"},{location:"gnisis",npc:"folio_10_recorder",name:"Ulvos Merath"},{location:"gnisis",npc:"folio_10_carver",name:"Daras Drathas"},{location:"folio_10_site",item:"folio_10_stick",name:"Lengthened tally stick"}]},dt={id:"folio_11",title:"The Guar That Hummed",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"A pack-guar on the grazing fold outside Vos hums one steady note from a bent brass peg caught in its strap. Ease the peg free so the herd can settle, or let a listener write the pitch down and leave the animal singing.",giver:"folio_11_giver",location:"vos",stages:[{journal:"Meral Tisam binds wickwheat at the edge of Vos and keeps glancing toward the grass. A pack-guar on the Humming Grazing Fold has held one steady note since the rain yesterday, and the rest of the herd walks in time with it. She asks you to find the sound before the animals wander off the grazing line. Speak with her in the village first.",complete:{op:"all",of:[{op:"at",location:"vos"},{op:"talk",npc:"folio_11_giver"}]}},{journal:"The hum is not a throat. On the grazing fold a dun guar stands with a thumb-sized brass peg caught in the strap under its jaw, and the peg sings whenever the wind crosses it. A warm brass curl the animal has already shed lies in the grass. Take that curl so you know you have found the singer. Meral Tisam has walked out from Vos. Speak with her on the fold, curl in hand, before you ask the herder.",complete:{op:"all",of:[{op:"at",location:"folio_11_site"},{op:"item",id:"folio_11_hum"},{op:"talk",npc:"folio_11_giver",at:"folio_11_site"}]}},{journal:"Ulven Fadren holds the other guar upwind of the singer. He can ease the peg out with two fingers and a little saltrice oil, and then the note will stop. A listener on the fold has asked that nobody touch the peg until the pitch is written down. Speak with Ulven before you choose.",complete:{op:"all",of:[{op:"at",location:"folio_11_site"},{op:"talk",npc:"folio_11_herder"}]}},{journal:"The peg is a bent survey marker, or a toy whistle some child jammed into the leather, and it is not stuck in the flesh. Ease it free and carry it off if you want the herd quiet. Or let Ithren Vavyn finish the reed-paper copy and leave the peg in the strap so the fold keeps its one note.",complete:{op:"any",of:[{op:"all",of:[{op:"item",id:"folio_11_peg"}]},{op:"all",of:[{op:"talk",npc:"folio_11_listener"}]}]},outcomes:[{when:{op:"all",of:[{op:"item",id:"folio_11_peg"}]},reward:{gold:95,flags:["folio_11_a"],items:[{id:"folio_11_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"folio_11_listener"}]},reward:{gold:60,flags:["folio_11_b"],items:[{id:"folio_11_keepsake_b"}]}}]}],sites:[{id:"folio_11_site",name:"Humming Grazing Fold",hub:"vos",place:"wild"}],spawns:[{location:"vos",npc:"folio_11_giver",name:"Meral Tisam"},{location:"folio_11_site",npc:"folio_11_giver",name:"Meral Tisam"},{location:"folio_11_site",npc:"folio_11_herder",name:"Ulven Fadren"},{location:"folio_11_site",item:"folio_11_hum",name:"Shed brass curl"},{location:"folio_11_site",item:"folio_11_peg",name:"Bent survey peg"},{location:"folio_11_site",npc:"folio_11_listener",name:"Ithren Vavyn"}]},ht={id:"folio_12",title:"The Mask Used as a Lid",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"A drill-clerk in Molag Mar is missing a cadet practice mask. The mess cook is using it as a pot lid. You may return the mask, or report it lost in the ash so the lid stays on the pot.",giver:"folio_12_giver",location:"molag_mar",stages:[{journal:"Bavyn Sedri keeps the drill pegs at Molag Mar and will not enter the mess steam. A practice mask is missing from the cadet peg. He saw the cook carry it toward the kitchen and asks you to look before the evening count.",complete:{op:"all",of:[{op:"at",location:"molag_mar"},{op:"talk",npc:"folio_12_giver"}]}},{journal:"The practice mask lies on a saltrice pot in the barracks mess kitchen, where it serves as a lid. The wooden lid is split, and ash sifts in through the roof. Take the mask from the pot. Bavyn Sedri has come as far as the steam. Speak with him in the kitchen, mask in hand, before you hear the cook.",complete:{op:"all",of:[{op:"at",location:"folio_12_site"},{op:"item",id:"folio_12_mask"},{op:"talk",npc:"folio_12_giver",at:"folio_12_site"}]}},{journal:"Ilvenu Dras speaks quietly and does not reach for the mask. The pot will not hold a seal without that disk, and the stores will not issue another lid this month. Hear the cook before you choose who keeps it.",complete:{op:"all",of:[{op:"talk",npc:"folio_12_cook"}]}},{journal:"Speak with the cadet Seryn Vaden to put the mask back on the drill peg. Or tell the steward Fevyn Telam that the mask was lost in the ash, and do not name the kitchen, so the cook may keep the lid. Both wait in Molag Mar, and only one account will be taken.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"folio_12_cadet"}]},{op:"all",of:[{op:"talk",npc:"folio_12_steward"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"folio_12_cadet"}]},reward:{gold:45,flags:["folio_12_a"],items:[{id:"folio_12_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"folio_12_steward"}]},reward:{gold:25,flags:["folio_12_b"],items:[{id:"folio_12_keepsake_b"}]}}]}],sites:[{id:"folio_12_site",name:"Barracks Mess Kitchen",hub:"molag_mar",place:"interior"}],spawns:[{location:"molag_mar",npc:"folio_12_giver",name:"Bavyn Sedri"},{location:"folio_12_site",npc:"folio_12_giver",name:"Bavyn Sedri"},{location:"folio_12_site",npc:"folio_12_cook",name:"Ilvenu Dras"},{location:"molag_mar",npc:"folio_12_cadet",name:"Seryn Vaden"},{location:"molag_mar",npc:"folio_12_steward",name:"Fevyn Telam"},{location:"folio_12_site",item:"folio_12_mask",name:"Practice mask"}]},ut=[Xa,et,at,tt,it,nt,ot,rt,st,lt,dt,ht],ct={id:"side_01",title:"The Brass Tide-Weight",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A tide-clerk in Seyda Neen dropped a brass tide-weight into a flooded cellar and waits for it to be brought back.",giver:"side_01_giver",location:"seyda_neen",stages:[{journal:"Dralyn Vess, a tide-clerk, stands in Seyda Neen. He let the brass tide-weight slip from the measuring line into the flooded cellar beneath the customs walk. Speak with him on the shore before you go down.",complete:{op:"all",of:[{op:"at",location:"seyda_neen"},{op:"talk",npc:"side_01_giver"}]}},{journal:"The brass tide-weight lies in the flooded cellar under Seyda Neen. Take it from the water and return it to Dralyn Vess where he waits in the town.",complete:{op:"all",of:[{op:"item",id:"side_01_find"},{op:"at",location:"seyda_neen"},{op:"talk",npc:"side_01_giver"}]},reward:{gold:90,flags:["side_01_done"],items:[{id:"side_01_keepsake"}]}}],sites:[{id:"side_01_site",name:"Flooded Tide Cellar",hub:"seyda_neen",place:"interior"}],spawns:[{location:"seyda_neen",npc:"side_01_giver",name:"Dralyn Vess"},{location:"side_01_site",item:"side_01_find",name:"Brass tide-weight"}]},mt={id:"side_02",title:"Worry on the Fort Road",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A bloated nix-hound worries the fort road outside Pelagiad. End it in a pasture cave and tell the herder.",giver:"side_02_giver",location:"pelagiad",stages:[{journal:"A bloated nix-hound worries the fort road outside Pelagiad. Find the herder Ervas Sedren in town and hear where the beast has gone before you leave.",complete:{op:"all",of:[{op:"at",location:"pelagiad"},{op:"talk",npc:"side_02_giver"}]}},{journal:"The nix-hound dens in a pasture cave off the fort road. End it there. When it is dead, return to Pelagiad and tell Ervas Sedren the road is quiet.",complete:{op:"all",of:[{op:"dead",npc:"side_02_foe"},{op:"at",location:"pelagiad"},{op:"talk",npc:"side_02_giver"}]},reward:{gold:110,flags:["side_02_done"]}}],sites:[{id:"side_02_site",name:"Salt Pasture Cave",hub:"pelagiad",place:"cave"}],spawns:[{location:"pelagiad",npc:"side_02_giver",name:"Ervas Sedren"},{location:"side_02_site",npc:"side_02_foe",name:"Bloated Nix-Hound",hostile:!0,hp:46}]},pt={id:"side_03",title:"Three Lumps from the Odai",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A Balmora potter needs three lumps of Odai clay from a downstream bank.",giver:"side_03_giver",location:"balmora",stages:[{journal:"Virethi Sedas keeps a cold wheel in Balmora. She will shape no vessel until three lumps of clay are taken from the Odai where the river has already passed the town, and brought back to her hands.",complete:{op:"all",of:[{op:"at",location:"balmora"},{op:"talk",npc:"side_03_giver"}]}},{journal:"Follow the Odai downstream of Balmora to the open bank. Lift three lumps of clay from that earth, then return to Virethi Sedas in Balmora and set them in her keeping. She will count them herself.",complete:{op:"all",of:[{op:"item",id:"side_03_pile",qty:3,consume:!0},{op:"at",location:"balmora"},{op:"talk",npc:"side_03_giver"}]},reward:{gold:100,flags:["side_03_done"]}}],sites:[{id:"side_03_site",name:"Downstream Odai bank",hub:"balmora",place:"wild"}],spawns:[{location:"balmora",npc:"side_03_giver",name:"Virethi Sedas"},{location:"side_03_site",item:"side_03_pile",name:"Odai clay"}]},gt={id:"side_04",title:"The Spliced Line",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A net-mender in Hla Oad will splice a broken line once a twine debt of 60 drakes is paid, and gives back a spliced sample plus more coin.",giver:"side_04_giver",location:"hla_oad",stages:[{journal:"Go down to the drying racks at Hla Oad and speak with Malan Virethi, who mends nets on the pilings. Hear the debt before you offer coin. The line stays open until it is named.",complete:{op:"all",of:[{op:"at",location:"hla_oad"},{op:"talk",npc:"side_04_giver"}]}},{journal:"Malan Virethi will splice the line only here in Hla Oad, and only after you pay the twine debt of 60 drakes. Lay the coin in hand. Take back the spliced sample, and the greater sum returned with it.",complete:{op:"all",of:[{op:"gold",amount:60,consume:!0},{op:"at",location:"hla_oad"},{op:"talk",npc:"side_04_giver"}]},reward:{gold:160,flags:["side_04_done"],items:[{id:"side_04_keepsake"}]}}],sites:[],spawns:[{location:"hla_oad",npc:"side_04_giver",name:"Malan Virethi"}]},_t={id:"side_05",title:"The Safe Channel",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. In Gnaar Mok a silent fisher will not name the safe channel until their regard reaches 50. The harbor clerk asks you to win that regard.",giver:"side_05_giver",location:"gnaar_mok",sites:[],spawns:[{location:"gnaar_mok",npc:"side_05_giver",name:"Brevyn Aralen",hostile:!1},{location:"gnaar_mok",npc:"side_05_neighbor",name:"Malae Othren",hostile:!1}],stages:[{journal:"Go to Gnaar Mok and speak with Brevyn Aralen, clerk of the harbor. A silent fisher on the pier will not name the safe channel until their regard reaches 50, and the clerk has asked that you win it.",complete:{op:"all",of:[{op:"at",location:"gnaar_mok"},{op:"talk",npc:"side_05_giver"}]}},{journal:"Brevyn Aralen will not mark the channel. Malae Othren, the silent fisher, will not name the safe water until their regard reaches 50. Earn that regard, hear the channel from them, then return to the harbor clerk in Gnaar Mok.",complete:{op:"all",of:[{op:"disposition",npc:"side_05_neighbor",min:50},{op:"talk",npc:"side_05_neighbor"},{op:"at",location:"gnaar_mok"},{op:"talk",npc:"side_05_giver"}]},reward:{gold:70,flags:["side_05_done"]}}]},ft={id:"side_06",title:"The Unlit Landing",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A cantor in Vivec will not come down from a forgotten waistworks landing. A temple usher asks you to go hear them there.",giver:"side_06_giver",location:"vivec",stages:[{journal:"Usher Selos Vathren speaks quietly in Vivec. A cantor will not come down from a forgotten waistworks landing. The usher asks you to climb the unlit stair above the canal walk and hear them there. Do not call them down. Leave the landing as still as you found it.",complete:{op:"all",of:[{op:"at",location:"vivec"},{op:"talk",npc:"side_06_giver"}]}},{journal:"On the forgotten waistworks landing, Cantor Mirane Othrel remains and will not descend. Hear the verse they keep. They ask no escort back, and the stair is the only way you came.",complete:{op:"all",of:[{op:"at",location:"side_06_site"},{op:"talk",npc:"side_06_witness"}]},reward:{gold:80,flags:["side_06_done"]}}],sites:[{id:"side_06_site",name:"Forgotten Waistworks Landing",hub:"vivec",place:"interior"}],spawns:[{location:"vivec",npc:"side_06_giver",name:"Usher Selos Vathren"},{location:"side_06_site",npc:"side_06_witness",name:"Cantor Mirane Othrel"}]},vt={id:"side_07",title:"The Storeroom Signet",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. An Imperial filing clerk in Ebonheart dropped a signet ring into a storeroom crate. Bring it back.",giver:"side_07_giver",location:"ebonheart",stages:[{journal:"At the filing desk in Ebonheart, hear the clerk. A signet ring fell into a crate in the storeroom off the hall. Take those directions, then go and search the crates.",complete:{op:"all",of:[{op:"at",location:"ebonheart"},{op:"talk",npc:"side_07_giver"}]}},{journal:"The signet ring is in a crate in the Ebonheart storeroom. Take it from the crate and carry it back to the filing clerk in Ebonheart.",complete:{op:"all",of:[{op:"item",id:"side_07_find"},{op:"at",location:"ebonheart"},{op:"talk",npc:"side_07_giver"}]},reward:{gold:90,flags:["side_07_done"],items:[{id:"side_07_keepsake"}]}}],sites:[{id:"side_07_site",name:"Filing storeroom",hub:"ebonheart",place:"interior"}],spawns:[{location:"ebonheart",npc:"side_07_giver",name:"A filing clerk"},{location:"side_07_site",item:"side_07_find",name:"Signet ring"}]},wt={id:"side_08",title:"The Plantation Shed",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A diseased shalk has nested in a Suran plantation shed. Clear it and tell the field hand.",giver:"side_08_giver",location:"suran",stages:[{journal:"A field hand in Suran speaks low of a diseased shalk nested in the plantation shed. Leave the town, enter that shed, and kill the creature. Then return and tell the field hand the nest is ended.",complete:{op:"all",of:[{op:"at",location:"suran"},{op:"talk",npc:"side_08_giver"}]}},{journal:"The diseased shalk is still nested in the plantation shed. Kill it. Come back to Suran and tell the field hand the shed is clear.",complete:{op:"all",of:[{op:"dead",npc:"side_08_foe"},{op:"at",location:"suran"},{op:"talk",npc:"side_08_giver"}]},reward:{gold:110,flags:["side_08_done"]}}],sites:[{id:"side_08_site",name:"Suran plantation shed",hub:"suran",place:"interior"}],spawns:[{location:"suran",npc:"side_08_giver",name:"A field hand"},{location:"side_08_site",npc:"side_08_foe",name:"Diseased shalk",hostile:!0,hp:46}]},kt={id:"side_09",title:"Temper of the Glaze",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A Caldera alchemist needs three eggshell chips from the mine spoil heap to temper a glaze.",giver:"side_09_giver",location:"caldera",stages:[{journal:"In Caldera, a kiln alchemist waits on the street and will not send a note. Stand in town and hear the charge: three eggshell chips, taken from the mine spoil heap, to temper a glaze that plain ash would crack.",complete:{op:"all",of:[{op:"at",location:"caldera"},{op:"talk",npc:"side_09_giver"}]}},{journal:"Leave Caldera for the mine spoil heap. Lift three eggshell chips from the waste, no more than the glaze requires, then return to the alchemist in town and set them in their hands.",complete:{op:"all",of:[{op:"item",id:"side_09_pile",qty:3,consume:!0},{op:"at",location:"caldera"},{op:"talk",npc:"side_09_giver"}]},reward:{gold:100,flags:["side_09_done"]}}],sites:[{id:"side_09_site",name:"Mine spoil heap",hub:"caldera",place:"wild"}],spawns:[{location:"caldera",npc:"side_09_giver",name:"A kiln alchemist"},{location:"side_09_site",item:"side_09_pile",name:"Eggshell chips"}]},yt={id:"side_10",title:"The Scarab-Keeper's Fee",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. Under the Ald'ruhn skar, a scarab-keeper lost the fee to re-hide a shell.",giver:"side_10_giver",location:"ald_ruhn",stages:[{journal:"Under the Ald'ruhn skar, a scarab-keeper waits in the dust and will not call the loss into the street. Stand in Ald'ruhn and speak with them. Hear, in solemn quiet, that a shell still lies uncovered because the fee to hide it again is gone.",complete:{op:"all",of:[{op:"at",location:"ald_ruhn"},{op:"talk",npc:"side_10_giver"}]}},{journal:"Pay the scarab-keeper seventy drakes beneath the Ald'ruhn skar. The coin is the whole of the rite: with it the shell is covered again, and without it the hiding fails. Bring the gold to Ald'ruhn and speak the payment plainly. Do not bargain, and do not ask the keeper to name the grave.",complete:{op:"all",of:[{op:"gold",amount:70,consume:!0},{op:"at",location:"ald_ruhn"},{op:"talk",npc:"side_10_giver"}]},reward:{gold:170,flags:["side_10_done"],items:[{id:"side_10_keepsake"}]}}],sites:[],spawns:[{location:"ald_ruhn",npc:"side_10_giver",name:"A scarab-keeper"}]},bt={id:"side_11",title:"The Safe Ash Road",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A shrine attendant at Maar Gan asks you to earn a pilgrim’s regard, for that pilgrim will not share the safe ash road until it stands at 50.",giver:"side_11_giver",location:"maar_gan",sites:[],spawns:[{location:"maar_gan",npc:"side_11_giver",name:"Shrine attendant Ilveth"},{location:"maar_gan",npc:"side_11_neighbor",name:"Pilgrim Nenmu"}],stages:[{journal:"Shrine attendant Ilveth keeps the lamps at Maar Gan and will not send you out unguided. A pilgrim beside the shrine will not share the safe ash road until their regard for you is 50. Speak with the pilgrim. Do not press. Let the words be plain, and return only when that regard is earned.",complete:{op:"all",of:[{op:"at",location:"maar_gan"},{op:"talk",npc:"side_11_giver"}]}},{journal:"Pilgrim Nenmu shares the safe ash road only when their regard is 50. Hear it, then repeat it to the shrine attendant at Maar Gan: keep the packed track between the shrine and the outer stones, leave the ridge of the foyada on your left, and do not cut the ash plain when the wind turns. Walk until the red hill falls behind you. Do not leave the track for a shorter way.",complete:{op:"all",of:[{op:"disposition",npc:"side_11_neighbor",min:50},{op:"talk",npc:"side_11_neighbor"},{op:"at",location:"maar_gan"},{op:"talk",npc:"side_11_giver"}]},reward:{gold:70,flags:["side_11_done"]}}]},Nt={id:"side_12",title:"The Vent Overlook",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A miner in Gnisis asks you to hear a kwama-widow who waits on a vent overlook and will not come into town.",giver:"side_12_giver",location:"gnisis",stages:[{journal:"A miner in Gnisis stops you short of the gate. His kin by marriage keeps a vigil on the vent overlook, where the crust breathes warm ash, and she will not come into town. Leave the houses behind you. Walk the pale ground until the rock opens a lip above the steam. Stand there and hear her. Bring nothing back but the fact that you listened.",complete:{op:"all",of:[{op:"at",location:"gnisis"},{op:"talk",npc:"side_12_giver"}]}},{journal:"The kwama-widow is still on the vent overlook outside Gnisis. Steam rises under her feet, and the town is behind you. She will not cross the gate. Speak with her and let her say what the street was not allowed to hear. Do not lead her back. Hearing her finishes the errand.",complete:{op:"all",of:[{op:"at",location:"side_12_site"},{op:"talk",npc:"side_12_witness"}]},reward:{gold:80,flags:["side_12_done"]}}],sites:[{id:"side_12_site",name:"Vent Overlook",hub:"gnisis",place:"wild"}],spawns:[{location:"gnisis",npc:"side_12_giver",name:"A miner"},{location:"side_12_site",npc:"side_12_witness",name:"A kwama-widow"}]},Mt={id:"side_13",title:"The Cedar Peg",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A fish-drying rack in Khuul lost its cedar peg in a shack on the point. Bring it back.",giver:"side_13_giver",location:"khuul",stages:[{journal:"A rack-keeper stands by the fish-drying racks in Khuul. One rack will not hold until its cedar peg is returned. Speak with the keeper here before you leave the shore.",complete:{op:"all",of:[{op:"at",location:"khuul"},{op:"talk",npc:"side_13_giver"}]}},{journal:"The cedar peg lies in a shack on the point, salt-stiff and still cut for the rack. Take it from that interior. Return to Khuul and give it to the rack-keeper. No other wood will serve.",complete:{op:"all",of:[{op:"item",id:"side_13_find"},{op:"at",location:"khuul"},{op:"talk",npc:"side_13_giver"}]},reward:{gold:90,flags:["side_13_done"],items:[{id:"side_13_keepsake"}]}}],sites:[{id:"side_13_site",name:"Shack on the Point",hub:"khuul",place:"interior"}],spawns:[{location:"khuul",npc:"side_13_giver",name:"A rack-keeper"},{location:"side_13_site",item:"side_13_find",name:"cedar peg"}]},St={id:"side_14",title:"The Scrib on the Shrine Stair",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A daedra-touched scrib blocks the shrine stair at Ald Velothi. Clear it for the stair-keeper.",giver:"side_14_giver",location:"ald_velothi",stages:[{journal:"Go to Ald Velothi and speak with the stair-keeper. The shrine steps are closed: a daedra-touched scrib has settled on them, and the keeper will not ask the village to pass while it remains.",complete:{op:"all",of:[{op:"at",location:"ald_velothi"},{op:"talk",npc:"side_14_giver"}]}},{journal:"The stair-keeper bids you clear the shrine stair. Kill the daedra-touched scrib that blocks it, then return to Ald Velothi and tell the stair-keeper the way is open again.",complete:{op:"all",of:[{op:"dead",npc:"side_14_foe"},{op:"at",location:"ald_velothi"},{op:"talk",npc:"side_14_giver"}]},reward:{gold:110,flags:["side_14_done"]}}],sites:[{id:"side_14_site",name:"Shrine stair",hub:"ald_velothi",place:"daedric"}],spawns:[{location:"ald_velothi",npc:"side_14_giver",name:"A stair-keeper"},{location:"side_14_site",npc:"side_14_foe",name:"Daedra-touched scrib",hostile:!0,hp:46}]},Tt={id:"side_15",title:"Fence-Ash for the Ward",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A smith at Ghostgate needs three pinches of fence-ash from the walk outside the gate to set a ward.",giver:"side_15_giver",location:"ghostgate",sites:[{id:"side_15_site",name:"Walk outside the gate",hub:"ghostgate",place:"wild"}],spawns:[{location:"ghostgate",npc:"side_15_giver",name:"A ward-smith"},{location:"side_15_site",item:"side_15_pile",name:"fence-ash"}],stages:[{journal:"At Ghostgate a smith, written in no roll, asks to be heard. He will not set the ward until three pinches of fence-ash are in his hands. The ash waits on the walk outside the gate.",complete:{op:"all",of:[{op:"at",location:"ghostgate"},{op:"talk",npc:"side_15_giver"}]}},{journal:"Take three pinches from the fence-ash on the walk outside Ghostgate. Return them to the smith at the gate. Only then will he set the ward. Bring no less, and leave none behind.",complete:{op:"all",of:[{op:"item",id:"side_15_pile",qty:3,consume:!0},{op:"at",location:"ghostgate"},{op:"talk",npc:"side_15_giver"}]},reward:{gold:100,flags:["side_15_done"]}}]},At={id:"side_16",title:"The Skiff Rib",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A boatwright at Dagon Fel will fit a repaired skiff rib if you pay fifty drakes.",giver:"side_16_giver",location:"dagon_fel",sites:[],spawns:[{location:"dagon_fel",npc:"side_16_giver",name:"A boatwright"}],stages:[{journal:"On the stone quay at Dagon Fel, find the boatwright who keeps a repaired skiff rib under oilcloth. Speak with them and hear the terms. They will not set the rib until the coin is named and counted.",complete:{op:"all",of:[{op:"at",location:"dagon_fel"},{op:"talk",npc:"side_16_giver"}]}},{journal:"Return to the boatwright at Dagon Fel with fifty drakes in hand. Pay them, and they will fit the repaired skiff rib. When the work is done, take the keepsake they press into your palm and leave the quay.",complete:{op:"all",of:[{op:"gold",amount:50,consume:!0},{op:"at",location:"dagon_fel"},{op:"talk",npc:"side_16_giver"}]},reward:{gold:140,flags:["side_16_done"],items:[{id:"side_16_keepsake"}]}}]},Ct={id:"side_17",title:"Direction Through the Pads",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A path-warden in Vos asks you to earn a mushroom-tender’s regard of fifty before they will name a way through the pads.",giver:"side_17_giver",location:"vos",sites:[],spawns:[{location:"vos",npc:"side_17_giver",name:"Serath Volen"},{location:"vos",npc:"side_17_neighbor",name:"Ithren Saloth"}],stages:[{journal:"Serath Volen, path-warden of Vos, will not name the way. The mushroom-tender Ithren Saloth gives a direction through the pads only after their regard reaches fifty. Earn that regard, hear the way, and return.",complete:{op:"all",of:[{op:"at",location:"vos"},{op:"talk",npc:"side_17_giver"}]}},{journal:"Ithren Saloth tends the pads at Vos. Speak with them only once their regard is fifty or more, take the solemn direction they give, and return to the path-warden Serath Volen, still in Vos.",complete:{op:"all",of:[{op:"disposition",npc:"side_17_neighbor",min:50},{op:"talk",npc:"side_17_neighbor"},{op:"at",location:"vos"},{op:"talk",npc:"side_17_giver"}]},reward:{gold:70,flags:["side_17_done"]}}]},xt={id:"side_18",title:"The Servant Who Will Not Descend",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A servant at Tel Mora will speak only from a high balcony and will not come down. The door-keeper asks you to go up.",giver:"side_18_giver",location:"tel_mora",stages:[{journal:"Stand at Tel Mora and speak with Ilveth the door-keeper. He keeps the lower door and will not climb. A servant above will speak only from the high balcony and will not come down. Hear the door-keeper, then take the stair he names.",complete:{op:"all",of:[{op:"at",location:"tel_mora"},{op:"talk",npc:"side_18_giver"}]}},{journal:"The door-keeper has given the way and will not go with you. Climb to the high balcony. Nereth the servant will speak only from there and will not come down. Do not call them to the stair. Stand where they stand, and hear them.",complete:{op:"all",of:[{op:"at",location:"side_18_site"},{op:"talk",npc:"side_18_witness"}]},reward:{gold:80,flags:["side_18_done"]}}],sites:[{id:"side_18_site",name:"High Balcony",hub:"tel_mora",place:"tower"}],spawns:[{location:"tel_mora",npc:"side_18_giver",name:"Ilveth the Door-keeper"},{location:"side_18_site",npc:"side_18_witness",name:"Nereth the Balcony Servant"}]},Ht={id:"side_19",title:"The Cracked Gem Below",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A steward of Tel Vos asks you to bring up a cracked soul gem from a lower root, the stone an apprentice was forbidden to touch.",giver:"side_19_giver",location:"tel_vos",stages:[{journal:"At Tel Vos, the tower steward speaks without haste. An apprentice was forbidden to touch a cracked soul gem left in a lower root. The steward will not send that apprentice down, and asks you to bring the gem up.",complete:{op:"all",of:[{op:"at",location:"tel_vos"},{op:"talk",npc:"side_19_giver"}]}},{journal:"Descend into the lower root of Tel Vos, where the tower’s flesh grows thin and the air holds old magic. The cracked soul gem lies where it was left. Take it. Do not leave it for the apprentice who was forbidden to touch it. Carry it back to the steward at Tel Vos.",complete:{op:"all",of:[{op:"item",id:"side_19_find"},{op:"at",location:"tel_vos"},{op:"talk",npc:"side_19_giver"}]},reward:{gold:90,flags:["side_19_done"],items:[{id:"side_19_keepsake"}]}}],sites:[{id:"side_19_site",name:"Lower root",hub:"tel_vos",place:"tower"}],spawns:[{location:"tel_vos",npc:"side_19_giver",name:"A tower steward"},{location:"side_19_site",item:"side_19_find",name:"Cracked soul gem"}]},Dt={id:"side_20",title:"The Slipped Hound",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A hound slipped the pens under Tel Aruhn and lairs in a side cave. The pen-keeper asks you to end it.",giver:"side_20_giver",location:"tel_aruhn",stages:[{journal:"Under Tel Aruhn the pen-keeper keeps the lower pens. A hound has slipped them and gone to ground in a side cave. Speak with the keeper in Tel Aruhn if you will take the solemn work of ending it.",complete:{op:"all",of:[{op:"at",location:"tel_aruhn"},{op:"talk",npc:"side_20_giver"}]}},{journal:"The hound lairs in the side cave beneath the pens. End it there. When it is dead, return to the pen-keeper in Tel Aruhn and say the thing is done.",complete:{op:"all",of:[{op:"dead",npc:"side_20_foe"},{op:"at",location:"tel_aruhn"},{op:"talk",npc:"side_20_giver"}]},reward:{gold:110,flags:["side_20_done"]}}],sites:[{id:"side_20_site",name:"Side cave under the pens",hub:"tel_aruhn",place:"cave"}],spawns:[{location:"tel_aruhn",npc:"side_20_giver",name:"Pen-keeper"},{location:"side_20_site",npc:"side_20_foe",name:"Slipped hound",hostile:!0,hp:46}]},Rt={id:"side_21",title:"Corks from the Drowned Cellar",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A cellar-keeper in Sadrith Mora needs three corks of spore-wine from a drowned cellar under the docks.",giver:"side_21_giver",location:"sadrith_mora",sites:[{id:"side_21_site",name:"Drowned Cellar",hub:"sadrith_mora",place:"interior"}],spawns:[{location:"sadrith_mora",npc:"side_21_giver",name:"A cellar-keeper"},{location:"side_21_site",item:"side_21_pile",name:"spore-wine corks"}],stages:[{journal:"In Sadrith Mora, a cellar-keeper keeps spore-wine beneath the docks. The tide took the lower stair and left three corks in the drowned cellar. Speak with the keeper in town. The door is under the docks, unmarked, and the water inside is not to be tasted.",complete:{op:"all",of:[{op:"at",location:"sadrith_mora"},{op:"talk",npc:"side_21_giver"}]}},{journal:"Descend into the drowned cellar under the Sadrith Mora docks. From the pile there, take three corks of spore-wine and no more. Carry them back to the cellar-keeper in Sadrith Mora. The bottles stay where the water left them.",complete:{op:"all",of:[{op:"item",id:"side_21_pile",qty:3,consume:!0},{op:"at",location:"sadrith_mora"},{op:"talk",npc:"side_21_giver"}]},reward:{gold:100,flags:["side_21_done"]}}]},Bt={id:"side_22",title:"The Sealed Note",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A porter at Tel Fyr will carry a sealed note you are not allowed to read if you pay 80 drakes.",giver:"side_22_giver",location:"tel_fyr",sites:[],stages:[{journal:"At Tel Fyr, find the porter who waits with a sealed note. Speak with them. You are not allowed to open it or read what is written inside. Hear the price, and do not pay until you are ready to let the note leave your hands.",complete:{op:"all",of:[{op:"at",location:"tel_fyr"},{op:"talk",npc:"side_22_giver"}]}},{journal:"Pay the porter 80 drakes at Tel Fyr and speak with them again. They will carry the sealed note. Leave the seal unbroken. Do not read it. When the errand is finished, a keepsake remains where the note was.",complete:{op:"all",of:[{op:"gold",amount:80,consume:!0},{op:"at",location:"tel_fyr"},{op:"talk",npc:"side_22_giver"}]},reward:{gold:180,flags:["side_22_done"],items:[{id:"side_22_keepsake"}]}}],spawns:[{location:"tel_fyr",npc:"side_22_giver",name:"A tower porter"}]},Qt={id:"side_23",title:"Salt in the Tower Kitchen",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A steward of Tel Branora asks you to win the tower cook’s regard. The kitchen will not admit it is short of salt until that regard is fifty.",giver:"side_23_giver",location:"tel_branora",stages:[{journal:"In Tel Branora, speak with the tower steward. The cook who keeps the kitchen will not admit the stores are short of salt until their regard for you is fifty. Win that regard, hear the shortage named, then return and tell the steward.",complete:{op:"all",of:[{op:"at",location:"tel_branora"},{op:"talk",npc:"side_23_giver"}]}},{journal:"The cook’s regard is high enough that the shortage may be spoken. Stand in Tel Branora and tell the steward the kitchen is short of salt.",complete:{op:"all",of:[{op:"disposition",npc:"side_23_neighbor",min:50},{op:"talk",npc:"side_23_neighbor"},{op:"at",location:"tel_branora"},{op:"talk",npc:"side_23_giver"}]},reward:{gold:70,flags:["side_23_done"]}}],sites:[],spawns:[{location:"tel_branora",npc:"side_23_giver",name:"A tower steward"},{location:"tel_branora",npc:"side_23_neighbor",name:"A tower cook"}]},Et={id:"side_24",title:"The Pilgrim on the Lip",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A pilgrim waits on the foyada lip above Molag Mar and will not enter the town. A gate-warden asks you to speak with them there.",giver:"side_24_giver",location:"molag_mar",stages:[{journal:"The gate-warden at Molag Mar keeps the gate and will not climb. A pilgrim stands on the foyada lip above the town and will not come down into it. Leave by the ash path above the gate, keep the molten cut on your left, and speak with them where the wind breaks on the lip. Do not lead them into the town.",complete:{op:"all",of:[{op:"at",location:"molag_mar"},{op:"talk",npc:"side_24_giver"}]}},{journal:"The pilgrim on the foyada lip heard you and will not enter Molag Mar. Their word is given. The gate-warden’s errand is finished.",complete:{op:"all",of:[{op:"at",location:"side_24_site"},{op:"talk",npc:"side_24_witness"}]},reward:{gold:80,flags:["side_24_done"]}}],sites:[{id:"side_24_site",name:"Foyada Lip",hub:"molag_mar",place:"wild"}],spawns:[{location:"molag_mar",npc:"side_24_giver",name:"A gate-warden"},{location:"side_24_site",npc:"side_24_witness",name:"A pilgrim"}]},Ft={id:"side_25",title:"The Wind-Break Flute",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A child's bone flute was left at a wind-break outside the Urshilaku camp. An aunt at the camp asks you to bring it back.",giver:"side_25_giver",location:"urshilaku_camp",stages:[{journal:"Aunt Yenammu waits at the Urshilaku camp, where the yurt-ropes hum in the ash-wind. A child of her hearth set a bone flute on the wind-break outside the camp and did not return for it. She asks you, solemnly, to walk out to that low wall of hide and stone, lift the flute from the ash, and bring it back to her hands. She will not send the child into that weather.",complete:{op:"all",of:[{op:"at",location:"urshilaku_camp"},{op:"talk",npc:"side_25_giver"}]}},{journal:"The bone flute lies at the wind-break outside the Urshilaku camp. Take it up and bring it back to Aunt Yenammu in the camp. She will know it by the notch a small hand wore into the bone.",complete:{op:"all",of:[{op:"item",id:"side_25_find"},{op:"at",location:"urshilaku_camp"},{op:"talk",npc:"side_25_giver"}]},reward:{gold:90,flags:["side_25_done"],items:[{id:"side_25_keepsake"}]}}],sites:[{id:"side_25_site",name:"Urshilaku wind-break",hub:"urshilaku_camp",place:"wild"}],spawns:[{location:"urshilaku_camp",npc:"side_25_giver",name:"Aunt Yenammu"},{location:"side_25_site",item:"side_25_find",name:"child's bone flute"}]},Gt={id:"side_26",title:"The Hollow Takes Calves",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A wounded cliff racer lairs in a hollow near the Ahemmusa camp and has been taking guar calves. A herder asks you to end it.",giver:"side_26_giver",location:"ahemmusa_camp",stages:[{journal:"A herder at the Ahemmusa camp speaks without raising her voice. A wounded cliff racer has taken a hollow near the yurts and has been taking guar calves. She asks you to end it. Walk out from the camp, find the hollow, and do not leave the beast to feed again.",complete:{op:"all",of:[{op:"at",location:"ahemmusa_camp"},{op:"talk",npc:"side_26_giver"}]}},{journal:"The hollow lies near the Ahemmusa camp, where the wounded cliff racer lairs and the guar calves have been taken. Kill it. When it is dead, return to the herder at the camp and tell her the herd can rest.",complete:{op:"all",of:[{op:"dead",npc:"side_26_foe"},{op:"at",location:"ahemmusa_camp"},{op:"talk",npc:"side_26_giver"}]},reward:{gold:110,flags:["side_26_done"]}}],sites:[{id:"side_26_site",name:"Calf Hollow",hub:"ahemmusa_camp",place:"wild"}],spawns:[{location:"ahemmusa_camp",npc:"side_26_giver",name:"A herder"},{location:"side_26_site",npc:"side_26_foe",name:"Wounded Cliff Racer",hostile:!0,hp:46}]},jt={id:"side_27",title:"The Drying Frame",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A hide-worker at the Zainab camp needs three beads of guar-hide polish from a drying frame out on the grass.",giver:"side_27_giver",location:"zainab_camp",stages:[{journal:"A hide-worker waits at the Zainab camp, solemn among the yurts. Stand in the camp and speak with that worker. The way onto the grass is not given until those words are heard.",complete:{op:"all",of:[{op:"at",location:"zainab_camp"},{op:"talk",npc:"side_27_giver"}]}},{journal:"Out on the grass a drying frame holds beads of guar-hide polish. Take three beads from the pile. Return to the Zainab camp and speak again with the hide-worker, and do not come back with fewer than three.",complete:{op:"all",of:[{op:"item",id:"side_27_pile",qty:3,consume:!0},{op:"at",location:"zainab_camp"},{op:"talk",npc:"side_27_giver"}]},reward:{gold:100,flags:["side_27_done"]}}],sites:[{id:"side_27_site",name:"Drying Frame",hub:"zainab_camp",place:"wild"}],spawns:[{location:"zainab_camp",npc:"side_27_giver",name:"A hide-worker"},{location:"side_27_site",item:"side_27_pile",name:"Beads of guar-hide polish"}]},Lt={id:"side_28",title:"The Broken Pole",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. At the Erabenimsun camp a tent-mender wants 60 drakes for a broken pole and gives you a stitched charm in return.",giver:"side_28_giver",location:"erabenimsun_camp",sites:[],spawns:[{location:"erabenimsun_camp",npc:"side_28_giver",name:"A tent-mender"}],stages:[{journal:"Walk the ash to the Erabenimsun camp. A tent-mender waits among the yurts with a snapped pole across their knees. Speak with them there, and do not raise the matter across the wind.",complete:{op:"all",of:[{op:"at",location:"erabenimsun_camp"},{op:"talk",npc:"side_28_giver"}]}},{journal:"The tent-mender needs 60 drakes to set a new pole where the old one broke. Pay them in person at the Erabenimsun camp. They will press a small charm, stitched from hide scrap, into your hand.",complete:{op:"all",of:[{op:"gold",amount:60,consume:!0},{op:"at",location:"erabenimsun_camp"},{op:"talk",npc:"side_28_giver"}]},reward:{gold:150,flags:["side_28_done"],items:[{id:"side_28_keepsake"}]}}]},Vt={id:"side_29",title:"The Night Pantry",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. The night cook at Moonmoth Legion Fort will not open the pantry until their regard is 50. A quartermaster asks you to earn it.",giver:"side_29_giver",location:"moonmoth_fort",sites:[],spawns:[{location:"moonmoth_fort",npc:"side_29_giver",name:"A quartermaster"},{location:"moonmoth_fort",npc:"side_29_neighbor",name:"The night cook"}],stages:[{journal:"Stand in Moonmoth Legion Fort and speak with the quartermaster. The night pantry stays shut. The night cook will not lift the bar until their regard is 50. Take the errand here, and do not seek it in any other hall.",complete:{op:"all",of:[{op:"at",location:"moonmoth_fort"},{op:"talk",npc:"side_29_giver"}]}},{journal:"Remain at Moonmoth Legion Fort. Speak with the night cook and raise their regard to 50. Only then will the pantry open. When that regard is earned, return to the quartermaster in the same fort and tell them the bar is lifted.",complete:{op:"all",of:[{op:"disposition",npc:"side_29_neighbor",min:50},{op:"talk",npc:"side_29_neighbor"},{op:"at",location:"moonmoth_fort"},{op:"talk",npc:"side_29_giver"}]},reward:{gold:70,flags:["side_29_done"]}}]},Pt={id:"side_30",title:"The Ash Berm Report",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A scout at Buckmoth will give a report only from the ash berm, not inside the fort. The gate sergeant asks you to meet them there.",giver:"side_30_giver",location:"buckmoth_fort",stages:[{journal:"At Buckmoth Legion Fort, speak with the gate sergeant. A scout will give a report only from the ash berm beyond the gate, never inside the walls. The sergeant asks you to leave the fort and meet the scout on that open ground.",complete:{op:"all",of:[{op:"at",location:"buckmoth_fort"},{op:"talk",npc:"side_30_giver"}]}},{journal:"Stand on the ash berm outside Buckmoth and speak with the scout. They give the report only there, not within the fort. Hear it on the berm, and the errand is done.",complete:{op:"all",of:[{op:"at",location:"side_30_site"},{op:"talk",npc:"side_30_witness"}]},reward:{gold:80,flags:["side_30_done"]}}],sites:[{id:"side_30_site",name:"Ash Berm",hub:"buckmoth_fort",place:"wild"}],spawns:[{location:"buckmoth_fort",npc:"side_30_giver",name:"A gate sergeant"},{location:"side_30_site",npc:"side_30_witness",name:"A berm scout"}]},zt={id:"side_31",title:"The Cellar Index",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"An original errand, not from any guide. A mage at Wolverine Hall lost an index card in the hall cellar and cannot catalog without it. Bring the card back.",giver:"side_31_giver",location:"wolverine_hall",sites:[{id:"side_31_site",name:"Wolverine Hall Cellar",hub:"wolverine_hall",place:"interior"}],spawns:[{location:"wolverine_hall",npc:"side_31_giver",name:"Tevyn Sarel"},{location:"side_31_site",item:"side_31_find",name:"index card"}],stages:[{journal:"Tevyn Sarel keeps the catalog at Wolverine Hall. An index card is missing in the hall cellar, and the catalog cannot go on without it. Go down into the cellar, take up the card, and bring it back to the mage.",complete:{op:"all",of:[{op:"at",location:"wolverine_hall"},{op:"talk",npc:"side_31_giver"}]}},{journal:"The index card lies in the cellar under Wolverine Hall. Recover it and return it to Tevyn Sarel in the hall. Until that card is in the mage’s hands, the catalog stays unfinished.",complete:{op:"all",of:[{op:"item",id:"side_31_find"},{op:"at",location:"wolverine_hall"},{op:"talk",npc:"side_31_giver"}]},reward:{gold:90,flags:["side_31_done"],items:[{id:"side_31_keepsake"}]}}]},qt=[ct,mt,pt,gt,_t,ft,vt,wt,kt,yt,bt,Nt,Mt,St,Tt,At,Ct,xt,Ht,Dt,Rt,Bt,Qt,Et,Ft,Gt,jt,Lt,Vt,Pt,zt],It={id:"wave_01",title:"The Ledger of No Consequence",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Tullia Marn, a copy-runner in Seyda Neen, needs an outsider to carry a drowned customs ledger into a quarrel between two minor Imperial clerks. The page lists only spoiled fish oil the Empire has already condemned, and the argument is about their signatures, not the duty.",giver:"wave_01_giver",location:"seyda_neen",stages:[{journal:"Tullia Marn keeps to the walk in Seyda Neen, roster closed against her chest, cuffs marked with ink that is not hers. Two minor Imperial clerks have halted over a drowned customs ledger, a page that lists spoiled fish oil the Empire already condemned, and pride is the only duty either of them will admit is left on it. Speak with her here in town. She will not step into the annex, and she will not put your name on anything, until you have heard the stall from her own mouth.",complete:{op:"all",of:[{op:"at",location:"seyda_neen"},{op:"talk",npc:"wave_01_giver",at:"seyda_neen"}]}},{journal:"Rain crossed a cracked cistern lip and settled in the Spare Drawer Annex, and the drowned customs ledger lies in that spare drawer with the lines still readable under the run of ink. It names three barrels of fish oil already marked condemned, a record no office above this room was waiting to see. Tullia Marn has come into the annex with you. Take the ledger, then speak with her here, and she will show you which two signatures are treating a blot as a question of rank.",complete:{op:"all",of:[{op:"at",location:"wave_01_site"},{op:"item",id:"wave_01_find"},{op:"talk",npc:"wave_01_giver",at:"wave_01_site"}]}},{journal:"Quintus Barrow stands on the dry boards of the Spare Drawer Annex, tally slate turned flat so a drip cannot become a new line. He watched the cistern lip give at noon and the spare drawer take the water, and he has already said as much to both clerks, who heard a different quarrel. Speak with him in this room. He will tell you the drowned ledger held no sum the Empire was still owed, and that the noise is only about who gets to have stored the page correctly.",complete:{op:"all",of:[{op:"at",location:"wave_01_site"},{op:"talk",npc:"wave_01_witness",at:"wave_01_site"}]}},{journal:"Holding the wet page up to the lamp will not give it a consequence. Speak with Adeodatus Vell in the Spare Drawer Annex if the drowned ledger should be struck as moisture loss and dropped out of the sequence. Speak with Hateria Sullo in this same room if those drowned lines should be recopied onto a dry slip so her numbering stays whole. One of those talks closes the ledger his way. The other closes it hers. No third filing is offered.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_01_choice_a",at:"wave_01_site"}]},{op:"all",of:[{op:"talk",npc:"wave_01_choice_b",at:"wave_01_site"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_01_choice_a",at:"wave_01_site"}]},reward:{gold:40,flags:["wave_01_a"],items:[{id:"wave_01_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"wave_01_choice_b",at:"wave_01_site"}]},reward:{gold:90,flags:["wave_01_b"],items:[{id:"wave_01_keepsake_b"}]}}]}],sites:[{id:"wave_01_site",name:"Spare Drawer Annex",hub:"seyda_neen",place:"interior"}],spawns:[{location:"seyda_neen",npc:"wave_01_giver",name:"Tullia Marn"},{location:"wave_01_site",npc:"wave_01_giver",name:"Tullia Marn"},{location:"wave_01_site",npc:"wave_01_witness",name:"Quintus Barrow"},{location:"wave_01_site",npc:"wave_01_choice_a",name:"Adeodatus Vell"},{location:"wave_01_site",npc:"wave_01_choice_b",name:"Hateria Sullo"},{location:"wave_01_site",item:"wave_01_find",name:"Drowned Customs Ledger"}]},Ot={id:"wave_02",title:"Where the Ink Stopped",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Ravela Ondyn cannot enter the Balmora room where her brother died with a goodbye unfinished on the paper. A neighbor still keeps those words, and one of two talks in that room decides whether the sentence stays broken or is spoken through.",giver:"wave_02_giver",location:"balmora",stages:[{journal:"Ravela Ondyn stands on a Balmora landing with both hands empty, and she will not look up at the door. Her brother Lleran died in the rented room above with a goodbye unfinished on the paper, the chair still pulled out as he left it. She has not crossed that threshold since the morning she found him. She asks you to go in and hear Hlarar Dalvani, the neighbor who stayed until the ink dried, because she cannot be first to hear the stopped sentence. Do not bring those words back to her on the street. She has no more to give you out here.",complete:{op:"all",of:[{op:"at",location:"balmora"},{op:"talk",npc:"wave_02_giver",at:"balmora"}]}},{journal:'Inside the Pulled-Chair Room the lamp is down to a thumb of oil, and one chair stands away from the table as if someone meant to return to it. Hlarar Dalvani speaks only here. He says Lleran got as far as "I was wrong to go, and I was wrong to" and then the pen stopped, and the rest never reached the paper. The chair, the lamp, and the open page are the whole of what he kept. Speak with Hlarar in this room, and do not ask any other person here to finish what the ink refused.',complete:{op:"all",of:[{op:"at",location:"wave_02_site"},{op:"talk",npc:"wave_02_witness",at:"wave_02_site"}]}},{journal:"Hlarar Dalvani has said the stopped clause, and he will not repeat it on the stair. Leave the Pulled-Chair Room and find Bedeni Saroth in Balmora. She kept the last evening Lleran spent awake, she knows the two ways that room can be closed, and she will not carry that knowledge back up the stairs. Ravela Ondyn is not the one to tell. Speak with Bedeni in town before you choose any other mouth in the room.",complete:{op:"all",of:[{op:"at",location:"balmora"},{op:"talk",npc:"wave_02_confidant",at:"balmora"}]}},{journal:'Bedeni Saroth has told you the rest, away from the landing. The Pulled-Chair Room is still as you left it: chair drawn out, lamp low, pape
