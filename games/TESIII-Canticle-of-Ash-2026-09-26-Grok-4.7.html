r open where the ink stopped. The clause Lleran did not finish was "I was wrong to go, and I was wrong to think you would still be angry when I came up the stair." Speak with Favas Meran if those words should stay out of the room and the paper should be left broken. Speak with Tevyna Pelas if she should say that clause once beside the chair. One talk or the other finishes the matter. There is no third ending, and only the room will keep the result.',complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_02_choice_a",at:"wave_02_site"}]},{op:"all",of:[{op:"talk",npc:"wave_02_choice_b",at:"wave_02_site"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_02_choice_a",at:"wave_02_site"}]},reward:{gold:25,flags:["wave_02_a"],items:[{id:"wave_02_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"wave_02_choice_b",at:"wave_02_site"}]},reward:{gold:70,flags:["wave_02_b"],items:[{id:"wave_02_keepsake_b"}]}}]}],sites:[{id:"wave_02_site",name:"The Pulled-Chair Room",hub:"balmora",place:"interior"}],spawns:[{location:"balmora",npc:"wave_02_giver",name:"Ravela Ondyn"},{location:"balmora",npc:"wave_02_confidant",name:"Bedeni Saroth"},{location:"wave_02_site",npc:"wave_02_witness",name:"Hlarar Dalvani"},{location:"wave_02_site",npc:"wave_02_choice_a",name:"Favas Meran"},{location:"wave_02_site",npc:"wave_02_choice_b",name:"Tevyna Pelas"}]},Wt={id:"wave_03",title:"The Mud-Quiet Saint",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"In Gnaar Mok a child has named a harmless pale lump in a beached hull a local saint. A hidden tally-cork is the only mark of whose hands lashed it, and two adults want ordinary, different ends for the thing: leave it kneeling in the net-loft, or take it apart for cork and stone.",giver:"wave_03_giver",location:"gnaar_mok",stages:[{journal:"Go to Gnaar Mok and speak with Ithrani Relas on the plank walk. She keeps her voice under the gulls and will not call the matter a haunting. A child named Pelu Ondryn has left the drying lines for a beached hull, insisting a pale, harmless lump in the bow is a local saint. Two adults already want ordinary, different ends for it, and Ithrani will not decide between them. Hear her on this walk before you step into the loft.",complete:{op:"all",of:[{op:"at",location:"gnaar_mok"},{op:"talk",npc:"wave_03_giver",at:"gnaar_mok"}]}},{journal:"Inside the Low Lantern Net-Loft the ribs tick as the mud settles, and a pale lump of cork, river-stone, and tarred lashing kneels in the bow without breath or blessing. It is only an oddity, and it does not answer. Under a cracked rib lies a household tally-cork, three floats on one tarred string, scratched with a family mark. Take that cord. Ithrani Relas has come in behind you. Speak with her in this loft while you hold it, and she will let the matter go on.",complete:{op:"all",of:[{op:"at",location:"wave_03_site"},{op:"item",id:"wave_03_find"},{op:"talk",npc:"wave_03_giver",at:"wave_03_site"}]}},{journal:'Pelu Ondryn is small in the silt, bare ankles grey, and she speaks as if the loft might overhear. She calls the lump "The Mud-Quiet Saint", a local saint nobody names on the public walk, and says it beached itself so the drying lines would lay down their quiet argument. She hid the tally-cork because the scratched mark would turn the saint back into gear before anyone listened. The lump has harmed no one. Hear her here, in the Low Lantern Net-Loft, before an adult puts hands on the lashings.',complete:{op:"all",of:[{op:"at",location:"wave_03_site"},{op:"talk",npc:"wave_03_witness",at:"wave_03_site"}]}},{journal:"Both adults wait in the loft, and neither will move first. Speak with Daros Ondryn, the child's uncle, if the lump should stay kneeling in the bow, the hull remain a net-loft, and Pelu's name for it be spoken only indoors, as a household luck-weight. Speak with Hledas Varen if the lashings should come apart, the corks return to working nets, the stone sit as a smokehouse door-weight, and the hull be hauled two paces up as a plain rack. One of those talks finishes the matter. There is no fight here.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_03_choice_a",at:"wave_03_site"}]},{op:"all",of:[{op:"talk",npc:"wave_03_choice_b",at:"wave_03_site"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_03_choice_a",at:"wave_03_site"}]},reward:{gold:55,flags:["wave_03_a"],items:[{id:"wave_03_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"wave_03_choice_b",at:"wave_03_site"}]},reward:{gold:20,flags:["wave_03_b"],items:[{id:"wave_03_keepsake_b"}]}}]}],sites:[{id:"wave_03_site",name:"Low Lantern Net-Loft",hub:"gnaar_mok",place:"interior"}],spawns:[{location:"gnaar_mok",npc:"wave_03_giver",name:"Ithrani Relas"},{location:"wave_03_site",npc:"wave_03_giver",name:"Ithrani Relas"},{location:"wave_03_site",npc:"wave_03_witness",name:"Pelu Ondryn"},{location:"wave_03_site",npc:"wave_03_choice_a",name:"Daros Ondryn"},{location:"wave_03_site",npc:"wave_03_choice_b",name:"Hledas Varen"},{location:"wave_03_site",item:"wave_03_find",name:"Household tally-cork"}]},Kt={id:"wave_04",title:"The Pale Knot",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Under the Foreign Quarter canton, a launderer soaked a pilgrim's private vow-thread. The pilgrim and the launderer want different small repairs, and the linen-counter who saw the basin will not explain either one until his regard is high enough to trust a stranger with the vow.",giver:"wave_04_giver",location:"vivec",stages:[{journal:"Basket-porter Relsa Omavel waits on the canal walk in Vivec with a damp sleeve over her arm and her voice kept low. A pilgrim's private vow-thread, knotted under the cuff and never meant for a shrine, went into the wrong basin in the washroom under the Foreign Quarter canton. The dye ran, the knot went slack, and both the pilgrim and the launderer are still down there, each wanting a different small repair. She asks you to go hear them quietly, and to leave the pilgrim roads above as they are.",complete:{op:"all",of:[{op:"at",location:"vivec"},{op:"talk",npc:"wave_04_giver",at:"vivec"}]}},{journal:"Steam, pegs, and folded undyed cloth fill the Canal-Peg Washroom under the Foreign Quarter canton, and no shrine-lamp burns there. Linen-counter Dinor Favel saw the vow-thread drop into the hot basin and watched the color leave it, yet he will not name the two repairs. He counts pegs and studies his sandals. Speak with him here. His regard starts below 55, so this first meeting does not open the rest of what he saw.",complete:{op:"all",of:[{op:"at",location:"wave_04_site"},{op:"talk",npc:"wave_04_witness",at:"wave_04_site"}]}},{journal:"Dinor Favel remains among the drying pegs and will not lay out the two small repairs until his regard reaches 55. Raise that regard, then speak with him again in the Canal-Peg Washroom. When he trusts you, he will say what pilgrim Seryne Tedas wants done with the pale knot, and what launderer Gulvis Heloth wants done with the soaked span. He keeps no side. The choice is not his to make.",complete:{op:"all",of:[{op:"at",location:"wave_04_site"},{op:"disposition",npc:"wave_04_witness",min:55},{op:"talk",npc:"wave_04_witness",at:"wave_04_site"}]}},{journal:"The vow-thread lies on a dry board between two basins, its color run and its knot gone slack. Speak with pilgrim Seryne Tedas if the original knot should be drawn tight again and the faded thread worn as it is, the vow left unspoken. Speak with launderer Gulvis Heloth if the soaked span should be cut away, a plain undyed splice sewn in, and the wet length hung on a peg as a nameless mercy. One of those talks finishes the repair. There is no further ending.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_04_choice_a",at:"wave_04_site"}]},{op:"all",of:[{op:"talk",npc:"wave_04_choice_b",at:"wave_04_site"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_04_choice_a",at:"wave_04_site"}]},reward:{gold:80,flags:["wave_04_a"],items:[{id:"wave_04_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"wave_04_choice_b",at:"wave_04_site"}]},reward:{gold:35,flags:["wave_04_b"],items:[{id:"wave_04_keepsake_b"}]}}]}],sites:[{id:"wave_04_site",name:"Canal-Peg Washroom",hub:"vivec",place:"interior"}],spawns:[{location:"vivec",npc:"wave_04_giver",name:"Relsa Omavel"},{location:"wave_04_site",npc:"wave_04_witness",name:"Dinor Favel"},{location:"wave_04_site",npc:"wave_04_choice_a",name:"Seryne Tedas"},{location:"wave_04_site",npc:"wave_04_choice_b",name:"Gulvis Heloth"}]},Ut={id:"wave_05",title:"The Head Written Off as Weather",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Marael Vinn found a split practice head in the Hawkmoth drum closet at Ebonheart. Drummer Calo Brant cracked it while showing a fisherman's child how to hold sticks, a lesson he was not on the roll to give. Take the head, hear the porter who saw the child, then either let Calo stitch it himself or pay 45 gold so a clerk writes the drum off as weather.",giver:"wave_05_giver",location:"ebonheart",stages:[{journal:"Marael Vinn mends spare drumheads in the Practice Drum Closet behind the Hawkmoth yard in Ebonheart. She found a split head and will not say whose sticks did it. Find her in Ebonheart and speak with her. A drummer gave a lesson he was not on the roll to give, and a child from the boats cracked the head. Marael will not choose whether he stitches it himself or the damage is written off as weather.",complete:{op:"all",of:[{op:"at",location:"ebonheart"},{op:"talk",npc:"wave_05_giver",at:"ebonheart"}]}},{journal:"The split practice head lies under a spare skin in the Practice Drum Closet. Take it. The crack is a clean split from a child's first hard stroke, not a charge and not a prize. Marael Vinn has come as far as the closet. Speak with her there, head in hand, before you hear the porter. Do not settle the drum yet.",complete:{op:"all",of:[{op:"at",location:"wave_05_site"},{op:"item",id:"wave_05_find"},{op:"talk",npc:"wave_05_giver",at:"wave_05_site"}]}},{journal:"Pell Hosker waits in the Practice Drum Closet with a water yoke still on one shoulder. He saw the fisherman's child hold Calo Brant's spare sticks, and he saw the head split. He will not name the child in the yard. Speak with Pell in that room. He will not stitch the skin, will not pay a clerk, and will not choose. The two ways to end this wait until after he has spoken.",complete:{op:"all",of:[{op:"at",location:"wave_05_site"},{op:"talk",npc:"wave_05_witness",at:"wave_05_site"}]}},{journal:"Choose one ending. There is not a third. Speak with Calo Brant in the Practice Drum Closet and let him stitch the split head himself, so the lesson stays an unlogged kindness and the child may come back after dark. That talk spends no gold, even if you already hold 45 gold. You receive 60 gold, the flag wave_05_a, and the keepsake wave_05_keepsake_a. Or do not speak with Calo. Pay 45 gold and speak with Orren Vale in Ebonheart so the drum is written off as weather and the child is barred from the yard. Those 45 gold are taken. He returns 18 gold, sets the flag wave_05_b, and gives the keepsake wave_05_keepsake_b. The stitch is checked first, so the pay ending happens only when Calo was not spoken to. Nobody dies.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_05_choice_a",at:"wave_05_site"}]},{op:"all",of:[{op:"gold",amount:45,consume:!0},{op:"talk",npc:"wave_05_choice_b",at:"ebonheart"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_05_choice_a",at:"wave_05_site"}]},reward:{gold:60,flags:["wave_05_a"],items:[{id:"wave_05_keepsake_a"}]}},{when:{op:"all",of:[{op:"gold",amount:45,consume:!0},{op:"talk",npc:"wave_05_choice_b",at:"ebonheart"}]},reward:{gold:18,flags:["wave_05_b"],items:[{id:"wave_05_keepsake_b"}]}}]}],sites:[{id:"wave_05_site",name:"Practice Drum Closet",hub:"ebonheart",place:"interior"}],spawns:[{location:"ebonheart",npc:"wave_05_giver",name:"Marael Vinn"},{location:"wave_05_site",npc:"wave_05_giver",name:"Marael Vinn"},{location:"wave_05_site",npc:"wave_05_witness",name:"Pell Hosker"},{location:"wave_05_site",npc:"wave_05_choice_a",name:"Calo Brant"},{location:"ebonheart",npc:"wave_05_choice_b",name:"Orren Vale"},{location:"wave_05_site",item:"wave_05_find",name:"Split practice head"}]},$t={id:"wave_06",title:"The Guar-Skull Stool",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Dralosa Seran keeps a bone-mender's closet under the Ald'ruhn skar, where her dead cousin's guar skull is used as a stool. Meril Seran would set the skull aside. Arns Seran would keep sitting. Find the seat-cord, hear the neighbor who saw it tied, then speak with only one of them.",giver:"wave_06_giver",location:"ald_ruhn",stages:[{journal:"Ash sifts through the ribs of the skar onto an Ald'ruhn lane, where Dralosa Seran turns a cracked guar-bone spoon in her fingers and will not meet your eye. Her cousin Veden Seran is dead, and his old guar skull is being used as a stool inside the family bone closet. She will not call the quarrel into the street. Stand in Ald'ruhn and speak with her before anyone moves that skull.",complete:{op:"all",of:[{op:"at",location:"ald_ruhn"},{op:"talk",npc:"wave_06_giver",at:"ald_ruhn"}]}},{journal:"The Seran Bone Closet is a bone-mender's stall tucked into a low rib under the skar, smelling of boiled glue and scraped hide. Veden's guar skull sits on the floor between two stools nobody claims, and the braided seat-cord is gone from the eye-hole. Search the bone-bins until you hold Veden's seat-cord. Then speak with Dralosa Seran in this closet, cord in hand, and she will let the household finish its argument.",complete:{op:"all",of:[{op:"at",location:"wave_06_site"},{op:"item",id:"wave_06_find"},{op:"talk",npc:"wave_06_giver",at:"wave_06_site"}]}},{journal:"Beden Hlarar stitches hides on the mat by the closet door. He watched Veden Seran knot that cord through the guar skull and laugh that sore knees outrank an empty shelf. Beden is not a Seran, and he will not choose for them. Speak with him here in the Seran Bone Closet. What he saw is the last account either relative can pretend not to have heard.",complete:{op:"all",of:[{op:"at",location:"wave_06_site"},{op:"talk",npc:"wave_06_witness",at:"wave_06_site"}]}},{journal:"The guar skull is still on the floor, and the seat-cord is still in the closet. Speak with Meril Seran if the skull should be lifted onto a folded cloth and left untouched, the cord wrapped inside, so no one sits on a cousin's beast again. Speak with Arns Seran if the cord goes back through the eye-hole and the skull stays a stool, as Veden told them to use it. One of those talks ends the quarrel. The other relative does not get a second hearing.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_06_choice_a",at:"wave_06_site"}]},{op:"all",of:[{op:"talk",npc:"wave_06_choice_b",at:"wave_06_site"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_06_choice_a",at:"wave_06_site"}]},reward:{gold:100,flags:["wave_06_a"],items:[{id:"wave_06_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"wave_06_choice_b",at:"wave_06_site"}]},reward:{gold:45,flags:["wave_06_b"],items:[{id:"wave_06_keepsake_b"}]}}]}],sites:[{id:"wave_06_site",name:"Seran Bone Closet",hub:"ald_ruhn",place:"interior"}],spawns:[{location:"ald_ruhn",npc:"wave_06_giver",name:"Dralosa Seran"},{location:"wave_06_site",npc:"wave_06_giver",name:"Dralosa Seran"},{location:"wave_06_site",npc:"wave_06_witness",name:"Beden Hlarar"},{location:"wave_06_site",npc:"wave_06_choice_a",name:"Meril Seran"},{location:"wave_06_site",npc:"wave_06_choice_b",name:"Arns Seran"},{location:"wave_06_site",item:"wave_06_find",name:"Veden's seat-cord"}]},Jt={id:"wave_07",title:"The Bowl the Wind Fills",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Beside the Maar Gan shrine, novice Favas Andules takes a clay bowl that keeps filling with ordinary sand for a quiet sign. The cause is a cracked sill and the wind. Two people in the shed want that fact used differently: leave the bowl as a comfort, or tell the plain cause.",giver:"wave_07_giver",location:"maar_gan",stages:[{journal:"Novice Favas Andules stands in Maar Gan with fine ash on his cuffs and a careful hope he is almost afraid to name. A clay bowl in the shed beside the shrine keeps filling with ordinary sand, and he takes each new layer as a sign that small rooms are still noticed. He asks only that you hear him on the street before you go inside. Speak with him here. The bowl and the crack can wait until that talk is done.",complete:{op:"all",of:[{op:"at",location:"maar_gan"},{op:"talk",npc:"wave_07_giver",at:"maar_gan"}]}},{journal:"The Sill-Crack Shed smells of dry clay, and a thin draft along the bench never quite stops. Three pinches of sill-sand lie where the wind has sifted them, pale and ordinary, the same sand that keeps returning to the clay bowl. Gather all three. Novice Favas Andules has followed you in from the street. Show him the pinches and speak with him here, in the shed, before anyone else turns that sand into a verdict.",complete:{op:"all",of:[{op:"at",location:"wave_07_site"},{op:"item",id:"wave_07_find",qty:3},{op:"talk",npc:"wave_07_giver",at:"wave_07_site"}]}},{journal:"Three pinches in hand, the bowl looks less like a wonder and more like a dish left under a draft. Sill-mender Ulvon Dralas waits beside the wall and will not comfort the novice or scold him. He sets one finger on the cracked seam and lets the wind lift a single grain, so you can see the plain cause: a split sill, and ordinary sand carried through it. Speak with him in this shed. He is a witness only, and he will not choose what is done with the fact.",complete:{op:"all",of:[{op:"at",location:"wave_07_site"},{op:"talk",npc:"wave_07_witness",at:"wave_07_site"}]}},{journal:"The seam is a crack and the sand is only the wind, yet two people in the shed want different uses of that fact. Speak with lamp-keeper Ravosa Gilvayn if the bowl should be left as a comfort, a dawn task the novice may keep without being called a fool. Speak with record-keeper Falvos Telandas if the plain cause should be told aloud, kindly, so no one builds a small rite on a draft. One of those talks finishes the matter. Only this shed keeps the result, and the three pinches stay in your pack.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_07_choice_a",at:"wave_07_site"}]},{op:"all",of:[{op:"talk",npc:"wave_07_choice_b",at:"wave_07_site"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_07_choice_a",at:"wave_07_site"}]},reward:{gold:30,flags:["wave_07_a"],items:[{id:"wave_07_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"wave_07_choice_b",at:"wave_07_site"}]},reward:{gold:75,flags:["wave_07_b"],items:[{id:"wave_07_keepsake_b"}]}}]}],sites:[{id:"wave_07_site",name:"Sill-Crack Shed",hub:"maar_gan",place:"interior"}],spawns:[{location:"maar_gan",npc:"wave_07_giver",name:"Novice Favas Andules"},{location:"wave_07_site",npc:"wave_07_giver",name:"Novice Favas Andules"},{location:"wave_07_site",npc:"wave_07_witness",name:"Sill-mender Ulvon Dralas"},{location:"wave_07_site",npc:"wave_07_choice_a",name:"Lamp-keeper Ravosa Gilvayn"},{location:"wave_07_site",npc:"wave_07_choice_b",name:"Record-keeper Falvos Telandas"},{location:"wave_07_site",item:"wave_07_find",name:"Pinch of sill-sand"}]},Yt={id:"wave_08",title:"The Name the Glass Kept",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"A hermit fisher at Ald Velothi traded his name onto a clouded mirror so a small room would stay warm. The dock treats the bargain as a local superstition. A saying can put the name back in his mouth, or leave it in the glass so the room does not go cold.",giver:"wave_08_giver",location:"ald_velothi",stages:[{journal:"On the wet planks at Ald Velothi, a hermit fisher the dock will not name stands among drying nets and will not come closer than the wind allows. The Nameless Fisher says that in a bitter season he spoke his own name onto a clouded hand-mirror, and that a small room has stayed warm ever since. He calls the bargain a dock superstition, not a voice that answered. He wants a saying of that name back from the mirror in the Cloudglass Warm Room, and he will not enter that warm room alone. Go to Ald Velothi and speak with the Nameless Fisher before you go in.",complete:{op:"all",of:[{op:"at",location:"ald_velothi"},{op:"talk",npc:"wave_08_giver",at:"ald_velothi"}]}},{journal:"Go into the Cloudglass Warm Room, the low cell off the Ald Velothi dock. The shutters are tight, the stones are warm under a banked fire this wind should have smothered, and a horn-framed hand-mirror hangs on a nail, clouded with salt and fish-oil smoke. No one has wiped it. Tevri Ondas sits with her face turned from the glass. She was here the night the fisher breathed his name onto it, and she will not give the syllables back to him. She says the mirror is only a local habit with nothing behind the cloud. Speak with Tevri Ondas in this room. The saying that could call a name home is not kept here.",complete:{op:"all",of:[{op:"at",location:"wave_08_site"},{op:"talk",npc:"wave_08_witness",at:"wave_08_site"}]}},{journal:"Nidrya Helan mends nets on the open strand at Ald Velothi, away from the fisher you already spoke with. She is not the giver of this errand, and she will not send you back to him. She keeps the two dock sayings for a clouded mirror: one calls a spent name back into the mouth that gave it, and the other leaves the name in the glass so the room stays warm. She will not choose between them. Speak with Nidrya Helan here in town. She says both speakers are waiting in the Cloudglass Warm Room, and only one talk there will finish the matter.",complete:{op:"all",of:[{op:"at",location:"ald_velothi"},{op:"talk",npc:"wave_08_confidant",at:"ald_velothi"}]}},{journal:"Salt wind and a steady warmth share the Cloudglass Warm Room, and the clouded hand-mirror hangs between them, still unwiped. Speak with Mivani Ondryn if the name should be given back. She still knows its shape, and she will say it onto the glass so the fisher can carry it in his own mouth again, though the room will cool. Speak with Drathyn Kith if the name should stay in the mirror, so people on this bare coast keep a warm room and the fisher remains unnamed. One talk or the other finishes it. There is no third way, and only this room will hold the result.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_08_choice_a",at:"wave_08_site"}]},{op:"all",of:[{op:"talk",npc:"wave_08_choice_b",at:"wave_08_site"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_08_choice_a",at:"wave_08_site"}]},reward:{gold:50,flags:["wave_08_a"],items:[{id:"wave_08_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"wave_08_choice_b",at:"wave_08_site"}]},reward:{gold:85,flags:["wave_08_b"],items:[{id:"wave_08_keepsake_b"}]}}]}],sites:[{id:"wave_08_site",name:"Cloudglass Warm Room",hub:"ald_velothi",place:"interior"}],spawns:[{location:"ald_velothi",npc:"wave_08_giver",name:"The Nameless Fisher"},{location:"wave_08_site",npc:"wave_08_witness",name:"Tevri Ondas"},{location:"ald_velothi",npc:"wave_08_confidant",name:"Nidrya Helan"},{location:"wave_08_site",npc:"wave_08_choice_a",name:"Mivani Ondryn"},{location:"wave_08_site",npc:"wave_08_choice_b",name:"Drathyn Kith"}]},Zt={id:"wave_09",title:"The Festival Coat in the Root Closet",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Mivanna the Root Porter hears shears after the lamp is out. In a root closet under Tel Mora, seamstress Dilvene Haras is secretly sewing a festival coat for a man, meant for a brother who is marrying outside, and two women already in the room disagree on whether that coat may leave the tower.",giver:"wave_09_giver",location:"tel_mora",stages:[{journal:"Mivanna the Root Porter keeps the lower service door at Tel Mora and will not open her book tonight. She has heard shears in the root closet after the lamp should be out, and she fears a coat for a man is being made where only the women of the tower are meant to stand. Speak with her here before you go below. She will not write the sound down, and she will not go in herself.",complete:{op:"all",of:[{op:"at",location:"tel_mora"},{op:"talk",npc:"wave_09_giver",at:"tel_mora"}]}},{journal:"Below the service stair, in the Root-Cloth Closet, Dilvene Haras has a festival coat for a man on a root-wood dummy with a basket for a head. She will speak only of house thread. She will not name who the coat is for, and she will not let it be folded. Hear her once in this room. The shears keep moving, and her regard is still shut.",complete:{op:"all",of:[{op:"at",location:"wave_09_site"},{op:"talk",npc:"wave_09_witness",at:"wave_09_site"}]}},{journal:"Dilvene will not trust a stranger with the wedding of her brother. Raise her regard to 55 by courtesy, with no purse paid and no token fetched, then speak with her again in the Root-Cloth Closet. Only then will she say the coat is for Darvas Haras, who is marrying outside the tower, and that two women already in the room disagree on whether it may leave.",complete:{op:"all",of:[{op:"at",location:"wave_09_site"},{op:"disposition",npc:"wave_09_witness",min:55},{op:"talk",npc:"wave_09_witness",at:"wave_09_site"}]}},{journal:"The festival coat is finished enough to fold, and the only question left is whether it leaves the tower. Speak with Niryse Haras if it should go out to the wedding, hidden in a spore-sack. Speak with Felosa Tendryn if the stitches should be unpicked tonight and the secret kept, the cloth returned to the house bolts. One of those talks settles it. There is no fight, and no third way.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_09_choice_a",at:"wave_09_site"}]},{op:"all",of:[{op:"talk",npc:"wave_09_choice_b",at:"wave_09_site"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_09_choice_a",at:"wave_09_site"}]},reward:{gold:70,flags:["wave_09_a"],items:[{id:"wave_09_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"wave_09_choice_b",at:"wave_09_site"}]},reward:{gold:28,flags:["wave_09_b"],items:[{id:"wave_09_keepsake_b"}]}}]}],sites:[{id:"wave_09_site",name:"Root-Cloth Closet",hub:"tel_mora",place:"interior"}],spawns:[{location:"tel_mora",npc:"wave_09_giver",name:"Mivanna the Root Porter"},{location:"wave_09_site",npc:"wave_09_witness",name:"Dilvene Haras"},{location:"wave_09_site",npc:"wave_09_choice_a",name:"Niryse Haras"},{location:"wave_09_site",npc:"wave_09_choice_b",name:"Felosa Tendryn"}]},Xt={id:"wave_10",title:"The Watering Margin",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Shelf-librarian Indrale Favel cannot shelve a copied household table while two apprentices at Tel Vos claim the same handwritten margin. The note only tells how to water a young tower-cap. Fetch the loose slip from the copyists' alcove, hear the lamp-clerk who saw it tear, then either credit the first apprentice or let the second burn the slip.",giver:"wave_10_giver",location:"tel_vos",stages:[{journal:"On the outer walk of Tel Vos, shelf-librarian Indrale Favel holds a copied household table shut with both hands, as if the pages might keep arguing in the wind. Two apprentices claim the same handwritten margin, a short note on how much water a young tower-cap needs before its gills split. She will not open the dispute on the walk. Speak with her here at Tel Vos before you go into the copyists' alcove.",complete:{op:"all",of:[{op:"at",location:"tel_vos"},{op:"talk",npc:"wave_10_giver",at:"tel_vos"}]}},{journal:"The Copyists' Alcove is a narrow interior of lecterns, lamp-soot, and drying ink, set off the tower stair and used only for household copies. A loose margin slip has fallen from the table, and the watering line is still readable on the scrap. Take the slip while you are here. Indrale Favel has come in after you. Speak with her in the alcove, slip in hand, and she will let the quarrel go on to the clerk who saw the page tear.",complete:{op:"all",of:[{op:"at",location:"wave_10_site"},{op:"item",id:"wave_10_find"},{op:"talk",npc:"wave_10_giver",at:"wave_10_site"}]}},{journal:"Mels Uveri trims the alcove lamps and will not sign a name for the shelf. He saw Tavene Gathal's line dry first, a watering note and nothing grander, and he saw Ralyn Sarel lean in while the ink was still soft until the margin tore free and both of them claimed the whole sentence. Speak with Uveri here. He watches the desks. He does not decide whose name stands, and he will not put the scrap in the lamp himself.",complete:{op:"all",of:[{op:"at",location:"wave_10_site"},{op:"talk",npc:"wave_10_witness",at:"wave_10_site"}]}},{journal:"The loose slip still smells of cap-water and cheap ink, and the copied table will not go back on the shelf until one of the two apprentices is spoken to. Speak with Tavene Gathal, the first apprentice, if the margin should be credited to her: she will have her name set beside the watering line and the copy closed under that credit. Speak with Ralyn Sarel, the second apprentice, if the slip should be burned: he will put it in the lamp so neither hand remains, and the table returns without a note. One talk or the other finishes it. There is no third way, and nobody here is asked to die over a watering line.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_10_choice_a",at:"wave_10_site"}]},{op:"all",of:[{op:"talk",npc:"wave_10_choice_b",at:"wave_10_site"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_10_choice_a",at:"wave_10_site"}]},reward:{gold:42,flags:["wave_10_a"],items:[{id:"wave_10_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"wave_10_choice_b",at:"wave_10_site"}]},reward:{gold:110,flags:["wave_10_b"],items:[{id:"wave_10_keepsake_b"}]}}]}],sites:[{id:"wave_10_site",name:"Copyists' Alcove",hub:"tel_vos",place:"interior"}],spawns:[{location:"tel_vos",npc:"wave_10_giver",name:"Indrale Favel"},{location:"wave_10_site",npc:"wave_10_giver",name:"Indrale Favel"},{location:"wave_10_site",npc:"wave_10_witness",name:"Mels Uveri"},{location:"wave_10_site",npc:"wave_10_choice_a",name:"Tavene Gathal"},{location:"wave_10_site",npc:"wave_10_choice_b",name:"Ralyn Sarel"},{location:"wave_10_site",item:"wave_10_find",name:"Loose margin slip"}]},ei={id:"wave_11",title:"The Ink That Drank Names",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Copyist Vaden Sadryon at Tel Aruhn says a well of ink in a cleft under the tower has started to drink the names written in it. Fetch the stained page and hear the witness there, then let binder Briras Andules seal the well, or kill the thin blot. Either act finishes alone. The seal does not need a death, and the death does not need the seal.",giver:"wave_11_giver",location:"tel_aruhn",stages:[{journal:"Vaden Sadryon waits in Tel Aruhn, above the lower pens and away from the beasts kept there. He copies the household book. He says a fresh well of ink, in a cleft under the tower, has started to drink the names he writes. The letters leave the page wet and gather in the dark into something thin. Speak with him here in the tower before you go down. This talk does not ask you to kill, and the cleft is not the side cave under the pens.",complete:{op:"all",of:[{op:"at",location:"tel_aruhn"},{op:"talk",npc:"wave_11_giver",at:"tel_aruhn"}]}},{journal:"The stained ledger page lies in the ink cleft under the tower. The name on it has been drunk down to a wet hole, and the paper is still damp. Take the page while you are here. Vaden Sadryon has come down to the first ledge behind you and will look at it in your hand. Speak with him in the cleft. He still does not ask you to kill the thin blot. That death is another ending, later, and it is not how this page is read.",complete:{op:"all",of:[{op:"at",location:"wave_11_site"},{op:"item",id:"wave_11_find"},{op:"talk",npc:"wave_11_giver",at:"wave_11_site"}]}},{journal:"Seryne Hleran hides in the ink cleft, where she watched a kitchen name crawl off a line and stand up as a thin blot of ink. Hear her. She is a witness, not a foe, and she does not fight. She says the binder Briras Andules can seal the well with wax and a blank sheet so the ink stops drinking, and that seal needs no death. Killing the thin blot would also end the matter by itself, but she does not require that kill, and this talk is finished when you have heard her.",complete:{op:"all",of:[{op:"at",location:"wave_11_site"},{op:"talk",npc:"wave_11_witness",at:"wave_11_site"}]}},{journal:"Speak with Briras Andules in the cleft and let him seal the ink. He caps the well with wax and a blank sheet. Nobody has to die, and he does not ask you to kill the thin blot first. Or kill the thin blot, and that death alone finishes the quest even if the well is never sealed. Each ending is complete by itself. The seal is not a key the kill demands, and the kill is not a toll the binder takes.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_11_choice_a",at:"wave_11_site"}]},{op:"all",of:[{op:"dead",npc:"wave_11_foe"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_11_choice_a",at:"wave_11_site"}]},reward:{gold:65,flags:["wave_11_a"],items:[{id:"wave_11_keepsake_a"}]}},{when:{op:"all",of:[{op:"dead",npc:"wave_11_foe"}]},reward:{gold:150,flags:["wave_11_b"],items:[{id:"wave_11_keepsake_b"}]}}]}],sites:[{id:"wave_11_site",name:"Ink cleft under the tower",hub:"tel_aruhn",place:"cave"}],spawns:[{location:"tel_aruhn",npc:"wave_11_giver",name:"Vaden Sadryon"},{location:"wave_11_site",npc:"wave_11_giver",name:"Vaden Sadryon"},{location:"wave_11_site",npc:"wave_11_witness",name:"Seryne Hleran"},{location:"wave_11_site",npc:"wave_11_choice_a",name:"Briras Andules"},{location:"wave_11_site",npc:"wave_11_foe",name:"Thin blot",hostile:!0,hp:46},{location:"wave_11_site",item:"wave_11_find",name:"Stained ledger page"}]},ai={id:"wave_12",title:"The Interval Left in Glass",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"A dock-singer in Sadrith Mora lost one musical interval of her hearing into a spore jar off the piers, and she wants that step returned. A buyer in town will pay to keep the jar shut. Have the glass opened by talk, or pay 50 gold and leave the interval sealed.",giver:"wave_12_giver",location:"sadrith_mora",stages:[{journal:"Rain beads on the Sadrith Mora pilings, and the rope-mender Ulves Lleryn works with his head down so he does not have to watch the water. His friend, the dock-singer Daynela Sarvayn, was mid-phrase when one musical interval of her hearing left her ear and went into a spore jar. She still has the notes on either side. The turn between them is gone, and every song she knows falls through that gap. The jar is kept in a low room off the docks. Speak with Ulves here in town. He asks because he loves what is left of her voice and will not be the one who decides whether the glass is opened.",complete:{op:"all",of:[{op:"at",location:"sadrith_mora"},{op:"talk",npc:"wave_12_giver",at:"sadrith_mora"}]}},{journal:"The low jar-room is close and warm. Spore-dust dulls the light, the shelves tick as the glass cools, and the air tastes of salt and mushroom skin. One jar on the bottom shelf holds a thin sound: not a word and not a tune, only the missing step from the dock-song. Take that jar. It is not a lamp, and it is not a bottle meant to be drunk. Ulves Lleryn has followed you in and keeps his hands in his sleeves. Speak with him in this room while the jar is in your hands. He says Daynela is among the shelves, and that the wet quiet around her used to be music.",complete:{op:"all",of:[{op:"at",location:"wave_12_site"},{op:"item",id:"wave_12_find"},{op:"talk",npc:"wave_12_giver",at:"wave_12_site"}]}},{journal:"Daynela Sarvayn stands with one ear tilted toward the shelves, as if the room were a choir missing a single step. Speak with her here. Salt sits on her tongue where the interval should answer. When she tries to land a phrase, a smell of warm spore rises and the phrase never lands. She wants that interval back in her hearing. She also tells you that a buyer from town has stood in the doorway and asked that the jar never be opened, because the sound inside has begun to carry a second breath, older than her song and not hers to spend. Hear her. The choice is not made by this talk.",complete:{op:"all",of:[{op:"at",location:"wave_12_site"},{op:"talk",npc:"wave_12_witness",at:"wave_12_site"}]}},{journal:"Two endings remain, and there is not a third. Speak with Rilas Ondren, the jar-keeper, in this room, and he will open the jar. That talk spends no gold. The interval returns to Daynela Sarvayn, the second breath in the glass is spent, and you receive 55 gold, the flag wave_12_a, and the keepsake wave_12_keepsake_a. Or leave the jar shut. Pay 50 gold and speak with Nirvyn Favel, the buyer, in Sadrith Mora. Those 50 gold are taken. He pays 12 gold to keep the interval sealed, sets the flag wave_12_b, and gives the keepsake wave_12_keepsake_b. No one is killed. The song is either mended or left with its hole.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_12_choice_a",at:"wave_12_site"}]},{op:"all",of:[{op:"gold",amount:50,consume:!0},{op:"talk",npc:"wave_12_choice_b",at:"sadrith_mora"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_12_choice_a",at:"wave_12_site"}]},reward:{gold:55,flags:["wave_12_a"],items:[{id:"wave_12_keepsake_a"}]}},{when:{op:"all",of:[{op:"gold",amount:50,consume:!0},{op:"talk",npc:"wave_12_choice_b",at:"sadrith_mora"}]},reward:{gold:12,flags:["wave_12_b"],items:[{id:"wave_12_keepsake_b"}]}}]}],sites:[{id:"wave_12_site",name:"Low Jar-Room",hub:"sadrith_mora",place:"interior"}],spawns:[{location:"sadrith_mora",npc:"wave_12_giver",name:"Ulves Lleryn"},{location:"wave_12_site",npc:"wave_12_giver",name:"Ulves Lleryn"},{location:"wave_12_site",npc:"wave_12_witness",name:"Daynela Sarvayn"},{location:"wave_12_site",npc:"wave_12_choice_a",name:"Rilas Ondren"},{location:"sadrith_mora",npc:"wave_12_choice_b",name:"Nirvyn Favel"},{location:"wave_12_site",item:"wave_12_find",name:"Interval jar"}]},ti={id:"wave_13",title:"The Counting-String",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Ilmyna Badas keeps the flap of the counted tent at the Ahemmusa camp while a pack-trader from Vos asks to buy the midwife's counting-string of births. Hear the mother who saw him lift it, then a man at the fire whose grief is one empty loop, and say in the tent whether the string stays unseen or a blank cord leaves in its place.",giver:"wave_13_giver",location:"ahemmusa_camp",stages:[{journal:"Ilmyna Badas keeps the outer flap of the counted tent at the Ahemmusa camp, and she does not raise her voice over the grass. A pack-trader out of Vos has asked to buy the midwife's counting-string, a cord of births, as a Grazelands curiosity. She will not answer for the tent, and she will not pull the cord down for him. Speak with her here before you go inside.",complete:{op:"all",of:[{op:"at",location:"ahemmusa_camp"},{op:"talk",npc:"wave_13_giver",at:"ahemmusa_camp"}]}},{journal:"Inside the counted tent the air is warm wickwheat and clean hide, and the counting-string hangs on a peg above the birthing mat. Yanesi Relen, whose newest knot is still tight, saw the trader lift the cord and ask what coin it would bring in a far study. She can say which knots are living children and which are wrapped pale for those who did not stay. She will not sell a knot, and she will not speak for the midwife. Speak with her here.",complete:{op:"all",of:[{op:"at",location:"wave_13_site"},{op:"talk",npc:"wave_13_witness",at:"wave_13_site"}]}},{journal:"Addarnat Sethan sits by the camp fire with tent-felt across his knees, away from the flap and away from the trader. One empty loop on the counting-string is his child, who was born and did not stay. He says a blank cord of the same hair would carry the look of the work and none of the names, and that the named string should not leave its peg. He will not choose for the tent. Speak with him here, then go back, and let one talk inside be the last word.",complete:{op:"all",of:[{op:"at",location:"ahemmusa_camp"},{op:"talk",npc:"wave_13_confidant",at:"ahemmusa_camp"}]}},{journal:"The counting-string is still on its peg, and both answers are waiting in the counted tent. Speak with Mabasi Hendras, the midwife, if the string is to stay with her and the trader is to leave with nothing: she will hang it again and give only a cut of wickwheat that was never a knot. Speak with Torvyn Lledri if he may buy a blank cord of the same hair, uncounted, while the original and every name stay above the mat. One of those talks finishes it, and only this tent keeps the result.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_13_choice_a",at:"wave_13_site"}]},{op:"all",of:[{op:"talk",npc:"wave_13_choice_b",at:"wave_13_site"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_13_choice_a",at:"wave_13_site"}]},reward:{gold:33,flags:["wave_13_a"],items:[{id:"wave_13_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"wave_13_choice_b",at:"wave_13_site"}]},reward:{gold:88,flags:["wave_13_b"],items:[{id:"wave_13_keepsake_b"}]}}]}],sites:[{id:"wave_13_site",name:"The Counted Tent",hub:"ahemmusa_camp",place:"interior"}],spawns:[{location:"ahemmusa_camp",npc:"wave_13_giver",name:"Ilmyna Badas"},{location:"wave_13_site",npc:"wave_13_witness",name:"Yanesi Relen"},{location:"ahemmusa_camp",npc:"wave_13_confidant",name:"Addarnat Sethan"},{location:"wave_13_site",npc:"wave_13_choice_a",name:"Mabasi Hendras"},{location:"wave_13_site",npc:"wave_13_choice_b",name:"Torvyn Lledri"}]},ii={id:"wave_14",title:"The Uncovered Guest-Salt",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Under the guest awning at Zainab Camp, two measures of uncovered salt were meant as a mild insult in windward herder speech and read as a season-long betrothal in fold speech. Gather both units, hear the herd-counter repeat the phrase, and let one of the two herders fix the meaning.",giver:"wave_14_giver",location:"zainab_camp",stages:[{journal:"Kummu Ranit stands where the Zainab Camp paths meet the guest ropes, a lead-rope in each fist, and will not let either herder shout across the grass. A bowl of salt was set down under the guest awning after a herd-count that did not match, and the two people inside it do not agree what an open bowl means. She will not explain a dialect where the animals can hear, and she will not let either guest decide it by touching the salt first. Stand in the camp and speak with Kummu Ranit before you go under the awning.",complete:{op:"all",of:[{op:"at",location:"zainab_camp"},{op:"talk",npc:"wave_14_giver",at:"zainab_camp"}]}},{journal:"Under the Guest-Salt Awning the bowl is on its side. A guar calf nosed it over, and two measures of uncovered guest-salt lie scattered on the mat instead of sitting as a pair. Sedramba Kalah set those two measures out because Tevyne Salittu had claimed thirty guar when the morning count was twenty-two. Take two units of the salt so the gift is whole enough to mean either a mild insult or a season. One unit would be a different saying. Kummu Ranit has followed you in. With both units on you, speak with her here. She still will not pick.",complete:{op:"all",of:[{op:"at",location:"wave_14_site"},{op:"item",id:"wave_14_find",qty:2},{op:"talk",npc:"wave_14_giver",at:"wave_14_site"}]}},{journal:"Pelu Zabari was waxing a lead-rope at the awning edge when the bowl was set down, and he can give the phrase in the order Sedramba spoke it: salt for the count that was given. In windward speech that phrase, with two open measures, is a mild insult, the sort you return before supper and then laugh about. In fold speech the same open pair is a betrothal that stands until the grass turns, and Tevyne has already sent a runner to her sister. Pelu will repeat both readings and will not choose. Speak with him under the Guest-Salt Awning before either herder is allowed to fix the meaning.",complete:{op:"all",of:[{op:"at",location:"wave_14_site"},{op:"talk",npc:"wave_14_witness",at:"wave_14_site"}]}},{journal:"The two units can be lived as one meaning only, and only one herder may be told that it stands. Speak with Sedramba Kalah if the bowl was the insult he meant, and the salt should be returned before kin on the folds start treating a jab as a season together. Speak with Tevyne Salittu if fold speech has the right of it, and the betrothal should stand until the grass turns, stud-guar trade and all. One talk finishes this. The other will not be heard afterward. Pelu Zabari will not choose, and Kummu Ranit will not choose either.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_14_choice_a",at:"wave_14_site"}]},{op:"all",of:[{op:"talk",npc:"wave_14_choice_b",at:"wave_14_site"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_14_choice_a",at:"wave_14_site"}]},reward:{gold:48,flags:["wave_14_a"],items:[{id:"wave_14_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"wave_14_choice_b",at:"wave_14_site"}]},reward:{gold:22,flags:["wave_14_b"],items:[{id:"wave_14_keepsake_b"}]}}]}],sites:[{id:"wave_14_site",name:"Guest-Salt Awning",hub:"zainab_camp",place:"interior"}],spawns:[{location:"zainab_camp",npc:"wave_14_giver",name:"Kummu Ranit"},{location:"wave_14_site",npc:"wave_14_giver",name:"Kummu Ranit"},{location:"wave_14_site",npc:"wave_14_witness",name:"Pelu Zabari"},{location:"wave_14_site",npc:"wave_14_choice_a",name:"Sedramba Kalah"},{location:"wave_14_site",npc:"wave_14_choice_b",name:"Tevyne Salittu"},{location:"wave_14_site",item:"wave_14_find",name:"Uncovered guest-salt"}]},ni={id:"wave_15",title:"The Letter Under the Flagstone",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"Fifer Orthan Pell buried trooper Halven Crowe's unsent letter under a loose flagstone in the spare colors locker at Moonmoth Legion Fort. Private Brea Coll wants that page burned unread. Sergeant Maelius Vark wants it as petty proof against the dead man's name.",giver:"wave_15_giver",location:"moonmoth_fort",stages:[{journal:"Fifer Orthan Pell stands on the packed ground of Moonmoth Legion Fort with his case shut, as if the parade had already gone past him. Trooper Halven Crowe died on the road with a letter still unsent, and Pell buried that page under a loose flagstone instead of burning it as promised. He will not speak the rest of it in the open. Speak with him here before you go into the spare colors locker.",complete:{op:"all",of:[{op:"at",location:"moonmoth_fort"},{op:"talk",npc:"wave_15_giver",at:"moonmoth_fort"}]}},{journal:"The Spare Colors Locker smells of cedar oil and damp wool, a corner of the parade-ground storeroom where spare banners hang on pegs. One flagstone sits proud of the others. Halven Crowe's unsent letter is under it. Take the page. Orthan Pell has followed you in and still will not put his hands on it. Speak with him in this room while the letter is yours, and only then will he let the matter go on.",complete:{op:"all",of:[{op:"at",location:"wave_15_site"},{op:"item",id:"wave_15_find"},{op:"talk",npc:"wave_15_giver",at:"wave_15_site"}]}},{journal:"Edda Marsh waits by the banner pegs with mending thread on her cuffs. She is a witness, not a judge, and she will not take the letter. She heard Crowe tell Pell to burn the page unread if the road took him, and she heard Sergeant Maelius Vark call that same sealed page proof Crowe left his post long enough to write it, a petty mark against a dead man's name. Speak with her here in the locker.",complete:{op:"all",of:[{op:"at",location:"wave_15_site"},{op:"talk",npc:"wave_15_witness",at:"wave_15_site"}]}},{journal:"The letter is still sealed. Two talks in this locker can finish the matter, and only those two. Speak with Private Brea Coll if the page should be burned unread and the private promise kept. Speak with Sergeant Maelius Vark if it should be handed over as the petty proof he wants entered against Crowe. One talk completes it. There is no third way, and no blade is drawn over the paper.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_15_choice_a",at:"wave_15_site"}]},{op:"all",of:[{op:"talk",npc:"wave_15_choice_b",at:"wave_15_site"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_15_choice_a",at:"wave_15_site"}]},reward:{gold:95,flags:["wave_15_a"],items:[{id:"wave_15_keepsake_a"}]}},{when:{op:"all",of:[{op:"talk",npc:"wave_15_choice_b",at:"wave_15_site"}]},reward:{gold:40,flags:["wave_15_b"],items:[{id:"wave_15_keepsake_b"}]}}]}],sites:[{id:"wave_15_site",name:"Spare Colors Locker",hub:"moonmoth_fort",place:"interior"}],spawns:[{location:"moonmoth_fort",npc:"wave_15_giver",name:"Fifer Orthan Pell"},{location:"wave_15_site",npc:"wave_15_giver",name:"Fifer Orthan Pell"},{location:"wave_15_site",npc:"wave_15_witness",name:"Edda Marsh"},{location:"wave_15_site",npc:"wave_15_choice_a",name:"Private Brea Coll"},{location:"wave_15_site",npc:"wave_15_choice_b",name:"Sergeant Maelius Vark"},{location:"wave_15_site",item:"wave_15_find",name:"Crowe's unsent letter"}]},oi={id:"wave_16",title:"The Standing Seam",category:"miscellaneous",origin:"addition",uesp:"addition",summary:"A bound stitch in a bedsheet stood up in the linen press off the Imperial mage quarters at Wolverine Hall after an apprentice sneezed mid-incantation. Fetch the broken needle, hear the witness, then let the apprentice resew the hem or cut the cloth-thing down.",giver:"wave_16_giver",location:"wolverine_hall",stages:[{journal:"Tullia Naso keeps the linen count for the Imperial mage quarters at Wolverine Hall. She is in the hall, short of breath, because one bedsheet in the press will not lie flat. A bound stitch stood up after an apprentice sneezed mid-incantation. These quarters are the bunk rooms of the battlemages posted to the stronghold, and she will not take the matter to any guild desk. Speak with her in the hall before going to the press.",complete:{op:"all",of:[{op:"at",location:"wolverine_hall"},{op:"talk",npc:"wave_16_giver",at:"wolverine_hall"}]}},{journal:"The linen press stands off the Imperial mage quarters. It is not the hall cellar, and there is no card to fetch. The binding needle snapped when the stitch pulled free of the sheet, and that broken needle lies in the press. Take it. Tullia Naso is in the press with the evening count-book. Speak with her there once the needle is in hand. The cloth-thing may already be on its corners, yet this step does not ask you to kill it.",complete:{op:"all",of:[{op:"at",location:"wave_16_site"},{op:"item",id:"wave_16_find"},{op:"talk",npc:"wave_16_giver",at:"wave_16_site"}]}},{journal:"Favel Sarayn, a chamber-page, was holding the rinse basin in the press when the apprentice sneezed. She saw the bound stitch leave the bedsheet and stand up as a small cloth-thing. Speak with her here. Her account is the whole of this step: which word was cut, and how the needle was still in the weave. She does not ask for a death, and the cloth-thing need not fall before she will speak.",complete:{op:"all",of:[{op:"at",location:"wave_16_site"},{op:"talk",npc:"wave_16_witness",at:"wave_16_site"}]}},{journal:"Palla Mento is the apprentice who sneezed. Speak with her in the press and she will resew the stitch back into the sheet. That talk finishes the matter by itself, with the hem lying flat and the count able to close. Or kill the Stood Hem, the small cloth-thing that rose from the bedsheet. That death also finishes alone. You do not need both, and no one demands the kill before the seam can be closed.",complete:{op:"any",of:[{op:"all",of:[{op:"talk",npc:"wave_16_choice_a",at:"wave_16_site"}]},{op:"all",of:[{op:"dead",npc:"wave_16_foe"}]}]},outcomes:[{when:{op:"all",of:[{op:"talk",npc:"wave_16_choice_a",at:"wave_16_site"}]},reward:{gold:72,flags:["wave_16_a"],items:[{id:"wave_16_keepsake_a"}]}},{when:{op:"all",of:[{op:"dead",npc:"wave_16_foe"}]},reward:{gold:160,flags:["wave_16_b"],items:[{id:"wave_16_keepsake_b"}]}}]}],sites:[{id:"wave_16_site",name:"Mage Quarters Linen Press",hub:"wolverine_hall",place:"interior"}],spawns:[{location:"wolverine_hall",npc:"wave_16_giver",name:"Tullia Naso"},{location:"wave_16_site",npc:"wave_16_giver",name:"Tullia Naso"},{location:"wave_16_site",npc:"wave_16_witness",name:"Favel Sarayn"},{location:"wave_16_site",npc:"wave_16_choice_a",name:"Palla Mento"},{location:"wave_16_site",npc:"wave_16_foe",name:"Stood Hem",hostile:!0,hp:46},{location:"wave_16_site",item:"wave_16_find",name:"Snapped binding needle"}]},ri=[It,Ot,Wt,Kt,Ut,$t,Jt,Yt,Zt,Xt,ei,ai,ti,ii,ni,oi],Ke=["hlaalu","redoran","telvanni","fighters","mages","thieves","cult","legion","temple","morag","daedric","vampire"],Ue=Za.map(Pa);for(const e of Ke)za(Ue,e);const U=[...Ya(),...Ue,...qt,...ut,...ri],he=Ua(),ke=new Set(he.map(e=>e.id));function ye(e,a,t,i){if(ke.has(e))return;const n=ke.has(a)?a:"balmora";$a(he,{id:e,name:t,hub:n,place:i}),ke.add(e)}for(const e of U){const a=e.sites[0]?.hub??"balmora";ye(e.location,a,e.location,"interior");for(const t of e.sites)ye(t.id,t.hub,t.name,t.place);for(const t of e.spawns)ye(t.location,a,t.name,"interior")}const ue=Ia.map(e=>({...e})),Fe=new Set(ue.map(e=>e.id));function be(e,a,t="quest"){!e||Fe.has(e)||(Fe.add(e),ue.push({id:e,name:a,kind:t,weight:.4,value:25}))}for(const e of U){for(const a of e.spawns)a.item&&be(a.item,a.name,"quest");for(const a of e.stages){for(const t of a.reward?.items??[])be(t.id,t.id.replaceAll("_"," "));for(const t of a.outcomes??[])for(const i of t.reward.items??[])be(i.id,i.id.replaceAll("_"," "))}}const si=U.filter(e=>e.origin==="source"),li=U.filter(e=>e.origin==="addition"),di=si.map(e=>({id:e.id,title:e.title,category:e.category,origin:e.origin,uesp:e.uesp,summary:e.summary,location:e.location,giver:e.giver})),p={quests:U,sourceIndex:di,additions:li.map(e=>e.id),locations:new Map(he.map(e=>[e.id,e])),locationList:he,items:new Map(ue.map(e=>[e.id,e])),itemList:ue,spells:Oa(),spellList:We,races:xe,signs
