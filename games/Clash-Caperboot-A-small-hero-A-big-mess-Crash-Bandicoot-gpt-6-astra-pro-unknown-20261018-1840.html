  .title-secondary { margin-top: 4px; padding-top: 4px; }
  .title-secondary .menu-button { min-height: 29px; font-size: 15px; }
  .title-signoff { display: none; }
  .menu-footer { min-height: 39px; padding-top: 7px; padding-bottom: 7px; font-size: 10px; }
  .panel-screen { padding-top: 20px; padding-bottom: 48px; }
  .screen-heading.compact { font-size: 36px; }
  .about-scroll { max-height: 48vh; }
  .hud-chapter { top: 0; }
  .hud-chapter > strong { font-size: 21px; }
  .hud-top { display: grid; grid-template-columns: 1fr 1fr 1fr; top: 15px; }
  .hud-chapter { position: relative; left: auto; width: auto; transform: none; grid-column: 2; grid-row: 1; }
  .hud-session { grid-column: 3; }
  .route-track, .checkpoint-tag { display: none; }
  .hud-bottom { flex-direction: row; align-items: flex-end; }
  .objective { max-width: 50%; }
  .play-hints { font-size: 9px; }
  .bonus-clock { top: 95px; }
  .boss-hud { bottom: 90px; }
  .is-attract .hud-chapter { padding-top: 0; }
  .is-attract .bonus-clock { top: 130px; }
  .chapter-banner { top: 30%; }
  .chapter-banner h2 { font-size: 46px; }
  .chapter-banner p { font-size: 18px; }
}
