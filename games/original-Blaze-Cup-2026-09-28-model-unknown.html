/*! aihub-session 1.1.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */

  if (root.AIHub) return;

  var VERSION = '1.1.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var MAX_BYTES = 16384;
  var RATE_PER_S = 20;
  var BURST = 40;

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var flagged = /[?&]aihub=/.test(String(root.location && root.location.search));

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
  };

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = BURST;
  var refilled = now();

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (Object.prototype.hasOwnProperty.call(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      hub.me = m.me;
      hub.host = m.host;
      hub.isHost = m.me === m.host;
      hub.players = (m.players || []).slice();
      hub.mode = m.mode;
      hub.seed = m.seed >>> 0;
      hub.limitMs = m.limitMs;
      hub.round = m.round;
      if (connecting) connecting.resolve(info());
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    }
  }

  function info() {
    return {
      me: hub.me,
      host: hub.host,
      isHost: hub.isHost,
      players: hub.players.slice(),
      mode: hub.mode,
      seed: hub.seed,
      limitMs: hub.limitMs,
      round: hub.round,

    if (!hub.active) {

      return promise;
    }
    opts = opts || {};

    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        hub.active = false;
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded and the player pressed something: call from that input handler. */

    if (!welcomed || sentReady || ended) return;

  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */

    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    var a = (hub.seed ^ h) >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  /** Copy the optional highlights (stats, awards) as plain JSON; the hub checks and trims them. */
  function highlights(outcome, fields) {
    for (var i = 0, keys = ['stats', 'awards']; i < keys.length; i++) {
      if (outcome[keys[i]] == null) continue;
      try {
        fields[keys[i]] = JSON.parse(JSON.stringify(outcome[keys[i]]));
      } catch (e) {
        warn(keys[i] + ' is not JSON, left out');
      }
    }
    return fields;
  }

  /** Race mode: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    outcome = outcome || {};
    var fields = {};
    if (isFinite(outcome.time)) fields.time = Number(outcome.time);
    else if (isFinite(outcome.score)) fields.score = Number(outcome.score);
    else return warn('result needs a finite time or score');
    reported = true;
    post('result', highlights(outcome, fields));
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    outcome = outcome || {};
    if (!Array.isArray(outcome.standings)) return warn('finish needs standings');
    reported = true;
    var fields = { standings: outcome.standings };
    if (outcome.scores) fields.scores = outcome.scores;
    if (typeof outcome.won === 'boolean') fields.won = outcome.won;
    post('finish', highlights(outcome, fields));
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;

function crowdStart() {

  setInterval(() => { if (!AU.on) return; const cs = STADIUM.cs, t = now(); crowdUpdate(t, cs); }, 60);
}
function crowdUpdate(t, cs) {
  const c = AU.cr; if (!c) return;
  c.roar = Math.max(0, c.roar - .03);

  const wob = .85 + Math.random() * .3;
  c.low.g.gain.setTargetAtTime((.25 + e * .55) * wob, t, .15);
  c.mid.g.gain.setTargetAtTime((.08 + e * .45) * wob, t, .12);
  c.hi.g.gain.setTargetAtTime(.02 + e * .12, t, .12);
  c.mid.bp.frequency.setTargetAtTime(900 + e * 700, t, .3);
  // chants: rhythmic claps when the crowd is warm
  c.clapT = (c.clapT || 0) - .06;

}

const QS = new URLSearchParams(location.search);

/* ---------- rig lab: ?lab=kick,volley,... shows moves looping on a plain pitch ---------- */
function bootLab() {
  const canvas = document.getElementById('screen');
  const game = new E.Game({ canvas, view: VIEW, minH: 250, minW: 400, maxW: 760, maxH: 290, bg: '#2f7d40' });
  G.game = game;
  const list = (QS.get('lab') || 'run,kick,pass,volley,header,bicycle,slide,fallBack,gkDive,superBlaze').split(',');
  const cols = Math.min(5, list.length), gap = 58;
  const actors = list.map((m, i) => {
    const team = TEAMS[i % 2], info = m.startsWith('gk') ? team.roster[0] : team.roster[5 - (i % 3)];
    const rig = new Footballer({ team, info });
    const a = { move: m, rig, x: 40 + (i % cols) * gap, y: 40 + Math.floor(i / cols) * 70, z: 0, vz: 0, t: 0, facing: QS.has('turn') ? i / list.length * TAU : QS.has('face') ? +QS.get('face') : 0 };
    return a;
  });
  const cycle = a => { const d = MOVES[a.move]; return (d ? (typeof d.dur === 'function' ? d.dur({}) : d.dur) : 1) + .7; };
  function update(dt) {
    for (const a of actors) {
      a.t += dt;
      const m = a.move;
      let vx = 0, sprint = false, gk = a.rig.gk, air = false;
      if (m === 'run' || m === 'sprint' || m === 'jog' || m === 'walk') { const sp = { run: 104, sprint: 142, jog: 70, walk: 30 }[m]; vx = sp; sprint = m === 'sprint'; }
      else if (a.t >= cycle(a) || !a.started) {
        a.t = 0; a.started = true;
        const opts = { power: 1, hi: .5, spin: m === 'fallBack' ? 1 : 0, h: 9 };
        a.rig.play(m, opts);
        if (['header', 'bicycle', 'superBlaze', 'superThunder', 'superCyclone', 'backflip'].includes(m)) a.vz = m === 'header' ? 150 : 175;
        if (m === 'gkDive') a.vz = 120;
      }
      if (a.vz || a.z > 0) { a.vz -= TUNE.playerGravity * dt; a.z = Math.max(0, a.z + a.vz * dt); if (a.z <= 0) { a.vz = 0; if (a.move.startsWith('super') && a.rig.act && a.rig.act.done) a.rig.play('superLand'); } air = true; }
      a.rig.update(dt, { x: a.x, y: a.y, z: a.z, vx: vx * Math.cos(a.facing), vy: vx * Math.sin(a.facing), vz: a.vz, facing: a.facing, look: [a.x + 30 * Math.cos(a.facing), a.y + 30 * Math.sin(a.facing), 0], sprint, gk, air });
    }
    game.focus(40 + (cols - 1) * gap / 2, 40 + (Math.ceil(list.length / cols) - 1) * 35, 10);
  }
  function draw(r) {
    for (const a of actors) {
      r.shadow(a.x, a.y, 6, .45);
      r.actor(a.x, a.y, a.z, (g, ox, oy) => a.rig.draw(g, ox, oy, r.view), { rimColor: '#e8f4ff' });
    }
    r.overlay(g => {
      for (const a of actors) { const [x, y] = r.w(a.x, a.y, 0); E.font.text(g, a.move.toUpperCase(), x - E.font.width(a.move) / 2, y + 6, '#fff'); }
      if (G.dev.showRig) for (const a of actors) a.rig.debug(r);
    });
  }
  game.start({ update, draw });
  document.getElementById('boot').remove();
  window.__lab = {
    game, actors,
    /** advance n frames of dt and return a contact sheet (data URL) of the buffer, cropped around the actors */
    film(n = 12, dt = 1 / 30, scale = 2, crop = null) {
      game.manual = true;
      const b = game.screen.buf, cw = crop ? crop[2] : game.screen.W, ch = crop ? crop[3] : game.screen.H;
      const per = Math.min(n, Math.max(1, Math.floor(1800 / (cw * scale))));
      const rows = Math.ceil(n / per), out = document.createElement('canvas');
      out.width = per * cw * scale; out.height = rows * ch * scale;
      const g = out.getContext('2d'); g.imageSmoothingEnabled = false;
      for (let i = 0; i < n; i++) {
        game.advance(dt);
        g.drawImage(b, crop ? crop[0] : 0, crop ? crop[1] : 0, cw, ch, (i % per) * cw * scale, Math.floor(i / per) * ch * scale, cw * scale, ch * scale);
        g.fillStyle = '#000'; g.fillRect((i % per) * cw * scale, Math.floor(i / per) * ch * scale, 1, ch * scale);
      }
      return out.toDataURL('image/png');
    },
    restart() { for (const a of actors) { a.t = 999; } },
    /** contact sheet: one column per actor (cropped around it), one row per frame */
    sheet(n = 12, dt = 1 / 30, scale = 3, w = 64, h = 60, up = 44) {
      game.manual = true;
      const b = game.screen.buf, out = document.createElement('canvas');
      out.width = actors.length * w * scale; out.height = n * h * scale;
      const g = out.getContext('2d'); g.imageSmoothingEnabled = false;
      for (let i = 0; i < n; i++) {
        game.advance(dt);
        actors.forEach((a, k) => {
          const [x, y] = game.r.w(a.x, a.y, 0);
          g.drawImage(b, Math.round(x - w / 2), Math.round(y - up), w, h, k * w * scale, i * h * scale, w * scale, h * scale);
        });
        g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, i * h * scale, out.width, 1);
      }
      for (let k = 1; k < actors.length; k++) { g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(k * w * scale, 0, 1, out.height); }
      return out.toDataURL('image/png');
    }
  };
}

/* ---------- stadium preview: ?stadium  (camera pans; __dev.cam(x, y) to place it) ---------- */
function bootStadium() {
  const canvas = document.getElementById('screen');
  const game = new E.Game({ canvas, view: VIEW, minH: 240, minW: 400, maxW: 760, maxH: 300, bg: '#070814' });
  G.game = game; G.r = game.r;
  stadiumInit();
  game.cam.bounds = v => stadiumBounds(v);
  game.cam.smooth = .25;
  const dummies = [];
  for (let s = 0; s < 2; s++) TEAMS[s].roster.forEach((info, i) => {
    const f = FORMATION[info.role], x = s === 0 ? f[0] * PITCH.L : (1 - f[0]) * PITCH.L, y = f[1] * PITCH.W;
    dummies.push({ rig: new Footballer({ team: TEAMS[s], info }), x, y, facing: s === 0 ? 0 : PI });
  });
  let camX = PITCH.cx, camY = PITCH.cy, auto = true;
  function update(dt) {
    if (auto) { camX = PITCH.cx + Math.sin(game.time * .25) * 520; camY = PITCH.cy + Math.sin(game.time * .31) * 260; }
    updateCrowd(dt); updateGoals(dt);
    for (const d of dummies) d.rig.update(dt, { x: d.x, y: d.y, z: 0, vx: 0, vy: 0, facing: d.facing, look: [PITCH.cx, PITCH.cy, 0], gk: d.rig.gk });
    game.focus(camX, camY, 0);
  }
  function draw(r) {
    drawStand(r, G.wall);
    drawFloor(r);
    queueBoards(r); queueGoals(r);
    for (const d of dummies) { r.shadow(d.x, d.y, 6, .45); r.actor(d.x, d.y, 0, (g, ox, oy) => d.rig.draw(g, ox, oy, r.view), { rimColor: '#e8f4ff' }); }
  }
  game.start({ update, draw, frame: dt => { G.wall += dt; } });
  document.getElementById('boot').remove();
  window.__dev = { game, cam(x, y) { auto = false; camX = x; camY = y; game.cam.snap = true; }, auto() { auto = true; }, crowd: crowdReact, goals: STADIUM.goals, netPoke, led: STADIUM.led };
}

      vig = E.mkCanvas(w, h); const vg = vig.getContext('2d'), gr = vg.createRadialGradient(w / 2, h * .45, Math.min(w, h) * .35, w / 2, h / 2, Math.hypot(w, h) * .62);

function setupGlobalInput(canvas) {
  const wake = () => { if (AU.ctx) audioResume(); };
  addEventListener('keydown', e => {
    wake();
    if (e.code === 'KeyM' && !e.repeat) { if (!AU.ctx) audioResume(); setMuted(!AU.muted); }
    if (e.code === 'KeyR' && e.shiftKey && !e.repeat) G.dev.showRig = !G.dev.showRig;
  });
  addEventListener('blur', () => { if (!SESS.on && G.mode === 'match' && G.match && !G.match.attract && G.match.state === 'play') setPaused(true); });
  canvas.addEventListener('pointerdown', e => {
    audioResume();
    const s = G.game.screen.clientToScreen(e.clientX, e.clientY), bx = s[0] - G.r.ix, by = s[1] - G.r.iy;
    if (G.mode === 'title' && MENU.state === 'press') { MENU.clicked = true; return; }
    if (G.mode === 'title' || G.paused) for (const [x, y, w, h, i] of MENU.rects) if (bx >= x && bx < x + w && by >= y && by < y + h) { if (G.paused) MENU.pauseSel = i; else MENU.sel = i; MENU.clicked = true; }
  });
}
function startGame(mode) {
  transition(() => {
    G.mode = 'match'; G.paused = false; G.game.timeScale = 1;
    const M = G.match = new Match(mode); M.onDone = () => toTitle();
    G.humans = [];
    const in1 = G.game.input;
    if (mode === '1p') { in1.setMap(KEYMAP.solo); in1.padIndex = 0; G.humans.push(new Human(0, in1, 1)); }
    else if (mode === '2p') {
      in1.setMap(KEYMAP.p1); in1.padIndex = 0;
      if (!G.input2) G.input2 = new E.Input(G.game.screen, KEYMAP.p2, { pad: 1, pointer: false });
      G.input2.setMap(KEYMAP.p2); G.input2.padIndex = 1;
      G.humans.push(new Human(0, in1, 1), new Human(1, G.input2, 2));
    } else in1.setMap(KEYMAP.solo);
    for (const p of G.players) { p.human = null; p.stats = { goals: 0, shots: 0 }; }
    for (const [p, x, y, f] of M.kickoffLayout(0)) p.place(x, y, f);
    G.ball.reset(PITCH.cx, PITCH.cy);
    for (const p of G.players) { p.state = 'script'; p.target = null; p.rig.play('lineup'); }
    FX.banners = []; FX.sub = null; FX.confetti = []; STADIUM.led.mode = 'ads';
    musicStop(); crowdRoar(1); crowdReact('wave');
    for (let i = 0; i < 3; i++) setTimeout(() => spawnFirework(), 500 + i * 500);
    G.game.cam.snap = true;
  });
}
function toTitle(first) {

    G.game.input.setMap(KEYMAP.solo);
    const M = G.match = new Match('attract'); M.dir = [1, -1];
    for (const p of G.players) p.human = null;
    M.setupKickoff(0, true);
    MENU.state = AU.on ? 'menu' : 'press'; MENU.logoT = 0; MENU.help = false;
    FX.banners = []; FX.sub = null; STADIUM.led.mode = 'ads';

}
function setPaused(on) {

  G.paused = on; MENU.pauseSel = 0;
  if (on) { G.savedScale = G.game.timeScale; G.game.timeScale = 0; for (const p of G.players) stopCharge(p); }

/* ---------- per-frame (wall clock) ---------- */
function frame(dt) {

  if (SESS.on) SESS.frame(dt);   // a session never pauses: no pause menu
  else if (G.mode === 'title') titleUpdate(dt);
  else if (G.paused) pauseUpdate();
  else if (G.match && !G.match.attract) {
    const srcs = G.humans.length ? G.humans.map(h => h.input) : [G.game.input];   // watch mode can still pause and quit
    if (G.match.state === 'play' || G.match.state === 'kickoff') for (const inp of srcs) if (inp.buffered('start', .1)) { inp.consume('start'); setPaused(true); break; }

  updateFx(dt); updateCutin(dt); updateCrowd(dt); updateGoals(dt);
  const Z = FX.zoom, sc = G.game.screen; sc.zoom = Z.cur;
  if (Z.cur > 1.001) { const b = G.ball, [x, y] = G.r.w(b.x, b.y, b.z); sc.zoomAt = [x, y]; } else sc.zoomAt = null;

/* ---------- fixed steps ---------- */

  const M = G.match;
  if (SESS.on) SESS.update(dt);
  else if (M) M.update(dt);

function camera(dt) {

  else if ((M.state === 'goal' || M.state === 'over') && M.focusP) { tx = M.focusP.x; ty = M.focusP.y - 10; sm = .35; }
  else if (M.state === 'kickoff' || M.state === 'halftime') { tx = PITCH.cx; ty = PITCH.cy; sm = .3; }
  else if (M.state === 'replay') return;
  else if (b.owner) { const o = b.owner; tx = o.x + Math.cos(o.facing) * 26 + o.vx * .25; ty = o.y + Math.sin(o.facing) * 14 + o.vy * .15; sm = .22; }
  else { tx = b.x + clamp(b.vx * .3, -90, 90); ty = b.y + clamp(b.vy * .18, -50, 50); tz = b.z * .3; sm = b.path ? .06 : .18; }

/* ---------- shadows: solid shapes on two layers, blended once (clean, crisp edges) ---------- */
const SHADOW = { flood: null, contact: null };

    let L = SHADOW[k];
    if (!L || L.cv.width !== r.bw || L.cv.height !== r.bh) { const cv = E.mkCanvas(r.bw, r.bh); L = SHADOW[k] = { cv, g: E.ctx2d(cv) }; }

}

function shadowBlob(r, x, y, rad) { px.poly(SHADOW.contact.g, r.groundPts(x, y, rad, 14), '#000000'); }

/* ---------- drawing ---------- */

  drawFloor(r);
  queueBoards(r); queueGoals(r); drawCrew(r, t);
  const b = G.ball;

  b.drawShadow(r);

  b.draw(r);
  r.overlay(g => {
    drawFxOverlay(g, r);

}

/* =============================================================================
 * 13 SESSION  online play in an AI Hub session (lib/hub/README.md): 1-4 friends,
 * each on their own device, one match. Only on when the hub opened the page.
 * -----------------------------------------------------------------------------
 * Who runs what (versus, in teams: seats 0 and 2 are the Flares, 1 and 3 the Bolts):
 *   - every copy runs the footballer its human controls, plus one it has just let
 *     go of until that kick or fall is over, so its own controls never wait;
 *   - the host's copy runs the rest: the ball, every AI footballer and keeper,
 *     the clock, the score, kick-offs and goals;
 *   - whatever a copy does not run is a puppet: drawn ~100 ms in the past (more
 *     on a slow link) between time-stamped samples (AIHub.time()), its moves
 *     replayed on its own rig, and still solid to the footballers this copy runs.
 * The ball: a copy whose footballer touches it (takes it, passes, shoots,
 * tackles, blocks) plays on with it at once and tells the host, which applies
 * the touch fast-forwarded to now unless someone else got there first (within
 * the moment that copy could not see yet). Every snapshot says who touched it
 * last, so a copy that lost a race goes back to the host's ball. Knocks and stumbles go to the copy that runs that
 * footballer. Messages (JSON, AIHub.send):
 *   's'   host -> all     snapshot, 15/s: match, ball, footballers, who runs whom   unreliable
 *   'h'   human -> all    the footballers that copy runs, 15/s                     unreliable
 *   'tc'  human -> host   a ball touch;  'gk' a throw or punt for its keeper       reliable
 *   'hit' any -> runner   a knock or stumble for a footballer the receiver runs    reliable
 *   'e'   host -> all     wipe + kick-off, goal, full time, cut-in, banners         reliable
 * No pause, no hit-stop, no slow motion and no replays in a session: goals hold
 * for a moment and the super shot's cut-in runs over a game that keeps going.
 * ============================================================================= */

      t: 's', at: nR(now, 1000), ko: this.ko,
      m: [Math.max(0, N_MS.indexOf(M.state)), nR(M.clock, 100), M.half, M.golden ? 1 : 0, M.score[0], M.score[1], nR(M.meter[0], 10), nR(M.meter[1], 10), M.dir[0], M.kickSide, M.sup ? 1 : 0, M.winner === undefined ? -2 : M.winner],
      b: [nR(b.x, 10), nR(b.y, 10), nR(b.z, 10), nR(b.vx, 10), nR(b.vy, 10), nR(b.vz, 10), b.owner ? b.owner.ni : -1, b.held ? 1 : 0, nR(b.heat, 100), b.fx ? N_SUP.indexOf(b.fx.type) : -1, nR(b.spin, 100),
        P ? [N_SUP.indexOf(P.type), ...P.S0.map(v => nR(v, 10)), ...P.T.map(v => nR(v, 10)), nR(P.dur, 1000), nR(now - b.path.t, 1000)] : 0],
      p: G.players.map(p => this.enc(p)),
      c: G.players.map(p => (p.human && p.human.seat !== undefined ? p.human.seat : -1)),
      ch: [0, 1].map(s => (TEAMAI[s].chaser ? TEAMAI[s].chaser.ni : -1)),
      tq: [this.tseq, this.tby, this.tseat], ack: this.ack, fx: this.fxq.splice(0),
      led: [L.mode, L.text || '', L.side, nR(Math.max(0, L.until - G.wall), 10)]
    }, { reliable: false });
  },
  sendMine() {
    if (!this.canSend(8) || !this.local) return;
    const f = [];
    for (const p of G.players) if (!p.net) f.push([p.ni, ...this.enc(p)]);
    this.tokens -= 1;
    AIHub.send({ t: 'h', at: nR(this.t(), 1000), ko: this.ko, c: this.local.player ? this.local.player.ni : -1, f }, { reliable: false });
  },
  onMessage(d, from) {
    if (this.ended || !d || typeof d !== 'object') return;
    if (d.t === 'h') this.onHuman(d, from);
    else if (d.t === 's') { if (!this.isHost && from === this.host) this.onSnap(d); }
    else if (d.t === 'tc') { if (this.isHost) this.onTouch(d, from); }
    else if (d.t === 'hit') this.onHit(d, from);
    else if (d.t === 'gk') { if (this.isHost && this.sideOf(from) === d.s) this.gkReq[d.s] = { pass: !!d.pass, shoot: !!d.shoot, dir: Array.isArray(d.dir) ? d.dir : null }; }
    else if (d.t === 'e') { if (!this.isHost && from === this.host) this.onEvent(d); }
  },
  /** a human's own footballers, straight from their copy */
  onHuman(d, from) {
    if (!Array.isArray(d.f)) return;
    this.lagSeen(from, d.at);
    const nh = this.humans.find(h => h.seat === from), newest = d.at >= (this.seatAt[from] || -1e9);
    if (newest) {
      this.seatAt[from] = d.at;
      const p = G.players[d.c];
      if (nh && p && !p.gk && nh.player !== p) {
        if (this.isHost ? !p.human || p.human === nh : p.human !== this.local) this.control(nh, p);
      }
    }
    const seen = new Set();
    for (const f of d.f) {
      const k = f[0], q = G.players[k]; if (!q || !Array.isArray(f)) continue;
      if (this.isHost && q.human && q.human.seat !== from) continue;   // run by someone else here
      seen.add(k);
      this.push(this.dirBuf[k] || (this.dirBuf[k] = []), d.at, f.slice(1), d.ko);
      if (newest) { this.dOwn[k] = from; if (this.isHost) this.auth[k] = { seat: from, at: this.t() }; }
    }
    if (newest) for (const k in this.dOwn) if (this.dOwn[k] === from && !seen.has(+k)) { delete this.dOwn[k]; if (this.auth[k] && this.auth[k].seat === from) delete this.auth[k]; }
  },
  /** h runs p now (kick-offs, and what the humans and the host say) */
  control(h, p) {
    if (!p || h.player === p) return;
    if (p.human && p.human !== h) { p.human.player = null; p.human = null; }
    if (h === this.local) h.setPlayer(p);
    else { if (h.player && h.player.human === h) h.player.human = null; h.player = p; p.human = h; }
  },
  /** two humans on a team split it: the first runs the right and the middle, the second the left */
  roles() {
    for (const side of [0, 1]) {
      const hs = this.humans.filter(h => h.side === side).sort((a, b) => a.seat - b.seat);
      hs.forEach((h, i) => { h.roles = hs.length > 1 ? (i ? ['FL', 'DL'] : ['FR', 'MC', 'DR']) : null; });
    }
  },
  /** the humans' footballers at a kick-off: the first of a team takes it (or sits in midfield), the second leads the line */
  assign(kickSide) {
    for (const side of [0, 1]) {
      const hs = this.humans.filter(h => h.side === side).sort((a, b) => a.seat - b.seat);
      hs.forEach((h, i) => this.control(h, G.players.find(q => q.side === side && q.role === (i ? 'FL' : side === kickSide ? 'FR' : 'MC'))));
    }
  },
  kickoffPlace(side, ko) {
    const M = G.match;
    for (const p of G.players) { p.superWait = 0; p.netBlend = null; }
    if (this.isHost) { M.setupKickoff(side, true); return; }   // lineup() moves the kick-off count on
    this.ko = ko; this.trim(); this.toHostBall(false);
    M.kickSide = side; G.ball.reset(PITCH.cx, PITCH.cy);
    for (const [p, x, y, f] of M.kickoffLayout(side)) {
      p.place(x, y, f); p.state = 'script'; p.target = [x, y, TUNE.runSpeed * 1.1]; p.scriptFace = f; p.charge = -1; p.face = 'normal'; p.stunT = 0;
      if (p.rig.act && p.rig.act.def.end === 'hold') p.rig.stop(.2);
    }
    this.assign(side);
    M.setState('kickoff'); M.sup = null; M.passTo = null; FX.cut = null;
  },
  onSnap(d) {
    if (!Array.isArray(d.p) || !Array.isArray(d.b)) return;
    this.lagSeen(this.host, d.at);
    for (let k = 0; k < 12; k++) if (d.p[k]) this.push(this.hostBuf[k] || (this.hostBuf[k] = []), d.at, d.p[k], d.ko);
    this.push(this.ballBuf, d.at, d.b, d.ko);
    if (d.at <= this.lastSnapAt) return;
    this.lastSnapAt = d.at;
    const M = G.match, m = d.m, L = this.local;
    if (d.ko >= this.ko && this.phase === 'live') {
      const st = N_MS[m[0]] || 'play';
      if (st !== M.state) this.clientState(st);
      const clk = m[1] + (st === 'play' ? Math.max(0, this.t() - d.at) : 0);
      M.clock = Math.abs(clk - M.clock) > 1 ? clk : M.clock + (clk - M.clock) * .2;
      M.half = m[2]; M.golden = !!m[3]; M.score = [m[4], m[5]]; M.meter = [m[6], m[7]]; M.dir = [m[8], -m[8]]; M.kickSide = m[9]; M.supOn = !!m[10]; if (m[11] > -2) M.winner = m[11];
    }
    // who runs whom: the host's own human, and a check that nobody else was given ours
    for (let k = 0; k < 12; k++) {
      const p = G.players[k];
      if (d.c[k] === this.host && this.host !== this.me) { const nh = this.humans.find(h => h.seat === this.host); if (nh && nh.player !== p && p.human !== L) this.control(nh, p); }
    }
    const mine = L.player;
    if (mine && d.c[mine.ni] >= 0 && d.c[mine.ni] !== this.me && this.t() - this.switchAt > .8) L.switchNext();
    for (let s = 0; s < 2; s++) TEAMAI[s].chaser = d.ch[s] >= 0 ? G.players[d.ch[s]] : null;
    const led = d.led; if (Array.isArray(led)) Object.assign(STADIUM.led, { mode: led[0], text: led[1], side: led[2], until: G.wall + led[3] });
    // the ball: keep ours while the host agrees it is ours
    const tq = d.tq, bo = d.b[6];
    if (this.mode === 'rcv') {
      if (tq[1] === this.rcv.p.ni) { this.mode = 'host'; this.seen = null; M.passTo = null; }   // they have it on the host too
      else if ((d.ack[this.me] || 0) >= this.touchN && tq[2] !== this.me) this.toHostBall(true);
    } else if (this.mode === 'me') {
      const done = (d.ack[this.me] || 0) >= this.touchN;
      const ours = tq[2] === this.me || (tq[1] >= 0 && !G.players[tq[1]].net && bo === tq[1]);
      if (done && !ours) this.toHostBall(true);
      else if (done) this.seen = d;
    } else if (bo >= 0 && !G.players[bo].net && !d.b[7] && (M.state === 'play' || M.state === 'kickoff') && d.ko >= this.ko) this.adopt(G.players[bo]);
    // what the host's crowd heard and saw (our own doings we already played)
    for (const f of d.fx || []) {
      if (f[0] === this.me) continue;
      if (f[1] === 's') { if (this.mode === 'me' && N_BALLSFX.has(f[2])) continue; if (f.length > 3) sfx(f[2], f[3]); else sfx(f[2]); }
      else if (f[1] === 'c') crowdReact(f[2], f[3] >= 0 ? f[3] : undefined);
      else if (f[1] === 'p') { if (this.mode === 'me' && (f[2] === 'POST!' || f[2] === 'CROSSBAR!')) continue; showPop(f[2], f[3], f[4], f[5], !!f[6]); }
    }
  },
  onEvent(d) {
    const M = G.match;
    if (d.e === 'ban' && Array.isArray(d.a)) showBanner(...d.a);
    else if (d.e === 'sub' && Array.isArray(d.a)) showSub(...d.a);
    else if (d.e === 'wipe') { M.dir = [d.dir, -d.dir]; M.half = d.half; M.setState('wait'); transition(() => { if (M.state === 'over' || this.ended) return; M.dir = [d.dir, -d.dir]; this.kickoffPlace(d.side, d.ko); }); }
    else if (d.e === 'cut') { const p = G.players[d.k]; if (p && p.net) { p.superWait = this.CUT; startCutin(p, this.CUT); } }
    else if (d.e === 'goal') {
      M.setState('goal'); M.sup = null; M.focusP = G.players[d.hero] || null;
      if (this.mode === 'me' && G.ball.owner && !G.ball.owner.net) this.toHostBall(true);
      fxGoal(G.ball, d.side); G.game.shake(7);
      this.celebrate(d.cel);
    } else if (d.e === 'over') {
      M.winner = d.w; M.setState('over'); M.focusP = null;
      if (G.ball.owner && !G.ball.owner.net) this.toHostBall(true);
      this.celebrate(d.cel);
    }
  },
  /** the host's celebrations for the footballers we run */
  celebrate(list) {
    for (const c of list || []) { const p = G.players[c[0]]; if (p && !p.net) { p.charge = -1; p.celebrate(c[1], c[2], c[3]); } }
  },
  /** a knock or stumble for a footballer another copy runs: send it there */
  hit(p, how, args) {
    const k = p.ni, to = this.isHost ? (this.auth[k] ? this.auth[k].seat : undefined) : this.dOwn[k] !== undefined ? this.dOwn[k] : this.host;
    if (to === undefined || to === this.me) return;
    this.sendR({ t: 'hit', k, how, a: args.map(v => (typeof v === 'number' ? nR(v, 1000) : !!v)) }, to);
  },
  onHit(d, from) {
    const p = G.players[d.k]; if (!p) return;
    if (p.net) { if (this.isHost && this.auth[d.k] && this.auth[d.k].seat !== from) this.sendR(d, this.auth[d.k].seat); return; }
    this.quiet = true;
    if (!this.isHost && G.ball.owner === p) this.toHostBall(false);   // whoever knocked us over has dealt with the ball
    if (d.how === 'knock') this.raw.knock.apply(p, Array.isArray(d.a) ? d.a : []); else this.raw.stumble.call(p);
    this.quiet = false;
  },
  keeperCmd(gk, pass, shoot, dir) {
    if (this.isHost) return;
    this.sendR({ t: 'gk', s: gk.side, pass: pass ? 1 : 0, shoot: shoot ? 1 : 0, dir: dir ? [nR(dir[0], 100), nR(dir[1], 100)] : null }, this.host);
  },
  onLeave(id) {
    const nh = this.humans.find(h => h.seat === id);
    if (nh && nh !== this.local) {
      if (nh.player && nh.player.human === nh) nh.player.human = null;   // their footballer goes back to the AI
      nh.player = null; this.humans = this.humans.filter(h => h !== nh); G.humans = G.humans.filter(h => h !== nh);
      this.roles();
    }
    for (const k in this.dOwn) if (this.dOwn[k] === id) delete this.dOwn[k];
    for (const k in this.auth) if (this.auth[k].seat === id) delete this.auth[k];
    if (this.isHost && !this.reported && this.count >= 2 && AIHub.players.length <= 1) { const M = G.match; if (M.state !== 'over') M.finish(); else this.report(M.winner); }
  },
  timeUp() {
    if (!this.isHost || this.reported) return;
    const M = G.match;
    if (M.state !== 'over') { M.goldenDone = true; M.finish(); } else this.report(M.winner === undefined ? -1 : M.winner);
  },
  onEnd() {
    this.ended = true; this.phase = 'ended'; this.outq.length = 0;
    musicStop();
    if (AU.ctx && AU.master) AU.master.gain.setTargetAtTime(0, AU.ctx.currentTime, .5);
  },
  /* ---------- the result ---------- */
  report(w) {
    if (!this.isHost || this.reported) return;
    this.reported = true;
    const M = G.match, ids = AIHub.players.map(p => p.id);
    const standings = ids.length <= 1 || !(w >= 0) ? [ids] : [ids.filter(id => this.sideOf(id) === w), ids.filter(id => this.sideOf(id) !== w)].filter(g => g.length);
    const scores = {}, stats = {};
    for (const id of ids) {
      const s = this.st[id] || {};
      scores[id] = M.score[this.sideOf(id)];
      stats[id] = { Goals: s.goals | 0, Shots: s.shots | 0, Assists: s.assists | 0, Tackles: s.tackles | 0, 'Super shots': s.supers | 0, Passes: s.passes | 0 };
    }
    AIHub.finish({ standings, scores, stats, awards: this.awards(ids) });
  },
  awards(ids) {
    const M = G.match, out = [], st = id => this.st[id] || {};
    const most = key => Math.max(0, ...ids.map(id => st(id)[key] | 0));
    const mg = most('goals'), ma = most('assists'), mt = most('tackles');
    const n = (v, one, many) => v + ' ' + (v === 1 ? one : many);
    for (const id of ids) {
      const s = st(id), side = this.sideOf(id), mine = [];
      if (s.goals >= 3) mine.push({ title: 'Hat-trick', detail: n(s.goals, 'goal', 'goals') + ' in one match' });
      if (this.superGoal[id]) mine.push({ title: 'Super shot', detail: 'Scored with the ' + this.superGoal[id] });
      if (M.score[1 - side] === 0) mine.push({ title: 'Clean sheet', detail: 'The team let nothing in' });
      if (s.assists >= 1 && s.assists === ma) mine.push({ title: 'Playmaker', detail: n(s.assists, 'assist', 'assists') });
      if (s.tackles >= 3 && s.tackles === mt) mine.push({ title: 'Brick wall', detail: n(s.tackles, 'tackle', 'tackles') + ' won' });
      if (s.goals >= 1 && s.goals < 3 && s.goals === mg) mine.push({ title: 'Top scorer', detail: n(s.goals, 'goal', 'goals') });
      if (!mine.length && s.supers >= 1) mine.push({ title: 'Fever pitch', detail: n(s.supers, 'super shot', 'super shots') });
      for (const a of mine.slice(0, 3)) out.push(Object.assign({ id }, a));
    }
    return out;
  },

  /* ---------- drawing ---------- */
  drawTag(g, h, x, y) {
    const name = String(h.name || '').toUpperCase().slice(0, 16), w = E.font.width(name);
    tiny(g, name, Math.round(x - w / 2), y - 10, h.color);
  },
  ring(r, p, t) {
    const col = p.human.color, x = p.x, y = p.y, mine = p.human === this.local, R = mine ? 9 + Math.sin(t * 6) * .6 : 8.5;
    r.queue(x, y, 0, g => {   // on the grass, over the shadows, under the footballer
      px.col(g, col);
      for (const rad of [R, R + .8]) for (let i = 0; i < 40; i++) { const a = i / 40 * TAU, s = r.w(x + Math.cos(a) * rad, y + Math.sin(a) * rad, 0); g.fillRect(Math.round(s[0]), Math.round(s[1]), 1, 1); }
    }, { bias: -.06 });
  },
  drawOverlay(g, r) {
    const W = r.W, H = r.H, t = G.wall;
    if (this.phase === 'connecting') { txt(g, 'CONNECTING', W / 2, H / 2, { color: '#a79cc0', outline: PAL.ink, align: 'center' }); return; }
    if (this.phase === 'lobby' || this.phase === 'ready') {
      dim(g, W, H, .45);
      drawBanner(g, 'BLAZE CUP', W / 2, 36, { s: 4, grad: GRAD.fire, outline: PAL.ink, ow: 2, italic: .8, shadow: '#000000', sx: 2, sy: 3 });
      const hs = this.humans, pw = 236, ph = 24 + hs.length * 14, x = Math.round(W / 2 - pw / 2), y = 66;
      panel(g, x, y, pw, ph, .82);
      txt(g, 'ONLINE MATCH', W / 2, y + 6, { color: '#ffd24a', outline: PAL.ink, align: 'center' });
      hs.forEach((h, i) => {
        const yy = y + 21 + i * 14, tm = TEAMS[h.side];
        px.rect(g, x + 9, yy, 7, 7, h.color);
        txt(g, h.name + (h === this.local ? ' (YOU)' : ''), x + 21, yy, { color: '#f4ecd8', outline: PAL.ink });
        txt(g, tm.name, x + pw - 9, yy, { color: tm.light, outline: PAL.ink, align: 'right' });
      });
      const lobby = this.phase === 'lobby', msg = lobby ? 'PRESS ANY KEY, CLICK OR TAP WHEN READY' : 'READY! WAITING FOR THE OTHERS';
      if (!lobby || Math.floor(t * 2.4) % 2) txt(g, msg, W / 2, y + ph + 12, { color: lobby ? '#ffd24a' : '#9affb0', outline: PAL.ink, align: 'center' });
      const keys = 'WASD/ARROWS MOVE  J PASS  K SHOOT/TACKLE  L JUMP  SHIFT SPRINT';
      tiny(g, keys, Math.round(W / 2 - E.font.width(keys) / 2), y + ph + 30, '#c8c0dc');
      return;
    }
    if (this.phase === 'countdown') {
      const n = Math.ceil(-AIHub.time() / 1000);
      if (n >= 1 && n <= 3) drawBanner(g, String(n), W / 2, H / 2 + 40, { s: 6, grad: GRAD.gold, outline: PAL.ink, ow: 2, shadow: '#000000', sx: 2, sy: 3 });
    }
  },

  /* ---------- hooks into the game (session mode only) ---------- */
  install() {
    const N = this;
    const fPlay = Footballer.prototype.play, fStop = Footballer.prototype.stop;
    Footballer.prototype.play = function (name, opts) { const a = fPlay.call(this, name, opts); if (a && !this._rep) this.netA = { n: (this.netN = (this.netN || 0) + 1), name, o: netOpts(opts) }; return a; };
    Footballer.prototype.stop = function (blend) { const had = !!this.act; fStop.call(this, blend); if (had && !this._rep) this.netA = { n: (this.netN = (this.netN || 0) + 1), name: '', o: 0 }; };
    const pKnock = Player.prototype.knock, pStumble = Player.prototype.stumble, pCeleb = Player.prototype.celebrate, pTake = Player.prototype.takeBall, pBlock = Player.prototype.block;
    N.raw = { knock: pKnock, stumble: pStumble };
    Player.prototype.knock = function (...a) { if (N.on && this.net) return N.hit(this, 'knock', a); return pKnock.apply(this, a); };
    Player.prototype.stumble = function () { if (N.on && this.net) return N.hit(this, 'stumble', []); return pStumble.call(this); };
    Player.prototype.celebrate = function (kind, tx, ty) { if (N.on && this.net) { if (N.isHost) N.cel.push([this.ni, kind, nR(tx, 10), nR(ty, 10)]); return; } return pCeleb.call(this, kind, tx, ty); };
    Player.prototype.takeBall = function (how) { pTake.call(this, how); if (N.on) N.touched(this); };
    Player.prototype.block = function () { pBlock.call(this); if (N.on) N.touched(this); };
    const bKick = Ball.prototype.kick, bPath = Ball.prototype.launchPath;
    Ball.prototype.kick = function (vx, vy, vz, spin, by) { bKick.call(this, vx, vy, vz, spin, by); if (N.on && by) N.touched(by); };
    Ball.prototype.launchPath = function (fn, dur, fx, by) { bPath.call(this, fn, dur, fx, by); if (N.on && by) N.touched(by); };
    // the host shares what its crowd sees and hears
    const sb = showBanner, ss = showSub, sp = showPop, sf = sfx, cr = crowdReact;
    const trim = a => { a = a.slice(); while (a.length && a[a.length - 1] === undefined) a.pop(); return a; };
    showBanner = (...a) => { sb(...a); if (N.on && N.isHost && !N.noRep && N.started()) N.event({ e: 'ban', a: trim(a) }); };
    showSub = (...a) => { ss(...a); if (N.on && N.isHost && !N.noRep && N.started()) N.event({ e: 'sub', a: trim(a) }); };
    showPop = (text, x, y, z, big) => { sp(text, x, y, z, big); if (N.on) N.fx(['p', text, nR(x, 10), nR(y, 10), nR(z, 10), big ? 1 : 0]); };
    sfx = (name, arg) => {
      sf(name, arg);
      if (N.on && N.isHost && N_REPSFX.has(name)) { if (arg === undefined) N.fx(['s', name]); else if (typeof arg === 'number' || typeof arg === 'string') N.fx(['s', name, typeof arg === 'number' ? nR(arg, 100) : arg]); }
    };
    crowdReact = (kind, side) => { cr(kind, side); if (N.on) N.fx(['c', kind, side === undefined ? -1 : side]); };
  }
});

function boot() {
  if (QS.has('lab')) return bootLab();
  if (QS.has('stadium')) return bootStadium();
  bootGame();
  devApi();
  if (QS.has('play')) setTimeout(() => { audioResume(); startGame(QS.get('play') || '1p'); }, 50);
}
boot();

})();
</script>
