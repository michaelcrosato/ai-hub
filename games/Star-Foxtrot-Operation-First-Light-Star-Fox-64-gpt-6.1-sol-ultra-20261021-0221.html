    this.sky = this.mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false }), this.scene, [0, 0, -350]);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffedbe, fog: false });
    this.mesh(this.geometries.sphere, sunMat, this.scene, [-420, 175, -1450], [112, 112, 35]);
    const haloMat = new THREE.MeshBasicMaterial({ color: 0xffd19a, transparent: true, opacity: .2, side: THREE.DoubleSide, fog: false, depthWrite: false });
    this.mesh(new THREE.CircleGeometry(158, 64), haloMat, this.scene, [-420, 175, -1480]);
    const planetMat = new THREE.MeshStandardMaterial({ color: 0xc5928e, roughness: 1, flatShading: false, fog: false });
    const planet = this.mesh(this.geometries.sphere, planetMat, this.scene, [530, 410, -1900], [210, 210, 210]);
    planet.castShadow = false;
    planet.receiveShadow = false;
    planet.rotation.z = -.5;
    const planetRing = this.mesh(new THREE.TorusGeometry(294, 6, 4, 128), new THREE.MeshBasicMaterial({ color: 0xe5b4a0, transparent: true, opacity: .65, fog: false }), planet);
    // This ring is in world units rather than inheriting the sphere's scale.
    planet.remove(planetRing);
    this.scene.add(planetRing);
    planetRing.position.copy(planet.position);
    planetRing.rotation.set(1.13, -.35, -.4);
    this.arch = new THREE.Group();
    this.arch.position.set(35, -106, -1270);
    this.arch.rotation.z = -.12;
    this.scene.add(this.arch);
    const archDark = new THREE.MeshStandardMaterial({ color: 0x536b69, metalness: .35, roughness: .7, fog: false, flatShading: true });
    const archLight = new THREE.MeshStandardMaterial({ color: 0xf6d4a6, metalness: .2, roughness: .7, fog: false });
    this.mesh(new THREE.TorusGeometry(415, 19, 5, 100, Math.PI * 1.34), archDark, this.arch);
    this.mesh(new THREE.TorusGeometry(415, 7, 4, 100, Math.PI * 1.34), archLight, this.arch, [0, 0, 18]);
    this.mesh(new THREE.TorusGeometry(394, 2.4, 4, 100, Math.PI * 1.34), new THREE.MeshBasicMaterial({ color: 0xb1ffe7, fog: false }), this.arch, [0, 0, 13]);
    for (let i = 0; i < 23; i++) {
      const angle = i * Math.PI * 1.34 / 23;
      const rib = this.box(this.arch, archDark, [Math.cos(angle) * 415, Math.sin(angle) * 415, 10], [37, 7, 56]);
      rib.rotation.z = angle;
      if (i % 4 === 0) {
        const plate = this.box(this.arch, archLight, [Math.cos(angle) * 435, Math.sin(angle) * 435, 6], [22, 27, 63]);
        plate.rotation.z = angle;
      }
    }
    // Distant islands use their own flat colours so the skyline reads cleanly.
    const distantMat = new THREE.MeshBasicMaterial({ color: 0xb28b85, fog: false });
    for (let i = 0; i < 21; i++) {
      const x = (i - 10) * 115;
      this.mesh(this.geometries.ico, distantMat, this.scene, [x, -23, -1000 - hash(i + 8) * 140], [95 + hash(i) * 80, 25 + hash(i + 1) * 85, 60]);
    }
    // Painted horizontal clouds, deliberately sparse and enormous.
    const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffdfb6, transparent: true, opacity: .24, fog: false, depthWrite: false });
    for (let i = 0; i < 9; i++) {
      this.mesh(this.geometries.sphere, cloudMat, this.scene, [(hash(i + 80) - .5) * 2200, 150 + hash(i + 90) * 330, -1660], [130 + hash(i) * 200, 6 + hash(i + 3) * 10, 20]);
    }
  }

  buildSea() {
    const geo = new THREE.PlaneGeometry(2300, 2300, 65, 65);
    geo.rotateX(-Math.PI / 2);
    const p = geo.attributes.position;
    const colors = [];
    const a = new THREE.Color(0x268e92), b = new THREE.Color(0x55c3b4);
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i);
      const t = .48 + .18 * Math.sin(x * .017 + z * .01) + .12 * Math.cos(z * .043);
      const c = a.clone().lerp(b, t);
      colors.push(c.r, c.g, c.b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    this.waterMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness: .3, metalness: .34, flatShading: true });
    this.water = this.mesh(geo, this.waterMaterial, this.scene, [0, -12, -800]);
    this.water.castShadow = false;
    this.water.receiveShadow = true;
    const glintMaterial = new THREE.MeshBasicMaterial({ color: 0xc9ead1, transparent: true, opacity: .38, side: THREE.DoubleSide, depthWrite: false });
    this.glints = [];
    for (let i = 0; i < 115; i++) {
      const g = this.mesh(this.geometries.box, glintMaterial, this.scene, [(hash(i * 3 + 7) - .5) * 700, -11.91, -hash(i * 3 + 8) * 1100], [2 + hash(i) * 17, .025, .1 + hash(i + 2) * .35]);
      this.glints.push({ mesh: g, z: g.position.z });
    }
  }

  rock(parent, seed, x, z, radius, height) {
    const group = new THREE.Group();
    group.position.set(x, -13, z);
    parent.add(group);
    const h = height;
    const rock = this.mesh(this.geometries.ico, 'shadow', group, [0, h * .35, 0], [radius, h * .72, radius * .7]);
    rock.rotation.y = hash(seed + 1) * TAU;
    const mid = this.mesh(this.geometries.ico, 'rock', group, [.3, h * .66, .6], [radius * .91, h * .49, radius * .64]);
    mid.rotation.y = rock.rotation.y + .14;
    const top = this.mesh(this.geometries.ico, 'coral', group, [-.5, h * .91, -.4], [radius * .74, h * .28, radius * .57]);
    top.rotation.y = rock.rotation.y;
    const cap = this.mesh(new THREE.CylinderGeometry(radius * .48, radius * .65, 1.2, 6), 'sand', group, [0, h * 1.06, 0], [1, 1, .75]);
    cap.rotation.y = rock.rotation.y;
    for (let k = 0; k < 3; k++) {
      const band = this.mesh(new THREE.CylinderGeometry(radius * (.78 - k * .05), radius * (.8 - k * .05), .26, 6), k === 1 ? 'shadow' : 'sand', group, [0, h * (.47 + k * .2), 0], [1, 1, .73]);
      band.rotation.y = rock.rotation.y;
    }
    return group;
  }

  buildScenery() {
    for (let i = 0; i < 58; i++) {
      const sign = i % 2 ? 1 : -1;
      const baseZ = 50 - Math.floor(i / 2) * 43;
      const x = sign * (48 + hash(i + 101) * 88);
      const group = new THREE.Group();
      group.position.z = baseZ;
      this.scene.add(group);
      const radius = 8 + hash(i + 2) * 18, height = 9 + hash(i + 4) * 37;
      const mesa = this.rock(group, i, x, 0, radius, height);
      if (i % 3 === 0) this.rock(group, i + 80, x + sign * radius, -12, radius * .6, height * .7);
      // Salt foam makes the giant blocks feel seated in the sea.
      const foam = this.mesh(new THREE.TorusGeometry(radius * .95, .22, 3, 16), new THREE.MeshBasicMaterial({ color: 0xb7e0c6, transparent: true, opacity: .5 }), group, [x, -11.8, 0], [1, .7, 1]);
      foam.rotation.x = Math.PI / 2;
      if (i % 2 === 0) {
        const ruin = new THREE.Group();
        ruin.position.set(x, -13 + height * 1.08, 0);
        ruin.rotation.y = hash(i + 23) * TAU;
        group.add(ruin);
        this.box(ruin, 'ruinDark', [0, 1.5, 0], [7, 3, 6]);
        this.box(ruin, 'ruin', [-2, 8, 0], [2.6, 13, 2.8], -.09);
        this.box(ruin, 'ruin', [2, 6.5, 0], [2.2, 10, 2.8], .1);
        this.box(ruin, 'ruin', [0, 12, 0], [6, 2, 3]);
        this.box(ruin, 'cyan', [-2, 7, 1.46], [.2, 9, .12]);
        this.box(ruin, 'orange', [0, 12, 1.56], [4.5, .35, .1]);
        this.mesh(this.geometries.oct, 'cyan', ruin, [0, 7, 0], [.65, 1.2, .65]);
      }
      if (i % 4 === 1) {
        // Wind-carved needle rocks hover around the ancient gravity relays.
        for (let k = 0; k < 3; k++) {
          const crystal = this.mesh(this.geometries.oct, k === 1 ? 'sand' : 'rock', group, [x - sign * 12, 4 + k * 6, -k * 7], [1.8 + k, 3 + k, 2]);
          crystal.rotation.z = .3 + k * .2;
        }
      }
      this.scenery.push({ group, baseZ, side: sign, mesa, tech: false });
    }
    this.techScenery = [];
    for (let i = 0; i < 18; i++) {
      const group = new THREE.Group();
      const sign = i % 2 ? 1 : -1;
      const x = sign * (27 + hash(i + 300) * 32);
      const baseZ = -i * 78 - 60;
      group.position.set(x, -12, baseZ);
      group.visible = false;
      this.scene.add(group);
      const h = 18 + hash(i + 40) * 28;
      this.box(group, 'dark', [0, h * .5, 0], [7, h, 8]);
      this.box(group, 'ruin', [0, h * .5, 4.15], [5.3, h * .93, .45]);
      this.box(group, 'cyan', [0, h * .55, 4.5], [.4, h * .7, .2]);
      this.box(group, 'orange', [0, h - 1, 4.5], [6, 1.3, .2]);
      this.box(group, 'dark', [-sign * 3, h - 3, 0], [15, 3, 5]);
      this.mesh(this.geometries.oct, 'cyan', group, [0, h + 3, 0], [2.5, 3.5, 2.5]);
      for (let k = 0; k < 4; k++) this.box(group, 'steel', [0, 3 + k * 8, 4.5], [9, .45, .5]);
      this.techScenery.push({ group, baseZ });
    }
    this.motes = [];
    for (let i = 0; i < 32; i++) {
      const mesh = this.mesh(this.geometries.oct, i % 3 ? 'sand' : 'cyan', this.scene, [(hash(i + 5) - .5) * 260, 5 + hash(i + 9) * 65, -hash(i + 11) * 900], [.14, .14, .14]);
      this.motes.push({ mesh, z: mesh.position.z, y: mesh.position.y, phase: hash(i) * TAU });
    }
  }

  makeShip(kind = 'player') {
    const ship = new THREE.Group();
    const accent = kind === 'wingman' ? 'cyan' : 'orange';
    this.prism([[0, -3.7], [.67, -1], [.82, 1.8], [.45, 2.5], [-.45, 2.5], [-.82, 1.8], [-.67, -1]], .8, 'ivory', ship);
    this.prism([[0, -3.8], [.24, -1.5], [.2, 1.9], [-.2, 1.9], [-.24, -1.5]], .13, accent, ship, .45);
    for (const sign of [-1, 1]) {
      const wing = [[sign * .55, -1.2], [sign * 4.5, 1.1], [sign * 4.1, 1.85], [sign * 1, 1.2]];
      this.prism(wing, .23, 'ivory', ship, -.05);
      this.prism([[sign * 1.2, -.6], [sign * 3.9, 1.05], [sign * 3.35, 1.15], [sign * 1.1, .3]], .025, accent, ship, .085);
      this.prism([[sign * .9, .8], [sign * 3.9, 1.5], [sign * 3.4, 2], [sign * 1, 1.65]], .17, 'dark', ship, -.12);
      const pod = this.mesh(this.geometries.cylinder, 'dark', ship, [sign * 1.3, -.02, 1.15], [.44, 2.35, .44]);
      pod.rotation.x = Math.PI / 2;
      const sleeve = this.mesh(this.geometries.cylinder, 'ivory', ship, [sign * 1.3, .02, .72], [.48, 1.5, .48]);
      sleeve.rotation.x = Math.PI / 2;
      this.mesh(new THREE.TorusGeometry(.32, .09, 5, 12), 'cyan', ship, [sign * 1.3, -.02, 2.35]);
      this.box(ship, accent, [sign * 4.1, .09, 1.32], [.5, .22, .5]);
      this.box(ship, 'cyan', [sign * 4.37, .1, 1.29], [.18, .13, .28]);
      const fin = this.prism([[0, -.55], [1.6, .75], [1.3, 1.7], [0, 1.65]], .15, 'ivory', ship);
      fin.rotation.z = sign * -.95;
      fin.position.set(sign * 1.1, .24, .3);
      this.box(ship, 'dark', [sign * 3.1, -.12, .2], [.14, .16, 1.7]);
      this.mesh(this.geometries.sphere, 'white', ship, [sign * 3.1, -.1, -.7], [.11, .11, .1]);
    }
    this.mesh(this.geometries.sphere, 'glass', ship, [0, .64, -.55], [.59, .54, 1.22]);
    this.box(ship, 'dark', [0, .93, -.5], [.075, .08, 1.75]);
    this.box(ship, 'cyan', [0, 1.02, -.6], [.035, .025, .9]);
    this.box(ship, accent, [0, .28, 2.1], [.65, .2, .35]);
    ship.scale.setScalar(.65);
    ship.userData.flames = [];
    for (const sign of [-1, 1]) this.addFlame(ship, sign * 1.3, -.02, 2.65, 'cyan', 1);
    this.craft.push(ship);
    return ship;
  }

  addFlame(group, x, y, z, material = 'hot', direction = -1) {
    const flame = this.mesh(this.geometries.cone, material, group, [x, y, z], [.3, 1.4, .3]);
    flame.rotation.x = direction === 1 ? Math.PI / 2 : -Math.PI / 2;
    const core = this.mesh(this.geometries.cone, 'white', group, [x, y, z - .1 * direction], [.16, .85, .16]);
    core.rotation.x = flame.rotation.x;
    group.userData.flames ||= [];
    group.userData.flames.push(flame, core);
  }

  makeEnemy(type = 'fighter') {
    const enemy = new THREE.Group();
    enemy.userData.flames = [];
    if (type === 'mine') {
      this.mesh(this.geometries.ico, 'wine', enemy, [0, 0, 0], [1.55, 1.55, 1.55]);
      this.mesh(new THREE.TorusGeometry(1.6, .12, 4, 16), 'hot', enemy);
      const ring = this.mesh(new THREE.TorusGeometry(1.6, .09, 4, 16), 'hot', enemy);
      ring.rotation.y = Math.PI / 2;
      for (let i = 0; i < 6; i++) {
        const angle = i * TAU / 6;
        const spike = this.mesh(this.geometries.cone, 'orange', enemy, [Math.cos(angle) * 1.8, Math.sin(angle) * 1.8, 0], [.38, 1.1, .38]);
        spike.rotation.z = angle - Math.PI / 2;
      }
      this.mesh(this.geometries.sphere, 'hot', enemy, [0, 0, 1.25], [.6, .6, .55]);
    } else if (type === 'turret') {
      this.mesh(this.geometries.cylinder, 'dark', enemy, [0, -.6, 0], [2.7, 1, 2.7]);
      this.mesh(this.geometries.ico, 'red', enemy, [0, .4, 0], [1.8, 1.4, 1.5]);
      for (const sign of [-1, 1]) {
        this.box(enemy, 'dark', [sign * .8, .5, 2], [.45, .45, 3.8]);
        this.box(enemy, 'hot', [sign * .8, .5, 3.8], [.5, .5, .2]);
      }
      this.mesh(this.geometries.sphere, 'hot', enemy, [0, .8, 1.3], [.4, .2, .2]);
    } else if (type === 'carrier' || type === 'heavy') {
      this.prism([[-4, -2], [4, -2], [5, 1.2], [2.8, 3], [-2.8, 3], [-5, 1.2]], 2, 'wine', enemy);
      this.box(enemy, 'red', [0, 1, 0], [3.5, 1, 4]);
      this.box(enemy, 'hot', [0, .3, 3.03], [3.7, .3, .12]);
      for (const sign of [-1, 1]) {
        this.box(enemy, 'dark', [sign * 3.7, 0, -.8], [2.1, 2.7, 5]);
        this.box(enemy, 'orange', [sign * 3.7, 1.4, -.3], [1.5, .3, 3]);
        this.addFlame(enemy, sign * 3.7, 0, -3.6, 'hot');
      }
      enemy.scale.setScalar(.7);
    } else {
      this.prism([[0, 3.1], [1.1, .3], [.8, -2], [-.8, -2], [-1.1, .3]], .8, 'wine', enemy);
      for (const sign of [-1, 1]) {
        this.prism([[sign * .5, .6], [sign * 4.2, 2.4], [sign * 3.2, -.8], [sign * 1, -1.7]], .27, 'red', enemy, -.1);
        this.prism([[sign * 1, .7], [sign * 3.8, 2.05], [sign * 3, 1.7], [sign * .8, .1]], .06, 'orange', enemy, .1);
        this.box(enemy, 'dark', [sign * 2.5, -.1, .1], [.35, .45, 3.3]);
        this.box(enemy, 'hot', [sign * 2.5, -.1, 1.85], [.32, .3, .2]);
        this.addFlame(enemy, sign * .65, 0, -2.5, 'pink');
      }
      this.mesh(this.geometries.sphere, 'hot', enemy, [0, .5, .8], [.48, .23, .75]);
      const fin = this.box(enemy, 'dark', [0, 1, -1], [.22, 1.6, 1.3]);
      fin.rotation.x = -.3;
      enemy.scale.setScalar(type === 'interceptor' ? .57 : .65);
    }
    this.craft.push(enemy);
    return enemy;
  }

  makeBoss() {
    const boss = new THREE.Group();
    boss.userData.flames = [];
    this.prism([[-5, -9], [5, -9], [7, -2], [4, 7], [0, 10], [-4, 7], [-7, -2]], 5.4, 'dark', boss);
    this.prism([[-4, -6], [4, -6], [4.8, -1], [2, 6], [-2, 6], [-4.8, -1]], .8, 'red', boss, 2.85);
    for (const sign of [-1, 1]) {
      this.prism([[sign * 3, -6], [sign * 17, -7], [sign * 25, -1], [sign * 21, 4], [sign * 5, 4]], 2.6, 'wine', boss, -.6);
      this.prism([[sign * 4, -5], [sign * 16, -6], [sign * 22, -1], [sign * 19, 1], [sign * 6, 2]], .55, 'red', boss, .98);
      this.prism([[sign * 16, -6], [sign * 24, -1], [sign * 22, 1], [sign * 17, -2]], .3, 'orange', boss, 1.4);
      this.box(boss, 'dark', [sign * 10, -.3, .5], [6.3, 5.3, 9]);
      this.box(boss, 'steel', [sign * 10, 2.7, -.8], [6.7, .5, 7]);
      this.box(boss, 'orange', [sign * 10, 3.1, -1.4], [5.5, .25, 4]);
      for (let k = 0; k < 3; k++) this.box(boss, 'dark', [sign * (16 + k * 2), -.2, 3.6], [.9, .9, 3.2]);
      for (let k = 0; k < 4; k++) this.box(boss, 'hot', [sign * (6.8 + k * 1.6), 1.3, 4.1], [.7, .2, .12]);
      this.addFlame(boss, sign * 10, 0, -6.9, 'hot');
      this.addFlame(boss, sign * 4, 0, -10, 'pink');
      const fin = this.box(boss, 'dark', [sign * 15, 3.3, -4], [1, 7, 5]);
      fin.rotation.z = sign * -.5;
      this.box(boss, 'orange', [sign * 16.1, 6.3, -4], [.5, 1.5, 4.6], sign * -.5);
    }
    this.box(boss, 'dark', [0, 4.3, -3.5], [3.1, 4, 6]);
    this.box(boss, 'hot', [0, 5.3, -.4], [2, .4, .2]);
    const cores = [];
    for (const [x, y, z] of [[-10, 0, 3], [0, 3, 0], [10, 0, 3]]) {
      const core = new THREE.Group();
      core.position.set(x, y, z);
      boss.add(core);
      const housing = this.mesh(this.geometries.cylinder, 'dark', core, [0, 0, .45], [2.6, 1, 2.6]);
      housing.rotation.x = Math.PI / 2;
      const rim = this.mesh(new THREE.TorusGeometry(2.05, .32, 6, 24), 'orange', core, [0, 0, 1.1]);
      this.mesh(new THREE.TorusGeometry(1.6, .13, 4, 24), 'ivory', core, [0, 0, 1.3]);
      const reactor = this.mesh(this.geometries.sphere, new THREE.MeshStandardMaterial({ color: 0x9effdf, emissive: 0x49ffd7, emissiveIntensity: 1.8, roughness: .3, metalness: .1 }), core, [0, 0, 1.25], [1.4, 1.4, .45]);
      this.mesh(this.geometries.oct, 'white', core, [0, 0, 1.65], [.6, .8, .2]);
      for (let k = 0; k < 4; k++) {
        const angle = k * Math.PI / 2 + .4;
        const brace = this.box(core, 'dark', [Math.cos(angle) * 2, Math.sin(angle) * 2, 1.5], [1.6, .4, .4]);
        brace.rotation.z = angle;
      }
      // Each reactor is a separately damageable object. Its materials belong to
      // that reactor, including the otherwise shared armour and emissive trim.
      core.traverse(child => {
        if (!child.isMesh) return;
        child.material = Array.isArray(child.material) ? child.material.map(material => material.clone()) : child.material.clone();
      });
      const shield = new THREE.Group();
      shield.position.z = 2.1;
      core.add(shield);
      const shieldMaterial = new THREE.MeshBasicMaterial({ color: 0x88cee0, transparent: true, opacity: .19, side: THREE.DoubleSide, depthWrite: false });
      this.mesh(new THREE.CircleGeometry(2.55, 32), shieldMaterial, shield);
      this.mesh(new THREE.TorusGeometry(2.6, .105, 4, 32), new THREE.MeshBasicMaterial({ color: 0x78b6ce, transparent: true, opacity: .8, depthWrite: false }), shield);
      const grilleMaterial = new THREE.MeshBasicMaterial({ color: 0x49798b, transparent: true, opacity: .78, depthWrite: false });
      for (let k = -1; k <= 1; k++) this.box(shield, grilleMaterial, [0, k * 1.1, .04], [k === 0 ? 4.9 : 4.2, .11, .06]);
      core.userData.radius = 2.3;
      core.userData.exposed = x !== 0;
      core.userData.reactor = reactor;
      core.userData.rim = rim;
      core.userData.shield = shield;
      core.userData.shieldMaterial = shieldMaterial;
      cores.push(core);
    }
    boss.userData.cores = cores;
    this.craft.push(boss);
    return boss;
  }

  explosion(position, color = 0xffa255, scale = 1) {
    const group = new THREE.Group();
    group.position.copy(position);
    this.scene.add(group);
    const material = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
    const white = new THREE.MeshBasicMaterial({ color: 0xfff3c5, transparent: true, opacity: 1 });
    const dark = new THREE.MeshStandardMaterial({ color: 0x784348, transparent: true, opacity: 1, flatShading: true });
    const particles = [];
    for (let i = 0; i < 27; i++) {
      const phi = Math.random() * TAU, y = Math.random() * 2 - 1;
      const radius = Math.sqrt(1 - y * y);
      const velocity = new THREE.Vector3(Math.cos(phi) * radius, y, Math.sin(phi) * radius).multiplyScalar((5 + Math.random() * 17) * scale);
      const size = (.1 + Math.random() * .45) * scale;
      const mesh = this.mesh(i % 4 ? this.geometries.spark : this.geometries.ico, i % 5 === 0 ? dark : i % 3 ? material : white, group, [0, 0, 0], [size, size * (1 + Math.random() * 2), size]);
      particles.push({ mesh, velocity, spin: new THREE.Vector3(Math.random(), Math.random(), Math.random()).multiplyScalar(8) });
    }

  ui.update({shield:this.health/100,energy:this.energy/100,bombs:this.bombs,score:this.stats.score,kills:this.stats.kills,combo:1+Math.min(4,Math.floor(this.stats.combo/5)),progress:Math.min(1,this.time/MISSION.bossAt),chapter:this.bossStarted?'04 / THE WARDEN':this.time>=140?'03 / CITADEL':this.time>=75?'02 / '+(this.route==='UNDECIDED'?'THE FORK':this.route):'01 / CORAL COAST',objective:this.bossDefeated?'Regroup with your squadron':this.bossStarted?this.phase===0?'DESTROY THE OUTER CORES':'DESTROY THE REACTOR':this.time>=100&&this.time<121&&this.rescueKills<3?`RESCUE ROOK • ${this.rescueKills}/3`:'BREAK THE BLOCKADE',speed:Math.round(this.speed*11),charge:this.charge,lock:this.lock,rollCooldown:1-this.rollCD/1.4,supportCooldown:1-this.supportCD/(this.helped?22:32),bossHP:this.bossStarted&&!this.bossDefeated?bossRemaining/this.bossMax:null,bossName:'WARDEN / BLOCKADE FLAGSHIP',warning:this.health<25?'SHIELD CRITICAL':boosting&&this.energy<15?'ENERGY LOW':'',attract:this.demo,timer:this.time,inputMode,route:this.route,wingHealth:this.squadHealth/100,help:this.time<14?'STEER • HOLD FIRE TO CHARGE • RELEASE TO LOCK SHOT':this.time<27?'ROLL THROUGH RED FIRE TO REFLECT IT':this.time>76&&this.time<90?'LEFT GATE: CANYON • RIGHT GATE: WRECKFIELD':'',reticle:{x:clamp((proj.x+1)/2,.05,.95),y:clamp((1-proj.y)/2,.08,.9)},flash:this.flash});
  audio.update(dt,{playing:true,boss:this.bossStarted,boost:boosting,health:this.health/100,attract:this.demo});
  if(this.bossDefeated){this.victoryTime+=dt;if(this.victoryTime<5&&Math.random()<dt*8)this.art.explosion(this.boss.position.clone().add(v3((Math.random()-.5)*30,(Math.random()-.5)*14,0)),0xffa050,3);if(this.victoryTime>4)this.boss.visible=false;if(this.victoryTime>9)this.finish();}
  if(this.demo&&this.bossStarted&&this.bossTimer>55&&!this.bossDefeated)this.defeatBoss();
 }
 collide(a,b){
  if(!a.active||!b.active)return;
  let shot=a.type==='shot'||a.type==='hostile'?a:b.type==='shot'||b.type==='hostile'?b:null;const other=shot===a?b:a;
  if(shot){
   if(shot.type==='shot'&&other.type==='enemy'){
    const at=other.mesh.position.clone();this.damageEnemy(other,shot.damage,at);
    if(shot.charged)for(const e of [...this.entities])if(e!==other&&e.active&&e.hp>0&&this.targetPosition(e).distanceTo(at)<12)this.damageEnemy(e,4,this.targetPosition(e));
    this.disposeEntity(shot);
   }else if(shot.type==='hostile'&&other.type==='player'){
    if(this.rollTime>0){const p=shot.mesh.position.clone();let target=this.findTarget()||this.entities.find(e=>e.active&&e.hp>0&&!(e.coreIndex===1&&this.phase===0));const vel=target?this.targetPosition(target).sub(p).normalize().multiplyScalar(170):v3(0,0,-170);this.spawnProjectile(p,vel,false,true,target,3);this.stats.score+=25;audio.sfx('roll',.25);}else this.hurt(13);
    this.disposeEntity(shot);
   }else if(shot.type==='shot'&&other.type==='obstacle'){this.art.explosion(shot.mesh.position,0xffd38b,.3);this.disposeEntity(shot);}
  }else if(a.type==='player'||b.type==='player'){const hazard=a.type==='player'?b:a;if(hazard.type==='enemy'){this.hurt(22);if(hazard.coreIndex===undefined)this.damageEnemy(hazard,20,hazard.mesh.position);}if(hazard.type==='obstacle'){this.hurt(28);this.velocity.x=-this.velocity.x*.6;}}
 }
}

async function boot(){
 try{
  if(!navigator.gpu)throw new Error('WebGPU is required. Open this game in a WebGPU-enabled browser on HTTPS or localhost.');
  const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});if(!adapter)throw new Error('No WebGPU adapter was found. Enable hardware acceleration and reopen the game.');
  ui.setLoading('IGNITING THE REACTOR');await RAPIER.init();
  const renderer=new THREE.WebGPURenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer._getFallback=null;
  renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
  await renderer.init();if(!renderer.backend.isWebGPUBackend)throw new Error('This demo requires the WebGPU backend.');
  document.getElementById('flight-scene').appendChild(renderer.domElement);engine=new FlightEngine(renderer);
  addEventListener('resize',()=>{engine.camera.aspect=innerWidth/innerHeight;engine.camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  let last=performance.now(),accumulator=0;ready=true;ui.ready();
  renderer.setAnimationLoop(now=>{
   try{
    const dt=Math.min(.12,Math.max(.001,(now-last)/1000));last=now;attractSuppress-=dt;
    const control=pollPad(dt);menuIdle+=dt;
    if(engine.mode==='title'&&['title','settings','howto','about'].includes(ui.screen)&&menuIdle>=10)engine.start(true);
    accumulator+=dt;while(accumulator>=1/60){engine.step(1/60,control);accumulator-=1/60;}
    renderer.render(engine.scene,engine.camera);edges.clear();
   }catch(error){renderer.setAnimationLoop(null);audio.pause();ui.show('error',{title:'A flight system could not continue.',message:error.message});console.error(error);}
  });
 }catch(error){ready=false;ui.ready();ui.show('error',{message:error.message});console.error(error);}
}
boot();
