<!--
Source Information
Date: 2026-10-29 15:53
Source: Final Fantasy X
Game: Final Dawn X · an original spiritual successor
Tech: Three.js 0.180.0 (r180), WebGPU exclusively; Rapier 3D 0.19.3 (WASM); Gamepad API; JavaScript ES modules; HTML/CSS; esbuild 0.25.12 for packaging.
Art Direction: Stylized cel shading, stepped lighting, original low-poly character models, sculpted tropical archipelago, luminous spirit effects.
Animation: Procedural joint hierarchies, locomotion cycles, battle poses, swaying foliage, particles, animated sky-ray summon and currentball.
Audio: Original runtime Web Audio score: bells, harp-like tones, pads, bass, ocean ambience and battle/action effects. No recorded music or voice.
Online: AI Hub Session Protocol v1, unmodified client 1.3.0. 1–4 player pilgrimage time trial with live interpolated ghost rivals, readiness, progress, results and departure handling. Invitations belong to AI Hub.
Testing: Efficient, lightweight checks: battle simulations, targeted Chromium WebGPU gameplay, controller emulation, AI Hub protocol harness, responsive phone/tablet/wide layouts and WebKit unsupported-state verification. No FPS targets or optimization audit.
Environment: Codex CLI (headless); Linux; browser unknown.
Model: OpenAI, gpt-6.1-sol, reasoning effort ultra.
Usage: Estimated API cost: unknown. Tokens: unknown. Session time: approximately 26 minutes.
Title selection: 50 candidates silently brainstormed; selected by Python secrets.randbelow, a real system random source.

Testing Feedback
Issues caught: 15 functional/UX findings caught and corrected during integration review and browser checks; details in TESTING.md. Final journey 26/26, AI Hub standard 26/26, player departure 26/26, final layout/capability 9/9.
Critical / game breaking: 2, both fixed: stale combat effects could stop the animation loop, and dismissing a mandatory result could strand an ended battle. Final browser runs had no runtime errors.
Most helpful test: The complete journey verified progression through the ending and optional sport; the real two-player hub harness verified controller input, shared-clock behavior, poor network conditions and departure handling.
Least helpful test: A render check with the wrong software Vulkan adapter produced blank screenshots; selecting the working WebGPU adapter made it useful.

Engine Feedback
What worked best?: Three.js scene graphs and toon materials made a coherent original island, expressive assembled characters, and spell effects straightforward to build.
Where did you get stuck or guess wrong?: The first headless WebGPU adapter configuration returned blank frames. Explicit software Vulkan adapter selection resolved it. Three.js automatically offers WebGL fallback, which had to be disabled to meet this prompt.
Most important custom system?: The conditional-turn scheduler and action forecast, plus controller focus, exploration state, dialogue, progression, saving and session lifecycle.
Hardest engine task?: Keeping a tactical simulation, continuous 3D animation, controller navigation, and a shared online clock consistent across menus and encounters.
What would you remove or overhaul?: Make WebGPU-only initialization an explicit public option instead of automatically constructing a fallback backend.
One engine improvement?: First-class controller focus and narrative/turn-based game tooling alongside the excellent rendering primitives.

Prompt Feedback
What did you like most?: The controller-first direction, concrete single-file delivery, original spiritual-successor scope, and mandatory attract mode gave the slice a clear identity.
What was confusing?: “ALL features” does not define the size of an RPG. The implementation treats it as every system in a complete authored chapter; additional chapters use the same data and engine.
What was hardest?: Joining exploration, tactical combat, a temple trial, progression, optional sport, narrative and multiplayer into one coherent short pilgrimage.
One additional test?: A complete playthrough on a television using a physical DualSense, including disconnecting and reconnecting during a battle menu.
-->

    seed: 0,
    limitMs: 0,
    round: 0,

    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */

    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;

  }

  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {

    return Object.prototype.hasOwnProperty.call(o, k);
  }

  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

      } catch (e) {}

    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });

      emit('time-up', [{ graceMs: m.graceMs }]);

  hub.connect = function (opts) {

    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });

  if (sport.shot) return;
  const accuracy = (Math.sin(t * 3.5) + 1) / 2, good = accuracy >= 0.38 && accuracy <= 0.62;
  const points = sport.charge;
  sport.charge = 0;
  sport.shot = { at: t, start: new THREE2.Vector3(player.x, 2.5, player.z - 65), end: new THREE2.Vector3(sport.goalX + (good ? 0 : 3), 3, -9), good, points };
  audio.sfx("attack");
}
function finishSport() {
  if (!sport || overlay === "sportResult") return;
  sport.time = 0;
  if (sport.score >= 5 && !game.flags.sport) {
    game.flags.sport = true;
    game.relics.push("Champion Ribbon");
    game.pearls += 75;
    sport.reward = true;
    save();
  }
  overlay = "sportResult";
  focusIndex = 0;
  audio.sfx(sport.score >= 5 ? "victory" : "confirm");
  renderUI();
}
function leaveSport() {
  player = { ...sport.return };
  mode = "explore";
  overlay = null;
  sportGroup.visible = false;
  world.heroes.forEach((g) => g.visible = true);
  body.setTranslation({ x: player.x, y: 0.95, z: player.z }, true);
  audio.setScene("shore");
  sport = null;
  save();
  renderUI();
}
function updateSport(dt, input) {
  const can = !overlay && !dialogue;
  sport.dashCd = Math.max(0, sport.dashCd - dt);
  sport.dash = Math.max(0, sport.dash - dt);
  sport.tackleCd = Math.max(0, sport.tackleCd - dt);
  if (can) {
    sport.time -= dt;
    const speed = sport.dash > 0 ? 16 : 6;
    player.x += input.x * dt * speed;
    player.z += input.y * dt * speed;
    const d = Math.hypot(player.x, player.z - 65);
    if (d > 10.8) {
      player.x *= 10.8 / d;
      player.z = 65 + (player.z - 65) * 10.8 / d;
    }
    moving = Math.hypot(input.x, input.y) > 0.1;
    if (moving) player.yaw = Math.atan2(input.x, input.y);
  }
  const goal = sportGroup.userData.goal;
  goal.position.x = Math.sin(t * 0.7) * 2.2;
  sport.goalX = goal.position.x;
  goal.rotation.z = t * 0.35;
  const defender = sportGroup.userData.defender;
  defender.position.set(Math.sin(t * 0.65) * 6, 2.5, Math.cos(t * 0.85) * 5);
  defender.rotation.y = t * 0.6;
  if (can && Math.hypot(player.x - defender.position.x, player.z - 65 - defender.position.z) < 1.6 && sport.tackleCd <= 0 && sport.dash <= 0) {
    sport.charge = Math.max(0, sport.charge - 1);
    sport.tackleCd = 2;
    audio.sfx("hit");
    toast("Tackled \xB7 One charge lost", 1.4);
  }
  for (const p of sportGroup.userData.pearls) {
    p.mesh.visible = t >= p.at;
    p.mesh.rotation.y = t;
    p.mesh.position.y = 2.4 + Math.sin(t * 2 + p.mesh.position.x) * 0.2;
    if (can && p.mesh.visible && sport.charge < 3 && Math.hypot(player.x - p.mesh.position.x, player.z - 65 - p.mesh.position.z) < 1.3) {
      p.at = t + 5;
      sport.charge++;
      audio.sfx("confirm");
    }
  }
  const ball = sportGroup.userData.ball;
  if (sport.shot) {
    const f = clamp2((t - sport.shot.at) / 0.55, 0, 1);
    ball.visible = true;
    ball.position.lerpVectors(sport.shot.start, sport.shot.end, f);
    ball.position.y += Math.sin(f * Math.PI);
    if (f >= 1) {
      if (sport.shot.good) {
        sport.score += sport.shot.points;
        sport.best = Math.max(sport.best, sport.shot.points);
        toast("GOAL \xB7 +" + sport.shot.points, 1.5);
        audio.sfx("victory");
        world.effect("heal", new THREE2.Vector3(sport.goalX, 3, 56));
      } else {
        toast("Just wide \xB7 Time the green band", 1.5);
        audio.sfx("cancel");
      }
      sport.shot = null;
    }
  } else {
    ball.visible = sport.charge > 0;
    ball.position.set(player.x + 0.6, 2.8, player.z - 65);
  }
  world.heroes[0].position.set(player.x, 1.7, player.z);
  world.heroes[0].rotation.y = player.yaw;
  world.heroes[0].rotation.x = -0.28;
  if (sport.time <= 0 && !overlay) finishSport();
}
function startAttract() {
  attractSnapshot = { game: JSON.parse(JSON.stringify(game)), player: { ...player } };
  attract = true;
  attractStage = 0;
  attractWait = 0;
  attractTick = 0;
  newGame(true);
  game.flags.guide = true;
  game.flags.summon = true;
  game.party.forEach((h) => h.overdrive = 100);
  bannerUntil = 0;
  renderUI();
}
function stopAttract() {
  attract = false;
  if (attractSnapshot) {
    game = attractSnapshot.game;
    player = attractSnapshot.player;
  }
  attractSnapshot = null;
  overlay = null;
  dialogue = null;
  battle = null;
  world.setBattle(false);
  sportGroup.visible = false;
  summonGroup.visible = false;
  world.heroes.forEach((g) => {
    g.visible = true;
    g.rotation.x = 0;
  });
  title();
}
function updateAttract(dt) {
  attractTick += dt;
  attractWait += dt;
  const moveTo = (x, z) => {
    const dx = x - player.x, dz = z - player.z, len = Math.hypot(dx, dz);
    if (len < 0.5) {
      moving = false;
      return true;
    }
    player.x += dx / len * dt * 4;
    player.z += dz / len * dt * 4;
    player.yaw = Math.atan2(dx, dz);
    moving = true;
    return false;
  };
  if (mode === "battle") {
    game.party.forEach((h) => {
      h.hp = h.maxHp;
      h.mp = h.maxMp;
    });
    if (battle.phase === "command" && attractTick > 0.9) {
      attractTick = 0;
      if (battle.turn % 5 === 2) battle.swap();
      if (game.flags.summon && !battle.summonUsed && battle.turn >= 3) battle.choose("summon");
      else battle.auto();
      syncBattleModels();
    }
    if (overlay === "victory" && attractWait > 2) {
      attractWait = 0;
      const k = currentBattleKind;
      leaveBattle();
      attractStage = k === "shore" ? 2 : k === "reef" ? 4 : 8;
    }
    if (overlay === "defeat") {
      healParty();
      startBattle(currentBattleKind);
    }
    return;
  }
  if (attractStage === 0 && moveTo(-5, 14)) {
    attractStage = 1;
    attractWait = 0;
  } else if (attractStage === 1 && moveTo(6, 4)) {
    attractWait = 0;
    startBattle("shore");
  } else if (attractStage === 2 && moveTo(-8, -6)) {
    attractWait = 0;
    startBattle("reef");
  } else if (attractStage === 4 && moveTo(0, -16)) {
    game.stones = [1, 2, 0];
    attractStage = 5;
    attractWait = 0;
    summonGroup.visible = true;
    summonStart = t;
  } else if (attractStage === 5 && attractWait > 4 && moveTo(0, -23)) {
    attractWait = 0;
    game.party.forEach((h) => h.overdrive = 100);
    startBattle("boss");
  } else if (attractStage === 8 && attractWait > 7) {
    const snapshot = attractSnapshot;
    newGame(true);
    attractSnapshot = snapshot;
    game.flags.guide = true;
    game.flags.summon = true;
    game.party.forEach((h) => h.overdrive = 100);
    attractStage = 0;
    attractWait = 0;
  }
}
function updateExploration(dt, input, canMove) {
  if (!attract) {
    moving = canMove && Math.hypot(input.x, input.y) > 0.05;
    if (canMove) {
      cameraYaw -= input.rx * dt * 1.4 * settings.cameraSpeed;
      cameraTilt = clamp2(cameraTilt + input.ry * dt * 0.7, -0.5, 0.65);
      const speed = input.sprint ? 7 : 4.2, dx = (input.x * Math.cos(cameraYaw) + input.y * Math.sin(cameraYaw)) * speed * dt, dz = (input.y * Math.cos(cameraYaw) - input.x * Math.sin(cameraYaw)) * speed * dt;
      controller.computeColliderMovement(collider, { x: dx, y: -0.08, z: dz });
      const v = controller.computedMovement(), p2 = body.translation();
      const nx = clamp2(p2.x + v.x, -23, 23), nz = clamp2(p2.z + v.z, -27, 25);
      body.setNextKinematicTranslation({ x: nx, y: Math.max(0.93, p2.y + v.y), z: nz });
      if (moving) player.yaw = Math.atan2(dx, dz);
    }
    physics.timestep = Math.min(dt, 0.033);
    physics.step();
    const p = body.translation();
    player.x = p.x;
    player.z = p.z;
  }
  for (let i = 0; i < world.heroes.length; i++) {
    const g = world.heroes[i];
    g.visible = true;
    g.rotation.x = 0;
    if (i === 0) {
      g.position.x = player.x;
      g.position.z = player.z;
      g.rotation.y = player.yaw;
    } else {
      const side = i % 2 ? 1 : -1, behind = 1.2 + i * 0.55;
      const tx = player.x - Math.sin(player.yaw) * behind + Math.cos(player.yaw) * side * 0.6, tz = player.z - Math.cos(player.yaw) * behind - Math.sin(player.yaw) * side * 0.6;
      g.position.x += (tx - g.position.x) * Math.min(1, dt * 5);
      g.position.z += (tz - g.position.z) * Math.min(1, dt * 5);
      g.rotation.y = player.yaw;
    }
  }
  nearest = null;
  let dist = Infinity;
  for (const o of world.interactives) {
    if (o.id === "chest" && game.flags.chest) continue;
    if (o.id === "shore" && game.flags.shore) continue;
    if (o.id === "reef" && game.flags.reef) continue;
    const d = Math.hypot(player.x - o.x, player.z - o.z);
    if (d < (o.radius || 2.8) && d < dist) {
      nearest = o;
      dist = d;
    }
  }
  world.worldEnemies[0].visible = !game.flags.shore;
  world.worldEnemies[1].visible = !game.flags.reef;
}
var cameraDest = new THREE2.Vector3();
var cameraLook = new THREE2.Vector3();
var actualLook = new THREE2.Vector3(0, 2, -6);
function updateCamera(dt) {
  if (mode === "title") {
    const sway = settings.reducedMotion ? 0 : Math.sin(t * 0.05) * 1.5;
    cameraDest.set(34 + sway, 21, 36);
    cameraLook.set(0, 3, -5);
  } else if (mode === "battle") {
    const boss = currentBattleKind === "boss";
    cameraDest.set(boss ? 15 : 12, boss ? 12 : 10, boss ? 23 : 20);
    cameraLook.set(0, boss ? 1.7 : 1, 0);
  } else if (mode === "sport") {
    cameraDest.set(0, 23, 83);
    cameraLook.set(0, 1.7, 63);
  } else {
    const distance = innerWidth < 600 ? 17 : 14;
    cameraDest.set(player.x + Math.sin(cameraYaw) * distance, 9.5 + cameraTilt * 7, player.z + Math.cos(cameraYaw) * distance);
    cameraLook.set(player.x, 1, player.z - 1);
  }
  if (!last || settings.reducedMotion) {
    camera.position.copy(cameraDest);
    actualLook.copy(cameraLook);
  } else {
    const f = 1 - Math.exp(-dt * 3);
    camera.position.lerp(cameraDest, f);
    actualLook.lerp(cameraLook, f);
  }
  camera.lookAt(actualLook);
}
function updateBattleVisuals() {
  if (!battle) return;
  syncBattleModels();
  if (battleAction) {
    const age = t - battleAction.at;
    const id = battleAction.actor, hi = game.party.findIndex((h) => h.id === id), ei = battle.enemies.findIndex((e) => e.id === id);
    const model = hi >= 0 ? world.heroes[hi] : world.enemies[ei];
    if (model && age < 0.65) {
      const s = Math.sin(clamp2(age / 0.65, 0, 1) * Math.PI);
      model.position.x += (hi >= 0 ? 1 : -1) * s * 1.4;
      const arms = model.userData.arms;
      if (arms) arms[1].rotation.x = -s * 1.7;
    }
    if (age > 1) battleAction = null;
  }
}
function updateGhosts() {
  for (const [id, p] of online.peers) {
    let g = ghosts.get(id);
    if (!g) {
      g = world.addGhost(id, p.color);
      ghosts.set(id, g);
    }
    g.visible = p.visible && mode === "explore";
    g.position.set(p.x, p.y || 0, p.z);
    g.rotation.y = p.yaw;
  }
  for (const [id] of ghosts) if (!online.peers.has(id)) {
    world.removeGhost(id);
    ghosts.delete(id);
  }
}
function frame(now) {
  const dt = Math.min((now - (last || now)) / 1e3, 0.05);
  last = now;
  t += dt;
  const input = pollInput(dt);
  if (overlay && Math.abs(input.ry) > 0.1 && $(".window-body")) $(".window-body").scrollTop += input.ry * dt * 550;
  if (mode === "title" && !overlay && !attract && performance.now() - lastInput > 1e4 && !online.active) startAttract();
  const canPlay = !hubStopped && online.canPlay;
  const simulating = canPlay && (online.active || !overlay && !dialogue) && mode !== "title" && mode !== "unsupported";
  if (simulating) {
    simTime += dt;
    if (game && !attract) game.playtime += dt;
  }
  if (attract) updateAttract(dt);
  if (mode === "explore") updateExploration(dt, input, canPlay && !overlay && !dialogue && !attract);
  if (mode === "battle" && battle) {
    if (canPlay && (online.active || !overlay && !dialogue)) battle.tick(dt);
  }
  world.update(dt, t, { mode, player, moving, stones: game?.stones, battle, attract });
  if (mode === "battle") updateBattleVisuals();
  if (mode === "sport" && sport) updateSport(canPlay && (online.active || !overlay) ? dt : 0, input);
  if (summonGroup.visible) {
    const age = t - summonStart;
    summonGroup.position.set(Math.sin(age * 0.7) * 2, 5 + Math.sin(age * 0.8) * 1, mode === "battle" ? 0 : -16);
    summonGroup.rotation.y = age * 0.18;
    summonGroup.userData.wings.forEach((w, i) => w.rotation.z = Math.sin(age * 3) * (i === 0 ? 1 : -1) * 0.2);
    if (age > 5) summonGroup.visible = false;
  }
  updateCamera(dt);
  updateGhosts();
  const probeScene = hubStopped || online.finished ? "over" : mode === "title" ? "title" : !canPlay && online.active ? "ready" : overlay ? "menu" : "play";
  online.setProbe(probeScene, !!overlay, simTime, lastControls);
  if (game) online.update({ x: player.x, y: 0, z: player.z, yaw: player.yaw, stage: game.stage, score: (game.flags.shore ? 100 : 0) + (game.flags.reef ? 150 : 0) + (game.flags.summon ? 200 : 0) + (game.flags.boss ? 500 : 0) + Math.max(0, 16 - player.z) * 0.3, label: game.flags.boss ? "Dawn reached" : stageTitle() }, dt);
  uiTimer += dt;
  if (uiTimer > 0.15) {
    uiTimer = 0;
    if (!overlay && !dialogue && mode !== "title") renderUI();
    else if (toastUntil && toastUntil < t) {
      toastUntil = 0;
      renderUI();
    }
  }
  damageFloats = damageFloats.filter((e) => t - e.at < 1.3);
  const layer = $("#damage-layer");
  if (layer && damageFloats.length) {
    layer.innerHTML = damageFloats.map((e) => {
      const v = entityPosition(e.target).project(camera);
      return `<span class="damage-float" style="left:${(v.x * 0.5 + 0.5) * 100}%;top:${(-v.y * 0.5 + 0.5) * 100}%;animation-delay:-${t - e.at}s;color:${e.good ? "#b4f4c3" : "#fff0b3"}">${e.text}</span>`;
    }).join("");
  }
  if (screenFlash > 0) {
    screenFlash -= dt;
    if (!settings.reducedMotion) $("#vignette").style.backgroundColor = `rgba(230,223,173,${screenFlash * 0.35})`;
  } else $("#vignette").style.backgroundColor = "";
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function resize() {
  if (!camera || !renderer) return;
  camera.aspect = innerWidth / innerHeight;
  camera.fov = innerWidth < 600 ? 58 : 45;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
window.addEventListener("resize", resize);
renderUI();
boot();
