function render(){ctx.save();if(state.shake>0&&!settings.reduceFlash)ctx.translate(rand(-1,1)*state.shake*9,rand(-1,1)*state.shake*9);sky();terrain();const gameplay=['play','boss','attract','paused','dead'].includes(mode);if(gameplay){const entities=[...enemies.map(v=>({z:v.z,f:()=>drawEnemy(v)})),...rings.map(v=>({z:v.z,f:()=>drawRing(v)})),...hazards.map(v=>({z:v.z,f:()=>drawHazard(v)})),...pickups.map(v=>({z:v.z,f:()=>{if(v.z<0)return;const p=project(v.x,v.y+Math.sin(v.age*3)*.2,v.z),color=v.type==='repair'?'#a4ffec':'#ffcd77';glow(p.x,p.y,p.s*.6,color+'44');poly([{x:p.x,y:p.y-p.s*.4},{x:p.x+p.s*.4,y:p.y},{x:p.x,y:p.y+p.s*.4},{x:p.x-p.s*.4,y:p.y}],color,'#fff3db');text(v.type==='repair'?'+':'II',p.x,p.y+4,12,'#133645')}}))];if(boss)entities.push({z:boss.z,f:drawBoss});if(state.time>109&&state.time<139)entities.push({z:65,f:()=>{drawShip(Math.sin(total)*1.5,1.1,65,.8,.12);const p=project(Math.sin(total)*1.5,2.3,65);text('VALE',p.x,p.y,11,state.rescued?'#a3ffdf':'#ffbd8c')}});entities.sort((a,b)=>b.z-a.z).forEach(e=>e.f());for(const s of shots){if(s.z<0)continue;const p=project(s.x,s.y,s.z),p2=project(s.x,s.y,s.z-2.4);line([p,p2],s.color,Math.max(s.lance?3:1.7,p.s*(s.lance?.14:.04)));if(s.lance)glow(p.x,p.y,p.s*.4,'#ffd07666')}for(const b of bolts){if(b.z<0)continue;const p=project(b.x,b.y,b.z);glow(p.x,p.y,Math.max(4,p.s*.4),b.reflected?'#84fff388':'#ff795d66');circle(p.x,p.y,Math.max(2,p.s*b.r),b.reflected?'#bcfff0':'#ffc2a5')}for(const p of particles){if(p.z<0)continue;const q=project(p.x,p.y,p.z);ctx.globalAlpha=clamp(p.life/p.max,0,1);circle(q.x,q.y,Math.max(1,q.s*p.size),p.color)}ctx.globalAlpha=1;reticle();const bank=player.roll>0?player.rollDir*(1-player.roll/.62)*TAU:player.bank+Math.sin(total*2)*.025;ctx.globalAlpha=player.inv>0&&Math.sin(total*36)>.2?.55:1;drawShip(player.x*.57,player.y*.45-2.5,.6,1.05,bank);ctx.globalAlpha=1;for(const t of flyText){const p=project(t.x,t.y,13);ctx.globalAlpha=Math.min(1,t.life);text(t.text,p.x,p.y,16,t.color)}ctx.globalAlpha=1;if(state.speed>1.3){ctx.strokeStyle='#96fff344';ctx.lineWidth=1;for(let i=0;i<24;i++){const a=i*2.4+total*.2,r=(i*83+total*450)%(W*.75),cx=W*.5+Math.cos(a)*r,cy=H*.48+Math.sin(a)*r;line([{x:cx,y:cy},{x:cx+Math.cos(a)*40,y:cy+Math.sin(a)*40}],'#9cefe333')}}if(state.bombFlash>0){ctx.fillStyle=settings.reduceFlash?'rgba(95,203,211,'+state.bombFlash*.12+')':'rgba(201,255,238,'+state.bombFlash*.65+')';ctx.fillRect(0,0,W,H);circle(W/2,H/2,(1-state.bombFlash)*W,null,'#cdfff0',4)}}else{drawShip(4.3+Math.sin(total*.4)*.25,-.3+Math.sin(total*.7)*.2,2,1.55,-.24+Math.sin(total*.4)*.06);drawShip(8,1,45,.85,-.2);drawShip(3,3,70,.9,.2);const p=project(4.2,-2.2,1);text('KESTREL  /  M-07',p.x,p.y,11,'#9fc9c9');line([{x:p.x-50,y:p.y-16},{x:p.x+100,y:p.y-16}],'#8eeedb66',1)}ctx.restore();const vg=ctx.createRadialGradient(W*.5,H*.4,H*.2,W*.5,H*.5,Math.max(W,H)*.7);vg.addColorStop(0,'transparent');vg.addColorStop(1,'#000b1799');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#dcf9e506';for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);}
