<svg xmlns="http://www.w3.org/2000/svg" width="840" height="540" viewBox="0 0 840 540" role="img" aria-labelledby="title description">
  <title id="title">Original return label and seal worksheet</title>
  <desc id="description">Box A-62. Seal digits 3, 1, 4. Multiply each digit by its position 1, 2, 3, add, then keep the units digit. Return slip reads 00:18.</desc>
  <rect width="840" height="540" rx="18" fill="#e7decb"/>
  <path d="M34 32h772v476H34z" fill="none" stroke="#726655" stroke-width="2"/>
  <path d="M34 115h772M34 398h772" stroke="#a79b86"/>
  <g font-family="monospace" fill="#243e46">
    <text x="65" y="77" font-size="30" letter-spacing="4">BELLWETHER MUNICIPAL ARCHIVE</text>
    <text x="65" y="159" font-size="19">RETURN LABEL / BOX A-62 / RECEIPT 00:18</text>
    <text x="65" y="204" font-size="15">SEAL DIGITS</text>
    <g font-size="76" text-anchor="middle"><text x="180" y="293">3</text><text x="414" y="293">1</text><text x="648" y="293">4</text></g>
    <g fill="none" stroke="#8b7960" stroke-width="2"><rect x="112" y="220" width="136" height="96"/><rect x="346" y="220" width="136" height="96"/><rect x="580" y="220" width="136" height="96"/></g>
    <g font-size="19" text-anchor="middle"><text x="180" y="355">POSITION ×1</text><text x="414" y="355">POSITION ×2</text><text x="648" y="355">POSITION ×3</text></g>
    <text x="65" y="443" font-size="19">MULTIPLY BY POSITION. ADD. KEEP THE UNITS DIGIT.</text>
    <text x="65" y="478" font-size="15">Original inspection artwork · Dead Letter authoring example</text>
  </g>
  <path d="M727 118l29 17-7 37-36 7-21-30z" fill="none" stroke="#8e5943" stroke-width="3"/>
</svg>
