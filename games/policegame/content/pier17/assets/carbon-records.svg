<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="title desc">
  <title id="title">Q-52 receiving records</title>
  <desc id="desc">The signed original records M-318 RETURN at 21:42. The gate receipt is 21:46. The folded carbon was made at 22:02. M-314 is a different crate.</desc>
  <rect width="900" height="550" rx="12" fill="#10242b"/>
  <text x="36" y="45" fill="#e5bd79" font-family="sans-serif" font-size="18" letter-spacing="3">HARBOR TRANSFER / DOCUMENT COMPARISON</text>
  <g font-family="sans-serif">
    <rect x="36" y="77" width="394" height="321" rx="4" fill="#e9e0c9"/>
    <text x="60" y="112" font-size="16" fill="#47554f">SIGNED ORIGINAL · RECEIVING DESK</text>
    <path d="M60 130H406" stroke="#728475"/>
    <text x="60" y="168" font-size="28" fill="#172e31">Q-52 / M-318</text>
    <rect x="60" y="190" width="128" height="43" fill="none" stroke="#33635b" stroke-width="3"/>
    <text x="75" y="219" font-size="23" fill="#28544a">RETURN</text>
    <text x="60" y="270" font-size="19" fill="#233b3e">Received: 21:42</text>
    <text x="60" y="309" font-size="19" fill="#233b3e">Gate receipt: 21:46</text>
    <text x="60" y="370" font-size="16" fill="#47554f">Source and clerk reference retained</text>
    <rect x="470" y="77" width="394" height="321" rx="4" fill="#c8d2c8"/>
    <text x="494" y="112" font-size="16" fill="#47554f">DESK CARBON · FOLD RETAINED</text>
    <path d="M494 130H840" stroke="#728475"/>
    <text x="494" y="168" font-size="28" fill="#172e31">Q-52 / M-318</text>
    <path d="M484 185L851 209L838 247L484 216Z" fill="#a5b3aa" stroke="#778f82"/>
    <text x="494" y="270" font-size="19" fill="#233b3e">Copy made: 22:02</text>
    <text x="494" y="309" font-size="19" fill="#233b3e">Run reference: PIER 17</text>
    <text x="494" y="370" font-size="16" fill="#47554f">Direction hidden by the original fold</text>
    <path d="M80 442H820" stroke="#e5bd79" stroke-width="2"/>
    <g fill="#e5bd79"><circle cx="80" cy="442" r="5"/><circle cx="450" cy="442" r="5"/><circle cx="820" cy="442" r="5"/></g>
    <g font-size="18" fill="#e9e0c9"><text x="36" y="477">21:42 / RETURN</text><text x="358" y="477">21:46 / GATE</text><text x="704" y="477">22:02 / COPY</text></g>
    <text x="36" y="523" fill="#abc1b4" font-size="16">Compare the full serial. M-318 is not M-314. Keep all source pages.</text>
  </g>
</svg>
