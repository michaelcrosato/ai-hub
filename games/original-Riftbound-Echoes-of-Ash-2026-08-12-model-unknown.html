e prison he volunteered to tend for one night.",beat:"SEL: \u2018I answered the thirteenth toll. Rusk made sure there would never be a fourteenth answer.\u2019",aftermath:"The bronze opens around Sel without releasing the dark. For the first time in thirteen years, brother and sister remember the same room.",mastery:{kind:"perfectBlocks",target:2,reward:18,label:"ANSWER IN KIND",copy:"Fully block two enemy intents."},intents:[{name:"Keeper's Burden",damage:20},{name:"Thirteen Years",damage:16,focusDrain:1},{name:"Bell-Heart Pulse",damage:23,pierce:5}]},{id:"rusk",chapter:"RECKONING \xB7 THE THIRTEENTH TOLL",name:"PRIOR AMON RUSK",kind:"THE REDACTOR \xB7 LVL 7",sigil:"R",hp:220,xp:220,gold:90,objective:"Survive the Thirteenth Toll",entry:"Rusk closes the Archive and draws a blade made from erased testimony.",beat:"RUSK: \u2018You know enough truth to hate me. Do you know enough to replace the wall?\u2019",aftermath:"Rusk's blade unthreads into names. The Bell opens, and each name pulls in a different direction.",mastery:{kind:"bursts",target:2,reward:24,label:"NAME THE PATTERN",copy:"Trigger two Resonance eruptions."},phaseThreshold:110,intents:[{name:"Thirteenth Toll",damage:21},{name:"Redactor's Vow",damage:17,focusDrain:1},{name:"The Final Line",damage:25,pierce:7}],phaseTwoIntents:[{name:"Namebreak",damage:20,focusDrain:1},{name:"Black Witness",damage:19,repeatPunish:6},{name:"Fourteenth Toll",damage:23,pierce:7}],narrativeBeats:[{threshold:165,text:"RUSK: The Council voted. Sel signed. You volunteered. MARA: None of those sentences mean what you made them mean."},{threshold:86,text:"THE BELL: TRANSFER ORDER \u2014 RESTORE SIX / INSTALL WARDEN / THEN MERCY OF FORGETTING. RUSK: A wall that can change its mind is not a wall."},{threshold:34,text:"Six human voices\u2014including Sel\u2014say, \u2018Release us.\u2019 Sel knocks three times. A seventh voice, too large for the room, says, \u2018Open.\u2019"}]}],Tn=[{id:"inscription",icon:"\u2299",status:"CORROBORATED",title:"The Inward Inscription",quote:"The Bell does not summon. It contains.",body:"The letters face inward. Whoever forged the seal feared the thing inside, not the people outside.",fact:"The Bell contains an occult presence.",optionalTitle:"Trace the cooling glyphs",optionalCopy:"Learn who last repaired the seal. Gain 20 XP and 1 Leverage; +1 Exposure (one incoming hit).",optionalContext:"The newest repair is written in Mara's own hand.",reflection:"Mara knows the pressure of each stroke but cannot remember making it.",consequence:"The case is no longer only about what Rusk did. Mara has been inside the Bell's history before.",knowledge:1},{id:"sel",icon:"?",status:"CONTESTED",title:"Echo of Novice Sel",quote:"Break it and the forgotten return.",body:"Sel's memory repeats the same promise. Black ash knots in his throat whenever he tries to say what follows.",fact:"Breaking the Bell restores the stolen names.",optionalTitle:"Stay for the missing word",optionalCopy:"Test the warning sign. Gain 20 XP and 1 Leverage; +1 Exposure (one incoming hit).",optionalContext:"The word Sel cannot speak is not a name. It is \u2018release.\u2019",reflection:"Sel's promise survives. So does the missing consequence inside it.",consequence:"A true statement can still be dangerous when a source cannot finish the sentence.",knowledge:2},{id:"ledger",icon:"\u21BB",status:"REVISION",title:"The Burned Debt Ledger",quote:"Breaking restores the names\u2014and releases what those names bind.",body:"Sel told the truth, but not enough of it. Each forgotten citizen is listed as one living stroke in the ward.",fact:"The stolen names are the ward that contains the Unwritten.",optionalTitle:"Reconstruct the missing folio",optionalCopy:"Find a safer theory of containment. Gain 20 XP and 1 Leverage; +1 Exposure (one incoming hit).",optionalContext:"The ward was communal before Rusk concentrated it in a single Bell.",reflection:"Rusk did not invent sacrifice. He made it efficient, private, and impossible to contest.",consequence:"There may be another ward\u2014but only if the city accepts a burden it once outsourced.",knowledge:3},{id:"confession",icon:"R",status:"LOCKED TESTIMONY",title:"Rusk's Sealed Confession",quote:"A wall that can change its mind is not a wall.",body:"Mara offered to replace the six after their names were restored. Rusk reversed the sequence: he erased Mara first, destroying the person who could renew or revoke the offer.",fact:"Rusk deliberately reversed Mara's conditional offer and preserved the coercive ward.",optionalTitle:"Read the final redaction",optionalCopy:"Learn why Mara was summoned. Gain 20 XP and 1 Leverage; +1 Exposure (one incoming hit).",optionalContext:"Rusk summoned Mara again because the failing Bell requires her to renew the promise with memory restored.",reflection:"The promise is Mara's. The sequence is Rusk's.",consequence:"Mara is not bound by consent whose defining condition was deliberately reversed; she must decide again with the record open.",knowledge:4},{id:"covenant",icon:"V",status:"AUTHORED EVIDENCE",title:"The Severance Covenant",quote:"Consent expires when the witness can no longer revoke it.",body:"Mara did volunteer to replace the stolen citizens\u2014but only after their names were restored, a public witness was appointed, and the vow could be renewed or refused each year.",fact:"Mara's consent was conditional; Rusk erased every safeguard and treated one past choice as permanent authority.",optionalTitle:"Recover the struck clauses",optionalCopy:"Restore the witnesses Rusk removed. Gain 20 XP and 1 Leverage; +1 Exposure (one incoming hit).",optionalContext:"The first appointed witness was Novice Sel, Ilyra's brother\u2014and his signature was never withdrawn.",reflection:"Mara can own the promise without accepting Rusk's version of it. Authorship is not surrender.",consequence:"The final choice must preserve revocation, witnesses, and a way for the city to change its mind.",knowledge:5},{id:"sel-vigil",icon:"S",status:"LIVING TESTIMONY",title:"Sel Vale's Last Vigil",quote:"I agreed to keep watch until dawn. I did not agree to disappear.",body:"Sel entered the Bell willingly for one night. Rusk converted a renewable civic duty into permanent erasure when the city refused to share the burden.",fact:"The ward can be carried by willing witnesses, but consent must be named, witnessed, and renewed.",optionalTitle:"Ask what answered him",optionalCopy:"Learn how the Unwritten enters a record. Gain 20 XP and 1 Leverage; +1 Exposure (one incoming hit).",optionalContext:"The Unwritten survives by making every witness use a different name for it; agreement is the boundary it cannot cross.",reflection:"Ilyra did not imagine her brother's voice. She mistook captivity for death because Rusk erased every other explanation.",consequence:"A consensual ward is possible, but only while its witnesses can speak to one another and refuse together.",knowledge:6}],Di=[{id:"steel-1",branch:"STEEL",tier:1,icon:"\u2571",name:"Glass Riposte",copy:"+6 Veilstrike damage.",requires:null},{id:"steel-2",branch:"STEEL",tier:2,icon:"\u2726",name:"Severance",copy:"+8 Lantern Cut damage; a finishing blow restores 1 Focus.",requires:"steel-1"},{id:"steel-3",branch:"STEEL",tier:3,icon:"\u27CB",name:"Blackglass Doctrine",copy:"+6 Veilstrike and +10 Lantern Cut damage.",requires:"steel-2"},{id:"method-1",branch:"METHOD",tier:1,icon:"\u2316",name:"Field Reading",copy:"+8 Inquest damage.",requires:null},{id:"method-2",branch:"METHOD",tier:2,icon:"\u25CE",name:"Pattern Break",copy:"Resonance bursts deal +8 damage.",requires:"method-1"},{id:"method-3",branch:"METHOD",tier:3,icon:"\u25C9",name:"Living Thesis",copy:"Inquest deals +6 damage and restores 1 Focus.",requires:"method-2"},{id:"burden-1",branch:"BURDEN",tier:1,icon:"\u25C8",name:"Redirect the Mark",copy:"+10 Guard and +3 Vitality from Null Sigil.",requires:null},{id:"burden-2",branch:"BURDEN",tier:2,icon:"\u25C7",name:"Last Archive",copy:"Recover 8
