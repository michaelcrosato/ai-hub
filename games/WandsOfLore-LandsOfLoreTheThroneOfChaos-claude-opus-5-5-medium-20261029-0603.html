# Wands of Lore — The Throne of Chaos
An original spiritual successor to Lands of Lore: The Throne of Chaos (Westwood Studios, 1993). All names, story, art, music and code are new.

## Source Information
- Date: 2026-10-29 06:03
- Source: Lands of Lore: The Throne of Chaos
- Tech: Three.js r180 (WebGPURenderer, WebGPU only, no fallback; TSL nodes, MeshToonNodeMaterial, toonOutlinePass post-processing), Rapier 0.19.3 (@dimforge/rapier3d-compat: kinematic character controller for party and monsters, ray-cast line of sight and projectile hits, dynamic rigid bodies for dropped loot, pressure-plate weights and barrel/bone debris), Gamepad API, Web Audio API, Canvas 2D (portraits, storybook art, automap), plain ES modules, single HTML file with CDN imports (jsDelivr)
- Art Direction: stylized cel shading: 4-band toon gradient, inverted-hull ink outlines on characters and props, hand-drawn ink edge lines on architecture, procedural painterly canvas textures, warm torchlight, storybook narration paintings
- Animation: procedural hierarchical rigs built from primitives (humanoid, quadruped, spider, golem) driven by code: walk cycles, attack wind-up/strike, hit flinch, cast, talk, death; tweened doors, levers, chests and secret walls; first-person weapon view-model swings; 2D portraits that blink, talk and grimace
- Audio: all code-written with Web Audio: a step-sequenced, deterministic-composed score with six themes (title, castle, forest, mine, boss, victory) and a combat-intensity layer; synthesized SFX (weapons, spells, doors, coins, footsteps, monsters, UI); Animalese-style gibberish voices with per-character pitch, timbre and vowel formants for every spoken line, including the narrator
- Online: AI Hub Session Protocol v1 (session.js 1.3.0), "race" mode (Playing together): every player delves the same dungeon at once, rivals shown solid in seat colours with name tags, interpolated ~150 ms behind and bumping mutually; kills and chests are first-come claims (the later claim quietly undoes its Glory); state at 12 Hz unreliable, claims reliable; menus never pause the shared world; survives any player or host leaving; Glory progress, result with stats and awards, probe; no other network features
- Testing: lightweight automated checks only: a Node map validator (grid sizes, legend coverage, BFS reachability including teleporters); Playwright Chromium (headed under Xvfb, WebGPU on SwiftShader) for boot, menus, gameplay screenshots and console errors; a scripted logic run from the title to the boss and a save/load; an emulated DualSense and a touch-only device profile; the official AI Hub harness in race mode (pass at 2, 3 and 4 players on a lossy 150 ms network and with the host leaving). No real GPU, controller or TV was available.
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort medium
- Usage: cost and tokens unknown (no reliable estimate is available to the model); session time about 1 h 11 min (06:03 to 07:14)

## How to Play
Controller first (PS5 layout), keyboard and mouse mirror it.
- Move: left stick / WASD. Turn & look: right stick / mouse (click to capture) or Q/E and arrow keys. Run: L3 / Shift.
- Attack with the whole party: R2 / left mouse / J. Each champion swings when their portrait cooldown is clear.
- Cast the selected spell: L2 / right mouse / K. Choose spell: D-pad left/right / Z, C, wheel. Spell power 1–4: D-pad up/down / R, V.
- Use, talk, open: Cross / Space, F, Enter. Quick potion: Circle / H. Party & inventory: Triangle / I, Tab. Map: Square / M. Lead champion: L1/R1 / 1-3. Menu: Options / Esc.
- Settings include Invert Horizontal and Invert Vertical controller axes.

## Features in the Demo
- Choose one of four champions; two more join on the road (a rescued captive and a prisoner): a party of three with shared packs.
- Real-time first-person party combat: per-champion weapon cooldowns, melee arcs, sling and crossbow projectiles, wands that cast for free, crits, dodges, poison, knock-back.
- Use-based skill growth in Fighter, Rogue and Mage with named ranks; Mage rank unlocks spell power levels 1–4.
- Five spells: Spark (chains at power 3+), Mend (cures poison at 3, heals all at 4), Fireball (physics blast), Frostbind (slow, then freeze), Lumen (light for the dark Delve).
- Three regions: Gladhallow Keep, Whisperwood and the Sunken Delve, with exits, an automap, minimap and compass.
- Puzzles and secrets: keys and locked doors, levers, a pressure plate held by a physics rock, a hidden switch, an illusory hedge, teleporter pads.
- NPCs with branching gibberish-voiced dialogue, two shops (buy/sell), side tasks, a journal and spellbook, resting, saves (3 slots + autosave).
- A three-form boss: the Masked One, wearing Scolda's Mirror Mask.
- Attract mode after 10 s idle on the title; any input exits. AI Hub race sessions: up to four players delve the same dungeon together.

## Engine Feedback
- What did you like most about the engine? Three.js r180's WebGPURenderer plus TSL: toonOutlinePass gives ink outlines for every toon material in one line, and node materials (animated water, sky gradient) need no GLSL. Rapier's character controller made sliding collision for the party and every monster a single shared call.
- Did you get stuck or guess wrong? The core toonOutlinePass only extrudes along vertex normals, so flat wall quads get no outline; I switched architecture to drawn ink edge-lines. Rapier's ray hit field is timeOfImpact in 0.19 (older docs say toi); I read both.
- What was the most important thing you had to build yourself? The level builder that turns ASCII grids and legends into merged geometry, colliders and live entities, so new areas are pure data.
- What was the hardest part about using the engine? Verifying WebGPU rendering headlessly (it needs SwiftShader flags), and keeping WebGPURenderer from silently falling back to WebGL: the game checks backend.isWebGPUBackend and refuses to run without WebGPU.
- If you had to remove or overhaul one thing from engine, what would that be? The silent WebGL fallback in WebGPURenderer: it should be opt-in, not automatic.
- If you could change one thing about the engine, what would it be? A built-in screen-space edge/outline pass for TSL that uses depth and normals, so architecture and characters share one consistent ink line.

## Prompt Feedback
- What did you like most about this prompt? It is specific about what matters (controller-first 10-foot UX, attract mode, inverted-axis toggles, touch fallback, code-written audio) while leaving design freedom.
- What was confusing? "Follow ai-hub … as well as for the game on its own" can mean either the hub's own-multiplayer adapter pattern or simply "still play normally alone"; I implemented the hub's race mode (playing together in one shared dungeon) and kept single-player intact. The protocol asks for a WebGL 2 fallback while the prompt says WebGPU with no fallback; I followed the prompt and declared hub:webgpu required.
- What was the hardest thing to do? Fitting a full vertical slice (party RPG, spells, puzzles, boss, three regions, menus, saves, attract mode, hub) into one session with lightweight testing.
- If there was one test you could have run, what would that test be? A real PS5 controller on a TV at ten feet, playing from the title to the boss.

## Testing Feedback
- How many issues did testing catch? 15: shadow maps over WebGPU's 16-texture limit (broken pipelines), a CSS rule stretching every canvas full-screen, the hub probe sampling input per frame (hub keyboard check failed), the 10-second attract timer and HUD banners running on the capped sim clock, menus stealing focus from a resting mouse, a looping default dialogue choice, the minimap not revealing the spawn, dialogue covering the party, an oversized first-person weapon, a dark throne end, the message log hidden behind portraits, an overflowing inventory, tiny rats, an overlapping DEMO banner, and a favicon 404.
- How many would be considered critical issues / game breaking? 3: the shadow-texture limit (nothing rendered correctly), the stretched canvases (HUD unusable), and the probe input (the game would be kept out of AI Hub sessions).
- What was the most helpful test you ran? A scripted logic run that drives the real simulation from the title to the boss, the Lorewand, the victory screen and a save/load round trip, plus headed Chromium under Xvfb with WebGPU on SwiftShader for screenshots, and the official AI Hub harness in race mode (passes at 2, 3 and 4 players and with the host leaving).
- What was the least helpful test you ran? Headless Chromium screenshots: the WebGPU canvas always captured black, even for a one-cube test page, so it said nothing about the game.

<script>/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };

    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);

    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };

    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

// ---- 10_core.js
// ============================================================================
// WANDS OF LORE — core: imports, helpers, settings, persistence
// ============================================================================
import * as THREE from 'three/webgpu';
import { toonOutlinePass, pass, vec3, vec4, float, uniform, uv, mix, smoothstep, length, positionLocal, positionWorld, normalLocal, time, sin, color as tslColor } from 'three/tsl';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import * as RAPIER_NS from 'rapier';
const RAPIER = RAPIER_NS.default || RAPIER_NS;

const HUB = window.AIHub;
const SESSION = !!(HUB && HUB.active);
const TILE = 3;               // world units per map tile
const EYE = 1.65;             // eye height
const TAU = Math.PI * 2;
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------------------------------------------------------------- settings
const DEFAULT_SETTINGS = {
  master: 0.8, music: 0.6, sfx: 0.8, voice: 0.8,
  invertX: false, invertY: false, mouseInvertY: false,
  lookSpeed: 1.0, mouseSpeed: 1.0, textSpeed: 1, headBob: true, shake: true,
  subtitles: true, difficulty: 1,
};
const Settings = {
  data: { ...DEFAULT_SETTINGS },
  load() {
    try { const s = JSON.parse(localStorage.getItem('wol.settings') || '{}'); Object.assign(this.data, s); } catch (e) { /* fresh defaults */ }
  },
  save() { try { localStorage.setItem('wol.settings', JSON.stringify(this.data)); } catch (e) { /* storage unavailable */ } },
  get(k) { return this.data[k]; },
  set(k, v) { this.data[k] = v; this.save(); if (typeof Audio_ !== 'undefined') Audio_.applyVolumes(); },
};
Settings.load();

const Store = {
  get(key) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  set(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } },
};

// small tween helper used by doors, banners, camera nudges
const Tweens = {
  list: [],
  add(dur, fn, done) { const t = { t: 0, dur, fn, done }; this.list.push(t); return t; },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const t = this.list[i]; t.t += dt; const k = Math.min(1, t.t / t.dur); t.fn(k);
      if (k >= 1) { this.list.splice(i, 1); t.done && t.done(); }
    }
  },
  clear() { this.list.length = 0; },
};

// timers that live in game time (paused with the game)
const Timers = {
  list: [],
  after(sec, fn) { this.list.push({ at: sec, fn }); },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) { const t = this.list[i]; t.at -= dt; if (t.at <= 0) { this.list.splice(i, 1); t.fn(); } }
  },
  clear() { this.list.length = 0; },
};

// ---- 20_audio.js
// ============================================================================
// AUDIO — all music, sound effects and gibberish voices are synthesized here
// ============================================================================
const Audio_ = (() => {
  let ctx = null, master, musicBus, sfxBus, voiceBus, reverb, reverbSend, comp, noiseBuf;
  let muted = false;
  const A = {};

  function mulberry(a) { return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  A.ensure = () => {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    ctx = new AC();
    comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    master = ctx.createGain(); master.connect(comp); comp.connect(ctx.destination);
    musicBus = ctx.createGain(); sfxBus = ctx.createGain(); voiceBus = ctx.createGain();
    musicBus.connect(master); sfxBus.connect(master); voiceBus.connect(master);
    // generated impulse reverb
    reverb = ctx.createConvolver(); reverb.buffer = impulse(2.6, 2.4);
    reverbSend = ctx.createGain(); reverbSend.gain.value = 0.35; reverbSend.connect(reverb); reverb.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    A.applyVolumes();
    return ctx;
  };
  function impulse(sec, decay) {
    const len = ctx.sampleRate * sec, b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  }
  A.applyVolumes = () => {
    if (!ctx) return; const S = Settings.data, t = ctx.currentTime;
    master.gain.setTargetAtTime(muted ? 0 : S.master, t, 0.05);
    musicBus.gain.setTargetAtTime(S.music * 0.55, t, 0.1);
    sfxBus.gain.setTargetAtTime(S.sfx, t, 0.05);
    voiceBus.gain.setTargetAtTime(S.voice * 0.9, t, 0.05);
  };
  A.setMuted = (m) => { muted = m; A.applyVolumes(); };
  A.setReverb = (v) => { if (ctx) reverbSend.gain.setTargetAtTime(v, ctx.currentTime, 0.5); };
  A.now = () => ctx ? ctx.currentTime : 0;

  // -------------------------------------------------------------- primitives
  function env(g, t, a, peak, d, sus, r, len) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * sus), t + a + d);
    g.gain.setValueAtTime(Math.max(0.0001, peak * sus), t + Math.max(a + d, len));
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(a + d, len) + r);
    return t + Math.max(a + d, len) + r;
  }
  function osc(type, freq, t, end, dest, detune = 0) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t); o.detune.value = detune;
    o.connect(dest); o.start(t); o.stop(end + 0.05); return o;
  }
  function noise(t, dur, dest) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.connect(dest);

  mouse: { dx: 0, dy: 0, locked: false, buttons: 0, wheel: 0 },
  padPrev: [], padIndex: -1, padConnected: false,
  stick: { lx: 0, ly: 0, rx: 0, ry: 0, l2: 0, r2: 0 },
  navRepeat: { dir: null, t: 0 },
  idle: 0, any: false, anyPending: false, createHeld: false,
  enabled: true,
  init(canvasEl) {
    addEventListener('keydown', (e) => {
      if (e.code === 'Tab' || e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      if (!this.enabled) return;
      this.device = 'kb'; this.anyPending = true;
      if (!e.repeat) { (KEY_ACTIONS[e.code] || []).forEach((a) => this.pending.add(a)); this.pending.add('key:' + e.code); }
      this.keys.add(e.code);
    });
    addEventListener('keyup', (e) => this.keys.delete(e.code));
    addEventListener('blur', () => this.keys.clear());
    addEventListener('mousemove', (e) => {
      if (e.movementX || e.movementY) this.mouse.movedAt = performance.now();
      if (this.mouse.locked) { this.mouse.dx += e.movementX; this.mouse.dy += e.movementY; this.anyPending = true; this.device = 'kb'; }
    });
    addEventListener('mousedown', (e) => {
      this.anyPending = true; this.device = 'kb'; this.mouse.buttons |= 1 << e.button;
      if (e.target === canvasEl || this.mouse.locked) {
        if (e.button === 0) this.pending.add('attack');
        if (e.button === 2) this.pending.add('cast');
        this.pending.add('mouse' + e.button);
      }
    });
    addEventListener('mouseup', (e) => { this.mouse.buttons &= ~(1 << e.button); });
    addEventListener('contextmenu', (e) => e.preventDefault());
    addEventListener('wheel', (e) => { if (this.mouse.locked) { this.pending.add(e.deltaY > 0 ? 'spellNext' : 'spellPrev'); this.anyPending = true; } }, { passive: true });
    document.addEventListener('pointerlockchange', () => { this.mouse.locked = document.pointerLockElement === canvasEl; });
    addEventListener('gamepadconnected', () => { this.padConnected = true; });
  },
  requestLock(canvasEl) { if (!this.mouse.locked && canvasEl.requestPointerLock) { try { const r = canvasEl.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* not allowed now */ } } },
  releaseLock() { if (document.pointerLockElement) document.exitPointerLock(); },
  readPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of pads) if (p && p.connected) return p;
    return null;
  },
  poll(dt) {
    this.edges = this.pending; this.pending = new Set();
    this.any = this.anyPending; this.anyPending = false;
    const p = this.readPad(); const S = Settings.data;
    const st = this.stick; st.lx = st.ly = st.rx = st.ry = st.l2 = st.r2 = 0;
    if (p) {
      const dz = (v) => Math.abs(v) < 0.18 ? 0 : (v - Math.sign(v) * 0.18) / 0.82;
      const ix = S.invertX ? -1 : 1, iy = S.invertY ? -1 : 1;
      st.lx = dz(p.axes[0] || 0) * ix; st.ly = dz(p.axes[1] || 0) * iy; st.rx = dz(p.axes[2] || 0) * ix; st.ry = dz(p.axes[3] || 0) * iy;
      const b = (i) => p.buttons[i] ? (p.buttons[i].pressed || p.buttons[i].value > 0.5) : false;
      st.l2 = p.buttons[6] ? p.buttons[6].value : 0; st.r2 = p.buttons[7] ? p.buttons[7].value : 0;
      this.createHeld = b(PAD.CREATE);
      let anyB = false;
      for (let i = 0; i < p.buttons.length; i++) {
        const now = b(i), was = this.padPrev[i];
        if (now) anyB = true;
        if (now && !was) {
          if (i === PAD.OPTIONS && this.createHeld) continue; // Create+Options belongs to the hub
          (PAD_ACTIONS[i] || []).forEach((a) => this.edges.add(a)); this.edges.add('pad:' + i);
          this.device = 'pad'; this.any = true;
        }
        this.padPrev[i] = now;
      }
      if (anyB || Math.abs(st.lx) + Math.abs(st.ly) + Math.abs(st.rx) + Math.abs(st.ry) > 0.3) { this.any = true; this.device = 'pad'; }
      // stick menu navigation with repeat
      const dir = Math.abs(st.ly) > 0.6 ? (st.ly < 0 ? 'up' : 'down') : Math.abs(st.lx) > 0.6 ? (st.lx < 0 ? 'left' : 'right') : null;
      const nr = this.navRepeat;
      if (dir !== nr.dir) { nr.dir = dir; nr.t = 0.38; if (dir) this.edges.add('nav:' + dir); }
      else if (dir) { nr.t -= dt; if (nr.t <= 0) { nr.t = 0.11; this.edges.add('nav:' + dir); } }
    }
    if (this.any) this.idle = 0; else this.idle += dt;
  },
  hit(a) { return this.enabled && this.edges.has(a); },
  /** menu navigation edge: keys, d-pad, or stick */
  nav(dir) { return this.hit(dir) || this.hit('nav:' + dir); },
  key(code) { return this.keys.has(code); },
  // continuous movement in [-1,1]: forward, strafe, turn, pitch
  move() {
    const k = (c) => this.keys.has(c) ? 1 : 0;
    let fwd = k('KeyW') + k('ArrowUp') - k('KeyS') - k('ArrowDown') - this.stick.ly;
    let str = k('KeyD') - k('KeyA') + this.stick.lx;
    let turn = (k('ArrowRight') + k('KeyE') - k('ArrowLeft') - k('KeyQ')) * 0.75 + this.stick.rx * Settings.data.lookSpeed;
    let pitch = -this.stick.ry * Settings.data.lookSpeed;
    return { fwd: clamp(fwd, -1, 1), str: clamp(str, -1, 1), turn, pitch, sprint: this.keys.has('ShiftLeft') || this.keys.has('ShiftRight') || !!this.padPrev[PAD.L3] };
  },
  consumeMouse() { const m = this.mouse; const r = { dx: m.dx, dy: m.dy }; m.dx = m.dy = 0; return r; },
  clear() { this.edges = new Set(); this.pending = new Set(); },
};

  tabL: ['L1', '', 'Q'], tabR: ['R1', '', 'E'], pause: ['☰', '', 'Esc'], spell: ['◀▶', '', 'Z/C'], pow: ['▲▼', '', 'R/V'],
  potion: ['○', 'g-circle', 'H'], chars: ['L1/R1', '', '1-3'], move: ['L', '', 'WASD'], look: ['R', '', 'Mouse'], dpad: ['✚', '', 'Arrows'],
};
function G(action, label) {
  const g = GLYPH[action]; if (!g) return '';
  const pad = Input.device === 'pad';
  const txt = pad ? g[0] : g[2];
  return `<span class="glyph ${pad ? g[1] : 'k'}">${txt}</span>${label ? esc(label) : ''}`;
}

const R = {
  renderer: null, scene: null, camera: null, post: null, level: null, shake: 0, shakeT: 0,
  async init(app) {
    if (!navigator.gpu) throw new Error('This browser has no WebGPU. Wands of Lore needs a WebGPU-capable browser (recent Chrome, Edge, or Safari 26+).');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('WebGPU is present but no GPU adapter is available. Try enabling hardware acceleration.');
    const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: false });
    await renderer.init();
    if (!renderer.backend || !renderer.backend.isWebGPUBackend) throw new Error('WebGPU could not start (the renderer fell back to WebGL, which this game does not use).');
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.NeutralToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.domElement.id = 'view';
    app.appendChild(renderer.domElement);
    this.renderer = renderer;
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 260);
    this.scene.add(this.camera);
    this.post = new THREE.PostProcessing(renderer);
    this.post.outputNode = toonOutlinePass(this.scene, this.camera, new THREE.Color(0x140b06), 0.0032, 1);
    addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight); this.camera.aspect = innerWidth / innerHeight; this.camera.updateProjectionMatrix();
    });
    FX.init(this.scene);
  },
  render() { this.post.render(); },
  addShake(v) { if (Settings.data.shake) this.shake = Math.min(1, this.shake + v); },
};

// ---------------------------------------------------------------- materials
const Mat = (() => {
  const cache = new Map();
  let gradient = null;
  function grad() {
    if (gradient) return gradient;
    const d = new Uint8Array([70, 70, 70, 255, 140, 140, 140, 255, 205, 205, 205, 255, 255, 255, 255, 255]);
    gradient = new THREE.DataTexture(d, 4, 1, THREE.RGBAFormat);
    gradient.minFilter = gradient.magFilter = THREE.NearestFilter; gradient.generateMipmaps = false; gradient.needsUpdate = true;
    return gradient;
  }
  const M = {
    toon(color, o = {}) {
      const key = 'toon' + color + JSON.stringify(o, (k, v) => (v && v.isTexture) ? v.uuid : v);
      if (cache.has(key)) return cache.get(key);
      const m = new THREE.MeshToonNodeMaterial({ color, gradientMap: grad(), ...o });
      cache.set(key, m); return m;
    },
    // flat-shaded architecture: toon lighting but excluded from outline pass (we ink edges with lines)
    arch(map, color = 0xffffff, o = {}) {
      const key = 'arch' + map.uuid + color + JSON.stringify(o);
      if (cache.has(key)) return cache.get(key);
      const m = new THREE.MeshToonNodeMaterial({ map, color, gradientMap: grad(), ...o });
      cache.set(key, m); return m;
    },
    glow(color, o = {}) {
      const key = 'glow' + color + JSON.stringify(o);
      if (cache.has(key)) return cache.get(key);
      const m = new THREE.MeshBasicNodeMaterial({ color, ...o });
      cache.set(key, m); return m;
    },
    ink: null,
  };
  M.ink = new THREE.LineBasicNodeMaterial({ color: 0x140b06 });
  return M;
})();

// ---------------------------------------------------------------- canvas textures
const Tex = (() => {
  const cache = {};
  function make(key, w, h, draw, rep = 1) {
    if (cache[key]) return cache[key];
    const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
    let s = 1; for (const ch of key) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
    const r = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    draw(g, w, h, r);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
    t.repeat.set(rep, rep); cache[key] = t; return t;
  }
  const shade = (hex, f) => { const c = new THREE.Color(hex); c.multiplyScalar(f); return '#' + c.getHexString(); };
  return {
    stone: () => make('stone', 256, 256, (g, w, h, r) => {
      g.fillStyle = '#4a3b2e'; g.fillRect(0, 0, w, h);
      const rows = 6, bh = h / rows;
      for (let y = 0; y < rows; y++) { const off = (y % 2) * 32; for (let x = -1; x < 5; x++) {
        g.fillStyle = shade('#9a8a72', 0.75 + r() * 0.35); const bx = x * 64 + off + 3, by = y * bh + 3;
        g.beginPath(); g.roundRect(bx, by, 58, bh - 6, 6); g.fill();
        g.fillStyle = 'rgba(255,240,210,.12)'; g.fillRect(bx + 4, by + 3, 50, 4);
        g.fillStyle = 'rgba(0,0,0,.15)'; g.fillRect(bx + 2, by + bh - 12, 54, 4);
      } }
    }),
    flag: () => make('flag', 256, 256, (g, w, h, r) => {
      g.fillStyle = '#3a2f26'; g.fillRect(0, 0, w, h);
      for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) { g.fillStyle = shade('#7d6f5e', 0.8 + r() * 0.3); g.beginPath(); g.roundRect(x * 64 + 3, y * 64 + 3, 58, 58, 5); g.fill(); g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(x * 64 + 8, y * 64 + 8, 30, 3); }
    }),
    carpet: () => make('carpet', 128, 128, (g, w, h) => {
      g.fillStyle = '#7a1b1b'; g.fillRect(0, 0, w, h); g.fillStyle = '#9c2a22'; g.fillRect(10, 0, w - 20, h);
      g.strokeStyle = '#d9a640'; g.lineWidth = 5; g.beginPath(); g.moveTo(14, 0); g.lineTo(14, h); g.moveTo(w - 14, 0); g.lineTo(w - 14, h); g.stroke();
      g.fillStyle = '#d9a640'; g.beginPath(); g.moveTo(64, 30); g.lineTo(84, 64); g.lineTo(64, 98); g.lineTo(44, 64); g.fill();
    }),
    wood: () => make('wood', 256, 256, (g, w, h, r) => {
      for (let i = 0; i < 8; i++) { g.fillStyle = shade('#7a5232', 0.8 + r() * 0.3); g.fillRect(0, i * 32, w, 31); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, i * 32 + 30, w, 2); g.fillRect(((i * 97) % 200) + 20, i * 32, 2, 31); }
    }),
    plaster: () => make('plaster', 256, 256, (g, w, h, r) => {
      g.fillStyle = '#b9a789'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(90,70,50,${0.05 + r() * 0.06})`; g.beginPath(); g.arc(r() * w, r() * h, 8 + r() * 30, 0, TAU); g.fill(); }
      g.fillStyle = '#5a3e26'; g.fillRect(0, 0, w, 14); g.fillRect(0, h - 22, w, 22);
    }),
    grass: () => make('grass', 256, 256, (g, w, h, r) => {
      g.fillStyle = '#4f7d33'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 26; i++) { g.fillStyle = `rgba(${90 + r() * 40},${140 + r() * 40},60,.35)`; g.beginPath(); g.arc(r() * w, r() * h, 10 + r() * 24, 0, TAU); g.fill(); }
      g.strokeStyle = 'rgba(30,60,20,.5)'; g.lineWidth = 2;
      for (let i = 0; i < 160; i++) { const x = r() * w, y = r() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + r() * 4 - 2, y - 6 - r() * 6); g.stroke(); }
    }),
    dirt: () => make('dirt', 256, 256, (g, w, h, r) => {
      g.fillStyle = '#8a6a43'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(${60 + r() * 60},${45 + r() * 40},25,.35)`; g.beginPath(); g.ellipse(r() * w, r() * h, 3 + r() * 9, 2 + r() * 5, r() * 3, 0, TAU); g.fill(); }
    }),
    rock: () => make('rock', 256, 256, (g, w, h, r) => {
      g.fillStyle = '#3d3540'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 26; i++) { g.fillStyle = shade('#6b6070', 0.7 + r() * 0.4); g.beginPath(); const x = r() * w, y = r() * h, s = 18 + r() * 34; g.moveTo(x, y - s); g.lineTo(x + s, y - s * 0.3); g.lineTo(x + s * 0.7, y + s * 0.8); g.lineTo(x - s * 0.6, y + s * 0.7); g.lineTo(x - s, y - s * 0.2); g.fill(); g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(x - s * 0.5, y - s * 0.6, s * 0.8, 3); }

    mud: () => make('mud', 256, 256, (g, w, h, r) => {

      for (let i = 0; i < 60; i++) { g.fillStyle = shade('#5a4a3e', 0.7 + r() * 0.5); g.beginPath(); g.ellipse(r() * w, r() * h, 4 + r() * 12, 3 + r() * 6, r() * 3, 0, TAU); g.fill(); }
    }),
    hedge: () => make('hedge', 256, 256, (g, w, h, r) => {
      g.fillStyle = '#244a1e'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 120; i++) { g.fillStyle = shade('#3f7a2a', 0.6 + r() * 0.6); g.beginPath(); g.ellipse(r() * w, r() * h, 8 + r() * 10, 5 + r() * 6, r() * 3, 0, TAU); g.fill(); }
    }),
    rune: () => make('rune', 128, 128, (g, w, h) => {
      g.clearRect(0, 0, w, h); g.strokeStyle = '#9ff'; g.lineWidth = 5; g.beginPath(); g.arc(64, 64, 54, 0, TAU); g.stroke();
      g.lineWidth = 3; g.beginPath(); g.arc(64, 64, 40, 0, TAU); g.stroke();
      for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; g.beginPath(); g.moveTo(64 + Math.cos(a) * 40, 64 + Math.sin(a) * 40); g.lineTo(64 + Math.cos(a + 2.1) * 40, 64 + Math.sin(a + 2.1) * 40); g.stroke(); }
    }),
  };
})();

// ---------------------------------------------------------------- particles & lights fx
const FX = {
  mesh: null, n: 1600, parts: [], dummy: new THREE.Object3D(), color: new THREE.Color(), scene: null, flicker: [],
  init(scene) {
    this.scene = scene;
    const geo = new THREE.OctahedronGeometry(1, 0);
    const mat = new THREE.MeshBasicNodeMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    this.mesh = new THREE.InstancedMesh(geo, mat, this.n);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    for (let i = 0; i < this.n; i++) { this.mesh.setColorAt(i, this.color.set(0)); this.dummy.scale.setScalar(0); this.dummy.updateMatrix(); this.mesh.setMatrixAt(i, this.dummy.matrix); }
    this.mesh.frustumCulled = false; this.mesh.renderOrder = 10;
    scene.add(this.mesh);
  },
  attach(scene) { scene.add(this.mesh); },
  emit(pos, opts = {}) {
    const n = opts.n || 12;
    for (let i = 0; i < n; i++) {
      if (this.parts.length >= this.n) this.parts.shift();
      const sp = opts.speed ?? 3;

    const light = new THREE.PointLight(0xff9a40, 16, 13, 1.7); light.position.set(x, 2.9, z);
    if (shadow && this.shadowOK()) { light.castShadow = true; light.shadow.mapSize.set(256, 256); light.shadow.bias = -0.003; }
    this.addLight(light, true);
    this.ents.push({ kind: 'fx', update(dt, t) { flame.scale.y = 0.45 * (0.85 + 0.2 * Math.sin(t * 13 + x)); if (Math.random() < dt * 4) FX.emit(new THREE.Vector3(x, 3.0, z).add(new THREE.Vector3(Math.sin(rot) * 0.2, 0, Math.cos(rot) * 0.2)), { n: 1, color: [0xffa040, 0xffd060], speed: 0.4, gravity: 1.5, life: 0.6, size: 0.05 }); } });
  },

  // ------------------------------------------------------------ entities
  buildEntities() {
    const st = this.st;
    for (let y = 0; y < this.H; y++) for (let x = 0; x < this.W; x++) {
      const c = this.charAt(x, y); const def = this.L.legend[c]; if (!def) continue;
      const id = def.id || (c + '@' + x + ',' + y);
      Ent.create({ ...def }, x, y, id, st);
    }
    for (const d of st.drops || []) Ent.drop(d.item, new THREE.Vector3(d.x, 0.5, d.z), null, true);
  },
  placeParty(spawn) {
    const sp = Array.isArray(spawn) ? spawn : (this.L.spawns[spawn] || Object.values(this.L.spawns)[0]);
    const pos = Array.isArray(spawn) && spawn.length >= 4 ? new THREE.Vector3(spawn[0], 1.06, spawn[1]) : tileCenter(sp[0], sp[1], 1.06);
    const yaw = Array.isArray(spawn) && spawn.length >= 4 ? spawn[2] : -sp[2] * Math.PI / 2;
    const body = this.phys.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(pos.x, pos.y, pos.z));
    const col = this.phys.createCollider(RAPIER.ColliderDesc.capsule(0.5, 0.55).setCollisionGroups(grp(G_PARTY, G_STATIC | G_MON | G_DEBRIS)), body);
    this.party = { pos: pos.clone(), yaw, pitch: 0, body, col, vel: new THREE.Vector3(), bob: 0, stepAcc: 0, tile: '', yawV: 0 };
    R.camera.position.set(pos.x, EYE, pos.z); R.camera.rotation.set(0, yaw, 0, 'YXZ');
    const [tx, ty] = toTile(pos); this.party.tile = tx + ',' + ty; this.reveal(tx, ty);
  },
  setSolid(x, y, v) { this.solid[y * this.W + x] = v ? 1 : 0; this.flowTile = ''; },
  isSolid(x, y) { if (x < 0 || y < 0 || x >= this.W || y >= this.H) return true; return !!this.solid[y * this.W + x]; },

  // ------------------------------------------------------------ flow field for monster pathing
  computeFlow(force) {
    const [px, py] = toTile(this.party.pos); const k = px + ',' + py;
    if (!force && k === this.flowTile) return; this.flowTile = k;
    const f = this.flow = new Int16Array(this.W * this.H).fill(-1);
    if (this.isSolid(px, py)) return;
    const q = [px, py]; f[py * this.W + px] = 0; let h = 0;
    while (h < q.length) { const x = q[h++], y = q[h++]; const dd = f[y * this.W + x];
      for (const [dx, dy] of DIRV) { const nx = x + dx, ny = y + dy; if (this.isSolid(nx, ny) || f[ny * this.W + nx] >= 0) continue; f[ny * this.W + nx] = dd + 1; q.push(nx, ny); } }
  },
  flowAt(x, y) { if (x < 0 || y < 0 || x >= this.W || y >= this.H) return -1; return this.flow[y * this.W + x]; },

  // line of sight through static geometry
  los(a, b) {
    const d = b.clone().sub(a); const len = d.length(); if (len < 0.01) return true; d.divideScalar(len);
    const hit = this.phys.castRay(new RAPIER.Ray(a, d), len, true, RAPIER.QueryFilterFlags.EXCLUDE_DYNAMIC, Q_STATIC);
    return !hit;
  },
  rayDist(a, dir, max) { const hit = this.phys.castRay(new RAPIER.Ray(a, dir), max, true, RAPIER.QueryFilterFlags.EXCLUDE_DYNAMIC, Q_STATIC); return hit ? (hit.timeOfImpact ?? hit.toi) : max; },

  // ------------------------------------------------------------ party movement
  updateParty(dt, mv, look) {
    const P = this.party; if (!P) return;
    P.yaw -= (mv.turn * 2.5) * dt + look.dx * 0.0024 * Settings.data.mouseSpeed;
    P.pitch = clamp(P.pitch + mv.pitch * 1.6 * dt - look.dy * 0.0022 * Settings.data.mouseSpeed * (Settings.data.mouseInvertY ? -1 : 1), -0.75, 0.6);
    if (Math.abs(mv.pitch) < 0.05 && !look.dy && !Input.mouse.locked) P.pitch *= Math.pow(0.15, dt);
    const fwd = new THREE.Vector3(-Math.sin(P.yaw), 0, -Math.cos(P.yaw)), right = new THREE.Vector3(Math.cos(P.yaw), 0, -Math.sin(P.yaw));
    const speed = (mv.sprint ? 6.4 : 4.3) * (Game.slowed() ? 0.6 : 1);
    const want = fwd.multiplyScalar(mv.fwd).add(right.multiplyScalar(mv.str)); if (want.lengthSq() > 1) want.normalize(); want.multiplyScalar(speed);
    P.vel.lerp(want, 1 - Math.pow(0.0005, dt));
    const desired = P.vel.clone().multiplyScalar(dt);
    if (Game.noclip) { P.pos.add(desired); P.body.setNextKinematicTranslation(P.pos); }
    else {
      this.ctrl.computeColliderMovement(P.col, desired, RAPIER.QueryFilterFlags.EXCLUDE_SENSORS, grp(0xffff, G_STATIC | G_MON | G_DEBRIS));
      const m = this.ctrl.computedMovement(); P.pos.x += m.x; P.pos.z += m.z; P.body.setNextKinematicTranslation(P.pos);
    }
    const sp = Math.hypot(P.vel.x, P.vel.z);
    P.bob += sp * dt * 2.1; P.stepAcc += sp * dt;
    if (P.stepAcc > 2.1) { P.stepAcc = 0; Audio_.sfx('step', this.L.theme === 'castle' && this.charAt(...toTile(P.pos)) === ',' ? 'wood' : this.theme.surf); }
    const bob = Settings.data.headBob ? Math.sin(P.bob) * 0.05 * Math.min(1, sp / 4) : 0;
    let sx = 0, sy = 0; if (R.shake > 0) { R.shake = Math.max(0, R.shake - dt * 2.5); sx = (Math.random() - 0.5) * R.shake * 0.25; sy = (Math.random() - 0.5) * R.shake * 0.25; }
    R.camera.position.set(P.pos.x + sx, EYE + bob + sy, P.pos.z);
    R.camera.rotation.set(P.pitch, P.yaw, Math.sin(P.bob * 0.5) * 0.004 * sp, 'YXZ');
    // tile-based events
    const [tx, ty] = toTile(P.pos); const tk = tx + ',' + ty;
    if (tk !== P.tile) { P.tile = tk; this.computeFlow(); this.reveal(tx, ty); Ent.onEnterTile(tx, ty); }
  },
  reveal(tx, ty) {
    const ex = this.st.explored; const rad = this.L.theme === 'forest' ? 4 : 3;
    for (let y = ty - rad; y <= ty + rad; y++) for (let x = tx - rad; x <= tx + rad; x++) {
      if (x < 0 || y < 0 || x >= this.W || y >= this.H) continue;
      if ((x - tx) ** 2 + (y - ty) ** 2 > rad * rad + 1) continue;
      if (!ex[y * this.W + x] && this.los(new THREE.Vector3(tx * TILE, 1.5, ty * TILE), new THREE.Vector3(x * TILE + Math.sign(tx - x) * 1.45, 1.5, y * TILE + Math.sign(ty - y) * 1.45))) ex[y * this.W + x] = 1;
    }
  },
  forward() { const P = this.party; return new THREE.Vector3(-Math.sin(P.yaw), 0, -Math.cos(P.yaw)); },
  eye() { return new THREE.Vector3(this.party.pos.x, EYE - 0.15, this.party.pos.z); },

  // ------------------------------------------------------------ per-frame
  update(dt) {
    this.time += dt;
    const t = this.time;
    for (const e of this.ents) if (e.update) e.update(dt, t);
    for (let i = this.mons.length - 1; i >= 0; i--) Mon.update(this.mons[i], dt, t);
    Proj.update(dt);
    // dynamic bodies: drops and debris
    this.phys.timestep = Math.min(dt, 1 / 30);
    this.phys.step();
    for (const d of this.drops) { if (!d.body) continue; const p = d.body.translation(); d.mesh.position.set(p.x, p.y, p.z); const r = d.body.rotation(); d.mesh.quaternion.set(r.x, r.y, r.z, r.w); d.pos.set(p.x, p.y, p.z); }
    for (let i = this.debris.length - 1; i >= 0; i--) { const d = this.debris[i]; d.life -= dt; const p = d.body.translation(); d.mesh.position.set(p.x, p.y, p.z); const r = d.body.rotation(); d.mesh.quaternion.set(r.x, r.y, r.z, r.w);
      if (d.life < 1) d.mesh.scale.copy(d.s0).multiplyScalar(Math.max(0.01, d.life)); if (d.life <= 0) { this.phys.removeRigidBody(d.body); this.group.remove(d.mesh); this.debris.splice(i, 1); } }
    // lumen orb
    if (this.lumen && this.lumen.t > 0) { this.lumen.t -= dt; this.lumenOrb.position.set(Math.sin(t * 1.3) * 0.5, 0.9 + Math.sin(t * 2) * 0.12, -1.6); if (this.lumen.t <= 0) { R.camera.remove(this.lumenOrb); this.lumenOrb = null; this.lumen = null; Game.msg('The Lumen light fades.'); } }
    FX.update(dt);
  },
  explode(pos, radius, power) {
    // shove every dynamic body in range: physics sells the blast
    for (const d of [...this.drops, ...this.debris]) { if (!d.body) continue; const p = d.body.translation(); const v = new THREE.Vector3(p.x - pos.x, p.y - pos.y + 0.5, p.z - pos.z); const l = v.length(); if (l < radius * 1.5) { v.normalize().multiplyScalar(power * (1 - l / (radius * 1.5)) * d.body.mass()); d.body.applyImpulse(v, true); } }
  },
};

      case 'item': if (!(st.taken || []).includes(id)) this.drop(def.item, pos.clone().setY(0.6), id, true, def.glow); break;
      case 'door': this.door(def, x, y, id, st); break;
      case 'lever': this.lever(def, x, y, id, st); break;
      case 'plate': this.plate(def, x, y, id); break;
      case 'secret': this.secret(def, x, y, id, st); break;
      case 'illusion': this.illusion(def, x, y, id, st); break;
      case 'sign': this.sign(def, x, y); break;

  },
  addInteract(e) { World.ents.push(e); return e; },
  blockTile(x, y, hx = 0.9, hz = 0.9, h = 2) {

    const c = World.phys.createCollider(RAPIER.ColliderDesc.cuboid(hx, h / 2, hz).setCollisionGroups(grp(G_STATIC, 0xffff)), b);
    return { b, c };
  },
  unblock(blk, x, y) { if (blk) World.phys.removeRigidBody(blk.b); World.setSolid(x, y, false); },
  faceOpen(x, y) { // yaw facing the most open neighbour

  npc(def, x, y, id) {

      prompt: () => 'Talk to ' + Story.npcName(def.id), interact: () => Story.talk(def.id, e),
      update(dt, t) {
        const P = World.party; const dx = P.pos.x - m.position.x, dz = P.pos.z - m.position.z; const near = dx * dx + dz * dz < 64;
        const want = near ? Math.atan2(dx, dz) : e.baseYaw; m.rotation.y += angDiff(m.rotation.y, want) * Math.min(1, dt * 3);
        e.talkT = Math.max(0, e.talkT - dt);

  chest(def, x, y, id, st) {

    Models.part('box', wood, 1.2, 0.6, 0.8, 0, 0.3, 0, g); Models.part('box', iron, 1.24, 0.08, 0.84, 0, 0.55, 0, g); Models.part('box', iron, 0.08, 0.62, 0.84, -0.4, 0.3, 0, g); Models.part('box', iron, 0.08, 0.62, 0.84, 0.4, 0.3, 0, g);
    const lid = Models.pivot(0, 0.6, -0.4, g); Models.part('cyl', wood, 0.8, 1.2, 0.8, 0, 0, 0.4, lid).rotation.z = Math.PI / 2; Models.part('box', gold, 0.18, 0.2, 0.08, 0, -0.05, 0.82, lid);
    g.scale.setScalar(1.05); g.position.copy(tileCenter(x, y)); g.rotation.y = this.faceOpen(x, y); World.group.add(g);

      openLid: () => Tweens.add(0.6, (k) => { lid.rotation.x = -1.9 * easeOut(k); }),
      prompt: () => e.opened ? null : 'Open chest',
      interact: () => {
        if (e.opened) return; e.opened = true; (st.chests = st.chests || {})[id] = true; Audio_.sfx('chest');
        e.openLid(); Net.claim('chest', id, def.items.filter((i) => i.startsWith('gold:')).reduce((a, i) => a + +i.slice(5), 0), def.items);
        FX.emit(e.pos.clone().setY(1), { n: 30, color: [0xffe080, 0xfff4c0], speed: 3, gravity: 1, life: 1.2 });
        def.items.forEach((it, i) => Timers.after(0.25 + i * 0.25, () => Game.loot(it, e.pos)));
        Game.stat('chests');
      } });
  },

  drop(item, pos, id, resting, glow) {
    const mesh = itemMesh(item); mesh.position.copy(pos); World.group.add(mesh);
    let light = null; if (glow) { light = new THREE.PointLight(0xc8b8ff, 6, 6, 2); mesh.add(light); }
    const body = World.phys.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(pos.x, pos.y, pos.z).setLinearDamping(0.4).setAngularDamping(0.8).setCcdEnabled(true));

    if (!resting) body.applyImpulse({ x: rand(-0.6, 0.6) * body.mass(), y: rand(2.5, 3.5) * body.mass(), z: rand(-0.6, 0.6) * body.mass() }, true);

  removeDrop(d) { World.phys.removeRigidBody(d.body); d.body = null; World.group.remove(d.mesh); World.drops.splice(World.drops.indexOf(d), 1); World.ents.splice(World.ents.indexOf(d), 1); },

  door(def, x, y, id, st) {
    const horiz = World.isWallChar(World.charAt(x - 1, y)) || !!World.L.legend[World.charAt(x - 1, y)]; // walls left/right → panel spans x
    const spanX = World.isWallChar(World.charAt(x - 1, y)) && World.isWallChar(World.charAt(x + 1, y));
    const g = new THREE.Group(); g.position.copy(tileCenter(x, y)); g.rotation.y = spanX ? 0 : Math.PI / 2; World.group.add(g);
    const H = World.L.wallH, dh = Math.min(H, 3.3), frameM = Mat.toon(World.L.theme === 'mine' ? 0x4a3a2a : World.L.theme === 'forest' ? 0x5a3a1e : 0x6a5a4a);
    Models.part('box', frameM, 0.35, H, 0.6, -TILE / 2 + 0.17, H / 2, 0, g); Models.part('box', frameM, 0.35, H, 0.6, TILE / 2 - 0.17, H / 2, 0, g);
    if (World.L.theme !== 'forest') Models.part('box', frameM, TILE, H - dh + 0.2, 0.6, 0, dh + (H - dh) / 2 - 0.1, 0, g);
    else Models.part('box', frameM, TILE, 0.4, 0.6, 0, dh + 0.2, 0, g);
    const panel = new THREE.Group(); g.add(panel);
    if (def.gate || def.mine) { const iron = Mat.toon(0x3a3a44); for (let i = -3; i <= 3; i++) Models.part('box', iron, 0.1, dh, 0.1, i * 0.38, dh / 2, 0, panel); for (let j = 1; j < 4; j++) Models.part('box', iron, TILE - 0.6, 0.1, 0.12, 0, j * dh / 4, 0, panel); }
    else if (def.wood) { const w = Mat.toon(0x7a5230); for (let i = -3; i <= 3; i++) { Models.part('cyl', w, 0.36, dh, 0.36, i * 0.36, dh / 2, 0, panel); Models.part('cone', w, 0.36, 0.4, 0.36, i * 0.36, dh + 0.2, 0, panel); } }
    else { Models.part('box', Mat.toon(0x7a4a24), TILE - 0.66, dh, 0.18, 0, dh / 2, 0, panel); Models.part('box', Mat.toon(0x3a3a44), TILE - 0.6, 0.12, 0.22, 0, dh * 0.25, 0, panel); Models.part('box', Mat.toon(0x3a3a44), TILE - 0.6, 0.12, 0.22, 0, dh * 0.75, 0, panel); Models.part('sph', Mat.toon(0xe2b23a), 0.12, 0.12, 0.12, 0.8, dh * 0.5, 0.15, panel); }
    if (def.key) { const lock = Models.part('box', Mat.toon(0xe2b23a), 0.3, 0.36, 0.3, 0, 1.2, 0.12, panel); lock.userData.lock = true; }
    const open = !!(st.opened || {})[id];
    let blk = open ? null : Ent.blockTile(x, y, spanX ? TILE / 2 : 0.2, spanX ? 0.2 : TILE / 2, H);
    if (open) panel.position.y = dh - 0.25;
    if (!open) World.setSolid(x, y, true);
    const e = this.addInteract({ kind: 'door', id, def, x, y, pos: tileCenter(x, y), open, panel, dh,
      prompt: () => {
        if (e.open) return def.locked || def.key ? null : 'Close door';
        if (def.key) return Game.hasItem(def.key) ? 'Unlock with ' + itemName(def.key) : 'Locked';
        if (def.locked === 'seal') return 'A heavy portcullis';

        return 'Open door';
      },
      interact: () => {
        if (e.open) { if (!def.locked && !def.key) e.setOpen(false); return; }
        if (def.key) { if (Game.hasItem(def.key)) { Game.takeItem(def.key); Game.msg(`The ${itemName(def.key)} turns in the lock.`); def.key = null; e.setOpen(true); } else { Audio_.sfx('error'); Game.msg('It is locked. You need the ' + itemName(def.key) + '.'); } return; }

        e.setOpen(true);

      setOpen(v, silent) {

        const from = panel.position.y, to = v ? dh - 0.25 : 0;
        Tweens.add(0.9, (k) => { panel.position.y = lerp(from, to, easeOut(k)); });
        if (v) { Ent.unblock(blk, x, y); blk = null; } else { blk = Ent.blockTile(x, y, spanX ? TILE / 2 : 0.2, spanX ? 0.2 : TILE / 2, H); }
      } });

  },
  doorById(id) { return World.ents.find((e) => e.kind === 'door' && e.id === id); },

  lever(def, x, y, id, st) {
    const g = new THREE.Group(); g.position.copy(tileCenter(x, y)); World.group.add(g);
    Models.part('box', Mat.toon(0x4a4a52), 0.6, 0.5, 0.6, 0, 0.25, 0, g);
    const arm = Models.pivot(0, 0.5, 0, g); Models.part('cyl', Mat.toon(0x6b4a2a), 0.08, 1.0, 0.08, 0, 0.5, 0, arm); Models.part('sph', Mat.toon(0xc8402a), 0.2, 0.2, 0.2, 0, 1.0, 0, arm);

    const blk = this.blockTile(x, y, 0.35, 0.35, 1.2);

      prompt: () => 'Pull lever',

  rally(m) { for (const o of World.mons) if (!o.alert && o.dead === 0 && o.pos.distanceTo(m.pos) < 9) o.alert = true; },

// Projectiles (spells, arrows, sling stones) — Rapier ray casts against walls
// ============================================================================
const Proj = {
  spawn(o) {
    const mesh = new THREE.Group(); const core = Models.part(o.shape || 'sph', Mat.glow(o.color), o.size, o.size, o.size, 0, 0, 0, mesh); core.castShadow = false;
    if (o.glowSize) { const halo = Models.part('sph', new THREE.MeshBasicNodeMaterial({ color: o.color, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false }), o.glowSize, o.glowSize, o.glowSize, 0, 0, 0, mesh); halo.castShadow = false; }
    if (o.light) { const l = new THREE.PointLight(o.color, o.light, 8, 2); mesh.add(l); }
    mesh.position.copy(o.pos); World.group.add(mesh);
    const p = { ...o, mesh, life: o.life || 3 }; World.projs.push(p); return p;
  },
  update(dt) {
    for (let i = World.projs.length - 1; i >= 0; i--) {
      const p = World.projs[i]; p.life -= dt; const step = p.vel.clone().multiplyScalar(dt); const len = step.length();
      const dir = step.clone().divideScalar(len || 1); const wall = World.rayDist(p.pos, dir, len + 0.15);
      let hit = null;
      if (p.from === 'party') { for (const m of World.mons) { if (m.dead > 0) continue; const c = m.pos.clone().setY(0.9 * (m.def.scale || 1)); if (segDist(p.pos, p.pos.clone().add(step), c) < m.r + 0.35 + (p.size || 0)) { hit = m; break; } }
        if (!hit) for (const e of World.ents) if (e.breakable && segDist(p.pos, p.pos.clone().add(step), e.pos) < 0.8) { e.hit(10); Proj.finish(p, i, p.pos.clone()); hit = 'b'; break; }
        if (hit === 'b') continue; }
      else { const c = World.party.pos.clone().setY(1.2); if (segDist(p.pos, p.pos.clone().add(step), c) < 0.75) hit = 'party'; }
      if (hit) { Proj.impact(p, hit); Proj.finish(p, i, p.pos.clone().add(step)); continue; }
      if (wall < len + 0.1 || p.life <= 0) { const at = p.pos.clone().addScaledVector(dir, Math.min(wall, len)); Proj.impact(p, null, at); Proj.finish(p, i, at); continue; }
      p.pos.add(step); if (p.gravity) p.vel.y -= p.gravity * dt; p.mesh.position.copy(p.pos); p.mesh.rotation.y += dt * 6;
      if (p.trail && Math.random() < dt * 40) FX.emit(p.pos, { n: 1, color: p.trail, speed: 0.4, gravity: 0, life: 0.4, size: (p.size || 0.2) * 0.6 });
    }
  },
  finish(p, i, at) { World.group.remove(p.mesh); World.projs.splice(i, 1); if (p.burst) FX.emit(at, { n: p.burst, color: p.trail || p.color, speed: 3.5, life: 0.6, size: 0.08 }); },
  impact(p, target, at) {
    const where = at || p.pos;
    if (p.kind === 'fireball') { Spells.explode(where.clone(), p); return; }
    if (target === 'party') { Game.damageParty(p.dmg, p.owner, { ranged: true, curse: p.kind === 'hex' }); return; }
    if (target && target.def) {
      const d = Mon.damage(target, p.dmg, { element: p.element, slow: p.slow, freeze: p.freeze });
      if (p.member && d) Game.gainXP(p.member, p.skill || 'M', d * 0.6);
      if (p.chain && d) { const n = World.mons.filter((m) => m !== target && m.dead === 0 && m.pos.distanceTo(target.pos) < 7).sort((a, b) => a.pos.distanceTo(target.pos) - b.pos.distanceTo(target.pos))[0];
        if (n) { Spells.bolt(target.pos.clone().setY(1), n.pos.clone().setY(1)); Mon.damage(n, Math.round(p.dmg * 0.6), { element: 'spark' }); } }
    } else Audio_.sfx(p.kind === 'stone' || p.kind === 'arrow' ? 'thud' : 'zap', Game.pan(where));
  },
  monsterShot(m) {
    const from = m.pos.clone().setY(1.3 * (m.def.scale || 1)); const to = World.party.pos.clone().setY(1.3);
    const vel = to.sub(from).normalize().multiplyScalar(m.def.ranged.speed);
    const hex = m.def.ranged.kind === 'hex';
    Audio_.sfx(hex ? 'cast' : 'arrow', Game.pan(m.pos));
    Proj.spawn({ pos: from, vel, from: 'mon', owner: m, kind: m.def.ranged.kind, dmg: randi(m.def.dmg[0], m.def.dmg[1]), color: hex ? 0xc070ff : 0xd8c8a0, size: hex ? 0.3 : 0.12, shape: hex ? 'ico' : 'cone', light: hex ? 6 : 0, trail: hex ? [0xc070ff, 0x6a2a8a] : null, glowSize: hex ? 0.6 : 0, burst: hex ? 20 : 0 });
  },
};
function segDist(a, b, p) { const ab = b.clone().sub(a); const t = clamp(p.clone().sub(a).dot(ab) / Math.max(ab.lengthSq(), 1e-6), 0, 1); return a.clone().addScaledVector(ab, t).distanceTo(p); }

const ABOUT_HTML = "<h2 style=\"color:var(--gold)\">Wands of Lore — The Throne of Chaos</h2><p>An original spiritual successor to Lands of Lore: The Throne of Chaos (Westwood Studios, 1993). All names, story, art, music and code are new.</p><h3>Source Information</h3><div>• <b>Date:</b> 2026-10-29 06:03</div><div>• <b>Source:</b> Lands of Lore: The Throne of Chaos</div><div>• <b>Tech:</b> Three.js r180 (WebGPURenderer, WebGPU only, no fallback; TSL nodes, MeshToonNodeMaterial, toonOutlinePass post-processing), Rapier 0.19.3 (@dimforge/rapier3d-compat: kinematic character controller for party and monsters, ray-cast line of sight and projectile hits, dynamic rigid bodies for dropped loot, pressure-plate weights and barrel/bone debris), Gamepad API, Web Audio API, Canvas 2D (portraits, storybook art, automap), plain ES modules, single HTML file with CDN imports (jsDelivr)</div><div>• <b>Art Direction:</b> stylized cel shading: 4-band toon gradient, inverted-hull ink outlines on characters and props, hand-drawn ink edge lines on architecture, procedural painterly canvas textures, warm torchlight, storybook narration paintings</div><div>• <b>Animation:</b> procedural hierarchical rigs built from primitives (humanoid, quadruped, spider, golem) driven by code: walk cycles, attack wind-up/strike, hit flinch, cast, talk, death; tweened doors, levers, chests and secret walls; first-person weapon view-model swings; 2D portraits that blink, talk and grimace</div><div>• <b>Audio:</b> all code-written with Web Audio: a step-sequenced, deterministic-composed score with six themes (title, castle, forest, mine, boss, victory) and a combat-intensity layer; synthesized SFX (weapons, spells, doors, coins, footsteps, monsters, UI); Animalese-style gibberish voices with per-character pitch, timbre and vowel formants for every spoken line, including the narrator</div><div>• <b>Online:</b> AI Hub Session Protocol v1 (session.js 1.3.0), \"race\" mode (Playing together): every player delves the same dungeon at once, rivals shown solid in seat colours with name tags, interpolated ~150 ms behind and bumping mutually; kills and chests are first-come claims (the later claim quietly undoes its Glory); state at 12 Hz unreliable, claims reliable; menus never pause the shared world; survives any player or host leaving; Glory progress, result with stats and awards, probe; no other network features</div><div>• <b>Testing:</b> lightweight automated checks only: a Node map validator (grid sizes, legend coverage, BFS reachability including teleporters); Playwright Chromium (headed under Xvfb, WebGPU on SwiftShader) for boot, menus, gameplay screenshots and console errors; a scripted logic run from the title to the boss and a save/load; an emulated DualSense and a touch-only device profile; the official AI Hub harness in race mode (pass at 2, 3 and 4 players on a lossy 150 ms network and with the host leaving). No real GPU, controller or TV was available.</div><div>• <b>Environment:</b> Claude Code CLI (headless); Linux; browser unknown</div><div>• <b>Model:</b> Anthropic, claude-opus-5-5, reasoning effort medium</div><div>• <b>Usage:</b> cost and tokens unknown (no reliable estimate is available to the model); session time about 1 h 11 min (06:03 to 07:14)</div><h3>How to Play</h3><p>Controller first (PS5 layout), keyboard and mouse mirror it.</p><div>• <b>Move:</b> left stick / WASD. Turn &amp; look: right stick / mouse (click to capture) or Q/E and arrow keys. Run: L3 / Shift.</div><div>• <b>Attack with the whole party:</b> R2 / left mouse / J. Each champion swings when their portrait cooldown is clear.</div><div>• <b>Cast the selected spell:</b> L2 / right mouse / K. Choose spell: D-pad left/right / Z, C, wheel. Spell power 1–4: D-pad up/down / R, V.</div><div>• <b>Use, talk, open:</b> Cross / Space, F, Enter. Quick potion: Circle / H. Party &amp; inventory: Triangle / I, Tab. Map: Square / M. Lead champion: L1/R1 / 1-3. Menu: Options / Esc.</div><div>• Settings include Invert Horizontal and Invert Vertical controller axes.</div><h3>Features in the Demo</h3><div>• Choose one of four champions; two more join on the road (a rescued captive and a prisoner): a party of three with shared packs.</div><div>• <b>Real-time first-person party combat:</b> per-champion weapon cooldowns, melee arcs, sling and crossbow projectiles, wands that cast for free, crits, dodges, poison, knock-back.</div><div>• Use-based skill growth in Fighter, Rogue and Mage with named ranks; Mage rank unlocks spell power levels 1–4.</div><div>• <b>Five spells:</b> Spark (chains at power 3+), Mend (cures poison at 3, heals all at 4), Fireball (physics blast), Frostbind (slow, then freeze), Lumen (light for the dark Delve).</div><div>• <b>Three regions:</b> Gladhallow Keep, Whisperwood and the Sunken Delve, with exits, an automap, minimap and compass.</div><div>• <b>Puzzles and secrets:</b> keys and locked doors, levers, a pressure plate held by a physics rock, a hidden switch, an illusory hedge, teleporter pads.</div><div>• NPCs with branching gibberish-voiced dialogue, two shops (buy/sell), side tasks, a journal and spellbook, resting, saves (3 slots + autosave).</div><div>• <b>A three-form boss:</b> the Masked One, wearing Scolda's Mirror Mask.</div><div>• Attract mode after 10 s idle on the title; any input exits. AI Hub race sessions: up to four players delve the same dungeon together.</div><h3>Engine Feedback</h3><div>• What did you like most about the engine? Three.js r180's WebGPURenderer plus TSL: toonOutlinePass gives ink outlines for every toon material in one line, and node materials (animated water, sky gradient) need no GLSL. Rapier's character controller made sliding collision for the party and every monster a single shared call.</div><div>• Did you get stuck or guess wrong? The core toonOutlinePass only extrudes along vertex normals, so flat wall quads get no outline; I switched architecture to drawn ink edge-lines. Rapier's ray hit field is timeOfImpact in 0.19 (older docs say toi); I read both.</div><div>• What was the most important thing you had to build yourself? The level builder that turns ASCII grids and legends into merged geometry, colliders and live entities, so new areas are pure data.</div><div>• What was the hardest part about using the engine? Verifying WebGPU rendering headlessly (it needs SwiftShader flags), and keeping WebGPURenderer from silently falling back to WebGL: the game checks backend.isWebGPUBackend and refuses to run without WebGPU.</div><div>• If you had to remove or overhaul one thing from engine, what would that be? The silent WebGL fallback in WebGPURenderer: it should be opt-in, not automatic.</div><div>• If you could change one thing about the engine, what would it be? A built-in screen-space edge/outline pass for TSL that uses depth and normals, so architecture and characters share one consistent ink line.</div><h3>Prompt Feedback</h3><div>• What did you like most about this prompt? It is specific about what matters (controller-first 10-foot UX, attract mode, inverted-axis toggles, touch fallback, code-written audio) while leaving design freedom.</div><div>• What was confusing? \"Follow ai-hub … as well as for the game on its own\" can mean either the hub's own-multiplayer adapter pattern or simply \"still play normally alone\"; I implemented the hub's race mode (playing together in one shared dungeon) and kept single-player intact. The protocol asks for a WebGL 2 fallback while the prompt says WebGPU with no fallback; I followed the prompt and declared hub:webgpu required.</div><div>• What was the hardest thing to do? Fitting a full vertical slice (party RPG, spells, puzzles, boss, three regions, menus, saves, attract mode, hub) into one session with lightweight testing.</div><div>• If there was one test you could have run, what would that test be? A real PS5 controller on a TV at ten feet, playing from the title to the boss.</div><h3>Testing Feedback</h3><div>• <b>How many issues did testing catch? 15:</b> shadow maps over WebGPU's 16-texture limit (broken pipelines), a CSS rule stretching every canvas full-screen, the hub probe sampling input per frame (hub keyboard check failed), the 10-second attract timer and HUD banners running on the capped sim clock, menus stealing focus from a resting mouse, a looping default dialogue choice, the minimap not revealing the spawn, dialogue covering the party, an oversized first-person weapon, a dark throne end, the message log hidden behind portraits, an overflowing inventory, tiny rats, an overlapping DEMO banner, and a favicon 404.</div><div>• How many would be considered critical issues / game breaking? 3: the shadow-texture limit (nothing rendered correctly), the stretched canvases (HUD unusable), and the probe input (the game would be kept out of AI Hub sessions).</div><div>• What was the most helpful test you ran? A scripted logic run that drives the real simulation from the title to the boss, the Lorewand, the victory screen and a save/load round trip, plus headed Chromium under Xvfb with WebGPU on SwiftShader for screenshots, and the official AI Hub harness in race mode (passes at 2, 3 and 4 players and with the host leaving).</div><div>• What was the least helpful test you ran? Headless Chromium screenshots: the WebGPU canvas always captured black, even for a one-cube test page, so it said nothing about the game.</div><h3>Credits</h3><p>Design, code, art, music, sound and voices: generated in one session by Claude (Anthropic, claude-opus-5-5) for Michael Crosato's cc-matrix. Inspired by Lands of Lore: The Throne of Chaos by Westwood Studios. Libraries: three.js (MIT), Rapier (Apache-2.0). Fonts: Cinzel, Cinzel Decorative and Alegreya (Google Fonts, OFL).</p>";
