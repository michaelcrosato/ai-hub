// ---------------------------------------------------------------- automap
const MapView = {
  draw(cv, mini) {
    if (!World.L || !World.party) return; const g = cv.getContext('2d'), W = cv.width, H = cv.height; const ex = World.st.explored; const P = World.party; const [px, py] = toTile(P.pos);
    g.save(); g.clearRect(0, 0, W, H);
    let cs, ox, oy;
    if (mini) { cs = W / 13; ox = W / 2 - (P.pos.x / TILE) * cs; oy = H / 2 - (P.pos.z / TILE) * cs; g.beginPath(); g.arc(W / 2, H / 2, W / 2 - 2, 0, TAU); g.clip(); g.fillStyle = 'rgba(16,11,6,.85)'; g.fillRect(0, 0, W, H); }
    else { cs = Math.min(W / World.W, H / World.H); ox = (W - World.W * cs) / 2; oy = (H - World.H * cs) / 2; g.fillStyle = '#e9dcb6'; g.fillRect(0, 0, W, H); }
    const parch = !mini; const wallC = parch ? '#5a4228' : '#c8b088', floorC = parch ? '#d6c49a' : 'rgba(120,95,60,.55)';
    for (let y = 0; y < World.H; y++) for (let x = 0; x < World.W; x++) {
      if (!ex[y * World.W + x]) continue; const c = World.charAt(x, y); const X = ox + x * cs - cs / 2, Y = oy + y * cs - cs / 2;
      if (mini && (X < -cs || Y < -cs || X > W || Y > H)) continue;
      if (c === '#' || c === 'T') { g.fillStyle = c === 'T' ? (parch ? '#4a6a3a' : '#5a8a4a') : wallC; g.fillRect(X, Y, cs + 0.5, cs + 0.5); continue; }
      if (c === '~') { g.fillStyle = '#4a8aaa'; g.fillRect(X, Y, cs + 0.5, cs + 0.5); continue; }
      g.fillStyle = floorC; g.fillRect(X, Y, cs + 0.5, cs + 0.5);
    }
    const dot = (x, y, col, r = 0.28, shape = 'c') => { const X = ox + x * cs, Y = oy + y * cs; g.fillStyle = col; g.beginPath(); if (shape === 'd') { g.moveTo(X, Y - cs * r); g.lineTo(X + cs * r, Y); g.lineTo(X, Y + cs * r); g.lineTo(X - cs * r, Y); } else g.arc(X, Y, cs * r, 0, TAU); g.fill(); };
    for (const e of World.ents) { if (e.x === undefined || !ex[e.y * World.W + e.x]) continue;
      if (e.kind === 'door') { g.fillStyle = e.open ? '#8a6' : '#c86'; g.fillRect(ox + e.x * cs - cs * 0.35, oy + e.y * cs - cs * 0.35, cs * 0.7, cs * 0.7); }
      else if (e.kind === 'npc') dot(e.x, e.y, '#6cf');
      else if (e.kind === 'chest') dot(e.x, e.y, e.opened ? '#887' : '#fe8', 0.3, 'd');
      else if (e.kind === 'exit') { g.fillStyle = parch ? '#2a1a0a' : '#fff'; g.font = `${cs * 0.9}px serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('⌂', ox + e.x * cs, oy + e.y * cs); if (!mini) { g.font = `${Math.max(11, cs * 0.5)}px Cinzel, serif`; g.fillText(e.def.label, ox + e.x * cs, oy + e.y * cs + cs * 0.9); } }
      else if (e.kind === 'tele') dot(e.x, e.y, '#6ff', 0.35);
      else if (e.kind === 'lever' || e.kind === 'plate') dot(e.x, e.y, '#ca6', 0.2);
    }
    for (const m of World.mons) { if (m.dead > 0) continue; const [mx, my] = toTile(m.pos); if (!ex[my * World.W + mx]) continue; if (m.alert || m.pos.distanceTo(P.pos) < 12) dot(m.pos.x / TILE, m.pos.z / TILE, '#f55', m.def.boss ? 0.4 : 0.22); }
    // party arrow
    const X = ox + P.pos.x / TILE * cs, Y = oy + P.pos.z / TILE * cs; g.save(); g.translate(X, Y); g.rotate(-P.yaw); g.fillStyle = parch ? '#b8862e' : '#e8c46a'; g.strokeStyle = '#140b06'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, -cs * 0.55); g.lineTo(cs * 0.38, cs * 0.4); g.lineTo(0, cs * 0.2); g.lineTo(-cs * 0.38, cs * 0.4); g.closePath(); g.fill(); g.stroke(); g.restore();
    if (mini) { g.fillStyle = '#e8c46a'; g.font = 'bold 22px Cinzel, serif'; g.textAlign = 'center'; g.fillText('N', W / 2, 24); }
    g.restore();
  },
};

// ============================================================================
// GAME — party, combat, spells, inventory, story, saves
// ============================================================================
const BAG_SIZE = 32;
const Game = {
  mode: 'boot', party: [], bag: [], gold: 0, known: [], sel: 0, spellIdx: 0, power: 1,
  flags: {}, quest: 'audience', side: {}, stats: {}, levels: {}, levelId: null, companions: [],
  paused: false, over: false, attract: false, noclip: false, invisible: false, god: false, playTime: 0, busy: false,
  glory: 0, sessionStart: 0,

  // ------------------------------------------------------------ setup
  newMember(cid) {
    const c = CHAMPIONS[cid];
    const m = { id: cid, name: c.name, hpBase: c.hp, mpBase: c.mp, might: c.might, protBase: c.prot, skills: { ...c.skills }, xp: { F: SKILL_XP[c.skills.F], R: SKILL_XP[c.skills.R], M: SKILL_XP[c.skills.M] },
      equip: { head: null, body: null, main: null, off: null, ring: null }, cd: 0, poison: 0, down: false, hurt: 0, lastSkill: 'F', kills: 0 };
    for (const [slot, it] of Object.entries(c.gear)) if (it) m.equip[slot] = it;
    m.hp = this.maxHp(m); m.mp = this.maxMp(m);
    return m;
  },
  newGame(cid, opts = {}) {
    this.party = [this.newMember(cid)]; this.bag = new Array(BAG_SIZE).fill(null); this.gold = 20;
    this.known = cid === 'velkar' ? ['spark'] : []; this.sel = 0; this.spellIdx = 0; this.power = 1;
    this.flags = {}; this.quest = 'audience'; this.side = {}; this.stats = { kills: 0, secrets: 0, chests: 0, goldFound: 0, dmg: 0, deaths: 0, potions: 0, spells: 0 };
    this.levels = {}; this.companions = CHAMP_ORDER.filter((c) => c !== cid); this.playTime = 0; this.glory = 0;
    ['bread', 'bread', 'potion_heal'].forEach((i) => this.addItem(i, true));
    this.over = false; this.paused = false;
  },
  levelState(id) { return this.levels[id] || (this.levels[id] = { dead: [], taken: [], opened: {}, levers: {}, chests: {}, secrets: {}, barrels: {}, drops: [], explored: null }); },

  // ------------------------------------------------------------ derived stats
  itemsOf(m) { return Object.values(m.equip).filter(Boolean).map((i) => ITEMS[i]); },
  maxHp(m) { return m.hpBase + (m.skills.F - 1) * 6 + (m.skills.R - 1) * 3 + this.itemsOf(m).reduce((a, i) => a + (i.hpBonus || 0), 0); },
  maxMp(m) { return m.mpBase + (m.skills.M - 1) * 6 + this.itemsOf(m).reduce((a, i) => a + (i.mpBonus || 0), 0); },
  prot(m) { return m.protBase + (m.skills.R - 1) + this.itemsOf(m).reduce((a, i) => a + (i.prot || 0), 0); },
  maxPower(m) { return clamp(m.skills.M, 1, 4); },
  alive() { return this.party.filter((m) => !m.down); },
  member() { const m = this.party[this.sel]; return m && !m.down ? m : this.alive()[0]; },
  slowed() { return false; },
  pan(pos) { const P = World.party; if (!P) return 0; const r = new THREE.Vector3(Math.cos(P.yaw), 0, -Math.sin(P.yaw)); const d = pos.clone().sub(P.pos); return clamp(d.normalize().dot(r), -0.9, 0.9); },

  // ------------------------------------------------------------ messages & feedback
  msg(text, color) { UI.log(text, color); },
  floatText(pos, text, color) { UI.floatAt(pos, text, color); },
  stat(k, n = 1) { this.stats[k] = (this.stats[k] || 0) + n; },
  secret() { this.stat('secrets'); this.addGlory(60, 'Secret found'); Audio_.sfx('secret'); UI.banner('Secret Found', 'Well spotted!'); },
  addGlory(n) { this.glory += n; Hub.progress(); },

  // ------------------------------------------------------------ inventory
  addItem(id, silent) {
    if (id.startsWith('gold:')) { const n = +id.slice(5); this.gold += n; this.stat('goldFound', n); this.addGlory(n); if (!silent) { Audio_.sfx('coin'); this.msg(`+${n} crowns`, '#f2c230'); } return true; }
    const it = ITEMS[id];
    if (it && it.stack) { const s = this.bag.find((b) => b && b.id === id); if (s) { s.qty++; if (!silent) this.msg(`Took ${it.name}.`); return true; } }
    const i = this.bag.indexOf(null); if (i < 0) { if (!silent) { this.msg('Your packs are full!', '#ff8060'); Audio_.sfx('error'); } return false; }
    this.bag[i] = { id, qty: 1 }; if (!silent) this.msg(`Took ${it.name}.`);
    return true;
  },
  hasItem(id) { return this.bag.some((b) => b && b.id === id) || this.party.some((m) => Object.values(m.equip).includes(id)); },
  takeItem(id) { const i = this.bag.findIndex((b) => b && b.id === id); if (i < 0) return false; if (--this.bag[i].qty <= 0) this.bag[i] = null; return true; },
  pickup(id) {

    Story.onPickup(id);
    return true;
  },
  loot(it, pos) { if (!this.addItem(it)) Ent.drop(it, pos.clone().setY(1)); else if (!it.startsWith('gold:')) Audio_.sfx('pickup'); Story.onPickup(it); },
  dropFromBag(i) {
    const b = this.bag[i]; if (!b) return; const it = ITEMS[b.id];
    if (it.type === 'quest' || it.type === 'key') { Audio_.sfx('error'); this.msg('You had better keep that.'); return; }
    const P = World.party; const f = World.forward(); const pos = P.pos.clone().addScaledVector(f, 1.4).setY(1.3);
    const d = Ent.drop(b.id, pos); d.body.setLinvel({ x: f.x * 2.5, y: 1.5, z: f.z * 2.5 }, true);
    (World.st.drops = World.st.drops || []);

  },
  canEquip(m, id, slot) {

  },
  equip(m, bagIdx, slot) {

    if (ok === 'mage') { this.msg(`${m.name} lacks the training to wield wands (Mage 2 needed).`, '#ff8060'); Audio_.sfx('error'); return false; }
    if (!ok) { Audio_.sfx('error'); return false; }
    const old = m.equip[slot]; m.equip[slot] = b.id; this.bag[bagIdx] = old ? { id: old, qty: 1 } : null;
    if (b.qty > 1) { this.bag[bagIdx] = { id: b.id, qty: b.qty - 1 }; if (old) this.addItem(old, true); }
    m.hp = Math.min(m.hp, this.maxHp(m)); m.mp = Math.min(m.mp, this.maxMp(m));
    Audio_.sfx('pickup'); View.rebuild(); return true;
  },
  unequip(m, slot) { const id = m.equip[slot]; if (!id) return; if (!this.addItem(id, true)) { this.msg('No room in your packs.'); return; } m.equip[slot] = null; m.hp = Math.min(m.hp, this.maxHp(m)); m.mp = Math.min(m.mp, this.maxMp(m)); Audio_.sfx('pickup'); View.rebuild(); },
  useItem(m, bagIdx) {
    const b = this.bag[bagIdx]; if (!b) return; const it = ITEMS[b.id];
    if (it.type === 'scroll') { if (this.known.includes(it.teaches)) { this.msg('You already know ' + SPELLS[it.teaches].name + '.'); return; } this.learn(it.teaches); this.bag[bagIdx] = null; return; }
    if (it.type === 'potion' || it.type === 'food') {
      if (m.down && !it.heal) return;
      if (it.heal) { m.hp = Math.min(this.maxHp(m), m.hp + it.heal); if (m.down && m.hp > 0) { m.down = false; this.msg(`${m.name} comes to!`); } }
      if (it.mana) m.mp = Math.min(this.maxMp(m), m.mp + it.mana);
      if (it.cure) m.poison = 0;
      Audio_.sfx(it.type === 'food' ? 'eat' : 'drink'); this.stat('potions'); UI.flashPortrait(this.party.indexOf(m), it.heal ? '+' + it.heal : '', '#7dff9a');
      if (--b.qty <= 0) this.bag[bagIdx] = null; return;
    }

  },
  quickPotion() {
    const hurt = this.party.filter((m) => m.hp < this.maxHp(m) || m.down).sort((a, b) => a.hp / this.maxHp(a) - b.hp / this.maxHp(b))[0];
    if (!hurt) { this.msg('Everyone is hale and hearty.'); return; }

  },
  learn(sp) { if (this.known.includes(sp)) return; this.known.push(sp); this.known.sort((a, b) => SPELL_ORDER.indexOf(a) - SPELL_ORDER.indexOf(b)); this.spellIdx = this.known.indexOf(sp); Audio_.sfx('levelup'); UI.banner('New Spell: ' + SPELLS[sp].name, SPELLS[sp].desc); },

  // ------------------------------------------------------------ progression

      Audio_.sfx('levelup'); UI.banner(`${m.name}: ${SKILL_NAMES[skill]} ${m.skills[skill]}`, `Now a ${rank}. ${skill === 'M' ? 'Spells may be cast at higher power.' : skill === 'F' ? 'Stronger blows, more health.' : 'Quicker hands, harder to hit.'}`);

  },
  onKill(mon) {

  onKill_(mon) {

    for (const [item, ch] of (mon.def.loot || [])) if (Math.random() < ch) Timers.after(0.5, () => Ent.drop(item, mon.pos.clone().setY(1.2)));

  // ------------------------------------------------------------ combat: party

    ready.forEach((m, i) => { m.cd = 0.25; Timers.after(i * 0.2, () => this.memberAttack(m)); });
  },
  memberAttack(m) {
    if (m.down) return; const w = ITEMS[m.equip.main] || { dmg: [1, 3], cd: 0.8, skill: 'F', name: 'Fists' };
    m.cd = w.cd * (1 - 0.04 * (m.skills[w.skill] - 1)); m.cdMax = m.cd;

    }
    if (w.ranged) {
      const from = World.eye().addScaledVector(f, 0.6); const aim = this.aimDir(from, 18);
      Audio_.sfx('arrow'); Proj.spawn({ pos: from, vel: aim.multiplyScalar(22), from: 'party', member: m, skill: 'R', kind: 'stone', dmg: randi(w.dmg[0], w.dmg[1]) + Math.floor(m.might / 4) + m.skills.R, color: 0x9a9aa8, size: 0.12, gravity: 3, burst: 6 });
      return;

    for (const mon of World.mons) { if (mon.dead > 0) continue; const to = mon.pos.clone().sub(P.pos); to.y = 0; const d = to.length() - mon.r; if (d > 2.6) continue; const a = Math.acos(clamp(to.normalize().dot(f), -1, 1)); if (a > 0.9) continue; if (d + a < bs) { bs = d + a; best = mon; } }
    const brk = !best && World.ents.find((e) => e.breakable && e.pos.distanceTo(P.pos) < 2.8 && e.pos.clone().sub(P.pos).setY(0).normalize().dot(f) > 0.6);
    if (brk) { brk.hit(randi(w.dmg[0], w.dmg[1]) + 2); Audio_.sfx('swing'); return; }

  aimDir(from, range) {

    const f = World.forward(); const P = World.party; f.y = Math.sin(P.pitch); f.normalize();
    let best = null, ba = 0.22;
    for (const mon of World.mons) { if (mon.dead > 0) continue; const c = mon.pos.clone().setY(0.9 * (mon.def.scale || 1)); const to = c.clone().sub(from); const d = to.length(); if (d > range) continue; const a = Math.acos(clamp(to.normalize().dot(f), -1, 1)); if (a < ba && World.los(from, c)) { ba = a; best = to; } }
    return best ? best.normalize() : f;
  },
  castSelected() {
    if (this.busy) return; const sp = this.known[this.spellIdx]; if (!sp) { this.msg('You know no spells yet. Find scrolls or a teacher!'); Audio_.sfx('error'); return; }
    let m = this.member(); if (!m) return;
    const p = Math.min(this.power, this.maxPower(m)); const cost = SPELLS[sp].cost * p;
    if (m.mp < cost) { const other = this.alive().filter((o) => o.mp >= SPELLS[sp].cost * Math.min(this.power, this.maxPower(o)) && o.cd <= 0)[0]; if (other) m = other; }
    const pp = Math.min(this.power, this.maxPower(m)); const cc = SPELLS[sp].cost * pp;
    if (m.cd > 0) { this.msg(`${m.name} is not ready.`); return; }
    if (m.mp < cc && !this.god) { this.msg(`${m.name} lacks the magic (${cc} needed).`, '#80a0ff'); Audio_.sfx('fizzle'); return; }
    if (!this.god) m.mp -= cc; m.cd = 1.0; m.cdMax = 1.0; this.stat('spells');
    View.cast(SPELLS[sp].color);
    Spells.fire(sp, m, pp, false);
    this.gainXP(m, 'M', cc * 2);
  },

  // ------------------------------------------------------------ combat: party takes hits
  damageParty(amount, src, opts = {}) {
    if (this.god || this.over) { if (this.god) UI.hurt(0.3); return; }
    const al = this.alive(); if (!al.length) return;
    const m = pick(al); const diff = [0.7, 1, 1.3][Settings.data.difficulty] || 1;
    let d = Math.max(1, Math.round(amount * diff) - Math.floor(this.prot(m) / 3));
    if (Math.random() < 0.04 * m.skills.R) { this.floatText(World.eye().addScaledVector(World.forward(), 1.2), `${m.name} dodges!`, '#9fd8ff'); Audio_.sfx('block'); return; }
    m.hp -= d; m.hurt = 1; this.stat('taken', d);
    if (opts.poison && !m.poison) { m.poison = 20; this.msg(`${m.name} is poisoned!`, '#9aff6a'); }
    if (opts.curse) { m.mp = Math.max(0, m.mp - 4); }
    UI.flashPortrait(this.party.indexOf(m), '-' + d, '#ff5040'); UI.hurt(Math.min(1, d / 12));
    Audio_.sfx('hurt'); R.addShake(Math.min(0.6, d / 15));
    if (m.hp <= 0) { m.hp = 0; m.down = true; m.poison = 0; this.msg(`${m.name} has fallen!`, '#ff5040'); this.stat('deaths'); if (!this.alive().length) this.partyDefeated(); }
  },
  partyDefeated() {
    this.over = true; Audio_.sfx('gameover'); Audio_.music(null);
    if (SESSION && Hub.on) { Timers.clear(); Hub.respawn(); return; }
    setTimeout(() => UI.gameOver(), 1600);
  },
  updateParty(dt) {
    for (const m of this.party) {
      m.cd = Math.max(0, m.cd - dt); m.hurt = Math.max(0, m.hurt - dt * 2);
      if (m.down) continue;
      // slow natural regeneration of magic; poison ticks
      m.mp = Math.min(this.maxMp(m), m.mp + dt * (0.18 + 0.05 * m.skills.M));
      if (m.poison > 0) { m.poison -= dt; m.poisonT = (m.poisonT || 0) + dt; if (m.poisonT > 2) { m.poisonT = 0; m.hp -= 1; UI.flashPortrait(this.party.indexOf(m), '-1', '#9aff6a'); if (m.hp <= 0) { m.hp = 1; } } }
      if (this.god) { m.hp = this.maxHp(m); m.mp = this.maxMp(m); }
    }
  },
  rest() {
    if (World.mons.some((m) => m.dead === 0 && m.alert)) { this.msg('You cannot rest with enemies nearby!', '#ff8060'); Audio_.sfx('error'); return false; }
    if (World.mons.some((m) => m.dead === 0 && m.pos.distanceTo(World.party.pos) < 12)) { this.msg('Something stirs close by. It is not safe to rest here.', '#ff8060'); Audio_.sfx('error'); return false; }
    UI.fade(1, () => {
      for (const m of this.party) { if (m.down) { m.down = false; m.hp = 1; } m.hp = this.maxHp(m); m.mp = this.maxMp(m); m.poison = 0; }
      this.playTime += 3600; this.msg('The party rests for an hour. Wounds close, magic returns.'); Audio_.sfx('heal');
      setTimeout(() => UI.fade(0), 700);
    });
    return true;
  },

  // ------------------------------------------------------------ travel
  changeLevel(to, spawn, opts = {}) {
    if (this.busy) return; this.busy = true;
    UI.fade(1, () => {
      if (this.levelId) this.saveDrops();
      this.levelId = to; World.load(to, this.levelState(to), spawn); View.rebuild();
      Audio_.music(Story.musicFor(to)); UI.area(LEVELS[to].name);
      Story.onLevelLoaded(to);
      if (!this.attract && !SESSION && !opts.noSave) this.save('auto');
      this.busy = false; UI.fade(0);
    });
  },
  teleport(to, dir) {
    Audio_.sfx('teleport'); FX.emit(World.eye(), { n: 60, color: [0x66ffff, 0xffffff], speed: 4, gravity: 0 });
    UI.flash('#aaffff');
    const P = World.party; P.pos.set(to[0] * TILE, 1.06, to[1] * TILE); P.body.setNextKinematicTranslation(P.pos); P.yaw = -dir * Math.PI / 2; P.vel.set(0, 0, 0);
    P.tile = to[0] + ',' + to[1]; World.computeFlow(true); World.reveal(to[0], to[1]);
  },
  saveDrops() { const st = this.levelState(this.levelId); st.drops = World.drops.filter((d) => !d.id && d.body).map((d) => ({ item: d.item, x: d.pos.x, z: d.pos.z })); },

  // ------------------------------------------------------------ saving
  snapshot() {
    this.saveDrops(); const P = World.party;
    return { v: 1, at: Date.now(), levelId: this.levelId, pos: [P.pos.x, P.pos.z, P.yaw], party: this.party, bag: this.bag, gold: this.gold, known: this.known, sel: this.sel, spellIdx: this.spellIdx, power: this.power,
      flags: this.flags, quest: this.quest, side: this.side, stats: this.stats, levels: this.levels, companions: this.companions, playTime: this.playTime, glory: this.glory };
  },
  save(slot) { if (SESSION || this.attract) return false; const ok = Store.set('wol.save.' + slot, this.snapshot()); if (slot !== 'auto' && ok) this.msg('Game saved.'); return ok; },
  hasSave(slot) { return !!Store.get('wol.save.' + slot); },
  saveInfo(slot) { const s = Store.get('wol.save.' + slot); if (!s) return null; return { level: LEVELS[s.levelId].name, names: s.party.map((m) => m.name).join(', '), at: new Date(s.at), quest: s.quest }; },
  load(slot) {
    const s = Store.get('wol.save.' + slot); if (!s) return false;
    Object.assign(this, { party: s.party, bag: s.bag, gold: s.gold, known: s.known, sel: s.sel || 0, spellIdx: s.spellIdx || 0, power: s.power || 1, flags: s.flags, quest: s.quest, side: s.side, stats: s.stats, levels: s.levels, companions: s.companions, playTime: s.playTime, glory: s.glory || 0 });
    this.over = false; this.levelId = null;
    this.changeLevel(s.levelId, [s.pos[0], s.pos[1], s.pos[2], 1], { noSave: true });
    return true;
  },
  continueSlot() { const slots = ['auto', '1', '2', '3'].map((k) => [k, Store.get('wol.save.' + k)]).filter((x) => x[1]); slots.sort((a, b) => b[1].at - a[1].at); return slots[0] ? slots[0][0] : null; },
};

const Spells = {
  fire(sp, m, p, fromWand) {
    const P = World.party, f = World.forward(), from = World.eye().addScaledVector(f, 0.7).add(new THREE.Vector3(0, -0.1, 0));
    const col = SPELLS[sp].color;
    switch (sp) {
      case 'spark': {
        Audio_.sfx('spark'); const aim = Game.aimDir(from, 24);
        Proj.spawn({ pos: from, vel: aim.multiplyScalar(30), from: 'party', member: m, kind: 'spark', element: 'spark', dmg: 5 * p + randi(0, 3 * p) + (fromWand ? 0 : m.skills.M), chain: p >= 3, color: col, size: 0.16, glowSize: 0.45, light: 8, trail: [0x9fd8ff, 0xffffff], burst: 14, shape: 'ico' });
        break;
      }
      case 'fireball': {
        Audio_.sfx('fireball'); const aim = Game.aimDir(from, 24);
        Proj.spawn({ pos: from, vel: aim.multiplyScalar(16), from: 'party', member: m, kind: 'fireball', element: 'fire', dmg: 7 * p + randi(0, 4 * p), radius: 2.2 + 0.5 * p, color: col, size: 0.3 + 0.05 * p, glowSize: 0.8, light: 14, trail: [0xff8a2a, 0xffd060, 0xff3010], burst: 0 });
        break;
      }
      case 'frost': {
        Audio_.sfx('frost'); const range = 6 + p;
        for (let i = 0; i < 70; i++) { const d = f.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), rand(-0.5, 0.5)).multiplyScalar(rand(4, 10)); FX.emit(from, { n: 1, dir: d, speed: 0.5, color: [0xaef0ff, 0xffffff, 0x6ad0ff], gravity: -0.5, life: 0.8, size: 0.1, drag: 1.2 }); }
        let n = 0;
        for (const mon of World.mons) { if (mon.dead > 0) continue; const to = mon.pos.clone().sub(P.pos).setY(0); const d = to.length(); if (d > range) continue; if (to.normalize().dot(f) < 0.72) continue; if (!World.los(World.eye(), mon.pos.clone().setY(1))) continue;
          Mon.damage(mon, 3 * p + randi(0, 3 * p), { element: 'frost', slow: 4 + p, freeze: p >= 3 ? 1.5 + p * 0.6 : 0 }); n++; }
        if (n) Game.gainXP(m, 'M', n * 3);
        break;
      }
      case 'mend': {
        Audio_.sfx('heal'); const targets = p >= 4 ? Game.party.filter((x) => !x.down || p >= 4) : [Game.party.filter((x) => !x.down || p >= 3).sort((a, b) => a.hp / Game.maxHp(a) - b.hp / Game.maxHp(b))[0]];
        targets.forEach((t) => { if (!t) return; const amt = 10 * p + m.skills.M * 2; if (t.down) { t.down = false; t.hp = 0; Game.msg(`${t.name} is revived!`, '#7dff9a'); } t.hp = Math.min(Game.maxHp(t), t.hp + amt); if (p >= 3) t.poison = 0; UI.flashPortrait(Game.party.indexOf(t), '+' + amt, '#7dff9a'); });
        FX.emit(World.eye().addScaledVector(f, 0.8).add(new THREE.Vector3(0, -0.6, 0)), { n: 40, color: [0x7dff9a, 0xffffff], speed: 1.5, gravity: 2, life: 1, spread: 0.8 });
        break;
      }
      case 'lumen': {
        Audio_.sfx('lumen'); World.lumen = { t: 45 * p };
        if (!World.lumenOrb) { const o = new THREE.Group(); Models.part('sph', Mat.glow(0xfff6c8), 0.18, 0.18, 0.18, 0, 0, 0, o).castShadow = false; const l = new THREE.PointLight(0xfff1c8, 30, 26, 1.4); o.add(l); R.camera.add(o); World.lumenOrb = o; }
        Game.msg(`A globe of light springs from ${m.name}'s fingers.`);
        break;
      }
    }
  },
  explode(pos, p) {
    Audio_.sfx('boom', Game.pan(pos)); R.addShake(0.5);
    FX.emit(pos, { n: 120, color: [0xff8a2a, 0xffd060, 0xff3010, 0x6a3a2a], speed: 7, gravity: 1, life: 0.9, size: 0.16, spread: 0.3 });
    const flash = new THREE.PointLight(0xff8a30, 60, 16, 1.5); flash.position.copy(pos); World.group.add(flash);
    Tweens.add(0.5, (k) => { flash.intensity = 60 * (1 - k); }, () => World.group.remove(flash));
    World.explode(pos, p.radius, 5);
    for (const mon of World.mons) { if (mon.dead > 0) continue; const d = mon.pos.clone().setY(pos.y).distanceTo(pos); if (d > p.radius + mon.r) continue; const dm = Mon.damage(mon, Math.round(p.dmg * (1 - 0.4 * d / p.radius)), { element: 'fire', knock: 0.8 }); if (p.member && dm) Game.gainXP(p.member, 'M', dm * 0.5); }
    for (const e of [...World.ents]) if (e.breakable && e.pos.distanceTo(pos) < p.radius + 0.6) e.hit(20);
  },
  bolt(a, b) { const n = 14; for (let i = 0; i <= n; i++) { const pt = a.clone().lerp(b, i / n).add(new THREE.Vector3(rand(-0.2, 0.2), rand(-0.2, 0.2), rand(-0.2, 0.2))); FX.emit(pt, { n: 2, color: [0x9fd8ff, 0xffffff], speed: 0.3, gravity: 0, life: 0.25, size: 0.08 }); } Audio_.sfx('zap'); },
};

const View = {
  g: null, swingT: -1, castT: -1, castCol: 0xffffff, glow: null, wid: null,
  rebuild() {
    const m = Game.member(); const id = m ? m.equip.main : null;
    if (this.g && this.wid === id) return; this.wid = id;
    if (this.g) R.camera.remove(this.g);
    const g = new THREE.Group(); const it = ITEMS[id];
    const hand = Models.part('sph', Mat.toon(m ? (CHAMPIONS[m.id].face.skin.replace('#', '0x') | 0) : 0xe0b090), 0.09, 0.09, 0.11, 0, 0, 0, g);
    hand.castShadow = false;
    if (it) { const w = Models.weapon(it.type === 'wand' ? 'staff' : it.ranged ? 'club' : id === 'axe' ? 'axe' : id === 'warhammer' ? 'club' : 'sword', g); w.scale.setScalar(it.type === 'wand' ? 0.26 : 0.3); w.rotation.set(-0.3, 0, 0); w.position.set(0, 0, 0); w.traverse((o) => { o.castShadow = false; }); }
    this.glow = Models.part('sph', Mat.glow(0xffffff, { transparent: true, opacity: 0 }), 0.25, 0.25, 0.25, 0, 0.25, -0.2, g); this.glow.castShadow = false;
    g.position.set(0.42, -0.42, -0.75); g.rotation.set(0.2, -0.2, -0.15); g.scale.setScalar(0.8);
    R.camera.add(g); this.g = g;
  },
  swing() { this.swingT = 0; },
  cast(col) { this.castT = 0; this.glow.material = Mat.glow(col, { transparent: true, opacity: 0.85 }); },
  update(dt) {
    if (!this.g) return; const P = World.party; const sp = P ? Math.hypot(P.vel.x, P.vel.z) : 0;
    let rx = 0.2, ry = -0.2, rz = -0.15, px = 0.42, py = -0.42 + Math.sin((P ? P.bob : 0) * 1) * 0.015 * Math.min(1, sp / 4), pz = -0.75;
    if (this.swingT >= 0) { this.swingT += dt / 0.32; const k = this.swingT; const s = Math.sin(Math.min(1, k) * Math.PI); rx -= 1.6 * s; rz += 0.9 * s; px -= 0.25 * s; pz -= 0.2 * s; if (k >= 1) this.swingT = -1; }
    if (this.castT >= 0) { this.castT += dt / 0.5; const s = Math.sin(Math.min(1, this.castT) * Math.PI); py += 0.12 * s; pz -= 0.15 * s; this.glow.scale.setScalar(0.25 + s * 0.25); if (this.castT >= 1) { this.castT = -1; this.glow.scale.setScalar(0.0001); } }
    this.g.position.set(px, py, pz); this.g.rotation.set(rx, ry, rz);
  },
};

        ]);
        if (Game.side.moonpetal === 'active' && Game.hasItem('moonpetal')) return Dialog.run([

      { who: 'king', text: 'Only the Lorewand can strip such a mask away. My grandfather hid it in the Sunken Delve, beyond Whisperwood, when the dwarves still dug there.', choices: S.kingAsk() },
      { who: 'king', text: 'Take my Royal Seal. Captain Hale will raise the South Gate for its bearer. And take these crowns: Brasswick\'s blades are not cheap, and neither is your life.', act: () => { Game.addItem('royal_seal'); Game.addItem('gold:50'); S.setFlag('audience'); S.setQuest('gate'); } },

  kingAsk() {

      { label: 'Why send me, Majesty?', then: () => [{ who: 'king', text: 'Because you came when I called. Scolda could steal your face, champion — but never your heart.' }, ...back()] },

  // ------------------------------------------------------------ world hooks
  trigger(id) {

      Timers.after(1.3, () => { FX.emit(mon.pos.clone().setY(1.5), { n: 80, color: [0xc070ff, 0xe8e0ff, 0x6a2a8a], speed: 5, gravity: 0 }); const m = Mon.spawn(next, mon.pos.clone().setY(0), next); m.alert = true; R.addShake(0.4); });

        UI.boss(true);
      }

};
// the door to the Delve also nudges the quest along
const _doorInteract = Ent.door;
Ent.door = function (def, x, y, id, st) {
  const e = _doorInteract.call(this, def, x, y, id, st);
  if (id === 'delve') { const orig = e.interact; e.interact = () => { if (!Game.hasItem('delve_key') && !e.open) Story.setQuest('key'); orig(); }; }
  return e;
};

// ============================================================================
// DIALOG — portrait, typewriter text, gibberish voice, choices
// ============================================================================
const Dialog = {
  active: false, q: [], cur: null, shown: 0, choice: 0, onDone: null, el: null,
  run(lines, onDone) {
    if (this.active) { this.q.unshift(...lines); return; }
    this.active = true; this.q = [...lines]; this.onDone = onDone || null; Input.releaseLock(); UI.hud.classList.add('talk');
    this.el = el('div', 'dialog panel'); UI.screens.appendChild(this.el);
    this.next();
  },
  speakerOf(who) {
    if (who === 'hero') { const m = Game.party[0]; return { name: m.name, face: CHAMPIONS[m.id].face, voice: CHAMPIONS[m.id].voice }; }
    if (CHAMPIONS[who]) return { name: CHAMPIONS[who].name, face: CHAMPIONS[who].face, voice: CHAMPIONS[who].voice };
    if (who === 'sign') return { name: 'A weathered sign', face: null, voice: null };
    const n = NPCS[who]; return { name: n.name, face: n.face, voice: n.voice };
  },
  next() {
    const line = this.q.shift();
    if (!line) return this.close();
    this.cur = line; this.shown = 0; this.choice = 0;
    const sp = this.speakerOf(line.who);
    this.el.innerHTML = `<canvas width="160" height="160"></canvas><div class="body"><div class="who"></div><div class="txt"></div><div class="choices"></div></div>`;
    this.el.querySelector('.who').textContent = sp.name;
    this.sp = sp; this.canvas = this.el.querySelector('canvas'); if (!sp.face) this.canvas.style.display = 'none';
    if (sp.voice) Audio_.speak(line.text, sp.voice);
    const npcEnt = World.ents.find((e) => e.kind === 'npc' && e.npc === line.who); if (npcEnt) npcEnt.talkT = 2.5;
    this.talkT = 0;
  },
  update(dt) {
    if (!this.active) return; const line = this.cur; const speed = [30, 55, 110][Settings.data.textSpeed] || 55;
    const full = line.text.length; const was = Math.floor(this.shown); this.shown = Math.min(full, this.shown + dt * speed);
    if (Math.floor(this.shown) !== was) this.el.querySelector('.txt').textContent = line.text.slice(0, Math.floor(this.shown));
    this.talkT += dt;
    if (this.sp.face) Portrait.draw(this.canvas, this.sp.face, { talk: this.shown < full ? Math.abs(Math.sin(this.talkT * 14)) : 0, t: this.talkT });
    const done = this.shown >= full; const ch = this.el.querySelector('.choices');
    if (done && line.choices && !ch.children.length) {
      line.choices.forEach((c, i) => { const b = el('button', 'btn focusable' + (i === 0 ? ' focus' : ''), esc(c.label)); b.onclick = () => this.pickChoice(i); b.onmouseenter = () => { this.choice = i; this.mark(); }; ch.appendChild(b); });
    } else if (done && !line.choices && !ch.children.length) ch.innerHTML = `<div style="opacity:.7;font-size:.8em;text-align:right">${G('ok', ' Continue')}</div>`;
    if (Input.hit('ok') || Input.hit('mouse0')) {
      if (!done) { this.shown = full; this.el.querySelector('.txt').textContent = line.text; }
      else if (line.choices) this.pickChoice(this.choice);
      else { Audio_.sfx('uiMove'); this.advance(); }
    } else if (Input.hit('back') && done && !line.choices) this.advance();
    if (done && line.choices) {
      if (Input.nav('up')) { this.choice = (this.choice + line.choices.length - 1) % line.choices.length; this.mark(); Audio_.sfx('uiMove'); }
      if (Input.nav('down')) { this.choice = (this.choice + 1) % line.choices.length; this.mark(); Audio_.sfx('uiMove'); }
    }
  },
  mark() { [...this.el.querySelectorAll('.choices .btn')].forEach((b, i) => b.classList.toggle('focus', i === this.choice)); },
  pickChoice(i) {
    const c = this.cur.choices[i]; Audio_.sfx('uiOk');
    if (this.cur.act) { this.cur.act(); this.cur.act = null; }
    if (c.act) c.act();
    if (c.then) { const t = typeof c.then === 'function' ? c.then() : c.then; this.q.unshift(...t); }
    this.cur.choices = null; this.next();
  },
  advance() { if (this.cur.act) this.cur.act(); this.next(); },
  close() { Audio_.stopVoice(); this.active = false; UI.hud.classList.remove('talk'); if (this.el) this.el.remove(); this.el = null; const f = this.onDone; this.onDone = null; Input.clear(); if (f) f(); },
};

// ============================================================================
// NARRATION — full-screen storybook pages with a narrator's babble
// ============================================================================
const Narr = {
  active: false, pages: [], i: 0, shown: 0, el: null, onDone: null, t: 0,
  play(pages, onDone) {
    this.active = true; this.pages = pages; this.i = 0; this.onDone = onDone || null; Input.releaseLock();
    this.el = el('div', 'narr', `<canvas class="art" width="640" height="280"></canvas><div class="txt"></div><div class="legend">${G('ok', ' Next')} &nbsp; ${G('back', ' Skip')}</div>`);
    UI.screens.appendChild(this.el); this.show();
  },
  show() { const p = this.pages[this.i]; this.shown = 0; this.t = 0; Audio_.speak(p.text, NPCS.narrator.voice); Art.draw(this.el.querySelector('canvas'), p.art, 0); },
  update(dt) {
    if (!this.active) return; const p = this.pages[this.i]; this.t += dt; const was = Math.floor(this.shown); this.shown = Math.min(p.text.length, this.shown + dt * 40);
    if (Math.floor(this.shown) !== was) this.el.querySelector('.txt').textContent = p.text.slice(0, Math.floor(this.shown));
    Art.draw(this.el.querySelector('canvas'), p.art, this.t);
    if (Input.hit('ok') || Input.hit('mouse0')) { if (this.shown < p.text.length) this.shown = p.text.length; else if (++this.i >= this.pages.length) this.end(); else this.show(); }
    if (Input.hit('back')) this.end();
  },
  end() { Audio_.stopVoice(); this.active = false; this.el.remove(); Input.clear(); const f = this.onDone; this.onDone = null; if (f) f(); },
};

// ---- 88_net.js
// ============================================================================
// NET — AI Hub "race": everyone delves the same dungeon at once.
// Each copy simulates only its own party; rivals are drawn from their state
// (interpolated ~150 ms behind), bump solidly, and kills/chests are claims:
// the earlier claim keeps the Glory, the later one quietly undoes it.
// ============================================================================
const Net = {
  on: false, peers: {}, sendT: 0, claims: {}, me: null,
  init(info) {
    this.on = info.mode === 'race'; this.me = info.me;
    if (!this.on) return;
    HUB.on('message', (d, from) => this.recv(d, from));
    HUB.on('leave', ({ id }) => this.drop(id));
  },
  peer(id) {
    const inf = (Hub.info.players || []).find((p) => p.id === id) || { name: 'Rival', color: '#ffffff' };
    return this.peers[id] || (this.peers[id] = { id, name: inf.name, color: inf.color, s: [], mesh: null, label: null, champ: null, walk: 0 });
  },
  drop(id) { const p = this.peers[id]; if (!p) return; if (p.mesh && p.mesh.parent) p.mesh.parent.remove(p.mesh); if (p.label) p.label.remove(); delete this.peers[id]; Game.msg(`${p.name} has left the delve.`); },
  send(data, reliable = true) { if (this.on && !Hub.ended) HUB.send(data, { reliable }); },

  // ------------------------------------------------------------ outgoing
  update(rdt) {
    if (!this.on || Hub.ended || !World.party || !Game.levelId) return;
    const t = HUB.time(); if (!(t >= 0)) return;
    this.sendT -= rdt;
    if (this.sendT <= 0) {
      this.sendT = 1 / 12; const P = World.party;
      this.send({ t: 'p', at: Math.round(t), l: Game.levelId, c: Game.party[0].id, x: +P.pos.x.toFixed(2), z: +P.pos.z.toFixed(2), y: +P.yaw.toFixed(2), vx: +P.vel.x.toFixed(2), vz: +P.vel.z.toFixed(2), g: Game.glory }, false);
    }
    this.draw(t, rdt);
  },
  claim(kind, id, glory, items) {
    if (!this.on) return; const key = kind + ':' + Game.levelId + ':' + id; const at = Math.round(HUB.time());
    const prev = this.claims[key];
    if (prev && prev.lost) { this.undo(prev, glory, items); return; } // a rival already took it
    this.claims[key] = { at, glory, items: items || [], mine: true };
    this.send({ t: 'take', k: kind, l: Game.levelId, id, at });
  },
  undo(c, glory, items) {
    Game.glory = Math.max(0, Game.glory - (glory || 0));
    (items || []).forEach((it) => { if (it.startsWith('gold:')) Game.gold = Math.max(0, Game.gold - +it.slice(5)); else Game.takeItem(it); });
    Hub.progress();
  },

  // ------------------------------------------------------------ incoming
  recv(d, from) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'p') { const p = this.peer(from); if (p.s.length && d.at <= p.s[p.s.length - 1].at) return; p.s.push(d); if (p.s.length > 30) p.s.shift(); p.champ = p.champ || d.c; return; }
    if (d.t === 'take') {
      const key = d.k + ':' + d.l + ':' + d.id; const mine = this.claims[key];
      if (mine && mine.mine) {
        // both took it: earlier time keeps it, then the lower player id
        const theyWin = d.at < mine.at || (d.at === mine.at && from < this.me);
        if (!theyWin) return;
        this.undo(mine, mine.glory, mine.items); mine.mine = false;
        Game.msg(`${this.peer(from).name} got there first.`, '#ff8060');
      } else this.claims[key] = { at: d.at, lost: true };
      this.apply(d);
      return;
    }
    if (d.t === 'done') Game.msg(`${this.peer(from).name} has claimed the Lorewand!`, '#f2c230');
  },
  apply(d) {
    const st = Game.levelState(d.l);
    if (d.k === 'kill') {
      if (!st.dead.includes(d.id)) st.dead.push(d.id);
      if (d.l !== Game.levelId) return;
      const m = World.mons.find((x) => x.id === d.id && x.dead === 0);
      if (m) { m.dead = 0.01; m.hp = 0; if (m.body) { World.phys.removeRigidBody(m.body); m.body = null; } FX.emit(m.pos.clone().setY(1), { n: 20, color: [0xffffff, 0xc8c8c8], speed: 3 }); }
    }
    if (d.k === 'chest') {
      (st.chests = st.chests || {})[d.id] = true;
      if (d.l !== Game.levelId) return;
      const e = World.ents.find((x) => x.kind === 'chest' && x.cid === d.id); if (e && !e.opened) { e.opened = true; e.openLid(); }
    }
  },

  // ------------------------------------------------------------ rivals in the world
  draw(t, rdt) {
    const at = t - 150; const P = World.party;
    for (const p of Object.values(this.peers)) {
      const s = p.s; if (!s.length) continue; const last = s[s.length - 1];
      const here = last.l === Game.levelId;
      if (!here) { if (p.mesh && p.mesh.parent) p.mesh.parent.remove(p.mesh); if (p.label) p.label.style.display = 'none'; continue; }
      if (!p.mesh || p.mesh.parent !== World.group) {
        if (!p.mesh) {
          p.mesh = Models.make('champ', { champ: p.champ || 'conrick' });
          Models.part('tor', Mat.glow(p.color), 1.4, 1.4, 0.6, 0, 0.05, 0, p.mesh).rotation.x = Math.PI / 2;
          Models.part('cone', Mat.glow(p.color), 0.35, 0.5, 0.35, 0, 2.6, 0, p.mesh).rotation.x = Math.PI;
          p.label = el('div', 'float'); p.label.textContent = p.name; p.label.style.color = p.color; p.label.style.fontSize = '.9em'; UI.hud.appendChild(p.label);
        }
        World.group.add(p.mesh); p.mesh.position.set(last.x, 0, last.z);
      }
      // interpolate two samples around (now − 150 ms); carry forward ≤200 ms when late
      let a = s[0], b = null; for (let i = 0; i < s.length; i++) { if (s[i].at <= at) a = s[i]; else { b = s[i]; break; } }
      let x, z, yaw;
      if (b && a !== b && a.l === b.l) { const k = clamp((at - a.at) / Math.max(1, b.at - a.at), 0, 1); x = lerp(a.x, b.x, k); z = lerp(a.z, b.z, k); yaw = a.y + angDiff(a.y, b.y) * k; }
      else { const age = clamp((at - last.at) / 1000, 0, 0.2); x = last.x + last.vx * age; z = last.z + last.vz * age; yaw = last.y; }
      const sp = Math.hypot(last.vx, last.vz); p.walk += sp * rdt * 2.4;
      p.mesh.position.set(x, 0, z); p.mesh.rotation.y = yaw + Math.PI;
      if (p.mesh.userData.rig) animateRig(p.mesh.userData.rig, { t: t / 1000, walk: p.walk, moving: clamp(sp / 4, 0, 1), attack: -1, hit: 0, dead: 0, cast: 0 });
      // contact: rivals are solid; each copy pushes only its own party out (the bump is mutual)
      const now = new THREE.Vector3(last.x + last.vx * clamp((t - last.at) / 1000, 0, 0.2), 0, last.z + last.vz * clamp((t - last.at) / 1000, 0, 0.2));
      const dx = P.pos.x - now.x, dz = P.pos.z - now.z, dist = Math.hypot(dx, dz);
      if (dist < 1.1 && dist > 0.001) {
        const push = new THREE.Vector3(dx / dist, 0, dz / dist).multiplyScalar(1.1 - dist);
        World.ctrl.computeColliderMovement(P.col, push, RAPIER.QueryFilterFlags.EXCLUDE_SENSORS, grp(0xffff, G_STATIC | G_MON | G_DEBRIS));
        const mv = World.ctrl.computedMovement(); P.pos.x += mv.x; P.pos.z += mv.z; P.body.setNextKinematicTranslation(P.pos);
        const rel = (P.vel.x - last.vx) * dx / dist + (P.vel.z - last.vz) * dz / dist; if (rel < 0) { P.vel.x -= rel * dx / dist; P.vel.z -= rel * dz / dist; }
      }
      // name tag
      const v = new THREE.Vector3(x, 2.9, z).project(R.camera);
      if (v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1) { p.label.style.display = 'block'; p.label.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; p.label.style.top = ((1 - v.y) / 2 * innerHeight) + 'px'; }
      else p.label.style.display = 'none';
    }
  },
};

// ---- 90_main.js
// ============================================================================
// MAIN — boot, loop, gameplay input, title, attract mode, AI Hub sessions
// ============================================================================
const Main = {
  state: 'boot', last: 0, titleT: 0, lastMove: { fwd: 0, str: 0 }, lastFire: false, idleTitle: 0,

  async boot() {
    const app = $('#app');
    const loading = el('div', 'loading', `<div class="title-logo" style="font-size:3em">Wands of Lore</div><div class="sub">Gathering the lore…</div>`); app.appendChild(loading);
    try {
      await RAPIER.init({});
      await R.init(app);
    } catch (e) {
      loading.remove(); UI.error(e.message || String(e)); if (SESSION) HUB.fail(e.message || 'WebGPU unavailable'); return;
    }
    UI.init(app); Input.init(R.renderer.domElement);
    loading.remove();
    // audio needs a gesture: start it on the first input of any kind
    const wake = () => { if (Audio_.ensure()) { if (this.state === 'title' || this.state === 'touch') Audio_.music('title'); else if (this.state === 'play' && Game.levelId) Audio_.music(Story.musicFor(Game.levelId)); } };
    addEventListener('keydown', wake); addEventListener('mousedown', wake); addEventListener('gamepadconnected', wake);
    R.renderer.domElement.addEventListener('click', () => { if (this.state === 'play' && !Menu.stack.length && !Dialog.active && !Narr.active) Input.requestLock(R.renderer.domElement); });
    HUB.probe(() => this.probe());
    if (SESSION) { const ok = await Hub.start(); if (ok) { requestAnimationFrame((t) => this.frame(t)); return; } }
    this.toTitle(true);
    const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches && !(navigator.getGamepads && [...navigator.getGamepads()].some(Boolean));
    if (touchOnly) { this.state = 'touch'; Menu.clear(); UI.touchOnly(); }
    requestAnimationFrame((t) => this.frame(t));
  },

  // ------------------------------------------------------------ flow
  toTitle(first) {
    Game.attract = false; Game.god = false; Game.noclip = false; Game.paused = false; Game.over = false; Dialog.active && Dialog.close(); Narr.active && Narr.end(); Menu.clear(); Timers.clear();
    Input.releaseLock(); UI.hudVisible(false); this.attractEl && this.attractEl.remove(); this.attractEl = null;
    // a living backdrop: the throne hall of Gladhallow
    Game.newGame('conrick'); Game.levelId = 'keep'; World.load('keep', Game.levelState('keep'), 'start');
    this.state = 'title'; this.titleT = 0; this.idleTitle = 0; Input.idle = 0;
    UI.title(); if (!first) Audio_.music('title');
  },
  newGame(cid) {
    Game.newGame(cid); Game.levelId = null; this.state = 'story';
    Narr.play(NARRATION.prologue, () => { this.state = 'play'; Game.changeLevel('keep', 'start'); UI.buildParty(); UI.hudVisible(true); });
  },
  startLoad(slot) { this.state = 'play'; UI.hudVisible(true); Game.load(slot); setTimeout(() => UI.buildParty(), 500); },

  // ------------------------------------------------------------ main loop
  frame(now) {
    requestAnimationFrame((t) => this.frame(t));
    const rdt = Math.min(1, Math.max(0, (now - (this.last || now)) / 1000)); const dt = Math.min(0.05, rdt); this.last = now;
    Input.poll(rdt);
    if (this.state === 'touch') { if (Input.any && (Input.device === 'pad' || [...Input.edges].some((e) => e.startsWith('key:')))) { Menu.clear(); this.toTitle(); } else Menu.update(dt); R.render(); return; }
    if (Game.attract) { if (Input.any) { this.toTitle(); return; } Attract.update(dt); }
    // in a shared race the world never pauses: menus and talk only stop your own input
    let sim = this.state === 'play' && !Game.over && !Game.busy && (Net.on || (!Game.paused && !Narr.active && !Dialog.active));
    if (Hub.on && !Hub.canPlay()) sim = false;
    if (Narr.active) Narr.update(dt);
    else if (Dialog.active) Dialog.update(dt);
    else if (Menu.stack.length) {
      Menu.update(dt);
      const top = Menu.top(); if (top && top.pauseMenu && Input.hit('pause') && !Input.hit('back')) { Audio_.sfx('uiBack'); Menu.pop(); }
      if (Menu.stack.length && Menu.top().title) this.titleIdle(rdt);
    } else if (this.state === 'play' && !Game.attract && !Game.over) this.play(dt, sim);
    if (this.state === 'title') this.titleCam(dt);
    if (sim || (Game.attract && !Game.busy)) {
      if (Game.attract && !Game.busy) World.updateParty(dt, Attract.mv, { dx: 0, dy: 0 });
      World.update(dt); Game.updateParty(dt); Timers.update(dt); Game.playTime += dt;
      const fighting = World.mons.some((m) => m.alert && m.dead === 0 && m.pos.distanceTo(World.party.pos) < 16);
      Audio_.setIntensity(fighting ? 1 : 0);
    } else if (this.state === 'title' && World.phys) { World.update(dt); }
    Tweens.update(dt); View.update(dt); UI.updateHud(rdt); Hub.frame(); Net.update(rdt);
    R.render();
  },
  play(dt, sim) {
    if (Input.hit('pause')) { UI.pause(); return; }
    if (!sim) return;
    if (Input.hit('inv')) { UI.inventory(); return; }
    if (Input.hit('map')) { UI.map(); return; }
    const mv = Input.move(); this.lastMove = mv;
    World.updateParty(dt, mv, Input.consumeMouse());
    if (Input.hit('attack')) { Game.partyAttack(); if (Input.edges.has('mouse0')) Input.requestLock(R.renderer.domElement); }
    if (Input.stick.r2 > 0.6 && Game.alive().some((m) => m.cd <= 0) && !Input.hit('attack')) Game.partyAttack(); // hold R2 to keep swinging
    if (Input.hit('cast')) Game.castSelected();
    if (Input.hit('interact') && UI.focusEnt) UI.focusEnt.interact();
    if (Input.hit('potion')) Game.quickPotion();
    const n = Game.party.length;
    if (Input.hit('charPrev')) { Game.sel = (Game.sel + n - 1) % n; View.rebuild(); Audio_.sfx('uiMove'); }
    if (Input.hit('charNext')) { Game.sel = (Game.sel + 1) % n; View.rebuild(); Audio_.sfx('uiMove'); }
    ['char1', 'char2', 'char3'].forEach((c, i) => { if (Input.hit(c) && i < n) { Game.sel = i; View.rebuild(); Audio_.sfx('uiMove'); } });
    const k = Game.known.length;
    if (k && Input.hit('spellPrev')) { Game.spellIdx = (Game.spellIdx + k - 1) % k; Audio_.sfx('uiMove'); }
    if (k && Input.hit('spellNext')) { Game.spellIdx = (Game.spellIdx + 1) % k; Audio_.sfx('uiMove'); }
    if (Input.hit('powUp')) { Game.power = Math.min(4, Game.power + 1); Audio_.sfx('uiMove'); }
    if (Input.hit('powDown')) { Game.power = Math.max(1, Game.power - 1); Audio_.sfx('uiMove'); }
    this.lastFire = Input.hit('attack') || Input.stick.r2 > 0.6;
  },
  titleIdle(dt) {
    if (Input.any) this.idleTitle = 0; else this.idleTitle += dt;
    if (this.idleTitle > 10 && !SESSION) { this.idleTitle = 0; Attract.start(); }
  },
  titleCam(dt) {
    this.titleT += dt; const t = this.titleT * 0.12;
    const c = new THREE.Vector3(14 * TILE, 0, 7 * TILE);
    R.camera.position.set(c.x + Math.sin(t) * 9, 2.6 + Math.sin(t * 0.7) * 0.6, c.z + 8 + Math.cos(t) * 10);
    R.camera.lookAt(c.x, 1.8, c.z - 6);
  },
  probe() {
    const scene = Hub.on ? (Hub.ended ? 'over' : !Hub.canPlay() ? 'ready' : 'play') : this.state === 'title' ? 'title' : this.state === 'play' ? (Game.over ? 'over' : 'play') : 'menu';
    const menu = Menu.stack.some((s) => s.pauseMenu);
    const mv = Input.move(); const fire = this.lastFire || Input.key('KeyJ') || !!(Input.mouse.buttons & 1) || Input.stick.r2 > 0.6;
    return { scene, menu, world: +World.time.toFixed(3), input: { x: +mv.str.toFixed(2), y: +mv.fwd.toFixed(2), turn: +mv.turn.toFixed(2), fire } };
  },
};

// ============================================================================
// VICTORY
// ============================================================================
Game.victory = function () {
  if (Hub.on) Hub.finishRun();
  Narr.play(NARRATION.victory, () => UI.victory());
};

// ============================================================================
// ATTRACT MODE — the game plays itself, cheating shamelessly
// ============================================================================
const Attract = {
  mv: { fwd: 0, str: 0, turn: 0, pitch: 0, sprint: false }, path: [], tour: ['keep', 'forest', 'mine'], li: 0, levelT: 0, castT: 0, spellCycle: 0, goal: null, repath: 0,
  start() {
    Menu.clear(); Game.newGame('conrick'); Game.party.push(Game.newMember('tamsin'), Game.newMember('velkar'));
    Game.known = [...SPELL_ORDER]; Game.flags = { audience: true, gateOpen: true, seenForest: true, seenMine: true }; Game.party.forEach((m) => { m.skills.M = Math.max(m.skills.M, 3); });
    Game.attract = true; Game.god = true; Game.noclip = true; this.li = 0; this.levelT = 0;
    Main.state = 'play'; UI.buildParty(); UI.hudVisible(true);
    this.attractEl = el('div', 'attract', 'DEMO — Press any button'); UI.screens.appendChild(this.attractEl); Main.attractEl = this.attractEl;
    Game.changeLevel(this.tour[0], Object.keys(LEVELS[this.tour[0]].spawns)[0]);
  },
  targets() {
    const P = World.party.pos; const ts = World.mons.filter((m) => m.dead === 0).map((m) => toTile(m.pos));
    World.ents.forEach((e) => { if (e.kind === 'chest' && !e.opened) ts.push([e.x, e.y]); });
    return ts.sort((a, b) => Math.hypot(a[0] * TILE - P.x, a[1] * TILE - P.z) - Math.hypot(b[0] * TILE - P.x, b[1] * TILE - P.z));
  },
  bfs(from, to) {
    const W = World.W, H = World.H, prev = new Int32Array(W * H).fill(-1); const q = [from[1] * W + from[0]]; prev[q[0]] = q[0];
    const pass = (x, y) => { const c = World.charAt(x, y); return x >= 0 && y >= 0 && x < W && y < H && c !== '#' && c !== 'T' && c !== '~'; };
    while (q.length) { const i = q.shift(); if (i === to[1] * W + to[0]) break; const x = i % W, y = (i / W) | 0; for (const [dx, dy] of DIRV) { const nx = x + dx, ny = y + dy; if (!pass(nx, ny) && !(nx === to[0] && ny === to[1])) continue; const j = ny * W + nx; if (prev[j] >= 0) continue; prev[j] = i; q.push(j); } }
    const out = []; let i = to[1] * W + to[0]; if (prev[i] < 0) return []; while (i !== prev[i]) { out.unshift([i % W, (i / W) | 0]); i = prev[i]; } return out;
  },
  update(dt) {
    if (Game.busy || !World.party) return; const P = World.party; this.levelT += dt;
    if (this.levelT > 55) { this.levelT = 0; this.li = (this.li + 1) % this.tour.length; const id = this.tour[this.li]; Game.changeLevel(id, Object.keys(LEVELS[id].spawns)[0]); this.path = []; return; }
    // nearest visible foe? fight it
    const foe = World.mons.filter((m) => m.dead === 0 && m.pos.distanceTo(P.pos) < 12 && World.los(World.eye(), m.pos.clone().setY(1))).sort((a, b) => a.pos.distanceTo(P.pos) - b.pos.distanceTo(P.pos))[0];
    let aim = null, want = 0;
    if (foe) { aim = foe.pos; const d = foe.pos.distanceTo(P.pos); want = d > 2.6 ? 1 : d < 1.6 ? -0.4 : 0; Game.partyAttack();
      this.castT -= dt; if (this.castT <= 0) { this.castT = 1.6; Game.spellIdx = Game.known.indexOf(['fireball', 'frost', 'spark', 'spark'][this.spellCycle++ % 4]); Game.power = 3; Game.castSelected(); } }
    else {
      this.repath -= dt;
      if (!this.path.length || this.repath <= 0) { this.repath = 2; const t = this.targets()[0] || this.exitTile(); if (t) this.path = this.bfs(toTile(P.pos), t).slice(0, 40); }
      const nx = this.path[0]; if (nx) { aim = tileCenter(nx[0], nx[1]); if (aim.distanceTo(P.pos.clone().setY(0)) < 1.2) this.path.shift(); want = 1; }
      else if (Math.random() < dt) { const id = this.tour[(this.li + 1) % 3]; this.levelT = 99; void id; }
    }
    if (aim) { const dx = aim.x - P.pos.x, dz = aim.z - P.pos.z; const desired = Math.atan2(-dx, -dz); const d = angDiff(P.yaw, desired); this.mv.turn = -clamp(d * 2.5, -1, 1); this.mv.fwd = Math.abs(d) < 0.9 ? want : 0.15; }
    else { this.mv.turn = 0.3; this.mv.fwd = 0; }
    this.mv.sprint = !foe;
  },
  exitTile() { const e = World.ents.find((x) => x.kind === 'exit' && x.def.to === this.tour[(this.li + 1) % 3]); return e ? [e.x, e.y] : null; },
};

// ============================================================================
// AI HUB — side-by-side sessions (protocol v1, mode "parallel")
// ============================================================================
const Hub = {
  on: false, ended: false, reported: false, info: null, readyEl: null, cdEl: null,
  async start() {
    const info = await HUB.connect({ mode: 'race', seats: [1, 4] });
    if (!info) return false;
    this.on = true; this.info = info; Net.init(info);
    HUB.on('start', () => { Audio_.ensure(); Audio_.music(Story.musicFor(Game.levelId || 'keep')); });
    HUB.on('time-up', () => this.report());
    HUB.on('end', () => this.end());
    Main.sessionRun();
    if (info.splash) HUB.ready();
    else {
      this.readyEl = el('div', 'screen', `<div class="panel" style="text-align:center"><div class="title-logo" style="font-size:2.4em">Wands of Lore</div><p style="margin:.6em 0">${(info.players || []).map((p) => esc(p.name)).join(' · ')}</p><p>Press any key, click or tap when you are ready</p></div>`);
      UI.screens.appendChild(this.readyEl);
      const go = () => { HUB.ready(); this.readyEl && this.readyEl.remove(); this.readyEl = null; removeEventListener('keydown', go); removeEventListener('pointerdown', go); };
      addEventListener('keydown', go); addEventListener('pointerdown', go); this.padReady = go;
    }
    return true;
  },
  canPlay() { return !this.on || (!this.ended && HUB.time() >= 0); },
  frame() {
    if (!this.on) return;
    if (this.padReady && this.readyEl && Input.device === 'pad' && Input.any) this.padReady();
    const t = HUB.time();
    if (t < 0 && t > -Infinity) { if (!this.cdEl) { this.cdEl = el('div', 'banner', ''); this.cdEl.style.opacity = 1; UI.screens.appendChild(this.cdEl); } this.cdEl.innerHTML = `<div class="t">${Math.ceil(-t / 1000)}</div><div class="s">Most Glory wins</div>`; }
    else if (this.cdEl) { this.cdEl.remove(); this.cdEl = null; }
  },
  progress() { if (!this.on || this.reported || this.ended) return; HUB.progress({ score: Game.glory, label: `${Game.glory} Glory · ${(LEVELS[Game.levelId] || { name: '' }).name.replace('The ', '')}`.slice(0, 24) }); },
  stats() { return { glory: Game.glory, kills: Game.stats.kills, secrets: Game.stats.secrets, chests: Game.stats.chests, crowns: Game.stats.goldFound, party: Game.party.length }; },
  awards() { const a = []; if (Game.flags.bossDone) a.push({ title: 'Mask Breaker', detail: 'Defeated the Echo of Scolda' }); if (Game.stats.secrets >= 2) a.push({ title: 'Sharp Eyes', detail: `${Game.stats.secrets} secrets found` }); if (Game.party.length >= 3) a.push({ title: 'Full Party', detail: 'Recruited two companions' }); return a.slice(0, 3); },
  report() { if (!this.on || this.reported) return; this.reported = true; HUB.result({ score: Game.glory, stats: this.stats(), awards: this.awards() }); },
  finishRun() { if (!this.on || this.reported) return; Net.send({ t: 'done', at: Math.round(HUB.time()) }); const left = Math.max(0, (this.info.limitMs || 0) - HUB.time()); Game.glory += Math.round(left / 500); this.report(); },
  respawn() {
    Game.glory = Math.max(0, Game.glory - 150); Game.msg('Your party is dragged to safety. (−150 Glory)', '#ff8060');
    setTimeout(() => { Game.party.forEach((m) => { m.down = false; m.hp = Math.ceil(Game.maxHp(m) / 2); m.poison = 0; }); Game.over = false; Game.changeLevel(Game.levelId, Object.keys(LEVELS[Game.levelId].spawns)[0], { noSave: true }); Audio_.music(Story.musicFor(Game.levelId)); }, 1500);
  },
  end() {
    if (this.ended) return; this.report(); this.ended = true; Game.paused = true; Input.enabled = false; Input.releaseLock();
    Audio_.stopVoice(); Audio_.stopMusic(); Audio_.setMuted(true);
    const s = el('div', 'screen', `<div class="panel" style="text-align:center"><div class="title-logo" style="font-size:2.2em">Round Over</div><p style="margin-top:.6em;font-size:1.3em">${Game.glory} Glory</p><p style="opacity:.8">${Game.stats.kills} foes · ${Game.stats.secrets} secrets · ${Game.stats.chests} chests</p></div>`);
    UI.screens.appendChild(s);
  },
};
Main.sessionRun = function () {
  // a fair, fast start: champions dealt from the shared seed, one per seat, the King's audience already given
  const cid = CHAMP_ORDER[(Math.floor(HUB.rng('champ')() * 4) + (Hub.info.me || 0)) % 4];
  Game.newGame(cid); Game.flags.audience = true; Game.addItem('royal_seal', true); Game.addItem('gold:50', true); Game.quest = 'gate'; Game.glory = 0;
  Game.stats.goldFound = 0; Main.state = 'play'; Game.levelId = 'keep'; World.load('keep', Game.levelState('keep'), 'start'); View.rebuild();
  UI.buildParty(); UI.hudVisible(true); UI.area(LEVELS.keep.name); Story.onLevelLoaded('keep');
};

window.__wol = { R, World, Game, Main, UI, Menu, Story, Ent, Mon, Input, Attract, Dialog, Narr, LEVELS, Hub, Timers };
Main.boot();

</script>
