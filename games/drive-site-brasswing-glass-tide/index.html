<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111f2a">
  <meta name="description" content="BRASSWING: Operation Glass Tide. An original pixel-art air-combat game with aircraft selection, a weapons shop, and one complete coastal mission.">
  <title>BRASSWING — Operation Glass Tide</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111f2a'/%3E%3Cpath d='M4 17L13 13L11 5L18 5L22 13L29 16L22 19L18 27L11 27L13 19Z' fill='%23efbc69'/%3E%3Cpath d='M15 14H26V17H15Z' fill='%23fff0cf'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <a class="wordmark" href="#" id="home-link" aria-label="BRASSWING title screen"><span class="insignia">B<span>W</span></span><span>BRASSWING<span class="submark">INDEPENDENT FLIGHT DIVISION</span></span></a>
      <div class="top-mission"><span class="short-line"></span> OPERATION GLASS TIDE <span class="top-num">01</span></div>
      <nav class="utility" aria-label="Game controls">
        <button id="sound-btn" class="icon-button" aria-label="Turn sound off" title="Sound (M)">SOUND <span>ON</span></button>
        <button id="help-btn" class="icon-button" aria-label="Flight manual" title="Flight manual">?</button>
        <button id="fullscreen-btn" class="icon-button" aria-label="Enter full screen" title="Full screen (F)">⛶</button>
      </nav>
    </header>
    <section class="stage" id="stage" aria-label="BRASSWING game">
      <canvas id="screen" tabindex="0" aria-label="Air combat game. Use arrows or W A S D to fly. Z or Space fires. X fires the special weapon. C uses a pulse. Shift gives precise movement. Escape pauses."></canvas>
      <div class="screen-grain" aria-hidden="true"></div>
      <div id="overlay" class="overlay"></div>
      <div id="touch-controls" aria-label="Touch flight controls">
        <div id="joystick" aria-label="Drag to steer"><span></span><i></i></div>
        <div class="touch-actions"><button data-touch="focus" aria-label="Hold for precise movement">FOCUS</button><button data-touch="special" aria-label="Fire special weapon">SPECIAL</button><button data-touch="pulse" aria-label="Use pulse">PULSE</button></div>
      </div>
      <button id="pause-touch" class="pause-touch" aria-label="Pause game">Ⅱ</button>
    </section>
    <footer class="bottom-bar">
      <div class="control-legend"><span><kbd>WASD</kbd> / <kbd>↑↓←→</kbd> FLY</span><span><kbd>Z</kbd> FIRE</span><span><kbd>X</kbd> SPECIAL</span><span><kbd>C</kbd> PULSE</span><span><kbd>SHIFT</kbd> FOCUS</span><span><kbd>ESC</kbd> PAUSE</span></div>
      <span id="footer-status">CAPE SABLE · 18:40 LOCAL</span>
    </footer>
    <div id="announce" class="sr-only" aria-live="polite"></div>
  </main>
  <script src="my-3d2dge.js"></script>
  <script src="art.js"></script>
  <script src="audio.js"></script>
  <script src="mission.js"></script>
  <script src="game.js"></script>
</body>
</html>
