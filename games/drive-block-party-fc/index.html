           this.actions.home();\n                break;\n            case 'pause':\n                this.togglePause();\n                break;\n            case 'resume':\n                this.close(true);\n                break;\n            case 'close':\n                this.closeOrBack();\n                break;\n            case 'help':\n                this.open('help');\n                break;\n            case 'roster':\n                this.rosterTeam = this.settings.team;\n                this.open('roster');\n                break;\n            case 'roster-tab':\n                this.rosterTeam = Number(button.dataset.team);\n                this.renderModal();\n                break;\n            case 'substitute':\n                this.substitute();\n                break;\n            case 'continue':\n                this.close(false);\n                this.game.paused = false;\n                this.game.continueMatch();\n                break;\n            case 'replay':\n                if (this.game.replayClip.length > 5) {\n                    this.close(false);\n                    this.game.paused = false;\n                    this.game.playReplay();\n                }\n                else\n                    this.toast('Score a goal first. We’ll save the highlight.');\n                break;\n            case 'fullscreen':\n                this.fullscreen();\n                break;\n            case 'sound':\n                this.settings.sound = !this.settings.sound;\n                this.save();\n                this.actions.sound();\n                this.updateSound();\n                if (this.modal)\n                    this.renderModal();\n                break;\n            case 'engine':\n                this.open('engine');\n                break;\n            case 'native':\n                this.actions.native();\n                break;\n        }\n    }\n    change(target) {\n        const id = target.id;\n        if (id === 'mode') {\n            this.settings.mode = target.value;\n            this.save();\n            this.syncHome();\n        }\n        if (id === 'minutes') {\n            this.settings.minutes = Number(target.value);\n            this.save();\n        }\n        if (id === 'difficulty') {\n            this.settings.difficulty = Number(target.value);\n            this.save();\n        }\n        if (id === 'formation') {\n            const f = target.value;\n            if (f in FORMATIONS) {\n                this.preferredFormations[this.rosterTeam] = f;\n                this.game.setFormation(this.rosterTeam, f);\n                this.toast(`${f} formation selected.`);\n            }\n        }\n        if (id === 'setting-sound' || id === 'setting-music' || id === 'setting-motion') {\n            const key = id === 'setting-sound' ? 'sound' : id === 'setting-music' ? 'music' : 'reducedMotion';\n            this.settings[key] = target.checked;\n            this.save();\n            this.actions.sound();\n            this.updateSound();\n        }\n        if (id === 'setting-camera') {\n            this.settings.camera = target.value === 'close' ? 'close' : 'wide';\n            this.save();\n        }\n    }\n    syncHome() {\n        for (const id of ['mode', 'minutes', 'difficulty'])\n            this.refs[id].value = String(this.settings[id]);\n        this.refs.minutes.disabled = this.settings.mode === 'practice';\n        this.root.querySelectorAll('.team-pick').forEach((e, i) => { const selected = i === this.settings.team; e.classList.toggle('selected', selected); e.setAttribute('aria-pressed', String(selected)); this.refs[`pick-status-${i}`].textContent = selected ? 'YOUR TEAM · P1' : this.settings.mode === 'local' ? 'RIVAL · P2' : 'THE OPPOSITION'; });\n        const wins = this.records.filter(r => r.winner === r.team).length;\n        this.refs['home-record'].textContent = this.records.length ? `LAST ${this.records.length} MATCHES · ${wins} ${wins === 1 ? 'WIN se\n        void document.documentElement.requestFullscreen?.().catch(() => this.toast('Full screen is unavailable in this browser.')); }\n    toast(message) { this.refs.toast.textContent = message; this.refs.toast.classList.remove('hidden'); this.toastUntil = performance.now() + 4200; }\n    open(kind) {\n        if (this.modal && this.modal !== kind && !['roster', 'help', 'engine'].includes(this.modal))\n            this.modalReturn = this.modal;\n        if (!this.modal)\n            this.lastFocus = document.activeElement;\n        this.modal = kind;\n        this.game.paused = true;\n        this.renderModal();\n        this.refs['modal-overlay'].classList.remove('hidden');\n        requestAnimationFrame(() => this.refs.modal.focus());\n    }\n    closeOrBack() { if (this.modalReturn) {\n        const back = this.modalReturn;\n        this.modalReturn = null;\n        this.modal = back;\n        this.renderModal();\n    }\n    else if (this.modal === 'break' || this.modal === 'result') { /* Required match decisions stay on screen. */ }\n    else\n        this.close(true); }\n    close(resume = true) { this.modal = null; this.modalReturn = null; this.refs['modal-overlay'].classList.add('hidden'); if (resume)\n        this.game.paused = false; this.lastFocus?.focus?.({ preventScroll: true }); }\n    focusTrap(e) {\n        if (e.key !== 'Tab' || !this.modal)\n            return;\n        const nodes = Array.from(this.refs.modal.querySelectorAll('button:not([disabled]),a,select,input,[tabindex=\"0\"]'));\n        const first = nodes[0], last = nodes.at(-1);\n        if (!first)\n            return;\n        if (e.shiftKey && (document.activeElement === first || document.activeElement === this.refs.modal)) {\n            e.preventDefault();\n            last?.focus();\n        }\n        else if (!e.shiftKey && document.activeElement === last) {\n            e.preventDefault();\n            first.focus();\n        }\n    }\n    top(kicker, title, closable = true) { return `\u003cdiv class=\"modal-topline\">\u003cspan>${kicker}\u003c/span>${closable ? `\u003cbutton class=\"icon-button modal-close\" data-action=\"close\" aria-label=\"Close dialog\">${icon('close')}\u003c/button>` : ''}\u003c/div>\u003ch2 id=\"modal-title\">${title}\u003c/h2>`; }\n    settingsMarkup() { return `\u003cdiv class=\"settings-grid\">\u003clabel>Sound effects \u003cinput type=\"checkbox\" id=\"setting-sound\" ${this.settings.sound ? 'checked' : ''}>\u003c/label>\u003clabel>Arcade soundtrack \u003cinput type=\"checkbox\" id=\"setting-music\" ${this.settings.music ? 'checked' : ''}>\u003c/label>\u003clabel>Reduced motion \u003cinput type=\"checkbox\" id=\"setting-motion\" ${this.settings.reducedMotion ? 'checked' : ''}>\u003c/label>\u003clabel>Camera \u003cselect id=\"setting-camera\">\u003coption value=\"wide\" ${this.settings.camera === 'wide' ? 'selected' : ''}>Broadcast\u003c/option>\u003coption value=\"close\" ${this.settings.camera === 'close' ? 'selected' : ''}>Closer\u003c/option>\u003c/select>\u003c/label>\u003c/div>`; }\n    statsMarkup() {\n        const g = this.game, a = g.stat[0], b = g.stat[1], total = a.possession + b.possession || 1;\n        const rows = [['POSSESSION', `${Math.round(a.possession / total * 100)}%`, `${Math.round(b.possession / total * 100)}%`], ['SHOTS / ON TARGET', `${a.shots} / ${a.onTarget}`, `${b.shots} / ${b.onTarget}`], ['PASSES COMPLETED', `${a.completed} / ${a.passes}`, `${b.completed} / ${b.passes}`], ['TACKLES', a.tackles, b.tackles], ['SAVES', a.saves, b.saves], ['FOULS / OFFSIDE', `${a.fouls} / ${a.offsides}`, `${b.fouls} / ${b.offsides}`], ['CORNERS', a.corners, b.corners]];\n        return `\u003cdiv class=\"modal-score\">\u003cspan class=\"text-electric\">ϟ \u003csmall>ELU\u003c/small>\u003c/span>\u003cstrong>${g.score[0]} \u003ci>:\u003c/i> ${g.score[1]}\u003c/strong>\u003cspan class=\"text-sunset\">\u003csmall>SSR\u003c/small> ✺\u003c/span>\u003c/div>\u003cdiv class=\"stats-table\">${rows.map(([label, x, y]) => `\u003cdiv>\u003cb>${x}\u003c/b>\u003cspan>${label}\u003c/span>\u003cb>${y}\u003c/b>\u003c/div>`).join('')}\u003c/div>`;\n    }\n    renderModal() {\n        const m = this.refs.modal, g = this.game;\n        m.className = `modal modal-${this.modal}`;\n        if (this.modal === 'pause')\n            m.innerHTML = `${this.top('TAKE A BREATHER', 'GAME PAUSED.')}\u003cdiv class=\"pause-grid\">\u003cdiv>${this.statsMarkup()}\u003c/div>\u003cdiv class=\"pause-actions\">\u003cbutton class=\"primary-button\" data-action=\"resume\">BACK TO THE ACTION →\u003c/button>\u003cbutton class=\"secondary-button\" data-action=\"roster\">MANAGE SQUAD ${icon('squad')}\u003c/button>\u003cbutton class=\"secondary-button\" data-action=\"replay\" ${g.replayClip.length \u003c 6 ? 'disabled' : ''}>LAST GOAL REPLAY ↻\u003c/button>\u003cbutton class=\"secondary-button\" data-action=\"help\">CONTROLS & RULES ↗\u003c/button>\u003cbutton class=\"text-button\" data-action=\"home\">LEAVE MATCH\u003c/button>\u003c/div>\u003c/div>${this.settingsMarkup()}\u003cdiv class=\"modal-footnote\">${esc(this.engine)} · ${esc(g.physicsName)} · MATCH CLOCK IS PAUSED\u003c/div>`;\n        else if (this.modal === 'break') {\n            const title = g.period === 1 ? 'HALF-TIME HUSTLE.' : g.period === 2 ? 'MORE FOOTBALL.' : 'ONE LAST PUSH.';\n            m.innerHTML = `${this.top(g.period === 2 ? 'LEVEL AFTER 90. EXTRA TIME AWAITS.' : 'A BREATHER. NOT A BREAK IN SPIRIT.', title, false)}${this.statsMarkup()}\u003cdiv class=\"modal-buttons\">\u003cbutton class=\"secondary-button\" data-action=\"roster\">MAKE A CHANGE ↔\u003c/button>\u003cbutton class=\"primary-button\" data-action=\"continue\">${g.period === 1 ? 'SECOND HALF' : g.period === 2 ? 'START EXTRA TIME' : 'FINAL 15'} →\u003c/button>\u003c/div>\u003cdiv class=\"modal-footnote\">ENDS SWITCH AT EVERY INTERVAL · \u003ckbd>ENTER\u003c/kbd> TO CONTINUE\u003c/div>`;\n        }\n        else if (this.modal === 'result') {\n            const won = g.winner === this.settings.team, title = g.winner === null ? 'HONOURS EVEN.' : this.settings.mode === 'local' ? `${TEAMS[g.winner].short} RULE THE BLOCK.` : won ? 'YOUR BLOCK. YOUR RULES.' : 'RUN IT BACK?';\n            m.innerHTML = `${this.top(esc(g.finishReason), title, false)}\u003cdiv class=\"result-medal\">${g.winner === null ? '↔' : TEAMS[g.winner].symbol}\u003c/div>${this.statsMarkup()}${g.shootout ? `\u003cdiv class=\"result-penalties\">PENALTIES \u003cb>${g.shootout.kicks[0].filter(Boolean).length} – ${g.shootout.kicks[1].filter(Boolean).length}\u003c/b>\u003c/div>` : ''}\u003cdiv class=\"scorers\">${g.scorers.length ? g.scorers.map(s => `\u003cspan class=\"text-${s.team === 0 ? 'electric' : 'sunset'}\">${esc(s.name)} ${s.minute}′${s.ownGoal ? ' (OG)' : ''}\u003c/span>`).join('') : 'Every rivalry starts somewhere.'}\u003c/div>\u003cdiv class=\"modal-buttons\">\u003cbutton class=\"secondary-button\" data-action=\"home\">BACK TO THE BLOCK\u003c/button>\u003cbutton class=\"primary-button\" data-action=\"play\">REMATCH →\u003c/button>\u003c/div>\u003cbutton class=\"text-button replay-result\" data-action=\"replay\" ${g.replayClip.length \u003c 6 ? 'disabled' : ''}>WATCH THE LAST GOAL ↻\u003c/button>`;\n        }\n        else if (this.modal === 'roster')\n            m.innerHTML = this.rosterMarkup();\n        else if (this.modal === 'help')\n            m.innerHTML = `${this.top('THE PLAYBOOK', 'EASY TO PICK UP.\u003cbr>LOUD TO PUT DOWN.')}\u003cp class=\"modal-intro\">You control the highlighted player. Teammates keep their shape, make runs, defend, and play in goal. Attack the end shown in the HUD.\u003c/p>\u003cdiv class=\"help-columns\">\u003cdiv>\u003ch3>KEYBOARD · PLAYER ONE\u003c/h3>\u003cdiv class=\"key-table\">\u003cspan>Move / aim\u003c/span>\u003cb>\u003ckbd>W A S D\u003c/kbd> or \u003ckbd>↑ ↓ ← →\u003c/kbd>\u003c/b>\u003cspan>Pass / take restart\u003c/span>\u003cb>\u003ckbd>J\u003c/kbd>\u003c/b>\u003cspan>Charge shot / release\u003c/span>\u003cb>Hold \u003ckbd>K\u003c/kbd>, release to shoot\u003c/b>\u003cspan>Lob, cross / tackle / header\u003c/span>\u003cb>\u003ckbd>L\u003c/kbd>\u003c/b>\u003cspan>Turbo sprint\u003c/span>\u003cb>\u003ckbd>LEFT SHIFT\u003c/kbd>\u003c/b>\u003cspan>Switch nearest teammate\u003c/span>\u003cb>\u003ckbd>SPACE\u003c/kbd>\u003c/b>\u003cspan>Super shot at 100% hype\u003c/span>\u003cb>\u003ckbd>F\u003c/kbd>\u003c/b>\u003cspan>Goalkeeper handle ball\u003c/span>\u003cb>\u003ckbd>G\u003c/kbd>\u003c/b>\u003cspan>Pause / free-play reset\u003c/span>\u003cb>\u003ckbd>ESC\u003c/kbd> / \u003ckbd>R\u003c/kbd>\u003c/b>\u003c/div>\u003ch3>LOCAL VERSUS · PLAYER TWO\u003c/h3>\u003cp>Arrow keys move. Numpad 1 / 2 / 3 pass / shoot / lob or tackle. Right Shift turbo. Numpad 0 switches. Numpad Enter fires a super. Without a numpad: \u003ckbd>[\u003c/kbd> pass, \u003ckbd>]\u003c/kbd> shoot, \u003ckbd>\\\\\u003c/kbd> tackle, \u003ckbd>END\u003c/kbd> switch, \u003ckbd>RIGHT CTRL\u003c/kbd> super.\u003c/p>\u003ch3>STANDARD GAMEPAD\u003c/h3>\u003cp>Left stick moves. A passes, B charges a shot, X lobs or tackles, Y switches. LB turbo, RB super, LT handles as keeper. Start pauses. Connect two gamepads for local versus.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>PLAY LOUD. PLAY FOOTBALL.\u003c/h3>\u003cdiv class=\"tip-card\">\u003cspan>01\u003c/span>\u003cdiv>\u003cb>BUILD THE HYPE.\u003c/b>\u003cp>Complete passes, win tackles, and score. At 100%, press \u003ckbd>F\u003c/kbd> with the ball to unleash a super shot. Every goal still counts as one.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"tip-card\">\u003cspan>02\u003c/span>\u003cdiv>\u003cb>THE REF IS WATCHING.\u003c/b>\u003cp>Offside is checked when a teammate plays the ball. Bad tackles earn free kicks, penalties, yellow cards, or red cards. Advantage keeps promising attacks alive.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"tip-card\">\u003cspan>03\u003c/span>\u003cdiv>\u003cb>FINISH THE JOB.\u003c/b>\u003cp>Two halves, switched ends, added time. Arcade cup and local versus go to extra time and a five-kick shootout, then sudden death. Friendlies allow draws. Free play has no time limit.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"tip-card\">\u003cspan>04\u003c/span>\u003cdiv>\u003cb>USE YOUR WHOLE SQUAD.\u003c/b>\u003cp>18 players per club. Choose 4-3-3, 4-4-2, or 3-5-2. Make five substitutions across three stoppage windows; one extra substitute and window in extra time. Interval changes do not consume a window.\u003c/p>\u003c/div>\u003c/div>\u003ch3>THE SMALL PRINT\u003c/h3>\u003cp>Throw-ins, corners, goal kicks, direct and indirect free kicks, double touches, back-passes, goalkeeper eight-second possession, and shootouts are modeled. Restarts auto-take after a short setup. Handball, VAR, injuries, referee administration, and every rare IFAB edge case are not simulated. Big bodies, bigger shots, smaller match clocks: deliberately arcade.\u003c/p>\u003c/div>\u003c/div>${this.settingsMarkup()}\u003cdiv class=\"modal-footnote\">TOUCH CONTROLS APPEAR ON TOUCH DEVICES. LANDSCAPE IS RECOMMENDED.\u003c/div>`;\n        else if (this.modal === 'quit')\n            m.innerHTML = `${this.top('THE MATCH IS NOT OVER', 'LEAVE THE PARTY?')}\u003cp class=\"modal-intro\">This match will be discarded. Your settings and completed results stay saved on this device.\u003c/p>\u003cdiv class=\"modal-buttons\">\u003cbutton class=\"secondary-button\" data-action=\"resume\">KEEP PLAYING\u003c/button>\u003cbutton class=\"primary-button coral-button\" data-action=\"confirm-home\">LEAVE MATCH →\u003c/button>\u003c/div>`;\n        else if (this.modal === 'engine')\n            m.innerHTML = `${this.top('UNDER THE BLOCKS', 'BUILT TO PLAY.')}\u003cdiv class=\"engine-detail\">\u003cb>${esc(this.engine)}\u003c/b>\u003cspan>${esc(g.physicsName)}\u003c/span>\u003c/div>\u003cp class=\"modal-intro\">The source project uses three.js 0.186.1, Vite 8.3.1, Rapier 0.21.0, and TypeScript 7.0.2. Its primary renderer is WebGPU, with Three’s WebGL fallback when WebGPU is unavailable.\u003c/p>\u003cp>The standalone edition starts entirely offline using the same stadium geometry, squads, and match logic, with a software 3D renderer and portable ball physics. It is not mislabeled as WebGPU.\u003c/p>\u003cp>With an internet connection, the button below loads the pinned Three and Rapier modules from public CDNs. Loading may be blocked by browser security or network policy. The offline game remains available.\u003c/p>\u003cbutton class=\"primary-button\" data-action=\"native\">ENABLE GPU + RAPIER ↗\u003c/button>\u003cdiv class=\"modal-footnote\">WEBGPU REQUIRES A COMPATIBLE BROWSER AND SECURE CONTEXT. THE SOURCE PROJECT RUNS ON LOCALHOST.\u003c/div>`;\n    }\n    rosterMarkup() {\n        const g = this.game, t = this.rosterTeam, team = TEAMS[t], human = g.home || g.controlled(t), formation = g.home ? this.preferredFormations[t] : g.formations[t];\n        const active = g.players.filter(p => p.team === t), bench = team.roster.map((m, i) => ({ m, i })).filter(({ i }) => !g.usedMembers[t].has(i));\n        const rows = team.roster.map((m, i) => { const p = active.find(p => p.member === i); const status = p ? p.red ? 'SENT OFF' : g.home ? 'STARTING XI' : 'ON THE PITCH' : g.usedMembers[t].has(i) ? 'SUBBED OFF' : 'BENCH'; return `\u003ctr class=\"${p?.red ? 'sent-off' : ''}\">\u003ctd class=\"jersey\">${String(m.number).padStart(2, '0')}\u003c/td>\u003ctd>\u003cstrong>${esc(m.name)}\u003c/strong>\u003cspan class=\"roster-status\">${status}${p?.yellows ? ' · 🟨'.repeat(p.yellows) : ''}\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"role-chip\">${m.role}\u003c/span>\u003c/td>\u003ctd>${m.pace}\u003c/td>\u003ctd>${m.shot}\u003c/td>\u003ctd>${m.skill}\u003c/td>\u003ctd class=\"fitness-cell\">${p ? `\u003cdiv class=\"fitness-track\">\u003ci style=\"width:${p.stamina}%\">\u003c/i>\u003c/div>\u003cspan>${Math.round(p.stamina)}%\u003c/span>` : 'FRESH'}\u003c/td>\u003c/tr>`; }).join('');\n        const starters = active.filter(p => !p.red);\n        return `${this.top('THE SQUADS · 18 PLAYERS PER CLUB', 'PICK YOUR PLAYMAKERS.')}\u003cdiv class=\"roster-tabs\">${TEAMS.map((a, i) => `\u003cbutton class=\"${i === t ? 'active' : ''}\" data-action=\"roster-tab\" data-team=\"${i}\">\u003cspan style=\"color:${a.color}\">${a.symbol}\u003c/span>${a.name}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"roster-header\">\u003cdiv>\u003cstrong style=\"color:${team.dark}\">${team.motto}\u003c/strong>\u003cspan>${g.home ? '11 STARTERS · 7 SUBSTITUTES' : `${g.substitutions[t]} / ${g.period > 2 ? 6 : 5} CHANGES · ${g.subWindows[t]} / ${g.period > 2 ? 4 : 3} WINDOWS`}\u003c/span>\u003c/div>\u003clabel>FORMATION\u003cselect id=\"formation\" ${!human ? 'disabled' : ''}>${Object.keys(FORMATIONS).map(f => `\u003coption ${f === formation ? 'selected' : ''}>${f}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003c/div>\n  ${!g.home && human && g.phase !== 'fulltime' ? `\u003cdiv class=\"substitution\">\u003clabel>PLAYER OFF\u003cselect id=\"sub-off\">${starters.map(p => `\u003coption value=\"${p.id}\">#${g.member(p).number} ${esc(g.member(p).name)} · ${Math.round(p.stamina)}%\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003cspan class=\"sub-arrow\">↔\u003c/span>\u003clabel>PLAYER ON\u003cselect id=\"sub-on\">${bench.map(({ m, i }) => `\u003coption value=\"${i}\">#${m.number} ${esc(m.name)} · ${m.role}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003cbutton class=\"primary-button\" data-action=\"substitute\" ${bench.length ? '' : 'disabled'}>MAKE CHANGE\u003c/button>\u003cp>Changes apply at the next stoppage. No re-entry; sent-off players cannot be replaced.${g.queuedSubs.length ? ` \u003cb>${g.queuedSubs.length} change(s) queued.\u003c/b>` : ''}\u003c/p>\u003c/div>` : ''}\n  \u003cdiv class=\"roster-table-wrap\">\u003ctable class=\"roster-table\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>PLAYER\u003c/th>\u003cth>POS\u003c/th>\u003cth>PACE\u003c/th>\u003cth>SHOT\u003c/th>\u003cth>SKILL\u003c/th>\u003cth>ENERGY\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows}\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"modal-footnote\">ORIGINAL CLUBS. ORIGINAL PLAYERS. ALL HEART.\u003c/div>`;\n    }\n    substitute() { const off = Number(this.refs.modal.querySelector('#sub-off')?.value), on = Number(this.refs.modal.querySelector('#sub-on')?.value); if (!Number.isFinite(off) || !Number.isFinite(on))\n        return; const error = this.game.queueSubstitution(this.rosterTeam, off, on); this.toast(error ?? 'Change registered. Fresh legs at the next stoppage.'); this.renderModal(); }\n    update(now) {\n        if (this.toastUntil && now > this.toastUntil) {\n            this.refs.toast.classList.add('hidden');\n            this.toastUntil = 0;\n        }\n        const g = this.game;\n        if (g.home)\n            return;\n        if (g.phase === 'fulltime' && !this.resultSaved) {\n            this.resultSaved = true;\n            this.records.unshift({ when: new Date().toISOString(), score: [...g.score], team: this.settings.team, winner: g.winner, reason: g.finishReason });\n            this.records = this.records.slice(0, 10);\n            try {\n                localStorage.setItem('bpf-records', JSON.stringify(this.records));\n            }\n            catch { }\n        }\n        if (!this.modal && !g.isReplay && (g.phase === 'break' || g.phase === 'fulltime'))\n            this.open(g.phase === 'break' ? 'break' : 'result');\n        if (now - this.lastHud \u003c 70)\n            return;\n        this.lastHud = now;\n        this.refs['score-0'].textContent = String(g.score[0]);\n        this.refs['score-1'].textContent = String(g.score[1]);\n        this.refs.clock.textContent = g.settings.mode === 'practice' ? '∞' : g.phase === 'shootout' ? 'PEN' : g.clock;\n        this.refs.period.textContent = g.phase === 'shootout' ? 'SHOOTOUT' : g.periodName;\n        this.refs.added.innerHTML = g.addedTime >= 0 ? `+${g.addedMinutes} MIN` : 'LIVE \u003ci>\u003c/i>';\n        this.refs.direction.textContent = g.phase === 'shootout' ? 'PENALTIES →' : `YOU ATTACK ${g.attack[this.settings.team] === 1 ? '→' : '←'}`;\n        const p = g.players[g.selected[this.settings.team]], member = g.member(p);\n        this.refs['player-number'].textContent = String(member.number).padStart(2, '0');\n        this.refs['player-name'].textContent = member.name.toUpperCase();\n        this.refs['player-role'].textContent = `${member.role} · ${TEAMS[p.team].name.toUpperCase()}${this.settings.mode === 'local' ? ' · P1' : ''}`;\n        this.refs['stamina-bar'].style.width = `${p.stamina}%`;\n        this.refs.charge.classList.toggle('hidden', p.charge \u003c= 0.01);\n        this.refs['charge-bar'].style.width = `${p.charge * 100}%`;\n        const power = g.power[this.settings.team];\n        this.refs['power-bar'].style.width = `${power}%`;\n        this.refs['power-number'].innerHTML = `${Math.floor(power)}\u003cspan>%\u003c/span>`;\n        this.refs['hype-panel'].classList.toggle('ready', power >= 100);\n        this.refs['power-tip'].textContent = power >= 100 ? 'IT’S YOUR MOMENT. LET IT RIP.' : 'MAKE PLAYS. BUILD THE HYPE.';\n        const event = [...g.events].reverse().find(e => !['kick', 'tackle'].includes(e.type) && g.time - e.time \u003c 3.0);\n        this.refs.event.classList.toggle('visible', Boolean(event) && g.phase !== 'goal' && !g.isReplay);\n        if (event) {\n            if (this.refs['event-title'].textContent !== event.title)\n                this.refs['event-title'].textContent = event.title;\n            if (this.refs['event-detail'].textContent !== event.detail)\n                this.refs['event-detail'].textContent = event.detail;\n            this.refs.event.dataset.kind = event.type;\n        }\n        const restart = g.phase === 'restart' && g.restart;\n        this.refs['restart-help'].classList.toggle('hidden', !restart || !g.controlled(restart.team));\n        if (restart)\n            this.refs['restart-title'].textContent = `${restart.label} · ${TEAMS[restart.team].short} · ${Math.max(0, Math.ceil(7.5 - restart.timer))}s`;\n        const goal = g.phase === 'goal' && !g.isReplay;\n        this.refs['goal-splash'].classList.toggle('hidden', !goal);\n        if (goal) {\n            const s = g.scorers.at(-1);\n            this.refs['goal-scorer'].textContent = s ? `${s.name.toUpperCase()} · ${s.minute}′${s.ownGoal ? ' (OWN GOAL)' : ''}` : '';\n        }\n        this.refs['replay-tag'].classList.toggle('hidden', !g.isReplay);\n        this.refs['shootout-dots'].classList.toggle('hidden', !g.shootout);\n        if (g.shootout) {\n            const s = g.shootout;\n            this.refs['shootout-dots'].innerHTML = [0, 1].map(t => `\u003cspan>${Array.from({ length: Math.max(5, s.kicks[t].length + (s.turn === t ? 1 : 0)) }, (_, i) => `\u003ci class=\"${i \u003c s.kicks[t].length ? s.kicks[t][i] ? 'scored' : 'missed' : s.turn === t && i === s.kicks[t].length ? 'current' : ''}\">${i \u003c s.kicks[t].length ? s.kicks[t][i] ? '✓' : '×' : ''}\u003c/i>`).join('')}\u003c/span>`).join('');\n        }\n        this.drawRadar();\n        this.lastPhase = g.phase;\n    }\n    drawRadar() {\n        const canvas = this.refs.radar, ctx = canvas.getContext('2d');\n        const g = this.game, w = canvas.width, h = canvas.height;\n        ctx.clearRect(0, 0, w, h);\n        ctx.fillStyle = '#183743';\n        ctx.globalAlpha = .94;\n        ctx.fillRect(0, 0, w, h);\n        ctx.globalAlpha = 1;\n        const left = 17, top = 10, pw = w - 34, ph = h - 20;\n        const x = (v) => left + (v + 52.5) / 105 * pw, z = (v) => top + (v + 34) / 68 * ph;\n        ctx.strokeStyle = '#496168';\n        ctx.lineWidth = 1.5;\n        ctx.strokeRect(left, top, pw, ph);\n        ctx.beginPath();\n        ctx.moveTo(w / 2, top);\n        ctx.lineTo(w / 2, h - top);\n        ctx.stroke();\n        ctx.beginPath();\n        ctx.ellipse(w / 2, h / 2, 9.15 / 105 * pw, 9.15 / 68 * ph, 0, 0, Math.PI * 2);\n        ctx.stroke();\n        ctx.strokeRect(left, z(-20.16), 16.5 / 105 * pw, 40.32 / 68 * ph);\n        ctx.strokeRect(w - left - 16.5 / 105 * pw, z(-20.16), 16.5 / 105 * pw, 40.32 / 68 * ph);\n        const view = g.renderState();\n        for (const p of view.players) {\n            if (p.red)\n                continue;\n            ctx.beginPath();\n            ctx.fillStyle = TEAMS[p.team].color;\n            ctx.arc(x(p.x), z(p.z), 4.4, 0, Math.PI * 2);\n            ctx.fill();\n            if (p.id === g.selected[p.team]) {\n                ctx.strokeStyle = p.team === this.settings.team ? '#f7d45b' : '#f5efdb';\n                ctx.lineWidth = 2;\n                ctx.beginPath();\n                ctx.arc(x(p.x), z(p.z), 7, 0, Math.PI * 2);\n                ctx.stroke();\n            }\n        }\n        ctx.fillStyle = '#fffbe7';\n        ctx.beginPath();\n        ctx.arc(x(view.ball.x), z(view.ball.z), 3.6, 0, Math.PI * 2);\n        ctx.fill();\n    }\n}\n"};
const urls=new Map();
function normalize(base,relative){const chunks=base.split('/');chunks.pop();for(const part of relative.split('/')){if(part==='..')chunks.pop();else if(part!=='.')chunks.push(part);}return chunks.join('/');}
function moduleURL(name){if(urls.has(name))return urls.get(name);if(!(name in sources))throw new Error('Missing module: '+name);let source=sources[name];source=source.replace(/(from\s*|import\s*\(\s*)(['"])(\.{1,2}\/[^'"]+)\2/g,(_all,prefix,quote,relative)=>prefix+quote+moduleURL(normalize(name,relative))+quote);const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));urls.set(name,url);return url;}
try{await import(moduleURL('main.js'));}catch(error){console.error(error);const boot=document.querySelector('#boot');boot.classList.add('error');boot.textContent='Unable to start: '+error.message;}
