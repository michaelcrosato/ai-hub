    }
    const tr = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.35, 0.5, 3, 6), toon(0x6b4a2e), trunks.length);
    const tp = new THREE.InstancedMesh(new THREE.ConeGeometry(2.6, 6.5, 7), toon(0x2f6b34), tops.length);
    trunks.forEach((m, i) => tr.setMatrixAt(i, m));
    tops.forEach((m, i) => { tp.setMatrixAt(i, m); tp.setColorAt(i, _c1.set(pick([0x2f6b34, 0x3c7d3a, 0x285c30]))); });
    tr.castShadow = tp.castShadow = true;
    this.group.add(tr, tp);
    // light towers
    const towerSpots = this.isBowl ? [0.5, 2.1, 3.7, 5.3].map((t) => new THREE.Vector3(Math.cos(t) * (this.bowl.a + 30), 0, Math.sin(t) * (this.bowl.b + 30)))
      : [0.12, 0.38, 0.6, 0.9].map((f) => { const i = Math.floor(f * this.N); const s = this.samples[i]; const p = this.edge(i, (s.k > 0 ? -1 : 1) * (this.width / 2 + 9)); p.y = 0; return p; });
    for (const p of towerSpots) {
      const pole = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 22, 8), toon(0x55525c)));
      pole.position.copy(p).setY(11);
      const head = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 0.6), flat(0xfff6c8));
      head.position.copy(p).setY(22.5);
      head.lookAt(0, 22.5, 0);
      this.group.add(pole, head);
    }
    // distant hills
    for (let k = 0; k < 14; k++) {
      const t = (k / 14) * TAU;
      const h = new THREE.Mesh(new THREE.SphereGeometry(rand(80, 160), 10, 6, 0, TAU, 0, Math.PI / 2), toon(pick([0x4f7f3a, 0x5b8a42, 0x6b8f4a])));
      h.position.set(Math.cos(t) * 780, -10, Math.sin(t) * 780);
      h.scale.y = rand(0.35, 0.6);
      this.group.add(h);
    }
  }

  updateCrowd(time, excitement) {
    if (!this.crowdMesh) return;
    const amp = 0.08 + excitement * 0.5;
    for (let i = 0; i < this.crowd.length; i++) {
      const c = this.crowd[i];
      const j = Math.max(0, Math.sin(time * c.speed + c.phase)) * amp;
      _m1.makeRotationY(c.face).setPosition(c.base.x, c.base.y + j, c.base.z);
      this.crowdMesh.setMatrixAt(i, _m1);
    }
    this.crowdMesh.instanceMatrix.needsUpdate = true;
    if (this.flag) this.flag.rotation.y = Math.sin(time * 2) * 0.3;
  }

  buildMinimap() {
    const pts = [];
    if (this.isBowl) {
      const { a, b, W } = this.bowl;
      for (let i = 0; i <= 64; i++) { const t = (i / 64) * TAU; pts.push([Math.cos(t) * (a + W * 0.5), Math.sin(t) * (b + W * 0.5)]); }
    } else for (let i = 0; i <= this.N; i += 2) { const p = this.samples[i % this.N].p; pts.push([p.x, p.z]); }
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    for (const [x, z] of pts) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minZ = Math.min(minZ, z); maxZ = Math.max(maxZ, z); }
    const span = Math.max(maxX - minX, maxZ - minZ) * 1.15;
    this.mini = { pts, cx: (minX + maxX) / 2, cz: (minZ + maxZ) / 2, span };
  }

  // ------------------------------------------------ queries
  locate(pos, hint) {
    const N = this.N, S = this.samples;
    let best = 0, bd = Infinity;
    const scan = (i0, i1) => {
      for (let k = i0; k <= i1; k++) {
        const i = ((k % N) + N) % N;
        const p = S[i].p;
        const dx = pos.x - p.x, dz = pos.z - p.z, dy = (pos.y - p.y) * 2;
        const d = dx * dx + dz * dz + dy * dy;
        if (d < bd) { bd = d; best = i; }
      }
    };
    if (hint === undefined || hint < 0) scan(0, N - 1);
    else {
      scan(hint - 14, hint + 14);
      if (bd > 40 * 40) { bd = Infinity; scan(0, N - 1); }
    }
    const s = S[best];
    _v1.subVectors(pos, s.p);
    return { i: best, lateral: _v1.dot(s.r), dist: Math.sqrt(bd) };
  }
  inPitBox(loc) {
    const P = this.pit;
    if (!P) return false;
    return loc.i >= P.boxA && loc.i <= P.boxB && loc.lateral < -(this.width / 2 + 1.5);
  }
  /** Grid slot k: [position, quaternion]. */
  gridSlot(k, total) {
    if (this.isBowl) {
      const { a, b } = this.bowl;
      const t = (k / total) * TAU + 0.15;
      const p = new THREE.Vector3(Math.cos(t) * a * 0.72, 1.0, Math.sin(t) * b * 0.72);
      const yaw = Math.atan2(-p.x, -p.z) + (k % 2 ? 0.5 : -0.5);
      return [p, new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw)];
    }
    const row = Math.floor(k / 2), col = k % 2;
    const back = 9 + row * 9 + col * 4.5;
    const i = (this.N - Math.round(back / this.spacing)) % this.N;
    const s = this.samples[i];
    const p = s.p.clone().addScaledVector(s.r, (col ? 1 : -1) * this.width * 0.22).addScaledVector(s.up, 1.0);
    const q = new THREE.Quaternion().setFromRotationMatrix(_m1.makeBasis(s.r.clone().negate(), s.up, s.t));
    return [p, q];
  }
  /** A safe place to put a car back down near where it is. */
  recoverSpot(pos, hint) {
    if (this.isBowl) {
      const { a, b } = this.bowl;
      const ang = Math.atan2(pos.z / b, pos.x / a);
      const p = new THREE.Vector3(Math.cos(ang) * a * 0.62, 1.4, Math.sin(ang) * b * 0.62);
      const yaw = Math.atan2(-p.x, -p.z);
      return [p, new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw), -1];
    }
    const loc = this.locate(pos, hint);
    const s = this.samples[loc.i];
    const lat = clamp(loc.lateral, -this.width * 0.3, this.width * 0.3);
    const p = s.p.clone().addScaledVector(s.r, lat).addScaledVector(s.up, 1.3);
    const q = new THREE.Quaternion().setFromRotationMatrix(_m1.makeBasis(s.r.clone().negate(), s.up, s.t));
    return [p, q, loc.i];
  }
  dispose(scene) {
    scene.remove(this.group);
    this.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  }
}

// ---------------------------------------------------------------- cars: raycast suspension on a Rapier body, soft-body-style dents
const SPEC = {
  mass: 1250, wheelR: 0.36, rest: 0.38, k: 38000, c: 4300, engine: 10800, vmax: 50, brake: 17000,
  mu: { road: 1.5, dirt: 1.15, grass: 0.85 }, maxSteer: 0.62, minSteer: 0.15,
};
const WHEEL_POS = [
  { x: 0.9, z: 1.38, front: true, zone: 'L' },
  { x: -0.9, z: 1.38, front: true, zone: 'R' },
  { x: 0.9, z: -1.36, front: false, zone: 'L' },
  { x: -0.9, z: -1.36, front: false, zone: 'R' },
];
const ZONES = ['F', 'B', 'L', 'R'];
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _up = new THREE.Vector3(), _vel = new THREE.Vector3();
const _hp = new THREE.Vector3(), _cp = new THREE.Vector3(), _wf = new THREE.Vector3(), _wr = new THREE.Vector3(), _f = new THREE.Vector3(), _t = new THREE.Vector3();
const WORLD_UP = new THREE.Vector3(0, 1, 0);

function numberTexture(num, bg, fg) {
  const cv = document.createElement('canvas');
  cv.width = 128; cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = bg; g.beginPath(); g.arc(64, 64, 60, 0, TAU); g.fill();
  g.lineWidth = 8; g.strokeStyle = '#111'; g.stroke();
  g.fillStyle = fg; g.font = 'italic 900 70px "Arial Black", Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(String(num), 64, 68);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

class Car {
  constructor(ev, idx, o) {
    this.ev = ev;
    this.idx = idx;
    this.name = o.name;
    this.color = o.color;
    this.accent = o.accent;
    this.number = o.number;
    this.isPlayer = !!o.isPlayer;
    this.skill = o.skill ?? 1;
    this.aggression = o.aggression ?? 0.5;
    this.invulnerable = !!o.invulnerable;
    this.hp = 100;
    this.zone = { F: 0, B: 0, L: 0, R: 0 };
    this.wrecked = false;
    this.points = 0;
    this.stats = { hits: 0, spins: 0, wrecks: 0, rolls: 0, airtime: 0, bestAir: 0, repairs: 0 };
    this.ctrl = { steer: 0, throttle: 0, brake: 0, handbrake: false };
    this.steer = 0;
    this.pos = new THREE.Vector3();
    this.quat = new THREE.Quaternion();
    this.vel = new THREE.Vector3();
    this.prevVel = new THREE.Vector3();
    this.fwd = new THREE.Vector3(0, 0, 1);
    this.up = new THREE.Vector3(0, 1, 0);
    this.speed = 0;
    this.speedFwd = 0;
    this.grounded = 4;
    this.airTime = 0;
    this.slip = 0;
    this.impAcc = new THREE.Vector3();
    this.impT = 0;
    this.grace = 1.0;
    this.lastHitBy = null;
    this.lastHitAt = -99;
    this.spinAcc = 0;
    this.spinAward = 0;
    this.rollAwarded = false;
    this.flippedFor = 0;
    this.trackIdx = -1;
    this.lap = 0;
    this.lapStart = 0;
    this.bestLap = Infinity;
    this.lastLap = Infinity;
    this.finished = false;
    this.finishTime = 0;
    this.progress = 0;
    this.maxLapSeen = 0;
    this.repairing = false;
    this.burn = 0;
    this.smokeT = 0;
    this.wheelState = WHEEL_POS.map(() => ({ comp: 0, spin: 0, contact: false, lost: false, skidFrom: null, len: SPEC.rest }));
    this.buildMesh();
  }

  // ------------------------------------------------ model
  buildMesh() {
    const root = new THREE.Group();
    const bodyMat = toon(this.color);
    this.bodyMat = bodyMat;
    const bodyGeo = new THREE.BoxGeometry(1.84, 0.62, 4.4, 6, 2, 14);
    const p = bodyGeo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      // sloped nose and tail, slightly tumbled-home sides
      if (y > 0) {
        if (z > 1.5) p.setY(i, y - (z - 1.5) * 0.18);
        if (z < -1.7) p.setY(i, y - (-1.7 - z) * 0.12);
        p.setX(i, x * 0.96);
      }
    }
    bodyGeo.translate(0, -0.04, 0);
    bodyGeo.computeVertexNormals();
    this.body3d = shadowed(new THREE.Mesh(bodyGeo, bodyMat));
    root.add(this.body3d);
    const cabGeo = new THREE.BoxGeometry(1.6, 0.56, 2.1, 4, 2, 6);
    const cp = cabGeo.attributes.position;
    for (let i = 0; i < cp.count; i++) if (cp.getY(i) > 0) { cp.setX(i, cp.getX(i) * 0.84); cp.setZ(i, cp.getZ(i) * 0.8 - 0.05); }
    cabGeo.translate(0, 0.54, -0.32);
    cabGeo.computeVertexNormals();
    this.cabin = shadowed(new THREE.Mesh(cabGeo, toon(0x26324a)));
    root.add(this.cabin);
    const roof = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.36, 0.08, 1.62), bodyMat));
    roof.position.set(0, 0.84, -0.36);
    root.add(roof);
    this.roof = roof;
    this.dentables = [this.body3d, this.cabin];
    for (const m of this.dentables) m.userData.orig = Float32Array.from(m.geometry.attributes.position.array);
    // detachable panels
    const accentMat = toon(this.accent);
    const hood = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.66, 0.07, 1.3), bodyMat));
    hood.position.set(0, 0.3, 1.42);
    hood.rotation.x = 0.1;
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.075, 1.31), accentMat);
    hood.add(stripe);
    const trunk = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.66, 0.07, 0.86), bodyMat));
    trunk.position.set(0, 0.29, -1.74);
    const chrome = toon(0x9d9dab);
    const bumperF = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.94, 0.26, 0.3), chrome));
    bumperF.position.set(0, -0.2, 2.27);
    const bumperR = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.94, 0.26, 0.3), chrome));
    bumperR.position.set(0, -0.2, -2.27);
    const doorL = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.42, 1.5), accentMat));
    doorL.position.set(0.9, 0.0, -0.1);
    const doorR = doorL.clone();
    doorR.position.x = -0.9;
    root.add(hood, trunk, bumperF, bumperR, doorL, doorR);
    this.parts = [
      { mesh: hood, zone: 'F', at: 42, size: [0.83, 0.05, 0.65] },
      { mesh: bumperF, zone: 'F', at: 68, size: [0.97, 0.13, 0.15] },
      { mesh: trunk, zone: 'B', at: 48, size: [0.83, 0.05, 0.43] },
      { mesh: bumperR, zone: 'B', at: 72, size: [0.97, 0.13, 0.15] },
      { mesh: doorL, zone: 'L', at: 62, size: [0.05, 0.21, 0.75] },
      { mesh: doorR, zone: 'R', at: 62, size: [0.05, 0.21, 0.75] },
    ];
    // lights and numbers
    const head = flat(0xfff3b0), tail = flat(0xff2a2a);
    for (const x of [-0.6, 0.6]) {
      const h = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.15, 0.06), head);
      h.position.set(x, 0.06, 2.21);
      const t = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.13, 0.06), tail);
      t.position.set(x, 0.08, -2.21);
      root.add(h, t);
    }
    const numMat = new THREE.MeshBasicMaterial({ map: numberTexture(this.number, '#f4f1ea', '#111'), transparent: true, alphaTest: 0.5 });
    for (const side of [-1, 1]) {
      const n = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62), numMat);
      n.position.set(side * 0.94, 0.02, -0.15);
      n.rotation.y = side * Math.PI / 2;
      root.add(n);
    }
    const nr = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.9), numMat);
    nr.position.set(0, 0.885, -0.36);
    nr.rotation.x = -Math.PI / 2;
    root.add(nr);
    // wheels
    const tireGeo = new THREE.CylinderGeometry(SPEC.wheelR, SPEC.wheelR, 0.32, 16).rotateZ(Math.PI / 2);
    const hubGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.34, 8).rotateZ(Math.PI / 2);
    this.wheels = WHEEL_POS.map((w) => {
      const g = new THREE.Group();
      const spin = new THREE.Group();
      spin.add(shadowed(new THREE.Mesh(tireGeo, toon(0x1d1b20))), new THREE.Mesh(hubGeo, toon(0xc9c9d2)));
      g.add(spin);
      g.position.set(w.x, -0.3, w.z);
      root.add(g);
      return { g, spin };
    });
    // player marker so you can always find yourself in a pile-up
    if (this.isPlayer) {
      const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.7, 4), flat(0xffe14d));
      arrow.rotation.x = Math.PI;
      arrow.position.set(0, 2.0, -0.3);
      root.add(arrow);
      this.marker = arrow;
    }
    this.root = root;
    this.ev.scene.add(root);
  }

  // ------------------------------------------------ physics
  spawn(p, q) {
    const world = this.ev.world;
    const desc = RAPIER.RigidBodyDesc.dynamic().setTranslation(p.x, p.y, p.z).setRotation({ x: q.x, y: q.y, z: q.z, w: q.w })
      .setCanSleep(false).setCcdEnabled(true).setAngularDamping(0.35).setLinearDamping(0.02);
    this.body = world.createRigidBody(desc);
    this.col = world.createCollider(RAPIER.ColliderDesc.cuboid(0.93, 0.32, 2.24).setTranslation(0, -0.04, 0)
      .setMassProperties(SPEC.mass, { x: 0, y: -0.34, z: 0.05 }, { x: 2100, y: 2400, z: 720 }, { x: 0, y: 0, z: 0, w: 1 })
      .setFriction(0.35).setRestitution(0.22).setCollisionGroups(GROUPS_CAR), this.body);
    this.colTop = world.createCollider(RAPIER.ColliderDesc.cuboid(0.72, 0.27, 1.0).setTranslation(0, 0.56, -0.32)
      .setDensity(0).setFriction(0.4).setRestitution(0.1).setCollisionGroups(GROUPS_CAR), this.body);
    this.pos.copy(p); this.quat.copy(q);
    this.syncMesh();
  }

  place(p, q) {
    const b = this.body;
    b.setTranslation({ x: p.x, y: p.y, z: p.z }, true);
    b.setRotation({ x: q.x, y: q.y, z: q.z, w: q.w }, true);
    b.setLinvel({ x: 0, y: 0, z: 0 }, true);
    b.setAngvel({ x: 0, y: 0, z: 0 }, true);
    this.prevVel.set(0, 0, 0);
    this.impAcc.set(0, 0, 0);
    this.grace = 1.0;
    this.flippedFor = 0;
    this.pos.copy(p); this.quat.copy(q);
  }

  step(dt) {
    const b = this.body;
    b.resetForces(true);
    b.resetTorques(true);
    const tr = b.translation(), ro = b.rotation(), lv = b.linvel();
    this.pos.set(tr.x, tr.y, tr.z);
    this.quat.set(ro.x, ro.y, ro.z, ro.w);
    _fwd.set(0, 0, 1).applyQuaternion(this.quat);
    _right.set(-1, 0, 0).applyQuaternion(this.quat);
    _up.set(0, 1, 0).applyQuaternion(this.quat);
    this.fwd.copy(_fwd); this.up.copy(_up);
    this.vel.set(lv.x, lv.y, lv.z);
    this.speed = this.vel.length();
    this.speedFwd = this.vel.dot(_fwd);
    const z = this.zone;
    const c = this.wrecked ? { steer: 0, throttle: 0, brake: 0.3, handbrake: true } : this.ctrl;
    const power = (1 - z.F * 0.0028) * (0.75 + this.hp * 0.0025);
    const top = SPEC.vmax * this.skill * (1 - z.B * 0.0014) * (this.isPlayer ? 1 : this.ev.aiSpeed);
    const steerLimit = lerp(SPEC.maxSteer, SPEC.minSteer, clamp(Math.abs(this.speedFwd) / 40, 0, 1)) * (1 - (z.L + z.R) * 0.0012);
    const pull = (z.L - z.R) * 0.0011;
    this.steer = damp(this.steer, clamp(c.steer + pull, -1, 1), 9, dt);
    const ang = this.steer * steerLimit;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    // engine & brakes
    let drive = 0, brakeF = 0;
    if (c.throttle > 0.02) {
      const v = Math.max(0, this.speedFwd);
      drive = c.throttle * SPEC.engine * power * clamp(1 - (v / top) * (v / top), 0, 1);
    }
    if (c.brake > 0.02) {
      if (this.speedFwd > 1.2) brakeF = c.brake * SPEC.brake;
      else drive -= c.brake * SPEC.engine * 0.55 * clamp(1 - (-this.speedFwd / 15) ** 2, 0, 1);
    }
    const share = SPEC.mass / 4;
    let grounded = 0, slipMax = 0;
    const world = this.ev.world;
    const maxLen = SPEC.rest + SPEC.wheelR;
    for (let w = 0; w < 4; w++) {
      const W = WHEEL_POS[w], st = this.wheelState[w];
      if (st.lost) { st.contact = false; continue; }
      _hp.set(W.x, 0, W.z).applyQuaternion(this.quat).add(this.pos);
      const ray = new RAPIER.Ray({ x: _hp.x, y: _hp.y, z: _hp.z }, { x: -_up.x, y: -_up.y, z: -_up.z });
      const hit = world.castRayAndGetNormal(ray, maxLen, true, undefined, GROUPS_WHEELRAY, undefined, b);
      if (!hit) { st.contact = false; st.len = damp(st.len, SPEC.rest, 10, dt); st.skidFrom = null; continue; }
      grounded++;
      st.contact = true;
      const toi = hit.timeOfImpact;
      st.len = clamp(toi - SPEC.wheelR, 0.04, SPEC.rest);
      const comp = maxLen - toi;
      _cp.copy(_hp).addScaledVector(_up, -toi);
      const pv = b.velocityAtPoint({ x: _cp.x, y: _cp.y, z: _cp.z });
      _t.set(pv.x, pv.y, pv.z);
      const vn = _t.dot(_up);
      const Fs = clamp(SPEC.k * comp - SPEC.c * vn, 0, 42000);
      _f.copy(_up).multiplyScalar(Fs);
      b.addForceAtPoint({ x: _f.x, y: _f.y, z: _f.z }, { x: _hp.x, y: _hp.y, z: _hp.z }, true);
      const surf = this.ev.track.surfaceOf(hit.collider.handle);
      this.surface = surf;
      let mu = SPEC.mu[surf] || SPEC.mu.road;
      if (W.front) { _wf.copy(_fwd).multiplyScalar(ca).addScaledVector(_right, sa); _wr.copy(_right).multiplyScalar(ca).addScaledVector(_fwd, -sa); }
      else { _wf.copy(_fwd); _wr.copy(_right); }
      const vLong = _t.dot(_wf), vLat = _t.dot(_wr);
      let Flat = -vLat * share / dt * 0.3;
      let Flong = drive * (W.front ? 0.2 : 0.3) - vLong * 25;
      if (brakeF > 0) Flong -= Math.sign(vLong) * Math.min(brakeF / 4, Math.abs(vLong) * share / dt * 0.5);
      if (!W.front && c.handbrake) {
        mu *= 0.5;
        Flong = -Math.sign(vLong) * Math.min(5200, Math.abs(vLong) * share / dt * 0.5);
      }
      const maxF = mu * Fs;
      const tot = Math.hypot(Flat, Flong);
      let slip = 0;
      if (tot > maxF && tot > 0) { const k = maxF / tot; Flat *= k; Flong *= k; slip = 1 - k; }
      if (Math.abs(vLat) > 4) slip = Math.max(slip, Math.min(1, (Math.abs(vLat) - 4) / 8));
      slipMax = Math.max(slipMax, slip);
      _f.copy(_wr).multiplyScalar(Flat).addScaledVector(_wf, Flong);
      _cp.addScaledVector(_up, 0.3);
      b.addForceAtPoint({ x: _f.x, y: _f.y, z: _f.z }, { x: _cp.x, y: _cp.y, z: _cp.z }, true);
      st.spin += (vLong / SPEC.wheelR) * dt * (c.handbrake && !W.front ? 0.1 : 1);
      // marks and dust
      const fx = this.ev.fx;
      if (fx && slip > 0.35 && this.speed > 6 && surf === 'road') {
        _t.copy(_hp).addScaledVector(_up, -toi);
        if (st.skidFrom) fx.skidMark(st.skidFrom, _t);
        st.skidFrom = (st.skidFrom || new THREE.Vector3()).copy(_t);
      } else st.skidFrom = null;
      if (fx && surf !== 'road' && this.speed > 8 && Math.random() < 0.12) fx.dustAt(_cp, surf === 'grass' ? 0x8fae5c : 0xb08f62);
    }
    this.grounded = grounded;
    this.slip = slipMax;
    // aero drag and a touch of downforce
    const v2 = this.speed;
    b.addForce({ x: -this.vel.x * v2 * 0.42, y: -this.vel.y * v2 * 0.1, z: -this.vel.z * v2 * 0.42 }, true);
    if (grounded > 0) b.addForce({ x: -_up.x * v2 * v2 * 0.9, y: -_up.y * v2 * v2 * 0.9, z: -_up.z * v2 * v2 * 0.9 }, true);
    else {
      // airborne: gentle self-levelling so jumps land on wheels more often than not
      _t.crossVectors(_up, WORLD_UP).multiplyScalar(2600);
      const av = b.angvel();
      b.addTorque({ x: _t.x - av.x * 500, y: c.steer * -900, z: _t.z - av.z * 500 }, true);
    }
  }

  /** After world.step: detect hits from velocity jumps, landings, spins. */
  postStep(dt, simTime) {
    const lv = this.body.linvel();
    const dvx = lv.x - this.prevVel.x, dvy = lv.y - this.prevVel.y, dvz = lv.z - this.prevVel.z;
    this.prevVel.set(lv.x, lv.y, lv.z);
    if (this.grace > 0) { this.grace -= dt; this.impAcc.set(0, 0, 0); return; }
    const h = Math.hypot(dvx, dvz);
    if (h > 0.9) {
      // remember who we were touching on the first step of the hit: the cars bounce apart before it is resolved
      if (this.impAcc.lengthSq() === 0) this.impOther = this.ev.touching(this);
      this.impAcc.x += dvx; this.impAcc.z += dvz; this.impAcc.y += dvy; this.impT = 0.05;
    } else if (this.impT > 0) {
      this.impT -= dt;
      if (this.impT <= 0) { this.ev.resolveImpact(this, this.impAcc.clone(), this.impOther); this.impAcc.set(0, 0, 0); this.impOther = null; }
    }
    if (dvy > 4.5 && h < 2) this.ev.onLanding(this, dvy);
    // air time
    if (this.grounded === 0) this.airTime += dt;
    else if (this.airTime > 0) { if (this.airTime > 0.6) this.ev.onAir(this, this.airTime); this.airTime = 0; }
    // spins after being hit
    const av = this.body.angvel();
    if (this.lastHitBy && simTime - this.lastHitAt < 3.0) {
      this.spinAcc += av.y * dt;
      const turns = Math.abs(this.spinAcc);
      if (turns > Math.PI * 0.95 && this.spinAward < 1) { this.spinAward = 1; this.ev.award(this.lastHitBy, 4, 'SPIN 180', this); }
      if (turns > Math.PI * 1.9 && this.spinAward < 2) { this.spinAward = 2; this.ev.award(this.lastHitBy, 6, 'SPIN 360', this); }
      if (this.up.y < -0.3 && !this.rollAwarded) { this.rollAwarded = true; this.ev.award(this.lastHitBy, 8, 'ROLLOVER', this); }
    } else { this.spinAcc = 0; this.spinAward = 0; if (this.up.y > 0.5) this.rollAwarded = false; }
    if (this.up.y < 0.25 && this.speed < 4) this.flippedFor += dt; else this.flippedFor = 0;
  }

  // ------------------------------------------------ damage
  applyDamage(zone, amount, localPoint, localDir, simTime) {
    if (this.wrecked) return;
    const before = this.zone[zone];
    this.zone[zone] = Math.min(100, this.zone[zone] + amount * 1.35);
    const crit = before >= 100 ? 1.6 : 1;
    if (!this.invulnerable) this.hp = Math.max(0, this.hp - amount * crit);
    this.dent(localPoint, localDir, clamp(amount / 38, 0.06, 0.6));
    for (const part of this.parts) if (!part.gone && part.zone === zone && this.zone[zone] >= part.at) this.detach(part);
    if ((zone === 'L' || zone === 'R') && this.zone[zone] >= 92) {
      const w = WHEEL_POS.findIndex((W, i) => W.zone === zone && !this.wheelState[i].lost && Math.sign(W.z) === Math.sign(localPoint.z || 1));
      if (w >= 0 && !this.invulnerable) this.loseWheel(w);
    }
    if (this.hp <= 0 && !this.wrecked) this.ev.onWrecked(this, simTime);
  }

  dent(lp, ldir, depth) {
    const radius = 0.8 + depth * 1.2;
    for (const m of this.dentables) {
      const pos = m.geometry.attributes.position;
      const orig = m.userData.orig;
      const arr = pos.array;
      let moved = false;
      for (let i = 0; i < pos.count; i++) {
        const j = i * 3;
        const dx = arr[j] - lp.x, dy = arr[j + 1] - lp.y, dz = arr[j + 2] - lp.z;
        const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (d > radius) continue;
        const f = (1 - d / radius) ** 2 * depth * (0.8 + Math.random() * 0.4);
        arr[j] += ldir.x * f + (Math.random() - 0.5) * f * 0.3;
        arr[j + 1] += ldir.y * f + (Math.random() - 0.5) * f * 0.5 - f * 0.15;
        arr[j + 2] += ldir.z * f + (Math.random() - 0.5) * f * 0.3;
        // never crumple more than ~0.6 m from the factory shape
        const ox = arr[j] - orig[j], oy = arr[j + 1] - orig[j + 1], oz = arr[j + 2] - orig[j + 2];
        const ol = Math.sqrt(ox * ox + oy * oy + oz * oz);
        if (ol > 0.6) { const k = 0.6 / ol; arr[j] = orig[j] + ox * k; arr[j + 1] = orig[j + 1] + oy * k; arr[j + 2] = orig[j + 2] + oz * k; }
        moved = true;
      }
      if (moved) { pos.needsUpdate = true; m.geometry.computeVertexNormals(); }
    }
  }

  detach(part) {
    part.gone = true;
    const m = part.mesh;
    m.updateMatrixWorld(true);
    const wp = new THREE.Vector3(), wq = new THREE.Quaternion(), ws = new THREE.Vector3();
    m.matrixWorld.decompose(wp, wq, ws);
    this.root.remove(m);
    m.position.copy(wp); m.quaternion.copy(wq);
    const out = new THREE.Vector3(m.position.x - this.pos.x, 0, m.position.z - this.pos.z).normalize();
    this.ev.spawnDebris(m, part.size, wp, wq, this.vel.clone().multiplyScalar(0.6).addScaledVector(out, 4).add(new THREE.Vector3(0, 5 + Math.random() * 3, 0)));
    if (this.isPlayer) this.ev.popup(part.zone === 'F' ? (m === this.parts[0].mesh ? 'HOOD GONE!' : 'BUMPER OFF!') : part.zone === 'B' ? 'TRUNK TORN!' : 'DOOR RIPPED!', 'bad');
  }

  loseWheel(w) {
    const st = this.wheelState[w];
    if (st.lost) return;
    st.lost = true;
    const wh = this.wheels[w];
    wh.g.updateMatrixWorld(true);
    const wp = new THREE.Vector3(), wq = new THREE.Quaternion(), ws = new THREE.Vector3();
    wh.g.matrixWorld.decompose(wp, wq, ws);
    this.root.remove(wh.g);
    wh.g.position.copy(wp); wh.g.quaternion.copy(wq);
    const side = new THREE.Vector3(WHEEL_POS[w].x, 0, 0).applyQuaternion(this.quat).normalize();
    this.ev.spawnDebris(wh.g, [0.16, SPEC.wheelR, SPEC.wheelR], wp, wq, this.vel.clone().addScaledVector(side, 6).add(new THREE.Vector3(0, 4, 0)), true);
    if (this.isPlayer) this.ev.popup('LOST A WHEEL!', 'bad');
    this.ev.ticker(`${this.name} loses a wheel!`);
  }

  wreck() {
    this.wrecked = true;
    this.hp = 0;
    this.burn = 7;
    this.bodyMat = toon(0x2e2a2a);
    this.body3d.material = this.bodyMat;
    this.roof.material = this.bodyMat;
    for (const p of this.parts) if (!p.gone) p.mesh.material = this.bodyMat;
    if (this.marker) this.marker.visible = false;
  }

  repair(amount) {
    this.hp = Math.min(100, this.hp + amount);
    for (const z of ZONES) this.zone[z] = Math.max(0, this.zone[z] - amount * 1.2);
    // straighten the panels a little each tick
    for (const m of this.dentables) {
      const arr = m.geometry.attributes.position.array, orig = m.userData.orig;
      for (let i = 0; i < arr.length; i++) arr[i] = lerp(arr[i], orig[i], 0.06);
      m.geometry.attributes.position.needsUpdate = true;
      m.geometry.computeVertexNormals();
    }
  }

  // ------------------------------------------------ visuals
  syncMesh() {
    this.root.position.copy(this.pos);
    this.root.quaternion.copy(this.quat);
  }
  update(dt, time) {
    this.syncMesh();
    for (let w = 0; w < 4; w++) {
      const st = this.wheelState[w];
      if (st.lost) continue;
      const wh = this.wheels[w];
      wh.g.position.y = -st.len;
      wh.g.rotation.y = WHEEL_POS[w].front ? this.steer * 0.5 : 0;
      wh.spin.rotation.x = st.spin;
    }
    if (this.marker) { this.marker.position.y = 2.0 + Math.sin(time * 4) * 0.15; this.marker.rotation.y += dt * 2; }
    // smoke and fire grow as the car falls apart
    const fx = this.ev.fx;
    this.smokeT -= dt;
    const hood = _t.set(0, 0.5, 1.6).applyQuaternion(this.quat).add(this.pos);
    if (this.wrecked) {
      if (this.burn > 0) {
        this.burn -= dt;
        if (Math.random() < 0.7) fx.fireAt(_t.set(rand(-0.6, 0.6), 0.7, rand(-1.5, 1.5)).applyQuaternion(this.quat).add(this.pos), 1.4);
      }
      if (this.smokeT <= 0) { this.smokeT = 0.12; fx.smokeAt(hood, true, 1.5); }
    } else if (this.hp < 70 && this.smokeT <= 0) {
      this.smokeT = this.hp < 35 ? 0.06 : 0.18;
      fx.smokeAt(hood, this.hp < 35, this.hp < 35 ? 1.1 : 0.7);
      if (this.hp < 22 && Math.random() < 0.4) fx.fireAt(hood, 0.7);
    }
  }

  dispose() {
    this.ev.scene.remove(this.root);
    this.root.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  }
}

// ---------------------------------------------------------------- AI drivers
const _a1 = new THREE.Vector3(), _a2 = new THREE.Vector3(), _a3 = new THREE.Vector3();

/** Signed steering angle (+ = right) from the car's heading to a world point. */
function steerTo(car, target) {
  _a1.subVectors(target, car.pos);
  _a1.y = 0;
  _a2.set(-1, 0, 0).applyQuaternion(car.quat); // right
  const f = car.fwd;
  const x = _a1.dot(_a2), z = _a1.x * f.x + _a1.z * f.z;
  return Math.atan2(x, z);

class Driver {
  constructor(car, ev) {
    this.car = car;
    this.ev = ev;
    this.lane = rand(-0.28, 0.28);
    this.laneT = rand(2, 6);
    this.stuck = 0;
    this.reverseT = 0;
    this.revSteer = 0;
    this.target = null;
    this.retargetT = 0;
    this.retreatT = 0;
    this.ramT = 0;
    this.pitting = false;
    this.huntT = 0;
    this.huntCool = rand(2, 5);
    this.cheat = false; // attract mode: the demo driver never gives up
  }

  update(dt) {
    const car = this.car;
    const c = car.ctrl;
    if (car.wrecked) { c.throttle = 0; c.brake = 0; c.steer = 0; return; }
    if (this.reverseT > 0) {
      this.reverseT -= dt;
      c.throttle = 0; c.brake = 1; c.handbrake = false; c.steer = this.revSteer;
      return;
    }
    if (this.ev.track.isBowl) this.derby(dt);
    else this.race(dt);
    // stuck against something: back out with the wheel turned the other way
    if (c.throttle > 0.5 && car.speed < 1.6 && car.grounded > 0) this.stuck += dt; else this.stuck = Math.max(0, this.stuck - dt * 2);
    if (this.stuck > 1.3) { this.stuck = 0; this.reverseT = rand(0.8, 1.5); this.revSteer = -Math.sign(c.steer || 1); }
  }

  race(dt) {
    const car = this.car, ev = this.ev, tr = ev.track, c = car.ctrl;
    const loc = tr.locate(car.pos, car.trackIdx);
    this.laneT -= dt;
    if (this.laneT <= 0) { this.laneT = rand(3, 7); this.lane = rand(-0.3, 0.3); }
    const speed = Math.max(car.speedFwd, 0);
    const look = 7 + speed * 0.55;
    const ahead = Math.round(look / tr.spacing);
    const ti = (loc.i + ahead) % tr.N;
    const s = tr.samples[ti];
    let lateral = this.lane * tr.width;
    // pit stop when the car is badly hurt and there are laps left
    const P = tr.pit;
    if (P && !car.finished) {
      if (!this.pitting && car.hp < 38 && car.lap < ev.laps - 0 && ev.mode !== 'trial') {
        const dA = (P.a - loc.i + tr.N) % tr.N;
        if (dA < 40 && dA > 6) this.pitting = true;
      }
      if (this.pitting) {
        const pi = clamp(ti, P.a, P.b);
        if (loc.i >= P.a - 12 && loc.i <= P.b) lateral = lerp(lateral, P.lateral, tr.pitTaper(pi));
        if (car.hp > 88 || (loc.i > P.boxB + 2 && loc.i < P.b + 30)) this.pitting = false;
      }
    }
    if (!this.pitting) lateral = clamp(lateral, -tr.width / 2 + 2.2, tr.width / 2 - 2.2);
    const target = _a2.copy(s.p).addScaledVector(s.r, lateral);
    // wrecking: now and then, take a swipe at a nearby rival's rear quarter
    this.huntCool -= dt;
    if (this.huntT > 0) this.huntT -= dt;
    else if (this.huntCool <= 0) { this.huntCool = rand(2.5, 5); if (Math.random() < car.aggression * 0.5) this.huntT = rand(1.2, 2.4); }
    if (ev.wrecking && !this.pitting && this.huntT > 0 && ev.simTime - ev.raceStart > 6) {
      const prey = this.findPrey(26, 0.6);
      if (prey) {
        const aim = prey.pos.clone().addScaledVector(prey.vel, 0.25).addScaledVector(prey.fwd, -1.6);
        target.lerp(aim, 0.75);
      }
    }
    let ang = steerTo(car, target);
    // speed from the sharpest bend coming up
    let k = 0;
    const span = Math.round((18 + speed * 1.6) / tr.spacing);
    for (let j = 2; j < span; j += 2) k = Math.max(k, tr.absK[(loc.i + j) % tr.N]);
    let vT = Math.min(SPEC.vmax, Math.sqrt(11.5 * car.skill / Math.max(k, 0.0008)));
    if (this.pitting) {
      const inBox = loc.i >= P.boxA - 2 && loc.i <= P.boxB;
      const nearBox = loc.i >= P.a - 8 && loc.i < P.boxA;
      if (inBox && car.hp < 88) vT = 0; else if (nearBox || inBox) vT = 9;
    }
    if (ev.state === 'finished' && car.finished) vT = 12;
    c.steer = clamp(ang * 2.4, -1, 1);
    c.handbrake = false;
    if (speed < vT - 1) { c.throttle = 1; c.brake = 0; }
    else if (speed > vT + 2.5) { c.throttle = 0; c.brake = clamp((speed - vT) / 8, 0.2, 1); }
    else { c.throttle = 0.35; c.brake = 0; }
    if (this.pitting && vT === 0 && speed < 1.2) { c.throttle = 0; c.brake = 0; }
    // wrong way (after a spin): turn round hard
    if (Math.abs(ang) > 1.9 && speed < 8) { c.steer = Math.sign(ang); c.throttle = 0.6; }

  findPrey(range, cone) {
    let best = null, bd = range;
    for (const o of this.ev.cars) {
      if (o === this.car || o.wrecked) continue;
      const d = o.pos.distanceTo(this.car.pos);
      if (d > bd) continue;
      const a = Math.abs(steerTo(this.car, o.pos));
      if (a > cone) continue;
      bd = d; best = o;
    }
    return best;
  }

  derby(dt) {
    const car = this.car, ev = this.ev, c = car.ctrl;
    const B = ev.track.bowl;
    this.retargetT -= dt;
    if (!this.target || this.target.wrecked || this.retargetT <= 0) {
      this.retargetT = rand(4, 7);
      let best = null, bs = Infinity;
      for (const o of ev.cars) {
        if (o === car || o.wrecked) continue;
        // prefer someone at run-up distance, the wounded, and (sometimes) the player
        let score = Math.abs(o.pos.distanceTo(car.pos) - 28) + o.hp * 0.12 + rand(0, 14);
        if (o.isPlayer && !ev.attract) score -= 14 * ev.playerFocus;
        if (o === this.lastTarget) score += 10;
        if (score < bs) { bs = score; best = o; }

    }

    if (this.phase === 'charge' && car.speed < 5 && this.target && this.target.pos.distanceTo(car.pos) < 6) this.shove = (this.shove || 0) + dt;
    else this.shove = 0;
    if (this.shove > 0.8) this.onHit();
    if (this.retreatT > 0) {
      this.retreatT -= dt;
      c.throttle = 0; c.brake = 1; c.handbrake = false;
      c.steer = this.revSteer;
      if (this.retreatT <= 0) {
        // reposition: a spot on the far side of the arena from the target
        this.phase = 'reposition';
        this.repoT = 3.2;
        const away = this.target ? car.pos.clone().sub(this.target.pos).setY(0).normalize() : new THREE.Vector3(1, 0, 0);
        const ang = Math.atan2(away.z, away.x) + rand(-0.7, 0.7);

      c.throttle = 0; c.brake = 1; c.steer = -Math.sign(ang); c.handbrake = false;

    }
    c.steer = clamp(ang * 2.2, -1, 1);
    c.throttle = Math.abs(ang) > 1.2 ? 0.7 : 1;
    c.brake = 0;
    c.handbrake = Math.abs(ang) > 1.1 && car.speed > 13;
  }

  /** Called when this car lands a hit: back off and line up another run. */
  onHit() {
    if (!this.ev.track.isBowl || this.retreatT > 0) return;
    this.retreatT = rand(1.0, 1.8);
    this.revSteer = rand(-1, 1);
    this.shove = 0;
  }
}

  roll: ['Over she goes! Rubber side up!', 'Rolled it! Unbelievable!'],
  wreck: ['Totaled! Call the tow truck!', 'That car is scrap metal now!', 'Wrecked! Send flowers to the insurance man!'],
  aiWreck: ['{name} is out! Smoke, fire, the works!', 'And {name} is going home on a trailer!'],
  playerWrecked: ['Oh no, you are wrecked! That is gonna cost you!', 'Smoke, fire, and one very sad driver!'],
  bigHit: ['What a hit!', 'That is gonna leave a mark!', 'Crunch time!'],
  air: ['Big air!', 'Look at that thing fly!'],
  finalLap: ['Final lap! Hang on to your bumpers!'],
  win: ['Checkered flag! What a drive!', 'Winner, winner, wrecked dinner!'],
  finish: ['Across the line! Not pretty, but it counts!'],
  pit: ['Into the pits for some panel beating!'],
  survivor: ['Last car running! The Bowl belongs to you!'],
  timeup: ['Time! Put down the wrenches!'],
};

const Announcer = {
  busyUntil: 0, hideT: null, last: {},
  say(cat, vars = {}, force = false) {
    const now = nowMs();
    if (!force && now < this.busyUntil) return;
    const list = LINES[cat];
    if (!list) return;
    let line = pick(list);
    if (list.length > 1 && line === this.last[cat]) line = list[(list.indexOf(line) + 1) % list.length];
    this.last[cat] = line;
    for (const k in vars) line = line.replace('{' + k + '}', vars[k]);
    const dur = Audio.speak(line, { pitch: 140, excite: cat === 'go' || cat === 'spin360' || cat === 'roll' ? 1.25 : 1.08 });
    this.busyUntil = now + dur * 1000 + 600;
    const el = $('#subs');
    if (Settings.data.subtitles) {
      el.innerHTML = `<b>BUCK RIVETS:</b> ${escapeText(line)}`;
      el.style.display = 'block';
      clearTimeout(this.hideT);
      this.hideT = setTimeout(() => (el.style.display = 'none'), dur * 1000 + 900);
    }
  },
  clear() { clearTimeout(this.hideT); $('#subs').style.display = 'none'; this.busyUntil = 0; },
};

// ---------------------------------------------------------------- camera
class CamRig {
  constructor() {
    this.mode = Settings.data.camera;
    this.shake = 0;
    this.yaw = 0;
    this.orbitYaw = 0;
    this.tvT = 0;
    this.tvCar = null;
    this.tvPos = new THREE.Vector3();
    this.look = new THREE.Vector3();
    this.pos = new THREE.Vector3(0, 30, 60);
    this.fresh = true;
  }
  cycle() {
    const order = ['chase', 'far', 'hood'];
    this.mode = order[(order.indexOf(this.mode) + 1) % order.length];
    toast(`Camera: ${this.mode.toUpperCase()}`);
  }
  update(dt, ev, style) {
    const cam = R.camera;
    const time = ev.simTime + ev.realT;
    if (style === 'orbit') {
      const center = ev.track.isBowl ? new THREE.Vector3(0, 2, 0) : ev.track.samples[ev.track.N - 12].p;
      const r = ev.track.isBowl ? 95 : 40;
      const a = time * 0.12;
      this.pos.set(center.x + Math.cos(a) * r, center.y + (ev.track.isBowl ? 34 : 14), center.z + Math.sin(a) * r);
      this.look.copy(center);
    } else if (style === 'tv') {
      this.tvT -= dt;
      if (this.tvT <= 0 || !this.tvCar || (this.tvCar.wrecked && this.tvT < 2)) {
        const pool = ev.cars.filter((c) => !c.wrecked);
        this.tvCar = ev.hotCar && !ev.hotCar.wrecked && Math.random() < 0.6 ? ev.hotCar : pick(pool.length ? pool : ev.cars);
        this.tvT = rand(3.5, 6);
        const ang = rand(0, TAU);
        this.tvPos.copy(this.tvCar.pos).add(new THREE.Vector3(Math.cos(ang) * 16, rand(3, 9), Math.sin(ang) * 16)).addScaledVector(this.tvCar.vel, 1.2);
        if (this.tvPos.y < 2) this.tvPos.y = 2;
      }
      this.pos.copy(this.tvPos);
      this.look.lerp(this.tvCar.pos, this.fresh ? 1 : 1 - Math.exp(-8 * dt));
    } else {
      const car = ev.focus;
      const carYaw = Math.atan2(car.fwd.x, car.fwd.z);
      if (this.fresh) this.yaw = carYaw;
      let dy = carYaw - this.yaw;
      while (dy > Math.PI) dy -= TAU;
      while (dy < -Math.PI) dy += TAU;
      this.yaw += dy * (1 - Math.exp(-(car.up.y < 0.3 ? 1 : 5) * dt));
      this.orbitYaw = damp(this.orbitYaw, Input.lookX * 2.6, 6, dt);
      const back = Input.lookBack && ev.player === car ? Math.PI : 0;
      const yaw = this.yaw + this.orbitYaw + back;
      if (this.mode === 'hood') {
        const off = new THREE.Vector3(0, 0.98, back ? -1.6 : 0.2).applyQuaternion(car.quat);
        this.pos.copy(car.pos).add(off);
        const dir = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
        this.look.copy(this.pos).addScaledVector(dir, 12).addScaledVector(car.up, -0.4);
      } else {
        const far = this.mode === 'far';
        const dist = far ? 12 : 7.2, hgt = (far ? 4.6 : 2.7) + Input.lookY * -2;
        const want = new THREE.Vector3(car.pos.x - Math.sin(yaw) * dist, car.pos.y + hgt, car.pos.z - Math.cos(yaw) * dist);
        if (this.fresh) this.pos.copy(want);
        else this.pos.lerp(want, 1 - Math.exp(-7 * dt));
        if (this.pos.y < car.pos.y + 0.8) this.pos.y = car.pos.y + 0.8;
        const lookAt = new THREE.Vector3(car.pos.x + Math.sin(yaw) * 3, car.pos.y + 1.1, car.pos.z + Math.cos(yaw) * 3);
        this.look.copy(lookAt);
      }
    }
    this.fresh = false;
    cam.position.copy(this.pos);
    if (this.shake > 0.001) {
      cam.position.x += (Math.random() - 0.5) * this.shake;
      cam.position.y += (Math.random() - 0.5) * this.shake;
      cam.position.z += (Math.random() - 0.5) * this.shake;
      this.shake *= Math.exp(-7 * dt);
    }
    cam.lookAt(this.look);
    const sp = ev.focus ? ev.focus.speed : 0;
    cam.fov = damp(cam.fov, style === 'chase' && this.mode !== 'hood' ? 66 + sp * 0.32 : 62, 3, dt);
    cam.updateProjectionMatrix();
    // keep the sun's shadow box around what we're looking at
    R.sun.position.set(this.look.x + 70, this.look.y + 120, this.look.z + 45);
    R.sun.target.position.copy(this.look);
  }
}

// ---------------------------------------------------------------- an event: one race or one derby
class Event {
  constructor(cfg) {
    this.cfg = cfg;
    this.mode = cfg.mode;
    this.M = MODES[cfg.mode];
    this.wrecking = this.M.wrecking;
    this.attract = !!cfg.attract;
    this.backdrop = !!cfg.backdrop;
    this.session = !!cfg.session;
    this.scene = R.scene;
    this.fx = R.fx;
    this.fx.clear();
    this.world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
    this.world.timestep = 1 / 120;
    this.track = new Track(trackDef(cfg.track), this.world, this.scene);
    this.laps = cfg.laps || trackDef(cfg.track).laps || 3;
    this.timeLimit = cfg.time || 150;
    this.simTime = 0;
    this.realT = 0;
    this.acc = 0;
    this.state = this.backdrop || this.attract ? 'race' : this.session ? 'ready' : 'intro';
    this.stateT = 0;
    this.finishCount = 0;
    this.excite = 0.3;
    this.debris = [];
    this.hotCar = null;
    this.paused = false;
    this.results = null;
    this.over = false;
    this.cam = new CamRig();
    const diff = { easy: 0.9, normal: 0.97, hard: 1.03 }[Settings.data.difficulty] || 0.97;
    const div = cfg.division || 4;
    this.aiSpeed = diff + (4 - div) * 0.025;
    this.playerFocus = (Settings.data.difficulty === 'hard' ? 0.8 : Settings.data.difficulty === 'easy' ? 0.25 : 0.5) + (4 - div) * 0.1;
    this.damageMul = { easy: 0.7, normal: 1, hard: 1.2 }[Settings.data.difficulty] || 1;
    // cars
    const n = this.mode === 'trial' ? 1 : (cfg.opponents ?? 11) + 1;
    const total = this.backdrop ? 8 : n;
    this.cars = [];
    this.drivers = new Map();
    const order = [];
    for (let k = 0; k < total; k++) order.push(k);
    const playerSlot = this.backdrop ? -1 : this.mode === 'trial' ? 0 : (cfg.gridSlot ?? Math.min(total - 1, Math.floor(total * 0.6)));
    let ai = 0;
    for (let k = 0; k < total; k++) {
      const isPlayer = k === playerSlot;
      const look = isPlayer ? { ...PLAYER_LOOK, name: cfg.playerName || 'YOU' } : ROSTER[ai++ % ROSTER.length];
      const car = new Car(this, k, { ...look, isPlayer, skill: isPlayer ? 1 : rand(0.92, 1.0), aggression: isPlayer ? 0 : clamp(rand(0.25, 0.8) + (4 - div) * 0.08, 0, 1), invulnerable: isPlayer && this.attract });
      const [p, q] = this.track.gridSlot(k, total);
      car.spawn(p, q);
      this.cars.push(car);
      if (isPlayer) this.player = car;
      if (!isPlayer || this.attract) {
        const d = new Driver(car, this);
        if (isPlayer) d.cheat = true;
        this.drivers.set(car, d);
      }
    }
    this.focus = this.player || this.cars[0];
    if (!this.track.isBowl) for (const c of this.cars) c.trackIdx = this.track.locate(c.pos).i;
    this.raceStart = 0;
    this.buildMinimap();
    if (!this.backdrop && !this.attract && !this.session) {
      $('#banner').innerHTML = `${escapeText(this.track.def.name.toUpperCase())}<small>${escapeText(this.M.name.toUpperCase())}${this.M.race ? ` · ${this.laps} LAPS` : ` · ${fmtTime(this.timeLimit)}`}</small>`;
      setTimeout(() => Announcer.say(this.track.isBowl ? 'derbyStart' : this.mode === 'trial' ? 'trialStart' : 'start', { track: this.track.def.name }, true), 400);
    }
    if (this.track.setStartLights) this.track.setStartLights(0, false);
  }

  get cameraStyle() {
    if (this.backdrop) return 'orbit';
    if (this.attract) return Math.floor(this.realT / 7) % 2 ? 'tv' : 'chase';
    if (this.state === 'intro' || this.state === 'ready') return 'orbit';
    if (this.state === 'finished' && (this.player.wrecked || this.player.finished)) return 'tv';
    return 'chase';
  }
  get racing() { return this.state === 'race' || this.state === 'finished'; }

  // ------------------------------------------------ main update
  update(dt) {
    this.realT += dt;
    if (this.paused) return;
    this.stateT += dt;
    this.updateState(dt);
    // player input
    const p = this.player;
    if (p && !this.drivers.has(p)) {
      const live = this.state === 'race' && !this.over && !(this.session && AIHub.time() < 0);
      if (live) {
        p.ctrl.steer = Input.steer; p.ctrl.throttle = Input.throttle; p.ctrl.brake = Input.brake; p.ctrl.handbrake = Input.handbrake;
        if (Input.reset) this.tryRecover(p, true);
        if (Input.horn) Audio.horn();
      } else if (this.state === 'finished' || this.over) { p.ctrl.steer = 0; p.ctrl.throttle = 0; p.ctrl.brake = 1; p.ctrl.handbrake = false; }
      else { p.ctrl.steer = Input.steer; p.ctrl.throttle = 0; p.ctrl.brake = 0; p.ctrl.handbrake = true; }
      if (Input.camera) this.cam.cycle();
    }
    const simulate = this.racing || this.state === 'intro' || this.state === 'countdown' || this.state === 'ready';
    const aiLive = this.racing;
    if (simulate) {
      for (const [car, d] of this.drivers) {
        if (aiLive) d.update(dt);
        else { car.ctrl.throttle = 0; car.ctrl.brake = 0; car.ctrl.handbrake = true; car.ctrl.steer = 0; }
      }
      const h = this.world.timestep;
      this.acc += Math.min(dt, 0.05);
      let n = 0;
      while (this.acc >= h && n < 6) {
        for (const c of this.cars) c.step(h);
        this.world.step();
        for (const c of this.cars) c.postStep(h, this.simTime);
        this.acc -= h;
        n++;
        if (aiLive) this.simTime += h;
      }
    }
    for (const c of this.cars) {
      c.update(dt, this.realT);
      if (aiLive && !this.track.isBowl) this.progressOf(c);
      if (aiLive) this.carChecks(c, dt);
    }
    this.updateDebris(dt);
    this.fx.update(dt);
    this.excite = damp(this.excite, 0.25, 0.4, dt);
    this.track.updateCrowd(this.realT, this.excite);
    this.cam.update(dt, this, this.cameraStyle);
    if (!this.backdrop) this.updateAudio(dt);
  }

  updateState(dt) {
    const s = this.state;
    if (s === 'intro') {
      if (this.stateT > 4.2 || Input.confirm) this.setState('countdown');
    } else if (s === 'ready') {
      const t = AIHub.time();
      if (t > -Infinity) {
        const left = Math.ceil(-t / 1000);
        $('#count').textContent = left > 0 && left <= 3 ? String(left) : '';
        if (left > 0 && left <= 3 && this.lastBeep !== left) { this.lastBeep = left; Audio.beep(false); if (this.track.setStartLights) this.track.setStartLights(4 - left, false); }
        if (t >= 0) this.go();
      }
    } else if (s === 'countdown') {
      const left = 3 - Math.floor(this.stateT);
      if (this.lastBeep !== left && left > 0) { this.lastBeep = left; Audio.beep(false); $('#count').textContent = String(left); this.track.setStartLights?.(4 - left, false); }
      if (this.stateT >= 3) this.go();
    } else if (s === 'race') {
      if (this.stateT > 1 && this.stateT < 1.2) $('#count').textContent = '';
      if (this.track.isBowl) {
        const alive = this.cars.filter((c) => !c.wrecked);
        if (!this.backdrop && !this.attract) {
          if (this.simTime >= this.timeLimit) this.endDerby('time');
          else if (alive.length <= 1) this.endDerby('last');
          else if (this.player.wrecked && this.player.wreckedAt !== undefined && this.simTime - this.player.wreckedAt > 4) this.endDerby('wrecked');
        }
      } else if (!this.backdrop && !this.attract) {
        if (this.player.wrecked && this.simTime - this.player.wreckedAt > 4.5) this.setState('finished');
      }
    } else if (s === 'finished') {
      const allDone = this.cars.every((c) => c.finished || c.wrecked);
      if (this.stateT > 8 || (allDone && this.stateT > 3)) this.complete();
    }
  }

  setState(s) {
    this.state = s;
    this.stateT = 0;
    if (s === 'countdown') { $('#banner').innerHTML = ''; this.cam.fresh = true; this.lastBeep = null; }
    if (s === 'finished') this.cam.tvT = 0;
  }

  go() {
    this.setState('race');
    this.raceStart = this.simTime;
    $('#count').textContent = 'GO!';
    $('#banner').innerHTML = '';
    this.cam.fresh = true;
    Audio.beep(true);
    this.track.setStartLights?.(3, true);
    Announcer.say('go', {}, true);
    Audio.cheer(1);
    this.excite = 1;
    Music.play(this.track.isBowl ? 'derby' : 'race');
  }

  // ------------------------------------------------ laps & positions
  progressOf(car) {
    const tr = this.track;
    const loc = tr.locate(car.pos, car.trackIdx);
    const prev = car.trackIdx;
    car.trackIdx = loc.i;
    car.loc = loc;
    if (prev >= 0 && !car.finished) {
      const N = tr.N;
      if (prev > N * 0.8 && loc.i < N * 0.2) this.onLine(car);
      else if (prev < N * 0.2 && loc.i > N * 0.8) car.lap--;
    }
    car.progress = car.lap * tr.N + loc.i;
    // pit repairs
    if (tr.pit && !car.wrecked && tr.inPitBox(loc) && car.speed < 4 && car.hp < 100) {
      if (!car.repairing) {
        car.repairing = true;
        car.stats.repairs++;
        if (car.isPlayer) { Announcer.say('pit'); this.popup('PIT STOP', 'hot', 'repairing...'); }
      }
      car.repair(24 * (1 / 60));
      if (car.isPlayer && Math.random() < 0.25) Audio.repairTick();
      if (Math.random() < 0.2) this.fx.sparksAt(_v1.copy(car.pos).setY(car.pos.y + 0.6), _v2.set(0, 1, 0), 2, 3);
    } else car.repairing = false;
  }

  onLine(car) {
    car.lap++;
    if (car.lap > car.maxLapSeen) {
      car.maxLapSeen = car.lap;
      if (car.lap >= 2) {
        const lt = this.simTime - car.lapStart;
        car.lastLap = lt;
        if (lt < car.bestLap) car.bestLap = lt;
        if (car.isPlayer) {
          const key = this.track.id;
          const prevBest = Progress.data.bestLaps[key] ?? Infinity;
          if (lt < prevBest && !this.session && !this.attract) {
            Progress.data.bestLaps[key] = lt;
            Progress.save();
            if (isFinite(prevBest)) this.popup('NEW LAP RECORD', 'hot', fmtLap(lt));
          }
        }
      }
      car.lapStart = this.simTime;
      if (car.lap > this.laps) this.finishCar(car);
      else if (car.isPlayer && car.lap === this.laps && this.laps > 1) { Announcer.say('finalLap', {}, true); this.popup('FINAL LAP', 'hot'); }
    }
  }

  finishCar(car) {
    if (car.finished || this.backdrop || this.attract) return;
    car.finished = true;
    car.finishTime = this.simTime - this.raceStart;
    car.finishPos = ++this.finishCount;
    if (car.isPlayer) {
      Announcer.say(car.finishPos === 1 ? 'win' : 'finish', {}, true);
      this.popup(car.finishPos === 1 ? 'WINNER!' : `FINISHED P${car.finishPos}`, 'hot');
      Audio.cheer(1.2);
      this.setState('finished');
    } else this.ticker(`${car.name} finishes P${car.finishPos}`);
  }

  ranking() {
    if (this.track.isBowl) return [...this.cars].sort((a, b) => (b.points - a.points) || (a.wrecked - b.wrecked) || (b.hp - a.hp));
    return [...this.cars].sort((a, b) => {
      if (a.finished && b.finished) return a.finishPos - b.finishPos;
      if (a.finished !== b.finished) return a.finished ? -1 : 1;
      if (a.wrecked !== b.wrecked) return a.wrecked ? 1 : -1;
      return b.progress - a.progress;
    });
  }

  // ------------------------------------------------ per-car checks
  carChecks(car, dt) {
    if (car.pos.y < -15) this.tryRecover(car, false, true);
    if (car.flippedFor > (car.isPlayer && !this.drivers.has(car) ? 6 : 2.6) && !car.wrecked) this.tryRecover(car, false, true);
    if (this.drivers.get(car)?.cheat && car.hp < 40) car.repair(60);
  }
  tryRecover(car, manual, force) {
    if (car.wrecked) return;
    const now = this.simTime;
    if (!force) {
      if (car.recoverAt && now - car.recoverAt < 2.5) return;
      if (!(car.flippedFor > 0.4 || car.speed < 3 || car.up.y < 0.5)) { if (manual) toast('Recover works when you are stuck or flipped'); return; }
    }
    car.recoverAt = now;
    const [p, q, idx] = this.track.recoverSpot(car.pos, car.trackIdx);
    // nudge sideways if another car is sitting on the spot
    for (const o of this.cars) if (o !== car && o.pos.distanceTo(p) < 4) p.y += 2.5;
    car.place(p, q);
    if (idx >= 0) car.trackIdx = idx;
    if (car.isPlayer) this.popup('RECOVERED', '', '');
  }

  // ------------------------------------------------ collisions & scoring
  touching(car) {
    let best = null, bd = 7.5;
    for (const o of this.cars) {
      if (o === car) continue;
      const d = o.pos.distanceTo(car.pos);
      if (d > bd) continue;
      let hit = false;
      for (const a of [car.col, car.colTop]) for (const b of [o.col, o.colTop]) this.world.contactPair(a, b, (m) => { if (m.numContacts() > 0) hit = true; });
      if (hit || d < 4.2) { bd = d; best = o; }
    }
    return best;
  }

  resolveImpact(car, dv, partner) {
    const mag = Math.hypot(dv.x, dv.z) + Math.abs(dv.y) * 0.2;
    if (mag < 1.4) return;
    const inv = car.quat.clone().invert();
    const src = new THREE.Vector3(-dv.x, 0, -dv.z).applyQuaternion(inv);
    src.y = 0;
    if (src.lengthSq() < 1e-6) return;
    src.normalize();
    const zone = Math.abs(src.z) * 0.8 > Math.abs(src.x) ? (src.z > 0 ? 'F' : 'B') : (src.x > 0 ? 'L' : 'R');
    const other = partner !== undefined ? partner : this.touching(car);
    const world = new THREE.Vector3();
    const k = Math.min(0.93 / Math.max(Math.abs(src.x), 1e-3), 2.25 / Math.max(Math.abs(src.z), 1e-3));
    const lp = new THREE.Vector3(src.x * k, rand(-0.1, 0.35), src.z * k);
    world.copy(lp).applyQuaternion(car.quat).add(car.pos);
    const near = this.focus ? clamp(1 - world.distanceTo(R.camera.position) / 90, 0, 1) : 0;
    const pan = clamp(new THREE.Vector3().subVectors(world, R.camera.position).normalize().dot(new THREE.Vector3(1, 0, 0).applyQuaternion(R.camera.quaternion)), -1, 1);
    const dirOut = new THREE.Vector3().subVectors(world, car.pos).normalize();
    if (mag < 3.4) {
      if (near > 0.1 && !this.backdrop) Audio.scrape(near, pan);
      this.fx.sparksAt(world, dirOut, 3, 5);
      return;
    }
    const zoneMul = { F: 0.5, B: 0.85, L: 1.1, R: 1.1 }[zone];
    let amount = (mag - 3.4) * 2.2 * zoneMul * (other ? 1 : 0.6);
    if (this.track.isBowl) amount *= 1.3; // derby cars are built to be broken
    if (car.isPlayer && !this.drivers.has(car)) amount *= this.damageMul;
    amount = Math.min(amount, 34);
    const ldir = src.clone().negate();
    ldir.y = -0.2;
    car.applyDamage(zone, amount, lp, ldir, this.simTime);
    this.fx.sparksAt(world, dirOut, Math.min(30, Math.round(mag * 2)), 7 + mag * 0.4);
    if (amount > 7) this.fx.chipsAt(world, car.color, Math.min(14, Math.round(amount / 3)));
    if (near > 0.02 && !this.backdrop) Audio.crash(clamp(mag / 18, 0.1, 1) * (0.3 + near * 0.7), pan, true);
    this.excite = Math.min(1.5, this.excite + mag * 0.04);
    if (amount > 6) this.hotCar = car;
    if (car === this.focus || other === this.focus) this.cam.shake = Math.min(1.2, this.cam.shake + mag * 0.045);
    if (car.isPlayer && !this.drivers.has(car)) {
      Input.rumble(clamp(mag / 14, 0.2, 1), 120 + mag * 15);
      if (amount > 22) Announcer.say('bigHit');
    }
    if (other) {
      if (zone !== 'F') {
        car.lastHitBy = other;
        car.lastHitAt = this.simTime;
        car.spinAcc = 0; car.spinAward = 0;
        if (amount > 10) { other.stats.hits++; this.award(other, 1, 'HIT', car, true); }
      } else {
        this.drivers.get(car)?.onHit();
        if (other.isPlayer && !this.drivers.has(other)) Input.rumble(0.5, 120);
      }
    }
  }

  award(car, pts, label, victim, quiet) {
    if (!this.wrecking || this.state !== 'race' || car === victim || car.wrecked && label !== 'WRECKED') return;
    if (this.attract || this.backdrop) { car.points += pts; return; }
    car.points += pts;
    if (label.startsWith('SPIN')) car.stats.spins++;
    if (label === 'ROLLOVER') car.stats.rolls++;
    if (car.isPlayer) {
      if (!quiet) {
        this.popup(label, 'hot', `+${pts}`);
        Audio.points();
        if (label === 'SPIN 180') Announcer.say('spin');
        else if (label === 'SPIN 360') Announcer.say('spin360');
        else if (label === 'ROLLOVER') Announcer.say('roll');
      } else this.popup('HIT', '', `+${pts}`);
    } else if (victim && victim.isPlayer && !quiet) this.ticker(`${car.name}: ${label} on you`);
  }

  onWrecked(car, t) {
    car.wreck();
    car.wreckedAt = this.simTime;
    this.fx.explosion(car.pos);
    const near = clamp(1 - car.pos.distanceTo(R.camera.position) / 140, 0.15, 1);
    if (!this.backdrop) Audio.explosion(0, near);
    if (car === this.focus) this.cam.shake = 1.5;
    this.excite = 1.5;
    const attacker = car.lastHitBy && t - car.lastHitAt < 6 && car.lastHitBy !== car ? car.lastHitBy : null;
    if (attacker) { this.award(attacker, 10, 'WRECKED', car); attacker.stats.wrecks++; }
    if (this.backdrop) return;
    Audio.cheer(1.3);
    this.ticker(`${car.name} WRECKED${attacker ? ` by ${attacker.name}` : ''}!`);
    if (car.isPlayer && !this.attract) {
      this.popup("YOU'RE WRECKED!", 'bad');
      Announcer.say('playerWrecked', {}, true);
      Input.rumble(1, 600);
      if (this.session) this.report('wrecked');
    } else if (!attacker || !attacker.isPlayer) Announcer.say('aiWreck', { name: car.name });
    else Announcer.say('wreck');
  }

  onLanding(car, dvy) {
    if (car.isPlayer && !this.backdrop) { Audio.thud(clamp(dvy / 12, 0.2, 1)); Input.rumble(0.4, 90); if (car === this.focus) this.cam.shake += 0.25; }
    if (dvy > 11) car.applyDamage('B', (dvy - 11) * 2, new THREE.Vector3(0, -0.3, -1.5), new THREE.Vector3(0, 1, 0), this.simTime);
    for (const w of [0, 1, 2, 3]) if (Math.random() < 0.5) this.fx.dustAt(new THREE.Vector3(WHEEL_POS[w].x, -0.6, WHEEL_POS[w].z).applyQuaternion(car.quat).add(car.pos));
  }
  onAir(car, t) {
    car.stats.bestAir = Math.max(car.stats.bestAir, t);
    if (car.isPlayer && !this.backdrop && !this.attract && t > 0.9) {
      this.popup('BIG AIR', 'hot', `${t.toFixed(1)} s`);
      if (t > 1.1) Announcer.say('air');
    }
  }

  spawnDebris(mesh, half, p, q, v, isWheel) {
    this.scene.add(mesh);
    const body = this.world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(p.x, p.y, p.z).setRotation({ x: q.x, y: q.y, z: q.z, w: q.w })
      .setLinvel(v.x, v.y, v.z).setAngvel({ x: rand(-6, 6), y: rand(-6, 6), z: rand(-6, 6) }).setLinearDamping(0.1).setAngularDamping(0.3));
    const desc = isWheel ? RAPIER.ColliderDesc.cylinder(half[0], half[1]).setRotation({ x: 0, y: 0, z: Math.SQRT1_2, w: Math.SQRT1_2 })
      : RAPIER.ColliderDesc.cuboid(half[0], Math.max(half[1], 0.04), half[2]);
    desc.setDensity(isWheel ? 120 : 160).setFriction(0.7).setRestitution(0.3).setCollisionGroups(GROUPS_DEBRIS);
    this.world.createCollider(desc, body);
    this.debris.push({ mesh, body, life: 30 });
    while (this.debris.length > 45) this.removeDebris(this.debris.shift());
  }
  removeDebris(d) {
    this.scene.remove(d.mesh);
    this.world.removeRigidBody(d.body);
  }
  updateDebris(dt) {
    for (let i = this.debris.length - 1; i >= 0; i--) {
      const d = this.debris[i];
      d.life -= dt;
      if (d.life <= 0) { this.removeDebris(d); this.debris.splice(i, 1); continue; }
      const t = d.body.translation(), r = d.body.rotation();
      d.mesh.position.set(t.x, t.y, t.z);
      d.mesh.quaternion.set(r.x, r.y, r.z, r.w);
      if (d.life < 1) d.mesh.scale.setScalar(d.life);
    }
  }

  // ------------------------------------------------ endings
  endDerby(why) {
    if (this.state !== 'race') return;
    const alive = this.cars.filter((c) => !c.wrecked);
    if (why === 'last' && alive.length === 1) {
      alive[0].points += 20;
      alive[0].survivor = true;
      if (alive[0].isPlayer) { this.popup('LAST CAR RUNNING', 'hot', '+20'); Announcer.say('survivor', {}, true); }
    } else if (why === 'time') {
      for (const c of alive) { c.points += 10; c.survivor = true; }
      if (!this.player.wrecked) this.popup('SURVIVED!', 'hot', '+10');
      Announcer.say('timeup', {}, true);
    }
    Audio.cheer(1.4);
    this.setState('finished');
    if (this.session) this.report(why);
  }

  complete() {
    if (this.over) return;
    this.over = true;
    const ranked = this.ranking();
    const rows = ranked.map((car, i) => {
      const race = this.M.race && this.mode !== 'trial';
      const finishPts = race ? (car.wrecked && !car.finished ? 0 : FINISH_POINTS[i] || 0) : 0;
      const wreckPts = car.points;
      return { car, name: car.name, color: car.color, isPlayer: car.isPlayer, pos: i + 1, finishPts, wreckPts, total: finishPts + wreckPts, status: car.finished ? 'FINISHED' : car.wrecked ? 'WRECKED' : (this.track.isBowl ? (car.survivor ? 'SURVIVOR' : 'RUNNING') : 'RUNNING'), time: car.finishTime, best: car.bestLap };
    });
    if (this.track.isBowl) rows.sort((a, b) => b.total - a.total).forEach((r, i) => (r.pos = i + 1));
    this.results = { rows, mode: this.mode, track: this.track.def.name, trackId: this.track.id, player: rows.find((r) => r.isPlayer), laps: this.laps };
    this.state = 'done';
    if (this.session) this.report('done');
    Music.play('results');
    if (this.onDone) this.onDone(this.results);
  }

  /** Session: the run's score, reported once. */
  report(why) {
    if (this.reported) return;
    this.reported = true;
    const p = this.player;
    const awards = [];
    if (p.stats.wrecks > 0) awards.push({ title: p.stats.wrecks > 1 ? 'Wrecking crew' : 'Car crusher', detail: `${p.stats.wrecks} wreck${p.stats.wrecks > 1 ? 's' : ''} caused` });
    if (p.survivor) awards.push({ title: 'Last car running', detail: why === 'last' ? 'Outlasted the whole Bowl' : 'Survived the clock' });
    if (p.stats.spins >= 3) awards.push({ title: 'Spin doctor', detail: `${p.stats.spins} spins caused` });
    AIHub.result({
      score: p.points,
      stats: { points: p.points, wrecks: p.stats.wrecks, spins: p.stats.spins, rollovers: p.stats.rolls, hits: p.stats.hits, damage: `${Math.round(100 - p.hp)}%` },
      awards: awards.slice(0, 3),
    });
    this.sessionDone = true;
  }

  // ------------------------------------------------ presentation
  popup(text, cls = '', small = '') {
    if (this.backdrop || this.attract) return;
    const box = $('#popups');
    while (box.children.length > 2) box.firstChild.remove();
    const d = document.createElement('div');
    d.className = 'pop ' + cls;
    d.innerHTML = `${escapeText(text)}${small ? `<small>${escapeText(small)}</small>` : ''}`;
    box.appendChild(d);
    setTimeout(() => d.remove(), 1850);
  }
  ticker(text) {
    if (this.backdrop) return;
    const box = $('#ticker');
    while (box.children.length > 4) box.firstChild.remove();
    const d = document.createElement('div');
    d.textContent = text;
    box.appendChild(d);
    setTimeout(() => d.remove(), 5000);
  }

  updateAudio(dt) {
    const p = this.focus;
    if (!p) return;
    const gears = [0, 11, 20, 29, 38, 60];
    let g = 1;
    while (g < gears.length - 1 && p.speed > gears[g]) g++;
    const rpm = clamp((p.speed - gears[g - 1]) / (gears[g] - gears[g - 1]), 0, 1) * 0.75 + 0.2;
    const mine = p === this.player && !this.drivers.has(p);
    Audio.setEngine(p.wrecked ? 0 : rpm, mine ? p.ctrl.throttle : 0.6, !p.wrecked && !this.paused);
    Audio.setSkid(p.grounded > 1 && p.speed > 5 ? p.slip : 0);
    let n = 0;
    for (const c of this.cars) if (c !== p && !c.wrecked && c.pos.distanceTo(R.camera.position) < 45) n++;
    Audio.setPack(n / 5, clamp(p.speed / 40, 0, 1));
    Audio.setCrowd(0.35 + this.excite * 0.4);
  }

  buildMinimap() {
    const m = this.track.mini;
    const cv = document.createElement('canvas');
    cv.width = cv.height = 220;
    const g = cv.getContext('2d');
    const sc = 200 / m.span;
    this.miniXf = (x, z) => [110 + (x - m.cx) * sc, 110 + (z - m.cz) * sc];
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (const [w, col] of [[11, '#000'], [6, '#d9d6cf']]) {
      g.strokeStyle = col; g.lineWidth = w; g.beginPath();
      m.pts.forEach(([x, z], i) => { const [a, b] = this.miniXf(x, z); i ? g.lineTo(a, b) : g.moveTo(a, b); });
      g.closePath(); g.stroke();
    }
    if (this.track.isBowl) { const [a, b] = this.miniXf(0, 0); g.fillStyle = '#6e5a3e'; g.beginPath(); g.arc(a, b, this.track.bowl.island * sc, 0, TAU); g.fill(); }
    else { const s0 = this.track.samples[0]; const [a, b] = this.miniXf(s0.p.x, s0.p.z); g.fillStyle = '#fff'; g.fillRect(a - 4, b - 4, 8, 8); }
    this.miniBase = cv;
  }
  drawMinimap() {
    const cv = $('#minimap');
    const g = cv.getContext('2d');
    g.clearRect(0, 0, 220, 220);
    g.drawImage(this.miniBase, 0, 0);
    for (const c of this.cars) {
      const [x, y] = this.miniXf(c.pos.x, c.pos.z);
      g.fillStyle = c.wrecked ? '#444' : '#' + new THREE.Color(c.color).getHexString();
      g.strokeStyle = '#000'; g.lineWidth = 2;
      g.beginPath(); g.arc(x, y, c.isPlayer ? 7 : 4.5, 0, TAU); g.fill(); g.stroke();
      if (c.isPlayer) { g.strokeStyle = '#ffe14d'; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 10, 0, TAU); g.stroke(); }
    }
  }

  updateHUD() {
    const p = this.player;
    if (!p) return;
    const rank = this.ranking();
    const pos = rank.indexOf(p) + 1;
    const set = (id, html) => { const el = $(id); if (el._v !== html) { el._v = html; el.innerHTML = html; } };
    if (this.mode === 'trial') set('#hPos', `${fmtLap(isFinite(p.bestLap) ? p.bestLap : NaN).replace('--:--.--', '—')}<small> BEST</small>`);
    else set('#hPos', `${pos}<small>/${this.cars.length}</small>`);
    const alive = this.cars.filter((c) => !c.wrecked).length;
    if (this.track.isBowl) set('#hLap', `CARS LEFT ${alive}/${this.cars.length}`);
    else set('#hLap', `LAP ${clamp(p.lap, 1, this.laps)}/${this.laps}${this.mode === 'trial' && isFinite(Progress.data.bestLaps[this.track.id]) ? ` · RECORD ${fmtLap(Progress.data.bestLaps[this.track.id])}` : ''}`);
    if (this.wrecking) set('#hPts', `${p.points}<small> PTS</small>`);
    else if (this.mode === 'trial') set('#hPts', `${fmtLap(this.racing && p.lap >= 1 && !p.finished ? this.simTime - p.lapStart : p.lastLap)}<small> LAP</small>`);
    else set('#hPts', `P${pos}<small> STOCK</small>`);
    const raceT = this.state === 'race' || this.state === 'finished' ? this.simTime - this.raceStart : 0;
    set('#hTime', this.track.isBowl ? `⏱ ${fmtTime(Math.max(0, this.timeLimit - this.simTime))}` : fmtTime(p.finished ? p.finishTime : raceT));
    const mph = Settings.data.units === 'mph';
    set('#hSpd', String(Math.round(p.speed * (mph ? 2.237 : 3.6))));
    set('#hUnit', mph ? 'MPH' : 'KM/H');
    const zc = (v) => (v < 35 ? '#46e07a' : v < 70 ? '#ffc21a' : v < 100 ? '#ff6a1a' : '#e01a1a');
    for (const [z, id] of [['F', 'zF'], ['B', 'zB'], ['L', 'zL'], ['R', 'zR']]) {
      const el = document.getElementById(id);
      const c = zc(p.zone[z]);
      if (el._c !== c) { el._c = c; el.setAttribute('fill', c); }
    }
    const hp = $('#hpFill');
    hp.style.width = `${p.hp}%`;
    hp.style.background = p.hp > 60 ? '#46e07a' : p.hp > 30 ? '#ffc21a' : '#e01a1a';
    // context prompts
    let prompt = '';
    if (!p.wrecked && this.state === 'race') {
      if (p.flippedFor > 0.8) prompt = `${glyph('triangle')} RECOVER`;
      else if (p.repairing) prompt = `REPAIRING… ${Math.round(p.hp)}%`;
      else if (this.track.pit && p.hp < 45 && !this.track.isBowl) prompt = 'DAMAGED! PIT LANE ON THE START STRAIGHT — STOP IN THE YELLOW BOX';
    }
    set('#prompt', prompt);
    this.drawMinimap();
  }

  dispose() {
    for (const c of this.cars) c.dispose();
    for (const d of this.debris) this.scene.remove(d.mesh);
    this.track.dispose(this.scene);
    this.fx.clear();
    this.world.free();
    $('#count').textContent = '';
    $('#banner').innerHTML = '';
    $('#prompt').textContent = '';
    $('#popups').innerHTML = '';
    $('#ticker').innerHTML = '';
  }
}

// ---------------------------------------------------------------- championship bookkeeping
const Champ = {
  get data() { return Progress.data.champ; },
  start() {
    const div = Progress.data.division;
    const table = { YOU: 0 };
    ROSTER.forEach((r) => (table[r.name] = 0));
    Progress.data.champ = { division: div, round: 0, table, history: [] };
    Progress.save();
  },
  roundCfg() {
    const c = this.data;
    const r = CHAMP_ROUNDS[c.round];
    return { ...r, opponents: 11, division: c.division, champ: true, gridSlot: c.round === 0 ? 8 : this.gridFor() };
  },
  gridFor() {
    // DD2 style: the championship leader starts at the back
    const order = this.standings().map((s) => s.name);
    return clamp(order.indexOf('YOU'), 0, 11);
  },
  record(results) {
    const c = this.data;
    for (const r of results.rows) c.table[r.isPlayer ? 'YOU' : r.name] = (c.table[r.isPlayer ? 'YOU' : r.name] || 0) + r.total;
    c.history.push({ track: results.track, pos: results.player.pos, pts: results.player.total });
    c.round++;
    Progress.save();
  },
  standings() {
    const c = this.data;
    return Object.entries(c.table).map(([name, pts]) => ({ name, pts, isPlayer: name === 'YOU', color: name === 'YOU' ? PLAYER_LOOK.color : (ROSTER.find((r) => r.name === name) || {}).color })).sort((a, b) => b.pts - a.pts);
  },
  get finished() { return this.data && this.data.round >= CHAMP_ROUNDS.length; },
  /** Promotion / relegation once the last round is in. */
  conclude() {
    const st = this.standings();
    const pos = st.findIndex((s) => s.isPlayer) + 1;
    const div = this.data.division;
    let outcome = 'stay';
    if (pos <= 3) {
      if (div > 1) { Progress.data.division = div - 1; outcome = 'up'; }
      else if (pos === 1) { Progress.data.titles++; outcome = 'title'; }
    } else if (pos >= 10 && div < 4) { Progress.data.division = div + 1; outcome = 'down'; }
    Progress.data.champ = null;
    Progress.save();
    return { pos, outcome, division: div, newDivision: Progress.data.division, standings: st };
  },
};
