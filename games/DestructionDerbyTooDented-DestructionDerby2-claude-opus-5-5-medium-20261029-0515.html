<!--
DESTRUCTION DERBY TOO DENTED: an original spiritual successor to Destruction Derby 2 (Reflections / Psygnosis, 1996). No original assets, names, music or code are used.

## Source Information
- Date: 2026-10-29 05:15
- Source: Destruction Derby 2
- Tech: Three.js r180 (three.webgpu.js + TSL, WebGPURenderer, WebGPU only, no fallback), Rapier 3D 0.19.3 (@dimforge/rapier3d-compat) for physics, Gamepad API, Web Audio API, Canvas 2D for HUD textures; plain ES modules bundled into one HTML file, libraries loaded from the jsDelivr CDN.
- Art Direction: stylized cel shading. MeshToonMaterial with a 3-step nearest-filtered ramp, TSL toon outline pass (inverted-hull ink lines), flat vertex-coloured track dressing, toon smoke puffs and chunky sparks, hard-edged shadows, gradient sky dome.
- Animation: procedural and physics-driven. Rapier rigid bodies with custom raycast suspension, per-vertex crumple deformation of body panels, detached parts and wheels as rigid-body debris, instanced particle systems (smoke, fire, sparks, chips, dust), instanced skid marks, a bouncing instanced crowd, spring-damped chase / TV cameras with shake.
- Audio: all generated in code with the Web Audio API. Music is a step-sequenced rock band (distorted saw power chords, saw bass, synth kick, snare and hats, square lead) with menu, race, derby and results songs. Sound effects are synthesized (engine, tyre squeal, crunches with inharmonic metal clangs, scrapes, explosions, crowd, horn, UI blips). The announcer "Buck Rivets" speaks Animalese-style gibberish (formant-filtered blips per letter) with on-screen subtitles.
- Online: AI Hub Session Protocol v1 (session.js client 1.3.0) in side-by-side (parallel) mode: every friend plays the same seeded 3-minute Bowl derby and the hub ranks wreck points; progress, result, stats and awards are reported to the hub. No other networking. Outside a session the game is a complete single-player game.
- Testing: lightweight automated smoke tests only: headless Chromium (Playwright) with a software WebGPU adapter, console-error capture, scripted key presses through title, menus, a race, a derby and attract mode, screenshots, and the AI Hub harness automatic check. No real GPU, no real controller, no audio listening.
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort medium
- Usage: unknown (no cost or token meter is visible to the model in this session); session time roughly 1.5 to 2 hours (estimate).

## Testing Feedback
- How many issues did testing catch? 11 game issues: pause closing the instant it opened (Esc is also Back), a disposed event still being updated after scene swaps, damage so high that races could not be finished, an open pit lane that trapped cars against its closing wall, car-to-car hits misattributed to walls (losing wreck points), AI ramming every frame, derby AI stuck in slow shoving matches, hub probe input depending on frame timing, the probe calling the main menu 'title', oversized smoke puffs and a missing-normals warning. Plus 2 test-environment issues (headless WebGPU needed SwiftShader Vulkan flags; another agent's server owned the first test ports).
- How many would be considered critical issues / game breaking? 3: the pause menu that could not stay open, races nobody could finish, and the pit-lane trap.
- What was the most helpful test you ran? An autopilot logic test: the player car driven by the AI through a full race, a derby and a championship round with rendering skipped, logging every impact. It exposed the damage, pit-lane and attribution bugs at once.
- What was the least helpful test you ran? Raw frame-rate observations, since the software WebGPU adapter (about 3 fps) says nothing about real hardware.

## Engine Feedback
- What did you like most about the engine? Three.js r180's WebGPU renderer plus the built-in toonOutlinePass gives a convincing cel look in a few lines, and Rapier's ray casts, contact queries and persistent forces make a custom arcade vehicle straightforward.
- Did you get stuck or guess wrong? Mostly small API guesses: Rapier forces persist until resetForces, ray hits expose timeOfImpact (not toi), and the outline pass only inks MeshToonMaterial, so particles and decals had to be chosen deliberately.
- What was the most important thing you had to build yourself? The vehicle model (raycast suspension, friction circle, handbrake drift, damage-driven handling) and the impact pipeline that turns velocity jumps into zones, dents, flying parts and derby points.
- What was the hardest part about using the engine? Verifying WebGPU output without a real GPU: headless runs use a software adapter, so visuals and timing can only be sanity-checked.
- If you had to remove or overhaul one thing from engine, what would that be? The split between WebGL-era materials and node materials; it is easy to pick a material the outline or post pass silently ignores.
- If you could change one thing about the engine, what would it be? A first-party arcade vehicle controller in Rapier's JS API with tunable tyre curves and per-wheel surface callbacks.

## Prompt Feedback
- What did you like most about this prompt? Clear deliverable, explicit stack and versions, and a concrete multiplayer contract with a test harness.
- What was confusing? "Follow the hub for multiplayer as well as for the game on its own" can read as either "also support standalone play" or "also add local multiplayer"; this build chose standalone single player plus hub sessions.
- What was the hardest thing to do? Fitting a full vertical slice (damage model, three venues, four modes, championship, attract mode, synthesized audio, hub session) into one file while keeping it testable headless.
- If there was one test you could have run, what would that test be? A play session on real hardware with a DualSense, to tune handling, damage numbers and rumble by feel.
-->

(function (root) {

  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */

    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {

    var api = {
      getItem: function (k) {
        k = String(k);

      clear: function () {

      has: function (t, k) {

      },

      },

      getOwnPropertyDescriptor: function (t, k) {

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */

    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.

    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */

    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

    };

    opts = opts || {};

    } catch (e) {

      return false;
    }

      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;

   * The whole outcome as plain JSON, field by field: the hub checks and trims

  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;

canvas#gl { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
.layer { position:fixed; inset:0; pointer-events:none; }
.screen { position:fixed; inset:0; display:none; pointer-events:auto; }
.screen.on { display:flex; }
.center { align-items:center; justify-content:center; flex-direction:column; }
.dim { background: radial-gradient(ellipse at center, rgba(10,6,18,.35), rgba(10,6,18,.88)); }
.logo { text-align:center; line-height:.86; transform: rotate(-4deg); filter: drop-shadow(6px 6px 0 #000); }
.logo .l1 { font-size: clamp(40px,8.5vw,128px); color: var(--hot2); -webkit-text-stroke: 3px #000; letter-spacing:-2px; }
.logo .l2 { font-size: clamp(54px,12vw,190px); color: var(--hot); -webkit-text-stroke: 4px #000; letter-spacing:-4px; font-style:italic; }
.logo .l3 { font-size: clamp(18px,2.6vw,38px); color:#fff; background:#000; display:inline-block; padding:4px 18px; margin-top:12px; transform: rotate(3deg); letter-spacing:6px; }
.press { margin-top:7vh; font-size: clamp(18px,2.4vw,34px); animation: blink 1.1s steps(2) infinite; text-shadow: 3px 3px 0 #000; }
@keyframes blink { 50% { opacity:.25 } }
h1.title { font-size: clamp(30px,4.6vw,66px); margin:0 0 3vh; color:var(--hot2); -webkit-text-stroke:2px #000; text-shadow: 5px 5px 0 #000; font-style:italic; transform: rotate(-2deg); text-align:center; }
.menu { display:flex; flex-direction:column; gap:1.4vh; min-width: min(560px, 86vw); }
.tile { pointer-events:auto; cursor:pointer; background: var(--panel); border: 4px solid var(--line); border-radius: 14px; padding: 1.6vh 28px;
  font-size: clamp(20px,2.4vw,34px); display:flex; align-items:center; justify-content:space-between; gap:20px; transition: transform .08s, border-color .08s, background .08s; }
.tile small { font-family: Arial, sans-serif; font-weight:700; font-size: .5em; opacity:.75; }
.tile.focus { border-color: var(--hot2); background: linear-gradient(90deg, #ff4d1a, #c2185b); transform: scale(1.04) rotate(-.6deg); box-shadow: 0 0 0 4px #000, 8px 8px 0 #000; }
.tile .val { color: var(--hot2); display:flex; align-items:center; gap:14px; }
.tile.focus .val { color:#fff; }
.tile .val::before { content:'◀'; opacity:.5; font-size:.7em; } .tile .val::after { content:'▶'; opacity:.5; font-size:.7em; }
.tile.noarrows .val::before, .tile.noarrows .val::after { content:''; }
.bar { width: 160px; height: 16px; background:#000; border:2px solid #fff3; border-radius:8px; overflow:hidden; } .bar > i { display:block; height:100%; background: var(--hot2); }
.hints { position:fixed; bottom:2.4vh; left:0; right:0; display:flex; justify-content:center; gap:4vw; font-size: clamp(14px,1.6vw,22px); text-shadow:2px 2px 0 #000; pointer-events:none; }
.glyph { display:inline-flex; align-items:center; justify-content:center; min-width:1.7em; height:1.7em; padding:0 .4em; border-radius:1em; background:#000; border:2px solid #fff6; margin-right:.4em; font-family: Arial, sans-serif; font-weight:900; }
.card { background: var(--panel); border:4px solid var(--line); border-radius:18px; padding: 3vh 3vw; max-width: min(1100px, 92vw); box-shadow: 10px 10px 0 #000; }
.cols { display:flex; gap:3vw; flex-wrap:wrap; justify-content:center; }
.big { font-size: clamp(28px,4vw,60px); }
.sub { font-family: Arial, sans-serif; font-weight:700; font-size: clamp(14px,1.5vw,22px); opacity:.85; line-height:1.4; }
.rows { display:flex; flex-direction:column; gap:.9vh; margin: 2vh 0; }
.row { display:flex; justify-content:space-between; align-items:center; gap:30px; padding: 1vh 22px; border-radius:10px; background:#0006; font-size: clamp(18px,2vw,30px); }
.row.me { background: linear-gradient(90deg,#ff4d1acc,#c2185bcc); }
.row .pos { width: 2.2em; color:var(--hot2); } .row .nm { flex:1; } .row .pts { color:var(--hot2); }
.row.me .pos, .row.me .pts { color:#fff; }
.swatch { display:inline-block; width: .9em; height:.9em; border-radius:4px; border:2px solid #000; margin-right:.5em; vertical-align:middle; }
.scroll { max-height: 66vh; overflow:auto; scrollbar-width: thin; }
.about h3 { color: var(--hot2); margin: 2.4vh 0 .8vh; font-size: clamp(18px,2vw,28px); }
.about p, .about li { font-family: Arial, sans-serif; font-weight:600; font-size: clamp(14px,1.45vw,20px); line-height:1.45; margin:.3em 0; }
/* HUD */
#hud { display:none; } #hud.on { display:block; }
.hud-tl { position:absolute; top:3vh; left:3vw; text-shadow: 3px 3px 0 #000; }
.hud-pos { font-size: clamp(48px,7vw,110px); line-height:.9; color: var(--hot2); -webkit-text-stroke:2px #000; font-style:italic; }
.hud-pos small { font-size:.38em; color:#fff; }
.hud-lap { font-size: clamp(18px,2.2vw,32px); margin-top: .6vh; }
.hud-tr { position:absolute; top:3vh; right:3vw; text-align:right; text-shadow: 3px 3px 0 #000; }
.hud-pts { font-size: clamp(36px,4.6vw,72px); color: var(--hot2); -webkit-text-stroke:2px #000; font-style:italic; }
.hud-pts small { font-size:.4em; color:#fff; -webkit-text-stroke:0; }
.hud-time { font-size: clamp(18px,2.2vw,32px); }
.hud-br { position:absolute; bottom:3vh; right:3vw; display:flex; align-items:flex-end; gap:2vw; }
.speed { text-align:right; text-shadow:3px 3px 0 #000; } .speed b { font-size: clamp(48px,6vw,96px); font-style:italic; display:block; line-height:.9; } .speed span { font-size: clamp(14px,1.4vw,20px); }
.dmg { width: clamp(90px,8vw,130px); text-align:center; font-size: clamp(12px,1.2vw,16px); text-shadow:2px 2px 0 #000; }
.dmg svg { width:100%; filter: drop-shadow(3px 3px 0 #000); }
.hpbar { height: 12px; border:2px solid #000; background:#000a; border-radius:6px; overflow:hidden; margin-top:6px; } .hpbar i { display:block; height:100%; background: var(--ok); transition: width .2s; }
.hud-bl { position:absolute; bottom:3vh; left:3vw; }
#minimap { width: clamp(130px,13vw,210px); height: clamp(130px,13vw,210px); border-radius: 50%; background: #0008; border:3px solid #000; }
.popups { position:absolute; top: 26vh; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap: 1vh; }
.pop { font-size: clamp(30px,4.4vw,70px); font-style:italic; color:#fff; -webkit-text-stroke:2px #000; text-shadow: 5px 5px 0 #000; animation: pop 1.8s ease-out forwards; }
.pop.hot { color: var(--hot2); } .pop.bad { color: #ff5a5a; }
.pop small { display:block; text-align:center; font-size:.45em; -webkit-text-stroke:1px #000; }
@keyframes pop { 0% { transform: scale(2.4) rotate(-8deg); opacity:0 } 12% { transform: scale(1) rotate(-3deg); opacity:1 } 80% { opacity:1 } 100% { transform: translateY(-40px) rotate(-3deg); opacity:0 } }
.ticker { position:absolute; top: 18vh; right: 3vw; display:flex; flex-direction:column; align-items:flex-end; gap:6px; font-family: Arial, sans-serif; font-weight:900; font-size: clamp(13px,1.3vw,18px); }
.ticker div { background:#000b; padding: 4px 10px; border-radius:6px; border-left:4px solid var(--hot); animation: fadeout 5s forwards; }
@keyframes fadeout { 85% { opacity:1 } 100% { opacity:0 } }
.subs { position:absolute; bottom: 15vh; left: 50%; transform: translateX(-50%); max-width: 70vw; text-align:center; font-family: Arial, sans-serif; font-weight:800; font-size: clamp(16px,1.8vw,26px); background:#000c; padding: 8px 18px; border-radius: 10px; display:none; }
.subs b { color: var(--hot2); }
.count { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size: clamp(90px,16vw,260px); font-style:italic; color: var(--hot2); -webkit-text-stroke:5px #000; text-shadow: 10px 10px 0 #000; }
.banner { position:absolute; top: 12vh; left:0; right:0; text-align:center; font-size: clamp(26px,3.6vw,56px); font-style:italic; text-shadow: 4px 4px 0 #000; }
.banner small { display:block; font-size:.45em; color: var(--hot2); }
.prompt { position:absolute; bottom: 24vh; left:0; right:0; text-align:center; font-size: clamp(18px,2vw,28px); text-shadow: 3px 3px 0 #000; animation: blink 1s steps(2) infinite; }
.demo-tag { white-space:nowrap; position:fixed; top: 3vh; left:50%; transform: translateX(-50%); font-size: clamp(22px,2.6vw,40px); background: var(--hot); color:#fff; padding: 6px 26px; border:4px solid #000; border-radius: 10px; box-shadow: 6px 6px 0 #000; display:none; font-style:italic; }
.demo-press { position:fixed; bottom: 4vh; left:0; right:0; text-align:center; font-size: clamp(18px,2.2vw,32px); text-shadow:3px 3px 0 #000; display:none; animation: blink 1.2s steps(2) infinite; }
.toast { position:fixed; top: 2vh; right: 2vw; background: var(--panel); border:3px solid var(--line); padding: 10px 18px; border-radius: 10px; font-size: 18px; display:none; }
.tabs { display:flex; gap: 12px; justify-content:center; margin-bottom: 2vh; }
.tabs span { padding: 6px 16px; border-radius: 8px; background: #0006; font-size: clamp(14px,1.5vw,22px); }
.tabs span.on { background: var(--hot); }
.keys { display:grid; grid-template-columns: auto auto; gap: 1.1vh 2vw; align-items:center; font-size: clamp(15px,1.6vw,24px); }
.keys .k { color: var(--hot2); text-align:right; }
.rules { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 2vh 2vw; }
.rule { background:#0007; border-radius: 12px; padding: 2vh 1.4vw; text-align:center; }
.rule b { display:block; font-size: clamp(30px,3.4vw,52px); color: var(--hot2); font-style:italic; }
.rule span { font-family: Arial, sans-serif; font-weight:800; font-size: clamp(14px,1.4vw,20px); }
#fatal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; text-align:center; background:#16111f; padding: 6vw; gap: 3vh; z-index: 10; }
#loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; background:#16111f; z-index: 9; gap: 2vh; font-size: 26px; }
#loading .bar { width: 320px; }
</style>

<script type="module">
// ==== 01-core.js
import * as THREE from 'three/webgpu';
import { toonOutlinePass, color as tslColor, float as tslFloat } from 'three/tsl';
import * as RAPIER from 'rapier';

// ---------------------------------------------------------------- utilities
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const nowMs = () => performance.now();
const TAU = Math.PI * 2;
const SESSION = !!(window.AIHub && window.AIHub.active);

/** Deterministic generator for scenery so every visit to a track looks the same. */
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = sec - m * 60;
  return `${m}:${s < 10 ? '0' : ''}${s.toFixed(1)}`;
}
function fmtLap(sec) {
  if (!isFinite(sec)) return '--:--.--';
  const m = Math.floor(sec / 60);
  const s = sec - m * 60;
  return `${m}:${s < 10 ? '0' : ''}${s.toFixed(2)}`;
}
function escapeText(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}

// ---------------------------------------------------------------- settings & progress
const DEFAULT_SETTINGS = {
  master: 8, music: 6, sfx: 8, voice: 8,
  invertX: false, invertY: false,
  camera: 'chase', units: 'kmh', rumble: true, shadows: true, subtitles: true, difficulty: 'normal',
};
const Settings = {
  data: { ...DEFAULT_SETTINGS },
  load() {
    try { Object.assign(this.data, JSON.parse(localStorage.getItem('ddtd.settings') || '{}')); } catch (e) { /* first launch */ }
  },
  save() {
    try { localStorage.setItem('ddtd.settings', JSON.stringify(this.data)); } catch (e) { /* storage blocked */ }
    Audio.applyVolumes();
    if (R.sun) R.sun.castShadow = this.data.shadows;
  },
};
const Progress = {
  data: { division: 4, titles: 0, bestLaps: {}, champ: null },
  load() {
    try { Object.assign(this.data, JSON.parse(localStorage.getItem('ddtd.progress') || '{}')); } catch (e) { /* first launch */ }
  },
  save() {
    try { localStorage.setItem('ddtd.progress', JSON.stringify(this.data)); } catch (e) { /* storage blocked */ }
  },
  reset() {
    this.data = { division: 4, titles: 0, bestLaps: {}, champ: null };
    this.save();
  },
};

// ---------------------------------------------------------------- input (controller first; keyboard maps onto it)
const PAD = { CROSS: 0, CIRCLE: 1, SQUARE: 2, TRIANGLE: 3, L1: 4, R1: 5, L2: 6, R2: 7, CREATE: 8, OPTIONS: 9, L3: 10, R3: 11, UP: 12, DOWN: 13, LEFT: 14, RIGHT: 15 };
const GAME_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'Backspace']);

const Input = {
  keys: new Set(),
  pressedKeys: new Set(),
  pad: null,
  padNow: [],
  padPrev: [],
  axes: [0, 0, 0, 0],
  lastInput: nowMs(),
  device: 'keyboard',
  anyPressed: false,
  // derived each frame
  steer: 0, throttle: 0, brake: 0, handbrake: false, lookBack: false, lookX: 0, lookY: 0,
  nav: { up: false, down: false, left: false, right: false },
  confirm: false, back: false, pause: false, camera: false, reset: false, horn: false,
  repeat: { dir: null, t: 0 },
  mouseMoved: 0,

  init() {
    addEventListener('keydown', (e) => {
      if (GAME_KEYS.has(e.code)) e.preventDefault();
      this.keys.add(e.code);
      this.pressedKeys.add(e.repeat ? 'R:' + e.code : e.code);
      this.touch('keyboard');
    });
    addEventListener('keyup', (e) => this.keys.delete(e.code));
    addEventListener('blur', () => this.keys.clear());
    addEventListener('pointerdown', () => this.touch('mouse'));
    addEventListener('mousemove', (e) => {
      this.mouseMoved += Math.abs(e.movementX) + Math.abs(e.movementY);
      if (this.mouseMoved > 40) { this.mouseMoved = 0; this.touch('mouse', true); }
    });
    addEventListener('wheel', () => this.touch('mouse', true), { passive: true });
  },
  touch(device, soft) {
    this.lastInput = nowMs();
    if (!soft) this.anyPressed = true;
    if (device !== 'mouse') this.device = device;
    Audio.ensure();
  },
  btn(i) { return !!this.padNow[i]; },
  btnDown(i) { return !!this.padNow[i] && !this.padPrev[i]; },
  key(...codes) { return codes.some((c) => this.keys.has(c)); },
  keyDown(...codes) { return codes.some((c) => this.pressedKeys.has(c)); },
  keyDownOrRepeat(...codes) { return codes.some((c) => this.pressedKeys.has(c) || this.pressedKeys.has('R:' + c)); },

  poll(dt) {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    this.pad = null;
    for (const p of pads) if (p && p.connected) { this.pad = p; break; }
    this.padPrev = this.padNow;
    this.padNow = [];
    let ax = [0, 0, 0, 0];
    let trig = [0, 0];
    if (this.pad) {
      const p = this.pad;
      for (let i = 0; i < p.buttons.length; i++) {
        const b = p.buttons[i];
        this.padNow[i] = !!b && (b.pressed || b.value > 0.5);
      }
      trig = [p.buttons[6] ? p.buttons[6].value : 0, p.buttons[7] ? p.buttons[7].value : 0];
      for (let i = 0; i < 4; i++) {
        const v = p.axes[i] || 0;
        ax[i] = Math.abs(v) < 0.16 ? 0 : (v - Math.sign(v) * 0.16) / 0.84;
      }
      const active = this.padNow.some((b, i) => b && !this.padPrev[i]) || ax.some((v) => Math.abs(v) > 0.5);
      if (active) this.touch('pad');
    }
    // the inverted-axis quick fix from Settings
    if (Settings.data.invertX) { ax[0] = -ax[0]; ax[2] = -ax[2]; }
    if (Settings.data.invertY) { ax[1] = -ax[1]; ax[3] = -ax[3]; }
    this.axes = ax;

    const kL = this.key('ArrowLeft', 'KeyA') ? 1 : 0;
    const kR = this.key('ArrowRight', 'KeyD') ? 1 : 0;
    const dL = this.btn(PAD.LEFT) ? 1 : 0;
    const dR = this.btn(PAD.RIGHT) ? 1 : 0;
    this.steer = clamp(ax[0] + (kR - kL) + (dR - dL), -1, 1);
    this.throttle = clamp(Math.max(trig[1], this.btn(PAD.CROSS) ? 1 : 0, this.key('ArrowUp', 'KeyW') ? 1 : 0), 0, 1);
    this.brake = clamp(Math.max(trig[0], this.btn(PAD.SQUARE) ? 1 : 0, this.key('ArrowDown', 'KeyS') ? 1 : 0), 0, 1);
    this.handbrake = this.btn(PAD.CIRCLE) || this.key('Space');
    this.lookBack = this.btn(PAD.L1) || this.key('KeyB', 'KeyQ');
    this.horn = this.btnDown(PAD.L3) || this.keyDown('KeyH');
    this.lookX = ax[2];
    this.lookY = ax[3];
    this.camera = this.btnDown(PAD.R1) || this.keyDown('KeyC');
    this.reset = this.btnDown(PAD.TRIANGLE) || this.keyDown('KeyR');
    const createHeld = this.btn(PAD.CREATE);
    this.pause = (!createHeld && this.btnDown(PAD.OPTIONS)) || this.keyDown('Escape', 'KeyP');
    this.confirm = this.btnDown(PAD.CROSS) || this.keyDown('Enter', 'NumpadEnter', 'Space');
    this.back = this.btnDown(PAD.CIRCLE) || this.keyDown('Escape', 'Backspace');

    // menu navigation with auto-repeat for stick / d-pad
    const n = { up: false, down: false, left: false, right: false };
    if (this.keyDownOrRepeat('ArrowUp', 'KeyW')) n.up = true;
    if (this.keyDownOrRepeat('ArrowDown', 'KeyS')) n.down = true;
    if (this.keyDownOrRepeat('ArrowLeft', 'KeyA')) n.left = true;
    if (this.keyDownOrRepeat('ArrowRight', 'KeyD')) n.right = true;
    let held = null;
    if (this.btn(PAD.UP) || ax[1] < -0.55) held = 'up';
    else if (this.btn(PAD.DOWN) || ax[1] > 0.55) held = 'down';
    else if (this.btn(PAD.LEFT) || ax[0] < -0.55) held = 'left';
    else if (this.btn(PAD.RIGHT) || ax[0] > 0.55) held = 'right';
    if (held) {
      if (this.repeat.dir !== held) { this.repeat.dir = held; this.repeat.t = 0.38; n[held] = true; }
      else { this.repeat.t -= dt; if (this.repeat.t <= 0) { this.repeat.t = 0.13; n[held] = true; } }
    } else this.repeat.dir = null;
    this.nav = n;
  },
  /** Read the controls right now, without touching edge state (used by the hub probe). */
  sample() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let p = null;
    for (const q of pads) if (q && q.connected) { p = q; break; }
    const b = (i) => !!(p && p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.5));
    const v = (i) => (p && p.buttons[i] ? p.buttons[i].value : 0);
    let ax = p ? p.axes[0] || 0 : 0;
    if (Math.abs(ax) < 0.16) ax = 0;
    if (Settings.data.invertX) ax = -ax;
    const kx = (this.key('ArrowRight', 'KeyD') ? 1 : 0) - (this.key('ArrowLeft', 'KeyA') ? 1 : 0);
    const steer = clamp(ax + kx + (b(PAD.RIGHT) ? 1 : 0) - (b(PAD.LEFT) ? 1 : 0), -1, 1);
    const thr = Math.max(v(7), b(PAD.CROSS) ? 1 : 0, this.key('ArrowUp', 'KeyW') ? 1 : 0);
    const brk = Math.max(v(6), b(PAD.SQUARE) ? 1 : 0, this.key('ArrowDown', 'KeyS') ? 1 : 0);
    return { steer, throttle: thr, brake: brk, handbrake: b(PAD.CIRCLE) || b(PAD.R1) || this.key('Space') };
  },
  endFrame() {
    this.pressedKeys.clear();
    this.anyPressed = false;
  },
  idleSeconds() { return (nowMs() - this.lastInput) / 1000; },
  rumble(strength, ms) {
    if (!Settings.data.rumble || !this.pad || !this.pad.vibrationActuator) return;
    try {
      const r = this.pad.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: clamp(strength, 0, 1), weakMagnitude: clamp(strength * 0.7, 0, 1) });
      if (r && r.catch) r.catch(() => {});
    } catch (e) { /* not supported */ }
  },
};

// ==== 02-audio.js
// ---------------------------------------------------------------- audio: everything is synthesized in code
const Audio = {
  ctx: null, master: null, musicBus: null, sfxBus: null, voiceBus: null, noise: null, distCurve: null,
  engine: null, skid: null, crowd: null, pack: null, muted: false,

  /** Create or resume the context: called from player input, and on the hub's `start` in a session. */
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const c = this.ctx;
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
      comp.connect(c.destination);
      this.master = c.createGain(); this.master.connect(comp);
      this.musicBus = c.createGain(); this.musicBus.connect(this.master);
      this.sfxBus = c.createGain(); this.sfxBus.connect(this.master);
      this.voiceBus = c.createGain(); this.voiceBus.connect(this.master);
      const len = c.sampleRate * 2;
      this.noise = c.createBuffer(1, len, c.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.distCurve = new Float32Array(1024);
      for (let i = 0; i < 1024; i++) { const x = (i / 1023) * 2 - 1; this.distCurve[i] = Math.tanh(x * 6) * 0.9; }
      this.applyVolumes();
      this.buildLoops();
      Music.resume();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  applyVolumes() {
    if (!this.ctx) return;
    const s = Settings.data;
    const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(this.muted ? 0 : (s.master / 10) * 0.9, t, 0.05);
    this.musicBus.gain.setTargetAtTime((s.music / 10) * 0.55, t, 0.05);
    this.sfxBus.gain.setTargetAtTime((s.sfx / 10) * 0.9, t, 0.05);
    this.voiceBus.gain.setTargetAtTime((s.voice / 10) * 1.0, t, 0.05);
  },
  silence(on) { this.muted = on; this.applyVolumes(); },
  get t() { return this.ctx ? this.ctx.currentTime : 0; },

  // ------------------------------------------------ primitives
  osc(type, freq, when, dur, gain, dest, opts = {}) {
    const c = this.ctx;
    const o = c.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, when);
    if (opts.to) o.frequency.exponentialRampToValueAtTime(Math.max(1, opts.to), when + (opts.glide || dur));
    if (opts.detune) o.detune.value = opts.detune;
    const g = c.createGain();
    const a = opts.attack || 0.004;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + a);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g);
    let out = g;
    if (opts.filter) {
      const f = c.createBiquadFilter();
      f.type = opts.filter; f.frequency.value = opts.ff || 1000; f.Q.value = opts.q || 1;
      g.connect(f); out = f;
    }
    out.connect(dest);
    o.start(when); o.stop(when + dur + 0.05);
    return o;
  },
  burst(when, dur, gain, dest, type = 'lowpass', freq = 1000, q = 1, freqTo = null) {
    const c = this.ctx;
    const s = c.createBufferSource();
    s.buffer = this.noise;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = c.createBiquadFilter();
    f.type = type; f.frequency.setValueAtTime(freq, when); f.Q.value = q;
    if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, when + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(gain, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    s.connect(f); f.connect(g); g.connect(dest);
    s.start(when, Math.random() * 1.5); s.stop(when + dur + 0.05);
  },
  panned(pan) {
    const p = this.ctx.createStereoPanner();
    p.pan.value = clamp(pan, -1, 1);
    p.connect(this.sfxBus);
    return p;
  },

  // ------------------------------------------------ continuous loops: engine, skid, crowd, field of engines
  buildLoops() {
    const c = this.ctx;
    const mk = (type) => { const o = c.createOscillator(); o.type = type; o.start(); return o; };
    // player engine: two detuned saws + sub square through a resonant lowpass
    const e = { g: c.createGain(), f: c.createBiquadFilter(), a: mk('sawtooth'), b: mk('sawtooth'), s: mk('square') };
    e.f.type = 'lowpass'; e.f.Q.value = 3; e.f.frequency.value = 500;
    e.g.gain.value = 0;
    const sg = c.createGain(); sg.gain.value = 0.5;
    e.a.connect(e.f); e.b.connect(e.f); e.s.connect(sg); sg.connect(e.f); e.f.connect(e.g); e.g.connect(this.sfxBus);
    this.engine = e;
    // skid: looping filtered noise
    const sk = { src: c.createBufferSource(), f: c.createBiquadFilter(), g: c.createGain() };
    sk.src.buffer = this.noise; sk.src.loop = true; sk.f.type = 'bandpass'; sk.f.frequency.value = 1300; sk.f.Q.value = 2.5; sk.g.gain.value = 0;
    sk.src.connect(sk.f); sk.f.connect(sk.g); sk.g.connect(this.sfxBus); sk.src.start();
    this.skid = sk;
    // crowd bed
    const cr = { src: c.createBufferSource(), f: c.createBiquadFilter(), g: c.createGain() };
    cr.src.buffer = this.noise; cr.src.loop = true; cr.f.type = 'bandpass'; cr.f.frequency.value = 900; cr.f.Q.value = 0.7; cr.g.gain.value = 0;
    cr.src.connect(cr.f); cr.f.connect(cr.g); cr.g.connect(this.sfxBus); cr.src.start();
    this.crowd = cr;

    const pk = { g: c.createGain(), f: c.createBiquadFilter(), a: mk('sawtooth'), b: mk('sawtooth') };
    pk.f.type = 'lowpass'; pk.f.frequency.value = 380; pk.g.gain.value = 0;
    pk.a.frequency.value = 70; pk.b.frequency.value = 93;
    pk.a.connect(pk.f); pk.b.connect(pk.f); pk.f.connect(pk.g); pk.g.connect(this.sfxBus);
    this.pack = pk;
  },
  setEngine(rpm01, load, on) {
    if (!this.ctx || !this.engine) return;
    const t = this.ctx.currentTime;
    const e = this.engine;
    const f = 42 + rpm01 * 150;
    e.a.frequency.setTargetAtTime(f, t, 0.04);
    e.b.frequency.setTargetAtTime(f * 1.012, t, 0.04);
    e.s.frequency.setTargetAtTime(f * 0.5, t, 0.04);
    e.f.frequency.setTargetAtTime(300 + rpm01 * 1400 + load * 900, t, 0.05);

  },
  setSkid(amount) {
    if (!this.ctx || !this.skid) return;
    this.skid.g.gain.setTargetAtTime(clamp(amount, 0, 1) * 0.22, this.ctx.currentTime, 0.05);
  },
  setCrowd(level) {
    if (!this.ctx || !this.crowd) return;
    this.crowd.g.gain.setTargetAtTime(clamp(level, 0, 1) * 0.12, this.ctx.currentTime, 0.4);
  },
  setPack(level, pitch) {
    if (!this.ctx || !this.pack) return;
    const t = this.ctx.currentTime;
    this.pack.g.gain.setTargetAtTime(clamp(level, 0, 1) * 0.06, t, 0.2);
    this.pack.a.frequency.setTargetAtTime(55 + pitch * 70, t, 0.2);
    this.pack.b.frequency.setTargetAtTime(73 + pitch * 90, t, 0.2);
  },
  stopLoops() {
    this.setEngine(0, 0, false); this.setSkid(0); this.setCrowd(0); this.setPack(0, 0);
  },

  // ------------------------------------------------ one-shots
  crash(intensity, pan = 0, metal = true) {
    if (!this.ctx) return;
    const t = this.t;
    const i = clamp(intensity, 0.05, 1);
    const out = this.panned(pan);
    this.burst(t, 0.18 + i * 0.5, 0.5 + i * 0.6, out, 'lowpass', 900 + i * 2500, 0.8, 120);
    this.osc('sine', 120 + Math.random() * 30, t, 0.25 + i * 0.2, 0.5 * i + 0.1, out, { to: 38 });

      const base = 300 + Math.random() * 500;
      for (const r of [1, 1.47, 2.09, 2.83]) this.osc('square', base * r, t + Math.random() * 0.02, 0.12 + i * 0.35, 0.05 * i + 0.02, out, { filter: 'bandpass', ff: base * r, q: 6 });
    }
  },
  scrape(intensity, pan = 0) {
    if (!this.ctx) return;

  },
  thud(intensity) {

  },
  explosion(pan = 0, near = 1) {
    if (!this.ctx) return;
    const t = this.t;
    const out = this.panned(pan);
    this.burst(t, 1.8, 1.1 * near, out, 'lowpass', 2400, 0.7, 60);
    this.osc('sine', 70, t, 1.4, 0.9 * near, out, { to: 24 });
    this.burst(t + 0.05, 0.9, 0.4 * near, out, 'highpass', 3000);
    for (let k = 0; k < 4; k++) this.burst(t + 0.3 + k * 0.17 * Math.random(), 0.2, 0.25 * near, out, 'bandpass', 1500 + Math.random() * 2000, 3);
  },
  horn() {
    if (!this.ctx) return;
    const t = this.t;
    this.osc('sawtooth', 392, t, 0.45, 0.12, this.sfxBus, { filter: 'lowpass', ff: 1800, attack: 0.01 });
    this.osc('sawtooth', 494, t, 0.45, 0.1, this.sfxBus, { filter: 'lowpass', ff: 1800, attack: 0.01 });
  },
  cheer(amount = 1) {

    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = 0.6;

    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);

    s.start(t, Math.random()); s.stop(t + 2.5);

  },
  ui(kind) {
    if (!this.ctx) return;
    const t = this.t;
    if (kind === 'move') this.osc('square', 660, t, 0.05, 0.05, this.sfxBus, { filter: 'lowpass', ff: 2500 });
    else if (kind === 'ok') { this.osc('square', 520, t, 0.07, 0.07, this.sfxBus); this.osc('square', 780, t + 0.06, 0.12, 0.07, this.sfxBus); }
    else if (kind === 'back') { this.osc('square', 520, t, 0.07, 0.06, this.sfxBus); this.osc('square', 350, t + 0.06, 0.12, 0.06, this.sfxBus); }
    else if (kind === 'adjust') this.osc('triangle', 880, t, 0.05, 0.08, this.sfxBus);
  },
  beep(high) {
    if (!this.ctx) return;
    this.osc('square', high ? 1046 : 523, this.t, high ? 0.7 : 0.3, 0.12, this.sfxBus, { filter: 'lowpass', ff: 3000 });
  },
  points() {
    if (!this.ctx) return;
    const t = this.t;
    [784, 988, 1175, 1568].forEach((f, k) => this.osc('square', f, t + k * 0.05, 0.12, 0.05, this.sfxBus, { filter: 'lowpass', ff: 4000 }));
  },
  repairTick() {
    if (!this.ctx) return;
    this.osc('square', 1400 + Math.random() * 400, this.t, 0.04, 0.04, this.sfxBus, { filter: 'bandpass', ff: 2000, q: 5 });
    this.burst(this.t, 0.06, 0.08, this.sfxBus, 'highpass', 4000);
  },

  // ------------------------------------------------ Animalese / gibberish voice
  speak(text, opts = {}) {
    if (!this.ctx) return Math.min(4.5, 0.9 + text.length * 0.045);
    const c = this.ctx;
    const base = opts.pitch || 150;
    const excite = opts.excite || 1;
    let t = c.currentTime + 0.05;
    const start = t;
    const F = { a: [800, 1200], e: [500, 1800], i: [320, 2300], o: [480, 900], u: [350, 800], y: [320, 2200] };
    const clean = text.toLowerCase().replace(/[^a-z!?.,' ]/g, '').slice(0, 90);
    let pitch = base;
    for (let k = 0; k < clean.length; k++) {
      const ch = clean[k];
      if (ch === ' ') { t += 0.03; continue; }
      if (ch === ',' || ch === '.') { t += 0.12; pitch = base; continue; }
      if (ch === '!' || ch === '?') { t += 0.1; continue; }
      if (ch === "'") continue;
      const vowel = F[ch];
      // contour: excited announcer rises toward the end of each phrase
      pitch = base * excite * (1 + 0.18 * Math.sin(k * 1.7) + (clean.indexOf('!', k) >= 0 ? 0.12 : 0)) * (0.92 + Math.random() * 0.16);
      if (vowel) {
        const dur = 0.075;
        const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(pitch, t);
        o.frequency.linearRampToValueAtTime(pitch * (1.05 + Math.random() * 0.1), t + dur);
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        for (const fq of vowel) {
          const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = fq; bp.Q.value = 7;
          g.connect(bp); bp.connect(this.voiceBus);
        }
        o.start(t); o.stop(t + dur + 0.02);
        t += dur * 0.85;
      } else {
        const dur = 0.035;
        const o = c.createOscillator(); o.type = 'square'; o.frequency.value = pitch * 1.5;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.08, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 'sz'.includes(ch) ? 5000 : 2200; bp.Q.value = 3;
        o.connect(g); g.connect(bp); bp.connect(this.voiceBus);
        o.start(t); o.stop(t + dur + 0.02);
        if ('sztkpfch'.includes(ch)) this.burst(t, 0.04, 0.12, this.voiceBus, 'highpass', 3500);
        t += dur * 0.9;
      }
    }
    return t - start + 0.3;
  },
};

// ---------------------------------------------------------------- music: a tiny rock band in a sequencer
const Music = {
  song: null, name: null, step: 0, next: 0, timer: null, bar: 0,
  songs: {
    // chord roots as MIDI notes, one per bar
    menu: { bpm: 112, prog: [40, 40, 43, 45, 40, 40, 47, 45], kick: 'x.....x.x.......', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', gtr: 'x..x..x...x.x...', bass: 'x.x.x.xxx.x.x.xx', lead: true },
    race: { bpm: 156, prog: [40, 40, 45, 43, 40, 40, 38, 47], kick: 'x...x...x...x.x.', snare: '....x.......x..x', hat: 'xxxxxxxxxxxxxxxx', gtr: 'x.xxx.xxx.xxx.x.', bass: 'xxxxxxxxxxxxxxxx', lead: true },
    derby: { bpm: 138, prog: [38, 38, 41, 43, 38, 38, 45, 44], kick: 'x..x..x.x..x..x.', snare: '....x.......x...', hat: 'x.xxx.xxx.xxx.xx', gtr: 'x..x..x.x..x..x.', bass: 'x..x..x.x..x..x.', lead: true },
    results: { bpm: 96, prog: [45, 41, 36, 43], kick: 'x.......x.x.....', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', gtr: 'x.......x.......', bass: 'x...x...x...x...', lead: false },
  },
  play(name) {
    if (this.name === name) return;
    this.name = name;
    this.song = this.songs[name] || null;
    this.step = 0; this.bar = 0;
    this.resume();
  },
  stop() { this.name = null; this.song = null; },
  resume() {
    if (!Audio.ctx || !this.song) return;
    this.next = Audio.ctx.currentTime + 0.08;
    if (!this.timer) this.timer = setInterval(() => this.tick(), 25);
  },
  tick() {
    const c = Audio.ctx;
    if (!c || !this.song) return;
    if (this.next < c.currentTime - 0.3) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.12) {
      this.schedule(this.step, this.next);
      this.next += 60 / this.song.bpm / 4;
      this.step++;
    }
  },
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  schedule(step, t) {
    const s = this.song;
    const i = step % 16;
    const bar = Math.floor(step / 16);
    const root = s.prog[bar % s.prog.length];
    const bus = Audio.musicBus;
    const sixteenth = 60 / s.bpm / 4;
    const fill = bar % 8 === 7 && i >= 12;
    if (s.kick[i] === 'x') Audio.osc('sine', 150, t, 0.16, 0.9, bus, { to: 42, glide: 0.1 });
    if (s.snare[i] === 'x' || (fill && i % 2 === 0)) { Audio.burst(t, 0.16, 0.5, bus, 'bandpass', 1900, 0.9); Audio.osc('triangle', 190, t, 0.08, 0.25, bus); }
    if (s.hat[i] === 'x') Audio.burst(t, i % 4 === 2 ? 0.08 : 0.035, 0.16, bus, 'highpass', 7500);
    if (i === 0 && bar % 4 === 0) Audio.burst(t, 1.2, 0.18, bus, 'highpass', 5000); // crash cymbal
    if (s.bass[i] === 'x') Audio.osc('sawtooth', this.hz(root - 12 + (i === 14 ? 7 : 0)), t, sixteenth * 1.6, 0.22, bus, { filter: 'lowpass', ff: 420, q: 2 });
    if (s.gtr[i] === 'x') {
      const long = i === 0 || i === 8;
      this.power(root + 12, t, long ? sixteenth * 3.5 : sixteenth * 0.9, long ? 0.12 : 0.09);
    }
    if (s.lead && bar % 8 >= 4 && (i % 3 === 0 || i === 14)) {
      const scale = [0, 3, 5, 7, 10, 12, 15];
      const n = scale[(bar * 7 + i * 5 + Math.floor(i / 3)) % scale.length];
      Audio.osc('square', this.hz(root + 24 + n), t, sixteenth * 2.2, 0.045, bus, { filter: 'lowpass', ff: 2600, detune: 8 });
    }
  },
  power(root, t, dur, gain) {
    const c = Audio.ctx;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const sh = c.createWaveShaper(); sh.curve = Audio.distCurve;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2800;
    g.connect(sh); sh.connect(lp); lp.connect(Audio.musicBus);
    for (const [iv, dt] of [[0, -6], [7, 5], [12, 0]]) {
      const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = this.hz(root + iv); o.detune.value = dt;
      o.connect(g); o.start(t); o.stop(t + dur + 0.02);
    }
  },
};

// ---------------------------------------------------------------- tracks: data-driven circuits and the bowl
const G_WORLD = 0x0001, G_CAR = 0x0002, G_DEBRIS = 0x0004;
const groups = (member, filter) => ((member & 0xffff) << 16) | (filter & 0xffff);
const GROUPS_WORLD = groups(G_WORLD, 0xffff);
const GROUPS_CAR = groups(G_CAR, G_WORLD | G_CAR | G_DEBRIS);
const GROUPS_DEBRIS = groups(G_DEBRIS, G_WORLD | G_CAR);
const GROUPS_WHEELRAY = groups(G_WORLD, G_WORLD);

function lemniscate(A, B, n, t0) {
  const pts = [];
  for (let k = 0; k < n; k++) {
    const t = t0 + (k / n) * TAU;
    pts.push([A * Math.sin(t), (B / 2) * Math.sin(2 * t), 0]);
  }
  return pts;
}

/** Track data: designers add a circuit by listing control points [x, z, height]. */
const TRACK_DEFS = [
  {
    id: 'pine', name: 'Pine Valley Speedway', blurb: 'Fast sweepers, a banked hairpin, the Big Hump jump and a pit lane.',
    type: 'circuit', width: 15, bank: 14, seed: 11, ground: 0x5f9e3c, sky: 0,
    pts: [[-40, 0, 0], [40, 0, 0], [120, 0, 0], [178, 18, 0], [200, 66, 0], [176, 108, 0], [118, 116, 0], [92, 104, 0.6], [66, 90, 4.6], [50, 86, 5.4], [22, 90, 0.4], [-14, 112, 0], [-40, 140, 0], [-90, 152, 0], [-150, 124, 0], [-182, 64, 0], [-168, 16, 0], [-120, 0, 0]],
    pit: { from: 30, to: 150 }, laps: 3,
  },
  {
    id: 'cross', name: 'Crossover Chaos', blurb: 'A figure-eight. Two lanes of traffic meet in the middle. Every lap.',
    type: 'circuit', width: 16, bank: 12, seed: 23, ground: 0x7aa34a,
    pts: lemniscate(132, 172, 20, Math.PI * 0.25).map((p) => [p[0], p[1], 0]),
    laps: 4,
  },
  {
    id: 'bowl', name: 'The Mud Hollow Bowl', blurb: 'No laps. No mercy. Last car running takes the bonus.',
    type: 'bowl', a: 62, b: 44, bankW: 11, bankH: 4.2, wallH: 3.2, island: 7.5, seed: 37, ground: 0x6f8f3a,
  },
];
const trackDef = (id) => TRACK_DEFS.find((t) => t.id === id) || TRACK_DEFS[0];

class Track {
  constructor(def, world, scene) {
    this.def = def;
    this.id = def.id;
    this.world = world;
    this.group = new THREE.Group();
    scene.add(this.group);
    this.surface = new Map(); // collider handle -> 'road' | 'grass' | 'dirt' | 'wall'
    this.crowd = [];
    this.lights = [];
    this.rng = mulberry(def.seed);
    this.isBowl = def.type === 'bowl';
    this.buildGround();
    if (this.isBowl) this.buildBowl();
    else this.buildCircuit();
    this.buildScenery();
    this.buildMinimap();
  }

  addCollider(desc, kind) {
    desc.setCollisionGroups(GROUPS_WORLD).setFriction(kind === 'wall' ? 0.25 : 0.9).setRestitution(kind === 'wall' ? 0.3 : 0.05);
    const c = this.world.createCollider(desc);
    this.surface.set(c.handle, kind);
    return c;
  }
  surfaceOf(handle) { return this.surface.get(handle) || 'road'; }

  buildGround() {
    const g = new THREE.Mesh(new THREE.CircleGeometry(1100, 64).rotateX(-Math.PI / 2), toon(this.def.ground));
    g.receiveShadow = true;
    this.group.add(g);
    // a few darker field patches for depth
    const patchMat = toon(new THREE.Color(this.def.ground).multiplyScalar(0.82).getHex());
    for (let k = 0; k < 26; k++) {
      const m = new THREE.Mesh(new THREE.CircleGeometry(rand(18, 60), 12).rotateX(-Math.PI / 2), patchMat);
      m.position.set((this.rng() - 0.5) * 900, 0.01, (this.rng() - 0.5) * 900);
      m.receiveShadow = true;
      this.group.add(m);
    }
    this.addCollider(RAPIER.ColliderDesc.cuboid(1100, 1, 1100).setTranslation(0, -1, 0), this.isBowl ? 'dirt' : 'grass');
  }

  // ------------------------------------------------ circuits
  buildCircuit() {
    const d = this.def;
    const curve = new THREE.CatmullRomCurve3(d.pts.map((p) => new THREE.Vector3(p[0], p[2] + 0.06, p[1])), true, 'centripetal');
    const length = curve.getLength();
    const N = Math.round(length / 2.5);
    const pts = curve.getSpacedPoints(N);
    pts.pop();
    this.N = N;
    this.length = length;
    this.spacing = length / N;
    this.width = d.width;
    const up = new THREE.Vector3(0, 1, 0);
    const S = [];
    for (let i = 0; i < N; i++) {
      const p = pts[i];
      const t = new THREE.Vector3().subVectors(pts[(i + 1) % N], pts[(i - 1 + N) % N]).normalize();
      S.push({ p, t, s: i * this.spacing });
    }
    // signed curvature (positive = right turn) and smoothed banking
    const raw = S.map((_, i) => {
      const a = S[(i - 2 + N) % N].t, b = S[(i + 2) % N].t;
      const cr = new THREE.Vector3().crossVectors(a, b).y;
      return -cr / (4 * this.spacing);
    });
    for (let i = 0; i < N; i++) {
      let k = 0;
      for (let j = -4; j <= 4; j++) k += raw[(i + j + N) % N];
      S[i].k = k / 9;
    }
    for (let i = 0; i < N; i++) {
      const s = S[i];
      const bank = clamp(s.k * d.bank, -0.3, 0.3);
      const r0 = new THREE.Vector3().crossVectors(s.t, up).normalize();
      s.bank = bank;
      s.r = r0.clone().multiplyScalar(Math.cos(bank)).addScaledVector(up, -Math.sin(bank)).normalize();
      s.up = new THREE.Vector3().crossVectors(s.r, s.t).normalize();
      s.flatR = r0;
    }
    this.samples = S;
    // curvature lookahead for AI braking
    this.absK = S.map((s) => Math.abs(s.k));
    // crossings: wall segments near a non-adjacent part of the course are removed
    const near = new Uint8Array(N);
    const half = d.width / 2 + 2.5;
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < N; j += 1) {
        const di = Math.min(Math.abs(i - j), N - Math.abs(i - j));
        if (di < 25) continue;
        const dx = S[i].p.x - S[j].p.x, dz = S[i].p.z - S[j].p.z;
        if (dx * dx + dz * dz < (half + d.width / 2 + 2) ** 2) { near[i] = 1; break; }
      }
    }
    this.crossing = near;
    // pit lane range (sample indices)
    this.pit = null;
    if (d.pit) {
      const a = Math.round(d.pit.from / this.spacing), b = Math.round(d.pit.to / this.spacing);
      const mid = Math.round((a + b) / 2);
      this.pit = { a, b, boxA: mid - 5, boxB: mid + 5, mid, lateral: -(d.width / 2 + 7) };
    }
    this.buildRoad();
    this.buildWalls();
    if (this.pit) this.buildPit();
    this.buildGantry();
  }

  edge(i, off) {
    const s = this.samples[(i + this.N) % this.N];
    return new THREE.Vector3().copy(s.p).addScaledVector(s.r, off);
  }

  stripMesh(offA, offB, colorFn, lift = 0, collider = null) {
    const N = this.N;
    const pos = [], col = [], idx = [];
    const c = new THREE.Color();
    for (let i = 0; i <= N; i++) {
      const a = this.edge(i % N, offA), b = this.edge(i % N, offB);
      a.y += lift; b.y += lift;
      pos.push(a.x, a.y, a.z, b.x, b.y, b.z);
      c.set(colorFn(i % N));
      col.push(c.r, c.g, c.b, c.r, c.g, c.b);
      if (i < N) { const k = i * 2; idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3); }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    // ensure normals point up for the road (winding depends on direction of travel)
    const nrm = geo.attributes.normal;
    if (nrm.getY(0) < 0) {
      for (let i = 0; i < idx.length; i += 3) { const t = idx[i + 1]; idx[i + 1] = idx[i + 2]; idx[i + 2] = t; }
      geo.setIndex(idx);
      geo.computeVertexNormals();
    }
    const mesh = new THREE.Mesh(geo, toon(0xffffff, { vertexColors: true }));
    mesh.receiveShadow = true;
    this.group.add(mesh);
    if (collider) this.addCollider(RAPIER.ColliderDesc.trimesh(new Float32Array(pos), new Uint32Array(geo.index.array)), collider);
    return mesh;
  }

  buildRoad() {
    const w = this.width / 2;
    const asphalt = (i) => (this.crossing[i] ? 0x4d4954 : (i % 40 < 20 ? 0x504b57 : 0x4b4651));
    // collision surface: road + curbs + a lip under the walls
    this.stripMesh(-w - 1.6, w + 1.6, asphalt, -0.02, 'road');
    this.stripMesh(-w, w, asphalt, 0.0);
    const curb = (i) => (Math.floor(i / 2) % 2 ? 0xe8443a : 0xf4f1ea);
    this.stripMesh(-w - 1.1, -w, curb, 0.02);
    this.stripMesh(w, w + 1.1, curb, 0.02);
    // dashed centre line
    const pos = [], idx = [];
    for (let i = 0; i < this.N; i += 4) {
      if (this.crossing[i]) continue;
      const a = this.edge(i, -0.18), b = this.edge(i, 0.18), c2 = this.edge(i + 2, -0.18), d2 = this.edge(i + 2, 0.18);
      const k = pos.length / 3;
      for (const v of [a, b, c2, d2]) pos.push(v.x, v.y + 0.035, v.z);
      idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3, k, k + 1, k + 2, k + 1, k + 3, k + 2);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    this.group.add(new THREE.Mesh(g, flat(0xf2e9c9)));
    // start / finish checker
    const s0 = this.samples[0];
    const chk = new THREE.Mesh(new THREE.PlaneGeometry(this.width, 3), new THREE.MeshBasicMaterial({ map: checkerTexture(8) }));
    chk.position.copy(s0.p).addScaledVector(s0.up, 0.04);
    chk.quaternion.setFromRotationMatrix(_m1.makeBasis(s0.r, s0.t, s0.up));
    this.group.add(chk);
  }

  buildWalls() {
    const w = this.width / 2 + 1.1;
    const H = 1.4;
    for (const side of [-1, 1]) {
      const pos = [], col = [], idx = [];
      const c = new THREE.Color();
      let seg = 0;
      for (let i = 0; i < this.N; i++) {
        const skipPit = this.pit && side < 0 && i >= this.pit.a && i < this.pit.b;
        if (this.crossing[i] || this.crossing[(i + 1) % this.N] || skipPit) continue;
        const s = this.samples[i], s2 = this.samples[(i + 1) % this.N];
        const a = this.edge(i, side * w), b = this.edge(i + 1, side * w);
        const out = s.flatR.clone().multiplyScalar(side), out2 = s2.flatR.clone().multiplyScalar(side);
        // visual: inner face, top, outer face as one band, with skirt down to the ground
        const quads = [
          [a, b, b.clone().setY(b.y + H), a.clone().setY(a.y + H)],
          [a.clone().setY(a.y + H), b.clone().setY(b.y + H), b.clone().addScaledVector(out2, 0.8).setY(b.y + H), a.clone().addScaledVector(out, 0.8).setY(a.y + H)],
          [a.clone().addScaledVector(out, 0.8).setY(a.y + H), b.clone().addScaledVector(out2, 0.8).setY(b.y + H), b.clone().addScaledVector(out2, 0.8 + Math.max(0.3, b.y * 1.6)).setY(0), a.clone().addScaledVector(out, 0.8 + Math.max(0.3, a.y * 1.6)).setY(0)],
        ];
        const band = Math.floor(i / 3) % 2 ? 0xf4f1ea : (this.def.id === 'cross' ? 0x3b82f6 : 0xe8443a);
        quads.forEach((q, qi) => {
          const k = pos.length / 3;
          for (const v of q) pos.push(v.x, v.y, v.z);
          c.set(qi === 2 ? (a.y > 0.8 ? 0x7d6a4f : 0x9a9aa2) : qi === 1 ? 0xb9b9c2 : band);
          for (let n = 0; n < 4; n++) col.push(c.r, c.g, c.b);
          if (side > 0) idx.push(k, k + 1, k + 2, k, k + 2, k + 3);
          else idx.push(k, k + 2, k + 1, k, k + 3, k + 2);
        });
        // physics: one solid block per segment
        const mid = a.clone().add(b).multiplyScalar(0.5);
        const dir = b.clone().sub(a);
        const len = dir.length();
        dir.normalize();
        const yAxis = new THREE.Vector3(0, 1, 0);
        const xAxis = new THREE.Vector3().crossVectors(yAxis, dir).normalize();
        const yA = new THREE.Vector3().crossVectors(dir, xAxis).normalize();
        const q = new THREE.Quaternion().setFromRotationMatrix(_m1.makeBasis(xAxis, yA, dir));
        const center = mid.clone().addScaledVector(s.flatR, side * 0.6).addScaledVector(yA, 0.9);
        this.addCollider(RAPIER.ColliderDesc.cuboid(0.6, 1.3, len / 2 + 0.12).setTranslation(center.x, center.y, center.z).setRotation({ x: q.x, y: q.y, z: q.z, w: q.w }), 'wall');
        seg++;
        // tyre stacks on the outside of the tight corners
        if (i % 3 === 0 && Math.abs(s.k) > 1 / 75 && Math.sign(s.k) === -side) this.tyreStack(a.clone().addScaledVector(out, 1.6));
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, toon(0xffffff, { vertexColors: true }));
      mesh.castShadow = true; mesh.receiveShadow = true;
      this.group.add(mesh);
    }
  }

  tyreStack(p) {
    if (!this.tyreGeo) {
      this.tyreGeo = new THREE.TorusGeometry(0.42, 0.2, 6, 10).rotateX(Math.PI / 2);
      this.tyreList = [];
    }
    for (let h = 0; h < 3; h++) this.tyreList.push(new THREE.Vector3(p.x, p.y + 0.2 + h * 0.4, p.z));
  }

  /** 0 at the pit lane's ends, 1 along the middle: the apron and its wall taper in and out. */
  pitTaper(i) {
    const P = this.pit;
    const k = 12;
    return clamp(Math.min(i - P.a, P.b - i) / k, 0, 1);
  }
  buildPit() {
    const P = this.pit;
    const w = this.width / 2;
    const out = (i) => -w - 1.1 - 12 * this.pitTaper(i);
    const pos = [], idx = [], col = [];
    const c = new THREE.Color();
    for (let i = P.a; i <= P.b; i++) {
      const a = this.edge(i, -w - 0.2), b = this.edge(i, out(i) - 0.8);
      a.y += 0.01; b.y = a.y;
      pos.push(a.x, a.y, a.z, b.x, b.y, b.z);
      const inBox = i >= P.boxA && i <= P.boxB;
      c.set(inBox ? 0xf5b700 : (i % 6 < 3 ? 0x5d5866 : 0x575260));
      col.push(c.r, c.g, c.b, c.r, c.g, c.b);
      if (i < P.b) { const k = (i - P.a) * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    if (geo.attributes.normal.getY(0) < 0) {
      for (let i = 0; i < idx.length; i += 3) { const t = idx[i + 1]; idx[i + 1] = idx[i + 2]; idx[i + 2] = t; }
      geo.setIndex(idx); geo.computeVertexNormals();
    }
    const m = new THREE.Mesh(geo, toon(0xffffff, { vertexColors: true }));
    m.receiveShadow = true;
    this.group.add(m);
    this.addCollider(RAPIER.ColliderDesc.trimesh(new Float32Array(pos), new Uint32Array(idx)), 'road');
    // outer pit wall follows the taper, so the lane opens and closes diagonally
    const wallMat = toon(0xd9d6cf);
    const block = (a, b, h = 1.4) => {
      const mid = a.clone().add(b).multiplyScalar(0.5);
      const dir = b.clone().sub(a); const len = dir.length(); dir.normalize();
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, h, len + 0.2), wallMat);
      mesh.position.copy(mid).setY(mid.y + h / 2);
      mesh.lookAt(b.x, mid.y + h / 2, b.z);
      shadowed(mesh);
      this.group.add(mesh);
      this.addCollider(RAPIER.ColliderDesc.cuboid(0.5, 1.3, len / 2 + 0.1).setTranslation(mid.x, mid.y + 0.9, mid.z).setRotation({ x: mesh.quaternion.x, y: mesh.quaternion.y, z: mesh.quaternion.z, w: mesh.quaternion.w }), 'wall');
    };
    for (let i = P.a; i < P.b; i++) block(this.edge(i, out(i) - 0.5), this.edge(i + 1, out(i + 1) - 0.5));
    // divider between the racing line and the pit lane: in at the start, out at the end
    P.divA = P.a + 12; P.divB = P.b - 12;
    for (let i = P.divA; i < P.divB; i++) block(this.edge(i, -w - 1.6), this.edge(i + 1, -w - 1.6), 1.0);
    // a row of cones splits the pit lane from the racing line along the box
    const cone = new THREE.ConeGeometry(0.28, 0.75, 8);
    const coneMat = toon(0xff7a1a);
    for (const i of [P.a + 2, P.a + 5, P.a + 8, P.b - 2, P.b - 5, P.b - 8]) {
      const cp = this.edge(i, -w - 0.6);
      const cm = new THREE.Mesh(cone, coneMat);
      cm.position.copy(cp).setY(cp.y + 0.38);
      this.group.add(cm);
    }
    // pit garage + sign
    const s = this.samples[P.mid];
    const gp = this.edge(P.mid, -w - 19.5);
    const garage = shadowed(new THREE.Mesh(new THREE.BoxGeometry(26, 6, 9), toon(0xc9c3b6)));
    garage.position.copy(gp).setY(gp.y + 3);
    garage.rotation.y = Math.atan2(s.t.x, s.t.z) + Math.PI / 2;
    this.group.add(garage);
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(14, 3), new THREE.MeshBasicMaterial({ map: textTexture('PIT ▸ REPAIR', { bg: '#f5b700' }) }));
    sign.position.copy(gp).setY(gp.y + 7.6);
    sign.lookAt(s.p.x, gp.y + 7.6, s.p.z);
    this.group.add(sign);
  }

  buildGantry() {
    const s = this.samples[0];
    const w = this.width / 2 + 2;
    const postMat = toon(0x2d2a33);
    for (const side of [-1, 1]) {
      const p = this.edge(0, side * w);
      const post = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.8, 8, 0.8), postMat));

    }
    const beam = new THREE.Mesh(new THREE.BoxGeometry(this.width + 5, 1.6, 0.6), new THREE.MeshBasicMaterial({ map: checkerTexture(10) }));
    beam.position.copy(s.p).setY(s.p.y + 7.4);
    beam.quaternion.setFromRotationMatrix(_m1.makeBasis(s.r.clone().negate(), s.up, s.t));
    shadowed(beam);
    this.group.add(beam);
    // start lights

    for (let k = 0; k < 3; k++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 8), new THREE.MeshBasicMaterial({ color: 0x331111 }));
      m.position.copy(s.p).addScaledVector(s.r, (k - 1) * 1.3).addScaledVector(s.t, -0.4).setY(s.p.y + 6.1);

  setStartLights(n, green) {

  // ------------------------------------------------ the bowl
  buildBowl() {
    const d = this.def;

    this.bowl = { a, b, W, H, island: d.island };
    const segs = 96;
    // dirt floor
    const floor = new THREE.Mesh(new THREE.CircleGeometry(1, 64).rotateX(-Math.PI / 2), toon(0x9a7a55));
    floor.scale.set(a + 1, 1, b + 1);
    floor.position.y = 0.02;
    floor.receiveShadow = true;
    this.group.add(floor);
    const rings = new THREE.Mesh(new THREE.RingGeometry(0.55, 0.57, 64).rotateX(-Math.PI / 2), flat(0xf2e9c9));
    rings.scale.set(a, 1, b); rings.position.y = 0.04;
    this.group.add(rings);
    // banked ring (collider + mesh)
    const pos = [], idx = [], col = [];

    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    if (geo.attributes.normal.getY(0) < 0) {
      for (let i = 0; i < idx.length; i += 3) { const t = idx[i + 1]; idx[i + 1] = idx[i + 2]; idx[i + 2] = t; }
      geo.setIndex(idx); geo.computeVertexNormals();
    }
    const bank = new THREE.Mesh(geo, toon(0xffffff, { vertexColors: true }));
    bank.receiveShadow = true;
    this.group.add(bank);
    this.addCollider(RAPIER.ColliderDesc.trimesh(new Float32Array(pos), new Uint32Array(idx)), 'road');

      widx.push(k, k + 2, k + 1, k, k + 3, k + 2);

    }
    const wg = new THREE.BufferGeometry();
    wg.setAttribute('position', new THREE.Float32BufferAttribute(wpos, 3));

    flag.position.set(2.1, 8.6, 0);

  }

  // ------------------------------------------------ scenery shared by every venue
  buildScenery() {
    const rng = this.rng;
    if (this.tyreList && this.tyreList.length) {
      const im = new THREE.InstancedMesh(this.tyreGeo, toon(0x24222a), this.tyreList.length);
      this.tyreList.forEach((p, i) => { _m1.makeRotationY(rng() * TAU).setPosition(p); im.setMatrixAt(i, _m1); });
      im.castShadow = true;
      this.group.add(im);
    }
    // grandstands with a bouncing crowd
    const stands = [];
    if (this.isBowl) {
      const { a, b, W } = this.bowl;
      for (let k = 0; k < 10; k++) {
        const t = (k / 10) * TAU + 0.2;
        const p = new THREE.Vector3(Math.cos(t) * (a + W + 6), 0, Math.sin(t) * (b + W + 6));
        stands.push({ p, face: Math.atan2(-p.x, -p.z), len: 26 });
      }
    } else {
      for (const frac of [0.04, 0.33, 0.62, 0.85]) {
        const i = Math.floor(frac * this.N);
        const s = this.samples[i];
        const side = this.pit && i >= this.pit.a - 10 && i <= this.pit.b + 10 ? 1 : (s.k > 0 ? -1 : 1);
        const p = this.edge(i, side * (this.width / 2 + 12));
        p.y = 0;
        const face = Math.atan2(s.p.x - p.x, s.p.z - p.z);
        stands.push({ p, face, len: 34 });
      }
    }
    const crowdGeo = new THREE.BoxGeometry(0.55, 0.9, 0.45);
    const crowdMat = toon(0xffffff);
    const per = 3 * 30;
    const im = new THREE.InstancedMesh(crowdGeo, crowdMat, stands.length * per);
    im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const shirt = [0xe8443a, 0x3b82f6, 0x22c55e, 0xf5b700, 0xffffff, 0xff7ab8, 0x8b5cf6, 0x111111, 0xff8a00];
    let n = 0;
    const standMat = toon(0x8d8a96), roofMat = toon(0xe8443a);
    for (const st of stands) {
      const g = new THREE.Group();
      g.position.copy(st.p);
      g.rotation.y = st.face;
      for (let tier = 0; tier < 4; tier++) {
        const b = shadowed(new THREE.Mesh(new THREE.BoxGeometry(st.len, 1.2 + tier * 1.2, 2.2), standMat));
        b.position.set(0, (1.2 + tier * 1.2) / 2, -tier * 2.2);
        g.add(b);
      }
      const roof = shadowed(new THREE.Mesh(new THREE.BoxGeometry(st.len + 2, 0.4, 10), roofMat));
      roof.position.set(0, 9.5, -3.4);
      roof.rotation.x = -0.12;
      g.add(roof);
      for (const x of [-st.len / 2, st.len / 2]) {
        const pole = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.4, 9.5, 0.4), toon(0x3a3640)));
        pole.position.set(x, 4.75, -6.8);
        g.add(pole);
      }
      const board = new THREE.Mesh(new THREE.PlaneGeometry(st.len * 0.8, 2.2), new THREE.MeshBasicMaterial({ map: textTexture(pick(['DENTCO', 'CRUNCH COLA', 'TOTAL TOWING', 'BUMPER BROS', 'RUST-O-MATIC', 'SCRAPYARD FM'])) }));
      board.position.set(0, 11.2, -0.2);
      g.add(board);
      this.group.add(g);
      g.updateMatrixWorld(true);
      for (let tier = 1; tier < 4; tier++) {
        for (let k = 0; k < 30; k++) {
          const local = new THREE.Vector3(-st.len / 2 + 0.8 + (k / 29) * (st.len - 1.6) + rand(-0.2, 0.2), 1.2 + tier * 1.2 + 0.45, -tier * 2.2 + 0.2);
          const wp = local.applyMatrix4(g.matrixWorld);
          _m1.makeRotationY(st.face).setPosition(wp);
          im.setMatrixAt(n, _m1);
          im.setColorAt(n, _c1.set(shirt[Math.floor(rng() * shirt.length)]));
          this.crowd.push({ base: wp.clone(), face: st.face, phase: rng() * TAU, speed: 6 + rng() * 6 });
          n++;
        }
      }
    }
    im.count = n;
    this.crowdMesh = im;
    this.group.add(im);
    // trees
    const trunks = [], tops = [];
    const far = (x, z) => {
      if (this.isBowl) {
        const { a, b, W } = this.bowl;
        return (x * x) / (a + W + 24) ** 2 + (z * z) / (b + W + 24) ** 2 > 1;
      }
      for (let i = 0; i < this.N; i += 3) {
        const p = this.samples[i].p;
        const dx = p.x - x, dz = p.z - z;
        if (dx * dx + dz * dz < (this.width / 2 + 22) ** 2) return false;
      }
      return true;
    };
    for (let k = 0; k < 520 && tops.length < 300; k++) {
      const x = (rng() - 0.5) * 760, z = (rng() - 0.5) * 760;
      if (!far(x, z)) continue;
      const s = 0.8 + rng() * 0.9;
      trunks.push(new THREE.Matrix4().compose(new THREE.Vector3(x, 1.5 * s, z), new THREE.Quaternion(), new THREE.Vector3(s, s, s)));
