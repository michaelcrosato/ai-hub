const CREDITS_TXT = "DESTRUCTION DERBY TOO DENTED: an original spiritual successor to Destruction Derby 2 (Reflections / Psygnosis, 1996). No original assets, names, music or code are used.\n\n## Source Information\n- Date: 2026-10-29 05:15\n- Source: Destruction Derby 2\n- Tech: Three.js r180 (three.webgpu.js + TSL, WebGPURenderer, WebGPU only, no fallback), Rapier 3D 0.19.3 (@dimforge/rapier3d-compat) for physics, Gamepad API, Web Audio API, Canvas 2D for HUD textures; plain ES modules bundled into one HTML file, libraries loaded from the jsDelivr CDN.\n- Art Direction: stylized cel shading. MeshToonMaterial with a 3-step nearest-filtered ramp, TSL toon outline pass (inverted-hull ink lines), flat vertex-coloured track dressing, toon smoke puffs and chunky sparks, hard-edged shadows, gradient sky dome.\n- Animation: procedural and physics-driven. Rapier rigid bodies with custom raycast suspension, per-vertex crumple deformation of body panels, detached parts and wheels as rigid-body debris, instanced particle systems (smoke, fire, sparks, chips, dust), instanced skid marks, a bouncing instanced crowd, spring-damped chase / TV cameras with shake.\n- Audio: all generated in code with the Web Audio API. Music is a step-sequenced rock band (distorted saw power chords, saw bass, synth kick, snare and hats, square lead) with menu, race, derby and results songs. Sound effects are synthesized (engine, tyre squeal, crunches with inharmonic metal clangs, scrapes, explosions, crowd, horn, UI blips). The announcer \"Buck Rivets\" speaks Animalese-style gibberish (formant-filtered blips per letter) with on-screen subtitles.\n- Online: AI Hub Session Protocol v1 (session.js client 1.3.0) in side-by-side (parallel) mode: every friend plays the same seeded 3-minute Bowl derby and the hub ranks wreck points; progress, result, stats and awards are reported to the hub. No other networking. Outside a session the game is a complete single-player game.\n- Testing: lightweight automated smoke tests only: headless Chromium (Playwright) with a software WebGPU adapter, console-error capture, scripted key presses through title, menus, a race, a derby and attract mode, screenshots, and the AI Hub harness automatic check. No real GPU, no real controller, no audio listening.\n- Environment: Claude Code CLI (headless); Linux; browser unknown\n- Model: Anthropic, claude-opus-5-5, reasoning effort medium\n- Usage: unknown (no cost or token meter is visible to the model in this session); session time roughly 1.5 to 2 hours (estimate).\n\n## Testing Feedback\n- How many issues did testing catch? 11 game issues: pause closing the instant it opened (Esc is also Back), a disposed event still being updated after scene swaps, damage so high that races could not be finished, an open pit lane that trapped cars against its closing wall, car-to-car hits misattributed to walls (losing wreck points), AI ramming every frame, derby AI stuck in slow shoving matches, hub probe input depending on frame timing, the probe calling the main menu 'title', oversized smoke puffs and a missing-normals warning. Plus 2 test-environment issues (headless WebGPU needed SwiftShader Vulkan flags; another agent's server owned the first test ports).\n- How many would be considered critical issues / game breaking? 3: the pause menu that could not stay open, races nobody could finish, and the pit-lane trap.\n- What was the most helpful test you ran? An autopilot logic test: the player car driven by the AI through a full race, a derby and a championship round with rendering skipped, logging every impact. It exposed the damage, pit-lane and attribution bugs at once.\n- What was the least helpful test you ran? Raw frame-rate observations, since the software WebGPU adapter (about 3 fps) says nothing about real hardware.\n\n## Engine Feedback\n- What did you like most about the engine? Three.js r180's WebGPU renderer plus the built-in toonOutlinePass gives a convincing cel look in a few lines, and Rapier's ray casts, contact queries and persistent forces make a custom arcade vehicle straightforward.\n- Did you get stuck or guess wrong? Mostly small API guesses: Rapier forces persist until resetForces, ray hits expose timeOfImpact (not toi), and the outline pass only inks MeshToonMaterial, so particles and decals had to be chosen deliberately.\n- What was the most important thing you had to build yourself? The vehicle model (raycast suspension, friction circle, handbrake drift, damage-driven handling) and the impact pipeline that turns velocity jumps into zones, dents, flying parts and derby points.\n- What was the hardest part about using the engine? Verifying WebGPU output without a real GPU: headless runs use a software adapter, so visuals and timing can only be sanity-checked.\n- If you had to remove or overhaul one thing from engine, what would that be? The split between WebGL-era materials and node materials; it is easy to pick a material the outline or post pass silently ignores.\n- If you could change one thing about the engine, what would it be? A first-party arcade vehicle controller in Rapier's JS API with tunable tyre curves and per-wheel surface callbacks.\n\n## Prompt Feedback\n- What did you like most about this prompt? Clear deliverable, explicit stack and versions, and a concrete multiplayer contract with a test harness.\n- What was confusing? \"Follow the hub for multiplayer as well as for the game on its own\" can read as either \"also support standalone play\" or \"also add local multiplayer\"; this build chose standalone single player plus hub sessions.\n- What was the hardest thing to do? Fitting a full vertical slice (damage model, three venues, four modes, championship, attract mode, synthesized audio, hub session) into one file while keeping it testable headless.\n- If there was one test you could have run, what would that test be? A play session on real hardware with a DualSense, to tune handling, damage numbers and rumble by feel.";

function glyph(name) {
  const pad = Input.device === 'pad';
  const map = {
    confirm: pad ? '✕' : 'ENTER', back: pad ? '○' : 'ESC', triangle: pad ? '△' : 'R', options: pad ? 'OPTIONS' : 'ESC',
    lr: pad ? '◀ ▶' : '← →', ud: pad ? '▲ ▼' : '↑ ↓', l1r1: pad ? 'L1 R1' : 'Q E',
  };
  return `<span class="glyph">${map[name] || name}</span>`;
}
let toastT = null;
function toast(text) {
  const el = $('#toast');
  el.textContent = text;
  el.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => (el.style.display = 'none'), 1600);
}
const hex = (c) => '#' + new THREE.Color(c).getHexString();

const UI = {
  cur: null, items: [], focus: 0, el: null,
  show(screen, arg) {
    if (this.cur && this.cur.leave) this.cur.leave();
    this.cur = screen;
    this.arg = arg;
    this.focus = screen.startFocus ?? 0;
    this.render();
    Input.lastInput = nowMs();
  },
  hide() {
    if (this.cur && this.cur.leave) this.cur.leave();
    this.cur = null;
    $('#ui').innerHTML = '';
  },
  render() {
    const s = this.cur;
    const root = $('#ui');
    root.innerHTML = `<div class="screen on ${s.cls || 'center dim'}">${s.render(this.arg)}<div class="hints">${(s.hints ? s.hints(this.arg) : defaultHints(s)).join('')}</div></div>`;
    this.el = root.firstChild;
    this.items = [...this.el.querySelectorAll('.nav')];
    this.items.forEach((it, i) => {
      it.addEventListener('mouseenter', () => this.setFocus(i, true));
      it.addEventListener('click', (e) => {
        this.setFocus(i, true);
        const r = it.getBoundingClientRect();
        if (it.dataset.adjust !== undefined && s.adjust) s.adjust(it, e.clientX < r.left + r.width / 2 ? -1 : 1, this.arg);
        else if (s.activate) { Audio.ui('ok'); s.activate(it, this.arg); }
      });
    });
    this.el.querySelectorAll('[data-click]').forEach((b) => b.addEventListener('click', () => this.handleClick(b.dataset.click)));
    this.focus = clamp(this.focus, 0, Math.max(0, this.items.length - 1));
    this.setFocus(this.focus, true, true);
  },
  handleClick(what) {
    if (what === 'back' && this.cur.back) { Audio.ui('back'); this.cur.back(this.arg); }
    else if (what === 'confirm' && this.cur.activate) this.cur.activate(this.items[this.focus], this.arg);
    else if (what === 'confirm' && this.cur.confirm) this.cur.confirm(this.arg);
  },
  setFocus(i, silent, instant) {
    if (!this.items.length) return;
    i = (i + this.items.length) % this.items.length;
    if (i !== this.focus && !silent) Audio.ui('move');
    this.items.forEach((it, k) => it.classList.toggle('focus', k === i));
    this.focus = i;
    this.items[i].scrollIntoView({ block: 'nearest', behavior: instant ? 'auto' : 'smooth' });
  },
  refreshItem(it, html) { it.querySelector('.val').innerHTML = html; },
  update(dt) {
    const s = this.cur;
    if (!s) return;
    if (s.tick) s.tick(dt, this.arg);
    if (this.cur !== s) return;
    const n = Input.nav;
    const it = this.items[this.focus];
    if (n.up) this.setFocus(this.focus - 1);
    if (n.down) this.setFocus(this.focus + 1);
    if ((n.left || n.right) && it) {
      if (it.dataset.adjust !== undefined && s.adjust) { s.adjust(it, n.left ? -1 : 1, this.arg); Audio.ui('adjust'); }
      else if (s.page) s.page(n.left ? -1 : 1, this.arg);
      else if (s.horizontal) this.setFocus(this.focus + (n.left ? -1 : 1));
    }
    if (s.scroll) {
      const box = this.el.querySelector('.scroll');
      if (box && (Input.axes[3] || Input.nav.up || Input.nav.down)) box.scrollTop += Input.axes[3] * dt * 600;
    }
    if (Input.confirm) {
      if (s.activate && it) { Audio.ui('ok'); s.activate(it, this.arg); }
      else if (s.confirm) s.confirm(this.arg);
      Input.confirm = false;
    } else if ((Input.back || (s.pauseCloses && Input.pause)) && s.back) {
      Audio.ui('back');
      s.back(this.arg);
      Input.back = false;
      Input.pause = false;
    }
  },
};
function defaultHints(s) {
  const h = [];
  if (s.activate || s.confirm) h.push(`<span data-click="confirm" style="pointer-events:auto;cursor:pointer">${glyph('confirm')} ${s.confirmLabel || 'SELECT'}</span>`);
  if (s.back) h.push(`<span data-click="back" style="pointer-events:auto;cursor:pointer">${glyph('back')} BACK</span>`);
  return h;
}

    <div class="menu" style="margin-top:3vh">${tile('settings', 'SETTINGS', '', null, 'noarrows')}</div></div>`,
  hints: () => [],
  activate: () => UI.show(Screens.settings, { from: Screens.touch }),
};

Screens.sessionReady = {
  render: (info) => `<div class="card" style="text-align:center"><div class="big">THE BOWL · 3 MINUTES</div>
    <div class="rows">${info.players.map((p) => `<div class="row"><span class="nm"><span class="swatch" style="background:${escapeText(p.color || '#888')}"></span>${escapeText(p.name)}</span></div>`).join('')}</div>
    <div class="press" style="margin-top:3vh">Press any key, click or tap when you are ready</div></div>`,
  hints: () => [],
  tick: () => { if (Input.anyPressed) { AIHub.ready(); UI.hide(); } },
};
Screens.sessionOver = {
  render: (r) => `<div class="card" style="text-align:center"><div class="sub">ROUND OVER</div><div class="big">${r.points} POINTS</div>
    <p class="sub">${r.wrecks} wrecks · ${r.spins} spins · ${r.survived ? 'survived the Bowl' : 'wrecked'}</p><p class="sub">The hub has your score.</p></div>`,
  hints: () => [],
};

// ==== 09-main.js
// ---------------------------------------------------------------- game flow
const ATTRACT_EVENTS = [
  { mode: 'wreck', track: 'cross', laps: 3, opponents: 11 },
  { mode: 'derby', track: 'bowl', time: 150, opponents: 11 },
  { mode: 'wreck', track: 'pine', laps: 3, opponents: 11 },
];
const ATTRACT_CAPTIONS = [
  'SPIN RIVALS FOR POINTS', 'WRECK THEM FOR +10', 'PANELS DENT · PARTS FLY OFF', 'FLIP · ROLL · RECOVER',
  'PIT LANE REPAIRS AT PINE VALLEY', 'LAST CAR RUNNING WINS THE BOWL', 'CHAMPIONSHIP: CLIMB 4 DIVISIONS',
];

const Game = {
  mode: 'boot', event: null, cfg: null, paused: false, attractIdx: 0, attractT: 0, captionT: 0, sessionInfo: null,

  setEvent(ev) {
    if (this.event) this.event.dispose();
    this.event = ev;
  },
  backdrop() {
    this.setEvent(new Event({ mode: 'derby', track: 'bowl', backdrop: true }));
    Audio.stopLoops();
  },
  toTitle() {
    this.mode = 'title';
    this.endAttract();
    this.hud(false);
    this.paused = false;
    if (!this.event || !this.event.backdrop) this.backdrop();
    Music.play('menu');
    Announcer.clear();
    UI.show(Screens.title);
  },
  toMenu(screen) {
    this.mode = 'menu';
    this.paused = false;
    this.hud(false);
    if (!this.event || !this.event.backdrop) this.backdrop();
    Music.play('menu');
    Announcer.clear();
    UI.show(screen || Screens.menu);
  },
  startEvent(cfg) {
    this.cfg = cfg;
    this.mode = 'event';
    this.paused = false;
    UI.hide();
    Announcer.clear();
    const ev = new Event({ ...cfg, division: cfg.division || Progress.data.division });
    this.setEvent(ev);
    ev.cam.mode = Settings.data.camera;
    ev.onDone = (res) => {
      if (this.mode !== 'event') return;
      setTimeout(() => {
        if (this.event !== ev) return;
        this.hud(false);
        if (SESSION) UI.show(Screens.sessionOver, { points: ev.player.points, wrecks: ev.player.stats.wrecks, spins: ev.player.stats.spins, survived: !ev.player.wrecked });
        else UI.show(Screens.results, res);
      }, 600);
    };
    this.hud(true);
    Music.play(cfg.mode === 'derby' ? 'derby' : 'race');
  },
  restart() { if (this.cfg) this.startEvent(this.cfg); },
  pause() {
    if (!this.event || this.paused || this.event.state === 'done') return;
    this.paused = true;
    this.event.paused = true;
    Audio.stopLoops();
    UI.show(Screens.pause);
  },
  resume() {
    this.paused = false;
    if (this.event) this.event.paused = false;
    UI.hide();
  },
  hud(on) { $('#hud').classList.toggle('on', on); },

  // attract mode: AI plays the demo, any input leaves
  startAttract() {
    this.mode = 'attract';
    UI.hide();
    const cfg = ATTRACT_EVENTS[this.attractIdx++ % ATTRACT_EVENTS.length];
    this.setEvent(new Event({ ...cfg, attract: true }));
    this.attractT = 0;
    this.captionT = 0;
    this.hud(true);
    $('#demoTag').style.display = 'block';
    $('#demoPress').style.display = 'block';
    Music.play(cfg.mode === 'derby' ? 'derby' : 'race');
  },
  endAttract() {
    $('#demoTag').style.display = 'none';
    $('#demoPress').style.display = 'none';
  },

  update(dt) {
    const ev = this.event;
    if (this.mode === 'attract') {
      this.attractT += dt;
      this.captionT -= dt;
      if (this.captionT <= 0) {
        this.captionT = 4;
        $('#demoTag').textContent = `DEMO · ${pick(ATTRACT_CAPTIONS)}`;
      }
      if (Input.anyPressed) { Input.anyPressed = false; Input.confirm = false; this.toTitle(); return; }
      const alive = ev.cars.filter((c) => !c.wrecked).length;
      if (this.attractT > 48 || (ev.track.isBowl && alive <= 2)) this.startAttract();
    } else if ((this.mode === 'title' || this.mode === 'menu') && !SESSION && !$('#fatal').style.display.includes('flex')) {
      if (Input.idleSeconds() > 10 && (UI.cur === Screens.title || UI.cur === Screens.menu)) this.startAttract();
      if (ev && ev.backdrop && (ev.realT > 70 || ev.cars.filter((c) => !c.wrecked).length <= 2)) this.backdrop();
    } else if (this.mode === 'event') {
      if (Input.pause && !this.paused && UI.cur === null && !(SESSION && this.sessionEnded)) { Input.pause = false; Input.back = false; this.pause(); }
    }
    UI.update(dt);
    const live = this.event; // the branches above may have swapped events
    if (live) {
      const ev = live;
      ev.update(dt);
      if ((this.mode === 'event' || this.mode === 'attract') && $('#hud').classList.contains('on')) ev.updateHUD();
      if (SESSION && this.mode === 'event' && ev.player && !ev.reported && ev.racing) {
        const alive = ev.cars.filter((c) => !c.wrecked).length;
        AIHub.progress({ score: ev.player.points, label: `${fmtTime(Math.max(0, ev.timeLimit - ev.simTime)).slice(0, -2)} left · ${alive} cars` });
      }
    }
  },
};

// ---------------------------------------------------------------- hub session (AI Hub Session Protocol v1, side by side)
AIHub.probe(() => {
  const ev = Game.event;
  let scene = 'menu';
  if (Game.mode === 'title' && UI.cur === Screens.title) scene = 'title';
  else if (Game.mode === 'event' && ev) {
    if (ev.state === 'intro' || ev.state === 'ready' || ev.state === 'countdown') scene = 'ready';
    else if (ev.state === 'done' || ev.sessionDone || ev.over) scene = 'over';
    else scene = 'play';
  }
  return {
    scene,
    menu: Game.paused,
    world: ev ? Math.round(ev.simTime * 1000) / 1000 : 0,
    input: (() => { const i = Input.sample(); return { x: Math.round(i.steer * 100) / 100, y: Math.round((i.throttle - i.brake) * 100) / 100, fire: !!i.handbrake }; })(),
  };
});

async function startSession() {
  const info = await AIHub.connect({ mode: 'parallel', seats: [1, 4] });
  if (!info) return false;
  Game.sessionInfo = info;
  const me = info.players.find((p) => p.id === info.me);
  Game.startEvent({ mode: 'derby', track: 'bowl', time: 180, opponents: 11, session: true, playerName: me ? String(me.name).toUpperCase().slice(0, 14) : 'YOU' });
  AIHub.on('start', () => { Audio.ensure(); });
  AIHub.on('time-up', () => { const ev = Game.event; if (ev && !ev.reported) ev.report('time'); });
  AIHub.on('end', () => {
    Game.sessionEnded = true;
    const ev = Game.event;
    if (ev) { ev.paused = true; if (!ev.reported) ev.report('end'); }
    Game.paused = false;
    Audio.stopLoops();
    Music.stop();
    Announcer.clear();
    Audio.silence(true);
    Game.hud(false);
    if (ev) UI.show(Screens.sessionOver, { points: ev.player.points, wrecks: ev.player.stats.wrecks, spins: ev.player.stats.spins, survived: !ev.player.wrecked });
  });
  if (info.splash) AIHub.ready();
  else UI.show(Screens.sessionReady, info);
  return true;
}

// ---------------------------------------------------------------- boot
function fatal(msg) {
  const el = $('#fatal');
  el.innerHTML = `<div class="logo"><div class="l2" style="font-size:72px">DENTED!</div></div><div class="big">${escapeText(msg)}</div>
    <div class="sub">Destruction Derby Too Dented needs WebGPU (Chrome, Edge or another WebGPU browser with hardware acceleration on). There is no WebGL fallback.</div>`;
  el.style.display = 'flex';
  $('#loading').style.display = 'none';
  if (SESSION) AIHub.fail(msg);
}

async function boot() {
  Settings.load();
  Progress.load();
  Input.init();
  const fill = $('#loadFill');
  try {
    fill.style.width = '20%';
    await RAPIER.init();
    fill.style.width = '50%';
    await initRenderer();
    fill.style.width = '85%';
  } catch (e) {
    console.error(e);
    fatal(e && e.message ? e.message : String(e));
    return;
  }
  let last = performance.now();
  R.renderer.setAnimationLoop(() => {
    const t = performance.now();
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    Input.poll(dt);
    try {
      Game.update(dt);
    } catch (e) {
      console.error(e);
    }
    R.post.render();
    Input.endFrame();
  });
  $('#loading').style.display = 'none';
  if (SESSION && (await startSession())) return;
  const touchOnly = matchMedia('(hover: none) and (pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
  Game.backdrop();
  if (touchOnly && !Array.from(navigator.getGamepads ? navigator.getGamepads() : []).some((p) => p)) {
    Game.mode = 'menu';
    UI.show(Screens.touch);
    const go = () => { if (UI.cur === Screens.touch || UI.cur === Screens.settings) Game.toTitle(); };
    addEventListener('gamepadconnected', go, { once: true });
    addEventListener('keydown', go, { once: true });
  } else Game.toTitle();
}
window.__ddtd = { Game, Input, R, Settings, Progress, Driver, Champ, UI, Screens }; // handy for console poking and automated smoke tests
boot();

</script>
