class AudioDirector {
  constructor(){ this.ctx=null; this.master=null; this.music=null; this.enabled=true; this.musicEnabled=true; this.sfxEnabled=true; this.step=0; this.next=0; this.mode='title'; this.last={}; }
  unlock(){ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C)return; this.ctx=new C(); this.master=this.ctx.createGain(); this.master.gain.value=.48; this.master.connect(this.ctx.destination); this.music=this.ctx.createGain(); this.music.gain.value=.24; this.music.connect(this.master); } if(this.ctx.state==='suspended')this.ctx.resume(); }
  setEnabled(v){this.enabled=v;if(this.master)this.master.gain.setTargetAtTime(v?.48:0,this.ctx.currentTime,.05)}
  tone(freq,duration,type='square',volume=.1,slide=1,when=0,dest=null){if(!this.ctx||!this.enabled)return; const c=this.ctx,t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(20,freq),t);o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),t+duration);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(dest||this.master);o.start(t);o.stop(t+duration+.02)}
  sound(name){if(!this.ctx||!this.enabled||!this.sfxEnabled)return; let now=this.ctx.currentTime;if(now-(this.last[name]||-1)<(name==='fire'?.09:.05))return;this.last[name]=now;switch(name){case 'fire':this.tone(530,.1,'sawtooth',.07,.35);break;case 'hit':this.tone(130,.24,'sawtooth',.16,.25);break;case 'explosion':case 'boom':this.tone(100,.42,'sawtooth',.19,.18);this.tone(64,.48,'triangle',.15,.4);break;case 'bomb':this.tone(95,.8,'sawtooth',.22,4);this.tone(330,.6,'square',.1,.3);break;case 'pickup':this.tone(500,.12,'square',.09,1.5);this.tone(850,.18,'square',.08,1.3,.09);break;case 'roll':this.tone(250,.23,'triangle',.12,2.6);break;case 'boss':case 'warning':this.tone(110,.45,'sawtooth',.12,1.05);this.tone(146,.45,'sawtooth',.1,1.05);break;case 'voice':this.voice();break;default:this.tone(300,.1,'square',.05,1.4);}}
  voice(){ for(let i=0;i<5;i++){let f=[330,450,270,390,310][i];this.tone(f,.085,'triangle',.045,1.12,i*.09);this.tone(f*2,.08,'square',.015,.85,i*.09);} }
  tick(){ if(!this.ctx||!this.enabled||!this.musicEnabled)return;const c=this.ctx; if(this.next<c.currentTime-.3)this.next=c.currentTime+.03;while(this.next<c.currentTime+.15){const n=this.step%16, chord=[0,3,7,10][Math.floor(this.step/16)%4], lead=[0,7,12,10,7,3,5,7,0,7,12,15,10,7,5,3][n];const root=55*Math.pow(2,chord/12);this.tone(root*(n%4===0?1:2),.18,'sawtooth',.10,.98,this.next-c.currentTime,this.music);if(n%2===0)this.tone(root*4*Math.pow(2,lead/12),.105,'square',.045,.99,this.next-c.currentTime,this.music);if(n%4===0)this.tone(70,.1,'sine',.18,.35,this.next-c.currentTime,this.music);if(n%4===2)this.tone(180,.07,'triangle',.06,.3,this.next-c.currentTime,this.music);this.next+=.145;this.step++;} }
}

/* Standalone score-race rooms. AI Hub sessions use session.js instead. */
const PEER_SCRIPT = 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js';
const PREFIX = 'siren-vortex-';
const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

function randomCode() {
  const bytes = new Uint8Array(5);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => ALPHABET[b % ALPHABET.length]).join('');
}

let peerLoad;
function loadPeer() {
  if (window.Peer) return Promise.resolve(window.Peer);
  if (!peerLoad) peerLoad = new Promise((resolve, reject) => {
    const tag = document.createElement('script');
    tag.src = PEER_SCRIPT;
    tag.onload = () => window.Peer ? resolve(window.Peer) : reject(new Error('Online service failed to load.'));
    tag.onerror = () => reject(new Error('Online service unavailable. Check your connection.'));
    document.head.appendChild(tag);
  }).catch(err => { peerLoad = null; throw err; });
  return peerLoad;
}

class Network {
  constructor({ onUpdate = () => {}, onLaunch = () => {}, onScores = () => {}, onError = () => {} } = {}) {
    Object.assign(this, { onUpdate, onLaunch, onScores, onError });
    this.peer = null;
    this.links = new Map();
    this.roster = [];
    this.scoreboard = {};
    this.lastProgress = -Infinity;
    this.generation = 0;
    this.active = false;
    this.isHost = false;
    this.code = '';
    this.status = 'OFFLINE';
  }
  update(status) {
    if (status) this.status = status;
    this.onUpdate({ status: this.status, code: this.code, peers: this.roster.length, isHost: this.isHost, active: this.active });
  }
  error(message) { this.update(message); this.onError(message); }
  async host() {
    this.leave();
    const generation = this.generation;
    this.isHost = true;
    this.code = randomCode();
    this.update('CREATING ROOM');
    try {
      const Peer = await loadPeer();
      if (generation !== this.generation) return;
      this.peer = new Peer(PREFIX + this.code, { debug: 0 });
      this.peer.on('open', id => {
        this.id = id;
        this.roster = [id];
        this.update('ROOM OPEN — SHARE CODE');
      });
      this.peer.on('connection', conn => this.accept(conn));
      this.bindPeerErrors();
    } catch (e) { if (generation === this.generation) this.error(e.message); }
  }
  async join(code) {
    this.leave();
    const generation = this.generation;
    this.isHost = false;
    this.code = String(code || '').toUpperCase().replace(/[^A-Z2-9]/g, '').slice(0, 5);
    if (this.code.length !== 5) return this.error('ENTER A FIVE CHARACTER ROOM CODE');
    this.update('CONNECTING');
    try {
      const Peer = await loadPeer();
      if (generation !== this.generation) return;
      this.peer = new Peer(undefined, { debug: 0 });
      this.bindPeerErrors();
      this.peer.on('open', id => {
        this.id = id;
        const conn = this.peer.connect(PREFIX + this.code, { reliable: true });
        this.bind(conn);
        conn.on('open', () => { this.links.set(conn.peer, conn); this.update('CONNECTED — WAITING FOR HOST'); });
      });
    } catch (e) { if (generation === this.generation) this.error(e.message); }
  }
  bindPeerErrors() {
    this.peer.on('error', err => {
      const messages = {
        'peer-unavailable': 'ROOM NOT FOUND OR HOST OFFLINE',
        'unavailable-id': 'ROOM CODE TAKEN — CREATE AGAIN',
        'network': 'CONNECTION LOST',
        'server-error': 'ONLINE SERVICE UNAVAILABLE',
        'browser-incompatible': 'BROWSER DOES NOT SUPPORT ONLINE PLAY'
      };
      this.error(messages[err.type] || 'ONLINE CONNECTION FAILED');
    });
    this.peer.on('disconnected', () => this.error('CONNECTION LOST'));
  }
  accept(conn) {
    if (!this.isHost || this.active || this.links.size >= 3) {
      conn.on('open', () => { conn.send({ t: 'reject' }); setTimeout(() => conn.close(), 150); });
      return;
    }
    this.bind(conn);
    conn.on('open', () => {
      this.links.set(conn.peer, conn);
      this.roster = [this.id, ...this.links.keys()];
      this.broadcast({ t: 'roster', ids: this.roster });
      this.update('ROOM OPEN — SHARE CODE');
    });
  }
  bind(conn) {
    conn.on('data', data => this.receive(conn, data));
    conn.on('error', () => this.error('CONNECTION LOST'));
    conn.on('close', () => {
      this.links.delete(conn.peer);
      if (this.isHost) {
        this.roster = [this.id, ...this.links.keys()];
        this.broadcast({ t: 'roster', ids: this.roster });
        this.update('A PILOT LEFT THE ROOM');
      } else {
        this.roster = [];
        this.active = false;
        this.update('HOST LEFT THE ROOM');
      }
    });
  }
  broadcast(data) {
    for (const conn of this.links.values()) if (conn.open) conn.send(data);
  }
  receive(conn, data) {
    if (!data || typeof data !== 'object') return;
    if (data.t === 'reject') { this.error('ROOM FULL OR MISSION UNDERWAY'); return; }
    if (this.isHost) {
      if ((data.t === 'score' || data.t === 'result') && this.links.has(conn.peer)) {
        this.record(conn.peer, data.score, data.label, data.t === 'result');
        this.broadcast({ t: 'scores', scores: this.scoreboard });
      }
      return;
    }
    if (data.t === 'roster' && Array.isArray(data.ids)) {
      this.roster = data.ids.slice(0, 4).filter(id => typeof id === 'string');
      this.update('CONNECTED — WAITING FOR HOST');
    } else if (data.t === 'launch' && Number.isFinite(data.seed)) {
      this.active = true;
      this.scoreboard = {};
      this.update('MISSION STARTING');
      this.onLaunch({ seed: data.seed >>> 0, delay: Math.max(0, Math.min(3000, Number(data.at) - Date.now())) });
    } else if (data.t === 'scores' && data.scores && typeof data.scores === 'object') {
      this.scoreboard = data.scores;
      this.emitScores();
    }
  }
  launch() {
    if (!this.isHost || !this.peer || !this.id || this.active) return false;
    const seed = crypto.getRandomValues(new Uint32Array(1))[0];
    const at = Date.now() + 2000;
    this.active = true;
    this.scoreboard = {};
    this.broadcast({ t: 'launch', seed, at });
    this.update('MISSION STARTING');
    this.onLaunch({ seed, delay: 2000 });
    return true;
  }
  record(id, score, label, done) {
    if (!Number.isFinite(Number(score))) return;
    this.scoreboard[id] = { score: Math.round(Number(score)), label: String(label || '').slice(0, 24), done: !!done };
    this.emitScores();
  }
  emitScores() {
    this.onScores(this.roster.map((id, i) => ({ pilot: i + 1, local: id === this.id, ...(this.scoreboard[id] || { score: 0, label: '', done: false }) })));
  }
  progress(score, label = '') {
    if (!this.active || performance.now() - this.lastProgress < 500) return;
    this.lastProgress = performance.now();
    if (this.isHost) {
      this.record(this.id, score, label, false);
      this.broadcast({ t: 'scores', scores: this.scoreboard });
    } else this.broadcast({ t: 'score', score, label });
  }
  result(score) {
    if (!this.active) return;
    if (this.isHost) {
      this.record(this.id, score, 'FINISHED', true);
      this.broadcast({ t: 'scores', scores: this.scoreboard });
    } else this.broadcast({ t: 'result', score, label: 'FINISHED' });
  }
  leave() {
    this.generation++;
    for (const conn of this.links.values()) conn.close();
    this.links.clear();
    if (this.peer) this.peer.destroy();
    this.peer = null;
    this.id = '';
    this.roster = [];
    this.scoreboard = {};
    this.active = false;
    this.isHost = false;
    this.code = '';
    this.status = 'OFFLINE';
  }
}
