<!--
== Source Information ==
- Date: 2026-11-01 19:10
- Source: The Office (US)
- Game: Conference Room Crush (title #34 of 50 brainstormed, drawn with Python SystemRandom)
- Genre and Perspective: office brawler / arena action-comedy with physics props. Main camera third person (Three.js perspective camera); the player can switch to top-down or first person any time (R3 / V).
- Tech: Three.js r180 (WebGPURenderer, automatic WebGL 2 fallback), Rapier 0.19.3 (rapier3d-compat: kinematic character controller, dynamic props), Web Audio, Gamepad API, AI Hub session client 1.3.0 (side by side / parallel mode). Bundled with esbuild; three and rapier load from jsdelivr via an import map.
- Art Direction: Three.js native look: flat-colour blocky MeshStandardMaterial characters and props, real-time shadows, hemisphere + sun + point lights, ACES tone mapping. No external art.
- Animation: Three.js native AnimationMixer with AnimationClips and KeyframeTracks authored in code (idle, walk, run, 3 attacks, throw, roll, hit, die, jump, stunned, cast, block, cheer).
- Audio: all code-written. Procedural music sequencer (muzak title, funk combat, minor-key boss), synthesized sound effects, and Animalese-style gibberish voices (formant blips per letter, one voice per character).
- Online: AI Hub side-by-side session (parallel mode, 1-4 seats): score progress and result reported through AIHub; no game traffic. Plays normally on its own.
- Testing: keep testing efficient and lightweight. Headless Chromium (SwiftShader) with the hub harness (1 and 2 players, leave scenario), a mocked DualSense, keyboard scripts and an attract-mode AI soak run.
- Research: read the AI Hub protocol README; no web research on the show (used general knowledge of its tone and archetypes; all names and jokes are original parodies).
- Environment: Claude Code CLI (headless); Linux; browser unknown (tested in headless Chromium).
- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium
- Usage: unknown (no cost or token estimate available to the agent); session time about 30 minutes.

== Testing Feedback ==
- How many issues did testing catch? About 6 from running the game: hair colour 'bald' passed to a colour parser, boss bar visible on non-boss shifts, attract-mode timer not reset per shift, HUD showing through the pause menu, player spawning on top of a pickup, and the touch notice overlapping the logo. Code review before the first run caught 2 more (an undefined helper in the boss AI and mouse-look units).
- How many would be considered critical / game breaking? 1 (the undefined helper in the boss chase code would have crashed the final fight; caught in review). None of the runtime tests found a crash.
- What was the most helpful test you ran? The AI Hub harness (full conformance, 1 and 2 players, leave scenario) plus the attract-mode AI soaked through all three shifts, which exercised spawns, orders, ambushes, the boss, scoring and shift transitions in one go.
- What was the least helpful test you ran? Judging feel from still screenshots under software rendering; they show layout but say nothing about motion, timing or camera comfort.

== Engine Feedback ==
- What did you like most about the engine? Three.js AnimationMixer plus KeyframeTracks makes procedural rigs easy to animate, and WebGPURenderer falls back to WebGL 2 on its own. Rapier's kinematic character controller gave solid wall sliding and stepping for free.
- Did you get stuck or guess wrong? Rapier collision group semantics for character-controller queries (membership/filter on both sides) and the one-step lag of kinematic body positions took a moment; teleporting the body with setTranslation after the controller move fixed it. Headless WebGPU screenshots are unreliable, so visual checks used the WebGL 2 backend.
- What was the most important thing you had to build yourself? The gameplay layer: input mapping for pad and keyboard, three switchable cameras with collision, combat with hit-stop, enemy AI on a flow-field navigation grid, the boss, the menu and HUD system, and the whole audio engine.
- What was the hardest part about using the engine? Keeping many moving parts in sync (kinematic characters pushing dynamic props, props carried and thrown, hit detection against thrown bodies) while staying deterministic enough to test.
- If you had to remove or overhaul one thing from the engine, what would that be? The split between three/webgpu and three/tsl entry points and the import-map setup; a single documented browser entry would remove guesswork.
- If you could change one thing about the engine, what would it be? A reliable headless readback or screenshot path for WebGPU canvases.

== Prompt Feedback ==
- What did you like most about this prompt? The controller-first rules, the invert-axis toggles, the attract-mode spec and the explicit Done criteria made the target concrete.
- What was confusing? "Engine native" for art and animation when the stack is a library, not an engine; the Source Information and feedback lists repeat across three places; asking for multiplayer on its own versus in the hub is a little ambiguous.
- What was the hardest thing to do? Delivering a full vertical slice (three shifts, a boss, menus, audio, attract mode, hub support) in a single file while keeping testing lightweight.
- If there was one test you could have run, what would that be? A long playthrough on a real GPU with a physical DualSense in a real browser, to judge camera comfort, controller feel and true frame pacing.

== Controls ==
Controller: L-stick move, R-stick camera (aim in top-down), Cross jump, Square binder combo, R2/R1 throw ream, Circle roll, L1 grab / throw furniture, Triangle Mandatory Meeting, R3 switch camera, Options pause/settings.
Keyboard and mouse: WASD move, arrows or mouse look, Space jump, J or left click attack, K or right click throw, Shift roll, E grab, Q Meeting, V camera, Esc pause.
Settings include invert horizontal and vertical gamepad axes.

/*! aihub-session 1.4.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.4.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null, card: opts.card === true });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  /** On the game's own card (connect({ card: true })): this player is 'ready', or asks for 'more' time (again takes it back). */
  hub.answer = function (what) {
    if (!welcomed || ended || goAt !== null) return;
    if (what !== 'ready' && what !== 'more') return warn('answer is ready or more');
    post('answer', { answer: what });
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);

    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {

      return false;

  hub.time = function () {

  };

  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */

    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

function createHub() {
  const H3 = window.AIHub;
  return {
    get active() {
      return !!(H3 && H3.active);
    },
    time() {
      return H3 && H3.active ? H3.time() : Infinity;
    },
    progress(score, label) {
      if (H3 && H3.active) {
        try {
          H3.progress({ score: Math.round(score), label: String(label).slice(0, 24) });
        } catch (e) {
        }
      }
    },
    result(r) {
      if (H3 && H3.active) {
        try {
          H3.result(r);
        } catch (e) {
        }
      }
    },
    raw: H3
  };
}

teraction model, not a separate desktop paradigm. Apply modern UX principles. Use your judgment to balance deep systemic information with clean, uncluttered presentation.\n\nCommon Issue (~10%): Gamepad horizontal/vertical input is intermittently inverted. As a quick fix, add toggles in Settings to invert horizontal and vertical axes.\n\nDo not use overly dense, web-style data screens.\n\nTouch-only devices: no touch controls; show \"Controller or keyboard required\" and the settings button. Allow the attract mode run.\n\n## Done\nNo TODOs, placeholders, or stubbed features. The demo is complete.\n\n## Source Information\nCRTICAL: Put Source Information, Engine Feedback and Prompt Feedback in your chat reply, an in-game About/Credits screen, and an HTML comment at the top of the file. Write \"unknown\" for anything you can't confirm.\n- Date: YYYY-MM-DD HH:MM\n- pick a famous tv show\n- Genre and Perspective: genre and camera perspective used\n- Tech: stack, libraries/engines, with versions if applicable\n- Art Direction: style used\n- Animation: system used\n- Audio: music, sound effects and voice used\n- Online: network features used, or none\n- Testing: testing parameters allowed\n- Research: research done, or none\n- Environment: Claude Code CLI (headless); Linux; browser unknown\n- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium\n- Usage: the estimated API cost in USD, total number of tokens in K or M  (provide break down if available) and session time, only if estimates are available.\n\nTesting Feedback\n\n- How many issues did testing catch?\n- How many would be considered critical issues / game breaking?\n- What was the most helpful test you ran?\n- What was the least helpful test you ran? \n\nEngine Feedback\n\n- What did you like most about the engine?\n- Did you get stuck or guess wrong?\n- What was the most important thing you had to build yourself?\n- What was the hardest part about using the engine?\n- If you had to remove or overhaul one s WebGPU screenshots are unreliable, so visual checks used the WebGL 2 backend.\n- **Had to build myself:** the whole gameplay layer. That means pad and keyboard input, three switchable cameras with collision, combat with hit-stop, flow-field enemy AI, the boss, menus and HUD, and the audio engine.\n- **Hardest part:** keeping kinematic characters, dynamic props, carried and thrown objects, and hit detection in sync while staying testable.\n- **Remove or overhaul:** the `three/webgpu` versus `three/tsl` entry points and the import-map setup. One documented browser entry would remove guesswork.\n- **Change one thing:** a reliable headless readback or screenshot path for WebGPU canvases.\n\n## Prompt Feedback\n- **Liked most:** the controller-first rules, the invert-axis toggles, the attract-mode spec and the explicit Done criteria.\n- **Confusing:** \"engine native\" art and animation when the stack is a library rather than an engine. The Source Information and feedback lists repeat across three places. Multiplayer \"on its own\" versus in the hub is also a little ambiguous.\n- **Hardest thing:** a full vertical slice (three shifts, a boss, menus, audio, attract mode, hub support) in one file while keeping testing lightweight.\n- **One test I'd run:** a long playthrough on a real GPU with a physical DualSense in a real browser, to judge camera comfort, controller feel and frame pacing."}</script>
