</script><script>
/* Standalone game runtime. Loads an exported cartridge or the bundled demo levels.

(function(){
  'use strict';
  const D=window.Dither,$=id=>document.getElementById(id);

  let target=[0,1,0],lastRender=0,ready=false;
  const clock=new D.Clock(),ctx=$('hud').getContext('2d');
  function message(text){$('message').textContent=text;$('message').hidden=!text;}
  function resize(){const main=document.querySelector('main'),w=Math.min(main.clientWidth-30,(main.clientHeight-30)*4/3);$('screen').style.width=Math.max(160,w)+'px';}
  function loadLevel(key){
    scene=D.Scene.deserialize(cartridge.scenes[key]);
    if(!scene.tagged('player').length)throw new Error('This scene needs a node tagged "player".');
    active=key;game=new D.DemoGame(scene,input,audio);game.start();paused=false;
    target=[game.player.position[0],game.player.position[1]+.75,game.player.position[2]];
    input.clear();clock.reset();message('');$('level').value=key;$('pause').textContent='Pause';$('view').focus({preventScroll:true});

  }
  async function loadCartridge(data){
    if(!data||data.format!=='dither-project'||data.version!==1||!data.scenes)throw new Error('Choose a version 1 DITHER cartridge JSON.');
    const validated={};for(const [key,raw] of Object.entries(data.scenes)){if(!['sector','chapel','sandbox'].includes(key))throw new Error('Unknown scene key.');validated[key]=D.Scene.deserialize(raw).serialize();}
    if(!Object.keys(validated).length)throw new Error('No scenes in cartridge.');

  function pause(){paused=!paused;input.clear();clock.reset();$('pause').textContent=paused?'Resume':'Pause';message(paused?'PAUSED\nPress P to resume':'');if(!paused)$('view').focus({preventScroll:true});}
  function hud(){
    ctx.clearRect(0,0,320,240);ctx.fillStyle='rgba(5,12,7,.82)';ctx.fillRect(6,6,308,22);ctx.fillRect(6,217,308,17);
    ctx.font='6px monospace';ctx.fillStyle='#bfd1a4';ctx.fillText('LIFE '+game.health+'   '+(game.kind==='sector'?'ALERT '+Math.round(game.alert):'SEALS '+game.collected+'/'+game.total),12,15);
    ctx.font='5px monospace';ctx.fillStyle='#899b75';ctx.fillText(scene.name.toUpperCase().slice(0,45),12,23);
    ctx.font='6px monospace';ctx.fillStyle='#c3ceaa';ctx.fillText(game.objective(),12,228);
    if(game.messageTimer>0){ctx.font='5px monospace';const text=game.message,tw=ctx.measureText(text).width;ctx.fillStyle='rgba(5,12,7,.8)';ctx.fillRect(160-tw/2-5,193,tw+10,13);ctx.fillStyle='#d7d3ae';ctx.textAlign='center';ctx.fillText(text,160,202);ctx.textAlign='left';}
    if(game.state==='won')message('MISSION COMPLETE\n'+game.message+'\nPress R to restart');
    else if(game.state==='failed')message('MISSION FAILED\nPress R to restart');
  }
  function frame(now){
    try{
      const steps=clock.tick(now,dt=>{if(paused)return;if(input.down('KeyQ'))yaw-=dt*1.4;if(input.down('KeyE'))yaw+=dt*1.4;game.update(dt,yaw);const goal=[game.player.position[0],game.player.position[1]+.75,game.player.position[2]];target=target.map((v,i)=>D.lerp(v,goal[i],1-Math.exp(-dt*6)));});
      if(steps)input.endFrame();
      if(now-lastRender>=1000/30-.5){lastRender=now;camera.position=[target[0]+Math.sin(yaw)*distance*.71,target[1]+distance*.71,target[2]+Math.cos(yaw)*distance*.71];camera.target=target.slice();renderer.render(scene,camera);hud();}
      requestAnimationFrame(frame);
    }catch(error){message('Runtime error\n'+error.message);console.error(error);}
  }
  async function init(){try{
    atlas=D.Assets.createAtlas();renderer=new D.Renderer($('view'),atlas,{displayAspect:4/3});camera=new D.Camera();input=new D.Input($('view'));audio=new D.AudioEngine();
    const embedded=$('cartridge-data');
    const data=embedded?JSON.parse(embedded.textContent):{format:'dither-project',version:1,activeScene:'sector',scenes:{sector:D.Demos.sector().serialize(),chapel:D.Demos.chapel().serialize()}};
    await loadCartridge(data);
    $('level').onchange=e=>{try{loadLevel(e.target.value);}catch(error){message(error.message);}};
    $('pause').onclick=pause;$('restart').onclick=()=>loadLevel(active);
    $('sound').onclick=async()=>{try{$('sound').textContent=(await audio.toggle())?'Sound on':'Sound off';}catch(error){message(error.message);}};
    $('open').onclick=()=>{if(!paused)pause();$('file').click();};
    $('file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>30000000)throw new Error('Cartridge must be smaller than 30 MB.');await loadCartridge(JSON.parse(await file.text()));}catch(error){message('Could not open cartridge\n'+error.message+'\nPress P to return');}};
    window.addEventListener('keydown',e=>{if(e.repeat||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.code==='KeyP'){pause();e.preventDefault();}if(e.code==='KeyR'){loadLevel(active);e.preventDefault();}});
    document.addEventListener('visibilitychange',()=>{input.clear();clock.reset();if(document.hidden&&!paused)pause();});
    $('view').addEventListener('wheel',e=>{e.preventDefault();distance=D.clamp(distance+e.deltaY*.02,9,35);},{passive:false});
    for(const b of document.querySelectorAll('[data-key]')){const key=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();input.virtual.add(key);input.pressed.add(key);b.setPointerCapture(e.pointerId);};for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>input.virtual.delete(key));}
    $('backend').textContent=renderer.backend==='WebGL 1'?'WEBGL 1 / RGB555':'CPU RASTERIZER';
    new ResizeObserver(resize).observe(document.querySelector('main'));resize();
    window.ditherGame={get ready(){return ready;},get game(){return game;},get scene(){return scene;},get paused(){return paused;},renderer,input,loadCartridge,loadLevel};
    ready=true;requestAnimationFrame(frame);
  }catch(error){message('Could not start\n'+error.message);console.error(error);}}
  init();
})();

</script>
