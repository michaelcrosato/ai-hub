function ceilVault(seed) {
  return makeTex((x, y) => {
    const nz = (h2(x, y + seed) - .5) * 8 + (n2(x * .12, y * .12) - .5) * 14;
    let c = [34 + nz, 34 + nz, 50 + nz];
    if ((x & 31) === 0 || (y & 31) === 0) c = [18, 16, 28]; else if ((x & 31) === 1 || (y & 31) === 1) c = [50, 50, 70];
    return c;
  });
}
function ceilHive() {
  return makeTex((x, y) => {
    const nz = (h2(x, y) - .5) * 10, w = n2(x * .09, y * .09) * 30;
    const e = Math.abs(((x + y * .5) % 16) - 8) / 8;
    return [96 + w + nz - e * 14, 60 + w * .6 + nz - e * 10, 18 + nz * .4];
  });
}

  const out = [];

    const c = mkcv(64, 64), g = c.getContext('2d', { willReadFrequently: true }); g._c = null; fn(g, f); out.push(canvasToTex(c));

}

const T_ = hex => E.tones(hex);

    disc: (x, y, r, c) => px.disc(g, R(ox + x * k), R(oy + y * k), Math.max(1, R(r * k)), c),
    poly: (pts, c) => px.poly(g, pts.map(p => [R(ox + p[0] * k), R(oy + p[1] * k)]), c),
    line: (x0, y0, x1, y1, c, w = 1) => px.line(g, R(ox + x0 * k), R(oy + y0 * k), R(ox + x1 * k), R(oy + y1 * k), c, Math.max(1, R(w * k))),

    }

}

function makeRig(type) {

// wings on the wasp guard, painted behind the rig
function paintWasp(g, ox, oy, k, S) {
  const p = pt(g, ox, oy, k), fl = Math.sin(S.t * 30), by = -26;
  for (const sd of [-1, 1]) { p.poly([[sd * 4, by], [sd * (16 + fl * 2), by - 20 - fl * 4], [sd * 22, by - 8], [sd * 14, by + 6]], WING); p.line(sd * 4, by, sd * 19, by - 12, 'rgba(255,255,255,0.7)'); }

// ---- common entry points ----------------------------------------------------------------------------------------------
// paintMonster draws monster m (state S: t, atk 0..1 wind-up, hurt, look) with feet at (ox, oy) at design scale k.
// view / facing are used by rigs only.
function paintMonster(m, g, ox, oy, k, view, facing) {
  const S = m.vis;
  switch (m.type) {
    case 'drone': return paintDrone(g, ox, oy, k, S);
    case 'eyelet': return paintEyelet(g, ox, oy, k, S);
    case 'queen': return paintQueen(g, ox, oy, k, S);
    case 'wasp': paintWasp(g, ox, oy, k, S); m.rig.facing = facing; m.rig.draw(g, ox, oy, view); return;
    case 'skeleton': m.rig.facing = facing; m.rig.draw(g, ox, oy, view); return;
    case 'ooze': m.rig.draw(g, ox, oy, view); return;

// =====================================================================================================================
// FIRST-PERSON VIEW: a grid raycaster written straight onto the engine's pixel buffer. Textured walls, sliding doors,
// see-through gates, floor / ceiling casting, torch light with ordered-dither shading, billboard sprites.
// =====================================================================================================================
const FP = (() => {
  const CAMH = .5, PLANE = .9, LAMP = .95, KL = .15, DARK = 14, MAXD = 16;

  const light = new Float32Array(N * 3);          // static light at each cell centre (torches, braziers, glows)

  let T = 0, flick = 1;

      const i = y * LW + x;
      for (let f = 0; f < 4; f++) faceTex[i * 4 + f] = L.style[i];
      if (L.solid[i] === 2 || L.solid[i] === 3) doorAxis[i] = (L.solid[i - 1] === 1 && L.solid[i + 1] === 1) ? 1 : 0;
    }
    // jambs: the walls either side of a door show a frame on the faces that look into the doorway
    for (const k in L.doors) {
      const d = L.doors[k], i = +k, ax = doorAxis[i];
      if (d.kind === 'secret') continue;

      else { faceTex[(i - LW) * 4 + 2] = WS.frame; faceTex[(i + LW) * 4 + 0] = WS.frame; }

    for (const p of L.props) if (p.light) src.push([p.x + .5, p.y + .5, 6.5, [1.0, .55, .2], 1.2]);
    src.push([26.5, 19.5, 5.2, [.5, .62, 1], .55]);        // moonlight in the chapel
    src.push([2.5, 12.5, 4, [.62, .74, 1], .55], [2.5, 14.5, 3.4, [.4, .6, 1], .8]);  // vault glow, teleporter
    src.push([15.5, 1.5, 4.2, [.85, .9, 1], .7]);          // the stair down
    src.push([5.5, 12.5, 2.8, [.6, .7, 1], .5]);           // the plate

// ---- scene: play and demo -----------------------------------------------------------------------------------------------------------------------------
function playInput(dt) {
  const I = game.input;
  if (UI.openPackSoon) { UI.openPackSoon = false; openPack(); }
  if (UI.openMapSoon) { UI.openMapSoon = false; openMap(); }
  if (UI.campSoon) { UI.campSoon = false; cmdCamp(); }
  if (UI.viewSoon) { UI.viewSoon = false; nextView(); }
  if (UI.pack) { packUpdate(); return; }
  if (UI.map) { mapUpdate(); return; }
  if (S.over) return;
  if (S.modal) { if (I.pressed('use') || I.pressed('confirm') || I.pressed('cancel')) { closeModal(); I.consumeAll(); } return; }
  if (I.pressed('pack')) { openPack(); return; }
  if (I.pressed('map')) { openMap(); return; }
  if (I.pressed('view')) nextView();
  if (I.pressed('camp')) cmdCamp();
  // turning: L1 / R1, Q / E, and the right stick
  const ax = I.padAim ? I.padAim[0] : 0;
  const tl = I.pressed('turnL') || I.repeat('turnL', .35, .22) || ax < -.6 && (UI.stickT = (UI.stickT || 0) + dt) > .3 && !(UI.stickT = 0) && false;
  let tL = I.repeat('turnL', .3, .2), tR = I.repeat('turnR', .3, .2);
  if (ax < -.65) { if (!UI.stickL) { tL = true; UI.stickL = true; } } else UI.stickL = false;
  if (ax > .65) { if (!UI.stickR) { tR = true; UI.stickR = true; } } else UI.stickR = false;
  void tl;
  if (tL && tR) { cmdTurn(1); S.party.queue.push({ t: 'turn', sign: 1 }); }
  else if (tL) { cmdTurn(-1); S.turnedOnce = true; } else if (tR) { cmdTurn(1); S.turnedOnce = true; }
  // moving
  const dirs = [['up', 0], ['right', 1], ['down', 2], ['left', 3]];
  for (const [a, rel] of dirs) { if (I.pressed(a)) cmdMove(rel, true); else if (I.down(a) && !S.party.anim && !S.party.queue.length) cmdMove(rel, false); }
  // the party
  const alt = I.down('alt');
  for (let k = 0; k < 4; k++) { if (I.buffered(HERO_BTN[k], .22)) { if (S.heroes[k].alive && (alt ? S.heroes[k].cdAlt : S.heroes[k].cd) <= 0) { if (alt) S.altUsed = true; heroAct(k, alt); I.consume(HERO_BTN[k]); } else if (!S.heroes[k].alive) I.consume(HERO_BTN[k]); } }
  const c = I.clicked();
  if (c) for (let k = 0; k < 4; k++) { const [x, y, w, h] = heroCardRect(game.screen.W, game.screen.H, k); if (c[0] >= x && c[0] < x + w && c[1] >= y && c[1] < y + h) { heroAct(k, alt); } }
  if (I.pressed('use')) cmdUse();
}
function musicFor() {

}
const playBase = {
  pausable: true,
  enter(data) {

    game.follow(camT, { z: 12 }); game.cam.smooth = .08; setUIView(this.demo ? 'dungeon' : 'dungeon', true); game.lights.enabled = false; game.screen.setScale && 0;
    music('dungeon'); curMusic = 'dungeon'; this.endT = 0;

  },
  exit() { /* music is chosen by the next scene */ },

  },

    else { drawEngineView(r); UI.lastV = null; }

const demo = Object.assign({}, playBase, { demo: true, pausable: false, enter(data) { this.t0 = 0; this.grace = .5; playBase.enter.call(this, data); AI.reset(); }, update(dt) {

  if (this.mt === undefined || this.grace > 0) this.mt = I.mouse.t;

};
