<!--
  SiNtax Error — a spiritual successor to SiN

  == SOURCE INFORMATION ==
  - Date: 2026-10-29 03:27
  - Source: SiN (Ritual Entertainment / Activision, 1998) — this is an original spiritual successor; no assets, names or code from SiN are used
  - Tech: Three.js r180 (WebGPURenderer, WebGPU only — no fallback; TSL node materials, toonOutlinePass, BloomNode post-processing), Rapier 3D 0.19.3 (@dimforge/rapier3d-compat: kinematic character controllers, rigid bodies, ray casts), Web Audio API, Gamepad API, Pointer Lock API, AI Hub session client 1.3.0, plain ES modules from the jsDelivr CDN
  - Art Direction: Stylized cel-shading: MeshToonNodeMaterial with a hard 4-step gradient ramp, inverted-hull ink outlines, bloom on neon, procedural canvas textures, rain-soaked neon-noir palette
  - Animation: Procedural, code-driven: hierarchical primitive rigs with walk/aim/flinch/cower cycles, ragdoll-lite death tumbles, spline camera cutscene, procedural first-person viewmodel bob, sway, recoil, reload and switch animations
  - Audio: All code-written with Web Audio: adaptive step-sequencer music (5 tracks, combat intensity layer), synthesized SFX (weapons, explosions, impacts, engines, UI), Animalese-style formant gibberish voice acting for every speaking character
  - Online: AI Hub Session Protocol v1, side-by-side (parallel) mode: seeded start, AIHub.progress / result with stats and awards, probe, time-up and end handling. On its own (outside sessions): Online Versus, the game's own multiplayer per the protocol's "Games with multiplayer of their own" — netcode written against the { me, isHost, players, send, onMessage, onLeave } interface with a PeerJS 1.5.4 adapter, 4-letter room codes, a rival ghost with live score, versus result in the debrief, heartbeat leave detection; never loaded inside a session.
  - Testing: Lightweight, agent-chosen: node —check + oxlint no-undef on the bundle; Chromium 1248 via playwright-core under Xvfb with SwiftShader WebGPU (about 2 fps, so a debug-only sim speed-up was used); scripted runs: zone screenshots, a full attract-bot traversal of the whole mission, hack / ATV / death / menu paths, the official AI Hub harness (side by side, 1 and 2 players, auto), and a two-browser Online Versus run through the public PeerJS broker (room code, synced start, state both ways, leave detection). No real GPU, no physical controller.
  - Environment: Claude Code CLI (headless); Linux; browser unknown
  - Model: Anthropic, claude-opus-5-5, reasoning effort medium
  - Usage: Cost: unknown; tokens: unknown (no usage meter is visible to the agent); session time about 1 h 10 min (03:27 to about 04:37)

  == TESTING FEEDBACK ==
  - Issues caught: 13 — Online Versus sent nothing during the intro and missed closed tabs (fixed with a heartbeat); Rapier panic when rescued hostages despawned; ATV entered and exited on the same button press; ATV stalled on a barrel at the gate; hub progress only sent on score change; probe missed short key presses between slow frames; pause popping after redeploy (pointer-lock flap); HUD bleeding through menus; About page too dense; long settings list overflowing; comms box overlapping the HUD; skyline too close to the roof
  - Critical / game-breaking: 2 — the Rapier panic froze all physics for the rest of the run; the ATV bug made the ram-the-gate objective impossible by car
  - Most helpful test: Letting the attract-mode bot play the entire mission with a sim speed-up while logging objectives and page errors: it found the game-breaking physics panic in one run
  - Least helpful test: Plain headless Chromium screenshots: WebGPU canvases came back black, so the frames proved nothing until the run moved to headful Chromium under Xvfb

  == ENGINE FEEDBACK ==
  - Liked most: Rapier's kinematic character controller: one shared controller moves the player, every enemy, the boss and the ATV with autostep, slopes and snap-to-ground for free. Three's toonOutlinePass gives cel outlines in one line.
  - Stuck / guessed wrong: Guessed at r180 TSL export names (toonOutlinePass, PostProcessing vs. RenderPipeline) and Rapier 0.19 field names (timeOfImpact) — verified by installing the exact versions locally and reading the builds.
  - Most important thing built: The glue: a locational-damage hitscan resolver over Rapier ray casts that routes hits to enemies, turrets, boss weak points, glass, props, gates and tanks.
  - Hardest part: Keeping WebGPU pipelines stable: changing light counts recompiles shaders, so every dynamic light is pooled and toggled by intensity, and the scene is pre-compiled at boot.
  - Remove / overhaul: The split between three/webgpu and three/tsl import paths and the per-material outline pass — a single built-in toon pipeline (ramp + outline + instancing support) would remove a lot of guesswork.
  - Change one thing: Ship a navmesh / pathfinding helper alongside the character controller; enemies currently steer and strafe rather than path.

  == PROMPT FEEDBACK ==
  - Liked most: Clear hard constraints (exact versions, WebGPU only, single file) with freedom on everything else, plus a concrete multiplayer protocol to follow.
  - Confusing: "Multiplayer … for the game on its own" — the hub protocol covers sessions; it is unclear whether standalone online play was also expected. Side-by-side mode was chosen as the honest fit for a single-player campaign.
  - Hardest thing: Fitting every pillar (FPS, locational damage, vehicles, hacking, branching, boss, attract mode, 10-foot UI, hub) into one coherent slice with nothing left unfinished.
  - One test I wish I had run: A real-GPU playthrough with a DualSense, end to end, inside the AI Hub harness with two players.

/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

// ---- Music: a small step sequencer with adaptive combat intensity
const SCALE = [0, 2, 3, 5, 7, 8, 10]; // natural minor
const TRACKS = {
  title: { bpm: 96, root: 45, prog: [0, 5, 3, 4], drums: 0.6, lead: 0.7, dark: 0.3 },
  explore: { bpm: 104, root: 40, prog: [0, 0, 5, 6], drums: 0.45, lead: 0.35, dark: 0.6 },
  combat: { bpm: 128, root: 40, prog: [0, 5, 3, 6], drums: 1, lead: 0.8, dark: 0.8 },
  boss: { bpm: 146, root: 38, prog: [0, 1, 0, 6], drums: 1, lead: 1, dark: 1 },
  debrief: { bpm: 88, root: 48, prog: [0, 3, 5, 4], drums: 0.4, lead: 0.6, dark: 0.1 },
};
function musicPlay(name) { Audio.musicState.track = name; Audio.musicState.step = 0; }
function musicIntensity(v) { Audio.musicState.target = clamp(v, 0, 1); }
function midi(n) { return 440 * 2 ** ((n - 69) / 12); }
function musicScheduler() {
  const M = Audio.musicState;
  const tick = () => {
    const ctx = Audio.ctx;
    if (!ctx) return;
    const tr = TRACKS[M.track];
    if (!tr) { M.next = ctx.currentTime + 0.1; return; }
    M.intensity = lerp(M.intensity, M.target, 0.02);
    const spb = 60 / tr.bpm / 4;
    if (M.next < ctx.currentTime) M.next = ctx.currentTime + 0.05;
    while (M.next < ctx.currentTime + 0.2) { musicStep(tr, M.step, M.next, spb, M.intensity); M.step++; M.next += spb; }
  };
  M.timer = setInterval(tick, 50);
}
function musicStep(tr, step, t, spb, inten) {
  const bus = Audio.music, s16 = step % 16, bar = Math.floor(step / 16), chord = tr.prog[bar % tr.prog.length];
  const deg = (d) => { const o = Math.floor(d / 7); return SCALE[((d % 7) + 7) % 7] + o * 12; };
  const root = tr.root + deg(chord);
  const dr = tr.drums * (0.55 + inten * 0.45);
  // kick
  if (s16 % 4 === 0 || (inten > 0.5 && s16 === 10)) { tone('sine', 150, 38, t, 0.22, bus, 0.9 * dr); }
  // snare
  if (s16 === 4 || s16 === 12) { noiseBurst(t, 0.16, bus, 0.45 * dr, 'bandpass', 1800, 900, 0.8); tone('triangle', 220, 160, t, 0.08, bus, 0.25 * dr); }
  // hats
  if (s16 % 2 === 0 || inten > 0.6) noiseBurst(t, 0.03, bus, (s16 % 4 === 2 ? 0.16 : 0.08) * dr, 'highpass', 7000, 7000);
  // bass (saw through lowpass), driving 8ths in combat
  if (s16 % (inten > 0.4 ? 2 : 4) === 0) {
    const o = Audio.ctx.createOscillator(), f = Audio.ctx.createBiquadFilter(), g = Audio.ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = midi(root - 12 + (s16 === 14 ? 12 : 0));
    f.type = 'lowpass'; f.frequency.setValueAtTime(300 + 900 * tr.dark * (0.4 + inten), t); f.frequency.exponentialRampToValueAtTime(120, t + spb * 1.8); f.Q.value = 6;
    env(g, t, 0.005, 0.32, spb * 1.8); o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + spb * 2.2);
  }
  // pad chord on bar start
  if (s16 === 0) {
    [0, 3, 7, 10].forEach((iv, k) => {
      const nn = root + (k === 1 ? deg(chord + 2) - deg(chord) : k === 2 ? deg(chord + 4) - deg(chord) : k === 3 ? deg(chord + 6) - deg(chord) : 0);
      for (const det of [-6, 6]) {
        const o = Audio.ctx.createOscillator(), g = Audio.ctx.createGain(), f = Audio.ctx.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.value = midi(nn + 12); o.detune.value = det;
        f.type = 'lowpass'; f.frequency.value = 900;
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.035, t + spb * 4); g.gain.linearRampToValueAtTime(0.0001, t + spb * 16);
        o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + spb * 16.2);
      }
      void iv;
    });
  }
  // lead arpeggio
  const lv = tr.lead * (0.25 + inten * 0.75);
  if (lv > 0.2 && (s16 % 2 === 1 || inten > 0.7)) {
    const arp = [0, 2, 4, 7, 4, 2, 9, 7];
    const nn = root + 24 + deg(chord + arp[(step >> 1) % 8]) - deg(chord);
    tone('square', midi(nn), midi(nn), t, spb * 0.8, bus, 0.05 * lv);
  }
}

// ---- Gibberish ("Animalese") voice acting
const VOICES = {
  hardline: { pitch: 105, speed: 0.058, shape: 'sawtooth', jitter: 0.18, form: 1.0 },
  patch: { pitch: 240, speed: 0.045, shape: 'square', jitter: 0.35, form: 1.25 },
  vex: { pitch: 190, speed: 0.062, shape: 'triangle', jitter: 0.25, form: 1.15 },
  brutus: { pitch: 70, speed: 0.075, shape: 'sawtooth', jitter: 0.1, form: 0.8 },
  thug: { pitch: 130, speed: 0.05, shape: 'sawtooth', jitter: 0.3, form: 0.95 },
  civ: { pitch: 210, speed: 0.05, shape: 'triangle', jitter: 0.4, form: 1.2 },
  pilot: { pitch: 120, speed: 0.052, shape: 'square', jitter: 0.2, form: 1.0 },
};
const FORMANTS = { a: [800, 1200], e: [400, 2200], i: [300, 2700], o: [500, 900], u: [350, 700] };
function speak(who, text, pos = null) {
  if (!Audio.ctx) return 0;
  const v = VOICES[who] || VOICES.thug, ctx = Audio.ctx;
  let t = ctx.currentTime + 0.02;
  const out = outNode(Audio.voice, pos, pos ? 1.2 : 0.8, false).node;
  const letters = text.toLowerCase().replace(/[^a-z .,!?']/g, '');
  let vowel = 'a';
  for (let i = 0; i < letters.length && i < 160; i++) {
    const ch = letters[i];
    if (ch === ' ') { t += v.speed * 0.6; continue; }
    if ('.,!?'.includes(ch)) { t += v.speed * 3; continue; }
    if ('aeiou'.includes(ch)) vowel = ch;
    else if (i % 2) continue; // consonants folded to keep the babble readable
    const code = ch.charCodeAt(0) - 97;
    const f = v.pitch * (1 + ((code * 7) % 12) / 12 * v.jitter) * (text.endsWith('?') && i > letters.length - 6 ? 1.3 : 1);
    const o = ctx.createOscillator(); o.type = v.shape; o.frequency.setValueAtTime(f, t); o.frequency.linearRampToValueAtTime(f * 0.92, t + v.speed);
    const g = ctx.createGain(); env(g, t, 0.008, 0.5, v.speed * 0.95);
    const [f1, f2] = FORMANTS[vowel];
    const b1 = ctx.createBiquadFilter(); b1.type = 'bandpass'; b1.frequency.value = f1 * v.form; b1.Q.value = 5;
    const b2 = ctx.createBiquadFilter(); b2.type = 'bandpass'; b2.frequency.value = f2 * v.form; b2.Q.value = 7;
    const g2 = ctx.createGain(); g2.gain.value = 0.6;
    o.connect(g); g.connect(b1); g.connect(b2); b1.connect(out); b2.connect(g2); g2.connect(out);
    o.start(t); o.stop(t + v.speed + 0.03);
    t += v.speed;
  }
  return t - ctx.currentTime;
}

async function initRenderer() {

let charCtrl = null;
function initControllers() {
  charCtrl = world.createCharacterController(0.03);
  charCtrl.enableAutostep(0.45, 0.25, false);
  charCtrl.enableSnapToGround(0.35);
  charCtrl.setMaxSlopeClimbAngle(50 * Math.PI / 180);
  charCtrl.setMinSlopeSlideAngle(60 * Math.PI / 180);
  charCtrl.setApplyImpulsesToDynamicBodies(true);
  charCtrl.setCharacterMass(80);
}
function moveCollider(col, desired, filter) {
  charCtrl.computeColliderMovement(col, desired, RAPIER.QueryFilterFlags.EXCLUDE_SENSORS, filter);
  return { mv: charCtrl.computedMovement(), grounded: charCtrl.computedGrounded() };
}
function castRay(origin, dir, maxDist, filter, excludeCol = null) {
  const ray = new RAPIER.Ray({ x: origin.x, y: origin.y, z: origin.z }, { x: dir.x, y: dir.y, z: dir.z });
  const hit = world.castRayAndGetNormal(ray, maxDist, true, undefined, filter, excludeCol || undefined);
  if (!hit) return null;
  return { t: hit.timeOfImpact, col: hit.collider, normal: V3(hit.normal.x, hit.normal.y, hit.normal.z), point: V3().copy(origin).addScaledVector(dir, hit.timeOfImpact), owner: OWNER.get(hit.collider.handle) };
}

// shared hitscan resolution (player + bot + turrets that fight for us)
function shootRay(origin, dir, range, dmg, headMul, source, exclude, pierce = 1) {
  let o = origin.clone(), left = range, end = origin.clone().addScaledVector(dir, range), hitEnemy = false, head = false;

    const h = castRay(o, dir, left, RAY_SHOT, exclude);
    if (!h) break;
    end = h.point;
    const ow = h.owner;
    if (ow && ow.kind === 'enemy') {
      const z = Actors.zoneOf(ow.e, h.point);
      Actors.hit(ow.e, z, dmg * (z === 'head' ? headMul : 1), dir, h.point, source);
      hitEnemy = true; if (z === 'head') head = true;
      pierce--; if (pierce <= 0) break;
      o = h.point.clone().addScaledVector(dir, 0.6); left -= h.t + 0.6; continue;
    }
    if (ow && ow.kind === 'glass') { breakGlass(ow.glass); o = h.point.clone().addScaledVector(dir, 0.1); left -= h.t; continue; }
    if (ow && ow.kind === 'prop') { damageProp(ow.prop, dmg, h.point, dir); sparks(h.point, 5, h.normal); SFX.impact(h.point, 'wood'); break; }
    if (ow && ow.kind === 'gate') { damageGate(dmg * 0.05, 'bullets'); break; }
    if (ow && ow.kind === 'boss') { Boss.hit(h.point, dir, dmg, headMul); hitEnemy = true; head = Boss.lastHead; break; }
    if (ow && ow.kind === 'veh') { sparks(h.point, 6, h.normal); SFX.impact(h.point, 'armor'); break; }
    if (ow && ow.kind === 'grate') { Game.openGrate(ow.it); break; }
    if (ow && ow.kind === 'tank') { blowTank(ow.tank, source); break; }
    // world surface
    sparks(h.point, 6, h.normal); dust(h.point, 3, h.normal); decal(h.point, h.normal);
    if (Math.random() < 0.5) SFX.impact(h.point);
    break;
  }
  return { end, hitEnemy, head };
}

const Bot = {
  pos: Player.pos, path: null, i: 0, inp: {}, fireHold: 0, wTimer: 0, t: 0, circleA: 0,
  start() {
    this.path = [
      [0, 8, -6], [0, 8, -14], [-3, 8, -20], [0, 8, -27], [0, 8, -31.5, 'elevator'], [0, 0, -32], [0, 0, -37], [-4, 0, -48], [3, 0, -60], [5.5, 0, -63.4, 'hack'], [0, 0, -63], [0, 0, -70], [0, 0, -80],
      [6, 0, -88], [6.5, 0, -103], [-6, 0, -103.5], [-9, 0, -106.8], [-13, 0, -108.5, 'key'], [-9, 0, -106.8], [6, 0, -103.5], [10, 0, -109], [10, 0, -113], [10, -4, -124], [8, -4, -132],
      [3, -4, -146], [-4, -4, -158], [0, -4, -170, 'gate'], [0, -4, -184], [0, -4, -198], ['boss'],
    ];
    this.i = 0; this.t = 0; this.pos = Player.pos;

  update(dt) {

    let goal;

      if (!Boss.e || !Boss.e.alive) { return A; }
      this.circleA += dt * 0.5; goal = V3(Boss.e.pos.x + Math.cos(this.circleA) * 11, -4, Boss.e.pos.z + Math.sin(this.circleA) * 11);
    } else goal = V3(wp[0], wp[1], wp[2]);
    const d = V3().subVectors(goal, Player.pos); const flat = Math.hypot(d.x, d.z);
    if (wp[0] !== 'boss' && flat < 0.5 && Math.abs(d.y) < 0.5) {

      if (act === 'hack') Game.startHack();
      if (act === 'key') Player.collect('keycard');
      if (act === 'gate') damageGate(999, 'explosive');
      this.i = Math.min(this.path.length - 1, this.i + 1);

    if (Math.abs(d.y) > 0.05) vy = Math.sign(d.y) * Math.min(4, Math.abs(d.y) * 3);

    if (tgt) { const v = V3().subVectors(tgt, Player.eye()); ty = Math.atan2(-v.x, -v.z); tp = Math.atan2(v.y, Math.hypot(v.x, v.z)); }

  },
};

// ---------------------------------------------------------------- per-frame simulation
const EMPTY_INPUT = { moveX: 0, moveY: 0, padLookX: 0, padLookY: 0, mouseLookX: 0, mouseLookY: 0, gas: 0, brake: 0 };
function simulate(dt, A) {
  Game.worldTime += dt;
  let inp = A;
  if (Game.attract) inp = Bot.update(dt);
  if (Game.flags.cutscene) {
    inp = EMPTY_INPUT; Game.cutT = (Game.cutT || 0) + dt;
    if (Boss.e) { const v = V3().subVectors(Boss.e.pos.clone().setY(Boss.e.pos.y + 2.5), Player.eye()); Player.yaw += angWrap(Math.atan2(-v.x, -v.z) - Player.yaw) * Math.min(1, dt * 3); Player.pitch += (Math.atan2(v.y, Math.hypot(v.x, v.z)) - Player.pitch) * Math.min(1, dt * 3); }
  }
  Player.update(dt, inp);
  Vehicle.update(dt, inp);
  netUpdate(dt);
  Actors.update(dt); Turrets.update(dt); Boss.update(dt); Projectiles.update(dt);
  updateDoors(dt, Player.pos);
  world.timestep = Math.max(1 / 240, dt);
  world.step();
  syncProps(); updatePickups(dt); Game.update(dt); updateFX(dt); updateLevelAmbience(dt, Game.time); updateChopperLeave(dt);
  const zone = zoneAt(Player.pos);
  updateRain(dt, Player.pos, !!zone.rain);

  if (Game.session && !Game.attract) { Game.progT = (Game.progT || 0) - dt; if (Game.progT <= 0) { Game.progT = 1; AIHub.progress({ score: Game.score, label: Game.zoneLabel() }); } }

}
function updateCamera(dt) {

    const bob = Math.sin(Player.bobT * 2) * 0.035 * (1 - Player.aimK), sway = Math.cos(Player.bobT) * 0.02 * (1 - Player.aimK);
    camera.position.set(e.x + sway * Math.cos(Player.yaw), e.y + bob - Player.land * 0.15, e.z - sway * Math.sin(Player.yaw));
    camera.rotation.order = 'YXZ';
    let roll = Player.slideT > 0 ? 0.06 : 0;
    if (Player.dead) { Game.deathT += dt; const k = Math.min(1, Game.deathT * 1.5); camera.position.y = lerp(e.y, Player.pos.y + 0.3, k); roll = k * 0.6; }
    camera.rotation.set(Player.pitch + Player.recoil * 0.4, Player.yaw, roll);
  }
  if (FX.shakes > 0) { camera.position.x += rand(-1, 1) * FX.shakes * 0.06; camera.position.y += rand(-1, 1) * FX.shakes * 0.06; camera.rotation.z += rand(-1, 1) * FX.shakes * 0.01; }

// ---------------------------------------------------------------- main loop
let lastT = performance.now();
function frame() {
  const now = performance.now(); const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  pollInput();
  const A = Input.a;
  if (A.any) audioInit();
  if (Game.ended) { endInputFrame(); post.render(); return; }
  if (!$('touch').classList.contains('hidden') && (Input.pad || Input.lastDevice === 'kb' && A.any && Input.keys.size)) $('touch').classList.add('hidden');
  switch (Game.state) {
    case 'title':
      updateTitleCam(dt);
      if (A.any) UI.idleT = 0; else UI.idleT += dt;
      UI.update(dt, A);
      if (UI.idleT > 10 && UI.menu === 'title' && UI.stack.length === 0 && $('touch').classList.contains('hidden')) startAttract();
      break;
    case 'intro': updateIntro(dt, A); break;
    case 'play': {
      if (Game.attract && (A.any || Input.mouseDX || Input.mouseDY)) { UI.endAttract(); break; }
      if (Game.session && !Game.hubStarted) {
        const t = AIHub.time();
        if (UI.menu === 'session') UI.update(dt, A);
        if (UI.menu === 'session' && A.any) sessionReady();
        if (t >= 0) { Game.hubStarted = true; Game.event('start'); }
        else { if (t > -Infinity) Game.toast('GET READY  ' + Math.ceil(-t / 1000), 0.3); updateCamera(dt); updateFX(dt); updateLevelAmbience(dt, 0); updateRain(dt, Player.pos, true); Game.updateHud(); break; }
      }
      if (A.pause && !Game.attract && !Game.flags.cutscene) { UI.open('pause'); break; }
      const reps = (window.__dbg && window.__dbg.steps) || 1;
      for (let i = 0; i < reps && Game.state === 'play'; i++) simulate(dt, A);
      updateCamera(dt); Game.updateHud();
      break;
    }
    case 'hack': Game.updateHack(dt, A); updateCamera(dt); netUpdate(dt); break;
    case 'menu': case 'debrief':
      UI.update(dt, A); updateFX(dt); if (Game.state === 'menu') netUpdate(dt);
      if (Game.state === 'debrief' && !Game.session) { updateLevelAmbience(dt, 0); if (Net.active) { netUpdate(dt); if (UI.menu === 'debrief' && (Game._vsT = (Game._vsT || 0) - dt) <= 0) { Game._vsT = 1; UI.render(); } } }
      break;
  }
  if (Game.state === 'play' && UI.menu === 'session') { /* waiting for the ready gesture */ }
  if (window.__dbg && window.__dbg.noPost) renderer.render(scene, camera); else post.render();
  endInputFrame();
}

// the probe samples the controls live, so a short key press is seen even between slow frames
function liveInput() {
  let x = Input.a.moveX || 0, y = Input.a.moveY || 0, fire = !!Input.a.fire;
  if (keyDown('KeyD')) x = 1; if (keyDown('KeyA')) x = -1; if (keyDown('KeyW')) y = -1; if (keyDown('KeyS')) y = 1;
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) if (p && p.connected) { if (Math.abs(p.axes[0] || 0) > DEAD) x = p.axes[0]; if (Math.abs(p.axes[1] || 0) > DEAD) y = p.axes[1]; if (p.buttons[PAD.R2] && p.buttons[PAD.R2].pressed) fire = true; break; }
  return { x: Math.round(x * 100) / 100, y: Math.round(y * 100) / 100, fire: fire || !!(Input.mouseButtons & 1) };
}

  Game.state = 'title'; musicPlay('title');
  UI.open('title', false);
  if (touchOnly) { $('touch').classList.remove('hidden'); $('touchset').onclick = () => { $('touch').classList.add('hidden'); UI.open('settings'); }; }
  addEventListener('pointerdown', () => audioInit(), { once: true });
  addEventListener('keydown', () => audioInit(), { once: true });
}
boot();

// ---- 08-net.js
// ============================================================================
// Online Versus outside AI Hub sessions — the game's own multiplayer.
// Per the hub protocol ("Games with multiplayer of their own") the netcode talks to one small
// interface { me, isHost, players, send, onMessage, onLeave }; peerNet() adapts PeerJS to it.
// It is never offered or loaded inside a session (sessions run side by side, no traffic).
// Two players race the same mission on their own copies; each sees the other as a ghost
// with a live score, and the debrief ranks them.
// ============================================================================
const PEER_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/+esm';
const ROOM_PREFIX = 'sintaxerror-room-';
const Net = { peer: null, conn: null, net: null, code: '', joinCode: ['A', 'A', 'A', 'A'], status: 'Not connected', rival: null, ghost: null, sendT: 0, active: false, rivalDone: null, left: false };

function peerNet(conn, isHost) {
  const msg = [], leave = [];
  const other = isHost ? 1 : 0;
  conn.on('data', (d) => { Net.lastMsg = performance.now(); if (d && typeof d === 'object') msg.forEach((f) => f(d, other)); });
  conn.on('close', () => leave.forEach((f) => f(other)));
  conn.on('error', () => leave.forEach((f) => f(other)));
  return {
    me: isHost ? 0 : 1, isHost, players: [{ id: 0, name: 'Host' }, { id: 1, name: 'Guest' }],
    send: (data) => { if (conn.open) conn.send(data); },
    onMessage: (fn) => msg.push(fn), onLeave: (fn) => leave.push(fn),
  };
}
function netStatus(s) { Net.status = s; if (UI.menu === 'online' || UI.menu === 'join') UI.render(); }
async function loadPeer() { const m = await import(PEER_URL); return m.Peer || m.default; }
async function netHost() {
  if (AIHub.active) return; // sessions never use the game's own netcode
  netClose(); netStatus('Opening a room…');
  try {
    const Peer = await loadPeer();
    const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    Net.code = Array.from({ length: 4 }, () => letters[Math.floor(Math.random() * letters.length)]).join('');
    Net.peer = new Peer(ROOM_PREFIX + Net.code);
    Net.peer.on('open', () => netStatus('Room code: ' + Net.code + ' — waiting for your rival'));
    Net.peer.on('connection', (c) => { if (Net.conn) { c.close(); return; } c.on('open', () => netConnected(c, true)); });
    Net.peer.on('error', (e) => netStatus(e && e.type === 'unavailable-id' ? 'Code taken — host again' : 'Network error: ' + (e && e.type ? e.type : 'unknown')));
  } catch (e) { netStatus('Could not load the online library'); }
}
async function netJoin() {
  if (AIHub.active) return;
  netClose(); const code = Net.joinCode.join(''); netStatus('Connecting to ' + code + '…');
  try {
    const Peer = await loadPeer();
    Net.peer = new Peer();
    Net.peer.on('open', () => { const c = Net.peer.connect(ROOM_PREFIX + code, { reliable: true }); c.on('open', () => netConnected(c, false)); });
    Net.peer.on('error', (e) => netStatus(e && e.type === 'peer-unavailable' ? 'No room with code ' + code : 'Network error: ' + (e && e.type ? e.type : 'unknown')));
  } catch (e) { netStatus('Could not load the online library'); }
}
function netConnected(conn, isHost) {
  Net.lastMsg = performance.now(); Net.conn = conn; Net.net = peerNet(conn, isHost); Net.left = false; Net.rival = null; Net.rivalDone = null;
  Net.net.onMessage((d) => netMessage(d));
  Net.net.onLeave(Net.leaveFn = () => { if (Net.left) return; Net.left = true; Net.active = false; if (Net.ghost) Net.ghost.root.visible = false; if (Game.state !== 'title') Game.toast('RIVAL DISCONNECTED'); netStatus('Rival disconnected'); });
  if (isHost) { Net.net.send({ t: 'go', diff: settings.difficulty }); netStatus('Rival joined — starting'); netStart(); }
  else netStatus('Connected — waiting for the host');
}
function netMessage(d) {
  if (d.t === 'go') { settings.difficulty = clamp(d.diff | 0, 0, 2); netStart(); }
  else if (d.t === 'p') { Net.rival = Net.rival || { pos: V3(), yaw: 0 }; Net.rival.target = V3(+d.x || 0, +d.y || 0, +d.z || 0); Net.rival.yaw = +d.r || 0; Net.rival.score = d.s | 0; Net.rival.zone = String(d.zn || '').slice(0, 24); Net.rival.dead = !!d.dd; Game.hudDirty = true; }
  else if (d.t === 'done') { Net.rivalDone = { score: d.s | 0, time: +d.tm || 0 }; Game.feed('RIVAL FINISHED: ' + (d.s | 0).toLocaleString(), '#22e4ff'); }
}
function netStart() {
  Net.active = true;
  if (!Net.ghost) {
    Net.ghost = buildHumanoid({ shirt: 0x3b82f6, pants: 0x1a2a4a, skin: 0xd8a27a, hair: 0x101010, eyes: 0x22e4ff, vest: 0x22e4ff, gun: 'rifle', scale: 1 });
    const tag = textSprite('RIVAL', '#3b82f6', 256, 64, 'bold 48px sans-serif'); tag.position.y = 2.25; tag.scale.setScalar(0.6); Net.ghost.root.add(tag); Net.ghost.tag = tag;
    scene.add(Net.ghost.root);
  }
  Net.ghost.root.visible = false; Net.ghostState = { vel: V3(), phase: 0, flinch: 0, aimT: 0.5, aimPitch: 0, kick: 0, kind: 'rival' };
  startIntro();
}
function netUpdate(dt) {
  if (!Net.active || !Net.net) return;
  if (performance.now() - Net.lastMsg > 6000) { Net.leaveFn(); return; } // heartbeat: a closed tab rarely says goodbye
  Net.sendT -= dt;
  if (Net.sendT <= 0) {
    Net.sendT = 0.1;
    Net.net.send({ t: 'p', x: Math.round(Player.pos.x * 100) / 100, y: Math.round(Player.pos.y * 100) / 100, z: Math.round(Player.pos.z * 100) / 100, r: Math.round(Player.yaw * 100) / 100, s: Game.score, zn: Game.zoneLabel(), dd: Player.dead ? 1 : 0 });
  }
  const R = Net.rival, G2 = Net.ghost;
  if (!R || !R.target || !G2) return;
  G2.root.visible = !R.dead;
  const prev = V3().copy(R.pos);
  if (R.pos.distanceTo(R.target) > 6) R.pos.copy(R.target); else R.pos.lerp(R.target, 1 - Math.exp(-10 * dt));
  const st = Net.ghostState; st.vel.subVectors(R.pos, prev).divideScalar(Math.max(dt, 1e-3));
  G2.root.position.copy(R.pos); G2.root.rotation.y = R.yaw + Math.PI;
  G2.tag.lookAt(camera.position);
  animateHumanoid(G2, st, dt);
}
function netFinish() { if (Net.active && Net.net) Net.net.send({ t: 'done', s: Game.score, tm: Math.round(Game.time) }); }
function netClose() {
  Net.active = false; Net.left = true;
  try { if (Net.conn) Net.conn.close(); if (Net.peer) Net.peer.destroy(); } catch (e) { /* already closed */ }
  Net.conn = null; Net.peer = null; Net.net = null; Net.rival = null; Net.rivalDone = null;
  if (Net.ghost) Net.ghost.root.visible = false;
  Net.status = 'Not connected';
}
// keyboard typing for the join code
addEventListener('keydown', (e) => {
  if (UI.menu !== 'join' || !/^Key[A-Z]$/.test(e.code)) return;
  const i = Net.joinIdx || 0; Net.joinCode[i] = e.code.slice(3); Net.joinIdx = (i + 1) % 4; UI.render();
});

</script>
