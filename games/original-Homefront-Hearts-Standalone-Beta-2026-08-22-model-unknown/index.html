<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f47c7c" />
    <meta name="description" content="Homefront Hearts — a colourful isometric household-management game spanning a marriage from 1954 onward." />
    <title>Homefront Hearts — Standalone Beta</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f47c7c'/%3E%3Ccircle cx='30' cy='62' r='20' fill='%23ffd166' fill-opacity='.35'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='27' font-weight='800' fill='%23fff' text-anchor='middle' letter-spacing='-3'%3EHH%3C/text%3E%3C/svg%3E" />
    <script type="importmap">
      {
        "imports": {
          "three": "/lib/three/three.webgpu.js",
          "three/webgpu": "/lib/three/three.webgpu.js",
          "three/tsl": "/lib/three/three.tsl.js",
          "three/addons/": "/lib/three/addons/",
          "kit/": "/lib/kit/"
        }
      }
    </script>
    <link rel="modulepreload" href="/lib/three/three.core.js" />
    <link rel="modulepreload" href="/lib/three/three.webgpu.js" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app" class="app-shell is-intro">
      <section id="world" class="world-panel" aria-label="Isometric household">
        <header id="top-bar" class="top-bar" hidden></header>
        <aside id="metric-dock" class="metric-dock" aria-label="Household status" hidden></aside>
        <div id="world-hint" class="world-hint" hidden></div>
        <div id="timeline" class="timeline" aria-label="Marriage eras" hidden></div>
        <div id="floaters" class="floaters" aria-hidden="true"></div>
      </section>
      <aside id="sidebar" class="sidebar" aria-label="Household ledger" hidden></aside>
      <div id="start" class="start-overlay"></div>
    </main>
    <div id="toast-region" aria-live="polite"></div>
    <div id="modal-layer"></div>
    <noscript>This game requires JavaScript.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
