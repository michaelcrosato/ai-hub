<script>/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

		if (id === "grace") {
			for (const u of a.units) u.hp = Math.min(u.max, u.hp + 10);
			this.events.push({ type: "heal", at: { ...a } });
		}
		if (id === "golem") {
			a.units.push(this.unit("golem"));
			this.events.push({ type: "summon", at: { ...a } });
		}
		if (id === "reveal")
			for (const t of this.s.tiles) if (t.p === this.s.plane) t.seen = true;
		if (id === "harvest") {
			this.s.gold += 40;
			for (const c of this.s.cities) c.progress += 12;
		}
		if (id === "stride") a.mp = 3;
		if (id === "concord") {
			this.s.over = "concord";
			this.s.renown += 1000;
		}
		this.commit(
			id === "concord"
				? "The two moons rise together. The worlds remember how to be whole."
				: `${s.name} is woven into the world.`,
		);
		return true;
	}
	equip(item) {
		this.s.equipped = this.s.equipped === item ? null : item;
		this.commit(
			this.s.equipped
				? `${item} is entrusted to Seren.`
				: "Seren sets the relic safely aside.",
		);
	}
	diplomacy(action) {
		if (this.s.over) return;
		if (action === "gift") {
			if (this.s.gold < 30) return this.commit("A worthy gift costs 30 gold.");
			this.s.gold -= 30;
			this.s.relation += 2;
			this.commit(
				"Malrec: “A thoughtful tribute! I mean, gift. A gift.” Relations improve.",
			);
		}
		if (action === "pact") {
			if (this.s.relation < 2)
				return this.commit(
					"Malrec mistrusts your offer. A gift might soften his temper.",
				);
			if (this.s.pact > this.s.turn)
				return this.commit("Your pact still holds.");
			this.s.pact = this.s.turn + 5;
			this.s.ritual = Math.max(0, this.s.ritual - 3);
			this.s.relation -= 1;
			this.commit("Five seasons of peace. Malrec puts his eclipse on hold.");
		}
		if (action === "tribute") {
			if (this.s.relation >= 2 || this.s.seals.length >= 2) {
				this.s.gold += 35;
				this.s.relation -= 3;
				this.commit("Malrec sends 35 gold and a very pointed letter.");
			} else {
				this.s.relation -= 1;
				this.s.ritual += 1;
				this.commit(
					"Malrec refuses. “Dreadful manners, truly dreadful.” His ritual quickens.",
				);
			}
		}
	}
	nextTurn() {
		if (this.battle) return this.endRound();
		if (this.s.over) return;
		const s = this.s,
			i = this.income();
		s.turn++;
		s.seat = (s.seat + 1) % s.council;
		s.gold = Math.max(0, s.gold + i.gold - i.upkeep);
		s.mana += i.mana;
		const notes = [];
		for (const c of s.cities) {
			c.progress += 8 + c.pop + (c.buildings.includes("smith") ? 5 : 0);
			if (s.turn % (c.buildings.includes("garden") ? 3 : 4) === 0)
				c.pop = Math.min(9, c.pop + 1);
			if (c.queue) {
				const b = BUILDINGS.find((x) => x.id === c.queue);
				if (c.progress >= b.cost) {
					if (b.unit && !this.recruit(b.id, c)) {
						notes.push(`${c.name}: company slots are full.`);
					} else {
						if (!b.unit) c.buildings.push(b.id);
						c.progress -= b.cost;
						notes.push(`${c.name} completes ${b.name}.`);
						c.queue = null;
						s.renown += 25;
					}
				}
			}
		}
		if (s.research) {
			s.researchPoints += i.research;
			const sp = SPELLS.find((x) => x.id === s.research);
			if (s.researchPoints >= sp.cost) {
				s.known.push(sp.id);
				s.researchPoints -= sp.cost;
				s.research = null;
				s.renown += 55;
				notes.push(`${sp.name} discovered!`);
				this.events.push({ type: "research", at: { ...this.army() } });
			}
		}
		for (const a of s.armies) {
			a.mp = 3;
			const city = this.cityAt(a);
			for (const u of a.units) u.hp = Math.min(u.max, u.hp + (city ? 6 : 2));
		}
		if (s.turn > s.pact) s.ritual++;
		if (s.turn >= 6 && s.turn % 5 === 1 && s.turn > s.pact) {
			s.raiders.push({ id: s.nextId++, q: 3, r: 0 });
			notes.push("An ashen raiding party leaves Cinder Crown.");
		}
		for (const r of s.raiders) {
			const a = s.armies.find((a) => a.p === 0 && a.q === r.q && a.r === r.r);
			if (a) continue;
			const dest = { q: -3, r: 2, p: 0 };
			const path = this.path({ ...r, p: 0 }, dest);
			if (path?.route.length) {
				r.q = path.route[0].q;
				r.r = path.route[0].r;
			}
			if (r.q === -3 && r.r === 2) {
				s.gold = Math.max(0, s.gold - 25);
				s.ritual += 2;
				s.raiders = s.raiders.filter((x) => x !== r);
				notes.push(
					"Raiders plunder Willowmere! −25 gold; the eclipse hastens.",
				);
			} else this.reveal({ ...r, p: 0 }, 0);
		}
		this.commit(
			notes.length
				? notes.join(" ")
				: `Season ${s.turn}. Your realm grows; your companies are refreshed.`,
		);
	}
	startBattle(t, guard, retreat, raidId = null) {
		const a = this.army();
		if (!a || this.battle) return;
		const rand = rng32(this.s.seed + t.q * 271 + t.r * 37 + t.p * 911);
		const tiles = [];
		for (let q = -4; q <= 4; q++)
			for (let r = -4; r <= 4; r++)
				if (Math.abs(q + r) <= 4) {
					const n = rand();
					tiles.push({
						q,
						r,
						p: t.p,
						h: 0.18,
						terrain: n < 0.1 ? "stone" : n < 0.25 ? "forest" : "grass",
					});
				}
		const ally = [
				[-3, 0],
				[-3, 1],
				[-2, -1],
				[-3, 2],
				[-2, -2],
				[-4, 1],
			],
			enemy = [
				[3, 0],
				[3, -1],
				[2, 1],
				[3, -2],
				[2, 2],
				[4, -1],
			];
		const us = a.units.map((u, i) => ({
			...clone(u),
			team: 0,
			q: ally[i][0],
			r: ally[i][1],
			moved: false,
			attacked: false,
			guard: false,
		}));
		for (let i = 0; i < guard.length; i++) {
			const u = this.unit(guard[i]);
			us.push({
				...u,
				team: 1,
				q: enemy[i][0],
				r: enemy[i][1],
				moved: false,
				attacked: false,
				guard: false,
			});
		}
		for (const t of tiles)
			if (us.some((u) => u.q === t.q && u.r === t.r)) t.terrain = "grass";
		this.battle = {
			name: raidId ? "The Ashen Raid" : t.name,
			site: { q: t.q, r: t.r, p: t.p },
			retreat,
			raidId,
			tiles,
			units: us,
			active: us[0].id,
			phase: "player",
			round: 1,
			spellUsed: false,
			log: "Your companies take the field.",
			result: null,
		};
		this.s.flags.battle = true;
		this.onChange?.();
	}
	battleUnit() {
		return this.battle?.units.find(
			(u) => u.id === this.battle.active && u.hp > 0,
		);
	}
	battleAt(t) {
		return this.battle?.units.find(
			(u) => u.q === t.q && u.r === t.r && u.hp > 0,
		);
	}
	reachable(u) {
		if (!u || u.moved || this.battle.phase !== "player") return [];
		return this.battle.tiles.filter((t) => {
			const p = this.path(u, t, true);
			return p && p.cost <= this.stats(u).move;
		});
	}
	battleAction(t) {
		const b = this.battle;
		if (!b || b.phase !== "player" || b.result) return;
		const target = this.battleAt(t),
			u = this.battleUnit();
		if (target?.team === 0) {
			b.active = target.id;
			this.commit(`${UNITS[target.kind].name} awaits your order.`);
			return;
		}
		if (!u) return;
		if (target?.team === 1) {
			if (u.attacked)
				return this.commit(
					"This troop has already struck. Select another or end the round.",
				);
			if (hexDistance(u, target) > this.stats(u).range)
				return this.commit(
					"Beyond your reach. Move closer, or choose a ranged troop.",
				);
			this.attack(u, target);
			this.battleCheck();
			this.commit();
			return;
		}
		if (u.moved)
			return this.commit(
				"This troop has already moved. Strike, guard, or select another.",
			);
		const path = this.path(u, t, true);
		if (!path || path.cost > this.stats(u).move)
			return this.commit("Choose a blue hex within this troop’s movement.");
		const old = { ...u };
		u.q = t.q;
		u.r = t.r;
		u.moved = true;
		this.events.push({ type: "move", from: old, at: { ...u } });
		this.commit(`${UNITS[u.kind].name} advances.`);
	}
	attack(u, target) {
		const st = this.stats(u),
			tile = this.battle.tiles.find(
				(t) => t.q === target.q && t.r === target.r,
			),
			armor =
				this.stats(target).armor +
				(target.guard ? 2 : 0) +
				(tile?.terrain === "forest" ? 1 : 0);
		let dmg = Math.max(2, st.atk - armor);
		u.attacked = true;
		this.events.push({
			type: "strike",
			from: { ...u },
			at: { ...target },
			kind: u.kind,
		});
		this.hurt(target, dmg, "hit");
		this.battle.log = `${UNITS[u.kind].name} strikes ${UNITS[target.kind].name} for ${dmg}.`;
		this.notice = this.battle.log;
	}
	hurt(u, n, type) {
		u.hp = Math.max(0, u.hp - n);
		this.events.push({ type, at: { ...u }, damage: n });
	}
	guard() {
		const u = this.battleUnit();
		if (!u || this.battle.phase !== "player") return;
		if (u.attacked)
			return this.commit("This troop has already spent its action.");
		u.guard = true;
		u.attacked = true;
		u.moved = true;
		this.commit(`${UNITS[u.kind].name} guards. +2 armor until the next round.`);
	}
	endRound() {
		const b = this.battle;
		if (!b || b.phase !== "player" || b.result) return;
		b.phase = "enemy";
		b.queue = b.units.filter((u) => u.team === 1 && u.hp > 0).map((u) => u.id);
		this.commit("The enemy makes its move.");
	}
	aiStep() {
		const b = this.battle;
		if (!b || b.phase !== "enemy" || b.result) return;
		if (!b.queue.length) {
			b.phase = "player";
			b.round++;
			b.spellUsed = false;
			for (const u of b.units) {
				u.moved = false;
				u.attacked = false;
				u.guard = false;
			}
			const first = b.units.find((u) => u.team === 0 && u.hp > 0);
			b.active = first?.id;
			this.commit(`Round ${b.round}. Your companies await.`);
			return;
		}
		const nextId = b.queue.shift(),
			u = b.units.find((u) => u.id === nextId && u.hp > 0);
		if (!u) return;
		const targets = b.units
			.filter((x) => x.team === 0 && x.hp > 0)
			.sort((a, c) => hexDistance(u, a) - hexDistance(u, c) || a.hp - c.hp);
		if (!targets.length) return this.battleCheck();
		const target = targets[0],
			stat = this.stats(u);
		if (hexDistance(u, target) > stat.range) {
			const opts = b.tiles
				.map((t) => ({ t, path: this.path(u, t, true) }))
				.filter((x) => x.path && x.path.cost <= stat.move)
				.sort(
					(a, c) =>
						hexDistance(a.t, target) - hexDistance(c.t, target) ||
						a.path.cost - c.path.cost,
				);
			if (opts.length) {
				const old = { ...u };
				u.q = opts[0].t.q;
				u.r = opts[0].t.r;
				this.events.push({ type: "move", from: old, at: { ...u } });
			}
		}
		const inRange = targets
			.filter((t) => hexDistance(u, t) <= stat.range)
			.sort((a, c) => a.hp - c.hp);
		if (inRange.length) this.attack(u, inRange[0]);
		this.battleCheck();
		this.commit();
	}
	battleCheck() {
		const b = this.battle;
		if (!b) return;
		if (!b.units.some((u) => u.team === 1 && u.hp > 0)) {
			b.result = "won";
			b.phase = "over";
			this.notice = "Victory! The field is yours.";
		} else if (!b.units.some((u) => u.team === 0 && u.hp > 0)) {
			b.result = "lost";
			b.phase = "over";
			this.notice = "Your company has fallen. Their tale will be remembered.";
		}
	}
	finishBattle(flee = false) {
		const b = this.battle,
			a = this.army();
		if (!b || (!b.result && !flee)) return;
		a.units = b.units
			.filter((u) => u.team === 0 && u.hp > 0)
			.map((u) => {
				const copy = {
					id: u.id,
					kind: u.kind,
					hp: u.hp,
					max: u.max,
					xp: u.xp,
					level: u.level,
				};
				if (b.result === "won") {
					copy.xp += 12;
					if (copy.kind === "hero" && copy.xp >= copy.level * 20) {
						copy.level++;
						copy.max += 4;
						copy.hp = Math.min(copy.max, copy.hp + 8);
					}
				}
				return copy;
			});
		const t = this.tile(b.site.q, b.site.r, b.site.p);
		let msg;
		if (b.result === "won" && !flee) {
			this.s.wins++;
			this.s.gold += 40;
			this.s.renown += 80;
			if (b.raidId) {
				this.s.raiders = this.s.raiders.filter((r) => r.id !== b.raidId);
				msg = "The raiders scatter. Your hearths are safe.";
			} else {
				t.owner = true;
				if (t.type === "node") {
					if (!this.s.seals.includes(t.seal)) this.s.seals.push(t.seal);
					this.s.renown += 150;
					msg = `${t.name} is bound. +5 mana each season. The worlds draw closer.`;
				} else if (t.type === "tower") {
					this.s.over = "conquest";
					this.s.renown += 1000;
					msg =
						"Cinder Crown falls. Malrec concedes, with surprisingly good grace.";
				} else {
					const item = this.s.relics.includes("Dawnglass Blade")
						? "Moonward Mantle"
						: "Dawnglass Blade";
					if (!this.s.relics.includes(item)) this.s.relics.push(item);
					this.s.mana += 15;
					msg = `${t.name} yields ${item}, 40 gold, and 15 mana.`;
				}
			}
		} else {
			a.q = b.retreat.q;
			a.r = b.retreat.r;
			a.p = b.retreat.p;
			a.mp = 0;
			this.s.gold = Math.max(0, this.s.gold - 12);
			msg = flee
				? "Your survivors withdraw. The road remains, and so does hope."
				: "The company is lost. Gather new strength at your towns.";
		}
		if (!a.units.length)
			this.s.armies = this.s.armies.filter((x) => x.id !== a.id);
		this.battle = null;
		this.commit(msg);
	}
	checkEnd() {
		if (this.s.over) return;
		if (this.s.ritual >= 30) {
			this.s.over = "eclipse";
			this.log(
				"The eclipse settles over both worlds. A new chronicle must carry the dawn.",
			);
		} else if (!this.s.armies.length) {
			this.s.over = "fallen";
			this.log("Your last banner falls. Yet the roots remember every name.");
		}
	}
	score() {
		return (
			this.s.renown +
			this.s.tiles.filter((t) => t.seen).length * 2 +
			Math.floor(this.s.gold / 5) +
			this.s.known.length * 15
		);
	}
	save() {
		if (this.battle || window.AIHub?.active) return;
		try {
			localStorage.setItem(SAVE_KEY, JSON.stringify(this.s));
		} catch {}
	}
	static load() {
		try {
			const s = JSON.parse(localStorage.getItem(SAVE_KEY));
			if (!s || s.version !== 1 || !Array.isArray(s.tiles)) return null;
			const c = new Chronicle();
			c.s = s;
			c.battle = null;
			c.events = [];
			c.notice = s.journal[0]?.text || "Your chronicle continues.";
			return c;
		} catch {
			return null;
		}
	}
}


class SpellSong {
	constructor() {
		this.ctx = null;
		this.step = 0;
		this.next = 0;
		this.stopped = false;
		this.settings = { music: 0.35, sfx: 0.7, voice: 0.55 };
	}
	unlock() {
		if (this.stopped) return;
		if (!this.ctx) {
			const AC = window.AudioContext || window.webkitAudioContext;
			if (!AC) return;
			this.ctx = new AC();
			this.master = this.ctx.createGain();
			this.master.gain.value = 0.65;
			this.master.connect(this.ctx.destination);
			this.musicBus = this.ctx.createGain();
			this.musicBus.connect(this.master);
			this.sfxBus = this.ctx.createGain();
			this.sfxBus.connect(this.master);
			this.voiceBus = this.ctx.createGain();
			this.voiceBus.connect(this.master);
			this.next = this.ctx.currentTime + 0.1;
		}
		this.ctx.resume().catch(() => {});
		this.volumes();
	}
	volumes() {
		if (!this.ctx) return;
		for (const name of ["music", "sfx", "voice"])
			this[name + "Bus"].gain.setTargetAtTime(
				this.settings[name],
				this.ctx.currentTime,
				0.04,
			);
	}
	tone(
		freq,
		time,
		duration = 0.35,
		gain = 0.15,
		type = "triangle",
		bus = "music",
		slide = 1,
	) {
		if (!this.ctx || this.stopped) return;
		const o = this.ctx.createOscillator(),
			g = this.ctx.createGain();
		o.type = type;
		o.frequency.setValueAtTime(freq, time);
		o.frequency.exponentialRampToValueAtTime(
			Math.max(20, freq * slide),
			time + duration,
		);
		g.gain.setValueAtTime(0.0001, time);
		g.gain.exponentialRampToValueAtTime(gain, time + 0.009);
		g.gain.exponentialRampToValueAtTime(0.0001, time + duration);
		o.connect(g);
		g.connect(this[bus + "Bus"]);
		o.start(time);
		o.stop(time + duration + 0.015);
		o.onended = () => {
			o.disconnect();
			g.disconnect();
		};
	}
	tick(battle = false) {
		if (!this.ctx || this.stopped || this.ctx.state !== "running") return;
		const now = this.ctx.currentTime;
		if (this.next < now - 0.5) this.next = now;
		const scale = [0, 2, 3, 7, 10, 12, 14, 15],
			melody = [
				0, 4, 2, 1, 3, 2, 4, 6, 5, 4, 2, 3, 1, 2, 0, 3, 4, 6, 7, 6, 4, 3, 2, 1,
				3, 5, 4, 2, 1, 3, 2, 0,
			];
		while (this.next < now + 0.15) {
			const n = this.step++,
				root = [48, 46, 43, 45][Math.floor(n / 16) % 4],
				beat = battle ? 0.22 : 0.29,
				note = root + 12 + scale[melody[n % melody.length]];
			this.tone(
				440 * 2 ** ((note - 69) / 12),
				this.next,
				0.7,
				0.09,
				"triangle",
			);
			this.tone(440 * 2 ** ((note - 57) / 12), this.next, 0.24, 0.018, "sine");
			if (n % 4 === 0)
				this.tone(440 * 2 ** ((root - 69) / 12), this.next, 1.2, 0.12, "sine");
			if (battle && n % 2 === 0)
				this.tone(
					n % 4 === 0 ? 96 : 140,
					this.next,
					0.12,
					0.11,
					"triangle",
					"music",
					0.3,
				);
			this.next += beat;
		}
	}
	sfx(kind) {
		if (!this.ctx || this.stopped) return;
		const t = this.ctx.currentTime;
		const events = {
			move: [390, 0.07, 0.06, "sine", 1.25],
			ui: [540, 0.075, 0.06, "triangle", 1.5],
			hit: [120, 0.16, 0.3, "sawtooth", 0.3],
			spell: [260, 0.45, 0.2, "triangle", 3],
			heal: [420, 0.5, 0.12, "sine", 2],
			summon: [100, 0.65, 0.18, "triangle", 4],
			portal: [180, 0.6, 0.12, "sine", 5],
			march: [200, 0.1, 0.09, "triangle", 0.7],
			research: [520, 0.45, 0.12, "sine", 1.5],
		};
		const a = events[kind] || events.ui;
		this.tone(a[0], t, a[1], a[2], a[3], "sfx", a[4]);
		if (kind === "research" || kind === "spell")
			for (let i = 1; i < 4; i++)
				this.tone(
					a[0] * [1, 1.25, 1.5, 2][i],
					t + i * 0.07,
					0.4,
					0.06,
					"sine",

function syncGame() {

		} else {
			const a = game.army();

			game.s.plane = a?.p || 0;
		}
		previousBattle = b;
	}
	if (!b && cursor?.p !== game.s.plane)
		cursor = game.tile(cursor?.q || 0, cursor?.r || 0, game.s.plane);
	const stamp = visualStamp();
	if (stamp !== renderStamp) {
		view.rebuild(game, mode === "title");
		renderStamp = stamp;
	}
	view.updateRings(mode === "title" ? null : cursor);
	for (const e of game.events) audio.sfx(e.type);
	view.events(game.events);
	if (mode === "play") {
		game.save();
		if (lastNotice !== game.notice) {
			notify(game.notice);
			lastNotice = game.notice;

	if (AIHub.active && AIHub.time() < 0) return;
	if (
		[
			"arrowup",
			"arrowdown",
			"arrowleft",
			"arrowright",
			"w",
			"a",
			"s",
			"d",
		].includes(key)
	) {
		if (e.repeat && performance.now() < keyNext) return;
		keyNext = performance.now() + 125;
		const dx = ["arrowleft", "a"].includes(key)
				? -1
				: ["arrowright", "d"].includes(key)
					? 1
					: 0,
			dy = ["arrowup", "w"].includes(key)
				? -1
				: ["arrowdown", "s"].includes(key)
					? 1
					: 0;
		navigate(dx, dy);
	} else if (!e.repeat) {
		if (key === "enter" || key === " ") confirm();
		else if (key === "q") changeTab(-1);
		else if (key === "e" || key === "tab") changeTab(e.shiftKey ? -1 : 1);
		else if (key === "n" && !menu && mode === "play") endSeason();
		else if (key === "f" && !menu && mode === "play")
			openMenu(game.battle ? "battle-orders" : "inspect");
		else if (key === "v" && !menu && mode === "play" && !game.battle)
			action(`plane:${1 - game.s.plane}`);
		else if (key === "j") {
			view.yaw -= 0.2;
		} else if (key === "l") {
			view.yaw += 0.2;
		} else if (key === "-" || key === "=") {
			view.zoom = clamp(view.zoom + (key === "=" ? 0.1 : -0.1), 0.7, 1.8);
			view.resize();
		}
	}
});
document.addEventListener("keyup", () => {
	controls.x = 0;
	controls.y = 0;
	controls.fire = false;
});
document.addEventListener(
	"wheel",
	(e) => {
		lastInput = performance.now();
		if (mode === "attract") {
			exitAttract();
			return;
		}
		if (!menu && mode === "play") {
			view.zoom = clamp(view.zoom - e.deltaY * 0.0008, 0.7, 1.8);
			view.resize();
		}
	},
	{ passive: true },
);
addEventListener("resize", () => view?.resize());
function pollPad(dt) {
	const pad = [...(navigator.getGamepads?.() || [])].find(
		(p) => p && p.connected,
	);
	if (!pad) {
		padPrev = [];
		return;
	}
	const down = pad.buttons.map((b) => b.pressed),
		pressed = (i) => down[i] && !padPrev[i];
	let x = pad.axes[0] || 0,
		y = pad.axes[1] || 0;
	if (down[14]) x = -1;
	if (down[15]) x = 1;
	if (down[12]) y = -1;
	if (down[13]) y = 1;
	x *= settings.invertX ? -1 : 1;
	y *= settings.invertY ? -1 : 1;
	if (Math.abs(x) < 0.45) x = 0;
	if (Math.abs(y) < 0.45) y = 0;
	if (x && y) {
		if (Math.abs(x) > Math.abs(y)) y = 0;
		else x = 0;
	}
	controls.x = x;
	controls.y = y;
	controls.fire = !!down[0];
	const activity =
		x ||
		y ||
		down.some((v, i) => v && !padPrev[i]) ||
		Math.abs(pad.axes[2] || 0) > 0.3 ||
		Math.abs(pad.axes[3] || 0) > 0.3;
	if (activity && !inputEvent()) {
		padPrev = down;
		return;
	}
	if (pressed(9) && !down[8]) {
		if (menu === "settings") closeMenu();
		else openMenu("settings");
	}
	if (!stopped && (!AIHub.active || AIHub.time() >= 0)) {
		if ((x || y) && performance.now() >= axisNext) {
			axisNext = performance.now() + 185;
			navigate(Math.sign(x), Math.sign(y));
		}
		if (pressed(0)) confirm();
		if (pressed(1)) back();
		if (pressed(2) && !menu && mode !== "title")
			openMenu(game.battle ? "battle-orders" : "inspect");
		if (pressed(3) && !menu && mode === "play") endSeason();
		if (pressed(4)) changeTab(-1);
		if (pressed(5)) changeTab(1);
		if (pressed(10) && !menu && mode === "play" && !game.battle) focusArmy();
		if (!menu && mode === "play") {
			const rx = (pad.axes[2] || 0) * (settings.invertX ? -1 : 1),
				ry = (pad.axes[3] || 0) * (settings.invertY ? -1 : 1);
			if (Math.abs(rx) > 0.2) view.yaw += rx * dt * 0.6;
			const dz =
				(pad.buttons[7]?.value || 0) - (pad.buttons[6]?.value || 0) - ry * 0.4;
			if (Math.abs(dz) > 0.1) {
				view.zoom = clamp(view.zoom + dz * dt * 0.5, 0.7, 1.8);
				view.resize();
			}
			if (pressed(11) && !game.battle) action(`plane:${1 - game.s.plane}`);
		}
	}
	padPrev = down;
}
function finishHub() {
	if (!AIHub.active) return;
	AIHub.result({
		score: game.score(),
		stats: {
			"Seals bound": game.s.seals.length,
			"Battles won": game.s.wins,
			"Spells learned": game.s.known.length,
		},
		awards:
			game.s.seals.length === 3
				? [{ title: "Worldmender", detail: "Bound all three ancient seals" }]
				: [],
	});
}
function startAttract() {
	mode = "attract";
	menu = null;
	bindGame(new Chronicle(0));
	game.s.mana = 400;
	game.s.gold = 350;
	game.s.known = SPELLS.map((s) => s.id);
	for (const t of game.s.tiles) t.seen = true;
	attractStart = performance.now();
	attractStage = -1;
	settingsReturn = settings.guide;
	settings.guide = false;
	syncGame();
}
function exitAttract() {
	settings.guide = settingsReturn ?? true;
	showTitle();
}
function updateAttract(now) {
	const stage = Math.floor((now - attractStart) / 4800);
	if (stage === attractStage) return;
	attractStage = stage;
	const s = game.s,
		a = game.army();
	if (stage === 0) {
		notify("A small kingdom with an unreasonable amount of hope.");
	}
	if (stage === 1) {
		tab = 2;
		game.setBuild(s.cities[0], "library");
		game.nextTurn();
		game.nextTurn();
		cursor = game.tile(-3, 2, 0);
		syncGame();
	}
	if (stage === 2) {
		tab = 3;
		openMenu("cast");
	}
	if (stage === 3) {
		closeMenu();
		game.cast("golem");
		tab = 1;
		syncGame();
	}
	if (stage === 4) {
		tab = 0;
		closeMenu();
		a.q = -1;
		a.r = 0;
		a.mp = 3;
		game.startBattle(game.tile(-1, 0, 0), ["wolf", "sprite"], {
			q: -2,
			r: 0,
			p: 0,
		});
		syncGame();
	}
	if (stage === 5) {
		game.cast("star");
		const u = game.battleUnit();
		game.battleAction(game.battle.tiles.find((t) => t.q === 0 && t.r === 0));
		game.endRound();
	}
	if (stage === 6 && game.battle) {
		for (const u of game.battle.units.filter((u) => u.team === 1))
			game.hurt(u, 99, "spell");
		game.battleCheck();
		syncGame();
	}
	if (stage === 7) {
		if (game.battle) game.finishBattle();
		a.q = 1;
		a.r = 0;
		game.interact(game.tile(1, 0, 0));
		cursor = game.tile(1, 0, 1);
		syncGame();
		notify("Beyond the Betweenway, another moon keeps watch.");
	}
	if (stage === 8) {
		tab = 4;
		openMenu("diplomacy");
		audio.say(55, true);
	}
	if (stage === 9) {
		closeMenu();
		game.diplomacy("gift");
		game.diplomacy("pact");
		tab = 3;
		game.s.seals = [0, 1, 2];
		game.cast("concord");
		openMenu("ending");
	}
	if (stage >= 11) {
		settings.guide = settingsReturn ?? true;
		startAttract();
	}
}
function updateBattleHealth() {
	let layer = document.getElementById("battle-health");
	if (!game.battle) {
		layer?.remove();
		return;
	}
	if (!layer) {
		layer = document.createElement("div");
		layer.id = "battle-health";
		layer.className = "battle-hp-layer";
		document.body.appendChild(layer);
	}
	layer.innerHTML = game.battle.units
		.filter((u) => u.hp > 0)
		.map((u) => {
			const v = view.pos(u);
			v.y += u.kind === "dragon" ? 1.65 : 1.35;
			v.project(view.camera);
			return `<span class="health-label" style="left:${(v.x * 0.5 + 0.5) * innerWidth}px;top:${(-v.y * 0.5 + 0.5) * innerHeight}px;transform:translate(-50%,-50%);border-color:${u.team ? "#d4a19a99" : "#bed8b299"}">${u.hp}/${u.max}${u.guard ? " ◆" : ""}${u.attacked ? " ·" : ""}</span>`;
		})
		.join("");
}
async function frame(now) {
	const dt = Math.min((now - lastFrame) / 1000, 0.1);
	lastFrame = now;
	pollPad(dt);
	const running =
		mode !== "title" && !stopped && (!AIHub.active || AIHub.time() >= 0);
	if (running) {
		worldSeconds += dt;
		if (mode === "attract") updateAttract(now);
		if (game.battle?.phase === "enemy" && !menu && now - lastAI > 650) {
			lastAI = now;
			game.aiStep();
		}
	}
	if (!stopped) audio.tick(!!game.battle);
	if (mode === "title" && !menu && now - lastInput >= 10000 && !AIHub.active)
		startAttract();
	if (toastUntil && now > toastUntil) {
		$("toast").classList.remove("visible");
		toastUntil = 0;
	}
	if (view) {
		await view.render(dt, cursor);
		updateBattleHealth();
	}
	requestAnimationFrame(frame);
}
AIHub.probe(() => ({
	scene:
		stopped || game?.s.over
			? "over"
			: AIHub.active && AIHub.time() < 0
				? "ready"
				: mode === "title"
					? "title"
					: "play",
	menu: menu === "settings",
	world: worldSeconds,
	input: controls,
}));
window.__magic = {
	get game() {
		return game;
	},
	get view() {
		return view;
	},
	get mode() {
		return mode;
	},
	get menu() {
		return menu;
	},
	action,
	startGame,
	syncGame,
	openMenu,
	closeMenu,
	startAttract,
	exitAttract,
	confirm,
	get cursor() {
		return cursor;
	},
	setCursor(q, r, p = game.s.plane) {
		cursor = game.battle
			? game.battle.tiles.find((t) => t.q === q && t.r === r)
			: game.tile(q, r, p);
		view.updateRings(cursor);
		renderUI();
	},
};
async function boot() {
	try {
		if (!navigator.gpu)
			throw new Error(
				"WebGPU is unavailable. Use a WebGPU-enabled browser on a supported device, then reopen this file.",
			);
		const infoPromise = AIHub.active
			? AIHub.connect({ mode: "parallel", seats: [1, 4] })
			: Promise.resolve(null);
		$("load-text").textContent =
			"Carving the isles. Teaching the stones to remember…";
		await RAPIER.init();
		view = new AtlasView($("world"), RAPIER);
		await view.init();
		hubInfo = await infoPromise;
		if (hubInfo) {
			startGame(0, 1);
			AIHub.on("start", () => {
				audio.unlock();
				renderUI();
			});
			AIHub.on("time-up", () => {
				if (!game.s.over) {
					game.s.over = "time";
					game.commit("The Conclave closes. Your chronicle stands.");
				}
				finishHub();
			});
			AIHub.on("end", () => {
				stopped = true;
				audio.quiet();
				if (!game.s.over) game.s.over = "time";
				openMenu("ending");
			});
			if (hubInfo.splash) {
				hubReady = true;
				AIHub.ready();
			}
			AIHub.progress({ score: game.score(), label: "A kingdom awakens" });
		} else showTitle();
		await view.render(0.016, cursor);
		await view.renderer.backend.device.queue.onSubmittedWorkDone();
		$("loading").classList.add("hidden");
		setTimeout(() => $("loading").remove(), 600);
		requestAnimationFrame(frame);
		setInterval(() => {
			if (view && !stopped) pollPad(0);
		}, 16);
		if (matchMedia("(pointer:coarse)").matches) {
			const el = document.createElement("div");
			el.className = "touch-note";
			el.innerHTML =
				'Controller or keyboard required <button data-act="settings">Settings</button>';
			document.body.appendChild(el);
		}
	} catch (error) {
		console.error(error);
		AIHub.fail(error.message);
		$("loading").style.zIndex = "15";
		$("loading").innerHTML =
			`<div class="error-card"><div class="loading-mark">✧</div><h2>A little more WebGPU is required.</h2><p></p><p>This game uses WebGPU exclusively. A controller or keyboard is required to play.</p><button class="secondary" data-act="settings">Settings</button></div>`;
		$("loading").querySelector("p").textContent = error.message;
		bindGame(new Chronicle());
	}
}
boot();
</script>
