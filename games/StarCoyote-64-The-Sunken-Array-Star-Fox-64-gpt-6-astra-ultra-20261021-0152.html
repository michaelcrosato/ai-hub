      break;
    }
    case "reset":
      break;
    case "sfx":
      if (!silent) audio.sfx(e.name, e.pan || 0);
      break;
    case "phase":
      world.setTheme(e.phase);
      ui.toast(e.name, e.objective, 4);
      break;
    case "radio":
      if (settings.subtitles !== false)
        ui.radio(e.name, e.text, e.name.toLowerCase());
      if (!silent) audio.radio();
      break;
    case "toast":
      ui.toast(e.text, e.sub || "", 3);
      break;
    case "tutorial":
      ui.toast(
        `${e.step.toString().padStart(2, "0")} / ${e.total}  ${e.title}`,
        e.text,
        15
      );
      break;
    case "damage":
      effects.shake = 0.7;
      effects.flash = 0.23;
      input.rumble(0.7, 180);
      audio.sfx("damage");
      break;
    case "hit":
      effects.burst(e.entity.x, e.entity.y, e.entity.z, 1, 12910579);
      break;
    case "explosion":
      effects.burst(e.x, e.y, e.z, e.size, e.color);
      effects.debrisBurst(sim.world, e.x, e.y, e.z);
      if (!silent) audio.sfx("explosion", e.x / 40);
      break;
    case "ring":
      effects.ring(e.x, e.y, e.z, 16765580, 15, 0.55);
      if (!silent) audio.sfx("ring");
      break;
    case "reflect":
      effects.burst(e.x, e.y, e.z, 3, 8388593);
      if (!silent) audio.sfx("roll");
      break;
    case "nova":
      effects.nova(e.x, e.y, e.z);
      input.rumble(0.9, 400);
      if (!silent) audio.sfx("bomb");
      break;
    case "support":
      supportVisual = 3;
      effects.ring(0, 0, -70, 7143401, 60, 0.8);
      if (!silent) audio.sfx("support");
      break;
    case "warning":
      if (!silent) audio.sfx("warning");
      break;
    case "lance": {
      effects.burst(e.x, 0, -20, 4, 16728681);
      for (let i = 0; i < 70; i++)
        effects.particle(
          e.x + (Math.random() - 0.5) * 8,
          (Math.random() - 0.5) * 55,
          -220 + Math.random() * 270,
          0,
          0,
          40,
          16732537,
          0.6,
          0.6
        );
      break;
    }
    case "bossStart":
      bossMesh = bossReusable || (bossReusable = createBoss());
      bossMesh.visible = true;
      scene.add(bossMesh);
      break;
    case "bossStage":
      effects.burst(sim.boss.x, sim.boss.y, sim.boss.z, 17, 16752746);
      break;
    case "failed":
      state = "failure";
      player.visible = false;
      effects.burst(sim.p.x, sim.p.y, 0, 12);
      audio.sfx("explosion");
      ui.show("failure", { checkpoint: !!sim.checkpoint, score: sim.score });
      break;
    case "victory":
      victoryTime = 1e-3;
      if (bossMesh) {
        effects.nova(sim.boss.x, sim.boss.y, sim.boss.z);
        bossMesh.visible = false;
      }
      if (!silent) audio.sfx("victory");
      ui.toast(
        sim.practice ? "FLIGHT SCHOOL COMPLETE" : "ARRAY SILENCED",
        sim.practice ? "You are cleared for combat." : "The sun is ours again. Bring everyone home.",
        5
      );
      break;
  }
}
function debrief() {
  if (state === "attract") {
    start(false, true);
    return;
  }
  best = Math.max(best, Math.round(sim.score));
  save();
  state = "debrief";
  ui.show("debrief", { ...sim.stats(), best });
}
function project(x, y, z) {
  projected.set(x, y, z).project(camera);
  return {
    x: (projected.x * 0.5 + 0.5) * innerWidth,
    y: (-0.5 * projected.y + 0.5) * innerHeight,
    visible: projected.z > -1 && projected.z < 1 && Math.abs(projected.x) < 1.15 && Math.abs(projected.y) < 1.15
  };
}
function updateScene(dt) {
  const active = state === "game" || state === "attract";
  const titleView = state === "title";
  if (!ready) return;
  const p = sim.p;
  if (titleView) {
    world.update(dt, clock, 8, "canyon", clock * 8);
    player.position.set(12, Math.sin(clock * 0.55) * 0.7, -3);
    player.rotation.set(
      0.05 + Math.sin(clock * 0.3) * 0.02,
      -0.48,
      -0.13 + Math.sin(clock * 0.4) * 0.035
    );
    camera.position.lerp(new THREE3.Vector3(0, 8, 36), Math.min(1, dt * 2));
    look.set(-2, 0, -45);
    camera.lookAt(look);
    camera.fov = 58;
    camera.updateProjectionMatrix();
  } else if (p) {
    const advance = active ? dt : 0;
    world.update(advance, sim.time, sim.speed, sim.phase, sim.travel);
    player.position.set(p.x, p.y, 0);
    let roll = -p.vx * 0.018;
    if (p.roll > 0) roll += p.rollDirection * (1 - p.roll / 0.72) * Math.PI * 2;
    player.rotation.set(-p.vy * 0.012, -p.vx * 6e-3, roll);
    player.visible = state !== "failure" && (p.invuln <= 0 || Math.floor(clock * 18) % 2 === 0 || sim.attract);
    for (const glow of player.userData.engines || [])
      glow.scale.z = (p.boost ? 2.4 : 1) * (1 + Math.sin(clock * 46) * 0.12);
    const shake = settings.shake ? effects.shake : 0;
    camera.position.lerp(
      new THREE3.Vector3(
        p.x * 0.48 + (Math.random() - 0.5) * shake,
        p.y * 0.35 + 9 + (Math.random() - 0.5) * shake,
        p.boost ? 33 : p.brake ? 26 : 29
      ),
      Math.min(1, dt * 5)
    );
    look.set(p.x * 0.65, p.y * 0.45 + 1, -100);
    camera.lookAt(look);
    camera.fov = lerp(camera.fov, p.boost ? 72 : 62, Math.min(1, dt * 3));
    camera.updateProjectionMatrix();
    for (const e of sim.entities.values()) {
      const m = meshes.get(e.id);
      if (!m) continue;
      m.position.set(e.x, e.y, e.z);
      if (e.kind === "enemy") {
        m.rotation.z = Math.sin(e.age * 1.2 + e.phase) * 0.5;
        m.rotation.x = Math.cos(e.age * 0.9 + e.phase) * 0.15;
      }
      if (e.kind === "gate") m.rotation.z += advance * 0.18;
      if (e.kind === "pickup" || e.kind === "obstacle") {
        m.rotation.y += advance * 0.55;
        m.rotation.z += advance * 0.3;
      }
      if (e.kind === "bossPart") m.rotation.z += advance * 0.6;
      if (["shot", "missile", "enemyShot"].includes(e.kind)) {
        const dir = new THREE3.Vector3(e.vx, e.vy, e.vz).normalize();
        m.quaternion.setFromUnitVectors(zAxis, dir);
      }
    }
    if (bossMesh && sim.boss) {
      bossMesh.position.set(sim.boss.x, sim.boss.y, sim.boss.z);
      bossMesh.rotation.z = Math.sin(clock * 0.65) * 0.04;
      for (const r of bossMesh.userData.rotors || [])
        r.rotation.z += advance * (sim.bossStage === 3 ? 1.5 : 0.35);
      bossMesh.userData.core.scale.setScalar(sim.bossStage >= 2 ? 1.6 : 1);
      for (let i = 0; i < (bossMesh.userData.pylons || []).length; i++) {
        const pod = bossMesh.userData.pylons[i];
        pod.visible = sim.bossStage === 1 && sim.bossParts.some(
          (id) => Math.sign(sim.entities.get(id)?.offsetX) === (i === 0 ? -1 : 1)
        );
      }
    }
    for (let i = 0; i < wingmeshes.length; i++) {
      const w = wingmeshes[i], hp = sim.wingmen[i].health;
      w.visible = hp > 0 && state !== "failure";
      const side = i === 0 ? -1 : 1;
      const baseX = i === 2 ? 4 : side * 18;
      const attack = supportVisual > 0;
      w.position.set(
        p.x * 0.5 + baseX + Math.sin(clock + i) * 2,
        p.y * 0.25 + 3 + i * 3,
        attack ? -35 - (3 - supportVisual) * 42 : -18 - i * 12
      );
      w.rotation.z = attack ? Math.sin(clock * 4 + i) * 0.4 : side * 0.12;
    }
    supportVisual = Math.max(0, supportVisual - advance);
    if (active) {
      ui.updateHUD(sim.hud());
      const aim = project(sim.aim?.x || 0, sim.aim?.y || 0, -110);
      ui.setReticle({
        ...aim,
        locked: p.lockProgress >= 1,
        progress: p.lockProgress,
        visible: sim.mode === "playing"
      });
      const target = sim.entities.get(p.lockId || sim.targetId);
      if (target) {
        const t = project(target.x, target.y, target.z);
        ui.setTarget({
          ...t,
          health: target.health / target.maxHealth,
          name: target.distress != null ? "SAVE " + sim.wingmen[target.distress].name : target.kind === "bossPart" ? target.subtype === "pylon" ? "SHIELD PYLON" : "REACTOR CORE" : "INTERCEPTOR"
        });
      } else ui.setTarget({ visible: false });
    }
  }
  effects.update(
    active || state === "failure" ? dt : 0,
    sim?.speed || 0,
    p,
    active
  );
  if (splash) {
    splash.style.opacity = effects.flash * 0.55;
    splash.style.background = state === "failure" ? "#ff6050" : "#abfff2";
  }
}
async function boot() {
  try {
    if (!navigator.gpu)
      throw new Error(
        "WebGPU is required. Open this file through HTTPS or localhost in a browser with WebGPU enabled."
      );
    renderer = new THREE3.WebGPURenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });
    renderer._getFallback = null;
    await renderer.init();
    if (!renderer.backend.isWebGPUBackend)
      throw new Error("A WebGPU device could not be created.");
    renderer.domElement.id = "game-canvas";
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE3.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE3.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);
    renderer.onDeviceLost = (info) => {
      bootError = info.message || "The WebGPU device was lost. Reload the page to reconnect.";
      state = "error";
      ready = false;
      ui.show("error", { message: bootError });
    };
    ui.setLoading("Warming up the engines");
    await RAPIER.init();
    scene = new THREE3.Scene();
    camera = new THREE3.PerspectiveCamera(
      62,
      innerWidth / innerHeight,
      0.2,
      2600
    );
    camera.position.set(0, 8, 36);
    world = new WorldArt(scene);
    effects = new Effects(scene);
    player = createFighter();
    scene.add(player);
    for (let i = 0; i < 3; i++) {
      const w = createFighter("wingman");
      w.visible = false;
      wingmeshes.push(w);
      scene.add(w);
    }
    sim = new FlightSimulation(event);
    splash = document.createElement("div");
    splash.className = "screen-flash";
    splash.style.cssText = "position:fixed;inset:0;background:#cffff0;opacity:0;pointer-events:none;z-index:15";
    document.body.append(splash);
    ready = true;
    audio.setVolume(settings.volume);
    audio.setMusic(settings.music);
    ui.setReady();
    title();
    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  } catch (err) {
    console.error(err);
    bootError = err.message || String(err);
    state = "error";
    ui.show("error", { message: bootError });
  }
  requestAnimationFrame(frame);
}
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1e3));
  lastFrame = now;
  clock += dt;
  const controls = input.update(dt);
  ui.setInputMode(input.usingGamepad);
  if (input.usingGamepad && controls.any) audio.unlock();
  if (state === "attract" && controls.any) {
    title();
  } else if (state === "game" && controls.pause) {
    pause();
  } else if (state === "pause" && controls.pause && ui.screen === "pause") {
    resume();
  } else if (!["game", "attract"].includes(state)) {
    ui.updateMenu(controls, dt);
  }
  if (ready && state === "title" && ui.screen === "title" && now - lastInput >= 1e4)
    start(false, true);
  const active = state === "game" || state === "attract";
  if (ready && active) {
    for (const key of Object.keys(pendingActions))
      pendingActions[key] ||= controls[key];
    accumulator += dt * (state === "attract" ? 1.65 : 1);
    let first = true;
    while (accumulator >= 1 / 60) {
      sim.update(
        1 / 60,
        first ? { ...controls, ...pendingActions } : {
          ...controls,
          rollLeft: false,
          rollRight: false,
          bomb: false,
          support: false
        }
      );
      for (const key of Object.keys(pendingActions))
        pendingActions[key] = false;
      first = false;
      accumulator -= 1 / 60;
    }
    if (victoryTime > 0) {
      victoryTime += dt;
      if (victoryTime > 5.5) {
        victoryTime = 0;
        debrief();
      }
    }
  }
  updateScene(dt);
  ui.update(dt);
  if (ready) {
    audio.update(dt, {
      speed: active ? sim.speed : 8,
      combat: active,
      boss: !!sim.boss && active,
      health: sim.p?.health ?? 100
    });
    try {
      renderer.render(scene, camera);
    } catch (err) {
      bootError = err.message;
      ready = false;
      state = "error";
      ui.show("error", { message: bootError });
      console.error(err);
    }
  }
  requestAnimationFrame(frame);
}
boot();

</script>
