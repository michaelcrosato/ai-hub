<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="source-initial-date" content="2026-10-13" />
    <meta name="source-game" content="Assassin's Creed (2007) for Xbox 360, PS3 and PC" />
    <meta name="source-engine" content="Pixel Engine 0.29.0 (build 2026-10-12 2855472)" />
    <link rel="icon" href="data:," />
    <title>Ochre Veil</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a140c; }
      #app { position: fixed; inset: 0; }
      #fs {
        position: fixed; top: 8px; right: 8px; z-index: 30;
        font: 600 14px/1.2 sans-serif; padding: 8px 12px;
        color: #f0d8a8; background: #1a140ce6; border: 1px solid #f0d8a8; border-radius: 4px;
      }
      #file-help {
        position: fixed; inset: 0; z-index: 40; display: none;
        align-items: center; justify-content: center; padding: 24px;
        background: #1a140c; color: #f0d8a8; font: 16px/1.45 sans-serif;
      }
      #file-help.show { display: flex; }
      #file-help code { color: #fff; }
    </style>
    <!--
      Source information
      Initial Date: 2026-10-13
      SOURCE: Assassin's Creed (2007) for Xbox 360, PS3 and PC
      GAME ENGINE: Pixel Engine 0.29.0 (build 2026-10-12 2855472)
      Environment: Linux (WSL2) CLI. Chrome or Chromium, WebGL. Couch play with a PS5-compatible gamepad is the primary target; mouse, keyboard, and touch are the same actions.
      Model and Effort Level: Grok 4.7. Effort level: not confirmed.
    -->
  </head>
  <body>
    <div id="file-help">
      <p>Ochre Veil needs a local server. Modules do not start from a file link.<br />
      In this folder run <code>python3 -m http.server</code> and open the http address it prints.</p>
    </div>
    <div id="app"></div>
    <button id="fs" type="button">Fullscreen</button>
    <script>
      if (location.protocol === 'file:') document.getElementById('file-help').classList.add('show');
      document.getElementById('fs').addEventListener('click', () => {
        const button = document.getElementById('fs');
        const op = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
        Promise.resolve(op).catch((err) => { window.__FULLSCREEN_ERROR__ = String(err && err.message ? err.message : err); });
        button.blur();
      });
    </script>
    <script type="module" src="./game.js"></script>
  </body>
</html>
