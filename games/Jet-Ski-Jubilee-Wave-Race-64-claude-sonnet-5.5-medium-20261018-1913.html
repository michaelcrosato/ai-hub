<script type="module">
import * as THREE from 'three/webgpu';
import { positionLocal, normalLocal, float } from 'three/tsl';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import RAPIER from '@dimforge/rapier3d-compat';

/* ------------------------------------------------------------------ *
 *  CORE: math helpers, save data, constants
 * ------------------------------------------------------------------ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const dampAng = (a, b, lambda, dt) => a + wrapAng(b - a) * (1 - Math.exp(-lambda * dt));
function mulberry(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  return lerp(lerp(hash2(xi, zi), hash2(xi + 1, zi), u), lerp(hash2(xi, zi + 1), hash2(xi + 1, zi + 1), u), v);
}
const fmtTime = (t) => {
  if (t == null || !isFinite(t)) return '--:--.---';
  const m = Math.floor(t / 60), s = Math.floor(t % 60), ms = Math.floor((t * 1000) % 1000);
  return `${m}:${String(s).padStart(2, '0')}.${String(ms).padStart(3, '0')}`;
};
const ordinal = (n) => ['', '1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th'][n] || n + 'th';
const $ = (sel, root = document) => root.querySelector(sel);

const GAME_TITLE = 'Jet Ski Jubilee';
const SETTINGS_DEFAULT = {
  master: 0.8, music: 0.6, sfx: 0.9, shake: 1, camDist: 1, invertLean: false,
  steerSens: 1, deadzone: 0.12, rumble: true, units: 'kmh', hud: true, cheers: true,
};

const Save = {
  key: 'jetski-jubilee-v1',
  data: { settings: { ...SETTINGS_DEFAULT }, best: {}, ghost: {}, stunt: {}, champ: {}, seenHelp: false, rider: 0 },
  load() {
    try {
      const raw = localStorage.getItem(this.key);
      if (raw) {
        const d = JSON.parse(raw);
        this.data = { ...this.data, ...d, settings: { ...SETTINGS_DEFAULT, ...(d.settings || {}) } };
      }
    } catch (e) { /* storage unavailable: run with defaults */ }
  },
  commit() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
  get s() { return this.data.settings; },
};
Save.load();

/* Debug / test hook (read-only status used by the automated boot checks) */
const JSJ = { ready: false, mode: 'boot', errors: [], frame: 0, version: '1.0.0' };
window.JSJ = JSJ;
window.addEventListener('error', (e) => JSJ.errors.push(String(e.message || e)));
window.addEventListener('unhandledrejection', (e) => JSJ.errors.push(String(e.reason && e.reason.message || e.reason)));

/* ------------------------------------------------------------------ *
 *  INPUT: Gamepad API (PS5 DualSense standard mapping) first,
 *  keyboard + mouse map onto the same logical actions.
 * ------------------------------------------------------------------ */

const Input = {
  keys: {}, held: {}, prev: {}, repeatAt: {}, pad: null, usingPad: false,
  steer: 0, lean: 0, rx: 0, ry: 0, throttle: 0, brake: 0,
  idle: 0, activity: false, lastPadId: '', mouseMoved: false, mouseX: 0, mouseY: 0, mouseClick: false,
  init() {
    const act = () => { this.activity = true; };
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
      this.keys[e.code] = true; this.usingPad = false; act();
    });
    window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { this.keys = {}; });
    window.addEventListener('mousemove', (e) => {
      if (Math.abs(e.movementX) + Math.abs(e.movementY) > 0) { this.mouseMoved = true; act(); }

  },
  getPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of pads) if (p && p.connected) return p;
    return null;
  },
  /** Called once per rendered frame. */
  poll(dt) {
    const k = this.keys, dz = Save.s.deadzone;
    const cur = {};
    for (const a of ACTIONS) cur[a] = false;
    let steer = 0, lean = 0, rx = 0, ry = 0, thr = 0, brk = 0;
    const pad = this.getPad();
    this.pad = pad;
    let padActive = false;
    if (pad) {
      const b = (i) => (pad.buttons[i] ? pad.buttons[i].pressed : false);
      const bv = (i) => (pad.buttons[i] ? pad.buttons[i].value : 0);
      const ax = (i) => { const v = pad.axes[i] || 0; return Math.abs(v) < dz ? 0 : (v - Math.sign(v) * dz) / (1 - dz); };
      const lx = ax(0), ly = ax(1);
      steer = lx; lean = -ly; rx = ax(2); ry = ax(3);
      thr = bv(7); brk = bv(6);
      cur.up = b(12) || ly < -0.6; cur.down = b(13) || ly > 0.6;
      cur.left = b(14) || lx < -0.6; cur.right = b(15) || lx > 0.6;
      cur.confirm = b(0); cur.back = b(1); cur.pause = b(9) || b(8);
      cur.boost = b(0); cur.drift = b(4) || b(5); cur.spin = b(2); cur.flip = b(3); cur.roll = b(1);
      cur.cam = b(11); cur.look = b(10); cur.reset = b(1);
      cur.tabL = b(4); cur.tabR = b(5); cur.alt = b(2) || b(3);
      for (let i = 0; i < pad.buttons.length; i++) if (pad.buttons[i].pressed && i !== 16) padActive = true;
      if (Math.abs(lx) + Math.abs(ly) + Math.abs(rx) + Math.abs(ry) > 0.4) padActive = true;
      if (padActive) { this.usingPad = true; this.activity = true; }
    }
    const kd = (...c) => c.some((x) => k[x]);
    const ks = (kd('KeyD', 'ArrowRight') ? 1 : 0) - (kd('KeyA', 'ArrowLeft') ? 1 : 0);
    if (ks) steer = ks;
    const kl = (kd('ArrowUp') ? 1 : 0) - (kd('ArrowDown') ? 1 : 0);
    if (kl) lean = kl;
    if (kd('KeyW')) thr = 1;
    if (kd('KeyS')) brk = 1;
    cur.up = cur.up || kd('ArrowUp', 'KeyW'); cur.down = cur.down || kd('ArrowDown', 'KeyS');
    cur.left = cur.left || kd('ArrowLeft', 'KeyA'); cur.right = cur.right || kd('ArrowRight', 'KeyD');
    cur.confirm = cur.confirm || kd('Enter', 'Space', 'NumpadEnter');
    cur.back = cur.back || kd('Escape', 'Backspace');
    cur.pause = cur.pause || kd('Escape', 'KeyP');
    cur.boost = cur.boost || kd('Space');
    cur.drift = cur.drift || kd('ShiftLeft', 'ShiftRight');
    cur.spin = cur.spin || kd('KeyJ'); cur.flip = cur.flip || kd('KeyK'); cur.roll = cur.roll || kd('KeyL');
    cur.cam = cur.cam || kd('KeyC'); cur.look = cur.look || kd('KeyB');
    cur.reset = cur.reset || kd('KeyR');
    cur.tabL = cur.tabL || kd('KeyQ'); cur.tabR = cur.tabR || kd('KeyE');
    cur.alt = cur.alt || kd('Tab', 'KeyX');

    this.pressedNow = {};
    this.navNow = {};
    const now = performance.now() / 1000;
    for (const a of ACTIONS) {
      const was = this.held[a];
      this.pressedNow[a] = cur[a] && !was;
      // key-repeat for menu navigation
      let rep = this.pressedNow[a];
      if (cur[a] && was) {
        if (now >= (this.repeatAt[a] || 0)) { rep = true; this.repeatAt[a] = now + 0.11; }
      }
      if (this.pressedNow[a]) this.repeatAt[a] = now + 0.38;
      this.navNow[a] = rep;
      this.held[a] = cur[a];
    }
    this.steer = clamp(steer, -1, 1);
    this.lean = clamp(Save.s.invertLean ? -lean : lean, -1, 1);
    this.rx = rx; this.ry = ry; this.throttle = thr; this.brake = brk;
    const any = this.activity || Object.values(this.pressedNow).some(Boolean);
    this.idle = any ? 0 : this.idle + dt;
    this.anyThisFrame = any;
    this.activity = false;
    this.mouseClick = false;
    this.mouseMovedFrame = this.mouseMoved; this.mouseMoved = false;
  },
  pressed(a) { return !!this.pressedNow[a]; },
  nav(a) { return !!this.navNow[a]; },
  down(a) { return !!this.held[a]; },
  rumble(strong, weak, ms) {
    if (!Save.s.rumble || !this.pad || !this.usingPad) return;
    try {
      const act = this.pad.vibrationActuator;
      if (act && act.playEffect) act.playEffect('dual-rumble', { startDelay: 0, duration: ms, weakMagnitude: weak, strongMagnitude: strong });
    } catch (e) { /* haptics unsupported */ }
  },
  /** Label for a logical action, adapted to the active device. */
  label(a) {
    const P = { confirm: '✕', back: '○', boost: '✕', spin: '□', flip: '△', roll: '○', pause: 'OPTIONS', drift: 'L1 / R1', cam: 'R3', throttle: 'R2', brake: 'L2', steer: 'L-STICK', reset: '○ (hold)', alt: '□', tabL: 'L1', tabR: 'R1' };
    const K = { confirm: 'Enter', back: 'Esc', boost: 'Space', spin: 'J', flip: 'K', roll: 'L', pause: 'Esc', drift: 'Shift', cam: 'C', throttle: 'W', brake: 'S', steer: 'A / D', reset: 'R', alt: 'X', tabL: 'Q', tabR: 'E' };
    return (this.usingPad ? P : K)[a] || a;
  },

Input.init();

/* ------------------------------------------------------------------ *
 *  AUDIO: everything is synthesised with the Web Audio API.
 *  Engine voices, water rush, SFX one-shots and a generative surf-pop
 *  score that changes per course.
 * ------------------------------------------------------------------ */
const Audio = {
  ctx: null, master: null, musicBus: null, sfxBus: null, noiseBuf: null, ok: false,
  voices: [], water: null, listenerReady: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }

      const C = window.AudioContext || window['webkitAudioContext'];
      this.ctx = new C();

    const comp = c.createDynamicsCompressor(); comp.connect(this.master);
    this.musicBus = c.createGain(); this.musicBus.connect(comp);
    this.sfxBus = c.createGain(); this.sfxBus.connect(comp);

    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    this.applyVolumes();
    // wind / water rush bed
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = 0.5;
    const g = c.createGain(); g.gain.value = 0;
    src.connect(bp); bp.connect(g); g.connect(this.sfxBus); src.start();
    this.water = { g, bp };
    this.ok = true;
  },
  applyVolumes() {
    if (!this.ctx) return;
    const s = Save.s;
    this.master.gain.value = s.master;
    this.musicBus.gain.value = s.music * 0.55;
    this.sfxBus.gain.value = s.sfx;
  },
  /** Create an engine voice (one per craft). */
  makeEngine(isPlayer) {
    if (!this.ok) return null;
    const c = this.ctx;
    const o1 = c.createOscillator(); o1.type = 'sawtooth';
    const o2 = c.createOscillator(); o2.type = 'square';
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500; lp.Q.value = 2;
    const g = c.createGain(); g.gain.value = 0;
    const pan = c.createStereoPanner();
    o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(pan); pan.connect(this.sfxBus);
    o1.start(); o2.start();
    const v = { o1, o2, lp, g, pan, isPlayer };
    this.voices.push(v);
    return v;
  },
  updateEngine(v, speedN, throttle, vol, pan, boosting, airborne) {
    if (!v || !this.ok) return;
    const t = this.ctx.currentTime;
    const f = 48 + speedN * 70 + throttle * 26 + (boosting ? 30 : 0) + (airborne ? 40 : 0);
    v.o1.frequency.setTargetAtTime(f, t, 0.05);
    v.o2.frequency.setTargetAtTime(f * 0.5 * 1.01, t, 0.05);
    v.lp.frequency.setTargetAtTime(380 + speedN * 900 + throttle * 700, t, 0.08);
    v.g.gain.setTargetAtTime(vol * (v.isPlayer ? 0.16 : 0.1) * (0.5 + throttle * 0.5), t, 0.08);
    v.pan.pan.setTargetAtTime(clamp(pan, -1, 1), t, 0.05);
  },
  killEngine(v) {
    if (!v) return;
    try { v.g.gain.value = 0; v.o1.stop(); v.o2.stop(); v.o1.disconnect(); v.o2.disconnect(); v.g.disconnect(); } catch (e) { /* already stopped */ }
    this.voices = this.voices.filter((x) => x !== v);
  },
  updateWater(speedN, airborne) {
    if (!this.ok) return;
    const t = this.ctx.currentTime;
    this.water.g.gain.setTargetAtTime(airborne ? 0.02 : 0.03 + speedN * 0.16, t, 0.1);
    this.water.bp.frequency.setTargetAtTime(400 + speedN * 1400, t, 0.1);
  },
  silenceBeds() {
    if (!this.ok) return;
    this.water.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
    for (const v of this.voices) v.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, when = 0, slide = 0, bus) {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  },
  noise(dur, fHi, fLo, vol = 0.3, when = 0, type = 'bandpass') {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime + when;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.Q.value = 0.8;
    f.frequency.setValueAtTime(fHi, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, fLo), t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfxBus); s.start(t); s.stop(t + dur + 0.05);
  },
  sfx(name, p = 1) {
    if (!this.ok) return;
    switch (name) {
      case 'move': this.tone(520, 0.06, 'triangle', 0.18); break;
      case 'confirm': this.tone(660, 0.08, 'square', 0.14); this.tone(990, 0.12, 'square', 0.14, 0.07); break;
      case 'back': this.tone(440, 0.09, 'triangle', 0.2, 0, -160); break;
      case 'tick': this.tone(880, 0.05, 'sine', 0.2); break;
      case 'count': this.tone(520, 0.22, 'square', 0.2); break;

    while (this.next < c.currentTime + 0.18) {

      const sw = (this.step % 2 === 0 ? th.sw : -th.sw) * spb;

  },
};

const Waves = {
  t: 0, list: [], amp: 1, surge: 1,
  setup(wdef, seed) {
    const rnd = mulberry(seed);
    const lens = [52, 34, 22, 14.5, 9.6, 6.4, 4.1];
    const frac = [0.5, 0.34, 0.23, 0.14, 0.085, 0.05, 0.03];
    this.list = lens.map((L, i) => {
      const k = TAU / (L * (wdef.len || 1));
      const ang = (wdef.dir || 0) + (rnd() - 0.5) * (wdef.spread || 1.2) * (1 + i * 0.25);
      return { dx: Math.cos(ang), dz: Math.sin(ang), k, w: Math.sqrt(9.8 * k) * (wdef.speed || 1), a: wdef.amp * frac[i] * (1 + (wdef.chop || 0) * i * 0.12), ph: rnd() * TAU };
    });
    this.amp = wdef.amp;
    this.t = 0;
  },
  update(dt) {
    this.t += dt;
    const t = this.t;
    this.surge = 1 + 0.28 * Math.sin(t * 0.13) + 0.2 * Math.sin(t * 0.29 + 1.3);
  },
  h(x, z) {
    let h = 0;
    const t = this.t, L = this.list;
    for (let i = 0; i < L.length; i++) {
      const w = L[i];
      const s = Math.sin(w.k * (w.dx * x + w.dz * z) - w.w * t + w.ph);
      const e = 0.5 + 0.5 * s;
      h += w.a * (2 * e * e - 0.75);
    }
    return h * this.surge;
  },
  /** height + gradient written into out[0..2] = h, dh/dx, dh/dz */
  hg(x, z, out) {
    let h = 0, gx = 0, gz = 0;
    const t = this.t, L = this.list;
    for (let i = 0; i < L.length; i++) {
      const w = L[i];
      const th = w.k * (w.dx * x + w.dz * z) - w.w * t + w.ph;
      const s = Math.sin(th), c = Math.cos(th);
      const e = 0.5 + 0.5 * s;
      h += w.a * (2 * e * e - 0.75);
      const d = w.a * 2 * e * c * w.k;
      gx += d * w.dx; gz += d * w.dz;
    }
    out[0] = h * this.surge; out[1] = gx * this.surge; out[2] = gz * this.surge;
  },
};

/* ------------------------------ Track ------------------------------ */
class Track {
  constructor(def) {
    this.def = def;
    const N = 36, pts = [];
    for (let i = 0; i < N; i++) {
      const th = (i / N) * TAU;
      let r = 1;
      for (const [n, a, p] of def.harm) r += a * Math.sin(n * th + p);
      r *= def.R;
      pts.push([r * Math.cos(th), r * Math.sin(th)]);
    }
    const dense = [];
    for (let i = 0; i < N; i++) {
      const p0 = pts[(i - 1 + N) % N], p1 = pts[i], p2 = pts[(i + 1) % N], p3 = pts[(i + 2) % N];
      for (let j = 0; j < 24; j++) {
        const t = j / 24, t2 = t * t, t3 = t2 * t;
        const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
        dense.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
      }
    }
    const D = dense.length, cum = [0];
    for (let i = 1; i <= D; i++) {
      const a = dense[i - 1], b = dense[i % D];
      cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1]));
    }
    const L = cum[D];
    const M = Math.round(L / 3);
    this.L = L; this.M = M; this.ds = L / M;
    this.px = new Float32Array(M); this.pz = new Float32Array(M);
    this.tx = new Float32Array(M); this.tz = new Float32Array(M);
    this.nx = new Float32Array(M); this.nz = new Float32Array(M);
    let k = 0;
    for (let i = 0; i < M; i++) {
      const s = i * this.ds;
      while (cum[k + 1] < s) k++;
      const f = (s - cum[k]) / (cum[k + 1] - cum[k]);
      const a = dense[k], b = dense[(k + 1) % D];
      this.px[i] = lerp(a[0], b[0], f); this.pz[i] = lerp(a[1], b[1], f);
    }
    for (let i = 0; i < M; i++) {
      const a = (i - 1 + M) % M, b = (i + 1) % M;
      let dx = this.px[b] - this.px[a], dz = this.pz[b] - this.pz[a];
      const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;
      this.tx[i] = dx; this.tz[i] = dz; this.nx[i] = -dz; this.nz[i] = dx;
    }
    this.hw = def.width / 2;
    this._tmp = { i: 0, s: 0, lat: 0 };
    // curvature (for AI braking and minimap)
    this.curv = new Float32Array(M);
    for (let i = 0; i < M; i++) {
      const a = (i - 4 + M) % M, b = (i + 4) % M;
      const a1 = Math.atan2(this.tx[a], this.tz[a]), a2 = Math.atan2(this.tx[b], this.tz[b]);
      this.curv[i] = wrapAng(a2 - a1) / (8 * this.ds);

    this.buildFeatures();
  }

  at(s, out) {
    s = ((s % this.L) + this.L) % this.L;
    const f = s / this.ds, i = Math.floor(f) % this.M, j = (i + 1) % this.M, u = f - Math.floor(f);
    out.x = lerp(this.px[i], this.px[j], u); out.z = lerp(this.pz[i], this.pz[j], u);
    let tx = lerp(this.tx[i], this.tx[j], u), tz = lerp(this.tz[i], this.tz[j], u);
    const l = Math.hypot(tx, tz) || 1; tx /= l; tz /= l;
    out.tx = tx; out.tz = tz; out.nx = -tz; out.nz = tx; out.i = i;
    return out;
  }

  /** nearest centreline sample; writes {i,s,lat}. hint<0 => global search. */
  project(x, z, hint, out) {
    out = out || this._tmp;
    const M = this.M;
    let best = 1e18, bi = 0;
    if (hint == null || hint < 0) {

        const dx = x - this.px[i], dz = z - this.pz[i], d = dx * dx + dz * dz;
        if (d < best) { best = d; bi = i; }
      }
    } else {
      for (let k = -24; k <= 24; k++) {
        const i = (hint + k + M) % M;
        const dx = x - this.px[i], dz = z - this.pz[i], d = dx * dx + dz * dz;
        if (d < best) { best = d; bi = i; }
      }
    }
    const dx = x - this.px[bi], dz = z - this.pz[bi];
    out.i = bi;
    out.s = ((bi * this.ds + dx * this.tx[bi] + dz * this.tz[bi]) % this.L + this.L) % this.L;
    out.lat = dx * this.nx[bi] + dz * this.nz[bi];

  }

  buildFeatures() {
    const def = this.def, rnd = mulberry(def.seed * 7 + 3), tmp = {};
    // buoys: alternate red (pass on its right) / yellow (pass on its left)
    const gap = 64;
    let nB = Math.round(this.L / gap); if (nB % 2) nB++;

    for (let k = 0; k < nB; k++) {
      const s = (k + 0.5) * this.L / nB;
      const red = k % 2 === 0;
      const lat = (red ? 1 : -1) * this.hw * (0.11 + 0.03 * Math.sin(k * 1.7));
      this.at(s, tmp);
      this.buoys.push({ k, s, lat, red, x: tmp.x + tmp.nx * lat, z: tmp.z + tmp.nz * lat, y: 0 });
    }
    // ramps (wedge launch ramps) – centred between two buoys
    this.ramps = def.ramps.map((f) => {
      const s0 = f * this.L;
      this.at(s0, tmp);
      const yaw = Math.atan2(tmp.tx, tmp.tz);
      const len = 17, w = 15, h = 6;
      return { s: s0, x: tmp.x - tmp.tx * len / 2, z: tmp.z - tmp.tz * len / 2, yaw, len, w, h, ex: tmp.x + tmp.tx * len / 2, ez: tmp.z + tmp.tz * len / 2, tx: tmp.tx, tz: tmp.tz };
    });
    // boost pads
    this.pads = def.pads.map((f, i) => {
      const s0 = f * this.L;
      this.at(s0, tmp);
      const lat = ((i % 3) - 1) * this.hw * 0.4;
      return { s: s0, lat, x: tmp.x + tmp.nx * lat, z: tmp.z + tmp.nz * lat, yaw: Math.atan2(tmp.tx, tmp.tz), w: 9, len: 12 };
    });
    // obstacles with static colliders
    this.obstacles = [];
    const bad = (s) => {
      for (const b of this.buoys) if (Math.abs(((s - b.s + this.L * 1.5) % this.L) - this.L / 2) < 8) return true;
      for (const r of this.ramps) if (Math.abs(s - r.s) < 40 || Math.abs(s - r.s + this.L) < 40 || Math.abs(s - r.s - this.L) < 40) return true;
      for (const r of this.pads) if (Math.abs(s - r.s) < 25 || Math.abs(s - r.s + this.L) < 25 || Math.abs(s - r.s - this.L) < 25) return true;
      return s < 90 || s > this.L - 60; // keep the start straight clear
    };
    let guard = 0;
    while (this.obstacles.length < def.obstacles && guard++ < 400) {
      const s = rnd() * this.L;
      if (bad(s)) continue;
      const lat = (rnd() < 0.5 ? -1 : 1) * this.hw * (0.5 + rnd() * 0.22);
      this.at(s, tmp);
      const r = def.props === 'harbor' ? 1.8 + rnd() * 0.6 : def.props === 'ice' ? 4 + rnd() * 3.5 : def.props === 'fort' ? 3.2 + rnd() * 2 : 3 + rnd() * 2.5;
      // spacing between obstacles
      let ok = true;
      for (const o of this.obstacles) if (Math.hypot(o.x - (tmp.x + tmp.nx * lat), o.z - (tmp.z + tmp.nz * lat)) < 28) ok = false;
      if (!ok) continue;
      this.obstacles.push({ s, lat, r, x: tmp.x + tmp.nx * lat, z: tmp.z + tmp.nz * lat, kind: def.props, rot: rnd() * TAU, v: rnd() });
    }
    // bounding box for minimap & water shore lookup
    let minx = 1e9, maxx = -1e9, minz = 1e9, maxz = -1e9;
    for (let i = 0; i < this.M; i++) {
      minx = Math.min(minx, this.px[i]); maxx = Math.max(maxx, this.px[i]);
      minz = Math.min(minz, this.pz[i]); maxz = Math.max(maxz, this.pz[i]);
    }
    this.bbox = { minx, maxx, minz, maxz };
  }
}

/** Layout of the stunt arena: ramps in two rings, hoops over them, boost pads. */
function buildStuntLayout() {
  const ramps = [], hoops = [], pads = [];
  const add = (r, n, off, cw, h, len, w, hoopR, hoopDist) => {
    for (let i = 0; i < n; i++) {
      const th = off + (i / n) * TAU;
      const tx = cw ? Math.sin(th) : -Math.sin(th), tz = cw ? -Math.cos(th) : Math.cos(th);
      const cx = r * Math.cos(th), cz = r * Math.sin(th);
      const yaw = Math.atan2(tx, tz);
      const ramp = { x: cx - tx * len / 2, z: cz - tz * len / 2, yaw, len, w, h, ex: cx + tx * len / 2, ez: cz + tz * len / 2, tx, tz };
      ramps.push(ramp);
      const slope = h / len, vy = slope * 31, tp = vy / GRAV;
      const hx = 31 * tp * 1.0 + hoopDist * 0, hy = h + vy * tp - 0.5 * GRAV * tp * tp;
      hoops.push({ x: ramp.ex + tx * hx, z: ramp.ez + tz * hx, y: hy, yaw, tx, tz, r: hoopR, done: false });
    }
  };
  add(120, 12, 0.0, false, 6, 17, 15, 5.2, 0);
  add(190, 6, 0.26, true, 10, 24, 19, 6.2, 0);
  for (let i = 0; i < 12; i++) {
    const th = (i + 0.5) / 12 * TAU, r = 120;
    pads.push({ x: r * Math.cos(th), z: r * Math.sin(th), yaw: Math.atan2(-Math.sin(th), Math.cos(th)), w: 9, len: 12 });
  }
  return { ramps, hoops, pads, arenaR: 262 };
}

/* ------------------------------------------------------------------ *
 *  WORLD: cel-shaded materials, inked outlines, water, sky, shore,
 *  scenery and weather for each course.
 * ------------------------------------------------------------------ */
const Toon = {
  grad: null, mats: new Map(), outMats: new Map(), outGeos: new Map(),
  init() {
    // 4-band cel ramp
    const d = new Uint8Array([70, 140, 205, 255]);
    this.grad = new THREE.DataTexture(d, 4, 1, THREE.RedFormat);
    this.grad.minFilter = THREE.NearestFilter; this.grad.magFilter = THREE.NearestFilter;
    this.grad.generateMipmaps = false; this.grad.needsUpdate = true;
  },
  mat(color, opts = {}) {
    const key = color + '|' + (opts.emissive || 0) + '|' + (opts.vc ? 1 : 0) + '|' + (opts.side || 0);
    let m = this.mats.get(key);
    if (!m) {
      m = new THREE.MeshToonMaterial({ color, gradientMap: this.grad, vertexColors: !!opts.vc, side: opts.side || THREE.FrontSide });
      if (opts.emissive) { m.emissive = new THREE.Color(opts.emissive); m.emissiveIntensity = opts.ei || 1; }
      this.mats.set(key, m);
    }
    return m;
  },
  outlineMat(th, color = 0x0b1220) {
    const key = th + '|' + color;
    let m = this.outMats.get(key);
    if (!m) {
      m = new THREE.MeshBasicNodeMaterial({ color, side: THREE.BackSide });
      m.positionNode = positionLocal.add(normalLocal.mul(float(th)));

  },
  outlineGeo(geo) {

      g = mergeVertices(g, 1e-3); g.computeVertexNormals();
      this.outGeos.set(geo, g);
    }
    return g;
  },
  /** inked toon mesh */
  mesh(geo, color, o = {}) {
    const m = new THREE.Mesh(geo, o.material || this.mat(color, o));
    m.castShadow = o.cast !== false; m.receiveShadow = o.receive !== false;
    if (o.outline !== false) {
      const ol = new THREE.Mesh(this.outlineGeo(geo), this.outlineMat(o.th || 0.06, o.ink || 0x0b1220));
      ol.userData.outline = true; m.add(ol);
    }
    return m;
  },

Toon.init();

/* Cached primitive geometries */
const G = {
  box: new THREE.BoxGeometry(1, 1, 1),
  sph: new THREE.SphereGeometry(1, 14, 10),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 14),
  cone: new THREE.ConeGeometry(1, 1, 12),
  ico: new THREE.IcosahedronGeometry(1, 1),
  oct: new THREE.OctahedronGeometry(1, 0),
  tor: new THREE.TorusGeometry(1, 0.12, 8, 28),
};
const geoCache = new Map();
/** scaled geometry (scale baked in so outlines stay even) */
function sg(kind, x, y, z) {
  const key = kind + x + ',' + y + ',' + z;
  let g = geoCache.get(key);
  if (!g) { g = G[kind].clone(); g.scale(x, y, z); geoCache.set(key, g); }
  return g;
}
function put(parent, mesh, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  mesh.position.set(x, y, z); mesh.rotation.set(rx, ry, rz); parent.add(mesh); return mesh;
}

/* ------------------------------ Sky --------------------------------- */
function makeSky(th) {
  const geo = new THREE.SphereGeometry(900, 24, 16);
  const pos = geo.attributes.position, col = new Float32Array(pos.count * 3);
  const top = new THREE.Color(th.skyTop), mid = new THREE.Color(th.skyMid), hor = new THREE.Color(th.skyHorizon), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 900;
    // hard cel bands in the sky
    let t = y < 0 ? 0 : Math.floor(Math.pow(y, 0.7) * 6) / 6;
    if (t < 0.5) c.copy(hor).lerp(mid, t * 2); else c.copy(mid).lerp(top, (t - 0.5) * 2);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  m.renderOrder = -10; m.frustumCulled = false;

}

function makeSun(th) {
  const g = new THREE.Group();
  const d = new THREE.Vector3(...th.sunDir).normalize();
  const col = new THREE.Color(th.sunColor);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(48, 32), new THREE.MeshBasicMaterial({ color: col, fog: false, depthWrite: false }));
  const halo = new THREE.Mesh(new THREE.RingGeometry(52, 78, 32), new THREE.MeshBasicMaterial({ color: col, fog: false, transparent: true, opacity: 0.35, depthWrite: false }));
  g.add(disc, halo);
  g.position.copy(d.multiplyScalar(820));
  g.lookAt(0, 0, 0);
  g.traverse((o) => { o.renderOrder = -9; o.frustumCulled = false; });
  return g;
}

function makeClouds(th, rnd, count) {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: th.cloud, fog: false, transparent: true, opacity: th.weather === 'rain' ? 0.95 : 0.92 });
  for (let i = 0; i < count; i++) {
    const c = new THREE.Group();
    const n = 3 + Math.floor(rnd() * 4);
    for (let j = 0; j < n; j++) {
      const s = 26 + rnd() * 34;
      const m = new THREE.Mesh(G.ico, mat);
      m.scale.set(s, s * 0.55, s * 0.8); m.position.set(j * 34 - n * 17, rnd() * 8, rnd() * 20);
      c.add(m);
    }
    const a = rnd() * TAU, r = 500 + rnd() * 250;
    c.position.set(Math.cos(a) * r, 160 + rnd() * 90, Math.sin(a) * r);
    c.rotation.y = -a;
    c.userData.drift = 0.8 + rnd() * 1.6; c.userData.a = a; c.userData.r = r;
    g.add(c);
  }
  return g;
}

/* ------------------------------ Water ------------------------------- */
class Ocean {
  constructor(th, track, arenaR) {
    this.th = th; this.track = track; this.arenaR = arenaR;
    this.N = 150; this.size = 400; this.sp = this.size / this.N;
    const n1 = this.N + 1;
    this.geo = new THREE.PlaneGeometry(this.size, this.size, this.N, this.N);
    this.geo.rotateX(-Math.PI / 2);
    this.pos = this.geo.attributes.position;
    this.nrm = this.geo.attributes.normal;
    this.col = new Float32Array(n1 * n1 * 3);
    this.colAttr = new THREE.BufferAttribute(this.col, 3);
    this.colAttr.setUsage(THREE.DynamicDrawUsage);
    this.geo.setAttribute('color', this.colAttr);
    this.pos.setUsage(THREE.DynamicDrawUsage); this.nrm.setUsage(THREE.DynamicDrawUsage);
    this.mesh = new THREE.Mesh(this.geo, Toon.mat(0xffffff, { vc: true }));
    this.mesh.receiveShadow = true; this.mesh.frustumCulled = false;
    this.cols = th.water.map((h) => new THREE.Color(h));
    this.shallow = new THREE.Color(th.shallow); this.deepShore = new THREE.Color(th.deepShore);
    // far plane
    const far = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000).rotateX(-Math.PI / 2), Toon.mat(th.water[1]));
    far.position.y = -0.35; far.frustumCulled = false; far.receiveShadow = false;
    this.far = far;
    this.group = new THREE.Group(); this.group.add(far, this.mesh);
    this.tmp = [0, 0, 0];
    this.buildShoreGrid();
  }
  /** coarse |distance from centreline| grid so water can show shallows */
  buildShoreGrid() {
    const tr = this.track;
    if (!tr) { this.grid = null; return; }
    const b = tr.bbox, pad = 260, cs = 14;
    const x0 = b.minx - pad, z0 = b.minz - pad;
    const nx = Math.ceil((b.maxx - b.minx + pad * 2) / cs), nz = Math.ceil((b.maxz - b.minz + pad * 2) / cs);
    const g = new Float32Array(nx * nz);
    for (let j = 0; j < nz; j++) {
      for (let i = 0; i < nx; i++) {
        const x = x0 + i * cs, z = z0 + j * cs;
        let best = 1e12;
        for (let k = 0; k < tr.M; k += 2) {
          const dx = x - tr.px[k], dz = z - tr.pz[k], d = dx * dx + dz * dz;
          if (d < best) best = d;
        }
        g[j * nx + i] = Math.sqrt(best);
      }
    }
    this.grid = { g, nx, nz, x0, z0, cs };
  }
  shoreDist(x, z) {
    const s = this.grid;
    if (!s) return 0;
    const fi = (x - s.x0) / s.cs, fj = (z - s.z0) / s.cs;
    const i = Math.max(0, Math.min(s.nx - 1, Math.round(fi))), j = Math.max(0, Math.min(s.nz - 1, Math.round(fj)));
    return s.g[j * s.nx + i];
  }
  update(cx, cz) {
    const sp = this.sp, N = this.N, n1 = N + 1;
    const ox = Math.round(cx / sp) * sp, oz = Math.round(cz / sp) * sp;
    this.mesh.position.set(ox, 0, oz);
    this.far.position.x = ox; this.far.position.z = oz;
    const half = this.size / 2, th = this.th;
    const [cDeep, cMid, cLight, cFoam] = this.cols;
    const hw = this.track ? this.track.hw : 1e9;
    const out = this.tmp, c = new THREE.Color();
    const A = Waves.amp * 0.5 + 0.5;
    for (let j = 0; j < n1; j++) {
      for (let i = 0; i < n1; i++) {
        const idx = j * n1 + i;
        const lx = -half + i * sp, lz = -half + j * sp;
        const wx = ox + lx, wz = oz + lz;
        Waves.hg(wx, wz, out);
        const r = Math.max(Math.abs(lx), Math.abs(lz));
        const fade = 1 - sstep(half * 0.62, half * 0.98, r);
        const hgt = out[0] * fade;
        this.pos.setY(idx, hgt);
        let nx = -out[1] * fade, nz = -out[2] * fade;
        const nl = Math.hypot(nx, 1, nz);
        this.nrm.setXYZ(idx, nx / nl, 1 / nl, nz / nl);
        // cel colour bands
        const slope = Math.hypot(out[1], out[2]);
        const v = hgt / (A * 1.2);
        let band = v < -0.35 ? 0 : v < 0.1 ? 1 : v < 0.55 ? 2 : 3;
        if (band === 3 && slope < 0.18) band = 2;
        c.copy(band === 0 ? cDeep : band === 1 ? cMid : band === 2 ? cLight : cFoam);
        // shallows near shore
        if (this.grid) {
          const d = this.shoreDist(wx, wz) - hw;
          if (d > -6) {
            const t = sstep(-6, 22, d);
            if (t > 0.66) c.copy(this.shallow);
            else if (t > 0.33) c.copy(this.deepShore);
            if (d > 2 && d < 5 + Math.sin(wx * 0.3 + Waves.t * 1.5) * 1.2) c.copy(cFoam);
          }
        } else if (this.arenaR) {
          const d = Math.hypot(wx, wz) - this.arenaR;
          if (d > -22) {
            const t = sstep(-22, 14, d);
            if (t > 0.7) c.copy(this.shallow); else if (t > 0.35) c.copy(this.deepShore);
            if (d > -2 && d < 3) c.copy(cFoam);
          }
          const cd = Math.hypot(wx, wz);
          if (cd < 70) { if (cd > 52 && cd < 58 + Math.sin(Waves.t * 1.3 + wx * 0.2) * 1.5) c.copy(cFoam); else if (cd < 52) c.copy(this.shallow); else c.copy(this.deepShore); }
        }
        this.col[idx * 3] = c.r; this.col[idx * 3 + 1] = c.g; this.col[idx * 3 + 2] = c.b;
      }
    }
    this.pos.needsUpdate = true; this.nrm.needsUpdate = true; this.colAttr.needsUpdate = true;
  }
}

/* ------------------------- Shore terrain strips -------------------------- */
function shoreHeight(u, nz, theme, amp) {
  // u: metres beyond the water edge; nz: noise 0..1
  if (u < 2) return -1.4 + (u + 6) * 0.1;
  const ramp = sstep(2, 14, u) * 2.6;
  const hills = sstep(16, 120, u) * (6 + nz * 26) * amp;
  return -0.3 + ramp + hills;
}

function buildShore(track, th, def) {
  const group = new THREE.Group();
  const cols = [-6, -1, 2, 5, 9, 14, 22, 34, 50, 72, 96];
  const step = 3; // every 3rd centreline sample ≈ 9 m
  const M = track.M, rows = Math.floor(M / step);
  const rnd = mulberry(def.seed);
  const mats = Toon.mat(0xffffff, { vc: true, side: THREE.DoubleSide });
  const c = new THREE.Color();
  const heightAt = [];
  for (const side of [-1, 1]) {
    const nv = rows * cols.length, pos = new Float32Array(nv * 3), col = new Float32Array(nv * 3);
    const idx = [];
    for (let r = 0; r < rows; r++) {
      const i = r * step;
      for (let k = 0; k < cols.length; k++) {
        const lat = side * (track.hw + cols[k]);
        const x = track.px[i] + track.nx[i] * lat, z = track.pz[i] + track.nz[i] * lat;
        const nzv = vnoise(x * 0.012 + 7.3, z * 0.012 + 2.1) * 0.7 + vnoise(x * 0.04, z * 0.04) * 0.3;
        const y = shoreHeight(cols[k], nzv, th, 1) + (cols[k] > 30 ? (vnoise(x * 0.09, z * 0.09) - 0.5) * 6 : 0);
        const v = r * cols.length + k;
        pos[v * 3] = x; pos[v * 3 + 1] = y; pos[v * 3 + 2] = z;
        // banded colours
        let hex;
        if (y < 0.2) hex = th.sand2; else if (y < 1.6) hex = th.sand;
        else if (y < 7) hex = th.grass; else if (y < 14) hex = th.grass2; else if (y < 24) hex = th.rock; else hex = th.snow;
        if (def.theme === 'glacier' && y > 0.2 && y < 14) hex = y < 4 ? th.sand : th.grass;
        c.set(hex);
        col[v * 3] = c.r; col[v * 3 + 1] = c.g; col[v * 3 + 2] = c.b;
      }
      const r2 = (r + 1) % rows;
      for (let k = 0; k < cols.length - 1; k++) {
        const a = r * cols.length + k, b = r * cols.length + k + 1, d = r2 * cols.length + k, e = r2 * cols.length + k + 1;
        if (side > 0) idx.push(a, d, b, b, d, e); else idx.push(a, b, d, b, e, d);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setIndex(idx); geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, mats);
    m.receiveShadow = true; m.frustumCulled = false;
    group.add(m);
    heightAt.push({ side, pos });
  }
  return group;
}

/* ---------------------- Scenery prop factories --------------------------- */
function makePalm(th, rnd) {
  const g = new THREE.Group();

    -w, -0.5, 0, w, -0.5, 0, w, -0.5, L, -w, -0.5, L,

    0, 4, 3, 3, 4, 7, 1, 2, 5, 2, 6, 5, 3, 7, 2, 2, 7, 6]; // sides + back

class ParticlePool {
  constructor(scene, color, count, geo) {
    this.n = count;
    this.mesh = new THREE.InstancedMesh(geo || new THREE.IcosahedronGeometry(1, 0), new THREE.MeshBasicMaterial({ color, fog: true }), count);
    this.mesh.frustumCulled = false;
    this.p = new Float32Array(count * 3); this.v = new Float32Array(count * 3);
    this.life = new Float32Array(count); this.max = new Float32Array(count);
    this.s0 = new Float32Array(count); this.s1 = new Float32Array(count);
    this.grav = new Float32Array(count);
    this.next = 0;
    this.d = new THREE.Object3D();
    this.zero = new THREE.Matrix4().makeScale(0, 0, 0);
    for (let i = 0; i < count; i++) this.mesh.setMatrixAt(i, this.zero);
    scene.add(this.mesh);
  }
  emit(x, y, z, vx, vy, vz, life, s0, s1, g = 14) {
    const i = this.next; this.next = (this.next + 1) % this.n;
    this.p[i * 3] = x; this.p[i * 3 + 1] = y; this.p[i * 3 + 2] = z;
    this.v[i * 3] = vx; this.v[i * 3 + 1] = vy; this.v[i * 3 + 2] = vz;
    this.life[i] = life; this.max[i] = life; this.s0[i] = s0; this.s1[i] = s1; this.grav[i] = g;
  }
  update(dt) {
    const d = this.d;
    for (let i = 0; i < this.n; i++) {
      if (this.life[i] <= 0) continue;
      this.life[i] -= dt;
      if (this.life[i] <= 0) { this.mesh.setMatrixAt(i, this.zero); continue; }
      const i3 = i * 3;
      this.v[i3 + 1] -= this.grav[i] * dt;
      this.p[i3] += this.v[i3] * dt; this.p[i3 + 1] += this.v[i3 + 1] * dt; this.p[i3 + 2] += this.v[i3 + 2] * dt;
      const u = 1 - this.life[i] / this.max[i];
      const s = lerp(this.s0[i], this.s1[i], u);
      d.position.set(this.p[i3], this.p[i3 + 1], this.p[i3 + 2]);
      d.scale.setScalar(s); d.updateMatrix();
      this.mesh.setMatrixAt(i, d.matrix);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
}

class World {
  constructor(def) {
    this.def = def; this.th = THEMES[def.theme];
    const th = this.th;
    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.Fog(th.fog, th.fogNear, th.fogFar);
    this.scene.background = new THREE.Color(th.skyHorizon);
    Waves.setup(def.waves, def.seed);
    this.rnd = mulberry(def.seed * 13 + 1);
    this.track = def.type === 'race' ? new Track(def) : null;
    this.stunt = def.type === 'stunt' ? buildStuntLayout() : null;
    this.ramps = this.track ? this.track.ramps : this.stunt.ramps;
    this.pads = this.track ? this.track.pads : this.stunt.pads;
    this.rw = new RAPIER.World({ x: 0, y: 0, z: 0 });
    this.rw.timestep = 1 / 60;
    this.obsViz = [];
    this.clouds = null;
    this.flash = 0; this.nextBolt = 6 + this.rnd() * 6; this.boltDelay = -1;
    this.buildLights();
    this.sky = makeSky(th); this.scene.add(this.sky);
    this.sun = makeSun(th); this.scene.add(this.sun);
    this.clouds = makeClouds(th, this.rnd, def.theme === 'storm' ? 26 : 16); this.scene.add(this.clouds);
    this.ocean = new Ocean(th, this.track, this.stunt ? this.stunt.arenaR : 0);
    this.scene.add(this.ocean.group);
    this.buildMountains();
    if (this.track) this.buildRaceScenery(); else this.buildStuntScenery();
    this.buildInteractives();
    this.pools = {
      spray: new ParticlePool(this.scene, 0xffffff, 1400),
      foam: new ParticlePool(this.scene, 0xdff6ff, 500, new THREE.CircleGeometry(1, 10).rotateX(-Math.PI / 2)),
      spark: new ParticlePool(this.scene, 0xffb830, 500),
      blue: new ParticlePool(this.scene, 0x5ad8ff, 500),
      gold: new ParticlePool(this.scene, 0xffe14a, 400),
      pink: new ParticlePool(this.scene, 0xff4fd8, 400),
      smoke: new ParticlePool(this.scene, 0x9aa6b8, 200),
    };
    this.buildWeather();
    this._h = [0, 0, 0];
  }

  buildLights() {
    const th = this.th;
    this.hemi = new THREE.HemisphereLight(th.hemiSky, th.hemiGround, th.hemiI);
    this.scene.add(this.hemi);
    this.sunL = new THREE.DirectionalLight(th.sunColor, th.sunI);
    this.sunDir = new THREE.Vector3(...th.sunDir).normalize();
    this.sunL.castShadow = true;
    const sc = this.sunL.shadow.camera;
    sc.left = -70; sc.right = 70; sc.top = 70; sc.bottom = -70; sc.near = 1; sc.far = 320;
    this.sunL.shadow.mapSize.set(2048, 2048);
    this.sunL.shadow.bias = -0.0004; this.sunL.shadow.normalBias = 0.04;
    this.scene.add(this.sunL, this.sunL.target);
    if (this.def.theme === 'storm' || this.def.theme === 'marina') {
      this.lamp = new THREE.PointLight(this.def.theme === 'storm' ? 0xffc27a : 0xffd8a0, 140, 60, 1.6);
      this.scene.add(this.lamp);
    }
  }

  buildMountains() {
    const th = this.th, rnd = this.rnd;
    const g = new THREE.Group();
    const base = new THREE.Color(this.def.theme === 'glacier' ? th.sand2 : th.rock).lerp(new THREE.Color(th.fog), 0.55);
    const capc = new THREE.Color(th.snow).lerp(new THREE.Color(th.fog), 0.4);
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * TAU + rnd() * 0.1, r = 1250 + rnd() * 250, h = 160 + rnd() * 240, w = 220 + rnd() * 160;
      const m = new THREE.Mesh(sg('cone', w, h, w), new THREE.MeshBasicMaterial({ color: base, fog: false }));
      m.position.set(Math.cos(a) * r, h / 2 - 20, Math.sin(a) * r);
      const cap = new THREE.Mesh(sg('cone', w * 0.38, h * 0.36, w * 0.38), new THREE.MeshBasicMaterial({ color: capc, fog: false }));
      cap.position.set(0, h * 0.32, 0);
      m.add(cap);
      g.add(m);
    }
    this.scene.add(g);
    this.mountains = g;
  }

  shoreY(x, z, u) {
    const nzv = vnoise(x * 0.012 + 7.3, z * 0.012 + 2.1) * 0.7 + vnoise(x * 0.04, z * 0.04) * 0.3;
    return shoreHeight(u, nzv, this.th, 1) + (u > 30 ? (vnoise(x * 0.09, z * 0.09) - 0.5) * 6 : 0);
  }

  buildRaceScenery() {
    const tr = this.track, th = this.th, def = this.def, rnd = this.rnd;
    this.scene.add(buildShore(tr, th, def));
    // static walls so riders cannot leave the lane
    const tmp = {};
    for (let i = 0; i < tr.M; i += 3) {
      const yaw = Math.atan2(tr.tx[i], tr.tz[i]);
      const q = { x: 0, y: Math.sin(yaw / 2), z: 0, w: Math.cos(yaw / 2) };
      for (const side of [-1, 1]) {
        const lat = side * (tr.hw + 2.6);
        const cd = RAPIER.ColliderDesc.cuboid(1.4, 4, tr.ds * 1.5 + 0.8).setTranslation(tr.px[i] + tr.nx[i] * lat, 0, tr.pz[i] + tr.nz[i] * lat).setRotation(q).setFriction(0).setRestitution(0.2);
        this.rw.createCollider(cd);
      }
    }
    // scenery
    const place = (obj, s, lat, yOff = 0, scl = 1) => {
      tr.at(s, tmp);
      const x = tmp.x + tmp.nx * lat, z = tmp.z + tmp.nz * lat;
      const u = Math.abs(lat) - tr.hw;
      obj.position.set(x, this.shoreY(x, z, u) + yOff, z);
      if (scl !== 1) obj.scale.setScalar(scl);
      this.scene.add(obj);
      return obj;
    };
    const L = tr.L;
    const sideLat = (min, max) => (rnd() < 0.5 ? -1 : 1) * (tr.hw + min + rnd() * (max - min));
    const kind = def.props;
    if (kind === 'palms') {
      for (let i = 0; i < 90; i++) { const o = place(makePalm(th, rnd), rnd() * L, sideLat(7, 36)); o.rotation.y = rnd() * TAU; }
      for (let i = 0; i < 26; i++) place(makeRock(th, rnd, rnd() < 0.3), rnd() * L, sideLat(5, 70));
      for (let i = 0; i < 7; i++) { const o = place(makeHut(th, rnd), rnd() * L, sideLat(14, 40)); o.rotation.y = rnd() * TAU; }
      place(makeLighthouse(), 0.55 * L, tr.hw + 38, 0, 1.3);
    } else if (kind === 'harbor') {
      for (let i = 0; i < 22; i++) { const o = place(makeWarehouse(th, rnd), rnd() * L, sideLat(12, 62)); tr.at(0, tmp); o.rotation.y = Math.atan2(tmp.tx, tmp.tz) + Math.floor(rnd() * 4) * Math.PI / 2; }
      for (let i = 0; i < 6; i++) place(makeCrane(), rnd() * L, sideLat(8, 24)).rotation.y = rnd() * TAU;

  buildStuntScenery() {

      const q = { x: 0, y: Math.sin((-a) / 2), z: 0, w: Math.cos((-a) / 2) };
      // tangent direction at angle a: (-sin a, cos a); local z-axis must align => rotate by atan2(-sin a, cos a) = -a
      this.rw.createCollider(RAPIER.ColliderDesc.cuboid(1.6, 4, (R * TAU / n) / 2 + 1).setTranslation((R + 2) * Math.cos(a), 0, (R + 2) * Math.sin(a)).setRotation(q).setFriction(0).setRestitution(0.2));

        const r = R + 1 + cols[k], x = r * Math.cos(a), z = r * Math.sin(a);
        const y = shoreHeight(cols[k] + 2, vnoise(x * 0.015, z * 0.015), th, 1);
        pos.push(x, y, z);
        c.set(y < 0.2 ? th.sand2 : y < 1.8 ? th.sand : y < 8 ? th.grass : y < 16 ? th.grass2 : th.rock); col.push(c.r, c.g, c.b);
      }
      const i2 = (i + 1) % seg;
      for (let k = 0; k < cols.length - 1; k++) { const a0 = i * cols.length + k, b0 = a0 + 1, d0 = i2 * cols.length + k, e0 = d0 + 1; idx.push(a0, b0, d0, b0, e0, d0); }
    }
    ring.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); ring.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    ring.setIndex(idx); ring.computeVertexNormals();
    const rm = new THREE.Mesh(ring, Toon.mat(0xffffff, { vc: true, side: THREE.DoubleSide })); rm.receiveShadow = true; rm.frustumCulled = false; this.scene.add(rm);
    for (let i = 0; i < 120; i++) {
      const a = rnd() * TAU, r = R + 12 + rnd() * 50, o = makePalm(th, rnd);
      o.position.set(r * Math.cos(a), this.shoreY(r * Math.cos(a), r * Math.sin(a), r - R) + 0.0, r * Math.sin(a)); o.rotation.y = rnd() * TAU; this.scene.add(o);
    }
    // central island with a volcano + palms
    const isle = new THREE.Group();
    const cone = Toon.mesh(sg('cone', 34, 34, 34), th.rock2, { th: 0.2 }); put(isle, cone, 0, 12, 0);
    const lava = Toon.mesh(sg('cyl', 7, 1, 7), 0xff5a1a, { material: new THREE.MeshBasicMaterial({ color: 0xff7a2a }), outline: false, cast: false }); put(isle, lava, 0, 28.6, 0);
    const base = Toon.mesh(sg('cyl', 46, 3, 46), th.sand, { th: 0.2 }); put(isle, base, 0, -0.3, 0);
    for (let i = 0; i < 9; i++) { const a = (i / 9) * TAU, p = makePalm(th, rnd); p.position.set(Math.cos(a) * 38, 1, Math.sin(a) * 38); isle.add(p); }
    this.scene.add(isle);
    this.rw.createCollider(RAPIER.ColliderDesc.cylinder(5, 44).setTranslation(0, 0, 0).setFriction(0).setRestitution(0.25));
    this.lavaMat = lava.material;
  }

  buildInteractives() {
    this.buoyViz = [];
    if (this.track) {
      for (const b of this.track.buoys) {
        const g = makeBuoy(b.red); g.position.set(b.x, 0, b.z); this.scene.add(g);
        this.buoyViz.push(g); b.obj = g;
      }
      this.beacon = [makeBeacon(true), makeBeacon(false)];
      for (const bc of this.beacon) { bc.visible = false; this.scene.add(bc); }
    }
    this.rampViz = this.ramps.map((r) => { const m = makeRampMesh(r, this.th); this.scene.add(m); return m; });
    for (const r of this.ramps) { r.s_ = Math.sin(r.yaw); r.c_ = Math.cos(r.yaw); }
    this.padViz = this.pads.map((p) => { const m = makePadMesh(p); this.scene.add(m); p.s_ = Math.sin(p.yaw); p.c_ = Math.cos(p.yaw); return m; });

      this.hoopViz = this.stunt.hoops.map((h) => { const m = makeHoopMesh(h); this.scene.add(m); return m; });
    }
  }

  buildWeather() {
    const w = this.th.weather;
    this.weather = null;
    if (w === 'none') return;
    const n = w === 'rain' ? 900 : 700;
    const geo = w === 'rain' ? new THREE.BoxGeometry(0.05, 1.1, 0.05) : new THREE.IcosahedronGeometry(0.11, 0);
    const m = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ color: w === 'rain' ? 0xb8d8ff : 0xffffff, transparent: w === 'rain', opacity: 0.7 }), n);
    m.frustumCulled = false;

    this.scene.add(m);
    this.weather = { kind: w, mesh: m, pos, n, d: new THREE.Object3D() };
  }

  /** Surface the craft rides on: ocean or ramp, whichever is higher. */
  surf(x, z) {
    let h = Waves.h(x, z);
    for (const r of this.ramps) {
      const dx = x - r.x, dz = z - r.z;
      const u = dx * r.s_ + dz * r.c_;
      if (u < -2 || u > r.len) continue;
      const v = dx * r.c_ - dz * r.s_;
      if (Math.abs(v) > r.w / 2) continue;
      const rh = r.h * Math.max(0, u) / r.len + 0.2;
      if (rh > h) h = rh;
    }
    return h;
  }

  update(dt, focus, cam) {
    Waves.update(dt);
    this.ocean.update(cam.position.x * 0.5 + focus.x * 0.5, cam.position.z * 0.5 + focus.z * 0.5);
    // sky + sun follow the camera
    this.sky.position.copy(cam.position); this.sun.position.copy(cam.position).add(this.sunDir.clone().multiplyScalar(820));
    this.sun.lookAt(cam.position);
    this.mountains.position.set(cam.position.x, 0, cam.position.z);
    for (const c of this.clouds.children) { c.userData.a += c.userData.drift * 0.00006; const a = c.userData.a; c.position.x = cam.position.x + Math.cos(a) * c.userData.r; c.position.z = cam.position.z + Math.sin(a) * c.userData.r; c.rotation.y = -a; }
    // shadow rig tracks the focus
    this.sunL.position.set(focus.x + this.sunDir.x * 120, this.sunDir.y * 120 + 5, focus.z + this.sunDir.z * 120);
    this.sunL.target.position.set(focus.x, 0, focus.z);
    if (this.lamp) this.lamp.position.set(focus.x, 6, focus.z);
    // bobbing objects
    for (const o of this.obsViz) {
      if (!o.bob) continue;
      o.obj.position.y = Waves.h(o.obj.position.x, o.obj.position.z) * 0.9 + o.base;
      o.obj.rotation.z = Math.sin(Waves.t * 1.3 + o.obj.position.x) * 0.05;
    }
    const pulse = 0.5 + 0.5 * Math.sin(Waves.t * 5);
    for (const g of this.buoyViz) {
      const p = g.position;
      p.y = Waves.h(p.x, p.z) * 0.85 - 0.2;
      g.rotation.z = Math.sin(Waves.t * 1.7 + p.x) * 0.08; g.rotation.x = Math.cos(Waves.t * 1.3 + p.z) * 0.08;
    }
    for (const m of this.padViz) m.userData.mat.color.setHSL(0.45 + pulse * 0.05, 1, 0.5 + pulse * 0.15);
    if (this.hoopViz) for (let i = 0; i < this.hoopViz.length; i++) { const h = this.stunt.hoops[i]; this.hoopViz[i].userData.mat.color.setHex(h.done ? 0x6bff9a : 0xff4fd8); this.hoopViz[i].rotation.z += dt * (h.done ? 0 : 0.8); }
    for (const k in this.pools) this.pools[k].update(dt);
    // weather
    if (this.weather) {
      const w = this.weather, d = w.d, cp = cam.position;
      const fall = w.kind === 'rain' ? 34 : 3.2;
      for (let i = 0; i < w.n; i++) {
        const i3 = i * 3;
        w.pos[i3 + 1] -= fall * dt * (w.kind === 'snow' ? 0.7 + (i % 5) * 0.12 : 1);
        if (w.kind === 'snow') w.pos[i3] += Math.sin(Waves.t + i) * dt * 0.7;
        if (w.pos[i3 + 1] < -2) w.pos[i3 + 1] += 42;
        let x = w.pos[i3] - cp.x, z = w.pos[i3 + 2] - cp.z;
        x = ((x + 45) % 90 + 90) % 90 - 45; z = ((z + 45) % 90 + 90) % 90 - 45;
        w.pos[i3] = cp.x + x; w.pos[i3 + 2] = cp.z + z;
        d.position.set(w.pos[i3], cp.y - 6 + w.pos[i3 + 1], w.pos[i3 + 2]);
        d.rotation.set(0, 0, w.kind === 'rain' ? 0.12 : 0); d.updateMatrix();
        w.mesh.setMatrixAt(i, d.matrix);
      }
      w.mesh.instanceMatrix.needsUpdate = true;
    }
    // lightning
    if (this.def.theme === 'storm') {
      this.nextBolt -= dt;
      if (this.nextBolt <= 0) { this.flash = 1; this.nextBolt = 5 + this.rnd() * 9; this.boltDelay = 0.4 + this.rnd() * 1.4; }
      if (this.boltDelay > 0) { this.boltDelay -= dt; if (this.boltDelay <= 0) Audio.sfx('thunder'); }
      this.flash = Math.max(0, this.flash - dt * 3.2);
      const f = this.flash > 0.5 ? 1 : this.flash > 0.25 ? 0.2 : this.flash;
      this.hemi.intensity = this.th.hemiI + f * 2.4;
      this.sunL.intensity = this.th.sunI + f * 2.2;
    }
    if (this.lavaMat) this.lavaMat.color.setHSL(0.05 + pulse * 0.03, 1, 0.5 + pulse * 0.1);
  }

  /** Remove GPU-heavy resources when leaving a course. */
  dispose() {
    this.ocean.geo.dispose();
    this.rw.free && this.rw.free();
    this.scene.traverse((o) => { if (o.isInstancedMesh) o.dispose && o.dispose(); });
  }
}

const _v3a = new THREE.Vector3(), _v3b = new THREE.Vector3(), _q = new THREE.Quaternion(), _up = new THREE.Vector3(0, 1, 0);

function limb(parent, a, b, r, color, th = 0.035) {
  const len = a.distanceTo(b);
  const m = Toon.mesh(sg('cyl', r, 1, r), color, { th });
  m.scale.y = len; // outline scales along with the limb – fine for thin parts
  m.position.copy(a).add(b).multiplyScalar(0.5);
  _v3a.copy(b).sub(a).normalize();
  m.quaternion.setFromUnitVectors(_up, _v3a);
  parent.add(m);
  return m;
}

function buildCraftModel(rider, ghost = false) {

  put(hull, mk(sg('sph', 0.62, 0.42, 1.75), col, { th: 0.05 }), 0, 0.55, 0);
  put(hull, mk(sg('box', 1.0, 0.22, 3.0), 0x1b2233, { th: 0.04 }), 0, 0.18, -0.1);

  put(hull, mk(sg('box', 0.5, 0.06, 2.5), acc, { th: 0.02, cast: false }), 0, 0.97, -0.1);
  put(hull, mk(sg('box', 0.5, 0.34, 1.3), 0x232b3d, { th: 0.04 }), 0, 0.92, -0.7);
  // handlebars
  put(hull, mk(sg('cyl', 0.05, 0.6, 0.05), 0x2a2f3a, { th: 0.02 }), 0, 1.15, 0.45, 0.35, 0, 0);
  put(hull, mk(sg('cyl', 0.05, 0.8, 0.05), 0x2a2f3a, { th: 0.02 }), 0, 1.42, 0.58, 0, 0, Math.PI / 2);
  // windshield
  if (!ghost) {
    const ws = new THREE.Mesh(sg('box', 0.7, 0.55, 0.06), new THREE.MeshBasicMaterial({ color: 0x9fe8ff, transparent: true, opacity: 0.55 }));
    ws.position.set(0, 1.25, 0.95); ws.rotation.x = -0.55; hull.add(ws);
  }

  put(hull, mk(sg('cyl', 0.22, 0.45, 0.22), 0x3a4252, { th: 0.03 }), 0, 0.5, -1.7, Math.PI / 2, 0, 0);

    flame.position.set(0, 0.5, -2.5); flame.rotation.x = -Math.PI / 2; flame.visible = false; hull.add(flame);

  put(torso, mk(sg('box', 0.62, 0.78, 0.38), suit, { th: 0.04 }), 0, 0.5, 0);
  put(torso, mk(sg('box', 0.64, 0.3, 0.4), col, { th: 0.03 }), 0, 0.28, 0);
  const head = new THREE.Group(); head.position.set(0, 1.1, 0.08); torso.add(head);
  put(head, mk(sg('sph', 0.22, 0.22, 0.22), skin, { th: 0.03 }), 0, 0, 0);
