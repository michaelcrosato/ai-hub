    this.ctl = { steer: 0, lean: 0, throttle: 0, brake: 0, boost: false, drift: false, spin: false, flip: false, roll: false };
    this.onEvent = null;
    this.hint = -1; this.s = 0; this.lat = 0; this.prog = 0; this.lapBase = 0; this.lastS = 0;
    this.nextBuoy = 0; this.buoyHit = 0; this.buoyMiss = 0; this.perfects = 0; this.finished = false; this.finishTime = 0;
    this.topSpeed = 0; this.tricksDone = 0; this.score = 0; this.lapTimes = []; this.lapStart = 0; this.place = 1;
    this.engine = Audio.makeEngine(this.isPlayer);
    this.acc = { spray: 0, wake: 0 };
    this.surfH = 0; this.slopeLong = 0; this.slopeLat = 0;
    this.ai = null;
  }

  placeAt(x, z, yaw) {
    this.x = x; this.z = z; this.yaw = yaw; this.sf = 0; this.sl = 0; this.vy = 0;
    this.y = this.world.surf(x, z) + 0.4;
    this.body.setTranslation({ x, y: this.y, z }, true); this.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
    this.px = x; this.pz = z; this.py = this.y; this.pyaw = yaw;
  }

  /** seconds of airtime left (ballistic estimate) */
  airLeft() {
    if (this.air < 0.12) return 0;
    const rel = this.y - (this.surfH + 0.3);
    return Math.max(0, (this.vy + Math.sqrt(Math.max(0, this.vy * this.vy + 2 * GRAV * rel))) / GRAV);
  }

  get speed() { return Math.hypot(this.sf, this.sl); }
  get multiplier() { return POWER_MULT[this.power - 1] * this.speedScale; }
  emit(type, data) { if (this.onEvent) this.onEvent(this, type, data); }

  wipeout(kind) {
    if (this.wipeT > 0 || this.invuln > 0) return;
    this.wipeT = 1.55; this.invuln = 2.6; this.trick = null; this.trickChain = 0;
    this.riderV.set((Math.random() - 0.5) * 6, 8 + Math.random() * 3, 5 + Math.random() * 4);
    this.riderSpin = (Math.random() < 0.5 ? -1 : 1) * 9;
    this.riderOff.set(0, 0, 0);
    this.sf *= 0.35; this.power = Math.max(1, this.power - 1);
    this.drifting = false; this.driftT = 0;
    this.emit('wipe', kind);
    this.burst(40, 8);
  }

  burst(n, speed) {
    const P = this.world.pools.spray;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = (0.4 + Math.random()) * speed;
      P.emit(this.x, this.y - 0.2, this.z, Math.cos(a) * s, 3 + Math.random() * speed * 0.9, Math.sin(a) * s, 0.7 + Math.random() * 0.6, 0.55, 0.08, 16);
    }
  }

  /** One fixed physics step (dt = 1/60). Rapier steps afterwards (world-level). */
  preStep(dt) {
    const c = this.ctl, st = this.stats, w = this.world;
    const p = this.body.translation(), lv = this.body.linvel();
    this.px = this.x; this.py = this.y; this.pz = this.z; this.pyaw = this.yaw;
    this.x = p.x; this.y = p.y; this.z = p.z;
    let fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
    let rx = -fz, rz = fx;
    const vx = lv.x, vz = lv.z;
    let sf = vx * fx + vz * fz, sl = vx * rx + vz * rz;
    // crash detection from collision response
    const sp = Math.hypot(vx, vz);
    if (this.cmdSp > 16 && this.cmdSp - sp > 10 && this.wipeT <= 0) {
      if (this.invuln <= 0) this.wipeout('crash'); else this.emit('bump');
    } else if (this.cmdSp - sp > 4 && this.wipeT <= 0) this.emit('bump');
    this.sf = sf; this.sl = sl;
    if (this.invuln > 0) this.invuln -= dt;

    // sample the water under the hull
    const hF = w.surf(this.x + fx * 1.6, this.z + fz * 1.6), hR = w.surf(this.x - fx * 1.6, this.z - fz * 1.6);
    const hRt = w.surf(this.x + rx * 0.8, this.z + rz * 0.8), hLt = w.surf(this.x - rx * 0.8, this.z - rz * 0.8);
    const hC = w.surf(this.x, this.z);
    const hs = (hF + hR + hRt + hLt + hC * 2) / 6;
    this.surfH = hs;
    this.slopeLong = (hF - hR) / 3.2; this.slopeLat = (hRt - hLt) / 1.6;
    const ty = hs + 0.3;
    const dyc = this.y - ty;
    const contact = dyc < 0.5;
    const water = dyc < 0.3;
    if (dyc > 0.55) this.air += dt; else if (dyc < 0.3) {
      if (this.air > 0.28) this.land(this.air);
      this.air = 0;
    }
    this.grounded = this.air < 0.12;
    const airborne = this.air > 0.12;

    // -------- vertical (buoyancy spring) --------
    let ay = -GRAV;
    if (dyc < 0.28) ay += clamp((0.28 - dyc) * 100, 0, 200) - this.vy * (this.vy < 0 ? 11 : 4.5);
    this.vy = lv.y + ay * dt;
    if (!isFinite(this.vy)) this.vy = 0;

    // -------- control --------
    const wiped = this.wipeT > 0;
    if (wiped) {
      this.wipeT -= dt;
      sf *= Math.exp(-2.4 * dt); sl *= Math.exp(-2.4 * dt);
      this.boosting = false; this.drifting = false;
    } else {
      // boost handling
      const wantBoost = c.boost && this.boostMeter > 0.5 && c.throttle > 0.1;
      if (wantBoost) { this.boostMeter = Math.max(0, this.boostMeter - 26 * dt); }
      const wasBoost = this.boosting;
      this.boosting = wantBoost || this.boostT > 0;
      if (this.boostT > 0) this.boostT -= dt;
      if (this.boosting && !wasBoost) this.emit('boost');
      const maxSp = st.maxSp * this.multiplier * (this.boosting ? 1.36 : 1) * (1 + (c.lean > 0 ? 0.02 * c.lean : 0));
      const target = c.throttle * maxSp;
      if (water || contact) {
        const k = st.accK * (this.boosting ? 2.6 : 1);
        if (sf < target) sf += (target - sf) * Math.min(1, k * dt);
        else sf += (target - sf) * Math.min(1, (c.throttle > 0.05 ? 0.9 : 0.5) * dt);
        if (c.brake > 0.05) sf = Math.max(-7, sf - c.brake * 30 * dt);
        // wave interaction
        sf += -this.slopeLong * GRAV * 0.5 * dt * (sf > 3 ? 1 : 0.4);
        sl += -this.slopeLat * GRAV * 0.4 * dt;
        const slap = Math.max(0, this.slopeLong - 0.32);
        if (slap > 0) sf -= sf * slap * (c.lean < -0.2 ? 0.7 : 1.5) * dt * 2.0;
        // drift state
        const canDrift = c.drift && sf > 13 && Math.abs(c.steer) > 0.25;
        if (canDrift && !this.drifting) { this.drifting = true; this.driftDir = Math.sign(c.steer); this.driftT = 0; this.emit('driftstart'); }
        if (this.drifting) {
          if (!c.drift || sf < 10) this.endDrift();
          else this.driftT += dt;
        }
        const grip = st.grip * (this.drifting ? 0.32 : 1) * (1 + (c.brake > 0.3 ? 0.4 : 0));
        sl *= Math.exp(-grip * dt);
      }
      // steering
      let steer = c.steer * Save.s.steerSens;
      if (this.drifting) steer = this.driftDir * (0.55 + 0.45 * ((c.steer * this.driftDir + 1) / 2)) * 1.25;
      const spdF = clamp(Math.abs(sf) / 9, 0, 1);
      let rate = st.turn * lerp(0.28, 1, spdF) * (1.22 - 0.5 * clamp(sf / (st.maxSp * 1.1), 0, 1.2));
      if (airborne) rate *= 0.22;
      if (sf < -0.5) steer = -steer;
      this.yaw -= steer * rate * dt;
      if (this.drifting) this.yaw -= this.driftDir * 0.35 * dt;
      this.tilt = damp(this.tilt, c.steer, 6, dt);
      // tricks
      if (airborne && !this.trick && this.air > 0.2 && dyc > 1.0) {
        const k = c.spin ? 0 : c.flip ? 1 : c.roll ? 2 : -1;
        if (k >= 0) { this.trick = { k, u: 0, dur: TRICKS[k].dur / (0.85 + 0.08 * st.trk) }; this.emit('trickstart', k); }
      }
      if (this.trick) {
        this.trick.u += dt / this.trick.dur;
        if (this.trick.u >= 1) { this.finishTrick(); }
      }
    }
    c.spin = c.flip = c.roll = false;
    if (airborne && !wiped) {
      // air control: lean pitches the nose, tiny drag
      this.airPitch = (this.airPitch || 0) + c.lean * 0.9 * dt * -1;
      this.airPitch = clamp(this.airPitch, -0.5, 0.5);
    } else this.airPitch = damp(this.airPitch || 0, 0, 6, dt);

    // recompose
    fx = Math.sin(this.yaw); fz = Math.cos(this.yaw); rx = -fz; rz = fx;
    const nvx = fx * sf + rx * sl, nvz = fz * sf + rz * sl;
    this.cmdSp = Math.hypot(nvx, nvz);
    this.sf = sf; this.sl = sl;
    if (this.cmdSp > this.topSpeed) this.topSpeed = this.cmdSp;
    this.body.setLinvel({ x: nvx, y: this.vy, z: nvz }, true);
    this.wasAir = airborne;
    // rider ballistic
    if (wiped) {
      this.riderV.y -= GRAV * dt;
      this.riderOff.addScaledVector(this.riderV, dt);
      const wy = this.surfH - this.y + 0.1;
      if (this.riderOff.y < wy - 0.3) { this.riderOff.y = wy - 0.3; this.riderV.set(this.riderV.x * 0.9, Math.max(0, -this.riderV.y * 0.15), this.riderV.z * 0.9); this.riderSpin *= 0.9; }
    }
  }

  endDrift() {
    if (this.drifting) {
      if (this.driftT > 0.7) {
        const ch = clamp(this.driftT / 2.4, 0, 1);
        this.boostMeter = Math.min(100, this.boostMeter + 6 + 20 * ch);
        this.boostT = Math.max(this.boostT, 0.45 + 0.8 * ch);
        this.emit('driftboost', ch);
      }
      this.drifting = false; this.driftT = 0;
    }
  }

  finishTrick() {
    const t = TRICKS[this.trick.k];
    this.trick = null; this.trickCount++; this.trickChain++; this.tricksDone++;
    const gain = 12 + this.stats.trk * 3;
    this.boostMeter = Math.min(100, this.boostMeter + gain);
    this.emit('trick', { trick: t, chain: this.trickChain });
  }

  land(airTime) {
    const impact = clamp(-this.vy, 0, 30);
    if (this.trick) {
      if (this.trick.u > 0.78) this.finishTrick();
      else if (this.trick.u < 0.3) this.trick = null; // bailed out early: harmless
      else { this.trick = null; this.wipeout('botch'); }
    }
    this.emit('land', { air: airTime, impact });
    if (this.wipeT <= 0) { this.trickChain = 0; }
    // splash
    const P = this.world.pools.spray, n = Math.floor(12 + impact * 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = (0.5 + Math.random()) * (3 + impact * 0.4);
      P.emit(this.x, this.surfH, this.z, Math.cos(a) * s, 2 + Math.random() * impact * 0.5, Math.sin(a) * s, 0.5 + Math.random() * 0.5, 0.5, 0.08, 15);
    }
    const F = this.world.pools.foam;
    for (let i = 0; i < 4; i++) F.emit(this.x, this.surfH + 0.08, this.z, 0, 0, 0, 1.0, 1.0 + i * 0.6, 4 + i * 1.5, 0);
  }

  /** per rendered frame: interpolate, orient, particles, audio */
  visual(alpha, dt, camPos, camRight) {
    const m = this.m;
    const ix = lerp(this.px, this.x, alpha), iy = lerp(this.py, this.y, alpha), iz = lerp(this.pz, this.z, alpha);
    const iyaw = this.pyaw + wrapAng(this.yaw - this.pyaw) * alpha;
    const air = this.air > 0.12;
    // target attitude
    let tp, tr;
    if (air) {
      const vang = Math.atan2(this.vy, Math.max(4, Math.hypot(this.sf, this.sl)));
      tp = -vang * 0.85 - (this.airPitch || 0);
      tr = this.tilt * 0.25;
    } else {
      tp = -Math.atan(this.slopeLong) * 0.95 - (this.ctl.lean * 0.1) + (this.boosting ? -0.05 : 0);
      tr = -Math.atan(this.slopeLat) * 0.6 + this.tilt * (this.drifting ? 0.62 : 0.4);
    }
    this.pitch = damp(this.pitch, tp, air ? 4 : 11, dt);
    this.roll = damp(this.roll, tr, air ? 4 : 10, dt);
    // trick overlay rotation
    let yo = 0, po = 0, ro = 0;
    if (this.trick) {
      const u = this.trick.u, e = u * u * (3 - 2 * u);
      if (this.trick.k === 0) yo = TAU * e; else if (this.trick.k === 1) po = -TAU * e; else ro = TAU * e;
    }
    // wipeout tumble of the craft itself
    let wob = 0;
    if (this.wipeT > 0) wob = Math.sin(performance.now() * 0.02) * 0.15;
    const bob = air ? 0 : Math.sin(Waves.t * 3 + this.x) * 0.02;
    m.root.position.set(ix, iy - 0.3 + bob, iz);
    m.root.rotation.order = 'YXZ';
    m.root.rotation.set(this.pitch + po + wob, iyaw + yo, this.roll + ro + wob);
    // rider pose
    this.steerVis = damp(this.steerVis, this.ctl.steer, 9, dt);
    this.leanVis = damp(this.leanVis, this.ctl.lean, 8, dt);
    const t = m.torso;
    if (this.wipeT > 0) {
      m.rider.position.copy(this.riderOff);
      m.rider.rotation.x += this.riderSpin * dt; m.rider.rotation.z += this.riderSpin * 0.4 * dt;
    } else {
      m.rider.position.lerp(_v3a.set(0, 0, 0), 1 - Math.exp(-12 * dt));
      m.rider.rotation.x = damp(m.rider.rotation.x, 0, 12, dt); m.rider.rotation.z = damp(m.rider.rotation.z, 0, 12, dt);
      const crouch = this.boosting ? 0.5 : 0;
      t.rotation.set(0.25 + this.leanVis * 0.35 + crouch * 0.5, 0, -this.steerVis * 0.38 - (this.drifting ? this.driftDir * 0.2 : 0));
      t.position.set(0, 1.0 - crouch * 0.12, -0.5 + crouch * 0.2);
      if (this.trick) { t.rotation.x = 0.7; }
    }
    m.armL.visible = m.armR.visible = true;
    if (m.flame) { m.flame.visible = this.boosting; if (this.boosting) m.flame.scale.set(1, 0.8 + Math.random() * 0.6, 1); }
    m.root.visible = true;
    // ---- particles ----
    const sp = Math.abs(this.sf);
    const pools = this.world.pools;
    if (!air && sp > 5 && this.wipeT <= 0) {
      this.acc.spray += sp * dt * 2.4;
      const fx = Math.sin(iyaw), fz = Math.cos(iyaw);
      while (this.acc.spray >= 1) {
        this.acc.spray -= 1;
        const side = Math.random() < 0.5 ? -1 : 1;
        const sx = ix - fx * 1.8 - fz * side * 0.7, sz = iz - fz * 1.8 + fx * side * 0.7;
        pools.spray.emit(sx, this.surfH + 0.1, sz, -fx * sp * 0.25 - fz * side * 2 + (Math.random() - 0.5) * 2, 3.5 + Math.random() * 3 + sp * 0.06, -fz * sp * 0.25 + fx * side * 2 + (Math.random() - 0.5) * 2, 0.45 + Math.random() * 0.4, 0.38, 0.06, 15);
      }
      // rooster tail on boost
      if (this.boosting) {
        for (let i = 0; i < 2; i++) pools.blue.emit(ix - fx * 2.5, iy + 0.1, iz - fz * 2.5, -fx * 12 + (Math.random() - 0.5) * 2, 1 + Math.random() * 2, -fz * 12 + (Math.random() - 0.5) * 2, 0.3, 0.45, 0.05, 2);
      }
      this.acc.wake += dt;
      if (this.acc.wake > 0.09) {
        this.acc.wake = 0;
        pools.foam.emit(ix - fx * 2.2, this.surfH + 0.07, iz - fz * 2.2, 0, 0, 0, 1.6, 0.9 + sp * 0.02, 2.4 + sp * 0.05, 0);
      }
      // bow spray
      if (sp > 14 && Math.random() < dt * 24) {
        const side = Math.random() < 0.5 ? -1 : 1;
        pools.spray.emit(ix + fx * 1.8 - fz * side * 0.5, this.surfH + 0.1, iz + fz * 1.8 + fx * side * 0.5, -fz * side * 3 + fx * sp * 0.2, 3 + Math.random() * 2, fx * side * 3 + fz * sp * 0.2, 0.4, 0.28, 0.05, 15);
      }
      if (this.drifting && this.driftT > 0.5) {
        const col = this.driftT > 1.3 ? pools.spark : pools.blue;
        col.emit(ix - fx * 1.7, iy - 0.1, iz - fz * 1.7, (Math.random() - 0.5) * 5, 2 + Math.random() * 3, (Math.random() - 0.5) * 5, 0.35, 0.3, 0.03, 18);
      }
    }
    if (this.wipeT > 0 && Math.random() < dt * 30) pools.spray.emit(ix, this.surfH + 0.2, iz, (Math.random() - 0.5) * 6, 4 + Math.random() * 4, (Math.random() - 0.5) * 6, 0.6, 0.45, 0.06, 15);
    // ---- audio ----
    if (this.engine && camPos) {
      const dx = this.x - camPos.x, dz = this.z - camPos.z, d = Math.hypot(dx, dz);
      const vol = this.isPlayer ? 1 : clamp(1 - d / 160, 0, 1) * 0.9;
      const pan = this.isPlayer ? 0 : clamp((dx * camRight.x + dz * camRight.z) / Math.max(10, d), -1, 1);
      Audio.updateEngine(this.engine, clamp(sp / 45, 0, 1.4), this.wipeT > 0 ? 0 : this.ctl.throttle, vol, pan, this.boosting, air);
    }
  }

  destroy() {
    if (this.engine) Audio.killEngine(this.engine);
    this.engine = null;
    this.world.scene.remove(this.m.root);
  }
}

/* ------------------------------------------------------------------ *
 *  CAMERA RIG + AI + RACE / STUNT / TIME-TRIAL / ATTRACT LOGIC
 * ------------------------------------------------------------------ */
class CamRig {
  constructor() {
    this.cam = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.3, 4000);
    this.mode = 0; this.yaw = 0; this.fov = 64; this.shake = 0; this.pos = new THREE.Vector3(); this.look = new THREE.Vector3();
    this.inited = false; this.bank = 0; this.shot = 0; this.shotT = 0;
    this.right = new THREE.Vector3(1, 0, 0);
  }
  resize() { this.cam.aspect = innerWidth / innerHeight; this.cam.updateProjectionMatrix(); }
  kick(a) { this.shake = Math.min(1.5, this.shake + a); }
  /** chase camera behind a craft */
  chase(craft, dt, world, alpha, lookBack) {
    const ix = lerp(craft.px, craft.x, alpha), iz = lerp(craft.pz, craft.z, alpha), iy = lerp(craft.py, craft.y, alpha);
    const sp = Math.hypot(craft.sf, craft.sl);
    const velAng = sp > 5 ? Math.atan2(craft.sf * Math.sin(craft.yaw) + craft.sl * -Math.cos(craft.yaw), craft.sf * Math.cos(craft.yaw) + craft.sl * Math.sin(craft.yaw)) : craft.yaw;
    const target = craft.yaw + 0.45 * wrapAng(velAng - craft.yaw) + (lookBack ? Math.PI : 0);
    if (!this.inited) { this.yaw = target; this.pos.set(ix, iy + 4, iz); this.inited = true; }
    this.yaw = dampAng(this.yaw, target, lookBack ? 9 : 3.4, dt);
    const D = [9.2, 14, 4.4][this.mode] * Save.s.camDist, H = [3.5, 5.4, 1.7][this.mode];
    const air = craft.air > 0.12 ? 1 : 0;
    const dx = Math.sin(this.yaw), dz = Math.cos(this.yaw);
    const tx = ix - dx * D, tz = iz - dz * D;
    const baseY = Math.max(iy, craft.surfH) + H + air * 0.8;
    this.pos.x = damp(this.pos.x, tx, 8.5, dt); this.pos.z = damp(this.pos.z, tz, 8.5, dt);
    this.pos.y = damp(this.pos.y, baseY, 4.5, dt);
    const minY = Waves.h(this.pos.x, this.pos.z) + 1.1;
    if (this.pos.y < minY) this.pos.y = minY;
    this.look.set(ix + dx * 6, Math.max(iy, craft.surfH) + 1.4 + air * 0.4, iz + dz * 6);
    const boostK = craft.boosting ? 9 : 0;
    this.fov = damp(this.fov, 62 + clamp(sp / 48, 0, 1.2) * 15 + boostK, 3, dt);
    this.bank = damp(this.bank, -craft.tilt * 0.03, 3, dt);
    this.apply(dt);
  }
  apply(dt) {
    const c = this.cam;
    this.shake = Math.max(0, this.shake - dt * 2.4);
    const s = this.shake * 0.35 * Save.s.shake;
    c.position.set(this.pos.x + (Math.random() - 0.5) * s, this.pos.y + (Math.random() - 0.5) * s, this.pos.z + (Math.random() - 0.5) * s);
    c.up.set(Math.sin(this.bank), Math.cos(this.bank), 0);
    c.lookAt(this.look);
    if (Math.abs(c.fov - this.fov) > 0.01) { c.fov = this.fov; c.updateProjectionMatrix(); }
    this.right.set(Math.cos(this.yaw), 0, -Math.sin(this.yaw));
    c.updateMatrixWorld();
  }
  orbit(center, t, r, h, dt) {
    this.pos.set(center.x + Math.cos(t) * r, h, center.z + Math.sin(t) * r);
    this.look.set(center.x, center.y + 1.5, center.z);
    this.fov = damp(this.fov, 56, 3, dt || 0.016); this.bank = 0;
    this.apply(dt || 0.016);
  }
}

/* ----------------------------- AI driver ---------------------------- */
function aiControl(craft, race, dt) {
  const ai = craft.ai, tr = race.track, c = craft.ctl;
  c.spin = c.flip = c.roll = false;
  if (!tr) return stuntAI(craft, race, dt);
  const L = tr.L, nB = tr.buoys.length;
  const bs = (k) => Math.floor(k / nB) * L + tr.buoys[k % nB].s;
  const sp = Math.max(8, craft.sf);
  ai.t += dt;
  // choose buoy line (with occasional mistakes by skill)
  const nb = craft.nextBuoy;
  if (ai.lastNB !== nb) {
    ai.lastNB = nb;
    ai.miss = Math.random() > ai.skill + 0.08 && !ai.cheat;
    ai.margin = 2.6 + (1 - ai.skill) * 4 + Math.random() * 1;
  }
  const b = tr.buoys[nb % nB];
  const distB = bs(nb) - craft.prog;
  const side = b.red ? 1 : -1;
  let want = b.lat + side * ai.margin * (ai.miss ? -1 : 1);
  // ramps: head for them if this driver is a show-off
  if (ai.ramps) {
    for (const r of tr.ramps) {
      let dr = r.s - craft.s; if (dr < -L / 2) dr += L; if (dr > L / 2) dr -= L;
      if (dr > 6 && dr < 120) { want = lerp(want, 0, clamp(1 - (dr - 6) / 114, 0.15, 1) * 0.92); }
      if (dr > -4 && dr <= 6) want = 0;
    }
  }
  // pads
  if (ai.pads) {
    for (const p of tr.pads) {
      let dp = p.s - craft.s; if (dp < -L / 2) dp += L; if (dp > L / 2) dp -= L;
      if (dp > 5 && dp < 60) want = lerp(want, p.lat, 0.5);
    }
  }
  // obstacles
  for (const o of tr.obstacles) {
    let d = o.s - craft.s; if (d < -L / 2) d += L; if (d > L / 2) d -= L;
    if (d > 2 && d < 24 + sp * 0.8 && Math.abs(want - o.lat) < o.r + 7) want = o.lat + (want >= o.lat ? 1 : -1) * (o.r + 8);
  }
  want += Math.sin(ai.t * 0.7 + ai.seed) * (1 - ai.skill) * 7;
  const lim = tr.hw - 7;
  want = clamp(want, -lim, lim);
  const look = clamp(8 + sp * 0.4, 14, 26);
  const q = tr.at(craft.s + look, ai.q || (ai.q = {}));
  const px = q.x + q.nx * want, pz = q.z + q.nz * want;
  const err = wrapAng(Math.atan2(px - craft.x, pz - craft.z) - craft.yaw);
  c.steer = clamp(-err * 2.4, -1, 1);
  c.throttle = 1; c.brake = 0;
  const curv = Math.abs(tr.curv[craft.hint >= 0 ? craft.hint : 0] || 0);
  if (curv > 0.011 && craft.sf > 30 && !craft.boosting) c.throttle = 0.88;
  c.boost = craft.boostMeter > (ai.cheat ? 0 : 38) && Math.abs(err) < 0.2 && craft.air < 0.1;
  if (ai.cheat) craft.boostMeter = 100;
  c.drift = ai.skill > 0.74 && Math.abs(err) > 0.42 && craft.sf > 22 && craft.air < 0.1;
  c.lean = craft.air > 0.2 ? clamp(-craft.pitch * 2.5, -1, 1) : 0;
  // tricks off jumps
  if (ai.cheat) craft.invuln = Math.max(craft.invuln, 1);
  if (craft.air > 0.2 && !craft.trick && craft.y - craft.surfH > 1.2 && craft.airLeft() > 0.85 && (ai.cheat || Math.random() < dt * 5 * ai.skill)) {
    const k = Math.floor(Math.random() * 3);
    if (k === 0) c.spin = true; else if (k === 1) c.flip = true; else c.roll = true;
  }
  if (craft.sf < 1.5 && craft.wipeT <= 0) { ai.stuck += dt; if (ai.stuck > 2.5) { race.respawn(craft); ai.stuck = 0; } } else ai.stuck = 0;
}

function stuntAI(craft, race, dt) {
  const ai = craft.ai, c = craft.ctl;
  ai.t += dt;
  const ang = Math.atan2(craft.z, craft.x);
  const rad = Math.hypot(craft.x, craft.z);
  const R = 120 + Math.sin(ai.t * 0.15) * 2;
  const la = 0.16 + craft.sf * 0.0035;
  const px = R * Math.cos(ang + la), pz = R * Math.sin(ang + la);
  const err = wrapAng(Math.atan2(px - craft.x, pz - craft.z) - craft.yaw);
  c.steer = clamp(-err * 2.6, -1, 1); c.throttle = 1; c.brake = 0;
  c.boost = craft.boostMeter > 30 && craft.air < 0.1 && Math.abs(err) < 0.25;
  if (ai.cheat) craft.boostMeter = 100;
  c.drift = false; c.lean = 0;
  void rad;
  if (ai.cheat) craft.invuln = Math.max(craft.invuln, 1);
  if (craft.air > 0.2 && !craft.trick && craft.y - craft.surfH > 1.2 && craft.airLeft() > 0.85) {
    const k = Math.floor(Math.random() * 3);
    if (k === 0) c.spin = true; else if (k === 1) c.flip = true; else c.roll = true;
  }
  if (craft.sf < 1.5 && craft.wipeT <= 0) { ai.stuck += dt; if (ai.stuck > 2) { race.respawn(craft); ai.stuck = 0; } } else ai.stuck = 0;
}

/* ------------------------------ RACE ------------------------------ */
class Race {
  /**
   * opts: { course, mode: 'champ'|'tt'|'stunt'|'attract'|'showroom', riderIdx, diff, grid, onDone }
   */
  constructor(opts) {
    this.opts = opts;
    this.def = opts.course; this.mode = opts.mode;
    this.world = new World(this.def);
    this.track = this.world.track; this.stunt = this.world.stunt;
    this.rig = new CamRig();
    this.crafts = []; this.player = null;
    this.state = opts.mode === 'attract' ? 'racing' : 'intro';
    this.t = 0; this.stateT = 0; this.raceT = 0; this.acc = 0;
    this.paused = false; this.laps = this.def.laps; this.diff = opts.diff || DIFFICULTIES[1];
    this.hud = { feed: [], msg: null, msgT: 0, wrongT: 0, lastLapMsg: 0 };
    this.cdSeen = -1; this.finishT = 0; this.results = null; this.ghostRec = []; this.ghostT = 0; this.ghost = null;
    this.stuntTime = this.def.time || 0; this.pending = 0; this.stuntScore = 0; this.bestCombo = 0;
    this.camShot = 0; this.shotT = 0; this.throttleHeldSince = -1; this.rocket = false; this.rocketMsg = false;
    this.setup();
    Music.play(this.def.music, 1);
  }

  setup() {
    const o = this.opts, tr = this.track;
    const rider = PLAYABLE[o.riderIdx || 0];
    const pool = RIDERS.filter((r) => r !== rider);
    const nAI = this.mode === 'tt' || this.mode === 'stunt' ? 0 : (this.mode === 'attract' && this.def.type === 'stunt' ? 0 : 5);
    const n = 1 + nAI;
    // grid order: player slot
    const slot = this.mode === 'champ' ? clamp(o.gridSlot != null ? o.gridSlot : 4, 0, n - 1) : 0;
    const slots = [];
    for (let i = 0; i < n; i++) slots.push(i);
    const total = n;
    for (let i = 0; i < total; i++) {
      const isPlayer = i === slot;
      const r = isPlayer ? rider : pool[(i - (i > slot ? 1 : 0)) % pool.length];
      let x = 0, z = 0, yaw = 0;
      if (tr) {
        const gs = -10 - Math.floor(i / 2) * 11, lat = (i % 2 ? 1 : -1) * tr.hw * 0.32;
        const q = tr.at(gs, {});
        x = q.x + q.nx * lat; z = q.z + q.nz * lat; yaw = Math.atan2(q.tx, q.tz);
      } else {
        const a = (i / total) * TAU + 0.3;
        x = 120 * Math.cos(a); z = 120 * Math.sin(a); yaw = -a;
        if (this.mode === 'stunt' || isPlayer) { const a0 = -0.42; x = 120 * Math.cos(a0); z = 120 * Math.sin(a0); yaw = -a0; }
      }
      const c = new Craft(this.world, r, { isPlayer, x, z, yaw });
      c.placeAt(x, z, yaw);
      c.onEvent = (cr, type, data) => this.onCraftEvent(cr, type, data);
      c.index = i;
      if (tr) {
        c.hint = -1; const pr = tr.project(c.x, c.z, -1, {});
        c.s = pr.s; c.lastS = pr.s; c.hint = pr.i; c.lapBase = -tr.L; c.prog = c.lapBase + pr.s;
        c.nextBuoy = 0;
      }
      if (!isPlayer || this.mode === 'attract') {
        c.ai = { skill: this.diff.skill * (0.9 + Math.random() * 0.14), t: Math.random() * 10, seed: Math.random() * 6, stuck: 0, ramps: Math.random() < 0.65, pads: true, cheat: false, miss: false };
        if (this.mode === 'attract') { c.ai.skill = 1; c.ai.cheat = isPlayer; c.ai.ramps = true; }
      }
      if (isPlayer) { this.player = c; c.name = this.mode === 'attract' ? c.name : 'YOU'; }
      this.crafts.push(c);
    }
    // stunt: single player in the arena
    if (this.stunt && !this.player) { this.player = this.crafts[0]; }
    if (this.mode === 'attract' && this.def.type === 'stunt') {
      this.player.ai = { skill: 1, t: 0, seed: 1, stuck: 0, ramps: true, pads: true, cheat: true };
    }
    this.player.isHuman = !this.player.ai;
    // ghost (time trial)
    if (this.mode === 'tt') {
      const g = Save.data.ghost[this.def.id];
      if (g && g.length > 10) {
        const gm = buildCraftModel(PLAYABLE[(Save.data.ghostRider && Save.data.ghostRider[this.def.id]) || 0] || PLAYABLE[0], true);
        this.world.scene.add(gm.root);
        this.ghost = { data: g, m: gm };
      }
    }
    // initial camera
    if (this.state === 'intro') this.rig.inited = false;
    this.rig.chase(this.player, 0.016, this.world, 1, false);
    // positions
    this.updateRanks();
  }

  respawn(craft) {
    const tr = this.track;
    if (!tr) { craft.placeAt(120, 0, Math.PI / 2 * 0); craft.ai && (craft.ai.stuck = 0); return; }
    const pr = tr.project(craft.x, craft.z, -1, {});
    const q = tr.at(pr.s, {});
    const lat = clamp(craft.lat, -tr.hw * 0.5, tr.hw * 0.5) * 0.5;
    craft.placeAt(q.x + q.nx * lat, q.z + q.nz * lat, Math.atan2(q.tx, q.tz));
    craft.hint = pr.i; craft.wipeT = 0; craft.invuln = 2; craft.trick = null; craft.power = Math.max(1, craft.power);
    craft.sf = 0; craft.sl = 0;
  }

  /* ------------------------- events -------------------------- */
  say(text, cls = '', t = 1.4) { this.hud.msg = { text, cls }; this.hud.msgT = t; }
  feed(text, cls = '') { this.hud.feed.unshift({ text, cls, t: 2.6 }); if (this.hud.feed.length > 4) this.hud.feed.pop(); }

  onCraftEvent(cr, type, data) {
    const me = cr === this.player && this.mode !== 'attract';
    const near = me || (this.mode === 'attract' && cr === this.player);
    switch (type) {
      case 'wipe':
        if (near) { Audio.sfx('wipe'); Input.rumble(1, 0.8, 380); this.rig.kick(1.2); this.say(data === 'botch' ? 'BAD LANDING!' : 'WIPEOUT!', 'bad', 1.5); this.pending = 0; }
        break;
      case 'bump': if (near) { Audio.sfx('bump'); Input.rumble(0.5, 0.3, 120); this.rig.kick(0.4); } break;
      case 'land':
        if (near && data.impact > 6) { Audio.sfx('land', data.impact / 14); Input.rumble(0.4 + data.impact * 0.02, 0.5, 140); this.rig.kick(data.impact * 0.04); }
        if (me && this.mode === 'stunt' && cr.wipeT <= 0 && this.pending > 0) {
          const air = data.air >= 0.9 ? Math.round(data.air * 80) : 0;
          const tot = this.pending + air; this.stuntScore += tot; cr.score = this.stuntScore;
          this.say(`+${tot}${air ? '  BIG AIR' : ''}`, 'good', 1.4); this.pending = 0;
        }
        break;
      case 'trick':
        if (near) {
          Audio.sfx('trick');
          const mult = Math.min(8, 1 + 0.5 * (data.chain - 1));
          if (this.mode === 'stunt') { const pts = Math.round(data.trick.pts * mult * (1 + 0.04 * cr.stats.trk)); this.pending += pts; this.bestCombo = Math.max(this.bestCombo, mult); this.say(`${data.trick.name}  +${pts}  x${mult.toFixed(1)}`, 'trick', 1.3); }
          else this.say(`${data.trick.name}!  +BOOST`, 'trick', 1.2);
        }
        break;
      case 'trickstart': if (near) Audio.sfx('spin'); break;
      case 'boost': if (near) { Audio.sfx('boost'); this.rig.kick(0.5); Input.rumble(0.3, 0.8, 200); } break;
      case 'driftboost': if (near) { Audio.sfx('boost'); this.say('DRIFT BOOST', 'good', 0.9); Input.rumble(0.4, 0.6, 160); } break;
      case 'driftstart': break;
      case 'buoy':
        if (near) {
          if (data.ok) { Audio.sfx(data.perfect ? 'perfect' : 'buoy'); this.feed(data.perfect ? 'PERFECT BUOY' : 'BUOY', data.perfect ? 'perfect' : 'ok'); Input.rumble(0.1, 0.4, 90); }
          else { Audio.sfx('miss'); this.say('MISSED BUOY', 'bad', 1.0); this.feed('MISSED  POWER DOWN', 'bad'); Input.rumble(0.6, 0.2, 200); }
        }
        break;
      case 'pad': if (near) { Audio.sfx('pad'); this.rig.kick(0.6); this.say('BOOST PAD', 'good', 0.8); } break;
      case 'hoop': if (near) { Audio.sfx('hoop'); this.say(`HOOP  +${data}`, 'good', 1.2); } break;
      default: break;
    }
  }

  /* ----------------------- fixed-step simulation ----------------------- */
  fixedStep(h) {
    const tr = this.track, racing = this.state === 'racing' || this.state === 'finish';
    for (const c of this.crafts) {
      if (!c.ai) {
        if (!racing) { c.ctl.throttle = 0; c.ctl.brake = 0; c.ctl.boost = false; c.ctl.drift = false; c.ctl.steer = 0; }
        else if (this.state === 'finish') this.autoDrive(c, h);
      } else if (!racing) { c.ctl.throttle = 0; c.ctl.boost = false; c.ctl.steer = 0; c.ctl.drift = false; }
      else if (!c.finished || this.state === 'racing') aiControl(c, this, h);
      else this.autoDrive(c, h);
      c.preStep(h);
    }
    this.world.rw.step();
    // post
    for (const c of this.crafts) {
      if (tr) {
        const pr = tr.project(c.x, c.z, c.hint, tr._tmp);
        c.hint = pr.i; c.lat = pr.lat;
        let ds = pr.s - c.lastS;
        if (ds < -tr.L / 2) c.lapBase += tr.L; else if (ds > tr.L / 2) c.lapBase -= tr.L;
        c.lastS = pr.s; c.s = pr.s; c.prog = c.lapBase + pr.s;
        // keep inside the lane even if physics tunnels
        if (Math.abs(c.lat) > tr.hw + 4) {
          const qq = tr.at(pr.s, {});
          const lat = Math.sign(c.lat) * (tr.hw - 3);
          c.body.setTranslation({ x: qq.x + qq.nx * lat, y: c.y, z: qq.z + qq.nz * lat }, true);
          c.sl = 0;
        }
        if (racing) this.trackLogic(c);
      } else {
        const r = Math.hypot(c.x, c.z);
        if (r > this.stunt.arenaR - 2) {
          const k = (this.stunt.arenaR - 6) / r; c.body.setTranslation({ x: c.x * k, y: c.y, z: c.z * k }, true);
        }
        if (this.state === 'racing' && this.stunt) this.stuntLogic(c, h);
      }
      this.padLogic(c, h);
    }
  }

  autoDrive(c, h) {
    const tr = this.track; if (!tr) { c.ctl.throttle = 0; c.ctl.brake = 0.6; return; }
    const q = tr.at(c.s + 24, {});
    const err = wrapAng(Math.atan2(q.x - c.x, q.z - c.z) - c.yaw);
    c.ctl.steer = clamp(-err * 2.2, -1, 1); c.ctl.throttle = 0.35; c.ctl.boost = false; c.ctl.brake = 0; c.ctl.drift = false;
    void h;
  }

  padLogic(c, h) {
    const w = this.world;
    c.padCool = Math.max(0, (c.padCool || 0) - h);
    if (c.padCool > 0 || c.air > 0.12) return;
    for (const p of w.pads) {
      const dx = c.x - p.x, dz = c.z - p.z;
      const u = dx * p.s_ + dz * p.c_, v = dx * p.c_ - dz * p.s_;
      if (Math.abs(u) < p.len / 2 && Math.abs(v) < p.w / 2) {
        c.boostT = Math.max(c.boostT, 1.6); c.padCool = 1.2;
        c.emit('pad');
        for (let i = 0; i < 18; i++) w.pools.blue.emit(c.x, c.y, c.z, (Math.random() - 0.5) * 8, 2 + Math.random() * 4, (Math.random() - 0.5) * 8, 0.6, 0.5, 0.05, 6);
        break;
      }
    }
  }

  trackLogic(c) {
    const tr = this.track, L = tr.L, nB = tr.buoys.length, total = this.laps * nB;
    // buoys
    let guard = 0;
    while (c.nextBuoy < total && guard++ < 4) {
      const b = tr.buoys[c.nextBuoy % nB];
      const bsU = Math.floor(c.nextBuoy / nB) * L + b.s;
      if (c.prog < bsU) break;
      const d = c.lat - b.lat;
      const ok = b.red ? d > 1.2 : d < -1.2;
      const perfect = ok && Math.abs(d) < 4.2;
      if (ok) { c.power = Math.min(5, c.power + 1); c.buoyHit++; c.boostMeter = Math.min(100, c.boostMeter + (perfect ? 11 : 5)); if (perfect) c.perfects++; }
      else { c.power = Math.max(1, c.power - 1); c.buoyMiss++; }
      c.emit('buoy', { ok, perfect, buoy: b });
      c.nextBuoy++;
    }
    // laps
    const lapIdx = Math.floor(c.prog / L); // 0 = first lap running
    if (lapIdx > (c.lapIdx == null ? -1 : c.lapIdx) && lapIdx >= 0) {
      const prev = c.lapIdx == null ? -1 : c.lapIdx;
      c.lapIdx = lapIdx;
      if (lapIdx >= 1 && lapIdx < this.laps && prev >= 0 && lapIdx > prev) {
        const lt = this.raceT - c.lapStart; c.lapTimes.push(lt); c.lapStart = this.raceT;
        if (c === this.player) { Audio.sfx('lap'); this.say(`LAP ${lapIdx + 1} / ${this.laps}${this.laps - lapIdx === 1 ? '  FINAL LAP' : ''}`, 'good', 1.8); }
      }
    }
    if (!c.finished && c.prog >= this.laps * L) {
      c.finished = true; c.finishTime = this.raceT;
      c.lapTimes.push(this.raceT - c.lapStart);
      if (c === this.player) this.onPlayerFinish();
    }
  }

  stuntLogic(c, h) {
    void h;
    const hoops = this.stunt.hoops;
    c.hoopSide = c.hoopSide || [];
    for (let i = 0; i < hoops.length; i++) {
      const hp = hoops[i];
      if (hp.cool > 0) { hp.cool -= h; if (hp.cool <= 0) hp.done = false; }
      const dx = c.x - hp.x, dz = c.z - hp.z;
      const side = dx * hp.tx + dz * hp.tz;
      const prev = c.hoopSide[i];
      c.hoopSide[i] = side;
      if (prev !== undefined && prev < 0 && side >= 0 && !hp.done) {
        const v = dx * hp.tz - dz * hp.tx, dy = c.y - hp.y;
        if (Math.hypot(v, dy) < hp.r + 0.6) {
          hp.done = true; hp.cool = 14;
          const pts = 250;
          if (c === this.player) { this.stuntScore += pts; c.score = this.stuntScore; c.boostMeter = Math.min(100, c.boostMeter + 20); }
          c.emit('hoop', pts);
          for (let k = 0; k < 24; k++) this.world.pools.pink.emit(hp.x, hp.y, hp.z, (Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12, 0.9, 0.5, 0.05, 6);
        }
      }
    }
  }

  onPlayerFinish() {
    const p = this.player;
    this.state = 'finish'; this.stateT = 0;
    this.updateRanks();
    this.say(p.place === 1 ? 'FINISH!  1st PLACE' : `FINISH!  ${ordinal(p.place)}`, 'good', 3);
    Audio.sfx(p.place <= 3 ? 'fanfare' : 'sad');
    Input.rumble(0.4, 0.6, 400);
    if (this.mode === 'tt') this.saveGhost();
  }

  saveGhost() {
    const best = Save.data.best[this.def.id] || {};
    const t = this.player.finishTime;
    if (!best.tt || t < best.tt) {
      best.tt = t; Save.data.ghost[this.def.id] = this.ghostRec.slice(); Save.data.ghostRider = Save.data.ghostRider || {}; Save.data.ghostRider[this.def.id] = this.opts.riderIdx || 0;
      this.newRecord = true;
    }
    const bl = Math.min(...this.player.lapTimes);
    if (!best.lap || bl < best.lap) { best.lap = bl; this.newLap = true; }
    Save.data.best[this.def.id] = best; Save.commit();
  }

  updateRanks() {
    if (!this.track) return;
    const arr = this.crafts.slice().sort((a, b) => (a.finished && b.finished) ? a.finishTime - b.finishTime : a.finished ? -1 : b.finished ? 1 : b.prog - a.prog);
    arr.forEach((c, i) => { c.place = i + 1; });
    this.ordered = arr;
  }

  /* ---------------------------- per frame ---------------------------- */
  update(dt) {
    if (this.paused) return;
    this.t += dt; this.stateT += dt;
    const P = this.player;
    // player input into controls
    if (!P.ai) {
      const c = P.ctl;
      c.steer = Input.steer; c.lean = Input.lean;
      c.throttle = Input.throttle; c.brake = Input.brake;
      c.boost = Input.down('boost'); c.drift = Input.down('drift');
      if (Input.pressed('spin')) c.spin = true; if (Input.pressed('flip')) c.flip = true; if (Input.pressed('roll')) c.roll = true;
      // right stick flicks also trigger tricks
      if (P.air > 0.2 && !P.trick) {
        if (Input.rx > 0.7 || Input.rx < -0.7) c.spin = true; else if (Input.ry < -0.7 || Input.ry > 0.7) c.flip = true;
      }
      if (Input.pressed('cam')) { this.rig.mode = (this.rig.mode + 1) % 3; Audio.sfx('tick'); this.say(['CHASE CAM', 'FAR CAM', 'LOW CAM'][this.rig.mode], 'info', 0.9); }
      // reset hold (circle on ground)
      if (Input.down('reset') && P.air < 0.1 && this.state === 'racing' && this.track) { this.resetHold = (this.resetHold || 0) + dt; if (this.resetHold > 0.9) { this.respawn(P); this.resetHold = 0; } } else this.resetHold = 0;
      // rocket start timing
      if (this.state === 'countdown') {
        if (c.throttle > 0.7) { if (this.throttleHeldSince < 0) this.throttleHeldSince = this.stateT; } else this.throttleHeldSince = -1;
      }
    }
    // state machine
    if (this.state === 'intro') {
      if (this.stateT > 5.2 || (Input.pressed('confirm') && this.stateT > 0.6 && P.isHuman)) { this.setState('countdown'); }
    } else if (this.state === 'countdown') {
      const n = 3 - Math.floor(this.stateT / 1.0);
      if (n !== this.cdSeen && this.stateT < 3.0) { this.cdSeen = n; Audio.sfx('count'); this.say(String(n), 'count', 0.9); }
      if (this.stateT >= 3.0) {
        Audio.sfx('go'); this.say('GO!', 'go', 1.0);
        // rocket start: throttle pressed during the last 0.75s but not before 2.0s
        if (this.throttleHeldSince > 2.1 && this.throttleHeldSince < 2.95) { P.boostT = 1.4; this.say('ROCKET START!', 'good', 1.4); Input.rumble(0.5, 0.8, 300); }
        else if (this.throttleHeldSince >= 0 && this.throttleHeldSince <= 2.1) { this.say('ENGINE FLOOD', 'bad', 1.0); P.sf = 0; }
        this.setState('racing');
      }
    } else if (this.state === 'racing') {
      this.raceT += dt;
      if (this.mode === 'stunt') {
        this.stuntTime -= dt;
        if (this.stuntTime <= 0) { this.stuntTime = 0; this.endStunt(); }
      }
      if (this.mode === 'tt' || this.mode === 'champ') {
        this.ghostT += dt;
        if (this.ghostT >= 0.1) { this.ghostT = 0; this.ghostRec.push([Math.round(P.x * 10) / 10, Math.round(P.y * 10) / 10, Math.round(P.z * 10) / 10, Math.round(P.yaw * 100) / 100]); }
      }
      // wrong-way detection
      if (this.track && !P.ai) {
        const tr = this.track, i = P.hint >= 0 ? P.hint : 0;
        const fwd = P.sf * (Math.sin(P.yaw) * tr.tx[i] + Math.cos(P.yaw) * tr.tz[i]);
        if (fwd < -3) this.hud.wrongT += dt; else this.hud.wrongT = Math.max(0, this.hud.wrongT - dt * 2);
      }
    } else if (this.state === 'finish') {
      this.raceT += this.mode === 'tt' ? 0 : 0;
      if (this.stateT > 3.6 && !this.results) this.finishRace();
    }
    // physics accumulator
    this.acc += dt;
    let steps = 0;
    while (this.acc >= 1 / 60 && steps < 6) { this.fixedStep(1 / 60); this.acc -= 1 / 60; steps++; }
    if (steps >= 6) this.acc = 0;
    const alpha = clamp(this.acc * 60, 0, 1);
    if (this.mode === 'champ' || this.mode === 'attract') this.rubberBand();
    this.updateRanks();
    // visuals
    const camPos = this.rig.cam.position;
    for (const c of this.crafts) c.visual(alpha, dt, camPos, this.rig.right);
    this.updateGhost(alpha);
    // camera
    this.updateCamera(dt, alpha);
    this.world.update(dt, { x: P.x, z: P.z }, this.rig.cam);
    // audio beds
    const sp = Math.hypot(P.sf, P.sl);
    Audio.updateWater(clamp(sp / 45, 0, 1.3), P.air > 0.12);
    // hud timers
    if (this.hud.msgT > 0) this.hud.msgT -= dt;
    for (const f of this.hud.feed) f.t -= dt;
    this.hud.feed = this.hud.feed.filter((f) => f.t > 0);
    // attract clip lifetime
    if (this.mode === 'attract' && this.t > (this.opts.clipLen || 26) && this.opts.onDone) { const f = this.opts.onDone; this.opts.onDone = null; f(); }
  }

  setState(s) { this.state = s; this.stateT = 0; }

  rubberBand() {
    if (!this.track) return;
    const P = this.player, d = this.diff;
    for (const c of this.crafts) {
      if (!c.ai || c === P) continue;
      const gap = c.prog - P.prog; // + => ahead of player
      let k = d.speed;
      if (gap > 40) k *= 1 - clamp((gap - 40) / 400, 0, 1) * d.rubber * 2.5;
      else if (gap < -20) k *= 1 + clamp((-gap - 20) / 300, 0, 1) * d.rubber * 2.2;
      c.speedScale = k * (0.985 + 0.03 * Math.sin(this.t * 0.3 + c.index));
    }
  }

  updateGhost(alpha) {
    void alpha;
    if (!this.ghost) return;
    const g = this.ghost, i = Math.floor(this.raceT / 0.1), f = (this.raceT / 0.1) - i;
    const a = g.data[Math.min(i, g.data.length - 1)], b = g.data[Math.min(i + 1, g.data.length - 1)];
    if (!a || this.state === 'intro' || this.state === 'countdown') { g.m.root.visible = this.state !== 'intro'; if (this.state === 'countdown') { /* park at the start */ } }
    if (!a) return;
    g.m.root.visible = this.state === 'racing' || this.state === 'finish';
    g.m.root.position.set(lerp(a[0], b[0], f), lerp(a[1], b[1], f) - 0.3, lerp(a[2], b[2], f));
    g.m.root.rotation.set(0, a[3] + wrapAng(b[3] - a[3]) * f, 0);
  }

  updateCamera(dt, alpha) {
    const P = this.player, rig = this.rig;
    if (this.state === 'intro') {
      const u = this.stateT / 5.2;
      const ang = lerp(2.2, 4.2, u) + P.yaw * 0;
      const base = { x: P.x, y: P.y, z: P.z };
      // swoop around the start line, finishing behind the player
      const behind = P.yaw + Math.PI;
      const a = behind + lerp(1.8, 0, u * u * (3 - 2 * u)) * 1;
      rig.pos.set(base.x + Math.sin(a) * lerp(60, 10, u), lerp(26, 5, u), base.z + Math.cos(a) * lerp(60, 10, u));
      rig.look.set(base.x, base.y + 1.5, base.z);
      rig.fov = damp(rig.fov, 58, 3, dt); rig.bank = 0;
      rig.apply(dt);
      void ang;
      rig.yaw = P.yaw; rig.inited = true;
    } else if (this.mode === 'attract') {
      this.shotT += dt;
      if (this.shotT > 6.5) { this.shotT = 0; this.camShot = (this.camShot + 1) % 4; }
      const ix = P.x, iz = P.z, iy = P.y;
      if (this.camShot === 0) { rig.mode = 0; rig.chase(P, dt, this.world, alpha, false); }
      else if (this.camShot === 1) { rig.mode = 1; rig.chase(P, dt, this.world, alpha, false); }
      else if (this.camShot === 2) {
        const a = P.yaw - 1.2;
        rig.pos.set(damp(rig.pos.x, ix + Math.sin(a) * 12, 6, dt), damp(rig.pos.y, iy + 2.4, 6, dt), damp(rig.pos.z, iz + Math.cos(a) * 12, 6, dt));
        rig.look.set(ix, iy + 1.2, iz); rig.fov = damp(rig.fov, 55, 3, dt); rig.bank = 0; rig.apply(dt);
        rig.yaw = P.yaw;
      } else {
        const a = P.yaw + 0.25;
        rig.pos.set(damp(rig.pos.x, ix + Math.sin(a) * 24 + Math.cos(P.yaw) * 6, 2.5, dt), damp(rig.pos.y, Math.max(iy, P.surfH) + 3.2, 4, dt), damp(rig.pos.z, iz + Math.cos(a) * 24 - Math.sin(P.yaw) * 6, 2.5, dt));
        rig.look.set(ix, iy + 1.2, iz); rig.fov = damp(rig.fov, 50, 3, dt); rig.bank = 0; rig.apply(dt);
        rig.yaw = P.yaw;
      }
      if (this.camShot < 2) rig.mode = this.camShot;
    } else if (this.state === 'finish' && this.stateT > 0.8) {
      rig.orbit({ x: P.x, y: P.y, z: P.z }, this.stateT * 0.5, 14, P.y + 4, dt);
    } else {
      rig.chase(P, dt, this.world, alpha, !P.ai && Input.down('look'));
    }
  }

  endStunt() {
    if (this.results) return;
    const sc = this.stuntScore, med = this.def.medals;
    const medal = sc >= med[2] ? 3 : sc >= med[1] ? 2 : sc >= med[0] ? 1 : 0;
    const prev = Save.data.stunt[this.def.id] || 0;
    if (sc > prev) { Save.data.stunt[this.def.id] = sc; Save.commit(); }
    this.results = { type: 'stunt', score: sc, medal, best: Math.max(prev, sc), newBest: sc > prev, tricks: this.player.tricksDone, combo: this.bestCombo, medals: med };
    this.state = 'finish'; this.stateT = 0;
    Audio.sfx(medal ? 'fanfare' : 'sad');
    this.say('TIME UP!', 'good', 2.5);
    this.finishT = 0;
  }

  finishRace() {
    this.updateRanks();
    const rows = this.ordered.map((c) => ({ name: c.name, rider: c.rider, place: c.place, time: c.finished ? c.finishTime : null, prog: c.prog, isPlayer: c === this.player, best: c.lapTimes.length ? Math.min(...c.lapTimes) : null }));
    // un-finished racers get a projected time for display ordering only
    this.results = { type: this.mode, rows, player: this.player, place: this.player.place, hit: this.player.buoyHit, miss: this.player.buoyMiss, perfect: this.player.perfects, tricks: this.player.tricksDone, top: this.player.topSpeed, time: this.player.finishTime, laps: this.player.lapTimes, newRecord: this.newRecord, newLap: this.newLap, best: Save.data.best[this.def.id] };
  }

  /** Called by UI when the stunt state needs ending early or by timers */
  get stuntDone() { return this.mode === 'stunt' && this.state === 'finish' && this.stateT > 2.8; }

  dispose() {
    for (const c of this.crafts) c.destroy();
    this.world.dispose();
  }
}

const HUD = {
  root: null, race: null, el: {}, mini: null, miniBase: null, last: {},
  build(race) {
    this.destroy();

    r.id = 'hud';
    r.innerHTML = `
      <div class="hud-tl ${stunt ? 'hidden' : ''}"><div class="pos"><b id="h-pos">1</b><sup id="h-posx">st</sup><span id="h-posn">/6</span></div><div class="lap" id="h-lap">LAP 1 / 3</div></div>
      <div class="hud-tr ${stunt ? 'hidden' : ''}"><div class="time" id="h-time">0:00.000</div><div class="lapt" id="h-lapt"></div></div>
      <div class="hud-top ${stunt ? '' : 'hidden'}"><div class="score" id="h-score">0</div><div class="stime" id="h-stime">2:00</div><div class="pend" id="h-pend"></div></div>
      <div class="hud-buoy ${stunt ? 'hidden' : ''}" id="h-buoy"></div>
      <div class="hud-br">
        <div class="speed"><b id="h-speed">0</b><i id="h-unit">km/h</i></div>
        <div class="boost"><div class="fill" id="h-boost"></div><span>BOOST</span></div>
        <div class="power" id="h-power"><span>POWER</span><u></u><u></u><u></u><u></u><u></u></div>
      </div>
      <canvas class="hud-mini ${stunt ? 'hidden' : ''}" id="h-mini" width="320" height="320"></canvas>
      <div class="hud-msg" id="h-msg"></div>
      <div class="hud-feed" id="h-feed"></div>
      <div class="hud-wrong" id="h-wrong">WRONG WAY</div>
      <div class="hud-hint" id="h-hint"></div>
      <div class="hud-reset" id="h-reset"><i></i><span>RESPAWN</span></div>`;
    $('#app').appendChild(r);
    this.root = r;
    for (const id of ['pos', 'posx', 'posn', 'lap', 'time', 'lapt', 'score', 'stime', 'pend', 'buoy', 'speed', 'unit', 'boost', 'power', 'msg', 'feed', 'wrong', 'hint', 'reset', 'mini']) this.el[id] = $('#h-' + id, r);
    this.last = {};
    if (race.track) this.drawMiniBase(race.track);
    this.mini = this.el.mini.getContext('2d');
    if (!Save.s.hud) r.classList.add('minimal');
  },
  destroy() { if (this.root) this.root.remove(); this.root = null; this.race = null; this.el = {}; },
  set(id, v, prop = 'textContent') { if (this.last[id] !== v) { this.last[id] = v; this.el[id][prop] = v; } },
  drawMiniBase(tr) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 320;
    const g = cv.getContext('2d'), b = tr.bbox;
    const sc = 270 / Math.max(b.maxx - b.minx, b.maxz - b.minz);
    this.miniT = { sc, ox: 160 - ((b.minx + b.maxx) / 2) * sc, oz: 160 - ((b.minz + b.maxz) / 2) * sc };
    g.lineCap = 'round'; g.lineJoin = 'round';
    const path = () => { g.beginPath(); for (let i = 0; i <= tr.M; i += 2) { const k = i % tr.M; const x = tr.px[k] * sc + this.miniT.ox, z = tr.pz[k] * sc + this.miniT.oz; if (i === 0) g.moveTo(x, z); else g.lineTo(x, z); } g.closePath(); };
    g.strokeStyle = '#0d1b33'; g.lineWidth = 26; path(); g.stroke();
    g.strokeStyle = '#7fe8ff'; g.lineWidth = 15; path(); g.stroke();
    // start line
    const sx = tr.px[0] * sc + this.miniT.ox, sz = tr.pz[0] * sc + this.miniT.oz;
    g.fillStyle = '#fff'; g.beginPath(); g.arc(sx, sz, 8, 0, TAU); g.fill();
    g.strokeStyle = '#0d1b33'; g.lineWidth = 3; g.stroke();
    this.miniBase = cv;
  },
  update(race) {
    if (!this.root) return;
    const P = race.player, e = this.el, stunt = race.mode === 'stunt';
    // speed
    const kmh = Math.round(Math.hypot(P.sf, P.sl) * (Save.s.units === 'mph' ? 2.237 : 3.6) * 1.0);
    this.set('speed', String(kmh)); this.set('unit', Save.s.units === 'mph' ? 'mph' : 'km/h');
    this.set('boost', Math.round(P.boostMeter) + '%', 'title');
    const bw = P.boostMeter.toFixed(0);
    if (this.last.bw !== bw) { this.last.bw = bw; e.boost.style.width = bw + '%'; }
    e.boost.parentNode.classList.toggle('active', P.boosting);
    const pw = P.power;
    if (this.last.pw !== pw) { this.last.pw = pw; [...e.power.querySelectorAll('u')].forEach((u, i) => u.classList.toggle('on', i < pw)); }
    // message
    const m = race.hud.msg;
    if (m && race.hud.msgT > 0) { this.set('msg', m.text); if (this.last.mc !== m.cls) { this.last.mc = m.cls; e.msg.className = 'hud-msg ' + m.cls; } e.msg.style.opacity = Math.min(1, race.hud.msgT * 3); }
    else { e.msg.style.opacity = 0; }
    if (this.last.feed !== race.hud.feed.map((f) => f.text).join('|')) {
      this.last.feed = race.hud.feed.map((f) => f.text).join('|');
      e.feed.innerHTML = race.hud.feed.map((f) => `<div class="${f.cls}">${f.text}</div>`).join('');
    }
    e.wrong.classList.toggle('on', race.hud.wrongT > 1.2);
    const rh = race.resetHold || 0;
    e.reset.classList.toggle('on', rh > 0.05); e.reset.firstChild.style.width = Math.min(100, rh / 0.9 * 100) + '%';
    // contextual hint
    let hint = '';
    if (race.state === 'racing') {
      if (P.air > 0.25 && !P.trick && P.y - P.surfH > 1.2 && P.airLeft() > 0.5) hint = `${Input.label('spin')} ${Input.label('flip')} ${Input.label('roll')}  TRICK`;
      else if (P.boostMeter > 40 && !P.boosting && race.t < 25 + (race.hintBoost || 0)) hint = `${Input.label('boost')}  BOOST`;
      else if (P.sf < 2 && P.wipeT <= 0 && race.raceT > 6 && race.track) hint = `HOLD ${Input.label('reset')}  RESPAWN`;
    }
    this.set('hint', hint);
    if (stunt) {
      this.set('score', race.stuntScore.toLocaleString());
      const t = Math.max(0, race.stuntTime);
      this.set('stime', `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`);
      this.set('pend', race.pending > 0 ? `+${race.pending}` : '');
      e.stime.classList.toggle('low', t < 15);
    } else {
      const total = race.crafts.length;
      const pl = P.place || 1;
      this.set('pos', String(pl)); this.set('posx', ['', 'st', 'nd', 'rd'][pl] || 'th'); this.set('posn', race.mode === 'tt' ? '' : '/' + total);
      const lap = clamp((P.lapIdx == null ? 0 : P.lapIdx) + 1, 1, race.laps);
      this.set('lap', `LAP ${lap} / ${race.laps}`);
      this.set('time', race.mode === 'attract' ? '' : fmtTime(race.state === 'finish' ? P.finishTime || race.raceT : race.raceT));
      const best = Save.data.best[race.def.id];
      this.set('lapt', race.mode === 'tt' && best && best.tt ? 'BEST ' + fmtTime(best.tt) : P.lapTimes.length ? 'LAST LAP ' + fmtTime(P.lapTimes[P.lapTimes.length - 1]) : '');
      this.updateBuoyHint(race);
      this.drawMini(race);
    }
  },
  updateBuoyHint(race) {
    const P = race.player, tr = race.track, e = this.el;
    const total = race.laps * tr.buoys.length;
    for (const b of race.world.beacon) b.visible = false;
    if (P.nextBuoy >= total || race.state === 'intro') { e.buoy.classList.remove('on'); return; }
    const nB = tr.buoys.length, b = tr.buoys[P.nextBuoy % nB];
    const dist = Math.hypot(b.x - P.x, b.z - P.z);
    const side = b.red ? 'RIGHT' : 'LEFT';
    this.set('buoy', `<i class="dot ${b.red ? 'red' : 'yel'}"></i><b>${b.red ? '' : '◀ '}PASS ${side}${b.red ? ' ▶' : ''}</b><em>${Math.round(dist)} m</em>`, 'innerHTML');
    e.buoy.classList.add('on');
    const bc = race.world.beacon[b.red ? 0 : 1];
    bc.visible = dist < 180; bc.position.set(b.x, Waves.h(b.x, b.z), b.z);
    const sc = 1 + 0.12 * Math.sin(race.t * 6); bc.scale.set(sc, 1, sc);
  },
  drawMini(race) {
    const g = this.mini, T = this.miniT; if (!g) return;
    g.clearRect(0, 0, 320, 320);
    g.drawImage(this.miniBase, 0, 0);
    const draw = (c, r, col) => { g.beginPath(); g.arc(c.x * T.sc + T.ox, c.z * T.sc + T.oz, r, 0, TAU); g.fillStyle = col; g.fill(); g.lineWidth = 3; g.strokeStyle = '#0d1b33'; g.stroke(); };
    for (const c of race.crafts) if (c !== race.player) draw(c, 8, '#' + c.rider.color.toString(16).padStart(6, '0'));
    draw(race.player, 12, '#ffffff');
    // direction wedge
    const P = race.player;
    g.save(); g.translate(P.x * T.sc + T.ox, P.z * T.sc + T.oz); g.rotate(-P.yaw);
    g.fillStyle = '#ffd23f'; g.strokeStyle = '#0d1b33'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, 20); g.lineTo(-8, 10); g.lineTo(8, 10); g.closePath(); g.fill(); g.stroke(); g.restore();
  },
};

/* Generic vertical menu ------------------------------------------------ */
function menuScreen(spec) {
  let idx = spec.start || 0;
  let el, list, items = spec.items;
  const enabled = (i) => !items[i].disabled;
  const valText = (it) => {
    if (it.type === 'choice') { const o = it.options.find((x) => x[0] === it.get()); return `<span class="chev">◀</span> ${o ? o[1] : ''} <span class="chev">▶</span>`; }
    if (it.type === 'toggle') return it.get() ? 'ON' : 'OFF';
    if (it.type === 'slider') { const v = it.get(); return `<span class="bar"><i style="width:${((v - it.min) / (it.max - it.min)) * 100}%"></i></span><em>${it.fmt ? it.fmt(v) : Math.round(v * 100)}</em>`; }
    return it.value || '';
  };
  const render = () => {
    list.innerHTML = items.map((it, i) => `<li data-i="${i}" class="${i === idx ? 'sel' : ''} ${it.disabled ? 'dis' : ''} ${it.type || 'btn'}"><span class="lbl">${it.label}</span><span class="val">${valText(it)}</span></li>`).join('');
    const desc = $('.desc', el);
    if (desc) desc.innerHTML = items[idx].desc || '';
    const sel = list.children[idx];
    if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
    list.querySelectorAll('li').forEach((li) => {
      const i = +li.dataset.i;
      li.onmouseenter = () => { if (Input.mouseMovedFrame || true) { if (idx !== i && enabled(i)) { idx = i; Audio.sfx('move'); render(); } } };
      li.onclick = (e) => {
        if (!enabled(i)) return;
        idx = i;
        const it = items[i];
        if (it.type === 'slider') {
          const bar = li.querySelector('.bar');
          if (bar && e.target.closest('.bar')) { const r = bar.getBoundingClientRect(); it.set(clamp(it.min + ((e.clientX - r.left) / r.width) * (it.max - it.min), it.min, it.max)); Audio.sfx('tick'); render(); return; }
        }
        activate();
      };
    });
  };
  const adjust = (d) => {
    const it = items[idx];
    if (it.type === 'slider') { it.set(clamp(+(it.get() + d * (it.step || 0.05)).toFixed(3), it.min, it.max)); Audio.sfx('tick'); render(); }
    else if (it.type === 'choice') { const o = it.options, k = o.findIndex((x) => x[0] === it.get()); it.set(o[(k + d + o.length) % o.length][0]); Audio.sfx('tick'); render(); }
    else if (it.type === 'toggle') { it.set(!it.get()); Audio.sfx('tick'); render(); }
  };
  const activate = () => {
    const it = items[idx];
    if (it.disabled) return;
    if (it.type === 'toggle' || it.type === 'choice') { adjust(1); return; }
    if (it.type === 'slider') return;
    Audio.sfx('confirm');
    if (it.action) it.action();
  };
  const footer = () => kHint([[Input.label('confirm'), 'Select'], ...(spec.onBack ? [[Input.label('back'), 'Back']] : []), ['◀ ▶', 'Adjust']]);
  return {
    name: spec.name,
    mount(root) {
      el = document.createElement('div');
      el.className = 'screen menu ' + (spec.cls || '');
      el.innerHTML = `${spec.logo ? '<div class="logo"><h1>JET SKI<br><b>JUBILEE</b></h1><p>A SPIRITUAL SUCCESSOR TO THE WAVE-RIDING CLASSICS</p></div>' : ''}
        <div class="panel"><h2>${spec.title || ''}</h2>${spec.sub ? `<p class="sub">${spec.sub}</p>` : ''}<ul class="list"></ul>${spec.desc !== false ? '<div class="desc"></div>' : ''}</div>
        <div class="footer"></div>${spec.extra || ''}`;
      root.appendChild(el);
      list = $('.list', el);
      render();
      this.lastLabel = '';
      if (spec.onMount) spec.onMount(el);
    },
    update(dt) {
      if (Input.nav('up')) { let k = idx; do { k = (k - 1 + items.length) % items.length; } while (!enabled(k) && k !== idx); if (k !== idx) { idx = k; Audio.sfx('move'); render(); } }
      if (Input.nav('down')) { let k = idx; do { k = (k + 1) % items.length; } while (!enabled(k) && k !== idx); if (k !== idx) { idx = k; Audio.sfx('move'); render(); } }
      if (Input.nav('left')) adjust(-1);
      if (Input.nav('right')) adjust(1);
      if (Input.pressed('confirm')) activate();
      if (Input.pressed('back') && spec.onBack) { Audio.sfx('back'); spec.onBack(); }
      const f = $('.footer', el), lab = footer();
      if (f && this.lastLabel !== lab) { this.lastLabel = lab; f.innerHTML = lab; }
      if (spec.onUpdate) spec.onUpdate(dt, el);
    },
    destroy() { if (spec.onDestroy) spec.onDestroy(); },
  };
}

/* Carousel (riders, courses, how-to pages) -------------------------- */
function carouselScreen(spec) {
  let idx = spec.start || 0, el, body;
  const n = spec.count;
  const render = () => {
    body.innerHTML = spec.render(idx);
    $('.dots', el).innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join('');
    if (spec.after) spec.after(el, idx);
    if (spec.onChange) spec.onChange(idx);
  };
  const move = (d) => { idx = (idx + d + n) % n; Audio.sfx('move'); render(); };
  return {
    name: spec.name,
    mount(root) {
      el = document.createElement('div');
      el.className = 'screen carousel ' + (spec.cls || '');
      el.innerHTML = `<div class="ctitle">${spec.title}</div><button class="arrow l">◀</button><div class="cbody"></div><button class="arrow r">▶</button><div class="dots"></div><div class="footer"></div>`;
      root.appendChild(el);
      body = $('.cbody', el);
      $('.arrow.l', el).onclick = () => move(-1);
      $('.arrow.r', el).onclick = () => move(1);
      body.onclick = () => { if (spec.confirm && spec.mouseConfirm !== false) { Audio.sfx('confirm'); spec.confirm(idx); } };
      render();
      if (spec.onMount) spec.onMount(el);
    },
    update(dt) {
      if (Input.nav('left') || Input.pressed('tabL')) move(-1);
      if (Input.nav('right') || Input.pressed('tabR')) move(1);
      if (Input.pressed('confirm') && spec.confirm) { Audio.sfx('confirm'); spec.confirm(idx); }
      if (Input.pressed('back')) { Audio.sfx('back'); spec.back(); }
      const f = $('.footer', el);
      const lab = kHint([['◀ ▶', spec.moveLabel || 'Choose'], ...(spec.confirm ? [[Input.label('confirm'), spec.confirmLabel || 'Select']] : []), [Input.label('back'), 'Back']]);
      if (f && this.lastLabel !== lab) { this.lastLabel = lab; f.innerHTML = lab; }
      if (spec.onUpdate) spec.onUpdate(dt, el, idx);
    },
    destroy() { if (spec.onDestroy) spec.onDestroy(); },
  };
}

      if (thumbCache[def.id]) return thumbCache[def.id];
      const cv = document.createElement('canvas'); cv.width = cv.height = 280; const g = cv.getContext('2d');
      g.fillStyle = 'rgba(8,20,44,0.0)'; g.fillRect(0, 0, 280, 280);
      if (def.type === 'race') {
        const tr = new Track(def), b = tr.bbox, sc = 230 / Math.max(b.maxx - b.minx, b.maxz - b.minz);
        const ox = 140 - ((b.minx + b.maxx) / 2) * sc, oz = 140 - ((b.minz + b.maxz) / 2) * sc;
        const path = () => { g.beginPath(); for (let i = 0; i <= tr.M; i += 2) { const k = i % tr.M; const x = tr.px[k] * sc + ox, z = tr.pz[k] * sc + oz; if (i === 0) g.moveTo(x, z); else g.lineTo(x, z); } g.closePath(); };
        g.lineJoin = 'round'; g.strokeStyle = '#0d1b33'; g.lineWidth = 22; path(); g.stroke();
        g.strokeStyle = '#ffd23f'; g.lineWidth = 12; path(); g.stroke();
        for (const r of tr.ramps) { g.fillStyle = '#ff5a5f'; g.beginPath(); g.arc(r.x * sc + ox, r.z * sc + oz, 6, 0, TAU); g.fill(); }
        g.fillStyle = '#fff'; g.beginPath(); g.arc(tr.px[0] * sc + ox, tr.pz[0] * sc + oz, 9, 0, TAU); g.fill(); g.strokeStyle = '#0d1b33'; g.lineWidth = 3; g.stroke();
      } else {
        g.strokeStyle = '#0d1b33'; g.lineWidth = 8; g.fillStyle = '#7fe8ff'; g.beginPath(); g.arc(140, 140, 120, 0, TAU); g.fill(); g.stroke();
        g.fillStyle = '#ffe9a8'; g.beginPath(); g.arc(140, 140, 22, 0, TAU); g.fill(); g.stroke();
        const lay = buildStuntLayout();
        for (const r of lay.ramps) { g.fillStyle = '#ff5a5f'; g.beginPath(); g.arc(r.x * 0.46 + 140, r.z * 0.46 + 140, 5, 0, TAU); g.fill(); }
        for (const h of lay.hoops) { g.strokeStyle = '#ff4fd8'; g.lineWidth = 3; g.beginPath(); g.arc(h.x * 0.46 + 140, h.z * 0.46 + 140, 5, 0, TAU); g.stroke(); }

/* Results screens are menu-based so they get proper list navigation. */
function resultsMenu(race, champ, items) {
  const base = Screens.raceResults(race, champ);
  let el;
  const sel = { i: 0 };
  return {
    name: 'results',
    mount(root) { base.mount(root); el = root.firstChild; this.render(); },
    render() {
      const list = $('.list', el);
      list.innerHTML = items.map((it, i) => `<li data-i="${i}" class="${i === sel.i ? 'sel' : ''}"><span class="lbl">${it.label}</span></li>`).join('');
      list.querySelectorAll('li').forEach((li) => { const i = +li.dataset.i; li.onmouseenter = () => { sel.i = i; this.render(); }; li.onclick = () => { sel.i = i; Audio.sfx('confirm'); items[i].action(); }; });
    },
    update() {
      if (Input.nav('up')) { sel.i = (sel.i - 1 + items.length) % items.length; Audio.sfx('move'); this.render(); }
      if (Input.nav('down')) { sel.i = (sel.i + 1) % items.length; Audio.sfx('move'); this.render(); }
      if (Input.pressed('confirm')) { Audio.sfx('confirm'); items[sel.i].action(); }
      $('.footer', el).innerHTML = kHint([[Input.label('confirm'), 'Select']]);
    },
  };
}
