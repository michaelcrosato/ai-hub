  const sel = { i: 0 };
  return {
    name: 'results',
    mount(root) {
      el = document.createElement('div'); el.className = 'screen results stunt';
      const medals = ['', '🥉 BRONZE', '🥈 SILVER', '🥇 GOLD'];
      el.innerHTML = `<div class="panel wide"><h2>${r.medal ? medals[r.medal] : 'TIME UP'}</h2><p class="sub">${race.def.name}</p>
        <div class="bigtime">${r.score.toLocaleString()}</div>${r.newBest ? '<div class="newrec">★ NEW BEST ★</div>' : `<div class="bests"><span>BEST <b>${r.best.toLocaleString()}</b></span></div>`}
        <div class="medalbar">${r.medals.map((m, i) => `<span class="${r.score >= m ? 'on' : ''}">${['🥉', '🥈', '🥇'][i]} ${m.toLocaleString()}</span>`).join('')}</div>
        <div class="chips"><span>TRICKS <b>${r.tricks}</b></span><span>BEST COMBO <b>x${r.combo.toFixed(1)}</b></span></div>
        <ul class="list small"></ul></div><div class="footer"></div>`;
      root.appendChild(el); this.render();
    },
    render() {
      const list = $('.list', el);
      list.innerHTML = items.map((it, i) => `<li data-i="${i}" class="${i === sel.i ? 'sel' : ''}"><span class="lbl">${it.label}</span></li>`).join('');
      list.querySelectorAll('li').forEach((li) => { const i = +li.dataset.i; li.onmouseenter = () => { sel.i = i; this.render(); }; li.onclick = () => { sel.i = i; Audio.sfx('confirm'); items[i].action(); }; });
    },
    update() {
      if (Input.nav('up') || Input.nav('down')) { sel.i = 1 - sel.i; Audio.sfx('move'); this.render(); }
      if (Input.pressed('confirm')) { Audio.sfx('confirm'); items[sel.i].action(); }
      $('.footer', el).innerHTML = kHint([[Input.label('confirm'), 'Select']]);
    },
  };
}

function standingsScreen(champ, final) {
  let el;
  const sel = { i: 0 };
  const table = champ.table();
  const items = final
    ? [{ label: 'Back to Title', action: () => Game.quitToTitle() }]
    : [{ label: `Next: ${RACE_COURSES[champ.idx].name}`, action: () => Game.startChampRace() }, { label: 'Quit to Title', action: () => Game.quitToTitle() }];
  return {
    name: final ? 'champ-final' : 'standings',
    mount(root) {
      el = document.createElement('div'); el.className = 'screen results standings';
      const me = table.findIndex((r) => r.isPlayer) + 1;
      const head = final ? (me === 1 ? '🏆 CHAMPION!' : me <= 3 ? 'ON THE PODIUM' : 'CUP COMPLETE') : 'STANDINGS';
      el.innerHTML = `<div class="panel wide"><h2>${head}</h2><p class="sub">${final ? `${champ.diff.name} cup · you finished ${ordinal(me)}` : `After race ${champ.idx} of ${RACE_COURSES.length}`}</p>
        <table class="rtable">${table.map((r, i) => `<tr class="${r.isPlayer ? 'me' : ''}"><td class="pl">${i + 1}</td><td><i class="chip" style="background:${hex6(r.rider.color)}"></i>${r.isPlayer ? 'YOU (' + r.rider.name + ')' : r.rider.name}</td><td class="pt">${r.pts} pts</td></tr>`).join('')}</table>
        <ul class="list small"></ul></div><div class="footer"></div>`;
      root.appendChild(el); this.render();
    },
    render() {
      const list = $('.list', el);
      list.innerHTML = items.map((it, i) => `<li data-i="${i}" class="${i === sel.i ? 'sel' : ''}"><span class="lbl">${it.label}</span></li>`).join('');
      list.querySelectorAll('li').forEach((li) => { const i = +li.dataset.i; li.onmouseenter = () => { sel.i = i; this.render(); }; li.onclick = () => { sel.i = i; Audio.sfx('confirm'); items[i].action(); }; });
    },
    update() {
      if (items.length > 1 && (Input.nav('up') || Input.nav('down'))) { sel.i = 1 - sel.i; Audio.sfx('move'); this.render(); }
      if (Input.pressed('confirm')) { Audio.sfx('confirm'); items[sel.i].action(); }
      $('.footer', el).innerHTML = kHint([[Input.label('confirm'), 'Select']]);
    },
  };
}

/* ------------------------------------------------------------------ *
 *  GAME: renderer, showroom, flows, championship, attract mode, loop
 * ------------------------------------------------------------------ */
class Showroom {
  constructor() {
    this.def = COURSE_BY_ID.coral;
    this.world = new World(this.def);
    this.rig = new CamRig();
    this.acc = 0; this.t = 0; this.craft = null;
    const tr = this.world.track, q = tr.at(tr.L * 0.18, {});
    this.pos = { x: q.x + q.nx * 6, z: q.z + q.nz * 6, yaw: Math.atan2(q.tx, q.tz) };
    this.setRider(Save.data.rider || 0);
  }
  setRider(i) {
    if (this.craft) this.craft.destroy();
    this.craft = new Craft(this.world, PLAYABLE[i], { isPlayer: true, x: this.pos.x, z: this.pos.z });
    Audio.killEngine(this.craft.engine); this.craft.engine = null;
    this.craft.placeAt(this.pos.x, this.pos.z, this.pos.yaw);
    this.craft.ctl.throttle = 0;
  }
  update(dt) {
    this.t += dt; this.acc += dt;
    let n = 0;
    while (this.acc >= 1 / 60 && n++ < 5) { this.craft.preStep(1 / 60); this.world.rw.step(); this.acc -= 1 / 60; }
    this.craft.visual(clamp(this.acc * 60, 0, 1), dt, this.rig.cam.position, this.rig.right);
    // slow orbit with the craft framed on the right of screen
    const c = this.craft, a = this.t * 0.18 + 0.9, r = 11;
    const cx = c.x, cz = c.z;
    this.rig.pos.set(cx + Math.sin(a) * r, c.surfH + 3.2, cz + Math.cos(a) * r);
    // shift look target to the left of the craft so it lands on the right half of the screen
    const rx = Math.cos(a), rz = -Math.sin(a);
    this.rig.look.set(cx - rx * 3.4, c.surfH + 1.2, cz - rz * 3.4);
    this.rig.fov = 50; this.rig.bank = 0; this.rig.yaw = a + Math.PI; this.rig.right.set(rx, 0, rz);
    this.rig.apply(dt);
    this.world.update(dt, { x: cx, z: cz }, this.rig.cam);
  }
}

class Champ {
  constructor(riderIdx, diff) {
    this.rider = riderIdx; this.diff = diff; this.idx = 0; this.rank = 5; this.pts = {};
    const pr = PLAYABLE[riderIdx];
    this.riders = [pr, ...RIDERS.filter((r) => r !== pr).slice(0, 5)];
    for (const r of this.riders) this.pts[r.id] = 0;
  }
  addResult(rows) {
    for (const row of rows) this.pts[row.rider.id] += POINTS[row.place - 1] || 0;
    this.idx++;
    this.rank = this.table().findIndex((r) => r.isPlayer) + 1;
  }
  table() {
    return this.riders.map((r, i) => ({ rider: r, pts: this.pts[r.id], isPlayer: i === 0 })).sort((a, b) => b.pts - a.pts);
  }
}

const Game = {
  mode: 'boot', renderer: null, race: null, showroom: null, champ: null, lastCourse: 0, helpReturn: null,
  attractIdx: 0, resultsShown: false, lastOpts: null, toastT: 0, needsSize: true, camActive: null,

  async init() {
    const app = $('#app');
    if (!navigator.gpu) return this.fatal('WebGPU is not available in this browser. Jet Ski Jubilee requires a WebGPU-capable browser (recent Chrome, Edge or Safari Technology Preview).');
    let adapter = null;
    try { adapter = await navigator.gpu.requestAdapter(); } catch (e) { adapter = null; }
    if (!adapter) return this.fatal('No WebGPU adapter was found. Update your graphics driver or browser, then reload.');
    await RAPIER.init();
    const canvas = $('#gl');
    this.renderer = new THREE.WebGPURenderer({ canvas, antialias: true, forceWebGL: false });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.renderer.setSize(innerWidth, innerHeight, false);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.toneMapping = THREE.NoToneMapping;
    await this.renderer.init();
    if (this.renderer.backend && this.renderer.backend.isWebGLBackend) return this.fatal('WebGPU initialisation failed (WebGL fallback is intentionally disabled).');
    UI.init();
    for (const ev of ['keydown', 'mousedown', 'touchstart', 'pointerdown']) window.addEventListener(ev, () => { if (Audio.ctx && Audio.ctx.state === 'suspended') Audio.ctx.resume().catch(() => {}); }, { passive: true });
    window.addEventListener('resize', () => this.resize());
    this.resize();
    // a clean placeholder scene for the boot screen
    this.bootScene = new THREE.Scene();
    this.bootScene.background = new THREE.Color(0x1aa6c8);
    this.bootCam = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    UI.reset(Screens.boot);
    JSJ.ready = true; JSJ.mode = 'boot';
    this.last = performance.now();
    this.renderer.setAnimationLoop(() => this.frame());
  },

  fatal(msg) {
    const f = $('#fatal'); f.style.display = 'flex'; f.querySelector('p').textContent = msg;
    JSJ.fatal = msg; JSJ.mode = 'fatal';
  },

  resize() {
    if (!this.renderer) return;
    this.renderer.setSize(innerWidth, innerHeight, false);
    if (this.bootCam) { this.bootCam.aspect = innerWidth / innerHeight; this.bootCam.updateProjectionMatrix(); }
    if (this.showroom) this.showroom.rig.resize();
    if (this.race) this.race.rig.resize();
  },

  toast(text) {
    const t = $('#toast'); t.textContent = text; t.classList.add('on'); this.toastT = 2.2;
  },

  /* ----------------------------- transitions ----------------------------- */
  fadeOut(ms = 260) { const f = $('#fade'); f.style.transitionDuration = ms + 'ms'; f.style.opacity = 1; return new Promise((r) => setTimeout(r, ms + 20)); },
  fadeIn(ms = 380) { const f = $('#fade'); f.style.transitionDuration = ms + 'ms'; f.style.opacity = 0; },

  onBootPress() {
    Audio.init();
    if (Audio.ok) Audio.sfx('confirm');
    this.goTitle(true);
  },
  openSettingsFromBoot() { Audio.init(); UI.show(Screens.settings(true)); },
  closeSettingsToBoot() { UI.reset(Screens.boot); },

  async goTitle(first) {
    this.mode = 'loading';
    if (!first) await this.fadeOut();
    this.disposeRace();
    if (!this.showroom) { this.showroom = new Showroom(); }
    this.showroom.rig.resize();
    this.mode = 'title';
    Music.play('menu', 0.9);
    UI.reset(Screens.title);
    Input.idle = 0;
    this.fadeIn();
  },

  disposeRace() {
    if (this.race) { this.race.dispose(); this.race = null; }
    HUD.destroy();
    const a = $('#attract'); if (a) a.classList.remove('on');
    Audio.silenceBeds();
    this.resultsShown = false;
  },

  showroomRider(i) { if (this.showroom && this.showroom.craft.rider !== PLAYABLE[i]) this.showroom.setRider(i); },

  /* ------------------------------- flows ------------------------------- */
  flowChampionship() {
    UI.go(() => Screens.rider((ri) => {
      UI.go(() => Screens.diff((d) => { this.champ = new Champ(ri, d); this.startChampRace(); }, () => UI.back()));
    }, () => UI.back()));
  },
  flowTimeTrial() {
    UI.go(() => Screens.rider((ri) => {
      UI.go(() => Screens.course(RACE_COURSES, (c) => this.startRace({ course: c, mode: 'tt', riderIdx: ri, diff: DIFFICULTIES[1] }), () => UI.back(), 'Time Trial — choose a course'));
    }, () => UI.back()));
  },
  flowStunt() {
    UI.go(() => Screens.rider((ri) => this.startRace({ course: COURSE_BY_ID.lagoon, mode: 'stunt', riderIdx: ri, diff: DIFFICULTIES[1] }), () => UI.back()));
  },

  startChampRace() {
    const c = this.champ;
    this.startRace({ course: RACE_COURSES[c.idx], mode: 'champ', riderIdx: c.rider, diff: c.diff, gridSlot: c.rank - 1, champ: true });
  },

  async startRace(opts) {
    if (!Save.data.seenHelp) {
      Save.data.seenHelp = true; Save.commit();
      this.helpReturn = () => { this.helpReturn = null; this.startRace(opts); };
      UI.go(Screens.howto);
      return;
    }
    this.lastOpts = opts;
    this.mode = 'loading';
    await this.fadeOut();
    UI.show(Screens.loading('Loading ' + opts.course.name));
    this.disposeRace();
    await new Promise((r) => setTimeout(r, 60));
    try {
      this.race = new Race(opts);
    } catch (e) {
      JSJ.errors.push('race build: ' + (e && e.stack || e));
      this.toast('Could not build course'); this.fadeIn(); return this.goTitle();
    }
    this.race.rig.resize();
    UI.clear();
    HUD.build(this.race);
    this.mode = 'race';
    this.resultsShown = false;
    Input.idle = 0;
    this.fadeIn();
    const hint = $('#introCard');
    hint.innerHTML = `<div class="ic-name">${opts.course.name}</div><div class="ic-sub">${opts.course.sub}</div>`;
    hint.classList.add('on'); setTimeout(() => hint.classList.remove('on'), 4200);
  },

  restartRace() {
    if (!this.lastOpts) return;
    const o = { ...this.lastOpts };
    UI.clear();
    this.startRace(o);
  },

  pause() {
    if (!this.race || this.mode !== 'race' || this.race.paused) return;
    this.race.paused = true; this.mode = 'pause';
    Audio.silenceBeds();
    UI.reset(() => Screens.pause(this.race));
  },
  resume() { if (!this.race) return; this.race.paused = false; this.mode = 'race'; UI.clear(); },

  async quitToTitle() {
    this.champ = null; this.helpReturn = null;
    UI.clear();
    await this.goTitle();
  },

  /* ----------------------------- results ----------------------------- */
  showResults() {
    const race = this.race, r = race.results;
    this.resultsShown = true; this.mode = 'results';
    HUD.destroy();
    Music.play('victory', 0.8);
    if (r.type === 'stunt') { UI.reset(() => stuntResults(race)); return; }
    if (race.mode === 'champ' && this.champ) {
      const champ = this.champ;
      champ.addResult(r.rows);
      const finalRace = champ.idx >= RACE_COURSES.length;
      if (finalRace) {
        const prev = Save.data.champ[champ.diff.id];
        if (!prev || champ.rank < prev) { Save.data.champ[champ.diff.id] = champ.rank; Save.commit(); }
      }
      UI.reset(() => resultsMenu(race, true, [
        { label: finalRace ? 'Final standings' : 'Standings', action: () => UI.reset(() => standingsScreen(champ, finalRace)) },
        { label: 'Quit to Title', action: () => this.quitToTitle() },
      ]));
      return;
    }
    UI.reset(() => resultsMenu(race, false, [
      { label: 'Retry', action: () => this.restartRace() },
      { label: 'Choose another course', action: async () => { await this.quitToTitle(); this.flowTimeTrial(); } },
      { label: 'Quit to Title', action: () => this.quitToTitle() },
    ]));
  },

  /* ----------------------------- attract mode ----------------------------- */
  ATTRACT: ['coral', 'lagoon', 'marina', 'glacier', 'storm'],
  async startAttract() {
    if (this.mode !== 'title') return;
    this.mode = 'loading';
    await this.fadeOut();
    UI.clear();
    this.attractIdx = this.attractIdx % this.ATTRACT.length;
    await this.nextAttractClip(true);
  },
  async nextAttractClip(first) {
    const id = this.ATTRACT[this.attractIdx++ % this.ATTRACT.length];
    const def = COURSE_BY_ID[id];
    if (!first) await this.fadeOut(300);
    if (this.mode !== 'attract' && !first) return;
    this.disposeRace();
    await new Promise((r) => setTimeout(r, 40));
    if (this.mode !== 'attract' && !first && this.mode !== 'loading') return;
    try {
      this.race = new Race({ course: def, mode: 'attract', riderIdx: Math.floor(Math.random() * 4), diff: DIFFICULTIES[3], clipLen: 24, onDone: () => this.nextAttractClip(false) });
    } catch (e) { JSJ.errors.push('attract build: ' + (e && e.stack || e)); this.mode = 'title'; this.fadeIn(); return this.goTitle(); }
    this.race.rig.resize();
    this.mode = 'attract'; Input.idle = 0; this.attractT = 0;
    $('#attract').classList.add('on');
    $('#attract .an').textContent = def.name;
    this.fadeIn(500);
  },
  exitAttract() {
    this.mode = 'loading';
    this.goTitle();
  },

  /* ------------------------------- frame ------------------------------- */
  frame() {
    const now = performance.now();
    const rawDt = Math.min(2, (now - this.last) / 1000);
    let dt = Math.min(0.05, rawDt);
    this.last = now;
    JSJ.frame++;
    try {
      Input.poll(rawDt);
      if (Audio.ctx) {
        const susp = Audio.ctx.state === 'suspended';
        if (susp) Audio.ctx.resume().catch(() => {});
        if (susp !== this.soundHint) { this.soundHint = susp; $('#sound').classList.toggle('on', susp); }
      }
      if (this.toastT > 0) { this.toastT -= dt; if (this.toastT <= 0) $('#toast').classList.remove('on'); }
      let scene = this.bootScene, cam = this.bootCam;
      const m = this.mode;
      if (m === 'title') {
        if (this.showroom) { this.showroom.update(dt); scene = this.showroom.world.scene; cam = this.showroom.rig.cam; }
        UI.update(dt);
        if (Input.idle > 10 && this.mode === 'title') this.startAttract();
      } else if (m === 'attract') {
        this.race.update(dt);
        scene = this.race.world.scene; cam = this.race.rig.cam;
        this.attractT = (this.attractT || 0) + dt;
        if (Input.anyThisFrame && this.attractT > 0.6) this.exitAttract();
      } else if (m === 'race' || m === 'results') {
        const race = this.race;
        if (race) {
          race.update(dt);
          scene = race.world.scene; cam = race.rig.cam;
          if (m === 'race') {
            HUD.update(race);
            if (Input.pressed('pause')) this.pause();
            if (race.results && !this.resultsShown && (race.mode !== 'stunt' || race.stuntDone)) this.showResults();
          }
        }
        if (m === 'results') UI.update(dt);
      } else if (m === 'pause') {
        const race = this.race;
        scene = race.world.scene; cam = race.rig.cam;
        UI.update(dt);
      } else if (m === 'loading') {
        if (this.showroom && !this.race) { scene = this.showroom.world.scene; cam = this.showroom.rig.cam; }
        else if (this.race) { scene = this.race.world.scene; cam = this.race.rig.cam; }
        UI.update(dt);
      } else if (m === 'boot') {
        UI.update(dt);
      }
      JSJ.mode = this.mode;
      if (this.race && this.race.player) {
        const p = this.race.player;
        JSJ.race = { state: this.race.state, mode: this.race.mode, course: this.race.def.id, t: +this.race.t.toFixed(1), speed: +Math.hypot(p.sf, p.sl).toFixed(1), prog: +p.prog.toFixed(1), place: p.place, power: p.power, x: +p.x.toFixed(1), z: +p.z.toFixed(1), tricks: p.tricksDone, boost: +p.boostMeter.toFixed(0), score: this.race.stuntScore, hits: p.buoyHit, miss: p.buoyMiss, lap: p.lapIdx };
      } else JSJ.race = null;
      this.renderer.render(scene, cam);
    } catch (e) {
      const msg = String(e && e.stack || e);
      if (JSJ.errors.length < 30) JSJ.errors.push('frame: ' + msg);
    }
  },
};
JSJ.api = Game; JSJ.input = Input;
Game.init().catch((e) => { JSJ.errors.push('init: ' + (e && e.stack || e)); Game.fatal('Startup error: ' + (e && e.message || e)); });

</script>
