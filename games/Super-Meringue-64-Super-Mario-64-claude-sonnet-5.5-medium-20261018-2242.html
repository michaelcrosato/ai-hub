          this.ui.banner("", "Cake Castle Grounds", "Find the Sugar Stars!", 3e3);
          this.ui.fade(false);
        });
      }
      beginPlay() {
        this.state = "play";
        this.player.frozen = false;
        this.cam.mode = "follow";
        this.cam.snapBehind(this.player);
        this.ui.showHud(true);
        this.input.virtual = this.cheat ? (r) => this.bot.make(r) : null;
        this.acc = 0;
        this.world.prompt = null;
        this.portalCool = 1.5;
        this.ui.showTitle(false);

      openCourse(id) {
        if (this.state !== "play") return;
        this.state = "select";
        this.audio.sfx("confirm");
        const def = LEVELS[id];
        const items = def.acts.map((a, i) => ({ label: (this.save.stars.has(id + "a" + (i + 1)) ? "\u2605 " : "\u2606 ") + "Act " + (i + 1) + ": " + a.name, desc: a.desc, action: () => {

          this.enterCourse(id, i + 1);

      cancelSelect() {

        p.vx = p.vz = 0;
      }
      enterCourse(id, act) {
        this.state = "transition";
        const def = LEVELS[id];
        this.ui.fade(true).then(() => {
          this.loadWorld(id, act);
          this.beginPlay();
          this.game.lives = Math.max(this.game.lives, 1);
          this.ui.banner(def.name, "Act " + act + ": " + def.acts[act - 1].name, def.acts[act - 1].desc, 4200);
          this.ui.fade(false);
          if (act === 3 && id !== "throne") this.ui.toast("Find the 8 red coins!");
        });
      }
      enterCastle() {
        if (this.state !== "play") return;
        this.state = "transition";
        this.audio.sfx("door");
        this.ui.fade(true).then(() => {
          this.loadWorld("castle", 1);
          this.beginPlay();
          this.ui.banner("Cake Castle", "The Lobby", "Pound the colored cap switches!", 3800);
          this.ui.fade(false);
        });
      }
      enterThrone() {
        if (this.state !== "play") return;
        this.state = "transition";
        this.audio.sfx("door");
        this.ui.fade(true).then(() => {
          this.loadWorld("throne", 1);
          this.beginPlay();
          this.ui.banner("The Throne Room", "King Meringue", "Grab his tail, spin, and throw him into a mine!", 4200);
          this.ui.fade(false);
        });
      }
      exitToHub(courseId) {
        this.state = "transition";
        this.ui.fade(true).then(() => {
          const x = PORTAL_X[courseId] ?? 0;
          this.loadWorld("hub", 1, { spawn: { x, y: 1, z: -20, yaw: 0 } });
          this.beginPlay();
          this.ui.fade(false);
        });
      }
      onStar(star) {
        const id = star.id, A = this;
        this.state = "cutscene";
        this.cutT = 0;
        this.starId = id;
        this.game.starTaken = true;
        const p = this.player;
        p.frozen = true;
        p.vx = p.vy = p.vz = 0;
        this.audio.sfx("star");
        this.ui.flash();
        this.audio.stop();
        p.yaw = this.cam.yaw;
        p.state = "ground";

        this.world.scene.add(this.starShow);
        this.cam.over = { pos: new THREE2.Vector3(p.pos.x + Math.sin(this.cam.yaw) * 6.5, p.pos.y + 1.6, p.pos.z + Math.cos(this.cam.yaw) * 6.5), look: new THREE2.Vector3(p.pos.x, p.pos.y + 1.6, p.pos.z), rate: 4, fov: 50 };
        const act = this.curDef.acts ? this.curDef.acts[this.game.act - 1] : null;
        const first = !this.save.stars.has(id);
        if (!this.cheat) {
          this.save.stars.add(id);
          this.writeSave();
        }
        this.ui.banner("Sugar Star!", id === "hub" ? "Ring Runner" : id === "castle" ? "Secret of the Castle" : id === "boss" ? "King Meringue is toppled!" : act ? act.name : "Star", (first ? "New star!  " : "") + this.save.stars.size + " collected", 3600);
      }
      finishCutscene() {
        const id = this.starId;
        this.world.scene.remove(this.starShow);
        this.cam.over = null;
        if (this.cheat) {
          this.attractNext();
          return;
        }
        if (id === "boss") {
          this.ending();
          return;
        }
        if (id === "hub") {
          this.player.frozen = false;
          this.state = "play";
          this.audio.play("hub");
          return;
        }
        this.exitToHub(this.game.course);
      }
      ending() {
        this.state = "ending";
        this.ui.fade(true).then(() => {
          this.audio.play("title");
          this.ui.showHud(false);
          const stars = this.save.stars.size;
          this.ui.openMenu({
            title: "Congratulations, Chef!",
            sub: "King Meringue has been toppled and the kingdom is sweet once more.",
            solid: true,
            cls: "about",
            items: [{ label: "Return to the title screen", action: () => {
              this.ui.closeMenu();
              this.ui.fade(true).then(() => {
                this.enterTitle();
                this.ui.fade(false);
              });
            } }],
            extra: `<div class="row"><b>Sugar Stars</b><span>${stars} collected</span></div><div class="row"><b>Thanks for playing</b><span>Super Meringue 64 - a Super Mario 64 inspired remaster demo.</span></div>`
          });
          this.ui.fade(false);
          this.state = "menu";
        });
      }
      onRedCoin(coin) {
        this.game.reds++;
        this.audio.sfx("redcoin", this.game.reds);
        this.ui.toast("Red candy " + this.game.reds + " / 8", 1500);
        if (this.game.reds >= 8 && this.world.actStarEnt && this.game.act === 3) this.world.actStarEnt.appear(this.world, new THREE2.Vector3(coin.pos.x, coin.pos.y + 1.5, coin.pos.z));
      }
      addCoins(n) {
        const g = this.game;
        g.coins += n;
        this.audio.sfx("coin");
        if (this.player.health < 8) this.player.health++;
        if (g.act === 4 && g.coins >= 100 && !g.hundred && this.world.actStarEnt) {
          g.hundred = true;
          const p = this.player, d = p.dir();
          this.world.actStarEnt.appear(this.world, new THREE2.Vector3(p.pos.x + d.x * 3, p.pos.y + 1.5, p.pos.z + d.z * 3));
          this.ui.toast("100 coins!");
        }
      }
      onPlayerDeath() {
        this.deathT = 0;
        this.state = "dying";
        if (!this.cheat) this.game.lives--;
        this.audio.stop();
      }
      onFall() {
        const p = this.player;
        if (p.dead || this.cheat) {
          if (this.cheat) {
            p.pos.copy(p.lastSafe);
            p.rb.setNextKinematicTranslation({ x: p.pos.x, y: p.pos.y + 1, z: p.pos.z });
            p.vx = p.vy = p.vz = 0;
          }
          return;
        }
        this.audio.sfx("fall");
        p.health = Math.max(0, p.health - 2);
        if (p.health <= 0) {
          p.die();
          return;
        }
        p.pos.copy(p.lastSafe);
        p.pos.y += 1;
        p.rb.setNextKinematicTranslation({ x: p.pos.x, y: p.pos.y, z: p.pos.z });
        p.vx = p.vy = p.vz = 0;
        p.setState("air");
        p.invuln = 2;
        p.coyote = 0;
        this.ui.pulseHealth();
        this.ui.toast("Careful! -2 health", 1500);
      }
      restartCourse() {
        const id = this.game.course, act = this.game.act;
        this.ui.fade(true).then(() => {
          this.loadWorld(id, act, id === "hub" ? {} : {});
          this.beginPlay();
          this.ui.fade(false);
          this.ui.toast("Try again!");
        });
      }
      gameOver() {
        this.state = "gameover";
        this.ui.banner("", "Game Over", "Lives restored to 4", 3e3);
        setTimeout(() => this.ui.fade(true).then(() => {
          this.game.lives = 4;
          this.loadWorld("hub");
          this.beginPlay();
          this.ui.fade(false);
        }), 2600);
      }
      pauseMenu() {
        if (this.state !== "play") return;
        this.state = "pause";
        this.audio.sfx("confirm");
        const inCourse = this.game.course !== "hub";
        const resume = () => {
          this.ui.closeMenu();
          this.state = "play";
        };
        const items = [{ label: "Resume", action: resume }, { label: "Controls", action: () => this.openControls(() => this.pauseMenu2()) }, { label: "Settings", action: () => this.openSettings(() => this.pauseMenu2()) }];
        if (inCourse) {
          items.push({ label: "Restart", action: () => {
            this.ui.closeMenu();
            this.state = "transition";
            this.restartCourse();
          } });
          items.push({ label: "Exit to courtyard", action: () => {
            this.ui.closeMenu();
            this.exitToHub(this.game.course);
          } });
        }
        items.push({ label: "Quit to title", action: () => {
          this.ui.closeMenu();
          this.state = "transition";
          this.ui.fade(true).then(() => {
            this.enterTitle();
            this.ui.fade(false);
          });
        } });
        this.ui.openMenu({ title: "Paused", sub: this.curDef.name + (inCourse ? "  -  Act " + this.game.act : ""), items, onBack: resume, cls: "pause" });
      }
      pauseMenu2() {
        this.state = "play";
        this.pauseMenu();
      }
      // ------------------------------------------------------------------ attract mode
      startAttract() {
        this.titleMode = false;
        this.cheat = true;
        this.ui.closeMenu();
        this.ui.showTitle(false);
        this.attractIdx = this.attractIdx % ATTRACT.length;
        this.runAttractItem();
      }
      runAttractItem() {
        const [id, act] = ATTRACT[this.attractIdx];
        this.state = "transition";
        this.attractMode = true;
        this.ui.fade(true).then(() => {
          if (!this.attractMode) return;
          this.loadWorld(id, act);
          this.beginPlay();
          this.input.virtual = (r) => this.bot.make(r);
          this.attractT = 0;
          this.ui.showHud(true);
          this.ui.showAttract(true, LEVELS[id].name + (LEVELS[id].acts ? " - Act " + act : ""));
          this.ui.fade(false);
          this.audio.play(LEVELS[id].music);
          this.input.lastActivity = performance.now();
        });
      }
      attractNext() {
        this.attractIdx = (this.attractIdx + 1) % ATTRACT.length;
        this.world.scene.remove(this.starShow);
        this.cam.over = null;
        this.runAttractItem();
      }
      stopAttract() {
        this.attractMode = false;
        this.cheat = false;
        this.input.virtual = null;
        this.ui.showAttract(false);
        this.state = "transition";
        this.ui.fade(true).then(() => {
          this.enterTitle();
          this.ui.fade(false);
        });
      }
      // ------------------------------------------------------------------ frame
      frame() {
        const now = performance.now();
        let dt = Math.min(0.1, (now - this.last) / 1e3);
        this.last = now;
        const s = this.input.poll();
        const raw = this.input.raw;
        if (raw.any) this.audio.unlock();
        this.ui.tick(dt);
        if (this.portalCool > 0) this.portalCool -= dt;
        const w = this.world, p = this.player;
        if (this.gated) {
          if (this.input.device === "gamepad" || this.input.keys.size) {
            this.gated = false;
            this.ui.touchGate(false);
          }
        }
        switch (this.state) {
          case "title":
          case "menu": {
            if (this.ui.menuOpen) this.ui.navMenu(s);
            else if (this.pressStart && (s.confirmP || s.startP) && !this.gated) {
              this.audio.sfx("confirm");
              this.mainMenu();
            }
            if (this.titleMode && this.settings.attract && !this.gated && this.input.idleSeconds() > IDLE_LIMIT) this.startAttract();
            w.update(dt);
            break;
          }
          case "play": {
            if (this.attractMode && raw.any) {
              this.stopAttract();
              break;
            }
            if (s.startP && !this.attractMode) {
              this.pauseMenu();
              break;
            }
            this.acc += dt;
            let n = 0;
            while (this.acc >= STEP && n++ < 6) {
              this.step();
              this.acc -= STEP;
            }
            if (this.acc > STEP * 6) this.acc = 0;
            this.attractT += dt;
            if (this.attractMode && (this.attractT > 55 || this.bot.doneT > 7)) this.attractNext();
            break;
          }
          case "dialog":
            {
              this.dlgT = (this.dlgT || 0) + dt;
              const auto = this.attractMode && this.dlgT > 2.2;
              if (auto) this.dlgT = 0;
              this.ui.updateDialog(dt, auto ? { confirmP: true } : s);
              if (!this.ui.dlg) this.dlgT = 0;
            }
            w.fx.update(dt);
            if (this.attractMode && raw.any) this.stopAttract();
            break;
          case "pause":
          case "select":
            if (this.ui.menuOpen) this.ui.navMenu(s);
            break;
          case "cutscene": {
            this.cutT += dt;
            w.fx.update(dt);
            w.update(0);
            p.hero.update(dt, { state: "cheer", speed: 0, t: this.cutT, capT: 0 });
            p.group.position.set(p.pos.x, p.pos.y - 0.75, p.pos.z);
            p.group.rotation.y = p.yaw;
            if (this.starShow) {
              this.starShow.position.set(p.pos.x, p.pos.y + 1.9 + Math.sin(this.cutT * 3) * 0.1, p.pos.z);
              this.starShow.rotation.y += dt * 3;
              if (Math.random() < 0.4) w.fx.sparkle(this.starShow.position.x, this.starShow.position.y, this.starShow.position.z);
            }
            if (this.cutT > 4) this.finishCutscene();
            break;
          }
          case "dying": {
            this.deathT += dt;
            p.step(dt, this.input.blank(), this.cam.yaw);
            w.phys.step();
            if (this.deathT > 1.9) {
              this.state = "transition";
              if (this.game.lives < 0) this.gameOver();
              else this.restartCourse();
            }
            break;
          }
          case "ending":
          case "transition":
          case "gameover":
            w.fx.update(dt);
            if (this.ui.menuOpen) this.ui.navMenu(s);
            break;
          default:
            break;
        }
        if (this.attractMode && ["title", "menu", "pause", "select"].includes(this.state)) {
        }
        if (this.state === "menu" && this.ui.menuOpen) this.ui.navMenu(s);
        this.updateCameraAndRender(dt);
        this.updateHud();
      }
      step() {
        const w = this.world, p = this.player, I = this.input.s;
        w.prompt = null;
        w.update(STEP);
        p.step(STEP, I, this.cam.yaw);
        w.phys.step();
        this.input.clearEdges();
        this.game.t += STEP;
        if (p.dead && this.state === "play") return;
        if (this.state === "play" && w.prompt) this.ui.setPrompt(w.prompt, w.promptKey);
        else if (this.state === "play") this.ui.setPrompt(null);
      }
      updateCameraAndRender(dt) {
        const w = this.world, p = this.player;
        if (!w) return;
        if (this.state === "play" || this.state === "dialog" || this.state === "cutscene" || this.state === "dying" || this.state === "pause" || this.state === "select" || this.state === "transition") {
          p.visual(this.state === "cutscene" ? 0 : dt);
        }
        this.cam.update(dt, this);
        if (this.state === "title" || this.state === "menu") w.sky.position.copy(this.camera.position);
        else w.sky.position.copy(this.camera.position);
        w.followLight(this.state === "title" ? { x: 0, y: 0, z: -10 } : p.pos);
        this.renderer.render(w.scene, this.camera);
      }
      updateHud() {
        const p = this.player, g = this.game;
        if (!p) return;
        this.ui.setHealth(p.health, p.air, p.submerged);
        this.ui.setStats(this.save.stars.size, g.coins, Math.max(0, g.lives), g.act === 3 && ["meadow", "peak", "cove", "volcano"].includes(g.course) ? g.reds : null);
        this.ui.setCap(Math.max(p.capT, p.metalT || 0, p.vanishT || 0) / 30);
        if (this.world.boss && this.world.boss.dead) this.ui.setBoss(null);

    };
    var ATTRACT = [["meadow", 1], ["peak", 1], ["cove", 2], ["volcano", 2], ["meadow", 3], ["volcano", 1], ["throne", 1]];
