	max-width: 75vw;
	margin-bottom: 8px;
}
.ending-emblem {
	width: 70px;
	height: 90px;
	color: var(--gold);
	margin: 0 auto 22px;
}
.ending-stat {
	font-size: 11px;
	letter-spacing: 3px;
	color: var(--gold);
	margin-bottom: 25px;
}
.hud {
	position: absolute;
	inset: 0;
	pointer-events: none;
	text-shadow: 0 2px 8px #102c2999;
	background: linear-gradient(
		180deg,
		#10242135 0%,
		transparent 21%,
		transparent 77%,
		#10242130 100%
	);
}
.vitals {
	position: absolute;
	top: 5vh;
	left: 4vw;
}
.hearts {
	display: flex;
	gap: 6px;
	line-height: 1;
}
.heart {
	font-family: Georgia, serif;
	font-size: 31px;
	color: #3a514c;
	filter: drop-shadow(0 1px 3px #10242188);
}
.heart.full {
	color: #efb1a0;
}
.stamina-line {
	display: flex;
	gap: 9px;
	align-items: center;
	margin-top: 12px;
}
.stamina-leaf {
	font-size: 17px;
	color: #c5d79d;
}
.stamina-track {
	width: 164px;
	height: 5px;
	border-radius: 5px;
	background: #203c32aa;
	overflow: hidden;
	border: 1px solid #b2c99545;
}
.stamina-track > div {
	height: 100%;
	width: 100%;
	transform-origin: left;
	background: #c3da90;
	transition: transform 0.12s linear;
}
.stamina-track > div.low {
	background: #e9ad70;
}
.quest {
	position: absolute;
	top: 5vh;
	right: 4vw;
	text-align: right;
	max-width: 370px;
}
.quest .eyebrow {
	font-size: 9px;
	letter-spacing: 2.2px;
	text-shadow: 0 1px 5px #112f26;
}
.quest #objective {
	font-size: 17px;
	margin-top: 9px;
	color: #f8f2df;
	line-height: 1.5;
}
.quest #seal-count {
	margin-top: 9px;
	display: flex;
	gap: 9px;
	justify-content: flex-end;
	color: #78938b;
	font-size: 22px;
}
.quest #seal-count .lit {
	color: #ead79a;
}
.power-hud {
	position: absolute;
	bottom: 7vh;
	left: 4vw;
	display: flex;
	gap: 16px;
	align-items: center;
}
.power-icon {
	display: flex;
	align-items: center;
	justify-content: center;
	width: 65px;
	height: 65px;
	border: 1px solid #d6dfbf66;
	outline: 1px solid #d6dfbf22;
	outline-offset: 5px;
	transform: rotate(0deg);
	border-radius: 50%;
	background: #173c3577;
	font-size: 40px;
	line-height: 1;
	font-family: Georgia, serif;
}
.power-label {
	display: flex;
	gap: 13px;
	align-items: center;
	font-family: Georgia, serif;
	font-size: 26px;
	letter-spacing: 0.01em;
}
.power-label #cooldown {
	font-size: 18px;
	color: #dbc57e;
}
.micro-hint {
	display: flex;
	align-items: center;
	gap: 7px;
	font-size: 11px;
	margin-top: 10px;
	color: #d4dfcd;
}
.micro-hint .glyph {
	height: 18px;
	min-width: 19px;
	font-size: 17px;
}
.micro-hint .glyph.l1 {
	min-width: 27px;
	font-size: 10px;
}
.hint-separator {
	margin: 0 5px;
	opacity: 0.5;
}
.on-cooldown .power-icon {
	opacity: 0.5;
}
.explore-hints {
	position: absolute;
	right: 4vw;
	bottom: 7vh;
	display: flex;
	align-items: center;
	gap: 9px;
	font-size: 12px;
	color: #dfebd8;
}
.explore-hints > .glyph:not(:first-child) {
	margin-left: 17px;
}
.explore-hints .glyph {
	height: 22px;
	min-width: 22px;
}
.context {
	position: absolute;
	bottom: 16vh;
	left: 50%;
	transform: translateX(-50%);
	display: flex;
	align-items: center;
	gap: 13px;
	padding: 15px 25px;
	border: 1px solid #d8e3b75c;
	background: linear-gradient(
		90deg,
		#15372b10,
		#173629bd 20%,
		#173629bd 80%,
		#15372b10
	);
	font-size: 19px;
	white-space: nowrap;
	box-shadow: 0 8px 40px #0e272622;
}
.context .glyph {
	color: #f3e8bf;
}
.compass {
	position: absolute;
	bottom: 2.7vh;
	right: 4vw;
	display: flex;
	align-items: center;
	gap: 13px;
	font-size: 10px;
	letter-spacing: 1px;
	color: #d6dfce;
}
.compass-rule {
	height: 3px;
	width: 3px;
	background: #d8dfc0;
	transform: rotate(45deg);
}
#compass {
	font-size: 13px;
	color: #f2e7bf;
	min-width: 20px;
	text-align: center;
}
.boss {
	position: absolute;
	top: 15vh;
	width: 440px;
	max-width: 40vw;
	left: 50%;
	transform: translateX(-50%);
	text-align: center;
}
.boss > span {
	font-family: Georgia, serif;
	font-size: 20px;
	letter-spacing: 0.15em;
	text-transform: uppercase;
}
.boss-track {
	margin-top: 14px;
	height: 6px;
	background: #182c29b3;
	border: 1px solid #c6bc8955;
}
.boss-track > div {
	width: 100%;
	height: 100%;
	background: #dd9b75;
	transform-origin: left;
	transition: transform 0.2s;
}
.region-title {
	position: absolute;
	left: 50%;
	top: 24%;
	transform: translateX(-50%);
	width: 90%;
	text-align: center;
	animation: regionIn 0.7s ease;
	text-shadow: 0 3px 20px #14332b;
	pointer-events: none;
}
.region-title .eyebrow {
	font-size: 11px;
	letter-spacing: 5px;
	color: #e7dfb8;
}
.region-title h2 {
	font-size: clamp(38px, 4vw, 65px);
	margin-top: 13px;
}
.region-ornament {
	margin-top: 15px;
	color: #d5d5af;
	font-size: 22px;
	letter-spacing: 8px;
}
.toast {
	position: absolute;
	left: 50%;
	bottom: 27vh;
	transform: translateX(-50%);
	display: flex;
	align-items: center;
	gap: 18px;
	max-width: 70vw;
	background: linear-gradient(
		90deg,
		#15372b00,
		#183a31e3 12%,
		#183a31e3 88%,
		#15372b00
	);
	padding: 18px 43px;
	animation: toastIn 0.25s ease;
	text-align: left;
	border-top: 1px solid #e5d69440;
	border-bottom: 1px solid #e5d69440;
	pointer-events: none;
}
.toast-symbol {
	font-size: 30px;
	color: var(--gold);
}
.toast strong {
	font-family: Georgia, serif;
	font-size: 23px;
	font-weight: 400;
}
.toast p {
	font-size: 14px;
	color: #d0deca;
	margin-top: 6px;
}
.attract {
	position: absolute;
	inset: 0;
	display: flex;
	justify-content: space-between;
	align-items: flex-end;
	padding: 6vh 5vw;
	background: linear-gradient(0deg, #102923b8, transparent 30%);
	pointer-events: none;
}
.attract .eyebrow {
	font-size: 9px;
	letter-spacing: 2.5px;
}
.attract strong {
	display: block;
	font-family: Georgia, serif;
	font-size: 34px;
	font-weight: 400;
	margin-top: 13px;
}
.attract-return {
	font-size: 13px;
	letter-spacing: 0.04em;
	border: 1px solid #d9d6af75;
	padding: 15px 22px;
	background: #203d3370;
	animation: attractPulse 3s ease-in-out infinite;
}
.loading {
	position: absolute;
	inset: 0;
	background: #142c29;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	pointer-events: auto;
	z-index: 20;
}
.loading-emblem {
	width: 74px;
	height: 91px;
	color: var(--gold);
	margin-bottom: 26px;
}
.loading .eyebrow {
	font-size: 13px;
	letter-spacing: 6px;
	margin-left: 6px;
}
.loading #loading-text {
	font-family: Georgia, serif;
	font-style: italic;
	font-size: 19px;
	color: #c6d3c4;
	margin-top: 23px;
	text-align: center;
	max-width: 75vw;
	line-height: 1.6;
}
.loading-rule {
	width: 140px;
	height: 1px;
	background: #afc6a92a;
	margin-top: 26px;
	overflow: hidden;
}
.loading-rule > span {
	display: block;
	width: 55px;
	height: 100%;
	background: var(--gold);
	animation: loading 1.5s ease-in-out infinite;
}
.aim-reticle {
	position: absolute;
	left: 50%;
	top: 50%;
	width: 34px;
	height: 34px;
	transform: translate(-50%, -50%);
	filter: drop-shadow(0 1px 3px #000a);
}
.aim-reticle i,
.aim-reticle b,
.aim-reticle em,
.aim-reticle span {
	position: absolute;
	background: var(--cream);
	display: block;
}
.aim-reticle i {
	left: 0;
	top: 16px;
	width: 9px;
	height: 2px;
}
.aim-reticle b {
	right: 0;
	top: 16px;
	width: 9px;
	height: 2px;
}
.aim-reticle em {
	top: 0;
	left: 16px;
	width: 2px;
	height: 9px;
}
.aim-reticle span {
	bottom: 0;
	left: 16px;
	width: 2px;
	height: 9px;
}
noscript {
	position: absolute;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	background: #142c29;
	color: #f4eedb;
	font-size: 22px;
	padding: 10vw;
	text-align: center;
}
::-webkit-scrollbar {
	width: 4px;
	height: 4px;
}
::-webkit-scrollbar-thumb {
	background: #b9bd8c66;
	border-radius: 4px;
}
::-webkit-scrollbar-track {
	background: #74967c11;
}
@keyframes loading {
	0% {
		transform: translateX(-55px);
	}
	100% {
		transform: translateX(140px);
	}
}
@keyframes regionIn {
	from {
		opacity: 0;
		transform: translate(-50%, 8px);
	}
	to {
		opacity: 1;
		transform: translate(-50%, 0);
	}
}
@keyframes toastIn {
	from {
		opacity: 0;
		transform: translate(-50%, 7px);
	}
	to {
		opacity: 1;
		transform: translate(-50%, 0);
	}
}
@keyframes attractPulse {
	0%,
	100% {
		opacity: 0.65;
	}
	50% {
		opacity: 1;
	}
}
.reduced-motion * {
	animation: none !important;
	transition: none !important;
	scroll-behavior: auto !important;
}
