  USAGE       : ~$11.49 API cost (claude-opus-5-5 $11.17 + claude-haiku-5-5 $0.32); ~22.6M total tokens (opus: 22.9k input, 223.7k output, 20.7M cache read, 308.2k cache write; haiku: 1.6k input, 3.9k output, 953.0k cache read, 422.8k cache write); time: 48m 6s wall, 35m 15s API — from /usage at time of writing

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StarFoxSixtyFlips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:wght@500;700;900&display=swap" rel="stylesheet">
<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<style>
:root{
  --ink:#0d1020; --paper:#fff8ec; --accent:#ff8a1f; --accent2:#2fd3ff; --good:#5dff8a; --bad:#ff3d5a;
  --panel:rgba(12,16,38,.78); --panel-edge:#ffd166; --gold:#ffd166;
  --fs-xl:clamp(40px,6vw,96px); --fs-l:clamp(26px,3vw,46px); --fs-m:clamp(20px,2vw,30px); --fs-s:clamp(15px,1.3vw,21px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05060f;color:var(--paper);font-family:'Exo 2',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
.hidden{display:none!important}
.f-title{font-family:'Russo One','Exo 2',sans-serif;letter-spacing:.04em}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;padding:clamp(16px,3vh,40px) clamp(16px,3vw,56px);font-weight:700;text-shadow:0 3px 0 var(--ink),0 0 12px rgba(0,0,0,.5)}
.lbl{font-size:var(--fs-s);letter-spacing:.18em;opacity:.9}
#hud-shield{position:absolute;left:clamp(16px,3vw,56px);top:clamp(16px,3vh,40px);width:min(34vw,420px)}
.bar{position:relative;height:clamp(16px,2.2vh,26px);border:4px solid var(--ink);border-radius:14px;background:#26203a;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.bar .fill{position:absolute;inset:0;width:100%;background:linear-gradient(#7dfcff,#22a8ff 55%,#1673d6);transition:width .15s}
.bar .ghost{position:absolute;inset:0;width:100%;background:#ff5d6c;z-index:-0;opacity:.8;transition:width .8s .25s}
.bar .fill{z-index:1}
#hud-shield.low .bar .fill{background:linear-gradient(#ffb0b0,#ff3d5a)}
#hud-rings{display:flex;gap:8px;margin-top:8px}
.ring{width:22px;height:22px;border-radius:50%;border:5px solid #574a20;box-shadow:0 0 0 3px var(--ink)}
.ring.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--ink),0 0 12px var(--gold)}
#hud-hits{position:absolute;right:clamp(16px,3vw,56px);top:clamp(16px,3vh,40px);text-align:right}
#hud-hits .num{font-family:'Russo One';font-size:var(--fs-l);line-height:1}
#hud-hits .sub{font-size:var(--fs-s);opacity:.8}
#hud-hits .sub.got{color:var(--gold)}
#hud-bl{position:absolute;left:clamp(16px,3vw,56px);bottom:clamp(16px,3vh,40px);display:flex;flex-direction:column;gap:10px}
.iconrow{display:flex;gap:10px;align-items:center;font-size:var(--fs-m)}
.ico{width:30px;height:30px;border:4px solid var(--ink);border-radius:50%;background:var(--accent);box-shadow:0 3px 0 var(--ink)}
.ico.bomb{background:radial-gradient(circle at 35% 35%,#ffe0f0,#ff3da8 60%,#9a1060)}
.ico.life{border-radius:8px 8px 50% 50%;background:linear-gradient(#ffffff,#ff9a3c)}
#hud-laser{font-size:var(--fs-s);letter-spacing:.14em}
#hud-boost{position:absolute;right:clamp(16px,3vw,56px);bottom:clamp(16px,3vh,40px);width:clamp(110px,11vw,170px);text-align:center}
#hud-boost svg{width:100%;display:block}
#hud-boss{position:absolute;left:50%;top:clamp(16px,3vh,40px);transform:translateX(-50%);width:min(44vw,640px);text-align:center}
#hud-boss .name{font-family:'Russo One';font-size:var(--fs-m);margin-bottom:6px;color:#ffb3c0}
#hud-boss .bar .fill{background:linear-gradient(#ffd0d8,#ff3d5a 55%,#b0142f)}
#hud-wing{position:absolute;right:clamp(16px,3vw,56px);top:calc(clamp(16px,3vh,40px) + clamp(80px,12vh,130px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.wm{display:flex;align-items:center;gap:10px;font-size:var(--fs-s)}
.wm .mini{width:110px;height:12px;border:3px solid var(--ink);border-radius:8px;background:#26203a;overflow:hidden}
.wm .mini i{display:block;height:100%;background:var(--good)}
.wm.out{opacity:.45}
.wm.danger .mini i{background:var(--bad)}
.wm.danger{animation:blink .4s infinite}
@keyframes blink{50%{opacity:.35}}
#hud-gates{position:absolute;left:clamp(16px,3vw,56px);top:calc(clamp(16px,3vh,40px) + 110px);font-size:var(--fs-m);color:var(--gold)}
#radar{position:absolute;right:clamp(16px,3vw,56px);bottom:calc(clamp(16px,3vh,40px) + clamp(130px,14vw,200px));width:clamp(150px,14vw,220px);height:clamp(150px,14vw,220px)}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:'Russo One';font-size:var(--fs-xl);opacity:0;transition:opacity .3s, transform .3s;transform:scale(.9);color:var(--paper);-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink)}
#banner.show{opacity:1;transform:scale(1)}
#banner small{display:block;font-size:var(--fs-m);-webkit-text-stroke:0;letter-spacing:.2em;color:var(--gold);margin-top:8px}
#radio{position:absolute;left:50%;bottom:clamp(16px,3vh,40px);transform:translateX(-50%);display:flex;gap:18px;align-items:center;background:var(--panel);border:4px solid var(--ink);outline:3px solid var(--panel-edge);border-radius:20px;padding:12px 26px 12px 12px;max-width:min(60vw,820px);animation:pop .2s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}}
#radio canvas{width:clamp(80px,8vw,120px);height:clamp(80px,8vw,120px);border-radius:14px;border:4px solid var(--ink);flex:none}
#radio .who{font-family:'Russo One';font-size:var(--fs-s);letter-spacing:.15em;color:var(--gold)}
#radio .text{font-size:var(--fs-m);line-height:1.25;font-weight:700}
#hint{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:var(--fs-m);opacity:0;transition:opacity .3s;background:var(--panel);padding:8px 22px;border-radius:30px;border:3px solid var(--ink)}
#hint.show{opacity:1}

/* glyphs */
.g{display:inline-flex;align-items:center;justify-content:center;min-width:1.5em;height:1.5em;padding:0 .3em;border-radius:.75em;background:#1b1f3a;border:3px solid var(--paper);font-size:.85em;font-family:'Exo 2';font-weight:900;vertical-align:middle;margin:0 .15em;line-height:1;text-shadow:none}
.g.k{border-radius:.3em;background:#f3eadb;color:var(--ink);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.g.x{color:#8fb8ff}.g.o{color:#ff7a8a}.g.s{color:#ff9be6}.g.t{color:#5fffc0}

/* ---------- Screens / menus ---------- */
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#screen > *{pointer-events:auto}
.scr{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 5vw;text-align:center;background:radial-gradient(ellipse at center,rgba(5,6,20,.25),rgba(5,6,20,.82))}
.scr.clear{background:none}
.scr.solid{background:radial-gradient(ellipse at 50% 30%,#1c2050,#05060f 75%)}
.logo{font-family:'Russo One';font-size:var(--fs-xl);line-height:.95;color:var(--paper);-webkit-text-stroke:4px var(--ink);text-shadow:0 8px 0 var(--ink),0 0 40px rgba(255,138,31,.6);transform:rotate(-3deg)}
.logo span{color:var(--accent)}
.logo em{font-style:normal;color:var(--accent2)}
.tagline{font-size:var(--fs-m);letter-spacing:.3em;color:var(--gold);margin:14px 0 4vh;font-weight:900;text-shadow:0 3px 0 var(--ink)}
.menu{display:flex;flex-direction:column;gap:12px;min-width:min(520px,80vw)}
.mi{font-family:'Russo One';font-size:var(--fs-m);padding:14px 30px;border-radius:18px;background:rgba(14,18,44,.82);border:4px solid var(--ink);color:var(--paper);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;transition:transform .12s, background .12s;box-shadow:0 5px 0 var(--ink)}
.mi.focus{background:var(--accent);color:var(--ink);transform:scale(1.05);box-shadow:0 5px 0 var(--ink),0 0 0 4px var(--paper)}
.mi.disabled{opacity:.4}
.mi .val{font-family:'Exo 2';font-weight:900;display:flex;align-items:center;gap:12px}
.mi .val .arrow{opacity:.6}
.slider{width:160px;height:14px;border:3px solid currentColor;border-radius:8px;overflow:hidden}
.slider i{display:block;height:100%;background:currentColor}
.h1{font-family:'Russo One';font-size:var(--fs-l);margin-bottom:3vh;-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink)}
.footer{position:fixed;bottom:clamp(16px,3vh,40px);left:0;right:0;text-align:center;font-size:var(--fs-s);opacity:.9;font-weight:700;text-shadow:0 2px 0 var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,80vw),1fr));gap:18px;width:min(1400px,92vw);margin-bottom:3vh}
.card{background:rgba(14,18,44,.85);border:4px solid var(--ink);outline:3px solid rgba(255,209,102,.5);border-radius:18px;padding:16px 20px;text-align:left}
.card b{display:block;font-family:'Russo One';font-size:var(--fs-m);color:var(--gold);margin-bottom:6px}
.card div{font-size:var(--fs-s);line-height:1.4}
.card .keys{margin-top:8px;font-size:var(--fs-s)}
.about{max-width:min(1000px,90vw);text-align:left;font-size:var(--fs-s);line-height:1.5;background:rgba(14,18,44,.85);border:4px solid var(--ink);border-radius:18px;padding:22px 30px;margin-bottom:3vh;max-height:62vh;overflow:auto}
.about dt{color:var(--gold);font-family:'Russo One';margin-top:8px}
.about dd{margin:0 0 4px 0}
.results{display:flex;flex-direction:column;gap:14px;font-size:var(--fs-m);min-width:min(620px,86vw);margin-bottom:3vh}
.results .row{display:flex;justify-content:space-between;background:rgba(14,18,44,.82);border:4px solid var(--ink);border-radius:16px;padding:12px 26px;opacity:0;transform:translateY(12px);transition:all .35s}
.results .row.in{opacity:1;transform:none}
.results .row b{font-family:'Russo One'}
.medal{display:inline-block;width:1.2em;height:1.2em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c8,#ffd166 45%,#b8860b);border:3px solid var(--ink);vertical-align:middle}
/* map */
.map{position:relative;width:min(1200px,92vw);height:min(440px,40vh);margin-bottom:1vh}
.map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;width:220px}
.planet{width:clamp(70px,8vw,120px);height:clamp(70px,8vw,120px);border-radius:50%;margin:0 auto 10px;border:5px solid var(--ink);box-shadow:inset -14px -10px 0 rgba(0,0,0,.28),0 6px 0 var(--ink)}
.node .nm{font-family:'Russo One';font-size:var(--fs-s)}
.node .st{font-size:calc(var(--fs-s)*.85);opacity:.8}
.node.lock{opacity:.35;filter:grayscale(1)}
.node.sel .planet{outline:6px solid var(--accent);outline-offset:6px;animation:pulse 1s infinite}
.node.done .nm::after{content:" ✓";color:var(--good)}
@keyframes pulse{50%{outline-offset:12px}}
.mapinfo{font-size:var(--fs-m);min-height:2.6em;max-width:900px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s}
#fade.on{opacity:1}
#attract{position:fixed;left:0;right:0;top:clamp(16px,4vh,48px);text-align:center;pointer-events:none}
#attract .logo{font-size:var(--fs-l)}
#attract .blink{font-size:var(--fs-m);font-weight:900;margin-top:10px;animation:blink 1.2s infinite;text-shadow:0 3px 0 var(--ink)}
#touchblock{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 30%,#1c2050,#05060f 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;text-align:center;padding:5vw}
#touchblock .msg{font-family:'Russo One';font-size:var(--fs-l)}
#touchblock button{font-family:'Russo One';font-size:var(--fs-m);padding:16px 40px;border-radius:18px;border:4px solid var(--ink);background:var(--accent);color:var(--ink);box-shadow:0 5px 0 var(--ink)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Russo One';font-size:var(--fs-l);z-index:60;background:#05060f}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud" class="hidden">
  <div id="hud-shield"><div class="lbl">SHIELD</div><div class="bar"><div class="ghost"></div><div class="fill"></div></div><div id="hud-rings"></div></div>
  <div id="hud-gates" class="hidden"></div>
  <div id="hud-hits"><div class="lbl">HITS</div><div class="num">000</div><div class="sub"></div></div>
  <div id="hud-wing"></div>
  <div id="hud-boss" class="hidden"><div class="name"></div><div class="bar"><div class="ghost"></div><div class="fill"></div></div></div>
  <div id="hud-bl"><div class="iconrow" id="hud-lives"></div><div class="iconrow" id="hud-bombs"></div><div id="hud-laser"></div></div>
  <div id="hud-boost"><svg viewBox="0 0 100 60"><path d="M10 55 A40 40 0 0 1 90 55" fill="none" stroke="#0d1020" stroke-width="16" stroke-linecap="round"/><path id="boostarc" d="M10 55 A40 40 0 0 1 90 55" fill="none" stroke="#2fd3ff" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100"/><path id="chargearc" d="M22 55 A28 28 0 0 1 78 55" fill="none" stroke="#5dff8a" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/></svg><div class="lbl">BOOST</div></div>
  <canvas id="radar" class="hidden" width="220" height="220"></canvas>
  <div id="banner"></div>
  <div id="hint"></div>
  <div id="radio" class="hidden"><canvas id="portrait" width="128" height="128"></canvas><div><div class="who"></div><div class="text"></div></div></div>
</div>
<div id="screen"></div>
<div id="attract" class="hidden"><div class="logo">Star<span>Fox</span>Sixty<em>Flips</em></div><div class="blink">DEMO PLAY — PRESS ANY BUTTON</div></div>
<div id="fade"></div>
<div id="touchblock" class="hidden"><div class="msg">Controller or keyboard required</div><div style="font-size:var(--fs-s);opacity:.8">Connect a PS5-compatible controller or a keyboard to fly.</div><button id="touchsettings">Settings</button></div>
<div id="loading">LOADING…</div>
<script type="module">
// ===================== CORE: imports, utils, settings, renderer, toon materials =====================
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const V3 = THREE.Vector3;
const $ = (s) => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
const TAU = Math.PI * 2;
const tmpV = new V3(), tmpV2 = new V3(), tmpV3 = new V3();
const tmpQ = new THREE.Quaternion();

// ---------- persistent settings & progress ----------
const DEFAULT_SETTINGS = { master: 0.8, music: 0.55, sfx: 0.8, difficulty: 1, invertY: false, rumble: true, aimAssist: true, shake: true, subtitles: true, bloom: true };
const settings = Object.assign({}, DEFAULT_SETTINGS);
const progress = { unlocked: ['verdant'], best: {}, medals: {} };
try { Object.assign(settings, JSON.parse(localStorage.getItem('sfsf_settings') || '{}')); } catch (e) { /* storage unavailable */ }
try { Object.assign(progress, JSON.parse(localStorage.getItem('sfsf_progress') || '{}')); } catch (e) { /* storage unavailable */ }
function saveSettings() { try { localStorage.setItem('sfsf_settings', JSON.stringify(settings)); } catch (e) { /* ignore */ } }
function saveProgress() { try { localStorage.setItem('sfsf_progress', JSON.stringify(progress)); } catch (e) { /* ignore */ } }
const DIFF = [
  { name: 'CADET', dmgTaken: 0.6, enemyFire: 0.6, enemyHp: 0.8, aim: 0.55 },
  { name: 'ACE', dmgTaken: 1.0, enemyFire: 1.0, enemyHp: 1.0, aim: 0.8 },
  { name: 'EXPERT', dmgTaken: 1.45, enemyFire: 1.4, enemyHp: 1.3, aim: 0.95 },
];
const diff = () => DIFF[settings.difficulty];

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
$('#game').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.5, 9000);
scene.add(camera);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.75, 0.45, 1.05);
composer.addPass(bloomPass);
const gradePass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uFlash: { value: 0 }, uFlashColor: { value: new THREE.Color(1, 0.1, 0.15) }, uVig: { value: 0.35 }, uWhite: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uFlash; uniform vec3 uFlashColor; uniform float uVig; uniform float uWhite; varying vec2 vUv;
    void main(){ vec4 c=texture2D(tDiffuse,vUv); vec2 d=vUv-0.5; float v=smoothstep(0.35,0.85,length(d)*1.25);
      c.rgb*=1.0-v*uVig; c.rgb=mix(c.rgb,uFlashColor,uFlash*(0.25+v*0.75)); c.rgb=mix(c.rgb,vec3(1.0),uWhite); gl_FragColor=c; }`,
});
composer.addPass(gradePass);
composer.addPass(new OutputPass());

// ---------- toon materials + inverted-hull outlines ----------
const gradTex = (() => {
  const d = new Uint8Array([70, 70, 70, 255, 160, 160, 160, 255, 255, 255, 255, 255]);
  const t = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
  return t;
})();
const matCache = new Map();
function toonMat(color, opts = {}) {
  const key = color + '|' + JSON.stringify(opts);
  let m = matCache.get(key);
  if (!m) {
    const o = Object.assign({}, opts); const flat = !!o.flatShading; delete o.flatShading;
    m = new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: gradTex }, o)); m.userData.flat = flat; matCache.set(key, m);
  }
  return m;
}
function glowMat(r, g, b, opts = {}) {
  return new THREE.MeshBasicMaterial(Object.assign({ color: new THREE.Color(r, g, b), toneMapped: false }, opts));
}
const outlineMat = new THREE.ShaderMaterial({
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uWidth: { value: 2.6 }, uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }, uColor: { value: new THREE.Color(0x0d1020) } }]),
  side: THREE.BackSide, fog: true,
  vertexShader: `uniform float uWidth; uniform vec2 uRes;
    #include <fog_pars_vertex>
    void main(){ vec4 mvPosition = modelViewMatrix*vec4(position,1.0); vec4 c = projectionMatrix*mvPosition;

// ===================== MODELS: procedural cel-shaded ships, enemies, bosses =====================
function wingGeo(points, depth = 0.25) {
  const s = new THREE.Shape();
  s.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) s.lineTo(points[i][0], points[i][1]);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.08, bevelSegments: 1 });
  g.rotateX(Math.PI / 2); g.translate(0, depth / 2, 0);
  return g;
}
const WING_R = wingGeo([[0.6, -1.4], [5.2, 0.9], [5.4, 1.6], [0.6, 1.4]]);
const WING_L = wingGeo([[-0.6, -1.4], [-0.6, 1.4], [-5.4, 1.6], [-5.2, 0.9]]);
const FIN_GEO = wingGeo([[0, 0], [1.6, 0.4], [1.9, 1.6], [0.2, 1.4]], 0.18);

function makeAsteroid(r = 6, color = 0x8b7d6b) {
  const geo = new THREE.IcosahedronGeometry(1, 1);
  const p = geo.attributes.position;
  const seen = new Map();
  for (let i = 0; i < p.count; i++) {
    const k = `${p.getX(i).toFixed(3)},${p.getY(i).toFixed(3)},${p.getZ(i).toFixed(3)}`;
    let s = seen.get(k); if (s === undefined) { s = rand(0.75, 1.2); seen.set(k, s); }
    p.setXYZ(i, p.getX(i) * s, p.getY(i) * s * 0.85, p.getZ(i) * s);
  }
  geo.computeVertexNormals(); geo.userData.temp = true;
  const m = tmesh(geo, toonMat(color, { flatShading: true }));
  m.scale.setScalar(r);
  return m;
}

const FX = {
  MAX: 6000, count: 0, pts: null, pos: null, col: null, size: null, vel: null, life: null, maxLife: null, drag: null, grav: null,
  blasts: [], lights: [], rings: [], shake: 0, flash: 0, white: 0,
  init() {
    const n = this.MAX;
    this.pos = new Float32Array(n * 3); this.col = new Float32Array(n * 3); this.size = new Float32Array(n);
    this.vel = new Float32Array(n * 3); this.life = new Float32Array(n); this.maxLife = new Float32Array(n); this.drag = new Float32Array(n); this.grav = new Float32Array(n);
    this.baseCol = new Float32Array(n * 3); this.baseSize = new Float32Array(n);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('color', new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('size', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
    const mat = new THREE.ShaderMaterial({
      uniforms: { uScale: { value: window.innerHeight / 2 } },
      vertexShader: `attribute float size; attribute vec3 color; varying vec3 vC; uniform float uScale;
        void main(){ vC=color; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=size*uScale/max(-mv.z,0.1); gl_Position=projectionMatrix*mv; }`,
      fragmentShader: `varying vec3 vC; void main(){ vec2 d=gl_PointCoord-0.5; float r=length(d); if(r>0.5) discard; float rim=step(0.36,r); gl_FragColor=vec4(mix(vC, vC*0.35, rim),1.0); }`,
      transparent: false, depthWrite: true,
    });
    this.pts = new THREE.Points(geo, mat); this.pts.frustumCulled = false; scene.add(this.pts);
    for (let i = 0; i < 8; i++) { const l = new THREE.PointLight(0xffaa55, 0, 120, 1.6); l.userData.t = 0; scene.add(l); this.lights.push(l); }
    window.addEventListener('resize', () => { mat.uniforms.uScale.value = window.innerHeight / 2; });
  },
  emit(x, y, z, vx, vy, vz, r, g, b, size, life, drag = 1, grav = 0) {
    if (this.count >= this.MAX) return;
    const i = this.count++;
    const i3 = i * 3;
    this.pos[i3] = x; this.pos[i3 + 1] = y; this.pos[i3 + 2] = z;
    this.vel[i3] = vx; this.vel[i3 + 1] = vy; this.vel[i3 + 2] = vz;
    this.baseCol[i3] = r; this.baseCol[i3 + 1] = g; this.baseCol[i3 + 2] = b;
    this.baseSize[i] = size; this.life[i] = life; this.maxLife[i] = life; this.drag[i] = drag; this.grav[i] = grav;
  },
  burst(p, n, speed, color, size, life, opts = {}) {
    const c = color;
    for (let k = 0; k < n; k++) {
      tmpV.randomDirection().multiplyScalar(speed * rand(0.3, 1));
      if (opts.vel) tmpV.add(opts.vel);
      this.emit(p.x, p.y, p.z, tmpV.x, tmpV.y + (opts.up || 0), tmpV.z, c[0] * rand(0.8, 1.2), c[1] * rand(0.8, 1.2), c[2] * rand(0.8, 1.2), size * rand(0.6, 1.3), life * rand(0.6, 1.2), opts.drag ?? 2, opts.grav ?? 0);
    }
  },
  light(p, color, intensity, dur, dist = 140) {
    let best = this.lights[0];
    for (const l of this.lights) if (l.userData.t <= 0) { best = l; break; } else if (l.userData.t < best.userData.t) best = l;
    best.position.copy(p); best.color.set(color); best.userData.i = intensity; best.userData.t = dur; best.userData.d = dur; best.distance = dist; best.intensity = intensity;
  },
  explode(p, scale = 1, opts = {}) {
    const n = Math.round(14 * scale);
    for (let k = 0; k < n; k++) {
      const m = new THREE.Mesh(G.sphereLo, toonMat(pick([0xffd34a, 0xff8a1f, 0xff5a2a, 0xfff2a8]), { emissive: 0x6a2a00 }));
      m.castShadow = false;
      const ol = new THREE.Mesh(hullGeo(G.sphereLo), outlineMat); m.add(ol);
      m.position.copy(p).add(tmpV.randomDirection().multiplyScalar(rand(0, 2.5 * scale)));
      scene.add(m);
      this.blasts.push({ m, t: 0, d: rand(0.45, 0.9) * (0.7 + scale * 0.3), s: rand(2, 4.5) * scale, v: tmpV.clone().multiplyScalar(rand(4, 14) * scale), smoke: false, vel: opts.vel ? opts.vel.clone() : null });
    }
    for (let k = 0; k < Math.round(6 * scale); k++) {
      const m = new THREE.Mesh(G.sphereLo, toonMat(0x3a3440)); m.castShadow = false;
      m.position.copy(p).add(tmpV.randomDirection().multiplyScalar(rand(0, 2 * scale)));
      scene.add(m);
      this.blasts.push({ m, t: -rand(0.1, 0.3), d: rand(1.0, 1.8), s: rand(2.5, 5) * scale, v: tmpV.clone().multiplyScalar(rand(2, 6)).add(new V3(0, 6, 0)), smoke: true, vel: opts.vel ? opts.vel.clone() : null });
    }
    this.burst(p, Math.round(40 * scale), 40 * Math.sqrt(scale), [4, 2.2, 0.6], 0.9 * Math.sqrt(scale), 0.8, { vel: opts.vel });
    this.burst(p, Math.round(20 * scale), 25 * Math.sqrt(scale), [3, 3, 3], 0.5, 0.5, { vel: opts.vel });
    this.ring(p, scale * 14, [4, 2.4, 1], 0.5);
    this.light(p, 0xffa040, 600 * scale, 0.5, 60 + scale * 40);
    this.addShake(0.25 * scale);
  },
  ring(p, size, color, dur, axis = null) {
    const m = new THREE.Mesh(new THREE.RingGeometry(0.8, 1, 40), new THREE.MeshBasicMaterial({ color: new THREE.Color(...color), toneMapped: false, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
    m.position.copy(p);
    if (axis) m.lookAt(tmpV.copy(p).add(axis)); else m.quaternion.copy(camera.quaternion);
    scene.add(m);
    this.rings.push({ m, t: 0, d: dur, s: size });
  },
  sparks(p, color = [4, 3.5, 1.5], n = 10) { this.burst(p, n, 30, color, 0.4, 0.3); },
  addShake(a) { if (settings.shake) this.shake = Math.min(2.5, this.shake + a); },
  update(dt) {
    // particles
    const pos = this.pos, vel = this.vel;
    let i = 0;
    while (i < this.count) {
      this.life[i] -= dt;
      if (this.life[i] <= 0) {
        const j = --this.count;
        if (i !== j) {
          const i3 = i * 3, j3 = j * 3;
          for (let k = 0; k < 3; k++) { pos[i3 + k] = pos[j3 + k]; vel[i3 + k] = vel[j3 + k]; this.baseCol[i3 + k] = this.baseCol[j3 + k]; }
          this.life[i] = this.life[j]; this.maxLife[i] = this.maxLife[j]; this.baseSize[i] = this.baseSize[j]; this.drag[i] = this.drag[j]; this.grav[i] = this.grav[j];
        }
        continue;
      }
      const i3 = i * 3;
      const dr = Math.exp(-this.drag[i] * dt);
      vel[i3] *= dr; vel[i3 + 1] = vel[i3 + 1] * dr - this.grav[i] * dt; vel[i3 + 2] *= dr;
      pos[i3] += vel[i3] * dt; pos[i3 + 1] += vel[i3 + 1] * dt; pos[i3 + 2] += vel[i3 + 2] * dt;
      const f = this.life[i] / this.maxLife[i];
      this.col[i3] = this.baseCol[i3] * f; this.col[i3 + 1] = this.baseCol[i3 + 1] * f; this.col[i3 + 2] = this.baseCol[i3 + 2] * f;
      this.size[i] = this.baseSize[i] * (0.4 + 0.6 * f);
      i++;
    }
    const geo = this.pts.geometry;
    geo.setDrawRange(0, this.count);
    geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true; geo.attributes.size.needsUpdate = true;
    // fireball blobs
    for (let k = this.blasts.length - 1; k >= 0; k--) {
      const b = this.blasts[k];
      b.t += dt;
      if (b.t < 0) { b.m.visible = false; continue; }
      b.m.visible = true;
      const f = b.t / b.d;
      if (f >= 1) { scene.remove(b.m); this.blasts.splice(k, 1); continue; }
      const s = b.s * (f < 0.25 ? f / 0.25 : 1 - (f - 0.25) / 0.75 * (b.smoke ? 0.6 : 1));
      b.m.scale.setScalar(Math.max(0.01, s));
      b.m.position.addScaledVector(b.v, dt);
      if (b.vel) b.m.position.addScaledVector(b.vel, dt);
      b.v.multiplyScalar(Math.exp(-3 * dt));
    }
    for (let k = this.rings.length - 1; k >= 0; k--) {
      const r = this.rings[k]; r.t += dt; const f = r.t / r.d;
      if (f >= 1) { scene.remove(r.m); r.m.geometry.dispose(); r.m.material.dispose(); this.rings.splice(k, 1); continue; }
      r.m.scale.setScalar(r.s * (0.2 + f)); r.m.material.opacity = 1 - f;
    }
    for (const l of this.lights) {
      if (l.userData.t > 0) { l.userData.t -= dt; l.intensity = Math.max(0, l.userData.i * (l.userData.t / l.userData.d)); } else l.intensity = 0;
    }
    this.shake = Math.max(0, this.shake - dt * 2.2);
    this.flash = Math.max(0, this.flash - dt * 2.5);
    this.white = Math.max(0, this.white - dt * 0.8);
    gradePass.uniforms.uFlash.value = this.flash;
    gradePass.uniforms.uWhite.value = Math.min(1, this.white);
  },
  clear() {
    this.count = 0;
    for (const b of this.blasts) scene.remove(b.m);
    for (const r of this.rings) scene.remove(r.m);
    this.blasts.length = 0; this.rings.length = 0;
    for (const l of this.lights) { l.userData.t = 0; l.intensity = 0; }
    this.shake = 0; this.flash = 0; this.white = 0;
  },
};

// ===================== ENVIRONMENTS: sky, terrain, chunked scenery, hazards =====================
const SKY_VERT = `varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const SKY_FRAG = `uniform vec3 uTop,uHor,uBot,uNeb1,uNeb2,uSunDir,uSunCol; uniform float uStars, uSunSize; varying vec3 vD;
  float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
  float noise(vec3 x){ vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);
    return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
  float fbm(vec3 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=0.5; } return v; }
  void main(){ vec3 d=normalize(vD); float y=d.y;
    vec3 c = y>0.0 ? mix(uHor,uTop,pow(clamp(y,0.0,1.0),0.55)) : mix(uHor,uBot,pow(clamp(-y,0.0,1.0),0.45));
    if(uStars>0.0){
      float n=fbm(d*2.6); float n2=fbm(d*4.2+7.0);
      c += uNeb1*floor(smoothstep(0.42,0.85,n)*3.0)/3.0*uStars;
      c += uNeb2*floor(smoothstep(0.5,0.9,n2)*3.0)/3.0*uStars;
      float s=hash(floor(d*380.0)); c += step(0.9975,s)*vec3(1.6)*uStars;
      float s2=hash(floor(d*120.0)+3.0); c += step(0.9993,s2)*vec3(2.5,2.2,1.8)*uStars;
    }
    float sd=dot(d,normalize(uSunDir));
    c += uSunCol*step(1.0-uSunSize,sd)*2.5 + uSunCol*smoothstep(1.0-uSunSize*6.0,1.0,sd)*0.35;
    gl_FragColor=vec4(c,1.0); }`;

function bandShader(fragBody, extraUniforms) {
  return new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, Object.assign({ uTime: { value: 0 } }, extraUniforms)]),
    fog: true,
    vertexShader: `varying vec3 vW;
      #include <fog_pars_vertex>
      void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; vec4 mvPosition=viewMatrix*w; gl_Position=projectionMatrix*mvPosition;
      #include <fog_vertex>
      }`,
    fragmentShader: `uniform float uTime; varying vec3 vW;
      ${Object.keys(extraUniforms).map((k) => `uniform ${extraUniforms[k].type} ${k};`).join('\n')}
      #include <fog_pars_fragment>
      void main(){ ${fragBody}
      #include <fog_fragment>
      }`,
  });
}

const Env = {
  sky: null, sun: null, hemi: null, def: null, chunks: [], nextZ: 0, CH: 120, far: null, shaders: [], hazards: [], time: 0,
  init() {
    this.sky = new THREE.Mesh(new THREE.SphereGeometry(5000, 48, 24), new THREE.ShaderMaterial({
      uniforms: { uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uBot: { value: new THREE.Color() }, uNeb1: { value: new THREE.Color() }, uNeb2: { value: new THREE.Color() }, uStars: { value: 0 }, uSunDir: { value: new V3(0.3, 0.5, -1) }, uSunCol: { value: new THREE.Color(1, 0.9, 0.6) }, uSunSize: { value: 0.004 } },
      vertexShader: SKY_VERT, fragmentShader: SKY_FRAG, side: THREE.BackSide, depthWrite: false, fog: false,
    }));
    this.sky.renderOrder = -10; this.sky.frustumCulled = false;
    scene.add(this.sky);
    this.sun = new THREE.DirectionalLight(0xffffff, 2.6);
    this.sun.castShadow = true;
    this.sun.shadow.mapSize.set(2048, 2048);
    const sc = this.sun.shadow.camera; sc.left = -140; sc.right = 140; sc.top = 140; sc.bottom = -140; sc.near = 10; sc.far = 900;
    this.sun.shadow.bias = -0.0008;
    scene.add(this.sun); scene.add(this.sun.target);
    this.hemi = new THREE.HemisphereLight(0xbfe6ff, 0x557040, 1.2);
    scene.add(this.hemi);
  },
  setup(id, world) {
    this.def = ENVS[id];
    this.chunks = []; this.hazards = []; this.shaders = []; this.world = world; this.time = 0;
    const d = this.def;
    const u = this.sky.material.uniforms;
    u.uTop.value.set(d.sky[0]); u.uHor.value.set(d.sky[1]); u.uBot.value.set(d.sky[2]);
    u.uStars.value = d.stars || 0;
    u.uNeb1.value.set(d.neb ? d.neb[0] : 0); u.uNeb2.value.set(d.neb ? d.neb[1] : 0);
    u.uSunDir.value.set(...d.sunDir); u.uSunCol.value.set(d.sunCol || 0xfff0c0); u.uSunSize.value = d.sunSize ?? 0.004;
    scene.fog = d.fog ? new THREE.Fog(d.fog[0], d.fog[1], d.fog[2]) : null;
    scene.background = new THREE.Color(d.sky[1]);
    this.sun.color.set(d.sunCol || 0xfff0c0); this.sun.intensity = d.sunI ?? 2.6;
    this.hemi.color.set(d.hemi[0]); this.hemi.groundColor.set(d.hemi[1]); this.hemi.intensity = d.hemi[2];
    this.far = new THREE.Group(); world.add(this.far);
    this.nextZ = 200;
    d.build(world, this);
  },
  addChunkObj(ch, obj) { this.world.add(obj); ch.objs.push(obj); return obj; },
  addBox(ch, cx, cy, cz, sx, sy, sz) { ch.obs.push({ min: new V3(cx - sx / 2, cy - sy / 2, cz - sz / 2), max: new V3(cx + sx / 2, cy + sy / 2, cz + sz / 2) }); },
  addSphere(ch, c, r) { ch.obs.push({ c: c.clone(), r }); },
  update(dt, refZ, camPos, playerPos) {
    this.time += dt;
    for (const s of this.shaders) s.uniforms.uTime.value = this.time;
    this.sky.position.copy(camPos);
    const d = this.def;
    if (d.rails) {
      while (this.nextZ > refZ - 1700) {
        const ch = { z: this.nextZ, objs: [], obs: [], hz: [] };
        d.chunk(this.nextZ, ch, this);
        this.chunks.push(ch);
        this.nextZ -= this.CH;
      }
      for (let i = this.chunks.length - 1; i >= 0; i--) {
        const ch = this.chunks[i];
        if (ch.z > refZ + 260) { for (const o of ch.objs) { this.world.remove(o); disposeTree(o); } this.chunks.splice(i, 1); }
      }
      this.far.position.z = refZ * 0.94;
    }
    if (d.update) d.update(dt, refZ, this, playerPos);
    // hazards animate
    for (const ch of this.chunks) for (const h of ch.hz) h.update(dt, this.time);
    // sun follows the player for crisp shadows
    tmpV.set(...d.sunDir).normalize();
    this.sun.position.copy(playerPos).addScaledVector(tmpV, 400);
    this.sun.target.position.copy(playerPos);
  },
  // collision vs static scenery: returns push normal or null
  collide(p, r) {
    for (const ch of this.chunks) {
      if (Math.abs(ch.z - p.z) > this.CH * 1.5) continue;
      for (const o of ch.obs) {
        if (o.c) { if (p.distanceTo(o.c) < o.r + r) return tmpV2.copy(p).sub(o.c).normalize(); }
        else if (p.x + r > o.min.x && p.x - r < o.max.x && p.y + r > o.min.y && p.y - r < o.max.y && p.z + r > o.min.z && p.z - r < o.max.z) {
          // pick the shallowest axis
          const dx = Math.min(p.x + r - o.min.x, o.max.x - (p.x - r));
          const dy = Math.min(p.y + r - o.min.y, o.max.y - (p.y - r));
          if (dy < dx) return tmpV2.set(0, p.y > (o.min.y + o.max.y) / 2 ? 1 : -1, 0);
          return tmpV2.set(p.x > (o.min.x + o.max.x) / 2 ? 1 : -1, 0, 0);
        }
      }
      for (const h of ch.hz) if (h.active && h.hit(p, r)) return tmpV2.set(0, 1, 0);
    }
    return null;
  },
  // shots vs scenery (boolean)
  blocks(p) {
    for (const ch of this.chunks) {
      if (Math.abs(ch.z - p.z) > this.CH) continue;
      for (const o of ch.obs) {
        if (o.c) { if (p.distanceToSquared(o.c) < o.r * o.r) return true; }
        else if (p.x > o.min.x && p.x < o.max.x && p.y > o.min.y && p.y < o.max.y && p.z > o.min.z && p.z < o.max.z) return true;
      }
    }
    return false;
  },
  groundAt() { return this.def.ground ?? -1e9; },
};

function makeTree(s = 1) {
  const g = new THREE.Group();
  const trunk = tmesh(G.cyl8, 0x7a4e2a); place(trunk, 0, 2 * s, 0, 0, 0, 0, [0.6 * s, 4 * s, 0.6 * s]); g.add(trunk);
  const c = pick([0x3fae4a, 0x2f9a44, 0x58c25a]);
  const top = tmesh(G.cone, c); place(top, 0, 7 * s, 0, 0, 0, 0, [3 * s, 7 * s, 3 * s]); g.add(top);
  const top2 = tmesh(G.cone, c); place(top2, 0, 10 * s, 0, 0, 0, 0, [2.2 * s, 5 * s, 2.2 * s]); g.add(top2);
  return g;
}
function makeRoundTree(s = 1) {

}

function makeCloud(s = 1) {

// ---------- environment definitions ----------
const ENVS = {
  verdant: {
    rails: true, ground: 0,
    sky: [0x3f8fff, 0xbfe8ff, 0x9ad0ff], fog: [0xbfe8ff, 500, 1900], sunDir: [0.45, 0.8, -0.6], sunCol: 0xfff2d0, sunI: 2.4, hemi: [0xd6f0ff, 0x6a8a4a, 1.25],

const CHARS = {

  bastion: { name: 'GEN. BASTION', species: 'dog', fur: '#a87a58', fur2: '#e8d0b0', bg: '#2a3a5a', pitch: 190 },

function drawPortrait(ctx, id, mouth, blink, t) {

  // scanlines

  ctx.lineWidth = 5; ctx.strokeStyle = '#0d1020'; ctx.lineJoin = 'round';
  const shape = (fn, fill) => { ctx.beginPath(); fn(); ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); };
  const ell = (x, y, rx, ry, r = 0) => () => ctx.ellipse(x, y, rx, ry, r, 0, TAU);
  const tri = (pts) => () => { ctx.moveTo(...pts[0]); for (const p of pts.slice(1)) ctx.lineTo(...p); ctx.closePath(); };
  const sp = c.species;
  // shoulders / flight suit
  shape(tri([[14, 128], [30, 100], [98, 100], [114, 128]]), sp === 'ai' || sp === 'ai2' ? '#2a2a3a' : '#f0f0f6');
  if (sp !== 'ai' && sp !== 'ai2') shape(tri([[52, 100], [64, 118], [76, 100]]), c.bg);
  // ears
  if (sp === 'fox' || sp === 'lynx') { shape(tri([[30, 50], [26, 8], [56, 34]]), c.fur); shape(tri([[98, 50], [102, 8], [72, 34]]), c.fur); if (sp === 'lynx') { ctx.beginPath(); ctx.moveTo(26, 8); ctx.lineTo(24, -2); ctx.moveTo(102, 8); ctx.lineTo(104, -2); ctx.stroke(); } }
  if (sp === 'hare') { shape(ell(44, 18, 9, 26, -0.2), c.fur); shape(ell(84, 18, 9, 26, 0.2), c.fur); }
  if (sp === 'raccoon' || sp === 'hamster') { shape(ell(34, 36, 13, 13), c.fur); shape(ell(94, 36, 13, 13), c.fur); }
  if (sp === 'dog') { shape(ell(26, 54, 12, 22, 0.4), '#6a4a38'); shape(ell(102, 54, 12, 22, -0.4), '#6a4a38'); }
  // head
  if (sp === 'ai') {
    const k = 0.5 + 0.5 * Math.sin(t * 3);
    shape(tri([[64, 14], [104, 38], [104, 84], [64, 106], [24, 84], [24, 38]]), '#1a0a1a');
    ctx.fillStyle = `rgba(255,61,168,${0.6 + k * 0.4})`; ctx.beginPath(); ctx.ellipse(64, 60, 22, mouth ? 16 : 10, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(64, 60, 5, mouth ? 12 : 7, 0, 0, TAU); ctx.fill();

  }
  if (sp === 'ai2') {
    shape(ell(64, 60, 36, 38), '#4a4a5a'); ctx.fillStyle = '#ff3a3a'; ctx.fillRect(36, 50, 56, 12); ctx.strokeRect(36, 50, 56, 12);
    shape(ell(64, 88, 14, mouth ? 8 : 4), '#1a1a1a');
    return;
  }
  shape(ell(64, 62, 38, 36), c.fur);
  // muzzle

const Radio = {
  queue: [], cur: null, t: 0, blinkT: 2, el: null, ctx: null,
  init() { this.el = $('#radio'); this.ctx = $('#portrait').getContext('2d'); },
  say(who, text, opts = {}) {
    if (opts.urgent) { this.queue.unshift({ who, text }); if (this.cur && !this.cur.urgent) this.t = 0; }
    else this.queue.push({ who, text });
    if (this.queue.length > 6) this.queue.splice(1, this.queue.length - 6);
  },
  clear() { this.queue = []; this.cur = null; this.el.classList.add('hidden'); },
  update(dt) {
    if (this.cur) {
      this.t -= dt;
      const talking = this.t > 0.6;
      this.blinkT -= dt; if (this.blinkT < -0.12) this.blinkT = rand(1.5, 3.5);
      drawPortrait(this.ctx, this.cur.who, talking && Math.sin(performance.now() / 55) > 0, this.blinkT < 0, performance.now() / 1000);
      if (this.t <= 0) { this.cur = null; this.el.classList.add('hidden'); }
    }
    if (!this.cur && this.queue.length) {
      this.cur = this.queue.shift();
      const c = CHARS[this.cur.who];
      this.t = clamp(1.8 + this.cur.text.length * 0.045, 2.4, 6);
      this.el.querySelector('.who').textContent = c.name;
      this.el.querySelector('.text').textContent = settings.subtitles ? UI.plain(this.cur.text) : '· · ·';
      this.el.classList.remove('hidden');
      this.el.style.animation = 'none'; void this.el.offsetWidth; this.el.style.animation = '';
      Sound.voice(c.pitch, this.cur.text.length);
    }
  },
};

// orient a -Z-forward object along a direction

  fighter: { // all-range grunt

    update(e, dt, g) {
      const tgt = (e.targetW && !e.targetW.out) ? e.targetW.pos : g.player.pos;
      tmpV.copy(tgt).sub(e.pos);
      const dist = tmpV.length(); tmpV.normalize();
      if (dist < 40) tmpV.negate().add(new V3(Math.sin(e.t), 0.4, Math.cos(e.t)).multiplyScalar(0.8)).normalize();
      if (e.pos.length() > 880) tmpV.copy(e.pos).negate().normalize();
      e.dir.lerp(tmpV, 1 - Math.exp(-1.4 * dt)).normalize();
      e.pos.addScaledVector(e.dir, e.speed * dt);
      faceDir(e.mesh, e.dir);
      e.mesh.rotateZ(Math.sin(e.t * 2) * 0.6);

      if (e.targetW && dist < 120) { e.fireCd -= dt; if (e.fireCd < 0) { e.fireCd = 1; e.targetW.hp -= 2.5 * diff().enemyFire; FX.sparks(e.targetW.pos, [4, 2, 1], 4); } }
    },

  rival: { // ace pilot — evasive, persistent
    hp: 14, r: 4, score: 5,

    init(e, o) { e.dir = new V3(0, 0, 1); e.speed = 105; e.fireCd = 1.5; e.name = o.name; e.evade = 0; e.rollT = 0; e.hp = Math.round(14 * diff().enemyHp) + (o.boss ? 8 : 0); e.maxHp = e.hp; e.targetW = null; e.retarget = 0; },

      const tgt = (e.targetW && !e.targetW.out) ? e.targetW.pos : P.pos;
      tmpV.copy(tgt).sub(e.pos); const dist = tmpV.length(); tmpV.normalize();
      // evade when the player is lined up behind
      tmpV2.copy(e.pos).sub(P.pos).normalize();
      const threatened = P.fwd.dot(tmpV2) > 0.96 && e.pos.distanceTo(P.pos) < 300;
      if (threatened && e.evade <= 0 && Math.random() < dt * 1.2) { e.evade = 1.4; e.rollT = 0.6; e.evDir = new V3().randomDirection(); }
      if (e.evade > 0) { e.evade -= dt; tmpV.copy(e.evDir).add(e.dir).normalize(); }
      if (dist < 50) tmpV.negate().add(new V3(0, 0.6, 0)).normalize();
      if (e.pos.length() > 860) tmpV.copy(e.pos).negate().normalize();
      e.dir.lerp(tmpV, 1 - Math.exp(-2.2 * dt)).normalize();
      e.pos.addScaledVector(e.dir, (e.evade > 0 ? 150 : e.speed) * dt);
      faceDir(e.mesh, e.dir);
      e.rollT -= dt;
      if (e.rollT > 0) e.mesh.rotateZ((0.6 - e.rollT) / 0.6 * TAU * 2);
      e.fireCd -= dt;
      tmpV2.copy(tgt).sub(e.pos).normalize();
      if (e.fireCd <= 0 && dist < 420 && e.dir.dot(tmpV2) > 0.9) {
        e.fireCd = rand(0.35, 0.7) / diff().enemyFire;
        if (e.targetW) { e.targetW.hp -= 2.2; FX.sparks(e.targetW.pos, [4, 2, 1], 4); g.spawnBullet(e.pos, e.dir.clone().multiplyScalar(260), { dmg: 0, life: 0.5, mat: BULLET_MAT }); }
        else g.spawnBullet(e.pos, tmpV2.clone().lerp(e.dir, 0.3).normalize().multiplyScalar(260), { dmg: 7, life: 2 });

  playerRails(ctl, dt) {

  playerFree(ctl, dt) {

        FX.explode(w.pos, 0.8); Sound.play('wingdown');
        Radio.say(w.id, { rook: 'Argh — I\'m hit bad! Heading back to the Carrier for repairs.', mabel: 'Systems failing... I\'m out, Kit. Fly safe.', pip: 'Engines smoking! Returning to base — sorry Kit!' }[w.id], { urgent: true });
        if (w.chaser && !w.chaser.dead) w.chaser.remove = true;
        continue;
      }
      let target;
      if (this.rails) {
        if (w.state === 'rescue') target = tmpV.set(w.side * 14, this.bounds.yMid + 6 + Math.sin(w.t * 2) * 4, this.railZ - 70);
        else target = tmpV.set(w.off.x + Math.sin(w.t * 0.6 + w.k) * 6, clamp(this.bounds.yMid + w.off.y + Math.cos(w.t * 0.5 + w.k) * 3, this.bounds.yMin + 4, this.bounds.yMax + 10), this.railZ + w.off.z);
        if (this.phase === 'clear') target.z = this.railZ - 200;
        const px = w.pos.x;
        w.pos.x = damp(w.pos.x, target.x, 1.8, dt); w.pos.y = damp(w.pos.y, target.y, 1.8, dt); w.pos.z = damp(w.pos.z, target.z, 2.4, dt);
        const vx = (w.pos.x - px) / Math.max(dt, 1e-4);
        body.rotation.set(0, 0, damp(body.rotation.z, -vx * 0.03, 4, dt));
        w.dir.set(0, 0, -1);
        if (w.state === 'rescue' && (!w.chaser || w.chaser.dead)) {
          w.state = 'form'; this.run.wingHP[w.id] = w.hp;
          if (w.chaser && w.chaser.killedByPlayer) Radio.say(w.id, { rook: 'Heh. Didn\'t need your help... but thanks.', mabel: 'Lovely shooting, Kit. Thank you!', pip: 'Phew! You saved my tail, Kit!' }[w.id]);
        }
      } else {
        // all-range: hunt nearby grunts, otherwise escort the player

        if (w.prey) target = tmpV.copy(w.prey.pos); else target = tmpV.copy(this.player.pos).addScaledVector(this.player.fwd, -30).add(tmpV2.copy(w.off).multiplyScalar(1.5));
        if (w.danger) target.add(tmpV2.set(Math.sin(w.t * 1.3) * 120, Math.cos(w.t) * 60, Math.cos(w.t * 1.3) * 120));
        if (w.pos.length() > 850) target.set(0, 0, 0);
        tmpV2.copy(target).sub(w.pos).normalize();
        w.dir.lerp(tmpV2, 1 - Math.exp(-1.6 * dt)).normalize();
        w.pos.addScaledVector(w.dir, (w.danger ? 105 : 92) * dt);
        faceDir(w.mesh, w.dir);
        body.rotation.set(0, 0, Math.sin(w.t) * 0.4);
      }
      // wingmen shoot at enemies ahead
      w.fireCd -= dt;
      if (w.fireCd <= 0 && this.phase === 'play') {
        w.fireCd = rand(0.9, 2.2);
        const e = this.enemies.find((e) => !e.dead && !e.armored && e.kind !== 'part' && e.kind !== 'chaser' && e.pos.distanceTo(w.pos) < 320 && (this.rails ? e.pos.z < w.pos.z : true));
        if (e) {
          const d = tmpV2.copy(e.pos).sub(w.pos).normalize().multiplyScalar(500);
          const s = this.addShot('wing', tmpV3.copy(w.pos).addScaledVector(d, 0.01), d, 1);
          s.wing = true;
        }

    }
  },
  startRescue(id) {
    const w = this.wingman(id);

    w.state = 'rescue'; w.side = w.off.x < 0 ? -1 : 1;
    const c = this.spawn('chaser', tmpV.copy(w.pos).add(new V3(0, 2, 14)), { wing: w });
    c.hp = Math.round(4 * diff().enemyHp); w.chaser = c;

  },

  // ---------------- enemies ----------------
  spawn(kind, pos, o = {}) {
    const def = ENEMIES[kind];
    const mesh = def.make(o);
    mesh.position.copy(pos);
    if (o.scale) mesh.scale.setScalar(o.scale);
    this.world.add(mesh);
    const e = { kind, mesh, pos: mesh.position, hp: Math.max(1, Math.round((o.hp ?? def.hp) * (kind === 'part' ? 1 : diff().enemyHp))), r: o.r ?? def.r, score: o.score ?? def.score, t: 0, dead: false, remove: false, flashT: 0, formation: o.formation, ground: def.ground, baseScale: mesh.scale.x };
    e.maxHp = e.hp;
    def.init(e, o);
    if (o.dirX) e.dirX = o.dirX;
    this.enemies.push(e);
    return e;
  },
  enemyShoot(e, dt, rate, o = {}) {
    if (this.phase !== 'play' || this.player.dead) return;
    e.fireCd -= dt * rate * diff().enemyFire;
    if (e.fireCd > 0) return;
    e.fireCd = rand(1.8, 3.4);
    const from = o.from || e.pos;
    const P = this.player;
    const spd = o.fire ? 95 : 125;
    const dist = from.distanceTo(P.pos);
    const aim = tmpV.copy(P.pos).addScaledVector(P.vel, (dist / spd) * diff().aim);
    const dir = aim.sub(from).normalize();
    dir.x += rand(-1, 1) * (1 - diff().aim) * 0.06; dir.y += rand(-1, 1) * (1 - diff().aim) * 0.06;
    dir.normalize();
    const v = dir.multiplyScalar(spd);
    this.spawnBullet(from, v, o.fire ? { dmg: 10, kind: 'fire', r: 2 } : { dmg: 6 });
    Sound.play('eshot');
  },
  spawnBullet(pos, vel, o = {}) {
    let mesh;
    if (o.kind === 'missile') mesh = makeMissile();
    else if (o.kind === 'fire') mesh = makeFireball();
    else { mesh = new THREE.Mesh(G.sphereLo, o.mat || BULLET_MAT); mesh.scale.setScalar(o.size || 0.9); }
    mesh.position.copy(pos);
    this.world.add(mesh);
    const b = { mesh, pos: mesh.position, vel: vel.clone(), life: o.life ?? 5, dmg: o.dmg ?? 6, r: o.r ?? 1.2, kind: o.kind || 'bullet', hp: o.kind === 'missile' ? 1 : 0, deflected: false, dead: false, turn: o.turn || 0 };
    if (b.kind === 'missile') { b.hp = 1; b.lockable = true; }
    this.bullets.push(b);
    return b;
  },
  damageEnemy(e, dmg, src) {
    if (e.dead) return false;
    if (e.armored) { FX.sparks(e.pos, [3, 3, 4], 6); Sound.play('ping'); return false; }
    e.hp -= dmg; e.flashT = 0.1;
    FX.sparks(e.pos, [4, 3.5, 1.5], 6);
    if (e.onHit) e.onHit(e, dmg, this);
    if (e.hp <= 0) { this.killEnemy(e, src !== 'wing', src); return true; }
    Sound.play('hit');
    return false;
  },
  killEnemy(e, byPlayer, src) {
    if (e.dead) return;
    e.dead = true; e.remove = true; e.killedByPlayer = byPlayer;
    if (!e.noExplode) { FX.explode(e.pos, clamp(e.r / 3.5, 0.6, 3)); Sound.play('explode', clamp(e.r / 4, 0.6, 2)); }
    if (byPlayer && !this.attract) {
      this.run.hits += e.score;
      if (this.run.hits >= this.run.nextLife) { this.run.nextLife += 100; this.run.lives++; Sound.play('1up'); UI.hint('1-UP! EXTRA SHIP', 2); }
    }
    if (e.formation) {
      const f = this.formations[e.formation];
      if (f) { if (byPlayer) f.killed++; f.left--; if (f.left <= 0 && f.killed === f.n && f.drop) { const p = e.pos.clone(); if (this.rails) { p.x = clamp(p.x, -this.bounds.x, this.bounds.x); p.y = clamp(p.y, this.bounds.yMin, this.bounds.yMax); if (p.z > this.railZ - 40) p.z = this.railZ - 60; } this.spawnItem(f.drop, p); } }
    }
    const def = ENEMIES[e.kind];
    if (def.onDeath) def.onDeath(e, this);
    if (e.onDeath) e.onDeath(e, this);
  },
  areaDamageEnemies(c, r, dmg, src) {
    let kills = 0;
    for (const e of this.enemies) {
      if (e.dead) continue;
      if (e.pos.distanceTo(c) < r + e.r) { if (this.damageEnemy(e, dmg, src)) kills++; }
    }
    for (const b of this.bullets) if (b.hp && b.pos.distanceTo(c) < r) { b.dead = true; FX.explode(b.pos, 0.4); }
    return kills;
  },
  updateEnemies(dt) {
    for (const e of this.enemies) {
      if (e.dead) continue;
      e.t += dt;
      ENEMIES[e.kind].update(e, dt, this);
      if (e.flashT > 0) { e.flashT -= dt; e.mesh.scale.setScalar(e.baseScale * (e.flashT > 0 ? 1.15 : 1)); }
      // body collision with player
      const P = this.player;
      if (!P.dead && e.kind !== 'part' && e.pos.distanceTo(P.pos) < e.r + 2.4) {
        if (P.invuln <= 0) { this.hurt(14, e.pos); this.damageEnemy(e, 4, 'ram'); }
      } else if (!P.dead && e.kind === 'part' && e.solid && e.pos.distanceTo(P.pos) < e.r + 2.4) {
        if (P.invuln <= 0) this.hurt(10, e.pos);
        tmpV.copy(P.pos).sub(e.pos).normalize();
        if (this.rails) { P.vx += tmpV.x * 60; P.vy += tmpV.y * 60; } else P.pos.addScaledVector(tmpV, 8);
      }
    }
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (e.remove) {
        if (e.kind !== 'part' || e.ownMesh) this.world.remove(e.mesh);
        this.enemies.splice(i, 1);
        if (!e.dead && e.formation && this.formations[e.formation]) this.formations[e.formation].left--;
      }
    }
  },

  // ---------------- projectiles ----------------
  updateShots(dt) {
    for (const s of this.shots) {
      if (s.dead) continue;
      s.prev.copy(s.pos);
      if (s.target && !s.target.dead && (s.type === 'charge' || s.type === 'bomb')) {
        tmpV.copy(s.target.pos).sub(s.pos);
        const spd = s.vel.length();
        s.vel.lerp(tmpV.normalize().multiplyScalar(spd), 1 - Math.exp(-9 * dt));
        if (s.pos.distanceTo(s.target.pos) < s.target.r + 3) { this.detonate(s); continue; }
      }
      s.pos.addScaledVector(s.vel, dt);
      s.life -= dt;
      if (s.type === 'charge' || s.type === 'bomb') { s.mesh.rotation.y += dt * 6; FX.emit(s.pos.x, s.pos.y, s.pos.z, rand(-3, 3), rand(-3, 3), rand(-3, 3), s.type === 'bomb' ? 4 : 1, s.type === 'bomb' ? 1 : 4, s.type === 'bomb' ? 3 : 1.2, 1.2, 0.3, 3); }
      if (s.life <= 0) { if (s.type === 'charge' || s.type === 'bomb') this.detonate(s); else s.dead = true; continue; }
      if (Env.blocks(s.pos)) { if (s.type === 'charge' || s.type === 'bomb') this.detonate(s); else { s.dead = true; FX.sparks(s.pos, [3, 4, 2], 5); } continue; }
      for (const e of this.enemies) {
        if (e.dead) continue;
        if (segSphere(s.prev, s.pos, e.pos, e.r + (s.type === 'hyper' ? 0.8 : 0.3))) {
          if (s.type === 'charge' || s.type === 'bomb') { this.detonate(s); }
          else { this.damageEnemy(e, s.wing ? 0.5 : s.dmg, s.wing ? 'wing' : 'laser'); s.dead = true; }
          break;
        }
      }
      if (s.dead) continue;
      if (!s.wing) for (const b of this.bullets) {
        if (b.hp && !b.dead && segSphere(s.prev, s.pos, b.pos, 2.4)) { b.dead = true; FX.explode(b.pos, 0.4); Sound.play('explode', 0.4); if (s.type !== 'charge' && s.type !== 'bomb') s.dead = true; break; }
      }
    }
    for (let i = this.shots.length - 1; i >= 0; i--) if (this.shots[i].dead) { this.world.remove(this.shots[i].mesh); this.shots.splice(i, 1); }
  },
  updateBullets(dt) {
    const P = this.player;
    for (const b of this.bullets) {
      if (b.dead) continue;
      if (b.turn && !b.deflected && !P.dead) {
        tmpV.copy(P.pos).sub(b.pos).normalize().multiplyScalar(b.vel.length());
        b.vel.lerp(tmpV, 1 - Math.exp(-b.turn * dt));
      }
      b.pos.addScaledVector(b.vel, dt);
      if (b.kind === 'missile') { faceDir(b.mesh, tmpV.copy(b.vel).normalize()); if (Math.random() < 0.8) FX.emit(b.pos.x, b.pos.y, b.pos.z, rand(-2, 2), rand(-2, 2), rand(-2, 2), 2, 2, 2, 0.8, 0.5, 1); }
      if (b.kind === 'fire') { b.mesh.rotation.x += dt * 5; if (Math.random() < 0.6) FX.emit(b.pos.x, b.pos.y, b.pos.z, rand(-3, 3), rand(-3, 3), rand(-3, 3), 4, 1.4, 0.2, 1.2, 0.4, 1); }
      b.life -= dt;
      if (b.life <= 0 || (this.rails && b.pos.z - this.railZ > 80)) { b.dead = true; continue; }
      if (b.deflected) {
        for (const e of this.enemies) if (!e.dead && b.pos.distanceTo(e.pos) < e.r + 2) { this.damageEnemy(e, 2, 'deflect'); b.dead = true; break; }
        continue;
      }
      if (P.dead || b.dmg <= 0) continue;
      const d = b.pos.distanceTo(P.pos);
      if (P.rollT > 0 && d < b.r + 6.5) {
        b.deflected = true; b.vel.negate().multiplyScalar(1.6).add(tmpV.set(rand(-20, 20), rand(-20, 20), 0)); b.life = 1.5;
        if (b.mesh.isMesh) b.mesh.material = DEFLECT_MAT;
        Sound.play('deflect'); FX.sparks(b.pos, [3, 4, 4], 8);
        continue;
      }
      if (d < b.r + 2.2) {
        b.dead = true;
        if (b.kind === 'missile' || b.kind === 'fire') FX.explode(b.pos, 0.6);
        this.hurt(b.dmg, b.pos);
      }
    }
    for (let i = this.bullets.length - 1; i >= 0; i--) if (this.bullets[i].dead) { this.world.remove(this.bullets[i].mesh); this.bullets.splice(i, 1); }
  },

  // ---------------- items & gates ----------------
  spawnItem(kind, pos) {
    const mesh = ITEM_DEFS[kind].make(); mesh.position.copy(pos); this.world.add(mesh);
    const it = { kind, mesh, pos: mesh.position, r: ITEM_DEFS[kind].r, t: 0 };
    this.items.push(it);
    return it;
  },
  updateItems(dt) {
    const P = this.player;
    for (const it of this.items) {
      it.t += dt;
      if (it.kind === 'silver' || it.kind === 'gold' || it.kind === 'checkpoint') it.mesh.rotation.y += dt * (it.kind === 'checkpoint' ? 0.6 : 2.5);
      else { it.mesh.rotation.y += dt * 1.5; it.mesh.rotation.x += dt; it.mesh.position.y += Math.sin(it.t * 3) * 0.05; }
      if (this.rails && it.pos.z - this.railZ > 60) { it.dead = true; continue; }
      if (!P.dead && it.pos.distanceTo(P.pos) < it.r + 2.5) { it.dead = true; this.collect(it); }
    }
    for (let i = this.items.length - 1; i >= 0; i--) if (this.items[i].dead) { this.world.remove(this.items[i].mesh); this.items.splice(i, 1); }
    for (const g of this.gates) {
      if (g.done) continue;
      g.mesh.children[3].material.color.setScalar(1 + Math.sin(this.time * 6) * 0.5).multiply(new THREE.Color(4, 3, 0.8)).multiplyScalar(0.25);
      if (P.pos.z < g.pos.z) {
        g.done = true;
        if (Math.abs(P.pos.x - g.pos.x) < 8.5 && P.pos.y > g.pos.y - 24 && P.pos.y < g.pos.y + 8.5) {
          this.stageGates = (this.stageGates || 0) + 1; this.run.hits += 1;
          Sound.play('gate'); FX.ring(g.pos, 20, [4, 3, 0.8], 0.6, new V3(0, 0, 1)); g.mesh.children[3].material = glowMat(0.6, 4, 1);
          UI.hint(`GOLDEN GATE ${this.stageGates} / ${this.S.gates}`, 1.4);
          if (this.stageGates === this.S.gates) { this.run.emberUnlocked = true; Radio.say('pip', 'All five gates! They were powering a hidden warp beacon — new route unlocked: EMBER SEA!', { urgent: true }); Sound.play('1up'); }
        } else Sound.play('back');
      }
    }
  },
  collect(it) {
    const P = this.player, r = this.run;
    switch (it.kind) {
      case 'silver': P.shield = Math.min(r.maxShield, P.shield + 20); Sound.play('ring'); FX.ring(it.pos, 10, [3, 3, 3.5], 0.4); break;
      case 'gold':
        P.shield = Math.min(r.maxShield, P.shield + 30); r.golds++; Sound.play('gold'); FX.ring(it.pos, 14, [4, 3, 0.8], 0.5);
        if (r.golds >= 3) { r.golds = 0; if (r.maxShield < 160) { r.maxShield += 30; P.shield = r.maxShield; UI.hint('SHIELD CAPACITY UP!', 2); } else { r.lives++; UI.hint('1-UP! EXTRA SHIP', 2); Sound.play('1up'); } }
        break;
      case 'checkpoint':
        P.shield = Math.min(r.maxShield, P.shield + 40); Sound.play('checkpoint'); FX.ring(it.pos, 40, [0.6, 3, 4.5], 0.7);
        this.checkpointD = this.dist; this.checkpointHits = r.hits; UI.hint('CHECKPOINT', 1.6);

      case 'laser':
        if (this.laserLevel() !== P.laser) { P.wingHp.L = P.wingHp.R = 3; P.mesh.userData.wings.L.visible = P.mesh.userData.wings.R.visible = true; }
        P.laser = Math.min(2, P.laser + 1); r.laser = P.laser; Sound.play('item'); UI.hint(P.laser === 1 ? 'TWIN LASERS!' : 'HYPER LASERS!', 1.6);
        Radio.say('pip', P.laser === 1 ? 'Twin lasers online — double the fun!' : 'Hyper lasers! Now THAT\'s firepower!');
        break;
      case 'bomb': P.bombs = Math.min(9, P.bombs + 1); r.bombs = P.bombs; Sound.play('item'); UI.hint('+1 NOVA BOMB', 1.4); break;
      case 'wing': P.wingHp.L = P.wingHp.R = 3; P.mesh.userData.wings.L.visible = P.mesh.userData.wings.R.visible = true; P.shield = Math.min(r.maxShield, P.shield + 25); Sound.play('item'); UI.hint('WINGS REPAIRED', 1.4); break;
    }
  },
  spawnGate(x, y, z) {
    const mesh = makeGate(); mesh.position.set(x, y, z); this.world.add(mesh);
    this.gates.push({ mesh, pos: mesh.position, done: false });
  },

  // ---------------- events ----------------
  runEvent(ev) {
    const ahead = this.railZ - (ev.ahead ?? 650);
    const B = this.bounds;
    switch (ev.t) {
      case 'wave': {
        const id = 'f' + Math.random().toString(36).slice(2, 7);
        this.formations[id] = { n: ev.n, killed: 0, left: ev.n, drop: ev.drop };
        for (let i = 0; i < ev.n; i++) {
          let x = ev.x ?? 0, y = ev.y ?? B.yMid, z = ahead, o = { formation: id, pattern: ev.shape === 'cross' ? 'cross' : ev.pattern, color: ev.color, ph: i * 0.6, amp: ev.amp };
          const sp = ev.spread ?? 9;
          if (ev.shape === 'v') { x += (i - (ev.n - 1) / 2) * sp; z += Math.abs(i - (ev.n - 1) / 2) * 14; }
          else if (ev.shape === 'line') { x += (i - (ev.n - 1) / 2) * sp; }
          else if (ev.shape === 'column') { z -= i * 24; o.ph = 0; }
          else if (ev.shape === 'ring') { const a = (i / ev.n) * TAU; x += Math.cos(a) * sp; y += Math.sin(a) * sp; }
          else if (ev.shape === 'behind') { x = (i - (ev.n - 1) / 2) * 14 + (ev.x || 0); z = this.railZ + 70 + i * 8; y = B.yMid + rand(-8, 8); }
          else if (ev.shape === 'cross') { x = ev.side * (150 + i * 18); z = this.railZ - 240 - i * 10; o.dirX = -ev.side; }
          this.spawn(ev.enemy, new V3(x, y, z), o);
        }
        break;
      }
      case 'ground':
        for (const [x, dz] of ev.list) this.spawn(ev.enemy, new V3(x, Env.def.ground || 0, ahead - (dz || 0)), { dirX: x < 0 ? 1 : -1 });
        break;
      case 'mines':
        for (let i = 0; i < ev.n; i++) this.spawn('mine', new V3(rand(-B.x, B.x), rand(B.yMin, B.yMax), ahead - i * (ev.gap || 30)), {});
        break;
      case 'asteroids':
        for (let i = 0; i < ev.n; i++) this.spawn('asteroid', new V3(rand(-B.x - 10, B.x + 10), rand(B.yMin, B.yMax), ahead - i * (ev.gap || 25)), { size: rand(5, 11) });
        break;
      case 'radio': Radio.say(ev.who, ev.text, { urgent: ev.urgent }); break;
      case 'rings':
        for (let i = 0; i < (ev.n || 1); i++) this.spawnItem(ev.kind || 'silver', new V3((ev.x || 0) + (ev.dx || 0) * i, (ev.y ?? B.yMid) + (ev.dy || 0) * i, ahead - i * 30));
        break;
      case 'item': this.spawnItem(ev.kind, new V3(ev.x || 0, ev.y ?? B.yMid, ahead)); break;
      case 'checkpoint': this.spawnItem('checkpoint', new V3(0, B.yMid, ahead)); break;
      case 'gate': this.spawnGate(ev.x, ev.y ?? 26, ahead); break;
      case 'rescue': this.startRescue(ev.who); break;
      case 'banner': UI.banner(ev.text, ev.sub || '', ev.dur || 2.5); if (ev.sound) Sound.play(ev.sound); break;
      case 'hint': if (!this.attract) UI.hint(ev.text, ev.dur || 3.5); break;
      case 'boss': this.startBoss(ev.boss); break;
      case 'fn': ev.fn(this); break;
    }
  },
  startBoss(id) {
    const def = BOSSES[id];
    this.boss = def.create(this);
    this.boss.def = def; this.boss.total = this.boss.hpTotal();
    $('#hud-boss').classList.remove('hidden'); $('#hud-boss .name').textContent = def.name;
    Sound.playMusic('boss'); Sound.play('alarm');
    UI.banner('WARNING', def.name, 2.5);
  },
  bossDefeated() {
    const b = this.boss;
    this.phase = 'clear'; this.phaseT = 0; this.player.invuln = 99;
    $('#hud-boss').classList.add('hidden');
    for (const e of this.enemies) if (!e.dead && e.kind !== 'part') this.killEnemy(e, false);
    for (const bl of this.bullets) bl.dead = true;
    Sound.chargeStop();
    if (!this.attract) { this.run.hits += b.def.bonus || 10; UI.hint(`BOSS BONUS +${b.def.bonus || 10}`, 2); }
  },

  // ---------------- attract-mode autopilot (cheats freely) ----------------
  aiControl(dt) {
    const P = this.player, ai = this.ai || (this.ai = { t: 0, fireT: 0, tgt: null, retarget: 0, chargeT: 6, holding: 0, bombT: 10, loopT: 14, boostT: 5, rollT: 3 });
    ai.t += dt;
    const c = { mx: 0, my: 0, fireP: false, fireD: false, fireR: false, bombP: false, rollLP: false, rollRP: false, rollL: false, rollR: false, boost: false, brake: false, loopP: false };
    ai.retarget -= dt;
    if (ai.retarget <= 0 || !ai.tgt || ai.tgt.dead) {
      ai.retarget = 0.4; ai.tgt = null; let bd = 1e9;
      for (const e of this.enemies) {
        if (e.dead || e.armored) continue;
        const rz = e.pos.z - this.railZ;
        if (this.rails && (rz > -15 || rz < -520)) continue;

      }
    }
    if (this.rails) {
      const B = this.bounds;
      let tx = Math.sin(ai.t * 0.4) * 20, ty = B.yMid + Math.sin(ai.t * 0.7) * 8;
      if (ai.tgt) { tx = clamp(ai.tgt.pos.x, -B.x, B.x); ty = clamp(ai.tgt.pos.y, B.yMin + 2, B.yMax); }
      c.mx = clamp((tx - P.ox) / 7, -1, 1); c.my = clamp(-(ty - P.oy) / 7, -1, 1);
    } else {
      const tgtPos = ai.tgt ? ai.tgt.pos : tmpV2.set(Math.sin(ai.t * 0.2) * 300, 50, Math.cos(ai.t * 0.2) * 300);
      tmpV.copy(tgtPos).sub(P.pos).normalize();
      const dy = Math.atan2(-tmpV.x, -tmpV.z);
      let err = dy - P.yaw; while (err > Math.PI) err -= TAU; while (err < -Math.PI) err += TAU;
      c.mx = clamp(-err * 2, -1, 1);
      c.my = clamp(-(Math.asin(clamp(tmpV.y, -1, 1)) - P.pitch) * 2.5, -1, 1);
    }
    // weapons

    if (ai.holding > 0) { ai.holding -= dt; c.fireD = true; if (ai.holding <= 0) c.fireR = true; }
    else if (ai.chargeT <= 0 && ai.tgt) { ai.chargeT = rand(5, 8); ai.holding = 1.1; c.fireP = true; c.fireD = true; }
    else { ai.fireT -= dt; if (ai.fireT <= 0 && ai.tgt) { ai.fireT = 0.13; c.fireP = true; c.fireR = true; } }
    ai.bombT -= dt; if (ai.bombT <= 0 && this.enemies.filter((e) => !e.dead).length >= 3) { ai.bombT = rand(12, 18); c.bombP = true; }
    ai.rollT -= dt; if (ai.rollT <= 0 && this.bullets.some((b) => !b.dead && b.pos.distanceTo(P.pos) < 30)) { ai.rollT = 1.5; if (Math.random() < 0.5) c.rollLP = true; else c.rollRP = true; }
    ai.loopT -= dt; if (ai.loopT <= 0) { ai.loopT = rand(14, 20); c.loopP = true; }
    ai.boostT -= dt; if (ai.boostT < 0) { c.boost = true; if (ai.boostT < -1) ai.boostT = rand(5, 9); }

  },

  // ---------------- main update ----------------
  update(dt) {
    if (this.mode !== 'play' && !(this.showcase && this.mode === 'title')) return;
    this.time += dt; this.phaseT += dt;
    const P = this.player;
    const ctl = this.attract ? this.aiControl(dt) : this.humanControl();
    if (this.attract) { P.shield = this.run.maxShield; P.invuln = Math.max(P.invuln, 0.2); }
    if (this.phase === 'intro' && this.phaseT > 2.0) this.phase = 'play';
    if (this.rails) {
      let target = this.S.speed || 75;
      if (P.boosting) target *= 1.85; else if (P.braking) target *= 0.5;
      if (this.phase === 'clear') target = 60 + this.phaseT * 60;
      if (this.boss && this.boss.lockSpeed && this.phase !== 'clear') target = this.S.speed || 75;
      this.speed = damp(this.speed, target, 3, dt);
      this.railZ -= this.speed * dt; this.dist += this.speed * dt;
    }
    if (this.phase !== 'clear') this.updatePlayer(ctl, dt);
    else this.updateClear(dt);
    if (this.rails) { while (this.evIdx < this.events.length && this.events[this.evIdx].d <= this.dist) this.runEvent(this.events[this.evIdx++]); }
    if (this.S.director && this.phase !== 'clear') this.S.director(this, dt);
    if (this.boss && !this.boss.dead) { this.boss.update(dt); if (this.boss.hpTotal() <= 0 && !this.boss.dying) { this.boss.dying = true; this.boss.dieT = 0; } }
    if (this.boss && this.boss.dying && !this.boss.dead) {
      this.boss.dieT += dt;
      if (Math.random() < dt * 14) FX.explode(tmpV.copy(this.boss.center()).add(new V3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(this.boss.size || 20)), rand(1, 2.5));
      if (this.boss.dieT > 2.6) { this.boss.dead = true; this.boss.finish(); FX.explode(this.boss.center(), 6); FX.white = 0.9; Sound.play('bigexplode'); Sound.rumble(1200, 1, 1); this.bossDefeated(); }
    }
    this.updateEnemies(dt);
    this.updateShots(dt);
    this.updateBullets(dt);
    this.updateItems(dt);
    this.updateWingmen(dt);
    this.updateReticles(dt);
    if (this.phase === 'dead') {
      if (this.phaseT > 2.6 && !this.attract) this.afterDeath();
    }
    if (this.phase === 'clear' && this.phaseT > 5 && !this.attract) { this.phase = 'done'; UI.fadeTo(() => UI.showResults()); }
    for (const w of this.wingmen) if (!w.out) this.run.wingHP[w.id] = Math.max(0, w.hp);
  },
  updateClear(dt) {
    const P = this.player;
    if (this.rails) {
      P.oy = damp(P.oy, this.bounds.yMid + this.phaseT * 6, 1, dt); P.ox = damp(P.ox, 0, 1, dt);
      P.pos.set(P.ox, P.oy, this.railZ + P.oz - this.phaseT * this.phaseT * 6);
      P.mesh.userData.body.rotation.set(0.25, 0, Math.sin(this.phaseT * 2) * 0.2 + (this.phaseT > 1.2 && this.phaseT < 1.8 ? (this.phaseT - 1.2) / 0.6 * TAU : 0));
    } else {
      P.pos.addScaledVector(P.fwd, (95 + this.phaseT * 60) * dt);

  afterDeath() {

  // ---------------- reticles & camera ----------------
  updateReticles() {
    const P = this.player;
    const show = !P.dead && this.phase !== 'clear' && P.loopT < 0 && P.uturnT < 0;
    this.ret1.visible = this.ret2.visible = show;
    if (show) {
      this.ret1.position.copy(P.pos).addScaledVector(P.aim, 38); this.ret1.quaternion.copy(camera.quaternion);
      this.ret2.position.copy(P.pos).addScaledVector(P.aim, 80); this.ret2.quaternion.copy(camera.quaternion);
      const onTarget = this.findLock(0.06);
      const col = P.charged ? [4, 0.8, 0.6] : onTarget ? [4, 3, 0.6] : [0.6, 4, 0.9];
      this.ret1.userData.mat.color.setRGB(...col);
      const s = 1 + P.charge * 0.4 + (P.charged ? Math.sin(this.time * 20) * 0.1 : 0);
      this.ret1.scale.setScalar(s); this.ret2.scale.setScalar(s);
    }
    const L = P.lock;
    this.lockMark.visible = !!(L && !L.dead && P.charged);
    if (this.lockMark.visible) {
      this.lockMark.position.copy(L.pos); this.lockMark.quaternion.copy(camera.quaternion); this.lockMark.rotateZ(this.time * 3 + Math.PI / 4);
      const d = L.pos.distanceTo(camera.position); this.lockMark.scale.setScalar(Math.max(L.r / 2.5, d / 60));
    }
  },
  updateCamera(dt) {
    const P = this.player;
    if (!P) return;
    const k = this.camInit ? 1 : 1 - Math.exp(-6 * dt);
    let fovT = 70 + (P.boosting ? 14 : 0) - (P.braking ? 8 : 0);
    if (this.showcase) {
      const a = this.time * 0.12;
      tmpV.set(P.pos.x + Math.sin(a) * 34, P.pos.y + 7 + Math.sin(a * 0.7) * 4, P.pos.z + Math.cos(a) * 34);
      camera.position.lerp(tmpV, this.camInit ? 1 : 1 - Math.exp(-3 * dt));
      camera.lookAt(P.pos.x - 6, P.pos.y + 2, P.pos.z);
      camera.fov = 55; camera.updateProjectionMatrix(); this.camInit = false;
      return;
    }
    if (this.phase === 'dead' || this.phase === 'wait') {
      camera.lookAt(P.pos);
    } else if (this.rails) {
      const loopPull = P.loopT >= 0 ? Math.sin(Math.min(1, P.loopT) * Math.PI) * 30 : 0;
      let cx = P.ox * 0.72, cy = P.oy * 0.78 + 5 + loopPull * 0.3, cz = this.railZ + 18 + loopPull + (P.boosting ? 4 : 0);
      if (this.phase === 'intro') { const t = clamp(this.phaseT / 2, 0, 1); cx += (1 - t) * 30; cz -= (1 - t) * 40; cy += (1 - t) * 6; }
      if (this.phase === 'clear') { const t = this.phaseT; cx = Math.sin(t * 0.6) * 30; cy = P.pos.y + 6; cz = P.pos.z + 20 + t * 6; }
      tmpV.set(cx, cy, cz);
      camera.position.lerp(tmpV, this.camInit ? 1 : k);
      if (this.phase === 'clear' || P.loopT >= 0) camera.lookAt(P.pos);
      else camera.lookAt(P.ox * 0.86, P.oy * 0.9 + 1.5, this.railZ - 40);
      camera.rotateZ(P.bank * -0.08);
    } else {
      const up = upOf(P.yaw, P.pitch, tmpV2);
      tmpV.copy(P.pos).addScaledVector(P.fwd, -21 - (P.boosting ? 5 : 0)).addScaledVector(up, 6);
      if (P.uturnT >= 0) tmpV.copy(P.pos).addScaledVector(P.u0f, -30).addScaledVector(P.u0u, 10);
      if (this.phase === 'intro') { const t = clamp(this.phaseT / 2, 0, 1); tmpV.x += (1 - t) * 40; tmpV.y += (1 - t) * 20; }
      if (this.phase === 'clear') tmpV.copy(P.pos).add(tmpV3.set(Math.sin(this.phaseT * 0.7) * 40, 12, Math.cos(this.phaseT * 0.7) * 40));
      camera.position.lerp(tmpV, this.camInit ? 1 : 1 - Math.exp(-5 * dt));
      camera.up.set(0, 1, 0);
      if (P.uturnT >= 0 || this.phase === 'clear') camera.lookAt(P.pos);
      else { camera.lookAt(tmpV3.copy(P.pos).addScaledVector(P.fwd, 30)); camera.rotateZ(P.bank * -0.15); }
    }
    if (FX.shake > 0) { camera.position.x += rand(-1, 1) * FX.shake; camera.position.y += rand(-1, 1) * FX.shake; }
    camera.fov = damp(camera.fov, fovT, 5, dt); camera.updateProjectionMatrix();
    this.camInit = false;
  },
};

function segSphere(a, b, c, r) {
  const abx = b.x - a.x, aby = b.y - a.y, abz = b.z - a.z;
  const acx = c.x - a.x, acy = c.y - a.y, acz = c.z - a.z;
  const ab2 = abx * abx + aby * aby + abz * abz;
  let t = ab2 > 0 ? (acx * abx + acy * aby + acz * abz) / ab2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const dx = a.x + abx * t - c.x, dy = a.y + aby * t - c.y, dz = a.z + abz * t - c.z;
  return dx * dx + dy * dy + dz * dz < r * r;
}

// helper: bind a gameplay "part" (hitbox) to a visual sub-object of the boss
function bindPart(g, vis, o) {
  const e = g.spawn('part', vis.getWorldPosition(new V3()), Object.assign({ hp: 10, r: 6, score: 3 }, o));
  e.vis = vis; e.visBase = vis.scale.clone();
  return e;
}
function syncParts(parts) {
  for (const p of parts) {
    if (p.dead) continue;
    p.vis.getWorldPosition(p.pos);
    if (p.offset) p.pos.add(p.offset);
    if (p.flashT > 0 && !p.armored) p.vis.scale.copy(p.visBase).multiplyScalar(1.12); else p.vis.scale.copy(p.visBase);
  }
}
const alive = (p) => p && !p.dead;

function makeBeam(color = [4, 0.6, 1.2]) {
  const g = new THREE.Group();
  const core = new THREE.Mesh(G.cyl, glowMat(...color)); core.rotation.x = Math.PI / 2; g.add(core);
  const shell = new THREE.Mesh(G.cyl, glowMat(color[0] * 0.5, color[1] * 0.5, color[2] * 0.5, { transparent: true, opacity: 0.4, depthWrite: false })); shell.rotation.x = Math.PI / 2; shell.scale.set(1.8, 1, 1.8); g.add(shell);
  g.visible = false;
  return g;
}
