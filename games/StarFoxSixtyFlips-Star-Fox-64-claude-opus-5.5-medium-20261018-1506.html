      g.spawnItem('bomb', new V3(300, 0, 0)); g.spawnItem('bomb', new V3(-300, 0, 0));
    },
    director(g, dt) {
      const D = g.directorState; D.t += dt;
      const live = (k) => g.enemies.filter((e) => !e.dead && e.kind === k).length;
      if (D.phase === 0) {
        if (D.t > 0.5 && !D.a) { D.a = 1; if (!g.attract) UI.banner('ALL-RANGE MODE', 'FREE FLIGHT — WATCH YOUR RADAR', 3); Radio.say('bastion', 'This is it — the Nexus. Sable\'s core is in there. Everything they have is between you and it.'); }
        if (D.t > 4 && !D.b) { D.b = 1; g.runEvent({ t: 'hint', text: 'ALL-RANGE: STEER FREELY · {loop} = U-TURN · HOLD {rollL}/{rollR} FOR TIGHT TURNS', dur: 5 }); }
        if (D.t > 3) { D.phase = 1; D.t = 0; D.kills = 0; for (let i = 0; i < 6; i++) g.spawn('fighter', new V3(rand(-400, 400), rand(-100, 150), rand(-500, 100)), {}); }
      } else if (D.phase === 1) {
        if (D.t > 6 && !D.c) { D.c = 1; const w = g.wingmen.filter((w) => !w.out); if (w.length) { const tw = pick(w); g.spawn('fighter', tmpV.copy(tw.pos).add(new V3(0, 0, 60)), { targetW: tw }); g.wingmanInDanger(tw); } }
        if ((live('fighter') <= 1 && D.t > 8) || D.t > 40) {
          D.phase = 2; D.t = 0;
          Radio.say('vex', 'Lynx Squadron — engage! Leave the fox to me.', { urgent: true });
          Radio.say('rook', 'Mercs incoming! Here we go!');
          Sound.play('alarm');
          const names = ['VEX', 'KAEL', 'NYRA'], cols = [0x8a4bff, 0xd84a8a, 0x4a8ad8];
          for (let i = 0; i < 3; i++) g.spawn('rival', new V3(rand(-300, 300), rand(0, 150), -700 + i * 60), { name: names[i], color: cols[i], boss: i === 0 });
          for (let i = 0; i < 3; i++) g.spawn('fighter', new V3(rand(-400, 400), rand(-100, 150), rand(-600, -200)), {});
          $('#hud-boss').classList.remove('hidden'); $('#hud-boss .name').textContent = 'LYNX SQUADRON';
        }
      } else if (D.phase === 2) {
        const rivals = g.enemies.filter((e) => e.kind === 'rival' && !e.dead);
        const tot = rivals.reduce((s, e) => s + e.hp, 0);
        D.rmax = Math.max(D.rmax || 0, tot);
        g.rivalBar = D.rmax ? tot / D.rmax : 0;
        if (D.t > 10 && !D.taunt) { D.taunt = 1; Radio.say('vex', 'Not bad... but my squadron never loses twice.'); }
        if (D.t > 22 && !D.taunt2) { D.taunt2 = 1; Radio.say('mabel', 'Use your boost to stay on their tails, Kit — and charge shots lock on!'); }
        if (live('fighter') < 2 && Math.random() < dt * 0.15) g.spawn('fighter', new V3(rand(-500, 500), rand(-100, 200), -800), {});
        if (rivals.length === 0 && D.t > 2) {
          D.phase = 3; D.t = 0; g.rivalBar = null;
          Radio.say('vex', 'Tch — pull out! This contract isn\'t worth dying for!', { urgent: true });
          $('#hud-boss').classList.add('hidden');
          g.checkpointD = 1; g.checkpointHits = g.run.hits; UI.hint('CHECKPOINT', 1.6); Sound.play('checkpoint');
        }
      } else if (D.phase === 3) {
        if (D.t > 2.5 && !D.s) { D.s = 1; Radio.say('sable', 'YOU HAVE COME FAR, LITTLE FOX. IT ENDS HERE.', { urgent: true }); }
        if (D.t > 5.5) { D.phase = 4; D.t = 0; g.startBoss('overmind'); Radio.say('pip', 'It\'s shielded by four pylons — I\'ve marked them on your radar!'); }
      }
      // keep a trickle of rings for long fights
      D.ringT += dt;
      if (D.ringT > 25 && g.items.length < 8) { D.ringT = 0; g.spawnItem(Math.random() < 0.2 ? 'gold' : 'silver', new V3().randomDirection().multiplyScalar(rand(250, 600))); }
    },
  },
};

// campaign route graph
const ROUTE = { verdant: ['shard', 'ember'], shard: ['nexus'], ember: ['nexus'], nexus: [] };
const MAP_POS = { verdant: [12, 50], shard: [48, 26], ember: [48, 76], nexus: [86, 50] };

// ===================== UI: controller-first menus, HUD, screens =====================
const UI = {
  menu: null, bannerT: 0, hintT: 0, stack: [],
  plain(s) { return s.replace(/\{(\w+)\}/g, (m, a) => { const g = GLYPH[Input.last === 'pad' ? 'pad' : 'kb'][a]; return g ? `[${g[0]}]` : m; }); },
  rich(s) { return s.replace(/\{(\w+)\}/g, (m, a) => (GLYPH.pad[a] ? glyph(a) : m)); },
  refreshGlyphs() {
    document.querySelectorAll('[data-glyph]').forEach((el) => {
      const g = GLYPH[Input.last === 'pad' ? 'pad' : 'kb'][el.dataset.glyph];
      el.textContent = g[0]; el.className = `g ${g[1]}`;
    });
  },
  showHUD(on) { $('#hud').classList.toggle('hidden', !on); },
  banner(text, sub = '', dur = 2.5) {
    const b = $('#banner'); b.innerHTML = `${text}${sub ? `<small>${sub}</small>` : ''}`; b.classList.add('show'); this.bannerT = dur;
  },
  hint(text, dur = 3) { const h = $('#hint'); h.innerHTML = this.rich(text); h.classList.add('show'); this.hintT = dur; },
  fadeTo(fn) {
    const f = $('#fade'); f.classList.add('on');
    setTimeout(() => { fn(); setTimeout(() => f.classList.remove('on'), 60); }, 460);
  },
  clearScreen() { $('#screen').innerHTML = ''; this.menu = null; },
  tick(dt) {
    if (this.bannerT > 0) { this.bannerT -= dt; if (this.bannerT <= 0) $('#banner').classList.remove('show'); }
    if (this.hintT > 0) { this.hintT -= dt; if (this.hintT <= 0) $('#hint').classList.remove('show'); }
    if (this.menu) this.updateMenu();
    if (this.resultsAnim) this.resultsAnim(dt);
  },

  // ---------------- generic menu ----------------
  openMenu(o) {
    const el = document.createElement('div');
    el.className = 'scr ' + (o.cls || '');
    el.innerHTML = `${o.head || ''}${o.title ? `<div class="h1">${o.title}</div>` : ''}${o.body || ''}<div class="menu"></div>${o.footer !== false ? `<div class="footer">${this.rich(o.footer || '{confirm} SELECT &nbsp;&nbsp; {back} BACK')}</div>` : ''}`;
    $('#screen').innerHTML = ''; $('#screen').appendChild(el);
    this.menu = { o, items: o.items, idx: o.idx || 0, el, list: el.querySelector('.menu'), skip: true };
    while (this.menu.items[this.menu.idx] && this.menu.items[this.menu.idx].disabled) this.menu.idx++;
    this.renderMenu();
  },
  renderMenu() {
    const m = this.menu; if (!m) return;
    m.list.innerHTML = '';
    m.items.forEach((it, i) => {
      const d = document.createElement('div');
      d.className = 'mi' + (i === m.idx ? ' focus' : '') + (it.disabled ? ' disabled' : '');
      let val = '';
      if (it.type === 'slider') val = `<span class="arrow">◀</span><span class="slider"><i style="width:${Math.round(it.get() * 100)}%"></i></span><span class="arrow">▶</span>`;
      else if (it.type === 'toggle') val = `<span class="arrow">◀</span>${it.get() ? 'ON' : 'OFF'}<span class="arrow">▶</span>`;
      else if (it.type === 'choice') val = `<span class="arrow">◀</span>${it.options[it.get()]}<span class="arrow">▶</span>`;
      else if (it.note) val = `<span>${it.note}</span>`;
      d.innerHTML = `<span>${it.label}</span><span class="val">${val}</span>`;
      d.addEventListener('mouseenter', () => { if (!it.disabled && m.idx !== i) { m.idx = i; Sound.play('move'); this.renderMenu(); } });
      d.addEventListener('click', (e) => {
        if (it.disabled) return;
        m.idx = i;
        if (it.type === 'slider' || it.type === 'toggle' || it.type === 'choice') { const r = d.getBoundingClientRect(); this.adjust(it, e.clientX < r.left + r.width * 0.6 ? -1 : 1); }
        else this.activate(it);
      });
      m.list.appendChild(d);
    });
  },
  adjust(it, dir) {
    if (it.type === 'slider') it.set(clamp(Math.round((it.get() + dir * 0.1) * 10) / 10, 0, 1));
    else if (it.type === 'toggle') it.set(!it.get());
    else if (it.type === 'choice') it.set((it.get() + dir + it.options.length) % it.options.length);
    Sound.play('move'); this.renderMenu();
  },
  activate(it) { Sound.play('ok'); it.action(); },
  updateMenu() {
    const m = this.menu;
    if (m.skip) { m.skip = false; return; }
    const nav = Input.menuNav;
    if (nav === 'up' || nav === 'down') {
      const n = m.items.length; let i = m.idx;
      do { i = (i + (nav === 'down' ? 1 : -1) + n) % n; } while (m.items[i].disabled && i !== m.idx);
      if (i !== m.idx) { m.idx = i; Sound.play('move'); this.renderMenu(); }
    }
    const it = m.items[m.idx];
    if ((nav === 'left' || nav === 'right') && it && (it.type === 'slider' || it.type === 'toggle' || it.type === 'choice')) this.adjust(it, nav === 'left' ? -1 : 1);
    if (m.o.onNav && (nav === 'left' || nav === 'right')) m.o.onNav(nav);
    if (Input.pressed('confirm') && it && !it.disabled) {
      if (it.type === 'toggle' || it.type === 'choice') this.adjust(it, 1); else if (it.type !== 'slider') this.activate(it);
    } else if (Input.pressed('back') && m.o.back) { Sound.play('back'); m.o.back(); }
  },

  // ---------------- screens ----------------
  showTitle() {
    Game.mode = 'title';
    $('#attract').classList.add('hidden');
    Sound.playMusic('title');
    if (!Game.showcase) Main.startShowcase();
    this.showHUD(false);
    const stagesOpen = progress.unlocked.length > 1;
    this.openMenu({
      cls: 'clear',
      head: `<div class="logo">Star<span>Fox</span>Sixty<em>Flips</em></div><div class="tagline">A CEL-SHADED SQUADRON ADVENTURE</div>`,
      items: [
        { label: 'START MISSION', action: () => { Game.newRun(false); this.fadeTo(() => this.showMap()); } },
        { label: 'STAGE SELECT', note: stagesOpen ? '' : 'CLEAR A STAGE', disabled: !stagesOpen, action: () => this.showStageSelect() },
        { label: 'HOW TO PLAY', action: () => this.showHowTo(() => this.showTitle()) },
        { label: 'SETTINGS', action: () => this.showSettings(() => this.showTitle()) },
        { label: 'ABOUT & CREDITS', action: () => this.showAbout(() => this.showTitle()) },
      ],
      footer: '{confirm} SELECT &nbsp;&nbsp; {nav} NAVIGATE',
    });
    Input.idle = 0;
  },
  showStageSelect() {
    const order = ['verdant', 'shard', 'ember', 'nexus'];
    this.openMenu({
      title: 'STAGE SELECT', cls: '',
      items: [...order.map((id) => {
        const open = progress.unlocked.includes(id);
        return { label: open ? STAGES[id].name : '?????', note: open ? `${progress.medals[id] ? '<span class="medal"></span> ' : ''}BEST ${progress.best[id] || 0}` : 'LOCKED', disabled: !open, action: () => { Game.newRun(true); this.fadeTo(() => this.launch(id)); } };
      }), { label: 'BACK', action: () => this.showTitle() }],
      back: () => this.showTitle(),
    });
  },
  showHowTo(back) {
    const card = (t, d, keys) => `<div class="card"><b>${t}</b><div>${d}</div><div class="keys">${keys}</div></div>`;
    this.openMenu({
      title: 'HOW TO PLAY',
      body: `<div class="cards">
        ${card('FLY', 'Steer your Swift fighter. In all-range mode you fly freely.', '{move}')}
        ${card('LASERS & LOCK-ON', 'Tap to fire. Hold to charge, aim near a target to lock, release for a homing blast that hits groups.', '{fire} tap / hold')}
        ${card('NOVA BOMB', 'Huge blast that clears bullets. Press again to detonate early.', '{bomb}')}
        ${card('BARREL ROLL', 'Press to roll and dodge — deflects enemy shots. Hold for a hard bank.', '{rollL} {rollR}')}
        ${card('BOOST & BRAKE', 'Speed up or slow down. Both drain the boost gauge.', '{boost} {brake}')}
        ${card('SOMERSAULT / U-TURN', 'Loop to shake pursuers (rails) or reverse direction (all-range). Needs half a boost gauge.', '{loop}')}
        ${card('SQUADRON', 'Wingmen get chased — shoot their pursuers! Downed wingmen miss the next sector.', 'Watch the radio')}
        ${card('RINGS & ITEMS', 'Silver +shield, gold ×3 = bigger shield. Green = laser upgrade, pink = bomb, blue = wing repair.', 'Fly through')}
      </div>`,
      items: [{ label: 'BACK', action: back }], back,
    });
  },
  showSettings(back) {
    const S = settings;
    const mk = (label, key, type, extra = {}) => Object.assign({ label, type, get: () => S[key], set: (v) => { S[key] = v; saveSettings(); Sound.applyVolumes(); bloomPass.enabled = S.bloom; } }, extra);
    this.openMenu({
      title: 'SETTINGS',
      items: [
        mk('MASTER VOLUME', 'master', 'slider'), mk('MUSIC', 'music', 'slider'), mk('EFFECTS', 'sfx', 'slider'),
        mk('DIFFICULTY', 'difficulty', 'choice', { options: DIFF.map((d) => d.name) }),
        mk('INVERT FLIGHT Y', 'invertY', 'toggle'), mk('AIM ASSIST', 'aimAssist', 'toggle'), mk('CONTROLLER RUMBLE', 'rumble', 'toggle'),
        mk('SCREEN SHAKE', 'shake', 'toggle'), mk('RADIO SUBTITLES', 'subtitles', 'toggle'), mk('BLOOM GLOW', 'bloom', 'toggle'),
        { label: 'RESET PROGRESS', action: () => { progress.unlocked = ['verdant']; progress.best = {}; progress.medals = {}; saveProgress(); this.hint('PROGRESS RESET', 1.5); } },
        { label: 'BACK', action: back },
      ],
      back, footer: '{confirm} SELECT &nbsp;&nbsp; ◀ ▶ ADJUST &nbsp;&nbsp; {back} BACK',
    });
  },
  showAbout(back) {
    const I = BUILD_INFO;
    this.openMenu({
      title: 'ABOUT & CREDITS',
      body: `<dl class="about">
        <dt>GAME</dt><dd>StarFoxSixtyFlips — an original spiritual successor demo. All characters, names, models, music and code are original.</dd>
        <dt>DATE</dt><dd>${I.date}</dd>
        <dt>SOURCE INSPIRATION</dt><dd>${I.source}</dd>
        <dt>TECH</dt><dd>${I.tech}</dd>
        <dt>ART DIRECTION</dt><dd>${I.art}</dd>
        <dt>ENVIRONMENT</dt><dd>${I.env}</dd>
        <dt>MODEL</dt><dd>${I.model}</dd>
        <dt>USAGE</dt><dd>${I.usage}</dd>
        <dt>CAST</dt><dd>Kit Vale (fox, lead) · Rook (raccoon) · Mabel (hare) · Pip (hamster) · Gen. Bastion · Vex & Lynx Squadron · Sable</dd>
      </dl>`,
      items: [{ label: 'BACK', action: back }], back,
    });
  },
  showPause() {
    Game.mode = 'paused'; Sound.chargeStop(); $('#radio').classList.add('hidden');
    const resume = () => { this.clearScreen(); Game.mode = 'play'; Input.prev = Object.assign({}, Input.cur); if (Radio.cur) $('#radio').classList.remove('hidden'); };
    this.openMenu({
      title: 'PAUSED', cls: '',
      items: [
        { label: 'RESUME', action: resume },
        { label: 'RESTART FROM CHECKPOINT', disabled: !Game.checkpointD, action: () => { this.clearScreen(); this.fadeTo(() => Game.loadStage(Game.stageId, { startD: Game.checkpointD, respawn: true })); } },
        { label: 'RESTART STAGE', action: () => { this.clearScreen(); Game.run.hits = Game.stageEntryHits; this.fadeTo(() => Game.loadStage(Game.stageId)); } },
        { label: 'HOW TO PLAY', action: () => this.showHowTo(() => this.showPause()) },
        { label: 'SETTINGS', action: () => this.showSettings(() => this.showPause()) },
        { label: 'QUIT TO TITLE', action: () => { this.clearScreen(); this.fadeTo(() => { Game.unload(); this.showTitle(); }); } },
      ],
      back: resume,
    });
  },
  launch(id) {
    this.clearScreen();
    Game.attract = false; Game.showcase = false;
    Game.loadStage(id);
  },
  showMap() {
    Game.unload(); Game.showcase = false; Game.mode = 'map';
    this.showHUD(false); Sound.playMusic('map');
    const run = Game.run;
    const last = run.cleared[run.cleared.length - 1];
    let opts = last ? ROUTE[last].filter((id) => id !== 'ember' || run.emberUnlocked) : ['verdant'];
    if (!opts.length) opts = ['nexus'];
    let sel = 0;
    const nodes = Object.keys(MAP_POS).map((id) => {
      const [x, y] = MAP_POS[id]; const S = STAGES[id];
      const done = run.cleared.includes(id);
      const lock = !done && !opts.includes(id);
      return `<div class="node ${done ? 'done' : ''} ${lock ? 'lock' : ''}" data-id="${id}" style="left:${x}%;top:${y}%"><div class="planet" style="background:${S.planet}"></div><div class="nm">${id === 'ember' && !run.emberUnlocked && !done ? '?????' : S.name}</div><div class="st">${S.subtitle.split('—')[0]}</div></div>`;
    }).join('');
    const line = (a, b, hot) => { const [x1, y1] = MAP_POS[a], [x2, y2] = MAP_POS[b]; return `<line x1="${x1}%" y1="${y1}%" x2="${x2}%" y2="${y2}%" stroke="${hot ? '#ffd166' : '#3a3f6a'}" stroke-width="${hot ? 8 : 5}" stroke-dasharray="${hot ? '0' : '14 12'}" stroke-linecap="round"/>`; };
    const lines = [['verdant', 'shard'], ['verdant', 'ember'], ['shard', 'nexus'], ['ember', 'nexus']].map(([a, b]) => line(a, b, run.cleared.includes(a) && (run.cleared.includes(b) || opts.includes(b)))).join('');
    const render = () => {
      document.querySelectorAll('.node').forEach((n) => n.classList.toggle('sel', n.dataset.id === opts[sel]));
      const S = STAGES[opts[sel]];
      $('.mapinfo').innerHTML = `<b class="f-title" style="color:var(--gold)">${S.name}</b><br>${S.blurb}${progress.best[opts[sel]] ? `<br><span style="opacity:.75">BEST ${progress.best[opts[sel]]} HITS ${progress.medals[opts[sel]] ? '<span class="medal"></span>' : ''}</span>` : ''}`;
    };
    this.openMenu({
      title: 'LYLAT-9 SECTOR MAP', cls: 'solid',
      body: `<div class="map"><svg>${lines}</svg>${nodes}</div><div class="mapinfo"></div>
        <div style="font-size:var(--fs-s);margin:10px 0 2vh;opacity:.85">SHIPS ×${run.lives} &nbsp;·&nbsp; HITS ${run.hits} &nbsp;·&nbsp; SQUAD: ${WING_DEFS.map((d) => `${CHARS[d.id].name}${run.wingOut[d.id] ? ' (REPAIRING)' : ''}`).join(' · ')}</div>`,
      items: [{ label: 'LAUNCH', action: () => this.fadeTo(() => this.launch(opts[sel])) }, { label: 'QUIT TO TITLE', action: () => this.fadeTo(() => this.showTitle()) }],
      footer: opts.length > 1 ? '{nav} CHOOSE ROUTE &nbsp;&nbsp; {confirm} LAUNCH' : '{confirm} LAUNCH',
      onNav: (d) => { if (opts.length > 1) { sel = (sel + (d === 'right' ? 1 : opts.length - 1)) % opts.length; Sound.play('move'); render(); } },
      back: null,
    });
    document.querySelectorAll('.node').forEach((n) => n.addEventListener('click', () => { const i = opts.indexOf(n.dataset.id); if (i >= 0) { sel = i; render(); Sound.play('move'); } }));
    render();
    if (opts.length > 1) this.hint('SECRET ROUTE UNLOCKED — CHOOSE YOUR PATH', 3);
  },
  showResults() {
    const g = Game, S = g.S, run = g.run, id = g.stageId;
    g.mode = 'results';
    this.showHUD(false); Sound.playMusic('results'); Radio.clear();
    const kills = run.hits - g.stageEntryHits;
    const squad = g.wingmen.filter((w) => !w.out).length;
    const squadBonus = squad * 5;
    run.hits += squadBonus;
    const total = kills + squadBonus;
    const medal = total >= S.medal;
    progress.best[id] = Math.max(progress.best[id] || 0, total);
    if (medal) progress.medals[id] = true;
    for (const nx of ROUTE[id]) if ((nx !== 'ember' || run.emberUnlocked) && !progress.unlocked.includes(nx)) progress.unlocked.push(nx);
    saveProgress();
    run.cleared.push(id);
    for (const k of Object.keys(run.wingOut)) if (run.wingOut[k] > 0) run.wingOut[k]--;
    run.bombs = Math.max(run.bombs, g.player.bombs); run.laser = g.player.laser;
    const rows = [
      ['ENEMIES DOWNED', kills],
      ...(S.gates ? [['GOLDEN GATES', `${g.stageGates || 0} / ${S.gates}`]] : []),
      ['SQUADRON BONUS', `${squad} × 5 = ${squadBonus}`],
      ['TOTAL HITS', `<b>${total}</b>`],
      ['MEDAL (≥' + S.medal + ')', medal ? '<span class="medal"></span> EARNED' : 'NOT THIS TIME'],
    ];
    const next = run.practice ? () => this.fadeTo(() => { Game.unload(); this.showTitle(); }) : id === 'nexus' ? () => this.fadeTo(() => this.showEnding()) : () => this.fadeTo(() => this.showMap());
    this.openMenu({
      title: `${S.name} — CLEAR!`, cls: '',
      body: `<div class="results">${rows.map((r) => `<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div>`,
      items: [{ label: 'CONTINUE', action: next }],
      footer: '{confirm} CONTINUE',
    });
    let t = 0; const els = [...document.querySelectorAll('.results .row')];
    this.resultsAnim = (dt) => { t += dt; els.forEach((e, i) => { if (t > 0.3 + i * 0.35 && !e.classList.contains('in')) { e.classList.add('in'); Sound.play(i === els.length - 1 && medal ? 'gold' : 'item'); } }); if (t > 4) this.resultsAnim = null; };
    const lines = { rook: 'Not bad, Kit. Not bad at all.', mabel: 'Well flown, dear. On to the next one.', pip: 'Systems green! Ready for the next sector!' };
    const sp = g.wingmen.filter((w) => !w.out);
    if (sp.length) setTimeout(() => { const w = pick(sp); Radio.say(w.id, lines[w.id]); }, 900);
  },
  showGameOver() {
    Game.mode = 'gameover'; this.showHUD(false); Sound.playMusic('map');
    this.openMenu({
      title: 'GAME OVER', cls: '',
      body: `<div style="font-size:var(--fs-m);margin-bottom:3vh">The squadron regroups at the carrier...</div>`,
      items: [
        { label: 'CONTINUE (RESTART SECTOR)', action: () => { Game.run.lives = 3; Game.run.hits = Game.stageEntryHits; Game.run.laser = 0; Game.run.bombs = 3; this.fadeTo(() => this.launch(Game.stageId)); } },
        { label: 'QUIT TO TITLE', action: () => this.fadeTo(() => { Game.unload(); this.showTitle(); }) },
      ],
    });
  },
  showEnding() {
    Game.unload(); Game.mode = 'ending'; this.showHUD(false); Sound.playMusic('ending');
    const run = Game.run;
    this.openMenu({
      title: 'MISSION ACCOMPLISHED', cls: 'solid',
      body: `<div class="about" style="text-align:center;font-size:var(--fs-m)">
        With the Overmind silenced, Sable's fleet scatters across the Lylat-9 sector.<br><br>
        Verdant Prime celebrates. Somewhere in the dark, Vex nurses a bruised ego.<br><br>
        <b class="f-title" style="color:var(--gold)">FINAL HITS: ${run.hits}</b><br>
        ROUTE: ${run.cleared.map((id) => STAGES[id].name).join(' → ')}<br><br>
        <span style="font-size:var(--fs-s);opacity:.8">Thanks for flying StarFoxSixtyFlips! ${run.emberUnlocked ? '' : 'Tip: fly through all five Golden Gates on Verdant Prime to find the secret route.'}</span>
      </div>`,
      items: [{ label: 'CREDITS', action: () => this.showAbout(() => this.showEnding()) }, { label: 'RETURN TO TITLE', action: () => this.fadeTo(() => this.showTitle()) }],
    });
    Radio.say('bastion', 'Outstanding work, Squadron. The sector owes you one.');
    Radio.say('rook', 'Drinks are on Pip!');
    Radio.say('pip', 'Wait, WHAT?');
  },

  // ---------------- HUD ----------------
  updateHUD(g) {
    const P = g.player, run = g.run, h = this.hud || (this.hud = {});
    const set = (k, v, fn) => { if (h[k] !== v) { h[k] = v; fn(v); } };
    const sh = clamp(P.shield / run.maxShield, 0, 1);
    P.ghost = P.ghost > P.shield ? damp(P.ghost, P.shield, 3, 1 / 60) : P.shield;
    set('sh', Math.round(sh * 200), () => { $('#hud-shield .fill').style.width = `${sh * 100}%`; $('#hud-shield').classList.toggle('low', sh < 0.3); });
    set('gh', Math.round(P.ghost), () => { $('#hud-shield .ghost').style.width = `${clamp(P.ghost / run.maxShield, 0, 1) * 100}%`; });
    set('shw', run.maxShield, (v) => { $('#hud-shield').style.width = `min(${34 + (v - 100) / 5}vw, ${420 + (v - 100) * 2.5}px)`; });
    set('rings', run.golds, (v) => { $('#hud-rings').innerHTML = [0, 1, 2].map((i) => `<div class="ring ${i < v ? 'on' : ''}"></div>`).join(''); });
    const stageHits = run.hits - g.stageEntryHits;
    set('hits', run.hits, (v) => { $('#hud-hits .num').textContent = String(v).padStart(3, '0'); });
    set('medal', stageHits >= g.S.medal, (v) => { const s = $('#hud-hits .sub'); s.textContent = v ? '★ MEDAL PACE' : `MEDAL ${g.S.medal}`; s.classList.toggle('got', v); });
    set('lives', run.lives, (v) => { $('#hud-lives').innerHTML = `<div class="ico life"></div>× ${v}`; });
    set('bombs', P.bombs, (v) => { $('#hud-bombs').innerHTML = `<div class="ico bomb"></div>× ${v}`; });
    const lvl = g.laserLevel();
    set('laser', lvl + (P.wingHp.L <= 0 || P.wingHp.R <= 0 ? 10 : 0), () => { $('#hud-laser').innerHTML = (P.wingHp.L <= 0 || P.wingHp.R <= 0) ? '<span style="color:var(--bad)">WING DAMAGED</span>' : ['SINGLE LASER', 'TWIN LASER', '<span style="color:var(--accent2)">HYPER LASER</span>'][lvl]; });
    set('boost', Math.round(P.boost * 100) + (P.boostLock ? 1000 : 0), () => { const a = $('#boostarc'); a.setAttribute('stroke-dasharray', `${P.boost * 100} 100`); a.setAttribute('stroke', P.boostLock ? '#ff3d5a' : P.boosting ? '#ffffff' : '#2fd3ff'); });
    set('charge', Math.round(P.charge * 50) + (P.charged ? 100 : 0), () => { const a = $('#chargearc'); a.setAttribute('stroke-dasharray', `${P.charge * 100} 100`); a.setAttribute('stroke', P.charged ? '#ff5d6c' : '#5dff8a'); });
    // boss / rival bar
    let bb = null;
    if (g.boss && !g.boss.dead) bb = clamp(g.boss.hpTotal() / g.boss.total, 0, 1);
    else if (g.rivalBar !== null && g.rivalBar !== undefined) bb = g.rivalBar;
    if (bb !== null) set('boss', Math.round(bb * 300), () => { $('#hud-boss .fill').style.width = `${bb * 100}%`; $('#hud-boss .ghost').style.width = `${bb * 100}%`; });
    // wingmen
    const ws = WING_DEFS.map((d) => { const w = g.wingmen.find((x) => x.id === d.id); const out = !w || w.out; return `${d.id}:${out ? 'o' : Math.round(w.hp / 5)}:${w && w.danger ? 1 : 0}`; }).join('|');
    set('wing', ws, () => {
      $('#hud-wing').innerHTML = WING_DEFS.map((d) => {
        const w = g.wingmen.find((x) => x.id === d.id); const out = !w || w.out;
        return `<div class="wm ${out ? 'out' : ''} ${w && w.danger && !out ? 'danger' : ''}"><span>${CHARS[d.id].name}</span><div class="mini"><i style="width:${out ? 0 : clamp(w.hp, 0, 100)}%"></i></div></div>`;
      }).join('');
    });
    if (g.S.gates) set('gates', g.stageGates || 0, (v) => { $('#hud-gates').innerHTML = `◠ GATES ${v}/${g.S.gates}`; });
    if (!g.rails) this.drawRadar(g);
  },
  drawRadar(g) {
    const c = $('#radar'), x = c.getContext('2d'), W = c.width, R = W / 2 - 6;
    const P = g.player;
    x.clearRect(0, 0, W, W);
    x.fillStyle = 'rgba(12,16,38,.78)'; x.strokeStyle = '#0d1020'; x.lineWidth = 6;
    x.beginPath(); x.arc(W / 2, W / 2, R, 0, TAU); x.fill(); x.stroke();
    x.strokeStyle = 'rgba(47,211,255,.35)'; x.lineWidth = 2;
    x.beginPath(); x.arc(W / 2, W / 2, R * 0.5, 0, TAU); x.stroke();
    x.beginPath(); x.moveTo(W / 2, 8); x.lineTo(W / 2, W - 8); x.moveTo(8, W / 2); x.lineTo(W - 8, W / 2); x.stroke();
    const range = 900, cy = Math.cos(P.yaw), sy = Math.sin(P.yaw);
    const dot = (p, col, s, blink) => {
      if (blink && Math.sin(performance.now() / 90) < 0) return;
      const dx = p.x - P.pos.x, dz = p.z - P.pos.z;
      let rx = dx * cy - dz * sy, rz = dx * sy + dz * cy;
      let d = Math.hypot(rx, rz) / range; if (d > 1) { rx /= d; rz /= d; d = 1; }
      const px = W / 2 + (rx / range) * R, py = W / 2 + (rz / range) * R;
      x.fillStyle = col; x.strokeStyle = '#0d1020'; x.lineWidth = 3;
      x.beginPath(); x.arc(px, py, s, 0, TAU); x.fill(); x.stroke();
    };
    for (const it of g.items) dot(it.pos, it.kind === 'gold' ? '#ffd166' : '#c0c8ff', 3);
    for (const e of g.enemies) { if (e.dead || (e.kind === 'part' && (e.armored || e.lockable === false) && !e.pyl)) continue; dot(e.pos, e.kind === 'rival' ? '#b07aff' : e.pyl ? '#2fd3ff' : e.kind === 'part' ? '#ff9a3c' : '#ff3d5a', e.kind === 'rival' || e.pyl ? 6 : 4, false); }
    if (g.boss && !g.boss.dead) dot(g.boss.center(), '#ff3da8', 9);
    for (const w of g.wingmen) if (!w.out) dot(w.pos, '#5dff8a', 5, w.danger);
    x.fillStyle = '#ff8a1f'; x.strokeStyle = '#0d1020'; x.lineWidth = 3;
    x.beginPath(); x.moveTo(W / 2, W / 2 - 10); x.lineTo(W / 2 + 7, W / 2 + 7); x.lineTo(W / 2 - 7, W / 2 + 7); x.closePath(); x.fill(); x.stroke();
  },
};

// ===================== MAIN: boot, loop, title showcase, attract mode =====================
const BUILD_INFO = {
  "date": "2026-10-18 15:06",
  "source": "Star Fox 64 (Nintendo EAD, Nintendo 64, 1997)",
  "tech": "Single-file HTML5 + JavaScript ES modules; three.js r170 (0.170.0, WebGL2) with EffectComposer, UnrealBloomPass, ShaderPass, OutputPass, BufferGeometryUtils via jsDelivr CDN; Web Audio API (procedural synth music, SFX and radio babble); Gamepad API (PS5 DualSense standard mapping + rumble); Google Fonts (Russo One, Exo 2)",
  "art": "Stylized cel-shading: MeshToonMaterial with a 3-band hard light ramp, inverted-hull ink outlines with distance-scaled width, flat-shaded low-poly props, banded toon water/lava/sky shaders, bloom on emissive lasers and engines, chunky 10-foot comic-style UI",
  "env": "Claude Code CLI (terminal agent) on Linux \u2014 Ubuntu 26.04 under WSL2 (Windows host); target browser: any modern WebGL2 desktop browser; verified in headless Google Chrome 154.0.8037.57 (SwiftShader software WebGL, via Playwright) \u2014 title, attract mode, map, gameplay, pause, all four boss fights, results and ending ran with 0 console errors",
  "model": "Anthropic \u2014 Claude Opus 5.5 (claude-opus-5-5), reasoning effort: medium",
  "usage": "~$11.49 API cost (claude-opus-5-5 $11.17 + claude-haiku-5-5 $0.32); ~22.6M total tokens (opus: 22.9k input, 223.7k output, 20.7M cache read, 308.2k cache write; haiku: 1.6k input, 3.9k output, 953.0k cache read, 422.8k cache write); time: 48m 6s wall, 35m 15s API \u2014 from /usage at time of writing"
};

const Main = {
  attractT: 0, segT: 0, segIdx: 0,
  ATTRACT: [
    { stage: 'verdant', startD: 300, dur: 34 },
    { stage: 'nexus', startD: 0, dur: 40 },
    { stage: 'ember', startD: 5250, dur: 34 },
    { stage: 'shard', startD: 1400, dur: 26 },
    { stage: 'verdant', startD: 6900, dur: 34 },
  ],
  startShowcase() {
    Game.newRun(false);
    Game.attract = true; Game.showcase = true;
    Game.loadStage('verdant', { startD: 1650 });
    Game.events = []; Game.evIdx = 0; Game.phase = 'play';
    Game.mode = 'title';
    UI.showHUD(false);
    Sound.playMusic('title');
  },
  startAttract() {
    UI.clearScreen();
    this.segIdx = 0; this.attractT = 0;
    $('#attract').classList.remove('hidden');
    this.loadSeg();
  },
  loadSeg() {
    const s = this.ATTRACT[this.segIdx % this.ATTRACT.length];
    Game.newRun(false); Game.run.laser = 2; Game.run.bombs = 5;
    Game.attract = true; Game.showcase = false; Game.ai = null;
    Game.loadStage(s.stage, { startD: s.startD });
    if (s.stage === 'nexus') Game.directorState.t = 0;
    this.segT = 0;
  },
  stopAttract() {
    Game.attract = false;
    $('#attract').classList.add('hidden');
    Game.unload(); Game.showcase = false;
    UI.fadeTo(() => UI.showTitle());
    Game.mode = 'title';
  },
  update(dt) {
    if (Game.mode === 'title' && UI.menu && !Boot.blocked && Input.idle > 10 && !$('#screen .about') && !$('#screen .cards')) { this.startAttract(); return; }
    if (Game.attract && !Game.showcase && Game.mode === 'play') {
      this.attractT += dt; this.segT += dt;
      if (this.attractT > 0.8 && (Input.anyPressed() || Input.activity)) { this.stopAttract(); return; }
      const s = this.ATTRACT[this.segIdx % this.ATTRACT.length];
      if (this.segT > s.dur && !this.switching) {
        this.switching = true;
        UI.fadeTo(() => { this.segIdx++; this.loadSeg(); this.switching = false; });
      }
      return;
    }
    if (Game.mode === 'play' && !Game.attract && Input.pressed('pause') && Game.phase !== 'done' && Game.phase !== 'wait') UI.showPause();
  },
};

const Boot = {
  blocked: false,
  touchOnly() {
    try { return navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches; } catch (e) { return false; }
  },
  inputAvailable() {
    if (!this.blocked) return;
    this.blocked = false; $('#touchblock').classList.add('hidden');
    UI.showTitle();
  },
  start() {
    if (this.touchOnly()) {
      this.blocked = true;
      $('#touchblock').classList.remove('hidden');
      $('#touchsettings').addEventListener('click', () => {
        $('#touchblock').classList.add('hidden');
        UI.showSettings(() => { UI.clearScreen(); if (this.blocked) $('#touchblock').classList.remove('hidden'); });
      });
      window.addEventListener('keydown', () => this.inputAvailable());
      Main.startShowcase();
    } else {
      UI.showTitle();
    }
  },
};

// ---------- init ----------
FX.init(); Env.init(); Radio.init(); Input.init();
bloomPass.enabled = settings.bloom;

let lastT = performance.now();
function frame(now) {
  const realDt = Math.min(1, (now - lastT) / 1000);
  const dt = Math.min(0.05, realDt); lastT = now;
  Input.poll(dt, realDt);
  Main.update(dt);
  UI.tick(dt);
  if (Game.mode !== 'paused') Radio.update(dt);
  const live = Game.world && Game.player && (Game.mode === 'play' || (Game.mode === 'title' && Game.showcase));
  if (live) {
    Game.update(dt);
    Game.updateCamera(dt);
    Env.update(dt, Game.rails ? Game.railZ : Game.player.pos.z, camera.position, Game.player.pos);
    FX.update(dt);
    if (Game.mode === 'play') UI.updateHUD(Game);
  } else if (!Game.world) {
    // idle backdrop for menus without a world: slow sky drift
    camera.position.set(0, 0, 0); camera.rotation.set(0, performance.now() / 20000, 0);
    Env.sky.position.set(0, 0, 0);
    FX.update(dt);
  }
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame((t) => { lastT = t; Boot.start(); $('#loading').remove(); requestAnimationFrame(frame); });

</script>
