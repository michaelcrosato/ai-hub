 if(game.phase==='enemy'){processResult(game.enemyStep());actionDelay=Math.max(actionDelay,.65);updateHUD()}else if(state==='attract'){processResult(game.demoStep());actionDelay=Math.max(actionDelay,.42);updateHUD()}}
 if(state==='attract'&&demoAge>55){recordDemo('timeout');setupSession(true);actionDelay=.6}
 physicsAccumulator=Math.min(.1,physicsAccumulator+dt);while(physicsAccumulator>=1/60){world.step();worldSteps++;physicsAccumulator-=1/60}
 for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.life-=dt;if(d.life<=0){fxGroup.remove(d.mesh);world.removeRigidBody(d.body);debris.splice(i,1);continue}const p=d.body.translation(),q=d.body.rotation();d.mesh.position.set(p.x,p.y,p.z);d.mesh.quaternion.set(q.x,q.y,q.z,q.w)}
 for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life-=dt;if(e.life<=0){fxGroup.remove(e.mesh);if(e.mesh.isSprite)e.mesh.material.map?.dispose();if(e.mesh.isSprite||e.blast)e.mesh.material.dispose();effects.splice(i,1);continue}if(e.rise)e.mesh.position.y+=dt*.6;if(e.blast){e.mesh.scale.setScalar(1+(1-e.life/e.total)*2.5);e.mesh.material.opacity=e.life/e.total*.65}}
 syncUnits(dt);
}
function recordDemo(result){demoLoops++;demoHistory.push({result,round:game.round,kills:game.stats.kills,elapsed:demoAge});if(demoHistory.length>4)demoHistory.shift()}
function startAttract(){state='attract';setupSession(true);$('screen').hidden=true;$('hud').hidden=false;$('demoTag').hidden=false;actionDelay=.6;}
function frame(now){const realDt=Math.max(0,(now-lastNow)/1000),dt=Math.min(realDt,.25);lastNow=now;pollGamepads(dt);if(locked&&!inputHeld())locked=false;
 if(state==='title'){idle+=realDt;if(idle>=10)startAttract();if(!settings.reducedMotion){viewAngle=.66+Math.sin(now*.00012)*.09;updateCamera()}syncUnits(0)}
 if(state==='play'||state==='attract')updateSimulation(dt);
 if(renderer&&scene&&camera)renderer.render(scene,camera);rafId=requestAnimationFrame(frame);}
function dispatch(action){if(!meaningful())return;initAudio();if(state==='blocked'||state==='title'||state==='pause'||state==='settings'||state==='help'||state==='credits'||state==='won'||state==='lost'){
 if(action==='back'){if(state==='title'||state==='blocked')return;if(state==='pause')resume();else if(state==='won'||state==='lost')toTitle();else closeSubscreen();return}
 if(action==='up'||action==='down'){if(state==='credits'||state==='help')$(state==='credits'?'creditsBody':'manualBody').scrollTop+=action==='down'?105:-105;else setFocus(menuIndex+(action==='down'?1:-1));sound('select');return}if(action==='confirm')activateMenu();if(state==='settings'&&(action==='left'||action==='right'))activateMenu();return;}
 if(state!=='play')return;
 if(action==='back'){if(mode!=='move'){mode='move';updateHUD();latch()}else openPause();return}
 if(action==='pause'){openPause();return}
 if(action==='left')moveCursor(-1,0);if(action==='right')moveCursor(1,0);if(action==='up')moveCursor(0,-1);if(action==='down')moveCursor(0,1);
 if(action==='confirm')confirmTile();if(action==='prev')cycleUnit(-1);if(action==='next')cycleUnit(1);if(['shoot','grenade','overwatch','interact','end'].includes(action))gameAction(action);
 if(action==='cameraLeft'){viewAngle-=.18;updateCamera()}if(action==='cameraRight'){viewAngle+=.18;updateCamera()}if(action==='zoomIn'){viewDistance=Math.max(13,viewDistance-1);updateCamera()}if(action==='zoomOut'){viewDistance=Math.min(24,viewDistance+1);updateCamera()}
}
const keyActions={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Enter:'confirm',Space:'confirm',Escape:'back',KeyP:'pause',KeyF:'shoot',KeyG:'grenade',KeyO:'overwatch',KeyR:'interact',KeyE:'end',KeyQ:'prev',Tab:'next',BracketLeft:'cameraLeft',BracketRight:'cameraRight',Equal:'zoomIn',Minus:'zoomOut'};
window.addEventListener('keydown',e=>{const a=keyActions[e.code];if(!a)return;e.preventDefault();keys.add(e.code);if(e.repeat&&!(a==='up'||a==='down'||a==='left'||a==='right'))return;controllerUsed=false;dispatch(a)});window.addEventListener('keyup',e=>{keys.delete(e.code)});
const padActions={0:'confirm',1:'back',2:'shoot',3:'overwatch',4:'prev',5:'next',6:'grenade',7:'interact',8:'end',9:'pause',12:'up',13:'down',14:'left',15:'right'};
function pollGamepads(dt){pads=Array.from(navigator.getGamepads?.()||[]).filter(Boolean);const p=pads.find(p=>p.mapping==='standard')||pads[0];if(!!p!==lastPad){lastPad=!!p;announce(p?'Controller online · standard mapping':'Controller disconnected · keyboard ready');if(!p&&state==='play'){openPause();focusPaused=true}}if(!p){previousPad=[];return}const pressed=p.buttons.map(b=>b.pressed||b.value>.45);let anyEdge=false;for(let i=0;i<pressed.length;i++)if(pressed[i]&&!previousPad[i])anyEdge=true;const x=Math.abs(p.axes[0]||0)>.28?(p.axes[0]||0):0,y=Math.abs(p.axes[1]||0)>.28?(p.axes[1]||0):0,rx=Math.abs(p.axes[2]||0)>.28?p.axes[2]:0,ry=Math.abs(p.axes[3]||0)>.28?p.axes[3]:0;
 if((anyEdge||x||y||rx||ry)&&state==='attract'){meaningful();previousPad=pressed;return}
 if(anyEdge||x||y||rx||ry){idle=0;controllerUsed=true}
 if(!locked){for(const [i,a]of Object.entries(padActions))if(pressed[+i]&&!previousPad[+i]){dispatch(a);if(locked)break}
 if(!locked){axisInput('x',x*(settings.invertX?-1:1),dt,v=>dispatch(v<0?'left':'right'));axisInput('y',y*(settings.invertY?-1:1),dt,v=>dispatch(v<0?'up':'down'));if(state==='play'){if(rx||ry){viewAngle+=rx*(settings.invertX?-1:1)*dt*.9;viewDistance=THREE.MathUtils.clamp(viewDistance+ry*(settings.invertY?-1:1)*dt*5,13,24);updateCamera()}}}}
 previousPad=pressed;
}
function axisInput(k,v,dt,fn){if(!v){axisGate[k]=0;return}axisGate[k]-=dt;if(axisGate[k]<=0){fn(v);axisGate[k]=.18}}
window.addEventListener('gamepadconnected',()=>{initAudio()});window.addEventListener('blur',()=>{keys.clear();if(state==='play'){openPause();focusPaused=true}});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();if(state==='play'){openPause();focusPaused=true}}lastNow=performance.now()});
window.addEventListener('resize',()=>{if(!renderer)return;renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
$('pauseTouch').onclick=()=>{if(meaningful())openPause()};
function pointerTile(e){pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObject(tileMesh)[0];return hit?tiles[hit.instanceId]?.userData:null}
$('scene').addEventListener('pointermove',e=>{if(state==='attract'){if(Math.hypot(e.movementX,e.movementY)>4)meaningful();return}if(state!=='play'||locked)return;const t=pointerTile(e);if(t&&(t.x!==cursor.x||t.y!==cursor.y)){cursor={x:t.x,y:t.y};updateHUD()}});
$('scene').addEventListener('pointerdown',e=>{if(!meaningful())return;initAudio();if(state==='play'){const t=pointerTile(e);if(t){cursor={x:t.x,y:t.y};confirmTile()}}});
boot();
</script>
