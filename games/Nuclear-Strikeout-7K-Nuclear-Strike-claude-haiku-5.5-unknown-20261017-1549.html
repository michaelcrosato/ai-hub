<!--

SOURCE: Nuclear Strike (PlayStation, 1997; Core Design / EA)
Tech/Engine: Vanilla JavaScript, HTML5 Canvas 2D, Web Audio API, Gamepad API. No libraries.
Environment: Claude chat sandbox (Linux, Node v22.22.0 for tooling); verified in headless Chromium.

Single file. Open in a desktop browser. Controller (PS5-compatible) recommended; keyboard supported.

<title>NuclearStrikeout-7K</title>
<style>
  html,body{margin:0;height:100%;background:#0d0a07;overflow:hidden;}
  body{background:#0d0a07;color:#f4ead2}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));background:#1a1410;touch-action:manipulation;}
</style>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
"use strict";
// ================= CORE =================
const W = 1280, H = 720;
const WORLD_W = 3200, WORLD_H = 1600;
const TAU = Math.PI * 2;
const INK = "#1a1410";
const PAL = {
  tan: "#c9a86a", tanDark: "#a9864c", tanLight: "#e0c58e", tanShadow: "#8a6c3c",
  olive: "#5b6b3a", oliveDark: "#40502a", oliveLight: "#7d8d52",
  grey: "#8a8580", greyDark: "#5d5955", greyLight: "#bdb6ad",
  haze: "#e6d8b4", fire: "#ff7a1a", fireHot: "#ffd24a", accent: "#2fd1c8",
  red: "#d9412e", white: "#fbf5e6", paper: "#efe3c4"
};
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function angWrap(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- persistence (safe if storage is blocked) ----
const store = {
  get(k, d) { try { const v = localStorage.getItem("ns7k." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ns7k." + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
};
const settings = {
  sound: store.get("sound", true),
  shake: store.get("shake", true),
  assist: store.get("assist", true)
};
function saveSettings() { store.set("sound", settings.sound); store.set("shake", settings.shake); store.set("assist", settings.assist); }
let bestTime = store.get("bestTime", null);

// ---- canvas ----
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

// ---- input ----
const keys = {};
const tapped = {}; // keydown latched until the next poll, so very short taps are never lost
let activity = false;
let gated = false; // touch-only device with no keyboard/controller yet
const touchOnly = matchMedia("(pointer: coarse)").matches && !matchMedia("(any-pointer: fine)").matches;
if (touchOnly) gated = true;
function gateClear() { gated = false; }

function unlockAudio() {
  if (actx && actx.state === "suspended") actx.resume();
  ac();
}
window.addEventListener("keydown", (e) => {
  keys[e.code] = true; tapped[e.code] = true; activity = true; gateClear(); unlockAudio();
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
window.addEventListener("gamepadconnected", () => { gateClear(); activity = true; });

const pointer = { x: 0, y: 0, clicked: false };
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener("pointerdown", (e) => {
  const p = toCanvas(e);
  pointer.x = p.x; pointer.y = p.y; pointer.clicked = true; activity = true; unlockAudio();
});

const KEYMAP = {
  up: ["ArrowUp", "KeyW"], down: ["ArrowDown", "KeyS"], left: ["ArrowLeft", "KeyA"], right: ["ArrowRight", "KeyD"],
  confirm: ["Enter", "Space"], back: ["Escape", "Backspace"],
  fire: ["Space", "KeyJ"], rocket: ["KeyQ", "KeyK"], hellfire: ["KeyE", "KeyL"], pause: ["Escape", "KeyP"]
};
// Standard Gamepad mapping: 0 Cross, 1 Circle, 5 R1, 6 L2, 7 R2, 9 Options, 12-15 D-pad
const PADMAP = {
  up: [12], down: [13], left: [14], right: [15],
  confirm: [0], back: [1], fire: [7], rocket: [6], hellfire: [5], pause: [9]
};
const cur = {}, prev = {}, pressed = {}, held = {};
let axX = 0, axY = 0; // -1..1; axY positive = down
function pollInput() {
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter((g) => g && g.connected) : [];
  const gp = pads[0];
  for (const a in KEYMAP) cur[a] = KEYMAP[a].some((k) => keys[k] || tapped[k]);
  for (const k in tapped) tapped[k] = false;
  let lx = 0, ly = 0;
  if (gp) {
    lx = gp.axes[0] || 0; ly = gp.axes[1] || 0;
    if (Math.abs(lx) < 0.2) lx = 0;
    if (Math.abs(ly) < 0.2) ly = 0;
    for (const a in PADMAP) {
      if (PADMAP[a].some((i) => gp.buttons[i] && gp.buttons[i].pressed)) cur[a] = true;
    }
  }
  for (const a in KEYMAP) {
    pressed[a] = !!cur[a] && !prev[a];
    held[a] = !!cur[a];
    prev[a] = !!cur[a];
  }
  if (Object.values(pressed).some(Boolean)) activity = true;
  axX = (cur.right ? 1 : 0) - (cur.left ? 1 : 0);
  if (lx) axX = lx;
  axY = (cur.down ? 1 : 0) - (cur.up ? 1 : 0);
  if (ly) axY = ly;
  axX = clamp(axX, -1, 1); axY = clamp(axY, -1, 1);
}

// ---- audio (synthesized, no assets) ----
let actx = null, noiseBuf = null;
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  return actx;
}
function tone(f, d, type = "square", v = 0.05, slide = 0) {
  if (!settings.sound) return;
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  const t = a.currentTime;
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + d + 0.02);
}
function boom(d = 0.5, v = 0.2) {
  if (!settings.sound) return;
  const a = ac(); if (!a) return;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  const s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
  const g = a.createGain();
  const t = a.currentTime;
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + d + 0.05);
}
const sfx = {
  chain() { tone(620, 0.05, "square", 0.02, -200); },
  rocket() { tone(180, 0.35, "sawtooth", 0.05, 120); },
  hellfire() { tone(120, 0.7, "sawtooth", 0.06, 200); },
  hit() { tone(900, 0.04, "triangle", 0.03); },
  boom(big) { boom(big ? 0.9 : 0.4, big ? 0.3 : 0.18); },
  pickup() { tone(880, 0.12, "triangle", 0.05, 440); },
  alarm() { tone(440, 0.25, "square", 0.04, -120); },
  click() { tone(700, 0.04, "triangle", 0.03); },
  lock() { tone(1200, 0.06, "sine", 0.03); }
};

// ================= LEVEL: "DUST CROSSING" =================
const MISSION_TIME = 360;
const OBJECTIVES = [
  { id: "radar", text: "Destroy the 3 radar emplacements" },
  { id: "pilot", text: "Rescue the downed pilot" },
  { id: "depot", text: "Destroy the fuel depot" },
  { id: "extract", text: "Reach extraction, guarded by the Sentinel" }
];
const START = { x: 260, y: 1300 };
const EXTRACT = { x: 2930, y: 250, r: 120 };
const STORM = { x: 1850, y: 760, r: 380 };

function mkTurret(x, y) { return { kind: "turret", x, y, r: 26, hp: 90, maxHp: 90, h: 0, cd: 1.2 + Math.random() * 1.2, wind: 0, alive: true }; }
function mkJeep(path, x, y) { return { kind: "jeep", x, y, r: 22, hp: 60, maxHp: 60, h: 0, path, pi: 0, cd: 1.5, alive: true }; }
function mkAA(x, y) { return { kind: "aa", x, y, r: 34, hp: 140, maxHp: 140, h: 0, cd: 1.5, wind: 0, alive: true }; }
function mkRadar(x, y) { return { kind: "radar", x, y, r: 30, hp: 120, maxHp: 120, alive: true, spin: 0 }; }
function mkTank(x, y) { return { kind: "tank", x, y, r: 46, hp: 320, maxHp: 320, h: 0, th: 0, cd: 2, wind: 0, mode: "hold", alive: true }; }

function buildLevel() {
  const r = rng(7731);
  const L = {
    enemies: [], radars: [], pilot: null, depot: null, sentinel: null,
    pickups: [], decor: [], waypoints: []
  };
  // radar emplacements, each with a guard turret
  const radarPts = [[700, 700], [1420, 430], [1930, 920]];
  for (const [x, y] of radarPts) {
    const rad = mkRadar(x, y); L.radars.push(rad); L.enemies.push(rad);
    L.enemies.push(mkTurret(x - 42, y + 36));
  }
  L.pilot = { x: 2420, y: 520, rescued: false, flag: 0 };
  L.depot = { kind: "depot", x: 2760, y: 1000, r: 60, hp: 260, maxHp: 260, alive: true };
  L.enemies.push(L.depot);
  // Sentinel guards extraction
  L.sentinel = mkTank(2930, 330);
  L.enemies.push(L.sentinel);

  for (const [x, y] of [[1000, 1050], [1600, 1150], [2250, 1260], [2050, 640], [1250, 300], [2600, 600]]) {
    L.enemies.push(mkTurret(x, y));
  }
  L.enemies.push(mkJeep([[900, 1150], [1100, 1150], [1100, 950], [900, 950]], 900, 1150));
  L.enemies.push(mkJeep([[1700, 650], [2000, 650], [2000, 780], [1700, 780]], 1700, 650));
  L.enemies.push(mkJeep([[2300, 1100], [2550, 1100], [2550, 1400], [2300, 1400]], 2300, 1100));
  L.enemies.push(mkJeep([[1450, 1300], [1450, 1520], [1800, 1520], [1800, 1300]], 1450, 1300));
  for (const [x, y] of [[1150, 520], [2300, 380], [2650, 1250]]) L.enemies.push(mkAA(x, y));

  L.pickups = [
    { kind: "armor", x: 1000, y: 850 }, { kind: "armor", x: 2200, y: 1150 },
    { kind: "fuel", x: 500, y: 1000 }, { kind: "fuel", x: 1800, y: 320 }, { kind: "fuel", x: 2700, y: 700 },
    { kind: "ammo", x: 1300, y: 880 }
  ].map((p) => ({ ...p, alive: true, bob: r() * TAU }));

  // decor: dunes, rocks, bushes, wrecks, compound buildings
  for (let i = 0; i < 90; i++) L.decor.push({ k: "dune", x: r() * WORLD_W, y: r() * WORLD_H, w: 120 + r() * 200, h: 60 + r() * 90, rot: r() * TAU });
  for (let i = 0; i < 260; i++) L.decor.push({ k: "rock", x: r() * WORLD_W, y: r() * WORLD_H, r: 6 + r() * 16, rot: r() * TAU });
  for (let i = 0; i < 80; i++) L.decor.push({ k: "bush", x: r() * WORLD_W, y: r() * WORLD_H, r: 10 + r() * 8 });
  for (let i = 0; i < 30; i++) L.decor.push({ k: "wreck", x: r() * WORLD_W, y: r() * WORLD_H, w: 50 + r() * 30, h: 28 + r() * 12, rot: r() * TAU });
  // compound around depot
  for (const [x, y, w, h] of [[2620, 930, 120, 44], [2880, 960, 60, 110], [2640, 1060, 180, 36], [2560, 1110, 40, 60]]) {
    L.decor.push({ k: "bldg", x, y, w, h });
  }
  // radar bunkers
  for (const [x, y] of radarPts) L.decor.push({ k: "bldg", x: x - 30, y: y + 40, w: 60, h: 40 });

  // patrol/defense nodes for attract AI (approximate waypoints)
  L.waypoints = [START, { x: 700, y: 900 }, { x: 1420, y: 620 }, { x: 1930, y: 760 }, { x: 2420, y: 520 }, { x: 2760, y: 1000 }, EXTRACT];
  return L;
}

// ================= RUN STATE =================
let G = null;
let demo = false;      // attract / store demo run
let mode = "title";    // title | briefing | play | pause | results | settings | about | gate

function newRun(isDemo) {
  demo = !!isDemo;
  const L = buildLevel();
  G = {
    t: 0,
    timeLeft: MISSION_TIME,
    outcome: null,         // "win" | "lose"
    loseReason: "",
    player: {
      x: START.x, y: START.y, vx: 0, vy: 0, h: 0, armor: 100, fuel: 100,
      rot: 0, cool: 0, rCool: 0, rockets: 12, hellfires: 4, hfCool: 0,
      flash: 0, lockT: 0, lock: null, rescueT: 0, extractT: 0, weapon: 0,
      kills: 0, alive: true
    },
    cam: { x: START.x - W / 2, y: START.y - H / 2, shake: 0 },
    L,
    shots: [],          // player and enemy bullets
    missiles: [],       // homing hellfire
    booms: [],          // explosions
    smoke: [],          // particles
    caption: "",
    captionT: 0,
    endT: 0,
    ai: { wp: 0, target: null, retreat: false, t: 0, fireHold: 0 },
    storm: 0,
    objPrev: [false, false, false, false]
  };
  if (demo) G.caption = "DEMO: " + OBJECTIVES[0].text;
  return G;
}

function objectiveDone(i) {
  if (!G) return false;
  const L = G.L;
  if (i === 0) return L.radars.every((r) => !r.alive);
  if (i === 1) return L.pilot.rescued;
  if (i === 2) return !L.depot.alive;
  if (i === 3) return G.outcome === "win";
  return false;
}
// location of the next incomplete objective, used by HUD arrow and attract AI
function nextObjectiveTarget() {
  const L = G.L;
  if (!L.radars.every((r) => !r.alive)) {
    let best = null, bd = 1e9;
    for (const r of L.radars) if (r.alive) {
      const d = dist(G.player.x, G.player.y, r.x, r.y);
      if (d < bd) { bd = d; best = r; }
    }
    return { x: best.x, y: best.y, id: "radar" };
  }
  if (!L.pilot.rescued) return { x: L.pilot.x, y: L.pilot.y, id: "pilot" };
  if (L.depot.alive) return { x: L.depot.x, y: L.depot.y, id: "depot" };
  return { x: EXTRACT.x, y: EXTRACT.y, id: "extract" };
}

// ================= SIMULATION =================
function spawnBoom(x, y, r, dur, big) { G.booms.push({ x, y, r, t: 0, dur, big }); }
function puff(x, y, n = 3) {
  for (let i = 0; i < n; i++) {
    G.smoke.push({ x: x + (Math.random() - 0.5) * 16, y: y + (Math.random() - 0.5) * 16, vx: (Math.random() - 0.5) * 30, vy: -20 - Math.random() * 30, life: 0.9 + Math.random() * 0.6, t: 0, r: 6 + Math.random() * 6 });
  }
}
function shake(a) { if (settings.shake) G.cam.shake = Math.max(G.cam.shake, a); }

function hurtPlayer(d) {
  const P = G.player;
  if (!P.alive) return;
  P.armor -= d;
  P.flash = 0.25;
  shake(Math.min(10, d * 0.4));
  if (Math.random() < 0.4) puff(P.x, P.y, 2);
  if (P.armor <= 0) {
    P.armor = 0; P.alive = false;
    spawnBoom(P.x, P.y, 80, 1.2, true); sfx.boom(true);
    failRun("Airframe destroyed");
  }
}
function failRun(reason) {
  if (G.outcome) return;
  G.outcome = "lose"; G.loseReason = reason; G.endT = 0;
}
function winRun() {
  if (G.outcome) return;
  G.outcome = "win"; G.endT = 0;
  if (!demo) {
    if (bestTime === null || G.timeLeft > bestTime) { bestTime = G.timeLeft; store.set("bestTime", bestTime); }
  }
}

function killEnemy(e) {
  const big = e.kind === "depot" || e.kind === "tank";
  spawnBoom(e.x, e.y, big ? 90 : 42, big ? 1.1 : 0.6, big);
  shake(big ? 12 : 4);
  sfx.boom(big);
  if (e.kind !== "depot") G.player.kills++;
  if (e.kind === "depot") {
    for (let i = 0; i < 3; i++) {
      G.L.pickups.push({ kind: "fuel", x: e.x + (i - 1) * 40, y: e.y + 60, alive: true, bob: i });
    }
    G.caption = "Fuel depot destroyed";
    G.captionT = 2.5;
  }
  if (e.kind === "radar") {
    G.caption = G.L.radars.some((r) => r.alive) ? "Radar down" : "All radar emplacements down";
    G.captionT = 2.5;
  }
  if (e.kind === "tank") {
    G.caption = "Sentinel destroyed. Extraction is clear.";
    G.captionT = 3;
  }
}
function hitEnemy(e, dmg) {
  if (!e.alive) return false;
  e.hp -= dmg;
  if (e.hp <= 0) { e.alive = false; killEnemy(e); return true; }
  return false;
}
function splash(x, y, r, dmg) {
  for (const e of G.L.enemies) {
    if (!e.alive) continue;
    const d = dist(x, y, e.x, e.y) - (e.r || 20);
    if (d < r) hitEnemy(e, dmg * clamp(1 - d / r, 0.3, 1));
  }
}

// --- weapons ---
function spawnShot(x, y, vx, vy, life, owner, dmg, kind, rad) {
  G.shots.push({ x, y, vx, vy, life, owner, dmg, kind, r: rad || 3, t: 0 });
}
function findLock() {
  const P = G.player;
  let best = null, bd = 650;
  for (const e of G.L.enemies) {
    if (!e.alive) continue;
    const d = dist(P.x, P.y, e.x, e.y);
    if (d > bd) continue;
    const ang = Math.atan2(e.x - P.x, -(e.y - P.y));
    if (Math.abs(angWrap(ang - P.h)) > 0.55) continue;
    bd = d; best = e;
  }
  return best;
}

function fireChain() {
  const P = G.player;
  if (P.cool > 0) return;
  P.cool = 0.085;
  let aim = P.h;
  if (settings.assist) {
    let best = null, bd = 320;
    for (const e of G.L.enemies) {
      if (!e.alive) continue;
      const d = dist(P.x, P.y, e.x, e.y);
      if (d > bd) continue;
      const ang = Math.atan2(e.x - P.x, -(e.y - P.y));
      if (Math.abs(angWrap(ang - P.h)) < 0.22) { bd = d; best = ang; }
    }
    if (best !== null) aim = best;
  }
  const a = aim + (Math.random() - 0.5) * 0.04;
  const sx = P.x + Math.sin(P.h) * 34, sy = P.y - Math.cos(P.h) * 34;
  spawnShot(sx, sy, Math.sin(a) * 900, -Math.cos(a) * 900, 0.9, "player", 7, "chain", 3);
  sfx.chain();
}
function fireRocket() {
  const P = G.player;
  if (P.rCool > 0 || P.rockets <= 0) return;
  P.rCool = 0.4; P.rockets--;
  const sx = P.x + Math.sin(P.h) * 34, sy = P.y - Math.cos(P.h) * 34;
  spawnShot(sx, sy, Math.sin(P.h) * 520 + P.vx * 0.3, -Math.cos(P.h) * 520 + P.vy * 0.3, 1.4, "player", 40, "rocket", 46);
  sfx.rocket();
}
function fireHellfire() {
  const P = G.player;
  if (P.hfCool > 0 || P.hellfires <= 0) return;
  P.hfCool = 0.8; P.hellfires--;
  const target = findLock();
  const sx = P.x + Math.sin(P.h) * 34, sy = P.y - Math.cos(P.h) * 34;
  G.missiles.push({ x: sx, y: sy, vx: Math.sin(P.h) * 260, vy: -Math.cos(P.h) * 260, target, life: 3.2, t: 0, dmg: 150, splash: 60 });
  sfx.hellfire();
}

// --- steering helpers for enemy aim ---
function aimAt(x, y, tx, ty) { return Math.atan2(tx - x, -(ty - y)); }

// ================= MAIN UPDATE =================
function update(dt, ctrl) {
  const P = G.player, L = G.L;
  G.t += dt;
  if (G.outcome) { G.endT += dt; return; }

  // -- timer --
  G.timeLeft -= dt;
  if (G.timeLeft <= 0) { G.timeLeft = 0; failRun("Time expired"); return; }

  // -- player flight --
  P.rCool = Math.max(0, P.rCool - dt);
  P.hfCool = Math.max(0, P.hfCool - dt);
  P.cool = Math.max(0, P.cool - dt);
  P.flash = Math.max(0, P.flash - dt);
  P.h += ctrl.ax * 2.4 * dt;
  const thrust = clamp(-ctrl.ay, 0, 1);
  const inStorm = dist(P.x, P.y, STORM.x, STORM.y) < STORM.r;
  G.storm = inStorm ? 1 : 0;
  if (P.fuel > 0) {
    const accel = 260 * thrust;
    P.vx += Math.sin(P.h) * accel * dt;
    P.vy += -Math.cos(P.h) * accel * dt;
    P.fuel -= (0.2 + 0.8 * thrust) * (inStorm ? 1.8 : 1) * dt;
  }
  const drag = Math.exp(-0.9 * dt);
  P.vx *= drag; P.vy *= drag;
  const sp = Math.hypot(P.vx, P.vy);
  if (sp > 360) { P.vx *= 360 / sp; P.vy *= 360 / sp; }
  P.x = clamp(P.x + P.vx * dt, 40, WORLD_W - 40);
  P.y = clamp(P.y + P.vy * dt, 40, WORLD_H - 40);
  P.fuel = Math.max(0, P.fuel);

  if (ctrl.fire) fireChain();
  if (ctrl.rocket) fireRocket();
  if (ctrl.hellfire) fireHellfire();
  P.lock = findLock();

  // -- ambient smoke when badly damaged --
  if (P.armor < 40 && Math.random() < dt * 4) puff(P.x, P.y, 1);

  // -- pickups --
  for (const p of L.pickups) {
    if (!p.alive) continue;
    if (dist(P.x, P.y, p.x, p.y) < 36) {
      p.alive = false; sfx.pickup();
      if (p.kind === "armor") P.armor = Math.min(100, P.armor + 35);
      if (p.kind === "fuel") P.fuel = Math.min(100, P.fuel + 35);
      if (p.kind === "ammo") { P.rockets = Math.min(16, P.rockets + 6); P.hellfires = Math.min(6, P.hellfires + 2); }
    }
  }

  // -- enemies --
  for (const e of L.enemies) {
    if (!e.alive) continue;
    updateEnemy(e, dt);
  }

  // -- pilot rescue --
  const pl = L.pilot;
  if (!pl.rescued) {
    pl.flag += dt;
    if (dist(P.x, P.y, pl.x, pl.y) < 150 && Math.hypot(P.vx, P.vy) < 70) {
      P.rescueT += dt;
      if (P.rescueT >= 2.5) { pl.rescued = true; sfx.pickup(); G.caption = "Pilot aboard"; G.captionT = 2.5; }
    } else P.rescueT = Math.max(0, P.rescueT - dt * 2);
  }

  // -- extraction --
  const inZone = dist(P.x, P.y, EXTRACT.x, EXTRACT.y) < EXTRACT.r;
  if (inZone && Math.hypot(P.vx, P.vy) < 90 && pl.rescued && !L.depot.alive && L.radars.every((r) => !r.alive)) {
    P.extractT += dt;
    if (P.extractT >= 3) { if (!L.sentinel.alive) winRun(); }
  } else P.extractT = Math.max(0, P.extractT - dt);

  // fuel out, outside extraction zone, is a loss
  if (P.fuel <= 0 && !(inZone && pl.rescued)) failRun("Out of fuel");

  // -- projectiles --
  updateShots(dt);
  updateMissiles(dt);

  // -- booms & particles --
  for (const b of G.booms) b.t += dt;
  G.booms = G.booms.filter((b) => b.t < b.dur);
  for (const s of G.smoke) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; }
  G.smoke = G.smoke.filter((s) => s.t < s.life);
  G.cam.shake = Math.max(0, G.cam.shake - dt * 30);
  if (G.captionT > 0) G.captionT -= dt;

  // -- objective toasts --
  for (let i = 0; i < 3; i++) {
    const d = objectiveDone(i);
    if (d && !G.objPrev[i]) {
      G.caption = "Objective complete: " + OBJECTIVES[i].text;
      G.captionT = 3; sfx.pickup();
    }
    G.objPrev[i] = d;
  }
}

function updateEnemy(e, dt) {
  const P = G.player, L = G.L;
  const dP = dist(e.x, e.y, P.x, P.y);
  switch (e.kind) {
    case "turret": {
      const want = aimAt(e.x, e.y, P.x, P.y);
      e.h += clamp(angWrap(want - e.h), -2 * dt, 2 * dt);
      if (dP < 430 && P.alive) {
        if (e.wind > 0) {
          e.wind -= dt;
          if (e.wind <= 0) enemyShot(e.x, e.y, e.h, 320, 8, 4);
        } else {
          e.cd -= dt;
          if (e.cd <= 0) { e.wind = 0.6; e.cd = 1.6; }
        }
      }
      break;
    }
    case "jeep": {
      const wp = e.path[e.pi];
      const dx = wp[0] - e.x, dy = wp[1] - e.y, d = Math.hypot(dx, dy);
      if (d < 12) e.pi = (e.pi + 1) % e.path.length;
      else {
        const want = Math.atan2(dx, -dy);
        e.h += clamp(angWrap(want - e.h), -3 * dt, 3 * dt);
        e.x += Math.sin(e.h) * 85 * dt; e.y += -Math.cos(e.h) * 85 * dt;
      }
      if (dP < 360 && P.alive) {
        e.cd -= dt;
        if (e.cd <= 0) { enemyShot(e.x, e.y, aimAt(e.x, e.y, P.x, P.y), 360, 5, 3); e.cd = 1.3; }
      }
      break;
    }
    case "aa": {
      const want = aimAt(e.x, e.y, P.x, P.y);
      e.h += clamp(angWrap(want - e.h), -1.1 * dt, 1.1 * dt);
      if (dP < 620 && P.alive) {
        if (e.wind > 0) {
          e.wind -= dt;
          if (e.wind <= 0) enemyShot(e.x, e.y, aimAt(e.x, e.y, P.x, P.y), 500, 18, 6);
        } else {
          e.cd -= dt;
          if (e.cd <= 0) { e.wind = 0.9; e.cd = 2.6; }
        }
      }
      break;
    }
    case "tank": {
      if (e.hp < e.maxHp * 0.5 && dP < 700) e.mode = "charge";
      const want = aimAt(e.x, e.y, P.x, P.y);
      e.th += clamp(angWrap(want - e.th), -1.4 * dt, 1.4 * dt);
      if (e.mode === "charge") {
        e.h = want;
        if (dP > 150) { e.x += Math.sin(want) * 70 * dt; e.y += -Math.cos(want) * 70 * dt; }
        e.cd -= dt;
        if (dP < 300 && e.cd <= 0) { enemyShot(e.x, e.y, e.th, 480, 4, 2, true); e.cd = 0.25; }
      } else if (dP < 700 && P.alive) {
        e.cd -= dt;
        if (e.cd <= 0) { enemyShot(e.x, e.y, e.th, 380, 20, 6); e.cd = 2.2; }
      }
      break;
    }
    default: break; // radar, depot: static
  }
}
function enemyShot(x, y, ang, speed, dmg, rad, machine) {
  const sx = x + Math.sin(ang) * 30, sy = y - Math.cos(ang) * 30;
  spawnShot(sx, sy, Math.sin(ang) * speed, -Math.cos(ang) * speed, 2.2, "enemy", dmg, machine ? "machine" : "shell", rad);
  if (dist(x, y, G.player.x, G.player.y) < 500) tone(260, 0.06, "square", 0.015, -80);
}

function updateShots(dt) {
  const P = G.player;
  for (const s of G.shots) {
    s.t += dt; s.life -= dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.owner === "player") {
      for (const e of G.L.enemies) {
        if (!e.alive) continue;
        if (dist(s.x, s.y, e.x, e.y) < (e.r || 20) + s.r) {
          if (s.kind === "rocket") { s.life = 0; }
          else { hitEnemy(e, s.dmg); s.life = 0; }
          break;
        }
      }
      if (s.life <= 0 && s.kind === "rocket") {
        spawnBoom(s.x, s.y, 46, 0.4, false); splash(s.x, s.y, s.r, s.dmg); sfx.boom(false);
      }
    } else if (P.alive && dist(s.x, s.y, P.x, P.y) < 22 + s.r) {
      s.life = 0; hurtPlayer(s.dmg); sfx.hit();
    }
  }
  G.shots = G.shots.filter((s) => s.life > 0 && s.x > -50 && s.y > -50 && s.x < WORLD_W + 50 && s.y < WORLD_H + 50);
}

function updateMissiles(dt) {
  for (const m of G.missiles) {
    m.t += dt; m.life -= dt;
    if (m.target && !m.target.alive) m.target = null;
    if (m.target) {
      const want = aimAt(m.x, m.y, m.target.x, m.target.y);
      const cur = Math.atan2(m.vx, -m.vy);
      const nw = cur + clamp(angWrap(want - cur), -3.2 * dt, 3.2 * dt);
      const s = 420;
      m.vx = Math.sin(nw) * s; m.vy = -Math.cos(nw) * s;
    }
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.t > 0.08 && Math.random() < 0.5) puff(m.x, m.y, 1);
    let hit = false;
    for (const e of G.L.enemies) {
      if (!e.alive) continue;
      if (dist(m.x, m.y, e.x, e.y) < (e.r || 20) + 6) { hit = true; break; }
    }
    if (hit || m.life <= 0) {
      spawnBoom(m.x, m.y, m.splash, 0.6, true); sfx.boom(true); shake(6);
      splash(m.x, m.y, m.splash, m.dmg);
      m.life = 0;
    }
  }
  G.missiles = G.missiles.filter((m) => m.life > 0);
}

// ================= CONTROL SOURCES =================
function humanControls() {
  return {
    ax: axX, ay: axY,
    fire: !!held.fire,
    rocket: !!pressed.rocket,
    hellfire: !!pressed.hellfire
  };
}

// Attract mode pilot: simple state machine driving the same control struct
function aiControls(dt) {
  const P = G.player, A = G.ai, L = G.L;
  const c = { ax: 0, ay: 0, fire: false, rocket: false, hellfire: false };
  A.t += dt;
  A.retreat = P.armor < 40 || P.fuel < 22;
  let tx, ty;
  let engage = null, ed = 1e9;

  if (A.retreat) {
    let bd = 1e9;
    for (const p of L.pickups) {
      if (!p.alive || (p.kind !== "armor" && p.kind !== "fuel")) continue;
      const d = dist(P.x, P.y, p.x, p.y);
      if (d < bd) { bd = d; tx = p.x; ty = p.y; }
    }
  }
  if (tx === undefined) {
    // engage nearby threats when healthy, otherwise head for the next objective
    if (P.armor >= 45) {
      for (const e of L.enemies) {
        if (!e.alive || e.kind === "radar" || e.kind === "depot") continue;
        const d = dist(P.x, P.y, e.x, e.y);
        if (d < 480 && d < ed) { ed = d; engage = e; }
      }
    }
    if (engage) { tx = engage.x; ty = engage.y; }
    else {
      const o = nextObjectiveTarget();
      tx = o.x; ty = o.y;
    }
  }
  if (tx === undefined) { return c; }

  const dx = tx - P.x, dy = ty - P.y, d = Math.hypot(dx, dy);
  const want = Math.atan2(dx, -dy);
  const diff = angWrap(want - P.h);
  c.ax = clamp(diff * 2.2, -1, 1);
  const standoff = engage ? 240 : 80;
  if (d > standoff && Math.abs(diff) < 0.9) c.ay = -1;
  else if (d < standoff * 0.6) c.ay = 0.3;
  else c.ay = 0;
  // shoot at a hostile engagement, or at a radar/depot objective while flying to it
  let shootable = !!engage;
  let heavy = engage ? (engage.kind === "aa" || engage.kind === "tank") : false;
  if (!engage && !A.retreat) {
    const o = nextObjectiveTarget();
    if ((o.id === "radar" || o.id === "depot") && d <= 420) { shootable = true; heavy = o.id === "depot"; }
  }
  if (shootable) {
    if (d < 480 && Math.abs(diff) < 0.2) c.fire = true;
    if (d < 380 && Math.abs(diff) < 0.12 && P.rockets > 0 && P.rCool <= 0) c.rocket = true;
    if (heavy && d < 600 && Math.abs(diff) < 0.2 && P.hfCool <= 0 && P.hellfires > 0) c.hellfire = true;
  }
  return c;
}

// ================= RENDERING (cel-shaded, ink outlines) =================
// All world drawing happens inside camTransform(); screen-space HUD is drawn outside it.
const terrain = document.createElement("canvas");
terrain.width = WORLD_W; terrain.height = WORLD_H;

function inkStroke(w = 2.5, a = 1) { ctx.lineWidth = w; ctx.strokeStyle = a === 1 ? INK : "rgba(26,20,16," + a + ")"; }
function ellipseShape(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); }

function buildTerrain() {
  const t = terrain.getContext("2d");
  const r = rng(4242);
  t.fillStyle = PAL.tan; t.fillRect(0, 0, WORLD_W, WORLD_H);
  // flat cel patches of scrub and lighter sand
  for (let i = 0; i < 140; i++) {
    const x = r() * WORLD_W, y = r() * WORLD_H, s = 60 + r() * 140;
    t.fillStyle = r() < 0.5 ? PAL.oliveLight : PAL.tanLight;
    t.globalAlpha = 0.45; t.beginPath(); t.ellipse(x, y, s, s * 0.6, r() * TAU, 0, TAU); t.fill();
  }
  t.globalAlpha = 1;
  // service road
  const road = [[260, 1300], [900, 1200], [1400, 800], [2400, 560], [2930, 260]];
  const roadPath = () => { t.beginPath(); t.moveTo(road[0][0], road[0][1]); for (const p of road.slice(1)) t.lineTo(p[0], p[1]); };
  t.lineCap = "round";
  t.strokeStyle = INK; t.globalAlpha = 0.35; t.lineWidth = 42; roadPath(); t.stroke();
  t.globalAlpha = 1; t.strokeStyle = PAL.greyLight; t.lineWidth = 34; roadPath(); t.stroke();
  // tracks and dust streaks
  t.strokeStyle = PAL.tanDark; t.lineWidth = 3;
  for (let i = 0; i < 40; i++) {
    const x = r() * WORLD_W, y = r() * WORLD_H, a = r() * TAU, l = 60 + r() * 120;
    t.beginPath(); t.moveTo(x, y); t.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); t.stroke();
  }
  for (const d of buildLevel().decor) drawDecor(t, d);
}

function drawDecor(c, d) {
  c.save();
  if (d.k === "dune") {
    c.translate(d.x, d.y); c.rotate(d.rot);
    c.fillStyle = PAL.tanDark; c.beginPath(); c.ellipse(0, 0, d.w / 2, d.h / 2, 0, 0, TAU); c.fill();
    c.fillStyle = PAL.tanLight; c.beginPath(); c.ellipse(-d.w * 0.06, -d.h * 0.1, d.w * 0.36, d.h * 0.34, 0, 0, TAU); c.fill();
    c.strokeStyle = "rgba(26,20,16,0.35)"; c.lineWidth = 1.5; c.beginPath(); c.ellipse(0, 0, d.w / 2, d.h / 2, 0, 0, TAU); c.stroke();
  } else if (d.k === "rock") {
    c.translate(d.x, d.y);
    c.fillStyle = PAL.grey; c.beginPath(); c.arc(0, 0, d.r, 0, TAU); c.fill();
    c.fillStyle = PAL.greyLight; c.beginPath(); c.arc(-d.r * 0.3, -d.r * 0.3, d.r * 0.5, 0, TAU); c.fill();
    c.strokeStyle = INK; c.lineWidth = 1.8; c.beginPath(); c.arc(0, 0, d.r, 0, TAU); c.stroke();
  } else if (d.k === "bush") {
    c.translate(d.x, d.y);
    c.fillStyle = PAL.oliveDark; c.beginPath(); c.arc(0, 0, d.r, 0, TAU); c.fill();
    c.fillStyle = PAL.olive; c.beginPath(); c.arc(-d.r * 0.25, -d.r * 0.25, d.r * 0.6, 0, TAU); c.fill();
    c.strokeStyle = INK; c.lineWidth = 1.8; c.beginPath(); c.arc(0, 0, d.r, 0, TAU); c.stroke();
  } else if (d.k === "wreck") {
    c.translate(d.x, d.y); c.rotate(d.rot);
    c.fillStyle = "#6b4a33"; c.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
    c.fillStyle = "#8c6446"; c.fillRect(-d.w / 2, -d.h / 2, d.w, d.h * 0.4);
    c.strokeStyle = INK; c.lineWidth = 2; c.strokeRect(-d.w / 2, -d.h / 2, d.w, d.h);
  } else if (d.k === "bldg") {
    c.fillStyle = PAL.greyDark; c.fillRect(d.x, d.y, d.w, d.h);
    c.fillStyle = PAL.greyLight; c.fillRect(d.x, d.y, d.w, d.h * 0.45);
    c.fillStyle = "rgba(26,20,16,0.45)"; c.fillRect(d.x + 4, d.y + d.h, d.w, 6);
    c.strokeStyle = INK; c.lineWidth = 2.5; c.strokeRect(d.x, d.y, d.w, d.h);
  }
  c.restore();
}

// --- camera ---
function camFollow(dt) {
  const P = G.player, c = G.cam;
  const tx = P.x + P.vx * 0.35 - W / 2, ty = P.y + P.vy * 0.35 - H / 2;
  c.x = lerp(c.x, tx, 1 - Math.exp(-5 * dt));
  c.y = lerp(c.y, ty, 1 - Math.exp(-5 * dt));
  c.x = clamp(c.x, 0, WORLD_W - W); c.y = clamp(c.y, 0, WORLD_H - H);
  c.sx = c.shake > 0 ? (Math.random() - 0.5) * c.shake : 0;
  c.sy = c.shake > 0 ? (Math.random() - 0.5) * c.shake : 0;
}
function camTransform() {
  return { x: Math.round(G.cam.x - G.cam.sx), y: Math.round(G.cam.y - G.cam.sy) };
}
function inView(x, y, m = 80) {
  return x > G.cam.x - m && x < G.cam.x + W + m && y > G.cam.y - m && y < G.cam.y + H + m;
}

// --- world entities (world coords; caller applies camera translate) ---
function drawChopper(P) {
  // ground shadow
  ctx.save();
  ctx.translate(P.x + 10, P.y + 14); ctx.rotate(P.h);
  ctx.fillStyle = "rgba(26,20,16,0.28)"; ellipseShape(0, 0, 28, 17); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(P.x, P.y); ctx.rotate(P.h);
  // tail boom and tail rotor
  ctx.fillStyle = PAL.oliveDark; ctx.beginPath(); ctx.moveTo(-8, 8); ctx.lineTo(-52, 4); ctx.lineTo(-52, -4); ctx.lineTo(-8, -8); ctx.closePath(); ctx.fill();
  inkStroke(2.5); ctx.stroke();
  ctx.fillStyle = PAL.oliveDark; ctx.beginPath(); ctx.arc(-54, 0, 9, 0, TAU); ctx.fill(); inkStroke(2); ctx.stroke();
  // stub wings with missile pods
  ctx.fillStyle = PAL.greyDark; ctx.fillRect(-14, -26, 28, 6); ctx.fillRect(-14, 20, 28, 6);
  inkStroke(2); ctx.strokeRect(-14, -26, 28, 6); ctx.strokeRect(-14, 20, 28, 6);
  // fuselage: three flat shades
  ctx.fillStyle = PAL.olive; ellipseShape(0, 0, 24, 19); ctx.fill();
  ctx.fillStyle = PAL.oliveDark; ellipseShape(4, 5, 18, 12); ctx.fill();
  ctx.fillStyle = PAL.oliveLight; ellipseShape(-6, -6, 10, 7); ctx.fill();
  inkStroke(2.8); ellipseShape(0, 0, 24, 19); ctx.stroke();
  // canopy
  ctx.fillStyle = "#9fd8e0"; ellipseShape(0, -10, 11, 8); ctx.fill(); inkStroke(2); ctx.stroke();
  ctx.fillStyle = PAL.white; ctx.beginPath(); ctx.ellipse(-3, -13, 3, 2, -0.4, 0, TAU); ctx.fill();
  // main rotor (two blades, spinning)
  for (const off of [0, Math.PI / 2]) {
    ctx.save(); ctx.rotate(G.t * 38 + off);
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-60, 0); ctx.lineTo(60, 0); ctx.stroke();
    ctx.strokeStyle = PAL.paper; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-60, 0); ctx.lineTo(60, 0); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill();
  if (P.flash > 0) { ctx.fillStyle = "rgba(217,65,46," + clamp(P.flash * 2, 0, 0.6).toFixed(2) + ")"; ellipseShape(0, 0, 24, 19); ctx.fill(); }
  ctx.restore();
}

// health bar in world coords (no transform changes)
function hpBar(x, y, w, hp, max) {
  if (hp >= max) return;
  const f = clamp(hp / max, 0, 1);
  ctx.fillStyle = INK; ctx.fillRect(x - w / 2 - 2, y - 2, w + 4, 8);
  ctx.fillStyle = f > 0.5 ? PAL.accent : PAL.fireHot; ctx.fillRect(x - w / 2, y, w * f, 4);
}
function telegraph(x, y, r) {
  const p = (Math.sin(G.t * 30) + 1) / 2;
  ctx.save();
  ctx.strokeStyle = "rgba(217,65,46," + (0.5 + 0.5 * p).toFixed(2) + ")";
  ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r + 8 + p * 6, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawEnemy(e) {
  if (e.kind === "turret") {
    ctx.save();
    ctx.fillStyle = PAL.greyDark; ellipseShape(e.x, e.y, 28, 28); ctx.fill(); inkStroke(2.5); ctx.stroke();
    ctx.translate(e.x, e.y); ctx.rotate(e.h);
    ctx.fillStyle = PAL.greyLight; ctx.fillRect(-6, -34, 12, 40); inkStroke(2); ctx.strokeRect(-6, -34, 12, 40);
    ctx.fillStyle = PAL.grey; ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill(); inkStroke(2.5); ctx.stroke();
    ctx.restore();
    if (e.wind > 0) telegraph(e.x, e.y, 28);
    hpBar(e.x, e.y - 42, 40, e.hp, e.maxHp);
  } else if (e.kind === "jeep") {
    ctx.save();
    ctx.translate(e.x, e.y); ctx.rotate(e.h);
    ctx.fillStyle = PAL.oliveDark; ctx.fillRect(-14, -22, 28, 44); inkStroke(2.5); ctx.strokeRect(-14, -22, 28, 44);
    ctx.fillStyle = PAL.olive; ctx.fillRect(-11, -18, 22, 16);
    ctx.fillStyle = "#9fd8e0"; ctx.fillRect(-8, -6, 16, 8); inkStroke(2); ctx.strokeRect(-8, -6, 16, 8);
    ctx.fillStyle = PAL.greyDark; ctx.fillRect(-2, -30, 4, 12);
    ctx.restore();
    hpBar(e.x, e.y - 40, 40, e.hp, e.maxHp);
  } else if (e.kind === "aa") {
    ctx.save();
    ctx.fillStyle = PAL.greyDark; ctx.fillRect(e.x - 34, e.y - 34, 68, 68); inkStroke(3); ctx.strokeRect(e.x - 34, e.y - 34, 68, 68);
    ctx.translate(e.x, e.y); ctx.rotate(e.h);
    ctx.fillStyle = PAL.greyLight;
    for (const [dx, dy] of [[-12, -12], [12, -12], [-12, 12], [12, 12]]) ctx.fillRect(dx - 4, dy - 4, 8, 22);
    ctx.fillStyle = PAL.grey; ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill(); inkStroke(2.5); ctx.stroke();
    ctx.restore();
    if (e.wind > 0) telegraph(e.x, e.y, 34);
    hpBar(e.x, e.y - 44, 60, e.hp, e.maxHp);
  } else if (e.kind === "radar") {
    ctx.save();
    ctx.fillStyle = e.alive ? PAL.greyDark : "#4a4541";
    ctx.fillRect(e.x - 30, e.y - 30, 60, 60); inkStroke(2.5); ctx.strokeRect(e.x - 30, e.y - 30, 60, 60);
    if (e.alive) {
      ctx.translate(e.x, e.y); ctx.rotate(G.t * 1.5);
      ctx.fillStyle = PAL.greyLight; ellipseShape(0, 0, 22, 10); ctx.fill(); inkStroke(2); ctx.stroke();
    } else {
      ctx.strokeStyle = INK; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(e.x - 20, e.y - 20); ctx.lineTo(e.x + 20, e.y + 20); ctx.moveTo(e.x + 20, e.y - 20); ctx.lineTo(e.x - 20, e.y + 20); ctx.stroke();
    }
    ctx.restore();
    hpBar(e.x, e.y - 40, 60, e.hp, e.maxHp);
  } else if (e.kind === "depot") {
    ctx.save();
    ctx.fillStyle = PAL.greyDark; ctx.fillRect(e.x - 60, e.y - 46, 120, 92); inkStroke(3); ctx.strokeRect(e.x - 60, e.y - 46, 120, 92);
    for (const [dx, dy] of [[-30, -10], [0, -10], [30, -10], [-30, 22], [0, 22], [30, 22]]) {
      ctx.fillStyle = PAL.tanShadow; ctx.beginPath(); ctx.arc(e.x + dx, e.y + dy, 12, 0, TAU); ctx.fill(); inkStroke(2); ctx.stroke();
      ctx.fillStyle = PAL.fireHot; ctx.beginPath(); ctx.arc(e.x + dx - 3, e.y + dy - 3, 4, 0, TAU); ctx.fill();
    }
    ctx.restore();
    hpBar(e.x, e.y - 58, 120, e.hp, e.maxHp);
  } else if (e.kind === "tank") {
    ctx.save();
    ctx.translate(e.x, e.y); ctx.rotate(e.h);
    ctx.fillStyle = PAL.oliveDark; ctx.fillRect(-38, -42, 76, 84); inkStroke(3); ctx.strokeRect(-38, -42, 76, 84);
    ctx.fillStyle = PAL.olive; ctx.fillRect(-30, -36, 60, 30);
    ctx.fillStyle = PAL.oliveLight; ctx.fillRect(-30, -36, 60, 10);
    ctx.rotate(e.th - e.h);
    ctx.fillStyle = PAL.greyDark; ctx.fillRect(-6, -48, 12, 40); inkStroke(2.5); ctx.strokeRect(-6, -48, 12, 40);
    ctx.fillStyle = PAL.olive; ellipseShape(0, 0, 22, 22); ctx.fill(); inkStroke(3); ctx.stroke();
    ctx.restore();
    hpBar(e.x, e.y - 60, 90, e.hp, e.maxHp);
  }
}

function drawPickups() {
  for (const p of G.L.pickups) {
    if (!p.alive || !inView(p.x, p.y, 40)) continue;
    const bob = Math.sin(G.t * 3 + (p.bob || 0)) * 3;
    ctx.save(); ctx.translate(p.x, p.y + bob);
    ctx.fillStyle = p.kind === "armor" ? PAL.accent : p.kind === "fuel" ? PAL.fireHot : PAL.tanLight;
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.fill(); inkStroke(3); ctx.stroke();
    ctx.fillStyle = INK; ctx.font = "bold 18px Verdana,sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(p.kind === "armor" ? "+" : p.kind === "fuel" ? "F" : "A", 0, 1);
    ctx.restore();
  }
}

function drawPilot() {
  const pl = G.L.pilot;
  if (!inView(pl.x, pl.y, 60)) return;
  ctx.save(); ctx.translate(pl.x, pl.y);
  ctx.globalAlpha = pl.rescued ? 0.4 : 1;
  ctx.fillStyle = PAL.fire; ellipseShape(0, 0, 10, 8); ctx.fill(); inkStroke(2.5); ctx.stroke();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(0, -10, 5, 0, TAU); ctx.fill();
  if (!pl.rescued) {
    const p = (Math.sin(G.t * 4) + 1) / 2;
    ctx.strokeStyle = "rgba(47,209,200," + (0.4 + p * 0.5).toFixed(2) + ")";
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 26 + p * 8, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawExtract() {
  if (!inView(EXTRACT.x, EXTRACT.y, EXTRACT.r + 40)) return;
  const guarded = G.L.sentinel.alive;
  ctx.save();
  ctx.fillStyle = guarded ? "rgba(217,65,46,0.22)" : "rgba(47,209,200,0.28)";
  ellipseShape(EXTRACT.x, EXTRACT.y, EXTRACT.r, EXTRACT.r * 0.85); ctx.fill();
  inkStroke(3, 0.7); ctx.setLineDash([10, 8]); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = PAL.white; ctx.font = "bold 48px Verdana,sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("H", EXTRACT.x, EXTRACT.y + 2);
  ctx.restore();
}

function drawShots() {
  for (const s of G.shots) {
    if (!inView(s.x, s.y, 40)) continue;
    if (s.owner === "player") {
      ctx.save();
      ctx.strokeStyle = s.kind === "chain" ? PAL.fireHot : PAL.paper;
      ctx.lineWidth = s.kind === "chain" ? 3 : 2;
      ctx.beginPath(); ctx.moveTo(s.x - s.vx * 0.02, s.y - s.vy * 0.02); ctx.lineTo(s.x, s.y); ctx.stroke();
      if (s.kind === "rocket") {
        ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, TAU); ctx.fill();
        if (Math.random() < 0.5) puff(s.x, s.y, 1);
      }
      ctx.restore();
    } else {
      ctx.save();
      ctx.fillStyle = s.kind === "machine" ? PAL.fireHot : PAL.fire;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.kind === "machine" ? 4 : 6, 0, TAU); ctx.fill(); inkStroke(2); ctx.stroke();
      ctx.restore();
    }
  }
}

function drawMissiles() {
  for (const m of G.missiles) {
    const a = Math.atan2(m.vx, -m.vy);
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(a);
    ctx.fillStyle = PAL.paper; ctx.fillRect(-14, -4, 28, 8); inkStroke(2); ctx.strokeRect(-14, -4, 28, 8);
    ctx.fillStyle = PAL.fire; ctx.beginPath(); ctx.moveTo(14, -4); ctx.lineTo(22, 0); ctx.lineTo(14, 4); ctx.closePath(); ctx.fill(); inkStroke(2); ctx.stroke();
    ctx.restore();
  }
}

function drawBooms() {
  for (const b of G.booms) {
    if (!inView(b.x, b.y, b.r + 40)) continue;
    const p = clamp(b.t / b.dur, 0, 1);
    const stage = Math.floor(p * 4);
    const R = b.r * (0.35 + 0.65 * Math.min(1, p * 2.2));
    ctx.save();
    ctx.fillStyle = stage < 2 ? PAL.fireHot : PAL.fire;
    ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, TAU); ctx.fill(); inkStroke(3); ctx.stroke();
    ctx.fillStyle = stage < 2 ? PAL.white : PAL.red;
    ctx.beginPath(); ctx.arc(b.x, b.y, R * (stage < 2 ? 0.5 : 0.55), 0, TAU); ctx.fill();
    if (p > 0.45) { ctx.fillStyle = "rgba(26,20,16,0.6)"; ctx.beginPath(); ctx.arc(b.x + 6, b.y - 6, R * 0.7, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
}

function drawSmoke() {
  for (const s of G.smoke) {
    if (!inView(s.x, s.y, 20)) continue;
    const a = clamp(1 - s.t / s.life, 0, 1) * 0.5;
    ctx.fillStyle = "rgba(93,89,85," + a.toFixed(2) + ")";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (1 + s.t), 0, TAU); ctx.fill();
  }
}

function drawStorm() {
  if (!inView(STORM.x, STORM.y, STORM.r + 60)) return;
  ctx.save();
  ctx.fillStyle = "rgba(230,216,180,0.28)";
  ellipseShape(STORM.x, STORM.y, STORM.r, STORM.r * 0.8); ctx.fill();
  ctx.strokeStyle = "rgba(26,20,16,0.25)"; ctx.lineWidth = 2; ctx.setLineDash([14, 12]);
  ellipseShape(STORM.x, STORM.y, STORM.r, STORM.r * 0.8); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
}

function drawLockReticle() {
  const P = G.player;
  if (!P.lock || !P.lock.alive) return;
  const p = (Math.sin(G.t * 12) + 1) / 2;
  ctx.save(); ctx.strokeStyle = PAL.red; ctx.lineWidth = 3;
  const x = P.lock.x, y = P.lock.y;
  ctx.beginPath(); ctx.arc(x, y, 40 - p * 6, 0, TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - 52, y); ctx.lineTo(x - 30, y); ctx.moveTo(x + 30, y); ctx.lineTo(x + 52, y);
  ctx.moveTo(x, y - 52); ctx.lineTo(x, y - 30); ctx.moveTo(x, y + 30); ctx.lineTo(x, y + 52); ctx.stroke();
  ctx.restore();
}

// --- screen-space markers and HUD ---
function drawObjectiveMarker() {
  const t = nextObjectiveTarget();
  const sx = t.x - G.cam.x, sy = t.y - G.cam.y;
  ctx.save(); ctx.fillStyle = PAL.accent; inkStroke(2.5);
  if (sx > 30 && sx < W - 30 && sy > 30 && sy < H - 30) {
    const bob = Math.sin(G.t * 5) * 4;
    ctx.beginPath(); ctx.moveTo(sx, sy - 52 + bob); ctx.lineTo(sx + 14, sy - 74 + bob); ctx.lineTo(sx - 14, sy - 74 + bob); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    const cx = W / 2, cy = H / 2;
    const ang = Math.atan2(sy - cy, sx - cx);
    const ex = clamp(cx + Math.cos(ang) * (W / 2 - 60), 60, W - 60);
    const ey = clamp(cy + Math.sin(ang) * (H / 2 - 60), 60, H - 150);
    ctx.translate(ex, ey); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(-10, -14); ctx.lineTo(-10, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function paperBox(x, y, w, h, alpha = 0.9) {
  ctx.save();
  ctx.fillStyle = "rgba(239,227,196," + alpha + ")";
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.fill();
  inkStroke(3); ctx.stroke();
  ctx.restore();
}
function hudText(str, x, y, size = 26, align = "left", col = INK, weight = "bold") {
  ctx.save();
  ctx.font = weight + " " + size + "px Verdana,Tahoma,sans-serif";
  ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.fillStyle = col; ctx.fillText(str, x, y);
  ctx.restore();
}
function bar(x, y, w, h, f, col) {
  ctx.save();
  ctx.fillStyle = PAL.greyLight; ctx.fillRect(x, y, w, h); inkStroke(2.5); ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * clamp(f, 0, 1), h);
  ctx.restore();
}
function nextObjIndex() {
  for (let i = 0; i < 3; i++) if (!objectiveDone(i)) return i;
  return 3;
}

function drawHUD() {
  const P = G.player;
  // objectives
  paperBox(24, 22, 600, 46 + OBJECTIVES.length * 44, 0.92);
  hudText("MISSION OBJECTIVES", 44, 46, 22, "left", PAL.olive);
  OBJECTIVES.forEach((o, i) => {
    const done = objectiveDone(i);
    const y = 92 + i * 44;
    ctx.save(); ctx.fillStyle = done ? PAL.accent : PAL.white; inkStroke(2.5);
    ctx.fillRect(44, y - 13, 26, 26); ctx.strokeRect(44, y - 13, 26, 26);
    if (done) { ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(48, y); ctx.lineTo(55, y + 7); ctx.lineTo(67, y - 8); ctx.stroke(); }
    ctx.restore();
    hudText(o.text, 84, y, 24, "left", done ? PAL.greyDark : INK, done ? "normal" : "bold");
  });
  // timer
  const tl = Math.max(0, G.timeLeft);
  const m = Math.floor(tl / 60), s = Math.floor(tl % 60);
  paperBox(W / 2 - 80, 18, 160, 60, 0.92);
  hudText(m + ":" + (s < 10 ? "0" : "") + s, W / 2, 50, 40, "center", tl < 60 ? PAL.red : INK);
  // armor and fuel
  paperBox(24, H - 150, 360, 126, 0.92);
  hudText("ARMOR", 44, H - 124, 22, "left", PAL.olive);
  hudText(String(Math.ceil(P.armor)), 364, H - 124, 22, "right", INK);
  bar(44, H - 104, 316, 16, P.armor / 100, P.armor < 35 ? PAL.red : PAL.accent);
  hudText("FUEL", 44, H - 70, 22, "left", PAL.olive);
  hudText(String(Math.ceil(P.fuel)), 364, H - 70, 22, "right", INK);
  bar(44, H - 50, 316, 16, P.fuel / 100, P.fuel < 25 ? PAL.red : PAL.fireHot);
  // ammo
  paperBox(W - 344, H - 150, 320, 126, 0.92);
  hudText("CHAIN", W - 324, H - 124, 22, "left", PAL.olive);
  hudText("∞", W - 44, H - 124, 26, "right", INK);
  hudText("ROCKETS", W - 324, H - 90, 22, "left", PAL.olive);
  hudText(String(P.rockets), W - 44, H - 90, 26, "right", INK);
  hudText("HELLFIRE", W - 324, H - 56, 22, "left", PAL.olive);
  hudText(String(P.hellfires), W - 44, H - 56, 26, "right", INK);
  // caption / toast
  const cap = demo ? (G.captionT > 0 ? G.caption : "Destroy the radar sites, rescue the pilot, clear the Sentinel")
                   : (G.captionT > 0 ? G.caption : "");
  if (cap) {
    ctx.save(); ctx.font = "bold 26px Verdana,Tahoma,sans-serif";
    const tw = ctx.measureText(cap).width + 48;
    ctx.restore();
    paperBox(W / 2 - tw / 2, H - 170, tw, 48, 0.92);
    hudText(cap, W / 2, H - 146, 26, "center", INK);
  }
  // damage vignette
  if (P.flash > 0 || P.armor < 35) {
    const a = P.flash > 0 ? P.flash * 1.4 : 0.12 + 0.08 * Math.sin(G.t * 6);
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.8);
    g.addColorStop(0, "rgba(217,65,46,0)"); g.addColorStop(1, "rgba(217,65,46," + clamp(a, 0, 0.6).toFixed(2) + ")");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (G.storm) { ctx.fillStyle = "rgba(230,216,180,0.12)"; ctx.fillRect(0, 0, W, H); }
  if (demo) {
    paperBox(W - 420, 22, 396, 50, 0.92);
    hudText("DEMO", W - 396, 47, 24, "left", PAL.red);
    hudText("PRESS ANY BUTTON", W - 42, 47, 20, "right", INK);
  }
}

function renderPlay() {
  const cam = camTransform();
  ctx.save();
  ctx.translate(-cam.x, -cam.y);
  ctx.drawImage(terrain, 0, 0);
  drawStorm();
  drawPickups();
  drawExtract();
  drawPilot();
  for (const e of G.L.enemies) if ((e.alive || e.kind === "radar") && inView(e.x, e.y, 90)) drawEnemy(e);
  drawSmoke();
  drawShots();
  drawMissiles();
  if (G.player.alive) drawChopper(G.player);
  drawBooms();
  drawLockReticle();
  ctx.restore();
  // screen-space overlays
  drawObjectiveMarker();
  drawHUD();
}

// menu: items are {label: string|fn, fn: action}; rects filled on draw for pointer hit-testing
const menu = { items: [], focus: 0, rects: [], back: null, layout: "center" };
function setMenu(items, back = null, layout = "center") {
  menu.items = items; menu.focus = 0; menu.rects = []; menu.back = back; menu.layout = layout;
}
function itemLabel(it) { return typeof it.label === "function" ? it.label() : it.label; }
function activate(i) {
  const it = menu.items[i];
  if (it && it.fn) { sfx.click(); it.fn(); }
}
function menuInput() {
  const n = menu.items.length;
  if (n) {
    if (pressed.up) { menu.focus = (menu.focus - 1 + n) % n; sfx.click(); }
    if (pressed.down) { menu.focus = (menu.focus + 1) % n; sfx.click(); }
  }
  if (pointer.clicked) {
    for (let i = 0; i < menu.rects.length; i++) {
      const r = menu.rects[i];
      if (pointer.x >= r.x && pointer.x <= r.x + r.w && pointer.y >= r.y && pointer.y <= r.y + r.h) {
        menu.focus = i; activate(i); return;
      }
    }
  }
  if (pressed.confirm && n) activate(menu.focus);
  if (pressed.back && menu.back) menu.back();
}

function drawMenu(startY = 330) {
  const bw = 440, bh = 60, gap = 16;
  menu.rects = [];
  menu.items.forEach((it, i) => {
    const focused = i === menu.focus;
    const x = W / 2 - bw / 2, y = startY + i * (bh + gap);
    ctx.save();
    ctx.fillStyle = focused ? PAL.fireHot : "rgba(239,227,196,0.92)";
    ctx.beginPath(); ctx.roundRect(x, y, bw, bh, 14); ctx.fill();
    inkStroke(focused ? 4 : 2.5); ctx.stroke();
    ctx.restore();
    hudText(itemLabel(it), W / 2, y + bh / 2 + 1, 28, "center", INK);
    menu.rects.push({ x, y, w: bw, h: bh });
  });
}

// ---- briefing ----
const BRIEFING = [
  "Enemy radar sites along the ridge are feeding air defenses. Take out all three.",
  "A pilot is down inside the compound. Hover close and hold steady until they are aboard.",
  "The fuel depot feeds the base. Destroy it. The Sentinel tank guards the extraction zone. Clear it and land."
];
let briefIdx = 0;
function wrapText(str, maxW, font) {
  ctx.save(); ctx.font = font;
  const words = str.split(" "); const lines = []; let line = "";
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  ctx.restore();
  return lines;
}
function briefingNext() {
  sfx.click();
  briefIdx++;
  if (briefIdx >= BRIEFING.length) { newRun(false); mode = "play"; }
}
function drawBriefing() {
  drawBgPan(18);
  paperBox(W / 2 - 520, 150, 1040, 380, 0.94);

  const lines = wrapText(BRIEFING[briefIdx], 960, "bold 34px Verdana,Tahoma,sans-serif");
  lines.forEach((l, i) => hudText(l, W / 2 - 480, 262 + i * 46, 34, "left", INK));

  hudText("Circle / Esc: Back to title", W / 2, 610, 22, "center", PAL.haze, "normal");

function briefingInput() {

  setMenu([

    { label: () => "Screen shake: " + (settings.shake ? "On" : "Off"), fn: () => { settings.shake = !settings.shake; saveSettings(); } },
    { label: () => "Reticle assist: " + (settings.assist ? "On" : "Off"), fn: () => { settings.assist = !settings.assist; saveSettings(); } },
    { label: "Back", fn: back }
  ], back);
}
function setGateMenu() {

}
function setPauseMenu() {
  setMenu([
    { label: "Resume", fn: () => { mode = "play"; } },
    { label: "Restart Mission", fn: () => { newRun(false); mode = "play"; } },
    { label: "Settings", fn: () => openSettings("pause") },
    { label: "Quit to Title", fn: goTitle }
  ], () => { mode = "play"; });
}
function setResultsMenu() {
  G.captionT = 0;
  setMenu([
    { label: "Restart Mission", fn: () => { newRun(false); mode = "play"; } },
    { label: "Title", fn: goTitle }
  ], null);
}

function drawPanel(title, lines, y = 130, h = 460) {
  paperBox(W / 2 - 480, y, 960, h, 0.95);
  hudText(title, W / 2, y + 46, 40, "center", INK);
  const wrapped = lines.flatMap((l) => wrapText(l, 880, "24px Verdana,Tahoma,sans-serif"));
  wrapped.forEach((l, i) => hudText(l, W / 2 - 440, y + 110 + i * 38, 24, "left", INK, "normal"));
}

function drawResults() {
  const won = G.outcome === "win";
  const done = [0, 1, 2, 3].filter((i) => objectiveDone(i)).length;
  const used = MISSION_TIME - Math.max(0, G.timeLeft);
  const mm = Math.floor(used / 60), ss = Math.floor(used % 60);
  const lines = [
    "Time: " + mm + ":" + (ss < 10 ? "0" : "") + ss + (won && bestTime !== null ? "   Best remaining: " + Math.floor(bestTime) + "s" : ""),
    "Kills: " + G.player.kills + "     Objectives: " + done + " of 4",
    won ? "Extraction complete. Pilot recovered." : "Reason: " + G.loseReason
  ];
  drawPanel(won ? "MISSION COMPLETE" : "MISSION FAILED", lines, 130, 340);
  drawMenu(500);
}

function drawGate() {
  drawBgPan(12);
  paperBox(W / 2 - 480, 180, 960, 220, 0.94);
  hudText("Controller or keyboard required", W / 2, 260, 44, "center", INK);
  hudText("This game is built for a PS5-compatible controller or a keyboard.", W / 2, 320, 26, "center", INK, "normal");
  drawMenu(440);
}

function drawAbout() {
  drawBgPan(12);
  drawPanel("ABOUT AND CREDITS", [
    "NuclearStrikeout-7K: an original spiritual successor to Nuclear Strike (1997).",
    "Tech: vanilla JavaScript, HTML5 Canvas 2D, Web Audio, Gamepad API. No libraries.",
    "Model: Claude Haiku 5.5. Single HTML file. Initial date: unknown.",
    "Controller: Stick turn and thrust. R2 chain. L2 rockets. R1 hellfire. Options pause.",
    "Keyboard: Arrows or WASD. Space or J chain. Q or K rockets. E or L hellfire. Esc or P pause."
  ], 70, 440);
  drawMenu(530);
}

function drawSettings() {
  drawBgPan(12);
  drawPanel("SETTINGS", ["Toggle sound, screen shake, and reticle assist. Circle or Esc goes back."], 130, 520);
  drawMenu(330);
}

function drawPausePanel() {
  ctx.save(); ctx.fillStyle = "rgba(13,10,7,0.55)"; ctx.fillRect(0, 0, W, H); ctx.restore();
  drawPanel("PAUSED", [], 140, 420);
  drawMenu(250);
}

// ---- per-mode step ----
function stepTitle(dt) {
  titleT += dt;
  if (activity) idleT = 0; else idleT += dt;
  if (idleT >= IDLE_TO_DEMO) { startDemo(); return; }
  menuInput();
}

function stepPlay(dt) {
  if (demo) {
    if (activity) { activity = false; goTitle(); return; }
    const c = aiControls(dt);
    update(dt, c);
    camFollow(dt);
    if (G.outcome && G.endT > 3.5) newRun(true);
    return;
  }
  if (pressed.pause || pressed.back) { setPauseMenu(); mode = "pause"; return; }
  update(dt, humanControls());
  camFollow(dt);
  if (G.outcome && G.endT > 1.5) { setResultsMenu(); mode = "results"; }
}

// ---- main loop ----
function stepFrame(dt) {
  if (gated && mode !== "gate" && mode !== "settings" && mode !== "about") { mode = "gate"; setGateMenu(); }
  else if (!gated && mode === "gate") { mode = "title"; setTitleMenu(); }

  switch (mode) {
    case "title": stepTitle(dt); break;
    case "gate": menuInput(); break;
    case "briefing": briefingInput(); break;
    case "play": stepPlay(dt); break;
    case "pause": menuInput(); break;
    case "results": menuInput(); break;
    case "settings": menuInput(); break;
    case "about": menuInput(); break;
  }
  if (mode === "title" || mode === "gate") { /* activity consumed by stepTitle */ }
}

function renderFrame() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#1a1410"; ctx.fillRect(0, 0, W, H);
  switch (mode) {
    case "title":
      drawBgPan(25);
      drawTitleText();
      drawMenu(330);
      drawControlsHint();
      break;
    case "gate":
      drawGate();
      break;
    case "briefing":
      drawBriefing();
      break;
    case "play":
      renderPlay();
      if (demo && G.outcome) {
        ctx.save(); ctx.fillStyle = "rgba(13,10,7,0.35)"; ctx.fillRect(0, 0, W, H); ctx.restore();
        paperBox(W / 2 - 260, H / 2 - 50, 520, 100, 0.95);
        hudText(G.outcome === "win" ? "DEMO: MISSION COMPLETE" : "DEMO: MISSION FAILED", W / 2, H / 2, 34, "center", INK);
      }
      break;
    case "pause":
      renderPlay();
      drawPausePanel();
      break;
    case "results":
      renderPlay();
      ctx.save(); ctx.fillStyle = "rgba(13,10,7,0.55)"; ctx.fillRect(0, 0, W, H); ctx.restore();
      drawResults();
      break;
    case "settings":
      drawSettings();
      break;
    case "about":
      drawAbout();
      break;
  }
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  pollInput();
  stepFrame(dt);
  renderFrame();
  pointer.clicked = false;
  activity = false;
  requestAnimationFrame(frame);
}

// ---- boot ----
buildTerrain();
setTitleMenu();
requestAnimationFrame(frame);
</script>

</body></html>
