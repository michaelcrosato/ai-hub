<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#172629" />
  <title>Nightbook — Companion Career Simulator</title>
  <style>
:root {
  --ink: #172629;
  --ink-soft: #42595b;
  --paper: #f7f1df;
  --paper-2: #eee3c8;
  --cream: #fffaf0;
  --moss: #6d8263;
  --moss-dark: #435b4a;
  --gold: #c58c43;
  --rose: #b86f73;
  --blue: #5f8792;
  --danger: #a94f4a;
  --success: #52785b;
  --shadow: 0 14px 34px rgba(20, 36, 36, 0.22);
  --radius: 18px;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  background:
    radial-gradient(circle at 10% 15%, rgba(255,255,255,.12), transparent 25%),
    linear-gradient(145deg, #21383a, #132326 65%, #0e1c1f);
  color: var(--ink);
  font-family: var(--font);
  overflow-x: hidden;
}

body { min-height: 100vh; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .48; }

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  min-height: 72px;
  padding: 10px 18px;
  display: grid;
  grid-template-columns: minmax(230px, auto) 1fr auto;
  gap: 18px;
  align-items: center;
  color: #f8f3df;
  border-bottom: 1px solid rgba(255,255,255,.12);
  background: rgba(10, 28, 30, .76);
  backdrop-filter: blur(14px);
  position: sticky;
  top: 0;
  z-index: 20;
}

.brand-block { display: flex; align-items: center; gap: 11px; }
.logo-mark {
  width: 42px; height: 42px; display: grid; place-items: center;
  border-radius: 14px;
  background: linear-gradient(145deg, #d2a258, #91633d);
  color: #162529; font-weight: 900; font-size: 23px;
  box-shadow: inset 0 1px rgba(255,255,255,.55), 0 6px 16px rgba(0,0,0,.25);
}
.brand-block h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
.brand-block p { margin: 1px 0 0; color: rgba(255,255,255,.66); font-size: 11px; }

.top-stats {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}
.stat-chip {
  min-width: 88px;
  padding: 7px 10px;
  border-radius: 12px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.09);
  text-align: center;
}
.stat-chip span { display: block; font-size: 10px; color: rgba(255,255,255,.62); text-transform: uppercase; letter-spacing: .08em; }
.stat-chip strong { display: block; font-size: 13px; margin-top: 1px; }

.top-actions { display: flex; align-items: center; gap: 7px; }
.icon-button, .small-button {
  border: 1px solid rgba(255,255,255,.15);
  color: inherit;
  background: rgba(255,255,255,.08);
  border-radius: 11px;
  min-height: 36px;
  padding: 0 12px;
}
.icon-button { width: 36px; padding: 0; font-size: 20px; }
.icon-button:hover, .small-button:hover { background: rgba(255,255,255,.15); }

.game-shell {
  width: 100%;
  flex: 1;
  display: grid;
  grid-template-columns: minmax(640px, 1fr) minmax(330px, 420px);
  gap: 14px;
  padding: 14px;
}

.world-column, .panel-column { min-width: 0; }
.world-column { display: flex; flex-direction: column; gap: 10px; }

.canvas-frame {
  position: relative;
  width: 100%;
  min-height: 540px;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  background: #91b0ae;
  border: 1px solid rgba(255,255,255,.2);
}

#gameCanvas {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 540px;
  outline: none;
  image-rendering: auto;
  touch-action: none;
}

.scene-badge {
  position: absolute;
  left: 14px;
  top: 14px;
  color: var(--ink);
  background: rgba(255,250,240,.86);
  border: 1px solid rgba(32,55,54,.12);
  border-radius: 12px;
  padding: 8px 11px;
  font-size: 12px;
  font-weight: 800;
  box-shadow: 0 5px 18px rgba(30,55,55,.14);
  backdrop-filter: blur(10px);
}

.interaction-prompt {
  position: absolute;
  left: 50%;
  bottom: 62px;
  transform: translateX(-50%);
  background: rgba(18,35,37,.91);
  color: white;
  padding: 9px 14px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 14px;
  font-size: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,.28);
  white-space: nowrap;
}

.control-hint {
  position: absolute;
  right: 12px;
  bottom: 10px;
  display: flex;
  gap: 10px;
  color: rgba(255,255,255,.85);
  background: rgba(14,31,33,.55);
  border-radius: 9px;
  padding: 5px 7px;
  font-size: 10px;
  backdrop-filter: blur(8px);
}
kbd {
  display: inline-block;
  min-width: 18px;
  padding: 1px 4px;
  margin: 0 1px;
  border-radius: 4px;
  color: #fff;
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.18);
  box-shadow: inset 0 -1px rgba(0,0,0,.2);
  font-size: 9px;
  text-align: center;
}

.toast-layer {
  pointer-events: none;
  position: absolute;
  top: 16px;
  right: 16px;
  width: min(300px, 70%);
  display: flex;
  flex-direction: column;
  gap: 7px;
  align-items: flex-end;
}
.toast {
  padding: 9px 12px;
  border-radius: 12px;
  background: rgba(255,250,240,.94);
  color: var(--ink);
  border: 1px solid rgba(32,55,54,.12);
  box-shadow: 0 8px 25px rgba(24,42,43,.22);
  font-size: 12px;
  animation: toast-in .22s ease-out;
}
.toast.good { border-left: 4px solid var(--success); }
.toast.warn { border-left: 4px solid var(--gold); }
.toast.bad { border-left: 4px solid var(--danger); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-5px); } }

.status-strip {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(210px, .8fr);
  gap: 10px;
}
.need-meters, .status-message {
  background: rgba(255,250,240,.94);
  border: 1px solid rgba(255,255,255,.45);
  box-shadow: 0 9px 26px rgba(7,22,24,.16);
  border-radius: 15px;
}
.need-meters { padding: 10px 12px; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 9px; }
.need-meter label { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-soft); margin-bottom: 4px; }
.meter-track { height: 7px; border-radius: 99px; background: #dfd8c8; overflow: hidden; }
.meter-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #54786f, #84a07a); transition: width .25s; }
.meter-fill.low { background: linear-gradient(90deg, #a74f4f, #d07a63); }
.status-message { padding: 11px 14px; display: flex; align-items: center; font-size: 12px; color: var(--ink-soft); }

.panel-column {
  height: calc(100vh - 100px);
  min-height: 620px;
  background: rgba(255,250,240,.98);
  border: 1px solid rgba(255,255,255,.5);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.tabbar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  padding: 8px;
  background: #e8dec6;
  border-bottom: 1px solid rgba(32,55,54,.08);
}
.tab {
  position: relative;
  min-height: 34px;
  border: 0;
  background: transparent;
  color: #566465;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 700;
}
.tab:hover { background: rgba(255,255,255,.55); }
.tab.active { background: var(--cream); color: var(--ink); box-shadow: 0 2px 9px rgba(37,56,54,.1); }
.badge {
  position: absolute;
  top: 3px;
  right: 5px;
  min-width: 17px;
  height: 17px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--rose);
  color: white;
  font-size: 9px;
}
.panel-content { flex: 1; overflow-y: auto; padding: 15px; scrollbar-color: #b4aa94 transparent; }
.panel-content h2, .panel-content h3, .panel-content p { margin-top: 0; }
.panel-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.panel-title-row h2 { font-size: 20px; margin-bottom: 2px; }
.panel-title-row p { font-size: 11px; color: var(--ink-soft); }

.card {
  background: #fffaf0;
  border: 1px solid #ded4be;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: 0 4px 11px rgba(48,55,48,.06);
}
.card.emphasis { border-color: #c89b5a; background: linear-gradient(145deg, #fff8e8, #f4e8ca); }
.card.danger { border-color: #c9837d; background: #fff3ee; }
.card.good { border-color: #86a184; background: #f1f8ee; }
.card-header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.card h3 { margin: 0 0 5px; font-size: 14px; }
.card p { margin: 4px 0; font-size: 11px; color: var(--ink-soft); line-height: 1.42; }
.card small { color: #6b7777; }
.card-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; }

.primary-button, .secondary-button, .ghost-button, .danger-button {
  border-radius: 10px;
  min-height: 34px;
  padding: 0 11px;
  font-size: 11px;
  font-weight: 800;
  border: 1px solid transparent;
}
.primary-button { background: var(--moss-dark); color: white; }
.primary-button:hover { background: #354c3d; }
.secondary-button { background: #e2cfaa; color: #283b3b; border-color: #d0b98e; }
.secondary-button:hover { background: #d8c092; }
.ghost-button { background: transparent; color: var(--ink); border-color: #c9c0ae; }
.ghost-button:hover { background: rgba(225,215,196,.55); }
.danger-button { background: #a75650; color: white; }
.danger-button:hover { background: #8e443f; }
.button-wide { width: 100%; }

.pill-row { display: flex; flex-wrap: wrap; gap: 5px; }
.pill {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  background: #e8e0ce;
  color: #405152;
  padding: 4px 7px;
  font-size: 9px;
  font-weight: 750;
}
.pill.good { background: #dcebd8; color: #45634b; }
.pill.warn { background: #f2dfb8; color: #755a2d; }
.pill.bad { background: #f1d2ce; color: #7c403c; }
.pill.blue { background: #d6e4e6; color: #3e646b; }

.kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 11px; }
.kpi { border-radius: 12px; padding: 10px; background: #ece3cf; }
.kpi span { display: block; color: #677373; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; }
.kpi strong { display: block; margin-top: 2px; font-size: 16px; }

.timeline { position: relative; padding-left: 17px; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 7px; bottom: 7px; width: 2px; background: #d8ceb9; }
.timeline-item { position: relative; padding: 0 0 13px 7px; }
.timeline-item::before { content: ""; position: absolute; left: -15px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--moss); border: 2px solid #fffaf0; }
.timeline-item h4 { margin: 0 0 2px; font-size: 12px; }
.timeline-item p { margin: 0; font-size: 10px; }

.row { display: flex; align-items: center; gap: 8px; }
.row.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.muted { color: var(--ink-soft); }
.tiny { font-size: 9px; }
.money-positive { color: var(--success); }
.money-negative { color: var(--danger); }

.progress-line { margin: 7px 0; }
.progress-line label { display: flex; justify-content: space-between; font-size: 10px; margin-bottom: 4px; }
.progress-line .meter-track { height: 8px; }

.input-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 10px; color: var(--ink-soft); font-weight: 700; }
.field input, .field select {
  width: 100%;
  border: 1px solid #cfc3aa;
  border-radius: 10px;
  background: #fffdf7;
  min-height: 38px;
  padding: 0 10px;
  color: var(--ink);
}
.field input:focus, .field select:focus { outline: 2px solid rgba(95,135,146,.32); border-color: var(--blue); }

.option-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
.option-card {
  text-align: left;
  border: 1px solid #cfc4ae;
  background: #fffaf0;
  border-radius: 13px;
  padding: 11px;
  color: var(--ink);
}
.option-card:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(37,50,49,.1); }
.option-card.selected { border: 2px solid var(--moss-dark); padding: 10px; background: #f0f4e8; }
.option-card h4 { margin: 0 0 4px; font-size: 12px; }
.option-card p { margin: 0; font-size: 10px; line-height: 1.35; color: var(--ink-soft); }
.option-card strong { display: block; margin-top: 6px; font-size: 10px; color: var(--moss-dark); }

.toggle-line { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #e5dcc8; }
.toggle-line:last-child { border-bottom: 0; }
.toggle-line h4 { margin: 0 0 2px; font-size: 11px; }
.toggle-line p { margin: 0; font-size: 9px; }
.switch { position: relative; width: 42px; height: 24px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: #c8c0ae; transition: .2s; }
.switch span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: white; box-shadow: 0 1px 4px rgba(0,0,0,.25); transition: .2s; }
.switch input:checked + span { background: var(--moss); }
.switch input:checked + span::after { transform: translateX(18px); }

.modal-root {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 20px;
}
.modal-root.hidden { display: none; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(6,18,20,.72); backdrop-filter: blur(6px); }
.modal-card {
  position: relative;
  width: min(760px, 96vw);
  max-height: min(88vh, 900px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--cream);
  color: var(--ink);
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 20px;
  box-shadow: 0 24px 70px rgba(0,0,0,.38);
  animation: modal-in .18s ease-out;
}
.modal-card.wide { width: min(960px, 97vw); }
@keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(.99); } }
.modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 18px 20px 14px; border-bottom: 1px solid #ded5c2; background: #f2e7ce; }
.modal-header h2 { margin: 0; font-size: 22px; }
.eyebrow { margin: 0 0 3px; color: var(--moss-dark); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; font-weight: 900; }
.modal-header .icon-button { color: var(--ink); border-color: #c8bda7; background: rgba(255,255,255,.46); }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-footer { padding: 13px 20px; border-top: 1px solid #ded5c2; background: #f7efdf; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

.notice {
  border-radius: 12px;
  padding: 10px 12px;
  background: #e8efe6;
  border: 1px solid #cbd8c5;
  color: #425846;
  font-size: 10px;
  line-height: 1.42;
}
.notice.warn { background: #f7e8ca; border-color: #e3c892; color: #72582e; }
.notice.bad { background: #f8ddd8; border-color: #dfaaa4; color: #783f3b; }

.negotiation-layout { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(240px,.9fr); gap: 14px; }
.screening-list { display: flex; flex-direction: column; gap: 7px; }
.screening-action { border: 1px solid #d4cab6; background: white; border-radius: 11px; padding: 9px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.screening-action.done { background: #eef5eb; border-color: #b9cbb3; }
.screening-action h4 { margin: 0 0 2px; font-size: 11px; }
.screening-action p { margin: 0; font-size: 9px; }
.quote-box { background: #e8dfcb; border-radius: 13px; padding: 12px; }
.quote-box strong { font-size: 19px; }

.dialogue-choice { width: 100%; text-align: left; padding: 12px; border-radius: 13px; border: 1px solid #d1c6b1; background: #fffaf0; color: var(--ink); margin-bottom: 8px; }
.dialogue-choice:hover { background: #f3ebda; border-color: #baa883; }
.dialogue-choice h4 { margin: 0 0 4px; font-size: 12px; }
.dialogue-choice p { margin: 0; font-size: 10px; color: var(--ink-soft); line-height: 1.4; }
.dialogue-choice.safe { border-left: 4px solid var(--success); }
.dialogue-choice.risky { border-left: 4px solid var(--gold); }
.dialogue-choice.exit { border-left: 4px solid var(--danger); }

.mobile-controls { display: none; }
.hidden { display: none !important; }

@media (max-width: 1050px) {
  .topbar { grid-template-columns: 1fr auto; }
  .top-stats { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; }
  .game-shell { grid-template-columns: 1fr; }
  .panel-column { height: auto; min-height: 560px; }
  .canvas-frame { min-height: 500px; }
  #gameCanvas { min-height: 500px; }
}

@media (max-width: 700px) {
  .topbar { padding: 8px 10px; gap: 8px; }
  .brand-block p { display: none; }
  .top-actions .small-button { display: none; }
  .top-stats { gap: 4px; }
  .stat-chip { min-width: 68px; padding: 5px 7px; }
  .game-shell { padding: 7px; gap: 8px; }
  .canvas-frame, #gameCanvas { min-height: 430px; }
  .control-hint { display: none; }
  .mobile-controls { display: block; position: absolute; inset: auto 10px 10px 10px; pointer-events: none; }
  .dpad { position: absolute; left: 0; bottom: 0; width: 118px; height: 90px; }
  .dpad button, .interact-button { pointer-events: auto; position: absolute; width: 38px; height: 38px; border: 1px solid rgba(255,255,255,.24); background: rgba(14,31,33,.62); color: white; border-radius: 11px; }
  .dpad [data-move="up"] { left: 40px; top: 0; }
  .dpad [data-move="left"] { left: 0; top: 40px; }
  .dpad [data-move="down"] { left: 40px; top: 40px; }
  .dpad [data-move="right"] { left: 80px; top: 40px; }
  .interact-button { right: 0; bottom: 8px; width: 54px; height: 54px; border-radius: 50%; font-weight: 900; }
  .status-strip { grid-template-columns: 1fr; }
  .need-meters { grid-template-columns: repeat(2,1fr); }
  .status-message { display: none; }
  .panel-column { min-height: 520px; }
  .tabbar { grid-template-columns: repeat(3,1fr); }
  .input-grid, .option-grid, .negotiation-layout { grid-template-columns: 1fr; }
  .modal-root { padding: 6px; }
  .modal-card { max-height: 96vh; }
}

/* Full window on desktop: the scene fills the world column, the panel reaches the right edge, nothing scrolls. */
@media (min-width: 1051px) {
  html, body { height: 100%; overflow: hidden; }
  #app { height: 100vh; height: 100dvh; min-height: 0; }
  .game-shell { min-height: 0; padding: 0; gap: 0; }
  .world-column { min-height: 0; gap: 0; }
  .canvas-frame { flex: 1; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
  #gameCanvas { position: absolute; inset: 0; min-height: 0; }
  .status-strip { padding: 8px; }
  .panel-column { height: auto; min-height: 0; border-radius: 0; border-width: 0 0 0 1px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

  </style>
</head>
<body>
  <div id="app" aria-label="Nightbook game">
    <header class="topbar">
      <div class="brand-block">
        <div class="logo-mark" aria-hidden="true">N</div>
        <div>
          <h1>Nightbook</h1>
          <p>Companion Career Simulator</p>
        </div>
      </div>
      <div id="topStats" class="top-stats" aria-live="polite"></div>
      <div class="top-actions">
        <button id="soundButton" class="icon-button" type="button" title="Toggle sound" aria-label="Toggle sound">♪</button>
        <button id="saveButton" class="small-button" type="button">Save</button>
        <button id="helpButton" class="small-button" type="button">Help</button>
      </div>
    </header>

    <main class="game-shell">
      <section class="world-column" aria-label="Isometric game world">
        <div class="canvas-frame">
          <canvas id="gameCanvas" width="960" height="600" tabindex="0" aria-label="Isometric apartment and date scenes"></canvas>
          <div id="sceneBadge" class="scene-badge"></div>
          <div id="interactionPrompt" class="interaction-prompt hidden" aria-live="polite"></div>

    return `${h12}:${String(mins).padStart(2, '0')} ${period}`;

  function playTone(frequency = 520, duration = 0.055, volume = 0.035) {
    if (!soundEnabled || !state?.settings?.sound) return;
    try {
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(volume, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start();
      oscillator.stop(audioContext.currentTime + duration);
    } catch (_) {
      // Audio is optional; unsupported browsers continue silently.
    }
  }

    const needed = 100 + (state.level - 1) * 45;
    if (state.xp >= needed) {
      state.xp -= needed;
      state.level += 1;
      state.skillPoints += 1;
      state.health = clamp(state.health + 4, 0, 100);
      state.energy = clamp(state.energy + 8, 0, 100);
      toast(`Level ${state.level}. You gained a skill point.`, 'good');
      addJournal('Career level increased', `Reached level ${state.level} and gained one skill point.`, 'good');
    }
  }

  function spend(amount, reason = 'Expense') {
    if (state.money < amount) return false;
    state.money -= amount;
    state.stats.spent += amount;
    addJournal(reason, `Paid ${currency(amount)}.`, 'expense');
    return true;
  }

  function generateClient(archetypeKey = null) {
    const daily = state.dailyModifier || DAILY_MODIFIERS[0];
    const keys = Object.keys(CLIENT_ARCHETYPES);
    if (!archetypeKey) {
      if (daily.vip && chance(daily.vip)) archetypeKey = 'patron';
      else archetypeKey = choice(keys);
    }
    const archetype = CLIENT_ARCHETYPES[archetypeKey];
    const firstName = choice(FIRST_NAMES);
    const age = randomInt(24, 63);
    const redFlagChance = clamp((archetype.risk - 12) / 100 * getRegion().risk, 0.05, 0.48);
    const redFlag = chance(redFlagChance) ? { ...choice(RED_FLAGS) } : null;
    const risk = clamp(
      archetype.risk * getRegion().risk + (redFlag?.severity || 0) + randomBetween(-8, 8),
      5,
      95
    );
    const reliability = clamp(archetype.reliability + randomBetween(-0.14, 0.12), 0.18, 0.98);
    return {
      id: `client-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      name: firstName,
      age,
      archetype: archetypeKey,
      type: archetype.label,
      preferences: [...archetype.preferences],
      traits: [...archetype.traits].sort(() => Math.random() - 0.5).slice(0, 2),
      risk,
      reliability,
      exposure: archetype.exposure,
      redFlag,
      attachment: archetypeKey === 'regular' ? randomBetween(0.35, 0.72) : randomBetween(0.08, 0.42)
    };
  }

  function generateLead(archetypeKey = null, forcedDay = null) {
    if (!state) return null;
    const client = generateClient(archetypeKey);
    const archetype = CLIENT_ARCHETYPES[client.archetype];
    const region = getRegion();
    const difficulty = getDifficulty();
    const daily = state.dailyModifier || DAILY_MODIFIERS[0];
    const marketing = getMarketingTotals();
    const qualityMultiplier = 0.82 + state.reputation * 0.065 + state.profileQuality / 260 + marketing.qualityBoost;
    const duration = choice(client.archetype === 'patron' ? [3, 4, 4, 6] : [2, 2, 3, 4, 5]);
    const hourlyMarket = state.baseRate * region.rate * (1 + (daily.rate || 0)) * qualityMultiplier;
    const idealTotal = hourlyMarket * duration * archetype.budget * randomBetween(0.82, 1.18) * difficulty.income;
    const budgetMax = roundTo(Math.max(180, idealTotal * randomBetween(1.02, 1.24)), 25);
    const offer = roundTo(clamp(idealTotal * randomBetween(0.72, 0.96), 140, budgetMax), 25);
    let bookingDay = forcedDay ?? state.day + (chance(0.32) ? 1 : 0);
    if (state.time > 19 * 60 && bookingDay === state.day) bookingDay += 1;
    const timeChoices = client.archetype === 'urgent'
      ? [18 * 60, 19 * 60 + 30, 21 * 60, 22 * 60 + 30]
      : [12 * 60, 14 * 60, 16 * 60 + 30, 18 * 60, 20 * 60, 21 * 60 + 30];
    let start = choice(timeChoices) + choice([0, 0, 30]);
    if (bookingDay === state.day) start = Math.max(start, state.time + 150);
    start = clamp(roundTo(start, 30), 11 * 60, 23 * 60);
    const request = choice(archetype.requests);

    return {
      id: `lead-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      client,
      request,
      duration,
      bookingDay,
      start,
      offer,
      budgetMax,
      status: 'new',
      expiresDay: state.day + (client.archetype === 'urgent' ? 0 : 1),
      expiresAt: client.archetype === 'urgent' ? state.time + 180 : 23 * 60 + 59,
      screening: { id: 'unchecked', references: 'unchecked', deposit: 'not-requested' },
      revealed: [],
      quote: null,
      counter: null,
      notes: ''
    };
  }

  function generateLeads(count = null) {
    if (!state || state.layLowDays > 0) count = count == null ? 1 : Math.min(count, 1);
    const region = getRegion();
    const daily = state.dailyModifier || DAILY_MODIFIERS[0];
    const marketing = getMarketingTotals();
    const structure = getStructure();
    const baseCount = 2.1 + region.demand * 1.45 + state.reputation * 0.38 + marketing.leadBoost * 3.3;
    const modified = baseCount * structure.leadBoost * (1 + (daily.demand || 0));
    const target = count ?? clamp(Math.round(modified + randomBetween(-1, 1)), 2, 7);
    const openCount = state.leads.filter((lead) => ['new', 'countered'].includes(lead.status)).length;
    const toCreate = clamp(target - openCount, 0, 7);
    for (let i = 0; i < toCreate; i += 1) state.leads.push(generateLead());
    state.leads = state.leads.slice(-30);
  }

  function hasBookingConflict(day, start, duration, ignoreId = null) {
    const end = start + duration * 60;
    return state.bookings.some((booking) => {
      if (booking.id === ignoreId || booking.status !== 'scheduled' || booking.day !== day) return false;
      const otherEnd = booking.start + booking.duration * 60;
      return start < otherEnd + 60 && end + 60 > booking.start;
    });
  }

  function getNextBooking() {
    return state.bookings
      .filter((booking) => booking.status === 'scheduled' && (booking.day > state.day || (booking.day === state.day && booking.start + 45 >= state.time)))
      .sort((a, b) => (a.day - b.day) || (a.start - b.start))[0] || null;
  }

  function getDueBooking() {
    return state.bookings
      .filter((booking) => booking.status === 'scheduled' && booking.day === state.day && state.time >= booking.start - 90 && state.time <= booking.start + 35)
      .sort((a, b) => a.start - b.start)[0] || null;
  }

  function checkExpiredLeads() {
    for (const lead of state.leads) {
      if (!['new', 'countered'].includes(lead.status)) continue;
      const expired = lead.expiresDay < state.day || (lead.expiresDay === state.day && state.time > lead.expiresAt);
      if (expired) {
        lead.status = 'expired';
        addJournal('Lead expired', `${lead.client.name}'s ${lead.request.toLowerCase()} request expired.`, 'neutral');
      }
    }
  }

  function checkMissedBookings() {
    for (const booking of state.bookings) {
      if (booking.status !== 'scheduled') continue;
      const missed = booking.day < state.day || (booking.day === state.day && state.time > booking.start + 45);
      if (missed) {
        booking.status = 'missed';
        state.reputation = clamp(state.reputation - 0.18, 0, 5);
        state.stress = clamp(state.stress + 10, 0, 100);
        addJournal('Booking missed', `${booking.client.name}'s booking was missed. Reputation fell.`, 'bad');
        toast(`Missed booking with ${booking.client.name}.`, 'bad');
      }
    }
  }

  function applyPassiveTime(minutes, sleeping = false) {
    const hours = minutes / 60;
    if (!sleeping) {
      state.energy = clamp(state.energy - hours * 1.55, 0, 100);
      state.hygiene = clamp(state.hygiene - hours * 0.72, 0, 100);
      state.stress = clamp(state.stress + hours * 0.22, 0, 100);
    }
    if (state.day > state.wellnessDueDay) {
      state.health = clamp(state.health - hours * 0.07, 0, 100);
    }
  }

  function advanceTime(minutes, options = {}) {
    if (!state || minutes <= 0) return;
    let remaining = minutes;
    while (remaining > 0) {
      const untilMidnight = 1440 - state.time;
      const step = Math.min(remaining, untilMidnight);
      applyPassiveTime(step, Boolean(options.sleeping));
      state.time += step;
      remaining -= step;
      checkExpiredLeads();
      checkMissedBookings();
      if (state.time >= 1440) {
        state.time = 0;
        state.day += 1;
        startNewDay(false);
      }
    }
    if (options.reason) addJournal(options.reason, `${minutes} minutes passed.`, 'neutral');
    markDirty();
  }

  function chooseDailyModifier() {
    const weighted = [...DAILY_MODIFIERS];
    if (state.region === 'glass') weighted.push(DAILY_MODIFIERS.find((item) => item.id === 'convention'));
    if (state.region === 'crescent') weighted.push(DAILY_MODIFIERS.find((item) => item.id === 'festival'));
    if (state.heat > 45) weighted.push(DAILY_MODIFIERS.find((item) => item.id === 'audit'));
    return choice(weighted.filter(Boolean));
  }

  function startNewDay(firstDay = false) {
    state.dailyModifier = chooseDailyModifier();
    state.exposure = clamp(state.exposure - (state.layLowDays > 0 ? 4 : 1.1), 0, 100);
    state.heat = clamp(state.heat - (state.layLowDays > 0 ? 8 : 2.2), 0, 100);
    state.secrecy = clamp(state.secrecy + (state.relationship < 45 ? 1.5 : 0.3), 0, 100);
    state.relationship = clamp(state.relationship - (state.secrecy > 60 ? 1.5 : 0.25), 0, 100);
    if (state.layLowDays > 0) state.layLowDays -= 1;

    for (const campaign of state.marketing) campaign.days -= 1;
    state.marketing = state.marketing.filter((campaign) => campaign.days > 0);

    const protection = getProtection();
    if (protection.daily > 0) {
      if (state.money >= protection.daily) {
        state.money -= protection.daily;
        state.stats.spent += protection.daily;
        addJournal('Safe-call retainer', `Paid the daily ${currency(protection.daily)} retainer.`, 'expense');
      } else {
        state.protection = 'none';
        toast('Safe-call service ended because the retainer could not be paid.', 'bad');
      }
    }

    if (state.day % 7 === 1 && state.day > 1) {
      const rent = 310;
      if (state.money >= rent) {
        state.money -= rent;
        state.stats.spent += rent;
        addJournal('Weekly housing cost', `Paid ${currency(rent)} for housing and utilities.`, 'expense');
      } else {
        state.debt += rent - state.money;
        state.money = 0;
        state.stress = clamp(state.stress + 12, 0, 100);
        addJournal('Housing shortfall', 'Housing costs were added to debt, increasing stress.', 'bad');
      }
      if (state.debt > 0) {
        const interest = roundTo(state.debt * 0.012, 5);
        state.debt += interest;
        addJournal('Debt interest', `${currency(interest)} was added to outstanding debt.`, 'expense');
      }
    }

    if (state.day > state.wellnessDueDay) {
      state.health = clamp(state.health - 2.2, 0, 100);
      state.stress = clamp(state.stress + 1.5, 0, 100);
    }

    if (!firstDay && state.day % 2 === 0 && !state.personalEvent && chance(0.65)) {
      state.personalEvent = JSON.parse(JSON.stringify(choice(PERSONAL_EVENTS)));
    }

    if (!state.legalCase && state.heat > 48) {
      const probability = clamp((state.heat - 40) / 120 * getRegion().heat * getDifficulty().risk, 0.05, 0.42);
      if (chance(probability)) {
        const baseFine = roundTo(180 + state.heat * 4.5, 25);
        state.legalCase = {
          id: `case-${Date.now()}`,
          title: choice(['Compliance Inquiry', 'Venue Documentation Check', 'Platform Identity Review']),
          description: 'Regional enforcement or platform staff requested records. Resolve it before taking additional public-facing risks.',
          cost: baseFine
        };
        addJournal('Compliance pressure', 'A documentation or platform review requires a response.', 'bad');
      }
    }

    generateLeads();
    addJournal('New day', `${formatDay()} began. Market condition: ${state.dailyModifier.title}.`, 'neutral');
    markDirty();
  }

  function sleepToMorning() {
    const minutes = state.time < 9 * 60
      ? 9 * 60 - state.time
      : (1440 - state.time) + 9 * 60;
    advanceTime(minutes, { sleeping: true });
    state.energy = clamp(state.energy + 72, 0, 100);
    state.stress = clamp(state.stress - 18, 0, 100);
    state.hygiene = clamp(state.hygiene - 4, 0, 100);
    state.health = clamp(state.health + 2, 0, 100);
    state.player.x = 4.1;
    state.player.y = 7.7;
    toast('You slept until 9:00 AM.', 'good');
    addJournal('Rest', 'Slept until morning and recovered energy.', 'good');
    markDirty();
  }

  function showModal({ eyebrow = '', title = '', body = '', footer = '', closeable = true, wide = false, onMount = null }) {
    modalRoot.innerHTML = '';
    const fragment = modalTemplate.content.cloneNode(true);
    const card = fragment.querySelector('.modal-card');
    const backdrop = fragment.querySelector('.modal-backdrop');
    const closeButton = fragment.querySelector('.modal-close');
    fragment.querySelector('.eyebrow').textContent = eyebrow;
    fragment.querySelector('.modal-header h2').textContent = title;
    fragment.querySelector('.modal-body').innerHTML = body;
    fragment.querySelector('.modal-footer').innerHTML = footer;
    if (wide) card.classList.add('wide');
    if (!closeable) closeButton.classList.add('hidden');
    modalRoot.appendChild(fragment);
    modalRoot.classList.remove('hidden');
    modalOpen = true;
    paused = true;
    if (closeable) {
      closeButton.addEventListener('click', closeModal);
      backdrop.addEventListener('click', closeModal);
    }
    if (onMount) onMount(card);
    const focusable = card.querySelector('button:not([disabled]), input, select');
    if (focusable) setTimeout(() => focusable.focus(), 0);
  }

  function closeModal() {
    modalRoot.classList.add('hidden');
    modalRoot.innerHTML = '';
    modalOpen = false;
    paused = false;
    canvas.focus();
  }

  function riskLabel(risk) {
    if (risk < 28) return { label: 'Lower', tone: 'good' };
    if (risk < 52) return { label: 'Moderate', tone: 'warn' };
    return { label: 'Elevated', tone: 'bad' };
  }

  function visibleRiskForLead(lead) {
    let uncertainty = 18;
    if (lead.screening.id !== 'unchecked') uncertainty -= 7;
    if (lead.screening.references !== 'unchecked') uncertainty -= 9;
    const estimated = clamp(lead.client.risk + (stableUnit(lead.id) - 0.5) * uncertainty * 2, 5, 95);
    return estimated;
  }

  function leadScreeningSummary(lead) {
    const lines = [];
    if (lead.screening.id === 'verified') lines.push({ text: 'Identity verified', tone: 'good' });
    if (lead.screening.id === 'mismatch') lines.push({ text: 'Identity mismatch', tone: 'bad' });
    if (lead.screening.references === 'positive') lines.push({ text: 'Positive references', tone: 'good' });
    if (lead.screening.references === 'mixed') lines.push({ text: 'Mixed references', tone: 'warn' });
    if (lead.screening.references === 'negative') lines.push({ text: 'Negative references', tone: 'bad' });
    if (lead.screening.deposit === 'accepted') lines.push({ text: '30% deposit accepted', tone: 'good' });
    if (lead.screening.deposit === 'declined') lines.push({ text: 'Deposit declined', tone: 'warn' });
    return lines;
  }

  function runIdCheck(leadId) {
    const lead = state.leads.find((item) => item.id === leadId);
    if (!lead || lead.screening.id !== 'unchecked') return;
    advanceTime(15);
    const mismatch = lead.client.redFlag?.id === 'identity' || chance((1 - lead.client.reliability) * 0.18);
    lead.screening.id = mismatch ? 'mismatch' : 'verified';
    if (lead.client.redFlag?.reveal === 'id') lead.revealed.push(lead.client.redFlag.label);
    addSkillXP('intuition', 1);
    playTone(mismatch ? 260 : 620);
    toast(mismatch ? 'Identity details do not fully match.' : 'Identity verified.', mismatch ? 'bad' : 'good');
    showLeadModal(leadId);
  }

  function runReferenceCheck(leadId) {
    const lead = state.leads.find((item) => item.id === leadId);
    if (!lead || lead.screening.references !== 'unchecked') return;
    if (!spend(15, 'Reference check')) {
      toast('Not enough money for the reference check.', 'bad');
      return;
    }
    advanceTime(20);
    const score = lead.client.reliability - (lead.client.redFlag?.reveal === 'references' ? 0.16 : 0) + randomBetween(-0.08, 0.08);
    lead.screening.references = score > 0.73 ? 'positive' : score > 0.47 ? 'mixed' : 'negative';
    if (lead.client.redFlag?.reveal === 'references') lead.revealed.push(lead.client.redFlag.label);
    addSkillXP('intuition', 1.5);
    const tone = lead.screening.references === 'positive' ? 'good' : lead.screening.references === 'mixed' ? 'warn' : 'bad';
    toast(`References came back ${lead.screening.references}.`, tone);
    playTone(tone === 'good' ? 640 : tone === 'warn' ? 420 : 250);
    showLeadModal(leadId);
  }

  function requestDeposit(leadId) {
    const lead = state.leads.find((item) => item.id === leadId);
    if (!lead || lead.screening.deposit !== 'not-requested') return;
    advanceTime(10);
    const acceptProbability = clamp(lead.client.reliability + state.skills.negotiation * 0.035 - lead.client.risk / 380, 0.18, 0.95);
    lead.screening.deposit = chance(acceptProbability) ? 'accepted' : 'declined';
    if (lead.screening.deposit === 'declined') lead.client.risk = clamp(lead.client.risk + 7, 0, 100);
    addSkillXP('negotiation', 0.7);
    toast(
      lead.screening.deposit === 'accepted' ? 'The client agreed to a 30% deposit.' : 'The client declined the deposit request.',
      lead.screening.deposit === 'accepted' ? 'good' : 'warn'
    );
    showLeadModal(leadId);
  }

  function calculateQuoteChance(lead, quote) {
    const budgetPressure = quote <= lead.budgetMax
      ? 0.12 * (1 - quote / Math.max(lead.budgetMax, 1))
      : -((quote - lead.budgetMax) / Math.max(lead.budgetMax, 1)) * 1.15;
    const screeningTrust = (lead.screening.id === 'verified' ? 0.03 : 0)
      + (lead.screening.references === 'positive' ? 0.04 : lead.screening.references === 'negative' ? -0.08 : 0)
      + (lead.screening.deposit === 'accepted' ? 0.04 : lead.screening.deposit === 'declined' ? -0.05 : 0);
    return clamp(
      0.48
      + state.skills.negotiation * 0.055
      + state.reputation * 0.045
      + state.profileQuality / 650
      + budgetPressure
      + screeningTrust,
      0.05,
      0.94
    );
  }

  function bookLead(lead, agreedTotal) {
    if (hasBookingConflict(lead.bookingDay, lead.start, lead.duration)) {
      toast('That time conflicts with another booking, including travel buffer.', 'bad');
      return false;
    }
    const depositAmount = lead.screening.deposit === 'accepted' ? roundTo(agreedTotal * 0.3, 5) : 0;
    if (depositAmount > 0) {
      state.money += depositAmount;
      state.stats.grossEarned += depositAmount;
      state.stats.netEarned += depositAmount;
      addJournal('Deposit received', `${lead.client.name} paid a ${currency(depositAmount)} deposit.`, 'income');
    }
    const booking = {
      id: `booking-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      leadId: lead.id,
      client: JSON.parse(JSON.stringify(lead.client)),
      request: lead.request,
      day: lead.bookingDay,
      start: lead.start,
      duration: lead.duration,
      total: agreedTotal,
      deposit: depositAmount,
      status: 'scheduled',
      notes: lead.notes || '',
      screening: JSON.parse(JSON.stringify(lead.screening)),
      revealed: [...lead.revealed],
      outfitPrepared: false,
      result: null
    };
    state.bookings.push(booking);
    lead.status = 'booked';
    lead.quote = agreedTotal;
    state.clientHistory.unshift({
      client: JSON.parse(JSON.stringify(lead.client)),
      status: 'scheduled',
      lastDay: state.day,
      notes: lead.notes || ''
    });
    addSkillXP('negotiation', agreedTotal > lead.offer ? 1.5 : 0.7);
    addJournal('Booking confirmed', `${lead.client.name}: ${lead.request}, ${formatDay(lead.bookingDay)} at ${formatTime(lead.start)}, ${currency(agreedTotal)}.`, 'good');
    toast(`Booking confirmed with ${lead.client.name}.`, 'good');
    playTone(720, 0.08);
    markDirty();
    return true;
  }

  function sendQuote(leadId, quote) {
    const lead = state.leads.find((item) => item.id === leadId);
    if (!lead || !['new', 'countered'].includes(lead.status)) return;
    quote = roundTo(clamp(Number(quote) || lead.offer, 100, 10000), 25);
    if (hasBookingConflict(lead.bookingDay, lead.start, lead.duration)) {
      toast('The requested slot conflicts with an existing booking.', 'bad');
      return;
    }
    lead.quote = quote;
    advanceTime(15);
    const acceptChance = calculateQuoteChance(lead, quote);
    if (chance(acceptChance)) {
      if (bookLead(lead, quote)) {
        closeModal();
        setTab('calendar');
      }
      return;
    }
    const counterEligible = quote <= lead.budgetMax * 1.36 && chance(0.72 + state.skills.negotiation * 0.03);
    if (counterEligible) {
      const counter = roundTo(clamp((lead.offer + Math.min(quote, lead.budgetMax)) / 2 + state.skills.negotiation * 8, lead.offer, lead.budgetMax), 25);
      lead.counter = counter;
      lead.status = 'countered';
      toast(`${lead.client.name} countered at ${currency(counter)}.`, 'warn');
      addJournal('Counteroffer received', `${lead.client.name} countered at ${currency(counter)}.`, 'neutral');
      showLeadModal(leadId);
    } else {
      lead.status = 'declined';
      state.stats.declined += 1;
      state.reputation = clamp(state.reputation - 0.015, 0, 5);
      toast(`${lead.client.name} declined the quote.`, 'warn');
      addJournal('Quote declined', `${lead.client.name} declined a ${currency(quote)} quote.`, 'neutral');
      closeModal();
      markDirty();
    }
  }

  function acceptCounter(leadId) {
    const lead = state.leads.find((item) => item.id === leadId);
    if (!lead || lead.status !== 'countered' || !lead.counter) return;
    if (bookLead(lead, lead.counter)) {
      closeModal();
      setTab('calendar');
    }
  }

  function acceptOffer(leadId) {
    const lead = state.leads.find((item) => item.id === leadId);
    if (!lead || !['new', 'countered'].includes(lead.status)) return;
    const amount = lead.counter || lead.offer;
    if (bookLead(lead, amount)) {
      closeModal();
      setTab('calendar');
    }
  }

  function declineLead(leadId) {
    const lead = state.leads.find((item) => item.id === leadId);
    if (!lead) return;
    lead.status = 'declined-by-player';
    state.stats.declined += 1;
    addJournal('Lead declined', `You declined ${lead.client.name}'s ${lead.request.toLowerCase()} request.`, 'neutral');
    toast('Lead declined.', 'neutral');
    closeModal();
    markDirty();
  }

  function showLeadModal(leadId) {
    const lead = state.leads.find((item) => item.id === leadId);
    if (!lead) return;
    const visibleRisk = visibleRiskForLead(lead);
    const risk = riskLabel(visibleRisk);
    const screening = leadScreeningSummary(lead);
    const currentOffer = lead.counter || lead.offer;
    const suggested = roundTo(Math.max(state.baseRate * lead.duration * getRegion().rate, currentOffer), 25);
    const conflict = hasBookingConflict(lead.bookingDay, lead.start, lead.duration);
    const revealedFlags = [...new Set(lead.revealed)];
    const active = ['new', 'countered'].includes(lead.status);

    const body = `
      <div class="negotiation-layout">
        <div class="stack">
          <div class="card ${conflict ? 'danger' : 'emphasis'}">
            <div class="card-header">
              <div>
                <h3>${escapeHTML(lead.client.name)}, ${lead.client.age} · ${escapeHTML(lead.client.type)}</h3>
                <p>${escapeHTML(lead.request)} · ${lead.duration} hours · ${formatDay(lead.bookingDay)} at ${formatTime(lead.start)}</p>
              </div>
              <span class="pill ${risk.tone}">${risk.label} estimated risk</span>
            </div>
            <div class="pill-row" style="margin-top:8px">
              ${lead.client.traits.map((trait) => `<span class="pill blue">${escapeHTML(trait)}</span>`).join('')}
              ${lead.client.preferences.slice(0, 2).map((trait) => `<span class="pill">Prefers ${escapeHTML(trait)}</span>`).join('')}
            </div>
            ${conflict ? '<div class="notice bad" style="margin-top:9px">This slot conflicts with another booking after travel buffer. You cannot confirm it.</div>' : ''}
          </div>

          <div>
            <h3 style="font-size:13px;margin-bottom:8px">Screening</h3>

  function calculateNoShowChance(booking) {
    const screening = booking.screening || {};
    let probability = (1 - booking.client.reliability) * 0.32;
    if (screening.id === 'verified') probability -= 0.035;
    if (screening.references === 'positive') probability -= 0.055;
    if (screening.references === 'negative') probability += 0.07;
    if (screening.deposit === 'accepted') probability -= 0.08;
    return clamp(probability * getDifficulty().risk, 0.01, 0.32);
  }

  function startBooking(bookingId) {
    const booking = state.bookings.find((item) => item.id === bookingId);
    if (!booking || booking.status !== 'scheduled') return;
    if (booking.day !== state.day || state.time < booking.start - 90 || state.time > booking.start + 35) {
      toast('This booking is not currently available for travel.', 'bad');
      return;
    }
    closeModal();
    booking.status = 'in-progress';
    const travel = Math.max(18, getRegion().travel - (state.protection === 'driver' || state.protection === 'close' ? 10 : 0));
    const wait = Math.max(0, booking.start - state.time - travel);
    if (wait > 0) advanceTime(wait);
    advanceTime(travel);

    if (chance(calculateNoShowChance(booking))) {
      booking.status = 'no-show';
      state.stress = clamp(state.stress + 7, 0, 100);
      state.energy = clamp(state.energy - 5, 0, 100);
      advanceTime(55);
      addJournal('Client no-show', `${booking.client.name} did not arrive. ${booking.deposit > 0 ? 'The deposit was retained.' : 'No deposit was on file.'}`, 'bad');
      showModal({
        eyebrow: 'Booking result',
        title: 'Client no-show',
        body: `<div class="notice warn">${escapeHTML(booking.client.name)} did not arrive. ${booking.deposit > 0 ? `You retained the ${currency(booking.deposit)} deposit.` : 'No deposit was collected, so the time produced no income.'}</div>`,
        footer: '<button class="primary-button" data-noshow="home">Return home</button>',
        closeable: false,
        onMount: (card) => card.querySelector('[data-noshow="home"]').addEventListener('click', () => {
          closeModal();
          state.player.x = 8.4;
          state.player.y = 8.4;
          setTab('today');
          markDirty();
        })
      });
      return;
    }

    const outfit = OUTFITS[state.player.outfit];
    const outfitMatch = booking.client.preferences.filter((tag) => outfit.tags.includes(tag)).length;
    const screening = booking.screening || {};
    const safetyPrepared = getEffectiveSafety()
      + (screening.id === 'verified' ? 7 : screening.id === 'mismatch' ? -15 : 0)
      + (screening.references === 'positive' ? 9 : screening.references === 'mixed' ? 1 : screening.references === 'negative' ? -14 : 0)
      + (screening.deposit === 'accepted' ? 4 : 0)
      + (state.professionalKit > 0 ? 6 : -14)
      + (state.boundaries.publicFirst ? 4 : 0);
    const riskProbability = clamp(
      (booking.client.risk / 145)
      * getRegion().risk
      * getDifficulty().risk
      * (1 - clamp(safetyPrepared, 0, 85) / 120),
      0.035,
      0.66
    );

    state.professionalKit = Math.max(0, state.professionalKit - 1);
    state.scene = 'date';
    state.player.x = 1.8;
    state.player.y = 7.7;
    state.player.direction = 'up';
    state.dateState = {
      bookingId,
      phase: 0,
      rapport: clamp(42 + state.skills.charm * 3 + outfitMatch * 7 + state.hygiene / 14 - state.stress / 18, 20, 80),
      professionalism: clamp(45 + state.skills.negotiation * 2 + state.profileQuality / 12 + (outfitMatch ? 5 : -3), 20, 85),
      safety: clamp(45 + safetyPrepared * 0.48, 20, 92),
      outfitMatch,
      riskEvent: chance(riskProbability),
      extension: 0,
      ignoredRisk: false,
      safeExit: false,
      rapportNotes: [],
      venue: choice(['Lantern Room', 'Garden Restaurant', 'Hotel Atrium', 'Rooftop Lounge'])
    };
    addJournal('Booking started', `Arrived for ${booking.client.name}'s ${booking.request.toLowerCase()} booking.`, 'neutral');
    toast('Arrived. Walk to the client and press E.', 'good');
    statusMessage.textContent = 'Approach the client. Read the room, keep boundaries clear, and decide how to respond.';
    playTone(700, 0.08);
    markDirty();
  }

  function getCurrentBooking() {
    if (!state?.dateState) return null;
    return state.bookings.find((booking) => booking.id === state.dateState.bookingId) || null;
  }

  function showDateRoundModal() {
    const booking = getCurrentBooking();
    const date = state.dateState;
    if (!booking || !date) return;
    if (date.phase >= 3) return;
    const client = booking.client;
    const outfit = OUTFITS[state.player.outfit];
    let title = '';
    let description = '';
    let choices = [];

    if (date.phase === 0) {
      title = 'First impression';
      description = `${client.name} is waiting near the table. Their profile emphasized ${client.preferences.slice(0, 2).join(' and ')} company.`;
      choices = [
        { id: 'warm', title: 'Offer a warm, attentive greeting', detail: 'Charm check · strong for friendly or artsy clients', cls: 'safe' },
        { id: 'polished', title: 'Set a polished professional tone', detail: 'Raises professionalism and reinforces the agreed plan', cls: 'safe' },
        { id: 'playful', title: 'Open with playful confidence', detail: `Best with playful clients or a Bold presentation. Wearing ${outfit.name}.`, cls: 'risky' }
      ];
    } else if (date.phase === 1) {
      title = 'Guide the evening';
      description = `The conversation is moving. Rapport is ${Math.round(date.rapport)} and professionalism is ${Math.round(date.professionalism)}.`;
      choices = [
        { id: 'listen', title: 'Ask thoughtful questions and listen closely', detail: 'Builds rapport; uses charm and client-reading skill', cls: 'safe' },
        { id: 'guide', title: 'Guide the schedule and confirm expectations', detail: 'Builds professionalism and safety', cls: 'safe' },
        { id: 'extend', title: 'Offer one additional hour at your posted rate', detail: 'Negotiation check; more revenue if accepted, more fatigue either way', cls: 'risky' }
      ];
    } else if (date.riskEvent) {
      title = 'A boundary is tested';
      const redFlag = client.redFlag?.label || 'The client changes part of the agreed plan without asking';
      description = `${redFlag}. Your safety preparation and response now matter more than rapport.`;
      choices = [
        { id: 'boundary', title: 'Restate the boundary and redirect', detail: 'De-escalation check; continue only if the plan is respected', cls: 'safe' },
        { id: 'safeexit', title: 'Use the safe-call protocol and end the booking', detail: 'Safest option; retain only the agreed call-out portion or deposit', cls: 'exit' },
        { id: 'ignore', title: 'Ignore the warning sign to preserve the mood', detail: 'May protect rapport, but sharply reduces safety and raises stress', cls: 'risky' }
      ];
    } else {
      title = 'Close the booking well';
      description = 'The agreed time is nearly complete. Decide how to finish the professional interaction.';
      choices = [
        { id: 'feedback', title: 'Invite feedback and summarize preferences', detail: 'Balanced reputation and CRM benefit', cls: 'safe' },
        { id: 'personal', title: 'End on a warmer, more personal note', detail: 'Higher attachment and regular-client chance; raises secrecy load', cls: 'risky' },
        { id: 'payment', title: 'Close on time and confirm payment clearly', detail: 'Professionalism, safety, and reliable collection', cls: 'safe' }
      ];
    }

    const body = `
      <div class="kpi-grid">
        <div class="kpi"><span>Rapport</span><strong>${Math.round(date.rapport)}</strong></div>
        <div class="kpi"><span>Professionalism</span><strong>${Math.round(date.professionalism)}</strong></div>
        <div class="kpi"><span>Safety</span><strong>${Math.round(date.safety)}</strong></div>
        <div class="kpi"><span>Fee</span><strong>${currency(booking.total + date.extension)}</strong></div>
      </div>
      <div class="notice ${date.riskEvent && date.phase === 2 ? 'warn' : ''}">${escapeHTML(description)}</div>
      <div style="margin-top:12px">
        ${choices.map((item) => `<button class="dialogue-choice ${item.cls}" data-date-choice="${item.id}"><h4>${escapeHTML(item.title)}</h4><p>${escapeHTML(item.detail)}</p></button>`).join('')}
      </div>`;
    showModal({
      eyebrow: `Date scene · Round ${date.phase + 1} of 3`,
      title,
      body,
      footer: '<button class="ghost-button" data-date-choice="pause">Return to scene</button>',
      closeable: false,
      onMount: (card) => {
        card.addEventListener('click', (event) => {
          const button = event.target.closest('[data-date-choice]');
          if (!button) return;
          if (button.dataset.dateChoice === 'pause') return closeModal();
          applyDateChoice(button.dataset.dateChoice);
        });
      }
    });
  }

  function applyDateChoice(action) {
    const booking = getCurrentBooking();
    const date = state.dateState;
    if (!booking || !date) return;
    const client = booking.client;
    const outfit = OUTFITS[state.player.outfit];

    if (date.phase === 0) {
      if (action === 'warm') {
        const match = client.preferences.some((tag) => ['friendly', 'artsy'].includes(tag));
        date.rapport += 8 + state.skills.charm * 2.2 + (match ? 6 : 0);
        date.professionalism += 2;
        date.rapportNotes.push('Attentive opening');
        addSkillXP('charm', 1.2);
      }
      if (action === 'polished') {
        const match = client.preferences.some((tag) => ['polished', 'professional', 'discreet'].includes(tag));
        date.professionalism += 11 + (match ? 6 : 0);
        date.rapport += 4;
        date.safety += 4;
        date.rapportNotes.push('Clear professional tone');
        addSkillXP('negotiation', 0.6);
      }
      if (action === 'playful') {
        const match = client.preferences.includes('playful') || outfit.tags.includes('playful');
        date.rapport += match ? 15 + state.skills.charm : 3;
        date.professionalism += match ? 2 : -5;
        date.safety += match ? 0 : -2;
        date.rapportNotes.push(match ? 'Playful style matched' : 'Opening missed the client profile');
        addSkillXP('charm', 0.8);
      }
      date.phase = 1;
      closeModal();
      toast('The evening continues. Interact again when ready.', 'good');
    } else if (date.phase === 1) {
      if (action === 'listen') {
        date.rapport += 10 + state.skills.charm * 1.8;
        date.professionalism += 3;
        date.rapportNotes.push('Remembered client preferences');
        addSkillXP('charm', 1.4);
        addSkillXP('intuition', 0.5);
      }
      if (action === 'guide') {
        date.professionalism += 12 + state.skills.negotiation;
        date.safety += 7;
        date.rapport += 4;
        date.rapportNotes.push('Kept the schedule clear');
        addSkillXP('negotiation', 1);
      }
      if (action === 'extend') {
        const probability = clamp(0.32 + state.skills.negotiation * 0.08 + date.rapport / 260 + state.reputation * 0.025, 0.25, 0.88);
        if (chance(probability)) {
          const extension = roundTo(state.baseRate * getRegion().rate * (1 + state.reputation * 0.035), 25);
          date.extension += extension;
          date.rapport += 6;
          date.professionalism += 4;
          date.safety -= 2;
          date.rapportNotes.push(`Extension accepted at ${currency(extension)}`);
          toast(`One-hour extension accepted for ${currency(extension)}.`, 'good');
        } else {
          date.rapport -= 4;
          date.professionalism += 1;
          date.rapportNotes.push('Extension declined');
          toast('The extension was declined.', 'warn');
        }
        addSkillXP('negotiation', 1.5);
      }
      date.phase = 2;
      closeModal();
      toast(date.riskEvent ? 'Something in the plan has shifted. Interact to respond.' : 'The booking is nearing its close.', date.riskEvent ? 'warn' : 'good');
    } else if (date.phase === 2 && date.riskEvent) {
      if (action === 'boundary') {
        const success = chance(clamp(0.46 + state.skills.deescalation * 0.09 + date.professionalism / 260 + date.safety / 350, 0.45, 0.94));
        date.safety += success ? 13 : 4;
        date.professionalism += success ? 9 : 3;
        date.rapport += success ? -1 : -8;
        state.stress = clamp(state.stress + (success ? 3 : 9), 0, 100);
        date.rapportNotes.push(success ? 'Boundary respected after redirection' : 'Boundary required repeated enforcement');
        addSkillXP('deescalation', 1.8);
      }
      if (action === 'safeexit') {
        date.safeExit = true;
        date.safety += 18;
        state.stats.safeExits += 1;
        addSkillXP('deescalation', 1.4);
        closeModal();
        completeDate({ early: true, safeExit: true });
        return;
      }
      if (action === 'ignore') {
        date.ignoredRisk = true;
        date.rapport += 8;
        date.safety -= 27;
        date.professionalism -= 8;
        state.stress = clamp(state.stress + 10, 0, 100);
        date.rapportNotes.push('Warning sign was ignored');
      }
      date.phase = 3;
      closeModal();
      completeDate({ early: false, safeExit: false });
      return;
    } else if (date.phase === 2) {
      if (action === 'feedback') {
        date.rapport += 8;
        date.professionalism += 7;
        date.rapportNotes.push('Collected useful client notes');
        addSkillXP('charm', 0.7);
        addSkillXP('branding', 0.5);
      }
      if (action === 'personal') {
        date.rapport += 13;
        date.professionalism -= 2;
        state.secrecy = clamp(state.secrecy + 3 + client.attachment * 4, 0, 100);
        date.rapportNotes.push('Created a stronger personal attachment');
        client.attachment = clamp(client.attachment + 0.16, 0, 1);
      }
      if (action === 'payment') {
        date.professionalism += 12;
        date.safety += 5;
        date.rapport += 2;
        date.rapportNotes.push('Payment and end time confirmed');
        addSkillXP('negotiation', 0.8);
      }
      date.phase = 3;
      closeModal();
      completeDate({ early: false, safeExit: false });
    }
    date.rapport = clamp(date.rapport, 0, 100);
    date.professionalism = clamp(date.professionalism, 0, 100);
    date.safety = clamp(date.safety, 0, 100);
    markDirty();
  }

  function completeDate({ early = false, safeExit = false } = {}) {
    const booking = getCurrentBooking();
    const date = state.dateState;
    if (!booking || !date) return;
    const structure = getStructure();
    const protection = getProtection();
    const client = booking.client;
    const totalBooked = booking.total + date.extension;
    const billable = early ? Math.max(booking.deposit, roundTo(totalBooked * 0.35, 5)) : totalBooked;
    const quality = clamp(
      date.rapport * 0.43
      + date.professionalism * 0.38
      + state.hygiene * 0.08
      + state.energy * 0.05
      + date.outfitMatch * 5
      - state.stress * 0.05,
      0,
      100
    );
    let incidentProbability = 0;
    if (!safeExit) {
      incidentProbability = (date.riskEvent ? 0.10 : 0.018)
        + client.risk / 250 * (1 - date.safety / 115)
        + (date.ignoredRisk ? 0.16 : 0);
      incidentProbability *= getDifficulty().risk * getRegion().risk;
      incidentProbability *= 1 - getEffectiveSafety() / 180;
    }
    const incident = chance(clamp(incidentProbability, 0, 0.58));
    let collectionRate = 1;
    let incidentText = '';
    if (incident) {
      state.stats.incidents += 1;
      const incidentType = choice(['payment dispute', 'privacy breach attempt', 'aggressive boundary pressure', 'unexpected enforcement attention']);
      incidentText = `The booking ended with a ${incidentType}.`;
      state.stress = clamp(state.stress + 16, 0, 100);
      state.health = clamp(state.health - 5, 0, 100);
      state.exposure = clamp(state.exposure + 8, 0, 100);
      state.heat = clamp(state.heat + 8, 0, 100);
      collectionRate = incidentType === 'payment dispute' ? 0.68 : 0.9;
      addJournal('Booking incident', `${client.name}: ${incidentText}`, 'bad');
    }

    const tipRate = early || incident ? 0 : clamp((quality - 55) / 180 + (client.archetype === 'patron' ? 0.04 : 0), 0, 0.24);
    const tip = roundTo(billable * tipRate * randomBetween(0.75, 1.25), 5);
    const collectedBase = roundTo(billable * collectionRate, 5);
    const totalCuts = roundTo(collectedBase * (structure.cut + protection.bookingCut), 5);
    const remainingAfterDeposit = Math.max(0, collectedBase - booking.deposit);
    const cashChange = remainingAfterDeposit + tip - totalCuts;
    const projectedCash = state.money + cashChange;
    if (projectedCash < 0) {
      state.debt += Math.abs(projectedCash);
      state.money = 0;
    } else {
      state.money = projectedCash;
    }
    state.stats.grossEarned += remainingAfterDeposit + tip;
    state.stats.netEarned += cashChange;

    let review = null;
    if (!safeExit) {
      review = clamp(2.15 + quality / 34 - (incident ? 0.9 : 0) + randomBetween(-0.22, 0.22), 1, 5);
      const oldCount = state.reviewCount;
      state.reputation = clamp((state.reputation * oldCount + review) / (oldCount + 1), 0, 5);
      state.reviewCount += 1;
    } else {
      state.reputation = clamp(state.reputation + 0.02, 0, 5);
    }

    const actualHours = booking.duration + (date.extension > 0 ? 1 : 0);
    state.energy = clamp(state.energy - actualHours * 7.5 - (incident ? 6 : 0), 0, 100);
    state.hygiene = clamp(state.hygiene - actualHours * 6.2, 0, 100);
    state.stress = clamp(state.stress + (date.riskEvent ? 7 : 1) - (quality > 75 ? 3 : 0), 0, 100);
    state.exposure = clamp(state.exposure + client.exposure * 0.28, 0, 100);
    state.heat = clamp(state.heat + getRegion().heat * (1.7 + client.exposure / 12), 0, 100);
    state.stats.completed += early ? 0 : 1;

    booking.status = incident ? 'incident' : safeExit ? 'safe-exit' : 'completed';
    booking.result = { quality, review, tip, collectedBase, totalCuts, cashChange, incident, safeExit };
    const history = state.clientHistory.find((item) => item.client.id === client.id);
    if (history) {
      history.status = booking.status;
      history.lastDay = state.day;
      history.notes = date.rapportNotes.join('; ');
    }

    let becameRegular = false;
    if (!early && !incident && review >= 4.15 && chance(0.18 + client.attachment * 0.34 + date.rapport / 500)) {
      if (!state.regulars.some((item) => item.id === client.id)) {
        state.regulars.push({ ...client, lastBookingDay: state.day, loyalty: clamp(review / 5, 0, 1) });
        becameRegular = true;
      }
    }

    awardXP(Math.round(18 + quality * 0.35 + (safeExit ? 10 : 0)));
    addSkillXP('charm', quality > 70 ? 1 : 0.4);
    addSkillXP('intuition', date.riskEvent ? 1.2 : 0.4);
    const travelHome = Math.max(16, getRegion().travel - (state.protection === 'driver' || state.protection === 'close' ? 10 : 0));
    const elapsed = Math.round(actualHours * 60 + travelHome);
    advanceTime(elapsed);

    addJournal(
      safeExit ? 'Safe exit completed' : 'Booking completed',
      `${client.name}: ${currency(collectedBase + tip)} collected before ${currency(totalCuts)} in support shares.${review ? ` Review ${review.toFixed(1)}/5.` : ''}`,
      incident ? 'bad' : safeExit ? 'warn' : 'good'
    );

    const resultTone = incident ? 'bad' : safeExit ? 'warn' : 'good';
    const body = `
      <div class="kpi-grid">
        <div class="kpi"><span>Collected</span><strong>${currency(collectedBase + tip)}</strong></div>
        <div class="kpi"><span>Net change</span><strong class="${cashChange >= 0 ? 'money-positive' : 'money-negative'}">${currency(cashChange)}</strong></div>
        <div class="kpi"><span>Quality</span><strong>${Math.round(quality)}/100</strong></div>
        <div class="kpi"><span>${review ? 'Review' : 'Outcome'}</span><strong>${review ? `${review.toFixed(1)}/5` : 'Safe exit'}</strong></div>
      </div>
      <div class="notice ${incident ? 'bad' : safeExit ? 'warn' : ''}">
        ${incident ? escapeHTML(incidentText) : safeExit ? 'You ended the booking through the safe-call protocol after a boundary issue.' : 'The booking concluded on schedule.'}
      </div>
      <div class="card" style="margin-top:12px">
        <div class="row spread"><span>Agreed / billable fee</span><strong>${currency(billable)}</strong></div>
        <div class="row spread"><span>Tip</span><strong>${currency(tip)}</strong></div>
        <div class="row spread"><span>${escapeHTML(structure.name)} + ${escapeHTML(protection.name)}</span><strong class="money-negative">−${currency(totalCuts)}</strong></div>
        ${booking.deposit > 0 ? `<div class="row spread"><span>Deposit received earlier</span><strong>${currency(booking.deposit)}</strong></div>` : ''}
      </div>
      <div class="pill-row">
        ${date.rapportNotes.slice(0, 4).map((note) => `<span class="pill ${incident ? 'warn' : 'good'}">${escapeHTML(note)}</span>`).join('')}
        ${becameRegular ? '<span class="pill good">New regular client</span>' : ''}
      </div>`;

    showModal({
      eyebrow: 'Booking result',
      title: incident ? 'Complicated ending' : safeExit ? 'Safe exit' : 'Date complete',
      body,
      footer: '<button class="primary-button" data-result="home">Return home</button>',
      closeable: false,
      onMount: (card) => {
        card.querySelector('[data-result="home"]').addEventListener('click', () => {
          state.scene = 'apartment';
          state.player.x = 8.35;
          state.player.y = 8.35;
          state.player.direction = 'left';
          state.dateState = null;
          closeModal();
          setTab('today');
          toast('Returned home.', resultTone);
          statusMessage.textContent = 'Review your results, recover, and prepare for the next booking.';
          markDirty();
        });
      }
    });
  }

  function confirmDateExit() {
    const booking = getCurrentBooking();
    if (!booking) return;
    showModal({
      eyebrow: 'Date scene',
      title: 'Leave the booking?',
      body: '<div class="notice warn">Leaving now triggers the safe-call exit protocol. You will retain only the deposit or call-out portion, but sharply reduce further risk.</div>',
      footer: '<button class="ghost-button" data-exit="stay">Stay</button><button class="danger-button" data-exit="leave">Use safe exit</button>',
      onMount: (card) => {
        card.addEventListener('click', (event) => {
          const button = event.target.closest('[data-exit]');
          if (!button) return;
          if (button.dataset.exit === 'stay') return closeModal();
          if (button.dataset.exit === 'leave') {
            state.dateState.safeExit = true;
            state.stats.safeExits += 1;
            closeModal();
            completeDate({ early: true, safeExit: true });
          }
        });
      }
    });
  }

  function changeStructure(structureId) {
    if (!STRUCTURES[structureId] || structureId === state.structure) return;
    const fees = { independent: 0, manager: 60, agency: 180 };
    const minutes = { independent: 60, manager: 120, agency: 240 };
    const fee = fees[structureId];
    if (fee && !spend(fee, `${STRUCTURES[structureId].name} onboarding`)) {
      toast('Not enough money for onboarding.', 'bad');
      return;
    }
    state.structure = structureId;
    advanceTime(minutes[structureId]);
    addJournal('Business structure changed', `Now operating through ${STRUCTURES[structureId].name}.`, 'neutral');
    toast(`Business structure: ${STRUCTURES[structureId].name}.`, 'good');
    generateLeads();
    markDirty();
  }

  function changeProtection(protectionId) {
    if (!PROTECTION[protectionId] || protectionId === state.protection) return;
    const next = PROTECTION[protectionId];
    if (next.daily > 0 && !spend(next.daily, `${next.name} first-day retainer`)) {
      toast('Not enough money for the first-day retainer.', 'bad');
      return;
    }
    state.protection = protectionId;
    advanceTime(30);
    addJournal('Protection plan changed', `Protection plan set to ${next.name}.`, 'neutral');
    toast(`Protection plan: ${next.name}.`, 'good');
    markDirty();
  }

  function updateBaseRate(value) {
    const rate = roundTo(clamp(Number(value) || state.baseRate, 100, 1500), 25);
    state.baseRate = rate;
    addJournal('Rate updated', `Base rate set to ${currency(rate)} per hour.`, 'neutral');
    toast(`Base rate set to ${currency(rate)}/hour.`, 'good');
    markDirty();
  }

  function trainSkillWithPoint(skill) {
    if (!(skill in state.skills) || state.skillPoints <= 0 || state.skills[skill] >= 5) return;
    state.skillPoints -= 1;
    state.skills[skill] += 1;
    addJournal('Skill point used', `${skill[0].toUpperCase() + skill.slice(1)} increased to level ${state.skills[skill]}.`, 'good');
    toast(`${skill[0].toUpperCase() + skill.slice(1)} increased.`, 'good');
    playTone(740, 0.08);
    markDirty();
  }

  function repayDebt(amount) {
    amount = clamp(roundTo(Number(amount) || 0, 25), 0, Math.min(state.money, state.debt));
    if (amount <= 0) return;
    state.money -= amount;
    state.debt -= amount;
    state.stats.spent += amount;
    state.stress = clamp(state.stress - amount / 500, 0, 100);
    addJournal('Debt payment', `Paid ${currency(amount)} toward outstanding debt.`, 'expense');
    toast(`Paid ${currency(amount)} toward debt.`, 'good');
    markDirty();
  }

  function resolvePersonalEvent(optionId) {
    const event = state.personalEvent;
    if (!event) return;
    const option = event.options.find((item) => item.id === optionId);
    if (!option) return;
    if (option.cost && !spend(option.cost, event.title)) {
      toast('Not enough money for that choice.', 'bad');
      return;
    }
    if (option.minutes) advanceTime(option.minutes);
    if (option.relationship) state.relationship = clamp(state.relationship + option.relationship, 0, 100);
    if (option.stress) state.stress = clamp(state.stress + option.stress, 0, 100);
    if (option.secrecy) state.secrecy = clamp(state.secrecy + option.secrecy, 0, 100);
    if (option.exposure) state.exposure = clamp(state.exposure + option.exposure, 0, 100);
    if (option.heat) state.heat = clamp(state.heat + option.heat, 0, 100);
    if (option.skillXP) addSkillXP(option.skillXP, 1.4);
    if (option.lead) state.leads.push(generateLead());
    addJournal(event.title, `${option.label}: ${option.detail}.`, option.relationship > 0 || option.heat < 0 ? 'good' : 'neutral');
    state.personalEvent = null;
    toast(`${event.title} resolved.`, 'good');
    markDirty();
  }

  function resolveLegalCase(method) {
    const legalCase = state.legalCase;
    if (!legalCase) return;
    if (method === 'consult') {
      if (!spend(legalCase.cost, 'Legal and compliance consultation')) {
        toast('Not enough money for consultation.', 'bad');
        return;
      }
      state.heat = clamp(state.heat - 28, 0, 100);
      state.stress = clamp(state.stress - 4, 0, 100);
      addJournal('Compliance case resolved', `Paid ${currency(legalCase.cost)} for professional assistance.`, 'good');

      state.layLowDays = Math.max(state.layLowDays, 2);
      state.heat = clamp(state.heat - 36, 0, 100);
      state.stress = clamp(state.stress + 5, 0, 100);
      addJournal('Compliance case resolved', 'Chose to lie low for two days and reduce public exposure.', 'warn');
    }
    if (method === 'contest') {
      const success = chance(clamp(0.34 + state.skills.negotiation * 0.09 + state.skills.intuition * 0.04, 0.35, 0.82));
      if (success) {
        state.heat = clamp(state.heat - 25, 0, 100);
        addSkillXP('negotiation', 2);
        addJournal('Review contested successfully', 'Records and communication resolved the inquiry without a fine.', 'good');
        toast('The inquiry was resolved without a fine.', 'good');

        const cost = roundTo(legalCase.cost * 1.3, 25);
        if (state.money >= cost) {
          state.money -= cost;
          state.stats.spent += cost;
        } else {
          state.debt += cost - state.money;
          state.money = 0;
        }
        state.heat = clamp(state.heat - 12, 0, 100);
        state.stress = clamp(state.stress + 11, 0, 100);
        addJournal('Review contest failed', `The case produced ${currency(cost)} in fines or costs.`, 'bad');
        toast(`The contest failed, costing ${currency(cost)}.`, 'bad');
      }

    state.legalCase = null;
    markDirty();
