  const ISO = { tileW: 76, tileH: 38, originX: 480, originY: 118 };
  const view = { ox: 0, oy: 0 };
  function fitCanvas() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    const aspect = clamp(w / h, 0.5, 3);
    const W = aspect >= 1.6 ? Math.round(600 * aspect) : 960;
    const H = aspect >= 1.6 ? 600 : Math.round(960 / aspect);
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    view.ox = (W - 960) / 2;
    view.oy = (H - 600) / 2;
  }
  const ambientSpecks = Array.from({ length: 34 }, () => ({
    x: randomBetween(20, 940), y: randomBetween(35, 330), r: randomBetween(0.6, 2.2), phase: randomBetween(0, Math.PI * 2)
  }));

  function isoPoint(x, y, z = 0) {
    return {
      x: (x - y) * ISO.tileW / 2 + ISO.originX,
      y: (x + y) * ISO.tileH / 2 + ISO.originY - z
    };
  }

  function polygon(points, fill, stroke = null, width = 1) {
    if (!points.length) return;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i += 1) ctx.lineTo(points[i].x, points[i].y);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(); }
  }

  function drawIsoTile(x, y, fill, stroke = 'rgba(35,55,52,.16)') {
    polygon([
      isoPoint(x, y), isoPoint(x + 1, y), isoPoint(x + 1, y + 1), isoPoint(x, y + 1)
    ], fill, stroke, 0.7);
  }

  function drawIsoBox(x, y, width, depth, height, colors = {}) {
    const baseA = isoPoint(x, y, 0);
    const baseB = isoPoint(x + width, y, 0);
    const baseC = isoPoint(x + width, y + depth, 0);
    const baseD = isoPoint(x, y + depth, 0);
    const topA = isoPoint(x, y, height);
    const topB = isoPoint(x + width, y, height);
    const topC = isoPoint(x + width, y + depth, height);
    const topD = isoPoint(x, y + depth, height);
    polygon([baseD, baseC, topC, topD], colors.left || '#6e7867', colors.stroke || 'rgba(30,45,44,.36)', 1);
    polygon([baseB, baseC, topC, topB], colors.right || '#58675e', colors.stroke || 'rgba(30,45,44,.36)', 1);
    polygon([topA, topB, topC, topD], colors.top || '#a7ad91', colors.stroke || 'rgba(30,45,44,.38)', 1.1);
  }

  function drawBackdrop(now, dateScene = false) {
    const region = state ? getRegion() : REGIONS.lantern;
    const colors = region.palette;
    const gradient = ctx.createLinearGradient(0, -view.oy, 0, canvas.height - view.oy);
    if (dateScene) {
      gradient.addColorStop(0, '#233c46');
      gradient.addColorStop(0.48, '#5a6f75');
      gradient.addColorStop(1, '#d3a26a');
    } else {
      gradient.addColorStop(0, colors[0]);
      gradient.addColorStop(0.52, '#d4d9bd');
      gradient.addColorStop(1, '#dec48d');
    }
    ctx.fillStyle = gradient;
    ctx.fillRect(-view.ox, -view.oy, canvas.width, canvas.height);

    ctx.save();
    ctx.globalAlpha = dateScene ? 0.32 : 0.24;
    ctx.fillStyle = dateScene ? '#f0c47a' : '#f9f0cd';
    ctx.beginPath();
    ctx.arc(dateScene ? 780 : 145, dateScene ? 100 : 85, dateScene ? 38 : 52, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = dateScene ? 0.27 : 0.20;
    ctx.fillStyle = dateScene ? '#1e4145' : colors[1];
    ctx.beginPath();
    const hillL = -view.ox - 80, hillR = 960 + view.ox + 80;
    ctx.moveTo(hillL, 260);
    for (let x = hillL; x <= hillR; x += 80) {
      const y = 208 + Math.sin(x * 0.013 + (dateScene ? 1.5 : 0)) * 24 + Math.sin(x * 0.031) * 11;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(hillR, 360);
    ctx.lineTo(hillL, 360);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    for (const speck of ambientSpecks) {
      const alpha = 0.12 + (Math.sin(now / 1200 + speck.phase) + 1) * 0.06;
      ctx.fillStyle = `rgba(255,249,215,${alpha})`;
      ctx.beginPath();
      ctx.arc(speck.x, speck.y + Math.sin(now / 1800 + speck.phase) * 5, speck.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawWallY0(dateScene = false) {
    const h = dateScene ? 125 : 142;
    const fill = dateScene ? '#684f4b' : '#e2d6b5';
    polygon([isoPoint(0, 0), isoPoint(10, 0), isoPoint(10, 0, h), isoPoint(0, 0, h)], fill, 'rgba(55,58,50,.28)', 1.2);
    for (let x = 1; x < 10; x += 1) {
      const a = isoPoint(x, 0, 0);
      const b = isoPoint(x, 0, h);
      ctx.strokeStyle = dateScene ? 'rgba(255,220,180,.06)' : 'rgba(84,87,70,.07)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }

  function drawWallX0(dateScene = false) {
    const h = dateScene ? 125 : 142;
    const fill = dateScene ? '#74594f' : '#eee3c5';
    polygon([isoPoint(0, 0), isoPoint(0, 10), isoPoint(0, 10, h), isoPoint(0, 0, h)], fill, 'rgba(55,58,50,.28)', 1.2);
  }

  function drawWindowOnBackWall(dateScene = false) {
    const z1 = 42;
    const z2 = 120;
    const a = isoPoint(3.0, 0, z1);
    const b = isoPoint(7.2, 0, z1);
    const c = isoPoint(7.2, 0, z2);
    const d = isoPoint(3.0, 0, z2);
    const gradient = ctx.createLinearGradient(d.x, d.y, a.x, a.y);
    gradient.addColorStop(0, dateScene ? '#203f4c' : '#9ac3c5');
    gradient.addColorStop(1, dateScene ? '#d38f61' : '#d9d7a8');
    polygon([a, b, c, d], gradient, '#695f50', 4);
    ctx.save();
    polygon([isoPoint(3.1, 0, z1 + 3), isoPoint(7.1, 0, z1 + 3), isoPoint(7.1, 0, z2 - 3), isoPoint(3.1, 0, z2 - 3)], null, null);
    ctx.restore();
    const mid = isoPoint(5.1, 0, z1);
    const midTop = isoPoint(5.1, 0, z2);
    ctx.strokeStyle = 'rgba(82,72,61,.7)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(mid.x, mid.y); ctx.lineTo(midTop.x, midTop.y); ctx.stroke();

    ctx.save();
    ctx.globalAlpha = dateScene ? 0.7 : 0.45;
    ctx.fillStyle = dateScene ? '#152f37' : '#718d78';
    const p1 = isoPoint(3.2, 0, z1 + 5);
    const p2 = isoPoint(7.0, 0, z1 + 5);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    for (let i = 0; i <= 10; i += 1) {
      const t = i / 10;
      ctx.lineTo(lerp(p1.x, p2.x, t), lerp(p1.y, p2.y, t) - 12 - Math.sin(t * Math.PI * 3) * 9);
    }
    ctx.lineTo(p2.x, p2.y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawApartmentFloor() {
    for (let y = 0; y < 10; y += 1) {
      for (let x = 0; x < 10; x += 1) {
        const tone = (x + y) % 2 === 0 ? '#cdbd99' : '#c6b58f';
        drawIsoTile(x, y, tone, 'rgba(84,73,58,.13)');
      }
    }
    polygon([isoPoint(2.8, 5.2, 1), isoPoint(6.9, 5.2, 1), isoPoint(6.9, 8.3, 1), isoPoint(2.8, 8.3, 1)], '#7f9c82', 'rgba(45,68,54,.35)', 1.2);
    polygon([isoPoint(3.1, 5.5, 2), isoPoint(6.6, 5.5, 2), isoPoint(6.6, 8.0, 2), isoPoint(3.1, 8.0, 2)], '#a6b894', 'rgba(255,255,255,.2)', 1);
  }

  function drawDateFloor() {
    for (let y = 0; y < 10; y += 1) {
      for (let x = 0; x < 10; x += 1) {
        const tone = (x + y) % 2 === 0 ? '#7f6657' : '#755d50';
        drawIsoTile(x, y, tone, 'rgba(35,25,22,.2)');
      }
    }
    polygon([isoPoint(2.4, 3.0, 1), isoPoint(7.2, 3.0, 1), isoPoint(7.2, 7.1, 1), isoPoint(2.4, 7.1, 1)], '#9b765d', 'rgba(37,26,24,.3)', 1.1);
    polygon([isoPoint(2.7, 3.3, 2), isoPoint(6.9, 3.3, 2), isoPoint(6.9, 6.8, 2), isoPoint(2.7, 6.8, 2)], '#b88e6c', 'rgba(255,230,200,.12)', 1);
  }

  function drawBed() {
    drawIsoBox(1.0, 1.0, 2.55, 1.55, 18, { top: '#9a765d', left: '#684e43', right: '#5b463f' });
    drawIsoBox(1.08, 1.08, 2.39, 1.39, 28, { top: '#e3d6bd', left: '#c7b89f', right: '#b5a58f' });
    polygon([isoPoint(1.15, 1.18, 31), isoPoint(3.36, 1.18, 31), isoPoint(3.36, 2.05, 31), isoPoint(1.15, 2.05, 31)], '#769083', '#52685e', 1);
    const p1 = isoPoint(1.45, 1.25, 36);
    const p2 = isoPoint(2.15, 1.25, 36);
    ctx.fillStyle = '#f2ead9';
    ctx.beginPath(); ctx.ellipse(p1.x, p1.y, 24, 8, 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(p2.x, p2.y, 24, 8, 0.45, 0, Math.PI * 2); ctx.fill();
  }

  function drawKitchen() {
    drawIsoBox(6.55, 1.05, 2.45, 1.2, 48, { top: '#b9a77f', left: '#7b735e', right: '#666556' });
    const sink = isoPoint(7.35, 1.35, 51);
    ctx.fillStyle = '#70898a';
    ctx.beginPath(); ctx.ellipse(sink.x, sink.y, 22, 8, 0.47, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#526d70'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sink.x + 3, sink.y - 14, 9, Math.PI, Math.PI * 2); ctx.stroke();
    const bowl = isoPoint(8.25, 1.45, 54);
    ctx.fillStyle = '#c78556'; ctx.beginPath(); ctx.ellipse(bowl.x, bowl.y, 15, 6, 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#85a060';
    for (let i = 0; i < 4; i += 1) { ctx.beginPath(); ctx.arc(bowl.x - 7 + i * 5, bowl.y - 6 - (i % 2) * 3, 4, 0, Math.PI * 2); ctx.fill(); }
  }

  function drawDesk() {
    drawIsoBox(3.85, 3.55, 2.45, 1.25, 34, { top: '#aa845d', left: '#795d49', right: '#684f42' });
    const laptop = isoPoint(5.3, 3.82, 48);
    ctx.save();
    ctx.translate(laptop.x, laptop.y);
    ctx.rotate(0.45);
    ctx.fillStyle = '#3e5455';
    ctx.fillRect(-19, -13, 38, 24);
    ctx.fillStyle = '#9fc0b7';
    ctx.fillRect(-16, -10, 32, 17);
    ctx.restore();
    const phone = isoPoint(4.45, 4.05, 39);
    ctx.fillStyle = '#293b3d'; ctx.beginPath(); ctx.roundRect(phone.x - 7, phone.y - 12, 14, 24, 3); ctx.fill();
    drawIsoBox(4.45, 4.9, 0.75, 0.65, 18, { top: '#74847a', left: '#52625c', right: '#45544f' });
  }

  function drawWardrobe() {
    drawIsoBox(7.35, 6.05, 1.65, 1.75, 104, { top: '#8b715c', left: '#654f46', right: '#57463f' });
    const centerTop = isoPoint(8.18, 7.80, 94);
    const centerBottom = isoPoint(8.18, 7.80, 12);
    ctx.strokeStyle = '#c5a778'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(centerTop.x, centerTop.y); ctx.lineTo(centerBottom.x, centerBottom.y); ctx.stroke();
    const knob = isoPoint(8.12, 7.81, 54);
    ctx.fillStyle = '#d8b970'; ctx.beginPath(); ctx.arc(knob.x, knob.y, 3, 0, Math.PI * 2); ctx.fill();
  }

  function drawVanity() {
    drawIsoBox(1.0, 6.2, 1.85, 1.1, 34, { top: '#af8b6f', left: '#7a6254', right: '#665349' });
    const mirror = isoPoint(1.78, 6.25, 76);
    ctx.fillStyle = '#d9e5dd';
    ctx.strokeStyle = '#8b6e58';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.ellipse(mirror.x, mirror.y, 24, 34, 0.44, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    const bottle = isoPoint(2.35, 6.45, 42);
    ctx.fillStyle = '#b56f72'; ctx.fillRect(bottle.x - 4, bottle.y - 13, 8, 13);
    ctx.fillStyle = '#d4b464'; ctx.fillRect(bottle.x - 2, bottle.y - 17, 4, 4);
  }

  function drawLedgerShelf() {
    drawIsoBox(8.05, 4.55, 0.95, 0.8, 74, { top: '#7f705d', left: '#5f564b', right: '#514a43' });
    const p = isoPoint(8.55, 5.33, 48);
    ctx.fillStyle = '#c7855c'; ctx.fillRect(p.x - 16, p.y - 5, 32, 10);
    ctx.fillStyle = '#668078'; ctx.fillRect(p.x - 13, p.y - 18, 28, 9);
    ctx.fillStyle = '#d5b46b'; ctx.fillRect(p.x - 14, p.y - 31, 30, 9);
  }

  function drawPlant(x, y, scale = 1) {
    drawIsoBox(x - 0.2, y - 0.2, 0.4, 0.4, 18 * scale, { top: '#9b6e50', left: '#704d3e', right: '#5f4339' });
    const p = isoPoint(x, y, 28 * scale);
    ctx.strokeStyle = '#4e7055'; ctx.lineWidth = 3 * scale;
    for (let i = 0; i < 6; i += 1) {
      const angle = -Math.PI * 0.9 + i * 0.34;
      ctx.beginPath(); ctx.moveTo(p.x, p.y + 9); ctx.quadraticCurveTo(p.x + Math.cos(angle) * 18 * scale, p.y - 4, p.x + Math.cos(angle) * 24 * scale, p.y - 19 * scale); ctx.stroke();
    }
    ctx.fillStyle = '#76966b';
    for (let i = 0; i < 5; i += 1) {
      ctx.beginPath(); ctx.ellipse(p.x - 15 + i * 8, p.y - 10 - (i % 2) * 8, 8 * scale, 4 * scale, i * 0.4, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawEntryDoor() {
    drawIsoBox(8.72, 8.25, 0.28, 0.75, 88, { top: '#6e574a', left: '#4d4039', right: '#3f3733' });
    const mat = [isoPoint(8.0, 8.05, 1), isoPoint(8.85, 8.05, 1), isoPoint(8.85, 8.8, 1), isoPoint(8.0, 8.8, 1)];
    polygon(mat, '#6c7f79', '#4a5d58', 1);
    const knob = isoPoint(8.72, 8.64, 45);
    ctx.fillStyle = '#d3a85c'; ctx.beginPath(); ctx.arc(knob.x, knob.y, 3, 0, Math.PI * 2); ctx.fill();
  }

  function drawDateTable() {
    const center = isoPoint(5.2, 4.3, 44);
    ctx.fillStyle = '#5e4338';
    ctx.beginPath(); ctx.ellipse(center.x, center.y + 22, 10, 18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e5d3b4';
    ctx.strokeStyle = '#6f5141';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(center.x, center.y, 68, 31, 0.46, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    const flower = isoPoint(5.2, 4.3, 62);
    ctx.strokeStyle = '#55705b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(flower.x, flower.y + 10); ctx.lineTo(flower.x, flower.y - 10); ctx.stroke();
    ctx.fillStyle = '#b86f73';
    for (let i = 0; i < 5; i += 1) { const a = i * Math.PI * 0.4; ctx.beginPath(); ctx.arc(flower.x + Math.cos(a) * 6, flower.y - 10 + Math.sin(a) * 4, 4, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#f2d991'; ctx.beginPath(); ctx.arc(flower.x, flower.y - 10, 3, 0, Math.PI * 2); ctx.fill();
  }

  function drawDateFurniture() {
    drawDateTable();
    drawIsoBox(7.55, 1.0, 1.45, 1.6, 70, { top: '#6e5144', left: '#523c36', right: '#46342f' });
    const lamp = isoPoint(8.25, 1.65, 92);
    ctx.fillStyle = 'rgba(247,190,104,.26)'; ctx.beginPath(); ctx.arc(lamp.x, lamp.y, 34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f3c371'; ctx.beginPath(); ctx.arc(lamp.x, lamp.y, 9, 0, Math.PI * 2); ctx.fill();
    drawPlant(1.8, 1.8, 1.15);
    const exitMat = [isoPoint(0.75, 8.0, 1), isoPoint(1.65, 8.0, 1), isoPoint(1.65, 8.85, 1), isoPoint(0.75, 8.85, 1)];
    polygon(exitMat, '#4f6b69', '#364f4e', 1);
  }

  function toneFromId(id, palette) {
    let hash = 0;
    for (let i = 0; i < String(id).length; i += 1) hash = (hash * 31 + String(id).charCodeAt(i)) >>> 0;
    return palette[hash % palette.length];
  }

  function getSkinTone(value) {
    return ({ light: '#e8bea0', medium: '#c88f68', olive: '#b7805f', deep: '#85573f', dark: '#5e3d32' })[value] || '#c88f68';
  }

  function drawPerson(worldX, worldY, now, options = {}) {
    const p = isoPoint(worldX, worldY, 0);
    const isPlayer = Boolean(options.player);
    const moving = Boolean(options.moving);
    const frame = Math.floor(now / 125) % 4;
    const stride = moving ? [0, 3, 0, -3][frame] : 0;
    const bob = moving ? Math.abs(stride) * -0.55 : Math.sin(now / 700 + (options.phase || 0)) * 0.55;
    const scale = options.scale || 1;
    const skin = options.skin || '#c88f68';
    const outfit = options.outfit || '#4f6a66';
    const hair = options.hair || '#3e302b';
    const facing = options.direction || 'down';
    const faceShift = facing === 'left' ? -3 : facing === 'right' ? 3 : 0;

    ctx.save();
    ctx.translate(p.x, p.y + bob);
    ctx.scale(scale, scale);
    ctx.globalAlpha = 0.24;
    ctx.fillStyle = '#17282a';
    ctx.beginPath(); ctx.ellipse(0, 3, 18, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.strokeStyle = '#3f3c3a';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6, -18); ctx.lineTo(-7 - stride, -2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -18); ctx.lineTo(7 + stride, -2); ctx.stroke();
    ctx.strokeStyle = '#272d2d'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(-8 - stride, -2); ctx.lineTo(-3 - stride, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8 + stride, -2); ctx.lineTo(13 + stride, 0); ctx.stroke();

    ctx.fillStyle = outfit;
    ctx.strokeStyle = 'rgba(30,40,39,.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-13, -50);
    ctx.quadraticCurveTo(-19, -39, -14, -18);
    ctx.lineTo(13, -18);
    ctx.quadraticCurveTo(18, -39, 12, -50);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.strokeStyle = skin;
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-12, -44); ctx.lineTo(-19 + stride * 0.4, -27); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, -44); ctx.lineTo(19 - stride * 0.4, -28); ctx.stroke();

    ctx.fillStyle = skin;
    ctx.strokeStyle = 'rgba(60,43,36,.38)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, -63, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    ctx.fillStyle = hair;
    ctx.beginPath();
    ctx.arc(0, -66, 14, Math.PI, Math.PI * 2);
    ctx.quadraticCurveTo(13, -56, 8, -51);
    ctx.lineTo(5, -58);
    ctx.quadraticCurveTo(-2, -53, -12, -58);
    ctx.closePath(); ctx.fill();
    if (options.longHair) {
      ctx.beginPath(); ctx.ellipse(facing === 'left' ? 5 : -5, -53, 10, 16, 0.2, 0, Math.PI * 2); ctx.fill();
    }

    if (facing !== 'up') {
      ctx.fillStyle = '#2a2d2c';
      ctx.beginPath(); ctx.arc(faceShift - 4, -63, 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(faceShift + 4, -63, 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(110,54,49,.7)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(faceShift, -58, 3, 0.1, Math.PI - 0.1); ctx.stroke();
    }

    if (isPlayer) {
      ctx.fillStyle = '#d8b35d';
      ctx.beginPath(); ctx.arc(12, -45, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawApartment(now) {
    drawBackdrop(now, false);
    drawWallY0(false);
    drawWallX0(false);
    drawWindowOnBackWall(false);
    drawApartmentFloor();

    const drawables = [
      { depth: 2.9, draw: drawBed },
      { depth: 8.9, draw: drawKitchen },
      { depth: 8.7, draw: drawDesk },
      { depth: 7.9, draw: drawVanity },
      { depth: 13.2, draw: drawLedgerShelf },
      { depth: 14.5, draw: drawWardrobe },
      { depth: 17.2, draw: drawEntryDoor },
      { depth: 8.8, draw: () => drawPlant(1.1, 8.3, 1) },
      { depth: state.player.x + state.player.y, draw: () => drawPerson(state.player.x, state.player.y, now, {
        player: true,
        moving: state.player.moving,
        direction: state.player.direction,
        skin: getSkinTone(state.player.skinTone),
        outfit: OUTFITS[state.player.outfit].color,
        hair: state.player.hairColor || '#3e302b',
        longHair: ['feminine', 'androgynous'].includes(state.player.presentation)
      }) }
    ];
    drawables.sort((a, b) => a.depth - b.depth).forEach((item) => item.draw());
  }

  function drawDateScene(now) {
    drawBackdrop(now, true);
    drawWallY0(true);
    drawWallX0(true);
    drawWindowOnBackWall(true);
    drawDateFloor();
    const booking = getCurrentBooking();
    const client = booking?.client;
    const palette = ['#596c77', '#7a5d72', '#566c55', '#8a644f', '#4e5d63'];
    const hairPalette = ['#2c2826', '#51372d', '#76604b', '#242b31', '#5b453b'];
    const skinPalette = ['#e8bea0', '#c88f68', '#b7805f', '#85573f', '#5e3d32'];
    const drawables = [
      { depth: 9.5, draw: drawDateFurniture },
      client ? { depth: 12.0, draw: () => drawPerson(6.55, 5.35, now, {
        moving: false,
        direction: 'left',
        skin: toneFromId(client.id, skinPalette),
        outfit: toneFromId(`${client.id}-outfit`, palette),
        hair: toneFromId(`${client.id}-hair`, hairPalette),
        longHair: Number(client.age) % 3 === 0,
        phase: 2.1
      }) } : null,
      { depth: state.player.x + state.player.y, draw: () => drawPerson(state.player.x, state.player.y, now, {
        player: true,
        moving: state.player.moving,
        direction: state.player.direction,
        skin: getSkinTone(state.player.skinTone),
        outfit: OUTFITS[state.player.outfit].color,
        hair: state.player.hairColor || '#3e302b',
        longHair: ['feminine', 'androgynous'].includes(state.player.presentation)
      }) }
    ].filter(Boolean);
    drawables.sort((a, b) => a.depth - b.depth).forEach((item) => item.draw());

    if (state.dateState) {
      const p = isoPoint(6.55, 5.35, 78);
      ctx.fillStyle = 'rgba(255,250,230,.92)';
      ctx.strokeStyle = 'rgba(40,50,48,.28)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(p.x - 36, p.y - 18, 72, 22, 9); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#253839'; ctx.font = '700 10px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(state.dateState.phase < 3 ? `Round ${state.dateState.phase + 1}/3` : 'Complete', p.x, p.y - 4);
    }
  }

  function drawPauseOverlay() {
    ctx.save();
    ctx.fillStyle = 'rgba(12,28,30,.36)';
    ctx.fillRect(-view.ox, -view.oy, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(255,250,240,.94)';
    ctx.beginPath(); ctx.roundRect(480 - 90, 300 - 35, 180, 70, 16); ctx.fill();
    ctx.fillStyle = '#1b3032';
    ctx.font = '800 22px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('Paused', 480, 300 + 7);
    ctx.restore();
  }

  function draw(now) {
    fitCanvas();
    ctx.setTransform(1, 0, 0, 1, view.ox, view.oy);
    if (!state) {
      drawBackdrop(now, false);
      return;
    }
    ctx.clearRect(-view.ox, -view.oy, canvas.width, canvas.height);
    if (state.scene === 'date') drawDateScene(now);
    else drawApartment(now);
    if (paused && !modalOpen) drawPauseOverlay();
  }

  function pointBlocked(x, y) {
    const radius = 0.22;
    if (x < 0.62 || y < 0.62 || x > 9.36 || y > 9.36) return true;
    const obstacles = state.scene === 'date' ? DATE_OBSTACLES : APARTMENT_OBSTACLES;
    return obstacles.some((rect) => (
      x + radius > rect.x1 && x - radius < rect.x2 && y + radius > rect.y1 && y - radius < rect.y2
    ));
  }

  function getInteractables() {
    if (state.scene === 'date') {
      return [
        { id: 'client', label: state.dateState?.phase < 3 ? 'Talk with client' : 'Review outcome', x: 6.55, y: 5.35, radius: 1.18, action: showDateRoundModal },
        { id: 'date-exit', label: 'Use safe-exit protocol', x: 1.2, y: 8.45, radius: 1.05, action: confirmDateExit }
      ];
    }
    return APARTMENT_INTERACTABLES;
  }

  function updateNearbyInteractable() {
    if (!state || modalOpen) {
      nearbyInteractable = null;
      interactionPrompt.classList.add('hidden');
      return;
    }
    let best = null;
    let bestDistance = Infinity;
    for (const item of getInteractables()) {
      const distance = Math.hypot(state.player.x - item.x, state.player.y - item.y);
      if (distance <= item.radius && distance < bestDistance) {
        best = item;
        bestDistance = distance;
      }
    }
    nearbyInteractable = best;
    if (best) {
      interactionPrompt.innerHTML = `<kbd>E</kbd> ${escapeHTML(best.label)}`;
      interactionPrompt.classList.remove('hidden');
    } else {
      interactionPrompt.classList.add('hidden');
    }
  }

  function interact() {
    if (!state || modalOpen || paused) return;
    updateNearbyInteractable();
    if (!nearbyInteractable) {
      toast('Move closer to an object or person.', 'neutral');
      return;
    }
    playTone(560);
    nearbyInteractable.action();
  }

  function update(deltaSeconds) {
    if (!state || paused || modalOpen) {
      if (state) state.player.moving = false;
      updateNearbyInteractable();
      return;
    }
    let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    let dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (dx || dy) {
      const length = Math.hypot(dx, dy) || 1;
      dx /= length;
      dy /= length;
      const speed = state.scene === 'date' ? 2.25 : 2.4;
      const nextX = state.player.x + dx * speed * deltaSeconds;
      const nextY = state.player.y + dy * speed * deltaSeconds;
      if (!pointBlocked(nextX, state.player.y)) state.player.x = nextX;
      if (!pointBlocked(state.player.x, nextY)) state.player.y = nextY;
      state.player.moving = true;
      if (Math.abs(dx) > Math.abs(dy)) state.player.direction = dx > 0 ? 'right' : 'left';
      else state.player.direction = dy > 0 ? 'down' : 'up';
    } else {
      state.player.moving = false;
    }
    updateNearbyInteractable();
  }

  function loop(now) {
    const delta = clamp((now - lastFrame) / 1000, 0, 0.05);
    lastFrame = now;
    update(delta);
    draw(now);
    if (uiDirty) renderUI();
    if (state && now - lastAutosave > 15000) saveGame(true);
    requestAnimationFrame(loop);
  }

  function togglePause() {
    if (!state || modalOpen) return;
    paused = !paused;
    toast(paused ? 'Paused.' : 'Resumed.', 'neutral');
  }

  function handlePanelClick(event) {
    const button = event.target.closest('[data-action]');
    if (!button || !state) return;
    const action = button.dataset.action;
    if (action === 'tab') setTab(button.dataset.tab);
    if (action === 'review-lead') showLeadModal(button.dataset.id);
    if (action === 'preflight') showPreflightModal(button.dataset.id);
    if (action === 'marketing') showMarketingModal();
    if (action === 'travel') showTravelModal();
    if (action === 'rest') showRestModal();
    if (action === 'wardrobe') showWardrobeModal();
    if (action === 'regions') showRegionModal();
    if (action === 'structure') changeStructure(button.dataset.id);
    if (action === 'protection') changeProtection(button.dataset.id);
    if (action === 'train-skill') trainSkillWithPoint(button.dataset.skill);
    if (action === 'personal-event') resolvePersonalEvent(button.dataset.option);
    if (action === 'legal') resolveLegalCase(button.dataset.method);
    if (action === 'update-rate') updateBaseRate(panelContent.querySelector('#baseRateInput')?.value);
    if (action === 'repay-debt') repayDebt(panelContent.querySelector('#debtInput')?.value);
  }

  function showHelpModal() {
    const body = `
      <div class="notice">All characters in Nightbook are adults aged 21 or older. Mature professional-companion themes are represented through abstract management, conversation, consent, safety, health, and legal-risk systems rather than explicit content.</div>
      <div class="option-grid" style="margin-top:12px">
        <div class="option-card"><h4>Move & interact</h4><p>Use WASD or the arrow keys. Walk near furniture, the apartment door, or a client and press E.</p></div>
        <div class="option-card"><h4>Build the calendar</h4><p>Use the desk or Inbox tab to screen leads, request deposits, negotiate, and avoid schedule conflicts.</p></div>
        <div class="option-card"><h4>Prepare</h4><p>Use the vanity, wardrobe, kitchen, bed, marketing laptop, and professional kit before a booking.</p></div>
        <div class="option-card"><h4>Play the date</h4><p>Travel through the door, approach the client, and make three decisions that affect rapport, professionalism, safety, payment, and reviews.</p></div>
        <div class="option-card"><h4>Manage risk</h4><p>Screening, boundaries, protection, region, health, and safe exits all materially change outcomes.</p></div>
        <div class="option-card"><h4>Progress</h4><p>Earn XP, improve five skills, create regular clients, change regions or business models, reduce debt, and protect personal stability.</p></div>
      </div>
      <div class="card" style="margin-top:12px"><h3>Animation</h3><p>The canvas renders through requestAnimationFrame. Character walk and idle sprites advance at 8 frames per second.</p></div>`;
    showModal({
      eyebrow: 'How to play',
      title: 'Nightbook guide',
      body,
      footer: '<button class="primary-button" data-help="close">Continue</button>',
      onMount: (card) => card.querySelector('[data-help="close"]').addEventListener('click', closeModal)
    });
  }

  function normalizeLoadedState(loaded) {
    loaded.player ||= {};
    loaded.player.skinTone ||= 'medium';
    loaded.player.hairColor ||= '#3e302b';
    loaded.player.ownedOutfits ||= ['classic', 'warm', 'bold'];
    loaded.player.outfit ||= 'classic';
    loaded.settings ||= { sound: true, tutorialSeen: true };
    loaded.skillXP ||= { charm: 0, negotiation: 0, intuition: 0, branding: 0, deescalation: 0 };
    loaded.marketing ||= [];
    loaded.regulars ||= [];
    loaded.clientHistory ||= [];
    loaded.professionalKit ??= 4;
    loaded.boundaries ||= { photos: true, intoxicated: true, publicFirst: true, deposit: true };
    loaded.stats ||= { grossEarned: 0, netEarned: 0, spent: 0, completed: 0, declined: 0, safeExits: 0, incidents: 0 };
    loaded.dailyModifier ||= DAILY_MODIFIERS[0];
    loaded.scene ||= 'apartment';
    return loaded;
  }

  function startCareer(config) {
    state = createInitialState(config);
    state.player.skinTone = config.skinTone || 'medium';
    state.player.hairColor = config.hairColor || '#3e302b';
    addJournal('Career started', `${state.player.name} began operating in ${getRegion().name} as ${BACKGROUNDS[state.player.background].name.toLowerCase()}.`, 'good');
    startNewDay(true);
    closeModal();
    paused = false;
    activeTab = 'today';
    renderUI();
    saveGame(true);
    toast('Career started. Walk to the desk to review leads.', 'good');
    setTimeout(showHelpModal, 180);
  }

  function showCharacterCreation() {
    const body = `
      <div class="notice">All characters and clients are 21+. Appearance and presentation choices are cosmetic; they do not alter safety or earning potential.</div>
      <div class="input-grid" style="margin-top:12px">
        <div class="field"><label for="charName">Professional name</label><input id="charName" maxlength="24" value="Alex"></div>
        <div class="field"><label for="charAge">Age</label><input id="charAge" type="number" min="21" max="70" value="28"></div>
        <div class="field"><label for="charPronouns">Pronouns</label><select id="charPronouns"><option>they/them</option><option>she/her</option><option>he/him</option><option>she/they</option><option>he/they</option></select></div>
        <div class="field"><label for="charPresentation">Presentation</label><select id="charPresentation"><option value="androgynous">Androgynous</option><option value="feminine">Feminine</option><option value="masculine">Masculine</option></select></div>
        <div class="field"><label for="charSkin">Skin tone</label><select id="charSkin"><option value="light">Light</option><option value="medium" selected>Medium</option><option value="olive">Olive</option><option value="deep">Deep</option><option value="dark">Dark</option></select></div>
        <div class="field"><label for="charHair">Hair color</label><select id="charHair"><option value="#2c2826">Black</option><option value="#3e302b" selected>Dark brown</option><option value="#76604b">Light brown</option><option value="#b98b55">Blonde</option><option value="#7a3f35">Auburn</option><option value="#596472">Blue-black</option></select></div>
        <div class="field full"><label for="charBackground">Starting background</label><select id="charBackground">${Object.entries(BACKGROUNDS).map(([key, item]) => `<option value="${key}">${escapeHTML(item.name)} — ${escapeHTML(item.description)}</option>`).join('')}</select></div>
        <div class="field full"><label for="charRegion">Starting region</label><select id="charRegion">${Object.entries(REGIONS).map(([key, item]) => `<option value="${key}">${escapeHTML(item.name)} — ${escapeHTML(item.subtitle)}</option>`).join('')}</select></div>
        <div class="field full"><label for="charDifficulty">Difficulty</label><select id="charDifficulty">${Object.entries(DIFFICULTIES).map(([key, item]) => `<option value="${key}" ${key === 'balanced' ? 'selected' : ''}>${escapeHTML(item.name)} — ${escapeHTML(item.description)}</option>`).join('')}</select></div>
      </div>`;
    showModal({
      eyebrow: 'New career',
      title: 'Create your character',
      body,
      footer: '<button class="ghost-button" data-create="back">Back</button><button class="primary-button" data-create="start">Start career</button>',
      closeable: false,
      wide: true,
      onMount: (card) => {
        card.addEventListener('click', (event) => {
          const button = event.target.closest('[data-create]');
          if (!button) return;
          if (button.dataset.create === 'back') return showTitleMenu(loadGame());
          if (button.dataset.create === 'start') {
            const age = Number(card.querySelector('#charAge').value);
            if (age < 21) {
              toast('The player character must be at least 21.', 'bad');
              return;
            }
            startCareer({
              name: card.querySelector('#charName').value,
              age,
              pronouns: card.querySelector('#charPronouns').value,
              presentation: card.querySelector('#charPresentation').value,
              skinTone: card.querySelector('#charSkin').value,
              hairColor: card.querySelector('#charHair').value,
              background: card.querySelector('#charBackground').value,
              region: card.querySelector('#charRegion').value,
              difficulty: card.querySelector('#charDifficulty').value
            });
          }
        });
      }
    });
  }

  function showTitleMenu(saved) {
    const body = `
      <div class="notice">A systems-driven management and character-control simulator about running an adult professional-companion career. Encounters remain abstract; consent, boundaries, preparation, and safe exits are core mechanics.</div>
      <div class="option-grid" style="margin-top:12px">
        ${saved ? `<button class="option-card" data-title="continue"><h4>Continue career</h4><p>${escapeHTML(saved.player?.name || 'Saved character')} · Day ${saved.day} · ${currency(saved.money || 0)} · ${escapeHTML(REGIONS[saved.region]?.name || 'Unknown region')}</p><strong>Load local save</strong></button>` : ''}
        <button class="option-card" data-title="new"><h4>New career</h4><p>Create an adult character, select a background, region, presentation, and difficulty.</p><strong>Start from Day 1</strong></button>
      </div>
      <div class="card" style="margin-top:12px"><h3>Core loop</h3><p>Walk around the isometric apartment, acquire and screen clients, negotiate fees, schedule work, prepare, travel, play date conversations, protect boundaries, collect reviews, manage exposure, and build or exit a career.</p></div>`;
    showModal({
      eyebrow: 'Playable prototype',
      title: 'Nightbook',
      body,
      footer: saved ? '<button class="danger-button" data-title="erase">Erase save</button>' : '',
      closeable: false,
      wide: true,
      onMount: (card) => {
        card.addEventListener('click', (event) => {
          const button = event.target.closest('[data-title]');
          if (!button) return;
          if (button.dataset.title === 'new') return showCharacterCreation();
          if (button.dataset.title === 'erase') {
            deleteSave();
            showTitleMenu(null);
          }
          if (button.dataset.title === 'continue' && saved) {
            state = normalizeLoadedState(saved);
            soundEnabled = state.settings?.sound !== false;
            closeModal();
            activeTab = 'today';
            paused = false;
            renderUI();
            canvas.focus();
            toast('Career loaded.', 'good');
          }
        });
      }
    });
  }

  function bindEvents() {
    document.querySelectorAll('.tab').forEach((tab) => tab.addEventListener('click', () => setTab(tab.dataset.tab)));
    panelContent.addEventListener('click', handlePanelClick);
    panelContent.addEventListener('change', (event) => {
      const toggle = event.target.closest('[data-boundary]');
      if (!toggle || !state) return;
      state.boundaries[toggle.dataset.boundary] = toggle.checked;
      addJournal('Boundary preset changed', `${boundaryLabel(toggle.dataset.boundary)} ${toggle.checked ? 'enabled' : 'disabled'}.`, 'neutral');
      markDirty();
    });

    document.getElementById('saveButton').addEventListener('click', () => saveGame(false));
    document.getElementById('helpButton').addEventListener('click', showHelpModal);
    document.getElementById('soundButton').addEventListener('click', () => {
      if (!state) return;
      state.settings.sound = !state.settings.sound;
      soundEnabled = state.settings.sound;
      document.getElementById('soundButton').textContent = soundEnabled ? '♪' : '×';
      toast(soundEnabled ? 'Sound on.' : 'Sound off.', 'neutral');
      markDirty();
    });

    window.addEventListener('keydown', (event) => {
      const tag = event.target?.tagName?.toLowerCase();
      if (['input', 'select', 'textarea'].includes(tag)) return;
      const key = event.key.toLowerCase();
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'w', 'a', 's', 'd', 'e'].includes(key)) event.preventDefault();
      if (key === 'w' || key === 'arrowup') keys.up = true;
      if (key === 's' || key === 'arrowdown') keys.down = true;
      if (key === 'a' || key === 'arrowleft') keys.left = true;
      if (key === 'd' || key === 'arrowright') keys.right = true;
      if (key === 'e' && !event.repeat) interact();
      if (key === ' ' && !event.repeat) togglePause();
    });
    window.addEventListener('keyup', (event) => {
      const key = event.key.toLowerCase();
      if (key === 'w' || key === 'arrowup') keys.up = false;
      if (key === 's' || key === 'arrowdown') keys.down = false;
      if (key === 'a' || key === 'arrowleft') keys.left = false;
      if (key === 'd' || key === 'arrowright') keys.right = false;
    });
    window.addEventListener('blur', () => {
      keys.up = keys.down = keys.left = keys.right = false;
    });
    canvas.addEventListener('pointerdown', () => canvas.focus());

    document.querySelectorAll('[data-move]').forEach((button) => {
      const direction = button.dataset.move;
      const start = (event) => { event.preventDefault(); keys[direction] = true; };
      const stop = (event) => { event.preventDefault(); keys[direction] = false; };
      button.addEventListener('pointerdown', start);
      button.addEventListener('pointerup', stop);
      button.addEventListener('pointercancel', stop);
      button.addEventListener('pointerleave', stop);
    });
    document.getElementById('mobileInteract').addEventListener('pointerdown', (event) => {
      event.preventDefault(); interact();
    });
  }

  function bootstrap() {
    bindEvents();
    draw(performance.now());
    const saved = loadGame();
    showTitleMenu(saved);
    requestAnimationFrame(loop);
  }

  bootstrap();
})();

  </script>
</body>
</html>
