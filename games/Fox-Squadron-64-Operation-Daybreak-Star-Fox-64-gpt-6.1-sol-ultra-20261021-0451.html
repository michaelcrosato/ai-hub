#aim-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  overflow: hidden;
}
#aim-layer:not(.playing) > :not(#touch-notice) {
  display: none;
}
#aim-reticle {
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  color: #cffeff;
  filter: drop-shadow(0 1px 3px #16344c);
  transition: color 0.15s;
}
#aim-reticle i {
  position: absolute;
  width: 12px;
  height: 12px;
  border-style: solid;
  border-color: currentColor;
  border-width: 0;
  opacity: 0.9;
}
#aim-reticle i:nth-child(1) {
  left: -26px;
  top: -26px;
  border-top-width: 2px;
  border-left-width: 2px;
}
#aim-reticle i:nth-child(2) {
  left: 14px;
  top: -26px;
  border-top-width: 2px;
  border-right-width: 2px;
}
#aim-reticle i:nth-child(3) {
  left: -26px;
  top: 14px;
  border-bottom-width: 2px;
  border-left-width: 2px;
}
#aim-reticle i:nth-child(4) {
  left: 14px;
  top: 14px;
  border-bottom-width: 2px;
  border-right-width: 2px;
}
#aim-reticle b {
  position: absolute;
  width: 4px;
  height: 4px;
  left: -2px;
  top: -2px;
  border-radius: 50%;
  background: currentColor;
}
#aim-reticle em {
  position: absolute;
  left: -7px;
  top: -7px;
  width: 12px;
  height: 12px;
  border: 1px solid currentColor;
  border-radius: 50%;

#aim-reticle.assist {
  color: #ffe2ad;
}
#aim-reticle.locked {
  color: #ffb16e;
}
#aim-reticle.locked i {

}
#charge-ring {

  left: 0;
  top: 0;
  width: 76px;
  height: 76px;
  margin: -38px;

  mask: radial-gradient(transparent 66%, black 68%);
  -webkit-mask: radial-gradient(transparent 66%, black 68%);
  filter: drop-shadow(0 0 4px #82fff1);
  opacity: 0;
}
.target-box {
  position: absolute;
  left: 0;
  top: 0;
  margin: 0;
  border: 1px solid #ff9b8288;
  translate: -50% -50%;
  color: #ffc0a2;
  box-shadow: inset 0 0 0 1px #21384855;
  transition:
    width 0.12s,
    height 0.12s;
}
.target-box:before,
.target-box:after {
  content: "";
  position: absolute;
  width: 5px;
  height: 5px;
  border: 2px solid #ffb294;
}
.target-box:before {
  left: -2px;
  top: -2px;
  border-right: 0;
  border-bottom: 0;
}
.target-box:after {
  right: -2px;
  bottom: -2px;
  border-left: 0;
  border-top: 0;
}
.target-box.locked {
  color: #8affef;
  border-color: #8affef;
  box-shadow: 0 0 15px #73fbe955;
}
.target-box.locked:before,
.target-box.locked:after {
  border-color: #8affef;
}
.target-box span {
  position: absolute;

  left: 50%;
  bottom: calc(100% + 7px);
  translate: -50% 0;

    sans-serif;
  letter-spacing: 1.5px;
  text-shadow: 0 1px 4px #001d2e;
}
.target-box b {

  background: currentColor;
  left: 0;
  right: 0;
  bottom: -5px;
  transform-origin: left;
}
.target-box.route-target {

}
.target-box.rescue-target {

}

  inset: 0;

}

  color: #ffb873;

  text-shadow: 0 2px 8px #000;
  font: 700 11px Arial;
  letter-spacing: 4px;
}

}
#boss-warning.active {

}
#touch-notice {
  display: none;
  position: absolute;
  inset: auto 0 18%;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: #102636ed;
  padding: 20px;
  color: #fff1dd;
  font: 600 18px Arial;
  pointer-events: auto;
}
#touch-settings {
  padding: 12px 20px;
  background: #ff8851;
  border: 0;
  color: #102636;
  font-weight: bold;
}
.reduced-motion *,
.reduced-motion *:before,
.reduced-motion *:after {
  animation: none !important;
  transition: none !important;
}
@keyframes reticle-pulse {
  from {
    opacity: 0.45;
  }
  to {
    opacity: 1;
  }
}
