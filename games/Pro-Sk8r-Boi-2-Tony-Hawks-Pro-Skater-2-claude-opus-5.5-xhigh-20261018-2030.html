function buildCrowd(A, B2, tiers, h) {
  const body = new THREE8.CapsuleGeometry(0.24, 0.5, 3, 8);
  body.translate(0, 0.5, 0);
  const head = new THREE8.SphereGeometry(0.2, 10, 8);
  head.translate(0, 1.12, 0);
  const g = mergeGeometries([body.toNonIndexed(), head.toNonIndexed()]);
  const count = 1400;
  const mesh = new THREE8.InstancedMesh(g, toon("#ffffff"), count);
  mesh.castShadow = false;
  mesh.receiveShadow = true;
  const base = [];
  const m = new THREE8.Matrix4, col = new THREE8.Color;
  let k = 0;
  for (let i = 0;i < tiers && k < count; i++) {
    const ai = A + i * 1.5 + 0.75, bi = B2 + i * 1.5 + 0.75, y = h + 0.4 + i * 0.95;
    const per = Math.floor(count / tiers);
    for (let j = 0;j < per && k < count; j++) {
      const t = j / per * Math.PI * 2 + i * 0.13;
      const x = Math.cos(t) * ai, z = Math.sin(t) * bi;
      base.push({ x, y, z, ph: Math.random() * Math.PI * 2, sp: 4 + Math.random() * 4, rot: Math.atan2(-x, -z) });
      m.makeRotationY(Math.atan2(-x, -z)).setPosition(x, y, z);
      mesh.setMatrixAt(k, m);
      col.setHSL(Math.random(), 0.65, 0.45 + Math.random() * 0.2);
      mesh.setColorAt(k, col);
      k++;
    }
  }
  mesh.count = k;
  const q = new THREE8.Quaternion, s = new THREE8.Vector3(1, 1, 1), p = new THREE8.Vector3, upAx = new THREE8.Vector3(0, 1, 0);
  return {
    mesh,
    excite: 0.2,
    update(t, dt) {
      this.excite = Math.max(0.15, this.excite - dt * 0.25);
      for (let i = 0;i < k; i++) {
        const b = base[i];
        const jump = Math.max(0, Math.sin(t * b.sp + b.ph)) * 0.35 * this.excite;
        p.set(b.x, b.y + jump, b.z);
        q.setFromAxisAngle(upAx, b.rot);
        m.compose(p, q, s);
        mesh.setMatrixAt(i, m);
      }
      mesh.instanceMatrix.needsUpdate = true;
    }
  };
}

class Collectibles {
  constructor(scene) {

    this.group.name = "collectibles";
    scene.add(this.group);
    this.list = [];
    this.t = 0;
  }
  clear() {
    for (const c of this.list)
      this.group.remove(c.mesh);
    this.list = [];
  }
  setup(meta, { goals, cash = true, taken = {} }) {
    this.clear();
    const add = (kind, pos, extra) => {
      let mesh;
      if (kind === "letter")
        mesh = letterMesh(extra.ch);
      else if (kind === "item")
        mesh = itemMesh(extra.icon);
      else if (kind === "tape")
        mesh = tapeMesh();
      else
        mesh = cashMesh(extra.amount);
      mesh.position.set(pos[0], pos[1], pos[2]);
      this.group.add(mesh);
      this.list.push({ kind, mesh, base: new THREE14.Vector3(pos[0], pos[1], pos[2]), taken: false, r: kind === "cash" ? 1.4 : 1.6, ...extra, ph: Math.random() * 6 });
    };
    if (goals && meta.letters) {
      ["S", "K", "A", "T", "E"].forEach((ch, i) => {
        if (!taken["letter" + ch])
          add("letter", meta.letters[ch], { ch, i });
      });
    }
    if (goals && meta.items)
      meta.items.list.forEach((p, i) => {
        if (!taken["item" + i])
          add("item", p, { icon: meta.items.icon, i });
      });
    if (goals && meta.tape && !taken.tape)
      add("tape", meta.tape, {});
    if (cash && meta.cash)
      meta.cash.forEach((c, i) => {
        if (!taken["cash" + i])
          add("cash", c, { amount: c[3], i });
      });
  }
  update(dt, center, onPick) {
    this.t += dt;
    for (const c of this.list) {
      if (c.taken) {
        c.pop = (c.pop || 0) + dt;
        const s = Math.max(0, 1 - c.pop * 4);
        c.mesh.scale.setScalar(1 + c.pop * 3);
        c.mesh.visible = s > 0.01;
        c.mesh.position.y = c.base.y + c.pop * 4;
        continue;
      }
      c.mesh.rotation.y += dt * (c.kind === "cash" ? 3 : 1.8);
      c.mesh.position.y = c.base.y + Math.sin(this.t * 2.2 + c.ph) * 0.15;
      if (center && c.mesh.position.distanceTo(center) < c.r) {
        c.taken = true;
        if (onPick)
          onPick(c);
      }
    }
  }
  remaining(kind) {
    return this.list.filter((c) => c.kind === kind && !c.taken).length;
  }
  nearest(kind, from) {
    let best = null, bd = Infinity;
    for (const c of this.list) {
      if (c.kind !== kind || c.taken)
        continue;
      const d = c.base.distanceTo(from);
      if (d < bd) {
        bd = d;
        best = c;
      }
    }
    return best;
  }
}

  }

var h = (tag, cls = "", html = "") => {
  const e = document.createElement(tag);
  if (cls)
    e.className = cls;
  if (html)
    e.innerHTML = html;
  return e;

class UI {
  constructor(root, game) {
    this.root = root;
    this.game = game;
    this.stack = [];
    this.repT = 0;
    this.repDir = null;
  }
  get top() {
    return this.stack[this.stack.length - 1];
  }
  get active() {
    return this.stack.length > 0;
  }
  push(s) {
    if (this.top)
      this.top.el.classList.add("hidden");
    this.stack.push(s);
    s.mount(this);
    return s;
  }
  pop() {
    const s = this.stack.pop();
    if (s)
      s.unmount();
    if (this.top) {
      this.top.el.classList.remove("hidden");
      this.top.reveal();
    }
  }
  replace(s) {
    const t = this.stack.pop();
    if (t)
      t.unmount();
    return this.push(s);
  }
  clear() {
    while (this.stack.length)
      this.stack.pop().unmount();
  }
  refreshGlyphs() {
    for (const s of this.stack)
      s.refreshFooter();
  }
  sfx(n) {
    this.game.audio.play(n);
  }
  update(dt, pad) {
    const s = this.top;
    if (!s)
      return false;
    const act = (a) => s.input(a);
    let dir = null;
    if (pad.ly > 0.55)
      dir = "up";
    else if (pad.ly < -0.55)
      dir = "down";
    else if (pad.lx > 0.55)
      dir = "right";
    else if (pad.lx < -0.55)
      dir = "left";
    if (dir !== this.repDir) {
      this.repDir = dir;
      this.repT = 0.38;
      if (dir)
        act(dir);
    } else if (dir) {
      this.repT -= dt;
      if (this.repT <= 0) {
        this.repT = 0.085;
        act(dir);
      }
    }
    if (pad.pressed(B.CROSS))
      act("ok");
    if (pad.pressed(B.CIRCLE))
      act("back");
    if (pad.pressed(B.OPTIONS))
      act("options");
    if (pad.pressed(B.TRIANGLE))
      act("tri");
    if (pad.pressed(B.SQUARE))
      act("sq");
    if (pad.pressed(B.L1))
      act("l1");
    if (pad.pressed(B.R1))
      act("r1");
    if (pad.pressed(B.CREATE))
      act("create");
    if (s.tick)
      s.tick(dt, pad);
    return true;
  }
}

class Screen {
  constructor(opt = {}) {
    this.opt = opt;
    this.items = [];
    this.idx = opt.start || 0;
    this.cols = opt.cols || 1;
  }
  mount(ui) {
    this.ui = ui;
    this.game = ui.game;
    this.el = h("div", "screen " + (this.opt.cls || "dim"));
    this.items = [];
    this.build();
    ui.root.appendChild(this.el);
    this.focus(clamp(this.idx, 0, Math.max(0, this.items.length - 1)), true);
  }
  unmount() {
    if (this.el)
      this.el.remove();
  }
  reveal() {
    this.rebuild();
  }
  rebuild() {
    if (!this.el)
      return;
    const keep = this.idx;
    this.el.innerHTML = "";
    this.items = [];
    this.build();
    this.focus(clamp(keep, 0, Math.max(0, this.items.length - 1)), true);
  }
  build() {
    if (this.opt.build)
      this.opt.build(this);
  }
  footer(parent, gen) {
    this.footerGen = gen;
    this.footerEl = h("div", "footer", gen());
    parent.appendChild(this.footerEl);
  }
  refreshFooter() {
    if (this.footerEl && this.footerGen)
      this.footerEl.innerHTML = this.footerGen();
    if (this.opt.onGlyphs)
      this.opt.onGlyphs(this);
  }
  item(el2, cfg = {}) {
    const i = this.items.length;
    this.items.push({ el: el2, ...cfg });
    el2.addEventListener("mouseenter", () => {
      if (this.idx !== i)
        this.focus(i);
    });
    el2.addEventListener("click", (e) => {
      e.preventDefault();
      this.focus(i, true);
      if (cfg.right && !cfg.act) {
        this.ui.sfx("uiMove");
        cfg.right();
        this.afterChange();
      } else
        this.activate();
    });
    el2.addEventListener("contextmenu", (e) => {
      if (cfg.left) {
        e.preventDefault();
        cfg.left();
        this.afterChange();
      }
    });
    return el2;
  }
  afterChange() {
    const it = this.items[this.idx];
    if (it && it.refresh)
      it.refresh(it.el);
  }
  focus(i, silent = false) {
    if (!this.items.length)
      return;
    const prev = this.items[this.idx];
    if (prev)
      prev.el.classList.remove("focus");
    this.idx = (i + this.items.length) % this.items.length;
    const it = this.items[this.idx];
    it.el.classList.add("focus");
    if (!silent)
      this.ui.sfx("uiMove");
    if (it.el.scrollIntoView)
      it.el.scrollIntoView({ block: "nearest" });
    if (this.opt.onFocus)
      this.opt.onFocus(this, it, this.idx);
  }
  activate() {
    const it = this.items[this.idx];
    if (!it)
      return;
    if (it.disabled) {
      this.ui.sfx("uiError");
      if (it.denied)
        it.denied();
      return;
    }
    if (it.act) {
      this.ui.sfx("uiSelect");
      it.act();
    } else if (it.right) {
      this.ui.sfx("uiMove");
      it.right();
      this.afterChange();
    }
  }
  input(a) {
    if (this.opt.onInput && this.opt.onInput(this, a))
      return;
    const it = this.items[this.idx];
    const grid = this.cols > 1;
    switch (a) {
      case "up":
        grid ? this.focus(this.idx - this.cols < 0 ? this.idx : this.idx - this.cols) : this.focus(this.idx - 1);
        break;
      case "down":
        grid ? this.focus(this.idx + this.cols >= this.items.length ? this.idx : this.idx + this.cols) : this.focus(this.idx + 1);
        break;
      case "left":
        if (it && it.left) {
          it.left();
          this.ui.sfx("uiMove");
          this.afterChange();
        } else if (grid || this.opt.row)
          this.focus(this.idx - 1);
        break;
      case "right":
        if (it && it.right) {
          it.right();
          this.ui.sfx("uiMove");
          this.afterChange();
        } else if (grid || this.opt.row)
          this.focus(this.idx + 1);
        break;
      case "ok":
        this.activate();
        break;
      case "back":
      case "options":
        if (this.opt.back === false)
          return;
        this.ui.sfx("uiBack");
        if (this.opt.back)
          this.opt.back(this);
        else
          this.ui.pop();
        break;
      default:
        break;
    }
  }
}
var btn = (label, sub = "") => h("div", "btn", `<span>${label}</span>${sub ? `<span class="sub">${sub}</span>` : ""}`);

function optRow(s, label, get, set, kind, opts = {}) {
  const el2 = h("div", "btn");
  const render = () => {
    const v = get();
    let val;
    if (kind === "slider")
      val = `<span class="slider"><span class="bar"><i style="width:${Math.round(v * 100)}%"></i></span><span class="val">${Math.round(v * 100)}</span></span>`;
    else if (kind === "toggle")
      val = `<span class="val">${v ? "ON" : "OFF"}</span>`;

      val = `<span class="val">${opts.fmt ? opts.fmt(v) : v}</span>`;
    el2.innerHTML = `<span>${label}</span>${val}`;

  render();
  const step2 = opts.step || 0.1;

var TABS = ["Basics", "Flips", "Grabs", "Grinds", "Lips", "Specials"];
function trickList(game, skaterId) {

  const table = (T, b) => Object.entries(T).map(([d, t]) => entry(d === "C" ? "" : d, g(b), t.name, t.pts)).join("");
  const body = () => {
    switch (TABS[tab]) {
      case "Basics":
        return [
          ["", g(B.CROSS), "Hold to crouch, release to Ollie"],
          ["", `${g(B.UP)}${g(B.UP)} + ${g(B.CROSS)}`, "Boneless (higher ollie)"],
          ["", g(B.L2), "Toggle Nollie stance"],
          ["", `${g(B.UP)}${g(B.DOWN)}`, "Manual (links combos)"],
          ["", `${g(B.DOWN)}${g(B.UP)}`, "Nose Manual"],
          ["", g(B.R2), "Revert when landing on a ramp"],
          ["", g(B.TRIANGLE), "Grind / Lip trick / Wallride"],
          ["", `${g(B.CROSS)} on a wall`, "Wallie off a wallride"],
          ["", `${g(B.R2)} in vert air`, "Spine Transfer over the coping"],
          ["", `${g(B.L1)} ${g(B.R1)} / ${g(B.LEFT)}${g(B.RIGHT)}`, "Spin in the air"],
          ["", `${g(B.SQUARE)}${g(B.SQUARE)}`, "Double flip (tap twice fast)"],
          ["", `dir + ${g(B.TRIANGLE)} on rail`, "Switch grinds mid-rail"],
          ["", `Hold ${g(B.CROSS)} up a ramp`, "Pump for extra vert air"],
          ["", `Hold ${g(B.DOWN)}`, "Brake"],
          ["", `${rstickG()}`, "Look around"]
        ].map(([d, b, n]) => entry(d, b, n)).join("");
      case "Flips":
        return table(FLIPS, B.SQUARE);
      case "Grabs":
        return table(GRABS, B.CIRCLE) + '<div class="trick">Hold the grab for more points — let go before landing!</div>';
      case "Grinds":
        return table(GRINDS, B.TRIANGLE) + Object.entries(SLIDES).filter(([d]) => ["C", "N", "S", "E"].includes(d)).map(([d, t]) => entry(d === "C" ? "" : d, g(B.TRIANGLE), t.name + " <small>(board across)</small>", t.pts)).join("");
      case "Lips":
        return table(LIPS, B.TRIANGLE) + '<div class="trick">Press at the coping while going up a quarter pipe.</div>';
      case "Specials":
        return sk.specials.map((id) => {
          const sp = SPECIALS[id];
          return entry("", `${seqG(sp.seq)} + ${g(sp.btn === "flip" ? B.SQUARE : sp.btn === "grab" ? B.CIRCLE : B.TRIANGLE)}`, sp.name + (sp.btn === "lip" ? " <small>(at a lip)</small>" : sp.btn === "grind" ? " <small>(on a rail)</small>" : ""), sp.base);
        }).join("") + '<div class="trick">Fill the special meter by landing tricks. Bailing empties it.</div>';
      default:
        return "";
    }
  };
  return new Screen({
    cls: "dimall",
    build(s) {
      header(s, "Trick List", sk.name);
      const tabs = h("div", "tabs", `${g(B.L1)}${TABS.map((t, i) => `<span class="tab ${i === tab ? "on" : ""}" data-i="${i}">${t}</span>`).join("")}${g(B.R1)}`);

      s.el.appendChild(tabs);
      s.el.appendChild(h("div", "trickgrid", body()));
      s.el.appendChild(h("div", "grow"));
      s.el.appendChild(s.item(btn("Back"), { act: () => game.ui.pop() }));
      s.footer(s.el, () => [`<span class="hint">${g(B.L1)}${g(B.R1)} Category</span>`, hint(B.CIRCLE, "Back")].join(""));
    },
    onGlyphs(s) {
      s.rebuild();
    },
    onInput(s, a) {
      if (a === "l1" || a === "left") {
        tab = (tab + TABS.length - 1) % TABS.length;
        s.ui.sfx("uiMove");
        s.rebuild();
        return true;
      }
      if (a === "r1" || a === "right") {

        return true;
      }

    }
  });

        }

          this._next();

          this._next();

      }

      setTimeout(() => {

      }, delay * 1000);

  }
}

import * as THREE18 from "three/webgpu";
var nullPhysics = { addTrimesh() {}, addBox() {} };

class Editor {
  constructor(game) {
    this.game = game;
    this.cx = 6;
    this.cz = 6;
    this.sel = 0;
    this.rot = 0;
    this.yaw = 0;
    this.zoom = 1;
    this.camPos = new THREE18.Vector3;
    this.look = new THREE18.Vector3;
    this.rep = 0;
    this.repDir = null;
    this.overlay = null;
    this.dirty = false;
  }
  get data() {
    return this.park;
  }
  async open() {
    const game = this.game;
    this.park = Save.data.park ? JSON.parse(JSON.stringify(Save.data.park)) : defaultPark();
    await game.clearLevel();
    const L = new LevelBuilder(nullPhysics);
    const meta = buildPark(L, { pieces: [] });
    game.applyEnvironment(meta);
    this.base = L.build();
    game.scene.add(this.base);
    this.content = null;
    this.ghost = null;
    this._rebuild();
    this._ghost();
    this._overlay(true);
    game.state = "editor";
    game.hud.show(false);
    game.audio.playMusic(4);
  }
  close() {
    this._overlay(false);
    for (const o of [this.base, this.content, this.ghost, this.cursor])
      if (o && o.parent) {
        o.parent.remove(o);
        disposeTree(o);
      }
    this.base = this.content = this.ghost = this.cursor = null;
  }
  save() {
    Save.data.park = JSON.parse(JSON.stringify(this.park));
    Save.write();
    this.dirty = false;
  }
  _rebuild() {
    if (this.content) {
      this.game.scene.remove(this.content);
      disposeTree(this.content);
    }
    const L = new LevelBuilder(nullPhysics);
    buildPieces(L, this.park);
    this.coneMat = this.coneMat || basic("#f28c28");
    for (const p of L.props) {
      const m = new THREE18.Mesh(new THREE18.ConeGeometry(0.17, 0.6, 10), this.coneMat);
      m.position.copy(p.pos).add(new THREE18.Vector3(0, 0.3, 0));
      L.group.add(m);
    }
    this.content = L.build();
    this.game.scene.add(this.content);
  }
  _occupancy() {
    const occ = new Map;
    this.park.pieces.forEach((p, i) => {
      const fp = footprint(PIECE_BY_ID[p.type], p.rot);
      for (let x = 0;x < fp.w; x++)
        for (let z = 0;z < fp.d; z++)
          occ.set(`${p.cx + x},${p.cz + z}`, i);
    });
    return occ;
  }
  _fits() {
    const def = PIECES[this.sel];
    const fp = footprint(def, this.rot);

      return { ok: false, hits: [] };
    const occ = this._occupancy();
    const hits = new Set;
    for (let x = 0;x < fp.w; x++)
      for (let z = 0;z < fp.d; z++) {
        const k = `${this.cx + x},${this.cz + z}`;
        if (occ.has(k))
          hits.add(occ.get(k));

  _ghost() {
    const game = this.game;
    if (this.ghost) {
      game.scene.remove(this.ghost);
      disposeTree(this.ghost);
    }
    if (this.cursor) {
      game.scene.remove(this.cursor);
      disposeTree(this.cursor);
    }

    g2.add(floorM, disc, ring, wall2, stripe);
    for (const [c, x] of [["#ff6ac1", -3], ["#5ff3ff", 3]]) {
      const l = new THREE19.PointLight(c, 25, 14, 1.5);
      l.position.set(x, 3, 2.5);
      g2.add(l);
    }
    this.scene.add(g2);
    this.showroomGroup = g2;
    this.srAngle = 0;
  }
  showroom(id, refresh = false) {
    if (this.srModel && this.srId === id && !refresh)
      return;
    if (this.srModel)
      this.showroomGroup.remove(this.srModel.root);
    const rec = Save.skater(id);
    this.srModel = new SkaterModel(rec.look, rec.def.stance, rec.rec.deck);
    this.srModel.root.position.set(0, 0.16, 0);
    this.srModel.root.traverse((o) => {
      if (o.isMesh)
        o.castShadow = true;
    });
    this.showroomGroup.add(this.srModel.root);
    this.srId = id;
  }
  _showroomFrame(dt) {
    this.srAngle += dt * 0.6;
    if (this.srModel) {
      this.srModel.root.quaternion.setFromAxisAngle(V11(0, 1, 0), this.srAngle);
      this.srModel.update({ mode: "ride", crouch: 0.1 + Math.sin(this.t * 1.3) * 0.05, lean: Math.sin(this.t * 0.7) * 0.3 }, dt);
    }
    const c = this.camera;
    c.position.set(SHOWROOM.x - 1.5, SHOWROOM.y + 1.45, SHOWROOM.z + 4.6);
    c.lookAt(SHOWROOM.x - 1.5, SHOWROOM.y + 1, SHOWROOM.z);
    if (c.fov !== 45) {
      c.fov = 45;
      c.updateProjectionMatrix();
    }
    this.focus.copy(SHOWROOM);
  }
  openTitle() {
    this.state = "title";
    this.hud.show(false);
    this.ui.clear();
    this.ui.push(titleScreen(this));
  }
  openMainMenu() {
    this.state = "menu";
    this.ui.clear();
    this.ui.push(mainMenu(this));
  }
  async toMenuBackdrop() {
    if (!this.level || this.level.id === "park") {
      await this.loadLevel(this.menuLevel || "hangar");
    }
    this.session = null;
    this.removeSkater();
    this.hud.show(false);
    this.audio.silenceLoops();
    this.paused = false;
  }
  flow(mode) {
    this.flowMode = mode;
    const ui = this.ui;
    if (mode === "horse") {
      ui.push(skaterSelect(this, {
        title: "Player 1: Choose Skater",
        onPick: (id) => {
          this.horseP1 = id;
          ui.push(skaterSelect(this, { title: "Player 2: Choose Skater", onPick: (id2) => {
            this.horseP2 = id2;
            this.pushLevelSelect();
          } }));
        }
      }));
    } else
      ui.push(skaterSelect(this, { onPick: () => this.pushLevelSelect() }));
  }
  pushLevelSelect() {
    this.ui.push(levelSelect(this, this.flowMode, (lvl) => this.beginLevel(lvl)));
  }
  beginLevel(lvl) {
    const mode = this.flowMode;
    this.lastLevel = lvl;
    if (mode === "career" && lvl === "arena")
      return this.startSession("arena", "comp");
    if (mode === "horse") {
      const name = (id) => SKATERS.find((s) => s.id === id).name;
      const horse = { players: [{ name: "Player 1", skaterId: this.horseP1, skaterName: name(this.horseP1), letters: 0 }, { name: "Player 2", skaterId: this.horseP2, skaterName: name(this.horseP2), letters: 0 }], turn: 0, order: [0, 1], step: 0, round: [], roundNo: 1, phase: "intro", clock: 10 };
      return this.startSession(lvl, "horse", { horse, park: lvl === "park" ? Save.data.park : undefined });
    }
    return this.startSession(lvl, mode, { park: lvl === "park" ? Save.data.park : undefined });
  }
  async backToLevelSelect() {
    await this.toMenuBackdrop();
    this.state = "menu";
    this.ui.clear();
    this.ui.push(mainMenu(this));
    if (this.flowMode === "horse")
      this.flow("horse");
    else {
      this.ui.push(skaterSelect(this, { onPick: () => this.pushLevelSelect() }));
      this.pushLevelSelect();
    }
  }
  async quitToMenu() {
    this.attract.stop();
    await this.toMenuBackdrop();
    this.openMainMenu();
  }
  afterShop() {
    if (this.skater && this.session)
      this.skater.params();
  }
  async openEditor(fromTest = false) {
    this.ui.clear();
    this.paused = false;
    this.hud.show(false);
    this.audio.silenceLoops();
    await this.editor.open(fromTest);
  }
  async startSession(levelId, mode, opts = {}) {
    this.ui.clear();
    this.paused = false;
    this.state = "loading";
    this.hud.show(false);
    this.audio.silenceLoops();
    this.lastSession = { levelId, mode, opts };
    await this.loadLevel(levelId, opts.park);
    if (mode === "attract" && !this.attract.active) {
      this.openTitle();
      return;
    }
    const meta = this.level.meta;
    const skId = opts.skaterId || (mode === "horse" ? opts.horse.players[0].skaterId : Save.data.selected);
    this.setSkater(skId);
    this.combo.reset();
    const sess = this.session = new Session(this, mode, meta, opts);
    this.collect.setup(meta, { goals: mode === "career", cash: mode !== "horse" && mode !== "comp" });
    this._spawn(mode === "comp" ? "dropin" : null);
    this.hud.reset(sess);
    this.hud.show(true);
    this.state = mode === "attract" ? "attract" : "play";
    if (mode === "attract")
      this.audio.playMusic(Math.floor(Math.random() * 5));
    else if (this.audio.track !== meta.music)
      this.audio.playMusic(meta.music);
    this.audio.setCrowd(meta.comp ? 0.55 : 0);
    if (mode === "career") {
      this.paused = true;
      this.ui.push(goalsScreen(this, meta, sess, { intro: true, onStart: () => this.resume() }));
    } else if (mode === "comp") {
      this.paused = true;
      this.ui.push(compIntro(this, () => this.resume()));
    } else if (mode === "horse") {
      this.showHorseTurn();
    }
  }
  _spawn(name) {
    const spawns = this.level.spawns;
    const sp = name && spawns.find((s) => s.name === name) || spawns[0];
    this.skater.spawnAt(sp.pos, sp.dir);
    if (name === "dropin")
      this.skater.vel.copy(this.skater.fwd).multiplyScalar(1.5);
    this.chase.snap(this.skater);
  }
  restartRun() {
    const l = this.lastSession;
    if (!l)
      return;
    if (l.mode === "horse")
      return;
    this.startSession(l.levelId, l.mode, l.opts);
  }
  pause() {
    if (this.paused || !this.session)
      return;
    this.paused = true;
    this.audio.silenceLoops();
    this.ui.push(pauseMenu(this));
  }
  resume() {
    this.ui.clear();
    this.paused = false;
    if (this.skater)
      this.skater.crossUsed = true;
  }
  setRestartPoint() {
    const s = this.skater;
    if (!s || !this.session)
      return;
    if (s.state !== "ground") {
      this.hud.toast("Stop on the ground to set a restart point");
      return;
    }
    this.session.restart = { pos: s.pos.clone(), dir: s.fwd.clone().setY(0).normalize() };
    this.hud.toast("Restart point set");
  }
  gotoRestartPoint() {
    const r = this.session && this.session.restart;
    if (!r)
      return;
    this.combo.reset();
    this.skater.spawnAt(r.pos, r.dir);
    this.chase.snap(this.skater);
  }
  createButton() {
    const m = this.session.mode;
    if (m === "career") {
      this.paused = true;
      this.ui.push(goalsScreen(this, this.session.meta, this.session, { onClose: () => this.resume() }));
    } else if (m === "free" || m === "park") {
      if (this.session.restart && this.skater.state !== "ground")
        this.gotoRestartPoint();
      else
        this.setRestartPoint();
    }
  }
  onRunEnd(sess) {
    this.paused = true;
    this.audio.silenceLoops();
    setTimeout(() => this.ui.push(runEndScreen(this, sess)), 600);
  }
  checkUnlocks() {
    const total = Save.totalGoals();
    Save.data.notified = Save.data.notified || {};
    for (const l of LEVEL_INFO) {
      if (l.unlock > 0 && total >= l.unlock && !Save.data.notified[l.id]) {
        Save.data.notified[l.id] = true;
        Save.write();
        setTimeout(() => this.hud.note(`${l.name} UNLOCKED!`, "big", 2.4), 1600);
      }
    }
  }
  onHeatEnd(sess) {
    this.paused = true;
    this.audio.silenceLoops();
    this.audio.cheer(1);
    setTimeout(() => {
      this.ui.push(heatResults(this, sess, () => {
        if (sess.heats.length < 3) {
          sess.nextHeat();
          this.combo.reset();
          this._spawn("dropin");
          this.collect.setup(sess.meta, { goals: false, cash: false });
          this.resume();
          this.hud.toast(`HEAT ${sess.heat}`, "big");
          this.audio.play("horn");
        } else
          this.finishComp(sess);
      }));
    }, 700);
  }
  finishComp(sess) {
    const st = sess.compStandings();
    const place = st.findIndex((r) => r.you) + 1;
    const medal = place === 1 ? "gold" : place === 2 ? "silver" : place === 3 ? "bronze" : null;
    const rank = { gold: 3, silver: 2, bronze: 1 };
    if (medal && rank[medal] > (rank[Save.data.medals.arena] || 0)) {
      Save.data.medals.arena = medal;
      Save.data.cash += { gold: 1500, silver: 900, bronze: 500 }[medal];
    }
    let unlocked = false;
    if (medal === "gold" && !Save.data.unlockedSecret) {
      Save.data.unlockedSecret = true;
      if (!Save.data.decks.includes("hawk"))
        Save.data.decks.push("hawk");
      unlocked = true;
    }
    Save.write();
    this.ui.clear();
    this.ui.push(compFinal(this, sess, place, medal));
    if (medal) {
      this.fx.confettiBurst(this.skater.pos.clone().add(V11(0, 2, 0)), 200);
      this.audio.play("goal");
    }
    if (unlocked)
      setTimeout(() => this.hud.note("SECRET SKATER UNLOCKED: SQUAWK!", "big", 3), 900);
  }
  showHorseTurn() {
    const sess = this.session, h2 = sess.horse;
    h2.turn = h2.order[h2.step];
    const p = h2.players[h2.turn];
    this.setSkater(p.skaterId);
    this.combo.reset();
    this._spawn(null);
    this.hud.reset(sess);
    this.paused = true;
    h2.phase = "intro";
    this.ui.clear();
    this.ui.push(horseTurn(this, { ...h2, first: h2.step === 0, target: h2.round[h2.order[0]] }, () => {
      this.resume();
      h2.phase = "attempt";
      h2.clock = 10;
    }));
  }
  onHorseAttempt(sess, h2) {
    setTimeout(() => {
      this.paused = true;
      this.audio.silenceLoops();
      const p = h2.players[h2.turn];
      const r = h2.last;
      const desc = r.bailed ? `${p.name} bailed!` : r.timeout ? `${p.name} ran out of time.` : `${p.name} landed ${fmt(r.pts)}`;
      if (h2.step === 0) {
        h2.step = 1;
        this.ui.clear();
        this.ui.push(horseResult(this, h2, { title: desc, sub: `${h2.players[h2.order[1]].name} is up next` }, () => this.showHorseTurn()));
        return;
      }
      const a = h2.order[0], b = h2.order[1];
      const sa = h2.round[a] || 0, sb = h2.round[b] || 0;
      let msg = "Tie — no letters this round";
      let loser = null;
      if (sa !== sb) {
        loser = sa < sb ? a : b;
      }
      if (loser !== null) {
        h2.players[loser].letters++;
        msg = `${h2.players[loser].name} gets ${"HORSE"[h2.players[loser].letters - 1]}!`;
        this.audio.play("letterH");
      }
      const over = h2.players.find((q) => q.letters >= 5);
      this.ui.clear();
      if (over) {
        const winner = h2.players.find((q) => q !== over);
        this.audio.play("goal");
        this.ui.push(horseResult(this, h2, { title: `${winner.name} WINS!`, sub: `${over.name} spelled H-O-R-S-E`, btn: "Rematch", final: true }, () => this.beginLevel(this.lastLevel)));
      } else {
        this.ui.push(horseResult(this, h2, { title: desc, sub: msg }, () => {
          h2.roundNo++;
          h2.round = [];
          h2.step = 0;
          h2.order = h2.roundNo % 2 ? [0, 1] : [1, 0];
          this.showHorseTurn();
        }));
      }
    }, 1100);
  }
  startAttract() {
    this.ui.clear();
    this.hud.show(false);
    this.state = "attract";
    this.attract.start();
  }
  async exitAttract() {
    this.attract.stop();
    this.state = "title";
    this.session = null;
    this.removeSkater();
    this.audio.silenceLoops();
    this.hud.show(false);
    this.menuLevel = this.level ? this.level.id : "hangar";
    this.openTitle();
  }
  frame() {
    const now = performance.now();
    const dt = Math.min(0.1, Math.max(0, (now - this.last) / 1000));
    this.last = now;
    this.t += dt;
    const input = this.input;
    input.update(now / 1000);
    const pad = input.pad;
    let swallow = false;
    const uiWasActive = this.ui.active;
    if (this.state === "touch" && (input.gamepadConnected || input.keys.size)) {
      this.openTitle();
      swallow = true;
    }
    if (this.state === "attract" && input.anyInputThisFrame) {
      this.exitAttract();
      swallow = true;
    }
    if (!swallow)
      this.ui.update(dt, pad);
    const st = this.state;
    if ((st === "title" || st === "menu") && !this.loading) {
      if (input.idleSeconds() > 10)
        this.startAttract();
      else if (this.ui.top && this.ui.top.opt.showroom)
        this._showroomFrame(dt);
      else {
        this.orbit.update(dt);
        this.focus.copy(this.orbit.center);
      }
    } else if (st === "play" && this.session && !this.loading) {
      if (!this.ui.active && !this.paused && !uiWasActive) {
        if (pad.pressed(B.OPTIONS))
          this.pause();
        else if (pad.pressed(B.CREATE))
          this.createButton();
      }
      if (!this.paused)
        this.step(dt, pad);
      else
        this.chase.update(0, this.skater, null, this.settings);
    } else if (st === "attract" && this.session && this.skater && !this.loading) {
      this.attract.update(dt);
      if (this.session)
        this.step(dt, this.attract.pad);
    } else if (st === "editor") {
      this.editor.update(dt, pad);
    } else if (st === "touch") {
      this.orbit.update(dt);
      this.focus.copy(this.orbit.center);
    }
    if (this.level) {
      for (const s of this.level.spinners)
        s.obj.rotation[s.axis] += s.speed * dt * 10;
      if (this.level.crowd)
        this.level.crowd.update(this.t, dt);
      if (this.level.judges && this.session && this.session.mode === "comp") {
        this.level.judges.children.forEach((j, i) => {
          j.rotation.y = Math.sin(this.t * 0.8 + i) * 0.3;
        });
      }
    }
    if (this.showroomGroup)
      this.showroomGroup.visible = !!(this.ui.top && this.ui.top.opt.showroom);
    this.fx.update(dt);
    if (this.sky)
      this.sky.position.copy(this.camera.position);
    followSun(this.sun, this.focus);
    this.post.render();
  }
  step(dt, pad) {
    const sk = this.skater, sess = this.session;
    sk.update(dt, pad);
    this.physics.step(dt);
    if (sk.state !== "bail")
      this.physics.knock(sk.pos, sk.vel, (d, sp) => this.audio.play("knock", { v: clamp(sp / 8, 0.3, 1) }));
    const center = sk.state === "bail" ? null : sk.pos.clone().addScaledVector(sk.up, 0.85);
    this.collect.update(dt, center, (c) => sess && sess.onPickup(c));
    if (!this.session)
      return;
    sess.update(dt);
    this.chase.cinema = sess.mode === "attract" ? 1 : 0;
    this.chase.update(dt, sk, sess.mode === "attract" ? null : pad, this.settings);
    if (sk.state === "grind") {
      const metal = sk.grind.rail.surface === "metal";
      this.fx.grind(sk.pos, sk.vel, metal);
    }
    if (sk.specialFull && sk.state !== "bail" && Math.random() < 0.6)
      this.fx.specialAura(sk.pos);
    this.audio.updateSkate({ speed: sk.speed, grounded: sk.grounded, grinding: sk.state === "grind", grindKind: sk.grind ? sk.grind.rail.type : null, surface: sk.surface, airborne: sk.state === "air" }, dt);
    this.hud.update(dt);
    this.focus.copy(sk.pos);
  }
}
var game = new Game;
game.boot().catch((e) => {
  console.error("[PSB2] boot failed", e);
  const el2 = document.getElementById("loading");
  if (el2)
    el2.querySelector("p").textContent = "Something went wrong while starting: " + e.message;
});

</script>
