function toast(text,type='info'){const div=document.createElement('div');div.className='toast '+type;div.innerHTML=icon(type==='error'?'shield':type==='success'?'check':'cube');const span=document.createElement('span');span.textContent=text;div.append(span);$('#toasts').append(div);while($('#toasts').children.length>3)$('#toasts').firstChild.remove();setTimeout(()=>div.remove(),4200);}
function save(){if(lab)return;const data=game?.checkpoint();if(!data)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));saveAvailable=true;}catch{saveAvailable=false;}}
function handleEvent(e){view?.event(e);if(e.type==='shot')audio.tone(e.kind==='cannon'||e.kind==='mortar'?100:e.kind==='chain'?900:430,.055,.012,e.kind==='chain'?'sine':'triangle');if(e.type==='waveComplete'){toast(`Wave ${e.wave} clear. +${e.bonus} coins${e.perfect?' · No leaks':''}.`,'success');save();audio.tone(750,.25,.05);}
  if(e.type==='heroLevel')toast(`${HERO_BY_ID[game.hero.id].name} reached level ${e.level}.`,'success');
  if(e.type==='leak')audio.tone(100,.12,.04,'sawtooth');if(e.type==='gameOver')setTimeout(()=>openResult(e.won),400);
  if(['towerPlaced','towerUpgraded','towerSold','heroChosen'].includes(e.type)){save();if($('#tower-inspector'))renderInspector();}
}
let resumed=false;
try{const raw=localStorage.getItem(SAVE_KEY);if(raw){game=Game.restore(JSON.parse(raw),handleEvent);resumed=true;}}catch(error){console.warn('Save was not restored:',error);}
if(!game)game=new Game({onEvent:handleEvent});
view=new Battlefield($('#world'),()=>game,status=>{engineStatus=status;updateRenderStatus();});
function updateRenderStatus(){const el=$('#render-status');if(!el)return;const s=engineStatus;el.innerHTML=`<i class="${['three','webgl2'].includes(s.renderer)?'live':''}"></i> ${s.initializing?'CHECKING DISPLAY':s.renderer==='loading'?'INITIALIZE DISPLAY':s.api+' · '+s.engine.toUpperCase()}`;el.title=`${s.engine||'Starting'} / ${s.api||'Not selected'}. ${s.reason||'Open the display report for frame tests and device details.'}`;}
function displayBlocked(){return !view||view.initializing||!view.diagnostics.ready||!view.diagnostics.entered||view.diagnostics.open;}
function openDisplay(){cancelAction();view.diagnostics.show();}

function renderArmory(){const list=TOWERS.filter(t=>filter==='all'||t.category===filter);$('#tower-grid').innerHTML=list.map(t=>`<button class="tower-card ${selectedType===t.id?'selected':''}" data-tower="${t.id}" title="${t.name}: ${t.desc}" style="--tower-color:${t.color}"><span class="tower-key">${TOWERS.indexOf(t)<9?TOWERS.indexOf(t)+1:TOWERS.indexOf(t)===9?'0':TOWERS.indexOf(t)===10?'−':'='}</span><span class="tower-cost">${icon('coin')} ${t.cost}</span><img src="${images.towers[t.id]}" alt="${t.name} voxel tower"><strong>${t.name}</strong><span class="tower-role">${t.role}</span></button>`).join('');$$('[data-tower]').forEach(b=>b.onclick=()=>selectBuild(b.dataset.tower));}
function renderInspector(){if(!game)return;const t=game.towers.find(t=>t.id===selectedTowerId),d=t?game.towerStats(t):TOWER_BY_ID[selectedType];if(!d)return;const rate=(1/d.interval).toFixed(1);$('#tower-inspector').innerHTML=`<div class="inspector-heading"><span class="inspector-color" style="background:${d.color}"></span><h3>${d.name}</h3><span class="inspector-tag">${t?`LEVEL ${t.level} / 3`:d.category==='control'?'CONTROL':'DAMAGE'}</span>${t?`<button class="small-icon" id="close-inspector" title="Close tower details" aria-label="Close tower details">${icon('close')}</button>`:''}</div><p>${d.desc}</p><div class="tower-stats"><div><span>DAMAGE</span><strong>${Math.round(d.damage)}<small>${d.poison?' + DOT':''}</small></strong></div><div><span>RANGE</span><strong>${d.range.toFixed(1)}<small> m</small></strong></div><div><span>FIRE RATE</span><strong>${rate}<small> / s</small></strong></div></div>${t?`<div class="target-row"><span>${icon('crosshair')} Target</span><button id="target-mode">${t.targetMode[0].toUpperCase()+t.targetMode.slice(1)} ${icon('chevron')}</button><small id="tower-kills">${t.kills} kills</small></div><div class="inspector-actions"><button class="upgrade-button" id="upgrade-button" ${t.level>=3?'disabled':''}>${icon('upgrade')} ${t.level>=3?'Max level':`Upgrade <span>${icon('coin')} ${game.upgradeCost(t)}</span>`}</button><button class="sell-button" id="sell-button" title="Sell for 70% of the coins spent on this tower">${icon('sell')} ${Math.floor(t.paid*SETTINGS.sellRatio)}</button></div>`:`<button class="build-button" id="build-button">${icon('plus')} Place ${d.name}<span>${icon('coin')} ${d.cost}</span></button><div class="counter-note">GOOD AGAINST <strong>${d.counter}</strong></div>`}`;
  if(t){$('#close-inspector').onclick=()=>{selectedTowerId=null;view.range=null;renderInspector();};$('#target-mode').onclick=()=>{const modes=['first','strong','fast','near'];game.setTarget(t.id,modes[(modes.indexOf(t.targetMode)+1)%4]);save();renderInspector();};$('#upgrade-button').onclick=()=>{if(game.upgradeTower(t.id)){toast(`${d.name} upgraded to level ${t.level}.`,'success');view.range={x:t.x,z:t.z,radius:game.towerStats(t).range};audio.tone(660,.15);save();renderInspector();}else toast('Not enough coins for this upgrade.','error');};$('#sell-button').onclick=()=>{game.sellTower(t.id);selectedTowerId=null;view.range=null;save();renderInspector();};}
  else $('#build-button').onclick=()=>selectBuild(d.id);
}
function selectBuild(type){if(modalOpen||game.phase==='won'||game.phase==='lost')return;audio.unlock();selectedType=type;selectedTowerId=null;action={kind:'build',type};view.range=null;renderArmory();renderInspector();updatePlacement();}
function cancelAction(){action=null;view.ghost=null;const t=game.towers.find(t=>t.id===selectedTowerId);view.range=t?{x:t.x,z:t.z,radius:game.towerStats(t).range}:null;$('#placement-hint').hidden=true;$('#world').classList.remove('targeting');}
function updatePlacement(){if(!action)return;const point=hoverPoint||{x:0,z:0};$('#placement-hint').hidden=false;$('#world').classList.add('targeting');if(action.kind==='build'){const x=Math.round(point.x),z=Math.round(point.z),d=TOWER_BY_ID[action.type],reason=game.canBuild(x,z),valid=!reason&&game.gold>=d.cost;view.ghost={type:action.type,x,z,valid};view.range={x,z,radius:d.range,valid};$('#placement-hint').innerHTML=`${icon('cube')} <strong>Place ${d.name}</strong><span>${hoverPoint?(reason||(!valid?'Not enough coins.':'Click to build · Shift keeps placement active')):'Choose clear grass on the map.'}</span><kbd>ESC</kbd>`;}
  else{view.ghost=null;const radius=action.kind==='move'?.7:action.ability==='meteor'?3.8:game.hero?.id==='nyx'?5:4.5;view.range={...point,radius,valid:Math.abs(point.x)<18&&Math.abs(point.z)<13};const name=action.kind==='move'?'Move guardian':action.ability==='meteor'?'Skyfall':HERO_BY_ID[game.hero.id].skill;$('#placement-hint').innerHTML=`${icon(action.kind==='move'?'move':'target')} <strong>${name}</strong><span>Select a point on the map.</span><kbd>ESC</kbd>`;}}
function requestAbility(kind){if(modalOpen||displayBlocked())return;audio.unlock();if(game.phase!=='wave'){toast('Abilities become available during a wave.');return;}if(game.paused){toast('Resume the game to use an ability.');return;}if(game.cooldowns[kind]>0){toast('This ability is not ready.');return;}if(kind==='meteor'||kind==='hero'&&HERO_BY_ID[game.hero.id].targeted){action={kind:'ability',ability:kind};selectedTowerId=null;updatePlacement();}else{const result=game.useAbility(kind);if(result.ok){toast(kind==='freeze'?'Deep freeze active.':`${HERO_BY_ID[game.hero.id].skill} active.`,'success');audio.tone(kind==='freeze'?1100:600,.25,.05);cancelAction();}else toast(result.reason,'error');}}
function startWave(){if(displayBlocked())return;audio.unlock();if(!game.hero){openHeroes();return;}if(game.phase==='build'){cancelAction();save();game.startWave();audio.tone(620,.22,.05);updateUI();}}
function togglePause(){if(modalOpen)return;game.paused=!game.paused;updateUI();}
function cycleSpeed(){game.speed=game.speed===3?1:game.speed+1;updateUI();}

function updateUI(){if(!game)return;$('#gold').textContent=Math.floor(game.gold).toLocaleString();$('#lives').textContent=game.lives;$('#wave').textContent=String(game.wave).padStart(2,'0');$('#phase-label').textContent=lab?'TEST LAB':game.paused?'PAUSED':game.phase==='wave'?'WAVE IN PROGRESS':game.phase==='won'?'VALLEY SECURED':game.phase==='lost'?'DEFENSE LOST':'BUILD PHASE';$('#phase-badge').classList.toggle('in-wave',game.phase==='wave'&&!game.paused);$('#pause-overlay').hidden=!game.paused;$('#speed-button').innerHTML=game.speed+'<span>×</span>';$('#pause-button').innerHTML=icon(game.paused?'play':'pause');$('#pause-button').setAttribute('aria-label',game.paused?'Resume game':'Pause game');$('#auto-button').classList.toggle('on',game.auto);$('#auto-button').setAttribute('aria-pressed',String(game.auto));
  const w=WAVES[Math.min(game.phase==='wave'?game.wave-1:game.wave,19)];$('#wave-subtitle').textContent=game.phase==='wave'?`ON THE ROAD · ${game.enemies.length} ENEMIES`:`UP NEXT · WAVE ${String(Math.min(game.wave+1,20)).padStart(2,'0')}`;$('#wave-title').textContent=w.name;$('#wave-detail').textContent=game.phase==='wave'?`${game.spawned} / ${game.waveTotal} sent · ${game.waveLeaks} health lost`:w.groups.map(p=>`${p.count} ${ENEMY_BY_ID[p.type].name.toLowerCase()}${p.count>1?'s':''}`).join(' · ');const first=w.groups[0].type;if($('#next-enemy').dataset.type!==first){$('#next-enemy').dataset.type=first;$('#next-enemy').innerHTML=`<img src="${images.enemies[first]}" alt="${ENEMY_BY_ID[first].name}">`;}
  const start=$('#start-button');start.disabled=game.phase!=='build'||displayBlocked();start.innerHTML=game.phase==='wave'?`Wave ${game.wave}<span class="wave-live-bars"><i></i><i></i><i></i></span>`:game.phase==='won'?'Victory':game.phase==='lost'?'Defeat':`Start wave ${icon('arrow')}`;$('#wave-progress').style.width=(game.phase==='wave'?Math.max(0,1-(game.queue.length+game.enemies.length)/game.waveTotal)*100:0)+'%';
  $$('[data-tower]').forEach(b=>{b.classList.toggle('unaffordable',game.gold<TOWER_BY_ID[b.dataset.tower].cost);});
  if(game.hero){const h=game.hero,d=HERO_BY_ID[h.id];$('#hero-image').src=images.heroes[h.id];$('#hero-image').alt=d.name+' voxel hero';$('#hero-name').textContent=d.name;$('#hero-role').textContent=d.title.toUpperCase();$('#hero-level').textContent=h.level;$('#hero-xp').style.width=(h.level>=10?100:h.xp%180/180*100)+'%';$('#hero-skill-name').textContent=d.skill;$('#ability-hero').title=`${d.skill} [E]: ${d.skillDesc}`;$('#hero-change').innerHTML=game.wave===0?`Change hero ${icon('chevron')}`:`Move hero <kbd>H</kbd>`;}
  for(const key of ['meteor','freeze','hero']){const b=$('#ability-'+key),cd=game.cooldowns[key];b.disabled=cd>0||game.phase!=='wave'||game.paused;b.classList.toggle('ready',cd===0&&game.phase==='wave');$('#cd-'+key).textContent=cd>0?Math.ceil(cd)+'s':'';b.style.setProperty('--cooldown',Math.min(100,cd/(key==='hero'&&game.hero?HERO_BY_ID[game.hero.id].cooldown:ABILITIES[key]?.cooldown||30)*100)+'%');}
  const tower=game.towers.find(t=>t.id===selectedTowerId);if(tower&&$('#tower-kills')){$('#tower-kills').textContent=tower.kills+' kills';$('#upgrade-button').disabled=tower.level>=3||game.gold<game.upgradeCost(tower);}
  $('#save-status').innerHTML=icon(lab?'flask':'save')+(lab?' TEST SAVES OFF':saveAvailable?' LOCAL CHECKPOINTS':' SAVING UNAVAILABLE');
  const entry=view.project(-16.8,3.1,-7),exit=view.project(16.6,3.75,4);$('#entry-caption').style.left=entry.x+'px';$('#entry-caption').style.top=entry.y+'px';$('#exit-caption').style.left=exit.x+'px';$('#exit-caption').style.top=exit.y+'px';
}
function openModal(content,cls=''){modalOpen=true;cancelAction();$('#modal').className='modal '+cls;$('#modal').innerHTML=content;$('#modal-layer').hidden=false;document.body.classList.add('modal-open');$('#modal').querySelector('button,select,input')?.focus();$('#modal-close')?.addEventListener('click',closeModal);}
function closeModal(){if(!game.hero&&$('#modal').classList.contains('hero-modal'))return;modalOpen=false;$('#modal-layer').hidden=true;document.body.classList.remove('modal-open');}
const modalHeader=(eyebrow,title)=>`<div class="modal-heading"><div><span class="eyebrow">${eyebrow}</span><h2 id="modal-title">${title}</h2></div><button id="modal-close" class="icon-button" aria-label="Close dialog">${icon('close')}</button></div>`;
function openHeroes(){heroChoice=game.hero?.id||'rook';openModal(`${modalHeader('ONE GUARDIAN. YOUR PLAY STYLE.','Who holds the line?')}<p class="modal-intro">Choose one hero for this defense. Move them across the map and use their special ability when it matters.</p><div class="hero-choices">${HEROES.map(h=>`<button class="hero-choice ${heroChoice===h.id?'chosen':''}" data-hero="${h.id}" style="--hero-color:${h.color}"><span class="hero-choice-mark">${icon('check')}</span><div class="hero-art"><img src="${images.heroes[h.id]}" alt="${h.name}, ${h.title}"></div><span class="eyebrow">${h.title}</span><h3>${h.name}</h3><p>${h.desc}</p><div class="hero-trait"><strong>${h.skill}</strong><span>${h.skillDesc}</span></div><div class="hero-passive">${h.passive}</div></button>`).join('')}</div><div class="hero-modal-footer"><span>${icon('move')} Right-click the map to move your hero.</span><button class="primary-button" id="deploy-hero">Deploy ${HERO_BY_ID[heroChoice].name} ${icon('arrow')}</button></div>`,'hero-modal');
  $$('[data-hero]').forEach(b=>b.onclick=()=>{heroChoice=b.dataset.hero;$$('[data-hero]').forEach(c=>c.classList.toggle('chosen',c===b));$('#deploy-hero').innerHTML=`Deploy ${HERO_BY_ID[heroChoice].name} ${icon('arrow')}`;audio.unlock();audio.tone(540,.06);});$('#deploy-hero').onclick=()=>{audio.unlock();game.chooseHero(heroChoice);closeModal();save();updateUI();toast(`${HERO_BY_ID[heroChoice].name} is ready. Two starter towers are free. Build your next defense.`,'success');};
}
function openGuide(tab='waves'){modalTab=tab;const tabs=`<div class="guide-tabs">${[['waves','Wave plan'],['enemies','Enemy guide'],['weapons','Weapons'],['controls','Controls']].map(([key,name])=>`<button data-guide-tab="${key}" class="${key===tab?'active':''}">${name}</button>`).join('')}</div>`;let content='';
  if(tab==='waves')content=`<div class="wave-list">${WAVES.map((w,i)=>`<div class="wave-row ${i===game.wave?'next':''} ${i<game.wave?'past':''}"><span class="wave-index">${String(i+1).padStart(2,'0')}</span><div><h3>${w.name}</h3><p>${w.groups.map(p=>`${p.count} ${ENEMY_BY_ID[p.type].name}`).join(' · ')}</p></div><div class="wave-enemy-icons">${w.groups.slice(0,4).map(p=>`<img src="${images.enemies[p.type]}" alt="${ENEMY_BY_ID[p.type].name}" title="${ENEMY_BY_ID[p.type].desc}">`).join('')}</div>${i<game.wave?icon('check'):i===game.wave?icon('arrow'):''}</div>`).join('')}</div>`;
  if(tab==='enemies')content=`<p class="guide-note">Base health is shown below. Enemy health and shields rise by 6.5% of base per wave after wave 1. Difficulty also changes health.</p><div class="field-grid">${ENEMIES.map(e=>`<article class="field-card"><img src="${images.enemies[e.id]}" alt="${e.name}"><div><h3>${e.name}${e.boss?'<span class="boss-tag">BOSS</span>':''}</h3><span class="field-stats">${e.hp} HP${e.shield?` + ${e.shield} shield`:''} · ${e.speed} m/s · ${e.leak} base damage</span><p>${e.desc}</p><strong class="counter">Counter: ${e.counter}</strong></div></article>`).join('')}</div>`;
  if(tab==='weapons')content=`<div class="field-grid">${TOWERS.map(t=>`<article class="field-card"><img src="${images.towers[t.id]}" alt="${t.name}"><div><h3>${t.name}<span class="field-cost">${t.cost} coins</span></h3><span class="field-stats">${t.damage} damage · ${t.range} m · ${(1/t.interval).toFixed(1)} shots/s</span><p>${t.desc}</p><strong class="counter">${t.air?'Ground and air':'Ground only'} · ${t.element} damage</strong></div></article>`).join('')}</div>`;
  if(tab==='controls')content=`<div class="control-guide"><section><h3>Build, then defend.</h3><p>Select a tower from the armory. Click clear grass to place it. The dotted line shows its range. Shift-click to place more than one.</p><p>Click a built tower to upgrade it, change its target rule, or sell it. A sale returns 70% of the coins spent. The two free starter towers have no sale value until you upgrade them.</p><p>Keep enemies away from your keep. Clear all 20 waves to win. The game saves at build phases. Reloading restores the last build phase, not a wave in progress.</p></section><section><h3>Stay involved.</h3><p>Right-click the map to move your hero. The hero walks around solid objects, attacks on its own, and gains levels from kills across the map.</p><p>Skyfall and targeted hero skills need a map click. Deep freeze and Rook's Overdrive take effect at once. Cancel a target without spending its cooldown.</p><div class="key-table">${[['1–9, 0, −, =','Select a tower'],['Q / W / E','Skyfall / Freeze / Hero skill'],['H','Move hero'],['Space','Start a wave, or pause / resume'],['F','Cycle 1×, 2×, 3× speed'],['M','Mute / enable sound'],['I','Open the field guide'],['F2','Open the test lab'],['Esc / Right-click','Cancel placement or targeting'],['Mouse wheel','Zoom the map']].map(([k,v])=>`<div><kbd>${k}</kbd><span>${v}</span></div>`).join('')}</div></section></div>`;
  openModal(`${modalHeader('KNOW YOUR DEFENSE','Field guide')}${tabs}<div class="guide-body">${content}</div>`,'guide-modal');$$('[data-guide-tab]').forEach(b=>b.onclick=()=>openGuide(b.dataset.guideTab));}
function openSettings(){openModal(`${modalHeader('MAKE IT YOUR VALLEY','Settings')}<div class="settings-content"><div class="setting-row"><div><h3>Graphics</h3><p>${engineStatus.renderer==='canvas'?'Canvas 2D is active. GPU effects are off. Open Display to test or change the engine.':engineStatus.engine+' / '+engineStatus.api+'. High adds shadows and post effects. Fast reduces GPU load.'}</p></div><button class="secondary-button" id="quality-toggle">${view.quality==='high'?'High':'Fast'}</button></div><div class="setting-row"><div><h3>Sound effects</h3><p>Short, generated effects. No music or downloads.</p></div><button class="secondary-button" id="sound-toggle">${audio.muted?'Off':'On'}</button></div><div class="setting-row"><div><h3>Local checkpoint</h3><p>Saves between waves in this browser. The test lab does not overwrite your campaign.</p></div><button class="secondary-button" id="import-save">Import checkpoint</button><input type="file" id="import-save-file" accept=".json,application/json" hidden><button class="secondary-button" id="export-save">${icon('download')} Export</button></div><div class="setting-row"><div><h3>Test lab</h3><p>Spawn any enemy, add coins, select a wave, and export balance data.</p></div><button class="secondary-button" id="open-lab">${icon('flask')} Open</button></div><div class="new-game-settings"><h3>Start a new defense</h3><p>This clears the current campaign checkpoint.</p><select id="new-difficulty" aria-label="Difficulty"><option value="relaxed">Relaxed · 72% enemy health</option><option value="standard" selected>Standard · 100% enemy health</option><option value="veteran">Veteran · 130% enemy health</option></select><button class="primary-button" id="new-game">New game ${icon('arrow')}</button></div></div>`,'settings-modal');$('#quality-toggle').onclick=()=>{view.setQuality(view.quality==='high'?'fast':'high');$('#quality-toggle').textContent=view.quality==='high'?'High':'Fast';};$('#sound-toggle').onclick=()=>{audio.toggle();$('#sound-toggle').textContent=audio.muted?'Off':'On';};$('#import-save').onclick=()=>$('#import-save-file').click();$('#import-save-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw new Error('Checkpoint exceeds the 2 MB limit.');const data=JSON.parse(await file.text());Game.restore(data);openModal(`${modalHeader('RESTORE CHECKPOINT','Replace the current defense?')}<p class="modal-intro">The checked file has ${data.wave} completed waves and ${data.towers.length} towers. This replaces the current game.</p><div class="result-actions"><button id="import-cancel" class="secondary-button">Cancel</button><button id="import-confirm" class="primary-button">Restore checkpoint</button></div>`);$('#import-cancel').onclick=openSettings;$('#import-confirm').onclick=()=>{const restored=Game.restore(data,handleEvent);view.clear();lab=false;game=restored;selectedTowerId=null;action=null;closeModal();renderArmory();renderInspector();save();updateUI();if(!game.hero)openHeroes();toast('Checkpoint restored.','success');};}catch(error){toast('Checkpoint rejected: '+error.message,'error');}};$('#export-save').onclick=()=>{let snapshot=game.checkpoint();if(!snapshot){try{snapshot=JSON.parse(localStorage.getItem(SAVE_KEY));}catch{}}if(snapshot)downloadJSON(snapshot,'voxel-guard-checkpoint.json');else toast('No build-phase checkpoint is available yet.','error');};$('#open-lab').onclick=openLab;$('#new-game').onclick=()=>newGame($('#new-difficulty').value);}
function newGame(mode='standard'){view.clear();lab=false;game=new Game({mode,onEvent:handleEvent});selectedTowerId=null;selectedType='bolt';action=null;try{localStorage.removeItem(SAVE_KEY);}catch{}renderArmory();renderInspector();closeModal();openHeroes();updateUI();}
function enableLab(){if(!lab){save();lab=true;toast('Test lab active. Campaign saving is off.');}}
function openLab(){openModal(`${modalHeader('BALANCE, BREAK, REPEAT','Test lab')}<p class="modal-intro">Test actions do not overwrite your campaign. Reload the page to return to your last campaign checkpoint.</p><div class="lab-grid"><section><h3>Economy</h3><p>Add funds to compare towers and upgrades.</p><button class="secondary-button" id="lab-coins">${icon('coin')} Add 1,000 coins</button></section><section><h3>Enemy test</h3><select id="lab-enemy" aria-label="Enemy type">${ENEMIES.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select><button class="secondary-button" id="lab-spawn">Spawn 10 enemies</button></section><section><h3>Wave test</h3><select id="lab-wave" aria-label="Wave number">${WAVES.map((w,i)=>`<option value="${i+1}">${i+1}. ${w.name}</option>`).join('')}</select><button class="secondary-button" id="lab-jump">Load wave plan</button></section><section><h3>Balance report</h3><p>Wave times, leaks, gold, damage, kills, and tower results.</p><button class="secondary-button" id="lab-export">${icon('download')} Export JSON report</button></section></div><div class="lab-footer"><span>${game.metrics.length} wave records · ${game.stats.kills} kills</span><button class="primary-button" id="lab-return">Return to map ${icon('arrow')}</button></div>`,'lab-modal');$('#lab-coins').onclick=()=>{enableLab();game.gold+=1000;toast('+1,000 test coins.','success');updateUI();};$('#lab-spawn').onclick=()=>{if(!game.hero){toast('Choose a hero first.','error');return;}enableLab();const type=$('#lab-enemy').value;game.lives=SETTINGS.startingLives;game.cooldowns={meteor:0,freeze:0,hero:0};game.phase='wave';game.wave=Math.max(1,game.wave);game.paused=false;game.enemies=[];game.projectiles=[];game.pendingSpawns=[];game.queue=Array.from({length:10},(_,i)=>({at:i*.65,type}));game.waveTime=0;game.waveTotal=10;game.spawned=0;game.waveLeaks=0;game.waveStartStats={...game.stats};view.clear();closeModal();toast(`Test group: 10 ${ENEMY_BY_ID[type].name}.`);};$('#lab-jump').onclick=()=>{enableLab();game.enemies=[];game.projectiles=[];game.pendingSpawns=[];game.queue=[];game.lives=SETTINGS.startingLives;game.cooldowns={meteor:0,freeze:0,hero:0};game.phase='build';game.wave=Number($('#lab-wave').value)-1;game.paused=false;game.auto=false;view.clear();closeModal();toast(`Wave ${game.wave+1} is ready. Press Start wave.`);updateUI();};$('#lab-export').onclick=()=>downloadJSON({version:VERSION,mode:game.mode,testLab:lab,seed:game.seed,renderer:engineStatus,stats:game.stats,waves:game.metrics,towers:game.towers.map(t=>({type:t.type,level:t.level,x:t.x,z:t.z,kills:t.kills,damage:Math.round(t.damage),spent:t.paid})),hero:game.hero?{id:game.hero.id,level:game.hero.level,kills:game.hero.kills,damage:Math.round(game.hero.damage)}:null},'voxel-guard-balance-report.json');$('#lab-return').onclick=closeModal;}
function downloadJSON(data,name){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function openResult(won){openModal(`${modalHeader(won?'MOSSVALE STANDS':'THE VALLEY WILL REMEMBER',won?'You held the line.':'A lesson. Not the end.')}<div class="result-art">${icon(won?'shield':'flag')}</div><p class="result-description">${won?'All 20 waves are clear. Your guardian and towers kept the valley safe.':'The keep lost its last health point. Change your tower mix, cover the counters, and try again.'}</p><div class="result-stats"><div><span>WAVES</span><strong>${game.wave} / 20</strong></div><div><span>ENEMIES DOWN</span><strong>${game.stats.kills}</strong></div><div><span>HEALTH LEFT</span><strong>${game.lives}</strong></div></div><div class="result-actions"><button class="secondary-button" id="result-report">${icon('flask')} Test report</button><button class="primary-button" id="result-new">New defense ${icon('arrow')}</button></div>`,'result-modal');$('#result-new').onclick=()=>newGame(game.mode);$('#result-report').onclick=openLab;}

$('#world').addEventListener('pointermove',e=>{hoverPoint=view.groundPoint(e.clientX,e.clientY);if(action)updatePlacement();});
$('#world').addEventListener('pointerleave',()=>{hoverPoint=null;if(action){view.ghost=null;view.range=null;}});
$('#world').addEventListener('click',e=>{if(modalOpen||displayBlocked())return;audio.unlock();const p=view.groundPoint(e.clientX,e.clientY);hoverPoint=p;if(action?.kind==='build'){const result=game.placeTower(action.type,p.x,p.z);if(result.ok){selectedTowerId=result.tower.id;audio.tone(620,.08);toast(`${TOWER_BY_ID[result.tower.type].name} placed.`,'success');if(!e.shiftKey)cancelAction();else updatePlacement();save();renderInspector();}else toast(result.reason,'error');}
  else if(action?.kind==='ability'){const result=game.useAbility(action.ability,p);if(result.ok){audio.tone(180,.3,.05);toast('Ability deployed.','success');cancelAction();}else toast(result.reason,'error');}
  else if(action?.kind==='move'){if(game.moveHero(p.x,p.z)){cancelAction();toast('Guardian moving.');}else toast('Choose a clear point inside the map.','error');}
  else{const t=view.pickTower(e.clientX,e.clientY);selectedTowerId=t?.id??null;if(t){selectedType=t.type;view.range={x:t.x,z:t.z,radius:game.towerStats(t).range};renderArmory();}else view.range=null;renderInspector();}updateUI();});
$('#world').addEventListener('contextmenu',e=>{e.preventDefault();if(modalOpen||displayBlocked())return;if(action)cancelAction();else{const p=view.groundPoint(e.clientX,e.clientY);if(!game.moveHero(p.x,p.z))toast('Choose a clear point for your guardian.','error');}});
$('#world').addEventListener('wheel',e=>{e.preventDefault();view.camera(e.deltaY<0?'in':'out');updatePlacement();updateUI();},{passive:false});
$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('[data-filter]').forEach(c=>{c.classList.toggle('active',c===b);c.setAttribute('aria-selected',String(c===b));});renderArmory();});
$$('[data-ability]').forEach(b=>b.onclick=()=>requestAbility(b.dataset.ability));
$('#hero-portrait').onclick=()=>{if(!game.hero){openHeroes();return;}action={kind:'move'};updatePlacement();};$('#hero-change').onclick=()=>{if(game.wave===0)openHeroes();else{action={kind:'move'};updatePlacement();}};
$('#display-button').onclick=openDisplay;$('#render-status').onclick=openDisplay;$('#guide-button').onclick=()=>openGuide();$('#armory-help').onclick=()=>openGuide('weapons');$('#wave-preview').onclick=()=>openGuide();$('#sound-button').onclick=()=>audio.toggle();$('#settings-button').onclick=openSettings;$('#start-button').onclick=startWave;$('#pause-button').onclick=togglePause;$('#speed-button').onclick=cycleSpeed;$('#auto-button').onclick=()=>{game.auto=!game.auto;game.autoTimer=4;updateUI();};$('#zoom-in').onclick=()=>view.camera('in');$('#zoom-out').onclick=()=>view.camera('out');$('#rotate-camera').onclick=()=>view.camera('rotate');$('#reset-camera').onclick=()=>view.camera('reset');$('.brand').onclick=e=>{e.preventDefault();openSettings();};
$('#modal-layer').addEventListener('click',e=>{if(e.target.id==='modal-layer')closeModal();});
document.addEventListener('keydown',e=>{if(displayBlocked())return;if(e.code==='Escape'){if(modalOpen)closeModal();else cancelAction();return;}if(modalOpen){if(e.code==='Tab'){const els=[...$('#modal').querySelectorAll('button:not([disabled]),select,input,[tabindex="0"]')];if(els.length){if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus();}}}return;}if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.code==='Space'){e.preventDefault();if(game.paused)togglePause();else if(game.phase==='build')startWave();else togglePause();}else if(e.code==='KeyQ')requestAbility('meteor');else if(e.code==='KeyW')requestAbility('freeze');else if(e.code==='KeyE')requestAbility('hero');else if(e.code==='KeyH'){if(game.hero){action={kind:'move'};updatePlacement();}else openHeroes();}else if(e.code==='KeyF')cycleSpeed();else if(e.code==='KeyM')audio.toggle();else if(e.code==='KeyI')openGuide();else if(e.code==='F2'){e.preventDefault();openLab();}else{const i=['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal'].indexOf(e.code);if(i>=0)selectBuild(TOWERS[i].id);}});
window.addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();lastTime=0;accumulator=0;}});
renderArmory();renderInspector();updateSound();updateUI();
window.addEventListener('voxel-enter',()=>{if(!game.hero)openHeroes();else if(resumed)toast(`Checkpoint restored. ${game.wave} waves clear.`,'success');updateUI();});
function frame(now){
  // Schedule first. A failed render must not stop all future frames.
  requestAnimationFrame(frame);
  if(!lastTime)lastTime=now;const dt=Math.min((now-lastTime)/1000,.08);lastTime=now;
  try{if(!document.hidden&&!modalOpen&&!game.paused&&!displayBlocked()){accumulator+=dt*game.speed;let steps=0;while(accumulator>=SETTINGS.step&&steps<16){game.update(SETTINGS.step);view.update(SETTINGS.step);accumulator-=SETTINGS.step;steps++;}}else accumulator=0;}
  catch(error){game.paused=true;view.diagnostics.error('Game update stopped',error);view.diagnostics.show();}
  view.render(now);if(now-lastUI>100){updateUI();lastUI=now;}
}
requestAnimationFrame(frame);
// Intentionally exposed read access for automated UI tests and local balance work.
window.voxelGuard={get game(){return game;},get view(){return view;},get status(){return engineStatus;},get action(){return action;},get modalOpen(){return modalOpen;},save,runDisplayTests:()=>view.runTests(),get displayReport(){return view.diagnostics.snapshot();},version:VERSION};

return {};
})();
</script>
