      if (app.state === "paused" && input.pressed.options && app.menu.def && app.menu.def.onBack && !input.back) app.resume();
      g.update(dt, controls);
      break;
    case "results":
      app.menu.update();
      backdropResults(dt);
      break;
    case "attract": {
      app.attractT += dt;
      if (input.hadActivity && app.attractT > 0.6) {
        app.stopAttract();
        break;
      }
      g.update(dt, (gm) => app.ai.ctl(gm));
      if (app.attractT > 42) {
        app.state = "loading";
        app.attractT = 0;
        $2("attractTag").classList.add("hidden");
        app.startAttractNext();
      }
      break;
    }
    default:
      break;
  }
}
app.startAttractNext = async function() {
  app.state = "menu";
  await app.startAttract();
};
function backdropResults(dt) {
  app.game.update(dt, controls);
}
boot().catch((e) => {
  console.error("boot failed", e && e.stack || e);
  window.__bootError = String(e && e.stack || e);
});

</script>
</body>
</html>
