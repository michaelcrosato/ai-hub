<!doctype html><html lang="en"><meta charset="utf-8"><title>Five-Finger Drive · Browser QA</title><style>body{margin:0;background:#152c35;color:#e9dfbf;font:16px system-ui}header{padding:10px;display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;padding:8px}iframe{width:100%;height:76vh;border:0}pre{white-space:pre-wrap;margin:10px;font:13px monospace}details{margin:10px}</style><header><button id="suite">Run browser contracts</button><button id="soak">Start 30-minute soak</button><button id="stop">Stop soak</button><button id="bench">Benchmark 1080p</button><button id="filmstrip">Animation filmstrip</button><button id="audio">Audio check</button><button id="mobile">Kiosk layout check</button><button id="manual">Manual play</button><button id="export">Export replay</button><button id="mission">Run full mission</button><button id="city">City fixture</button><button id="records">Records fixture</button><button id="gantry">Gantry fixture</button><span id="status">Loading engine…</span></header><iframe id="game" src="../index.html" allow="autoplay; gamepad; fullscreen"></iframe><details open><summary>Live diagnostics</summary><pre id="diagnostics"></pre></details><pre id="results"></pre><script>
const frame=document.querySelector('#game'),status=document.querySelector('#status'),results=document.querySelector('#results'),diagnostics=document.querySelector('#diagnostics');let samples=[],soakSim=0,soakStart=0,errors=[],lastTime=performance.now(),soakInterrupted=false,report={};
function api(){return frame.contentWindow.Drive?.app;}
function log(label,passed,detail){const line=(passed?'PASS ':'FAIL ')+label+(detail?' — '+detail:'');results.textContent+=line+'\n';console.log('SD-QA '+line);}
for(const b of document.querySelectorAll('header button'))b.disabled=true;
frame.onload=()=>{for(const b of document.querySelectorAll('header button'))b.disabled=false;status.textContent='Ready';frame.contentWindow.addEventListener('error',e=>errors.push(e.message));};
setInterval(()=>{const app=api();if(!app)return;const s=app.snapshot();diagnostics.textContent=JSON.stringify({mode:s.mode,idle:s.idle,guard:s.guard,scene:app.game.sceneName,paused:app.game.paused,focus:app.physical.focused,visible:app.physical.visible,stats:app.game.stats,screen:[app.game.screen.W,app.game.screen.H],fps:app.game.fps,physicalKeys:[...app.physical.keys],engineKeys:[...app.game.input.held],interaction:app.session.interaction,mission:s.session,errors:s.errors},null,1);if(soakStart){const elapsed=(performance.now()-soakStart)/1000;status.textContent='SOAK '+Math.floor(elapsed)+' / 1800 seconds';samples.push({elapsed,update:app.game.stats.updateMs,render:app.game.stats.renderMs,actors:app.session.actors.length,cars:app.session.cars.length,cycles:app.demoCycles,heap:frame.contentWindow.performance.memory?.usedJSHeapSize,sim:app.game.time,fps:app.game.fps,visible:!frame.contentDocument.hidden,focused:frame.contentDocument.hasFocus()});if(elapsed>900&&!soakInterrupted){soakInterrupted=true;frame.contentWindow.dispatchEvent(new KeyboardEvent('keydown',{code:'F9',bubbles:true}));frame.contentWindow.dispatchEvent(new KeyboardEvent('keyup',{code:'F9',bubbles:true}));}if(elapsed>=1800)finish();}},1000);
function finish(){const app=api(),sorted=samples.map(x=>x.update+x.render).sort((a,b)=>a-b);report={elapsed:(performance.now()-soakStart)/1000,browser:navigator.userAgent,viewport:[frame.clientWidth,frame.clientHeight],samples:samples.length,p95:sorted[Math.floor(sorted.length*.95)],cycles:app.demoCycles,recoveries:app.demoRecoveries,errors:app.game.errors,peakActors:Math.max(...samples.map(x=>x.actors)),peakCars:Math.max(...samples.map(x=>x.cars)),interrupted:soakInterrupted,simulatedSeconds:app.game.time-soakSim,visibleSamples:samples.filter(x=>x.visible).length,focusedSamples:samples.filter(x=>x.focused).length,medianFps:samples.map(x=>x.fps).sort((a,b)=>a-b)[Math.floor(samples.length/2)],heapSamples:samples.filter((x,i)=>i%60===0).map(x=>({elapsed:x.elapsed,heap:x.heap}))};soakStart=0;results.textContent+=JSON.stringify(report,null,2)+'\n';status.textContent='Soak report ready';console.log('SD-SOAK '+JSON.stringify(report));}
document.querySelector('#soak').onclick=()=>{const a=api();a.game.start();a.start({demo:true});a.physical.focused=true;samples=[];soakStart=performance.now();soakSim=a.game.time;soakInterrupted=false;frame.focus();};document.querySelector('#stop').onclick=()=>{if(soakStart)finish();};

document.querySelector('#filmstrip').onclick=()=>{
 const app=api(),g=app.game,G=frame.contentWindow.Drive;g.stop();
 const kinds=['Walk / aim','Reload','Revive','Gantry jump','Seat entry','Drive / steer','Down / recover','Victory'];
 const cv=document.createElement('canvas');cv.id='filmstrip-result';cv.width=960;cv.height=kinds.length*200;cv.style.cssText='display:block;max-width:100%;image-rendering:pixelated;margin:auto';const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle='#132d36';ctx.fillRect(0,0,cv.width,cv.height);
 const hud=G.drawHUD;G.drawHUD=()=>{};
 try{for(const [row,kind]of kinds.entries()){
  app.start({free:true});const s=app.session;s.dialogue=null;let actor=s.controlled;Object.assign(actor,{x:550,y:440});for(const other of s.actors)if(other!==actor){other.task='hold';if(other.team!=='crew')other.enabled=false;}
  if(row===1)actor.ammo[actor.weapon]=0;
  if(row===2)Object.assign(s.crew[1],{x:actor.x+12,y:actor.y,hp:0,down:45});
  if(row===3){s.switchTo('teo');actor=s.controlled;s.portal(actor,'gantry',{x:680,z:128});}
  if(row===4||row===5){const car=s.cars[0];Object.assign(car,{x:600,y:440});Object.assign(actor,{x:580,y:465});s.spatial.rebuild([...s.cars,...s.actors]);if(row===5){G.enterCar(s,actor,car);car.speed=80;}}
  if(row===6)actor.down=10;
  if(row===7)s.outcome='success';g.advance(1/120);ctx.fillStyle='#f2dab0';ctx.font='16px system-ui';ctx.fillText(kind,8,row*200+18);
  for(let col=0;col<4;col++){
   for(let n=0;n<(row===4?11:22);n++){const act=G.emptyAction('fixture');if(row===0){act.move=[1,0];act.aim=[1,0];}if(row===1&&col===0&&n===0)act.pressed.reload=true;if(row===2||row===4)act.held.interact=true;if(row===3){act.move=[1,0];act.held.jump=true;if(col===0&&n===0)act.pressed.jump=true;}if(row===5){act.throttle=1;act.steer=.7;act.held.jump=col>1;}if(row===6){if(col===2)actor.down=0;G.animateActor(s,actor,1/120);}app.testAction=act;g.advance(1/120);}
   const p=g.view.p(actor.x,actor.y,actor.z);g.cam.x=p[0]-g.screen.W/2;g.cam.y=p[1]-g.screen.H/2;g.cam.snap=false;g.advance(0,{draw:true});const [x,y]=g.r.w(actor.x,actor.y,actor.z);ctx.drawImage(g.screen.buf,Math.round(x-60),Math.round(y-65),120,90,col*240,row*200+20,240,180);
  }
 }}finally{G.drawHUD=hud;}
 frame.style.display='none';diagnostics.parentElement.style.display='none';document.querySelector('#filmstrip-result')?.remove();frame.before(cv);status.textContent='Animation filmstrip ready / 0.183-second intervals (seat: 0.092) / eight actions';
};
document.querySelector('header').addEventListener('click',e=>{if(e.target.id!=='filmstrip'){frame.style.display='block';diagnostics.parentElement.style.display='block';document.querySelector('#filmstrip-result')?.remove();}},true);
document.querySelector('#audio').onclick=async()=>{const a=api(),audio=a.game.audio;a.game.stop();a.unlockAudio();audio.sfx('sd-door');await new Promise(r=>setTimeout(r,250));log('Audio context after user gesture',audio.ctx?.state==='running',audio.failed||audio.ctx?.state);audio.mute(true);const voices=audio._voiceEnds?.length||0;audio.sfx('sd-shot');log('Mute suppresses new effects',(audio._voiceEnds?.length||0)===voices);audio.mute(false);audio.duck(true);log('Dialogue duck is applied',audio.ducked===true);audio.duck(false);audio.stopMusic();log('Music reset releases scheduler',!audio.song&&!audio._timer);a.musicState=null;a.title();a.game.start();status.textContent='Audio lifecycle checked';};
document.querySelector('#mobile').onclick=()=>{const a=api(),old=a.mobile;a.game.stop();a.mobile=true;frame.contentDocument.body.classList.add('mobile-demo');a.title();a.game.advance(1/120,{draw:true});log('Kiosk title has one Settings action',frame.contentDocument.querySelectorAll('.esh-ttl .esh-btns button').length===1);log('Kiosk gameplay controls disabled',a.game.input.touchEnabled===false);a.mobile=old;frame.contentDocument.body.classList.toggle('mobile-demo',old);a.title();a.game.start();status.textContent='Kiosk layout checked';};
document.querySelector('#manual').onclick=()=>{const a=api();a.game.start();a.start();frame.contentWindow.focus();};
document.querySelector('#export').onclick=()=>{const replay=api().game.debug.replay(),link=document.createElement('a');link.download='five-finger-drive-replay.json';link.href=URL.createObjectURL(new Blob([JSON.stringify(replay)],{type:'application/json'}));link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);};
for(const zone of ['city','records','gantry'])document.querySelector('#'+zone).onclick=()=>{const a=api();a.game.stop();a.start();const s=a.session;s.dialogue=null;s.progress=zone==='records'?8:zone==='gantry'?7:1;s.flags.gate=true;s.flags.relay=zone==='records';s.applyGates();if(zone!=='city'){s.switchTo('teo');s.portal(s.controlled,zone,zone==='records'?{x:320,y:160}:{x:664,z:128});}else Object.assign(s.controlled,{x:550,y:440});a.zoneChanged();a.game.advance(1/120,{draw:true});status.textContent=zone+' visual fixture / simulation stopped';};
document.querySelector('#bench').onclick=async()=>{const a=api(),g=a.game;status.textContent='Benchmark running';g.stop();frame.style.width='1920px';frame.style.height='1080px';frame.contentWindow.dispatchEvent(new Event('resize'));await new Promise(r=>setTimeout(r,100));a.start({demo:true});const costs=[],updates=[],draws=[],cold=[],profiles=[],undo=[];let bucket={};const measure=(o,k,name)=>{const original=o[k];o[k]=function(...args){const t=performance.now();try{return original.apply(this,args);}finally{bucket[name]=(bucket[name]||0)+performance.now()-t;}};undo.push(()=>o[k]=original);};measure(g.r,'shape','shapeQueue');measure(g.r,'_flush','depthFlush');measure(g.screen,'_present','present');measure(a.session.maps.city,'drawFloor','floor');measure(a.session.maps.city,'queueWalls','walls');for(const actor of a.session.actors)measure(actor.rig,'draw','rigDraw');for(let i=0;i<300;i++){bucket={};const t=performance.now();g.advance(1/60);const u=performance.now();g.advance(0,{draw:true});const e=performance.now();if(i<120)cold.push(e-t);else{costs.push(e-t);updates.push(u-t);draws.push(e-u);profiles.push(bucket);}if(i%30===0)await new Promise(r=>setTimeout(r,0));}for(const restore of undo)restore();const profile=Object.fromEntries(['shapeQueue','depthFlush','present','floor','walls','rigDraw'].map(k=>{const values=profiles.map(p=>p[k]||0).sort((a,b)=>a-b);return[k,{p50:values[90],p95:values[171]}];}));for(const list of [costs,updates,draws])list.sort((a,b)=>a-b);const b={name:'1080p CPU benchmark: 120 warm-up + 180 sampled frames',browser:navigator.userAgent,viewport:[frame.clientWidth,frame.clientHeight],logical:[g.screen.W,g.screen.H],p50:costs[90],p95:costs[171],simulationP95:updates[171],drawP95:draws[171],coldMax:Math.max(...cold),profile,max:costs[179],errors:g.errors};results.textContent+=JSON.stringify(b,null,2)+'\n';frame.style.width='100%';frame.style.height='76vh';frame.contentWindow.dispatchEvent(new Event('resize'));a.title();g.start();status.textContent='Benchmark complete';};
document.querySelector('#mission').onclick=async()=>{const a=api(),g=a.game;g.stop();a.start({demo:true,seed:552});a.session.approach='quiet';a.session.route='canal';const s=a.session,views=new Set();let n=0;while(!s.outcome&&a.session===s&&n++<1200){g.advance(.25,{draw:true});views.add(s.controlled.zone);if(n%10===0){status.textContent='Mission '+s.stage?.id+' / '+Math.floor(s.time)+'s';await new Promise(r=>setTimeout(r,0));}}results.textContent+=JSON.stringify({name:'Browser full mission',seed:s.seed,outcome:s.outcome,time:s.time,views:[...views],trace:s.trace,errors:g.errors},null,2)+'\n';g.start();status.textContent='Mission check complete';};
document.querySelector('#suite').onclick=async()=>{
 const a=api(),g=a.game,G=frame.contentWindow.Drive;g.stop();results.textContent='';a.physical.focused=true;a.physical.visible=true;
 const step=(seconds,options)=>{frame.contentWindow.focus();a.physical.focused=true;a.physical.visible=true;g.advance(seconds,options);};
 try{
  a.title();step(1/120,{draw:true});a.idle=0;step(9.9);log('Title stays at 9.9 seconds',a.mode==='title');step(.1);log('Attract starts at 10.0 seconds',a.mode==='demo');
  const before=a.session.metrics.botActions;a.physical.inject({device:'keyboard',active:false});step(1/120);log('Physical input interrupts before bot action',a.mode==='title'&&a.guard);step(1/60);log('Neutral release clears guard',!a.guard);
  a.title();step(1/120,{draw:true});a.game.menu('settings');step(10);log('Title settings also enter attract',a.mode==='demo');
  const store=JSON.stringify(Object.fromEntries(Object.keys(frame.contentWindow.localStorage).map(k=>[k,frame.contentWindow.localStorage.getItem(k)])));step(1);log('Demo writes no persistent state',store===JSON.stringify(Object.fromEntries(Object.keys(frame.contentWindow.localStorage).map(k=>[k,frame.contentWindow.localStorage.getItem(k)]))));
  for(const device of ['keyboard','mouse','touch','gamepad']){a.start({demo:true});step(1/120,{draw:true});a.physical.inject({device,active:true});step(1/120);log(device+' interrupts attract',a.mode==='title');a.physical.inject({device,active:false});step(1/30);}
  a.start();step(1/120,{draw:true});g.pause();step(11);log('Gameplay pause does not enter attract',a.mode==='play');g.resume();
  for(const [zone,anchor]of [['records',{x:80,y:320}],['gantry',{x:48,z:16}],['city',{x:350,y:380}]]){a.session.portal(a.session.controlled,zone,anchor);step(.05,{draw:true});log(zone+' draws without engine errors',g.errors.length===0);}
  log('Canvas covers viewport',document.querySelector('#game').contentDocument.querySelector('canvas').width>=frame.clientWidth-2);
  a.settingsMenu();log('Settings category menu has at most six actions',frame.contentDocument.querySelectorAll('.esh-btns button').length<=6);a.settingPage('Sound',['sound','volume','music','effects','sdDemoAudio']);log('Sound page has five controls and Back',frame.contentDocument.querySelectorAll('.esh-row').length===5&&frame.contentDocument.querySelectorAll('.esh-btns button').length===1);a.bindingPage('pad',1);log('Controller bindings are paginated',frame.contentDocument.querySelectorAll('.esh-btns button').length<=6);
  log('All local scripts loaded',!!G.Director&&!!G.content.missions.spare&&g.errors.length===0);
  log('No browser script errors',errors.length===0,errors.join('; '));
 }catch(e){log('Browser contracts',false,e.stack);}finally{a.title();step(1/120,{draw:true});g.start();status.textContent='Contracts complete';}
};
</script></html>
