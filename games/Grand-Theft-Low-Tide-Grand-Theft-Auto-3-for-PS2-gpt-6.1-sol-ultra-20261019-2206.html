}

	font-size: 12px;
}
.lt-notifications {
	position: absolute;
	top: 45%;
	right: 33px;
	width: min(370px, 35vw);
	display: flex;
	flex-direction: column;
	align-items: stretch;
	gap: 9px;
	pointer-events: none;

	display: flex;
	align-items: center;
	gap: 13px;
	padding: 15px 18px;
	background: #102d2af5;
	box-shadow: 0 4px 20px #03151560;
	border-left: 3px solid var(--lt-lime);
	font-size: 14px;
	font-weight: 700;
	line-height: 1.45;
	animation: lt-slide-in 0.2s ease-out;
	transition:
		opacity 0.2s,
		transform 0.2s;
}

	color: var(--lt-lime);
	font-size: 24px;
	line-height: 1;
	min-width: 20px;
	text-align: center;

.lt-notification-error {
	border-color: var(--lt-orange);

	color: var(--lt-orange);
}

	opacity: 0;
	transform: translateX(15px);
}
.lt-touch {
	position: absolute;
	inset: 0;
	z-index: 30;
	background: #0b2425f5;
	pointer-events: auto;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	text-align: center;
	padding: 30px;
}
.lt-touch strong {
	font-family: var(--lt-display);
	font-size: clamp(37px, 7vw, 74px);
	line-height: 1.06;
	margin: 22px 0;
	color: var(--lt-cream);
}
.lt-touch > p {
	font-size: 17px;
	line-height: 1.6;
	color: var(--lt-muted);
}
.lt-touch button {
	background: var(--lt-lime);
	color: var(--lt-ink);
	border: 0;
	min-width: 260px;
	font-size: 16px;
	letter-spacing: 1px;
	font-weight: 900;
	padding: 20px 24px;
	margin-top: 30px;
	display: flex;
	justify-content: space-between;
	gap: 25px;
}
.lt-touch-only .lt-screen-settings {
	z-index: 31;
}
.lt-reduced-motion * {
	animation: none !important;
	transition: none !important;
	scroll-behavior: auto !important;
}
@keyframes lt-slide-in {
	from {
		opacity: 0;
		transform: translateX(18px);
	}
	to {
		opacity: 1;
		transform: translateX(0);
	}
}
@keyframes lt-pulse {
	0%,
	100% {
		opacity: 1;
	}
	50% {
		opacity: 0.35;
	}
}

## Mental model
- The world is 3D: x east, y south, z up; one tile = 16 units. Game logic uses world units and dt, never pixels.
- A view projects the world to the screen. 'iso' (Diablo), 'threequarter' (Zelda), 'topdown', 'brawler' (Final
  Fight), 'side' (Mario: x right, z up, y = 0), 'overhead' (shmups, puzzles: world x/y = screen pixels once you call
  game.focus(W / 2, H / 2)). The same game runs in every view. In ground views, turn the stick or keys into a world
  direction with game.view.screenDirToGround(mx, my).
- update(dt) runs in exact fixed steps: 1/120 s of real time each, dt = 1/120 * timeScale, the same steps at any
  refresh rate. Read input only there.
- Tests: new E.Game({ headless: true }) (the default in Node) has no screen; game.advance(seconds) runs fixed steps at
  once, game.input.tap('jump') / hold('right', on) script input, game.debug = { snapshot() {...} } is the game's handle.
- draw(r) order: backgrounds first (r.sky, map.drawFloor + map.queueWalls, level.draw), then everything that can
  overlap through r.actor / r.sprite / r.queue (depth sorted), then the HUD through r.text / r.overlay (screen pixels).
- Characters are procedural rigs posed every step (E.Humanoid, E.Blob) or string sprites (E.sprite).
- Draw only with E.px, E.font, E.ui and r.*: they snap to whole pixels. ctx.arc / stroke / fillText and canvas
  gradients blur the pixel look.
- Errors show in a red box on screen and in the console; warnings start with "my-3D2dge:". Fix the first one first.

  },
  update(dt) {
    const inp = game.input, m = inp.move(), d = game.view.screenDirToGround(m[0], m[1]);   // screen push -> ground direction
    hero.vx = d[0] * 85; hero.vy = d[1] * 85; hero.update(dt, map);
    if (Math.hypot(d[0], d[1]) > .1) hero.facing = Math.atan2(d[1], d[0]);
    if (inp.buffered('attack') && sword.start()) { inp.consume('attack'); game.audio.sfx('swing'); }
    sword.update(dt);
    sword.hits(slimes, s => E.inArc(hero, hero.facing, s.body, 24, 1.3), s => {
      s.hp--; s.hit = .15; E.knockback(hero, s.body, 200, 80);
      game.hitFx(s.body.x, s.body.y, 8, { damage: 1, angle: hero.facing });
    });
    flow.update(hero.x, hero.y); hero.hurt -= dt;
    for (const s of slimes) {
      const dir = flow.dir(s.body.x, s.body.y, hero.x, hero.y);
      s.body.vx = E.approach(s.body.vx, dir[0] * 30, 300 * dt); s.body.vy = E.approach(s.body.vy, dir[1] * 30, 300 * dt);
      s.body.update(dt, map); s.hit -= dt;
      s.rig.update(dt, { look: dir, squash: Math.sin(game.time * 9 + s.body.x) * .15 });
      if (E.overlap(hero, s.body) && hero.hurt <= 0) { hp--; hero.hurt = 1; E.knockback(s.body, hero, 220); game.audio.sfx('hurt'); game.shake(3); }
      if (s.hp <= 0) game.particles.explosion(s.body.x, s.body.y, 6, .7);
    }
    E.prune(slimes, s => s.hp <= 0);
    rig.update(dt, { x: hero.x, y: hero.y, z: hero.z, vx: hero.vx, vy: hero.vy, facing: hero.facing, attack: sword.state, hurt: hero.hurt > .7 });
    if (hp <= 0) game.go('end', 'GAME OVER'); else if (!slimes.length) game.go('end', 'YOU WIN');
  },
  draw(r) {
    map.drawFloor(r); map.queueWalls(r);                                   // background first, then depth-sorted things
    r.shadow(hero.x, hero.y, 6);
    r.actor(hero.x, hero.y, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view), { alpha: hero.hurt > 0 ? .6 : 1 });
    for (const s of slimes) {
      r.shadow(s.body.x, s.body.y, 6);
      r.actor(s.body.x, s.body.y, s.body.z, (g, ox, oy) => s.rig.draw(g, ox, oy, r.view), { flash: s.hit > 0 && '#ffffff' });
    }
    r.overlay(g => E.ui.hearts(g, 6, 6, hp, 3));                        // HUD in screen pixels
  }
};
const end = {
  enter(text) { msg = text; game.audio.music(null); game.audio.sfx(text === 'YOU WIN' ? 'powerup' : 'die'); },
  update() { if (game.input.pressed('start')) game.go('title'); },
  draw(r) { r.sky(['#000000', '#301830']); r.text(msg, r.W / 2, 100, '#ffe08a', { align: 'center', scale: 2 }); }
};
game.start({ scene: 'title', scenes: { title, play, end } });
})();

## API
Game: new E.Game({ canvas: 'screen', res, expand, view, views, input, bg })
  res: 'nes' 256x240 | 'snes' 256x224 | 'genesis' 320x224 | 'gb' 160x144 | 'gba' 240x160 | 'ps1' 320x240 | 'wide' 400x225 | [w, h]
  expand: true fills any window with no bars: res is the least it shows, r.W x r.H grows; anchor the HUD to r.W and r.H
  input: 'DEFAULT' | 'PLATFORMER' | 'SHMUP' | your own { action: ['KeyQ', 'Pad0', 'Mouse0'] }
  start({ update(dt), draw(r) }) or start({ scene: 'title', scenes: { title: {...}, play: {...} } })
  scene: { enter(data), exit(), update(dt), draw(r), pausable, view, views, input, res, expand }; go(name, data, { fade: .22 })
  camera: follow(obj, { z: 16, lead }) once, or focus(x, y, z) every update; cam.bounds = v => map.bounds(v);
    cam.room = [w, h] for screen-by-screen rooms (cam.moving is true while it slides); cam.smooth = .18 (0 = locked)
  juice: hitFx(x, y, z, { power: 1, damage, angle, color, sound }), freeze(s), shake(n), flash(color, s), timeScale = .25
  timers in game time: after(s, fn), every(s, fn) -> { cancel() }, cleared on scene change
  also: setView(id), nextView() (cycles views), note(text, s), mouseGround() -> [x, y] or null
  fields: W, H, time, real, paused, input, audio, particles, view, cam, errors
Input (game.input): down(a) held, pressed(a) this step only, released(a), repeat(a, delay .3, rate .08) for menus,
  buffered(a, window .15) + consume(a) for combat, consumeAll(), anyPressed(), move() -> [x, y] on screen (length <= 1)
  every preset: up down left right (WASD, arrows, d-pad), start (Enter), pause (Esc, P), confirm (Enter, Space, J, Z),
    cancel (Esc, Backspace, X, K); the gamepad d-pad, A, B and Start work too, and its left stick moves
  DEFAULT: attack (J, X, click), dash (Space, Shift, K), skill (L, E, right click), jump (Z)
  PLATFORMER: jump (Space, Z, K), attack (X, J, click), dash (Shift, C, L), skill (E, V)
  SHMUP: fire (Space, Z, J, click), bomb (X, K, right click)
  label('jump') -> its key or button on the device in use, for prompts: 'Space', 'A', '✕'
Standard, with no code: game.settings (saved per game: volume music effects sound motion shake flashes scale deadzone
  glyphs; set(key, v) checks, saves, applies; yours: new E.Game({ menu: { settings: [{ key: 'hints', value: true }] } })),
  game.fullscreen (a phone's first tap, a top-right button; toggle() from a key or click), and a pausable scene pausing
  when the page is hidden or the controller unplugs (pause(reason), resume(), pauseReason). Don't build your own. Leave
  out: fullscreen: 'button' | false, corner: false, autoPause: false. The full engine adds the menu screens.
Boot: start({ ..., boot: { title, steps: [['Raising the harbour', () => build()]], messages: ['Counting the bells'] } }) runs heavy
  setup one step a frame behind a boot screen; an error before play shows a report to screenshot (E.diagnose() any time).
Drawing (r in draw(r); r.W, r.H = screen size in pixels)
  r.sky(['#top', '#mid', '#bottom']); r.starfield({ count: 70, speed: 30, dir: 'down' | 'up' | 'left' | 'right', height: 0..1 })
  r.actor(x, y, z, (g, ox, oy) => rig.draw(g, ox, oy, r.view), { outline: true, flash: '#ffffff', flashMix: .5, alpha, bias })
  r.sprite(x, y, z, spr, { anchor: 'bottom' | 'center' | 'top', flip, flash, outline, alpha })
  r.queue(x, y, z, g => {...}, { bias }) for any depth-sorted drawing; inside it r.box(g, x0, y0, z0, x1, y1, z1, top, side)
  r.shadow(x, y, radius, alpha .5, color, surfaceZ); floor marks: r.decal(() => r.groundDisc(x, y, rad, color, alpha)),
    r.groundRing(x, y, rad, color, alpha), r.groundArc(x, y, r0, r1, a0, a1, color, alpha)
  r.text(str, x, y, color, opts); r.textAt(x, y, z, str, color); r.overlay(g => {...}); r.glowDisc(g, x, y, rad, color, 0..1)
  r.marker(x, y, z, { label, color }): an objective marker, an arrow at the screen's edge when it is off screen
  r.w(x, y, z) -> [px, py] where a world point lands; r.visible(x, y, z); r.view
Pixels (g is a canvas context from r.queue, r.overlay or r.actor): E.px.rect(g, x, y, w, h, c), dot(g, x, y, c),
  line(g, x0, y0, x1, y1, c, width), disc(g, x, y, r, c), ell(g, x, y, rx, ry, c), poly(g, [[x, y], ...], c),
  polyDither(g, pts, c, alpha), ddisc(g, x, y, r, c, alpha), blend(g, alpha, 'add' | 'multiply' | 'screen' | 'normal', () => {...}),
  sprite(g, spr, x, y, flip). Colors are '#rrggbb' or '#rgb'.
Sprites: const COIN = E.sprite(['.yy.', 'yYYy', '.yy.'], { y: '#f0b020', Y: '#fff0a0' }, scale); '.' and ' ' are clear
Text: E.font.text(g, str, x, y, color, { outline: '#0b0814' | false, shadow, gradient: [top, bottom], scale, align, wrap: px })
  -> { w, h }; E.font.title(g, str, x, y, { scale: 3, colors: [top, ..., bottom], depth, align }); E.font.width(str, opts),
  lineHeight(opts), wrap(str, px). A 5x7 font with lower case and ♥ ★ ← → ↑ ↓ • × ♪ ▸ ©
UI (draw inside r.overlay): E.ui.box(g, x, y, w, h, { bg, border, alpha }), E.ui.bar(g, x, y, w, h, 0..1, color),
  E.ui.hearts(g, x, y, hp, max) (halves allowed)
  const talk = new E.Dialog(game); talk.say(['Page one.', 'Page two.'], { name: 'ELDER', choices: ['YES', 'NO'],
    onChoice(i), onDone, place: 'top' | 'bottom', auto: 2.5, modal: false (chatter that plays on) });
    in update: if (talk.update(dt)) return;   in draw: talk.draw(r)
  const menu = new E.Menu(game, ['START', { label: 'LOAD', disabled: true }], { title, x, y, onPick(i, item), onCancel });
    menu.update(); menu.draw(r)
Sound (game.audio; it starts after the first key press): sfx(name, { vol, pitch }) with presets jump jump2 land step coin
  pickup key powerup oneup heal hit hurt stomp bump swing whoosh punch kick shoot laser charge explode boom door secret
  warp die select confirm cancel pause text blip; or sfx({ wave: 'square' | 'pulse' | 'triangle' | 'saw' | 'sine' | 'noise',
  freq: 440 | 'A4', to, dur, vol, arp: [0, 4, 7], step }); define(name, voice)
  music('title' | 'adventure' | 'dungeon' | 'boss' | 'victory') or your own { bpm: 120, steps: 4, tracks: [{ wave: 'square',
  vol: .15, notes: 'C5 - E5 . G5 . | ...' }, { wave: 'drums', notes: 'k . h . s . h .' }] } ('-' holds, '.' rests; drums
  k s h o c t); music(null) stops; mute(); setVolume(0..1)
TileMap (iso, threequarter, topdown and brawler levels):
  new E.TileMap({ rows, legend, types, floorTex }); legend: a number = wall type, a string = spawn tag,
  { tile, floor: 'water', spawn, block: true }; types[id] = { h, top, side, cut: true (drops walls in front of the
  floor), face: 'brick' | 'none', roof: 'speckle' | 'plain' }; floorTex(x, y, floorTag) -> [r, g, b]
  find(tag) / findAll(tag) -> { x, y, cx, cy }; drawFloor(r) and queueWalls(r) in draw; bounds(view);
  set(cx, cy, 0) opens a door; cell(cx, cy), walkable(cx, cy), block(cx, cy, on), toCell(x, y), center(cx, cy),
  heightAt(x, y), floorAt(x, y), los(x0, y0, x1, y1). Walls lower than a body's feet are walkable (jump onto blocks).
  In code: new E.TileMap({ w, h, types }) (open floor), fill(cx, cy, w, h, id), setFloor(cx, cy, tag, block).
  floors: E.tex.grass(x, y, { base, dark, light }), dirt, water, planks, checker(x, y, { a, b, size }), plain(x, y, { base })
  new E.FlowField(map, { climb, drop }): update(tx, ty) every step, dir(x, y, tx, ty) -> [dx, dy] around walls, over roofs
  Heights: z = feet; a cell's top = height(cx, cy); eyes at z + E.HEIGHTS.eye (30) see z + chest (22); same level |dz| <= 8.
  map.sight(a, b), ray(a, b), standable(x, y, z, r), ledge / landing / drop(from, dir), arcClear(a, b, apex);
  E.sameLevel(a, b), E.targets(from, list, { range, arc, dz, sight: map }) nearest first, inArc(..., dz)
  E.sees(guard, hero, { map, range: 120, fov: 1.6 }) -> { seen, exposure } (hero.crouch, hero.exposure 0..1 hide it);
  E.hears(guard, { x, y, z, loud: 80 }, map) -> 1 at the noise .. 0 at loud, halved through a wall
Body (ground physics): new E.Body({ x, y, r: 5, gravity: 700, friction: 0, bounce: 0 }); set vx, vy, then
  update(dt, map); push(ix, iy, iz) knockback; jump(v); reads z, onGround, landed, hitWall, bounced
PlatformMap (side-scrollers, 2.5D in 'brawler'): new E.PlatformMap({ rows, legend, types }); types[id] = { kind:
  'solid' | 'oneway' | 'ladder' | 'slope' (dir: 1 rises right, -1 left) | 'hazard' | 'deco' | 'back', style: 'block' |
  'bonus' | 'brick' | 'ground' | 'plank' | 'spikes' | 'ladder' | 'liquid' | 'plain', side: '#hex', top: '#hex' }
  find(tag) -> { x, z } (z = feet); cell(cx, cz) and set(cx, cz, id) count rows from the BOTTOM; groundBelow(x, z) ->
  surface height, or null over a pit; touching(box, 'hazard'); solidAt(x, z); types[id]; bounds(view); draw(r) right
  after r.sky; move(box, dt, solids) moves enemy boxes { x, z, w, h, vx, vz } (sets onGround, hitWall -1 | 0 | 1,
  hitCeiling, bumped)
Platformer: new E.Platformer({ x, z, w: 8, h: 22, run: 95, jump: 285, gravity: 800, airJumps: 0, wallJump: false, dash: 0 })
  update(dt, level, game.input or { x: -1..1, jump, jumpPressed, up, down, dash }, movingPlatforms); coyote time,
  jump buffering, variable jump height, ladders, down + jump through one-ways. Reads onGround, jumped, landed, facing
  (1 | -1), air, climbing, hitWall, bumped { cx, cz, id }; knock(dir); rigState(extra) feeds rig.update.
  Moving platforms are { x, z, w, h, vx, vz } boxes you move yourself and pass in; riders are carried.
Bullets: const shots = new E.Bullets(game, { plane: 'ground' | 'side' }); shots.fire({ x, y, z, vx, vy, vz, r: 2, team,
  color, life: 3, dmg, pierce, sprite }); burst(base, velocities); update(dt, map) (bullets die on walls);
  hit(targets, (b, t) => {...}, team) -> hits (targets: x, y, r, or x, z, w, h in side); draw(r); clear(team)
  velocities: E.pattern.dir(angle, speed), aim(from, to, speed), aimSide(from, to, speed), spread(angle, n, arc, speed),
  ring(n, speed, offset); on the side plane a velocity is [vx, vz]
Humanoid: new E.Humanoid({ size: 1.3, build: 'chibi' | 'heroic' | 'bulky', weapon: 'sword' | 'gun' | 'staff' | null,
  outfit: 'shirt' | 'tunic' | 'robe' | 'coat', hair: 'short' | 'bald', hat: 'cap' | 'pointed' | 'helmet' | 'crown'
  (or { style, color }), cape: { len: 6 }, hood: true, sleeves: 'short' | 'long' | 'none', eyeGlow: '#ff4030', hunch,
  colors: { skin, hair, cloth, coat, pants, boot, belt, trim, glove, cape, capeIn, metal, hilt } })
  rig.update(dt, { x, y, z, vx, vy, facing, attack, hurt, dash, air, point, aim, climb, vz, pose, stance, run, down })
    facing in radians (side view: 0 right, Math.PI left); air tucks the legs; point holds a gun out, aim tilts it
    (+ = up); pose: 'cheer' | 'cast' | 'guard' | 'kneel' | 'crouch' | 'wave' | 'hips' | 'block' | 'die' | 'down';
    stance: 'guard' (fists up) | 'ready' (weapon forward); run: 0..1 runs in place
  rig.draw(g, ox, oy, r.view) inside r.actor; rig.hand(), rig.tip() -> world points to spawn bullets; rig.kick(v) squash
  rig.worldOffset(rig.J.head) -> [dx, dy, dz] of any joint from the feet (add rig.x, y, z for the world point)
Attack: const slash = new E.Attack('slash' | spec, overrides); if (input.buffered('attack') && slash.start()) input.consume('attack');
  slash.update(dt) -> phase that began ('active' = play the swing sound); slash.hits(targets, t => E.inArc(hero, facing, t,
  22, 1.4), t => {...}) hits each target once per swing; rig.update(dt, { ..., attack: slash.state }); busy, active, cancel()
  new E.Combo(['jab', 'cross', 'uppercut'], { window: .3 }): press() starts or chains; update, hits, state like an Attack
  E.MOVES: slash backslash overhead rising thrust spin plunge twohand | jab cross hook uppercut haymaker elbow |
    kick roundhouse sweep flyingkick knee axekick | cast throw bash claw. Give each character its own moves.

Blob (slimes, bats, imps): new E.Blob({ R: 6.5, colors: { dk, base, lt }, wings, horns, ears: 'rabbit' | 'cat', feet,

  tones(hex) -> { deep, sh, base, lt, hi } hue-shifted shades, ramp(hex, n), shade(hex, -1..1), mix(a, b, t),

## Recipes
Side-scroller (Mario, Mega Man): PlatformMap + Platformer + Humanoid, view 'side'.
```js platformer
(() => {
const E = My3D2dge;
const game = new E.Game({ canvas: 'screen', res: 'snes', view: 'side', views: ['side', 'brawler'], input: 'PLATFORMER' });
const level = new E.PlatformMap({
  rows: ['                                  ',
         '               ?                  ',
         '        ===             ==        ',
         '  @           g     ^^       g  F ',
         '#################  ###############'],
  legend: { '#': 1, '=': 2, '?': 3, '^': 4, '@': 'hero', g: 'walker', F: 'flag' },
  types: { 1: { style: 'ground', side: '#8a5a32' }, 2: { kind: 'oneway' }, 3: { style: 'bonus', side: '#e8a830' }, 4: { kind: 'hazard' } }
});
const start = level.find('hero'), flag = level.find('flag');
const hero = new E.Platformer({ x: start.x, z: start.z });
const rig = new E.Humanoid({ hat: 'cap', weapon: null, colors: { cloth: '#d83a2a', pants: '#3050c0' } });
const foes = level.findAll('walker').map(p => ({ x: p.x, z: p.z, w: 12, h: 12, vx: 0, vz: 0, dir: -1, rig: new E.Blob({ feet: true, colors: { base: '#a06030', dk: '#5a3018', lt: '#d09060' } }) }));
game.cam.bounds = v => level.bounds(v);
game.particles.ground = (x, y, z) => level.groundBelow(x, z);           // sparks and debris land on platforms
game.start({
  update(dt) {
    hero.update(dt, level, game.input);
    if (hero.jumped) game.audio.sfx('jump');
    if (hero.bumped && level.types[hero.bumped.id].style === 'bonus') { level.set(hero.bumped.cx, hero.bumped.cz, 1); game.audio.sfx('coin'); game.particles.glints(hero.x, 0, hero.z + 30, 6); }
    if (level.touching(hero, 'hazard') || hero.z < -40) { Object.assign(hero, { x: start.x, z: start.z, vx: 0, vz: 0 }); game.audio.sfx('hurt'); }
    for (const f of foes) {
      f.vz -= 800 * dt; f.vx = f.dir * 25; level.move(f, dt);
      const ahead = level.groundBelow(f.x + f.dir * 8, f.z);
      if (f.hitWall || ahead === null || ahead < f.z - 4) f.dir = -f.dir;   // turn at walls and ledges
      f.rig.update(dt, { look: [f.dir, 0], walk: 1 });
      if (!f.dead && E.overlapBox(hero, f)) {
        if (hero.vz < 0 && hero.z > f.z + f.h / 2) { f.dead = true; hero.vz = 220; game.audio.sfx('stomp'); game.particles.dust(f.x, 0, f.z, 8); }
        else { hero.knock(hero.x < f.x ? -1 : 1); game.audio.sfx('hurt'); }
      }
    }
    E.prune(foes, f => f.dead);
    if (Math.abs(hero.x - flag.x) < 8) { game.audio.sfx('powerup'); Object.assign(hero, { x: start.x, z: start.z }); }
    rig.update(dt, hero.rigState());
    game.focus(hero.x, 0, hero.z + 24);                                   // side view: y = 0, z is up
  },
  draw(r) {
    r.sky(['#5c94fc', '#a8c8ff']);
    level.draw(r);
    r.queue(flag.x, 0, flag.z, g => { const [x, y] = r.w(flag.x, 0, flag.z); E.px.rect(g, x, y - 40, 2, 40, '#e8e8e8'); E.px.poly(g, [[x + 2, y - 40], [x + 14, y - 35], [x + 2, y - 30]], '#40c040'); });
    for (const f of foes) r.actor(f.x, 0, f.z, (g, ox, oy) => f.rig.draw(g, ox, oy, r.view));
    r.actor(hero.x, 0, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view));
  }
});
})();
```
Shoot-'em-up (1942): view 'overhead', sprites, Bullets, a starfield.
```js shmup
(() => {
const E = My3D2dge, W = 224, H = 256;
const game = new E.Game({ canvas: 'screen', res: [W, H], view: 'overhead', views: ['overhead'], input: 'SHMUP' });
const SHIP = E.sprite(['...w...', '..wbw..', '.wwbww.', 'wwrwrww', 'w..r..w'], { w: '#e8f0ff', b: '#3a7aff', r: '#ff5030' }, 2);
const FOE = E.sprite(['r.....r', '.rrrrr.', 'rryyyrr', '.r.r.r.'], { r: '#d03040', y: '#ffd040' }, 2);
const shots = new E.Bullets(game), ship = { x: W / 2, y: H - 30, r: 4 }, foes = [];
let score = 0, cool = 0, spawn = 0;
game.start({
  update(dt) {
    game.focus(W / 2, H / 2);                                            // overhead: world x/y = screen pixels
    const m = game.input.move();
    ship.x = E.clamp(ship.x + m[0] * 120 * dt, 8, W - 8); ship.y = E.clamp(ship.y + m[1] * 120 * dt, 8, H - 8);
    if ((cool -= dt) <= 0 && game.input.down('fire')) { cool = .12; shots.fire({ x: ship.x, y: ship.y - 10, vy: -300, team: 'player' }); game.audio.sfx('shoot'); }
    if ((spawn -= dt) <= 0) { spawn = .9; foes.push({ x: E.rand(20, W - 20), y: -10, r: 7, hp: 3, t: 0 }); }
    for (const f of foes) {
      f.t += dt; f.y += 40 * dt; f.x += Math.sin(f.t * 3) * 40 * dt;
      if (E.chance(dt * .6)) shots.burst({ x: f.x, y: f.y, team: 'foe', color: '#ff6080' }, [E.pattern.aim(f, ship, 90)]);
    }
    shots.update(dt);

## Rules
1. World units and dt everywhere. Feel numbers (units per second, tile = 16): walk 70-90, run 95-140, jump 250-320
   with gravity 800, dash 200-260, player bullets 250-320, enemy bullets 70-120, enemies 25-45.
2. At 320x240, heroes are 40-60 px tall (Humanoid size 1.2-1.4), bosses size 1.8-2.4; hitboxes smaller than the art.
3. Every hit gets game.hitFx; deaths get particles.explosion; sounds on jump, hit, pickup and death; music per scene.
4. A title scene, play scenes with pausable: true, and a game-over or win path back to the title.
5. Dress every character (outfit, hat, colors) and give each its own moves; enemies wind up slower than the hero.
6. Nothing on screen? The camera looks elsewhere: game.follow(hero) or game.focus(...) every update (side: y = 0).

					for (let i = 0; i < 4; i++)

							[q[0] + 12, q[1] + Math.sin(time * 3) * 2],
							[q[0] + 10, q[1] + 6],
							[q[0], q[1] + 5],

					);

				} else if (kind === "tank") {
					box(-9, -9, 0, 9, 9, 24, "#8a9592", "#546b70");
					for (let z = 4; z < 24; z += 7)

				} else if (kind === "crane") {

					for (const d of [-4, 4])

					for (let z = 8; z < 53; z += 8) {

					}
					line(g, r, x - 15, y, 53, x + 50, y, 53, p.color, 3);
					line(g, r, x - 15, y, 53, x, y, 59, p.color);
					line(g, r, x, y, 59, x + 50, y, 53, p.color);
					line(
						g,
						r,
						x + 44,
						y,
						53,
						x + 44,
						y,

				} else if (kind === "boat") {
					const z = 2 + Math.sin(time * 1.3 + x) * 0.5;
					worldPoly(

						r,

							[x, y + 29, z],

					worldPoly(
						g,

						[

				} else if (kind === "lighthouse") {

				} else if (kind === "monument") {

					line(g, r, x, y, 18, x - 3, y, 30, "#7b9b8e", 4);
					const q = r.w(x - 3, y, 32);
					px.disc(g, q[0], q[1], 3, "#8ba899");
				} else if (kind === "basketball") {
					line(g, r, x, y, 0, x, y, 26, "#6b7d7c", 2);
					const q = r.w(x, y, 26);
					px.rect(g, q[0] - 7, q[1] - 6, 14, 9, "#b4b6a1");

					box(-6, -4, 2, 6, 4, 10, "#aaa990", "#71817a");
					line(g, r, x - 6, y, 10, x - 6, y, 20, "#bb9d71");
					line(g, r, x + 6, y, 10, x + 6, y, 20, "#bb9d71");
					box(-9, -6, 20, 9, 6, 22, "#bd8561", "#965b51");
					px.disc(g, sx - 5, sy, 2, "#243943");
					px.disc(g, sx + 5, sy, 2, "#243943");
				} else if (kind === "awning") {
					box(-20, -6, 13, 20, 6, 15, p.color, "#62534a");
					for (let i = -18; i < 20; i += 8)
						line(g, r, x + i, y - 6, 15, x + i, y + 6, 15, "#d9c198", 2);
				} else if (kind === "forklift") {
					box(-5, -7, 2, 5, 7, 7, "#bfa165", "#8c7d54");
					for (const d of [-4, 4]) {
						line(g, r, x + d, y - 7, 2, x + d, y - 7, 20, "#617574", 2);
						line(g, r, x + d, y - 7, 2, x + d, y - 18, 2, "#98a494", 2);

			function drawRamp(g, r, ramp) {
				const c = Math.cos(ramp.angle),
					s = Math.sin(ramp.angle);
				const half = ramp.length / 2,
					side = ramp.width / 2;
				const P = (u, v, z) => [
					ramp.x + u * c - v * s,
					ramp.y + u * s + v * c,
					z,
				];
				const corners = [
					P(-half, -side, 0),
					P(half, -side, 0),
					P(half, side, 0),
					P(-half, side, 0),
				];
				r.box(
					g,
					Math.min(...corners.map((p) => p[0])),
					Math.min(...corners.map((p) => p[1])),
					0,
					Math.max(...corners.map((p) => p[0])),
					Math.max(...corners.map((p) => p[1])),
					1,
					"#5b6463",
					"#354b51",
				);
				for (const v of [-side, side]) {
					worldPoly(
						g,
						r,
						[P(-half, v, 1), P(half, v, 1), P(half, v, 9), P(-half, v, 1.5)],
						"#624f3d",
					);
				}
				worldPoly(
					g,
					r,
					[
						P(half, -side, 1),
						P(half, side, 1),
						P(half, side, 9),
						P(half, -side, 9),
					],
					"#8c6e49",
				);
				worldPoly(
					g,
					r,
					[
						P(-half, -side, 1.5),
						P(half, -side, 9),
						P(half, side, 9),
						P(-half, side, 1.5),
					],
					"#777b6e",
				);
				const top = (u, v) => P(u, v, 1.7 + ((u + half) / ramp.length) * 7.5);
				for (const u of [-9, 0, 9]) {
					worldPoly(
						g,
						r,
						[
							top(u - 3, -8),
							top(u + 1, 0),
							top(u - 3, 8),
							top(u, 8),
							top(u + 4, 0),
							top(u, -8),
						],
						"#f0a35e",
					);
				}
				for (const v of [-side + 1, side - 1]) {
					const a = r.w(...top(-half, v)),
						b = r.w(...top(half, v));
					px.line(g, a[0], a[1], b[0], b[1], "#dfad69");
				}
			}

			function draw(r, state = {}) {
				const time = state.time || 0;
				map.drawFloor(r);
				const player = state.player;
				// Rain-darkened pools and small reflected neon marks are floor decals, below traffic.
				r.decal(() => {
					const g = r.ctx;
					for (let i = 0; i < 90; i++) {
						const x = 90 + hash(i, 3) * 1130,
							y = 90 + hash(i, 8) * 1130;
						if (!r.visible(x, y, 0, 60, 50, 50) || map.solidAt(x, y)) continue;
						const dx = Math.abs(x - near(x)),
							dy = Math.abs(y - near(y));
						if (dx > 31 && dy > 31) continue;
						const pts = [
							[x - 8, y - 2],
							[x + 5, y - 4],
							[x + 11, y],
							[x + 3, y + 4],
							[x - 9, y + 2],
						];
						worldPoly(g, r, pts, "#344c56");
						if (i % 3 === 0) line(g, r, x - 5, y, 0, x + 6, y, 0, "#58747b");
					}
					for (const b of buildings) {
						if (!r.visible(b.x + b.w / 2, b.y + b.d / 2, 0, 180, 150, 150))
							continue;
						// Floor under custom wall geometry also permits clean, translucent building cutaways.
						groundRect(g, r, b.x, b.y, b.w, b.d, "#505855");
						px.polyDither(
							g,
							[
								[b.x, b.y],
								[b.x + b.w + 13, b.y + 6],
								[b.x + b.w + 13, b.y + b.d + 9],
								[b.x + 10, b.y + b.d + 9],
							].map((q) => r.w(q[0], q[1], 0)),
							"#172c36",
							0.25,
						);
					}
					for (const p of props) {
						if (p.kind !== "lamp" || !r.visible(p.x, p.y, 0, 60, 50, 50))
							continue;
						r.groundDisc(p.x - 7, p.y, 15, p.color, 0.06);
						line(g, r, p.x - 10, p.y + 3, 0, p.x - 4, p.y + 3, 0, p.color);
					}
					for (const a of water) {
						for (let i = 0; i < 20; i++) {
							const x = a.x + 5 + hash(i, 81) * (a.w - 10),
								y = a.y + 5 + hash(i, 51) * (a.d - 10);
							if (Math.sin(time * 1.7 + i) > -0.2)
								line(g, r, x, y, 0, x + 6 + (i % 5), y, 0, "#40747d");
						}
					}
				});
				for (const b of buildings) {
					if (!r.visible(b.x + b.w / 2, b.y + b.d / 2, b.h / 2, 190, 180, 180))
						continue;
					let alpha = 1;
					if (player) {
						const foot = r.w(player.x, player.y, (player.z || 0) + 12);
						const projected = [
							[b.x, b.y, 0],
							[b.x + b.w, b.y, 0],
							[b.x, b.y + b.d, 0],
							[b.x + b.w, b.y + b.d, 0],
							[b.x, b.y, b.h],
							[b.x + b.w, b.y + b.d, b.h],
						].map((q) => r.w(...q));
						const xs = projected.map((q) => q[0]),
							ys = projected.map((q) => q[1]);
						const behind =
							r.view.order(player.x, player.y, 0) <
							r.view.order(b.x + b.w / 2, b.y + b.d / 2, 0) + 15;
						if (
							behind &&
							foot[0] > Math.min(...xs) - 5 &&
							foot[0] < Math.max(...xs) + 5 &&
							foot[1] > Math.min(...ys) - 8 &&
							foot[1] < Math.max(...ys) + 5
						)
							alpha = 0.24;
					}
					r.queue(
						b.x + b.w / 2,
						b.y + b.d / 2,
						0,
						(g) => px.blend(g, alpha, "normal", () => drawBuilding(g, r, b)),
						{ occluder: true },
					);
				}
				for (const p of props) {
					if (
						!r.visible(p.x, p.y, 15, p.kind === "crane" ? 120 : 100, 100, 100)
					)
						continue;
					r.queue(p.x, p.y, 0, (g) => drawProp(g, r, p, time));
				}
				for (const ramp of ramps) {
					if (r.visible(ramp.x, ramp.y, 0, 80, 60, 60)) {
						r.queue(ramp.x, ramp.y, 0, (g) => drawRamp(g, r, ramp), {
							bias: -0.1,
						});
					}
				}
			}

			function drawCar(r, car, time = 0) {
				if (!r.visible(car.x, car.y, car.z || 0, 80, 60, 60)) return;
				const angle = car.angle || 0,
					c = Math.cos(angle),
					s = Math.sin(angle),
					z = car.z || 0;
				const police = car.police || car.type === "police";
				const taxi = car.type === "taxi";
				const van = car.type === "van" || car.type === "truck";
				const color = police
					? "#d2d9cc"
					: taxi
						? "#caa34e"
						: car.color || "#a16460";
				const length = van ? 18 : 16,
					width = van ? 8 : 7;
				const P = (u, v, h) =>
					r.w(car.x + u * c - v * s, car.y + u * s + v * c, z + h);
				const ground = (u, v) => [car.x + u * c - v * s, car.y + u * s + v * c];
				r.shadow(car.x, car.y, 14, 0.43);
				r.queue(car.x, car.y, z, (g) => {
					const poly = (pts, fill) =>
						px.poly(
							g,
							pts.map((q) => P(...q)),
							fill,
						);
					function rotatedBox(u0, v0, z0, u1, v1, z1, top, side) {
						const faces = [
							{
								n: [c, s],
								pts: [
									[u1, v0, z0],
									[u1, v1, z0],
									[u1, v1, z1],
									[u1, v0, z1],
								],
								shade: -0.1,
							},
							{
								n: [-c, -s],
								pts: [
									[u0, v1, z0],
									[u0, v0, z0],
									[u0, v0, z1],
									[u0, v1, z1],
								],
								shade: -0.2,
							},
							{
								n: [-s, c],
								pts: [
									[u0, v1, z0],
									[u1, v1, z0],
									[u1, v1, z1],
									[u0, v1, z1],
								],
								shade: -0.28,
							},
							{
								n: [s, -c],
								pts: [
									[u1, v0, z0],
									[u0, v0, z0],
									[u0, v0, z1],
									[u1, v0, z1],
								],
								shade: 0.07,
							},
						];
						for (const f of faces)
							if (f.n[0] * r.view.fx + f.n[1] * r.view.fy > 0)
								poly(f.pts, E.shade(side, f.shade));
						poly(
							[
								[u0, v0, z1],
								[u1, v0, z1],
								[u1, v1, z1],
								[u0, v1, z1],
							],
							top,
						);
					}
					for (const u of [-10, 10])
						for (const v of [-width, width]) {
							rotatedBox(
								u - 3,
								v - 1.5,
								1,
								u + 3,
								v + 1.5,
								6,
								"#26333b",
								"#17262f",
							);
							if (-s * v * r.view.fx + c * v * r.view.fy > 0) {
								const q = P(u, v + Math.sign(v), 3);
								px.rect(g, q[0] - 1, q[1] - 1, 2, 2, "#9aab9f");
							}
						}
					rotatedBox(
						-length,
						-width,
						3,
						length,
						width,
						7,

							Math.abs(s.x - t.x) +
							Math.abs(s.y - t.y) +
							Math.hypot(end.x - t.x, end.y - t.y);

					(start.axis === "v" && end.axis === "v" && start.x === end.x) ||
					(start.axis === "h" && end.axis === "h" && start.y === end.y)
				)
					route.push({ x: end.x, y: end.y });

					route.push({ ...best.s });
					if (best.s.x !== best.t.x && best.s.y !== best.t.y)

					route.push({ ...best.t }, { x: end.x, y: end.y });
				}
				return route.filter(
					(p, i) =>
						!i || Math.hypot(p.x - route[i - 1].x, p.y - route[i - 1].y) > 1,
				);
			}

			function district(x, y) {
				if (y > 944) return x > 940 ? "PIER 9 / BREAKWATER" : "SALTWATER DOCKS";
				if (y > 688) return x < 430 ? "ST BRIGID / SOUTHBANK" : "OLD CUSTOMS";
				if (y > 430)

				return x > 940
					? "CANNERY ROW"
					: x > 680
						? "NORTHSTAR"
						: x > 430
							? "SECOND CHANCE DISTRICT"
							: "BELL STREET";
			}
			return {
				map,
				sites,
				roads,
				size,
				buildings,
				ramps,
				draw,
				drawCar,
				roadRoute,

		_settingLabel(row) {
			if (row.values) {
				const index = row.values.indexOf(this.settings[row.key]);
				return escape(row.labels[Math.max(0, index)]);
			}
			return Math.round(Number(this.settings[row.key]) * 100) + "%";
		}

		_changeSetting(direction) {
			const row = this.items[this.selected]?.setting;
			if (!row) return;
			let value;
			if (row.values) {
				const current = Math.max(0, row.values.indexOf(this.settings[row.key]));
				value =
					row.values[
						(current + direction + row.values.length) % row.values.length
					];
			} else {
				value =
					Math.round(
						clamp(
							Number(this.settings[row.key]) + row.step * direction,
							row.min,
							row.max,
						) * 100,
					) / 100;
			}
			this.settings[row.key] = value;
			const label = this.menu.querySelector(
				`[data-setting-value="${row.key}"]`,
			);
			if (label) label.textContent = this._settingLabel(row);
			this.onAction("setting", { key: row.key, value });
		}

		_select(index, scroll = true) {
			if (!this.items.length) return;
			const direction = index < this.selected ? -1 : 1;
			let target = (index + this.items.length) % this.items.length;
			for (
				let attempts = 0;
				attempts < this.items.length && this.items[target]?.disabled;
				attempts++
			)
				target = (target + direction + this.items.length) % this.items.length;
			this.selected = target;
			for (const node of this.menu.querySelectorAll("[data-lt-index]")) {
				const active = Number(node.dataset.ltIndex) === this.selected;
				node.classList.toggle("lt-selected", active);
				node.setAttribute("aria-current", active ? "true" : "false");
				node.tabIndex = active ? 0 : -1;
				if (active && scroll)
					node.scrollIntoView({ block: "nearest", inline: "nearest" });
			}
		}

		navigate(dx, dy) {
			if (!this.screen || !this.items.length) return;
			if (dx && this.items[this.selected]?.setting)
				this._changeSetting(Math.sign(dx));
			else if (dy || dx) this._select(this.selected + Math.sign(dy || dx));
		}

		confirm() {
			const item = this.items[this.selected];
			if (!item || item.disabled) return;
			if (item.setting) this._changeSetting(1);
			else this.onAction(item.action, item.value);
		}

		back() {
			if (!this.screen || this.screen === "title") return;
			const actions = {
				pause: "resume",
				map: "map-close",
				shop: "shop-close",
				jobs: "jobs-close",
				dialogue: "dialogue-cancel",
				result: "result-continue",
			};
			this.onAction(actions[this.screen] || "back");
		}

		setSettings(settings) {
			Object.assign(this.settings, settings);
			if (this.screen === "settings") {
				for (const row of SETTING_ROWS) {
					const label = this.menu.querySelector(
						`[data-setting-value="${row.key}"]`,
					);
					if (label) label.textContent = this._settingLabel(row);
				}

			this.el.classList.toggle("lt-reduced-motion", !this.settings.motion);
		}

		setTouchOnly(value) {
			this.el.querySelector(".lt-touch").hidden = !value;
			this.el.classList.toggle("lt-touch-only", !!value);

		notify(text, kind = "info") {
			const node = document.createElement("div");
			node.className =
				"lt-notification lt-notification-" +
				String(kind).replace(/[^a-z-]/g, "");
			const icon = document.createElement("span");
			icon.className = "lt-notification-icon";
			icon.textContent =
				kind === "success"
					? "✓"
					: kind === "warning" || kind === "error"
						? "!"
						: "↗";
			const message = document.createElement("span");
			message.textContent = text;
			node.append(icon, message);
			this.el.querySelector(".lt-notifications").append(node);
			setTimeout(() => {
				node.classList.add("lt-leaving");
				setTimeout(() => node.remove(), 250);
			}, 4300);
		}

		update(state = {}) {
			this.state = state;
			const player = state.player || {};

			{ x: r[idx] + 13, y: 1168 - 13 },

	function nearestHostile(range = 280, angle = null) {

			bestScore = Infinity;
		for (const n of [...enemies, ...cars.filter((c) => c.criminal)]) {
			if (n.dead) continue;
			const d = dist(n, player);
			if (d > range || !world.map.los(player.x, player.y, n.x, n.y)) continue;
			const a = Math.atan2(n.y - player.y, n.x - player.x);
			const diff = Math.abs(E.angDiff(player.facing, a));

	function steerCar(
		c,
		dt,
		dx,
		dy,
		throttle = 1,
		brake = false,
		handbrake = false,
	) {
		const mag = Math.hypot(dx, dy),
			oldSpeed = c.speed;
		if (mag > 0.1) {
			const wanted = Math.atan2(dy, dx);
			c.angle = E.approachAng(
				c.angle,
				wanted,
				c.turn *
					dt *
					(0.42 + Math.min(1, Math.abs(c.speed) / 55)) *
					(handbrake ? 1.8 : 1),
			);
		}
		const target = brake
			? -c.maxSpeed * 0.35
			: mag > 0.08
				? c.maxSpeed * throttle * Math.min(1, mag)
				: 0;
		c.speed = E.approach(
			c.speed,
			target,
			(brake ? c.accel * 1.5 : mag > 0.08 ? c.accel : 70) *
				dt *
				(handbrake ? 2 : 1),
		);
		if (handbrake) c.speed *= Math.exp(-3 * dt);
		c.brake =
			handbrake || brake || Math.abs(c.speed) < Math.abs(oldSpeed) - 0.2;
		c.vx = Math.cos(c.angle) * c.speed;
		c.vy = Math.sin(c.angle) * c.speed;
		c.crash = Math.max(0, c.crash - dt);
		c.update(dt, world.map);
		if (c.hitWall && Math.abs(c.speed) > 23 && c.crash <= 0) {
			const impact = Math.abs(c.speed);
			c.health -= impact * 0.12;
			c.speed *= -0.22;
			c.crash = 0.5;
			game.particles.sparks(
				c.x + Math.cos(c.angle) * 15,
				c.y + Math.sin(c.angle) * 15,
				5,
				5,
				c.angle + Math.PI,
			);
			if (c === player.vehicle) {
				sound.event("crash");
				if (settings.motion) game.shake(Math.min(3, impact / 35));
				if (activity?.type === "courier") activity.integrity -= impact * 0.12;
			}
			if (c.health <= 0) explodeCar(c);
		}
		if (c.health < c.maxHealth * 0.25 && !c.dead && rand() < dt * 3)
			game.particles.smoke(c.x, c.y, 10, 1);
		if (
			(handbrake || Math.abs(E.angDiff(c.angle, Math.atan2(dy, dx))) > 0.8) &&
			Math.abs(c.speed) > 50 &&
			rand() < dt * 30
		) {
			skids.push({ x: c.x, y: c.y, angle: c.angle, t: 16 });
			game.particles.dust(c.x, c.y, 0, 1);
		}
	}
	function driveAI(c, dt) {
		if (c.dead || c.occupied) return;
		c.repath -= dt;
		if (c.police && heat > 0 && (mode === "play" || attract)) {
			if (c.repath <= 0) {
				c.route = world.roadRoute(c, player);
				c.routeIndex = 0;
				c.repath = 1.6;
			}
		} else if (!c.route?.length) {
			c.route = trafficRoute(c);
			c.routeIndex = 0;
		}
		let target = c.route[c.routeIndex] || player;
		if (dist(c, target) < 23) {
			c.routeIndex++;
			if (c.routeIndex >= c.route.length) {
				if (c.police) c.repath = 0;
				c.routeIndex = 0;
			}
			target = c.route[c.routeIndex] || player;
		}
		const dx = target.x - c.x,
			dy = target.y - c.y,
			d = Math.hypot(dx, dy) || 1;
		let throttle =
			c.police && heat > 0 ? 0.9 : c.criminal ? 0.78 : c.racer ? 0.8 : 0.4;
		if (c.traffic) {
			const nearIntersection =
				world.roads.some((x) => Math.abs(c.x - x) < 26) &&
				world.roads.some((y) => Math.abs(c.y - y) < 26);
			const vertical = Math.abs(Math.sin(c.angle)) > 0.7,
				green = (Math.floor(gameTime / 7) % 2 === 0) === vertical;
			if (nearIntersection && !green) throttle *= 0.2;
			if (
				cars.some(
					(other) =>
						other !== c &&
						!other.dead &&
						dist(c, other) < 37 &&
						Math.abs(
							E.angDiff(c.angle, Math.atan2(other.y - c.y, other.x - c.x)),
						) < 0.6,
				)
			)
				throttle = 0;
		}
		steerCar(c, dt, dx / d, dy / d, throttle);
		if (
			c.police &&
			heat > 0 &&
			dist(c, player) < 130 &&
			Math.abs(c.speed) < 50
		) {
			c.officerTimer = (c.officerTimer || 0) + dt;
			if (
				c.officerTimer > 4 &&
				enemies.filter((n) => n.kind === "police" && !n.dead).length <
					Math.ceil(heat / 20) * 2
			) {
				const p = safePoint(c.x + 24, c.y + 15);
				spawnEnemy(p.x, p.y, "police");
				c.officerTimer = 0;
			}
		}
	}

	function updateNPCs(dt) {

			return;

		const near = s.x !== undefined && dist(player, s) < (s.radius || 44);
		let done = false;
		if (s.type === "goto")
			done = near && (!s.vehicleRequired || !!player.vehicle);

			done =
				!!player.vehicle &&
				(m.car
					? player.vehicle === m.car
					: !s.carType || player.vehicle.type === s.carType);
		if (s.type === "deliver")
			done =
				near &&
				(!s.vehicleRequired || !!player.vehicle) &&
				(!s.carType || player.vehicle?.type === s.carType) &&
				(!s.carType || !m.car || player.vehicle === m.car);
		if (s.type === "kill")
			done = m.targets.length > 0 && m.targets.every((n) => n.dead);
		if (s.type === "loseHeat") done = heat <= 0;

			if (s.vehicleRequired && !player.vehicle) {
				stageTimer = Math.max(0, stageTimer - dt);

				(!s.vehicleRequired || !!player.vehicle);

		player.weapon = 2;

		player.ammo = {
			1: { clip: 12, reserve: 999 },
			2: { clip: 30, reserve: 999 },
			3: { clip: 6, reserve: 999 },
		};
		player.x = s.from.x;
		player.y = s.from.y;
		player.z = 0;
		player.vx = 0;
		player.vy = 0;
		game.cam.snap = true;
		cars = cars.filter((c) => !c.demo && !c.police && (!c.dead || !c.mission));
		botPath = world.roadRoute(s.from, s.to);
		botPath.push({ ...s.to });
		botIndex = 0;
		if (s.car) {
			botCar = makeCar(s.car, s.from.x, s.from.y, {
				demo: true,
				occupied: true,
				angle: 0,
			});
			player.vehicle = botCar;
		}
		if (["chase", "finale"].includes(s.kind)) {
			heat = s.kind === "finale" ? 85 : 65;
			for (let i = 0; i < 3; i++)
				makeCar("police", s.from.x - 80 + i * 35, s.from.y + 130, {
					demo: true,
					ai: true,
					angle: -Math.PI / 2,
				});
		}
		if (s.kind === "combat")
			for (let i = 0; i < 5; i++) {
				const p = safePoint(
					1140 + (i % 2) * 55,
					1060 + Math.floor(i / 2) * 35,
					6,
				);
				spawnEnemy(p.x, p.y, "gang", { hp: 45 });
			}
		if (s.kind === "repair") {
			botCar.health = 25;
			heat = 42;
		}
		if (s.kind === "race") {
			botPath = [...racePoints.map((p) => ({ ...p }))];
			botIndex = 0;
			makeCar("coupe", 425, 927, {
				ai: true,
				demo: true,
				racer: true,
				route: botPath.map((p) => ({ ...p })),
				color: "#9f6c94",
				angle: 0,
			});
		}
		if (s.kind === "vigilante") {
			const c = makeCar("sedan", 810, 656, {
				ai: true,
				demo: true,
				criminal: true,
				color: "#9c4651",
				route: [
					{ x: 912, y: 656 },
					{ x: 912, y: 912 },
					{ x: 656, y: 912 },
				],
				angle: 0,
			});
			c.health = 65;
		}
		notify(s.title, "mission");
	}
	function updateAttract(dt) {
		attractTime += dt;
		const segment = Math.floor(attractTime / 14) % demoScenes.length,
			local = attractTime % 14;
		if (segment !== attractSegment) {
			attractSegment = segment;
			setupDemo(segment);
		}
		const s = demoCurrent;
		cooldown = Math.max(0, cooldown - dt);
		invuln = 1;
		player.health = 100;
		player.armor = 100;
		player.ammo[2].clip = 30;
		if (s.kind === "combat") {
			const n = nearestHostile(350);
			if (n) {
				player.facing = Math.atan2(n.y - player.y, n.x - player.x);
				player.aiming = true;
				fire();
			}
			player.vx = Math.sin(local * 1.5) * 25;
			player.vy = Math.cos(local) * 16;
			player.update(dt, world.map);
		} else if (botCar) {
			const p = botPath[botIndex] || s.to;
			const dx = p.x - botCar.x,
				dy = p.y - botCar.y,
				d = Math.hypot(dx, dy);
			if (d < 24 && botIndex < botPath.length - 1) botIndex++;
			if (d > 10) {
				steerCar(
					botCar,
					dt,
					dx / (d || 1),
					dy / (d || 1),
					s.kind === "race" ? 0.94 : 0.72,
					s.kind === "repair" && local > 6,
					false,
				);
			} else botCar.speed = E.approach(botCar.speed, 0, dt * 300);
			player.x = botCar.x;
			player.y = botCar.y;
			player.vx = botCar.vx;
			player.vy = botCar.vy;
			player.facing = botCar.angle;
			botCar.health = Math.max(70, botCar.health);
			if (s.kind === "repair" && local > 6) {
				botCar.health = botCar.maxHealth;
				botCar.color = "#59a69d";
				heat = 0;
			}
			if (s.kind === "vigilante") {
				const target = cars.find((c) => c.criminal && !c.dead);
				if (target) {
					player.facing = Math.atan2(target.y - player.y, target.x - player.x);
					fire();
					if (local > 10 && !target.dead) explodeCar(target);
				}
			}
			if (s.kind === "finale" && local > 10) heat = 0;
		} else {
			const dx = s.to.x - player.x,
				dy = s.to.y - player.y,
				d = Math.hypot(dx, dy) || 1;
			player.vx = (dx / d) * 65;
			player.vy = (dy / d) * 65;
			player.update(dt, world.map);
			player.facing = Math.atan2(dy, dx);
		}
		rig.update(dt, {
			x: player.x,
			y: player.y,
			z: 0,
			vx: player.vx,
			vy: player.vy,
			facing: player.facing,
			point: s.kind === "combat",
			stance: "ready",
			run: 1,
		});
		objective = {
			...s.to,
			label: s.kind === "race" ? "CHECKPOINT" : "DEMO ROUTE",
		};
		route = botPath.slice(botIndex);
		updateNPCs(dt);
		updateShots(dt);
		updateWanted(dt);
		updatePickups(dt);
		updateStunts(dt);
	}
	function updateStunts(dt) {
		const c = player.vehicle;
		if (!c || c.dead) return;
		c.jumpCooldown = Math.max(0, (c.jumpCooldown || 0) - dt);
		if (c.airborne) {
			c.flightTime += dt;
			player.z = c.z;
			if (c.onGround || c.z <= 0) {
				c.z = 0;
				c.airborne = false;
				c.gravity = 700;
				player.z = 0;
				c.jumpCooldown = 2;
				const length = Math.round(dist(c, c.launch));
				const record = length > 80;
				game.particles.dust(c.x, c.y, 0, 12);
				sound.event("crash");
				if (settings.motion) game.shake(2);
				if (record) {
					stats.stunts = (stats.stunts || 0) + 1;
					player.cash += 200;
					notify("STUNT JUMP · " + length + "m · +$200", "mission");
					saveGame();
				}
			}
		} else if (c.jumpCooldown <= 0) {
			for (const ramp of world.ramps || []) {
				if (
					dist(c, ramp) < 20 &&
					Math.abs(c.speed) > 80 &&
					Math.abs(E.angDiff(c.angle, ramp.angle)) < 0.65
				) {
					c.airborne = true;
					c.flightTime = 0;
					c.launch = { x: c.x, y: c.y };
					c.z = 1;
					c.vz = 112;
					c.onGround = false;
					c.gravity = 235;
					sound.event("dodge");
					break;
				}
			}
		}
	}
	function updateMenu() {
		const inp = game.input;
		if (inp.repeat("up")) ui.navigate(0, -1);
		if (inp.repeat("down")) ui.navigate(0, 1);
		if (inp.repeat("left")) ui.navigate(-1, 0);
		if (inp.repeat("right")) ui.navigate(1, 0);
		if (inp.pressed("confirm") || inp.pressed("start")) ui.confirm();
		else if (inp.pressed("cancel") || inp.pressed("pause")) ui.back();
		if (inp.pressed("map") && ui.screen === "map") ui.back();
	}
	function hudState() {
		const stage = mission?.stage;
		let missionUI = mission
			? {
					title: mission.job.title,
					instruction: stage.text,
					progress:
						stage.type === "survive"
							? stageTimer / (stage.duration || 25)
							: mission.index / mission.job.stages.length,
				}
			: null;
		if (stage?.type === "survive")
			missionUI.instruction +=
				" · " +
				Math.max(0, Math.ceil((stage.duration || 25) - stageTimer)) +
				"s";
		if (stage?.type === "kill")
			missionUI.instruction +=
				" · " +
				mission.targets.filter((n) => n.dead).length +
				"/" +
				mission.targets.length;
		if (activity)
			missionUI = {
				title: {
					taxi: "YELLOWFIN FARES",
					courier: "NIGHT MAIL",
					race: "QUAYSIDE CIRCUIT",
					vigilante: "BLUE COLLAR JUSTICE",
				}[activity.type],
				instruction: activity.label,
				progress:
					activity.type === "race"
						? activity.index / racePoints.length
						: activity.count / 3,
			};
		if (attract && demoCurrent)
			missionUI = {
				title: demoCurrent.title,
				instruction: demoCurrent.text,
				progress: (attractTime % 14) / 14,
			};
		if (!missionUI) {
			const j = nextContact();
			missionUI = {
				title: j ? "NEXT CONTACT · " + j.contact : "BELLWETHER IS YOURS",
				instruction: j
					? "Follow the gold marker to " + j.title + "."
					: "Discover 12 dead drops or start a side job from the pause menu.",
				progress: completed.length / content.story.length,
			};
		}
		const min = 22 * 60 + Math.floor(gameTime / 4),
			c = player.vehicle;
		return {
			mode,
			player: {
				health: player.health,
				armor: player.armor,
				cash: player.cash,
				ammo: player.weapon ? player.ammo[player.weapon] : null,
				weapon: weapons[player.weapon].name,
				vehicle: c,
				stamina: player.stamina,
			},
			heat,
			stars: Math.ceil(heat / 20),
			heatState: wantedState,
			mission: missionUI,
			district: world.district(player.x, player.y),
			clock:
				String(Math.floor(min / 60) % 24).padStart(2, "0") +
				":" +
				String(min % 60).padStart(2, "0"),
			speed: c ? Math.round(Math.abs(c.speed) * 0.72) : 0,
			carName: c?.name || "",
			carHealth: c ? (c.health / c.maxHealth) * 100 : 100,
			radio: sound.name,
			prompt: prompt
				? { text: prompt, key: game.input.label("interact") }
				: null,
			attract,
			objective,
			position: { x: player.x, y: player.y, angle: player.facing },
			route,
			vehicles: cars,
			enemies: enemies.filter((n) => !n.dead),
			collected: collected.length,
			completed: completed.length,
			maxJobs: content.story.length,
			activity: activity?.type || "",
			gameTime,
			inputDevice: game.input.lastDevice,
			reloading: reloadTime > 0,
			stamina: player.stamina,
		};
	}
	function update(dt) {
		backCooldown = Math.max(0, backCooldown - dt);
		clock += dt;
		uiClock += dt;
		if (game.input.anyPressed() || Math.hypot(...game.input.padMove) > 0.2) {
			lastInput = performance.now();
			titleIdle = 0;
			if (game.input.lastDevice === "gamepad" && ui.setTouchOnly)
				ui.setTouchOnly(false);
			if (attract) {
				exitAttract();
				backCooldown = 0.24;
				return;
			}
		}
		if (mode === "title") {
			titleIdle = (performance.now() - lastInput) / 1000;
			if (titleIdle >= 10) {
				startAttract();
				return;
			}
			if (ui.screen) updateMenu();
			for (const c of cars) if (c.ai) driveAI(c, dt);
			const t = clock * 0.06;
			game.focus(915 + Math.sin(t) * 130, 900 + Math.cos(t) * 150, 12);
		} else if (attract) {
			gameTime += dt;
			updateAttract(dt);
			game.focus(
				player.x + player.vx * 0.15,
				player.y + player.vy * 0.15,
				12 + (player.z || 0),
			);
		} else if (ui.screen) {
			updateMenu();
		} else {
			if (game.input.pressed("pause")) {
				ui.show("pause", { state: hudState() });
				clearInput();
				return;
			}
			if (game.input.pressed("map")) {
				openMap();
				return;
			}
			gameTime += dt;
			context();
			updatePlayer(dt);
			if (ui.screen) return;
			updateNPCs(dt);
			updateShots(dt);
			updateWanted(dt);
			updatePickups(dt);
			updateMission(dt);
			updateActivity(dt);
			updateStunts(dt);
			updateObjective();
			context();
			game.focus(
				player.x + player.vx * 0.19,
				player.y + player.vy * 0.19,
				12 + (player.z || 0),
			);
		}
		sound.update(dt, {
			vehicle: player.vehicle,
			speed: Math.abs(player.vehicle?.speed || 0),
			heat,
			stars: Math.ceil(heat / 20),
			attract,
			mode: ui.screen || mode,
			player,
			settings,
		});
		if (uiClock > 0.06) {
			ui.update(hudState());
			uiClock = 0;
		}
	}
	function drawPerson(r, p, personRig, options = {}) {
		if (!r.visible(p.x, p.y, p.z || 0, 60, 70, 70)) return;
		r.shadow(p.x, p.y, 5, 0.45);
		r.actor(
			p.x,
			p.y,
			p.z || 0,
			(g, ox, oy) => personRig.draw(g, ox, oy, r.view),
			{ outline: true, ...options },
		);
	}
	function drawHelicopter(r) {
		if (heat < 70) return;
		const t = gameTime,
			x = player.x + Math.cos(t * 0.43) * 110,
			y = player.y + Math.sin(t * 0.43) * 90,
			z = 100;
		r.decal(() => r.groundDisc(x, y, 48, "#d3d6a0", 0.09));
		r.queue(x, y, z, (g) => {
			const [sx, sy] = r.w(x, y, z);
			E.px.ell(g, sx, sy, 15, 7, "#172b37");
			E.px.rect(g, sx - 7, sy - 6, 13, 6, "#526978");
			E.px.rect(g, sx + 4, sy - 5, 7, 4, "#91bbc3");
			E.px.line(g, sx - 12, sy, sx - 31, sy - 6, "#263b48", 4);
			E.px.line(g, sx - 30, sy - 12, sx - 30, sy, "#78929b", 2);
			E.px.line(g, sx - 7, sy + 8, sx + 10, sy + 8, "#263b48", 2);
			const a = t * 47;
			E.px.line(
				g,
				sx + Math.cos(a) * 31,
				sy - 9 + Math.sin(a) * 8,
				sx - Math.cos(a) * 31,
				sy - 9 - Math.sin(a) * 8,
				"#a9b6ae",
				2,
			);
			E.px.dot(
				g,
				sx - 28,
				sy - 7,
				Math.floor(t * 4) % 2 ? "#ff6b64" : "#789aa5",
			);
		});
	}
	function draw(r) {
		r.sky(["#192731", "#34454b", "#566267"]);
		world.draw(r, {
			time: gameTime + clock,
			player,
			night: true,
			mission,
			settings,
		});
		for (const s of skids)
			r.decal(() => {
				const a = r.w(
						s.x - Math.cos(s.angle) * 5,
						s.y - Math.sin(s.angle) * 5,
						0,
					),
					b = r.w(s.x + Math.cos(s.angle) * 5, s.y + Math.sin(s.angle) * 5, 0);
				E.px.line(r.ctx, ...a, ...b, "#1e272e", 2);
			});
		if (objective && mode !== "title") {
			r.decal(() => {
				r.groundRing(
					objective.x,
					objective.y,
					activity?.type === "race" ? 38 : 23,
					"#e9d47a",
					0.8,
				);
				r.groundRing(
					objective.x,
					objective.y,
					activity?.type === "race" ? 34 : 19,
					"#e9d47a",
					0.4,
				);
			});
			r.marker(objective.x, objective.y, 20, {
				label: objective.label || "OBJECTIVE",
				color: "#efd68a",
			});
		}
		for (const p of content.collectibles) {
			if (collected.includes(p.id) || !r.visible(p.x, p.y, 0)) continue;
			r.shadow(p.x, p.y, 5, 0.3);
			r.queue(p.x, p.y, 4, (g) => {
				const z = 4 + Math.sin(clock * 3 + p.x) * 2;
				r.box(
					g,
					p.x - 4,
					p.y - 3,
					z,
					p.x + 4,
					p.y + 3,
					z + 5,
					"#d6c187",
					"#7f765d",
				);
			});
		}
		if (mission?.stage.type === "collect") {
			const s = mission.stage;
			r.queue(s.x, s.y, 2, (g) =>
				r.box(
					g,
					s.x - 5,
					s.y - 3,
					1,
					s.x + 5,
					s.y + 3,
					7,
					"#e9d186",
					"#91775b",
				),
			);
		}
		for (const p of pickups)
			if (r.visible(p.x, p.y, 0))
				r.queue(p.x, p.y, 3, (g) => {
					r.box(
						g,
						p.x - 3,
						p.y - 3,
						2,
						p.x + 3,
						p.y + 3,
						6,
						p.type === "cash" ? "#a6c98a" : "#e5b87c",
						"#52656a",
					);
				});
		for (const c of cars) world.drawCar(r, c, gameTime);
		for (const p of peds) drawPerson(r, p, p.rig, { alpha: p.dead ? 0.5 : 1 });
		for (const n of enemies) {
			drawPerson(r, n, n.rig, {
				flash: n.hurt > 0 ? "#ffffff" : undefined,
				alpha: n.dead ? 0.45 : 1,
			});
			if (!n.dead && n.hurt > 0) {
				const [x, y] = r.w(n.x, n.y, 32);
				r.overlay((g) =>
					E.ui.bar(g, x - 10, y, 20, 2, n.hp / n.maxHp, "#eb986b"),
				);
			}
		}
		if (!player.vehicle && mode !== "title") {
			r.decal(() => r.groundRing(player.x, player.y, 8, "#d8deb0", 0.65));
			drawPerson(r, player, rig, {
				alpha: invuln > 0 && Math.floor(clock * 12) % 2 ? 0.7 : 1,
			});
			if (player.aiming || game.input.down("fire")) {
				const w = weapons[player.weapon],
					end = {
						x: player.x + Math.cos(player.facing) * Math.min(w.range, 105),
						y: player.y + Math.sin(player.facing) * Math.min(w.range, 105),
					};
				r.queue(player.x, player.y, 15, (g) => {
					const a = r.w(player.x, player.y, 15),
						b = r.w(end.x, end.y, 15);
					E.px.line(g, ...a, ...b, "#b9c793", 1);
					E.px.line(g, b[0] - 3, b[1], b[0] + 3, b[1], "#f4e3b2");
					E.px.line(g, b[0], b[1] - 3, b[0], b[1] + 3, "#f4e3b2");
				});
			}
		}
		for (const b of shots) {
			const a = r.w(b.x, b.y, b.z),
				z = r.w(b.x - b.vx * 0.018, b.y - b.vy * 0.018, b.z);
			r.queue(b.x, b.y, b.z, (g) => {
				E.px.line(g, ...z, ...a, b.color, 1);
				E.px.dot(g, ...a, "#fff2d2");
			});
		}
		drawHelicopter(r);
		if (settings.weather) {
			r.overlay((g) => {
				for (let i = 0; i < 95; i++) {
					const x = (i * 137.59 + clock * 53) % r.W,
						y = (i * 61.27 + clock * 193) % r.H;
					E.px.line(g, x, y, x - 2, y + 5, i % 3 ? "#79919b" : "#adc0c3");
				}
				E.px.rect(g, 0, 0, r.W, 1, "#aec9bc");
			});
		}
		if (reloadTime > 0 && !ui.screen)
			r.text("RELOADING", r.W / 2, r.H / 2 + 27, "#e9d38c", {
				align: "center",
			});
	}
	reset(false, true);
	attract = false;
	setMode("title");
	ui.show("title", { hasSave: !!read(STORAGE, null) });
	lastInput = performance.now();
	if (ui.setTouchOnly)
		ui.setTouchOnly(
			matchMedia("(pointer: coarse)").matches &&
				!keyboardSeen &&
				!navigator.getGamepads?.().some((p) => p?.connected),
		);
	game.start({ update, draw });
	game.debug = {
		snapshot() {
			return {
				title: meta.title,
				mode,
				menu: ui.screen,
				attract,
				attractTime,
				attractSegment,
				attractKinds: [...attractLabels],
				player: {
					x: player.x,
					y: player.y,
					health: player.health,
					vehicle: player.vehicle?.type || null,
				},
				stars: Math.ceil(heat / 20),
				mission: mission?.job.id || null,
				stage: mission?.index ?? null,
				activity: activity?.type || null,
				completed: completed.length,
				collected: collected.length,
				controls: inputMap,
				settings: { ...settings },
				errors: game.errors.map((e) => String(e.message || e)),
				world: { buildings: world.buildings.length, roads: world.roads.length },
			};
		},
		get input() {
			return game.input;
		},
		get world() {
			return world;
		},
		get player() {
			return player;
		},
		get ui() {
			return ui;
		},
	};
	window.LowTide = { game, debug: game.debug };
})();
</script></body></html>
