<!--
TAILFOX 64 - THE LANTERN WING
An original spiritual successor to Starfox 64 (N64). Single-file HTML demo.

SOURCE INFORMATION
- Date: 2026-10-20 14:26
- Source: Starfox 64 for N64
- Game title: Tailfox 64 (picked at random by code from 50 brainstormed riffs on the source name)
- Tech: Three.js 0.160.0 (WebGL) loaded from the jsDelivr CDN together with its EffectComposer, RenderPass, UnrealBloomPass and OutputPass addons; hand-written vanilla JavaScript (ES module, modules bundled into one HTML file by a small Python script); Web Audio API for all sound and music (procedural synth and 16th-note sequencer); Gamepad API (PS5 DualSense, standard mapping, dual-rumble); localStorage for settings. No other engine or library.
- Art Direction: Low-poly, flat-shaded N64-inspired look with modern lighting: sun shadow maps, fog, vertex-colored procedural terrain, additive particle explosions, bloom glow, canvas-drawn comm portraits and a large-type 10-foot DOM HUD and menu system.
- Animation: Fully procedural and code-driven (no keyframed assets): rail-relative enemy path functions, steering behaviours for all-range dogfights, damped camera and ship motion, tweened UI, typewriter comm text and a pooled GPU point-sprite particle system.
- Testing: The prompt said to write no tests and do no tests, because testing is done separately. The game was not run or played by the author. The only check performed was a JavaScript syntax parse of the bundled script at build time.
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium
- Usage: unknown (no cost, token or session-time telemetry was available to the model)

ENGINE FEEDBACK
There is no game engine in the usual sense here. The "engine" is Three.js plus the browser platform APIs.
- What did you like most about the engine? Three.js gets a convincing N64-meets-modern look from very little code: flat-shaded standard materials, a shadow-casting sun, fog and a bloom composer. A single CDN import also makes one-file sharing easy.
- Did you get stuck or guess wrong? I could not run anything, so every API detail was reasoned rather than verified (Object3D.lookAt facing +Z, Euler order for flight attitude, shadow-camera projection needing an explicit update, particle shader attributes, audio autoplay rules when only a gamepad is used). I caught a few of these in review; others may still be wrong.
- What was the most important thing you had to build yourself? The whole gameplay layer: a rail-relative enemy director and level script, free-flight all-range mode, charge and lock-on shooting, boss state machines, collisions, a procedural audio sequencer, the controller-first menu and HUD system, and the attract-mode pilot.
- What was the hardest part about using the engine? Three.js has no entity, collision, input, UI or audio layer, so all of that is hand-rolled. Keeping many modules coherent in one shared scope without being able to execute them was the real difficulty.
- If you had to remove or overhaul one thing from engine, what would that be? The split between the core build and the examples/jsm addons, which forces import maps and exact CDN version paths for something as basic as post-processing.
- If you could change one thing about the engine, what would it be? A small built-in gameplay layer (entities, pooling, simple collision queries, input mapping) so a vertical slice does not start from a blank page.

PROMPT FEEDBACK
[PROMPT] Build an original spiritual successor to Starfox 64 as a feature-complete single-file HTML demo with attract mode, controller-first 10-foot UX, axis-invert toggles and touch-only messaging.
- What did you like most about this prompt? Concrete, checkable requirements (10-second attract mode, invert toggles, touch-only message, exact filename and report sections) alongside full freedom over tech and art, and the reference list that sets the bar for "feature-complete demo".
- What was confusing? The word SOURCE is used as a placeholder in the file name and in the title instruction. The Source Information template has an unlabeled "Starfox 64 for N64" line. "Silently brainstorm 50 titles" is hard to square with reporting the pick. Usage and session time were requested although no telemetry exists. "No tests" sits next to "no stubs", which cannot be verified without running the game.
- What was the hardest thing to do? Delivering a full vertical slice (two flight modes, two boss fights, rescue event, menus, settings, attract AI, procedural audio) in one pass without ever executing it.
- If there was one test you could of run, what would that test be? A headless-browser smoke run that lets the attract mode play through all four stage segments, fails on any console error, and screenshots each boss phase, plus a scripted gamepad session that walks every menu.

-->

const CANYON_START = 4200;
function nz(x, z) {
  return Math.sin(x * 0.043 + Math.sin(z * 0.021) * 1.7) * Math.cos(z * 0.037 + Math.sin(x * 0.017) * 1.3)
    + 0.5 * Math.sin(x * 0.11 + z * 0.083) * Math.cos(x * 0.07 - z * 0.1) + 0.25 * Math.sin(x * 0.27 + z * 0.31);
}
const canyonW = (d) => 62 + 16 * Math.sin(d * 0.0031) + 8 * Math.sin(d * 0.0093);
const canyonCf = (d) => smooth(CANYON_START - 250, CANYON_START + 450, d);
function terrainH(x, z) {
  const d = -z, cf = canyonCf(d);
  const n = nz(x, z);
  const sea = -28 + 18 * smooth(0.6, 1.5, n) + 0.35 * Math.sin(x * 0.2 + z * 0.15);
  if (cf <= 0) return sea;
  const hw = canyonW(d), ax = Math.abs(x);
  const wall = smooth(hw, hw + 38, ax) * (74 + 24 * nz(x * 0.5, z * 0.5));
  const floor = -30 + 2.5 * nz(x * 0.7, z * 0.7) + 2 * smooth(hw, hw * 0.4, ax);
  return lerp(sea, floor + wall, cf);
}
const _tc = new THREE.Color();
function terrainColor(x, z, h, o) {
  const d = -z, cf = canyonCf(d), n = nz(x * 1.3, z * 1.3);
  if (h < -26.8) { const w = 0.5 + 0.25 * n; _tc.setRGB(lerp(0.12, 0.2, w) * (1 - cf * 0.3), lerp(0.42, 0.6, w) - cf * 0.1, lerp(0.62, 0.76, w) - cf * 0.15); }
  else if (h < -24.5 && cf < 0.6) _tc.setRGB(0.9, 0.8, 0.55);
  else if (cf < 0.5 && h < -9) _tc.setRGB(0.28 + 0.06 * n, 0.58 + 0.08 * n, 0.27);
  else {
    const band = 0.5 + 0.5 * Math.sin(h * 0.33 + n * 1.2);
    _tc.setRGB(lerp(0.62, 0.86, band), lerp(0.33, 0.55, band), lerp(0.24, 0.38, band));

      li.addEventListener('mouseenter', () => { if (this.sel !== i) { this.sel = i; this.refresh(); Snd.menu(); } });
      li.addEventListener('click', (ev) => {
        this.sel = i;
        if (ev.target.classList.contains('arr')) { this.adjust(ev.target.dataset.dir === 'l' ? -1 : 1); return; }
        if (it.kind === 'slider') { const tr = li.querySelector('.track'); if (tr) { const rc = tr.getBoundingClientRect(); const u = clamp((ev.clientX - rc.left) / rc.width, 0, 1); if (ev.clientX >= rc.left - 6) { it.set(this.snap(it, it.min + u * (it.max - it.min))); Snd.menu(); this.refresh(); return; } } }
        this.activate();
      });
    });
    this.refresh();
  },
  snap(it, v) { const s = it.step || 0.1; return clamp(Math.round(v / s) * s, it.min, it.max); },
  refresh() {
    const d = this.def; if (!d) return;
    d.items.forEach((it, i) => {
      const li = this.itemEls[i]; li.classList.toggle('sel', i === this.sel); li.classList.toggle('dim', !!(it.disabled && it.disabled()));
      const v = li.querySelector('.val'); let t = '';
      if (it.kind === 'toggle') t = `<span class="arr" data-dir="l">◀</span>${it.get() ? 'ON' : 'OFF'}<span class="arr" data-dir="r">▶</span>`;
      else if (it.kind === 'choice') t = `<span class="arr" data-dir="l">◀</span>${it.opts[it.get()]}<span class="arr" data-dir="r">▶</span>`;
      else if (it.kind === 'slider') { const val = it.get(), u = (val - it.min) / (it.max - it.min); t = `<span class="arr" data-dir="l">◀</span><span class="track"><i style="width:${u * 100}%"></i></span><span>${it.fmt ? it.fmt(val) : val.toFixed(2)}</span><span class="arr" data-dir="r">▶</span>`; }
      v.innerHTML = t;
    });
    const sel = this.itemEls[this.sel]; if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
  },
  adjust(dir) {
    const it = this.def.items[this.sel]; if (!it) return;
    if (it.kind === 'toggle') it.set(!it.get());
    else if (it.kind === 'choice') it.set((it.get() + dir + it.opts.length) % it.opts.length);
    else if (it.kind === 'slider') it.set(this.snap(it, it.get() + dir * (it.step || 0.1)));
    else return;
    Snd.menu(); this.refresh(); Snd.applyVolumes();
  },
  activate() {
    const it = this.def.items[this.sel]; if (!it || (it.disabled && it.disabled())) return;
    if (it.kind === 'toggle' || it.kind === 'choice') { this.adjust(1); return; }
    if (it.kind === 'slider') return;
    Snd.select(); if (it.action) it.action();
  },
  update(dt) {
    if (!this.active || !this.def) return;
    const I = Input, d = this.def, n = d.items.length;
    if (d.live) d.live();
    if (this.stickDot) this.stickDot.style.transform = `translate(calc(-50% + ${I.rawL[0] * 4.2}vh), calc(-50% + ${-I.rawL[1] * 4.2}vh))`;
    if (d.scrollBody && this.bodyEl && (I.nav.up || I.nav.down) && n <= 1) { this.bodyEl.scrollBy({ top: (I.nav.down ? 1 : -1) * 90, behavior: 'smooth' }); return; }
    if (I.nav.up) { this.sel = (this.sel - 1 + n) % n; Snd.menu(); this.refresh(); }
    if (I.nav.down) { this.sel = (this.sel + 1) % n; Snd.menu(); this.refresh(); }
    if (I.nav.left) this.adjust(-1);
    if (I.nav.right) this.adjust(1);
    if (I.p.confirm) this.activate();
    else if (I.p.back || (d.pauseBack && I.p.pause)) { Snd.back(); this.back(); }
  },
};

/* ============================== screens ============================== */
const ABOUT_TEXT = "TAILFOX 64 - THE LANTERN WING\nAn original spiritual successor to Starfox 64 (N64). Single-file HTML demo.\n\nSOURCE INFORMATION\n- Date: 2026-10-20 14:26\n- Source: Starfox 64 for N64\n- Game title: Tailfox 64 (picked at random by code from 50 brainstormed riffs on the source name)\n- Tech: Three.js 0.160.0 (WebGL) loaded from the jsDelivr CDN together with its EffectComposer, RenderPass, UnrealBloomPass and OutputPass addons; hand-written vanilla JavaScript (ES module, modules bundled into one HTML file by a small Python script); Web Audio API for all sound and music (procedural synth and 16th-note sequencer); Gamepad API (PS5 DualSense, standard mapping, dual-rumble); localStorage for settings. No other engine or library.\n- Art Direction: Low-poly, flat-shaded N64-inspired look with modern lighting: sun shadow maps, fog, vertex-colored procedural terrain, additive particle explosions, bloom glow, canvas-drawn comm portraits and a large-type 10-foot DOM HUD and menu system.\n- Animation: Fully procedural and code-driven (no keyframed assets): rail-relative enemy path functions, steering behaviours for all-range dogfights, damped camera and ship motion, tweened UI, typewriter comm text and a pooled GPU point-sprite particle system.\n- Testing: The prompt said to write no tests and do no tests, because testing is done separately. The game was not run or played by the author. The only check performed was a JavaScript syntax parse of the bundled script at build time.\n- Environment: Claude Code CLI (headless); Linux; browser unknown\n- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium\n- Usage: unknown (no cost, token or session-time telemetry was available to the model)\n\nENGINE FEEDBACK\nThere is no game engine in the usual sense here. The \"engine\" is Three.js plus the browser platform APIs.\n- What did you like most about the engine? Three.js gets a convincing N64-meets-modern look from very little code: flat-shaded standard materials, a shadow-casting sun, fog and a bloom composer. A single CDN import also makes one-file sharing easy.\n- Did you get stuck or guess wrong? I could not run anything, so every API detail was reasoned rather than verified (Object3D.lookAt facing +Z, Euler order for flight attitude, shadow-camera projection needing an explicit update, particle shader attributes, audio autoplay rules when only a gamepad is used). I caught a few of these in review; others may still be wrong.\n- What was the most important thing you had to build yourself? The whole gameplay layer: a rail-relative enemy director and level script, free-flight all-range mode, charge and lock-on shooting, boss state machines, collisions, a procedural audio sequencer, the controller-first menu and HUD system, and the attract-mode pilot.\n- What was the hardest part about using the engine? Three.js has no entity, collision, input, UI or audio layer, so all of that is hand-rolled. Keeping many modules coherent in one shared scope without being able to execute them was the real difficulty.\n- If you had to remove or overhaul one thing from engine, what would that be? The split between the core build and the examples/jsm addons, which forces import maps and exact CDN version paths for something as basic as post-processing.\n- If you could change one thing about the engine, what would it be? A small built-in gameplay layer (entities, pooling, simple collision queries, input mapping) so a vertical slice does not start from a blank page.\n\nPROMPT FEEDBACK\n[PROMPT] Build an original spiritual successor to Starfox 64 as a feature-complete single-file HTML demo with attract mode, controller-first 10-foot UX, axis-invert toggles and touch-only messaging.\n- What did you like most about this prompt? Concrete, checkable requirements (10-second attract mode, invert toggles, touch-only message, exact filename and report sections) alongside full freedom over tech and art, and the reference list that sets the bar for \"feature-complete demo\".\n- What was confusing? The word SOURCE is used as a placeholder in the file name and in the title instruction. The Source Information template has an unlabeled \"Starfox 64 for N64\" line. \"Silently brainstorm 50 titles\" is hard to square with reporting the pick. Usage and session time were requested although no telemetry exists. \"No tests\" sits next to \"no stubs\", which cannot be verified without running the game.\n- What was the hardest thing to do? Delivering a full vertical slice (two flight modes, two boss fights, rescue event, menus, settings, attract AI, procedural audio) in one pass without ever executing it.\n- If there was one test you could of run, what would that test be? A headless-browser smoke run that lets the attract mode play through all four stage segments, fails on any console error, and screenshots each boss phase, plus a scripted gamepad session that walks every menu.\n";
const App = { mode: 'title', idle: 0, last: 0, touchOnly: false, touchSettings: false, attract: null, titleT: 0 };

  const txt = [
    'The Gloam Dominion is anchoring its Leviathan carrier over Halcyon Reach. As <b>Ember</b>, lead of the Lantern Wing, you will skim the sea, thread the Gate Cut Canyon, crack the Bastion Walker, then take the fight to the Leviathan in all-range combat.',
    'Fly through <b>gold rings</b> to repair, <b>blue rings</b> for nova bombs and <b>green pods</b> to upgrade your laser.',

    items: [
      { label: 'Start mission', kind: 'button', action: () => UI.show(briefingMenu(0), true) },

      { label: 'Controls', kind: 'button', action: () => UI.show(controlsMenu(), true) },

      { label: 'About / credits', kind: 'button', action: () => UI.show(aboutMenu(), true) },

}
function pauseMenu() {
  return {
    title: 'Paused', sub: STAGES[Math.min(G.cp, 3)].name, cls: '', pauseBack: true, onBack: resumeGame,
    items: [

      { label: 'Controls', kind: 'button', action: () => UI.show(Object.assign(controlsMenu(), { onBack: () => UI.show(pauseMenu()) })) },

function pauseGame() { if (G.state !== 'play') return; G.state = 'paused'; Snd.charge(false); UI.show(pauseMenu()); }

UI.showGameOver = function () {
  UI.show({
    title: 'Mission Failed', sub: 'Lantern Wing is counting on you, Ember', cls: 'solid',
    items: [
      { label: 'Retry from checkpoint', kind: 'button', action: () => { UI.closeAll(); fadeTo(() => startMission(G.cp)); } },
      { label: 'Restart mission', kind: 'button', action: () => { UI.closeAll(); fadeTo(() => startMission(0, { fresh: true })); } },

UI.showResults = function (r) {

      <tr><td>Score</td><td>${r.score.toLocaleString('en-US')}</td></tr><tr><td>Enemies downed</td><td>${r.kills} / ${r.spawned} (${Math.round(r.killPct * 100)}%)</td></tr>
      <tr><td>Best hit chain</td><td>${r.maxHits}</td></tr><tr><td>Rings collected</td><td>${r.rings} / ${r.ringsTotal}</td></tr>
      <tr><td>Damage taken</td><td>${r.dmg}</td></tr><tr><td>Flight time</td><td>${mm}:${ss}</td></tr></table>`,
    items: [
      { label: 'Fly again', kind: 'button', action: () => { UI.closeAll(); fadeTo(() => { UI.show(Object.assign(briefingMenu(0), { onBack: () => { UI.closeAll(); fadeTo(enterTitle); } })); }); } },
      { label: 'Back to title', kind: 'button', action: () => { UI.closeAll(); fadeTo(enterTitle); } },

function enterTitle() {
  resetEntities(); Comm.clear();
  Object.assign(G, { demo: false, cheat: false, state: 'off', mode: 'rail', railZ: -60, speed: 40, whiteout: 0, finished: false });
  Input.ai = null; App.mode = 'title'; App.idle = 0; App.titleT = 0; App.attract = null;
  HUD.show(false); World.setMode('rail'); setEnv('sea'); Music.set('title'); makeAllies();
  Object.assign(P, { dead: false, laser: 3, hp: 100, max: 100, locks: [], charging: false, rollT: 0, boosting: false, braking: false, lx: 0, ly: 0, inv: 0 });

function titleScene(dt) {

  P.lx = Math.sin(t * 0.5) * 5; P.ly = Math.sin(t * 0.7) * 2.5; P.pos.set(P.lx, P.ly, G.railZ);
  P.mesh.position.copy(P.pos); P.mesh.rotation.set(Math.sin(t * 0.7) * 0.05, 0, Math.cos(t * 0.5) * 0.35, 'YXZ');
  const fl = P.mesh.userData.flames; if (fl) fl.forEach((c) => c.scale.set(1, 1.1 + Math.random() * 0.4, 1));
  const back = V3(0, 0, 4).applyQuaternion(P.mesh.quaternion).add(P.pos); Fx.emit(back, 1, { color: 0x66ccff, speed: 3, size: 1, life: 0.3, drag: 3 });
  updateAlliesRail(dt);
  World.update(camera, G.railZ);

  camera.position.set(P.pos.x + Math.sin(a) * 21, P.pos.y + 4 + Math.sin(t * 0.4) * 2, P.pos.z + Math.cos(a) * 21 - 4);
  camera.up.set(0, 1, 0); camera.lookAt(P.pos); camera.translateX(-6.5);
  updateEnvFollow(camera); sun.position.copy(P.pos).addScaledVector(SUN_DIR, 220); sun.target.position.copy(P.pos); sun.target.updateMatrixWorld();
  Fx.update(dt);
}

/* ============================== attract mode ============================== */
const ATTRACT = [{ cp: 0, dur: 36 }, { cp: 1, dur: 30 }, { cp: 2, dur: 40 }, { cp: 3, dur: 44 }];
function startAttract(seg = 0) {
  UI.closeAll(); $('logo').style.display = 'none'; $('titleHint').style.display = 'none';
  App.mode = 'attract'; App.attract = { seg, t: 0, switching: false };
  G.demoEnded = false; startMission(ATTRACT[seg].cp, { demo: true });
  G.state = 'play'; Input.activity = false;
}
function endAttract() { Input.ai = null; G.demo = false; G.cheat = false; fadeTo(enterTitle, 300); App.mode = 'transition'; }
function updateAttract(dt) {
  const A = App.attract;
  if (Input.activity || Input.anyPressed) { endAttract(); return; }
  updateGame(dt); A.t += dt;
  if (!A.switching && (A.t > ATTRACT[A.seg].dur || G.demoEnded)) {
    A.switching = true; $('fade').style.opacity = 1;
    setTimeout(() => { if (App.mode !== 'attract') return; const next = (A.seg + 1) % ATTRACT.length; startAttract(next); $('fade').style.opacity = 0; }, 600);
  }
}

/* ============================== main loop ============================== */
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, ((now - App.last) / 1000) || 0.016); App.last = now;
  Input.update(dt);
  bloom.enabled = S.bloom;
  const blocked = App.touchOnly && !Input.hasKey && !Input.hasPad && !App.touchSettings;
  $('touch').style.display = blocked ? 'flex' : 'none';
  if (!blocked) {
    if (App.mode === 'title') {
      titleScene(dt); UI.update(dt);
      if (Input.activity || Input.anyPressed || Input.nav.up || Input.nav.down) App.idle = 0; else App.idle += dt;
      if (App.idle >= 10) startAttract(0);
    } else if (App.mode === 'attract') updateAttract(dt);
    else if (App.mode === 'play') {
      if (UI.isOpen()) UI.update(dt);
      else if (G.state === 'play' && Input.p.pause) pauseGame();
      if (G.state === 'play' || G.state === 'ended') updateGame(dt);
    }
  } else if (App.mode === 'title') titleScene(dt);
  if (Input.activity) Input.activity = false;
  composer.render();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && App.mode === 'play' && G.state === 'play' && !UI.isOpen()) pauseGame(); });

function boot() {
  Input.init(); HUD.init(); UI.init();
  P.mesh = Mdl.hero(); scene.add(P.mesh); addShadow(P.mesh);
  App.touchOnly = !window.matchMedia('(any-pointer: fine)').matches && (navigator.maxTouchPoints > 0 || 'ontouchstart' in window);
  $('touchSettings').addEventListener('click', () => {
    App.touchSettings = true; $('touch').style.display = 'none';
    UI.show(settingsMenu(() => { App.touchSettings = false; UI.show(titleMenu()); }));
  });
  World.init(); enterTitle();
  const first = () => { Snd.init(); window.removeEventListener('pointerdown', first); };
  window.addEventListener('pointerdown', first);
  requestAnimationFrame((t) => { App.last = t; frame(t); });
}
boot();
