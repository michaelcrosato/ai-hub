al-ring":{id:"seal-ring",name:"Cracked seal-ring",text:"Warm as a held coin. The letters inside the band refuse to finish themselves."},"oath-cord":{id:"oath-cord",name:"Buried oath-cord",text:"Serath's. Knotted the way a vow is knotted when it expects dirt. Not jewelry."},"veil-map":{id:"veil-map",name:"Veil map",text:"A stair drawn in the margin, where Maelis says honest things hide."},"torn-index":{id:"torn-index",name:"Torn index leaf",text:"Greyhollow's entry was already a smear. You made the smear portable."},"true-name":{id:"true-name",name:"Slip of a true name",text:"Ilen Marr, copied until the ink believed it. Keep it in a pocket that closes."},candle:{id:"candle",name:"Vigil candle",text:"Unburned on purpose. Calder said the point was the standing, not the flame."},"ash-page":{id:"ash-page",name:"Ash of a page",text:"A street reduced to something that dirties a pocket. Calder will not call it courage."},"seal-watch":{id:"seal-watch",name:"Seal of the Watch",text:"Ugly because it is true. It answers a hand that will stand a wall.",seal:!0},"seal-ink":{id:"seal-ink",name:"Seal of Ink",text:"It smudges if the hand is dishonest. It is not a souvenir.",seal:!0},"seal-names":{id:"seal-names",name:"Seal of Names",text:"A key that opens mouths. Wear it as a medal and it sulks.",seal:!0}},Ur=["seal-watch","seal-ink","seal-names"];function k0(e){return Ur.filter(t=>e.includes(t)).length}O();O();function S(e,t){return{speaker:e,text:t}}var A0=[{id:"tower",label:"Climb the ash watchtower",hint:"Serath's seal is a wall, not a crown.",to:"c4-watch",visible:{k:"not",of:{k:"flag",key:"route-watch"}},req:{k:"all",of:[{k:"not",of:{k:"flag",key:"gave-reliquary"}},{k:"any",of:[{k:"flag",key:"knows-oath"},{k:"bond",who:"serath",min:18},{k:"item",id:"oath-cord"}]}]},locked:"The stair stays shut. Serath trusts it to keepers who still carry the reliquary, and who have earned the cord or his buried truth."},{id:"stair",label:"Take the veil stair",hint:"Maelis keeps a seal that smu he archive into the sky with Maelis.",hint:"Every lost thing comes back. Dignity is not invited.",to:"end-vein",req:{k:"all",of:[{k:"item",id:"seal-ink"},{k:"bond",who:"maelis",min:40},{k:"not",of:{k:"flag",key:"stole-ink"}}]},locked:"Maelis will not open the sky with a hand she cannot trust, or without the ink-seal."},{id:"names",label:"Read the names back with Calder.",hint:"No legend. Breakfast, ferries, streets.",to:"end-names",req:{k:"all",of:[{k:"item",id:"seal-names"},{k:"bond",who:"calder",min:34},{k:"not",of:{k:"flag",key:"burned"}},{k:"not",of:{k:"flag",key:"hoarded"}}]},locked:"Calder will read the names back only beside a keeper who did not burn them or pocket them."},{id:"hollow",label:"Take the crown for yourself.",hint:"Let the realm forget in your direction.",to:"end-hollow"},{id:"leave",label:"Turn down the mile.",hint:"Keep your feet. Miss the hour.",to:"end-forgotten"}],Vp=[{id:"p-bell",chapter:"Prologue \u2014 The Tongue-less Bell",place:"Greyhollow Nave",bg:"nave",enter:[{k:"flag",key:"met-lira",value:!0}],lines:[S("narrator","Greyhollow keeps one bell, and the bell keeps no tongue. At the blue hour it rings anyway: metal knocking on a word that left."),S("lira","You are Lira Voss, relic-keeper. You sleep above the chest where the parish stores what it cannot name \u2014 a glove with no hand, a hymn with no saint, a ring that warms the wrong finger."),S("narrator","Tonight the candles lean toward the altar as if the draft had chosen a favorite. The seal-ring on the cloth is cracked. The crack looks like a mouth that has not decided whether to confess.")],choices:[{id:"take",label:"Pocket the ring.",hint:"If it is speaking, it should not do it unattended in a church.",to:"p-take",effects:[{k:"item",id:"seal-ring",gain:!0},{k:"stat",key:"ambition",delta:1}]},{id:"leave",label:"Cover it and leave it on the altar.",hint:"Some mouths are safer shut.",to:"p-leave",effects:[{k:"flag",key:"left-ring",value:!0},{k:"stat",key:"mercy",delta:1},{k:"bond",who:"calder",delta:6}]},{id:"listen",label:"Put the ring to your ear.",hint:"You will not unknow whatever answers.",to:"p-listen",effects:[{k:"item",id:"seal-ring",gain:!0},{k:"flag",key:"heard-whisper",value:!0},{k:"stat",key:"memory",delta:1}]}]},{id:"p-take",chapter:"Prologue \u2014 The Tongue-less Bell",place:"Greyhollow Nave",bg:"nave",next:"p-road",lines:[S("lira","You close your hand. The band is blood-warm, and the letters cut inside it almost become a name, then think better of it."),S("narrator","The bell stops. Offended, or paid. You put the ring in the pocket that does not have a hole, and you go out before the nave can argue.")]},{id:"p-leave",chapter:"Prologue \u2014 The Tongue-less Bell",place:"Greyhollow Nave",bg:"nave",next:"p-road",lines:[S("narrator","You fold the altar cloth over the ring until the mouth is only a wrinkle. Some sentences are holier unfinished."),S("narrator","The bell rings once more, softer, the way a person lowers their voice in a sickroom. The door opens on ash that has not been invited.")]},{id:"p-listen",chapter:"Prologue \u2014 The Tongue-less Bell",place:"Greyhollow Nave",bg:"nave",next:"p-road",lines:[S("narrator","You lift the ring to your ear. A whisper borrows your mouth. It says a name you have never learned, then takes the shape of the name back. Your teeth ache with the almost."),S("lira","You do not drop the ring. It knows you heard. The bell stays still, as if something in the dark has turned to listen to you instead.")]},{id:"p-road",chapter:"I \u2014 Ash on the Mile",place:"The North Mile",bg:"road",enter:[{k:"flag",key:"met-serath",value:!0}],lines:[S("narrator","Beyond the lychgate the north mile is a pale scar. Ash falls with no fire under it. Where the mile-stone should wear a number, a man waits in a half-helm beaded with soot."),S("serath","Relic-keeper. The Watch posted me to see your chest shut. Bells that ring without tongues are how a town forgets it is a town."),S("lira","The Watch shut three valleys. They are quiet now. Quiet is not the same thing as kept."),S("serath","I had a name for this post. I buried it so the Crown would not eat it off my tongue. Do not make me dig it up with my hands.")],choices:[{id:"give",label:"Give him the reliquary key.",hint:"Let the Watch carry the chest. Your pocket gets lighter by one duty.",to:"c1-give",effects:[{k:"flag",key:"gave-reliquary",value:!0},{k:"item",id:"reliquary",gain:!1},{k:"bond",who:"serath",delta:8},{k:"stat",key:"ambition",delta:-1}]},{id:"refuse",label:"Refuse the order.",hint:"You are not the Watch's lid.",to:"c1-refuse",effects:[{k:"flag",key:"refused-watch",value:!0},{k:"bond",who:"serath",delta:14}]},{id:"ask",label:"Ask what he buried.",hint:"The question is not gentle. He may answer it anyway.",to:"c1-ask",effects:[{k:"flag",key:"knows-oath",value:!0},{k:"bond",who:"serath",delta:16},{k:"item",id:"oath-cord",gain:!0}]}]},{id:"c1-give",chapter:"I \u2014 Ash on the Mile",place:"The North Mile",bg:"road",next:"c1-echo",lines:[S("narrator","You put the reliquary key in his glove. It looks smaller there, which is a kind of insult, which is also a kind of relief."),S("serath","Then the burden has a wall. If the hill still calls, it is no longer calling you. Do not come up my stair and ask to borrow it back."),S("narrator","He does not send you home. The road has other ideas, and your pocket is lighter by exactly one duty. The ash keeps its quota.")]},{id:"c1-refuse",chapter:"I \u2014 Ash on the Mile",place:"The North Mile",bg:"road",next:"c1-echo",lines:[S("lira","If I shut the chest, the bell will only learn a new way to knock. I am not the Watch's lid."),S("narrator","Serath studies the ash on your sleeve as if it were a report. The respect arrives before the warmth does, and it arrives armed."),S("serath","Spine noted. If you climb anywhere with my mark on it, climb because you mean to stand, not to be seen standing.")]},{id:"c1-ask",chapter:"I \u2014 Ash on the Mile",place:"The North Mile",bg:"road",next:"c1-echo",lines:[S("lira","What did you bury, under that gorget? The road is already full of unnamed things."),S("narrator","The question is not gentle. He treats it gently anyway. From under the gorget he draws a cord knotted the way vows are knotted when they expect dirt."),S("serath","The name of the post, and the promise that I would not wear a crown even if it offered to be useful. Take the cord. If you carry it, do not use it as jewelry.")]},{id:"c1-echo",chapter:"I \u2014 Ash on the Mile",place:"The North Mile",bg:"road",enter:[{k:"flag",key:"met-echo",value:!0}],lines:[S("narrator","A figure stands in the ash and does not disturb it. Ilen Marr kept the ferry. Ilen Marr has been dead since the first valley went quiet."),S("echo","They took the ferry's name. The boat still crosses. It simply does not know for whom. Do you hear the water, keeper? It says please.")],choices:[{id:"promise",label:"Promise the ferry will be spoken again.",hint:"Ferries do not get to become rumors.",to:"c1-promise",effects:[{k:"flag",key:"ferry-promise",value:!0},{k:"stat",key:"mercy",delta:1}]},{id:"question",label:"Ask what the Crown takes first.",hint:"You want the order of the meal, not a comfort.",to:"c1-question",effects:[{k:"flag",key:"crown-lesson",value:!0},{k:"stat",key:"memory",delta:1}]},{id:"cold",label:"Walk through the place where he is not standing.",hint:"Assessment is a kind of weather.",to:"c1-cold",effects:[{k:"flag",key:"cold-road",value:!0},{k:"stat",key:"ambition",delta:1}]}]},{id:"c1-promise",chapter:"I \u2014 Ash on the Mile",place:"The North Mile",bg:"road",next:"c2-door",lines:[S("lira","Then it will be spoken again. Ferries do not get to become rumors."),S("narrator","Ilen smiles with a mouth that is mostly weather. For a moment the ash falls around a shape, not through it. Then the mile is empty, and the road downhill smells, absurdly, like a river.")]},{id:"c1-question",chapter:"I \u2014 Ash on the Mile",place:"The North Mile",bg:"road",next:"c2-door",lines:[S("lira","What does it take first?"),S("echo","The small names. The ones used at tables. It saves the grand ones for dessert. If you forget that order, you will think you are winning when you are only being seasoned.")]},{id:"c1-cold",chapter:"I \u2014 Ash on the Mile",place:"The North Mile",bg:"road",next:"c2-door",lines:[S("narrator","You walk through the place where a person is not standing. The cold that follows is not weather. It is the feeling of having been correctly assessed."),S("narrator","Behind you, something like a ferry rope creaks, though there is no water for miles.")]},{id:"c2-door",chapter:"II \u2014 Index of Unkept Things",place:"Under the Choir",bg:"archive",next:"c2-maelis",lines:[S("narrator","Under the choir, a stair pretends to be a crack. At the bottom, lamps burn green as bottles washed up from a better century. The air is indexed. Even the dust has a number."),S("maelis","You are loud. Even your silences have margins.")]},{id:"c2-maelis",chapter:"II \u2014 Index of Unkept Things",place:"Under the Choir",bg:"archive",enter:[{k:"flag",key:"met-maelis",value:!0}],lines:[S("maelis","I am Maelis Thorn. I keep what the realm misplaces, and I charge the traditional fee."),S("maelis","One memory. A small one. The color of a door. The name of a dog. I do not take the people. People spoil in the catalog."),S("narrator","She has ink to the second knuckle and a veil of thin pages. One eye is visible. It is the color of a lamp that has decided to be patient.")],choices:[{id:"trade",label:"Trade the color of your childhood door.",hint:"A room will leave you politely, the way a guest leaves before the argument.",to:"c2-trade",effects:[{k:"flag",key:"traded-door",value:!0},{k:"stat",key:"memory",delta:-1},{k:"bond",who:"maelis",delta:18},{k:"item",id:"veil-map",gain:!0}]},{id:"ask-price",label:"Ask what the fee becomes.",hint:"You want the ledger, not the comfort.",to:"c2-ask",effects:[{k:"flag",key:"asked-price",value:!0},{k:"bond",who:"maelis",delta:8}]},{id:"steal",label:"Tear the index where Greyhollow should be.",hint:"She will let you. That is not the same as mercy.",to:"c2-steal",effects:[{k:"flag",key:"thief",value:!0},{k:"stat",key:"ambition",delta:1},{k:"bond",who:"maelis",delta:-8},{k:"item",id:"torn-index",gain:!0}]}]},{id:"c2-trade",chapter:"II \u2014 Index of Unkept Things",place:"Under the Choir",bg:"archive",next:"c3-parish",lines:[S("narrator","You give her the door from when you were small: blue, with a chip in the paint like a bite. The room that held it leaves you politely."),S("maelis","Generous. Most people pretend they do not remember colors, as if gray were a personality."),S("narrator","She slides a map across the table. The path to the veil stair is drawn in the margin, where honest things hide.")]},{id:"c2-ask",chapter:"II \u2014 Index of Unkept Things",place:"Under the Choir",bg:"archive",lines:[S("lira","What does the fee become, after you take it?"),S("maelis","A line. Lira Voss, once knew a blue door. You will feel a room go missing. Most people call that growing up. I call it rent.")],choices:[{id:"pay",label:"Pay the rent.",hint:"Blue leaves you. The map stays.",to:"c2-pay",effects:[{k:"flag",key:"traded-door",value:!0},{k:"stat",key:"memory",delta:-1},{k:"bond",who:"maelis",delta:18},{k:"item",id:"veil-map",gain:!0}]},{id:"decline",label:"Misplace things the old way. On foot.",hint:"No map. She will call it antique.",to:"c2-decline",effects:[{k:"flag",key:"no-map",value:!0},{k:"bond",who:"maelis",delta:-2}]},{id:"margin",label:"Read the margin while the price is still in the air.",hint:"You asked first. She will count that, and she will not forgive it.",to:"c2-margin",effects:[{k:"flag",key:"thief",value:!0},{k:"stat",key:"ambition",delta:1},{k:"bond",who:"maelis",delta:-2},{k:"item",id:"torn-index",gain:!0}]}]},{id:"c2-pay",chapter:"II \u2014 Index of Unkept Things",place:"Under the Choir",bg:"archive",next:"c3-parish",lines:[S("narrator","You pay. Blue goes out of you like a bruise being returned to the table that made it. The room is gone. The map is precise."),S("maelis","I will not thank you. Thanking would be a second transaction.")]},{id:"c2-decline",chapter:"II \u2014 Index of Unkept Things",place:"Under the Choir",bg:"archive",next:"c3-parish",lines:[S("lira","Then I will misplace things the old way. On foot."),S("maelis","How antique. Try not to become an entry. The interesting ones always do, and they are so tedious about it.")]},{id:"c2-margin",chapter:"II \u2014 Index of Unkept Things",place:"Under the Choir",bg:"archive",next:"c3-parish",lines:[S("narrator","You ask the price, and then you read the margin while the price is still in the air. She lets you. That is worse than being caught."),S("maelis","At least you inquired before you sinned. The page is yours. I have already written you down as a person who checks the bill and then climbs out the window.")]},{id:"c2-steal",chapter:"II \u2014 Index of Unkept Things",place:"Under the Choir",bg:"archive",next:"c3-parish",lines:[S("narrator","You tear the index where Greyhollow should be. The entry is only a smear, as if the town has been practicing absence."),S("maelis","You read like someone who will be indexed under Loss, with a cross-reference to Nerve. Take the leaf. I want to see what you do with a map you did not earn.")]},{id:"c3-parish",chapter:"III \u2014 Parish of Unsaid Things",place:"Parish of Unsaid Things",bg:"parish",enter:[{k:"flag",key:"met-calder",value:!0}],lines:[S("narrator","Brother Calder is copying by a candle he has not lit. His head is bare in a ring of stubborn hair. The book is full of names written twice: once in a clerk's hand, once in a hand that wants them back."),S("calder","The Crown is not a king. Kings can be buried. It is an appetite with a liturgy. I was its clerk. Now I copy until my hand forgets how to lie."),S("calder","If you are here to be forgiven, the parish is out of that. If you are here to work, sit.")],choices:[{id:"copy",label:"Copy a name until the ink believes it.",hint:"The ferry-keeper. Your wrist will hate it before your heart agrees.",to:"c3-copy",effects:[{k:"flag",key:"copied",value:!0},{k:"stat",key:"mercy",delta:2},{k:"bond",who:"calder",delta:18},{k:"item",id:"true-name",gain:!0}]},{id:"burn",label:"Burn the page he will not turn.",hint:"Your hand can be steady and still be wrong.",to:"c3-burn",effects:[{k:"flag",key:"burned",value:!0},{k:"stat",key:"mercy",delta:-1},{k:"stat",key:"ambition",delta:2},{k:"bond",who:"calder",delta:-14},{k:"item",id:"ash-page",gain:!0}]},{id:"vigil",label:"Keep a vigil. Offer no hymn.",hint:"Witness is a kind of ink. The theologians are not invited.",to:"c3-vigil",effects:[{k:"flag",key:"vigil",value:!0},{k:"stat",key:"mercy",delta:1},{k:"bond",who:"calder",delta:14},{k:"item",id:"candle",gain:!0}]}]},{id:"c3-copy",chapter:"III \u2014 Parish of Unsaid Things",place:"Parish of Unsaid Things",bg:"parish",next:"c3-fork",lines:[S("narrator","You sit. The name is Ilen Marr, and your wrist hates it before your heart agrees. You write until the letters stop looking like costume jewelry and start looking like a man who kept a ferry."),S("calder","Dawn finds the candle still unlit and the slip warm. Hold it in a pocket that closes. The Crown listens for names said carelessly in the street.")]},{id:"c3-burn",chapter:"III \u2014 Parish of Unsaid Things",place:"Parish of Unsaid Things",bg:"parish",next:"c3-fork",lines:[S("narrator","There is a page he will not turn. You turn it. A street is there, and people who are now only margins. You put the corner to the unlit candle until the candle remembers fire."),S("calder","You will call that courage because your hand is steady. Wash it. Ash in a pocket is still a stolen grave.")]},{id:"c3-vigil",chapter:"III \u2014 Parish of Unsaid Things",place:"Parish of Unsaid Things",bg:"parish",next:"c3-fork",lines:[S("narrator","You do not take the pen. You stand where the parish is coldest, which is near the truth, and you stay while Calder copies. Neither of you offers a hymn. The unlit candle is a third person who also refuses to perform."),S("calder","Witness is a kind of ink. Do not tell the theologians. And eat something later. Holiness skips meals and then makes it everyone else's problem.")]},{id:"c3-fork",chapter:"III \u2014 Parish of Unsaid Things",place:"Before the Hill",bg:"parish",lines:[S("narrator","Outside, the hill has grown more doorways than a hill deserves. Root knocks against bell-metal somewhere under the turf, patient as a debt."),S("narrator","You can still hunt a seal the Crown cannot counterfeit. Or you can decide that walking is a kind of answer.")],choices:A0},{id:"c3-return",chapter:"IV \u2014 Seals in the Hill",place:"Before the Hill",bg:"parish",lines:[S("narrator","You come down by a path that was not there on the way up. Cold wax, crushed thyme, and the sense of being counted."),S("narrator","The hill is still offering doors. Fewer, if you have been honest about which ones you already opened.")],choices:A0},{id:"c4-watch",chapter:"IV \u2014 Seals in the Hill",place:"Ash Watchtower",bg:"watch",lines:[S("narrator","The watchtower's battlements are broken into a grin. Serath stands in the gap the wind uses most. He does not look surprised, which means he has been rehearsing this with the part of him he buried."),S("serath","The Watch-seal answers a hand that will stand a wall. Not rule it. Not wave from it. If you came to be taller than other people, the stair is the wrong height.")],choices:[{id:"stand",label:"Stand the wall with him.",hint:"If the crown comes up this road, it can argue with two of you.",to:"c4-stand",effects:[{k:"flag",key:"stood-watch",value:!0},{k:"flag",key:"route-watch",value:!0},{k:"bond",who:"serath",delta:16},{k:"item",id:"seal-watch",gain:!0}]},{id:"command",label:"Take the seal. You will decide the wall.",hint:"Useful voices sound like the officers he buried his name to avoid.",to:"c4-command",effects:[{k:"flag",key:"took-command",value:!0},{k:"flag",key:"route-watch",value:!0},{k:"bond",who:"serath",delta:-8},{k:"stat",key:"ambition",delta:2},{k:"item",id:"seal-watch",gain:!0}]},{id:"leave-wall",label:"Leave him the seal and the gap.",hint:"A wall that needs you to be its idea is just a taller person.",to:"c4-leave-wall",effects:[{k:"flag",key:"left-seal-watch",value:!0},{k:"flag",key:"route-watch",value:!0},{k:"bond",who:"serath",delta:8}]}]},{id:"c4-stand",chapter:"IV \u2014 Seals in the Hill",place:"Ash Watchtower",bg:"watch",next:"c3-return",lines:[S("lira","Then I stand it with you. If the crown comes up this road, it can argue with two of us and a very old habit."),S("narrator","He laughs once. The helm cracks a hairline, as if laughter were a tool the armor had not been issued."),S("serath","Take the seal. It is ugly because it is true. When the throne offers you a head-shaped excuse, remember the wind up here has a job, and so do you.")]},{id:"c4-command",chapter:"IV \u2014 Seals in the Hill",place:"Ash Watchtower",bg:"watch",next:"c3-return",lines:[S("lira","Give me the seal. Walls are wasted on people who wait for permission to hold them."),S("serath","There it is. The useful voice. It sounds like every officer I buried my name to avoid."),S("narrator","He hands you the brand anyway, because spite is not his religion. The metal is cold in a way that feels like a test you have already half-failed.")]},{id:"c4-leave-wall",chapter:"IV \u2014 Seals in the Hill",place:"Ash Watchtower",bg:"watch",next:"c3-return",lines:[S("lira","Keep it. A wall that needs me to be its idea is just a taller person."),S("serath","Then go down still yourself. If you wear anything today, let it not be my duty with your face painted on.")]},{id:"c4-veil",chapter:"IV \u2014 Seals in the Hill",place:"The Veil Stair",bg:"veil",lines:[S("narrator","The veil stair is a spiral of pages that have given up being books. Maelis waits on a landing that should not hold weight. She holds a drawer shut with two fingers, which is theater, which is also a lock."),S("maelis","The ink-seal smudges if the hand is dishonest. I find that funny, given the supplier. It is the seal, not a souvenir. Decide what you are paying with.")],choices:[{id:"pay-ink",label:"Pay with the sound of the bell, before it lost its tongue.",hint:"Another memory. The morning in you will go flat.",to:"c4-pay-ink",effects:[{k:"flag",key:"route-veil",value:!0},{k:"stat",key:"memory",delta:-1},{k:"bond",who:"maelis",delta:14},{k:"item",id:"seal-ink",gain:!0}]},{id:"bargain",label:"Offer the torn index as if paper could repent.",hint:"Half-honest. The seal may be insulted and impressed.",to:"c4-bargain",visible:{k:"item",id:"torn-index"},effects:[{k:"flag",key:"ink-bargain",value:!0},{k:"flag",key:"route-veil",value:!0},{k:"bond",who:"maelis",delta:6},{k:"item",id:"seal-ink",gain:!0}]},{id:"steal-ink",label:"Take the seal while she corrects a misspelled mercy.",hint:"Loss, cross-reference Nerve.",to:"c4-steal-ink",effects:[{k:"flag",key:"stole-ink",value:!0},{k:"flag",key:"route-veil",value:!0},{k:"bond",who:"maelis",delta:-18},{k:"stat",key:"ambition",delta:2},{k:"item",id:"seal-ink",gain:!0}]}]},{id:"c4-pay-ink",chapter:"IV \u2014 Seals in the Hill",place:"The Veil Stair",bg:"veil",next:"c3-return",lines:[S("narrator","You give her the sound of Greyhollow's bell from before it lost its tongue. It leaves you. The morning in your memory goes flat, a picture with the music lifted out."),S("maelis","Now we are accomplices. Try to survive the classification. I will not wipe the ink off your palm. That would be tenderness, and tenderness needs a receipt.")]},{id:"c4-bargain",chapter:"IV \u2014 Seals in the Hill",place:"The Veil Stair",bg:"veil",next:"c3-return",lines:[S("narrator","You offer the torn index as if paper could repent. She reads her own theft in your hand and is, annoyingly, a little moved."),S("maelis","Half-honest. The seal is insulted and impressed, which is the only marriage that lasts. Do not expect a second ceremony.")]},{id:"c4-steal-ink",chapter:"IV \u2014 Seals in the Hill",place:"The Veil Stair",bg:"veil",next:"c3-return",lines:[S("narrator","When she turns to correct a page that has misspelled the word mercy, your hand is already in the drawer. The seal sits in your fist like a caught bird that is actually a knife."),S("maelis","Ah. Loss, cross-reference Nerve. I will write the ending without you, if the ending lets me.")]},{id:"c4-crypt",chapter:"IV \u2014 Seals in the Hill",place:"Name-Crypt",bg:"crypt",lines:[S("narrator","The crypt's niches are labeled in a clerk's abbreviations, then corrected in a shaking hand. Calder stands among them without awe. Awe is how the Crown taught him to behave, and he has resigned."),S("calder","Say a name and it leaves my book. The appetite hates a word that is being used. Unused words are how it seasons the meal.")],choices:[{id:"speak",label:"Speak Ilen Marr into the crypt.",hint:"Not loudly. Loudly is for people who want credit.",to:"c4-speak",visible:{k:"item",id:"true-name"},effects:[{k:"flag",key:"route-crypt",value:!0},{k:"stat",key:"mercy",delta:1},{k:"bond",who:"calder",delta:14},{k:"item",id:"seal-names",gain:!0}]},{id:"witness",label:"Ask him to speak it. You will be the one who heard.",hint:"So it cannot crawl back into the margin and pretend.",to:"c4-witness",visible:{k:"flag",key:"vigil"},effects:[{k:"flag",key:"witnessed",value:!0},{k:"flag",key:"route-crypt",value:!0},{k:"stat",key:"mercy",delta:1},{k:"bond",who:"calder",delta:14},{k:"item",id:"seal-names",gain:!0}]},{id:"hoard",label:"Keep a name in your pocket as leverage.",hint:"Thieves and saints share a pocket. You know this. You hate that you know this.",to:"c4-hoard",effects:[{k:"flag",key:"hoarded",value:!0},{k:"flag",key:"route-crypt",value:!0},{k:"stat",key:"ambition",delta:2},{k:"bond",who:"calder",delta:-6},{k:"item",id:"seal-names",gain:!0}]}]},{id:"c4-speak",chapter:"IV \u2014 Seals in the Hill",place:"Name-Crypt",bg:"crypt",next:"c3-return",lines:[S("narrator","You speak Ilen Marr into the crypt, not loudly. The niches answer with a draft that smells like wet rope and ordinary mornings."),S("calder","The seal of names is yours. Do not wear it as a medal. It is a key that only opens mouths. The book can rest.")]},{id:"c4-witness",chapter:"IV \u2014 Seals in the Hill",place:"Name-Crypt",bg:"crypt",next:"c3-return",lines:[S("lira","Then you speak it. I will be the person who heard, so it cannot crawl back into the margin and pretend."),S("narrator","He says the ferry-keeper's name like a man setting down a stone he has carried in his mouth. You do not look away, which is the whole price."),S("calder","Witness accepted. Take the seal. And then go eat.")]},{id:"c4-hoard",chapter:"IV \u2014 Seals in the Hill",place:"Name-Crypt",bg:"crypt",next:"c3-return",lines:[S("narrator","You fold the page instead of speaking. A name in a pocket is leverage. You hate that you know this, which does not stop the knowing."),S("calder","Thieves and saints share a pocket. The seal will go with you because the book is done being a cage. I am done pretending I can tell, from the back of a neck, which one you are.")]},{id:"c5-throne",chapter:"V \u2014 The Root Throne",place:"The Root Throne",bg:"throne",enter:[{k:"flag",key:"met-crown",value:!0}],lines:[S("narrator","There is no door you remember using. The room is a throat of black root. In the middle, a stump worn smooth by knees. Above it hangs a crown of antler woven through bell-metal, wearing no one."),S("narrator","The Hollow Crown speaks with every voice you did not save, braided until they become polite."),S("crown","Keeper. You arrived with pockets full of almost. I can set the realm's forgotten name back onto a tongue. I only need a head to hang it on. Kneel, or name a stranger price, or be dull and leave.")],choices:jp},{id:"end-cinders",chapter:"Epitaph",place:"The Root Throne",bg:"throne",ending:"crown-of-cinders",lines:[S("narrator","You set the three seals into the stump. They seat themselves with the sound of a key finding a lock it has been flirting with for years. The crown is lighter than a grudge."),S("narrator","You sit. Greyhollow's bell grows a tongue, and the tongue is your voice used for other people's mornings. The ferry starts charging the correct fare. Cups remember whose lips they were thrown for."),S("narrator","No one remembers the woman in the loft. When they feel grateful, they thank the bell. The bell, to its credit, does not correct them."),S("lira","The last thing you keep is the weight of the crown, and then even that becomes public property.")]},{id:"end-realm",chapter:"Epitaph",place:"The Root Throne",bg:"throne",ending:"the-realm-speaks",lines:[S("narrator","You do not sit. You break the crown across the stump the way a bell finally agrees to be struck for the right reason. The whisper from the nave runs into the three seals and becomes weather."),S("narrator","Names fall back into cups, boats, arguments, the stupid lovely business of living. Serath laughs, and the helm gives up a crack it was saving for a war. Maelis catalogs the sound and, for once, pays a fee. Calder closes the book and does not open a new one."),S("lira","You keep your own name. That is the part they will argue about in kitchens, which is the correct place for theology."),S("narrator","Ash stops falling. Somewhere a ferry rope goes taut, and a living hand \u2014 not yours, not Ilen's \u2014 takes it.")]},{id:"end-vein",chapter:"Epitaph",place:"The Veil Stair",bg:"veil",ending:"open-vein",lines:[S("maelis","Do not be kind about this. Kindness will try to edit. We are done editing."),S("narrator","She takes your hand, not kindly. Together you open the archive into the sky. Lost things return in a rush that does not care about your dignity: wars, recipes, dogs' names, the color of every door including the one you sold."),S("narrator","People weep with recognition and with overload. The Crown starves, which is not the same as dying, but it is a start. The realm will be true, and unbearable, and in need of clerks who know when to close a book."),S("lira","You walk with the archivist. She does not offer a contract. She offers the next margin, and your name is still in your mouth when you answer.")]},{id:"end-watch",chapter:"Epitaph",place:"The North Mile",bg:"watch",ending:"last-watch",lines:[S("narrator","You and Serath set the Watch-seal into the mile-stone where a number used to be. The crown comes down the road like a procession of antlers and finds a wall where it expected a brow."),S("narrator","It breaks the way ice breaks on a shield: complete, loud, and done. What remains of the Watch is small and stubborn and sometimes wrong. It does not eat names to stay clean."),S("serath","Stay if you are staying. The wind has a job. So do we. The number on the road will not be holy. It will be enough."),S("lira","You stay. The cord is not jewelry. The wall is not a legend. Your name is still yours, and it fits in an ordinary mouth.")]},{id:"end-names",chapter:"Epitaph",place:"Parish of Unsaid Things",bg:"parish",ending:"names-returned",lines:[S("narrator","You and Calder read until morning is embarrassed to be seen. Name after name, used, ordinary, returned to mouths that still have bread in them. The crown, denied a single heroic brow, frays into twigs."),S("calder","No legends before breakfast. The ferry can remember Ilen without a plaque. If you stay, someone has to brew something and tell the next clerk to sit down."),S("narrator","Greyhollow's bell goes quiet. For once, quiet means rest, not a removed tongue. You sleep without a loft full of unnamed gloves."),S("lira","You dream of nothing useful. It is the best dream you have had in years.")]},{id:"end-hollow",chapter:"Epitaph",place:"The Root Throne",bg:"throne",ending:"hollow-coronation",lines:[S("narrator","You take the crown without enough honesty to make it fit, and it fits anyway. Of course it fits. Greyhollow kneels in a way that turns your stomach into a throne room."),S("narrator","Names still go missing. They go missing in your direction. Maelis writes your new title and hates her handwriting. Serath does not draw the sword. That is the injury: not the blade, the refusal to spend it on you."),S("crown","There. Was that so difficult? You may ring the bell whenever you are bored. We will call it music if you insist."),S("lira","You rule a realm that cannot remember why it should refuse. The crown is light. Your name is heavier than it was this morning, and less yours.")]},{id:"end-forgotten",chapter:"Epitaph",place:"The North Mile",bg:"road",ending:"unremembered",lines:[S("narrator","You turn down the road. Ash fills your footprints with professional care. Behind you the bell tries your name and misses by one honest syllable."),S("narrator","The crown will find a less interesting head. It is not a picky eater. Years later a traveler asks Greyhollow what it used to be called, and the town smiles with all its remaining teeth and says: we are getting by."),S("lira","You keep your pockets, your feet, and a quiet that does not bless you. Sometimes, at blue hour, you hear a ferry. You never turn around fast enough to see the water.")]}],je={};for(let e of Vp){if(je[e.id])throw new Error(`duplicate scene ${e.id}`);je[e.id]=e}function O0(){return{sceneId:"",line:0,flags:{},bonds:{lira:0,serath:12,maelis:12,calder:10,crown:0,echo:0},stats:{mercy:1,ambition:1,memory:5},items:["reliquary"],chapter:"Prologue",place:"Greyhollow",bg:"nave",log:[],decisions:[],seen:[],endingId:null}}function z0(e,t){if(!t?.length)return e;let l={...e,flags:{...e.flags},bonds:{...e.bonds},stats:{...e.stats},items:[...e.items]};for(let a of t)if(a.k==="flag")l.flags[a.key]=a.value;else if(a.k==="bond"){let n=(l.bonds[a.who]??0)+a.delta;l.bonds[a.who]=Math.max(0,Math.min(100,n))}else if(a.k==="item")a.gain?l.items.includes(a.id)||l.items.push(a.id):l.items=l.items.filter(n=>n!==a.id);else if(a.k==="stat"){let n=l.stats[a.key]+
