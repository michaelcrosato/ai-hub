<script>
/* Bundled source: vendor/engine.js */
/*!
my-3D2dge AGENT EDITION v0.17.2: the essential engine in one file, for AI coding agents
https://github.com/michaelcrosato/my-3d2dge (MIT License)

Retro-modern 2D games drawn entirely by code: no image or sound files, no dependencies, no network.
This is a curated subset of the full engine (dist/my-3d2dge.js). A game written against this file runs
unchanged on the full engine, which adds lighting, props, parallax backdrops, touch controls, camera
zoom and turn, dialog portraits, x-ray silhouettes, recorded play sessions that replay exactly, and more.

AGENTS: this header is the whole manual. Build games from it; you do not need to read the code below.
Read a section only to debug: each starts with "// ---- N. NAME" (grep "// ---- 10." for the Humanoid).

## Host it
<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}
#screen{width:100%;height:100%;display:block;image-rendering:pixelated}</style></head>
<body><canvas id="screen"></canvas><script src="my-3d2dge-agent.js"><\/script><script src="game.js"><\/script></body></html>
For a single-file game, paste both scripts inline. Start every game with: const E = My3D2dge;

LOCAL EXTENSION (city-audit.2): Renderer.rig and actor cacheKey/revision options need
this patched engine or the same extension in the full edition. Ordinary r.actor
without those options retains its original API. Call rig.invalidate() after edits
to rig options or colours that happen outside Humanoid.update.

## Mental model
- The world is 3D: x east, y south, z up; one tile = 16 units. Game logic uses world units and dt, never pixels.
- A view projects the world to the screen. 'iso' (Diablo), 'threequarter' (Zelda), 'topdown', 'brawler' (Final
  Fight), 'side' (Mario: x right, z up, y = 0), 'overhead' (shmups, puzzles: world x/y = screen pixels once you call
  game.focus(W / 2, H / 2)). The same game runs in every view. In ground views, turn the stick or keys into a world
  direction with game.view.screenDirToGround(mx, my).
- update(dt) runs in fixed steps of about 1/120 s. Read input only there.
- draw(r) order: backgrounds first (r.sky, map.drawFloor + map.queueWalls, level.draw), then everything that can
  overlap through r.actor / r.sprite / r.queue (depth sorted), then the HUD through r.text / r.overlay (screen pixels).
- Characters are procedural rigs posed every step (E.Humanoid, E.Blob) or string sprites (E.sprite).
- Draw only with E.px, E.font, E.ui and r.*: they snap to whole pixels. ctx.arc / stroke / fillText and canvas
  gradients blur the pixel look.
- Errors show in a red box on screen and in the console; warnings start with "my-3D2dge:". Fix the first one first.

## Quick start: a complete game (title, play, win or lose)
```js quickstart
(() => {
const E = My3D2dge;
const game = new E.Game({ canvas: 'screen', res: 'ps1', view: 'threequarter', views: ['threequarter', 'iso', 'topdown'] });
const map = new E.TileMap({
  rows: ['################',
         '#@.....#.......#',
         '#......#...s...#',
         '#..s.......##..#',
         '#......~~.....s#',
         '################'],
  legend: { '#': 1, '@': 'hero', s: 'slime', '~': { floor: 'water', block: true } },   // number = wall type, string = spawn tag
  types: { 1: { h: 28, top: '#7a7090', side: '#4a4560', cut: true } },   // cut: walls in front of the floor drop low
  floorTex: (x, y, tag) => tag === 'water' ? E.tex.water(x, y) : E.tex.grass(x, y)
});
const flow = new E.FlowField(map);
let hero, rig, sword, slimes, hp, msg = '';
const title = {
  update() { if (game.input.pressed('start')) game.go('play'); },
  draw(r) {
    r.sky(['#101848', '#5a3a80']);
    r.overlay(g => E.font.title(g, 'SLIME FIELD', r.W / 2, 70, { scale: 3, align: 'center' }));
    r.text('PRESS ENTER', r.W / 2, 150, '#ffffff', { align: 'center', shadow: '#000', outline: false });
  }
};
const play = {
  pausable: true,
  enter() {
    const s = map.find('hero');
    hero = new E.Body({ x: s.x, y: s.y, r: 5 }); hero.facing = 0; hero.hurt = 0; hp = 3;
    rig = new E.Humanoid({ size: 1.3, outfit: 'tunic', hat: 'cap', colors: { cloth: '#3a8a4a', hair: '#e0b040' } });
    sword = new E.Attack('slash');
    slimes = map.findAll('slime').map(p => ({ body: new E.Body({ x: p.x, y: p.y, r: 6 }), rig: new E.Blob(), hp: 3, hit: 0 }));
    game.cam.bounds = v => map.bounds(v); game.follow(hero);
    game.audio.music('adventure');
  },
  update(dt) {
    const inp = game.input, m = inp.move(), d = game.view.screenDirToGround(m[0], m[1]);   // screen push -> ground direction
    hero.vx = d[0] * 85; hero.vy = d[1] * 85; hero.update(dt, map);
    if (Math.hypot(d[0], d[1]) > .1) hero.facing = Math.atan2(d[1], d[0]);
    if (inp.buffered('attack') && sword.start()) { inp.consume('attack'); game.audio.sfx('swing'); }
    sword.update(dt);
    sword.hits(slimes, s => E.inArc(hero, hero.facing, s.body, 24, 1.3), s => {
      s.hp--; s.hit = .15; E.knockback(hero, s.body, 200, 80);
      game.hitFx(s.body.x, s.body.y, 8, { damage: 1, angle: hero.facing });
    });
    flow.update(hero.x, hero.y); hero.hurt -= dt;
    for (const s of slimes) {
      const dir = flow.dir(s.body.x, s.body.y, hero.x, hero.y);
      s.body.vx = E.approach(s.body.vx, dir[0] * 30, 300 * dt); s.body.vy = E.approach(s.body.vy, dir[1] * 30, 300 * dt);
      s.body.update(dt, map); s.hit -= dt;
      s.rig.update(dt, { look: dir, squash: Math.sin(game.time * 9 + s.body.x) * .15 });
      if (E.overlap(hero, s.body) && hero.hurt <= 0) { hp--; hero.hurt = 1; E.knockback(s.body, hero, 220); game.audio.sfx('hurt'); game.shake(3); }
      if (s.hp <= 0) game.particles.explosion(s.body.x, s.body.y, 6, .7);
    }
    E.prune(slimes, s => s.hp <= 0);
    rig.update(dt, { x: hero.x, y: hero.y, z: hero.z, vx: hero.vx, vy: hero.vy, facing: hero.facing, attack: sword.state, hurt: hero.hurt > .7 });
    if (hp <= 0) game.go('end', 'GAME OVER'); else if (!slimes.length) game.go('end', 'YOU WIN');
  },
  draw(r) {
    map.drawFloor(r); map.queueWalls(r);                                   // background first, then depth-sorted things
    r.shadow(hero.x, hero.y, 6);
    r.actor(hero.x, hero.y, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view), { alpha: hero.hurt > 0 ? .6 : 1 });
    for (const s of slimes) {
      r.shadow(s.body.x, s.body.y, 6);
      r.actor(s.body.x, s.body.y, s.body.z, (g, ox, oy) => s.rig.draw(g, ox, oy, r.view), { flash: s.hit > 0 && '#ffffff' });
    }
    r.overlay(g => E.ui.hearts(g, 6, 6, hp, 3));                        // HUD in screen pixels
  }
};
const end = {
  enter(text) { msg = text; game.audio.music(null); game.audio.sfx(text === 'YOU WIN' ? 'powerup' : 'die'); },
  update() { if (game.input.pressed('start')) game.go('title'); },
  draw(r) { r.sky(['#000000', '#301830']); r.text(msg, r.W / 2, 100, '#ffe08a', { align: 'center', scale: 2 }); }
};
game.start({ scene: 'title', scenes: { title, play, end } });
})();
```

## API
Game: new E.Game({ canvas: 'screen', res, view, views, input, bg })
  res: 'nes' 256x240 | 'snes' 256x224 | 'genesis' 320x224 | 'gb' 160x144 | 'gba' 240x160 | 'ps1' 320x240 | 'wide' 400x225 | [w, h]
  input: 'DEFAULT' | 'PLATFORMER' | 'SHMUP' | your own { action: ['KeyQ', 'Pad0', 'Mouse0'] }
  start({ update(dt), draw(r) }) or start({ scene: 'title', scenes: { title: {...}, play: {...} } })
  scene: { enter(data), exit(), update(dt), draw(r), pausable, view, views, input, res }; go(name, data, { fade: .22 })
  camera: follow(obj, { z: 16, lead }) once, or focus(x, y, z) every update; cam.bounds = v => map.bounds(v);
    cam.room = [w, h] for screen-by-screen rooms (cam.moving is true while it slides); cam.smooth = .18 (0 = locked)
  juice: hitFx(x, y, z, { power: 1, damage, angle, color, sound }), freeze(s), shake(n), flash(color, s), timeScale = .25
  timers in game time: after(s, fn), every(s, fn) -> { cancel() }, cleared on scene change
  also: setView(id), nextView() (cycles views), note(text, s), mouseGround() -> [x, y] or null
  fields: W, H, time, real, paused, input, audio, particles, view, cam, errors
Input (game.input): down(a) held, pressed(a) this step only, released(a), repeat(a, delay .3, rate .08) for menus,
  buffered(a, window .15) + consume(a) for combat, consumeAll(), anyPressed(), move() -> [x, y] on screen (length <= 1)
  every preset: up down left right (WASD, arrows, d-pad), start (Enter), pause (Esc, P), confirm (Enter, Space, J, Z),
    cancel (Esc, Backspace, X, K); the gamepad d-pad, A, B and Start work too, and its left stick moves
  DEFAULT: attack (J, X, click), dash (Space, Shift, K), skill (L, E, right click), jump (Z)
  PLATFORMER: jump (Space, Z, K), attack (X, J, click), dash (Shift, C, L), skill (E, V)
  SHMUP: fire (Space, Z, J, click), bomb (X, K, right click)
Drawing (r in draw(r); r.W, r.H = screen size in pixels)
  r.sky(['#top', '#mid', '#bottom']); r.starfield({ count: 70, speed: 30, dir: 'down' | 'up' | 'left' | 'right', height: 0..1 })
  r.actor(x, y, z, (g, ox, oy) => rig.draw(g, ox, oy, r.view), { outline: true, flash: '#ffffff', flashMix: .5, alpha, bias })
  r.sprite(x, y, z, spr, { anchor: 'bottom' | 'center' | 'top', flip, flash, outline, alpha })
  r.queue(x, y, z, g => {...}, { bias }) for any depth-sorted drawing; inside it r.box(g, x0, y0, z0, x1, y1, z1, top, side)
  r.shadow(x, y, radius, alpha .5, color, surfaceZ); floor marks: r.decal(() => r.groundDisc(x, y, rad, color, alpha)),
    r.groundRing(x, y, rad, color, alpha), r.groundArc(x, y, r0, r1, a0, a1, color, alpha)
  r.text(str, x, y, color, opts); r.textAt(x, y, z, str, color); r.overlay(g => {...}); r.glowDisc(g, x, y, rad, color, 0..1)
  r.w(x, y, z) -> [px, py] where a world point lands; r.visible(x, y, z); r.view
Pixels (g is a canvas context from r.queue, r.overlay or r.actor): E.px.rect(g, x, y, w, h, c), dot(g, x, y, c),
  line(g, x0, y0, x1, y1, c, width), disc(g, x, y, r, c), ell(g, x, y, rx, ry, c), poly(g, [[x, y], ...], c),
  polyDither(g, pts, c, alpha), ddisc(g, x, y, r, c, alpha), blend(g, alpha, 'add' | 'multiply' | 'screen' | 'normal', () => {...}),
  sprite(g, spr, x, y, flip). Colors are '#rrggbb' or '#rgb'.
Sprites: const COIN = E.sprite(['.yy.', 'yYYy', '.yy.'], { y: '#f0b020', Y: '#fff0a0' }, scale); '.' and ' ' are clear
Text: E.font.text(g, str, x, y, color, { outline: '#0b0814' | false, shadow, gradient: [top, bottom], scale, align, wrap: px })
  -> { w, h }; E.font.title(g, str, x, y, { scale: 3, colors: [top, ..., bottom], depth, align }); E.font.width(str, opts),

## Recipes
Side-scroller (Mario, Mega Man): PlatformMap + Platformer + Humanoid, view 'side'.
```js platformer
(() => {
const E = My3D2dge;
const game = new E.Game({ canvas: 'screen', res: 'snes', view: 'side', views: ['side', 'brawler'], input: 'PLATFORMER' });
const level = new E.PlatformMap({
  rows: ['                                  ',
         '               ?                  ',
         '        ===             ==        ',
         '  @           g     ^^       g  F ',
         '#################  ###############'],
  legend: { '#': 1, '=': 2, '?': 3, '^': 4, '@': 'hero', g: 'walker', F: 'flag' },
  types: { 1: { style: 'ground', side: '#8a5a32' }, 2: { kind: 'oneway' }, 3: { style: 'bonus', side: '#e8a830' }, 4: { kind: 'hazard' } }
});
const start = level.find('hero'), flag = level.find('flag');
const hero = new E.Platformer({ x: start.x, z: start.z });
const rig = new E.Humanoid({ hat: 'cap', weapon: null, colors: { cloth: '#d83a2a', pants: '#3050c0' } });
const foes = level.findAll('walker').map(p => ({ x: p.x, z: p.z, w: 12, h: 12, vx: 0, vz: 0, dir: -1, rig: new E.Blob({ feet: true, colors: { base: '#a06030', dk: '#5a3018', lt: '#d09060' } }) }));
game.cam.bounds = v => level.bounds(v);
game.particles.ground = (x, y, z) => level.groundBelow(x, z);           // sparks and debris land on platforms
game.start({
  update(dt) {
    hero.update(dt, level, game.input);
    if (hero.jumped) game.audio.sfx('jump');
    if (hero.bumped && level.types[hero.bumped.id].style === 'bonus') { level.set(hero.bumped.cx, hero.bumped.cz, 1); game.audio.sfx('coin'); game.particles.glints(hero.x, 0, hero.z + 30, 6); }
    if (level.touching(hero, 'hazard') || hero.z < -40) { Object.assign(hero, { x: start.x, z: start.z, vx: 0, vz: 0 }); game.audio.sfx('hurt'); }
    for (const f of foes) {
      f.vz -= 800 * dt; f.vx = f.dir * 25; level.move(f, dt);
      const ahead = level.groundBelow(f.x + f.dir * 8, f.z);
      if (f.hitWall || ahead === null || ahead < f.z - 4) f.dir = -f.dir;   // turn at walls and ledges
      f.rig.update(dt, { look: [f.dir, 0], walk: 1 });
      if (!f.dead && E.overlapBox(hero, f)) {
        if (hero.vz < 0 && hero.z > f.z + f.h / 2) { f.dead = true; hero.vz = 220; game.audio.sfx('stomp'); game.particles.dust(f.x, 0, f.z, 8); }
        else { hero.knock(hero.x < f.x ? -1 : 1); game.audio.sfx('hurt'); }
      }
    }
    E.prune(foes, f => f.dead);
    if (Math.abs(hero.x - flag.x) < 8) { game.audio.sfx('powerup'); Object.assign(hero, { x: start.x, z: start.z }); }
    rig.update(dt, hero.rigState());
    game.focus(hero.x, 0, hero.z + 24);                                   // side view: y = 0, z is up
  },
  draw(r) {
    r.sky(['#5c94fc', '#a8c8ff']);
    level.draw(r);
    r.queue(flag.x, 0, flag.z, g => { const [x, y] = r.w(flag.x, 0, flag.z); E.px.rect(g, x, y - 40, 2, 40, '#e8e8e8'); E.px.poly(g, [[x + 2, y - 40], [x + 14, y - 35], [x + 2, y - 30]], '#40c040'); });
    for (const f of foes) r.actor(f.x, 0, f.z, (g, ox, oy) => f.rig.draw(g, ox, oy, r.view));
    r.actor(hero.x, 0, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view));
  }
});
})();
```
Shoot-'em-up (1942): view 'overhead', sprites, Bullets, a starfield.
```js shmup
(() => {
const E = My3D2dge, W = 224, H = 256;
const game = new E.Game({ canvas: 'screen', res: [W, H], view: 'overhead', views: ['overhead'], input: 'SHMUP' });
const SHIP = E.sprite(['...w...', '..wbw..', '.wwbww.', 'wwrwrww', 'w..r..w'], { w: '#e8f0ff', b: '#3a7aff', r: '#ff5030' }, 2);
const FOE = E.sprite(['r.....r', '.rrrrr.', 'rryyyrr', '.r.r.r.'], { r: '#d03040', y: '#ffd040' }, 2);
const shots = new E.Bullets(game), ship = { x: W / 2, y: H - 30, r: 4 }, foes = [];
let score = 0, cool = 0, spawn = 0;
game.start({
  update(dt) {
    game.focus(W / 2, H / 2);                                            // overhead: world x/y = screen pixels
    const m = game.input.move();
    ship.x = E.clamp(ship.x + m[0] * 120 * dt, 8, W - 8); ship.y = E.clamp(ship.y + m[1] * 120 * dt, 8, H - 8);
    if ((cool -= dt) <= 0 && game.input.down('fire')) { cool = .12; shots.fire({ x: ship.x, y: ship.y - 10, vy: -300, team: 'player' }); game.audio.sfx('shoot'); }
    if ((spawn -= dt) <= 0) { spawn = .9; foes.push({ x: E.rand(20, W - 20), y: -10, r: 7, hp: 3, t: 0 }); }
    for (const f of foes) {
      f.t += dt; f.y += 40 * dt; f.x += Math.sin(f.t * 3) * 40 * dt;
      if (E.chance(dt * .6)) shots.burst({ x: f.x, y: f.y, team: 'foe', color: '#ff6080' }, [E.pattern.aim(f, ship, 90)]);
    }
    shots.update(dt);
    shots.hit(foes, (b, f) => { f.hp--; game.particles.sparks(b.x, b.y, 0, 4); }, 'player');
    for (const f of foes) if (f.hp <= 0) { score += 100; game.particles.explosion(f.x, f.y, 0, .8); }
    E.prune(foes, f => f.hp <= 0 || f.y > H + 20);
    if (shots.hit([ship], () => {}, 'foe')) { game.flash('#ff4040', .2); game.audio.sfx('hurt'); score = 0; }
  },
  draw(r) {
    r.sky(['#000010', '#101040']); r.starfield({ dir: 'down', speed: 40 });
    for (const f of foes) r.sprite(f.x, f.y, 0, FOE, { anchor: 'center' });
    r.sprite(ship.x, ship.y, 0, SHIP, { anchor: 'center' });
    shots.draw(r);
    r.text('SCORE ' + score, 4, 4, '#ffffff', { shadow: '#000', outline: false });
  }
});
})();

## Rules
1. World units and dt everywhere. Feel numbers (units per second, tile = 16): walk 70-90, run 95-140, jump 250-320
   with gravity 800, dash 200-260, player bullets 250-320, enemy bullets 70-120, enemies 25-45.
2. At 320x240, heroes are 40-60 px tall (Humanoid size 1.2-1.4), bosses size 1.8-2.4; hitboxes smaller than the art.
3. Every hit gets game.hitFx; deaths get particles.explosion; sounds on jump, hit, pickup and death; music per scene.
4. A title scene, play scenes with pausable: true, and a game-over or win path back to the title.
5. Dress every character (outfit, hat, colors) and give each its own moves; enemies wind up slower than the hero.
6. Nothing on screen? The camera looks elsewhere: game.follow(hero) or game.focus(...) every update (side: y = 0).

 updateRigs(dt){

 objective(){if(this.S.area==='yard')return this.pin||this.training.objective();if(this.S.area==='waterworks'&&this.S.tracked!=='waterline')return {...C.areas.waterworks.exit,title:'Return to Lyrra',text:'Your tracked task is outside the Pump House.'};if(this.S.area==='archive'&&!['main','medicine'].includes(this.S.tracked))return {x:160,y:254,z:0,title:'Return to the city',text:'Your city task is outside. Use the archive stairs.'};return this.pin||this.questObjective(this.S.tracked);}

 drawGuardCone(r,g){

 drawToken(r,p,kind,color){

   else if(kind==='alarm'||kind==='cut'){const a=r.w(p.x,p.y,p.z+24);px.line(g,q[0],q[1],a[0],a[1],kind==='cut'?'#7c9081':'#c8b98e',2);px.disc(g,a[0],a[1],5,color);if(kind==='cut')px.line(g,a[0]-6,a[1]+5,a[0]+5,a[1]-6,'#c3c6a9');}
   else {px.poly(g,[[q[0]-5,q[1]-5],[q[0]+6,q[1]-5],[q[0]+5,q[1]+2],[q[0]-6,q[1]+2]],color);px.line(g,q[0]-3,q[1]-2,q[0]+3,q[1]-2,'#827861');}
  },{bias:this.world.actorBias(p.x,p.y,p.z,r.view)+.3});
 }
 drawMarker(r,p,color,guide){

 };}

   for(const [s,x,y]of[['SUN COURT',190,85],['THE OLD COURT',448,408],['CLOTH MARKET',360,700],['CUSTOMS',904,113],['SOUTH QUAY',223,748],['THE NINTH BELL',223,310]])g.fillText(s,ox+x*scale,oy+y*scale);
  }else{
   for(let y=0;y<a.world.map.h;y++)for(let x=0;x<a.world.map.w;x++)if(a.world.map.cell(x,y)>0)rect(x*16,y*16,16,16,'#778275');
  }
  const markers=a.markers();
  for(const p of markers){
   const x=ox+p.x*scale,y=oy+p.y*scale;
   const color={main:'#815824',active:'#286d69',quest:'#367a6e',seal:'#836f40',rest:'#467d5d',shop:'#685b44'}[p.kind]||'#448077';
   g.fillStyle=color;g.strokeStyle='#efdcaa';g.lineWidth=2;
   if(p.kind==='seal'){g.beginPath();g.arc(x,y,4,0,Math.PI*2);g.strokeStyle=color;g.stroke();}
   else if(p.kind==='rest'){g.fillRect(x-2,y-7,4,14);g.fillRect(x-7,y-2,14,4);}
   else if(p.kind==='ferry'){g.fillStyle='#467c87';g.fillRect(x-7,y-3,14,6);g.beginPath();g.moveTo(x-7,y+3);g.lineTo(x,y+8);g.lineTo(x+7,y+3);g.fill();}
   else if(p.kind==='shop'){g.fillRect(x-6,y-6,12,12);g.strokeRect(x-6,y-6,12,12);}
   else{g.beginPath();g.moveTo(x,y-8);g.lineTo(x+7,y);g.lineTo(x,y+8);g.lineTo(x-7,y);g.closePath();g.fill();g.stroke();}
  }
  const b=a.hero,x=ox+b.x*scale,y=oy+b.y*scale;g.save();g.translate(x,y);g.rotate(b.facing+Math.PI/2);g.fillStyle='#f0e0b1';g.strokeStyle='#273f3e';g.lineWidth=3;g.beginPath();g.moveTo(0,-10);g.lineTo(7,8);g.lineTo(0,4);g.lineTo(-7,8);g.closePath();g.fill();g.stroke();g.restore();
  if(a.S.escort.active){g.fillStyle='#2b755f';g.beginPath();g.arc(ox+a.witness.x*scale,oy+a.witness.y*scale,5,0,Math.PI*2);g.fill();}
  g.strokeStyle='#6b7760';g.lineWidth=2;g.strokeRect(12,12,cv.width-24,cv.height-24);g.fillStyle='#66745c';g.font='13px Georgia';g.textAlign='left';g.fillText('N ↑',31,38);g.textAlign='right';g.font='11px Verdana';g.fillText('THE FREE COAST',cv.width-30,cv.height-25);
  cv.onclick=ev=>{
   const bnd=cv.getBoundingClientRect(),px=(ev.clientX-bnd.left)*cv.width/bnd.width,py=(ev.clientY-bnd.top)*cv.height/bnd.height,wx=(px-ox)/scale,wy=(py-oy)/scale;
   const p=markers.slice().sort((p,q)=>Math.hypot(wx-p.x,wy-p.y)-Math.hypot(wx-q.x,wy-q.y))[0];
   if(p&&Math.hypot(wx-p.x,wy-p.y)<25){if(p.quest)a.track(p.quest);else if(p.kind==='main')a.track('main');else a.pin={...p,title:p.title||'Route mark',text:'Pinned on your city chart.'};}
   else if(wx>=16&&wy>=16&&wx<width-16&&wy<height-16){const z=a.world.map.heightAt(wx,wy);a.pin={x:wx,y:wy,z,title:'Route mark',text:'Pinned on your city chart.'};}
   this.hideOverlay();
  };
 }
 puzzle(){
  this.signs=['sun','sun','sun'];
  this.show('puzzle','A promise kept in stone',`<p class="lede">First the warmth. Then the crossing. Last the way home.</p><p>Turn each sign. The three stone clues in your journal give the order.</p><div class="seal-lock">${[0,1,2].map(i=>`<button data-sign="${i}" aria-label="Turn sign ${i+1}"><b>☼</b><span>SUN</span></button>`).join('')}</div><p class="puzzle-message" id="puzzle-message">Nothing is lost when the signs are wrong.</p>`,[{label:'Open the old trust',stay:true,run:()=>{
   if(this.app.checkOath(this.signs)){this.dialog({name:'The old trust',title:'THE OLD OATH'},['Sun. Wave. Star. The lock opens. Inside, a guild charm lies beside one hundred crowns.','The charm lengthens your focus. The trust is yours to carry.'],[{label:'Keep the promise'}]);}
   else this.overlay.querySelector('#puzzle-message').textContent='The stone stays shut. Check the three clues in your journal.';
  }},{label:'Leave the lock'}]);
  const words=['sun','wave','moon','star'],glyphs={sun:'☼',wave:'≈',moon:'☾',star:'✧'};
  this.overlay.querySelectorAll('[data-sign]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sign;this.signs[i]=words[(words.indexOf(this.signs[i])+1)%words.length];b.querySelector('b').textContent=glyphs[this.signs[i]];b.querySelector('span').textContent=this.signs[i].toUpperCase();this.app.sound('select');});
 }
 failure(){
  this.show('failure','The watch closes in.',`<p class="lede">The night is not over.</p><p>Return to your saved safe position. Completed stories, choices, collected items, and purchased tools stay in the save.</p>`,[{label:'Return to the safe point',run:()=>this.app.retry()},{label:'Return to title',run:()=>this.app.game.go('title',null,{fade:.2})}],{noClose:true,kicker:'RETRY · THE SALT LEDGER'});
 }
 victory(){
  const a=this.app,s=a.S,f=s.flags,rank=s.stats.alerts===0?'GHOST OF LYRRA':a.book.completed()>=5?'A FRIEND OF THE CITY':'COURIER OF THE FREE COAST';
  const story=f.choices.ink==='publish'?'By morning, Vel’s proof will be on every wall. The names in the ledger will have witnesses.':f.choices.ink==='erase'?'Vel will erase the false debts before the first shift. No new list will put the workers at risk.':'Iven will carry the ledger beyond the customs house. For once, its owners must answer for the numbers.';
  this.show('victory','Every name comes home.',`<div class="result-rank">${rank}</div><p class="lede">The ninth bell finds an empty desk. Your boat finds the open water.</p><p>${story}${f.marketAid?' Nera’s oven is lit again.':''}${s.escort.safe?' Daro is safe at the Open Door.':''}${s.waterline.choice==='public'?' Public taps are running across the city.':s.waterline.choice==='clinic'?' The night clinic has a permanent water line.':''}${s.quests.measure.done?' Bram’s yard is open to everyone.':''}${Object.keys(f.alarms).length===3&&!s.reinforced?' No alarm bell answered the theft.':''}</p><div class="result-grid"><div><b>${a.formatTime(s.finishedAt)}</b><small>THE NIGHT</small></div><div><b>${a.book.completed()} / ${C.questDefs.length}</b><small>CITY STORIES</small></div><div><b>${Object.keys(f.seals).length} / 8</b><small>HARBOUR SEALS</small></div><div><b>${s.stats.alerts}</b><small>PURSUITS</small></div></div><p class="muted">The city remains open. Return to finish its stories, read the notes, collect seals, or improve your roof-run medal.</p>`,[{label:'Return to Lyrra',run:()=>a.returnCity()},{label:'Start a new night',run:()=>this.confirmNew()},{label:'Export this night',stay:true,run:()=>this.exportSave()}],{noClose:true,kicker:'THE SALT LEDGER · COMPLETE'});
  document.body.dataset.mode='end';
 }
 hit(){const e=document.getElementById('hit-flash');if(!this.app.game.reduceMotion){e.classList.add('on');setTimeout(()=>e.classList.remove('on'),120);}}
 toast(title,text,kind){
  const stack=document.getElementById('toast-stack'),el=document.createElement('div');el.className='toast '+(kind==='warn'?'warn':'');el.innerHTML=`<strong>${esc(title)}</strong><span>${esc(text)}</span>`;
  stack.appendChild(el);while(stack.children.length>3)stack.firstChild.remove();setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),350);},5600);
 }
 refresh(force=false){
  const a=this.app;document.body.dataset.mode=a.mode;this.hud.hidden=a.mode==='title';
  if(a.mode==='title')return;
  const now=performance.now();if(!force&&now-this.lastRefresh<65)return;this.lastRefresh=now;
  const s=a.S,obj=a.objective();
  const text=(id,value)=>{const el=document.getElementById(id);if(el.textContent!==value)el.textContent=value;};
  text('task-type',a.pin?'ROUTE MARK':s.tracked==='main'?'THE SALT LEDGER':'CITY STORY');text('task-title',obj.title||'The city awaits');text('task-text',obj.text||'');
  text('main-mini',s.tracked==='main'?'':'MAIN · '+a.mainObjective().title);
  const health=document.getElementById('health'),key=s.hp+'/'+s.maxHp;
  if(health.dataset.value!==key){health.dataset.value=key;health.setAttribute('aria-label','Health '+s.hp+' of '+s.maxHp);health.innerHTML=Array.from({length:s.maxHp},(_,i)=>`<i class="heart ${s.hp-i>=1?'full':s.hp-i>=.5?'half':''}"></i>`).join('');}
  text('coins','◈ '+Math.floor(s.money)+' crowns');text('smoke','Q · '+s.smoke+' / '+a.smokeMax+' smoke');text('identity',s.heat>12?'NOTORIETY '+Math.ceil(s.heat)+' / 100':'A FACE IN THE CROWD');
  document.getElementById('focus-fill').style.width=s.focus*100+'%';
  const alert=document.getElementById('alert-hud');alert.classList.toggle('danger',a.alarm>.85);
  text('alert-label',a.alarm>.9?'PURSUIT':a.alarm>.6?'SEARCHING':a.alarm>.2?'WATCHFUL':a.inSmoke(a.hero)?'IN SMOKE':a.covered?'HIDDEN':a.crouched?'CROUCHED':'UNSEEN');
  text('cover-label',a.coverName||'');document.getElementById('alert-fill').style.width=a.alarm*100+'%';
  const context=document.getElementById('context');context.hidden=!!this.modal||!a.target||!!a.cinematic;
  if(a.target){text('context-label',a.target.name);text('context-detail',a.target.detail||(a.target.hold?'Hold E to complete this action.':'Press E.'));document.getElementById('hold-fill').style.width=(a.hold.id===a.target.id&&a.target.hold?Math.min(1,a.hold.time/a.target.hold)*100:0)+'%';}
  const race=document.getElementById('race-hud');race.hidden=!s.race.active&&!s.dispatch.active&&!s.waterline.tail.active&&!a.training.session;
  if(s.race.active){const html=`<small>AGAINST THE TIDE</small><b>${a.formatTime(60-s.race.time)}</b><small>${s.race.index} / 8 ROOF MARKS</small><div class="marks">${'◆'.repeat(s.race.index)}${'◇'.repeat(8-s.race.index)}</div>`;if(race.innerHTML!==html)race.innerHTML=html;}
  if(s.dispatch.active){const d=s.dispatch,html=`<small>A LETTER BEFORE DAWN</small><b>${a.formatTime(180-d.time)}</b><small>${d.index} / 3 HANDOFFS</small><div class="delivery-meter"><i style="width:${Math.round(d.exposure/3*100)}%"></i></div><small>${d.exposure>.1?'BREAK PURSUIT':'LETTER SEALED'}</small>`;if(race.innerHTML!==html)race.innerHTML=html;}
  if(s.waterline.tail.active){
   const t=s.waterline.tail,d=Math.round(root.BellSupport.distance(a.hero,t)),danger=t.attention>0.1;
   const html=`<small>A CLERK IN THE RAIN</small><b>${d}u</b><small>${t.statements.length} / 3 STATEMENTS</small><div class="delivery-meter"><i style="width:${Math.round((danger?t.attention/3:t.lost/10)*100)}%"></i></div><small>${danger?'HE IS NOTICING YOU':t.lost>1?'REGAIN SIGHT':t.pause>0?'LISTEN · KEEP YOUR DISTANCE':'KEEP 30–120 UNITS AWAY'}</small>`;
   if(race.innerHTML!==html)race.innerHTML=html;
  }
  if(a.training.session){const t=a.training.session,html=`<small>${t.trial?'THE MEASURE · '+a.formatTime(90-t.time):'SAFE COMBAT DRILL'}</small><b>${t.hits} / 2</b><small>${t.lesson+1} / 3 · ${['PARRY','HEAVY','DODGE'][t.lesson]}</small><small>${t.trial?t.errors+' / 5 ERRORS':'NO HEALTH OR CARGO LOSS'}</small>`;if(race.innerHTML!==html)race.innerHTML=html;}
  const work=document.getElementById('task-note');

  if(work.textContent!==workText)work.textContent=workText;
  const b=a.hero,name=s.area==='archive'?'THE CUSTOMS ARCHIVE':b.x>800?'THE EAST BANK':b.y>675?'SOUTH QUAY':b.y>530?'THE CLOTH MARKET':b.x<180&&b.y<420?'THE OLD GARDEN':b.y<245?'SUN COURT':b.z>90?'THE NINTH BELL':b.y<420?'THE OLD COURT':'THE HIGH ROAD';
  text('district-name',s.area==='city'?name:C.areas[s.area].name);
  const cargo=document.getElementById('cargo-hud');cargo.hidden=!s.cargo.taken||s.cargo.delivered;
  if(!cargo.hidden){text('cargo-title','MEDICINE CASE · '+s.cargo.integrity+' / 3 VIALS');text('cargo-detail',s.cargo.integrity?'Hits break glass. Elin waits on the South Quay.':'The sealed powders remain. Deliver the case to Elin.');}

 }
