  var nextProgress = null;

    crateBody.setTranslation({ x: d.crate.x, y: 0.62, z: d.crate.z }, true);
  for (const p of d.poses || [])
    if (p.id !== net.me) remotePoses.set(String(p.id), p);
  syncWorld();
  if (state.flags.won && modal !== "complete") showCompletion();
  renderHUD();
}
function animateNetworkEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) {
      e.object.visible = false;
      continue;
    }
    e.x = lerp(e.x, e.tx ?? e.x, Math.min(1, dt * 12));
    e.z = lerp(e.z, e.tz ?? e.z, Math.min(1, dt * 12));
    e.object.position.set(e.x, 0, e.z);
    e.object.rotation.y = Math.atan2(
      state.player.x - e.x,
      state.player.z - e.z
    );
    world.animateEnemy(e.object, time, {
      moving: true,
      attacking: e.windup > 0
    });
  }
}
function updateRemoteModels(dt) {
  for (const [id, p] of remotePoses) {
    if (Number(id) === net.me) continue;
    let m = remoteModels.get(id);
    if (!m) {
      const color = net.players.find((n2) => n2.id === Number(id))?.color || "#c1d4e3";
      m = world.makeRemote(color);
      m.position.set(p.x, 0, p.z);
      world.scene.add(m);
      remoteModels.set(id, m);
    }
    const moving = Math.hypot(m.position.x - p.x, m.position.z - p.z) > 0.05;
    m.position.x = lerp(m.position.x, p.x, Math.min(1, dt * 12));
    m.position.z = lerp(m.position.z, p.z, Math.min(1, dt * 12));
    m.rotation.y = p.yaw + Math.PI;
    world.animateEnemy(m, time, { moving });
  }
}
if (new URLSearchParams(location.search).get("qa") === "1")
  globalThis.ThornsQA = {
    teleport: (x, z, yaw = 0) => {
      setPlayer({ x, z, yaw });
      updateContext();
    },
    get target() {
      return interactTarget?.id;
    },
    step: (frames = 1) => {
      for (let i = 0; i < frames; i++) frame(last + 1e3 / 60);
      last = performance.now();
    },
    get input() {
      return { ...keys };
    },
    get movement() {
      return controller?.computedMovement();
    },
    get position() {
      return body?.translation();
    },
    get crate() {
      return crateBody?.translation();
    }
  };
globalThis.Thorns = {
  get state() {
    return state;
  },
  get mode() {
    return mode;
  },
  get modal() {
    return modal;
  },
  get renderer() {
    return renderer;
  },
  get enemies() {
    return enemies.map(({ id, type, x, z, hp, dead }) => ({
      id,
      type,
      x,
      z,
      hp,
      dead
    }));
  },
  get net() {
    return net;
  },
  get physics() {
    return physics;
  }
};
