/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

function councilPanel(){const s=game.state,r=s.rival;return `<section class="page-panel"><div class="page-heading"><div><div class="eyebrow">OTHER PEOPLE WITH CROWNS</div><h2>The wizard’s council</h2><p>Steel is persuasive. A well-timed tribute is sometimes cheaper.</p></div>${icon('crown')}</div><div class="rival-head"><div class="portrait">♛</div><div><h3>${esc(r.name)}</h3><p class="tiny">${r.defeated?'His crown has yielded':`${esc(r.mood)} · Power ${r.power}`}<br>${r.treaty?`${r.treaty} seasons of truce remain.`:'No treaty binds your ambitions.'}</p></div></div><div class="choice-list">${button(`<span class="art-icon">${icon('mana')}</span><div><strong>Offer a tribute</strong><p>Lower Malrec’s power and buy three seasons of truce.</p></div><span class="cost">15 mana</span>`,'diplomacy:tribute','choice-row',r.defeated?'disabled':'')}${button(`<span class="art-icon">${icon('shield')}</span><div><strong>Propose a truce</strong><p>Six seasons of peace. A pact also stays your own assault.</p></div><span class="cost">35 gold</span>`,'diplomacy:pact','choice-row',r.defeated||r.treaty?'disabled':'')}${button(`<span class="art-icon">${icon('gold')}</span><div><strong>Exchange with the border merchants</strong><p>Once each season, while your realms are at peace.</p></div><span class="cost">20 gold<small>Gain 18 mana</small></span>`,'diplomacy:trade','choice-row',r.defeated||r.war?'disabled':'')}${button(`<span class="art-icon">${icon('sword')}</span><div><strong>Raise the standard of war</strong><p>Renounce any truce and prepare to take the Regent’s crown.</p></div>`,'diplomacy:war','choice-row',r.defeated||r.war?'disabled':'')}</div><div class="line"></div><div class="eyebrow">THE TEMPER OF YOUR REALM</div><div class="choice-list" style="margin-top:14px">${Object.entries(POLICIES).map(([id,p])=>button(`<span class="art-icon">${icon(id==='scholarship'?'book':id==='prosperity'?'gold':'crown')}</span><div><strong>${esc(p.name)}</strong><p>${esc(p.description)}</p></div>${s.policy===id?'<span class="cost">Current</span>':''}`,'policy:'+id,'choice-row',s.policy===id?'disabled':'')).join('')}</div><div class="line"></div><div class="eyebrow">THE RECENT ANNALS</div>${s.log.slice(0,5).map(l=>`<div class="log-entry"><b>SEASON ${l.turn}</b>${esc(l.text)}</div>`).join('')}</section>`;}
function battlePanel(){const b=game.state.battle,u=game.selectedUnit,exchange=game.state.log.filter(e=>['hit','spell','enemyTurn','round','defend'].includes(e.type)).slice(0,2).reverse().map(e=>e.text).join(' ');return `<aside class="realm-panel battle-panel"><div class="eyebrow">YOUR SELECTED COMPANY</div><div class="battle-unit">${u?esc(unitName(u.type)):'Choose a company'}</div><p>${u?`${u.hp}/${u.maxHp} vitality · Might ${UNITS[u.type].attack} · Range ${UNITS[u.type].range}`:'Your host awaits an order.'}</p><div class="bar"><i style="width:${u?100*u.hp/u.maxHp:0}%"></i></div><div class="army-meta"><span>${u?.moved?'Marched':'May march'}</span><span>${u?.acted?'Acted':'May strike'}</span></div><div class="battle-roster">${b.units.filter(u=>u.side==='player'&&u.hp>0).map(v=>button(`${unitSymbol(v.type)} ${v.hp}`,'battleSelect:'+v.id,'secondary'+(v.id===u?.id?' active':''))).join('')}</div><div class="battle-actions">${button('✦ &nbsp; Weave battle magic &nbsp; '+key('△',true),'battleSpells')}${button('◇ &nbsp; Defend this company &nbsp; '+key('L1'),'battleDefend')}${button('↶ &nbsp; Retreat with your host &nbsp; '+key('R1'),'retreat','secondary',b.defense?'disabled':'')}</div><div class="objective"><span class="eyebrow">THE LAST EXCHANGE</span><p style="margin-top:8px">${esc(exchange)||'Select a company, then choose a destination or enemy.'}</p></div></aside>`;}
function openModal(type,data={}){modal={type,data};focusIndex=0;renderModal();if(type==='wizards')focusIndex=Math.max(0,focusables().findIndex(b=>b.dataset.action==='begin'));updateFocus(true);}
function closeModal(){modal=null;$('#modal').classList.add('hidden');focusIndex=0;updateFocus(false);lastInput=performance.now();}
function modalFrame(eyebrow,title,body,actions='',wide=false){return `<div class="modal-box ${wide?'wide':''}"><div class="modal-head"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2></div>${modal?.type==='ended'&&hub.kind==='hub'?'':button('×','close','close','aria-label="Close dialog"')}</div>${body}${actions?`<div class="modal-actions">${actions}</div>`:''}</div>`;}
function renderModal(){const el=$('#modal');el.classList.toggle('hidden',!modal);if(!modal)return;const {type,data}=modal;let html='';
 if(type==='wizards')html=modalFrame('EVERY CROWN BEGINS WITH A NAME','Who shall hold the wand?',`<p class="modal-copy">Three curious souls. One rather neglected world. Your school grants a distinct gift; every path can learn every spell.</p><div class="wizard-grid">${[['verdant','❋','Ilyra','Keeper of the Wild Oath','Stronger healing. Flourishing cities.'],['ember','♜','Orrian','The Cinder Crown','Fiercer bolts. A treasury of mana.'],['astral','✧','Vesper','Reader of Impossible Stars','Quicker research. Far Sight learned.']].map(([id,sym,name,title,desc])=>`<button class="wizard-card ${chosenWizard===id?'selected':''}" data-action="wizard:${id}"><div class="wizard-symbol">${sym}</div><strong>${name}</strong><p>${title}</p><small>${desc}</small></button>`).join('')}</div>`,button(`Take the crown ${key('✕',true)}`,'begin','primary'),true);
 else if(type==='intro')html=modalFrame('THE FIRST PAGE','A crown with a few loose pieces',`<div class="modal-copy"><p>The old Accord has broken. The Wells of Root, Ember, and Star keep their power to themselves, and Malrec has begun referring to your kingdom as “temporary.”</p><p>Your answer is an army, a grimoire, and the pleasant little city of Lanternmere.</p></div><div class="help-grid"><section>${icon('mana')}<h3>First, the Verdant Well</h3><p>It lies just northeast of your host at <b>−2, 1</b>. March there to learn the art of battle. Win to bind its power.</p></section><section>${icon('tower')}<h3>Let the city work</h3><p>Commission a Market or Library, choose a mystery to study, then end the season to collect income and restore movement.</p></section></div>`,button('Open the atlas →','close','primary'),true);
 else if(type==='help')html=modalFrame('THE SHORTER GRIMOIRE','How to become remarkable',`<div class="help-grid"><section>${icon('crown')}<h3>Your great work</h3><p>Bind three guarded Wells across both planes. Research and cast The Remarkable Accord to win. Or bind two Wells and conquer Malrec’s city, Cinderhold.</p></section><section>${icon('portal')}<h3>The living atlas</h3><p>D-pad or arrows move the hex cursor. Cross / Enter marches one adjacent hex. Square / Space inspects. Each host has four movement per season; forests and peaks cost two. The Moon Door at 0,0 crosses planes.</p></section><section>${icon('tower')}<h3>A growing realm</h3><p>L1 / R1 or Q / E turn pages. Cities build over several seasons; recruitment is immediate. Up to six companies march together. Visit villages to gain cities, or recruit Wayfarers and found one on clear ground.</p></section><section>${icon('book')}<h3>Spellcraft</h3><p>Research accumulates each season. Shrines supply mana; Libraries supply lore. World spells reveal lands, summon spirits, enrich a city, and cross the veil. Battle spells use the same mana reserve.</p></section><section>${icon('sword')}<h3>Command the field</h3><p>Select your company with Cross, then choose a square to move or an enemy to strike. Each company may move and act once per round. Square / Space cycles companies. Triangle / C opens magic. One wizard spell per round. L1 / Q defends. R1 / E opens retreat. R2 / N ends the round.</p></section><section>${icon('shield')}<h3>The longer game</h3><p>Rest at friendly cities to heal. Malrec expands and eventually sends raiders. The Council offers truces, tribute, trade, and realm policies. Progress saves after each order. Options / Esc opens the menu. Tab / L3 cycles field armies.</p></section></div><p class="tiny">Keyboard: arrows / WASD · Enter confirm · Space inspect · Q/E pages · C magic · N end season · Esc menu · +/− zoom. PS5 controllers use the standard Gamepad API layout. Touch controls are not provided.</p>`,button('I have a perfectly sensible plan','close','primary'),true);
 else if(type==='settings')html=modalFrame('MAKE YOURSELF AT HOME','Settings',`<div class="settings-row"><div><strong>Music & sound</strong><small>All instruments and voices are synthesized.</small></div><div style="display:flex;gap:9px;align-items:center">${button('−','volume:-1','secondary','aria-label="Reduce volume"')}<span>${Math.round(preferences.volume*100)}%</span>${button('+','volume:1','secondary','aria-label="Increase volume"')}</div></div><div class="settings-row"><div><strong>Invert horizontal</strong><small>Reverse left / right controller input.</small></div>${button(preferences.invertX?'On':'Off','invertX')}</div><div class="settings-row"><div><strong>Invert vertical</strong><small>Reverse up / down controller input.</small></div>${button(preferences.invertY?'On':'Off','invertY')}</div><div class="settings-row"><div><strong>Controller vibration</strong><small>A small pulse when magic meets its mark.</small></div>${button(preferences.rumble?'On':'Off','rumble')}</div><p class="tiny" style="margin-top:22px">${navigator.getGamepads?.().some(p=>p)?'Controller connected.':'Controller not detected. Connect a gamepad and press any button.'}<br>Settings are remembered on this browser.</p>`,button('Return','close','primary'));
 else if(type==='pause')html=modalFrame('THE COUNCIL CAN WAIT','A moment between seasons',`<p class="modal-copy">${hub.active?'Your fellow sages can continue giving orders while this menu is open.':'Your chronicle is saved after every order.'}</p><div class="choice-list">${button(`${icon('arrow')} &nbsp; Return to the realm`,'close','choice-row')}${button(`${icon('gear')} &nbsp; Settings`,'settings','choice-row')}${button(`${icon('book')} &nbsp; How to play`,'help','choice-row')}${button(`${icon('people')} &nbsp; ${hub.active?'Council room':'Play together'}`,'online','choice-row')}${button(`${icon('star')} &nbsp; About & credits`,'about','choice-row')}${button('Return to title','title','choice-row',hub.kind==='hub'?'disabled':'')}</div>`);
 else if(type==='inspect'){const s=game.state,t=tileAt(),a=selectedArmy(),here=a&&t&&a.q===t.q&&a.r===t.r&&a.plane===t.plane,c=s.cities.find(c=>t&&c.q===t.q&&c.r===t.r&&c.plane===t.plane);html=modalFrame('A PLACE IN YOUR ATLAS',esc(t?.explored?t.siteName||titleCase(t.terrain):'Beyond the veil'),`<p class="modal-copy">${esc(t?.lore||'A realm is made from places such as this, and the stories you leave behind.')}</p><div class="choice-list">${here&&t.site==='gate'?button(`${icon('portal')} &nbsp; Step through the Moon Door`,'plane','choice-row'):''}${c?.owner==='player'?button(`${icon('tower')} &nbsp; Manage ${esc(c.name)}`,'manageCity:'+c.id,'choice-row'):''}${!here?button(`${icon('arrow')} &nbsp; March the selected host here`,'march','choice-row'):''}${here&&a.units.some(u=>u.type==='settler')?button(`${icon('crown')} &nbsp; Found a new city`,'found','choice-row'):''}${s.armies.filter(b=>b.owner==='player'&&t&&b.q===t.q&&b.r===t.r&&b.plane===t.plane).map(b=>button(`${icon('sword')} &nbsp; Command ${esc(b.name)}`,'selectArmy:'+b.id,'choice-row')).join('')}</div><p class="tiny" style="margin-top:20px">${here?'Your selected host stands here.':'An army must march through neighboring hexes to reach distant ground.'}</p>`);}
 else if(type==='battleSpells'){const b=game.state.battle;html=modalFrame('ONE WORKING EACH ROUND','The wizard’s hand',`<p class="modal-copy">${b?.castUsed?'Your spell is spent for this round. End the round to weave again.':'Magic draws from your realm’s mana. Choose a working, then choose its recipient.'}</p><div class="choice-list">${game.state.research.known.filter(id=>SPELLS[id]?.scope==='battle').map(id=>button(`<span class="art-icon">${icon(id==='heal'?'leaf':id==='flame'?'flame':'mana')}</span><div><strong>${esc(SPELLS[id].name)}</strong><p>${esc(SPELLS[id].description)}</p></div><span class="cost">${SPELLS[id].cost} mana</span>`,'battleSpell:'+id,'choice-row',b?.castUsed?'disabled':'')).join('')}</div>`);}
 else if(type==='spellTargets'){const d=SPELLS[data.spell],b=game.state.battle;html=modalFrame('LET THE WORDS TAKE HOLD',esc(d.name),`<p class="modal-copy">${esc(d.description)}</p><div class="choice-list">${b.units.filter(u=>u.hp>0&&(d.target==='ally'?u.side==='player':u.side==='enemy')).map(u=>button(`<span class="art-icon">${icon(u.side==='player'?'shield':'sword')}</span><div><strong>${esc(unitName(u.type))}</strong><p>${u.hp} / ${u.maxHp} vitality · position ${u.x+1}, ${u.y+1}</p></div>`,'battleTarget:'+data.spell+':'+u.id,'choice-row')).join('')}</div>`);}
 else if(type==='retreat')html=modalFrame('DISCRETION HAS ITS OWN BANNER','Yield the field?',`<p class="modal-copy">Your living companies withdraw to their last safe ground. The guardians retain their prize. There will be other seasons.</p>`,button('Stand our ground','close')+button('Retreat','confirmRetreat','primary'));
 else if(type==='online'){html=modalFrame('GOOD COMPANY, QUESTIONABLE SCHEMES','A council of up to four',`<p class="modal-copy">Share one kingdom, one treasury, and every decision. Each sage may command the realm; the host keeps the chronicle. No account is required.</p>${hub.active?`<div class="room-code">${hub.room||'AI HUB'}</div><p class="tiny" style="text-align:center">${esc(networkStatus)}<br>Keep the host’s game open. Share this code with your fellow sages.</p>${hub.kind!=='hub'?`<div class="modal-actions">${button('Close council room','disconnect')}</div>`:''}`:`<div class="choice-list" style="margin-top:22px">${button(`${icon('people')}<div><strong>Host a new council</strong><p>Start a fresh co-op chronicle and receive a room code.</p></div>`,'host','choice-row')}${button(`${icon('portal')}<div><strong>Join a council</strong><p>Enter the host’s six-digit room code.</p></div>`,'join','choice-row')}</div><p class="tiny" style="margin-top:18px">Online rooms use WebRTC and a public signaling service. Launch from AI Hub to use its shared session and timed scoring.</p>`}`);}
 else if(type==='join')html=modalFrame('THE DOOR OPENS TO A NUMBER','Enter the council code',`<div class="room-code">${esc(joinCode.padEnd(6,'·'))}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','⌫','0','Clear'].map(n=>button(n,'digit:'+n)).join('')}</div>`,button('Join council','joinConfirm','primary',joinCode.length===6?'':'disabled'));
 else if(type==='busy')html=modalFrame('SENDING A WORD THROUGH THE AETHER','One moment…',`<p class="modal-copy">${esc(networkStatus||'Opening the council doors.')}</p>`);
 else if(type==='victory')html=modalFrame('THE ANNALS WILL REMEMBER','A most remarkable reign',`<div class="modal-copy"><p>${esc(game.state.quest.epilogue||'The Wells sing as one. Across two worlds the old Accord awakens, and even Malrec finds himself temporarily lost for words.')}</p><p>Your realm has grown to ${game.state.cities.filter(c=>c.owner==='player').length} cities, ${game.state.research.known.length} spells, and a reputation far larger than its crown.</p></div><div class="detail-strip"><span><b>${game.state.turn}</b>seasons</span><span><b>${game.state.quest.nodes}/3</b>Wells bound</span><span><b>${score()}</b>realm score</span></div>`,button('Title screen','title')+button('Keep writing this chronicle','continueRealm','primary'));
 else if(type==='defeat')html=modalFrame('EVEN THE STARS HAVE WINTERS','The crown grows quiet',`<p class="modal-copy">Your cities have fallen, but every great chronicle contains a page its author would prefer to rewrite. The next crown may sit more comfortably.</p>`,button('A new chronicle','new','primary'));
 else if(type==='ended')html=modalFrame('THE COUNCIL ADJOURNS','A season well spent',`<p class="modal-copy">${hub.ended?'The shared session has ended.':'The council’s allotted time has passed.'} Your realm score is ${score()}, with ${game.state.quest.nodes} of the three Wells restored.</p>`,hub.kind!=='hub'?button('Return to title','title','primary'):'');
 else if(type==='about')html=aboutHTML();
 el.innerHTML=html;
}
function aboutHTML(){return modalFrame('COLOPHON & CREDITS',TITLE,`<div class="modal-copy"><p>An original fantasy strategy vignette inspired by the spirit of <i>Master of Magic</i>. All characters, prose, rules, meshes, animation, and sound in this demo were created for this game.</p></div><h3 class="serif" style="font-size:27px;font-weight:500">Source Information</h3><dl class="credits-grid"><dt>Date</dt><dd>2026-10-29 07:59 (America/Vancouver)</dd><dt>Source</dt><dd>Master of Magic</dd><dt>Tech</dt><dd>Three.js r180 / WebGPU only; Rapier 0.19.3; JavaScript, HTML, CSS; Gamepad API; Web Audio API. PeerJS 1.5.5; AI Hub session client 1.3.0.</dd><dt>Art Direction</dt><dd>Procedural cel-shaded tabletop fantasy, outlined toy architecture, faceted landscapes, warm parchment and mineral colors.</dd><dt>Animation</dt><dd>Procedural transforms, tweened company marches, floating crystals, banners and portals; Rapier rigid-body spell fragments.</dd><dt>Audio</dt><dd>Code-written adaptive fantasy score, synthesized spell and battle effects, invented formant-filtered gibberish voice. No recordings.</dd><dt>Online</dt><dd>1–4 player shared-realm co-op. AI Hub authoritative sessions; standalone PeerJS/WebRTC rooms with state synchronization.</dd><dt>Testing</dt><dd>Efficient, lightweight deterministic rules tests and headless Chrome WebGPU, audio, UI, and two-page WebRTC checks.</dd><dt>Environment</dt><dd>Codex CLI (headless); Linux; tested browser Google Chrome. Player browser unknown.</dd><dt>Model</dt><dd>OpenAI, gpt-6.1-sol, reasoning effort ultra.</dd><dt>Usage</dt><dd>API cost and token count unknown. Approximate session time: 33 minutes.</dd><dt>Typography</dt><dd>Cormorant Garamond and DM Sans, Google Fonts; system fonts when unavailable.</dd></dl><div class="line"></div><div class="modal-copy"><h3>Testing Feedback</h3><p id="testing-feedback">Testing caught 10 issues: 1 critical progression issue and 9 noncritical rules, audio, rendering, controller timing, and transport issues, all fixed. Most helpful: a complete natural campaign through all three wizard schools. Least helpful: a headless Vulkan screenshot whose compositor returned a blank canvas; an Xvfb browser capture resolved verification. The upstream AI Hub harness passed all five scenarios (121 checks) with 150±50ms latency and 5% unreliable-packet loss. Physical controllers and a couch-distance playtest remain untested.</p><h3>Engine Feedback</h3><p>Three.js makes a rich procedural world concise to build, and Rapier supplies convincing spell debris. The main challenge was keeping a serializable turn-based rules engine, controller focus, and network authority consistent. The campaign rules, tactical AI, save system, UI, and co-op transport were built for this demo. WebGPU initialization and presentation needed the most care. I would overhaul the renderer’s implicit WebGL fallback into an explicit opt-in capability policy and improve backend diagnostics.</p><h3>Prompt Feedback</h3><p>The source, delivery format, controller focus, and procedural audio requirements gave the game a strong identity. “Feature-complete” leaves the breadth of a 4X demo open to interpretation; this slice defines its own compact campaign and two victory paths. The hardest task was giving every major system a useful role within one playable file. The most useful additional test would be a full couch-distance campaign with four physical PS5 controllers in a real AI Hub session.</p></div>`,button('Return to the atlas','close','primary')+'<span class="tiny">D-pad up / down scrolls</span>',true);}
async function action(name){if(hub.ended&&hub.kind==='hub')return;if(busy&&name!=='close')return;const [a,...parts]=name.split(':'),v=parts.join(':');audio.sfx('select');
 if(a==='close'){closeModal();return;}
 if(a==='new'){openModal('wizards');return;}
 if(a==='wizard'){chosenWizard=v;renderModal();updateFocus(false);return;}
 if(a==='begin'){startGame();return;}
 if(a==='continue'){continueGame();return;}
 if(['settings','help','about','online','pause','retreat','battleSpells'].includes(a)){if(a==='online'&&hub.kind==='hub'&&hub.server)return;openModal(a);return;}
 if(a==='title'){persist();if(hub.kind==='peer')hub.disconnect();modal=null;screen='title';game=new Game(731);attract=false;resetCursor();sync();lastInput=performance.now();return;}
 if(a==='volume'){preferences.volume=Math.round(Math.max(0,Math.min(1,preferences.volume+Number(v)*.1))*10)/10;audio.setVolume(preferences.volume);savePrefs();renderModal();updateFocus(false);return;}
 if(['invertX','invertY','rumble'].includes(a)){preferences[a]=!preferences[a];savePrefs();renderModal();updateFocus(false);return;}
 if(a==='page'){if(game.state.battle)return;page=Number(v);modal=null;focusIndex=0;render();return;}
 if(a==='cityTab'){cityTab=v;focusIndex=0;render();return;}
 if(a==='spellTab'){spellTab=v;focusIndex=0;render();return;}
 if(a==='nextCity'){cityIndex++;focusIndex=0;render();return;}
 if(a==='locateCity'){const c=currentCity();if(c){game.state.plane=c.plane;cursor={q:c.q,r:c.r};page=0;sync();}return;}
 if(a==='manageCity'){const cities=game.state.cities.filter(c=>c.owner==='player');cityIndex=Math.max(0,cities.findIndex(c=>c.id===v));page=1;closeModal();render();return;}
 if(a==='nextArmy'){nextArmy();return;}
 if(a==='selectArmy'){dispatch({type:'selectArmy',armyId:v});resetCursor();closeModal();sync();return;}
 if(a==='primary'||a==='march'){closeModal();primary();return;}
 if(a==='inspect'){openModal('inspect');return;}
 if(a==='endTurn'){dispatch({type:'endTurn'});return;}
 if(a==='plane'||a==='found'){closeModal();dispatch({type:a});resetCursor();sync();return;}
 if(a==='build'||a==='recruit'){dispatch({type:a,cityId:currentCity()?.id,[a==='build'?'building':'unit']:v});return;}
 if(a==='cancelBuild'){dispatch({type:a,cityId:currentCity()?.id});return;}
 if(a==='research'){dispatch({type:'research',spell:v});return;}
 if(a==='cast'){dispatch({type:'cast',spell:v,cityId:currentCity()?.id});resetCursor();sync();return;}
 if(a==='diplomacy'){dispatch({type:'diplomacy',choice:v});audio.voice(game.state.turn+4);return;}
 if(a==='policy'){dispatch({type:'policy',policy:v});return;}
 if(a==='battleSelect'){dispatch({type:'battleSelect',unitId:v});const u=game.selectedUnit;if(u)battleCursor={q:u.x,r:u.y};sync();return;}
 if(a==='battleEnd'||a==='battleDefend'){dispatch({type:a});return;}
 if(a==='battleSpell'){const d=SPELLS[v];if(d.target==='all'){closeModal();dispatch({type:'battleCast',spell:v});}else openModal('spellTargets',{spell:v});return;}
 if(a==='battleTarget'){const [spell,targetId]=parts;const target=game.state.battle?.units.find(u=>u.id===targetId);if(target)battleCursor={q:target.x,r:target.y};closeModal();dispatch({type:'battleCast',spell,targetId});return;}
 if(a==='confirmRetreat'){closeModal();dispatch({type:'battleRetreat'});resetCursor();sync();return;}
 if(a==='continueRealm'){closeModal();dispatch({type:'continue'});return;}
 if(a==='host'){busy=true;openModal('busy');try{await hub.createRoom();openModal('online');}catch(e){toast(e.message,true);openModal('online');}finally{busy=false;}return;}
 if(a==='join'){joinCode='';openModal('join');return;}
 if(a==='digit'){joinCode=v==='Clear'?'':v==='⌫'?joinCode.slice(0,-1):(joinCode+v).slice(0,6);renderModal();updateFocus(false);return;}
 if(a==='joinConfirm'){busy=true;openModal('busy');try{await hub.joinRoom(joinCode);closeModal();}catch(e){toast(e.message,true);openModal('join');}finally{busy=false;}return;}
 if(a==='disconnect'){hub.disconnect();renderModal();return;}
}
function primary(){if(game.state.battle){const b=game.state.battle,u=b.units.find(u=>u.x===battleCursor.q&&u.y===battleCursor.r&&u.hp>0);if(u?.side==='player')dispatch({type:'battleSelect',unitId:u.id});else if(u)dispatch({type:'battleAttack',targetId:u.id});else dispatch({type:'battleMove',x:battleCursor.q,y:battleCursor.r});return;}
 const a=selectedArmy(),t=tileAt();if(!a||!t)return;if(a.q===cursor.q&&a.r===cursor.r&&a.plane===game.state.plane){if(t.site==='gate'){dispatch({type:'plane'});resetCursor();sync();}else openModal('inspect');return;}dispatch({type:'move',q:cursor.q,r:cursor.r});}
function nextArmy(){if(game.state.battle){const units=game.state.battle.units.filter(u=>u.side==='player'&&u.hp>0),i=units.findIndex(u=>u.id===game.state.battle.selectedUnit),u=units[(i+1)%units.length];if(u){dispatch({type:'battleSelect',unitId:u.id});battleCursor={q:u.x,r:u.y};sync();}return;}const armies=game.state.armies.filter(a=>a.owner==='player'),i=armies.findIndex(a=>a.id===game.state.selectedArmy),a=armies[(i+1)%armies.length];if(a){dispatch({type:'selectArmy',armyId:a.id});resetCursor();sync();}}
function focusables(){const root=modal?$('#modal'):screen==='title'?$('#title'):page>0?$('.page-panel'):null;return root?[...root.querySelectorAll('button:not(:disabled):not(.close)')]:[];}
function updateFocus(force=false){const buttons=focusables();if(!buttons.length)return;focusIndex=Math.max(0,Math.min(buttons.length-1,focusIndex));buttons.forEach((b,i)=>b.dataset.focus=String(i===focusIndex));if(force)buttons[focusIndex]?.focus({preventScroll:true});}
function moveFocus(n){const buttons=focusables();if(!buttons.length)return;focusIndex=(focusIndex+n+buttons.length)%buttons.length;updateFocus(true);buttons[focusIndex].scrollIntoView({block:'nearest',behavior:'smooth'});audio.sfx('select');}
function rumble(strength=.2){if(!preferences.rumble)return;const p=navigator.getGamepads?.().find(p=>p?.vibrationActuator);p?.vibrationActuator?.playEffect('dual-rumble',{duration:130,strongMagnitude:strength,weakMagnitude:strength*.6})?.catch(()=>{});}
function activity(){lastInput=performance.now();if(!hub.ended)audio.unlock().catch(()=>{});if(attract){endAttract();return false;}return true;}
function input(cmd){if(!ready||(hub.ended&&hub.kind==='hub'))return;if(!activity())return;controls.action=cmd;if(cmd==='confirm')controls.fire=true;if(cmd==='left'||cmd==='right')controls.x=cmd==='right'?1:-1;if(cmd==='up'||cmd==='down')controls.y=cmd==='down'?1:-1;
 if(cmd==='back'){if(modal)closeModal();else if(screen==='game')openModal('pause');return;}
 if(cmd==='pause'){if(modal)closeModal();else openModal(screen==='title'?'settings':'pause');return;}
 if(modal&&['help','about','intro'].includes(modal.type)&&['up','down'].includes(cmd)){$('.modal-box')?.scrollBy({top:cmd==='down'?180:-180,behavior:'smooth'});return;}
 if(modal||screen==='title'){if(cmd==='up'||cmd==='left')moveFocus(-1);else if(cmd==='down'||cmd==='right')moveFocus(1);else if(cmd==='confirm'){const bs=focusables();if(bs[focusIndex])action(bs[focusIndex].dataset.action);}return;}
 if(hub.server||!hub.canPlay)return;
 if(cmd==='prevPage'||cmd==='nextPage'){if(game.state.battle){if(cmd==='prevPage')dispatch({type:'battleDefend'});else if(!game.state.battle.defense)openModal('retreat');}else{page=(page+(cmd==='nextPage'?1:3))%4;focusIndex=0;render();}return;}
 if(cmd==='endTurn'){dispatch({type:game.state.battle?'battleEnd':'endTurn'});return;}
 if(cmd==='magic'){if(game.state.battle)openModal('battleSpells');else{page=2;spellTab='cast';focusIndex=0;render();}return;}
 if(cmd==='inspect'){if(game.state.battle)nextArmy();else openModal('inspect');return;}
 if(cmd==='nextArmy'){nextArmy();return;}
 if(page>0&&!game.state.battle){if(['up','left'].includes(cmd))moveFocus(-1);else if(['down','right'].includes(cmd))moveFocus(1);else if(cmd==='confirm'){const bs=focusables();if(bs[focusIndex])action(bs[focusIndex].dataset.action);}return;}
 if(cmd==='confirm'){primary();return;}
 let dq=cmd==='left'?-1:cmd==='right'?1:0,dr=cmd==='up'?-1:cmd==='down'?1:0;if(!dq&&!dr)return;
 if(game.state.battle){battleCursor={q:Math.max(0,Math.min(6,battleCursor.q+dq)),r:Math.max(0,Math.min(6,battleCursor.r+dr))};}else{const t=tileAt(cursor.q+dq,cursor.r+dr);if(t)cursor={q:t.q,r:t.r};}
 view.setCursor(game.state.battle?battleCursor.q:cursor.q,game.state.battle?battleCursor.r:cursor.r);renderHUD();audio.sfx('select');
}
const keyMap={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',Enter:'confirm',' ':'inspect',Escape:'back',q:'prevPage',Q:'prevPage',e:'nextPage',E:'nextPage',c:'magic',C:'magic',n:'endTurn',N:'endTurn',Tab:'nextArmy'};
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const cmd=keyMap[e.key];if(cmd){$('#touch-required').classList.add('hidden');e.preventDefault();if(e.repeat&&!['up','down','left','right'].includes(cmd))return;input(cmd);}else if(e.key==='+'||e.key==='='){e.preventDefault();activity();view?.zoom(-1);}else if(e.key==='-'){e.preventDefault();activity();view?.zoom(1);}});
document.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key))controls.x=0;if(['ArrowUp','ArrowDown','w','W','s','S'].includes(e.key))controls.y=0;if(e.key==='Enter')controls.fire=false;});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(!activity())return;e.preventDefault();focusIndex=focusables().indexOf(b);action(b.dataset.action);});
$('#world').addEventListener('pointerdown',e=>{if(!ready||!activity()||modal||screen!=='game'||page!==0)return;const p=view.pick(e.clientX,e.clientY);if(p){const old=game.state.battle?battleCursor:cursor;if(game.state.battle)battleCursor={q:p.x??p.q,r:p.y??p.r};else cursor={q:p.q,r:p.r};if(old.q===(p.x??p.q)&&old.r===(p.y??p.r))primary();else sync();}});
document.addEventListener('pointermove',()=>{if(screen==='title'&&!attract)lastInput=performance.now();},{passive:true});
const prevButtons=new Map();let padDirection='',padRepeat=0;
function pollGamepad(now){if(hub.ended&&hub.kind==='hub')return;const pads=navigator.getGamepads?.()||[];for(const p of pads){if(!p)continue;const map={0:'confirm',1:'back',2:'inspect',3:'magic',4:'prevPage',5:'nextPage',7:'endTurn',9:'pause',10:'nextArmy',12:'up',13:'down',14:'left',15:'right'};for(const [i,cmd]of Object.entries(map)){const pressed=p.buttons[i]?.pressed,k=p.index+':'+i;if(pressed&&!prevButtons.get(k)&&!(Number(i)===9&&p.buttons[8]?.pressed))input(cmd);prevButtons.set(k,pressed);}
 const x=p.axes[0]*(preferences.invertX?-1:1),y=p.axes[1]*(preferences.invertY?-1:1);controls.x=x;controls.y=y;controls.fire=!!p.buttons[0]?.pressed;let dir=Math.max(Math.abs(x),Math.abs(y))>.55?(Math.abs(x)>Math.abs(y)?x>0?'right':'left':y>0?'down':'up'):'';
 if(dir&&(dir!==padDirection||now>padRepeat)){input(dir);padRepeat=now+(dir===padDirection?170:330);}padDirection=dir;break;}}
function touchCheck(){const touch=matchMedia('(pointer: coarse)').matches&&!navigator.getGamepads?.().some(Boolean);$('#touch-required').classList.toggle('hidden',!touch);}
window.addEventListener('gamepadconnected',()=>{touchCheck();toast('Controller connected. Welcome to the council.');});window.addEventListener('gamepaddisconnected',touchCheck);window.addEventListener('resize',()=>view?.resize());
function startAttract(){if(hub.active||modal||screen!=='title')return;attract=true;screen='game';game=new Game(731,'astral');game.state.resources={gold:1500,mana:1500};for(const t of game.state.tiles)t.explored=true;page=0;attractClock=0;attractStep=-1;attractAction=0;resetCursor();sync();}
function endAttract(){attract=false;screen='title';modal=null;game=new Game(731);page=0;resetCursor();sync();lastInput=performance.now();}
function updateAttract(dt){attractClock+=dt;if(attractClock>200||game.state.quest.victory){endAttract();startAttract();return;}
 const phase=attractClock<6?0:attractClock<12?1:attractClock<18?2:attractClock<24?3:4;
 if(phase!==attractStep){attractStep=phase;page=phase===1?1:phase===2?2:phase===3?3:0;if(phase===1)game.act({type:'build',cityId:'c0',building:'library'});if(phase===2)game.act({type:'research',spell:'summon'});if(phase===3)game.act({type:'diplomacy',choice:'pact'});sync();}
 if(phase<4)return;attractAction+=dt;if(attractAction<1.2)return;attractAction=0;
 const oldBattle=game.state.battle,cmd=chooseDemoAction(game);if(!cmd)return;const result=game.act(cmd);if(!result.ok)return;const a=selectedArmy();if(a)cursor={q:a.q,r:a.r};if(game.state.battle){const u=game.selectedUnit;if(u)battleCursor={q:u.x,r:u.y};page=0;}else page=0;
 if(cmd.type==='battleCast'||cmd.type==='battleAttack'){audio.sfx(cmd.type==='battleCast'?'spell':'hit');const b=game.state.battle,t=b?.units.find(u=>u.id===cmd.targetId);view.effect('spell',(t?.x||4)*1.65-4.95,(t?.y||3)*1.65-4.95);}else if(oldBattle&&!game.state.battle)audio.sfx('victory');else if(cmd.type==='endTurn')audio.sfx('turn');sync();
}
document.addEventListener('pointerdown',e=>{if(attract){endAttract();e.stopImmediatePropagation();e.preventDefault();}else lastInput=performance.now();},{capture:true});
document.addEventListener('pointermove',e=>{if(attract&&(Math.abs(e.movementX)+Math.abs(e.movementY)>2))endAttract();},{passive:true});
async function init(){try{view=await new WorldView().init($('#world'));ready=true;$('#boot').classList.add('hidden');resetCursor();sync();touchCheck();lastInput=performance.now();
 hub.registerProbe(()=>({scene:hub.ended?'over':screen==='title'?'title':'play',menu:!!modal,world:hub.elapsed,input:{...controls},turn:game.state.turn,plane:game.state.plane,nodes:game.state.quest.nodes,score:score()}));
 if(globalThis.AIHub?.active)await hub.connectHub();
 window.__rrs={get game(){return game;},get view(){return view;},get hub(){return hub;},get screen(){return screen;},get attract(){return attract;},get modal(){return modal;},dispatch,action,startGame,startAttract,endAttract,sync,chooseDemoAction,setCursor(q,r){cursor={q,r};sync();},get cursor(){return cursor;}};
 setInterval(()=>pollGamepad(performance.now()),16);requestAnimationFrame(frame);
 }catch(e){console.error(e);$('#boot-message').textContent=e.message||'The realm could not be opened. Check your connection and WebGPU support.';$('#boot').querySelector('h2').textContent='The gate needs WebGPU';const p=document.createElement('p');p.className='tiny';p.textContent='Use a current browser with WebGPU enabled. This game requires WebGPU and an internet connection for its engine libraries.';$('#boot').append(p);$('#boot').append(Object.assign(document.createElement('button'),{className:'secondary',textContent:'Try again',onclick:()=>location.reload()}));}}
function frame(now){const dt=Math.min(.08,(now-lastFrame)/1000);lastFrame=now;elapsed+=dt;hub.update(dt);if(hub.active&&hub.canPlay&&!hub.finished){progressClock+=dt;if(progressClock>=1){progressClock=0;hub.progress(score(),`${game.state.quest.nodes}/3 Wells bound`);}}if(!hub.active&&screen==='title'&&!modal&&now-lastInput>10000)startAttract();if(attract)updateAttract(dt);view.frame(elapsed,dt);if(hub.active&&hub.kind==='hub'&&!hub.canPlay&&!modal){$('#toasts').textContent='';const el=document.createElement('div');el.className='toast';el.textContent='The council gathers. The shared session begins shortly.';$('#toasts').append(el);}requestAnimationFrame(frame);}
init();
</script>
