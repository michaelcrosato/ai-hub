function syncUI(){
 const mode=G.mode,action=$('action');action.hidden=!['title','paused','dead'].includes(mode);

function shoot(){if(player.knock>0||player.fire>0||shots.filter(b=>b.life>0&&!b.wind).length>=3&&player.weapon==='pulse')return;player.fire=player.weapon==='pulse'?10:22;player.shootPose=12;let x=player.x+(player.face>0?22:-12),y=player.y+9;shots.push({x,y,w:6,h:4,vx:player.face*(player.weapon==='pulse'?5.3:4.6),vy:0,life:90,wind:player.weapon!=='pulse',t:0,baseY:y,dir:player.face});G.shotCount++;sfx(player.weapon==='pulse'?'shoot':'gust');burst(x,y,C.cream,2,.7);}

function updatePlayer(){let p=player;p.inv=Math.max(0,p.inv-1);p.fire=Math.max(0,p.fire-1);p.shootPose=Math.max(0,p.shootPose-1);p.pose++;let dx=(held('ArrowRight','KeyD')?1:0)-(held('ArrowLeft','KeyA')?1:0),up=held('ArrowUp','KeyW'),down=held('ArrowDown','KeyS'),jump=held('KeyZ','Space','KeyK');if(tapped('KeyZ','Space','KeyK'))p.jumpBuffer=6;else p.jumpBuffer=Math.max(0,p.jumpBuffer-1);
 if(held('KeyX','KeyJ'))shoot();
 if(p.knock<=0&&(up||down)&&!p.climb){let l=ladderAt();if(l&&(up||p.y+p.h<=l.y+6)){p.climb=l;p.x=l.x;p.vy=0;p.ground=false;}}
 if(p.climb){const l=p.climb;if(dx)p.face=dx;p.vx=0;p.vy=0;if(p.jumpBuffer){p.climb=null;p.vy=-4.3;p.jumpBuffer=0;sfx('jump');}else{p.y+=(down?1.35:0)-(up?1.35:0);if(p.y+p.h<l.y+1){p.y=l.y-p.h;p.climb=null;p.ground=true;p.coyote=5;}if(p.y+p.h>=l.bottom){p.y=l.bottom-p.h;p.climb=null;p.ground=true;}return;}}
 if(p.ground)p.coyote=5;else p.coyote=Math.max(0,p.coyote-1);
 if(p.jumpBuffer>0&&p.coyote>0&&p.knock<=0){p.vy=-6.05;p.ground=false;p.coyote=0;p.jumpBuffer=0;sfx('jump');burst(p.x+6,p.y+22,C.pale,4,.7);}
 if(!jump&&p.vy<-2.2)p.vy=-2.2;
 let wind=0;if(['play','boss','bossDown'].includes(G.mode)){for(const f of fans){if(f.arena&&G.mode!=='boss')continue;if(!f.arena&&p.x>=ARENA)continue;if(p.x+6>f.from&&p.x+6<f.to&&p.y>80&&p.y<202)wind=f.dir*(f.arena?.55:.85);}if(G.mode==='boss'&&G.boss&&G.boss.phase==='gust'&&!wind)wind=G.boss.face*.3;}
 if(p.knock>0)p.knock--;else{p.vx=dx*2+wind;if(dx)p.face=dx;}
 p.x+=p.vx;
 for(const s of platforms){if(s.thin)continue;if(p.y+p.h>s.y+3&&p.y<s.y+s.h-1&&p.x<s.x+s.w&&p.x+p.w>s.x){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;}}
 let oldTop=p.y,oldBottom=p.y+p.h;p.vy=Math.min(p.vy+.27,6.3);p.y+=p.vy;p.ground=false;if(p.vy<0){for(const s of platforms){if(!s.thin&&p.x+p.w>s.x+1&&p.x<s.x+s.w-1&&oldTop>=s.y+s.h&&p.y<s.y+s.h){p.y=s.y+s.h;p.vy=0;}}}
 for(const s of platforms){if(p.x+p.w>s.x+1&&p.x<s.x+s.w-1&&p.vy>=0&&oldBottom<=s.y+2&&p.y+p.h>=s.y){p.y=s.y-p.h;p.vy=0;p.ground=true;if(oldBottom<s.y-4)sfx('land');}}
 const min=G.mode==='boss'||G.mode==='bossDown'||G.mode==='clear'?ARENA+12:0;const max=G.mode==='play'?WORLD-16:WORLD-22;p.x=clamp(p.x,min,max);
 if(p.y>H+32){die();return;}
 if(G.mode==='play'){for(let i=0;i<relays.length;i++){let r=relays[i];if(G.checkpoint<i+1&&p.x+6>=r.x-8&&p.x<r.x+38&&p.ground){G.checkpoint=i+1;G.hp=28;sfx('heal');burst(r.x,r.y-21,C.mint,22,2);toast('RELAY SAVED. ENERGY FULL.');}}if(p.x>=2287)enterBoss();}
}
function updateEnemies(){for(const e of enemies){if(e.dead)continue;if(Math.abs(e.x-G.cam)>W+80)continue;if(e.x>G.cam+W+15)continue;e.active=true;e.t++;e.flash=Math.max(0,e.flash-1);e.dir=player.x<e.x?-1:1;
 if(e.type==='shell'){e.open=e.t%174>=82;e.tell=e.t%174>=62&&e.t%174<82;if(e.t%174===98||e.t%174===123){if(Math.abs(player.x-e.x)<330){hostile.push({type:'bolt',x:e.x+(e.dir<0?-2:19),y:e.y+9,w:5,h:5,vx:e.dir*1.85,vy:0,life:200,t:0});sfx('ping');}}}
 if(e.type==='drone'){e.x=e.baseX??e.x;if(e.baseX===undefined)e.baseX=e.x;e.x=e.baseX+Math.sin(e.t*.025)*24;e.y=e.base+Math.sin(e.t*.047)*11;e.tell=e.t%150>118;if(e.t%150===0&&Math.abs(player.x-e.x)<300){let a=Math.atan2(player.y+10-e.y,player.x-e.x);hostile.push({type:'bolt',x:e.x+7,y:e.y+9,w:5,h:5,vx:Math.cos(a)*1.65,vy:Math.sin(a)*1.65,life:240,t:0});sfx('ping');}}
 if(e.type==='hopper'){e.cool--;if(e.cool<=0&&e.y+e.h>=e.base){e.vy=-4.1;e.vx=e.dir*.7;e.cool=94;}e.y+=e.vy;e.vy+=.21;e.x+=e.vx;if(e.y+e.h>=e.base){e.y=e.base-e.h;e.vy=0;e.vx=0;}const home=enemyDefs[e.id].x;e.x=clamp(e.x,home-33,home+28);e.tell=e.cool<18&&e.vy===0;}
 if(overlap(player,{x:e.x+2,y:e.y+2,w:e.w-4,h:e.h-2}))hurt(3,e.x);
 }}
function enterBoss(){G.mode='bossIntro';G.ready=135;G.boss={x:ARENA+186,y:144,w:36,h:48,hp:40,maxHp:40,phase:'charge',t:0,face:-1,flash:0,inv:0,vx:0,vy:0,jumps:0};G.bossFill=0;player.x=ARENA+25;player.y=170;player.vx=0;player.vy=0;player.ground=true;player.climb=null;player.inv=100;shots=[];hostile=[];G.hp=28;G.toastTime=0;setTrack('boss');sfx('gate');syncUI();$('live').textContent='Gust Goliath. Shoot the fan to send gusts back. Hit the open core.';}
function bossDamage(n,reflected=false){const b=G.boss;if(!b||b.inv>0||G.mode!=='boss')return false;if(!reflected&&!['recover','leap','leapTell'].includes(b.phase)){sfx('ping');return false;}b.hp=Math.max(0,b.hp-n);b.inv=7;b.flash=6;burst(b.x+18,b.y+24,C.cream,5,1.7);G.shake=Math.max(G.shake,1.5);if(!b.hp){G.mode='bossDown';G.bossDown=0;G.clearTime=G.time;hostile=[];shots=[];player.inv=300;G.shake=8;sfx('pop');syncUI();}return true;}
function updateBoss(){let b=G.boss;if(!b)return;b.t++;b.flash=Math.max(0,b.flash-1);b.inv=Math.max(0,b.inv-1);
 if(b.phase==='charge'&&b.t>=50){b.phase='gust';b.t=0;}
 else if(b.phase==='gust'){if([1,25,49,73].includes(b.t)){let high=b.t===25||b.t===73;hostile.push({type:'gust',x:b.x+(b.face<0?-12:36),y:high?139:175,baseY:high?139:175,w:12,h:13,vx:b.face*1.95,vy:0,life:260,t:0,friendly:false});sfx('gust');}if(b.t>=102){b.phase='recover';b.t=0;}}
 else if(b.phase==='recover'&&b.t>=94){b.phase='leapTell';b.t=0;sfx('warning');}

 else if(b.phase==='leap'){b.x+=b.vx;b.y+=b.vy;b.vy+=.27;if(b.y>=144&&b.t>12){b.y=144;b.x=b.target;b.phase='charge';b.t=-22;b.jumps++;b.face=b.x<ARENA+128?1:-1;fans[2].dir=b.face;fans[2].flash=20;G.shake=5;noise(.2,.1);hostile.push({type:'wave',x:b.x+18,y:181,w:10,h:11,vx:-2.6,vy:0,t:0,life:150},{type:'wave',x:b.x+18,y:181,w:10,h:11,vx:2.6,vy:0,t:0,life:150});burst(b.x+18,191,C.pale,16,2);}}

function updateShots(){for(const b of shots){if(b.life<=0)continue;b.t++;b.x+=b.vx;b.y+=b.vy;b.life--;if(b.wind)b.y=b.baseY+Math.sin(b.t*.19)*5;
 for(const f of fans){if(f.arena&&G.mode!=='boss'&&G.mode!=='clear')continue;if(!f.arena&&G.mode==='boss')continue;if(Math.abs(b.x+3-f.x)<13&&Math.abs(b.y+2-f.y)<15){if(f.dir!==b.dir){f.dir=b.dir;f.flash=28;G.fanTurns++;burst(f.x,f.y,C.mint,14,1.7);sfx('fan');if(!f.arena)toast('WIND SHIFT! HOLD JUMP.',130);else floatText('RETURN!',f.x-18,f.y-31,C.mint);}/* Aligned shots pass through the switch. */}}
 if(['play'].includes(G.mode))for(const e of enemies){if(e.dead||!overlap(b,e))continue;if(e.type==='shell'&&!e.open){burst(b.x,b.y,C.pale,3,1);sfx('ping');}else{e.hp--;e.flash=6;burst(b.x,b.y,C.cream,4,1.4);if(e.hp<=0)killEnemy(e);else sfx('ping');}b.life=0;break;}

 if(G.mode==='clear'){for(const t of targets){if(t.cool<=0&&overlap(b,{x:t.x-9,y:t.y-9,w:18,h:18})){burst(t.x,t.y,C.mint,12,1.7);t.cool=100;sfx('pop');if(!b.wind)b.life=0;}}}
 if(b.x<G.cam-32||b.x>G.cam+W+32)b.life=0;
 }shots=shots.filter(b=>b.life>0);
 for(const b of hostile){b.t++;b.life--;b.x+=b.vx;b.y+=b.vy;if(b.type==='gust'){if(!b.friendly)b.y=b.baseY+Math.sin(b.t*.07)*2;for(const f of fans){if(!f.arena||G.mode!=='boss')continue;if(!b.friendly&&Math.abs(b.x+6-f.x)<45&&f.dir*b.vx<0){b.friendly=true;b.vx=f.dir*3.8;b.vy=(G.boss.y+27-b.y)*.008;b.life=160;burst(b.x,b.y,C.mint,8,1);sfx('fan');floatText('RETURN',b.x-12,b.y-12,C.mint);}}if(b.friendly&&G.boss&&overlap(b,G.boss)){bossDamage(3,true);b.life=0;}}

 if(b.x<G.cam-40||b.x>G.cam+W+40||b.y>H+16)b.life=0;
 }hostile=hostile.filter(b=>b.life>0);
}

function render(){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.imageSmoothingEnabled=false;if(G.mode==='title')drawTitle();else drawWorld();}

function primary(){if(G.mode==='title')start(true);else if(G.mode==='paused')pause();else if(G.mode==='dead')retry();canvas.focus({preventScroll:true});}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if($('app').requestFullscreen)await $('app').requestFullscreen();}catch(e){$('live').textContent='Full screen is not available in this browser.';}canvas.focus({preventScroll:true});fitScreen();}
if(!document.fullscreenEnabled)$('fullscreen').hidden=true;
$('action').addEventListener('click',primary);

let pixelSize=false;
function fitScreen(){
 const stage=$('stage'),box=stage.getBoundingClientRect(),style=getComputedStyle(stage);
 const aw=Math.max(1,box.width-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight));
 const ah=Math.max(1,box.height-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom));
 let scale=Math.min(aw/256,ah/240);if(pixelSize&&scale>=1)scale=Math.floor(scale);
 const w=Math.max(256,Math.min(600,Math.round(aw/scale)));if(w!==W){W=w;OX=(W-256)>>1;canvas.width=W;if(G.mode==='play')G.cam=Math.floor(clamp(player.x-104-OX,0,ARENA-OX));else if(['boss','bossDown','clear'].includes(G.mode))G.cam=ARENA-OX;render();}
 $('screen').style.width=(W*scale)+'px';$('screen').style.height=(240*scale)+'px';
 $('action').style.left=((OX+48)/W*100)+'%';$('action').style.width=(160/W*100)+'%';
 $('scaleInfo').textContent=W+' × 240 / '+scale.toFixed(2)+'×';
}
$('size').addEventListener('click',()=>{pixelSize=!pixelSize;$('size').textContent=pixelSize?'SIZE: PIXEL':'SIZE: FIT';$('size').setAttribute('aria-pressed',String(pixelSize));fitScreen();canvas.focus({preventScroll:true});});
new ResizeObserver(fitScreen).observe($('stage'));
window.addEventListener('resize',fitScreen);document.addEventListener('fullscreenchange',fitScreen);window.visualViewport?.addEventListener('resize',fitScreen);
const coarse=matchMedia('(pointer: coarse)');
function touchLayout(){document.body.classList.toggle('touch',coarse.matches);requestAnimationFrame(fitScreen);}touchLayout();coarse.addEventListener?.('change',touchLayout);
const touchPointers=new Map();
function rebuildTouch(){touchKeys.clear();for(const key of touchPointers.values())touchKeys.add(key);for(const b of document.querySelectorAll('[data-key]'))b.classList.toggle('down',touchKeys.has(b.dataset.key));}
for(const button of document.querySelectorAll('[data-key]')){
 button.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();button.setPointerCapture(e.pointerId);const key=button.dataset.key;if(!touchKeys.has(key))pressed.add(key);touchPointers.set(e.pointerId,key);rebuildTouch();});
 const release=e=>{touchPointers.delete(e.pointerId);rebuildTouch();};
 button.addEventListener('pointerup',release);button.addEventListener('pointercancel',release);button.addEventListener('lostpointercapture',release);
 button.addEventListener('contextmenu',e=>e.preventDefault());
}
function releaseInput(){keys.clear();pressed.clear();touchPointers.clear();rebuildTouch();}
const validKeys=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS','KeyZ','Space','KeyK','KeyX','KeyJ','Enter','KeyP','Escape','KeyM','KeyF','KeyR','KeyN']);
window.addEventListener('keydown',e=>{
 if(!validKeys.has(e.code)||e.ctrlKey||e.metaKey||e.altKey)return;
 // Keep keyboard navigation of real page buttons intact.
 if((e.code==='Enter'||e.code==='Space')&&e.target instanceof HTMLButtonElement)return;
 e.preventDefault();if(e.repeat)return;initAudio();
 if(e.code==='KeyM'){toggleMute();return;}if(e.code==='KeyF'){fullscreen();return;}
 if(e.code==='Enter'){if(G.mode==='clear')start(true);else if(['title','paused','dead'].includes(G.mode))primary();else pause();return;}
 if(e.code==='KeyP'||e.code==='Escape'){pause();return;}if(e.code==='KeyR'){retry();return;}
 if(e.code==='KeyN'&&G.mode==='paused'){start(true);return;}
 keys.add(e.code);pressed.add(e.code);
});
window.addEventListener('keyup',e=>{keys.delete(e.code);});
window.addEventListener('blur',()=>{releaseInput();if(!['title','paused','dead'].includes(G.mode))pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){releaseInput();if(!['title','paused','dead'].includes(G.mode))pause();}});
canvas.addEventListener('pointerdown',e=>{
 initAudio();canvas.focus({preventScroll:true});const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W-OX,y=(e.clientY-r.top)/r.height*240;
 if(G.mode==='title'||G.mode==='dead'){primary();return;}
 if(G.mode==='paused'){
  if(y>=132&&y<151)pause();else if(y>=151&&y<168)retry();else if(y>=168&&y<184)start(true);else if(y>=184&&y<206){if(x<128)toggleMute();else fullscreen();}
 }else if(G.mode==='clear'&&y>=80&&y<=102)start(true);
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
let last=performance.now(),acc=0;
function loop(now){let elapsed=Math.min(100,now-last);last=now;acc+=elapsed;let n=0;while(acc>=1000/60&&n<6){tick();acc-=1000/60;n++;}musicTick();render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
// Read-only state for repeatable input tests. No game state can be set through this object.
const snapshot=()=>({mode:G.mode,player:{...player,climb:!!player.climb},hp:G.hp,checkpoint:G.checkpoint,cells:[...G.cellSet],time:G.time,deaths:G.deathCount,cam:G.cam,fanTurns:G.fanTurns,kills:G.kills,shots:shots.map(b=>({...b})),hostile:hostile.map(b=>({...b})),fans:fans.map(f=>({...f})),enemies:enemies.map(e=>({...e})),boss:G.boss?{...G.boss}:null,platforms:platforms.map(p=>({...p})),audio:{state:audio.ctx?.state||'not-started',muted:audio.muted,notes:audio.notes,master:audio.master?.gain.value||0},targets:targets.map(t=>({...t})),display:{raster:[canvas.width,canvas.height],width:canvas.getBoundingClientRect().width,height:canvas.getBoundingClientRect().height,pixelSize,touch:document.body.classList.contains('touch')}});
Object.defineProperty(window,'PocketRocket',{value:Object.freeze({inspect:snapshot}),writable:false});
syncUI();fitScreen();
})();
