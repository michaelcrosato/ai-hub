<!--
STARK FOX — an original spiritual successor to Star Fox 64 (N64)

SOURCE INFORMATION
- Date: 2026-10-20 19:15
- Source: Starfox 64 for N64
- Tech: Three.js r180 (WebGPURenderer, no WebGL fallback; TSL node materials; PostProcessing + BloomNode), Rapier 3D 0.19.3 (@dimforge/rapier3d-compat: Rapier queries, trimesh terrain, dynamic debris bodies), Web Audio API (procedural music sequencer, synthesized SFX and radio voices), Gamepad API (standard mapping, PS glyphs, rumble), vanilla ES modules from jsDelivr via an import map, Google Fonts (Russo One, Exo 2)
- Art Direction: stylized cel-shading: MeshToonNodeMaterial with a 4-step ramp, stepped rim light, inverted-hull ink outlines, flat-shaded low-poly terrain with vertex colors, a toon water shader, cel-shaded particle explosions, bloom on glows
- Animation: procedural, written in code: banking, barrel rolls, somersault/U-turn maneuvers, walk cycles for the boss and tanks, rail-relative flight patterns, AI steering, a scripted intro/clear camera, and Rapier rigid-body debris
- Testing: the prompt set no restrictions on testing. I tested in headless Chromium using a software (SwiftShader) WebGPU adapter, because no hardware GPU was reachable in WSL2. Tests used a deterministic simulation hook, an AI test pilot, scripted UI walkthroughs, an emulated touch device (Pixel 7) and a faked DualSense gamepad. Real-GPU frame rate, real controllers and iOS Safari were not tested
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort medium-ultracode
- Usage: unknown. A rough estimate is ~0.5M tokens in total (~0.32M in the main session plus ~0.2M across two helper subagents for audio and models); a cost estimate in USD and the session time are not available

ENGINE FEEDBACK
- What did you like most about the engine?
  Three.js r180's TSL let shader-level effects (toon rim light, inverted-hull outlines, animated toon water, hashed starfield sky, post vignette/damage/flash) be written in plain JS next to the game code, and they ran unchanged on the WebGPU backend. Rapier's compat build initializes from a single file with no wasm hosting step.
- Did you get stuck or guess wrong?
  Yes, twice. (1) I triggered player death (which spawns debris rigid bodies) inside a Rapier intersectionsWithShape callback. wasm-bindgen silently swallowed the resulting error, so the respawn never fired. The fix was to collect overlaps first and handle them afterwards. (2) I guessed Matrix4.lookAt's eye/target convention backwards for non-camera objects, so ships flew tail-first until I fixed it.
- What was the most important thing you had to build yourself?
  A branching, loopable rail system (arc-length frames, segment chaining, fork choosers, checkpoint restore) with a data-driven event interpreter. Every on-rails encounter, the route split and the circling boss arena are built on it. Outlines, the particle system, the menus and the attract-mode AI were also custom.
- What was the hardest part about using the engine?
  Testing WebGPU without a GPU: the software adapter ran at ~0.25 FPS at 720p, so I had to separate simulation from rendering to verify gameplay. On the API side, WebGPURenderer quietly falls back to WebGL2 unless you check the backend yourself, and r180 has no built-in toon outline pass.
- If you had to remove or overhaul one thing from engine, what would that be?
  The silent WebGL2 fallback in WebGPURenderer. A strict mode that throws when WebGPU is unavailable would make 'no fallback' requirements explicit.
- If you could change one thing about the engine, what would it be?
  Ship an official cel/toon outline post pass (normal+depth edge detection) for WebGPU, and in Rapier, raise a loud error when the world is mutated from inside a query callback instead of failing silently.

PROMPT FEEDBACK
- What did you like most about this prompt?
  The concrete quality bar (feature-complete demos like the MGS2 Tanker or Doom Episode 1), plus specific, testable UX requirements: attract mode after 10 s, touch-only gate, inverted-axis toggles, controller-first 10-foot UI.
- What was confusing?
  'Reasoning effort medium-ultracode' and the file name's mixed GameTitle-SOURCE pattern needed interpretation (I used StarkFox-Starfox64). 'WEBGPU, no fallback' could mean no WebGL renderer, or no degraded path at all; I read it as the first and show an explanatory error. The Usage line asks for estimates that aren't exposed to the model.
- What was the hardest thing to do?
  Making two full missions (an on-rails mission with a branching route and a walking boss, and an all-range dogfight with a capital-ship boss) feel complete and balanced while only being able to watch them through a software renderer at a fraction of a frame per second.
- If there was one test you could of run, what would that test be?
  A real-hardware playtest with a DualSense on a GPU machine at 60+ FPS, to tune feel (steering response, boss HP, damage) and confirm rumble, glyphs and timings. The automated AI pilot can't judge fun or fairness.
-->

<script type="module">
// ===== 01_core.js — imports, math utils, settings, save data =====
import * as THREE from 'three/webgpu';

const GAME_TITLE = 'Stark Fox';
const BUILD_ID = 'StarkFox-Starfox64-claude-opus-5-5-medium-ultracode-20261020-1915';

// ---------- math helpers ----------
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const smooth = (t) => t * t * (3 - 2 * t);
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(), _v4 = new THREE.Vector3();
const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion();
const _m1 = new THREE.Matrix4();
const _e1 = new THREE.Euler();
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// deterministic RNG (mulberry32) for level generation
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// value noise 2D (smooth) for terrain
const Noise = (() => {
  const perm = new Uint8Array(512);
  const r = makeRng(1337);
  const p = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const grad = (h, x, y) => { const u = h & 1 ? x : -x, v = h & 2 ? y : -y; return (h & 4 ? u + v : u - v) * 0.7; };
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  function n2(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = fade(x), v = fade(y);
    const a = perm[X] + Y, b = perm[X + 1] + Y;
    return lerp(lerp(grad(perm[a], x, y), grad(perm[b], x - 1, y), u), lerp(grad(perm[a + 1], x, y - 1), grad(perm[b + 1], x - 1, y - 1), u), v);
  }
  function fbm(x, y, oct = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * n2(x * f, y * f); f *= 2; a *= 0.5; } return s; }
  return { n2, fbm };
})();

// ---------- settings (persisted) ----------
const DEFAULT_SETTINGS = {
  invertPadX: false,       // quick fix for intermittently inverted gamepad axes
  invertPadY: false,

const Save = {

  load() {

    } catch (e) { /* storage unavailable: keep defaults */ }
  },
  store() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
};
Save.load();
const Settings = Save.data.settings;

// tiny event bus
const Bus = {
  h: {},
  on(n, f) { (this.h[n] ||= []).push(f); },
  emit(n, a) { (this.h[n] || []).forEach((f) => f(a)); },
};

// ===== generated from info.json =====
const SOURCE_INFO_HTML = "<h2>Source Information</h2><ul><li><b>Date:</b> 2026-10-20 19:15</li><li><b>Source:</b> Starfox 64 for N64</li><li><b>Tech:</b> Three.js r180 (WebGPURenderer, no WebGL fallback; TSL node materials; PostProcessing + BloomNode), Rapier 3D 0.19.3 (@dimforge/rapier3d-compat: Rapier queries, trimesh terrain, dynamic debris bodies), Web Audio API (procedural music sequencer, synthesized SFX and radio voices), Gamepad API (standard mapping, PS glyphs, rumble), vanilla ES modules from jsDelivr via an import map, Google Fonts (Russo One, Exo 2)</li><li><b>Art Direction:</b> stylized cel-shading: MeshToonNodeMaterial with a 4-step ramp, stepped rim light, inverted-hull ink outlines, flat-shaded low-poly terrain with vertex colors, a toon water shader, cel-shaded particle explosions, bloom on glows</li><li><b>Animation:</b> procedural, written in code: banking, barrel rolls, somersault/U-turn maneuvers, walk cycles for the boss and tanks, rail-relative flight patterns, AI steering, a scripted intro/clear camera, and Rapier rigid-body debris</li><li><b>Testing:</b> the prompt set no restrictions on testing. I tested in headless Chromium using a software (SwiftShader) WebGPU adapter, because no hardware GPU was reachable in WSL2. Tests used a deterministic simulation hook, an AI test pilot, scripted UI walkthroughs, an emulated touch device (Pixel 7) and a faked DualSense gamepad. Real-GPU frame rate, real controllers and iOS Safari were not tested</li><li><b>Environment:</b> Claude Code CLI (headless); Linux; browser unknown</li><li><b>Model:</b> Anthropic, claude-opus-5-5, reasoning effort medium-ultracode</li><li><b>Usage:</b> unknown. A rough estimate is ~0.5M tokens in total (~0.32M in the main session plus ~0.2M across two helper subagents for audio and models); a cost estimate in USD and the session time are not available</li></ul>";
const ENGINE_FEEDBACK_HTML = "<h2>Engine Feedback</h2><ul><li><b>What did you like most about the engine?</b><br>Three.js r180&#x27;s TSL let shader-level effects (toon rim light, inverted-hull outlines, animated toon water, hashed starfield sky, post vignette/damage/flash) be written in plain JS next to the game code, and they ran unchanged on the WebGPU backend. Rapier&#x27;s compat build initializes from a single file with no wasm hosting step.</li><li><b>Did you get stuck or guess wrong?</b><br>Yes, twice. (1) I triggered player death (which spawns debris rigid bodies) inside a Rapier intersectionsWithShape callback. wasm-bindgen silently swallowed the resulting error, so the respawn never fired. The fix was to collect overlaps first and handle them afterwards. (2) I guessed Matrix4.lookAt&#x27;s eye/target convention backwards for non-camera objects, so ships flew tail-first until I fixed it.</li><li><b>What was the most important thing you had to build yourself?</b><br>A branching, loopable rail system (arc-length frames, segment chaining, fork choosers, checkpoint restore) with a data-driven event interpreter. Every on-rails encounter, the route split and the circling boss arena are built on it. Outlines, the particle system, the menus and the attract-mode AI were also custom.</li><li><b>What was the hardest part about using the engine?</b><br>Testing WebGPU without a GPU: the software adapter ran at ~0.25 FPS at 720p, so I had to separate simulation from rendering to verify gameplay. On the API side, WebGPURenderer quietly falls back to WebGL2 unless you check the backend yourself, and r180 has no built-in toon outline pass.</li><li><b>If you had to remove or overhaul one thing from engine, what would that be?</b><br>The silent WebGL2 fallback in WebGPURenderer. A strict mode that throws when WebGPU is unavailable would make &#x27;no fallback&#x27; requirements explicit.</li><li><b>If you could change one thing about the engine, what would it be?</b><br>Ship an official cel/toon outline post pass (normal+depth edge detection) for WebGPU, and in Rapier, raise a loud error when the world is mutated from inside a query callback instead of failing silently.</li></ul>";
const PROMPT_FEEDBACK_HTML = "<h2>Prompt Feedback</h2><ul><li><b>What did you like most about this prompt?</b><br>The concrete quality bar (feature-complete demos like the MGS2 Tanker or Doom Episode 1), plus specific, testable UX requirements: attract mode after 10 s, touch-only gate, inverted-axis toggles, controller-first 10-foot UI.</li><li><b>What was confusing?</b><br>&#x27;Reasoning effort medium-ultracode&#x27; and the file name&#x27;s mixed GameTitle-SOURCE pattern needed interpretation (I used StarkFox-Starfox64). &#x27;WEBGPU, no fallback&#x27; could mean no WebGL renderer, or no degraded path at all; I read it as the first and show an explanatory error. The Usage line asks for estimates that aren&#x27;t exposed to the model.</li><li><b>What was the hardest thing to do?</b><br>Making two full missions (an on-rails mission with a branching route and a walking boss, and an all-range dogfight with a capital-ship boss) feel complete and balanced while only being able to watch them through a software renderer at a fraction of a frame per second.</li><li><b>If there was one test you could of run, what would that test be?</b><br>A real-hardware playtest with a DualSense on a GPU machine at 60+ FPS, to tune feel (steering response, boss HP, damage) and confirm rumble, glyphs and timings. The automated AI pilot can&#x27;t judge fun or fairness.</li></ul>";

// ===== 02_audio.js — procedural Web Audio: SFX, loops, tracker music, stingers, radio voices =====
const AudioSys = (() => {
  let ctx = null;
  let master, comp, musicVol, sfxVol, voiceVol, duckFilter, duckGain, stingerDuck, delayIn, convolver, musicRevSend, sfxRevSend;
  let noiseBuf = null;
  const vols = { master: 1, music: 0.7, sfx: 0.85, voice: 0.8 };
  const DUMMY = { set() {}, stop() {} };

  // ---------------- helpers ----------------
  const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function noteToMidi(n) {
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    if (!m) return null;
    return 12 * (parseInt(m[3], 10) + 1) + NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  }
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const now = () => ctx.currentTime;

  function makeNoise() {
    const len = ctx.sampleRate * 2;
    const b = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function makeImpulse(seconds, decay) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return b;
  }
  function makeDrive(amount) {
    const n = 1024, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1; curve[i] = Math.tanh(x * amount) / Math.tanh(amount); }
    return curve;
  }

  /** oscillator with pitch sweep + envelope */
  function tone(type, f0, f1, t, dur, gain, out, o = {}) {
    const osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(1, f0), t);
    if (f1 !== null && f1 !== undefined && f1 !== f0) {
      if (o.linear) osc.frequency.linearRampToValueAtTime(Math.max(1, f1), t + (o.sweep ?? dur));
      else osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + (o.sweep ?? dur));
    }
    if (o.detune) osc.detune.value = o.detune;
    const g = ctx.createGain();
    const a = o.attack ?? 0.002;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + a);
    if (o.hold) g.gain.setValueAtTime(gain, t + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.filter) {
      const f = ctx.createBiquadFilter();
      f.type = o.filter; f.frequency.value = o.cutoff ?? 3000; f.Q.value = o.q ?? 0.7;
      if (o.cutoffEnd) f.frequency.exponentialRampToValueAtTime(o.cutoffEnd, t + dur);
      osc.connect(f); node = f;
    }
    node.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + dur + 0.05);
    return osc;
  }
  /** filtered noise burst */
  function noise(t, dur, gain, out, o = {}) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = o.type ?? 'lowpass';
    f.frequency.setValueAtTime(o.f0 ?? 3000, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + (o.sweep ?? dur));
    f.Q.value = o.q ?? 0.8;
    const g = ctx.createGain();
    const a = o.attack ?? 0.003;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + a);
    if (o.hold) g.gain.setValueAtTime(gain, t + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(out);
    src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
    return src;
  }

  // ---------------- SFX definitions ----------------
  // each: (t, out, p, rev) => duration ; p = pitch multiplier, rev = reverb send node
  const SFX = {
    laser(t, o, p) {
      tone('square', 1500 * p, 210 * p, t, 0.13, 0.28, o, { filter: 'lowpass', cutoff: 5000 });
      tone('sawtooth', 760 * p, 140 * p, t, 0.1, 0.12, o);
      noise(t, 0.03, 0.12, o, { type: 'highpass', f0: 5000 });
      return 0.14;
    },
    laserTwin(t, o, p) {
      tone('square', 1650 * p, 260 * p, t, 0.14, 0.2, o, { filter: 'lowpass', cutoff: 5500 });
      tone('square', 1720 * p, 280 * p, t + 0.012, 0.14, 0.2, o, { filter: 'lowpass', cutoff: 5500 });
      tone('sawtooth', 820 * p, 160 * p, t, 0.11, 0.1, o);
      noise(t, 0.035, 0.12, o, { type: 'highpass', f0: 5200 });
      return 0.16;

  function play(name, { pan = 0, pitch = 1, volume = 1 } = {}) {
    if (!ctx || !SFX[name]) return;
    const t = now();
    const list = (active[name] ||= []);
    while (list.length && list[0] <= t) list.shift();
    if (list.length >= (POLY[name] ?? 4)) return;
    const g = ctx.createGain(); g.gain.value = clamp(volume, 0, 2);
    const pn = ctx.createStereoPanner(); pn.pan.value = clamp(pan, -1, 1);
    g.connect(pn); pn.connect(sfxVol);
    const rev = ctx.createGain(); rev.gain.value = clamp(volume, 0, 2); rev.connect(sfxRevSend);
    const d = SFX[name](t, g, pitch, rev);
    list.push(t + d); list.sort((a, b) => a - b);
    setTimeout(() => { try { g.disconnect(); pn.disconnect(); rev.disconnect(); } catch (e) { /* already gone */ } }, (d + 0.5) * 1000);
  }

  // ---------------- loops ----------------
  function loop(name) {
    if (!ctx) return DUMMY;
    const t = now();
    const out = ctx.createGain(); out.gain.setValueAtTime(0.0001, t); out.gain.linearRampToValueAtTime(1, t + 0.06);
    out.connect(sfxVol);
    const nodes = [];
    const startAll = () => nodes.forEach((n) => n.start && n.start(t));
    let setFn = () => {};
    const smooth = (param, v, tc = 0.06) => param.setTargetAtTime(v, now(), tc);
    const noiseSrc = () => { const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; nodes.push(s); return s; };
    const osc = (type, f) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; nodes.push(o); return o; };

    if (name === 'charge') {
      const a = osc('sawtooth', 110), b = osc('square', 111.5);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400; f.Q.value = 6;
      const trem = ctx.createGain(); trem.gain.value = 0.7;
      const lfo = osc('sine', 6); const lg = ctx.createGain(); lg.gain.value = 0.3; lfo.connect(lg); lg.connect(trem.gain);
      const vol = ctx.createGain(); vol.gain.value = 0.08;
      const shim = osc('sine', 1800); const sg = ctx.createGain(); sg.gain.value = 0; shim.connect(sg); sg.connect(out);
      a.connect(f); b.connect(f); f.connect(trem); trem.connect(vol); vol.connect(out);
      setFn = ({ level = 0 } = {}) => {
        const l = clamp(level, 0, 1);
        smooth(a.frequency, 110 + l * 330); smooth(b.frequency, 111.5 + l * 336);
        smooth(f.frequency, 400 + l * 3600); smooth(lfo.frequency, 6 + l * 22);
        smooth(vol.gain, 0.08 + l * 0.12);
        smooth(sg.gain, l >= 1 ? 0.05 : 0); smooth(shim.frequency, 1800 + l * 600);
      };
    } else if (name === 'engine') {
      const n = noiseSrc();
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = 0.9;
      const ng = ctx.createGain(); ng.gain.value = 0.09;
      const lo = osc('triangle', 55), lo2 = osc('sawtooth', 55.7);
      const lf = ctx.createBiquadFilter(); lf.type = 'lowpass'; lf.frequency.value = 260;
      const lg = ctx.createGain(); lg.gain.value = 0.1;
      n.connect(bp); bp.connect(ng); ng.connect(out);
      lo.connect(lf); lo2.connect(lf); lf.connect(lg); lg.connect(out);
      setFn = ({ speed = 0.5, boost = 0, brake = 0 } = {}) => {
        const s = clamp(speed, 0, 1) + (boost ? 0.6 : 0) - (brake ? 0.35 : 0);
        smooth(bp.frequency, 300 + s * 900, 0.15); smooth(ng.gain, 0.05 + s * 0.06 + (boost ? 0.06 : 0), 0.15);
        smooth(lo.frequency, 45 + s * 40, 0.2); smooth(lo2.frequency, 45.7 + s * 41, 0.2);
        smooth(lf.frequency, 200 + s * 400, 0.2);
      };
      setFn({});
    } else if (name === 'boost') {
      const n = noiseSrc();
      const hp = ctx.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 900; hp.Q.value = 1.2;
      hp.frequency.setValueAtTime(600, t); hp.frequency.exponentialRampToValueAtTime(2400, t + 0.6);
      const ng = ctx.createGain(); ng.gain.value = 0.22;
      const s = osc('sawtooth', 120); s.frequency.setValueAtTime(90, t); s.frequency.exponentialRampToValueAtTime(220, t + 0.6);
      const sf = ctx.createBiquadFilter(); sf.type = 'lowpass'; sf.frequency.value = 900;
      const sg = ctx.createGain(); sg.gain.value = 0.07;
      n.connect(hp); hp.connect(ng); ng.connect(out); s.connect(sf); sf.connect(sg); sg.connect(out);
      setFn = ({ level = 1 } = {}) => { smooth(ng.gain, 0.22 * level); smooth(sg.gain, 0.07 * level); };
    } else if (name === 'lowShield') {
      const o = osc('square', 1180);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 3000;
      const amp = ctx.createGain(); amp.gain.value = 0.045;
      const lfo = osc('square', 2.6); const lg = ctx.createGain(); lg.gain.value = 0.045; lfo.connect(lg); lg.connect(amp.gain);
      o.connect(f); f.connect(amp); amp.connect(out);
      setFn = ({ rate = 2.6 } = {}) => smooth(lfo.frequency, rate);
    } else {
      out.disconnect();
      return DUMMY;
    }
    startAll();
    let stopped = false;
    return {
      set(p) { if (!stopped) setFn(p || {}); },
      stop() {
        if (stopped) return; stopped = true;
        const tt = now();
        out.gain.cancelScheduledValues(tt); out.gain.setValueAtTime(out.gain.value, tt); out.gain.linearRampToValueAtTime(0.0001, tt + 0.1);
        nodes.forEach((n) => { try { n.stop(tt + 0.15); } catch (e) { /* not started */ } });
        setTimeout(() => { try { out.disconnect(); } catch (e) { /* gone */ } }, 400);
      },
    };
  }

    const t = now() + 0.02;
    const sylDur = (dur - 0.1) / syl;
    const question = /\?\s*$/.test(text || ''), exclaim = /!\s*$/.test(text || '');
    // radio chain
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 320;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = c.nasal ? 2600 : 3300;
    const sh = ctx.createWaveShaper(); sh.curve = makeDrive(c.growl ? 3 : 1.8);
    const vg = ctx.createGain(); vg.gain.value = 0.9;
    hp.connect(lp); lp.connect(sh); sh.connect(vg); vg.connect(voiceVol);
    if (c.nasal) { const pk = ctx.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 1400; pk.gain.value = 9; pk.Q.value = 2; lp.disconnect(); lp.connect(pk); pk.connect(sh); }
    // source
    const src = ctx.createOscillator(); src.type = c.wave;
    const env = ctx.createGain(); env.gain.setValueAtTime(0.0001, t);
    const f1 = ctx.createBiquadFilter(); f1.type = 'bandpass'; f1.Q.value = 7;
    const f2 = ctx.createBiquadFilter(); f2.type = 'bandpass'; f2.Q.value = 9;
    const g1 = ctx.createGain(); g1.gain.value = 1.4; const g2 = ctx.createGain(); g2.gain.value = 0.9;
    src.connect(f1); src.connect(f2); f1.connect(g1); f2.connect(g2); g1.connect(env); g2.connect(env);
    if (c.growl) {
      const gr = ctx.createGain(); gr.gain.value = 0.6; env.connect(gr); gr.connect(hp);
      const am = ctx.createOscillator(); am.frequency.value = c.growl; const ag = ctx.createGain(); ag.gain.value = 0.4;
      am.connect(ag); ag.connect(gr.gain); am.start(t); am.stop(t + dur + 0.1);
    } else env.connect(hp);
    const r = makeRng(Math.floor(Math.random() * 1e9));
    let prev = c.f;
    src.frequency.setValueAtTime(c.f, t);
    for (let i = 0; i < syl; i++) {
      const st = t + i * sylDur;
      const v = VOWELS[Math.floor(r() * VOWELS.length)];
      const last = i === syl - 1;
      const contour = last ? (question ? 5 : exclaim ? 1 : -4) : 0;
      const semi = (r() * 2 - 1) * c.jitter + (i === 0 && exclaim ? 2 : 0);
      const pitch = c.f * Math.pow(2, semi / 12);
      src.frequency.setValueAtTime(prev, st);
      src.frequency.exponentialRampToValueAtTime(pitch, st + 0.03);
      prev = pitch;
      if (last) { prev = pitch * Math.pow(2, contour / 12); src.frequency.exponentialRampToValueAtTime(prev, st + sylDur); }
      f1.frequency.setTargetAtTime(v[0] * c.fs, st, 0.02);
      f2.frequency.setTargetAtTime(v[1] * c.fs, st, 0.02);
      const on = sylDur * (0.68 + r() * 0.2);
      env.gain.setValueAtTime(0.0001, st);
      env.gain.linearRampToValueAtTime(0.55, st + 0.015);
      env.gain.setValueAtTime(0.5, st + on - 0.02);
      env.gain.linearRampToValueAtTime(0.0001, st + on);
    }
    src.start(t); src.stop(t + dur + 0.1);
    // squelch clicks
    noise(t - 0.01, 0.06, 0.18, voiceVol, { type: 'bandpass', f0: 2400, q: 1.4 });
    noise(t + dur - 0.02, 0.09, 0.22, voiceVol, { type: 'bandpass', f0: 1800, q: 1.2 });
    tone('sine', 1900, null, t + dur, 0.04, 0.08, voiceVol);
    setTimeout(() => { try { vg.disconnect(); } catch (e) { /* gone */ } }, (dur + 0.8) * 1000);
    return dur;
  }

  // ---------------- init / volume / duck ----------------
  function applyVolumes() {
    if (!ctx) return;
    const t = now();
    master.gain.setTargetAtTime(vols.master, t, 0.05);
    musicVol.gain.setTargetAtTime(vols.music * 0.55, t, 0.05);
    sfxVol.gain.setTargetAtTime(vols.sfx, t, 0.05);
    voiceVol.gain.setTargetAtTime(vols.voice, t, 0.05);
  }
  function setVolumes(v = {}) {
    for (const k of ['master', 'music', 'sfx', 'voice']) if (typeof v[k] === 'number') vols[k] = clamp(v[k], 0, 1);
    applyVolumes();
  }
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC({ latencyHint: 'interactive' });
    noiseBuf = makeNoise();
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 5; comp.attack.value = 0.004; comp.release.value = 0.2;
    master = ctx.createGain(); master.connect(comp); comp.connect(ctx.destination);
    musicVol = ctx.createGain(); sfxVol = ctx.createGain(); voiceVol = ctx.createGain();
    musicVol.connect(master); sfxVol.connect(master); voiceVol.connect(master);
    duckFilter = ctx.createBiquadFilter(); duckFilter.type = 'lowpass'; duckFilter.frequency.value = 20000; duckFilter.Q.value = 0.5;
    duckGain = ctx.createGain(); stingerDuck = ctx.createGain();
    duckFilter.connect(duckGain); duckGain.connect(stingerDuck); stingerDuck.connect(musicVol);
    // reverb
    convolver = ctx.createConvolver(); convolver.buffer = makeImpulse(2.2, 3);
    const revRet = ctx.createGain(); revRet.gain.value = 0.32; convolver.connect(revRet); revRet.connect(master);
    musicRevSend = ctx.createGain(); musicRevSend.gain.value = 0.22; musicVol.connect(musicRevSend); musicRevSend.connect(convolver);
    sfxRevSend = ctx.createGain(); sfxRevSend.gain.value = 0.6; sfxRevSend.connect(sfxVol);
    const sfxRev2 = ctx.createGain(); sfxRev2.gain.value = 0.5; sfxVol.connect(sfxRev2); sfxRev2.connect(convolver);
    // tempo-free slapback delay for leads
    delayIn = ctx.createGain();
    const dl = ctx.createDelay(1.0); dl.delayTime.value = 0.27;
    const fb = ctx.createGain(); fb.gain.value = 0.32;
    const dlf = ctx.createBiquadFilter(); dlf.type = 'lowpass'; dlf.frequency.value = 2400;
    delayIn.connect(dl); dl.connect(dlf); dlf.connect(fb); fb.connect(dl); dlf.connect(duckFilter);
    vols.music = Settings.musicVol ?? vols.music; vols.sfx = Settings.sfxVol ?? vols.sfx; vols.voice = Settings.voiceVol ?? vols.voice;
    applyVolumes();
    schedTimer = setInterval(tick, 25);
    if (ctx.state === 'suspended') ctx.resume();
    if (pendingTrack) { const p = pendingTrack; pendingTrack = null; music(p, { fade: 0.3 }); }
  }
  function duck(on) {
    if (!ctx) return;
    const t = now();
    duckFilter.frequency.setTargetAtTime(on ? 650 : 20000, t, 0.12);
    duckGain.gain.setTargetAtTime(on ? 0.5 : 1, t, 0.12);
  }

  return {
    init, setVolumes, play, loop, music, stinger, voice, duck,
    get ready() { return !!ctx; },
    get context() { return ctx; },
    get track() { return current ? current.id : 'none'; },
    songs: SONGS, sfxNames: Object.keys(SFX),
  };
})();

// ===== 03_render.js — WebGPU renderer, cel-shading materials, outlines, post =====
const R = {
  renderer: null, scene: null, camera: null, post: null, sun: null, hemi: null,
  bloomNode: null, flashU: null, vignetteU: null, hitU: null, time: 0,
};

// 4-band toon ramp (hard steps = cel look)
const TOON_RAMP = (() => {
  const steps = [70, 140, 210, 255];
  const data = new Uint8Array(steps.length * 4);
  steps.forEach((s, i) => { data[i * 4] = data[i * 4 + 1] = data[i * 4 + 2] = s; data[i * 4 + 3] = 255; });
  const t = new THREE.DataTexture(data, steps.length, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
})();

const _matCache = new Map();
/**
 * Cel-shaded material. opts: { emissive, emissiveIntensity, transparent, opacity, rim (0..1), side, flat }
 */
function toon(color, opts = {}) {
  const key = 't' + color + JSON.stringify(opts);
  if (_matCache.has(key)) return _matCache.get(key);
  const m = new THREE.MeshToonNodeMaterial({ color, gradientMap: TOON_RAMP });
  if (opts.emissive !== undefined) { m.emissive = new THREE.Color(opts.emissive); m.emissiveIntensity = opts.emissiveIntensity ?? 1; }
  if (opts.transparent) { m.transparent = true; m.opacity = opts.opacity ?? 0.6; m.depthWrite = false; }
  if (opts.side) m.side = opts.side;
  if (opts.flat) m.flatShading = true;
  // stepped rim light for an anime-style edge highlight
  const rimAmt = opts.rim ?? 0.35;
  if (rimAmt > 0) {
    const { float, dot, normalView, positionViewDirection, step, vec3, color: tslColor } = TSL;
    const fres = float(1).sub(dot(normalView, positionViewDirection).max(0));
    const rim = step(0.62, fres).mul(rimAmt);
    const base = opts.emissive !== undefined ? tslColor(new THREE.Color(opts.emissive)).mul(opts.emissiveIntensity ?? 1) : vec3(0);
    m.emissiveNode = base.add(tslColor(new THREE.Color(color)).mul(rim));
  }
  _matCache.set(key, m);
  return m;
}

/** Unlit, HDR-bright material for glows (engines, lasers, lights). intensity>1 drives bloom. */
function glow(color, intensity = 2, opts = {}) {
  const key = 'g' + color + '_' + intensity + JSON.stringify(opts);
  if (_matCache.has(key)) return _matCache.get(key);
  const c = new THREE.Color(color).multiplyScalar(intensity);
  const m = new THREE.MeshBasicNodeMaterial({ color: c });
  if (opts.transparent) { m.transparent = true; m.opacity = opts.opacity ?? 0.7; m.depthWrite = false; }
  if (opts.additive) { m.blending = THREE.AdditiveBlending; m.transparent = true; m.depthWrite = false; }
  if (opts.side) m.side = opts.side;
  m.toneMapped = false;
  _matCache.set(key, m);
  return m;
}

const _outlineGeoCache = new WeakMap();
const _outlineMatCache = new Map();
function outlineMaterial(thickness, color = 0x0d0f1a) {
  const key = thickness + '_' + color;
  if (_outlineMatCache.has(key)) return _outlineMatCache.get(key);
  const m = new THREE.MeshBasicNodeMaterial({ color, side: THREE.BackSide });
  m.positionNode = TSL.positionLocal.add(TSL.normalLocal.mul(thickness));
  _outlineMatCache.set(key, m);
  return m;
}
function outlineGeometry(geo) {
  let g = _outlineGeoCache.get(geo);
  if (g) return g;
  g = new THREE.BufferGeometry();
  g.setAttribute('position', geo.getAttribute('position').clone());
  if (geo.index) g.setIndex(geo.index.clone());
  g = BufferGeometryUtils.mergeVertices(g, 1e-3);
  g.computeVertexNormals();
  _outlineGeoCache.set(geo, g);
  return g;
}
/** Adds an inverted-hull ink outline as a child of mesh. Returns mesh. */
function outlined(mesh, thickness = 0.05, color = 0x0d0f1a) {
  const hull = new THREE.Mesh(outlineGeometry(mesh.geometry), outlineMaterial(thickness, color));
  hull.name = 'outline';
  hull.castShadow = false; hull.receiveShadow = false;
  hull.raycast = () => {};
  mesh.add(hull);
  return mesh;
}
/** Convenience mesh builder: shadows + outline. */
function mkMesh(geometry, material, o = {}) {
  const m = new THREE.Mesh(geometry, material);
  m.castShadow = o.cast ?? true;
  m.receiveShadow = o.receive ?? true;
  if (o.outline ?? true) outlined(m, o.thickness ?? 0.05, o.outlineColor ?? 0x0d0f1a);
  return m;
}

async function initRenderer(canvasHost) {
  const renderer = new THREE.WebGPURenderer({ antialias: true, alpha: false, forceWebGL: false });
  await renderer.init();
  if (!renderer.backend || !renderer.backend.isWebGPUBackend) throw new Error('WebGPU backend unavailable');
  const LOW = /[?&]lowgfx/.test(location.search); // test-only switch for software adapters
  renderer.setPixelRatio(LOW ? 0.35 : Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = !LOW;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  canvasHost.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.5, 9000);
  scene.add(camera);

  const hemi = new THREE.HemisphereLight(0xbfdcff, 0x5a4a3a, 1.1);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -140; sun.shadow.camera.right = 140;
  sun.shadow.camera.top = 140; sun.shadow.camera.bottom = -140;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 900;
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.02;
  scene.add(sun); scene.add(sun.target);

  // post: scene pass -> bloom -> screen flash / damage vignette
  const post = new THREE.PostProcessing(renderer);
  const { pass, uniform, uv, vec3, vec4, float, mix, length, smoothstep } = TSL;
  const scenePass = pass(scene, camera);
  const sceneColor = scenePass.getTextureNode('output');
  const bloomNode = bloom(sceneColor, 0.75, 0.45, 0.82);
  const flashU = uniform(0);       // white flash (bombs, explosions)
  const hitU = uniform(0);         // red damage vignette
  const vignetteU = uniform(0.35); // constant cinematic vignette
  const fadeU = uniform(0);        // fade to black for transitions
  const d = length(uv().sub(0.5)).mul(1.414);
  const vig = smoothstep(0.55, 1.15, d);
  let col = sceneColor.add(bloomNode).rgb;
  col = col.mul(float(1).sub(vig.mul(vignetteU)));
  col = mix(col, vec3(1.0, 0.08, 0.05), vig.mul(hitU).clamp(0, 1));
  col = mix(col, vec3(1, 1, 1), flashU);
  col = mix(col, vec3(0, 0, 0), fadeU);
  post.outputNode = vec4(col, 1);

  Object.assign(R, { renderer, scene, camera, post, sun, hemi, bloomNode, flashU, hitU, vignetteU, fadeU });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  return R;
}

/** Keep the sun's shadow frustum centred on the action. */
function followSun(target, dir = R.sunDir || V3(0.45, 0.8, 0.3)) {
  R.sun.target.position.copy(target);
  R.sun.position.copy(target).addScaledVector(_v4.copy(dir).normalize(), 400);
}

function clearScene() {
  const keep = new Set([R.camera, R.sun, R.sun.target, R.hemi]);
  for (const c of [...R.scene.children]) if (!keep.has(c)) R.scene.remove(c);
  R.scene.fog = null;
  R.scene.background = null;
}

// ===== 04_models.js — procedural cel-shaded models + pilot portraits =====
const Models = (() => {
  const G = {}; // geometry cache
  const geo = (key, make) => G[key] || (G[key] = make());
  const box = (w, h, d) => geo(`b${w}_${h}_${d}`, () => new THREE.BoxGeometry(w, h, d));
  const cyl = (rt, rb, h, s = 12) => geo(`c${rt}_${rb}_${h}_${s}`, () => new THREE.CylinderGeometry(rt, rb, h, s));
  const sph = (r, ws = 16, hs = 12) => geo(`s${r}_${ws}_${hs}`, () => new THREE.SphereGeometry(r, ws, hs));
  const cone = (r, h, s = 12) => geo(`k${r}_${h}_${s}`, () => new THREE.ConeGeometry(r, h, s));
  const tor = (r, t, rs = 12, ts = 48) => geo(`t${r}_${t}_${rs}_${ts}`, () => new THREE.TorusGeometry(r, t, rs, ts));
  const ico = (r, d = 0) => geo(`i${r}_${d}`, () => new THREE.IcosahedronGeometry(r, d));
  const oct = (r) => geo(`o${r}`, () => new THREE.OctahedronGeometry(r, 0));

  // extruded flat plate from 2D points in XZ plane (shape y -> -z), thickness along Y
  function plate(key, pts, thick, bevel = 0) {
    return geo(key, () => {
      const s = new THREE.Shape();
      pts.forEach(([x, z], i) => (i ? s.lineTo(x, -z) : s.moveTo(x, -z)));
      s.closePath();
      const g = new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 1 });
      g.rotateX(-Math.PI / 2); // shape XY -> XZ, extrude +Y
      g.translate(0, -thick / 2, 0);
      g.computeVertexNormals();
      return g;
    });
  }
  // fuselage via lathe (profile radius along -Z)
  function lathe(key, prof, segs = 12) {
    return geo(key, () => {
      const g = new THREE.LatheGeometry(prof.map(([r, z]) => new THREE.Vector2(r, z)), segs);
      g.rotateX(-Math.PI / 2); // lathe Y axis -> -Z
      return g;
    });
  }

  function M(g, mat, o, x = 0, y = 0, z = 0, parent) {
    const m = mkMesh(g, mat, o || {});
    m.position.set(x, y, z);
    if (parent) parent.add(m);
    return m;
  }
  const node = (parent, x = 0, y = 0, z = 0, name) => {
    const o = new THREE.Object3D();
    o.position.set(x, y, z);
    if (name) o.name = name;
    parent.add(o);
    return o;
  };

  function limb(parent, a, b, w, mat, o) {
    const len = a.distanceTo(b);

  function playerShip(palette = {}) {
    const p = { body: 0xe8ecf2, accent: 0x2f6bff, trim: 0x1b2233, glow: 0x59d6ff, ...palette };
    const root = new THREE.Group();
    const ol = T(0.045);
    const body = M(lathe('shipBody', [[0, -3.4], [0.35, -2.8], [0.62, -1.6], [0.8, -0.2], [0.85, 1.0], [0.7, 1.9], [0.45, 2.3], [0, 2.35]], 10), toon(p.body), ol, 0, 0, 0, root);
    body.scale.set(1, 0.72, 1);
    // nose stripe & intake
    M(box(0.5, 0.18, 2.6), toon(p.accent), T(0.03), 0, 0.42, -1.2, root);
    M(box(1.9, 0.5, 1.4), toon(p.trim), ol, 0, -0.15, 1.2, root);
    const cockpit = M(sph(0.55, 14, 10), toon(0x7fe4ff, { emissive: 0x2a8fd0, emissiveIntensity: 0.6, rim: 0.6 }), T(0.03), 0, 0.5, -0.3, root);
    cockpit.scale.set(0.8, 0.65, 1.7);

    fin.rotation.set(0, 0, Math.PI / 2); // plate in XZ -> stand it up (x becomes height)
    // engines

    const mkWing = (side) => {

    root.userData = { wingL, wingR, engines, gunL, gunR, cockpit, body };
    return root;
  }

  // ---------- ENEMIES ----------
  function fighter() {
    const root = new THREE.Group();
    const ol = T(0.05);
    const body = M(sph(0.9, 12, 8), toon(0xe0542a, { rim: 0.5 }), ol, 0, 0, 0, root);
    body.scale.set(1, 0.7, 1.6);

    const eye = M(sph(0.22, 8, 6), glow(0xffe04a, 3), NOL, 0, 0.2, -1.5, root);
    eye.scale.set(1.6, 0.6, 0.6);
    const muzzles = [];

  // ---------- BOSS 1: STRIDER ----------
  function strider() {

    const cannons = [];
    for (const s of [-1, 1]) {
      const c = M(cyl(0.6, 0.8, 5, 10), dark, T(0.12), s * 5.5, -3, -5, torso);

      arm.userData.pod = pod;
      return arm;

    const armL = mkArm(-1), armR = mkArm(1);
    // legs (digitigrade)

      const hip = node(hips, s * 4.5, -1, 0);

  // ---------- SCENERY ----------
  const BUILDING_COLS = [0xd8d2c4, 0xc4cfd8, 0xe0c8a8, 0xa8b8c8, 0xd8b8b0, 0xb8c8a8];
  function building(w = 12, h = 40, d = 12, rng = Math.random) {
    const root = new THREE.Group();

    M(new THREE.BoxGeometry(w, h, d), mainM, T(t), 0, h / 2, 0, root);

    const glass = toon(0x3a5f8a, { emissive: 0x6ab8ff, emissiveIntensity: 0.25, rim: 0.6 });

    for (let i = 0; i < bands; i++) {
      const y = 4 + i * ((h - 6) / bands);
      M(new THREE.BoxGeometry(w + 0.1, 1.4, d + 0.1), glass, NOL, 0, y, 0, root).receiveShadow = true;
    }
    if (style === 0) {
      // stepped top

      dm.scale.y = 0.6;

    return root;

  function rockGeo(r, rng, detail = 1, amt = 0.3) {
    const g = new THREE.IcosahedronGeometry(r, detail);
    const pos = g.attributes.position;
    const seed = rng() * 100;
    const cache = new Map();
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const k = `${x.toFixed(3)},${y.toFixed(3)},${z.toFixed(3)}`;
      let s = cache.get(k);
      if (s === undefined) {
        s = 1 + amt * (Noise.n2(x / r * 1.7 + seed, z / r * 1.7 + y / r) + (rng() - 0.5) * 0.6);
        cache.set(k, s);
      }
      pos.setXYZ(i, x * s, y * s, z * s);
    }
    g.computeVertexNormals();
    return g;
  }

  function rock(size = 4, rng = Math.random) {
    const root = new THREE.Group();
    const m = M(rockGeo(size, rng, 0, 0.35), toon(rng() < 0.5 ? 0x8a7a6a : 0x9a8a72, { flat: true, rim: 0.3 }), T(size * 0.03), 0, size * 0.4, 0, root);
    m.scale.y = 0.7;
    return root;
  }

  function asteroid(radius = 10, rng = Math.random) {
    const root = new THREE.Group();
    const cols = [0x7a6e66, 0x8a7a6a, 0x6a6470, 0x907a62];
    M(rockGeo(radius, rng, 1, 0.38), toon(cols[Math.floor(rng() * cols.length)], { flat: true, rim: 0.4 }), T(radius * 0.025), 0, 0, 0, root);
    // a few craters / crystal outcrops
    const n = 2 + Math.floor(rng() * 3);
    for (let i = 0; i < n; i++) {
      const v = V3(rng() - 0.5, rng() - 0.5, rng() - 0.5).normalize();
      const c = M(oct(radius * 0.18), toon(0x6ad8ff, { emissive: 0x2a8acc, emissiveIntensity: 0.8, flat: true }), T(radius * 0.01), 0, 0, 0, root);
      c.position.copy(v).multiplyScalar(radius * 1.05);
      c.quaternion.setFromUnitVectors(V3(0, 1, 0), v);
      c.scale.set(0.6, 1.8, 0.6);
    }
    return root;
  }

  function tower(rng = Math.random) {
    const root = new THREE.Group();
    const h = 30 + rng() * 15;
    const m = toon(0xd84a3a), w = toon(0xeeeeee);
    const segs = 5;
    for (let i = 0; i < segs; i++) {
      const r0 = 2.2 * (1 - i / segs) + 0.4, r1 = 2.2 * (1 - (i + 1) / segs) + 0.4;
      M(cyl(r1, r0, h / segs, 4), i % 2 ? w : m, T(0.1), 0, (i + 0.5) * (h / segs), 0, root);
    }
    M(tor(2.4, 0.25, 6, 16), toon(0x555a66), T(0.06), 0, h * 0.7, 0, root).rotation.x = Math.PI / 2;
    const light = M(sph(0.7, 10, 8), glow(0xff2a2a, 4), NOL, 0, h + 0.6, 0, root);
    const dish = M(geo('dish', () => new THREE.SphereGeometry(2, 12, 6, 0, TAU, 0, Math.PI / 2)), toon(0xdddddd, { side: THREE.DoubleSide }), T(0.06), 1.2, h * 0.82, 0, root);
    dish.rotation.z = -Math.PI / 2.6;
    root.userData = { light };
    return root;
  }

  function supplyCrate() {
    const root = new THREE.Group();
    M(box(3, 3, 3), toon(0x4a8ad8, { rim: 0.4 }), T(0.06), 0, 0, 0, root);
    for (const ax of ['x', 'y', 'z']) {
      const b = M(box(3.15, 0.5, 0.5), toon(0xf0d040), NOL, 0, 0, 0, root);
      if (ax === 'y') b.rotation.z = Math.PI / 2;
      if (ax === 'z') b.rotation.y = Math.PI / 2;
    }
    const s = M(box(1.2, 1.2, 0.1), glow(0xffffff, 2), NOL, 0, 0, -1.56, root);
    root.userData = { light: s };
    return root;
  }

  function ring(kind = 'silver') {
    const root = new THREE.Group();
    if (kind === 'checkpoint') {
      M(tor(16, 0.9, 10, 64), glow(0x59d6ff, 2.5), NOL, 0, 0, 0, root);
      M(tor(17.4, 0.5, 8, 64), toon(0x2f6bff), T(0.1), 0, 0, 0, root);
      const inner = M(new THREE.CircleGeometry(15.5, 48), glow(0x59d6ff, 0.6, { transparent: true, opacity: 0.12, side: THREE.DoubleSide }), NOL, 0, 0, 0, root);
      root.userData = { inner };
      return root;
    }
    const gold = kind === 'gold';
    const r = gold ? 3.2 : 2.6;
    const m = M(tor(r, 0.42, 10, 32), toon(gold ? 0xffc83a : 0xd8e0ea, { emissive: gold ? 0xff9a00 : 0x8aa0c0, emissiveIntensity: gold ? 0.9 : 0.5, rim: 0.6 }), T(0.05), 0, 0, 0, root);
    const shine = M(tor(r, 0.12, 6, 32), glow(gold ? 0xffe08a : 0xffffff, 2.5), NOL, 0, 0, 0.3, root);
    root.userData = { band: m, shine };
    return root;
  }

  function pickup(kind = 'laser') {
    const root = new THREE.Group();
    const col = { laser: 0x3ae05a, bomb: 0xff3a3a, wing: 0x3a8aff }[kind] || 0xffffff;
    const body = M(geo('capsule', () => new THREE.CapsuleGeometry(1, 1.6, 6, 12)), toon(col, { emissive: col, emissiveIntensity: 0.5, rim: 0.6 }), T(0.06), 0, 0, 0, root);
    body.rotation.z = Math.PI / 2;
    M(cyl(1.08, 1.08, 0.5, 14), toon(0xffffff), T(0.04), 0, 0, 0, root).rotation.z = Math.PI / 2;
    // icon
    const icon = grp(root, 0, 0, -1.05);
    const w = glow(0xffffff, 2.5);
    if (kind === 'laser') {
      M(box(0.18, 0.18, 1.4), w, NOL, -0.3, 0, 0, icon);
      M(box(0.18, 0.18, 1.4), w, NOL, 0.3, 0, 0, icon);
      icon.rotation.x = Math.PI / 2;
    } else if (kind === 'bomb') {
      M(sph(0.42, 10, 8), w, NOL, 0, -0.1, 0, icon);
      M(box(0.12, 0.4, 0.12), w, NOL, 0.25, 0.4, 0, icon).rotation.z = -0.6;
    } else {
      M(plate('pickWing', [[-0.7, 0.3], [0, -0.3], [0.7, 0.3], [0, 0.05]], 0.1), w, NOL, 0, 0, 0, icon);
      icon.rotation.x = Math.PI / 2;
    }
    const halo = M(tor(1.9, 0.1, 6, 32), glow(col, 2.5), NOL, 0, 0, 0, root);
    root.userData = { halo, icon, kind };
    return root;
  }

  function carrier() {
    const root = new THREE.Group();
    const ol = T(0.25);
    const white = toon(0xe8ecf2, { rim: 0.35 }), blue = toon(0x2f6bff), dark = toon(0x1b2233);
    const hull = M(lathe('carHull', [[0, -62], [8, -50], [14, -20], [15, 20], [12, 50], [0, 56]], 10), white, ol, 0, 0, 0, root);
    hull.scale.set(1.3, 0.6, 1);
    M(box(10, 3, 80), blue, T(0.15), 0, 9, 0, root);
    M(box(8, 10, 16), white, ol, 0, 14, 22, root);
    M(box(6, 1.2, 0.5), glow(0x59d6ff, 3), NOL, 0, 16, 13.8, root);
    for (const s of [-1, 1]) {
      M(plate('carWing' + s, [[0, -10], [34 * s, 20], [34 * s, 32], [0, 30]], 2), white, ol, s * 12, -1, 0, root);
      M(plate('carWingS' + s, [[6 * s, 0], [32 * s, 22], [32 * s, 26], [6 * s, 8]], 0.5), blue, NOL, s * 12, 0.4, 0, root);
      const e = M(cyl(4, 4, 1, 12), glow(0x59d6ff, 3.5), NOL, s * 8, 0, 56, root);
      e.rotation.x = Math.PI / 2;
      M(cyl(4.8, 4.8, 12, 12), dark, T(0.15), s * 8, 0, 50, root).rotation.x = Math.PI / 2;
    }
    // launch bay
    M(box(10, 4, 1), glow(0xffd08a, 1.8), NOL, 0, -2, -40, root);
    root.userData = { hull };
    return root;
  }

  function debrisChunk(color = 0x6a6458, size = 1) {
    const rng = Math.random;
    const g = rockGeo(size, rng, 0, 0.5);
    const m = mkMesh(g, toon(color, { flat: true }), { thickness: size * 0.06, receive: false });
    return m;
  }

    portrait, rockGeo,
  };
})();

// ===== 05_input.js — controller-first input (Gamepad API + keyboard mapped to the pad model) =====
const Input = (() => {
  const keys = new Set();
  const keyEdges = new Set();
  const ACTIONS = ['fire', 'rapid', 'bomb', 'boost', 'brake', 'rollL', 'rollR', 'flip', 'pause', 'camera', 'confirm', 'back', 'up', 'down', 'left', 'right', 'tabL', 'tabR'];
  const cur = {}, prev = {};
  ACTIONS.forEach((a) => { cur[a] = false; prev[a] = false; });
  const st = {
    steerX: 0, steerY: 0, boostAmt: 0, brakeAmt: 0,
    lastDevice: 'kb', padName: '', padConnected: false, anyActivity: false, lastActivity: performance.now(),
    mouseActivity: false,
  };
  let rollTapL = -1, rollTapR = -1;
  let rollEvent = 0; // -1 left roll, +1 right roll (double tap)
  let navRepeat = { dir: '', t: 0 };
  let navEvent = '';
  let activePad = null;

  const KB = {
    fire: ['Space'], rapid: ['KeyJ'], bomb: ['KeyB', 'KeyK'], boost: ['ShiftLeft', 'ShiftRight'], brake: ['KeyC', 'KeyL'],
    rollL: ['KeyQ'], rollR: ['KeyE'], flip: ['KeyF', 'KeyU'], pause: ['Escape', 'KeyP'], camera: ['KeyV'],
    confirm: ['Enter', 'Space', 'NumpadEnter'], back: ['Escape', 'Backspace'],
    up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'], left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
    tabL: ['PageUp', 'KeyZ'], tabR: ['PageDown', 'KeyX'],
  };
  // standard-mapping button indices (DualSense / DualShock / Xbox all report "standard")
  const PAD = { cross: 0, circle: 1, square: 2, triangle: 3, l1: 4, r1: 5, l2: 6, r2: 7, create: 8, options: 9, l3: 10, r3: 11, up: 12, down: 13, left: 14, right: 15, ps: 16 };

  let pendingActivity = false, pendingMouse = false;
  function activity(dev) {
    st.lastDevice = dev;
    pendingActivity = true;
    st.lastActivity = performance.now();
  }
  window.addEventListener('keydown', (e) => {
    if (e.repeat) { e.preventDefault(); return; }
    keys.add(e.code); keyEdges.add(e.code);
    activity('kb');
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Backspace'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys.delete(e.code); });
  window.addEventListener('blur', () => keys.clear());
  window.addEventListener('mousedown', () => { activity('kb'); pendingMouse = true; });
  window.addEventListener('mousemove', (e) => { if (Math.abs(e.movementX) + Math.abs(e.movementY) > 3) { st.lastActivity = performance.now(); pendingMouse = true; } });
  window.addEventListener('gamepadconnected', (e) => { st.padConnected = true; st.padName = e.gamepad.id; activity('pad'); Bus.emit('padchange', true); });
  window.addEventListener('gamepaddisconnected', () => {
    const any = [...(navigator.getGamepads ? navigator.getGamepads() : [])].some((g) => g && g.connected);
    st.padConnected = any; Bus.emit('padchange', any);
  });

  const kbDown = (a) => KB[a].some((k) => keys.has(k));
  const dz = (v, d = 0.18) => (Math.abs(v) < d ? 0 : (v - Math.sign(v) * d) / (1 - d));

  function poll(dt) {
    // activity flagged by DOM events since the last poll
    st.anyActivity = pendingActivity; pendingActivity = false;
    st.mouseActivity = pendingMouse; pendingMouse = false;
    Object.assign(prev, cur);
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let gp = null;
    for (const p of pads) if (p && p.connected) { gp = p; if (p.mapping === 'standard') break; }
    activePad = gp;
    let px = 0, py = 0, pb = {}, l2 = 0, r2 = 0;
    if (gp) {
      st.padConnected = true; st.padName = gp.id;
      const b = (i) => (gp.buttons[i] ? gp.buttons[i].pressed || gp.buttons[i].value > 0.5 : false);
      const bv = (i) => (gp.buttons[i] ? gp.buttons[i].value : 0);
      let ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      // radial deadzone
      const mag = Math.hypot(ax, ay);
      if (mag < 0.16) { ax = 0; ay = 0; } else { const k = Math.min(1, (mag - 0.16) / 0.84) / mag; ax *= k; ay *= k; }
      let dx = (b(PAD.right) ? 1 : 0) - (b(PAD.left) ? 1 : 0);
      let dy = (b(PAD.down) ? 1 : 0) - (b(PAD.up) ? 1 : 0);
      // Settings quick-fix for intermittently inverted pads: applies to all pad directional input.
      if (Settings.invertPadX) { ax = -ax; dx = -dx; }
      if (Settings.invertPadY) { ay = -ay; dy = -dy; }
      px = clamp(ax + dx, -1, 1); py = clamp(ay + dy, -1, 1);
      l2 = bv(PAD.l2); r2 = bv(PAD.r2);
      pb = {
        fire: b(PAD.cross) || b(PAD.r3), bomb: b(PAD.circle), boost: r2 > 0.25, brake: l2 > 0.25,
        rollL: b(PAD.l1), rollR: b(PAD.r1), flip: b(PAD.triangle), pause: b(PAD.options), camera: b(PAD.create),
        confirm: b(PAD.cross), back: b(PAD.circle),
        up: py < -0.5, down: py > 0.5, left: px < -0.5, right: px > 0.5,
        tabL: b(PAD.l1), tabR: b(PAD.r1), rapid: b(PAD.square),
      };
      const anyPad = gp.buttons.some((x) => x && x.pressed) || Math.abs(gp.axes[0] || 0) > 0.4 || Math.abs(gp.axes[1] || 0) > 0.4 || Math.abs(gp.axes[2] || 0) > 0.4 || Math.abs(gp.axes[3] || 0) > 0.4;
      if (anyPad) { activity('pad'); st.anyActivity = true; pendingActivity = false; }
    }
    for (const a of ACTIONS) cur[a] = !!pb[a] || kbDown(a);
    // steering: pad stick wins if moved, else keyboard
    const kx = (kbDown('right') ? 1 : 0) - (kbDown('left') ? 1 : 0);
    const ky = (kbDown('down') ? 1 : 0) - (kbDown('up') ? 1 : 0);
    st.steerX = Math.abs(px) > 0.01 ? px : kx;
    st.steerY = Math.abs(py) > 0.01 ? py : ky;
    if (kx && ky && !(Math.abs(px) > 0.01)) { st.steerX *= 0.7071; st.steerY *= 0.7071; }
    st.boostAmt = Math.max(r2, kbDown('boost') ? 1 : 0);
    st.brakeAmt = Math.max(l2, kbDown('brake') ? 1 : 0);

    // double-tap bank buttons → barrel roll
    const now = performance.now();
    rollEvent = 0;
    if (pressed('rollL')) { if (now - rollTapL < 320) { rollEvent = -1; rollTapL = -1; } else rollTapL = now; }
    if (pressed('rollR')) { if (now - rollTapR < 320) { rollEvent = 1; rollTapR = -1; } else rollTapR = now; }

    // menu navigation with auto-repeat
    navEvent = '';
    const dir = cur.up ? 'up' : cur.down ? 'down' : cur.left ? 'left' : cur.right ? 'right' : '';
    if (dir) {
      if (navRepeat.dir !== dir) { navRepeat = { dir, t: 0.38 }; navEvent = dir; }
      else { navRepeat.t -= dt; if (navRepeat.t <= 0) { navRepeat.t = 0.11; navEvent = dir; } }
    } else navRepeat.dir = '';
    keyEdges.clear();
  }
  const pressed = (a) => cur[a] && !prev[a];
  const released = (a) => !cur[a] && prev[a];
  const held = (a) => cur[a];

  function rumble(strong = 0.5, weak = 0.5, ms = 120) {
    if (!Settings.rumble || !activePad || !activePad.vibrationActuator) return;
    try { activePad.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: clamp(strong, 0, 1), weakMagnitude: clamp(weak, 0, 1) }); } catch (e) { /* unsupported */ }
  }
  function idleSeconds() { return (performance.now() - st.lastActivity) / 1000; }
  function resetIdle() { st.lastActivity = performance.now(); }

  return { st, poll, pressed, released, held, rumble, idleSeconds, resetIdle, get roll() { return rollEvent; }, get nav() { return navEvent; }, KB };
})();

// Button glyphs: PlayStation-style for pads, keycaps for keyboard. Follows last used device.
const Glyph = (() => {
  const PS = {
    fire: ['✕', 'ps-x'], confirm: ['✕', 'ps-x'], bomb: ['○', 'ps-o'], back: ['○', 'ps-o'], flip: ['△', 'ps-t'], rapid: ['□', 'ps-s'],
    rollL: ['L1', 'ps-sh'], rollR: ['R1', 'ps-sh'], roll: ['L1/R1', 'ps-sh'], boost: ['R2', 'ps-sh'], brake: ['L2', 'ps-sh'],
    pause: ['OPTIONS', 'ps-opt'], tabL: ['L1', 'ps-sh'], tabR: ['R1', 'ps-sh'], camera: ['CREATE', 'ps-opt'], steer: ['L', 'ps-stick'], nav: ['✥', 'ps-stick'], tabs: ['L1 R1', 'ps-sh'],
  };
  const KBN = {
    fire: 'Space', confirm: 'Enter', bomb: 'B', back: 'Esc', flip: 'F', rollL: 'Q', rollR: 'E', roll: 'Q/E', boost: 'Shift', brake: 'C',
    pause: 'Esc', tabL: 'Z', tabR: 'X', camera: 'V', steer: 'WASD', nav: '↑↓', tabs: 'Z X', rapid: 'J',
  };
  function html(action, dev = Input.st.lastDevice) {
    if (dev === 'pad') { const [t, c] = PS[action] || [action, 'ps-sh']; return `<span class="glyph ${c}">${t}</span>`; }
    return `<span class="glyph key">${KBN[action] || action}</span>`;
  }
  return { html };
})();

// ===== 06_physics.js — Rapier world: static level colliders, entity sensors, ray/shape queries, debris =====
const GRP = { STATIC: 1, PLAYER: 2, ENEMY: 4, DEBRIS: 8, PICKUP: 16, ALLY: 32 };
const groups = (member, filter) => (member << 16) | filter;

const Phys = {
  world: null, owner: new Map(), debris: [], ready: false,
  async init() {
    await RAPIER.init();
    this.ready = true;
    this.reset(-22);
  },
  reset(gravityY = -22) {
    if (this.world) this.world.free();
    this.world = new RAPIER.World({ x: 0, y: gravityY, z: 0 });
    this.owner.clear();
    for (const d of this.debris) d.mesh.removeFromParent();
    this.debris.length = 0;
  },
  // ---- static level geometry ----
  addStaticBox(pos, half, quat) {
    const d = RAPIER.ColliderDesc.cuboid(half.x, half.y, half.z).setTranslation(pos.x, pos.y, pos.z)
      .setCollisionGroups(groups(GRP.STATIC, GRP.PLAYER | GRP.DEBRIS | GRP.ENEMY));
    if (quat) d.setRotation({ x: quat.x, y: quat.y, z: quat.z, w: quat.w });
    return this.world.createCollider(d);
  },
  addStaticBall(pos, r) {
    const d = RAPIER.ColliderDesc.ball(r).setTranslation(pos.x, pos.y, pos.z)
      .setCollisionGroups(groups(GRP.STATIC, GRP.PLAYER | GRP.DEBRIS | GRP.ENEMY));
    return this.world.createCollider(d);
  },
  addStaticTrimesh(geometry, matrix) {
    const pos = geometry.getAttribute('position');
    const verts = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      _v1.fromBufferAttribute(pos, i);
      if (matrix) _v1.applyMatrix4(matrix);
      verts[i * 3] = _v1.x; verts[i * 3 + 1] = _v1.y; verts[i * 3 + 2] = _v1.z;
    }
    const idx = geometry.index ? new Uint32Array(geometry.index.array) : Uint32Array.from({ length: pos.count }, (_, i) => i);
    const d = RAPIER.ColliderDesc.trimesh(verts, idx).setCollisionGroups(groups(GRP.STATIC, GRP.PLAYER | GRP.DEBRIS | GRP.ENEMY));
    return this.world.createCollider(d);
  },
  // ---- entity sensors (kinematic, moved every frame) ----
  addSensor(entity, shape, group) {
    let d;
    if (shape.type === 'box') d = RAPIER.ColliderDesc.cuboid(shape.hx, shape.hy, shape.hz);
    else if (shape.type === 'capsule') d = RAPIER.ColliderDesc.capsule(shape.hh, shape.r);
    else d = RAPIER.ColliderDesc.ball(shape.r);
    d.setSensor(true).setCollisionGroups(groups(group, GRP.PLAYER | GRP.ALLY | GRP.ENEMY | GRP.STATIC))
      .setActiveCollisionTypes(RAPIER.ActiveCollisionTypes.DEFAULT | RAPIER.ActiveCollisionTypes.KINEMATIC_FIXED | RAPIER.ActiveCollisionTypes.FIXED_FIXED);
    const c = this.world.createCollider(d);
    this.owner.set(c.handle, entity);
    return c;
  },
  removeCollider(c) {
    if (!c || !this.world) return;
    this.owner.delete(c.handle);
    try { this.world.removeCollider(c, false); } catch (e) { /* already gone after reset */ }
  },
  syncCollider(c, pos, quat) {
    c.setTranslation({ x: pos.x, y: pos.y, z: pos.z });
    if (quat) c.setRotation({ x: quat.x, y: quat.y, z: quat.z, w: quat.w });
  },
  // ---- queries ----
  _ray: null,
  /** Segment cast from a to b against groups mask. Returns {collider, entity, point, toi} or null. */
  segment(a, b, mask, excludeCollider) {
    const dir = _v2.subVectors(b, a);
    const len = dir.length();
    if (len < 1e-4) return null;
    dir.multiplyScalar(1 / len);
    const ray = new RAPIER.Ray({ x: a.x, y: a.y, z: a.z }, { x: dir.x, y: dir.y, z: dir.z });
    const hit = this.world.castRay(ray, len, true, undefined, groups(0xffff, mask), excludeCollider);
    if (!hit) return null;
    const toi = hit.timeOfImpact ?? hit.toi;
    return { collider: hit.collider, entity: this.owner.get(hit.collider.handle) || null, toi, point: V3(a.x + dir.x * toi, a.y + dir.y * toi, a.z + dir.z * toi) };
  },
  /** All colliders overlapping a sphere. Results are gathered first and handled after the query
   *  returns: mutating the world (spawning debris, removing colliders) inside a Rapier callback is not allowed. */
  overlapSphere(pos, r, mask, cb) {
    const shape = new RAPIER.Ball(r);
    const hits = [];
    this.world.intersectionsWithShape({ x: pos.x, y: pos.y, z: pos.z }, { x: 0, y: 0, z: 0, w: 1 }, shape, (c) => { hits.push(c); return true; }, undefined, groups(0xffff, mask));
    for (const c of hits) cb(c, this.owner.get(c.handle) || null);
  },
  /** Ground height under xz (downward cast against static geometry). */
  groundY(x, z, from = 600) {
    const ray = new RAPIER.Ray({ x, y: from, z }, { x: 0, y: -1, z: 0 });
    const hit = this.world.castRay(ray, from + 400, true, undefined, groups(0xffff, GRP.STATIC));
    return hit ? from - (hit.timeOfImpact ?? hit.toi) : -999;
  },
  // ---- dynamic debris (real rigid bodies bouncing off the level) ----
  spawnDebris(pos, vel, color, count = 6, size = 1) {
    for (let i = 0; i < count; i++) {
      if (this.debris.length > 140) { const old = this.debris.shift(); this._killDebris(old); }
      const s = size * rand(0.5, 1.2);
      const mesh = Models.debrisChunk(color, s);
      mesh.position.copy(pos);
      R.scene.add(mesh);
      const body = this.world.createRigidBody(RAPIER.RigidBodyDesc.dynamic()
        .setTranslation(pos.x + rand(-1, 1), pos.y + rand(-1, 1), pos.z + rand(-1, 1))
        .setLinvel(vel.x + rand(-28, 28), vel.y + rand(-10, 34), vel.z + rand(-28, 28))
        .setAngvel({ x: rand(-12, 12), y: rand(-12, 12), z: rand(-12, 12) })
        .setLinearDamping(0.15).setCcdEnabled(true));
      this.world.createCollider(RAPIER.ColliderDesc.cuboid(s * 0.5, s * 0.4, s * 0.5).setRestitution(0.45).setFriction(0.8).setDensity(2)
        .setCollisionGroups(groups(GRP.DEBRIS, GRP.STATIC)), body);
      this.debris.push({ mesh, body, life: rand(2.5, 4.5), smoke: Math.random() < 0.5 });
    }
  },
  _killDebris(d) { d.mesh.removeFromParent(); try { this.world.removeRigidBody(d.body); } catch (e) { /* reset */ } },
  step(dt) {
    if (!this.world) return;
    this.world.timestep = Math.min(dt, 1 / 30);
    this.world.step();
    for (let i = this.debris.length - 1; i >= 0; i--) {
      const d = this.debris[i];
      d.life -= dt;
      const t = d.body.translation(), q = d.body.rotation();
      d.mesh.position.set(t.x, t.y, t.z);
      d.mesh.quaternion.set(q.x, q.y, q.z, q.w);
      if (d.smoke && Math.random() < dt * 14) FX.smokePuff(d.mesh.position, 1.2, 0.6);
      if (d.life < 0.6) d.mesh.scale.setScalar(Math.max(0.01, d.life / 0.6));
      if (d.life <= 0) { this._killDebris(d); this.debris.splice(i, 1); }
    }
  },
};

// ===== 07_fx.js — instanced particles, explosions, shockwaves, flashes, camera shake =====
class Particles {
  constructor(geo, mat, cap) {
    this.mesh = new THREE.InstancedMesh(geo, mat, cap);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    this.mesh.castShadow = false; this.mesh.receiveShadow = false;
    this.cap = cap;
    this.list = [];
    const white = new THREE.Color(1, 1, 1);
    for (let i = 0; i < cap; i++) this.mesh.setColorAt(i, white);
    this.mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
    this.mesh.count = 0;
    this._c = new THREE.Color();
    this._c1 = new THREE.Color();
    this._m = new THREE.Matrix4();
    this._q = new THREE.Quaternion();
    this._s = new THREE.Vector3();
    this._up = new THREE.Vector3(0, 0, 1);
  }
  spawn(o) {
    if (this.list.length >= this.cap) this.list.shift();
    const p = {
      pos: o.pos.clone(), vel: o.vel ? o.vel.clone() : V3(), life: o.life ?? 1, max: o.life ?? 1,
      s0: o.s0 ?? 1, s1: o.s1 ?? 0, c0: new THREE.Color(o.c0 ?? 0xffffff), c1: new THREE.Color(o.c1 ?? o.c0 ?? 0xffffff),
      drag: o.drag ?? 0, grav: o.grav ?? 0, stretch: o.stretch ?? 0, rot: o.rot ?? rand(0, TAU), spin: o.spin ?? 0, int: o.int ?? 1,
    };
    this.list.push(p);
    return p;
  }
  clear() { this.list.length = 0; this.mesh.count = 0; }
  update(dt) {
    let n = 0;
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.life -= dt;
      if (p.life <= 0) { L[i] = L[L.length - 1]; L.pop(); continue; }
    }
    for (let i = 0; i < L.length; i++) {
      const p = L[i];
      const k = 1 - p.life / p.max;
      p.vel.multiplyScalar(Math.exp(-p.drag * dt));
      p.vel.y += p.grav * dt;
      p.pos.addScaledVector(p.vel, dt);
      p.rot += p.spin * dt;
      const s = lerp(p.s0, p.s1, k);
      if (p.stretch > 0) {
        const sp = p.vel.length();
        if (sp > 0.01) this._q.setFromUnitVectors(this._up, _v3.copy(p.vel).multiplyScalar(1 / sp)); else this._q.identity();
        this._s.set(s, s, s + sp * p.stretch);
      } else {
        this._q.setFromAxisAngle(_v3.set(0.3, 1, 0.2).normalize(), p.rot);
        this._s.set(s, s, s);
      }
      this._m.compose(p.pos, this._q, this._s);
      this.mesh.setMatrixAt(n, this._m);
      this._c.copy(p.c0).lerp(p.c1, k).multiplyScalar(p.int);
      this.mesh.setColorAt(n, this._c);
      n++;
    }
    this.mesh.count = n;
    this.mesh.instanceMatrix.needsUpdate = true;
    if (this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate = true;
  }
}

const FX = {
  puffs: null, fire: null, sparks: null, rings: [], lights: [], shake: 0, shakeT: 0, root: null,
  init() {
    this.root = new THREE.Group();
    const puffMat = new THREE.MeshToonNodeMaterial({ color: 0xffffff, gradientMap: TOON_RAMP });
    this.puffs = new Particles(new THREE.IcosahedronGeometry(1, 1), puffMat, 1600);
    const fireMat = new THREE.MeshBasicNodeMaterial({ color: 0xffffff });
    fireMat.toneMapped = false;
    this.fire = new Particles(new THREE.IcosahedronGeometry(1, 1), fireMat, 1600);
    const sparkMat = new THREE.MeshBasicNodeMaterial({ color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    sparkMat.toneMapped = false;
    this.sparks = new Particles(new THREE.BoxGeometry(0.18, 0.18, 1), sparkMat, 1600);
    this.root.add(this.puffs.mesh, this.fire.mesh, this.sparks.mesh);
    for (let i = 0; i < 16; i++) {
      const r = new THREE.Mesh(new THREE.TorusGeometry(1, 0.08, 6, 48), glow(0xffd27a, 3, { additive: true }).clone());
      r.visible = false; r.userData.t = 0;
      this.root.add(r); this.rings.push(r);
    }
    for (let i = 0; i < 6; i++) {
      const l = new THREE.PointLight(0xffa040, 0, 120, 1.6);
      l.userData.t = 0; this.root.add(l); this.lights.push(l);
    }
  },
  attach() { R.scene.add(this.root); },
  clear() {
    this.puffs.clear(); this.fire.clear(); this.sparks.clear();
    this.rings.forEach((r) => (r.visible = false));
    this.lights.forEach((l) => (l.intensity = 0));
  },
  smokePuff(pos, size = 2, life = 1, color = 0x9a9aa2) {
    this.puffs.spawn({ pos, vel: V3(rand(-1, 1), rand(1, 3), rand(-1, 1)), life: life * rand(0.7, 1.2), s0: size * 0.6, s1: size * 1.6, c0: color, c1: 0x6a6a72, drag: 1.5 });
  },
  engineTrail(pos, vel, color = 0x59d6ff, size = 0.5) {
    this.fire.spawn({ pos, vel, life: 0.18, s0: size, s1: 0.05, c0: color, c1: color, int: 2.2, drag: 2 });
  },
  muzzle(pos, color = 0x7dff7a) {
    this.fire.spawn({ pos, life: 0.06, s0: 0.9, s1: 0.2, c0: 0xffffff, c1: color, int: 3 });
  },
  sparksAt(pos, n = 10, color = 0xffd27a, speed = 40) {
    for (let i = 0; i < n; i++) {
      const d = V3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize().multiplyScalar(speed * rand(0.4, 1));
      this.sparks.spawn({ pos, vel: d, life: rand(0.2, 0.5), s0: 1, s1: 0.3, c0: 0xffffff, c1: color, int: 3, drag: 3, stretch: 0.04 });
    }
  },
  shockwave(pos, radius = 20, color = 0xffd27a, dur = 0.6, axis) {
    const r = this.rings.find((x) => !x.visible) || this.rings[0];
    r.visible = true; r.position.copy(pos); r.userData = { t: 0, dur, radius };

class RailSeg {
  constructor(id, def) {
    this.id = id;
    this.def = def;
    this.closed = !!def.closed;
    this.curve = new THREE.CatmullRomCurve3(def.points.map((p) => V3(...p)), this.closed, 'centripetal');
    this.curve.arcLengthDivisions = 3000;
    this.length = this.curve.getLength();
    this.events = (def.events || []).slice().sort((a, b) => a.at - b.at);
    this.profile = def.profile || 'open';
    this.s0 = 0; // global start distance, assigned when chained
  }
}

const Rail = {
  segs: {}, chain: [], speed: 60, s: 0, fired: new Set(),
  build(defs, startId) {
    this.segs = {};
    for (const [id, d] of Object.entries(defs)) this.segs[id] = new RailSeg(id, d);
    this.chain = []; this.fired = new Set(); this.s = 0;
    this.push(startId);
  },
  push(id) {
    const seg = this.segs[id];
    const last = this.chain[this.chain.length - 1];
    seg.s0 = last ? last.s0 + last.length : 0;
    this.chain.push(seg);
    return seg;
  },
  segAt(s) {
    for (let i = this.chain.length - 1; i >= 0; i--) if (s >= this.chain[i].s0) return this.chain[i];
    return this.chain[0];
  },
  get seg() { return this.segAt(this.s); },
  /** Frame at global distance s: {pos, tan, right, up}. Extrapolates past the last known segment. */
  frame(s, out = { pos: V3(), tan: V3(), right: V3(), up: V3() }) {
    const seg = this.segAt(s);
    let local = s - seg.s0;
    let extra = 0;
    if (seg.closed) local = ((local % seg.length) + seg.length) % seg.length;
    else if (local > seg.length) { extra = local - seg.length; local = seg.length; }
    else if (local < 0) { extra = local; local = 0; }
    const u = clamp(local / seg.length, 0, 1);
    seg.curve.getPointAt(u, out.pos);
    seg.curve.getTangentAt(u, out.tan);
    if (extra) out.pos.addScaledVector(out.tan, extra);
    out.right.crossVectors(out.tan, _v3.set(0, 1, 0)).normalize();
    out.up.crossVectors(out.right, out.tan).normalize();
    return out;
  },
  /** World position from rail-local coords (x right, y up, s distance). */
  toWorld(s, x, y, out = V3()) {
    const f = this.frame(s, this._f || (this._f = { pos: V3(), tan: V3(), right: V3(), up: V3() }));
    return out.copy(f.pos).addScaledVector(f.right, x).addScaledVector(f.up, y);
  },
  /** Advance; resolves segment transitions (forks are decided by `chooser`). Returns list of new events. */
  advance(ds, chooser) {
    this.s += ds;
    const out = [];
    let seg = this.chain[this.chain.length - 1];
    while (!seg.closed && this.s >= seg.s0 + seg.length - 1e-6) {
      const nx = typeof seg.def.next === 'function' ? seg.def.next(chooser) : seg.def.next;
      if (!nx) break;
      const nseg = this.push(nx);
      out.push({ type: '_enterSeg', seg: nseg });
      seg = nseg;
    }
    for (const sg of this.chain) {
      for (let i = 0; i < sg.events.length; i++) {
        const e = sg.events[i];
        const key = sg.id + ':' + i;
        if (this.fired.has(key)) continue;
        if (this.s >= sg.s0 + e.at) { this.fired.add(key); out.push(e); }
      }
    }
    return out;
  },
  /** Jump to a checkpoint (segment id + local distance), rebuilding the chain from a recorded route. */
  restore(route, segId, local) {
    this.chain = []; this.fired = new Set();
    for (const id of route) { this.push(id); if (id === segId) break; }
    const seg = this.chain[this.chain.length - 1];
    this.s = seg.s0 + local;
    for (const sg of this.chain) sg.events.forEach((e, i) => { if (sg.s0 + e.at <= this.s) this.fired.add(sg.id + ':' + i); });
  },
};

  // ---------- terrain shaped around rail segments ----------

        const k = bkey(Math.floor(p.x / B), Math.floor(p.z / B));

      const bx = Math.floor(x / B), bz = Math.floor(z / B);

      return best ? { d: Math.sqrt(bd), s: best } : { d: 999, s: null };

      // floor below rail, half-width of flat corridor, wall rise
      open: { floor: 32, flat: 70, ramp: 260, peak: 150 },
      coast: { floor: 34, flat: 90, ramp: 300, peak: 120 },
      ocean: { floor: 60, flat: 400, ramp: 500, peak: 60, water: true },
      city: { floor: 30, flat: 330, ramp: 260, peak: 120 },
      canyon: { floor: 36, flat: 36, ramp: 34, peak: 190 },
      plains: { floor: 30, flat: 260, ramp: 360, peak: 110 },
      boss: { floor: 30, flat: 900, ramp: 300, peak: 160 },

      const { d, s } = nearest(x, z);
      const mount = 70 + Noise.fbm(x / 380, z / 380, 5) * 170 + Math.abs(Noise.n2(x / 140, z / 140)) * 50;
      if (!s) return mount;
      const P = PROF[s.prof] || PROF.open;
      let floorY = P.water ? -14 + Noise.fbm(x / 90, z / 90, 3) * 4 : Math.max(7, s.y - P.floor) + Math.abs(Noise.fbm(x / 90, z / 90, 3)) * 7;

    geo.translate((x0 + x1) / 2, 0, (z0 + z1) / 2);
    const pos = geo.getAttribute('position');
    const cols = new Float32Array(pos.count * 3);
    const hs = new Float32Array(pos.count);
    for (let i = 0; i < pos.count; i++) { const h = height(pos.getX(i), pos.getZ(i)); hs[i] = h; pos.setY(i, h); }
    geo.computeVertexNormals();
    const nrm = geo.getAttribute('normal');

    const c = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const h = hs[i], slope = 1 - nrm.getY(i);
      const n = Noise.n2(pos.getX(i) / 60, pos.getZ(i) / 60);
      if (h < 2) c.set(pal.under);
      else if (h < 7) c.set(pal.sand);
      else if (slope > 0.32) c.set(pal.rock);
      else if (h > 175 + n * 20) c.set(pal.snow);
      else c.set(n > 0.05 ? pal.grass : pal.grass2);

    const mat = new THREE.MeshToonNodeMaterial({ vertexColors: true, gradientMap: TOON_RAMP });
    mat.flatShading = true;
    const mesh = new THREE.Mesh(geo, mat);
    mesh.receiveShadow = true;
    mesh.castShadow = true;
    this.root.add(mesh);
    this.terrainMesh = mesh;
    this.terrainCollider = Phys.addStaticTrimesh(geo);
    this.heightAt = height;
    return { mesh, height, nearest };
  },
  heightAt: () => 0,
  // ---------- placement helpers ----------
  place(obj, x, y, z, rotY = 0, scale = 1) {

};

// ===== 10_enemies.js — enemy archetypes, rail flight patterns, all-range AI, bosses, pickups =====
const HIT_MAT = glow(0xffffff, 2.6);

class Entity {
  constructor(mesh, o = {}) {

  damage(n, src, point) {

  die(src) {

// ---------------------------------------------------------------- rail-space flight patterns
// Each returns {dz, x, y} relative to the rail at time t (s); `done` when finished.
const PATTERNS = {
  swoop: (p) => (t) => {
    const k = clamp(t / p.T, 0, 1), e = smooth(k);
    return { dz: lerp(p.dz0 ?? 330, p.dz1 ?? -70, k), x: lerp(p.x0, p.x1, e) + Math.sin(k * Math.PI) * (p.arcX || 0), y: lerp(p.y0, p.y1, e) + Math.sin(k * Math.PI) * (p.arcY || 0), done: k >= 1 };
  },
  cross: (p) => (t) => {
    const k = clamp(t / p.T, 0, 1);
    return { dz: (p.dz ?? 130) + Math.sin(k * Math.PI) * 30, x: lerp(p.x0, p.x1, k), y: p.y0 + Math.sin(k * TAU) * (p.arcY ?? 8), done: k >= 1 };
  },
  chase: (p) => (t) => {
    // comes from behind the player, overtakes, harasses, leaves
    const a = 2.2, h = p.hold ?? 4;
    if (t < a) { const k = smooth(t / a); return { dz: lerp(-45, p.dz ?? 95, k), x: lerp(p.x0, p.x1, k), y: lerp(p.y0 - 6, p.y1, k) }; }
    if (t < a + h) { const u = t - a; return { dz: (p.dz ?? 95) + Math.sin(u * 1.3) * 12, x: p.x1 + Math.sin(u * 1.7 + p.ph) * 14, y: p.y1 + Math.cos(u * 1.2 + p.ph) * 6, fire: true }; }
    const u = (t - a - h) / 2;
    return { dz: (p.dz ?? 95) + u * 260, x: p.x1 + u * 30 * Math.sign(p.x1 || 1), y: p.y1 + u * 90, done: u >= 1 };
  },
  hover: (p) => (t) => {
    const a = 1.8, h = p.hold ?? 6;
    if (t < a) { const k = smooth(t / a); return { dz: lerp(340, p.dz ?? 110, k), x: p.x0, y: p.y0 }; }
    if (t < a + h) { const u = t - a; return { dz: (p.dz ?? 110) + Math.sin(u * 0.9) * 10, x: p.x0 + Math.sin(u * 1.1 + p.ph) * 18, y: p.y0 + Math.sin(u * 1.6 + p.ph) * 7, fire: true }; }
    const u = (t - a - h) / 1.6;
    return { dz: (p.dz ?? 110) - u * 40, x: p.x0 + u * 140 * (p.x0 >= 0 ? 1 : -1), y: p.y0 + u * 40, done: u >= 1 };
  },
  dive: (p) => (t) => {
    const k = clamp(t / p.T, 0, 1);
    return { dz: lerp(260, -60, k), x: lerp(p.x0, p.x1, k), y: lerp(90, p.y1 ?? -4, smooth(Math.min(1, k * 1.6))), done: k >= 1 };
  },
  corkscrew: (p) => (t) => {
    const k = clamp(t / p.T, 0, 1);
    const a = k * TAU * 1.5 + p.ph;
    return { dz: lerp(340, -60, k), x: (p.x0 || 0) + Math.cos(a) * 24, y: (p.y0 || 0) + Math.sin(a) * 14, done: k >= 1 };
  },
};

class RailFlyer extends Entity {
  constructor(kind, pattern, params, o = {}) {
    const mesh = kind === 'gunship' ? Models.gunship() : kind === 'dart' ? Models.dart() : Models.fighter();
    const base = { fighter: { hp: 2, hits: 1, radius: 3.2 }, gunship: { hp: 14, hits: 3, radius: 6.5, expSize: 2 }, dart: { hp: 1, hits: 1, radius: 2.4 } }[kind];
    super(mesh, { ...base, ...o, color: kind === 'gunship' ? 0x5a4a6a : 0xb8441e });
    this.kind = kind;
    this.path = PATTERNS[pattern]({ ph: rand(0, TAU), ...params });
    this.s0 = Rail.s; this.fireCD = rand(1.2, 2.6) / G.diffFire();
    this.canFire = o.fire ?? (kind !== 'dart');
    this.escape = false;
    this.update(0);
  }
  update(dt) {
    if (this.escape) {
      // chaser that got away after a wingman-in-trouble event
      this.pos.addScaledVector(_v1.set(0, 1, 0).add(this.vel.clone().normalize()), 220 * dt);
      this.escT = (this.escT || 0) + dt;

      return;
    }
    const t = this.age;
    const r = this.path(t);
    this.prev.copy(this.pos);
    Rail.toWorld(Rail.s + r.dz, r.x, r.y, this.pos);
    if (dt > 0) this.vel.subVectors(this.pos, this.prev).multiplyScalar(1 / dt);
    if (r.fire || this.kind === 'gunship') { const P = G.player; if (P) this.facePoint(P.pos, dt, 5); }
    else this.faceVelocity(dt, 8, 0.002);
    // fire when ahead of the player
    this.fireCD -= dt;
    if (this.canFire && this.fireCD <= 0 && r.dz > 35 && r.dz < 300) {
      this.fireCD = (this.kind === 'gunship' ? rand(1.0, 1.6) : rand(1.6, 3.2)) / G.diffFire();
      const m = this.mesh.userData.muzzles;
      const from = m && m.length ? m[0].getWorldPosition(V3()) : this.pos.clone();
      if (this.kind === 'gunship') { for (let i = 0; i < 3; i++) this.shoot(from, 140, 0.05 * i, { silent: i > 0 }); }

  }
}
