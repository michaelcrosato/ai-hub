      u.eye.scale.setScalar(1 + Math.sin(G.time * 40) * 0.3 + 0.6);
      if (this.beamCharge <= 0) {
        this.beamT = 1.5;
        if (!this.beam) { this.beam = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 1, 10, 1, true), glow(0xff3a2a, 4, { additive: true })); this.beam.geometry.rotateX(Math.PI / 2); this.beam.geometry.translate(0, 0, -0.5); R.scene.add(this.beam); }
        this.beam.visible = true; AudioSys.play('chargeShot', { pitch: 0.5 });
      }
      return;
    }
    u.eye.scale.setScalar(1);
    if (this.beamT > 0 && this.beam) {
      this.beamT -= dt;
      const eye = u.eye.getWorldPosition(V3());
      const P = G.player;
      const k = 1 - this.beamT / 1.5;
      const f = Rail.frame(Rail.s);
      const sweepX = lerp(-60, 60, this.beamDir > 0 ? k : 1 - k);
      const tgt = f.pos.clone().addScaledVector(f.right, sweepX); tgt.y = this.beamY;
      const dir = tgt.sub(eye);
      const len = dir.length() + 120;
      dir.normalize();
      this.beam.position.copy(eye);
      this.beam.quaternion.setFromUnitVectors(V3(0, 0, -1), dir);
      this.beam.scale.set(1 + Math.random() * 0.3, 1 + Math.random() * 0.3, len);
      if (Math.random() < 0.5) FX.sparksAt(eye.clone().addScaledVector(dir, len - 120), 3, 0xff6a3a);
      if (P && P.alive) {
        const rel = _v1.subVectors(P.pos, eye);
        const proj = rel.dot(dir);
        const dist = rel.addScaledVector(dir, -proj).length();
        if (proj > 0 && dist < 3.6) P.takeHit(10, eye);
      }
      if (this.beamT <= 0) this.beam.visible = false;
    }
  }
  stomp() {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.6, 6, 48), glow(0xffa040, 3, { additive: true }));
    ring.rotation.x = Math.PI / 2;
    ring.position.copy(this.pos).add(V3(0, 2, 0));
    R.scene.add(ring);
    this.stompRings.push({ mesh: ring, r: 4, hit: false });
    FX.addShake(1.4, 0.3);
    AudioSys.play('explosion', { pitch: 0.6 });
    Game.hint('stomp', 'Shockwaves roll along the ground — stay high to avoid them!');
  }
  updateStomps(dt) {
    const P = G.player;
    for (let i = this.stompRings.length - 1; i >= 0; i--) {
      const s = this.stompRings[i];
      s.r += 120 * dt;
      s.mesh.scale.set(s.r, s.r, 1 + s.r * 0.02);
      s.mesh.material.opacity = 1 - s.r / 260;
      if (P && P.alive && !s.hit) {
        const dxz = Math.hypot(P.pos.x - s.mesh.position.x, P.pos.z - s.mesh.position.z);
        if (Math.abs(dxz - s.r) < 5 && P.pos.y - s.mesh.position.y < 14) { s.hit = true; P.takeHit(12, s.mesh.position); }
      }
      if (s.r > 260) { s.mesh.removeFromParent(); this.stompRings.splice(i, 1); }
    }
  }
  dispose() {
    this.mesh.removeFromParent();
    for (const p of Object.values(this.parts)) { p.alive = false; if (p.collider) Phys.removeCollider(p.collider); }
    this.body.dispose();
    if (this.beam) this.beam.removeFromParent();
    this.stompRings.forEach((s) => s.mesh.removeFromParent());
  }
}

// ---------------------------------------------------------------- BOSS 2: Dreadnought "Toadstool" (all-range)
class MothershipBoss {
  constructor() {
    this.name = 'DREADNOUGHT GULLET'; this.alive = true; this.hostile = true; this.lockable = false; this.radius = 60;
    this.mesh = Models.mothership();
    R.scene.add(this.mesh);
    this.pos = V3(0, 40, -200); this.vel = V3(); this.age = 0; this.phase = 0; this.atkT = 4; this.launchT = 6; this.yaw = 0;
    this.mesh.position.copy(this.pos);
    const u = this.mesh.userData;
    this.parts = {};
    u.turrets.forEach((t, i) => (this.parts['turret' + i] = new BossPart(this, t, { hp: 10, radius: 4.5, name: 'TURRET', hits: 3, color: 0x4a3a5e, expSize: 1.6 })));
    u.shieldGens.forEach((g, i) => (this.parts['gen' + i] = new BossPart(this, g, { hp: 18, radius: 5, name: 'SHIELD GEN', hits: 4, color: 0x5affd8, expSize: 2 })));
    this.parts.core = new BossPart(this, u.core, { hp: 90, radius: 8, name: 'REACTOR', hits: 30, locked: () => this.phase < 1, color: 0xff3aa0, expSize: 4 });
    this.maxHp = Object.values(this.parts).reduce((a, p) => a + p.maxHp, 0);
    // shield bubble around the reactor
    this.shield = new THREE.Mesh(new THREE.SphereGeometry(12, 24, 16), glow(0x5affd8, 1.6, { additive: true, opacity: 0.35 }));
    u.core.add(this.shield);
    // solid hull (moving static colliders) so the player bounces off
    this.hull = [
      { off: V3(0, 0, -10), half: V3(28, 10, 70) }, { off: V3(-36, -2, 10), half: V3(8, 8, 36) }, { off: V3(36, -2, 10), half: V3(8, 8, 36) }, { off: V3(0, 16, 20), half: V3(8, 6, 12) },
    ].map((h) => ({ ...h, c: Phys.addStaticBox(h.off, h.half) }));
    this.beam = null; this.beamCharge = 0; this.beamT = 0;
    this.update(0);
  }
  worldPos() { return this.pos; }
  hpFrac() { return Object.values(this.parts).reduce((a, p) => a + Math.max(0, p.alive ? p.hp : 0), 0) / this.maxHp; }
  onPartDestroyed(part) {
    part.node.visible = false;
    Phys.spawnDebris(part.worldPos(), V3(0, 0, 0), 0x4a3a5e, 6, 2.5);
    if (part.name === 'SHIELD GEN') {
      const left = Object.keys(this.parts).filter((k) => k.startsWith('gen') && this.parts[k].alive).length;
      if (left === 0) { this.phase = 1; this.shield.visible = false; Game.radio('tobi', 'Shield\'s down! The reactor\'s under the stern — hit it with everything!', 2); Game.radio('croak', 'NO! Turn the ship! Fire the prow cannon!', 2); AudioSys.play('bossAlarm'); }
      else Game.radio('tobi', `Shield generator down! ${left} to go!`, 1);
    } else if (part.name === 'REACTOR') this.defeat();
  }
  defeat() { this.alive = false; this.deathT = 0; Game.onBossDefeated(this); }
  update(dt) {
    this.age += dt;
    const u = this.mesh.userData;
    if (!this.alive) {
      this.deathT += dt;
      if (Math.random() < dt * 16) FX.explode(this.pos.clone().add(V3(rand(-40, 40), rand(-15, 20), rand(-80, 80)).applyQuaternion(this.mesh.quaternion)), rand(2, 4), { debris: Math.random() < 0.3, color: 0x4a3a5e });
      this.mesh.rotation.z += dt * 0.15; this.pos.y -= dt * 4; this.mesh.position.copy(this.pos);
      if (this.deathT > 4 && !this.gone) { this.gone = true; for (let i = 0; i < 3; i++) FX.bombBlast(this.pos.clone().add(V3(0, 0, (i - 1) * 50))); FX.explode(this.pos, 10); AudioSys.play('explosionBig'); this.mesh.visible = false; this.hull.forEach((h) => Phys.removeCollider(h.c)); }
      return;
    }
    // slow patrol orbit; in phase 1 it turns to bring the prow cannon onto the player
    const P = G.player;
    if (this.phase === 0) {
      this.pos.set(Math.sin(this.age * 0.05) * 160, 40 + Math.sin(this.age * 0.2) * 10, -200 + Math.cos(this.age * 0.05) * 160);
      this.yaw = damp(this.yaw, -this.age * 0.05 + Math.PI / 2, 0.5, dt);
    } else if (P) {
      const to = _v1.subVectors(P.pos, this.pos);
      this.yaw = damp(this.yaw, Math.atan2(-to.x, -to.z), this.beamT > 0 ? 0.22 : 0.4, dt);
    }
    this.mesh.position.copy(this.pos);
    this.mesh.rotation.set(0, this.yaw, Math.sin(this.age * 0.3) * 0.03);
    this.mesh.updateMatrixWorld(true);
    for (const h of this.hull) Phys.syncCollider(h.c, h.off.clone().applyQuaternion(this.mesh.quaternion).add(this.pos), this.mesh.quaternion);
    for (const e of u.engines) e.scale.setScalar(0.9 + Math.random() * 0.2);
    for (const p of Object.values(this.parts)) if (p.alive) p.update(dt);
    if (this.shield.visible) this.shield.scale.setScalar(1 + Math.sin(this.age * 4) * 0.04);
    // turrets track the player
    u.turrets.forEach((t, i) => { if (this.parts['turret' + i].alive && P) { const lp = this.mesh.worldToLocal(P.pos.clone()).sub(t.position); t.rotation.y = Math.atan2(-lp.x, -lp.z) * (t.rotation.z ? -1 : 1); } });
    if (!G.cinematic) this.attacks(dt);
    this.updateBeam(dt);
  }
  attacks(dt) {
    const P = G.player; if (!P || !P.alive) return;
    const u = this.mesh.userData;
    // turret fire
    u.turrets.forEach((t, i) => {
      const part = this.parts['turret' + i];
      if (!part.alive) return;
      part.cd = (part.cd ?? rand(1, 3)) - dt * G.diffFire();
      const from = t.userData.muzzle.getWorldPosition(V3());
      if (part.cd <= 0 && from.distanceTo(P.pos) < 520) { part.cd = rand(2.4, 3.8); part.shoot(from, 165, 0.035, { color: 0xff3a8a }); }
    });
    // hangar launches
    this.launchT -= dt;
    const drones = G.ents.filter((e) => e.alive && e instanceof Drone).length;
    if (this.launchT <= 0 && drones < 6) {
      this.launchT = 11;
      for (let i = 0; i < 2; i++) setTimeoutGame(() => { if (this.alive) new Drone(u.hangar.getWorldPosition(V3()).add(V3(rand(-5, 5), -6, 0))); }, i * 0.6);
      Game.radioOnce('hangar', 'marlow', 'It\'s launching fighters from the forward hangar!');
    }
    this.atkT -= dt * G.diffFire();
    if (this.atkT > 0) return;
    if (this.phase === 1) {
      if (Math.random() < 0.55) { this.beamCharge = 2.2; AudioSys.play('alarm'); Game.toast('PROW CANNON CHARGING — GET OUT OF ITS SIGHTS!', 2); this.atkT = 7; }
      else { for (let i = 0; i < 4; i++) new Missile(this.pos.clone().add(V3(rand(-15, 15), 20, rand(-20, 20))), V3(rand(-1, 1), 1, rand(-1, 1)), { speed: 90, turn: 1.4, life: 7 }); this.atkT = 4.5; }
    } else {
      for (let i = 0; i < 2; i++) new Missile(this.pos.clone().add(V3(rand(-15, 15), 20, rand(-20, 20))), V3(rand(-1, 1), 1, rand(-1, 1)), { speed: 85, turn: 1.2 });
      this.atkT = 6;
    }
  }
  updateBeam(dt) {
    const P = G.player;
    const prow = V3(0, -2, -88).applyQuaternion(this.mesh.quaternion).add(this.pos);
    const dir = V3(0, 0, -1).applyQuaternion(this.mesh.quaternion);
    if (this.beamCharge > 0) {
      this.beamCharge -= dt;
      FX.fire.spawn({ pos: prow.clone().add(V3(rand(-6, 6), rand(-6, 6), rand(-6, 6))), vel: V3(rand(-4, 4), rand(-4, 4), rand(-4, 4)), life: 0.25, s0: 2.5, s1: 0.2, c0: 0xffffff, c1: 0xff3aa0, int: 3 });
      if (this.beamCharge <= 0) {
        this.beamT = 2.6;
        if (!this.beam) { this.beam = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 1, 14, 1, true), glow(0xff5ab8, 4, { additive: true })); this.beam.geometry.rotateX(Math.PI / 2); this.beam.geometry.translate(0, 0, -0.5); R.scene.add(this.beam); }
        this.beam.visible = true; AudioSys.play('chargeShot', { pitch: 0.35 }); FX.addShake(1.5, 2.5);
      }
    }
    if (this.beamT > 0 && this.beam) {
      this.beamT -= dt;
      this.beam.position.copy(prow);
      this.beam.quaternion.setFromUnitVectors(V3(0, 0, -1), dir);
      this.beam.scale.set(1 + Math.random() * 0.2, 1 + Math.random() * 0.2, 1400);
      if (P && P.alive) {
        const rel = _v1.subVectors(P.pos, prow);
        const proj = rel.dot(dir);
        if (proj > 0 && rel.addScaledVector(dir, -proj).length() < 8) P.takeHit(14, prow);
      }
      for (const w of G.wingmen) if (w.active) { const rel = _v1.subVectors(w.pos, prow); const proj = rel.dot(dir); if (proj > 0 && rel.addScaledVector(dir, -proj).length() < 8) w.damage(dt * 30); }
      if (this.beamT <= 0) this.beam.visible = false;
    }
  }
  dispose() {
    this.mesh.removeFromParent();
    for (const p of Object.values(this.parts)) { p.alive = false; if (p.collider) Phys.removeCollider(p.collider); }
    if (!this.gone) this.hull.forEach((h) => Phys.removeCollider(h.c));
    if (this.beam) this.beam.removeFromParent();
  }
}

// game-time timers (pause-safe)
const GameTimers = [];
function setTimeoutGame(fn, sec) { GameTimers.push({ fn, t: sec }); }
function updateGameTimers(dt) {
  for (let i = GameTimers.length - 1; i >= 0; i--) { const t = GameTimers[i]; t.t -= dt; if (t.t <= 0) { GameTimers.splice(i, 1); t.fn(); } }
}

      G.state = 'gameover';
      UI.hud(false);
      AudioSys.music('gameover');
      UI.open('gameover');
    }
  },
  onBossDefeated(boss) {
    UI.bossBar(null);
    AudioSys.play('explosionBig');
    FX.addShake(3, 1.2);
    Input.rumble(1, 1, 900);
    this.clearT = 5.5;
    this.radio('tobi', 'It\'s going down! Great work, team!', 3);
    for (const e of G.ents) if (e.alive && e.hostile && !e.isBossPart) e.die('none');
  },
  missionClear() {
    G.cinematic = true;
    this.clearSeq = { t: 0, from: G.player.pos.clone(), camFrom: R.camera.position.clone() };
    AudioSys.stinger('missionClear');
    AudioSys.music('results');
    UI.banner('MISSION ACCOMPLISHED', 3.5);
    this.radio('vix', G.stage.next ? 'Corvanis is clear. All wings, regroup — next stop, the armada!' : 'The flagship is down. Croak\'s armada is finished!', 3);
  },
  finishStage() {
    G.cinematic = false;
    G.state = 'results';
    G.totalHits += G.hits;
    const st = G.stage;
    const medal = G.hits >= st.medalHits && G.wingmen.every((w) => w.active);
    const rec = Save.data.medals[st.id] || { best: 0, medal: false };
    rec.best = Math.max(rec.best, G.hits); rec.medal = rec.medal || medal;
    Save.data.medals[st.id] = rec;
    Save.data.high = Math.max(Save.data.high, G.totalHits);
    if (st.next) Save.data.unlocked = Math.max(Save.data.unlocked, STAGES[st.next].number);
    Save.store();
    UI.hud(false);
    if (G.attract) { Attract.next(); return; }
    UI.results({ stage: st, hits: G.hits, total: G.totalHits, medal, best: rec.best, stats: this.stats, wingmen: G.wingmen.map((w) => ({ id: w.id, active: w.active, hp: w.hp })) });
  },
  quitToTitle() {
    G.state = 'title'; G.attract = false; G.cinematic = false;
    UI.hud(false);
    if (G.player && G.player.chargeSnd) G.player.chargeSnd.stop();
    Title.enter();
  },

  // ------------------------------------------------------------ event interpreter (data-driven)
  runEvent(e) {
    const P = G.player;
    switch (e.type) {
      case '_enterSeg':
        G.routeTaken.push(e.seg.id);
        if (e.seg.def.route) this.stat('route' + e.seg.def.route);
        if (e.seg.closed) Rail.speed = 46;
        break;
      case 'radio': this.radio(e.who, e.text, e.prio ?? 1); break;
      case 'hint': this.hint(e.id, e.text); break;
      case 'toast': this.toast(e.text, e.dur || 2.5); break;
      case 'music': AudioSys.music(e.track); break;
      case 'speed': Rail.speed = e.value; break;
      case 'wave': {
        const offs = e.offsets || [[0, 0]];
        for (let i = 0; i < e.count; i++) {
          const o = offs[i % offs.length];
          const p = { ...e.params };
          for (const k of ['x0', 'x1']) if (p[k] !== undefined) p[k] += o[0];
          for (const k of ['y0', 'y1']) if (p[k] !== undefined) p[k] += o[1];
          if (p.x0 !== undefined && p.x1 === undefined) p.x1 = p.x0;
          if (p.y0 !== undefined && p.y1 === undefined) p.y1 = p.y0;
          setTimeoutGame(() => { if (G.state === 'play') new RailFlyer(e.kind, e.pattern, p, { drop: i === e.count - 1 ? e.drop : null }); }, i * (e.delay || 0));
        }
        break;
      }
      case 'darts':
        for (let i = 0; i < e.count; i++) setTimeoutGame(() => new Dart(rand(-22, 22), rand(-12, 14)), i * 0.4);
        break;
      case 'turrets':
        e.xs.forEach((x, i) => {
          const s = Rail.s + e.ahead + i * 45;
          const p = Rail.toWorld(s, x, 0);
          const gy = World.heightAt(p.x, p.z);
          if (gy > -900) { p.y = gy; new Turret(p); }
        });
        break;
      case 'roofTurrets': {
        const seg = Rail.segs.city;
        (seg.roofSlots || []).filter((r, i) => r.s >= e.from && r.s <= e.to && i % 2 === 0).forEach((r) => new Turret(r.pos));
        break;
      }
      case 'tanks':
        for (let i = 0; i < e.count; i++) {
          const f = Rail.frame(Rail.s + e.ahead + i * 30);
          const p = f.pos.clone().addScaledVector(f.right, e.side * (30 + i * 6));
          p.y = World.heightAt(p.x, p.z);
          new Tank(p, f.right.clone().multiplyScalar(-e.side));
        }
        break;
      case 'mines':
        for (let i = 0; i < e.count; i++) new Mine(Rail.toWorld(Rail.s + e.ahead + i * 40, rand(-20, 20), rand(-12, 14)));
        break;
      case 'ring': this.placeRing(e.kind, Rail.s + e.ahead, e.x || 0, e.y || 0); break;
      case 'rings': for (let i = 0; i < e.n; i++) this.placeRing(e.kind, Rail.s + e.ahead + i * (e.spacing || 0), e.x || 0, e.y || 0); break;
      case 'crate': new Crate(Rail.toWorld(Rail.s + e.ahead, e.x || 0, e.y || 0), e.drop); break;
      case 'checkpoint': {
        const seg = Rail.seg;
        const r = this.placeRing('checkpoint', Rail.s + e.ahead, 0, 0);
        r.cp = { segId: seg.id, local: Rail.s + e.ahead - seg.s0 };
        break;
      }
      case 'trouble': {
        const w = G.wingmen.find((x) => x.id === e.who && x.active);
        if (!w) break;
        const chaser = new Chaser(w);
        w.startTrouble(chaser, 9);
        this.radio(w.id, { marlow: 'I\'ve got one on my tail and I can\'t shake him!', kestrel: 'Vix! Get this creep off me — NOW!', tobi: 'Help! Vix, somebody\'s shooting at me!' }[w.id], 3);
        this.hint('trouble', 'A wingman is in trouble — shoot the enemy chasing them!');
        break;
      }
      case 'boss':
        if (e.boss === 'strider') {
          G.boss = new StriderBoss();
          UI.bossBar(G.boss);
          AudioSys.music('boss'); AudioSys.stinger('warning'); AudioSys.play('bossAlarm');
          UI.banner('WARNING', 2.2, 'warn');
          this.radio('tobi', 'Scanning... It\'s a Granite Strider! Its shoulder pods are the weak points!', 2);
          this.radio('marlow', 'Watch the missiles — shoot them down or out-boost them!', 1);
        } else {
          G.boss = new MothershipBoss();
          UI.bossBar(G.boss);
          FX.flash(G.boss.pos, 0xb05aff, 80000, 1.2); R.flashU.value = 0.8;
          AudioSys.stinger('warning'); AudioSys.play('bossAlarm');
          UI.banner('WARNING', 2.2, 'warn');
        }
        break;
      case 'fork': break;
      case 'spawnDrones':
        for (let i = 0; i < e.count; i++) {
          const d = V3(rand(-1, 1), rand(-0.4, 0.4), rand(-1, 1)).normalize().multiplyScalar(rand(400, 700));
          new Drone(P.pos.clone().add(d));
        }
        break;
      case 'spawnAces': {
        const defs = [
          { name: 'JACKAL', hp: 24, hits: 8, skill: 1.3, speed: 90, palette: { body: 0x2a2a30, accent: 0xffc040 }, death: ['jackal', 'Impossible! This isn\'t over, Stark!'] },
          { name: 'VESPER', hp: 18, hits: 6, skill: 1.1, speed: 86, palette: { body: 0x3a2a4a, accent: 0xc23bff }, death: ['jackal', 'Vesper\'s down? Tch — useless!'] },
          { name: 'GRUB', hp: 16, hits: 5, skill: 0.9, speed: 80, palette: { body: 0x3a4a2a, accent: 0x8aff3a }, death: ['jackal', 'Grub! Get out of there, you oaf!'] },
        ];
        G.aces = defs.map((d, i) => {
          const a = new Ace(P.pos.clone().add(V3((i - 1) * 60, 40, -600)), { ...d, mesh: Models.ace(d.palette) });
          a.onDeath = () => this.radio(d.death[0], d.death[1], 2);
          return a;
        });
        UI.bossBar({ name: 'JACKAL PACK', hpFrac: () => G.aces.reduce((s, a) => s + (a.alive ? a.hp : 0), 0) / 58 });
        break;
      }
      case 'troubleAce': {
        const w = G.wingmen.find((x) => x.id === e.who && x.active);
        const ace = (G.aces || []).find((a) => a.alive);
        if (!w || !ace) break;
        ace.target = w; ace.retarget = 14;
        w.startTrouble(ace, 13);
        this.radio(w.id, { marlow: 'One of the Pack is on me! I could use a hand, Vix!', kestrel: 'This mutt won\'t get off my six! Vix!', tobi: 'Vix! A jackal is chasing me!! HELP!' }[w.id], 3);
        break;
      }
      case 'acesRetreat': {
        const left = (G.aces || []).filter((a) => a.alive);
        if (left.length) { this.radio('jackal', 'Pack, pull back! We\'ll finish this another day!', 2); left.forEach((a) => { a.hostile = false; a.lockable = false; setTimeoutGame(() => a.dispose(), 2.5); a.jink = 3; a.jinkDir.set(0, 1, 0); }); }
        UI.bossBar(null);
        break;
      }
      case 'pickups': {
        const kinds = ['silver', pick(['bomb', 'laser', 'silver']), pick(['gold', 'wing', 'bomb'])];
        kinds.forEach((k, i) => new Crate(P.pos.clone().addScaledVector(P.nose, 160 + i * 40).add(V3(rand(-25, 25), rand(-10, 10), rand(-25, 25))), k));
        this.radioOnce('supplies' + Math.floor(G.stageTime / 30), 'hq', 'Supply containers dropped near your position, Stark Fox!');
        break;
      }
      default: console.warn('Unknown stage event', e);
    }
  },
  placeRing(kind, s, x, y) {
    const f = Rail.frame(s);
    const pos = f.pos.clone().addScaledVector(f.right, x).addScaledVector(f.up, y);
    const r = new Pickup(kind, pos, { face: f.tan, magnet: false });
    if (kind !== 'checkpoint') r.mesh.scale.setScalar(1.8);
    return r;
  },
  // all-range phase director
  enterPhase(i) {
    const ph = G.stage.phases[i];
    if (!ph) return;
    this.phaseIdx = i;
    this.phase = { def: ph, t: 0, fired: new Set() };
    G.checkpoint = { hits: G.hits };
    (ph.enter || []).forEach((e) => this.runEvent(e));
  },
  updateDirector(dt) {
    const ph = this.phase;
    if (!ph) return;
    ph.t += dt;
    (ph.def.timeline || []).forEach((e, i) => { if (!ph.fired.has(i) && ph.t >= e.t) { ph.fired.add(i); this.runEvent(e); } });
    if (ph.def.until(ph)) {
      (ph.def.exit || []).forEach((e) => this.runEvent(e));
      this.enterPhase(this.phaseIdx + 1);
    }
  },

  // ------------------------------------------------------------ scoring / items
  addHits(n, pos, src) {
    if (n <= 0) return;
    G.hits += n;
    UI.popup(pos, n > 1 ? `+${n}` : '+1', n > 2 ? 'big' : '');
  },
  bonus(n, pos) {
    G.hits += n; this.stats.bonus += n;
    UI.popup(pos, `HIT +${n} BONUS`, 'bonus');
    AudioSys.play('oneUp', { volume: 0.5, pitch: 1.3 });
  },
  stat(k, v = 1) { this.stats[k] = (this.stats[k] || 0) + v; },
  collect(kind, pos) {
    const P = G.player;
    switch (kind) {
      case 'silver': P.heal(G.shieldMax * 0.3); AudioSys.play('ring'); UI.popup(pos, 'SHIELD +', 'item'); break;
      case 'gold':
        G.gold++; G.goldTotal++; P.heal(G.shieldMax * 0.5); AudioSys.play('goldRing');
        if (G.gold >= 3) {
          G.gold = 0;
          if (G.shieldMax < 140) { G.shieldMax = 140; P.heal(140); this.toast('SHIELD CAPACITY EXPANDED!'); this.radio('tobi', 'Three gold rings — I\'ve boosted your shield capacity!', 1); }
          else { G.lives++; AudioSys.play('oneUp'); this.toast('1-UP!'); }
        }
        UI.popup(pos, 'GOLD RING', 'item');
        break;
      case 'checkpoint': {
        const r = G.ents.find((e) => e.kind === 'checkpoint' && e.pos.distanceTo(pos) < 1);
        P.heal(G.shieldMax * 0.4); P.repairWings();
        AudioSys.play('checkpoint'); AudioSys.stinger('checkpoint');
        this.toast('CHECKPOINT');
        if (r && r.cp) this.saveCheckpoint(r.cp.segId, r.cp.local);
        break;
      }
      case 'laser':
        if (P.wingHP[0] <= 0 || P.wingHP[1] <= 0) { this.radio('tobi', 'Can\'t mount that upgrade with a broken wing! Find a wing repair!', 1); break; }
        G.laser = Math.min(2, G.laser + 1); AudioSys.play('pickup');
        this.toast(G.laser === 1 ? 'TWIN LASERS' : 'HYPER LASERS');
        if (this.onceKeys.has('laserMsg') === false) { this.onceKeys.add('laserMsg'); this.radio('tobi', G.laser === 1 ? 'Twin lasers online! Double the firepower!' : 'Hyper lasers! Now you\'re cooking!', 1); }
        break;
      case 'bomb': G.bombs = Math.min(9, G.bombs + 1); AudioSys.play('pickup'); this.toast('SMART BOMB +1'); break;
      case 'wing': P.repairWings(); P.heal(20); AudioSys.play('pickup'); this.toast('WINGS REPAIRED'); break;
    }
  },

  // ------------------------------------------------------------ radio / hints / toasts
  radio(who, text, prio = 1) {
    if (this.radioQ.length > 4) this.radioQ = this.radioQ.filter((m) => m.prio >= 2);
    this.radioQ.push({ who, text, prio });
    if (prio >= 3 && this.radioCur && this.radioCur.prio < 3) this.radioCur.t = 0;
  },
  radioOnce(key, who, text, prio) { if (this.onceKeys.has(key)) return; this.onceKeys.add(key); this.radio(who, text, prio); },
  updateRadio(dt) {
    if (this.radioCur) {
      this.radioCur.t -= dt;
      this.radioCur.shown = Math.min(this.radioCur.text.length, this.radioCur.shown + dt * 55);
      $('#radio-text').textContent = this.radioCur.text.slice(0, Math.floor(this.radioCur.shown));
      if (this.radioCur.t <= 0) { this.radioCur = null; this.hideRadio(); }
      return;
    }
    if (!this.radioQ.length) return;
    this.radioQ.sort((a, b) => b.prio - a.prio);
    const m = this.radioQ.shift();
    const vd = AudioSys.voice(m.who, m.text);
    AudioSys.play('radioOpen', { volume: 0.5 });
    m.t = Math.max(2.6, vd + 0.8, m.text.length / 22 + 1.0); m.shown = 0;
    this.radioCur = m;
    const c = CHARS[m.who];
    $('#radio-portrait').innerHTML = UI.portrait(m.who);
    $('#radio-name').textContent = c.name; $('#radio-name').style.color = c.color;
    $('#radio').classList.add('show');
  },
  hideRadio() { $('#radio').classList.remove('show'); },
  hint(id, text) {
    if (!Settings.hints || G.attract || this.hintsShown.has(id)) return;
    this.hintsShown.add(id);
    this.hintCur = { id, text, t: 7 };
    $('#hint').innerHTML = `<div class="hint-tag">TIP</div><div>${UI.glyphText(text)}</div>`;
    $('#hint').classList.add('show');
  },
  hintDone(id) { if (this.hintCur && this.hintCur.id === id) this.hintCur.t = Math.min(this.hintCur.t, 0.8); },
  updateHint(dt) {
    if (!this.hintCur) return;
    this.hintCur.t -= dt;
    if (this.hintCur.t <= 0) { this.hintCur = null; $('#hint').classList.remove('show'); }
  },
  toast(text, dur = 2.2) { const t = $('#toast'); t.textContent = text; t.classList.add('show'); this.toastT = dur; },

  // ------------------------------------------------------------ camera
  snapCamera() { this.cameraUpdate(1, true); },
  cameraUpdate(dt, snap = false) {
    const P = G.player;
    if (!P) return;
    const cam = R.camera;
    let tp, tl, up = V3(0, 1, 0), fov = 62;
    const far = G.camMode === 1;
    if (this.clearSeq) {
      const c = this.clearSeq;
      tp = c.camFrom; tl = P.pos.clone();
    } else if (G.mode === 'rails') {
      const f = Rail.frame(Rail.s + P.dz - (far ? 30 : 21));
      tp = f.pos.clone().addScaledVector(f.right, P.lx * 0.72).addScaledVector(f.up, P.ly * 0.7 + (far ? 9 : 5.5));
      const fl = Rail.frame(Rail.s + P.dz + 40);
      tl = fl.pos.clone().addScaledVector(fl.right, P.lx * 0.85).addScaledVector(fl.up, P.ly * 0.8 + 2);
      up = f.up.clone().applyAxisAngle(f.tan, -P.vx / 40 * 0.06 - P.bankVis * 0.05);
      if (P.maneuver && P.maneuver.type === 'loop') { tl = P.pos.clone(); }
      if (this.introT < 5 && G.cinematic && !G.attract) {
        // intro: start ahead of the team looking back at them, swing behind
        const k = smooth(clamp(this.introT / 4.6, 0, 1));
        const front = Rail.toWorld(Rail.s + 60, 18, 6);
        tp = front.lerp(tp, k);
        tl = P.pos.clone().lerp(tl, k);
      }
    } else {
      const flat = new THREE.Quaternion().setFromEuler(_e1.set(P.maneuver ? 0 : P.pitch, P.yaw, 0, 'YXZ'));
      const back = V3(0, far ? 9 : 6, far ? 34 : 24).applyQuaternion(P.maneuver ? P.quat.clone().multiply(new THREE.Quaternion().setFromAxisAngle(V3(0, 0, 1), -P.bankVis - P.visRoll - P.flipRoll)) : flat);
      tp = P.pos.clone().add(back);
      tl = P.pos.clone().addScaledVector(P.nose, 30);
      if (P.maneuver) up = V3(0, 1, 0).applyQuaternion(P.quat);
    }
    if (P.boosting) fov = 75; else if (P.braking) fov = 54;
    if (snap) { this.camPos.copy(tp); this.camLook.copy(tl); this.camUp.copy(up); }
    else {
      const k = G.mode === 'rails' ? 9 : 5.5;
      this.camPos.lerp(tp, 1 - Math.exp(-dt * k));
      this.camLook.lerp(tl, 1 - Math.exp(-dt * 12));
      this.camUp.lerp(up, 1 - Math.exp(-dt * 6)).normalize();
    }
    this.fov = damp(this.fov, fov, 4, dt);
    cam.fov = this.fov; cam.updateProjectionMatrix();
    cam.position.copy(this.camPos).add(FX.shakeOffset(_v4));
    cam.up.copy(this.camUp);
    cam.lookAt(this.camLook);
    followSun(P.pos, R.sunDir);
  },

  // ------------------------------------------------------------ main update
  update(dt) {
    G.time += dt;
    if (G.state !== 'play') return;
    G.stageTime += dt;
    const P = G.player;
    if (G.cinematic && !this.clearSeq) {
      this.introT += dt;
      if (this.introT > (G.attract ? 1.5 : 4.8)) { G.cinematic = false; if (!G.attract) this.hint('pause', 'Press {pause} any time for the pause menu, controls and settings'); }
    }
    // inputs → player
    let ai = null;
    if (G.attract || G.testPilot) ai = Attract.pilot(dt);
    if (P.alive && !this.clearSeq) {
      if (G.cinematic) P.controls(dt, { sx: 0, sy: 0 });
      else P.controls(dt, ai);
    }
    if (Input.pressed('camera') && !G.attract) { G.camMode = 1 - G.camMode; this.toast(G.camMode ? 'CAMERA: FAR' : 'CAMERA: NEAR', 1); }
    // world motion
    if (G.mode === 'rails') {
      const spd = Rail.speed * (P.boosting ? 1.75 : P.braking ? 0.5 : 1) * (P.alive ? 1 : 0.4);
      const evs = Rail.advance(spd * dt, G.stage.forkChooser);
      for (const e of evs) this.runEvent(e);
      if (P.alive && !this.clearSeq) P.updateRails(dt, Rail.s);
    } else {
      if (P.alive && !this.clearSeq) P.updateAllRange(dt);
      if (!G.cinematic) this.updateDirector(dt);
    }
    // mission clear fly-off
    if (this.clearSeq) {
      const c = this.clearSeq; c.t += dt;
      const fwd = P.nose.clone();
      P.pos.addScaledVector(fwd, (60 + c.t * 120) * dt).add(V3(0, c.t * 20 * dt, 0));
      P.mesh.position.copy(P.pos);
      P.boosting = true; P.commonVisuals(dt); P.retA.visible = P.retB.visible = false;
      if (c.t > 4.2) { this.clearSeq = null; this.finishStage(); return; }
    }
    for (const w of G.wingmen) w.update(dt);
    for (let i = G.ents.length - 1; i >= 0; i--) { const e = G.ents[i]; if (!e.alive) { G.ents.splice(i, 1); continue; } if (!e.isBossPart) e.update(dt); }
    if (G.boss) G.boss.update(dt);
    updateShots(dt);
    updateGameTimers(dt);
    Phys.step(dt);
    // death / clear timers
    if (!P.alive && this.deathT > 0) { this.deathT -= dt; if (this.deathT <= 0) this.afterDeath(); }
    if (this.clearT > 0) { this.clearT -= dt; if (this.clearT <= 0) this.missionClear(); }
    // low shield beeper
    const low = P.alive && P.shield < G.shieldMax * 0.25 && !G.attract;
    if (low && !P.lowSnd) P.lowSnd = AudioSys.loop('lowShield');
    if (!low && P.lowSnd) { P.lowSnd.stop(); P.lowSnd = null; }
    this.updateRadio(dt); this.updateHint(dt);
    if (this.toastT > 0) { this.toastT -= dt; if (this.toastT <= 0) $('#toast').classList.remove('show'); }
    if (Input.pressed('pause') && !G.attract && G.state === 'play') UI.pause(true);
  },
};

// homing pursuer used for wingman-in-trouble events (rails)
class Chaser extends Entity {
  constructor(w) {
    super(Models.fighter(), { hp: 4, hits: 3, radius: 3.4, color: 0xb8441e });
    this.w = w; this.escape = false; this.fireCD = 0.5;
    this.update(0);
  }
  update(dt) {
    if (this.escape) { this.pos.addScaledVector(V3(0, 1, -0.5), 200 * dt); this.baseUpdate(dt); this.escT = (this.escT || 0) + dt; if (this.escT > 2) this.dispose(); return; }
    if (!this.w.active) { this.escape = true; return; }
    const behind = this.w.pos.clone().addScaledVector(this.w.forward(), -16).add(V3(Math.sin(this.age * 3) * 2, Math.cos(this.age * 2.3) * 1.5, 0));
    this.prev.copy(this.pos);
    if (dt === 0) this.pos.copy(behind); else this.pos.lerp(behind, 1 - Math.exp(-dt * 6));
    this.vel.subVectors(this.pos, this.prev).multiplyScalar(1 / Math.max(dt, 1e-4));
    this.facePoint(this.w.pos, dt, 8);
    this.fireCD -= dt;
    if (this.fireCD <= 0 && dt > 0) {
      this.fireCD = 0.35;
      const d = _v1.subVectors(this.w.pos, this.pos).normalize();
      fireShot('eshot', 'enemy', this.pos.clone().addScaledVector(d, 3), d.multiplyScalar(200).add(this.w.vel), { life: 0.4, color: 0xff6a2a, scale: 0.5 });
    }
    this.baseUpdate(dt);
  }
}

// ---------------------------------------------------------------- attract mode (AI pilot, cheats freely)
const Attract = {
  seq: [{ stage: 'corvanis', dur: 75 }, { stage: 'zeta', dur: 60, phase: 1 }, { stage: 'corvanis', dur: 40, skipTo: 'boss' }],
  i: 0, t: 0, rollCD: 0, fireT: 0, flipCD: 6, bombCD: 8,
  async start() {
    this.i = 0;
    await this.play();
  },
  async play() {
    const s = this.seq[this.i % this.seq.length];
    this.t = s.dur;
    G.attract = true;
    await Game.loadStage(s.stage, { attract: true });
    if (s.phase) Game.enterPhase(s.phase);
    if (s.skipTo) {
      const route = ['approach', 'city', 'canyon', 'plains', 'boss'];
      Rail.restore(route, 'plains', Rail.segs.plains.length - 80);
      G.routeTaken = route.slice(0, 4);
      G.player.updateRails(0, Rail.s); Game.snapCamera();
    }
    UI.attractOverlay(true);
  },
  async next() { this.i++; if (this.i >= this.seq.length) { this.stop(); return; } await this.play(); },
  stop() { UI.attractOverlay(false); G.attract = false; Game.quitToTitle(); },
  update(dt) {
    if (!G.attract || G.state !== 'play') return;
    this.t -= dt;
    if (this.t <= 0) { this.t = 999; UI.fade(0.5, () => this.next()); }
  },
  pilot(dt) {
    const P = G.player;
    const I = { sx: 0, sy: 0, boost: false, brake: false, fireP: false, fireH: false, fireR: false, rapid: false, bomb: false, roll: 0, bankL: false, bankR: false, flip: false };
    if (G.attract) P.shield = G.shieldMax;
    // pick target: nearest hostile ahead
    let best = null, bd = 1e9;
    for (const e of G.ents) {
      if (!e.alive || !e.hostile) continue;
      const wp = e.worldPos();
      const to = _v1.subVectors(wp, P.pos);
      const ahead = to.dot(P.nose);
      if (ahead < 10) continue;
      const d = to.length();
      if (d < bd && d < 600) { bd = d; best = e; }
    }
    if (G.boss && G.boss.alive) { const parts = Object.values(G.boss.parts).filter((p) => p.alive && !p.locked()); if (parts.length) best = parts[0]; }
    // if a pickup is near and ahead, steer to it
    for (const e of G.ents) if (e instanceof Pickup && e.alive && e.pos.distanceTo(P.pos) < 220 && _v1.subVectors(e.pos, P.pos).dot(P.nose) > 20) { best = e; break; }
    if (G.mode === 'rails') {
      if (best) {
        const f = Rail.frame(Rail.s);
        const to = _v1.subVectors(best.worldPos(), P.pos);
        const lx = to.dot(f.right), ly = to.dot(f.up);
        I.sx = clamp(lx / 10, -1, 1); I.sy = clamp(-ly / 10, -1, 1);
      } else { I.sx = clamp(-P.lx / 15, -1, 1) + Math.sin(G.time * 0.7) * 0.4; I.sy = clamp(P.ly / 15, -1, 1); }
      if (G.boss && G.boss.alive) I.sy = clamp((P.ly - 8) / 10, -1, 1) * (best instanceof BossPart ? 0.3 : 1);
    } else if (best) {
      const to = _v1.subVectors(best.worldPos(), P.pos).normalize();
      const local = to.clone().applyQuaternion(new THREE.Quaternion().setFromEuler(_e1.set(P.pitch, P.yaw, 0, 'YXZ')).invert());
      I.sx = clamp(local.x * 3, -1, 1); I.sy = clamp(-local.y * 3, -1, 1);
      if (local.z > 0.3 && Math.random() < dt * 0.6) { I.flip = true; I.brake = true; }
    } else { I.sx = 0.3; }
    // weapons: rapid fire when aligned, periodic charge shots
    this.fireT += dt;
    const cyc = this.fireT % 4;
    if (best && best.hostile) {
      if (cyc < 2.4) I.rapid = true;
      else if (cyc < 3.6) I.fireH = true;
      else if (cyc - dt < 3.6) I.fireR = true;
    }
    // barrel roll when shots are near
    this.rollCD -= dt;
    if (this.rollCD <= 0 && G.shots.some((s) => s.alive && s.owner === 'enemy' && s.pos.distanceTo(P.pos) < 30)) { I.roll = Math.random() < 0.5 ? -1 : 1; this.rollCD = 1.2; }
    this.flipCD -= dt;
    if (G.mode === 'rails' && this.flipCD <= 0 && G.ents.some((e) => e.alive && e instanceof RailFlyer && _v1.subVectors(e.pos, P.pos).dot(P.nose) < 0)) { I.flip = true; this.flipCD = 9; }
    this.bombCD -= dt;
    if (this.bombCD <= 0 && G.ents.filter((e) => e.alive && e.hostile).length > 5) { I.bomb = true; this.bombCD = 12; }
    I.boost = Math.sin(G.time * 0.31) > 0.85;
    return I;
  },
};

    $('#laser').className = 'laser-l' + lvl;
    const wings = $('#wings');
    wings.innerHTML = P.wingHP.map((h, i) => `<i class="w${i} h${h}"></i>`).join('');
    const bf = $('#boost-fill');
    bf.style.width = P.boost * 100 + '%';
    bf.className = P.boostLock ? 'lock' : P.boosting ? 'boost' : P.braking ? 'brake' : '';
    // wingmen chips
    const wm = $('#wingmen');
    if (!wm.dataset.built) { wm.innerHTML = G.wingmen.map((w) => `<div class="wm" id="wm-${w.id}">${this.portrait(w.id)}<b><i></i></b></div>`).join(''); wm.dataset.built = 1; }

    if (this.boss) $('#bossfill').style.width = clamp(this.boss.hpFrac(), 0, 1) * 100 + '%';
    // markers: lock-on + off-screen important targets
    let html = '';
    if (P.lock && P.lock.alive) { const p = this.project(P.lock.worldPos()); if (p.on) html += `<div class="lock" style="left:${p.x}px;top:${p.y}px"></div>`; }
    if (G.mode === 'allrange') {
      const imp = G.ents.filter((e) => e.alive && e.hostile && e instanceof Ace);
      if (G.boss && G.boss.alive) imp.push({ worldPos: () => G.boss.pos, isBoss: true });
      for (const e of imp.slice(0, 8)) {
        const p = this.project(e.worldPos());
        if (p.on) { if (!e.isBoss) html += `<div class="tag" style="left:${p.x}px;top:${p.y}px">${e.name}</div>`; continue; }
        let nx = p.nx, ny = p.ny; if (p.behind) { nx = -nx; ny = -ny; }
        const a = Math.atan2(ny, nx);
        const ex = (Math.cos(a) * 0.44 + 0.5) * innerWidth, ey = (-Math.sin(a) * 0.42 + 0.5) * innerHeight;
        html += `<div class="offarrow ${e.isBoss ? '' : 'ace'}" style="left:${ex}px;top:${ey}px;transform:translate(-50%,-50%) rotate(${-a}rad)"></div>`;
      }
      for (const w of G.wingmen) if (w.trouble) { const p = this.project(w.pos); if (p.on) html += `<div class="tag help" style="left:${p.x}px;top:${p.y}px">HELP!</div>`; }
    } else {
      for (const w of G.wingmen) if (w.trouble) { const p = this.project(w.pos); if (p.on) html += `<div class="tag help" style="left:${p.x}px;top:${p.y}px">HELP!</div>`; }
    }
    $('#markers').innerHTML = html;
    $('#radar').style.display = G.mode === 'allrange' ? 'block' : 'none';
    if (G.mode === 'allrange') this.drawRadar();
  },
  drawRadar() {
    const c = $('#radar'), ctx = c.getContext('2d');
    const W = c.width, H = c.height, cx = W / 2, cy = H / 2, scale = (W / 2 - 8) / 900;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(8,16,40,0.55)'; ctx.beginPath(); ctx.arc(cx, cy, W / 2 - 2, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(120,200,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, (W / 2 - 2) * 0.5, 0, TAU); ctx.strokeStyle = 'rgba(120,200,255,0.2)'; ctx.stroke();
    const P = G.player;
    const yaw = P.yaw;
    const dot = (pos, col, r) => {
      const dx = pos.x - P.pos.x, dz = pos.z - P.pos.z;
      const rx = dx * Math.cos(yaw) - dz * Math.sin(yaw), rz = dx * Math.sin(yaw) + dz * Math.cos(yaw);
      let x = rx * scale, y = rz * scale;
      const m = Math.hypot(x, y), lim = W / 2 - 6;
      if (m > lim) { x *= lim / m; y *= lim / m; }
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx + x, cy + y, r, 0, TAU); ctx.fill();
    };
    if (G.boss && G.boss.alive) dot(G.boss.pos, '#ff4ab0', 7);
    for (const e of G.ents) { if (!e.alive || e.isBossPart) continue; if (e instanceof Ace) dot(e.pos, '#ffcc40', 4.5); else if (e.hostile) dot(e.pos, '#ff5a4a', 3); else if (e instanceof Pickup || e instanceof Crate) dot(e.pos, '#9fffa0', 3); }
    for (const w of G.wingmen) if (w.active) dot(w.pos, '#5ab8ff', 4);
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(cx, cy - 7); ctx.lineTo(cx - 5, cy + 5); ctx.lineTo(cx + 5, cy + 5); ctx.fill();
  },
};

// ---------------------------------------------------------------- screen classes
class BaseScreen {
  constructor(id) {
    this.id = id;
    this.el = document.createElement('div');
    this.el.className = 'screen scr-' + id;
    $('#screens').appendChild(this.el);
    this.focus = 0;
  }
  footerHtml(list) { return `<div class="footer">${(list || []).map(([g, t]) => `<span>${Glyph.html(g)} ${t}</span>`).join('')}</div>`; }
  input() {}
  render() {}
}

class MenuScreen extends BaseScreen {
  constructor(id, o) { super(id); this.o = o; this.el.classList.add(o.cls || ''); }
  onOpen() { this.focus = 0; }
  list() { return this.o.items(); }
  render() {
    const items = this.list();
    this.focus = clamp(this.focus, 0, items.length - 1);
    const rows = items.map((it, i) => {
      let val = '';
      if (it.type === 'toggle') val = `<span class="val ${Settings[it.key] ? 'on' : ''}">${Settings[it.key] ? 'ON' : 'OFF'}</span>`;
      else if (it.type === 'choice') { const o = it.options.find((x) => x[0] === Settings[it.key]) || it.options[0]; val = `<span class="val choice">‹ ${o[1]} ›</span>`; }
      else if (it.type === 'slider') val = `<span class="val slider"><b style="width:${Math.round(Settings[it.key] * 100)}%"></b><em>${Math.round(Settings[it.key] * 10)}</em></span>`;
      return `<div class="item ${i === this.focus ? 'focus' : ''} ${it.disabled ? 'disabled' : ''}" data-idx="${i}"><span class="lbl">${it.label}</span>${val}</div>`;
    }).join('');
    const desc = items[this.focus] ? items[this.focus].desc || '' : '';
    const logo = this.o.logo ? `<div class="logo small">${LOGO_HTML}</div>` : '';
    const title = this.o.title ? `<h1 class="scr-title">${this.o.title}</h1>` : '';
    const side = this.o.side ? `<div class="side">${this.o.side()}</div>` : '';
    const prevScroll = this.el.querySelector('.items') ? this.el.querySelector('.items').scrollTop : 0;
    this.el.innerHTML = `<div class="panel">${logo}${title}<div class="items">${rows}</div><div class="desc">${desc}</div></div>${side}${this.footerHtml(this.o.footer)}`;
    const list = this.el.querySelector('.items');
    list.scrollTop = prevScroll;
    const f = list.querySelector('.focus');
    if (f) f.scrollIntoView({ block: 'nearest' });
  }
  input() {
    const items = this.list();
    const n = Input.nav;
    if (n === 'up' || n === 'down') {
      let f = this.focus;
      do { f = (f + (n === 'down' ? 1 : -1) + items.length) % items.length; } while (items[f].disabled && f !== this.focus);
      this.focus = f; AudioSys.play('menuMove'); this.render();
    } else if (n === 'left' || n === 'right') this.activate(n === 'left' ? -1 : 1);
    if (Input.pressed('confirm')) this.activate(0, true);
    else if (Input.pressed('back')) { this.o.onBack && this.o.onBack(); }
  }
  activate(dir, press) {
    const it = this.list()[this.focus];
    if (!it || it.disabled) return;
    if (it.type === 'toggle') { if (press || dir) { Settings[it.key] = !Settings[it.key]; AudioSys.play('menuMove'); this.o.onChange && this.o.onChange(); this.render(); } }
    else if (it.type === 'choice') {
      const idx = it.options.findIndex((x) => x[0] === Settings[it.key]);
      const ni = (idx + (dir || 1) + it.options.length) % it.options.length;
      Settings[it.key] = it.options[ni][0]; AudioSys.play('menuMove'); this.o.onChange && this.o.onChange(); this.render();
    } else if (it.type === 'slider') {
      if (dir) { Settings[it.key] = clamp(Math.round((Settings[it.key] + dir * 0.1) * 10) / 10, 0, 1); AudioSys.play('menuMove'); this.o.onChange && this.o.onChange(); this.render(); }
      else if (press) { const v = Math.round(Settings[it.key] * 10) / 10; Settings[it.key] = v >= 1 ? 0 : Math.round((v + 0.1) * 10) / 10; AudioSys.play('menuMove'); this.o.onChange && this.o.onChange(); this.render(); }
    } else if (press && it.action) { AudioSys.play('menuConfirm'); it.action(); }
  }
}

class TabScreen extends BaseScreen {
  constructor(id, title, tabs) { super(id); this.title = title; this.tabs = tabs; this.tab = 0; this.el.classList.add('tabs-screen'); }
  onOpen() { this.tab = 0; }
  render() {
    const t = this.tabs[this.tab];
    const tabs = this.tabs.map((x, i) => `<span class="tab ${i === this.tab ? 'on' : ''}" data-tab="${i}">${x.name}</span>`).join('');
    this.el.innerHTML = `<h1 class="scr-title">${this.title}</h1><div class="tabbar">${Glyph.html('tabL')}${tabs}${Glyph.html('tabR')}</div><div class="tab-body">${UI.glyphText(typeof t.html === 'function' ? t.html() : t.html)}</div>${this.footerHtml([['tabs', 'Switch Page'], ['nav', 'Scroll'], ['back', 'Back']])}`;
    this.el.querySelectorAll('[data-tab]').forEach((n) => n.addEventListener('click', () => { this.tab = +n.dataset.tab; this.render(); }));

  input() {
    const n = Input.nav;
    if (Input.pressed('tabL') || n === 'left') { this.tab = (this.tab + this.tabs.length - 1) % this.tabs.length; AudioSys.play('menuMove'); this.render(); }

class ResultsScreen extends BaseScreen {
  constructor() { super('results'); this.el.classList.add('results'); }
  onOpen(r) { this.r = r; this.t = 0; this.focus = 0; }
  items() {
    const r = this.r;
    const list = [];
    if (r.stage.next) list.push({ label: 'Next Mission', action: () => { UI.closeAll(); Game.loadStage(r.stage.next, { keepRun: true, wingmenOut: [] }); } });
    else list.push({ label: 'Continue', action: () => { UI.close(); UI.open('complete'); } });

    list.push({ label: 'Title Screen', action: () => { UI.closeAll(); Game.quitToTitle(); } });
    return list;
  }
  render() {
    const r = this.r; if (!r) return;
    const k = clamp(this.t / 1.6, 0, 1);
    const acc = r.stats.shots ? Math.round((r.stats.landed / r.stats.shots) * 100) : 0;
    const wm = r.wingmen.map((w) => `<div class="wm-chip ${w.active ? '' : 'out'}">${UI.portrait(w.id)}<span>${WINGMEN[w.id].name}</span><em>${w.active ? 'OK' : 'REPAIRS'}</em></div>`).join('');
    const items = this.items().map((it, i) => `<div class="item ${i === this.focus ? 'focus' : ''}" data-idx="${i}"><span class="lbl">${it.label}</span></div>`).join('');
    this.el.innerHTML = `<div class="res-head"><div class="mission-tag">MISSION ${r.stage.number} COMPLETE</div><h1>${r.stage.name}</h1></div>
      <div class="res-body"><div class="big-stat huge"><span>ENEMIES DOWN</span><b>${String(Math.round(r.hits * k)).padStart(3, '0')}</b></div>
      <div class="res-stats"><div><span>Bonus hits</span><b>${r.stats.bonus}</b></div><div><span>Accuracy</span><b>${acc}%</b></div><div><span>Wingmen rescued</span><b>${r.stats.rescues}</b></div><div><span>Shots deflected</span><b>${r.stats.deflects}</b></div></div>
      <div class="wm-row">${wm}</div>
      <div class="medal-line ${r.medal ? 'got' : ''}">${r.medal ? '★ MEDAL EARNED' : `Medal needs ${r.stage.medalHits}+ hits with every wingman flying`}</div>
      <div class="muted">Best: ${String(r.best).padStart(3, '0')} · Campaign total: ${String(r.total).padStart(3, '0')}</div></div>
      <div class="panel small"><div class="items">${items}</div></div>${this.footerHtml([['confirm', 'Select']])}`;
  }
  input(dt) {
    if (this.t < 1.7) { this.t += dt; this.render(); if (Math.floor(this.t * 20) !== Math.floor((this.t - dt) * 20) && this.t < 1.6) AudioSys.play('menuMove', { volume: 0.3, pitch: 1.5 }); }
    const n = Input.nav;
    const items = this.items();
    if (n === 'up' || n === 'down') { this.focus = (this.focus + (n === 'down' ? 1 : items.length - 1)) % items.length; AudioSys.play('menuMove'); this.render(); }
    if (Input.pressed('confirm') && this.t > 0.4) this.activate(0, true);
  }
  activate() { const it = this.items()[this.focus]; AudioSys.play('menuConfirm'); it.action(); }
}

const Title = {
  ready: false, orbit: 0,
  async enter() {
    G.state = 'title';
    UI.closeAll();
    UI.showLoading(true);
    if (G.stageId !== 'corvanis' || !G.player || G.attract === undefined) {
      await Game.loadStage('corvanis', { attract: false });
    }
    // calm flyover: no enemies, no HUD
    for (const e of G.ents) if (e.dispose) e.dispose();
    G.ents = []; G.shots.forEach((s) => s.kill()); G.shots = []; GameTimers.length = 0;
    if (G.boss) { G.boss.dispose(); G.boss = null; }
    Rail.restore(['approach'], 'approach', 150);
    G.state = 'title'; G.cinematic = true; G.attract = false;
    UI.hud(false); UI.attractOverlay(false);
    $('#stagecard').classList.remove('show');
    Game.radioQ = []; Game.radioCur = null; Game.hideRadio();
    G.player.reset(); G.player.mesh.visible = true;
    G.wingmen.forEach((w) => { w.active = true; w.hp = 100; w.trouble = null; w.retreating = 0; });
    UI.showLoading(false);
    AudioSys.music('title');
    if (!TouchGate.active) UI.open('press');
    Input.resetIdle();
  },
  update(dt) {
    if (G.state !== 'title') return;
    this.orbit += dt * 0.12;
    Rail.s += 38 * dt;
    if (Rail.s > Rail.segs.approach.length - 300) Rail.s = 150;
    const P = G.player;
    P.controls(dt, { sx: Math.sin(G.time * 0.5) * 0.5, sy: Math.sin(G.time * 0.37) * 0.4 });
    P.updateRails(dt, Rail.s);
    P.retA.visible = P.retB.visible = false;
    for (const w of G.wingmen) w.update(dt);
    FX.update(dt);
    // slow cinematic orbit around the formation
    const a = this.orbit;
    const cp = P.pos.clone().add(V3(Math.sin(a) * 34, 9 + Math.sin(a * 0.7) * 5, Math.cos(a) * 34));
    R.camera.position.lerp(cp, 1 - Math.exp(-dt * 2));
    R.camera.up.set(0, 1, 0);
    R.camera.lookAt(P.pos.clone().add(V3(0, 2, 0)));
    R.camera.fov = 55; R.camera.updateProjectionMatrix();
    followSun(P.pos, R.sunDir);
    // idle → attract mode (10 s without input on title/menu screens)
    const top = UI.top();
    if (top && ['press', 'menu', 'stages'].includes(top.id) && Input.idleSeconds() > 10 && !TouchGate.active) {
      UI.closeAll();
      Attract.start();
    }
  },
};

// ===== 14_main.js — boot, platform checks, main loop =====
const Clock = { last: performance.now(), delta() { const n = performance.now(); const d = (n - this.last) / 1000; this.last = n; return d; } };

function isTouchOnly() {
  const coarse = matchMedia('(pointer: coarse)').matches;
  const fine = matchMedia('(any-pointer: fine)').matches;
  return (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) && coarse && !fine;
}

function fatal(title, msg) {
  $('#loading').classList.remove('show');
  const e = $('#fatal');
  e.innerHTML = `<div class="logo big">${LOGO_HTML}</div><h2>${title}</h2><p>${msg}</p>`;
  e.classList.add('show');
}

// Touch-only gate: shown before anything else; the game keeps booting behind it.
const TouchGate = {
  active: false, fatal: null,
  open() {
    this.active = true;
    UI.closeAll(); UI.open('touch');
    const leave = () => this.leave();
    Bus.on('padchange', (on) => on && leave());
    window.addEventListener('keydown', leave, { once: true });
  },
  leave() {
    if (!this.active) return;
    this.active = false;
    UI.closeAll();
    if (this.fatal) { fatal(...this.fatal); return; }
    if (G.state === 'title') UI.open('press');
  },
};

async function boot() {
  UI.init();
  UI.applySettings();
  const touchOnly = isTouchOnly() && !Input.st.padConnected;
  let menuLoop = 0;
  if (touchOnly) {
    TouchGate.open();
    // lightweight loop so the touch screen's Settings work before the renderer exists
    const loop = () => { const dt = clamp(Clock.delta(), 0, 0.05); Input.poll(dt); UI.update(dt); menuLoop = requestAnimationFrame(loop); };
    menuLoop = requestAnimationFrame(loop);
  }
  const fail = (title, msg) => { if (TouchGate.active) TouchGate.fatal = [title, msg]; else fatal(title, msg); };
  // WebGPU is required — no WebGL fallback by design.
  if (!navigator.gpu) { fail('WebGPU is required', 'This browser does not expose WebGPU. Use a current Chrome, Edge, Safari 26+ or Firefox with WebGPU enabled, on a device with a supported GPU.'); return; }
  let adapter = null;
  try { adapter = await navigator.gpu.requestAdapter(); } catch (e) { adapter = null; }
  if (!adapter) { fail('No WebGPU adapter', 'WebGPU is present but no compatible GPU adapter was found. Check that hardware acceleration is enabled.'); return; }
  if (!TouchGate.active) $('#loading').classList.add('show');
  try {
    await Phys.init();
    await initRenderer($('#gl'));
  } catch (e) {
    console.error(e);
    fail('Could not start the renderer', String(e && e.message ? e.message : e));
    return;
  }
  FX.init();
  const unlock = () => AudioSys.init();
  window.addEventListener('pointerdown', unlock);
  window.addEventListener('keydown', unlock);
  Game.sessionStart = performance.now();

  await Title.enter();
  if (TouchGate.active) { UI.closeAll(); UI.open('touch'); }
  cancelAnimationFrame(menuLoop);
  R.renderer.setAnimationLoop(frame);
}

let frameErrors = 0;
const DEV = { on: false, fps: 0, acc: 0, n: 0 };
window.addEventListener('keydown', (e) => { if (e.code === 'F3') { DEV.on = !DEV.on; $('#dev').classList.toggle('show', DEV.on); e.preventDefault(); } });
function tick(dt) {
  G.frame = (G.frame || 0) + 1;
  try {
    Input.poll(dt);
    if (Input.st.anyActivity) AudioSys.init();
    // any input leaves attract mode
    if (G.attract && (Input.st.anyActivity || Input.st.mouseActivity) && G.state === 'play') { Attract.stop(); }
    UI.update(dt);
    if (G.state === 'title') Title.update(dt);
    else if (G.state === 'play') { Game.update(dt); FX.update(dt); if (G.state === 'play' || G.state === 'paused') Game.cameraUpdate(dt); Attract.update(dt); }
    else if (G.state === 'results' || G.state === 'gameover') { FX.update(dt); Phys.step(dt); }
    if (G.state === 'paused' && UI.top() && UI.top().id === 'pause' && Input.pressed('pause') && !Input.pressed('back') && G.frame > (UI.pauseFrame || 0)) UI.pause(false);
    World.update(dt);
  } catch (e) {
    if (frameErrors++ < 5) { console.error(e); (window.__SFerr ||= []).push(String((e && e.stack) || e).slice(0, 800)); }
  }
}
function frame() {
  const raw = Clock.delta();
  const dt = clamp(raw, 0, 1 / 20);
  tick(dt);
  R.post.render();
  if (DEV.on) {
    DEV.acc += raw; DEV.n++;
    if (DEV.acc > 0.5) { DEV.fps = DEV.n / DEV.acc; DEV.acc = 0; DEV.n = 0; }
    const seg = G.mode === 'rails' && Rail.chain.length ? Rail.seg : null;
    $('#dev').textContent = `FPS ${DEV.fps.toFixed(0)} | ${G.state}${G.attract ? ' (attract)' : ''} | ${G.stageId || '-'} ${G.mode}` +
      (seg ? ` | seg ${seg.id} ${(Rail.s - seg.s0).toFixed(0)}/${seg.length.toFixed(0)}` : Game.phase ? ` | phase ${Game.phase.def.id} ${Game.phase.t.toFixed(0)}s` : '') +
      ` | ents ${G.ents.length} shots ${G.shots.length} debris ${Phys.debris.length} | draws ${R.renderer.info.render.calls}`;
  }
}
/** Headless test helper: advance the simulation without rendering. */
function sim(seconds, dt = 1 / 30) {
  const n = Math.round(seconds / dt);
  for (let i = 0; i < n; i++) tick(dt);
  return { state: G.state, stage: G.stageId, s: Rail.s, seg: G.mode === 'rails' && Rail.chain.length ? Rail.seg.id : null, ents: G.ents.length, hits: G.hits, shield: G.player && G.player.shield, alive: G.player && G.player.alive, lives: G.lives, boss: G.boss ? G.boss.hpFrac() : null, phase: Game.phase && Game.phase.def.id, route: G.routeTaken.join('>') };
}

// debug/test handle (used by automated tests and the F3 overlay)
window.__SF = { G, Game, Rail, UI, Attract, Settings, Phys, R, STAGES, Input, sim, tick };
boot();
