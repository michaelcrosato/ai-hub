<script type="module">
import * as THREE from 'three';

// ---- world.js ----
// Shared rendering world: renderer, camera, lights with shadows, starfield, terrain and particle pools.

const world = {
  renderer: null,
  scene: null,
  camera: null,
  sun: null,
  fill: null,
  stars: null,
  terrain: [],
  shake: 0,
  time: 0,
  palette: null,
};

const STAGE_PALETTES = {
  space: { sky: 0x03050f, fog: 0x060a1c, ground: 0x2a3a5c, ridge: 0x1c2a48, accent: 0x63d8ff, sun: 0xffe2b0 },
  canyon: { sky: 0x1a0c08, fog: 0x3a1c12, ground: 0x7a4a2c, ridge: 0x5c3320, accent: 0xffa04a, sun: 0xffc690 },
  station: { sky: 0x06100c, fog: 0x0a2016, ground: 0x2a5a48, ridge: 0x18403a, accent: 0x5cffc0, sun: 0xd0ffe6 },
  boss: { sky: 0x120412, fog: 0x2a0a24, ground: 0x3a1c40, ridge: 0x2a1030, accent: 0xff4d8d, sun: 0xffb0d8 },
};

function initWorld(canvas) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 900);
  camera.position.set(0, 3, 9);

  const hemi = new THREE.HemisphereLight(0x8fb4ff, 0x20140e, 0.7);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(-40, 60, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -60;
  sun.shadow.camera.right = 60;
  sun.shadow.camera.top = 60;
  sun.shadow.camera.bottom = -60;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 200;
  sun.shadow.bias = -0.0005;
  scene.add(sun);
  scene.add(sun.target);

  const fill = new THREE.PointLight(0x6fb8ff, 30, 120, 1.6);
  fill.position.set(0, 8, -20);
  scene.add(fill);

  world.renderer = renderer;
  world.scene = scene;
  world.camera = camera;
  world.sun = sun;
  world.fill = fill;

  buildStarfield();
  buildTerrainPool();
  applyPalette('space');

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });
  return world;
}

function applyPalette(name) {
  const p = STAGE_PALETTES[name] || STAGE_PALETTES.space;
  world.palette = p;
  world.scene.background = new THREE.Color(p.sky);
  world.scene.fog = new THREE.Fog(p.fog, 60, 240);
  world.sun.color.setHex(p.sun);
  world.fill.color.setHex(p.accent);
  for (const t of world.terrain) {
    t.ground.material.color.setHex(p.ground);
    t.ridge.material.color.setHex(p.ridge);
  }
}

function buildStarfield() {
  const count = 1400;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 380 + Math.random() * 300;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi) * 0.6 + 40;
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, fog: false });
  world.stars = new THREE.Points(geo, mat);
  world.scene.add(world.stars);
}

// Terrain is a set of tiles that scroll toward the camera and recycle, giving endless ground.
const TILE_LEN = 60;
const TILE_COUNT = 7;

function buildTerrainPool() {
  for (let i = 0; i < TILE_COUNT; i++) {
    const group = new THREE.Group();
    const groundGeo = new THREE.PlaneGeometry(260, TILE_LEN, 40, 10);
    const pos = groundGeo.attributes.position;
    for (let v = 0; v < pos.count; v++) {
      const x = pos.getX(v);
      const y = pos.getY(v);
      const h = Math.sin(x * 0.11) * 1.2 + Math.cos(y * 0.07) * 1.5 + Math.sin((x + y) * 0.23) * 0.4;
      pos.setZ(v, h * (Math.abs(x) > 30 ? 1.0 : 0.25));
    }
    groundGeo.computeVertexNormals();
    const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color: 0x2a3a5c, roughness: 0.95, flatShading: true }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -14;
    ground.receiveShadow = true;
    group.add(ground);

    const ridgeGeo = new THREE.BoxGeometry(14, 10, TILE_LEN);
    const ridgeMat = new THREE.MeshStandardMaterial({ color: 0x1c2a48, roughness: 0.9, flatShading: true });
    const ridges = new THREE.Group();
    for (const side of [-1, 1]) {
      const r = new THREE.Mesh(ridgeGeo, ridgeMat);
      r.position.set(side * 70, -8, 0);
      r.castShadow = true;
      r.receiveShadow = true;
      ridges.add(r);
    }
    group.add(ridges);
    group.position.z = -i * TILE_LEN;
    world.scene.add(group);
    world.terrain.push({ group, ground, ridge: { material: ridgeMat }, speedZ: 0 });
  }
}

// Moves the ground tiles by dz. The sign follows the ship's flow, so tiles recycle in both directions (U-turns).
function scrollTerrain(dz) {
  const span = TILE_LEN * TILE_COUNT;
  for (const t of world.terrain) {
    t.group.position.z += dz;
    // Recycle only when a tile is far behind the ship in either direction, so ground covers both ways.
    if (t.group.position.z > 150) t.group.position.z -= span;
    else if (t.group.position.z < -270) t.group.position.z += span;
  }
}

// Particle system: one shared pool of points with per-particle velocity, colour and life.
const POOL = 900;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(POOL * 3);
const pCol = new Float32Array(POOL * 3);
const pAlive = new Float32Array(POOL);
const pVel = new Float32Array(POOL * 3);
const pLife = new Float32Array(POOL);
const pMaxLife = new Float32Array(POOL);
let pHead = 0;

function initParticles() {
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
  const mat = new THREE.PointsMaterial({ size: 0.45, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true });
  const points = new THREE.Points(pGeo, mat);
  points.frustumCulled = false;
  world.scene.add(points);
  world.particles = points;
}

function spawnParticle(x, y, z, vx, vy, vz, r, g, b, life) {
  const i = pHead;
  pHead = (pHead + 1) % POOL;
  pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
  pVel[i * 3] = vx; pVel[i * 3 + 1] = vy; pVel[i * 3 + 2] = vz;
  pCol[i * 3] = r; pCol[i * 3 + 1] = g; pCol[i * 3 + 2] = b;
  pLife[i] = life;
  pMaxLife[i] = life;
  pAlive[i] = 1;
}

function burst(x, y, z, count, color, speed = 12, life = 0.7) {
  const r = ((color >> 16) & 255) / 255;
  const g = ((color >> 8) & 255) / 255;
  const b = (color & 255) / 255;
  for (let k = 0; k < count; k++) {
    const a = Math.random() * Math.PI * 2;
    const e = (Math.random() - 0.5) * Math.PI;
    const s = speed * (0.3 + Math.random() * 0.7);
    spawnParticle(x, y, z, Math.cos(a) * Math.cos(e) * s, Math.sin(e) * s, Math.sin(a) * Math.cos(e) * s, r, g, b, life * (0.6 + Math.random() * 0.6));
  }
}

function updateParticles(dt) {
  for (let i = 0; i < POOL; i++) {
    if (!pAlive[i]) continue;
    pLife[i] -= dt;
    if (pLife[i] <= 0) {
      pAlive[i] = 0;
      pPos[i * 3 + 1] = -9999;
      continue;
    }
    const drag = Math.exp(-2.2 * dt);
    pVel[i * 3] *= drag; pVel[i * 3 + 1] *= drag; pVel[i * 3 + 2] *= drag;
    pPos[i * 3] += pVel[i * 3] * dt;
    pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt;
    pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
    // Fade by scaling colour with remaining life (additive blending makes black invisible).
    const fade = 1 - dt * 1.5;
    pCol[i * 3] *= fade;
    pCol[i * 3 + 1] *= fade;
    pCol[i * 3 + 2] *= fade;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

function clearParticles() {
  for (let i = 0; i < POOL; i++) {
    pAlive[i] = 0;
    pPos[i * 3 + 1] = -9999;
  }
  pGeo.attributes.position.needsUpdate = true;
}

function addShake(amount) {
  world.shake = Math.min(1.5, world.shake + amount);
}

// ---- audio.js ----
// Procedural audio via WebAudio: no sound files are shipped, every effect is synthesised.

let ctx = null;
let master = null;
let musicGain = null;
let sfxGain = null;
let musicTimer = null;
let musicStep = 0;
let musicOn = false;

function ensure() {
  if (ctx) return ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  ctx = new AC();
  master = ctx.createGain();
  master.gain.value = 0.8;
  master.connect(ctx.destination);
  musicGain = ctx.createGain();
  musicGain.gain.value = 0.22;
  musicGain.connect(master);
  sfxGain = ctx.createGain();
  sfxGain.gain.value = 0.5;
  sfxGain.connect(master);
  return ctx;
}

function unlockAudio() {
  const c = ensure();
  if (c && c.state === 'suspended') c.resume();
}

function tone({ freq = 440, type = 'square', dur = 0.12, vol = 0.3, slideTo = null, when = 0, dest = null }) {
  const c = ensure();
  if (!c) return;
  const t = c.currentTime + when;
  const osc = c.createOscillator();
  const g = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g);
  g.connect(dest || sfxGain);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

function noise({ dur = 0.2, vol = 0.3, when = 0, cutoff = 2000 }) {
  const c = ensure();
  if (!c) return;
  const t = c.currentTime + when;
  const len = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = c.createBufferSource();
  src.buffer = buf;
  const filter = c.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = cutoff;
  const g = c.createGain();
  g.gain.value = vol;
  src.connect(filter);
  filter.connect(g);
  g.connect(sfxGain);
  src.start(t);
}

const SFX = {
  laser() { tone({ freq: 980, slideTo: 420, type: 'square', dur: 0.09, vol: 0.12 }); },
  lockOn() { tone({ freq: 1400, type: 'triangle', dur: 0.05, vol: 0.18 }); },
  lockFire() { tone({ freq: 700, slideTo: 1500, type: 'sawtooth', dur: 0.2, vol: 0.2 }); },
  hit() { noise({ dur: 0.12, vol: 0.25, cutoff: 1400 }); },
  explode() { noise({ dur: 0.55, vol: 0.5, cutoff: 900 }); tone({ freq: 120, slideTo: 40, type: 'sine', dur: 0.5, vol: 0.4 }); },
  bigExplode() { noise({ dur: 1.4, vol: 0.7, cutoff: 700 }); tone({ freq: 90, slideTo: 25, type: 'sine', dur: 1.2, vol: 0.6 }); },
  bomb() { tone({ freq: 60, slideTo: 30, type: 'sine', dur: 0.9, vol: 0.6 }); noise({ dur: 0.9, vol: 0.5, cutoff: 500 }); },
  pickup() { tone({ freq: 660, type: 'triangle', dur: 0.1, vol: 0.25 }); tone({ freq: 990, type: 'triangle', dur: 0.14, vol: 0.25, when: 0.08 }); },
  barrel() { tone({ freq: 300, slideTo: 900, type: 'sawtooth', dur: 0.35, vol: 0.18 }); },
  uturn() { tone({ freq: 200, slideTo: 800, type: 'sawtooth', dur: 0.6, vol: 0.15 }); },
  boost() { noise({ dur: 0.4, vol: 0.18, cutoff: 3000 }); },
  warning() { tone({ freq: 880, type: 'square', dur: 0.16, vol: 0.18 }); tone({ freq: 880, type: 'square', dur: 0.16, vol: 0.18, when: 0.25 }); },
  menu() { tone({ freq: 520, type: 'triangle', dur: 0.06, vol: 0.2 }); },
  select() { tone({ freq: 740, type: 'triangle', dur: 0.1, vol: 0.22 }); tone({ freq: 1110, type: 'triangle', dur: 0.12, vol: 0.22, when: 0.07 }); },
  back() { tone({ freq: 440, slideTo: 220, type: 'triangle', dur: 0.12, vol: 0.2 }); },
  medal() { [523, 659, 784, 1046].forEach((f, i) => tone({ freq: f, type: 'triangle', dur: 0.2, vol: 0.22, when: i * 0.12 })); },
  fanfare() { [392, 523, 659, 784].forEach((f, i) => tone({ freq: f, type: 'square', dur: 0.25, vol: 0.14, when: i * 0.18 })); },
};

function sfx(name) {
  if (SFX[name]) SFX[name]();
}

// Simple looping chiptune-style bed: a bass pulse with an arpeggio over it.
const CHORDS = [
  [220, 261.6, 329.6], [174.6, 220, 261.6], [196, 246.9, 293.7], [164.8, 196, 246.9],
];

function musicBeat() {
  const c = ensure();
  if (!c || !musicOn) return;
  const bar = Math.floor(musicStep / 16) % CHORDS.length;
  const chord = CHORDS[bar];
  const step = musicStep % 16;
  if (step % 4 === 0) tone({ freq: chord[0] / 2, type: 'triangle', dur: 0.35, vol: 0.5, dest: musicGain });
  const arp = chord[step % 3];
  tone({ freq: arp * 2, type: 'square', dur: 0.1, vol: 0.12, dest: musicGain });
  musicStep++;
}

function startMusic(bpm = 118) {
  ensure();
  if (musicOn) return;
  musicOn = true;
  musicStep = 0;
  const interval = (60 / bpm) / 4 * 1000;
  musicBeat();
  musicTimer = setInterval(musicBeat, interval);
}

function stopMusic() {
  musicOn = false;
  if (musicTimer) clearInterval(musicTimer);
  musicTimer = null;
}

function setVolumes({ music = 0.22, sfxLevel = 0.5 } = {}) {
  ensure();
  if (musicGain) musicGain.gain.value = music;
  if (sfxGain) sfxGain.gain.value = sfxLevel;
}

// ---- input.js ----
// Input layer: keyboard + standard gamepad (PS5 mapping) unified into one "actions" snapshot.
// Gamepad axes can be intermittently inverted on some setups, so invertX / invertY are user toggles.

const DEADZONE = 0.18;

const KEYMAP = {
  left: ['ArrowLeft', 'KeyA'],
  right: ['ArrowRight', 'KeyD'],
  up: ['ArrowUp', 'KeyW'],
  down: ['ArrowDown', 'KeyS'],
  fire: ['KeyJ', 'Space'],
  bomb: ['KeyK', 'ShiftLeft', 'ShiftRight'],
  barrel: ['KeyL', 'KeyE'],
  boost: ['KeyI', 'KeyQ'],
  brake: ['KeyO', 'KeyF'],
  uturn: ['KeyU', 'KeyC'],
  lock: ['KeyH', 'ControlLeft'],
  pause: ['Escape', 'KeyP', 'Enter'],
  confirm: ['Enter', 'Space', 'KeyJ'],
  back: ['Escape', 'Backspace', 'KeyX'],
  camera: ['KeyV', 'Tab'],
};

// Standard mapping indices: 0 cross, 1 circle, 2 square, 3 triangle, 4/5 L1/R1, 6/7 L2/R2,
// 8 share, 9 options, 10 L3, 11 R3, 12-15 dpad.
const PAD_MAP = {
  confirm: [0],
  back: [1],
  fire: [0],
  bomb: [2],
  barrel: [4, 5],
  boost: [7],
  brake: [6],
  uturn: [3],
  lock: [1],
  pause: [9],
  camera: [8],
  dpadLeft: [14],
  dpadRight: [15],
  dpadUp: [12],
  dpadDown: [13],
};

const keys = new Set();
const pressedThisFrame = new Set();
const prevPad = {};
const padPressed = new Set();

const settings = {
  invertX: false,
  invertY: false,
  sensitivity: 1.0,
  showHints: true,
  subtitles: true,
  screenShake: true,
  ...loadSettings(),
};

function loadSettings() {
  try {
    const raw = localStorage.getItem('starfowl64.settings');
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveSettings() {
  try {
    localStorage.setItem('starfowl64.settings', JSON.stringify({
      invertX: settings.invertX,
      invertY: settings.invertY,
      sensitivity: settings.sensitivity,
      showHints: settings.showHints,
      subtitles: settings.subtitles,
      screenShake: settings.screenShake,
    }));
  } catch (e) { /* storage unavailable: settings live for this session only */ }
}

// Mouse movement and clicks count as activity for the idle/attract timer, but are not game controls.
let mouseActivity = false;

function initInput() {
  window.addEventListener('keydown', (e) => {
    if (!keys.has(e.code)) pressedThisFrame.add(e.code);
    keys.add(e.code);
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => keys.delete(e.code));
  window.addEventListener('blur', () => keys.clear());
  window.addEventListener('mousedown', () => { mouseActivity = true; });
  window.addEventListener('mousemove', () => { mouseActivity = true; });
  window.addEventListener('wheel', () => { mouseActivity = true; });
}

function keyDown(action) {
  return KEYMAP[action].some((k) => keys.has(k));
}

function keyPressed(action) {
  return KEYMAP[action].some((k) => pressedThisFrame.has(k));
}

function padButton(indices) {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const pad of pads) {
    if (!pad) continue;
    for (const i of indices) {
      if (pad.buttons[i] && pad.buttons[i].pressed) return true;
    }
  }
  return false;
}

function padAxis(axisIndex) {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let best = 0;
  for (const pad of pads) {
    if (!pad) continue;
    const v = pad.axes[axisIndex] || 0;
    if (Math.abs(v) > Math.abs(best)) best = v;
  }
  if (Math.abs(best) < DEADZONE) return 0;
  const scaled = (Math.abs(best) - DEADZONE) / (1 - DEADZONE);
  return Math.sign(best) * scaled;
}

function padPressedThisFrame(indices) {
  const id = indices.join(',');
  const down = padButton(indices);
  const was = prevPad[id] || false;
  prevPad[id] = down;
  return down && !was;
}

// Snapshot of the current frame. Call once per frame, then read the fields.
function readInput() {
  // Browser stick axes: left is negative, up is negative. Normalise so +x = right, +y = up.
  // Mouse activity is consumed here so the idle timer sees each movement once.
  const mouseNow = mouseActivity;
  mouseActivity = false;
  // User invert toggles apply to the stick only, so keyboard and d-pad keep their meaning.
  const stickX = settings.invertX ? -padAxis(0) : padAxis(0);
  const stickY = settings.invertY ? padAxis(1) : -padAxis(1);
  const kx = (keyDown('right') ? 1 : 0) - (keyDown('left') ? 1 : 0);
  const ky = (keyDown('up') ? 1 : 0) - (keyDown('down') ? 1 : 0);

  let x = Math.abs(stickX) > Math.abs(kx) ? stickX : kx;
  let y = Math.abs(stickY) > Math.abs(ky) ? stickY : ky;
  if (padButton(PAD_MAP.dpadLeft)) x = -1;
  if (padButton(PAD_MAP.dpadRight)) x = 1;
  if (padButton(PAD_MAP.dpadUp)) y = 1;
  if (padButton(PAD_MAP.dpadDown)) y = -1;


  // Both sources are evaluated every frame so the pad's edge memory never goes stale.
  const pressedNow = (name, padIdx) => {
    const k = keyPressed(name);
    const p = padPressedThisFrame(padIdx);
    return k || p;
  };

  return {
    x: Math.max(-1, Math.min(1, x)),
    y: Math.max(-1, Math.min(1, y)),
    fire: keyDown('fire') || padButton(PAD_MAP.fire),
    bomb: keyDown('bomb') || padButton(PAD_MAP.bomb),
    barrel: keyDown('barrel') || padButton(PAD_MAP.barrel),
    boost: keyDown('boost') || padButton(PAD_MAP.boost),
    brake: keyDown('brake') || padButton(PAD_MAP.brake),
    uturn: keyDown('uturn') || padButton(PAD_MAP.uturn),
    lock: keyDown('lock') || padButton(PAD_MAP.lock),
    camera: keyDown('camera') || padButton(PAD_MAP.camera),
    pausePressed: pressedNow('pause', PAD_MAP.pause),
    confirmPressed: pressedNow('confirm', PAD_MAP.confirm),
    backPressed: pressedNow('back', PAD_MAP.back),
    upPressed: pressedNow('up', PAD_MAP.dpadUp),
    downPressed: pressedNow('down', PAD_MAP.dpadDown),
    leftPressed: pressedNow('left', PAD_MAP.dpadLeft),
    rightPressed: pressedNow('right', PAD_MAP.dpadRight),
    anyPressed: pressedThisFrame.size > 0 || padAnyPressed(),
    // Anything held or moved this frame: used to reset the idle timer and leave attract mode.
    anyActive: keys.size > 0 || padAnyPressed() || Math.abs(x) > 0 || Math.abs(y) > 0 || mouseNow,
  };
}

function padAnyPressed() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const pad of pads) {
    if (!pad) continue;
    for (const b of pad.buttons) if (b.pressed) return true;
  }
  return false;
}

// Call at the end of each frame so "pressed this frame" edges reset.
function endInputFrame() {
  pressedThisFrame.clear();
}

function hasGamepad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  return Array.from(pads).some(Boolean);
}

// ---- entities.js ----
// Enemies, projectiles and pickups. Everything lives in world space; the ship only moves in x/y.
// Ship facing is +1 (flying into -z) or -1 after a U-turn; `flow` is the signed scroll speed.

const enemies = [];
const enemyShots = [];
const playerShots = [];
const missiles = [];
const pickups = [];
const events = { kills: 0, bossDown: false };

const geo = {};
const mat = {};

function G() {
  if (geo.box) return;
  geo.box = new THREE.BoxGeometry(1, 1, 1);
  geo.cone = new THREE.ConeGeometry(0.5, 1, 6);
  geo.sphere = new THREE.SphereGeometry(0.5, 12, 8);
  geo.torus = new THREE.TorusGeometry(0.9, 0.12, 8, 24);
  geo.octa = new THREE.OctahedronGeometry(0.6, 0);
  mat.venom = new THREE.MeshStandardMaterial({ color: 0x6b1d2e, metalness: 0.4, roughness: 0.5, flatShading: true });
  mat.venomGlow = new THREE.MeshStandardMaterial({ color: 0xff3355, emissive: 0xff2244, emissiveIntensity: 1.5 });
  mat.steel = new THREE.MeshStandardMaterial({ color: 0x5a6a80, metalness: 0.7, roughness: 0.35, flatShading: true });
  mat.steelDark = new THREE.MeshStandardMaterial({ color: 0x2a3446, metalness: 0.8, roughness: 0.4, flatShading: true });
  mat.bossGlow = new THREE.MeshStandardMaterial({ color: 0xff8844, emissive: 0xff6622, emissiveIntensity: 2 });
  mat.shotEnemy = new THREE.MeshBasicMaterial({ color: 0xff5566 });
  mat.shotPlayer = new THREE.MeshBasicMaterial({ color: 0x66ffcc });
  mat.missile = new THREE.MeshBasicMaterial({ color: 0xffe066 });
  mat.ring = new THREE.MeshStandardMaterial({ color: 0xffd34d, emissive: 0xffaa00, emissiveIntensity: 1.2, metalness: 0.6, roughness: 0.2 });
  mat.bomb = new THREE.MeshStandardMaterial({ color: 0x44ffaa, emissive: 0x22ff88, emissiveIntensity: 1.4 });
  mat.shield = new THREE.MeshStandardMaterial({ color: 0x66aaff, emissive: 0x3366ff, emissiveIntensity: 1.4 });
}

function makeFighter() {
  G();
  const g = new THREE.Group();
  const body = new THREE.Mesh(geo.cone, mat.venom);
  body.rotation.x = Math.PI / 2;
  body.scale.set(1.4, 2.2, 1.4);
  g.add(body);
  for (const s of [-1, 1]) {
    const wing = new THREE.Mesh(geo.box, mat.venom);
    wing.scale.set(2.8, 0.12, 1.1);
    wing.position.set(s * 1.4, 0, 0.2);
    wing.rotation.z = s * 0.25;
    g.add(wing);
    const tip = new THREE.Mesh(geo.sphere, mat.venomGlow);
    tip.scale.setScalar(0.22);
    tip.position.set(s * 2.7, 0, 0.2);
    g.add(tip);
  }
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

function makeInterceptor() {
  G();
  const g = new THREE.Group();
  const body = new THREE.Mesh(geo.box, mat.steel);
  body.scale.set(0.9, 0.6, 2.4);
  g.add(body);
  const nose = new THREE.Mesh(geo.cone, mat.steelDark);
  nose.rotation.x = Math.PI / 2;
  nose.position.z = 1.8;
  nose.scale.set(0.8, 1.4, 0.8);
  g.add(nose);
  for (const s of [-1, 1]) {
    const fin = new THREE.Mesh(geo.box, mat.steelDark);
    fin.scale.set(1.8, 0.08, 0.9);
    fin.position.set(s * 1.1, 0, -0.5);
    g.add(fin);
  }
  const eye = new THREE.Mesh(geo.sphere, mat.venomGlow);
  eye.scale.setScalar(0.3);
  eye.position.z = 1.1;
  g.add(eye);
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

function makeTurret() {
  G();
  const g = new THREE.Group();
  const base = new THREE.Mesh(geo.box, mat.steelDark);
  base.scale.set(2.2, 1, 2.2);
  g.add(base);
  const dome = new THREE.Mesh(geo.sphere, mat.steel);
  dome.scale.setScalar(1.2);
  dome.position.y = 0.6;
  g.add(dome);
  const barrel = new THREE.Mesh(geo.box, mat.steelDark);
  barrel.scale.set(0.3, 0.3, 1.8);
  barrel.position.set(0, 1.1, 0.7);
  g.add(barrel);
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

function makeStriker() {
  G();
  const g = new THREE.Group();
  const hull = new THREE.Mesh(geo.box, mat.steel);
  hull.scale.set(5, 2.4, 9);
  g.add(hull);
  const bridge = new THREE.Mesh(geo.box, mat.steelDark);
  bridge.scale.set(2, 1.4, 2.4);
  bridge.position.set(0, 1.8, -1.5);
  g.add(bridge);
  for (const s of [-1, 1]) {
    const pod = new THREE.Mesh(geo.box, mat.steelDark);
    pod.scale.set(1.1, 1.1, 6);
    pod.position.set(s * 4, -0.2, 0);
    g.add(pod);
    const eng = new THREE.Mesh(geo.sphere, mat.bossGlow);
    eng.scale.set(0.9, 0.9, 0.5);
    eng.position.set(s * 4, -0.2, -3.2);
    g.add(eng);
  }
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

function makeWarden() {
  G();
  const g = new THREE.Group();
  const core = new THREE.Mesh(geo.box, mat.steelDark);
  core.scale.set(7, 3.4, 12);
  g.add(core);
  const crown = new THREE.Mesh(geo.octa, mat.bossGlow);
  crown.scale.set(3, 3, 3);
  crown.position.set(0, 3.2, 0);
  g.add(crown);
  for (const s of [-1, 1]) {
    const arm = new THREE.Mesh(geo.box, mat.steel);
    arm.scale.set(6, 1.6, 4);
    arm.position.set(s * 8, 0, 2);
    arm.rotation.z = s * 0.2;
    g.add(arm);
    const cannon = new THREE.Mesh(geo.sphere, mat.bossGlow);
    cannon.scale.setScalar(1.3);
    cannon.position.set(s * 8, 0, 5);
    g.add(cannon);
  }
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

const BUILDERS = {
  fighter: makeFighter,
  interceptor: makeInterceptor,
  turret: makeTurret,
  striker: makeStriker,
  warden: makeWarden,
};

const STATS = {
  fighter: { hp: 1, radius: 2.2, score: 150, lockable: true },
  interceptor: { hp: 2, radius: 2.0, score: 300, lockable: true },
  turret: { hp: 2, radius: 2.2, score: 200, lockable: true },
  striker: { hp: 8, radius: 5.0, score: 1200, lockable: true },
  warden: { hp: 90, radius: 9.0, score: 15000, lockable: true, boss: true },
};

function spawnEnemy(type, x, y, z, extra = {}) {
  const s = STATS[type];
  const mesh = BUILDERS[type]();
  mesh.position.set(x, y, z);
  world.scene.add(mesh);
  const e = {
    type,
    mesh,
    x, y, z,
    vx: 0, vy: 0, vz: 0,
    hp: s.hp,
    maxHp: s.hp,
    radius: s.radius,
    score: s.score,
    lockable: s.lockable,
    boss: !!s.boss,
    t: 0,
    fireT: 1 + Math.random() * 1.5,
    baseX: x,
    baseY: y,
    phase: Math.random() * Math.PI * 2,
    alive: true,
    hitFlash: 0,
    ...extra,
  };
  enemies.push(e);
  return e;
}

function removeEnemy(e) {
  e.alive = false;
  world.scene.remove(e.mesh);
}

function fireEnemyShot(e, px, py, pz, speed, dmg = 1, spread = 0) {
  const dx = px - e.x;
  const dy = py - e.y;
  const dz = pz - e.z;
  const len = Math.hypot(dx, dy, dz) || 1;
  const sx = (dx / len) * speed + (spread ? (Math.random() - 0.5) * spread : 0);
  const sy = (dy / len) * speed + (spread ? (Math.random() - 0.5) * spread : 0);
  const sz = (dz / len) * speed;
  const m = new THREE.Mesh(geo.sphere, mat.shotEnemy);
  m.scale.setScalar(0.5);
  m.position.set(e.x, e.y, e.z);
  world.scene.add(m);
  enemyShots.push({ mesh: m, x: e.x, y: e.y, z: e.z, vx: sx, vy: sy, vz: sz, life: 5, dmg, radius: 0.9 });
}

// Returns the shot so callers (wingmen) can tag it. Only the player's own shots count toward accuracy.
function firePlayerShot(x, y, z, facing, owner = 'player') {
  const m = new THREE.Mesh(geo.box, mat.shotPlayer);
  m.scale.set(0.12, 0.12, 2.2);
  m.position.set(x, y, z);
  world.scene.add(m);
  const shot = { mesh: m, x, y, z, vx: 0, vy: 0, vz: -facing * 140, life: 1.2, owner };
  playerShots.push(shot);
  return shot;
}

function fireMissile(x, y, z, target, facing) {
  const m = new THREE.Mesh(geo.octa, mat.missile);
  m.scale.setScalar(0.35);
  m.position.set(x, y, z);
  world.scene.add(m);
  missiles.push({ mesh: m, x, y, z, vx: 0, vy: 40, vz: -facing * 60, target, life: 3.5, facing });
}

function spawnPickup(kind, x, y, z) {
  const color = kind === 'bomb' ? mat.bomb : kind === 'shield' ? mat.shield : mat.ring;
  const m = new THREE.Mesh(kind === 'ring' ? geo.torus : geo.octa, color);
  m.scale.setScalar(kind === 'ring' ? 1 : 0.9);
  m.position.set(x, y, z);
  world.scene.add(m);
  pickups.push({ kind, mesh: m, x, y, z, t: Math.random() * 6, radius: 2.2 });
}

function clearAll() {
  for (const list of [enemies, enemyShots, playerShots, missiles, pickups]) {
    for (const o of list) world.scene.remove(o.mesh);
    list.length = 0;
  }
  events.kills = 0;
  events.bossDown = false;
}

// Advances enemies. `flow` is the signed scroll speed; `target` is the player's current position.
function updateEnemies(dt, flow, target, facing) {
  // Enemy AI uses the ship's facing for its own bullet direction and pass-by removal.
  for (const e of enemies) {
    if (!e.alive) continue;
    e.t += dt;
    e.hitFlash = Math.max(0, e.hitFlash - dt * 4);
    e.z += flow * dt;

    if (e.type === 'fighter') {
      e.x = e.baseX + Math.sin(e.t * 1.6 + e.phase) * 5;
      e.y = e.baseY + Math.sin(e.t * 2.4 + e.phase) * 0.8;
      e.z += e.vz * dt;
      e.fireT -= dt;
      if (e.fireT <= 0 && Math.abs(e.z) < 160) {
        fireEnemyShot(e, target.x, target.y, target.z, 46);
        e.fireT = 2.4;
      }
    } else if (e.type === 'interceptor') {
      const dx = target.x - e.x;
      const dy = target.y - e.y;
      e.x += Math.sign(dx) * Math.min(Math.abs(dx), 14 * dt);
      e.y += Math.sign(dy) * Math.min(Math.abs(dy), 10 * dt);
      e.z += (e.vz || 0) * dt;
      e.vz = Math.min(e.vz + 20 * dt, 30);
      e.fireT -= dt;
      if (e.fireT <= 0 && Math.abs(e.z) < 120) {
        fireEnemyShot(e, target.x, target.y, target.z, 55);
        e.fireT = 2.0;
      }
    } else if (e.type === 'turret') {
      e.fireT -= dt;
      if (e.fireT <= 0 && Math.abs(e.z) < 150) {
        fireEnemyShot(e, target.x, target.y, target.z, 38, 1, 2);
        e.fireT = 1.9;
      }
    } else if (e.type === 'striker') {
      e.x = e.baseX + Math.sin(e.t * 0.7 + e.phase) * 3;
      e.fireT -= dt;
      if (e.fireT <= 0 && Math.abs(e.z) < 170) {
        for (let k = -1; k <= 1; k++) {
          fireEnemyShot(e, target.x + k * 3, target.y, target.z, 42);
        }
        e.fireT = 3.2;
      }
    } else if (e.type === 'warden') {
      // Hovers at a fixed range ahead of the ship, cancelling the scroll.
      e.z += (-facing * 130 - e.z) * Math.min(1, dt * 0.8);
      e.x = Math.sin(e.t * 0.5) * 6;
      e.y = 4 + Math.sin(e.t * 0.9) * 1.2;
      const frac = e.hp / e.maxHp;
      const rate = frac > 0.66 ? 2.2 : frac > 0.33 ? 1.4 : 0.9;
      e.fireT -= dt;
      if (e.fireT <= 0) {
        const count = frac > 0.33 ? 5 : 7;
        for (let k = 0; k < count; k++) {
          const off = (k - (count - 1) / 2) * 2.5;
          fireEnemyShot(e, target.x + off, target.y, target.z, 48, 1, 1);
        }
        e.fireT = rate;
      }
    }

    e.mesh.position.set(e.x, e.y, e.z);
    if (e.type === 'fighter') {
      e.mesh.rotation.set(0, 0, Math.cos(e.t * 1.6 + e.phase) * 0.35);
    } else if (e.type === 'interceptor') {
      e.mesh.lookAt(target.x, target.y, target.z);
    } else if (e.type === 'warden') {
      e.mesh.rotation.z = Math.sin(e.t * 0.5) * 0.08;
    }
    if (e.hitFlash > 0) {
      e.mesh.scale.setScalar(1 + e.hitFlash * 0.05);
    } else {
      e.mesh.scale.setScalar(1);
    }

    // Passed the ship (relative to facing) or left the draw distance: remove.
    if (e.z * facing > 40 || Math.abs(e.z) > 380) {
      removeEnemy(e);
    }
  }
  compact(enemies);
}

function damageEnemy(e, dmg) {
  if (!e.alive) return false;
  e.hp -= dmg;
  e.hitFlash = 1;
  if (e.hp <= 0) {
    destroyEnemy(e);
    return true;
  }
  return false;
}

function destroyEnemy(e) {
  if (!e.alive) return;
  removeEnemy(e);
  events.kills++;
  const big = e.boss || e.type === 'striker';
  burst(e.x, e.y, e.z, big ? 90 : 36, e.type === 'turret' ? 0xffaa55 : 0xff7744, big ? 30 : 16, big ? 1.8 : 0.9);
  addShake(big ? 1.2 : 0.4);
  sfx(big ? 'bigExplode' : 'explode');
  if (e.boss) events.bossDown = true;
  if (e.type !== 'warden' && Math.random() < 0.12) spawnPickup(Math.random() < 0.5 ? 'ring' : 'bomb', e.x, e.y, e.z);
  if (e.type === 'striker' && Math.random() < 0.5) spawnPickup('shield', e.x, e.y, e.z);
}

// Moves shots, removes expired ones, and returns nothing; collisions are resolved by game.js.
function updateProjectiles(dt, flow) {
  for (const s of enemyShots) {
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    // Enemy shots live in world space: their velocity was aimed at the ship's z, so no scroll is added.
    s.z += s.vz * dt;
    s.life -= dt;
    s.mesh.position.set(s.x, s.y, s.z);
    if (s.life <= 0) { world.scene.remove(s.mesh); s.dead = true; }
  }
  compact(enemyShots);

  for (const s of playerShots) {
    s.z += s.vz * dt;
    s.life -= dt;
    s.mesh.position.set(s.x, s.y, s.z);
    if (s.life <= 0) { world.scene.remove(s.mesh); s.dead = true; }
  }
  compact(playerShots);

  for (const m of missiles) {
    const t = m.target;
    if (t && t.alive) {
      const dx = t.x - m.x;
      const dy = t.y - m.y;
      const dz = t.z - m.z;
      const len = Math.hypot(dx, dy, dz) || 1;
      const turn = 9 * dt;
      m.vx += (dx / len * 70 - m.vx) * Math.min(1, turn);
      m.vy += (dy / len * 70 - m.vy) * Math.min(1, turn);
      m.vz += (dz / len * 70 - m.vz) * Math.min(1, turn);
    }
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    m.z += m.vz * dt;
    m.life -= dt;
    m.mesh.position.set(m.x, m.y, m.z);
    m.mesh.rotation.x += dt * 10;
    if (m.life <= 0) { world.scene.remove(m.mesh); m.dead = true; }
  }
  compact(missiles);

  for (const p of pickups) {
    p.z += flow * dt;
    p.t += dt;
    p.mesh.position.set(p.x, p.y + Math.sin(p.t * 2) * 0.4, p.z);
    p.mesh.rotation.y += dt * 2;
    if (Math.abs(p.z) > 260) { world.scene.remove(p.mesh); p.dead = true; }
  }
  compact(pickups);
}

// Takes a shot, missile or pickup out of play and off the scene.
function retire(o) {
  world.scene.remove(o.mesh);
  o.dead = true;
}

function compact(list) {
  let w = 0;
  for (let r = 0; r < list.length; r++) {
    if (!list[r].dead && list[r].alive !== false) list[w++] = list[r];
  }
  list.length = w;
}

// ---- player.js ----
// The Arwing: flight model, barrel roll, U-turn, boost/brake, lasers, lock-on and shield.

const BASE_SPEED = 38;
const BOOST_MULT = 1.65;
const BRAKE_MULT = 0.45;
const MAX_LOCKS = 6;
const LOCK_TIME = 0.42;
const ROLL_TIME = 0.7;
const UTURN_TIME = 1.2;
const FIRE_INTERVAL = 0.11;
const BOUNDS = { minX: -9, maxX: 9, minY: -1.5, maxY: 7 };
const MAX_SHIELD = 100;

const player = {
  x: 0,
  y: 2.5,
  vx: 0,
  vy: 0,
  shield: MAX_SHIELD,
  bombs: 3,
  maxBombs: 5,
  invuln: 0,
  dead: false,
  godMode: false,
  speed: 0,
  flow: BASE_SPEED,
  facing: 1,
  turnAngle: 0,
  roll: { active: false, t: 0 },
  uturn: { active: false, t: 0, start: 0 },
  locks: [],
  lockProgress: new Map(),
  lockWasHeld: false,
  fireT: 0,
  fireSide: 1,
  root: null,
  body: null,
  wingLeft: null,
  wingRight: null,
  prevBomb: false,
  prevRoll: false,
  prevUturn: false,
  stats: { shotsFired: 0, shotsHit: 0, deflects: 0, rolls: 0, uturns: 0, missiles: 0 },
};

let engineGlows = [];

function buildArwing(scene) {
  const root = new THREE.Group();
  const body = new THREE.Group();
  root.add(body);

  const hullMat = new THREE.MeshStandardMaterial({ color: 0xd8dde8, metalness: 0.5, roughness: 0.35, flatShading: true });
  const accentMat = new THREE.MeshStandardMaterial({ color: 0x2e62c8, metalness: 0.5, roughness: 0.4, flatShading: true });
  const canopyMat = new THREE.MeshStandardMaterial({ color: 0x66d8ff, metalness: 0.2, roughness: 0.05, transparent: true, opacity: 0.8, emissive: 0x114466, emissiveIntensity: 0.4 });
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x66ffee });

  const fuselage = new THREE.Mesh(new THREE.ConeGeometry(0.55, 4.6, 8), hullMat);
  fuselage.rotation.x = -Math.PI / 2;
  fuselage.castShadow = true;
  body.add(fuselage);

  const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 8), canopyMat);
  canopy.scale.set(0.9, 0.5, 1.6);
  canopy.position.set(0, 0.35, -0.6);
  body.add(canopy);

  const wingGeo = new THREE.BoxGeometry(3.6, 0.1, 2.2);
  for (const s of [-1, 1]) {
    const wing = new THREE.Mesh(wingGeo, hullMat);
    wing.position.set(s * 1.9, 0, 0.6);
    wing.rotation.z = s * -0.12;
    wing.rotation.y = s * 0.3;
    wing.castShadow = true;
    body.add(wing);
    if (s < 0) player.wingLeft = wing; else player.wingRight = wing;

    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.3, 1.2), accentMat);
    tail.position.set(s * 1.1, 0.7, 1.3);
    tail.rotation.z = s * 0.35;
    tail.castShadow = true;
    body.add(tail);

    const engine = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), glowMat);
    engine.position.set(s * 0.8, -0.05, 1.5);
    body.add(engine);
    engineGlows.push(engine);
  }

  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.12, 3.2), accentMat);
  stripe.position.set(0, 0.36, 0.2);
  body.add(stripe);

  root.position.set(0, 2.5, 0);
  root.rotation.order = 'YXZ';
  scene.add(root);
  player.root = root;
  player.body = body;
  return root;
}

function inBounds(x, y) {
  return { x: Math.max(BOUNDS.minX, Math.min(BOUNDS.maxX, x)), y: Math.max(BOUNDS.minY, Math.min(BOUNDS.maxY, y)) };
}

// Lock candidates are enemies in front of the ship (relative to facing) and inside the screen cone.
function inLockCone(e) {
  const ahead = -e.z * player.facing;
  if (ahead < -10 || ahead > 260) return false;
  const v = new THREE.Vector3(e.x, e.y, e.z).project(world.camera);
  return Math.abs(v.x) < 0.7 && Math.abs(v.y) < 0.65 && v.z < 1;
}

// Advances the Arwing for one frame. Returns a list of events for game.js to resolve.
function updatePlayer(dt, input, stageSpeedMult = 1) {
  const events = [];
  if (player.dead) return events;

  player.invuln = Math.max(0, player.invuln - dt);

  // Flight input: stick/keys move the ship in the view plane. Speed scales with boost/brake.
  const sens = settings.sensitivity;
  const sx = input.x * 15 * sens * dt;
  const sy = input.y * 11 * sens * dt;
  const next = inBounds(player.x + sx, player.y + sy);
  player.vx = (next.x - player.x) / Math.max(dt, 1e-4);
  player.vy = (next.y - player.y) / Math.max(dt, 1e-4);
  player.x = next.x;
  player.y = next.y;

  // Barrel roll: edge-triggered, deflects enemy shots while active.
  if (input.barrel && !player.prevRoll && !player.roll.active && !player.uturn.active) {
    player.roll = { active: true, t: 0 };
    player.stats.rolls++;
    events.push({ type: 'roll' });
    sfx('barrel');
  }
  player.prevRoll = input.barrel;
  if (player.roll.active) {
    player.roll.t += dt;
    if (player.roll.t >= ROLL_TIME) player.roll.active = false;
  }

  // U-turn: 180 degree turn. Flow slows to zero at the midpoint and reverses.
  if (input.uturn && !player.prevUturn && !player.uturn.active && !player.roll.active) {
    player.uturn = { active: true, t: 0, start: player.turnAngle };
    player.stats.uturns++;
    events.push({ type: 'uturn' });
    sfx('uturn');
  }
  player.prevUturn = input.uturn;
  // turnAngle is 0 (facing +1) or PI (facing -1) between turns; a turn advances it by PI.
  if (player.uturn.active) {
    player.uturn.t += dt;
    const f = Math.min(1, player.uturn.t / UTURN_TIME);
    player.turnAngle = player.uturn.start + f * Math.PI;
    if (f >= 1) {
      player.uturn.active = false;
      player.turnAngle = (player.uturn.start + Math.PI) % (Math.PI * 2);
    }
  }
  // Facing flips when the turn passes 90 degrees.
  const facing = Math.cos(player.turnAngle) >= 0 ? 1 : -1;
  if (facing !== player.facing) {
    player.facing = facing;
    events.push({ type: 'facing', facing });
  }

  // Speed: boost and brake are held; the scroll speed follows the turn angle.
  const mult = input.boost ? BOOST_MULT : input.brake ? BRAKE_MULT : 1;
  const target = BASE_SPEED * mult * stageSpeedMult;
  player.speed += (target - player.speed) * Math.min(1, dt * 4);
  player.flow = player.speed * Math.cos(player.turnAngle);

  // Visual: ship yaw follows the turn, pitch and bank follow the stick, roll adds spin.
  player.root.position.set(player.x, player.y, 0);
  const rollAngle = player.roll.active ? (player.roll.t / ROLL_TIME) * Math.PI * 2 : 0;
  player.root.rotation.set(input.y * 0.12, player.turnAngle, 0);
  player.body.rotation.set(0, 0, -input.x * 0.45 + rollAngle);
  if (player.wingLeft) player.wingLeft.rotation.z = -0.12 - input.x * 0.2;
  if (player.wingRight) player.wingRight.rotation.z = 0.12 + input.x * 0.2;

  // Engine glow flicker and boost trail.
  const glow = input.boost ? 1.4 : 0.8;
  for (const e of engineGlows) e.scale.setScalar(glow + Math.random() * 0.2);
  if (input.boost && Math.random() < 0.6) {
    const s = player.facing;
    spawnParticle(player.x + (Math.random() - 0.5) * 1.2, player.y, 1.5, 0, 0, s * 12, 0.4, 0.9, 1, 0.35);
  }

  // Lasers: held fire, alternating wings. Fire direction follows facing.
  player.fireT -= dt;
  if (input.fire && player.fireT <= 0) {
    player.fireT = FIRE_INTERVAL;
    const side = player.fireSide;
    player.fireSide *= -1;
    firePlayerShot(player.x + side * 1.5, player.y - 0.1, -0.5, player.facing);
    player.stats.shotsFired++;
    events.push({ type: 'fire' });
    sfx('laser');
  }

  updateLocks(dt, input, events);
  player.lockWasHeld = input.lock;

  // Bomb: edge-triggered; game.js applies the effect to the field.
  if (input.bomb && !player.prevBomb && player.bombs > 0) {
    player.bombs--;
    events.push({ type: 'bomb' });
  }
  player.prevBomb = input.bomb;

  return events;
}

// Lock-on: hold to scan. Release to fire homing missiles at every locked target.
function updateLocks(dt, input, events) {
  if (input.lock) {
    for (const e of enemies) {
      if (!e.alive || !e.lockable) continue;
      if (player.locks.find((l) => l.enemy === e)) continue;
      if (!inLockCone(e)) {
        player.lockProgress.delete(e);
        continue;
      }
      const p = (player.lockProgress.get(e) || 0) + dt;
      if (p >= LOCK_TIME && player.locks.length < MAX_LOCKS) {
        player.locks.push({ enemy: e });
        player.lockProgress.delete(e);
        sfx('lockOn');
      } else {
        player.lockProgress.set(e, p);
      }
    }
  }
  // Drop locks on destroyed enemies or ones that drifted out of the cone while held.
  player.locks = player.locks.filter((l) => l.enemy.alive && (input.lock || inLockCone(l.enemy)));

  if (player.lockWasHeld && !input.lock && player.locks.length > 0) {
    let k = 0;
    for (const l of player.locks) {
      if (!l.enemy.alive) continue;
      fireMissile(player.x + (k % 2 ? 1.2 : -1.2), player.y, -0.5, l.enemy, player.facing);
      player.stats.missiles++;
      k++;
    }
    sfx('lockFire');
    events.push({ type: 'missiles', count: k });
    player.locks = [];
  }
}

function damagePlayer(dmg) {
  if (player.dead || player.invuln > 0 || player.godMode) return false;
  player.shield = Math.max(0, player.shield - dmg);
  player.invuln = 0.6;
  if (player.shield <= 0) {
    player.dead = true;
    return true;
  }
  return false;
}

function healPlayer(amount) {
  player.shield = Math.min(MAX_SHIELD, player.shield + amount);
}

function resetPlayer() {
  player.x = 0;
  player.y = 2.5;
  player.shield = MAX_SHIELD;
  player.bombs = 3;
  player.invuln = 0;
  player.dead = false;
  player.speed = BASE_SPEED;
  player.flow = BASE_SPEED;
  player.facing = 1;
  player.roll = { active: false, t: 0 };
  player.uturn = { active: false, t: 0, start: 0 };
  player.turnAngle = 0;
  player.locks = [];
  player.lockProgress = new Map();
  player.stats = { shotsFired: 0, shotsHit: 0, deflects: 0, rolls: 0, uturns: 0, missiles: 0 };
}

const ROUTE_ORDER = ['alpha', 'canyon', 'station', 'boss'];

// Runtime cursor for the active stage.
const stageRun = {
  route: null,
  t: 0,
  next: 0,
  done: false,
  bossSpawned: false,
};

function startStage(routeId) {
  stageRun.route = ROUTES[routeId];
  stageRun.t = 0;
  stageRun.next = 0;
  stageRun.done = false;
  stageRun.bossSpawned = false;
}

// Runs due script entries. `say(speaker, text)` is provided by game.js.
function updateStage(dt, say) {
  const r = stageRun.route;
  if (!r || stageRun.done) return;
  stageRun.t += dt;
  while (stageRun.next < r.script.length && r.script[stageRun.next].t <= stageRun.t) {
    const entry = r.script[stageRun.next];
    stageRun.next++;
    if (entry.say) say(entry.say[0], entry.say[1]);
    if (entry.run) entry.run();
  }
}

// A non-boss stage is complete once its timeline has run out and the field is clear.
// The boss stage is complete when the Warden is destroyed.
function stageComplete() {
  const r = stageRun.route;
  if (!r) return false;
  if (r.bossStage) return stageRun.bossSpawned && !enemies.some((e) => e.boss && e.alive);
  return stageRun.t >= r.length && stageRun.next >= r.script.length && !enemies.some((e) => e.alive);
}

function stageProgress() {
  const r = stageRun.route;
  if (!r) return 0;
  if (r.bossStage) return stageRun.bossSpawned ? 1 : 0;
  return Math.min(1, stageRun.t / r.length);
}

// ---- hud.js ----
// In-game HUD drawn on a 2D canvas above the WebGL view. Kept sparse: shield, bombs, lock count,
// score, rings, boss bar, subtitles. Everything else is shown only when it matters.

let canvas = null;
let hctx = null;
let w = 0;
let h = 0;
const subs = [];
const toasts = [];
const hudState = { score: 0, rings: 0, stageName: '', bossActive: false, flash: 0, wingman: null };

const projV = new THREE.Vector3();

function initHud() {
  canvas = document.createElement('canvas');
  canvas.id = 'hud';
  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;';
  document.getElementById('app').appendChild(canvas);
  hctx = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio, 2);
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function setHudState(patch) {
  Object.assign(hudState, patch);
}

function addSubtitle(speaker, text) {
  if (!settings.subtitles) return;
  subs.push({ speaker, text, t: 0, life: 4.5 });
  if (subs.length > 2) subs.shift();
}

function addToast(text, color = '#ffd34d') {
  toasts.push({ text, color, t: 0, life: 1.6 });
}

function flashDamage() {
  hudState.flash = 1;
}

function clearSubtitles() {
  subs.length = 0;
}

function updateHud(dt) {
  for (const s of subs) s.t += dt;
  for (let i = subs.length - 1; i >= 0; i--) if (subs[i].t > subs[i].life) subs.splice(i, 1);
  for (const t of toasts) t.t += dt;
  for (let i = toasts.length - 1; i >= 0; i--) if (toasts[i].t > toasts[i].life) toasts.splice(i, 1);
  hudState.flash = Math.max(0, hudState.flash - dt * 2.5);
}

function project(x, y, z) {
  projV.set(x, y, z).project(world.camera);
  return { x: (projV.x * 0.5 + 0.5) * w, y: (-projV.y * 0.5 + 0.5) * h, behind: projV.z > 1 };
}

function drawHud(time) {
  if (!hctx) return;
  hctx.clearRect(0, 0, w, h);

  // Damage vignette
  if (hudState.flash > 0) {
    const g = hctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.7);
    g.addColorStop(0, 'rgba(255,40,80,0)');
    g.addColorStop(1, `rgba(255,40,80,${0.55 * hudState.flash})`);
    hctx.fillStyle = g;
    hctx.fillRect(0, 0, w, h);
  }

  drawReticle();
  drawLocks(time);
  drawRadar();
  drawShield();
  drawBombs();
  drawScore();
  drawBoss();
  drawToasts();
  drawSubtitles();
}

function drawReticle() {
  const cx = w / 2;
  const cy = h / 2;
  hctx.strokeStyle = 'rgba(180,255,230,0.85)';
  hctx.lineWidth = 2;
  hctx.beginPath();
  hctx.arc(cx, cy, 12, 0, Math.PI * 2);
  hctx.moveTo(cx - 20, cy); hctx.lineTo(cx - 14, cy);
  hctx.moveTo(cx + 14, cy); hctx.lineTo(cx + 20, cy);
  hctx.moveTo(cx, cy - 20); hctx.lineTo(cx, cy - 14);
  hctx.moveTo(cx, cy + 14); hctx.lineTo(cx, cy + 20);
  hctx.stroke();
}

function drawLocks(time) {
  hctx.lineWidth = 2;
  for (const e of enemies) {
    if (!e.alive || !e.lockable) continue;
    const locked = player.locks.find((l) => l.enemy === e);
    const progress = player.lockProgress.get(e);
    if (!locked && progress === undefined) continue;
    const p = project(e.x, e.y, e.z);
    if (p.behind) continue;
    const size = e.boss ? 90 : 46;
    if (locked) {
      hctx.strokeStyle = '#ff4d6d';
      drawBrackets(p.x, p.y, size);
    } else {
      const f = Math.min(1, progress / 0.42);
      hctx.strokeStyle = 'rgba(255,220,120,0.9)';
      drawBrackets(p.x, p.y, size * (1.2 - f * 0.2));
      hctx.fillStyle = 'rgba(255,220,120,0.9)';
      hctx.fillRect(p.x - 20, p.y + size * 0.7, 40 * f, 3);
    }
  }
  if (player.locks.length > 0) {
    hctx.fillStyle = '#ff9aa9';
    hctx.font = '600 22px "Trebuchet MS", system-ui, sans-serif';
    hctx.textAlign = 'center';
    hctx.fillText(`LOCK ${player.locks.length}/6`, w / 2, h / 2 + 60);
  }
}

// Top-left radar: the ship sits at the bottom centre and "ahead" points up. Enemies within 200 units show.
const RADAR_R = 78;
const RADAR_RANGE = 200;
function drawRadar() {
  const cx = 110;
  const cy = 110;
  hctx.fillStyle = 'rgba(5,12,28,0.6)';
  hctx.beginPath();
  hctx.arc(cx, cy, RADAR_R, 0, Math.PI * 2);
  hctx.fill();
  hctx.strokeStyle = 'rgba(120,190,255,0.5)';
  hctx.lineWidth = 2;
  hctx.stroke();

  const scale = (RADAR_R - 8) / RADAR_RANGE;
  const plot = (wx, wy, ahead) => ({ x: cx + wx * scale * 0.6, y: cy - ahead * scale });
  const inside = (p) => Math.hypot(p.x - cx, p.y - cy) < RADAR_R - 4;

  hctx.fillStyle = '#ff4d6d';
  for (const e of enemies) {
    if (!e.alive) continue;
    const ahead = -e.z * player.facing;
    if (ahead < -20 || ahead > RADAR_RANGE) continue;
    const p = plot(e.x - player.x, 0, ahead);
    if (!inside(p)) continue;
    hctx.fillRect(p.x - (e.boss ? 4 : 2.5), p.y - (e.boss ? 4 : 2.5), e.boss ? 8 : 5, e.boss ? 8 : 5);
  }

  for (const w of wingmen) {
    if (w.down) continue;
    const p = plot(w.x - player.x, 0, 0);
    hctx.fillStyle = w.name === 'Rex' ? '#3fbf6a' : '#c84fd9';
    hctx.beginPath();
    hctx.arc(p.x, p.y + 6, 3, 0, Math.PI * 2);
    hctx.fill();
  }

  hctx.fillStyle = '#e8f4ff';
  hctx.beginPath();
  hctx.moveTo(cx, cy + 8);
  hctx.lineTo(cx - 5, cy + 2);
  hctx.lineTo(cx + 5, cy + 2);
  hctx.fill();
}

function drawBrackets(x, y, s) {
  const k = s / 2;
  const c = s * 0.28;
  hctx.beginPath();
  for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    hctx.moveTo(x + sx * k, y + sy * (k - c));
    hctx.lineTo(x + sx * k, y + sy * k);
    hctx.lineTo(x + sx * (k - c), y + sy * k);
  }
  hctx.stroke();
}

function drawShield() {
  const x = 40;
  const y = h - 60;
  const bw = Math.min(260, w * 0.22);
  const frac = Math.max(0, player.shield / MAX_SHIELD);
  hctx.fillStyle = 'rgba(5,12,28,0.7)';
  hctx.fillRect(x - 2, y - 2, bw + 4, 22);
  hctx.fillStyle = frac > 0.3 ? '#5cf2a6' : '#ff4d6d';
  hctx.fillRect(x, y, bw * frac, 18);
  hctx.fillStyle = '#e8f4ff';
  hctx.font = '600 16px "Trebuchet MS", system-ui, sans-serif';
  hctx.textAlign = 'left';
  hctx.fillText('SHIELD', x, y - 8);
}

function drawBombs() {
  const x = 40;
  const y = h - 100;
  hctx.fillStyle = '#e8f4ff';
  hctx.font = '600 16px "Trebuchet MS", system-ui, sans-serif';
  hctx.textAlign = 'left';
  hctx.fillText('BOMBS', x, y - 8);
  for (let i = 0; i < player.maxBombs; i++) {
    hctx.beginPath();
    hctx.arc(x + 12 + i * 26, y + 8, 9, 0, Math.PI * 2);
    hctx.fillStyle = i < player.bombs ? '#44ffaa' : 'rgba(60,80,100,0.5)';
    hctx.fill();
  }
}

function drawScore() {
  const x = w - 40;
  hctx.textAlign = 'right';
  hctx.fillStyle = '#e8f4ff';
  hctx.font = '700 26px "Trebuchet MS", system-ui, sans-serif';
  hctx.fillText(String(hudState.score).padStart(7, '0'), x, 46);
  hctx.font = '600 16px "Trebuchet MS", system-ui, sans-serif';
  hctx.fillStyle = '#ffd34d';
  hctx.fillText(`RINGS ${hudState.rings}`, x, 72);
  if (hudState.stageName) {
    hctx.fillStyle = '#7fa6c9';
    hctx.fillText(hudState.stageName, x, 96);
  }
}

function drawBoss() {
  const boss = enemies.find((e) => e.boss && e.alive);
  if (!boss) return;
  const bw = Math.min(520, w * 0.5);
  const x = (w - bw) / 2;
  const y = 28;
  const frac = Math.max(0, boss.hp / boss.maxHp);
  hctx.fillStyle = 'rgba(5,12,28,0.7)';
  hctx.fillRect(x - 2, y - 2, bw + 4, 18);
  hctx.fillStyle = '#ff6fa3';
  hctx.fillRect(x, y, bw * frac, 14);
  hctx.fillStyle = '#e8f4ff';
  hctx.font = '600 15px "Trebuchet MS", system-ui, sans-serif';
  hctx.textAlign = 'center';
  hctx.fillText('WARDEN', w / 2, y + 34);
}

function drawToasts() {
  hctx.textAlign = 'center';
  hctx.font = '700 28px "Trebuchet MS", system-ui, sans-serif';
  toasts.forEach((t, i) => {
    const a = 1 - Math.max(0, (t.t - t.life + 0.4) / 0.4);
    hctx.fillStyle = t.color;
    hctx.globalAlpha = Math.max(0, Math.min(1, a));
    hctx.fillText(t.text, w / 2, h * 0.3 - i * 36);
    hctx.globalAlpha = 1;
  });
}

function drawSubtitles() {
  if (subs.length === 0) return;
  hctx.textAlign = 'center';
  const boxW = Math.min(880, w * 0.8);
  let y = h - 150;
  for (let i = subs.length - 1; i >= 0; i--) {
    const s = subs[i];
    const a = Math.min(1, s.t / 0.2, (s.life - s.t) / 0.5);
    hctx.globalAlpha = Math.max(0, a);
    hctx.fillStyle = 'rgba(4,10,24,0.72)';
    hctx.fillRect(w / 2 - boxW / 2, y - 30, boxW, 50);
    hctx.fillStyle = '#ffb020';
    hctx.font = '700 17px "Trebuchet MS", system-ui, sans-serif';
    hctx.textAlign = 'left';
    hctx.fillText(s.speaker.toUpperCase(), w / 2 - boxW / 2 + 14, y - 8);
    hctx.fillStyle = '#e8f4ff';
    hctx.font = '500 20px "Trebuchet MS", system-ui, sans-serif';
    hctx.fillText(s.text, w / 2 - boxW / 2 + 14, y + 14);
    hctx.globalAlpha = 1;
    y -= 62;
  }
  hctx.textAlign = 'center';
}

function clearHud() {
  subs.length = 0;
  toasts.length = 0;
  hudState.flash = 0;
  if (hctx) hctx.clearRect(0, 0, w, h);
}

// ---- wingmen.js ----
// Two AI wingmen fly in formation beside the ship, shoot the nearest target ahead,
// and can be shot down. A downed wingman returns to formation after a short delay.

const WING_HP = 3;
const DOWN_TIME = 12;
const WING_FIRE_INTERVAL = 0.45;
const SLOTS = [
  { x: -3.4, y: -0.7, name: 'Rex' },
  { x: 3.4, y: -0.7, name: 'Mira' },
];

const wingmen = [];

function buildWingman(color) {
  const root = new THREE.Group();
  const hull = new THREE.MeshStandardMaterial({ color, metalness: 0.4, roughness: 0.4, flatShading: true });
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.45, 3.6, 7), hull);
  body.rotation.x = -Math.PI / 2;
  body.castShadow = true;
  root.add(body);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(3, 0.08, 1.6), hull);
  wing.position.set(0, 0, 0.5);
  wing.castShadow = true;
  root.add(wing);
  world.scene.add(root);
  return root;
}

function resetWingmen() {
  for (const w of wingmen) world.scene.remove(w.root);
  wingmen.length = 0;
  for (const slot of SLOTS) {
    const color = slot.name === 'Rex' ? 0x3fbf6a : 0xc84fd9;
    wingmen.push({
      name: slot.name,
      slot,
      root: buildWingman(color),
      x: player.x + slot.x,
      y: player.y + slot.y,
      hp: WING_HP,
      down: false,
      downT: 0,
      fireT: Math.random() * WING_FIRE_INTERVAL,
    });
  }
}

function clearWingmen() {
  for (const w of wingmen) world.scene.remove(w.root);
  wingmen.length = 0;
}

// Nearest living enemy ahead of the formation within gun range, or null.
function nearestTarget(w) {
  let best = null;
  let bestD = Infinity;
  for (const e of enemies) {
    if (!e.alive) continue;
    const ahead = -e.z * player.facing;
    if (ahead < -5 || ahead > 170) continue;
    const dx = e.x - w.x;
    if (Math.abs(dx) > 6) continue;
    const d = Math.abs(dx) + Math.abs(e.y - w.y) * 0.5 + ahead * 0.02;
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

// Formation follows the ship. Wingmen aim by moving only in the firing lane, so they hit targets that line up.
function updateWingmen(dt, facing) {
  for (const w of wingmen) {
    if (w.down) {
      w.downT -= dt;
      w.root.visible = false;
      if (w.downT <= 0) {
        w.down = false;
        w.hp = WING_HP;
        w.root.visible = true;
        addToast(`${w.name} back in the fight`, '#5cf2a6');
        sfx('pickup');
      }
      continue;
    }
    const tx = player.x + w.slot.x;
    const ty = player.y + w.slot.y;
    const k = Math.min(1, dt * 6);
    w.x += (tx - w.x) * k;
    w.y += (ty - w.y) * k;
    w.root.position.set(w.x, w.y, 0);
    w.root.rotation.set(0, player.turnAngle, -(tx - w.x) * 0.2);

    w.fireT -= dt;
    if (w.fireT <= 0) {
      const target = nearestTarget(w);
      if (target) {
        firePlayerShot(w.x, w.y, -0.5, facing, 'wingman');
        w.fireT = WING_FIRE_INTERVAL;
      } else {
        w.fireT = 0.15;
      }
    }
  }
}

// Returns true if an enemy shot struck a wingman. Caller removes the shot.
function hitWingman(x, y, z) {
  for (const w of wingmen) {
    if (w.down) continue;
    const dx = x - w.x, dy = y - w.y, dz = z;
    if (dx * dx + dy * dy + dz * dz < 1.6 * 1.6) {
      w.hp--;
      burst(w.x, w.y, 0, 20, 0xffaa77, 14, 0.7);
      if (w.hp <= 0) {
        w.down = true;
        w.downT = DOWN_TIME;
        sfx('bigExplode');
        burst(w.x, w.y, 0, 60, 0xffaa55, 22, 1.2);
        addToast(`${w.name} is down`, '#ff8866');
      }
      return true;
    }
  }
  return false;
}

// ---- menus.js ----
// Controller-first menus rendered into #overlay. Up/down moves, confirm activates,
// left/right adjusts sliders and toggles, back goes up one level. Mouse hover and click also work.

const overlay = () => document.getElementById('overlay');

let current = null;

// items: [{ label, action?, adjust?(dir), value?() }]
function openMenu({ title, subtitle = '', items, html = '', footer = '', onBack = null, initial = 0 }) {
  const el = overlay();
  el.classList.remove('hidden');
  el.innerHTML = '';
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h1></h1>${subtitle ? '<p class="sub"></p>' : ''}${html}<div class="items"></div>${footer ? '<p class="hint"></p>' : ''}`;
  panel.querySelector('h1').textContent = title;
  if (subtitle) panel.querySelector('p.sub').textContent = subtitle;
  if (footer) panel.querySelector('p.hint').textContent = footer;
  el.appendChild(panel);

  const list = panel.querySelector('.items');
  const buttons = items.map((item, i) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.type = 'button';
    b.dataset.index = String(i);
    b.addEventListener('mouseenter', () => focus(i));
    b.addEventListener('click', () => { focus(i); activate(i); });
    list.appendChild(b);
    return b;
  });

  current = { items, buttons, index: Math.max(0, Math.min(initial, items.length - 1)), onBack };
  render();
  return current;
}

function closeMenu() {
  const el = overlay();
  el.classList.add('hidden');
  el.innerHTML = '';
  current = null;
}

function isMenuOpen() {
  return current !== null;
}

function labelOf(item) {
  const v = item.value ? item.value() : '';
  return v ? `${item.label}<span class="toggle-value">  ${v}</span>` : item.label;
}

function render() {
  if (!current) return;
  current.buttons.forEach((b, i) => {
    const item = current.items[i];
    b.innerHTML = labelOf(item);
    b.classList.toggle('focused', i === current.index);
    b.disabled = !!item.disabled;
  });
  const focused = current.buttons[current.index];
  if (focused && focused.scrollIntoView) focused.scrollIntoView({ block: 'nearest' });
}

function focus(i) {
  if (!current) return;
  if (current.index !== i) sfx('menu');
  current.index = i;
  render();
}

function activate(i) {
  if (!current) return;
  const item = current.items[i];
  if (item.disabled) return;
  if (item.action) {
    sfx('select');
    item.action();
  }
}

// Called once per frame by game.js with the input snapshot.
function updateMenu(input) {
  if (!current) return;
  const n = current.items.length;
  if (input.upPressed) focus((current.index - 1 + n) % n);
  if (input.downPressed) focus((current.index + 1) % n);
  const item = current.items[current.index];
  if (input.leftPressed && item && item.adjust) { item.adjust(-1); sfx('menu'); render(); }
  if (input.rightPressed && item && item.adjust) { item.adjust(1); sfx('menu'); render(); }
  if (input.confirmPressed) activate(current.index);
  if (input.backPressed && current.onBack) {
    sfx('back');
    current.onBack();
  }
  if (current) render();
}

// Refresh values after a setting changes without losing focus.
function refreshMenu() {
  render();
}
