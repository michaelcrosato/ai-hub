<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moo-lody Harvest</title>
<style>
html,body{margin:0;height:100%;background:#120c1c;overflow:hidden}
canvas{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);outline:none}
#touch{display:none;position:fixed;inset:0;z-index:5;background:#241440;color:#fff3d6;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;font:800 7vmin/1.2 "Trebuchet MS","Segoe UI",sans-serif;padding:24px}
#touch button{font:inherit;font-size:5vmin;padding:16px 44px;border-radius:22px;border:5px solid #22152e;background:#ffcf4a;color:#22152e;cursor:pointer}
#tpanel{display:none;flex-direction:column;gap:16px;font-size:4.5vmin;align-items:center}
#tpanel label{display:flex;gap:16px;align-items:center}
#tpanel input[type=range]{width:40vmin;height:5vmin}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720" tabindex="0"></canvas>
<div id="touch">
  <div>Controller or keyboard required</div>
  <button id="tset">Settings</button>
  <div id="tpanel">
    <label>Music <input id="tmus" type="range" min="0" max="10"></label>
    <label>Effects <input id="tsfx" type="range" min="0" max="10"></label>
    <label><input id="tcalm" type="checkbox" style="width:5vmin;height:5vmin"> Reduce motion</label>
    <button id="tclose">Close</button>
  </div>
</div>
<script>
'use strict';
/* ============================ CONSTANTS ============================ */
const W=1280,H=720,TILE=64,COLS=6,ROWS=4,FX=448,FY=336;
const DAYS=4,DAY_LEN=75,QUOTA=60,CARRY=10,CAN=10,STAGE_T=7,WET_T=22,FLUTE_CD=8,PROMPT_T=1.0,SPEED=235;
const INK='#22152e',CREAM='#fff3d6',GOLD='#ffcf4a';
const FONT='"Baloo 2","Fredoka","Trebuchet MS","Segoe UI",sans-serif';
const ALTAR={x:640,y:196},WELL={x:1060,y:520},HUT={x:1060,y:300};
const PASTURE={x:60,y:262,w:264,h:216};
const RECTS=[[592,148,96,66],[70,120,190,122],[1015,250,92,72],[1030,498,60,44],
  [56,262,264,12],[52,262,12,216],[56,466,264,12],[314,262,12,72],[314,408,12,70]];
const BOUNDS={x0:72,x1:1208,y0:165,y1:680};
const NOTE_COL=['#5aa9ff','#ff6b6b','#ff9ad5','#6be37a'];
const NOTE_HZ=[0,4,7,9];
const cv=document.getElementById('c'),X=cv.getContext('2d');

/* ============================ SETTINGS ============================ */
function loadSet(){try{return JSON.parse(localStorage.getItem('moolody-harvest')||'{}')}catch(e){return{}}}
const SET=Object.assign({music:.6,sfx:.8,calm:false},loadSet());
function saveSet(){try{localStorage.setItem('moolody-harvest',JSON.stringify(SET))}catch(e){}}

/* ============================ AUDIO ============================ */
const hz=s=>261.63*Math.pow(2,s/12);
const MEL=[0,null,4,null,7,null,9,7,4,null,2,null,0,null,null,null,4,null,7,null,9,null,12,9,7,null,4,2,0,null,null,null];
const ROOT=[0,-3,-7,-5];
const Snd={ctx:null,mg:null,sg:null,
  init(){
    if(this.ctx)return;
    try{
      const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
      this.ctx=new A();this.sg=this.ctx.createGain();this.mg=this.ctx.createGain();
      this.sg.connect(this.ctx.destination);this.mg.connect(this.ctx.destination);
      this.noiseBuf=this.ctx.createBuffer(1,this.ctx.sampleRate*.5,this.ctx.sampleRate);
      const d=this.noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      this.vol();this.music();
    }catch(e){this.ctx=null}
  },
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})},
  vol(duck=1){if(!this.ctx)return;this.sg.gain.value=SET.sfx;this.mg.gain.value=SET.music*.5*duck},
  tone(f,d=.2,type='sine',v=.2,delay=0,slide=0,bus){
    if(!this.ctx)return;const c=this.ctx,t=c.currentTime+Math.max(0,delay),o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(bus||this.sg);o.start(t);o.stop(t+d+.05);
  },
  noise(d=.15,v=.2,freq=800,type='lowpass',delay=0){
    if(!this.ctx)return;const c=this.ctx,t=c.currentTime+delay,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
    s.buffer=this.noiseBuf;f.type=type;f.frequency.value=freq;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(this.sg);s.start(t);s.stop(t+d+.02);
  },
  music(){
    let step=0,next=this.ctx.currentTime+.1;
    setInterval(()=>{
      if(!this.ctx)return;
      while(next<this.ctx.currentTime+.35){
        const dl=next-this.ctx.currentTime,m=MEL[step%32],ch=Math.floor(step/8)%4;
        if(m!==null)this.tone(hz(m),.5,'triangle',.45,dl,0,this.mg);
        if(step%4===0)this.tone(hz(ROOT[ch]-12),.55,'sine',.7,dl,0,this.mg);
        if(step%8===4)this.tone(hz(ROOT[ch]+7),.4,'sine',.18,dl,0,this.mg);
        next+=.3125;step++;
      }
    },100);
  },
  sfx(n){
    if(!this.ctx)return;
    switch(n){
      case'ui':this.tone(660,.07,'square',.07);break;
      case'ok':this.tone(520,.08,'square',.09);this.tone(780,.12,'square',.09,.07);break;
      case'back':this.tone(420,.1,'square',.08,0,-120);break;
      case'till':this.noise(.12,.35,500);this.tone(110,.12,'sine',.3,0,-40);break;
      case'plant':this.tone(400,.12,'sine',.25,0,300);break;
      case'water':this.noise(.28,.18,2600,'bandpass');break;
      case'harvest':[0,4,7,12].forEach((s,i)=>this.tone(hz(s+12),.14,'triangle',.22,i*.05));break;
      case'offer':[0,4,7,12,16].forEach((s,i)=>this.tone(hz(s+12),.35,'sine',.22,i*.07));break;
      case'caw':this.tone(520,.2,'sawtooth',.14,0,-280);this.tone(480,.18,'sawtooth',.12,.2,-240);break;
      case'scare':this.noise(.2,.2,1800,'highpass');break;
      case'bad':this.tone(180,.3,'sawtooth',.2,0,-80);break;
      case'moo':this.tone(150,.5,'sawtooth',.14,0,-40);break;
      case'wake':[0,7,12].forEach((s,i)=>this.tone(hz(s+19),.2,'sine',.2,i*.08));break;
      case'ready':this.tone(880,.1,'sine',.15);break;
      case'success':[0,4,7,12,16,19].forEach((s,i)=>this.tone(hz(s+12),.3,'triangle',.22,i*.06));break;
      case'fail':this.tone(220,.35,'triangle',.2,0,-90);break;
      case'win':[0,4,7,12,7,12,16,19].forEach((s,i)=>this.tone(hz(s+12),.4,'triangle',.25,i*.14));break;
      case'lose':[7,4,0,-5].forEach((s,i)=>this.tone(hz(s),.5,'triangle',.22,i*.25));break;
    }
  },
  note(k,perfect){this.tone(hz(NOTE_HZ[k]+12),.5,'triangle',.3);if(perfect)this.tone(hz(NOTE_HZ[k]+24),.4,'sine',.12,.02)}
};

/* ============================ INPUT ============================ */
const K=new Set(),Kp=new Set(),mouse={x:-1,y:-1,click:false,rclick:false,down:false,moved:false};
let lastActive=performance.now(),device='kb',padPrev=[],navT={},touchOnly=false;
const GAMEKEYS=new Set(['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Backspace','Escape']);
function activity(dev){lastActive=performance.now();if(dev)device=dev}
function hideTouch(){touchOnly=false;document.getElementById('touch').style.display='none'}
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(!e.repeat)Kp.add(e.code);K.add(e.code);activity('kb');Snd.init();Snd.resume();hideTouch();
  if(GAMEKEYS.has(e.code))e.preventDefault();
});
addEventListener('keyup',e=>K.delete(e.code));
addEventListener('blur',()=>{K.clear();if(scene==='play'&&G&&!G.demo&&!G.over)openPause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scene==='play'&&G&&!G.demo&&!G.over)openPause()});
function mpos(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height}
cv.addEventListener('mousedown',e=>{mpos(e);if(e.button===2)mouse.rclick=true;else{mouse.click=true;mouse.down=true}activity('kb');Snd.init();Snd.resume()});
addEventListener('mouseup',()=>{mouse.down=false});
cv.addEventListener('mousemove',e=>{const ox=mouse.x,oy=mouse.y;mpos(e);if(Math.abs(mouse.x-ox)+Math.abs(mouse.y-oy)>3){mouse.moved=true;activity()}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('gamepadconnected',()=>{activity('pad');hideTouch()});

function emptyInput(){return{click:false,mx:0,my:0,act:false,actHeld:false,flute:false,back:false,pause:false,
  nav:{up:false,down:false,left:false,right:false},face:[false,false,false,false],faceDir:null}}
function poll(dt){
  const I=emptyInput(),kd=(...c)=>c.some(x=>K.has(x)),kp=(...c)=>c.some(x=>Kp.has(x));
  const pads=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[];
  const p=pads[0];let pb=[],ax=[0,0];
  if(p){pb=p.buttons.map(b=>b.pressed);ax=[p.axes[0]||0,p.axes[1]||0]}
  const pp=i=>pb[i]&&!padPrev[i];
  let padAct=false;for(let i=0;i<pb.length;i++)if(pp(i))padAct=true;
  if(Math.abs(ax[0])>.6||Math.abs(ax[1])>.6)padAct=true;
  if(padAct){activity('pad');Snd.init();Snd.resume();hideTouch()}
  const dz=v=>Math.abs(v)<.25?0:v;
  let mx=dz(ax[0]),my=dz(ax[1]);
  if(pb[14])mx=-1;if(pb[15])mx=1;if(pb[12])my=-1;if(pb[13])my=1;
  if(kd('KeyA','ArrowLeft'))mx-=1;if(kd('KeyD','ArrowRight'))mx+=1;
  if(kd('KeyW','ArrowUp'))my-=1;if(kd('KeyS','ArrowDown'))my+=1;
  const len=Math.hypot(mx,my);if(len>1){mx/=len;my/=len}
  I.mx=mx;I.my=my;
  const cur={up:my<-.5,down:my>.5,left:mx<-.5,right:mx>.5};
  const edge={up:kp('ArrowUp','KeyW'),down:kp('ArrowDown','KeyS'),left:kp('ArrowLeft','KeyA'),right:kp('ArrowRight','KeyD')};
  for(const d of['up','down','left','right']){
    if(edge[d])I.nav[d]=true;
    if(cur[d]){
      if(navT[d]===undefined){navT[d]=0;I.nav[d]=true}
      else{navT[d]+=dt;if(navT[d]>.4&&(navT[d]-.4)%.12<dt)I.nav[d]=true}
    }else navT[d]=undefined;
  }
  I.click=mouse.click;
  I.act=pp(0)||kp('Space','Enter','KeyZ','KeyJ')||mouse.click;
  I.actHeld=!!pb[0]||kd('Space','Enter','KeyZ','KeyJ')||mouse.down;
  I.flute=pp(2)||kp('KeyF','KeyQ')||mouse.rclick;
  I.back=pp(1)||kp('Escape','Backspace','KeyX');
  I.pause=pp(9)||pp(8)||kp('Escape','KeyP');
  I.face[0]=pp(0)||pp(13)||kp('ArrowDown','KeyS');
  I.face[1]=pp(1)||pp(15)||kp('ArrowRight','KeyD');
  I.face[2]=pp(2)||pp(14)||kp('ArrowLeft','KeyA');
  I.face[3]=pp(3)||pp(12)||kp('ArrowUp','KeyW');
  padPrev=pb;Kp.clear();mouse.click=false;mouse.rclick=false;
  return I;
}

/* ============================ DRAW HELPERS ============================ */
const mixCache=new Map();
function mix(a,b,t){
  const key=a+b+t;if(mixCache.has(key))return mixCache.get(key);
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);let r=0;
  for(const s of[16,8,0]){const ca=(pa>>s)&255,cb=(pb>>s)&255;r=(r<<8)|Math.round(ca+(cb-ca)*t)}
  const v='#'+r.toString(16).padStart(6,'0');mixCache.set(key,v);return v;
}
const shade=c=>mix(c,'#3a2470',.32);
function inkStroke(w=4){X.lineWidth=w;X.strokeStyle=INK;X.lineJoin='round';X.lineCap='round';X.stroke()}
function blob(x,y,rx,ry,col,lw=4,sh){
  const s=sh===undefined?shade(col):sh;
  X.beginPath();X.ellipse(x,y,rx,ry,0,0,7);X.fillStyle=s||col;X.fill();
  if(s){X.save();X.clip();X.beginPath();X.ellipse(x-rx*.2,y-ry*.25,rx,ry,0,0,7);X.fillStyle=col;X.fill();X.restore()}
  X.beginPath();X.ellipse(x,y,rx,ry,0,0,7);inkStroke(lw);
}
function rrect(x,y,w,h,r,col,lw=4,sh){
  const s=sh===undefined?shade(col):sh;
  X.beginPath();X.roundRect(x,y,w,h,r);X.fillStyle=s||col;X.fill();
  if(s){X.save();X.clip();X.fillStyle=col;X.fillRect(x,y,w,h*.66);X.restore()}
  X.beginPath();X.roundRect(x,y,w,h,r);inkStroke(lw);
}
function poly(pts,col,lw=4,sh){
  const path=()=>{X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.closePath()};
  const s=sh===undefined?shade(col):sh;
  path();X.fillStyle=col;X.fill();
  if(s){X.save();path();X.clip();X.fillStyle=s;X.globalAlpha=.55;
    let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;pts.forEach(p=>{mnx=Math.min(mnx,p[0]);mxx=Math.max(mxx,p[0]);mny=Math.min(mny,p[1]);mxy=Math.max(mxy,p[1])});
    X.fillRect(mnx,mny+(mxy-mny)*.62,mxx-mnx,(mxy-mny));X.restore()}
  path();inkStroke(lw);
}
function shadowAt(x,y,rx,ry){X.beginPath();X.ellipse(x,y,rx,ry,0,0,7);X.fillStyle='rgba(34,21,46,.28)';X.fill()}
function txt(s,x,y,sz=36,o={}){
  X.font=`800 ${sz}px ${FONT}`;X.textAlign=o.al||'center';X.textBaseline='middle';X.lineJoin='round';
  const lw=o.lw===undefined?Math.max(4,sz*.2):o.lw;X.strokeStyle=o.st||INK;
  if(lw>0){X.lineWidth=lw;X.strokeText(s,x,y)}X.fillStyle=o.col||CREAM;X.fillText(s,x,y);
}
function tw(s,sz){X.font=`800 ${sz}px ${FONT}`;return X.measureText(s).width}
function panel(x,y,w,h,col='#33205a',alpha=.92,r=26){
  X.save();X.globalAlpha=alpha;X.beginPath();X.roundRect(x,y,w,h,r);X.fillStyle=col;X.fill();X.restore();
  X.beginPath();X.roundRect(x,y,w,h,r);inkStroke(5);
  X.beginPath();X.roundRect(x+7,y+7,w-14,h-14,r-6);X.strokeStyle='rgba(255,243,214,.25)';X.lineWidth=2;X.stroke();
}
function star(x,y,r,col,lw=4){
  X.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;X.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}
  X.closePath();X.fillStyle=col;X.fill();inkStroke(lw);
}
/* glyphs: pad symbols or keyboard keycaps depending on last-used device */
const PADSYM={act:'x',confirm:'x',n0:'x',back:'o',n1:'o',flute:'sq',n2:'sq',n3:'tri',move:'L',pause:'opt',nav:'dpad',navh:'dpad'};
const KBLBL={act:'Space',confirm:'Enter',back:'Esc',flute:'F',pause:'Esc',move:'WASD',nav:'↑↓',n0:'↓',n1:'→',n2:'←',n3:'↑',navh:'←→'};
function glyphW(name,s=44){
  if(device==='pad'&&PADSYM[name])return s;
  return Math.max(s,tw(KBLBL[name]||name,s*.5)+26);
}
function glyph(name,cx,cy,s=44){
  const w=glyphW(name,s);
  if(device==='pad'&&PADSYM[name]){
    const sym=PADSYM[name],r=s/2;
    X.beginPath();X.arc(cx,cy,r,0,7);X.fillStyle='#2a2440';X.fill();inkStroke(4);
    X.lineWidth=s*.09;X.lineCap='round';X.lineJoin='round';
    const k=r*.42;
    if(sym==='x'){X.strokeStyle=NOTE_COL[0];X.beginPath();X.moveTo(cx-k,cy-k);X.lineTo(cx+k,cy+k);X.moveTo(cx+k,cy-k);X.lineTo(cx-k,cy+k);X.stroke()}
    else if(sym==='o'){X.strokeStyle=NOTE_COL[1];X.beginPath();X.arc(cx,cy,k,0,7);X.stroke()}
    else if(sym==='sq'){X.strokeStyle=NOTE_COL[2];X.strokeRect(cx-k,cy-k,k*2,k*2)}
    else if(sym==='tri'){X.strokeStyle=NOTE_COL[3];X.beginPath();X.moveTo(cx,cy-k*1.1);X.lineTo(cx+k*1.1,cy+k*.8);X.lineTo(cx-k*1.1,cy+k*.8);X.closePath();X.stroke()}
    else if(sym==='L'||sym==='opt'||sym==='dpad'){
      X.fillStyle=CREAM;X.font=`800 ${s*.42}px ${FONT}`;X.textAlign='center';X.textBaseline='middle';
      X.fillText(sym==='L'?'L':sym==='opt'?'≡':'✥',cx,cy+1);
    }
    return w;
  }
  rrect(cx-w/2,cy-s/2,w,s,s*.2,'#efe6d0',4);
  txt(KBLBL[name]||name,cx,cy+1,s*.5,{col:INK,lw:0});
  return w;
}
/* a row of prompts [{g,t}], centered at cx */
function prompts(items,cx,cy,s=40,fs=28){
  let total=0;const ws=items.map(it=>{const w=glyphW(it.g,s)+12+tw(it.t,fs);total+=w;return w});
  total+=(items.length-1)*34;let x=cx-total/2;
  items.forEach((it,i)=>{const gw=glyphW(it.g,s);glyph(it.g,x+gw/2,cy,s);txt(it.t,x+gw+12,cy+1,fs,{al:'left'});x+=ws[i]+34});
}

/* ============================ STATIC ART (pre-rendered) ============================ */
function rng(seed){let s=seed;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
const GROUND=document.createElement('canvas');GROUND.width=W;GROUND.height=H;
const VIGN=document.createElement('canvas');VIGN.width=W;VIGN.height=H;
const GRAIN=document.createElement('canvas');GRAIN.width=256;GRAIN.height=256;
function tree(x,y,s=1){
  shadowAt(x+8*s,y+52*s,52*s,16*s);
  rrect(x-9*s,y+8*s,18*s,46*s,6,'#8a5a3a',4);
  blob(x-34*s,y+4*s,36*s,32*s,'#4fae5a',5);blob(x+34*s,y+8*s,34*s,30*s,'#4fae5a',5);
  blob(x,y-24*s,44*s,40*s,'#68c46a',5);
  X.beginPath();X.arc(x-12*s,y-30*s,6*s,0,7);X.fillStyle='#e85d5d';X.fill();inkStroke(3);
}
/* helpers use the global X; to pre-render we simply draw to the main canvas then copy */
function renderStatics(){
  const R=rng(11);
  // --- ground ---
  X.fillStyle='#86cf62';X.fillRect(0,0,W,H);
  for(let i=0;i<46;i++){X.beginPath();X.ellipse(R()*W,R()*H,60+R()*120,30+R()*60,0,0,7);X.fillStyle=R()<.5?'#97d975':'#78c05a';X.fill()}
  // path ring + connectors
  const rx=FX-52,ry=FY-52,rw=COLS*TILE+104,rh=ROWS*TILE+104;
  const pathLines=()=>{
    X.beginPath();X.roundRect(rx,ry,rw,rh,46);
    X.moveTo(640,ALTAR.y+18);X.lineTo(640,ry);X.moveTo(640,ry+rh);X.lineTo(640,H);
    X.moveTo(rx+rw,ry+rh/2);X.lineTo(1030,ry+rh/2);X.lineTo(1030,420);
    X.moveTo(rx,ry+rh/2);X.lineTo(318,ry+rh/2);
  };
  X.lineCap='round';X.lineJoin='round';
  pathLines();X.lineWidth=70;X.strokeStyle=INK;X.stroke();
  pathLines();X.lineWidth=60;X.strokeStyle='#ecd09a';X.stroke();
  // cover path inside the ring (field bed)
  X.beginPath();X.roundRect(FX-12,FY-12,COLS*TILE+24,ROWS*TILE+24,26);X.fillStyle='#7bbf58';X.fill();inkStroke(4);
  // path pebbles
  for(let i=0;i<70;i++){const x=R()*W,y=R()*H;X.beginPath();X.ellipse(x,y,4+R()*3,3,0,0,7);X.fillStyle='rgba(34,21,46,.28)';X.fill()}
  // tufts
  X.lineCap='round';
  for(let i=0;i<260;i++){
    const x=R()*W,y=R()*H;X.strokeStyle='rgba(34,21,46,.55)';X.lineWidth=2.5;
    X.beginPath();X.moveTo(x-5,y);X.lineTo(x-2,y-8);X.moveTo(x,y);X.lineTo(x,y-10);X.moveTo(x+5,y);X.lineTo(x+2,y-8);X.stroke();
  }
  // flowers
  const fc=['#fff6e0','#ff9ad5','#ffd84a','#b9a0ff'];
  for(let i=0;i<60;i++){
    const x=R()*W,y=R()*H;if(x>FX-30&&x<FX+COLS*TILE+30&&y>FY-30&&y<FY+ROWS*TILE+30)continue;
    X.beginPath();X.arc(x,y,6,0,7);X.fillStyle=fc[i%4];X.fill();inkStroke(2.5);
    X.beginPath();X.arc(x,y,2.3,0,7);X.fillStyle='#ffb02e';X.fill();
  }
  // pond
  blob(640,128,168,58,'#6ad0e8',6);
  X.save();X.beginPath();X.ellipse(640,128,164,54,0,0,7);X.clip();
  X.strokeStyle='rgba(255,255,255,.55)';X.lineWidth=3;
  for(let i=0;i<6;i++){X.beginPath();X.moveTo(500+i*38,100+i%2*24);X.lineTo(530+i*38,100+i%2*24);X.stroke()}
  X.restore();
  for(const [x,y] of [[520,150],[560,176],[724,176],[766,148],[610,84],[690,82]]){blob(x,y,18,12,'#b8b2c4',4)}
  for(const [x,y] of [[570,120],[720,130]]){blob(x,y,16,9,'#58b85a',3)}
  // pasture floor
  X.beginPath();X.roundRect(PASTURE.x,PASTURE.y,PASTURE.w,PASTURE.h,14);X.fillStyle='#9edb7c';X.fill();
  // fence
  const post=(x,y)=>rrect(x-6,y-18,12,34,4,'#c88a55',3);
  const rail=(x1,y1,x2,y2)=>{X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.lineWidth=11;X.strokeStyle=INK;X.stroke();X.lineWidth=5;X.strokeStyle='#e0a66a';X.stroke()};
  rail(58,270,320,270);rail(58,470,320,470);rail(58,270,58,470);rail(320,270,320,334);rail(320,408,320,470);
  for(let x=58;x<=320;x+=44){post(x,270);post(x,470)}
  for(let y=270;y<=470;y+=40)post(58,y);
  post(320,334);post(320,408);
  // trees (outside play bounds)
  const trees=[[30,230,1],[26,400,1.05],[34,590,1.1],[96,700,1],[240,716,1],[420,722,1.1],[860,722,1],[1010,716,1.05],[1170,712,1.1],[1252,610,1.1],
    [1250,430,1],[1246,260,1.05],[1230,120,1],[1110,70,1],[260,60,1.1],[430,40,1],[860,38,1.05],[960,70,1],[40,90,1.1],[150,40,1]];
  trees.sort((a,b)=>a[1]-b[1]).forEach(t=>tree(t[0],t[1],t[2]));
  // copy
  GROUND.getContext('2d').drawImage(cv,0,0);
  // vignette: halftone dots grow toward corners
  X.clearRect(0,0,W,H);
  const vc=VIGN.getContext('2d');
  for(let y=0;y<H;y+=14)for(let x=0;x<W;x+=14){
    const dx=(x-W/2)/(W/2),dy=(y-H/2)/(H/2),d=Math.max(0,Math.hypot(dx,dy)-.75);
    const r=Math.min(6,d*9);if(r<.8)continue;
    vc.beginPath();vc.arc(x+((y/14)%2?7:0),y,r,0,7);vc.fillStyle='rgba(34,21,46,.38)';vc.fill();
  }
  // paper grain
  const gc=GRAIN.getContext('2d'),id=gc.createImageData(256,256);
  for(let i=0;i<id.data.length;i+=4){const v=200+R()*55;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}
  gc.putImageData(id,0,0);
}

/* ============================ GAME STATE ============================ */
let G=null,scene='title',sceneT=0,P=null,menus={},prevScene='title';
function newGame(demo,ambient=false){
  P={x:640,y:640,vx:0,vy:0,fx:0,fy:-1,anim:0,act:0,moved:0};
  const g={demo,ambient,t:0,day:1,dayT:0,plots:[],carry:0,carryPts:0,water:CAN,offered:0,flute:null,fluteCd:0,actCd:0,
    crows:[],particles:[],crowT:28,toast:null,over:null,dialog:null,daysum:null,shake:0,tint:{r:0,g:0,b:0,a:0},
    sprites:[],cow:{x:200,y:380,tx:200,ty:380,t:2,milk:false,given:false,dir:1,moo:0},
    did:{move:false,till:false,water:false,harvest:false,offer:false,flute:false},
    stats:{harvested:0,lost:0,milk:0,songs:0,scared:0},bot:{},startAt:performance.now(),hop:0};
  for(let i=0;i<COLS*ROWS;i++)g.plots.push({s:0,st:0,gr:0,wet:0,pop:0});
  [['#ff6b6b',1015],['#5aa9ff',1062],['#ffd84a',1108]].forEach(([c,x],i)=>g.sprites.push({x,y:352+(i===1?8:0),c,awake:false,job:null,t:0,wob:i,home:[x,352]}));
  return g;
}
function plotXY(i){return[FX+(i%COLS)*TILE+TILE/2,FY+((i/COLS)|0)*TILE+TILE/2]}
function toast(s,t=2.4){G.toast={s,t,max:t}}
function burst(x,y,col,n=8,sp=90,up=40){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=sp*(.3+Math.random());
    G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-up,life:.5+Math.random()*.3,max:.8,col,k:'dot',sz:3+Math.random()*3})}
}
function floatText(s,x,y,col=CREAM,sz=28){G.particles.push({x,y,vx:0,vy:-50,life:1.1,max:1.1,col,k:'text',s,sz})}
function noteFx(x,y,col){G.particles.push({x,y,vx:(Math.random()-.5)*60,vy:-60-Math.random()*40,life:1.1,max:1.1,col,k:'text',s:Math.random()<.5?'♪':'♫',sz:34})}

function targetPlot(){
  const px=P.x+P.fx*40,py=P.y-8+P.fy*40;
  const c=Math.floor((px-FX)/TILE),r=Math.floor((py-FY)/TILE);
  if(c<0||c>=COLS||r<0||r>=ROWS)return-1;return r*COLS+c;
}
function ctxAction(){
  const g=G,d=(a,b)=>Math.hypot(P.x-a,P.y-b);
  if(d(WELL.x,WELL.y)<100&&g.water<CAN)return{k:'refill',t:'Refill watering can'};
  if(d(ALTAR.x,ALTAR.y)<115&&g.carry>0)return{k:'offer',t:`Offer ${g.carry} to the Goddess`};
  const cw=g.cow;
  if(d(cw.x,cw.y)<90&&cw.milk)return g.carry>=CARRY?{k:'none',t:'Basket full — visit the altar'}:{k:'milk',t:'Collect fresh milk'};
  const i=targetPlot();if(i<0)return null;
  const p=g.plots[i];
  if(p.s===0)return{k:'till',t:'Till the soil',i};
  if(p.s===1)return{k:'plant',t:'Plant turnip seeds',i};
  if(p.st===3)return g.carry>=CARRY?{k:'none',t:'Basket full — visit the altar'}:{k:'harvest',t:'Harvest turnip',i};
  if(p.wet<=0)return g.water>0?{k:'water',t:'Water the turnip',i}:{k:'none',t:'Can empty — visit the well'};
  return null;
}
function doAct(){
  const a=ctxAction();if(!a||a.k==='none')return false;
  const g=G;
  const pl=a.i!==undefined?g.plots[a.i]:null,pxy=a.i!==undefined?plotXY(a.i):[P.x,P.y];
  P.act=.25;
  if(a.k==='till'){pl.s=1;g.actCd=.22;g.did.till=true;burst(pxy[0],pxy[1],'#a8714a',9);Snd.sfx('till')}
  else if(a.k==='plant'){pl.s=2;pl.st=0;pl.gr=0;pl.pop=.4;g.actCd=.22;burst(pxy[0],pxy[1],'#c99a6a',6);Snd.sfx('plant')}
  else if(a.k==='water'){pl.wet=WET_T;g.water--;g.actCd=.26;g.did.water=true;burst(pxy[0],pxy[1],'#7fd6ff',10,70);Snd.sfx('water')}
  else if(a.k==='harvest'){pl.s=1;pl.st=0;pl.wet=0;g.carry++;g.carryPts++;g.stats.harvested++;g.actCd=.24;g.did.harvest=true;
    burst(pxy[0],pxy[1],'#c78bff',12);floatText('+1',pxy[0],pxy[1]-20,'#e6c8ff');Snd.sfx('harvest')}
  else if(a.k==='refill'){g.water=CAN;g.actCd=.5;burst(WELL.x,WELL.y,'#7fd6ff',14);toast('Watering can refilled!',1.4);Snd.sfx('water')}
  else if(a.k==='milk'){g.cow.milk=false;g.cow.given=true;g.carry++;g.carryPts+=2;g.stats.milk++;g.actCd=.4;
    floatText('+2 milk',g.cow.x,g.cow.y-50,'#ffffff');burst(g.cow.x,g.cow.y,'#ffffff',10);Snd.sfx('harvest');Snd.sfx('moo')}
  else if(a.k==='offer'){
    const n=g.carry,pts=g.carryPts;g.offered+=pts;g.carry=0;g.carryPts=0;g.actCd=.5;g.did.offer=true;
    floatText(`+${pts}`,ALTAR.x,ALTAR.y-70,GOLD,44);
    for(let i=0;i<24;i++)burst(ALTAR.x+(Math.random()-.5)*60,ALTAR.y-30,GOLD,1,120,120);
    g.pulse=1;Snd.sfx('offer');toast(`The Goddess accepts ${n} offering${n>1?'s':''}!`,2);
    if(g.offered>=QUOTA)finishGame(true);
  }
  return true;
}

/* ---- flute ---- */
function startFlute(){
  const g=G;if(g.flute)return;
  if(g.fluteCd>0){toast('The flute is still glowing — wait a moment',1.2);Snd.sfx('back');return}
  const notes=[0,0,0,0].map(()=>Math.floor(Math.random()*4));
  g.flute={notes,i:0,pt:0,state:'intro',timer:.55,res:[],perfect:0,flash:0};g.did.flute=true;g.stats.songs++;
}
function stepFlute(dt,I,skipInput){
  const g=G,f=g.flute;f.flash=Math.max(0,f.flash-dt);
  if(f.state==='intro'){f.timer-=dt;if(f.timer<=0){f.state='prompt';f.pt=0}return}
  if(f.state==='prompt'){
    f.pt+=dt;let hit=-1;
    if(!skipInput)for(let k=0;k<4;k++)if(I.face[k]){hit=k;break}
    const r=1-f.pt/PROMPT_T;
    if(hit>=0){
      if(hit===f.notes[f.i]){const perf=r<.5;f.res.push(perf?2:1);if(perf)f.perfect++;Snd.note(hit,perf);
        noteFx(P.x,P.y-50,NOTE_COL[hit]);f.flash=.2}
      else{f.res.push(0);Snd.sfx('fail')}
      f.state='gap';f.timer=.22;
    }else if(f.pt>=PROMPT_T){f.res.push(0);Snd.sfx('fail');f.state='gap';f.timer=.22}
    return;
  }
  if(f.state==='gap'){
    f.timer-=dt;
    if(f.timer<=0){f.i++;if(f.i>=4)finishFlute();else{f.state='prompt';f.pt=0}}
  }
}
function finishFlute(){
  const g=G,f=g.flute,hits=f.res.filter(x=>x>0).length;g.flute=null;
  if(hits<3){g.fluteCd=2;toast('Off-key! Try the melody again',1.6);Snd.sfx('fail');return}
  const str=1+f.perfect*.25,R=230*str;g.fluteCd=FLUTE_CD;
  Snd.sfx('success');g.pulse=.0;g.ring={x:P.x,y:P.y,r:0,max:R,t:0};
  let grown=0;
  g.plots.forEach((p,i)=>{const[x,y]=plotXY(i);
    if(p.s===2&&p.st<3&&Math.hypot(x-P.x,y-P.y)<R){p.st++;p.gr=0;p.wet=WET_T;p.pop=.5;grown++;noteFx(x,y,'#9cff9c')}});
  let scared=0;
  g.crows.forEach(c=>{if(c.state!=='out'&&Math.hypot(c.x-P.x,c.y-P.y)<R+140){scareCrow(c);scared++}});
  const asleep=g.sprites.filter(s=>!s.awake);
  if(asleep.length&&Math.hypot(HUT.x-P.x,HUT.y-P.y)<R+130){const s=asleep[0];s.awake=true;s.t=0;g.hop=1;Snd.sfx('wake');
    toast('A Harvest Sprite woke up and will water your crops!',3);floatText('!',s.x,s.y-30,GOLD,40)}
  const cw=g.cow;
  if(!cw.given&&!cw.milk&&Math.hypot(cw.x-P.x,cw.y-P.y)<R){cw.milk=true;cw.moo=1;Snd.sfx('moo');Snd.sfx('ready');toast('The cow gave fresh milk!',2.2)}
  else if(grown>0&&!scared)toast(`The melody swells — ${grown} crop${grown>1?'s':''} grew!`,2);
  else if(scared)toast('Shoo! The crow fled from the music',2);
}
function scareCrow(c){c.state='out';c.tx=c.x<W/2?-80:W+80;c.ty=c.y-60;c.fast=true;G.stats.scared++;Snd.sfx('scare');floatText('Shoo!',c.x,c.y-30,CREAM,26)}

/* ---- crows ---- */
function spawnCrow(){
  const g=G,cand=[];g.plots.forEach((p,i)=>{if(p.s===2&&p.st>=1)cand.push(i)});
  if(!cand.length){g.crowT=6;return}
  const i=cand[Math.floor(Math.random()*cand.length)],side=Math.random()<.5?-60:W+60;
  g.crows.push({x:side,y:100+Math.random()*180,state:'in',i,t:0,ph:Math.random()*6,tx:0,ty:0,fast:false,warned:false});
  g.crowT=Math.max(6,13-g.day*1.5)+Math.random()*5;
}
function stepCrows(dt){
  const g=G;
  g.crows=g.crows.filter(c=>{
    c.ph+=dt*14;
    if(c.state==='in'){
      const p=g.plots[c.i];
      if(p.s!==2){c.state='out';c.tx=c.x<W/2?-80:W+80;c.ty=c.y;return true}
      const[tx,ty]=plotXY(c.i),dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy);
      if(d<10){c.state='peck';c.t=2.6;c.x=tx;c.y=ty;Snd.sfx('caw')}
      else{c.x+=dx/d*150*dt;c.y+=dy/d*150*dt}
    }else if(c.state==='peck'){
      c.t-=dt;
      if(Math.hypot(P.x-c.x,P.y-c.y)<62){scareCrow(c);return true}
      if(c.t<=0){const p=g.plots[c.i];
        if(p.s===2){p.s=1;p.st=0;p.gr=0;p.wet=0;g.stats.lost++;toast('A crow ate a crop! Play the flute or run at them',2.4);Snd.sfx('bad');burst(c.x,c.y,'#222',10);if(!SET.calm)g.shake=.25}
        c.state='out';c.tx=c.x<W/2?-80:W+80;c.ty=c.y-120}
    }else{
      const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy)||1,sp=c.fast?330:210;
      c.x+=dx/d*sp*dt;c.y+=dy/d*sp*dt;
      if(c.x<-70||c.x>W+70||c.y<-70)return false;
    }
    return true;
  });
}

/* ---- sprites & cow ---- */
function stepSprites(dt){
  const g=G,taken=new Set(g.sprites.filter(s=>s.job!==null).map(s=>s.job));
  g.sprites.forEach(s=>{
    s.t+=dt;if(!s.awake)return;
    if(s.job===null){
      let best=-1,bd=1e9;
      g.plots.forEach((p,i)=>{if(p.s===2&&p.st<3&&p.wet<=0&&!taken.has(i)){const[x,y]=plotXY(i),d=Math.hypot(x-s.x,y-s.y);if(d<bd){bd=d;best=i}}});
      if(best>=0){s.job=best;taken.add(best);s.wait=.5}
      else{const a=s.t*.6+s.wob*2;s.x+=(1000+Math.cos(a)*60+s.wob*40-s.x)*dt*.8;s.y+=(420+Math.sin(a)*40-s.y)*dt*.8}
    }else{
      const p=g.plots[s.job];
      if(p.s!==2||p.st>=3||p.wet>0){s.job=null;return}
      const[tx,ty]=plotXY(s.job),dx=tx+12-s.x,dy=ty+6-s.y,d=Math.hypot(dx,dy);
      if(d>6){s.x+=dx/d*135*dt;s.y+=dy/d*135*dt}
      else{s.wait-=dt;if(s.wait<=0){p.wet=WET_T;burst(tx,ty,'#7fd6ff',8,60);Snd.sfx('water');s.job=null}}
    }
  });
}
function stepCow(dt){
  const c=G.cow;c.t-=dt;c.moo=Math.max(0,c.moo-dt);
  if(c.t<=0){c.tx=100+Math.random()*190;c.ty=310+Math.random()*125;c.t=2+Math.random()*3}
  const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);
  if(d>4){c.x+=dx/d*28*dt;c.y+=dy/d*28*dt;if(Math.abs(dx)>3)c.dir=dx>0?1:-1}
}

/* ---- player ---- */
function collide(){
  for(const[r0,r1,w,h] of RECTS){
    const cx=Math.max(r0,Math.min(P.x,r0+w)),cy=Math.max(r1,Math.min(P.y,r1+h)),dx=P.x-cx,dy=P.y-cy,d=Math.hypot(dx,dy),R=15;
    if(d<R){if(d===0){P.y=r1+h+R}else{P.x=cx+dx/d*R;P.y=cy+dy/d*R}}
  }
  P.x=Math.max(BOUNDS.x0,Math.min(BOUNDS.x1,P.x));P.y=Math.max(BOUNDS.y0,Math.min(BOUNDS.y1,P.y));
}
function movePlayer(dt,I){
  const tx=I.mx*SPEED,ty=I.my*SPEED,k=Math.min(1,dt*14);
  P.vx+=(tx-P.vx)*k;P.vy+=(ty-P.vy)*k;
  const ox=P.x,oy=P.y;P.x+=P.vx*dt;P.y+=P.vy*dt;collide();
  const mv=Math.hypot(P.x-ox,P.y-oy);P.anim+=mv*.09;P.moved+=mv;
  if(P.moved>140)G.did.move=true;
  if(Math.abs(I.mx)+Math.abs(I.my)>.3){
    if(Math.abs(I.mx)>Math.abs(I.my)*1.15){P.fx=Math.sign(I.mx);P.fy=0}
    else if(Math.abs(I.my)>Math.abs(I.mx)*1.15){P.fx=0;P.fy=Math.sign(I.my)}
  }
  if(I.faceDir){P.fx=I.faceDir[0];P.fy=I.faceDir[1]}
}

/* ---- simulation ---- */
function simulate(dt,I){
  const g=G;g.t+=dt;g.actCd=Math.max(0,g.actCd-dt);g.fluteCd=Math.max(0,g.fluteCd-dt);
  P.act=Math.max(0,P.act-dt);g.shake=Math.max(0,g.shake-dt);g.hop=Math.max(0,g.hop-dt);if(g.pulse)g.pulse=Math.max(0,g.pulse-dt*1.4);
  if(g.toast){g.toast.t-=dt;if(g.toast.t<=0)g.toast=null}
  if(g.ring){g.ring.t+=dt*1.6;if(g.ring.t>=1)g.ring=null}
  if(!g.ambient){
    if(g.flute){movePlayer(dt,emptyInput())}else movePlayer(dt,I);
    if(I.flute&&!g.flute)startFlute();
    if(g.flute)stepFlute(dt,I,I.flute);
    else if((I.actHeld||I.act)&&g.actCd<=0)doAct();
  }
  // plots
  g.plots.forEach(p=>{
    p.pop=Math.max(0,p.pop-dt);
    if(p.wet>0){p.wet-=dt;if(p.s===2&&p.st<3){p.gr+=dt/STAGE_T;if(p.gr>=1){p.st++;p.gr=0;p.pop=.45;if(p.st===3)Snd.sfx('ready')}}}
  });
  stepSprites(dt);stepCow(dt);
  if(!g.ambient){
    g.crowT-=dt;if(g.crowT<=0&&g.crows.length<2&&g.t>20)spawnCrow();
    stepCrows(dt);
    g.dayT+=dt;
    if(g.dayT>=DAY_LEN){
      if(g.day<DAYS){g.daysum={day:g.day,t:0,offered:g.offered};Snd.sfx('ready')}
      else finishGame(false);
    }
  }
  // particles
  g.particles=g.particles.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='dot')p.vy+=240*dt;return p.life>0});
  // tint
  const p=g.dayT/DAY_LEN;
  let tg=p<.1?[255,170,120,.20]:p<.58?[255,255,255,0]:p<.78?[255,200,100,.12]:p<.9?[150,80,180,.28]:[30,40,110,.46];
  if(g.ambient)tg=[255,220,150,.08];
  const T=g.tint,k=Math.min(1,dt*1.5);T.r+=(tg[0]-T.r)*k;T.g+=(tg[1]-T.g)*k;T.b+=(tg[2]-T.b)*k;T.a+=(tg[3]-T.a)*k;
}
function nextDay(){
  const g=G;g.day++;g.dayT=0;g.daysum=null;g.cow.given=false;g.cow.milk=false;g.water=CAN;
  if(!g.demo)g.dialog={lines:[[`Day ${g.day}`,`Dawn breaks over the meadow. ${QUOTA-g.offered} more offerings needed — you can do it!`]],i:0};
  Snd.sfx('wake');
}
function finishGame(win){
  const g=G;g.over={win,t:0,stars:win?(g.t<=215?3:(g.t<=275?2:1)):0,time:g.t};
  Snd.sfx(win?'win':'lose');scene='end';sceneT=0;menus.end=null;
}

/* ============================ BOT (attract mode) ============================ */
function bot(dt){
  const g=G,I=emptyInput(),B=g.bot;
  if(g.flute){
    const f=g.flute;
    if(f.state==='prompt'){const r=1-f.pt/PROMPT_T;
      if(r<.42&&!B.pressed){B.pressed=true;const k=f.notes[f.i];I.face[Math.random()<.1?(k+1)%4:k]=true}
    }else B.pressed=false;
    return I;
  }
  B.pressed=false;
  const go=(x,y,tol=7)=>{const dx=x-P.x,dy=y-P.y,d=Math.hypot(dx,dy);if(d<tol)return true;I.mx=dx/d;I.my=dy/d;return false};
  // crows
  const crow=g.crows.find(c=>c.state!=='out');
  if(crow){
    if(g.fluteCd<=0&&Math.hypot(crow.x-P.x,crow.y-P.y)<230){I.flute=true;return I}
    go(crow.x,crow.y);return I;
  }
  const ripe=g.plots.some(p=>p.s===2&&p.st===3);
  const growing=g.plots.filter(p=>p.s===2&&p.st<3).length;
  if(g.carry>=CARRY||(g.carry>=5&&!ripe)||(g.carry>0&&!ripe&&growing<3)||g.cow.milk&&g.carry>=CARRY-1){
    if(go(ALTAR.x,ALTAR.y+68,10)){I.act=I.actHeld=true;I.faceDir=[0,-1]}return I;
  }
  if(g.cow.milk&&g.carry<CARRY){
    const c=g.cow;if(go(c.x+55,c.y+10,14)||Math.hypot(P.x-c.x,P.y-c.y)<80){I.act=I.actHeld=true}return I;
  }
  const asleep=g.sprites.some(s=>!s.awake);
  if(asleep&&g.fluteCd<=0&&growing>=2){if(go(870,430,14))I.flute=true;return I}
  if(!asleep&&g.fluteCd<=0&&!g.cow.given&&!g.cow.milk&&g.day>=1&&g.t>35){if(go(338,372,14))I.flute=true;return I}
  if(g.water<=0||(g.water<=1&&g.plots.some(p=>p.s===2&&p.st<3&&p.wet<=0))){
    if(go(WELL.x-72,WELL.y+6,10)){I.act=I.actHeld=true;I.faceDir=[1,0]}return I;
  }
  // plot jobs
  let best=-1,bc=1e9;
  g.plots.forEach((p,i)=>{
    let w=null;
    if(p.s===2&&p.st===3&&g.carry<CARRY)w=-160;
    else if(p.s===2&&p.wet<=0&&p.st<3&&g.water>0)w=-90;
    else if(p.s===1)w=-40;
    else if(p.s===0)w=0;
    if(w===null)return;
    const[x,y]=plotXY(i),c=Math.hypot(x-P.x,y+46-P.y)+w;if(c<bc){bc=c;best=i}
  });
  if(best>=0){const[x,y]=plotXY(best);if(go(x,y+46,5)){I.faceDir=[0,-1];I.act=I.actHeld=true}return I}
  if(g.carry>0){if(go(ALTAR.x,ALTAR.y+68,10)){I.act=I.actHeld=true}return I}
  go(640,560,20);return I;
}

function makeMenu(items){return{items,i:0,rects:[]}}
function menuUpdate(m,I,onBack){
  const n=m.items.length,hit=()=>m.rects.findIndex(r=>mouse.x>=r.x&&mouse.x<=r.x+r.w&&mouse.y>=r.y&&mouse.y<=r.y+r.h);
  if(I.nav.up){m.i=(m.i+n-1)%n;Snd.sfx('ui')}
  if(I.nav.down){m.i=(m.i+1)%n;Snd.sfx('ui')}
  if(mouse.moved){mouse.moved=false;const h=hit();if(h>=0&&h!==m.i){m.i=h;Snd.sfx('ui')}}
  if(I.click){
    const h=hit();
    if(h>=0){m.i=h;const c=m.items[h];
      if(c.slider&&c._bar&&mouse.x>=c._bar.x-12){c.set(Math.max(0,Math.min(1,(mouse.x-c._bar.x)/c._bar.w)));Snd.sfx('ui')}
      else if(c.go){Snd.sfx('ok');c.go()}
    }
    return;
  }
  const it=m.items[m.i];
  if(it.slider){
    if(I.nav.left){it.set(Math.max(0,it.get()-.1));Snd.sfx('ui')}
    if(I.nav.right){it.set(Math.min(1,it.get()+.1));Snd.sfx('ui')}
  }
  if(I.act&&it.go){Snd.sfx('ok');it.go()}
  else if(I.back&&onBack){Snd.sfx('back');onBack()}
}

  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  try{
    const I=poll(dt),sc=SCENES[scene];
    X.clearRect(0,0,W,H);
    if(scene==='play'||scene==='end')sc.update(dt,I);else sc.update(I);
    SCENES[scene].draw(now/1000);
    Snd.vol(G&&G.flute?0.35:1);
  }catch(e){console.error(e)}
  requestAnimationFrame(frame);
}

/* touch-only fallback */
(function(){
  const t=document.getElementById('touch'),mus=document.getElementById('tmus'),sfx=document.getElementById('tsfx'),calm=document.getElementById('tcalm');
  const coarse=matchMedia('(hover: none) and (pointer: coarse)').matches;
  const hasPad=navigator.getGamepads&&[...navigator.getGamepads()].some(Boolean);
  if(coarse&&!hasPad){touchOnly=true;t.style.display='flex'}
  mus.value=Math.round(SET.music*10);sfx.value=Math.round(SET.sfx*10);calm.checked=SET.calm;
  mus.oninput=()=>{SET.music=mus.value/10;saveSet();Snd.vol()};
  sfx.oninput=()=>{SET.sfx=sfx.value/10;saveSet();Snd.vol()};
  calm.onchange=()=>{SET.calm=calm.checked;saveSet()};
  const panelEl=document.getElementById('tpanel'),btn=document.getElementById('tset');
  btn.onclick=()=>{panelEl.style.display='flex';btn.style.display='none';Snd.init();Snd.resume()};
  document.getElementById('tclose').onclick=()=>{panelEl.style.display='none';btn.style.display=''};
})();

renderStatics();
buildMenus();titleWorld();resize();
requestAnimationFrame(frame);
</script>
