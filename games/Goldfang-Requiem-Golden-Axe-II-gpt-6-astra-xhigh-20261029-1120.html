<script>/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<style>:root {
  color-scheme: dark;
  --ink: #0c171d;
  --cream: #f4ebd0;
  --muted: #a8b6b7;

}
* {

}
body {

}
button,
input {
  font: inherit;
}
button {

  cursor: pointer;
}
button:disabled {

}

  height: 100%;

}

  z-index: 6;
}

  left: 0;

  gap: 28px;

  pointer-events: none;
}
.brandmark {
  color: var(--gold);
}
#topstatus {
  color: #c7d3cd99;
  margin-left: auto;
  font-size: 10px;
}
#quickSettings {
  pointer-events: auto;
  width: 40px;
  height: 40px;
  display: grid;

  inset: 0;

    seed = (seed + 0x6d2b79f5) | 0;

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

function cleanRun() {
  for (const a of [...players, ...enemies]) removeActor(a);
  for (const p of [...props, ...pickups]) {
    p.mesh?.removeFromParent();
    if (p.body) world.removeRigidBody(p.body);
  }
  for (const e of effects) e.mesh.removeFromParent();
  for (const p of projectiles) p.mesh.removeFromParent();
  mount?.mesh.removeFromParent();
  thief?.mesh.removeFromParent();
  for (const h of hazards) h.mesh.removeFromParent();
  players = [];
  enemies = [];
  props = [];
  pickups = [];
  effects = [];
  projectiles = [];
  hazards = [];
  mount = null;
  thief = null;
  uid = 100;
}
function makeProp(x, z, type = 'urn') {
  const mesh = group(actorsGroup, x, 0, z);
  if (type === 'urn') {
    shape(mesh, 'sphere', 0xa36d49, 0, 0.45, 0, 0.38, 0.5, 0.38, true);
    shape(mesh, 'cylinder', COLORS.gold, 0, 0.85, 0, 0.23, 0.14, 0.23);
    shape(mesh, 'cylinder', 0x382a23, 0, 0.94, 0, 0.14, 0.04, 0.14);
  } else {
    shape(mesh, 'box', COLORS.wood, 0, 0.4, 0, 0.9, 0.8, 0.7, true);
    for (const s of [-1, 1])
      shape(mesh, 'box', COLORS.gold, s * 0.32, 0.42, 0, 0.07, 0.83, 0.73);
    shape(mesh, 'box', COLORS.gold, 0, 0.5, 0.38, 0.14, 0.18, 0.05);
  }
  props.push({ id: uid++, x, z, type, hp: 30, mesh });
}
function makePickup(x, z, type = 'potion', id = null) {
  const mesh = group(actorsGroup, x, 0.5, z);
  if (type === 'potion') {
    shape(mesh, 'sphere', 0x75c7bc, 0, 0, 0, 0.16, 0.21, 0.16, true);
    shape(mesh, 'cylinder', COLORS.gold, 0, 0.23, 0, 0.075, 0.12, 0.075);
    shape(mesh, 'box', 0xdef6d7, 0, 0.03, 0.15, 0.08, 0.1, 0.01);
  } else if (type === 'food') {
    shape(mesh, 'sphere', 0xc7844f, 0, 0, 0, 0.25, 0.18, 0.2, true);
    shape(
      mesh,
      'cylinder',
      COLORS.cream,
      0.21,
      0,
      0,
      0.06,
      0.3,
      0.06,
    ).rotation.z = Math.PI / 2;
  } else {
    shape(mesh, 'crystal', COLORS.gold, 0, 0, 0, 0.2, 0.25, 0.2, true);
  }
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.25, 0.28, 20),
    basic(type === 'potion' ? 0x96ead9 : COLORS.gold, 0.6),
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = -0.45;
  mesh.add(ring);
  const p = { id: id ?? uid++, x, z, type, mesh, age: 0 };
  pickups.push(p);
  return p;
}
function spawnMount(x = 40, z = 1.7) {
  const mesh = makeDrake();
  mesh.position.set(x, 0, z);
  mesh.rotation.y = Math.PI / 2;
  actorsGroup.add(mesh);
  mount = { x, z, mesh, rider: null, hp: 100, breath: 0 };
}
function spawnThief() {
  const mesh = makeRig('hero', 2);
  mesh.scale.setScalar(0.48);
  actorsGroup.add(mesh);
  mesh.traverse((o) => {
    if (o.isMesh && o.material?.color && o.material !== ink)
      o.material = material(0x5c9f9b);
  });
  thief = { x: 62, z: 1, mesh, hits: 0, cooldown: 0 };
}
function makeHazard(x, z) {
  const mesh = new THREE.Mesh(
    new THREE.RingGeometry(0.7, 1.03, 32),
    basic(0xff925b, 0.3),
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x, 0.04, z);
  actorsGroup.add(mesh);
  hazards.push({ x, z, mesh, phase: (x % 7) * 0.3, hit: new Set() });
  shape(stageGroup, 'cylinder', 0x3c4547, x, 0.015, z, 0.65, 0.06, 0.65);
}

function startRun({ attract = false, checkpoint = 0, network = false } = {}) {
  cleanRun();
  S.runId++;
  S.mode = attract ? 'attract' : 'play';
  S.menu = null;
  S.paused = false;
  S.stopped = false;
  S.win = false;
  S.time = 0;
  S.elapsed = 0;
  S.encounter = checkpoint;
  S.checkpoint = checkpoint;
  S.cleared = false;
  S.score = 0;
  S.kills = 0;
  S.combo = 0;
  S.bestCombo = 0;
  S.revives = 2;
  S.damageTaken = 0;
  S.spells = 0;
  S.attractTime = 0;
  S.campTime = 0;
  const startX = ENCOUNTERS[checkpoint].x - 8;
  const seats = network
    ? net.players
    : attract
      ? [{ id: 0 }, { id: 1 }, { id: 2 }]
      : S.coop
        ? [{ id: 0 }, { id: 1 }]
        : [{ id: 0 }];
  for (const seat of seats) {
    const p = newActor(
      'hero',
      startX - (seat.id % 2) * 1.3,
      -1.5 + (seat.id % 4),
      network
        ? seat.id % 3
        : attract
          ? seat.id % 3
          : seat.id === 0
            ? S.hero
            : (S.hero + 1) % 3,
      seat.id,
    );
    p.name = seat.name || HEROES[p.hero].name;
    players.push(p);
  }
  cameraX = startX + 4;
  for (let x = 9; x < 132; x += 11) {
    makeProp(x, ((x % 3) - 1) * 2.8, x % 2 ? 'urn' : 'chest');
  }
  for (const [x, z] of [
    [15, -2.8],
    [33, 2.8],
    [52, -2.4],
    [87, -3],
    [110, 3],
  ])
    makePickup(x, z, 'potion');
  spawnMount(checkpoint > 2 ? ENCOUNTERS[checkpoint].x - 6 : 40);
  for (const [x, z] of [
    [73, -1.5],
    [81, 1.8],
    [92, -2],
    [99, 2.5],
  ])
    makeHazard(x, z);
  if (!network || net.isHost) spawnEncounter();
  else S.cleared = false;
  $('#menu').innerHTML = '';
  $('#hud').classList.remove('hidden');
  $('#topline').style.display = 'none';
  $('#attract').classList.toggle('hidden', !attract);
  $('#controls').style.display = attract ? 'none' : 'flex';
  updateHud(true);
  sound.intensity = 1;
  sound.quiet(false);
  S.lastInput = performance.now();
}
function spawnEncounter() {
  const e = ENCOUNTERS[S.encounter];
  sound.intensity = e.camp ? 0 : S.encounter === 7 ? 2 : 1;
  S.cleared = false;
  S.campTime = 0;
  S.checkpoint = S.encounter === 3 ? 3 : S.encounter === 6 ? 6 : S.checkpoint;
  for (const a of enemies) removeActor(a);
  enemies = [];
  if (e.camp) {
    spawnThief();
    announce('A BREATH BEFORE THE STORM', e.name, e.tip, 6);
    return;
  }
  const n = Math.max(0, players.length - 1);
  const types = [...e.types];
  if (n && S.encounter < 7)
    for (let i = 0; i < n; i++) types.push(i % 2 ? 'archer' : 'raider');
  types.forEach((kind, i) => {
    const a = newActor(kind, e.x + 2 + (i % 3) * 1.5, -2.3 + (i % 4) * 1.5);
    a.cooldown = 1 + i * 0.22;
    if (kind === 'boss') {
      a.maxHp = a.hp = 900 + players.length * 180;
      a.phaseTimer = 3;
    }
    enemies.push(a);
  });
  announce(
    `CHAPTER ${CHAPTERS[e.chapter][0]} · ${S.encounter + 1} / 8`,
    e.name,
    e.tip,
    5,
  );
  say(e.line);
}
function announce(eyebrow, title, sub = '', duration = 3) {
  $('#announcement .eyebrow').textContent = eyebrow;
  $('#announcement h2').textContent = title;
  $('#announcement p').textContent = sub;
  $('#announcement').style.opacity = '1';
  S.announceUntil = performance.now() + duration * 1000;
}
function toast(t, d = 3) {
  $('#toast').textContent = t;
  $('#toast').style.opacity = '1';
  S.toastUntil = performance.now() + d * 1000;
}
function say(t) {
  $('#subtitles').textContent = t;
  $('#subtitles').style.opacity = '1';
  S.subtitleUntil = performance.now() + 4500;
  sound.speak((Math.floor(S.time) % 7) + 1);
}

function particle(x, y, z, color, n = 10, speed = 3) {
  for (let i = 0; i < n; i++) {
    const mesh = new THREE.Mesh(
      geometry(i % 3 ? 'crystal' : 'box'),
      basic(color),
    );
    const size = rnd(0.04, 0.14);
    mesh.scale.setScalar(size);
    mesh.position.set(x, y, z);
    fxGroup.add(mesh);
    effects.push({
      kind: 'particle',
      mesh,
      life: rnd(0.3, 0.65),
      max: 0.65,
      vx: rnd(-speed, speed),
      vy: rnd(1, speed + 2),
      vz: rnd(-speed, speed),
      gravity: 8,
    });
  }
}
function ringEffect(x, z, color, radius = 2, life = 0.4) {
  const mesh = new THREE.Mesh(
    new THREE.RingGeometry(0.9, 1, 48),
    basic(color, 0.85),
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x, 0.08, z);
  fxGroup.add(mesh);
  effects.push({ kind: 'ring', mesh, life, max: life, radius });
}
function slash(a, heavy = false) {
  const mesh = new THREE.Mesh(
    new THREE.RingGeometry(
      heavy ? 1.2 : 0.9,
      heavy ? 1.55 : 1.2,
      24,
      1,
      -1.1,
      2.2,
    ),
    basic(a.kind === 'hero' ? COLORS.cream : 0xff997d, 0.85),
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.rotation.z = a.face > 0 ? 0 : Math.PI;
  mesh.position.set(a.x, a.y + 1.3, a.z);
  fxGroup.add(mesh);
  effects.push({ kind: 'slash', mesh, life: 0.16, max: 0.16 });
}
function burstDebris(x, z, color = COLORS.stone) {
  for (let i = 0; i < 6; i++) {
    const m = new THREE.Mesh(geometry('box'), material(color));
    m.scale.set(rnd(0.1, 0.3), rnd(0.1, 0.25), rnd(0.1, 0.3));
    m.castShadow = true;
    actorsGroup.add(m);
    const b = world.createRigidBody(
      RAPIER.RigidBodyDesc.dynamic()
        .setTranslation(x + rnd(-0.2, 0.2), 0.5, z + rnd(-0.2, 0.2))
        .setLinvel(rnd(-3, 3), rnd(2, 5), rnd(-3, 3))
        .setAngvel({ x: rnd(-4, 4), y: rnd(-4, 4), z: rnd(-4, 4) }),
    );
    world.createCollider(
      RAPIER.ColliderDesc.cuboid(m.scale.x / 2, m.scale.y / 2, m.scale.z / 2)
        .setRestitution(0.3)
        .setCollisionGroups(0x00040001),
      b,
    );
    effects.push({ kind: 'debris', mesh: m, body: b, life: 2.5, max: 2.5 });
  }
}
function rumble(strong = 0.4, duration = 100) {
  if (settings.reducedFlash) return;
  for (const g of navigator.getGamepads?.() || [])
    g?.vibrationActuator
      ?.playEffect?.('dual-rumble', {
        duration,
        strongMagnitude: strong,
        weakMagnitude: strong * 0.5,
      })
      .catch(() => {});
}
function impact(x, z, heavy = false) {
  particle(x, 1, z, 0xffdf8a, heavy ? 15 : 7);
  S.shake = Math.max(S.shake, heavy ? 0.23 : 0.08);
  S.hitstop = heavy ? 0.075 : 0.035;
  sound.sfx('hit');
  rumble(heavy ? 0.6 : 0.25);
}

function beginAction(a, kind) {
  if (a.dead || a.down > 0) return false;
  if (kind === 'guard') {
    a.guard = true;
    return true;
  }
  if (a.action !== 'idle' && !(kind === 'dodge' && a.action === 'attack'))
    return false;
  if (a.cooldown > 0 && kind !== 'jump' && kind !== 'dodge' && kind !== 'magic')
    return false;
  if (kind === 'jump') {
    if (a.y > 0.05) return false;
    a.vy = 7.8;
    sound.sfx('jump');
    return true;
  }
  if (kind === 'dodge') {
    a.action = 'dodge';
    a.timer = 0.32;
    a.invuln = 0.4;
    a.cooldown = 0.42;
    a.actionAge = 0;
    sound.sfx('dodge');
    ringEffect(a.x, a.z, 0xc6ece3, 1, 0.25);
    return true;
  }
  if (kind === 'magic') {
    if (a.potions < 1) {
      if (a.id === localId())
        toast('Find blue potions in urns or catch the thief.');
      return false;
    }
    castMagic(a);
    return true;
  }
  if (kind === 'attack' || kind === 'heavy') {
    if (a.mounted) {
      if (a.cooldown <= 0) {
        breathe(a);
        a.cooldown = 0.85;
      }
      return true;
    }
    a.combo = S.time - a.lastStrike < 1.3 ? (a.combo + 1) % 3 : 0;
    a.lastStrike = S.time;
    a.action = kind;
    a.timer = kind === 'heavy' ? 0.7 : 0.38;
    a.actionAge = 0;
    a.hitSet.clear();
    a.attackSeq++;
    a.cooldown = kind === 'heavy' ? 0.7 : 0.28;
    a.dashAttack = a.runTime > 0.5;
    a.guard = false;
    sound.sfx('swing');
    slash(a, kind === 'heavy' || a.combo === 2);
    if (a.y > 0.3) {
      a.vy = Math.min(a.vy, -2);
      a.plunge = true;
    }
    return true;
  }
  return false;
}
function castMagic(a) {
  const power = a.potions;
  a.lastMagicPower = power;
  a.potions = 0;
  a.action = 'magic';
  a.actionAge = 0;
  a.timer = 1.25;
  a.invuln = 1.8;
  S.spells++;
  const c = HEROES[a.hero].spellColor;
  ringEffect(a.x, a.z, c, 8 + power * 1.2, 1.2);
  particle(a.x, 1, a.z, c, 38, 7);
  if (!settings.reducedFlash) {
    $('#flash').style.opacity = '.28';
    setTimeout(() => ($('#flash').style.opacity = '0'), 110);
  }
  S.shake = 0.4;
  sound.sfx('magic');
  if (a.id === localId() || S.mode === 'attract')
    announce(
      `${power} POTION${power > 1 ? 'S' : ''} · ${power >= 5 ? 'CATACLYSM' : power >= 3 ? 'GREATER MAGIC' : 'RUNE MAGIC'}`,
      HEROES[a.hero].magic,
      '',
      2,
    );
  for (let i = 0; i < 8 + power * 2; i++) {
    const x = a.x + rnd(-8, 8),
      z = rnd(-3.6, 3.6);
    const mesh = shape(
      fxGroup,
      a.hero === 1 ? 'crystal' : 'cone',
      c,
      x,
      1,
      z,
      0.22,
      rnd(2, 5),
      0.22,
    );
    mesh.material = basic(c, 0.85);
    effects.push({ kind: 'pillar', mesh, life: rnd(0.5, 1.2), max: 1.2 });
  }
  if (authority())
    for (const e of enemies)
      if (!e.dead && Math.abs(e.x - a.x) < 11) {
        damage(e, 36 + power * 24, a, 'magic');
      }
  a.attackSeq++;
}
function breathe(a) {
  sound.sfx('fire');
  a.action = 'breath';
  a.actionAge = 0;
  a.timer = 0.55;
  mount && (mount.breath = 0.6);
  const c = 0xffad56;
  for (let i = 0; i < 22; i++)
    particle(
      a.x + a.face * (1 + i * 0.14),
      0.9 + rnd(0, 0.5),
      a.z + rnd(-0.4, 0.4),
      i % 2 ? c : 0xffe0a0,
      1,
      2,
    );
  if (authority())
    for (const e of enemies)
      if (
        !e.dead &&
        (e.x - a.x) * a.face > -0.3 &&
        (e.x - a.x) * a.face < 5 &&
        Math.abs(e.z - a.z) < 1.7
      )
        damage(e, 34, a, 'fire');
  a.attackSeq++;
}
function attackHits(a) {
  if (a.hitSet.has('done')) return;
  const windup = a.action === 'heavy' ? 0.24 : 0.1;
  if (a.actionAge < windup) return;
  a.hitSet.add('done');
  const heavy = a.action === 'heavy' || a.combo === 2 || a.plunge;
  const range = a.hero === 1 ? 2.3 : 1.85;
  const dmg =
    a.damage *
    (a.action === 'heavy' ? 1.9 : a.combo === 2 ? 1.45 : 1) *
    (a.plunge ? 1.3 : 1) *
    (a.dashAttack ? 1.3 : 1);
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = e.x - a.x,
      dz = e.z - a.z;
    if (
      Math.abs(dx) < range + (e.kind === 'boss' ? 0.7 : 0) &&
      Math.abs(dz) < 1.05 &&
      (dx * a.face > -0.55 || a.plunge) &&
      a.y < 2.4
    ) {
      if (e.kind === 'shield' && !heavy && e.stun <= 0 && e.face !== a.face) {
        particle(e.x, 1, e.z, 0xa8d8d3, 6);
        sound.sfx('parry');
        e.stun = 0.12;
        toast('SHIELDED · Heavy strike or attack from behind', 1.8);
      } else damage(e, dmg, a, heavy ? 'heavy' : 'strike');
    }
  }
  for (const p of [...props])
    if (
      Math.abs(p.x - a.x) < range &&
      Math.abs(p.z - a.z) < 1.1 &&
      (p.x - a.x) * a.face > -0.5
    ) {
      p.hp -= dmg;
      if (p.hp <= 0) {
        p.mesh.removeFromParent();
        props.splice(props.indexOf(p), 1);
        burstDebris(p.x, p.z, COLORS.wood);
        makePickup(p.x, p.z, p.type === 'chest' ? 'food' : 'potion');
        if (p.type === 'chest') makePickup(p.x + 0.5, p.z, 'gold');
        sound.sfx('hit');
      }
    }
  if (
    thief &&
    thief.cooldown <= 0 &&
    Math.abs(thief.x - a.x) < 2 &&
    Math.abs(thief.z - a.z) < 1.5
  ) {
    thief.hits++;
    thief.cooldown = 0.8;
    makePickup(thief.x, thief.z, 'potion');
    particle(thief.x, 0.8, thief.z, 0x92e1c6, 10);
    sound.speak(4);
    if (thief.hits >= 6) {
      thief.mesh.removeFromParent();
      thief = null;
      S.campTime = 20;
    }
  }
  a.plunge = false;
}
function damage(target, amount, source, kind = 'strike') {
  if (target.dead || target.down > 0 || target.invuln > 0) return false;
  const player = target.kind === 'hero';
  if (player && target.guard && target.y < 0.2) {
    if (target.guardAge < 0.23) {
      sound.sfx('parry');
      ringEffect(target.x, target.z, 0xb5ffe7, 2.4, 0.3);
      particle(target.x, 1, target.z, 0xb5ffe7, 15);
      if (source) {
        source.stun = 1.1;
        source.action = 'idle';
        source.timer = 0;
      }
      target.potions = Math.min(
        6,
        target.potions + (Math.random() < 0.35 ? 1 : 0),
      );
      target.invuln = 0.3;
      S.score += 40;
      toast('PERFECT PARRY', 1.2);
      return false;
    }
    amount *= 0.2;
    sound.sfx('parry');
  }
  if (player && S.mode === 'attract') amount = 0;
  if (target.mounted && mount) {
    mount.hp -= amount;
    if (mount.hp <= 0) {
      dismount(target);
      mount.hp = 60;
      toast('Unseated! The drake is still yours to reclaim.');
    }
    amount *= 0.4;
  }
  target.hp = Math.max(0, target.hp - amount);
  target.invuln = player ? 0.65 : 0.12;
  target.stun = player ? 0.18 : kind === 'heavy' ? 0.7 : 0.28;
  target.knockX =
    (source ? Math.sign(target.x - source.x) : 1) * (kind === 'heavy' ? 7 : 3);
  target.knockZ = source ? (target.z - source.z) * 1.3 : 0;
  impact(target.x, target.z, kind === 'heavy' || kind === 'magic');
  if (player) {
    S.damageTaken += amount;
    S.combo = 0;
    if (target.hp <= 0) {
      target.down = 8;
      target.action = 'down';
      target.mounted && dismount(target);
      say('Rise, oathbound. Your tale is not yet told.');
    }
  } else {
    S.combo++;
    S.comboTimer = 2;
    S.bestCombo = Math.max(S.bestCombo, S.combo);
    S.score += Math.round(amount);
    if (target.hp <= 0) {
      target.dead = true;
      target.action = 'dead';
      target.timer = 1.2;
      S.kills++;
      S.score +=
        target.kind === 'boss' ? 1500 : target.kind === 'brute' ? 200 : 100;
      burstDebris(
        target.x,
        target.z,
        target.kind === 'boss' ? COLORS.gold : COLORS.stone,
      );
      sound.sfx('death');
      if (Math.random() < 0.32 || target.kind === 'brute')
        makePickup(target.x, target.z, Math.random() < 0.3 ? 'food' : 'potion');
    }
  }
  return true;
}

function interact(a) {
  if (a.down > 0) return;
  const fallen = players.find(
    (p) => p !== a && p.down > 0 && Math.hypot(p.x - a.x, p.z - a.z) < 2.4,
  );
  if (fallen) {
    fallen.down = 0;
    fallen.hp = fallen.maxHp * 0.55;
    fallen.invuln = 2;
    fallen.action = 'idle';
    S.score += 150;
    ringEffect(fallen.x, fallen.z, 0xa8ffe4, 2, 0.5);
    sound.sfx('pickup');
    toast('Oath renewed · Ally revived');
    return;
  }
  if (a.mounted) {
    dismount(a);
    return;
  }
  if (
    mount &&
    mount.rider === null &&
    Math.hypot(mount.x - a.x, mount.z - a.z) < 2.7
  ) {
    mount.rider = a.id;
    a.mounted = true;
    a.invuln = 0.8;
    sound.speak(2);
    toast('SUN DRAKE · Strike to breathe fire · Interact to dismount', 4);
    return;
  }
  if (S.encounter === 3 && Math.abs(a.x - 61) < 6 && !a.perk) {
    a.perk = true;
    a.maxHp += 20;
    a.hp = a.maxHp;
    a.potions = Math.min(6, a.potions + 2);

      e.mesh.position.copy(p);

    } else if (e.kind === 'ring' || e.kind === 'shockwave') {
      const r = 1 + (1 - ratio) * e.radius;
      e.mesh.scale.setScalar(r);
      e.mesh.material.opacity = ratio * 0.8;
      if (e.kind === 'shockwave' && auth) {
        for (const p of players) {
          const d = Math.hypot(p.x - e.x, p.z - e.z);
          if (!e.hit.has(p.id) && Math.abs(d - r) < 0.6 && p.y < 0.75) {
            e.hit.add(p.id);
            damage(p, 22, e.owner, 'heavy');

function animateActor(a, dt) {
  const rig = a.rig,
    d = rig.userData;
  let x = a.x,
    z = a.z;
  if (a.netTarget && a.id !== localId()) {
    x = lerp(rig.position.x, a.x, 1 - Math.exp(-dt * 14));
    z = lerp(rig.position.z, a.z, 1 - Math.exp(-dt * 14));
  }
  rig.position.set(x, a.y + (a.mounted ? 1.18 : 0), z);
  rig.visible = !(a.dead && a.timer < -0.7);
  d.ring.visible = !a.dead && !a.mounted;
  d.shadow.visible = !a.mounted;
  if (d.hpbar) {
    d.hpbar.visible = a.hp < a.maxHp && !a.dead;
    d.hpfill.scale.x = Math.max(0, a.hp / a.maxHp);
    d.hpfill.position.x = -(1 - a.hp / a.maxHp) * 0.42;
  }

  d.pivot.rotation.y = lerp(
    d.pivot.rotation.y,
    desiredYaw,
    1 - Math.exp(-dt * 15),
  );
  const moving =
    Math.abs(a.moveX) + Math.abs(a.moveZ) > 0.1 && a.action === 'idle';
  const stride =
    Math.sin(S.time * (a.kind === 'hero' ? 11 : 8) + a.id) *
    0.6 *
    (moving ? 1 : 0);
  d.body.position.y =
    d.baseY +
    (moving
      ? Math.abs(Math.sin(S.time * 11)) * 0.055

  d.body.rotation.set(0, 0, 0);
  d.head.rotation.x = 0;
  d.arms[0].rotation.set(stride * 0.65, 0, -0.08);
  d.arms[1].rotation.set(-stride * 0.65, 0, 0.08);
  d.legs[0].rotation.x = stride;
  d.legs[1].rotation.x = -stride;
  d.pivot.rotation.z = 0;
  if (a.action === 'attack' || a.action === 'heavy') {
    const p = clamp(a.actionAge / (a.action === 'heavy' ? 0.7 : 0.38), 0, 1);
    d.body.rotation.y = Math.sin(p * Math.PI) * 1.2 * (a.combo % 2 ? -1 : 1);

    d.arms[1].rotation.z = 0.7 * Math.sin(p * Math.PI);
    d.arms[0].rotation.x = -0.8;
  }
  if (a.action === 'windup') {
    d.arms[1].rotation.x = -2.6;
    d.body.rotation.z = -0.12;
    d.head.rotation.x = -0.15;
    d.ring.material.color.setHex(0xff7759);
    d.ring.scale.setScalar(1 + Math.sin(S.time * 20) * 0.12);
  } else {
    d.ring.scale.setScalar(1);
    d.ring.material.color.setHex(
      a.kind === 'hero'
        ? [0xf1d081, 0x80d4ee, 0x9ced92, 0xf5a7de][a.id % 4]
        : 0xf18a67,
    );
  }
  if (a.action === 'dodge') {
    d.body.rotation.x = 0.7;
    d.arms[0].rotation.x = -1;
    d.arms[1].rotation.x = -1;
    d.body.position.y -= 0.35;
  }
  if (a.guard) {
    d.arms[0].rotation.x = -1.5;
    d.arms[1].rotation.x = -1.4;
    d.body.rotation.x = 0.15;
  }
  if (a.action === 'magic') {
    d.arms[0].rotation.z = 2.2;
    d.arms[1].rotation.z = -2.2;
    d.head.rotation.x = -0.25;
    rig.position.y += Math.sin(clamp(a.actionAge, 0, 1) * Math.PI) * 0.4;
  }
  if (a.mounted) {
    d.legs[0].rotation.z = 0.5;
    d.legs[1].rotation.z = -0.5;
  } else {
    d.legs[0].rotation.z = 0;
    d.legs[1].rotation.z = 0;
  }
  if (a.down > 0 || a.dead) {
    d.pivot.rotation.z = -1.35;
    d.pivot.position.y = 0.4;
    d.ring.visible = false;
  } else {
    d.pivot.position.y = 0;
  }
  if (a.invuln > 0 && a.kind === 'hero' && a.action !== 'magic')
    d.pivot.visible = Math.floor(S.time * 18) % 2 === 0;
  else d.pivot.visible = true;
}

function renderScene(dt) {
  if (!renderer) return;
  for (const a of [...players, ...enemies]) animateActor(a, dt);
  for (const d of decor) {
    if (d.userData.flame) {
      d.scale.y = 0.5 + Math.sin(frameNow * 8 + d.position.x) * 0.12;
      d.rotation.y += dt;
    } else d.rotation.y = Math.sin(frameNow * 1.4 + d.userData.wave) * 0.1;
  }
  let targetX;
  if (S.mode === 'title' || S.mode === 'loading') {
    targetX = 9.7;
    camera.position.set(targetX, 9.4, 17.5);
    camera.lookAt(targetX + 1.1, 1.7, 0);
    camera.zoom = 1.02;
    camera.updateProjectionMatrix();
  } else {
    const alive = players.filter((p) => !p.dead);
    const local = players.find((p) => p.id === localId());
    targetX =
      net && local
        ? local.x + 3
        : alive.length
          ? alive.reduce((n, p) => n + p.x, 0) / alive.length + 3
          : cameraX;
    cameraX = lerp(cameraX, clamp(targetX, 7, 137), 1 - Math.exp(-dt * 4));
    const shake = settings.reducedFlash ? 0 : S.shake;
    camera.position.set(
      cameraX + rnd(-shake, shake),
      10.6 + rnd(-shake, shake),
      18,
    );
    camera.lookAt(cameraX, 1.1, 0);
    camera.zoom = 1.1;
    camera.updateProjectionMatrix();
  }
  const zone = S.mode === 'title' ? 0 : ENCOUNTERS[S.encounter].chapter;
  scene.background.lerp(
    new THREE.Color([0x6d9893, 0x9a796b, 0x667f97][zone]),
    1 - Math.exp(-dt * 2),
  );
  scene.fog.color.copy(scene.background);
  sun.color.lerp(
    new THREE.Color([0xffd89e, 0xffba7d, 0xc7d8f1][zone]),
    1 - Math.exp(-dt * 2),
  );
  S.shake *= Math.exp(-dt * 12);
  sun.position.set(cameraX - 8, 15, 8);
  sun.target.position.set(cameraX, 0, 0);
  sun.target.updateMatrixWorld();
  renderer.render(scene, camera);
}

    pressed.has('ArrowDown') ||

    pressed.has('Tab')

    pressed.has('ArrowUp') ||
    pressed.has('KeyW') ||
    pressed.has('ArrowLeft') ||
    pressed.has('KeyA')

    dir = -1;
  if (p && menuRepeat <= 0) {

      x = (p.axes[0] || 0) * (settings.invertX ? -1 : 1);
    if (p.buttons[13]?.pressed || p.buttons[15]?.pressed || y > 0.5 || x > 0.5)
      dir = 1;

      p.buttons[12]?.pressed ||
      p.buttons[14]?.pressed ||
      y < -0.5 ||
      x < -0.5
    )
      dir = -1;

  if (dir) {
    menuIndex = (menuIndex + dir + buttons.length) % buttons.length;
    menuRepeat = 0.19;

    (p && padPressed(p, 1))

// A single world protocol, with an AI Hub adapter and a standalone PeerJS adapter.
function sendEvent(data) {

function snapshot() {
  const r = (n) => Math.round(n * 100) / 100;
  const actor = (a) => [
    a.id,
    a.kind,
    a.hero,
    r(a.x),
    r(a.z),
    r(a.y),
    r(a.hp),
    a.maxHp,
    a.face,
    a.action,
    r(a.timer),
    r(a.actionAge),
    a.potions,
    a.dead ? 1 : 0,
    r(a.down),
    a.mounted ? 1 : 0,
    a.combo,
    r(a.moveX),
    r(a.moveZ),
  ];
  return {
    t: 'state',
    at: AIHub.active ? AIHub.time() : S.time * 1000,
    e: S.encounter,
    c: S.cleared ? 1 : 0,
    s: Math.floor(S.score),
    k: S.kills,
    b: S.bestCombo,
    tm: r(S.time),
    ct: r(S.campTime),
    rv: S.revives,
    p: players.map(actor),
    n: enemies.filter((e) => !e.dead || e.timer > 0).map(actor),
    loot: pickups.slice(-32).map((p) => [p.id, r(p.x), r(p.z), p.type]),
    props: props.map((p) => p.id),
    m: mount ? [r(mount.x), r(mount.z), mount.rider, mount.hp] : null,
    th: thief ? [r(thief.x), r(thief.z), thief.hits] : null,
    bolts: projectiles.map((p) => [r(p.x), r(p.z), r(p.vx), r(p.vz)]),

}
function networkTick(dt) {

  netTimer %= 1 / 12;

    net.send(snapshot(), { reliable: false });
  } else {
    const p = players.find((p) => p.id === net.me);
    if (p)
      net.send(
        {
          t: 'me',
          at: AIHub.active ? AIHub.time() : S.time * 1000,
          x: p.x,
          z: p.z,
          y: p.y,
          face: p.face,
          guard: p.guard,
          guardAge: p.guardAge,
          action: p.action,
          timer: p.timer,
          age: p.actionAge,

function receive(data, from) {
  if (!data || !net) return;
  if (data.t === 'me' && net.isHost) {
    const p = players.find((p) => p.id === from);
    if (!p || p.dead || p.down > 0 || data.at < p.receivedAt) return;
    p.receivedAt = data.at;
    const e = ENCOUNTERS[S.encounter];
    teleport(
      p,
      clamp(+data.x || p.x, e.x - 20, e.x + 17),
      clamp(+data.z || 0, -3.65, 3.65),
    );
    p.y = clamp(+data.y || 0, 0, 4);
    p.face = data.face === -1 ? -1 : 1;
    p.guard = !!data.guard;
    p.guardAge = clamp(+data.guardAge || 0, 0, 20);
    p.moveX = +data.mx || 0;
    p.moveZ = +data.mz || 0;
    if (
      p.action === 'idle' ||
      !['attack', 'heavy', 'magic', 'breath'].includes(p.action)
    ) {
      p.action = [
        'idle',
        'dodge',
        'attack',
        'heavy',
        'magic',
        'breath',
      ].includes(data.action)
        ? data.action
        : 'idle';
      p.timer = clamp(+data.timer || 0, 0, 2);
      p.actionAge = +data.age || 0;
    }
  } else if (data.t === 'action' && net.isHost) {
    const p = players.find((p) => p.id === from);
    if (!p || p.dead || p.down > 0 || data.seq <= p.seenSeq) return;
    p.seenSeq = data.seq;
    p.face = data.face === -1 ? -1 : 1;
    p.action = 'idle';
    p.cooldown = 0;
    if (['attack', 'heavy', 'magic', 'breath'].includes(data.kind)) {
      if (data.kind === 'breath') {
        if (p.mounted) breathe(p);

    const p = players.find((p) => p.id === from);
    if (p) interact(p);

    applySnapshot(data);

    S.score = data.score;
    S.kills = data.kills;
    S.bestCombo = data.best;

async function loadPeer() {
  if (window.Peer) return;
  await new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';
    script.onload = resolve;
    script.onerror = () =>
      reject(
        new Error(
          'The room service could not be loaded. Check your connection and retry.',
        ),
      );
    document.head.append(script);
  });
}
function createPeer(id) {
  return new Promise((resolve, reject) => {
    const p = new window.Peer(id, { debug: 0 });
    const timer = setTimeout(() => {
      p.destroy();
      reject(
        new Error(
          'Room service did not answer. Check your connection and retry.',
        ),
      );
    }, 12000);
    p.on('open', () => {
      clearTimeout(timer);
      resolve(p);
    });
    p.on('error', (e) => {
      clearTimeout(timer);
      reject(
        new Error(
          e.type === 'unavailable-id'
            ? 'That room code is in use. Host again for a new code.'
            : `Connection unavailable (${e.type}). Retry or use local co-op.`,
        ),
      );
    });
  });
}

    players: roomPlayers,
    send: (d) => {
      for (const c of connections.values()) if (c.open) c.send(d);
    },
  };
  renderRoom();
  $('#roomStart').disabled = true;
  try {
    await loadPeer();
    const p = await createPeer('goldfang-r1-' + roomCode);
    if (generation !== peerGeneration) {
      p.destroy();
      return;
    }
    peer = p;
    roomStatus = 'Covenant open · Up to four heroes · WebRTC';
    renderRoom();
    p.on('connection', (c) => {
      if (S.mode !== 'title' || roomPlayers.length >= 4) {
        c.on('open', () => {
          c.send({ t: 'full' });
          setTimeout(() => c.close(), 300);
        });
        return;
      }
      const taken = new Set(roomPlayers.map((p) => p.id));
      const id = [1, 2, 3].find((i) => !taken.has(i));
      const entry = {
        id,
        name: ['Amber Wolf', 'Teal Raven', 'Jade Stag', 'Gold Fox'][id],
        color: ['#e8443a', '#3b82f6', '#22c55e', '#f5b700'][id],
      };
      connections.set(id, c);
      c.on('open', () => {
        roomPlayers.push(entry);
        c.send({ t: 'welcome', id, players: roomPlayers, code: roomCode });
        for (const conn of connections.values())
          conn.send({ t: 'lobby', players: roomPlayers });
        net.players = roomPlayers;
        renderRoom();
      });
      c.on('data', (d) => receive(d, id));
      c.on('close', () => {
        connections.delete(id);
        roomPlayers = roomPlayers.filter((p) => p.id !== id);
        if (S.mode === 'play') playerLeft(id);
        else if (S.menu === 'room') {
          net.players = roomPlayers;
          for (const conn of connections.values())
            conn.send({ t: 'lobby', players: roomPlayers });
          renderRoom();
        }
      });
    });
  } catch (e) {
    if (generation !== peerGeneration) return;
    roomStatus = e.message;
    renderRoom();
    if ($('#roomStart')) $('#roomStart').disabled = true;
  }
}
function joinRoomMenu() {
  roomJoinCode = '';
  drawJoin();
}
function drawJoin() {
  setMenu(
    'join',
    modal(
      'ANSWER THE CALL',
      'Join a covenant',
      'Enter the six-digit room code. Use the on-screen keys with a controller.',
      `<input id="joinCode" aria-label="Six-digit room code" class="roomInput" inputmode="numeric" maxlength="6" value="${escapeHtml(roomJoinCode)}"><div class="codeKeys">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '⌫', 'Clear'].map((k) => `<button data-nav data-digit="${k}">${k}</button>`).join('')}</div><p id="joinStatus" class="connectionStatus" style="margin-top:15px"></p><div class="modalFooter">${btn('Join the party', 'connect', true)}<button data-nav class="textButton" id="joinBack">Back</button></div>`,
    ),
  );
  $$('[data-digit]').forEach(
    (b) =>
      (b.onclick = () => {
        const k = b.dataset.digit;
        roomJoinCode =
          k === 'Clear'
            ? ''
            : k === '⌫'
              ? roomJoinCode.slice(0, -1)
              : (roomJoinCode + k).slice(0, 6);
        $('#joinCode').value = roomJoinCode;
      }),
  );
  $('#joinCode').oninput = (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
    roomJoinCode = e.target.value;
  };
  $('#connect').onclick = () => joinRoom(roomJoinCode);
  $('#joinBack').onclick = () => {
    peerGeneration++;
    peer?.destroy();
    peer = null;
    alliesMenu();
  };
}
async function joinRoom(code) {
  if (!/^\d{6}$/.test(code)) {
    toast('Enter all six digits.');
    return;
  }
  const generation = ++peerGeneration;
  $('#joinStatus').textContent = 'Seeking the covenant…';
  $('#connect').disabled = true;
  try {
    await loadPeer();
    const p = await createPeer();
    if (generation !== peerGeneration) {
      p.destroy();
      return;
    }
    peer = p;
    const c = p.connect('goldfang-r1-' + code, { reliable: true });
    const timer = setTimeout(() => {
      if (S.menu === 'join') {
        $('#joinStatus').textContent =
          'No answer from that room. Check the code and try again.';
        $('#connect').disabled = false;
        c.close();
        p.destroy();
      }
    }, 12000);
    c.on('data', (d) => {
      if (d.t === 'full') {
        clearTimeout(timer);
        $('#joinStatus').textContent =
          'That party is full or already on the road.';
        $('#connect').disabled = false;
        return;
      }
      if (d.t === 'welcome') {
        clearTimeout(timer);
        roomCode = d.code;
        roomPlayers = d.players;
        roomStatus = 'Connected · The host will begin the journey';
        net = {
          me: d.id,
          host: 0,
          isHost: false,
          players: roomPlayers,
          send: (data) => c.open && c.send(data),
        };
        connections.set(0, c);
        renderRoom();
      } else if (d.t === 'lobby') {
        roomPlayers = d.players;
        if (net) net.players = roomPlayers;
        if (S.menu === 'room') renderRoom();
      } else if (d.t === 'start') {
        net.players = d.players;
        lastSnapshot = -Infinity;
        startRun({ network: true });
      } else receive(d, 0);
    });
    c.on('close', () => {
      if (net && !net.isHost) playerLeft(0);
    });
    p.on('error', (e) => {
      if (S.menu === 'join') {
        $('#joinStatus').textContent =
          `Unable to join (${e.type}). Check the code and retry.`;
        $('#connect').disabled = false;
      }
    });
  } catch (e) {
    if ($('#joinStatus')) $('#joinStatus').textContent = e.message;
    if ($('#connect')) $('#connect').disabled = false;
  }
}
function leaveRoom() {
  peerGeneration++;
  const old = peer;
  peer = null;
  net = null;
  connections.clear();
  roomPlayers = [];
  old?.destroy();
  lastSnapshot = -Infinity;
  showTitle();
}

async function setupHub() {
  if (!AIHub.active) return false;
  const info = await AIHub.connect({ mode: 'co-op', seats: [1, 4] });
  if (!info) return false;
  net = {
    me: info.me,
    host: info.host,
    isHost: info.isHost,
    players: info.players,
    server: info.server,
    send: (d, o) => AIHub.send(d, o),
  };
  AIHub.on('message', receive);
  AIHub.on('leave', ({ id }) => playerLeft(id));
  AIHub.on('time-up', () => {
    if (net?.isHost && S.mode !== 'over') finishRun(false);
  });
  AIHub.on('end', () => {
    S.stopped = true;
    sound.quiet(true);
    if (S.mode !== 'over') {
      S.mode = 'over';
      setMenu(
        'over',
        modal(
          'THE CHRONICLE CLOSES',
          'The party rests.',
          'The hub will lead you to the next tale.',
          '',
        ),
      );
    }
  });
  startRun({ network: true });
  AIHub.ready();
  return true;
}
AIHub.probe(() => ({
  scene:
    S.mode === 'loading'
      ? 'ready'
      : S.mode === 'title'
        ? S.menu === 'title'
          ? 'title'
          : 'menu'
        : S.mode === 'over'
          ? 'over'
          : 'play',
  menu: S.menu === 'settings',
  world: S.time,
  input: {
    x: lastInputProbe.x || 0,
    y: lastInputProbe.y || lastInputProbe.z || 0,
    fire: !!(lastInputProbe.fire || lastInputProbe.attack),
  },
}));

function resize() {
  if (!renderer) return;
  const w = innerWidth,
    h = innerHeight,
    aspect = w / h;
  camera.left = -10.2 * aspect;
  camera.right = 10.2 * aspect;
  camera.top = 10.2;
  camera.bottom = -10.2;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
function frame(now) {
  requestAnimationFrame(frame);
  const realDt = Math.min((now - lastNow) / 1000, 0.1);
  lastNow = now;
  frameNow = now / 1000;
  processInput(realDt);
  sound.tick();
  if (booted && !S.stopped) {
    if (S.mode === 'title') {
      S.time += realDt;
      if (!net && S.menu === 'title' && now - S.lastInput >= 10000)
        startRun({ attract: true });
    } else if (
      (S.mode === 'play' || S.mode === 'attract') &&
      !S.paused &&
      (!AIHub.active || AIHub.time() >= 0)
    ) {
      if (S.hitstop > 0) {
        S.hitstop -= realDt;
        updateFx(realDt, authority());
      } else stepWorld(Math.min(realDt, 0.05));
    }
  }
  if (booted) renderScene(realDt);
  if (now > S.announceUntil) $('#announcement').style.opacity = '0';
  if (now > S.toastUntil) $('#toast').style.opacity = '0';
  if (now > S.subtitleUntil) $('#subtitles').style.opacity = '0';
  if (AIHub.active && S.mode === 'play' && AIHub.time() < 0) {
    $('#objective').textContent = Number.isFinite(AIHub.time())
      ? `THE OATH BEGINS IN ${Math.ceil(-AIHub.time() / 1000)}`
      : 'WAITING FOR THE PARTY';
  }
  pressed.clear();
  for (const p of navigator.getGamepads?.() || [])
    if (p)
      padsPrev.set(
        p.index,
        p.buttons.map((b) => b.pressed),
      );
}
async function boot() {
  try {
    applySettings();
    if (!navigator.gpu)
      throw new Error(
        'WebGPU is required. Open this file in a WebGPU-enabled browser on localhost or HTTPS.',
      );
    const adapter = await navigator.gpu.requestAdapter({
      powerPreference: 'high-performance',
    });
    if (!adapter)
      throw new Error(
        'No WebGPU adapter is available. Enable browser hardware acceleration and try again.',
      );
    $('#loadText').textContent = 'Carving the causeway…';
    renderer = new THREE.WebGPURenderer({
      canvas: $('#world'),
      antialias: true,
      alpha: false,
    });
    renderer._getFallback = null;
    await renderer.init();
    if (!renderer.backend.isWebGPUBackend)
      throw new Error(
        'WebGPU initialization failed. This game does not use a WebGL fallback.',
      );
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x6d9893);
    scene.fog = new THREE.Fog(0x6d9893, 38, 82);
    camera = new THREE.OrthographicCamera(-20, 20, 10, -10, 0.1, 150);
    scene.add(new THREE.HemisphereLight(0xd6e9d1, 0x283d4b, 1.8));
    sun = new THREE.DirectionalLight(0xffd89e, 3.0);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -22;
    sun.shadow.camera.right = 22;
    sun.shadow.camera.top = 18;
    sun.shadow.camera.bottom = -18;
    sun.shadow.normalBias = 0.04;
    sun.shadow.bias = -0.0005;
    scene.add(sun, sun.target);
    await RAPIER.init();
    world = new RAPIER.World({ x: 0, y: -20, z: 0 });
    world.createCollider(
      RAPIER.ColliderDesc.cuboid(100, 0.3, 7)
        .setTranslation(70, -0.3, 0)
        .setCollisionGroups(0x00010006),
    );
    actorsGroup = group(scene);
    fxGroup = group(scene);
    buildScenery();
    resize();
    addEventListener('resize', resize);
    $('#loadText').textContent = 'Binding the old magic…';
    showTitle();
    await renderer.compileAsync(scene, camera);
    booted = true;
    $('#loading').classList.add('hidden');
    if (matchMedia('(pointer: coarse)').matches && !keyboardUsed)
      $('#touchNotice').classList.remove('hidden');
    await setupHub();
    requestAnimationFrame(frame);
    window.__GOLDFANG__ = {
      state: S,
      get players() {
        return players;
      },
      get enemies() {
        return enemies;
      },
      get mount() {
        return mount;
      },
      get net() {
        return net;
      },
      get world() {
        return world;
      },
      get renderer() {
        return renderer;
      },
      get scene() {
        return scene;
      },
      get pickups() {
        return pickups;
      },
      startRun,
      showTitle,
      beginAction,
      interact,
      damage,
      stepWorld,
      spawnEncounter,
      teleport,
      finishRun,
      applySnapshot,
      snapshot,
      receive,
      settings,
      openSettings,
      closeSettings,
      readInput,
      hostRoom,
      joinRoom,
      get peer() {
        return peer;
      },
      get connections() {
        return connections;
      },
    };
  } catch (error) {
    console.error(error);
    S.mode = 'error';
    $('#loading h2').textContent = 'The forge needs WebGPU';
    $('#loadText').textContent = error.message;
    $('#loading .loadingRune').style.animation = 'none';
    $('#loading').style.zIndex = 4;
    $('#topline').style.zIndex = 7;
    AIHub.active && AIHub.fail(error.message);
    requestAnimationFrame(frame);
  }
}
boot();
</script>
