## Source Information
- Date: 2026-10-20 19:15
- Source: Starfox 64 for N64 (Nintendo 64, 1997). Macbeth Mayhem is an original spiritual successor: new characters, world, stages, art and code; no Nintendo assets.
- Tech: Three.js r180 (three/webgpu build, WebGPURenderer, no WebGL fallback); Rapier 3D 0.19.3 (@dimforge/rapier3d-compat, WASM) for collision queries, sensors and rigid-body debris; Web Audio API (every sound effect and the music are synthesised live, no audio files); Gamepad API (PS5 DualSense layout, rumble); vanilla JavaScript ES modules bundled into one HTML file by a small Python script; DOM/CSS for HUD and menus; Russo One web font (optional, falls back to system fonts).
- Art Direction: stylized cel-shading. MeshToonMaterial with a 4-step light ramp, inverted-hull ink outlines, posterised sky bands, chunky nearest-filtered ground textures, hard-edged sun shadows, dusk-orange palette.
- Animation: procedural scene-graph animation (no baked clips): hierarchical part rigs (wings, turret heads, boss pods and armour plates), damped springs, easing tweens, state machines and canvas-drawn talking portraits.
- Testing: the prompt placed no restriction on testing; FPS and optimisation targets were declared out of scope. Testing done: headless Chromium (Playwright) with SwiftShader WebGPU, scripted fast-forward simulations of both stages, the boss fight and the attract mode with random and AI input, and render-target screenshots. Real hardware, a physical DualSense and real iOS or Android devices were not available.
- Environment: Claude Code CLI (headless); Linux (WSL2); browser unknown (developed and tested with Playwright Chromium and SwiftShader WebGPU)
- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium
- Usage: estimated cost in USD: unknown (not exposed to the agent); total tokens: about 0.41M (about 406K by the session token-budget counter, no input/output breakdown available); session time: about 51 minutes (19:15 to 20:06)

## Engine Feedback
- What did you like most about the engine? Three.js WebGPURenderer plus its node materials: toon shading, instancing, shadows and fog worked with almost no custom shader code, and one importmap pulls everything from a CDN with no build step. Rapier's query pipeline (shape-overlap tests) was a very convenient way to do projectile, pickup and ramming checks, and real rigid bodies give exploding debris a physical feel for free.
- Did you get stuck or guess wrong? Yes, four times. (1) Headless screenshots of a WebGPU canvas come out blank under SwiftShader, so I render to a RenderTarget and read pixels back. (2) Creating a Rapier rigid body inside an intersectionsWithShape callback throws "recursive use of an object ... aliasing in rust"; the error was swallowed and silently aborted my enemy-death logic until I collected hits first and ran the callbacks afterwards. (3) An InstancedMesh with more than 1000 instances showed stale instance colours on the GPU until the colour attribute was set to DynamicDrawUsage. (4) I guessed a Rapier "updateSceneQueries" call that does not exist in 0.19 and had to read the typings.
- What was the most important thing you had to build yourself? The game framework on top of the libraries: the rail-space coordinate system (path frames, lanes, forks), the entity, projectile and AI layers, the all-range flight model, the Web Audio synth and music sequencer, the controller-first menu and focus system, the input layer with axis-inversion fixes, procedural models, and the attract-mode autopilot.
- What was the hardest part about using the engine? Verifying WebGPU output without a real GPU, and the thinner documentation for the node and TSL material system compared with classic WebGL materials, so I stayed on stable, well-trodden APIs.
- If you had to remove or overhaul one thing from engine, what would that be? Rapier's re-entrancy rules: world mutation during a query callback should be impossible or deferred by the library instead of failing inside wasm.
- If you could change one thing about the engine, what would it be? A built-in, reliable way to capture the WebGPU canvas in headless automation, and a clear warning when an instanced attribute is not being re-uploaded.

## Prompt Feedback
- Prompt: TASK.md, "Starfox 64 for N64" spiritual-successor vertical slice (Three.js r180 WebGPU, Rapier 0.19.3, cel-shaded, 10-foot controller-first, attract mode).
- What did you like most about this prompt? The concrete, checkable requirements: pinned tech stack, exact deliverable name, the 10-second attract mode, the invert-axis toggles for the flaky gamepad, the touch-only message, and the list of reference demos that sets a clear bar for "feature-complete".
- What was confusing? The "[PROMPT]" placeholder in the feedback template; how to write a game title with spaces into the filename pattern; whether the intermittent gamepad inversion is a bug to reproduce or only a setting to provide; and the Usage line, which asks for cost and tokens when an agent can only estimate them.
- What was the hardest thing to do? Fitting a complete vertical slice (a branching rail stage with a boss, an all-range stage with a carrier boss, wingmen, menus, audio, attract mode and tooling) into one session, and validating it without real graphics hardware.
- If there was one test you could have run, what would that test be? A hands-on playthrough with a real PS5 DualSense on a real GPU: check stick mapping and inversion, rumble, frame time under heavy effects, and the 10-foot readability of the HUD on a TV.

  spawn(o) {

  orient(b) {

class RailPath {
  constructor(pts) {

    }

  }
  frame(s) {
    const f = clamp(s / this.length, 0, 1) * this.n, i = Math.min(Math.floor(f), this.n - 1), k = f - i, a = i * 3, b = a + 3;
    const L = (arr, o) => o.set(lerp(arr[a], arr[b], k), lerp(arr[a + 1], arr[b + 1], k), lerp(arr[a + 2], arr[b + 2], k));
    L(this.P, this.p); L(this.T, this.t).normalize(); L(this.R, this.r).normalize(); L(this.U, this.u).normalize();

  }
  world(s, x, y, out) { this.frame(s); return out.copy(this.p).addScaledVector(this.r, x).addScaledVector(this.u, y); }

  }

}

/* ---------- formations ---------- */
function formationOffset(form, i, n, sp) {
  const c = i - (n - 1) / 2;
  switch (form) {
    case 'v': return [c * 6.5, 0, Math.abs(c) * 8];
    case 'column': return [0, 0, i * (sp || 12)];
    case 'circle': { const a = (i / n) * TAU; return [Math.cos(a) * 11, Math.sin(a) * 6, 0]; }
    case 'ring': { const a = (i / n) * TAU; return [Math.cos(a) * 12, Math.sin(a) * 7, i * 4]; }
    case 'wave': return [c * 8, Math.sin(i * 1.3) * 4, 0];
    case 'split': return [i % 2 ? 1 : -1, 0, i * 9];
    default: return [c * 7, 0, 0];
  }
}

    for (let s = fa + 40; s < 3470; s += 60) { path.frame(s); const py = path.p.y; for (const x of [-30, -12]) { path.world(s, x, 0, this.tmp); gb.add('lamp', this.tmp.x, py + 18, this.tmp.z, path.yaw(s), 3, 0.6, 3, 0xffe0a0); } path.world(s, 82 + R(-10, 20), 0, this.tmp); gb.add('lamp', this.tmp.x, 0.2, this.tmp.z, path.yaw(s), 26, 0.4, 40, 0xff6a2a); }
    for (let s = 1850; s < 2450; s += 70) for (const side of [-1, 1]) { path.world(s, side * R(45, 80), 0, this.tmp); gb.add('lamp', this.tmp.x, R(60, 80), this.tmp.z, 0, 4, 4, 4, 0xff8a3a); }
    for (let s = 3500; s < L - 200; s += 160) for (const side of [-1, 1]) { path.world(s, side * 38, 0, this.tmp); gb.add('lamp', this.tmp.x, 12, this.tmp.z, 0, 1.2, 1.2, 1.2, 0xff4a3a); }

  }

  /* ---------- events ---------- */
  trigOf(ev) { return ['say', 'hint', 'banner', 'checkpoint', 'boss'].includes(ev.do) ? ev.at : ev.at - (ev.do === 'fork' ? 250 : ev.do === 'mid' ? 150 : LOOK); }
  laneX() { return this.route === 'A' ? -21 : this.route === 'B' ? 21 : 0; }
  runEvents() {
    const P = this.player;
    for (const ev of this.events) {
      if (ev.done) continue;
      if (ev.route && ev.route !== this.route) { if (this.route) ev.done = true; continue; }
      if (P.s < this.trigOf(ev)) continue;
      ev.done = true; this.fireEvent(ev);

  }
  fireEvent(ev) {
    const P = this.player, lane = ev.route ? this.laneX() : 0;
    switch (ev.do) {
      case 'say': this.say(ev.who, ev.text); break;
      case 'hint': if (Settings.hints && !this.attract) { this.hint = HINTS[ev.id]; this.hintId = ev.id; this.hintT = 0; UI.setHint(this.hint, this); } break;
      case 'banner': if (!this.attract) UI.banner(ev.text, ev.sub); break;
      case 'checkpoint': this.cp = { s: ev.at, route: this.route, name: ev.name }; if (!this.attract) { UI.toast('CHECKPOINT · ' + ev.name.toUpperCase(), 'good'); Game.checkpoint = { stage: this.def.id, s: ev.at, route: this.route }; } break;
      case 'wave': this.spawnWave(Object.assign({ route: ev.route }, ev), ev.at, lane); break;
      case 'obstacle': W.add(new Obstacle(this, ev.kind, ev.x + lane, ev.y, ev.at)); break;
      case 'pickup': W.add(new Pickup(this, ev.kind, ev.at, ev.x + lane, ev.y)); break;
      case 'chase': this.spawnChase(ev.who); break;
      case 'train': this.spawnTrain(ev); break;
      case 'mid': { const e = new Enemy('hecate', { rs: ev.at + 60, rx: 0, ry: 2, x0: 0, y0: 2, holdDist: 78, closing: 22, freq: 1, amp: 0, phase: 0 }); W.add(e); this.spawnedKillable++; UI.banner('WARNING', 'HECATE GUNSHIP'); Sfx.warn(); break; }
      case 'fork': {
        this.forkWall = true; W.add(new Obstacle(this, 'wall', 0, 0, this.def.forkAt, { names: { A: 'CANYON TUNNEL', B: 'FOUNDRY ROW' } })); break;
      }
      case 'boss': this.startBoss(); break;
    }
  }
  spawnWave(ev, s0, lane = 0) {
    const n = ev.n, kind = ev.kind;
    for (let i = 0; i < n; i++) {
      const [dx, dy, ds] = formationOffset(ev.form, i, n, ev.sp);
      const x = (ev.x || 0) + (kind === 'swooper' ? 0 : dx) + lane, y = (ev.y || 0) + dy;
      const base = { rs: s0 + ds + (kind === 'swooper' ? 0 : 0), rx: x, ry: y, x0: x, y0: y, phase: rand(TAU), freq: rand(0.7, 1.3), amp: ev.form === 'line' || ev.form === 'v' ? rand(1.5, 3.5) : rand(3, 6), closing: ev.vs !== undefined ? ev.vs : 18, holdDist: rand(48, 78), noFire: !!ev.slow };
      let e;
      if (kind === 'drone') e = new Enemy('drone', base);
      else if (kind === 'swooper') e = new Enemy('swooper', Object.assign(base, { side: dx > 0 ? 1 : -1, closing: 66, x0: (ev.x || 0) + lane, y0: y, rs: s0 + 60 + i * 12 }));
      else if (kind === 'mine') e = new Enemy('mine', Object.assign(base, { closing: ev.vs !== undefined ? -ev.vs : 5, rs: s0 + ds, y0: y }));
      else if (kind === 'gunship') e = new Enemy('gunship', Object.assign(base, { holdDist: 72, holdT: 24, ry: y + 2, y0: y + 2, x0: x + (ev.n > 1 ? (i ? 14 : -14) : 0) }));
      else if (kind === 'turret') {
        const ps = s0 + ds; this.path.frame(ps); const wy = Math.max(8, this.path.p.y - 4 + rand(-2, 4));
        e = new Enemy('turret', Object.assign(base, { rs: ps, worldY: wy + 1.4, meshDy: 1.4 }));
        part(e.mesh, G.cyl(1.7, 2.4, wy, 8), 0x585069, [0, -wy / 2 + 0.2, 0]);
        e.mesh.userData.parts.head.rotation.order = 'YXZ';

      e.noFire = !!ev.slow; W.add(e); if (e.spec.kill) this.spawnedKillable++;

  spawnChase(who) {
    const w = W.allies.find((a) => a.id === who); if (!w || !w.alive) return;
    w.chasers = 2;
    for (let i = 0; i < 2; i++) { const e = new Enemy('chaser', { rs: w.s - 9, rx: w.x, ry: w.y, target: w, phase: i * 3, closing: 0, holdDist: 0, freq: 1, amp: 0 }); W.add(e); this.spawnedKillable++; }
  }
  spawnTrain(ev) {
    const kinds = ev.kinds || ['box', 'tank', 'flat'], n = ev.cars, trainSpeed = this.baseSpeed * 0.62; let prev = null;
    for (let i = n - 1; i >= 0; i--) {
      const isLoco = i === n - 1;
      const o = { rs: ev.at + i * 16, rx: 0, ry: 0, worldY: 3.6, meshDy: 3.6, noFlip: true, speedS: trainSpeed, carKind: kinds[i % kinds.length], t: 0 };
      const e = new Enemy(isLoco ? 'loco' : 'car', o); e.updateTransform(0);
      // trains are scenery-sized targets; collider is a box-ish ball so it blocks the low ground
      W.add(e); if (isLoco) this.spawnedKillable++;
      if ((isLoco || i % 2 === 0) && !(ev.noTurrets)) {
        const t = new Enemy('carTurret', { rs: o.rs, rx: 0, ry: 0, worldY: 5.2 + 1.4, meshDy: 1.4, parent: e, dz: 0, phase: rand(TAU), closing: 0, holdDist: 0, freq: 1, amp: 0 });
        W.add(t); this.spawnedKillable++;
      }
    }
  }
  startBoss() {
    this.bossMode = true; this.baseSpeed = 34; UI.banner('WARNING', 'THANE EXPRESS'); Sfx.warn(); Sfx.playMusic(this.def.bossMusic);
    this.boss = new Boss(this); W.add(this.boss); this.spawnedKillable += 3;
    this.say('maldoon', pick(['Is this a cannon I see before me? Fools, you cannot stop the Thane Express!', 'Double, double, toil and trouble — this train shall be your tomb!']));
  }
  onBossDefeated() {
    this.cinematic = true; this.ended = true; this.endT = 0; this.baseSpeed = 30; Sfx.playMusic('victory'); W.slow = 0.35;
    this.say('hollin', 'The Thane Express is destroyed! Magnificent flying, Birnam Wing!');
    UI.banner('MISSION COMPLETE', '');
  }

  /* ---------- AI for attract mode ---------- */
  aiControl(dt) {
    const P = this.player, c = { x: 0, y: 0, fire: true, charge: false, chargeUp: false, bomb: false, bombDown: false, boost: false, brake: false, rollLDown: false, rollRDown: false, uturn: false };
    P.god = true; const st = this.aiState; st.rollT -= dt;
    let tx = P.x, ty = P.y, best = null, bd = 1e9, near = 0;
    this.path.frame(P.s);
    for (const e of W.ents) {
      if (!e.alive) continue;
      if (this.lockable(e)) { const rc = this.relCoords(e.pos); if (rc.ds < 15 || rc.ds > 170) continue; if (rc.ds < 90) near++; const sc = rc.ds + Math.abs(rc.x - P.x) * 1.5; if (sc < bd) { bd = sc; best = rc; } }
    }
    if (best) { tx = best.x; ty = best.y; }
    else { tx = this.laneCenter(P.s) + Math.sin(this.time * 0.7) * 8; ty = Math.sin(this.time * 0.9) * 4; }
    // obstacles
    for (const e of W.ents) {
      if (!e.alive || !e.solid) continue; const ds = e.rs - P.s; if (ds < 0 || ds > 70) continue;
      if (e.kind === 'obstacle' && e.cols.length) { const rc = this.relCoords(e.pos); tx = Math.abs(rc.x) < 8 && e.cols.length === 3 ? rc.x : (Math.abs(rc.x - P.x) < 6 ? P.x + sign(P.x - rc.x) * 12 : tx); }
    }
    if (!this.route && P.s > this.def.forkAt - 120 && P.s < this.def.forkAt + 20) tx = st.route === 'A' ? -12 : 12;
    if (this.bossMode) { const bp = this.boss && this.boss.phase === 2 ? this.boss.core : this.boss && (this.boss.podL.alive ? this.boss.podL : this.boss.podR); if (bp && bp.alive) { const rc = this.relCoords(bp.pos); tx = rc.x; ty = rc.y; } }
    c.x = clamp((tx - P.x) * 0.3, -1, 1); c.y = -clamp((ty - P.y) * 0.3, -1, 1);
    // dodge bullets
    for (const b of W.bullets) { if (b.alive && b.team === 'e' && b.pos.distanceTo(P.pos) < 18 && st.rollT <= 0 && P.rolling <= 0 && Math.random() < 0.06) { st.rollT = 2.5; if (Math.random() < 0.5) c.rollLDown = true; else c.rollRDown = true; break; } }
    // lock-on volleys
    if (near >= 3 && P.chargeT === 0 && Math.random() < 0.01) st.chargeT = 1.0;
    if (st.chargeT > 0) { st.chargeT -= dt; c.charge = true; c.fire = false; if (st.chargeT <= 0) { c.charge = false; c.chargeUp = true; } }
    if (near >= 6 && P.bombs > 0 && Math.random() < 0.01) c.bombDown = true;
    return c;
  }

  /* ---------- per-frame ---------- */
  update(dt0, ctlIn) {
    let dt = dt0;
    if (W.hitstop > 0) { W.hitstop -= dt0; dt = dt0 * 0.08; }
    dt *= this.ended ? W.slow : 1;
    this.time += dt; W.time += dt; this.introT = Math.max(0, this.introT - dt);
    const P = this.player;
    const c = this.attract ? this.aiControl(dt) : ctlIn;
    this.ctl = c;
    // route decision once past the fork wall
    if (this.forkWall && !this.route && P.s > this.def.forkAt + 3) { this.route = P.x < 0 ? 'A' : 'B'; UI.banner(this.route === 'A' ? 'ROUTE A' : 'ROUTE B', this.route === 'A' ? 'CANYON TUNNEL' : 'FOUNDRY ROW'); }
    if (this.route && P.s > 3470 && !this.merged) { this.merged = true; }
    this.runEvents();
    this.updateHint(dt, c);
    P.update(dt, c, this);
    for (const e of W.ents) {
      if (!e.alive || e === P) continue;
      if (e instanceof Wingman) e.update(dt, this);
      else if (e instanceof Enemy) { const ai = e.spec.ai; if (ai) ai(e, dt, this); if (e.alive) e.updateTransform(dt); e.syncBody(); e.syncMesh(); }
      else if (e instanceof Pickup) { e.update(dt, this); e.syncBody(); e.syncMesh(); }
      else if (e instanceof Boss) e.update(dt, this);
      if (e instanceof Wingman) e.syncMesh();
    }
    P.syncMesh(); P.mesh.quaternion.copy(P.tilt);
    Phys.step(dt);
    Bullets.update(dt);
    // cleanup
    for (let i = W.ents.length - 1; i >= 0; i--) {
      const e = W.ents[i];
      if (!e.alive && !(e instanceof RailPlayer)) { if (e instanceof Boss && e.dead && e.deathT < 6) { continue; } e.dispose(); W.ents.splice(i, 1); }
      else if (e instanceof Obstacle && e.rs - P.s < -80) { e.alive = false; }
    }
    FX.update(dt); Debris.update(dt);
    W.shake = Math.max(0, W.shake - dt * 2.2);
    if (W.flashWhite) W.flashWhite = Math.max(0, W.flashWhite - dt * 2);
    // ending logic
    if (this.ended) { this.endT += dt0; W.slow = Math.min(1, W.slow + dt0 * 0.3); if (this.endT > 7 && !this.completed) { this.completed = true; Game.stageComplete(this); } }
    if (P.dead && P.deadT > 2.6 && !this.deathHandled) { this.deathHandled = true; Game.playerDied(this); }
    if (this.attract && Game.attractTimeUp && Game.attractTimeUp()) { /* handled by game */ }
    // sky / shadow follow
    this.updateCamera(dt0, false);
    Gfx.followShadow(P.pos);
    UI.setBossBar(W.hudBoss); W.hudBoss = null;
    Dust.update(Gfx.camera.position, this.path.frame(P.s).t, P.speed);
  }
  updateHint(dt, c) {
    if (!this.hint) return;
    this.hintT += dt;
    if (this.hint.done(c, this.player) && this.hintT > 0.6) { this.hint = null; UI.clearHint(true); }
    else if (this.hintT > 11) { this.hint = null; UI.clearHint(false); }
  }
  updateCamera(dt, snap) {
    const P = this.player, cam = Gfx.camera;
    const intro = this.introT > 0 ? this.introT / 3.4 : 0;
    const back = 10.5 + (P.speedMul - 1) * 3 + intro * 18, up = 3.4 + intro * 4;
    const s = P.dead ? P.s : P.s - back;
    const desired = this.path.world(P.s - back, P.x * 0.6, P.y * 0.55 + up, this.tmp.set(0, 0, 0)).clone();
    const look = this.path.world(P.s + 28, P.x * 0.45, P.y * 0.4 + 0.6, new V3());
    if (snap || !this.camInit) { this.camPos.copy(desired); this.camLook.copy(look); this.camInit = true; }
    else { this.camPos.lerp(desired, 1 - Math.exp(-9 * dt)); this.camLook.lerp(look, 1 - Math.exp(-10 * dt)); }
    cam.position.copy(this.camPos);
    if (W.shake > 0) cam.position.add(this.camShake.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(W.shake * 0.55));

    cam.rotateZ(-P.bankV * 0.09);

  }
  /** screen positions for reticles (near / far) */
  reticles() {
    const P = this.player, path = this.path;
    const a = path.world(P.s + 24, P.x, P.y, new V3()), b = path.world(P.s + 62, P.x, P.y, new V3());
    return [Gfx.project(a), Gfx.project(b)];
  }
  dispose() { Sfx.setEngine(false, 0); }
}

function drawPortrait(canvas, key, talking, t) {
  const c = CHARS[key] || CHARS.hollin, g = canvas.getContext('2d'), w = canvas.width, h = canvas.height;
  g.clearRect(0, 0, w, h); g.fillStyle = c.villain ? '#3a1040' : '#12243a'; g.fillRect(0, 0, w, h);
  // scanlines
  g.fillStyle = 'rgba(255,255,255,0.05)'; for (let y = 0; y < h; y += 4) g.fillRect(0, y, w, 1);
  const cx = w / 2, cy = h * 0.54, r = w * 0.3, bob = Math.sin(t * 3) * (talking ? 1.6 : 0.6);
  g.save(); g.translate(0, bob); g.lineWidth = 4; g.strokeStyle = '#140b1c'; g.fillStyle = c.face;
  // ears
  const ear = (x, y, rw, rh, rot) => { g.save(); g.translate(x, y); g.rotate(rot); g.beginPath(); g.ellipse(0, 0, rw, rh, 0, 0, TAU); g.fill(); g.stroke(); g.restore(); };
  if (c.ear === 'long') { ear(cx - r * 0.55, cy - r * 1.5, r * 0.28, r * 0.85, -0.15); ear(cx + r * 0.55, cy - r * 1.5, r * 0.28, r * 0.85, 0.15); }
  else if (c.ear === 'floppy') { ear(cx - r * 1.0, cy - r * 0.2, r * 0.3, r * 0.7, 0.2); ear(cx + r * 1.0, cy - r * 0.2, r * 0.3, r * 0.7, -0.2); }
  else if (c.ear === 'round') { ear(cx - r * 0.85, cy - r * 0.85, r * 0.3, r * 0.3, 0); ear(cx + r * 0.85, cy - r * 0.85, r * 0.3, r * 0.3, 0); }
  else if (c.ear === 'pointy') { for (const s of [-1, 1]) { g.beginPath(); g.moveTo(cx + s * r * 0.3, cy - r * 0.8); g.lineTo(cx + s * r * 0.95, cy - r * 1.5); g.lineTo(cx + s * r * 0.95, cy - r * 0.4); g.closePath(); g.fill(); g.stroke(); } }
  g.beginPath(); g.ellipse(cx, cy, r, r * 0.95, 0, 0, TAU); g.fill(); g.stroke();
  if (c.hat) { g.fillStyle = '#1f4a60'; g.beginPath(); g.moveTo(cx - r, cy - r * 0.45); g.quadraticCurveTo(cx, cy - r * 1.7, cx + r, cy - r * 0.45); g.closePath(); g.fill(); g.stroke(); g.fillStyle = '#ffd23a'; g.fillRect(cx - 6, cy - r * 1.05, 12, 8); }
  // eyes
  g.fillStyle = '#fff'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * r * 0.4, cy - r * 0.12, r * 0.2, r * 0.24, 0, 0, TAU); g.fill(); g.stroke(); g.fillStyle = c.villain ? '#ff3a3a' : '#140b1c'; g.beginPath(); g.arc(cx + s * r * 0.4, cy - r * 0.08, r * 0.09, 0, TAU); g.fill(); g.fillStyle = '#fff'; }
  if (c.villain) { g.strokeStyle = '#140b1c'; g.lineWidth = 5; for (const s of [-1, 1]) { g.beginPath(); g.moveTo(cx + s * r * 0.12, cy - r * 0.55); g.lineTo(cx + s * r * 0.7, cy - r * 0.35); g.stroke(); } g.lineWidth = 4; }
  // snout / beak
  if (c.beak) { g.fillStyle = '#ffb24a'; g.beginPath(); g.moveTo(cx - r * 0.2, cy + r * 0.12); g.lineTo(cx + r * 0.2, cy + r * 0.12); g.lineTo(cx, cy + r * 0.55); g.closePath(); g.fill(); g.stroke(); }
  else { g.fillStyle = '#140b1c'; g.beginPath(); g.ellipse(cx, cy + r * 0.12, r * 0.12, r * 0.08, 0, 0, TAU); g.fill(); }
  // mouth
  const open = talking ? (Math.sin(t * 22) * 0.5 + 0.5) : 0;
  g.fillStyle = '#5a1020'; g.beginPath(); g.ellipse(cx, cy + r * 0.62, r * 0.22, 3 + open * r * 0.2, 0, 0, TAU); g.fill(); g.stroke();
  g.restore();
  // frame static
  if (talking) { g.fillStyle = 'rgba(120,255,200,0.08)'; g.fillRect(0, (t * 60) % h, w, 10); }
}

        if (need && !this.touchMode) { this.touchMode = true; if (!UI.cur || UI.cur.cls.includes('splash') || UI.cur.cls.includes('title')) UI.hideScreen(); UI.els.touch.classList.remove('hidden'); }
        else if (!need && this.touchMode) { this.touchMode = false; UI.els.touch.classList.add('hidden'); UI.hideScreen(); if (this.state === 'splash') this.showSplash(); else SCREENS.title(); }
      }
      if (this.touchMode) { TitleScene.update(dt); if (UI.cur) UI.handleNav(nav, dt); Gfx.renderer.render(Gfx.scene, Gfx.camera); Input.pressedKeys.clear(); return; }
    }
    switch (this.state) {
      case 'splash':
        TitleScene.update(dt);
        if (this.inputFlag > this.splashT0 + 250) { this.state = 'title'; Sfx.init(); Sfx.resume(); Sfx.applyVolumes(); Sfx.playMusic('title'); UI.hideScreen(); SCREENS.title(); Input.lastActivity = performance.now(); }
        break;
      case 'title':
        TitleScene.update(dt); UI.handleNav(nav, dt);
        if (Input.idleSeconds() > 10 && !this.transitioning && !UI.cur?.noAttract) this.startAttract();
        break;
      case 'attract':
        this.attractT += dt; this.stage.update(dt, ctl); UI.updateHUD(this.stage, dt);
        if (this.inputFlag > this.attractStart + 600 && now - this.inputFlag < 400) { this.exitAttract(); }
        else if (this.attractT > this.ATTRACT[this.attractIdx % this.ATTRACT.length].dur) this.nextAttract();
        break;
      case 'play':
        if (ctl.pauseDown) { this.pause(); break; }
        this.stage.update(dt, ctl); UI.updateHUD(this.stage, dt);
        break;
      case 'paused':
        UI.handleNav(nav, dt); if (ctl.pauseDown && !nav.back) { /* pause toggles via menu back */ }
        break;
      case 'gameover': case 'results':
        if (this.stage) { this.stage.updateCamera(dt, false); FX.update(dt); Debris.update(dt); }
        UI.handleNav(nav, dt); UI.updateComms(dt);
        break;
      default: break;
    }
    if (UI.devOn) this.updateDev(dt);
    Phys.updateDebug();
    Gfx.renderer.render(Gfx.scene, Gfx.camera);
    Input.pressedKeys.clear();
  },
  /* ---------- designer / debug tools (F3) ---------- */
  updateDev(dt) {
    const d = UI.els.dev; if (!UI.devOn) return; const st = this.stage, P = st && st.player;
    let h = `<b>DEV · F3</b> ${this.fps.toFixed(0)} fps · state ${this.state}<br>`;
    if (st && P) {
      h += `stage ${st.def.id} · t ${W.time.toFixed(1)}s · ents ${W.ents.length} · bullets ${W.bullets.length} · debris ${Debris.list.length} · bodies ${Phys.world.bodies.len ? Phys.world.bodies.len() : '?'}<br>`;
      if (st.mode === 'rail') h += `s ${P.s.toFixed(0)} / ${st.path.length.toFixed(0)} · route ${st.route || '-'} · events left ${st.events.filter((e) => !e.done).length}<br>`;
      h += `hp ${P.hp.toFixed(0)} god ${P.god} · hits ${W.hits}/${st.spawnedKillable}<br>`;
    }
    h += `<i>1 drone · 2 swooper · 3 gunship · 4 mine · 5 turret · I god · C colliders · N +400 · B boss · K kill all · H refill · R reload stage</i>`;
    d.innerHTML = h;
    if (this.state !== 'play' || !st) return;
    for (const k of Input.pressedKeys) {
      if (k === 'KeyI') { P.god = !P.god; this.devGod = P.god; }
      else if (k === 'KeyC') Phys.toggleDebug(!Phys.debugOn);
      else if (k === 'KeyK') { for (const e of W.ents) if (e.alive && e.team === 'e' && e.kind !== 'boss' && e.kind !== 'bossbody') e.damage(999, { pos: e.pos }); }
      else if (k === 'KeyH') { P.hp = P.maxHp; P.bombs = 6; P.laser = 3; }
      else if (k === 'KeyR') this.startStage(st.def.id, {});
      else if (st.mode === 'rail') {
        if (k === 'KeyN') { P.s += 400; for (const e of st.events) if (e.at < P.s - 260 && !e.route) e.done = true; }
        else if (k === 'KeyB') { P.s = st.def.bossAt - 300; for (const e of st.events) if (e.at < st.def.bossAt - 100) e.done = true; }
        else if ('Digit1Digit2Digit3Digit4Digit5'.includes(k)) { const kind = { Digit1: 'drone', Digit2: 'swooper', Digit3: 'gunship', Digit4: 'mine', Digit5: 'turret' }[k]; st.spawnWave({ kind, n: kind === 'gunship' ? 1 : 3, form: 'line', x: 0, y: 2 }, P.s + 140, 0); }
      } else if (st.mode === 'range' && 'Digit1Digit2'.includes(k)) st.spawnFighters(k === 'Digit1' ? 1 : 3);
    }
  },
};

/* ===================== 10 ABOUT (generated from about.html at build time) + main ===================== */
const ABOUT_HTML = "<h3>Source Information</h3>\n<ul>\n<li><b>Date:</b> 2026-10-20 19:15</li>\n<li><b>Source:</b> Starfox 64 for N64 (Nintendo 64, 1997). Macbeth Mayhem is an original spiritual successor: new characters, world, stages, art and code; no Nintendo assets.</li>\n<li><b>Tech:</b> Three.js r180 (three/webgpu build, WebGPURenderer, no WebGL fallback); Rapier 3D 0.19.3 (@dimforge/rapier3d-compat, WASM) for collision queries, sensors and rigid-body debris; Web Audio API (every sound effect and the music are synthesised live, no audio files); Gamepad API (PS5 DualSense layout, rumble); vanilla JavaScript ES modules bundled into one HTML file by a small Python script; DOM/CSS for HUD and menus; Russo One web font (optional, falls back to system fonts).</li>\n<li><b>Art Direction:</b> stylized cel-shading. MeshToonMaterial with a 4-step light ramp, inverted-hull ink outlines, posterised sky bands, chunky nearest-filtered ground textures, hard-edged sun shadows, dusk-orange palette.</li>\n<li><b>Animation:</b> procedural scene-graph animation (no baked clips): hierarchical part rigs (wings, turret heads, boss pods and armour plates), damped springs, easing tweens, state machines and canvas-drawn talking portraits.</li>\n<li><b>Testing:</b> the prompt placed no restriction on testing; FPS and optimisation targets were declared out of scope. Testing done: headless Chromium (Playwright) with SwiftShader WebGPU, scripted fast-forward simulations of both stages, the boss fight and the attract mode with random and AI input, and render-target screenshots. Real hardware, a physical DualSense and real iOS or Android devices were not available.</li>\n<li><b>Environment:</b> Claude Code CLI (headless); Linux (WSL2); browser unknown (developed and tested with Playwright Chromium and SwiftShader WebGPU)</li>\n<li><b>Model:</b> Anthropic, claude-sonnet-5-5, reasoning effort medium</li>\n<li><b>Usage:</b> estimated cost in USD: unknown (not exposed to the agent); total tokens: about 0.41M (about 406K by the session token-budget counter, no input/output breakdown available); session time: about 51 minutes (19:15 to 20:06)</li>\n</ul>\n<h3>Engine Feedback</h3>\n<ul>\n<li><b>What did you like most about the engine?</b> Three.js WebGPURenderer plus its node materials: toon shading, instancing, shadows and fog worked with almost no custom shader code, and one importmap pulls everything from a CDN with no build step. Rapier&#x27;s query pipeline (shape-overlap tests) was a very convenient way to do projectile, pickup and ramming checks, and real rigid bodies give exploding debris a physical feel for free.</li>\n<li><b>Did you get stuck or guess wrong?</b> Yes, four times. (1) Headless screenshots of a WebGPU canvas come out blank under SwiftShader, so I render to a RenderTarget and read pixels back. (2) Creating a Rapier rigid body inside an intersectionsWithShape callback throws &quot;recursive use of an object ... aliasing in rust&quot;; the error was swallowed and silently aborted my enemy-death logic until I collected hits first and ran the callbacks afterwards. (3) An InstancedMesh with more than 1000 instances showed stale instance colours on the GPU until the colour attribute was set to DynamicDrawUsage. (4) I guessed a Rapier &quot;updateSceneQueries&quot; call that does not exist in 0.19 and had to read the typings.</li>\n<li><b>What was the most important thing you had to build yourself?</b> The game framework on top of the libraries: the rail-space coordinate system (path frames, lanes, forks), the entity, projectile and AI layers, the all-range flight model, the Web Audio synth and music sequencer, the controller-first menu and focus system, the input layer with axis-inversion fixes, procedural models, and the attract-mode autopilot.</li>\n<li><b>What was the hardest part about using the engine?</b> Verifying WebGPU output without a real GPU, and the thinner documentation for the node and TSL material system compared with classic WebGL materials, so I stayed on stable, well-trodden APIs.</li>\n<li><b>If you had to remove or overhaul one thing from engine, what would that be?</b> Rapier&#x27;s re-entrancy rules: world mutation during a query callback should be impossible or deferred by the library instead of failing inside wasm.</li>\n<li><b>If you could change one thing about the engine, what would it be?</b> A built-in, reliable way to capture the WebGPU canvas in headless automation, and a clear warning when an instanced attribute is not being re-uploaded.</li>\n</ul>\n<h3>Prompt Feedback</h3>\n<ul>\n<li><b>Prompt:</b> TASK.md, &quot;Starfox 64 for N64&quot; spiritual-successor vertical slice (Three.js r180 WebGPU, Rapier 0.19.3, cel-shaded, 10-foot controller-first, attract mode).</li>\n<li><b>What did you like most about this prompt?</b> The concrete, checkable requirements: pinned tech stack, exact deliverable name, the 10-second attract mode, the invert-axis toggles for the flaky gamepad, the touch-only message, and the list of reference demos that sets a clear bar for &quot;feature-complete&quot;.</li>\n<li><b>What was confusing?</b> The &quot;[PROMPT]&quot; placeholder in the feedback template; how to write a game title with spaces into the filename pattern; whether the intermittent gamepad inversion is a bug to reproduce or only a setting to provide; and the Usage line, which asks for cost and tokens when an agent can only estimate them.</li>\n<li><b>What was the hardest thing to do?</b> Fitting a complete vertical slice (a branching rail stage with a boss, an all-range stage with a carrier boss, wingmen, menus, audio, attract mode and tooling) into one session, and validating it without real graphics hardware.</li>\n<li><b>If there was one test you could have run, what would that test be?</b> A hands-on playthrough with a real PS5 DualSense on a real GPU: check stick mapping and inversion, rumble, frame time under heavy effects, and the 10-foot readability of the HUD on a TV.</li>\n</ul>";
