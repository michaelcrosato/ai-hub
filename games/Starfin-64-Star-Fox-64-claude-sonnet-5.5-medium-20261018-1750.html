      { label: "Camera Shake", kind: "slider", min: 0, max: 1, step: 0.1, get: () => S.shake, set: (v) => set("shake", v) },
      { label: "Controller Vibration", kind: "toggle", get: () => S.vibration, set: (v) => set("vibration", v) },
      { label: "Subtitles", kind: "toggle", get: () => S.subtitles, set: (v) => set("subtitles", v) },
      { label: "Reduce Flashing", kind: "toggle", get: () => S.reduceFlash, set: (v) => set("reduceFlash", v) },
      { label: "Back", onSelect: () => self.pop() }
    ] };
    return { el: $(`<div class="side wide"><h1>Settings</h1><div class="menu"></div></div>`), menu, onBack: () => self.pop(), prompts: [["move", "Navigate"], ["ok", "Change"], ["back", "Back"]] };
  },
  about() {
    const self = this;
    let tab = 0;
    const el = $(`<div class="about"><h1>Controls &amp; About</h1><div class="tabs"></div><div class="body"></div></div>`);
    const g = (a) => input.glyph(a);
    const draw = () => {
      el.querySelector(".tabs").innerHTML = ["Controls", "Credits & Source Info"].map((t, i) => `<span class="${i === tab ? "sel" : ""}">${t}</span>`).join("");
      el.querySelector(".body").innerHTML = tab === 0 ? `<div class="grid2">
        <div><h3>Gamepad (DualSense)</h3><ul><li><kbd>L-STICK</kbd> Steer</li><li><kbd>✕</kbd> Tap: laser · Hold: lock-on charge</li><li><kbd>□</kbd> Nova bomb</li><li><kbd>L1</kbd><kbd>R1</kbd> Barrel roll (deflects shots)</li><li><kbd>R2</kbd> Boost · <kbd>L2</kbd> Brake</li><li><kbd>○</kbd> U-turn (all-range)</li><li><kbd>△</kbd> Ask Bubbles for a tip</li><li><kbd>OPTIONS</kbd> Pause</li></ul></div>
        <div><h3>Keyboard</h3><ul><li><kbd>WASD</kbd>/<kbd>ARROWS</kbd> Steer</li><li><kbd>SPACE</kbd> Laser / hold to lock-on</li><li><kbd>B</kbd> Nova bomb</li><li><kbd>Q</kbd><kbd>E</kbd> Barrel roll</li><li><kbd>SHIFT</kbd> Boost · <kbd>CTRL</kbd> Brake</li><li><kbd>C</kbd> U-turn · <kbd>T</kbd> Tip</li><li><kbd>ESC</kbd> Pause / Back · <kbd>ENTER</kbd> Select</li></ul></div></div>
        <p class="dim">Shoot enemies in groups with lock-on. Shield rings repair you, crates give bombs and laser upgrades. Free your wingmen when they're chased!</p>` : `<div class="src">${SOURCE_INFO.map(([k, v]) => `<div><b>${k}</b><span>${v}</span></div>`).join("")}</div>`;
    };
    return { el, enter: draw, prompts: [["nav", "Switch Tab"], ["back", "Back"]], onBack: () => self.pop(), handle(n, p) {
      if (n.left || n.right) {
        tab = 1 - tab;
        audio.sfx("ui");
        draw();
      }
      if (p.back || p.ok) {
        audio.sfx("back");
        self.pop();
      }
      return true;
    } };
  },
  pause() {
    const self = this, A = this.app;
    const menu = { i: 0, items: [
      { label: "Resume", onSelect: () => A.resume() },
      { label: "Settings", onSelect: () => self.push("settings") },
      { label: "Restart Mission", onSelect: () => A.restartStage(false) },
      { label: "Quit to Mission Select", onSelect: () => A.quitToMap() }
    ] };
    return { el: $(`<div class="side"><h1>Paused</h1><div class="menu"></div></div>`), menu, onBack: () => A.resume(), prompts: [["ok", "Select"], ["back", "Resume"]] };
  },
  results(r) {
    const self = this, A = this.app;
    const last = r.id === "s3";
    const rows = [["Enemies Downed", `${r.hits}`, `target ${r.medalNeed}`], ["Wingmen Saved", `${r.wingmen} / ${r.crewTotal}`, ""], ["Shield Remaining", `${r.hp}`, ""], ["Time", `${Math.floor(r.time / 60)}:${String(Math.floor(r.time % 60)).padStart(2, "0")}`, ""], ["Secret Route", r.secret ? "FOUND" : "—", ""]];
    const menu = { i: 0, items: [{ label: last ? "Finish" : "Continue", onSelect: () => A.afterResults(r) }, { label: "Replay Mission", onSelect: () => A.restartStage(false) }] };
    const el = $(`<div class="side res"><h1>Mission Complete</h1><h2>${r.name}</h2><div class="rows">${rows.map(([a, b, c]) => `<div class="row"><span>${a}</span><b>${b}</b><em>${c}</em></div>`).join("")}</div><div class="medal ${r.medal ? "got" : ""}">${r.medal ? "★ MEDAL ★" : "☆ No medal"}</div><div class="score">SCORE ${r.score.toLocaleString()}</div><div class="menu"></div></div>`);
    return { el, menu, enter: () => {
      audio.sfx(r.medal ? "medal" : "ok");
    }, prompts: [["ok", "Select"]] };
  },
  gameover() {
    const A = this.app;
    const menu = { i: 0, items: [{ label: "Retry", sub: A.game.checkpointS ? "from the checkpoint" : "", onSelect: () => A.restartStage(true) }, { label: "Quit to Mission Select", onSelect: () => A.quitToMap() }] };
    return { el: $(`<div class="side"><h1 class="bad">Mission Failed</h1><p class="dim">Star Squadron needs you, Finn.</p><div class="menu"></div></div>`), menu, prompts: [["ok", "Select"]] };
  },
  ending() {
    const A = this.app;
    const menu = { i: 0, items: [{ label: "Return to Title", onSelect: () => A.quitToTitle() }] };
    return { el: $(`<div class="side"><h1>Squadron Victorious!</h1><p>The Kraken Queen is no more, the reef is safe, and Gill is still complaining. Thank you for playing the demo!</p><div class="menu"></div></div>`), menu, prompts: [["ok", "Select"]] };
  }
};

// src/main.js
var DEFAULTS = { master: 0.8, music: 0.7, sfx: 0.8, invertY: false, assist: true, shake: 1, vibration: true, subtitles: true, reduceFlash: false };
var DEMO = ["s1", "s2a", "s3", "s2b"];
var app = { state: "boot", settings: null, game: null, ui: null, kbSeen: false, demo: null };
window.__starfin = { app, input, audio };
app.applySettings = () => {
  const S = app.settings;
  audio.setVol("master", S.master);
  audio.setVol("music", S.music);
  audio.setVol("sfx", S.sfx);
  input.settings.invertY = S.invertY;
  input.settings.vibration = S.vibration;
  input.settings.shake = S.shake;
  input.assist = S.assist;
  app.ui.save.settings = S;
  writeSave(app.ui.save);
};
app.goTitle = () => {
  app.state = "menus";
  app.ui.hudShow(false);
  app.ui.clearSub();
  app.ui.bossBar(null);
  document.getElementById("demoBadge").style.display = "none";
  app.game.startStage("s1", { idle: true });
  app.ui.show("title");
  app.ui.fade(600);
};
app.launchStage = (id, o = {}) => {
  const g = app.game;
  app.stageId = id;
  if (!o.keepCrew)
    g.crew = { pip: true, gill: true, bubbles: true };
  app.crewSnap = { ...g.crew };
  app.state = "play";
  app.ui.show(null);
  app.ui.hudShow(true);
  app.ui.clearSub();
  app.ui.fade(500);
  g.startStage(id, { startS: o.startS || 0 });
  app.ui.cache = {};
};
app.restartStage = (checkpoint) => {
  const g = app.game;
  g.crew = { ...app.crewSnap };
  app.launchStage(app.stageId, { startS: checkpoint && !g.free ? g.checkpointS : 0, keepCrew: true });
};
app.resume = () => {
  app.state = "play";
  app.ui.show(null);
};
app.quitToMap = () => {
  app.state = "menus";
  app.ui.hudShow(false);
  app.ui.clearSub();
  app.ui.bossBar(null);
  app.game.startStage("s1", { idle: true });
  app.ui.show("map");
  app.ui.fade(500);
};
app.quitToTitle = () => app.goTitle();
app.onStageClear = () => {
  app.state = "ended";
  app.ui.hudShow(false);
};
app.onGameOver = () => {
  app.state = "ended";
  audio.music("gameover");
};
app.afterResults = (r) => {
  app.ui.clearSub();
  if (r.id === "s3") {
    app.game.startStage("s1", { idle: true });
    app.state = "menus";
    app.ui.show("ending");
  } else
    app.quitToMap();
};
app.startDemo = () => {
  const ui = app.ui;
  app.state = "demo";
  app.demo = { idx: 0, t: 0, started: performance.now() };
  ui.show(null);
  ui.hudShow(true);
  document.getElementById("demoBadge").style.display = "block";
  app.runDemoStage();
};
app.runDemoStage = () => {
  const { game: g, demo: d } = app;
  const id = DEMO[d.idx % DEMO.length];
  g.crew = { pip: true, gill: true, bubbles: true };
  d.t = 0;
  d.skipped = false;
  d.bossT = 0;
  app.ui.cache = {};
  app.ui.clearSub();
  app.ui.bossBar(null);
  g.startStage(id, { auto: true });
  app.ui.fade(500);
  d.started = performance.now();
};
app.demoNext = () => {
  app.demo.idx++;
  app.runDemoStage();
};
app.exitDemo = () => {
  if (app.state !== "demo")
    return;
  audio.stopMusic();
  app.goTitle();
  input.lastInput = performance.now();
};
app.demoTick = (dt) => {
  const { game: g, demo: d } = app;
  d.t += dt;
  if (!g.free && !d.skipped && d.t > 30 && g.phase === "play") {
    g.skipTo(g.st.bossS - 90);
    d.skipped = true;
  }
  if (g.free && !d.skipped && d.t > 24 && g.phase === "play") {
    d.skipped = true;
    g.freeState.kills = Math.max(15, g.freeState.kills || 0);
    g.freeState.wave = Math.max(3, g.freeState.wave);
  }
  if (g.boss && !g.boss.dead) {
    d.bossT += dt;
    if (d.bossT > 45)
      g.boss.core.hp = 0;
  }
  if (d.t > 180 && g.phase !== "clear")
    app.demoNext();
};
async function boot() {
  const canvas = document.getElementById("gl");
  const ui = app.ui = new UI(app);
  const save = ui.save;
  app.settings = Object.assign({}, DEFAULTS, save.settings);
  ui.show("boot");
  const touchOnly = matchMedia("(pointer: coarse)").matches && !matchMedia("(any-pointer: fine)").matches && navigator.maxTouchPoints > 0;
  if (!navigator.gpu)
    return ui.show("nogpu", "This browser does not expose navigator.gpu.");
  let adapter = null;
  try {
    adapter = await navigator.gpu.requestAdapter();
  } catch (e) {}
  if (!adapter)
    return ui.show("nogpu", "No WebGPU adapter is available on this device.");
  let renderer;
  try {
    renderer = new THREE4.WebGPURenderer({ canvas, antialias: true, forceWebGL: false });
    await renderer.init();
    if (renderer.backend && renderer.backend.isWebGLBackend)
      throw new Error("WebGL fallback is disabled");
  } catch (e) {
    console.error("renderer init failed", e);
    return ui.show("nogpu", "WebGPU renderer failed to start: " + e.message);
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE4.PCFSoftShadowMap;
  const game = app.game = new Game(renderer, ui);
  await game.init();
  window.__starfin.game = game;
  window.__starfin.ui = ui;
  window.__starfin.THREE = THREE4;
  app.applySettings();
  const hud = document.getElementById("hud2d"), hctx = hud.getContext("2d");
  const resize = () => {
    renderer.setSize(innerWidth, innerHeight);
    game.resize(innerWidth, innerHeight);
    hud.width = innerWidth;
    hud.height = innerHeight;
  };
  addEventListener("resize", resize);
  resize();
  addEventListener("keydown", () => {
    app.kbSeen = true;
  });
  addEventListener("pointerdown", () => audio.unlock());
  addEventListener("keydown", () => audio.unlock());
  input.listeners.push(() => {
    audio.unlock();
    if (app.state === "demo")
      app.exitDemo();
  });
  if (touchOnly) {
    app.state = "touch";
    ui.show("touch");
  } else {
    app.state = "menus";
    game.startStage("s1", { idle: true });
    ui.show("title");
  }
  document.getElementById("loading")?.remove();
  let last = performance.now();
  renderer.setAnimationLoop((now) => {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    input.poll();
    try {
      tick(dt);
    } catch (e) {
      console.error("tick error", e);
    }
    input.endFrame();
    renderer.render(game.scene, game.camera);
  });
  function tick(dt) {
    const S = app.state;
    if (S === "touch") {
      if (app.kbSeen || input.device === "pad" && input.pad()) {
        app.state = "menus";
        game.startStage("s1", { idle: true });
        ui.show("title");
      } else {
        ui.update();
        return;
      }
    }
    if (S === "menus") {
      game.update(dt);
      hctx.clearRect(0, 0, hud.width, hud.height);
      ui.update();
      const n = ui.cur && ui.cur.name;
      if (["title", "menu", "map"].includes(n) && input.idleMs() > 1e4)
        app.startDemo();
    } else if (S === "play") {
      if (input.pressed.pause && game.phase !== "dead") {
        app.state = "pause";
        ui.show("pause");
        return;
      }
      game.update(dt);
      ui.updateHUD(game);
      game.drawHUD(hctx, hud.width, hud.height);
    } else if (S === "pause") {
      ui.update();
      game.drawHUD(hctx, hud.width, hud.height);
      if (ui.cur === null)
        app.state = "play";
    } else if (S === "ended") {
      game.update(dt);
      hctx.clearRect(0, 0, hud.width, hud.height);
      ui.update();
    } else if (S === "demo") {
      game.update(dt);
      app.demoTick(dt);
      ui.updateHUD(game);
      game.drawHUD(hctx, hud.width, hud.height);
    }
  }
}
boot().catch((e) => {
  console.error("boot failed", e);
});
