    <meta

    <title>Permanent Stability</title>

  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Interactive island-state map"></canvas>
      <div class="atmosphere" aria-hidden="true"></div>

      <header class="masthead glass-panel">
        <div>
          <p class="eyebrow">REPUBLIC OF MERIDIA // EXECUTIVE NETWORK</p>
          <h1>PERMANENT STABILITY</h1>
        </div>
        <div class="date-block">
          <span id="date-label">JAN 2026</span>
          <span id="phase-label">CONSOLIDATION</span>
        </div>
      </header>

      <section id="stats-bar" class="stats-bar glass-panel" aria-label="National statistics"></section>

      <aside id="district-panel" class="side-panel side-panel-left glass-panel" aria-live="polite"></aside>

      <aside class="side-panel side-panel-right glass-panel">
        <nav class="tabs" aria-label="Program categories">
          <button class="tab is-active" data-tab="build">BUILD</button>
          <button class="tab" data-tab="research">RESEARCH</button>
          <button class="tab" data-tab="briefing">BRIEFING</button>
        </nav>
        <div id="program-panel" class="program-panel"></div>
      </aside>

      <section class="turn-controls glass-panel">
        <div class="progress-stack">
          <div class="progress-label">
            <span>AUTONOMOUS STATE PROGRESS</span>
            <strong id="progress-value">0%</strong>
          </div>
          <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        </div>
        <button id="advance-button" class="primary-button">ADVANCE ONE MONTH</button>
      </section>

      <section class="log-panel glass-panel" aria-label="Government activity log">
        <div class="section-heading">
          <span>STATE WIRE</span>
          <button id="reset-button" class="text-button">NEW ADMINISTRATION</button>
        </div>
        <div id="log-list" class="log-list"></div>
      </section>

      <div id="event-modal" class="modal-layer is-hidden" role="dialog" aria-modal="true" aria-labelledby="event-title">
        <section class="modal-card glass-panel">
          <p class="eyebrow">EXECUTIVE DECISION REQUIRED</p>
          <h2 id="event-title"></h2>
          <p id="event-body" class="modal-copy"></p>
          <div id="event-choices" class="event-choices"></div>
        </section>
      </div>

      <div id="ending-modal" class="modal-layer is-hidden" role="dialog" aria-modal="true" aria-labelledby="ending-title">
        <section class="modal-card ending-card glass-panel">
          <p id="ending-kicker" class="eyebrow">SYSTEM REPORT</p>
          <h2 id="ending-title"></h2>
          <p id="ending-body" class="modal-copy"></p>
          <div id="ending-metrics" class="ending-metrics"></div>
          <button id="ending-reset-button" class="primary-button">BEGIN ANOTHER TIMELINE</button>
        </section>
      </div>
