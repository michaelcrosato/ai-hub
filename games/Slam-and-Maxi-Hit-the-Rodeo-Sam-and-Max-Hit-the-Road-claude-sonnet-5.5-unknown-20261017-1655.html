    const dx = bx - MX.pos.x, dz = bz - MX.pos.z, d = Math.hypot(dx, dz);
    if (d > 0.4) { const s = Math.min(d * 5, 9.5); MX.pos.x += dx / d * s * dt; MX.pos.z += dz / d * s * dt; mv = Math.min(1, s / 5); MX.g.rotation.y += wrapA(Math.atan2(dx, dz) - MX.g.rotation.y) * Math.min(1, dt * 10); }
    else MX.g.rotation.y += wrapA(P.face - MX.g.rotation.y) * Math.min(1, dt * 4);
    MX.g.position.set(MX.pos.x, mv > 0.2 ? Math.abs(Math.sin(MX.t * 11)) * 0.38 : Math.max(0, Math.sin(MX.t * 3.1) - 0.85) * 3, MX.pos.z);
  }
  mu.aL.rotation.z = Math.sin(MX.t * 8) * 0.3 * (mv + 0.3); mu.aR.rotation.z = -Math.sin(MX.t * 8) * 0.3 * (mv + 0.3); mu.head.rotation.z = Math.sin(MX.t * 5) * 0.08;
  // collectibles
  for (const c of cards) {
    if (c.got) continue; c.g.rotation.y += dt * 2.5; c.g.position.y = 1.3 + Math.sin(performance.now() / 300 + c.x) * 0.2;
    if (dist2(P.pos.x, P.pos.z, c.x, c.z) < 1.6) { c.got = true; c.g.visible = false; G.cards++; sfx('pickup'); toast('Postcard ' + G.cards + '/' + cards.length); burst(new THREE.Vector3(c.x, 0.4, c.z), [0x1fb5a8, 0xfff3d6], 8); if (G.cards === 1) say('MAXI', 'Postcards! Wish you were here! Oh, you ARE here!'); }
  }
  if (W.hubcap.visible) { W.hubcap.rotation.y += dt * 2; W.hubcap.position.y = 1.9 + Math.sin(performance.now() / 350) * 0.15; }
  if (G.f.caseBroken && !G.f.donutGot) W.donutShow.rotation.y += dt * 2;
  if (W.baitDonut.visible) W.baitDonut.rotation.y += dt;
  if (G.f.shed) W.shedDoor.rotation.y = lerp(W.shedDoor.rotation.y, -1.9, Math.min(1, dt * 4));
  if (G.f.crate) { W.crateLid.position.y = lerp(W.crateLid.position.y, 2.4, Math.min(1, dt * 6)); W.crateLid.rotation.z = lerp(W.crateLid.rotation.z, 0.9, Math.min(1, dt * 6)); W.crate.children[3].visible = false; }
  if (G.f.power) { W.lamp.material.color.setHex(0x3bff7a); if (W.doorT >= 0) { W.doorT += dt; W.door.position.y = lerp(1.7, -2.2, Math.min(1, W.doorT / 1.4)); } }
  updateBots(dt); updateParts(dt);
  // interactions
  let cur = null, cs = 1e9;
  for (const o of IX) { const l = o.label(); if (!l) continue; const d = dist2(P.pos.x, P.pos.z, o.x, o.z); if (d < o.r && d / o.r < cs) { cs = d / o.r; cur = o; } }
  const pe = $('#prompt');
  if (cur && mode !== 'cine') { pe.innerHTML = GL.confirm() + cur.label(); pe.classList.remove('hide'); } else pe.classList.add('hide');
  if (cur && C.p.confirm && mode !== 'cine') { cur.act(); }
  if (C.p.mayhem && mode === 'play') mayhemPress();
  if (mode === 'play') { G.hintT += dt; if (G.hintT > 50) { G.hintT = 0; say('MAXI', 'Psst. ' + OBJ[curObj()][2]); } }
  // HUD
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('#toast').classList.remove('on'); }
  $('#mayBar').style.width = (1 - MX.cd / 2.6) * 100 + '%';
  updateHud(); updateSubs(dt);
  const dm = $('#alert'); dm.classList.toggle('hide', !(G.alarm > 0));
}

function updateCineWin(dt) {
  G.ending += dt; W.car.position.x += Math.max(0, G.ending - 0.6) * 14 * dt; W.car.position.x += 0;
  W.goldHub.rotation.y += dt * 8; G.shake = 0.05; updateParts(dt);
  if (G.ending > 3.4) endGame(true);
}

function updateCamera(dt) {
  let tgt, dist = 15, pitch = 0.58, yaw = camYaw;
  if (mode === 'title') { yaw = performance.now() / 9000 + 0.5; tgt = new THREE.Vector3(2, 2.2, 15); dist = 17; pitch = 0.32; }
  else if (mode === 'cine' || mode === 'cine2') { tgt = new THREE.Vector3(W.car.position.x, 1.5, 21.5); dist = 12; pitch = 0.3; yaw = 0.4; }
  else { tgt = P.pos.clone(); tgt.y = 1.7; }
  const cp = Math.cos(pitch), want = new THREE.Vector3(tgt.x + Math.sin(yaw) * cp * dist, tgt.y + Math.sin(pitch) * dist, tgt.z + Math.cos(yaw) * cp * dist);
  const k = mode === 'title' ? 1 : Math.min(1, dt * 7);
  camPos.lerp(want, k); camLook.lerp(tgt, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  if (G && G.shake > 0) { camera.position.x += (Math.random() - 0.5) * G.shake * 0.8; camera.position.y += (Math.random() - 0.5) * G.shake * 0.8; }
}

/* ----------------------------------------------------------------- loop */
let last = performance.now();
function step(dt) {
  poll(dt);
  const p = I.p;
  if (blocked) { if (menus.length) menuInput(p); return; }
  // demo cancel on any activity
  if (mode === 'demo' || (AI.on && mode !== 'title')) { if (activity) { activity = false; AI.on = false; toTitle(); return; } }
  activity = false;
  if (mode === 'title') {
    menuInput(p); idle += dt;
    if (idle > 10 && !blocked) { idle = 0; AI.on = true; startDemo(); }
    updateCamera(dt); return;
  }
  if (menus.length) {
    menuInput(p); updateCamera(dt); return; // game frozen behind menus
  }
  if (mode === 'play') {
    if (p.pause) { openMenu(pauseMenu()); return; }
    if (p.tri) { openMenu(caseMenu()); return; }
    updatePlay(dt, { mx: I.mx, my: I.my, cx: I.cx, sprint: I.sprint, p });
  } else if (mode === 'demo') {
    const c = AI.update(dt); c.p = { confirm: false, mayhem: false }; updatePlay(dt, c);
  } else if (mode === 'cine') { updateCineWin(dt); }
  else if (mode === 'cine2') { updateParts(dt); if (AI.on) { demoEndT -= dt; if (demoEndT <= 0) { mode = 'demo'; startGame(true); } } }
  if (mode === 'cine' && AI.on && G.ending > 3.4) { /* handled in endGame */ }
  updateCamera(dt);
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try { step(dt); } catch (e) { console.error(e); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ boot */
function unblock() { if (!blocked) return; blocked = false; $('#block').classList.add('hide'); clearMenus(); openMenu(titleMenu()); }
function boot() {
  applySettings();
  const touchOnly = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  const hasPad = [...(navigator.getGamepads ? navigator.getGamepads() : [])].some(p => p);
  resetWorld(); openMenu(titleMenu()); mode = 'title';
  if (touchOnly && !hasPad) {
    blocked = true; $('#block').classList.remove('hide'); clearMenus(); updateLogo();
    $('#blockBtn').addEventListener('click', () => { openMenu(settingsMenu(() => { closeMenu(); })); });
  }
  requestAnimationFrame(frame);
}
// test/debug handle (read-only inspection + deterministic stepping)
window.__game = {
  get state() { return { mode, G, pos: [P.pos.x, P.pos.z], menus: menus.length, ai: AI.on, aiStep: AI.i, bots: bots.map(b => [b.state, +b.pos.x.toFixed(1), +b.pos.z.toFixed(1)]) }; },
  step(n, dt = 1 / 30) { for (let i = 0; i < n; i++) step(dt); },
  keyDown(c) { KEYS.add(c); noteAct('kb'); }, keyUp(c) { KEYS.delete(c); },
  startDemo() { AI.on = true; startGame(true); },
  win() { startWin(); }, lose() { G.badges = 1; caught(bots[0]); },
};
boot();
</script>
