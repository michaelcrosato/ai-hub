<!--
HARD SHELLS IN HARD TIMES  -  a spiritual successor to Turtles in Time

SOURCE INFORMATION
- Date: 2026-10-29 08:03 (session start)
- Turtles in Time (SOURCE) -> "Hard Shells in Hard Times" (title chosen with a real RNG: index 26 of 50 brainstormed titles)
- Tech: Three.js r180 (WebGPU renderer + TSL node materials, no fallback), Rapier 3D 0.19.3 (rapier3d-compat), Gamepad API, WebAudio, plain ES modules bundled with Bun into one HTML file; AI Hub Session Protocol v1 client 1.3.0
- Art Direction: stylized cel-shading - MeshToonNodeMaterial with a 4-step gradient ramp, rim light, inverted-hull ink outlines, hard directional shadows, comic-book pop-up text
- Animation: procedural keyframe/pose-blend rig system (jointed primitive characters, data-driven clips with smoothing, squash and stretch, tumble from Rapier bodies)
- Audio: all code-written. Sequenced chiptune/funk/shanty/synthwave music, synthesized SFX, and Animalese-style gibberish voices (formant-filtered blips per letter). No audio files.
- Online: AI Hub side-by-side ("parallel") session mode - progress, result, seeded deal, probe; no sockets of its own. Local co-op for up to 4 players (pads and keyboard).
- Testing: lightweight headless Chromium (Playwright, SwiftShader WebGPU), the official ai-hub harness at 1 and 2 players, and scripted AI full-stage playthroughs through a sim-step hook
- Environment: Claude Code CLI (headless); Linux; browser unknown (tested in headless Chromium)
- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium
- Usage: unknown (no cost or token totals were available to the agent); session time unknown

TESTING FEEDBACK
- Issues caught by testing: 7 (Rapier panics from freed/removed bodies x2, hub hello sent too late, Esc not closing the menu, no progress reports while idle, tally screen not advancing, enemies wedging against props)
- Critical / game-breaking: 5 (both Rapier panics, the late hello, the wedged-enemy soft lock, tally advance)
- Most helpful test: scripted AI playthrough of all three stages through a sim-step hook; it found the soft lock.
- Least helpful test: single title-screen render-target snapshot (it only showed a black frame before the scene was ready).

ENGINE FEEDBACK
- Liked most: TSL node materials made cel-shading, outlines and animated water short; Rapier's character controller and collision groups were quick to wire up.
- Stuck / guessed wrong: freed-world handles panic Rapier with a bare "unreachable"; the controller treats dynamic props as hard walls, so enemies wedged until they got their own collision group.
- Most important thing built myself: the animation/rig system, the combat and AI layer, the sequenced audio engine, and the controller-first UI.
- Hardest part: headless WebGPU verification (canvas screenshots are blank, so a render-target readback hook was needed) and slow software rendering.
- Remove or overhaul: the opaque Rapier error messages (a panic gives no hint which handle was bad).
- One change: first-class toon/outline support in the WebGPU renderer so outlines do not need hand-made hull meshes.

PROMPT FEEDBACK
- Liked most: a clear done-state, controller-first UX rules, and the explicit hub protocol with a harness to test against.
- Confusing: "Treat performance as unlimited" next to "keep testing lightweight"; the hub says to give a WebGL fallback while this prompt says no fallback; the hub caps rounds at 15 minutes while the demo should show everything.
- Hardest thing: fitting a full multi-stage beat-em-up vertical slice, AI attract mode, hub integration and in-file reports into one run.
- One test I would have run: a real DualSense (or emulated pad) end-to-end pass through menus and a whole stage, including stick inversion.

CREDITS
Design, code, music and voices: generated by Claude Sonnet 5.5. Libraries: three.js (MIT), Rapier (Apache-2.0).

<script>/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

  <div><b>${glyph("attack")}</b> Attack — tap for a 4-hit combo</div><div><b>${glyph("jump")}</b> Jump — then ${glyph("attack")} for a dive kick</div>
  <div><b>${glyph("grab")}</b> Grab — then hold a direction + ${glyph("attack")} to throw</div><div><b>${glyph("dash")}</b> Roll (invincible) — sprint + ${glyph("attack")} = dash tackle</div>
  <div><b>${glyph("special")}</b> Special — costs Time Meter (33). Full meter = TIME STOP</div><div><b>${glyph("taunt")}</b> Taunt — style points & meter</div>
  <div class="full">★ Throw foes TOWARD THE SCREEN (hold down) for a SCREEN SMASH bonus. Thrown bodies bowl over everything in their path.<br>★ Break crates and barrels for Time Shards (fill your meter), snack cakes (heal) and more. Barrels explode!<br>★ Armored Bulk Bots can't be grabbed until their guard breaks. Dodge the red warning circles!<br>★ Stage 2 has a SURF section: ${glyph("jump")} hop, ${glyph("attack")} smash, ${glyph("dash")} boost, and tricks off ramps.<br>★ Up to 4 heroes can join on the character select screen — controllers or keyboard. Shared lives and 3 continues.</div>
  </div><div class="hint">${glyph("back")} back</div></div>`);
  M.back = () => {

}
function openAbout(from) {

  M.menu = null;

  showScreen(`<div class="panel"><h2>ABOUT & CREDITS</h2><div class="scroll"></div><div class="hint">Stick up/down to scroll · ${glyph("back")} back</div></div>`);
  document.querySelector(".scroll").textContent = txt;
  M.back = () => {
    hideScreen();
    if (from === "pause")

}
function gotoSelect() {
  M.scene = "select";
  hideTitle();
  M.slots = [];
  const d = anyPlayerDevice((d2) => d2.menu.confirm) || kbDevice;
  M.slots.push({ dev: d, cursor: 0, ready: false, lx: 0 });

}
function renderSelect() {
  const cards = [0, 1, 2, 3].map((i) => {
    const s = M.slots[i];
    if (!s)
      return `<div class="hc empty" style="--c:#888"><div class="face">?</div><div class="n">PLAYER ${i + 1}</div><div class="b">Press ${glyph("confirm")} on another controller or keyboard to join</div></div>`;
    const h = HEROES[s.cursor];
    return heroCardHTML(h, i, { cls: s.ready ? "ready" : "", tag: `P${i + 1}${s.ready ? " · READY!" : " · ◀ ▶"}` });
  }).join("");
  const ready = M.slots.length && M.slots.every((s) => s.ready);
  showScreen(`<div class="panel" style="max-width:96vw"><h2>CHOOSE YOUR SHELL</h2><div class="sel-grid">${cards}</div><div class="hint">${ready ? `All set! Press ${glyph("confirm")} / ${glyph("options")} to start` : `◀ ▶ choose · ${glyph("confirm")} ready · ${glyph("back")} back`}</div></div>`);
}
function selectUpdate(dt, nav2) {
  let dirty = false;
  for (const d of allDevices()) {
    const m = d.menu;
    const slot = M.slots.find((s) => s.dev === d);
    if (!slot) {
      if (m.confirm && M.slots.length < 4) {
        M.slots.push({ dev: d, cursor: M.slots.length % 4, ready: false, lx: 0 });
        sfx("ui_ok");
        dirty = true;
      }
      continue;
    }
    const x = m.x;
    if (x && x !== slot.lx && !slot.ready) {
      slot.cursor = (slot.cursor + x + 4) % 4;
      sfx("ui_move");
      dirty = true;
    }
    slot.lx = x;
    if (m.confirm) {
      if (!slot.ready) {
        slot.ready = true;
        sfx("ui_ok");
        bark({ ...HEROES[slot.cursor].voice }, HEROES[slot.cursor].quip[0]);
        dirty = true;
      } else if (M.slots.every((s) => s.ready)) {
        startGame();
        return;
      }
    }
    if (m.back) {
      if (slot.ready) {
        slot.ready = false;
        dirty = true;
        sfx("ui_back");
      } else if (slot === M.slots[0]) {
        sfx("ui_back");
        hideScreen();
        gotoTitle();
        return;
      } else {
        M.slots.splice(M.slots.indexOf(slot), 1);
        dirty = true;
      }
    }
    if (m.options && M.slots.every((s) => s.ready)) {
      startGame();
      return;
    }
  }
  if (dirty)
    renderSelect();
}
function startGame() {
  hideScreen();
  hideTitle();
  M.scene = "play";
  M.menu = null;
  const setups = M.slots.map((s) => ({ hero: s.cursor, dev: s.dev }));
  startRun(setups, {});
  hudSetup();
  beginStage(true);
}
function beginStage(first) {
  const st = STAGES[S.stageIdx];
  S.dialogue = true;
  say(st.intro, () => {
    S.dialogue = false;
  });
}
function playUpdate(dt, nav2) {
  if (S.paused) {
    menuScene(nav2);
    return;
  }
  if (SESSION && (hub.time() < 0 || !M.canPlay)) {
    S.paused = false;
  }
  if (nav2.options || nav2.escape) {
    if (!S.dialogue)
      openPause();
  }
}
function openPause() {
  S.paused = true;
  M.scene = "pause";
  pauseMenu();
}
function pauseMenu() {
  M.scene = "pause";
  S.paused = true;
  showScreen(`<div class="panel"><h2>PAUSED</h2><div class="menu" id="pmenu"></div></div>`);
  const items = [
    { label: "RESUME", run: () => resume2() },
    { label: "MOVES & TIPS", run: () => openHowTo("pause") },
    { label: "SETTINGS", run: () => openSettings("pause") }
  ];
  if (!SESSION)
    items.push({ label: "QUIT TO TITLE", run: () => {
      S.paused = false;
      gotoTitle();
    } });
  M.menu = new Menu(items, $("pmenu"));
  M.back = resume2;
}
function resume2() {
  hideScreen();
  S.paused = false;
  M.scene = "play";
  M.menu = null;
}
function rankFor(p) {
  const sc = p.score - (p.stageScore0 || 0), lp = 1 - p.lives / 4;
  const v = sc / 1500 + p.maxCombo * 0.2 - (p.damageTaken || 0) * 0.002 + (S.time < 240 ? 1 : 0);
  return v > 24 ? "S" : v > 16 ? "A" : v > 9 ? "B" : "C";
}
function onStageClear() {
  if (SESSION) {
    sendResult(true);
    showWait("STAGE CLEAR!");
    return;
  }
  const st = STAGES[S.stageIdx];
  M.scene = "tally";
  const cols = S.players.map((p) => `<div class="col" style="--c:${p.def.hex}"><div class="r"><b>${p.name}</b></div><div class="r"><span>Score</span><b>${Math.floor(p.score)}</b></div><div class="r"><span>Foes KO'd</span><b>${p.kos - (p.stats0 ? p.stats0.kos : 0)}</b></div><div class="r"><span>Best combo</span><b>${p.maxCombo}</b></div><div class="r"><span>Screen smashes</span><b>${p.smashes}</b></div><div class="r"><span>Lives left</span><b>${p.lives}</b></div><div class="rank">${rankFor(p)}</div></div>`).join("");
  showScreen(`<div class="panel"><h2>${st.name.toUpperCase()} — CLEAR!</h2><div class="tally" style="--n:${S.players.length}">${cols}</div><div class="hint">Time ${Math.floor(S.time / 60)}:${String(Math.floor(S.time % 60)).padStart(2, "0")} · Press ${glyph("confirm")} to continue</div></div>`);
  S.clearShown = false;
  M.menu = null;
  M.back = () => nextStage();
  for (const p of S.players)
    p.lives = Math.min(5, p.lives + 1);
}
function nextStage() {
  hideScreen();
  bossBar(null);
  goArrow(false);
  if (S.stageIdx + 1 >= STAGES.length) {
    playEnding();
    return;
  }
  M.scene = "play";
  S.clearShown = false;
  loadStage(S.stageIdx + 1);
  hudSetup();
  beginStage();
}
function playEnding() {
  M.scene = "play";
  S.dialogue = true;
  playMusic("win");
  S.players.forEach((p) => {
    p.winPose = true;
  });
  say(ENDING, () => {
    S.dialogue = false;
    creditsScreen();
  });
}
function creditsScreen() {
  M.scene = "credits";
  const tot = S.players.reduce((a, p) => a + Math.floor(p.score), 0);
  showScreen(`<div class="panel"><h2>THE END?</h2><div class="rank" style="font-size:7vh">TOTAL SCORE ${tot}</div><div class="hint" style="font-size:3vh">Thanks for playing ${TITLE}!<br>Press ${glyph("confirm")} for the title screen.</div></div>`);
  M.menu = null;
  M.back = () => {
    hideScreen();
    gotoTitle();
  };
  M.menu = new Menu([{ label: "BACK TO TITLE", run: () => {
    hideScreen();
    gotoTitle();
  } }], document.createElement("div"));
}
function onGameOver() {
  if (SESSION) {
    sendResult(false);
    showWait("OUT OF LIVES");
    return;
  }
  M.scene = "over";
  playMusic("over");
  let n = 9;
  const render2 = () => showScreen(`<div class="panel"><h2>GAME OVER</h2><div class="rank" style="font-size:16vh">${S.credits > 0 ? n : "-"}</div><div class="hint" style="font-size:3vh">${S.credits > 0 ? `Continues left: ${S.credits}` : "No continues left."}</div><div class="menu" id="gmenu"></div></div>`);
  render2();
  const items = [];
  if (S.credits > 0)
    items.push({ label: "CONTINUE", run: () => {
      clearInterval(M.cd);
      if (continueRun()) {
        hideScreen();
        M.scene = "play";
        playMusic(S.stage.music);
      }
    } });
  items.push({ label: "GIVE UP", run: () => {
    clearInterval(M.cd);
    hideScreen();
    gotoTitle();
  } });
  M.menu = new Menu(items, $("gmenu"));
  M.back = null;
  clearInterval(M.cd);
  M.cd = setInterval(() => {
    n--;
    if (n < 0) {
      clearInterval(M.cd);
      hideScreen();
      gotoTitle();
      return;
    }
    const el = document.querySelector(".rank");
    if (el)
      el.textContent = n;
    sfx("tick");
  }, 1000);
}
function showWait(msg) {
  M.scene = "over";
  M.menu = null;
  M.back = null;
  showScreen(`<div class="panel"><h2>${msg}</h2><div class="hint" style="font-size:3.4vh">Final score ${Math.floor(S.players[0].score)}<br>Waiting for the round to end...</div></div>`);
}
var ATTRACT = [
  { stage: 0, startX: 0, len: 32, heroes: [0, 1] },
  { stage: 0, startX: 92, len: 30, heroes: [2, 3] },
  { stage: 1, startX: 62, len: 30, heroes: [1, 0] },
  { stage: 0, startX: 127, len: 34, heroes: [3, 2] },
  { stage: 2, startX: 100, len: 30, heroes: [0, 2] }
];
function startAttract() {
  M.scene = "attract";
  M.attractIdx = 0;
  hideTitle();
  hideScreen();
  attractSegment();
  $("demo").style.display = "block";
  $("demotag").style.display = "block";
  $("demo").textContent = glyphs("PRESS ANY BUTTON TO START");
}
function attractSegment() {
  const seg = ATTRACT[M.attractIdx % ATTRACT.length];
  M.attractT = 0;
  M.menu = null;
  startRun(seg.heroes.map((h) => ({ hero: h, dev: makeAI() })), { attract: true, stage: seg.stage, startX: seg.startX });
  hudSetup();
  hideHint();
  bossBar(null);
}
function attractUpdate(dt, nav2) {
  M.attractT += dt;
  if (nav2.any || nav2.confirm || nav2.options || nav2.back) {
    exitAttract();
    return;
  }
  if (M.attractT > ATTRACT[M.attractIdx % ATTRACT.length].len || S.over) {
    M.attractIdx++;
    attractSegment();
  }
}
function exitAttract() {
  $("demo").style.display = "none";
  $("demotag").style.display = "none";
  gotoTitle();
  M.idle = -0.3;
}
async function startSession(connecting) {
  const info = await connecting;
  if (!info) {
    gotoTitle();
    return;
  }
  S.session = true;
  const rng = hub.rng("deal");
  hideTitle();
  M.scene = "play";
  const idx = (hub.me | 0) % 4;
  startRun([{ hero: idx, dev: kbDevicePool() }], { session: true, rng, stage: 0 });
  hudSetup();
  S.dialogue = false;
  S.paused = true;
  hub.on("start", () => {
    init();
    resume();
  });
  hub.on("time-up", () => {
    if (!M.resultSent)
      sendResult(false);
  });
  hub.on("end", () => {
    M.ended = true;
    S.paused = true;
    silence(true);
    hideHint();
  });
  setInterval(() => {
    if (!M.ended && !M.resultSent && S.players[0])
      hub.progress({ score: Math.floor(S.players[0].score), label: `Stage ${S.stage.id}` });
  }, 1000);
  hub.ready();
  const wait = () => {
    if (hub.time() >= 0 && !M.ended) {
      S.paused = false;
    } else if (!M.ended)
      requestAnimationFrame(wait);
  };
  wait();
}
function kbDevicePool() {
  const d = { id: "merge", ax: 0, az: 0, held: {}, pressed: {}, menu: {} };
  const poll = () => {
    const ds = allDevices();
    d.ax = 0;
    d.az = 0;
    d.held = {};
    d.pressed = {};
    for (const x of ds) {
      if (Math.abs(x.ax) > Math.abs(d.ax))
        d.ax = x.ax;
      if (Math.abs(x.az) > Math.abs(d.az))
        d.az = x.az;
      for (const k in x.held)
        d.held[k] = d.held[k] || x.held[k];
      for (const k in x.pressed)
        d.pressed[k] = d.pressed[k] || x.pressed[k];
    }
  };
  return new Proxy(d, { get(t, k) {
    poll();
    return t[k];
  } });
}
function sendResult(cleared) {
  if (M.resultSent)
    return;
  M.resultSent = true;
  const p = S.players[0];
  const bonus = cleared ? 2000 + p.lives * 500 : 0;
  const score = Math.floor(p.score + bonus);
  hub.result({ score, stats: { kos: p.kos, "best combo": p.maxCombo, smashes: p.smashes, cleared: cleared ? "yes" : "no" }, awards: p.smashes ? [{ title: "Screen Smasher", detail: `${p.smashes} foes thrown through the screen` }] : [] });
}
window.__hshht = { S, M, Game, snapshot, simSteps, startQuick(stage = 0, startX = 0, n = 1) {
  M.scene = "play";
  hideTitle();
  hideScreen();
  startRun(Array.from({ length: n }, (_, i) => ({ hero: i % 4, dev: makeAI() })), { stage, startX, attract: true });
  hudSetup();
} };
boot();
