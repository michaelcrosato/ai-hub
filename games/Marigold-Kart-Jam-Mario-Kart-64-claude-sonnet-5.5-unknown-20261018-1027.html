<!doctype html>
<!--
  MARIGOLD KART JAM — a spiritual successor to Mario Kart 64

  SOURCE INFORMATION
  - Initial Date: 2026-10-18 (date of the first prompt)
  - SOURCE: Mario Kart 64 (Nintendo, Nintendo 64, 1996). Original spiritual successor: all code, tracks,
            characters, music and sound are original and procedurally generated. No Nintendo assets are used.
  - Tech/Engine: Hand-written renderer on the browser-native WebGPU API + WGSL shaders (no WebGPU fallback),
                 Web Audio API (fully synthesized music + SFX), Gamepad API, vanilla ES2022 JavaScript.
                 No third-party libraries or engines (nothing to version; runs on the browser's built-in APIs).
  - Environment: CLI (Claude Code) on Ubuntu 26.04 / WSL2; target runtime = a WebGPU-capable Chromium-class
                 desktop browser (the exact user agent is shown on the in-game About screen at runtime).
  - Model and Effort Level: Anthropic — Claude Sonnet 5.5 (claude-sonnet-5-5); reasoning effort level: unknown.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marigold Kart Jam</title>
<style>
:root{--pink:#ff3d9a;--yellow:#ffe14d;--cyan:#2ee6d6;--ink:#150a2b;--paper:#fff7e0;--violet:#8a5cff}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:#150a2b;overflow:hidden;color:#fff;
  font-family:"Arial Black","Impact","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
body.nocursor{cursor:none}
#gfx{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#ui .hit{pointer-events:auto}
.stroke{-webkit-text-stroke:.55vmin var(--ink);paint-order:stroke fill}

/* ---------- title ---------- */
#title{position:absolute;inset:0}
#logo{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%) rotate(-4deg);text-align:center;white-space:nowrap}
#logo .l1{font-size:15vmin;line-height:.88;font-style:italic;color:var(--yellow);letter-spacing:-.3vmin;
  -webkit-text-stroke:.8vmin var(--ink);paint-order:stroke fill;
  text-shadow:.9vmin .9vmin 0 var(--pink),1.8vmin 1.8vmin 0 var(--ink)}
#logo .l2{font-size:11vmin;line-height:.9;font-style:italic;color:#fff;letter-spacing:.6vmin;
  -webkit-text-stroke:.7vmin var(--ink);paint-order:stroke fill;
  text-shadow:.8vmin .8vmin 0 var(--cyan),1.6vmin 1.6vmin 0 var(--ink)}
#logo .l3{display:inline-block;margin-top:2.4vmin;padding:.8vmin 3vmin;background:var(--pink);color:#fff;
  font-size:3vmin;letter-spacing:.5vmin;transform:skewX(-10deg);border:.45vmin solid var(--ink)}
#start{position:absolute;left:0;right:0;bottom:22%;text-align:center;font-size:5.4vmin;font-style:italic;
  color:#fff;-webkit-text-stroke:.5vmin var(--ink);paint-order:stroke fill;text-shadow:.6vmin .6vmin 0 var(--ink);
  animation:blink 1.1s steps(2,jump-none) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}

/* ---------- menus ---------- */
#menu{position:absolute;inset:0}
.mwrap{position:absolute;left:6vmin;top:50%;transform:translateY(-50%);width:min(58vmin,46vw)}
.mwrap.wide{width:min(150vmin,94vw);left:50%;top:auto;bottom:9vmin;transform:translateX(-50%)}
.mwrap.wide .mtitle{text-align:center}
.mwrap.center{width:min(92vmin,90vw);left:50%;top:50%;transform:translate(-50%,-50%)}
.mtitle{font-size:7.4vmin;font-style:italic;color:var(--yellow);margin-bottom:2vmin;line-height:1;
  -webkit-text-stroke:.6vmin var(--ink);paint-order:stroke fill;text-shadow:.7vmin .7vmin 0 var(--pink),1.4vmin 1.4vmin 0 var(--ink)}
.msub{font-size:2.6vmin;color:#fff;margin:-1vmin 0 2vmin;font-family:system-ui,sans-serif;font-weight:700;
  text-shadow:0 .3vmin 0 var(--ink),0 0 1.2vmin var(--ink)}
.btn{display:flex;align-items:center;justify-content:space-between;gap:2vmin;font-size:4.4vmin;font-style:italic;
  padding:1.5vmin 3vmin;margin:1.3vmin 0;background:rgba(21,10,43,.84);border:.5vmin solid #fff;
  transform:skewX(-8deg);transition:transform .12s,background .12s;pointer-events:auto;cursor:pointer}
.btn small{display:block;font-size:2.2vmin;font-style:normal;font-family:system-ui,sans-serif;font-weight:700;opacity:.85}
.btn.sel{background:var(--yellow);color:var(--ink);border-color:var(--ink);transform:skewX(-8deg) translateX(2.2vmin) scale(1.04);
  box-shadow:1vmin 1vmin 0 var(--pink)}
.btn .val{white-space:nowrap}
.btn .ar{display:inline-block;padding:0 1vmin;opacity:.55}
.btn.sel .ar{opacity:1}
.pips{letter-spacing:.2vmin}
.cards{display:flex;gap:2.2vmin;justify-content:center;flex-wrap:nowrap}
.card{flex:1 1 0;min-width:0;max-width:26vmin;padding:2vmin 1.6vmin;background:rgba(21,10,43,.86);border:.5vmin solid #fff;
  transform:skewX(-5deg);text-align:center;transition:transform .12s,background .12s;pointer-events:auto;cursor:pointer}
.card.sel{background:var(--yellow);color:var(--ink);border-color:var(--ink);transform:skewX(-5deg) translateY(-1.6vmin) scale(1.06);
  box-shadow:1vmin 1vmin 0 var(--pink)}
.card .nm{font-size:3vmin;font-style:italic;margin:1vmin 0}
.card .dot{width:11vmin;height:11vmin;border-radius:50%;margin:0 auto;border:.6vmin solid var(--ink);box-shadow:inset -1.2vmin -1.2vmin 0 rgba(0,0,0,.25)}
.card .st{display:flex;align-items:center;gap:1vmin;font-size:1.9vmin;font-family:system-ui,sans-serif;font-weight:800;margin:.7vmin 0;text-align:left}
.card .st span{width:9vmin}
.card .bar{flex:1;height:1.5vmin;background:rgba(255,255,255,.25);border:.25vmin solid var(--ink)}
.card.sel .bar{background:rgba(21,10,43,.2)}
.card .bar i{display:block;height:100%;background:var(--cyan)}
.card.sel .bar i{background:var(--pink)}
.card svg.trk{width:100%;height:14vmin;margin:.6vmin 0}
.card .tg{font-size:1.9vmin;font-family:system-ui,sans-serif;font-weight:700;line-height:1.25;min-height:5vmin}
.card .stars{font-size:2.6vmin;color:var(--yellow);letter-spacing:.3vmin}
.card.sel .stars{color:var(--pink)}
.about{max-height:68vmin;overflow:auto;padding:2.4vmin 3vmin;background:rgba(21,10,43,.9);border:.5vmin solid #fff;
  font-family:system-ui,sans-serif;font-weight:600;font-size:2.35vmin;line-height:1.4;pointer-events:auto}
.about h3{font-family:"Arial Black",Impact,sans-serif;font-style:italic;color:var(--yellow);font-size:3vmin;margin:1.4vmin 0 .5vmin}
.about h3:first-child{margin-top:0}
.about b{color:var(--cyan)}
.about code{font-size:2vmin;opacity:.9;word-break:break-all}
.about td{padding:.2vmin 2vmin .2vmin 0;vertical-align:top}
.rtable{width:100%;border-collapse:collapse;font-size:3.2vmin;font-style:italic;margin-bottom:1vmin}
.rtable td{padding:.7vmin 1.4vmin;background:rgba(21,10,43,.86);border-bottom:.35vmin solid rgba(255,255,255,.18)}
.rtable tr.me td{background:var(--yellow);color:var(--ink)}
.rtable .sw{display:inline-block;width:2.6vmin;height:2.6vmin;border-radius:50%;border:.35vmin solid var(--ink);vertical-align:middle;margin-right:1.2vmin}
.rtable td.r{text-align:right;font-family:system-ui,sans-serif;font-weight:900}

/* ---------- prompts bar ---------- */
#prompts{position:absolute;left:0;right:0;bottom:2.6vmin;display:flex;justify-content:center;gap:4vmin;
  font-size:2.6vmin;font-family:system-ui,sans-serif;font-weight:800;text-shadow:0 .3vmin 0 var(--ink),0 0 1vmin var(--ink)}
#prompts span{display:flex;align-items:center;gap:1vmin}
.key{display:inline-flex;min-width:4.6vmin;height:4.6vmin;padding:0 1vmin;align-items:center;justify-content:center;border-radius:2.4vmin;
  background:var(--paper);color:var(--ink);border:.35vmin solid var(--ink);font-size:2.4vmin;font-family:system-ui,sans-serif;font-weight:900}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0}
#hPos{position:absolute;left:3.5vmin;top:2.5vmin;font-style:italic;line-height:.9}
#hPos b{font-size:17vmin;color:var(--yellow);-webkit-text-stroke:.8vmin var(--ink);paint-order:stroke fill;text-shadow:.9vmin .9vmin 0 var(--pink),1.8vmin 1.8vmin 0 var(--ink)}
#hPos i{font-size:7vmin;color:var(--yellow);-webkit-text-stroke:.5vmin var(--ink);paint-order:stroke fill;margin-left:.4vmin}
#hPos small{font-size:4vmin;color:#fff;-webkit-text-stroke:.4vmin var(--ink);paint-order:stroke fill;margin-left:1vmin}
#hLap{position:absolute;left:3.8vmin;top:19vmin;font-size:5vmin;font-style:italic;-webkit-text-stroke:.45vmin var(--ink);paint-order:stroke fill;text-shadow:.5vmin .5vmin 0 var(--ink)}
#hTime{position:absolute;left:3.8vmin;top:25.5vmin;font-size:3.4vmin;font-style:italic;font-family:system-ui,sans-serif;font-weight:900;text-shadow:0 .3vmin 0 var(--ink),0 0 1vmin var(--ink)}
#hItem{position:absolute;left:50%;top:2.5vmin;transform:translateX(-50%);width:15vmin;height:15vmin;border-radius:50%;
  background:rgba(21,10,43,.62);border:.7vmin solid #fff;display:flex;align-items:center;justify-content:center}
#hItem svg{width:80%;height:80%}
#hItem em{position:absolute;right:-1vmin;bottom:-1vmin;font-style:normal;font-size:4vmin;background:var(--pink);border:.4vmin solid var(--ink);border-radius:50%;width:5.4vmin;height:5.4vmin;display:flex;align-items:center;justify-content:center}
#hItem.has{border-color:var(--yellow);box-shadow:0 0 3vmin var(--yellow)}
#hMap{position:absolute;right:3vmin;top:3vmin;width:23vmin;height:23vmin;opacity:.92}
#hSpeed{position:absolute;right:4vmin;bottom:4vmin;text-align:right;font-style:italic;line-height:.9}
#hSpeed b{font-size:12vmin;-webkit-text-stroke:.7vmin var(--ink);paint-order:stroke fill;text-shadow:.8vmin .8vmin 0 var(--ink)}
#hSpeed small{display:block;font-size:3.2vmin;color:var(--yellow);-webkit-text-stroke:.4vmin var(--ink);paint-order:stroke fill}
#hDrift{position:absolute;left:50%;bottom:6vmin;transform:translateX(-50%);display:flex;gap:1.4vmin;opacity:0;transition:opacity .15s}
#hDrift i{width:6vmin;height:2.4vmin;background:rgba(21,10,43,.7);border:.4vmin solid #fff;transform:skewX(-20deg)}
#hDrift i.on0{background:#35a7ff}#hDrift i.on1{background:#ff9a2b}#hDrift i.on2{background:#ff3dc8}
#hMsg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:9vmin;font-style:italic;color:#fff;opacity:0;
  -webkit-text-stroke:.7vmin var(--ink);paint-order:stroke fill;text-shadow:.8vmin .8vmin 0 var(--pink),1.6vmin 1.6vmin 0 var(--ink);transform:scale(.8)}
#hMsg.show{opacity:1;transform:scale(1);transition:transform .18s cubic-bezier(.2,1.6,.4,1)}
#hCount{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:30vmin;font-style:italic;color:var(--yellow);line-height:1;
  -webkit-text-stroke:1.2vmin var(--ink);paint-order:stroke fill;text-shadow:1.4vmin 1.4vmin 0 var(--pink),2.8vmin 2.8vmin 0 var(--ink)}
#hWrong{position:absolute;left:0;right:0;top:46%;text-align:center;font-size:8vmin;font-style:italic;color:#ff4b5c;
  -webkit-text-stroke:.7vmin var(--ink);paint-order:stroke fill;animation:blink .6s steps(2,jump-none) infinite}
#hLines{position:absolute;inset:0;opacity:0;transition:opacity .2s;
  background:repeating-conic-gradient(from 0deg at 50% 52%,rgba(255,255,255,0) 0deg 5deg,rgba(255,255,255,.28) 5.4deg 6deg);
  -webkit-mask:radial-gradient(circle at 50% 52%,transparent 34%,#000 78%);mask:radial-gradient(circle at 50% 52%,transparent 34%,#000 78%)}
#hHint{position:absolute;left:0;right:0;bottom:3vmin;text-align:center;font-size:2.8vmin;font-family:system-ui,sans-serif;font-weight:800;
  text-shadow:0 .3vmin 0 var(--ink),0 0 1vmin var(--ink)}
#hHint .key{margin:0 .6vmin}

#demoBar{position:absolute;left:0;right:0;bottom:0;padding:2.2vmin 0 3vmin;text-align:center;font-size:4.2vmin;font-style:italic;
  background:linear-gradient(transparent,rgba(21,10,43,.88));-webkit-text-stroke:.35vmin var(--ink);paint-order:stroke fill}
#demoBar b{color:var(--yellow);margin-right:2vmin;animation:blink 1.1s steps(2,jump-none) infinite}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#150a2b;opacity:0;transition:opacity .35s;pointer-events:none}

/* ---------- touch / fatal ---------- */
#touch,#fatal{position:absolute;inset:0;background:rgba(21,10,43,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:6vmin;gap:4vmin;pointer-events:auto}
#touch h2,#fatal h2{font-size:7vmin;font-style:italic;color:var(--yellow);line-height:1.05;-webkit-text-stroke:.5vmin var(--ink);paint-order:stroke fill;text-shadow:.6vmin .6vmin 0 var(--pink)}
#touch p,#fatal p{font-size:3vmin;font-family:system-ui,sans-serif;font-weight:700;max-width:80vmin;line-height:1.35}
#touch button{font:inherit;font-size:4.4vmin;font-style:italic;padding:1.8vmin 5vmin;background:var(--yellow);color:var(--ink);border:.5vmin solid var(--ink);
  transform:skewX(-8deg);box-shadow:1vmin 1vmin 0 var(--pink);cursor:pointer}
@media (max-aspect-ratio:1/1){
  #logo .l1{font-size:12vw}#logo .l2{font-size:9vw}#logo .l3{font-size:2.6vw}
  .mwrap{left:50%;transform:translate(-50%,-50%);width:86vw}
  .btn{font-size:6vw}.btn small{font-size:3vw}.mtitle{font-size:9vw}
  .cards{flex-wrap:wrap}.card{flex:1 1 40%;max-width:none}
}
</style>
</head>
<body>
<canvas id="gfx"></canvas>
<div id="ui">
  <div id="title" hidden>
    <div id="logo"><div class="l1">MARIGOLD</div><div class="l2">KART JAM</div><div class="l3">A SPRAY-PAINTED SPIRITUAL SUCCESSOR</div></div>
    <div id="start" class="hit"></div>
  </div>
  <div id="menu" hidden></div>
  <div id="hud" hidden>
    <div id="hLines"></div>
    <div id="hPos"><b>1</b><i>ST</i><small>/6</small></div>
    <div id="hLap">LAP 1/3</div>
    <div id="hTime">0:00.00</div>
    <div id="hItem"></div>
    <canvas id="hMap" width="230" height="230"></canvas>
    <div id="hSpeed"><b>0</b><small>KM/H</small></div>
    <div id="hDrift"><i></i><i></i><i></i></div>
    <div id="hMsg"></div>
    <div id="hCount"></div>
    <div id="hWrong" hidden>WRONG WAY!</div>
    <div id="hHint" hidden></div>
  </div>
  <div id="demoBar" hidden><b>DEMO</b>PRESS ANY BUTTON TO PLAY</div>
  <div id="prompts"></div>
  <div id="flash"></div>
  <div id="touch" hidden>
    <h2>Controller or keyboard required</h2>
    <p>Marigold Kart Jam is a 10-foot, controller-first racer. Connect a gamepad or use a keyboard to play.</p>
    <button id="touchSet" type="button">SETTINGS</button>
  </div>
  <div id="fatal" hidden><h2 id="fatalH">WebGPU required</h2><p id="fatalP"></p></div>
  <div id="fade"></div>
</div>
<script>
'use strict';
/* ===================================================================
   Marigold Kart Jam — utilities, settings, audio, input
   =================================================================== */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const wrapA = a => { a %= TAU; if (a > Math.PI) a -= TAU; if (a < -Math.PI) a += TAU; return a; };
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const hex = c => [(c >> 16 & 255) / 255, (c >> 8 & 255) / 255, (c & 255) / 255];
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const hsv = (h, s, v) => {
  h = ((h % 1) + 1) % 1; const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
};
const fmtTime = t => { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2); };
const ordinal = n => ['ST', 'ND', 'RD', 'TH', 'TH', 'TH'][n - 1] || 'TH';

/* ---------------- settings ---------------- */
const SETKEY = 'marigold-kart-jam-settings-v1';
const SET = Object.assign({ music: 7, sfx: 8, diff: 1, laps: 3, shake: 1, outline: 1, flash: 1, units: 0 }, (() => {
  try { return JSON.parse(localStorage.getItem(SETKEY) || '{}'); } catch (e) { return {}; }
})());
function saveSet() { try { localStorage.setItem(SETKEY, JSON.stringify(SET)); } catch (e) { /* storage unavailable */ } }

/* ---------------- audio (fully synthesized) ---------------- */
const MENU_SONG = { bpm: 98, root: 52, prog: [0, 5, 3, 7], minor: true, seed: 5, drums: false, lead: false, pad: true };
const AU = {
  ctx: null, song: null, ns: 0, nt: 0, tempo: 1, mel: [],
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      const c = this.ctx = new C();
      this.mg = c.createGain(); this.mg.connect(c.destination);
      this.mus = c.createGain(); this.mus.connect(this.mg);
      this.sx = c.createGain(); this.sx.connect(this.mg);
      const n = c.sampleRate; const b = c.createBuffer(1, n, c.sampleRate); const d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.nb = b;
      // engine
      this.eo1 = c.createOscillator(); this.eo1.type = 'sawtooth';
      this.eo2 = c.createOscillator(); this.eo2.type = 'square';
      this.ef = c.createBiquadFilter(); this.ef.type = 'lowpass'; this.ef.frequency.value = 400;
      this.eg = c.createGain(); this.eg.gain.value = 0;
      this.eo1.connect(this.ef); this.eo2.connect(this.ef); this.ef.connect(this.eg); this.eg.connect(this.sx);
      this.eo1.start(); this.eo2.start();
      // skid
      this.sn = c.createBufferSource(); this.sn.buffer = b; this.sn.loop = true;
      this.sf = c.createBiquadFilter(); this.sf.type = 'bandpass'; this.sf.frequency.value = 1800; this.sf.Q.value = 2;
      this.sg = c.createGain(); this.sg.gain.value = 0;
      this.sn.connect(this.sf); this.sf.connect(this.sg); this.sg.connect(this.sx); this.sn.start();
      this.applyVol();
      setInterval(() => this.tick(), 40);
      if (c.state === 'suspended') c.resume().catch(() => {});
    } catch (e) { this.ctx = null; }
  },
  applyVol() {
    if (!this.ctx) return;
    this.mus.gain.value = SET.music / 10 * 0.55;
    this.sx.gain.value = SET.sfx / 10 * 0.9;
  },
  tone(f, d, type, v, slide, at, dest) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + (at || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest || this.sx); o.start(t); o.stop(t + d + 0.05);
  },
  noise(d, v, ftype, f0, f1, at, dest) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + (at || 0), s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.nb; f.type = ftype || 'lowpass'; f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(dest || this.sx); s.start(t); s.stop(t + d + 0.05);
  },
  setSong(s) {
    if (this.song === s) return;
    this.song = s; this.tempo = 1; this.ns = 0; this.nt = 0;
    if (s) {
      const r = rng(s.seed * 131 + 7), pent = s.minor ? [0, 3, 5, 7, 10] : [0, 2, 4, 7, 9];
      this.pent = pent; this.mel = [];
      for (let b = 0; b < 4; b++) { const row = []; for (let i = 0; i < 8; i++) row.push(r() < 0.62 ? (r() * 5) | 0 : null); this.mel.push(row); }
    }
  },
  mf(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  tick() {
    const c = this.ctx, s = this.song; if (!c || !s) return;
    if (this.nt === 0) this.nt = c.currentTime + 0.06;

  hideAll();
  W = createWorld(ti, mode, { char: char !== undefined ? char : chosen });
  W.onOver = mode === 'demo' ? onDemoOver : onRaceOver;
  AU.tempo = 1; AU.setSong(TRACKS[ti].song);
  for (const k in hudC) delete hudC[k];
  E.hud.hidden = false; E.demo.hidden = mode !== 'demo'; screen = mode === 'demo' ? 'demo' : 'race';
  E.prompts.innerHTML = ''; promptKey = '';
  fadeIn();
}
function startGP() {
  gp = { ti: 0, pts: [0, 0, 0, 0, 0, 0] };
  launch(0, 'race');
}
function backToMenu() {
  gp = null; fadeOut().then(() => { setBg(0, chosen); showMain(); fadeIn(); });
}
function sortedResults(w) { return w.karts.slice().sort((a, b) => effProg(b) - effProg(a)); }
function resultsTable(order, withPts) {
  let h = '<table class="rtable">';
  order.forEach((k, i) => {
    const me = k === (W && W.player);
    h += `<tr class="${me ? 'me' : ''}"><td>${i + 1}${ordinal(i + 1).toLowerCase()}</td><td><span class="sw" style="background:#${k.ch.col.toString(16).padStart(6, '0')}"></span>${k.ch.name}${me ? ' (you)' : ''}</td><td class="r">${k.finished ? fmtTime(k.finishT) : 'DNF'}</td>${withPts ? `<td class="r">+${PTS[i]} → ${gp.pts[k.ci]}</td>` : ''}</tr>`;
  });
  return h + '</table>';
}
function onRaceOver(w) {
  setTimeout(() => {
    if (W !== w) return;
    const order = sortedResults(w);
    if (gp) order.forEach((k, i) => { gp.pts[k.ci] += PTS[i]; });
    screen = 'results'; E.hud.hidden = true; AU.setSong(MENU_SONG);
    const you = order.indexOf(w.player) + 1;
    const items = [];
    if (gp) {
      if (gp.ti < TRACKS.length - 1) items.push({ label: 'Next Race', sub: TRACKS[gp.ti + 1].name, fn: () => { gp.ti++; launch(gp.ti, 'race'); } });
      else items.push({ label: 'Final Standings', fn: () => showGPFinal() });
    } else {
      items.push({ label: 'Race Again', fn: () => launch(w.ti, 'race') });
      items.push({ label: 'Choose Track', fn: () => { setBg(w.ti, chosen); showTrack(); } });
    }
    items.push({ label: 'Main Menu', fn: backToMenu });
    openMenu({ title: gp ? `RACE ${gp.ti + 1}/3 · YOU: ${you}${ordinal(you)}` : `YOU FINISHED ${you}${ordinal(you)}!`, head: resultsTable(order, !!gp), items, onBack: null, center: true });
  }, 1200);
}
function showGPFinal() {
  const order = W.karts.slice().sort((a, b) => gp.pts[b.ci] - gp.pts[a.ci]);
  let h = '<table class="rtable">';
  order.forEach((k, i) => {
    const me = k === W.player;
    h += `<tr class="${me ? 'me' : ''}"><td>${i + 1}${ordinal(i + 1).toLowerCase()}</td><td><span class="sw" style="background:#${k.ch.col.toString(16).padStart(6, '0')}"></span>${k.ch.name}${me ? ' (you)' : ''}</td><td class="r">${gp.pts[k.ci]} pts</td></tr>`;
  });
  h += '</table>';
  const champ = order[0] === W.player;
  openMenu({ title: champ ? 'GRAND PRIX CHAMPION!' : 'GRAND PRIX COMPLETE', sub: champ ? 'The whole town is covered in your graffiti.' : 'Not bad. Time for a rematch?', head: h, items: [{ label: 'Main Menu', fn: backToMenu }], onBack: null, center: true });
}
function pauseGame() {
  if (screen !== 'race' || W.state === 'countdown' && W.cdT > 3.2) return;
  W.paused = true; screen = 'pause'; AU.engine(0, false, false, false);
  const resume = () => { closeMenu(); W.paused = false; screen = 'race'; };
  openMenu({
    title: 'PAUSED', onBack: resume, items: [
      { label: 'Resume', fn: resume },
      { label: 'Restart Race', fn: () => launch(W.ti, 'race') },
      { label: 'Settings', fn: () => showSettings(() => pauseGame2(resume)) },
      { label: 'Quit to Menu', fn: backToMenu }
    ]
  });
}
function pauseGame2(resume) {
  screen = 'pause';
  openMenu({
    title: 'PAUSED', onBack: resume, items: [
      { label: 'Resume', fn: resume }, { label: 'Settings', fn: () => showSettings(() => pauseGame2(resume)) }, { label: 'Quit to Menu', fn: backToMenu }]
  });
}

/* ---------------- attract mode ---------------- */
function startDemo() {
  demoAct0 = userAct;
  const ti = demoIdx % TRACKS.length, ch = (Math.random() * CH.length) | 0;
  launch(ti, 'demo', ch);
}
function onDemoOver() { demoIdx++; const w = W; setTimeout(() => { if (W === w && screen === 'demo') { fadeOut().then(() => { if (screen === 'demo') startDemoNow(); }); } }, 200); }
function startDemoNow() { const ti = demoIdx % TRACKS.length, ch = (Math.random() * CH.length) | 0; screen = 'loading'; launchNoFade(ti, 'demo', ch); }
async function launchNoFade(ti, mode, char) {
  hideAll(); W = createWorld(ti, mode, { char }); W.onOver = onDemoOver; AU.tempo = 1; AU.setSong(TRACKS[ti].song);
  for (const k in hudC) delete hudC[k];
  E.hud.hidden = false; E.demo.hidden = false; screen = 'demo'; fadeIn();
}
function stopDemo() {
  screen = 'loading'; suppress = 0.5;
  fadeOut().then(() => { setBg(0, chosen); showTitle(); fadeIn(); });
}

/* ---------------- touch-only handling ---------------- */
const isTouchOnly = () => matchMedia('(any-pointer:coarse)').matches && !matchMedia('(any-pointer:fine)').matches && !gpConnected && !kbSeen;
$('#touchSet').addEventListener('click', () => {
  E.touch.hidden = true; screen = 'tset';
  showSettings(() => { closeMenu(); screen = 'touch'; E.touch.hidden = false; });
});
function touchCheck() {
  const t = isTouchOnly();
  if (t && !touchMode) { touchMode = true; hideAll(); screen = 'touch'; E.touch.hidden = false; E.prompts.innerHTML = ''; promptKey = ''; }
  else if (!t && touchMode) { touchMode = false; E.touch.hidden = true; closeMenu(); if (ready) showTitle(); }
}

/* ---------------- HUD ---------------- */
const ICON = {
  boost: '<path d="M10 38 L32 10 L54 38 L42 38 L32 25 L22 38Z" fill="#ffe14d" stroke="#150a2b" stroke-width="4" stroke-linejoin="round"/><path d="M10 58 L32 30 L54 58 L42 58 L32 45 L22 58Z" fill="#ff3d9a" stroke="#150a2b" stroke-width="4" stroke-linejoin="round"/>',
  triple: '<path d="M6 26 L18 8 L30 26Z M34 26 L46 8 L58 26Z M20 56 L32 34 L44 56Z" fill="#ffe14d" stroke="#150a2b" stroke-width="4" stroke-linejoin="round"/>',
  ball: '<circle cx="32" cy="32" r="22" fill="#ff5fb0" stroke="#150a2b" stroke-width="4"/><path d="M12 32 H52" stroke="#fff" stroke-width="6"/><circle cx="24" cy="22" r="5" fill="#fff" opacity=".8"/>',
  seek: '<circle cx="32" cy="32" r="16" fill="#ff3b3b" stroke="#150a2b" stroke-width="4"/><path d="M32 4 L38 16 M32 60 L26 48 M4 32 L16 26 M60 32 L48 38 M12 12 L22 20 M52 52 L42 44 M52 12 L44 22 M12 52 L20 42" stroke="#fff" stroke-width="5" stroke-linecap="round"/>',
  puddle: '<ellipse cx="32" cy="38" rx="26" ry="16" fill="#6a2ea8" stroke="#150a2b" stroke-width="4"/><ellipse cx="38" cy="34" rx="12" ry="6" fill="#ff3dc8"/><ellipse cx="22" cy="42" rx="6" ry="3" fill="#2ee6d6"/>',
  star: '<path d="M32 4 L40 24 L61 25 L45 38 L50 59 L32 47 L14 59 L19 38 L3 25 L24 24Z" fill="#ffe14d" stroke="#150a2b" stroke-width="4" stroke-linejoin="round"/>',
  blackout: '<path d="M38 4 L14 36 H30 L24 60 L50 26 H34Z" fill="#8a5cff" stroke="#150a2b" stroke-width="4" stroke-linejoin="round"/>'
};
const iconSVG = n => `<svg viewBox="0 0 64 64">${ICON[n]}</svg>`;
function setHtml(el, key, html) { if (hudC[key] !== html) { hudC[key] = html; el.innerHTML = html; } }
function setStyle(el, key, prop, val) { if (hudC[key] !== val) { hudC[key] = val; el.style[prop] = val; } }
function miniFor(tr) {
  if (tr.mini) return tr.mini;
  const cv = document.createElement('canvas'); cv.width = cv.height = 230; const x = cv.getContext('2d');
  tr.msc = Math.min(190 / (tr.maxx - tr.minx), 190 / (tr.maxz - tr.minz));
  x.lineJoin = 'round'; x.beginPath();
  for (let j = 0; j <= tr.N; j += 2) { const i = j % tr.N, u = 115 - (tr.px[i] - tr.cx) * tr.msc, v = 115 - (tr.pz[i] - tr.cz) * tr.msc; if (j) x.lineTo(u, v); else x.moveTo(u, v); }
  x.closePath(); x.strokeStyle = '#150a2b'; x.lineWidth = 16; x.stroke(); x.strokeStyle = 'rgba(255,255,255,.92)'; x.lineWidth = 8; x.stroke();
  return tr.mini = cv;
}
const mctx = E.hMap.getContext('2d');
function updateHUD(w) {
  const k = w.player, tr = w.tr;
  setHtml(E.hPos, 'pos', `<b>${k.rank}</b><i>${ordinal(k.rank)}</i><small>/6</small>`);
  setHtml(E.hLap, 'lap', `LAP ${clamp(k.lap + 1, 1, w.laps)}/${w.laps}`);
  setHtml(E.hTime, 'time', fmtTime(Math.max(0, w.raceT)));
  let ih = '', cls = '';
  if (k.rl > 0) { ih = iconSVG(ITEMS[((w.t * 14) | 0) % ITEMS.length]); cls = 'has'; }
  else if (k.item) { ih = iconSVG(k.item) + (k.cnt > 1 ? `<em>${k.cnt}</em>` : ''); cls = 'has'; }
  setHtml(E.hItem, 'item', ih); E.hItem.className = cls;
  const spd = Math.round(Math.hypot(k.vx, k.vz) * 3.4 * (SET.units ? 0.621 : 1));
  setHtml(E.hSpeed, 'spd', `<b>${spd}</b><small>${SET.units ? 'MPH' : 'KM/H'}</small>`);
  setStyle(E.hDrift, 'dr', 'opacity', k.drift ? '1' : '0');
  const pips = E.hDrift.children;
  for (let i = 0; i < 3; i++) { const c = k.drift && k.tier > i ? 'on' + i : ''; if (hudC['p' + i] !== c) { hudC['p' + i] = c; pips[i].className = c; } }
  const msg = w.msgT > 0 ? w.msg : '';
  if (hudC.msg !== msg) { hudC.msg = msg; E.hMsg.textContent = msg; E.hMsg.classList.toggle('show', !!msg); }
  let cnt = '';
  if (w.state === 'countdown') cnt = w.cdT > 2.4 ? '3' : w.cdT > 1.2 ? '2' : w.cdT > 0 ? '1' : '';
  else if (w.goT > 0 && w.raceT < 1.3) cnt = 'GO!';
  setHtml(E.hCount, 'cnt', cnt);
  E.hWrong.hidden = !(w.wrong > 1.2 && w.mode === 'race');
  setStyle(E.hLines, 'ln', 'opacity', (k.boostT > 0 || k.star > 0) ? '1' : '0');
  const g = glyphs();
  const hint = (w.mode === 'race' && w.state === 'countdown') ? (lastDev === 'pad'
    ? `<span class="key">R2</span> Go · <span class="key">L2</span> Brake · <span class="key">R1</span> Drift · <span class="key">○</span> Item · <span class="key">${g.pause}</span> Pause`
    : `<span class="key">W</span> Go · <span class="key">S</span> Brake · <span class="key">Space</span> Drift · <span class="key">E</span> Item · <span class="key">Esc</span> Pause`) : '';
  setHtml(E.hHint, 'hint', hint); E.hHint.hidden = !hint;
  // minimap
  const mini = miniFor(tr);
  mctx.clearRect(0, 0, 230, 230); mctx.drawImage(mini, 0, 0);
  for (const q of w.karts.slice().reverse()) {
    const u = 115 - (q.x - tr.cx) * tr.msc, v = 115 - (q.z - tr.cz) * tr.msc, me = q === w.player;
    mctx.beginPath(); mctx.arc(u, v, me ? 9 : 6, 0, TAU); mctx.fillStyle = '#' + q.ch.col.toString(16).padStart(6, '0'); mctx.fill();
    mctx.lineWidth = me ? 4 : 2.5; mctx.strokeStyle = me ? '#fff' : '#150a2b'; mctx.stroke();
  }
}

/* ---------------- main loop ---------------- */
let last = 0, titleStartT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
  pollInput(dt);
  if (userAct !== lastAct) { lastAct = userAct; idle = 0; }
  suppress = Math.max(0, suppress - dt);
  touchCheck();
  const wasRace = screen === 'race';
  document.body.classList.toggle('nocursor', screen === 'race' || screen === 'demo');
  if (screen === 'title') {
    titleStartT += dt;
    const txt = lastDev === 'pad' ? 'PRESS ✕ TO START' : 'PRESS ENTER TO START';
    if (E.start.textContent !== txt) E.start.textContent = txt;
    if (suppress <= 0 && (IN.ok || IN.pause)) { AU.sfx('ok'); showMain(); }
  } else if (menu && !touchMode) {
    menuNav();
    setPrompts(screen === 'pause' ? 'pause' : screen === 'results' ? 'results' : 'menu');
  } else if (screen === 'tset') menuNav();
  if (wasRace && IN.pause) pauseGame();
  else if (screen === 'pause' && IN.pause && menu && menu.onBack && suppress <= 0) menu.onBack();
  if (screen === 'demo' && userAct !== demoAct0 && W && W.t > 0.8) stopDemo();
  if (MENU_SCREENS.has(screen) && !touchMode && (!W || W.mode === 'bg')) { idle += dt; if (idle >= 10 && ready) { idle = 0; startDemo(); } }
  if (W && R.dev) {
    if (!W.paused) {
      let rem = dt;
      while (rem > 0) { const s = Math.min(rem, 1 / 60); stepWorld(W, s); rem -= s; }
      updateParticles(dt); updateCam(W, dt);
    }
    if (W.mode !== 'bg') updateHUD(W);
    if (screen === 'race' && !W.paused) { const k = W.player; AU.engine(clamp(Math.hypot(k.vx, k.vz) / k.top, 0, 1.5), W.state === 'racing', k.drift && Math.abs(k.speed) > 10, k.boostT > 0); }
    else AU.engine(0, false, false, false);
    resizeGPU();
    renderFrame(buildScene(W));
  }
}

/* ---------------- boot ---------------- */
async function boot() {
  touchCheck();
  requestAnimationFrame(frame);
  try {
    if (!touchMode) overlay('LOADING', 'Painting the town…');
    await initGPU();
    PM = buildProps(); IBM = buildItemBox(); WM = buildWheel(); KM = CH.map(buildKart);
    for (let i = 0; i < TRACKS.length; i++) { await sleep(30); TR.push(buildTrack(i)); }
    E.fatal.hidden = true; ready = true;
    if (!touchMode) showTitle(); else setBg(0, 0);
  } catch (e) {
    if (!touchMode) fatal('WebGPU required', (e && e.message) || 'WebGPU could not be initialised on this device.');
  }
}
boot();
</script>
