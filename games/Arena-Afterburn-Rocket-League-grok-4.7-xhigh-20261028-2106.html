function createSession(mode) {

  return { mode, cap: 4, peers: [] };
}
function addPeer(session, peer) {
  if (session.peers.length >= session.cap) {
    return { ok: false, reason: "full", session };
  }
  const next = {
    ...session,
    peers: [
      ...session.peers,
      {
        id: peer.id,
        name: peer.name ?? peer.id,
        kind: peer.kind ?? "human"
      }
    ]
  };
  return { ok: true, session: next };
}
function joinHuman(session, peer) {
  const humans = session.peers.filter((p) => p.kind !== "ai");
  if (humans.length >= session.cap) return { ok: false, reason: "full", session };
  const teamSize = session.mode === "2v2" ? 2 : 1;
  if (humans.length >= teamSize * 2) return { ok: false, reason: "roster-full", session };
  return addPeer(session, { ...peer, kind: "human" });
}
function assignTeams(session) {
  const teamSize = session.mode === "2v2" ? 2 : 1;
  const playing = session.peers.filter((p) => p.kind !== "ai").slice(0, teamSize * 2);
  if (session.mode === "1v1") {
    return playing.slice(0, 2).map((peer, i) => ({
      ...peer,
      team: i === 0 ? "blue" : "orange"
    }));
  }
  return playing.slice(0, 4).map((peer, i) => ({
    ...peer,
    team: i < 2 ? "blue" : "orange"
  }));
}

  const assigned = assignTeams(session);
  const teamSize = session.mode === "2v2" ? 2 : 1;
  const counts = { blue: 0, orange: 0 };
  const roster = assigned.map((peer) => {
    counts[peer.team] += 1;
    return { ...peer, human: true, kind: "human" };
  });
  const aiNames = ["VOLT", "RIVET", "NASH", "PIP"];
  let n = 0;
  for (const team of ["blue", "orange"]) {
    while (counts[team] < teamSize) {
      roster.push({
        id: `ai-${team}-${counts[team]}`,
        name: aiNames[n] ?? `AI ${n + 1}`,
        team,
        kind: "ai",
        human: false
      });
      counts[team] += 1;
      n += 1;
    }

  roster.sort((a, b) => order[a.team] - order[b.team] || a.id.localeCompare(b.id));

}

function aiActions(car, world, cheat) {

  const weAreGoalSide = Math.abs(car.pos.z - goalZ) < Math.abs(ball.z - goalZ);
  if (ballOnOurHalf && !weAreGoalSide) {
    tx = ball.x * 0.45;
    tz = (ball.z + goalZ) * 0.5;
  } else if (Math.abs(ball.z) < 8) {
    tx = ball.x + (ball.x - car.pos.x) * 0.05;
    tz = ball.z;
  } else {
    const ahead = car.team === "blue" ? 1.6 : -1.6;
    tx = ball.x;
    tz = ball.z - ahead;
  }
  const toX = tx - car.pos.x;
  const toZ = tz - car.pos.z;

  const pulse = Math.sin(world.time * 7) > 0.35;

function applyMenu(intent) {

  }
  if (intent.y && !edges.y) {
    state.index = (state.index + (intent.y > 0 ? 1 : items.length - 1)) % items.length;

    renderMenu();

  edges.confirm = intent.confirm;

function updateHud() {

  document.getElementById("score-orange").textContent = String(world.match.score.orange);
  const clock = document.getElementById("clock");
  if (world.match.overtime) clock.textContent = "OT";
  else {
    const total = Math.max(0, Math.ceil(world.match.clock - 1e-6));
    const m = Math.floor(total / 60);
    const s = total % 60;
    clock.textContent = `${m}:${String(s).padStart(2, "0")}`;
  }

  const banner = world.match.banner;
  call.textContent = banner || "";
  call.style.color = banner === "GOAL" ? world.match.lastScorer === "blue" ? "#3d7cff" : "#ff7424" : "#f6f1e6";
  const boosts = document.getElementById("boosts");
  boosts.replaceChildren();
  const humans = state.kind === "attract" ? [] : localCars();
  const shown = humans.length ? humans : [];
  if (!shown.length) return;
  const rects = layoutOf(shown.length);
  shown.forEach((car, i) => {
    const rect = rects[i];
    const meter = el("div", "meter");
    const fill = el("span");
    fill.style.width = `${Math.round(car.boost)}%`;
    const name = el("b", "", `${car.name}  ${Math.round(car.boost)}`);
    meter.append(name, fill);

function layoutOf(count) {

}

    state.world.match.banner = "";

        actions: {
