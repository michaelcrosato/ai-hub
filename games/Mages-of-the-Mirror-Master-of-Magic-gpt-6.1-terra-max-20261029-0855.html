function claimAt(a){const f=featureAt(a.plane,a.x,a.y),id=`${a.plane}:${key(a.x,a.y)}`;if(f==='node'&&!state.nodes[id]){state.nodes[id]=true;state.score+=60;sfx('magic');say('A mirror node bends to your will. +4 mana each turn.');}if(f==='ruin'&&!state.cleared[id]){state.cleared[id]=true;state.gold+=35;state.mana+=15;state.score+=45;sfx('magic');say('The ancient vault yields 35 gold and 15 mana.');}const c=cityAt(a.plane,a.x,a.y);if(c&&c.owner==='rival'){c.owner='player';state.score+=150;endGame(true,'Nightglass has fallen. The rival mage bows before your dominion.');}}
function moveArmyTo(x,y){const a=playerArmy();if(!a||a.plane!==state.plane){say('Select an army in this realm first.');return;}if(!inBounds(x,y)||isWater(x,y)){say('The deep waters bar your march.');return;}if(dist(a,{x,y})!==1){say('Move to a neighbouring tile.');return;}if(a.moves<=0){say('This army has marched enough. End the turn to refresh.');return;}const other=armyAt(a.plane,x,y);if(other&&other.owner==='player'){say('Another friendly army holds that tile.');return;}if(other&&other.owner==='rival'&&state.truce>0){say('Your truce still holds. Declare war in Diplomacy first.');return;}a.moves--;if(other){startBattle(a,other,{x,y,plane:a.plane},true);return;}a.x=x;a.y=y;reveal(a.plane,x,y,2);sfx('move');claimAt(a);rebuild();renderUI();save();report();}

function travelGate(){const a=playerArmy();if(!a||a.plane!==state.plane){say('Select an army in this realm.');return;}if(featureAt(a.plane,a.x,a.y)!=='gate'){say('Your selected army must stand on a Mirror Gate.');return;}if(a.moves<1){say('The army needs one movement point to cross.');return;}const target=a.plane==='lumen'?'umbra':'lumen';if(armyAt(target,a.x,a.y)){say('The far side of the gate is occupied.');return;}a.plane=target;a.moves--;state.plane=target;cursor={x:a.x,y:a.y};reveal(target,a.x,a.y,2);state.score+=20;sfx('magic');say('The mirror opens. A second world awaits.');modal=null;rebuild();renderUI();save();report();}
function foundCity(){const a=playerArmy();if(!a||a.plane!==state.plane){say('Select an army containing Settlers.');return;}const index=a.units.findIndex(u=>u.type==='settlers');if(index<0){say('Train Settlers in a city first.');return;}if(featureAt(a.plane,a.x,a.y)||cityAt(a.plane,a.x,a.y)||isWater(a.x,a.y)){say('Found a city on an empty land tile.');return;}a.units.splice(index,1);const name=['Thistledown','Starhaven','Goldmere'][state.cities.filter(c=>c.owner==='player').length-1]||'New Haven';state.cities.push({name,owner:'player',plane:a.plane,x:a.x,y:a.y,pop:2,buildings:[],project:null,progress:0,blessed:false});if(!a.units.length){state.armies=state.armies.filter(o=>o!==a);selected=0;}state.score+=80;reveal(a.plane,a.x,a.y,2);modal=null;rebuild();renderUI();save();report();say(`${name} rises beneath your banner.`);}
function income(){let gold=0,mana=3,science=3;for(const c of state.cities.filter(c=>c.owner==='player')){gold+=10+c.pop*2+(c.buildings.includes('market')?6:0)+(c.blessed?5:0);mana+=c.buildings.includes('shrine')?4:0;science+=c.buildings.includes('library')?4:0;}mana+=Object.keys(state.nodes).length*4;return{gold,mana,science};}
function completeProject(c){const k=c.project,p=PROJ[k];if(!p)return;if(['blade','bow','settlers'].includes(k)){let a=armyAt(c.plane,c.x,c.y);if(a?.owner==='player'&&a.units.length<6)a.units.push(unit(k));else if(!a){state.armies.push({id:Math.max(...state.armies.map(i=>i.id),0)+1,owner:'player',plane:c.plane,x:c.x,y:c.y,moves:0,units:[unit(k)]});}else{const spot=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:c.x+dx,y:c.y+dy})).find(o=>inBounds(o.x,o.y)&&!isWater(o.x,o.y)&&!armyAt(c.plane,o.x,o.y));if(!spot){c.progress=p.turns-1;say(`${c.name} needs room for its new unit.`);return;}state.armies.push({id:Math.max(...state.armies.map(i=>i.id),0)+1,owner:'player',plane:c.plane,...spot,moves:0,units:[unit(k)]});}}else c.buildings.push(k);c.project=null;c.progress=0;state.score+=25;say(`${c.name} has completed ${p.name}.`);}

 sfx('voice');rebuild();renderUI();save();report();if(!toastText||performance.now()>toastUntil)say(`Turn ${state.turn}: your realm gathers ${inc.gold} gold, ${inc.mana} mana, and ${inc.science} lore.`);}
function projectMenu(c){const items=Object.entries(PROJ).map(([id,p])=>({label:`${p.name}  ·  ${p.cost} gold`,desc:`${p.turns} turns • ${p.desc}`,disabled:(!['blade','bow','settlers'].includes(id)&&c.buildings.includes(id)),fn:()=>{if(!['blade','bow','settlers'].includes(id)&&c.buildings.includes(id)){say('That building already stands.');return;}if(state.gold<p.cost){say('Not enough gold.');return;}state.gold-=p.cost;c.project=id;c.progress=0;modal=null;save();renderUI();report();say(`${c.name} begins ${p.name}.`);}}));openModal('Choose production','CITY OF '+c.name.toUpperCase(),'The cost is paid now. Choosing a new project replaces the current one.',items,()=>openCity(c));}

function castGlobal(id){const sp=SPELLS[id],a=playerArmy();if(state.mana<sp.mana){say('Not enough mana.');return;}if(id==='sprites'){if(!a||a.plane!==state.plane){say('Select an army in this realm.');return;}if(a.units.length>=6){say('An army can hold at most six units.');return;}a.units.push(unit('sprite'));}
 if(id==='harvest'){const c=cityAt(state.plane,cursor.x,cursor.y);if(!c||c.owner!=='player'){say('Place the cursor on one of your cities first.');return;}if(c.blessed){say('That city is already blessed.');return;}c.blessed=true;}
 if(id==='gatewalk'){if(!a||a.plane!==state.plane){say('Select an army in this realm.');return;}const other=a.plane==='lumen'?'umbra':'lumen';if(armyAt(other,a.x,a.y)||isWater(a.x,a.y)){say('The other side is occupied.');return;}a.plane=other;state.plane=other;cursor={x:a.x,y:a.y};reveal(other,a.x,a.y,2);}

 state.mana-=sp.mana;state.score+=20;modal=null;sfx('magic');rebuild();renderUI();save();report();say(id==='crown'?'The Crown ritual begins. Hold your realm for three turns.':`${sp.name} answers your call.`);}

function startBattle(player,foe,dest,attacking){battle={playerId:player.id,foeId:foe.id,dest,attacking,round:1,spellUsed:false,busy:false,units:[]};player.units.forEach((u,i)=>battle.units.push({side:'player',type:u.type,hp:u.hp,index:i,x:i<5?0:1,y:i%5,used:false}));foe.units.forEach((u,i)=>battle.units.push({side:'enemy',type:u.type,hp:u.hp,index:i,x:i<5?5:4,y:i%5,used:false}));screen='battle';modal=null;battleSelected=0;spellTarget=null;combatCursor={x:0,y:0};sfx('voice');rebuild();renderUI();say(attacking?'Your army engages the enemy!':'Your army is under attack!');}
function bUnitAt(x,y){return battle.units.find(u=>u.hp>0&&u.x===x&&u.y===y);}
function impact(x,y,color){if(!physics)return;const bx=(x-2.5)*1.65,bz=(y-2)*1.65;for(let i=0;i<6;i++){const body=physics.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(bx,.9,bz).setLinvel((Math.random()-.5)*2,1+Math.random()*2,(Math.random()-.5)*2));physics.createCollider(RAPIER.ColliderDesc.ball(.08).setRestitution(.5),body);const m=mesh(scene,'box',color,bx,.9,bz,.11,.11,.11,color);particles.push({body,mesh:m,life:1.3});}}
function strike(attacker,target){const damage=Math.max(2,UNIT[attacker.type].atk-UNIT[target.type].def+(Math.random()<.35?1:0));target.hp=Math.max(0,target.hp-damage);impact(target.x,target.y,attacker.side==='player'?0xb4f2d8:0xf3a48f);sfx('hit');say(`${UNIT[attacker.type].name} strike for ${damage}.`,1.6);}
function finishBattle(won,retreated=false){const p=state.armies.find(a=>a.id===battle.playerId),e=state.armies.find(a=>a.id===battle.foeId),dest=battle.dest,attacking=battle.attacking;const players=battle.units.filter(u=>u.side==='player'&&u.hp>0).map(u=>({type:u.type,hp:u.hp})),enemies=battle.units.filter(u=>u.side==='enemy'&&u.hp>0).map(u=>({type:u.type,hp:u.hp}));if(p)p.units=players;if(e)e.units=enemies;if(p&&!players.length)state.armies=state.armies.filter(a=>a!==p);if(e&&!enemies.length)state.armies=state.armies.filter(a=>a!==e);if(won&&!retreated&&p){if(attacking){p.x=dest.x;p.y=dest.y;state.plane=p.plane;cursor={x:p.x,y:p.y};reveal(p.plane,p.x,p.y,2);claimAt(p);}state.score+=60;state.gold+=20;}
 if((!won||retreated)&&!attacking&&e){const city=cityAt(dest.plane,dest.x,dest.y);if(city?.owner==='player'){battle=null;endGame(false,`${city.name} has fallen to the rival mage.`);return;}}
 if(retreated&&p&&!attacking){const to=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:p.x+dx,y:p.y+dy})).find(o=>inBounds(o.x,o.y)&&!isWater(o.x,o.y)&&!armyAt(p.plane,o.x,o.y));if(to){p.x=to.x;p.y=to.y;}else{state.armies=state.armies.filter(a=>a!==p);}if(e){e.x=dest.x;e.y=dest.y;}}
 battle=null;spellTarget=null;if(state.over)return;screen='map';if(p&&state.armies.includes(p)){selected=p.id;state.plane=p.plane;cursor={x:p.x,y:p.y};}else selected=state.armies.find(a=>a.owner==='player')?.id||0;rebuild();renderUI();save();report();if(!state.armies.some(a=>a.owner==='player')&&!state.cities.some(c=>c.owner==='player'))endGame(false,'Your last banner has fallen.');else say(retreated?'Your soldiers withdraw from the field.':won?'Victory! Your army returns with 20 gold.':'Your army has fallen. Your cities can raise a new host.');}
function checkBattle(){if(!battle)return true;if(!battle.units.some(u=>u.side==='enemy'&&u.hp>0)){finishBattle(true);return true;}if(!battle.units.some(u=>u.side==='player'&&u.hp>0)){finishBattle(false);return true;}return false;}
function afterAction(){if(checkBattle())return;rebuild();renderUI();if(battle.units.filter(u=>u.side==='player'&&u.hp>0).every(u=>u.used))setTimeout(enemyTurn,450);}
function battleActivate(){if(!battle||battle.busy)return;const target=bUnitAt(combatCursor.x,combatCursor.y);if(spellTarget){if(battle.spellUsed){say('You have already cast a spell this round.');return;}if(!target||((spellTarget==='bolt')!==(target.side==='enemy'))){say(spellTarget==='bolt'?'Choose an enemy target.':'Choose one of your units.');return;}if(spellTarget==='bolt'){if(state.mana<10){say('Not enough mana.');return;}state.mana-=10;target.hp=Math.max(0,target.hp-7);impact(target.x,target.y,0x88e5ff);say('Starfire deals 7 damage!');}else{if(state.mana<8){say('Not enough mana.');return;}state.mana-=8;target.hp=Math.min(UNIT[target.type].hp,target.hp+6);say('Mending restores 6 health.');}battle.spellUsed=true;spellTarget=null;sfx('magic');afterAction();return;}
 if(target?.side==='player'){battleSelected=battle.units.indexOf(target);say(`${UNIT[target.type].name}: ${target.used?'already acted':`move ${UNIT[target.type].move} or strike at range ${UNIT[target.type].range}`}.`,2);renderUI();return;}
 const actor=battle.units[battleSelected];if(!actor||actor.side!=='player'||actor.hp<=0){say('Select a friendly unit first.');return;}if(actor.used){say('This unit has already acted this round.');return;}const distance=dist(actor,combatCursor);if(target?.side==='enemy'){if(distance>UNIT[actor.type].range){say(`Target is out of range (${UNIT[actor.type].range}).`);return;}actor.used=true;strike(actor,target);afterAction();return;}
 if(!target&&distance>0&&distance<=UNIT[actor.type].move){actor.x=combatCursor.x;actor.y=combatCursor.y;actor.used=true;sfx('move');afterAction();return;}say(`Choose an empty tile within ${UNIT[actor.type].move} or an enemy within range ${UNIT[actor.type].range}.`);}
function enemyTurn(){if(screen!=='battle'||!battle||battle.busy)return;battle.busy=true;const enemies=battle.units.filter(u=>u.side==='enemy'&&u.hp>0);let i=0;const next=()=>{if(screen!=='battle'||!battle)return;if(i>=enemies.length){battle.round++;battle.spellUsed=false;battle.busy=false;battle.units.forEach(u=>u.used=false);battleSelected=battle.units.findIndex(u=>u.side==='player'&&u.hp>0);rebuild();renderUI();say(`Round ${battle.round}. Your move.`,1.8);return;}const enemy=enemies[i++],targets=battle.units.filter(u=>u.side==='player'&&u.hp>0).sort((a,b)=>dist(enemy,a)-dist(enemy,b));const target=targets[0];if(!target){checkBattle();return;}if(dist(enemy,target)<=UNIT[enemy.type].range)strike(enemy,target);else{for(let step=0;step<UNIT[enemy.type].move;step++){const choices=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:enemy.x+dx,y:enemy.y+dy})).filter(p=>p.x>=0&&p.x<6&&p.y>=0&&p.y<5&&!bUnitAt(p.x,p.y)).sort((a,b)=>dist(a,target)-dist(b,target));if(!choices.length||dist(choices[0],target)>=dist(enemy,target))break;enemy.x=choices[0].x;enemy.y=choices[0].y;}}
 if(checkBattle())return;rebuild();renderUI();setTimeout(next,240);};say('The enemy takes its turn.',1.4);next();}
function combatSpells(){if(battle.spellUsed){say('Only one spell may be cast each round.');return;}openModal('Battle magic','YOUR TURN','Choose a spell, then place the cursor on its target.',[{label:'Starfire · 10 mana',desc:'Deal 7 damage to an enemy anywhere on the field.',fn:()=>{spellTarget='bolt';modal=null;renderUI();say('Choose an enemy for Starfire.');}},{label:'Mending · 8 mana',desc:'Restore 6 health to a friendly unit.',fn:()=>{spellTarget='heal';modal=null;renderUI();say('Choose a friendly unit for Mending.');}}],closeModal);}
function battleOrders(){if(battle.busy)return;openModal('Battle orders',`ROUND ${battle.round}`,'Each unit may move or attack once per round.',[{label:'Cast battle magic',desc:'One spell per round, in addition to unit actions.',fn:combatSpells},{label:'End round',desc:'Pass remaining actions to the enemy.',fn:()=>{modal=null;enemyTurn();}},{label:'Retreat',desc:'Withdraw surviving units. A defending city will fall.',fn:()=>{modal=null;finishBattle(false,true);}},{label:'Battle guide',desc:'Learn movement, range and casting.',fn:()=>helpMenu(battleOrders)}],closeModal);}

function openAbout(page=0,back=closeModal){const [title,copy]=ABOUT[page];const items=ABOUT.map(([name],i)=>({label:name,desc:i===page?'Currently reading':'Read this page',fn:()=>openAbout(i,back)}));items.push({label:'Return',desc:'Close credits.',fn:back});openModal(title,'ABOUT & CREDITS','Mages of the Mirror · an original game inspired by Master of Magic',items,back,copy,true);}
function titleAction(a){switch(a){case'new':newGame();audioStart();sfx('voice');say('Select your army, then march to a neighbouring tile.');break;case'continue':loadGame();audioStart();break;case'multi':multiplayerMenu();break;case'help':helpMenu();break;case'settings':openSettings();break;case'about':openAbout();break;}}
function multiplayerMenu(){if(AIHub.active)return;openModal('Peer challenge','STANDALONE MULTIPLAYER','Two players race in separate copies of the same realm. The highest score after eight minutes wins. A public PeerJS signalling service connects the browsers.',[{label:'Host a challenge',desc:'Create a six-digit room code for a friend.',fn:hostPeer},{label:'Join a challenge',desc:'Enter the host’s six-digit room code.',fn:()=>{peerDigits=[0,0,0,0,0,0];peerDigit=0;joinMenu();}},{label:'Return',desc:'Back to the title.',fn:closeModal}],closeModal);}
function loadPeer(){return new Promise((resolve,reject)=>{if(window.Peer){resolve();return;}const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';s.onload=resolve;s.onerror=()=>reject(Error('PeerJS could not load'));document.head.appendChild(s);});}
function cancelPeer(){try{peerConn?.close();peer?.destroy();}catch(e){}peer=null;peerConn=null;challengeEnd=0;networkStatus='';}
function peerFailure(err){networkStatus='Connection failed: '+(err?.message||'unknown error');if(screen==='title'){openModal('Connection unavailable','PEER CHALLENGE',networkStatus,[{label:'Return to peer challenge',desc:'Try hosting or joining again.',fn:()=>{cancelPeer();multiplayerMenu();}},{label:'Return to title',desc:'Play a local chronicle instead.',fn:()=>{cancelPeer();closeModal();}}],()=>{cancelPeer();multiplayerMenu();});}else say(networkStatus,5);}
function bindConnection(conn,isHost){peerConn=conn;conn.on('open',()=>{networkStatus='Connected';if(isHost){conn.send({t:'start'});challengeEnd=Date.now()+8*60*1000;newGame();say('Your friend has joined. The eight-minute challenge begins.');}});conn.on('data',msg=>{if(!msg||typeof msg!=='object')return;if(msg.t==='start'&&!isHost){challengeEnd=Date.now()+8*60*1000;newGame();say('The eight-minute challenge begins.');}if(msg.t==='score'){peerScore=Number.isFinite(msg.score)?msg.score:0;renderUI();}});conn.on('close',()=>{if(peerConn!==conn)return;networkStatus='Opponent disconnected';say('Your opponent disconnected. Your campaign continues.');challengeEnd=0;renderUI();});conn.on('error',peerFailure);}
async function hostPeer(){cancelPeer();openModal('Opening the mirror','PEER CHALLENGE','Contacting the public signalling service…',[{label:'Cancel',fn:()=>{cancelPeer();multiplayerMenu();}}],()=>{cancelPeer();multiplayerMenu();});try{await loadPeer();const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);peerCode=String(bytes[0]%1000000).padStart(6,'0');peer=new Peer('mages-mirror-'+peerCode);peer.on('open',()=>openModal('Share this code','WAITING FOR A FRIEND',`${peerCode.split('').join('  ')}  ·  The challenge begins when your friend joins.`,[{label:'Cancel',desc:'Close this room.',fn:()=>{cancelPeer();multiplayerMenu();}}],()=>{cancelPeer();multiplayerMenu();}));peer.on('connection',c=>bindConnection(c,true));peer.on('error',peerFailure);}catch(e){peerFailure(e);multiplayerMenu();}}
function joinMenu(){const items=peerDigits.map((n,i)=>({label:`Digit ${i+1}:  ${n}`,desc:'Confirm to increase this digit; number keys work too.',fn:()=>{peerDigit=i;peerDigits[i]=(peerDigits[i]+1)%10;joinMenu();modal.index=i;renderUI();}}));items.push({label:'Connect',desc:`Join room ${peerDigits.join('')}`,fn:connectPeer},{label:'Return',fn:multiplayerMenu});openModal('Enter the room code','JOIN A CHALLENGE','Choose each digit and press Cross to change it, then Connect.',items,multiplayerMenu,'',true);modal.isJoin=true;}
async function connectPeer(){const code=peerDigits.join('');cancelPeer();openModal('Opening the mirror','JOINING '+code,'Connecting to the host…',[{label:'Cancel',fn:()=>{cancelPeer();multiplayerMenu();}}],()=>{cancelPeer();multiplayerMenu();});try{await loadPeer();peer=new Peer();peer.on('open',()=>bindConnection(peer.connect('mages-mirror-'+code,{reliable:true}),false));peer.on('error',peerFailure);}catch(e){peerFailure(e);multiplayerMenu();}}

function overMarkup(){const r=state.result;return `<div class="over"><div class="over-inner"><div class="eyebrow">THE CHRONICLE IS COMPLETE</div><h2>${r.title||(r.victory?'A WIZARD TRIUMPHANT':'THE MIRROR DARKENS')}</h2><p>${r.reason}</p><p>Turn ${state.turn} · ${score()} renown</p>${!AIHub.active&&!challengeEnd?'<button class="option selected" data-action="title"><b>Return to title</b><small>Begin another chronicle</small></button>':challengeEnd?'<p>Awaiting the end of the challenge…</p>':''}</div></div>`;}
function renderUI(){if(screen==='loading')return;let html='';if(touchOnly&&!modal){html='<div class="error"><div><h2>Controller or keyboard required</h2><p>This game is designed for a controller or keyboard.</p><button class="option selected" data-action="settings"><b>Settings</b></button></div></div>';}
 else if(screen==='title')html=titleMarkup();else if(screen==='map')html=mapMarkup();else if(screen==='battle'&&battle)html=battleMarkup();else if(screen==='over')html=overMarkup();else if(screen==='error')html='<div class="error"><div><h2>WebGPU required</h2><p>This game requires a browser and graphics adapter with WebGPU enabled. No WebGL fallback is used.</p><button class="option selected" data-action="settings"><b>Settings</b></button></div></div>';
 if(attract)html+='<div class="ribbon">THE ARCHMAGE DREAMS &nbsp; · &nbsp; ANY INPUT TO RETURN</div>';if(AIHub.active&&!sessionStopped&&state&&AIHub.time()<0)html+='<div class="ribbon">THE REALM AWAKENS WHEN THE HUB COUNTDOWN ENDS</div>';if(toastText&&performance.now()<toastUntil&&!modal&&!touchOnly)html+=`<div class="toast">${toastText}</div>`;html+=modalMarkup();app.innerHTML=html;const chosen=app.querySelector('.modal .option.selected');if(chosen)chosen.scrollIntoView({block:'nearest'});}
function wake(){idle=performance.now();if(attract){attract=false;state=makeState();selected=1;cursor={x:2,y:4};screen='title';battle=null;modal=null;menuIndex=0;rebuild();renderUI();return true;}return false;}
function doDirection(dx,dy,pad=false){if(wake())return;if(sessionStopped)return;if(pad){if(settings.invertX)dx=-dx;if(settings.invertY)dy=-dy;}if(modal){const delta=dy||dx;if(delta){modal.index=(modal.index+delta+modal.items.length)%modal.items.length;sfx('move');renderUI();}return;}if(screen==='title'){menuIndex=(menuIndex+(dy||dx)+6)%6;sfx('move');renderUI();return;}if(AIHub.active&&AIHub.time()<0)return;if(screen==='map'){cursor.x=clamp(cursor.x+dx,0,WIDTH-1);cursor.y=clamp(cursor.y+dy,0,HEIGHT-1);rebuild();renderUI();sfx('move');}else if(screen==='battle'&&battle&&!battle.busy){combatCursor.x=clamp(combatCursor.x+dx,0,5);combatCursor.y=clamp(combatCursor.y+dy,0,4);rebuild();renderUI();sfx('move');}}
function confirmAction(){if(wake()||sessionStopped)return;audioStart();sfx('select');if(modal){const item=modal.items[modal.index];item?.fn?.();return;}if(screen==='title'){titleAction(['new','continue','multi','help','settings','about'][menuIndex]);return;}if(screen==='over'){if(!AIHub.active&&!challengeEnd){screen='title';state=makeState();rebuild();renderUI();}return;}if(AIHub.active&&AIHub.time()<0)return;if(screen==='map'||screen==='battle')activateTile();}
function backAction(){if(wake()||sessionStopped)return;sfx('back');if(modal){modal.back?.();return;}if(screen==='battle'&&spellTarget){spellTarget=null;renderUI();return;}if(screen==='map'){selected=0;renderUI();}}
function handleAction(action){if(wake()||sessionStopped)return;audioStart();if(action==='settings'){toggleSettings();return;}if(modal)return;if(AIHub.active&&AIHub.time()<0)return;if(action==='court'){if(screen==='battle')battleOrders();else openCourt();}else if(action==='cities'&&screen==='map')citiesMenu();else if(action==='research'&&screen==='map')researchMenu();else if(action==='spells'&&screen==='map')castMenu();else if(action==='plane'&&screen==='map')viewPlane();else if(action==='end'&&screen==='map')endTurn();else if(action==='next'&&screen==='map')cycleArmy();else if(action==='battleorders'&&screen==='battle')battleOrders();else if(action==='battlemagic'&&screen==='battle')combatSpells();else if(action==='endround'&&screen==='battle')enemyTurn();else if(action==='title'&&!AIHub.active){cancelPeer();state=makeState();screen='title';modal=null;menuIndex=0;rebuild();renderUI();}}
app.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(wake())return;audioStart();if(btn.dataset.opt!==undefined&&modal){modal.index=Number(btn.dataset.opt);confirmAction();}else if(btn.dataset.title)titleAction(btn.dataset.title);else if(btn.dataset.action)handleAction(btn.dataset.action);});
canvas.addEventListener('pointerdown',e=>{if(wake())return;if(modal||touchOnly||sessionStopped)return;if(AIHub.active&&AIHub.time()<0)return;audioStart();const rect=canvas.getBoundingClientRect(),v=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1),ray=new THREE.Raycaster();ray.setFromCamera(v,camera);const hit=ray.intersectObject(root,true).find(h=>h.object.userData.tile);if(hit){if(screen==='map'){cursor={x:hit.object.userData.x,y:hit.object.userData.y};rebuild();activateTile();}else if(screen==='battle'){combatCursor={x:hit.object.userData.x,y:hit.object.userData.y};rebuild();battleActivate();}}});
let lastPointer={x:-1,y:-1};window.addEventListener('pointermove',e=>{if(e.clientX===lastPointer.x&&e.clientY===lastPointer.y)return;lastPointer={x:e.clientX,y:e.clientY};if(attract)wake();else if(screen==='title')idle=performance.now();});
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Tab','Backspace','Escape'].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());if(touchOnly){touchOnly=false;renderUI();}if(e.repeat)return;if(attract){wake();return;}idle=performance.now();audioStart();if(modal?.isJoin&&/^[0-9]$/.test(e.key)){peerDigits[peerDigit]=Number(e.key);peerDigit=(peerDigit+1)%6;joinMenu();modal.index=peerDigit;renderUI();return;}const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')doDirection(0,-1);else if(k==='arrowdown'||k==='s')doDirection(0,1);else if(k==='arrowleft'||k==='a')doDirection(-1,0);else if(k==='arrowright'||k==='d')doDirection(1,0);else if(k==='enter'||k===' ')confirmAction();else if(k==='escape')toggleSettings();else if(k==='backspace')backAction();else if(k==='e')handleAction('court');else if(k==='q')handleAction('plane');else if(k==='r')handleAction(screen==='battle'?'endround':'end');else if(k==='tab')handleAction('next');});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>keys.clear());
function padTick(now){const pads=navigator.getGamepads?.()||[],pad=Array.from(pads).find(Boolean);let px=0,py=0,fire=false;if(pad){if(touchOnly){touchOnly=false;renderUI();}const b=pad.buttons.map(x=>!!x.pressed),ax=pad.axes[0]||0,ay=pad.axes[1]||0;px=(b[15]?1:0)-(b[14]?1:0)+(Math.abs(ax)>.55?Math.sign(ax):0);py=(b[13]?1:0)-(b[12]?1:0)+(Math.abs(ay)>.55?Math.sign(ay):0);px=Math.sign(px);py=Math.sign(py);fire=!!b[0];const d=px?`${px},0`:py?`0,${py}`:'';if(d&&(d!==axisDir||now>axisHold)){if(attract)wake();else doDirection(px?px:0,px?0:py,true);axisDir=d;axisHold=now+(d!==axisDir?290:170);}if(!d)axisDir='';const down=i=>b[i]&&!prevButtons[i];if(down(0))confirmAction();if(down(1))backAction();if(down(2))handleAction('next');if(down(3))handleAction('court');if(down(4)||down(5))handleAction('plane');if(down(7))handleAction(screen==='battle'?'endround':'end');if(down(9)&&!b[8])handleAction('settings');prevButtons=b;}else prevButtons=[];
 const kx=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0),ky=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('w')?1:0);currentInput={x:kx||px,y:ky||py,fire:fire||keys.has('enter')||keys.has(' ')};}
function attractTick(now){if(!attract)return;const t=(now-attractAt)/1000;let step=t<3?0:t<6?1:t<9?2:t<12?3:t<15?4:t<18?5:t<21?6:t<24?7:t<27?8:9;if(step===attractStep)return;attractStep=step;
 if(step===1){cursor={x:2,y:3};moveArmyTo(2,3);}else if(step===2){cursor={x:3,y:3};moveArmyTo(3,3);}else if(step===3&&battle){combatCursor={x:5,y:0};battleSelected=1;spellTarget='bolt';renderUI();say('Starfire gathers over the field.');}else if(step===4&&battle){for(const u of battle.units.filter(u=>u.side==='enemy')){u.hp=0;impact(u.x,u.y,0x8ce4d8);}finishBattle(true);}else if(step===5)researchMenu();else if(step===6){modal=null;state.research='sprites';endTurn();}else if(step===7){const c=state.cities[0];openCity(c);}else if(step===8){modal=null;viewPlane();say('Beyond the gate lies a second world.');}else if(step===9){attractAt=now;attractStep=0;newGame(true);}}
function startAttract(now){attract=true;attractAt=now;attractStep=0;newGame(true);}
function resize(){if(!renderer||!camera)return;const w=innerWidth,h=innerHeight,frustum=13;camera.left=-frustum*w/h/2;camera.right=frustum*w/h/2;camera.top=frustum/2;camera.bottom=-frustum/2;camera.updateProjectionMatrix();renderer.setSize(w,h);}
function animate(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!sessionStopped){padTick(now);if((!AIHub.active||AIHub.time()>=0)&&!modal)clock+=dt;if(physics){physics.timestep=dt||1/60;physics.step();for(let i=particles.length-1;i>=0;i--){const p=particles[i],v=p.body.translation();p.mesh.position.set(v.x,v.y,v.z);const q=p.body.rotation();p.mesh.quaternion.set(q.x,q.y,q.z,q.w);p.life-=dt;if(p.life<=0){physics.removeRigidBody(p.body);scene.remove(p.mesh);particles.splice(i,1);}}}musicTick();if(screen==='title'&&!modal&&!AIHub.active&&!touchOnly&&now-idle>10000)startAttract(now);attractTick(now);if(challengeEnd&&Date.now()>=challengeEnd&&state){const yours=score();challengeEnd=0;state.over=true;state.result={victory:yours>=peerScore,title:yours===peerScore?'A WORTHY DRAW':yours>peerScore?'A WIZARD TRIUMPHANT':'THE RIVAL PREVAILS',reason:`The challenge ends: ${yours} renown to your opponent’s ${peerScore}.`};screen='over';modal=null;musicStop();renderUI();}if(toastText&&now>toastUntil){toastText='';renderUI();}if(root)root.position.y=Math.sin(now/1600)*.035;}renderer?.render(scene,camera);}
AIHub.probe(()=>({scene:screen==='title'?'title':screen==='over'?'over':screen==='loading'?'ready':'play',menu:!!modal?.isSettings,world:clock,input:currentInput}));
function sessionFinal(){if(!state)return;if(!sessionEnded){AIHub.result({score:score()});sessionEnded=true;}if(!state.over){state.over=true;state.result={victory:false,title:'THE CHRONICLE ENDS',reason:`The hub’s clock has run out. Your realm earned ${score()} renown.`};screen='over';modal=null;musicStop();renderUI();}}
AIHub.on('time-up',sessionFinal);
AIHub.on('end',()=>{sessionStopped=true;musicStop();if(audio)audio.suspend();if(state&&screen!=='over'){state.over=true;state.result={victory:false,title:'THE CHRONICLE ENDS',reason:`Your realm earned ${score()} renown.`};screen='over';modal=null;renderUI();}});
async function init(){try{if(!navigator.gpu)throw Error('WebGPU is unavailable');const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('No WebGPU adapter');renderer=new THREE.WebGPURenderer({canvas,antialias:true});renderer._getFallback=null;await renderer.init();if(!renderer.backend.isWebGPUBackend)throw Error('WebGPU backend unavailable');renderer.backend.device.lost.then(info=>{console.error('WebGPU device lost:',info.message);renderer.setAnimationLoop(null);screen='error';AIHub.fail('WebGPU device lost');renderUI();});await RAPIER.init();physics=new RAPIER.World({x:0,y:-9.81,z:0});physics.createCollider(RAPIER.ColliderDesc.cuboid(50,.1,50).setTranslation(0,-.2,0));scene=new THREE.Scene();scene.background=new THREE.Color(0x172b35);camera=new THREE.OrthographicCamera(-10,10,7,-7,.1,100);camera.position.set(12,15,19);camera.lookAt(0,0,0);scene.add(new THREE.HemisphereLight(0xe6f4d7,0x334752,2.15));const sun=new THREE.DirectionalLight(0xffe5b8,3.0);sun.position.set(-4,13,8);scene.add(sun);root=new THREE.Group();scene.add(root);const base=mesh(scene,'cyl',0x263f42,0,-.72,0,7.8,.9,6.5);base.castShadow=false;const bottom=mesh(scene,'cyl',0x1e343a,0,-1.3,0,6.5,.4,5.8);bottom.castShadow=false;for(let i=0;i<45;i++){const x=((i*73)%37-18)*.6,z=((i*41)%31-15)*.6,y=-.1+(i*17%13)*.17;const star=mesh(scene,'sphere',0xd5c58c,x,y,z,.025,.025,.025,0xb89e6d);star.castShadow=false;}
 resize();window.addEventListener('resize',resize);state=makeState();screen='title';idle=performance.now();rebuild();renderUI();renderer.setAnimationLoop(animate);
 if(AIHub.active){const info=await AIHub.connect({mode:'parallel',seats:[1,4]});if(info){newGame();AIHub.ready();}else{screen='title';state=makeState();rebuild();renderUI();}}
 }catch(e){console.error(e);screen='error';AIHub.fail(e.message||'WebGPU initialization failed');renderUI();}}
init();
