## STARFOB 64
A spiritual successor to Starfox 64 (N64). Original characters, stages, art and music — everything here is generated procedurally in code. No assets are loaded.
Title picked by RNG (secrets.randbelow) from 50 brainstormed riffs on the source name.

## Source Information
- Date: 2026-10-20 19:15
- Source: Starfox 64 for N64
- Tech: Three.js r180 (three@0.180.0, WebGPURenderer + TSL node materials + PostProcessing/bloom, loaded from jsDelivr via import map, no WebGL fallback); Rapier 3D 0.19.3 (@dimforge/rapier3d-compat, WASM inlined); Web Audio API (all sfx, radio babble and music synthesized live); Gamepad API (PS5-first, with rumble); vanilla ES modules bundled by a small Python script; DOM/CSS HUD and menus.
- Art Direction: Stylized cel shading — 4-step toon ramp (MeshToonNodeMaterial), inverted-hull ink outlines with smoothed normals, banded gradient sky with sun disc, flat-color stylized terrain, bloom on emissives.
- Animation: Procedural animation — critically damped springs (banking, pitch, roll), tween/keyframe tracks, hierarchical part rigs (detachable wings), two-bone IK walk cycle on the Bulwark Walker, arc-length trail following for the Leviathan, particle systems, Rapier rigid-body debris.
- Testing: The prompt said "Write no tests, do no tests, testing will be done separately." Accordingly no tests were written and nothing was executed or run in a browser during development; the code is unverified at runtime.
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium-ultracode
- Usage: unknown (no cost or token estimate was available in the session)

## Engine Feedback
- What did you like most about the engine? Three.js TSL: cel shading, the banded sky and terrain patterns were a few lines of node code, and MeshToonNodeMaterial gave the toon ramp for free. Rapier's swept ray-casts, shape queries and inlined-WASM compat build made robust bullets and a no-hosting single file easy.
- Did you get stuck or guess wrong? Because testing was off-limits I had to recall r180/Rapier 0.19 APIs from memory (PostProcessing naming, instance colors on node materials, which collider pairs raise events — sensor-vs-sensor does not). I designed around the riskiest guesses (ray-cast bullets instead of sensor events) and wrapped post-processing in a fallback, but none of it was confirmed by running it.
- What was the most important thing you had to build yourself? The game framework: rail and all-range flight controllers, the entity/director/event-script layer, multi-part bosses, the HUD and controller-first menu system, the input layer, and the procedural audio and music engine.
- What was the hardest part about using the engine? Not being able to see it run: WebGPU/TSL and Rapier event semantics are easy to get subtly wrong, and there is no animation or game-state layer, so springs, tweens, IK and state flow all had to be written by hand.
- If you had to remove or overhaul one thing from the engine, what would that be? The churn in naming and entry points around post-processing and node-material setup between releases (PostProcessing vs RenderPipeline, import paths) — a stable facade would remove a lot of guesswork.
- If you could change one thing about the engine, what would it be? A first-class outline/edge-detect pass for toon rendering in three/webgpu, so ink lines do not need inverted-hull meshes with hand-smoothed normals.

## Prompt Feedback
- What did you like most about this prompt? The concrete bar ("feature-complete demo" with named reference demos), the attract-mode and 10-foot controller-first requirements, and the realistic gamepad axis-inversion quirk with a pragmatic toggle fix — they turned a vague genre clone into a checkable spec.
- What was confusing? "Silently brainstorm 50 titles" while also using real code for the RNG; the SOURCE placeholder versus the filename pattern with brackets; "no tests" combined with "polished, feature-complete"; and "Usage: only if estimates are available" when none are exposed.
- What was the hardest thing to do? Delivering a very broad scope (three rail stages, an all-range stage, four bosses, wingmen, menus, audio, attract mode) as one file of GPU and physics code without ever running it.
- If there was one test you could have run, what would that test be? A headless Chromium smoke test with WebGPU enabled that loads the page, logs console and shader errors, and screenshots the title, each stage, and each boss intro to catch API mismatches and rendering bugs.
-->

}

// ---------------------------------------------------------------- tween / spring utilities (procedural animation toolkit)
class Spring {
  constructor(value = 0, k = 140, d = 14) { this.x = value; this.v = 0; this.t = value; this.k = k; this.d = d; }
  step(dt) {
    const n = Math.max(1, Math.ceil(dt / 0.008)), h = dt / n;
    for (let i = 0; i < n; i++) { this.v += ((this.t - this.x) * this.k - this.v * this.d) * h; this.x += this.v * h; }
    return this.x;
  }
  kick(v) { this.v += v; }
}
const Tweens = {
  list: [],
  add(dur, fn, ease = (t) => t, done) { const tw = { t: 0, dur, fn, ease, done }; this.list.push(tw); return tw; },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const tw = this.list[i];
      tw.t += dt;
      const k = clamp(tw.t / tw.dur, 0, 1);
      tw.fn(tw.ease(k), k);
      if (k >= 1) { this.list.splice(i, 1); if (tw.done) tw.done(); }
    }
  },
  clear() { this.list.length = 0; },
};
// keyframe track: [[t, value], ...] sampled with smooth interpolation
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const a = keys[i - 1], b = keys[i];
      return lerp(a[1], b[1], smooth((t - a[0]) / (b[0] - a[0])));
    }
  }
  return keys[keys.length - 1][1];
}

const ABOUT_TEXT = "## STARFOB 64\nA spiritual successor to Starfox 64 (N64). Original characters, stages, art and music \u2014 everything here is generated procedurally in code. No assets are loaded.\nTitle picked by RNG (secrets.randbelow) from 50 brainstormed riffs on the source name.\n\n## Source Information\n- Date: 2026-10-20 19:15\n- Source: Starfox 64 for N64\n- Tech: Three.js r180 (three@0.180.0, WebGPURenderer + TSL node materials + PostProcessing/bloom, loaded from jsDelivr via import map, no WebGL fallback); Rapier 3D 0.19.3 (@dimforge/rapier3d-compat, WASM inlined); Web Audio API (all sfx, radio babble and music synthesized live); Gamepad API (PS5-first, with rumble); vanilla ES modules bundled by a small Python script; DOM/CSS HUD and menus.\n- Art Direction: Stylized cel shading \u2014 4-step toon ramp (MeshToonNodeMaterial), inverted-hull ink outlines with smoothed normals, banded gradient sky with sun disc, flat-color stylized terrain, bloom on emissives.\n- Animation: Procedural animation \u2014 critically damped springs (banking, pitch, roll), tween/keyframe tracks, hierarchical part rigs (detachable wings), two-bone IK walk cycle on the Bulwark Walker, arc-length trail following for the Leviathan, particle systems, Rapier rigid-body debris.\n- Testing: The prompt said \"Write no tests, do no tests, testing will be done separately.\" Accordingly no tests were written and nothing was executed or run in a browser during development; the code is unverified at runtime.\n- Environment: Claude Code CLI (headless); Linux; browser unknown\n- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium-ultracode\n- Usage: unknown (no cost or token estimate was available in the session)\n\n## Engine Feedback\n- What did you like most about the engine? Three.js TSL: cel shading, the banded sky and terrain patterns were a few lines of node code, and MeshToonNodeMaterial gave the toon ramp for free. Rapier's swept ray-casts, shape queries and inlined-WASM compat build made robust bullets and a no-hosting single file easy.\n- Did you get stuck or guess wrong? Because testing was off-limits I had to recall r180/Rapier 0.19 APIs from memory (PostProcessing naming, instance colors on node materials, which collider pairs raise events \u2014 sensor-vs-sensor does not). I designed around the riskiest guesses (ray-cast bullets instead of sensor events) and wrapped post-processing in a fallback, but none of it was confirmed by running it.\n- What was the most important thing you had to build yourself? The game framework: rail and all-range flight controllers, the entity/director/event-script layer, multi-part bosses, the HUD and controller-first menu system, the input layer, and the procedural audio and music engine.\n- What was the hardest part about using the engine? Not being able to see it run: WebGPU/TSL and Rapier event semantics are easy to get subtly wrong, and there is no animation or game-state layer, so springs, tweens, IK and state flow all had to be written by hand.\n- If you had to remove or overhaul one thing from the engine, what would that be? The churn in naming and entry points around post-processing and node-material setup between releases (PostProcessing vs RenderPipeline, import paths) \u2014 a stable facade would remove a lot of guesswork.\n- If you could change one thing about the engine, what would it be? A first-class outline/edge-detect pass for toon rendering in three/webgpu, so ink lines do not need inverted-hull meshes with hand-smoothed normals.\n\n## Prompt Feedback\n- What did you like most about this prompt? The concrete bar (\"feature-complete demo\" with named reference demos), the attract-mode and 10-foot controller-first requirements, and the realistic gamepad axis-inversion quirk with a pragmatic toggle fix \u2014 they turned a vague genre clone into a checkable spec.\n- What was confusing? \"Silently brainstorm 50 titles\" while also using real code for the RNG; the SOURCE placeholder versus the filename pattern with brackets; \"no tests\" combined with \"polished, feature-complete\"; and \"Usage: only if estimates are available\" when none are exposed.\n- What was the hardest thing to do? Delivering a very broad scope (three rail stages, an all-range stage, four bosses, wingmen, menus, audio, attract mode) as one file of GPU and physics code without ever running it.\n- If there was one test you could have run, what would that test be? A headless Chromium smoke test with WebGPU enabled that loads the page, logs console and shader errors, and screenshots the title, each stage, and each boss intro to catch API mismatches and rendering bugs.";

const Input = {
  pad: null, device: 'kb', lastActivity: performance.now(), keyboardSeen: false,
  keys: new Set(), mouse: { x: 0, y: 0, buttons: 0, active: false },
  act: null, nav: { up: false, down: false, left: false, right: false, confirm: false, back: false },
  _prevBtn: [], _prevKeys: new Set(), _navHold: {}, _tap: { l: -9, r: -9 }, _mprev: 0,
  isPS: false,
};
const BTN = { cross: 0, circle: 1, square: 2, triangle: 3, l1: 4, r1: 5, l2: 6, r2: 7, share: 8, options: 9, l3: 10, r3: 11, up: 12, down: 13, left: 14, right: 15 };

function emptyAct() {
  return {
    move: { x: 0, y: 0 }, fire: false, fireDown: false, charge: false, chargeDown: false, chargeUp: false,
    bomb: false, boost: 0, brake: 0, bankL: false, bankR: false, rollL: false, rollR: false, maneuver: false,

}
Input.act = emptyAct();

function applyDZ(x, y, dz) {
  const m = Math.hypot(x, y);
  if (m < dz || m < 1e-6) return [0, 0];
  const k = (m - dz) / (1 - dz) / m;
  return [clamp(x * k, -1, 1), clamp(y * k, -1, 1)];
}

// Poll once per frame. Produces Input.act (gameplay) and Input.nav (menu edges, with hold-repeat).
Input.poll = function (dt) {
  const now = performance.now();
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let pad = null;
  for (const p of pads) { if (p && p.connected) { pad = p; break; } }
  Input.pad = pad;
  Input.isPS = !!(pad && /054c|dualsense|dualshock|wireless controller|playstation/i.test(pad.id));
  const b = (i) => (pad && pad.buttons[i] ? pad.buttons[i].pressed : false);
  const bv = (i) => (pad && pad.buttons[i] ? pad.buttons[i].value : 0);
  const K = (...codes) => codes.some((c) => Input.keys.has(c));
  const KP = (...codes) => codes.some((c) => Input.keys.has(c) && !Input._prevKeys.has(c));

  // pad activity detection
  let padActive = false;
  if (pad) {
    for (let i = 0; i < pad.buttons.length; i++) {
      const p = pad.buttons[i].pressed;
      if (p && !Input._prevBtn[i]) padActive = true;
    }
    for (let i = 0; i < Math.min(4, pad.axes.length); i++) if (Math.abs(pad.axes[i]) > 0.5) padActive = true;
  }
  if (padActive) { Input.device = 'pad'; Input.lastActivity = now; Snd.unlock(); }
  if (Input.keys.size && !Input._prevKeys.size) Input.lastActivity = now;

  // sticks
  let lx = 0, ly = 0, rx = 0, ry = 0;
  if (pad) {
    [lx, ly] = applyDZ(pad.axes[0] || 0, pad.axes[1] || 0, S.deadzone);
    [rx, ry] = applyDZ(pad.axes[2] || 0, pad.axes[3] || 0, S.deadzone);
    if (S.invH) { lx = -lx; rx = -rx; }
    if (S.invV) { ly = -ly; ry = -ry; }
  }
  let mx = lx, my = -ly;
  const kx = (K('KeyD', 'ArrowRight') ? 1 : 0) - (K('KeyA', 'ArrowLeft') ? 1 : 0);
  const ky = (K('KeyW', 'ArrowUp') ? 1 : 0) - (K('KeyS', 'ArrowDown') ? 1 : 0);
  if (kx || ky) { const l = Math.hypot(kx, ky); mx = kx / Math.max(1, l); my = ky / Math.max(1, l); }
  else if (S.mouse && Input.mouse.active && !pad) {
    const [a, c] = applyDZ(Input.mouse.x * 1.25, Input.mouse.y * 1.25, 0.08);
    mx = a; my = c;
  }
  // d-pad also steers
  const dpx = (b(BTN.right) ? 1 : 0) - (b(BTN.left) ? 1 : 0), dpy = (b(BTN.up) ? 1 : 0) - (b(BTN.down) ? 1 : 0);
  if (!mx && dpx) mx = dpx;
  if (!my && dpy) my = dpy;

  const a = emptyAct();
  a.move.x = clamp(mx, -1, 1); a.move.y = clamp(my, -1, 1);
  const mb = Input.mouse.buttons;
  a.fire = b(BTN.cross) || K('Space', 'KeyJ', 'KeyZ') || !!(mb & 1);
  a.charge = b(BTN.square) || K('KeyK', 'KeyX') || !!(mb & 4);
  a.bomb = false;
  const bombNow = b(BTN.circle) || K('KeyB', 'KeyL') || !!(mb & 2);
  const bombPrev = Input._prevBtn[BTN.circle] || ['KeyB', 'KeyL'].some((c) => Input._prevKeys.has(c)) || !!(Input._mprev & 2);
  a.bomb = bombNow && !bombPrev;
  a.fireDown = a.fire && !(Input._prevBtn[BTN.cross] || ['Space', 'KeyJ', 'KeyZ'].some((c) => Input._prevKeys.has(c)) || !!(Input._mprev & 1));
  const chPrev = Input._prevBtn[BTN.square] || ['KeyK', 'KeyX'].some((c) => Input._prevKeys.has(c)) || !!(Input._mprev & 4);
  a.chargeDown = a.charge && !chPrev;
  a.chargeUp = !a.charge && chPrev;
  a.boost = Math.max(bv(BTN.r2), K('ShiftLeft', 'ShiftRight') ? 1 : 0);
  a.brake = Math.max(bv(BTN.l2), K('KeyC', 'ControlLeft') ? 1 : 0);
  a.bankL = b(BTN.l1) || K('KeyQ');
  a.bankR = b(BTN.r1) || K('KeyE');
  const lPress = (b(BTN.l1) && !Input._prevBtn[BTN.l1]) || KP('KeyQ');
  const rPress = (b(BTN.r1) && !Input._prevBtn[BTN.r1]) || KP('KeyE');
  if (lPress) { if (now - Input._tap.l < 300) { a.rollL = true; Input._tap.l = -9; } else Input._tap.l = now; }

  a.maneuver = (b(BTN.triangle) && !Input._prevBtn[BTN.triangle]) || KP('KeyF');
  a.uturnHeld = a.move.y < -0.55;
  a.pause = (b(BTN.options) && !Input._prevBtn[BTN.options]) || KP('Escape', 'KeyP');
  a.any = padActive || KP(...Array.from(Input.keys)) || (mb && !Input._mprev);
  Input.act = a;

  // menu navigation edges (stick + dpad + keys), with repeat
  const nv = { up: false, down: false, left: false, right: false, confirm: false, back: false };
  const raw = {
    up: b(BTN.up) || ly < -0.6 || K('ArrowUp', 'KeyW'),
    down: b(BTN.down) || ly > 0.6 || K('ArrowDown', 'KeyS'),
    left: b(BTN.left) || lx < -0.6 || K('ArrowLeft', 'KeyA'),
    right: b(BTN.right) || lx > 0.6 || K('ArrowRight', 'KeyD'),
  };
  for (const k of ['up', 'down', 'left', 'right']) {
    const h = Input._navHold[k] || (Input._navHold[k] = { on: false, t: 0, rep: 0 });
    if (raw[k]) {
      if (!h.on) { h.on = true; h.t = 0; h.rep = 0; nv[k] = true; }
      else { h.t += dt; if (h.t > 0.38) { h.rep += dt; if (h.rep > 0.11) { h.rep = 0; nv[k] = true; } } }
    } else h.on = false;
  }
  nv.confirm = (b(BTN.cross) && !Input._prevBtn[BTN.cross]) || KP('Enter', 'Space', 'NumpadEnter');
  nv.back = (b(BTN.circle) && !Input._prevBtn[BTN.circle]) || KP('Escape', 'Backspace');
  nv.options = (b(BTN.options) && !Input._prevBtn[BTN.options]) || KP('Enter');
  nv.tabL = (b(BTN.l1) && !Input._prevBtn[BTN.l1]) || KP('KeyQ');
  nv.tabR = (b(BTN.r1) && !Input._prevBtn[BTN.r1]) || KP('KeyE');
  Input.nav = nv;

  Input._prevBtn = pad ? pad.buttons.map((x) => x.pressed) : [];
  Input._prevKeys = new Set(Input.keys);
  Input._mprev = mb;
};

// ---- 20_audio.js
// ===================================================================
//  AUDIO  -  100% synthesized with Web Audio (sfx, radio babble, procedural music)
// ===================================================================
const Snd = {
  ctx: null, master: null, musicBus: null, sfxBus: null, voiceBus: null, noise: null, ready: false,
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const c = this.ctx;
      this.master = c.createGain();
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 5;
      this.master.connect(comp); comp.connect(c.destination);
      this.musicBus = c.createGain(); this.sfxBus = c.createGain(); this.voiceBus = c.createGain();
      this.musicBus.connect(this.master); this.sfxBus.connect(this.master); this.voiceBus.connect(this.master);
      const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
      this.ready = true;
      this.applyVolumes();
      Music.resumePending();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  applyVolumes() {
    if (!this.ready) return;
    this.master.gain.value = S.master;
    this.musicBus.gain.value = S.music * 0.55;
    this.sfxBus.gain.value = S.sfx;
    this.voiceBus.gain.value = S.voice;
  },
  // ---- primitives
  osc(type, f0, f1, t, dur, vol, dest, pan = 0) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.01, dur * 0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let out = g;
    o.connect(g);
    if (pan && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); out = p; }
    out.connect(dest || this.sfxBus);
    o.start(t); o.stop(t + dur + 0.05);
    return o;
  },
  noiseBurst(t, dur, vol, f0, f1, type = 'lowpass', q = 1, dest, pan = 0) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; s.loop = true;
    f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.015, dur * 0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g);
    let out = g;
    if (pan && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); out = p; }
    out.connect(dest || this.sfxBus);
    s.start(t, Math.random()); s.stop(t + dur + 0.05);
  },
  play(name, o = {}) {
    if (!this.ready || this.ctx.state !== 'running') return;
    const fn = SFX[name];
    if (fn) fn(this.ctx.currentTime + 0.001, o.vol === undefined ? 1 : o.vol, o.pan || 0, o);
  },
  // spatial pan from a world position (uses active camera)
  panFor(p) {
    if (!R.camera) return 0;
    const v = p.clone().project(R.camera);
    return clamp(v.x, -1, 1) * 0.8;
  },
  charge() {
    if (!this.ready) return null;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = 'sawtooth'; o2.type = 'square';
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(900, t + 1.6);
    o2.frequency.setValueAtTime(121, t); o2.frequency.exponentialRampToValueAtTime(1810, t + 1.6);
    f.type = 'lowpass'; f.frequency.value = 2400;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.2);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.sfxBus);
    o.start(t); o2.start(t);
    return { stop: () => { const n = c.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(g.gain.value, n); g.gain.exponentialRampToValueAtTime(0.0001, n + 0.08); o.stop(n + 0.1); o2.stop(n + 0.1); } };
  },
  engine() {
    if (!this.ready) return null;
    const c = this.ctx, o = c.createOscillator(), n = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter(), ng = c.createGain(), nf = c.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 55;
    f.type = 'lowpass'; f.frequency.value = 260;
    g.gain.value = 0.0;
    n.buffer = this.noise; n.loop = true; nf.type = 'bandpass'; nf.frequency.value = 900; nf.Q.value = 0.6; ng.gain.value = 0;
    o.connect(f); f.connect(g); g.connect(this.sfxBus);
    n.connect(nf); nf.connect(ng); ng.connect(this.sfxBus);
    o.start(); n.start();
    return {
      set(level, boost) {
        const t = c.currentTime;
        o.frequency.setTargetAtTime(48 + level * 30 + boost * 40, t, 0.1);
        f.frequency.setTargetAtTime(220 + boost * 700, t, 0.1);
        g.gain.setTargetAtTime(0.07 + boost * 0.05, t, 0.1);
        ng.gain.setTargetAtTime(0.012 + boost * 0.06, t, 0.1);
      },
      stop() { try { g.gain.setTargetAtTime(0, c.currentTime, 0.05); ng.gain.setTargetAtTime(0, c.currentTime, 0.05); o.stop(c.currentTime + 0.3); n.stop(c.currentTime + 0.3); } catch (e) { /* ignore */ } },
    };
  },
  voice(pitch, t0 = 0) {
    if (!this.ready || this.ctx.state !== 'running') return;
    const c = this.ctx, t = c.currentTime + t0;
    const forms = [[730, 1090], [270, 2290], [300, 870], [660, 1720], [520, 1190]];
    const fm = pick(forms), dur = rnd(0.05, 0.09);
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(pitch * rnd(0.9, 1.25), t);
    o.frequency.linearRampToValueAtTime(pitch * rnd(0.85, 1.3), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5, t + 0.01); g.gain.linearRampToValueAtTime(0.0001, t + dur);
    for (const f of fm) {
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 6;
      o.connect(bp); bp.connect(g);
    }
    g.connect(this.voiceBus);
    o.start(t); o.stop(t + dur + 0.02);
  },
};

const Music = {
  cur: null, name: null, step: 0, nextT: 0, timer: null, pending: null, gain: null, intensity: 1,
  resumePending() { if (this.pending) { const p = this.pending; this.pending = null; this.play(p); } },
  stop(fade = 0.4) {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (this.gain && Snd.ready) { const g = this.gain, t = Snd.ctx.currentTime; g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0, t, fade / 3); setTimeout(() => { try { g.disconnect(); } catch (e) { /* ignore */ } }, fade * 1000 + 300); }
    this.gain = null; this.cur = null; this.name = null;
  },
  play(name) {
    if (this.name === name) return;
    if (!Snd.ready) { this.pending = name; return; }
    this.stop(0.5);
    const tr = TRACKS[name];
    if (!tr) return;
    this.name = name; this.cur = tr; this.step = 0;
    this.gain = Snd.ctx.createGain(); this.gain.gain.value = 1; this.gain.connect(Snd.musicBus);
    this.nextT = Snd.ctx.currentTime + 0.12;
    this.timer = setInterval(() => this.tick(), 30);
  },
  tick() {
    const tr = this.cur;
    if (!tr || !Snd.ready) return;
    const spb = 60 / tr.bpm / 4;
    while (this.nextT < Snd.ctx.currentTime + 0.15) {
      this.sched(tr, this.step, this.nextT, spb);
      this.nextT += spb; this.step++;
      if (tr.once && this.step >= 64) { this.stop(1.5); return; }
    }
  },
  sched(tr, step, t, spb) {
    const sc = SCALES[tr.scale], bar = Math.floor(step / 16) % tr.prog.length, s16 = step % 16, root = tr.root + tr.prog[bar];
    const deg = (d) => sc[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);
    const out = this.gain;
    const d = tr.drums;
    if (d.k[s16] === 'x') this.kick(t, out);
    if (d.s[s16] === 'x') this.snare(t, out);
    if (d.h[s16] === 'x' && (this.intensity > 0.3 || tr.once)) this.hat(t, out, s16 % 4 === 2 ? 0.07 : 0.045);
    const b = tr.bass[s16];
    if (b !== N && b !== undefined) this.note(tr.bw, midiHz(root - 12 + b), t, spb * 1.7, 0.22, out, 600);
    const ln = tr.lead.length, l = tr.lead[step % ln];
    if (l !== N && l !== undefined && (this.intensity > 0.2 || tr.once)) {
      const f = midiHz(root + 12 + deg(l) + (tr.prog[bar] ? 0 : 0));
      this.note(tr.lw, f, t, spb * 2.2, 0.11, out, 3200);
      this.note(tr.lw, f * 1.006, t, spb * 2.2, 0.05, out, 3200);
    }
    if (tr.arp && this.intensity > 0.5) {
      const a = tr.arp[s16 % tr.arp.length];
      this.note('triangle', midiHz(root + 24 + deg(a)), t, spb * 0.9, 0.05, out, 4000);
    }
  },
  note(type, f, t, dur, vol, out, cutoff) {
    const c = Snd.ctx, o = c.createOscillator(), g = c.createGain(), fl = c.createBiquadFilter();
    o.type = type; o.frequency.value = f;
    fl.type = 'lowpass'; fl.frequency.setValueAtTime(cutoff, t); fl.frequency.exponentialRampToValueAtTime(Math.max(200, cutoff * 0.3), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(fl); fl.connect(g); g.connect(out);
    o.start(t); o.stop(t + dur + 0.05);

// ---------------------------------------------------------------- renderer setup
async function initRenderer(canvas) {
  if (!navigator.gpu) throw new Error('WebGPU is not available in this browser.');
  const renderer = new THREE.WebGPURenderer({ canvas, antialias: true, forceWebGL: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  await renderer.init();
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  R.renderer = renderer;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a18);
  scene.fog = new THREE.Fog(0xffc890, 160, 900);
  R.scene = scene;
  R.camera = new THREE.PerspectiveCamera(S.fov, innerWidth / innerHeight, 0.4, 4000);
  R.camera.position.set(0, 4, 16);
  scene.add(R.camera);

  R.amb = new THREE.AmbientLight(0xffffff, 0.55);
  R.hemi = new THREE.HemisphereLight(0xaad0ff, 0x604030, 0.7);
  R.sun = new THREE.DirectionalLight(0xfff2d0, 2.4);
  R.sun.castShadow = S.shadows;
  R.sun.shadow.mapSize.set(2048, 2048);
  const sc = R.sun.shadow.camera;
  sc.left = -90; sc.right = 90; sc.top = 90; sc.bottom = -90; sc.near = 1; sc.far = 420;
  R.sun.shadow.bias = -0.0004;
  R.sun.shadow.normalBias = 0.05;
  scene.add(R.amb, R.hemi, R.sun, R.sun.target);

  // sky dome: banded gradient + sun disc
  const dir = TSL.normalize(TSL.positionLocal);
  const h = dir.y;
  const hq = TSL.floor(h.mul(12)).div(12);
  const up = TSL.mix(R.skyHor, R.skyTop, TSL.smoothstep(0.0, 0.7, hq));
  const dn = TSL.mix(R.skyBot, R.skyHor, TSL.smoothstep(-0.5, 0.0, hq));
  const base = TSL.mix(dn, up, TSL.step(0.0, hq.add(0.0001)));
  const sd = TSL.dot(dir, R.sunDir);
  const sunDisc = TSL.step(0.9965, sd).mul(R.sunCol);
  const sunHalo = TSL.step(0.985, sd).mul(R.sunCol).mul(0.25);
  const skyMat = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide, depthWrite: false, fog: false });
  skyMat.colorNode = base.add(sunDisc).add(sunHalo);
  R.sky = new THREE.Mesh(new THREE.SphereGeometry(2500, 32, 20), skyMat);
  R.sky.frustumCulled = false; R.sky.renderOrder = -10;
  scene.add(R.sky);

  // starfield
  const starMat = new THREE.MeshBasicNodeMaterial({ color: 0xffffff, fog: false });
  R.stars = new THREE.InstancedMesh(new THREE.OctahedronGeometry(1, 0), starMat, 900);
  const d = new THREE.Object3D(), sr = mulberry(77);
  for (let i = 0; i < 900; i++) {
    const u = sr() * 2 - 1, a = sr() * TAU, r = Math.sqrt(1 - u * u);
    d.position.set(Math.cos(a) * r, u, Math.sin(a) * r).multiplyScalar(2300);
    d.scale.setScalar(2 + sr() * 5);
    d.updateMatrix();
    R.stars.setMatrixAt(i, d.matrix);
    R.stars.setColorAt(i, new THREE.Color().setHSL(sr() < 0.3 ? 0.08 : 0.6, 0.5, 0.75 + sr() * 0.25));
  }
  R.stars.frustumCulled = false;
  scene.add(R.stars);

  // post: bloom
  try {
    R.post = new THREE.PostProcessing(renderer);
    R.scenePass = TSL.pass(scene, R.camera);
    const sceneCol = R.scenePass.getTextureNode('output');
    R.bloomNode = bloom(sceneCol, 0.55, 0.5, 0.82);
    R.sceneCol = sceneCol;
    applyBloom();
  } catch (e) { console.warn('post-processing unavailable', e); R.post = null; }

  FX.init();
  addEventListener('resize', onResize);

}

}

  if (!R.renderer) return;
  R.renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));

}

class ParticlePool {

    this.life = new Float32Array(max); this.maxLife = new Float32Array(max); this.size = new Float32Array(max);

    const mat = new THREE.MeshBasicNodeMaterial({ color: 0xffffff, fog: false, transparent: additive, depthWrite: !additive });
    if (additive) mat.blending = THREE.AdditiveBlending;

    this.mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(max * 3), 3);

    const i = this.n++;

    this.vx[i] = v.x; this.vy[i] = v.y; this.vz[i] = v.z;
    this.life[i] = this.maxLife[i] = life; this.size[i] = size; this.grav[i] = grav; this.drag[i] = drag;
    this.cr[i] = c.r; this.cg[i] = c.g; this.cb[i] = c.b;
  }
  update(dt) {
    const m = this.mesh.instanceMatrix.array, c = this.mesh.instanceColor.array;
    for (let i = 0; i < this.n;) {
      this.life[i] -= dt;
      if (this.life[i] <= 0) {
        const l = --this.n;
        if (i !== l) {
          this.px[i] = this.px[l]; this.py[i] = this.py[l]; this.pz[i] = this.pz[l];
          this.vx[i] = this.vx[l]; this.vy[i] = this.vy[l]; this.vz[i] = this.vz[l];
          this.life[i] = this.life[l]; this.maxLife[i] = this.maxLife[l]; this.size[i] = this.size[l];
          this.grav[i] = this.grav[l]; this.drag[i] = this.drag[l];
          this.cr[i] = this.cr[l]; this.cg[i] = this.cg[l]; this.cb[i] = this.cb[l];

      i++;
    }
    for (let i = 0; i < this.n; i++) {
      const k = Math.sqrt(this.life[i] / this.maxLife[i]), s = this.size[i] * k, o = i * 16;
      m[o] = s; m[o + 1] = 0; m[o + 2] = 0; m[o + 3] = 0;
      m[o + 4] = 0; m[o + 5] = s; m[o + 6] = 0; m[o + 7] = 0;
      m[o + 8] = 0; m[o + 9] = 0; m[o + 10] = s; m[o + 11] = 0;
      m[o + 12] = this.px[i]; m[o + 13] = this.py[i]; m[o + 14] = this.pz[i]; m[o + 15] = 1;
      c[i * 3] = this.cr[i]; c[i * 3 + 1] = this.cg[i]; c[i * 3 + 2] = this.cb[i];
    }
    this.mesh.count = this.n;
    this.mesh.instanceMatrix.needsUpdate = true; this.mesh.instanceColor.needsUpdate = true;
  }
  clear() { this.n = 0; }
}

// ===================================================================
//  PHYSICS  -  Rapier 0.19.3 wrapper
//  * kinematic colliders for ships / bullets / pickups, fixed colliders for scenery
//  * swept ray-casts for projectiles, shape queries for nova blasts
//  * contact events for ramming / pickups, dynamic rigid bodies for debris and shed wings
// ===================================================================
const Phys = {
  world: null, eq: null, map: new Map(), debris: [], ground: null, ready: false,
  async init() { await RAPIER.init(); this.ready = true; this.reset(0); },
  reset(gravityY = 0, groundY = null) {
    if (this.world) { try { this.world.free(); } catch (e) { /* ignore */ } }
    for (const d of this.debris) if (d.mesh.parent) d.mesh.parent.remove(d.mesh);
    this.debris.length = 0; this.map.clear();
    this.world = new RAPIER.World({ x: 0, y: gravityY, z: 0 });
    this.eq = new RAPIER.EventQueue(true);
    this.ground = null;
    if (groundY !== null) {
      const body = this.world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(0, groundY - 1, 0));
      this.world.createCollider(RAPIER.ColliderDesc.cuboid(4000, 1, 4000).setCollisionGroups(ig(GRP.GROUND, GRP.DEBRIS)).setRestitution(0.35).setFriction(0.8), body);
    }
  },
  shapeDesc(s) {
    if (s.ball !== undefined) return RAPIER.ColliderDesc.ball(s.ball);
    if (s.box) return RAPIER.ColliderDesc.cuboid(s.box[0], s.box[1], s.box[2]);
    if (s.cap) return RAPIER.ColliderDesc.capsule(s.cap[0], s.cap[1]);
    return RAPIER.ColliderDesc.ball(1);
  },
  baseDesc(s, mem, filter, sensor) {
    return this.shapeDesc(s).setSensor(!!sensor).setCollisionGroups(ig(mem, filter))
      .setActiveEvents(RAPIER.ActiveEvents.COLLISION_EVENTS).setActiveCollisionTypes(RAPIER.ActiveCollisionTypes.ALL);
  },
  addKin(ent, shape, mem, filter, sensor = false) {
    const p = ent.pos;
    const body = this.world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(p.x, p.y, p.z));
    const col = this.world.createCollider(this.baseDesc(shape, mem, filter, sensor), body);
    ent.body = body; ent.collider = col; this.map.set(col.handle, ent);
  },
  addFixed(ent, shape, mem, filter, quat) {
    const p = ent.pos;
    const d = RAPIER.RigidBodyDesc.fixed().setTranslation(p.x, p.y, p.z);
    if (quat) d.setRotation({ x: quat.x, y: quat.y, z: quat.z, w: quat.w });
    const body = this.world.createRigidBody(d);
    const col = this.world.createCollider(this.baseDesc(shape, mem, filter, false), body);
    ent.body = body; ent.collider = col; this.map.set(col.handle, ent);
  },
  remove(ent) {
    if (!ent.body) return;
    this.map.delete(ent.collider.handle);
    try { this.world.removeRigidBody(ent.body); } catch (e) { /* ignore */ }
    ent.body = null; ent.collider = null;
  },
  move(ent) { if (ent.body) ent.body.setNextKinematicTranslation(ent.pos); },
  step(dt, onContact) {
    this.world.timestep = clamp(dt, 1 / 240, 1 / 30);
    this.world.step(this.eq);
    this.eq.drainCollisionEvents((h1, h2, started) => {
      const a = this.map.get(h1), b = this.map.get(h2);
      if (a && b) onContact(a, b, started);
    });
    // sync debris
    for (let i = this.debris.length - 1; i >= 0; i--) {
      const d = this.debris[i];
      d.life -= dt;
      if (d.life <= 0) {
        try { this.world.removeRigidBody(d.body); } catch (e) { /* ignore */ }
        if (d.mesh.parent) d.mesh.parent.remove(d.mesh);
        this.debris.splice(i, 1); continue;
      }
      const t = d.body.translation(), r = d.body.rotation();
      d.mesh.position.set(t.x, t.y, t.z); d.mesh.quaternion.set(r.x, r.y, r.z, r.w);
      if (d.life < 0.6) d.mesh.scale.setScalar(Math.max(0.01, d.life / 0.6) * (d.baseScale || 1));
    }
  },
  // closest swept hit; returns {ent, t} or null
  ray(origin, dir, maxT, groups, pred) {
    const hit = this.world.castRay(new RAPIER.Ray(origin, dir), maxT, true, undefined, groups, undefined, undefined, pred);
    if (!hit) return null;
    const ent = this.map.get(hit.collider.handle);
    return ent ? { ent, t: hit.timeOfImpact } : null;
  },
  overlap(center, radius, groups, cb) {
    this.world.intersectionsWithShape(center, { x: 0, y: 0, z: 0, w: 1 }, new RAPIER.Ball(radius), (c) => {
      const e = this.map.get(c.handle);
      if (e) cb(e);
      return true;
    }, undefined, groups);
  },
  // dynamic debris chunk (mesh is added to scene here)
  addDebris(mesh, pos, vel, angVel, size = 0.5, life = 3) {
    const body = this.world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(pos.x, pos.y, pos.z)
      .setLinvel(vel.x, vel.y, vel.z).setAngvel({ x: angVel.x, y: angVel.y, z: angVel.z }).setLinearDamping(0.1).setAngularDamping(0.05));
    this.world.createCollider(RAPIER.ColliderDesc.cuboid(size, size * 0.4, size).setRestitution(0.4).setCollisionGroups(ig(GRP.DEBRIS, GRP.GROUND)), body);
    mesh.position.copy(pos);
    R.scene.add(mesh);
    this.debris.push({ body, mesh, life, baseScale: mesh.scale.x });
  },
};

    hp: def.hp, maxHp: def.hp, r: def.r, score: def.score || 0, t: 0, flash: 0, lockable: def.lockable !== false,

  update(s, cam) {
    const def = G.def;
    if (this.ground) this.ground.position.set(cam.x, def.ground.y, cam.z - 900);
    if (this.bg) this.bg.position.set(cam.x * 0.97, cam.y * 0.97, cam.z);
    if (!def.chunk) return;
    const ci = Math.floor(s / this.CH);
    for (let i = ci - 2; i <= ci + 12; i++) {
      if (i < -1 || this.chunks.has(i)) continue;
      const g = new THREE.Group();
      def.chunk(i, g, this.CH);
      G.world.add(g); this.chunks.set(i, g);
    }
    for (const [i, g] of this.chunks) if (i < ci - 3) { G.world.remove(g); this.chunks.delete(i); }
  },
};

function banded(c1, c2, c3, scale = 4) {
  const m = new THREE.MeshToonNodeMaterial({ gradientMap: GRAD, fog: false });
  const y = TSL.positionLocal.y;
  const b = TSL.fract(y.mul(scale).add(TSL.sin(TSL.positionLocal.x.mul(2.0)).mul(0.15)));
  m.colorNode = TSL.mix(TSL.mix(TSL.color(c1), TSL.color(c2), TSL.step(0.5, b)), TSL.color(c3), TSL.step(0.85, b));
  return m;
}
function gasPlanet(r, c1, c2, c3, ring) {
  const g = new THREE.Group();
  const p = new THREE.Mesh(GEO.sph, banded(c1, c2, c3, 2.2)); p.scale.setScalar(r); g.add(p);
  const o = new THREE.Mesh(hullGeo(p.geometry), outlineMat(0.012, 0x0c0a1a)); p.add(o);
  if (ring) {
    const rm = new THREE.Mesh(new THREE.TorusGeometry(1, 0.12, 4, 64), new THREE.MeshToonNodeMaterial({ color: ring, gradientMap: GRAD, fog: false }));
    rm.scale.set(r * 1.7, r * 1.7, 0.02); rm.rotation.x = Math.PI / 2.4; rm.rotation.y = 0.3; g.add(rm);
  }
  return g;
}

// ---- chunk builders
function canyonChunk(i, g, CH) {
  const r = mulberry(i * 7919 + 11), s0 = i * CH, sm = s0 + CH / 2;
  const rust = [0xb8573a, 0xc4663f, 0xa84a38, 0xcf7a4a];
  for (const side of [-1, 1]) {
    const h = 52 + r() * 34, x = pathX(sm) + side * (47 + r() * 4);
    const c = pick2(r, rust);
    const wall = mk(GEO.box, tm(c), { p: [x, GY + h / 2, -sm], s: [16, h, CH + 3], out: 0.1 });
    const cap = mk(GEO.box, tm(0xe09a5a), { p: [x, GY + h + 0.6, -sm], s: [16.5, 1.4, CH + 3.5], out: 0.08 });
    const stripe = mk(GEO.box, tm(0x8a3a2c), { p: [x - side * 8.1, GY + h * 0.45, -sm], s: [0.5, h * 0.12, CH + 3], cast: false });
    g.add(wall, cap, stripe);
    for (let k = 0; k < 3; k++) {
      const hh = 25 + r() * 80, w = 8 + r() * 14, xx = pathX(sm) + side * (62 + r() * 70), zz = -(s0 + r() * CH);
      const sp = mk(GEO.box, tm(pick2(r, rust)), { p: [xx, GY + hh / 2, zz], s: [w, hh, w * (0.8 + r() * 0.8)], r: [0, r() * 3, 0], out: 0.1 });
      const sc = mk(GEO.box, tm(0xe09a5a), { p: [xx, GY + hh + 0.5, zz], s: [w * 1.05, 1.2, w * 1.1], r: [0, sp.rotation.y, 0], out: 0.07 });
      g.add(sp, sc);
    }
    for (let k = 0; k < 4; k++) {
      const sc = 1.5 + r() * 4, xx = pathX(sm) + side * (30 + r() * 12), zz = -(s0 + r() * CH);
      g.add(mk(GEO.dodeca, tm(pick2(r, [0x9a6a50, 0xa87a5a])), { p: [xx, GY + sc * 0.5, zz], s: [sc, sc * 0.7, sc], r: [r() * 3, r() * 3, 0], out: 0.07 }));
    }
    for (let k = 0; k < 5; k++) {
      const xx = pathX(sm) + side * (28 + r() * 70), zz = -(s0 + r() * CH), th = 4 + r() * 7;
      const t = new THREE.Group(); t.position.set(xx, GY, zz);
      t.add(mk(GEO.cyl, tm(0x6a4a30), { p: [0, th * 0.25, 0], s: [0.5, th * 0.5, 0.5] }));
      t.add(mk(GEO.cone, tm(0x3f9a4e), { p: [0, th * 0.75, 0], s: [th * 0.28, th * 0.9, th * 0.28], out: 0.08 }));
      t.add(mk(GEO.cone, tm(0x58b85c), { p: [0, th * 1.05, 0], s: [th * 0.2, th * 0.7, th * 0.2], out: 0.08 }));
      g.add(t);
    }
  }
  // river
  const rg = new THREE.Group(); rg.position.set(pathX(sm), GY + 0.1, -sm);
  rg.rotation.y = -Math.atan((pathX(s0 + CH) - pathX(s0)) / CH);
  const rv = new THREE.Mesh(GEO.plane, new THREE.MeshBasicNodeMaterial({ color: col(0x40b8ff, 1.1), fog: true })); rv.rotation.x = -Math.PI / 2; rv.scale.set(14 + r() * 4, CH + 2, 1);
  rg.add(rv); g.add(rg);
}
function pick2(r, arr) { return arr[Math.floor(r() * arr.length)]; }
function beltChunk(i, g, CH) {
  const r = mulberry(i * 6151 + 5), s0 = i * CH;
  const cols = [0x7a6a8a, 0x6a5a7a, 0x8a7a9a, 0x5a5070, 0x9a8aa8];
  for (let k = 0; k < 9; k++) {
    const sc = 4 + Math.pow(r(), 2) * 34;
    const ang = r() * TAU, rad = 62 + r() * 200 + sc;
    const s = s0 + r() * CH;
    const a = buildAsteroid(sc, pick2(r, cols), Math.floor(r() * 1000));
    a.position.set(pathX(s) + Math.cos(ang) * rad, pathY(s) + Math.sin(ang) * rad * 0.6, -s);
    a.rotation.set(r() * 3, r() * 3, r() * 3);
    g.add(a);
  }
  for (let k = 0; k < 14; k++) {
    const s = s0 + r() * CH, sc = 0.6 + r() * 1.6;
    const a = mk(GEO.ico, tm(pick2(r, cols)), { s: sc, r: [r() * 3, r() * 3, 0] });
    a.position.set(pathX(s) + (r() - 0.5) * 120, pathY(s) + (r() - 0.5) * 70, -s);
    g.add(a);
  }
  if (i % 9 === 4) { // derelict hull sections
    const s = s0 + 20, side = r() < 0.5 ? -1 : 1, x = pathX(s) + side * (110 + r() * 40);
    const h = new THREE.Group(); h.position.set(x, pathY(s) + (r() - 0.5) * 40, -s); h.rotation.set(r(), r() * 3, r());
    h.add(mk(GEO.box, tm(0x6a6a7a), { s: [20, 14, 70], out: 0.15 }), mk(GEO.box, tm(0x4a4a5a), { p: [0, 10, -10], s: [8, 10, 26], out: 0.12 }), mk(GEO.cyl, tm(0x3a3a4a), { p: [14, 0, 20], r: [Math.PI / 2, 0, 0], s: [5, 30, 5], out: 0.1 }));
    g.add(h);
  }
}
function riftChunk(i, g, CH) {
  const r = mulberry(i * 4421 + 9), s0 = i * CH;
  const cols = [[0x20d0c0, 0x108078], [0xe040a0, 0x802060], [0x7a50ff, 0x402a90]];
  for (let k = 0; k < 8; k++) {
    const c = pick2(r, cols), h = 20 + r() * 70, w = 3 + r() * 6;
    const ang = r() * TAU, rad = 58 + r() * 190, s = s0 + r() * CH;
    const m = toon(c[1], { emissive: col(c[0], 0.5) });
    const cr = mk(GEO.octa, m, { s: [w, h, w], out: 0.06 });
    cr.position.set(pathX(s) + Math.cos(ang) * rad, pathY(s) + Math.sin(ang) * rad * 0.7, -s);
    cr.rotation.set((r() - 0.5) * 0.8, r() * 3, (r() - 0.5) * 0.8);
    g.add(cr);
  }
  for (let k = 0; k < 3; k++) {
    const s = s0 + r() * CH, ang = r() * TAU, rad = 90 + r() * 170, sc = 8 + r() * 18;
    const isl = new THREE.Group(); isl.position.set(pathX(s) + Math.cos(ang) * rad, pathY(s) + Math.sin(ang) * rad * 0.6, -s);
    isl.add(mk(GEO.dodeca, tm(0x5a4a8a), { s: [sc, sc * 0.35, sc], out: 0.06 }), mk(GEO.cone, tm(0x3a2a6a), { p: [0, -sc * 0.5, 0], r: [Math.PI, 0, 0], s: [sc * 0.7, sc * 0.9, sc * 0.7], out: 0.06 }));
    isl.add(mk(GEO.cone, solidGlow(0x20ffe0, 1.2), { p: [0, sc * 0.55, 0], s: [sc * 0.12, sc * 0.5, sc * 0.12], cast: false }));
    g.add(isl);
  }
}

// ================================================================ BOSS 3 : LEVIATHAN (stage 2B)
Bosses.leviathan = () => {

  const headMesh = () => {
    const g = new THREE.Group();
    g.add(mk(GEO.sph, tm(0x5a3f9a), { p: [0, 0, 0], s: [3.6, 2.8, 4.6], out: 0.1 }));

    for (let i = -1; i <= 1; i++) jaw.add(mk(GEO.cone, tm(0xf0f0ff), { p: [i * 0.9, 0.4, -2.0 - Math.abs(i) * 0.3], s: [0.22, 0.7, 0.22] }));

    for (const sx of [-1, 1]) g.add(mk(GEO.sph, solidGlow(0xffe040, 2), { p: [2.1 * sx, 1.0, -2.2], s: 0.55, cast: false }));
    for (const sx of [-1, 1]) g.add(mk(GEO.box, tm(0x7a5ac0), { p: [3.4 * sx, 0.5, 0.8], r: [0, 0, 0.5 * sx], s: [2.2, 0.15, 3.2], out: 0.05 }));

  b.core = b.head;
  b.segs = [];
  for (let i = 0; i < 11; i++) {
    const s = spawnPart({
      pos: new V3(), hp: 9999, r: 3.4 - i * 0.1, score: 0, lockable: false, shield: () => true, countHit: false, idx: i, touchDmg: 18,
      makeMesh: () => { const g = new THREE.Group(); const sc = 3.4 - i * 0.12; g.add(mk(GEO.sph, tm(i % 2 ? 0x5a3f9a : 0x2a8a90), { s: [sc, sc * 0.9, sc * 1.1], out: 0.09 })); g.add(mk(GEO.cone, tm(0x7a5ac0), { p: [0, sc * 0.9, 0], s: [0.5, 1.8, 0.5], out: 0.05 })); g.add(mk(GEO.cone, solidGlow(0x30ffe0, 1.5), { p: [0, -sc * 0.8, 0], r: [Math.PI, 0, 0], s: [0.3, 1.0, 0.3], cast: false })); return g; },
    });
    b.segs.push(s);
  }
  b.parts = [b.head];
  b.maxHp = 72;
  b.hpFn = () => partsHp(b.parts);
  const trailPoint = (d) => {
    // point d units back along the head's trail
    const tr = b.trail; if (!tr.length) return null;
    const target = b.tcum - d;
    for (let i = tr.length - 1; i >= 0; i--) if (tr[i].c <= target) { const a = tr[i], n = tr[Math.min(tr.length - 1, i + 1)]; const k = n.c > a.c ? (target - a.c) / (n.c - a.c) : 0; return new V3(lerp(a.x, n.x, k), lerp(a.y, n.y, k), lerp(a.z, n.z, k)); }
    return new V3(tr[0].x, tr[0].y, tr[0].z);
  };
  b.update = (dt) => {
    const t = b.t, rail = G.rail, pl = G.pl;
    const enter = easeOut(clamp(t / 4.5, 0, 1));
    const rage = b.head.hp < b.head.maxHp * 0.45;
    b.chargeT -= dt;
    if (rage && b.chargeT < -5 && Math.random() < dt * 0.3) b.chargeT = 2.2;
    b.charge = damp(b.charge, b.chargeT > 0 ? 70 : 0, 2.2, dt);
    const sp = rage ? 1.35 : 1;
    const rel = _v1.set(Math.sin(t * 0.7 * sp) * 22 + Math.sin(t * 1.9) * 5, 4 + Math.sin(t * 0.9 * sp + 1) * 10, lerp(-340, -105, enter) + Math.sin(t * 0.45) * 28 + b.charge);
    const hp = new V3(rail.pos.x + rel.x, rail.pos.y + rel.y, rail.pos.z + rel.z);
    // trail stored rail-relative so the body keeps its shape while the rail moves
    const last = b.trail[b.trail.length - 1];
    const cur = { x: rel.x, y: rel.y, z: rel.z - 0, c: 0 };
    if (!last) { cur.c = 0; b.trail.push(cur); }
    else { const dd = Math.hypot(cur.x - last.x, cur.y - last.y, cur.z - last.z); if (dd > 0.8) { cur.c = last.c + dd; b.tcum = cur.c; b.trail.push(cur); if (b.trail.length > 400) b.trail.shift(); } }
    const prev = b.head.pos.clone();
    b.head.pos.copy(hp);
    if (b.head.mesh) {
      const dir = hp.clone().sub(prev); if (dir.lengthSq() > 1e-6) { dir.normalize(); b.head.mesh.lookAt(hp.clone().sub(dir)); }
    }
    b.segs.forEach((s, i) => {
      const p = trailPoint((i + 1) * 6.6);
      if (!p) return;
      const wob = Math.sin(t * 3 - i * 0.7) * 1.4;
      s.pos.set(rail.pos.x + p.x, rail.pos.y + p.y + wob, rail.pos.z + p.z);
      if (s.mesh) { const n = trailPoint(i * 6.6 + 3); if (n) s.mesh.lookAt(_v2.set(rail.pos.x + n.x, rail.pos.y + n.y, rail.pos.z + n.z)); }
    });
    root.position.copy(hp);
    // mouth cycle
    if (enter >= 1 && !pl.dead) {
      b.cycle += dt;
      const closedT = rage ? 2.0 : 3.2, openT = rage ? 3.2 : 3.4;
      if (!b.open && b.cycle > closedT) {
        b.open = true; b.cycle = 0; b.shots = 0; Snd.play('beam', { vol: 0.5 });
        if (!b.hinted) { b.hinted = true; Radio.say('bolt', 'Its mouth is open! Shoot it while it spits!'); }
      } else if (b.open && b.cycle > openT) { b.open = false; b.cycle = 0; }
      if (b.open) {
        b.fireT -= dt;
        if (b.fireT <= 0) { b.fireT = rage ? 0.55 : 0.8; for (const k of (rage ? [-1, 0, 1] : [0])) { const d = _v2.copy(pl.pos).sub(hp).normalize(); d.x += k * 0.09; fireEB(hp.clone().addScaledVector(d, 3), d, { speed: 62, color: 0x30ffe0, big: false }); } }
      }
    }
    b.mouth = damp(b.mouth, b.open ? 0.75 : 0, 9, dt);
    if (b.head.mesh) { b.head.mesh.userData.jaw.rotation.x = b.mouth; b.head.mesh.userData.glow.scale.setScalar(b.open ? 1.4 + Math.sin(t * 20) * 0.2 : 0.5); }
  };
  b.cleanup = () => { for (const s of b.segs) if (s.alive) { FX.explosion(s.pos, 1.2, 0x30ffe0); kill(s, { silent: true }); } };
  return b;
};

};

  vex: { name: 'WARLORD VEX', pitch: 80, c1: '#a050e0', c2: '#2a0a3a' },

function drawPortrait(cv, id, talking = 0) {
  const c = cv.getContext('2d'), w = cv.width, h = cv.height, sp = SPEAKERS[id] || SPEAKERS.fob;
  const g = c.createRadialGradient(w / 2, h * 0.45, 4, w / 2, h / 2, w * 0.75);
  g.addColorStop(0, sp.c2); g.addColorStop(1, '#05060e');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.save(); c.translate(w / 2, h * 0.56); const k = w / 100; c.scale(k, k);
  const ink = '#0c0a1a';
  const ell = (x, y, rx, ry, fill, stroke = true) => { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fillStyle = fill; c.fill(); if (stroke) { c.lineWidth = 2.5; c.strokeStyle = ink; c.stroke(); } };
  const poly = (pts, fill) => { c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.closePath(); c.fillStyle = fill; c.fill(); c.lineWidth = 2.5; c.strokeStyle = ink; c.stroke(); };

function clearWorld() {

  G.ents.length = 0;
  for (const b of G.ebs) Phys.remove(b);
  G.ebs.length = 0; G.pbs.length = 0; G.bombs.length = 0;
  for (const b of G.beams) b.alive = false;
  G.beams.length = 0;
  if (G.pl) { if (G.pl.chargeSnd) G.pl.chargeSnd.stop(); if (G.pl.engine) G.pl.engine.stop(); }
  clearWingmen();
  Terrain.clear();
  G.world.clear();
  FX.clear(); Tweens.clear(); G.later.length = 0;
  G.boss = null; G.pl = null;
  HUD.bossBar(null);
}

function startStage(id, o = {}) {

  }

  if (alive < 3 && G.arWaveT <= 0) {
    const remaining = G.arTarget - G.arKills - alive;
    const n = Math.min(5, Math.max(0, remaining));
    for (let i = 0; i < n; i++) { const a = rnd(0, TAU), r = rnd(220, 340); spawn('bandit', new V3(Math.cos(a) * r, rnd(-50, 50), Math.sin(a) * r), {}); }
    G.arWaveT = 4;
    if (n) Radio.once('wave' + Math.floor(G.arT / 25), 'bolt', pick(['More bandits on the scope!', 'Here come another batch!', 'Fresh fighters — let\'s go!']));
  }
  if (!G.flags.c1 && G.arT > 14) { G.flags.c1 = true; chase('newt'); }
  if (!G.flags.p1 && G.arT > 22) { G.flags.p1 = true; spawn('pickup', new V3(rnd(-60, 60), rnd(-20, 20), rnd(-60, 60)), { type: 'bomb' }); Radio.say('newt', 'Supply drop marked on your radar — grab it!'); }
  if (!G.flags.c2 && G.arT > 42) { G.flags.c2 = true; chase('bolt'); }
  if (!G.flags.p2 && G.arT > 50) { G.flags.p2 = true; spawn('pickup', new V3(rnd(-60, 60), rnd(-20, 20), rnd(-60, 60)), { type: 'health' }); spawn('pickup', new V3(rnd(-80, 80), rnd(-20, 20), rnd(-80, 80)), { type: 'laser' }); }
  if (!G.flags.c3 && G.arT > 70) { G.flags.c3 = true; chase('kestrel'); }
  if (!G.flags.m1 && G.arT > 30) { G.flags.m1 = true; for (let i = 0; i < 5; i++) spawn('mine', new V3(rnd(-150, 150), rnd(-30, 30), rnd(-150, 150)), {}); }
  if (!G.flags.p3 && G.arT > 85) { G.flags.p3 = true; spawn('pickup', new V3(rnd(-60, 60), 0, rnd(-60, 60)), { type: 'wrench' }); }
}

// ---------------------------------------------------------------- death / respawn / game over
function handleDeath(dt) {
  if (G.deadT < 0) return;
  G.deadT += dt;
  if (G.deadT > 2.6 && !G.attract) {
    G.deadT = -1;
    if (G.lives > 0) respawn();
    else { G.mode = 'gameover'; Music.play('gameover'); Snd.play('gameOver'); UI.open('gameover'); }
  }
}
function respawn() {
  G.lives--;
  const pl = G.pl;
  for (const e of G.ents) removeEnt(e);
  G.ents.length = 0;
  for (const b of G.ebs) { Phys.remove(b); G.world.remove(b.mesh); }
  G.ebs.length = 0;
  for (const b of G.pbs) G.world.remove(b.mesh);
  G.pbs.length = 0;
  for (const b of G.bombs) G.world.remove(b.mesh);
  G.bombs.length = 0;
  for (const b of G.beams) b.alive = true;
  updateBeams(10);
  G.later.length = 0;
  if (G.boss) { for (const e of G.boss.parts) removeEnt(e); G.world.remove(G.boss.root); G.boss = null; HUD.bossBar(null); }
  G.rail.baseScale = 1; G.rail.scale = 1;
  resetPlayerState(pl, false);
  pl.inv = 2.5;
  G.combo = 0;
  for (const w of G.wing) { w.state = 'ok'; w.hp = w.maxHp; w.chaser = null; w.mesh.visible = true; }
  if (G.def.mode === 'rail') {
    const cp = G.cp || 0;
    G.rail.s = cp; G.rail.px = pathX(cp); G.rail.py = pathY(cp); G.rail.pos.set(G.rail.px, G.rail.py, -cp);
    pl.ox = 0; pl.oy = 2;
    for (const ev of G.events) ev.done = ev.at !== undefined && ev.at < cp;
    G.stageScore = 0;
    G.score = G.cpScore || 0;
    Music.play(G.def.music);
  } else {
    pl.pos.set(0, 0, 250); pl.yaw = 0; pl.pitch = 0; pl.q.identity(); pl.speed = G.def.speed;
    G.arT = Math.max(G.arT - 10, 0);
    if (G.arKills >= G.arTarget) G.arKills = Math.max(0, G.arTarget - 6);
    for (let i = 0; i < 5; i++) { const a = i / 5 * TAU, r = 230; spawn('bandit', new V3(Math.cos(a) * r, rnd(-40, 40), Math.sin(a) * r), {}); }
    Music.play(G.def.music);
  }
  R.camera.userData.init = false;
  HUD.card('RETRY', 'Lives ×' + G.lives, 2);
  pl.mesh.position.copy(pl.pos);
}

// ---------------------------------------------------------------- clear sequence & results
function stageClear() {
  G.cleared = true; G.clearFly = 0; G.camMode = 'clear';
  G.rail.baseScale = 1;
  Music.play('victory'); Snd.play('fanfare');
  HUD.card('MISSION COMPLETE', G.def.name, 4);
  const pl = G.pl;
  pl.rollT = 0.62; pl.rollDir = 1;
  Radio.say('kestrel', 'Outstanding flying, Fob! That\'s a clear!');
  if (G.attract) later(4, () => Attract.next());
}
function updateClear(dt) {
  if (G.clearT >= 0 && !G.cleared) {
    G.clearT += dt;
    G.tScale = G.clearT < 3.4 ? 0.4 : 1;
  }
  if (!G.cleared) return;
  const pl = G.pl;
  G.clearFly += dt; G.tScale = 1;
  const sp = 50 + G.clearFly * 70;
  if (G.def.mode === 'rail') {
    // ship streaks ahead of the (frozen) rail
    pl.oz = (pl.oz || 0) - sp * dt; pl.pos.z -= sp * dt; pl.oy += dt * 4 * Math.min(1, G.clearFly); pl.vel.set(0, 0, -sp);
    pl.mesh.position.copy(pl.pos);
    pl.mesh.rotation.set(0.12, 0, pl.rollT > 0 ? -TAU * easeInOut(1 - pl.rollT / 0.62) : 0, 'YXZ');
  } else {
    pl.pos.addScaledVector(pl.aim, sp * dt); pl.mesh.position.copy(pl.pos);
    pl.rollT = Math.max(0, pl.rollT - dt);
  }
  FX_engine(pl, true);
  if (G.clearFly > 5.4 && G.mode === 'play' && !G.attract) showResults();
}
function computeResults() {
  const spawned = Math.max(1, G.totalSpawnedHittable);
  const pct = clamp(G.stageHits / spawned, 0, 1);
  const medal = G.stageHits >= G.def.medalHits;
  const timeBonus = Math.max(0, Math.round((300 - G.stageTime) * 10));
  const survive = G.stats.deaths === 0 ? 1500 : 0;
  const wingBonus = G.wing.filter((w) => w.state === 'ok').length * 400;
  const total = Math.round(G.stageScore + timeBonus + survive + wingBonus);
  const grade = pct >= 0.85 ? 'S' : pct >= 0.7 ? 'A' : pct >= 0.5 ? 'B' : 'C';
  return { hits: G.stageHits, spawned, pct, medal, timeBonus, survive, wingBonus, total, grade, time: G.stageTime, stats: G.stats, gold: G.gold, wingAlive: G.wing.filter((w) => w.state === 'ok').length, rescues: G.stats.rescues };
}
function showResults() {
  const res = computeResults();
  G.results = res;
  G.score += res.timeBonus + res.survive + res.wingBonus;
  const b = SAVE.best[G.stageId] || 0;
  if (G.score > b) SAVE.best[G.stageId] = G.score;
  if (res.medal) SAVE.medals[G.stageId] = true;
  saveGame();
  if (G.stageId === 's1') G.campaign.route = G.flags.route === 'b' ? 'b' : 'a';
  G.mode = 'results';
  UI.open('results');
}
function nextAfterResults() {
  const id = G.stageId;
  G.carryOver();
  if (id === 's1') {
    if (G.campaign.route === 'b') UI.open('branch'); else startStage('s2a', { carry: true, keepLives: true });
  } else if (id === 's2a' || id === 's2b') startStage('s3', { carry: true, keepLives: true });
  else { G.mode = 'ending'; Music.play('title'); UI.open('ending'); }
}
G.carryOver = function () {
  const pl = G.pl;
  G.carry = { maxHp: Math.min(pl.maxHp, 125), bombs: Math.max(3, pl.bombs), laser: pl.laser };
  return G.carry;
};

// ---------------------------------------------------------------- attract-mode AI (cheats freely)
const AI = {
  chT: 0, chOn: false, rollCd: 0, boostT: 0, bombCd: 5, manCd: 0,
  act(dt) {
    const a = emptyAct(), pl = G.pl;
    if (!pl || pl.dead) return a;
    this.rollCd -= dt; this.bombCd -= dt; this.manCd -= dt; this.chT += dt;
    if (G.def.mode === 'rail') this.rail(a, dt, pl); else this.ar(a, dt, pl);
    return a;
  },
  pickTarget(pl) {
    let best = null, bd = 1e9;
    for (const e of G.ents) {
      if ((e.cat !== 'enemy' && e.cat !== 'part') || !e.alive || !e.lockable) continue;
      if (e.shield && e.shield(e)) continue;
      if (G.def.mode === 'rail' && e.pos.z > pl.pos.z - 10) continue;
      const d = e.pos.distanceTo(pl.pos);
      if (d < bd && d < 320) { bd = d; best = e; }
    }
    return best;
  },
  rail(a, dt, pl) {
    const t = this.pickTarget(pl), rail = G.rail;
    let tx = Math.sin(G.t * 0.7) * 14, ty = 2 + Math.sin(G.t * 1.1) * 6;
    if (t) { tx = t.pos.x - rail.px; ty = t.pos.y - rail.py; }
    // dodge solid obstacles / thread gates
    for (const e of G.ents) {
      if (e.cat !== 'obst' || !e.alive || e.hp < 900) continue;
      const dz = pl.pos.z - e.pos.z;
      if (e.kind === 'gateBar') {
        if (e.visual && dz > -5 && dz < 130) { tx = e.mesh.position.x - rail.px; ty = e.mesh.position.y - rail.py; }
        continue;
      }
      if (dz > -5 && dz < 85) {
        const hw = (e.w || e.r * 2 || 6) / 2 + 7, hh = (e.h || e.r * 2) / 2 + 5;
        if (Math.abs(e.pos.x - pl.pos.x) < hw && Math.abs(e.pos.y - pl.pos.y) < hh) {
          if (e.w > 20 && (e.h || 0) < 8) ty = e.pos.y + (pl.pos.y > e.pos.y ? hh + 3 : -hh - 3) - rail.py;
          else tx = e.pos.x + (pl.pos.x >= e.pos.x ? hw + 2 : -hw - 2) - rail.px;
        }
      }
    }
    a.move.x = clamp((tx - pl.ox) * 0.22, -1, 1); a.move.y = clamp((ty - pl.oy) * 0.22, -1, 1);
    a.fire = true;
    // charge/lock cycle
    const cyc = this.chT % 12;
    const want = cyc > 8 && cyc < 9.6;
    if (want && !this.chOn) { a.chargeDown = true; this.chOn = true; }
    if (!want && this.chOn) { a.chargeUp = true; this.chOn = false; }
    a.charge = this.chOn;
    // roll when shots are about to hit
    if (this.rollCd <= 0) {
      for (const b of G.ebs) { if (!b.decor && b.pos.distanceTo(pl.pos) < 24 && b.vel.z > 0) { if (Math.random() < 0.5) a.rollL = true; else a.rollR = true; this.rollCd = 2.2; break; } }
    }
    // bomb on crowds / boss
    const crowd = G.ents.filter((e) => e.cat === 'enemy' && e.alive && e.pos.z < pl.pos.z && pl.pos.z - e.pos.z < 200).length;
    if (this.bombCd <= 0 && (crowd >= 6 || (G.boss && G.boss.t > 6))) { a.bomb = true; this.bombCd = G.boss ? 14 : 9; }
    this.boostT -= dt; if (this.boostT < -12) this.boostT = 2.5;
    a.boost = this.boostT > 0 ? 1 : 0;
  },
  ar(a, dt, pl) {
    const t = (() => {
      let best = null, bd = 1e9;
      const boss = G.boss;
      for (const e of G.ents) {
        if (!e.alive || !(e.cat === 'enemy' || e.cat === 'part') || !e.lockable) continue;
        if (e.shield && e.shield(e)) continue;
        const d = e.pos.distanceTo(pl.pos) - (e.cat === 'part' ? 40 : 0) - (e.onTail ? 100 : 0);
        if (d < bd) { bd = d; best = e; }
      }
      return best;
    })();
    a.fire = true;
    if (!t) { a.move.x = Math.sin(G.t * 0.4) * 0.4; return; }
    const inv = pl.q.clone().invert();
    const l = t.pos.clone().sub(pl.pos).applyQuaternion(inv);
    const dist = l.length();
    const behind = l.z > 0;
    const norm = Math.max(25, Math.abs(l.z));
    a.move.x = behind ? (l.x >= 0 ? 1 : -1) : clamp(l.x / norm * 3.2, -1, 1);
    a.move.y = behind ? 0.3 : clamp(l.y / norm * 3.2, -1, 1);
    if (behind && dist > 60 && this.manCd <= 0 && !pl.man) { a.maneuver = true; a.move.y = -1; a.uturnHeld = true; this.manCd = 4; }
    else if (G.ents.some((e) => e.kind === 'bandit' && e.onTail) && this.manCd <= 0 && !pl.man) { a.maneuver = true; this.manCd = 5; }
    if (G.boss && dist < 70) a.brake = 0.8; // don't ram the hull
    if (this.bombCd <= 0 && G.ents.filter((e) => e.kind === 'bandit' && e.alive && e.pos.distanceTo(pl.pos) < 90).length >= 4) { a.bomb = true; this.bombCd = 10; }
    if (this.rollCd <= 0) { for (const b of G.ebs) { if (!b.decor && b.pos.distanceTo(pl.pos) < 22) { a.rollL = Math.random() < 0.5; a.rollR = !a.rollL; this.rollCd = 2.5; break; } } }
    const cyc = this.chT % 14;
    const want = cyc > 9 && cyc < 10.6 && !behind;
    if (want && !this.chOn) { a.chargeDown = true; this.chOn = true; }
    if (!want && this.chOn) { a.chargeUp = true; this.chOn = false; }
    a.charge = this.chOn;
  },
};

const Attract = {
  active: false, idx: 0, t: 0, seq: ['s1', 's2a', 's3', 's2b'], skipped: false, startedAt: 0,
  start() {
    this.active = true; G.attract = true; G.cheat = true; this.idx = 0; this.startedAt = performance.now();
    G.score = 0; G.lives = 99;
    this.load();
    $('#attract').classList.add('on');
  },
  load() {
    this.t = 0; this.skipped = false; this.pending = false;
    startStage(this.seq[this.idx % this.seq.length], { keepLives: true });
    G.mode = 'attract'; G.lives = 99; G.cheat = true; G.attract = true;
    AI.chT = 0; AI.bombCd = 6; AI.manCd = 3;
  },
  next() {
    if (this.pending) return;
    this.pending = true;
    UI.fade(() => { this.idx++; this.load(); });
  },
  update(dt) {
    this.t += dt;
    const def = G.def;
    if (!this.skipped && !G.boss) {
      if (def.mode === 'rail' && this.t > 26) { this.skipped = true; this.skipToBoss(); }
      if (def.mode === 'ar' && this.t > 24) { this.skipped = true; G.arKills = G.arTarget; }
    }
    if (this.t > 95) this.next();
    // cheat: keep the shield topped up and bombs stocked
    const pl = G.pl;
    if (pl && !pl.dead) { pl.hp = pl.maxHp; if (pl.bombs < 3) pl.bombs = 3; }
  },
  skipToBoss() {
    const def = G.def, pl = G.pl;
    for (const e of G.ents) removeEnt(e);
    G.ents.length = 0;
    for (const b of G.ebs) { Phys.remove(b); G.world.remove(b.mesh); }
    G.ebs.length = 0;
    const target = def.bossAt - 40;
    G.rail.s = target; G.rail.px = pathX(target); G.rail.py = pathY(target); G.rail.pos.set(G.rail.px, G.rail.py, -target);
    for (const ev of G.events) if (ev.at < def.bossAt) ev.done = true;
    pl.pos.set(G.rail.px + pl.ox, G.rail.py + pl.oy, -target);
    R.camera.userData.init = false;
    pl.laser = 3; pl.bombs = 5;
    HUD.toast('DEMO: JUMP TO BOSS', 'good', 1.2);
  },
  stop() {
    this.active = false; G.attract = false; G.cheat = false;
    $('#attract').classList.remove('on');
  },
};

// ---- 62_ui.js
// ===================================================================
//  UI  -  controller-first menus (focus list, big targets, glyph prompts, mouse mirrors the pad)
// ===================================================================
const UI = {
  root: null, stack: [], cur: null, focus: 0, active: false, gateOn: false, scrollEl: null, canvasStick: null,
  init() { this.root = $('#ui'); },
  hideAll() { this.scrollEl = null; this.stack.length = 0; this.cur = null; this.active = false; this.root.innerHTML = ''; this.root.classList.remove('on'); },
  reset(id, data) { this.stack.length = 0; this.open(id, data); },
  open(id, data) {
    const def = SCREENS[id](data || {});
    def.id = id; def.data = data;
    this.stack.push(def);
    this.show(def);
  },
  back() {
    const top = this.stack[this.stack.length - 1];

    if (top.onBack) { top.onBack(); return; }
    this.stack.pop();
    Snd.play('uiBack', { vol: 0.8 });

    else this.hideAll();
  },
  show(def) {
    this.scrollEl = null;

    const s = el('div', 'screen ' + (def.cls || '')); this.root.appendChild(s);

    if (def.title) s.appendChild(el('h1', '', def.title));
    if (def.sub) s.appendChild(el('div', 'sub', def.sub));
    if (def.build) def.build(s, def);
    if (def.items && def.items.length) {
      const m = el('div', 'menu'); s.appendChild(m);
      def.items.forEach((it, i) => {
        const d = el('div', 'item ' + (it.type || 'button') + (it.disabled ? ' disabled' : ''));
        d.innerHTML = `<span class="lab">${it.label}</span><span class="val"></span>`;
        d.addEventListener('mouseenter', () => { if (this.focus !== i && !it.disabled) { this.focus = i; this.refresh(); Snd.play('uiMove', { vol: 0.5 }); } });
        d.addEventListener('click', (ev) => { this.focus = i; if (it.type === 'slider' || it.type === 'choice') { const r = d.getBoundingClientRect(); this.adjust(ev.clientX > r.left + r.width * 0.62 ? 1 : ev.clientX < r.left + r.width * 0.38 ? -1 : 1); } else this.activate(); });
        m.appendChild(d); it.el = d;

    const f = el('div', 'footer'); s.appendChild(f);
    def.footEl = f; def.descEl = $('.desc', s); def.scr = s;
    this.refresh();
    if (def.onShow) def.onShow(def);
  },
  refresh() {
    const def = this.cur; if (!def) return;
    const g = glyphSet();
    if (def.items) {
      while (def.items[this.focus] && def.items[this.focus].disabled) this.focus = (this.focus + 1) % def.items.length;
      def.items.forEach((it, i) => {
        it.el.classList.toggle('focus', i === this.focus);
        const v = $('.val', it.el);
        if (it.type === 'toggle') v.innerHTML = `<span class="tg ${it.get() ? 'on' : ''}">${it.get() ? 'ON' : 'OFF'}</span>`;
        else if (it.type === 'slider') { const val = it.get(); const pct = (val - it.min) / (it.max - it.min); v.innerHTML = `<span class="arr">◀</span><span class="sl"><i style="width:${pct * 100}%"></i></span><span class="arr">▶</span><span class="sv">${it.fmt ? it.fmt(val) : Math.round(val * 100) + '%'}</span>`; }
        else if (it.type === 'choice') { const c = it.choices.find((x) => x[0] === it.get()) || it.choices[0]; v.innerHTML = `<span class="arr">◀</span><span class="cv">${c[1]}</span><span class="arr">▶</span>`; }
        else v.textContent = it.value ? it.value() : '';
      });
      const it = def.items[this.focus];
      def.descEl.textContent = it && it.desc ? (typeof it.desc === 'function' ? it.desc() : it.desc) : (def.desc || '');
    }
    const adj = def.items && def.items[this.focus] && ['slider', 'choice', 'toggle'].includes(def.items[this.focus].type);
    def.footEl.innerHTML = def.footer ? def.footer(g) : `<span><b>${g.confirm}</b> ${adj ? 'Change' : 'Select'}</span>${adj ? '<span><b>◀ ▶</b> Adjust</span>' : ''}<span><b>▲ ▼</b> Move</span>${def.noBack ? '' : `<span><b>${g.back}</b> Back</span>`}`;
    if (def.onRefresh) def.onRefresh(def);
  },
  activate() {
    const it = this.cur && this.cur.items && this.cur.items[this.focus];
    if (!it || it.disabled) return;
    if (it.type === 'toggle') { it.set(!it.get()); this.changed(); Snd.play('uiConfirm', { vol: 0.7 }); }
    else if (it.type === 'choice') this.adjust(1);
    else if (it.type === 'slider') this.adjust(1);
    else { Snd.play('uiConfirm'); if (it.onSelect) it.onSelect(); }
    if (this.cur && this.cur.items) this.refresh();
  },
  adjust(dir) {
    const it = this.cur && this.cur.items && this.cur.items[this.focus];
    if (!it) return;
    if (it.type === 'slider') { const v = clamp(Math.round((it.get() + dir * it.step) / it.step) * it.step, it.min, it.max); it.set(+v.toFixed(3)); this.changed(); Snd.play('uiMove', { vol: 0.6 }); }
    else if (it.type === 'choice') { const i = it.choices.findIndex((x) => x[0] === it.get()); it.set(it.choices[(i + dir + it.choices.length) % it.choices.length][0]); this.changed(); Snd.play('uiMove', { vol: 0.6 }); }
    else if (it.type === 'toggle') { it.set(!it.get()); this.changed(); Snd.play('uiMove', { vol: 0.6 }); }
    this.refresh();
  },
  changed() { applySettings(); },
  fade(cb) {
    const f = $('#fade'); f.classList.add('on');
    setTimeout(() => { cb(); setTimeout(() => f.classList.remove('on'), 120); }, 380);
  },
  update(dt) {
    const def = this.cur; if (!def || !this.active) return;
    const nv = Input.nav;
    if (def.update) def.update(dt, def);
    if (this.scrollEl) { if (nv.up) this.scrollEl.scrollTop -= 90; if (nv.down) this.scrollEl.scrollTop += 90; }
    else if (def.items && def.items.length) {
      if (nv.up || nv.down) {
        const d = nv.up ? -1 : 1; let n = this.focus;
        for (let k = 0; k < def.items.length; k++) { n = (n + d + def.items.length) % def.items.length; if (!def.items[n].disabled) break; }
        if (n !== this.focus) { this.focus = n; this.refresh(); Snd.play('uiMove', { vol: 0.7 }); }
      }
      if (nv.left) this.adjust(-1);
      if (nv.right) { const it = def.items[this.focus]; if (it && ['slider', 'choice', 'toggle'].includes(it.type)) this.adjust(1); }
      if (nv.confirm) this.activate();
    } else if (nv.confirm && def.onConfirm) def.onConfirm();
    if (nv.back) this.back();
    // glyph label refresh when the input device changes
    const dv = Input.device + (Input.isPS ? 'p' : '');
    if (dv !== this._dv) { this._dv = dv; this.refresh(); }
  },
};

function escHtml(s) { return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function ABOUT_HTML() {
  return ABOUT_TEXT.split('\n').map((line) => {
    if (line.startsWith('## ')) return `<h2>${escHtml(line.slice(3))}</h2>`;
    if (!line.trim()) return '';
    const body = line.startsWith('- ') ? line.slice(2) : line;
    const m = body.match(/^([^:?]{2,90}[:?])\s(.*)$/);
    return line.startsWith('- ') && m ? `<p class="b"><b>${escHtml(m[1])}</b> ${escHtml(m[2])}</p>` : `<p>${escHtml(body)}</p>`;
  }).join('');
}

// ---------------------------------------------------------------- per-frame game update
const _shakeOff = new V3();
function updateEnts(dt) {
  const rail = G.rail, railMode = G.def.mode === 'rail';
  for (const e of G.ents) {
    if (!e.alive) continue;
    e.prev = e.prev || e.pos.clone();
    e.prev.copy(e.pos);
    if (e.flash > 0) { e.flash -= dt; flashMats(e); e.fl = true; } else if (e.fl) { e.fl = false; flashMats(e); }
    if (e.def.update) e.def.update(e, dt);
    if (!e.alive) continue;
    if (e.mode === 'rel') e.pos.copy(rail.pos).add(e.rel);
    if (e.def.orient) {
      e.vel.copy(e.pos).sub(e.prev).divideScalar(Math.max(dt, 1e-4));
      if (e.vel.lengthSq() > 4 && e.mesh) { _v1.copy(e.vel).normalize(); faceDir(e.mesh, _v1); }
    }
    if (e.mesh && !e.static) e.mesh.position.copy(e.pos);
    if (e.body && !e.static) Phys.move(e);
    if (railMode && e.mode === 'world' && !e.isPartOfBoss && e.cat !== 'part' && e.kind !== 'chaser' && e.pos.z > rail.pos.z + 70) { e.alive = false; e.silent = true; }
  }
  for (let i = G.ents.length - 1; i >= 0; i--) if (!G.ents[i].alive) { removeEnt(G.ents[i]); G.ents.splice(i, 1); }
  const pl = G.pl;
  if (pl) pl.locks = pl.locks.filter((t) => t.alive);
}

function updateCameraClear(dt) {
  const pl = G.pl, cam = R.camera;
  const a = 2.2 + G.clearFly * 0.55;
  _camT.set(pl.pos.x + Math.sin(a) * 15, pl.pos.y + 3.5 + Math.sin(G.clearFly) * 1.5, pl.pos.z + Math.cos(a) * 15 + (G.def.mode === 'rail' ? 0 : 0));
  cam.position.lerp(_camT, 1 - Math.exp(-3 * dt));
  cam.lookAt(pl.pos);
  cam.fov = damp(cam.fov, S.fov, 4, dt); cam.updateProjectionMatrix();
}

function updateGame(rdt, act, passive = false) {
  const dt = rdt * G.tScale;
  const pl = G.pl, railMode = G.def.mode === 'rail';
  G.t += dt; if (!G.cleared) G.stageTime += dt;
  Tweens.update(dt);
  for (let i = G.later.length - 1; i >= 0; i--) { const l = G.later[i]; l.t -= dt; if (l.t <= 0) { G.later.splice(i, 1); l.fn(); } }
  G.comboT -= dt; if (G.comboT <= 0) G.combo = 0;
  if (!pl.engine && Snd.ready && !G.attract && !passive) pl.engine = Snd.engine();
  if (pl.engine) pl.engine.set(railMode ? G.rail.scale : pl.speed / 60, pl.boosting ? 1 : 0);
  if (railMode) updatePlayerRail(dt, act); else updatePlayerAR(dt, act);
  if (!G.cleared) updateDirector(dt);
  Terrain.update(G.rail.s, R.camera.position);
  updateBoss(dt);
  updateEnts(dt);
  updateWingmen(dt);
  updatePBs(dt); updateEBs(dt); updateBombs(dt); updateBeams(dt);
  if (pl.body) Phys.move(pl);
  Phys.step(dt, onContact);
  handleDeath(rdt);
  updateClear(rdt);
  // camera
  R.camera.position.sub(_shakeOff);
  if (G.camMode === 'clear') updateCameraClear(dt); else if (railMode) updateCameraRail(dt); else updateCameraAR(dt);
  const sh = R.shake * S.shake;
  _shakeOff.set(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).multiplyScalar(sh * 1.1);
  R.camera.position.add(_shakeOff);
  R.shake = damp(R.shake, 0, 5, dt);
  FX.update(dt);
  followScene(pl.pos);
  HUD.update(rdt);
  if (G.attract) Attract.update(rdt);
}
function followScene(focus) {
  const cam = R.camera;
  R.sky.position.copy(cam.position); R.stars.position.copy(cam.position);
  R.focus.copy(focus);
  R.sun.position.copy(focus).add(R.sunOffset || _v1.set(60, 100, 40));
  R.sun.target.position.copy(focus);
}

// ---------------------------------------------------------------- pause / frame
function pauseGame() {
  if (G.mode !== 'play' || G.paused || G.deadT >= 0 || G.cleared) return;
  G.paused = true;
  if (G.pl.chargeSnd) { G.pl.chargeSnd.stop(); G.pl.chargeSnd = null; G.pl.charging = false; }
  UI.reset('pause'); UI.ignoreNav = true;
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
addEventListener('gamepaddisconnected', () => pauseGame());

let lastT = performance.now();
function tick(dt) {
  Input.poll(dt);
  if (!G.def) return;
  switch (G.mode) {
    case 'title': {
      TitleScene.update(dt);
      followScene(R.focus);
      FX.update(dt);
      const touch = Input.touchOnly();
      if (touch !== UI.gateOn) { UI.gateOn = touch; UI.reset(touch ? 'gate' : 'title'); }
      UI.update(dt);
      if (!UI.gateOn && performance.now() - Input.lastActivity > 10000) { UI.hideAll(); Attract.start(); }
      break;
    }
    case 'attract': {
      updateGame(dt, AI.act(dt));
      if (Input.lastActivity > Attract.startedAt + 150) { UI.fade(() => enterTitle()); Attract.active = false; G.mode = 'attract-exit'; }
      break;
    }
    case 'attract-exit': FX.update(dt); break;
    case 'play': {
      if (G.paused) { followScene(G.pl.pos); if (Input.act.pause && UI.stack.length <= 1) resumeGame(); else UI.update(dt); }
      else {
        if (Input.act.pause) { pauseGame(); UI.update(dt); }
        else updateGame(dt, Input.act);
      }
      break;
    }
    default: { // results, gameover, ending: world keeps drifting behind the menu
      if (G.pl) updateGame(dt, emptyAct(), true);
      UI.update(dt);
    }
  }
}
function frame() {
  const now = performance.now();
  let dt = (now - lastT) / 1000; lastT = now;
  dt = Math.min(dt, 0.05);
  try { tick(dt); } catch (e) { console.error(e); if (!frame.err) { frame.err = true; showFatal('Runtime error: ' + (e && e.message ? e.message : e), true); } }
  renderFrame();
}
// UI.ignoreNav support (skip the frame that opened a menu so the same press does not close it)
const _uiUpdate = UI.update.bind(UI);
UI.update = function (dt) { if (this.ignoreNav) { this.ignoreNav = false; return; } _uiUpdate(dt); };
const _uiShow = UI.show.bind(UI);
UI.show = function (def) { this.ignoreNav = true; _uiShow(def); };
const _uiOpen = UI.open.bind(UI);
UI.open = function (id, data) { if (this.cur) this.cur.focus = this.focus; _uiOpen(id, data); };

function showFatal(msg, soft) {
  const f = $('#fatal');
  f.innerHTML = `<div class="fbox"><h2>${soft ? 'Something went wrong' : 'Cannot start STARFOB 64'}</h2><p>${escHtml(String(msg))}</p>${soft ? '' : '<p>This game requires a browser with WebGPU (recent Chrome / Edge / Safari Technology Preview) — there is no fallback renderer.</p>'}</div>`;
  f.classList.add('on');
}

async function boot() {
  UI.init();
  document.documentElement.style.setProperty('--hud', S.hudScale);
  if (Input.touchOnly()) { UI.reset('gate'); UI.gateOn = true; }
  const boot = $('#boot');
  try {
    boot.querySelector('p').textContent = 'Starting WebGPU renderer…';
    await initRenderer($('#gpu'));
    boot.querySelector('p').textContent = 'Starting physics…';
    await Phys.init();
  } catch (e) {
    console.error(e);
    boot.classList.add('off');
    showFatal(e && e.message ? e.message : e);
    return;
  }
  G.world = new THREE.Group(); R.scene.add(G.world);
  HUD.init();
  applySettings();
  boot.classList.add('off');
  enterTitle();
  lastT = performance.now();
  R.renderer.setAnimationLoop(frame);
}
boot();

</script>
</body>
