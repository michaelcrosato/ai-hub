<script>
/*!
my-3D2dge AGENT EDITION v0.11.0 + ENCORE FORK: the essential engine in one file, for AI coding agents
(fork notes: see "Encore fork additions" at the end of this header)
https://github.com/michaelcrosato/my-3d2dge (MIT License)

Retro-modern 2D games drawn entirely by code: no image or sound files, no dependencies, no network.
This is a curated subset of the full engine (dist/my-3d2dge.js). A game written against this file runs
unchanged on the full engine, which adds lighting, props, parallax backdrops, touch controls, camera
zoom and turn, dialog portraits, x-ray silhouettes and more.

AGENTS: this header is the whole manual. Build games from it; you do not need to read the code below.
Read a section only to debug: each starts with "// ---- N. NAME" (grep "// ---- 10." for the Humanoid).

## Host it
<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}
#screen{width:100%;height:100%;display:block;image-rendering:pixelated}</style></head>
<body><canvas id="screen"></canvas><script src="my-3d2dge-agent.js"><\/script><script src="game.js"><\/script></body></html>
For a single-file game, paste both scripts inline. Start every game with: const E = My3D2dge;

## Mental model
- The world is 3D: x east, y south, z up; one tile = 16 units. Game logic uses world units and dt, never pixels.
- A view projects the world to the screen. 'iso' (Diablo), 'threequarter' (Zelda), 'topdown', 'brawler' (Final
  Fight), 'side' (Mario: x right, z up, y = 0), 'overhead' (shmups, puzzles: world x/y = screen pixels once you call
  game.focus(W / 2, H / 2)). The same game runs in every view. In ground views, turn the stick or keys into a world
  direction with game.view.screenDirToGround(mx, my).
- update(dt) runs in fixed steps of about 1/120 s. Read input only there.
- draw(r) order: backgrounds first (r.sky, map.drawFloor + map.queueWalls, level.draw), then everything that can
  overlap through r.actor / r.sprite / r.queue (depth sorted), then the HUD through r.text / r.overlay (screen pixels).
- Characters are procedural rigs posed every step (E.Humanoid, E.Blob) or string sprites (E.sprite).
- Draw only with E.px, E.font, E.ui and r.*: they snap to whole pixels. ctx.arc / stroke / fillText and canvas
  gradients blur the pixel look.
- Errors show in a red box on screen and in the console; warnings start with "my-3D2dge:". Fix the first one first.

## Quick start: a complete game (title, play, win or lose)
```js quickstart
(() => {
const E = My3D2dge;
const game = new E.Game({ canvas: 'screen', res: 'ps1', view: 'threequarter', views: ['threequarter', 'iso', 'topdown'] });
const map = new E.TileMap({
  rows: ['################',
         '#@.....#.......#',
         '#......#...s...#',
         '#..s.......##..#',
         '#......~~.....s#',
         '################'],
  legend: { '#': 1, '@': 'hero', s: 'slime', '~': { floor: 'water', block: true } },   // number = wall type, string = spawn tag
  types: { 1: { h: 28, top: '#7a7090', side: '#4a4560', cut: true } },   // cut: walls in front of the floor drop low
  floorTex: (x, y, tag) => tag === 'water' ? E.tex.water(x, y) : E.tex.grass(x, y)
});
const flow = new E.FlowField(map);
let hero, rig, sword, slimes, hp, msg = '';
const title = {
  update() { if (game.input.pressed('start')) game.go('play'); },
  draw(r) {
    r.sky(['#101848', '#5a3a80']);
    r.overlay(g => E.font.title(g, 'SLIME FIELD', r.W / 2, 70, { scale: 3, align: 'center' }));
    r.text('PRESS ENTER', r.W / 2, 150, '#ffffff', { align: 'center', shadow: '#000', outline: false });
  }
};
const play = {
  pausable: true,
  enter() {
    const s = map.find('hero');
    hero = new E.Body({ x: s.x, y: s.y, r: 5 }); hero.facing = 0; hero.hurt = 0; hp = 3;
    rig = new E.Humanoid({ size: 1.3, outfit: 'tunic', hat: 'cap', colors: { cloth: '#3a8a4a', hair: '#e0b040' } });
    sword = new E.Attack('slash');
    slimes = map.findAll('slime').map(p => ({ body: new E.Body({ x: p.x, y: p.y, r: 6 }), rig: new E.Blob(), hp: 3, hit: 0 }));
    game.cam.bounds = v => map.bounds(v); game.follow(hero);
    game.audio.music('adventure');
  },
  update(dt) {
    const inp = game.input, m = inp.move(), d = game.view.screenDirToGround(m[0], m[1]);   // screen push -> ground direction
    hero.vx = d[0] * 85; hero.vy = d[1] * 85; hero.update(dt, map);
    if (Math.hypot(d[0], d[1]) > .1) hero.facing = Math.atan2(d[1], d[0]);
    if (inp.buffered('attack') && sword.start()) { inp.consume('attack'); game.audio.sfx('swing'); }
    sword.update(dt);
    sword.hits(slimes, s => E.inArc(hero, hero.facing, s.body, 24, 1.3), s => {
      s.hp--; s.hit = .15; E.knockback(hero, s.body, 200, 80);
      game.hitFx(s.body.x, s.body.y, 8, { damage: 1, angle: hero.facing });
    });
    flow.update(hero.x, hero.y); hero.hurt -= dt;
    for (const s of slimes) {
      const dir = flow.dir(s.body.x, s.body.y, hero.x, hero.y);
      s.body.vx = E.approach(s.body.vx, dir[0] * 30, 300 * dt); s.body.vy = E.approach(s.body.vy, dir[1] * 30, 300 * dt);
      s.body.update(dt, map); s.hit -= dt;
      s.rig.update(dt, { look: dir, squash: Math.sin(game.time * 9 + s.body.x) * .15 });
      if (E.overlap(hero, s.body) && hero.hurt <= 0) { hp--; hero.hurt = 1; E.knockback(s.body, hero, 220); game.audio.sfx('hurt'); game.shake(3); }
      if (s.hp <= 0) game.particles.explosion(s.body.x, s.body.y, 6, .7);
    }
    E.prune(slimes, s => s.hp <= 0);
    rig.update(dt, { x: hero.x, y: hero.y, z: hero.z, vx: hero.vx, vy: hero.vy, facing: hero.facing, attack: sword.state, hurt: hero.hurt > .7 });
    if (hp <= 0) game.go('end', 'GAME OVER'); else if (!slimes.length) game.go('end', 'YOU WIN');
  },
  draw(r) {
    map.drawFloor(r); map.queueWalls(r);                                   // background first, then depth-sorted things
    r.shadow(hero.x, hero.y, 6);
    r.actor(hero.x, hero.y, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view), { alpha: hero.hurt > 0 ? .6 : 1 });
    for (const s of slimes) {
      r.shadow(s.body.x, s.body.y, 6);
      r.actor(s.body.x, s.body.y, s.body.z, (g, ox, oy) => s.rig.draw(g, ox, oy, r.view), { flash: s.hit > 0 && '#ffffff' });
    }
    r.overlay(g => E.ui.hearts(g, 6, 6, hp, 3));                        // HUD in screen pixels
  }
};
const end = {
  enter(text) { msg = text; game.audio.music(null); game.audio.sfx(text === 'YOU WIN' ? 'powerup' : 'die'); },
  update() { if (game.input.pressed('start')) game.go('title'); },
  draw(r) { r.sky(['#000000', '#301830']); r.text(msg, r.W / 2, 100, '#ffe08a', { align: 'center', scale: 2 }); }
};
game.start({ scene: 'title', scenes: { title, play, end } });
})();
```

## API
Game: new E.Game({ canvas: 'screen', res, view, views, input, bg })
  res: 'nes' 256x240 | 'snes' 256x224 | 'genesis' 320x224 | 'gb' 160x144 | 'gba' 240x160 | 'ps1' 320x240 | 'wide' 400x225 | [w, h]
  input: 'DEFAULT' | 'PLATFORMER' | 'SHMUP' | your own { action: ['KeyQ', 'Pad0', 'Mouse0'] }
  start({ update(dt), draw(r) }) or start({ scene: 'title', scenes: { title: {...}, play: {...} } })
  scene: { enter(data), exit(), update(dt), draw(r), pausable, view, views, input, res }; go(name, data, { fade: .22 })
  camera: follow(obj, { z: 16, lead }) once, or focus(x, y, z) every update; cam.bounds = v => map.bounds(v);
    cam.room = [w, h] for screen-by-screen rooms (cam.moving is true while it slides); cam.smooth = .18 (0 = locked)
  juice: hitFx(x, y, z, { power: 1, damage, angle, color, sound }), freeze(s), shake(n), flash(color, s), timeScale = .25
  timers in game time: after(s, fn), every(s, fn) -> { cancel() }, cleared on scene change
  also: setView(id), nextView() (cycles views), note(text, s), mouseGround() -> [x, y] or null
  fields: W, H, time, real, paused, input, audio, particles, view, cam, errors
Input (game.input): down(a) held, pressed(a) this step only, released(a), repeat(a, delay .3, rate .08) for menus,
  buffered(a, window .15) + consume(a) for combat, consumeAll(), anyPressed(), move() -> [x, y] on screen (length <= 1)
  every preset: up down left right (WASD, arrows, d-pad), start (Enter), pause (Esc, P), confirm (Enter, Space, J, Z),
    cancel (Esc, Backspace, X, K); the gamepad d-pad, A, B and Start work too, and its left stick moves
  DEFAULT: attack (J, X, click), dash (Space, Shift, K), skill (L, E, right click), jump (Z)
  PLATFORMER: jump (Space, Z, K), attack (X, J, click), dash (Shift, C, L), skill (E, V)
  SHMUP: fire (Space, Z, J, click), bomb (X, K, right click)
Drawing (r in draw(r); r.W, r.H = screen size in pixels)
  r.sky(['#top', '#mid', '#bottom']); r.starfield({ count: 70, speed: 30, dir: 'down' | 'up' | 'left' | 'right', height: 0..1 })
  r.actor(x, y, z, (g, ox, oy) => rig.draw(g, ox, oy, r.view), { outline: true, flash: '#ffffff', flashMix: .5, alpha, bias })
  r.sprite(x, y, z, spr, { anchor: 'bottom' | 'center' | 'top', flip, flash, outline, alpha })
  r.queue(x, y, z, g => {...}, { bias }) for any depth-sorted drawing; inside it r.box(g, x0, y0, z0, x1, y1, z1, top, side)
  r.shadow(x, y, radius, alpha .5, color, surfaceZ); floor marks: r.decal(() => r.groundDisc(x, y, rad, color, alpha)),
    r.groundRing(x, y, rad, color, alpha), r.groundArc(x, y, r0, r1, a0, a1, color, alpha)
  r.text(str, x, y, color, opts); r.textAt(x, y, z, str, color); r.overlay(g => {...}); r.glowDisc(g, x, y, rad, color, 0..1)
  r.w(x, y, z) -> [px, py] where a world point lands; r.visible(x, y, z); r.view
Pixels (g is a canvas context from r.queue, r.overlay or r.actor): E.px.rect(g, x, y, w, h, c), dot(g, x, y, c),
  line(g, x0, y0, x1, y1, c, width), disc(g, x, y, r, c), ell(g, x, y, rx, ry, c), poly(g, [[x, y], ...], c),
  polyDither(g, pts, c, alpha), ddisc(g, x, y, r, c, alpha), blend(g, alpha, 'add' | 'multiply' | 'screen' | 'normal', () => {...}),
  sprite(g, spr, x, y, flip). Colors are '#rrggbb' or '#rgb'.
Sprites: const COIN = E.sprite(['.yy.', 'yYYy', '.yy.'], { y: '#f0b020', Y: '#fff0a0' }, scale); '.' and ' ' are clear
Text: E.font.text(g, str, x, y, color, { outline: '#0b0814' | false, shadow, gradient: [top, bottom], scale, align, wrap: px })
  -> { w, h }; E.font.title(g, str, x, y, { scale: 3, colors: [top, ..., bottom], depth, align }); E.font.width(str, opts),
  lineHeight(opts), wrap(str, px). A 5x7 font with lower case and ♥ ★ ← → ↑ ↓ • × ♪ ▸ ©
UI (draw inside r.overlay): E.ui.box(g, x, y, w, h, { bg, border, alpha }), E.ui.bar(g, x, y, w, h, 0..1, color),
  E.ui.hearts(g, x, y, hp, max) (halves allowed)
  const talk = new E.Dialog(game); talk.say(['Page one.', 'Page two.'], { name: 'ELDER', choices: ['YES', 'NO'],
    onChoice(i), onDone, place: 'top' | 'bottom', auto: 2.5, modal: false (chatter that plays on) });
    in update: if (talk.update(dt)) return;   in draw: talk.draw(r)
  const menu = new E.Menu(game, ['START', { label: 'LOAD', disabled: true }], { title, x, y, onPick(i, item), onCancel });
    menu.update(); menu.draw(r)
Sound (game.audio; it starts after the first key press): sfx(name, { vol, pitch }) with presets jump jump2 land step coin
  pickup key powerup oneup heal hit hurt stomp bump swing whoosh punch kick shoot laser charge explode boom door secret
  warp die select confirm cancel pause text blip; or sfx({ wave: 'square' | 'pulse' | 'triangle' | 'saw' | 'sine' | 'noise',
  freq: 440 | 'A4', to, dur, vol, arp: [0, 4, 7], step }); define(name, voice)
  music('title' | 'adventure' | 'dungeon' | 'boss' | 'victory') or your own { bpm: 120, steps: 4, tracks: [{ wave: 'square',
  vol: .15, notes: 'C5 - E5 . G5 . | ...' }, { wave: 'drums', notes: 'k . h . s . h .' }] } ('-' holds, '.' rests; drums
  k s h o c t); music(null) stops; mute(); setVolume(0..1)
TileMap (iso, threequarter, topdown and brawler levels):
  new E.TileMap({ rows, legend, types, floorTex }); legend: a number = wall type, a string = spawn tag,
  { tile, floor: 'water', spawn, block: true }; types[id] = { h, top, side, cut: true (drops walls in front of the
  floor), face: 'brick' | 'none', roof: 'speckle' | 'plain' }; floorTex(x, y, floorTag) -> [r, g, b]
  find(tag) / findAll(tag) -> { x, y, cx, cy }; drawFloor(r) and queueWalls(r) in draw; bounds(view);
  set(cx, cy, 0) opens a door; cell(cx, cy), walkable(cx, cy), block(cx, cy, on), toCell(x, y), center(cx, cy),
  heightAt(x, y), floorAt(x, y), los(x0, y0, x1, y1). Walls lower than a body's feet are walkable (jump onto blocks).
  floors: E.tex.grass(x, y, { base, dark, light }), dirt, water, planks, checker(x, y, { a, b, size }), plain(x, y, { base })
  new E.FlowField(map): update(tx, ty) every step, dir(x, y, tx, ty) -> [dx, dy] around walls (pathfinding)
Body (ground physics): new E.Body({ x, y, r: 5, gravity: 700, friction: 0, bounce: 0 }); set vx, vy, then
  update(dt, map); push(ix, iy, iz) knockback; jump(v); reads z, onGround, landed, hitWall, bounced
PlatformMap (side-scrollers, 2.5D in 'brawler'): new E.PlatformMap({ rows, legend, types }); types[id] = { kind:
  'solid' | 'oneway' | 'ladder' | 'slope' (dir: 1 rises right, -1 left) | 'hazard' | 'deco' | 'back', style: 'block' |
  'bonus' | 'brick' | 'ground' | 'plank' | 'spikes' | 'ladder' | 'liquid' | 'plain', side: '#hex', top: '#hex' }
  find(tag) -> { x, z } (z = feet); cell(cx, cz) and set(cx, cz, id) count rows from the BOTTOM; groundBelow(x, z) ->
  surface height, or null over a pit; touching(box, 'hazard'); solidAt(x, z); types[id]; bounds(view); draw(r) right
  after r.sky; move(box, dt, solids) moves enemy boxes { x, z, w, h, vx, vz } (sets onGround, hitWall -1 | 0 | 1,
  hitCeiling, bumped)
Platformer: new E.Platformer({ x, z, w: 8, h: 22, run: 95, jump: 285, gravity: 800, airJumps: 0, wallJump: false, dash: 0 })
  update(dt, level, game.input or { x: -1..1, jump, jumpPressed, up, down, dash }, movingPlatforms); coyote time,
  jump buffering, variable jump height, ladders, down + jump through one-ways. Reads onGround, jumped, landed, facing
  (1 | -1), air, climbing, hitWall, bumped { cx, cz, id }; knock(dir); rigState(extra) feeds rig.update.
  Moving platforms are { x, z, w, h, vx, vz } boxes you move yourself and pass in; riders are carried.
Bullets: const shots = new E.Bullets(game, { plane: 'ground' | 'side' }); shots.fire({ x, y, z, vx, vy, vz, r: 2, team,
  color, life: 3, dmg, pierce, sprite }); burst(base, velocities); update(dt, map) (bullets die on walls);
  hit(targets, (b, t) => {...}, team) -> hits (targets: x, y, r, or x, z, w, h in side); draw(r); clear(team)
  velocities: E.pattern.dir(angle, speed), aim(from, to, speed), aimSide(from, to, speed), spread(angle, n, arc, speed),
  ring(n, speed, offset); on the side plane a velocity is [vx, vz]
Humanoid: new E.Humanoid({ size: 1.3, build: 'chibi' | 'heroic' | 'bulky', weapon: 'sword' | 'gun' | 'staff' | null,
  outfit: 'shirt' | 'tunic' | 'robe' | 'coat', hair: 'short' | 'bald', hat: 'cap' | 'pointed' | 'helmet' | 'crown'
  (or { style, color }), cape: { len: 6 }, hood: true, sleeves: 'short' | 'long' | 'none', eyeGlow: '#ff4030', hunch,
  colors: { skin, hair, cloth, coat, pants, boot, belt, trim, glove, cape, capeIn, metal, hilt } })
  rig.update(dt, { x, y, z, vx, vy, facing, attack, hurt, dash, air, point, aim, climb, vz, pose, stance, run })
    facing in radians (side view: 0 right, Math.PI left); air tucks the legs; point holds a gun out, aim tilts it
    (+ = up); pose: 'cheer' | 'cast' | 'guard' | 'kneel' | 'crouch' | 'wave' | 'hips' | 'block' | 'die' | 'down';

## Recipes
Side-scroller (Mario, Mega Man): PlatformMap + Platformer + Humanoid, view 'side'.
```js platformer
(() => {
const E = My3D2dge;
const game = new E.Game({ canvas: 'screen', res: 'snes', view: 'side', views: ['side', 'brawler'], input: 'PLATFORMER' });
const level = new E.PlatformMap({
  rows: ['                                  ',
         '               ?                  ',
         '        ===             ==        ',
         '  @           g     ^^       g  F ',
         '#################  ###############'],
  legend: { '#': 1, '=': 2, '?': 3, '^': 4, '@': 'hero', g: 'walker', F: 'flag' },
  types: { 1: { style: 'ground', side: '#8a5a32' }, 2: { kind: 'oneway' }, 3: { style: 'bonus', side: '#e8a830' }, 4: { kind: 'hazard' } }
});
const start = level.find('hero'), flag = level.find('flag');
const hero = new E.Platformer({ x: start.x, z: start.z });
const rig = new E.Humanoid({ hat: 'cap', weapon: null, colors: { cloth: '#d83a2a', pants: '#3050c0' } });
const foes = level.findAll('walker').map(p => ({ x: p.x, z: p.z, w: 12, h: 12, vx: 0, vz: 0, dir: -1, rig: new E.Blob({ feet: true, colors: { base: '#a06030', dk: '#5a3018', lt: '#d09060' } }) }));
game.cam.bounds = v => level.bounds(v);
game.particles.ground = (x, y, z) => level.groundBelow(x, z);           // sparks and debris land on platforms
game.start({
  update(dt) {
    hero.update(dt, level, game.input);
    if (hero.jumped) game.audio.sfx('jump');
    if (hero.bumped && level.types[hero.bumped.id].style === 'bonus') { level.set(hero.bumped.cx, hero.bumped.cz, 1); game.audio.sfx('coin'); game.particles.glints(hero.x, 0, hero.z + 30, 6); }
    if (level.touching(hero, 'hazard') || hero.z < -40) { Object.assign(hero, { x: start.x, z: start.z, vx: 0, vz: 0 }); game.audio.sfx('hurt'); }
    for (const f of foes) {
      f.vz -= 800 * dt; f.vx = f.dir * 25; level.move(f, dt);
      const ahead = level.groundBelow(f.x + f.dir * 8, f.z);
      if (f.hitWall || ahead === null || ahead < f.z - 4) f.dir = -f.dir;   // turn at walls and ledges
      f.rig.update(dt, { look: [f.dir, 0], walk: 1 });
      if (!f.dead && E.overlapBox(hero, f)) {
        if (hero.vz < 0 && hero.z > f.z + f.h / 2) { f.dead = true; hero.vz = 220; game.audio.sfx('stomp'); game.particles.dust(f.x, 0, f.z, 8); }
        else { hero.knock(hero.x < f.x ? -1 : 1); game.audio.sfx('hurt'); }
      }
    }
    E.prune(foes, f => f.dead);
    if (Math.abs(hero.x - flag.x) < 8) { game.audio.sfx('powerup'); Object.assign(hero, { x: start.x, z: start.z }); }
    rig.update(dt, hero.rigState());
    game.focus(hero.x, 0, hero.z + 24);                                   // side view: y = 0, z is up
  },
  draw(r) {
    r.sky(['#5c94fc', '#a8c8ff']);
    level.draw(r);
    r.queue(flag.x, 0, flag.z, g => { const [x, y] = r.w(flag.x, 0, flag.z); E.px.rect(g, x, y - 40, 2, 40, '#e8e8e8'); E.px.poly(g, [[x + 2, y - 40], [x + 14, y - 35], [x + 2, y - 30]], '#40c040'); });
    for (const f of foes) r.actor(f.x, 0, f.z, (g, ox, oy) => f.rig.draw(g, ox, oy, r.view));
    r.actor(hero.x, 0, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view));
  }
});
})();
```
Shoot-'em-up (1942): view 'overhead', sprites, Bullets, a starfield.
```js shmup
(() => {
const E = My3D2dge, W = 224, H = 256;
const game = new E.Game({ canvas: 'screen', res: [W, H], view: 'overhead', views: ['overhead'], input: 'SHMUP' });
const SHIP = E.sprite(['...w...', '..wbw..', '.wwbww.', 'wwrwrww', 'w..r..w'], { w: '#e8f0ff', b: '#3a7aff', r: '#ff5030' }, 2);
const FOE = E.sprite(['r.....r', '.rrrrr.', 'rryyyrr', '.r.r.r.'], { r: '#d03040', y: '#ffd040' }, 2);
const shots = new E.Bullets(game), ship = { x: W / 2, y: H - 30, r: 4 }, foes = [];
let score = 0, cool = 0, spawn = 0;
game.start({
  update(dt) {
    game.focus(W / 2, H / 2);                                            // overhead: world x/y = screen pixels
    const m = game.input.move();
    ship.x = E.clamp(ship.x + m[0] * 120 * dt, 8, W - 8); ship.y = E.clamp(ship.y + m[1] * 120 * dt, 8, H - 8);
    if ((cool -= dt) <= 0 && game.input.down('fire')) { cool = .12; shots.fire({ x: ship.x, y: ship.y - 10, vy: -300, team: 'player' }); game.audio.sfx('shoot'); }
    if ((spawn -= dt) <= 0) { spawn = .9; foes.push({ x: E.rand(20, W - 20), y: -10, r: 7, hp: 3, t: 0 }); }
    for (const f of foes) {
      f.t += dt; f.y += 40 * dt; f.x += Math.sin(f.t * 3) * 40 * dt;
      if (E.chance(dt * .6)) shots.burst({ x: f.x, y: f.y, team: 'foe', color: '#ff6080' }, [E.pattern.aim(f, ship, 90)]);
    }
    shots.update(dt);
    shots.hit(foes, (b, f) => { f.hp--; game.particles.sparks(b.x, b.y, 0, 4); }, 'player');
    for (const f of foes) if (f.hp <= 0) { score += 100; game.particles.explosion(f.x, f.y, 0, .8); }
    E.prune(foes, f => f.hp <= 0 || f.y > H + 20);
    if (shots.hit([ship], () => {}, 'foe')) { game.flash('#ff4040', .2); game.audio.sfx('hurt'); score = 0; }
  },
  draw(r) {
    r.sky(['#000010', '#101040']); r.starfield({ dir: 'down', speed: 40 });
    for (const f of foes) r.sprite(f.x, f.y, 0, FOE, { anchor: 'center' });
    r.sprite(ship.x, ship.y, 0, SHIP, { anchor: 'center' });
    shots.draw(r);
    r.text('SCORE ' + score, 4, 4, '#ffffff', { shadow: '#000', outline: false });
  }
});
})();

## Rules
1. World units and dt everywhere. Feel numbers (units per second, tile = 16): walk 70-90, run 95-140, jump 250-320
   with gravity 800, dash 200-260, player bullets 250-320, enemy bullets 70-120, enemies 25-45.
2. At 320x240, heroes are 40-60 px tall (Humanoid size 1.2-1.4), bosses size 1.8-2.4; hitboxes smaller than the art.
3. Every hit gets game.hitFx; deaths get particles.explosion; sounds on jump, hit, pickup and death; music per scene.
4. A title scene, play scenes with pausable: true, and a game-over or win path back to the title.
5. Dress every character (outfit, hat, colors) and give each its own moves; enemies wind up slower than the hero.
6. Nothing on screen? The camera looks elsewhere: game.follow(hero) or game.focus(...) every update (side: y = 0).

## Encore fork additions (everything above still works unchanged)
Layers: r.overlay(fn) draws on the world layer (it scrolls, zooms and is filtered with the world); r.hud(fn) draws on a
  separate HUD layer in screen pixels that never shifts, zooms or gets filtered. Dialog, Menu, the pause screen and
  scene fades use the HUD layer. r.toHud(x, y, z) -> where a world point sits on the HUD layer.
Zoom: game.zoomTo(1.3, x, y, z) eases the camera in on a world point (world layer only); game.zoomTo(1) eases back.
Bleed (edge to edge): new E.Game({ ..., bleed: true, valign: 'top' | 'center' }) or game.screen.setOptions({ bleed: true }),
  with game.screen.safe = { l, t, r, b } in CSS pixels (a notch, round corners). The picture (W x H, minW..maxW by
  minH..maxH, where the HUD lives) is then fitted inside the safe area, and the world layer is drawn past it to every
  edge of the canvas. (0, 0) stays the picture's corner; r.full -> { x0, y0, x1, y1 } is the whole drawable area in
  picture coordinates (x0, y0 are 0 or negative). Extend backgrounds, frames and full-screen fills to r.full.
  r.veil(color, alpha) tints the picture and the bleed together. game.screen.bl / bt / br / bb = the bleed in game pixels.
Routines (choreography): game.run(function* () { yield .4; yield* E.to(obj, { x: 90 }, .3, E.ease.outCubic);
  yield* E.arc(obj, x, y, 30, .5); yield [a(), b()]; yield () => done; }) -> { done, value, cancel() }
  yield a number = wait seconds, nothing = one step (returns dt), a function = wait until true, a generator = run it,
  an array = run together. E.tween(dur, k => {...}, ease). game.run(gen, { real: true }) keeps running while paused.
  More easing: E.ease.linear inCubic inOutCubic outQuart inBack outElastic outBounce there (0-1-0) punch.
Screen filter (WebGPU, else WebGL2, else off): game.post.set({ enabled: true, ...E.POST_PRESETS.cel }) or
  game.post.preset('cel' | 'comic' | 'pixel' | 'celpixel' | 'pocket' | 'crt' | 'off'). Parameters: pixel (block size),
  smooth 0..1, bands (cel tones), bandSoft, ink, inkWidth, inkThresh, inkTint, levels (colour steps), palette 0..3,
  dither, grid, scan, halftone, sat, contrast, vignette, backend 'auto' | 'webgpu' | 'webgl2'.
  game.post.backend -> 'webgpu' | 'webgl2' | null; game.post.state -> 'idle' | 'loading' | 'ready' | 'failed'; .error
  res: 0 (default) lets the filter draw itself at half or a third size when frames run slower than about 45 a second,
  1 = always full, 2 = half, 3 = a third. game.post.scale -> the divisor in use. The HUD stays sharp at every scale.
Painted scenery: E.paint(w, h, (g, w, h) => {...}, { outline: true }) -> a sprite for r.sprite.
  new E.Flat(w, h, paintFn, { back: paintBackFn, ax }) is a cut-out: r.flat(x, y, z, flat, { turn: radians (PI shows
  the back), fall: 0..1 (tips flat), shear: px (the top leans: sway), alpha, mirror })
Humanoid: pose 'bow' | 'tada' | 'think' | 'shrug' | 'hang'; weapon: 'slapstick'; puppet: true (ball joints);
  hat: 'tophat' | 'bowler' | 'jester' | 'beret' | 'flatcap'; nose: true | '#hex'; cheeks: true | '#hex'
Blob: fuzz: true (dust bunny), pins: n (pincushion), antenna: true
Audio: game.audio.musicFilter(700) muffles the music, musicFilter() clears it; setMusicVolume(v), setSfxVolume(v)
GPU resets: pictures made with E.sprite, E.paint and E.Flat, and the engine's own caches, are repainted by E.repaintAll()
  when the browser restores a lost canvas or the filter loses its device. E.repaintable(fn) adds your own cache to that.

// backdrop panels: the painted scenery at the back of the set, in 96 px wide flats with visible seams
const BACKDROP_H = 124;
function backdropPanel(theme, i) {
  return mkFlat(96, BACKDROP_H, (g, w, h) => {
    const R = E.rng(i * 131 + theme.length * 17), th = theme;
    const skies = { village: ['#8ad0f0', '#a8dcf4', '#c8e8f4', '#f4ecc8'], orchard: ['#7ac8f0', '#98d8f4', '#c0e8f0', '#f0f0c8'], river: ['#70b8e8', '#90ccf0', '#b8e0f4', '#e8f0e0'], castle: ['#3a2a5a', '#5a3a70', '#8a4a78', '#d8785a'], wings: ['#2a2036', '#2a2036', '#2a2036', '#2a2036'] };

class PressWatch {
  constructor(action) { this.action = action; this.t = 0; this.last = -99; this.prev = -99; this.on = true; this.h = runReal(this._run()); }

// ---- BATTLE: a turn-based fight staged as a show. The flow is one long routine; moves and enemy turns are sub-routines ----
const Battle = {
  view: STAGE_VIEW,
  enter(data) {

    Object.assign(this, { t: 0, round: 0, banner: null, note: null, cmd: null, cue: null, props: [], menus: [], tsel: null, hint: '', rope: null, loose: 0, sandbag: null, headOff: false, fled: false, inMenu: false, active: null, swapped: false, tally: null, levelPick: null, endMenu: null, guardT: 0, flCue: null, flHint: null, smoke: [], lightsUp: 0, spot: null, smoked: false, tutNote: false, heldIcon: null });
    this.snapshot = JSON.stringify(S);
    this.hero = mkActor('party', 'pim'); this.mate = S.mate.joined ? mkActor('party', 'ratchet') : null; this.hero.fig.state.stance = 'ready';
    this.party = this.mate ? [this.hero, this.mate] : [this.hero];
    if (this.mate && this.mate.hp <= 0) { this.mate.alive = false; this.mate.fig.pose = 'down'; }
    if (S.front === 'mate' && !(this.mate && this.mate.hp > 0)) S.front = 'hero';
    this.placeParty(true);
    this.foes = data.foes.map((k, i) => mkActor('foe', k, i));
    this.foes.forEach((f, i) => { const boss = f.boss; f.home = { x: boss ? 246 : STG.foeX + i * STG.foeGap, y: boss ? 46 : STG.y + (i % 2 ? 7 : -3), z: f.flying ? 22 : 0 }; Object.assign(f.fig, { x: f.home.x + 190, y: f.home.y, z: f.home.z }); });
    for (const a of this.party) a.fig.x -= 170;
    this.actors = this.party.concat(this.foes);
    Aud.init(clamp(S.crowd + (data.boss ? 4 : 0), 4, Aud.cap), data.hecklers || 0);
    S.stats.peakCrowd = Math.max(S.stats.peakCrowd, Aud.count);
    Pops.clear(); parts.ground = null;
    music(data.boss ? 'boss' : 'battle'); audio.musicFilter();
    this.wA = new PressWatch('confirm'); this.wB = new PressWatch('attack');
    this.main = run(this.script());
  },
  exit() { if (this.wA) this.wA.stop(); if (this.wB) this.wB.stop(); },
  placeParty(snap) {
    const front = S.front === 'mate' && this.mate && this.mate.hp > 0 ? this.mate : this.hero, back = front === this.hero ? this.mate : this.hero;
    front.home = { x: STG.heroX, y: STG.y, z: 0 }; if (back) back.home = { x: STG.mateX, y: STG.y + 7, z: 0 };
    if (snap) for (const a of this.party) Object.assign(a.fig, a.home);

  get front() { return this.party.slice().sort((a, b) => b.home.x - a.home.x).find(a => a.hp > 0) || this.hero; },
  living(side) { return (side === 'foe' ? this.foes : this.party).filter(a => a.alive && a.hp > 0); },
  result() { if (this.fled) return 'fled'; if (this.hero.hp <= 0) return 'lose'; if (!this.foes.some(f => f.alive)) return 'win'; return null; },

  *script() {

// ---- ACTION CUES: the little feats of timing that turn a menu choice into a performance ----
// Each returns a result and drives Battle.cmd, which the HUD draws. With BOT.on they resolve by dice.
const Cue = {
  // hold [A] while the lamps light, release on the star. -> 'great' | 'nice' | 'early' | 'late' | 'miss'
  *hold(B, a, o = {}) {
    const step = (o.step || .27), lamps = 4, win = (o.win || .34) * tscale();
    const c = B.cmd = { kind: 'hold', fig: a.fig, lamps, lit: 0, t: 0, phase: 'wait', key: BTN.a };
    if (BOT.on) { yield .3; c.phase = 'hold'; for (let i = 1; i <= lamps; i++) { c.lit = i; sfx('tick', { pitch: .8 + i * .15 }); a.fig.atkState = E.move(o.move || 'overhead', i / lamps, 'wind'); yield step * (BOT.fast ? .3 : 1); } B.cmd = null; return botRoll() ? (botRoll(.4) ? 'great' : 'nice') : 'late'; }
    let t = 0; while (inp.down('confirm') && t < .25) { t += (yield) || 0; }      // a press left over from the menu does not count
    t = 0; while (!inp.down('confirm')) { const dt = (yield) || 0; t += dt; c.t = t; if (t > 4) { B.cmd = null; return 'miss'; } }
    c.phase = 'hold'; t = 0; let res = null;
    for (;;) {
      const dt = (yield) || 0; t += dt; c.t = t;
      const lit = Math.min(lamps, 1 + Math.floor(t / step)); if (lit !== c.lit) { c.lit = lit; sfx('tick', { pitch: .8 + lit * .15 }); if (lit === lamps) sfx('blip', { pitch: 1.4 }); }
      a.fig.atkState = E.move(o.move || 'overhead', clamp(t / (step * (lamps - 1)), 0, 1), 'wind');
      const starAt = step * (lamps - 1);
      if (!inp.down('confirm')) { res = t < starAt ? 'early' : t - starAt < win * .45 ? 'great' : 'nice'; break; }
      if (t > starAt + win) { res = 'late'; break; }
    }
    B.cmd = null; return res;
  },
  // alternate [left] [right] to wind the spring before time runs out. -> 0..1
  *crank(B, a, o = {}) {
    const dur = o.dur || 2.3, per = (o.per || .1) * (settings.timing === 0 ? 1.45 : settings.timing === 2 ? .85 : 1) * (Touch.on ? 1.2 : 1);   // a thumb wiggles slower than two fingers tap
    const c = B.cmd = { kind: 'crank', fig: a.fig, fill: 0, t: 0, dur, next: 0 };
    if (BOT.on) { const goal = botRoll() ? rand(.86, 1) : rand(.3, .8); yield* E.tween(BOT.fast ? .3 : 1.2, u => { c.fill = goal * u; c.t = dur * u * .6; a.fig.state.keySpeed = 4 + c.fill * 26; }); B.cmd = null; return goal; }
    let t = 0, last = 0;
    while (t < dur && c.fill < 1) {
      const dt = (yield) || 0; t += dt; c.t = t;
      const L = inp.pressed('left'), R = inp.pressed('right');
      if ((L && last !== -1) || (R && last !== 1)) { last = L ? -1 : 1; c.next = last < 0 ? 1 : 0; c.fill = Math.min(1, c.fill + per); sfx('crank', { pitch: .8 + c.fill * .9 }); a.fig.kick(1.5); }
      a.fig.state.keySpeed = 4 + c.fill * 26;
    }
    yield .12; B.cmd = null; return c.fill;
  },
  // a marker sweeps a bar: stop it in the bright zone. -> true | false
  *stop(B, a, o = {}) {
    const zone = (o.zone || .2) * Math.sqrt(tscale()), z0 = rand(.45, .95 - zone), speed = o.speed || 1.15;
    const c = B.cmd = { kind: 'stop', fig: a.fig, pos: 0, z0, z1: z0 + zone, t: 0 };
    if (BOT.on) { const ok = botRoll(); yield* E.tween(BOT.fast ? .2 : .6, u => { c.pos = (ok ? z0 + zone / 2 : z0 - .2) * u; }); B.cmd = null; return ok; }
    yield; let t = 0, ok = false;
    for (;;) { const dt = (yield) || 0; t += dt; c.pos = 1 - Math.abs(((t * speed) % 2) - 1); if (inp.pressed('confirm')) { ok = c.pos >= c.z0 && c.pos <= c.z1; break; } if (t > 5) break; }
    c.done = ok ? 1 : -1; yield .25; B.cmd = null; return ok;
  },
  // hit your marks: press the arrows in order before time runs out. -> number right
  *marks(B, a, o = {}) {
    const n = o.n || 6, dur = (o.dur || 4.6) * (settings.timing === 0 ? 1.4 : settings.timing === 2 ? .8 : 1), seq = Array.from({ length: n }, () => pick(['up', 'down', 'left', 'right']));
    const c = B.cmd = { kind: 'marks', fig: a.fig, seq, got: [], t: 0, dur };
    if (BOT.on) { for (let i = 0; i < n; i++) { yield BOT.fast ? .05 : .22; c.got.push(botRoll(Math.min(.97, BOT.skill + .1))); sfx(c.got[i] ? 'tick' : 'error', { pitch: 1 + i * .08 }); if (o.each) o.each(i, c.got[i]); } yield .2; B.cmd = null; return c.got.filter(Boolean).length; }
    yield; let t = 0;
    while (c.got.length < n && t < dur) {
      const dt = (yield) || 0; t += dt; c.t = t;
      for (const d of ['up', 'down', 'left', 'right']) if (inp.pressed(d)) { const i = c.got.length, ok = d === seq[i]; c.got.push(ok); sfx(ok ? 'tick' : 'error', { pitch: 1 + i * .08 }); if (o.each) o.each(i, ok); break; }
    }
    while (c.got.length < n) c.got.push(false);
    yield .3; B.cmd = null; return c.got.filter(Boolean).length;
  },
  // on the beat: press [A] as each note reaches the ring. -> number hit
  *beats(B, a, o = {}) {
    const n = o.n || 4, gap = o.gap || .52, lead = 1.1, win = .11 * tscale();
    const c = B.cmd = { kind: 'beats', fig: a.fig, n, gap, lead, t: 0, hits: [] };
    if (BOT.on) { for (let i = 0; i < n; i++) { yield BOT.fast ? .05 : gap * .6; const ok = botRoll(); c.hits[i] = ok ? 1 : -1; if (o.each) o.each(i, ok); } B.cmd = null; return c.hits.filter(h => h > 0).length; }
    yield; let t = 0; const total = lead + gap * (n - 1) + .3;
    while (t < total) {
      const dt = (yield) || 0; t += dt; c.t = t;
      if (inp.pressed('confirm')) { let best = -1, bd = 9; for (let i = 0; i < n; i++) if (!c.hits[i]) { const d = Math.abs(t - (lead + i * gap)); if (d < bd) { bd = d; best = i; } } if (best >= 0 && bd <= win) { c.hits[best] = 1; sfx('ding', { pitch: 1 + best * .12 }); if (o.each) o.each(best, true); } else sfx('error'); }
      for (let i = 0; i < n; i++) if (!c.hits[i] && t > lead + i * gap + win) { c.hits[i] = -1; if (o.each) o.each(i, false); }
    }
    B.cmd = null; return c.hits.filter(h => h > 0).length;
  },
  // mash [A] to fill the bar. -> 0..1
  *mash(B, a, o = {}) {
    const dur = o.dur || 2.4, per = o.per || .09, c = B.cmd = { kind: 'mash', fig: a.fig, fill: 0, t: 0, dur, key: BTN.a };
    if (BOT.on) { const g = botRoll(.75) ? 1 : .6; yield* E.tween(BOT.fast ? .2 : .8, u => { c.fill = g * u; }); B.cmd = null; return g; }
    yield; let t = 0;
    while (t < dur && c.fill < 1) { const dt = (yield) || 0; t += dt; c.t = t; if (inp.pressed('confirm')) { c.fill = Math.min(1, c.fill + per); sfx('tick', { pitch: .9 + c.fill }); } c.fill = Math.max(0, c.fill - dt * .08); }
    B.cmd = null; return c.fill;
  }
};
// at the instant of impact: was [A] pressed in the window just before it? A few late frames still count.
function* landTimed(B, win = .14, grace = .06) {
  if (BOT.on) return botRoll();
  win *= tscale();
  if (B.wA.hit(win, .3)) return true;
  let t = 0; while (t < grace) { const dt = (yield) || 0; t += dt; if (B.wA.recent(.02) && B.wA.last - B.wA.prev > .3) return true; }
  return false;
}

// what the bot picks on its turn (used by the automated playthrough): sensible, not optimal
function botChoice(B, a) {
  while (BOT.force && BOT.force.length) {      // test rig: play a scripted list of moves first, so every move gets exercised
    const id = BOT.force.shift(), base = id.startsWith('item:') ? 'item:' + ITEMS[id.slice(5)].kind : id, mv = MOVES[base]; if (!mv) continue;
    if ((mv.user === 'mate') !== !!a.isMate && ['slap', 'wallop', 'drop', 'ricochet', 'bouquet', 'showstopper', 'zip', 'spin', 'size'].includes(base) && (['zip', 'spin', 'size'].includes(base) !== !!a.isMate)) { BOT.force.unshift(id); break; }
    if ((mv.mp || 0) > S.mp || (mv.star || 0) * 100 > S.applause + .01 || (mv.usable && mv.usable(B, a))) continue;
    let arg = null; if (id.startsWith('item:')) { const i = S.items.indexOf(id.slice(5)); if (i < 0) continue; arg = { id: id.slice(5), i }; }
    const pool = mv.target === 'foe' ? B.living('foe').filter(t => !mv.ok || !mv.ok(B, a, t, arg)) : mv.target === 'ally' ? B.party.filter(p => mv.pickDown ? p.hp <= 0 : p.hp > 0) : [null];
    if (!pool.length) continue; DBG.push('forced', { move: id, by: a.name }); return { move: base, target: pool[0], arg };
  }
  const foes = B.living('foe'), ground = foes.filter(f => !f.flying), hurt = B.party.filter(p => p.hp > 0 && p.hp <= Math.max(3, p.max * .35));
  const tartI = S.items.indexOf('tart'), saltI = S.items.indexOf('smelling');
  if (B.mate && B.mate.hp <= 0 && saltI >= 0) return { move: 'item:revive', target: B.mate, arg: { id: 'smelling', i: saltI } };
  if (hurt.length && tartI >= 0) return { move: 'item:heal', target: hurt[0], arg: { id: 'tart', i: tartI } };
  if (a.isHero) {
    if (S.applause >= 200 && foes.length && (foes.length > 1 || foes[0].boss)) return { move: 'showstopper', target: null };
    if (hurt.length && S.applause >= 100) return { move: 'bouquet', target: null };
    const soft = foes.find(f => !f.spiky || has('thimble')), armored = ground.find(f => f.def > 0);
    if (armored && has('wallop') && S.mp >= 2) return { move: 'wallop', target: armored };
    if (ground.length && ground[0].spiky) return has('wallop') && S.mp >= 2 ? { move: 'wallop', target: ground[0] } : { move: 'slap', target: ground[0] };
    const fl = foes.find(f => f.flying); if (fl) return { move: has('spring') && S.mp >= 3 ? 'ricochet' : 'drop', target: fl };
    if (ground.length) return { move: 'slap', target: ground[0] };
    return { move: 'drop', target: soft || foes[0] };
  }
  if (ground.length > 1 && S.mp >= 3) return { move: 'spin', target: null };
  if (ground.length) return { move: 'zip', target: ground[0] };
  const kind = foes[0] && foes[0].kind; if (kind && !S.sized[kind]) return { move: 'size', target: foes[0] };
  return { move: 'bow', target: null };
}

const ZONES = [

];
const zoneAt = x => { let z = ZONES[0]; for (const q of ZONES) if (x >= q.x0) z = q; return z; };
const GATE_COL = 49, RIVER = { c0: 82, c1: 85, row: 6 }, DOOR_COL = 79, CORRIDOR = { c0: 71, c1: 86 };

function buildFieldMap() {
  const cells = new Array(FW * FH).fill(0);
  const types = {
    1: { h: 12, top: '#d8b070', side: '#a87a44', course: 6, line: '#7a5430' }, 2: { h: 24, top: '#d8b070', side: '#a87a44', course: 6, line: '#7a5430' },
    3: { h: 44, top: '#4aa04a', side: '#2f7a3f', sideLt: '#3a8f48', sideDk: '#245f34', course: 4, line: '#1f5230', edge: '#7fd070' },   // the orchard gate: a clipped hedge on a stage lift
    4: { h: 10, top: '#8a8098', side: '#5a5068', course: 5 }                          // castle kerb
  };
  const map = new E.TileMap({ w: FW, h: FH, cells, types, ao: 4, floorTex: fieldFloor });
  const B = (c, r, on = true) => map.block(c, r, on);
  for (let c = 0; c < FW; c++) { B(c, 0); B(c, 9); B(c, 3); for (const r of [1, 2]) if (c < CORRIDOR.c0 || c > CORRIDOR.c1) B(c, r); }
  for (let r = 0; r < FH; r++) { B(0, r); B(FW - 1, r); }
  B(DOOR_COL, 3, false);                                                             // the stage door through the scenery
  cells[4 * FW + 43] = 1; cells[4 * FW + 44] = 2; cells[5 * FW + 44] = 1;            // crates to climb
  for (let r = 4; r <= 8; r++) cells[r * FW + GATE_COL] = 3;
  for (let c = RIVER.c0; c <= RIVER.c1; c++) for (let r = 4; r <= 8; r++) B(c, r);
  for (const c of [72, 86]) { cells[1 * FW + c] = 2; }                               // crates at the ends of the corridor
  return map;
}
// the floor is stage boards under a painted ground cloth: grass, a worn path, flagstones at the castle, bare boards backstage
function fieldFloor(x, y) {
  const seam = (Math.floor(y) % 16 === 0) || (Math.floor(x + Math.floor(y / 16) * 37) % 64 === 0);
  let c;
  if (y < 64) { const row = Math.floor(y / 6), g = E.hash2(Math.floor(x / 5), row); c = (Math.floor(y) % 6 === 0 || Math.floor(x + row * 17) % 40 === 0) ? [38, 28, 26] : g > .75 ? [86, 66, 52] : g < .2 ? [70, 52, 42] : [78, 59, 47]; if (y > 48) c = c.map(v => v * .7); return c; }
  if (y >= FRONT_Y) { return Math.floor(y) % 8 === 0 ? [50, 30, 22] : [92, 60, 38]; }
  const z = zoneAt(x).id, path = Math.abs(y - 106 - Math.sin(x * .013) * 9) < 9 + E.noise2(x * .05, 3) * 5;
  if (z === 'castle') { c = E.tex.flagstone(x, y, { mortar: [44, 38, 60], stones: [[104, 96, 124], [96, 88, 116], [112, 104, 130]], hi: [128, 120, 146], lo: [78, 70, 96], speck: [86, 78, 104] }, 14); if (x < 1500) { const k = clamp((x - 1456) / 44, 0, 1); if (E.hash2(Math.floor(x), Math.floor(y)) > k) c = E.tex.grass(x, y, { base: '#4a8a58', dark: '#3a7450', light: '#5c9c62' }); } }
  else if (path) c = E.tex.dirt(x, y, { base: '#d8b684', dark: '#c09a68', light: '#e8cc9c' });
  else c = E.tex.grass(x, y, z === 'village' ? { base: '#6cba5a', dark: '#52a04c', light: '#86cc6a' } : { base: '#58ac50', dark: '#429444', light: '#72c060' });
  if (seam) c = [c[0] * .86, c[1] * .86, c[2] * .86];
  return c;
}

if (Q.has('mp')) { S.maxMp = +Q.get('mp'); S.mp = S.maxMp; }
if (Q.has('matehp')) S.mate.hp = +Q.get('matehp');
if (Q.has('force')) BOT.force = Q.get('force').split(',');
if (Q.has('coins')) S.coins = +Q.get('coins');
if (Q.has('lv')) { for (let i = 1; i < +Q.get('lv'); i++) { S.level++; S.hero.max += 5; S.mate.max += 5; } fullHeal(); }
if (Q.has('flags')) for (const f of Q.get('flags').split(',')) S.flags[f] = true;
if (Q.has('post')) { settings.filter = Q.get('post'); settings.fx = Object.assign({}, E.POST_PRESETS[settings.filter] || E.POST_PRESETS.off); if (Q.has('fx')) Object.assign(settings.fx, JSON.parse(Q.get('fx'))); if (Q.has('backend')) settings.backend = Q.get('backend'); if (Q.has('res')) settings.res = +Q.get('res') | 0; applySettings(); }
let boot = 'title', bootData;
if (Q.has('gallery')) boot = 'gallery';
else if (Q.has('battle')) { boot = 'battle'; const foes = Q.get('battle').split(','); bootData = { foes, theme: Q.get('theme') || (foes[0] === 'dragon' ? 'castle' : 'orchard'), boss: foes[0] === 'dragon', first: Q.get('first') || null, tutorial: Q.has('tutorial'), hecklers: +(Q.get('hecklers') || 0) }; Curtain.k = 1; }
else if (Q.has('field')) { boot = 'field'; S.flags.metValance = true; S.flags.tutorial = true; S.flags.tut1 = S.flags.tut2 = S.flags.tut3 = S.flags.tut4 = true; if (Q.get('at')) { const [x, y] = Q.get('at').split(',').map(Number); S.checkpoint = { x, y: y || 104 }; } bootData = { from: 'load' }; if (!S.checkpoint) S.checkpoint = { x: 44, y: 104 }; }
else if (Q.has('clear')) boot = 'clear';
if (Q.has('loop')) { const snap = JSON.stringify(S); Battle.after = () => { S = JSON.parse(snap); game.go('battle', bootData); }; }   // test rig: fight the same fight again from the same state
game.start({ scene: boot, scenes: { title: Title, field: Field, battle: Battle, clear: Clear, gallery: Gallery }, data: bootData });
if (Q.has('auto')) { BOT.skill = +(Q.get('skill') || .8); BOT.guard = +(Q.get('guard') || .6); BOT.fast = Q.has('fast'); const h = runReal(Auto.play()); Auto.handle = h; }
game.o.canvas.addEventListener('pointerdown', () => { try { window.focus(); game.o.canvas.focus(); } catch (e) { /* focus is a nicety */ } });
if (Q.has('safe')) { const v = Q.get('safe').split(',').map(Number); Touch.safeTest = { l: v[0] || 0, t: v[1] || 0, r: v[2] || 0, b: v[3] || 0 }; }   // test rig: pretend the phone has a notch
Touch.init();
window.ENCORE = { game, E, settings, get S() { return S; }, BOT, Battle, Field, Aud, DBG, Talk, Auto, Kit, Curtain, Touch, Title };
})();

</script>
