<title>Deke &amp; Moop Hit the Roundabout</title>
<style>

<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="touchWarn"><div class="card"><h1>Controller or keyboard required</h1><p>This 10-foot adventure needs a PS5 controller or a keyboard. Touch controls are not supported.</p><button id="touchSettings">⚙ Settings</button></div></div>
<script>
"use strict";
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const W=1280,H=720;
const SETTINGS={volume:.7,textSpeed:1,shake:true,subtitles:true};
let state='title'; // title,howto,about,settings,play,win,lose,attract
let prevState='title';
let menuIndex=0, settingsIndex=0, accuseIndex=0, invIndex=0;
let lastInput=performance.now(), attractT=0, time=0;
let dialogue=null, dialogueQueue=[], dlgChar=0, dlgTimer=0;
let overlay=null; // null | inventory | pause | accuse
let toast='', toastT=0, shakeT=0;
let selectedItem=null, hoverHotspot=null;
let cursor={x:640,y:400};
let mouse={x:640,y:400,down:false};
let keys={}, pressed={};
let padPressed={}, padPrev={};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

// AUDIO
let AC=null;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function beep(f=440,d=.08,type='square',v=.12){ const a=audio(); if(!a||SETTINGS.volume<=0)return; const o=a.createOscillator(),g=a.createGain(); o.type=type;o.frequency.value=f; g.gain.value=v*SETTINGS.volume; g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d); o.connect(g);g.connect(a.destination); o.start();o.stop(a.currentTime+d); }
function jingle(win=true){ const n=win?[523,659,784,1046]:[392,330,262,196]; n.forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.14),i*110)); }
function sayBlip(who){ beep(who==='MOOP'?880:who==='LUANNE'?660:who==='HANK'?220:330,.05,'square',.06); }

// GAME DATA
const ITEMS={
 chicken:{name:'Rubber Chicken',icon:'🐔',desc:'A rubber chicken with a pulley in the middle. Legally distinct. Emotionally essential.'},
 mug:{name:'Empty Mug',icon:'☕',desc:'Reads: WORLD’S OKAYEST DETECTIVE. The “S” fell off.'},
 wrench:{name:'Wrench',icon:'🔧',desc:'Heavy, greasy, and shaped exactly like a coffee-machine argument winner.'},
 coffee:{name:'Full Mug',icon:'☕',desc:'Coffee so strong it has its own gravitational field.'},
 key:{name:'Garage Key',icon:'🗝️',desc:'A brass key on a plastic donut keyring the size of a dinner plate.'},
 crowbar:{name:'Crowbar',icon:'🪝',desc:'For crates, doors, and dramatically prying open plot points.'}
};
let G=null;
function resetGame(){
 G={scene:'outside',px:320,py:585,tx:320,dir:1,walk:0,moopX:250,moopY:600,
 inv:['chicken'], flags:{mug:false,wrench:false,coffeeFixed:false,coffee:false,key:false,garage:false,crowbar:false,crate:false,metHank:false,metLuanne:false},
 clues:{prints:false,ticket:false,cap:false}, objective:'Talk to the locals about the missing Puddles the Possum.',
 pending:null, camX:0};
 selectedItem=null; overlay=null; dialogue=null; dialogueQueue=[];
}
resetGame();
function clueCount(){ return (G.clues.prints?1:0)+(G.clues.ticket?1:0)+(G.clues.cap?1:0); }
function updateObjective(){
 if(!G.flags.key) G.objective='Get the Garage Key from Luanne. She runs on coffee.';
 else if(!G.flags.garage) G.objective='Use the Garage Key on the garage door.';
 else if(!G.flags.crate) G.objective='Search the garage. Pry the crate. Find evidence. ('+clueCount()+'/3 clues)';
 else if(clueCount()<3) G.objective='Find all 3 clues, then accuse the culprit. ('+clueCount()+'/3)';
 else G.objective='You have 3 clues! Accuse the culprit at the pedestal or via Pause → Accuse.';
}
function addItem(id){ if(!G.inv.includes(id))G.inv.push(id); toast='Got: '+ITEMS[id].name; toastT=3; beep(920,.12,'square',.15); setTimeout(()=>beep(1240,.14,'square',.12),90); }
function removeItem(id){ G.inv=G.inv.filter(x=>x!==id); if(selectedItem===id)selectedItem=null; }
function has(id){ return G.inv.includes(id); }
function showToast(t){ toast=t; toastT=3; }
function startDialogue(lines,after){ dialogueQueue=lines.slice(); dialogue=null; nextDialogue(); if(after)dialogueQueue.after=after; }
function nextDialogue(){
 if(dialogueQueue.length===0){ const a=dialogueQueue.after; dialogue=null; if(a)a(); return; }
 dialogue=dialogueQueue.shift(); dialogue.full=dialogue.text; dialogue.shown=0; dlgChar=0; sayBlip(dialogue.who);
}
function advanceDialogue(){ if(!dialogue)return; if(dialogue.shown<dialogue.full.length){dialogue.shown=dialogue.full.length;return;} nextDialogue(); }

// HOTSPOTS
function hotspots(){
 if(G.scene==='garage'){
  const hs=[
   {id:'exit',x:80,y:430,w:170,h:190,label:'Exit Garage',wx:150},
   {id:'crate',x:520,y:430,w:260,h:160,label:G.flags.crate?'Opened Crate':'Sealed Crate',wx:640},
   {id:'shelf',x:860,y:360,w:300,h:110,label:'Dusty Shelf',wx:980},
   {id:'workbench',x:880,y:480,w:320,h:100,label:'Workbench',wx:1000},
  ];
  if(!G.flags.crowbar) hs.push({id:'crowbar',x:940,y:500,w:90,h:50,label:'Crowbar',wx:970});
  if(!G.clues.ticket) hs.push({id:'ticket',x:600,y:590,w:110,h:36,label:'Torn Ticket',wx:640});
  if(!G.clues.cap) hs.push({id:'cap',x:900,y:380,w:90,h:44,label:'Greasy Cap',wx:940});
  return hs;
 }
 const hs=[
  {id:'car',x:90,y:450,w:340,h:140,label:'The Convertible',wx:260},
  {id:'hank',x:480,y:430,w:120,h:190,label:'Hank the Mechanic',wx:500},
  {id:'toolbox',x:610,y:540,w:110,h:60,label:'Toolbox',wx:640},
  {id:'luanne',x:760,y:360,w:170,h:180,label:'Luanne at Diner Window',wx:820},
  {id:'coffeemachine',x:970,y:390,w:120,h:120,label:'Coffee Machine',wx:1010},
  {id:'table',x:1120,y:520,w:150,h:70,label:'Picnic Table',wx:1160},
  {id:'pedestal',x:1420,y:330,w:260,h:260,label:'Empty Possum Pedestal',wx:1520},
  {id:'prints',x:1700,y:580,w:200,h:50,label:'Muddy Prints',wx:1780},
  {id:'garageDoor',x:1960,y:360,w:300,h:230,label:G.flags.garage?'Open Garage':'Locked Garage',wx:2080},
  {id:'pump',x:1320,y:430,w:90,h:150,label:'Gas Pump',wx:1360},
 ];
 if(!G.flags.mug) hs.push({id:'mug',x:1160,y:510,w:60,h:40,label:'Mug on Table',wx:1160});
 return hs;
}
function hotspotAt(wx,wy){ const hs=hotspots(); for(let i=hs.length-1;i>=0;i--){const h=hs[i]; if(wx>=h.x&&wx<=h.x+h.w&&wy>=h.y&&wy<=h.y+h.h)return h;} return null; }

// INTERACTIONS
function examine(id){
 const L={
 car:[{who:'DEKE',text:'Black-and-white convertible. Zero cup holders. Infinite glovebox. Last week it contained a tax form and a live crab.'},{who:'MOOP',text:'I call shotgun, driver, and back-seatDJ simultaneously!'}],
 hank:[{who:'DEKE',text:'Hank. Mechanic, poet, and a man whose overalls have seen things no cloth should.'}],
 toolbox:[{who:'DEKE',text:'A toolbox held together by stickers, hope, and one very optimistic bungee cord.'}],
 luanne:[{who:'DEKE',text:'Luanne runs the diner, the till, and — if rumours are true — a midnight arm-wrestling league.'}],
 coffeemachine:[{who:'DEKE',text:G.flags.coffeeFixed?'The coffee machine hums like a tiny caffeinated choir.':'The coffee machine rattles, sighs, and displays the word NO in three languages.'}],
 table:[{who:'MOOP',text:'Sticky! The universal sign of a great diner or a terrible glue factory.'}],
 pedestal:[{who:'DEKE',text:'Puddles the Giant Possum stood here for 31 years. Now: four bolt holes and a lot of questions.'},{who:'MOOP',text:'He never blinked. I respected that.'}],
 prints:[{who:'DEKE',text:'Muddy prints. Too big for a possum, too neat for an accident. Someone staged this trail.'}],
 garageDoor:[{who:'DEKE',text:G.flags.garage?'The garage yawns open, smelling of oil and secrets.':'Locked tight. The keyhole is shaped like a tiny donut. Of course it is.'}],
 pump:[{who:'MOOP',text:'It says REGULAR, PREMIUM, and MYSTERY. I choose MYSTERY every time!'}],
 mug:[{who:'DEKE',text:'A mug. Empty, chipped, and full of potential. Like me before coffee.'}],
 crate:[{who:'DEKE',text:G.flags.crate?'Inside: foam, straps, and one very guilty costume head.':'A crate stencilled: DO NOT OPEN UNTIL TOURISM IMPROVES. Subtle.'}],
 shelf:[{who:'DEKE',text:'Oil, rags, a trophy for “Most Adequate Mechanic 1998”, and dust with seniority.'}],
 workbench:[{who:'DEKE',text:'Screwdrivers sorted by size, then immediately unsorted by chaos.'}],
 crowbar:[{who:'MOOP',text:'A crowbar! The skeleton key of the impatient!'}],
 ticket:[{who:'DEKE',text:'Half a ticket: “…ANK YOU FOR VISITING PUDDLES”. The other half is missing. The pun is not.'}],
 cap:[{who:'DEKE',text:'A greasy mechanic’s cap. Embroidered: HANK. Well. That narrows the hat-based suspect pool to one.'}],
 exit:[{who:'DEKE',text:'Back to daylight, donuts, and poor decisions.'}]
 };
 startDialogue(L[id]||[{who:'DEKE',text:'Nothing to say. Which, for us, is a medical emergency.'}]);
 // clues from examining
 if(id==='prints'&&!G.clues.prints){ G.clues.prints=true; showToast('Clue found: Muddy Prints ( '+clueCount()+'/3 )'); updateObjective(); }
}
function interact(id){
 // selected item use first
 if(selectedItem){ useItemOn(selectedItem,id); return; }
 if(G.scene==='garage'){
   if(id==='exit'){ G.scene='outside'; G.px=2080;G.tx=2080; showToast('Back outside'); return; }
   if(id==='crowbar'&&!G.flags.crowbar){ G.flags.crowbar=true; addItem('crowbar'); startDialogue([{who:'DEKE',text:'Crowbar acquired. Moop, no, you cannot name it.'},{who:'MOOP',text:'Sir Prys-A-Lot!'}]); return; }
   if(id==='ticket'&&!G.clues.ticket){ G.clues.ticket=true; showToast('Clue: Torn Ticket ('+clueCount()+'/3)'); updateObjective(); startDialogue([{who:'DEKE',text:'A torn Puddles ticket, hidden in the garage. Someone wanted this mystery to sell tickets.'}]); return; }
   if(id==='cap'&&!G.clues.cap){ G.clues.cap=true; showToast('Clue: Hank’s Cap ('+clueCount()+'/3)'); updateObjective(); startDialogue([{who:'MOOP',text:'It smells like engine oil and guilt! Mostly guilt! And oil!'}]); return; }
   if(id==='crate'){ if(G.flags.crate){examine('crate');return;} startDialogue([{who:'DEKE',text:'Sealed tighter than a jar lid at a picnic for the weak-wristed. I need leverage.'},{who:'MOOP',text:'CROWBAR! CROWBAR! I mean — a crowbar might help.'}]); return; }
   examine(id); return;
 }
 // outside
 if(id==='mug'&&!G.flags.mug){ G.flags.mug=true; addItem('mug'); startDialogue([{who:'MOOP',text:'Mug get! Now we are officially detectives with drinkware!'}]); return; }
 if(id==='toolbox'){ if(!G.flags.wrench){G.flags.wrench=true; addItem('wrench'); startDialogue([{who:'DEKE',text:'Borrowed a wrench. I left an IOU written in heroic cursive.'}]);} else examine('toolbox'); return; }
 if(id==='hank'){
   G.flags.metHank=true;
   startDialogue([{who:'HANK',text:'Mornin’, officers. Shame ’bout Puddles. One day he’s a landmark, next day he’s… gone.'},{who:'DEKE',text:'Any idea who’d move a two-tonne possum, Hank?'},{who:'HANK',text:'Somebody with a crane, a grudge, or a gift shop that just ordered 400 “MISSING PUDDLES” shirts. Not me. I was… polishing my cap. Indoors. Alone.'},{who:'MOOP',text:'Super specific alibi! My favourite kind!'}]); return;
 }
 if(id==='luanne'){
   G.flags.metLuanne=true;
   if(has('coffee')){
     startDialogue([{who:'LUANNE',text:'Is that… is that real coffee? After the machine died I’ve been running on spite and grape soda.'},{who:'DEKE',text:'Fixed the machine. Trade you this mug for the garage key?'},{who:'LUANNE',text:'Honey, for this you can have the key, the donut tray, and my firstborn’s parking spot. Find Puddles!'}],()=>{ removeItem('coffee'); G.flags.key=true; addItem('key'); updateObjective(); });
   } else if(G.flags.key){
     startDialogue([{who:'LUANNE',text:'Key’s yours, sugar. Garage is Hank’s domain, so mind the… everything.'}]);
   } else {
     startDialogue([{who:'LUANNE',text:'Welcome to Pete’s Pit Stop! Home of the Giant Possum — formerly. Now we’re home of the Giant Absence.'},{who:'DEKE',text:'We need the garage key, Luanne.'},{who:'LUANNE',text:'And I need coffee before I commit a felony before noon. Fix that machine, bring me a full mug, and the key is yours.'},{who:'MOOP',text:'A coffee quest! The noblest quest!'}],()=>updateObjective());
   } return;
 }
 if(id==='coffeemachine'){
   if(!G.flags.coffeeFixed){ startDialogue([{who:'DEKE',text:'It rattles, it wheezes, it judges me. Something’s loose inside. If only I had a wrench and zero respect for warranties.'}]); return; }
   if(has('mug')){ removeItem('mug'); G.flags.coffee=true; addItem('coffee'); startDialogue([{who:'MOOP',text:'IT LIVES! Smell that? That’s justice brewing at 96 degrees!'}]); return; }
   if(has('coffee')){ startDialogue([{who:'DEKE',text:'One mug is enough. Last time Moop had two, he vibrated into next Tuesday.'}]); return; }
   startDialogue([{who:'DEKE',text:'The machine works now. I need a mug. Ideally one that hasn’t contained bait.'}]); return;
 }
 if(id==='garageDoor'){
   if(G.flags.garage){ G.scene='garage'; G.px=180;G.tx=180; showToast('Inside the garage'); return; }
   if(has('key')){ G.flags.garage=true; removeItem('key'); updateObjective(); startDialogue([{who:'DEKE',text:'The donut key turns. Somewhere, a locksmith just felt a disturbance.'},{who:'MOOP',text:'TO THE SECRET STINK CAVE!'}],()=>{G.scene='garage';G.px=180;G.tx=180;}); return; }
   startDialogue([{who:'DEKE',text:'Locked. I could pick it, but the last lock I picked turned out to be a very angry accordion.'}]); return;
 }
 if(id==='pedestal'){
   if(clueCount()>=3){ overlay='accuse'; accuseIndex=0; return; }
   startDialogue([{who:'DEKE',text:'Puddles vanished last night. No drag marks toward the road — just staged muddy prints, like someone wanted a trail to find.'},{who:'MOOP',text:'We need three solid clues before we point fingers! Pointing is my cardio, I am READY.'}]); return;
 }
 examine(id);
}
function useItemOn(item,target){
 const done=()=>{ selectedItem=null; };
 if(item==='wrench'&&target==='coffeemachine'){ if(G.flags.coffeeFixed){startDialogue([{who:'DEKE',text:'Already fixed. Wrenching it again would just be showing off.'}]);} else {G.flags.coffeeFixed=true; beep(180,.2,'sawtooth',.15); startDialogue([{who:'DEKE',text:'One loose bolt, two crossed wires, and a jellybean in the filter. Classic.'},{who:'MOOP',text:'The machine is ALIVE! Pour, pour, pour!'}]);} done(); return; }
 if(item==='mug'&&target==='coffeemachine'){ selectedItem=null; interact('coffeemachine'); return; }
 if(item==='coffee'&&(target==='luanne')){ selectedItem=null; interact('luanne'); return; }
 if(item==='key'&&target==='garageDoor'){ selectedItem=null; interact('garageDoor'); return; }
 if(item==='crowbar'&&target==='crate'){ if(G.flags.crate){startDialogue([{who:'DEKE',text:'Already open. The secret’s out and it’s wearing a possum head.'}]);} else {G.flags.crate=true; jingle(true); startDialogue([{who:'DEKE',text:'Inside the crate… the Puddles costume head. Foam, felt, and flop sweat.'},{who:'MOOP',text:'Puddles was TWO GUYS IN A SUIT?!'} ,{who:'DEKE',text:'Worse, Moop. Puddles was a costume Hank wore for photos. He hid it to invent a mystery and save the gift shop.'}],()=>updateObjective());} done(); return; }
 if(item==='chicken'){ startDialogue([{who:'MOOP',text:'The chicken solves nothing and improves everything. As is tradition.'}]); done(); return; }
 startDialogue([{who:'DEKE',text:'That combination violates physics, etiquette, or both.'},{who:'MOOP',text:'Try it anyway? No? Fine, be a coward, physics.'}]); done();
}
function doAccuse(i){
 overlay=null;
 const suspects=['Luanne','Hank','Moop','Pete (never seen)'];
 if(i===1){ state='win'; jingle(true); }
 else { state='lose'; jingle(false); }
}
// ===== DRAW HELPERS (cel / ink) =====
function ink(x,y,w,h,fill,r=0){ ctx.fillStyle=fill; ctx.strokeStyle='#111'; ctx.lineWidth=5; ctx.beginPath(); if(r)ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); ctx.fill(); ctx.stroke(); }
function circ(x,y,r,fill){ ctx.fillStyle=fill; ctx.strokeStyle='#111'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.stroke(); }
function line(x1,y1,x2,y2,w=5,col='#111'){ ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function txt(t,x,y,size=28,col='#111',align='left',bold=true){ ctx.fillStyle=col; ctx.font=(bold?'900 ':'')+size+'px "Trebuchet MS","Comic Sans MS",Verdana,sans-serif'; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.fillText(t,x,y); }
function panel(x,y,w,h,fill='#fff8dc'){ ink(x,y,w,h,fill,14); }
function halftone(x,y,w,h){ ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip(); ctx.fillStyle='rgba(0,0,0,.18)'; for(let i=x+8;i<x+w;i+=18)for(let j=y+8;j<y+h;j+=18){ctx.beginPath();ctx.arc(i,j,3,0,7);ctx.fill();} ctx.restore(); }
function wrapText(t,x,y,maxW,lh,size=26,col='#111'){ ctx.fillStyle=col; ctx.font='700 '+size+'px "Trebuchet MS",Verdana,sans-serif'; ctx.textAlign='left'; const words=t.split(' '); let ln='',yy=y; for(const w of words){ const test=ln?ln+' '+w:w; if(ctx.measureText(test).width>maxW&&ln){ctx.fillText(ln,x,yy); yy+=lh; ln=w;} else ln=test; } if(ln)ctx.fillText(ln,x,yy); return yy; }

// CHARACTERS
function drawDeke(x,y,dir,walking){
 const bob=walking?Math.sin(time*14)*6:Math.sin(time*2)*2; y+=bob;
 ctx.save(); ctx.translate(x,y); ctx.scale(dir,1);
 // legs
 line(-12,-70,-16,0,10); line(14,-70,20,0,10);
 ink(-28,-150,56,86,'#2a7f7a',8); // teal suit
 ink(-8,-150,16,70,'#fff',4); ink(-3,-145,10,44,'#ff7a1a',3); // shirt+tie
 circ(0,-178,34,'#c98a4a'); // head
 ink(-38,-182,22,44,'#8a5a2a',10); // ear
 ctx.fillStyle='#c98a4a'; ctx.strokeStyle='#111'; ctx.lineWidth=5; ctx.beginPath(); ctx.ellipse(28,-168,26,16,0,0,7); ctx.fill(); ctx.stroke(); // snout
 circ(38,-162,4,'#111'); circ(8,-186,5,'#fff'); ctx.fillStyle='#111'; ctx.fillRect(5,-189,6,6);
 ink(-36,-222,72,18,'#5a3a1a',6); ink(-22,-238,44,20,'#5a3a1a',6); // fedora
 line(24,-120,58,-84,9); // arm
 ctx.restore();
 if(SETTINGS.subtitles) txt('DEKE',x,y-260,16,'#111','center');
}
function drawMoop(x,y){
 const hop=Math.abs(Math.sin(time*6))*18; y-=hop;
 ctx.save(); ctx.translate(x,y);
 ink(-18,-64,36,58,'#f2f2f2',12);
 // ears
 ink(-22,-150,14,72,'#f2f2f2',7); ink(8,-150,14,72,'#f2f2f2',7); ctx.fillStyle='#ff9eb5'; ctx.fillRect(-19,-142,8,50); ctx.fillRect(11,-142,8,50);
 circ(0,-92,26,'#fff'); circ(-8,-96,4,'#111'); circ(10,-96,4,'#111');
 ctx.fillStyle='#111'; ctx.fillRect(-10,-82,20,4); // grin teeth
 ctx.fillStyle='#fff'; ctx.fillRect(-8,-82,16,8); ctx.strokeStyle='#111'; ctx.strokeRect(-8,-82,16,8);
 circ(0,-62,7,'#ff4f7a'); // bowtie-ish nose/pin
 line(-14,-30,-28,4,7); line(14,-30,28,4,7);
 ctx.restore(); txt('MOOP',x,y-165,16,'#111','center');
}
function drawLuanne(x,y){ ink(x-42,y-130,84,130,'#ff8fb2',10); circ(x,y-158,30,'#f2c19a'); ink(x-34,y-198,68,28,'#7a3a1a',12); txt('LUANNE',x,y-215,15,'#111','center'); }
function drawHank(x,y){ ink(x-38,y-118,76,118,'#3a6ea8',10); ink(x-14,y-118,28,80,'#d94f30',4); circ(x,y-142,28,'#e8b08a'); ink(x-30,y-170,60,16,'#222',6); ctx.fillStyle='#666'; ctx.fillRect(x-18,y-128,36,10); txt('HANK',x,y-185,15,'#111','center'); }

function drawOutside(){
 // sky bands cel
 ctx.fillStyle='#79c7e3'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#9adcf5'; ctx.fillRect(0,0,W,180); halftone(0,520,W,200);
 // sun
 circ(1120,105,52,'#ffd83d'); line(1120,30,1120,10,6); line(1050,105,1025,105,6);
 // clouds parallax

const TITLE_ITEMS=['▶ Start Case','How to Play','About / Credits','Settings'];
function handleMenuConfirm(){
 if(state==='title'){ const i=menuIndex; if(i===0){resetGame(); state='play'; jingle(true);} else if(i===1)state='howto'; else if(i===2)state='about'; else {prevState='title'; state='settings';} }
 else if(state==='howto'||state==='about') state='title';
 else if(state==='win'||state==='lose'){ if(menuIndex===0){resetGame(); state='play';} else state='title'; }
}
function handleKey(k){
 const key=k.toLowerCase();
 if(state==='attract'){ state='title'; return; }
 if(state==='title'||state==='win'||state==='lose'){ const max=state==='title'?3:1; if(key==='arrowup'||key==='w')menuIndex=(menuIndex+max)%(max+1); if(key==='arrowdown'||key==='s')menuIndex=(menuIndex+1)%(max+1); if(key==='enter'||key==='e'||key===' ')handleMenuConfirm(); return; }
 if(state==='howto'||state==='about'){ if(key==='escape'||key==='b'||key==='enter'||key==='e')state='title'; return; }
 if(state==='settings'){ handleSettingsKey(key); return; }
 if(state!=='play')return;
 if(dialogue){ if(key==='e'||key==='enter'||key===' ')advanceDialogue(); return; }
 if(overlay==='inventory'){ if(key==='i'||key==='tab'||key==='escape'||key==='q'){overlay=null;} if(key==='arrowleft'||key==='a')invIndex=Math.max(0,invIndex-1); if(key==='arrowright'||key==='d')invIndex=Math.min(G.inv.length-1,invIndex+1); if(key==='arrowup'||key==='w')invIndex=Math.max(0,invIndex-4); if(key==='arrowdown'||key==='s')invIndex=Math.min(G.inv.length-1,invIndex+4); if((key==='e'||key==='enter')&&G.inv[invIndex]){selectedItem=G.inv[invIndex]; overlay=null; showToast('Selected: '+ITEMS[selectedItem].name+' — now interact with something');} return; }
 if(overlay==='pause'){ if(key==='escape'){overlay=null;return;} if(key==='arrowup'||key==='w')menuIndex=(menuIndex+4)%5; if(key==='arrowdown'||key==='s')menuIndex=(menuIndex+1)%5; if(key==='enter'||key==='e'){ if(menuIndex===0)overlay=null; else if(menuIndex===1){overlay='inventory';} else if(menuIndex===2){ if(clueCount()<3){overlay=null; startDialogue([{who:'DEKE',text:'We need 3 clues before accusing anyone. Finger-pointing without evidence is just jazz hands.'}]);} else {overlay='accuse';} } else if(menuIndex===3){overlay=null; prevState='play'; state='settings';} else {overlay=null; state='title';} } return; }
 if(overlay==='accuse'){ if(key==='escape'||key==='q')overlay=null; if(key==='arrowup'||key==='w')accuseIndex=(accuseIndex+3)%4; if(key==='arrowdown'||key==='s')accuseIndex=(accuseIndex+1)%4; if(key==='enter'||key==='e')doAccuse(accuseIndex); return; }
 // play keys
 if(key==='escape'){overlay='pause'; menuIndex=0; return;}
 if(key==='i'||key==='tab'){overlay='inventory'; invIndex=0; return;}
 if(key==='e'||key==='enter'){ if(hoverHotspot){G.pending={id:hoverHotspot.id,examine:false}; G.tx=hoverHotspot.wx; G.dir=hoverHotspot.wx>=G.px?1:-1;} }
 if(key==='q'){ if(hoverHotspot){G.pending={id:hoverHotspot.id,examine:true}; G.tx=hoverHotspot.wx; G.dir=hoverHotspot.wx>=G.px?1:-1;} }
}
function handleSettingsKey(key){
 const opts=4;
 if(key==='escape'||key==='b'){ state=prevState==='play'?'play':'title'; if(prevState==='play')overlay='pause'; return; }
 if(key==='arrowup'||key==='w')settingsIndex=(settingsIndex+opts)%(opts+1);
 if(key==='arrowdown'||key==='s')settingsIndex=(settingsIndex+1)%(opts+1);
 if(key==='arrowleft'||key==='a'||key==='arrowright'||key==='d'){ const d=(key==='arrowright'||key==='d')?1:-1;
   if(settingsIndex===0)SETTINGS.volume=clamp(+(SETTINGS.volume+d*.1).toFixed(2),0,1);
   if(settingsIndex===1)SETTINGS.textSpeed=clamp(+(SETTINGS.textSpeed+d*.5).toFixed(1),.5,3);
   if(settingsIndex===2)SETTINGS.shake=!SETTINGS.shake;
   if(settingsIndex===3)SETTINGS.subtitles=!SETTINGS.subtitles;
   beep(600,.06,'square',.1);
 }
 if((key==='enter'||key==='e')&&settingsIndex===4){ state=prevState==='play'?'play':'title'; }
}
function pollGamepad(){
 const gps=navigator.getGamepads?navigator.getGamepads():[]; let gp=null; for(const g of gps)if(g){gp=g;break;} if(!gp)return;
 const btn=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
 const edge=i=>{ const b=btn(i); const was=padPrev[i]||false; padPrev[i]=b; return b&&!was; };
 // stick moves cursor in play, navigates menus
 const ax=gp.axes[0]||0, ay=gp.axes[1]||0;
 if(Math.abs(ax)>.2||Math.abs(ay)>.2){ anyInput(); if(state==='play'&&!dialogue&&!overlay){ cursor.x=clamp(cursor.x+ax*14,0,W); cursor.y=clamp(cursor.y+ay*14,0,H); } }
 if(edge(12)||edge(13)||edge(14)||edge(15)||edge(0)||edge(1)||edge(2)||edge(3)||edge(9)){ anyInput();
   // map dpad to keys
   if(state==='title'||state==='win'||state==='lose'){ if(btn(12))handleKey('ArrowUp'); if(btn(13))handleKey('ArrowDown'); if(btn(0))handleMenuConfirm(); return; }
   if(state==='settings'){ if(btn(12))handleSettingsKey('arrowup'); if(btn(13))handleSettingsKey('arrowdown'); if(btn(14))handleSettingsKey('arrowleft'); if(btn(15))handleSettingsKey('arrowright'); if(btn(1))handleSettingsKey('escape'); return; }
   if(state==='howto'||state==='about'){ if(btn(1)||btn(0))state='title'; return; }
   if(state==='play'){
     if(dialogue){ if(btn(0))advanceDialogue(); return; }
     if(overlay){ // reuse keyboard logic via synthetic keys
       if(overlay==='inventory'){ if(btn(3)||btn(1))overlay=null; if(btn(14))invIndex=Math.max(0,invIndex-1); if(btn(15))invIndex=Math.min(G.inv.length-1,invIndex+1); if(btn(0)&&G.inv[invIndex]){selectedItem=G.inv[invIndex]; overlay=null; showToast('Selected: '+ITEMS[selectedItem].name);} }
       else if(overlay==='accuse'){ if(btn(1))overlay=null; if(btn(12))accuseIndex=(accuseIndex+3)%4; if(btn(13))accuseIndex=(accuseIndex+1)%4; if(btn(0))doAccuse(accuseIndex); }
       else if(overlay==='pause'){ if(btn(1))overlay=null; if(btn(12))menuIndex=(menuIndex+4)%5; if(btn(13))menuIndex=(menuIndex+1)%5; if(btn(0))handleKey('enter'); /* fallback */ }
       return;
     }
     if(btn(9)){overlay='pause'; menuIndex=0; return;}
     if(btn(3)){overlay='inventory'; invIndex=0; return;}
     if(btn(2)&&hoverHotspot){G.pending={id:hoverHotspot.id,examine:true}; G.tx=hoverHotspot.wx;}
     if(btn(0)&&hoverHotspot){G.pending={id:hoverHotspot.id,examine:false}; G.tx=hoverHotspot.wx;}
     // dpad cycles hotspots
     if(btn(12)||btn(13)||btn(14)||btn(15)){ const hs=hotspots(); let idx=hs.indexOf(hoverHotspot); idx=(idx+1)%hs.length; const h=hs[idx]; cursor.x=(h.x+h.w/2)-(G.scene==='outside'?G.camX:0); cursor.y=h.y+h.h/2; }
   }
 }

}

// UPDATE
let attractStep=0, attractTimer=0;
const ATTRACT_SPOTS=[300,560,860,1180,1550,2050,900];
function update(dt){
 time+=dt; if(toastT>0)toastT-=dt;
 if(state==='title'&&performance.now()-lastInput>10000){ state='attract'; attractT=0; attractStep=0; resetGame(); }
 if(state==='attract'){
   attractT+=dt; attractTimer+=dt;
   const target=ATTRACT_SPOTS[attractStep%ATTRACT_SPOTS.length];
   G.tx=target; if(Math.abs(G.px-target)<20&&attractTimer>1){ attractTimer=0; attractStep++; if(attractStep%3===0){ startDialogue([{who:attractStep%2?'MOOP':'DEKE',text:attractStep%2?'Behold! Coffee quests! Costume crime! Zero adult supervision!':'Puddles is missing. The trail smells of mud, tickets, and theatre kids.'}]); } }
   if(dialogue){ dialogue.shown=Math.min(dialogue.full.length,dialogue.shown+dt*40*SETTINGS.textSpeed); if(attractTimer>2.5){ dialogue=null; dialogueQueue=[]; } }
 }
 if(state!=='play'&&state!=='attract')return;
 // dialogue typewriter
 if(dialogue){ const before=Math.floor(dialogue.shown); dialogue.shown=Math.min(dialogue.full.length,dialogue.shown+dt*55*SETTINGS.textSpeed); if(Math.floor(dialogue.shown)>before&&(Math.floor(dialogue.shown)%4===0))sayBlip(dialogue.who); }
 // player walk
 if(!dialogue&&!overlay){
   const dx=G.tx-G.px; if(Math.abs(dx)>6){ G.dir=dx>0?1:-1; G.px+=clamp(dx,-260*dt,260*dt); G.walk+=dt; } 
   else if(G.pending){ const p=G.pending; G.pending=null; if(p.examine)examine(p.id); else interact(p.id); }
 }
 // moop follows (store world/screen)
 const targetMoop=G.px-90*G.dir; G.moopscreenX=(G.moopscreenX===undefined?targetMoop:G.moopscreenX); // world-ish? For outside we treat moopscreenX as world x: keep simple
 // Actually moop world follows px
 G.moopscreenX+= (targetMoop-G.moopscreenX)*Math.min(1,dt*4);
 // camera
 if(G.scene==='outside') G.camX=clamp(G.px-560,0,1120); else G.camX=0;
 // hover
 if(state==='play'){ const wx=cursor.x+(G.scene==='outside'?G.camX:0); hoverHotspot=hotspotAt(wx,cursor.y); 
   // keyboard cursor move
   const sp=420*dt; if(keys['arrowleft']||keys['a'])cursor.x-=sp; if(keys['arrowright']||keys['d'])cursor.x+=sp; if(keys['arrowup']||keys['w'])cursor.y-=sp; if(keys['arrowdown']||keys['s'])cursor.y+=sp; cursor.x=clamp(cursor.x,0,W); cursor.y=clamp(cursor.y,0,H);
   // hotspot cycling with Tab handled, also ,/. 
 }
 pollGamepad();
}

 ctx.clearRect(-20,-20,W+40,H+40);
 if(state==='title') drawMenu('title',TITLE_ITEMS,menuIndex);
 else if(state==='win'){ ctx.fillStyle='#79c7e3'; ctx.fillRect(0,0,W,H); panel(240,140,800,440,'#fff8dc'); txt('CASE CRACKED!',640,230,52,'#111','center'); wrapText('Hank hid the Puddles costume to invent a mystery, sell “MISSING” shirts, and save the Pit Stop. The town forgives him after he agrees to wear the costume every weekend — twice on holidays.',340,290,600,34,24); drawDeke(540,560,1,false); drawMoop(700,580); txt(menuIndex===0?'▶ Play Again':'  Play Again',640,500,28,'#111','center'); txt(menuIndex===1?'▶ Back to Title':'  Back to Title',640,540,28,'#111','center'); }
 else if(state==='lose'){ ctx.fillStyle='#2b2d42'; ctx.fillRect(0,0,W,H); panel(240,140,800,440,'#fff8dc'); txt('CASE BUNGLED!',640,230,52,'#c00','center'); wrapText('You accused the wrong suspect. The real culprit shreds the evidence, Puddles merch vanishes, and Moop is legally required to do the sad trombone. Gather the muddy prints, torn ticket, and Hank’s cap next time.',340,290,600,34,24); txt(menuIndex===0?'▶ Try Again':'  Try Again',640,500,28,'#111','center'); txt(menuIndex===1?'▶ Back to Title':'  Back to Title',640,540,28,'#111','center'); }
 else if(state==='howto') drawTextScreen('HOW TO PLAY',['PS5 Controller (primary):  Left Stick — move cursor  •  ✕ Cross — Interact / Confirm  •  □ Square — Look / Examine  •  △ Triangle — Inventory  •  ○ Circle — Back / Close  •  Options — Pause  •  D-Pad — Cycle hotspots / Navigate menus','Keyboard:  WASD / Arrows — Move cursor  •  E / Enter — Interact  •  Q — Examine  •  I / Tab — Inventory  •  Esc — Pause','Mouse:  Move to hover, Click — Walk & Interact, Right-Click — Examine.','Goal: Puddles the Giant Possum is missing. Fix the coffee machine (find a wrench + mug), trade coffee for the Garage Key, search the garage, find 3 clues, then accuse the right culprit. Accuse wrong and the case is bungled.','Inventory: Open the bag, select an item with ✕, then interact with the world to use it — Wrench → Coffee Machine, Mug → Coffee Machine, Coffee → Luanne, Key → Garage, Crowbar → Crate.']);
 else if(state==='about') drawTextScreen('ABOUT / CREDITS',['DEKE & MOOP HIT THE ROUNDABOUT — A freelance-police road mystery about a missing giant possum, weaponised coffee, and a gift shop in crisis.','Source Information','Initial Date: 2026-10-17','SOURCE: Sam and Max Hit the Road','Tech/Engine: Vanilla JavaScript (ES2025), HTML5 Canvas 2D, Web Audio API — no external libraries; single-file build','Environment: Muse Code CLI; Linux; modern Chromium-based browser','Model and Effort Level: Meta, muse-wonder-1.0, unknown','Art: Cel-shaded ink treatment — thick outlines, flat colour, halftone shade, hand-drawn roadside Americana. Original characters: Deke (dog detective) & Moop (rabbit menace). No assets from the source game were used.']);
 else if(state==='settings'){ ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,0,W,H); panel(240,110,800,500,'#fff8dc'); txt('SETTINGS',640,160,40,'#111','center'); const rows=['Master Volume: '+Math.round(SETTINGS.volume*100)+'%','Text Speed: '+SETTINGS.textSpeed.toFixed(1)+'x','Screen Shake: '+(SETTINGS.shake?'ON':'OFF'),'Name Labels: '+(SETTINGS.subtitles?'ON':'OFF'),'Back']; rows.forEach((r,i)=>{ if(i===settingsIndex)ink(300,210+i*62,680,48,'#ffd60a',10); txt(r,640,235+i*62,28,'#111','center'); }); txt('←→ Adjust   ↑↓ Select   ○ Back',640,660,20,'#fff','center'); }
 else if(state==='play'||state==='attract'){ if(G.scene==='garage')drawGarageScene(); else drawOutside(); drawHUD(); drawDialogue(); drawOverlay(); if(state==='attract'){ ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,64); txt('✦ ATTRACT MODE — AI DEMO  •  Press any button / key to play ✦',640,32,24,'#ffd60a','center'); panel(340,620,600,54,'#ffd60a'); txt('DEMO PLAYING — ANY INPUT RETURNS TO TITLE',640,647,20,'#111','center'); } }
 ctx.restore();
}
let lastT=performance.now();
function loop(now){ const dt=Math.min(.05,(now-lastT)/1000); lastT=now; update(dt); render(); pressed={}; requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
