function compactCareer(){
 if(S.bookings.length>240){const recent=new Set(S.bookings.filter(b=>b.status!=='booked').slice(-200).map(b=>b.id));S.bookings=S.bookings.filter(b=>b.status==='booked'||recent.has(b.id));}
 if(S.clients.length>500){const required=new Set([...S.leads.map(l=>l.client),...S.bookings.map(b=>b.client),S.lastReport?.client]);const pinned=S.clients.filter(c=>required.has(c.id));const rest=S.clients.filter(c=>!required.has(c.id)).sort((a,b)=>(b.visits>0)-(a.visits>0)||(b.lastDay||0)-(a.lastDay||0));S.clients=[...pinned,...rest.slice(0,Math.max(0,500-pinned.length))];}
}

function createClient(first=false){
 const topics=Object.keys(TOPICS),name=first?'Mina':pick(NAMES),topic=first?'nature':pick(topics),trust=first?94:Math.round(38+rand()*59),rr=first?12:Math.round(rand()*72);

 const value=(S.rate*(.84+rand()*.23)+(S.staff.manager?10:0))*(1+event().demand);
 S.leads.push({id:'l'+S.day+'_'+Math.floor(rand()*1e8),client:c.id,venue,offer:Math.round(Math.min(c.budget,value)/5)*5,deposit:!!S.policies.deposit,counter:0,status:'new',day:S.day,message:first?'I’m new in town and would love a relaxed café visit. A good conversation is more my thing than a big night out.':pick(['A little company for a free afternoon. I’d love to hear what you enjoy about this town.','I have a break from a busy week. Could we plan something unhurried?','I’m visiting for a few days and would enjoy seeing the town with someone local.','I’ve been meaning to make time for an outing. What would you recommend?'])});

function renderLead(){const l=getLead(ui.detail);if(!l||l.status!=='new')return modalHead('ENQUIRY','This enquiry is closed.')+`<div class="modal-body">${btn('Back to enquiries','open','data-page="inbox"')}</div>`;const c=getClient(l.client),slots=nextSlots();return modalHead('SET THE TONE',`An enquiry from ${esc(c.name)}.`,`Ninety minutes at ${VENUES[l.venue].name}. Your attention has value; your boundaries do not have a price.`)+`<div class="modal-body"><div class="client-detail"><div><div class="client-head"><div class="portrait">${portrait(c)}</div><div><h3>${esc(c.name)}, ${c.age}</h3><small>${c.vibe} · ${c.visits} completed dates</small></div></div><p class="story-quote">“${esc(l.message)}”</p><div class="pill-row">${pill(riskLabel(c),c.screened&&risk(c)>40?'red':'blue')}${pill(c.visits>=2?'Known regular':'New connection')}</div>${c.screened?`<div class="banner ${c.trust<60?'warm':''}"><strong>Reference check complete</strong><br>${c.trust>75?'Reliable payment history.':c.trust>55?'Limited payment references.':'Payment references are inconsistent.'}<br>${c.risk<25?'No boundary concerns reported.':c.risk<50?'One report of pushing for last-minute changes.':'Repeated boundary concerns reported. Declining is a sound choice.'}<br>Enjoys ${TOPICS[c.topic]}.<br>Comfortable budget: up to ${money(Math.round(c.budget*(1+skillLevel('negotiation')*.045)))}.</div>`:`<p class="muted" style="font-size:12px;line-height:1.8">An appealing profile is not a reference. A check reveals interests, payment history, and reported boundary concerns.</p>${btn('Check references · $8 / 15 min','screen',`data-id="${l.id}"`,'secondary full')}`}<div class="button-row">${btn('Decline politely','decline',`data-id="${l.id}"`,'secondary small')}${btn('Block client','block',`data-id="${c.id}"`,'danger small')}</div></div><div class="card"><span class="eyebrow">AGREE BEFORE YOU MEET</span><h3 style="margin-top:10px">${money(l.offer)} <small style="font:10px system-ui;color:var(--muted)">current offer</small></h3><p>${l.counter?'The client has responded to your price. You can accept, counter once more, or walk away.':'Counter with a rate that respects your time. High offers are not always accepted.'}</p><div class="input-row"><label class="field">Your counteroffer<input id="counterAmount" type="number" min="50" max="800" step="5" value="${S.rate}"></label>${btn('Negotiate','counter',`data-id="${l.id}"`,'secondary')}</div><label class="check-row"><input type="checkbox" id="depositCheck" ${l.deposit?'checked':''}><span>Require a 25% booking deposit<small>Reduces no-show and nonpayment exposure. Refunded if you cancel. Collected when you confirm.</small></span></label><label class="field">Choose a time<select id="bookingSlot">${slots.map(s=>`<option value="${s.day}|${s.time}">${s.day===S.day?'Today':'Tomorrow'} · ${clock(s.time)}–${clock(s.time+90)}</option>`).join('')||'<option>No slots available</option>'}</select></label><div class="meta">${region().permit&&S.permitUntil<S.day?'<strong class="negative">Events pass needed. Renew it at the Guild before booking.</strong>':`Venue cost: ${money(VENUES[l.venue].fee)} · ${Math.round(MODELS[S.model].cut*100)}% model commission`}<br>Public venue · agreed end time · no public photos ${S.policies.photos?'✓':'(optional)'}</div>${btn('Confirm this booking','book',`data-id="${l.id}" ${!slots.length?'disabled':''}`,'full')}<p style="font-size:10px;margin:12px 0 0">Booking sets the price. Travel, preparation, and the date itself still happen in the town.</p></div></div></div>`;}
function renderBookings(){const books=upcoming();return modalHead('MAKE ROOM FOR YOUR LIFE','Your calendar.','Dates last 90 minutes. Walking takes a little time. Arriving early lets you wait at the venue; 75 minutes late counts as a missed booking.')+`<div class="modal-body">${S.activeDate?`<div class="banner">Your current date is paused while you plan. ${btn('Resume date','resumeDate','','small')}</div>`:''}${books.length?`<div class="card-grid">${books.map(b=>{const c=getClient(b.client);return `<div class="card"><span class="eyebrow">DAY ${b.day} · ${clock(b.time)} – ${clock(b.time+90)}</span><div class="client-head" style="margin-top:17px"><div class="portrait">${portrait(c)}</div><div><h3>${esc(c.name)}</h3><small>${VENUES[b.venue].name}</small></div></div><div class="pill-row">${pill(riskLabel(c),c.screened?'blue':'gold')}${pill(b.deposit?money(b.deposit)+' deposit paid':'No deposit','gold')}</div><div class="offer-box"><span class="offer-price">${money(b.price)}</span>${btn('Walk to venue','navigateBooking',`data-id="${b.id}"`,'small')}</div><div class="button-row">${btn('Cancel & refund deposit','cancelBooking',`data-id="${b.id}"`,'secondary small')}</div></div>`;}).join('')}</div>`:`<div class="empty-state">${icon('calendar')}<h3>Your time is still yours.</h3><p>No upcoming bookings. Read the current enquiries to arrange a date on your terms.</p>${btn('Browse enquiries','open','data-page="inbox"')}</div>`}<div class="subheading">A LITTLE ROOM FOR YOURSELF</div><div class="banner">${S.relationship==='partner'?'Your partner':S.relationship==='solo'?'Your community':'Your close friend'} appreciates time together. Personal time is available at your cottage and in the gardens. Housing and staff cost <strong>${money(dailyCost())} each night</strong>.</div>${S.bookings.some(b=>b.status!=='booked')?`<div class="subheading">RECENT BOOKINGS</div><table class="table"><thead><tr><th>WHEN</th><th>CLIENT</th><th>STATUS</th><th>AGREED PRICE</th></tr></thead><tbody>${S.bookings.filter(b=>b.status!=='booked').slice(-8).reverse().map(b=>`<tr><td>Day ${b.day} · ${clock(b.time)}</td><td>${esc(getClient(b.client)?.name||'Past client')}</td><td>${esc(b.status)}</td><td>${money(b.price)}</td></tr>`).join('')}</tbody></table>`:''}</div>`;}
function renderClients(){const clients=S.clients.filter(c=>c.visits||c.screened||c.blocked);return modalHead('NAMES, NOT NUMBERS','Your client book.','Remember the small things, keep useful notes, and protect your time. Two completed dates make a regular.')+`<div class="modal-body">${clients.length?`<div class="card-grid">${clients.map(c=>`<div class="card"><div class="client-head"><div class="portrait">${portrait(c)}</div><div><h3>${esc(c.name)}</h3><small>${c.age} · ${c.visits} dates · ${c.visits>=2?'Regular':c.visits?'Previous client':'Screened enquiry'}</small></div></div><div class="pill-row">${pill(c.blocked?'Blocked':riskLabel(c),c.blocked?'red':'blue')}${c.screened?pill(TOPICS[c.topic]):''}</div><p>${c.notes?esc(c.notes):c.visits?'A thoughtful follow-up can turn one good meeting into an ongoing connection.':'No notes yet. Only record what is helpful and respectful.'}</p>${btn('Open client record','client',`data-id="${c.id}"`,'secondary small')}</div>`).join('')}</div>`:`<div class="empty-state">${icon('people')}<h3>The first page is blank.</h3><p>Screened and completed clients appear here. Keep their preferences and your own boundaries in one place.</p>${btn('Read enquiries','open','data-page="inbox"')}</div>`}</div>`;}
function renderClient(){const c=getClient(ui.detail);if(!c)return renderClients();return modalHead('A PROFESSIONAL CONNECTION',`${esc(c.name)}’s record.`,`Age ${c.age} · ${c.visits} completed dates · ${c.visits>=2?'Regular client':'Building familiarity'}`)+`<div class="modal-body"><div class="split"><div><div class="client-head"><div class="portrait">${portrait(c)}</div><div><h3>${esc(c.name)}</h3><small>${c.vibe} · ${c.screened?'References checked':'References not checked'}</small></div></div><div class="banner">${c.screened?`Enjoys ${TOPICS[c.topic]}.<br>${riskLabel(c)} with your current support setup.`:'Preferences and references are not verified.'}${c.visits?`<br>Last date quality: ${Math.round(c.quality)}/100.`:''}</div><p class="muted" style="font-size:12px;line-height:1.8">Inviting a past client creates an enquiry; it does not commit either of you to a booking. Blocked clients never receive invites or generate future enquiries.</p><div class="button-row">${btn('Invite back','invite',`data-id="${c.id}" ${c.blocked||!c.visits?'disabled':''}`)}${btn(c.blocked?'Unblock':'Block client','block',`data-id="${c.id}"`,'secondary')}</div></div><div><label class="field">Private professional notes<textarea id="clientNotes" maxlength="800" placeholder="Preferences, arrangements, boundaries…">${esc(c.notes)}</textarea><small>Stored only with this game’s save. No information is sent anywhere.</small></label>${btn('Save notes','saveNotes',`data-id="${c.id}"`,'secondary')}</div></div></div>`;}
function renderBusiness(){if(!ui.tab)ui.tab='practice';let body='';
 if(ui.tab==='practice')body=`<div class="split"><div class="card"><h3>Your time has value.</h3><p>Set an advertised rate for a 90-minute date. It shapes new offers, not signed bookings. Client budgets also depend on the region and daily demand.</p><label class="field">Advertised rate<input id="newRate" type="number" min="50" max="800" step="5" value="${S.rate}"><small>Current market: ${region().name} · ${Math.round(region().market*100)}% budget level · ${event().demand>=0?'+':''}${Math.round(event().demand*100)}% daily demand.</small></label>${btn('Update your rate','setRate')}<div class="subheading">YOUR CURRENT PRACTICE</div><div class="meta">${MODELS[S.model].name} · ${Math.round(MODELS[S.model].cut*100)}% commission<br>${money(dailyCost())} in nightly housing and staff costs<br>${S.profile?'Professional profile level '+S.profile:'A simple, honest profile'} · wardrobe level ${S.wardrobe}</div></div><div class="card"><h3>Clear boundaries.</h3><p>Clients see your booking terms. Upholding a boundary never damages your reputation.</p><label class="check-row"><input type="checkbox" data-policy="photos" ${S.policies.photos?'checked':''}><span>No identifiable public photos<small>Photo-sharing choices are unavailable during dates.</small></span></label><label class="check-row"><input type="checkbox" data-policy="venue" ${S.policies.venue?'checked':''}><span>Keep to the agreed public venue<small>No unplanned venue changes. All dates remain public.</small></span></label><label class="check-row"><input type="checkbox" data-policy="deposit" ${S.policies.deposit?'checked':''}><span>Ask new enquiries for a 25% deposit<small>A default for future enquiries; you can also set it before each booking.</small></span></label><div class="banner" style="margin:18px 0 0">You may decline any enquiry, end any date, or block a client. There is no unsafe content to unlock.</div></div></div>`;
 if(ui.tab==='reach')body=`<div class="metrics"><div class="metric"><small>REPUTATION</small><strong>${S.reputation.toFixed(2)} / 5</strong></div><div class="metric"><small>PROFILE LEVEL</small><strong>${S.profile} / 3</strong></div><div class="metric"><small>CAMPAIGN</small><strong>${S.adUntil>=S.day?S.adUntil-S.day+1+' days':'Off'}</strong></div></div><div class="card-grid"><div class="card"><h3>A considered profile.</h3><p>Better photography and clearer writing improve client matching. Each profile level adds two date-quality points; levels two and three improve daily reach.</p><div class="meta">Next upgrade: ${money(100+S.profile*65)} · 60 minutes<br>Available at Willow Creative Studio.</div><div class="button-row">${btn('Walk to the studio','navigate','data-id="studio"','secondary')}</div></div><div class="card"><h3>Reach the right people.</h3><p>A three-day local campaign adds two daily enquiries and one immediately. It increases visibility by six points, reducing privacy slightly.</p><div class="meta">Campaign: $65 · 30 minutes<br>Low-key referral cards: $20 · one enquiry, no privacy cost.</div><div class="button-row">${btn('Plan a campaign','navigate','data-id="studio"','secondary')}</div></div></div><div class="banner" style="margin-top:20px">High visibility is not automatically success. Good repeat clients can support a low-volume career without continuous advertising.</div>`;
 if(ui.tab==='team')body=`<div class="banner">Commissions are charged only on completed-date revenue, including tips and deposits. Staff wages are charged each night. Safety support lowers conflict probability but never removes your right to leave.</div><div class="card-grid">${Object.entries(MODELS).map(([id,m])=>`<div class="card"><span class="eyebrow">${Math.round(m.cut*100)}% COMMISSION</span><h3 style="margin-top:9px">${m.name}</h3><p>${m.desc}</p><div class="meta">Concern reduction: ${m.safety} points · ${m.reach} extra daily enquiries</div><div class="button-row">${btn(S.model===id?'Your current model':'Choose this model','setModel',`data-id="${id}" ${S.model===id?'disabled':''}`,S.model===id?'soft':'secondary')}</div></div>`).join('')}<div class="card"><h3>Your own support team.</h3><p>Available under any model. Wages begin tonight; releasing staff ends future wages immediately.</p><div class="settings-row"><div><h4>Safety coordinator</h4><p>$24/night · concern −24 · free safe calls</p></div>${btn(S.staff.security?'Release':'Hire','staff','data-id="security"','small secondary')}</div><div class="settings-row"><div><h4>Booking manager</h4><p>$18/night · one extra lead/day · better opening offers</p></div>${btn(S.staff.manager?'Release':'Hire','staff','data-id="manager"','small secondary')}</div></div></div><div class="subheading">A BUSINESS BEYOND YOUR OWN BOOKINGS</div><div class="card"><h3>${S.ownedStudio?'Your social events studio.':'Open a social events studio.'}</h3><p>${S.ownedStudio?'Your team hosts public arts and social events. Income varies with your reputation and marketing skill; operating costs are $55 each night.':'Build a small business hosting public social events. Requires 10 completed dates, 4.3 reputation, a booking manager, and $2,000 setup capital.'}</p><div class="meta">Typical nightly gross: $95–$155 + marketing skill.<br>All work is adult, consensual, non-sexual social hosting.</div><div class="button-row">${btn(S.ownedStudio?'Studio is operating':'Open your studio · $2,000','openStudio',S.ownedStudio?'disabled':'','secondary')}</div></div>`;
 if(ui.tab==='money')body=`<div class="metrics"><div class="metric"><small>AVAILABLE</small><strong>${money(S.cash)}</strong></div><div class="metric"><small>RESERVE</small><strong>${money(S.savings)}</strong></div><div class="metric"><small>NIGHTLY OVERHEAD</small><strong>${money(dailyCost())}</strong></div></div><div class="split"><div class="card"><h3>A little breathing room.</h3><p>Reserves are separate from spending money. Move funds back when needed. No interest, investment system, or hidden deductions.</p><label class="field">Amount<input id="transferAmount" type="number" min="1" max="1000000" step="10" value="100"></label><div class="button-row">${btn('Put in reserve','transfer','data-dir="in"','secondary')}${btn('Move to wallet','transfer','data-dir="out"','secondary')}</div></div><div class="card"><h3>Know your overhead.</h3><div class="receipt" style="margin:0"><div><span>Housing</span><span>${money(region().rent)}/night</span></div><div><span>Safety coordinator</span><span>${money(S.staff.security?24:0)}/night</span></div><div><span>Booking manager</span><span>${money(S.staff.manager?18:0)}/night</span></div><div><span>Studio operations</span><span>${money(S.ownedStudio?55:0)}/night</span></div><div><span>Utilities · every 7th night</span><span>$35</span></div><div><span>Outstanding starting debt</span><span>${money(S.debt)}</span></div></div><p style="font-size:10px;margin-top:15px">Starting debt repays up to $40 every seventh night. Negative cash does not end the game; Guild shifts and reserves offer recovery.</p></div></div><div class="subheading">RECENT TRANSACTIONS</div><table class="table"><thead><tr><th>DAY</th><th>DESCRIPTION</th><th>CHANGE</th></tr></thead><tbody>${S.ledger.slice(0,35).map(t=>`<tr><td>${t.day}</td><td>${esc(t.description)}</td><td class="${t.amount>=0?'positive':'negative'}">${t.amount>=0?'+':''}${money(t.amount)}</td></tr>`).join('')||'<tr><td colspan="3">No transactions yet.</td></tr>'}</tbody></table>`;
 if(ui.tab==='regions')body=`<div class="banner warm">These are invented markets with invented social-event rules, not models of real sex-work law. Moving cancels outstanding bookings and refunds their deposits. Client records and skills move with you.</div><div class="card-grid">${Object.entries(REGIONS).map(([id,r])=>`<div class="card"><span class="eyebrow">${Math.round(r.market*100)}% CLIENT BUDGET LEVEL</span><h3 style="margin-top:10px">${r.name}</h3><p>${r.desc}</p><div class="meta">Housing: ${money(r.rent)}/night<br>${r.rule}<br>Move cost: ${money(id==='moonleaf'?120:r.move)}</div><div class="button-row">${btn(S.region===id?'You live here':'Move to this region','moveRegion',`data-id="${id}" ${S.region===id?'disabled':''}`,'secondary')}</div></div>`).join('')}<div class="card"><h3>Your current events pass.</h3><p>${region().permit?S.permitUntil>=S.day?`Valid through day ${S.permitUntil}. It covers all your public bookings in Glassgarden.`:'Your pass is expired. Renew before confirming a booking or beginning a date.':'Your current region does not require a pass for public social dates.'}</p>${region().permit?btn('Visit the Guild','navigate','data-id="guild"','secondary'):''}</div></div>`;
 return modalHead('A BUSINESS THAT FITS YOUR LIFE','Your own kind of success.','Price thoughtfully, choose your support, and build something sustainable.')+`<div class="modal-body">${tabs([['practice','Practice & boundaries'],['reach','Marketing'],['team','Model & team'],['money','Finances'],['regions','Regions']])}${body}</div>`;
}
function renderLife(){if(!ui.tab)ui.tab='wellbeing';let body='';
 if(ui.tab==='wellbeing')body=`<div class="split"><div class="card"><h3>Check in with yourself.</h3>${Object.entries({energy:'Energy',stress:'Stress · lower is better',hygiene:'Freshness',health:'Health',privacy:'Privacy',connection:'Connection'}).map(([k,v])=>`<div class="skill"><div class="progress-row"><span>${v}</span><span>${Math.round(S.stats[k])}/100</span></div>${meter(S.stats[k],k==='stress'?S.stats[k]>55:S.stats[k]<30)}</div>`).join('')}<p style="font-size:10px">Energy and freshness affect date quality. Stress affects composure. Low health increases fatigue. Privacy pressure creates avoidable boundary events.</p></div><div><div class="card"><h3>${esc(S.name)}, ${S.age}.</h3><p>${esc(S.pronouns)} · ${S.background==='hospitality'?'Hospitality veteran':S.background==='artist'?'Freelance artist':S.background==='community'?'Community organizer':'A fresh start'}</p><div class="client-head"><div class="portrait">${portrait(S)}</div><div><small>Everyone’s identity is respected.<br>Appearance choices do not lock career paths.</small></div></div><div class="button-row">${btn('Go home & recharge','navigate','data-id="home"','secondary')}${btn('Visit the wellbeing house','navigate','data-id="clinic"','secondary')}</div></div><div class="banner" style="margin-top:16px">Rest is a business decision, not a failure. Sleep restores energy, but it does not replace friendship or a proper break.</div></div></div>`;
 if(ui.tab==='skills')body=`<div class="banner">Skills grow through play and paid training at the Guild. Each level improves its related system. Identity and body type never set skill limits.</div><div class="card-grid">${Object.entries(SKILLS).map(([k,v])=>{const lv=skillLevel(k),next=35*(lv+1)**2,progress=lv>=5?100:100*(S.skills[k]-35*lv**2)/(next-35*lv**2);return `<div class="card"><span class="eyebrow">LEVEL ${lv} / 5</span><h3 style="margin-top:8px">${v}</h3><p>${{conversation:'Listen well and make natural connections. Each level adds three starting quality points.',negotiation:'Read budgets and communicate value. Each level raises a client’s counteroffer ceiling by 4.5%.',screening:'See past first impressions. Each level removes three more concern points after reference checks.',marketing:'Reach clients who suit your practice. Each level adds a daily enquiry and improves studio income.',composure:'Hold your boundaries calmly. Each level reduces effective concern by three points and supports date recovery.'}[k]}</p>${meter(progress)}<div class="meta" style="margin-top:10px">${Math.floor(S.skills[k])} experience · ${lv===5?'Mastery reached':next+' for next level'}</div></div>`;}).join('')}</div><div class="button-row">${btn('Walk to the Guild','navigate','data-id="guild"','secondary')}</div>`;
 if(ui.tab==='circle')body=`<div class="split"><div class="card"><h3>${S.relationship==='partner'?'Someone to come home to.':S.relationship==='solo'?'A circle of your own.':'A friend who knows you.'}</h3><p>${S.relationship==='partner'?'Your partner knows what your work involves. Your relationship is built around honesty, time, and shared expectations—not a hidden exposure meter.':S.relationship==='solo'?'You value your independence. A peer circle and community friendships keep that independence from becoming isolation.':'Your friend Aya knows your profession and respects your choices. They still miss you when every evening becomes work.'}</p><div class="progress-row"><span>Connection</span><span>${Math.round(S.stats.connection)}/100</span></div>${meter(S.stats.connection)}<p style="margin-top:15px">${S.stats.connection>70?'“I’m glad you’ve been making room for us.”':S.stats.connection>35?'“No big plans needed. Just a little time together?”':'“I know life gets busy. I miss talking to you.”'}</p>${btn('Make a personal call · 30 min','call','','secondary')}</div><div class="card"><h3>Time without a price tag.</h3><p>Meet your circle in the gardens, spend a quiet evening at home, or call between bookings. Connection slowly fades when you never make time.</p><div class="meta">Garden catch-up: $8 · 60 min · connection +20<br>Evening at home: free · 90 min · connection +12<br>Personal call: free · 30 min · connection +8, once daily</div><div class="button-row">${btn('Go to the gardens','navigate','data-id="garden"','secondary')}${btn('A quiet evening at home','navigate','data-id="home"','secondary')}</div></div></div>`;
 return modalHead('YOU ARE MORE THAN YOUR WORK','The life around it.','Look after your energy, your craft, and the people who make life feel like yours.')+`<div class="modal-body">${tabs([['wellbeing','Wellbeing'],['skills','Skills'],['circle','Your circle']])}${body}</div>`;
}
function goals(){return [
 {id:'first',title:'The first good evening',desc:'Complete one date on your own terms.',done:S.totals.dates>=1},
 {id:'careful',title:'A thoughtful professional',desc:'Check references for three clients.',done:S.totals.screened>=3},
 {id:'regular',title:'A familiar face',desc:'Meet one client twice to build a regular relationship.',done:regulars()>=1},
 {id:'reserve',title:'Room to breathe',desc:'Build a reserve of $500.',done:S.savings>=500},
 {id:'craft',title:'Good company is a craft',desc:'Complete five dates with quality of 85 or better.',done:S.totals.excellent>=5},
 {id:'balance',title:'A life in balance',desc:'Finish seven working days with connection at 70+, health at 75+, and stress below 35.',done:S.totals.completedDays>=7&&S.stats.connection>=70&&S.stats.health>=75&&S.stats.stress<35}
 ];}

function renderJournal(){if(!ui.tab)ui.tab='goals';let body='';
 if(ui.tab==='goals')body=`<div class="metrics"><div class="metric"><small>DATES COMPLETED</small><strong>${S.totals.dates}</strong></div><div class="metric"><small>REGULAR CLIENTS</small><strong>${regulars()}</strong></div><div class="metric"><small>EXCELLENT DATES</small><strong>${S.totals.excellent}</strong></div></div><div class="goal-list">${goals().map(g=>`<div class="goal-row ${S.awards.includes(g.id)?'complete':''}">${icon(S.awards.includes(g.id)?'check':'leaf')}<div><h4>${g.title}</h4><p>${g.desc}</p></div></div>`).join('')}</div><div class="subheading">CHOOSE WHEN THIS CHAPTER IS COMPLETE</div><div class="card-grid"><div class="card"><h3>Financial freedom.</h3><p>Finish with $3,000 in reserves, no starting debt, and at least eight completed dates.</p>${btn('Close the chapter','ending','data-id="freedom"','secondary')}</div><div class="card"><h3>A sustainable practice.</h3><p>Reach day 15 with three regular clients, health 75+, connection 65+, and stress below 40.</p>${btn('Close the chapter','ending','data-id="balance"','secondary')}</div><div class="card"><h3>A studio of your own.</h3><p>Open an events studio, earn a 4.4 reputation, and keep $500 in reserve.</p>${btn('Close the chapter','ending','data-id="studio"','secondary')}</div><div class="card"><h3>Keep growing.</h3><p>There is no fixed time limit or forced failure ending. Chapter endings record an achievement; you may keep playing afterward.</p></div></div>`;

function renderSettings(){return modalHead('MAKE YOURSELF AT HOME','Settings & saves.','The game is fully offline. Your career stays in this browser unless you export a save file.')+`<div class="modal-body"><div class="settings-row"><div><h4>Consequences</h4><p>Gentle reduces client concern by 10 points. Standard retains the full concern score. Neither mode contains graphic events or removes safe exits.</p></div><select id="difficultySetting"><option value="gentle" ${S.settings.difficulty==='gentle'?'selected':''}>Gentle</option><option value="standard" ${S.settings.difficulty==='standard'?'selected':''}>Standard</option></select></div>${[['reducedMotion','Reduced ambient motion','Stops floating leaves, rain animation, and water movement. Character control is unchanged.'],['contrast','Higher text contrast','Darkens secondary text and interface borders.'],['largeText','Larger dialog text','Increases the size of information and choices in dialogs.']].map(([id,title,desc])=>`<div class="settings-row"><div><h4>${title}</h4><p>${desc}</p></div><input type="checkbox" data-setting="${id}" ${S.settings[id]?'checked':''} aria-label="${title}"></div>`).join('')}<div class="settings-row"><div><h4>Keep your career</h4><p>Autosaves after actions, with a previous-save backup. Browser storage can be cleared or differ between files; export a save for a durable backup.</p></div><div class="button-row">${btn('Export save','exportSave','','small secondary')}${btn('Import save','importSave','','small secondary')}</div></div><div class="settings-row"><div><h4>Start over</h4><p>Replaces this browser’s current career. Export first to preserve it.</p></div>${btn('New career','restart','','small danger')}</div><div class="subheading">CONTROLS</div><div class="banner">WASD or arrow keys: walk in screen directions.<br>Click/tap the ground: pathfind there. Click a building or its destination button: walk to the entrance.<br>E: interact. Escape: close a dialog. Space: pause the town clock.<br>During dates, keys 1–3 select a conversation choice. All choices are also buttons.<br>Use + / − map buttons to zoom. On touch screens, use the direction pad or tap to walk.<br>Time pauses in menus. Real-time rendering targets 60 FPS; walk poses animate at 8 FPS.</div><p class="muted" style="font-size:11px;line-height:1.8">Moonleaf v1.0 · Standalone playable prototype. Original procedural 2D artwork. Fictional public-companionship profession, locations, rules, and economy. No external services, tracking, sexual gameplay, real-world client screening, or legal advice.</p></div>`;}

 if(l.id==='gallery')body+=`<div class="card"><h3>Look a little closer.</h3><p>Paper landscapes, little painted rooms, and artists’ notes give you new things to talk about.</p>${btn('Browse the exhibition · $8 / 45 min','care','data-id="gallery"','secondary')}</div>`;
 if(l.id==='lodge')body+=`<div class="card"><h3>Above the lanterns.</h3><p>The Heron’s public tea room looks over the town. This is a venue for conversation, not an overnight service.</p>${btn('A peaceful tea break · $15 / 40 min','care','data-id="tea"','secondary')}</div>`;
 if(l.id==='studio')body+=`<div class="card-grid"><div class="card"><h3>Tell your story well.</h3><p>Clear photography, considered writing, and a profile that feels like you.</p><div class="meta">Profile level ${S.profile}/3 · each level adds +2 date quality</div><div class="button-row">${btn(`Improve profile · ${money(100+S.profile*65)} / 60 min`,'upgradeProfile',S.profile>=3?'disabled':'','secondary')}${btn(`Refresh wardrobe · ${money(80+S.wardrobe*60)} / 45 min`,'upgradeWardrobe',S.wardrobe>=3?'disabled':'','secondary')}</div></div><div class="card"><h3>A little visibility.</h3><p>A campaign brings extra enquiries for three mornings. Referral cards are quieter, slower, and easier on privacy.</p><div class="button-row">${btn('3-day campaign · $65 / 30 min','campaign','','secondary')}${btn('Referral cards · $20 / 20 min','referral','','secondary')}</div></div></div>`;
 if(l.id==='guild')body+=`<div class="card-grid"><div class="card"><h3>Learn from your peers.</h3><p>A 75-minute workshop grants 55 experience in a skill. Training costs $45. Skills cap at level five.</p><label class="field">Workshop<select id="trainSkill">${Object.entries(SKILLS).map(([k,v])=>`<option value="${k}" ${skillLevel(k)>=5?'disabled':''}>${v} · level ${skillLevel(k)}</option>`).join('')}</select></label>${btn('Take the workshop · $45','train','','secondary')}</div><div class="card"><h3>A network worth having.</h3><p>Choose your operating model and support team, renew a city events pass, or take a public hospitality shift when funds are tight.</p><div class="button-row">${btn('Models & team','open','data-page="business" data-tab="team"','secondary')}${region().permit?btn('Renew events pass · $90','permit','','secondary'):''}${btn('Help at the desk · +$45 / 90 min','shift','','secondary')}</div><div class="meta" style="margin-top:14px">Desk shift: energy −12, conversation +8 experience. Up to three shifts per day. No references, clients, or fees required.</div></div></div>`;

 return modalHead('SOMEWHERE IN '+region().short.toUpperCase(),l.name,`You are here · Day ${S.day}, ${clock(S.minute)}. Menus pause the town clock; activities advance it by their listed duration.`)+`<div class="modal-body">${body}</div>`;
}
function dateScene(){const a=S.activeDate,b=getBooking(a.booking),c=getClient(b.client);const common={client:c,booking:b};
 if(a.stage===0)return {...common,title:'A thoughtful arrival',text:`${c.name} smiles as you arrive. “It’s good to meet you. How shall we spend our time?”`,hint:`Their mood seems ${c.vibe}. Agreeing on a comfortable pace makes room for a better date.`,choices:[{text:'Check their comfort, confirm the plan, and settle in.',hint:'A steady start. Clear expectations and an agreed end time.',quality:14,skill:'composure'}, {text:'Bring a bright, energetic introduction.',hint:'A lively client may enjoy the energy; a quieter one may need space.',quality:c.vibe==='lively'?17:7,skill:'conversation'}, {text:'Ask what would make this a good afternoon for them.',hint:'An open question, with room to listen.',quality:c.vibe==='thoughtful'?17:12,skill:'conversation'}]};
 if(a.stage===1){const opts=[c.topic,...Object.keys(TOPICS).filter(t=>t!==c.topic)];const topics=[opts[0],opts[2],opts[4]]; // Stable per booking, not reshuffled on redraw.
 const rot=c.skin%3,ordered=topics.slice(rot).concat(topics.slice(0,rot));return {...common,title:'Find common ground',text:`The conversation opens up. ${c.name} asks, “What has caught your attention lately?”`,hint:c.screened?`Your notes: ${c.name} enjoys ${TOPICS[c.topic]}.`:'You have not checked their interests. An open, curious conversation still has value.',choices:ordered.map(t=>({text:`Talk about ${TOPICS[t]}, then ask about their experience.`,hint:t===c.topic&&c.screened?'Matches an interest in your notes.':'Listen and leave room for their perspective.',quality:t===c.topic?18:9,skill:'conversation'}))};}
 if(a.stage===2){
 if(a.eventType==='boundary')return {...common,title:'A boundary is a boundary',text:`${c.name} pushes for an unplanned change of venue and extra time without agreeing on terms.`,hint:'There is no reward for accepting pressure. Support and a safe exit are always available.',choices:[{text:'Restate the public-venue plan and the agreed end time.',hint:'Firm, calm boundaries. Practice composure; no privacy loss.',quality:12+skillLevel('composure'),skill:'composure',stress:2}, {text:S.staff.security||S.model==='managed'?'Use your included safety check-in.':'Call a Guild safety coordinator.',hint:S.staff.security||S.model==='managed'?'Your support team checks in at no extra charge.':'A $12 support call provides a calm, public check-in.',quality:13,skill:'screening',cost:S.staff.security||S.model==='managed'?0:12,stress:-4}, {text:'End the date safely. The agreed boundary matters.',hint:'Keep the reserved-time deposit. No rating or reputation penalty.',exit:true}]};
 if(a.eventType==='photo')return {...common,title:'A moment, not a public profile',text:`“This is lovely,” ${c.name} says, reaching for a phone. “Could we post a photo together?”`,hint:'A kind request still needs a real choice. Your photo policy applies here.',choices:[{text:'Suggest a photo of the view instead, without either of you.',hint:'Protect privacy and keep a shared memory.',quality:15,skill:'composure'}, {text:'Explain that you keep your professional life off public feeds.',hint:'A respectful boundary. No reputation penalty.',quality:12,skill:'composure'}, {text:'Agree to a public photo together.',hint:S.policies.photos?'Unavailable: outside your no-public-photos boundary.':'Privacy −15. You can choose visibility, but it has a cost.',quality:10,privacy:-15,disabled:S.policies.photos,skill:'marketing'}]};
 if(a.eventType==='rain')return {...common,title:'A change in the weather',text:'Rain threads through the garden. Your client laughs softly, but the benches are getting wet.',hint:'A little flexibility can turn an inconvenience into a good memory.',choices:[{text:'Find the covered pavilion and ask whether they are comfortable.',hint:'Stay in the agreed gardens, keep dry, and listen.',quality:16,skill:'conversation'}, {text:'Keep walking without checking in.',hint:'An energetic choice, but it may miss what your client needs.',quality:3,stress:4,skill:'conversation'}, {text:'Offer to finish early under the pavilion.',hint:'Respectful and calm. No penalty for a shorter, comfortable ending.',quality:12,skill:'composure'}]};
 return {...common,title:'The small things matter',text:`The town hums around you. ${c.name} pauses, then shares a story about a tiring week.`,hint:'Being a good date is less about a perfect performance than making someone feel heard.',choices:[{text:'Listen, ask a thoughtful question, and let the silence breathe.',hint:'Care without trying to solve their life.',quality:16,skill:'conversation',stress:1}, {text:'Offer a light distraction and a funny story.',hint:c.vibe==='lively'?'They seem ready for a little levity.':'A change of pace may help, but follow their lead.',quality:c.vibe==='lively'?17:9,skill:'conversation'}, {text:'Bring the conversation back to your own achievements.',hint:'A little self-disclosure can help; taking over may not.',quality:3,skill:'marketing'}]};
 }
 const canExtend=S.stats.energy>=35&&!upcoming().some(x=>x.id!==b.id&&x.day===S.day&&x.time<b.time+150&&x.time>=b.time);
 return {...common,title:'Leave on a good note',text:`The planned time is almost over. ${c.name} thanks you for the company. How would you like to close?`,hint:'An agreed ending protects your time and sets expectations for the next meeting.',choices:[{text:'Thank them, wrap up on time, and offer a professional follow-up.',hint:'A warm goodbye with clear separation between work and personal life.',quality:14,skill:'negotiation'}, {text:'Offer another 30 minutes at an agreed 30% add-on.',hint:canExtend?`Adds ${money(Math.round(b.price*.3))} and 30 minutes. Extra energy cost: 7.`:'Unavailable: you need more energy or the next booking is too close.',quality:10,extension:true,disabled:!canExtend,skill:'negotiation'}, {text:'Close quietly and make time to decompress.',hint:'A gentle ending. Stress −6.',quality:10,stress:-6,skill:'composure'}]};
}
function renderDate(){const a=S.activeDate;if(!a)return modalHead('YOUR DATE','No date in progress.')+`<div class="modal-body">${btn('Return to town','close')}</div>`;const b=getBooking(a.booking),c=getClient(b.client);
 if(a.walking)return modalHead('A LITTLE TIME IN THE TOWN','Walk together.','Guide your character to the glowing leaf marker. Your client follows; conversation resumes when you arrive.')+`<div class="modal-body"><div class="date-scene"><div class="client-head"><div class="portrait">${portrait(c)}</div><div><h3>${esc(c.name)}</h3><small>${VENUES[b.venue].name}</small></div></div><p>A small walk is part of the afternoon.</p><small>WASD / arrows or click to move. Follow the glowing marker near the venue. You can also skip the walk for a slightly smaller quality bonus.</small></div><div class="button-row">${btn('Return to the walk','close')}${btn('Walk automatically','autoStroll','','secondary')}${btn('Skip the walk','skipStroll','','secondary')}${btn('Leave safely','exitDate','','danger')}</div></div>`;

function renderReport(){const r=S.lastReport;if(!r)return '';const c=getClient(r.client);return modalHead(r.exited?'YOU CHOSE YOUR BOUNDARY':r.noShow?'YOUR TIME STILL MATTERS':'AN AFTERNOON, WELL SPENT',r.exited?'You got home on your terms.':r.noShow?'They didn’t arrive.':r.quality>=85?'Good company leaves an impression.':r.quality>=65?'A connection worth building.':'An experience to learn from.',r.exited?'Ending a date is a professional decision. There is no review penalty.':r.noShow?'You waited for 20 minutes. A no-show does not damage your reputation.':'Your preparation, conversation, and choices shaped the outcome.')+`<div class="modal-body center">${!r.exited&&!r.noShow?`<div class="score-circle">${r.quality}<small>DATE QUALITY</small></div><h3 style="font-size:25px">${esc(c?.name||'Your client')} rated the date ${r.rating.toFixed(1)} / 5</h3><p class="muted" style="font-size:12px">${r.quality>=85?'“I felt listened to. I’d be glad to meet again.”':r.quality>=65?'“A pleasant time together. Thank you for the company.”':'“Some moments connected; others felt a little rushed.”'}</p>`:`<div class="score-circle">${icon('shield')}<small>YOUR CHOICE</small></div>`}${r.paymentIssue?'<div class="banner warm">The client did not settle the full remaining balance. This was a payment-reliability consequence; it did not affect the quality of your work. Strong references and deposits reduce this risk.</div>':''}<div class="receipt"><div><span>Agreed date price${r.extension?' + extension':''}</span><span>${money(r.price)}</span></div><div><span>Deposit already received</span><span>${money(r.deposit)}</span></div><div><span>Payment received today</span><span>${money(r.payment)}</span></div><div><span>Tip</span><span>${money(r.tip)}</span></div><div><span>Model commission</span><span>−${money(r.commission)}</span></div><div><span>Venue cost</span><span>−${money(r.fee)}</span></div><div><span>Net earnings, including deposit</span><span>${money(r.net)}</span></div><div><span>Wallet change at settlement</span><span>${r.walletChange>=0?'+':''}${money(r.walletChange)}</span></div></div>${r.regular?'<div class="banner">A familiar face: this client is now a regular. Invite them back through your client book.</div>':''}<div class="button-row" style="justify-content:center">${btn('Back to the town','close')}${btn('Check in with yourself','open','data-page="life"','secondary')}</div></div>`;}
function renderMorning(){const n=S.lastNight;if(!n)return '';return modalHead(`DAY ${S.day} · A FRESH PAGE`,'The town wakes with you.',event().text)+`<div class="modal-body"><div class="metrics"><div class="metric"><small>AVAILABLE</small><strong>${money(S.cash)}</strong></div><div class="metric"><small>ENERGY</small><strong>${Math.round(S.stats.energy)}</strong></div><div class="metric"><small>NEW ENQUIRIES</small><strong>${S.leads.filter(l=>l.day===S.day&&l.status==='new').length}</strong></div></div><div class="banner">${esc(n.message)}</div><div class="receipt"><div><span>Housing and staff</span><span>−${money(n.overhead)}</span></div>${n.utilities?`<div><span>Weekly utilities</span><span>−${money(n.utilities)}</span></div>`:''}${n.debtPayment?`<div><span>Starting-debt payment</span><span>−${money(n.debtPayment)}</span></div>`:''}${n.studio?`<div><span>Studio event revenue</span><span>+${money(n.studio)}</span></div>`:''}<div><span>Daily net change overnight</span><span>${money(n.studio-n.overhead-n.utilities-n.debtPayment)}</span></div></div>${S.cash<70?'<div class="banner warm">Your wallet is running low. Reserves can be withdrawn in Finances. The Guild offers paid hospitality shifts, and you can release staff to lower tomorrow’s overhead.</div>':''}<div class="button-row">${btn('Step into the day','close')}${btn('Read new enquiries','open','data-page="inbox"','secondary')}</div></div>`;}
function endingReady(id){return id==='freedom'?S.savings>=3000&&S.debt===0&&S.totals.dates>=8:id==='balance'?S.day>=15&&regulars()>=3&&S.stats.health>=75&&S.stats.connection>=65&&S.stats.stress<40:id==='studio'?S.ownedStudio&&S.reputation>=4.4&&S.savings>=500:false;}

function screenLead(id){const l=getLead(id),c=l&&getClient(l.client);if(!c||c.screened)return;if(!afford(8)||!actionAllowed(15))return;transact(-8,`Reference check: ${c.name}`);advance(15);c.screened=true;S.totals.screened++;gain('screening',22);log(`Checked ${c.name}'s references: ${riskLabel(c).toLowerCase()}.`,'safety');toast('References checked. Interests and reliability are now visible.');update();}
function negotiate(id){const l=getLead(id);if(!l||l.status!=='new')return;const c=getClient(l.client),amount=Number($('#counterAmount')?.value);if(!Number.isFinite(amount)||amount<50||amount>800){toast('Choose a counteroffer between $50 and $800.','warn');return;}if(!actionAllowed(10))return;
 l.deposit=$('#depositCheck')?.checked??l.deposit;advance(10);l.counter++;const max=Math.floor(c.budget*(1+skillLevel('negotiation')*.045)/5)*5;
 if(l.counter>3){l.status='declined';log(`${c.name} declined further negotiation.`);toast('The client has ended this negotiation. Other enquiries remain.');open('inbox');update();return;}
 l.offer=Math.round(Math.min(amount,max));gain('negotiation',8);toast(amount<=max?`${c.name} agrees to ${money(l.offer)}.`:`${c.name} counters at ${money(l.offer)}. You may accept or decline.`);update();}
function bookLead(id){const l=getLead(id);if(!l||l.status!=='new')return;const c=getClient(l.client);if(region().permit&&S.permitUntil<S.day){toast('Renew your events pass at the Guild before booking.','warn');return;}

 if(!ui.page&&!S.settings.reducedMotion){for(const [i,n]of npcs.entries()){const phase=(Math.sin(t/(11000+i*1800)+n.phase)+1)/2,x=n.a.x+(n.b.x-n.a.x)*phase,y=n.a.y+(n.b.y-n.a.y)*phase;if(!blocked(x,y)){const ddx=x-n.x,ddy=y-n.y;n.facing=iso(ddx,ddy).x<0?-1:1;n.back=iso(ddx,ddy).y<0;n.x=x;n.y=y;}}}
}
function resize(){const rect=canvas.getBoundingClientRect();W=rect.width;H=rect.height;DPR=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.imageSmoothingEnabled=true;}
function promptUpdate(){const e=$('#interactPrompt'),message=$('#mapMessage');if(ui.page){e.hidden=true;message.hidden=true;return;}if(S.activeDate?.walking){e.hidden=false;e.innerHTML='<button class="text-button" style="color:inherit" data-act="resumeDate"><kbd>E</kbd> Date options</button>';message.hidden=false;message.textContent='A little walk together · follow the glowing leaf';return;}if(S.activeDate){e.hidden=false;e.innerHTML='<button class="text-button" style="color:inherit" data-act="resumeDate"><kbd>E</kbd> Continue your date</button>';message.hidden=true;return;}const l=nearestLocation();e.hidden=!l;if(l)e.innerHTML=`<button class="text-button" style="color:inherit" data-act="interact"><kbd>E</kbd> ${l.id==='home'?'Enter your cottage':'Visit '+l.short}</button>`;message.hidden=!walk.target;if(walk.target)message.textContent='Walking to '+(LOCATIONS.find(l=>l.id===walk.target)?.short||'your destination')+' · use WASD to take over';}
function frame(t){const rawDt=Math.max(0,(t-lastFrame)/1000||.016),dt=Math.min(.05,rawDt);lastFrame=t;if(!document.hidden){movePlayer(dt,t);if(S.started&&!ui.page&&!ui.paused&&!S.activeDate){simAccumulator+=dt;if(simAccumulator>=4){const minutes=Math.floor(simAccumulator/4);simAccumulator%=4;advance(minutes);renderHUD();if(S.minute>=1430&&!nightPrompt){nightPrompt=true;open('location','home');toast('The town is winding down. Rest to start tomorrow.');}}}drawWorld(t,dt);frameN++;frameT+=rawDt;if(frameT>=1){fps=Math.round(frameN/frameT);$('#fps').textContent=fps+' FPS';frameT=0;frameN=0;}if(t-lastRender>300){promptUpdate();lastRender=t;}if(t-lastAutoSave>15000){save();lastAutoSave=t;}}
 requestAnimationFrame(frame);
}
S=load();ui.skin=S.skin;ui.outfit=S.outfit;ui.creator=!S.started;camera.zoom=window.innerWidth < 600 ? .86 : 1;resize();new ResizeObserver(resize).observe(canvas);buildWorld();renderHUD();if(!S.started)open('creator');else if(S.activeDate)open('date');requestAnimationFrame(frame);
// Read-only diagnostics make smoke testing possible without changing a career.
window.Moonleaf=Object.freeze({version:'1.0.0',state:()=>JSON.parse(JSON.stringify(S)),diagnostics:()=>({fps,width:W,height:H,pixelRatio:DPR,objects:objects.length,location:nearestLocation()?.id||null,walking:walk.path.length,modal:ui.page,storageOK}),routeTo:(id)=>{const l=LOCATIONS.find(l=>l.id===id);if(!l)return null;return pathfind(S.player,l.door).map(p=>({...p}));}});
})();
