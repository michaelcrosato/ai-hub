     All art is procedurally drawn on canvas; all music/SFX are synthesized with WebAudio. No assets from the original game are used. -->
<style>
:root{--gold:#e8c15a;--ink:#0b0e1a;--panel:#141a30ee;--blue:#2b3f77;--red:#8c2f2f;--green:#2f7a4e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#05060d;color:#f2ead6;font-family:Georgia,'Times New Roman',serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 100% at 50% 0%,#1b2242 0%,#0b0e1a 60%,#05060d 100%)}
#topbar{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;background:#0a0d1bcc;border-bottom:1px solid #3a2f14;z-index:5}
#topbar .ttl{font-weight:bold;letter-spacing:.08em;color:var(--gold);font-size:1rem;white-space:nowrap}
#topbar .sp{flex:1}
.icobtn{background:#20294d;border:1px solid #5a6aa0;color:#fff;border-radius:.5rem;font-size:1.05rem;min-width:2.4rem;min-height:2.4rem;cursor:pointer}
.icobtn:active{transform:scale(.94)}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none;z-index:3}
#ui .panel{pointer-events:auto}
.panel{background:var(--panel);border:1px solid var(--gold);border-radius:.6rem;box-shadow:0 4px 24px #000c}
#menu{position:absolute;left:.6rem;bottom:.6rem;min-width:11rem;max-width:min(78vw,20rem);padding:.5rem;display:none;flex-direction:column;gap:.35rem}
#menu.show{display:flex}
.mbtn{background:linear-gradient(#33417c,#232c56);border:1px solid #8fa0e0;color:#fff;border-radius:.45rem;padding:.65rem .8rem;font-size:1rem;text-align:left;cursor:pointer;font-family:inherit}
.mbtn small{color:#c9d2ff}
.mbtn.sel{outline:2px solid var(--gold);background:linear-gradient(#4a5da8,#2c3768)}
.mbtn:disabled{opacity:.45}
.mbtn.danger{background:linear-gradient(#7c3333,#562323);border-color:#e08f8f}
#info{position:absolute;right:.6rem;top:.6rem;max-width:min(60vw,19rem);padding:.5rem .7rem;font-size:.86rem;display:none;line-height:1.35}
#info.show{display:block}
#info b{color:var(--gold)}
#turnbar{position:absolute;left:.6rem;top:.6rem;padding:.4rem .6rem;font-size:.85rem;display:none;max-width:46vw}
#turnbar.show{display:block}
#dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:.6rem;width:min(96vw,46rem);padding:.8rem 1rem;display:none;font-size:1rem;line-height:1.5}
#dlg.show{display:block;pointer-events:auto}
#dlg .who{color:var(--gold);font-weight:bold;margin-bottom:.2rem}
#dlg .next{float:right;color:#9fb0ff;font-size:.85rem}
#title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.6rem;background:radial-gradient(90% 70% at 50% 30%,#232c5ecc 0%,#0b0e1add 70%);z-index:6;text-align:center;padding:1rem}
#title h1{font-size:clamp(1.8rem,7vw,3.4rem);letter-spacing:.12em;color:var(--gold);margin:.2rem 0;text-shadow:0 0 24px #e8c15a66,0 3px 0 #000}
#title h2{font-size:clamp(.9rem,3.4vw,1.2rem);color:#cfd8ff;font-weight:normal;margin:0 0 .6rem;letter-spacing:.06em}
.bigbtn{background:linear-gradient(#5a3f14,#2c1f0a);border:2px solid var(--gold);color:#ffe9b0;border-radius:.6rem;padding:.8rem 1.6rem;font-size:1.15rem;cursor:pointer;min-width:min(80vw,20rem);font-family:inherit}
.bigbtn:active{transform:scale(.96)}
.smlrow{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.smlbtn{background:#20294d;border:1px solid #5a6aa0;color:#fff;border-radius:.5rem;padding:.55rem .9rem;font-size:.95rem;cursor:pointer;font-family:inherit}
#toast{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);padding:.9rem 1.4rem;font-size:1.4rem;letter-spacing:.1em;color:var(--gold);display:none;z-index:7;text-align:center}
#toast.show{display:block;animation:pop 2.2s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0}}
#help{position:absolute;left:50%;transform:translateX(-50%);top:.6rem;padding:.35rem .8rem;font-size:.82rem;color:#dfe6ff;display:none}
#help.show{display:block}
#facebar{position:absolute;right:.6rem;bottom:.6rem;display:none;gap:.4rem}
#facebar.show{display:flex}
#vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 18vmax #000a}
.hidden{display:none!important}
input[type=range]{width:9rem}
kbd{background:#0008;border:1px solid #888;border-radius:.3rem;padding:0 .3rem;font-size:.8em}
@media (min-width:900px){#menu{min-width:13rem}.mbtn{font-size:1.02rem}}
</style>
</head>

<script>
"use strict";
/* ============================================================
   ZODIAC LION TACTICS — single-file isometric tactical RPG
   Original build: 2026-09-25 | Model: Muse Spark (Meta MSL)
   Tribute inspired by Final Fantasy Tactics (PS1). All code/art/
   music here are original and procedurally generated in-file.
   ============================================================ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const chance=p=>Math.random()*100<p;
const choice=a=>a[Math.floor(Math.random()*a.length)];
const deepClone=o=>JSON.parse(JSON.stringify(o));
// ---------- persistent settings ----------
const SETS=Object.assign({mute:false,vol:.7,music:.55,speed:1,grid:true,anim:true},JSON.parse(localStorage.getItem('zlt_sets')||'{}'));
function saveSets(){localStorage.setItem('zlt_sets',JSON.stringify(SETS));}
// ---------- audio: synth SFX + generative music ----------
let AC=null,masterG=null,musicG=null,musicTimer=null,curStep=0;
function audio(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();masterG=AC.createGain();masterG.gain.value=SETS.mute?0:SETS.vol;masterG.connect(AC.destination);musicG=AC.createGain();musicG.gain.value=SETS.music*.5;musicG.connect(masterG);}if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,t0,dur,type,vol,slide){try{const ac=audio(),o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t0+dur);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.2,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g);g.connect(masterG);o.start(t0);o.stop(t0+dur+.02);}catch(e){}}
function sfx(n){if(SETS.mute)return;try{const ac=audio(),t=ac.currentTime;switch(n){
case 'sel':tone(660,t,.07,'square',.12);break;
case 'ok':tone(520,t,.08,'square',.14);tone(780,t+.07,.1,'square',.14);break;
case 'cancel':tone(330,t,.1,'square',.12);tone(220,t+.06,.12,'square',.12);break;
case 'hit':tone(180,t,.15,'sawtooth',.25,-120);tone(90,t,.12,'square',.2);break;
case 'miss':tone(900,t,.12,'sine',.1,-500);break;
case 'heal':[523,659,784,1046].forEach((f,i)=>tone(f,t+i*.07,.15,'triangle',.16));break;
case 'fire':tone(220,t,.3,'sawtooth',.2,-150);tone(110,t+.05,.25,'square',.15);break;
case 'ice':[1200,900,700,500].forEach((f,i)=>tone(f,t+i*.05,.12,'triangle',.14));break;
case 'bolt':tone(1500,t,.08,'sawtooth',.2,-1100);tone(300,t+.08,.15,'square',.18);break;
case 'holy':[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,t+i*.08,.2,'triangle',.15));break;
case 'dark':[200,150,110,80].forEach((f,i)=>tone(f,t+i*.08,.2,'sawtooth',.16));break;
case 'die':tone(440,t,.5,'sawtooth',.2,-380);break;
case 'coin':tone(988,t,.08,'square',.14);tone(1319,t+.08,.2,'square',.14);break;
case 'fanfare':[523,523,523,659,784,1046].forEach((f,i)=>tone(f,t+i*.13,.18,'square',.16));break;
case 'step':tone(200+Math.random()*80,t,.05,'triangle',.07);break;
case 'cursor':tone(440,t,.04,'square',.06);break;
case 'charge':tone(300,t,.2,'sine',.12,300);break;
case 'crystal':[1568,2093,2637].forEach((f,i)=>tone(f,t+i*.1,.25,'sine',.12));break;
}}catch(e){}}
// generative modal music: D dorian war-chant + bass
const MELODY=[62,0,64,65,0,67,0,65,64,0,62,0,60,62,0,0,62,0,64,65,67,0,69,0,67,65,64,62,0,60,0,0,65,0,67,69,0,67,65,0,64,65,0,62,0,0,0,0];
const BASSN=[38,38,45,45,36,36,43,43];
function mtone(f,t,dur,type,vol){try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(musicG);o.start(t);o.stop(t+dur+.02);}catch(e){}}
const mf=m=>440*Math.pow(2,(m-69)/12);
function startMusic(){if(musicTimer||!AC)return;const stepDur=.24;musicTimer=setInterval(()=>{if(SETS.mute)return;const t=AC.currentTime+.02,bar=Math.floor(curStep/16)%4;if(curStep%2===0){const m=MELODY[curStep%MELODY.length];if(m)mtone(mf(m),t,.4,'triangle',.20);if(curStep%16===0)mtone(mf(BASSN[bar]),t,1.6,'sine',.22);}if(curStep%4===2)mtone(mf(BASSN[(bar+4)%8]||36),t,.5,'sine',.12);curStep++;},stepDur*1000);}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}
// ---------- input: touch + mouse + keyboard + gamepad ----------
const cv=$('cv'),ctx=cv.getContext('2d');
let DPR=1,CW=0,CH=0;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);CW=$('stage').clientWidth;CH=$('stage').clientHeight;cv.width=CW*DPR;cv.height=CH*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',fit);
const Input={tx:0,ty:0,tapped:false,down:false,keys:{},cursor:{x:0,y:0},camX:0,camY:0,drag:null};
function evtPos(e){const r=cv.getBoundingClientRect();const p=e.touches&&e.touches.length?e.touches[0]:(e.changedTouches&&e.changedTouches.length?e.changedTouches[0]:e);return{x:p.clientX-r.left,y:p.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{audio();startMusic();const p=evtPos(e);Input.down=true;Input.drag={x:p.x,y:p.y,cx:Input.camX,cy:Input.camY,moved:false};});
cv.addEventListener('pointermove',e=>{if(!Input.down||!Input.drag)return;const p=evtPos(e);const dx=p.x-Input.drag.x,dy=p.y-Input.drag.y;if(Math.abs(dx)+Math.abs(dy)>14)Input.drag.moved=true;if(Input.drag.moved){Input.camX=Input.drag.cx+dx;Input.camY=Input.drag.cy+dy;}});
cv.addEventListener('pointerup',e=>{Input.down=false;const p=evtPos(e);Input.tx=p.x;Input.ty=p.y;if(!Input.drag||!Input.drag.moved)Input.tapped=true;Input.drag=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();ZOOM=clamp(ZOOM*(e.deltaY<0?1.12:0.9),.55,1.9);},{passive:false});
let pinchD=0;
cv.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinchD)ZOOM=clamp(ZOOM*(d/pinchD),.55,1.9);pinchD=d;}},{passive:false});
cv.addEventListener('touchend',()=>{pinchD=0;});
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();Input.keys[e.key]=true;audio();startMusic();onKey(e.key);});
window.addEventListener('keyup',e=>{Input.keys[e.key]=false;});
// gamepad polling
let padPrev={};
function pollPad(){try{const ps=navigator.getGamepads?navigator.getGamepads():[];for(const p of ps){if(!p)continue;const b=i=>p.buttons[i]&&p.buttons[i].pressed;const ax=p.axes[0]||0,ay=p.axes[1]||0;const press=(k,down)=>{if(down&&!padPrev[k])onKey(k);padPrev[k]=down;};press('ArrowUp',b(12)||ay<-.5);press('ArrowDown',b(13)||ay>.5);press('ArrowLeft',b(14)||ax<-.5);press('ArrowRight',b(15)||ax>.5);press('Enter',b(0));press('Escape',b(1));press('Tab',b(5));break;}}catch(e){}}
let ZOOM=1;
// ---------- zodiac ----------
const SIGNS=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
function compat(a,b){if(a===b)return 0;const d=Math.abs(a-b)%12,g=Math.min(d,12-d);if(g===6)return -25;if(g===4||g===3)return 15;if(g===5||g===1)return -10;return 5;}
// ---------- jobs ----------
const JOBS={
squire:{n:'Squire',mv:4,jp:0,color:'#7fa8c9',desc:'Balanced rookie. Brave tales begin here.',growth:{hp:8,mp:2,pa:3,ma:2,sp:2},req:null,eq:['sword','axe','shield','helm','armor'],ab:['rush','dash','focus','healpulse']},

let MAP={w:9,h:9,tiles:[],theme:'plain'};
function genMap(theme,w,h){MAP.w=w;MAP.h=h;MAP.theme=theme;MAP.tiles=[];const T=THEMES[theme]||THEMES.plain;
for(let y=0;y<h;y++){for(let x=0;x<w;x++){let ht=0;const nx=x/w,ny=y/h;
if(theme==='hill')ht=Math.round(3*Math.sin(nx*3.1)*Math.cos(ny*2.6)+2);
else if(theme==='fort'||theme==='castle')ht=(x===0||y===0||x===w-1||y===h-1)?2:(x>2&&x<w-3&&y>1&&y<3?1:0);
else if(theme==='town')ht=((x+y)%5===0)?1:0;
else if(theme==='roof')ht=Math.abs(x-Math.floor(w/2))<=1?1:0;
else if(theme==='cave')ht=rnd(0,1)+(x===2&&y>1&&y<h-2?1:0);
else if(theme==='ruin')ht=((x*7+y*3)%7===0)?2:rnd(0,1);
else if(theme==='desert')ht=Math.round(Math.sin(nx*6)*1+1);
else if(theme==='chapel')ht=y<2?1:(x>w-4&&y>h-4?1:0);
else ht=rnd(0,1);
ht=clamp(ht,0,3);
MAP.tiles.push({x,y,h:ht,water:false});}}
return MAP;}
function tileAt(x,y){if(x<0||y<0||x>=MAP.w||y>=MAP.h)return null;return MAP.tiles[y*MAP.w+x];}

// ---------- battle mechanics ----------
function unitAt(x,y){return B.units.find(u=>!u.dead&&u.x===x&&u.y===y);}
function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);}
function effSpd(u){let s=u.sp;if(u.haste)s*=1.5;if(u.slowT)s*=.6;return Math.max(1,s);}
function tickCT(){let guard=0;while(guard++<500){let best=null;for(const u of B.units){if(u.dead||u.petrify)continue;u.ct+=effSpd(u);if(u.ct>=100&&(!best||u.ct>best.ct))best=u;}if(best){best.ct-=100;return best;}}}
function moveRange(u){const mv=u.mv+(u.dashB||0);const seen={},q=[{x:u.x,y:u.y,c:0}];seen[u.x+','+u.y]=0;const out=[];while(q.length){const n=q.shift();if(n.c>0)out.push(n);if(n.c>=mv)continue;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const t=tileAt(n.x+dx,n.y+dy);if(!t)continue;const k=(n.x+dx)+','+(n.y+dy);if(seen[k]!=null)continue;const from=tileAt(n.x,n.y);if(Math.abs(t.h-from.h)>2)continue;const oc=unitAt(n.x+dx,n.y+dy);if(oc&&oc!==u)continue;seen[k]=n.c+1;q.push({x:n.x+dx,y:n.y+dy,c:n.c+1});}}return out;}
function inRange(u,abid){const a=AB[abid];const r=a.r+(abid==='attack'?Math.max(0,u.wRange-1):0);const out=[];for(let y=0;y<MAP.h;y++)for(let x=0;x<MAP.w;x++){const t=tileAt(x,y);const d=Math.abs(x-u.x)+Math.abs(y-u.y);if(d>r)continue;if(Math.abs(t.h-u.h)>3)continue;if(d===0&&(a.k==='dmg'||a.k==='deb'||a.k==='steal'||a.k==='charm'))continue;out.push({x,y});}return out;}
function aoeTiles(cx,cy,aoe){const out=[];for(let y=0;y<MAP.h;y++)for(let x=0;x<MAP.w;x++)if(Math.abs(x-cx)+Math.abs(y-cy)<=aoe)out.push({x,y});return out;}
function hitChance(at,df,abid){const a=AB[abid];let h=85;
if(a.k==='heal'||a.k==='raise'||a.k==='buff')h=100;
else{h+=Math.floor(at.brave/4)-Math.floor((df?df.brave:60)/6);if(abid==='attack'&&at.wType==='bow')h-=5;
if(a.el)h+=Math.floor(at.faith/5);else h+=2;
if(df){h+=compat(at.sign,df.sign);const hd=heightAdv(at,df);h+=hd*4;if(df.smoke)h-=30;if(at.blind)h-=30;if(df.haste)h-=10;}
if(abid==='chargeshoot')h-=20;if(abid==='stealgil')h=70;if(abid==='stealheart')h=65;if(abid==='shadowbind')h-=10;}
return clamp(Math.round(h),5,100);}
function heightAdv(at,df){return clamp((at.h-df.h),-3,3);}
function physPow(at,df,a,abid){let p=(at.pa+(at.paUp||0)-(at.paDn||0))*(a.p||1);if(abid==='attack'&&at.wType==='bow')p*=.9;if(abid==='attack'&&at.wType==='gun')p=Math.max(p,at.pa*.8+4);p*=(0.9+at.brave/250);if(df){p*=100/(100+Math.min(60,(df.pa||5))*4);if(df.guard||df.prot)p*=.6;if(df.face===faceToward(df,at))p*=.85;}return Math.max(1,Math.round(p*2.6*rnd(90,110)/100));}
function magPow(at,df,a){let p=(at.ma-(at.maDn||0))*(a.p||1)*1.15;p*=(0.7+at.faith/150);if(df){p*=100/(100+Math.min(60,(df.ma||3))*3);if(df.guard||df.prot)p*=.65;}return Math.max(1,Math.round(p*1.5*rnd(90,110)/100));}
function faceToward(u,t){const dx=t.x-u.x,dy=t.y-u.y;return Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);}
function float(u,txt,col){B.floats.push({x:u.x,y:u.y,h:u.h,t:txt,c:col||'#fff',life:1.2});}
function fxBurst(u,col,n){for(let i=0;i<(n||14);i++)B.fx.push({x:u.x,y:u.y,h:u.h,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,vh:Math.random()*3+1,c:col,life:.5+Math.random()*.5});B.shake=Math.max(B.shake,3);}
function damage(u,amt,src){if(u.vanish||u.dead)return 0;if(u.hp<=0)return 0;amt=Math.max(0,Math.round(amt));u.hp-=amt;float(u,'-'+amt,amt>60?'#ff6a5a':'#fff');fxBurst(u,'#ffd27a',8);if(u.hp<=0){u.hp=0;u.ko=3;float(u,'KO!','#ff4040');sfx('die');}else sfx('hit');return amt;}
function healU(u,amt){if(u.dead||u.hp<=0)return 0;let a=Math.round(amt*(u.pharma?1.5:1));u.hp=clamp(u.hp+a,0,u.maxhp);float(u,'+'+a,'#6aff8a');fxBurst(u,'#6aff8a',10);sfx('heal');return a;}
function useAbility(at,abid,tx,ty){const a=AB[abid];const cost=a.mp||0;if(at.mp<cost){float(at,'No MP','#9fb0ff');return false;}at.mp-=cost;at.face=faceToward(at,{x:tx,y:ty});
const elsfx={fire:'fire',ice:'ice',bolt:'bolt',dark:'dark',holy:'holy'};if(a.el)sfx(elsfx[a.el]||'hit');
if(abid==='attack'&&at.wType==='bow')sfx('bolt');
if(a.k==='self'){selfEffect(at,abid);endAction(at);return true;}
if(a.k==='move'){at.dashB=2;float(at,'Dash!','#9fe8ff');endAction(at,true);return true;}
if(a.k==='item'){B.phase='itempick';B.mode='item';openItemMenu(at,true);return true;}
if(abid==='allultima'){for(const u of B.units){if(u.dead)continue;if(u===at)continue;if(!chance(hitChance(at,u,abid))){float(u,'MISS','#aaa');continue;}damage(u,magPow(at,u,a),at);}endAction(at);return true;}
const tiles=a.aoe?aoeTiles(tx,ty,a.aoe):[{x:tx,y:ty}];
let any=false;
for(const t of tiles){const df=unitAt(t.x,t.y);
if(a.k==='dmg'){if(!df||df.side===at.side&&df!==at&&at.side==='P'&&false) {if(!df)continue;}
if(!df)continue;if(df.side===at.side&&at.side==='P'&&abid!=='attack'){/* friendly fire allowed for summons */}
if(df.vanish){float(df,'VANISH','#aaa');continue;}
if(!chance(hitChance(at,df,abid))){float(df,'MISS','#bbb');sfx('miss');continue;}any=true;
let amt=a.el||['flare','demi'].includes(abid)?magPow(at,df,a):physPow(at,df,a,abid);
if(abid==='demi')amt=Math.max(1,Math.floor(df.maxhp*.25));
damage(df,amt,at);
if(abid==='powerbrk')df.paDn=Math.min(6,(df.paDn||0)+2);if(abid==='magicbrk')df.maDn=Math.min(6,(df.maDn||0)+2);
if(abid==='speedbrk'||abid==='legshot'||abid==='blizzard')df.slowT=3;
if(abid==='shadowbind')df.stop=1;if(abid==='mug')stealGil(at,df);
if(abid==='doublestrike'&&!df.dead){if(chance(hitChance(at,df,abid)))damage(df,physPow(at,df,a,abid),at);}
if(abid==='impale'&&!df.dead){/* ignores guard: already full */}
if(df.learned&&df.learned.autosip&&!df.dead&&df.hp>0&&df.hp<df.maxhp*.5){if(df.side==='P'){if((G.inv.potion||0)>0){G.inv.potion--;healU(df,40);float(df,'Auto-Potion','#ffe27a');}}else{if((df.potions||0)>0){df.potions--;healU(df,40);float(df,'Auto-Potion','#ffe27a');}}}
}
else if(a.k==='heal'){if(!df||df.dead||df.hp<=0)continue;if(df.side!==at.side)continue;any=true;const amt=magPow(at,df,{p:a.p})+at.ma*2;healU(df,amt);}
else if(a.k==='raise'){if(!df||df.hp>0)continue;any=true;df.hp=Math.floor(df.maxhp*a.p);df.ko=0;float(df,'REVIVE','#ffe27a');fxBurst(df,'#ffe27a',16);sfx('holy');}
else if(a.k==='buff'){if(!df||df.side!==at.side)continue;any=true;if(abid==='haste'){df.haste=4;float(df,'HASTE','#9fe8ff');}else{df.prot=3;float(df,'PROTECT','#9fe8ff');}}
else if(a.k==='deb'){if(!df||df.side===at.side)continue;if(!chance(hitChance(at,df,abid))){float(df,'MISS','#bbb');continue;}any=true;df.slowT=4;float(df,'SLOW','#c99fff');}
else if(a.k==='steal'){if(!df||df.side===at.side)continue;if(!chance(hitChance(at,df,abid))){float(df,'MISS','#bbb');continue;}any=true;stealGil(at,df);}
else if(a.k==='charm'){if(!df||df.side===at.side)continue;if(!chance(hitChance(at,df,abid))){float(df,'MISS','#bbb');continue;}any=true;df.charm=2;float(df,'CHARM!','#ff9fd0');}
}
if(!any)float(at,'No effect','#aaa');
if(a.k==='dmg'&&a.aoe)fxBurst({x:tx,y:ty,h:tileAt(tx,ty).h},a.el==='fire'?'#ff8a3a':a.el==='ice'?'#9fdcff':a.el==='bolt'?'#fff27a':'#c99fff',18);
endAction(at);return true;}
function stealGil(at,df){const amt=Math.min(df.gilCarry||rnd(30,120),(df.gilCarry||rnd(30,120)));B.stolen+=amt;G.gil+=amt;float(df,'-'+amt+' gil','#ffe27a');sfx('coin');}
function selfEffect(at,abid){switch(abid){
case 'focus':at.paUp=2;float(at,'ATK UP','#ffd27a');break;
case 'guard':at.guard=2;float(at,'GUARD','#9fe8ff');break;
case 'pharm':at.pharma=true;float(at,'PHARMA','#9fe8ff');break;
case 'pickup':at.scav=1;float(at,'SCAVENGER','#ffe27a');break;
case 'vanish':at.vanish=2;float(at,'VANISH','#c99fff');break;
case 'smoke':at.smoke=2;float(at,'SMOKE','#aaa');break;
case 'quick':at.ct=100;float(at,'QUICK!','#ffe27a');break;
case 'chakra':{const tiles=aoeTiles(at.x,at.y,1);for(const t of tiles){const u=unitAt(t.x,t.y);if(u&&u.side===at.side&&!u.dead)healU(u,at.ma*3+20);}break;}
case 'autosip':float(at,'Auto-Potion set','#9fe8ff');break;
}at.face=(at.face+2)%4;sfx('ok');}
function useItemOn(at,itemId,tx,ty){const it=ITEMS[itemId];const df=unitAt(tx,ty);if(!df||df.dead){if(!(it.raise&&df)){float(at,'No target','#aaa');return false;}}
if((G.inv[itemId]||0)<=0){float(at,'None left','#aaa');return false;}G.inv[itemId]--;
if(it.raise){if(df.hp>0){G.inv[itemId]++;return false;}df.hp=Math.floor(df.maxhp*it.raise);df.ko=0;float(df,'REVIVE','#ffe27a');sfx('holy');}
else{if(df.hp<=0){G.inv[itemId]++;float(at,'No effect','#aaa');return false;}if(it.heal)healU(df,it.heal*(at.pharma?1.5:1));if(it.mp){df.mp=clamp(df.mp+it.mp,0,df.maxmp);float(df,'+'+it.mp+' MP','#9fd0ff');}if(it.cure){df[it.cure]=0;if(it.cure==='charm')df.charm=0;float(df,'CURED','#6aff8a');}}
endAction(at);return true;}
function endAction(u,keepCt){B.phase='tick';B.mode=null;B.ability=null;B.item=null;B.moveTiles=[];B.rangeTiles=[];B.aoeTiles=[];hideMenu();info(null);

function nextTurn(){if(!B||B.over)return;checkEnd();if(B.over)return;
const u=tickCT();if(!u){B.phase='tick';return;}

turnbar('<b>'+B.def.map+'</b> · Turn '+B.turn+'<br>Active: <b>'+u.name+'</b> ('+JOBS[u.job].n+')<br><small>Next: '+order+'</small>');
if(u.side==='P'&&!u.guest&&u.charm<=0){B.phase='menu';openActionMenu(u);}

function killUnit(u){u.dead=true;u.hp=0;float(u,'CRYSTAL','#c9f0ff');fxBurst(u,'#c9f0ff',20);sfx('crystal');
if(u.side==='P'&&!u.guest){/* permadeath for generics handled at battle end; story chars named Ramza-like cause defeat via checkEnd */}}
function checkEnd(){if(!B||B.over)return;
const foes=B.units.filter(u=>u.side==='E'&&!u.dead);

const ramza=B.units.find(u=>u.side==='P'&&u.story&&!u.guest);

else if(allies.length===0||(ramza&&ramza.dead)){B.over='lose';onDefeat();}}
function gainRewards(){let xp=0,jp=0;const foes=B.units.filter(u=>u.side==='E');
foes.forEach(f=>{xp+=8+f.lv*2;jp+=10+f.lv*3;});
const surv=B.units.filter(u=>u.side==='P'&&!u.guest&&!u.dead);
surv.forEach(u=>{const p=G.party.find(p=>p.id===u.id);if(!p)recalc(u);});
B.units.filter(u=>u.side==='P'&&!u.guest&&!u.dead).forEach(u=>{const p=G.party.find(p=>p.id===u.id);if(!p)return;
p.hp=u.hp;p.mp=u.mp;p.exp+=xp;p.jp[u.job]+=jp;u.jlvl[u.job]=(u.jlvl[u.job]||1);
while(p.exp>=p.lv*40){p.exp-=p.lv*40;p.lv++;float(u,'LEVEL UP!','#ffe27a');}
const ups=Math.floor(p.jp[u.job]/150);if(ups>=(p.jlvl[u.job]||1)){p.jlvl[u.job]=ups+1;}
u.jlvl=p.jlvl;recalc(p);p.hp=clamp(p.hp+(p.maxhp-p.hp),0,p.maxhp);p.mp=p.maxmp;});
let gil=B.def.gil||500;const scav=B.units.some(u=>u.side==='P'&&u.scav);if(scav)gil=Math.floor(gil*1.3);gil+=B.stolen;G.gil+=gil;return{gil,xp,jp};}

// ---------- enemy AI ----------
function aiTurn(u){if(!B||B.over)return;if(u.hp<=0){nextTurn();return;}
const foeSide=u.charm>0?u.side:(u.side==='P'?'E':'P');
const friends=B.units.filter(x=>!x.dead&&x.hp>0&&x.side!==foeSide&&x!==u);
const foes=B.units.filter(x=>!x.dead&&x.hp>0&&x.side===foeSide&&!x.vanish);
if(!foes.length){endAction(u);setTimeout(()=>{if(B&&!B.over)nextTurn();},200);return;}
// 1. heal check (mages/chemists)
const hurt=friends.concat([u]).filter(x=>x.hp>0&&x.hp<x.maxhp*.45).sort((a,b)=>a.hp/a.maxhp-b.hp/b.maxhp)[0];
const abList=Object.keys(u.learned||{});
const healAb=abList.find(a=>AB[a]&&(AB[a].k==='heal'||AB[a].k==='raise')&&u.mp>=AB[a].mp);
const raiseTgt=friends.concat(B.units.filter(x=>x.side===u.side&&!x.dead&&x.hp<=0)).find(x=>x.hp<=0);
if(raiseTgt&&abList.some(a=>AB[a]&&AB[a].k==='raise'&&u.mp>=AB[a].mp)){const ab=abList.find(a=>AB[a]&&AB[a].k==='raise');if(dist(u,raiseTgt)<=AB[ab].r){useAbility(u,ab,raiseTgt.x,raiseTgt.y);setTimeout(()=>nextTurn(),350);return;}}
if(hurt&&healAb&&dist(u,hurt)<=AB[healAb].r){useAbility(u,healAb,hurt.x,hurt.y);setTimeout(()=>nextTurn(),350);return;}
// 2. pick best damaging ability in range, else move closer
const dmgAbs=abList.filter(a=>AB[a]&&(AB[a].k==='dmg'||AB[a].k==='deb')&&u.mp>=AB[a].mp);
dmgAbs.sort((a,b)=>AB[b].p-AB[a].p);
// move toward nearest foe if none in range
let best=null,bestScore=-1e9;
for(const ab of dmgAbs.concat(['attack'])){if(ab!=='attack'&&u.mp<AB[ab].mp)continue;const rg=inRange(u,ab);for(const t of rg){const df=unitAt(t.x,t.y);if(!df||df.side!==foeSide||df.hp<=0)continue;const tiles=AB[ab].aoe?aoeTiles(t.x,t.y,AB[ab].aoe):[t];let score=0;for(const tt of tiles){const v=unitAt(tt.x,tt.y);if(!v||v.dead||v.hp<=0)continue;if(v.side===foeSide)score+=(AB[ab].p||1)*hitChance(u,v,ab)/100*(v.hp>v.maxhp*.3?1.5:1);else score-=2;}score+=Math.random()*2;if(score>bestScore){bestScore=score;best={ab,t};}}}
if(best&&bestScore>0.3){useAbility(u,best.ab,best.t.x,best.t.y);setTimeout(()=>nextTurn(),350);return;}
// move: BFS toward nearest foe
const mv=moveRange(u);if(mv.length){let bt=mv[0],bd=1e9;for(const t of mv){for(const f of foes){const d=Math.abs(t.x-f.x)+Math.abs(t.y-f.y);if(d<bd){bd=d;bt=t;}}}u.x=bt.x;u.y=bt.y;u.h=tileAt(bt.x,bt.y).h;sfx('step');}
// after move, try attack again
best=null;bestScore=-1e9;
for(const ab of dmgAbs.concat(['attack'])){if(ab!=='attack'&&u.mp<AB[ab].mp)continue;const rg=inRange(u,ab);for(const t of rg){const df=unitAt(t.x,t.y);if(!df||df.side!==foeSide||df.hp<=0)continue;const s=(AB[ab].p||1)*hitChance(u,df,ab)/100+Math.random();if(s>bestScore){bestScore=s;best={ab,t};}}}
if(best&&bestScore>0.3){useAbility(u,best.ab,best.t.x,best.t.y);}else{const f=foes.sort((a,b)=>dist(u,a)-dist(u,b))[0];u.face=faceToward(u,f);endAction(u);}
setTimeout(()=>nextTurn(),350);}
// ---------- iso projection ----------
const TW=64,TH=32,HH=14;
function isoX(x,y){return (x-y)*TW/2*ZOOM+CW/2+Input.camX;}
function isoY(x,y,h){return (x+y)*TH/2*ZOOM-(h||0)*HH*ZOOM+CH*0.18+Input.camY;}
function screenTile(sx,sy){let best=null,bd=1e9;for(let y=0;y<MAP.h;y++)for(let x=0;x<MAP.w;x++){const t=tileAt(x,y);const ix=isoX(x,y),iy=isoY(x,y,t.h);const d=Math.hypot(sx-ix,sy-iy);if(d<bd){bd=d;best={x,y};}}return best;}

function battleTap(sx,sy){const u=B.cur;const t=screenTile(sx,sy);if(!t)return;const tu=unitAt(t.x,t.y);
// info on any unit tap when not targeting
if(B.phase==='menu'||B.phase==='tick'||B.phase==='anim'){if(tu)showUnitInfo(tu);return;}
if(B.phase==='face'){if(tu&&tu===u){closeFace(u);}else{showUnitInfo(tu||u);}return;}
if(B.phase!=='target')return;
if(B.mode==='move'){if(tu===u){openActionMenu(u);return;}
const ok=B.moveTiles.find(m=>m.x===t.x&&m.y===t.y);
if(ok&&!tu){u.x=t.x;u.y=t.y;u.h=tileAt(t.x,t.y).h;sfx('step');B.moved=true;B.moveTiles=[];B.mode=null;openAfterMove(u);}else if(tu){showUnitInfo(tu);}else{sfx('cancel');}return;}
// attack/ability/item targeting
const inR=B.rangeTiles.find(r=>r.x===t.x&&r.y===t.y);
if(tu===u&&(B.mode==='attack'||B.mode==='ability'||B.mode==='item')){openActionMenu(u);B.rangeTiles=[];B.mode=null;B.phase='menu';return;}

doAction(u,t);}

else if(B.mode==='ability'){useAbility(u,B.ability,t.x,t.y);}

s+='<br>PA '+u.pa+' MA '+u.ma+' SP '+u.sp+' MV '+u.mv+'<br>'+SIGNS[u.sign]+' ♈ Br'+u.brave+' Fa'+u.faith;
const st=[];if(u.hp<=0)st.push('KO:'+u.ko);if(u.haste)st.push('Haste');if(u.slowT)st.push('Slow');if(u.poison)st.push('Poison');if(u.prot)st.push('Protect');if(u.charm)st.push('Charm');if(st.length)s+='<br>Status: '+st.join(', ');

if(k==='m'||k==='M'){toggleMute();return;}if(k==='f'||k==='F'){toggleFull();return;}

if(k==='Tab'&&u){const us=B.units.filter(x=>!x.dead);const i=us.indexOf(u);const n=us[(i+1)%us.length];showUnitInfo(n);Input.cursor={x:n.x,y:n.y};}}

let frame=0;
function draw(){frame++;ctx.clearRect(0,0,CW,CH);ctx.save();
if(B&&B.shake>0){ctx.translate((Math.random()-.5)*B.shake,(Math.random()-.5)*B.shake);B.shake*=.85;if(B.shake<.3)B.shake=0;}
if(MODE==='battle'||MODE==='map')drawMap();
if(MODE==='battle'&&B)drawUnits();

function drawMap(){const T=THEMES[MAP.theme]||THEMES.plain;
for(let y=0;y<MAP.h;y++)for(let x=0;x<MAP.w;x++){const t=tileAt(x,y);const ix=isoX(x,y),iy=isoY(x,y,t.h);
const w=TW/2*ZOOM,h=TH/2*ZOOM;
// sides for height
if(t.h>0){ctx.fillStyle=T.c2;ctx.beginPath();ctx.moveTo(ix-w,iy);ctx.lineTo(ix,iy+h);ctx.lineTo(ix,iy+h+t.h*HH*ZOOM);ctx.lineTo(ix-w,iy+t.h*HH*ZOOM);ctx.closePath();ctx.fill();
ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.moveTo(ix+w,iy);ctx.lineTo(ix,iy+h);ctx.lineTo(ix,iy+h+t.h*HH*ZOOM);ctx.lineTo(ix+w,iy+t.h*HH*ZOOM);ctx.closePath();ctx.fill();}
const alt=(x+y)%2===0;ctx.fillStyle=alt?T.top:T.c1;
ctx.beginPath();ctx.moveTo(ix,iy-h);ctx.lineTo(ix+w,iy);ctx.lineTo(ix,iy+h);ctx.lineTo(ix-w,iy);ctx.closePath();ctx.fill();
if(SETS.grid){ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;ctx.stroke();}
// highlight layers
if(B&&MODE==='battle'){let hl=null;
if(B.moveTiles.find(m=>m.x===x&&m.y===y))hl='rgba(80,150,255,.45)';
if(B.rangeTiles.find(m=>m.x===x&&m.y===y))hl=B.mode==='item'?'rgba(110,255,140,.45)':'rgba(255,90,80,.4)';
if(B.cur&&B.cur.x===x&&B.cur.y===y&&!B.cur.dead)hl='rgba(255,220,90,.5)';
if(Input.cursor.x===x&&Input.cursor.y===y)hl=hl||'rgba(255,255,255,.25)';
if(hl){ctx.fillStyle=hl;ctx.beginPath();ctx.moveTo(ix,iy-h);ctx.lineTo(ix+w,iy);ctx.lineTo(ix,iy+h);ctx.lineTo(ix-w,iy);ctx.closePath();ctx.fill();}}}}
function drawUnits(){const us=[...B.units].sort((a,b)=>(a.x+a.y)-(b.x+b.y));
for(const u of us){if(u.dead)continue;const ix=isoX(u.x,u.y),iy=isoY(u.x,u.y,u.h);
const s=ZOOM*(u.boss?1.35:1);const bob=u.hp>0?Math.sin(frame/18+u.x)*2:0;
// shadow
ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(ix,iy+4*s,12*s,5*s,0,0,7);ctx.fill();
if(u.hp<=0){ // KO: fallen + counter
ctx.fillStyle='#333a4a';ctx.fillRect(ix-10*s,iy-8*s,20*s,7*s);
ctx.fillStyle='#ff6060';ctx.font='bold '+(11*s+4)+'px serif';ctx.textAlign='center';ctx.fillText(u.ko,ix,iy-10*s);continue;}
const J=JOBS[u.job]||{color:'#fff'};
// body: chibi knight
const side=u.side==='P'?'#3a5a8c':'#8c3a3a';
ctx.fillStyle=side;ctx.fillRect(ix-7*s,iy-22*s+bob,14*s,20*s); // torso
ctx.fillStyle=J.color;ctx.fillRect(ix-7*s,iy-22*s+bob,14*s,6*s); // job trim
ctx.fillStyle='#e8c39a';ctx.beginPath();ctx.arc(ix,iy-26*s+bob,6*s,0,7);ctx.fill(); // head
ctx.fillStyle=u.sex==='F'?'#7a4a2a':'#3a3a3a';ctx.fillRect(ix-6*s,iy-33*s+bob,12*s,4*s); // hair/helm
// facing tick
ctx.fillStyle='#ffe27a';const f={0:[0,-3],1:[5,0],2:[0,3],3:[-5,0]}[u.face];ctx.fillRect(ix+f[0]*s-1.5,iy-26*s+bob+f[1]*s,3,3);
// weapon glyph
ctx.fillStyle='#d8d8e8';if(u.wType==='bow')ctx.fillRect(ix+8*s,iy-24*s+bob,2,14*s);else if(u.wType==='rod')ctx.fillRect(ix-9*s,iy-26*s+bob,2,16*s);else ctx.fillRect(ix+7*s,iy-28*s+bob,3*s,12*s);
if(u.boss){ctx.fillStyle='#c9a0ff';ctx.font='bold '+(10*s+4)+'px serif';ctx.textAlign='center';ctx.fillText('👹',ix,iy-36*s+bob);}
if(u.haste){ctx.fillStyle='#9fe8ff88';ctx.fillRect(ix-8*s,iy-30*s+bob,16*s,2);}
// hp bar
ctx.fillStyle='#200';ctx.fillRect(ix-11*s,iy-39*s+bob,22*s,4*s);
ctx.fillStyle=u.side==='P'?'#4ae08a':'#e05a4a';ctx.fillRect(ix-11*s,iy-39*s+bob,22*s*clamp(u.hp/u.maxhp,0,1),4*s);
if(u===B.cur&&!u.dead){ctx.strokeStyle='#ffe27a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ix,iy-16*s+bob,14*s+Math.sin(frame/8)*2,0,7);ctx.stroke();}
if(u.charge){ctx.fillStyle='#fff';ctx.font=(10*s+3)+'px serif';ctx.textAlign='center';ctx.fillText('…',ix,iy-42*s);}}}
function drawFx(){for(let i=B.fx.length-1;i>=0;i--){const p=B.fx[i];p.life-=1/60;if(p.life<=0){B.fx.splice(i,1);continue;}p.x+=p.vx/60;p.y+=p.vy/60;p.vh-=9/60;p.h+=p.vh/60;const ix=isoX(p.x,p.y),iy=isoY(p.x,p.y,Math.max(0,p.h));ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.c;ctx.fillRect(ix-2,iy-2,4,4);ctx.globalAlpha=1;}}

let partySel=0;
function openParty(){const items=G.party.map((p,i)=>({id:String(i),label:(p.story?'⭐ ':'')+p.name+' <small>Lv'+p.lv+' '+JOBS[p.job].n+' · HP'+p.hp+'/'+p.maxhp+'</small>'}));
items.push({id:'__back',label:'◀ Back to map'});
turnbar('<b>⛺ Party</b><br>Gil: <b>'+G.gil+'</b>');
showMenu(items,id=>{if(id==='__back'){showMap();return;}partySel=+id;openUnit(G.party[partySel]);});}
function openUnit(p){recalc(p);const items=[
{id:'job',label:'🎭 Job: '+JOBS[p.job].n+' (Lv'+jobLvl(p,p.job)+')'},
{id:'learn',label:'📖 Learn abilities <small>'+p.jp[p.job]+' JP</small>'},
{id:'eq',label:'🗡️ Equipment'},
{id:'__back',label:'◀ Back'}];
info('<b>'+p.name+'</b> Lv'+p.lv+' '+JOBS[p.job].n+'<br>HP '+p.hp+'/'+p.maxhp+' MP '+p.mp+'/'+p.maxmp+' PA '+p.pa+' MA '+p.ma+' SP '+p.sp+' MV '+p.mv+'<br>'+SIGNS[p.sign]+' Br'+p.brave+' Fa'+p.faith+' · EXP '+p.exp);
showMenu(items,id=>{if(id==='__back'){info(null);openParty();return;}if(id==='job')openJobMenu(p);else if(id==='learn')openLearnMenu(p);else if(id==='eq')openEquipMenu(p);});}
function openJobMenu(p){const items=Object.keys(JOBS).map(j=>{const ok=jobUnlocked(p,j);const req=JOBS[j].req?(' <small>needs '+Object.keys(JOBS[j].req).map(k=>JOBS[k].n+' '+JOBS[j].req[k]).join(', ')+'</small>'):'';
return{id:j,label:(p.job===j?'▶ ':'')+JOBS[j].n+' Lv'+jobLvl(p,j)+req,dis:!ok};});
items.push({id:'__back',label:'◀ Back'});
showMenu(items,id=>{if(id==='__back'){openUnit(p);return;}p.job=id;if(!p.jlvl[id])p.jlvl[id]=1;const keep=p.hp/p.maxhp;recalc(p);p.hp=Math.round(p.maxhp*keep);p.mp=p.maxmp;sfx('ok');saveGame('auto');openUnit(p);});}
function openLearnMenu(p){const J=JOBS[p.job];const items=J.ab.map(a=>({id:a,label:(p.learned[a]?'✔ ':'')+AB[a].n+' — '+learnCost(a)+'JP <small>'+AB[a].desc+'</small>',dis:!!p.learned[a]||(p.jp[p.job]||0)<learnCost(a)}));
items.push({id:'__back',label:'◀ Back ('+p.jp[p.job]+' JP)'});
showMenu(items,id=>{if(id==='__back'){openUnit(p);return;}p.jp[p.job]-=learnCost(id);p.learned[id]=1;sfx('fanfare');saveGame('auto');openLearnMenu(p);});}
function openEquipMenu(p){G.stash=G.stash||{};const slots=[['w','Weapon'],['a','Armor'],['h','Head'],['s','Shield'],['acc','Accessory']];
const items=slots.map(([s,ln])=>{const cur=s==='w'?WEAPONS.find(w=>w.id===p.eq.w):ARMOR.find(a=>a.id===p.eq[s]);return{id:s,label:ln+': '+(cur?cur.n:'—')};});
items.push({id:'__back',label:'◀ Back'});
showMenu(items,id=>{if(id==='__back'){openUnit(p);return;}openSlotMenu(p,id);});}
function openSlotMenu(p,slot){G.stash=G.stash||{};
const pool=slot==='w'?WEAPONS:ARMOR.filter(a=>slot==='a'?(a.slot==='armor'||a.slot==='robe'):slot==='h'?(a.slot==='helm'||a.slot==='hat'):slot==='s'?a.slot==='shield':a.slot==='acc');
const jobEq=JOBS[p.job].eq;
const items=[{id:'__none',label:'— Unequip —'}].concat(pool.filter(x=>(G.stash[x.id]||0)>0||p.eq[slot]===x.id).map(x=>({id:x.id,label:(p.eq[slot]===x.id?'▶ ':'')+x.n+' <small>own '+(G.stash[x.id]||0)+'</small>'})));
items.push({id:'__back',label:'◀ Back'});
showMenu(items,id=>{if(id==='__back'){openEquipMenu(p);return;}
if(p.eq[slot])G.stash[p.eq[slot]]=(G.stash[p.eq[slot]]||0)+1;
if(id==='__none'){p.eq[slot]=null;}else{G.stash[id]--;p.eq[slot]=id;}
recalc(p);sfx('ok');saveGame('auto');openEquipMenu(p);});}
// ---------- save/load ----------
function saveGame(slot){try{if(!G)return;G.playtime=(G.playtime||0)+1;localStorage.setItem('zlt_'+slot,JSON.stringify(G));}catch(e){}}
function loadGame(slot){try{const s=localStorage.getItem('zlt_'+slot);if(!s)return false;G=JSON.parse(s);G.party.forEach(p=>{recalc(p);p.hp=clamp(p.hp,1,p.maxhp);p.mp=clamp(p.mp,0,p.maxmp);});return true;}catch(e){return false;}}
function autosave(){saveGame('auto');saveGame('slot1');}
function openSave(){const items=['slot1','slot2','slot3'].map(s=>{let d='— empty —';try{const g=JSON.parse(localStorage.getItem('zlt_'+s));if(g)d='Ch.'+g.ch+' · '+BATTLES[Math.min(g.bi,BATTLES.length-1)].map+' · '+g.party.length+' units';}catch(e){}return{id:'load_'+s,label:'📂 Load '+s+' <small>'+d+'</small>'};});
items.push({id:'save2',label:'💾 Save to slot 2'},{id:'save3',label:'💾 Save to slot 3'},{id:'__back',label:'◀ Back'});
showMenu(items,id=>{if(id==='__back'){showMap();return;}
if(id.startsWith('load_')){const s=id.slice(5);if(loadGame(s)){sfx('fanfare');showMap();}else toast('Empty slot');return;}
saveGame(id==='save2'?'slot2':'slot3');sfx('ok');toast('Saved!');openSave();});}
// ---------- title / options / pause / ending ----------
function bootTitle(){const tb=$('titleBtns');tb.innerHTML='';const has=!!localStorage.getItem('zlt_slot1')||!!localStorage.getItem('zlt_auto');
const mk=(t,fn)=>{const b=document.createElement('button');b.className='bigbtn';b.textContent=t;b.onclick=()=>{audio();startMusic();fn();};tb.appendChild(b);};
if(has)mk('▶ Continue',()=>{if(loadGame('slot1')||loadGame('auto')){hideTitle();showMap();}else toast('Save corrupted');});
mk(has?'✦ New Game':'✦ New Game',()=>{newCampaign();});
const op=$('titleOpts');op.innerHTML='';
const o1=document.createElement('button');o1.className='smlbtn';o1.textContent='⚙ Options';o1.onclick=()=>{audio();openOptions();};op.appendChild(o1);
const o2=document.createElement('button');o2.className='smlbtn';o2.textContent='📜 How to Play';o2.onclick=()=>{audio();openHelp();};op.appendChild(o2);}
function hideTitle(){$('title').style.display='none';}
function newCampaign(){G=newGame();
const ramza=mkUnit('Ramza','squire',1,'P',{sex:'M',sign:4,story:true});ramza.learned={rush:1,dash:1};
const delita=mkUnit('Delita','squire',1,'P',{sex:'M',sign:0,story:true});delita.learned={rush:1,focus:1};
const alma=mkUnit('Alma','chemist',1,'P',{sex:'F',sign:6,story:true});alma.learned={throw2:1};
G.party=[ramza,delita,alma];hideTitle();
say([['???','Ivalice bleeds. Two lions bare their fangs, and the Church counts its stones...'],['Ramza','Whatever comes — we face it together. For the lions!']],()=>{showMap();});}
function openOptions(){const items=[
{id:'mute',label:(SETS.mute?'🔇 Unmute':'🔊 Mute')},
{id:'vol',label:'🔈 Volume: '+Math.round(SETS.vol*100)+'% (tap to cycle)'},
{id:'music',label:'🎵 Music: '+Math.round(SETS.music*100)+'% (tap to cycle)'},
{id:'speed',label:'⏩ Anim speed: '+(SETS.speed===1?'Normal':'Fast')},
{id:'grid',label:'▦ Grid: '+(SETS.grid?'On':'Off')},
{id:'full',label:'⛶ Fullscreen'},
{id:'__back',label:'◀ Back'}];
showMenu(items,id=>{if(id==='__back'){hideMenu();return;}
if(id==='mute')toggleMute();else if(id==='vol'){SETS.vol=SETS.vol>=1?0.3:SETS.vol+0.2;if(masterG)masterG.gain.value=SETS.mute?0:SETS.vol;saveSets();}
else if(id==='music'){SETS.music=SETS.music>=1?0.2:SETS.music+0.2;if(musicG)musicG.gain.value=SETS.music*.5;saveSets();}
else if(id==='speed'){SETS.speed=SETS.speed===1?2:1;saveSets();}
else if(id==='grid'){SETS.grid=!SETS.grid;saveSets();}
else if(id==='full'){toggleFull();return;}
openOptions();});}
function openHelp(){hideMenu();turnbar(null);
say([['How to Play','Tap your unit → Move (blue), then Attack / Abilities / Item / Wait. Tap a tile to preview hit%, tap again to confirm.'],['How to Play','Turns use CT: faster units act sooner. KO units count down 3…2…1, then become crystals — revive them fast! Ramza falling means defeat.'],['How to Play','Between battles: ★ story, ⚔️ skirmishes to train, 🏪 shop & recruits, ⛺ jobs, abilities (JP) & gear. Pinch/drag to zoom & pan. Keyboard: arrows+Enter. Gamepad supported.']],()=>{if(MODE==='map')drawMapOverlay();});}
function openPause(){const items=[{id:'resume',label:'▶ Resume'},{id:'opt',label:'⚙ Options'},{id:'save',label:'💾 Save'},{id:'quit',label:'🚪 Quit to title'}];
showMenu(items,id=>{if(id==='resume'||id==='__x'){}else if(id==='opt'){openOptions();return;}else if(id==='save'){saveGame('slot1');toast('Saved!');}else if(id==='quit'){saveGame('slot1');location.reload();return;}});}
function winGame(){G.won=true;saveGame('slot1');MODE='ending';hideMenu();info(null);turnbar(null);help(null);
stopMusic();sfx('fanfare');
say([['Altima','Impossible... the stones... scatter...'],['Ramza','It is done. The lions sleep. Ivalice... is free.'],['Delita','History will call us villains, old friend. Let it. We know the truth.'],['THE END','Thank you for playing ZODIAC LION TACTICS. Your tale is saved — skirmishes and party remain open.']],()=>{showMap();});}
function toggleMute(){SETS.mute=!SETS.mute;if(masterG)masterG.gain.value=SETS.mute?0:SETS.vol;saveSets();$('bSound').textContent=SETS.mute?'🔇':'🔊';}
function toggleFull(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){toast('Fullscreen unavailable');}}
$('bSound').onclick=()=>{audio();toggleMute();};
$('bFull').onclick=()=>{toggleFull();};
$('bMenu').onclick=()=>{if(MODE==='battle'||MODE==='map')openPause();else openOptions();};
// ---------- main loop ----------
let lastT=0;
function loop(t){requestAnimationFrame(loop);pollPad();const dt=Math.min(50,t-(lastT||t));lastT=t;
if(Input.tapped&&!dlgQ.length)onTap();else if(Input.tapped)Input.tapped=false;
try{draw();}catch(e){if(!window._drew){window._drew=1;console.error(e);}}}
fit();bootTitle();
genMap('plain',9,9);
requestAnimationFrame(loop);

</script>
</body>
</html>
