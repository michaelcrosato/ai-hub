      AIHub.send(snap, { reliable: false });
    } else {
      const h = this.me();
      if (!h) return;
      AIHub.send({ t: 'm', at: Math.round(AIHub.time()), s: [r1(h.x), r1(h.y), r1(h.z), h.face, STC[h.st], Math.round(h.hp), h.mount, MOVE_CODES.indexOf(h.move), h.books] }, { to: this.info.host, reliable: false });
    }
  },
  onMessage(m, from) {
    if (!m || typeof m !== 'object') return;
    const host = this.info.isHost;
    const hero = findHero(from);
    switch (m.t) {
      // ---- to the host
      case 'm': if (host && hero && m.at > hero.at) { hero.at = m.at; const s = m.s; hero.tx = s[0]; hero.ty = s[1]; hero.tz = s[2]; hero.face = s[3]; const st = ST[s[4]] || 'idle'; if (st !== hero.st) { hero.st = st; hero.stT = 0; hero.moveT = 0; } hero.hp = s[5]; hero.move = MOVE_CODES[s[7]] || null; hero.books = s[8]; if (hero.mount >= 0 && s[6] < 0) { const b = findBeast(hero.mount); if (b) b.rider = null; hero.mount = -1; } } break;
      case 'h': if (host) { const f = findFoe(m.f); if (f && hero) { const hit = { dmg: clamp(+m.d || 1, 0, 30), dir: m.r > 0 ? 1 : -1, knock: !!m.k, kb: clamp(+m.b || 2, 0, 10), move: MOVE_CODES[m.m] }; hitSpark(f, hit); hurtFoe(f, hit, from); } } break;
      case 'tk': if (host) { const p = W.pickups.find((q) => q.id === m.id); if (p) { removePickup(p.id); this.toPlayer(from, { t: 'gv', k: p.kind }); this.event({ t: 'pk', id: p.id }); if (p.kind === 'gold' && hero) hero.score += 500; } } break;
      case 'mt': if (host && hero) { const b = findBeast(m.b); if (b && !b.rider) mountBeast(hero, b); } break;
      case 'dm': if (host && hero) { const b = findBeast(m.b); if (b && b.rider && b.rider.id === from) b.rider = null; hero.mount = -1; } break;
      case 'br': if (host) hitBreakable(m.i); break;
      case 'th': if (host && hero) { const f = findFoe(m.f); if (f && (f.st === 'hurt' || f.st === 'idle' || f.st === 'walk')) { f.x = hero.tx; f.z = hero.tz; f.y = 1.4; setState(f, 'thrown'); f.vx = -m.r * 7; f.vy = 6; f.thrownBy = from; } } break;
      case 'mg': if (host && hero) { hero.casts = (hero.casts || 0) + 1; after(0.65, () => magicDamage(from, clamp(m.lv | 0, 1, 6))); } break;
      // ---- from the host (or anyone, for visuals)
      case 's': if (!host && from === this.info.host) this.applySnapshot(m); break;
      case 'u': { const me = this.me(); if (me) hurtHero(me, { dmg: clamp(+m.d || 1, 0, 20), dir: m.r > 0 ? 1 : -1, knock: !!m.k }); break; }
      case 'gv': { const me = this.me(); if (me) giveItem(me, m.k); break; }
      case 'pk': removePickup(m.id); break;
      case 'brk': Level.breakIt(m.i); break;
      case 'cl': { const f = findFoe(m.f); if (f) { Audio.sfx('clang'); emit('spark', f.x + f.face * 0.4, 1.3, f.z + 0.3, 10, 6); } break; }
      case 'sh': { const f = findFoe(m.f); if (f) shatterFoe(f); break; }
      case 'fx':
        if (m.k === 'mg') magicFx(m.s, m.lv, m.x / 10, m.z / 10, m.f);
        else if (m.k === 'slam') { shake(0.6); Audio.sfx('thunder'); ring(m.x / 10, 0.1, m.z / 10, '#ffcf6a', 0.5, 9, 0.6); emit('wax', m.x / 10, 0.3, m.z / 10, 30, 7); }
        break;
      case 'hz': if (!host) addHazard({ kind: 'drop', x: m.x / 10, z: m.z / 10, t: 0, fuse: m.f }); break;
      case 'say': UI.dialog({ who: m.w, text: String(m.x).slice(0, 140) }); break;
      case 'ph': if (!host && m.n !== W.phase) startPhase(m.n); break;
      case 'go': W.goT = 3; Audio.sfx('go'); break;
      case 'win': UI.banner('VICTORY!', 3); Audio.sfx('stinger'); break;
      case 'clear': UI.banner('STAGE CLEAR', 3); break;
      case 'over': Game.sessionOver(m); break;
    }
  },
  applySnapshot(s) {
    if (s.at < this.lastSnap) return;
    this.lastSnap = s.at;
    const [ph, lockIdx, locked, camMax, camFloor, bossId] = s.ph;
    if (ph !== W.phase) startPhase(ph, { silent: false });
    W.lockIdx = lockIdx; W.locked = !!locked; W.camMax = camMax / 10; W.camFloor = Math.max(W.camFloor, camFloor / 10 - 1); W.bossId = bossId;
    const me = this.me();
    for (const a of s.h) {
      const [id, x, y, z, face, st, hp, mount, move, score, kills, books, heroIdx] = a;
      let h = findHero(id);
      if (!h) continue;
      h.score = score; h.kills = kills;
      if (h === me) continue;
      h.tx = x; h.ty = y; h.tz = z; h.face = face; h.hp = hp; h.mount = mount; h.books = books; h.heroIdx = heroIdx;
      const nst = ST[st] || 'idle';
      if (nst !== h.st || MOVE_CODES[move] !== h.move) { h.st = nst; h.stT = 0; h.moveT = 0; h.move = MOVE_CODES[move] || null; }
    }

      const [id, code, x, y, z, face, st, pct, mount, move] = a;
      seen.add(id);
      let f = findFoe(id);
      if (!f) { f = makeFoe(FOE_CODES[code], x, z, { id, rise: ST[st] === 'rise' }); f.y = y; }
      f.tx = x; f.ty = y; f.tz = z; f.face = face; f.hp = (pct / 100) * f.maxHp; f.mount = mount;
      const nst = ST[st] || 'idle';
      if (nst !== f.st || MOVE_CODES[move] !== f.move) { f.st = nst; f.stT = 0; f.moveT = 0; f.move = MOVE_CODES[move] || null; }
    }
    for (let i = W.foes.length - 1; i >= 0; i--) if (!seen.has(W.foes[i].id)) { removeActor(W.foes[i]); W.foes.splice(i, 1); }
    const seenB = new Set();
    for (const a of s.b) {

      if (!b) b = makeBeast(kind ? 'drake' : 'crest', x, z, { id });

      if (mine && me.mount !== id) { me.mount = id; me.st = 'ride'; me.x = b.x; me.z = b.z; me.wantMount = -1; Audio.sfx('roar'); me.rode = true; }
      if (!mine && me && me.mount === id && W.t - (me.mountT || 0) > 1) me.mount = -1;
      if (mine) me.mountT = W.t;
      b.rider = rider === -1 ? null : { kind: rider === -2 ? 'foe' : 'hero', id: rider };
      if (!mine) { b.tx = x; b.ty = y; b.tz = z; b.face = face; b.attackK = atk; }
    }
    for (let i = W.beasts.length - 1; i >= 0; i--) if (!seenB.has(W.beasts[i].id)) { removeActor(W.beasts[i]); W.beasts.splice(i, 1); }
    const seenP = new Set();
    for (const [id, kind, x, z] of s.p) {
      seenP.add(id);
      if (!W.pickups.find((p) => p.id === id)) { const p = spawnPickup(PICKUP_KINDS[kind], x, z, { id }); p.y = 0.25; p.vy = 0; p.vx = 0; }
    }
    for (let i = W.pickups.length - 1; i >= 0; i--) if (!seenP.has(W.pickups[i].id) && !W.pickups[i].claimed) { fxRoot.remove(W.pickups[i].mesh); W.pickups.splice(i, 1); }
  },
};
/** Remote bodies ease toward where they last said (or the host last said) they are. */
function easeRemote(dt) {
  const k = 1 - Math.pow(0.0005, dt);
  for (const h of W.heroes) if (!h.local && h.at !== undefined && h.tx !== undefined && !h.gone) {
    h.x += (h.tx - h.x) * k; h.y += (h.ty - h.y) * k; h.z += (h.tz - h.z) * k;
    h.vx = (h.tx - h.x) * 4; h.vz = (h.tz - h.z) * 4; h.stT += dt; h.moveT += dt;
    const b = h.mount >= 0 ? findBeast(h.mount) : null;
    if (b) { b.x = h.x; b.z = h.z; b.face = h.face; b.moving = Math.hypot(h.vx, h.vz); }
  }
  if (W.authority) return;
  for (const f of W.foes) {
    f.x += (f.tx - f.x) * k; f.y += (f.ty - f.y) * k; f.z += (f.tz - f.z) * k;
    f.vx = (f.tx - f.x) * 4; f.vz = (f.tz - f.z) * 4; f.stT += dt; f.moveT += dt;
    f.flash = Math.max(0, (f.flash || 0) - dt);
  }
  for (const b of W.beasts) {
    const me = Net.me();
    if (me && me.mount === b.id) continue;
    if (b.tx === undefined) continue;
    b.x += (b.tx - b.x) * k; b.y += (b.ty - b.y) * k; b.z += (b.tz - b.z) * k;
    b.moving = Math.hypot(b.tx - b.x, b.tz - b.z) * 4;
  }
}

// ---------------------------------------------------------------- the game object
const Game = {
  scene: 'boot', paused: false, slowT: 0, attractT: 0, attractSeq: [0, 1, 2, 4], attractI: 0, players: [],
  slowmo(t) { this.slowT = t; },
  newJourney(picks) {
    // picks: [{ dev, heroIdx }]
    clearWorld(false);
    W.mode = 'solo'; W.authority = true; W.attract = false; W.credits = 3; W.over = false; W.t = 0; W.nextId = 1;
    picks.forEach((p, i) => makeHero({ id: i, local: true, dev: p.dev, heroIdx: p.heroIdx, color: SEAT_COLORS[i], lives: 3, books: 1, name: (picks.length > 1 ? 'P' + (i + 1) + ' ' : '') + HEROES[p.heroIdx].name }));
    this.scene = 'play';
    UI.show('hud');
    startPhase(0);
  },
  joinMidGame(dev) {
    if (W.mode !== 'solo' || W.attract || W.heroes.length >= 2) return false;
    const used = W.heroes.map((h) => h.heroIdx);
    const heroIdx = [0, 1, 2].find((i) => !used.includes(i));
    const h = makeHero({ id: W.heroes.length, local: true, dev, heroIdx, color: SEAT_COLORS[W.heroes.length], lives: 3, books: 1, name: 'P2 ' + HEROES[heroIdx].name, x: W.camX - 3 });
    h.y = 4; setState(h, 'jump'); h.invuln = 2;
    W.heroes[0].name = 'P1 ' + W.heroes[0].H.name; W.heroes[0].tag.firstChild.textContent = W.heroes[0].name;
    UI.toast('Player 2 joins as ' + HEROES[heroIdx].name + '!');
    Audio.sfx('pickup');
    return true;
  },
  startAttract() {
    clearWorld(false);
    W.mode = 'solo'; W.authority = true; W.attract = true; W.t = 0; W.nextId = 1;
    makeHero({ id: 0, local: true, heroIdx: randi(0, 2), lives: 99, books: 9, cheat: true, ai: attractAI, name: 'DEMO' });
    this.attractI = 0; this.attractT = 0;
    this.scene = 'attract';
    UI.show('attract');
    startPhase(this.attractSeq[0], { silent: true });
  },
  stopAttract() {
    clearWorld(false);
    this.scene = 'title';
    UI.show('title');
    Audio.playSong('title');
    Level.build(CAMP); W.camX = 14; W.phaseKind = 'title';
  },
  stageClear() {
    UI.banner('STAGE CLEAR', 3);
    Audio.sfx('stinger');
    for (const h of W.heroes) if (!h.gone) { h.score += 1000 + h.hp * 50; }
    if (W.mode === 'host') Net.event({ t: 'clear' });
  },
  allOut() {
    if (W.attract) return;
    if (W.credits > 0) UI.continueScreen(W.credits, (yes) => {
      if (!yes) return this.finishJourney(false);
      W.credits--;
      for (const h of W.heroes) { h.gone = false; h.lives = 3; h.score = Math.floor(h.score / 2); h.rig.root.visible = true; respawnHero(h); h.lives = 3; }
    });
    else this.finishJourney(false);
  },
  finishJourney(won) {
    const best = Math.max(0, ...W.heroes.map((h) => h.score));
    saveHiscore(best);
    if (won) UI.credits(best, () => this.toTitle());
    else UI.gameOver(best, () => this.toTitle());
  },
  toTitle() {
    clearWorld(false);
    W.attract = false; W.over = false;
    this.scene = 'title';
    Level.build(CAMP); W.camX = 14; W.phaseKind = 'title'; W.stage = CAMP;
    UI.show('title');
    Audio.playSong('title');
    Input.touch();
  },
  // ---------------- session
  async session() {
    const info = await AIHub.connect({ mode: 'co-op', seats: [1, 4] });
    if (!info) return false;
    Net.info = info;
    W.mode = info.isHost ? 'host' : 'client';
    W.authority = info.isHost; W.attract = false; W.t = 0; W.nextId = 1000;
    clearWorld(false);
    for (const p of info.players) {
      const local = p.id === info.me && !info.server;
      makeHero({ id: p.id, local, dev: local ? 'any' : null, heroIdx: p.id % 3, color: p.color, name: p.name, lives: 99, books: 1 });
    }
    startPhase(0, { silent: true });
    this.scene = 'ready';
    UI.show('hud');
    AIHub.on('start', () => { Audio.init(); this.scene = 'play'; UI.sessionCountdown(); });
    AIHub.on('message', (data, from) => Net.onMessage(data, from));
    AIHub.on('leave', ({ id }) => {
      const h = findHero(id);
      if (h) { h.gone = true; if (h.mount >= 0) { const b = findBeast(h.mount); if (b) b.rider = null; } removeActor(h); W.heroes.splice(W.heroes.indexOf(h), 1); }
    });
    AIHub.on('time-up', () => { if (info.isHost) this.sessionFinish(false); });
    AIHub.on('end', ({ reason, standings }) => { this.scene = 'over'; Audio.stopSong(); Audio.setMuted(true); UI.sessionEnd(reason, standings); });
    if (info.splash || info.server) AIHub.ready();
    else UI.readyPrompt(info.players, () => AIHub.ready());
    return true;
  },
  sessionFinish(won) {
    if (W.over) return;
    W.over = true;
    const hs = [...W.heroes].sort((a, b) => b.score - a.score);
    const standings = [];
    for (const h of hs) { const last = standings[standings.length - 1]; if (last && last.s === h.score) last.ids.push(h.id); else standings.push({ s: h.score, ids: [h.id] }); }
    const stats = {}, awards = [];
    for (const h of W.heroes) stats[h.id] = { 'foes felled': h.kills, score: h.score, 'spells cast': h.casts || 0, 'best hit': Math.round(h.maxHit * 10) / 10, falls: h.deaths || 0 };
    const topK = hs.slice().sort((a, b) => b.kills - a.kills)[0];
    if (topK && topK.kills > 0) awards.push({ id: topK.id, title: 'Waxbreaker', detail: topK.kills + ' foes felled' });
    for (const h of W.heroes) if (h.rode) { awards.push({ id: h.id, title: 'Beast Rider', detail: 'Tamed a wild mount' }); break; }
    if (won && W.bossKiller >= 0 && findHero(W.bossKiller)) awards.push({ id: W.bossKiller, title: 'Axe Reclaimed', detail: 'Struck down Lord Tallowmar' });
    AIHub.finish({ standings: standings.map((g) => g.ids), scores: Object.fromEntries(W.heroes.map((h) => [h.id, h.score])), won, stats, awards });
    Net.event({ t: 'over', won: won ? 1 : 0 });
    this.sessionOver({ won });
  },
  sessionOver(m) { W.over = true; UI.banner(m.won ? 'THE GOLDEN AXE IS RECLAIMED!' : 'THE ROUND IS DONE', 4); },
};

      const pos = visible.findIndex(([, i]) => i === m.focus);
      const np = (pos + (dir === 'down' ? 1 : -1) + visible.length) % visible.length;
      m.focus = visible[np][1]; Audio.sfx('menuMove'); this.renderMenu(m);
    } else if (dir === 'left' || dir === 'right') {
      const it = m.items[m.focus];
      if (it && (it.type === 'slider' || it.type === 'choice')) this.activate(m, it, dir === 'right' ? 1 : -1);
    }
    if (Input.any('confirm')) {
      const it = m.items[m.focus];
      if (it && it.type !== 'slider') this.activate(m, it, 1);
    } else if (Input.any('cancel') || (m.optionsCloses && Input.any('options'))) {
      if (m.back) m.back(); else this.pop();
    }
  },

      <p class="tips">Run + attack: shoulder dash. Jump + attack: leaping slash. Jump, hold down + attack: downward thrust.<br>Third strike on a reeling foe: <b>throw</b>. Jump beside a riderless beast to <b>ride</b> it; ○ leaps off.<br>Kick the little imps — they drop <b>spellbooks</b> and <b>meat</b>. Each book is a level of magic.</p>`,

  aboutMenu() {

  // ---------------------------------------------------------------- title & select
  buildTitle() {
    const t = this.layers.title;
    t.innerHTML = `<div class="logo"><div class="logo-top">GOLDEN</div><div class="logo-mid">WAXED</div><div class="logo-ii">II</div></div>
      <div class="tagline">The Golden Axe is stolen. The land is turning to wax.</div>
      <div class="press" id="press"></div><div class="hiscore" id="hiscore"></div>
      <div class="titlefoot">A spiritual successor to <i>Golden Axe II</i> · WebGPU · ${BUILD_DATE}</div>`;
  },
  renderTitle() {
    $('#press').innerHTML = `Press ${glyph('confirm')} to begin`;
    $('#hiscore').textContent = hiscore ? 'BEST SCORE ' + hiscore.toLocaleString() : '';
  },
  mainMenu() {
    this.push({
      id: 'main', title: null, cls: 'main', help: true,
      items: [
        { label: 'Begin the Journey', action: () => { this.closeAll(); this.startSelect(); } },
        { label: 'How to Fight', action: () => this.push(this.controlsMenu()) },
        { label: 'Settings', action: () => this.push(this.settingsMenu()) },
        { label: 'About & Credits', action: () => this.push(this.aboutMenu()) },
      ],
      back: () => { this.pop(); },
    });
  },
  startSelect() {
    this.show('select');
    Game.scene = 'select';
    this.sel = { slots: [{ dev: null, idx: 0, locked: false }], started: performance.now() };
    // whoever opened the menu is player one
    this.sel.slots[0].dev = Input.lastDevice;
    this.renderSelect();
  },
  renderSelect() {
    const L = this.layers.select;
    const s = this.sel;
    L.innerHTML = `<h1 class="sel-title">Choose your warrior</h1><div class="cards"></div><div class="sel-help"></div>`;
    const cards = L.querySelector('.cards');
    HEROES.forEach((H, i) => {
      const c = el('div', 'hcard');
      const who = s.slots.map((sl, k) => (sl.idx === i ? k : -1)).filter((k) => k >= 0);
      if (who.length) c.classList.add('focus');
      if (s.slots.some((sl) => sl.locked && sl.idx === i)) c.classList.add('taken');
      c.innerHTML = `<div class="portrait p-${H.id}"><div class="pface"></div></div><div class="hname">${H.name}</div><div class="htitle">${H.title}</div>
        <div class="stats"><div>Power <b>${'■'.repeat(Math.round(H.power * 4))}</b></div><div>Speed <b>${'■'.repeat(Math.round(H.speed - 1))}</b></div><div>Vigour <b>${'■'.repeat(Math.round(H.hp / 5))}</b></div><div>Magic <b>${'▮'.repeat(H.magicMax)}</b></div></div>
        <div class="spell">${H.spellName}</div><div class="bio">${H.bio}</div>
        <div class="cursors">${who.map((k) => `<span class="cur" style="background:${SEAT_COLORS[k]}">P${k + 1}${s.slots[k].locked ? ' ✓' : ''}</span>`).join('')}</div>`;
      c.addEventListener('click', () => { s.slots[0].idx = i; this.confirmSlot(0); });
      c.addEventListener('mouseenter', () => { if (!s.slots[0].locked) { s.slots[0].idx = i; this.renderSelect(); } });
      cards.appendChild(c);
    });
    const p2 = s.slots.length < 2 ? `<div class="join">Player 2: press ${glyph('confirm')} on another controller to join</div>` : '';
    L.querySelector('.sel-help').innerHTML = `${glyph('move')} Choose &nbsp; ${glyph('confirm')} Confirm &nbsp; ${glyph('cancel')} Back ${p2}`;
  },
  confirmSlot(k) {
    const s = this.sel;
    const sl = s.slots[k];
    if (s.slots.some((o, j) => j !== k && o.locked && o.idx === sl.idx)) { Audio.sfx('menuBack'); return; }
    sl.locked = true;
    Audio.sfx('menuOk');
    Audio.speak(HEROES[sl.idx].name, HEROES[sl.idx].voice);
    if (s.slots.every((o) => o.locked)) {
      setTimeout(() => {
        const one = s.slots.length === 1;
        const picks = s.slots.map((o) => ({ dev: one ? 'any' : o.dev, heroIdx: o.idx }));
        this.storyLines(STORY.intro, () => Game.newJourney(picks), false);
      }, 450);
    }
    this.renderSelect();
  },
  selectInput(now) {
    const s = this.sel;
    if (!s || performance.now() - s.started < 250) return;
    for (const d of Input.devices()) {
      let k = s.slots.findIndex((sl) => sl.dev === d.id);
      // a second device joins
      if (k < 0) {
        if (d.pressed.confirm && s.slots.length < 2 && performance.now() - s.started > 300) {
          s.slots.push({ dev: d.id, idx: (s.slots[0].idx + 1) % 3, locked: false });
          Audio.sfx('pickup'); this.renderSelect();
        }
        continue;
      }
      const sl = s.slots[k];
      if (!sl.locked) {
        if (d.pressed.left || d.pressed.right) { sl.idx = (sl.idx + (d.pressed.right ? 1 : 2)) % 3; Audio.sfx('menuMove'); this.renderSelect(); }
        if (d.pressed.confirm) this.confirmSlot(k);
        if (d.pressed.cancel) {
          if (k === 0) { this.sel = null; Game.scene = 'title'; this.show('title'); Audio.sfx('menuBack'); return; }
          s.slots.splice(k, 1); this.renderSelect();
        }
      } else if (d.pressed.cancel) { sl.locked = false; Audio.sfx('menuBack'); this.renderSelect(); }
    }
    void now;
  },

  // ---------------------------------------------------------------- story & dialog
  storyLines(lines, onDone, auto) {
    this.story = { lines, i: -1, onDone, auto, blocking: !auto, t: 0 };
    this.nextLine();
  },
  nextLine() {
    const s = this.story;
    if (!s) return;
    s.i++;
    if (s.i >= s.lines.length) { this.story = null; this.dialogBox.hidden = true; this.dialogBox.classList.remove('cine'); if (s.onDone) s.onDone(); return; }
    const L = s.lines[s.i];
    s.t = 0;
    s.dur = Math.max(2.2, Audio.speak(L.text, L.who) + 1.2) || 3.5;
    this.renderDialog(L, !s.auto);
  },
  renderDialog(L, cine) {
    const names = { narrator: '', king: 'King of Embervale', villain: 'Lord Tallowmar', imp: 'Imp', barbarian: 'Brannoc', amazon: 'Ysolde', dwarf: 'Gorrim' };
    const box = this.dialogBox;
    box.hidden = false;
    box.classList.toggle('cine', !!cine);
    box.innerHTML = `${names[L.who] ? `<div class="who who-${L.who}">${names[L.who]}</div>` : ''}<div class="txt"></div>${cine ? `<div class="adv">${glyph('confirm')} Continue &nbsp; ${glyph('options')} Skip</div>` : ''}`;
    const txt = box.querySelector('.txt');
    let n = 0;
    clearInterval(this.typeTimer);
    this.typeTimer = setInterval(() => { n += 2; txt.textContent = L.text.slice(0, n); if (n >= L.text.length) clearInterval(this.typeTimer); }, 28);
  },
  dialog(line) {
    if (this.story && this.story.blocking) return;
    this.storyLines([line], null, true);
  },
  storyInput(dt) {
    const s = this.story;
    if (!s) return;
    s.t += dt;
    if (s.auto) { if (s.t > s.dur) this.nextLine(); return; }
    if (Input.any('options') || (Input.any('cancel') && s.t > 0.3)) { s.i = s.lines.length; this.nextLine(); Audio.sfx('menuBack'); return; }
    if (Input.any('confirm') && s.t > 0.25) { Audio.sfx('menuMove'); this.nextLine(); }
  },

  // ---------------------------------------------------------------- HUD
  buildHud() {
    const L = this.layers.hud;
    L.innerHTML = `<div class="bossbar" hidden><div class="bname"></div><div class="bbar"><div class="bfill"></div></div></div>
      <div class="go" hidden>GO <span>➜</span></div><div class="players"></div><div class="session-time"></div>`;
    this.hud = { boss: L.querySelector('.bossbar'), bname: L.querySelector('.bname'), bfill: L.querySelector('.bfill'), go: L.querySelector('.go'), players: L.querySelector('.players'), time: L.querySelector('.session-time'), panels: new Map() };
  },
  updateHud() {
    const hud = this.hud;
    const heroes = W.heroes;
    // panels, one per hero (local first)
    const ids = new Set(heroes.map((h) => h.id));
    for (const [id, p] of hud.panels) if (!ids.has(id)) { p.el.remove(); hud.panels.delete(id); }
    for (const h of heroes) {
      let p = hud.panels.get(h.id);
      if (!p) {
        const e = el('div', 'ppanel');
        e.innerHTML = `<div class="pp-top"><span class="pp-icon p-${h.H.id}"></span><span class="pp-name"></span><span class="pp-lives"></span></div><div class="pp-hp"></div><div class="pp-books"></div><div class="pp-score"></div>`;
        e.style.setProperty('--seat', h.color);
        hud.players.appendChild(e);
        p = { el: e, name: e.querySelector('.pp-name'), lives: e.querySelector('.pp-lives'), hp: e.querySelector('.pp-hp'), books: e.querySelector('.pp-books'), score: e.querySelector('.pp-score'), last: '' };
        hud.panels.set(h.id, p);
      }
      const key = [h.name, h.hp, h.maxHp, h.books, h.lives, h.score, h.gone, h.st === 'charge' ? h.charge : 0, Net.on].join('|');
      if (key === p.last) continue;
      p.last = key;
      p.name.textContent = h.name;
      p.lives.textContent = Net.on || W.attract ? '' : h.gone ? 'OUT' : '♥'.repeat(Math.max(0, Math.min(h.lives, 5)));
      const seg = Math.ceil(h.maxHp / 2);
      const full = Math.ceil(Math.max(0, h.hp) / 2);
      p.hp.innerHTML = Array.from({ length: seg }, (_, i) => `<i class="${i < full ? (full <= seg * 0.3 ? 'low' : 'on') : ''}"></i>`).join('');
      const max = h.H.magicMax;
      p.books.innerHTML = Array.from({ length: Math.max(max, h.books) }, (_, i) => `<b class="${i < h.books ? 'on' : ''} ${h.st === 'charge' && i < h.charge ? 'charging' : ''} ${i >= max ? 'extra' : ''}"></b>`).join('');
      p.score.textContent = h.score.toLocaleString();
      p.el.classList.toggle('out', !!h.gone);
    }
    // boss bar
    const boss = W.bossId >= 0 ? findFoe(W.bossId) : (W.bossName ? W.foes.find((f) => f.maxHp >= 30 && f.st !== 'gone') : null);
    if (boss && boss.st !== 'gone') {
      hud.boss.hidden = false;
      hud.bname.textContent = W.bossId >= 0 ? boss.F.name : W.bossName;
      hud.bfill.style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
    } else hud.boss.hidden = true;
    hud.go.hidden = !(W.goT > 0 && Math.floor(W.goT * 3) % 2 === 0);
    if (Net.on && Game.scene === 'play' && AIHub.time() > 0) {
      const left = Math.max(0, (Net.info.limitMs - AIHub.time()) / 1000);
      hud.time.textContent = Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0');
    } else hud.time.textContent = '';
  },
  stageCard(sIdx, stage) {
    const c = this.cardEl;
    const stops = ['Brenn', 'Camp', 'Morrow', 'Camp', 'The Keep'];
    const at = [0, 2, 4][sIdx];
    c.innerHTML = `<div class="c-stage">STAGE ${sIdx + 1}</div><div class="c-name">${stage.name}</div><div class="c-sub">${stage.subtitle}</div>
      <svg class="c-map" viewBox="0 0 500 80">${stops.map((s, i) => `<g><circle cx="${40 + i * 105}" cy="40" r="${i === at ? 13 : 8}" class="${i < at ? 'done' : i === at ? 'here' : ''}"/><text x="${40 + i * 105}" y="74">${s}</text></g>`).join('')}<path d="M40 40 L460 40" class="trail"/></svg>
      <div class="c-intro">${stage.intro}</div>`;
    c.hidden = false; c.classList.remove('fade');
    this.cardT = 4.5;
    setTimeout(() => Audio.speak(stage.intro, 'narrator'), 600);
    this.hint('move');
  },
  bossBanner(name) { this.banner(name.toUpperCase(), 2.6, 'boss'); },
  banner(text, t = 2.5, cls = '') {
    this.bannerEl.textContent = text; this.bannerEl.className = 'banner ' + cls; this.bannerEl.hidden = false; this.bannerT = t;
  },
  toast(text, t = 3) { this.toastEl.textContent = text; this.toastEl.hidden = false; this.toastT = t; },
  flash(colorHex, t = 0.4) {
    const f = this.flashEl;
    f.style.transition = 'none'; f.style.background = colorHex; f.style.opacity = 0.4;
    requestAnimationFrame(() => { f.style.transition = `opacity ${t}s ease-out`; f.style.opacity = 0; });
  },
  // contextual teaching: each hint once per journey
  HINTS: {
    move: () => `${glyph('move')} Move &nbsp; ${glyph('run')} Run`,
    attack: () => `${glyph('attack')} Attack — strike three times for a finisher`,
    jump: () => `${glyph('jump')} Jump, then ${glyph('attack')} to slash from the air`,
    back: () => `${glyph('back')} Back attack hits foes behind you`,
    magic: () => `Hold ${glyph('magic')} to charge magic — one level per spellbook. Release to cast!`,
    mount: () => `Jump ${glyph('jump')} beside the beast to ride it · ${glyph('attack')} beast attack · ${glyph('back')} leap off`,
    imp: () => `Hit the imps! They drop spellbooks and meat`,
    throw: () => `Third hit on a reeling foe close up = THROW`,
    dash: () => `Run, then ${glyph('attack')} for a shoulder dash`,
    edge: () => `Mind the edge — foes thrown off the cliff are gone for good`,
    shield: () => `The Candle Knight blocks frontal blows. Use finishers, jumps, dashes or magic!`,
  },
  hint(key) {
    if (W.attract || this.hints.has(key) || !this.HINTS[key]) return;
    this.hints.add(key);
    this.hintQ = this.hintQ || [];
    this.hintQ.push(key);
  },
  updateHints(dt) {
    if (this.hintT > 0) { this.hintT -= dt; if (this.hintT <= 0) this.hintEl.hidden = true; return; }
    if (this.hintQ && this.hintQ.length && this.screen === 'hud') {
      const k = this.hintQ.shift();
      this.hintEl.innerHTML = this.HINTS[k]();
      this.hintEl.hidden = false; this.hintT = 5;
    }
  },
  contextHints() {
    if (W.attract || W.phaseKind !== 'stage' && W.phaseKind !== 'camp') return;
    const me = W.heroes.find((h) => h.local);
    if (!me) return;
    if (W.foes.some((f) => !f.F.thief && Math.abs(f.x - W.camX) < VIEW_HALF)) this.hint('attack');
    if (W.foes.some((f) => f.F.thief)) this.hint('imp');
    if (W.beasts.some((b) => !b.rider)) this.hint('mount');
    if (me.books > 0) this.hint('magic');
    if (W.lockIdx >= 1 && W.phase === 0) { this.hint('jump'); this.hint('dash'); }
    if (W.lockIdx >= 2 && W.phase === 0) { this.hint('back'); this.hint('throw'); }
    if (W.phase === 2 && W.camX > 22) this.hint('edge');
    if (W.foes.some((f) => f.type === 'knight')) this.hint('shield');
  },

  // ---------------------------------------------------------------- tags & floating text
  updateFloats(dt) {
    for (let i = this.floats.length - 1; i >= 0; i--) {
      const f = this.floats[i];
      f.t += dt;
      if (f.t > 1.1) { f.el.remove(); this.floats.splice(i, 1); continue; }
      project(f.x, f.y + f.t * 0.9, f.z, f.el);
      f.el.style.opacity = String(1 - Math.max(0, f.t - 0.7) / 0.4);
    }
  },
  update(dt, now) {
    if (this.stack.length) this.menuInput(now);
    else if (this.story && this.story.blocking) this.storyInput(dt);
    else if (this.story) this.storyInput(dt);
    if (this.screen === 'select' && !this.story && !this.stack.length) this.selectInput(now);
    if (this.bannerT > 0) { this.bannerT -= dt; if (this.bannerT <= 0) this.bannerEl.hidden = true; }
    if (this.toastT > 0) { this.toastT -= dt; if (this.toastT <= 0) this.toastEl.hidden = true; }
    if (this.cardT > 0) { this.cardT -= dt; if (this.cardT < 0.6) this.cardEl.classList.add('fade'); if (this.cardT <= 0) this.cardEl.hidden = true; }
    if (this.screen === 'hud' || this.screen === 'attract') { this.updateHud(); this.updateHints(dt); this.contextHints(); }
    this.updateFloats(dt);
    this.tags.hidden = !(this.screen === 'hud' && (W.heroes.length > 1 || Net.on));
  },

  // ---------------------------------------------------------------- end screens
  continueScreen(credits, cb) {
    let n = 9;
    const m = {
      id: 'continue', title: 'CONTINUE?', cls: 'continue', body: `<div class="count">9</div><div class="credits">Credits left: ${credits}</div>`,
      items: [{ label: 'Continue the fight', action: () => { clearInterval(m.timer); this.pop(true); cb(true); } }, { label: 'Give up', action: () => { clearInterval(m.timer); this.pop(true); cb(false); } }],
      back: () => {},
    };
    this.push(m);
    Audio.speak(STORY.gameover.text, 'villain');
    m.timer = setInterval(() => {
      n--;
      const c = m.el.querySelector('.count'); if (c) c.textContent = String(n);
      Audio.sfx('menuMove');
      if (n <= 0) { clearInterval(m.timer); this.pop(true); cb(false); }
    }, 1100);
  },
  gameOver(score, cb) {
    Audio.playSong('camp');
    this.push({ id: 'over', title: 'GAME OVER', cls: 'over', body: `<p class="em">${STORY.gameover.text}</p><p>Score ${score.toLocaleString()} · Best ${hiscore.toLocaleString()}</p>`, items: [{ label: 'Return to title', action: () => { this.closeAll(); cb(); } }], back: () => {} });
  },
  credits(score, cb) {
    Audio.playSong('victory');
    this.push({
      id: 'credits', title: 'THE GOLDEN AXE IS RECLAIMED', cls: 'wide credits',
      body: `<p class="em">Final score ${score.toLocaleString()} · Best ${hiscore.toLocaleString()}</p><div class="roll">${ABOUT_HTML}</div>`,
      items: [{ label: 'Return to title', action: () => { this.closeAll(); cb(); } }], back: () => {},
    });
  },
  touchBlock(onPass) {
    const L = this.layers.touch;
    L.innerHTML = `<div class="logo small"><div class="logo-top">GOLDEN</div><div class="logo-mid">WAXED</div><div class="logo-ii">II</div></div><div class="need">Controller or keyboard required</div><p>Connect a controller or keyboard to play.</p>`;
    const b = el('button', 'item big', 'Settings');
    b.addEventListener('click', () => this.push(this.settingsMenu()));
    L.appendChild(b);
    this.show('touch');
    this.touchPass = onPass;
  },
  fatal(msg) {
    const L = this.layers.fatal;
    L.innerHTML = `<div class="logo small"><div class="logo-top">GOLDEN</div><div class="logo-mid">WAXED</div><div class="logo-ii">II</div></div><div class="need">WebGPU is required</div><p></p><p class="small">This game renders with WebGPU only (no fallback). Try a current Chrome, Edge or Safari with WebGPU enabled.</p>`;
    L.querySelector('p').textContent = msg;
    this.show('fatal');
  },
  readyPrompt(players, cb) {
    const L = this.layers.ready;
    L.innerHTML = `<div class="roster"></div><div class="press">Press any key, click or tap when you are ready</div>`;
    const r = L.querySelector('.roster');
    for (const p of players) { const d = el('div', 'rp', p.name); d.style.color = p.color; r.appendChild(d); }
    this.show('ready');
    this.readyCb = cb;
  },
  sessionCountdown() { this.show('hud'); this.countEl = this.countEl || el('div', 'countdown'); this.root.appendChild(this.countEl); },
  sessionEnd(reason, standings) {
    const L = this.layers.end;
    const msg = reason === 'finished' ? 'Round over' : reason === 'sat-out' ? 'You sat this one out' : 'Round cancelled';
    this.bannerEl.hidden = true; this.hintEl.hidden = true; this.dialogBox.hidden = true;
    L.innerHTML = `<div class="endpanel"><div class="endtitle">${msg}</div><div class="roster"></div></div>`;
    const r = L.querySelector('.roster');
    (standings || []).forEach((grp, place) => grp.forEach((id) => { const h = findHero(id); if (!h) return; const d = el('div', 'rp', `${place + 1}. ${h.name} — ${h.score.toLocaleString()}`); d.style.color = h.color; r.appendChild(d); }));
    this.closeAll();
    this.layers.end.hidden = false;
  },
};

// ---------------------------------------------------------------- projection helpers
const _v = new THREE.Vector3();
function project(x, y, z, elm) {
  _v.set(x, y, z).project(camera);
  const vis = _v.z < 1 && Math.abs(_v.x) < 1.2 && Math.abs(_v.y) < 1.2;
  elm.style.display = vis ? '' : 'none';
  if (vis) elm.style.transform = `translate(${((_v.x + 1) / 2) * innerWidth}px, ${((1 - _v.y) / 2) * innerHeight}px) translate(-50%, -50%)`;
}
function makeTag(name, color) {
  const t = el('div', 'tag');
  t.appendChild(document.createTextNode(name));
  t.style.color = color;
  UI.tags.appendChild(t);
  return t;
}
function placeTag(t, x, y, z) { project(x, y, z, t); }
function floatText(x, y, z, text, cls = '') {
  if (!settings.damageNumbers && cls === 'dmg') return;
  const e = el('div', 'float ' + cls, text);
  UI.root.appendChild(e);
  UI.floats.push({ el: e, x, y, z, t: 0 });
  project(x, y, z, e);
}

// ============================================================================
// Boot and the frame loop.
// ============================================================================
let lastFrame = performance.now();
const DEBUG_NOPOST = /[?&]nopost/.test(location.search);
let worldSeconds = 0;

function stepWorld(dt) {
  W.t += dt;
  worldSeconds += dt;
  W.goT = Math.max(0, W.goT - dt);
  runTimers();
  for (const h of W.heroes) if (h.local && !h.gone) updateHeroLocal(h, dt);
  if (W.authority) {
    for (const f of W.foes) updateFoe(f, dt);
    for (const b of W.beasts) updateBeast(b, dt);
    updateWaves(dt);
  }
  easeRemote(dt);
  updatePickups(dt);
  updateHazards(dt);
  Phys.step(dt);
  Net.update(dt);
  if (Game.scene === 'attract') {
    Game.attractT += dt;
    const kind = PHASES[W.phase].type;
    if (Game.attractT > (kind === 'camp' ? 13 : 34)) {
      Game.attractT = 0;
      Game.attractI++;
      if (Game.attractI >= Game.attractSeq.length) { Game.stopAttract(); return; }
      startPhase(Game.attractSeq[Game.attractI], { silent: true });
      // skip ahead into the action of the later stages
      if (W.phaseKind === 'stage' && Game.attractI > 1) { const L = W.stage.locks; W.lockIdx = L.length - 1; W.camX = W.camFloor = L[L.length - 1].x - 6; W.camMax = L[L.length - 1].x; W.heroes[0].x = W.camX - 3; }
    }
  }
}
function drawWorld(dt) {
  for (const h of W.heroes) drawActor(h, dt);
  for (const f of W.foes) drawActor(f, dt);
  for (const b of W.beasts) drawBeast(b, dt);
  Level.update(dt, performance.now() / 1000);
  updateParticles(dt);
  updateFx(dt);
  updateCamera(dt);
}
function handleGlobalInput() {
  const sc = Game.scene;
  if (sc === 'touch') {
    if (Input.hasPad() || Input.any('confirm') || Input.any('attack')) { Game.toTitle(); }
    return;
  }
  if (sc === 'ready' && UI.readyCb && Input.anyPressed()) { const cb = UI.readyCb; UI.readyCb = null; UI.layers.ready.innerHTML = '<div class="press">Waiting for everyone…</div>'; Audio.init(); cb(); return; }
  if (sc === 'title') {
    if (!UI.stack.length && Input.any('confirm')) { UI.mainMenu(); return; }
    if (Input.idleMs > 10000) { UI.closeAll(); Game.startAttract(); }
    return;
  }
  if (sc === 'attract') {
    if (Input.anyPressed()) { Game.stopAttract(); Input.touch(); }
    return;
  }
  if (sc === 'play' && !UI.stack.length && !(UI.story && UI.story.blocking)) {
    for (const d of Input.devices()) {
      if (!d.pressed.options) continue;
      const owned = W.heroes.some((h) => h.dev === d.id || h.dev === 'any');
      // a second controller can join the journey at any time with OPTIONS
      if (!owned && W.mode === 'solo' && d.id !== 'kb' && Game.joinMidGame(d.id)) {
        const p1 = W.heroes[0];
        if (p1.dev === 'any') p1.dev = Input.lastDevice === d.id ? 'kb' : Input.lastDevice;
        continue;
      }
      UI.push(UI.pauseMenu());
      break;
    }
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  Input.poll(now);
  handleGlobalInput();
  UI.update(dt, now);
  let sim = dt;
  if (Game.slowT > 0) { Game.slowT -= dt; sim *= 0.3; }
  if (hitStopT > 0) { hitStopT -= dt; sim *= 0.08; }
  const sc = Game.scene;
  if (Net.on) {
    // a shared world never pauses: menus only stop this player's input
    if (sc === 'play' && AIHub.time() >= 0 && !W.over) stepWorld(dt);
    if (UI.countEl) {
      const t = AIHub.time();
      UI.countEl.hidden = !(sc === 'play' && t < 0 && t > -5000);
      if (!UI.countEl.hidden) UI.countEl.textContent = String(Math.ceil(-t / 1000));
    }
  } else if (sc === 'play' || sc === 'attract') {
    const paused = UI.stack.length > 0 || (UI.story && UI.story.blocking);
    if (!paused) stepWorld(sim);
  } else {
    // title / select / story backdrop: a quiet camp at night
    W.camX = 14 + Math.sin(now / 9000) * 2.5;
  }
  if (!(Net.on && Net.info.server && document.hidden)) {
    drawWorld(Net.on || sc === 'play' || sc === 'attract' ? dt : dt);
    if (DEBUG_NOPOST) renderer.render(scene, camera); else post.render();
  }
}

AIHub.probe(() => {
  const me = W.heroes.find((h) => h.local);
  const inp = me && me.lastInput;
  const s = Game.scene;
  return {
    scene: s === 'title' || s === 'touch' ? 'title' : s === 'select' ? 'menu' : s === 'ready' ? 'ready' : s === 'over' ? 'over' : s === 'play' || s === 'attract' ? 'play' : 'menu',
    menu: UI.settingsOpen,
    world: Math.round(worldSeconds * 1000) / 1000,
    input: (() => {
      const k = Input.live();
      const x = inp && inp.x ? inp.x : k.x, y = inp && inp.y ? inp.y : k.y;
      return { x: Math.round(x * 100) / 100, y: Math.round(y * 100) / 100, attack: !!((inp && inp.h.attack) || k.attack), jump: !!((inp && inp.h.jump) || k.jump) };
    })(),
  };
});

async function boot() {
  UI.init();
  const touchOnly = !AIHub.active && navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
  try {
    await initRenderer();
    await Phys.init();
  } catch (e) {
    console.error(e);
    UI.fatal(String(e && e.message ? e.message : e));
    if (AIHub.active) AIHub.fail('WebGPU unavailable: ' + (e && e.message));
    return;
  }
  $('#loading')?.remove();
  // a handle for automated smoke tests
  window.__gw = { get renderer() { return renderer; }, get scene() { return scene; }, get camera() { return camera; }, W, Game, UI, Input, Phys, Level, stepWorld, drawWorld, startPhase, makeFoe, makeBeast, findFoe, PHASES, attractAI };
  requestAnimationFrame(frame);
  if (AIHub.active) {
    const ok = await Game.session();
    if (ok) return;
  }
  Game.toTitle();
  if (touchOnly) { Game.scene = 'touch'; UI.touchBlock(); }
}
boot();

</script>
