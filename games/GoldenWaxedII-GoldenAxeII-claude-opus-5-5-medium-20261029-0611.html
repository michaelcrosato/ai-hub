<!DOCTYPE html>
<!--
GOLDEN WAXED II — a spiritual successor to Golden Axe II

GOLDEN WAXED II
  - An original spiritual successor to Golden Axe II (Sega, 1991). All code, art, music, sound and voices are generated in code. No Sega assets are used.
  - Title chosen by a secure random pick (Python secrets) from 50 brainstormed riffs on the source's name.

SOURCE INFORMATION
  - Date: 2026-10-29 06:11
  - Source: Golden Axe II
  - Tech: Three.js r180 (0.180.0, WebGPURenderer, TSL node materials, PostProcessing + BloomNode, RoundedBoxGeometry), WebGPU only with no fallback; Rapier 3D 0.19.3 (@dimforge/rapier3d-compat) for physics; Gamepad API; Web Audio API; plain JavaScript ES modules bundled into one HTML file; DOM/CSS UI; AI Hub Session Protocol v1 client (session.js 1.3.0)
  - Art Direction: stylized cel shading (MeshToonNodeMaterial with a 3-step gradient ramp), inverted-hull black ink outlines, chunky low-poly particles, bloom, painted canvas silhouettes for parallax backdrops, warm firelight against cool skies
  - Animation: custom keyframed pose-clip system on hierarchical rigid-part rigs (data-driven clips of joint angles, eased sampling, cross-fades), plus procedural layers (cape lag, beast gaits and tail whips, hit flash, telegraph flashing, candle flicker)
  - Audio: code-written music (Web Audio step sequencer: lead, bass, pad chords, synthesized drums, feedback-delay reverb; title, stage, cliffs, boss, camp and victory themes); synthesized sound effects (swings, hits, clangs, fire, thunder, wind, shatter, pickups, UI); Animalese-style gibberish voice acting (formant-filtered syllable blips per letter, a voice per character)
  - Online: AI Hub Session Protocol v1, co-op mode (1-4 players): host-authoritative shared world, client-owned heroes, 15 Hz snapshots, reliable events for hits, pickups, mounts, magic and stage changes; server-host supported; finish with standings, stats and awards. No other network features.
  - Testing: lightweight headless Chromium via Playwright with SwiftShader Vulkan WebGPU (about 7 fps, so logic was tested by stepping the simulation directly): boot and console-error checks, screenshots of the title, character select, story, every stage, camp, magic and settings screens; an AI full-journey soak from stage 1 to the ending; keyboard flow from title to play plus the pause and settings menus; attract mode after 10 s idle; a touch-only device emulation; the AI Hub harness at 2 players, at 4 players with 150 ms latency, 50 ms jitter and 5% loss, a host-leave run with 3 players, and a dedicated-server run (all PASS)
  - Environment: Claude Code CLI (headless); Linux; browser unknown
  - Model: Anthropic, claude-opus-5-5, reasoning effort medium
  - Usage: unknown (no usage meter was available inside the session)

TESTING FEEDBACK
  - Issues caught by testing: 14 (scene variable shadowed, Rapier queries blind until the first step so heroes fell through the floor at spawn, floor colour multiplied by its own texture, a broken cloud layer, backdrop placement, blinding fire magic, wrong roman numerals, the boss parking off-screen where nobody could reach, the demo AI looping on mounts, imps snagging on props, real-time setTimeout driving game logic, the probe sampling input between frames, overlapping round-end overlays, and menu stacking with slider rows collapsed by a CSS class clash)
  - Critical / game-breaking: 4 (heroes falling at spawn, the unreachable boss soft-lock, the hard JS error from the shadowed scene, and stage transitions tied to wall-clock timers)
  - Most helpful test: the full-journey soak, with a cheating AI playing stage 1 through to the ending by stepping the simulation directly. It found both soft-locks.
  - Least helpful test: the first screenshots, which came back pure white because headless WebGPU capture needed —use-vulkan=swiftshader. Nothing was wrong with the game.

ENGINE FEEDBACK
  - What I liked most: Three.js r180 WebGPURenderer with node materials (MeshToonNodeMaterial plus the TSL bloom pass) gave a convincing cel look with very little code. Rapier's kinematic character controller made sliding along props trivial.
  - Did I get stuck or guess wrong: yes. I assumed Rapier ray casts see newly created colliders right away; in 0.19 they appear only after world.step(). I also guessed that headless WebGPU screenshots would just work.
  - Most important thing I built myself: the data-driven pose-clip animation system with cross-fades, plus the host-authoritative co-op netcode (snapshots, hit claims, victim-decides damage).
  - Hardest part of the engine: debugging WebGPU in software rendering. Errors surface as opaque WeakMap exceptions deep inside the renderer.
  - If I could remove or overhaul one thing: the silent deferral of Rapier scene-query updates. An explicit, documented update call, or an immediate update, would remove a whole class of bugs.
  - If I could change one thing: give the WebGPU path clearer validation errors (for example "scene is not an Object3D") instead of internal map failures.

PROMPT FEEDBACK
  - What I liked most: the clear done-criteria, and the hub protocol with a runnable harness, so multiplayer could actually be verified.
  - What was confusing: the hub README asks for a WebGL 2 fallback while the prompt requires WebGPU with no fallback (resolved with the hub:webgpu=required meta). It was also unclear whether local co-op was expected as well as hub co-op.
  - Hardest thing to do: fitting a feature-complete beat 'em up (combat, magic, mounts, camps, bosses, attract mode, co-op netcode) into one verified file at medium effort.
  - One test I wish I could have run: a real-GPU playthrough with a physical DualSense, to judge feel, frame pacing and audio mix by ear.

HOW IT PLAYS
  - Three warriors: Brannoc (barbarian, Storm of the Steppe), Ysolde (amazon, Phoenix Pyre), Gorrim (dwarf, Forge-Thunder).
  - Three-hit combos, throws, running shoulder dash, jump slash, downward thrust, back attack.
  - Golden Axe II style magic: hold to charge one level per spellbook, release to cast.
  - Kick book and pantry imps for spellbooks and meat; camp at night between stages.
  - Ride Crestbacks (tail whip) and Ember Drakes (fire breath); knock riders off their beasts.
  - Three stages, two camps, three bosses, continues, 2-player local co-op (join any time), attract mode, AI Hub co-op for up to four.

CREDITS
  - Design, code, music, sound and voices: Claude (Anthropic claude-opus-5-5), directed by the cc-matrix prompt.
  - Engines: Three.js (MIT), Rapier (Apache-2.0), AI Hub session client (michaelcrosato/ai-hub).
  - Inspired by Golden Axe II by Sega. Golden Axe is a trademark of Sega. This is a non-commercial homage.
-->

<script>
/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

import RAPIER from '@dimforge/rapier3d-compat';
const ABOUT_HTML = "<h3>Golden Waxed II</h3><ul><li>An original spiritual successor to Golden Axe II (Sega, 1991). All code, art, music, sound and voices are generated in code. No Sega assets are used.</li><li>Title chosen by a secure random pick (Python secrets) from 50 brainstormed riffs on the source&#x27;s name.</li></ul><h3>Source Information</h3><ul><li><b>Date:</b> 2026-10-29 06:11</li><li><b>Source:</b> Golden Axe II</li><li><b>Tech:</b> Three.js r180 (0.180.0, WebGPURenderer, TSL node materials, PostProcessing + BloomNode, RoundedBoxGeometry), WebGPU only with no fallback; Rapier 3D 0.19.3 (@dimforge/rapier3d-compat) for physics; Gamepad API; Web Audio API; plain JavaScript ES modules bundled into one HTML file; DOM/CSS UI; AI Hub Session Protocol v1 client (session.js 1.3.0)</li><li><b>Art Direction:</b> stylized cel shading (MeshToonNodeMaterial with a 3-step gradient ramp), inverted-hull black ink outlines, chunky low-poly particles, bloom, painted canvas silhouettes for parallax backdrops, warm firelight against cool skies</li><li><b>Animation:</b> custom keyframed pose-clip system on hierarchical rigid-part rigs (data-driven clips of joint angles, eased sampling, cross-fades), plus procedural layers (cape lag, beast gaits and tail whips, hit flash, telegraph flashing, candle flicker)</li><li><b>Audio:</b> code-written music (Web Audio step sequencer: lead, bass, pad chords, synthesized drums, feedback-delay reverb; title, stage, cliffs, boss, camp and victory themes); synthesized sound effects (swings, hits, clangs, fire, thunder, wind, shatter, pickups, UI); Animalese-style gibberish voice acting (formant-filtered syllable blips per letter, a voice per character)</li><li><b>Online:</b> AI Hub Session Protocol v1, co-op mode (1-4 players): host-authoritative shared world, client-owned heroes, 15 Hz snapshots, reliable events for hits, pickups, mounts, magic and stage changes; server-host supported; finish with standings, stats and awards. No other network features.</li><li><b>Testing:</b> lightweight headless Chromium via Playwright with SwiftShader Vulkan WebGPU (about 7 fps, so logic was tested by stepping the simulation directly): boot and console-error checks, screenshots of the title, character select, story, every stage, camp, magic and settings screens; an AI full-journey soak from stage 1 to the ending; keyboard flow from title to play plus the pause and settings menus; attract mode after 10 s idle; a touch-only device emulation; the AI Hub harness at 2 players, at 4 players with 150 ms latency, 50 ms jitter and 5% loss, a host-leave run with 3 players, and a dedicated-server run (all PASS)</li><li><b>Environment:</b> Claude Code CLI (headless); Linux; browser unknown</li><li><b>Model:</b> Anthropic, claude-opus-5-5, reasoning effort medium</li><li><b>Usage:</b> unknown (no usage meter was available inside the session)</li></ul><h3>Testing Feedback</h3><ul><li>Issues caught by testing: 14 (scene variable shadowed, Rapier queries blind until the first step so heroes fell through the floor at spawn, floor colour multiplied by its own texture, a broken cloud layer, backdrop placement, blinding fire magic, wrong roman numerals, the boss parking off-screen where nobody could reach, the demo AI looping on mounts, imps snagging on props, real-time setTimeout driving game logic, the probe sampling input between frames, overlapping round-end overlays, and menu stacking with slider rows collapsed by a CSS class clash)</li><li>Critical / game-breaking: 4 (heroes falling at spawn, the unreachable boss soft-lock, the hard JS error from the shadowed scene, and stage transitions tied to wall-clock timers)</li><li><b>Most helpful test:</b> the full-journey soak, with a cheating AI playing stage 1 through to the ending by stepping the simulation directly. It found both soft-locks.</li><li><b>Least helpful test:</b> the first screenshots, which came back pure white because headless WebGPU capture needed --use-vulkan=swifts         g.lineTo(x + bw, top); g.lineTo(x + bw, h * 0.8);

// ---------------------------------------------------------------- particles
// Chunky low-poly bits that shrink away: they read as cel-shaded "ink" FX.
const particles = [];
const PARTICLE_KINDS = {
  spark: { color: '#ffe27a', add: true, size: 0.12, grav: -6, life: 0.35 },
  fire: { color: '#ff7a1f', add: true, size: 0.26, grav: 3, life: 0.6 },
  ember: { color: '#ffb03a', add: true, size: 0.08, grav: 1.5, life: 1.2 },
  smoke: { color: '#9a8f9a', add: false, size: 0.3, grav: 1.2, life: 1.0, opacity: 0.45 },
  dust: { color: '#b49a78', add: false, size: 0.25, grav: 0.5, life: 0.6 },
  wax: { color: '#f3e3b4', add: false, size: 0.14, grav: -14, life: 0.9 },
  blood: { color: '#c53a2c', add: false, size: 0.1, grav: -14, life: 0.6 },
  magic: { color: '#6fc8ff', add: true, size: 0.18, grav: 0.8, life: 0.9 },
  bolt: { color: '#e9f3ff', add: true, size: 0.22, grav: 0, life: 0.25 },
  leaf: { color: '#7fb04a', add: false, size: 0.12, grav: -1.2, life: 2.2 },
  gold: { color: '#ffd24a', add: true, size: 0.14, grav: -9, life: 0.8 },
};
const particlePool = {};
function initParticles() {
  for (const k in PARTICLE_KINDS) particlePool[k] = [];
}
function emit(kind, x, y, z, n = 6, speed = 3, opts = {}) {
  const K = PARTICLE_KINDS[kind];
  for (let i = 0; i < n; i++) {
    let m = particlePool[kind].pop();
    if (!m) {
      const mat = K.add ? glow(K.color) : toon(K.color, K.opacity ? { transparent: true, opacity: K.opacity } : {});
      m = new THREE.Mesh(geo('ico', 1), mat);
      m.castShadow = false;
    }
    fxRoot.add(m);
    const a = rand(0, TAU), b = rand(-1, 1);
    const sp = speed * rand(0.4, 1);
    const p = {
      m, kind, life: K.life * rand(0.7, 1.2), t: 0,
      vx: (opts.vx ?? 0) + Math.cos(a) * Math.sqrt(1 - b * b) * sp,
      vy: (opts.vy ?? 0) + Math.abs(b) * sp * (opts.up ?? 1),
      vz: (opts.vz ?? 0) + Math.sin(a) * Math.sqrt(1 - b * b) * sp * 0.6,
      size: K.size * (opts.size ?? 1) * rand(0.7, 1.3), grav: K.grav, spin: rand(-8, 8),
    };
    m.position.set(x + rand(-0.1, 0.1) * (opts.spread ?? 1), y + rand(-0.1, 0.1) * (opts.spread ?? 1), z + rand(-0.1, 0.1) * (opts.spread ?? 1));
    particles.push(p);
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life) { fxRoot.remove(p.m); particlePool[p.kind].push(p.m); particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
    if (p.m.position.y < 0.02 && p.grav < 0) { p.m.position.y = 0.02; p.vy *= -0.3; p.vx *= 0.6; p.vz *= 0.6; }
    const k = 1 - p.t / p.life;
    p.m.scale.setScalar(p.size * (p.kind === 'smoke' ? 0.6 + (1 - k) * 1.2 : k));
    p.m.rotation.x += p.spin * dt; p.m.rotation.y += p.spin * dt * 0.7;
  }
}

// ---------------------------------------------------------------- transient FX meshes
const fxItems = [];
/** Adds a mesh that lives for `life` seconds, updated by `fn(item, k01, dt)`. */
function fxMesh(mesh, life, fn) {
  fxRoot.add(mesh);
  fxItems.push({ mesh, life, t: 0, fn });
  return mesh;
}
function updateFx(dt) {
  for (let i = fxItems.length - 1; i >= 0; i--) {
    const f = fxItems[i];
    f.t += dt;
    const k = f.t / f.life;
    if (k >= 1) { fxRoot.remove(f.mesh); if (f.mesh.userData.light) f.mesh.userData.light.dispose?.(); fxItems.splice(i, 1); continue; }
    f.fn && f.fn(f, k, dt);
  }
}
function slashArc(x, y, z, face, colorHex = '#fff6d8', size = 1.4, tilt = 0) {
  const m = new THREE.Mesh(geo('torus', size, 0.06, 0, 18), glow(colorHex));
  m.position.set(x + face * 0.6, y, z + 0.1);
  m.rotation.set(0.3 + tilt, face > 0 ? 0 : Math.PI, 0);
  fxMesh(m, 0.16, (f, k) => { m.scale.setScalar(0.6 + k * 0.6); m.rotation.z = -face * k * 2.4; });
}
function ring(x, y, z, colorHex, r0 = 0.3, r1 = 3, life = 0.4) {
  const m = new THREE.Mesh(geo('torus', 1, 0.08, 0, 28), glow(colorHex));
  m.position.set(x, y, z); m.rotation.x = Math.PI / 2;
  fxMesh(m, life, (f, k) => { m.scale.setScalar(lerp(r0, r1, k)); m.scale.z = 1; });
}
function flashLight(x, y, z, colorHex, intensity = 30, life = 0.25, dist = 12) {
  const l = new THREE.PointLight(colorHex, intensity, dist, 1.6);
  l.position.set(x, y, z);
  fxMesh(l, life, (f, k) => { l.intensity = intensity * (1 - k); });
}
function shake(amount) { if (settings.shake) camState.shake = Math.max(camState.shake, amount); }

// ---------------------------------------------------------------- sky
let skyMesh = null, skyTop, skyBot;
function makeSky() {
  skyTop = uniform(new THREE.Color('#3a5a9a'));
  skyBot = uniform(new THREE.Color('#f0b070'));
  const mat = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide });
  const h = positionWorld.y.div(120).add(0.1).clamp(0, 1);
  mat.colorNode = mix(skyBot, skyTop, smoothstep(0.0, 0.7, h));
  mat.fog = false; mat.depthWrite = false;
  skyMesh = new THREE.Mesh(new THREE.SphereGeometry(300, 24, 12), mat);
  skyMesh.renderOrder = -10;
  scene.add(skyMesh);
}
function setSky(top, bottom) {
  if (!skyMesh) makeSky();
  skyTop.value.set(top); skyBot.value.set(bottom);
}

// ============================================================================
// Physics (Rapier 0.19.3) and level construction from stage data.
// Rapier provides: static level colliders, a kinematic character controller
// for every fighter (slides along huts, rocks and walls), ground ray casts
// (so pits and cliff edges are real), and dynamic debris (crates, wax chunks).
// ============================================================================
const G_PROP = (0x0001 << 16) | 0xffff;
const G_FLOOR = (0x0008 << 16) | 0xffff;
const Q_MOVE = (0x0002 << 16) | 0x0009;
const Q_GROUND = (0x0002 << 16) | 0x0008;
const G_DEBRIS = (0x0004 << 16) | 0x000d;

const Phys = {
  world: null, kcc: null, statics: [], debris: [], acc: 0,
  async init() {
    await RAPIER.init();
    this.world = new RAPIER.World({ x: 0, y: -22, z: 0 });
    this.world.timestep = 1 / 60;
    this.kcc = this.world.createCharacterController(0.02);
    this.kcc.setSlideEnabled(true);
    this.kcc.setApplyImpulsesToDynamicBodies(true);
  },
  clear() {
    for (const c of this.statics) this.world.removeCollider(c, false);
    this.statics = [];
    for (const d of this.debris) { this.world.removeRigidBody(d.body); fxRoot.remove(d.mesh); }
    this.debris = [];
  },
  box(x, y, z, hx, hy, hz, groups = G_PROP) {
    const c = this.world.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setTranslation(x, y, z).setCollisionGroups(groups));
    this.statics.push(c);
    return c;
  },
  cyl(x, y, z, r, hh) {
    const c = this.world.createCollider(RAPIER.ColliderDesc.cylinder(hh, r).setTranslation(x, y, z).setCollisionGroups(G_PROP));
    this.statics.push(c);
    return c;
  },
  remove(c) {
    const i = this.statics.indexOf(c);
    if (i >= 0) { this.statics.splice(i, 1); this.world.removeCollider(c, false); this.world.step(); }
  },
  character(radius = 0.34) {
    const c = this.world.createCollider(RAPIER.ColliderDesc.capsule(0.45, radius).setCollisionGroups((0x0002 << 16) | 0x0000).setSensor(false));
    return c;
  },
  dropCharacter(c) { if (c) this.world.removeCollider(c, false); },
  /** Slide a fighter from (x,y,z) by (dx,dz) against the level; returns [x, z]. */
  move(c, x, y, z, dx, dz) {
    c.setTranslation({ x, y: y + 0.95, z });
    this.kcc.computeColliderMovement(c, { x: dx, y: 0, z: dz }, RAPIER.QueryFilterFlags.EXCLUDE_SENSORS, Q_MOVE);
    const m = this.kcc.computedMovement();
    return [x + m.x, z + m.z];
  },
  /** Height of the floor under (x,z) or -Infinity over a pit. */
  ground(x, y, z) {
    const ray = new RAPIER.Ray({ x, y: Math.max(y, 0) + 0.6, z }, { x: 0, y: -1, z: 0 });
    const hit = this.world.castRay(ray, 40, true, RAPIER.QueryFilterFlags.EXCLUDE_SENSORS, Q_GROUND);
    if (!hit) return -Infinity;
    const toi = hit.timeOfImpact ?? hit.toi;
    return Math.max(y, 0) + 0.6 - toi;
  },
  chunk(x, y, z, size, colorHex, impulse = 4) {
    if (this.debris.length > 140) { const d = this.debris.shift(); this.world.removeRigidBody(d.body); fxRoot.remove(d.mesh); }
    const body = this.world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(x, y, z).setAngularDamping(0.6).setLinearDamping(0.2));
    this.world.createCollider(RAPIER.ColliderDesc.cuboid(size / 2, size / 2, size / 2).setRestitution(0.35).setFriction(0.8).setCollisionGroups(G_DEBRIS).setDensity(0.6), body);
    body.applyImpulse({ x: rand(-1, 1) * impulse * size, y: rand(0.6, 1.4) * impulse * size, z: rand(-0.6, 0.8) * impulse * size }, true);
    body.applyTorqueImpulse({ x: rand(-1, 1) * 0.02, y: rand(-1, 1) * 0.02, z: rand(-1, 1) * 0.02 }, true);
    const mesh = new THREE.Mesh(geo('box', size, size, size), toon(colorHex));
    mesh.castShadow = true; outline(mesh, 0.012);
    fxRoot.add(mesh);
    this.debris.push({ body, mesh, life: 5 + rand(0, 2) });
  },
  step(dt) {
    this.acc = Math.min(this.acc + dt, 0.1);
    while (this.acc >= 1 / 60) { this.world.step(); this.acc -= 1 / 60; }
    for (let i = this.debris.length - 1; i >= 0; i--) {
      const d = this.debris[i];
      d.life -= dt;
      const p = d.body.translation(), q = d.body.rotation();
      d.mesh.position.set(p.x, p.y, p.z); d.mesh.quaternion.set(q.x, q.y, q.z, q.w);
      if (d.life < 0.6) d.mesh.scale.setScalar(Math.max(0.01, d.life / 0.6));
      if (d.life <= 0 || p.y < -30) { this.world.removeRigidBody(d.body); fxRoot.remove(d.mesh); this.debris.splice(i, 1); }
    }
  },
};

// ---------------------------------------------------------------- level
const Level = {
  stage: null, lights: [], flames: [], breakables: [], animated: [], minFloorY: 0,
  build(stage) {
    this.dispose();
    this.stage = stage;
    setSky(stage.sky[0], stage.sky[1]);
    scene.fog = new THREE.Fog(new THREE.Color(stage.fog[0]), stage.fog[1], stage.fog[2]);
    sunLight.color.set(stage.sun[0]); sunLight.intensity = stage.sun[1];
    hemiLight.color.set(stage.hemi[0]); hemiLight.groundColor.set(stage.hemi[1]); hemiLight.intensity = stage.hemi[2];
    const groundTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = stage.ground.color; g.fillRect(0, 0, w, h);
      g.fillStyle = stage.ground.color2;
      for (let i = 0; i < 40; i++) { g.beginPath(); g.ellipse(Math.random() * w, Math.random() * h, 8 + Math.random() * 24, 4 + Math.random() * 10, 0, 0, TAU); g.fill(); }
      if (stage.interior) { g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 3; for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); } }
    }, true);
    const cliff = stage.key === 'cliffs';
    for (const [x0, x1, z0, z1] of stage.floors) {
      const w = x1 - x0, d = z1 - z0, th = cliff ? 14 : 1;
      const tex = groundTex.clone(); tex.needsUpdate = true; tex.repeat.set(w / 6, d / 6);
      const m = new THREE.Mesh(geo('hbox', w, th, d), toon('#ffffff', { map: tex, unique: true }));
      m.position.set((x0 + x1) / 2, -th / 2, (z0 + z1) / 2);
      m.receiveShadow = true;
      levelRoot.add(m);
      Phys.box((x0 + x1) / 2, -1, (z0 + z1) / 2, w / 2, 1, d / 2, G_FLOOR);
      // band walls only where this floor reaches the edge of the fighting band
      if (z1 >= Z_FRONT - 0.01) Phys.box((x0 + x1) / 2, 2, Z_FRONT + 0.5, w / 2, 3, 0.5);
      if (z0 <= Z_BACK + 0.01) Phys.box((x0 + x1) / 2, 2, Z_BACK - 0.5, w / 2, 3, 0.5);
      // a painted path down the middle of open ground
      if (!stage.interior && d > 5) {
        const pm = new THREE.Mesh(geo('plane', w, 1.6), toon(stage.ground.path));
        pm.rotation.x = -Math.PI / 2; pm.position.set((x0 + x1) / 2, 0.01, 0.4); pm.receiveShadow = true; levelRoot.add(pm);
      }
      if (stage.interior) {
        const rug = new THREE.Mesh(geo('plane', w, 1.8), toon(stage.ground.path));
        rug.rotation.x = -Math.PI / 2; rug.position.set((x0 + x1) / 2, 0.012, 0.2); rug.receiveShadow = true; levelRoot.add(rug);
      }
    }
    // stage ends: hard walls
    const L = stage.floors[0][0], R = stage.floors[stage.floors.length - 1][1];
    Phys.box(L - 0.5, 2, 0, 0.5, 4, 6); Phys.box(R + 0.5, 2, 0, 0.5, 4, 6);
    if (cliff) {
      const sea = new THREE.Mesh(geo('plane', 500, 260), toon('#2a3a7a'));
      sea.rotation.x = -Math.PI / 2; sea.position.set(60, -14, -60); levelRoot.add(sea);
      this.animated.push((t) => { sea.position.y = -14 + Math.sin(t) * 0.2; });
      for (let i = 0; i < 30; i++) {
        const r = part('ico', [rand(0.6, 2.2)], '#55505a', [rand(-5, 130), -13, rand(5, 40)], { thick: 0.04 });
        r.scale.y = rand(1, 3); levelRoot.add(r);
      }
    } else if (!stage.interior) {
      // a strip of near-foreground grass and the far ground plane
      const far = new THREE.Mesh(geo('plane', 400, 80), toon(stage.ground.color2));
      far.rotation.x = -Math.PI / 2; far.position.set(60, -0.02, -44); levelRoot.add(far);
      const near = new THREE.Mesh(geo('plane', 400, 20), toon(stage.ground.color2));
      near.rotation.x = -Math.PI / 2; near.position.set(60, -0.03, 14); levelRoot.add(near);
    }
    if (stage.interior) {
      this.buildInterior(stage);
      const near = new THREE.Mesh(geo('plane', 400, 20), toon('#2a1e26'));
      near.rotation.x = -Math.PI / 2; near.position.set(60, -0.03, 14); levelRoot.add(near);
    }
    // backdrop silhouettes (perspective gives free parallax)
    for (const [kind, col, z, h] of stage.backdrop) {
      const tex = silhouetteTex(randi(1, 99999), col, kind);
      tex.repeat.set(3, 1);
      const mat = new THREE.MeshBasicNodeMaterial({ map: tex, transparent: true, depthWrite: false });
      mat.fog = false;
      const m = new THREE.Mesh(geo('plane', 520, h), mat);
      m.position.set(60, h / 2 - (stage.key === 'cliffs' ? 16 : 2), z);
      m.renderOrder = -5;

    }
    if (stage.night || stage.key === 'cliffs') {
      const moon = new THREE.Mesh(geo('sphere', 5, 20), glow('#fff6d0', false));
      moon.position.set(40, 48, -120); levelRoot.add(moon);
    }
    for (const p of stage.props) this.prop(...p);
    // scene queries only see new colliders after a step
    Phys.world.step();
    // ambient life
    if (!stage.interior) for (let i = 0; i < 20; i++) {
      const fl = new THREE.Mesh(geo('ico', 0.05), glow(stage.night ? '#c8ff7a' : '#ffcf7a'));
      const bx = rand(0, stage.length), by = rand(0.5, 3), bz = rand(-3, 3), ph = rand(0, TAU);
      levelRoot.add(fl);
      this.animated.push((t) => { fl.position.set(bx + Math.sin(t * 0.7 + ph) * 1.5, by + Math.sin(t * 1.3 + ph) * 0.4, bz + Math.cos(t * 0.9 + ph)); });
    }
  },
  buildInterior(stage) {
    const wallTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = '#3a2a36'; g.fillRect(0, 0, w, h);
      g.strokeStyle = '#21161f'; g.lineWidth = 4;
      for (let y = 0; y < h; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); for (let x = (y / 32) % 2 ? 0 : 32; x < w; x += 64) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 32); g.stroke(); } }
      g.fillStyle = 'rgba(240,226,190,.5)'; for (let i = 0; i < 12; i++) g.fillRect(Math.random() * w, 0, 3 + Math.random() * 6, Math.random() * 90);
    }, true);
    wallTex.repeat.set(stage.length / 8, 2);
    const wall = new THREE.Mesh(geo('hbox', stage.length + 20, 16, 1), toon('#ffffff', { map: wallTex, unique: true }));
    wall.position.set(stage.length / 2, 7, Z_BACK - 1.2); wall.receiveShadow = true; levelRoot.add(wall);
    // windows with a red sky
    for (let x = 6; x < stage.length; x += 12) {

      win.position.set(x, 7.2, Z_BACK - 0.68); levelRoot.add(win);
      const arch = new THREE.Mesh(geo('cyl', 0.5, 0.5, 0.02, 12, 1), glow('#a8301e', false));
      arch.rotation.x = Math.PI / 2; arch.position.set(x, 8.5, Z_BACK - 0.68); levelRoot.add(arch);

  light(x, y, z, colorHex, intensity, dist, flicker = true) {

    return l;
  },
  flame(x, y, z, size = 1, smoke = true) { this.flames.push({ x, y, z, size, smoke, t: rand(0, 1) }); },
  prop(kind, x, z, opt = {}) {

      case 'statue': {

        r.root.position.y = 0.8; r.anim.play('hurt'); r.anim.t = 0.15; r.anim.update(0.01); r.anim.blend = 1; r.anim.update(0); g.add(r.root);

      case 'grave': add('box', [0.7, 1.0, 0.2], '#8a8a92', [0, 0.5, 0]); add('box', [0.9, 0.12, 1.4], '#5a4a3a', [0, 0.06, 0.6], { thick: 0.01 }); Phys.box(x, 0.5, z, 0.4, 0.5, 0.15); break;
      case 'post': add('cyl', [0.12, 0.14, 1.6, 6], '#5a3a1a', [0, 0.8, 0]); this.flame(x, 1.75, z, 0.5, false); this.light(x, 2.1, z, '#ffaa4a', 6, 8); break;
      case 'bridge': {
        for (let i = -7; i <= 7; i++) add('box', [0.85, 0.12, 2.3], i % 2 ? '#8a6a42' : '#7a5a3a', [i * 1.0, -0.05, 0], { thick: 0.012 });

      }
      case 'pillar': {
        add('cyl', [0.55, 0.65, 8, 8], '#6a5a64', [0, 4, 0]);
        add('box', [1.5, 0.4, 1.5], '#5a4a54', [0, 0.2, 0]);
        // wax pouring down the pillar
        add('cyl', [0.6, 0.6, 1.5, 8], '#efe2c0', [0, 6.3, 0.02], { thick: 0.015 });
        for (let i = 0; i < 4; i++) add('box', [0.16, rand(0.8, 2.4), 0.16], '#efe2c0', [rand(-0.4, 0.4), 5.2 - i * 0.2, 0.5], { thick: 0.01 });
        add('box', [0.2, 0.5, 0.2], '#3a2a1a', [0, 3.2, 0.6]); this.flame(x, 3.65, z + 0.62, 0.6); this.light(x, 3.8, z + 1.2, '#ff9a3a', 10, 10);

      }
      case 'candles': {
        for (let i = 0; i < 9; i++) {
          const h = rand(0.4, 1.6), cx = rand(-1.2, 1.2), cz = rand(-0.3, 0.5);
          add('cyl', [0.08, 0.1, h, 6], '#f2e6c8', [cx, h / 2, cz], { thick: 0.01 });
          const fl = new THREE.Mesh(geo('cone', 0.06, 0.18, 5), glow('#ffcf6a')); fl.position.set(cx, h + 0.1, cz); g.add(fl);

        this.flame(x, 0.35, z, 1.4); this.light(x, 1.4, z, '#ff8a3a', 34, 18);

      case 'barrel': case 'crate': {

        else { add('box', [1.04, 0.12, 1.04], '#6a4a20', [0, 0.95, 0], { thick: 0.01 }); add('box', [1.04, 0.12, 1.04], '#6a4a20', [0, 0.06, 0], { thick: 0.01 }); }

  },
  /** Breaks breakable i: debris everywhere. Returns the drop kind (if any). */
  breakIt(i) {
    const b = this.breakables[i];
    if (!b || !b.alive) return null;
    b.alive = false;
    levelRoot.remove(b.g);
    Phys.remove(b.col);
    for (let k = 0; k < 9; k++) Phys.chunk(b.x + rand(-0.3, 0.3), rand(0.3, 0.9), b.z + rand(-0.3, 0.3), rand(0.15, 0.3), b.color, 6);
    emit('dust', b.x, 0.5, b.z, 10, 3);
    Audio.sfx('crate');
    return b.drop;
  },
  dispose() {
    while (levelRoot.children.length) levelRoot.remove(levelRoot.children[0]);
    Phys.clear();
    this.lights = []; this.flames = []; this.breakables = []; this.animated = [];
  },
  update(dt, t) {
    for (const L of this.lights) L.l.intensity = L.base * (0.82 + Math.sin(t * 11 + L.ph) * 0.08 + Math.sin(t * 23 + L.ph * 2) * 0.06 + Math.random() * 0.06);
    for (const f of this.flames) {
      f.t += dt;
      if (f.t > 0.07) {
        f.t = 0;
        if (Math.abs(f.x - camera.position.x) > 26) continue;
        emit('fire', f.x, f.y, f.z, 1, 0.6 * f.size, { size: f.size, up: 2 });
        if (Math.random() < 0.3) emit('ember', f.x, f.y + 0.3, f.z, 1, 1.2);
        if (f.smoke && Math.random() < 0.25) emit('smoke', f.x, f.y + 0.6 * f.size, f.z, 1, 0.4, { size: f.size });
      }
    }
    for (const a of this.animated) a(t);
  },
};

// ============================================================================
// Actors and combat. The shared world is plain data (heroes, foes, beasts,

const W = {
  mode: 'solo', authority: true, phase: 0, phaseKind: 'stage', stage: null,

// ---------------------------------------------------------------- world-time timers (they pause with the world)
const timers = [];
function after(sec, fn) { timers.push({ at: W.t + sec, fn }); }
function runTimers() {
  for (let i = timers.length - 1; i >= 0; i--) if (W.t >= timers[i].at) { const t = timers[i]; timers.splice(i, 1); t.fn(); }
}

// ---------------------------------------------------------------- creation
function makeHero(opts) {
  const H = HEROES[opts.heroIdx];
  const spec = { ...H.spec };
  if (opts.color) { spec.cape = opts.color; spec.beltColor = opts.color; }
  const rig = buildHumanoid(spec);
  actorRoot.add(rig.root);
  const h = {
    kind: 'hero', id: opts.id, local: !!opts.local, dev: opts.dev || null, heroIdx: opts.heroIdx, H, name: opts.name || H.name, color: opts.color || SEAT_COLORS[opts.id % 4],
    x: opts.x ?? 2, y: 0, z: opts.z ?? 0, vx: 0, vy: 0, vz: 0, face: 1, st: 'idle', stT: 0, move: null, moveT: 0, hitList: new Set(), queued: false, combo: 0, comboT: 0,
    hp: H.hp, maxHp: H.hp, lives: opts.lives ?? 3, books: opts.books ?? 0, score: 0, kills: 0, casts: 0, maxHit: 0, rode: false, invuln: 0, mount: -1, charge: 0, chargeT: 0,
    rig, collider: opts.local ? Phys.character() : null, tx: opts.x ?? 2, ty: 0, tz: opts.z ?? 0, at: -Infinity, safeX: 2, safeZ: 0, gone: false, cheat: !!opts.cheat, ai: opts.ai || null, respawnT: 0, lastX: 0,
  };
  h.tag = makeTag(h.name, h.color);
  W.heroes.push(h);
  return h;
}
function makeFoe(type, x, z, opts = {}) {
  const F = FOES[type];
  const rig = buildHumanoid(F.spec);
  actorRoot.add(rig.root);
  const scale = W.authority ? DIFFICULTY[settings.difficulty].hp * (1 + 0.35 * Math.max(0, W.heroes.filter((h) => !h.gone).length - 1)) : 1;
  const f = {
    kind: 'foe', id: opts.id ?? W.nextId++, type, F, x, y: 0, z, vx: 0, vy: 0, vz: 0, face: x > W.camX ? -1 : 1, st: opts.rise ? 'rise' : 'idle', stT: 0,
    hp: Math.round(F.hp * scale), maxHp: Math.round(F.hp * scale), move: null, moveT: 0, hitList: new Set(), cool: rand(0.5, 1.5), mount: -1, rig,
    collider: W.authority && !F.thief ? Phys.character(F.spec.scale * 0.34) : null, slot: rand(-0.6, 0.6), lastBy: -1, tx: x, ty: 0, tz: z, summon: 0, loot: F.thief ? randi(1, 3) : 0,
    thiefDir: x < W.camX ? 1 : -1, phase: 0, bossStage: 0,

  if (opts.rise) emit('dust', x, 0.2, z, 14, 2.5);

  return f;
}
function makeBeast(kind, x, z, opts = {}) {
  const b = buildBeast(kind);

}

// ---------------------------------------------------------------- foes take damage (authority)
function credit(heroId, pts, foe) {

  if (foe && foe.hp <= 0 && !foe.credited) { foe.credited = true; h.kills++; }
}
function hurtFoe(f, hit, byId) {

    setState(f, 'block'); f.vx = hit.dir * 1.5;

function thiefDrop(f, dir) {

function grab(h, f) { setState(f, 'grabbed'); f.grabbedBy = h.id; }
function throwFoe(h) {

  const f = findFoe(h.throwTarget);

// ---------------------------------------------------------------- foe AI (authority)
function updateFoe(f, dt) {
  f.stT += dt; f.cool -= dt * DIFFICULTY[settings.difficulty].aggro;
  f.flash = Math.max(0, (f.flash || 0) - dt);
  const ground = Phys.ground(f.x, f.y, f.z);
  const mounted = f.mount >= 0 ? findBeast(f.mount) : null;
  const targets = aliveHeroes().filter((h) => h.st !== 'gone');
  let target = null, best = 1e9;
  for (const h of targets) { const d = Math.abs(h.x - f.x) + Math.abs(h.z - f.z) * 2 + (h.id === f.pref ? -2 : 0); if (d < best) { best = d; target = h; } }
  const F = f.F;
  switch (f.st) {
    case 'idle': case 'walk': case 'run': {
      if (F.thief) { thiefAI(f, dt); break; }
      if (!target) { f.vx = damp(f.vx, 0, 6, dt); f.vz = damp(f.vz, 0, 6, dt); f.st = 'idle'; break; }
      const reach = mounted ? mounted.B.reach * 0.9 : F.reach;
      let side = f.x < target.x ? -1 : 1;
      const lo = W.camX - VIEW_HALF + 1, hi = W.camX + VIEW_HALF - 1;
      // flank on whichever side stays inside the arena
      if (target.x + side * reach * 0.8 > hi || target.x + side * reach * 0.8 < lo) side = -side;
      const want = clamp(target.x + side * reach * 0.8, lo, hi);
      const wz = target.z + f.slot * 0.4;
      let dx = want - f.x, dz = wz - f.z;
      // personal space
      for (const o of W.foes) if (o !== f && o.st !== 'dead' && Math.abs(o.x - f.x) < 0.9 && Math.abs(o.z - f.z) < 0.6) { dx += (f.x - o.x) * 1.5; dz += (f.z - o.z) * 1.5 + 0.1; }
      const dist = Math.hypot(dx, dz * 1.6);
      const sp = (mounted ? mounted.B.speed * 0.8 : F.speed) * (f.st === 'run' ? 1.7 : 1);
      if (dist > 0.25) { f.vx = (dx / dist) * sp; f.vz = (dz / dist) * sp * 0.7; f.st = 'walk'; } else { f.vx = damp(f.vx, 0, 10, dt); f.vz = damp(f.vz, 0, 10, dt); f.st = 'idle'; }
      // don't walk off cliffs on purpose
      const ahead = Phys.ground(f.x + Math.sign(f.vx) * 0.8, 0, f.z + Math.sign(f.vz) * 0.8);
      if (ahead === -Infinity) { f.vx = 0; f.vz = -Math.sign(f.z) * sp * 0.5; }
      f.face = target.x > f.x ? 1 : -1;
      const inRange = Math.abs(target.x - f.x) < reach && Math.abs(target.z - f.z) < 0.55;
      if (f.cool <= 0 && target.st !== 'knock' && target.st !== 'lie') {
        if (F.boss) bossDecide(f, target);
        else if (mounted && inRange) { startMove(f, mounted.type === 'drake' ? 'fire' : 'tail'); f.cool = 1.8; }
        else if (inRange) { setState(f, 'windup'); f.next = F.lunge && Math.random() < 0.5 ? 'f_lunge' : f.type === 'brute' || f.type === 'knight' ? (Math.random() < 0.5 ? 'f_smash' : 'f_swing') : 'f_swing'; }
        else if (F.charge && Math.abs(target.z - f.z) < 0.5 && Math.abs(target.x - f.x) > 3 && Math.abs(target.x - f.x) < 7 && Math.random() < 0.02) { setState(f, 'windup'); f.next = 'f_charge'; }
        else if (F.jumper && Math.abs(target.x - f.x) < 4 && Math.abs(target.x - f.x) > 2 && Math.random() < 0.015) { setState(f, 'windup'); f.next = 'f_leap'; }
      }
      break;
    }
    case 'windup': {
      f.vx = damp(f.vx, 0, 10, dt); f.vz = damp(f.vz, 0, 10, dt);
      if (target) f.face = target.x > f.x ? 1 : -1;
      if (f.stT > F.windup / DIFFICULTY[settings.difficulty].aggro) {
        startMove(f, f.next || 'f_swing');
        const mv = FOE_MOVES[f.move];
        if (mv.vy) f.vy = mv.vy;
        if (mv.push) f.vx = f.face * mv.push;
        Audio.sfx('swing', 0.7);
        if (Math.random() < 0.3) Audio.grunt(F.voice, 'taunt');
      }
      break;
    }
    case 'atk': {
      const mv = FOE_MOVES[f.move];
      f.moveT += dt;
      if (!mv.push) { f.vx = damp(f.vx, 0, 10, dt); f.vz = damp(f.vz, 0, 10, dt); }
      else if (f.move === 'f_charge') { f.vx = f.face * mv.push; if (Math.random() < 0.4) emit('dust', f.x, 0.1, f.z, 1, 1); }
      if (mounted) mounted.attackK = f.moveT / mv.dur;
      if (mv.fire && mounted) breathFire(f, mounted, dt);
      else if (mv.slam) { if (f.moveT >= mv.h0 && f.y <= 0.01 && !f.slammed) { f.slammed = true; bossSlam(f); } }
      else if (f.moveT >= mv.h0 && f.moveT <= mv.h1) foeHits(f, mv, mounted);
      if (f.move === 'b_rain' && !f.rained && f.moveT > 0.4) { f.rained = true; waxRain(f); }
      if (f.moveT >= mv.dur && (!mv.vy || f.y <= 0.01)) { f.st = 'idle'; f.cool = F.cool * rand(0.8, 1.3); f.slammed = false; f.rained = false; if (mounted) mounted.attackK = 0; }
      break;
    }
    case 'block': f.vx = damp(f.vx, 0, 8, dt); if (f.stT > 0.45) { f.st = 'idle'; f.cool = Math.min(f.cool, 0.2); } break;
    case 'hurt': f.vx = damp(f.vx, 0, 8, dt); f.vz = 0; if (f.stT > 0.38) { f.st = 'idle'; if (F.thief && f.fleeing) f.st = 'run'; } break;
    case 'knock': if (f.y <= 0.001 && f.vy <= 0 && f.stT > 0.15) { setState(f, f.dying ? 'dead' : 'lie'); f.vx = 0; f.vz = 0; Audio.sfx('thud'); emit('dust', f.x, 0.1, f.z, 8, 2); shake(F.spec.scale > 1.3 ? 0.35 : 0.1); } break;
    case 'lie': f.vx = 0; if (f.stT > (F.boss ? 0.6 : 0.9)) setState(f, 'getup'); break;
    case 'getup': if (f.stT > 0.5) { f.st = 'idle'; f.cool = Math.max(f.cool, 0.5); } break;
    case 'dead': if (f.stT > 1.0) { shatterFoe(f); Net.event({ t: 'sh', f: f.id }); f.st = 'gone'; } break;
    case 'rise': if (f.stT > 0.9) f.st = 'idle'; break;
    case 'grabbed': {
      const h = findHero(f.grabbedBy);
      if (!h || f.stT > 1) { f.st = 'idle'; break; }
      f.x = h.x + h.face * 0.6; f.z = h.z + 0.05; f.y = 0.4 + Math.min(1, f.stT * 4); f.vy = 0; f.vx = 0; f.face = -h.face;
      break;
    }
    case 'thrown': {
      // tumbling body bowls other foes over
      for (const o of W.foes) if (o !== f && !o.F.boss && o.st !== 'knock' && o.st !== 'dead' && o.st !== 'gone' && Math.abs(o.x - f.x) < 0.8 && Math.abs(o.z - f.z) < 0.7 && Math.abs(o.y - f.y) < 1.2) hurtFoe(o, { dmg: 2, dir: Math.sign(f.vx), knock: true, kb: 4 }, f.thrownBy);
      if (f.y <= 0.001 && f.vy <= 0 && f.stT > 0.1) {
        f.st = 'idle';
        hurtFoe(f, { dmg: 3 * (findHero(f.thrownBy)?.H.power || 1), dir: Math.sign(f.vx), knock: true, kb: 2 }, f.thrownBy);
        shake(0.3); Audio.sfx('thud');
      }
      break;
    }
    case 'fall': if (f.y < -8) f.st = 'gone'; break;
    case 'steal': f.vx = 0; f.vz = 0; if (f.stT > 1.4) { f.st = 'run'; f.fleeing = true; } break;
  }
  if (f.st !== 'grabbed') finishBody(f, dt, ground);
  if (mounted) { mounted.x = f.x; mounted.z = f.z; mounted.y = f.y; mounted.face = f.face; mounted.moving = Math.hypot(f.vx, f.vz); }
  // keep foes inside the reachable band (they enter from off-screen)
  if (!F.thief && f.st !== 'fall' && f.st !== 'gone') {
    if (Math.abs(f.x - W.camX) < VIEW_HALF - 0.8) f.entered = true;
    const m = f.entered ? 0.6 : -4;
    f.x = clamp(f.x, W.camX - VIEW_HALF + m, W.camX + VIEW_HALF - m);
  }
}
function thiefAI(f, dt) {
  // imps dash across, pause to loot near a hero in camp, then flee; hit them for their loot
  const sp = f.F.speed * (f.fleeing ? 1.4 : 1);
  if (!f.fleeing && W.phaseKind === 'camp' && !f.looted && Math.abs(f.x - W.camX) < 3) { f.looted = true; setState(f, 'steal'); Audio.grunt('imp', 'laugh'); return; }
  f.vx = f.thiefDir * sp; f.vz = Math.sin(W.t * 3 + f.id) * 0.8;
  f.face = f.thiefDir; f.st = 'run';
  if (Math.abs(f.x - W.camX) > VIEW_HALF + 3 && Math.sign(f.x - W.camX) === f.thiefDir) f.st = 'gone';
}
function foeHits(f, mv, mounted) {
  const reach = mounted ? mounted.B.reach : f.F.reach * (mv.mul ? 1.1 : 1);
  for (const h of W.heroes) {
    if (f.hitList.has(h.id) || h.gone) continue;
    if (!inReach(f, h, reach, mv.depth)) continue;
    f.hitList.add(h.id);
    const dmg = Math.max(1, Math.round((mounted ? mounted.B.dmg : f.F.dmg) * (mv.mul || 1) * DIFFICULTY[settings.difficulty].dmg));

}
/** The world hits a hero: its own copy applies it (the victim decides). */

}
function hurtHero(h, hit) {
  if (h.invuln > 0 || h.gone || ['dead', 'knock', 'lie', 'getup', 'fall', 'cast', 'sleep'].includes(h.st)) return;
  if (h.cheat) { emit('magic', h.x, 1.2, h.z, 4, 2); return; }
  h.hp -= hit.dmg;
  emit('spark', h.x, 1.2, h.z + 0.3, 8, 4); emit('blood', h.x, 1.2, h.z, 4, 3);
  Audio.sfx('hit', 0.8); shake(0.2);
  if (h.mount >= 0) { dismount(h, false); hit.knock = true; }
  if (h.hp <= 0) { h.hp = 0; setState(h, 'knock'); h.vy = 6; h.vx = hit.dir * 4; Audio.grunt(h.H.voice, 'die'); h.invuln = 0; return; }
  Audio.grunt(h.H.voice, 'hurt');
  if (hit.knock) { setState(h, 'knock'); h.vy = 5; h.vx = hit.dir * 4; }

function shatterFoe(f) {

  const n = f.F.boss ? 30 : 10;

  emit('wax', f.x, 1, f.z, 14, 4); emit('smoke', f.x, 0.6, f.z, 6, 1);
  Audio.sfx('shatter');

}

// ---------------------------------------------------------------- beasts
function updateBeast(b, dt) {
  b.stT += dt;
  if (b.rider) {
    const r = b.rider.kind === 'hero' ? findHero(b.rider.id) : findFoe(b.rider.id);
    if (!r || r.mount !== b.id || r.st === 'dead' || r.st === 'gone') { b.rider = null; }
    return; // the rider moves it
  }
  // riderless: wander a little, shy from the heroes, never off a cliff
  b.wander -= dt;
  if (b.wander <= 0) { b.wander = rand(1.5, 3.5); const a = rand(0, TAU); b.vx = Math.cos(a) * 1.4; b.vz = Math.sin(a) * 0.8; }
  b.x = clamp(b.x, W.camX - VIEW_HALF + 1.5, W.camX + VIEW_HALF - 1.5);
  if (Math.abs(b.vx) > 0.1) b.face = Math.sign(b.vx);
  const ahead = Phys.ground(b.x + b.vx * 0.6, 0, b.z + b.vz * 0.6);
  if (ahead === -Infinity) { b.vx = -b.vx; b.vz = -b.vz; }
  const g = Phys.ground(b.x, 0, b.z);
  b.vy = 0;
  if (b.collider) [b.x, b.z] = Phys.move(b.collider, b.x, 0, b.z, b.vx * dt, b.vz * dt);
  else { b.x += b.vx * dt; b.z += b.vz * dt; }
  b.z = clamp(b.z, Z_BACK + 0.5, Z_FRONT - 0.5);
  b.y = g === -Infinity ? 0 : g;
  b.moving = Math.hypot(b.vx, b.vz);
}
/** Drake fire: a cone of flame ahead that ticks damage. Whoever rides decides who it hurts. */
function breathFire(a, b, dt) {
  b.fireT = (b.fireT || 0) + dt;
  b.mouth = 1;
  const mx = a.x + a.face * 1.6, my = 1.4, mz = a.z;
  for (let i = 0; i < 3; i++) emit('fire', mx, my, mz, 1, 1, { vx: a.face * rand(6, 9), vy: rand(-0.5, 0.5), size: 0.8, spread: 0.5 });
  if (Math.random() < 0.15) Audio.sfx('fire');
  if (b.fireT < 0.18) return;
  b.fireT = 0;
  const mv = { range: 4.5, depth: 0.9 };
  if (a.kind === 'hero') {
    for (const f of W.foes) {
      if (f.st === 'dead' || f.st === 'gone' || f.st === 'lie' || f.st === 'knock' || f.st === 'fall') continue;
      if (inReach(a, f, mv.range, mv.depth)) landHit(a, f, { dmg: 1.5, dir: a.face, knock: Math.random() < 0.4, kb: 3, move: 'fire' });
    }
  } else {
    for (const h of W.heroes) if (!h.gone && inReach(a, h, mv.range, mv.depth)) hitHero(h, { dmg: 2, dir: a.face, knock: true });
  }
}

// ---------------------------------------------------------------- boss: Lord Tallowmar
function bossDecide(f, target) {
  const d = Math.abs(target.x - f.x);
  const hpK = f.hp / f.maxHp;
  // summon at two-thirds and one-third health
  if ((hpK < 0.66 && f.bossStage === 0) || (hpK < 0.33 && f.bossStage === 1)) {
    f.bossStage++;
    say(STORY.bossMid);
    setState(f, 'atk', { move: 'b_rain', moveT: 0 }); f.hitList.clear();
    for (let i = 0; i < 2 + f.bossStage; i++) queueSpawn([i % 3 === 2 ? 'footman' : 'wickbone', 'U', rand(-2, 2), 0.6 + i * 0.4]);
    return;
  }
  const r = Math.random();
  if (d < f.F.reach && Math.abs(target.z - f.z) < 0.9) { setState(f, 'windup'); f.next = r < 0.7 ? 'b_swing' : 'f_smash'; }
  else if (r < 0.35) { setState(f, 'windup'); f.next = 'b_slam'; f.slamX = target.x; }
  else if (r < 0.55) { setState(f, 'atk', { move: 'b_rain', moveT: 0 }); f.hitList.clear(); f.cool = 2; }
  else f.cool = 0.4;
}
function bossSlam(f) {
  shake(0.6); Audio.sfx('thunder');
  ring(f.x, 0.1, f.z, '#ffcf6a', 0.5, 9, 0.6);
  emit('wax', f.x, 0.3, f.z, 30, 7); emit('dust', f.x, 0.2, f.z, 20, 5);
  flashLight(f.x, 1, f.z, '#ffb040', 60, 0.4, 16);
  Net.event({ t: 'fx', k: 'slam', x: Math.round(f.x * 10), z: Math.round(f.z * 10) });
  for (const h of W.heroes) if (!h.gone && h.y < 0.4 && Math.abs(h.x - f.x) < 8 && Math.abs(h.z - f.z) < 3) hitHero(h, { dmg: 3, dir: Math.sign(h.x - f.x) || 1, knock: true });
}
function waxRain(f) {
  Audio.speak('vorra kul mazz', 'villain');
  for (const h of aliveHeroes()) for (let i = 0; i < 2; i++) addHazard({ kind: 'drop', x: h.x + rand(-1.5, 1.5), z: clamp(h.z + rand(-0.8, 0.8), Z_BACK + 0.3, Z_FRONT - 0.3), t: 0, fuse: 1.1 + i * 0.35 });
}
function addHazard(z) {
  // a telegraph circle on the floor; the wax drop lands when the fuse runs out
  const m = new THREE.Mesh(geo('torus', 0.8, 0.05, 0, 20), glow('#ff6a3a'));
  m.rotation.x = Math.PI / 2; m.position.set(z.x, 0.05, z.z);
  z.mesh = m; fxRoot.add(m);
  W.hazards.push(z);
  if (W.authority) Net.event({ t: 'hz', x: Math.round(z.x * 10), z: Math.round(z.z * 10), f: z.fuse });
}
function updateHazards(dt) {
  for (let i = W.hazards.length - 1; i >= 0; i--) {
    const z = W.hazards[i];
    z.t += dt;
    const k = z.t / z.fuse;
    z.mesh.scale.setScalar(1.2 - k * 0.6);
    if (k >= 1) {
      emit('wax', z.x, 0.3, z.z, 12, 4); emit('fire', z.x, 0.4, z.z, 6, 2);
      Audio.sfx('thud');
      if (W.authority) for (const h of W.heroes) if (!h.gone && Math.abs(h.x - z.x) < 0.95 && Math.abs(h.z - z.z) < 0.7 && h.y < 1) hitHero(h, { dmg: 3, dir: Math.sign(h.x - z.x) || 1, knock: true });
      fxRoot.remove(z.mesh);
      W.hazards.splice(i, 1);
    } else if (k > 0.6) {
      // the drop falling from above
      if (Math.random() < 0.6) emit('wax', z.x, 8 - (k - 0.6) * 18, z.z, 1, 0.2, { size: 2 });
    }
  }
}

// ---------------------------------------------------------------- magic
function castMagic(h, level) {
  level = Math.max(1, Math.min(level, h.books, h.H.magicMax));
  if (h.books <= 0) { h.st = 'idle'; return; }
  if (!h.cheat) h.books -= level;
  h.casts++;
  setState(h, 'cast'); h.invuln = 1.4;
  Audio.grunt(h.H.voice, 'cast');

function magicDamage(heroId, level) {

// ---------------------------------------------------------------- drawing actors
function clipFor(a) {
  switch (a.st) {
    case 'atk': return (moveDef(a) || {}).clip || 'attack1';
    case 'jump': return a.vy > 0 ? 'jump' : 'fall';
    case 'ride': return 'ride';
    case 'run': return a.F && a.F.thief ? 'steal' : 'run';
    case 'gone': return 'idle';
    default: return CLIPS[a.st] ? a.st : 'idle';
  }
}
function drawActor(a, dt) {
  const r = a.rig;
  if (!r) return;
  const root = r.root;
  root.visible = a.st !== 'gone' && !a.gone;
  if (!root.visible) return;
  const mounted = a.mount >= 0 ? findBeast(a.mount) : null;
  root.position.set(a.x, a.y + (mounted ? mounted.rig.j.saddleY - 0.62 * r.scale : 0), a.z);
  const yaw = a.face > 0 ? Math.PI / 2 * 0.78 : -Math.PI / 2 * 0.78;
  root.rotation.y = angLerp(root.rotation.y, yaw, Math.min(1, dt * 18));
  const clip = mounted && a.st !== 'atk' ? 'ride' : clipFor(a);
  const speed = a.st === 'walk' || a.st === 'run' ? clamp(Math.hypot(a.vx, a.vz) / (a.kind === 'hero' ? a.H.speed : 3) * (a.st === 'run' ? 0.75 : 1), 0.4, 1.8) : 1;
  r.anim.play(clip, { speed, restart: a.st === 'atk' && a.moveT === 0 && a.stT === 0 });
  r.anim.update(dt);
  if (r.j.cape) r.j.cape.rotation.x = damp(r.j.cape.rotation.x, clamp(Math.abs(a.vx) * 0.12 + (a.vy > 0 ? 0.3 : 0), 0, 1.2) + Math.sin(W.t * 3 + a.id) * 0.05, 6, dt);
  if (r.j.flame) r.j.flame.scale.y = 1 + Math.sin(W.t * 15 + a.id) * 0.25;
  // telegraph: foes flash before they strike; everyone flashes when struck
  const flashing = (a.st === 'windup' && Math.floor(a.stT * 14) % 2 === 0) || (a.flash > 0) || (a.kind === 'hero' && a.invuln > 0 && Math.floor(a.invuln * 12) % 2 === 0 && a.st !== 'cast');
  rigFlash(r, flashing && a.st !== 'dead');
  if (a.st === 'charge' && Math.random() < 0.3) emit('magic', a.x + rand(-0.4, 0.4), rand(0.2, 2), a.z, 1, 1);
  // squash on land
  root.scale.setScalar(1);
  if (a.tag) placeTag(a.tag, a.x, a.y + 2.5 * r.scale + (mounted ? 1 : 0), a.z);
}
function drawBeast(b, dt) {
  const root = b.rig.root;
  root.visible = b.st !== 'gone';
  root.position.set(b.x, b.y, b.z);
  const yaw = b.face > 0 ? 0.25 : Math.PI - 0.25;
  root.rotation.y = angLerp(root.rotation.y, yaw, Math.min(1, dt * 12));
  b.mouth = damp(b.mouth || 0, 0, 6, dt);
  animateBeast(b.rig, dt, clamp((b.moving || 0) / 3, 0, 1.5), b.attackK || 0, b.mouth);
}

// ============================================================================
// Game flow: the journey (stages and camps), camera locks and waves, the
// camera, continues, attract mode, and AI Hub co-op sessions.
// ============================================================================
const PHASES = [{ type: 'stage', s: 0 }, { type: 'camp' }, { type: 'stage', s: 1 }, { type: 'camp' }, { type: 'stage', s: 2 }, { type: 'ending' }];
let hitStopT = 0;
function hitStop(t) { if (W.mode === 'solo') hitStopT = Math.max(hitStopT, t); }

function startPhase(i, opts = {}) {
  const P = PHASES[i];
  W.phase = i;
  W.phaseKind = P.type;
  clearWorld(true);
  timers.length = 0;
  hitStopT = 0;
  const stage = P.type === 'stage' ? STAGES[P.s] : P.type === 'camp' ? CAMP : STAGES[2];
  W.stage = stage;
  Level.build(stage);
  W.lockIdx = 0; W.waveIdx = -1; W.locked = false; W.queue = []; W.clearT = -1; W.campT = 0; W.bossId = -1; W.bossName = ''; W.goT = 0; W.impT = 0;
  W.camX = VIEW_HALF - 4; W.camFloor = W.camX;
  W.camMax = stage.locks ? stage.locks[0].x : stage.length - VIEW_HALF;
  if (P.type === 'ending') W.camMax = W.camX = 82;
  const live = W.heroes.filter((h) => !h.gone);
  live.forEach((h, k) => {
    h.x = P.type === 'ending' ? 80 + k * 1.6 : 1.5 + k * 1.3; h.z = -0.8 + k * 0.7; h.y = 0; h.vx = h.vy = h.vz = 0; h.face = 1; h.mount = -1;
    h.safeX = h.x; h.safeZ = h.z; h.tx = h.x; h.ty = 0; h.tz = h.z;
    setState(h, P.type === 'camp' ? 'sleep' : P.type === 'ending' ? 'idle' : 'idle');
    h.invuln = 1;
    if (P.type === 'camp') h.hp = Math.min(h.maxHp, h.hp + Math.ceil(h.maxHp * 0.5));
  });
  if (P.type === 'camp') { W.camX = W.camMax = W.camFloor = 14; }
  Audio.playSong(P.type === 'ending' ? 'victory' : stage.music);
  if (!opts.silent) {
    if (P.type === 'stage') UI.stageCard(P.s, stage);
    else if (P.type === 'camp') UI.storyLines(STORY.camp, null, true);
    else if (P.type === 'ending') {
      for (const h of live) setState(h, 'victory');
      if (Net.on) { UI.storyLines(STORY.ending, null, true); if (W.mode === 'host') after(9, () => Game.sessionFinish(true)); }
      else if (!W.attract) UI.storyLines(STORY.ending, () => Game.finishJourney(true), false);
    }
  }
  if (W.mode === 'host') Net.event({ t: 'ph', n: i });
}
function nextPhase() {
  if (W.mode === 'client') return;
  if (W.phase + 1 >= PHASES.length) return;
  startPhase(W.phase + 1);
}

// ---------------------------------------------------------------- waves (authority)
function queueSpawn(e) { W.queue.push({ e, at: W.t + (e[3] || 0) }); }
function spawnEntry(e) {
  const [type, side, z, , extra = {}] = e;
  let x;
  if (side === 'L') x = W.camX - VIEW_HALF - 1.2;
  else if (side === 'R') x = W.camX + VIEW_HALF + 1.2;
  else if (side === 'B') x = W.camX + rand(-5, 5);
  else x = clamp((aliveHeroes()[0]?.x ?? W.camX) + rand(-4, 4), W.camX - VIEW_HALF + 1.5, W.camX + VIEW_HALF - 1.5);
  let zz = clamp(z, Z_BACK + 0.3, Z_FRONT - 0.3);
  if (Phys.ground(x, 0, zz) === -Infinity) zz = -1.5;
  if (!type) { makeBeast(extra.beast, x, zz); return; }
  const f = makeFoe(type, x, zz, { rise: side === 'U' });
  if (side === 'B') { f.z = Z_BACK; f.vz = 2; }
  if (extra.mount) { const b = makeBeast(extra.mount, x, zz); mountBeast(f, b); }
  if (FOES[type].boss) {
    W.bossId = f.id;
    say(STORY.boss);
  }
}
function updateWaves(dt) {
  const stage = W.stage;
  for (let i = W.queue.length - 1; i >= 0; i--) if (W.t >= W.queue[i].at) { spawnEntry(W.queue[i].e); W.queue.splice(i, 1); }
  // tidy away the gone
  for (let i = W.foes.length - 1; i >= 0; i--) if (W.foes[i].st === 'gone') { removeActor(W.foes[i]); W.foes.splice(i, 1); }
  if (W.phaseKind === 'camp') {
    W.campT += dt;
    W.impT -= dt;
    if (W.campT > 2.5 && W.campT < CAMP.duration - 3 && W.impT <= 0) {
      W.impT = rand(1.2, 2.0);
      const left = Math.random() < 0.5;
      const f = makeFoe(Math.random() < 0.55 ? 'imp' : 'impg', W.camX + (left ? -1 : 1) * (VIEW_HALF + 1), rand(-2.5, 2.5));
      f.thiefDir = left ? 1 : -1; f.loot = randi(1, 3);
    }
    if (W.campT >= CAMP.duration && W.clearT < 0) { W.clearT = 0; nextPhase(); }
    return;
  }
  if (W.phaseKind !== 'stage') return;
  const locks = stage.locks;
  if (!W.locked && W.lockIdx < locks.length && W.camX >= locks[W.lockIdx].x - 0.3) {
    W.locked = true; W.waveIdx = 0;
    const L = locks[W.lockIdx];
    for (const e of L.waves[0]) queueSpawn(e);
    if (L.boss) { W.bossName = L.boss; UI.bossBanner(L.boss); Audio.sfx('stinger'); }
  }
  if (W.locked) {
    const L = locks[W.lockIdx];
    const fighters = W.foes.filter((f) => !f.F.thief && f.st !== 'gone');
    if (W.queue.length === 0 && fighters.length === 0) {
      if (W.waveIdx + 1 < L.waves.length) { W.waveIdx++; for (const e of L.waves[W.waveIdx]) queueSpawn(e); }
      else if (!L.final) {
        W.locked = false; W.lockIdx++; W.bossName = '';
        W.camMax = W.lockIdx < locks.length ? locks[W.lockIdx].x : stage.exitX - VIEW_HALF + 3;
        W.goT = 3; Audio.sfx('go');
        Net.event({ t: 'go' });
      }
    }
  } else if (W.lockIdx >= locks.length && W.clearT < 0) {
    const lead = Math.max(...aliveHeroes().map((h) => h.x), -99);
    if (lead >= stage.exitX - 1) { W.clearT = 0; Game.stageClear(); }
  }
  if (W.clearT >= 0) { W.clearT += dt; if (W.clearT > 3.2 && W.clearT < 99) { W.clearT = 99; nextPhase(); } }
}
function onBossDefeated(f) {
  if (!W.stage.locks || !W.stage.locks[W.lockIdx] || !W.stage.locks[W.lockIdx].final) return;
  // everything else crumbles with its master
  for (const o of W.foes) if (o !== f && o.st !== 'gone' && o.st !== 'dead') { o.hp = 0; setState(o, 'knock'); o.vy = 4; o.dying = true; }
  W.bossKiller = f.lastBy;
  Game.slowmo(1.6);
  UI.banner('VICTORY!', 3);
  Audio.sfx('stinger');
  Net.event({ t: 'win' });
  const ph = W.phase;
  after(3.8, () => { if (W.phase === ph) nextPhase(); });
}
function onHeroOut() {
  if (W.mode !== 'solo') return;
  if (W.heroes.every((h) => h.gone)) Game.allOut();
}
function say(line) {
  UI.dialog(line);
  if (W.mode === 'host') Net.event({ t: 'say', w: line.who, x: line.text });
}

// ---------------------------------------------------------------- camera
function updateCamera(dt) {
  const hs = W.heroes.filter((h) => !h.gone && h.st !== 'fall');
  if (hs.length && W.phaseKind === 'stage') {
    const avg = hs.reduce((s, h) => s + h.x, 0) / hs.length;
    const lead = Math.max(...hs.map((h) => h.x));
    const want = Math.max(avg, lead - VIEW_HALF + 3);
    const target = clamp(want, W.camFloor, Math.max(W.camFloor, W.camMax));
    W.camX = damp(W.camX, Math.max(target, W.camX), 4, dt);
    W.camFloor = Math.max(W.camFloor, W.camX);
  }
  camState.shake = Math.max(0, camState.shake - dt * 1.6);
  const s = camState.shake * camState.shake * 0.6;
  const zoom = W.phaseKind === 'camp' ? -2 : 0;
  camera.position.set(W.camX + rand(-s, s), 6.6 + rand(-s, s) + zoom * 0.3, 17 + zoom);
  camera.lookAt(W.camX, 1.5, 0);
  sunLight.position.set(W.camX - 8, 18, 10);
  sunLight.target.position.set(W.camX, 0, 0);
}

// ---------------------------------------------------------------- attract mode AI
// It cheats freely: infinite health and magic. Its only job is to show off.
function attractAI(h) {
  const out = { x: 0, y: 0, p: {}, h: {}, r: {}, run: false };
  h.aiT = (h.aiT || 0) + 1 / 60;
  const foes = W.foes.filter((f) => f.st !== 'gone' && f.st !== 'dead' && f.st !== 'fall' && Math.abs(f.x - W.camX) < VIEW_HALF + 1);
  // ride any free beast nearby
  const beast = W.beasts.find((b) => !b.rider && Math.abs(b.x - h.x) < 6);
  if (h.mount < 0 && beast) {
    out.x = Math.sign(beast.x - h.x) * (Math.abs(beast.x - h.x) > 0.6 ? 1 : 0); out.y = clamp((beast.z - h.z) * 2, -1, 1);
    if (Math.abs(beast.x - h.x) < 1.2 && Math.abs(beast.z - h.z) < 0.8) out.p.jump = true;
    return out;
  }
  if (h.aiT > 9 && foes.length >= 2 && h.st !== 'charge') { h.aiT = 0; out.p.magic = true; out.h.magic = true; h.aiCharge = rand(0.4, 1.4); return out; }
  if (h.st === 'charge') { h.aiCharge -= 1 / 60; out.h.magic = h.aiCharge > 0; return out; }
  if (!foes.length) {
    const pk = W.pickups[0];
    if (pk) { out.x = Math.sign(pk.x - h.x); out.y = clamp((pk.z - h.z) * 2, -1, 1); return out; }
    out.x = W.locked ? 0 : 1; out.run = !W.locked && Math.random() < 0.6; out.y = clamp(-h.z, -1, 1) * 0.5;
    return out;
  }
  let t = foes[0], best = 1e9;
  for (const f of foes) { const d = Math.abs(f.x - h.x) + Math.abs(f.z - h.z) * 2; if (d < best) { best = d; t = f; } }
  const dx = t.x - h.x, dz = t.z - h.z;
  const want = Math.abs(dx) > 1.2 ? Math.sign(dx) : Math.abs(dx) < 0.6 ? -Math.sign(dx) * 0.5 : 0;
  out.x = want; out.y = clamp(dz * 2, -1, 1);
  if (Math.abs(dx) < (h.mount >= 0 ? 2.2 : 1.7) && Math.abs(dz) < 0.5) {
    out.x = Math.sign(dx) * 0.2;
    const r = Math.random();
    if (r < 0.12) out.p.attack = true;
    else if (r < 0.125 && h.mount < 0) { out.p.jump = true; }
    else if (r < 0.13 && h.mount < 0) out.p.back = true;
  } else if (Math.abs(dx) > 4 && Math.abs(dz) < 0.5 && Math.random() < 0.01) { out.run = true; out.p.attack = true; }
  if (h.st === 'jump' && Math.abs(dx) < 2.2) out.p.attack = true;
  return out;
}

// ---------------------------------------------------------------- networking (AI Hub co-op)
const Net = {

  event(msg) { if (this.info) AIHub.send(msg); },
  toHost(msg) { if (this.info && !this.info.isHost) AIHub.send(msg, { to: this.info.host }); },
  toPlayer(id, msg) { if (this.info) AIHub.send(msg, { to: id }); },
  me() { return this.info ? W.heroes.find((h) => h.id === this.info.me) : null; },
  update(dt) {
    if (!this.info || Game.scene !== 'play') return;
    this.sendT += dt;
    if (this.sendT < 1 / 15) return;
    this.sendT = 0;
    const r1 = (v) => Math.round(v * 100) / 100;
    if (this.info.isHost) {
      const snap = {
        t: 's', at: Math.round(AIHub.time()), ph: [W.phase, W.lockIdx, W.locked ? 1 : 0, Math.round(W.camMax * 10), Math.round(W.camFloor * 10), W.bossId],
        h: W.heroes.filter((h) => !h.gone).map((h) => [h.id, r1(h.x), r1(h.y), r1(h.z), h.face, STC[h.st], Math.round(h.hp), h.mount, MOVE_CODES.indexOf(h.move), h.score, h.kills, h.books, h.heroIdx]),
        f: W.foes.filter((f) => f.st !== 'gone').map((f) => [f.id, FOE_CODES.indexOf(f.type), r1(f.x), r1(f.y), r1(f.z), f.face, STC[f.st], Math.round((f.hp / f.maxHp) * 100), f.mount, MOVE_CODES.indexOf(f.move)]),
        b: W.beasts.map((b) => [b.id, b.type === 'drake' ? 1 : 0, r1(b.x), r1(b.y), r1(b.z), b.face, b.rider ? (b.rider.kind === 'hero' ? b.rider.id : -2) : -1, r1(b.attackK || 0)]),
        p: W.pickups.map((p) => [p.id, PICKUP_KINDS.indexOf(p.kind), r1(p.x), r1(p.z)]),
