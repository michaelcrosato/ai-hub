  <style>
:root {
  color-scheme: dark;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --ink: #e8fff8;
  --muted: #80a6a1;
  --cyan: #62ffd2;
  --orange: #ff9e58;
  --red: #ff5a68;
  --acid: #9dff6a;
  --panel: rgba(3, 11, 16, 0.86);
  --line: rgba(119, 255, 217, 0.24);
}
* { box-sizing: border-box; }
html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #02070a; }
body { overscroll-behavior: none; touch-action: none; color: var(--ink); }
button { font: inherit; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#vignette {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 50% 48%, transparent 40%, rgba(0,0,0,.28) 80%, rgba(0,0,0,.66) 115%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.016) 0 1px, transparent 1px 4px);
  mix-blend-mode: normal;
}
.hidden { display: none !important; }
.panel {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(92vw, 560px); max-height: calc(100% - 24px); overflow: auto; padding: 28px;
  background: linear-gradient(180deg, rgba(7,18,24,.95), rgba(2,8,11,.92));
  border: 1px solid var(--line); border-radius: 18px;
  box-shadow: 0 24px 80px rgba(0,0,0,.6), inset 0 0 40px rgba(98,255,210,.035);
  backdrop-filter: blur(14px); z-index: 20;
}
.boot-panel { text-align: center; }
.kicker { color: var(--cyan); font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
h1, h2 { margin: 10px 0 12px; line-height: .86; letter-spacing: -.05em; }
h1 { font-size: clamp(58px, 15vw, 108px); color: white; text-shadow: 0 0 28px rgba(98,255,210,.18); }
h2 { font-size: clamp(36px, 9vw, 62px); color: white; }
.tagline, .panel p { color: #a9c0bd; line-height: 1.5; }
.primary, .secondary {
  width: 100%; min-height: 52px; margin-top: 14px; border-radius: 10px; border: 1px solid transparent;
  font-weight: 900; letter-spacing: .08em; cursor: pointer;
}
.primary { background: var(--cyan); color: #04100e; box-shadow: 0 0 30px rgba(98,255,210,.18); }
.secondary { background: transparent; color: var(--ink); border-color: rgba(255,255,255,.15); }
.secondary:hover { border-color: rgba(98,255,210,.45); }
.primary:focus-visible, .secondary:focus-visible, .primary.is-focus, .secondary.is-focus { outline: 2px solid #fff; outline-offset: 3px; }
.secondary.is-focus { border-color: var(--cyan); background: rgba(98,255,210,.08); }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.btn-grid .secondary { min-height: 46px; font-size: 12px; }
.best-line { margin: 12px 0 0; font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--orange) !important; }
.hint-line { margin: 10px 0 0; font-size: 11px; letter-spacing: .04em; color: #6f948f !important; }
.boot-meta { margin-top: 18px; display: flex; justify-content: space-between; gap: 16px; color: #56726e; font-size: 9px; letter-spacing: .12em; }
.hud { position: absolute; inset: 0; pointer-events: none; z-index: 8; }
.hud-top { display: flex; gap: 10px; align-items: stretch; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left)); }
.stat { min-height: 46px; padding: 8px 10px; border: 1px solid var(--line); background: rgba(3,11,16,.72); backdrop-filter: blur(9px); border-radius: 10px; }
.cluster { display: grid; grid-template-columns: auto minmax(68px, 15vw) auto; align-items: center; gap: 7px; }
.xp-cluster { grid-template-columns: auto auto minmax(56px, 10vw); }
.objective { margin-left: auto; max-width: 42vw; display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.label { color: #6f948f; font-size: 8px; font-weight: 800; letter-spacing: .14em; }
.stat b, .stat #hp-text { color: white; font-size: 12px; }
.meter { width: 100%; height: 6px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.08); }
.meter i { display: block; height: 100%; width: 100%; background: var(--cyan); box-shadow: 0 0 12px rgba(98,255,210,.5); transform-origin: left center; }
.meter.low i { background: var(--red); box-shadow: 0 0 12px rgba(255,90,104,.6); }
.meter.xp i { background: var(--orange); }
.pause { pointer-events: auto; flex: 0 0 auto; width: 46px; border-radius: 10px; border: 1px solid var(--line); background: rgba(3,11,16,.72); color: var(--ink); font-weight: 900; cursor: pointer; }
html.kit-touch-on .pause { display: none; }
.minimap { position: absolute; right: max(10px, env(safe-area-inset-right)); top: calc(max(10px, env(safe-area-inset-top)) + 54px); width: 210px; padding: 6px; border: 1px solid var(--line); background: rgba(3,11,16,.66); border-radius: 10px; display: none; }
@media (min-width: 900px) and (min-height: 560px) { .minimap { display: block; } }
html.kit-touch-on .minimap { display: none; }
.hud-center { position: absolute; left: 50%; top: max(70px, var(--kit-touch-top, 0px)); transform: translateX(-50%); width: min(460px, 84vw); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.toast { padding: 10px 14px; max-width: 100%; text-align: center; border-radius: 9px; border: 1px solid var(--line); background: rgba(3,11,16,.88); color: var(--ink); font-size: 11px; font-weight: 800; letter-spacing: .05em; opacity: 0; transform: translateY(-4px); transition: opacity .18s, transform .18s; }
.toast.show { opacity: 1; transform: translateY(0); }
.boss-hud { width: min(420px, 100%); padding: 8px 10px; background: rgba(20,4,8,.75); border: 1px solid rgba(255,90,104,.35); border-radius: 9px; text-align: center; }
.boss-hud span { color: #ffd8dc; font-size: 9px; font-weight: 900; letter-spacing: .18em; }
.meter.boss { margin-top: 5px; height: 7px; }
.meter.boss i { background: var(--red); box-shadow: 0 0 16px rgba(255,90,104,.55); }
.pause-panel p { font-size: 13px; }
.map-head { display: flex; justify-content: space-between; gap: 10px; margin-top: 4px; color: #6f948f; font-size: 9px; font-weight: 800; letter-spacing: .14em; }
.map-head b { color: white; }
.map-wrap { margin: 8px 0 12px; padding: 8px; border: 1px solid rgba(255,255,255,.07); border-radius: 10px; background: rgba(0,0,0,.25); }
.map-wrap svg, .minimap svg { display: block; width: 100%; height: auto; }
svg .room { fill: rgba(98,255,210,.02); stroke: rgba(98,255,210,.1); stroke-width: 1; vector-effect: non-scaling-stroke; }
svg .room.visited { fill: rgba(98,255,210,.18); stroke: rgba(98,255,210,.5); }
svg .room.current { fill: rgba(255,158,88,.3); stroke: var(--orange); }
svg .item { fill: #ffd27a; }
svg .item.major { fill: var(--cyan); }
svg .cp { fill: none; stroke: var(--acid); stroke-width: 1; vector-effect: non-scaling-stroke; }
svg .me { fill: #fff; stroke: #04100e; stroke-width: 1; vector-effect: non-scaling-stroke; }
.help { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 4px 0 2px; text-align: left; font-size: 12px; color: #a9c0bd; }
.help b { color: white; font-size: 10px; font-weight: 900; letter-spacing: .1em; align-self: center; }
.mission-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 18px 0 8px; }
.mission-stats div { padding: 12px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); border-radius: 9px; }
.mission-stats span { display: block; color: #6f948f; font-size: 8px; letter-spacing: .12em; }
.mission-stats b { display: block; margin-top: 3px; color: white; font-size: 18px; }
@media (max-width: 720px) {
  .hud-top { gap: 6px; }
  .stat { padding: 7px 8px; min-height: 42px; }
  .objective { max-width: 40vw; }
  .objective b { font-size: 9px; }
  .cluster { grid-template-columns: auto minmax(52px, 13vw) auto; }
  .xp-cluster { display: none; }
  .panel { padding: 22px; }
  .help { font-size: 11px; }
}
@media (max-height: 520px) {
  .panel { padding: 16px 20px; }
  h1 { font-size: 52px; }
  h2 { font-size: 34px; margin: 6px 0 8px; }
  .primary, .secondary { min-height: 42px; margin-top: 8px; }
  .map-wrap { margin: 6px 0 8px; }
}
@media (prefers-reduced-motion: reduce) {
  #vignette { background: radial-gradient(circle at 50% 48%, transparent 40%, rgba(0,0,0,.62) 115%); }
  .toast { transition: none; }
}
</style>

  <body>
    <main id="app" aria-label="Neon Burrow game">
      <canvas id="game" aria-label="Game view"></canvas>
      <div id="vignette" aria-hidden="true"></div>

      <section id="boot" class="panel boot-panel">
        <div class="kicker">ORBITAL SALVAGE UNIT // K-7</div>
        <h1>NEON<br/>BURROW</h1>
        <p class="tagline">Descend. Adapt. Re-open the buried relay.</p>
        <button id="continue-button" class="primary hidden">CONTINUE</button>
        <button id="start-button" class="primary">ENTER THE BURROW</button>
        <button id="title-settings" class="secondary">SETTINGS</button>
        <p id="title-best" class="best-line hidden"></p>
        <p id="title-help" class="hint-line"></p>
        <div class="boot-meta">
          <span id="renderer-label">RENDERER: PROBING</span>
          <span>BUILD: VERTICAL SLICE + CISTERN</span>
        </div>
      </section>

      <section id="hud" class="hud hidden" aria-live="polite">
        <div class="hud-top">
          <div class="stat cluster">
            <span class="label">SUIT</span>
            <div id="hp-meter" class="meter"><i id="hp-bar"></i></div>
            <span id="hp-text">100</span>
          </div>
          <div class="stat cluster xp-cluster">
            <span class="label">LV</span><b id="level-text">1</b>
            <div class="meter xp"><i id="xp-bar"></i></div>
          </div>
          <div class="stat objective"><span class="label">OBJECTIVE</span><b id="objective-text">REACH THE SHAFT</b></div>
          <button id="pause-button" class="pause" aria-label="Pause game">Ⅱ</button>
        </div>
        <div id="minimap" class="minimap" aria-hidden="true"></div>
        <div class="hud-center">
          <div id="boss-hud" class="boss-hud hidden">
            <span>RELAY WARDEN</span>
            <div class="meter boss"><i id="boss-bar"></i></div>
          </div>
          <div id="toast" class="toast"></div>
        </div>
      </section>

      <section id="pause-panel" class="panel pause-panel hidden">
        <div class="kicker">SYSTEM PAUSED</div>
        <h2>FIELD MANUAL</h2>
        <div class="map-head"><span>SECTOR <b id="map-room">LANDING VAULT</b></span><span id="map-stats"></span></div>
        <div id="pause-map" class="map-wrap" aria-label="Burrow map"></div>
        <div id="pause-help" class="help"></div>
        <button id="resume-button" class="primary">RESUME</button>
        <div class="btn-grid">
          <button id="pause-settings" class="secondary">SETTINGS</button>
          <button id="retry-button" class="secondary">RETRY CHECKPOINT</button>
          <button id="restart-button" class="secondary">RESTART MISSION</button>
          <button id="quit-button" class="secondary">QUIT TO TITLE</button>
        </div>
      </section>

      <section id="complete-panel" class="panel complete-panel hidden">
        <div class="kicker">RELAY ONLINE</div>
        <h2>BURROW CLEARED</h2>
        <div id="mission-stats" class="mission-stats"></div>
        <p id="complete-note" class="best-line"></p>
        <button id="replay-button" class="primary">RUN IT AGAIN</button>
        <button id="complete-title" class="secondary">BACK TO TITLE</button>
      </section>
    </main>
    <script type="module">
import * as THREE from 'three/webgpu';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { boot } from 'kit/boot.js';
import { createPost } from 'kit/post.js';

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const overlap = (a, b) => a.minX < b.maxX && a.maxX > b.minX && a.minY < b.maxY && a.maxY > b.minY;
const dist2 = (ax, ay, bx, by) => (ax - bx) ** 2 + (ay - by) ** 2;
const makeBox = () => ({ minX: 0, maxX: 0, minY: 0, maxY: 0 });
const setBox = (b, x, y, hw, hh) => {
  b.minX = x - hw; b.maxX = x + hw; b.minY = y - hh; b.maxY = y + hh;
  return b;
};
const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function seeded(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

// Progress lives in localStorage; private windows can refuse it, so every access is guarded.
const SAVE_KEY = 'neon-burrow.save.v1';
const BEST_KEY = 'neon-burrow.best.v1';
const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage unavailable */ } },
  del(key) { try { localStorage.removeItem(key); } catch { /* storage unavailable */ } },
};

// Rooms, for the map and the sector name. Interiors in world units (x right, y up).
const ROOMS = [
  { id: 'landing', name: 'LANDING VAULT', minX: -9, maxX: 28, minY: 0, maxY: 12 },
  { id: 'cistern', name: 'DROWNED CISTERN', minX: -8, maxX: 27, minY: -14, maxY: -6 },
  { id: 'shaft', name: 'SPINE SHAFT', minX: 28, maxX: 44, minY: -14, maxY: 14 },
  { id: 'glowroot', name: 'GLOWROOT GALLERY', minX: 44, maxX: 77, minY: -14, maxY: -2.8 },
  { id: 'tube', name: 'SERVICE TUBE', minX: 77, maxX: 95, minY: -14, maxY: -12 },
  { id: 'court', name: 'RELAY COURT', minX: 95, maxX: 126, minY: -14, maxY: 3 },
  { id: 'lift', name: 'LIFT 7', minX: 126, maxX: 140, minY: -14, maxY: -4 },
];
const ROOM_BY_ID = new Map(ROOMS.map((r) => [r.id, r]));
const roomAt = (x, y) => {
  for (const r of ROOMS) if (x >= r.minX - 0.5 && x < r.maxX + 0.5 && y >= r.minY - 2 && y <= r.maxY + 1.5) return r;
  return null;
};

const PICKUPS = [
  { id: 'fold', type: 'fold', x: 69.2, y: -12.55, label: 'FOLD CORE', major: true },
  { id: 'arc', type: 'arc', x: 94.1, y: -12.55, label: 'ARC LENS', major: true },
  { id: 'coil', type: 'coil', x: -5, y: -12.2, label: 'SPRING COIL', major: true },
  { id: 'capacitor', type: 'health', x: 38.5, y: 11.7, label: 'CAPACITOR +20', secret: true },
  { id: 'coolant', type: 'overclock', x: 47.0, y: -12.2, label: 'COOLANT BYPASS', secret: true },
  { id: 'plating', type: 'plating', x: 10.5, y: -8.4, label: 'REFLEX PLATING', secret: true },
  { id: 'alcove', type: 'health', x: 2.7, y: 5.6, label: 'CAPACITOR +20', secret: true },
];

const HELP = {
  keyboard: [
    ['MOVE', 'A / D or ← →'],
    ['AIM', 'W / ↑ up · S / ↓ down while airborne'],
    ['JUMP', 'Space (again in mid-air with the Spring Coil)'],
    ['FIRE', 'J / F or left click, hold to repeat'],
    ['FOLD', 'K / Shift or right click'],
    ['MAP · PAUSE', 'M · Esc / P'],
    ['ZOOM', 'Mouse wheel or + / −'],
  ],
  gamepad: [
    ['MOVE / AIM', 'Left stick or D-pad'],
    ['JUMP', 'A (again in mid-air with the Spring Coil)'],
    ['FIRE', 'X or RT, hold to repeat'],
    ['FOLD', 'B or LT'],
    ['MAP · PAUSE', 'Y / View · Start'],
    ['ZOOM', 'LB / RB'],
  ],
  touch: [
    ['MOVE / AIM', 'Left thumb stick, push up to aim up'],
    ['JUMP · FIRE · FOLD', 'Buttons on the right, hold FIRE'],
    ['MAP · PAUSE', 'Pills at the top right'],
    ['ZOOM', 'Pinch the view'],
  ],
};
const HINTS = {
  keyboard: 'A/D move · Space jump · J fire · K fold · M map · Esc pause',
  gamepad: 'Stick move · A jump · X fire · B fold · Y map · Start pause',
  touch: 'Thumb stick moves · JUMP, FIRE and FOLD on the right · pinch to zoom',
};
const FOLD_PROMPT = { keyboard: 'PRESS K', gamepad: 'PRESS B', touch: 'TAP FOLD' };

const freshFlags = () => ({
  startDoorOpen: false, valveOpen: false, enteredShaft: false, shaftBottom: false,
  foldCore: false, arcLens: false, springCoil: false,
  bossStarted: false, bossDead: false, phase2: false,
});
const SAVED_FLAGS = ['startDoorOpen', 'valveOpen', 'enteredShaft', 'shaftBottom', 'foldCore', 'arcLens', 'springCoil', 'bossDead'];
const SAVED_STATS = ['level', 'xp', 'nextXp', 'maxHp', 'damage', 'fireCooldown', 'armor'];

const _o = new THREE.Object3D();
const _c = new THREE.Color();
const _v = new THREE.Vector3();

class NeonBurrow {
  constructor(kit) {
    this.kit = kit;
    this.input = kit.input;
    this.renderer = kit.renderer;

    this.scene = null;
    this.camera = null;
    this.post = null;
    this.staticGroup = null;
    this.dynamicGroup = null;
    this.fxGroup = null;
    this.staticBuckets = new Map();

    this.started = false;
    this.paused = false;
    this.complete = false;
    this.dead = false;
    this.elapsed = 0;
    this.clock = 0;
    this.kills = 0;
    this.deaths = 0;

    this.world = { minX: -10, maxX: 142, minY: -18, maxY: 16 };
    this.solids = [];
    this.hazards = [];
    this.doors = [];
    this.enemies = [];
    this.projectiles = [];
    this.enemyProjectiles = [];
    this.pickups = [];
    this.lights = [];
    this.secretsTotal = 0;
    this.secretsFound = 0;

    this.cameraZoom = 1;
    this.cameraShake = 0;
    this.snapCamera = true;
    this.reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.view = { w: 20, h: 15.2 };

    // One frame of player intent, read once per frame from kit.input (one-shot presses are consumed by the first sub-step).
    this.ctl = { move: 0, aimY: 0, jumpPressed: false, fire: false, foldPressed: false };
    this.flags = freshFlags();

    this.player = null;
    this.boss = null;
    this.respawnTimer = 0;
    this.toastTimer = 0;
    this.objective = '';
    this.room = null;
    this.visited = new Set();
    this.bubbleTimer = 0;

    this.audio = null;
    this.audioMaster = null;
    this.drone = null;

    this.menu = { name: null, buttons: [], idx: 0, dir: 0, repeat: 0 };
    this.restartArmed = 0;
    this.hud = {};
    this.helpSource = null;
    this.mapDot = { x: 1e9, y: 1e9 };

    this._pb = makeBox();
    this._raise = makeBox();
    this._stand = makeBox();
    this._pp = makeBox();
    this._eb = makeBox();
    this._qb = makeBox();

    const $ = (s) => document.querySelector(s);
    this.dom = {
      boot: $('#boot'),
      start: $('#start-button'),
      cont: $('#continue-button'),
      titleSettings: $('#title-settings'),
      titleBest: $('#title-best'),
      titleHelp: $('#title-help'),
      rendererLabel: $('#renderer-label'),
      hud: $('#hud'),
      hpMeter: $('#hp-meter'),
      hpBar: $('#hp-bar'),
      hpText: $('#hp-text'),
      xpBar: $('#xp-bar'),
      level: $('#level-text'),
      objective: $('#objective-text'),
      toast: $('#toast'),
      bossHud: $('#boss-hud'),
      bossBar: $('#boss-bar'),
      minimap: $('#minimap'),
      pause: $('#pause-button'),
      pausePanel: $('#pause-panel'),
      pauseMap: $('#pause-map'),
      pauseHelp: $('#pause-help'),
      mapRoom: $('#map-room'),
      mapStats: $('#map-stats'),
      resume: $('#resume-button'),
      pauseSettings: $('#pause-settings'),
      retry: $('#retry-button'),
      restart: $('#restart-button'),
      quit: $('#quit-button'),
      completePanel: $('#complete-panel'),
      missionStats: $('#mission-stats'),
      completeNote: $('#complete-note'),
      replay: $('#replay-button'),
      completeTitle: $('#complete-title'),
    };
    this.panels = { title: this.dom.boot, pause: this.dom.pausePanel, complete: this.dom.completePanel };
  }

  init() {
    this.makeScene();
    this.makeMaterials();
    this.makeGeometries();
    this.buildWorld();
    this.makePlayer();
    this.spawnActors();
    this.buildFx();
    this.buildMaps();
    this.setupUI();
    this.post = createPost(this.kit, this.scene, this.camera, {
      bloom: { strength: matchMedia('(pointer: coarse)').matches ? 0.42 : 0.58, radius: 0.18, threshold: 0.76 },
    });
    this.kit.onResize(() => this.applyProjection());

    this.resetRun(null);
    this.showTitle();

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.started && !this.complete) this.setPaused(true);
    });
    this.kit.onPause((p) => (p ? this.audioSuspend() : this.audioResume()));
    this.input.onSourceChange(() => this.refreshHelp());
    // Audio may only start inside a user gesture; a gamepad press is not one, so any later tap or key unlocks it.
    const unlock = () => this.unlockAudio();
    addEventListener('pointerdown', unlock, true);
    addEventListener('keydown', unlock, true);

    this.kit.start((dt) => this.frame(dt));
  }

  // ---------------------------------------------------------------- scene

  makeScene() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x02080c);
    this.scene.fog = new THREE.Fog(0x02080c, 18, 58);

    this.camera = new THREE.OrthographicCamera(-10, 10, 8, -8, 0.1, 100);
    this.camera.position.set(2, 3.5, 24);
    this.camera.lookAt(2, 3.5, 0);

    this.staticGroup = new THREE.Group();
    this.staticGroup.name = 'STATIC_WORLD';
    this.dynamicGroup = new THREE.Group();
    this.dynamicGroup.name = 'ACTORS';
    this.fxGroup = new THREE.Group();
    this.fxGroup.name = 'FX';
    this.scene.add(this.staticGroup, this.dynamicGroup, this.fxGroup);

    const r = this.renderer;
    r.toneMapping = THREE.ACESFilmicToneMapping;
    r.toneMappingExposure = 1.12;
    r.shadowMap.enabled = true;
    r.shadowMap.type = THREE.PCFShadowMap;

    const hemi = new THREE.HemisphereLight(0x8fe9db, 0x18080f, 1.55);
    hemi.position.set(0, 10, 8);
    this.scene.add(hemi);

    // The sun keeps its direction and follows the camera, so every room gets shadows (it used to cover the first room only).
    const sun = new THREE.DirectionalLight(0xc8fff2, 2.45);
    sun.castShadow = true;
    this.kit.shadow(sun, 1024);
    Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 22, bottom: -22, near: 0.5, far: 70 });
    sun.shadow.camera.updateProjectionMatrix();
    sun.shadow.bias = -0.0005;
    sun.shadow.radius = 2;
    this.scene.add(sun, sun.target);
    this.sun = sun;
    this.sunOffset = new THREE.Vector3(-10, 20, 18);
    const z = this.sunOffset.clone().normalize();
    this.sunAxisX = new THREE.Vector3(0, 1, 0).cross(z).normalize();
    this.sunAxisY = z.clone().cross(this.sunAxisX).normalize();

    this.addRoomLight(10, 5, 0x49ffd0, 25, 11);
    this.addRoomLight(35, -1, 0x658bff, 30, 13);
    this.addRoomLight(59, -9, 0x55ffc3, 26, 12);
    this.addRoomLight(86, -10, 0xffa34e, 24, 9);
    this.addRoomLight(111, -8, 0xff5c70, 38, 13);
    this.addRoomLight(134, -9, 0x60ffe0, 30, 10);
    // Drowned Cistern.
    this.addRoomLight(14, -9.5, 0x7dff9a, 22, 12);
    this.addRoomLight(-3, -9.5, 0x60ffe0, 20, 10);
  }

  addRoomLight(x, y, color, intensity, distance) {
    const light = new THREE.PointLight(color, intensity, distance, 2);
    light.position.set(x, y, 5);
    this.scene.add(light);
    this.lights.push({ light, base: intensity, phase: x * 0.31 });
  }

    this.addSign(133.5, -10.3, 'LIFT 7', 'EXTRACTION', 0x64ffd6);
    this.addSign(31.2, -10.1, 'SPINE BASE', '← CISTERN', 0x9dff6a);
    this.addSign(23, -9.6, 'DROWNED CISTERN', 'BRINE BURNS', 0x9dff6a);
    this.addSign(-4.8, -8.6, 'SHRINE', 'SPRING COIL', 0x64ffd6);

    this.startDoor = this.addDoor('hatch', 28.15, 2.55, 3.6, {
      name: 'SHAFT HATCH', color: 0x59ffd2, destructible: true, hp: 28,
    });
    this.arenaDoor = this.addDoor('arena', 98.2, -10.8, 5.7, {
      name: 'COURT SEAL', color: 0xff8058, destructible: false,
    });
    this.exitDoor = this.addDoor('exit', 125.6, -10.8, 5.7, {
      name: 'LIFT SEAL', color: 0x5fffd3, destructible: false,
    });
    this.valveDoor = this.addDoor('valve', 27.4, -11.15, 5.7, {
      name: 'CISTERN VALVE', color: 0x9dff6a, destructible: true, hp: 40,
    });

    // Background floor glows.
    for (const [x, y, w, color] of [
      [6, 0.08, 12, 0x4dffd0], [36, -13.92, 8, 0x658bff], [58, -13.92, 12, 0x4dffd0],
      [87, -13.92, 10, 0xffa557], [111, -13.92, 16, 0xff5b6b], [133, -13.92, 8, 0x4dffd0],
      [10, -13.92, 8, 0x7dff9a], [-4.5, -13.92, 6, 0x4dffd0],
    ]) this.addGlowStrip(x, y, w, color);

    this.finalizeStatic();
  }

  /** Queue a transformed copy of `geometry` (placed by _o) for one merged mesh per material. */
  addStaticGeometry(geometry, material, cast, receive) {
    _o.updateMatrix();
    const g = (geometry.index ? geometry.toNonIndexed() : geometry.clone()).applyMatrix4(_o.matrix);
    const key = `${material.id}:${cast ? 1 : 0}${receive ? 1 : 0}`;
    let bucket = this.staticBuckets.get(key);
    if (!bucket) this.staticBuckets.set(key, (bucket = { material, cast, receive, geos: [] }));
    bucket.geos.push(g);
  }

  staticBox(x, y, z, w, h, d, material, cast = false, receive = false) {
    _o.position.set(x, y, z);
    _o.rotation.set(0, 0, 0);
    _o.scale.set(w, h, d);
    this.addStaticGeometry(this.geo.box, material, cast, receive);
  }

  /** The level never moves: merge it into a handful of meshes (one per material) instead of hundreds. */
  finalizeStatic() {
    for (const bucket of this.staticBuckets.values()) {
      const merged = mergeGeometries(bucket.geos, false);
      const parts = merged ? [merged] : bucket.geos;
      for (const g of parts) {
        const mesh = new THREE.Mesh(g, bucket.material);
        mesh.castShadow = bucket.cast;
        mesh.receiveShadow = bucket.receive;
        mesh.matrixAutoUpdate = false;
        this.staticGroup.add(mesh);
      }
      if (merged) for (const g of bucket.geos) g.dispose();
    }
    this.staticBuckets.clear();
  }

  addSolid(x, y, w, h, material, options = {}) {
    this.staticBox(x, y, options.z ?? -0.35, w, h, options.depth || 4, material, options.castShadow ?? true, options.receiveShadow ?? true);
    const solid = {
      x, y, w, h,
      minX: x - w / 2, maxX: x + w / 2,
      minY: y - h / 2, maxY: y + h / 2,
      oneWay: !!options.oneWay,
      door: null,
      name: options.name || 'solid',
    };
    this.solids.push(solid);
    return solid;
  }

  addPlatform(x, y, w) {
    return this.addSolid(x, y, w, 0.55, this.mat.metal, { oneWay: true, depth: 3, name: 'One-way platform' });
  }

  ribMat(color) {
    let m = this.ribMats.get(color);
    if (!m) {
      m = new THREE.MeshStandardMaterial({ color: 0x24373b, roughness: 0.5, metalness: 0.7, flatShading: true, emissive: color, emissiveIntensity: 0.1 });
      this.ribMats.set(color, m);
    }
    return m;
  }

  glowMat(color) {
    let m = this.glowMats.get(color);
    if (!m) {
      m = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 2.4, roughness: 0.25, metalness: 0.25 });
      this.glowMats.set(color, m);
    }
    return m;
  }

  addRib(x, y, h, color, horizontal = false) {
    this.staticBox(x, y, -1.7, horizontal ? h : 0.34, horizontal ? 0.34 : h, 0.5, this.ribMat(color));
    for (const s of [-1, 1]) {
      this.staticBox(
        x + (horizontal ? s * h * 0.5 : 0), y + (horizontal ? 0 : s * h * 0.5), -1.7,
        horizontal ? 0.55 : 0.8, horizontal ? 0.8 : 0.55, 0.8, this.mat.metal
      );
    }
  }

  addRail(x, y, w) {
    this.staticBox(x, y + 0.8, 1.2, w, 0.13, 0.13, this.mat.metal);
    for (let px = -w / 2; px <= w / 2 + 0.01; px += 2) this.staticBox(x + px, y + 0.38, 1.2, 0.12, 0.9, 0.12, this.mat.metal);
  }

  addGlowStrip(x, y, w, color) {
    this.staticBox(x, y, 1.65, w, 0.08, 0.18, this.glowMat(color));
  }

  addBrine(x, w) {
    const mesh = new THREE.Mesh(this.geo.box, this.mat.brine);
    mesh.scale.set(w - 0.04, 1.25, 4.02);
    mesh.position.set(x, -14.875, -0.35);
    mesh.renderOrder = 2;
    this.staticGroup.add(mesh);
    this.hazards.push({ minX: x - w / 2 + 0.05, maxX: x + w / 2 - 0.05, minY: -15.6, maxY: -14.35, x, w });
  }

  addSign(x, y, title, subtitle, color) {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 192;
    const ctx = c.getContext('2d');
    const hex = `#${_c.set(color).getHexString()}`;
    ctx.fillStyle = 'rgba(3,12,16,.92)';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.strokeStyle = hex;
    ctx.lineWidth = 8;
    ctx.strokeRect(8, 8, c.width - 16, c.height - 16);
    ctx.fillStyle = hex;
    ctx.font = '800 28px system-ui';
    ctx.fillText(title, 34, 66);
    ctx.fillStyle = '#e9fff8';
    ctx.font = '900 44px system-ui';
    ctx.fillText(subtitle, 34, 130);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.92 });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 1.68), mat);
    mesh.position.set(x, y, 1.72);
    this.staticGroup.add(mesh);
  }

  addDoor(id, x, y, h, { name, color, destructible, hp }) {
    const group = new THREE.Group();
    const glowMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 2.6, roughness: 0.28, metalness: 0.35 });
    const railGeo = new THREE.BoxGeometry(0.26, h + 1.1, 0.8);
    for (const sx of [-0.72, 0.72]) {
      const rail = new THREE.Mesh(railGeo, this.mat.doorFrame);
      rail.position.x = sx;
      group.add(rail);
    }
    const slab = new THREE.Mesh(new THREE.BoxGeometry(1.12, h, 0.55), glowMat);
    slab.castShadow = true;
    slab.receiveShadow = true;
    group.add(slab);
    group.position.set(x, y, 1.1);
    this.dynamicGroup.add(group);

    const door = {
      id, name, x, y, h, group, slab, glowMat,
      destructible, hp: hp ?? Infinity, maxHp: hp ?? Infinity,
      targetOpen: 0, openAmount: 0, flash: 0,
    };
    const solid = {
      x, y, w: 1.2, h,
      minX: x - 0.6, maxX: x + 0.6,
      minY: y - h / 2, maxY: y + h / 2,
      oneWay: false, door, name,
    };
    door.solid = solid;
    this.solids.push(solid);
    this.doors.push(door);
    return door;
  }

  setDoor(door, open) {
    door.targetOpen = door.openAmount = open ? 1 : 0;
    door.slab.position.y = door.openAmount * (door.h + 0.75);
  }

  // ---------------------------------------------------------------- actors

  makePlayer() {
    const root = new THREE.Group();
    const stand = new THREE.Group();
    root.add(stand);

    const suit = new THREE.MeshStandardMaterial({ color: 0x62ffd2, roughness: 0.42, metalness: 0.45, emissive: 0x0b5647, emissiveIntensity: 0.45, flatShading: true });
    const dark = new THREE.MeshStandardMaterial({ color: 0x152226, roughness: 0.5, metalness: 0.65, flatShading: true });
    const visor = new THREE.MeshStandardMaterial({ color: 0xffaa5b, roughness: 0.2, metalness: 0.15, emissive: 0xff6f2b, emissiveIntensity: 2.7, flatShading: true });

    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.05, 0.65), suit);
    torso.position.y = 0.08;

  addEnemy(g, e) {
    g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    this.dynamicGroup.add(g);
    Object.assign(e, { mesh: g, home: { x: e.x, y: e.y }, alive: true, t: 0, flash: 0, squash: 1, dir: e.dir ?? 1 });
    this.enemies.push(e);
    this.resetEnemy(e);
    return e;
  }

    const g = new THREE.Group();
    const body = new THREE.Mesh(this.geo.skitterBody, this.mat.enemy);
    body.position.y = 0.18;
    g.add(body);
    for (const sx of [-0.45, 0.45]) {
      const leg = new THREE.Mesh(this.geo.skitterLeg, this.mat.enemy2);
      leg.position.set(sx, -0.15, 0);
      g.add(leg);
    }
    return this.addEnemy(g, { type: 'skitter', x, y, z: 1.12, minX, maxX, hp: 26, maxHp: 26, w: 1.0, h: 0.75, damage: 11, xp: 14 });
