  resetEnemy(e) {
    e.alive = true;
    e.hp = e.maxHp;
    e.x = e.home.x;
    e.y = e.home.y;
    e.t = Math.random() * 4;
    e.flash = 0;
    e.squash = 1;
    e.mesh.visible = true;
    e.mesh.rotation.set(0, 0, 0);
    if (e.type === 'skitter') e.dir = Math.random() > 0.5 ? 1 : -1;
    else if (e.type === 'mote') { e.dir = 1; e.originY = e.home.y; e.t = Math.random() * 6; }
    else if (e.type === 'turret') { e.fire = 0.8 + Math.random(); e.aim = e.dir > 0 ? 0 : Math.PI; e.pivot.rotation.z = e.aim; }
    else if (e.type === 'boss') { e.active = false; e.dir = -1; e.fire = 1.1; e.dash = 2.8; e.t = 0; e.core.scale.setScalar(1); }
    else if (e.type === 'hopper') { e.vx = 0; e.vy = 0; e.air = false; e.wait = 0.8 + Math.random(); e.dir = -1; }
    else if (e.type === 'polyp') { e.state = 'hang'; e.vy = 0; e.dir = 1; e.turn = 0; }
    e.mesh.position.set(e.x, e.y, e.z);
    this.applyEnemyScale(e);
  }

  /** Facing flip, hit punch and squash in one place, so they never fight over mesh.scale. */
  applyEnemyScale(e) {
    const s = 1 + e.flash * 1.6;
    const fx = e.type === 'skitter' || e.type === 'hopper' ? e.dir : 1;
    e.mesh.scale.set(fx * s * (2 - e.squash), s * e.squash, s);
  }

  spawnPickup(def) {
    const material = def.type === 'arc' ? this.mat.orange
      : def.type === 'health' ? this.mat.red
      : def.type === 'overclock' ? this.mat.purple
      : def.type === 'coil' ? this.mat.acid
      : this.mat.pickup;
    const group = new THREE.Group();
    const core = new THREE.Mesh(this.geo.pickupCore, material);
    group.add(core);
    const ring = new THREE.Mesh(this.geo.pickupRing, material);
    ring.rotation.x = Math.PI / 2;
    group.add(ring);
    group.position.set(def.x, def.y, 1.35);
    this.dynamicGroup.add(group);
    this.pickups.push({
      ...def, group, core, material,
      major: !!def.major, secret: !!def.secret,
      taken: false, phase: def.x * 0.27, room: roomAt(def.x, def.y)?.id || null,
    });
  }

  // ---------------------------------------------------------------- effects

  /**
   * Sparks are one InstancedMesh (kit.instanced, so it shares shaders) instead of a new Mesh and
   * BoxGeometry per spark; shots come from a small pool of meshes that share one geometry.
   */
  buildFx() {
    const cap = 320;
    this.fxMesh = this.kit.instanced(this.geo.box, new THREE.MeshBasicMaterial({ color: 0xffffff }), cap);
    this.fxMesh.setColorAt(0, _c.set(0xffffff));
    this.fxMesh.frustumCulled = false;
    this.fxMesh.count = 0;
    this.fxMesh.visible = false;
    this.fxGroup.add(this.fxMesh);
    this.parts = Array.from({ length: cap }, () => ({ x: 0, y: 0, z: 0, vx: 0, vy: 0, life: 0, size: 0, rot: 0, spin: 0, r: 1, g: 1, b: 1, grav: 8 }));
    this.pCount = 0;
    this.fxColors = new Map();
    this.shotPool = [];
    // Draw each shot material once, tiny, while the title shows, so the first shot doesn't stall on a shader compile.
    this.warm = [this.mat.cyan, this.mat.orange, this.mat.red].map((m) => this.takeShot(m, 0.001, 0, 0));
    this.warming = true;
  }

  takeShot(material, radius, x, y) {
    let m = this.shotPool.pop();
    if (!m) {
      m = new THREE.Mesh(this.geo.shot, material);
      this.fxGroup.add(m);
    }
    m.material = material;
    m.scale.setScalar(radius);
    m.position.set(x, y, 1.4);
    m.rotation.set(0, 0, 0);
    m.visible = true;
    return m;
  }

  releaseShot(m) {
    m.visible = false;
    this.shotPool.push(m);
  }

  endWarmup() {
    if (!this.warming) return;
    this.warming = false;
    for (const m of this.warm) this.releaseShot(m);
    this.warm = [];
  }

  fxColorOf(material) {
    let c = this.fxColors.get(material);
    if (!c) {
      c = new THREE.Color().copy(material.color).multiplyScalar(0.3);
      if (material.emissive) c.add(_c.copy(material.emissive).multiplyScalar(material.emissiveIntensity * 0.75));
      this.fxColors.set(material, c);
    }
    return c;
  }

  spawnParticle(x, y, z, vx, vy, life, size, color, grav = 8) {
    if (this.pCount >= this.parts.length) return;
    const q = this.parts[this.pCount++];
    q.x = x; q.y = y; q.z = z; q.vx = vx; q.vy = vy; q.life = life; q.size = size;
    q.rot = 0; q.spin = (Math.random() - 0.5) * 10; q.r = color.r; q.g = color.g; q.b = color.b; q.grav = grav;
  }

  spawnBurst(x, y, material, count, speed) {
    const color = this.fxColorOf(material);
    const n = Math.max(1, Math.round(count * this.kit.tier.detail));
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed * (0.35 + Math.random() * 0.65);
      this.spawnParticle(x, y, 1.5 + Math.random() * 0.35, Math.cos(a) * s, Math.sin(a) * s, 0.25 + Math.random() * 0.4, 0.06 + Math.random() * 0.12, color);
    }
  }

  updateParticles(dt) {
    for (let i = this.pCount - 1; i >= 0; i--) {
      const q = this.parts[i];
      q.life -= dt; q.vy -= q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.spin * dt;
      if (q.life <= 0) {
        this.pCount--;
        this.parts[i] = this.parts[this.pCount];
        this.parts[this.pCount] = q;
      }
    }
  }

  renderFx() {
    const mesh = this.fxMesh;
    const m = mesh.instanceMatrix.array;
    const col = mesh.instanceColor.array;
    let n = this.pCount;
    for (let i = 0; i < n; i++) {
      const q = this.parts[i];
      const s = q.size * clamp(q.life * 2.5, 0.05, 1);
      const c = Math.cos(q.rot) * s, sn = Math.sin(q.rot) * s;
      const o = i * 16;
      m[o] = c; m[o + 1] = sn; m[o + 2] = 0; m[o + 3] = 0;
      m[o + 4] = -sn; m[o + 5] = c; m[o + 6] = 0; m[o + 7] = 0;
      m[o + 8] = 0; m[o + 9] = 0; m[o + 10] = s; m[o + 11] = 0;
      m[o + 12] = q.x; m[o + 13] = q.y; m[o + 14] = q.z; m[o + 15] = 1;
      const k = i * 3;
      col[k] = q.r; col[k + 1] = q.g; col[k + 2] = q.b;
    }
    if (this.warming) {
      const cx = this.camera.position.x, cy = this.camera.position.y;
      for (const w of this.warm) w.position.set(cx, cy, 1.4);
      if (n === 0) {
        m.fill(0, 0, 16);
        m[0] = m[5] = m[10] = 0.001; m[12] = cx; m[13] = cy; m[14] = 1.4; m[15] = 1;
        n = 1;
      }
    }
    mesh.count = n;
    mesh.visible = n > 0;
    if (n > 0) {
      mesh.instanceMatrix.clearUpdateRanges();
      mesh.instanceMatrix.addUpdateRange(0, n * 16);
      mesh.instanceMatrix.needsUpdate = true;
      mesh.instanceColor.clearUpdateRanges();
      mesh.instanceColor.addUpdateRange(0, n * 3);
      mesh.instanceColor.needsUpdate = true;
    }
  }

  // ---------------------------------------------------------------- flow

  setupUI() {
    const d = this.dom;
    d.rendererLabel.textContent = `RENDERER: ${this.kit.backendLabel.toUpperCase()}`;
    d.start.addEventListener('click', () => this.startGame(null));
    d.cont.addEventListener('click', () => this.startGame(this.loadSave()));
    d.titleSettings.addEventListener('click', () => this.kit.menu.open());
    d.pause.addEventListener('click', () => this.setPaused(true));
    d.resume.addEventListener('click', () => this.setPaused(false));
    d.pauseSettings.addEventListener('click', () => this.kit.menu.open());
    d.retry.addEventListener('click', () => {
      this.setPaused(false);
      if (!this.dead) this.respawn();
    });
    d.restart.addEventListener('click', () => this.confirmRestart());
    d.quit.addEventListener('click', () => {
      this.saveProgress();
      this.showTitle();
    });
    d.replay.addEventListener('click', () => this.startGame(null));
    d.completeTitle.addEventListener('click', () => this.showTitle());
    for (const [name, panel] of Object.entries(this.panels)) {
      panel.addEventListener('focusin', (e) => {
        if (this.menu.name !== name) return;
        const i = this.menu.buttons.indexOf(e.target);
        if (i >= 0 && i !== this.menu.idx) {
          this.menu.idx = i;
          this.menu.buttons.forEach((b, j) => b.classList.toggle('is-focus', j === i));
        }
      });
    }
    this.refreshHelp();
  }

  loadSave() {
    const s = store.get(SAVE_KEY);
    if (!s || s.v !== 1 || !s.flags || !s.player || !Array.isArray(s.checkpoint)) return null;
    return s;
  }

  saveProgress() {
    if (!this.started || this.complete) return;
    const p = this.player;
    const flags = {};
    for (const k of SAVED_FLAGS) flags[k] = !!this.flags[k];
    const player = {};
    for (const k of SAVED_STATS) player[k] = p[k];
    store.set(SAVE_KEY, {
      v: 1,
      flags,
      player,
      taken: this.pickups.filter((i) => i.taken).map((i) => i.id),
      checkpoint: [p.checkpointX, p.checkpointY],
      kills: this.kills,
      deaths: this.deaths,
      elapsed: this.elapsed,
      visited: [...this.visited],
      room: ROOM_BY_ID.get(roomAt(p.checkpointX, p.checkpointY)?.id)?.name || '',
    });
  }

  setCheckpoint(x, y, quiet = false) {
    const p = this.player;
    p.checkpointX = x;
    p.checkpointY = y;
    this.beacon.position.set(x, y - p.standingHalfH + 0.05, 0.9);
    this.updateMap(true);
    this.saveProgress();
    if (!quiet) {
      this.toast('CHECKPOINT SAVED', 1.4);
      this.sfx('save');
    }
  }

  /** Put the whole run back to a fresh start, or to a saved checkpoint, without reloading the page. */
  resetRun(save) {
    for (let i = this.projectiles.length - 1; i >= 0; i--) this.removeProjectile(this.projectiles, i);
    for (let i = this.enemyProjectiles.length - 1; i >= 0; i--) this.removeProjectile(this.enemyProjectiles, i);
    this.pCount = 0;

    const flags = freshFlags();
    if (save) for (const k of SAVED_FLAGS) if (typeof save.flags[k] === 'boolean') flags[k] = save.flags[k];
    this.flags = flags;

    const p = this.player;
    Object.assign(p, {
      maxHp: 100, level: 1, xp: 0, nextXp: 60, damage: 10, fireCooldown: 0.24, armor: 1,
      vx: 0, vy: 0, facing: 1, invuln: 0, fireTimer: 0, coyote: 0, jumpBuffer: 0, airJumps: 0, grounded: false, anim: 0,
    });
    if (save) for (const k of SAVED_STATS) if (Number.isFinite(save.player[k])) p[k] = save.player[k];
    p.hp = p.maxHp;
    this.standUp();

    const taken = new Set(save?.taken || []);
    for (const item of this.pickups) {
      item.taken = taken.has(item.id);
      item.group.visible = !item.taken;
    }
    this.secretsFound = this.pickups.filter((i) => i.secret && i.taken).length;

    for (const d of this.doors) {
      d.hp = d.maxHp;
      d.flash = 0;
    }
    this.setDoor(this.startDoor, flags.startDoorOpen);
    this.setDoor(this.valveDoor, flags.valveOpen);
    this.setDoor(this.arenaDoor, true);
    this.setDoor(this.exitDoor, flags.bossDead);

    for (const e of this.enemies) this.resetEnemy(e);
    if (flags.bossDead) {
      this.boss.alive = false;
      this.boss.mesh.visible = false;
    }

    this.kills = Number.isFinite(save?.kills) ? save.kills : 0;
    this.deaths = Number.isFinite(save?.deaths) ? save.deaths : 0;
    this.elapsed = Number.isFinite(save?.elapsed) ? save.elapsed : 0;
    this.visited = new Set((save?.visited || []).filter((id) => ROOM_BY_ID.has(id)));
    this.room = null;

    const [cx, cy] = save && save.checkpoint.every(Number.isFinite) ? save.checkpoint : [0, 1.36];
    this.setCheckpoint(cx, cy, true);
    p.x = cx;
    p.y = cy;
    p.mesh.position.set(p.x, p.y, 1.25);
    p.mesh.visible = true;

    this.dead = false;
    this.complete = false;
    this.respawnTimer = 0;
    this.cameraShake = 0;
    this.snapCamera = true;
    this.ctl.jumpPressed = this.ctl.foldPressed = false;
    this.dom.bossHud.classList.add('hidden');
    this.setDroneTone(false);
    this.kit.touch?.setShown('fold', flags.foldCore);
    this.hud = {};
    this.objective = '';
    this.updateRoom();
    this.updateObjective(true);
    this.updateMap(true);
  }

  showTitle() {
    this.started = false;
    this.paused = false;
    this.complete = false;
    const d = this.dom;
    d.hud.classList.add('hidden');
    d.pausePanel.classList.add('hidden');
    d.completePanel.classList.add('hidden');
    d.boot.classList.remove('hidden');
    this.kit.touch?.suspend(true, 'game-menu');
    this.audioSuspend();

    const save = this.loadSave();
    d.cont.classList.toggle('hidden', !save);
    if (save) d.cont.textContent = `CONTINUE${save.room ? ` · ${save.room}` : ''}`;
    d.start.textContent = save ? 'START A NEW MISSION' : 'ENTER THE BURROW';
    d.start.className = save ? 'secondary' : 'primary';
    const best = store.get(BEST_KEY);
    d.titleBest.classList.toggle('hidden', !best?.time);
    if (best?.time) d.titleBest.textContent = `BEST CLEAR ${fmtTime(best.time)} · SECRETS ${best.secrets || 0}/${this.secretsTotal}`;
    this.refreshHelp();
    this.focusMenu('title');
  }

  startGame(save) {
    this.resetRun(save);
    if (!save) store.del(SAVE_KEY);
    this.started = true;
    this.paused = false;
    this.complete = false;
    this.restartArmed = 0;
    this.dom.restart.textContent = 'RESTART MISSION';
    const d = this.dom;
    d.boot.classList.add('hidden');
    d.pausePanel.classList.add('hidden');
    d.completePanel.classList.add('hidden');
    d.hud.classList.remove('hidden');
    this.kit.touch?.suspend(false, 'game-menu');
    this.menu.name = null;
    this.endWarmup();
    this.unlockAudio();
    this.audioResume();
    this.input.settle();
    const room = roomAt(this.player.x, this.player.y);
    this.toast(save ? `CHECKPOINT RESTORED · ${room?.name || 'BURROW'}` : 'SHOOT THE GLOWING HATCH • DESCEND TO THE RELAY', 3.2);
  }

  setPaused(value) {
    if (!this.started || this.complete || this.paused === value) return;
    this.paused = value;
    this.dom.pausePanel.classList.toggle('hidden', !value);
    this.kit.touch?.suspend(value, 'game-menu');
    if (value) {
      this.refreshHelp();
      this.updateMap(true);
      this.focusMenu('pause');
      this.audioSuspend();
    } else {
      this.restartArmed = 0;
      this.dom.restart.textContent = 'RESTART MISSION';
      this.menu.name = null;
      this.input.settle();
      this.audioResume();
    }
  }

  confirmRestart() {
    if (this.restartArmed > 0) {
      this.startGame(null);
      return;
    }
    this.restartArmed = 3;
    this.dom.restart.textContent = 'CONFIRM RESTART?';
  }

  finishMission() {
    if (this.complete) return;
    this.complete = true;
    const d = this.dom;
    d.hud.classList.add('hidden');
    this.kit.touch?.suspend(true, 'game-menu');
    const best = store.get(BEST_KEY) || {};
    const record = !best.time || this.elapsed < best.time;
    if (record) best.time = this.elapsed;
    best.secrets = Math.max(best.secrets || 0, this.secretsFound);
    best.clears = (best.clears || 0) + 1;
    store.set(BEST_KEY, best);
    store.del(SAVE_KEY);
    const majors = this.pickups.filter((i) => i.major);
    d.missionStats.innerHTML = `
      <div><span>TIME</span><b>${fmtTime(this.elapsed)}</b></div>
      <div><span>BEST</span><b>${fmtTime(best.time)}</b></div>
      <div><span>SUIT LEVEL</span><b>${this.player.level}</b></div>
      <div><span>HOSTILES</span><b>${this.kills}</b></div>
      <div><span>SECRETS</span><b>${this.secretsFound}/${this.secretsTotal}</b></div>
      <div><span>UPGRADES</span><b>${majors.filter((i) => i.taken).length}/${majors.length}</b></div>`;
    const losses = this.deaths === 0 ? 'NO SUIT LOSSES' : `${this.deaths} SUIT LOSS${this.deaths === 1 ? '' : 'ES'}`;
    d.completeNote.textContent = `${record ? 'NEW BEST TIME' : `BEST ${fmtTime(best.time)}`} · ${losses}`;
    d.completePanel.classList.remove('hidden');
    this.focusMenu('complete');
    this.sfx('level');
    this.input.rumble(0.6, 260);
  }

  // ---------------------------------------------------------------- menus (keyboard, gamepad and touch)

  activeMenu() {
    if (!this.started) return this.dom.boot.classList.contains('hidden') ? null : 'title';
    if (this.complete) return 'complete';
    if (this.paused) return 'pause';
    return null;
  }

  focusMenu(name) {
    const panel = this.panels[name];
    this.menu.name = name;
    this.menu.buttons = [...panel.querySelectorAll('button')].filter((b) => !b.classList.contains('hidden'));
    this.menu.idx = 0;
    this.menu.dir = 0;
    this.menu.repeat = 0;
    this.highlight();
  }

  highlight() {
    const { buttons, idx } = this.menu;
    buttons.forEach((b, i) => b.classList.toggle('is-focus', i === idx));
    const b = buttons[idx];
    if (!b) return;
    b.focus({ preventScroll: true });
    // Short screens scroll the panel: keep the highlighted button in view (without scrolling the page).
    const panel = this.panels[this.menu.name];
    if (panel && panel.scrollHeight > panel.clientHeight) {
      const top = b.offsetTop, bottom = top + b.offsetHeight;
      if (top < panel.scrollTop) panel.scrollTop = top - 12;
      else if (bottom > panel.scrollTop + panel.clientHeight) panel.scrollTop = bottom - panel.clientHeight + 12;
    }
  }

  updateMenu(name, dt) {
    if (this.menu.name !== name) this.focusMenu(name);
    if (this.restartArmed > 0) {
      this.restartArmed -= dt;
      if (this.restartArmed <= 0) this.dom.restart.textContent = 'RESTART MISSION';
    }
    const inp = this.input;
    const n = this.menu.buttons.length;
    if (!n) return;
    const mv = inp.vector('move');
    const dir = mv.y > 0.55 ? -1 : mv.y < -0.55 ? 1 : mv.x > 0.55 ? 1 : mv.x < -0.55 ? -1 : 0;
    this.menu.repeat -= dt;
    if (dir !== 0 && (dir !== this.menu.dir || this.menu.repeat <= 0)) {
      this.menu.repeat = dir === this.menu.dir ? 0.14 : 0.42;
      this.menu.idx = (this.menu.idx + dir + n) % n;
      this.highlight();
      this.sfx('tick');
    }
    this.menu.dir = dir;
    if (inp.pressed('jump') || inp.pressed('confirm')) this.menu.buttons[this.menu.idx]?.click();
    else if (name === 'pause' && (inp.pressed('fold') || inp.pressed('pause') || inp.pressed('map'))) this.setPaused(false);
  }

  refreshHelp() {
    const src = HELP[this.input.source] ? this.input.source : 'keyboard';
    if (src === this.helpSource) return;
    this.helpSource = src;
    this.dom.pauseHelp.innerHTML = HELP[src].map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join('');
    this.dom.titleHelp.textContent = HINTS[src];
  }

  // ---------------------------------------------------------------- audio

  unlockAudio() {
    if (!this.audio) {
      const ua = navigator.userActivation;
      if (ua && !ua.isActive && !ua.hasBeenActive) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.audio = new AC();
        const master = this.audio.createGain();
        master.gain.value = 0.09;
        master.connect(this.audio.destination);
        this.audioMaster = master;

        const droneGain = this.audio.createGain();
        droneGain.gain.value = 0.045;
        const filter = this.audio.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 420;
        droneGain.connect(filter);
        filter.connect(master);
        const a = this.audio.createOscillator();
        const b = this.audio.createOscillator();
        a.type = 'sawtooth'; b.type = 'triangle'; a.frequency.value = 43; b.frequency.value = 64.5;
        a.connect(droneGain); b.connect(droneGain); a.start(); b.start();
        this.drone = { a, b, gain: droneGain, filter };
        this.setDroneTone(this.flags.bossStarted && !this.flags.bossDead);
      } catch {
        this.audio = null;
        return;
      }
    }
    if (this.wantAudio()) this.audioResume();
    else this.audioSuspend();
  }

  wantAudio() {
    return this.started && !this.paused && !this.complete && !this.kit.paused;
  }

  audioSuspend() {
    if (this.audio?.state === 'running') this.audio.suspend().catch(() => {});
  }

  audioResume() {
    if (this.audio && this.audio.state === 'suspended' && this.wantAudio()) this.audio.resume().catch(() => {});
  }

  /** The drone opens up while the Warden fight runs. */
  setDroneTone(fight) {
    if (!this.drone) return;
    const now = this.audio.currentTime;
    this.drone.filter.frequency.setTargetAtTime(fight ? 980 : 420, now, 0.6);
    this.drone.gain.gain.setTargetAtTime(fight ? 0.06 : 0.045, now, 0.6);
    this.drone.b.frequency.setTargetAtTime(fight ? 69 : 64.5, now, 0.6);
  }

  sfx(kind) {
    if (!this.audio || this.audio.state !== 'running') return;
    const now = this.audio.currentTime;
    const osc = this.audio.createOscillator();
    const gain = this.audio.createGain();
    osc.connect(gain);
    gain.connect(this.audioMaster);
    const p = {
      shoot: [220, 440, 0.055, 'square', 0.12],
      jump: [130, 240, 0.10, 'square', 0.10],
      jump2: [190, 460, 0.12, 'triangle', 0.12],
      hit: [90, 52, 0.10, 'sawtooth', 0.16],
      pickup: [440, 880, 0.18, 'triangle', 0.14],
      level: [330, 990, 0.24, 'triangle', 0.16],
      door: [75, 160, 0.22, 'square', 0.10],
      hurt: [150, 68, 0.12, 'sawtooth', 0.15],
      splash: [320, 80, 0.2, 'sawtooth', 0.12],
      drop: [520, 150, 0.22, 'square', 0.07],
      save: [520, 1040, 0.22, 'sine', 0.12],
      tick: [660, 700, 0.03, 'square', 0.04],
      boss: [58, 38, 0.32, 'sawtooth', 0.18],
    }[kind] || [220, 180, 0.08, 'square', 0.1];
    osc.type = p[3];
    osc.frequency.setValueAtTime(p[0], now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, p[1]), now + p[2]);
    gain.gain.setValueAtTime(p[4], now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + p[2]);
    osc.start(now);
    osc.stop(now + p[2] + 0.02);
  }

  // ---------------------------------------------------------------- frame

  frame(rawDt) {
    const dt = Math.min(rawDt, 0.1);
    const menu = this.activeMenu();
    if (menu) this.updateMenu(menu, dt);
    else if (this.started && !this.paused && !this.complete) this.handleGameInput(dt);

    this.animateAmbient(dt);
    if (this.started && !this.paused && !this.complete) {
      this.elapsed += dt;
      // Sub-steps keep the hand-written collisions stable on slow frames without slowing the game down.
      const steps = Math.max(1, Math.ceil(dt / 0.034));
      const h = dt / steps;
      for (let i = 0; i < steps && !this.complete && !this.paused; i++) this.update(h);
    }
    this.updateCamera(dt);
    this.updateSun();
    this.updateUI(dt);
    this.renderFx();
    this.post.render();
  }

  handleGameInput(dt) {
    const inp = this.input;
    if (inp.pressed('pause') || inp.pressed('map')) {
      this.setPaused(true);
      return;
    }
    const mv = inp.vector('move');
    this.ctl.move = Math.abs(mv.x) > 0.2 ? clamp(mv.x / 0.7, -1, 1) : 0;
    this.ctl.aimY = mv.y;
    if (inp.pressed('jump')) this.ctl.jumpPressed = true;
    if (inp.pressed('fold')) this.ctl.foldPressed = true;
    this.ctl.fire = inp.down('fire');

    const wheel = inp.zoom();
    if (wheel) this.cameraZoom = clamp(this.cameraZoom - wheel * 0.08, 0.78, 1.34);
    const zv = (inp.down('zoomOut') ? 1 : 0) - (inp.down('zoomIn') ? 1 : 0);
    if (zv) this.cameraZoom = clamp(this.cameraZoom + zv * 0.9 * dt, 0.78, 1.34);
  }

  animateAmbient(dt) {
    this.clock += dt;
    const t = this.clock;
    for (const l of this.lights) l.light.intensity = l.base * (0.93 + Math.sin(t * 1.7 + l.phase) * 0.07);
    for (const p of this.pickups) {
      if (p.taken) continue;
      p.group.rotation.y += dt * 1.6;
      p.group.rotation.z += dt * 0.7;
      p.group.position.y = p.y + Math.sin(t * 2.3 + p.phase) * 0.12;
    }
    for (const d of this.doors) {
      d.openAmount = damp(d.openAmount, d.targetOpen, 8, dt);
      d.slab.position.y = d.openAmount * (d.h + 0.75);
      d.flash = Math.max(0, d.flash - dt * 3);
      // The hit flash used to be overwritten by this pulse on the same frame; now it adds on top.
      d.glowMat.emissiveIntensity = 2.1 + Math.sin(t * 5 + d.x) * 0.45 + d.flash * 10;
    }
    this.mat.brine.emissiveIntensity = 1.2 + Math.sin(t * 2.2) * 0.25;
    this.beacon.rotation.y += dt * 1.2;
  }

  update(dt) {
    if (this.dead) {
      this.respawnTimer -= dt;
      this.updateParticles(dt);
      if (this.respawnTimer <= 0) this.respawn();
      return;
    }
    this.updatePlayer(dt);
    this.updateEnemies(dt);
    this.updateProjectiles(dt);
    this.updatePickups();
    this.updateBubbles(dt);
    this.updateParticles(dt);
    this.updateMission();
  }

  updatePlayer(dt) {
    const p = this.player;
    const move = this.ctl.move;
    const aimY = this.ctl.aimY;

    const accel = p.grounded ? 34 : 24;
    const maxSpeed = p.folded ? 8.0 : 7.0;
    if (Math.abs(move) > 0.05) {
      p.vx += move * accel * dt;
      p.facing = move > 0 ? 1 : -1;
    } else {
      const friction = p.grounded ? 30 : 8;
      p.vx = damp(p.vx, 0, friction, dt);
    }
    p.vx = clamp(p.vx, -maxSpeed, maxSpeed);

    p.coyote = p.grounded ? 0.11 : Math.max(0, p.coyote - dt);
    p.jumpBuffer = Math.max(0, p.jumpBuffer - dt);
    const pressed = this.ctl.jumpPressed;
    this.ctl.jumpPressed = false;
    if (pressed) p.jumpBuffer = 0.13;
    if (p.jumpBuffer > 0 && p.coyote > 0 && !p.folded) {
      p.vy = 11.5; p.grounded = false; p.coyote = 0; p.jumpBuffer = 0;
      this.sfx('jump');
    } else if (pressed && !p.folded && this.flags.springCoil && p.airJumps > 0 && !p.grounded) {
      // Spring Coil: one extra jump in mid-air.
      p.airJumps--;
      p.vy = 11.5;
      p.jumpBuffer = 0;
      this.spawnBurst(p.x, p.y - p.halfH, this.mat.acid, 7, 4);
      this.sfx('jump2');
    }

    if (this.ctl.foldPressed) {
      this.ctl.foldPressed = false;
      if (!this.flags.foldCore) this.toast('FOLD CORE NOT INSTALLED', 1.3);
      else this.toggleFold();
    }

    p.vy += -27 * dt;
    p.vy = Math.max(p.vy, -16);

    const wasGrounded = p.grounded;
    const fallSpeed = p.vy;
    const oldBottom = p.y - p.halfH;
    p.x += p.vx * dt;
    this.resolvePlayerHorizontal(oldBottom);
    p.y += p.vy * dt;
    this.resolvePlayerVertical(oldBottom);
    if (p.grounded) {
      p.airJumps = 1;
      if (!wasGrounded && fallSpeed < -12) this.spawnBurst(p.x, p.y - p.halfH + 0.05, this.mat.metal, 4, 2.4);
    }

    if (p.y < this.world.minY - 4) this.damagePlayer(999, { fatal: true });

    // Brine burns and bounces the suit back up.
    if (!this.dead && p.invuln <= 0) {
      const pb = setBox(this._pb, p.x, p.y, p.halfW, p.halfH);
      for (const hz of this.hazards) {
        if (overlap(pb, hz)) {
          this.damagePlayer(9, { bounce: true });
          this.spawnBurst(p.x, hz.maxY, this.mat.acid, 8, 4);
          break;
        }
      }
    }
    if (this.dead) return;

    p.fireTimer = Math.max(0, p.fireTimer - dt);
    if (this.ctl.fire && p.fireTimer <= 0) {
      this.firePlayerShot(aimY);
      p.fireTimer = p.fireCooldown;
    }

    p.invuln = Math.max(0, p.invuln - dt);
    p.mesh.visible = p.invuln > 0 ? Math.floor(p.invuln * 18) % 2 === 0 : true;

    p.anim += dt * (2 + Math.abs(p.vx) * 1.4);
    p.mesh.position.set(p.x, p.y, 1.25);
    p.mesh.scale.x = p.facing;
    p.legL.rotation.z = Math.sin(p.anim) * 0.35 * clamp(Math.abs(p.vx) / 4, 0, 1);
    p.legR.rotation.z = -p.legL.rotation.z;
    p.foldMesh.rotation.z += p.folded ? p.vx * dt * -1.5 : 0;
    p.arm.rotation.z = aimY > 0.45 ? Math.PI * 0.34 : aimY < -0.45 ? -Math.PI * 0.26 : 0;
  }

  solidActive(s) {
    return !s.door || s.door.openAmount < 0.78;
  }

  /** Does `box` overlap a solid (not counting one-way platforms or `except`)? */
  blocked(box, except = null) {
    for (const o of this.solids) if (o !== except && !o.oneWay && this.solidActive(o) && overlap(box, o)) return true;
    return false;
  }

  resolvePlayerHorizontal(oldBottom) {
    const p = this.player;
    const b = setBox(this._pb, p.x, p.y, p.halfW, p.halfH);
    for (const s of this.solids) {
      if (!this.solidActive(s) || s.oneWay || !overlap(b, s)) continue;
      const rise = s.maxY - oldBottom;
      if (p.grounded && rise > 0 && rise <= 0.48) {
        const raised = setBox(this._raise, p.x, p.y + rise + 0.015, p.halfW, p.halfH);
        if (!this.blocked(raised, s)) {
          p.y += rise + 0.015;
          setBox(b, p.x, p.y, p.halfW, p.halfH);
          continue;
        }
      }
      if (p.vx > 0) p.x = s.minX - p.halfW - 0.001;
      else if (p.vx < 0) p.x = s.maxX + p.halfW + 0.001;
      p.vx = 0;
      setBox(b, p.x, p.y, p.halfW, p.halfH);
    }
    p.x = clamp(p.x, this.world.minX + p.halfW, this.world.maxX - p.halfW);
  }

  resolvePlayerVertical(oldBottom) {
    const p = this.player;
    p.grounded = false;
    const b = setBox(this._pb, p.x, p.y, p.halfW, p.halfH);
    for (const s of this.solids) {
      if (!this.solidActive(s) || !overlap(b, s)) continue;
      if (s.oneWay) {
        if (p.vy > 0 || oldBottom < s.maxY - 0.16) continue;
        p.y = s.maxY + p.halfH + 0.001;
        p.vy = 0; p.grounded = true;
        setBox(b, p.x, p.y, p.halfW, p.halfH);
        continue;
      }
      if (p.vy <= 0 && oldBottom >= s.maxY - 0.24) {
        p.y = s.maxY + p.halfH + 0.001;
        p.vy = 0; p.grounded = true;
      } else if (p.vy > 0) {
        p.y = s.minY - p.halfH - 0.001;
        p.vy = 0;
      } else {
        const down = Math.abs(b.minY - s.maxY);
        const up = Math.abs(b.maxY - s.minY);
        if (down < up) { p.y = s.maxY + p.halfH + 0.001; p.grounded = true; }
        else p.y = s.minY - p.halfH - 0.001;
        p.vy = 0;
      }
      setBox(b, p.x, p.y, p.halfW, p.halfH);
    }
  }

  standUp() {
    const p = this.player;
    p.folded = false;
    p.halfH = p.standingHalfH;
    p.stand.visible = true;
    p.foldMesh.visible = false;
  }

  toggleFold() {
    const p = this.player;
    if (p.folded) {
      const standing = setBox(this._stand, p.x, p.y + (p.standingHalfH - p.foldedHalfH), p.halfW, p.standingHalfH);
      if (this.blocked(standing)) { this.toast('NOT ENOUGH CLEARANCE', 1.2); return; }
      p.y += p.standingHalfH - p.foldedHalfH;
      this.standUp();
    } else {
      p.y -= p.standingHalfH - p.foldedHalfH;
      p.halfH = p.foldedHalfH;
      p.folded = true;
      p.stand.visible = false;
      p.foldMesh.visible = true;
    }
    this.sfx('door');
  }

  firePlayerShot(aimY) {
    const p = this.player;
    let dx = p.facing, dy = 0;
    if (aimY > 0.45) { dx = p.facing * 0.58; dy = 0.82; }
    else if (aimY < -0.45 && !p.grounded) { dx = p.facing * 0.58; dy = -0.82; }
    const len = Math.hypot(dx, dy); dx /= len; dy /= len;
    const arc = this.flags.arcLens;
    const speed = arc ? 24 : 21;
    const material = arc ? this.mat.orange : this.mat.cyan;
    const x = p.x + dx * 0.9, y = p.y + 0.25 + dy * 0.35;
    const mesh = this.takeShot(material, arc ? 0.19 : 0.15, x, y);
    this.projectiles.push({ mesh, x, y, vx: dx * speed, vy: dy * speed, damage: p.damage + (arc ? 4 : 0), life: 1.1, radius: 0.18 });
    this.spawnBurst(x, y, material, 2, 2.5);
    this.sfx('shoot');
  }

  updateEnemies(dt) {
    const p = this.player;
    const pbox = setBox(this._pp, p.x, p.y, p.halfW, p.halfH);
    for (const e of this.enemies) {
      if (!e.alive) continue;
      if (e.type === 'boss' && !e.active) continue;
      e.t += dt;
      e.flash = Math.max(0, e.flash - dt);
      if (e.type === 'skitter') {
        e.x += e.dir * 1.75 * dt;
        if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
        if (e.x > e.maxX) { e.x = e.maxX; e.dir = -1; }
        e.mesh.position.x = e.x;
        e.mesh.rotation.z = Math.sin(e.t * 8) * 0.04;
      } else if (e.type === 'mote') {
        e.x += e.dir * 1.35 * dt;
        if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
        if (e.x > e.maxX) { e.x = e.maxX; e.dir = -1; }
        e.y = e.originY + Math.sin(e.t * 2.3) * 1.1;
        e.mesh.position.set(e.x, e.y, e.z);
        e.mesh.rotation.z += dt * 1.8;
      } else if (e.type === 'turret') {
        e.fire -= dt;
        const dx = p.x - e.x, dy = p.y - e.y;
        const inRange = Math.abs(dx) < 15 && Math.abs(dy) < 7;
        if (inRange) {
          const want = Math.atan2(dy, dx);
          let diff = want - e.aim;
          diff = Math.atan2(Math.sin(diff), Math.cos(diff));
          e.aim += diff * (1 - Math.exp(-6 * dt));
          e.pivot.rotation.z = e.aim;
        }
        if (inRange && e.fire <= 0) {
          this.fireEnemyShot(e.x + Math.cos(e.aim) * 0.6, e.y + 0.25 + Math.sin(e.aim) * 0.6, dx, dy, 8.3, 11);
          e.fire = 2.0 + Math.random() * 0.6;
        }
      } else if (e.type === 'hopper') {
        if (!e.air) {
          e.wait -= dt;
          e.squash = e.wait < 0.3 ? 0.72 + Math.max(0, e.wait) : damp(e.squash, 1, 10, dt);
          if (e.wait <= 0) {
            const dx = p.x - e.x;
            e.dir = Math.abs(dx) < 11 && Math.abs(p.y - e.y) < 6 ? (dx >= 0 ? 1 : -1) : Math.random() > 0.5 ? 1 : -1;
            e.vx = e.dir * 4.2;
            e.vy = 9.5;
            e.air = true;
            e.squash = 1.18;
          }
        } else {
          e.vy -= 27 * dt;
          e.x += e.vx * dt;
          e.y += e.vy * dt;
          if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); e.dir = 1; }
          if (e.x > e.maxX) { e.x = e.maxX; e.vx = -Math.abs(e.vx); e.dir = -1; }
          e.squash = damp(e.squash, 1, 6, dt);
          if (e.vy < 0 && e.y <= e.home.y) {
            e.y = e.home.y;
            e.air = false;
            e.vx = 0;
            e.wait = 1.1 + Math.random() * 0.9;
            e.squash = 0.75;
            this.spawnBurst(e.x, e.y - 0.3, this.mat.acid, 3, 2.5);
          }
        }
        e.mesh.position.set(e.x, e.y, e.z);
      } else if (e.type === 'polyp') {
        if (e.state === 'hang') {
          e.mesh.rotation.z = Math.sin(e.t * 3) * 0.12;
          if (Math.abs(p.x - e.x) < 1.9 && p.y < e.y && p.y > e.floorY - 3) {
            e.state = 'fall';
            e.vy = 0;
            this.sfx('drop');
          }
        } else if (e.state === 'fall') {
          e.vy -= 30 * dt;
          e.y += e.vy * dt;
          if (e.y <= e.floorY) {
            e.y = e.floorY;
            e.state = 'crawl';
            e.dir = p.x >= e.x ? 1 : -1;
            e.turn = 1.2;
            e.mesh.rotation.z = Math.PI; // spike up once it lands
            this.cameraShake = Math.max(this.cameraShake, 0.08);
            this.spawnBurst(e.x, e.y - 0.3, this.mat.purple, 5, 3);
          }
        } else {
          e.turn -= dt;
          if (e.turn <= 0) { e.dir = p.x >= e.x ? 1 : -1; e.turn = 1.2; }
          e.x += e.dir * 2.6 * dt;
          if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
          if (e.x > e.maxX) { e.x = e.maxX; e.dir = -1; }
          e.mesh.rotation.z = Math.PI + Math.sin(e.t * 10) * 0.08;
        }
        e.mesh.position.set(e.x, e.y, e.z);
      } else if (e.type === 'boss') {
        this.updateBoss(e, dt);
      }
      this.applyEnemyScale(e);
      if (p.invuln <= 0 && overlap(pbox, setBox(this._eb, e.x, e.y, e.w / 2, e.h / 2))) this.damagePlayer(e.damage, { fromX: e.x });
      if (this.dead) return;
    }
  }

  updateBoss(e, dt) {
    const p = this.player;
    const phase2 = e.hp < e.maxHp * 0.5;
    if (phase2 && !this.flags.phase2) {
      this.flags.phase2 = true;
      this.toast('WARDEN OVERCLOCKED', 1.6);
      this.sfx('boss');
      this.input.rumble(0.5, 220);
      this.cameraShake = Math.max(this.cameraShake, 0.3);
    }
    const speed = phase2 ? 3.8 : 2.6;
    e.x += e.dir * speed * dt;
    if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
    if (e.x > e.maxX) { e.x = e.maxX; e.dir = -1; }
    e.mesh.position.x = e.x;
    e.mesh.rotation.y = Math.sin(e.t * 1.9) * 0.16;
    e.core.scale.setScalar(1 + Math.sin(e.t * 7) * 0.08);

    e.fire -= dt;
    e.dash -= dt;
    if (e.fire <= 0) {
      const dx = p.x - e.x, dy = p.y - (e.y + 0.5);
      const base = Math.atan2(dy, dx);
      const spread = phase2 ? [-0.24, 0, 0.24] : [-0.12, 0.12];
      for (const s of spread) this.fireEnemyShot(e.x, e.y + 0.6, Math.cos(base + s), Math.sin(base + s), phase2 ? 9.5 : 8.2, phase2 ? 17 : 15);
      e.fire = phase2 ? 1.05 : 1.55;
      this.sfx('boss');
    }
    if (e.dash <= 0) {
      e.dir = p.x > e.x ? 1 : -1;
      e.x += e.dir * 1.0;
      e.dash = phase2 ? 2.2 : 3.3;
      this.cameraShake = Math.max(this.cameraShake, 0.13);
      this.input.rumble(0.25, 90);
    }
  }

  fireEnemyShot(x, y, dx, dy, speed, damage) {
    const len = Math.max(0.001, Math.hypot(dx, dy)); dx /= len; dy /= len;
    const mesh = this.takeShot(this.mat.red, 0.18, x, y);
    mesh.position.z = 1.45;
    this.enemyProjectiles.push({ mesh, x, y, vx: dx * speed, vy: dy * speed, damage, life: 3.0, radius: 0.2 });
  }

  updateProjectiles(dt) {
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const q = this.projectiles[i];
      q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt;
      q.mesh.position.set(q.x, q.y, 1.4); q.mesh.rotation.z += dt * 8;
      let remove = q.life <= 0;
      const pb = setBox(this._qb, q.x, q.y, q.radius, q.radius);

      if (!remove) {
        for (const d of this.doors) {
          if (!this.solidActive(d.solid) || !overlap(pb, d.solid)) continue;
          d.flash = 0.25;
          if (d.destructible) {
            d.hp -= q.damage;
            this.spawnBurst(q.x, q.y, d === this.valveDoor ? this.mat.acid : this.mat.cyan, 5, 5);
            if (d.hp <= 0 && d.targetOpen < 1) {
              d.targetOpen = 1;
              if (d === this.startDoor) this.flags.startDoorOpen = true;
              if (d === this.valveDoor) this.flags.valveOpen = true;
              this.sfx('door');
              this.input.rumble(0.35, 120);
              this.toast(`${d.name} OPEN`, 1.7);
              this.saveProgress();
            }
          }
          remove = true;
          break;
        }
      }

      if (!remove) {
        for (const s of this.solids) {
          if (s.door || s.oneWay || !this.solidActive(s)) continue;
          if (overlap(pb, s)) { remove = true; this.spawnBurst(q.x, q.y, this.mat.cyan, 2, 2); break; }
        }
      }

      if (!remove) {
        for (const e of this.enemies) {
          if (!e.alive || (e.type === 'boss' && !e.active)) continue;
          if (!overlap(pb, setBox(this._eb, e.x, e.y, e.w / 2, e.h / 2))) continue;
          e.hp -= q.damage;
          e.flash = e.type === 'boss' ? 0.05 : 0.12;
          remove = true;
          this.spawnBurst(q.x, q.y, e.type === 'boss' ? this.mat.red : this.mat.orange, 5, 5.5);
          this.sfx('hit');
          if (e.hp <= 0) this.killEnemy(e);
          break;
        }
      }
      if (remove) this.removeProjectile(this.projectiles, i);
    }

    const p = this.player;
    const pbox = setBox(this._pp, p.x, p.y, p.halfW, p.halfH);
    for (let i = this.enemyProjectiles.length - 1; i >= 0; i--) {
      const q = this.enemyProjectiles[i];
      q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt;
      q.mesh.position.set(q.x, q.y, 1.4); q.mesh.rotation.z += dt * 6;
      let remove = q.life <= 0;
      const qb = setBox(this._qb, q.x, q.y, q.radius, q.radius);
      if (!remove && !this.dead && overlap(qb, pbox)) {
        this.damagePlayer(q.damage, { fromX: q.x - q.vx });
        remove = true;
      }
      if (!remove) {
        for (const s of this.solids) {
          if (s.oneWay || !this.solidActive(s)) continue;
          if (overlap(qb, s)) { remove = true; break; }
        }
      }
      if (remove) this.removeProjectile(this.enemyProjectiles, i);
    }
  }

  removeProjectile(list, i) {
    this.releaseShot(list[i].mesh);
    list.splice(i, 1);
  }

  killEnemy(e) {
    e.alive = false;
    e.mesh.visible = false;
    this.kills++;
    const boss = e.type === 'boss';
    this.spawnBurst(e.x, e.y, boss ? this.mat.red : e.type === 'hopper' || e.type === 'polyp' ? this.mat.acid : this.mat.orange, boss ? 24 : 9, boss ? 9 : 6);
    this.input.rumble(boss ? 1 : 0.3, boss ? 450 : 80);
    this.gainXP(e.xp);
    if (boss) {
      this.flags.bossDead = true;
      this.exitDoor.targetOpen = 1;
      this.arenaDoor.targetOpen = 1;
      this.dom.bossHud.classList.add('hidden');
      this.setDroneTone(false);
      this.cameraShake = 0.45;
      this.setCheckpoint(104, -12.64, true);
      this.toast('RELAY WARDEN DOWN • EXTRACTION LIFT UNLOCKED', 3.2);
    }
  }

  damagePlayer(amount, { fatal = false, fromX = null, bounce = false } = {}) {
    const p = this.player;
    if (this.dead || this.complete) return;
    // A fall out of the world kills even while invulnerable (it used to keep falling until the blink ran out).
    if (!fatal && p.invuln > 0) return;
    p.hp -= fatal ? amount : Math.max(1, Math.round(amount * p.armor));
    p.invuln = 0.75;
    if (bounce) {
      p.vy = 9.5;
    } else {
      // Knock back away from whatever hit (it used to always push against the facing direction).
      const away = fromX == null ? -p.facing : p.x >= fromX ? 1 : -1;
      p.vx = away * 4.2;
      p.vy = 4.5;
    }
    this.cameraShake = Math.max(this.cameraShake, 0.22);
    this.sfx(bounce ? 'splash' : 'hurt');
    this.input.rumble(fatal ? 0.9 : 0.55, fatal ? 300 : 150);
    if (p.hp <= 0 || fatal) this.onDeath();
  }

  onDeath() {
    this.dead = true;
    this.deaths++;
    this.player.hp = 0;
    this.respawnTimer = 1.05;
    this.toast('SUIT SIGNAL LOST • REBUILDING AT CHECKPOINT', 1.2);
    this.spawnBurst(this.player.x, this.player.y, this.mat.cyan, 18, 8);
    this.player.mesh.visible = false;
  }

  respawn() {
    const p = this.player;
    this.dead = false;
    p.hp = p.maxHp;
    p.x = p.checkpointX; p.y = p.checkpointY; p.vx = 0; p.vy = 0; p.invuln = 1.2;
    p.jumpBuffer = 0; p.coyote = 0;
    this.ctl.jumpPressed = this.ctl.foldPressed = false;
    if (p.folded) this.standUp();
    p.mesh.position.set(p.x, p.y, 1.25);
    p.mesh.visible = true;
    for (let i = this.enemyProjectiles.length - 1; i >= 0; i--) this.removeProjectile(this.enemyProjectiles, i);
    for (let i = this.projectiles.length - 1; i >= 0; i--) this.removeProjectile(this.projectiles, i);
    if (this.flags.bossStarted && !this.flags.bossDead) {
      // The checkpoint sits outside the court. The seal used to stay shut with the Warden active,
      // locking the player out for good; now the encounter resets and walking in restarts it.
      this.flags.bossStarted = false;
      this.flags.phase2 = false;
      this.resetEnemy(this.boss);
      this.arenaDoor.targetOpen = 1;
      this.dom.bossHud.classList.add('hidden');
      this.setDroneTone(false);
    }
    this.toast('CHECKPOINT RESTORED', 1.5);
  }

  gainXP(amount) {
    const p = this.player;
    p.xp += amount;
    let leveled = false;
    while (p.xp >= p.nextXp) {
      p.xp -= p.nextXp;
      p.level++;
      p.nextXp = 60 + (p.level - 1) * 35;
      p.maxHp += 10;
      p.hp = Math.min(p.maxHp, p.hp + 24);
      p.damage += 1.5;
      leveled = true;
    }
    if (leveled) {
      this.toast(`SUIT LEVEL ${p.level} • ARMOR +10 • BOLT POWER UP`, 2.2);
      this.sfx('level');
    }
  }

  updatePickups() {
    const p = this.player;
    for (const item of this.pickups) {
      if (item.taken || dist2(p.x, p.y, item.x, item.y) > 1.55 ** 2) continue;
      item.taken = true;
      item.group.visible = false;
      this.sfx('pickup');
      this.input.rumble(0.35, 120);
      this.spawnBurst(item.x, item.y, item.material, 14, 7);
      if (item.secret) this.secretsFound++;
      if (item.type === 'fold') {
        this.flags.foldCore = true;
        this.kit.touch?.setShown('fold', true);
        this.setCheckpoint(71.5, -12.64, true);
        this.toast(`FOLD CORE INSTALLED • ${FOLD_PROMPT[this.input.source] || FOLD_PROMPT.keyboard} TO COMPACT`, 3.0);
      } else if (item.type === 'arc') {
        this.flags.arcLens = true;
        p.damage += 2;
        this.setCheckpoint(96.2, -12.64, true);
        this.toast('ARC LENS INSTALLED • BOLT DAMAGE INCREASED', 2.8);
      } else if (item.type === 'coil') {
        this.flags.springCoil = true;
        p.airJumps = 1;
        this.setCheckpoint(-2, -12.64, true);
        this.toast('SPRING COIL INSTALLED • JUMP AGAIN IN MID-AIR', 3.0);
      } else if (item.type === 'health') {
        p.maxHp += 20; p.hp = p.maxHp;
        this.toast('SECRET CAPACITOR • MAX SUIT +20', 2.2);
      } else if (item.type === 'overclock') {
        p.fireCooldown = 0.19;
        this.toast('SECRET COOLANT BYPASS • FIRE RATE UP', 2.2);
      } else if (item.type === 'plating') {
        p.armor = 0.8;
        this.toast('SECRET REFLEX PLATING • DAMAGE TAKEN −20%', 2.4);
      }
      this.updateMap(true);
      this.saveProgress();
    }
  }

  /** Ambient brine bubbles near the camera. */
  updateBubbles(dt) {
    this.bubbleTimer -= dt;
    if (this.bubbleTimer > 0) return;
    this.bubbleTimer = 0.22;
    const hz = this.hazards[(Math.random() * this.hazards.length) | 0];
    if (!hz || Math.abs(hz.x - this.camera.position.x) > 30) return;
    const color = this.fxColorOf(this.mat.acid);
    this.spawnParticle(hz.x + (Math.random() - 0.5) * hz.w * 0.9, hz.maxY - 0.05, 1.7, (Math.random() - 0.5) * 0.4, 0.8 + Math.random() * 0.6, 0.7 + Math.random() * 0.5, 0.06 + Math.random() * 0.06, color, -0.6);
  }

  updateMission() {
    const p = this.player;
    if (this.startDoor.targetOpen >= 1) this.flags.startDoorOpen = true;
    if (p.x > 29.5) this.flags.enteredShaft = true;
    if (!this.flags.shaftBottom && p.x > 28.5 && p.x < 44 && p.y < -10) {
      this.flags.shaftBottom = true;
      this.setCheckpoint(29.6, -12.64);
    }

    if (this.flags.arcLens && p.x > 101 && !this.flags.bossStarted && !this.flags.bossDead) {
      this.flags.bossStarted = true;
      this.boss.active = true;
      this.arenaDoor.targetOpen = 0;
      this.dom.bossHud.classList.remove('hidden');
      this.hud.boss = -1;
      this.toast('RELAY WARDEN ONLINE', 2.0);
      this.sfx('boss');
      this.setDroneTone(true);
      this.input.rumble(0.4, 200);
    }

    if (this.flags.bossDead && p.x > 133.2) this.finishMission();
    this.updateRoom();
    this.updateObjective();
  }

  updateRoom() {
    const p = this.player;
    const r = roomAt(p.x, p.y);
    if (!r || r.id === this.room) return;
    this.room = r.id;
    const first = !this.visited.has(r.id);
    this.visited.add(r.id);
    if (first && this.started) {
      if (this.toastTimer <= 0) this.toast(r.name, 1.6);
      this.saveProgress();
    }
    this.updateMap(true);
  }

  updateObjective(force = false) {
    let next;
    if (!this.flags.startDoorOpen) next = 'OPEN THE SHAFT HATCH';
    else if (!this.flags.foldCore) next = this.flags.enteredShaft ? 'RECOVER THE FOLD CORE' : 'DESCEND THE SPINE SHAFT';
    else if (!this.flags.arcLens) next = 'FOLD THROUGH THE SERVICE TUBE';
    else if (!this.flags.bossDead) next = this.flags.bossStarted ? 'DEFEAT THE RELAY WARDEN' : 'ENTER THE RELAY COURT';
    else next = 'REACH THE EXTRACTION LIFT';
    if (force || next !== this.objective) {
      this.objective = next;
      this.dom.objective.textContent = next;
    }
  }

  // ---------------------------------------------------------------- camera, light and HUD

  /** The visible world: 15.2 units tall, more on portrait screens so at least 13 units stay visible across. */
  viewSize() {
    const { width, height } = this.kit.size;
    const aspect = width / Math.max(1, height);
    const h = Math.max(15.2, 13 / aspect) * this.cameraZoom;
    this.view.h = h;
    this.view.w = h * aspect;
    return this.view;
  }

  applyProjection(v = this.viewSize()) {
    const c = this.camera;
    if (Math.abs(c.top * 2 - v.h) > 1e-4 || Math.abs(c.right * 2 - v.w) > 1e-4) {
      c.left = -v.w / 2; c.right = v.w / 2; c.top = v.h / 2; c.bottom = -v.h / 2;
      c.updateProjectionMatrix();
    }
  }

  updateCamera(dt) {
    const p = this.player;
    const v = this.viewSize();
    this.applyProjection(v);
    let tx = p.x + p.facing * 2.0;
    let ty = p.y + 1.0;
    if (this.flags.bossStarted && !this.flags.bossDead && p.x > 98) {
      tx = clamp((p.x + this.boss.x) * 0.5, 103, 117);
      ty = -7.8;
    }
    tx = clamp(tx, this.world.minX + v.w / 2, this.world.maxX - v.w / 2);
    ty = clamp(ty, this.world.minY + v.h / 2, this.world.maxY - v.h / 2);
    const cam = this.camera.position;
    if (this.snapCamera) {
      cam.x = tx;
      cam.y = ty;
      this.snapCamera = false;
    }
    const shake = this.cameraShake * (this.reducedMotion ? 0.3 : 1);
    this.cameraShake = Math.max(0, this.cameraShake - dt * 1.8);
    const sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    const sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    cam.x = damp(cam.x, tx, 5.5, dt) + sx;
    cam.y = damp(cam.y, ty, 5.5, dt) + sy;
    this.camera.lookAt(cam.x, cam.y, 0);
  }

  /** Keep the sun over the camera, snapped to whole shadow-map texels so shadow edges don't crawl. */
  updateSun() {
    const cx = this.camera.position.x, cy = this.camera.position.y;
    const ax = this.sunAxisX, ay = this.sunAxisY, sc = this.sun.shadow.camera;
    const tx = (sc.right - sc.left) / this.sun.shadow.mapSize.x;
    const ty = (sc.top - sc.bottom) / this.sun.shadow.mapSize.y;
    const px = cx * ax.x + cy * ax.y;
    const py = cx * ay.x + cy * ay.y;
    _v.set(cx, cy, 0).addScaledVector(ax, Math.round(px / tx) * tx - px).addScaledVector(ay, Math.round(py / ty) * ty - py);
    this.sun.target.position.copy(_v);
    this.sun.position.copy(_v).add(this.sunOffset);
  }

  updateUI(dt) {
    const p = this.player;
    const c = this.hud;
    const d = this.dom;
    const hp = clamp(p.hp / p.maxHp, 0, 1);
    if (hp !== c.hp) {
      c.hp = hp;
      d.hpBar.style.transform = `scaleX(${hp})`;
      d.hpMeter.classList.toggle('low', hp < 0.3);
    }
    const hpText = Math.max(0, Math.ceil(p.hp));
    if (hpText !== c.hpText) { c.hpText = hpText; d.hpText.textContent = hpText; }
    const xp = clamp(p.xp / p.nextXp, 0, 1);
    if (xp !== c.xp) { c.xp = xp; d.xpBar.style.transform = `scaleX(${xp})`; }
    if (p.level !== c.level) { c.level = p.level; d.level.textContent = p.level; }
    if (this.boss.active && this.boss.alive) {
      const b = clamp(this.boss.hp / this.boss.maxHp, 0, 1);
      if (b !== c.boss) { c.boss = b; d.bossBar.style.transform = `scaleX(${b})`; }
    }
    if (this.toastTimer > 0) {
      this.toastTimer -= dt;
      if (this.toastTimer <= 0) d.toast.classList.remove('show');
    }
    if (this.started && Math.abs(p.x - this.mapDot.x) + Math.abs(p.y - this.mapDot.y) > 0.6) this.updateMap(false);
  }

  toast(message, duration = 1.8) {
    this.dom.toast.textContent = message;
    this.dom.toast.classList.add('show');
    this.toastTimer = duration;
  }

  buildMaps() {
    this.maps = [this.makeMap(this.dom.pauseMap, 1), this.makeMap(this.dom.minimap, 1.6)];
  }

  makeMap(container, dotScale) {
    const NS = 'http://www.w3.org/2000/svg';
    const el = (tag, attrs) => {
      const n = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v));
      return n;
    };
    const svg = el('svg', { viewBox: '-11 -16 154 33', preserveAspectRatio: 'xMidYMid meet', role: 'img' });
    const rooms = new Map();
    for (const r of ROOMS) {
      const rect = el('rect', { x: r.minX, y: -r.maxY, width: r.maxX - r.minX, height: r.maxY - r.minY, rx: 0.8, class: 'room' });
      svg.append(rect);
      rooms.set(r.id, rect);
    }
    const items = new Map();
    for (const it of this.pickups) {
      const dot = el('circle', { cx: it.x, cy: -it.y, r: 1.1 * dotScale, class: it.major ? 'item major' : 'item' });
      svg.append(dot);
      items.set(it, dot);
    }
    const cp = el('circle', { cx: 0, cy: 0, r: 1.8 * dotScale, class: 'cp' });
    const me = el('circle', { cx: 0, cy: 0, r: 1.5 * dotScale, class: 'me' });
    svg.append(cp, me);
    container.append(svg);
    return { rooms, items, cp, me };
  }

  updateMap(full) {
    const p = this.player;
    this.mapDot.x = p.x;
    this.mapDot.y = p.y;
    for (const m of this.maps) {
      m.me.setAttribute('cx', p.x.toFixed(1));
      m.me.setAttribute('cy', (-p.y).toFixed(1));
      if (!full) continue;
      for (const [id, rect] of m.rooms) {
        rect.classList.toggle('visited', this.visited.has(id));
        rect.classList.toggle('current', id === this.room);
      }
      // Items show once their room has been explored, like a scan map.
      for (const [it, dot] of m.items) dot.style.display = !it.taken && it.room && this.visited.has(it.room) ? '' : 'none';
      m.cp.setAttribute('cx', p.checkpointX.toFixed(1));
      m.cp.setAttribute('cy', (-p.checkpointY).toFixed(1));
    }
    if (full) {
      this.dom.mapRoom.textContent = ROOM_BY_ID.get(this.room)?.name || 'UNCHARTED';
      const majors = this.pickups.filter((i) => i.major);
      this.dom.mapStats.textContent = `SECRETS ${this.secretsFound}/${this.secretsTotal} · UPGRADES ${majors.filter((i) => i.taken).length}/${majors.length} · ${fmtTime(this.elapsed)}`;
    }
  }
}

const kit = await boot({
  title: 'Neon Burrow',
  canvas: document.querySelector('#game'),
  gear: 'none', // Settings lives on the title screen and in the pause menu (and F9)
  accent: '#62ffd2',
  background: '#02070a',
  touch: { top: 'right', topOffset: 62 },
  input: {
    move: { type: 'vector', keys: 'wasd+arrows', gamepad: 'leftStick+dpad', touch: 'stick' },
    jump: { keys: ['Space'], gamepad: ['A'], touch: 'Jump' },
    fire: { keys: ['KeyJ', 'KeyF'], mouse: [0], gamepad: ['RT', 'X'], touch: 'Fire' },
    fold: { keys: ['KeyK', 'KeyL', 'KeyC', 'ShiftLeft', 'ShiftRight'], mouse: [2], gamepad: ['B', 'LT'], touch: 'Fold' },
    map: { keys: ['KeyM'], gamepad: ['Y', 'Back'], touch: { label: 'Map', slot: 'top' } },
    pause: { keys: ['Escape', 'KeyP'], gamepad: ['Start'], touch: { label: 'II', slot: 'top' } },
    confirm: { keys: ['Enter', 'NumpadEnter'] },
    zoomIn: { keys: ['Equal', 'NumpadAdd'], gamepad: ['RB'] },
    zoomOut: { keys: ['Minus', 'NumpadSubtract'], gamepad: ['LB'] },
  },
});

const game = new NeonBurrow(kit);
game.init();
globalThis.__NEON_BURROW__ = game;
</script>
