function drawRadar(){let x=W*.88,y=H*.74,r=48;ctx.fillStyle='#081c2c88';ctx.strokeStyle='#89c6cc66';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.moveTo(x,y-r);ctx.lineTo(x,y+r);ctx.stroke();for(let e of entities){if(['enemy','ace','turret','ring'].includes(e.type)){ctx.fillStyle=e.type==='ring'?'#ffe6a5':'#ff9a9d';ctx.fillRect(x+e.x/30*35-1,y+38-e.z/260*76,3,3)}}ctx.fillStyle='#baffff';ctx.beginPath();ctx.moveTo(x,y+29);ctx.lineTo(x-4,y+38);ctx.lineTo(x+4,y+38);ctx.fill();ctx.fillStyle='#a3c4ce';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText('THREAT SCAN',x,y+r+15)}
