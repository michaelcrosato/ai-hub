  const ids = roster.map(p => p.id).sort((a, b) => a - b), lanes = ids.map((_, i) => i), rng = AIHub.rng('lanes');
  for (let i = lanes.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)), t = lanes[i]; lanes[i] = lanes[j]; lanes[j] = t; }

let ses = null;
const grindBest = sim => Math.max(ses.grindBest, sim.grind ? sim.grind.dist : 0);
const livePlay = () => (U.play && U.play.ses === ses ? U.play : null);

function open(info) {
  const me = info.players.find(p => p.id === info.me) || { id: info.me, name: 'You' };
  const s = { info, me: { id: me.id, name: String(me.name || 'You').slice(0, 16), color: colorOf(me) }, roster: info.players.slice(), phase: 'ready', others: new Map(), all: new Map(), list: [],
    owner: {}, evq: [], picks: 0, pend: 0, tricks: 0, grindBest: 0, lastSend: -1e9, simAt: null, reported: false, over: null, sec: 99, clock: 0 };
  s.sk = skaterFor(s.me); s.deck = deckOf(s.me); s.spawn = spawnOf(s.me.id, s.roster);
  s.runOpts = { seed: Math.floor(AIHub.rng('sim' + s.me.id)() * 0xffff) + 1, clock: () => Math.max(0, AIHub.time()) / 1000 };
  for (const p of info.players) if (p.id !== s.me.id) { const o = new Puppet(p, s.roster); s.others.set(p.id, o); s.all.set(p.id, o); }
  s.list = [...s.others.values()];
  for (const ev of ['keydown', 'pointerdown']) addEventListener(ev, () => ready(), true);
  AIHub.on('start', () => { if (s.phase === 'ready' || s.phase === 'waiting') s.phase = 'countdown'; });
  AIHub.on('message', (data, from) => receive(data, from));
  AIHub.on('leave', ({ id }) => { if (s.others.delete(id)) { s.list = [...s.others.values()]; if (A.view) A.view.others = s.list; } });
  AIHub.on('time-up', () => timeUp());
  AIHub.on('end', e => end(e));
  return s;
}
// the ready gesture: any key, button, click or tap once the round is known (and the same touch wakes the sound)
function ready() {
  if (!ses || ses.phase !== 'ready') return;
  ses.phase = 'waiting'; AIHub.ready();
  const a = U.game.audio; try { a._init(); if (a.ctx && a.ctx.state !== 'running') a.ctx.resume().catch(() => {}); } catch (e) { /* no sound on this device */ }
  a.sfx('confirm');

// my skater to the others: 15 times a second, unreliable (the next sample replaces a lost one); with events in it (claims, the shed

  ses.lastSend = t;

  m.sc = Math.round(sim.score); m.bc = Math.round(sim.bestCombo); m.lg = Math.round(grindBest(sim)); m.pk = ses.picks;

function receive(data, from) {
  const o = ses && ses.all.get(from); if (!o || !data || typeof data !== 'object' || ses.over) return;
  if (data.t === 's') o.take(data);
  if (!Array.isArray(data.ev)) return;

  for (const e of data.ev) {
    if (!Array.isArray(e)) continue;

    else if (e[0] === 'g' && play && !play.run.secret) { const run = play.run; run.secret = true; run.lv.gate.solid = false; A.hud.banner('SIGNALS JAMMED', (o.name + ' opened the shed').toUpperCase(), C.teal); A.sound.event({ type: 'secret' }); }

// a pick-up has one owner: the earliest claim on the shared clock (the lower seat on a tie). A claim that loses gives its points back.
function claim(play, it, by, at) {

  if (prev && (prev.by === by || prev.at < at || (prev.at === at && prev.by < by))) return;
  ses.owner[it.id] = { by, at };
  if (by === ses.me.id) { ses.picks++; sim.score += ptsOf(it); return; }
  if (prev && prev.by === ses.me.id) { const o = ses.all.get(by); ses.picks--; sim.score -= ptsOf(it); A.hud.pop((o ? o.name : 'Someone').toUpperCase() + ' GOT THERE FIRST', C.red); }
  if (!it.gone) {

    if (it.type === 'smash') v.burst(it.x, it.y, it.z + 8, 30, [R.hex32('#b08a52'), R.hex32('#7c5a2c'), R.hex32('#d8b878')], 130, 2.4, it.z);

}
function statsOf(sim) { return { 'Best combo': Math.round(sim.bestCombo), 'Longest grind': meters(grindBest(sim)), 'Tricks landed': ses.tricks, 'Bails': sim.bails, 'Collectibles': ses.picks }; }
// awards are about this skater; "the most" is measured against what the others last said about themselves
function awardsOf(sim) {

  if (sim.bestCombo >= 2000 && top('best', sim.bestCombo)) out.push({ title: 'Combo king', detail: 'Best combo ' + U.fmt(sim.bestCombo) });
  if (g >= 180 && top('grindBest', g)) out.push({ title: 'Grind lord', detail: 'Longest grind ' + meters(g) });
  if (ses.picks >= 3 && top('picks', ses.picks)) out.push({ title: 'Collector', detail: ses.picks + ' pickups in the yard' });
  if (!sim.bails && sim.score >= 1000) out.push({ title: 'Clean run', detail: 'Not one bail all run' });

const H = U.hub = {
  ses: null,
  // boot: ask the hub for the round. No answer within 10 s means there is no hub after all: the game as it always was
  boot(game) {
    AIHub.connect({ mode: 'race', seats: [1, 4] }).then(info => {
      if (!info) { game.go('title', undefined, { fade: 0 }); return; }
      ses = H.ses = open(info); game.go('play', { mode: 'session', ses }, { fade: 0 });
    });
  },
  // the run is built: my lane on the roll-in, and the others in the yard
  enter(play) { play.run.sim.respawn(ses.spawn); A.view.others = ses.list; A.view.cam.set = false; },
  // the session's part of a frame, before the step. Returns true when it ran the whole frame (before the start, after the end)
  before(play, dt) {
    const run = play.run, sim = run.sim, game = U.game, now = AIHub.time();

      else if (n !== ses.sec && n <= 3) { ses.sec = n; game.audio.sfx('tick'); }

    return true;
