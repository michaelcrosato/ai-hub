		o.receiveShadow = true;

	function poly(vertices, faces, material) {
		const g = new THREE.BufferGeometry();
		g.setAttribute(

		g.computeVertexNormals();

		o.receiveShadow = true;

	function extrudedWing(points, thickness, material) {
		let area = 0;
		for (let i = 0; i < points.length; i++) {
			const a = points[i],

				z,

					Math.cos(a) * 51,
					Math.sin(a) * 51,
					0,
					1.1,
					7,
					7.1,
				);
				b.rotation.z = a - Math.PI / 2;
			}
		}
		for (let i = 0; i < 19; i++) {
			const gleam = mesh(
				sparkleGeo,
				m.waterLight,
				rand(-37, 37),
				-6.68,
				rand(-112, 0),
				rand(0.3, 2),
				rand(3, 17),
				1,
			);
			gleam.rotation.x = -Math.PI / 2;
			gleam.castShadow = false;
			g.add(gleam);
		}
		// Slim navigation pylons make forward speed and the safe corridor legible.
		if (index % 2 === 0)
			for (const s of [-1, 1]) {
				block(g, m.dark, s * 28, -0.5, -104, 0.45, 11, 0.45);
				block(g, m.glow, s * 28, 5.2, -104, 0.75, 0.3, 0.75);
				block(g, m.orange, s * 28, 2.5, -104, 0.65, 2.8, 0.65);
			}
		world.add(g);
		chunks.push(g);
	}
	for (let i = 0; i < chunkCount; i++) makeChunk(i);
	const birds = new THREE.Group();
	world.add(birds);
	for (let i = 0; i < 14; i++) {
		const b = new THREE.Group();
		b.position.set(rand(-150, 150), rand(48, 80), -rand(140, 550));
		for (const s of [-1, 1]) {
			const wing = block(b, m.dark, s * 0.65, 0, 0, 1.4, 0.12, 0.35);
			wing.rotation.z = s * 0.18;
		}
		birds.add(b);
		animated.push({
			obj: b,
			type: "bird",
			offset: Math.random() * 10,
			base: b.position.clone(),
		});
	}
	function update(dt, time, speed = 0, _phase = "canyon") {
		for (const chunk of chunks) {
			chunk.position.z += speed * dt;
			if (chunk.position.z > 100) chunk.position.z -= chunkLength * chunkCount;
		}
		orbital.rotation.z = -0.38 + Math.sin(time * 0.018) * 0.025;
		for (const a of animated) {
			if (a.type === "beacon")
				a.obj.visible = Math.sin(time * 3 + a.offset) > -0.5;
			else {
				a.obj.position.x = a.base.x + Math.sin(time * 0.15 + a.offset) * 15;
				a.obj.position.y = a.base.y + Math.sin(time * 0.8 + a.offset) * 1.4;
				a.obj.children.forEach((w, i) => {
					w.rotation.z =
						(i === 0 ? -1 : 1) *
						(0.15 + Math.sin(time * 2.7 + a.offset) * 0.32);
				});
			}
		}
	}
	function reset() {
		for (const chunk of chunks) chunk.position.z = chunk.userData.startZ;
	}
	return {
		update,
		createShip,
		createEnemy,
		createBoss,
		reset,
		group: world,
		palette,
	};
}

// Original procedural score and sound design. All sound is generated with Web Audio.
class GameAudio {
	constructor() {
		this.context = null;
		this.volume = 0.65;
		this.mode = "title";
		this.step = 0;
		this.nextBeat = 0;
		this.nodes = new Set();
		this.lastEffects = new Map();
		this.disposed = false;
	}

	async unlock() {
		if (this.disposed) return false;
		try {
			if (!this.context) {
				const Context =
					globalThis.AudioContext || globalThis.webkitAudioContext;
				if (!Context) return false;
				const c = new Context();
				this.context = c;
				this.master = c.createGain();
				this.master.gain.value = this.volume * 0.55;
				this.compressor = c.createDynamicsCompressor();
				this.compressor.threshold.value = -15;
				this.compressor.knee.value = 20;
				this.compressor.ratio.value = 4;
				this.compressor.attack.value = 0.008;
				this.compressor.release.value = 0.2;
				this.music = c.createGain();
				this.effects = c.createGain();
				this.engine = c.createGain();
				this.music.gain.value = 0.7;
				this.effects.gain.value = 0.9;
				this.engine.gain.value = 0;
				this.music.connect(this.master);
				this.effects.connect(this.master);
				this.engine.connect(this.master);
				this.master.connect(this.compressor);
				this.compressor.connect(c.destination);
				this.noise = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
				const channel = this.noise.getChannelData(0);
				let brown = 0;
				for (let i = 0; i < channel.length; i++) {
					brown = (brown + (Math.random() * 2 - 1) * 0.08) / 1.02;
					channel[i] = brown * 2.8;
				}
				this.engineOsc = c.createOscillator();
				this.engineOsc.type = "sawtooth";
				this.engineOsc.frequency.value = 58;
				this.engineFilter = c.createBiquadFilter();
				this.engineFilter.type = "lowpass";
				this.engineFilter.frequency.value = 150;
				this.engineOsc.connect(this.engineFilter);
				this.engineFilter.connect(this.engine);
				this.engineOsc.start();
				this.engineNoise = c.createBufferSource();
				this.engineNoise.buffer = this.noise;
				this.engineNoise.loop = true;
				this.engineNoiseGain = c.createGain();
				this.engineNoiseGain.gain.value = 0.23;
				this.engineNoise.connect(this.engineNoiseGain);
				this.engineNoiseGain.connect(this.engine);
				this.engineNoise.start();
				this.nextBeat = c.currentTime + 0.05;
			}
			if (this.context.state === "suspended") await this.context.resume();
			return this.context.state === "running";
		} catch (error) {
			console.warn("Audio is unavailable:", error.message);
			return false;
		}
	}

	setVolume(value) {
		this.volume = Math.max(0, Math.min(1, Number(value) || 0));
		if (this.context)
			this.master.gain.setTargetAtTime(
				this.volume * 0.55,
				this.context.currentTime,
				0.04,
			);
	}

	setMode(mode) {
		if (this.mode === mode) return;
		this.mode = mode;
		this.step = 0;
		if (this.context) this.nextBeat = this.context.currentTime + 0.06;
	}

	_tone(
		frequency,
		duration,
		level = 0.1,
		type = "sine",
		when,
		endFrequency,
		bus,
	) {
		const c = this.context;
		if (c?.state !== "running") return;
		const time = Math.max(c.currentTime, when ?? c.currentTime);
		const oscillator = c.createOscillator();
		const gain = c.createGain();
		oscillator.type = type;
		oscillator.frequency.setValueAtTime(Math.max(16, frequency), time);
		if (endFrequency)
			oscillator.frequency.exponentialRampToValueAtTime(
				Math.max(16, endFrequency),
				time + duration,
			);
		gain.gain.setValueAtTime(0.0001, time);
		gain.gain.exponentialRampToValueAtTime(
			Math.max(0.0002, level),
			time + Math.min(0.018, duration * 0.15),
		);
		gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
		oscillator.connect(gain);
		gain.connect(bus || this.effects);
		oscillator.start(time);
		oscillator.stop(time + duration + 0.02);
		this.nodes.add(oscillator);
		oscillator.onended = () => {
			oscillator.disconnect();
			gain.disconnect();
			this.nodes.delete(oscillator);
		};
	}

	_noise(duration, level, cutoff, when, highpass = false) {
		const c = this.context;
		if (c?.state !== "running") return;
		const time = Math.max(c.currentTime, when ?? c.currentTime);
		const source = c.createBufferSource();
		const filter = c.createBiquadFilter();
		const gain = c.createGain();
		source.buffer = this.noise;
		filter.type = highpass ? "highpass" : "lowpass";
		filter.frequency.setValueAtTime(cutoff, time);
		gain.gain.setValueAtTime(0.0001, time);
		gain.gain.linearRampToValueAtTime(level, time + 0.008);
		gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
		source.connect(filter);
		filter.connect(gain);
		gain.connect(this.effects);
		source.start(time, Math.random() * 0.8);
		source.stop(time + duration + 0.02);
		this.nodes.add(source);
		source.onended = () => {
			source.disconnect();
			filter.disconnect();
			gain.disconnect();
			this.nodes.delete(source);
		};
	}

	update(
		_dt,
		{ speed = 0, boost = false, health: _health = 100, boss = false } = {},
	) {
		const c = this.context;
		if (c?.state !== "running" || this.disposed) return;
		const now = c.currentTime;
		const quiet =
			/title|menu|pause|settings|about|credits|debrief|victory|gameover|results/i.test(
				this.mode,
			);
		const power = Math.min(1.6, Math.max(0, speed / 70));
		this.engine.gain.setTargetAtTime(
			quiet ? 0 : boost ? 0.052 : 0.025 + power * 0.013,
			now,
			0.12,
		);
		this.engineOsc.frequency.setTargetAtTime(
			45 + power * 26 + (boost ? 30 : 0),
			now,
			0.14,
		);
		this.engineFilter.frequency.setTargetAtTime(
			boost ? 420 : 170 + power * 75,
			now,
			0.2,
		);
		if (/pause|settings|about|credits|gameover/i.test(this.mode)) {
			this.music.gain.setTargetAtTime(0.22, now, 0.1);
			this.nextBeat = now + 0.1;
			return;
		}
		this.music.gain.setTargetAtTime(quiet ? 0.62 : 0.76, now, 0.15);
		const title = quiet;
		const seconds = 60 / (title ? 94 : boss ? 138 : 124) / 4;
		if (this.nextBeat < now - 0.3) this.nextBeat = now + 0.025;
		let scheduled = 0;
		while (this.nextBeat < now + 0.16 && scheduled++ < 6) {
			this._sequence(this.step++, this.nextBeat, seconds, title, boss);
			this.nextBeat += seconds;
		}
	}

	_sequence(step, time, interval, title, boss) {
		const midi = (n) => 440 * 2 ** ((n - 69) / 12);
		const chord = [45, 41, 48, 43][Math.floor(step / 32) % 4];
		const position = step % 16;
		const arp = [0, 7, 12, 16, 19, 16, 12, 7][Math.floor(step / 2) % 8];
		if (title) {
			if (step % 2 === 0)
				this._tone(
					midi(chord + 24 + arp),
					0.8,
					0.037,
					"sine",
					time,
					undefined,
					this.music,
				);
			if (position === 0) {
				for (const offset of [12, 19, 24])
					this._tone(
						midi(chord + offset),
						2.5,
						0.022,
						"triangle",
						time,
						undefined,
						this.music,
					);
			}
			return;
		}
		// Four-bar minor progression; original melody, with a stronger boss rhythm.
		if (step % 2 === 0)
			this._tone(
				midi(chord + (position === 12 ? 7 : 0)),
				interval * 1.6,
				0.13,
				"triangle",
				time,
				undefined,
				this.music,
			);
		if (position === 0 || position === 8 || (boss && position === 11))
			this._tone(120, 0.16, 0.2, "sine", time, 38, this.music);
		if (position === 4 || position === 12) {
			this._noise(0.1, 0.1, 1400, time, true);
			this._tone(170, 0.09, 0.03, "triangle", time, 65, this.music);
		}
		if (step % 2 === 0) this._noise(0.035, 0.042, 5000, time, true);
		if (step % 4 === 0) {
			const melody = [
				12, 19, 24, 22, 19, 16, 14, 19, 12, 16, 19, 24, 26, 24, 19, 16,
			];
			this._tone(
				midi(chord + 12 + melody[Math.floor(step / 4) % melody.length]),
				interval * 3.6,
				0.045,
				"triangle",
				time,
				undefined,
				this.music,
			);
		}
		if (position === 0)
			for (const offset of [12, 19, 24])
				this._tone(
					midi(chord + offset),
					interval * 12,
					0.018,
					"sine",
					time,
					undefined,
					this.music,
				);
	}

	sfx(name) {
		const c = this.context;
		if (c?.state !== "running" || this.disposed) return;
		const now = c.currentTime;
		const limit = name === "laser" ? 0.055 : name === "lock" ? 0.25 : 0.025;
		if (now - (this.lastEffects.get(name) ?? -100) < limit) return;
		this.lastEffects.set(name, now);
		switch (name) {
			case "shoot":
			case "laser":
				this._tone(1080, 0.11, 0.1, "triangle", now, 270);
				break;
			case "charge":
			case "charged":
				this._tone(1800, 0.3, 0.19, "sawtooth", now, 140);
				this._tone(560, 0.25, 0.12, "sine", now, 70);
				break;
			case "explosion":
				this._noise(0.65, 0.65, 1100, now);
				this._tone(100, 0.4, 0.2, "sine", now, 25);
				break;
			case "damage":
			case "hit":
				this._noise(0.19, 0.24, 1800, now);
				this._tone(130, 0.15, 0.17, "triangle", now, 50);
				break;
			case "ring":
			case "pickup":
				[660, 880, 1100].forEach((f, i) => {
					this._tone(f, 0.26, 0.11, "sine", now + i * 0.075);
				});
				break;
			case "bomb":
				this._noise(1.3, 0.85, 800, now);
				this._tone(150, 0.9, 0.33, "sine", now, 22);
				[300, 450, 600].forEach((f, i) => {
					this._tone(f, 0.45, 0.1, "triangle", now + i * 0.04, 35);
				});
				break;
			case "boost":
			case "roll":
				this._noise(0.4, 0.18, 2000, now, true);
				this._tone(180, 0.34, 0.08, "sine", now, 760);
				break;
			case "lock":
				this._tone(1120, 0.075, 0.075, "sine", now);
				this._tone(1490, 0.09, 0.075, "sine", now + 0.09);
				break;
			case "warning":
				this._tone(440, 0.11, 0.1, "triangle", now);
				this._tone(330, 0.16, 0.1, "triangle", now + 0.15);
				break;
			case "confirm":
			case "menu":
				this._tone(660, 0.1, 0.07, "sine", now, 880);
				break;
			case "victory":
				[60, 64, 67, 72, 76, 79, 84].forEach((n, i) => {
					this._tone(
						440 * 2 ** ((n - 69) / 12),
						0.75,
						0.13,
						"triangle",
						now + i * 0.13,
					);
				});
				break;
			default:
				break;
		}
	}

	dispose() {
		this.disposed = true;
		for (const node of this.nodes) {
			try {
				node.stop();
				node.disconnect();
			} catch {}
		}
		this.nodes.clear();
		if (this.context) {
			try {
				this.engineOsc.stop();
				this.engineNoise.stop();
			} catch {}
			this.context.close().catch(() => {});
			this.context = null;
		}
	}
}

	bindButtons() {
		this.buttons = [...this.menu.querySelectorAll("button")];
		this.buttons.forEach((button, i) => {
			button.addEventListener("pointerenter", () => this.select(i));
			button.addEventListener("keydown", (event) => {
				if (event.code === "Enter" || event.code === "Space")
					event.preventDefault();
			});
			button.addEventListener("click", () => {
				this.select(i);
				this.activate(button.dataset.action);
			});
		});
		this.select(Math.min(this.selected, this.buttons.length - 1));
		this.updateInputLabels();
	}

	select(index) {
		if (!this.buttons?.length) return;
		this.selected = (index + this.buttons.length) % this.buttons.length;
		this.buttons.forEach((b, i) => {
			b.classList.toggle("selected", i === this.selected);
			b.tabIndex = i === this.selected ? 0 : -1;
			b.setAttribute("aria-current", i === this.selected ? "true" : "false");
		});
		this.idle = 0;
	}

	activate(action) {
		if (action === "launch" && this.touchOnly && !this.connected) return;
		this.idle = 0;
		this.callbacks.action?.("menu-select");
		if (action === "launch") this.callbacks.start?.();
		else if (action === "resume") this.callbacks.resume?.();
		else if (action === "restart") this.callbacks.restart?.();
		else if (action === "quit") this.callbacks.quit?.();
		else if (action === "reload") location.reload();
		else if (action === "back") this.back();
		else if (action === "control-page" || action === "about-page") {
			const page = this.page + 1;
			this.show(action === "control-page" ? "controls" : "about", {
				returnTo: this.returnTo,
				page: action === "control-page" ? page % 2 : page % 3,
			});
		} else if (action?.startsWith("setting:")) {
			const key = action.split(":")[1];
			const old = this.selected;
			if (key === "volume")
				this.settings.volume =
					((Math.round(this.settings.volume * 5) + 1) % 6) / 5;
			else if (key === "difficulty")
				this.settings.difficulty =
					this.settings.difficulty === "standard" ? "cadet" : "standard";
			else this.settings[key] = !this.settings[key];
			this.callbacks.settingsChange?.(key, this.settings[key]);
			this.renderSettings();
			this.bindButtons();
			this.select(old);
		} else if (["settings", "controls", "about"].includes(action))
			this.callbacks.action?.(action);
	}

	back() {
		this.callbacks.action?.("menu-back");
		if (this.screen === "pause") this.callbacks.resume?.();
		else if (["settings", "controls", "about"].includes(this.screen))
			this.callbacks.action?.("back");
		else if (this.screen === "results") this.callbacks.quit?.();
	}

	updateMenuInput(y, confirm = false, back = false) {
		if (
			this.screen === "game" ||
			this.screen === "attract" ||
			this.screen === "loading"
		)
			return;
		this.idle = 0;
		if (y && this.time - this.lastMenuMove > 0.14) {
			this.select(this.selected + Math.sign(y));
			this.lastMenuMove = this.time;
			this.callbacks.action?.("menu-move");
		}
		if (back) this.back();
		else if (confirm && this.buttons?.length)
			this.activate(this.buttons[this.selected].dataset.action);
	}

		this.$("#touch-warning").hidden = !this.touchOnly || connected;
		this.updateInputLabels();
	}

	updateInputLabels() {
		this.root.classList.toggle("keyboard-input", !this.connected);
		this.root.querySelectorAll('[data-bind="confirm"]').forEach((el) => {
			el.textContent = this.connected ? "×" : "ENTER";
		});
	}

	hud(data = {}) {
		const shield = Math.max(0, data.shields ?? data.health ?? 100);
		const shieldPercent = Math.max(
			0,
			Math.min(100, (data.shield ?? shield / (data.maxHealth ?? 100)) * 100),
		);
		const boost = Math.max(0, Math.min(1, data.boost ?? 1));
		this.$("#shield-value").textContent = Math.ceil(shield);
		this.$("#shield-fill").style.width = `${shieldPercent}%`;
		this.$(".shield-row").classList.toggle("danger", shieldPercent < 30);
		this.$("#boost-fill").style.width = `${boost * 100}%`;
		this.$("#boost-state").textContent = data.boosting
			? "BOOSTING"
			: data.braking
				? "BRAKING"
				: boost < 0.2
					? "RECHARGING"
					: "READY";
		this.$("#score-value").textContent = String(
			Math.floor(data.score ?? 0),
		).padStart(6, "0");
		this.$("#combo-value").textContent =
			`MULTIPLIER ×${data.multiplier ?? data.combo ?? 1}`;
		this.$("#bomb-value").textContent =
			"◆ ".repeat(Math.max(0, data.bombs ?? 3)).trim() || "NO BOMBS";
		this.$("#wing-level").textContent =
			data.laserLevel > 1
				? "HYPER LASER"
				: data.laserLevel === 1
					? "TWIN LASER"
					: "PULSE CANNON";
		this.$("#phase-number").textContent = String(
			data.phaseNumber ?? 1,
		).padStart(2, "0");
		this.$("#phase-label").textContent =
			data.phaseLabel ?? "OPERATION SUNBREAK";
		this.$("#phase-value").textContent = data.phase ?? "Breach the canyon";
		this.$("#mission-fill").style.width =
			`${Math.max(0, Math.min(1, data.progress ?? 0)) * 100}%`;
		this.$("#boss-hud").hidden = data.bossHp == null;
		if (data.bossHp != null) {
			const hp = Math.max(0, Math.min(1, data.bossHp));
			this.$("#boss-fill").style.width = `${hp * 100}%`;
			this.$("#boss-percent").textContent = `${Math.ceil(hp * 100)}%`;
			this.$("#boss-name").textContent =
				data.bossName ?? "SUN EATER / SIEGE ENGINE";
		}
		const aimX = data.aimX ?? 0,
			aimY = data.aimY ?? 0;
		this.$("#reticle").style.left = `${50 + aimX * 50}%`;
		this.$("#reticle").style.top = `${50 - aimY * 50}%`;
		this.$("#reticle").classList.toggle("locked", !!data.locked);
		this.$("#reticle").classList.toggle(
			"charging",
			(data.lockProgress ?? 0) > 0 && !data.locked,
		);
		this.$("#reticle").style.setProperty("--lock", data.lockProgress ?? 0);
		this.$("#lock-label").textContent = data.locked
			? "TARGET LOCKED"
			: data.lockProgress > 0
				? "ACQUIRING"
				: "";
		this.$("#damage-wash").style.opacity = Math.max(
			0,
			Math.min(1, data.damageFlash ?? 0),
		);
		if (data.targetX != null && data.targetY != null) {
			this.$("#lock-frame").hidden = false;
			this.$("#lock-frame").style.left = `${50 + data.targetX * 50}%`;
			this.$("#lock-frame").style.top = `${50 - data.targetY * 50}%`;
		} else this.$("#lock-frame").hidden = true;
	}

	comms(name, text, color = "#f6a35b") {
		this.$("#comms-name").textContent = name;
		this.$("#comms-text").textContent = text;
		this.$("#comms").style.setProperty("--comms-color", color);
		this.$("#comms").hidden = false;
		this.commsTime = Math.max(4, Math.min(9, text.length * 0.055));
	}

	notice(text, sub = "") {
		this.$("#notice-main").textContent = text;
		this.$("#notice-sub").textContent = sub;
		this.$("#notice").hidden = false;
		this.noticeTime = 3;
	}

	tick(dt) {
		this.time += dt;
		this.idle += dt;
		if (this.screen === "title") {
			const el = this.$("#idle-countdown");
			if (el)
				el.textContent = `AUTOPILOT DEMO IN ${Math.max(0, Math.ceil(10 - this.idle))}s`;
		}
		if (this.commsTime > 0) {
			this.commsTime -= dt;
			if (this.commsTime <= 0) this.$("#comms").hidden = true;
		}
		if (this.noticeTime > 0) {
			this.noticeTime -= dt;
			if (this.noticeTime <= 0) this.$("#notice").hidden = true;
		}
	}
}

window.addEventListener("keydown", (e) => {
	ui.touchOnly = false;
	ui.setGamepad(padConnected);
	if (
		[
			"ArrowUp",
			"ArrowDown",
			"ArrowLeft",
			"ArrowRight",
			"Space",
			"Tab",
		].includes(e.code)
	)
		e.preventDefault();
	const escaped = inputActivity(e);
	if (escaped) return;
	if (!keys.has(e.code)) edge.add(e.code);
	keys.add(e.code);
	if (e.code === "Escape" || e.code === "KeyP") {
		if (mode === "playing") pause();
		else if (mode === "pause") resume();
		else if (!["title", "loading", "error"].includes(mode))
			ui.updateMenuInput(0, false, true);
	}
});
window.addEventListener("keyup", (e) => keys.delete(e.code));
window.addEventListener(
	"pointerdown",
	(e) => {
		if (inputActivity(e)) e.stopImmediatePropagation();
	},
	true,
);
window.addEventListener("pointermove", (e) => {
	if (e.movementX || e.movementY) {
		lastInput = performance.now();
		if (mode === "attract") toTitle();
	}
});
window.addEventListener("blur", () => {
	keys.clear();
	edge.clear();
	if (mode === "playing") pause();
});
document.addEventListener("visibilitychange", () => {
	if (document.hidden && mode === "playing") pause();
});
window.addEventListener("resize", resize);
function resize() {
	if (!renderer || !camera) return;
	camera.aspect = innerWidth / innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(innerWidth, innerHeight);
}
function pause() {
	screen("pause");
	keys.clear();
}
function resume() {
	screen("playing");
	lastFrame = performance.now();
}
function toTitle() {
	clearEntities();
	game = null;
	if (ship) ship.visible = true;
	screen("title");
	lastInput = performance.now();
}

async function boot() {
	try {
		ui.setLoading("INITIALIZING FLIGHT SYSTEMS");
		if (!navigator.gpu)
			throw new Error(
				"WebGPU is required. Open this flight in a WebGPU-enabled Chrome or Edge browser on HTTPS or localhost.",
			);
		const adapter = await navigator.gpu.requestAdapter();
		if (!adapter)
			throw new Error(
				"No WebGPU adapter is available. Enable hardware acceleration and use a WebGPU-compatible device.",
			);
		renderer = new THREE.WebGPURenderer({ antialias: true, alpha: false });
		renderer._getFallback = null;
		renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
		renderer.setSize(innerWidth, innerHeight);
		renderer.toneMapping = THREE.ACESFilmicToneMapping;
		renderer.toneMappingExposure = 1.12;
		renderer.shadowMap.enabled = true;
		renderer.shadowMap.type = THREE.PCFShadowMap;
		await renderer.init();
		if (!renderer.backend.isWebGPUBackend)
			throw new Error("This game requires the WebGPU rendering backend.");
		renderer.domElement.id = "flight-canvas";
		document.body.prepend(renderer.domElement);
		scene = new THREE.Scene();
		camera = new THREE.PerspectiveCamera(
			57,
			innerWidth / innerHeight,
			0.1,
			1800,
		);
		art = createWorld(THREE, scene);
		ship = art.createShip("player");
		scene.add(ship);
		ship.position.set(0, 8, 0);
		for (let i = 0; i < 2; i++) {
			const w = art.createShip(i ? "wing2" : "wing1");
			w.scale.setScalar(0.54);
			scene.add(w);
			wingmen.push(w);
		}
		ui.setLoading("CALIBRATING COLLISION GRID");
		await RAPIER.init();
		resetPhysics();
		ready = true;
		screen("title");
		window.__flight = {
			start: (attract = false, checkpoint = 0) => start(attract, checkpoint),
			state: () => ({
				mode,
				ready,
				backend: renderer.backend.isWebGPUBackend ? "webgpu" : "unknown",
				time: game?.time,
				phase: game?.phase,
				health: game?.health,
				maxHealth: game?.maxHealth,
				level: game?.level,
				bombs: game?.bombs,
				rings: game?.rings,
				boost: game?.boost,
				finished: game?.finished,
				wingSaved: game?.wingSaved,
				bossExposed: game?.boss?.exposed,
				bossDestroyed: game?.boss?.destroyed,
				score: game?.score,
				kills: game?.kills,
				entities: entities.length,
				physicsBodies: physics.bodies.len(),
				boss: game?.boss?.hp,
				checkpoint: game?.checkpoint,
				route: game?.route,
				settings: { ...settings },
				rollTimer,
				charge: game?.charge,
				lock: lockTime,
				invuln,
			}),
			seek: (t) => seek(t),
			spawn: (kind = "fighter", x = 0, y = 8, z = -70) =>
				spawnEnemy(kind, x, y, z),
			damage: (n) => damagePlayer(n),
			pickup: (type) => pickup(type, ship.position.clone()),
			bomb: () => bomb(),
			shoot: () => fire(false),
			charge: () => fire(true),
			roll: () => roll(1),
			finish: () => complete(),
			setHealth: (n) => (game.health = n),
			simulate: (seconds) => {
				for (
					let i = 0;
					i < Math.ceil(seconds * 60) && game && !game.finished;
					i++
				) {
					visualTime += 1 / 60;
					updateGame(1 / 60, pilotAI());
					updateEffects(1 / 60);
				}
				return window.__flight.state();
			},
			pose: (x, y) => ship.position.set(x, y, 0),
			snapshot: () =>
				entities
					.filter((e) => !e.dead)
					.map((e) => ({
						kind: e.kind,
						type: e.type,
						index: e.index,
						hp: e.hp,
						position: e.mesh.position.toArray(),
					})),
			renderer,
			scene,
		};
		renderer.setAnimationLoop(frame);
	} catch (error) {
		console.error(error);
		screen("error", { message: error.message });
		document.getElementById("boot-failure")?.remove();
	}
}

function resetPhysics() {
	physics?.free();
	events?.free();
	colliders.clear();
	physics = new RAPIER.World({ x: 0, y: 0, z: 0 });
	physics.timestep = 1 / 60;
	events = new RAPIER.EventQueue(true);
	playerBody = physics.createRigidBody(
		RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(
			...ship.position.toArray(),
		),
	);
	playerCollider = physics.createCollider(
		RAPIER.ColliderDesc.ball(1.45)
			.setSensor(true)
			.setCollisionGroups((1 << 16) | (2 | 8 | 16 | 32))
			.setActiveEvents(RAPIER.ActiveEvents.COLLISION_EVENTS)
			.setActiveCollisionTypes(RAPIER.ActiveCollisionTypes.ALL),
		playerBody,
	);
	colliders.set(playerCollider.handle, { kind: "player" });
}

function makeBody(entity, radius, member, filter) {
	entity.body = physics.createRigidBody(
		RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(
			...entity.mesh.position.toArray(),
		),
	);
	entity.collider = physics.createCollider(
		RAPIER.ColliderDesc.ball(radius)
			.setSensor(true)
			.setCollisionGroups((member << 16) | filter)
			.setActiveEvents(RAPIER.ActiveEvents.COLLISION_EVENTS)
			.setActiveCollisionTypes(RAPIER.ActiveCollisionTypes.ALL),
		entity.body,
	);
	colliders.set(entity.collider.handle, entity);
	entities.push(entity);
	scene.add(entity.mesh);
	return entity;
}
function remove(entity) {
	if (!entity || entity.dead) return;
	entity.dead = true;
	scene.remove(entity.mesh);
	if (entity.body) {
		colliders.delete(entity.collider.handle);
		physics.removeRigidBody(entity.body);
	}
}
function clearEntities() {
	if (game?.boss) {
		scene.remove(game.boss.mesh);
		game.boss = null;
	}
	for (const e of entities) remove(e);
	entities = [];
	for (const p of particles) scene?.remove(p.mesh);
	particles = [];
	for (const f of floats) f.el.remove();
	floats = [];
	currentLock = null;
	lockTime = 0;
}

function start(attract = false, checkpoint = 0) {
	if (!ready) return;
	audio.unlock();
	clearEntities();
	art.reset();
	game = {
		time: checkpoint,
		phase: -1,
		health: 100,
		maxHealth: 100,
		boost: 100,
		bombs: 3,
		score: 0,
		kills: 0,
		shots: 0,
		hits: 0,
		rings: 0,
		gold: 0,
		level: 1,
		combo: 0,
		comboTimer: 0,
		charge: 0,
		wave: 0,
		nextWave: checkpoint + 2,
		nextRing: checkpoint + 6,
		nextObstacle: checkpoint + 18,
		route: null,
		checkpoint: checkpoint,
		wingSaved: false,
		rescueKills: 0,
		boss: null,
		bossPhase: 0,
		bossNext: 0,
		bossStarted: 0,
		finished: false,
		attract,
		damageTaken: 0,
		deflections: 0,
		routeTime: 0,
	};
	ship.position.set(0, 8, 0);
	resetPhysics();
	ship.rotation.set(0, 0, 0);
	ship.visible = true;
	fireTimer = 0;
	invuln = 2;
	rollTimer = 0;
	chargeWas = false;
	shake = 0;
	aimOffset.set(0, 0, 0);
	accumulator = 0;
	keys.clear();
	edge.clear();
	screen(attract ? "attract" : "playing");
	ui.notice(
		checkpoint ? "CHECKPOINT RESTORED" : "OPERATION / SUNBREAK",
		checkpoint
			? "A fresh wing. Finish the fight."
			: "Asterion Canyon · Clear a path to the carrier",
	);
	ui.comms(
		"MICA",
		"Fennec squadron, launch! Keep the canyon clear. We’re counting on you.",
		"#f5ae70",
	);
}
function seek(t) {
	if (!game) start(true);
	clearEntities();
	resetPhysics();
	game.time = t;
	game.phase = -1;
	game.nextWave = t + 1;
	game.nextRing = t + 3;
	game.nextObstacle = t + 5;
	game.boss = null;
	game.bossPhase = 0;
	game.health = 100;
}

function phaseUpdate() {
	const p = phases.findLastIndex((p) => game.time >= p.at);
	if (p !== game.phase) {
		game.phase = p;
		const phase = phases[p];
		ui.notice(phase.name, phase.sub);
		if (phase.radio) ui.comms(...phase.radio);
		if (p === 4) game.rescueKills = 0;
		if (p === 5) {
			game.checkpoint = 135;
			game.health = Math.min(game.maxHealth, game.health + 50);
			game.bombs = Math.max(game.bombs, 2);
			audio.sfx("pickup");
		}
		if (p === 6) spawnBoss();
	}
	if (game.time >= 60 && !game.route) {
		game.route = ship.position.x < 0 ? "storm" : "convoy";
		ui.notice(
			game.route === "storm" ? "ROUTE A / STORM PASS" : "ROUTE B / IRON CONVOY",
			game.route === "storm"
				? "Close quarters. Rich rewards."
				: "Heavy armor. Bigger bounty.",
		);
		ui.comms(
			"MICA",
			game.route === "storm"
				? "The storm pass. Stay nimble. Roll through the crossfire."
				: "Convoy route confirmed. Charge those shots and crack their armor.",
		);
	}
	if (game.phase === 4 && game.rescueKills >= 5 && !game.wingSaved) {
		game.wingSaved = true;
		addScore(1500);
		game.bombs = Math.min(5, game.bombs + 1);
		game.health = Math.min(game.maxHealth, game.health + 20);
		ui.notice("WINGMATE RESCUED", "+1,500 · smart bomb supplied");
		ui.comms(
			"ROOK",
			"That’s five! You saved my hide. Here’s a bomb for your trouble.",
		);
		audio.sfx("pickup");
	}
	if (game.phase === 5 && !game.rescueResolved) {
		game.rescueResolved = true;
		if (!game.wingSaved)
			ui.comms(
				"ROOK",
				"Taking too much heat. I’m pulling out. Finish this for me!",
			);
	}
}

function readInput(dt) {
	const gp = Array.from(navigator.getGamepads?.() || []).find(
		(p) => p?.connected,
	);
	const connected = !!gp;
	if (connected !== padConnected) {
		padConnected = connected;
		ui.setGamepad(connected);
		if (!connected && mode === "playing" && padPrev.length) pause();
	}
	const b = gp ? gp.buttons.map((b) => b.pressed) : [];
	const just = b.map((v, i) => v && !padPrev[i]);
	let ax = gp?.axes[0] || 0,
		ay = gp?.axes[1] || 0;
	const dead = (v) =>
		Math.abs(v) < 0.16 ? 0 : (Math.sign(v) * (Math.abs(v) - 0.16)) / 0.84;
	ax = dead(ax);
	ay = dead(ay);
	if (
		just.some(Boolean) ||
		Math.abs(ax) + Math.abs(ay) > 0.15 ||
		Math.abs(gp?.axes[2] || 0) + Math.abs(gp?.axes[3] || 0) > 0.3
	) {
		if (mode === "attract") {
			toTitle();
			padPrev = b;
			return {};
		}
		lastInput = performance.now();
		audio.unlock();
	}
	const active = mode === "playing" || mode === "attract";
	if (!active) {
		menuCooldown -= dt;
		const nav =
			(b[13] ? 1 : 0) - (b[12] ? 1 : 0) ||
			(ay > 0.55 ? 1 : ay < -0.55 ? -1 : 0);
		const keyNav =
			edge.has("ArrowDown") || edge.has("KeyS")
				? 1
				: edge.has("ArrowUp") || edge.has("KeyW")
					? -1
					: 0;
		if ((nav && menuCooldown <= 0) || keyNav) {
			ui.updateMenuInput(keyNav || nav, false, false);
			audio.sfx("menu");
			menuCooldown = 0.22;
		}
		if (just[0] || just[9] || edge.has("Enter") || edge.has("Space")) {
			ui.updateMenuInput(0, true, false);
			audio.sfx("menu");
		}
		if (just[1] || just[8] || edge.has("Backspace"))
			ui.updateMenuInput(0, false, true);
		padPrev = b;
		edge.clear();
		return {};
	}
	if (just[9]) {
		if (mode === "playing") pause();
		padPrev = b;
		return {};
	}
	let x =
		ax +
		(keys.has("KeyD") || keys.has("ArrowRight") ? 1 : 0) -
		(keys.has("KeyA") || keys.has("ArrowLeft") ? 1 : 0);
	let y =
		-ay +
		(keys.has("KeyW") || keys.has("ArrowUp") ? 1 : 0) -
		(keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0);
	if (settings.invertX) x = -x;
	if (settings.invertY) y = -y;
	const input = {
		x: clamp(x, -1, 1),
		y: clamp(y, -1, 1),
		aimX: dead(gp?.axes[2] || 0) * (settings.invertX ? -1 : 1),
		aimY: -dead(gp?.axes[3] || 0) * (settings.invertY ? -1 : 1),
		fire: b[0] || b[7] || keys.has("Space"),
		charge: b[2] || keys.has("KeyC"),
		bomb: just[1] || edge.has("KeyX"),
		boost: b[3] || keys.has("ShiftLeft") || keys.has("ShiftRight"),
		brake: b[6] || keys.has("ControlLeft") || keys.has("ControlRight"),
		roll:
			just[4] || edge.has("KeyQ") ? -1 : just[5] || edge.has("KeyE") ? 1 : 0,
	};
	padPrev = b;
	edge.clear();
	return input;
}

function pilotAI() {
	const target = entities
		.filter((e) => e.kind === "enemy" && !e.dead && e.mesh.position.z < -15)
		.sort((a, b) => b.mesh.position.z - a.mesh.position.z)[0];
	const ring = entities.find(
		(e) =>
			e.kind === "pickup" &&
			!e.dead &&
			e.mesh.position.z > -65 &&
			e.mesh.position.z < -5,
	);
	let desired = ring
		? ring.mesh.position
		: target
			? target.mesh.position
			: vec(
					Math.sin(game.time * 0.31) * 13,
					10 + Math.sin(game.time * 0.23) * 6,
					-80,
				);
	if (game.boss) {
		const cores = entities.filter((e) => e.kind === "core" && !e.dead);
		desired = cores[0]?.mesh.position || desired;
	}
	return {
		x: clamp((desired.x - ship.position.x) * 0.23, -1, 1),
		y: clamp((desired.y - ship.position.y) * 0.23, -1, 1),
		aimX: 0,
		aimY: 0,
		fire: true,
		charge: game.time % 5 < 1.1,
		bomb: game.time > 7 && game.time % 25 < 0.025,
		boost: game.time % 16 > 12,
		brake: false,
		roll: game.time % 7 < 0.025 ? 1 : 0,
	};
}

function frame(now) {
	const dt = Math.min((now - lastFrame) / 1000, 0.05);
	lastFrame = now;
	visualTime += dt;
	let input = readInput(dt);
	if (mode === "title" && now - lastInput >= 10000) start(true);
	if ((mode === "playing" || mode === "attract") && game) {
		if (game.attract) input = pilotAI();
		accumulator += dt;
		let ticks = 0;
		while (accumulator >= 1 / 60 && ticks++ < 5) {
			updateGame(1 / 60, input);
			input.bomb = false;
			input.roll = 0;
			accumulator -= 1 / 60;
		}
		updateCamera(dt, false);
		updateHUD();
	} else if (
		mode === "title" ||
		(["settings", "controls", "about", "loading", "error"].includes(mode) &&
			!game)
	) {
		art.update(dt, visualTime, 11, "title");
		ship.position.set(
			11 + Math.sin(visualTime * 0.3) * 1.2,
			9 + Math.sin(visualTime * 0.65),
			5,
		);
		ship.rotation.set(
			0.1,
			Math.sin(visualTime * 0.24) * 0.12,
			-0.1 + Math.sin(visualTime * 0.4) * 0.07,
		);
		camera.position.set(0, 14, 38);
		camera.lookAt(0, 8, -65);
		camera.fov = 57;
		camera.updateProjectionMatrix();
		wingmen.forEach((w, i) => {
			w.visible = true;
			w.position.set(i ? -6 : 24, 11 + i * 4, -25 - i * 12);
			w.rotation.set(0, 0, Math.sin(visualTime * 0.7 + i) * 0.08);
		});
	}
	updateEffects(dt);
	ui.tick(dt);
	audio.update(dt, {
		speed: game?.speed || 35,
		boost: game?.boosting || false,
		health: game?.health || 100,
		boss: !!game?.boss,
	});
	renderer.render(scene, camera);
}

function updateGame(dt, input) {
	if (game.finished || !["playing", "attract"].includes(mode)) return;
	game.time += dt;
	phaseUpdate();
	game.comboTimer -= dt;
	if (game.comboTimer <= 0) game.combo = 0;
	invuln = Math.max(0, invuln - dt);
	rollTimer = Math.max(0, rollTimer - dt);
	fireTimer = Math.max(0, fireTimer - dt);
	game.boosting = !!input.boost && game.boost > 3;
	game.braking = !!input.brake;
	if (game.boosting) game.boost = Math.max(0, game.boost - 29 * dt);
	else game.boost = Math.min(100, game.boost + 18 * dt);
	game.speed = game.boss ? 20 : game.boosting ? 94 : input.brake ? 25 : 53;
	const motion = game.boosting ? 31 : input.brake ? 20 : 27;
	ship.position.x = clamp(
		ship.position.x + (input.x || 0) * motion * dt,
		-22,
		22,
	);
	ship.position.y = clamp(
		ship.position.y + (input.y || 0) * motion * dt,
		0.8,
		25,
	);
	ship.position.z = lerp(
		ship.position.z,
		game.boosting ? -5 : input.brake ? 4 : 0,
		dt * 5,
	);
	aimOffset.x = lerp(aimOffset.x, (input.aimX || 0) * 15, dt * 9);
	aimOffset.y = lerp(aimOffset.y, (input.aimY || 0) * 10, dt * 9);
	aim.set(
		ship.position.x * 1.4 + aimOffset.x,
		ship.position.y + (ship.position.y - 10) * 0.2 + aimOffset.y,
		-105,
	);
	if (input.roll) roll(input.roll);
	ship.rotation.x = lerp(ship.rotation.x, -(input.y || 0) * 0.17, dt * 8);
	ship.rotation.y = lerp(ship.rotation.y, -(input.x || 0) * 0.13, dt * 8);
	const bank = -(input.x || 0) * 0.48;
	ship.rotation.z =
		rollTimer > 0
			? bank + rollSign * (1 - rollTimer / 0.72) * Math.PI * 2
			: lerp(ship.rotation.z, bank, dt * 10);
	ship.visible = !(invuln > 0 && Math.floor(game.time * 18) % 2 === 0);
	ship.userData.engines?.forEach((e) => {
		e.scale.z = (game.boosting ? 2.4 : 1.1) + Math.random() * 0.3;
	});
	playerBody.setNextKinematicTranslation(ship.position);
	wingmen.forEach((w, i) => {
		w.visible = i === 0 || game.wingSaved || game.time < 135;
		w.position.set(
			ship.position.x * 0.22 +
				(i ? -13 : 13) +

			ship.position.y * 0.25 + 8 + i * 3,
			-16 - i * 10,

	});
	updateLock(dt, input);
	if (input.fire && !input.charge && fireTimer <= 0) fire(false);
	if (input.charge) {

			e.mesh.position.z += game.speed * dt * e.speed;
			e.mesh.position.x = e.baseX + Math.sin(e.age * e.freq + e.seed) * e.sway;
			e.mesh.position.y = e.baseY + Math.sin(e.age * 1.3 + e.seed) * e.bob;

		} else if (e.kind === "shot" || e.kind === "hostile") {
			if (e.homing && e.target && !e.target.dead) {
				const d = e.target.mesh.position
					.clone()
					.sub(e.mesh.position)
					.normalize()
					.multiplyScalar(e.velocity.length());

			e.mesh.position.addScaledVector(e.velocity, dt);
			e.mesh.rotation.z += dt * 3;

		} else if (e.kind === "pickup") {
			e.mesh.position.z += game.speed * dt;
			e.mesh.rotation.y += dt * 1.8;

	events.drainCollisionEvents((a, b, started) => {
		if (started) contacts.push([colliders.get(a), colliders.get(b)]);

	for (let [a, b] of contacts) {
		if (!a || !b || a.dead || b.dead) continue;
		if (a.kind === "player") [a, b] = [b, a];
		if (b.kind === "player") {

			}
		} else {
			if (b.kind === "shot") [a, b] = [b, a];
			if (a.kind === "shot" && (b.kind === "enemy" || b.kind === "core")) {
				game.hits++;

	art.update(dt, visualTime, game.speed, game.route || "canyon");

		game.boss.exposed = true;

function updateCamera(dt) {
	const fov = game.boosting ? 65 : 57;
	camera.fov = lerp(camera.fov, fov, dt * 4);
	camera.updateProjectionMatrix();
	const offset = settings.cameraShake ? shake : 0;
	shake = Math.max(0, shake - dt * 2.2);
	camera.position.lerp(
		vec(
			ship.position.x * 0.38 + (Math.random() - 0.5) * offset,
			12 + ship.position.y * 0.14 + (Math.random() - 0.5) * offset,
			31,
		),
		1 - Math.exp(-dt * 4),
	);
	camera.lookAt(ship.position.x * 0.3, 9 + ship.position.y * 0.23, -72);

function roll(sign) {

	game.boost -= 12;

function updateLock(dt, input) {
	let best = null,
		metric = Infinity;
	for (const e of entities) {
		if (e.dead || !["enemy", "core"].includes(e.kind) || e.mesh.position.z > -8)
			continue;
		const p = e.mesh.position;
		const t = (p.z - ship.position.z) / (aim.z - ship.position.z);
		const ax = lerp(ship.position.x, aim.x, t),
			ay = lerp(ship.position.y, aim.y, t);
		const dist = Math.hypot(p.x - ax, p.y - ay);
		if (dist < 14 && dist < metric) {
			metric = dist;
			best = e;
		}
	}
	if (best !== currentLock) {
		currentLock = best;
		lockTime = 0;
	} else if (best)
		lockTime = Math.min(1, lockTime + dt * (input.charge ? 2.2 : 0.8));
	if (best && input.charge && lockTime > 0.95 && !best.lockSound) {
		best.lockSound = true;
		audio.sfx("lock");
	}
}

const shotGeometry = new THREE.CylinderGeometry(0.16, 0.23, 3.2, 5);
const laserMats = {
	player: new THREE.MeshBasicMaterial({ color: 0x91fff0 }),

	charged: new THREE.MeshBasicMaterial({ color: 0xd9ff9b }),

function fire(charged) {
	if (!game || (fireTimer > 0 && !charged)) return;
	fireTimer = charged ? 0.3 : game.level >= 2 ? 0.105 : 0.16;
	const target = currentLock && lockTime > 0.45 ? currentLock : null;
	if (charged) {
		const p = ship.position.clone().add(vec(0, 0, -5));
		const mesh = new THREE.Mesh(
			new THREE.IcosahedronGeometry(0.9, 1),
			laserMats.charged,
		);
		mesh.position.copy(p);
		const vel = (target ? target.mesh.position : aim)
			.clone()
			.sub(p)
			.normalize()
			.multiplyScalar(160);
		makeBody(
			{
				kind: "shot",
				mesh,
				velocity: vel,
				damage: 5,
				charged: true,
				homing: !!target,

	const offsets = game.level >= 2 ? [-2.7, 2.7] : [0];
	for (const x of offsets) {

		mesh.position.copy(ship.position).add(vec(x, 0, -5));
		const direction = aim.clone().sub(mesh.position).normalize();
		mesh.quaternion.setFromUnitVectors(vec(0, 1, 0), direction);
		makeBody(
			{
				kind: "shot",

function enemyFire(e, spread = 0) {

		laserMats.enemy,

function blast(p, radius, damage) {

function spawnEnemy(type = "fighter", x = 0, y = 10, z = -270) {

function hitEnemy(e, amount) {

		explosion(e.mesh.position, 0x5dccdd, 0.3);

		game.boss.destroyed++;

			game.boss.coreMeshes[e.index].visible = false;

function pickup(type, p) {

			new THREE.TorusGeometry(3, 0.25, 6, 8),

				emissive: color,
				emissiveIntensity: 0.7,
				metalness: 0.5,

		mesh.add(ring);
		const inside = new THREE.Mesh(
			new THREE.TorusGeometry(2.6, 0.055, 3, 8),
			new THREE.MeshBasicMaterial({ color: 0xffffff }),
		);
		mesh.add(inside);

		mesh = new THREE.Group();

			type === "laser" ? 0x96f7af : type === "bomb" ? 0xffaf65 : 0x69dfff;

				emissive: color,

function spawnDirector() {
	if (game.phase < 6 && game.time >= game.nextWave) {
		const wave = game.wave++;
		const hard = game.route === "convoy" && game.phase === 3;
		const count = game.phase === 0 ? 3 : game.phase === 4 ? 5 : 4;
		for (let i = 0; i < count; i++) {
			const x = Math.sin(wave * 1.7) * 11 + (i - (count - 1) / 2) * 6;
			const y = 8 + Math.sin(wave * 0.9) * 5 + (i % 2) * 3;
			spawnEnemy(
				hard && i % 2 === 0
					? "armored"
					: game.phase === 4 || wave % 5 === 4
						? "ace"
						: "fighter",
				clamp(x, -21, 21),
				clamp(y, 3, 23),
				-260 - i * 12,
			);
		}
		game.nextWave =
			game.time + (game.phase === 0 ? 7 : game.phase === 4 ? 6 : 6.3);
	}
	if (game.phase < 6 && game.time >= game.nextRing) {
		const wave = Math.floor(game.time / 9);

				vec(x + Math.sin(i * 0.7) * 3, y + i, -155 - i * 21),
			);
		if (wave % 3 === 2) pickup(wave % 2 ? "laser" : "bomb", vec(-x, 12, -205));
		game.nextRing = game.time + 10;
	}
	if (game.phase >= 2 && game.phase < 5 && game.time >= game.nextObstacle) {
		const x = (Math.random() - 0.5) * 29,
			y = 4 + Math.random() * 15;
		const mesh = new THREE.Mesh(
			new THREE.IcosahedronGeometry(3.6, 0),
			new THREE.MeshStandardMaterial({
				color: game.route === "storm" ? 0xb47b5e : 0x526774,
				flatShading: true,
				roughness: 0.9,
			}),
		);
		mesh.position.set(x, y, -280);
		mesh.rotation.set(Math.random(), Math.random(), 0);
		makeBody({ kind: "obstacle", mesh }, 3.7, 32, 1);
		game.nextObstacle = game.time + (game.route === "storm" ? 3.5 : 7);
	}
}

					{ kind: "hostile", mesh, velocity: vel, damage: 10 },

			}
		} else {
			spawnEnemy("ace", -16, 8, -145);
			spawnEnemy("ace", 16, 18, -145);
		}
		game.bossNext = game.time + (b.exposed ? 1.6 : 2.8);
	}
}
function complete() {
	if (!game || game.finished) return;
	game.finished = true;
	audio.sfx("victory");
	if (game.boss) {
		const p = game.boss.mesh.position.clone();
		explosion(p, 0xffb76d, 9);
		scene.remove(game.boss.mesh);
		game.boss = null;
		for (const e of entities)
			if (e.kind === "core" || e.kind === "hostile") remove(e);
	}
	game.score += Math.round(game.health * 20) + (game.wingSaved ? 2000 : 0);
	if (game.score > record && !game.attract) {
		record = game.score;
		try {
			localStorage.setItem("fennec.record", record);
		} catch {}
	}
	ui.notice(
		"MISSION ACCOMPLISHED",
		"Asterion is clear. Bring it home, squadron.",
	);
	ui.comms(
		"ROOK",
		game.wingSaved
			? "That was one beautiful piece of flying. First round is on me."
			: "You did it, lead. See you back at the hangar.",
	);
	const attract = game.attract;
	const session = game;
	setTimeout(() => {
		if (game !== session || !game?.finished) return;
		if (attract) start(true);
		else screen("results", resultData(true));
	}, 4500);
}
function resultData(won) {
	const accuracy = Math.min(
		100,
		Math.round((game.hits / Math.max(1, game.shots)) * 100),
	);
	const grade = !won
		? "FLIGHT LOST"
		: game.score >= 26000
			? "S"
			: game.score >= 17000
				? "A"
				: game.score >= 9000
					? "B"
					: "C";
	return {
		won,
		victory: won,
		grade,
		score: game.score,
		kills: game.kills,
		accuracy,
		rings: game.rings,
		record,
		route: game.route === "storm" ? "Storm Pass" : "Iron Convoy",
		wingSaved: game.wingSaved,
		health: Math.ceil(game.health),
		deflections: game.deflections,
		checkpoint: game.checkpoint,
		medal:
			won && game.score >= 17000
				? "ACE PILOT MEDAL"
				: won
					? "MISSION COMPLETE"
					: "REGROUP & RETRY",
		duration: game.time,
	};
}

function explosion(pos, color, size = 1) {
	const m = new THREE.MeshBasicMaterial({
		color,
		transparent: true,
		opacity: 1,
	});
	for (let i = 0; i < Math.ceil(10 * size); i++) {
		const mesh = new THREE.Mesh(
			new THREE.TetrahedronGeometry(
				(0.15 + Math.random() * 0.45) * Math.sqrt(size),
			),
			m,
		);
		mesh.position.copy(pos);
		const velocity = vec(
			(Math.random() - 0.5) * 22,
			(Math.random() - 0.3) * 18,
			(Math.random() - 0.5) * 22,
		).multiplyScalar(Math.sqrt(size));
		scene.add(mesh);
		particles.push({
			mesh,
			velocity,
			life: 0.5 + Math.random() * 0.65,
			max: 1.1,
			material: m,
		});
	}
	const ring = new THREE.Mesh(
		new THREE.TorusGeometry(1, 0.1, 4, 28),
		new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 }),
	);
	ring.position.copy(pos);
	scene.add(ring);
	particles.push({
		mesh: ring,
		velocity: vec(),
		life: 0.65,
		max: 0.65,
		ring: true,
		size: size * 12,
		material: ring.material,
	});
}
function floating(label, p) {
	const el = document.createElement("div");
	el.className = "score-float";
	el.textContent = label;
	document.body.append(el);
	floats.push({ el, p: p.clone(), life: 1.1 });
}
function updateEffects(dt) {
	for (const p of particles) {
		p.life -= dt;
		p.mesh.position.addScaledVector(p.velocity, dt);
		p.mesh.rotation.x += dt * 3;
		p.mesh.rotation.y += dt * 2;
		if (p.ring) {
			p.mesh.scale.setScalar(1 + (1 - p.life / p.max) * p.size);
			p.material.opacity = Math.max(0, p.life / p.max);
		} else p.mesh.scale.multiplyScalar(Math.max(0.01, 1 - dt * 1.5));
		if (p.life <= 0) {
			scene.remove(p.mesh);
			p.mesh.geometry.dispose();
		}
	}
	particles = particles.filter((p) => p.life > 0);
	for (const f of floats) {
		f.life -= dt;
		f.p.y += dt * 5;
		const p = f.p.clone().project(camera);
		f.el.style.left = `${(p.x * 0.5 + 0.5) * innerWidth}px`;
		f.el.style.top = `${(-p.y * 0.5 + 0.5) * innerHeight}px`;
		f.el.style.opacity = Math.min(1, f.life * 2);
		if (f.life <= 0) f.el.remove();
	}
	floats = floats.filter((f) => f.life > 0);
}
function updateHUD() {
	const a = aim.clone().project(camera);
	let lock = null;
	if (currentLock && !currentLock.dead) {
		const p = currentLock.mesh.position.clone().project(camera);
		lock = {
			x: p.x * 0.5 + 0.5,
			y: -p.y * 0.5 + 0.5,
			progress: lockTime,
			locked: lockTime > 0.95,
		};
	}
	const phase = phases[game.phase] || phases[0];
	ui.hud({
		score: game.score,
		health: game.health,
		maxHealth: game.maxHealth,
		shield: game.health / game.maxHealth,
		boost: game.boost / 100,
		boosting: game.boosting,
		braking: game.braking,
		bombs: game.bombs,
		charge: game.charge / 1.5,
		level: game.level,
		laserLevel: game.level - 1,
		combo: Math.min(4, Math.max(1, Math.ceil(game.combo / 3))),
		phaseNumber: game.phase + 1,
		phaseLabel: phase.name,
		phase:
			game.phase === 4
				? `Rescue Rook · ${Math.min(5, game.rescueKills)} / 5 interceptors`
				: game.boss
					? game.boss.exposed
						? "Reactor exposed · finish the carrier"
						: "Break both engines · reactor shielded"
					: phase.sub,
		objective:
			game.phase === 4
				? `Rescue Rook · ${Math.min(5, game.rescueKills)} / 5 interceptors`
				: game.boss
					? game.boss.exposed
						? "Reactor exposed · finish the carrier"
						: "Break both engines · reactor shielded"
					: phase.sub,
		progress: Math.min(1, game.time / 210),
		time: game.time,
		rings: game.rings,
		aimX: a.x,
		aimY: a.y,
		targetX: lock ? lock.x * 2 - 1 : null,
		targetY: lock ? 1 - lock.y * 2 : null,
		locked: !!lock?.locked,
		lockProgress: game.charge > 0 ? Math.min(1, game.charge / 0.7) : 0,
		lock,
		lockStatus: lock ? (lock.locked ? "TARGET LOCKED" : "ACQUIRING") : "",
		bossHp: game.boss ? game.boss.hp / 150 : null,
		bossName: "SUN EATER / ASSAULT CARRIER",
		attract: game.attract,
		lowHealth: game.health < 30,
		route: game.route,
		wingSaved: game.wingSaved,
	});
}

boot();

document.getElementById('boot-failure')?.remove();
</script>
