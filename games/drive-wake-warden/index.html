<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wake Warden: The Ironwater Run</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#07151c; }
body { display:grid; place-items:center; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#shell { position:relative; width:min(100vw,150vh); aspect-ratio:3/2; max-height:100vh; border:4px solid #d7bf82; background:#081b24; box-shadow:0 0 0 4px #172e35,0 18px 70px #000b,0 0 40px #36d6d733; }
canvas { display:block; width:100%; height:100%; image-rendering:pixelated; touch-action:none; }
#shell::after { content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,#08101626 4px),linear-gradient(90deg,#03131a2c,transparent 8%,transparent 92%,#03131a2c); mix-blend-mode:multiply; }
#hint { position:fixed; left:0; right:0; bottom:5px; text-align:center; color:#81989a; font-size:10px; letter-spacing:.12em; pointer-events:none; }
</style>
</head>
<body>
<div id="shell"><canvas id="game" width="960" height="640" aria-label="Wake Warden arcade river game"></canvas></div>
<div id="hint">ARROWS / WASD STEER &nbsp; · &nbsp; SPACE FIRE &nbsp; · &nbsp; SHIFT BOOST &nbsp; · &nbsp; P PAUSE &nbsp; · &nbsp; M SOUND</div>
<script>
(() => {
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 640, TOP = 66, BOTTOM = 605;
ctx.imageSmoothingEnabled = false;
let state = 'title';
let stage = 0;
let score = 0;
let best = 0;
let worldScroll = 0;
let clock = 0;
let stageClock = 0;
let clearClock = 0;
let spawnHazardClock = 0;
let spawnEnemyClock = 0;
let spawnTargetClock = 0;
let spawnTargets = 0;
let progress = 0;
let shake = 0;
let soundOn = true;
let audio = null;
let touchMode = matchMedia('(pointer:coarse)').matches;
let keys = new Set();
let pointers = new Map();
let mouseAim = null;
let boss = null;
let entities = { hazards:[], targets:[], enemies:[], bullets:[], particles:[], pickups:[] };
let player = { x:480, y:500, lives:3, invuln:0, boost:100, shotClock:0, wakeClock:0, shield:0 };
const stageInfo = [
  { name:'RAPID GATE', objective:'COLLECT 6 SIGNAL RINGS', target:6 },
  { name:'LIFELINE', objective:'RESCUE 5 RIVER RUNNERS', target:5 },
  { name:'IRON EEL', objective:'BREAK THE EEL BOSS ARMOR', target:22 }
];
try { best = Number(localStorage.getItem('wakeWardenBest') || 0); } catch (_) {}

function fitCanvas() {
  const shell = document.getElementById('shell');
  const scale = Math.min(innerWidth / W, innerHeight / H);
  shell.style.width = `${Math.floor(W * scale)}px`;
  shell.style.height = `${Math.floor(H * scale)}px`;
}
addEventListener('resize', fitCanvas); fitCanvas();

function riverCenter(y) {
  return 480 + Math.sin((worldScroll + y) * 0.0031) * 58 + Math.sin((worldScroll + y) * 0.0073) * 19;
}
function riverHalf(y) { return 355 + Math.sin((worldScroll + y) * 0.0022) * 19; }
function bounds(y) { const c = riverCenter(y), h = riverHalf(y); return [c-h, c+h]; }
function rand(min,max) { return min + Math.random() * (max-min); }
function clamp(v,a,b) { return Math.max(a,Math.min(b,v)); }
function tone(kind) {
  if (!soundOn) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const data = { shot:[520,.045,'square'], pop:[180,.13,'square'], hit:[95,.24,'sawtooth'], pickup:[760,.12,'triangle'], clear:[900,.35,'triangle'], boss:[130,.26,'sawtooth'] }[kind] || [400,.1,'square'];
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = data[2]; osc.frequency.setValueAtTime(data[0], audio.currentTime);
    if (kind === 'hit' || kind === 'boss') osc.frequency.exponentialRampToValueAtTime(55, audio.currentTime + data[1]);
    gain.gain.setValueAtTime(.035, audio.currentTime); gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + data[1]);
    osc.connect(gain); gain.connect(audio.destination); osc.start(); osc.stop(audio.currentTime + data[1]);
  } catch (_) {}
}
function startRun() {
  score=0; stage=0; player={x:480,y:500,lives:3,invuln:1.2,boost:100,shotClock:0,wakeClock:0,shield:0};
  beginStage(); state='play'; tone('clear');
}
function beginStage() {
  stageClock=0; clearClock=0; spawnHazardClock=.5; spawnEnemyClock=1.4; spawnTargetClock=1.2; spawnTargets=0; progress=0;
  entities={hazards:[],targets:[],enemies:[],bullets:[],particles:[],pickups:[]};
  boss=null; player.x=480; player.y=500; player.invuln=1.35; player.shotClock=0;
  if (stage===2) boss={x:480,y:130,hp:stageInfo[2].target,maxHp:stageInfo[2].target,age:0,shotClock:1.5,flash:0};
}
function storeBest() {
  if (score>best) { best=score; try { localStorage.setItem('wakeWardenBest', String(best)); } catch (_) {} }
}
function endRun(won) {
  if (won) score += player.lives * 1000;
  storeBest(); state=won ? 'win' : 'gameover'; tone(won ? 'clear' : 'hit');
}
function clearStage() {
  if (state!=='play') return;
  state='clear'; clearClock=0; score += (stage+1)*900 + player.lives*120; tone('clear');
}
function advanceStage() {
  if (stage<2) { stage++; beginStage(); state='play'; }
  else endRun(true);
}
function action() {
  if (state==='title') startRun();
  else if (state==='clear') advanceStage();
  else if (state==='gameover' || state==='win') startRun();
  else if (state==='paused') state='play';
}
function fire() {
  if (player.shotClock>0) return;
  player.shotClock=.18;
  entities.bullets.push({x:player.x-7,y:player.y-18,vx:0,vy:-590,owner:'p',life:1.5});
  entities.bullets.push({x:player.x+7,y:player.y-18,vx:0,vy:-590,owner:'p',life:1.5});
  tone('shot');
}
function spawnHazard() {
  const [l,r]=bounds(80), x=rand(l+42,r-42);
  const types=['rock','log','mine'];
  entities.hazards.push({type:types[Math.floor(rand(0,types.length))],x,y:TOP+12,vy:rand(145,215),spin:rand(0,6),hp:1});
}
function spawnTarget() {
  const [l,r]=bounds(78), x=rand(l+58,r-58);
  if(stage===0) entities.targets.push({type:'ring',x,y:TOP-12,vy:150,phase:rand(0,7)});
  else if(stage===1) entities.targets.push({type:'swimmer',x,y:TOP-15,vy:rand(125,155),phase:rand(0,7)});
  spawnTargets++;
}
function spawnEnemy() {
  if (entities.enemies.length>=3) return;
  const [l,r]=bounds(100);
  entities.enemies.push({x:rand(l+60,r-60),y:TOP-24,vx:rand(-55,55),vy:rand(105,140),hp:2,age:0,shot:rand(.8,1.9),phase:rand(0,7)});
}
function addBurst(x,y,color,n=9) {
  for(let i=0;i<n;i++) entities.particles.push({x,y,vx:rand(-145,145),vy:rand(-160,90),life:rand(.22,.56),max:.56,color,size:rand(2,5)});
}
function damagePlayer() {
  if(player.invuln>0 || state!=='play') return;
  player.lives--; player.invuln=1.5; player.shield=0; shake=.4; addBurst(player.x,player.y,'#f47d49',16); tone('hit');
  if(player.lives<=0) endRun(false);
  else { player.x=480; player.y=500; }
}
function hitTest(a,b,r=24) { const dx=a.x-b.x,dy=a.y-b.y; return dx*dx+dy*dy<r*r; }
function collectTarget(t) {
  if(t.type==='ring') { progress++; score+=250; addBurst(t.x,t.y,'#f8d963',12); }
  else { progress++; score+=500; player.shield=Math.max(player.shield,3.5); addBurst(t.x,t.y,'#85f2ce',14); }
  tone('pickup');
  if(progress>=stageInfo[stage].target) clearStage();
}
function currentInput() {
  const out={x:0,y:0,fire:keys.has(' ')||keys.has('j'),boost:keys.has('shift')||keys.has('z')};
  if(keys.has('arrowleft')||keys.has('a')) out.x--;
  if(keys.has('arrowright')||keys.has('d')) out.x++;
  if(keys.has('arrowup')||keys.has('w')) out.y--;
  if(keys.has('arrowdown')||keys.has('s')) out.y++;
  for(const p of pointers.values()) {
    if(p.kind==='pad') { out.x+=p.dx; out.y+=p.dy; }
    if(p.kind==='shoot') out.fire=true;
    if(p.kind==='boost') out.boost=true;
    if(p.kind==='mouse') { mouseAim={x:p.x,y:p.y}; out.fire=true; }
  }
  out.x=clamp(out.x,-1,1); out.y=clamp(out.y,-1,1);
  return out;
}
function update(dt) {
  clock+=dt; worldScroll+=dt*168;
  if (shake>0) shake=Math.max(0,shake-dt);
  if (state==='paused' || state==='title' || state==='gameover' || state==='win') return;
  if(state==='clear') { clearClock+=dt; if(clearClock>4.3) advanceStage(); return; }
  if(state!=='play') return;
  stageClock+=dt;
  if(stageClock>(stage===2?55:48)) { endRun(false); return; }
  const input=currentInput();
  const boosting=input.boost && player.boost>0;
  const speed=boosting?430:285;
  if(boosting) player.boost=Math.max(0,player.boost-49*dt); else player.boost=Math.min(100,player.boost+21*dt);
  const xMul=(input.x && input.y)?0.72:1;
  player.x+=input.x*speed*xMul*dt; player.y+=input.y*speed*.78*xMul*dt;
  if(mouseAim) {
    player.x+=(mouseAim.x-player.x)*Math.min(1,dt*5.2);
    player.y+=(mouseAim.y-player.y)*Math.min(1,dt*5.2);
  }
  const [left,right]=bounds(player.y);
  player.x=clamp(player.x,left+32,right-32); player.y=clamp(player.y,TOP+80,BOTTOM-62);
  if(input.fire) fire();
  player.shotClock=Math.max(0,player.shotClock-dt); player.invuln=Math.max(0,player.invuln-dt); player.shield=Math.max(0,player.shield-dt);
  player.wakeClock-=dt;
  if(player.wakeClock<=0) { player.wakeClock=.055; entities.particles.push({x:player.x+rand(-8,8),y:player.y+20,vx:rand(-18,18),vy:rand(45,90),life:.27,max:.27,color:boosting?'#a5f8ed':'#76d5d3',size:rand(3,7)}); }
  spawnHazardClock-=dt; if(spawnHazardClock<=0) { spawnHazard(); spawnHazardClock=stage===2?rand(.85,1.25):rand(.95,1.35); }
  spawnEnemyClock-=dt; if(stage<2 && spawnEnemyClock<=0) { spawnEnemy(); spawnEnemyClock=rand(2.6,3.6); }
  if(stage<2) {
    spawnTargetClock-=dt;
    if(spawnTargetClock<=0) { spawnTarget(); spawnTargetClock=stage===0?rand(2.6,3.15):rand(2.05,2.55); }
  }
  for(const h of entities.hazards) { h.y+=h.vy*dt; h.spin+=dt*1.6; }
  for(const t of entities.targets) { t.y+=t.vy*dt; t.phase+=dt*4; }
  for(const e of entities.enemies) {
    e.age+=dt; e.y+=e.vy*dt; e.x+=Math.sin(e.age*2+e.phase)*42*dt+e.vx*dt*.2; e.shot-=dt;
    if(e.shot<=0 && e.y>TOP+20 && e.y<BOTTOM-80) {
      const dx=player.x-e.x,dy=player.y-e.y,len=Math.max(1,Math.hypot(dx,dy));
      entities.bullets.push({x:e.x,y:e.y+14,vx:dx/len*185,vy:dy/len*185+90,owner:'e',life:3}); e.shot=rand(1.4,2.2);
    }
  }
  if(boss) {
    boss.age+=dt; boss.x=480+Math.sin(boss.age*.72)*205+Math.sin(boss.age*1.6)*35; boss.shotClock-=dt; boss.flash=Math.max(0,boss.flash-dt);
    if(boss.shotClock<=0) {
      for(const angle of [-.29,0,.29]) entities.bullets.push({x:boss.x,y:boss.y+33,vx:Math.sin(angle)*220,vy:265,owner:'e',life:3});
      boss.shotClock=1.1; tone('boss');
    }
  }
  for(const b of entities.bullets) { b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; }
  for(const p of entities.pickups) { p.y+=p.vy*dt; p.phase+=dt*4; }
  // Player shots damage boats, hazards and the boss.
  for(const b of entities.bullets) if(b.owner==='p'&&b.life>0) {
    for(const e of entities.enemies) if(e.hp>0&&hitTest(b,e,23)) { e.hp--; b.life=0; addBurst(b.x,b.y,'#f3bc62',4); if(e.hp<=0){score+=450; addBurst(e.x,e.y,'#f47d49',12); tone('pop'); if(Math.random()<.18) entities.pickups.push({x:e.x,y:e.y,vy:115,phase:0});} break; }
    if(b.life>0) for(const h of entities.hazards) if(h.hp>0 && hitTest(b,h,h.type==='log'?29:21)) { h.hp=0; b.life=0; score+=100; addBurst(h.x,h.y,'#c7d0aa',6); break; }
    if(b.life>0&&boss&&Math.abs(b.x-boss.x)<77&&Math.abs(b.y-boss.y)<39) { boss.hp--; boss.flash=.12; b.life=0; score+=80; addBurst(b.x,b.y,'#f8df84',3); if(boss.hp<=0) { score+=5000; addBurst(boss.x,boss.y,'#ff8b4b',36); clearStage(); } }
  }
  // Contact damage and pickups.
  if(state==='play') {
    for(const h of entities.hazards) if(h.hp>0&&hitTest(player,h,h.type==='log'?31:23)) { h.hp=0; if(player.shield<=0&&!boosting) damagePlayer(); else addBurst(h.x,h.y,'#e4d49a',5); }
    for(const e of entities.enemies) if(e.hp>0&&hitTest(player,e,27)) { e.hp=0; if(player.shield<=0&&!boosting) damagePlayer(); else score+=150; }
    for(const b of entities.bullets) if(b.owner==='e'&&b.life>0&&hitTest(player,b,17)) { b.life=0; if(player.shield<=0&&!boosting) damagePlayer(); else addBurst(b.x,b.y,'#fdca67',4); }
    for(const t of entities.targets) if(hitTest(player,t,t.type==='ring'?28:23)) { t.got=true; collectTarget(t); }
    for(const p of entities.pickups) if(hitTest(player,p,24)) { p.got=true; player.shield=6; score+=200; tone('pickup'); }
  }
  for(const p of entities.particles) { p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; p.vx*=.98; p.vy*=.98; }
  entities.hazards=entities.hazards.filter(h=>h.y<TOP+610&&h.hp>0);
  entities.targets=entities.targets.filter(t=>t.y<TOP+600&&!t.got);
  entities.enemies=entities.enemies.filter(e=>e.y<TOP+600&&e.hp>0);
  entities.bullets=entities.bullets.filter(b=>b.life>0&&b.y>TOP-20&&b.y<BOTTOM+20&&b.x>-30&&b.x<W+30);
  entities.particles=entities.particles.filter(p=>p.life>0);
  entities.pickups=entities.pickups.filter(p=>p.y<BOTTOM+30&&!p.got);
}

function rect(x,y,w,h,color) { ctx.fillStyle=color; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function text(str,x,y,size=16,color='#f4e6bb',align='left') { ctx.font=`bold ${size}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.fillStyle=color; ctx.fillText(str,x,y); }
function drawRiver() {
  rect(0,TOP,W,BOTTOM-TOP,'#0c7481');
  // River banks follow two slow bends.
  ctx.fillStyle='#274d37'; ctx.beginPath(); ctx.moveTo(0,TOP);
  for(let y=TOP;y<=BOTTOM;y+=12) ctx.lineTo(bounds(y)[0],y);
  ctx.lineTo(0,BOTTOM); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#274d37'; ctx.beginPath(); ctx.moveTo(W,TOP);
  for(let y=TOP;y<=BOTTOM;y+=12) ctx.lineTo(bounds(y)[1],y);
  ctx.lineTo(W,BOTTOM); ctx.closePath(); ctx.fill();
  // Sandy edges and dark river margins.
  for(const side of [0,1]) {
    ctx.beginPath(); for(let y=TOP;y<=BOTTOM;y+=10) { const [l,r]=bounds(y); const x=side===0?l:r; if(y===TOP)ctx.moveTo(x,y);else ctx.lineTo(x,y); }
    ctx.strokeStyle='#a27a49'; ctx.lineWidth=8; ctx.stroke();
    ctx.beginPath(); for(let y=TOP;y<=BOTTOM;y+=10) { const [l,r]=bounds(y); const x=side===0?l+12:r-12; if(y===TOP)ctx.moveTo(x,y);else ctx.lineTo(x,y); }
    ctx.strokeStyle='#145c69'; ctx.lineWidth=4; ctx.stroke();
  }
  // Moving water streaks and blocky foam.
  for(let i=0;i<36;i++) {
    const y=TOP+((i*43+worldScroll*.72)%530), c=riverCenter(y), spread=Math.sin(i*44.7)*255;
    const x=clamp(c+spread,bounds(y)[0]+18,bounds(y)[1]-42);
    const len=14+(i*17%52); rect(x,y,len,2,i%3===0?'#65bfad':'#258d91');
    if(i%4===0) rect(x+len+6,y+4,7,2,'#9cdbb4');
  }
  for(let y=TOP+((worldScroll*.95)%60);y<BOTTOM;y+=60) {
    const c=riverCenter(y); rect(c-2,y,4,9,'#bce2bd'); rect(c+5,y+6,9,2,'#bce2bd');
  }
  // Pixel shrubs and stones on the banks.
  for(let i=0;i<24;i++) {
    const y=TOP+((i*31+worldScroll*.38)%530), [l,r]=bounds(y), side=i%2?1:0;
    const offset=12+((i*17)%28); const x=side===0?Math.max(6,l-offset):Math.min(W-28,r+offset);
    const c=['#3f7545','#5b8b4f','#7b9c53','#365f43'][i%4];
    rect(x,y,14,9,c); rect(x+4,y-4,7,6,c); rect(x+3,y+7,4,3,'#9b7647');
    if(i%5===0) { rect(side===0?l-5:r-2,y+15,17,8,'#7e775d'); rect(side===0?l-1:r+2,y+13,9,5,'#a39a76'); }
  }
}
function drawRing(t) {
  const pulse=1+Math.sin(t.phase)*.08, x=t.x,y=t.y;
  ctx.save(); ctx.translate(x,y); ctx.scale(pulse,pulse);
  ctx.strokeStyle='#ffe58b'; ctx.lineWidth=6; ctx.beginPath(); ctx.ellipse(0,0,17,12,0,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='#ee9b48';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,11,7,0,0,Math.PI*2);ctx.stroke();
  rect(-4,-18,8,4,'#fff4b2'); ctx.restore();
}
function drawSwimmer(t) {
  const x=t.x,y=t.y, bob=Math.sin(t.phase)*3;
  rect(x-5,y-2+bob,10,10,'#f0a16c'); rect(x-4,y-1+bob,8,6,'#e9c183');
  rect(x-3,y-9+bob,6,5,'#7c3e36'); rect(x-15,y+1+bob,10,3,'#f0a16c'); rect(x+5,y+1+bob,10,3,'#f0a16c');
  rect(x-4,y+8+bob,8,8,'#d7654b'); rect(x-14,y+10+bob,9,3,'#f0a16c'); rect(x+5,y+10+bob,9,3,'#f0a16c');
  rect(x-2,y-1+bob,2,2,'#202f37'); rect(x+2,y-1+bob,2,2,'#202f37');
  ctx.strokeStyle='#d7fff0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,20+Math.sin(t.phase*1.4)*2,0,Math.PI*2);ctx.stroke();
}
function drawHazard(h) {
  const x=h.x,y=h.y;
  if(h.type==='rock') {
    rect(x-18,y-9,35,20,'#696a56');rect(x-13,y-15,24,8,'#86856b');rect(x-9,y-17,9,4,'#aaa383');
    rect(x-16,y+10,30,5,'#3e554f');rect(x-7,y-8,6,4,'#b0a986');
  } else if(h.type==='log') {
    rect(x-24,y-9,48,18,'#78472d');rect(x-20,y-5,39,10,'#a56337');rect(x-19,y-3,37,3,'#bd8045');
    rect(x-24,y-8,7,16,'#d39b5f');rect(x+17,y-8,7,16,'#d39b5f');
  } else {
    ctx.save();ctx.translate(x,y);ctx.rotate(h.spin);rect(-12,-12,24,24,'#7f3f45');rect(-8,-16,16,32,'#b95e4b');rect(-16,-8,32,16,'#b95e4b');rect(-5,-5,10,10,'#f2bd67');rect(-2,-2,4,4,'#fff2a9');ctx.restore();
  }
}
function drawEnemy(e) {
  const x=e.x,y=e.y;
  rect(x-18,y-7,36,18,'#443c49');rect(x-13,y-12,26,10,'#8f4e52');
  rect(x-7,y-17,14,11,'#e0a76a');rect(x-11,y+10,22,5,'#d78556');
  rect(x-3,y-12,6,6,'#95d4cd');rect(x-23,y-2,8,8,'#777575');rect(x+15,y-2,8,8,'#777575');
  rect(x-9,y+15,5,4,'#f6cc70');rect(x+5,y+15,5,4,'#f6cc70');
}
function drawBoss(b) {
  const x=b.x,y=b.y;
  if(b.flash>0 && Math.floor(clock*36)%2===0) ctx.globalAlpha=.55;
  // Broad iron hull, with an eel shaped prow.
  rect(x-78,y-19,156,48,'#26353e');rect(x-65,y-30,130,19,'#a54c43');rect(x-54,y-39,108,13,'#bd6350');
  rect(x-68,y+24,136,14,'#18262d');rect(x-47,y-2,94,24,'#53636a');
  rect(x-31,y-26,62,19,'#d38a5b');rect(x-22,y-23,44,11,'#6ec2bb');
  rect(x-12,y-20,8,4,'#192b35');rect(x+4,y-20,8,4,'#192b35');
  rect(x-4,y-4,8,22,'#e5bd6e');rect(x-45,y+6,16,7,'#d64f43');rect(x+29,y+6,16,7,'#d64f43');
  rect(x-90,y-8,13,19,'#7f8b81');rect(x+77,y-8,13,19,'#7f8b81');
  for(let i=0;i<4;i++){rect(x-50+i*29,y+29,13,5,'#d77b54');}
  ctx.globalAlpha=1;
  rect(x-72,y-51,144,5,'#17262d'); rect(x-72,y-51,144*(b.hp/b.maxHp),5,'#ed6d51');
}
function drawPlayer() {
  if(player.invuln>0&&Math.floor(clock*18)%2===0) return;
  const x=player.x,y=player.y;
  if(player.shield>0) { ctx.strokeStyle='#9df4df';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,30+Math.sin(clock*8)*2,0,Math.PI*2);ctx.stroke(); }
  // Twin jets and a fast orange hull.
  rect(x-21,y+9,8,19,'#263641');rect(x+13,y+9,8,19,'#263641');
  rect(x-19,y+19,5,13,player.boost>0?'#7ff0df':'#f9a957');rect(x+14,y+19,5,13,player.boost>0?'#7ff0df':'#f9a957');
  rect(x-16,y-7,32,31,'#273a46');rect(x-12,y-16,24,18,'#d75d47');rect(x-8,y-24,16,11,'#f0a45b');
  rect(x-5,y-19,10,9,'#75d4cf');rect(x-2,y-16,4,4,'#dbfff0');
  rect(x-20,y+4,7,12,'#e9bd73');rect(x+13,y+4,7,12,'#e9bd73');
  rect(x-10,y+19,20,5,'#b8463e');
  rect(x-2,y-31,4,7,'#fff0ac');
}
function drawEntities() {
  for(const t of entities.targets) t.type==='ring'?drawRing(t):drawSwimmer(t);
  for(const h of entities.hazards) drawHazard(h);
  for(const e of entities.enemies) drawEnemy(e);
  if(boss) drawBoss(boss);
  for(const p of entities.pickups) { ctx.strokeStyle='#9af3d4';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,11+Math.sin(p.phase)*2,0,Math.PI*2);ctx.stroke();rect(p.x-4,p.y-5,8,10,'#ffed9a'); }
  for(const b of entities.bullets) if(b.owner==='p') {rect(b.x-2,b.y-7,4,13,'#fff1a0');rect(b.x-1,b.y-10,2,5,'#ffaf4f');} else {rect(b.x-4,b.y-4,8,9,'#ee8056');rect(b.x-2,b.y-2,4,4,'#ffdb87');}
  for(const p of entities.particles) {ctx.globalAlpha=clamp(p.life/p.max,0,1);rect(p.x,p.y,p.size,p.size,p.color);}
  ctx.globalAlpha=1;
  drawPlayer();
}
function drawHud() {
  rect(0,0,W,TOP,'#122b34');rect(0,TOP-4,W,4,'#d9bb74');
  rect(12,9,267,47,'#1b3e43');rect(12,9,4,47,'#e2bd76');
  text('WAKE WARDEN',27,24,19,'#f7e7bc');text(`${stage+1}  /  3   ${stageInfo[stage].name}`,27,44,11,'#8ed9c7');
  rect(292,9,171,47,'#1b3e43');text('SCORE',307,21,10,'#8da9a3');text(String(score).padStart(7,'0'),307,40,18,'#f3d07d');
  rect(476,9,171,47,'#1b3e43');text('BEST',491,21,10,'#8da9a3');text(String(best).padStart(7,'0'),491,40,18,'#f3d07d');
  rect(660,9,151,47,'#1b3e43');text('HULL',676,21,10,'#8da9a3');
  for(let i=0;i<3;i++){rect(677+i*29,31,19,12,i<player.lives?'#e36c50':'#3b4e4e');rect(682+i*29,27,9,5,i<player.lives?'#f1bd72':'#546260');}
  rect(824,9,124,47,'#1b3e43');text('BOOST',837,21,10,'#8da9a3');rect(837,32,96,10,'#203a40');rect(837,32,96*player.boost/100,10,'#62d3c1');
  if(state==='play') {
    rect(270,TOP+9,420,27,'#102d35d9');text(stageInfo[stage].objective,480,TOP+22,12,'#f7e6b9','center');
    const total=stageInfo[stage].target;
    for(let i=0;i<total;i++) rect(480-(total*13)/2+i*13,TOP+43,9,4,i<progress?'#f2cc77':'#41666a');
    if(touchMode) drawTouchControls();
  }
}
function drawTouchControls() {
  ctx.globalAlpha=.46; ctx.strokeStyle='#e6f5df';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(122,535,50,0,Math.PI*2);ctx.stroke();rect(117,497,10,76,'#e6f5df');rect(84,530,76,10,'#e6f5df');
  ctx.beginPath();ctx.arc(773,531,38,0,Math.PI*2);ctx.stroke();text('FIRE',773,532,11,'#fff2cf','center');
  ctx.beginPath();ctx.arc(872,500,34,0,Math.PI*2);ctx.stroke();text('BOOST',872,500,10,'#fff2cf','center');ctx.globalAlpha=1;
}
function panel(x,y,w,h) {
  rect(x,y,w,h,'#0b2028ee');rect(x,y,w,4,'#e8c77f');rect(x,y+h-4,w,4,'#e8c77f');rect(x,y,4,h,'#e8c77f');rect(x+w-4,y,4,h,'#e8c77f');
}
function drawOverlay() {
  if(state==='title') {
    ctx.fillStyle='#07151c88';ctx.fillRect(0,TOP,W,BOTTOM-TOP);
    panel(142,142,676,366);
    text('WAKE WARDEN',480,201,39,'#f5e6bc','center');
    text('THE IRONWATER RUN',480,242,17,'#71d4c4','center');
    rect(352,268,256,3,'#b59255');
    text('RACE THE RAPIDS. RESCUE THE STRANDED.',480,301,15,'#f4d78d','center');
    text('THEN TAKE DOWN THE IRON EEL.',480,324,15,'#f4d78d','center');
    text('ARROWS / WASD  STEER     SPACE  FIRE',480,370,12,'#d2e3d0','center');
    text('SHIFT  BOOST     P  PAUSE     M  SOUND',480,391,12,'#d2e3d0','center');
    text(touchMode?'TOUCH PAD  STEER     FIRE / BOOST  ON RIGHT':'ENTER OR CLICK TO LAUNCH',480,433,13,'#fff0b2','center');
    text(`BEST RUN  ${String(best).padStart(7,'0')}`,480,469,11,'#89aaa5','center');
    drawPlayerPreview();
  } else if(state==='paused') {
    ctx.fillStyle='#07151c91';ctx.fillRect(0,TOP,W,BOTTOM-TOP);panel(300,243,360,155);
    text('ON HOLD',480,287,28,'#f4e6bb','center');text('PRESS P OR CLICK TO CONTINUE',480,337,12,'#80d6c4','center');
  } else if(state==='clear') {
    ctx.fillStyle='#07151c88';ctx.fillRect(0,TOP,W,BOTTOM-TOP);panel(255,224,450,194);
    text(stage===2?'IRON EEL DOWN!':'STAGE CLEAR',480,273,29,'#f4e6bb','center');
    text(stage<2?`NEXT UP: ${stageInfo[stage+1].name}`:'RIVER SAVED',480,316,15,'#72d8c5','center');
    text('ENTER / CLICK TO CONTINUE',480,363,12,'#f6d987','center');
    text('AUTO CONTINUE IN A FEW SECONDS',480,394,10,'#819f9b','center');
  } else if(state==='gameover') {
    ctx.fillStyle='#07151caa';ctx.fillRect(0,TOP,W,BOTTOM-TOP);panel(245,213,470,220);
    text('RIVER LOST',480,263,32,'#f47f5b','center');text('THE CURRENT CLAIMS THE RUN.',480,307,14,'#ead8a8','center');
    text(`SCORE  ${String(score).padStart(7,'0')}     BEST  ${String(best).padStart(7,'0')}`,480,347,13,'#9ed9c9','center');
    text('ENTER / CLICK TO RUN IT BACK',480,393,12,'#f4d78d','center');
  } else if(state==='win') {
    ctx.fillStyle='#07151c99';ctx.fillRect(0,TOP,W,BOTTOM-TOP);panel(220,196,520,254);
    text('RIVER SAVED!',480,251,34,'#f8e9ba','center');text('IRONWATER IS YOURS AGAIN.',480,294,15,'#73ddc6','center');
    text(`FINAL SCORE  ${String(score).padStart(7,'0')}`,480,337,17,'#f3cf76','center');
    text(`BEST RUN  ${String(best).padStart(7,'0')}`,480,366,12,'#b0ccc1','center');text('ENTER / CLICK FOR ANOTHER RUN',480,414,12,'#f4d78d','center');
  }
}
function drawPlayerPreview() {
  const ox=480,oy=510; ctx.save();ctx.translate(ox,oy);rect(-21,9,8,19,'#263641');rect(13,9,8,19,'#263641');rect(-16,-7,32,31,'#273a46');rect(-12,-16,24,18,'#d75d47');rect(-8,-24,16,11,'#f0a45b');rect(-5,-19,10,9,'#75d4cf');rect(-2,-16,4,4,'#dbfff0');rect(-20,4,7,12,'#e9bd73');rect(13,4,7,12,'#e9bd73');ctx.restore();
}
function draw() {
  ctx.save();
  if(shake>0) ctx.translate(rand(-5,5)*shake*2,rand(-4,4)*shake*2);
  drawRiver();
  if(state==='title') {
    drawRing({x:330,y:385,phase:clock*2});drawEnemy({x:650,y:180});drawHazard({type:'rock',x:294,y:280,spin:0});
  } else drawEntities();
  drawHud();
  ctx.restore();
  drawOverlay();
  // Fine edge frame and running status lamp.
  rect(0,TOP,W,3,'#dbbd77');rect(0,BOTTOM,W,3,'#dbbd77');
  rect(925,TOP+17,7,7,soundOn?'#75dbab':'#8a6959');
}
function frame(now) {
  if(!frame.last) frame.last=now;
  const dt=Math.min(.034,(now-frame.last)/1000); frame.last=now;
  update(dt); draw(); requestAnimationFrame(frame);
}
function keyName(e) { return e.key.toLowerCase()===' ' ? ' ' : e.key.toLowerCase(); }
addEventListener('keydown',e=>{
  const k=keyName(e);
  if(e.repeat && ['m','p'].includes(k)) return;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys.add(k);
  if(k==='m') {soundOn=!soundOn; if(soundOn) tone('pickup');}
  if(k==='p') { if(state==='play') state='paused'; else if(state==='paused') state='play'; }
  if(['enter',' '].includes(k) && state!=='play') {action();}
});
addEventListener('keyup',e=>keys.delete(keyName(e)));
function coords(e) { const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}; }
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault(); const q=coords(e); canvas.setPointerCapture(e.pointerId);
  if(state!=='play') { action(); return; }
  if(e.pointerType==='touch') {
    touchMode=true;
    if(q.x<230&&q.y>465) { pointers.set(e.pointerId,{kind:'pad',dx:0,dy:0,x:q.x,y:q.y}); updatePad(e.pointerId,q); }
    else if(q.x>820&&q.y>440) pointers.set(e.pointerId,{kind:'boost'});
    else if(q.x>680&&q.y>465) pointers.set(e.pointerId,{kind:'shoot'});
    else pointers.set(e.pointerId,{kind:'shoot'});
  } else pointers.set(e.pointerId,{kind:'mouse',x:q.x,y:q.y});
});
canvas.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)) return; const q=coords(e), p=pointers.get(e.pointerId);
  if(p.kind==='pad') updatePad(e.pointerId,q);
  else if(p.kind==='mouse') { p.x=q.x;p.y=q.y; }
});
function updatePad(id,q) {
  const dx=clamp((q.x-122)/48,-1,1), dy=clamp((q.y-535)/48,-1,1);
  pointers.set(id,{kind:'pad',dx,dy,x:q.x,y:q.y});
}
function clearPointer(e) { pointers.delete(e.pointerId); if(![...pointers.values()].some(p=>p.kind==='mouse'))mouseAim=null; }
canvas.addEventListener('pointerup',clearPointer);canvas.addEventListener('pointercancel',clearPointer);canvas.addEventListener('lostpointercapture',clearPointer);
requestAnimationFrame(frame);
})();
</script>
