STAR LOCKS 64 — an original spiritual successor to Starfox 64 (N64)
Title picked by RNG (Python secrets.choice) from 50 brainstormed riffs.

SOURCE INFORMATION
- Date: 2026-10-26 13:50
- Source: Starfox 64 for N64 (Nintendo, 1997). No original assets, names, music or dialogue used.
- Tech: Three.js r180 (0.180.0, WebGPURenderer, WebGPU only, no fallback, TSL node materials) · Rapier 0.19.3 (@dimforge/rapier3d-compat; static world colliders, sensor hit volumes, ray/shape queries, dynamic debris rigid bodies) · Web Audio API (procedural tracker music, synthesized SFX, radio "gibberish" voices) · Gamepad API (PS5 standard mapping, rumble via vibrationActuator) · vanilla JS ES modules, HTML/CSS overlay UI · Google Fonts (Russo One, Exo 2) · all loaded from jsDelivr / Google CDNs
- Art Direction: stylized cel-shading — MeshToonNodeMaterial with a hard 3-step ramp, inverted-hull ink outlines (world-space constant thickness via modelScale, smooth-normal hull geometry), two-band cel fireballs, flat gradient sky, procedural TSL ground patterns (farmland, city grid, animated sea)
- Animation: code-driven procedural animation (no keyframes/skeletons): spring/damped flight dynamics, banking, barrel rolls, somersault/U-turn maneuvers, walker leg cycles, boss armor plates, path-function enemy formations, scripted cinematic cameras, Rapier-simulated wreckage
- Testing: lightweight only — node —check syntax validation and a headless Chromium (SwiftShader WebGPU) smoke test reading console errors and driving game states programmatically; no screenshots, no visual review, no judge/adversarial reviews, no subagents (as required by the task)
- Environment: Claude Code CLI (headless); Linux (WSL2); browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort medium
- Usage: unknown (no cost/token/session-time telemetry available to the model)

TESTING FEEDBACK
- Issues caught by testing: 1 real game bug — the attract-mode idle timer wasn't reset when new screens opened, so after watching the ending, the credits screen dropped straight into the AI demo (and a session started from there stayed flagged as "attract", flown by the AI in god mode). Fixed: the idle timer now resets on every screen, and starting a session clears the attract flag. Zero JavaScript runtime errors in any tested flow. Two other failures were bugs in the test script, not the game.
- Critical / game-breaking: 0 crashes or soft-locks found. The attract-mode leak was the most serious (major, but any button press still got you out of it).
- Most helpful test: a scripted end-to-end walk in headless Chromium (SwiftShader WebGPU) through every state — title → mission → rail events up to the boss → stage results → all-range with Jackal Squadron and the Dreadnought → ending → credits → versus with 1 player + 3 CPUs and with 4 split-screen humans → 3-player co-op → game over → continue → all attract segments → exit — plus a setter trap on the god-mode flag that pinpointed the attract bug.
- Least helpful test: the menu FPS measurement under SwiftShader; software rendering says nothing about real GPU performance.
- Also verified: laser hit registration and item drops, charge lock-on, bomb, barrel roll, somersault, boost, U-turn, pause toggle, and the gamepad invert-horizontal/vertical toggles (with a mocked navigator.getGamepads).

ENGINE FEEDBACK
- Liked most: TSL node materials — the toon ramp, ink outlines, sky, cel fireballs and procedural ground are each a few lines of JS with no GLSL/WGSL strings. Rapier's query API (castRay with group filters and a predicate) made weapons trivially robust against fast projectiles.
- Stuck / guessed wrong: WebGPURenderer.setViewport is documented as lower-left origin, but the WebGPU backend passes coordinates straight through (top-left), so split-screen layout had to be verified in source. Rapier 0.19 renamed hit.toi to hit.timeOfImpact; handled both.
- Most important thing built myself: the rail framework (curved corridor frame lookup, rail-relative enemy path functions, streamed scenery chunks, data-driven event timelines with route branching) plus the unified Pad model so AI, attract mode and 1–4 humans all fly the same Ship code.
- Hardest part: getting gap-free outlines on hard-edged primitives at any non-uniform scale (solved with merged smooth-normal hull geometry and modelScale-compensated offsets), and split-screen with per-viewport shadow focus.
- Remove/overhaul: the split between three.js "core" and "webgpu" builds and their import-map aliases (three vs three/webgpu vs three/tsl) is easy to get wrong for addons.
- Change one thing: built-in per-object outline/ink support (or a documented ToonOutlinePass that works with scissored split-screen viewports).

PROMPT FEEDBACK
- Liked most: very clear deliverable spec (file naming, single-file bundle, required sections) and the explicit permission to ignore performance, which let the scope go to content.
- Confusing: "4-player multiplayer" could mean co-op or versus — both were implemented (1–4 player split-screen co-op Mission Mode, 2–4 player split-screen Versus with CPU fill). "Write unknown for anything you can't confirm" vs required usage estimates — usage is reported as unknown.
- Hardest: fitting a full Starfox-style vertical slice (rail stage with branching route, mid-boss, boss, all-range stage with rival squadron and capital ship, versus, attract mode, comms, menus) into one coherent codebase without visual review.
- One test I'd run: a real-GPU playthrough with a physical DualSense on Chrome/Safari to tune feel, readability and difficulty, plus a frame-time capture for the 4-player split-screen case.

HOW TO PLAY
Steer with the left stick (WASD). Tap ✕ (Space/J/click) to fire; hold to charge a homing lock-on shot. ○ (K) bomb. R2 (Shift) boost, L2 (Ctrl/C) brake. Double-tap L1/R1 (Q/E) to barrel roll and deflect shots; hold to bank. △ (F) somersault. □ (R) U-turn in all-range mode. OPTIONS (Esc/P) pause. CREATE (V) camera.
Fly through all six golden arches on Verdalis to unlock the secret canyon route. Collect 3 gold rings to extend your shield. Laser items upgrade single → twin → hyper lasers and repair broken wings. Save your wingmen when they call for help!

CREDITS
Design, code, art, music and writing: generated by Claude (claude-opus-5-5) for this demo.
Characters: Kit Ember, Skye Talonsby, Bramble Oakhart, Pip Marsh, General Marlowe, B.O.L.T., Jackal Squadron (Vex Corsac, Mink Slyver, Brute Hoggard), Emperor Mandrillo — all original.
Libraries: three.js (MIT), Rapier (Apache-2.0).

const BTN = ['fire', 'bomb', 'boost', 'brake', 'l1', 'r1', 'loop', 'uturn', 'pause', 'confirm', 'back', 'up', 'down', 'left', 'right', 'cam', 'any'];
class Pad {
  constructor(id, kind, index) {
    this.id = id; this.kind = kind; this.index = index;
    this.lx = 0; this.ly = 0; this.cur = {}; this.prev = {}; this.repeat = {};
    for (const b of BTN) { this.cur[b] = false; this.prev[b] = false; this.repeat[b] = 0; }
    this.connected = true; this.lastActive = 0;
  }
  down(b) { return this.cur[b]; }
  pressed(b) { return this.cur[b] && !this.prev[b]; }
  released(b) { return !this.cur[b] && this.prev[b]; }
  // menu navigation with auto-repeat
  nav(b, dt) {
    if (this.pressed(b)) { this.repeat[b] = 0.38; return true; }
    if (this.cur[b]) { this.repeat[b] -= dt; if (this.repeat[b] <= 0) { this.repeat[b] = 0.11; return true; } }
    return false;
  }
}

const Input = {
  keys: new Set(), mouseDown: false, pads: new Map(), keyboard: null, lastInputTime: performance.now(), anyEdge: false,
  init() {
    this.keyboard = new Pad('kb', 'keyboard', -1);
    this.pads.set('kb', this.keyboard);
    addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].includes(e.key)) e.preventDefault();
      this.keys.add(e.code); this.touch();
    });
    addEventListener('keyup', e => this.keys.delete(e.code));
    addEventListener('blur', () => this.keys.clear());
    addEventListener('mousedown', e => { if (e.button === 0) this.mouseDown = true; this.touch(); });
    addEventListener('mouseup', () => this.mouseDown = false);
    addEventListener('mousemove', () => { this.lastInputTime = performance.now(); });
    addEventListener('gamepadconnected', e => { Game.onPadConnected && Game.onPadConnected(e.gamepad); });
    addEventListener('gamepaddisconnected', e => { const p = this.pads.get('gp' + e.gamepad.index); if (p) p.connected = false; Game.onPadDisconnected && Game.onPadDisconnected(p); });
  },
  touch() { this.lastInputTime = performance.now(); this.anyEdge = true; },
  update() {
    const k = this.keys, kb = this.keyboard;
    kb.prev = { ...kb.cur };
    const kd = (...c) => c.some(x => k.has(x));
    kb.lx = (kd('KeyD', 'ArrowRight') ? 1 : 0) - (kd('KeyA', 'ArrowLeft') ? 1 : 0);
    kb.ly = (kd('KeyS', 'ArrowDown') ? 1 : 0) - (kd('KeyW', 'ArrowUp') ? 1 : 0);
    if (Settings.data.pilotY) kb.ly = -kb.ly;
    Object.assign(kb.cur, {
      fire: kd('Space', 'KeyJ') || this.mouseDown, bomb: kd('KeyK', 'KeyB'), boost: kd('ShiftLeft', 'ShiftRight'), brake: kd('ControlLeft', 'KeyC', 'ControlRight'),
      l1: kd('KeyQ'), r1: kd('KeyE'), loop: kd('KeyF'), uturn: kd('KeyR'), pause: kd('Escape', 'KeyP'), confirm: kd('Enter', 'Space', 'KeyJ'), back: kd('Escape', 'Backspace'),
      up: kd('ArrowUp', 'KeyW'), down: kd('ArrowDown', 'KeyS'), left: kd('ArrowLeft', 'KeyA'), right: kd('ArrowRight', 'KeyD'), cam: kd('KeyV'),
    });
    kb.cur.any = k.size > 0 || this.mouseDown;
    if (kb.cur.any) kb.lastActive = performance.now();
    // gamepads
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of gps) {
      if (!gp) continue;
      const id = 'gp' + gp.index;
      let p = this.pads.get(id);
      if (!p) { p = new Pad(id, 'gamepad', gp.index); p.name = gp.id; this.pads.set(id, p); }
      p.connected = gp.connected;
      p.prev = { ...p.cur };
      const ax = i => { const v = gp.axes[i] || 0; return Math.abs(v) < 0.18 ? 0 : (v - Math.sign(v) * 0.18) / 0.82; };
      const b = i => { const x = gp.buttons[i]; return !!x && (x.pressed || x.value > 0.4); };
      let lx = ax(0), ly = ax(1);
      if (Settings.data.invertX) lx = -lx;
      if (Settings.data.invertY) ly = -ly;
      if (Settings.data.pilotY) ly = -ly;
      // d-pad also steers
      if (b(14)) lx = -1; if (b(15)) lx = 1; if (b(12)) ly = -1; if (b(13)) ly = 1;
      p.lx = lx; p.ly = ly;
      const rawY = Settings.data.invertY ? -ax(1) : ax(1), rawX = Settings.data.invertX ? -ax(0) : ax(0);
      Object.assign(p.cur, {
        fire: b(0), bomb: b(1), uturn: b(2), loop: b(3), l1: b(4), r1: b(5), brake: b(6), boost: b(7), cam: b(8), pause: b(9),
        confirm: b(0), back: b(1),
        up: b(12) || rawY < -0.55, down: b(13) || rawY > 0.55, left: b(14) || rawX < -0.55, right: b(15) || rawX > 0.55,
      });
      p.cur.any = gp.buttons.some(x => x && x.pressed) || gp.axes.some(a => Math.abs(a) > 0.5);
      if (p.cur.any) { p.lastActive = performance.now(); if (!p.prev.any) this.touch(); }
    }
  },
  endFrame() { this.anyEdge = false; },
  // aggregate of every device — for single-player and menus
  anyPressed(b) { for (const p of this.pads.values()) if (p.connected && p.pressed(b)) return true; return false; },
  anyNav(b, dt) { let r = false; for (const p of this.pads.values()) if (p.connected && p.nav(b, dt)) r = true; return r; },
  gamepadCount() { let n = 0; for (const p of this.pads.values()) if (p.kind === 'gamepad' && p.connected) n++; return n; },
  rumble(pad, strong = 0.5, weak = 0.5, ms = 150) {
    if (!Settings.data.rumble || !pad) return;
    const list = pad === 'all' ? [...this.pads.values()] : [pad];
    for (const p of list) {
      if (p.kind !== 'gamepad') continue;
      const gp = navigator.getGamepads()[p.index];
      const act = gp && gp.vibrationActuator;
      if (act && act.playEffect) act.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong, weakMagnitude: weak }).catch(() => {});
    }
  },
};

// Merged pad: reads from all devices (single-player / attract exit)
class MergedPad extends Pad {
  constructor() { super('merged', 'merged', -2); }
  sync() {
    this.prev = { ...this.cur };
    let lx = 0, ly = 0;
    for (const b of BTN) this.cur[b] = false;
    for (const p of Input.pads.values()) {
      if (!p.connected) continue;
      if (Math.abs(p.lx) > Math.abs(lx)) lx = p.lx;
      if (Math.abs(p.ly) > Math.abs(ly)) ly = p.ly;
      for (const b of BTN) if (p.cur[b]) this.cur[b] = true;
    }
    this.lx = lx; this.ly = ly;
  }
}
// Pad used by AI pilots (attract mode / CPU)
class AIPad extends Pad {
  constructor() { super('ai', 'ai', -3); }
  set(state) { this.prev = { ...this.cur }; for (const b of BTN) this.cur[b] = !!state[b]; this.lx = state.lx || 0; this.ly = state.ly || 0; }
}

const Sound = {
  ctx: null, master: null, musicBus: null, sfxBus: null, noise: null, song: null, songName: null, step: 0, nextTime: 0, voiceSrcs: [],
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.9;
    const comp = this.ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    this.master.connect(comp); comp.connect(this.ctx.destination);
    this.musicBus = this.ctx.createGain(); this.musicBus.connect(this.master);
    this.sfxBus = this.ctx.createGain(); this.sfxBus.connect(this.master);
    this.applyVolumes();
    const len = this.ctx.sampleRate * 1.5; const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    setInterval(() => this.schedule(), 25);
  },
  resume() { if (!this.ctx) this.init(); if (this.ctx && this.ctx.state !== 'running') this.ctx.resume(); },
  applyVolumes() { if (!this.ctx) return; this.musicBus.gain.value = Settings.data.music * 0.5; this.sfxBus.gain.value = Settings.data.sfx; },
  // ---------------- music ----------------
  play(name) {
    if (!this.ctx || this.songName === name) return;
    const s = SONGS[name]; if (!s) return;
    if (!s.leadArr) s.leadArr = s.lead.trim().split(/\s+/);
    this.song = s; this.songName = name; this.step = 0; this.nextTime = this.ctx.currentTime + 0.08;
  },
  stopMusic() { this.song = null; this.songName = null; },
  schedule() {
    const s = this.song; if (!s || !this.ctx) return;
    const stepDur = 60 / s.bpm / 4;
    const total = s.leadArr.length;
    while (this.nextTime < this.ctx.currentTime + 0.12) {
      const i = this.step;
      if (i >= total) { if (s.once) { this.song = null; this.songName = null; return; } this.step = 0; continue; }
      const t = this.nextTime;
      const tok = s.leadArr[i];
      if (tok !== '-' && tok !== '.') {
        let len = 1; while (i + len < total && s.leadArr[i + len] === '-') len++;
        this.tone(noteFreq(tok), t, len * stepDur * 0.95, 'square', 0.16, this.musicBus, 0.01, true);
        this.tone(noteFreq(tok) * 1.004, t, len * stepDur * 0.95, 'sawtooth', 0.05, this.musicBus, 0.01);
      }
      const bar = Math.floor(i / 16), sib = i % 16;
      const ch = CH[s.chords[bar % s.chords.length]];
      if (sib % 2 === 0) this.tone(noteFreq(ch[0]) * (sib % 4 === 2 ? 2 : 1), t, stepDur * 1.6, 'sawtooth', 0.15, this.musicBus, 0.005, false, 900);
      this.tone(noteFreq(ch[1 + (sib % (ch.length - 1))]) * 2, t, stepDur * 0.8, 'triangle', 0.05, this.musicBus, 0.002);
      const d = s.drums[sib];
      if (d === 'k' || d === 'x') this.kick(t);
      if (d === 's' || d === 'o') this.snare(t);
      if (d === 'h' || d === 'x' || d === 'o') this.hat(t);
      this.step++; this.nextTime += stepDur;
    }
  },
  tone(freq, t, dur, type, vol, bus, atk = 0.01, vib = false, lp = 0) {
    if (!freq) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (vib && dur > 0.25) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = 5.5; lg.gain.value = freq * 0.012; l.connect(lg); lg.connect(o.frequency); l.start(t + 0.15); l.stop(t + dur + 0.05); }
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + atk); g.gain.setValueAtTime(vol, t + Math.max(atk, dur - 0.04)); g.gain.linearRampToValueAtTime(0, t + dur);
    let node = o;
    if (lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); node = f; }
    node.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.02);
  },

  sfx(name, opt = {}) {

      case 'boom': this.noiseHit(t, 0.7 * (opt.size || 1), 0.45 * v, 'lowpass', 900 / (opt.size || 1), B); sweep(120, 30, 0.5, 'sine', 0.5 * v); break;

      case 'hit': this.noiseHit(t, 0.08, 0.25 * v, 'bandpass', 3000, B, 2); sweep(900, 500, 0.06, 'square', 0.05 * v); break;
      case 'clank': sweep(2400, 2300, 0.15, 'square', 0.05); sweep(3100, 3000, 0.12, 'triangle', 0.05); break;
      case 'hurt': this.noiseHit(t, 0.35, 0.5, 'lowpass', 1400, B); sweep(300, 60, 0.3, 'sawtooth', 0.15); break;
      case 'ring': [0, 4, 7, 12].forEach((s, i) => sweep(880 * Math.pow(2, s / 12), 880 * Math.pow(2, s / 12), 0.12, 'square', 0.06, i * 0.05)); break;
      case 'goldring': [0, 4, 7, 12, 16, 19].forEach((s, i) => sweep(660 * Math.pow(2, s / 12), 660 * Math.pow(2, s / 12), 0.12, 'square', 0.07, i * 0.05)); break;
      case 'item': [0, 7, 12, 7, 12, 19].forEach((s, i) => sweep(520 * Math.pow(2, s / 12), 520 * Math.pow(2, s / 12), 0.09, 'triangle', 0.1, i * 0.045)); break;
      case 'roll': this.noiseHit(t, 0.5, 0.18, 'bandpass', 800, B, 1.5).filter.frequency.exponentialRampToValueAtTime(3000, t + 0.4); break;
      case 'deflect': sweep(3000, 1500, 0.1, 'square', 0.06); break;
      case 'boost': this.noiseHit(t, 0.7, 0.2, 'bandpass', 500, B, 0.7).filter.frequency.exponentialRampToValueAtTime(2500, t + 0.6); break;
      case 'brake': this.noiseHit(t, 0.5, 0.15, 'lowpass', 1500, B).filter.frequency.exponentialRampToValueAtTime(200, t + 0.45); break;
      case 'alarm': for (let i = 0; i < 3; i++) { sweep(880, 880, 0.15, 'square', 0.07, i * 0.3); sweep(660, 660, 0.15, 'square', 0.07, i * 0.3 + 0.15); } break;

      case 'back': sweep(700, 350, 0.08, 'square', 0.05); break;
      case 'start': [0, 4, 7, 12].forEach((s, i) => sweep(440 * Math.pow(2, s / 12), 440 * Math.pow(2, s / 12), 0.2, 'square', 0.08, i * 0.07)); break;

  voice(text, pitch) {
    if (!this.ctx || !Settings.data.voice) return;

    const syl = Math.min(18, Math.ceil(text.length / 3.2));

      const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();

      t += rand(0.08, 0.13);
    }
  },
};

const Toon = {
  defOL: 0.07, ramp: null, cache: new Map(), outlineCache: new Map(), outlineMats: new Map(),
  init() {
    const d = new Uint8Array([70, 70, 150, 255]);
    const t = new THREE.DataTexture(d, 4, 1, THREE.RedFormat);
    t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
    this.ramp = t;
  },
  mat(hex, opts = {}) {
    const key = hex + '|' + (opts.emissive || 0) + '|' + (opts.ei || 0) + '|' + (opts.flat ? 1 : 0) + (opts.transparent ? 't' + opts.opacity : '');
    let m = this.cache.get(key);
    if (!m) {
      m = new THREE.MeshToonNodeMaterial({ color: hex, gradientMap: this.ramp });
      if (opts.emissive) { m.emissive = new THREE.Color(opts.emissive); m.emissiveIntensity = opts.ei ?? 1; }
      if (opts.flat) m.flatShading = true;
      if (opts.transparent) { m.transparent = true; m.opacity = opts.opacity; m.depthWrite = false; }
      this.cache.set(key, m);
    }
    return m;
  },
  glow(hex, opacity = 1, additive = true) {
    const key = 'glow' + hex + opacity + additive;
    let m = this.cache.get(key);
    if (!m) {
      m = new THREE.MeshBasicNodeMaterial({ color: hex, transparent: opacity < 1 || additive, opacity, depthWrite: false, fog: false });
      if (additive) m.blending = THREE.AdditiveBlending;
      this.cache.set(key, m);
    }
    return m;
  },
  outlineMat(thick, hex = 0x0b1030) {
    const key = thick + '|' + hex;
    let m = this.outlineMats.get(key);
    if (!m) {
      m = new THREE.MeshBasicNodeMaterial({ color: hex, side: THREE.BackSide });
      m.positionNode = positionLocal.add(normalize(normalLocal.div(modelScale)).mul(thick).div(modelScale));
      this.outlineMats.set(key, m);
    }
    return m;
  },
  // smooth-normal copy of a geometry so the inverted hull has no cracks at hard edges
  outlineGeo(geo) {
    let g = this.outlineCache.get(geo.uuid);
    if (!g) {
      g = geo.clone();
      for (const k of Object.keys(g.attributes)) if (k !== 'position') g.deleteAttribute(k);
      g = BufferGeometryUtils.mergeVertices(g, 1e-3);
      g.computeVertexNormals();
      this.outlineCache.set(geo.uuid, g);
    }
    return g;
  },
};
const OUTLINE = 0.07;
// toon mesh with outline child
function tmesh(geo, hex, opts = {}) {
  const m = new THREE.Mesh(geo, opts.material || Toon.mat(hex, opts));
  m.castShadow = opts.shadow !== false; m.receiveShadow = !!opts.receive;
  if (opts.outline !== 0) {
    const o = new THREE.Mesh(Toon.outlineGeo(geo), Toon.outlineMat(opts.outline ?? Toon.defOL, opts.outlineColor));
    o.castShadow = false; o.receiveShadow = false; o.userData.isOutline = true;
    m.add(o);
  }
  return m;
}
function place(obj, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) {
  obj.position.set(x, y, z); obj.rotation.set(rx, ry, rz); obj.scale.set(sx, sy, sz); return obj;
}

// big structures get proportionally thicker ink lines
for (const [k, t] of Object.entries({ walker: 0.22, bastion: 0.3, dreadnought: 0.4, longhaul: 0.4, building: 0.18, arch: 0.18, rockArch: 0.25, rock: 0.15, asteroid: 0.2, tank: 0.1, turret: 0.12, bomber: 0.1 })) {
  const f = Models[k];
  Models[k] = (...a) => { Toon.defOL = t; try { return f.apply(Models, a); } finally { Toon.defOL = OUTLINE; } };
}

function buildingMaterial(col) {
  const key = 'bld' + col;
  let m = Toon.cache.get(key);
  if (!m) {
    m = new THREE.MeshToonNodeMaterial({ color: col, gradientMap: Toon.ramp });
    const base = color(col);
    m.colorNode = Fn(() => {
      const p = positionWorld;
      const wx = step(0.55, fract(p.x.add(p.z).mul(0.25)));
      const wy = step(0.5, fract(p.y.mul(0.3)));
      const win = wx.mul(wy);
      return mix(base, color(0xffe8a0), win.mul(0.55));
    })();
    Toon.cache.set(key, m);
  }
  return m;
}

const FX = {
  fireballs: [], sparks: null, sparkData: [], rings: [], beams: [], flashT: 0, shakeT: 0, shakeAmp: 0,
  init(scene) {
    // cel-shaded fireball spheres (two-band rim + progress fade)
    for (let i = 0; i < 140; i++) {
      const prog = uniform(0), cIn = uniform(new THREE.Color(0xfff2a0)), cOut = uniform(new THREE.Color(0xff6a1a));
      const m = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false, fog: false });
      m.colorNode = Fn(() => {
        const vd = normalize(cameraPosition.sub(positionWorld));
        const rim = float(1).sub(abs(dot(normalWorld, vd)));
        const band = step(0.5, rim.add(prog.mul(0.6)));
        const c = mix(cIn, cOut, band);
        return mix(c, vec3(0.22, 0.2, 0.24), smoothstep(0.45, 0.8, prog));
      })();
      m.opacityNode = float(1).sub(smoothstep(0.55, 1.0, prog));
      const mesh = new THREE.Mesh(G.sphereLo, m); mesh.visible = false; mesh.frustumCulled = false;
      scene.add(mesh);
      this.fireballs.push({ mesh, prog, cIn, cOut, t: 0, life: 1, size: 1, vel: new V3(), active: false });
    }
    // sparks / chips — instanced
    const sm = new THREE.MeshBasicNodeMaterial({ fog: false });
    this.sparks = new THREE.InstancedMesh(G.tetra, sm, 700);
    this.sparks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.sparks.frustumCulled = false;
    const col = new THREE.Color();
    for (let i = 0; i < 700; i++) { this.sparks.setColorAt(i, col.set(0xffcc33)); this.sparkData.push({ p: new V3(), v: new V3(), t: 0, life: 0, s: 1, active: false, spin: new V3() }); tmpM.makeScale(0, 0, 0); this.sparks.setMatrixAt(i, tmpM); }
    scene.add(this.sparks);
    // shockwave rings
    for (let i = 0; i < 16; i++) {
      const mesh = new THREE.Mesh(G.torus, new THREE.MeshBasicNodeMaterial({ color: 0xffffff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
      mesh.visible = false; scene.add(mesh); this.rings.push({ mesh, t: 0, life: 1, size: 1, active: false });
    }
    this.sparkIdx = 0;
  },
  fireball(pos, size = 1, life = 0.8, vel = null, inner = 0xfff2a0, outer = 0xff6a1a) {
    const f = this.fireballs.find(x => !x.active) || this.fireballs[Math.floor(Math.random() * this.fireballs.length)];
    f.active = true; f.t = 0; f.life = life; f.size = size; f.mesh.visible = true;
    f.mesh.position.copy(pos); f.vel.copy(vel || tmpV.set(0, 0, 0));
    f.cIn.value.set(inner); f.cOut.value.set(outer);
    f.mesh.rotation.set(rand(0, 3), rand(0, 3), 0);
    return f;
  },
  spark(pos, vel, colorHex = 0xffcc33, life = 0.6, s = 0.3) {
    const i = this.sparkIdx = (this.sparkIdx + 1) % 700;
    const d = this.sparkData[i];
    d.active = true; d.t = 0; d.life = life; d.s = s; d.p.copy(pos); d.v.copy(vel); d.spin.set(rand(-8, 8), rand(-8, 8), rand(-8, 8));
    this.sparks.setColorAt(i, tmpColor.set(colorHex)); this.sparks.instanceColor.needsUpdate = true;
  },
  shock(pos, size = 10, life = 0.6, colorHex = 0xffffff, normal = null) {
    const r = this.rings.find(x => !x.active) || this.rings[0];
    r.active = true; r.t = 0; r.life = life; r.size = size; r.mesh.visible = true; r.mesh.position.copy(pos);
    r.mesh.material.color.set(colorHex);
    if (normal) r.mesh.quaternion.setFromUnitVectors(new V3(0, 0, 1), normal); else r.mesh.rotation.set(Math.PI / 2, 0, 0);
  },
  explode(pos, size = 1, opts = {}) {
    const n = Math.round(4 + size * 4);
    for (let i = 0; i < n; i++) {
      const off = tmpV2.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(size * 1.4);
      this.fireball(tmpV3.copy(pos).add(off), size * rand(1.2, 2.4), rand(0.5, 0.9) * (0.8 + size * 0.15), off.clone().multiplyScalar(1.5));
    }
    for (let i = 0; i < 10 + size * 8; i++) this.spark(pos, tmpV.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize().multiplyScalar(rand(15, 45) * Math.sqrt(size)), pick([0xffcc33, 0xff6a1a, 0xffffff, opts.chip || 0x8892a8]), rand(0.5, 1.2), rand(0.25, 0.6) * Math.sqrt(size));
    if (size >= 2) this.shock(pos, size * 6, 0.5, 0xffd080);
    Sound.sfx(size >= 4 ? 'bigboom' : 'boom', { size: Math.min(2, 0.6 + size * 0.2), vol: opts.vol ?? 1 });
  },
  shake(amp, t = 0.3) { if (!Settings.data.shake) return; this.shakeAmp = Math.max(this.shakeAmp, amp); this.shakeT = Math.max(this.shakeT, t); },
  flash(a = 0.6) { const f = $('#flash'); f.style.opacity = a; setTimeout(() => f.style.opacity = 0, 80); },
  update(dt) {
    for (const f of this.fireballs) {
      if (!f.active) continue;
      f.t += dt; const p = f.t / f.life;
      if (p >= 1) { f.active = false; f.mesh.visible = false; continue; }
      f.prog.value = p;
      f.mesh.scale.setScalar(f.size * (0.4 + Math.sqrt(p) * 1.1));
      f.mesh.position.addScaledVector(f.vel, dt); f.vel.multiplyScalar(1 - 2.5 * dt); f.mesh.position.y += dt * 2 * p;
    }
    let dirty = false;
    for (let i = 0; i < 700; i++) {
      const d = this.sparkData[i];
      if (!d.active) continue;
      dirty = true; d.t += dt;
      if (d.t >= d.life) { d.active = false; tmpM.makeScale(0, 0, 0); this.sparks.setMatrixAt(i, tmpM); continue; }
      d.v.y -= 20 * dt; d.v.multiplyScalar(1 - 1.2 * dt); d.p.addScaledVector(d.v, dt);
      const s = d.s * (1 - d.t / d.life);
      tmpE.set(d.spin.x * d.t, d.spin.y * d.t, d.spin.z * d.t); tmpQ.setFromEuler(tmpE);
      tmpM.compose(d.p, tmpQ, tmpV.set(s, s, s)); this.sparks.setMatrixAt(i, tmpM);
    }
    if (dirty) this.sparks.instanceMatrix.needsUpdate = true;
    for (const r of this.rings) {
      if (!r.active) continue;
      r.t += dt; const p = r.t / r.life;
      if (p >= 1) { r.active = false; r.mesh.visible = false; continue; }
      r.mesh.scale.setScalar(r.size * (0.2 + p)); r.mesh.material.opacity = 1 - p;
    }
    if (this.shakeT > 0) { this.shakeT -= dt; if (this.shakeT <= 0) this.shakeAmp = 0; }

// ============================================================================
// Physics — Rapier 0.19.3: static world colliders, entity sensors, ray/overlap
// queries for weapons & collisions, dynamic debris (wreckage, broken wings)
// ============================================================================
const GRP = { WORLD: 1, ENEMY: 2, PLAYER: 4, DEBRIS: 8, FRIEND: 16, PICKUP: 32 };
const groups = (member, filter) => ((member & 0xffff) << 16) | (filter & 0xffff);
const Phys = {
  world: null, owners: new Map(), debris: [], ready: false,
  async init() {
    await RAPIER.init();
    this.ready = true;
    this.reset();
  },
  reset() {
    if (this.world) { for (const d of this.debris) d.mesh.parent && d.mesh.parent.remove(d.mesh); this.world.free(); }
    this.world = new RAPIER.World({ x: 0, y: -30, z: 0 });
    this.owners.clear(); this.debris = [];
    this.groundY = null;
  },
  setGround(y) {
    this.groundY = y;
    const c = RAPIER.ColliderDesc.cuboid(20000, 2, 60000).setTranslation(0, y - 2, -20000).setRestitution(0.35).setFriction(0.8)
      .setCollisionGroups(groups(GRP.WORLD, 0xffff));
    this.world.createCollider(c);
  },
  // static obstacle (building, arch pillar, asteroid…)
  addBox(pos, half, quat = null, owner = null) {
    const d = RAPIER.ColliderDesc.cuboid(half.x, half.y, half.z).setTranslation(pos.x, pos.y, pos.z).setCollisionGroups(groups(GRP.WORLD, 0xffff));
    if (quat) d.setRotation({ x: quat.x, y: quat.y, z: quat.z, w: quat.w });
    const c = this.world.createCollider(d);
    if (owner) this.owners.set(c.handle, owner);
    return c;
  },
  addBall(pos, r, owner = null, member = GRP.WORLD) {
    const d = RAPIER.ColliderDesc.ball(r).setTranslation(pos.x, pos.y, pos.z).setCollisionGroups(groups(member, 0xffff));
    if (member !== GRP.WORLD) d.setSensor(true);
    const c = this.world.createCollider(d);
    if (owner) this.owners.set(c.handle, owner);
    return c;
  },
  addSensorBox(pos, half, owner, member) {
    const d = RAPIER.ColliderDesc.cuboid(half.x, half.y, half.z).setTranslation(pos.x, pos.y, pos.z).setCollisionGroups(groups(member, 0xffff)).setSensor(true);
    const c = this.world.createCollider(d);
    this.owners.set(c.handle, owner);
    return c;
  },
  move(c, pos, quat) {
    if (!c) return;
    c.setTranslation({ x: pos.x, y: pos.y, z: pos.z });
    if (quat) c.setRotation({ x: quat.x, y: quat.y, z: quat.z, w: quat.w });
  },
  setGroup(c, member) { if (c) c.setCollisionGroups(groups(member, 0xffff)); },
  remove(c) {
    if (!c || !this.world) return;
    this.owners.delete(c.handle);
    try { this.world.removeCollider(c, false); } catch (e) { /* already removed with world reset */ }
  },
  // segment cast — returns closest hit {owner, point, normal, t}
  _ray: null,
  ray(from, dir, len, mask, exclude = null) {
    if (!this._ray) this._ray = new RAPIER.Ray({ x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 1 });
    const r = this._ray;
    r.origin = { x: from.x, y: from.y, z: from.z }; r.dir = { x: dir.x, y: dir.y, z: dir.z };
    const pred = exclude ? (c => this.owners.get(c.handle) !== exclude) : undefined;
    const hit = this.world.castRay(r, len, true, undefined, groups(0xffff, mask), undefined, undefined, pred);
    if (!hit) return null;
    const t = hit.timeOfImpact ?? hit.toi;
    return { owner: this.owners.get(hit.collider.handle) || null, collider: hit.collider, t, point: new V3(from.x + dir.x * t, from.y + dir.y * t, from.z + dir.z * t) };
  },
  _ball: new Map(),
  overlap(pos, r, mask, cb) {
    let s = this._ball.get(r); if (!s) { s = new RAPIER.Ball(r); this._ball.set(r, s); }
    this.world.intersectionsWithShape({ x: pos.x, y: pos.y, z: pos.z }, { x: 0, y: 0, z: 0, w: 1 }, s, c => { return cb(this.owners.get(c.handle) || null, c) !== false; }, undefined, groups(0xffff, mask));
  },
  // wreckage chunk with real rigid-body physics
  spawnDebris(scene, mesh, pos, vel, half = 1, life = 4, quat = null) {
    if (this.debris.length > 70) { const old = this.debris.shift(); this.world.removeRigidBody(old.body); old.mesh.parent && old.mesh.parent.remove(old.mesh); }
    const bd = RAPIER.RigidBodyDesc.dynamic().setTranslation(pos.x, pos.y, pos.z).setLinvel(vel.x, vel.y, vel.z)
      .setAngvel({ x: rand(-6, 6), y: rand(-6, 6), z: rand(-6, 6) }).setLinearDamping(0.15).setAngularDamping(0.3);
    if (quat) bd.setRotation({ x: quat.x, y: quat.y, z: quat.z, w: quat.w });
    const body = this.world.createRigidBody(bd);
    this.world.createCollider(RAPIER.ColliderDesc.cuboid(half, half * 0.6, half).setRestitution(0.45).setFriction(0.6).setDensity(2)
      .setCollisionGroups(groups(GRP.DEBRIS, GRP.WORLD | GRP.DEBRIS)), body);
    scene.add(mesh);
    const d = { body, mesh, t: 0, life, smoke: Math.random() < 0.6 };
    this.debris.push(d);
    return d;
  },
  step(dt, scene) {
    if (!this.world) return;
    this.world.timestep = Math.min(dt, 1 / 30);
    this.world.step();
    for (let i = this.debris.length - 1; i >= 0; i--) {
      const d = this.debris[i];
      d.t += dt;
      const p = d.body.translation(), q = d.body.rotation();
      d.mesh.position.set(p.x, p.y, p.z); d.mesh.quaternion.set(q.x, q.y, q.z, q.w);
      if (d.smoke && Math.random() < dt * 14) FX.fireball(d.mesh.position, rand(0.6, 1.2), 0.7, null, 0x777788, 0x444455);
      if (d.t > d.life - 0.5) d.mesh.scale.multiplyScalar(1 - dt * 4);
      if (d.t > d.life) { this.world.removeRigidBody(d.body); d.mesh.parent && d.mesh.parent.remove(d.mesh); this.debris.splice(i, 1); }
    }
  },
};

// Rail — the on-rails corridor. Curved centre line, frame lookup by progress s
// ---------------------------------------------------------------------------
const Rail = {
  s: 0, speed: 52, baseSpeed: 52, curve: true, groundY: 0,
  cx(s) { return this.curve ? 70 * Math.sin(s / 900) + 28 * Math.sin(s / 340 + 1) : 0; },
  cy(s) { return 0; },
  frame(s, f = this._f) {
    const x = this.cx(s), dx = (this.cx(s + 1) - this.cx(s - 1)) / 2;
    f.pos.set(x, this.cy(s), -s);
    f.fwd.set(dx, 0, -1).normalize();
    f.right.crossVectors(f.fwd, UP).normalize();
    return f;
  },
  _f: { pos: new V3(), fwd: new V3(), right: new V3() },
  _f2: { pos: new V3(), fwd: new V3(), right: new V3() },
  toWorld(x, y, s, out = new V3()) {
    const f = this.frame(s, this._f2);
    return out.copy(f.pos).addScaledVector(f.right, x).addScaledVector(UP, y);
  },
  // inverse: world → local (x,y,s) approx (rail curvature is gentle)
  toLocal(p, out = new V3()) {
    const s = -p.z; const f = this.frame(s, this._f2);
    tmpV.copy(p).sub(f.pos);
    out.set(tmpV.dot(f.right), p.y, s + tmpV.dot(f.fwd));
    return out;
  },
};

const BOLT_KINDS = {
  laser: { speed: 420, life: 0.9, dmg: 1, color: 0x5dff7a, scale: [1, 1, 1], geo: 'capsule' },
  laser2: { speed: 440, life: 0.9, dmg: 1, color: 0x5dff7a, scale: [1.2, 1, 1.2], geo: 'capsule' },
  laser3: { speed: 470, life: 0.9, dmg: 2, color: 0x4fb0ff, scale: [1.8, 1.1, 1.8], geo: 'capsule' },
  rlaser: { speed: 320, life: 1.2, dmg: 5, color: 0xff3b8a, scale: [1.4, 1, 1.4], geo: 'capsule' },
  eshot: { speed: 95, life: 4, dmg: 8, color: 0xff6a1a, scale: [1.2, 1.2, 1.2], geo: 'bolt' },
  bigshot: { speed: 80, life: 5, dmg: 12, color: 0xff2a7a, scale: [2.4, 2.4, 2.4], geo: 'bolt' },
  charge: { speed: 190, life: 3, dmg: 12, color: 0x5dff7a, scale: [2.2, 2.2, 2.2], geo: 'sphere', splash: 16 },
  bomb: { speed: 150, life: 1.4, dmg: 30, color: 0xff3b4e, scale: [1.3, 1.3, 1.3], geo: 'sphere', splash: 34 },

class Bolt {

  }
  // missiles are shootable
  damage(n, src) { if (!this.isMissile) return; this.hp -= n; if (this.hp <= 0) { this.explode(); if (src && src.isPlayer) src.addHits(0); } }
  explode() {
    if (!this.alive) return;

    if (this.k.splash) {
      const big = this.kind === 'bomb';
      FX.explode(this.pos, big ? 5 : 2.5); FX.shock(this.pos, this.k.splash * (big ? 1.2 : 0.8), 0.6, big ? 0xff9cf0 : 0x5dff7a);
      if (big) { FX.flash(0.5); FX.shake(1.2, 0.5); }

        if (W.mode === 'versus' && e === this.owner) continue;

      const tgt = this.target;
      if (!tgt.alive || tgt.dead) this.target = null;

      this.pos.copy(hit.point);
      if (hit.owner && hit.owner.damage) {
        if (this.k.splash) { this.explode(); return; }
        const res = hit.owner.damage(this.dmg, this.owner, hit.point, this);
        if (res === 'deflect') { this.vel.negate(); this.team = this.owner && this.owner.team === 'star' ? 'enemy' : 'star'; this.owner = hit.owner; this.life = 1.5; return; }
        FX.spark(hit.point, tmpV.set(rand(-8, 8), rand(-8, 8), rand(-8, 8)), res === 'clank' ? 0xaaaaff : 0xffee88, 0.3, 0.4);
        for (let i = 0; i < 3; i++) FX.spark(hit.point, tmpV.set(rand(-20, 20), rand(-20, 20), rand(-20, 20)), this.k.color, 0.35, 0.25);
      } else {
        if (this.k.splash) { this.explode(); return; }

// ---------------------------------------------------------------------------
// AI brains — write into an AIPad so AI flies with exactly the player's moveset
// ---------------------------------------------------------------------------
const AI = {
  // dogfight brain for all-range: rivals, bots, wingmen, attract pilot
  dogfight(skill = 0.7) {
    const st = { target: null, retarget: 0, fireT: 0, rollCD: rand(1, 3), jink: 0, jinkT: 0 };
    return (ship, dt) => {
      const pad = ship.pad;
      st.retarget -= dt;
      if (!st.target || st.target.dead || st.target.retired || st.target.alive === false || st.retarget <= 0) {
        st.retarget = rand(3, 6);
        let best = null, bd = Infinity;
        for (const t of W.targets(ship.team)) {
          if (t === ship) continue;
          const d = t.pos.distanceTo(ship.pos) * (t.isPlayer ? (ship.preferPlayer ? 0.5 : 1) : 1) * (t.priority ? 0.4 : 1);
          if (d < bd) { bd = d; best = t; }
        }
        st.target = best;
      }
      const s = {};
      const tgt = st.target;
      const goal = tmpV.copy(ship.pos);
      if (tgt) {
        const lead = tmpV2.copy(tgt.velWorld || tmpV3.set(0, 0, 0)).multiplyScalar(ship.pos.distanceTo(tgt.pos) / 380);
        goal.copy(tgt.pos).add(lead);

      // avoid obstacles ahead
      const fwd = tmpV3.set(0, 0, -1).applyQuaternion(ship.q);
      const hit = Phys.ray(ship.pos, fwd, 90, GRP.WORLD);
      if (hit) goal.copy(ship.pos).addScaledVector(fwd, 50).add(tmpV2.set(0, 60, 0)).add(tmpV2.set(1, 0, 0).applyQuaternion(ship.q).multiplyScalar(60));
      if (ship.pos.length() > (W.stage && W.stage.arenaR || 1100) * 0.92) goal.set(0, 0, 0);
      // jink — evasive weave
      st.jinkT -= dt; if (st.jinkT <= 0) { st.jinkT = rand(0.8, 2.2); st.jink = rand(-1, 1) * (1 - skill) * 1.5; }
      const local = goal.sub(ship.pos).applyQuaternion(tmpQ.copy(ship.q).invert());
      const yawErr = Math.atan2(local.x, -local.z), pitchErr = Math.atan2(local.y, Math.hypot(local.x, local.z));
      s.lx = clampN(yawErr * 2.2 + st.jink * 0.4, -1, 1); s.ly = clampN(-pitchErr * 2.2, -1, 1);
      const dist = tgt ? tgt.pos.distanceTo(ship.pos) : 999;

      if (dist > 380 && ship.boost > 0.5) s.boost = true;
      if (dist < 50 && Math.abs(yawErr) > 2.2 && ship.boost > 0.6 && Math.random() < dt * 2) s.uturn = true;
      if (tgt && dist < 60 && Math.abs(yawErr) < 0.8 && !s.boost) s.brake = Math.random() < 0.5;
      // roll to dodge incoming fire
      st.rollCD -= dt;
      if (st.rollCD <= 0) {
        for (const b of W.bolts) if (b.team !== ship.team && b.pos.distanceToSquared(ship.pos) < 900) { s[Math.random() < 0.5 ? 'l1' : 'r1'] = true; st.rollPending = true; st.rollCD = 2.5 - skill; break; }
      }
      if (st.rollPending && !s.l1 && !s.r1) { s[pad.prev.l1 ? 'l1' : 'r1'] = true; st.rollPending = false; }
      if (ship.godMode && tgt && dist < 300 && aligned && ship.charge === 0 && Math.random() < dt * 0.3) s.bomb = true;
      if (Math.random() < dt * 0.08 && ship.boost > 0.8) s.loop = true;
      pad.set(s);
    };
  },
  // rail attract pilot — hunts nearest enemy, dodges obstacles, shows off moves
  railPilot() {
    const st = { fireT: 0, moveT: 0, roam: new V3(0, 16, 0), trick: rand(4, 8), fireHeld: 0 };
    return (ship, dt) => {
      const s = {};

// rail-relative flight paths: local (x, y, ahead-of-camera) over time
const PATHS = {
  incoming(o) { return (e, dt) => { const t = e.t; e.lz = (e.lz ?? o.z ?? 260) - (o.speed ?? 35) * dt; Rail.toWorld(o.x + Math.sin(t * (o.wf ?? 1.5) + (o.ph ?? 0)) * (o.wa ?? 6), o.y + Math.cos(t * 1.1) * 3, Rail.s + e.lz, e.pos); }; },
  swoop(o) {
    return (e, dt) => {
      const t = e.t, side = o.side;
      e.lz = (e.lz ?? -30) + (t < 2.4 ? 95 : t < 6 ? 0 : 60) * dt;
      const x = side * (55 - Math.min(1, t / 2.4) * (55 - (o.x ?? 10) * side)) + (t > 2.4 ? Math.sin((t - 2.4) * 2) * 14 : 0);
      const y = (o.y ?? 20) + (t > 6 ? (t - 6) * 25 : 0) + (t < 2.4 ? (1 - t / 2.4) * 15 : 0);
      Rail.toWorld(x, y, Rail.s + e.lz, e.pos);
    };
  },
  vform(o) {
    return (e, dt) => {
      const t = e.t; e.lz = (e.lz ?? 300) - 60 * dt * (t < 3.5 ? 1 : 0.2);
      const brk = Math.max(0, t - 3.5);
      Rail.toWorld(o.x + o.slot * (6 + brk * 18), o.y + Math.abs(o.slot) * 2 + brk * brk * 6, Rail.s + e.lz - Math.abs(o.slot) * 8, e.pos);
      if (t > 8) e.alive = false;
    };
  },
  circle(o) {
    return (e, dt) => {
      const t = e.t, a = t * 1.3 + o.ph;
      e.lz = t < 2 ? lerp(260, 110, t / 2) : t < 9 ? 110 + Math.sin(t) * 10 : 110 + (t - 9) * 80;
      Rail.toWorld(Math.cos(a) * 26, 20 + Math.sin(a) * 14 + (t > 9 ? (t - 9) * 30 : 0), Rail.s + e.lz, e.pos);
      if (t > 13) e.alive = false;
    };
  },
  dive(o) {
    return (e, dt) => {
      const t = e.t; e.lz = (e.lz ?? 240) - 70 * dt;
      const y = t < 1.5 ? lerp(90, 12, t / 1.5) : 12 + (t - 1.5) * (t - 1.5) * 10;

  },
  cross(o) {

    };
  },
  hover(o) { return (e, dt) => { Rail.toWorld(o.x + Math.sin(e.t * 0.7 + o.ph) * 3, o.y + Math.sin(e.t * 1.3 + o.ph) * 2, o.s, e.pos); if (e.obj) e.obj.rotation.y += dt; }; },
  // all-range: pursue the nearest Star Locks ship
  hunt(o) {

class Item {
  constructor(kind, pos, o = {}) {
    this.kind = kind; this.pos = pos.clone(); this.alive = true; this.t = 0; this.s = o.s; this.lx = o.x; this.ly = o.y; this.fixed = o.fixed;
    this.obj = kind === 'silver' ? Models.ring(false) : kind === 'gold' ? Models.ring(true) : kind === 'checkpoint' ? Models.checkpoint() : kind === 'gate' ? new THREE.Group() : Models.item(kind);
    this.radius = kind === 'checkpoint' ? 10 : kind === 'gate' ? 11 : 5.5;
    W.scene.add(this.obj); this.obj.position.copy(this.pos);
  }
  update(dt) {
    this.t += dt;
    if (this.fixed && W.mode === 'rail') Rail.toWorld(this.lx, this.ly, this.s, this.pos);
    this.obj.position.copy(this.pos);
    if (W.mode === 'rail') { const f = Rail.frame(Rail.toLocal(this.pos, tmpV).z); this.obj.quaternion.setFromUnitVectors(new V3(0, 0, 1), f.fwd); }
    if (this.kind !== 'checkpoint' && this.kind !== 'gate' && this.kind !== 'silver' && this.kind !== 'gold') this.obj.rotation.y += dt * 2;
    else if (this.kind === 'silver' || this.kind === 'gold') this.obj.children[0].rotation.z += dt;
    if (W.mode !== 'rail') this.obj.rotation.y += dt;
    for (const s of W.ships) {
      if (!s.isPlayer || s.dead) continue;
      if (s.pos.distanceToSquared(this.pos) < (this.radius + 2) ** 2) { this.collect(s); break; }
    }
    if (W.mode === 'rail' && Rail.toLocal(this.pos, tmpV).z < Rail.s - 40) { if (this.kind === 'gate' && this.onMiss) this.onMiss(); this.alive = false; }
    if (this.life != null) { this.life -= dt; if (this.life <= 0) this.alive = false; }
  }
  collect(s) {
    this.alive = false;
    switch (this.kind) {
      case 'silver': s.hp = Math.min(s.maxHp, s.hp + 25); Sound.sfx('ring'); UI.popup(this.pos, 'SHIELD +', '#dfe4ee'); break;
      case 'gold':
        s.hp = Math.min(s.maxHp, s.hp + 25); s.goldRings++; Sound.sfx('goldring');
        if (s.goldRings === 3) { s.maxHp = 150; s.hp = Math.max(s.hp, 100); UI.centerMsg(s, 'SHIELD EXTENDED!', '3 gold rings collected', 2); }
        else if (s.goldRings === 6) { W.lives++; UI.centerMsg(s, '1-UP!', '6 gold rings collected', 2); s.goldRings = 3; }
        else UI.popup(this.pos, `GOLD ${s.goldRings}/3`, '#ffcc33');
        break;
      case 'laser':
        Sound.sfx('item');
        if (s.wingBroken[0] || s.wingBroken[1]) { s.repairWings(); UI.centerMsg(s, 'WINGS REPAIRED', '', 1.5); }
        else { s.laser = Math.min(2, s.laser + 1); UI.centerMsg(s, s.laser === 1 ? 'TWIN LASERS' : 'HYPER LASERS', '', 1.5); if (s.laser === 2 && W.mode === 'rail' && !W.attract) Comms.say('pip', 'Hyper lasers online! Now you\'re cookin\'!'); }
        break;
      case 'bomb': s.bombs = Math.min(9, s.bombs + 1); Sound.sfx('item'); UI.popup(this.pos, 'BOMB +1', '#ff3b4e'); break;
      case 'checkpoint': s.hp = Math.min(s.maxHp, s.hp + 40); Sound.sfx('shield'); for (const p of W.players) p.hp = Math.min(p.maxHp, p.hp + 40); Game.checkpoint(this); UI.centerMsg(null, 'CHECKPOINT', 'Shields restored', 1.5); break;
      case 'gate': Sound.sfx('ring'); if (this.onPass) this.onPass(s); break;
    }

  }

// Stage scripts are plain data arrays (designer-editable): { s|t, do: fn, route }

const Env = {
  ground: null, uColA: uniform(new THREE.Color(0x58b947)), uColB: uniform(new THREE.Color(0x3f9a3a)), uGrid: uniform(0), uWater: uniform(0),

const BIOMES = {
  sea: { a: 0x2a7fd4, b: 0x6fc3f5, grid: 0, water: 1 },
  plains: { a: 0x5cbf4a, b: 0x3f9a3a, grid: 0, water: 0 },
  city: { a: 0x8892a8, b: 0x5b6478, grid: 1, water: 0 },
  canyon: { a: 0xd08c48, b: 0xa86a32, grid: 0, water: 0 },
  base: { a: 0x7a8a5a, b: 0x5b6a44, grid: 1, water: 0 },
  fortress: { a: 0x6b5a4a, b: 0x4a3e34, grid: 0, water: 0 },
};
function addProp(obj, s, collider = null, colliders = null) {
  Env.group.add(obj);
  const p = { obj, s, colliders: colliders || (collider ? [collider] : []) };
  W.props.push(p); return p;
}
const Scenery = {
  genS: 0,
  reset() { this.genS = 0; },
  biomeAt(s) { return W.stage.biomeAt ? W.stage.biomeAt(s) : 'plains'; },
  stream() {
    while (this.genS < Rail.s + 1000) { this.chunk(this.genS, this.biomeAt(this.genS)); this.genS += 50; }
    for (let i = W.props.length - 1; i >= 0; i--) {
      const p = W.props[i];
      if (p.s < Rail.s - 90) { Env.group.remove(p.obj); for (const c of p.colliders) Phys.remove(c); W.props.splice(i, 1); }
    }
    const b = BIOMES[this.biomeAt(Rail.s + 150)];
    if (b) Env.setBiome(b.a, b.b, b.grid, b.water);
  },
  obstacleBox(x, y, s, w, h, d, col, model) {
    const pos = Rail.toWorld(x, 0, s);
    const obj = model || place(tmesh(G.box, col, { receive: true }), 0, h / 2, 0, 0, 0, 0, w, h, d);
    obj.position.add(pos); obj.position.y += y;
    const f = Rail.frame(s); obj.rotation.y = Math.atan2(-f.fwd.x, -f.fwd.z);
    const c = Phys.addBox(tmpV.copy(pos).add(tmpV2.set(0, y + h / 2, 0)), new V3(w / 2, h / 2, d / 2), obj.quaternion);
    return addProp(obj, s, c);
  },
  chunk(s0, biome) {
    const R = (a, b) => rand(a, b);
    if (biome === 'sea') {
      for (let i = 0; i < 3; i++) { const s = s0 + R(0, 50), x = pick([-1, 1]) * R(60, 300); const r = Models.rock(R(4, 12), 0x8d7b68); r.position.copy(Rail.toWorld(x, 0, s)); addProp(r, s); }
      if (Math.random() < 0.25) { const s = s0 + 25, x = R(-30, 30), h = R(14, 30); const g = new THREE.Group(); const r = Models.rock(1, 0x9c8b78); r.scale.set(6, h / 2, 6); r.position.y = h / 2 - 2; g.add(r); this.obstacleBox(x, 0, s, 9, h, 9, 0, g); }
    } else if (biome === 'plains') {
      for (let i = 0; i < 6; i++) { const s = s0 + R(0, 50), x = pick([-1, 1]) * R(55, 320); const t = Models.tree(R(0.8, 1.6)); t.position.copy(Rail.toWorld(x, 0, s)); addProp(t, s); }
      if (Math.random() < 0.35) { const s = s0 + R(0, 50), x = pick([-1, 1]) * R(70, 200); const h = Models.building(R(8, 14), R(6, 10), R(8, 14), pick([0xf4e1c1, 0xe8d0a8, 0xffffff])); h.position.copy(Rail.toWorld(x, 0, s)); addProp(h, s); }
      if (Math.random() < 0.18) { const s = s0 + 25, x = R(-36, 36), h = R(28, 60); const m = place(tmesh(G.cyl6, 0xa58b6c, { receive: true }), 0, h / 2, 0, 0, R(0, 3), 0, 4, h, 4); this.obstacleBox(x, 0, s, 7, h, 7, 0, m); }
    } else if (biome === 'city') {
      for (let i = 0; i < 4; i++) {
        const s = s0 + R(0, 50), x = pick([-1, 1]) * R(56, 260), h = R(20, 90);
        const b = Models.building(R(14, 26), h, R(14, 26), pick([0xc8cfdc, 0x9aa3b8, 0xb8c0d0, 0xdfe4ee, 0x8892a8]));
        b.position.copy(Rail.toWorld(x, 0, s)); addProp(b, s);
      }
      if (Math.random() < 0.3) { const s = s0 + 25, x = pick([-1, 1]) * R(12, 34), h = R(30, 70); this.obstacleBox(x, 0, s, 12, h, 12, 0, Models.building(12, h, 12, pick([0xc8cfdc, 0x9aa3b8]))); }
    } else if (biome === 'canyon') {
      for (const side of [-1, 1]) {
        const s = s0 + 25, h = R(70, 120), x = side * R(52, 60);
        const m = place(tmesh(G.box, pick([0xc27a3a, 0xb06a30, 0xd08c48]), { receive: true }), 0, h / 2, 0, R(-0.05, 0.05), 0, R(-0.05, 0.05), R(18, 26), h, 54);
        this.obstacleBox(x, 0, s, 22, h, 54, 0, m);
      }
      if (Math.random() < 0.2) { const s = s0 + 25, h = R(25, 55); const m = Models.rock(1, 0xb07a45); m.scale.set(7, h / 2, 7); m.position.y = h / 2; const g = new THREE.Group(); g.add(m); this.obstacleBox(R(-30, 30), 0, s, 11, h, 11, 0, g); }
      if (Math.random() < 0.12) { const s = s0 + 25; const g = new THREE.Group(); g.add(place(tmesh(G.box, 0xa86a32), 0, 0, 0, 0, 0, 0, 110, 8, 12)); this.obstacleBox(0, R(36, 46), s, 110, 8, 12, 0, g); }
    } else if (biome === 'base') {
      for (let i = 0; i < 2; i++) {
        const s = s0 + R(0, 50), x = pick([-1, 1]) * R(60, 220);
        const hg = new THREE.Group(); hg.add(place(tmesh(new THREE.CylinderGeometry(1, 1, 1, 16, 1, false, 0, Math.PI), 0x7d8a6a, { receive: true }), 0, 0, 0, 0, 0, Math.PI / 2, 14, 30, 14));
        hg.add(place(new THREE.Mesh(G.box, Toon.glow(0xffcc33, 0.7)), 0, 3, 15, 0, 0, 0, 12, 1, 0.5));
        hg.position.copy(Rail.toWorld(x, 0, s)); addProp(hg, s);

      if (Math.random() < 0.22) { const s = s0 + 25, x = R(-34, 34), h = R(30, 55); const m = new THREE.Group(); m.add(place(tmesh(G.box, 0x5b6a44), 0, h / 2, 0, 0, 0, 0, 6, h, 6)); m.add(place(new THREE.Mesh(G.sphere, Toon.glow(0xff3b4e, 1)), 0, h + 1, 0, 0, 0, 0, 1.2)); this.obstacleBox(x, 0, s, 6, h, 6, 0, m); }
    } else if (biome === 'fortress') {
      for (let i = 0; i < 3; i++) { const s = s0 + R(0, 50), x = pick([-1, 1]) * R(60, 300); const r = Models.rock(R(6, 18), 0x5a4a3c); r.position.copy(Rail.toWorld(x, 0, s)); addProp(r, s); }
      if (Math.random() < 0.3) { const s = s0 + R(0, 50), x = pick([-1, 1]) * R(70, 200); const f = new THREE.Group(); f.add(place(new THREE.Mesh(G.cone8, Toon.glow(0xff6a1a, 0.8)), 0, 4, 0, 0, 0, 0, 3, 8, 3)); f.position.copy(Rail.toWorld(x, 0, s)); addProp(f, s); }
    }
  },
};

// arch helper for gates / scenery
function spawnArch(s, opts = {}) {
  const f = Rail.frame(s);
  const a = opts.rock ? Models.rockArch() : Models.arch(opts.col);
  a.position.copy(f.pos).add(tmpV.copy(f.right).multiplyScalar(opts.x || 0)); a.rotation.y = Math.atan2(-f.fwd.x, -f.fwd.z);
  const cols = [];

  cols.push(Phys.addBox(tmpV.copy(a.position).add(tmpV2.set(0, opts.rock ? 27 : 25.5, 0)), new V3(15, 2.2, 2.2), a.quaternion));

class Walker {
  constructor() {
    this.obj = Models.walker(); W.scene.add(this.obj); this.alive = true; this.t = 0; this.lz = 320; this.x = 0; this.name = 'STILT WALKER'; this.mid = true;
    this.pos = new V3(); this.fireT = 2; this.stompT = 5;
    this.core = addEnemy(new Enemy('wcore', { hp: 40, hits: 10, radius: 3.4, boss: this }));
    this.core.keep = true; this.core.noCollide = true; this.core.explodeSize = 4;
    this.core.path = (e) => { this.obj.userData.core.getWorldPosition(e.pos); };
    this.core.onKill = () => this.die();
    this.parts = [this.core];
  }
  get hp() { return Math.max(0, this.core.hp); } get maxHp() { return this.core.maxHp; }
  update(dt) {
    this.t += dt;
    const leaving = this.t > 38;
    this.lz = leaving ? this.lz + 70 * dt : damp(this.lz, 130, 0.8, dt);
    this.x = Math.sin(this.t * 0.45) * 18;
    const f = Rail.frame(Rail.s + this.lz);
    this.pos.copy(f.pos).addScaledVector(f.right, this.x);
    this.obj.position.copy(this.pos);
    this.obj.rotation.y = Math.atan2(f.fwd.x, f.fwd.z);
    const ud = this.obj.userData, ph = this.t * 3;
    ud.hull.position.y = 16 + Math.sin(ph * 2) * 0.8; ud.hull.rotation.z = Math.sin(ph) * 0.05;
    for (const l of ud.legs) { l.hip.rotation.x = Math.sin(ph + l.phase) * 0.35; l.knee.rotation.x = Math.max(0, Math.sin(ph + l.phase + 1)) * 0.4; }
    if (!leaving) {
      this.fireT -= dt * diff().enemyFire;
      if (this.fireT <= 0) {
        this.fireT = 1.5; const tgt = this.core.nearestPlayer();
        if (tgt) for (let i = -2; i <= 2; i++) { tmpV.copy(tgt.pos).sub(this.core.pos).normalize(); tmpV.applyAxisAngle(UP, i * 0.12); fire('eshot', this.core, this.core.pos, tmpV); }
        Sound.sfx('eshot');
      }
      this.stompT -= dt;
      if (this.stompT <= 0) { this.stompT = 4.5; FX.shock(tmpV.copy(this.pos).setY(1), 40, 0.8, 0xffcc33); FX.shake(0.8, 0.4); Sound.sfx('boom', { size: 1.5, vol: 0.6 }); for (const s of W.ships) if (!s.dead && s.oy < 12 && Math.abs(s.ox - this.x) < 30) s.damage(8, this.core); }
    }
    if (leaving && this.lz > 600) { this.alive = false; this.core.alive = false; if (Game.bossBar === this) Game.bossBar = null; Sound.play(W.stage.music); W.scene.remove(this.obj); Comms.say('bramble', 'It got away... no matter. Eyes front!'); }
  }
  die() {
    this.alive = false; Game.bossDown(this);
    for (let n = 0; n <= 6; n++) after(n * 0.16, () => FX.explode(tmpV.copy(this.pos).add(new V3(rand(-8, 8), rand(4, 20), rand(-8, 8))), 3));
    after(1.2, () => { FX.explode(this.pos.clone().setY(14), 6); FX.flash(0.6); W.scene.remove(this.obj); });
  }
  remove() { W.scene.remove(this.obj); for (const p of this.parts) p.alive = false; }
}

class Bastion {
  constructor() {
    this.obj = Models.bastion(); W.scene.add(this.obj); this.alive = true; this.t = 0; this.lz = 420; this.x = 0; this.y = 22; this.name = 'BASTION CRAB';

      e.path = (en) => a.children[2].getWorldPosition(en.pos);

      return e;
    });
    this.core = addEnemy(new Enemy('core', { hp: 70, hits: 20, radius: 4, boss: this }));
    this.core.keep = true; this.core.noCollide = true; this.core.armored = true; this.core.explodeSize = 5;

    const ramming = ramT > 10 && ramT < 13;
    const targetLz = ramming ? 55 : 115;
    this.lz = damp(this.lz, targetLz, ramming ? 1.6 : 0.9, dt);
    this.x = Math.sin(this.t * 0.4) * 20; this.y = 22 + Math.sin(this.t * 0.9) * 5;

      for (const [i, p] of ud.plates.entries()) p.position.x = damp(p.position.x, open ? (i ? 1 : -1) * 4.5 : 0, 6, dt);
    }
    this.fireT -= dt * diff().enemyFire;
    if (this.fireT <= 0) {
      const tgt = this.core.nearestPlayer();
      if (this.phase === 1) {
        this.fireT = 1.4;
        for (const a of this.arms) if (a.alive && tgt) for (let i = -1; i <= 1; i++) { tmpV.copy(tgt.pos).sub(a.pos).normalize().applyAxisAngle(UP, i * 0.1); fire('eshot', a, a.pos, tmpV); }
      } else {
        this.fireT = this.open ? 2.2 : 1.2;
        if (this.open) { for (let i = 0; i < 14; i++) { const ang = i / 14 * TAU; tmpV.set(Math.cos(ang) * 0.5, Math.sin(ang) * 0.5, 0).add(tmpV2.copy(Rail.frame(Rail.s).fwd).negate()).normalize(); fire('bigshot', this.core, this.core.pos, tmpV); } }
        else if (tgt) fire('bigshot', this.core, this.core.pos, tmpV.copy(tgt.pos).sub(this.core.pos).normalize());
      }

    }
    this.misT -= dt * diff().enemyFire;
    if (this.misT <= 0) { this.misT = this.phase === 1 ? 6 : 4.5; const tgt = this.core.nearestPlayer(); if (tgt) for (const s of [-1, 1]) fire('missile', this.core, tmpV.copy(this.pos).add(tmpV2.set(s * 6, 10, 0)), tmpV3.set(s * 0.4, 1, 0.3).normalize(), tgt); Sound.sfx('homing'); }
    // ramming body contact
    for (const s of W.ships) if (!s.dead && s.team === 'star' && s.pos.distanceTo(this.pos) < 14) s.damage(15, this.core);
  }
  die() {
    this.alive = false; for (const a of this.arms) if (a.alive) a.kill(null);
    Game.bossDown(this);
    for (let n = 0; n <= 10; n++) after(n * 0.18, () => { FX.explode(tmpV.copy(this.pos).add(new V3(rand(-14, 14), rand(-6, 10), rand(-10, 10))), 3.5); FX.shake(0.8, 0.3); });
    after(2.1, () => { FX.explode(this.pos, 8); FX.flash(0.9); W.scene.remove(this.obj); });
  }
  remove() { W.scene.remove(this.obj); for (const p of this.parts) p.alive = false; }
}

    this.gens = ud.gens.map((g, i) => {
      const e = addEnemy(new Enemy('gen', { hp: 18, hits: 5, radius: 4, boss: this }));
      e.keep = true; e.noCollide = true; e.explodeSize = 4;
      e.path = (en) => g.children[1].getWorldPosition(en.pos);
      e.onKill = () => { g.visible = false; FX.explode(e.pos, 5); this.onGenDown(); };
      return e;
    });
    this.turrets = [];
    for (let i = 0; i < 8; i++) {
      const lp = new V3((i % 2 ? 1 : -1) * 14, 10, -55 + Math.floor(i / 2) * 32);
      const m = new THREE.Group(); m.add(place(tmesh(G.cyl6, 0x5b6478), 0, 1, 0, 0, 0, 0, 2.5, 2, 2.5)); m.add(place(tmesh(G.sphere, 0xff3b4e, { emissive: 0x660010, ei: 0.7 }), 0, 2.5, 0, 0, 0, 0, 1.8));
      m.position.copy(lp); this.obj.add(m);
      const e = addEnemy(new Enemy('dturret', { hp: 4, hits: 2, radius: 2.5, fireRate: 0.35, boss: this }));
      e.keep = true; e.noCollide = true; e.mesh = m; e.local = lp.clone().add(new V3(0, 2.5, 0));
      e.path = (en) => en.pos.copy(en.local).applyQuaternion(this.obj.quaternion).add(this.obj.position);
      e.onKill = () => { m.visible = false; };
      this.turrets.push(e);
    }
    this.reactor = addEnemy(new Enemy('reactor', { hp: 70, hits: 30, radius: 5.5, boss: this }));
    this.reactor.keep = true; this.reactor.noCollide = true; this.reactor.armored = true; this.reactor.explodeSize = 6;
    this.reactor.path = (en) => ud.reactor.getWorldPosition(en.pos);
    this.reactor.onKill = () => this.die();
    this.parts = [...this.gens, this.reactor];
    this.total = this.parts.reduce((a, p) => a + p.maxHp, 0);
    for (const e of this.parts) e.targetable = false;
    for (const e of this.turrets) e.targetable = false;
  }
  get hp() { return this.parts.reduce((a, p) => a + Math.max(0, p.alive ? p.hp : 0), 0); } get maxHp() { return this.total; }
  onGenDown() {
    const left = this.gens.filter(g => g.alive).length;
    if (left === 0) { this.reactor.armored = false; this.obj.userData.shield.visible = false; Sound.sfx('alarm'); Comms.say('pip', 'Shield\'s down! The reactor\'s wide open — light it up!'); }
    else Comms.say(pick(['skye', 'bramble', 'pip']), `Generator down! ${left} to go!`);
  }
  onPartHit() {}
  update(dt) {
    this.t += dt;
    if (this.arriving) {
      this.pos.z = damp(this.pos.z, 0, 0.9, dt);
      if (Math.abs(this.pos.z) < 30) {
        this.arriving = false; this.pos.z = 0;
        for (const e of [...this.parts, ...this.turrets]) e.targetable = true;
        this.colliders.push(Phys.addBox(new V3(0, 0, 0), new V3(20, 9, 70)), Phys.addBox(new V3(0, 16, 30), new V3(9, 7, 15)), Phys.addBox(new V3(0, 0, -90), new V3(14, 8, 25)));
      }
    }
    this.obj.position.copy(this.pos);
    this.obj.userData.shield.rotation.y += dt;
    this.obj.userData.shield.scale.setScalar(8.5 + Math.sin(this.t * 6) * 0.3);
    if (!this.arriving) {
      this.spawnT -= dt;
      if (this.spawnT <= 0) { this.spawnT = 9; const n = W.enemies.filter(e => e.type === 'drone' && e.alive).length; for (let i = n; i < 6; i++) spawnEnemy('drone', { pos: tmpV.set(rand(-30, 30), rand(-20, 20), 80) }); }
    }
  }
  die() {
    this.alive = false; Game.bossDown(this);
    for (const t of this.turrets) if (t.alive) t.kill(null);
    for (let n = 0; n <= 16; n++) after(n * 0.17, () => { FX.explode(tmpV.set(rand(-20, 20), rand(-10, 20), rand(-70, 70)), 5); FX.shake(1, 0.4); });
    after(3, () => { FX.explode(new V3(0, 0, 0), 10); FX.flash(1); W.scene.remove(this.obj); for (const c of this.colliders) Phys.remove(c); this.colliders = []; });
  }
  remove() { W.scene.remove(this.obj); for (const c of this.colliders) Phys.remove(c); for (const p of [...this.parts, ...this.turrets]) p.alive = false; }
}

const S = {
  line(n, x, y, opts = {}) { for (let i = 0; i < n; i++) spawnEnemy('dart', { path: PATHS.incoming({ x: x + (i - (n - 1) / 2) * 9, y, z: 260 + i * 6, ph: i, ...opts }), drop: opts.dropLast && i === n - 1 ? opts.dropLast : null }); },
  swoop(n, side, y = 20) { for (let i = 0; i < n; i++) after(i * 0.26, () => spawnEnemy('dart', { path: PATHS.swoop({ side, x: side * -8 + i * 6 * -side, y: y + i * 3 }) })); },
  vform(x, y, drop) { for (let i = -2; i <= 2; i++) spawnEnemy('dart', { path: PATHS.vform({ x, y, slot: i }), drop: i === 0 ? drop : null }); },
  circle(n) { for (let i = 0; i < n; i++) spawnEnemy('dart', { path: PATHS.circle({ ph: i / n * TAU }) }); },
  dive(n) { for (let i = 0; i < n; i++) after(i * 0.4, () => spawnEnemy('dart', { path: PATHS.dive({ x: rand(-30, 30) }) })); },
  cross(n, side, y) { for (let i = 0; i < n; i++) after(i * 0.3, () => spawnEnemy('dart', { path: PATHS.cross({ side, y: y + i * 4, z: 120 + i * 10 }) })); },
  ground(kind, s, xs, drop) { for (const x of xs) spawnEnemy(kind, { s, x, drop }); },
  bomber(x, y, drop) { spawnEnemy('bomber', { path: PATHS.incoming({ x, y, z: 300, speed: 18, wa: 3 }), drop }); },
  mines(s, n) { for (let i = 0; i < n; i++) spawnEnemy('mine', { path: PATHS.hover({ x: rand(-38, 38), y: rand(6, 42), s: s + rand(0, 200), ph: rand(0, 6) }) }); },
  crate(s, x, y, drop) { spawnEnemy('crate', { path: PATHS.hover({ x, y, s, ph: 0 }), drop }); },
  ring(kind, s, x, y) { spawnItem(kind, Rail.toWorld(x, y, s), { s, x, y, fixed: true }); },
  chase(pilot, n = 3, dur = 11) {
    const w = W.ships.find(s => s.pilot === pilot && !s.isPlayer && !s.retired);
    if (!w || W.attract) return;
    w.chased = { t: 0, dur, saved: false };
    const chasers = [];
    for (let i = 0; i < n; i++) chasers.push(spawnEnemy('dart', { path: PATHS.chase({ wing: w, dur, ph: i, dx: (i - 1) * 5 }) }));
    for (const c of chasers) c.fireRate = 0;
    w.chasers = chasers;
    const lines = { skye: ['Kit! I\'ve got bogeys on my tail! Get \'em off me!', 'Thanks for nothing! ...Okay, thanks.', 'Argh! I\'m hit bad — I gotta pull back!'],
      bramble: ['Kit, I can\'t shake these fellas! Lend an old timer a hand!', 'Much obliged, Kit. Your father would be proud.', 'Ohh, that\'s gonna leave a mark...'],
      pip: ['Eek! Kit, help! They\'re all over me!', 'Phew! I owe you one, Kit!', 'My systems are fried! Heading back to the Longhaul!'] };
    Comms.say(pilot, lines[pilot][0], { priority: true });
    w.chaseLines = lines[pilot];
  },
};

const Comms = {

  say(who, text, o = {}) {
    if (W.mode === 'versus' && !o.force) return;

    if (W.retired[who] && !o.force) return;
    const msg = { who, text, dur: Math.max(2.8, text.length * 0.058 + 1.2) };

  update(dt) {

      const talking = n < this.cur.text.length;

      let bo = 0, br = 0, n = 0;

      n = Math.max(1, n);

    for (const s of W.ships) s.update(dt);
    for (const s of W.ships) if (s.cam) s.updateCamera(dt);
    if (W.midboss && W.midboss.alive) W.midboss.update(dt);
    if (W.boss && W.boss.alive) W.boss.update(dt);
    for (const e of W.enemies) if (e.alive) e.update(dt);
    for (const b of W.bolts) if (b.alive) b.update(dt);

    const lp = W.players.find(p => !p.dead) || W.players[0];

      return;
    }
    if (ship.team === 'jackal') { if (W.stage.onShipDown) W.stage.onShipDown(ship); return; }
    if (ship.wingman) { ship.dead = false; ship.hp = 0; this.retireWing(ship); return; }
    if (ship.isPlayer) {
      ship.respawnT = 2.6;
      if (W.lives <= 0 && W.players.every(p => p.dead)) after(2.2, () => { if (W.players.every(p => p.dead) && W.lives <= 0) this.gameOver(); });
      else if (W.lives > 0) UI.centerMsg(ship, 'SHOT DOWN!', `${W.lives} ${W.lives === 1 ? 'life' : 'lives'} left`, 2.2);

  // ---------------------------------------------------------------- versus
  startVersus(cfg) {

    W.players.forEach(p => p.snapCam = true);
    Sound.play('versus'); Sound.setEngine(true);
    this.events = []; this.evIdx = 0; this.stageT = 0;
    this.state = 'play';
    UI.centerMsg(null, 'VERSUS BATTLE', `First to ${cfg.target} kills wins!`, 2.5);
    UI.tip(null, `${glyph('uturn')} U-turn · ${glyph('loop')} loop · double-tap ${glyph('l1')}/${glyph('r1')} roll · grab items for lasers & bombs`, 6);
  },
  versusOver(winner) {
    if (this.state !== 'play') return;
    this.state = 'results'; Sound.play('victory');
    const ranked = W.ships.filter(s => s.versusSlot != null).sort((a, b) => b.kills - a.kills);
    UI.show(`<h2>${winner.cpu ? 'CPU' : 'P' + (winner.versusSlot + 1)} WINS!</h2><div class="tagline">${winner.name}</div>
      <div class="panel" style="min-width:min(80vw,20em)">${ranked.map((s, i) => `<div class="stat"><span style="color:#${PCOLORS[s.versusSlot].toString(16).padStart(6, '0')}">${i + 1}. ${s.cpu ? 'CPU' : 'P' + (s.versusSlot + 1)} · ${s.name}</span><b>${s.kills} K / ${s.deaths} D</b></div>`).join('')}</div>
      <div class="menu"><div class="btn" data-default="1"><span>REMATCH</span></div><div class="btn"><span>BACK TO LOBBY</span></div><div class="btn"><span>QUIT TO TITLE</span></div></div>`);
    const cfg = W.versus.cfg; UI.lockT = 1.2;
    UI.items[0]._fn = () => this.startVersus(cfg);
    UI.items[1]._fn = () => { this.toTitle(); this.showLobby('versus'); this.lobby.joined = cfg.pads; this.lobby.cpus = cfg.cpus; this.lobby.target = cfg.target; this.renderLobby(); };
    UI.items[2]._fn = () => this.toTitle();
  },
  // ---------------------------------------------------------------- attract mode
  ATTRACT: [
    { stage: 0, startS: 150, dur: 42 },
    { stage: 0, startS: 1700, dur: 38 },
    { stage: 0, startS: 4500, dur: 26, route: 'canyon' },
    { stage: 0, startS: 6900, dur: 45 },
    { stage: 1, dur: 55, jump: 20 },
  ],
  startAttract() {
    W.attract = true; $('#demo-banner').classList.remove('hidden');
    UI.hide(); this.attractSeg = 0; this.session = { pads: [new AIPad()], stageIndex: 0, hits: [0], stageHits: [], medals: {}, lives: 99, gates: 0 };
    this.runAttractSeg();
  },
  runAttractSeg() {
    const seg = this.ATTRACT[this.attractSeg];
    this.session.gates = seg.route === 'canyon' ? 6 : 0; this.session.route = seg.route || null;
    this.startStage(seg.stage, { startS: seg.startS || 0.01 });
    W.lives = 99;
    if (seg.jump) { this.events = this.events.filter(e => e.t === 6); this.evIdx = 0; Stage2.jackals(); }
    this.attractT = seg.dur;
  },
  updateAttract(dt) { this.attractT -= dt; if (this.attractT <= 0) this.nextAttract(); },
  nextAttract() {
    this.attractSeg++;
    if (this.attractSeg >= this.ATTRACT.length) { this.exitAttract(); return; }
    this.runAttractSeg();
  },
  exitAttract() {
    W.attract = false; $('#demo-banner').classList.add('hidden');
    this.clearWorld(); this.startBackdrop(); this.showTitle();
    Input.lastInputTime = performance.now();
  },
};

Game.boot().catch(e => {
  console.error(e);
  const l = $('#loading'); if (l) l.textContent = 'FAILED TO START: ' + (e && e.message || e);
});

</script>
</body>
</html>
