// Core Game Engine, 4-Camera Red Alarm System, HUD Overlay, Attract Mode & 10-Foot Controller UI









const CAMERA_MODES = [
  'TAIL CHASE CAM',
  'COCKPIT VECTOR HUD',
  'CLOSE WING CAM',
  'TACTICAL OVERHEAD'
];
class ReddishAlertGame {
  constructor() {
    this.AIHub = typeof window !== 'undefined' ? window.AIHub : null;
    this.sound = new SoundEngine();

    this.phase = 'title'; // 'title' | 'ready' | 'waiting' | 'playing' | 'attract' | 'over'
    this.subScreen = 'none'; // 'none' | 'multiplayer' | 'about'
    this.settingsOpen = false;
    this.settingsIndex = 0;
    this.titleIndex = 0;
    this.mpIndex = 0;

    this.cameraMode = 0; // 0: Tail, 1: Cockpit, 2: Wing, 3: Overhead
    this.worldSeconds = 0;
    this.titleIdleTimer = 0;
    this.attractTimer = 0;

    this.net = null;
    this.renderer = null;
    this.scene = null;
    this.camera = null;
    this.fortress = null;
    this.rapierReady = false;

    this.players = []; // { id, name, color, colorHex, x, y, z, tx, ty, tz, vx, vy, vz, roll, pitch, yaw, shield, score, kills, rings, missiles, empCharge, rollTimer, mesh, gone, isAI }
    this.localId = 0;

    this.lockedTargets = [];
    this.lockTimer = 0;
    this.fireCooldown = 0;
    this.missileCooldown = 0;

    this.sector = 1;
    this.sectorAnnounced = { 1: false, 2: false, 3: false, boss2: false, victory: false };
    this.radioQueue = [];
    this.activeRadio = null;

    this.screenFlash = 0;
    this.screenFlashColor = '#ff1144';
    this.standings = null;
    this.endMessage = '';
    this.wonRound = false;

    this.mpConfig = {
      roomCode: 'KLAXON',
      aiWingmen: 2
    };

    this.lastFrameAt = performance.now();
    this.lastNetSentAt = 0;
    this.lastSnapshotTime = -Infinity;

    this.input = new InputManager(
      this.sound,
      () => this.toggleSettings(),
      () => this.cycleCamera(),
      (kind, detail) => this.handleAnyUserInput(kind, detail)
    );

    this.registerProbe();
    this.initDOM();
    this.boot();
  }

  registerProbe() {
    if (!this.AIHub || typeof this.AIHub.probe !== 'function') return;
    this.AIHub.probe(() => {
      let sceneName = 'title';
      if (this.phase === 'playing' || this.phase === 'attract') sceneName = 'play';
      else if (this.phase === 'ready' || this.phase === 'waiting') sceneName = 'ready';
      else if (this.phase === 'over') sceneName = 'over';
      else if (this.subScreen !== 'none') sceneName = 'menu';

      return {
        scene: sceneName,
        menu: Boolean(this.settingsOpen),
        world: Math.round(this.worldSeconds * 1000) / 1000,
        input: {
          x: this.input.felt.x,
          y: this.input.felt.y,
          fire: Boolean(this.input.felt.fire),
          missile: Boolean(this.input.felt.missile)
        }
      };
    });
  }

  initDOM() {
    this.canvas3D = document.getElementById('gpu-canvas');
    this.hudCanvas = document.getElementById('hud-canvas');
    this.hudCtx = this.hudCanvas ? this.hudCanvas.getContext('2d') : null;
    this.uiRoot = document.getElementById('ui-layer');

    window.addEventListener('resize', () => this.onResize());
    this.onResize();
  }

  onResize() {
    const w = window.innerWidth || 1280;
    const h = window.innerHeight || 720;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (this.hudCanvas) {
      this.hudCanvas.width = Math.round(w * dpr);
      this.hudCanvas.height = Math.round(h * dpr);
    }
    if (this.renderer && this.camera) {
      this.camera.aspect = w / Math.max(1, h);
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(w, h);
    }
  }

  async boot() {
    // 1. If launched inside AI Hub session, start connecting immediately so 'hello' is sent right away
    let hubPromise = null;
    if (this.AIHub && this.AIHub.active) {
      hubPromise = this.AIHub.connect({ mode: 'co-op', seats: [1, 4] });
    }

    // 2. Initialize Rapier 0.19.3 Physics
    try {
      await RAPIER.init();
      this.rapierReady = true;
    } catch (err) {
      if (this.AIHub && this.AIHub.active) this.AIHub.fail('Rapier 3D physics failed to initialize');
      return;
    }

    // 3. Check if we are in an AI Hub session
    let hubInfo = null;
    if (hubPromise) {
      hubInfo = await hubPromise;
    }

    const isServerCopy = Boolean(hubInfo && hubInfo.server);

    // 4. Initialize Three.js R180 WebGPURenderer (no fallback, required)
    if (!isServerCopy) {
      if (typeof navigator === 'undefined' || !navigator.gpu) {
        if (this.AIHub && this.AIHub.active) this.AIHub.fail('WebGPU is required');
        this.renderFatalError('WebGPU is required. Please use a WebGPU-capable browser.');
        return;
      }
      try {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x090412);
        this.camera = new THREE.PerspectiveCamera(
          65,
          (window.innerWidth || 1280) / Math.max(1, window.innerHeight || 720),
          0.2,
          900
        );

        this.renderer = new THREE.WebGPURenderer({
          canvas: this.canvas3D,
          antialias: true
        });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        this.renderer.setSize(window.innerWidth || 1280, window.innerHeight || 720);
        await this.renderer.init();
      } catch (err) {
        if (this.AIHub && this.AIHub.active) this.AIHub.fail('WebGPU initialization failed');
        this.renderFatalError('WebGPU initialization failed: ' + (err && err.message ? err.message : err));
        return;
      }
    } else {
      // Server copy still holds a lightweight THREE.Scene so FortressWorld entity transforms work identically
      this.scene = new THREE.Scene();
      this.camera = new THREE.PerspectiveCamera(65, 16 / 9, 0.2, 900);
    }

    this.fortress = new FortressWorld(RAPIER, this.scene, Math.random);

    if (hubInfo) {
      this.setupHubSession(hubInfo);
    } else {
      this.enterTitleScreen();
    }

    // Start main loop + background heartbeat timer so unfocused/headless iframes never stall
    this.lastFrameAt = performance.now();
    requestAnimationFrame((t) => this.frame(t));
    setInterval(() => {
      const now = performance.now();
      if (now - this.lastFrameAt > 25) {
        this.frame(now);
      }
    }, 25);
  }

  renderFatalError(msg) {
    if (!this.uiRoot) return;
    this.uiRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="vector-card">
          <h1 class="neon-title">SYSTEM FAULT // WEBGPU REQUIRED</h1>
          <p class="subtitle">${msg}</p>
        </div>
      </div>
    `;
  }

  setupHubSession(info) {
    this.net = createHubAdapter(info, this.AIHub);
    this.localId = info.me;

    const worldRng = this.net.rng('fortress');
    this.fortress.buildFortress(worldRng);
    this.spawnPlayersFromRoster(this.net.players);

    this.net.onStart(() => {
      this.phase = 'playing';
      this.sound.unlock();
      this.sound.startMusic('trench');
      this.queueTransmission(TRANSMISSIONS.intro);
      this.updateUI();
    });

    this.net.onMessage((data, from) => this.handleNetworkMessage(data, from));

    this.net.onLeave((id) => {
      const p = this.players.find((q) => q.id === id);
      if (p) {
        p.gone = true;
        if (p.mesh) p.mesh.visible = false;
      }
      if (this.net.isHost && this.phase === 'playing') {
        const remaining = this.players.filter((q) => !q.gone);
        if (remaining.length === 0) {
          this.finishSessionRound(false);
        }
      }
    });

    this.net.onTimeUp(() => {
      if (this.net.isHost) {
        this.finishSessionRound(true);
      }
    });

    this.net.onEnd(({ reason, standings }) => {
      this.phase = 'over';
      this.standings = standings;
      this.endMessage =
        reason === 'finished'
          ? 'MISSION DEBRIEF COMPLETE'
          : reason === 'sat-out'
          ? 'YOU SAT THIS SORTIE OUT'
          : 'SORTIE TERMINATED';
      this.sound.stopAll();
      this.updateUI();
    });

    if (info.splash || info.server) {
      this.phase = 'waiting';
      this.net.ready();
    } else {
      this.phase = 'ready';
    }
    this.updateUI();
  }

  enterTitleScreen() {
    if (this.net) {
      this.net.destroy();
      this.net = null;
    }
    this.phase = 'title';
    this.subScreen = 'none';
    this.titleIdleTimer = 0;
    this.fortress.buildFortress(Math.random);
    this.spawnPlayersFromRoster([
      { id: 0, name: 'VIPER-1', color: SEAT_CSS_COLORS[0], colorHex: SEAT_COLORS[0] }
    ]);
    this.sound.startMusic('menu');
    this.updateUI();
  }

  startSoloMission(startSector = 1) {
    if (this.net) {
      this.net.destroy();
      this.net = null;
    }
    this.phase = 'playing';
    this.subScreen = 'none';
    this.settingsOpen = false;
    this.fortress.buildFortress(Math.random);
    this.localId = 0;
    this.spawnPlayersFromRoster([
      { id: 0, name: 'VIPER-1', color: SEAT_CSS_COLORS[0], colorHex: SEAT_COLORS[0] }
    ]);

    const me = this.getLocalPlayer();
    if (startSector === 3 && me) {
      me.z = me.tz = SECTOR_3_Z + 40;
      this.sector = 3;
      this.sound.startMusic('boss');
      this.queueTransmission(TRANSMISSIONS.sector3);
    } else {
      this.sector = 1;
      this.sound.startMusic('trench');
      this.queueTransmission(TRANSMISSIONS.intro);
    }
    this.updateUI();
  }

  startStandaloneMultiplayer() {
    this.net = createStandaloneSquadronAdapter(this.mpConfig);
    this.localId = this.net.me;
    this.phase = 'playing';
    this.subScreen = 'none';
    this.settingsOpen = false;
    this.fortress.buildFortress(this.net.rng('fortress'));
    this.spawnPlayersFromRoster(this.net.players);

    this.net.onMessage((data, from) => this.handleNetworkMessage(data, from));
    this.net.onLeave((id) => {
      const p = this.players.find((q) => q.id === id);
      if (p) {
        p.gone = true;
        if (p.mesh) p.mesh.visible = false;
      }
    });

    this.sound.startMusic('trench');
    this.queueTransmission(TRANSMISSIONS.intro);
    this.updateUI();
  }

  startAttractMode() {
    this.phase = 'attract';
    this.subScreen = 'none';
    this.settingsOpen = false;
    this.attractTimer = 0;
    this.cameraMode = 0;
    this.fortress.buildFortress(Math.random);
    this.localId = 0;
    this.spawnPlayersFromRoster([
      { id: 0, name: 'AUTO-VIPER [DEMO]', color: SEAT_CSS_COLORS[0], colorHex: SEAT_COLORS[0] },
      { id: 1, name: 'BEX-02 [WINGMAN]', color: SEAT_CSS_COLORS[1], colorHex: SEAT_COLORS[1], isAI: true }
    ]);
    this.sound.startMusic('trench');
    this.queueTransmission(TRANSMISSIONS.intro);
    this.updateUI();
  }

  spawnPlayersFromRoster(roster) {
    for (const old of this.players) {
      if (old.mesh && this.scene) this.scene.remove(old.mesh);
    }
    this.players = [];
    this.sector = 1;
    this.sectorAnnounced = { 1: true, 2: false, 3: false, boss2: false, victory: false };
    this.lockedTargets = [];
    this.standings = null;

    const count = Math.max(1, roster.length);
    roster.forEach((r, idx) => {
      const spreadX = count === 1 ? 0 : (idx - (count - 1) / 2) * 5.5;
      const spreadY = (idx % 2 === 0 ? 1 : -1) * (count > 1 ? 1.5 : 0);
      const startZ = -18 - idx * 4;
      const mesh = buildPlayerShip(r.colorHex || SEAT_COLORS[idx % 4]);
      mesh.position.set(spreadX, spreadY, startZ);
      if (this.scene) this.scene.add(mesh);

      this.players.push({
        id: r.id,
        name: r.name,
        color: r.color || SEAT_CSS_COLORS[idx % 4],
        colorHex: r.colorHex || SEAT_COLORS[idx % 4],
        isAI: Boolean(r.isAI),
        x: spreadX,
        y: spreadY,
        z: startZ,
        tx: spreadX,
        ty: spreadY,
        tz: startZ,
        vx: 0,
        vy: 0,
        vz: -38,
        roll: 0,
        pitch: 0,
        yaw: 0,
        shield: 100,
        maxShield: 100,
        score: 0,
        kills: 0,
        rings: 0,
        missiles: 12,
        empCharge: 100,
        overdriveTimer: 0,
        rollTimer: 0,
        invulnTimer: 0,
        at: -Infinity,
        gone: false,
        mesh
      });
    });
  }

  getLocalPlayer() {
    return this.players.find((p) => p.id === this.localId && !p.gone) || null;
  }

  cycleCamera() {
    this.cameraMode = (this.cameraMode + 1) % CAMERA_MODES.length;
    this.sound.uiMove();
    this.updateUI();
  }

  toggleSettings() {
    this.settingsOpen = !this.settingsOpen;
    this.settingsIndex = 0;
    this.sound.uiConfirm();
    this.updateUI();
  }

  handleAnyUserInput(kind, detail) {
    this.sound.unlock();
    this.titleIdleTimer = 0;

    // Exit Attract Mode immediately on any input!
    if (this.phase === 'attract') {
      this.enterTitleScreen();
      return;
    }

    // Ready gesture when splash=0 in AI Hub session
    if (this.phase === 'ready' && this.net && this.net.type === 'hub') {
      this.phase = 'waiting';
      this.net.ready();
      this.updateUI();
      return;
    }

    // Quick keyboard sector warp shortcuts during solo testing/play (1, 2, 3)
    if (this.phase === 'playing' && !this.settingsOpen && (!this.net || this.net.type !== 'hub')) {
      const me = this.getLocalPlayer();
      if (me && kind === 'key') {
        if (detail === '1') {
          me.z = me.tz = -40;
          this.sector = 1;
        } else if (detail === '2') {
          me.z = me.tz = SECTOR_2_Z - 20;
        } else if (detail === '3') {
          me.z = me.tz = SECTOR_3_Z - 20;
        }
      }
    }
  }

  queueTransmission(lines) {
    if (!Array.isArray(lines)) return;
    for (const line of lines) {
      this.radioQueue.push({
        ...line,
        charIndex: 0,
        charTimer: 0,
        holdTimer: 2.6
      });
    }
  }

  stepRadio(dt) {
    if (!this.activeRadio && this.radioQueue.length > 0) {
      this.activeRadio = this.radioQueue.shift();
    }
    if (!this.activeRadio) return;

    const r = this.activeRadio;
    if (r.charIndex < r.text.length) {
      r.charTimer += dt;
      while (r.charTimer >= 0.032 && r.charIndex < r.text.length) {
        r.charTimer -= 0.032;
        const ch = r.text[r.charIndex++];
        if (r.charIndex % 2 === 1) {
          this.sound.speakAnimaleseSyllable(ch, r.pitch || 160, r.speaker);
        }
      }
    } else {
      r.holdTimer -= dt;
      if (r.holdTimer <= 0) {
        this.activeRadio = null;
      }
    }
  }

  // ---- Menu & Settings Navigation (10-Foot Controller + Keyboard) ----
  stepMenuNavigation() {
    if (this.settingsOpen) {
      const itemsCount = 7;
      if (this.menuUpPressed()) {
        this.settingsIndex = (this.settingsIndex + itemsCount - 1) % itemsCount;
        this.sound.uiMove();
        this.updateUI();
      } else if (this.menuDownPressed()) {
        this.settingsIndex = (this.settingsIndex + 1) % itemsCount;
        this.sound.uiMove();
        this.updateUI();
      } else if (this.menuLeftPressed() || this.menuRightPressed() || this.menuConfirmPressed()) {
        const dir = this.menuLeftPressed() ? -1 : 1;
        this.activateSettingsItem(this.settingsIndex, dir);
      } else if (this.input.padJustPressed(PAD.circle)) {
        this.toggleSettings();
      }
      return;
    }

    if (this.phase === 'title') {
      if (this.subScreen === 'about') {
        if (
          this.menuConfirmPressed() ||
          this.input.padJustPressed(PAD.circle) ||
          this.input.keyJustPressed('backspace')
        ) {
          this.subScreen = 'none';
          this.sound.uiBack();
          this.updateUI();
        }
        return;
      }

      if (this.subScreen === 'multiplayer') {
        const mpCount = 4;
        if (this.menuUpPressed()) {
          this.mpIndex = (this.mpIndex + mpCount - 1) % mpCount;
          this.sound.uiMove();
          this.updateUI();
        } else if (this.menuDownPressed()) {
          this.mpIndex = (this.mpIndex + 1) % mpCount;
          this.sound.uiMove();
          this.updateUI();
        } else if (this.menuLeftPressed() || this.menuRightPressed() || this.menuConfirmPressed()) {
          const dir = this.menuLeftPressed() ? -1 : 1;
          this.activateMultiplayerItem(this.mpIndex, dir);
        } else if (this.input.padJustPressed(PAD.circle) || this.input.keyJustPressed('backspace')) {
          this.subScreen = 'none';
          this.sound.uiBack();
          this.updateUI();
        }
        return;
      }

      const titleCount = 6;
      if (this.menuUpPressed()) {
        this.titleIndex = (this.titleIndex + titleCount - 1) % titleCount;
        this.sound.uiMove();
        this.updateUI();
      } else if (this.menuDownPressed()) {
        this.titleIndex = (this.titleIndex + 1) % titleCount;
        this.sound.uiMove();
        this.updateUI();
      } else if (this.menuConfirmPressed()) {
        this.activateTitleItem(this.titleIndex);
      }
      return;
    }

    if (this.phase === 'over' && (!this.net || this.net.type !== 'hub')) {
      if (this.menuConfirmPressed()) {
        this.enterTitleScreen();
      }
    }
  }

  menuUpPressed() {
    if (this.input.keyJustPressed('arrowup') || this.input.keyJustPressed('w')) return true;
    if (this.input.padJustPressed(PAD.up)) return true;
    if (this.input.padAxes[1] < -0.6 && this.input.stickMenuCooldown <= 0) {
      this.input.stickMenuCooldown = 0.22;
      return true;
    }
    return false;
  }

  menuDownPressed() {
    if (this.input.keyJustPressed('arrowdown') || this.input.keyJustPressed('s')) return true;
    if (this.input.padJustPressed(PAD.down)) return true;
    if (this.input.padAxes[1] > 0.6 && this.input.stickMenuCooldown <= 0) {
      this.input.stickMenuCooldown = 0.22;
      return true;
    }
    return false;
  }

  menuLeftPressed() {
    if (this.input.keyJustPressed('arrowleft') || this.input.keyJustPressed('a')) return true;
    if (this.input.padJustPressed(PAD.left)) return true;
    if (this.input.padAxes[0] < -0.6 && this.input.stickMenuCooldown <= 0) {
      this.input.stickMenuCooldown = 0.22;
      return true;
    }
    return false;
  }

  menuRightPressed() {
    if (this.input.keyJustPressed('arrowright') || this.input.keyJustPressed('d')) return true;
    if (this.input.padJustPressed(PAD.right)) return true;
    if (this.input.padAxes[0] > 0.6 && this.input.stickMenuCooldown <= 0) {
      this.input.stickMenuCooldown = 0.22;
      return true;
    }
    return false;
  }

  menuConfirmPressed() {
    return (
      this.input.keyJustPressed('enter') ||
      this.input.keyJustPressed(' ') ||
      this.input.padJustPressed(PAD.cross)
    );
  }

  activateTitleItem(idx) {
    this.sound.uiConfirm();
    if (idx === 0) this.startSoloMission(1);
    else if (idx === 1) this.startSoloMission(3);
    else if (idx === 2) {
      this.subScreen = 'multiplayer';
      this.mpIndex = 0;
      this.updateUI();
    } else if (idx === 3) this.startAttractMode();
    else if (idx === 4) this.toggleSettings();
    else if (idx === 5) {
      this.subScreen = 'about';
      this.updateUI();
    }
  }

  activateMultiplayerItem(idx, dir) {
    this.sound.uiConfirm();
    const codes = ['KLAXON', 'RED001', 'VIPER9', 'OMEGA4'];
    if (idx === 0) {
      const cIdx = (codes.indexOf(this.mpConfig.roomCode) + dir + codes.length) % codes.length;
      this.mpConfig.roomCode = codes[cIdx];
      this.updateUI();
    } else if (idx === 1) {
      this.mpConfig.aiWingmen = (this.mpConfig.aiWingmen + dir + 4) % 4;
      this.updateUI();
    } else if (idx === 2) {
      this.startStandaloneMultiplayer();
    } else if (idx === 3) {
      this.subScreen = 'none';
      this.updateUI();
    }
  }

  activateSettingsItem(idx, dir) {
    this.sound.uiConfirm();
    if (idx === 0) {
      this.input.settings.invertX = !this.input.settings.invertX;
    } else if (idx === 1) {
      this.input.settings.invertY = !this.input.settings.invertY;
    } else if (idx === 2) {
      this.sound.setMuted(!this.sound.settings.muted);
    } else if (idx === 3) {
      this.sound.settings.music = Math.max(0, Math.min(1, Math.round((this.sound.settings.music + dir * 0.2) * 10) / 10));
      this.sound.applyVolumes();
    } else if (idx === 4) {
      this.sound.settings.sfx = Math.max(0, Math.min(1, Math.round((this.sound.settings.sfx + dir * 0.2) * 10) / 10));
      this.sound.settings.voice = this.sound.settings.sfx;
      this.sound.applyVolumes();
    } else if (idx === 5) {
      this.cameraMode = (this.cameraMode + dir + CAMERA_MODES.length) % CAMERA_MODES.length;
    } else if (idx === 6) {
      this.toggleSettings();
      return;
    }
    this.updateUI();
  }

  // ---- Main Frame Loop ----
  frame(now) {
    const rawDt = (now - this.lastFrameAt) / 1000;
    const dt = Math.max(0.001, Math.min(rawDt, 0.1));
    this.lastFrameAt = now;

    this.input.pollGamepad(dt);
    this.input.updateFlightInput(this.settingsOpen);
    this.stepMenuNavigation();

    if (this.phase === 'title') {
      this.worldSeconds += dt;
      if (this.subScreen === 'none' && !this.settingsOpen && !this.input.isTouchOnly()) {
        this.titleIdleTimer += dt;
        if (this.titleIdleTimer >= 10.0) {
          this.startAttractMode();
        }
      }
      this.stepTitleBackdrop(dt);
    } else if (this.phase === 'attract') {
      this.worldSeconds += dt;
      this.stepAttractAI(dt);
      this.stepWorldSimulation(now, dt);
    } else if (this.phase === 'playing') {
      const canAdvance = !this.net || this.net.type !== 'hub' || this.net.time() >= 0;
      if (canAdvance) {
        this.worldSeconds += dt;
        this.stepWorldSimulation(now, dt);
      }
    }

    this.input.clearJustPressed();

    // Render 3D WebGPU scene & 2D HUD (skip on headless server copy)
    if (!this.net?.server && this.renderer && this.scene && this.camera) {
      try {
        this.renderer.render(this.scene, this.camera);
      } catch (e) {}
      this.renderHUD(now);
    }

    requestAnimationFrame((t) => this.frame(t));
  }

  stepTitleBackdrop(dt) {
    const me = this.getLocalPlayer();
    if (me && me.mesh) {
      me.mesh.position.x = Math.sin(this.worldSeconds * 1.1) * 4.5;
      me.mesh.position.y = Math.cos(this.worldSeconds * 1.5) * 2.2;
      me.mesh.position.z = -20 - ((this.worldSeconds * 28) % 600);
      me.mesh.rotation.z = -Math.cos(this.worldSeconds * 1.1) * 0.35;
      this.camera.position.set(
        me.mesh.position.x * 0.6 + 5.5,
        me.mesh.position.y + 3.2,
        me.mesh.position.z + 12.5
      );
      this.camera.lookAt(me.mesh.position.x, me.mesh.position.y, me.mesh.position.z - 15);
    }
  }

  stepAttractAI(dt) {
    this.attractTimer += dt;
    // Cycle camera every 5.5 seconds in Attract Mode to showcase all 4 Red Alarm views!
    const desiredCam = Math.floor(this.attractTimer / 5.5) % CAMERA_MODES.length;
    if (desiredCam !== this.cameraMode) {
      this.cameraMode = desiredCam;
    }

    const me = this.getLocalPlayer();
    if (!me) return;

    // Warp between sectors across a 28-second loop so spectators see Trench, Blast Doors, AND Boss!
    if (this.attractTimer > 10 && this.attractTimer < 10.2 && me.z > SECTOR_2_Z) {
      me.z = me.tz = SECTOR_2_Z - 30;
    } else if (this.attractTimer > 19 && this.attractTimer < 19.2 && me.z > SECTOR_3_Z) {
      me.z = me.tz = SECTOR_3_Z - 40;
    } else if (this.attractTimer > 32) {
      this.attractTimer = 0;
      me.z = me.tz = -25;
      this.sector = 1;
    }

    // Cheat freely in Attract Mode: infinite shields, ammo, sinusoidal weave + auto fire & missiles
    me.shield = 100;
    me.missiles = 12;
    this.input.felt = {
      x: Math.sin(this.attractTimer * 2.1) * 0.75,
      y: Math.cos(this.attractTimer * 1.7) * 0.65,
      aimX: 0,
      aimY: 0,
      fire: true,
      missile: Math.floor(this.attractTimer * 2) % 5 === 0,
      boost: Math.floor(this.attractTimer) % 6 === 0,
      brake: false,
      roll: Math.floor(this.attractTimer * 3) % 11 === 0,
      emp: false
    };
  }

  stepWorldSimulation(now, dt) {
    this.stepRadio(dt);
    if (this.screenFlash > 0) this.screenFlash = Math.max(0, this.screenFlash - dt * 2.5);

    const me = this.getLocalPlayer();
    if (me) {
      this.stepLocalPlayer(me, this.input.felt, dt);
    }

    // Step AI Wingmen (in Attract Mode or Standalone Squadron Co-op)
    for (const p of this.players) {
      if (p.isAI && !p.gone) {
        this.stepWingmanAI(p, me, dt);
      }
    }

    // Step Enemies, Laser Gates, Blast Doors, Boss, Projectiles & Rapier Physics
    this.stepFortressEntities(dt);
    this.fortress.stepPhysicsAndFX(dt);

    // Update Camera to track local player (or boss arena if server/spectating)
    if (me) {
      this.updateCameraForPlayer(me, dt);
    }

    // Network synchronization (AI Hub or Standalone Multiplayer)
    if (this.net) {
      this.stepNetworkSync(now, dt, me);
    }
  }

  stepLocalPlayer(p, ctrl, dt) {
    if (p.invulnTimer > 0) p.invulnTimer = Math.max(0, p.invulnTimer - dt);
    if (p.overdriveTimer > 0) p.overdriveTimer = Math.max(0, p.overdriveTimer - dt);
    p.empCharge = Math.min(100, p.empCharge + dt * 6);

    // Barrel Roll Evasion
    if (ctrl.roll && p.rollTimer <= 0) {
      p.rollTimer = 0.62;
      this.sound.barrelRoll();
    }
    if (p.rollTimer > 0) {
      p.rollTimer = Math.max(0, p.rollTimer - dt);
    }

    // Nova EMP Smart-Pulse
    if (ctrl.emp && p.empCharge >= 100) {
      p.empCharge = 0;
      this.triggerNovaEMP(p);
    }

    // Lateral X/Y Velocity
    const strafeSpeed = 24.0;
    const targetVx = ctrl.x * strafeSpeed;
    const targetVy = -ctrl.y * strafeSpeed;
    p.vx += (targetVx - p.vx) * Math.min(1, dt * 10);
    p.vy += (targetVy - p.vy) * Math.min(1, dt * 10);

    // Forward Z Speed (Trench flight vs Sector 3 Boss Arena orbit)
    let baseForward = -48.0;
    if (ctrl.boost) {
      baseForward = -78.0;
      if (Math.random() < 0.15) this.sound.boost();
    } else if (ctrl.brake) {
      baseForward = -22.0;
    }

    // In Sector 3 Boss Chamber, hold forward Z in combat range in front of Cerberus-Omega
    if (p.z <= BOSS_Z + 95) {
      const targetZ = BOSS_Z + 68 + (ctrl.boost ? -16 : ctrl.brake ? 18 : 0);
      p.vz = (targetZ - p.z) * 3.5;
    } else {
      p.vz = baseForward;
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;

    // Corridor Wall Clamping + Rapier Wall Bounce Deflection
    const maxW = CORRIDOR_HALF_W - 2.1;
    const maxH = CORRIDOR_HALF_H - 1.8;
    if (p.x < -maxW) {
      p.x = -maxW;
      p.vx = Math.abs(p.vx) * 0.5;
    } else if (p.x > maxW) {
      p.x = maxW;
      p.vx = -Math.abs(p.vx) * 0.5;
    }
    if (p.y < -maxH) {
      p.y = -maxH;
      p.vy = Math.abs(p.vy) * 0.5;
    } else if (p.y > maxH) {
      p.y = maxH;
      p.vy = -Math.abs(p.vy) * 0.5;
    }

    p.tx = p.x;
    p.ty = p.y;
    p.tz = p.z;

    // Attitude Bank/Pitch/Yaw + Articulated Swing-Wing Animation
    const targetRoll = -ctrl.x * 0.65 + (p.rollTimer > 0 ? p.rollTimer * Math.PI * 6.4 : 0);
    const targetPitch = -ctrl.y * 0.35;
    const targetYaw = -ctrl.x * 0.22;
    p.roll += (targetRoll - p.roll) * Math.min(1, dt * 12);
    p.pitch += (targetPitch - p.pitch) * Math.min(1, dt * 10);
    p.yaw += (targetYaw - p.yaw) * Math.min(1, dt * 10);

    this.syncPlayerMesh(p, ctrl.boost, ctrl.brake);

    // Check Sector Transitions
    if (p.z <= SECTOR_2_Z && this.sector < 2) {
      this.sector = 2;
      if (!this.sectorAnnounced[2]) {
        this.sectorAnnounced[2] = true;
        this.sound.klaxon();
        this.queueTransmission(TRANSMISSIONS.sector2);
      }
    }
    if (p.z <= SECTOR_3_Z && this.sector < 3) {
      this.sector = 3;
      if (!this.sectorAnnounced[3]) {
        this.sectorAnnounced[3] = true;
        this.sound.klaxon();
        this.sound.startMusic('boss');
        this.queueTransmission(TRANSMISSIONS.sector3);
      }
    }

    // Weapons: Twin Pulse Vulcan Lasers
    if (this.fireCooldown > 0) this.fireCooldown -= dt;
    if (ctrl.fire && this.fireCooldown <= 0) {
      this.fireCooldown = p.overdriveTimer > 0 ? 0.075 : 0.125;
      this.fireTwinLasers(p);
    }

    // Multi-Lock Target Painting & Homing Missile Salvo
    this.updateTargetLocks(p, dt);
    if (this.missileCooldown > 0) this.missileCooldown -= dt;
    if (ctrl.missile && this.missileCooldown <= 0 && p.missiles > 0) {
      this.missileCooldown = 0.55;
      this.fireHomingMissileSalvo(p);
    }
  }

  syncPlayerMesh(p, boost = false, brake = false) {
    if (!p.mesh) return;
    p.mesh.position.set(p.x, p.y, p.z);
    p.mesh.rotation.set(p.pitch, p.yaw, p.roll);

    const ud = p.mesh.userData;
    if (ud.leftWing && ud.rightWing) {
      const sweep = boost ? 0.48 : brake ? -0.25 : 0;
      ud.leftWing.rotation.y += (sweep - ud.leftWing.rotation.y) * 0.2;
      ud.rightWing.rotation.y += (-sweep - ud.rightWing.rotation.y) * 0.2;
    }
    if (ud.thrusterL && ud.thrusterR) {
      const pulse = (boost ? 1.85 : 1.0) + Math.sin(this.worldSeconds * 28) * 0.2;
      ud.thrusterL.scale.set(1, pulse, 1);
      ud.thrusterR.scale.set(1, pulse, 1);
    }
    if (ud.shieldCage) {
      ud.shieldCage.rotation.y += 0.08;
      ud.shieldCage.rotation.z -= 0.06;
      ud.shieldCage.material.opacity = p.rollTimer > 0 ? 0.85 : 0.0;
    }
  }

  stepWingmanAI(ai, leader, dt) {
    const refZ = leader ? leader.z : ai.z - 45 * dt;
    const offsetIdx = ai.id % 3;
    const formX = (offsetIdx === 1 ? -7.5 : offsetIdx === 2 ? 7.5 : 0) + Math.sin(this.worldSeconds * 1.8 + ai.id) * 3.5;
    const formY = (offsetIdx === 1 ? 2.5 : -2.5) + Math.cos(this.worldSeconds * 1.4 + ai.id) * 2.0;
    const formZ = refZ - 10 - offsetIdx * 4;

    ai.x += (formX - ai.x) * Math.min(1, dt * 4);
    ai.y += (formY - ai.y) * Math.min(1, dt * 4);
    ai.z += (formZ - ai.z) * Math.min(1, dt * 5);
    ai.roll = -(formX - ai.x) * 0.12;
    this.syncPlayerMesh(ai, false, false);

    if (Math.random() < dt * 2.8) {
      this.fireTwinLasers(ai, true);
    }
  }

  fireTwinLasers(p, silent = false) {
    if (!silent) this.sound.laser();

    // Auto-assist convergence toward nearest target in front cone
    let aimDir = new THREE.Vector3(0, 0, -1);
    const bestTarget = this.findNearestTargetInCone(p, 95, 0.35);
    if (bestTarget) {
      aimDir.set(bestTarget.x - p.x, bestTarget.y - p.y, bestTarget.z - p.z).normalize();
    } else {
      aimDir.set(-Math.sin(p.yaw) * 0.4, Math.sin(p.pitch) * 0.4, -1).normalize();
    }

    const boltMat = createEnergyMaterial(p.overdriveTimer > 0 ? 0xff44ff : 0x33ffff, 0.96);
    const offsets = [-1.6, 1.6];
    offsets.forEach((ox) => {
      const geo = new THREE.BoxGeometry(0.28, 0.28, 3.6);
      const mesh = new THREE.Mesh(geo, boltMat);
      mesh.position.set(p.x + ox, p.y - 0.15, p.z - 2.0);
      this.fortress.worldGroup.add(mesh);

      this.fortress.projectiles.push({
        ownerId: p.id,
        kind: 'laser',
        mesh,
        x: mesh.position.x,
        y: mesh.position.y,
        z: mesh.position.z,
        vx: aimDir.x * 165,
        vy: aimDir.y * 165,
        vz: aimDir.z * 165,
        damage: p.overdriveTimer > 0 ? 18 : 12,
        life: 1.1
      });
    });
  }

  updateTargetLocks(p, dt) {
    this.lockTimer += dt;
    if (this.lockTimer < 0.18) return;
    this.lockTimer = 0;

    const candidates = [];
    for (const e of this.fortress.enemies) {
      if (!e.alive) continue;
      const dz = e.z - p.z;
      if (dz < -5 && dz > -145) {
        const dist = Math.hypot(e.x - p.x, e.y - p.y, dz);
        candidates.push({ type: 'enemy', ref: e, x: e.x, y: e.y, z: e.z, dist });
      }
    }

    if (this.fortress.boss && this.fortress.boss.alive && Math.abs(this.fortress.boss.z - p.z) < 160) {
      const b = this.fortress.boss;
      let anyArmAlive = false;
      for (const arm of b.arms) {
        if (arm.alive) {
          anyArmAlive = true;
          const wp = new THREE.Vector3();
          arm.genNode.getWorldPosition(wp);
          candidates.push({ type: 'boss-arm', ref: arm, x: wp.x, y: wp.y, z: wp.z, dist: Math.hypot(wp.x - p.x, wp.y - p.y, wp.z - p.z) });
        }
      }
      if (!anyArmAlive) {
        candidates.push({ type: 'boss-core', ref: b, x: b.x, y: b.y, z: b.z, dist: Math.hypot(b.x - p.x, b.y - p.y, b.z - p.z) });
      }
    }

    candidates.sort((a, b) => a.dist - b.dist);
    const prevCount = this.lockedTargets.length;
    this.lockedTargets = candidates.slice(0, 6);
    if (this.lockedTargets.length > prevCount && this.phase === 'playing') {
      this.sound.lockOn(this.lockedTargets.length);
    }
  }

  fireHomingMissileSalvo(p) {
    const targets = this.lockedTargets.length > 0 ? this.lockedTargets.slice(0, Math.min(4, p.missiles)) : [null];
    p.missiles = Math.max(0, p.missiles - targets.length);
    this.sound.missileLaunch();

    const mMat = createEnergyMaterial(0xffaa00, 0.96);
    targets.forEach((t, idx) => {
      const geo = new THREE.ConeGeometry(0.42, 2.2, 5);
      geo.rotateX(-Math.PI / 2);
      const mesh = decorateCelMesh(new THREE.Mesh(geo, mMat), 0xffffff, false);
      const side = idx % 2 === 0 ? -1.2 : 1.2;
      mesh.position.set(p.x + side, p.y - 0.4, p.z - 1.8);
      this.fortress.worldGroup.add(mesh);

      this.fortress.projectiles.push({
        ownerId: p.id,
        kind: 'missile',
        target: t,
        mesh,
        x: mesh.position.x,
        y: mesh.position.y,
        z: mesh.position.z,
        vx: side * 8,
        vy: (idx < 2 ? 1 : -1) * 5,
        vz: -115,
        damage: 38,
        life: 2.2
      });
    });
  }

  triggerNovaEMP(p) {
    this.sound.emp();
    this.screenFlash = 0.85;
    this.screenFlashColor = '#33e6ff';
    this.fortress.spawnExplosion(p.x, p.y, p.z - 12, 0x33e6ff, 2.8);

    // Clear enemy projectiles
    for (const ep of this.fortress.enemyProjectiles) {
      this.fortress.worldGroup.remove(ep.mesh);
    }
    this.fortress.enemyProjectiles.length = 0;

    // Damage all enemies within 110m
    for (const e of this.fortress.enemies) {
      if (e.alive && Math.abs(e.z - p.z) < 110) {
        this.damageEnemy(e, 45, p);
      }
    }
  }

  findNearestTargetInCone(p, maxDist, maxAngleSin) {
    let best = null;
    let bestDist = maxDist;
    for (const e of this.fortress.enemies) {
      if (!e.alive) continue;
      const dx = e.x - p.x;
      const dy = e.y - p.y;
      const dz = e.z - p.z;
      if (dz >= -2) continue;
      const d = Math.hypot(dx, dy, dz);
      if (d < bestDist && Math.hypot(dx, dy) / d < maxAngleSin) {
        bestDist = d;
        best = { x: e.x, y: e.y, z: e.z };
      }
    }
    return best;
  }

  stepFortressEntities(dt) {
    const me = this.getLocalPlayer() || this.players[0];
    const refZ = me ? me.z : -100;

    // 1. Player Projectiles (Lasers & Homing Missiles)
    for (let i = this.fortress.projectiles.length - 1; i >= 0; i--) {
      const pr = this.fortress.projectiles[i];
      pr.life -= dt;
      if (pr.life <= 0) {
        this.fortress.worldGroup.remove(pr.mesh);
        this.fortress.projectiles.splice(i, 1);
        continue;
      }

      if (pr.kind === 'missile' && pr.target) {
        let tx = pr.target.x;
        let ty = pr.target.y;
        let tz = pr.target.z;
        if (pr.target.type === 'enemy' && pr.target.ref.alive) {
          tx = pr.target.ref.x;
          ty = pr.target.ref.y;
          tz = pr.target.ref.z;
        } else if (pr.target.type === 'boss-arm' && pr.target.ref.alive) {
          const wp = new THREE.Vector3();
          pr.target.ref.genNode.getWorldPosition(wp);
          tx = wp.x;
          ty = wp.y;
          tz = wp.z;
        }
        const dx = tx - pr.x;
        const dy = ty - pr.y;
        const dz = tz - pr.z;
        const d = Math.max(0.1, Math.hypot(dx, dy, dz));
        pr.vx += (dx / d) * 320 * dt;
        pr.vy += (dy / d) * 320 * dt;
        pr.vz += (dz / d) * 320 * dt;
        const spd = Math.hypot(pr.vx, pr.vy, pr.vz);
        if (spd > 135) {
          pr.vx = (pr.vx / spd) * 135;
          pr.vy = (pr.vy / spd) * 135;
          pr.vz = (pr.vz / spd) * 135;
        }
      }

      pr.x += pr.vx * dt;
      pr.y += pr.vy * dt;
      pr.z += pr.vz * dt;
      pr.mesh.position.set(pr.x, pr.y, pr.z);

      // Hit check against Enemies
      let hit = false;
      const shooter = this.players.find((p) => p.id === pr.ownerId) || me;

      for (const e of this.fortress.enemies) {
        if (!e.alive) continue;
        if (Math.hypot(pr.x - e.x, pr.y - e.y, pr.z - e.z) < e.radius + 1.4) {
          this.damageEnemy(e, pr.damage, shooter);
          hit = true;
          break;
        }
      }

      // Hit check against Blast Door Lock Nodes
      if (!hit) {
        for (const door of this.fortress.blastDoors) {
          if (door.unlocked || Math.abs(pr.z - door.z) > 3.5) continue;
          const lx = -CORRIDOR_HALF_W + 2.4;
          const rx = CORRIDOR_HALF_W - 2.4;
          const ly = 5.5;
          if (door.lockLAlive && Math.hypot(pr.x - lx, pr.y - ly) < 2.6) {
            door.lockLAlive = false;
            door.mesh.userData.lockL.visible = false;
            this.fortress.spawnExplosion(lx, ly, door.z, 0xffaa00, 1.1);
            this.sound.explosion(0.8);
            if (shooter) shooter.score += 250;
            hit = true;
          } else if (door.lockRAlive && Math.hypot(pr.x - rx, pr.y - ly) < 2.6) {
            door.lockRAlive = false;
            door.mesh.userData.lockR.visible = false;
            this.fortress.spawnExplosion(rx, ly, door.z, 0xffaa00, 1.1);
            this.sound.explosion(0.8);
            if (shooter) shooter.score += 250;
            hit = true;
          }
          if (!door.lockLAlive && !door.lockRAlive && !door.unlocked) {
            door.unlocked = true;
            if (shooter) shooter.score += 500;
            this.sound.powerup();
          }
        }
      }

      // Hit check against Boss (Cerberus-Omega)
      if (!hit && this.fortress.boss && this.fortress.boss.alive) {
        const b = this.fortress.boss;
        if (Math.abs(pr.z - b.z) < 18) {
          for (const arm of b.arms) {
            if (!arm.alive) continue;
            const wp = new THREE.Vector3();
            arm.genNode.getWorldPosition(wp);
            if (Math.hypot(pr.x - wp.x, pr.y - wp.y, pr.z - wp.z) < 3.4) {
              arm.hp -= pr.damage;
              this.fortress.spawnExplosion(wp.x, wp.y, wp.z, 0xffaa00, 0.7);
              if (arm.hp <= 0) {
                arm.alive = false;
                arm.genNode.visible = false;
                this.fortress.spawnExplosion(wp.x, wp.y, wp.z, 0xff2244, 1.8);
                this.sound.explosion(1.4);
                if (shooter) {
                  shooter.score += 1000;
                  shooter.kills += 1;
                }
              }
              hit = true;
              break;
            }
          }
          if (!hit && Math.hypot(pr.x - b.x, pr.y - b.y, pr.z - b.z) < 6.2) {
            const allArmsDown = b.arms.every((a) => !a.alive);
            const dmgScale = allArmsDown ? 1.0 : 0.35;
            b.hp -= pr.damage * dmgScale;
            this.fortress.spawnExplosion(pr.x, pr.y, pr.z, 0xff0055, 0.8);
            if (shooter) shooter.score += 50;
            if (b.hp <= 0) {
              this.defeatBoss(shooter);
            }
            hit = true;
          }
        }
      }

      if (hit) {
        this.fortress.worldGroup.remove(pr.mesh);
        this.fortress.projectiles.splice(i, 1);
      }
    }

    // 2. Enemies Animation, Movement & Firing
    for (const e of this.fortress.enemies) {
      if (!e.alive) continue;
      const distZ = e.z - refZ;
      if (distZ > 35 || distZ < -220) continue;

      if (e.type === 'spider') {
        e.x = e.baseX + Math.sin(this.worldSeconds * 2.2 + e.phaseOffset) * 4.5;
        const legs = e.mesh.userData.legs || [];
        for (const leg of legs) {
          leg.pivot.rotation.y = Math.sin(this.worldSeconds * 10 + leg.index * 1.5) * 0.35 * leg.side;
        }
      } else if (e.type === 'interceptor') {
        e.x = e.baseX + Math.cos(this.worldSeconds * 2.6 + e.phaseOffset) * 6.5;
        e.y = e.baseY + Math.sin(this.worldSeconds * 2.0 + e.phaseOffset) * 3.8;
        e.z += 16 * dt;
        if (e.mesh.userData.gyroRing) {
          e.mesh.userData.gyroRing.rotation.z += dt * 4.5;
        }
      } else if (e.type === 'turret') {
        if (me && e.mesh.userData.head) {
          e.mesh.userData.head.lookAt(me.x, me.y, me.z);
        }
      } else if (e.type === 'tank') {
        e.x = e.baseX + Math.sin(this.worldSeconds * 1.2 + e.phaseOffset) * 3.0;
        if (e.mesh.userData.radar) {
          e.mesh.userData.radar.rotation.y += dt * 5.0;
        }
      }

      e.mesh.position.set(e.x, e.y, e.z);
      e.body.setNextKinematicTranslation({ x: e.x, y: e.y, z: e.z });

      e.fireTimer -= dt;
      if (e.fireTimer <= 0 && me && distZ < -12 && distZ > -135) {
        e.fireTimer = e.type === 'tank' ? 1.8 : 2.4;
        this.spawnEnemyShot(e.x, e.y + 1.0, e.z, me.x, me.y, me.z);
      }

      // Ship-Enemy Collision Check
      if (me && Math.hypot(me.x - e.x, me.y - e.y, me.z - e.z) < e.radius + 1.8) {
        this.damagePlayer(me, 14);
        this.damageEnemy(e, 100, me);
      }
    }

    // 3. Sweeping / Rotating Laser Security Gates
    for (const g of this.fortress.gates) {
      if (g.pattern === 'rotating') {
        g.angle += dt * 1.45;
        g.mesh.userData.beamGroup.rotation.z = g.angle;
      } else if (g.pattern === 'horizontal') {
        g.mesh.userData.beamGroup.position.y = Math.sin(this.worldSeconds * 2.0 + g.id) * 3.2;
      } else if (g.pattern === 'vertical') {
        g.mesh.userData.beamGroup.position.x = Math.cos(this.worldSeconds * 2.0 + g.id) * 4.0;
      }

      if (me && Math.abs(me.z - g.z) < 1.6) {
        if (g.pattern === 'horizontal') {
          const by = g.mesh.userData.beamGroup.position.y;
          if (Math.abs(me.y - (by + 3.2)) < 1.3 || Math.abs(me.y - (by - 3.2)) < 1.3) {
            this.damagePlayer(me, 12);
          }
        }
      }
    }

    // 4. Hydraulic Blast Doors
    for (const door of this.fortress.blastDoors) {
      const targetOpen = door.unlocked ? 1.0 : 0.32 + Math.sin(this.worldSeconds * 1.8 + door.id) * 0.14;
      door.openAmount += (targetOpen - door.openAmount) * Math.min(1, dt * 4);
      const halfW = CORRIDOR_HALF_W;
      const gap = door.openAmount * 9.5;
      door.mesh.userData.leftPanel.position.x = -halfW / 2 - gap;
      door.mesh.userData.rightPanel.position.x = halfW / 2 + gap;

      if (me && Math.abs(me.z - door.z) < 1.8 && Math.abs(me.x) > gap + 1.5) {
        this.damagePlayer(me, 15);
      }
    }

    // 5. Score Rings & Powerup Holocrons
    for (const r of this.fortress.rings) {
      r.mesh.rotation.z += dt * 1.8;
      if (!r.passed && me && Math.abs(me.z - r.z) < 2.5 && Math.hypot(me.x - r.x, me.y - r.y) < 4.4) {
        r.passed = true;
        r.mesh.visible = false;
        me.score += 300;
        me.rings += 1;
        me.shield = Math.min(me.maxShield, me.shield + 10);
        this.sound.powerup();
      }
    }

    for (const item of this.fortress.powerups) {
      if (item.taken) continue;
      item.mesh.rotation.y += dt * 2.5;
      if (me && Math.hypot(me.x - item.x, me.y - item.y, me.z - item.z) < 3.4) {
        item.taken = true;
        item.mesh.visible = false;
        this.sound.powerup();
        me.score += 250;
        if (item.kind === 'shield') me.shield = Math.min(me.maxShield, me.shield + 40);
        else if (item.kind === 'missiles') me.missiles = Math.min(20, me.missiles + 6);
        else if (item.kind === 'emp') me.empCharge = 100;
        else if (item.kind === 'overdrive') me.overdriveTimer = 8.0;
      }
    }

    // 6. Boss Cerberus-Omega Animation & Attacks
    if (this.fortress.boss && this.fortress.boss.alive) {
      const b = this.fortress.boss;
      const ud = b.mesh.userData;
      ud.ring1.rotation.z += dt * 1.1;
      ud.ring1.rotation.y += dt * 0.6;
      ud.ring2.rotation.x -= dt * 0.9;
      ud.ring2.rotation.z -= dt * 0.8;
      ud.heart.rotation.y += dt * 2.4;
      ud.heart.scale.setScalar(1.0 + Math.sin(this.worldSeconds * 8) * 0.14);

      const allArmsDown = b.arms.every((a) => !a.alive);
      if (allArmsDown && b.phase === 1) {
        b.phase = 2;
        if (!this.sectorAnnounced.boss2) {
          this.sectorAnnounced.boss2 = true;
          this.sound.klaxon();
          this.queueTransmission(TRANSMISSIONS.bossPhase2);
        }
      }

      for (const arm of b.arms) {
        arm.armPivot.rotation.z += dt * (b.phase === 2 ? 1.2 : 0.55);
      }

      if (me && Math.abs(me.z - b.z) < 130) {
        b.fireCooldown -= dt;
        if (b.fireCooldown <= 0) {
          b.fireCooldown = b.phase === 2 ? 0.85 : 1.35;
          this.spawnEnemyShot(
            b.x + (Math.random() - 0.5) * 14,
            b.y + (Math.random() - 0.5) * 10,
            b.z + 6,
            me.x,
            me.y,
            me.z
          );
        }
      }
    }

    // 7. Enemy Projectiles
    for (let i = this.fortress.enemyProjectiles.length - 1; i >= 0; i--) {
      const ep = this.fortress.enemyProjectiles[i];
      ep.life -= dt;
      if (ep.life <= 0) {
        this.fortress.worldGroup.remove(ep.mesh);
        this.fortress.enemyProjectiles.splice(i, 1);
        continue;
      }
      ep.x += ep.vx * dt;
      ep.y += ep.vy * dt;
      ep.z += ep.vz * dt;
      ep.mesh.position.set(ep.x, ep.y, ep.z);

      if (me && Math.hypot(ep.x - me.x, ep.y - me.y, ep.z - me.z) < 2.2) {
        if (me.rollTimer > 0) {
          // Deflected by Barrel Roll!
          me.score += 50;
          this.sound.barrelRoll();
        } else {
          this.damagePlayer(me, 10);
        }
        this.fortress.worldGroup.remove(ep.mesh);
        this.fortress.enemyProjectiles.splice(i, 1);
      }
    }
  }

  spawnEnemyShot(sx, sy, sz, tx, ty, tz) {
    const dx = tx - sx;
    const dy = ty - sy;
    const dz = tz - sz;
    const d = Math.max(0.1, Math.hypot(dx, dy, dz));
    const speed = 58;

    const mat = createEnergyMaterial(0xff2244, 0.95);
    const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.65, 0), mat);
    mesh.position.set(sx, sy, sz);
    this.fortress.worldGroup.add(mesh);

    this.fortress.enemyProjectiles.push({
      mesh,
      x: sx,
      y: sy,
      z: sz,
      vx: (dx / d) * speed,
      vy: (dy / d) * speed,
      vz: (dz / d) * speed,
      life: 2.6
    });
  }

  damageEnemy(e, amount, attacker) {
    if (!e.alive) return;
    e.hp -= amount;
    if (e.hp <= 0) {
      e.alive = false;
      e.mesh.visible = false;
      this.fortress.spawnExplosion(e.x, e.y, e.z, 0xff3355, 1.25);
      this.sound.explosion(1.0);
      if (attacker) {
        attacker.score += e.score;
        attacker.kills += 1;
      }
      if (this.net) {
        this.net.send({ t: 'kill', eid: e.id, by: attacker ? attacker.id : 0 });
      }
    }
  }

  damagePlayer(p, amount) {
    if (this.phase === 'attract' || p.invulnTimer > 0 || p.rollTimer > 0) return;
    p.invulnTimer = 0.75;
    p.shield = Math.max(0, p.shield - amount);
    this.screenFlash = 0.55;
    this.screenFlashColor = '#ff1144';
    this.sound.shieldHit();

    if (p.shield <= 0) {
      // Emergency Auto-Repair Reboot penalty (-250 score, full shield restore so co-op / demo flow stays exciting!)
      p.shield = p.maxShield;
      p.score = Math.max(0, p.score - 250);
      this.sound.klaxon();
      this.fortress.spawnExplosion(p.x, p.y, p.z, 0xffaa00, 1.5);
    }
  }

  defeatBoss(attacker) {
    const b = this.fortress.boss;
    if (!b || !b.alive) return;
    b.alive = false;
    b.mesh.visible = false;
    this.fortress.spawnExplosion(b.x, b.y, b.z, 0xff1144, 4.0);
    this.sound.explosion(2.2);
    this.sound.powerup();
    if (attacker) {
      attacker.score += 5000;
      attacker.kills += 1;
    }
    this.wonRound = true;
    if (!this.sectorAnnounced.victory) {
      this.sectorAnnounced.victory = true;
      this.queueTransmission(TRANSMISSIONS.victory);
    }

    if (this.net && this.net.type === 'hub') {
      if (this.net.isHost) {
        this.finishSessionRound(true);
      } else {
        this.net.send({ t: 'boss-down', by: attacker ? attacker.id : 0 }, { to: this.net.host });
      }
    } else if (this.phase === 'playing') {
      setTimeout(() => {
        if (this.phase === 'playing') {
          this.phase = 'over';
          this.endMessage = 'K.L.A.X.O.N. CORE DESTROYED — VICTORY!';
          this.updateUI();
        }
      }, 2800);
    }
  }

  // ---- 4-Perspective Red Alarm Camera System ----
  updateCameraForPlayer(p, dt) {
    if (!this.camera || !p) return;

    if (this.cameraMode === 0) {
      // 0: Tail Chase Cam (Dynamic smooth chase behind the Scarlet-Viper)
      const targetX = p.x * 0.78;
      const targetY = p.y * 0.78 + 2.6;
      const targetZ = p.z + 11.5;
      this.camera.position.x += (targetX - this.camera.position.x) * Math.min(1, dt * 10);
      this.camera.position.y += (targetY - this.camera.position.y) * Math.min(1, dt * 10);
      this.camera.position.z = targetZ;
      this.camera.lookAt(p.x * 0.9, p.y * 0.9, p.z - 28);
      this.camera.rotation.z = p.roll * 0.25;
      if (p.mesh) p.mesh.visible = true;
    } else if (this.cameraMode === 1) {
      // 1: Cockpit Vector HUD (First-Person inside the Scarlet-Viper Canopy)
      this.camera.position.set(p.x, p.y + 0.55, p.z - 1.2);
      this.camera.lookAt(p.x - Math.sin(p.yaw) * 20, p.y + Math.sin(p.pitch) * 20, p.z - 40);
      this.camera.rotation.z = p.roll * 0.55;
      if (p.mesh) p.mesh.visible = false;
    } else if (this.cameraMode === 2) {
      // 2: Close Wing Dogfight Cam
      this.camera.position.set(p.x + 2.8, p.y + 1.1, p.z + 5.6);
      this.camera.lookAt(p.x, p.y, p.z - 32);
      this.camera.rotation.z = p.roll * 0.35;
      if (p.mesh) p.mesh.visible = true;
    } else {
      // 3: Tactical Overhead Vector Cam (Red Alarm Top-Down Perspective)
      this.camera.position.set(p.x * 0.4, CORRIDOR_HALF_H + 16, p.z + 18);
      this.camera.lookAt(p.x * 0.5, 0, p.z - 22);
      if (p.mesh) p.mesh.visible = true;
    }
  }

  // ---- Multiplayer Network Synchronization (AI Hub & Standalone) ----
  stepNetworkSync(now, dt, me) {
    if (now - this.lastNetSentAt >= 68) {
      this.lastNetSentAt = now;
      const tNow = Math.round(this.net.time());

      if (this.net.isHost) {
        // Host sends compact unreliable world snapshot to all peers (~15 Hz)
        const snap = {
          t: 's',
          at: tNow,
          p: this.players
            .filter((p) => !p.gone)
            .map((p) => [
              p.id,
              Math.round((p.id === this.localId ? p.x : p.tx) * 10) / 10,
              Math.round((p.id === this.localId ? p.y : p.ty) * 10) / 10,
              Math.round((p.id === this.localId ? p.z : p.tz) * 10) / 10,
              Math.round((p.roll || 0) * 100) / 100,
              p.score,
              p.kills
            ]),
          bhp: this.fortress.boss ? Math.round(this.fortress.boss.hp) : 0
        };
        this.net.send(snap, { reliable: false });
      } else if (me) {
        // Non-host sends its own ship state to host (~15 Hz, unreliable)
        this.net.send(
          {
            t: 'me',
            at: tNow,
            x: Math.round(me.x * 10) / 10,
            y: Math.round(me.y * 10) / 10,
            z: Math.round(me.z * 10) / 10,
            r: Math.round(me.roll * 100) / 100,
            sc: me.score,
            kl: me.kills
          },
          { to: this.net.host, reliable: false }
        );
      }

      if (me) {
        this.net.progress({ score: me.score, label: `Sector ${this.sector}` });
      }
    }

    // Smoothly interpolate remote players toward their latest network target
    const blend = 1 - Math.pow(0.001, dt);
    for (const p of this.players) {
      if (p.id !== this.localId && !p.isAI && !p.gone) {
        p.x += (p.tx - p.x) * blend;
        p.y += (p.ty - p.y) * blend;
        p.z += (p.tz - p.z) * blend;
        this.syncPlayerMesh(p, false, false);
      }
    }
  }

  handleNetworkMessage(data, from) {
    if (!data || typeof data.t !== 'string') return;

    if (this.net.isHost && data.t === 'me') {
      const p = this.players.find((q) => q.id === from);
      if (p && !(data.at < p.at)) {
        p.at = data.at;
        p.tx = Number(data.x) || 0;
        p.ty = Number(data.y) || 0;
        p.tz = Number(data.z) || 0;
        p.roll = Number(data.r) || 0;
        if (Number(data.sc) > p.score) p.score = Number(data.sc);
        if (Number(data.kl) > p.kills) p.kills = Number(data.kl);
      }
    } else if (data.t === 's' && from === this.net.host) {
      if (data.at < this.lastSnapshotTime) return;
      this.lastSnapshotTime = data.at;
      if (Array.isArray(data.p)) {
        for (const [id, x, y, z, r, sc, kl] of data.p) {
          const p = this.players.find((q) => q.id === id);
          if (!p) continue;
          if (id !== this.localId) {
            p.tx = x;
            p.ty = y;
            p.tz = z;
            p.roll = r;
            p.score = sc;
            p.kills = kl;
          }
        }
      }
      if (this.fortress.boss && typeof data.bhp === 'number') {
        this.fortress.boss.hp = data.bhp;
      }
    } else if (data.t === 'kill') {
      const e = this.fortress.enemies.find((q) => q.id === data.eid);
      if (e && e.alive) {
        e.alive = false;
        e.mesh.visible = false;
        this.fortress.spawnExplosion(e.x, e.y, e.z, 0xff3355, 1.1);
      }
    } else if (this.net.isHost && data.t === 'boss-down') {
      const p = this.players.find((q) => q.id === data.by);
      this.defeatBoss(p);
    } else if (data.t === 'over') {
      this.phase = 'over';
      this.standings = data.standings || null;
      this.endMessage = 'MISSION COMPLETE';
      this.updateUI();
    }
  }

  finishSessionRound(won = true) {
    if (!this.net || !this.net.isHost || this.phase === 'over') return;
    const live = this.players.filter((p) => !p.gone).sort((a, b) => b.score - a.score);
    const groups = [];
    for (const p of live) {
      const last = groups[groups.length - 1];
      if (last && last.score === p.score) last.ids.push(p.id);
      else groups.push({ score: p.score, ids: [p.id] });
    }
    const standings = groups.map((g) => g.ids);
    const scores = Object.fromEntries(this.players.map((p) => [p.id, p.score]));
    const stats = Object.fromEntries(
      this.players.map((p) => [
        p.id,
        {
          score: p.score,
          kills: p.kills,
          rings: p.rings
        }
      ])
    );
    const awards = [];
    if (live[0] && live[0].kills > 0) {
      awards.push({
        id: live[0].id,
        title: 'Crimson Ace',
        detail: `${live[0].kills} fortress targets destroyed`
      });
    }

    this.net.send({ t: 'over', standings });
    this.net.finish({
      standings,
      scores,
      won: Boolean(won),
      stats,
      awards
    });
    this.phase = 'over';
    this.standings = standings;
    this.endMessage = 'ROUND COMPLETE';
    this.updateUI();
  }

  // ---- 2D HUD & Vector Cockpit Renderer ----
  renderHUD(now) {
    if (!this.hudCtx || !this.hudCanvas) return;
    const ctx = this.hudCtx;
    const W = this.hudCanvas.width;
    const H = this.hudCanvas.height;
    ctx.clearRect(0, 0, W, H);

    if (this.phase !== 'playing' && this.phase !== 'attract') return;

    const me = this.getLocalPlayer() || this.players[0];
    if (!me) return;

    const s = Math.min(W / 1280, H / 720);
    ctx.save();

    // Screen Damage / EMP Flash
    if (this.screenFlash > 0) {
      ctx.fillStyle = this.screenFlashColor;
      ctx.globalAlpha = this.screenFlash * 0.35;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1.0;
    }

    // 1. First-Person Cockpit Vector Canopy Frame (when in Cockpit Cam mode 1)
    if (this.cameraMode === 1) {
      ctx.strokeStyle = '#ff2244';
      ctx.lineWidth = 3 * s;
      ctx.beginPath();
      ctx.moveTo(0, H * 0.18);
      ctx.lineTo(W * 0.22, H * 0.06);
      ctx.lineTo(W * 0.78, H * 0.06);
      ctx.lineTo(W, H * 0.18);
      ctx.moveTo(0, H * 0.82);
      ctx.lineTo(W * 0.18, H * 0.68);
      ctx.lineTo(W * 0.82, H * 0.68);
      ctx.lineTo(W, H * 0.82);
      ctx.moveTo(W * 0.22, H * 0.06);
      ctx.lineTo(W * 0.18, H * 0.68);
      ctx.moveTo(W * 0.78, H * 0.06);
      ctx.lineTo(W * 0.82, H * 0.68);
      ctx.stroke();

      // Attitude Pitch Ladder
      ctx.strokeStyle = 'rgba(51, 230, 255, 0.55)';
      ctx.lineWidth = 1.5 * s;
      for (let i = -2; i <= 2; i++) {
        if (i === 0) continue;
        const py = H / 2 + i * 38 * s + me.pitch * 120 * s;
        ctx.beginPath();
        ctx.moveTo(W / 2 - 45 * s, py);
        ctx.lineTo(W / 2 - 18 * s, py);
        ctx.moveTo(W / 2 + 18 * s, py);
        ctx.lineTo(W / 2 + 45 * s, py);
        ctx.stroke();
      }
    }

    // 2. Central Vector Aiming Reticle
    const rx = W / 2 + me.x * 8 * s;
    const ry = H / 2 - me.y * 8 * s;
    ctx.strokeStyle = '#33e6ff';
    ctx.lineWidth = 2 * s;
    ctx.strokeRect(rx - 18 * s, ry - 18 * s, 36 * s, 36 * s);
    ctx.beginPath();
    ctx.moveTo(rx - 28 * s, ry);
    ctx.lineTo(rx - 10 * s, ry);
    ctx.moveTo(rx + 10 * s, ry);
    ctx.lineTo(rx + 28 * s, ry);
    ctx.moveTo(rx, ry - 28 * s);
    ctx.lineTo(rx, ry - 10 * s);
    ctx.moveTo(rx, ry + 10 * s);
    ctx.lineTo(rx, ry + 28 * s);
    ctx.stroke();

    // 3. 3D-Projected Multi-Lock Target Boxes
    const projVec = new THREE.Vector3();
    this.lockedTargets.forEach((t, idx) => {
      projVec.set(t.x, t.y, t.z);
      projVec.project(this.camera);
      if (projVec.z < 1.0) {
        const sx = (projVec.x * 0.5 + 0.5) * W;
        const sy = (-projVec.y * 0.5 + 0.5) * H;
        const boxSize = 26 * s;
        ctx.strokeStyle = '#ffaa00';
        ctx.lineWidth = 2.5 * s;
        ctx.strokeRect(sx - boxSize, sy - boxSize, boxSize * 2, boxSize * 2);
        ctx.fillStyle = '#ffaa00';
        ctx.font = `bold ${Math.round(12 * s)}px monospace`;
        ctx.fillText(`LOCK 0${idx + 1}`, sx - boxSize, sy - boxSize - 5 * s);
      }
    });

    // 4. Top-Left Telemetry Panel (Shields, Missiles, EMP, Camera Mode)
    const padX = 28 * s;
    const padY = 24 * s;
    ctx.fillStyle = 'rgba(12, 5, 24, 0.78)';
    ctx.strokeStyle = '#ff2244';
    ctx.lineWidth = 2 * s;
    ctx.fillRect(padX, padY, 330 * s, 118 * s);
    ctx.strokeRect(padX, padY, 330 * s, 118 * s);

    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.round(16 * s)}px system-ui, sans-serif`;
    ctx.fillText(`SHIELD INTEGRITY`, padX + 14 * s, padY + 26 * s);

    ctx.fillStyle = '#2a1230';
    ctx.fillRect(padX + 14 * s, padY + 34 * s, 290 * s, 16 * s);
    ctx.fillStyle = me.shield > 35 ? '#22ff88' : '#ff2244';
    ctx.fillRect(padX + 14 * s, padY + 34 * s, (290 * s * me.shield) / me.maxShield, 16 * s);

    ctx.fillStyle = '#ffdd44';
    ctx.font = `bold ${Math.round(15 * s)}px monospace`;
    ctx.fillText(
      `MISSILES [L2/G]: ${me.missiles}   EMP [R3/B]: ${Math.floor(me.empCharge)}%`,
      padX + 14 * s,
      padY + 74 * s
    );
    ctx.fillStyle = '#33e6ff';
    ctx.fillText(
      `CAM [△/C]: ${CAMERA_MODES[this.cameraMode]}`,
      padX + 14 * s,
      padY + 100 * s
    );

    // 5. Top-Right Score, Sector & Squadron Roster
    const rightX = W - 340 * s;
    ctx.fillStyle = 'rgba(12, 5, 24, 0.78)';
    ctx.strokeStyle = '#33e6ff';
    ctx.fillRect(rightX, padY, 312 * s, 118 * s);
    ctx.strokeRect(rightX, padY, 312 * s, 118 * s);

    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.round(22 * s)}px monospace`;
    ctx.fillText(`SCORE: ${String(me.score).padStart(6, '0')}`, rightX + 14 * s, padY + 30 * s);

    const sectorNames = {
      1: 'SECTOR 1: PERIMETER TRENCH',
      2: 'SECTOR 2: THE CRIMSON SHAFT',
      3: 'SECTOR 3: CORE VAULT'
    };
    ctx.fillStyle = '#ff3355';
    ctx.font = `bold ${Math.round(14 * s)}px monospace`;
    ctx.fillText(sectorNames[this.sector] || 'SECTOR 1', rightX + 14 * s, padY + 54 * s);

    // Squadron / Co-op Pilot Bars
    this.players
      .filter((p) => !p.gone)
      .slice(0, 4)
      .forEach((p, idx) => {
        ctx.fillStyle = p.color;
        ctx.font = `bold ${Math.round(13 * s)}px system-ui, sans-serif`;
        ctx.fillText(
          `● ${p.name}: ${p.score}`,
          rightX + 14 * s + (idx % 2) * 148 * s,
          padY + 78 * s + Math.floor(idx / 2) * 22 * s
        );
      });

    // 6. Boss Health Bar (Sector 3)
    if (this.sector === 3 && this.fortress.boss && this.fortress.boss.alive) {
      const b = this.fortress.boss;
      const bw = 520 * s;
      const bx = (W - bw) / 2;
      const by = 28 * s;
      ctx.fillStyle = 'rgba(20, 4, 18, 0.88)';
      ctx.strokeStyle = '#ff0055';
      ctx.fillRect(bx, by, bw, 46 * s);
      ctx.strokeRect(bx, by, bw, 46 * s);

      ctx.fillStyle = '#ff2255';
      ctx.font = `bold ${Math.round(15 * s)}px monospace`;
      const armAliveCount = b.arms.filter((a) => a.alive).length;
      ctx.fillText(
        `CORE GUARDIAN: CERBERUS-OMEGA  [SHIELD ARMS: ${armAliveCount}/4]`,
        bx + 14 * s,
        by + 18 * s
      );
      ctx.fillStyle = '#2a0818';
      ctx.fillRect(bx + 14 * s, by + 25 * s, bw - 28 * s, 13 * s);
      ctx.fillStyle = armAliveCount > 0 ? '#ffaa00' : '#ff0044';
      ctx.fillRect(bx + 14 * s, by + 25 * s, ((bw - 28 * s) * Math.max(0, b.hp)) / b.maxHp, 13 * s);
    }

    // 7. Bottom Radio Comms Subtitle Box (Animalese / Simlish Transmission)
    if (this.activeRadio) {
      const r = this.activeRadio;
      const rw = 640 * s;
      const rh = 78 * s;
      const rxBox = (W - rw) / 2;
      const ryBox = H - rh - 24 * s;
      ctx.fillStyle = 'rgba(10, 6, 22, 0.9)';
      ctx.strokeStyle = r.color || '#ff3344';
      ctx.lineWidth = 2.5 * s;
      ctx.fillRect(rxBox, ryBox, rw, rh);
      ctx.strokeRect(rxBox, ryBox, rw, rh);

      // Animated speaker waveform portrait box
      ctx.strokeRect(rxBox + 10 * s, ryBox + 10 * s, 58 * s, 58 * s);
      ctx.beginPath();
      for (let wIdx = 0; wIdx < 8; wIdx++) {
        const barH = (8 + Math.abs(Math.sin(now * 0.025 + wIdx)) * 34) * s;
        ctx.fillStyle = r.color || '#ff3344';
        ctx.fillRect(
          rxBox + 16 * s + wIdx * 6 * s,
          ryBox + 39 * s - barH / 2,
          4 * s,
          barH
        );
      }

      ctx.fillStyle = r.color || '#ff3344';
      ctx.font = `bold ${Math.round(15 * s)}px monospace`;
      ctx.fillText(`${r.speaker} // ${r.role}`, rxBox + 82 * s, ryBox + 26 * s);

      ctx.fillStyle = '#f2eefc';
      ctx.font = `${Math.round(15 * s)}px system-ui, sans-serif`;
      const visibleText = r.text.slice(0, r.charIndex);
      ctx.fillText(visibleText.slice(0, 68), rxBox + 82 * s, ryBox + 48 * s);
      if (visibleText.length > 68) {
        ctx.fillText(visibleText.slice(68, 136), rxBox + 82 * s, ryBox + 67 * s);
      }
    }

    // 8. Attract Mode Kiosk Banner
    if (this.phase === 'attract') {
      const bannerW = 620 * s;
      const bannerH = 56 * s;
      ctx.fillStyle = 'rgba(255, 17, 68, 0.9)';
      ctx.fillRect((W - bannerW) / 2, H * 0.16, bannerW, bannerH);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = `bold ${Math.round(20 * s)}px monospace`;
      ctx.fillText(
        'ATTRACT MODE DEMO // PRESS ANY BUTTON OR KEY TO PLAY',
        W / 2,
        H * 0.16 + 35 * s
      );
      ctx.textAlign = 'left';
    }

    // 9. AI Hub 3-2-1 Countdown Overlay
    if (this.net && this.net.type === 'hub' && this.phase === 'playing' && this.net.time() < 0) {
      const countSec = Math.ceil(-this.net.time() / 1000);
      ctx.fillStyle = '#ffdd44';
      ctx.textAlign = 'center';
      ctx.font = `bold ${Math.round(110 * s)}px monospace`;
      ctx.fillText(`LAUNCH IN ${countSec}`, W / 2, H / 2);
      ctx.textAlign = 'left';
    }

    ctx.restore();
  }

  // ---- 10-Foot Controller UI DOM Overlay ----
  updateUI() {
    if (!this.uiRoot) return;

    // 1. Touch-Only Device Guard (TASK.md: "Touch-only devices: no touch controls; show 'Controller or keyboard required' and the settings button.")
    if (this.input.isTouchOnly() && !this.settingsOpen) {
      this.uiRoot.innerHTML = `
        <div class="modal-backdrop">
          <div class="vector-card">
            <div class="klaxon-badge">10-FOOT CONTROLLER-FIRST SYSTEM</div>
            <h1 class="neon-title">Controller or keyboard required</h1>
            <p class="subtitle">Connect a PS5 DualSense / standard gamepad or press a keyboard key to pilot the Scarlet-Viper MK-IV.</p>
            <div class="menu-list">
              <button class="menu-btn focused" id="touch-settings-btn">
                <span class="btn-badge">[OPTIONS]</span> Settings
              </button>
            </div>
          </div>
        </div>
      `;
      const btn = document.getElementById('touch-settings-btn');
      if (btn) btn.onclick = () => this.toggleSettings();
      return;
    }

    // 2. Settings Overlay (Opens with Esc or Options over any scene without pausing shared worlds!)
    if (this.settingsOpen) {
      const s = this.input.settings;
      const items = [
        { label: `Invert Horizontal Axis (Yaw/Roll)`, val: s.invertX ? 'ON (INVERTED)' : 'OFF (NORMAL)' },
        { label: `Invert Vertical Axis (Pitch)`, val: s.invertY ? 'ON (INVERTED)' : 'OFF (NORMAL)' },
        { label: `Master Audio`, val: this.sound.settings.muted ? 'MUTED' : 'ACTIVE' },
        { label: `Music Synth Volume`, val: `${Math.round(this.sound.settings.music * 100)}%` },
        { label: `SFX & Animalese Voice Volume`, val: `${Math.round(this.sound.settings.sfx * 100)}%` },
        { label: `Active Camera View`, val: CAMERA_MODES[this.cameraMode] },
        { label: `Resume Sortie`, val: '[ESC / CIRCLE]' }
      ];

      this.uiRoot.innerHTML = `
        <div class="modal-backdrop">
          <div class="vector-card">
            <div class="klaxon-badge">TACTICAL AVIONICS CONFIGURATION</div>
            <h2 class="neon-title">SETTINGS</h2>
            <div class="menu-list">
              ${items
                .map(
                  (it, i) => `
                <button class="menu-btn ${i === this.settingsIndex ? 'focused' : ''}" data-sidx="${i}">
                  <span>${i === this.settingsIndex ? '▸ ' : ''}${it.label}</span>
                  <span class="val-pill">${it.val}</span>

            </div>
            <div class="footer-hints">
              <span>[D-PAD / STICK / ARROWS] Navigate</span>
              <span>[CROSS / ENTER] Toggle</span>
              <span>[OPTIONS / CIRCLE / ESC] Close</span>
            </div>
          </div>
        </div>
      `;
      this.uiRoot.querySelectorAll('[data-sidx]').forEach((el) => {
        el.onclick = () => {
          const idx = Number(el.getAttribute('data-sidx'));
          this.settingsIndex = idx;
          this.activateSettingsItem(idx, 1);
        };
      });
      return;
    }

    // 3. AI Hub Ready / Waiting Screen (when splash=0)
    if (this.phase === 'ready') {
      this.uiRoot.innerHTML = `
        <div class="modal-backdrop">
          <div class="vector-card">
            <div class="klaxon-badge">SQUADRON TELEMETRY LINKED</div>
            <h1 class="neon-title">${GAME_METADATA.title}</h1>
            <p class="subtitle">Press any key, click or tap when you are ready</p>
          </div>
        </div>
      `;
      return;
    }

    if (this.phase === 'waiting') {
      this.uiRoot.innerHTML = `
        <div class="modal-backdrop">
          <div class="vector-card">
            <div class="klaxon-badge">SYNCHRONIZING VECTOR GRID</div>
            <h1 class="neon-title">STANDBY FOR LAUNCH…</h1>
          </div>
        </div>
      `;
      return;
    }

    // 4. Title Screen & Submenus (Multiplayer / About)
    if (this.phase === 'title') {
      if (this.subScreen === 'about') {
        this.renderAboutScreen();
        return;
      }
      if (this.subScreen === 'multiplayer') {
        this.renderMultiplayerMenu();
        return;
      }

      const menuOptions = [
        { title: 'LAUNCH SORTIE (FULL CAMPAIGN)', badge: '[CROSS / ENTER]' },
        { title: 'CORE VAULT ASSAULT (BOSS RUSH)', badge: '[SECTOR 3]' },
        { title: 'SQUADRON CO-OP (MULTIPLAYER)', badge: '[1-4 PILOTS]' },
        { title: 'ATTRACT MODE DEMO (AI REPLAY)', badge: '[AUTO-TOUR]' },
        { title: 'AVIONICS SETTINGS (AXIS & AUDIO)', badge: '[OPTIONS / ESC]' },
        { title: 'ABOUT / SOURCE & ENGINE CREDITS', badge: '[INFO]' }
      ];

      this.uiRoot.innerHTML = `
        <div class="modal-backdrop title-backdrop">
          <div class="vector-card title-card">
            <div class="klaxon-badge">CONDITION RED // SPIRITUAL SUCCESSOR TO RED ALARM (1995)</div>
            <h1 class="neon-title">${GAME_METADATA.title}</h1>
            <p class="subtitle">${GAME_METADATA.subtitle} — 6-DOF CEL-SHADED VECTOR FORTRESS ASSAULT</p>
            <div class="menu-list">
              ${menuOptions
                .map(
                  (opt, idx) => `
                <button class="menu-btn ${idx === this.titleIndex ? 'focused' : ''}" data-tidx="${idx}">
                  <span>${idx === this.titleIndex ? '▸ ' : ''}${opt.title}</span>
                  <span class="val-pill">${opt.badge}</span>
                </button>
              `
                )
                .join('')}
            </div>
            <div class="footer-hints">
              <span>[LEFT STICK / WASD] Steer</span>
              <span>[CROSS / SPACE] Vulcan Lasers</span>
              <span>[L2 / G] Multi-Lock Missiles</span>
              <span>[CIRCLE / E] Barrel Roll</span>
              <span>[TRIANGLE / C] 4 Cameras</span>
            </div>
          </div>
        </div>
      `;
      this.uiRoot.querySelectorAll('[data-tidx]').forEach((el) => {
        el.onclick = () => {
          const idx = Number(el.getAttribute('data-tidx'));
          this.titleIndex = idx;
          this.activateTitleItem(idx);
        };
      });
      return;
    }

    // 5. Round Over / Mission Debrief Screen
    if (this.phase === 'over') {
      const sorted = [...this.players].sort((a, b) => b.score - a.score);
      const isHub = this.net && this.net.type === 'hub';
      this.uiRoot.innerHTML = `
        <div class="modal-backdrop">
          <div class="vector-card">
            <div class="klaxon-badge">SORTIE TELEMETRY REPORT</div>
            <h1 class="neon-title">${this.endMessage || 'SORTIE COMPLETE'}</h1>
            <div class="menu-list">
              ${sorted
                .map(
                  (p, i) => `
                <div class="menu-btn" style="border-color:${p.color}">
                  <span>#${i + 1} ${p.name}</span>
                  <span class="val-pill">${p.score} PTS · ${p.kills} KILLS</span>
                </div>
              `
                )
                .join('')}
            </div>
            ${
              !isHub
                ? `<div class="menu-list" style="margin-top:14px">
                     <button class="menu-btn focused" id="return-title-btn">
                       <span>▸ RETURN TO COMMAND DECK</span>
                       <span class="val-pill">[CROSS / ENTER]</span>
                     </button>
                   </div>`
                : ''
            }
          </div>
        </div>
      `;
      const btn = document.getElementById('return-title-btn');
      if (btn) btn.onclick = () => this.enterTitleScreen();
      return;
    }

    // Active Gameplay: clear modal overlay
    this.uiRoot.innerHTML = '';
  }

  renderMultiplayerMenu() {
    const mpItems = [
      { label: 'Squadron Room Frequency', val: this.mpConfig.roomCode },
      { label: 'AI Wingmen Escort Pilots', val: `${this.mpConfig.aiWingmen} WINGMEN` },
      { label: 'LAUNCH SQUADRON CO-OP SORTIE', val: '[CROSS / ENTER]' },
      { label: 'Back to Title Screen', val: '[CIRCLE / BACK]' }
    ];

    this.uiRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="vector-card">
          <div class="klaxon-badge">STANDALONE SQUADRON LINK // BROADCAST + AI WINGMEN</div>
          <h2 class="neon-title">SQUADRON MULTIPLAYER</h2>
          <p class="subtitle">Open another window on the same frequency to fly together, or launch immediately with AI Wingmen.</p>
          <div class="menu-list">
            ${mpItems
              .map(
                (it, i) => `
              <button class="menu-btn ${i === this.mpIndex ? 'focused' : ''}" data-mpidx="${i}">
                <span>${i === this.mpIndex ? '▸ ' : ''}${it.label}</span>
                <span class="val-pill">${it.val}</span>
              </button>
            `
              )
              .join('')}
          </div>
        </div>
      </div>
    `;
    this.uiRoot.querySelectorAll('[data-mpidx]').forEach((el) => {
      el.onclick = () => {
        const idx = Number(el.getAttribute('data-mpidx'));
        this.mpIndex = idx;
        this.activateMultiplayerItem(idx, 1);
      };
    });
  }

  renderAboutScreen() {
    this.uiRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="vector-card about-card">
          <div class="klaxon-badge">SOURCE INFORMATION & ENGINE TELEMETRY</div>
          <h2 class="neon-title">ABOUT // ${GAME_METADATA.title}</h2>
          <div class="about-scroll">
            <p><strong>Date:</strong> ${GAME_METADATA.date} | <strong>Source:</strong> ${GAME_METADATA.sourceGame}</p>
            <p><strong>Tech:</strong> ${GAME_METADATA.tech}</p>
            <p><strong>Art Direction:</strong> ${GAME_METADATA.artDirection}</p>
            <p><strong>Animation:</strong> ${GAME_METADATA.animation}</p>
            <p><strong>Audio:</strong> ${GAME_METADATA.audio}</p>
            <p><strong>Online:</strong> ${GAME_METADATA.online}</p>
            <p><strong>Testing:</strong> ${GAME_METADATA.testing}</p>
            <p><strong>Environment:</strong> ${GAME_METADATA.environment}</p>
            <p><strong>Model:</strong> ${GAME_METADATA.model}</p>
            <p><strong>Usage:</strong> ${GAME_METADATA.usage}</p>
            <hr style="border-color:#ff2244;opacity:0.35;margin:10px 0">
            <p><strong>Testing Feedback:</strong> ${FEEDBACK_DATA.testing.map((x) => `${x.q} ${x.a}`).join(' ')}</p>
            <p><strong>Engine Feedback:</strong> ${FEEDBACK_DATA.engine.map((x) => `${x.q} ${x.a}`).join(' ')}</p>
            <p><strong>Prompt Feedback:</strong> ${FEEDBACK_DATA.prompt.map((x) => `${x.q} ${x.a}`).join(' ')}</p>
          </div>
          <div class="menu-list" style="margin-top:12px">
            <button class="menu-btn focused" id="about-back-btn">
              <span>▸ BACK TO TITLE</span>
              <span class="val-pill">[CIRCLE / ENTER]</span>
            </button>
          </div>
        </div>
      </div>
    `;
    const btn = document.getElementById('about-back-btn');
    if (btn) {
      btn.onclick = () => {
        this.subScreen = 'none';
        this.sound.uiBack();
        this.updateUI();
      };
    }
  }
}

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', () => {
    window.__reddishAlert = new ReddishAlertGame();
  });
} else {
  window.__reddishAlert = new ReddishAlertGame();
}

</script>
</body>
</html>
