// 100% Code-Written Web Audio API Music, Sound Effects & Animalese/Simlish Formant Voice Synthesizer
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.musicGain = null;
    this.sfxGain = null;
    this.voiceGain = null;
    this.noiseBuffer = null;

    this.settings = {
      muted: false,
      master: 0.8,
      music: 0.55,
      sfx: 0.85,
      voice: 0.9
    };

    this.currentTrack = 'none'; // 'none' | 'menu' | 'trench' | 'boss'
    this.stepIndex = 0;
    this.musicTimer = null;
    this.isPlayingMusic = false;
  }

  unlock() {
    if (typeof window === 'undefined') return;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC();
        this.masterGain = this.ctx.createGain();
        this.musicGain = this.ctx.createGain();
        this.sfxGain = this.ctx.createGain();
        this.voiceGain = this.ctx.createGain();

        this.musicGain.connect(this.masterGain);
        this.sfxGain.connect(this.masterGain);
        this.voiceGain.connect(this.masterGain);
        this.masterGain.connect(this.ctx.destination);

        this.createNoiseBuffer();
        this.applyVolumes();
      } catch (e) {
        this.ctx = null;
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
  }

  createNoiseBuffer() {
    if (!this.ctx) return;
    const sr = this.ctx.sampleRate;
    const len = sr * 1.5;
    this.noiseBuffer = this.ctx.createBuffer(1, len, sr);
    const data = this.noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) {
      data[i] = Math.random() * 2 - 1;
    }
  }

  applyVolumes() {
    if (!this.ctx || !this.masterGain) return;
    const now = this.ctx.currentTime;
    const m = this.settings.muted ? 0 : this.settings.master;
    this.masterGain.gain.setTargetAtTime(m, now, 0.02);
    this.musicGain.gain.setTargetAtTime(this.settings.music, now, 0.02);
    this.sfxGain.gain.setTargetAtTime(this.settings.sfx, now, 0.02);
    this.voiceGain.gain.setTargetAtTime(this.settings.voice, now, 0.02);
  }

  setMuted(muted) {
    this.settings.muted = !!muted;
    this.applyVolumes();
  }

  stopAll() {
    this.stopMusic();
    if (this.ctx && this.masterGain) {
      try {
        this.masterGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.05);
      } catch (e) {}
    }
  }

  startMusic(track = 'trench') {
    if (this.currentTrack === track && this.isPlayingMusic) return;
    this.currentTrack = track;
    this.isPlayingMusic = true;
    this.stepIndex = 0;
    if (this.musicTimer) clearInterval(this.musicTimer);
    if (track === 'none') {
      this.isPlayingMusic = false;
      return;
    }
    const bpm = track === 'boss' ? 152 : track === 'trench' ? 136 : 108;
    const stepMs = (60 / bpm / 4) * 1000;
    this.musicTimer = setInterval(() => this.tickMusic(), stepMs);
  }

  stopMusic() {
    this.isPlayingMusic = false;
    this.currentTrack = 'none';
    if (this.musicTimer) {
      clearInterval(this.musicTimer);
      this.musicTimer = null;
    }
  }

  midiToFreq(m) {
    return 440 * Math.pow(2, (m - 69) / 12);
  }

  tickMusic() {
    if (!this.ctx || this.ctx.state !== 'running' || this.settings.muted) return;
    const s = this.stepIndex++;
    const barStep = s % 16;
    const bar = Math.floor(s / 16) % 4;
    const now = this.ctx.currentTime;

    if (this.currentTrack === 'menu') {
      // Brooding Red Alarm dark-synth arpeggio & deep pulse
      const rootNotes = [38, 38, 41, 36]; // D2, D2, F2, C2
      const root = rootNotes[bar];
      if (barStep % 4 === 0) {
        this.synthBass(this.midiToFreq(root), 0.28, 0.22);
      }
      const arpOffsets = [0, 7, 12, 15, 12, 7, 3, 7];
      if (barStep % 2 === 0) {
        const note = root + 12 + arpOffsets[(barStep / 2) % arpOffsets.length];
        this.synthPluck(this.midiToFreq(note), 0.14, 0.1);
      }
      if (barStep === 0 || barStep === 8) this.synthKick(0.22);
      if (barStep === 12 && bar % 2 === 1) this.synthKlaxonPulse(520, 0.06);
      return;
    }

    if (this.currentTrack === 'trench') {
      // High-energy 90s 3D shooter trench synthwave/electro
      const roots = [40, 40, 43, 45]; // E2, E2, G2, A2
      const root = roots[bar];
      // Driving 16th bassline
      const bassOct = barStep % 2 === 1 ? 12 : 0;
      this.synthBass(this.midiToFreq(root + bassOct), 0.11, 0.2);

      // Drums
      if (barStep % 4 === 0) this.synthKick(0.32);
      if (barStep === 4 || barStep === 12) this.synthSnare(0.2);
      if (barStep % 2 === 1) this.synthHat(0.06);

      // Heroic minor vector lead melody
      const leadMelody = [
        64, -1, 67, 71, 72, -1, 71, 67,
        69, -1, 67, 64, 62, -1, 64, 67
      ];
      const leadNote = leadMelody[barStep];
      if (leadNote > 0) {
        const shift = bar === 3 ? 2 : 0;
        this.synthLead(this.midiToFreq(leadNote + shift), 0.16, 0.12);
      }
      return;
    }

    if (this.currentTrack === 'boss') {
      // Urgent Red Alarm Critical Boss Theme (152 BPM)
      const roots = [37, 38, 37, 40]; // C#2, D2, C#2, E2 (Phrygian tension)
      const root = roots[bar];
      this.synthBass(this.midiToFreq(root + (barStep % 2 === 0 ? 0 : 12)), 0.09, 0.25);

      if (barStep % 4 === 0 || barStep === 14) this.synthKick(0.36);
      if (barStep === 4 || barStep === 12) this.synthSnare(0.25);
      this.synthHat(barStep % 2 === 0 ? 0.04 : 0.08);

      const bossArp = [61, 64, 68, 70, 73, 70, 68, 64];
      const note = bossArp[barStep % 8] + (bar === 3 ? 3 : 0);
      this.synthLead(this.midiToFreq(note), 0.1, 0.13);

      if (barStep === 0 && bar % 2 === 0) {
        this.synthKlaxonPulse(740, 0.08);
      }
    }
  }

  synthBass(freq, dur, vol) {
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const flt = this.ctx.createBiquadFilter();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, now);
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(freq * 4.5, now);
    flt.frequency.exponentialRampToValueAtTime(freq * 1.4, now + dur);
    flt.Q.value = 3.5;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(flt).connect(g).connect(this.musicGain);
    osc.start(now);
    osc.stop(now + dur + 0.01);
  }

  synthPluck(freq, dur, vol) {
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g).connect(this.musicGain);
    osc.start(now);
    osc.stop(now + dur + 0.01);
  }

  synthLead(freq, dur, vol) {
    const now = this.ctx.currentTime;
    const osc1 = this.ctx.createOscillator();
    const osc2 = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc1.type = 'square';
    osc2.type = 'sawtooth';
    osc1.frequency.setValueAtTime(freq, now);
    osc2.frequency.setValueAtTime(freq * 1.006, now);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc1.connect(g);
    osc2.connect(g);
    g.connect(this.musicGain);
    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + dur + 0.01);
    osc2.stop(now + dur + 0.01);
  }

  synthKick(vol) {
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(135, now);
    osc.frequency.exponentialRampToValueAtTime(34, now + 0.13);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(g).connect(this.musicGain);
    osc.start(now);
    osc.stop(now + 0.16);
  }

  synthSnare(vol) {
    if (!this.noiseBuffer) return;
    const now = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer;
    const flt = this.ctx.createBiquadFilter();
    flt.type = 'highpass';
    flt.frequency.value = 600;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    src.connect(flt).connect(g).connect(this.musicGain);
    src.start(now);
    src.stop(now + 0.13);
  }

  synthHat(vol) {
    if (!this.noiseBuffer) return;
    const now = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer;
    const flt = this.ctx.createBiquadFilter();
    flt.type = 'highpass';
    flt.frequency.value = 5500;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
    src.connect(flt).connect(g).connect(this.musicGain);
    src.start(now);
    src.stop(now + 0.05);
  }

  synthKlaxonPulse(freq, vol) {
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.linearRampToValueAtTime(freq * 1.35, now + 0.12);
    osc.frequency.linearRampToValueAtTime(freq * 0.9, now + 0.24);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(g).connect(this.musicGain);
    osc.start(now);
    osc.stop(now + 0.26);
  }

  // ---- Sound Effects ----

  laser() {
    if (!this.ctx || this.settings.muted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(980, now);
    osc.frequency.exponentialRampToValueAtTime(160, now + 0.09);
    g.gain.setValueAtTime(0.16, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
    osc.connect(g).connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + 0.1);
  }

  lockOn(count = 1) {
    if (!this.ctx || this.settings.muted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();

  // ---- Animalese / Simlish / Gibberish Formant Voice Synthesizer ----
  speakAnimaleseSyllable(char, basePitch = 160, speaker = 'CMDR. VEX') {
    if (!this.ctx || this.settings.muted) return;
    const code = char.toLowerCase().charCodeAt(0);
    if (code < 97 || code > 122) return; // Only vocalize letters a-z

    const now = this.ctx.currentTime;
    const letterIdx = code - 97;

    // 5 vowel formant pairs (F1, F2) to create unmistakable Animalese/Simlish speech vowels
    const formants = [
      [730, 1090], // /a/
      [530, 1840], // /e/
      [270, 2290], // /i/
      [570, 840],  // /o/
      [300, 870]   // /u/
    ];
    const [f1, f2] = formants[letterIdx % formants.length];

    const isRobotic = speaker.includes('K.L.A.X.O.N');
    const pitchJitter = isRobotic
      ? ((letterIdx % 3) - 1) * 8
      : Math.sin(letterIdx * 1.7) * (basePitch * 0.18) + (letterIdx % 5) * 6;
    const freq = Math.max(65, basePitch + pitchJitter);
    const dur = isRobotic ? 0.075 : 0.062;

    const osc = this.ctx.createOscillator();
    osc.type = isRobotic ? 'sawtooth' : 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.linearRampToValueAtTime(freq * (letterIdx % 2 === 0 ? 1.12 : 0.92), now + dur);

    const filter1 = this.ctx.createBiquadFilter();
    filter1.type = 'bandpass';
    filter1.frequency.setValueAtTime(f1, now);
    filter1.Q.value = 4.5;

    const filter2 = this.ctx.createBiquadFilter();
    filter2.type = 'bandpass';
    filter2.frequency.setValueAtTime(f2, now);
    filter2.Q.value = 5.0;

    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.22, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);

    osc.connect(filter1);
    osc.connect(filter2);
    filter1.connect(g);
    filter2.connect(g);
    g.connect(this.voiceGain);

    osc.start(now);
    osc.stop(now + dur + 0.01);
  }
}

const materialCache = new Map();
function createCelMaterial(baseHex, rimHex = 0xff2244, opts = {}) {
  const key = `${baseHex}_${rimHex}_${opts.emissiveBoost || 0}_${opts.doubleSided ? 1 : 0}`;
  if (materialCache.has(key)) return materialCache.get(key);

  const baseCol = new THREE.Color(baseHex);
  const shadowCol = baseCol.clone().multiplyScalar(0.28).lerp(new THREE.Color(0x160524), 0.45);
  const highCol = baseCol.clone().lerp(new THREE.Color(0xffffff), 0.38);
  const rimCol = new THREE.Color(rimHex);
  const inkCol = new THREE.Color(0x06020c);

  const mat = new THREE.MeshBasicNodeMaterial({
    side: opts.doubleSided ? THREE.DoubleSide : THREE.FrontSide
  });

  const cShadow = color(shadowCol.getHex());
  const cBase = color(baseCol.getHex());
  const cHigh = color(highCol.getHex());
  const cRim = color(rimCol.getHex());
  const cInk = color(inkCol.getHex());
  const eBoost = float(opts.emissiveBoost || 0.0);

  const celShader = Fn(() => {
    const n = normalize(normalWorld);
    const lightDir = normalize(vec3(0.42, 0.82, 0.38));
    const fillDir = normalize(vec3(-0.55, -0.35, -0.45));

    const ndl = dot(n, lightDir);
    const fill = dot(n, fillDir);

    // 3-Band Stepped Cel-Shading Ramp
    const midBand = step(float(-0.08), ndl);
    const highBand = step(float(0.58), ndl);
    const fillBand = step(float(0.45), fill);

    const shaded = mix(cShadow, cBase, midBand);
    const withFill = mix(shaded, cBase, fillBand.mul(float(0.35)));
    const withHigh = mix(withFill, cHigh, highBand);

    // View-dependent Fresnel Rim & Comic Ink Silhouette
    const viewDir = normalize(cameraPosition.sub(positionWorld));
    const ndv = abs(dot(n, viewDir));
    const fresnel = float(1.0).sub(ndv);

    const rimMask = step(float(0.64), fresnel);
    const inkMask = step(float(0.86), fresnel);

    const rimLit = mix(withHigh, cRim, rimMask.mul(float(0.85)));
    const inked = mix(rimLit, cInk, inkMask.mul(float(0.75)));

    return mix(inked, cRim, eBoost);
  });

  mat.colorNode = celShader();
  materialCache.set(key, mat);
  return mat;
}
function createEnergyMaterial(hexColor, opacity = 0.9) {
  const mat = new THREE.MeshBasicNodeMaterial({
    transparent: opacity < 1.0,
    opacity,
    side: THREE.DoubleSide
  });
  mat.colorNode = color(hexColor);
  return mat;
}

const wireMatCache = new Map();
function getWireMaterial(hexColor = 0xff2244) {
  if (wireMatCache.has(hexColor)) return wireMatCache.get(hexColor);
  const m = new THREE.LineBasicMaterial({ color: hexColor });
  wireMatCache.set(hexColor, m);
  return m;
}

const inkOutlineMat = new THREE.MeshBasicNodeMaterial({
  side: THREE.BackSide
});
inkOutlineMat.colorNode = color(0x05010a);

/**
 * Decorates a mesh with a Red Alarm vector edge wireframe cage and an optional cel-ink back-face hull
 */
function decorateCelMesh(mesh, wireHex = 0xff2244, addInkHull = true, hullScale = 1.045) {
  if (!mesh || !mesh.geometry) return mesh;
  const edges = new THREE.EdgesGeometry(mesh.geometry, 22);
  const lines = new THREE.LineSegments(edges, getWireMaterial(wireHex));
  mesh.add(lines);

  if (addInkHull) {
    const hull = new THREE.Mesh(mesh.geometry, inkOutlineMat);
    hull.scale.setScalar(hullScale);
    mesh.add(hull);
  }
  return mesh;
}

  const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.55, 0), glowMat);
  core.position.set(0, 0, 1.4);
  root.add(core);

  root.userData = { gyroRing, core };
  return root;
}
function buildHeavyTank() {

  const turretMat = createCelMaterial(0xc82840, 0xffaa22);

function buildLaserGate(pattern = 'horizontal', width = 34, height = 22) {
  const root = new THREE.Group();
  const frameMat = createCelMaterial(0x241934, 0xff2244);
  const beamMat = createEnergyMaterial(0xff1144, 0.88);
  const nodeMat = createEnergyMaterial(0xffaa00, 0.95);

  // Left & Right Pylons
  const pylonGeo = new THREE.BoxGeometry(1.6, height, 1.6);
  const leftPylon = decorateCelMesh(new THREE.Mesh(pylonGeo, frameMat), 0xff2244, false);
  leftPylon.position.set(-width / 2 + 0.8, 0, 0);
  const rightPylon = decorateCelMesh(new THREE.Mesh(pylonGeo, frameMat), 0xff2244, false);
  rightPylon.position.set(width / 2 - 0.8, 0, 0);
  root.add(leftPylon, rightPylon);

  const beamGroup = new THREE.Group();
  const bars = [];

  if (pattern === 'horizontal') {
    const bGeo = new THREE.CylinderGeometry(0.38, 0.38, width - 2, 6);
    bGeo.rotateZ(Math.PI / 2);
    const bar1 = new THREE.Mesh(bGeo, beamMat);
    bar1.position.y = 3.2;
    const bar2 = new THREE.Mesh(bGeo, beamMat);
    bar2.position.y = -3.2;
    beamGroup.add(bar1, bar2);
    bars.push(bar1, bar2);
  } else if (pattern === 'vertical') {
    const bGeo = new THREE.CylinderGeometry(0.38, 0.38, height - 2, 6);
    const bar1 = new THREE.Mesh(bGeo, beamMat);
    bar1.position.x = -4.5;
    const bar2 = new THREE.Mesh(bGeo, beamMat);
    bar2.position.x = 4.5;
    beamGroup.add(bar1, bar2);
    bars.push(bar1, bar2);
  } else {
    // Rotating X-spinner laser gate
    const bGeo = new THREE.CylinderGeometry(0.36, 0.36, Math.min(width, height) - 3, 6);
    const bar1 = new THREE.Mesh(bGeo, beamMat);
    bar1.rotation.z = Math.PI / 4;
    const bar2 = new THREE.Mesh(bGeo, beamMat);
    bar2.rotation.z = -Math.PI / 4;
    const hub = new THREE.Mesh(new THREE.OctahedronGeometry(1.4, 0), nodeMat);
    beamGroup.add(bar1, bar2, hub);
    bars.push(bar1, bar2);
  }

  root.add(beamGroup);
  root.userData = { pattern, beamGroup, bars };
  return root;
}
function buildBlastDoor(width = 34, height = 22) {
  const root = new THREE.Group();
  const doorMat = createCelMaterial(0x351d38, 0xff3344);
  const lockMat = createEnergyMaterial(0xffaa00, 0.96);

  const halfW = width / 2;
  const panelGeo = new THREE.BoxGeometry(halfW, height, 1.8);

  const leftPanel = decorateCelMesh(new THREE.Mesh(panelGeo, doorMat), 0xff3344, false);
  leftPanel.position.set(-halfW / 2 - 2.5, 0, 0);

  const rightPanel = decorateCelMesh(new THREE.Mesh(panelGeo, doorMat), 0xff3344, false);
  rightPanel.position.set(halfW / 2 + 2.5, 0, 0);

  // Two destructible Amber Lock Nodes on the door frame
  const lockGeo = new THREE.OctahedronGeometry(1.5, 0);
  const lockL = decorateCelMesh(new THREE.Mesh(lockGeo, lockMat), 0xffffff, false);
  lockL.position.set(-width / 2 + 2.4, 5.5, 1.6);

  const lockR = decorateCelMesh(new THREE.Mesh(lockGeo, lockMat), 0xffffff, false);
  lockR.position.set(width / 2 - 2.4, 5.5, 1.6);

  root.add(leftPanel, rightPanel, lockL, lockR);
  root.userData = {
    leftPanel,
    rightPanel,
    lockL,
    lockR,
    locksRemaining: 2,
    openFactor: 0.25 // Starts partially closing unless locks destroyed!
  };
  return root;
}
function buildPowerup(kind = 'shield') {
  const colors = {
    shield: 0x22ff88,
    missiles: 0xffaa00,
    emp: 0x33e6ff,
    overdrive: 0xff33aa
  };
  const c = colors[kind] || 0x22ff88;
  const root = new THREE.Group();
  const mat = createEnergyMaterial(c, 0.92);
  const core = decorateCelMesh(new THREE.Mesh(new THREE.OctahedronGeometry(1.3, 0), mat), 0xffffff, false);
  const ring = decorateCelMesh(
    new THREE.Mesh(new THREE.TorusGeometry(2.0, 0.14, 4, 8), mat),
    c,
    false
  );
  root.add(core, ring);
  root.userData = { kind, core, ring };
  return root;
}
function buildBossCerberus() {
  const root = new THREE.Group();
  const armorMat = createCelMaterial(0x28122e, 0xff1144);
  const ringMat = createCelMaterial(0x88142c, 0xff4455);
  const heartMat = createEnergyMaterial(0xff0044, 0.96);
  const nodeMat = createEnergyMaterial(0xffbb00, 0.96);

  // Central Armored Housing (Top & Bottom Caps protecting the Crystal Heart)
  const capGeo = new THREE.CylinderGeometry(5.5, 7.5, 4.5, 8);
  const topCap = decorateCelMesh(new THREE.Mesh(capGeo, armorMat), 0xff2244, true, 1.04);
  topCap.position.y = 5.5;
  const botCap = decorateCelMesh(new THREE.Mesh(capGeo, armorMat), 0xff2244, true, 1.04);
  botCap.position.y = -5.5;
  botCap.rotation.x = Math.PI;
  root.add(topCap, botCap);

  // Throbbing K.L.A.X.O.N. Crystal Heart
  const heartGeo = new THREE.OctahedronGeometry(4.2, 1);
  const heart = decorateCelMesh(new THREE.Mesh(heartGeo, heartMat), 0xffffff, false);
  root.add(heart);

  // 2 Counter-Rotating Armored Shield Rings
  const ringGeo1 = new THREE.TorusGeometry(10.5, 0.9, 6, 12);
  const ring1 = decorateCelMesh(new THREE.Mesh(ringGeo1, ringMat), 0xff3355, false);
  const ringGeo2 = new THREE.TorusGeometry(13.0, 0.75, 6, 12);
  const ring2 = decorateCelMesh(new THREE.Mesh(ringGeo2, armorMat), 0x33e6ff, false);
  ring2.rotation.x = Math.PI / 3;
  root.add(ring1, ring2);

  // 4 Articulated Weapon Arms with Destructible Generator Nodes
  const arms = [];
  const angles = [0, Math.PI / 2, Math.PI, (Math.PI * 3) / 2];
  angles.forEach((ang, idx) => {
    const armPivot = new THREE.Group();
    armPivot.rotation.z = ang;

    const strutGeo = new THREE.BoxGeometry(8.5, 1.4, 1.4);
    const strut = decorateCelMesh(new THREE.Mesh(strutGeo, armorMat), 0xff2244, false);
    strut.position.set(8.5, 0, 0);
    armPivot.add(strut);

    const clawPivot = new THREE.Group();
    clawPivot.position.set(13.0, 0, 1.5);
    const clawGeo = new THREE.ConeGeometry(1.3, 5.0, 5);
    clawGeo.rotateX(Math.PI / 2);
    const claw = decorateCelMesh(new THREE.Mesh(clawGeo, ringMat), 0xffaa00, true, 1.04);
    claw.position.set(0, 0, 2.2);
    clawPivot.add(claw);

    // Destructible Arm Generator Node
    const genNode = decorateCelMesh(
      new THREE.Mesh(new THREE.OctahedronGeometry(1.9, 0), nodeMat),
      0xffffff,
      false
    );
    genNode.position.set(0, 0, 5.2);
    clawPivot.add(genNode);

    armPivot.add(clawPivot);
    root.add(armPivot);
    arms.push({
      id: idx,
      armPivot,
      clawPivot,
      genNode,
      hp: 80,
      maxHp: 80,
      alive: true
    });
  });

  root.userData = {
    heart,
    ring1,
    ring2,
    arms,
    topCap,
    botCap
  };

  return root;
}

// src/level.js
// Multi-Sector 3D Fortress Generator & Rapier 0.19.3 Physics World Manager
const CORRIDOR_HALF_W = 16.5;
const CORRIDOR_HALF_H = 10.5;
const SECTOR_2_Z = -1050;
const SECTOR_3_Z = -2150;
const BOSS_Z = -2580;
class FortressWorld {
  constructor(RAPIER, scene, rng = Math.random) {
    this.RAPIER = RAPIER;
    this.scene = scene;
    this.rng = rng;

    this.physicsWorld = new RAPIER.World({ x: 0, y: -6.0, z: 0 });
    this.worldGroup = new THREE.Group();
    if (this.scene) this.scene.add(this.worldGroup);

    this.enemies = [];
    this.gates = [];
    this.blastDoors = [];
    this.powerups = [];
    this.rings = [];
    this.projectiles = [];
    this.enemyProjectiles = [];
    this.particles = [];
    this.debris = [];

    this.boss = null;
    this.nextEntityId = 1;
  }

  clear() {
    while (this.worldGroup.children.length > 0) {
      this.worldGroup.remove(this.worldGroup.children[0]);
    }
    this.enemies = [];
    this.gates = [];
    this.blastDoors = [];
    this.powerups = [];
    this.rings = [];
    this.projectiles = [];
    this.enemyProjectiles = [];
    this.particles = [];
    this.debris = [];
    this.boss = null;
    this.nextEntityId = 1;
    this.physicsWorld = new this.RAPIER.World({ x: 0, y: -6.0, z: 0 });
  }

  buildFortress(rng = Math.random) {
    this.clear();
    this.rng = rng;

    this.buildArchitecture();
    this.populateSector1();
    this.populateSector2();
    this.populateSector3Boss();
  }

  buildArchitecture() {
    const wallMat1 = createCelMaterial(0x1b1029, 0xff2244);
    const wallMat2 = createCelMaterial(0x2a0f26, 0xff4422);
    const floorMat = createCelMaterial(0x130b1e, 0x33e6ff);
    const ribMat = createCelMaterial(0x461530, 0xff2244);
    const neonRed = createEnergyMaterial(0xff1144, 0.9);
    const neonCyan = createEnergyMaterial(0x22e6ff, 0.85);

    // Static Physics Corridor Boundary Colliders (Left, Right, Floor, Ceiling)
    const RAPIER = this.RAPIER;
    const halfLen = 1450;
    const midZ = -1350;

    // Floor & Ceiling colliders
    const floorDesc = RAPIER.ColliderDesc.cuboid(24, 1.0, halfLen).setTranslation(0, -CORRIDOR_HALF_H - 1.0, midZ);
    const ceilDesc = RAPIER.ColliderDesc.cuboid(24, 1.0, halfLen).setTranslation(0, CORRIDOR_HALF_H + 1.0, midZ);
    const leftDesc = RAPIER.ColliderDesc.cuboid(1.0, 16, halfLen).setTranslation(-CORRIDOR_HALF_W - 1.0, 0, midZ);
    const rightDesc = RAPIER.ColliderDesc.cuboid(1.0, 16, halfLen).setTranslation(CORRIDOR_HALF_W + 1.0, 0, midZ);
    this.physicsWorld.createCollider(floorDesc);
    this.physicsWorld.createCollider(ceilDesc);
    this.physicsWorld.createCollider(leftDesc);
    this.physicsWorld.createCollider(rightDesc);

    // Visual Corridor Segments from Z = 40 down to Z = -2250
    const segLen = 50;
    for (let z = 20; z >= -2200; z -= segLen) {
      const inSector2 = z <= SECTOR_2_Z;
      const wMat = inSector2 ? wallMat2 : wallMat1;

      // Floor plate
      const floorGeo = new THREE.BoxGeometry(CORRIDOR_HALF_W * 2, 0.8, segLen - 1);
      const floor = decorateCelMesh(new THREE.Mesh(floorGeo, floorMat), inSector2 ? 0xff2244 : 0x33e6ff, false);
      floor.position.set(0, -CORRIDOR_HALF_H - 0.4, z);
      this.worldGroup.add(floor);

      // Left & Right Trench Walls
      const sideGeo = new THREE.BoxGeometry(1.4, CORRIDOR_HALF_H * 2, segLen - 1);
      const leftWall = decorateCelMesh(new THREE.Mesh(sideGeo, wMat), 0xff2244, false);
      leftWall.position.set(-CORRIDOR_HALF_W - 0.7, 0, z);
      const rightWall = decorateCelMesh(new THREE.Mesh(sideGeo, wMat), 0xff2244, false);
      rightWall.position.set(CORRIDOR_HALF_W + 0.7, 0, z);
      this.worldGroup.add(leftWall, rightWall);

      // Overhead structural arch / rib
      const archGeo = new THREE.BoxGeometry(CORRIDOR_HALF_W * 2 + 2.8, 1.5, 2.2);
      const arch = decorateCelMesh(new THREE.Mesh(archGeo, ribMat), 0xff3355, false);
      arch.position.set(0, CORRIDOR_HALF_H + 0.6, z);
      this.worldGroup.add(arch);

      // Glowing vector guide strips along floor
      const stripGeo = new THREE.BoxGeometry(0.35, 0.15, segLen - 4);
      const stripL = new THREE.Mesh(stripGeo, inSector2 ? neonRed : neonCyan);
      stripL.position.set(-7.5, -CORRIDOR_HALF_H + 0.1, z);
      const stripR = new THREE.Mesh(stripGeo, inSector2 ? neonRed : neonCyan);
      stripR.position.set(7.5, -CORRIDOR_HALF_H + 0.1, z);
      this.worldGroup.add(stripL, stripR);
    }

    // Sector 3: Octagonal Reactor Vault Arena around Z = -2250 to -2850
    const vaultGroup = new THREE.Group();
    vaultGroup.position.set(0, 0, BOSS_Z);
    const ringCount = 7;
    for (let i = 0; i < ringCount; i++) {
      const rGeo = new THREE.TorusGeometry(34, 1.4, 6, 8);
      const rMesh = decorateCelMesh(new THREE.Mesh(rGeo, ribMat), 0xff1144, false);
      rMesh.position.z = 260 - i * 85;
      vaultGroup.add(rMesh);
    }
    // Reactor chamber back bulkhead behind the Boss
    const backWallGeo = new THREE.CylinderGeometry(36, 36, 4, 8);
    backWallGeo.rotateX(Math.PI / 2);
    const backWall = decorateCelMesh(new THREE.Mesh(backWallGeo, wallMat2), 0xff2244, false);
    backWall.position.z = -140;
    vaultGroup.add(backWall);

    this.worldGroup.add(vaultGroup);
  }

  populateSector1() {
    // Sector 1: Z = -90 to -1020
    const patterns = ['horizontal', 'vertical', 'rotating'];
    for (let z = -110; z > SECTOR_2_Z + 40; z -= 85) {
      const r = this.rng();

      // Spawn turret pair or Mecha-Spider on trench floor
      const xSide = (this.rng() > 0.5 ? 1 : -1) * (4 + this.rng() * 8.5);
      if (r < 0.45) {
        this.spawnEnemy('turret', xSide, -CORRIDOR_HALF_H + 0.2, z);
      } else if (r < 0.78) {
        this.spawnEnemy('spider', xSide, -CORRIDOR_HALF_H + 1.4, z);
      } else {
        this.spawnEnemy('tank', xSide * 0.6, -CORRIDOR_HALF_H + 0.1, z);
      }

      // Airborne Interceptor formation every segment
      const intX = (this.rng() - 0.5) * 20;
      const intY = (this.rng() - 0.3) * 11;
      this.spawnEnemy('interceptor', intX, intY, z - 35);

      // Laser security gate every ~170m
      if (Math.abs(z) % 170 < 85) {
        const pat = patterns[Math.floor(this.rng() * patterns.length)];
        this.spawnLaserGate(pat, z - 42);
      }

      // Vector Score Ring or Powerup Holocron
      if (this.rng() < 0.55) {
        this.spawnScoreRing((this.rng() - 0.5) * 14, (this.rng() - 0.5) * 8, z - 20);
      } else {
        const kinds = ['shield', 'missiles', 'emp', 'overdrive'];
        const kind = kinds[Math.floor(this.rng() * kinds.length)];
        this.spawnPowerup(kind, (this.rng() - 0.5) * 14, (this.rng() - 0.5) * 8, z - 20);
      }
    }
  }

  populateSector2() {
    // Sector 2: THE CRIMSON SHAFT (Z = -1080 to -2120)
    for (let z = SECTOR_2_Z - 60; z > SECTOR_3_Z + 60; z -= 90) {
      // Hydraulic Blast Doors at key checkpoints
      if (Math.abs(z - SECTOR_2_Z) % 270 < 90) {
        this.spawnBlastDoor(z);
      } else {
        this.spawnLaserGate('rotating', z);
      }

      // Heavy Fortress Tank + Ceiling/Floor Spiders + Twin Interceptors
      const side = this.rng() > 0.5 ? 1 : -1;
      this.spawnEnemy('tank', side * 6.5, -CORRIDOR_HALF_H + 0.1, z - 35);
      this.spawnEnemy('spider', -side * 7.5, -CORRIDOR_HALF_H + 1.4, z - 45);
      this.spawnEnemy('interceptor', -6, 3.5, z - 55);
      this.spawnEnemy('interceptor', 6, -2.5, z - 60);

      if (this.rng() < 0.65) {
        const kinds = ['shield', 'missiles', 'emp', 'overdrive'];
        this.spawnPowerup(kinds[Math.floor(this.rng() * kinds.length)], 0, 0, z - 45);
      }
    }
  }

  populateSector3Boss() {
    // Spawn supply pickups around the reactor entrance
    this.spawnPowerup('shield', -9, -3, SECTOR_3_Z - 70);
    this.spawnPowerup('missiles', 9, -3, SECTOR_3_Z - 70);
    this.spawnPowerup('emp', 0, 5, SECTOR_3_Z - 110);

    // Spawn CERBERUS-OMEGA Boss at Z = BOSS_Z
    const mesh = buildBossCerberus();
    mesh.position.set(0, 0, BOSS_Z);
    this.worldGroup.add(mesh);

    const bodyDesc = this.RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(0, 0, BOSS_Z);
    const body = this.physicsWorld.createRigidBody(bodyDesc);
    const colDesc = this.RAPIER.ColliderDesc.ball(6.5);
    this.physicsWorld.createCollider(colDesc, body);

    this.boss = {
      id: this.nextEntityId++,
      type: 'boss',
      name: 'CERBERUS-OMEGA',
      mesh,
      body,
      x: 0,
      y: 0,
      z: BOSS_Z,
      hp: 550,
      maxHp: 550,
      phase: 1,
      alive: true,
      fireCooldown: 1.5,
      waveCooldown: 6.0,
      arms: mesh.userData.arms
    };
  }

  spawnEnemy(type, x, y, z) {
    const id = this.nextEntityId++;
    let mesh;
    let hp = 30;
    let score = 200;
    let radius = 2.2;

    if (type === 'turret') {
      mesh = buildPulseTurret();
      hp = 35;
      score = 250;
      radius = 2.3;
    } else if (type === 'spider') {
      mesh = buildMechaSpider();
      hp = 45;
      score = 350;
      radius = 2.4;
    } else if (type === 'tank') {
      mesh = buildHeavyTank();
      hp = 70;
      score = 500;
      radius = 3.0;
    } else {
      mesh = buildInterceptor();
      hp = 25;
      score = 300;
      radius = 2.2;
    }

    mesh.position.set(x, y, z);
    this.worldGroup.add(mesh);

    const rbDesc = this.RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(x, y, z);
    const body = this.physicsWorld.createRigidBody(rbDesc);
    const colDesc = this.RAPIER.ColliderDesc.ball(radius);
    this.physicsWorld.createCollider(colDesc, body);

    const enemy = {
      id,
      type,
      mesh,
      body,
      x,
      y,
      z,
      baseX: x,
      baseY: y,
      baseZ: z,
      hp,
      maxHp: hp,
      score,
      radius,
      alive: true,
      fireTimer: 1.0 + this.rng() * 2.0,
      phaseOffset: this.rng() * Math.PI * 2
    };
    this.enemies.push(enemy);
    return enemy;
  }

  spawnLaserGate(pattern, z) {
    const id = this.nextEntityId++;
    const mesh = buildLaserGate(pattern, CORRIDOR_HALF_W * 2, CORRIDOR_HALF_H * 2);
    mesh.position.set(0, 0, z);
    this.worldGroup.add(mesh);

    const gate = {
      id,
      pattern,
      mesh,
      z,
      angle: 0,
      active: true
    };
    this.gates.push(gate);
    return gate;
  }

  spawnBlastDoor(z) {
    const id = this.nextEntityId++;
    const mesh = buildBlastDoor(CORRIDOR_HALF_W * 2, CORRIDOR_HALF_H * 2);
    mesh.position.set(0, 0, z);
    this.worldGroup.add(mesh);

    const door = {
      id,
      mesh,
      z,
      lockLAlive: true,
      lockRAlive: true,
      openAmount: 0.28, // 0 = closed, 1 = wide open
      unlocked: false
    };
    this.blastDoors.push(door);
    return door;
  }

  spawnPowerup(kind, x, y, z) {
    const id = this.nextEntityId++;
    const mesh = buildPowerup(kind);
    mesh.position.set(x, y, z);
    this.worldGroup.add(mesh);

    const item = { id, kind, mesh, x, y, z, taken: false };
    this.powerups.push(item);
    return item;
  }

  spawnScoreRing(x, y, z) {
    const id = this.nextEntityId++;
    const mat = createEnergyMaterial(0x33e6ff, 0.85);
    const geo = new THREE.TorusGeometry(3.8, 0.22, 6, 8);
    const mesh = decorateCelMesh(new THREE.Mesh(geo, mat), 0xffffff, false);
    mesh.position.set(x, y, z);
    this.worldGroup.add(mesh);

    const ring = { id, mesh, x, y, z, passed: false };
    this.rings.push(ring);
    return ring;
  }

  spawnExplosion(x, y, z, colorHex = 0xff3344, scale = 1.0) {
    // Expanding cel-shaded shockwave ring
    const ringGeo = new THREE.TorusGeometry(1.2 * scale, 0.25 * scale, 4, 10);
    const ringMat = createEnergyMaterial(colorHex, 0.95);
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.position.set(x, y, z);
    this.worldGroup.add(ringMesh);
    this.particles.push({
      mesh: ringMesh,
      vx: 0,
      vy: 0,
      vz: 0,
      grow: 18 * scale,
      life: 0.42,
      maxLife: 0.42
    });

    // Dynamic Rapier 0.19.3 Physics Debris Shards!
    const shardCount = Math.min(10, Math.round(5 * scale));
    const shardMat = createCelMaterial(colorHex, 0xffdd44);
    for (let i = 0; i < shardCount; i++) {
      const sGeo = new THREE.OctahedronGeometry(0.45 * scale, 0);
      const sMesh = decorateCelMesh(new THREE.Mesh(sGeo, shardMat), 0xffffff, false);
      sMesh.position.set(x, y, z);
      this.worldGroup.add(sMesh);

      const vx = (Math.random() - 0.5) * 32 * scale;
      const vy = (Math.random() - 0.2) * 28 * scale;
      const vz = (Math.random() - 0.5) * 32 * scale;

      const rbDesc = this.RAPIER.RigidBodyDesc.dynamic()
        .setTranslation(x, y, z)
        .setLinvel(vx, vy, vz)
        .setAngvel({ x: Math.random() * 8, y: Math.random() * 8, z: Math.random() * 8 });
      const body = this.physicsWorld.createRigidBody(rbDesc);
      const colDesc = this.RAPIER.ColliderDesc.ball(0.4 * scale).setRestitution(0.7);
      this.physicsWorld.createCollider(colDesc, body);

      this.debris.push({
        mesh: sMesh,
        body,
        life: 1.15
      });
    }
  }

  stepPhysicsAndFX(dt) {
    this.physicsWorld.timestep = Math.min(dt, 0.05);
    this.physicsWorld.step();

    // Update dynamic Rapier debris shards
    for (let i = this.debris.length - 1; i >= 0; i--) {
      const d = this.debris[i];
      d.life -= dt;
      if (d.life <= 0) {
        this.worldGroup.remove(d.mesh);
        try {
          this.physicsWorld.removeRigidBody(d.body);
        } catch (e) {}
        this.debris.splice(i, 1);
      } else {
        const pos = d.body.translation();
        const rot = d.body.rotation();
        d.mesh.position.set(pos.x, pos.y, pos.z);
        d.mesh.quaternion.set(rot.x, rot.y, rot.z, rot.w);
        d.mesh.scale.setScalar(Math.max(0.1, d.life));
      }
    }

    // Update shockwave particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        this.worldGroup.remove(p.mesh);
        this.particles.splice(i, 1);
      } else {
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;
        if (p.grow) {
          const s = 1 + (p.maxLife - p.life) * p.grow;
          p.mesh.scale.setScalar(s);
        }
      }
    }
  }
}

// src/input.js
// 10-Foot Controller-First Input & Settings Manager (PS5 DualSense + Keyboard/Mouse + Axis Inversion)
const PAD = {
  cross: 0,
  circle: 1,
  square: 2,
  triangle: 3,
  l1: 4,
  r1: 5,
  l2: 6,
  r2: 7,
  create: 8,
  options: 9,
  l3: 10,
  r3: 11,
  up: 12,
  down: 13,
  left: 14,
  right: 15
};
class InputManager {
  constructor(sound, onToggleSettings, onCycleCamera, onAnyUserInput) {
    this.sound = sound;
    this.onToggleSettings = onToggleSettings;
    this.onCycleCamera = onCycleCamera;
    this.onAnyUserInput = onAnyUserInput;

    this.keys = new Set();
    this.justPressedKeys = new Set();
    this.mouseDown = false;
    this.rightMouseDown = false;
    this.mouseX = 0;
    this.mouseY = 0;

    this.padConnected = false;
    this.padName = '';
    this.padNow = [];
    this.padWas = [];
    this.padAxes = [0, 0, 0, 0];
    this.stickMenuCooldown = 0;

    this.hasKeyboardOrPad = false;

    // User-configurable settings (including the ~10% Gamepad Axis Inversion quick-fix toggles!)
    this.settings = {
      invertX: false,
      invertY: false,
      autoLevel: true,
      vectorBoost: true
    };

    // Current frame's resolved flight input (also exposed to AIHub.probe)
    this.felt = {
      x: 0,
      y: 0,
      aimX: 0,
      aimY: 0,
      fire: false,
      missile: false,
      boost: false,
      brake: false,
      roll: false,
      emp: false
    };

    this.bindEvents();
  }

  bindEvents() {
    if (typeof window === 'undefined') return;

    const handleKeyDown = (e) => {
      this.hasKeyboardOrPad = true;
      const k = (e.key || '').toLowerCase();
      if (e.key === 'Escape') {
        e.preventDefault();
        if (!e.repeat && this.onToggleSettings) this.onToggleSettings();
        return;
      }
      if (!this.keys.has(k)) {
        this.justPressedKeys.add(k);
      }
      this.keys.add(k);
      if (this.onAnyUserInput) this.onAnyUserInput('key', e.key);
    };

    const handleKeyUp = (e) => {
      const k = (e.key || '').toLowerCase();
      this.keys.delete(k);
    };

    window.addEventListener('keydown', handleKeyDown, true);
    window.addEventListener('keyup', handleKeyUp, true);

    window.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse') {
        this.hasKeyboardOrPad = true;
        if (e.button === 0) this.mouseDown = true;
        if (e.button === 2) this.rightMouseDown = true;
      }
      if (this.onAnyUserInput) this.onAnyUserInput('pointer', e);
    });

    window.addEventListener('pointerup', (e) => {
      if (e.button === 0) this.mouseDown = false;
      if (e.button === 2) this.rightMouseDown = false;
    });

    window.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'mouse') {
        this.mouseX = (e.clientX / Math.max(1, window.innerWidth)) * 2 - 1;
        this.mouseY = (e.clientY / Math.max(1, window.innerHeight)) * 2 - 1;
      }
    });

    window.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  isTouchOnly() {
    if (typeof window === 'undefined') return false;
    if (window.__forceTouchOnly === true) return true;
    if (this.hasKeyboardOrPad || this.padConnected) return false;
    const coarse =
      window.matchMedia &&
      window.matchMedia('(pointer: coarse) and (hover: none)').matches &&
      navigator.maxTouchPoints > 0;
    return !!coarse;
  }

  pollGamepad(dt = 0.016) {
    let rawPad = null;
    if (typeof navigator !== 'undefined' && navigator.getGamepads) {
      const pads = navigator.getGamepads();
      if (pads) {
        for (let i = 0; i < pads.length; i++) {
          if (pads[i] && pads[i].connected !== false) {
            rawPad = pads[i];
            break;
          }
        }
      }
    }
    if (!rawPad && typeof window !== 'undefined' && window.__pad && window.__pad.state) {
      rawPad = window.__pad.state;
    }

    this.padWas = this.padNow.slice();
    if (rawPad) {
      this.padConnected = true;
      this.padName = rawPad.id || 'Wireless Controller';
      const btns = rawPad.buttons || [];
      this.padNow = [];
      for (let i = 0; i < 16; i++) {
        const b = btns[i];
        const isDown =
          b != null && (typeof b === 'object' ? Boolean(b.pressed || b.value > 0.45) : Number(b) > 0.45);
        this.padNow[i] = isDown;
        if (isDown && !this.padWas[i] && i !== PAD.create && i !== PAD.options) {
          this.hasKeyboardOrPad = true;
          if (this.onAnyUserInput) this.onAnyUserInput('pad', i);
        }
      }
      const axes = rawPad.axes || [];
      this.padAxes = [
        Number(axes[0]) || 0,
        Number(axes[1]) || 0,
        Number(axes[2]) || 0,
        Number(axes[3]) || 0
      ];
      if (Math.hypot(this.padAxes[0], this.padAxes[1]) > 0.35) {
        this.hasKeyboardOrPad = true;
        if (this.onAnyUserInput) this.onAnyUserInput('stick', 0);
      }
    } else {
      this.padConnected = false;
      this.padNow = [];
      this.padAxes = [0, 0, 0, 0];
    }

    if (this.stickMenuCooldown > 0) {
      this.stickMenuCooldown = Math.max(0, this.stickMenuCooldown - dt);
    }

    // AI Hub Rule: Create + Options belongs to the hub's corner bar.
    // Only open/close Settings on Options when Create (button 8) is NOT held.
    if (this.padJustPressed(PAD.options) && !this.padNow[PAD.create]) {
      if (this.onToggleSettings) this.onToggleSettings();
    }
  }

  padJustPressed(btnIdx) {
    return Boolean(this.padNow[btnIdx] && !this.padWas[btnIdx]);
  }

  keyJustPressed(k) {
    return this.justPressedKeys.has(k.toLowerCase());
  }

  clearJustPressed() {
    this.justPressedKeys.clear();
  }

  updateFlightInput(settingsMenuOpen) {
    if (settingsMenuOpen) {
      this.felt = {
        x: 0,
        y: 0,
        aimX: 0,
        aimY: 0,
        fire: false,
        missile: false,
        boost: false,
        brake: false,
        roll: false,
        emp: false
      };
      return this.felt;
    }

    let x = 0;
    let y = 0;

    if (this.keys.has('arrowleft') || this.keys.has('a')) x -= 1;
    if (this.keys.has('arrowright') || this.keys.has('d')) x += 1;
    if (this.keys.has('arrowup') || this.keys.has('w')) y -= 1;
    if (this.keys.has('arrowdown') || this.keys.has('s')) y += 1;

    if (this.padConnected) {
      if (Math.abs(this.padAxes[0]) > 0.18) x = this.padAxes[0];
      if (Math.abs(this.padAxes[1]) > 0.18) y = this.padAxes[1];
      if (this.padNow[PAD.left]) x = -1;
      if (this.padNow[PAD.right]) x = 1;
      if (this.padNow[PAD.up]) y = -1;
      if (this.padNow[PAD.down]) y = 1;
    }

    // Apply Axis Inversion Settings
    if (this.settings.invertX) x = -x;
    if (this.settings.invertY) y = -y;

    const len = Math.hypot(x, y);
    if (len > 1) {
      x /= len;
      y /= len;
    }

    let aimX = 0;
    let aimY = 0;
    if (this.padConnected) {
      if (Math.abs(this.padAxes[2]) > 0.18) aimX = this.padAxes[2];
      if (Math.abs(this.padAxes[3]) > 0.18) aimY = this.padAxes[3];
    }

    // Primary Action / Fire: Cross (0), R2 (7), R1 (5), Space, F, Enter, Mouse Left
    const fire = Boolean(
      this.keys.has(' ') ||
        this.keys.has('f') ||
        this.keys.has('enter') ||
        this.mouseDown ||
        this.padNow[PAD.cross] ||
        this.padNow[PAD.r2] ||
        this.padNow[PAD.r1]
    );

    // Secondary Action / Homing Missiles: L2 (6), Square (2), G, Shift, Mouse Right
    const missile = Boolean(
      this.keys.has('g') ||
        this.keys.has('shift') ||
        this.rightMouseDown ||
        this.padNow[PAD.l2] ||
        this.padNow[PAD.square]
    );

    // Afterburner Boost: X, R1 (5)
    const boost = Boolean(this.keys.has('x') || this.padNow[PAD.r1]);

    // Airbrake / Strafe: Z, Control, L1 (4)
    const brake = Boolean(this.keys.has('z') || this.keys.has('control') || this.padNow[PAD.l1]);

    // Barrel Roll / Evasion: E, Q, Circle (1)
    const roll = Boolean(
      this.keyJustPressed('e') ||
        this.keyJustPressed('q') ||
        this.padJustPressed(PAD.circle)
    );

    // Nova EMP Smart-Pulse: B, Tab, R3 (11), L3 (10)
    const emp = Boolean(
      this.keyJustPressed('b') ||
        this.keyJustPressed('tab') ||
        this.padJustPressed(PAD.r3) ||
        this.padJustPressed(PAD.l3)
    );

    // Camera Perspective Toggle: C, V, Triangle (3)
    if (
      this.keyJustPressed('c') ||
      this.keyJustPressed('v') ||
      this.padJustPressed(PAD.triangle)
    ) {
      if (this.onCycleCamera) this.onCycleCamera();
    }

    this.felt = {
      x: Math.round(x * 100) / 100,
      y: Math.round(y * 100) / 100,
      aimX: Math.round(aimX * 100) / 100,
      aimY: Math.round(aimY * 100) / 100,
      fire,
      missile,
      boost,
      brake,
      roll,
      emp
    };

    return this.felt;
  }
}

// src/network.js
// Unified Multiplayer Adapter: AI Hub Session Protocol v1 (co-op, 1-4 seats + server host) & Standalone Squadron Co-op
const SEAT_COLORS = [0xe8443a, 0x3b82f6, 0x22c55e, 0xf5b700];
const SEAT_CSS_COLORS = ['#e8443a', '#3b82f6', '#22c55e', '#f5b700'];

/**
 * Wraps AIHub session protocol v1 into our unified network interface
 */
function createHubAdapter(info, AIHub) {
  const messageHandlers = [];
  const leaveHandlers = [];
  const startHandlers = [];
  const timeUpHandlers = [];
  const endHandlers = [];

  AIHub.on('message', (data, from) => {
    for (const fn of messageHandlers) fn(data, from);
  });
  AIHub.on('leave', (ev) => {
    for (const fn of leaveHandlers) fn(ev.id, ev.reason);
  });
  AIHub.on('start', (ev) => {
    for (const fn of startHandlers) fn(ev);
  });
  AIHub.on('time-up', (ev) => {
    for (const fn of timeUpHandlers) fn(ev);
  });
  AIHub.on('end', (ev) => {
    for (const fn of endHandlers) fn(ev);
  });

  return {
    type: 'hub',
    me: info.me,
    host: info.host,
    isHost: info.isHost,
    server: Boolean(info.server),
    splash: Boolean(info.splash),
    seed: info.seed >>> 0,
    limitMs: info.limitMs || 240000,
    players: (info.players || []).map((p, idx) => ({
      id: p.id,
      name: p.name || `Pilot ${p.id + 1}`,
      color: p.color || SEAT_CSS_COLORS[idx % 4],
      colorHex: SEAT_COLORS[idx % 4]
    })),
    time: () => AIHub.time(),
    rng: (label) => AIHub.rng(label),
    ready: () => AIHub.ready(),
    send: (data, opts) => AIHub.send(data, opts),
    progress: (p) => AIHub.progress(p),
    finish: (outcome) => AIHub.finish(outcome),
    onMessage: (fn) => messageHandlers.push(fn),
    onLeave: (fn) => leaveHandlers.push(fn),
    onStart: (fn) => startHandlers.push(fn),
    onTimeUp: (fn) => timeUpHandlers.push(fn),
    onEnd: (fn) => endHandlers.push(fn),
    destroy: () => {}
  };
}

/**
 * Standalone Multiplayer Adapter (used ONLY outside AI Hub sessions when player selects Squadron Co-Op)
 * Supports BroadcastChannel room codes across browser windows/tabs + AI Wingman Squadron members
 */
function createStandaloneSquadronAdapter({ roomCode = 'ALPHA1', aiWingmen = 2, isHost = true } = {}) {
  const messageHandlers = [];
  const leaveHandlers = [];
  const startAt = performance.now();
  const myId = isHost ? 0 : Math.floor(1 + Math.random() * 3);

  const players = [
    {
      id: myId,
      name: isHost ? 'VIPER-1 (YOU)' : `VIPER-${myId + 1} (YOU)`,
      color: SEAT_CSS_COLORS[myId % 4],
      colorHex: SEAT_COLORS[myId % 4],
      isAI: false
    }
  ];

  const wingNames = ['BEX-02 [AI]', 'VEX-03 [AI]', 'KAI-04 [AI]'];
  for (let i = 0; i < aiWingmen; i++) {
    const wid = i + 1;
    if (wid !== myId && players.length < 4) {
      players.push({
        id: wid,
        name: wingNames[i] || `WING-${wid + 1}`,
        color: SEAT_CSS_COLORS[wid % 4],
        colorHex: SEAT_COLORS[wid % 4],
        isAI: true
      });
    }
  }

  let channel = null;
  if (typeof BroadcastChannel !== 'undefined') {
    try {
      channel = new BroadcastChannel(`reddish_alert_room_${roomCode.toUpperCase()}`);
      channel.onmessage = (ev) => {
        const msg = ev.data;
        if (!msg || msg.from === myId) return;
        if (msg.type === 'join' && !players.some((p) => p.id === msg.from)) {
          // Replace an AI slot or add human peer
          const aiIdx = players.findIndex((p) => p.isAI);
          const newPeer = {
            id: msg.from,
            name: msg.name || `VIPER-${msg.from + 1}`,
            color: SEAT_CSS_COLORS[msg.from % 4],
            colorHex: SEAT_COLORS[msg.from % 4],
            isAI: false
          };
          if (aiIdx !== -1) players[aiIdx] = newPeer;
          else if (players.length < 4) players.push(newPeer);
          channel.postMessage({ type: 'roster', from: myId, players });
        } else if (msg.type === 'roster' && !isHost) {
          players.splice(0, players.length, ...msg.players);
        } else if (msg.type === 'game') {
          for (const fn of messageHandlers) fn(msg.data, msg.from);
        } else if (msg.type === 'leave') {
          for (const fn of leaveHandlers) fn(msg.from, 'left');
        }
      };
      channel.postMessage({ type: 'join', from: myId, name: players[0].name });
    } catch (e) {
      channel = null;
    }
  }

  function mulberry32(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let seedHash = 1337;
  for (let i = 0; i < roomCode.length; i++) {
    seedHash = (seedHash * 31 + roomCode.charCodeAt(i)) >>> 0;
  }

  return {
    type: 'standalone-mp',
    roomCode: roomCode.toUpperCase(),
    me: myId,
    host: 0,
    isHost,
    server: false,
    splash: false,
    seed: seedHash,
    limitMs: 360000,
    players,
    time: () => performance.now() - startAt,
    rng: () => mulberry32(seedHash),
    ready: () => {},
    send: (data) => {
      if (channel) {
        try {
          channel.postMessage({ type: 'game', from: myId, data });
        } catch (e) {}
      }
      return true;
    },
    progress: () => {},
    finish: () => {},
    onMessage: (fn) => messageHandlers.push(fn),
    onLeave: (fn) => leaveHandlers.push(fn),
    onStart: () => {},
    onTimeUp: () => {},
    onEnd: () => {},
    destroy: () => {
      if (channel) {
        try {
          channel.postMessage({ type: 'leave', from: myId });
          channel.close();
        } catch (e) {}
      }
    }
  };
}
