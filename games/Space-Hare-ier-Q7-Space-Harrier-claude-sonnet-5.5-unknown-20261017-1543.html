'use strict';
/* ====================================================================================
   CONSTANTS / UTILS
==================================================================================== */
const W=1280,H=720,TAU=Math.PI*2,INK='#150f26';
const F=600,HY=290,PZ=7,XR=7.2,YMIN=.5,YMAX=4.2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const ease=t=>1-Math.pow(1-clamp(t,0,1),3);
const pad7=n=>String(Math.max(0,Math.floor(n))).padStart(7,'0');
const GAME_ID='Q7';
const DIFF=[{n:'EASY',hp:5,bs:.8,fr:.55,boss:.75},{n:'NORMAL',hp:4,bs:1,fr:1,boss:1},{n:'HARD',hp:3,bs:1.2,fr:1.5,boss:1.2}];

const DEF={music:7,sfx:8,diff:1,auto:1,assist:1,shake:1,flash:1};

try{Object.assign(S,JSON.parse(localStorage.getItem('sh7_set')||'{}'));best=+localStorage.getItem('sh7_best')||0}catch(e){}

/* colour helpers */
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixa=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const cs=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const INKA=hx(INK);
const trio=a=>({c:cs(a),s:cs(mixa(a,INKA,.42)),l:cs(mixa(a,[255,255,255],.5))});

const PALS=[
 {sky:['#3b2fa8','#6b45d6','#c85ad2','#ff8ab0','#ffd3a0'],sun:'#fff06a',g1:'#35c46f',g2:'#22a05a',m1:'#8a4bc2',m2:'#b862d0',dec1:'#2ba85f',dec2:'#8a5a3a',e1:'#ff6fa8',e2:'#7a3fd0'},
 {sky:['#0a1650','#16338f','#2866d0','#4fb3ee','#c4f2ff'],sun:'#e9f7ff',g1:'#9a5ae0',g2:'#7a3cc0',m1:'#2a4aa8',m2:'#4b7bd0',dec1:'#64e0ff',dec2:'#b08cff',e1:'#7cf0ff',e2:'#3a56d8'},
 {sky:['#33082a','#7c1a3c','#d6443a','#ff8c3a','#ffd76a'],sun:'#fff3b0',g1:'#e8a84a',g2:'#cf8630',m1:'#a02a3c',m2:'#d3503a',dec1:'#d0702a',dec2:'#8a4a1e',e1:'#ffe14a',e2:'#e0402a'},
 {sky:['#0a0420','#220a52','#4d1486','#9a2c96','#ff6a9e'],sun:'#ffd0ea',g1:'#3b2c8c',g2:'#2b1f6c',m1:'#1c0b48',m2:'#34156a',dec1:'#8a4aff',dec2:'#3b2c8c',e1:'#ff4a8a',e2:'#8a2cff'}
].map(p=>{const o={};for(const k in p)o[k]=k==='sky'?p[k].map(hx):hx(p[k]);return o});
function palMix(a,b,t){const o={};for(const k in a)o[k]=k==='sky'?a.sky.map((c,i)=>mixa(c,b.sky[i],t)):mixa(a[k],b[k],t);return o}
let PL={};
function buildPL(p){
  PL={sky:p.sky.map(cs),sun:cs(p.sun),g1:cs(p.g1),g2:cs(p.g2),g1d:cs(mixa(p.g1,INKA,.3)),g2d:cs(mixa(p.g2,INKA,.3)),fog:p.sky[4],
      m1:trio(p.m1),m2:trio(p.m2),dec1:trio(p.dec1),dec2:trio(p.dec2),e1:trio(p.e1),e2:trio(p.e2),ink:cs(mixa(p.g1,INKA,.8))};
}
buildPL(PALS[0]);

const STAGES=[
  {name:'CHECKER MEADOW',pal:0,t0:0,track:'s1'},
  {name:'CRYSTAL CANYON',pal:1,t0:50,track:'s2'},
  {name:'EMBER DUNES',pal:2,t0:100,track:'s3'},
  {name:'THE GREEDY MOON',pal:3,t0:150,track:'boss'}
];

/* ====================================================================================
   AUDIO  (procedural Web Audio: music sequencer + sfx)
==================================================================================== */
const mf=n=>440*Math.pow(2,(n-69)/12);
const bits=s=>s.split('').map(c=>c==='1'?1:0);
const lead=s=>s.trim().split(/\s+/).map(t=>t==='.'?null:+t);
const PENT={M:[0,2,4,7,9],m:[0,3,5,7,10]};
const TR={
 title:{bpm:112,key:60,pent:'M',prog:[0,9,5,7],mn:[0,1,0,0],bass:[0,null,null,0,null,null,0,null,7,null,null,7,null,0,null,null],arp:[0,1,2,4,2,1,0,1,2,4,5,4,2,1,0,1],
   lead:lead('4 . 5 . 7 . 5 . 4 . 2 . 0 . . . 2 . 4 . 5 . 7 . 9 . 7 . 5 . . .'),k:bits('1000001010000010'),sn:bits('0000100000001000'),h:bits('0010001000100010')},
 s1:{bpm:150,key:60,pent:'M',prog:[0,9,5,7],mn:[0,1,0,0],bass:[0,0,12,0,0,0,12,0,0,0,12,0,0,12,0,7],arp:[0,1,2,1,3,2,1,2,0,1,2,1,4,3,2,1],
   lead:lead('7 . 9 7 5 . 7 . 4 . 5 7 9 . . . 9 . 7 5 4 . 5 . 7 . 9 . 7 5 . .'),k:bits('1000100010001000'),sn:bits('0000100000001000'),h:bits('1010101010101010')},
 s2:{bpm:154,key:62,pent:'m',prog:[0,8,3,10],mn:[1,0,0,0],bass:[0,0,0,12,0,0,12,0,0,0,0,12,0,0,12,7],arp:[0,1,2,3,2,1,0,1,2,1,0,1,2,3,4,3],
   lead:lead('5 . 7 . 8 . 7 5 . . 3 . 5 . 7 . 8 . 9 . 8 . 7 . 5 . 3 . 5 . . .'),k:bits('1001001010010010'),sn:bits('0000100000001000'),h:bits('1111111111111111')},
 s3:{bpm:158,key:64,pent:'M',prog:[0,7,9,5],mn:[0,0,1,0],bass:[0,0,0,0,12,0,0,0,0,0,12,0,7,0,12,0],arp:[0,2,1,2,3,2,1,2,0,2,1,2,4,3,2,3],
   lead:lead('9 . . 7 9 . 7 5 . 7 9 . 5 . 4 . 5 . 7 9 . . 7 . 9 . 8 . 7 5 . .'),k:bits('1000101010001010'),sn:bits('0000100000001001'),h:bits('1010101010101011')},
 boss:{bpm:168,key:57,pent:'m',prog:[0,8,3,10],mn:[1,0,0,0],bass:[0,0,12,0,0,0,12,0,0,0,12,0,0,12,0,0],arp:[0,2,1,2,0,2,1,2,3,2,1,2,0,2,4,2],
   lead:lead('7 7 . 5 . 7 . 8 9 . 8 . 7 . 5 . 3 . 5 5 . 3 . 5 7 . 5 3 . . .'),k:bits('1001001010010010'),sn:bits('0000100000001010'),h:bits('1110111011101110')},
 win:{bpm:132,key:60,pent:'M',once:1,len:3,prog:[0,5,7],mn:[0,0,0],bass:[0,null,null,null,0,null,null,null,0,null,null,null,0,null,null,null],arp:[0,1,2,4,5,4,2,1,0,1,2,4,5,7,5,4],
   lead:lead('4 . 5 . 7 . 9 . 7 5 7 . 9 . 9 . 9 . . . . . . . . . . . . . . . .'.repeat(1)+' 9 . . . 9 . . . 9 . . . . . . .'),k:bits('1000100010001000'),sn:bits('0000100000001000'),h:bits('1010101010101010')},
 lose:{bpm:80,key:57,pent:'m',once:1,len:2,prog:[0,8],mn:[1,0],bass:[0,null,null,null,null,null,null,null,0,null,null,null,null,null,null,null],arp:[0,null,1,null,2,null,1,null,0,null,null,null,null,null,null,null],
   lead:lead('5 . . . 3 . . . 2 . . . 0 . . . . . . . . . . . . . . . . . . .'),k:bits('1000000000000000'),sn:bits('0000000000000000'),h:bits('0000000000000000')}
};
const AU={c:null,mg:null,mus:null,sfx:null,nb:null,track:null,want:null,step:0,nextT:0,duck:1,last:{},
  init(){
    if(this.c){if(this.c.state==='suspended')this.c.resume();return}
    try{
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      const c=this.c=new C();
      const comp=c.createDynamicsCompressor();comp.connect(c.destination);
      this.mg=c.createGain();this.mg.gain.value=.8;this.mg.connect(comp);
      this.mus=c.createGain();this.sfx=c.createGain();this.mus.connect(this.mg);this.sfx.connect(this.mg);
      const len=c.sampleRate,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      this.nb=b;this.vol();
      setInterval(()=>this.tick(),30);
      if(this.want){const w=this.want;this.track=null;this.play(w)}
    }catch(e){this.c=null}
  },
  vol(){if(!this.c)return;this.mus.gain.value=S.music/10*.5*this.duck;this.sfx.gain.value=S.sfx/10*.85},
  tone(f,t,d,type,v,f2,dest){
    const c=this.c,o=c.createOscillator(),g=c.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(dest||this.sfx);o.start(t);o.stop(t+d+.03);
  },
  noise(t,d,v,f0,f1,type,dest){
    const c=this.c,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
    s.buffer=this.nb;fl.type=type||'lowpass';fl.frequency.setValueAtTime(f0,t);
    if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(dest||this.sfx);s.start(t,Math.random()*.4);s.stop(t+d+.03);
  },
  play(name){
    this.want=name;if(!this.c)return;
    if(this.track===TR[name])return;
    this.track=TR[name]||null;this.step=0;this.nextT=this.c.currentTime+.06;
  },
  stop(){this.want=null;this.track=null},
  tick(){
    if(!this.c||!this.track)return;
    const tr=this.track,sd=60/tr.bpm/4;
    if(this.nextT<this.c.currentTime-.5)this.nextT=this.c.currentTime+.05;
    while(this.nextT<this.c.currentTime+.14){
      this.note(tr,this.step,this.nextT,sd);this.nextT+=sd;this.step++;
      if(tr.once&&this.step>=tr.len*16){this.track=null;break}
    }
  },
  note(tr,i,t,sd){
    const bar=Math.floor(i/16)%tr.prog.length,s=i%16,root=tr.key+tr.prog[bar],ch=tr.mn[bar]?[0,3,7]:[0,4,7],m=this.mus;
    const b=tr.bass[s];if(b!=null)this.tone(mf(root+b-24),t,sd*1.7,'sawtooth',.17,0,m);
    const a=tr.arp[s];if(a!=null)this.tone(mf(root+ch[a%3]+12*Math.floor(a/3)),t,sd*.85,'square',.05,0,m);
    const l=tr.lead[i%tr.lead.length];
    if(l!=null){const p=PENT[tr.pent];this.tone(mf(tr.key+p[l%5]+12*Math.floor(l/5)+12),t,sd*1.8,'triangle',.13,0,m)}
    if(tr.k[s]){this.tone(150,t,.14,'sine',.42,40,m);this.noise(t,.05,.1,220,0,'lowpass',m)}
    if(tr.sn[s])this.noise(t,.13,.2,2200,900,'bandpass',m);
    if(tr.h[s])this.noise(t,.035,.06,7500,0,'highpass',m);
  },
  fx(n){
    if(!this.c||S.sfx<=0)return;
    const c=this.c,t=c.currentTime;
    const gap={shoot:.045,hit:.04,kill:.03,star:.03,graze:.05,ui:.03}[n];
    if(gap){if(t-(this.last[n]||0)<gap)return;this.last[n]=t}
    switch(n){
      case 'shoot':this.tone(900,t,.07,'square',.07,300);break;
      case 'hit':this.tone(300,t,.05,'square',.08,150);break;
      case 'kill':this.noise(t,.22,.28,2500,200);this.tone(220,t,.15,'square',.12,60);break;
      case 'big':this.noise(t,.7,.5,1800,60);this.tone(110,t,.6,'sawtooth',.25,28);break;
      case 'hurt':this.noise(t,.5,.5,1500,100);this.tone(260,t,.4,'sawtooth',.28,50);break;
      case 'pick':[0,4,7,12].forEach((x,i)=>this.tone(mf(72+x),t+i*.055,.12,'square',.12));break;
      case 'power':[0,4,7,12,16].forEach((x,i)=>this.tone(mf(67+x),t+i*.05,.16,'triangle',.2));break;
      case 'star':this.tone(1300,t,.08,'triangle',.1,1900);break;
      case 'graze':this.tone(1800,t,.05,'sine',.08,2600);break;
      case 'dash':this.noise(t,.3,.3,600,4000,'bandpass');break;
      case 'burst':this.noise(t,.9,.5,400,6000,'bandpass');this.tone(80,t,.8,'sawtooth',.3,400);break;
      case 'ready':[0,7,12].forEach((x,i)=>this.tone(mf(79+x),t+i*.06,.14,'triangle',.16));break;
      case 'move':this.tone(660,t,.05,'square',.07);break;
      case 'ok':this.tone(520,t,.06,'square',.1);this.tone(780,t+.06,.1,'square',.1);break;
      case 'back':this.tone(500,t,.06,'square',.09,300);break;
      case 'adj':this.tone(700,t,.04,'triangle',.1);break;
      case 'banner':this.noise(t,.7,.25,300,5000,'bandpass');break;
      case 'warn':for(let i=0;i<4;i++){this.tone(520,t+i*.7,.35,'sawtooth',.2,880)}break;
      case 'boom':this.noise(t,1.2,.6,1200,50);this.tone(70,t,1,'sawtooth',.3,25);break;
      case 'tick':this.tone(1000,t,.03,'square',.08);break;
    }
  }
};

/* ====================================================================================
   INPUT  (gamepad primary, keyboard + mouse secondary, same interaction model)
==================================================================================== */
const KB=new Set(),KBT=new Set();
const GAMEKEYS=new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab','Backspace','Escape']);
const pad={ok:false,b:[],lx:0,ly:0,ref:null};
let prevPadB=[],prevStick=0,device='kb',activity=false,keySeen=false,padSeen=false;
const mouse={x:-1,y:-1,click:false,moved:false,last:0};
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(GAMEKEYS.has(e.code))e.preventDefault();
  if(!e.repeat){KB.add(e.code);KBT.add(e.code);activity=true;device='kb';keySeen=true;AU.init()}
});
addEventListener('keyup',e=>{KB.delete(e.code)});
addEventListener('blur',()=>{KB.clear();if(mode==='play'&&!scr)openPause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&!scr)openPause()});
addEventListener('gamepadconnected',()=>{padSeen=true});
addEventListener('gamepaddisconnected',()=>{if(mode==='play'&&!scr&&device==='pad')openPause()});
function toLogical(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
cv.addEventListener('pointermove',e=>{const[x,y]=toLogical(e);if(Math.abs(x-mouse.x)+Math.abs(y-mouse.y)>3){mouse.moved=true;mouse.last=performance.now();if(e.pointerType==='mouse'){activity=true}}mouse.x=x;mouse.y=y});
cv.addEventListener('pointerdown',e=>{const[x,y]=toLogical(e);mouse.x=x;mouse.y=y;mouse.click=true;mouse.moved=true;mouse.last=performance.now();activity=true;AU.init();e.preventDefault()});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function pollPad(){
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  let g=null;for(const p of gps){if(p&&p.connected){g=p;break}}
  pad.ok=!!g;pad.ref=g;
  if(!g){pad.b=[];pad.lx=pad.ly=0;prevPadB=[];return}
  padSeen=true;
  const b=[];for(let i=0;i<18;i++){const x=g.buttons[i];b[i]=!!x&&(x.pressed||x.value>.5)}
  let lx=g.axes[0]||0,ly=g.axes[1]||0;const m=Math.hypot(lx,ly);
  if(m<.2){lx=ly=0}else{const k=(Math.min(1,m)-.2)/.8/m;lx*=k;ly*=k}
  pad.b=b;pad.lx=lx;pad.ly=ly;
  let act=false;for(let i=0;i<18;i++)if(b[i]&&!prevPadB[i])act=true;
  const sm=Math.hypot(lx,ly);if(sm>.6&&prevStick<=.6)act=true;prevStick=sm;
  prevPadB=b;
  if(act){activity=true;device='pad';AU.init()}
}
const prevA={},hold={up:0,down:0,left:0,right:0};
function readActions(dt){
  pollPad();
  const k=c=>KB.has(c)||KBT.has(c),pb=i=>!!pad.b[i];
  let mx=(k('ArrowRight')||k('KeyD')?1:0)-(k('ArrowLeft')||k('KeyA')?1:0);
  let my=(k('ArrowDown')||k('KeyS')?1:0)-(k('ArrowUp')||k('KeyW')?1:0);
  if(mx&&my){mx*=.7071;my*=.7071}
  mx+=pad.lx+(pb(15)?1:0)-(pb(14)?1:0);my+=pad.ly+(pb(13)?1:0)-(pb(12)?1:0);
  mx=clamp(mx,-1,1);my=clamp(my,-1,1);
  const a={mx,my,
    fire:k('Space')||k('KeyZ')||k('KeyJ')||pb(0)||pb(7),
    dash:k('ShiftLeft')||k('ShiftRight')||k('KeyX')||k('KeyK')||pb(1)||pb(5)||pb(4),
    burst:k('KeyC')||k('KeyL')||k('KeyE')||pb(2)||pb(3)||pb(6),
    pause:k('Escape')||k('KeyP')||pb(9),
    ok:k('Enter')||k('Space')||k('KeyZ')||k('KeyJ')||pb(0),
    back:k('Escape')||k('Backspace')||k('KeyX')||k('KeyK')||pb(1)};
  const out={mx,my,fire:a.fire,dash:a.dash,burst:a.burst,P:{}};
  for(const n of ['fire','dash','burst','pause','ok','back']){out.P[n]=a[n]&&!prevA[n];prevA[n]=a[n]}
  const dirs={up:my<-.5,down:my>.5,left:mx<-.5,right:mx>.5};
  for(const d in dirs){
    if(dirs[d]){if(hold[d]===0){out.P[d]=true;hold[d]=.001}else{hold[d]+=dt;if(hold[d]>.4){out.P[d]=true;hold[d]=.4-.11}}}
    else hold[d]=0;
  }
  KBT.clear();
  return out;
}
function rumble(ms,w,s){
  try{const g=pad.ref;if(g&&g.vibrationActuator&&device==='pad')g.vibrationActuator.playEffect('dual-rumble',{duration:ms,weakMagnitude:w,strongMagnitude:s})}catch(e){}
}

/* ====================================================================================
   DRAWING PRIMITIVES (cel-shaded / ink)
==================================================================================== */
function shp(fn,fill,shade,off){
  ctx.beginPath();fn(0,0);ctx.fillStyle=fill;ctx.fill();
  if(shade){
    ctx.save();ctx.beginPath();fn(0,0);ctx.clip();
    ctx.beginPath();ctx.rect(-60,-60,120,120);fn(-off,-off*1.1);
    ctx.fillStyle=shade;ctx.fill('evenodd');ctx.restore();
  }
  ctx.beginPath();fn(0,0);ctx.stroke();
}
const EL=(x,y,rx,ry,rot=0)=>(dx,dy)=>{ctx.moveTo(x+dx+rx*Math.cos(rot),y+dy+rx*Math.sin(rot));ctx.ellipse(x+dx,y+dy,rx,ry,rot,0,TAU)};
const PG=pts=>(dx,dy)=>{ctx.moveTo(pts[0]+dx,pts[1]+dy);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i]+dx,pts[i+1]+dy);ctx.closePath()};
function ell(x,y,rx,ry,col,off,rot){shp(EL(x,y,rx,ry,rot||0),col.c,col.s,off==null?Math.min(rx,ry)*.35:off)}
function ellF(x,y,rx,ry,fill,rot){ctx.beginPath();EL(x,y,rx,ry,rot||0)(0,0);ctx.fillStyle=fill;ctx.fill();ctx.stroke()}
function poly(pts,col,off){shp(PG(pts),col.c,col.s,off==null?.15:off)}
function hl(x,y,rx,ry,rot){ctx.beginPath();EL(x,y,rx,ry,rot||-.6)(0,0);ctx.fillStyle='rgba(255,255,255,.8)';ctx.fill()}

const FONT='"Arial Black","Segoe UI Black","Trebuchet MS",Impact,system-ui,sans-serif';
function txt(s,x,y,size,fill,o){
  o=o||{};
  ctx.save();
  ctx.font=`${o.italic?'italic ':''}900 ${size}px ${FONT}`;
  ctx.textAlign=o.align||'left';ctx.textBaseline=o.base||'alphabetic';
  if(o.alpha!=null)ctx.globalAlpha*=o.alpha;
  if('letterSpacing' in ctx)ctx.letterSpacing=(o.sp||0)+'px';
  ctx.lineJoin='round';
  const lw=o.lw==null?size*.2:o.lw;
  if(o.shadow){ctx.fillStyle=o.shadowC||INK;ctx.fillText(s,x+size*.07,y+size*.08)}
  if(lw>0){ctx.strokeStyle=o.stroke||INK;ctx.lineWidth=lw;ctx.strokeText(s,x,y)}
  ctx.fillStyle=fill;ctx.fillText(s,x,y);
  ctx.restore();
}
function tw(s,size,sp){ctx.save();ctx.font=`900 ${size}px ${FONT}`;if('letterSpacing' in ctx)ctx.letterSpacing=(sp||0)+'px';const w=ctx.measureText(s).width;ctx.restore();return w}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}

/* controller / keyboard glyphs */
const GL={ok:['cross','ENTER'],back:['circle','ESC'],fire:['cross','SPACE'],dash:['circle','SHIFT'],burst:['square','C'],
  move:['LS','WASD'],pause:['OPTIONS','ESC'],nav:['DPAD','↑↓'],adj:['LR','←→']};
const PADC={cross:'#6fa8ff',circle:'#ff6b7a',square:'#ff9be0',tri:'#6ee7a0'};
function glyph(kind,x,y,sz){
  sz=sz||30;ctx.save();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.lineCap='round';
  let w=sz;
  if(PADC[kind]){
    const r=sz/2,cx=x+r;
    ctx.beginPath();ctx.arc(cx,y,r,0,TAU);ctx.fillStyle='#23204a';ctx.fill();ctx.stroke();
    ctx.strokeStyle=PADC[kind];ctx.lineWidth=3.5;ctx.beginPath();const q=r*.5;
    if(kind==='cross'){ctx.moveTo(cx-q,y-q);ctx.lineTo(cx+q,y+q);ctx.moveTo(cx+q,y-q);ctx.lineTo(cx-q,y+q)}
    else if(kind==='circle')ctx.arc(cx,y,q*1.05,0,TAU);
    else if(kind==='square')ctx.rect(cx-q,y-q,q*2,q*2);
    else{ctx.moveTo(cx,y-q*1.1);ctx.lineTo(cx+q*1.1,y+q*.8);ctx.lineTo(cx-q*1.1,y+q*.8);ctx.closePath()}
    ctx.stroke();
  }else if(kind==='LS'||kind==='DPAD'||kind==='LR'){
    const r=sz/2,cx=x+r;
    ctx.beginPath();ctx.arc(cx,y,r,0,TAU);ctx.fillStyle='#23204a';ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';
    if(kind==='LS'){ctx.beginPath();ctx.arc(cx,y,r*.45,0,TAU);ctx.fillStyle='#cfd2ff';ctx.fill()}
    else if(kind==='DPAD'){const q=r*.28,l=r*.7;ctx.beginPath();ctx.rect(cx-q,y-l,q*2,l*2);ctx.rect(cx-l,y-q,l*2,q*2);ctx.fill()}
    else{ctx.beginPath();ctx.moveTo(cx-r*.7,y);ctx.lineTo(cx-r*.25,y-r*.4);ctx.lineTo(cx-r*.25,y+r*.4);ctx.moveTo(cx+r*.7,y);ctx.lineTo(cx+r*.25,y-r*.4);ctx.lineTo(cx+r*.25,y+r*.4);ctx.fill()}
  }else{
    const fs=sz*.62,tww=tw(kind,fs,0);w=Math.max(sz,tww+sz*.55);
    rr(x,y-sz/2,w,sz,sz*.22);ctx.fillStyle='#f4efe2';ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+4,y+sz/2-5);ctx.lineTo(x+w-4,y+sz/2-5);ctx.strokeStyle='#b9ae92';ctx.lineWidth=4;ctx.stroke();
    txt(kind,x+w/2,y+fs*.36,fs,INK,{align:'center',lw:0});
  }
  ctx.restore();return w;
}
const gl=(act)=>GL[act][device==='pad'?0:1];
function prompt(act,label,x,y,sz,col){
  const w=glyph(gl(act),x,y,sz||30);
  txt(label,x+w+10,y+(sz||30)*.33,(sz||30)*.85,col||'#fff',{lw:(sz||30)*.2});
  return w+10+tw(label,(sz||30)*.85);
}
function promptW(act,label,sz){const k=gl(act);const w=PADC[k]||k==='LS'||k==='DPAD'||k==='LR'?(sz||30):Math.max(sz||30,tw(k,(sz||30)*.62,0)+(sz||30)*.55);return w+10+tw(label,(sz||30)*.85)}

function heart(x,y,s,fill){
  ctx.beginPath();ctx.moveTo(x,y+s*.9);
  ctx.bezierCurveTo(x-s*1.6,y-s*.1,x-s*.8,y-s*1.1,x,y-s*.35);
  ctx.bezierCurveTo(x+s*.8,y-s*1.1,x+s*1.6,y-s*.1,x,y+s*.9);
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.stroke();
}

function ebul(x,y,z,vx,vy,vz,big){G.EB.push({k:'eb',x,y,z,vx,vy,vz,gr:false,age:0,big:!!big})}
function aimVel(x,y,z,spd,lead){
  const g=G,t=Math.max(.15,(z-PZ)/spd);
  return[(g.px+g.vx*(lead||0)*t-x)/t,(g.py+g.vy*(lead||0)*t-y)/t];
}
function volley(e,n,spread,spd){
  const d=DIFF[S.diff],s=(spd||24)*d.bs,[ax,ay]=aimVel(e.x,e.y,e.z,s,.25);
  for(let i=0;i<n;i++){const o=(i-(n-1)/2)*spread;ebul(e.x,e.y,e.z-1,ax+o,ay,-s)}
  AU.fx('tick');
}
function boom(x,y,z,size,col){
  const g=G;
  g.PA.push({k:'boom',x,y,z,life:.45,max:.45,sz:size,vx:0,vy:0,vz:0,col:col||'#ffe14a'});
  for(let i=0;i<Math.min(14,6+size*3|0);i++){
    const a=Math.random()*TAU,sp=rnd(2,7);
    g.PA.push({k:'puff',x,y,z,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp+1.5,vz:rnd(-3,3),life:rnd(.4,.8),max:.8,sz:rnd(.15,.4)*size,col:pick(['#ff6a3a','#ffd23a','#fff4d0','#2a1a3a'])});
  }
}
function spark(x,y,z,col,n){
  for(let i=0;i<(n||5);i++){const a=Math.random()*TAU,sp=rnd(3,8);G.PA.push({k:'spark',x,y,z,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vz:rnd(-3,3),life:rnd(.15,.35),max:.35,sz:.1,col:col||'#fff'})}
}
function pop(x,y,z,s,col){G.PO.push({x,y,z,s,life:1,col:col||'#fff'})}
function addScore(g,v){g.score+=v;if(!g.demo&&g.score>best){best=g.score}}
function addBurst(g,v){if(g.state==='play'&&g.burst<100){g.burst=Math.min(100,g.burst+v);if(g.burst>=100&&!g.burstReady){g.burstReady=true;AU.fx('ready')}}}
function shake(a){if(S.shake&&G)G.shake=Math.max(G.shake,a)}
function flash(c,a){if(G){G.flashC=c;G.flash=Math.max(G.flash,S.flash?a*.35:a)}}

function kill(e,chain){
  const g=G;if(e.dead)return;
  e.dead=true;
  const m=mult(g);
  if(e.score){addScore(g,e.score*m);pop(e.x,e.y+1,e.z,'+'+(e.score*m),m>=4?'#ffe14a':'#fff')}
  if(e.cnt!==false&&e.hp!=null)g.killed++;
  if(!chain){g.combo++;g.comboT=3;g.maxCombo=Math.max(g.maxCombo,g.combo)}
  addBurst(g,e.k==='golem'||e.k==='shead'?7:2.5);
  boom(e.x,e.y,e.z,e.k==='golem'||e.k==='shead'?2.2:e.k==='bat'?1.5:1.1);
  AU.fx(e.k==='golem'||e.k==='shead'?'big':'kill');
  if(e.k==='shead'){
    let i=0;for(const s of g.E)if(s.gid===e.gid&&!s.dead){s.chain=.1+(i++)*.07}
    shake(.5);
  }
  if(e.k==='golem'||e.k==='bat'){if(g.hp<g.maxhp&&Math.random()<.25)g.PK.push({k:'carrot',x:e.x,y:Math.max(1,e.y),z:e.z,age:0,r:1.1})}
}
function hurt(){
  const g=G;
  if(g.inv>0||g.state!=='play')return;
  g.hp--;g.hits++;g.inv=1.7;g.combo=0;g.comboT=0;g.hurtT=.5;
  g.hitstop=.08;shake(1);flash('#ff2a4a',.55);AU.fx('hurt');rumble(300,.6,1);
  boom(g.px,g.py,PZ,1.2,'#ff3a5a');
  if(g.hp<=0){
    g.hp=0;g.state='dying';g.deadT=0;AU.stop();AU.fx('boom');rumble(700,1,1);shake(1.6);
    boom(g.px,g.py,PZ,3);
  }
}
function doBurst(g){
  g.burst=0;g.burstReady=false;g.inv=Math.max(g.inv,1.1);
  g.bwave={t:0};flash('#ffffff',.8);shake(1.1);AU.fx('burst');rumble(500,.8,.8);
  for(const e of g.E){
    if(e.dead||e.solid||e.z>110)continue;
    if(e.k==='boss'){hitBoss(e,36)}
    else if(e.hp!=null){e.hp-=8;e.flash=.15;if(e.hp<=0)kill(e)}
  }
  for(const b of g.EB){if(!b.dead){b.dead=true;g.PK.push({k:'star',x:b.x,y:b.y,z:b.z,age:0,r:1.2,mag:true})}}
  g.EB.length=0;
}
function hitBoss(e,dmg){
  const g=G;
  if(e.state!=='fight')return;
  e.hp-=dmg;e.flash=.07;
  if(e.hp<=0){bossDie(e)}
}
function bossWarn(){
  const g=G;g.warn=3.4;AU.stop();AU.fx('warn');
  g.E.length=0;
  g.bossAt=g.t+3.4;
}
function spawnBoss(){
  const g=G,d=DIFF[S.diff],hp=Math.round(360*d.boss);
  g.boss=addE({k:'boss',x:0,y:3,z:130,r:5,rz:3,hp,max:hp,score:0,sh:4.5,state:'enter',cnt:false,atkT:2,ph:1,seq:0,spiral:null,mot:null});
  stageStart(3);
}
function bossDie(e){
  const g=G;
  e.hp=0;e.state='dying';e.dieT=0;g.state='victory';g.endT=0;
  AU.stop();g.combo+=0;
  for(const b of g.EB)b.dead=true;
  g.EB.length=0;
  g.hitstop=.25;
}

function playerStep(g,dt,I){
  if(g.state==='dying'){g.deadT+=dt;return}
  const ctl=g.state==='play'||g.state==='victory'?I:{mx:0,my:0,fire:false,P:{}};
  // dash
  g.dashCd=Math.max(0,g.dashCd-dt);
  if(g.state==='play'&&ctl.P.dash&&g.dashCd<=0){
    g.dashT=.28;g.dashCd=.95;g.inv=Math.max(g.inv,.36);
    let dx=ctl.mx,dy=ctl.my;const m=Math.hypot(dx,dy);
    if(m>.2){g.dx=dx/m;g.dy=dy/m}
    AU.fx('dash');rumble(120,.4,.2);
  }
  let tvx,tvy,k;
  if(g.dashT>0){g.dashT-=dt;tvx=g.dx*20;tvy=-g.dy*14;k=Math.min(1,dt*30);g.roll+=dt*TAU/.28*(g.dx>=0?1:-1)}
  else{tvx=ctl.mx*9.6;tvy=-ctl.my*7.2;k=Math.min(1,dt*13);g.roll*=Math.max(0,1-dt*14)}
  g.vx+=(tvx-g.vx)*k;g.vy+=(tvy-g.vy)*k;
  g.px=clamp(g.px+g.vx*dt,-XR,XR);g.py=clamp(g.py+g.vy*dt,YMIN,YMAX);
  if(g.dashT<=0&&Math.abs(g.roll)<.1)g.roll=0;
  g.inv=Math.max(0,g.inv-dt);g.hurtT=Math.max(0,g.hurtT-dt);
  // fire
  g.fireCd-=dt;g.muzzle=Math.max(0,g.muzzle-dt);
  const want=g.state==='play'&&(S.auto||g.demo?true:ctl.fire)||(g.state==='play'&&ctl.fire);
  if(want&&g.fireCd<=0){
    g.fireCd=.105;g.muzzle=.06;g.side=-g.side;
    firePlayer(g);AU.fx('shoot');
  }
  if(g.power>0)g.power=Math.max(0,g.power-dt);
  if(g.state==='play'&&ctl.P.burst&&g.burst>=100)doBurst(g);
}
function firePlayer(g){
  const spreads=g.power>0?[-1,0,1]:[0];
  for(const sp of spreads){
    const b={x:g.px+g.side*.3,y:g.py,z:PZ+.6,vx:sp*2.2,vy:0,k:'pb'};
    if(S.assist||g.demo){
      let bt=null,bd=2.6;
      for(const e of g.E){
        if(e.dead||e.solid||e.z<PZ+4||e.z>110||e.state==='enter')continue;
        const dd=Math.hypot(e.x-b.x,e.y-b.y);
        if(dd<bd+(e.k==='boss'?e.r:0)){bd=dd;bt=e}
      }
      if(bt){
        const t=Math.max(.05,(bt.z-b.z)/92);
        b.vx=clamp((bt.x-b.x)/t*.75,-14,14)+sp*.6;b.vy=clamp((bt.y-b.y)/t*.75,-14,14);
      }
    }
    g.PB.push(b);
  }
}

function stepEnemies(g,dt){
  const d=DIFF[S.diff];
  for(const e of g.E){
    if(e.dead)continue;
    e.age+=dt;e.flash=Math.max(0,e.flash-dt);
    if(e.chain!=null){e.chain-=dt;if(e.chain<=0)kill(e,true);continue}
    if(e.k==='boss'){stepBoss(g,e,dt);continue}
    e.z-=(g.V+e.dv)*dt;
    const m=e.mot;
    if(m){
      if(m.t==='wave'){
        e.x=m.cx+m.ax*Math.sin(m.kz*e.z+m.w*e.age+(m.ph0||0));
        e.y=clamp(m.cy+m.ay*Math.sin(m.kz*e.z*.8+m.w*1.3*e.age),YMIN,YMAX);
      }else if(m.t==='ring'){
        const a=m.a0+m.w*e.age;e.x=m.cx+m.R*Math.cos(a);e.y=clamp(m.cy+m.R*.75*Math.sin(a),YMIN+.2,YMAX);
      }else if(m.t==='sweep'){
        e.x=m.x0+m.dx*e.age;e.y=clamp(m.cy+m.ay*Math.sin(m.w*e.age),YMIN,YMAX);
        if(Math.abs(e.x)>13&&e.age>1)e.dead=true,e.gone=true;
      }else if(m.t==='walk'){
        e.x=m.x0+m.ax*Math.sin(m.w*e.age+m.ph);
      }
    }
    if(e.fz&&!e.fired&&e.z<e.fz&&e.z>PZ+6){
      e.fired=true;
      if(Math.random()<Math.min(1,d.fr))volley(e,e.k==='bat'?3:1,e.k==='bat'?2.2:0,22);
    }
    if(e.k==='golem'){
      e.fireT-=dt;
      if(e.fireT<=0&&e.z<70&&e.z>PZ+8){e.fireT=rnd(1.8,2.6)/Math.max(.6,d.fr);volley(e,3,2.6,20)}
    }
    if(e.z<PZ-4||e.z<1.6){e.dead=true;e.gone=true}
  }
  // player collisions
  if(g.state==='play'){
    for(const e of g.E){
      if(e.dead||e.k==='boss'||e.hitP)continue;
      if(Math.abs(e.z-PZ)>e.rz+.6)continue;
      if(e.solid){
        if(Math.abs(g.px-e.x)<e.w+.45&&g.py-.45<e.h){if(g.inv<=0){e.hitP=true;hurt()}}
      }else{
        if(Math.abs(g.px-e.x)<e.r+.35&&Math.abs(g.py-e.y)<e.r+.45){
          if(g.inv<=0){e.hitP=true;hurt();if(e.k!=='golem'&&e.hp<=3){kill(e,true)}}
        }
      }
    }
  }
  g.E=g.E.filter(e=>!e.dead);
}
function stepBoss(g,e,dt){
  const d=DIFF[S.diff];
  if(e.state==='enter'){
    e.z=Math.max(34,e.z-38*dt);
    g.V=Math.max(14,g.V-8*dt);
    if(e.z<=34){e.state='fight';e.age=0;e.atkT=1.2}
    return;
  }
  if(e.state==='dying'){
    e.dieT+=dt;e.x+=Math.sin(e.dieT*40)*.02;
    if(Math.random()<dt*14){boom(e.x+rnd(-4,4),e.y+rnd(-3,3),e.z-1,rnd(1.5,3));AU.fx('kill');shake(.6);rumble(80,.6,.6)}
    g.V=Math.max(6,g.V-10*dt);
    return;
  }
  const hpf=e.hp/e.max;e.ph=hpf>.66?1:hpf>.33?2:3;
  e.x=3.6*Math.sin(e.age*.65);e.y=3.5+.8*Math.sin(e.age*1.05+1);
  if(e.ph!==e.lastPh){if(e.lastPh){flash('#ffffff',.4);shake(.8);AU.fx('big');g.phaseWarn=1.4;for(const b of g.EB)b.dead=true;g.EB.length=0}e.lastPh=e.ph;e.atkT=Math.max(e.atkT,1.1)}
  e.atkT-=dt;
  const rate=[0,1.5,1.25,1.0][e.ph],bs=22*d.bs;
  if(e.sp){
    e.sp.t-=dt;
    while(e.sp.t<=0&&e.sp.i<e.sp.n){e.sp.t+=.065;const a=e.sp.a0+e.sp.i*.55;
      ebul(e.x,e.y,e.z-2,Math.cos(a)*4.5,Math.sin(a)*3.4,-bs*.9);e.sp.i++}
    if(e.sp.i>=e.sp.n)e.sp=null;
  }
  if(e.atkT<=0){
    e.atkT=rate/Math.max(.7,Math.min(1.3,d.fr));
    const seqs=[null,['aim','radial','aim','line'],['radial','aim5','summon','spiral'],['radial','aim5','spiral','curtain']];
    const a=seqs[e.ph][e.seq++%4];
    const ox=e.x,oy=e.y,oz=e.z-2;
    if(a==='aim'||a==='aim5'){
      const n=a==='aim'?3:5;const[ax,ay]=aimVel(ox,oy,oz,bs*1.1,.3);
      for(let i=0;i<n;i++)ebul(ox,oy,oz,ax+(i-(n-1)/2)*2.4,ay,-bs*1.1);
    }else if(a==='radial'){
      const n=e.ph===1?10:e.ph===2?14:18,off=Math.random()*TAU;
      for(let i=0;i<n;i++){const an=off+i/n*TAU;ebul(ox,oy,oz,Math.cos(an)*4.6,Math.sin(an)*3.6,-bs*.85)}
    }else if(a==='line'){
      for(let i=0;i<7;i++)ebul(ox+(i-3)*1.8,oy,oz,0,(g.py-oy)/1.3,-bs*.95);
    }else if(a==='spiral'){
      e.sp={i:0,n:e.ph===3?26:18,t:0,a0:Math.random()*TAU};
    }else if(a==='summon'){
      for(let i=0;i<3;i++){const w=wisp(ox+(i-1)*2.4,clamp(oy,1,4),{t:'wave',cx:ox+(i-1)*2.4,cy:clamp(oy,1,4),ax:1.8,ay:.7,w:2.4,kz:0},true);w.z=oz-1-i;w.dv=-g.V+10;w.cnt=false;w.fz=oz-5}
    }else if(a==='curtain'){
      const gap=rnd(-5,5);
      for(let x=-8;x<=8.01;x+=1.2){if(Math.abs(x-gap)<1.9)continue;for(const y of[1.1,2.5,3.9])ebul(x,y,oz,0,0,-bs*.8)}
    }
    AU.fx('tick');
  }
  if(g.state==='play'&&Math.abs(g.px-e.x)<e.r*.6&&Math.abs(g.py-e.y)<e.r*.6&&Math.abs(e.z-PZ)<3){}
}
function stepBullets(g,dt){
  const d=DIFF[S.diff];
  // player bullets
  for(const b of g.PB){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=92*dt;
    if(b.z>140||Math.abs(b.x)>30){b.dead=true;continue}
    for(const e of g.E){
      if(e.dead||e.state==='enter')continue;
      if(Math.abs(b.z-e.z)>e.rz+1.5)continue;
      if(e.solid){
        if(Math.abs(b.x-e.x)<e.w&&b.y<e.h+.2){b.dead=true;spark(b.x,b.y,b.z,'#fff',3);break}
      }else if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+.3){
        b.dead=true;AU.fx('hit');spark(b.x,b.y,b.z-.5,e.k==='boss'?'#ffe9a0':'#fff',4);
        if(e.k==='boss')hitBoss(e,1);
        else if(e.hp!=null){e.hp--;e.flash=.07;if(e.hp<=0)kill(e)}
        break;
      }
    }
  }
  g.PB=g.PB.filter(b=>!b.dead);
  // enemy bullets
  for(const b of g.EB){
    b.age+=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;
    if(b.z<PZ-3||Math.abs(b.x)>30||b.y<-1||b.y>9){b.dead=true;continue}
    if(g.state==='play'&&Math.abs(b.z-PZ)<1){
      const dd=Math.hypot(b.x-g.px,b.y-g.py);
      if(dd<.58){if(g.inv<=0){b.dead=true;hurt()}else if(!b.gr&&g.dashT>0){b.gr=true;addScore(g,25);addBurst(g,10);spark(b.x,b.y,b.z,'#ffe14a',6);AU.fx('graze');pop(g.px,g.py+.8,PZ,'DASH!','#6ee7ff')}}
      else if(dd<1.7&&!b.gr){b.gr=true;addScore(g,10);addBurst(g,5);spark(b.x,b.y,b.z,'#ffe14a',4);AU.fx('graze');g.grazeT=.4}
    }
  }
  g.EB=g.EB.filter(b=>!b.dead);
}
function stepPickups(g,dt){
  for(const p of g.PK){
    p.age+=dt;p.z-=g.V*dt;
    const dz=p.z-PZ;
    if((p.mag||dz<26)&&g.state==='play'&&dz>0){
      const f=p.mag?6:2.2;p.x+=(g.px-p.x)*Math.min(1,dt*f);p.y+=(g.py-p.y)*Math.min(1,dt*f);
      if(p.mag)p.z-=22*dt;
    }
    if(g.state==='play'&&Math.abs(p.z-PZ)<1.4&&Math.hypot(p.x-g.px,p.y-g.py)<1.25){
      p.dead=true;
      if(p.k==='star'){addScore(g,50*(p.mag?2:1));AU.fx('star');spark(p.x,p.y,p.z,'#ffe14a',3)}
      else if(p.k==='carrot'){if(g.hp<g.maxhp){g.hp++}else addScore(g,500);AU.fx('pick');pop(g.px,g.py+1,PZ,g.hp<=g.maxhp?'HEAL':'+500','#7dffa8');flash('#7dffa8',.25)}
      else if(p.k==='gold'){g.power=14;AU.fx('power');pop(g.px,g.py+1,PZ,'TRIPLE SHOT','#ffe14a');flash('#ffe14a',.3)}
    }
    if(p.z<PZ-3||p.z<1.6)p.dead=true;
  }
  g.PK=g.PK.filter(p=>!p.dead);
}
function stepFX(g,dt){
  for(const p of g.PA){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=(p.vz-g.V)*dt;if(p.k==='puff')p.vy-=6*dt}
  g.PA=g.PA.filter(p=>p.life>0&&p.z>1.6);
  for(const p of g.PO){p.life-=dt*.9;p.y+=dt*1.2;p.z-=g.V*dt*.5}
  g.PO=g.PO.filter(p=>p.life>0);
  for(const d of g.DC)d.z-=g.V*dt;
  g.DC=g.DC.filter(d=>d.z>1.8);
  g.decT-=dt;
  while(g.decT<=0){g.decT+=.19*24/Math.max(10,g.V);spawnDecor(g,Z0+rnd(0,6))}
  g.flash=Math.max(0,g.flash-dt*2.2);g.shake=Math.max(0,g.shake-dt*2.4);
  if(g.bwave){g.bwave.t+=dt;if(g.bwave.t>.9)g.bwave=null}
  if(g.grazeT)g.grazeT=Math.max(0,g.grazeT-dt);
  if(g.phaseWarn)g.phaseWarn=Math.max(0,g.phaseWarn-dt);
}

function stepGame(g,dt,I){
  if(g.hitstop>0){g.hitstop-=dt;return}
  g.runT+=dt;
  g.t+=dt;
  g.scroll+=g.V*dt;
  // palette
  if(g.palT<1){g.palT=Math.min(1,g.palT+dt/2.6);buildPL(palMix(g.palA,g.palB,ease(g.palT)))}
  // combo
  if(g.comboT>0){g.comboT-=dt;if(g.comboT<=0)g.combo=0}
  // camera
  camX+=(g.px*.4-camX)*Math.min(1,dt*5);camY+=((2.6+(g.py-2.3)*.35)-camY)*Math.min(1,dt*5);
  // demo skip
  if(g.demo&&g.jumps.length&&g.runT>g.jumps[0].at){
    const j=g.jumps.shift();g.t=j.to;g.E.length=0;g.EB.length=0;g.PK.length=0;g.boss=null;
    g.ti=0;while(g.ti<g.tl.length&&g.tl[g.ti][0]<g.t)g.ti++;
    g.hp=Math.min(g.maxhp,g.hp+2);
  }
  // timeline
  if(g.state==='play'||g.state==='dying'){
    while(g.ti<g.tl.length&&g.tl[g.ti][0]<=g.t&&!g.warn&&!g.boss){g.tl[g.ti][1]();g.ti++}
  }
  if(g.warn>0){
    g.warn-=dt;
    if(g.warn<=0&&!g.boss){spawnBoss()}
  }
  // ambient obstacles during non-boss
  if(!g.boss&&!g.warn&&g.state==='play'&&g.t>6){
    g.rockT-=dt;
    if(g.rockT<=0){g.rockT=[2.4,1.8,1.4][Math.min(2,g.stage)]+rnd(0,1.2);if(g.t%50>3)rocks(1,8)}
  }
  playerStep(g,dt,I);
  stepEnemies(g,dt);
  stepBullets(g,dt);
  stepPickups(g,dt);
  stepFX(g,dt);
  if(g.banner){g.banner.t+=dt;if(g.banner.t>g.banner.dur)g.banner=null}
  if(g.tip){g.tip.t-=dt;if(g.tip.t<=0)g.tip=null}
  // end states
  if(g.state==='dying'&&g.deadT>1.8&&!g.finished){g.finished=true;onDeath(g)}
  if(g.state==='victory'){
    g.endT+=dt;
    if(g.endT>4.6&&!g.finished){g.finished=true;onVictory(g)}
    if(g.endT>1.2&&!g.fin1){g.fin1=true;flash('#ffffff',1);AU.fx('boom');shake(1.6)}
  }
}

/* ---------------- demo AI ---------------- */
function aiInput(g){
  const I={mx:0,my:0,fire:true,dash:false,burst:false,P:{}};
  g.aiT-=1/60;
  if(g.aiT<=0){
    g.aiT=.05;
    let best_=-1e9,bx=0,by=2.3;
    const tgt=[];
    for(const e of g.E)if(!e.dead&&!e.solid&&e.hp!=null&&e.z>PZ+4&&e.z<85&&e.state!=='enter')tgt.push(e);
    tgt.sort((a,b)=>a.z-b.z);
    const t0=tgt[0];
    for(let gx=-6.4;gx<=6.41;gx+=.8)for(let gy=.8;gy<=3.9;gy+=.7){
      let sc=0;
      for(const b of g.EB){
        const dz=b.z-PZ;if(dz<-1||dz>46)continue;
        const tt=dz/-b.vz;if(tt<0)continue;
        const hx_=b.x+b.vx*tt,hy_=b.y+b.vy*tt,dd=Math.hypot(hx_-gx,hy_-gy);
        if(dd<2.1)sc-=(2.1-dd)*50/(1+tt*1.2);
      }
      for(const e of g.E){
        if(e.dead)continue;const dz=e.z-PZ;if(dz<-1.5||dz>34)continue;
        if(e.k==='boss')continue;
        if(e.solid){if(Math.abs(gx-e.x)<e.w+.9&&gy-.5<e.h+.6)sc-=90/(1+dz*.08)}
        else{const dd=Math.hypot(e.x-gx,e.y-gy);if(dd<e.r+1.1)sc-=70/(1+dz*.1)}
      }
      if(t0){sc+=7-Math.min(7,Math.abs(t0.x-gx)*2.2+Math.abs(t0.y-gy)*2)}
      if(g.boss&&g.boss.state==='fight'){sc+=6-Math.min(6,Math.abs(g.boss.x-gx)*1.2+Math.abs(g.boss.y-gy)*1.2)}
      for(const p of g.PK){const dz=p.z-PZ;if(dz>0&&dz<40&&(p.k!=='carrot'||g.hp<g.maxhp)){sc+=3-Math.min(3,Math.hypot(p.x-gx,p.y-gy)*.5)}}
      sc-=Math.hypot(gx-g.px,gy-g.py)*.5+Math.abs(gx)*.08;
      if(sc>best_){best_=sc;bx=gx;by=gy}
    }
    g.aiX=bx;g.aiY=by;
  }
  I.mx=clamp((g.aiX-g.px)*1.6,-1,1);I.my=clamp(-(g.aiY-g.py)*1.6,-1,1);
  let near=false;
  for(const b of g.EB){const dz=b.z-PZ;if(dz>0&&dz<5&&Math.hypot(b.x-g.px,b.y-g.py)<1.4){near=true;break}}
  if(near&&g.dashCd<=0&&g.dashT<=0){I.P.dash=true}
  if(g.burst>=100&&(g.EB.length>10||g.E.length>=7||(g.boss&&g.boss.state==='fight')))I.P.burst=true;
  return I;
}

/* ---------------- results ---------------- */
function onDeath(g){
  if(g.demo){restartDemo();return}
  AU.play('lose');
  scr='over';sel=0;stack=[];mode='menu';
}
function onVictory(g){
  if(g.demo){restartDemo();return}
  const bonus=g.hp*5000+Math.max(0,Math.round((300-g.runT)*20))+(g.hits===0?20000:0);
  g.bonus=bonus;addScore(g,bonus);
  if(g.score>best){best=g.score}
  saveBest();
  const kp=g.spawned?g.killed/g.spawned:1;
  let rank='C';
  if(kp>=.5)rank='B';
  if(kp>=.7&&g.hits<=3)rank='A';
  if(kp>=.85&&g.hits<=1&&g.retries===0)rank='S';
  if(g.retries>0&&rank==='S')rank='A';
  g.result={kp,rank};
  AU.play('win');
  scr='win';sel=0;stack=[];mode='menu';
}

const halftone=(()=>{
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#0b0618';
  for(let gy=0;gy<H;gy+=9)for(let gx=0;gx<W;gx+=9){
    const ox=(gy/9%2)*4.5,px_=gx+ox;
    const dx=Math.abs(px_-W/2)/(W/2),dy=Math.abs(gy-H/2)/(H/2);
    const v=Math.max(0,Math.pow(Math.max(dx,dy),3)*1.1+(dx*dx+dy*dy)*.08-.34);
    const r=Math.min(4.2,v*4.8);
    if(r>.5){x.beginPath();x.arc(px_,gy,r,0,TAU);x.fill()}
  }
  return c;
})();

function drawSky(g){
  const hs=[.28,.26,.2,.14,.12].map(v=>v*HY);let y=0;
  for(let i=0;i<5;i++){
    ctx.fillStyle=PL.sky[i];ctx.fillRect(0,y,W,hs[i]+1);
    if(i>0){ // halftone transition dots
      ctx.fillStyle=PL.sky[i];ctx.beginPath();
      for(let row=0;row<2;row++)for(let x=(row?9:0);x<W+18;x+=18){const r=row?3.2:5;ctx.moveTo(x+r,y-9-row*8);ctx.arc(x,y-9-row*8,r*(row?.8:1),0,TAU)}
      ctx.fill();
    }
    y+=hs[i];
  }
  ctx.fillStyle=PL.sky[4];ctx.fillRect(0,HY-2,W,6);
  // sun
  const sx=930-camX*7,sy=HY-92;

    }

  }
}

function menuBackdrop(dt){
  const g=G;if(!g||!g.title)return;
  g.title_t+=dt;g.runT+=dt;g.scroll+=g.V*dt*.6;
  g.px=Math.sin(g.title_t*.6)*2.6;g.py=2.4+Math.sin(g.title_t*.9)*.6;g.vx=Math.cos(g.title_t*.6)*1.6;
  g.roll=0;
  camX+=(g.px*.4-camX)*Math.min(1,dt*3);camY+=((2.6+(g.py-2.3)*.35)-camY)*Math.min(1,dt*3);
  g.fireCd-=dt;
  for(const d of g.DC)d.z-=g.V*.6*dt;
  g.DC=g.DC.filter(d=>d.z>1.8);
  g.decT-=dt;while(g.decT<=0){g.decT+=.3;spawnDecor(g,Z0+rnd(0,6))}
  g.title_pal=g.title_pal||0;
  g.title_t2=(g.title_t2||0)+dt;
  if(g.title_t2>9){g.title_t2=0;g.stage=(g.stage+1)%3;g.palA=palMix(g.palA,g.palB,g.palT);g.palB=PALS[g.stage];g.palT=0}
  if(g.palT<1){g.palT=Math.min(1,g.palT+dt/3);buildPL(palMix(g.palA,g.palB,ease(g.palT)))}
  for(const p of g.PA){p.life-=dt}
  g.PA=g.PA.filter(p=>p.life>0);
}

function menuInput(I){
  const sc=SCR[scr],items=sc.items();
  // mouse hover/click
  if(mouse.moved){
    mouse.moved=false;
    for(const h of HIT){if(mouse.x>=h.x&&mouse.x<=h.x+h.w&&mouse.y>=h.y&&mouse.y<=h.y+h.h){if(sel!==h.i){sel=h.i;AU.fx('move')}}}
  }
  if(mouse.click){
    mouse.click=false;
    for(const h of HIT){
      if(mouse.x>=h.x&&mouse.x<=h.x+h.w&&mouse.y>=h.y&&mouse.y<=h.y+h.h){
        sel=h.i;const it=items[h.i];
        if(it.t==='sl'||it.t==='ch'){adjust(it,mouse.x>h.x+h.w*.5?1:-1,sc)}else activate(it,sc);
        return;
      }
    }
  }
  if(I.P.up){sel=(sel+items.length-1)%items.length;AU.fx('move')}
  if(I.P.down){sel=(sel+1)%items.length;AU.fx('move')}
  const it=items[sel];
  if(I.P.left&&(it.t==='sl'||it.t==='ch'))adjust(it,-1,sc);
  if(I.P.right&&(it.t==='sl'||it.t==='ch'))adjust(it,1,sc);
  if(I.P.ok){
    if(it.t==='sl'||it.t==='ch')adjust(it,1,sc);else activate(it,sc);
  }else if(I.P.back||(scr==='pause'&&I.P.pause)){backMenu()}
}

function drawWipe(){
  if(!wipe.dir)return;
  const u=wipe.dir===1?wipe.t/.32:1-wipe.t/.32;
  const n=8,bh=H/n;
  ctx.fillStyle=INK;
  for(let i=0;i<n;i++){
    const k=clamp(u*1.6-(i/n)*.6,0,1)*1.0;
    const w=W*ease(k)+30;
    ctx.beginPath();ctx.moveTo(0,i*bh);ctx.lineTo(w,i*bh);ctx.lineTo(w-30,(i+1)*bh+1);ctx.lineTo(0,(i+1)*bh+1);ctx.closePath();ctx.fill();
  }
}

  txt(on?'DEMO PLAY':'PRESS ANY BUTTON',W/2,152,34,on?'#ff8ad0':'#fff',{align:'center',lw:8,shadow:true,sp:5});

}

function fit(){
  const w=innerWidth,h=innerHeight;let cw=w,ch=w*9/16;if(ch>h){ch=h;cw=h*16/9}
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.style.left=(w-cw)/2+'px';cv.style.top=(h-ch)/2+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(640,Math.round(Math.min(cw*dpr,1920)));cv.height=Math.round(cv.width*9/16);
}
addEventListener('resize',fit);fit();

let lastTs=0,toTitleBoot=false;
G=newGame({title:true});
scr=gatePending?'gate':'title';
AU.want='title';

let ft=0;
function frame(ts){
  requestAnimationFrame(frame);
  const f0=performance.now();
  const dt=Math.min(.05,Math.max(0,(ts-lastTs)/1000));lastTs=ts;
  if(!dt)return;
  const I=readActions(dt);
  let lifted=false;
  if(activity){
    if(gatePending&&(keySeen||pad.ok)){lifted=true;gatePending=false;if(scr==='gate'){scr='title';sel=0}}
    if(!gatePending&&stack.length&&stack[0][0]==='gate')stack[0][0]='title';
  }
  // wipe state
  if(wipe.dir){
    wipe.t+=dt;
    if(wipe.t>=.32){
      if(wipe.dir===1){const m=wipe.mid;wipe.dir=-1;wipe.t=0;wipe.mid=null;if(m)m();if(wipe.done){wipe.done();wipe.done=null}}
      else wipe.dir=0;
    }
  }
  const busy=wipe.dir===1;
  // idle / attract
  const menuIdle=mode==='menu'&&(scr==='title'||scr==='help'||scr==='settings'||scr==='about')&&G&&G.title;
  if(menuIdle&&!busy){
    if(activity)idle=0;else idle+=dt;
    if(idle>=10){idle=0;startDemo()}
  }else idle=0;
  if(mode==='demo'&&!busy){
    if(activity||I.P.ok||I.P.pause||I.P.back){mouse.click=false;prevA.ok=true;endDemo();AU.fx('ok')}
  }
  // update
  if(mode==='menu'){
    if(G.title)menuBackdrop(dt);
    else if(G.state==='dying'||G.state==='victory'){stepFXOnly(G,dt)}
    if(!busy&&!lifted)menuInput(I);
    else {mouse.click=false}
  }else if(mode==='play'){
    if(!busy&&I.P.pause&&G.state==='play')openPause();
    else stepGame(G,dt,I);
  }else if(mode==='demo'){
    if(G&&!G.title)stepGame(G,dt,aiInput(G));
  }
  if(mode!=='menu')mouse.click=false;
  // cursor
  cv.style.cursor=(mode==='menu'&&performance.now()-mouse.last<2500)?'default':'none';
  // render
  const k=cv.width/W;
  ctx.setTransform(k,0,0,k,0,0);
  ctx.clearRect(0,0,W,H);
  renderScene(G);
  if(!G.title&&mode!=='menu'||(mode==='menu'&&!G.title&&scr!=='win'))drawHUD(G);
  if(mode==='demo')drawDemoOverlay();
  if(mode==='menu')drawMenu();
  drawWipe();
  activity=false;
  if(G.state==='victory'&&mode==='play'&&G.endT>2.8){
    txt('MISSION COMPLETE',W/2,H/2,84,'#7dffa8',{align:'center',lw:14,shadow:true,italic:true,alpha:clamp((G.endT-2.8)*2,0,1)});
  }
  ft=ft*.95+(performance.now()-f0)*.05;
}
function stepFXOnly(g,dt){
  g.runT+=dt;
  for(const p of g.PA){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=(p.vz-g.V*.3)*dt}
  g.PA=g.PA.filter(p=>p.life>0);
  g.flash=Math.max(0,g.flash-dt*2.2);g.shake=Math.max(0,g.shake-dt*2.4);
}
requestAnimationFrame(frame);
