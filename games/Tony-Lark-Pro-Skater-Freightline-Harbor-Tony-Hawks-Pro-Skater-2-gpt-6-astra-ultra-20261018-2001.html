      Math.cos(a) * 66
    );
    camera.lookAt(0, 1, 0);
    camera.fov = damp(camera.fov, 53, 3, dt);
  } else {
    cameraYaw += input.cameraX * 2.2 * dt;
    if (Math.abs(input.cameraX) < 0.1)
      cameraYaw += wrap(s.heading - cameraYaw) * (1 - Math.exp(-2.6 * dt));
    cameraPitch = clamp2(
      cameraPitch + input.cameraY * dt * (settings.invertY ? -1 : 1),
      -0.12,
      0.9
    );
    const distance = 10.8 + s.speed * 0.12;
    const target = new THREE.Vector3(
      s.x - Math.sin(cameraYaw) * distance,
      s.y + 5 + cameraPitch * 5,
      s.z - Math.cos(cameraYaw) * distance
    );
    target.y = Math.max(
      target.y,
      park.groundAt(clamp2(target.x, -51, 51), clamp2(target.z, -63, 63)) + 2.5
    );
    camera.position.lerp(target, 1 - Math.exp(-5.5 * dt));
    const shakeAmount = settings.cameraShake ? shake : 0;
    camera.position.x += (Math.random() - 0.5) * shakeAmount;
    camera.position.y += (Math.random() - 0.5) * shakeAmount;
    camera.lookAt(
      s.x + Math.sin(s.heading) * 2,
      s.y + 1.25,
      s.z + Math.cos(s.heading) * 2
    );
    camera.fov = damp(camera.fov, 58 + s.speed * 0.45, 3, dt);
  }
  camera.updateProjectionMatrix();
  shake = damp(shake, 0, 10, dt);
}
function frame(time) {
  const realDt = (time - last) / 1e3 || 1 / 60;
  const dt = Math.min(0.05, realDt);
  last = time;
  simTime += dt;
  stats.frames++;
  try {
    const input = ui.input.poll(dt);
    lastInput = input;
    const previousScreen = screen;
    if (input.any) {
      idle = 0;
      audio.unlock();
    } else idle += realDt;
    if (screen === "attract" && input.any) {
      toTitle();
    } else if (screen === "playing" && input.pressed.pause) {
      setScreen("pause");
      sound("menu");
    } else if (screen === "playing") {
      run.elapsed += realDt;
      if (mode === "career") {
        const before = run.time;
        run.time = Math.max(0, run.time - realDt);
        if (run.time <= 0) run.overTime += realDt;
        if (run.time < 10 && Math.floor(before) !== Math.floor(run.time))
          sound("tick");
      }
      for (const [key, value] of Object.entries(input.pressed))
        if (value) pendingPressed[key] = true;
      for (const [key, value] of Object.entries(input.released))
        if (value) pendingReleased[key] = true;
      accumulator += dt;
      let first = true;
      while (accumulator >= 1 / 60) {
        simulation(1 / 60, {
          ...input,
          pressed: first ? pendingPressed : {},
          released: first ? pendingReleased : {}
        });
        accumulator -= 1 / 60;
        stats.steps++;
        first = false;
      }
      if (!first) {
        pendingPressed = {};
        pendingReleased = {};
      }
    } else if (screen === "attract") replay(realDt);
    else if (!running && screen !== "results" && idle >= 10) beginAttract();
    if (previousScreen !== screen) {
      accumulator = 0;
      pendingPressed = {};
      pendingReleased = {};
    }
    updateScene(dt, input);
    audio.update({
      dt,
      speed: skater.speed,
      grounded: skater.grounded,
      grinding: !!skater.grinding,
      manual: skater.manual,
      special: (run?.special || 0) / 100,
      screen
    });
    ui.update({ ...view(), device: input.device });
    renderer.render(scene, camera);
  } catch (error) {
    stats.errors.push(String(error));
    console.error(error);
    renderer.setAnimationLoop(null);
    ui.setError(
      `The session stopped: ${error.message}. Reload to reopen the harbor.`
    );
  }
}
async function init() {
  try {
    if (!navigator.gpu)
      throw new Error(
        "WebGPU is required. Open this file in a WebGPU-enabled Chrome or Edge browser. There is no WebGL fallback."
      );
    const adapter = await navigator.gpu.requestAdapter({
      powerPreference: "high-performance"
    });
    if (!adapter)
      throw new Error(
        "No WebGPU adapter is available. Enable hardware acceleration and use a supported browser."
      );
    bootMessage.textContent = "Warming up the concrete. Building the park\u2026";
    renderer = new THREE.WebGPURenderer({
      canvas: document.querySelector("#game"),
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer._getFallback = null;
    await renderer.init();
    if (!renderer.backend.isWebGPUBackend)
      throw new Error(
        "WebGPU initialization failed. This demo does not use a fallback renderer."
      );
    stats.backend = "WebGPU";
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    await RAPIER.init();
    physics = new RAPIER.World({ x: 0, y: -20.5, z: 0 });
    physics.timestep = 1 / 60;
    park = createWorld(THREE, RAPIER, physics);
    scene = park.scene;
    camera = new THREE.PerspectiveCamera(
      60,
      innerWidth / innerHeight,
      0.1,
      900
    );
    camera.position.set(45, 35, -65);
    camera.lookAt(0, 0, 0);
    body = physics.createRigidBody(
      RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(
        0,
        0.84,
        -43
      )
    );
    collider = physics.createCollider(
      RAPIER.ColliderDesc.capsule(0.44, 0.38).setFriction(0).setRestitution(0),
      body
    );
    controller = physics.createCharacterController(0.025);
    controller.setSlideEnabled(true);
    controller.setMaxSlopeClimbAngle(Math.PI * 0.46);
    controller.setMinSlopeSlideAngle(Math.PI * 0.47);
    controller.enableAutostep(0.32, 0.25, true);
    run = newRun();
    resetSkater();
    audio.setSettings(settings);
    await renderer.compileAsync(scene, camera);
    boot.hidden = true;
    ready = true;
    stats.booted = true;
    setScreen("title");
    ui.setLoading("");
    last = performance.now();
    renderer.setAnimationLoop(frame);
    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  } catch (error) {
    stats.errors.push(String(error));
    stats.backend = "unavailable";
    console.error(error);
    boot.hidden = true;
    screen = "error";
    ui.setError(error.message || String(error));
    const errorMenus = () => {
      ui.input.poll(1 / 60);
      requestAnimationFrame(errorMenus);
    };
    requestAnimationFrame(errorMenus);
  }
}
window.addEventListener("blur", () => {
  if (screen === "playing") setScreen("pause");
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden && screen === "playing") setScreen("pause");
});
window.__SKATE__ = {
  snapshot: () => ({
    ready,
    screen,
    mode,
    renderer: stats.backend,
    three: THREE.REVISION,
    rapier: ready ? RAPIER.version() : "initializing",
    frames: stats.frames,
    physicsSteps: stats.steps,
    attractLoops: stats.attractLoops,
    attractTime,
    attractPhase,
    errors: [...stats.errors],
    skater: skater ? {
      x: skater.x,
      y: skater.y,
      z: skater.z,
      speed: skater.speed,
      grounded: skater.grounded,
      manual: skater.manual,
      grinding: skater.grinding?.id,
      spin: skater.spin
    } : null,
    run: run ? {
      score: run.score,
      time: run.time,
      combo: run.comboNames,
      multiplier: run.multiplier,
      jumps: run.jumps,
      distance: run.distance,
      letters: [...run.letters],
      goals: [...run.sessionGoals]
    } : null,
    rails: park?.rails.length,
    pickups: park?.pickups.length,
    gaps: park?.gaps.length,
    lastAction: stats.lastAction,
    input: lastInput ? {
      steer: lastInput.steer,
      throttle: lastInput.throttle,
      brake: lastInput.brake,
      cameraX: lastInput.cameraX,
      cameraY: lastInput.cameraY,
      held: { ...lastInput.held },
      device: lastInput.device
    } : null
  }),
  metadata
};
init();
</script>
