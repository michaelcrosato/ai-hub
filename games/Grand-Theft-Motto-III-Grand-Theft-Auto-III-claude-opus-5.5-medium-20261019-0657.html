    aim(n, w) {

      P2.fireT = 0;
      P2.fire();
      P2.aimTarget = null;
      return true;
    },
    hit(n, d) {

      if (!e) return false;

      return true;
    },

      for (const r of SES.rp.values()) {
        if (r.dead) continue;
        const q = (r.car ? r.car.pos : r.pos).clone(), d = q.distanceToSquared(here);
        if (d < md) {
          md = d;
          mate = q;
        }
      }
      let sp = null;
      const free = (x, z) => {
        if (!onLand(x, z)) return false;
        const hit = G.world.castRay(new G.RAPIER.Ray({ x, y: 60, z }, { x: 0, y: -1, z: 0 }), 70, true, void 0, RAY_WORLD);
        return !hit || 60 - hit.timeOfImpact < 0.6;
      };
      if (mate) {
        for (let i = 0; i < 12 && !sp; i++) {
          const a = i * 0.52, r = i < 6 ? 4 : 8;
          if (free(mate.x + Math.cos(a) * r, mate.z + Math.sin(a) * r)) sp = new THREE.Vector3(mate.x + Math.cos(a) * r, 0, mate.z + Math.sin(a) * r);
        }
        if (!sp) {
          const nd = nearestNode(mate.x, mate.z, false);
          sp = new THREE.Vector3(nd.x + 5, 0, nd.z + 5);
        }
      } else {
        let b = null, bd = 1e9;
        for (let i = 0; i <= G.progress.bridges; i++) {
          const s2 = W.respawn[(kind === "WASTED" ? "hospital" : "police") + i];
          if (s2 && s2.distanceTo(here) < bd) {
            bd = s2.distanceTo(here);
            b = s2;
          }
        }
        sp = b || W.respawn.hospital0;
      }
      P2.teleport(sp.x, sp.z, Math.PI);
      P2.hp = 100;
      P2.armor = 0;
      P2.invuln = 3;
      P2.dead = false;
      if (kind === "BUSTED") {
        for (const w of ["pistol", "smg", "shotgun", "rocket"]) P2.ammo[w] = Math.floor(P2.ammo[w] / 2);
      }
      if (P2.ammo[P2.weapon] <= 0) P2.setWeapon("fist");
      G.renderer.domElement.style.filter = "";
      $2("dead").className = "";
      G.mode = "play";
      UI.toast(kind === "WASTED" ? "Back on your feet \u2014 hospital bill $100" : "Out on bail \u2014 half your ammo was confiscated", 4);
    }
    boot();
  }
});
export default require_main();
