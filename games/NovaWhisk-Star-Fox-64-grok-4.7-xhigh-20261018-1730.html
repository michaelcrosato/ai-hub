    up: { x: ux, y: uy, z: uz },
  };
}

function showcasePath() {
  return buildPath(11, 2200, 40, 1);
}

function emptyActions() {
  return {
    moveX: 0,
    moveY: 0,
    fire: false,
    charge: false,
    bomb: false,
    boost: false,
    brake: false,
    roll: false,
    rollDir: 1,
    uturn: false,
    confirm: false,
    back: false,
    pause: false,
  };
}

const KIND = {
  dart: { hp: 16, r: 1.15, fire: 1.55, shot: 8, approach: 0 },
  lance: { hp: 44, r: 1.7, fire: 1.35, shot: 12, burst: 3 },
  heavy: { hp: 70, r: 2.1, fire: 1.15, shot: 14, burst: 3 },
  asteroid: { hp: 30, r: 2.5, solid: true },
  post: { hp: 34, r: 1.45, fire: 1.05, shot: 10 },
  hunter: { hp: 78, r: 1.7, fire: 0.7, shot: 9 },
  ace: { hp: 56, r: 1.35, fire: 0.62, shot: 10 },
  fighter: { hp: 32, r: 1.35, fire: 1.25, shot: 9 },
  barge: { hp: 1, r: 4.6 },
  engine: { hp: 58, r: 1.9 },
  generator: { hp: 90, r: 2.3 },
  core: { hp: 230, r: 2.4 },
  eye: { hp: 210, r: 2.5 },
  plate: { hp: 46, r: 2.2 },
  sile: { hp: 1, r: 5.2 },
  keel: { hp: 1, r: 7 },
};

function createRun(rapier, opts) {
  const mission = MISSIONS[opts.mission];
  const rand = mulberry32(opts.seed >>> 0);
  const world = new rapier.World({ x: 0, y: 0, z: 0 });
  const queue = new rapier.EventQueue(true);
  const carry = opts.carry || null;
  const wingmen = WINGS.map((def) => {
    const prev = carry && carry.wingmen ? carry.wingmen.find((w) => w.id === def.id) : null;
    return {
      id: def.id,
      name: def.name,
      short: def.short,
      color: def.color,
      slot: def.slot,
      shield: prev ? prev.shield : 100,
      maxShield: 100,
      alive: prev ? prev.alive : true,
      heat: prev ? !!prev.heat : false,
      crisis: false,
      saved: false,
      lost: prev ? !prev.alive : false,
      cd: 0.4,
      dropCd: 6,
      dropsLeft: 2,
      x: 0,
      y: 0,
      z: 0,
      body: null,
      collider: null,
    };
  });
  let shield = carry ? carry.shield : 100;
  if (carry && mission.id !== "glasswake") {
    const pim = wingmen.find((w) => w.id === "pim");
    if (pim && pim.alive) shield = Math.min(100, shield + 20);
  }
  const run = {
    rapier,
    world,
    queue,
    byHandle: new Map(),
    entities: [],
    nextId: 1,
    rand,
    mission: mission.id,
    missionDef: mission,
    mode: mission.mode,
    path: mission.mode === "corridor" ? buildPath(opts.seed ^ 0x9e3779b9, mission.length + 200, 36, mission.id === "trench" ? 0.72 : 1) : null,
    s: 0,
    time: 0,
    hits: carry ? carry.hits : 0,
    branch: carry ? carry.branch : null,
    phase: "play",
    outcome: "",
    presented: false,
    attract: !!opts.attract,
    fired: {},
    waveI: 0,
    radio: [],
    radioCurrent: null,
    radioT: 0,
    sfx: [],
    shake: 0,
    wingmen,
    player: {
      x: 0,
      y: 12,
      z: 0,
      yaw: 0,
      pitch: 0,
      rollAngle: 0,
      rollDir: 1,
      rollT: 0,
      rollCd: 0,
      deflecting: false,
      aimX: 0,
      aimY: 0,
      vx: 0,
      vy: 0,
      speed: mission.cruise,
      shield,
      maxShield: 100,
      bombs: carry ? carry.bombs : 3,
      laser: carry ? carry.laser : 1,
      charge: 0,
      wasCharging: false,
      fireHold: 0,
      fireCd: 0,
      bombCd: 0,
      uturnT: 0,
      uturnCd: 0,
      iFrames: 0,
      locks: [],
      lockMeter: new Map(),
      alive: true,
      body: null,
      collider: null,
    },
    barge: null,
    keel: null,
    bossPhase: 0,
    bossTime: 0,
    bossAngle: 0,
    basinKills: 0,
    spawnCd: 1.2,
    bounds: { minX: -170, maxX: 170, minY: -24, maxY: 48, minZ: -170, maxZ: 170 },
    objective: mission.objective,
    target: null,
    speedMode: "cruise",
    rank: "",
    need: mission.citation,
    frame: null,
  };

  const start = mission.mode === "allrange"
    ? { x: 0, y: 10, z: 40 }
    : frameAt(run.path, 0).pos;
  run.player.x = start.x;
  run.player.y = start.y;
  run.player.z = start.z;
  const pbody = world.createRigidBody(
    rapier.RigidBodyDesc.dynamic()
      .setTranslation(start.x, start.y, start.z)
      .lockRotations()
      .setLinearDamping(1.5)
      .setGravityScale(0)
      .setCcdEnabled(true),
  );
  const pcol = world.createCollider(
    rapier.ColliderDesc.ball(1.15)
      .setCollisionGroups(groups(GRP.PLAYER, GRP.ESHOT | GRP.PICKUP | GRP.SOLID))
      .setActiveEvents(rapier.ActiveEvents.COLLISION_EVENTS)
      .setRestitution(0)
      .setFriction(0.4),
    pbody,
  );
  run.player.body = pbody;
  run.player.collider = pcol;
  run.byHandle.set(pcol.handle, { role: "player", team: "player", alive: true });

  for (const wing of wingmen) {
    if (!wing.alive) continue;
    attachWingBody(run, wing);
  }

  if (mission.mode === "allrange") {
    buildArena(run);
  }

  for (const line of mission.lines) say(run, line[0], line[1]);
  if (carry && mission.id !== "glasswake") {
    const pim = wingmen.find((w) => w.id === "pim");
    if (pim && pim.alive) say(run, "Pim", "I patched twenty shield. Do not spend it all at once.");
    else say(run, "Nix", "No patch. Pim is not with us.");
  }
  return run;
}

function attachWingBody(run, wing) {
  const body = run.world.createRigidBody(
    run.rapier.RigidBodyDesc.kinematicPositionBased().setTranslation(wing.x, wing.y, wing.z),
  );
  const col = run.world.createCollider(
    run.rapier.ColliderDesc.ball(1.05)
      .setSensor(false)
      .setCollisionGroups(groups(GRP.WING, GRP.ESHOT))
      .setActiveEvents(run.rapier.ActiveEvents.COLLISION_EVENTS),
    body,
  );
  wing.body = body;
  wing.collider = col;
  run.byHandle.set(col.handle, { role: "wing", wingId: wing.id, team: "ally", alive: true });
}

function buildArena(run) {
  const b = run.bounds;
  const walls = [
    { x: b.minX, y: 10, z: 0, hx: 3, hy: 40, hz: 180 },
    { x: b.maxX, y: 10, z: 0, hx: 3, hy: 40, hz: 180 },
    { x: 0, y: 10, z: b.minZ, hx: 180, hy: 40, hz: 3 },
    { x: 0, y: 10, z: b.maxZ, hx: 180, hy: 40, hz: 3 },
    { x: 0, y: b.minY, z: 0, hx: 180, hy: 3, hz: 180 },
    { x: 0, y: b.maxY, z: 0, hx: 180, hy: 3, hz: 180 },
  ];
  for (const w of walls) {
    const body = run.world.createRigidBody(run.rapier.RigidBodyDesc.fixed().setTranslation(w.x, w.y, w.z));
    const col = run.world.createCollider(
      run.rapier.ColliderDesc.cuboid(w.hx, w.hy, w.hz)
        .setCollisionGroups(groups(GRP.SOLID, GRP.PLAYER | GRP.PSHOT | GRP.ESHOT))
        .setActiveEvents(run.rapier.ActiveEvents.COLLISION_EVENTS),
      body,
    );
    const ent = {
      id: run.nextId++,
      role: "wall",
      kind: "wall",
      team: "neutral",
      alive: true,
      vulnerable: false,
      solid: true,
      hurts: false,
      x: w.x,
      y: w.y,
      z: w.z,
      body,
      collider: col,
      hp: 1,
      radius: 4,
    };
    run.byHandle.set(col.handle, ent);
    run.entities.push(ent);
  }
}

function destroyRun(run) {
  if (!run || run.freed) return;
  run.freed = true;
  try {
    if (run.queue && run.queue.free) run.queue.free();
  } catch (err) {
    /* queue already released */
  }
  try {
    if (run.world && run.world.free) run.world.free();
  } catch (err) {
    /* world already released */
  }
}

function say(run, who, text) {
  if (who !== "Quill" && who !== "Malrec") {
    const wing = run.wingmen.find((w) => w.short === who || w.id === who);
    if (wing && !wing.alive) return;
  }
  run.radio.push({ who, text });
}

function once(run, key, fn) {
  if (run.fired[key]) return;
  run.fired[key] = true;
  fn();
}

function spawnBody(run, ent, desc, colliderDesc) {
  const body = run.world.createRigidBody(desc);
  const col = run.world.createCollider(colliderDesc, body);
  ent.body = body;
  ent.collider = col;
  run.byHandle.set(col.handle, ent);
  run.entities.push(ent);
  return ent;
}

function makeEnemy(run, kind, extra) {
  const def = KIND[kind];
  const ent = {
    id: run.nextId++,
    role: "enemy",
    kind,
    team: "enemy",
    alive: true,
    vulnerable: extra.vulnerable !== false,
    solid: !!def.solid,
    hurts: !!def.solid,
    hp: extra.hp || def.hp,
    maxHp: extra.hp || def.hp,
    radius: def.r,
    x: extra.x || 0,
    y: extra.y || 0,
    z: extra.z || 0,
    s: extra.s || 0,
    localX: extra.localX || 0,
    localY: extra.localY || 0,
    yaw: extra.yaw || 0,
    pitch: 0,
    vx: 0,
    vy: 0,
    vz: 0,
    age: 0,
    fireCd: 0.6 + run.rand() * 0.8,
    fireEvery: def.fire || 0,
    shotDmg: def.shot || 8,
    burst: def.burst || 1,
    burstLeft: 0,
    approach: extra.approach || def.approach || 0,
    drift: extra.drift || 0,
    phase: run.rand() * 6,
    points: extra.points !== false,
    kinematic: !def.solid,
    parent: extra.parent || 0,
    glow: extra.glow || 0,
    warn: false,
    hitFlash: 0,
    dead: false,
  };
  return ent;
}

function addEnemy(run, kind, extra) {
  const ent = makeEnemy(run, kind, extra);
  const R = run.rapier;
  if (ent.solid) {
    spawnBody(
      run,
      ent,
      R.RigidBodyDesc.fixed().setTranslation(ent.x, ent.y, ent.z),
      R.ColliderDesc.ball(ent.radius)
        .setCollisionGroups(groups(GRP.SOLID, GRP.PLAYER | GRP.PSHOT | GRP.ESHOT | GRP.ENEMY))
        .setActiveEvents(R.ActiveEvents.COLLISION_EVENTS),
    );
  } else {
    const member = kind === "engine" || kind === "generator" || kind === "core" || kind === "eye" ? GRP.WEAK : GRP.ENEMY;
    spawnBody(
      run,
      ent,
      R.RigidBodyDesc.kinematicPositionBased().setTranslation(ent.x, ent.y, ent.z),
      R.ColliderDesc.ball(ent.radius)
        .setSensor(false)
        .setCollisionGroups(groups(member, GRP.PSHOT))
        .setActiveEvents(R.ActiveEvents.COLLISION_EVENTS),
    );
  }
  return ent;
}

function placeOnPath(run, ent) {
  const f = frameAt(run.path, ent.s);
  ent.x = f.pos.x + f.right.x * ent.localX + f.up.x * ent.localY;
  ent.y = f.pos.y + f.right.y * ent.localX + f.up.y * ent.localY;
  ent.z = f.pos.z + f.right.z * ent.localX + f.up.z * ent.localY;
  ent.frame = f;
  if (ent.body && ent.kinematic) ent.body.setNextKinematicTranslation({ x: ent.x, y: ent.y, z: ent.z });
  else if (ent.body) ent.body.setTranslation({ x: ent.x, y: ent.y, z: ent.z }, true);
}

function spawnWave(run, wave) {
  if (wave.kind === "pickup") {
    spawnPickupAt(run, wave.gift, run.s + 86, (run.rand() - 0.5) * 8, (run.rand() - 0.5) * 4);
    return;
  }
  if (wave.kind === "barge") {
    spawnBarge(run);
    return;
  }
  if (wave.kind === "bram") {
    spawnHunter(run);
    return;
  }
  if (wave.kind === "nix") {
    spawnAce(run);
    return;
  }
  const n = wave.n || 1;
  for (let i = 0; i < n; i++) {
    const spread = wave.kind === "post" ? 0 : 3.3;
    let lx = (i - (n - 1) / 2) * spread + (run.rand() - 0.5) * 2.4;
    let ly = ((i % 2 === 0) ? 1 : -1) * (2 + run.rand() * 3);
    if (wave.kind === "post") {
      lx = i % 2 === 0 ? -run.missionDef.window.x + 1.2 : run.missionDef.window.x - 1.2;
      ly = (i - 1) * 3;
    }
    if (wave.kind === "asteroid") {
      lx = (run.rand() - 0.5) * run.missionDef.window.x * 1.3;
      ly = (run.rand() - 0.5) * run.missionDef.window.y * 1.2;
    }
    const s = run.s + 96 + i * 10;
    const ent = addEnemy(run, wave.kind, {
      s,
      localX: lx,
      localY: ly,
      approach: wave.approach || 0,
      drift: wave.kind === "dart" ? 1.4 : 0,
    });
    placeOnPath(run, ent);
  }
}

function spawnPickupAt(run, gift, s, lx, ly) {
  const ent = {
    id: run.nextId++,
    role: "pickup",
    kind: "pickup",
    gift,
    team: "neutral",
    alive: true,
    vulnerable: false,
    solid: false,
    hurts: false,
    hp: 1,
    radius: 1.1,
    s,
    localX: lx,
    localY: ly,
    x: 0,
    y: 0,
    z: 0,
    age: 0,
    ttl: 18,
    points: false,
    kinematic: true,
    hitFlash: 0,
    dead: false,
    yaw: 0,
  };
  placeOnPath(run, ent);
  const R = run.rapier;
  spawnBody(
    run,
    ent,
    R.RigidBodyDesc.kinematicPositionBased().setTranslation(ent.x, ent.y, ent.z),
    R.ColliderDesc.ball(1.15)
      .setSensor(true)
      .setCollisionGroups(groups(GRP.PICKUP, GRP.PLAYER))
      .setActiveEvents(R.ActiveEvents.COLLISION_EVENTS),
  );
  return ent;
}

function spawnBarge(run) {
  const s = run.s + 78;
  const barge = addEnemy(run, "barge", { s, localX: 0, localY: 0, vulnerable: false, points: true, hp: 40 });
  placeOnPath(run, barge);
  const left = addEnemy(run, "engine", { s, localX: -7.2, localY: 0.4, parent: barge.id, points: true });
  const right = addEnemy(run, "engine", { s, localX: 7.2, localY: 0.4, parent: barge.id, points: true });
  placeOnPath(run, left);
  placeOnPath(run, right);
  run.barge = { id: barge.id, engines: [left.id, right.id], lead: 78, done: false, destroyed: false, escaped: false, age: 0 };
  say(run, "Pim", "Cinder barge ahead. Break both engines before the gate.");
  say(run, "Nix", "I want that hull in pieces.");
}

function spawnHunter(run) {
  const bram = run.wingmen.find((w) => w.id === "bram");
  if (!bram || !bram.alive) return;
  bram.crisis = true;
  const ent = addEnemy(run, "hunter", {
    s: run.s + 6,
    localX: bram.slot.x + 2.2,
    localY: bram.slot.y,
    points: true,
  });
  placeOnPath(run, ent);
  run.hunterId = ent.id;
  say(run, "Bram", "Hunter on my tail! I cannot shake it!");
  say(run, "Pim", "Cut that hunter off Bram, Quill.");
}

function spawnAce(run) {
  const nix = run.wingmen.find((w) => w.id === "nix");
  if (!nix || !nix.alive) return;
  const ent = addEnemy(run, "ace", {
    s: run.s + 70,
    localX: nix.slot.x,
    localY: nix.slot.y + 2,
    drift: 2.2,
    points: true,
  });
  placeOnPath(run, ent);
  run.aceId = ent.id;
  run.aceTimer = 14;
  say(run, "Nix", "That ace is mine. Cover the rest.");
}

function spawnShot(run, cfg) {
  const ent = {
    id: run.nextId++,
    role: "shot",
    kind: cfg.homing ? "homing" : cfg.pierce ? "charge" : "laser",
    team: cfg.team,
    damage: cfg.damage,
    x: cfg.x,
    y: cfg.y,
    z: cfg.z,
    vx: cfg.vx,
    vy: cfg.vy,
    vz: cfg.vz,
    ttl: cfg.ttl || 1.45,
    age: 0,
    alive: true,
    pierce: !!cfg.pierce,
    targetId: cfg.targetId || 0,
    radius: cfg.radius || 0.38,
    color: cfg.color || (cfg.team === "enemy" ? 0xff5a2a : 0xffe3a2),
    dead: false,
    hitIds: new Set(),
    kinematic: true,
    vulnerable: false,
    solid: false,
    points: false,
    hitFlash: 0,
  };
  const R = run.rapier;
  const member = ent.team === "enemy" ? GRP.ESHOT : GRP.PSHOT;
  const filter = ent.team === "enemy" ? GRP.PLAYER | GRP.WING | GRP.SOLID : GRP.ENEMY | GRP.WEAK | GRP.SOLID;
  spawnBody(
    run,
    ent,
    R.RigidBodyDesc.dynamic().setTranslation(ent.x, ent.y, ent.z).setGravityScale(0).lockRotations().setCcdEnabled(true).setLinvel(ent.vx, ent.vy, ent.vz),
    R.ColliderDesc.ball(ent.radius)
      .setSensor(true)
      .setCollisionGroups(groups(member, filter))
      .setActiveEvents(R.ActiveEvents.COLLISION_EVENTS),
  );
  return ent;
}

function nose(run) {
  const p = run.player;
  if (run.mode === "allrange") {
    const cp = Math.cos(p.pitch);
    return {
      x: Math.sin(p.yaw) * cp,
      y: Math.sin(p.pitch),
      z: Math.cos(p.yaw) * cp,
    };
  }
  const f = run.frame || frameAt(run.path, run.s);
  return f.tangent;
}

function rightDir(run) {
  if (run.mode === "allrange") {
    return { x: Math.cos(run.player.yaw), y: 0, z: -Math.sin(run.player.yaw) };
  }
  const f = run.frame || frameAt(run.path, run.s);
  return f.right;
}

function upDir(run) {
  if (run.mode === "allrange") return { x: 0, y: 1, z: 0 };
  const f = run.frame || frameAt(run.path, run.s);
  return f.up;
}

function fireLasers(run) {
  const p = run.player;
  if (p.fireCd > 0) return;
  p.fireCd = p.laser >= 3 ? 0.075 : 0.12;
  const offsets = p.laser >= 3 ? [-0.95, 0, 0.95] : p.laser === 2 ? [-0.62, 0.62] : [0];
  const dir = nose(run);
  const right = rightDir(run);
  const up = upDir(run);
  for (let i = 0; i < offsets.length; i++) {
    const ox = offsets[i];
    const oy = p.laser >= 3 && i === 1 ? 0.25 : 0;
    spawnShot(run, {
      team: "player",
      damage: p.laser >= 3 ? 9 : 11,
      x: p.x + dir.x * 2.2 + right.x * ox + up.x * oy,
      y: p.y + dir.y * 2.2 + right.y * ox + up.y * oy,
      z: p.z + dir.z * 2.2 + right.z * ox + up.z * oy,
      vx: dir.x * 210,
      vy: dir.y * 210,
      vz: dir.z * 210,
      ttl: 1.15,
      radius: 0.34,
      color: 0xfff0c2,
    });
  }
  run.sfx.push("laser");
}

function releaseCharge(run) {
  const p = run.player;
  const locks = p.locks.filter((id) => {
    const ent = run.entities.find((e) => e.id === id && e.alive);
    return !!ent;
  });
  if (locks.length) {
    const dir = nose(run);
    for (const id of locks) {
      spawnShot(run, {
        team: "player",
        damage: 30,
        homing: true,
        targetId: id,
        x: p.x + dir.x * 2,
        y: p.y + dir.y * 2,
        z: p.z + dir.z * 2,
        vx: dir.x * 90,
        vy: dir.y * 90,
        vz: dir.z * 90,
        ttl: 3.2,
        radius: 0.46,
        color: 0x9af7ff,
      });
    }
    run.sfx.push("homing");
  } else if (p.charge >= 1) {
    const dir = nose(run);
    spawnShot(run, {
      team: "player",
      damage: 52,
      pierce: true,
      x: p.x + dir.x * 2.4,
      y: p.y + dir.y * 2.4,
      z: p.z + dir.z * 2.4,
      vx: dir.x * 250,
      vy: dir.y * 250,
      vz: dir.z * 250,
      ttl: 1.3,
      radius: 0.7,
      color: 0xfff6d0,
    });
    run.sfx.push("charge");
  }
  p.locks = [];
  p.lockMeter.clear();
  p.charge = 0;
}

function considerLocks(run, dt) {
  const p = run.player;
  const maxLocks = p.laser;
  const dir = nose(run);
  for (const ent of run.entities) {
    if (!ent.alive || ent.team !== "enemy" || !ent.vulnerable) continue;
    const dx = ent.x - p.x;
    const dy = ent.y - p.y;
    const dz = ent.z - p.z;
    const dist = Math.hypot(dx, dy, dz);
    if (dist < 6 || dist > 170) continue;
    const dot = (dx * dir.x + dy * dir.y + dz * dir.z) / dist;
    if (dot < 0.965) continue;
    const meter = (p.lockMeter.get(ent.id) || 0) + dt;
    p.lockMeter.set(ent.id, meter);
    if (meter > 0.34 && !p.locks.includes(ent.id) && p.locks.length < maxLocks) {
      p.locks.push(ent.id);
      run.sfx.push("lock");
    }
  }
}

function triggerBomb(run) {
  const p = run.player;
  if (p.bombs <= 0 || p.bombCd > 0) return;
  if (!run.attract) p.bombs -= 1;
  p.bombCd = 0.48;
  const R = run.rapier;
  const ent = {
    id: run.nextId++,
    role: "bomb",
    kind: "bomb",
    team: "player",
    damage: 66,
    alive: true,
    vulnerable: false,
    solid: false,
    x: p.x,
    y: p.y,
    z: p.z,
    ttl: 0.08,
    age: 0,
    radius: 30,
    dead: false,
    points: false,
    kinematic: true,
    hitFlash: 0,
    color: 0xffe08a,
    hitIds: new Set(),
  };
  spawnBody(
    run,
    ent,
    R.RigidBodyDesc.dynamic().setTranslation(p.x, p.y, p.z).setGravityScale(0).lockRotations().setCcdEnabled(true),
    R.ColliderDesc.ball(30)
      .setSensor(true)
      .setCollisionGroups(groups(GRP.PSHOT, GRP.ENEMY | GRP.WEAK | GRP.SOLID))
      .setActiveEvents(R.ActiveEvents.COLLISION_EVENTS),
  );
  for (const other of run.entities) {
    if (other.role === "shot" && other.team === "enemy") {
      const d = Math.hypot(other.x - p.x, other.y - p.y, other.z - p.z);
      if (d < 36) other.dead = true;
    }
  }
  run.sfx.push("bomb");
  run.shake = Math.max(run.shake, 0.7);
}

function wingById(run, id) {
  return run.wingmen.find((w) => w.id === id);
}

function loseWing(run, id, line) {
  const wing = wingById(run, id);
  if (!wing || !wing.alive) return;
  wing.alive = false;
  wing.lost = true;
  wing.shield = 0;
  wing.crisis = false;
  if (wing.collider) run.byHandle.delete(wing.collider.handle);
  if (wing.body) {
    run.world.removeRigidBody(wing.body);
    wing.body = null;
    wing.collider = null;
  }
  say(run, wing.short, line);
  if (id === "bram") say(run, "Pim", "Bram is gone. No more canisters from the wing.");
  if (id === "nix") say(run, "Pim", "Nix peeled off. We are lighter, and lonelier.");
  if (id === "pim") say(run, "Nix", "Pim is out. Watch the rocks yourself.");
}

function hurtWing(run, id, amount) {
  const wing = wingById(run, id);
  if (!wing || !wing.alive) return;
  if (run.attract) {
    wing.shield = Math.max(wing.shield, 36);
    return;
  }
  wing.shield -= amount;
  if (wing.shield <= 0) loseWing(run, id, "I am hit. Falling out!");
}

function hurtPlayer(run, amount) {
  const p = run.player;
  if (run.attract) return;
  if (!p.alive || p.iFrames > 0) return;
  p.shield -= amount;
  p.iFrames = 0.45;
  run.shake = Math.max(run.shake, 0.55);
  run.sfx.push("hurt");
  if (p.shield <= 40 && p.shield + amount > 40) say(run, "Bram", "Shields are paper, Quill.");
  if (p.shield <= 0) {
    p.shield = 0;
    p.alive = false;
    run.phase = "done";
    run.outcome = "fail";
    run.sfx.push("explode");
    say(run, "Pim", "Pull out, Quill. We will reform.");
  }
}

function damageEnt(run, ent, amount, shot) {
  if (!ent || !ent.alive || ent.vulnerable === false) return;
  if (shot) {
    if (shot.hitIds.has(ent.id)) return;
    shot.hitIds.add(ent.id);
  }
  ent.hp -= amount;
  ent.hitFlash = 0.12;
  if (ent.hp <= 0) killEnt(run, ent);
}

function killEnt(run, ent) {
  if (!ent.alive) return;
  ent.alive = false;
  ent.dead = true;
  ent.vulnerable = false;
  if (ent.points) run.hits += 1;
  run.fxKind = ent.kind;
  run.entities.push({
    id: run.nextId++,
    role: "fx",
    kind: ent.solid ? "rockpop" : "burst",
    x: ent.x,
    y: ent.y,
    z: ent.z,
    age: 0,
    ttl: 0.55,
    alive: true,
    dead: false,
    scale: 1,
    team: "fx",
    points: false,
  });
  run.sfx.push(ent.solid ? "rock" : "explode");
  if (ent.kind === "lance" || ent.kind === "heavy" || ent.kind === "fighter") {
    if (run.rand() < 0.22) spawnGiftNear(run, ent, run.rand() < 0.5 ? "shield" : "bomb");
  }
  if (ent.kind === "engine" && run.barge) {
    const left = run.entities.find((e) => e.id === run.barge.engines[0]);
    const right = run.entities.find((e) => e.id === run.barge.engines[1]);
    if ((!left || !left.alive) && (!right || !right.alive)) destroyBarge(run);
  }
  if (ent.kind === "hunter") {
    const bram = wingById(run, "bram");
    if (bram && bram.alive) {
      bram.crisis = false;
      bram.saved = true;
      bram.shield = Math.max(bram.shield, 48);
      say(run, "Bram", "I am clear. I will toss a canister if you get thin.");
    }
  }
  if (ent.kind === "ace") {
    const nix = wingById(run, "nix");
    if (nix && nix.alive) {
      nix.heat = true;
      nix.saved = true;
      say(run, "Nix", "Told you. I will paint the next one.");
    }
  }
  if (ent.kind === "fighter" || ent.kind === "heavy") {
    if (run.mission === "basin") run.basinKills += 1;
  }
  if (ent.kind === "generator") {
    const gens = run.entities.filter((e) => e.kind === "generator" && e.alive);
    if (gens.length === 0) openCore(run);
  }
  if (ent.kind === "core" || ent.kind === "eye") finishBoss(run);
}

function spawnGiftNear(run, ent, gift) {
  if (run.mode === "allrange") {
    const pickup = {
      id: run.nextId++,
      role: "pickup",
      kind: "pickup",
      gift,
      team: "neutral",
      alive: true,
      vulnerable: false,
      solid: false,
      hurts: false,
      hp: 1,
      radius: 1.1,
      x: ent.x,
      y: ent.y,
      z: ent.z,
      age: 0,
      ttl: 16,
      points: false,
      kinematic: true,
      dead: false,
      yaw: 0,
      hitFlash: 0,
    };
    const R = run.rapier;
    spawnBody(
      run,
      pickup,
      R.RigidBodyDesc.kinematicPositionBased().setTranslation(pickup.x, pickup.y, pickup.z),
      R.ColliderDesc.ball(1.15)
        .setSensor(true)
        .setCollisionGroups(groups(GRP.PICKUP, GRP.PLAYER))
        .setActiveEvents(R.ActiveEvents.COLLISION_EVENTS),
    );
    return;
  }
  spawnPickupAt(run, gift, ent.s, ent.localX, ent.localY - 2);
}

function destroyBarge(run) {
  if (!run.barge || run.barge.done) return;
  run.barge.done = true;
  run.barge.destroyed = true;
  run.branch = "basin";
  const hull = run.entities.find((e) => e.id === run.barge.id);
  if (hull && hull.alive) {
    hull.points = true;
    hull.vulnerable = true;
    killEnt(run, hull);
  }
  say(run, "Bram", "Engines are confetti. She is falling into Kitebreak.");
  say(run, "Pim", "Basin is open. All-range from here.");
}

function escapeBarge(run) {
  if (!run.barge || run.barge.done) return;
  run.barge.done = true;
  run.barge.escaped = true;
  run.branch = "trench";
  for (const id of [run.barge.id, ...run.barge.engines]) {
    const ent = run.entities.find((e) => e.id === id);
    if (ent) {
      ent.points = false;
      ent.alive = false;
      ent.dead = true;
    }
  }
  say(run, "Pim", "She made the gate. Longnight Trench, then. Stay sharp.");
  say(run, "Nix", "I hate it when they run.");
}

function openCore(run) {
  run.bossPhase = 2;
  const core = run.entities.find((e) => e.kind === "core");
  if (core) core.vulnerable = true;
  say(run, "Pim", "Shoulder lamps are dark. The chest core is open.");
}

function finishBoss(run) {
  if (run.phase === "done") return;
  const wings = run.wingmen.every((w) => w.alive);
  const need = run.mission === "trench" ? 42 : 46;
  run.need = need;
  run.rank = wings && run.hits >= need ? "citation" : "clear";
  run.phase = "done";
  run.outcome = "success";
  run.sfx.push("fanfare");
  if (run.rank === "citation") say(run, "Pim", "That is a Vesper citation. All three of us, and the count holds.");
  else say(run, "Nix", "Target down. The count is short of a citation, but the Reach is quieter.");
}

function applyPickup(run, ent) {
  const p = run.player;
  if (ent.gift === "shield") {
    p.shield = Math.min(100, p.shield + 34);
    run.sfx.push("pickup");
  } else if (ent.gift === "laser") {
    if (p.laser < 3) p.laser += 1;
    run.sfx.push("upgrade");
    say(run, "Bram", p.laser >= 3 ? "Hyper lattice. That is the top rung." : "Laser lattice upgraded.");
  } else if (ent.gift === "bomb") {
    p.bombs = Math.min(5, p.bombs + 1);
    run.sfx.push("pickup");
  }
  ent.dead = true;
  ent.alive = false;
}

function resolveHit(run, a, b) {
  const pair = [a, b];
  const shot = pair.find((e) => e && e.role === "shot");
  const bomb = pair.find((e) => e && e.role === "bomb");
  const other = pair.find((e) => e && e !== shot && e !== bomb);
  if (bomb && other && other.team === "enemy") {
    damageEnt(run, other, bomb.damage, bomb);
    return;
  }
  if (shot && other) {
    if (shot.team === "player" || shot.team === "ally") {
      if (other.kind === "eye" && !other.vulnerable) {
        shot.dead = true;
        return;
      }
      if (other.team === "enemy" && other.vulnerable) {
        damageEnt(run, other, shot.damage, shot);
        if (!shot.pierce) shot.dead = true;
      } else if (other.solid && other.hp) {
        damageEnt(run, other, shot.damage, shot);
        shot.dead = true;
      }
      return;
    }
    if (shot.team === "enemy") {
      if (other.role === "player") {
        if (run.player.deflecting) {
          shot.team = "player";
          shot.damage = 18;
          shot.vx *= -1.1;
          shot.vy *= -1.1;
          shot.vz *= -1.1;
          shot.color = 0xbff7ff;
          shot.ttl = Math.max(shot.ttl, 0.8);
          if (shot.collider) {
            shot.collider.setCollisionGroups(groups(GRP.PSHOT, GRP.ENEMY | GRP.WEAK | GRP.SOLID));
          }
          run.sfx.push("ting");
          run.player.deflectFlash = 0.18;
        } else {
          hurtPlayer(run, shot.damage);
          shot.dead = true;
        }
      } else if (other.role === "wing") {
        hurtWing(run, other.wingId, shot.damage);
        shot.dead = true;
      } else if (other.solid) {
        shot.dead = true;
      }
    }
    return;
  }
  const playerHit = pair.find((e) => e && e.role === "player");
  const solid = pair.find((e) => e && e.hurts);
  if (playerHit && solid) bumpSolid(run, solid);
  const pickup = pair.find((e) => e && e.role === "pickup");
  if (playerHit && pickup) applyPickup(run, pickup);
}

function bumpSolid(run, solid) {
  if (solid.bumpCd > 0) return;
  solid.bumpCd = 0.55;
  hurtPlayer(run, 12);
  if (solid.alive && solid.hp) damageEnt(run, solid, 8, null);
}

function shootFrom(run, ent, target, speed, damage) {
  const dx = target.x - ent.x;
  const dy = target.y - ent.y;
  const dz = target.z - ent.z;
  const len = Math.hypot(dx, dy, dz) || 1;
  spawnShot(run, {
    team: "enemy",
    damage,
    x: ent.x + (dx / len) * (ent.radius + 0.8),
    y: ent.y + (dy / len) * (ent.radius + 0.8),
    z: ent.z + (dz / len) * (ent.radius + 0.8),
    vx: (dx / len) * speed,
    vy: (dy / len) * speed,
    vz: (dz / len) * speed,
    ttl: 3.4,
    radius: 0.42,
    color: 0xff5a2a,
  });
}

function pickEnemyTarget(run) {
  const options = [{ x: run.player.x, y: run.player.y, z: run.player.z, wing: false }];
  if (run.rand() < 0.34) {
    const living = run.wingmen.filter((w) => w.alive);
    if (living.length) {
      const w = living[Math.floor(run.rand() * living.length)];
      options.push({ x: w.x, y: w.y, z: w.z, wing: true });
    }
  }
  return options[options.length - 1].wing && run.rand() < 0.7 ? options[1] : options[0];
}

function updateCorridorEnemy(run, ent, dt) {
  ent.age += dt;
  if (run.attract && ent.kind === "hunter" && ent.age > 7) {
    killEnt(run, ent);
    return;
  }
  if (ent.approach) ent.s -= ent.approach * dt;
  if (ent.drift) {
    ent.localX += Math.sin(ent.age * ent.drift + ent.phase) * 5 * dt;
    ent.localY += Math.cos(ent.age * 0.8 * ent.drift + ent.phase) * 2.4 * dt;
  }
  if (ent.kind === "hunter") {
    const bram = wingById(run, "bram");
    if (bram && bram.alive) {
      ent.s = run.s + 5;
      ent.localX = bram.slot.x + 2.1;
      ent.localY = bram.slot.y + 0.4;
      if (!run.attract) bram.shield -= 13 * dt;
      if (bram.shield <= 0) loseWing(run, "bram", "The hunter had me. Go.");
    } else {
      ent.dead = true;
    }
  }
  placeOnPath(run, ent);
  if (ent.fireEvery && ent.alive && ent.kind !== "asteroid" && ent.kind !== "barge" && ent.kind !== "engine") {
    ent.fireCd -= dt;
    if (ent.burstLeft > 0) {
      ent.burstLeft -= dt;
      if (ent.fireCd <= 0) {
        ent.fireCd = 0.12;
        shootFrom(run, ent, pickEnemyTarget(run), 52, ent.shotDmg);
        ent.burstLeft -= 0.12;
      }
    } else if (ent.fireCd <= 0 && ent.s < run.s + 150 && ent.s > run.s - 8) {
      ent.fireCd = ent.fireEvery;
      if (ent.burst > 1) ent.burstLeft = 0.12 * ent.burst;
      shootFrom(run, ent, pickEnemyTarget(run), ent.kind === "post" ? 58 : 50, ent.shotDmg);
    }
  }
  if (ent.kind !== "hunter" && ent.kind !== "barge" && ent.kind !== "engine" && ent.s < run.s - 36) ent.dead = true;
}

function updateBarge(run, dt) {
  if (!run.barge || run.barge.done) return;
  run.barge.age += dt;
  const cruise = run.missionDef.cruise;
  if (run.player.speed < cruise - 4) run.barge.lead += 18 * dt;
  else if (run.player.speed > cruise + 6) run.barge.lead -= 24 * dt;
  run.barge.lead = clamp(run.barge.lead, 30, 150);
  const s = run.s + run.barge.lead;
  for (const id of [run.barge.id, ...run.barge.engines]) {
    const ent = run.entities.find((e) => e.id === id);
    if (!ent || !ent.alive) continue;
    ent.s = s;
    placeOnPath(run, ent);
  }
  if (run.s >= run.missionDef.gate) escapeBarge(run);
  if (run.attract && run.barge.age > 11 && !run.barge.done) {
    for (const id of run.barge.engines) {
      const ent = run.entities.find((e) => e.id === id && e.alive);
      if (ent) killEnt(run, ent);
    }
  }
}

function updateAce(run, dt) {
  if (!run.aceId) return;
  const ace = run.entities.find((e) => e.id === run.aceId);
  const nix = wingById(run, "nix");
  if (!ace || !ace.alive) return;
  run.aceTimer -= dt;
  if (run.attract && ace.age > 8) {
    killEnt(run, ace);
    return;
  }
  if (run.aceTimer <= 0 && ace.alive) {
    if (nix && nix.alive && !nix.heat) loseWing(run, "nix", "Still on them. Do not follow.");
    ace.points = false;
    ace.alive = false;
    ace.dead = true;
  }
}

function updateFighters(run, dt) {
  for (const ent of run.entities) {
    if (!ent.alive || (ent.kind !== "fighter" && ent.kind !== "heavy")) continue;
    const dx = run.player.x - ent.x;
    const dy = run.player.y - ent.y;
    const dz = run.player.z - ent.z;
    const dist = Math.hypot(dx, dy, dz) || 1;
    const desired = Math.atan2(dx, dz);
    ent.yaw += clamp(angDiff(desired, ent.yaw), -1.6 * dt, 1.6 * dt);
    const speed = ent.kind === "heavy" ? 18 : 28;
    const cy = Math.cos(ent.pitch || 0);
    ent.x += Math.sin(ent.yaw) * cy * speed * dt;
    ent.y += clamp(dy / dist, -0.6, 0.6) * speed * dt;
    ent.z += Math.cos(ent.yaw) * cy * speed * dt;
    ent.y = clamp(ent.y, run.bounds.minY + 8, run.bounds.maxY - 8);
    ent.x = clamp(ent.x, run.bounds.minX + 10, run.bounds.maxX - 10);
    ent.z = clamp(ent.z, run.bounds.minZ + 10, run.bounds.maxZ - 10);
    if (ent.body) ent.body.setNextKinematicTranslation({ x: ent.x, y: ent.y, z: ent.z });
    ent.fireCd -= dt;
    if (ent.fireCd <= 0 && dist < 120) {
      ent.fireCd = ent.fireEvery;
      shootFrom(run, ent, pickEnemyTarget(run), 46, ent.shotDmg);
    }
  }
}

function spawnFighter(run, kind) {
  const ang = run.rand() * Math.PI * 2;
  const rad = 90 + run.rand() * 50;
  const ent = addEnemy(run, kind, {
    x: Math.cos(ang) * rad,
    y: 8 + run.rand() * 16,
    z: Math.sin(ang) * rad,
    yaw: ang + Math.PI,
    points: true,
  });
  ent.kinematic = true;
  return ent;
}

function spawnSile(run) {
  if (run.bossPhase) return;
  run.bossPhase = 1;
  run.bossAngle = 0;
  const boss = addEnemy(run, "sile", { x: 70, y: 14, z: 0, vulnerable: false, points: false, hp: 80 });
  const left = addEnemy(run, "generator", { x: 64, y: 16, z: 6, parent: boss.id, points: true });
  const right = addEnemy(run, "generator", { x: 64, y: 16, z: -6, parent: boss.id, points: true });
  const core = addEnemy(run, "core", { x: 70, y: 14, z: 0, parent: boss.id, points: true, vulnerable: false, hp: 230 });
  run.sile = { id: boss.id, gens: [left.id, right.id], core: core.id };
  say(run, "Pim", "Warden Sile. Lamps on the shoulders, then the core.");
  say(run, "Nix", "Finally, something with a silhouette.");
}

function updateSile(run, dt) {
  if (!run.sile) return;
  const boss = run.entities.find((e) => e.id === run.sile.id);
  if (!boss) return;
  run.bossAngle += dt * (run.bossPhase === 2 ? 0.85 : 0.42);
  const rad = run.bossPhase === 2 ? 36 : 74;
  let x = Math.sin(run.bossAngle) * rad;
  let z = Math.cos(run.bossAngle) * rad;
  const y = 12 + Math.sin(run.time * 1.3) * 5;
  if (run.bossPhase === 2) {
    x = lerp(x, run.player.x, 0.45);
    z = lerp(z, run.player.z, 0.45);
  }
  boss.x = x;
  boss.y = y;
  boss.z = z;
  boss.yaw = Math.atan2(run.player.x - x, run.player.z - z);
  const rx = Math.cos(boss.yaw);
  const rz = -Math.sin(boss.yaw);
  const parts = [
    [run.sile.gens[0], -1],
    [run.sile.gens[1], 1],
  ];
  for (const [id, side] of parts) {
    const ent = run.entities.find((e) => e.id === id);
    if (!ent || !ent.alive) continue;
    ent.x = x + rx * 7 * side;
    ent.y = y + 1.4;
    ent.z = z + rz * 7 * side;
    if (ent.body) ent.body.setNextKinematicTranslation({ x: ent.x, y: ent.y, z: ent.z });
  }
  const core = run.entities.find((e) => e.id === run.sile.core);
  if (core && core.alive) {
    core.x = x + Math.sin(boss.yaw) * 1.2;
    core.y = y;
    core.z = z + Math.cos(boss.yaw) * 1.2;
    core.glow = core.vulnerable ? 1 : 0.15;
    if (core.body) core.body.setNextKinematicTranslation({ x: core.x, y: core.y, z: core.z });
  }
  if (boss.body) boss.body.setNextKinematicTranslation({ x: boss.x, y: boss.y, z: boss.z });
  boss.age += dt;
  boss.fireCd -= dt;
  if (boss.fireCd <= 0) {
    boss.fireCd = run.bossPhase === 2 ? 0.85 : 1.25;
    const spread = [-0.18, 0, 0.18];
    for (const off of spread) {
      const yaw = boss.yaw + off;
      shootFrom(
        run,
        boss,
        {
          x: boss.x + Math.sin(yaw) * 40,
          y: run.player.y,
          z: boss.z + Math.cos(yaw) * 40,
        },
        42,
        11,
      );
    }
  }
}

function enterKeel(run) {
  if (run.keel) return;
  run.mode = "strafe";
  run.s = Math.max(0, run.missionDef.length - 30);
  const s = run.s + 78;
  const keel = addEnemy(run, "keel", { s, localX: 0, localY: 0, vulnerable: false, points: false, hp: 80 });
  const eye = addEnemy(run, "eye", { s: s - 2, localX: 0, localY: 1.2, vulnerable: false, points: true, hp: 210 });
  const plateL = addEnemy(run, "plate", { s: s - 1, localX: -8, localY: 0, points: true });
  const plateR = addEnemy(run, "plate", { s: s - 1, localX: 8, localY: 0, points: true });
  placeOnPath(run, keel);
  placeOnPath(run, eye);
  placeOnPath(run, plateL);
  placeOnPath(run, plateR);
  run.keel = { id: keel.id, eye: eye.id, plates: [plateL.id, plateR.id], t: 0, open: false, telegraph: false };
  say(run, "Pim", "The Keel. Do not waste shots while the eye is shut.");
}

function updateKeel(run, dt) {
  if (!run.keel) return;
  run.keel.t += dt;
  const u = run.keel.t % 6.4;
  const open = u > 1.15 && u < 3.9;
  const telegraph = u > 0.25 && u <= 1.15;
  if (open && !run.keel.open) run.sfx.push("telegraph");
  run.keel.open = open;
  run.keel.telegraph = telegraph;
  const eye = run.entities.find((e) => e.id === run.keel.eye);
  if (eye && eye.alive) {
    eye.vulnerable = open;
    eye.glow = open ? 1 : telegraph ? 0.55 : 0.12;
  }
  if (u > 1.15 && u < 1.15 + dt + 0.02 && eye && eye.alive) {
    shootFrom(run, eye, { x: run.player.x, y: run.player.y, z: run.player.z }, 40, 16);
  }
  if (Math.floor(run.keel.t / 8) !== Math.floor((run.keel.t - dt) / 8)) {
    for (let i = 0; i < 2; i++) {
      const ent = addEnemy(run, "dart", {
        s: run.s + 40,
        localX: i === 0 ? -6 : 6,
        localY: i === 0 ? 2 : -2,
        approach: 16,
        points: true,
      });
      placeOnPath(run, ent);
    }
  }
}

function updateWingmen(run, dt) {
  const p = run.player;
  let forward = nose(run);
  let right = rightDir(run);
  for (const wing of run.wingmen) {
    if (!wing.alive) continue;
    if (run.mode === "allrange") {
      wing.x = p.x + right.x * wing.slot.x - forward.x * 9;
      wing.y = p.y + wing.slot.y * 0.6;
      wing.z = p.z + right.z * wing.slot.x - forward.z * 9;
      wing.yaw = p.yaw;
    } else {
      const f = frameAt(run.path, Math.max(0, run.s - 10));
      wing.x = f.pos.x + f.right.x * wing.slot.x + f.up.x * wing.slot.y;
      wing.y = f.pos.y + f.right.y * wing.slot.x + f.up.y * wing.slot.y;
      wing.z = f.pos.z + f.right.z * wing.slot.x + f.up.z * wing.slot.y;
      wing.frame = f;
    }
    if (wing.body) wing.body.setNextKinematicTranslation({ x: wing.x, y: wing.y, z: wing.z });
    if (!wing.crisis && wing.shield < wing.maxShield) wing.shield = Math.min(wing.maxShield, wing.shield + 3.2 * dt);
    wing.cd -= dt;
    if (wing.cd <= 0) {
      const target = nearestEnemy(run, wing, 160);
      if (target) {
        const rate = wing.id === "nix" && wing.heat ? 0.28 : wing.id === "nix" ? 0.5 : wing.id === "pim" ? 0.85 : 1.05;
        wing.cd = rate;
        const dx = target.x - wing.x;
        const dy = target.y - wing.y;
        const dz = target.z - wing.z;
        const len = Math.hypot(dx, dy, dz) || 1;
        spawnShot(run, {
          team: "ally",
          damage: wing.heat ? 12 : 8,
          x: wing.x + (dx / len) * 2,
          y: wing.y + (dy / len) * 2,
          z: wing.z + (dz / len) * 2,
          vx: (dx / len) * 150,
          vy: (dy / len) * 150,
          vz: (dz / len) * 150,
          ttl: 1.4,
          radius: 0.32,
          color: wing.color,
        });
      } else wing.cd = 0.25;
    }
    if (wing.id === "bram" && wing.alive && !wing.crisis && wing.dropsLeft > 0 && p.shield < 48) {
      wing.dropCd -= dt;
      if (wing.dropCd <= 0) {
        wing.dropCd = 13;
        wing.dropsLeft -= 1;
        if (run.mode === "allrange") spawnGiftNear(run, { x: p.x, y: p.y, z: p.z - 6, s: run.s, localX: 0, localY: -3 }, "shield");
        else spawnPickupAt(run, "shield", run.s + 40, wing.slot.x * 0.3, 0);
        say(run, "Bram", "Canister loose. Catch it.");
      }
    }
  }
}

function nearestEnemy(run, from, maxDist) {
  let best = null;
  let bestD = maxDist;
  for (const ent of run.entities) {
    if (!ent.alive || ent.team !== "enemy" || ent.vulnerable === false) continue;
    const d = Math.hypot(ent.x - from.x, ent.y - from.y, ent.z - from.z);
    if (d < bestD) {
      bestD = d;
      best = ent;
    }
  }
  return best;
}

function updateShots(run, dt) {
  for (const ent of run.entities) {
    if (!ent.alive || ent.role !== "shot") continue;
    ent.age += dt;
    ent.ttl -= dt;
    if (ent.ttl <= 0) {
      ent.dead = true;
      continue;
    }
    if (ent.kind === "homing" && ent.targetId) {
      const target = run.entities.find((e) => e.id === ent.targetId && e.alive);
      if (target) {
        const dx = target.x - ent.x;
        const dy = target.y - ent.y;
        const dz = target.z - ent.z;
        const len = Math.hypot(dx, dy, dz) || 1;
        ent.vx = lerp(ent.vx, (dx / len) * 130, 1 - Math.pow(0.001, dt));
        ent.vy = lerp(ent.vy, (dy / len) * 130, 1 - Math.pow(0.001, dt));
        ent.vz = lerp(ent.vz, (dz / len) * 130, 1 - Math.pow(0.001, dt));
      }
    }
    if (ent.body) ent.body.setLinvel({ x: ent.vx, y: ent.vy, z: ent.vz }, true);
  }
}

function updateFx(run, dt) {
  for (const ent of run.entities) {
    if (ent.role !== "fx" && ent.role !== "bomb" && ent.role !== "pickup") continue;
    ent.age += dt;
    if (ent.ttl && ent.age > ent.ttl) ent.dead = true;
    if (ent.role === "fx") ent.scale = 1 + ent.age * 8;
    if (ent.role === "pickup" && ent.kinematic && run.mode !== "allrange" && run.path) placeOnPath(run, ent);
  }
}

function refreshHud(run) {
  let target = null;
  if (run.mission === "glasswake" && run.barge && !run.barge.done) {
    const engines = run.barge.engines.map((id) => run.entities.find((e) => e.id === id)).filter((e) => e && e.alive);
    const hp = engines.reduce((sum, e) => sum + e.hp, 0);
    const max = engines.reduce((sum, e) => sum + e.maxHp, 0) || 1;
    target = { name: "BARGE ENGINES", hp, max, show: true };
    run.objective = "BREAK BOTH BARGE ENGINES";
  } else if (run.mission === "glasswake" && run.branch === "basin") {
    run.objective = "BARGE DOWN — KITEBREAK AHEAD";
  } else if (run.mission === "glasswake" && run.branch === "trench") {
    run.objective = "BARGE FLED — LONGNIGHT AHEAD";
  } else if (run.mission === "basin" && run.bossPhase === 0) {
    run.objective = "CLEAR THE BASIN";
  } else if (run.mission === "basin" && run.bossPhase === 1) {
    const gens = run.entities.filter((e) => e.kind === "generator" && e.alive);
    const hp = gens.reduce((sum, e) => sum + e.hp, 0);
    const max = gens.reduce((sum, e) => sum + e.maxHp, 0) || 1;
    target = { name: "SHOULDER LAMPS", hp, max, show: true };
    run.objective = "BREAK SILE'S SHOULDER LAMPS";
  } else if (run.mission === "basin" && run.bossPhase === 2) {
    const core = run.entities.find((e) => e.kind === "core" && e.alive);
    if (core) target = { name: "WARDEN SILE CORE", hp: core.hp, max: core.maxHp, show: true };
    run.objective = "DESTROY THE OPEN CORE";
  } else if (run.mission === "trench" && run.mode !== "strafe") {
    run.objective = "PURSUE THROUGH LONGNIGHT";
  } else if (run.keel) {
    const eye = run.entities.find((e) => e.id === run.keel.eye && e.alive);
    if (eye) target = { name: run.keel.open ? "KEEL EYE" : "KEEL SEALED", hp: eye.hp, max: eye.maxHp, show: true };
    run.objective = run.keel.open ? "EYE OPEN — HIT THE KEEL" : run.keel.telegraph ? "KEEL EYE IS WARMING" : "WAIT FOR THE EYE";
  }
  run.target = target;
  const pim = wingById(run, "pim");
  for (const ent of run.entities) {
    ent.warn = false;
    if (ent.kind === "asteroid" && ent.alive && pim && pim.alive && run.mode !== "allrange") {
      const ahead = ent.s - run.s;
      if (ahead > 0 && ahead < 150) ent.warn = true;
    }
    if (ent.hitFlash > 0) ent.hitFlash -= 0.016;
    if (ent.bumpCd > 0) ent.bumpCd -= 0.016;
  }
}

function endCorridor(run) {
  if (run.mission !== "glasswake") return;
  if (!run.branch) {
    if (run.barge && !run.barge.done) escapeBarge(run);
    else run.branch = "trench";
  }
  run.phase = "done";
  run.outcome = "branch";
}

function stepRun(run, actions, dt) {
  if (!run || run.freed || run.phase === "done") return;
  dt = clamp(dt, 0.001, 0.033);
  run.time += dt;
  const p = run.player;
  if (run.attract) {
    p.shield = 100;
    p.alive = true;
    p.bombs = Math.max(p.bombs, 3);
    p.laser = 3;
    for (const wing of run.wingmen) {
      if (wing.alive) wing.shield = Math.max(wing.shield, 40);
    }
  }
  p.fireCd = Math.max(0, p.fireCd - dt);
  p.bombCd = Math.max(0, p.bombCd - dt);
  p.rollCd = Math.max(0, p.rollCd - dt);
  p.uturnCd = Math.max(0, p.uturnCd - dt);
  p.iFrames = Math.max(0, p.iFrames - dt);
  if (p.deflectFlash > 0) p.deflectFlash -= dt;
  run.shake = Math.max(0, run.shake - dt * 1.4);

  if (actions.roll && p.rollT <= 0 && p.rollCd <= 0) {
    p.rollT = 0.56;
    p.rollCd = 0.2;
    p.rollDir = actions.rollDir || (actions.moveX < 0 ? -1 : 1);
    run.sfx.push("roll");
  }
  if (p.rollT > 0) {
    p.rollT -= dt;
    const u = 1 - Math.max(0, p.rollT) / 0.56;
    p.rollAngle = p.rollDir * u * Math.PI * 2;
    p.deflecting = u > 0.1 && u < 0.74;
  } else {
    p.rollAngle = lerp(p.rollAngle, 0, Math.min(1, dt * 8));
    p.deflecting = false;
  }

  if (run.mode === "allrange") {
    if (actions.uturn && p.uturnT <= 0 && p.uturnCd <= 0) {
      p.uturnT = 0.64;
      p.uturnCd = 0.9;
      run.sfx.push("uturn");
    }
    if (p.uturnT > 0) {
      const slice = Math.min(dt, p.uturnT);
      p.yaw += (Math.PI / 0.64) * slice;
      p.uturnT -= dt;
      p.pitch = lerp(p.pitch, 0, Math.min(1, dt * 4));
    } else {
      p.yaw += actions.moveX * 1.75 * dt;
      p.pitch = clamp(p.pitch + actions.moveY * 1.15 * dt, -0.9, 0.9);
    }
    const throttle = actions.boost && !actions.brake ? 76 : actions.brake && !actions.boost ? 18 : 48;
    p.speed = throttle;
    run.speedMode = actions.boost && !actions.brake ? "boost" : actions.brake && !actions.boost ? "brake" : "cruise";
    const cp = Math.cos(p.pitch);
    let vx = Math.sin(p.yaw) * cp * throttle;
    let vy = Math.sin(p.pitch) * throttle;
    let vz = Math.cos(p.yaw) * cp * throttle;
    const b = run.bounds;
    if (p.x < b.minX + 14) vx += 50;
    if (p.x > b.maxX - 14) vx -= 50;
    if (p.z < b.minZ + 14) vz += 50;
    if (p.z > b.maxZ - 14) vz -= 50;
    if (p.y < b.minY + 10) vy += 40;
    if (p.y > b.maxY - 10) vy -= 40;
    p.body.setLinvel({ x: vx, y: vy, z: vz }, true);
  } else {
    const cruise = run.missionDef.cruise;
    let spd = cruise;
    if (actions.boost && !actions.brake) spd = cruise * 1.46;
    else if (actions.brake && !actions.boost) spd = cruise * 0.56;
    p.speed = spd;
    run.speedMode = spd > cruise + 2 ? "boost" : spd < cruise - 2 ? "brake" : "cruise";
    if (run.mode === "corridor") run.s += spd * dt;
    const win = run.missionDef.window;
    const steer = run.mode === "strafe" && actions.boost ? 34 : 28;
    p.aimX = clamp(p.aimX + actions.moveX * steer * dt, -win.x, win.x);
    p.aimY = clamp(p.aimY + actions.moveY * 22 * dt, -win.y, win.y);
    run.frame = frameAt(run.path, run.s);
    const f = run.frame;
    const desX = f.pos.x + f.right.x * p.aimX + f.up.x * p.aimY;
    const desY = f.pos.y + f.right.y * p.aimX + f.up.y * p.aimY;
    const desZ = f.pos.z + f.right.z * p.aimX + f.up.z * p.aimY;
    const cur = p.body.translation();
    let vx = (desX - cur.x) / dt;
    let vy = (desY - cur.y) / dt;
    let vz = (desZ - cur.z) / dt;
    const mag = Math.hypot(vx, vy, vz);
    if (mag > 260) {
      const k = 260 / mag;
      vx *= k;
      vy *= k;
      vz *= k;
    }
    p.body.setLinvel({ x: vx, y: vy, z: vz }, true);
  }

  const wantCharge = actions.charge || (actions.fire && p.fireHold > 0.22);
  if (actions.fire || actions.charge) p.fireHold += dt;
  else p.fireHold = 0;
  if (wantCharge) {
    p.charge = Math.min(1, p.charge + dt / 0.62);
    considerLocks(run, dt);
    p.wasCharging = true;
  } else {
    if (p.wasCharging) releaseCharge(run);
    p.wasCharging = false;
    if (actions.fire) fireLasers(run);
  }
  if (actions.bomb) triggerBomb(run);

  if (run.mode !== "allrange") {
    const waves = run.missionDef.waves;
    while (run.waveI < waves.length && run.s >= waves[run.waveI].s) {
      spawnWave(run, waves[run.waveI]);
      run.waveI += 1;
    }
    updateBarge(run, dt);
    updateAce(run, dt);
    for (const ent of run.entities) {
      if (!ent.alive || ent.team !== "enemy") continue;
      if (ent.kind === "fighter" || ent.kind === "heavy" && run.mode === "allrange") continue;
      if (!ent.s && ent.kind !== "hunter") continue;
      if (run.path && ent.kinematic && ent.kind !== "sile") updateCorridorEnemy(run, ent, dt);
    }
    if (run.mission === "trench" && run.mode === "corridor" && run.s >= run.missionDef.length - 40) enterKeel(run);
    if (run.mode === "strafe") updateKeel(run, dt);
    if (run.mission === "glasswake" && run.mode === "corridor" && run.s >= run.missionDef.length) endCorridor(run);
  } else {
    updateFighters(run, dt);
    run.spawnCd -= dt;
    const aliveFighters = run.entities.filter((e) => e.alive && (e.kind === "fighter" || e.kind === "heavy")).length;
    if (run.bossPhase === 0 && run.spawnCd <= 0 && aliveFighters < 4 && run.basinKills < 8) {
      run.spawnCd = 2.2;
      spawnFighter(run, run.rand() < 0.25 ? "heavy" : "fighter");
    }
    if (run.bossPhase === 0 && (run.basinKills >= 8 || run.time > 48 || (run.attract && run.time > 18))) spawnSile(run);
    if (run.bossPhase) updateSile(run, dt);
  }

  updateWingmen(run, dt);
  updateShots(run, dt);
  updateFx(run, dt);

  run.world.timestep = dt;
  run.world.step(run.queue);
  run.queue.drainCollisionEvents((h1, h2, started) => {
    if (!started) return;
    const a = run.byHandle.get(h1);
    const b = run.byHandle.get(h2);
    if (!a || !b) return;
    resolveHit(run, a, b);
  });

  const after = p.body.translation();
  p.x = after.x;
  p.y = after.y;
  p.z = after.z;
  for (const ent of run.entities) {
    if (!ent.alive || !ent.body || ent.role === "wall") continue;
    if (ent.role === "shot" || ent.role === "player") {
      const t = ent.body.translation();
      ent.x = t.x;
      ent.y = t.y;
      ent.z = t.z;
    }
  }

  if (run.radioT > 0) run.radioT -= dt;
  else if (run.radio.length) {
    run.radioCurrent = run.radio.shift();
    run.radioT = Math.max(1.7, Math.min(4.2, run.radioCurrent.text.length * 0.048));
    run.sfx.push("radio");
  }
  if (run.radioT <= 0 && !run.radio.length) {
    /* keep last line until the next one replaces it */
  }

  for (const ent of run.entities) {
    if (ent.dead && ent.body) {
      if (ent.collider) run.byHandle.delete(ent.collider.handle);
      run.world.removeRigidBody(ent.body);
      ent.body = null;
      ent.collider = null;
    }
  }
  run.entities = run.entities.filter((e) => !e.dead);
  refreshHud(run);
  if (run.attract && run.time > 150 && run.phase !== "done") {
    run.phase = "done";
    run.outcome = run.mission === "glasswake" ? "branch" : "success";
    if (!run.branch) run.branch = "basin";
    run.rank = "clear";
  }
}

function attractActions(run) {
  const actions = emptyActions();
  const p = run.player;
  const pulse = run.time % 0.16;
  actions.fire = pulse < 0.1;
  actions.charge = false;
  let target = null;
  const prefer = ["hunter", "ace", "engine", "core", "generator", "eye", "plate", "lance", "heavy", "fighter", "post", "dart", "asteroid"];
  let bestScore = 1e9;
  for (const ent of run.entities) {
    if (!ent.alive || ent.team !== "enemy" || ent.vulnerable === false) continue;
    const rank = prefer.indexOf(ent.kind);
    const bias = rank < 0 ? 20 : rank;
    let score = bias * 40;
    if (run.mode === "allrange") {
      const dx = ent.x - p.x;
      const dz = ent.z - p.z;
      const desired = Math.atan2(dx, dz);
      score += Math.abs(angDiff(desired, p.yaw)) * 20 + Math.hypot(dx, ent.y - p.y, dz) * 0.02;
    } else {
      score += Math.abs((ent.localX || 0) - p.aimX) + Math.abs((ent.localY || 0) - p.aimY) + Math.max(0, (ent.s || 0) - run.s) * 0.01;
    }
    if (score < bestScore) {
      bestScore = score;
      target = ent;
    }
  }
  if (run.mode === "allrange") {
    if (target) {
      const desired = Math.atan2(target.x - p.x, target.z - p.z);
      const diff = angDiff(desired, p.yaw);
      if (Math.abs(diff) > 2.4) actions.uturn = true;
      actions.moveX = clamp(diff * 1.4, -1, 1);
      actions.moveY = clamp((target.y - p.y) * 0.06, -1, 1);
    }
    actions.boost = true;
  } else if (target) {
    const dx = (target.localX || 0) - p.aimX;
    const dy = (target.localY || 0) - p.aimY;
    actions.moveX = clamp(dx / 5, -1, 1);
    actions.moveY = clamp(dy / 5, -1, 1);
    actions.boost = !!(run.barge && !run.barge.done);
  }
  for (const ent of run.entities) {
    if (ent.role !== "shot" || ent.team !== "enemy") continue;
    const dz = run.mode === "allrange" ? Math.hypot(ent.x - p.x, ent.z - p.z) : (ent.s ? ent.s - run.s : ent.z - p.z);
    if (run.mode !== "allrange") {
      if (ent.s && ent.s < run.s + 28 && Math.abs(ent.localX - p.aimX) < 3 && Math.abs(ent.localY - p.aimY) < 2.4) {
        actions.moveX = p.aimX > 0 ? -1 : 1;
        actions.roll = true;
        actions.rollDir = actions.moveX;
      }
    } else if (Math.hypot(ent.x - p.x, ent.y - p.y, ent.z - p.z) < 10) {
      actions.roll = true;
      actions.moveX = p.x > ent.x ? 1 : -1;
    }
    if (dz < 0) {
      /* shot is behind */
    }
  }
  const crowd = run.entities.filter((e) => e.alive && e.team === "enemy" && Math.hypot(e.x - p.x, e.y - p.y, e.z - p.z) < 36).length;
  if (crowd >= 4 || (run.time % 9 > 8.2 && crowd >= 2)) actions.bomb = true;
  const chargeWindow = run.time % 6.5;
  if (chargeWindow > 5.15 && chargeWindow < 5.95) {
    actions.fire = true;
    actions.charge = true;
  }
  if (chargeWindow >= 5.95 && chargeWindow < 6.15) {
    actions.fire = false;
    actions.charge = false;
  }
  return actions;
}

function createInput() {
  const keys = new Set();
  const tapped = new Set();
  let dirty = false;
  const mouse = { x: innerWidth * 0.5, y: innerHeight * 0.5, left: false, right: false, mid: false, moved: false };
  const levels = new Map();
  const menuNext = new Map();
  let tapDir = 0;
  let tapTime = 0;
  let prevStick = 0;
  let queued = "";

  function mark() {
    dirty = true;
  }

  addEventListener("keydown", (e) => {
    keys.add(e.code);
    if (!e.repeat) tapped.add(e.code);
    mark();
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Tab", "Enter"].includes(e.code)) e.preventDefault();
  });
  addEventListener("keyup", (e) => keys.delete(e.code));
  addEventListener("mousedown", (e) => {
    mark();
    if (e.button === 0) mouse.left = true;
    if (e.button === 1) {
      mouse.mid = true;
      e.preventDefault();
    }
    if (e.button === 2) mouse.right = true;
  });
  addEventListener("mouseup", (e) => {
    if (e.button === 0) mouse.left = false;
    if (e.button === 1) mouse.mid = false;
    if (e.button === 2) mouse.right = false;
  });
  addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    if (Math.abs(e.movementX) + Math.abs(e.movementY) > 2) {
      mouse.moved = true;
      mark();
    }
  });
  addEventListener("wheel", () => mark(), { passive: true });
  addEventListener("contextmenu", (e) => e.preventDefault());
  addEventListener("blur", () => {
    keys.clear();
    mouse.left = false;
    mouse.right = false;
    mouse.mid = false;
  });

  function padState() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let pad = null;
    for (const candidate of pads) {
      if (candidate && candidate.connected) {
        pad = candidate;
        break;
      }
    }
    if (!pad) {
      return {
        x: 0, y: 0, r2: false, l2: false, l1: false, r1: false,
        cross: false, circle: false, square: false, triangle: false,
        options: false, up: false, down: false, left: false, right: false,
        used: false,
      };
    }
    const ax = (i) => pad.axes[i] || 0;
    const btn = (i) => !!(pad.buttons[i] && (pad.buttons[i].pressed || pad.buttons[i].value > 0.45));
    let x = ax(0);
    let y = -ax(1);
    const rx = ax(2);
    const ry = -ax(3);
    if (Math.hypot(rx, ry) > Math.hypot(x, y)) {
      x = rx;
      y = ry;
    }
    const used = pad.buttons.some((b) => b && (b.pressed || b.value > 0.45)) || Math.hypot(x, y) > 0.35;
    if (used) mark();
    return {
      x, y,
      r2: btn(7),
      l2: btn(6),
      l1: btn(4),
      r1: btn(5),
      cross: btn(0),
      circle: btn(1),
      square: btn(2),
      triangle: btn(3),
      options: btn(9),
      up: btn(12),
      down: btn(13),
      left: btn(14),
      right: btn(15),
      used,
    };
  }

  function consumeTap(code) {
    const had = tapped.has(code);
    tapped.delete(code);
    return had;
  }

  function edge(name, down) {
    const was = levels.get(name) === true;
    levels.set(name, down);
    return down && !was;
  }

  function pulse(name, active) {
    const now = performance.now();
    if (!active) {
      menuNext.delete(name);
      return false;
    }
    const due = menuNext.get(name) || 0;
    if (!due) {
      menuNext.set(name, now + 430);
      return true;
    }
    if (now >= due) {
      menuNext.set(name, now + 170);
      return true;
    }
    return false;
  }

  function queueClick(id) {
    queued = id;
    mark();
  }

  function snapshot(playing) {
    const pad = padState();
    let moveX = pad.x;
    let moveY = pad.y;
    if (Math.abs(moveX) < 0.22 && Math.abs(moveY) < 0.22) {
      if (keys.has("KeyA") || keys.has("ArrowLeft")) moveX -= 1;
      if (keys.has("KeyD") || keys.has("ArrowRight")) moveX += 1;
      if (keys.has("KeyW") || keys.has("ArrowUp")) moveY += 1;
      if (keys.has("KeyS") || keys.has("ArrowDown")) moveY -= 1;
    }
    if (playing && Math.abs(moveX) < 0.22 && Math.abs(moveY) < 0.22) {
      const ox = (mouse.x - innerWidth * 0.5) / (innerWidth * 0.3);
      const oy = (innerHeight * 0.5 - mouse.y) / (innerHeight * 0.3);
      if (mouse.moved || mouse.left || mouse.right) {
        moveX = ox;
        moveY = oy;
      }
    }
    if (Math.abs(moveX) < 0.18) moveX = 0;
    if (Math.abs(moveY) < 0.18) moveY = 0;
    moveX = Math.max(-1, Math.min(1, moveX));
    moveY = Math.max(-1, Math.min(1, moveY));

    const fireLevel = pad.r2 || pad.cross || keys.has("Space") || keys.has("KeyJ") || (playing && mouse.left);
    const chargeLevel = keys.has("KeyK") || keys.has("KeyF") || (playing && mouse.right);
    const boost = pad.l1 || keys.has("ShiftLeft") || keys.has("ShiftRight");
    const brake = pad.l2 || keys.has("ControlLeft") || keys.has("ControlRight");
    const rollBtn = edge("roll", pad.square || keys.has("KeyE"));
    const uturn = edge("uturn", pad.triangle || keys.has("KeyR"));
    const bomb = edge("bomb", pad.r1 || keys.has("KeyQ") || mouse.mid);
    const confirm = edge("confirm", (!playing && (pad.cross || mouse.left))) || (!playing && (consumeTap("Enter") || consumeTap("Space")));
    const back = edge("back", !playing && (pad.circle || mouse.right)) || (!playing && (consumeTap("Backspace") || consumeTap("Escape")));
    const pause = edge("pause", playing && pad.options) || (playing && consumeTap("Escape"));

    let roll = rollBtn;
    let rollDir = moveX < 0 ? -1 : 1;
    const dir = moveX > 0.78 ? 1 : moveX < -0.78 ? -1 : 0;
    const now = performance.now();
    if (playing && dir !== 0 && prevStick === 0) {
      if (tapDir === dir && now - tapTime < 280) {
        roll = true;
        rollDir = dir;
        tapDir = 0;
      } else {
        tapDir = dir;
        tapTime = now;
      }
    }
    if (dir === 0) prevStick = 0;
    else prevStick = dir;

    const click = queued;
    queued = "";
    const any = dirty || pad.used || !!click;
    dirty = false;
    mouse.moved = false;

    return {
      moveX,
      moveY,
      fire: playing && fireLevel,
      charge: playing && chargeLevel,
      bomb: playing && bomb,
      boost: playing && boost,
      brake: playing && brake,
      roll: playing && roll,
      rollDir,
      uturn: playing && uturn,
      confirm: confirm || !!click,
      back,
      pause,
      menuUp: pulse("up", pad.up || moveY > 0.55),
      menuDown: pulse("down", pad.down || moveY < -0.55),
      menuLeft: pulse("left", pad.left || moveX < -0.55),
      menuRight: pulse("right", pad.right || moveX > 0.55),
      click,
      any,
      pad: pad.used,
    };
  }

  return { snapshot, queueClick };
}

function createAudio() {
  let ctx = null;
  let master = null;
  let musicGain = null;
  let sfxGain = null;
  let noise = null;
  let mode = "title";
  let nextNote = 0;
  let step = 0;
  let volumes = { music: 0.7, sfx: 0.85 };
  const last = new Map();

  const SONGS = {
    title: {
      step: 0.22,
      bass: [110, 110, 82.41, 110, 98, 110, 82.41, 73.42],
      lead: [329.63, 392, 440, 523.25, 440, 392, 329.63, 293.66],
    },
    corridor: {
      step: 0.16,
      bass: [110, 110, 164.81, 110, 130.81, 110, 82.41, 98],
      lead: [440, 523.25, 659.25, 587.33, 523.25, 440, 392, 349.23],
    },
    allrange: {
      step: 0.18,
      bass: [87.31, 110, 130.81, 110, 87.31, 98, 110, 73.42],
      lead: [349.23, 440, 523.25, 698.46, 659.25, 523.25, 440, 392],
    },
    boss: {
      step: 0.14,
      bass: [77.78, 77.78, 103.83, 77.78, 92.5, 69.3, 77.78, 61.74],
      lead: [311.13, 369.99, 415.3, 466.16, 415.3, 369.99, 311.13, 277.18],
    },
    results: {
      step: 0.24,
      bass: [130.81, 164.81, 196, 164.81],
      lead: [523.25, 659.25, 783.99, 659.25],
    },
  };

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.9;
    musicGain = ctx.createGain();
    sfxGain = ctx.createGain();
    musicGain.gain.value = volumes.music * 0.22;
    sfxGain.gain.value = volumes.sfx;
    musicGain.connect(master);
    sfxGain.connect(master);
    master.connect(ctx.destination);
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const data = noise.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    return ctx;
  }

  function resume() {
    const audio = ensure();
    if (audio && audio.state === "suspended") audio.resume();
  }

  function setVolumes(next) {
    volumes = next;
    if (!musicGain) return;
    musicGain.gain.value = volumes.music * 0.22;
    sfxGain.gain.value = volumes.sfx;
  }

  function setMusic(next) {
    if (SONGS[next] && next !== mode) {
      mode = next;
      step = 0;
    }
  }

  function envGain(at, dur, peak) {
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.001, peak), at + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    return gain;
  }

  function tone(at, freq, dur, type, peak, slide) {
    if (!ctx) return;
    const osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, at);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slide), at + dur);
    const gain = envGain(at, dur, peak * volumes.sfx);
    osc.connect(gain);
    gain.connect(sfxGain);
    osc.start(at);
    osc.stop(at + dur + 0.02);
  }

  function burst(at, dur, peak, freq) {
    if (!ctx || !noise) return;
    const src = ctx.createBufferSource();
    src.buffer = noise;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(freq || 800, at);
    filter.frequency.exponentialRampToValueAtTime(120, at + dur);
    const gain = envGain(at, dur, peak * volumes.sfx);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(sfxGain);
    src.start(at);
    src.stop(at + dur + 0.02);
  }

  function blip(name) {
    if (!ctx) return;
    const now = ctx.currentTime;
    const gap = name === "laser" || name === "enemyShot" ? 0.045 : 0.03;
    const prev = last.get(name) || 0;
    if (now - prev < gap) return;
    last.set(name, now);
    if (name === "laser") tone(now, 740, 0.07, "square", 0.08, 180);
    else if (name === "charge") tone(now, 220, 0.22, "sawtooth", 0.1, 880);
    else if (name === "homing") tone(now, 880, 0.16, "sine", 0.08, 1400);
    else if (name === "bomb") burst(now, 0.42, 0.35, 900);
    else if (name === "hurt") {
      tone(now, 130, 0.14, "sawtooth", 0.12, 60);
      burst(now, 0.12, 0.15, 400);
    }
    else if (name === "explode") burst(now, 0.36, 0.28, 700);
    else if (name === "rock") burst(now, 0.16, 0.16, 500);
    else if (name === "pickup") {
      tone(now, 523.25, 0.08, "triangle", 0.08);
      tone(now + 0.07, 783.99, 0.12, "triangle", 0.08);
    }
    else if (name === "upgrade") {
      tone(now, 523.25, 0.08, "square", 0.06);
      tone(now + 0.08, 659.25, 0.08, "square", 0.06);
      tone(now + 0.16, 880, 0.16, "square", 0.07);
    }
    else if (name === "roll") burst(now, 0.18, 0.12, 1400);
    else if (name === "ting") tone(now, 1480, 0.07, "square", 0.07);
    else if (name === "radio") burst(now, 0.04, 0.08, 1800);
    else if (name === "ui") tone(now, 660, 0.045, "sine", 0.06);
    else if (name === "lock") tone(now, 990, 0.06, "sine", 0.06);
    else if (name === "uturn") tone(now, 90, 0.18, "sawtooth", 0.08, 40);
    else if (name === "telegraph") tone(now, 70, 0.25, "sawtooth", 0.1, 140);
    else if (name === "fanfare") {
      tone(now, 523.25, 0.12, "triangle", 0.08);
      tone(now + 0.12, 659.25, 0.12, "triangle", 0.08);
      tone(now + 0.24, 783.99, 0.14, "triangle", 0.08);
      tone(now + 0.4, 1046.5, 0.28, "triangle", 0.09);
    }
  }

  function update() {
    if (!ctx || ctx.state !== "running") return;
    const song = SONGS[mode] || SONGS.title;
    while (nextNote < ctx.currentTime + 0.28) {
      const bass = song.bass[step % song.bass.length];
      const lead = song.lead[step % song.lead.length];
      const osc = ctx.createOscillator();
      osc.type = "square";
      osc.frequency.setValueAtTime(bass, nextNote);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, nextNote);
      gain.gain.exponentialRampToValueAtTime(0.05, nextNote + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, nextNote + song.step * 0.9);
      osc.connect(gain);
      gain.connect(musicGain);
      osc.start(nextNote);
      osc.stop(nextNote + song.step);
      if (step % 2 === 0) {
        const leadOsc = ctx.createOscillator();
        leadOsc.type = "triangle";
        leadOsc.frequency.setValueAtTime(lead, nextNote);
        const leadGain = ctx.createGain();
        leadGain.gain.setValueAtTime(0.0001, nextNote);
        leadGain.gain.exponentialRampToValueAtTime(0.04, nextNote + 0.03);
        leadGain.gain.exponentialRampToValueAtTime(0.0001, nextNote + song.step * 1.6);
        leadOsc.connect(leadGain);
        leadGain.connect(musicGain);
        leadOsc.start(nextNote);
        leadOsc.stop(nextNote + song.step * 1.7);
      }
      nextNote += song.step;
      step += 1;
    }
  }

  return { ensure, resume, blip, setMusic, setVolumes, update };
}

function createView(THREE, renderer) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x123a72);
  scene.fog = null;

  const camera = new THREE.PerspectiveCamera(50, 1, 0.12, 6000);
  camera.position.set(0, 22, -28);

  const gradient = makeGradient(THREE);
  const outlineMat = new THREE.MeshBasicMaterial({ color: 0x140810, side: THREE.BackSide });
  const toonCache = new Map();

  function toon(color) {
    const cached = toonCache.get(color);
    if (cached) return cached;
    const mat = new THREE.MeshToonMaterial({
      color,
      gradientMap: gradient,
      emissive: color === 0xf4e2c4 ? 0xf4e2c4 : 0x000000,
      emissiveIntensity: color === 0xf4e2c4 ? 0.55 : 0,
    });
    toonCache.set(color, mat);
    return mat;
  }

  const hemi = new THREE.HemisphereLight(0xc7d4ff, 0x2a1020, 1.1);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1d2, 2.6);
  sun.position.set(40, 90, 20);
  sun.castShadow = false;
  scene.add(sun);
  scene.add(sun.target);
  renderer.shadowMap.enabled = false;
  const engineLight = new THREE.PointLight(0xffb25a, 0, 40, 2);
  engineLight.visible = false;
  scene.add(engineLight);

  const sky = makeSolidSky(THREE);
  scene.add(sky);
  const dress = makeCornerDress(THREE);
  scene.add(dress);
  scene.add(camera);

  const decor = new THREE.Group();
  scene.add(decor);
  const actors = new THREE.Group();
  scene.add(actors);
  const titleGroup = new THREE.Group();
  scene.add(titleGroup);

  const meshes = new Map();
  const titleShips = [];
  for (let i = 0; i < 4; i++) {
    const colors = [0xf4e2c4, 0x3ddec8, 0xe85aa0, 0xe2b14a];
    const accents = [0xffb25a, 0x8ef6e4, 0xff8ab8, 0xffd36a];
    const ship = makeKite(THREE, toon, outlineMat, colors[i], accents[i]);
    ship.traverse((obj) => { obj.frustumCulled = false; });
    titleGroup.add(ship);
    titleShips.push(ship);
  }
  const preview = showcasePath();
  let decorKey = "";
  let shadows = false;
  renderer.shadowMap.enabled = false;

  let lookDot = 0;
  let meshDebug = null;
  let frameTris = 0;
  const camPos = new THREE.Vector3();
  const look = new THREE.Vector3();
  const desiredCam = new THREE.Vector3();
  const desiredLook = new THREE.Vector3();
  const basis = new THREE.Matrix4();
  const ax = new THREE.Vector3();
  const ay = new THREE.Vector3();
  const az = new THREE.Vector3();
  const scratch = new THREE.Vector3();

  function buildDecor(key, path) {
    const token = key + ":" + (path ? Math.round(path.total) : 0);
    if (token === decorKey) return;
    decorKey = token;
    decor.clear();
    if (key === "basin") {
      const floor = new THREE.Mesh(new THREE.TorusGeometry(90, 8, 8, 28), toon(0x8a4b3a));
      floor.rotation.x = Math.PI / 2;
      floor.position.y = -18;
      floor.receiveShadow = false;
      floor.frustumCulled = false;
      decor.add(floor);
      const inner = new THREE.Mesh(new THREE.TorusGeometry(48, 3, 6, 20), toon(0xd7a15a));
      inner.rotation.x = Math.PI / 2;
      inner.position.y = -16;
      decor.add(inner);
      const pillar = new THREE.CylinderGeometry(2.2, 3.2, 28, 6);
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        const mesh = new THREE.Mesh(pillar, toon(i % 2 ? 0x6a4a78 : 0x4e3a58));
        mesh.position.set(Math.cos(a) * 120, 0, Math.sin(a) * 120);
        mesh.castShadow = false;
        mesh.receiveShadow = false;
        mesh.frustumCulled = false;
        decor.add(mesh);
        const cap = new THREE.Mesh(new THREE.OctahedronGeometry(4, 0), toon(0xe2b14a));
        cap.position.set(mesh.position.x, 16, mesh.position.z);
        decor.add(cap);
      }
      const sunBall = new THREE.Mesh(new THREE.SphereGeometry(18, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffc27a }));
      sunBall.position.set(-80, 70, -140);
      decor.add(sunBall);
      return;
    }
    const canyon = path || preview;
    const rockA = toon(key === "trench" ? 0x3c3450 : 0xb07a52);
    const rockB = toon(key === "trench" ? 0x2a2838 : 0x6e5344);
    const geo = new THREE.DodecahedronGeometry(1, 0);
    const count = Math.floor(canyon.pts.length * 2);
    const meshA = new THREE.InstancedMesh(geo, rockA, count);
    const meshB = new THREE.InstancedMesh(geo, rockB, count);
    meshA.castShadow = false;
    meshA.receiveShadow = false;
    meshB.castShadow = false;
    meshB.receiveShadow = false;
    meshA.frustumCulled = false;
    meshB.frustumCulled = false;
    const dummy = new THREE.Object3D();
    let ia = 0;
    let ib = 0;
    for (let i = 0; i < canyon.pts.length; i += 4) {
      const s = (i / (canyon.pts.length - 1)) * canyon.total;
      const f = frameAt(canyon, s);
      for (const side of [-1, 1]) {
        const dist = 9 + ((i * 17 + side) % 5);
        const lift = ((i * 5) % 7) - 2;
        dummy.position.set(
          f.pos.x + f.right.x * dist * side + f.up.x * lift,
          f.pos.y + f.right.y * dist * side + f.up.y * lift,
          f.pos.z + f.right.z * dist * side + f.up.z * lift,
        );
        const sc = 4 + (i % 5) * 1.3;
        dummy.scale.set(sc, sc * 0.8, sc * 1.2);
        dummy.rotation.set(i, side, i * 0.3);
        dummy.updateMatrix();
        if (side < 0) meshA.setMatrixAt(ia++, dummy.matrix);
        else meshB.setMatrixAt(ib++, dummy.matrix);
      }
    }
    meshA.count = ia;
    meshB.count = ib;
    meshA.instanceMatrix.needsUpdate = true;
    meshB.instanceMatrix.needsUpdate = true;
    decor.add(meshA);
    decor.add(meshB);
    const block = new THREE.BoxGeometry(1, 1, 1);
    const floor = new THREE.InstancedMesh(block, toon(0xd4894a), canyon.pts.length);
    const wallL = new THREE.InstancedMesh(block, toon(0x6a8f3a), canyon.pts.length);
    const wallR = new THREE.InstancedMesh(block, toon(0xa34b3a), canyon.pts.length);
    for (const mesh of [floor, wallL, wallR]) {
      mesh.frustumCulled = false;
      mesh.castShadow = false;
      mesh.receiveShadow = false;
      decor.add(mesh);
    }
    const stamp = (mesh, index, f, ox, oy, oz, sx, sy, sz) => {
      dummy.position.set(
        f.pos.x + f.right.x * ox + f.up.x * oy + f.tangent.x * oz,
        f.pos.y + f.right.y * ox + f.up.y * oy + f.tangent.y * oz,
        f.pos.z + f.right.z * ox + f.up.z * oy + f.tangent.z * oz,
      );
      dummy.scale.set(sx, sy, sz);
      basis.makeBasis(
        ax.set(f.right.x, f.right.y, f.right.z),
        ay.set(f.up.x, f.up.y, f.up.z),
        az.set(f.tangent.x, f.tangent.y, f.tangent.z),
      );
      dummy.quaternion.setFromRotationMatrix(basis);
      dummy.updateMatrix();
      mesh.setMatrixAt(index, dummy.matrix);
    };
    for (let i = 0; i < canyon.pts.length; i++) {
      const s = (i / Math.max(1, canyon.pts.length - 1)) * canyon.total;
      const f = frameAt(canyon, s);
      stamp(floor, i, f, 0, -7.2, 0, 46, 3.4, 48);
      stamp(wallL, i, f, -17, 6, 0, 5.5, 36, 48);
      stamp(wallR, i, f, 17, 6, 0, 5.5, 36, 48);
    }
    floor.instanceMatrix.needsUpdate = true;
    wallL.instanceMatrix.needsUpdate = true;
    wallR.instanceMatrix.needsUpdate = true;
    const archGeo = new THREE.TorusGeometry(16, 1.1, 6, 10, Math.PI);
    for (let i = 4; i < canyon.pts.length; i += 16) {
      const s = (i / (canyon.pts.length - 1)) * canyon.total;
      const f = frameAt(canyon, s);
      const arch = new THREE.Mesh(archGeo, toon(0xf0c27a));
      arch.frustumCulled = false;
      arch.position.set(f.pos.x, f.pos.y, f.pos.z);
      basis.makeBasis(
        ax.set(f.right.x, f.right.y, f.right.z),
        ay.set(f.up.x, f.up.y, f.up.z),
        az.set(f.tangent.x, f.tangent.y, f.tangent.z),
      );
      arch.quaternion.setFromRotationMatrix(basis);
      arch.rotateX(Math.PI);
      decor.add(arch);
    }
    const sunBall = new THREE.Mesh(new THREE.SphereGeometry(26, 18, 12), new THREE.MeshBasicMaterial({ color: 0xffb26a }));
    sunBall.position.set(120, 160, 400);
    decor.add(sunBall);
  }

  function acquire(ent) {
    let mesh = meshes.get(ent.id);
    if (mesh) return mesh;
    mesh = makeActor(THREE, toon, outlineMat, ent);
    mesh.frustumCulled = false;
    mesh.traverse((obj) => { obj.frustumCulled = false; });
    actors.add(mesh);
    meshes.set(ent.id, mesh);
    return mesh;
  }

  function renderTitle(time) {
    titleGroup.visible = true;
    dress.visible = false;
    sky.visible = true;
    decor.visible = true;
    buildDecor("title", preview);
    const s = (time * 70) % preview.total;
    const f = frameAt(preview, s);
    const slots = [
      { x: 0, y: 0 },
      { x: -7, y: -2 },
      { x: 7, y: -1 },
      { x: -3, y: 3.5 },
    ];
    titleShips.forEach((ship, i) => {
      const slot = slots[i];
      ship.position.set(
        f.pos.x + f.right.x * slot.x + f.up.x * slot.y,
        f.pos.y + f.right.y * slot.x + f.up.y * slot.y,
        f.pos.z + f.right.z * slot.x + f.up.z * slot.y,
      );
      basis.makeBasis(
        ax.set(f.right.x, f.right.y, f.right.z),
        ay.set(f.up.x, f.up.y, f.up.z),
        az.set(f.tangent.x, f.tangent.y, f.tangent.z),
      );
      ship.quaternion.setFromRotationMatrix(basis);
      ship.rotateZ(Math.sin(time * 2 + i) * 0.08);
    });
    desiredCam.set(
      f.pos.x - f.tangent.x * 20 + f.up.x * 5,
      f.pos.y - f.tangent.y * 20 + f.up.y * 5,
      f.pos.z - f.tangent.z * 20 + f.up.z * 5,
    );
    desiredLook.set(
      f.pos.x + f.tangent.x * 30,
      f.pos.y + f.tangent.y * 30 + 1,
      f.pos.z + f.tangent.z * 30,
    );
    if (camPos.lengthSq() < 1) camPos.copy(desiredCam);
    camPos.lerp(desiredCam, 0.08);
    look.lerp(desiredLook, 0.08);
    camera.position.copy(camPos);
    camera.up.set(f.up.x, f.up.y, f.up.z);
    camera.lookAt(look);
    syncSky(camera, sky);
    placeDress(camera, dress);
    sun.position.set(camera.position.x + 40, camera.position.y + 80, camera.position.z + 10);
    sun.target.position.copy(look);
  }

  function syncRun(run, shakeOn) {
    titleGroup.visible = false;
    dress.visible = false;
    sky.visible = true;
    decor.visible = true;
    actors.visible = true;
    if (run.mission === "basin") buildDecor("basin", null);
    else if (run.mission === "trench" && run.path) buildDecor("trench", run.path);
    else if (run.path) buildDecor("glass", run.path);
    const seen = new Set();
    for (const ent of run.entities) {
      if (ent.role === "wall") continue;
      if (!ent.alive && ent.role !== "fx") continue;
      const mesh = acquire(ent);
      mesh.visible = true;
      mesh.position.set(ent.x, ent.y, ent.z);
      if (ent.kind === "homing" || ent.kind === "laser" || ent.kind === "charge") {
        scratch.set(ent.x + ent.vx, ent.y + ent.vy, ent.z + ent.vz);
        mesh.lookAt(scratch);
        mesh.rotateY(Math.PI);
        const len = ent.kind === "charge" ? 4.2 : ent.kind === "homing" ? 1.6 : 2.2;
        mesh.scale.set(1, 1, len);
      } else if (ent.yaw !== undefined && run.mode === "allrange" && ent.team === "enemy") {
        mesh.rotation.set(0, ent.yaw, 0);
      } else if (ent.frame) {
        const f = ent.frame;
        basis.makeBasis(
          ax.set(f.right.x, f.right.y, f.right.z),
          ay.set(f.up.x, f.up.y, f.up.z),
          az.set(f.tangent.x, f.tangent.y, f.tangent.z),
        );
        mesh.quaternion.setFromRotationMatrix(basis);
      }
      if (ent.role === "fx") {
        const u = ent.age / ent.ttl;
        mesh.scale.setScalar(0.4 + u * (ent.kind === "rockpop" ? 4 : 7));
        mesh.traverse((child) => {
          if (child.material && child.material.transparent) child.material.opacity = 1 - u;
        });
      }
      if (ent.role === "pickup") mesh.rotation.y += 0.08;
      const ring = mesh.getObjectByName("warn");
      if (ring) ring.visible = !!ent.warn;
      seen.add(ent.id);
    }
    const playerMesh = acquire({ id: "player", kind: "player", team: "player" });
    seen.add("player");
    for (const wing of run.wingmen) {
      acquire({ id: "wing-" + wing.id, kind: wing.id, team: "ally" });
      seen.add("wing-" + wing.id);
    }
    for (const [id, mesh] of meshes) {
      if (!seen.has(id)) {
        actors.remove(mesh);
        meshes.delete(id);
      }
    }
    playerMesh.visible = run.player.alive;
    playerMesh.scale.setScalar(2.4);
    playerMesh.position.set(run.player.x, run.player.y, run.player.z);
