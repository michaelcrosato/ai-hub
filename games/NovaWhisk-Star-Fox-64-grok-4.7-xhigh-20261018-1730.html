    if (run.mode === "allrange") {
      const cp = Math.cos(run.player.pitch);
      const fx = Math.sin(run.player.yaw) * cp;
      const fy = Math.sin(run.player.pitch);
      const fz = Math.cos(run.player.yaw) * cp;
      const rx = Math.cos(run.player.yaw);
      const rz = -Math.sin(run.player.yaw);
      const ux = fy * rz;
      const uy = fz * rx - fx * rz;
      const uz = -fy * rx;
      basis.makeBasis(ax.set(rx, 0, rz), ay.set(ux, uy, uz), az.set(fx, fy, fz));
      playerMesh.quaternion.setFromRotationMatrix(basis);
      playerMesh.rotateZ(run.player.rollAngle);
    } else if (run.frame) {
      const f = run.frame;
      basis.makeBasis(
        ax.set(f.right.x, f.right.y, f.right.z),
        ay.set(f.up.x, f.up.y, f.up.z),
        az.set(f.tangent.x, f.tangent.y, f.tangent.z),
      );
      playerMesh.quaternion.setFromRotationMatrix(basis);
      playerMesh.rotateZ(run.player.rollAngle - run.player.aimX * 0.04);
    }
    seen.add("player");
    run.wingmen.forEach((wing) => {
      const mesh = acquire({ id: "wing-" + wing.id, kind: wing.id, team: "ally" });
      mesh.visible = wing.alive;
      mesh.scale.setScalar(1.45);
      mesh.position.set(wing.x, wing.y, wing.z);
      seen.add("wing-" + wing.id);
      if (run.mode === "allrange") mesh.rotation.set(0, wing.yaw || run.player.yaw, 0);
      else if (wing.frame || run.frame) {
        const f = wing.frame || run.frame;
        basis.makeBasis(
          ax.set(f.right.x, f.right.y, f.right.z),
          ay.set(f.up.x, f.up.y, f.up.z),
          az.set(f.tangent.x, f.tangent.y, f.tangent.z),
        );
        mesh.quaternion.setFromRotationMatrix(basis);
      }
    });
    const ahead = run.mode === "allrange"
      ? {
          x: Math.sin(run.player.yaw) * Math.cos(run.player.pitch),
          y: Math.sin(run.player.pitch),
          z: Math.cos(run.player.yaw) * Math.cos(run.player.pitch),
        }
      : run.frame.tangent;
    const up = run.mode === "allrange" ? { x: 0, y: 1, z: 0 } : run.frame.up;
    desiredCam.set(
      run.player.x - ahead.x * 12 + up.x * 2.1,
      run.player.y - ahead.y * 12 + up.y * 2.1,
      run.player.z - ahead.z * 12 + up.z * 2.1,
    );
    desiredLook.set(run.player.x, run.player.y + 0.15, run.player.z);
    camPos.lerp(desiredCam, 0.18);
    look.lerp(desiredLook, 0.22);
    const shake = shakeOn ? run.shake : 0;
    camera.position.set(
      camPos.x + Math.sin(run.time * 40) * shake * 0.35,
      camPos.y + Math.cos(run.time * 33) * shake * 0.25,
      camPos.z,
    );
    camera.up.set(up.x, up.y, up.z);
    camera.lookAt(look);
    camera.updateMatrixWorld(true);
    const gaze = new THREE.Vector3();
    camera.getWorldDirection(gaze);
    const toward = new THREE.Vector3(run.player.x, run.player.y, run.player.z).sub(camera.position);
    const span = toward.length() || 1;
    lookDot = gaze.dot(toward.multiplyScalar(1 / span));
    let bad = 0;
    for (const ent of run.entities) {
      if (!Number.isFinite(ent.x) || !Number.isFinite(ent.y) || !Number.isFinite(ent.z)) bad += 1;
    }
    meshDebug = {
      vis: playerMesh.visible,
      kids: playerMesh.children.length,
      ents: run.entities.length,
      bad,
      actors: actors.children.length,
    };
    syncSky(camera, sky);
    sun.position.set(camera.position.x + 36, camera.position.y + 70, camera.position.z + 12);
    sun.target.position.copy(look);
    engineLight.position.set(run.player.x, run.player.y, run.player.z);
    engineLight.intensity = 6 + Math.sin(run.time * 30) * 1.5 + run.shake * 10;
  }

  function project(x, y, z) {
    scratch.set(x, y, z).project(camera);
    return {
      x: (scratch.x * 0.5 + 0.5) * renderer.domElement.width,
      y: (-scratch.y * 0.5 + 0.5) * renderer.domElement.height,
      behind: scratch.z > 1,
    };
  }

  async function draw() {
    try {
      await renderer.renderAsync(scene, camera);
      frameTris = renderer.info.render.triangles | 0;
    } catch (err) {
      if (shadows) {
        shadows = false;
        renderer.shadowMap.enabled = false;
        scene.traverse((obj) => {
          obj.castShadow = false;
          obj.receiveShadow = false;
        });
        renderer.render(scene, camera);
      } else {
        throw err;
      }
    }
  }

  return { scene, camera, sky, renderTitle, syncRun, draw, project, get lookDot() { return lookDot; }, get meshDebug() { return meshDebug; }, get frameTris() { return frameTris; }, resize(w, h) {
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
  } };
}

function makeGradient(THREE) {
  const data = new Uint8Array([
    42, 36, 58, 255,
    118, 104, 142, 255,
    196, 176, 154, 255,
    255, 246, 230, 255,
  ]);
  const tex = new THREE.DataTexture(data, 4, 1);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.colorSpace = THREE.NoColorSpace;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

function makeSolidSky(THREE) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(3800, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0x3a1860, side: THREE.BackSide, depthWrite: false }),
  );
  mesh.frustumCulled = false;
  mesh.renderOrder = -1;
  return mesh;
}

function makeSky(THREE) {
  const canvas = document.createElement("canvas");
  canvas.width = 4;
  canvas.height = 64;
  const ctx = canvas.getContext("2d");
  const bands = ["#140824", "#5a2478", "#e07a3a", "#7a2a48", "#1c1030"];
  bands.forEach((color, index) => {
    ctx.fillStyle = color;
    ctx.fillRect(0, index * 12, 4, 14);
  });
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.NoColorSpace;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearFilter;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(4000, 24, 16),
    new THREE.MeshBasicMaterial({ map: tex, color: 0xffffff, side: THREE.BackSide, depthWrite: false }),
  );
  mesh.frustumCulled = false;
  mesh.renderOrder = -1;
  return mesh;
}

function syncSky(camera, sky) {
  sky.position.copy(camera.position);
}

function paintSkyTexture(THREE, sky) {
  const canvas = document.createElement("canvas");
  canvas.width = 4;
  canvas.height = 128;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0, "#1a0b30");
  grad.addColorStop(0.35, "#6a2c86");
  grad.addColorStop(0.58, "#e07a3a");
  grad.addColorStop(0.78, "#8a3050");
  grad.addColorStop(1, "#140820");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 4, 128);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearFilter;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  sky.material.map = tex;
  sky.material.needsUpdate = true;
  return sky;
}

function makeCornerDress(THREE) {
  const group = new THREE.Group();
  const specs = [
    [-7.2, 3.4, 0xff7a32, 2.4],
    [7.4, 3.2, 0x3ddec8, 2.1],
    [-8.1, -3.1, 0xe2b14a, 2.8],
    [7.6, -3.4, 0xe85aa0, 2.3],
    [0, 4.6, 0xfff1c2, 1.4],
  ];
  for (const [x, y, color, scale] of specs) {
    const mesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(scale, 0),
      new THREE.MeshBasicMaterial({ color }),
    );
    mesh.frustumCulled = false;
    mesh.userData.dress = { x, y };
    group.add(mesh);
  }
  return group;
}

function placeDress(camera, dress) {
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
  const up = new THREE.Vector3().copy(camera.up).normalize();
  for (const mesh of dress.children) {
    const spot = mesh.userData.dress;
    mesh.position.copy(camera.position).addScaledVector(forward, 18).addScaledVector(right, spot.x).addScaledVector(up, spot.y);
  }
}

function makeStars(THREE) {
  const count = 900;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 700 + Math.random() * 900;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.cos(phi);
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    const warm = Math.random();
    colors[i * 3] = 0.8 + warm * 0.2;
    colors[i * 3 + 1] = 0.75 + warm * 0.1;
    colors[i * 3 + 2] = 1;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({ size: 2.2, vertexColors: true, sizeAttenuation: false });
  return new THREE.Points(geo, mat);
}

function part(THREE, group, geo, mat, outlineMat, x, y, z, rx, ry, rz, sx, sy, sz) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.rotation.set(rx || 0, ry || 0, rz || 0);
  if (sx) mesh.scale.set(sx, sy, sz);
  mesh.castShadow = false;
  mesh.receiveShadow = false;
  group.add(mesh);
  if (!outlineMat) return mesh;
  const shell = new THREE.Mesh(geo, outlineMat);
  shell.position.copy(mesh.position);
  shell.rotation.copy(mesh.rotation);
  shell.scale.copy(mesh.scale).multiplyScalar(1.055);
  shell.userData.outline = true;
  group.add(shell);
  return mesh;
}

function makeKite(THREE, toon, outlineMat, color, accent) {
  const group = new THREE.Group();
  const hull = toon(color);
  const trim = toon(accent);
  const dark = toon(0x2a1a33);
  const glass = new THREE.MeshBasicMaterial({ color: 0xb7e7ff });
  const flame = new THREE.MeshBasicMaterial({ color: accent });
  part(THREE, group, new THREE.ConeGeometry(0.42, 1.7, 6), hull, outlineMat, 0, 0, 1.7, Math.PI / 2, 0, 0);
  part(THREE, group, new THREE.CylinderGeometry(0.38, 0.5, 2.2, 6), hull, outlineMat, 0, 0, 0.1, Math.PI / 2, 0, 0);
  part(THREE, group, new THREE.BoxGeometry(3.1, 0.08, 1.05), trim, outlineMat, 0, 0, -0.05);
  part(THREE, group, new THREE.BoxGeometry(0.7, 0.08, 0.9), trim, outlineMat, 0, 0.05, -1.15);
  part(THREE, group, new THREE.BoxGeometry(0.35, 0.7, 0.7), dark, outlineMat, 0, 0.28, -1.2);
  part(THREE, group, new THREE.SphereGeometry(0.28, 8, 6), glass, outlineMat, 0, 0.28, 0.45);
  part(THREE, group, new THREE.CylinderGeometry(0.18, 0.22, 0.5, 6), dark, outlineMat, -0.28, -0.05, -0.85, Math.PI / 2, 0, 0);
  part(THREE, group, new THREE.CylinderGeometry(0.18, 0.22, 0.5, 6), dark, outlineMat, 0.28, -0.05, -0.85, Math.PI / 2, 0, 0);
  part(THREE, group, new THREE.ConeGeometry(0.18, 0.7, 6), flame, outlineMat, -0.28, -0.05, -1.25, -Math.PI / 2, 0, 0);
  part(THREE, group, new THREE.ConeGeometry(0.18, 0.7, 6), flame, outlineMat, 0.28, -0.05, -1.25, -Math.PI / 2, 0, 0);
  return group;
}

function makeActor(THREE, toon, outlineMat, ent) {
  if (ent.kind === "player") return makeKite(THREE, toon, outlineMat, 0xf4e2c4, 0xffb25a);
  if (ent.kind === "bram") return makeKite(THREE, toon, outlineMat, 0xd9fff6, 0x3ddec8);
  if (ent.kind === "nix") return makeKite(THREE, toon, outlineMat, 0xffe4f1, 0xe85aa0);
  if (ent.kind === "pim") return makeKite(THREE, toon, outlineMat, 0xfff6df, 0xe2b14a);
  if (ent.role === "shot" || ent.kind === "laser" || ent.kind === "charge" || ent.kind === "homing") {
    const mat = new THREE.MeshBasicMaterial({ color: ent.color || 0xffe3a2 });
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 1), mat);
    return mesh;
  }
  if (ent.role === "fx") {
    const mat = new THREE.MeshBasicMaterial({
      color: ent.kind === "rockpop" ? 0xd7b08a : 0xffb15a,
      transparent: true,
      opacity: 1,
    });
    return new THREE.Mesh(new THREE.IcosahedronGeometry(ent.kind === "rockpop" ? 0.8 : 0.6, 0), mat);
  }
  if (ent.role === "pickup" || ent.kind === "pickup") {
    const color = ent.gift === "laser" ? 0x9af7ff : ent.gift === "bomb" ? 0xff8a3a : 0xb8ff9a;
    const group = new THREE.Group();
    part(THREE, group, new THREE.OctahedronGeometry(1.1, 0), toon(color), outlineMat, 0, 0, 0);
    return group;
  }
  const group = new THREE.Group();
  const body = toon(0x3a2a32);
  const hot = toon(0xff6a2a);
  if (ent.kind === "asteroid") {
    part(THREE, group, new THREE.DodecahedronGeometry(ent.radius || 2.4, 0), toon(0x8d7aa4), outlineMat, 0, 0, 0);
    const ring = new THREE.Mesh(new THREE.TorusGeometry((ent.radius || 2.4) + 0.8, 0.12, 6, 14), new THREE.MeshBasicMaterial({ color: 0xffe08a }));
    ring.name = "warn";
    ring.visible = false;
    group.add(ring);
    return group;
  }
  if (ent.kind === "dart" || ent.kind === "fighter") {
    part(THREE, group, new THREE.ConeGeometry(0.7, 2.2, 4), hot, outlineMat, 0, 0, 0.4, Math.PI / 2, 0, 0);
    part(THREE, group, new THREE.BoxGeometry(2.4, 0.12, 0.8), body, outlineMat, 0, 0, -0.2);
    return group;
  }
  if (ent.kind === "lance" || ent.kind === "heavy" || ent.kind === "ace" || ent.kind === "hunter") {
    const scale = ent.kind === "heavy" ? 1.35 : 1;
    part(THREE, group, new THREE.BoxGeometry(1.1 * scale, 0.45 * scale, 2.4 * scale), body, outlineMat, 0, 0, 0);
    part(THREE, group, new THREE.BoxGeometry(2.6 * scale, 0.1, 0.7), hot, outlineMat, 0, 0, 0.2);
    part(THREE, group, new THREE.ConeGeometry(0.35 * scale, 0.9, 4), hot, outlineMat, 0, 0, 1.5 * scale, Math.PI / 2, 0, 0);
    return group;
  }
  if (ent.kind === "post") {
    part(THREE, group, new THREE.CylinderGeometry(0.4, 0.7, 2.2, 6), body, outlineMat, 0, 0, 0);
    part(THREE, group, new THREE.BoxGeometry(0.4, 0.4, 1.4), hot, outlineMat, 0, 0.4, 0.4);
    return group;
  }
  if (ent.kind === "barge") {
    part(THREE, group, new THREE.BoxGeometry(8, 2.2, 14), body, outlineMat, 0, 0, 0);
    part(THREE, group, new THREE.BoxGeometry(12, 0.4, 6), toon(0x5a3a40), outlineMat, 0, 0.4, -1);
    return group;
  }
  if (ent.kind === "engine" || ent.kind === "generator" || ent.kind === "core" || ent.kind === "eye") {
    const color = ent.kind === "eye" ? 0xff5530 : ent.kind === "core" ? 0xfff1b0 : 0xffb15a;
    part(THREE, group, new THREE.SphereGeometry(ent.radius || 1.8, 12, 10), toon(color), outlineMat, 0, 0, 0);
    return group;
  }
  if (ent.kind === "plate") {
    part(THREE, group, new THREE.BoxGeometry(3.2, 3.2, 0.6), toon(0x6a5648), outlineMat, 0, 0, 0);
    return group;
  }
  if (ent.kind === "sile") {
    part(THREE, group, new THREE.BoxGeometry(6, 1.6, 8), body, outlineMat, 0, 0, 0);
    part(THREE, group, new THREE.BoxGeometry(11, 0.3, 3), hot, outlineMat, 0, 0.2, 0);
    part(THREE, group, new THREE.ConeGeometry(1.2, 3, 5), toon(0xd7c2a4), outlineMat, 0, 0.4, 4.2, Math.PI / 2, 0, 0);
    return group;
  }
  if (ent.kind === "keel") {
    part(THREE, group, new THREE.BoxGeometry(18, 12, 2), toon(0x2c2433), outlineMat, 0, 0, 0);
    part(THREE, group, new THREE.BoxGeometry(6, 4, 1.2), body, outlineMat, 0, 1, 1);
    part(THREE, group, new THREE.TorusGeometry(3.2, 0.35, 6, 12), hot, outlineMat, 0, 1.2, 1.4);
    return group;
  }
  part(THREE, group, new THREE.BoxGeometry(1, 1, 1), body, outlineMat, 0, 0, 0);
  return group;
}

function createUI(input) {
  const root = document.getElementById("ui");
  const hud = document.getElementById("hud");
  const touch = document.getElementById("touchgate");
  const fault = document.getElementById("fault");
  root.innerHTML = [
    screenTitle(),
    screenHowto(),
    screenSettings(),
    screenAbout(),
    screenBrief(),
    screenInter(),
    screenPause(),
    screenResults(),
    screenFail(),
  ].join("");

  root.addEventListener("click", (event) => {
    const node = event.target.closest("[data-act]");
    if (!node) return;
    input.queueClick(node.dataset.act);
  });
  touch.addEventListener("click", (event) => {
    const node = event.target.closest("[data-act]");
    if (!node) return;
    input.queueClick(node.dataset.act);
  });

  function paint(state, view) {
    const screens = root.querySelectorAll(".screen");
    screens.forEach((node) => node.classList.remove("show"));
    const current = root.querySelector("#screen-" + state.screen);
    if (current) current.classList.add("show");
    const items = menuFor(state.screen);
    current && current.querySelectorAll("[data-act]").forEach((node, index) => {
      node.classList.toggle("on", items[index] && items[state.focus] && node.dataset.act === items[state.focus].id && index === state.focus);
    });
    if (state.screen === "settings") paintSettings(state.settings);
    if (state.screen === "briefing") {
      paintBrief(state);
      const fly = root.querySelector("#screen-briefing [data-act='launch']");
      if (fly) fly.textContent = state.ready ? "Fly" : "Tuning the kite";
    }
    if (state.screen === "intermission") paintInter(state);
    if (state.screen === "results") paintResults(state);
    const showHud = state.screen === "play" && state.run;
    hud.classList.toggle("show", !!showHud);
    if (showHud) paintHud(state, view);
  }

  function paintHud(state, view) {
    const run = state.run;
    const p = run.player;
    hud.querySelector("#shield-fill").style.width = Math.max(0, p.shield) + "%";
    hud.querySelector("#shield-num").textContent = Math.ceil(Math.max(0, p.shield));
    hud.querySelector("#hits-num").textContent = String(run.hits);
    hud.querySelector("#obj-line").textContent = run.objective || "";
    const target = run.target;
    const boss = hud.querySelector("#boss");
    if (target && target.show) {
      boss.hidden = false;
      hud.querySelector("#boss-name").textContent = target.name;
      hud.querySelector("#boss-fill").style.width = Math.max(0, (target.hp / target.max) * 100) + "%";
    } else boss.hidden = true;
    hud.querySelectorAll(".wing").forEach((node) => {
      const wing = run.wingmen.find((item) => item.id === node.dataset.wing);
      if (!wing) return;
      node.classList.toggle("down", !wing.alive);
      node.querySelector(".fill").style.width = Math.max(0, wing.shield) + "%";
      node.querySelector(".stat").textContent = wing.alive ? (wing.heat ? "HOT" : "WITH YOU") : "DOWN";
    });
    hud.querySelectorAll(".pip").forEach((node, index) => node.classList.toggle("on", index < p.bombs));
    hud.querySelectorAll(".laser").forEach((node, index) => node.classList.toggle("on", index < p.laser));
    hud.querySelector("#speed-word").textContent = run.speedMode === "boost" ? "BOOST" : run.speedMode === "brake" ? "BRAKE" : "CRUISE";
    const radio = hud.querySelector("#radio-line");
    if (run.radioCurrent) {
      radio.hidden = false;
      radio.innerHTML = "<b>" + escapeHtml(run.radioCurrent.who) + "</b>" + escapeHtml(run.radioCurrent.text);
    } else radio.hidden = true;
    hud.querySelector("#demo-tag").hidden = !state.attract;
    const reticle = hud.querySelector("#reticle");
    reticle.classList.toggle("charge", p.charge > 0.05);
    reticle.classList.toggle("deflect", !!p.deflecting);
    hud.querySelector("#charge-fill").style.width = (p.charge * 100) + "%";
    const locks = hud.querySelector("#locks");
    locks.innerHTML = "";
    if (view) {
      for (const id of p.locks) {
        const ent = run.entities.find((item) => item.id === id && item.alive);
        if (!ent) continue;
        const pos = view.project(ent.x, ent.y, ent.z);
        if (pos.behind) continue;
        const mark = document.createElement("div");
        mark.className = "lock";
        mark.style.left = pos.x + "px";
        mark.style.top = pos.y + "px";
        locks.appendChild(mark);
      }
    }
  }

  function paintSettings(settings) {
    setText("#set-music", Math.round(settings.music * 100) + "%");
    setText("#set-sfx", Math.round(settings.sfx * 100) + "%");
    setText("#set-invert", settings.invert ? "ON" : "OFF");
    setText("#set-shake", settings.shake ? "ON" : "OFF");
  }

  function paintBrief(state) {
    const mission = MISSIONS[state.mission];
    setText("#brief-name", mission.name);
    setText("#brief-place", mission.place);
    setText("#brief-obj", mission.objective);
    const wings = state.carry && state.carry.wingmen ? state.carry.wingmen : WINGS.map((wing) => ({ id: wing.id, alive: true }));
    const line = WINGS.map((wing) => {
      const found = wings.find((item) => item.id === wing.id);
      const alive = !found || found.alive !== false;
      return wing.short + (alive ? " ready" : " down");
    }).join("  ·  ");
    setText("#brief-wings", line);
  }

  function paintInter(state) {
    const basin = state.run && state.run.branch === "basin";
    setText("#inter-title", basin ? "Kitebreak Basin" : "Longnight Trench");
    setText("#inter-copy", basin
      ? "The barge broke apart. Vesper Flight drops into open air."
      : "The barge slipped the gate. Follow it through Longnight Trench.");
  }

  function paintResults(state) {
    const run = state.run;
    if (!run) return;
    const citation = run.rank === "citation";
    setText("#result-rank", citation ? "VESPER CITATION" : "CLEAR");
    setText("#result-hits", run.hits + " HITS");
    setText("#result-need", "Citation asks for " + (run.need || 0) + " hits and every wingman.");
    setText("#result-route", MISSIONS[run.mission].name);
    setText("#result-wings", run.wingmen.map((wing) => wing.short + (wing.alive ? " saved" : " lost")).join("  ·  "));
  }

  function faultMessage(text) {
    fault.classList.add("show");
    fault.querySelector("p").textContent = text;
  }

  function setTouch(on) {
    touch.classList.toggle("show", !!on);
  }

  return { paint, fault: faultMessage, setTouch };
}

function menuFor(screen) {
  const map = {
    title: ["launch", "howto", "settings", "about"],
    howto: ["back"],
    settings: ["music", "sfx", "invert", "shake", "back"],
    about: ["back"],
    briefing: ["launch"],
    intermission: ["launch"],
    pause: ["resume", "settings", "abort"],
    results: ["again", "title"],
    fail: ["retry", "title"],
  };
  return (map[screen] || []).map((id) => ({ id }));
}

function setText(sel, text) {

function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

async function boot() {
  if (location.protocol === "file:") return;

  const input = createInput();
  const audio = createAudio();
  const ui = createUI(input);
  ui.setTouch(isTouchOnly());

  const canvas = document.getElementById("view");
  const mirror = document.createElement("canvas");
  mirror.style.position = "fixed";
  mirror.style.inset = "0";
  mirror.style.width = "100%";
  mirror.style.height = "100%";
  mirror.style.zIndex = "0";
  mirror.style.pointerEvents = "none";
  mirror.style.display = "none";
  canvas.after(mirror);
  const mirrorCtx = mirror.getContext("2d", { alpha: false, willReadFrequently: true });
  let mirrorMode = "";
  let presentWaits = 0;
  if (!navigator.gpu) {
    ui.fault("WebGPU is required. This page does not start a WebGL backend.");
    return;
  }

  let rapierReady = false;
  const rapierPromise = RAPIER.init()
    .then(() => {
      rapierReady = true;
    })
    .catch(() => {
      ui.fault("Physics failed to start. Reload the page and try again.");
    });

  let gpuDevice = null;
  try {
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
    if (adapter) gpuDevice = await adapter.requestDevice();
  } catch (err) {
    gpuDevice = null;
  }
  if (!gpuDevice) {
    ui.fault("WebGPU is required. This page does not start a WebGL backend.");
    return;
  }

  const renderer = new THREE.WebGPURenderer({ canvas, antialias: false, alpha: false, samples: 0, device: gpuDevice });
  renderer._getFallback = null;
  renderer.samples = 0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  const view = createView(THREE, renderer);

  let viewW = 0;
  let viewH = 0;
  function fit() {
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width));
    const h = Math.max(1, Math.round(rect.height));
    if (w === viewW && h === viewH) return;
    viewW = w;
    viewH = h;
    renderer.setPixelRatio(1);
    renderer.setSize(w, h, false);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    mirror.width = w;
    mirror.height = h;
    view.resize(w, h);
  }

  try {
    fit();
    await renderer.init();
  } catch (err) {
    ui.fault("WebGPU is required. This page does not start a WebGL backend.");
    return;
  }
  if (typeof renderer.setClearColor === "function") renderer.setClearColor(0x123a72, 1);
  if (!renderer.backend || renderer.backend.isWebGPUBackend !== true) {
    ui.fault("WebGPU is required. This page does not start a WebGL backend.");
    return;
  }

  const state = {
    screen: "title",
    focus: 0,
    idle: 0,
    attract: false,
    run: null,
    ready: false,
    settings: { music: 0.7, sfx: 0.85, invert: false, shake: true },
    settingsBack: "title",
    hold: 0,
    mission: "glasswake",
    carry: null,
  };
  audio.setVolumes(state.settings);

  let failed = false;
  let last = performance.now();
  let titleTime = 0;
  fit();
  view.renderTitle(0);
  await view.draw();

  function carryFrom(run) {
    return {
      hits: run.hits,
      laser: run.player.laser,
      bombs: run.player.bombs,
      shield: run.player.shield,
      wingmen: run.wingmen.map((wing) => ({
        id: wing.id,
        shield: wing.shield,
        alive: wing.alive,
        heat: wing.heat,
      })),
      branch: run.branch,
    };
  }

  function begin(mission, carry, attract) {
    if (!rapierReady) return false;
    if (state.run) destroyRun(state.run);
    state.mission = mission;
    state.carry = carry;
    state.attract = attract;
    state.hold = 0;
    state.run = createRun(RAPIER, {
      mission,
      carry,
      attract,
      seed: attract ? 1337 : (Date.now() >>> 0),
    });
    state.screen = "play";
    state.focus = 0;
    audio.setMusic(mission === "basin" ? "allrange" : "corridor");
    return true;
  }

  function goTitle() {
    if (state.run) destroyRun(state.run);
    state.run = null;
    state.attract = false;
    state.carry = null;
    state.mission = "glasswake";
    state.screen = "title";
    state.focus = 0;
    state.idle = 0;
    state.hold = 0;
    audio.setMusic("title");
  }

  function activate(id) {
    audio.resume();
    audio.blip("ui");
    if (id === "settings" && state.screen !== "settings") {
      state.settingsBack = state.screen === "play" ? "play" : state.screen;
      state.screen = "settings";
      state.focus = 0;
      state.idle = 0;
      return;
    }
    if (state.screen === "title" && id === "launch") {
      state.screen = "briefing";
      state.mission = "glasswake";
      state.carry = null;
      state.focus = 0;
      state.idle = 0;
      return;
    }
    if (state.screen === "title" && (id === "howto" || id === "about")) {
      state.screen = id;
      state.focus = 0;
      state.idle = 0;
      return;
    }
    if ((state.screen === "howto" || state.screen === "about") && id === "back") {
      state.screen = "title";
      state.focus = 0;
      return;
    }
    if (state.screen === "settings" && id === "back") {
      state.screen = state.settingsBack;
      state.focus = 0;
      return;
    }
    if (state.screen === "briefing" && id === "launch") {
      begin(state.mission, state.carry, false);
      return;
    }
    if (state.screen === "intermission" && id === "launch") {
      const next = state.run && state.run.branch === "basin" ? "basin" : "trench";
      state.carry = state.run ? carryFrom(state.run) : null;
      state.mission = next;
      state.screen = "briefing";
      state.focus = 0;
      return;
    }
    if (state.screen === "pause") {
      if (id === "resume") state.screen = "play";
      else if (id === "abort") goTitle();
      return;
    }
    if (state.screen === "results" || state.screen === "fail") {
      if (id === "again" || id === "retry") {
        if (state.run) destroyRun(state.run);
        state.run = null;
        state.carry = null;
        state.mission = "glasswake";
        state.screen = "briefing";
        state.focus = 0;
      } else goTitle();
    }
  }

  function tweak(actions) {
    if (state.screen !== "settings") return;
    const item = menuFor("settings")[state.focus];
    if (!item) return;
    const settings = state.settings;
    if (item.id === "music" && actions.menuRight) settings.music = Math.min(1, round10(settings.music + 0.1));
    if (item.id === "music" && actions.menuLeft) settings.music = Math.max(0, round10(settings.music - 0.1));
    if (item.id === "sfx" && actions.menuRight) settings.sfx = Math.min(1, round10(settings.sfx + 0.1));
    if (item.id === "sfx" && actions.menuLeft) settings.sfx = Math.max(0, round10(settings.sfx - 0.1));
    if (item.id === "invert" && (actions.menuLeft || actions.menuRight)) settings.invert = !settings.invert;
    if (item.id === "shake" && (actions.menuLeft || actions.menuRight)) settings.shake = !settings.shake;
    audio.setVolumes(settings);
  }

  async function loop(now) {
    if (failed) return;
    try {
      const dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
      last = now;
      fit();
      state.ready = rapierReady;
      const actions = input.snapshot(state.screen === "play" && !state.attract);
      if (actions.any) audio.resume();

      let consumed = false;
      if (state.attract && actions.any) {
        goTitle();
        consumed = true;
      } else if (!state.attract && idleScreen(state.screen)) {
        if (actions.any) state.idle = 0;
        else state.idle += dt;
        if (state.idle >= 10 && rapierReady) {
          audio.resume();
          begin("glasswake", null, true);
          consumed = true;
        }
      }

      if (!consumed && !state.attract && menuScreen(state.screen)) {
        {
          const items = menuFor(state.screen);
          const before = state.focus;
          if (actions.menuDown) state.focus = (state.focus + 1) % items.length;
          if (actions.menuUp) state.focus = (state.focus - 1 + items.length) % items.length;
          if (state.focus !== before) audio.blip("ui");
          tweak(actions);
          if (actions.click) {
            const index = items.findIndex((item) => item.id === actions.click);
            if (index >= 0) state.focus = index;
            activate(actions.click);
          } else if (actions.confirm && items[state.focus]) {
            const item = items[state.focus];
            if (state.screen === "settings" && item.id === "invert") state.settings.invert = !state.settings.invert;
            else if (state.screen === "settings" && item.id === "shake") state.settings.shake = !state.settings.shake;
            else activate(item.id);
            audio.setVolumes(state.settings);
          } else if (actions.back) {
            if (state.screen === "settings") activate("back");
            else if (state.screen === "pause") activate("resume");
            else if (state.screen !== "title") activate("back");
          }
        }
      }

      if (!state.attract && state.screen === "play" && actions.pause) {
        state.screen = "pause";
        state.focus = 0;
        audio.blip("ui");
      }

      const showRun = state.run && (state.screen === "play" || state.screen === "pause" || state.screen === "intermission" || state.screen === "results" || state.screen === "fail");
      if (state.screen === "play" && state.run) {
        const simActions = state.attract ? attractActions(state.run) : swung(actions, state.settings.invert);
        stepRun(state.run, simActions, dt);
        for (const name of state.run.sfx) audio.blip(name);
        state.run.sfx.length = 0;
        if (state.run.phase === "done" && !state.run.presented) {
          state.run.presented = true;
          state.hold = 0;
          state.focus = 0;
          if (state.run.outcome === "branch") state.screen = "intermission";
          else if (state.run.outcome === "success") {
            state.screen = "results";
            audio.setMusic("results");
          } else if (state.run.outcome === "fail") state.screen = "fail";
        }
        const music = state.run.keel || state.run.bossPhase ? "boss" : state.run.mode === "allrange" ? "allrange" : "corridor";
        if (state.screen === "play") audio.setMusic(music);
      }

      if (state.attract && state.run && state.run.presented && state.screen !== "play") {
        state.hold += dt;
        const wait = state.run.outcome === "success" ? 3.4 : 1.4;
        if (state.hold > wait) {
          if (state.run.outcome === "branch") {
            const next = state.run.branch === "basin" ? "basin" : "trench";
            begin(next, carryFrom(state.run), true);
          } else begin("glasswake", null, true);
        }
      }

      if (showRun && state.run) view.syncRun(state.run, state.settings.shake && state.screen === "play");
      else {
        titleTime += dt;
        view.renderTitle(titleTime);
        if (!state.attract) audio.setMusic("title");
      }

      if (state.screen !== "play") audio.update();
      else audio.update();
      ui.paint(state, view);
      await view.draw();
      presentWaits += 1;
      if (!mirrorMode && presentWaits > 4) mirrorMode = await detectPresent();
      if (mirrorMode === "copy") await mirrorFrame();
      const mark = globalThis.__nova || (globalThis.__nova = { frames: 0, backend: "" });
      mark.frames += 1;
      mark.backend = renderer.backend && renderer.backend.isWebGPUBackend ? "webgpu" : "other";
      mark.screen = state.screen;
      mark.attract = !!state.attract;
      mark.mission = state.run ? state.run.mission : "";
      mark.mode = state.run ? state.run.mode : "";
      mark.branch = state.run && state.run.branch ? state.run.branch : "";
      mark.boss = state.run ? (state.run.bossPhase || (state.run.keel ? 1 : 0)) : 0;
      mark.objective = state.run ? state.run.objective || "" : "";
      mark.progress = state.run ? Math.round(state.run.s || state.run.time || 0) : 0;
      mark.calls = renderer.info.render.calls;
      mark.triangles = Math.max(renderer.info.render.triangles | 0, view.frameTris || 0);
      mark.cam = view.camera.position.toArray().map((n) => Math.round(n));
      mark.ship = state.run ? [Math.round(state.run.player.x), Math.round(state.run.player.y), Math.round(state.run.player.z)] : null;
      mark.look = view.lookDot ? Number(view.lookDot.toFixed(3)) : null;
      mark.mesh = view.meshDebug || null;
      mark.alpha = renderer.alpha;
      mark.samples = renderer.samples;
      mark.present = mirrorMode;
      requestAnimationFrame(loop);
    } catch (err) {
      failed = true;
      ui.fault(err && err.message ? err.message : "The kite failed to draw.");
      console.error(err);
    }
  }

  async function detectPresent() {
    const probe = document.createElement("canvas");
    probe.width = Math.max(1, canvas.width);
    probe.height = Math.max(1, canvas.height);
    const ctx = probe.getContext("2d", { willReadFrequently: true });
    try {
      ctx.drawImage(canvas, 0, 0);
      const px = ctx.getImageData(8, 8, 1, 1).data;
      if (px[0] + px[1] + px[2] > 12) return "native";
    } catch (err) {
      return "native";
    }
    return "copy";
  }

  async function mirrorFrame() {
    const backend = renderer.backend;
    const device = backend && backend.device;
    const gpuContext = backend && backend.context;
    if (!device || !gpuContext || mirror.width < 2) return;
    let buffer = null;
    try {
      const tex = gpuContext.getCurrentTexture();
      const w = tex.width;
      const h = tex.height;
      if (w !== mirror.width || h !== mirror.height) return;
      const bytesPerRow = Math.ceil((w * 4) / 256) * 256;
      buffer = device.createBuffer({
        size: bytesPerRow * h,
        usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
      });
      const encoder = device.createCommandEncoder();
      encoder.copyTextureToBuffer(
        { texture: tex },
        { buffer, bytesPerRow, rowsPerImage: h },
        { width: w, height: h },
      );
      device.queue.submit([encoder.finish()]);
      await buffer.mapAsync(GPUMapMode.READ);
      const src = new Uint8Array(buffer.getMappedRange().slice(0));
      buffer.unmap();
      buffer.destroy();
      buffer = null;
      let lit = 0;
      for (let i = 0; i < src.length; i += 64) {
        if (src[i] + src[i + 1] + src[i + 2] > 18) lit += 1;
      }
      if (lit < 40) {
        mirror.style.display = "none";
        mirrorMode = "native";
        return;
      }
      const image = mirrorCtx.createImageData(w, h);
      const bgra = String(tex.format || "").indexOf("bgra") !== -1;
      if (!bgra && bytesPerRow === w * 4) {
        image.data.set(src);
      } else {
        const dst = image.data;
        for (let y = 0; y < h; y++) {
          const row = y * bytesPerRow;
          const out = y * w * 4;
          if (!bgra) dst.set(src.subarray(row, row + w * 4), out);
          else {
            for (let x = 0; x < w; x++) {
              const s = row + x * 4;
              const d = out + x * 4;
              dst[d] = src[s + 2];
              dst[d + 1] = src[s + 1];
              dst[d + 2] = src[s];
              dst[d + 3] = 255;
            }
          }
        }
      }
      mirrorCtx.putImageData(image, 0, 0);
      mirror.style.display = "block";
    } catch (err) {
      if (buffer) {
        try { buffer.destroy(); } catch (ignore) { /* buffer already destroyed */ }
      }
      mirrorMode = "native";
    }
  }

  addEventListener("resize", fit);
  requestAnimationFrame(loop);
  await rapierPromise;
}

function idleScreen(screen) {
  return screen === "title" || screen === "howto" || screen === "settings" || screen === "about";
}

function menuScreen(screen) {
  return idleScreen(screen) || screen === "briefing" || screen === "intermission" || screen === "pause" || screen === "results" || screen === "fail";
}

function swung(actions, invert) {
  if (!invert) return actions;
  return Object.assign({}, actions, { moveY: -actions.moveY });
}

function round10(value) {
  return Math.round(value * 10) / 10;
}

function isTouchOnly() {
  return window.matchMedia("(pointer: coarse)").matches
    && window.matchMedia("(hover: none)").matches
    && navigator.maxTouchPoints > 0;
}

await boot();

</script>
