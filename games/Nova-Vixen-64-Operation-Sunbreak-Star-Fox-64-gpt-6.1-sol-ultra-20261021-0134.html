  for (const [a, b] of contacts) collision(a, b);

  world.update(dt * speed, clock, time, stage);
  audio.update(dt, { speed, hp, boost: speed > 1.2 });
}
function finishMission() {
  if (attract) {
    startMission(true);
    return;
  }
  const rank = score >= 32e3 ? "S" : score >= 21e3 ? "A" : score >= 13e3 ? "B" : "C";
  record = Math.max(record, score);
  try {
    localStorage.setItem("nova-vixen-record", String(record));
  } catch {
  }
  state = "results";
  ui.show("results", { score, kills, accuracy: fired ? Math.min(100, Math.round(hits / fired * 100)) : 0, rings: ringCount, rank, time: Math.floor(time), route: route || "skyline", record, wingHealth: wingmen.map((w) => w.hp) });
  audio.setMode("victory");
}
function projectMarker(e) {
  if (!e.marker) return;
  projected.copy(e.mesh.position).project(camera);
  const visible = projected.z < 1 && projected.z > 0 && Math.abs(projected.x) < 1.15 && Math.abs(projected.y) < 1.15 && !e.dead;
  e.marker.style.display = visible ? "block" : "none";
  if (!visible) return;
  e.marker.style.left = (projected.x * 0.5 + 0.5) * innerWidth + "px";
  e.marker.style.top = (-projected.y * 0.5 + 0.5) * innerHeight + "px";
  e.marker.classList.toggle("locked", e === lockTarget && lockTimer >= 0.8);
  e.marker.classList.toggle("targeted", e === lockTarget);
}
function draw() {
  const active = ["playing", "attract", "victory"].includes(state);
  warningEl.hidden = !active || state === "victory" || !boss?.warning;
  let cx = player.position.x * 0.27, cy = 22 + (player.position.y - 16) * 0.16;
  if (state === "title" || ["settings", "manual", "about"].includes(state) && returnScreen === "title") {
    cx = 19;
    cy = 22;
  }
  const motion = settings.reducedMotion ? 0 : 1;
  camera.position.lerp(new THREE2.Vector3(cx + (Math.random() - 0.5) * shake * motion, cy + (Math.random() - 0.5) * shake * motion, 38 + (speed - 1) * -6), 0.07);
  look.set(player.position.x * 0.45, 17 + (player.position.y - 16) * 0.25, -130);
  camera.lookAt(look);
  camera.fov = lerp(camera.fov, 62 + (speed - 1) * 8 * motion, 0.04);
  camera.updateProjectionMatrix();
  shake *= 0.91;
  flash *= 0.91;
  flashEl.style.opacity = String(flash);
  overlays.style.display = active ? "block" : "none";
  for (const e of entities) projectMarker(e);
  for (const g of routeGates) projectMarker(g);
  if (boss) {
    for (const c of boss.cores) if (c.active) projectMarker(c);
    else if (c.marker) c.marker.style.display = "none";
  }
  if (active) {
    projected.copy(aim).project(camera);
    ui.update({ hp, energy, bombs, score, combo: Math.min(5, 1 + Math.floor(combo / 5)), time, stage: stage === "canyon" ? "01 / THE AMBER RUN" : stage === "orbit" ? "02 / THE SHATTER BELT" : "03 / HALO WARDEN", objective, speed: speed > 1.2 ? "BOOST" : speed < 0.8 ? "BRAKE" : "CRUISE", lock: lockTimer >= 0.8, charge, target: lockTarget, weapon: ["", "TWIN LASER", "HYPER LASER", "NOVA LASER"][weapon], attract, route: route ? route.toUpperCase() + " VECTOR" : "SUNBREAK VECTOR", wingHealth: wingmen.map((w) => w.hp), bossHP: boss?.hp || 0, bossMax: boss?.max, bossName: "HALO WARDEN / HELIX CARRIER", rallyCooldown, reticle: { x: (projected.x * 0.5 + 0.5) * innerWidth, y: (-projected.y * 0.5 + 0.5) * innerHeight, lock: lockTimer >= 0.8 } });
  }
  renderer.render(scene, camera);
}
var previousFrame = performance.now();
function frame(now) {
  if (!ready) return;
  const dt = Math.min((now - previousFrame) / 1e3, 0.1);
  previousFrame = now;
  input.poll(dt, settings);
  if (!["playing", "attract", "victory"].includes(state)) input.edges = {};
  if (state === "title" && now - lastActivity >= 1e4) startMission(true);
  accumulator += dt * (window.__NOVA?.timeScale || 1);
  let steps = 0;
  while (accumulator >= 1 / 60 && steps < 90) {
    step(1 / 60);
    accumulator -= 1 / 60;
    steps++;
  }
  draw();
}
function resize() {
  if (!renderer) return;
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
async function boot() {

    ui.setLoading("Establishing flight systems");

    eventQueue = new RAPIER.EventQueue(true);
    renderer = new THREE2.WebGPURenderer({ antialias: true, alpha: false });
    renderer._getFallback = null;
    await renderer.init();
    if (!renderer.backend.isWebGPUBackend) throw new Error("A native WebGPU backend is required.");
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE2.SRGBColorSpace;
    renderer.toneMapping = THREE2.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE2.PCFShadowMap;
    renderer.domElement.id = "flight-canvas";
    renderer.domElement.setAttribute("aria-label", "Nova Vixen 64 flight viewport");
    document.body.prepend(renderer.domElement);
    scene = new THREE2.Scene();
    camera = new THREE2.PerspectiveCamera(62, innerWidth / innerHeight, 0.2, 4200);
    camera.position.set(19, 22, 38);
    world = createWorld(scene);
    player = createShip("player");
    player.position.set(0, 14, 0);
    scene.add(player);
    const p = makeBody(player, 2, "player", {});
    playerBody = p.body;
    playerCollider = p.collider;
    for (let i = 0; i < 2; i++) {
      const mesh2 = createShip("wingman", i ? 16760166 : 7397333);
      mesh2.scale.setScalar(0.72);
      mesh2.position.set(i ? 11 : -11, 16, -15);
      scene.add(mesh2);
      wingmen.push({ mesh: mesh2, hp: 100, fire: 1 + i, cover: 0, danger: false });
    }

    ui.setReady();
    toTitle();
    resize();
    previousFrame = performance.now();
    renderer.setAnimationLoop(frame);
    document.documentElement.dataset.boot = "ready";
    window.__NOVA = { version: "1.0.0", controls: CONTROLS, timeScale: 1, get state() {
      return state;
    }, get time() {
      return time;
    }, get telemetry() {
      return { state, time, stage, route, hp, energy, bombs, score, kills, rings: ringCount, physicsBodies: physics.bodies.len(), enemies: entities.length, shots: shots.length, boss: boss ? { hp: boss.hp, phase: bossPhase } : null, backend: renderer.backend.isWebGPUBackend ? "WebGPU" : "unknown", settings: { ...settings }, axes: { ...input.axis }, held: { ...input.current }, roll: rollTimer, rallyCooldown, player: { x: player.position.x, y: player.position.y }, attract };
    }, start: () => startMission(), title: toTitle, attract: () => startMission(true) };
  } catch (error) {
    console.error("Nova Vixen boot:", error);
    loadError = error.message;
    state = "error";
    document.documentElement.dataset.boot = "error";
    const fail = document.getElementById("boot-failure");
    if (fail) {
      fail.hidden = false;
      fail.textContent = "Flight systems unavailable. " + error.message;
    }
    ui.show("error", { message: error.message });
  }
}
boot();
