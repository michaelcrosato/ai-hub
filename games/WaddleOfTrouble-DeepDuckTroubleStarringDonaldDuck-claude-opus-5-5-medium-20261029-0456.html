<!--
WADDLE OF TROUBLE — an original spiritual successor to Deep Duck Trouble Starring Donald Duck

SOURCE INFORMATION
- Date: 2026-10-29 04:56
- Source: Deep Duck Trouble Starring Donald Duck (SEGA, 1993, Master System / Game Gear)
- Tech: Three.js r180 (WebGPURenderer + TSL node materials, WebGPU only, no fallback); Rapier 0.19.3 (@dimforge/rapier3d-compat: kinematic character controller, dynamic kick-crates, kinematic moving/falling ledges, ray casts); Gamepad API (standard mapping + rumble); Web Audio API; AI Hub Session Protocol v1 client 1.3.0; vanilla ES modules via jsDelivr CDN; HTML/CSS overlay UI
- Art Direction: stylized cel-shading — MeshToonNodeMaterial with a hard 3-step ramp, world-space inverted-hull ink outlines, flat saturated per-zone palettes, gradient skies, banded toon water and lava, real-time shadow maps
- Animation: procedural hierarchical animation in code (squash & stretch, sine-driven run cycles, kick anticipation/follow-through, spring-damped landing squash, idle breathing/blinks), particle bursts, tweened UI
- Audio: all code-written with Web Audio — pattern sequencer (pulse/square/saw/triangle/bell/noise voices) playing 8 original tracks + 4 jingles; every SFX synthesized at runtime; Animalese-style gibberish voices from pitched formant blips per letter
- Online: AI Hub Session Protocol v1, side-by-side ("parallel") mode — seeded start, live progress, score result with stats/awards, probe; no other network features
- Testing: lightweight — node —check + oxlint (no-undef) on the bundle; headless Chromium (Playwright, SwiftShader WebGPU, ~5-7 fps) smoke runs with console-error capture and render-target snapshots; scripted keyboard walks (title > story > map > stage > pause > settings, tally, game over, ending); emulated DualSense test; touch-only emulation; accelerated AI simulation of all 4 stages; AI Hub harness side-by-side check at 1-4 players
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort medium
- Usage: unknown (no usage meter visible from inside the session)

TESTING FEEDBACK
- Issues caught: 11 game issues (+2 test-setup problems): invisible ink outlines; outlines too thin; fade overlay stuck black over stage-intro dialogs; Esc closing two menu layers; Esc on the map quitting to title; map camera hiding a stage; settings list overflow; key taps lost at low frame rates; boss-defeat timers on wall-clock time; demo AI stalling in two stages; AI Hub probe missing input on slow frames.
- Critical / game-breaking: 1 (black fade over every stage start until the intro dialog ended).
- Most helpful test: accelerated attract-AI simulation of all four stages (chases + all four bosses to the gem, zero errors).
- Least helpful test: plain headless screenshots (WebGPU canvas captures blank; replaced by a render-target snapshot hook).

ENGINE FEEDBACK
- Liked most: Rapier's kinematic character controller (grounding, sliding, snap-to-ground) plus a filter predicate that turns one-way ledges into a few lines.
- Stuck / guessed wrong: TSL ordering for inverted-hull outlines (instancing is applied before positionNode) and Rapier 0.19 renames had to be checked against the shipped typings.
- Most important thing built: the fixed-step loop ordering kinematic platform moves -> character controller -> physics step, so riding ledges and kicked crates feel solid.
- Hardest part: even ink outlines on non-uniformly scaled primitives in WebGPU without post-processing (world-space extrusion inside a node).
- Remove / overhaul: the parallel WebGL vs. WebGPU (Node) material families and their split documentation.
- Change one thing: ship a built-in toon outline / edge-detection pass for the WebGPU renderer.

PROMPT FEEDBACK
- Liked most: a crisp "done" definition with freedom over tech and art; the 10-foot UX and attract-mode rules shape a real product.
- Confusing: feedback questions about testing are asked up front but can only be answered at the end; "single file" vs. "CDN allowed" leaves bundling depth open.
- Hardest thing: a full vertical slice (4 stages, 4 bosses, map, story, attract mode, settings, hub mode) in one pass with only lightweight testing.
- One test I'd run: a real-GPU, real-controller full playthrough of every stage, recorded, with frame timing.

-->

/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */

    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */

    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);

      },

      },
      removeItem: function (k) {

      },
      clear: function () {

      set: function (t, k, v) {

      },
      has: function (t, k) {

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {

      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.

    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {

      var list = handlers[type] || [];
      var at = list.indexOf(fn);

    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {

      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON

      var value = json(outcome[key]);

    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;

function toon(hex, opts = {}) {
  const key = hex + (opts.emissive ? 'e' + opts.emissive : '') + (opts.transparent ? 't' : '');
  let m = R.toonCache.get(key);
  if (!m) {
    m = new THREE.MeshToonNodeMaterial({ color: hex, gradientMap: R.gradient });
    if (opts.emissive) { m.emissive = new THREE.Color(opts.emissive); m.emissiveIntensity = opts.ei ?? 1; }
    if (opts.transparent) { m.transparent = true; m.opacity = opts.opacity ?? 0.6; }
    R.toonCache.set(key, m);
  }
  return m;
}
function flat(hex) {
  const key = 'flat' + hex;
  let m = R.toonCache.get(key);
  if (!m) { m = new THREE.MeshBasicNodeMaterial({ color: hex }); R.toonCache.set(key, m); }
  return m;
}

// A mesh with its ink hull. Width is in local units: pass the mesh's own scale to keep lines even.
function inked(geo, hex, opts = {}) {
  const mat = opts.material || toon(hex, opts);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = opts.cast !== false;
  mesh.receiveShadow = opts.receive !== false;
  if (opts.outline !== false) {
    const hull = new THREE.Mesh(geo, opts.outlineMat || R.outlineMat);
    hull.castShadow = false;
    hull.receiveShadow = false;

    mesh.add(hull);
  }

}
function part(parent, geo, hex, x = 0, y = 0, z = 0, opts = {}) {
  const m = inked(geo, hex, opts);
  m.position.set(x, y, z);
  if (opts.scale) m.scale.set(...opts.scale);
  if (opts.rot) m.rotation.set(...opts.rot);
  parent.add(m);
  return m;
}

// ---- particles: one instanced pool, flat-shaded chunks ----
class Particles {
  constructor(n = 900) {
    this.n = n;
    this.mesh = new THREE.InstancedMesh(GEO.ico, new THREE.MeshToonNodeMaterial({ color: 0xffffff, gradientMap: R.gradient }), n);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    this.mesh.castShadow = false;
    this.p = [];
    const c = new THREE.Color();
    for (let i = 0; i < n; i++) {
      this.p.push({ life: 0, max: 1, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, s: 0.1, g: 0, spin: 0, r: 0, drag: 0 });
      this.mesh.setColorAt(i, c.set(0xffffff));
    }
    this.cursor = 0;
    this.m4 = new THREE.Matrix4();
    this.q = new THREE.Quaternion();
    this.e = new THREE.Euler();
    this.v = new THREE.Vector3();
    this.sc = new THREE.Vector3();
    this.col = new THREE.Color();
    this.hide();
  }
  hide() {
    this.m4.makeScale(0, 0, 0);
    for (let i = 0; i < this.n; i++) { this.mesh.setMatrixAt(i, this.m4); this.p[i].life = 0; }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
  emit(x, y, z, count, opt = {}) {
    for (let k = 0; k < count; k++) {
      const i = this.cursor;
      this.cursor = (this.cursor + 1) % this.n;
      const p = this.p[i];
      const sp = opt.speed ?? 4;
      const spread = opt.spread ?? 0.5, jit = opt.jitter ?? 0.1;
      const a = opt.angle !== undefined ? opt.angle + rand(-spread, spread) : rand(0, TAU);
      const up = opt.up ?? 0;
      p.x = x + rand(-jit, jit);
      p.y = y + rand(-jit, jit);
      p.z = z + rand(-0.3, 0.3);
      const s = sp * rand(0.4, 1);
      p.vx = Math.cos(a) * s;
      p.vy = Math.sin(a) * s + up;
      p.vz = rand(-1, 1) * (opt.zs ?? 1);
      p.g = opt.gravity ?? 12;
      p.max = p.life = (opt.life ?? 0.6) * rand(0.7, 1.2);
      p.s = (opt.size ?? 0.15) * rand(0.6, 1.3);
      p.spin = rand(-8, 8);
      p.r = rand(0, TAU);
      p.drag = opt.drag ?? 0.5;
      const cols = Array.isArray(opt.color) ? opt.color : [opt.color ?? 0xffffff];
      this.mesh.setColorAt(i, this.col.set(pick(cols)));
    }
    if (this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate = true;
  }
  update(dt) {
    for (let i = 0; i < this.n; i++) {
      const p = this.p[i];
      if (p.life <= 0) continue;
      p.life -= dt;
      if (p.life <= 0) { this.m4.makeScale(0, 0, 0); this.mesh.setMatrixAt(i, this.m4); continue; }
      p.vy -= p.g * dt;
      const d = Math.exp(-p.drag * dt);
      p.vx *= d; p.vz *= d;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      p.r += p.spin * dt;
      const k = p.life / p.max;
      const s = p.s * (k < 0.3 ? k / 0.3 : 1);
      this.e.set(p.r, p.r * 0.7, 0);
      this.q.setFromEuler(this.e);
      this.v.set(p.x, p.y, p.z);
      this.sc.set(s, s, s);
      this.m4.compose(this.v, this.q, this.sc);
      this.mesh.setMatrixAt(i, this.m4);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
}

const floaters = [];
function floatText(text, x, y, colorCss = '#fff', size = 3) {

function updateFloaters(dt) {
  const v = new THREE.Vector3();
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.t += dt;
    v.set(f.x, f.y + f.t * 1.6, 0).project(R.camera);
    f.el.style.left = ((v.x + 1) / 2) * 100 + 'vw';
    f.el.style.top = ((1 - v.y) / 2) * 100 + 'vh';
    f.el.style.opacity = String(clamp(1.6 - f.t * 1.6, 0, 1));
    if (f.t > 1) { f.el.remove(); floaters.splice(i, 1); }
  }
}

// Animate the duck rig. s: {state, t, speed, vy, kick, facing, blink, angry}
function animDuck(model, s, dt) {
  const r = model.userData.rig;
  const t = s.t;
  let sx = 1, sy = 1;
  const run = clamp(Math.abs(s.speed) / 7.5, 0, 1.4);
  r.body.rotation.set(0, 0, 0);
  r.headPivot.rotation.set(0, 0, 0);
  for (const a of r.arms) a.rotation.set(0, 0, 0);
  for (const l of r.legs) l.rotation.set(0, 0, 0);
  r.jaw.rotation.z = 0;
  if (s.state === 'run' || s.state === 'idle') {
    const ph = t * (8 + run * 8);
    const sw = Math.sin(ph) * 0.9 * run;
    r.legs[0].rotation.z = sw;
    r.legs[1].rotation.z = -sw;
    r.arms[0].rotation.z = -sw * 0.8;
    r.arms[1].rotation.z = sw * 0.8;
    r.body.position.y = Math.abs(Math.sin(ph)) * 0.08 * run;
    r.body.rotation.z = -0.18 * run;
    if (run < 0.05) {
      const br = Math.sin(t * 2.6);
      sy = 1 + br * 0.025; sx = 1 - br * 0.02;
      r.headPivot.rotation.z = Math.sin(t * 1.3) * 0.05;
      r.body.position.y = 0;
    }
  } else if (s.state === 'jump' || s.state === 'fall') {
    const st = clamp(s.vy / 14, -1, 1);
    sy = 1 + st * 0.14; sx = 1 - st * 0.08;
    r.arms[0].rotation.x = -1.6 - st * 0.4;
    r.arms[1].rotation.x = 1.6 + st * 0.4;
    r.legs[0].rotation.z = 0.5;
    r.legs[1].rotation.z = -0.3;
    r.body.position.y = 0;
  }
  if (s.kick > 0) {
    // anticipation then snap
    const k = s.kick;
    const leg = r.legs[0];
    leg.rotation.z = k > 0.6 ? -0.6 : 1.6;
    r.legs[1].rotation.z = -0.4;
    r.body.rotation.z = k > 0.6 ? 0.2 : -0.35;
    r.arms[0].rotation.x = -1.2;
    r.arms[1].rotation.x = 1.2;
    if (s.airKick) { r.body.rotation.z = -0.6; r.legs[1].rotation.z = 1.5; }
  }
  if (s.state === 'hurt') {
    r.body.rotation.z = 0.5;
    r.arms[0].rotation.x = -2.5;
    r.arms[1].rotation.x = 2.5;
    r.jaw.rotation.z = -0.4;
  }
  if (s.state === 'cheer') {
    const b = Math.abs(Math.sin(t * 8));
    r.body.position.y = b * 0.3;
    r.arms[0].rotation.x = -2.6;
    r.arms[1].rotation.x = 2.6;
    r.jaw.rotation.z = -0.3;
  }
  if (s.angry) {
    // tantrum: fists flailing, shaking head, quacking jaw
    r.arms[0].rotation.x = -1.8 + Math.sin(t * 40) * 0.8;
    r.arms[1].rotation.x = 1.8 + Math.cos(t * 40) * 0.8;
    r.headPivot.rotation.x = Math.sin(t * 30) * 0.15;
    r.jaw.rotation.z = -Math.abs(Math.sin(t * 24)) * 0.5;
  }
  if (s.talk) r.jaw.rotation.z = -Math.abs(Math.sin(t * 20)) * 0.35;
  // landing squash spring
  sy *= 1 - s.squash * 0.35;
  sx *= 1 + s.squash * 0.25;
  r.body.scale.set(sx, sy, sx);
  // blink
  const bl = (t % 3.3) < 0.1 ? 0.1 : 1;
  for (const e of r.eyes) e.scale.y = 0.11 * bl;
}

function buildUncle() {

  const f = part(g, GEO.sphere, 0xffd34d, 0, 0, 0, { scale: [0.14, 0.42, 0.05], emissive: 0xffa500, ei: 0.4, rot: [0, 0, 0.5] });

function buildCoconut() {

function buildSnowball() {

  part(g, GEO.sphereLo, COL.white, 0, 0, 0, { scale: [0.22, 0.22, 0.22] });

}
function buildFireball() {
  const g = new THREE.Group();
  part(g, GEO.ico, 0xffa020, 0, 0, 0, { scale: [0.25, 0.25, 0.25], emissive: 0xff5500, ei: 2, outline: false, cast: false });
  return g;
}
function buildBoulder() {
  const g = new THREE.Group();
  const r = part(g, GEO.dodeca, 0x8b7e74, 0, 0, 0, { scale: [2.2, 2.2, 2.2] });
  for (let i = 0; i < 6; i++) part(r, GEO.box, 0x5e544c, Math.cos(i) * 0.7, Math.sin(i * 1.7) * 0.7, Math.sin(i) * 0.5, { scale: [0.3, 0.1, 0.3], rot: [i, i * 2, 0], outline: false });
  return g;
}

// Join chunks into one grid. Chunks are bottom-aligned: shorter chunks get empty rows on top.
function assembleLevel(def) {
  const H = Math.max(...def.chunks.map((c) => c.length));
  const rows = Array.from({ length: H }, () => '');
  for (const chunk of def.chunks) {
    const w = Math.max(...chunk.map((r) => r.length));
    const pad = H - chunk.length;
    for (let r = 0; r < H; r++) {
      const src = r < pad ? '' : chunk[r - pad];
      rows[r] += src.padEnd(w, ' ');
    }
  }
  const W = rows[0].length;
  // grid[y][x] with y = 0 at the bottom
  const grid = [];
  for (let y = 0; y < H; y++) grid.push(rows[H - 1 - y].split(''));
  return { W, H, grid };
}

// ===== 07-world: build a stage from its ASCII map: meshes, Rapier colliders, scenery, stage systems =====
const GROUP = { WORLD: 1, BLOCK: 2, PLAYER: 4, ENEMY: 8, ONEWAY: 16 };
const groups = (member, filter) => ((member & 0xffff) << 16) | (filter & 0xffff);
const SOLID = new Set(['#', '%']);
const TILE_DEPTH = 3;

class World {
  constructor(levelIndex) {
    this.index = levelIndex;
    this.def = LEVELS[levelIndex];
    this.theme = THEMES[this.def.theme];
    const { W, H, grid } = assembleLevel(this.def);
    this.W = W; this.H = H; this.grid = grid;
    this.group = new THREE.Group();
    this.dyn = new THREE.Group();
    this.group.add(this.dyn);
    this.physics = new RAPIER.World({ x: 0, y: -30, z: 0 });
    this.physics.timestep = 1 / 60;
    this.oneWay = new Map(); // collider handle -> top y
    this.colliderOwner = new Map(); // collider handle -> game object
    this.spikes = [];
    this.lava = [];
    this.windCols = new Set();
    this.cracked = [];
    this.signs = [];
    this.checkpoints = [];
    this.spawns = [];
    this.decoAnim = [];
    this.chase = null;
    this.arenaX = null;
    this.start = { x: 2, y: 3 };
    this.time = 0;
    this.build();
  }
  at(x, y) {
    if (y < 0 || y >= this.H || x < 0 || x >= this.W) return ' ';
    return this.grid[y][x];
  }
  solidAt(x, y) { return SOLID.has(this.at(x, y)) || this.at(x, y) === 'D'; }
  fixedBox(cx, cy, hw, hh, opts = {}) {
    const body = this.physics.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(cx, cy, 0));
    const desc = RAPIER.ColliderDesc.cuboid(hw, hh, 1).setFriction(opts.friction ?? 0.5)
      .setCollisionGroups(groups(opts.group ?? GROUP.WORLD, 0xffff));
    const col = this.physics.createCollider(desc, body);
    return { body, col };
  }
  build() {
    const { W, H, grid, theme } = this;
    // --- solid runs, merged into rectangles for the physics world ---
    const used = Array.from({ length: H }, () => new Array(W).fill(false));
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (used[y][x] || !SOLID.has(grid[y][x])) continue;
        let w = 1;
        while (x + w < W && SOLID.has(grid[y][x + w]) && !used[y][x + w]) w++;
        let h = 1;
        outer: while (y + h < H) {
          for (let k = 0; k < w; k++) if (!SOLID.has(grid[y + h][x + k]) || used[y + h][x + k]) break outer;
          h++;
        }
        for (let yy = y; yy < y + h; yy++) for (let k = 0; k < w; k++) used[yy][x + k] = true;
        this.fixedBox(x + w / 2, y + h / 2, w / 2, h / 2, { friction: theme.slip ? 0.05 : 0.5 });
      }
    }

      const c = grid[y][x];
      if (!SOLID.has(c)) continue;

      (c === '%' ? tiles.alt : tiles.side).push([x + 0.5, y + 0.5]);
      if (exposedTop && c === '#') tiles.top.push([x + 0.5, y + 1]);
      if (y === 0) for (let d = 1; d <= 6; d++) tiles.under.push([x + 0.5, -d + 0.5]);

    const m4 = new THREE.Matrix4();
    const mkInst = (list, geo, hex, sx, sy, sz, oy = 0, outline = true) => {

      mesh.receiveShadow = true;
      mesh.castShadow = true;
      list.forEach(([x, y], i) => {
        m4.makeScale(sx, sy, sz).setPosition(x, y + oy, 0);
        mesh.setMatrixAt(i, m4);
      });
      this.group.add(mesh);
      if (outline) {
        const hull = new THREE.InstancedMesh(geo, R.outlineMat, list.length);
        for (let i = 0; i < list.length; i++) { mesh.getMatrixAt(i, m4); hull.setMatrixAt(i, m4); }
        this.group.add(hull);
      }
      return mesh;
    };
    const tileGeo = new THREE.BoxGeometry(1.001, 1.001, 1);
    mkInst(tiles.side, tileGeo, theme.side, 1, 1, TILE_DEPTH);
    mkInst(tiles.alt, tileGeo, theme.alt, 1, 1, TILE_DEPTH);
    mkInst(tiles.under, tileGeo, theme.under, 1, 1, TILE_DEPTH, 0, false);
    const capGeo = new THREE.BoxGeometry(1.02, 0.28, 1);
    mkInst(tiles.top, capGeo, theme.top, 1, 1, TILE_DEPTH + 0.1, -0.1);
    // brick seams / snow lumps on top tiles for texture
    const lumps = [];
    for (const [x, y] of tiles.top) if (Math.random() < 0.5) lumps.push([x + rand(-0.3, 0.3), y]);
    if (lumps.length) {
      const lm = new THREE.InstancedMesh(GEO.sphereLo, toon(theme.top), lumps.length);
      lumps.forEach(([x, y], i) => { m4.makeScale(0.35, 0.18, 0.35).setPosition(x, y + 0.02, rand(-1.3, 1.3)); lm.setMatrixAt(i, m4); });

        } else if (c === 'D') {

          for (let k = 0; k < 3; k++) part(mesh, GEO.box, 0x3b2a1a, rand(-0.3, 0.3), rand(-0.3, 0.3), 0.51, { scale: [0.5, 0.05, 0.01], rot: [0, 0, rand(-1, 1)], outline: false });

        } else if (c === '^') {

        } else if (c === 'K') {

    }
    // lava visuals
    if (this.lava.length) {

      for (const l of this.lava) {

    }
    // pit liquid below everything
    const pit = new THREE.Mesh(new THREE.PlaneGeometry(this.W + 200, 40), this.liquidMat(theme.pitColor));
    pit.rotation.x = -Math.PI / 2;
    pit.position.set(this.W / 2, -0.4, -12);
    this.group.add(pit);
    this.pitMesh = pit;
    // chase setup

      this.chase.mesh.visible = false;

    }
    if (this.chaseStart && this.def.theme === 'volcano') {
      let x0 = Math.floor(this.chaseStart.x), x1 = x0;
      while (x0 > 0 && this.at(x0, this.chaseStart.y + 4) !== '%') x0--;
      while (x1 < this.W - 1 && this.at(x1, this.chaseStart.y + 4) !== '%') x1++;
      const lava = new THREE.Mesh(GEO.box, this.liquidMat([0xff4a10, 0xffc040], true));
      lava.scale.set(x1 - x0 + 1, 30, TILE_DEPTH + 0.4);
      lava.visible = false;
      this.dyn.add(lava);
      this.chase = { type: 'lava', x0: x0, x1: x1 + 1, active: false, done: false, level: this.chaseStart.y - 3, cap: 15, speed: 1.05, mesh: lava, start: this.chaseStart.y - 3 };
    }
    // automatic scenery along the ground
    const decoKinds = 0;
    void decoKinds;
    for (let x = 1; x < this.W - 1; x += 1) {
      let top = -1;
      for (let y = this.H - 1; y >= 0; y--) if (SOLID.has(this.grid[y][x])) { top = y + 1; break; }
      if (top < 0) continue;
      const r = Math.random();
      if (r < 0.16) this.addDeco(x + 0.5, top, rand(-1.3, -1.0), rand(0.7, 1.2));
      else if (r < 0.3) { const k = buildRock(theme.alt, rand(0.4, 0.9)); k.position.set(x + rand(0, 1), top, rand(-1.4, 1.4)); this.group.add(k); }
      else if (r < 0.45 && theme !== THEMES.volcano) this.addTuft(x + rand(0, 1), top, rand(-1.4, 1.4));

  }
  liquidMat(pair, emissive) {

    const wave = sin(positionWorld.x.mul(1.7).add(positionWorld.z.mul(0.9)).add(time.mul(2.2))).mul(0.5).add(0.5);

  addTuft(x, y, z) {

  }
  addDeco(x, y, z, s) {

    else if (kind === 'torch') d = buildTorch();
    else if (kind === 'pine') d = buildPine(rand(2.8, 4));

    if (t.back === 'sea') {

        far(GEO.sphere, 0xe8cf95, x, -3.6, -48, rand(14, 20), 2.5, 9, false);
      }
      for (let i = 0; i < 14; i++) { const p = buildPalm(rand(3, 5)); p.position.set(rand(0, W), -0.6, rand(-12, -6)); p.scale.setScalar(rand(1, 1.4)); g.add(p); this.decoAnim.push(p); }
    } else if (t.back === 'jungle') {
      for (let i = 0; i < 26; i++) {
        const x = rand(-10, W + 10), h = rand(10, 22);
        far(GEO.cyl, 0x4a3a2a, x, h / 2 - 2, rand(-30, -14), rand(0.5, 1), h, 1);
        far(GEO.sphere, pick([0x2f7a3d, 0x3a8f4a, 0x24683a]), x, h - 1, rand(-30, -16), rand(3, 6), rand(2, 4), 3);
      }
      for (let i = 0; i < 6; i++) {
        const x = rand(0, W);
        far(GEO.box, 0x7d8576, x, 3, -40, 6, 10, 6);
        far(GEO.box, 0x6d7566, x, 9, -40, 4.5, 2.5, 4.5);
        far(GEO.cone, 0x6d7566, x, 12, -40, 3, 3, 3);
      }
    } else if (t.back === 'peaks') {
      for (let i = 0; i < 14; i++) {
        const x = (i / 13) * W + rand(-8, 8), h = rand(18, 34), z = rand(-80, -45);
        far(GEO.cone, 0x7f93c9, x, h / 2 - 4, z, rand(10, 16), h, 10);
        far(GEO.cone, 0xffffff, x, h - 4 - h * 0.18, z + 0.6, rand(4, 6), h * 0.36, 4, false);
      }
      for (let i = 0; i < 18; i++) { const p = buildPine(rand(3, 5)); p.position.set(rand(0, W), -0.5, rand(-14, -6)); g.add(p); }
    } else {
      for (let i = 0; i < 10; i++) {

        far(GEO.cone, 0xff6a20, x, h - 4.5, z + 1, 2, 2, 2, false);

  breakCracked(cr, game) {
    if (!cr.alive) return;
    cr.alive = false;

    audio.sfx('break');

  update(dt) {
    this.time += dt;
    for (const d of this.decoAnim) {
      if (d.userData.sway) d.userData.sway.rotation.z = Math.sin(this.time * 1.2 + d.position.x) * 0.06;
      if (d.userData.flame) {
        const f = d.userData.flame;
        f.scale.y = 0.45 + Math.sin(this.time * 18 + d.position.x) * 0.08;
        if (d.userData.light) d.userData.light.intensity = 5 + Math.sin(this.time * 23 + d.position.x * 3) * 1.2;
      }
      if (d.userData.drift) { d.position.x += d.userData.drift * dt; if (d.position.x > this.W + 30) d.position.x = -30; }
    }
  }
  dispose() {
    this.group.traverse((o) => { if (o.isInstancedMesh) o.dispose(); });
    this.physics.free();
  }
}

// ===== 08-entities: player (Rapier character controller), enemies, items, crates, platforms, hazards =====
const PHYS = {
  gravity: 38, jumpV: 16.4, jumpCut: 0.45, maxFall: 22, run: 7.4, dash: 10.6, accel: 62, decel: 55, airAccel: 38,
  slipAccel: 15, slipDecel: 3.2, coyote: 0.1, buffer: 0.13, springV: 23.5, stompV: 12, stompHoldV: 16.5,
};
const PW = 0.32, PH = 0.62; // player half extents

// Tile-grid collision used by enemies, pickups and projectiles (cheap and deterministic).
function tileSolid(world, x, y, falling, feetY) {
  const tx = Math.floor(x), ty = Math.floor(y);
  const c = world.at(tx, ty);
  if (SOLID.has(c)) return true;
  if (c === 'D') return world.cracked.some((o) => o.alive && o.x === tx && o.y === ty);
  if (c === '^') return y - ty < 0.5;
  if (c === '-' && falling && feetY !== undefined && feetY >= ty + 0.7) return y - ty > 0.7;
  return false;
}
function moveBox(world, o, dt) {
  // o: {x, y (bottom), w, h, vx, vy}; returns {hitX, hitY, ground}
  const out = { hitX: false, ground: false, ceil: false };
  const hw = o.w / 2;
  let nx = o.x + o.vx * dt;
  const ys = [o.y + 0.05, o.y + o.h * 0.5, o.y + o.h - 0.05];
  const edge = nx + (o.vx > 0 ? hw : -hw);
  if (o.vx !== 0 && ys.some((yy) => tileSolid(world, edge, yy))) {
    out.hitX = true;
    nx = o.vx > 0 ? Math.floor(edge) - hw - 0.001 : Math.floor(edge) + 1 + hw + 0.001;
  }
  o.x = nx;
  let ny = o.y + o.vy * dt;
  const xs = [o.x - hw + 0.05, o.x, o.x + hw - 0.05];
  if (o.vy <= 0) {
    if (xs.some((xx) => tileSolid(world, xx, ny, true, o.y))) {
      const ty = Math.floor(ny);
      const c = world.at(Math.floor(o.x), ty);
      ny = c === '^' ? ty + 0.5 : c === '-' ? ty + 1 : ty + 1;
      out.ground = true;
    }
  } else if (xs.some((xx) => tileSolid(world, xx, ny + o.h))) {
    ny = Math.floor(ny + o.h) - o.h - 0.001;
    out.ceil = true;
  }
  o.y = ny;
  return out;
}
function groundAhead(world, x, y) {
  for (let d = 0; d < 3; d++) if (tileSolid(world, x, y - 0.1 - d, true, y)) return true;
  return false;
}

class Player {
  constructor(game, x, y) {
    this.game = game;
    this.model = buildDuck();
    this.model.scale.setScalar(1.05);
    game.world.dyn.add(this.model);
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.facing = 1;
    this.grounded = false;
    this.coyote = 0; this.jumpBuf = 0;
    this.kickT = 0; this.kickCd = 0; this.airKick = false; this.kickHit = new Set();
    this.hurtT = 0; this.invuln = 0;
    this.hp = 3; this.maxHp = 3;
    this.temper = 0; this.tantrumT = 0;
    this.squash = 0; this.squashV = 0;
    this.t = 0;
    this.dead = false; this.deadT = 0;
    this.onPlat = null;
    this.lastSafe = { x, y };
    this.safeT = 0;
    this.airT = 0;
    this.wasGrounded = true;
    this.cheat = false;
    this.cheer = 0;
    const pw = game.world.physics;
    this.body = pw.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(x, y + PH + 0.02, 0));
    this.col = pw.createCollider(RAPIER.ColliderDesc.cuboid(PW, PH, 0.3).setCollisionGroups(groups(GROUP.PLAYER, GROUP.WORLD | GROUP.BLOCK | GROUP.ONEWAY)), this.body);
    this.cc = pw.createCharacterController(0.02);
    this.cc.setUp({ x: 0, y: 1, z: 0 });
    this.cc.setSlideEnabled(true);
    this.cc.setMaxSlopeClimbAngle((50 * Math.PI) / 180);
    this.cc.setApplyImpulsesToDynamicBodies(false);
    this.cc.enableSnapToGround(0.15);
  }
  get box() { return { x: this.x, y: this.y + PH, w: PW * 2, h: PH * 2 }; }
  teleport(x, y) {
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.body.setTranslation({ x, y: y + PH + 0.02, z: 0 }, true);
    this.body.setNextKinematicTranslation({ x, y: y + PH + 0.02, z: 0 });
  }
  get speedMax() { return this.tantrumT > 0 ? 11.5 : this.dashing ? PHYS.dash : PHYS.run; }
  update(dt, ctl) {
    const g = this.game, w = g.world;
    this.t += dt;
    if (this.dead) { this.deadT += dt; this.vy -= PHYS.gravity * 0.6 * dt; this.y += this.vy * dt; this.model.rotation.z += dt * 6; this.sync(); return; }
    this.invuln = Math.max(0, this.invuln - dt);
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.kickCd = Math.max(0, this.kickCd - dt);
    this.cheer = Math.max(0, this.cheer - dt);
    const frozen = g.cutscene || this.cheer > 0;
    const mx = frozen ? 0 : ctl.mx;
    this.dashing = !frozen && ctl.dash;
    const slip = w.theme.slip && this.grounded;
    // horizontal
    if (this.hurtT <= 0) {
      const target = mx * this.speedMax;
      let a;
      if (this.grounded) a = Math.abs(mx) > 0.05 ? (slip ? PHYS.slipAccel : PHYS.accel) : (slip ? PHYS.slipDecel : PHYS.decel);
      else a = PHYS.airAccel;
      if (slip && Math.sign(target) !== Math.sign(this.vx) && Math.abs(mx) > 0.05) a *= 1.4;
      this.vx = approach(this.vx, target, a * dt);
      if (Math.abs(mx) > 0.15 && this.kickT <= 0) this.facing = Math.sign(mx);
    }
    // wind gusts
    if (g.wind.dir && w.windCols.has(Math.floor(this.x))) this.vx += g.wind.dir * (this.grounded ? 9 : 16) * dt;
    // jumping
    if (!frozen && ctl.jumpPressed) this.jumpBuf = PHYS.buffer;
    this.jumpBuf = Math.max(0, this.jumpBuf - dt);
    this.coyote = this.grounded ? PHYS.coyote : Math.max(0, this.coyote - dt);
    if (this.jumpBuf > 0 && this.coyote > 0) {
      this.vy = PHYS.jumpV + Math.abs(this.vx) * 0.12;
      this.jumpBuf = 0; this.coyote = 0; this.grounded = false;
      this.squashV = -6;
      audio.sfx('jump');
      g.fx.emit(this.x, this.y + 0.1, 0, 6, { color: 0xffffff, speed: 2.5, size: 0.12, life: 0.4, gravity: 2, up: 1 });
    }
    if (!ctl.jump && this.vy > 4 && !this.springing) this.vy *= Math.pow(PHYS.jumpCut, dt * 20);
    if (this.vy <= 0) this.springing = false;
    // kick
    if (!frozen && ctl.kickPressed && this.kickCd <= 0 && this.hurtT <= 0) {
      this.kickT = 0.3; this.kickCd = 0.36; this.airKick = !this.grounded; this.kickHit.clear();
      audio.sfx('whiff');
      if (this.airKick) { this.vx += this.facing * 2.5; this.vy = Math.max(this.vy, 3); }
    }
    if (this.kickT > 0) {

// ---------------- items ----------------

      this.popT -= dt;
      this.vy -= 25 * dt;
      const o = { x: this.x, y: this.y - 0.3, w: 0.4, h: 0.5, vx: this.vx, vy: this.vy };
      const res = moveBox(this.game.world, o, dt);
      this.x = o.x; this.y = o.y + 0.3; this.vx = res.hitX ? -this.vx * 0.5 : this.vx * 0.98; this.vy = res.ground ? Math.abs(this.vy) * 0.4 : o.vy;
    }
    const m = this.model;
    m.position.set(this.x, this.y + Math.sin(this.t * 3) * 0.12, 0);
    m.rotation.y = this.t * (this.kind === 'star' ? 2.5 : 1.6);
    if (this.kind === 'gem') this.game.fx.emit(this.x, this.y, 0, Math.random() < 0.3 ? 1 : 0, { color: [0xffffff, this.game.world.def.gem], speed: 2, size: 0.1, life: 0.6, gravity: -1 });
  }
  remove() { this.game.world.dyn.remove(this.model); }
}

// ---------------- crates (Rapier dynamic bodies) ----------------
class Crate {
  constructor(game, x, y) {
    this.game = game;
    this.home = { x, y };
    this.model = buildBlock(game.world.theme);
    game.world.dyn.add(this.model);
    this.alive = true;
    this.make(x, y);
    this.hitSet = new Set();
  }
  make(x, y) {
    const w = this.game.world.physics;
    this.body = w.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(x, y + 0.5, 0).lockRotations().enabledTranslations(true, true, false).setCcdEnabled(true).setLinearDamping(0));
    this.col = w.createCollider(RAPIER.ColliderDesc.cuboid(0.47, 0.47, 0.6).setFriction(0).setFrictionCombineRule(RAPIER.CoefficientCombineRule.Min).setRestitution(0).setDensity(2)
      .setCollisionGroups(groups(GROUP.BLOCK, GROUP.WORLD | GROUP.BLOCK | GROUP.PLAYER | GROUP.ONEWAY)), this.body);
    this.game.world.colliderOwner.set(this.col.handle, this);
  }
  get pos() { return this.body.translation(); }
  get box() { const p = this.pos; return { x: p.x, y: p.y, w: 0.94, h: 0.94 }; }
  kick(dir) {
    this.body.setLinvel({ x: dir * 14, y: this.body.linvel().y, z: 0 }, true);
    this.dir = dir;
    this.hitSet.clear();
    audio.sfx('block');
    this.game.fx.emit(this.pos.x - dir * 0.5, this.pos.y - 0.4, 0, 8, { color: 0xe8d8b0, speed: 3, size: 0.12, life: 0.35, gravity: 3 });
  }
  get sliding() { return Math.abs(this.body.linvel().x) > 3; }
  update(dt) {
    const g = this.game, w = g.world;
    const p = this.pos, v = this.body.linvel();
    // keep sliding crates at speed until they hit something (ice-hockey crates)
    if (this.dir && Math.abs(v.x) > 2) this.body.setLinvel({ x: this.dir * 14, y: v.y, z: 0 }, true);
    else if (Math.abs(v.x) <= 2) this.dir = 0;
    if (this.sliding) {
      for (const cr of w.cracked) {
        if (cr.alive && Math.abs(cr.x + 0.5 - (p.x + sign(v.x) * 0.55)) < 0.45 && Math.abs(cr.y + 0.5 - p.y) < 0.7) { w.breakCracked(cr, g); this.body.setLinvel({ x: v.x * 0.9, y: v.y, z: 0 }, true); }
      }
      if (Math.random() < 0.3) g.fx.emit(p.x - sign(v.x) * 0.5, p.y - 0.45, 0, 1, { color: 0xe8d8b0, speed: 1, size: 0.1, life: 0.3, gravity: 1 });
    }
    if (p.y < -4) {
      g.fx.emit(this.home.x, this.home.y + 0.5, 0, 14, { color: 0xffffff, speed: 4, size: 0.14, life: 0.4 });
      this.body.setTranslation({ x: this.home.x, y: this.home.y + 0.5, z: 0 }, true);
      this.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
      this.dir = 0;
    }
    this.model.position.set(p.x, p.y, 0);
    this.model.rotation.z = this.sliding ? Math.sin(g.time * 40) * 0.03 : 0;
  }
  destroy() {
    if (!this.alive) return;
    this.alive = false;
    this.game.world.physics.removeRigidBody(this.body);
    this.game.world.dyn.remove(this.model);
    const p = this.model.position;
    this.game.fx.emit(p.x, p.y, 0, 18, { color: [this.game.world.theme.blockColor, this.game.world.theme.blockTrim], speed: 6, size: 0.18, life: 0.7, gravity: 18 });
    audio.sfx('break');
  }
}

// ---------------- moving / falling ledges (Rapier kinematic bodies) ----------------
class Platform {
  constructor(game, kind, x, y) {
    this.game = game; this.kind = kind; this.isPlatform = true;
    const wide = kind === 'f' ? 2 : 3;
    this.hw = wide / 2;
    this.hx = kind === 'f' ? x + 0.5 : x; this.hy = y + 0.8;
    this.x = this.hx; this.y = this.hy;
    this.t = rand(0, 6);
    this.delta = { x: 0, y: 0 };
    this.state = 'idle'; this.timer = 0; this.vy = 0;
    const w = game.world.physics;
    this.body = w.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(this.x, this.y, 0));
    this.col = w.createCollider(RAPIER.ColliderDesc.cuboid(this.hw, 0.2, 1).setCollisionGroups(groups(GROUP.WORLD, 0xffff)), this.body);
    game.world.colliderOwner.set(this.col.handle, this);
    this.model = new THREE.Group();
    const th = game.world.theme;
    const hex = kind === 'f' ? (th === THEMES.frost ? 0xcfefff : th === THEMES.volcano ? 0x7a5a5a : 0xd9b27a) : 0xff9a3c;
    part(this.model, GEO.box, hex, 0, 0, 0, { scale: [wide, 0.4, 1.6] });
    if (kind !== 'f') for (const s of [-1, 1]) part(this.model, GEO.cyl, COL.gold, s * (this.hw - 0.2), 0.05, 0.81, { scale: [0.12, 0.05, 0.12], rot: [Math.PI / 2, 0, 0], outline: false });
    else for (let k = 0; k < 3; k++) part(this.model, GEO.box, 0x3b2a1a, -0.6 + k * 0.6, 0, 0.81, { scale: [0.04, 0.3, 0.02], outline: false });
    game.world.dyn.add(this.model);
  }
  update(dt) {
    this.t += dt;
    const ox = this.x, oy = this.y;
    if (this.kind === 'M') this.x = this.hx + Math.sin(this.t * 0.7) * 3;
    else if (this.kind === 'V') this.y = this.hy + Math.sin(this.t * 0.8) * 2.5;
    else {
      if (this.state === 'idle' && this.stood) { this.state = 'shake'; this.timer = 0.5; audio.sfx('crumble'); }
      if (this.state === 'shake') { this.timer -= dt; this.shakeX = Math.sin(this.t * 60) * 0.06; if (this.timer <= 0) { this.state = 'fall'; this.vy = 0; } }
      else this.shakeX = 0;
      if (this.state === 'fall') { this.vy -= 25 * dt; this.y += this.vy * dt; if (this.y < -8) { this.state = 'gone'; this.timer = 3; } }
      if (this.state === 'gone') { this.timer -= dt; if (this.timer <= 0) { this.state = 'idle'; this.y = this.hy; this.game.fx.emit(this.x, this.y, 0, 10, { color: 0xffffff, speed: 3, size: 0.12, life: 0.4 }); } }
    }
    this.stood = false;
    this.delta.x = this.x - ox; this.delta.y = this.y - oy;
    this.body.setNextKinematicTranslation({ x: this.x, y: this.y, z: 0 });
    this.model.position.set(this.x + (this.shakeX || 0), this.y, 0);
    this.model.visible = this.state !== 'gone';
  }
}

// ---------------- springs, chests, icicles ----------------
class Spring {
  constructor(game, x, y) {
    this.game = game; this.x = x; this.y = y; this.t = 0; this.boing = 0;
    this.model = buildSpring(game.world.theme);
    this.model.position.set(x, y, 0);
    game.world.dyn.add(this.model);
  }
  update(dt) {
    this.boing = Math.max(0, this.boing - dt);
    const cap = this.model.userData.cap;
    const k = this.boing > 0 ? Math.sin((1 - this.boing / 0.5) * Math.PI * 4) * this.boing : 0;
    cap.scale.set(0.5 - k * 0.3, 0.22 + k * 0.6, 0.5 - k * 0.3);
  }
}
class Chest {
  constructor(game, x, y) {
    this.game = game; this.x = x; this.y = y; this.open = false; this.t = 0;
    this.model = buildChest();
    this.model.position.set(x, y, 0);
    this.model.rotation.y = -0.3;
    game.world.dyn.add(this.model);
  }
  get box() { return { x: this.x, y: this.y + 0.35, w: 0.9, h: 0.7 }; }
  openUp(dir) {
    if (this.open) return;
    this.open = true;
    const g = this.game;
    audio.sfx('chest');
    g.addScore(200, this.x, this.y + 1.2);
    for (let i = 0; i < 6; i++) g.spawnItem('star', this.x, this.y + 0.8, { vx: rand(-3, 3) + dir, vy: rand(8, 12) });
    if (g.player.hp < g.player.maxHp) g.spawnItem('heart', this.x, this.y + 0.8, { vx: dir * 2, vy: 10 });
    else g.spawnItem('berry', this.x, this.y + 0.8, { vx: dir * 2, vy: 10 });
    g.fx.emit(this.x, this.y + 0.7, 0, 20, { color: [COL.gold, 0xffffff], speed: 6, size: 0.14, life: 0.6, up: 3 });
  }
  update(dt) {
    this.t += dt;
    const lid = this.model.userData.lid;
    lid.rotation.z = damp(lid.rotation.z, this.open ? 1.9 : Math.sin(this.t * 2) * 0.03, 8, dt);
  }
}
class Icicle {
  constructor(game, x, y) {
    this.game = game; this.hx = x; this.hy = y + 1; this.x = x; this.y = this.hy; this.state = 'hang'; this.timer = 0; this.vy = 0;
    this.model = new THREE.Group();
    part(this.model, GEO.cone, 0xbfefff, 0, -0.45, 0, { scale: [0.22, 0.9, 0.22], rot: [Math.PI, 0, 0], emissive: 0x3388aa, ei: 0.3 });
    game.world.dyn.add(this.model);
  }
  get box() { return { x: this.x, y: this.y - 0.5, w: 0.4, h: 0.9 }; }
  update(dt) {
    const g = this.game, pl = g.player;
    if (this.state === 'hang' && Math.abs(pl.x - this.x) < 1.3 && pl.y < this.y && pl.y > this.y - 7) { this.state = 'shake'; this.timer = 0.35; audio.sfx('icicle'); }
    if (this.state === 'shake') { this.timer -= dt; this.model.rotation.z = Math.sin(this.timer * 80) * 0.06; if (this.timer <= 0) this.state = 'fall'; }
    if (this.state === 'fall') {
      this.vy -= 30 * dt; this.y += this.vy * dt;
      if (tileSolid(g.world, this.x, this.y - 0.9)) {
        this.state = 'gone'; this.timer = 5;
        g.fx.emit(this.x, this.y - 0.9, 0, 14, { color: [0xbfefff, 0xffffff], speed: 5, size: 0.13, life: 0.5 });
        audio.sfx('icicle');
      }
    }
    if (this.state === 'gone') { this.timer -= dt; if (this.timer <= 0) { this.state = 'hang'; this.y = this.hy; this.vy = 0; } }
    this.model.visible = this.state !== 'gone';
    this.model.position.set(this.x, this.y, 0);
  }
}

// ===== 09-bosses: Captain Pinchley, Totem Tonga, Baron Blubberstorm, The Great Pufftoa =====
class Boss {
  constructor(game, x0, x1, floor) {
    this.game = game; this.x0 = x0; this.x1 = x1; this.floor = floor;
    this.state = 'wait'; this.timer = 0; this.t = 0;
    this.vx = 0; this.vy = 0; this.facing = -1; this.invuln = 0; this.flash = 0;
    this.defeated = false;
    this.stars = new THREE.Group();
    for (let i = 0; i < 4; i++) part(this.stars, GEO.star, COL.gold, Math.cos(i * 1.57) * 0.8, 0, Math.sin(i * 1.57) * 0.8, { scale: [0.18, 0.18, 0.18], emissive: 0x996600, ei: 0.5, outline: false });
    this.stars.visible = false;
    game.world.dyn.add(this.stars);
  }
  get vulnerable() { return false; }
  begin() { this.state = 'idle'; this.timer = 1; }
  set(state, timer) { this.state = state; this.timer = timer; }
  damage(dir) {
    if (this.invuln > 0 || this.defeated) return false;
    const g = this.game;
    this.hp--;
    this.invuln = 1.0;
    this.flash = 0.4;
    audio.sfx('bosshit');
    input.rumble(1, 0.7, 300);
    addShake(0.6);
    g.hitStop = 0.12;
    g.addScore(1000, this.x, this.y + this.h + 0.5);
    g.fx.emit(this.x, this.y + this.h * 0.6, 0.5, 30, { color: [0xffffff, 0xffe066, 0xff6a5a], speed: 9, size: 0.2, life: 0.6 });
    g.hud.dirty = true;
    if (this.hp <= 0) { this.defeated = true; g.bossDefeated(this); }
    else this.onHurt(dir);
    return true;
  }
  onHurt() {}
  contact() {
    const pl = this.game.player;
    if (this.defeated || this.state === 'wait') return;
    if (overlap(pl.box, this.hurtBox || this.box)) {
      if (this.vulnerable && pl.vy < 0 && pl.y > this.y + this.h * 0.6) { this.onStomp(); return; }
      pl.hurt(this.x);
    }
  }
  onStomp() {
    const pl = this.game.player;
    pl.vy = PHYS.stompV;
    if (this.vulnerable) this.damage(sign(pl.x - this.x) * -1);
  }
  onKick(dir) { if (this.vulnerable) return this.damage(dir); this.clang(dir); return false; }
  clang(dir) {
    const pl = this.game.player;
    audio.sfx('thud');
    pl.vx = -dir * 6;
    this.game.fx.emit(pl.x + dir * 0.7, pl.y + 0.8, 0, 6, { color: 0xffffff, speed: 4, size: 0.12, life: 0.3 });
    if (!this.tipShown || this.game.time - this.tipShown > 6) { this.tipShown = this.game.time; this.game.toast(this.game.world.def.bossTip, 3.2, 3.2); }
  }
  showStars(on) {
    this.stars.visible = on;
    if (on) { this.stars.position.set(this.x, this.y + this.h + 0.3, 0.3); this.stars.rotation.y = this.t * 5; }
  }
  common(dt) {
    this.t += dt;
    this.invuln = Math.max(0, this.invuln - dt);
    this.flash = Math.max(0, this.flash - dt);
    this.timer -= dt;
    const m = this.model;
    if (m) {
      m.visible = !(this.flash > 0 && Math.floor(this.flash * 20) % 2);
    }
  }
  clampArena() {
    const minX = this.x0 + 1 + this.w / 2, maxX = this.x1 - this.w / 2;
    let hit = false;
    if (this.x < minX) { this.x = minX; hit = true; }
    if (this.x > maxX) { this.x = maxX; hit = true; }
    return hit;
  }
  remove() { this.game.world.dyn.remove(this.model); this.game.world.dyn.remove(this.stars); }
}

class CrabBoss extends Boss {
  constructor(g, x0, x1, floor) {
    super(g, x0, x1, floor);
    this.name = 'Captain Pinchley'; this.hp = this.maxHp = 3;
    this.model = buildCrab(0xe8443a, false, 2.6);
    part(this.model, GEO.cone, 0x1d1424, -0.05, 1.02, 0, { scale: [0.35, 0.3, 0.35] }); // pirate hat
    part(this.model, GEO.cyl, 0x1d1424, -0.05, 0.92, 0, { scale: [0.45, 0.04, 0.45] });
    g.world.dyn.add(this.model);
    this.x = x1 - 5; this.y = floor; this.w = 2.4; this.h = 1.7;
  }
  get box() { return { x: this.x, y: this.y + this.h / 2, w: this.w, h: this.h }; }
  get vulnerable() { return this.state === 'stunned'; }
  update(dt) {
    this.common(dt);
    const pl = this.game.player, dx = pl.x - this.x;
    const speedUp = 1 + (this.maxHp - this.hp) * 0.25;
    switch (this.state) {
      case 'wait': break;
      case 'idle': if (this.timer <= 0) this.set('walk', 1.6); break;
      case 'walk':
        this.facing = sign(dx);
        this.x += this.facing * 2.4 * speedUp * dt;
        if (Math.abs(dx) < 2.6 && this.timer < 1.2) this.set('snap', 0.7);
        else if (this.timer <= 0) { this.set('windup', 0.7); audio.sfx('roar'); }
        break;
      case 'snap':
        if (this.timer <= 0) this.set('walk', 1.4);
        break;
      case 'windup':
        this.facing = sign(dx);
        if (this.timer <= 0) { this.set('charge', 5); this.chargeDir = this.facing; }
        break;
      case 'charge':
        this.x += this.chargeDir * 10.5 * speedUp * dt;
        if (Math.random() < 0.5) this.game.fx.emit(this.x - this.chargeDir * 1.2, this.y + 0.1, 0, 1, { color: 0xe8d8b0, speed: 3, size: 0.16, life: 0.4, gravity: 3 });
        if (this.clampArena()) {
          this.set('stunned', 2.4);
          audio.sfx('thud'); addShake(0.7); input.rumble(0.9, 0.5, 250);
          this.game.fx.emit(this.x + this.chargeDir * 1.2, this.y + 1, 0, 20, { color: [0xffffff, 0xe8d8b0], speed: 6, size: 0.18, life: 0.5 });
          for (let i = 0; i < 2 + this.maxHp - this.hp; i++) this.game.spawnProjectile('coconut', rand(this.x0 + 3, this.x1 - 3), this.floor + 11, 0, 0, this);
        }
        break;
      case 'stunned': if (this.timer <= 0) this.set('walk', 1.2); break;
      case 'hurt': this.x += this.vx * dt; this.vx = approach(this.vx, 0, 12 * dt); this.clampArena(); if (this.timer <= 0) this.set('windup', 0.5); break;
      default: break;
    }
    this.clampArena();
    this.showStars(this.state === 'stunned');
    // claws reach out while snapping
    this.hurtBox = this.state === 'snap' && this.timer < 0.35 ? { x: this.x + this.facing * 1.2, y: this.y + 1, w: this.w + 1.4, h: 1.6 } : this.box;
    this.contact();
    const m = this.model, r = m.userData.rig;
    m.position.set(this.x, this.y, 0);
    m.rotation.y = -Math.PI / 2 + this.facing * 0.5;
    const b = r.body;
    b.rotation.set(0, 0, 0);
    b.position.y = this.state === 'walk' || this.state === 'charge' ? Math.abs(Math.sin(this.t * 14)) * 0.06 : 0;
    const raise = this.state === 'windup' || this.state === 'snap' ? -1.2 + Math.sin(this.t * 30) * 0.2 : Math.sin(this.t * 5) * 0.25;
    for (const c of r.claws) c.rotation.z = raise;
    if (this.state === 'stunned') b.rotation.x = Math.sin(this.t * 8) * 0.12;
  }
  onHurt(dir) { this.set('hurt', 0.8); this.vx = dir * 8; }
}

class TotemBoss extends Boss {
  constructor(g, x0, x1, floor) {
    super(g, x0, x1, floor);
    this.name = 'Totem Tonga'; this.hp = this.maxHp = 3;
    this.model = new THREE.Group();
    this.heads = [];
    for (let i = 0; i < 3; i++) {
      const hd = buildTiki([0xa86b3c, 0x8a5a33, 0xc07a44][i], 1);
      hd.scale.setScalar(1.7);
      hd.position.y = i * 1.55;
      if (i < 2) hd.traverse((o) => { if (o.isMesh && o.geometry === GEO.cone) o.visible = false; });
      this.model.add(hd);
      this.heads.push(hd);
    }
    g.world.dyn.add(this.model);
    this.x = x1 - 6; this.y = floor; this.w = 1.3; this.vy = 0; this.cratesT = 2;
  }
  get h() { return this.hp * 1.55; }
  get box() { return { x: this.x, y: this.y + this.h / 2, w: this.w, h: this.h }; }
  get vulnerable() { return false; }
  update(dt) {
    this.common(dt);
    const g = this.game, pl = g.player, dx = pl.x - this.x;
    const fast = 1 + (this.maxHp - this.hp) * 0.3;
    if (this.state !== 'wait') {
      this.cratesT -= dt;
      const inArena = g.crates.filter((c) => c.alive && c.arena).length;
      if (this.cratesT <= 0 && inArena < 2) {
        this.cratesT = 3.5;
        const c = g.spawnCrate(clamp(pl.x + rand(-4, 4), this.x0 + 2, this.x1 - 2), this.floor + 9);
        c.arena = true;
        g.fx.emit(c.pos.x, c.pos.y, 0, 10, { color: 0xffffff, speed: 3, size: 0.14, life: 0.4 });
      }
    }
    switch (this.state) {
      case 'wait': break;
      case 'idle': if (this.timer <= 0) this.set('hop', 0.3); break;
      case 'hop':
        if (this.timer <= 0 && this.y <= this.floor + 0.01) {
          this.hops = (this.hops || 0) + 1;
          if (this.hops % 4 === 0) { this.set('spit', 1.2); this.spat = 0; break; }
          this.facing = sign(dx);
          this.vx = this.facing * 3.4 * fast; this.vy = 11;
          this.timer = 0.9 / fast;
          audio.sfx('thud');
        }
        break;
      case 'spit':
        this.facing = sign(dx);
        if (this.timer < 0.9 - this.spat * 0.3 && this.spat < 3) {
          this.spat++;
          const tt = 1.1;
          g.spawnProjectile('fireball', this.x + this.facing, this.y + this.h - 0.6, clamp(dx / tt, -8, 8) + rand(-1, 1), 0, this);
          audio.sfx('fire');
        }
        if (this.timer <= 0) this.set('hop', 0.4);
        break;
      default: break;
    }
    if (this.state !== 'wait') {
      this.vy -= 30 * dt;
      this.y += this.vy * dt;
      this.x += this.vx * dt;
      if (this.y <= this.floor) {
        if (this.vy < -5) { addShake(0.25); g.fx.emit(this.x, this.floor + 0.1, 0, 10, { color: 0xd8c8a8, speed: 4, size: 0.16, life: 0.4, angle: Math.PI / 2, spread: 1.4, gravity: 4 }); }
        this.y = this.floor; this.vy = 0; this.vx = 0;
      }
      if (this.clampArena()) this.vx = -this.vx;
    }
    // crate impacts
    for (const c of g.crates) {
      if (!c.alive || !c.sliding || c.hitSet.has(this)) continue;
      if (overlap(c.box, this.box)) {
        c.hitSet.add(this);
        const dir = sign(c.body.linvel().x);
        c.destroy();
        if (this.damage(dir)) this.popHead(dir);
      }
    }
    this.contact();
    const m = this.model;
    m.position.set(this.x, this.y, 0);
    m.rotation.y = this.facing > 0 ? -0.5 : Math.PI + 0.5;
    this.heads.forEach((hd, i) => {
      hd.rotation.z = Math.sin(this.t * 6 + i) * 0.06;
      hd.scale.y = 1.7 * (1 + (this.vy > 0 ? 0.08 : 0) - (this.state === 'spit' ? Math.abs(Math.sin(this.t * 10)) * 0.08 : 0));
    });
  }
  popHead(dir) {
    const hd = this.heads.pop();
    if (!hd) return;
    const wp = new THREE.Vector3();
    hd.getWorldPosition(wp);
    this.model.remove(hd);
    this.game.world.dyn.add(hd);
    hd.position.copy(wp);
    this.game.debris.push({ obj: hd, vx: dir * 6, vy: 10, spin: dir * 8, life: 2 });
    const top = this.heads[this.heads.length - 1];
    if (top) top.traverse((o) => { if (o.isMesh && o.geometry === GEO.cone) o.visible = true; });
    this.game.toast(['', 'One head left!', 'Two heads left!'][this.hp] || '', 1.4);
  }
  onKick(dir) { this.clang(dir); return false; }
  onStomp() { const pl = this.game.player; pl.vy = PHYS.stompV; audio.sfx('thud'); this.clang(sign(this.x - pl.x)); }
}

class WalrusBoss extends Boss {
  constructor(g, x0, x1, floor) {
    super(g, x0, x1, floor);
    this.name = 'Baron Blubberstorm'; this.hp = this.maxHp = 4;
    this.model = buildWalrus();
    this.model.scale.setScalar(0.95);
    g.world.dyn.add(this.model);
    this.x = x1 - 6; this.y = floor; this.w = 2.8; this.h = 2.5; this.cycle = 0;
  }
  get box() { return { x: this.x, y: this.y + this.h / 2, w: this.w, h: this.h }; }
  get vulnerable() { return this.state === 'dizzy'; }
  update(dt) {
    this.common(dt);
    const g = this.game, pl = g.player, dx = pl.x - this.x;
    const angry = this.hp <= 2;
    switch (this.state) {
      case 'wait': break;
      case 'idle':
        this.facing = sign(dx);
        if (this.timer <= 0) {
          this.cycle++;
          if (this.cycle % 3 === 1) { this.set('throw', 1.6); this.thrown = 0; }
          else if (this.cycle % 3 === 2 && angry) { this.set('pound', 1.4); this.vy = 15; this.vx = clamp(dx, -6, 6) * 0.8; audio.sfx('roar'); }
          else { this.set('windup', 0.8); audio.sfx('roar'); }
        }
        break;
      case 'throw':
        this.facing = sign(dx);
        if (this.timer < 1.4 - this.thrown * 0.4 && this.thrown < (angry ? 4 : 3)) {
          this.thrown++;
          const tt = 1 + this.thrown * 0.15;
          g.spawnProjectile('snowball', this.x + this.facing * 1.2, this.y + 2.4, clamp((dx + rand(-2, 2)) / tt, -10, 10), 8 + this.thrown, this);
          audio.sfx('throw');
        }
        if (this.timer <= 0) this.set('idle', 0.6);
        break;
      case 'windup':
        this.facing = sign(dx);
        if (this.timer <= 0) { this.set('slide', 5); this.slideDir = this.facing; }
        break;
      case 'slide':
        this.x += this.slideDir * (angry ? 13 : 11) * dt;
        if (Math.random() < 0.6) g.fx.emit(this.x - this.slideDir * 1.5, this.y + 0.1, 0, 1, { color: 0xffffff, speed: 3, size: 0.18, life: 0.4, gravity: 2 });
        if (this.clampArena()) {
          this.set('dizzy', 2.5);
          addShake(0.8); audio.sfx('thud'); input.rumble(1, 0.6, 300);
          for (let i = 0; i < 3; i++) g.spawnProjectile('snowball', rand(this.x0 + 3, this.x1 - 3), this.floor + 11, 0, 0, this);
        }
        break;
      case 'pound':
        this.vy -= 30 * dt; this.y += this.vy * dt; this.x += this.vx * dt; this.clampArena();
        if (this.y <= this.floor && this.vy < 0) {
          this.y = this.floor; this.vy = 0;
          addShake(0.7); audio.sfx('thud');
          for (const d of [-1, 1]) g.spawnProjectile('icewave', this.x + d * 1.6, this.floor + 0.05, d * 7, 0, this);
          this.set('idle', 1.0);
        }
        break;
      case 'dizzy': if (this.timer <= 0) this.set('idle', 0.8); break;
      case 'hurt': this.x += this.vx * dt; this.vx = approach(this.vx, 0, 10 * dt); this.clampArena(); if (this.timer <= 0) this.set('idle', 0.4); break;
      default: break;
    }
    this.showStars(this.state === 'dizzy');
    if (this.stars.visible) this.stars.position.set(this.x + this.facing * 1, this.y + 3.1, 0.3);
    this.contact();
    const m = this.model, r = m.userData.rig;
    m.position.set(this.x, this.y, 0);
    m.rotation.y = this.facing > 0 ? -0.45 : Math.PI + 0.45;
    const b = r.body;
    b.rotation.set(0, 0, 0); b.position.set(0, 0, 0);
    if (this.state === 'slide') { b.rotation.z = -0.9; b.position.y = -0.3; }
    else if (this.state === 'windup') b.rotation.z = 0.25 + Math.sin(this.t * 30) * 0.05;
    else if (this.state === 'dizzy') b.rotation.x = Math.sin(this.t * 6) * 0.15;
    else b.scale.y = 1 + Math.sin(this.t * 3) * 0.03;
    r.head.rotation.z = this.state === 'throw' ? Math.sin(this.t * 12) * 0.2 : 0;
    for (const [i, f] of r.flippers.entries()) f.rotation.x = this.state === 'throw' ? Math.sin(this.t * 14 + i) * 0.8 : 0;
  }
  onHurt(dir) { this.set('hurt', 0.7); this.vx = dir * 7; }
}

class IdolBoss extends Boss {
  constructor(g, x0, x1, floor) {
    super(g, x0, x1, floor);
    this.name = 'The Great Pufftoa'; this.hp = this.maxHp = 6;
    this.model = buildIdol();
    this.model.userData.rig.body.scale.setScalar(0.85);
    for (const h of this.model.userData.rig.hands) h.scale.setScalar(0.85);
    g.world.dyn.add(this.model);
    this.hover = floor + 6;
    this.x = (x0 + x1) / 2 + 3; this.y = this.hover; this.w = 2.2; this.h = 2.8;
    this.dropT = 0; this.cycles = 0;
    this.light = new THREE.PointLight(0xff3d9a, 0, 10, 1.5);
    g.world.dyn.add(this.light);
  }
  get box() { return { x: this.x, y: this.y + this.h / 2, w: this.w, h: this.h }; }
  get vulnerable() { return this.state === 'down'; }
  update(dt) {
    this.common(dt);
    const g = this.game, pl = g.player, dx = pl.x - this.x;
    const phase2 = this.hp <= 3;
    switch (this.state) {
      case 'wait': this.y = this.hover + Math.sin(this.t * 2) * 0.3; break;
      case 'idle': if (this.timer <= 0) this.set('hoverAtk', phase2 ? 2.2 : 3); break;
      case 'hoverAtk':
        this.x = damp(this.x, pl.x, 1.4, dt);
        this.y = damp(this.y, this.hover + Math.sin(this.t * 2) * 0.4, 4, dt);
        this.dropT -= dt;
        if (this.dropT <= 0) {
          this.dropT = phase2 ? 0.45 : 0.7;
          g.spawnProjectile('firedrop', clamp(pl.x + rand(-5, 5), this.x0 + 2, this.x1 - 1), this.floor + 12, 0, -2, this);
        }
        if (this.timer <= 0) { this.set('aim', 0.8); audio.sfx('roar'); }
        break;
      case 'aim':
        this.x = damp(this.x, pl.x, 5, dt);
        this.y = damp(this.y, this.hover + 1, 4, dt);
        if (this.timer <= 0) { this.set('slam', 2); this.vy = 0; }
        break;
      case 'slam':
        this.vy -= 60 * dt; this.y += this.vy * dt;
        if (this.y <= this.floor) {
          this.y = this.floor;
          addShake(0.9); audio.sfx('thud'); audio.sfx('rumble'); input.rumble(1, 1, 350);
          for (const d of [-1, 1]) g.spawnProjectile('wave', this.x + d * 1.4, this.floor + 0.05, d * (phase2 ? 8.5 : 7), 0, this);
          g.fx.emit(this.x, this.floor + 0.2, 0, 30, { color: [0xff6a1a, 0xffc040, 0x5a4a5a], speed: 8, size: 0.2, life: 0.7, angle: Math.PI / 2, spread: 1.5 });
          this.set('down', phase2 ? 2.0 : 2.6);
        }
        break;
      case 'down':
        if (this.timer <= 0) { this.set('rise', 1); this.cycles++; }
        break;
      case 'rise':
        this.y = damp(this.y, this.hover, 3, dt);
        if (this.timer <= 0) {
          if (phase2 && this.cycles % 2 === 0) { this.set('sweep', 3.2); this.sweepDir = pl.x > (this.x0 + this.x1) / 2 ? -1 : 1; audio.sfx('roar'); }
          else this.set('hoverAtk', phase2 ? 2.2 : 3);
        }
        break;
      case 'sweep':
        this.y = damp(this.y, this.hover + 1.5, 3, dt);
        if (this.timer <= 0) this.set('hoverAtk', 2);
        break;
      case 'hurt': this.y = damp(this.y, this.floor + 0.6, 6, dt); if (this.timer <= 0) this.set('rise', 1); break;
      default: break;
    }
    if (this.state !== 'slam' && this.state !== 'down' && this.state !== 'hurt') this.x = clamp(this.x, this.x0 + 3, this.x1 - 2.5);
    this.contact();
    // hands: idle at sides, or a palm sweep across the floor
    const r = this.model.userData.rig;
    r.hands.forEach((h, i) => {
      const s = h.userData.side;
      let tx = this.x + s * 2.6, ty = this.y + 0.5 + Math.sin(this.t * 3 + i) * 0.3;
      let snap = false;
      if (this.state === 'sweep') {
        const k = clamp(1 - this.timer / 3.2, 0, 1);
        const lead = s === this.sweepDir * -1;
        if (lead) {
          tx = lerp(this.sweepDir > 0 ? this.x0 - 1 : this.x1 + 1, this.sweepDir > 0 ? this.x1 + 1 : this.x0 - 1, smooth(k));
          ty = this.floor + 0.45;
          snap = k > 0.05;
          if (overlap(this.game.player.box, { x: tx, y: ty, w: 1.6, h: 0.9 })) this.game.player.hurt(tx);
        }
      }
      h.position.x = snap ? tx : damp(h.position.x, tx, 6, dt);
      h.position.y = snap ? ty : damp(h.position.y, ty, 6, dt);
      h.rotation.z = snap ? Math.sin(this.t * 20) * 0.1 : 0;
    });
    const m = this.model;
    // the hands live in world space: the root stays at the origin
    m.position.set(0, 0, 0);
    r.body.position.set(this.x, this.y + 1.4, 0);
    r.body.rotation.y = -Math.PI / 2 + Math.sin(this.t * 0.8) * 0.15;
    r.body.rotation.z = this.state === 'aim' ? Math.sin(this.t * 40) * 0.05 : 0;
    const glow = this.state === 'down' ? 2.5 + Math.sin(this.t * 14) : 0.6;
    r.gem.material.emissiveIntensity = glow;
    this.light.position.set(this.x, this.y + 1.2, 1.5);
    this.light.intensity = this.state === 'down' ? 18 : 0;
    m.visible = true;
    r.body.visible = !(this.flash > 0 && Math.floor(this.flash * 20) % 2);
  }
  onHurt() { this.set('hurt', 0.8); }
  remove() { super.remove(); this.game.world.dyn.remove(this.light); }
}

const show = (id, on = true) => { const el = $(id); el.classList.toggle('hidden', !on); if (el.classList.contains('layer')) el.classList.toggle('on', on); };
const glyphs = (s) => s.replace(/\{(\w+)\}/g, (_, a) => input.glyph(a));

// A vertical list driven by the pad's D-pad/stick; mouse hover and click map onto the same focus model.
class Menu {
  constructor(el, items, opts = {}) {
    this.el = el; this.items = items; this.i = opts.start || 0; this.onBack = opts.onBack || null;
    this.el.innerHTML = '';
    this.buttons = items.map((it, idx) => {
      const b = document.createElement('button');
      b.textContent = it.label;
      if (it.disabled) b.disabled = true;
      b.addEventListener('mouseenter', () => { if (!it.disabled && this.i !== idx) { this.i = idx; this.paint(); audio.sfx('menu'); } });
      b.addEventListener('click', (e) => { e.stopPropagation(); if (!it.disabled) { this.i = idx; this.activate(); } });
      this.el.appendChild(b);
      return b;
    });
    while (this.items[this.i] && this.items[this.i].disabled) this.i++;
    this.paint();
  }
  paint() { this.buttons.forEach((b, i) => b.classList.toggle('focus', i === this.i)); }
  move(d) {
    let n = this.i;
    for (let k = 0; k < this.items.length; k++) {
      n = (n + d + this.items.length) % this.items.length;
      if (!this.items[n].disabled) break;
    }
    if (n !== this.i) { this.i = n; this.paint(); audio.sfx('menu'); }
  }
  activate() { audio.sfx('confirm'); input.lastActivity = performance.now(); this.items[this.i].action(); }
  update() {
    if (input.nav('up')) this.move(-1);
    if (input.nav('down')) this.move(1);
    if (input.pressed('confirm')) this.activate();
    else if (input.pressed('back') && this.onBack) { audio.sfx('back'); this.onBack(); }
  }
}

const SETTING_ROWS = [
  { key: 'music', label: 'Music Volume', type: 'range' },
  { key: 'sfx', label: 'Sound Effects', type: 'range' },
  { key: 'voice', label: 'Voices (gibberish)', type: 'range' },
  { key: 'invertX', label: 'Invert Stick Horizontal', type: 'bool' },
  { key: 'invertY', label: 'Invert Stick Vertical', type: 'bool' },
  { key: 'shake', label: 'Screen Shake', type: 'bool' },
  { key: 'rumble', label: 'Controller Rumble', type: 'bool' },
  { key: 'textSpeed', label: 'Text Speed', type: 'choice', choices: [0.5, 1, 2], names: ['Slow', 'Normal', 'Fast'] },
  { key: 'outline', label: 'Ink Outlines', type: 'bool' },
  { key: 'assist', label: 'Assist Mode (5 hearts)', type: 'bool' },
  { key: 'reset', label: 'Erase Save Data', type: 'action' },
  { key: 'back', label: 'Back', type: 'action' },
];
class SettingsScreen {
  constructor() { this.i = 0; this.open = false; this.confirmReset = false; }
  show(onClose) {
    this.onClose = onClose; this.open = true; this.i = 0; this.confirmReset = false;
    show('settings');
    this.render();
  }
  close() { this.open = false; show('settings', false); saveSettings(); audio.applyVolumes(); applyOutline(); if (this.onClose) this.onClose(); }
  render() {
    const box = $('settingsOpts');
    box.innerHTML = '';
    SETTING_ROWS.forEach((row, idx) => {
      const el = document.createElement('div');
      el.className = 'opt' + (idx === this.i ? ' focus' : '');
      const lab = document.createElement('span');
      lab.textContent = row.key === 'reset' && this.confirmReset ? 'Really erase? Press again' : row.label;
      el.appendChild(lab);
      const val = document.createElement('span');
      val.className = 'val';
      const v = settings[row.key];
      if (row.type === 'range') { val.innerHTML = `<span class="bar"><i style="width:${Math.round(v * 100)}%"></i></span>${Math.round(v * 10)}`; }
      else if (row.type === 'bool') val.textContent = v ? 'ON' : 'OFF';
      else if (row.type === 'choice') val.textContent = row.names[row.choices.indexOf(v)] ?? 'Normal';
      el.appendChild(val);
      el.addEventListener('mouseenter', () => { if (this.i !== idx) { this.i = idx; this.render(); } });
      el.addEventListener('click', (e) => { e.stopPropagation(); this.i = idx; this.change(1, true); });
      box.appendChild(el);
      if (idx === this.i) this.focusEl = el;
    });
    if (this.focusEl) this.focusEl.scrollIntoView({ block: 'nearest' });
    $('settingsFoot').innerHTML = glyphs('{move} change &nbsp; {confirm} select &nbsp; {back} back');
  }
  change(d, activate) {
    const row = SETTING_ROWS[this.i];
    if (row.type === 'range') settings[row.key] = clamp(Math.round((settings[row.key] + d * 0.1) * 10) / 10, 0, 1);
    else if (row.type === 'bool') settings[row.key] = !settings[row.key];
    else if (row.type === 'choice') { const c = row.choices; settings[row.key] = c[(c.indexOf(settings[row.key]) + d + c.length) % c.length]; }
    else if (activate && row.key === 'back') { audio.sfx('back'); this.close(); return; }
    else if (activate && row.key === 'reset') {
      if (this.confirmReset) { resetSave(); this.confirmReset = false; game.toast('Save data erased', 1.6); } else this.confirmReset = true;
    }
    audio.applyVolumes();
    audio.sfx('menu');
    this.render();
  }
  update() {
    if (!this.open) return;
    if (input.nav('up')) { this.i = (this.i - 1 + SETTING_ROWS.length) % SETTING_ROWS.length; this.confirmReset = false; audio.sfx('menu'); this.render(); }
    if (input.nav('down')) { this.i = (this.i + 1) % SETTING_ROWS.length; this.confirmReset = false; audio.sfx('menu'); this.render(); }
    if (input.nav('left')) this.change(-1);
    if (input.nav('right')) this.change(1);
    if (input.pressed('confirm')) this.change(1, true);
    else if (input.pressed('back') || input.pressed('pause')) { audio.sfx('back'); this.close(); }
  }
}
function applyOutline() { R.outlineWidth.value = settings.outline ? 0.055 : 0; }

function drawPortrait(who, levelId) {

  x.clearRect(0, 0, 160, 160);

  x.fillStyle = bg; x.fillRect(0, 0, 160, 160);
  const ink = '#1d0f26';
  x.lineWidth = 5; x.strokeStyle = ink;
  const circle = (cx, cy, r, fill) => { x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fillStyle = fill; x.fill(); x.stroke(); };
  const ell = (cx, cy, rx, ry, fill, rot = 0) => { x.beginPath(); x.ellipse(cx, cy, rx, ry, rot, 0, TAU); x.fillStyle = fill; x.fill(); x.stroke(); };
  const eye = (cx, cy, r = 13) => { ell(cx, cy, r * 0.8, r, '#fff'); x.beginPath(); x.arc(cx + 3, cy + 2, r * 0.45, 0, TAU); x.fillStyle = ink; x.fill(); };
  if (who === 'dudley' || who === 'barnaby') {
    circle(80, 92, 50, '#fdfbf4');
    ell(118, 108, 30, 11, '#ff9a1f', 0.1);
    eye(92, 78); eye(116, 80);
    if (who === 'dudley') {
      x.save(); x.translate(70, 46); x.rotate(-0.25);
      x.fillStyle = '#fdfbf4'; x.fillRect(-36, -14, 72, 24); x.strokeRect(-36, -14, 72, 24);
      x.fillStyle = '#2a4fa8'; x.fillRect(-36, 4, 72, 8); x.restore();
    } else {
      x.fillStyle = ink; x.fillRect(46, 10, 56, 40); x.fillRect(32, 46, 84, 8);
      x.beginPath(); x.arc(116, 80, 16, 0, TAU); x.strokeStyle = '#ffc93c'; x.stroke(); x.strokeStyle = ink;
    }
  } else if (who === 'polly') {
    circle(80, 90, 46, '#2fbf4f');
    x.beginPath(); x.moveTo(110, 82); x.quadraticCurveTo(150, 92, 118, 120); x.closePath(); x.fillStyle = '#ffc93c'; x.fill(); x.stroke();
    eye(96, 74, 11);

  } else if (who === 'narrator') {

    x.restore();

    x.fillStyle = '#6a4a8a'; x.fillRect(30, 20, 100, 124); x.strokeRect(30, 20, 100, 124);
    x.fillStyle = '#ffdd33'; x.fillRect(48, 50, 22, 14); x.fillRect(90, 50, 22, 14);
    x.fillStyle = '#2a1838'; x.fillRect(46, 92, 68, 26);
    x.fillStyle = '#ff3d9a'; x.beginPath(); x.moveTo(80, 70); x.lineTo(92, 82); x.lineTo(80, 94); x.lineTo(68, 82); x.fill(); x.stroke();
  } else {

    if (levelId === 'coast') { ell(80, 100, 56, 36, '#e8443a'); eye(62, 52, 12); eye(98, 52, 12); x.fillStyle = ink; x.beginPath(); x.moveTo(50, 40); x.lineTo(110, 40); x.lineTo(80, 14); x.fill(); }
    else if (levelId === 'ruins') { x.fillStyle = '#a86b3c'; x.fillRect(40, 20, 80, 124); x.strokeRect(40, 20, 80, 124); x.fillStyle = '#ffe066'; x.fillRect(56, 50, 14, 20); x.fillRect(92, 50, 14, 20); x.fillStyle = '#3b2214'; x.fillRect(56, 96, 50, 16); }
    else { circle(80, 96, 52, '#9a6b4f'); ell(80, 118, 34, 20, '#c9947a'); x.fillStyle = '#fff'; x.fillRect(62, 126, 8, 26); x.fillRect(90, 126, 8, 26); eye(64, 80, 11); eye(98, 80, 11); x.fillStyle = '#2a4fa8'; x.fillRect(56, 22, 50, 26); }
