class Dialog {
  constructor() { this.active = false; }
  run(lines, levelDef) {
    return new Promise((resolve) => {
      this.lines = lines; this.idx = -1; this.level = levelDef; this.resolve = resolve; this.active = true;
      show('dialog');
      this.next();
    });
  }
  next() {
    this.idx++;
    if (this.idx >= this.lines.length) { this.active = false; show('dialog', false); this.speaker = null; this.resolve(); return; }
    const [who, text] = this.lines[this.idx];
    const sp = SPEAKERS[who];
    this.speaker = who;
    $('dlgWho').textContent = who === 'boss' && this.level ? this.level.bossName : sp.name;
    drawPortrait(who, this.level && this.level.id);
    this.text = text; this.shown = 0; this.acc = 0;
    $('dlgText').textContent = '';
    $('dlgNext').innerHTML = '';
    this.voice = VOICES[sp.voice];
  }
  update(dt) {
    if (!this.active) return;
    if (this.shown < this.text.length) {
      this.acc += dt * 42 * settings.textSpeed;
      while (this.acc >= 1 && this.shown < this.text.length) {
        this.acc -= 1;
        const ch = this.text[this.shown++];
        if (this.shown % 2 === 0) audio.blip(ch, this.voice);
      }
      $('dlgText').textContent = this.text.slice(0, this.shown);
      if (this.shown >= this.text.length) $('dlgNext').innerHTML = glyphs('{confirm}');
      if (input.pressed('confirm') || input.pressed('back') || input.mouseClicked) { this.shown = this.text.length; $('dlgText').textContent = this.text; $('dlgNext').innerHTML = glyphs('{confirm}'); input.mouseClicked = false; }
    } else if (input.pressed('confirm') || input.pressed('back') || input.mouseClicked) { input.mouseClicked = false; audio.sfx('menu'); this.next(); }
  }
  get talking() { return this.active && this.shown < this.text.length ? this.speaker : null; }
}

class Hud {
  constructor() { this.dirty = true; this.hp = -1; }
  update(g) {
    if (!this.dirty) return;
    this.dirty = false;
    const p = g.player;
    if (!p) return;
    const h = $('hearts');
    if (h.children.length !== p.maxHp) { h.innerHTML = ''; for (let i = 0; i < p.maxHp; i++) h.appendChild(document.createElement('span')); }
    [...h.children].forEach((s, i) => { const empty = i >= p.hp; if (s.classList.contains('empty') !== empty) { s.classList.toggle('empty', empty); s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); } });
    $('lives').textContent = g.session ? '∞' : String(g.lives);
    $('stars').textContent = String(g.starCount);
    $('score').textContent = String(g.score).padStart(7, '0');
    const f = $('feathers');
    f.innerHTML = g.featherFlags.map((on) => `<span class="icon feather-ico${on ? '' : ' empty'}"></span>`).join('');
    const t = $('temper');
    t.querySelector('i').style.width = Math.round(p.temper * 100) + '%';
    t.classList.toggle('full', p.temper >= 1 || p.tantrumT > 0);
    $('temperLabel').innerHTML = p.temper >= 1 && p.tantrumT <= 0 ? glyphs('TEMPER FULL! {tantrum}') : p.tantrumT > 0 ? 'TANTRUM!!' : 'TEMPER';

      $('bossHp').style.width = (g.boss.hp / g.boss.maxHp) * 100 + '%';
    } else show('bossbar', false);
  }
}

      p.kickHit.add(c);
      c.kick(p.facing);

    }
    for (const ch of this.chests) if (!ch.open && overlap(box, ch.box)) { ch.openUp(p.facing); if (ch.id !== undefined) this.taken.add(ch.id); }
    for (const pr of this.projectiles) {

      const ci = Math.floor(this.attractT / 9) % cap.length;
      if (ci !== this.captionIdx) { this.captionIdx = ci; $('demoCaption').textContent = cap[ci]; }
      if (input.consumeAny() || input.mouseMoved && this.attractT > 1) { this.endAttract(); return; }
      if (this.attractT > 48) { this.attractT = -999; this.transition(() => { this.attract = true; this.startAttract(); }); }
    } else if (pausePressed && !this.busy && !this.sessionStopped) {
      if (this.paused) this.closePause(); else this.openPause();
      return;
    }
    if (this.paused) { if (this.menu && !this.busy) this.menu.update(); return; }
    if (this.session && this.sessionStopped) { this.updateCamera(dt); return; }
    if (this.slowT > 0) { this.slowT -= dt; this.timeScale = 0.35; } else this.timeScale = 1;
    if (this.dialog.active || this.cutscene) {
      if (this.player) { this.player.talking = this.dialog.talking === 'dudley'; this.player.sync(); }
      if (this.boss && this.boss.model) this.boss.common(0);
    }
    if (this.hitStop > 0) { this.hitStop -= dt; this.updateCamera(dt); this.fx.update(dt * 0.2); return; }
    this.acc += dt * this.timeScale;
    let n = 0;
    while (this.acc >= STEP && n < 4) {
      if (this.cutscene || this.dialog.active) { this.world.physics.step(); this.world.update(STEP); }
      else this.step(STEP);
      this.acc -= STEP; n++;
    }
    if (n === 4) this.acc = 0;
    this.fx.update(dt);
    this.updateCamera(dt);
    if (this.session) this.reportProgress();
  }
  // ---------- AI Hub session (side by side) ----------
  async startSession() {
    const info = await AIHub.connect({ mode: 'parallel', seats: [1, 4] });
    if (!info) { this.enterTitle(); return; }
    this.session = true;
    this.sessionInfo = info;
    const r = AIHub.rng('deal');
    this.levelIndex = Math.floor(r() * 3);
    this.score = 0; this.lives = 3;
    this.taken = new Set(); this.checkpoint = null;
    this.featherFlags = [false, false, false];
    this.stats = { enemies: 0, stars: 0, time: 0 };
    this.levelStartScore = 0;
    this.loadLevel();
    this.state = 'ready';
    this.toast('Get ready!', 99, 7);
    show('sessionBar');
    $('sessionBar').textContent = '';
    AIHub.on('start', () => { audio.ensure(); });
    AIHub.on('time-up', () => this.reportResult());
    AIHub.on('end', () => {
      this.sessionStopped = true;
      audio.fadeOut(0.8);
      this.showHint(null);
      if (this.paused) this.closePause();
      this.toast('Round over!', 99, 7);
    });
    if (info.splash) AIHub.ready();
    else { this.needReadyGesture = true; this.toast('Press any key, click or tap when you are ready', 99, 4); }
  }
  updateReady(dt, pausePressed) {
    // the menu works during the countdown too; side by side, nothing waits on this copy
    if (pausePressed && !this.busy && !this.sessionStopped) { if (this.paused) this.closePause(); else this.openPause(); }
    else if (this.paused && this.menu && !this.busy) this.menu.update();
    if (this.needReadyGesture && !this.paused && (input.consumeAny())) { this.needReadyGesture = false; AIHub.ready(); this.toast('Get ready!', 99, 7); }
    const t = AIHub.time();
    if (isFinite(t) && t < 0) this.toast(String(Math.ceil(-t / 1000)), 1, 12);
    if (t >= 0) { this.state = 'play'; this.toast('GO!', 1, 12); audio.ensure(); audio.play(this.world.theme.music, true); }
    if (this.player) this.player.sync();
    this.world.update(dt);
    this.updateCamera(dt);
  }
  reportProgress() {
    const short = ['Coast', 'Ruins', 'Peak', 'Shrine'][this.levelIndex];
    AIHub.progress({ score: this.score, label: `${short} · ${this.starCount}★` });
    const left = this.sessionInfo && this.sessionInfo.limitMs ? Math.max(0, this.sessionInfo.limitMs - AIHub.time()) : 0;
    $('sessionBar').textContent = left ? `${Math.floor(left / 60000)}:${String(Math.floor((left % 60000) / 1000)).padStart(2, '0')}` : '';
  }
  reportResult() {
    if (this.sessionReported) return;
    this.sessionReported = true;
    AIHub.result({
      score: this.score,
      stats: { stars: this.starCount, baddies: this.stats.enemies, stages: this.sessionStages || 0, feathers: this.featherFlags.filter(Boolean).length },
      awards: this.sessionStages ? [{ title: 'Gem Getter', detail: `${this.sessionStages} stage(s) cleared` }] : this.stats.enemies >= 15 ? [{ title: 'Short Fuse', detail: `${this.stats.enemies} baddies bonked` }] : [],
    });
  }
  probe() {
    const sceneMap = { title: 'title', map: 'menu', story: 'menu', notice: 'menu', ready: 'ready', play: 'play', tally: 'over', gameover: 'over', ending: 'over' };
    let scene = sceneMap[this.state] || 'title';
    if (this.attract) scene = 'title';
    if (this.session && this.sessionStopped) scene = 'over';
    return {
      scene,
      menu: !!(this.paused || this.settings.open || this.about.open || this.howto.open),
      world: Math.round(this.simTime * 1000) / 1000,
      input: input.live(),
    };
  }
}

// ===== 12-main: boot, notices, the frame loop =====
let game = null;
function showNotice(title, text, items) {
  game.hideScreens();
  game.state = 'notice';
  $('noticeTitle').textContent = title;
  $('noticeText').textContent = text;
  show('notice');
  game.menu = items && items.length ? new Menu($('noticeMenu'), items) : null;
  if (!game.menu) $('noticeMenu').innerHTML = '';
}
async function boot() {
  game = new Game();
  window.__game = game;
  window.__R = R;
  AIHub.probe(() => game.probe());
  const touchOnly = navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
  if (!navigator.gpu) {
    showNotice('WebGPU required', 'Waddle of Trouble renders with WebGPU only. Please open it in a browser with WebGPU enabled (recent Chrome, Edge or Safari).');
    AIHub.fail('WebGPU is not available in this browser');
    return;
  }
  try {
    await RAPIER.init();
    await initRenderer();
  } catch (e) {
    console.error(e);
    showNotice('WebGPU required', 'This device could not start WebGPU: ' + (e && e.message ? e.message : e));
    AIHub.fail('WebGPU could not start');
    return;
  }
  game.fx = new Particles(1200);
  // Test hook: render the current view into a texture and return it as a PNG data URL
  // (headless browsers cannot capture a WebGPU canvas directly).
  window.__snapshot = async (w = 640, h = 360) => {
    const rt = new THREE.RenderTarget(w, h);
    const asp = R.camera.aspect;
    R.camera.aspect = w / h; R.camera.updateProjectionMatrix();
    R.renderer.setRenderTarget(rt);
    R.renderer.render(R.scene, R.camera);
    R.renderer.setRenderTarget(null);
    R.camera.aspect = asp; R.camera.updateProjectionMatrix();
    const px = await R.renderer.readRenderTargetPixelsAsync(rt, 0, 0, w, h);
    rt.dispose();
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(w, h);
    const gamma = (v) => Math.round(255 * Math.pow(v / 255, 1 / 2.2));
    const stride = px.length / h;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * stride + x * 4, o = (y * w + x) * 4;
      img.data[o] = gamma(px[i]); img.data[o + 1] = gamma(px[i + 1]); img.data[o + 2] = gamma(px[i + 2]); img.data[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return c.toDataURL('image/png');
  };
  applyOutline();
  let last = performance.now();
  R.renderer.setAnimationLoop(() => {
    const now = performance.now();
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    try {
      game.frame(dt);
    } catch (e) {
      console.error(e);
    }
    R.renderer.render(R.scene, R.camera);
  });
  if (AIHub.active) { game.startSession(); return; }
  if (touchOnly) {
    game.noticeDismissable = true;
    game.enterTitle();
    showNotice('Controller or keyboard required', 'Waddle of Trouble is played with a game controller or a keyboard. Connect one and press any button to begin.', [
      { label: 'Settings', action: () => game.settings.show() },
    ]);
    return;
  }
  game.enterTitle();
}
boot();

</script>
