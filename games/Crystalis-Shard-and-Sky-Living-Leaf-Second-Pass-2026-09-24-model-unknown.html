q('mill', 'Windmill mechanism', 'Let the valley breathe', 'The key turns. Ancient gears catch, the sails swing into the wind, and a distant stone seal gives way. The valley has a voice again.', { xp: 100 }, { flag: 'windmill' });
q('west', 'Zebu', 'The art of beginning again', 'A little wind can move a great weight. Now learn Refresh: trade a little magic for life. Keep some power in reserve; the sealed cave holds more than old stones.', { spells: ['refresh'], xp: 50 });
q('sealed', 'Wind reliquary', 'The wind takes shape', 'Inside the old reliquary, a pale sphere turns without touching its stand. The Ball of Wind answers your sword. Charge II can now break the cracked stone walls.', { items: ['windBall'], xp: 120 }, { type: 'chest' });
q('sealed', 'Cracked rock seal', 'A path through stone', 'Your charged wind tears the brittle seal apart. Dust drifts into the open corridor. Something larger than a bat is waiting beyond.', { xp: 50 }, { type: 'seal', element: 'wind', tier: 2, flag: 'rockSeal' });
q('batden', 'Big Bat', 'Wings in the dark', 'Big Bat descends with a shriek. The smaller bats scatter as the Sword of Wind begins to glow.', { items: ['rabbit'], xp: 100 }, { type: 'boss', boss: 'bat1', after: 'The last echo fades. In the chest beneath its roost are the Rabbit Boots. Beyond this cave lies Cordel Field.' });
q('brynmaer', 'Akahana', 'The collector’s problem', 'A traveler! Perhaps you can help. I lost my Statue of Onyx in the long grass across Cordel’s bridge. It is not valuable to everyone, but it matters to me.', { xp: 100 });
q('cordel', 'Onyx in the grass', 'Not all treasure glitters', 'A small dark statue lies half-hidden in the grass. There is a familiar name scratched into its base: Akahana.', { items: ['onyx'], xp: 140 }, { type: 'chest' });
q('brynmaer', 'Akahana', 'A breath of fresh air', 'My statue! You have done me a real kindness. Take this Gas Mask. Wear it in the Poison Forest Maze, and remember: the people of Oak do not always speak with words.', { items: ['gasMask'], xp: 180 }, { req: 'onyx' });
q('tornelhouse', 'Stom', 'A lesson with Stom', 'Tornel folds his arms. “First, show my pupil that you can hold your ground.” Stom grins. “Nothing personal. Try to push me back!”', { spells: ['telepathy'], xp: 220 }, { type: 'duel', after: 'Stom laughs and lowers his sword. Tornel teaches you Telepathy. “Now listen to Oak with more than your ears. We will meet again on Mt. Sabre.”' });
q('oak', 'A worried mother', 'A voice in the forest', 'Your thoughts reach hers before your words do. “My child went into the forest. We do not trust humans, but I cannot search alone. Please bring him home.”', { xp: 100 }, { req: 'spell:telepathy' });
q('forest', 'Lost boy', 'No one gets left behind', '“I thought I could find the clearing by myself.” The boy takes your hand. “Can we go home now?” He follows as you turn toward Oak.', { xp: 200 }, { flag: 'escortBoy' });
q('oak', 'A worried mother', 'A place at the hearth', 'The boy runs into his mother’s arms. “You did not owe us anything,” she says. “Yet you helped. Take the Insect Flute. Our elder will lend you the fire that can end the giant beetle’s terror.”', { items: ['insect'], xp: 180 }, { flag: 'boyHome' });
q('oak', 'Oak elder', 'A warmer welcome', '“We mistook your kind for your character. The Sword of Fire belongs in hands that protect a child before seeking a reward. Play the flute in the deep clearing, and end the beetle’s reign.”', { items: ['fireSword'], xp: 180 });
q('beetlegrove', 'Giant Beetle', 'A song with too many legs', 'The Insect Flute’s bright note is answered by a tremendous scrape. The Giant Beetle rises from the poisoned roots.', { items: ['fireBall'], xp: 400 }, { type: 'boss', boss: 'beetle', req: 'insect', after: 'The grove grows quiet. The Ball of Fire rolls free of the shattered shell. Charge-II Fire can melt the walls of ice on Mt. Sabre.' });
q('west', 'Zebu', 'Smoke over Leaf', '“The mountain road is open, but something is wrong. Draygonia’s soldiers passed through Leaf. Return there before you climb farther.”', { xp: 120 });
q('leaf', 'Creature in the shed', 'The empty village', 'The little creature peers out from the shed. “They took everybody. The elder too. Soldiers, heading for the northeast mountain.” The cheerful square is silent. You will bring its people home.', { xp: 200 }, { flag: 'leafTaken' });
q('swcaves', 'Tornado chest', 'A storm small enough to carry', 'Beyond the ice lies the Tornado Bracelet. The wind gathers around your hand in three tiny spirals. Charge III is now yours.', { items: ['tornado'], xp: 500 }, { type: 'chest' });
q('swsummit', 'Tornel', 'The roads between thoughts', '“You have learned how to move the wind. Now learn how to let it move you.” Tornel teaches Teleport. A visited town is never far away. He gives you a Magic Ring for the road.', { spells: ['teleport'], items: ['magicRing'], xp: 250 });
q('sabrene', 'Wounded villager', 'A promise in the snow', 'A villager from Leaf lies beside the path. “The others… in the prison. The elder is higher up. Please…” His strength gives out. You promise the mountain will not keep them.', { xp: 200 });
q('necaves', 'Prison patrol', 'The imperial roadblock', 'Two Draygonian guards turn from the gate. “No one passes.” The sound of your sword being drawn answers them.', { xp: 300 }, { type: 'wave', wave: ['Draygonia Guard', 'Draygonia Guard'] });
q('prison', 'Prison chest', 'A key and a little hope', 'Beyond the frozen wall, the Prison Key hangs from an abandoned peg. The prisoners hear the metal chime and lift their heads.', { items: ['prisonKey'], xp: 300 }, { type: 'chest' });
q('prison', 'Prisoners of Leaf', 'Open every door', 'One cell opens, then another. Some prisoners laugh with relief; others can barely believe it. “The elder is still above us. Kelbesque has him.”', { xp: 450 }, { req: 'prisonKey', flag: 'leafFreed' });
q('kelbesquekeep', 'General Kelbesque', 'The mountain shakes', 'General Kelbesque stamps the ground. “You have cost the empire enough time.” Stones lift into the air around him.', { items: ['flame'], xp: 1000 }, { type: 'boss', boss: 'kel1', after: 'Kelbesque staggers back. “This is not our last meeting.” He retreats, leaving the Flame Bracelet behind.' });
q('finalcave', 'Village elder', 'Beyond the mountain', 'The Prison Key opens the elder’s cell. “Leaf will remember this. Seek the Queen of Portoa.” Tornel meets you beyond the door and teaches Paralysis, a spell to still both enemies and suspicious guards.', { spells: ['paralysis'], xp: 500 }, { req: 'prisonKey', flag: 'elderFreed' });
q('palace', 'Queen of Portoa', 'A queen of many duties', '“The falls hide people who need help,” says the queen. “But there are truths you must find for yourself. Speak to our fortune teller. She has a way of seeing a little farther.”', { xp: 180 });
q('fortune', 'Fortune teller', 'The way is open', 'The fortune teller studies your hands instead of her crystal. “A locked door is sometimes only a person standing still. Visit the palace again. The queen’s path is open.”', { xp: 180 });
q('palace', 'Palace guard', 'A moment of stillness', 'Your Paralysis spell stills the guard without hurting him. Behind the throne is a hidden cavern—but a river bars the way. When you return, the queen is waiting.', { xp: 250 }, { req: 'spell:paralysis', cost: 4 });
q('palace', 'Queen of Portoa', 'Music for the stone-hearted', '“You have seen that this palace keeps secrets. Take the Flute of Lime to Waterfall Cave. Its song can restore those whom Medusa has turned to stone.”', { items: ['limeFlute'], xp: 200 });
q('waterfallcave', 'Petrified soldiers', 'A song behind the falls', 'The flute’s notes rise above the water. Stone softens into skin. The soldiers gasp. “Thank you. Akahana is still farther in, and the Sword of Water lies beyond him.”', { xp: 300 }, { req: 'limeFlute', flag: 'stonePeople' });
q('waterfallcave', 'Petrified Akahana', 'The collector, collected', 'The Flute of Lime restores a very embarrassed Akahana. “First my statue, and then myself! Take this Shield Ring. May it keep you out of trouble better than it kept me.”', { items: ['shieldRing'], xp: 250 }, { req: 'limeFlute' });
q('waterchamber', 'Water reliquary', 'The patience of water', 'The Sword of Water lifts from its cradle. Its edge is cool as rain. Somewhere to the south, an old guardian opens his eyes.', { items: ['waterSword'], xp: 500 }, { type: 'chest' });
q('limelake', 'Rage', 'A hundred years of waiting', '“At last.” Rage’s voice sounds like roots moving beneath stone. “I have slept a century to give you this.” The Ball of Water glows. “Freeze a path to Mesia. Your awakening is only the beginning.”', { items: ['waterBall'], xp: 350 }, { req: 'waterSword' });
q('mesiagrotto', 'Mesia', 'The other sleeper', 'Mesia stands beside a cryogenic chamber like your own. “I knew you would wake. I must go to Draygonia. Follow me as soon as you can. Whatever you remember—or cannot remember—you are not alone.”', { xp: 350 }, { flag: 'metMesia' });
q('palacecave', 'Asina', 'Three names, one purpose', '“The queen, the fortune teller… both were ways to help.” She smiles. “My name is Asina.” The sage teaches Recover. “Calm the Angry Seas, and I will teach you Barrier as well.”', { spells: ['recover'], xp: 300 });
q('palacecave', 'A sick dolphin', 'A friend below the surface', 'You offer a Medical Herb. The dolphin’s breathing steadies. “That is much better! Take my Shell Flute. Call at the water, and I will carry you wherever the sea allows.”', { items: ['shellFlute'], xp: 300 }, { req: 'herb', consume: 'herb', hint: 'Medical Herbs are sold in Portoa. Keep one for the dolphin.' });
q('eastcave', 'Lost Fog Lamp', 'A light for the crossing', 'Behind the last brittle wall sits the Fog Lamp. Its lens is cloudy, but a warm light still shines through it.', { items: ['fogLamp'], xp: 450 }, { type: 'chest' });
q('kirisafield', 'Kirisa flower bed', 'A flower out of season', 'You choose a single blossom from the sheltered bed. The Kirisa Plant carries a scent that seems to belong to a kinder world.', { items: ['kirisa'], xp: 350 }, { type: 'chest' });
q('aryllis', 'Amazon guard', 'Past the watchful eye', 'A brief Paralysis spell gives you time to step past the guard. Below Aryllis’s hall, a chest holds the Blizzard Bracelet. The air sparkles with a sudden chill.', { items: ['blizzard'], xp: 400 }, { req: 'spell:paralysis', cost: 4 });
q('portoadock', 'Boat keeper', 'The ferryman’s good day', '“My Fog Lamp!” His daughter laughs as his frown disappears. “Then we can sail. I will take you to the shore cabin. Beyond that, you will need a friend who knows the water.”', { xp: 300 }, { req: 'fogLamp', flag: 'ferry' });
q('cabin', 'Kensu', 'A wandering heart', 'Kensu stares at the sea. “I have lost something important. A pendant… perhaps behind Portoa Palace.” Even through Telepathy, his thoughts are tangled. You leave him to rest.', { xp: 200 });
q('palacecave', 'Tide-washed pendant', 'A token of faith', 'The dolphin noses a small pendant from a sheltered inlet. You lift it from the water. This must be what Kensu has been searching for.', { items: ['lovePendant'], xp: 300 }, { type: 'chest', req: 'shellFlute' });
q('joel', 'Elder of Joel', 'The missing brother', '“My brother Clark went to Evil Spirit Island and never returned. They say a woman was taken there too—Mesia. Please find them.”', { xp: 250 });
q('island', 'Clark', 'The silent island', 'Clark emerges from a ruined cellar. “Sabera did this. Everyone outside was human once. She is one of Draygonia’s four finest warriors. Be careful in her castle; even a friendly face may be a trap.”', { xp: 350 });
q('batgallery', 'Big Bat', 'A familiar shadow', 'The gallery darkens beneath a massive pair of wings. Big Bat has returned, and it has brought company.', { items: ['powerFruit'], xp: 544 }, { type: 'boss', boss: 'bat2', after: 'The bat collapses into fading motes. A Fruit of Power waits in its treasure chest. Sabera is close.' });
q('saberathrone', 'The false Mesia', 'The face behind the spell', '“The sorceress is in the next room,” says the woman. But your sword passes through the illusion. Sabera’s laugh echoes from every wall. “Clever. Not clever enough.”', { items: ['broken'], xp: 800 }, { type: 'boss', boss: 'sabera1', after: 'Sabera’s illusion breaks. “Mesia is still beyond your reach.” She vanishes, leaving a Broken Statue. Across the island, the curse begins to lift.' });
q('island', 'Clark', 'People, not shadows', 'The town’s people have returned to themselves. Clark gives you his Eye Glasses. “The lighthouse’s Glowing Lamp belongs in that broken statue. Look closely inside Joel’s shed.”', { items: ['glasses'], xp: 400 }, { flag: 'islandFreed' });
q('joelshed', 'An ordinary wall', 'Seeing is an adventure', 'Through the Eye Glasses, a dark line becomes a doorway. You press the hidden stone. The passage opens toward Joel’s lighthouse.', { xp: 300 }, { req: 'glasses', flag: 'secretDoor' });
q('lighthouse', 'Sleeping Kensu', 'The world’s least grateful napper', 'The Alarm Flute wakes Kensu. “Must every hero be so loud?” He disappears in a puff of offended magic, leaving the Glowing Lamp behind.', { items: ['glowingLamp'], xp: 350 }, { req: 'alarm' });
q('lighthouse', 'Broken statue pedestal', 'Something whole again', 'You fit the Glowing Lamp into the Broken Statue. Gold light fills its missing shape. The restored Statue of Gold is warm in your hands.', { items: ['goldStatue'], xp: 300 }, { req: ['broken', 'glowingLamp'] });
q('altar', 'Sea altar', 'A gentler sea', 'The Statue of Gold settles into the altar. The great northern whirlpool slows, uncoils and disappears. Your dolphin gives an approving splash.', { xp: 500 }, { req: 'goldStatue', flag: 'calmSea' });
q('altar', 'Asina', 'A promise kept', 'Asina appears on the quiet water. “You have given the islands their road back. Now take Barrier.” She teaches the protective spell. “We gather at Shyron. Azteca knows the truth of your mission.”', { spells: ['barrier'], xp: 350 });
q('swan', 'Stom', 'Even heroes need directions', '“You made it!” Stom claps you on the shoulder. “Find Kensu. The Wise Men need him at Shyron. He has been hiding among the people here. You know how much he likes a disguise.”', { xp: 250 });
q('swanbar', 'A thoughtful guard', 'A rather familiar soldier', 'Paralysis catches the guard mid-sentence. His disguise slips. “Oh, it is you,” says Kensu. “Not here.” He vanishes toward the eastern house.', { xp: 250 }, { req: 'spell:paralysis', cost: 4 });
q('swanhouse', 'Kensu', 'What a promise looks like', 'You give Kensu the Love Pendant. “Asina trusted me with this. I should not have forgotten what it meant.” He teaches Change. “Four forms, four different doors. Meet us at Mt. Hydra.”', { spells: ['change'], xp: 400 }, { req: 'lovePendant' });
q('aryllis', 'Aryllis', 'A flower for the moon', 'In an Amazon’s form, you present the Kirisa Plant. Aryllis smiles. “Then you know that strength and gentleness can share a hand.” She gives you the Bow of Moon.', { items: ['moonBow'], xp: 450 }, { req: ['spell:change', 'kirisa'], form: 'Amazon' });
q('swan', 'Imperial gatekeeper', 'Borrowed colors', 'Wearing a guard’s form, you pass the imperial checkpoint. The gate opens onto Goa Field. Behind you, Swan’s shore fades into the mist.', { xp: 350 }, { req: 'spell:change', form: 'Guard', flag: 'swanGate' });
q('hydra', 'Shyron gatekeepers', 'A face they trust', 'The gatekeepers recognize Stom’s form and step aside. Beyond the gate, the real Stom laughs at the resemblance. Shyron is preparing for war.', { xp: 350 }, { req: 'spell:change', form: 'Stom', flag: 'shyronGate' });
q('sanctuary', 'Zebu', 'The fourth sword', '“The Sword of Thunder sleeps in the Cave of Styx. Take its key.” Zebu’s expression darkens. “Use Barrier against the fire-spitting statues. We are counting on you.”', { items: ['styxKey'], xp: 400 });
q('styx', 'Thunder reliquary', 'The sky, held in a hand', 'You lift the Sword of Thunder. Its threefold light leaps across the chamber. Through Telepathy, the sages call: “Return to Shyron. Azteca is ready to speak.”', { items: ['thunderSword'], xp: 1000 }, { type: 'chest' });
q('sanctuary', 'Azteca', 'The truth of the long sleep', '“You and Mesia slept for a century, not a journey through time. You were scientists, given different powers against a future evil. Draygon twisted the sages’ gifts and drew four warriors to his side. Now he seeks Mesia’s power to call the tower. Stop him.”', { xp: 800 }, { flag: 'truthOfSleep' });
q('goa', 'Kensu in disguise', 'The empire’s secret', 'Kensu lowers his voice. “The tower was built to stop another catastrophe. Draygonia intends to use it as a weapon. I will search the fortress. Stay close.”', { xp: 450 });
q('goaf1', 'A telepathic warning', 'Return to Shyron', 'A cry cuts through the fortress’s hum. “Shyron is under attack! They have reached the sanctuary!” You turn from the iron seal. There is no time to lose.', { xp: 300 }, { flag: 'shyronFallen' });
q('shyron', 'Stom, wounded', 'The last lesson', 'Shyron is silent. Akahana lies wounded nearby. Stom grips your hand. “Mado… in the sanctuary. Take care of Tornel. Keep your feet under you, all right?” His hand relaxes. The lesson is over; the promise is not.', { xp: 600 }, { flag: 'stomGone' });
q('sanctuary', 'Mado', 'The sanctuary’s invader', 'Mado unfolds from a metal sphere. “The sages are ours. So is Mesia.” A ring of throwing stars spins above his hands.', { items: ['thunderBall'], xp: 1008 }, { type: 'boss', boss: 'mado1', after: 'Mado retreats, leaving the Ball of Thunder. Its charge-II blast can break Goa’s iron seals. The captured sages are still alive.' });
q('goaf1', 'Iron sentinel seal', 'Thunder opens the door', 'The iron sentinel fractures under your thunder blast. Its fire goes out. Behind it, the fortress’s first real defense awakens.', { xp: 400 }, { type: 'seal', element: 'thunder', tier: 2 });
q('goaf1', 'General Kelbesque', 'An old promise, a new battle', '“I told you we would meet again.” Kelbesque draws the fortress stones into a circling storm.', { items: ['opel'], xp: 2032 }, { type: 'boss', boss: 'kel2', after: 'Kelbesque falls. An Opel Statue remains among the stones. Zebu’s prison opens.' });
q('goaf1', 'Zebu, freed', 'One light restored', '“One of us is free. Three still wait.” Zebu restores your strength. “Go carefully. The fortress grows more dangerous above.”', { heal: true, xp: 600 });
q('goaf2', 'Sabera', 'No more borrowed faces', 'Sabera has abandoned her disguises. “Let us see how long your magic lasts.” Purple fire gathers around her hands.', { items: ['repun'], xp: 2032 }, { type: 'boss', boss: 'sabera2', after: 'The last illusion dissolves. A Fruit of Repun remains, and Tornel steps from the opened cell.' });
q('goaf2', 'Tornel, freed', 'For Stom', 'Tornel listens as you tell him about Stom. For a moment he says nothing. Then he steadies your shoulders. “He would tell you to keep going.” He restores your strength. You climb together in spirit.', { heal: true, xp: 700 });
q('goaf3', 'Mado', 'The rolling thunder', 'Mado’s armor spins faster than before. “No sanctuary. No escape.” The floor flashes with the paths of his next charge.', { items: ['sacred'], xp: 2032 }, { type: 'boss', boss: 'mado2', after: 'Mado’s armor comes to rest. The Sacred Shield shines inside the fallen shell. Asina is free.' });
q('goaf3', 'Asina, freed', 'The last of the four', 'Asina restores your strength. “Karmine can turn a person into a monster. Recover will not undo that curse. Keep a Fruit of Repun ready. Kensu is somewhere above us.”', { heal: true, items: ['repun'], xp: 700 });
q('kensucell', 'Kensu the slime', 'A very small problem', 'The blue slime sighs. “Yes, it is me. No, this is not a disguise. Karmine has the Ivory Statue; it can restore me. Please hurry. I dislike being this close to the floor.”', { xp: 500 });
q('goaf4', 'Karmine', 'The curse-maker', 'Karmine raises two hands: one holds red fire, the other an impossible blue. “I could make you something much less troublesome.”', { items: ['ivory'], xp: 2032 }, { type: 'boss', boss: 'karmine', after: 'Karmine’s curse breaks around the room. The Ivory Statue is yours. A final chest glows beyond him.' });
q('goaf4', 'Storm chest', 'All the thunder in the sky', 'The Storm Bracelet rests beyond Karmine’s chamber. Thunder answers before you touch it. Charge III calls a storm over every enemy in sight.', { items: ['storm'], xp: 1000 }, { type: 'chest' });
q('kensucell', 'Kensu the slime', 'Room to rise', 'The Ivory Statue restores Kensu. “Much better. Draygon and Mesia have gone to the pyramid. She can call the tower, but she will never willingly give it to him.” He teaches Flight and opens the shortcut to Oasis Cave.', { spells: ['flight'], heal: true, xp: 1000 }, { req: 'ivory' });
q('goa', 'Akahana’s friend', 'An overdue return', 'In Akahana’s form, you visit his friend. “At last! Here is the Warrior Ring you lent me.” You accept it with a quiet promise to honor the collector who helped you twice.', { items: ['warriorRing'], xp: 500 }, { req: 'spell:change', form: 'Akahana' });
q('sunledge', 'Sunlit chest', 'A bridge made of air', 'Flight carries you across the sheer gap. On the far ledge, the Bow of Sun gleams in an old chest.', { items: ['sunBow'], xp: 1200 }, { type: 'chest', req: 'spell:flight' });
q('oasiscave', 'Desert expedition chest', 'Ready for the long crossing', 'An old expedition’s equipment has survived the centuries: Leather Boots for the poisoned ground, Battle Armor against toxins, and a Power Ring behind an iron seal.', { items: ['leatherBoots', 'battleArmor', 'powerRing'], xp: 1600 }, { type: 'chest', req: 'thunderBall' });
q('saharafield', 'Deo', 'The memory of a friend', 'Deo’s face lights up at Stom’s form. Gently, you tell him the truth. He places a pendant in your hand. “Then take this. Let something of him keep you company.”', { items: ['deoPendant'], xp: 1000 }, { req: 'spell:change', form: 'Stom' });
q('sahara', 'Sahara elder', 'The last town before the sky', '“Mesia will lead you to the tower,” says the elder. “Rest here. The pyramid holds the empire’s last lie, and the truth you will need to end it.”', { heal: true, xp: 800 });
q('pyramid', 'Emperor Draygon', 'The emperor of ruins', 'Draygon rises from the throne. “So the sleeper has come. Show me what a century of waiting has made of you.” Lightning divides the room.', { items: ['psychoArmor'], xp: 2032 }, { type: 'boss', boss: 'draygon1', after: 'Draygon’s armored form collapses. Psycho Armor remains, warm with restorative power. The floor gives way beneath the throne.' });
q('pyramid', 'Azteca, wounded', 'The bow that sees clearly', 'Azteca waits by the fallen passage. “Do not worry about me. Mesia is above. Take the basement route, and take the Bow of Truth. The emperor is not what he seems.”', { items: ['truthBow'], xp: 1200 });
q('basement', 'Sun Guardian', 'The sun falls silent', 'The Bow of Sun sends a single golden arrow through the guardian’s burning eye. Its ancient weapon falls silent.', { xp: 1000 }, { req: 'sunBow', flag: 'sunSilent' });
q('basement', 'Moon Guardian', 'The moon opens the way', 'The Bow of Moon answers the second guardian. Silver light fades from its stone face. Between the two statues, the inner passage opens.', { xp: 1000 }, { req: 'moonBow', flag: 'guardians' });
q('draygonlair', 'Draygon’s true form', 'The shape of the truth', 'The Bow of Truth shatters the emperor’s disguise. A dragon of corrupted power rises above you. In its chest, a single eye opens.', { xp: 2500 }, { type: 'boss', boss: 'draygon2', req: 'truthBow', after: 'The dragon falls. The Four Wise Men appear around a familiar figure on the ground: Azteca.' });
q('draygonlair', 'Azteca’s last words', 'What we choose to become', '“Draygon was the darkness I tried to drive from myself. It took a life of its own.” Azteca’s voice softens. “You and Mesia are awake. The tower is active.” He dies among the sages. Mesia’s voice reaches you: “Come. There is still time.”', { xp: 2500 }, { flag: 'towerAwake' });
q('towerentry', 'Tower crystal', 'No road back', 'The crystal lifts you into the sky. The ground falls away. Rest here before you continue; beyond this threshold, the tower will not let you return until its heart is stilled.', { heal: true, xp: 1000 }, { flag: 'inTower' });
q('tower1', 'First defense system', 'The machine remembers', 'Cyborg soldiers activate across the platform. Their armor opens to reveal a second line of Walking E-Frames. Clear both waves to reveal the stair.', { xp: 3000 }, { type: 'wave', wave: ['Cyborg Soliders', 'Cyborg Soliders', 'Flybots', 'Walking E-Frames', 'Walking E-Frames'], flag: 'tower1' });
q('tower2', 'First memory terminal', 'The tower’s makers', 'A recorded voice speaks. “You and Mesia were part of the team that built this tower. You slept to watch the future race. When the tower began to operate, your chambers woke you.” The past finally has a shape.', { xp: 1500 });
q('tower2', 'Second defense system', 'Steel beneath the stars', 'Wall cannons track your steps. Another line of cyborgs wakes, followed by Walking E-Frames. The next stair remains hidden until the platform is clear.', { xp: 3000 }, { type: 'wave', wave: ['Cyborg Soliders', 'Flybots', 'Cyborg Soliders', 'Walking E-Frames', 'Walking E-Frames', 'Walking E-Frames'], flag: 'tower2' });
q('tower3', 'Second memory terminal', 'Azteca’s beginning', 'The record continues. “Azteca was an android, created to guide the survivors. If he failed, you were to be the world’s second chance.” You think of the sages around him, and of the man who chose to tell the truth at the end.', { xp: 1500 });
q('tower3', 'Final defense system', 'The last stair', 'The final defense line powers up. Beyond it, Mesia waits with the answer to four unfinished swords.', { xp: 3500 }, { type: 'wave', wave: ['Cyborg Soliders', 'Flybots', 'Walking E-Frames', 'Walking E-Frames', 'Walking E-Frames', 'Walking E-Frames'], flag: 'tower3' });
q('tower4', 'Mesia', 'Four become one', 'Mesia takes your hands. Wind, Fire, Water and Thunder rise together. “We were never meant to do this alone.” The four blades unite into Crystalis. “Destroy DYNA. Then place the sword in the reactor. I will find you.”', { items: ['crystalis'], heal: true, xp: 2000 }, { req: ['windSword', 'fireSword', 'waterSword', 'thunderSword'] });
q('dyna', 'DYNA', 'A future without fear', 'The master computer opens its great eye. The tower’s voice is no longer human. “THREAT IDENTIFIED.” Crystalis answers with a clear, white light.', { xp: 0 }, { type: 'boss', boss: 'dyna', after: 'The eye shatters. Lasers fade. For the first time since the END DAY, the machine is silent. Only the reactor remains.' });
q('dyna', 'Reactor heart', 'Let the world wake', 'You place Crystalis into the reactor. Mesia appears through the falling light. “It is time to go.” Together you leave the tower behind. Below, the windmill turns. The world belongs to its people again.', { xp: 0 }, { flag: 'won', ending: true });

    settingsPage() { const s = this.p.s.settings; const toggle = (id, title, desc) => `<div class="setting-row"><div><strong>${title}</strong><small>${desc}</small></div><button class="switch ${s[id] ? 'on' : ''}" role="switch" aria-checked="${s[id]}" aria-label="${title}" data-setting="${id}"></button></div>`; return `<h3>A comfortable kind of adventure</h3><div class="settings-group"><div class="setting-row"><div><strong>Graphics, display & controls</strong><small>Quality, resolution, frame cap, touch layout, vibration and look sensitivity. These are shared by every 3D game on this device.</small></div><button class="ghost-button" data-action="kitmenu">${icon('settings', 15)}Open</button></div><div class="setting-row"><div><strong>Challenge</strong><small>Story reduces incoming damage; Heroic increases it.</small></div><div class="segmented">${[['story', 'Story'], ['adventure', 'Adventure'], ['heroic', 'Heroic']].map(([id, n]) => `<button class="${s.difficulty === id ? 'selected' : ''}" data-difficulty="${id}">${n}</button>`).join('')}</div></div>${toggle('aimAssist', 'Gentle aim assistance', 'Helps charged attacks find nearby enemies and seals.')}${toggle('motion', 'World motion & screen shake', 'Turn off to reduce motion. Combat animations remain readable.')}${toggle('performance', 'Performance readout', 'Shows the actual renderer, quality tier, frame rate and triangle count.')}</div><h3>The sound of the road</h3>${toggle('sound', 'Music & sound effects', 'An original, procedurally synthesized little soundtrack.')}<div class="setting-row"><div><strong>Volume</strong><small>Quiet enough to hear the world around you.</small></div><input id="volume-slider" type="range" min="0" max="1" step=".05" value="${s.volume}" aria-label="Sound volume"></div><div class="divider"></div><h3>Your journey, kept safe</h3><p>Autosaves are local to this browser. Export a save before clearing browser data or moving to another device. Import replaces the active journey only after validation.</p><div class="settings-actions"><button class="ghost-button" data-action="export">${icon('download', 15)}Export save</button><button class="ghost-button" data-action="import">${icon('upload', 15)}Import save</button><button class="ghost-button" data-action="newgame">A new beginning</button></div><div class="about-note"><p><strong>Active renderer:</strong> ${esc(this.game.renderer.label)}<br>three.js r186 WebGPURenderer from the hub’s shared 3D kit. It uses WebGPU where the browser offers it and WebGL 2 everywhere else.</p></div><button class="text-button" data-action="about">Content, source notes & credits →</button>`; }
    shopPage() { const items = (SHOPS[this.game.world.id] || []).map(id => ITEMS[id]); return `<div class="section-heading"><h3>A little preparation goes a long way.</h3><span class="section-count">${esc(this.game.world.zone.name)}</span></div><p>Equipment is reusable. Supplies are consumed when used. New armor and shields equip automatically when stronger; change your equipment in the satchel. Shops also buy back ordinary equipment and supplies.</p><div class="item-grid">${items.map(i => this.itemCard(i, true)).join('')}</div><div class="divider"></div><h4>Other items to sell</h4><div class="filter-row">${Object.values(ITEMS).filter(i => this.p.has(i.id) && ['armor', 'shield', 'supply'].includes(i.type) && (i.sell || i.price) > 0).map(i => `<button data-sell="${i.id}">${esc(i.name)} · ${i.sell ?? Math.floor(i.price / 2)} gold</button>`).join('')}</div>`; }
    formsPage() { return `<h3>One traveler. Four familiar faces.</h3><p>Change costs 20 MP. Returning to yourself is free. Your new form is visible in the world and matters to the people guarding certain roads.</p><div class="forms-grid">${[['Amazon', 'Enter Aryllis’s court and offer the Kirisa Plant.', 'leaf'], ['Guard', 'Pass Swan’s imperial checkpoint.', 'shield'], ['Stom', 'Enter Shyron and bring a memory to Deo.', 'sword'], ['Akahana', 'Collect the Warrior Ring from his friend in Goa.', 'bag']].map(([name, d, ic]) => `<button class="form-card" data-form="${name}">${icon(ic, 29)}<strong>${name}</strong><span>${d}</span></button>`).join('')}</div><div class="settings-actions"><button class="ghost-button" data-form="Self">${icon('person', 18)}Return to yourself</button></div>`; }
    bestiaryPage() { const seen = this.p.s.seen; return `<div class="section-heading"><h3>Know what your sword can touch.</h3><span class="section-count">${seen.length} / ${BESTIARY.length} encountered</span></div><p>Element tags show vulnerabilities, not resistances. Switching swords is often more useful than swinging harder. Wall cannons are hazards: dodge or use Barrier.</p>${BESTIARY.map(e => `<div class="bestiary-row" style="opacity:${seen.includes(e.name) ? 1 : .5}"><div><strong>${esc(e.name)}</strong><small>${seen.includes(e.name) ? 'ENCOUNTERED' : 'UNSEEN'} · ${e.xp} BASE EXP · ${e.gold} GOLD${e.status !== 'None' ? ' · ' + esc(e.status).toUpperCase() : ''}</small></div><div class="element-pills">${e.vulnerable.map(id => `<span class="element-pill" style="color:${ELEMENTS.find(x => x.id === id).color}">${ELEMENTS.find(x => x.id === id).name}</span>`).join('') || '<span class="element-pill" style="color:#c1c7b9">Invulnerable</span>'}</div></div>`).join('')}`; }
    controlsHTML() { const cards = { touch: `<div class="controls-card"><h4>Touch</h4><p>Left side · move (the stick appears under your thumb)<br>Sword · tap to slash, hold & release to charge<br>Dodge · evade / Rabbit Boots hop<br>Magic · cast; hold to choose a spell<br>Heal · herb or Refresh<br>Talk · appears near people, doors and chests<br>Sword › · next sword · II · pause</p></div>`, keyboard: `<div class="controls-card"><h4>Keyboard & mouse</h4><p>WASD / arrows · move<br>J / Space / left click · sword (hold to charge)<br>Shift / K / right click · dodge<br>E · interact & continue dialogue<br>Q · heal · F · magic (hold for the list)<br>1–4 · sword · M · atlas · I · satchel<br>L · journal · N · Life in Leaf · Esc / P · pause</p></div>`, gamepad: `<div class="controls-card"><h4>Gamepad</h4><p>Left stick / D-pad · move<br>A / RT · sword (hold & release to charge)<br>B · dodge · X · interact<br>Y · magic (hold for the list) · LT · heal<br>LB / RB · switch sword<br>Start · pause · Back · atlas<br>Menus: D-pad, A select, B back, LB / RB tabs</p></div>` }; const first = KIT?.input.source || 'keyboard'; return `<div class="controls-grid">${[first, ...['touch', 'keyboard', 'gamepad'].filter(k => k !== first)].map(k => cards[k]).join('')}</div>`; }

    exportSave() { const blob = new Blob([JSON.stringify(this.p.s, null, 2)], { type: 'application/json' }), url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = 'shard-and-sky-journey.json'; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); this.toast('A copy of your journey has been exported.', 'heal'); }
    bindMenuActions() {
        const body = document.getElementById('menu-body');
        body.querySelectorAll('[data-action]').forEach(b => b.onclick = () => { const a = b.dataset.action; if (a === 'resume')
            this.closeMenu(); if (a === 'export')
            this.exportSave(); if (a === 'import')
            document.getElementById('import-save').click(); if (a === 'about') {
            this.menu = 'about';
            this.renderMenu();
        } if (a === 'newgame')
            this.confirmNewGame(); if (a === 'catalogue') {
            this.catalogue = !this.catalogue;
            this.renderMenu();
        } if (a === 'storytrail') {
            this.game.destination = null;
            this.closeMenu();
            this.toast('Following the main story again.', 'info');
        } if (a === 'kitmenu')
            KIT?.menu.open(); });
        body.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { this.filter = b.dataset.filter; this.renderMenu(); });
        body.querySelectorAll('[data-atlas-filter]').forEach(b => b.onclick = () => { this.atlasFilter = b.dataset.atlasFilter; this.renderMenu(); });
        body.querySelectorAll('[data-item]').forEach(b => b.onclick = () => this.useItem(b.dataset.item));
        body.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { const r = this.p.buy(b.dataset.buy); if (r.ok) {
            this.game.sound.effect('coin');
            this.toast('Packed · ' + ITEMS[b.dataset.buy].name, 'discover');
            this.renderMenu();
            this.refresh();
        }
        else
            this.toast(r.reason); });
        body.querySelectorAll('[data-sell]').forEach(b => b.onclick = () => { if (this.p.sell(b.dataset.sell)) {
            this.game.sound.effect('coin');
            this.renderMenu();
            this.refresh();
        } });
        body.querySelectorAll('[data-prepare]').forEach(b => b.onclick = () => { this.p.s.magic = b.dataset.prepare; this.p.save(); this.renderMenu(); this.refresh(); });
        body.querySelectorAll('[data-cast]').forEach(b => b.onclick = () => { const id = b.dataset.cast; this.p.s.magic = id; this.closeMenu(); this.game.cast(id); });
        body.querySelectorAll('[data-form]').forEach(b => b.onclick = () => { if (this.game.changeForm(b.dataset.form))
            this.closeMenu(); });
        body.querySelectorAll('[data-warp]').forEach(b => b.onclick = () => { const boots = this.mapBoots || !(this.p.has('spell:teleport') && this.p.s.mp >= 20); this.game.teleport(b.dataset.warp, boots); this.mapBoots = false; });
        body.querySelectorAll('[data-waypoint]').forEach(b => b.onclick = () => { this.game.destination = b.dataset.waypoint; this.closeMenu(); this.toast('Trail set · ' + ZONES[b.dataset.waypoint].name, 'info'); this.refresh(); });
        body.querySelectorAll('[data-setting]').forEach(b => b.onclick = () => { this.p.s.settings[b.dataset.setting] = !this.p.s.settings[b.dataset.setting]; this.saveSettings(); this.renderMenu(); });
        body.querySelectorAll('[data-difficulty]').forEach(b => b.onclick = () => { this.p.s.settings.difficulty = b.dataset.difficulty; this.saveSettings(); this.renderMenu(); });
        const volume = document.getElementById('volume-slider');
        if (volume)
            volume.oninput = () => { this.p.s.settings.volume = Number(volume.value); this.saveSettings(); };
    }
    saveSettings() { this.p.save(); this.game.sound.updateSettings(this.p.s.settings); this.updateSoundButton(); this.refresh(); }
    useItem(id) { const i = ITEMS[id]; if (['sword', 'armor', 'shield', 'accessory'].includes(i.type)) {
        this.p.equip(id);
        if (i.type === 'sword')
            this.game.sword.geo = swordGeo(i.element);
        this.game.sound.effect('click');
        this.renderMenu();
        this.refresh();
        return;
    } if (id === 'warpBoots') {
        this.mapBoots = true;
        this.menu = 'map';
        this.renderMenu();
        return;
    } if (i.type === 'supply' && id !== 'opel') {
        const r = this.p.useSupply(id);
        this.toast(r.ok ? 'Used · ' + i.name : r.reason, r.ok ? 'heal' : 'info');
        if (r.ok)
            this.game.sound.effect('magic');
        this.renderMenu();
        this.refresh();
        return;
    } const q = this.p.quest, needed = q && (Array.isArray(q.req) ? q.req : [q.req]).includes(id); if (needed && q.zone === this.game.world.id) {
        const target = this.game.world.entities.find(e => e.type === 'story' && e.name === q.actor);
        if (target && Math.hypot(target.x - this.game.hero.x, target.z - this.game.hero.z) < 3.5) {
            this.closeMenu();
            this.game.interact(target);
            return;
        }
    } this.showDialog(i.name, i.desc + (i.type === 'quest' ? '\n\nStory items are used automatically when you interact with the right person or object.' : ''), null, { item: id }); }
    confirmNewGame() { this.showDialog('A new beginning', 'This starts a fresh journey and replaces this browser’s autosave. Export your current save first to keep it.', [{ label: 'Begin again', action: () => { this.saved = null; this.closeMenu(); this.game.start(newState()); } }, { label: 'Keep this journey', action: () => { } }]); }
    showEnding() { const s = this.p.s; const layer = document.getElementById('ending-layer'); layer.classList.remove('hidden'); layer.innerHTML = `<div class="ending-content"><div style="color:var(--gold)">${icon('crystal', 54)}</div><div class="eyebrow">THE TOWER IS SILENT. THE WINDMILL TURNS.</div><h1>The world is waking.</h1><p>You and Mesia leave the sky behind.<br>Below, windows glow in Leaf. The sea is calm.<br>For the first time in a century,<br>tomorrow belongs to everyone.</p><div class="stat-grid"><div class="stat-card"><strong>13</strong><span>BOSSES OVERCOME</span></div><div class="stat-card"><strong>${s.visited.length}</strong><span>PLACES DISCOVERED</span></div><div class="stat-card"><strong>${SIDEQUESTS.filter(q => s.side[q.id]?.done).length+Object.values(s.contracts||{}).filter(q=>q.done).length}/${EXPANSION_COUNTS.sideQuests}</strong><span>LITTLE KINDNESSES</span></div><div class="stat-card"><strong>${Math.floor(s.playtime / 60)}m</strong><span>A JOURNEY TO KEEP</span></div></div><div class="ending-buttons"><button id="ending-return" class="gold-button">Visit the world you saved ${icon('arrow', 17)}</button><button id="ending-export" class="ghost-button">Keep a copy of this journey</button></div><p class="ending-credits">SHARD & SKY · LIVING LEAF · SECOND PASS<br>An unofficial Crystalis-inspired fan adventure.<br>Thank you for carrying a little light into the world.</p></div>`; document.getElementById('ending-return').onclick = () => { layer.classList.add('hidden'); this.p.healAll(); this.p.s.form = 'Self'; this.p.enter('leaf', null, true); this.game.loadZone('leaf'); this.game.destination = null; this.toast('Welcome home. Your unfinished side stories are still waiting.', 'heal'); }; document.getElementById('ending-export').onclick = () => this.exportSave(); this.game.sound.effect('level'); }
}


const uiBuildOriginal=Interface.prototype.build;
Interface.prototype.build=function(){
 uiBuildOriginal.call(this);
 document.querySelector('.title-subtitle').textContent='THE LIVING LEAF · SECOND PASS';
 document.querySelector('.title-description').innerHTML='Four elemental swords.<br>Every road has a story.';
 const loading=document.createElement('div');loading.id='world-loading';loading.setAttribute('role','status');loading.setAttribute('aria-live','polite');
 loading.innerHTML='<div class="loading-card"><div class="loading-emblem">'+icon('crystal',42)+'</div><div class="eyebrow">SHARD & SKY · OPEN ROADS</div><h2 id="loading-place">Opening the world</h2><p id="loading-detail">Preparing the scene and its renderer.</p><div class="loading-progress"><span></span></div><small>Movement starts after the whole area is ready.</small></div>';
 document.getElementById('app').append(loading);

Interface.prototype.showLoading=function(name){const el=document.getElementById('world-loading');el.classList.remove('hidden');document.getElementById('loading-place').textContent=name;document.getElementById('loading-detail').textContent='Preparing the scene and its renderer.';document.getElementById('start-game').disabled=true;};
Interface.prototype.hideLoading=function(){document.getElementById('world-loading').classList.add('hidden');document.getElementById('start-game').disabled=false;};
Interface.prototype.loadingFailure=function(text){document.getElementById('loading-detail').textContent=text;const card=document.querySelector('.loading-card');if(card.querySelector('[data-retry]'))return;const b=document.createElement('button');b.className='gold-button';b.dataset.retry='';b.textContent=KIT?.backend==='webgpu'?'Reload on WebGL 2':'Reload';b.onclick=()=>{if(KIT?.backend==='webgpu')KIT.settings.set({backend:'webgl2'});location.reload();};card.append(b);};
Interface.prototype.drawAreaMap=function(canvas,mini=true){
 if(!this.game)return;const w=this.game.world,ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
 const scale=Math.min((W-18)/(w.bounds.x*2),(H-18)/(w.bounds.z*2)),X=x=>W/2+x*scale,Y=z=>H/2+z*scale;
 // The terrain layer only changes as more of the area is explored (or an ice bridge forms), so it is cached.
 const explored=this.p.s.explored?.[w.id]||[],key=w.id+'|'+explored.length+'|'+W+'x'+H+'|'+!!this.p.s.flags['iceBridge:'+w.id];
 const layers=this.mapLayers||(this.mapLayers={}),slot=mini?'mini':'large';let layer=layers[slot];
 if(!layer||layer.key!==key||layer.world!==w){
  const off=layer?.canvas||document.createElement('canvas');off.width=W;off.height=H;const c=off.getContext('2d');
  c.fillStyle='#102b30';c.fillRect(0,0,W,H);const seen=new Set(explored);
  for(let x=-w.bounds.x;x<w.bounds.x;x+=2)for(let z=-w.bounds.z;z<w.bounds.z;z+=2){
   if(!w.floorAt(x+1,z+1))continue;const known=seen.has(Math.floor(x/4)+','+Math.floor(z/4));
   c.fillStyle=!w.walkable(x+1,z+1)?'#225469':w.isDungeon?(known?'#858374':'#35494a'):(known?'#678849':'#345641');
   if(!w.isDungeon&&w.roads.some(a=>lineDistance(x+1,z+1,a.a,a.b)<a.width/2))c.fillStyle=known?'#b2a875':'#526452';
   c.fillRect(X(x),Y(z),2*scale+.25,2*scale+.25);
  }
  for(const b of w.buildings){c.fillStyle='#b57645';c.fillRect(X(b.x-2.6),Y(b.z-2.2),5.2*scale,4.4*scale);}
  layer=layers[slot]={key,world:w,canvas:off};
 }
 ctx.clearRect(0,0,W,H);ctx.drawImage(layer.canvas,0,0);
 const target=this.game.navTarget();
 for(const e of w.entities){if(e.hidden)continue;const active=e===target,near=Math.hypot(e.x-this.game.hero.x,e.z-this.game.hero.z)<14;
  if(!active&&!near&&e.type!=='portal')continue;
  ctx.fillStyle=active?'#ffe7a1':e.type==='portal'?'#b8dee0':['contract','side','task','resource'].includes(e.type)?'#71d0df':e.type==='chest'?'#d4ad58':'#d7d1b5';
  const size=active?3.4:mini?1.6:2.8;ctx.beginPath();ctx.arc(X(e.x),Y(e.z),size,0,TAU);ctx.fill();
  if(!mini&&(active||e.type==='portal')){ctx.font='11px Arial';ctx.fillStyle='#f6edd4';const label=e.name.length>32?e.name.slice(0,30)+'…':e.name;ctx.fillText(label,clamp(X(e.x)+6,3,W-label.length*6),clamp(Y(e.z)-5,12,H-3));}
 }
 const h=this.game.hero;ctx.fillStyle='#fff7dc';ctx.strokeStyle='#173539';ctx.lineWidth=2;ctx.beginPath();ctx.arc(X(h.x),Y(h.z),mini?3.2:5,0,TAU);ctx.fill();ctx.stroke();
 ctx.font='bold 11px Arial';ctx.fillStyle='#e8d190';ctx.fillText('N',W-15,15);
};
Interface.prototype.drawMiniMap=function(){if(!this.game||this.game.preview)return;this.drawAreaMap(document.getElementById('minimap'),true);};
const oldJournal=Interface.prototype.journalPage;

Interface.prototype.mapPage=function(){
 const s=this.p.s,q=this.p.quest,route=q?this.p.route(q.zone):[],canSpell=this.p.has('spell:teleport'),canBoot=this.p.has('warpBoots'),towns=s.visited.filter(id=>ZONES[id].kind==='town');

Interface.prototype.aboutPage=function(){return '<h3>Shard & Sky · Open Roads Edition</h3><p>An unofficial Crystalis-inspired fan game. Original code, geometry, music, dialogue, and visual effects. No ROM or extracted art is used.</p><div class="about-note"><p>The supplied walkthrough and map guide provide the original story sequence, item catalogue, spells, enemy names, and regional structure. The expanded build has '+EXPANSION_COUNTS.locations+' locations, '+EXPANSION_COUNTS.dungeonPassages+' added dungeon passages, '+EXPANSION_COUNTS.interiors+' interiors, '+EXPANSION_COUNTS.sideQuests+' optional side quests, and four elemental trials.</p></div><h4>What was expanded</h4><p>The numbered source passages inform connected dungeon networks. Room shapes and new room names are original, not a tile-for-tile copy of the ASCII maps. Towns now have walk-in homes, inns, outfitters, and workshops. Added contracts, survey records, sword mastery, and trials are marked as new systems.</p><h4>Guide differences</h4><p>The item compendium supplies continuous magic costs. Refresh converts 1 MP to 2 HP. Barrier costs 7 MP per second. Flight costs 4 MP per second. Fruit of Power restores one quarter of maximum MP. Teleport costs 20 MP. Portoa’s Platinum Armor uses the compendium’s 2,200-gold price. The later account of cryogenic sleep takes precedence in the story. These are documented design choices where the supplied guides differ.</p><h4>Rendering</h4><p>three.js r186 (0.186.1) through the hub’s shared 3D kit. Its WebGPU renderer uses WebGPU where the browser offers it and WebGL 2 everywhere else; nothing is downloaded from outside the hub. The active renderer is shown in Settings. All scene geometry is prepared, and its shaders compiled, before movement starts.</p><h4>Save compatibility</h4><p>Version 1 story IDs and item IDs are retained. Old saves load through the save importer. New mastery, exploration, and contract fields start empty. Keep an exported backup before replacing a const llWorldUpdate=World.prototype.update;
World.prototype.update=function(t,dt,hero){
 llWorldUpdate.call(this,t,dt,hero);
 const s=this.progress.s,missing=leafMissing(s)&&(this.id==='leaf'||VENUES[this.id]);
 const active=living(s).tracked,arc=ARCS.find(a=>a.id===active),step=arc&&arc.steps[arcState(this.progress,active)?.step];
 for(const e of this.entities){
  if(!e.ll)continue;
  if(['local','llCrowd'].includes(e.type)){
   e.hidden=!!missing;e.obj.visible=!missing;if(e.marker)e.marker.visible=false;if(missing)continue;
  }
  if(e.type==='llCrowd'){
   const dx=e.goal[0]-e.home[0],dz=e.goal[1]-e.home[1],dist=Math.hypot(dx,dz),duration=Math.max(5,dist/e.speed),phase=(t+e.phase)%(duration*2+6),u=phase<duration?phase/duration:phase<duration+3?1:phase<duration*2+3?1-(phase-duration-3)/duration:0;
   e.x=e.home[0]+dx*u;e.z=e.home[1]+dz*u;const pos=e.obj.pos;pos[0]=e.x;pos[1]=u>0&&u<1&&s.settings.motion?Math.sin(t*8+e.phase)*.023:0;pos[2]=e.z;
   if(dist>.1&&u>0&&u<1)e.obj.rot[1]=Math.atan2(dx,dz)+(phase>duration+3?Math.PI:0);
  }else if(e.type==='local'){
   const near=Math.hypot(hero.x-e.x,hero.z-e.z)<6,eid=e.person;
   const relevant=step?.who===eid||arc&&!step&&arc.giver===eid||ARCS.some(a=>a.giver===eid&&arcAvailable(this.progress,a)&&!arcState(this.progress,a.id)?.done);
   e.marker.visible=!missing&&near&&relevant;
  }else if(e.type==='llRecord')e.marker.visible=step?.record===e.record||Math.hypot(hero.x-e.x,hero.z-e.z)<4&&!living(s).records.includes(e.record);
  else if(e.type==='llTraining')e.marker.visible=this.progress.has('windSword')&&!living(s).guide.trainingReward&&Math.hypot(hero.x-e.x,hero.z-e.z)<7;
 }
};

  const actions=a.choices?a.choices.map(c=>({label:c[1],action:()=>complete(c[0])})):[{label:'Complete this chapter',action:()=>complete(null)}];actions.push({label:'Decide later',action:()=>this.talkLocal(a.giver)});this.showDialog(a.name,a.end+(a.choices?'\n\nChoose what happens first. Both needs remain in the ledger.':''),actions,{person:a.giver,local:true,subtitle:'Your choice is kept in the notebook'});return;
