<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Three.js Isometric Low-Poly Boilerplate</title>
  <meta name="description" content="A low-poly isometric diorama: orbit, pan and zoom around a glowing block town, then build on its tile grid with blocks, trees and street lamps from day to night." />
  <meta name="theme-color" content="#0b1020" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Cpath d='M32 10 53 22 32 34 11 22z' fill='%237d9ad6'/%3E%3Cpath d='M11 22 32 34v21L11 43z' fill='%233c527f'/%3E%3Cpath d='M53 22 32 34v21l21-12z' fill='%235272a8'/%3E%3Cpath d='M15 36l13 7.5' stroke='%2372e7ff' stroke-width='3'/%3E%3C/svg%3E" />
  <!-- The shared 3D stack (lib/kit/README.md §1). -->
  <script type="importmap">
  {
    "imports": {
      "three": "/lib/three/three.webgpu.js",
      "three/webgpu": "/lib/three/three.webgpu.js",
      "three/tsl": "/lib/three/three.tsl.js",
      "three/addons/": "/lib/three/addons/",
      "kit/": "/lib/kit/"
    }
  }
  </script>
  <link rel="modulepreload" href="/lib/three/three.core.js" />
  <link rel="modulepreload" href="/lib/three/three.webgpu.js" />
  <style>
    :root {
      color-scheme: dark;
      --ink: #dbe8ff;
      --muted: #9fb4d8;
      --panel: rgba(8, 13, 27, 0.82);
      --line: rgba(134, 183, 255, 0.25);
      --accent: #72e7ff;
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b1020; color: var(--ink); }
    body { font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    button { font: inherit; color: inherit; }

    /* Top-left: what the diorama holds, plus undo, time of day and the menu. */
    .hud {
      position: fixed; z-index: 10;
      left: calc(12px + env(safe-area-inset-left)); top: calc(12px + env(safe-area-inset-top));
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      max-width: min(340px, 60vw); pointer-events: none;
    }
    /* On touch the kit's pills sit top-right under the gear: keep the HUD clear of them. */
    html.kit-touch-on .hud { max-width: max(132px, calc(100vw - 268px)); }
    .card { padding: 8px 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .card strong { display: block; font-size: 13px; letter-spacing: .02em; }
    .card span { display: block; color: var(--muted); font-size: 12px; }
    .hud-row { display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; }
    .hbtn {
      min-height: 32px; padding: 5px 10px; border-radius: 9px; cursor: pointer;
      border: 1px solid var(--line); background: var(--panel); white-space: nowrap;
    }
    .hbtn:hover, .hbtn:focus-visible { border-color: var(--accent); outline: none; }
    .hbtn:disabled { opacity: .45; cursor: default; }
    html.kit-touch-on #bMenu { display: none; } /* the II pill opens the menu on touch */

    /* Bottom: the tool bar and a one-line hint above it. */
    .tools {
      position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
      bottom: calc(12px + env(safe-area-inset-bottom) + var(--kit-touch-bottom, 0px));
      display: flex; gap: 5px; padding: 6px; box-sizing: border-box; max-width: calc(100vw - 24px);
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    }
    .tool {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      min-width: 54px; height: 54px; padding: 4px 6px; box-sizing: border-box; cursor: pointer;
      border-radius: 10px; border: 1px solid transparent; background: rgba(255, 255, 255, .04);
    }
    .tool svg { width: 24px; height: 24px; display: block; }
    .tool .lbl { font-size: 11px; color: #b9c9e6; }
    .tool kbd { position: absolute; top: 3px; right: 5px; font: 600 9px/1 ui-monospace, Menlo, monospace; color: #7f93b8; }
    html:not(.src-keyboard) .tool kbd { display: none; }
    .tool:hover { background: rgba(255, 255, 255, .09); }
    .tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .tool[aria-pressed="true"] { border-color: var(--accent); background: rgba(114, 231, 255, .15); }
    .tool[aria-pressed="true"] .lbl { color: var(--ink); }
    .hint {
      position: fixed; z-index: 9; left: 50%; transform: translateX(-50%);
      bottom: calc(84px + env(safe-area-inset-bottom) + var(--kit-touch-bottom, 0px));
      max-width: calc(100vw - 24px); box-sizing: border-box; padding: 6px 11px; border-radius: 9px;
      background: rgba(8, 13, 27, 0.66); color: var(--muted); font-size: 12px; text-align: center;
      pointer-events: none; transition: opacity .25s;
    }
    .hint.flash { color: var(--ink); border: 1px solid var(--line); }
    @media (max-width: 600px) {
      .tool { min-width: 42px; height: 46px; padding: 3px 4px; }
      .tool .lbl { display: none; }
      .tools { gap: 4px; padding: 5px; }
      .hint { bottom: calc(72px + env(safe-area-inset-bottom) + var(--kit-touch-bottom, 0px)); }
    }
    @media (max-height: 420px) {
      .tool { height: 42px; }
      .tool .lbl { display: none; }
      .hint { bottom: calc(66px + env(safe-area-inset-bottom) + var(--kit-touch-bottom, 0px)); }
    }

    /* Menu and controls help. */
    .overlay {
      position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: rgba(4, 7, 16, 0.55);
    }
    .overlay[hidden] { display: none; }
    .panel {
      width: min(440px, 100%); max-height: calc(100dvh - 32px); overflow: auto; box-sizing: border-box;
      padding: 16px; border-radius: 14px; background: rgba(10, 16, 34, 0.96); border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
    }
    .panel h2 { margin: 0 0 10px; font-size: 17px; letter-spacing: .02em; }
    .msec { margin: 12px 0 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .mbtn {
      display: block; width: 100%; margin: 0 0 6px; padding: 10px 12px; box-sizing: border-box; text-align: left; cursor: pointer;
      border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05);
    }
    .mbtn:hover { background: rgba(255, 255, 255, .1); }
    .mbtn:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: rgba(114, 231, 255, .12); }
    .mbtn.primary { background: rgba(114, 231, 255, .16); border-color: rgba(114, 231, 255, .5); font-weight: 600; }
    .mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px; }
    .mgrid .mbtn { margin: 0; }
    .mgrid .mbtn small { display: block; color: var(--muted); font-size: 11px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .tabs .mbtn { width: auto; display: inline-block; margin: 0; padding: 7px 10px; }
    .tabs .mbtn[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
    dl.keys { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 6px 12px; margin: 0 0 12px; }
    dl.keys dt { color: var(--muted); }
    dl.keys dd { margin: 0; }
  </style>
</head>
<body>
  <div class="hud" id="hud">
    <div class="card">
      <strong>Isometric Low-Poly</strong>
      <span id="stats">16 blocks</span>
    </div>
    <div class="hud-row">
      <button type="button" class="hbtn" id="bUndo" title="Undo (Z)" disabled>&#8630; Undo</button>
      <button type="button" class="hbtn" id="bTime" title="Time of day (T)">&#9728; Day</button>
      <button type="button" class="hbtn" id="bMenu" title="Menu (Esc)">&#9776; Menu</button>
    </div>
  </div>

  <div class="hint" id="hint"></div>
  <nav class="tools" id="tools" aria-label="Tools"></nav>

  <div class="overlay" id="menu" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
      <h2 id="menuTitle">Menu</h2>
      <button type="button" class="mbtn primary" data-act="resume">Resume</button>
      <button type="button" class="mbtn" data-act="help">Controls</button>
      <div class="msec">Layouts</div>
      <div class="mgrid">
        <button type="button" class="mbtn" data-preset="original">Original<small>The boilerplate's 16 blocks</small></button>
        <button type="button" class="mbtn" data-preset="plaza">Plaza<small>Walled square, lamps, trees</small></button>
        <button type="button" class="mbtn" data-preset="grove">Grove<small>Forest with a clearing</small></button>
        <button type="button" class="mbtn" data-preset="skyline">Skyline<small>Downtown with lit streets</small></button>
      </div>
      <button type="button" class="mbtn" data-act="clear">Clear the board</button>
      <div class="msec">Options</div>
      <button type="button" class="mbtn" data-act="cycle">Day cycle: Off</button>
      <button type="button" class="mbtn" data-act="sound">Sound: On</button>
      <button type="button" class="mbtn" data-act="view">Reset view</button>
      <button type="button" class="mbtn" data-act="settings">Graphics and controls&hellip;</button>
    </div>
  </div>

  <div class="overlay" id="help" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <h2 id="helpTitle">Controls</h2>
      <div class="tabs" role="tablist">
        <button type="button" class="mbtn" role="tab" data-tab="keyboard">Keyboard and mouse</button>
        <button type="button" class="mbtn" role="tab" data-tab="gamepad">Controller</button>
        <button type="button" class="mbtn" role="tab" data-tab="touch">Touch</button>
      </div>
      <dl class="keys" id="helpList"></dl>
      <button type="button" class="mbtn primary" data-act="close">Back</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three/webgpu';
    import { uv, smoothstep, uniform, color } from 'three/tsl';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { boot } from 'kit/boot.js';
    import { createPoints } from 'kit/points.js';
    import { bakeInstances } from 'kit/instancing.js';
    import { MOUSE_LOOK, TOUCH_LOOK } from 'kit/input.js';

    // ------------------------------------------------------------------ constants
    const TILE_N = 10;                       // the boilerplate's 10 × 10 tile grid
    const TILE = 1.55;                       // tile pitch
    const TILE_MID = (TILE_N - 1) / 2;
    const BASE_Y = 0.08;                     // where the boilerplate's buildings stand
    const HEIGHTS = [0.8, 1.22, 1.64];       // its three building heights (0.8 + i * 0.42)
    const BLOCK_HEX = [0x3c527f, 0x5272a8];  // its two building blues
    const TREE_TINT = [0xffffff, 0xd9f2e6, 0xeaffd2, 0xd2e4ff];
    const TREE_SCALE = [1, 0.88, 1.1, 0.95];
    const HALF = { b: 0.6, t: 0.47, l: 0.24 }; // footprint half-sizes (block incl. its window strip)
    const KIND_NAME = { b: 'block', t: 'tree', l: 'lamp' };
    const CAP = 128;                         // per kind; the grid holds at most 100 + the 16 originals
    const PITCH_MIN = 0.38, PITCH_MAX = 1.2, ZOOM_MIN = 0.65, ZOOM_MAX = 2.25, RADIUS = 24;
    const DEF_YAW = Math.PI / 4, DEF_PITCH = 0.72;
    const PAN_LIMIT = 9;
    const SAVE_KEY = 'iso-lowpoly-boilerplate.v1';
    const UNDO_MAX = 80;

    const ICON = {
      view: '<svg viewBox="0 0 24 24"><path d="M12 3.5 20.5 8.4v7.2L12 20.5l-8.5-4.9V8.4z" fill="none" stroke="#9fb4d8" stroke-width="1.6" stroke-linejoin="round"/><path d="M3.5 8.4 12 13.3l8.5-4.9M12 13.3v7.2" fill="none" stroke="#9fb4d8" stroke-width="1.1" opacity=".55"/></svg>',
      low: isoBlockIcon(12),
      mid: isoBlockIcon(8),
      tall: isoBlockIcon(3),
      tree: '<svg viewBox="0 0 24 24"><path d="M11 17h2v5h-2z" fill="#8a6a55"/><path d="M12 7.5 19 18H5z" fill="#2f8f78"/><path d="M12 2.5 17.5 12h-11z" fill="#3aa58a"/></svg>',
      lamp: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5.5" fill="#ffc46b" opacity=".22"/><path d="M12 9.5V21M9 21.5h6" stroke="#8ea0c8" stroke-width="1.8" stroke-linecap="round"/><path d="M8.5 6.2 12 3.6l3.5 2.6z" fill="#8ea0c8"/><circle cx="12" cy="8.3" r="2.3" fill="#ffd38a"/></svg>',
      bulldoze: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="#ff7a6b" stroke-width="2.4" stroke-linecap="round"/></svg>',
    };
    function isoBlockIcon(top) {
      const t = top, b = 21.5;
      return `<svg viewBox="0 0 24 24"><path d="M12 ${t}l7 3.5-7 3.5-7-3.5z" fill="#7d9ad6"/><path d="M5 ${t + 3.5}l7 3.5V${b}l-7-3.5z" fill="#3c527f"/><path d="M19 ${t + 3.5}l-7 3.5V${b}l7-3.5z" fill="#5272a8"/><path d="M6.5 ${b - 5.2}l4 2" stroke="#72e7ff" stroke-width="1.4"/></svg>`;
    }

    const TOOLS = [
      { id: 'view', label: 'View', icon: ICON.view },
      { id: 'low', label: 'Low', icon: ICON.low, kind: 'b', h: 0 },
      { id: 'mid', label: 'Mid', icon: ICON.mid, kind: 'b', h: 1 },
      { id: 'tall', label: 'Tall', icon: ICON.tall, kind: 'b', h: 2 },
      { id: 'tree', label: 'Tree', icon: ICON.tree, kind: 't' },
      { id: 'lamp', label: 'Lamp', icon: ICON.lamp, kind: 'l' },
      { id: 'bulldoze', label: 'Clear', icon: ICON.bulldoze },
    ];

    // Time of day. Day is the boilerplate's own lighting, value for value.
    const TOD = [
      { name: 'Day', glyph: '☀', bg: 0x0b1020, sky: 0xc9ddff, ground: 0x241b16, hemi: 1.65, sun: 0xffefd6, sunI: 3.1, sunPos: [16, 25, 13], fill: 0x6db6ff, fillI: 1, win: 1.3, night: 0, fly: 1.6 },
      { name: 'Dusk', glyph: '◐', bg: 0x140e22, sky: 0xffb8a0, ground: 0x2a1820, hemi: 1.15, sun: 0xff9a5c, sunI: 2.3, sunPos: [24, 10, 4], fill: 0x8a6dff, fillI: 0.9, win: 2.1, night: 0.55, fly: 2.0 },
      { name: 'Night', glyph: '☾', bg: 0x04060d, sky: 0x4a62a8, ground: 0x0a0910, hemi: 0.6, sun: 0xa8c0ff, sunI: 0.85, sunPos: [-12, 22, 10], fill: 0x3a5cff, fillI: 0.55, win: 3.2, night: 1, fly: 2.6 },
    ];
    for (const k of TOD) {
      for (const f of ['bg', 'sky', 'ground', 'sun', 'fill']) k[f] = new THREE.Color(k[f]);
      k.sunPos = new THREE.Vector3(...k.sunPos);
    }

    const HELP = {
      keyboard: [
        ['Orbit', 'Drag with the left mouse button'],
        ['Pan', 'Right-drag, Shift-drag, or WASD / arrow keys'],
        ['Zoom', 'Mouse wheel or + / −'],
        ['Rotate 90°', 'Q / E'],
        ['Pick a tool', '1–7, or C to cycle'],
        ['Build or clear', 'Click a tile, or Space / Enter at the cursor'],
        ['Remove a piece (any tool but View)', 'X, Delete or Backspace'],
        ['Undo', 'Z'],
        ['Time of day', 'T'],
        ['Reset the view', 'F or Home'],
        ['Sound on / off', 'M'],
        ['Menu', 'Esc or P'],
        ['This help', 'H'],
      ],
      gamepad: [
        ['Pan (the cursor is the centre tile)', 'Left stick or D-pad'],
        ['Orbit', 'Right stick'],
        ['Zoom', 'LB / RB'],
        ['Rotate 90°', 'LT / RT'],
        ['Build or clear at the cursor', 'A'],
        ['Remove a piece (any tool but View)', 'B'],
        ['Next tool', 'X'],
        ['Time of day', 'Y'],
        ['Undo', 'L3 (press the left stick)'],
        ['Reset the view', 'R3 (press the right stick)'],
        ['This help', 'View / Back'],
        ['Menu', 'Start'],
      ],
      touch: [
        ['Orbit', 'Drag with one finger'],
        ['Pan', 'Tap the Orbit pill to switch to Pan, then drag'],
        ['Zoom', 'Pinch'],
        ['Build or clear', 'Pick a tool at the bottom, then tap a tile'],
        ['Undo, time of day', 'The buttons at the top left'],
        ['Reset the view', 'Center pill'],
        ['Menu', 'II pill'],
      ],
    };

    // Standard bindings (lib/kit/README.md §4). This is a pointer-driven diorama: on touch,
    // drag orbits, pinch zooms, taps build, so it needs no stick.
    const INPUT = {
      move: { type: 'vector', keys: 'wasd+arrows', gamepad: 'leftStick+dpad' },
      look: { type: 'look', mouse: 'drag', gamepad: 'rightStick', touch: 'drag' },
      panMod: { keys: ['ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight'], mouse: [1, 2] },
      place: { keys: ['Space', 'Enter', 'NumpadEnter'], gamepad: ['A'] },
      remove: { keys: ['KeyX', 'Delete', 'Backspace'], gamepad: ['B'] },
      tool: { keys: ['KeyC'], gamepad: ['X'] },
      time: { keys: ['KeyT'], gamepad: ['Y'] },
      rotL: { keys: ['KeyQ'], gamepad: ['LT'] },
      rotR: { keys: ['KeyE'], gamepad: ['RT'] },
      zoomIn: { keys: ['Equal', 'NumpadAdd'], gamepad: ['RB'] },
      zoomOut: { keys: ['Minus', 'NumpadSubtract'], gamepad: ['LB'] },
      undo: { keys: ['KeyZ'], gamepad: ['LS'] },
      center: { keys: ['KeyF', 'Home'], gamepad: ['RS'], touch: { label: 'Center', slot: 'top' } },
      dragMode: { touch: { label: 'Orbit', slot: 'top' } },
      help: { keys: ['KeyH', 'F1'], gamepad: ['Back'] },
      mute: { keys: ['KeyM'] },
      pause: { keys: ['Escape', 'KeyP'], gamepad: ['Start'], touch: { label: 'II', slot: 'top' } },
    };
    for (let i = 1; i <= TOOLS.length; i++) INPUT[`tool${i}`] = { keys: [`Digit${i}`, `Numpad${i}`] };

    // ------------------------------------------------------------------ small helpers
    function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
    function lerp(a, b, u) { return a + (b - a) * u; }
    function tileX(i) { return (i - TILE_MID) * TILE; }
    function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
    function easeOutBack(u) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (u - 1) ** 3 + c1 * (u - 1) ** 2; }
    function clampInt(v, lo, hi) { const n = Math.round(+v); return Number.isFinite(n) ? clamp(n, lo, hi) : lo; }

    // ------------------------------------------------------------------ layouts (content)
    function presetOriginal() {
      // Exactly the boilerplate's scene: 16 blocks on a 2.5 m grid, heights and colours alternating.
      const out = [];
      for (let r = 0; r < 16; r++) out.push({ k: 'b', x: (r % 4 - 1.5) * 2.5, z: (Math.floor(r / 4) - 1.5) * 2.5, h: r % 3, c: r % 2, v: 0 });
      return out;
    }
    function gridBuilder() {
      const out = [];
      return {
        out,
        B: (i, j, h) => out.push({ k: 'b', x: tileX(i), z: tileX(j), h, c: (i + j) % 2, v: 0 }),
        T: (i, j) => out.push({ k: 't', x: tileX(i), z: tileX(j), h: 0, c: 0, v: Math.floor(hash(i * 13 + j * 7) * 4) }),
        L: (i, j) => out.push({ k: 'l', x: tileX(i), z: tileX(j), h: 0, c: 0, v: 0 }),
      };
    }
    function presetPlaza() {
      const { out, B, T, L } = gridBuilder();
      for (const [i, j] of [[0, 0], [9, 0], [0, 9], [9, 9]]) B(i, j, 2);
      for (const i of [2, 3, 6, 7]) { B(i, 0, 1); B(i, 9, 1); B(0, i, 1); B(9, i, 1); }
      for (const i of [1, 8]) { B(i, 0, 0); B(i, 9, 0); B(0, i, 0); B(9, i, 0); }
      for (const [i, j] of [[2, 2], [7, 2], [2, 7], [7, 7], [4, 2], [5, 7], [2, 5], [7, 4]]) T(i, j);
      for (const [i, j] of [[3, 3], [6, 3], [3, 6], [6, 6], [4, 0], [5, 9], [0, 5], [9, 4]]) L(i, j);
      return out;
    }
    function presetGrove() {
      const { out, B, T, L } = gridBuilder();
      for (let j = 0; j < TILE_N; j++) {
        for (let i = 0; i < TILE_N; i++) {
          if (Math.hypot(i - TILE_MID, j - TILE_MID) < 2.2) continue; // the clearing
          if (hash(i * 31 + j * 17) < 0.64) T(i, j);
        }
      }
      B(4, 4, 0); B(5, 5, 0); L(4, 5); L(5, 4);
      return out;
    }
    function presetSkyline() {
      const { out, B, T, L } = gridBuilder();
      for (let j = 0; j < TILE_N; j++) {
        for (let i = 0; i < TILE_N; i++) {
          const street = i === 3 || i === 6 || j === 3 || j === 6;
          if (street) {
            if ((i === 3 || i === 6) && (j === 3 || j === 6)) continue; // crossings stay open
            if ((i + j) % 3 === 0) L(i, j);
            continue;
          }
          const ring = Math.max(Math.abs(i - TILE_MID), Math.abs(j - TILE_MID));
          if (hash(i * 7 + j * 29) < 0.12) { T(i, j); continue; }
          B(i, j, ring < 1.5 ? 2 : ring < 3.5 ? 1 : (hash(i + j * 11) < 0.5 ? 0 : 1));
        }
      }
      return out;
    }
    const PRESETS = { original: presetOriginal, plaza: presetPlaza, grove: presetGrove, skyline: presetSkyline };

    // ------------------------------------------------------------------ boot
    const kit = await boot({
      title: 'Isometric Low-Poly Boilerplate',
      touch: { top: 'right', topOffset: 58 }, // pills under the gear, clear of the HUD on the left
      input: INPUT,
    });
    const { input } = kit;
    const renderer = kit.renderer;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap; // was PCFSoftShadowMap: PCF with a radius

      let ctx = null;

      const VOL = 0.45;
      function unlock() {
        if (ctx) {

        const AC = window.AudioContext || window.webkitAudioContext;

        o.frequency.setValueAtTime(f0, t);

        o.connect(g).connect(master);
        o.start(t);
        o.stop(t + dur + 0.03);

        if (!ready()) return;

          const d = noiseBuf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        const t = ctx.currentTime + delay;
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        const f = ctx.createBiquadFilter();
        f.type = 'bandpass';
        f.Q.value = 0.8;
        f.frequency.setValueAtTime(f0, t);
        f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
        const g = ctx.createGain();
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f).connect(g).connect(master);
        s.start(t);
        s.stop(t + dur + 0.03);

        unlock,
        get muted() { return muted; },
        setMuted(m) {
          muted = !!m;

    function removePiece(p, animate = true) {

    function stepPieces(dt) {

      }
      for (const k of ['b', 't', 'l']) {
        if (!dirty[k]) continue;
        dirty[k] = false;
        syncKind(k);
        hoverDirty = true;
      }
    }

    // ------------------------------------------------------------------ bursts
    function burst(x, y, z, hex, n, spread, up) {
      const c = new THREE.Color(hex);
      const pos = puffs.positions.array;
      for (let j = 0; j < n; j++) {
        const i = puffNext;
        puffNext = (puffNext + 1) % PUFF_N;
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * spread;
        pos[i * 3] = x + Math.cos(a) * r * 0.4;
        pos[i * 3 + 1] = y + Math.random() * 0.3;
        pos[i * 3 + 2] = z + Math.sin(a) * r * 0.4;
        puffVel[i * 3] = Math.cos(a) * r * 2.2;
        puffVel[i * 3 + 1] = up * (0.5 + Math.random());
        puffVel[i * 3 + 2] = Math.sin(a) * r * 2.2;
        const tint = 0.7 + Math.random() * 0.3;
        puffBase[i * 3] = c.r * tint;
        puffBase[i * 3 + 1] = c.g * tint;
        puffBase[i * 3 + 2] = c.b * tint;
        puffMax[i] = puffLife[i] = 0.45 + Math.random() * 0.35;
      }
      puffLive = Math.max(puffLive, 1);
    }
    function stepPuffs(dt) {
      if (!puffLive) return;
      const pos = puffs.positions.array;
      const col = puffs.colors.array;
      let alive = 0;
      for (let i = 0; i < PUFF_N; i++) {
        if (puffLife[i] <= 0) continue;
        puffLife[i] -= dt;
        const k = Math.max(0, puffLife[i] / puffMax[i]);
        if (k > 0) alive++;
        puffVel[i * 3 + 1] -= 3.2 * dt;
        pos[i * 3] += puffVel[i * 3] * dt;
        pos[i * 3 + 1] = Math.max(0.07, pos[i * 3 + 1] + puffVel[i * 3 + 1] * dt);
        pos[i * 3 + 2] += puffVel[i * 3 + 2] * dt;
        col[i * 3] = puffBase[i * 3] * k;
        col[i * 3 + 1] = puffBase[i * 3 + 1] * k;
        col[i * 3 + 2] = puffBase[i * 3 + 2] * k;
      }
      puffs.positions.needsUpdate = true;
      puffs.colors.needsUpdate = true;
      puffLive = alive;
    }

    // ------------------------------------------------------------------ actions
    function setTool(i) {
      const n = TOOLS.length;
      toolIndex = ((i % n) + n) % n;
      toolButtons.forEach((b, j) => b.setAttribute('aria-pressed', j === toolIndex ? 'true' : 'false'));
      sfx.tick();
      hoverDirty = true;
      markSave();
    }
    function flashHint(text) {
      setText(el.hint, text);
      el.hint.classList.add('flash');
      hintFlashUntil = performance.now() + 1800;
    }
    function deny(msg) {
      sfx.deny();
      input.rumble(0.12, 40);
      const now = performance.now();
      if (msg && now - denyToastAt > 1200) {
        denyToastAt = now;
        flashHint(msg);
      }
    }
    function pushUndo(op) {
      undoStack.push(op);
      if (undoStack.length > UNDO_MAX) undoStack.shift();
      el.undo.disabled = false;
    }
    function undo() {
      const op = undoStack.pop();
      el.undo.disabled = undoStack.length === 0;
      if (!op) { deny('Nothing to undo'); return; }
      if (op.t === 'add') {
        const p = findPiece(op.data);
        if (p) { removePiece(p); burst(p.x, 0.3, p.z, 0x9fb4d8, 10, 0.5, 1.2); }
      } else if (op.t === 'del') {
        if (!overlaps(op.data.k, op.data.x, op.data.z)) addPiece(op.data);
      } else if (op.t === 'layout') {
        setLayout(op.before);
      }
      sfx.undo();
      markSave();
    }
    function act(kind) {
      const tool = TOOLS[toolIndex];
      if (kind === 'place' && tool.id === 'bulldoze') kind = 'remove';
      if (tool.id === 'view') {
        // The View tool is the boilerplate's plain viewer: nothing gets built or knocked down by accident.
        deny(input.source === 'gamepad' ? 'Press X to pick a tool first' : 'Pick a tool first (2–7)');
        return;
      }
      if (kind === 'place') {
        if (!tool.kind) return;
        if (!hover.valid) return;
        if (hover.piece || !hover.tile) { deny('That spot is taken'); return; }
        if (!canPlace(tool.kind, hover.x, hover.z)) { deny(liveCount(tool.kind) >= CAP ? `No room for more ${KIND_NAME[tool.kind]}s` : 'That spot is taken'); return; }
        const p = addPiece({ k: tool.kind, x: hover.x, z: hover.z, h: tool.h ?? 0, c: (hover.ix + hover.iz) % 2, v: variantFor(hover.ix, hover.iz) });
        if (!p) return;
        pushUndo({ t: 'add', data: snapshot(p) });
        sfx.place(p.k, p.h);
        burst(p.x, 0.12, p.z, p.k === 'l' ? 0xffd38a : p.k === 't' ? 0x8fffc0 : 0x8fe9ff, 16, 0.7, 1.6);
        input.rumble(0.22, 55);
      } else {
        const p = hover.piece || (hover.valid && hover.tile ? nearestPiece(hover.px, hover.pz, 0.35) : null);
        if (!p) { deny('Nothing to clear here'); return; }
        pushUndo({ t: 'del', data: snapshot(p) });
        removePiece(p);
        sfx.remove();
        const top = p.k === 'b' ? HEIGHTS[p.h] * 0.5 : 0.5;
        burst(p.x, top, p.z, 0xffa070, 24, 0.8, 2.2);
        input.rumble(0.4, 90);
      }
      hoverDirty = true;
      markSave();
    }
    function loadPreset(name) {
      const make = PRESETS[name];
      if (!make) return;
      pushUndo({ t: 'layout', before: pieces.filter(live).map(snapshot) });
      setLayout(make());
      sfx.chime(0);
      input.rumble(0.3, 120);
      markSave();
    }
    function clearBoard() {
      if (!pieces.some(live)) return;
      pushUndo({ t: 'layout', before: pieces.filter(live).map(snapshot) });
      for (const p of pieces) if (live(p)) burst(p.x, 0.2, p.z, 0xffa070, 3, 0.5, 1.6);
      for (let i = pieces.length - 1; i >= 0; i--) removePiece(pieces[i]);
      sfx.remove();
      markSave();
    }
    function nextTime() {
      const from = todGoal ?? Math.floor(todPos + 1e-6);
      todGoal = Math.min(from + 1, Math.floor(todPos) + 3);
      sfx.chime(((todGoal % 3) + 3) % 3);
      markSave();
    }
    function resetView() {
      camGoal.target.set(0, 0.5, 0);
      camGoal.zoom = 1;
      camGoal.pitch = DEF_PITCH;
      camGoal.yaw = DEF_YAW + Math.round((camGoal.yaw - DEF_YAW) / (Math.PI * 2)) * Math.PI * 2;
    }
    function snapYaw(y) {
      const q = Math.PI / 2;
      return DEF_YAW + Math.round((y - DEF_YAW) / q) * q;
    }
    function toggleMute() {
      sfx.setMuted(!sfx.muted);
      refreshMenu();
      kit.toast(sfx.muted ? 'Sound off' : 'Sound on');
      markSave();
    }
    function setTouchPan(on) {
      touchPan = on;
      kit.touch?.setLabel('dragMode', on ? 'Pan' : 'Orbit');
      flashHint(on ? 'Drag now pans the view' : 'Drag now orbits the view');
    }

    // ------------------------------------------------------------------ menu and help
    function overlayButtons(node) {
      return [...node.querySelectorAll('button')].filter((b) => !b.hidden && !b.disabled && b.offsetParent !== null);
    }
    function focusFirst(node) {
      const first = node === el.help ? node.querySelector(`[data-tab="${helpTab}"]`) : overlayButtons(node)[0];
      first?.focus({ preventScroll: false });
    }
    function showOverlay(name) {
      const was = openName;
      openName = name;
      for (const [k, node] of Object.entries(OVERLAYS)) node.hidden = k !== name;
      if (name && !was) {
        kit.touch?.suspend(true, 'overlay');
        input.unlockPointer();
        press.active = false;
      }
      if (!name && was) {
        kit.touch?.suspend(false, 'overlay');
        input.settle();
        if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur?.();
      }
      if (name) focusFirst(OVERLAYS[name]);
      navHeld = 0;
      navWait = 0;
      hoverDirty = true;
    }
    function openMenu() {
      refreshMenu();
      showOverlay('menu');
    }
    function refreshMenu() {
      const q = (a) => el.menu.querySelector(`[data-act="${a}"]`);
      setText(q('cycle'), `Day cycle: ${cycle ? 'On' : 'Off'}`);
      setText(q('sound'), `Sound: ${sfx.muted ? 'Off' : 'On'}`);
    }
    function sourceTab() {
      return input.source === 'gamepad' ? 'gamepad' : input.source === 'touch' ? 'touch' : 'keyboard';
    }
    function selectHelpTab(tab) {
      helpTab = HELP[tab] ? tab : 'keyboard';
      for (const b of el.help.querySelectorAll('[data-tab]')) b.setAttribute('aria-selected', b.dataset.tab === helpTab ? 'true' : 'false');
      el.helpList.replaceChildren();
      for (const [what, how] of HELP[helpTab]) {
        const dt = document.createElement('dt');
        dt.textContent = what;
        const dd = document.createElement('dd');
        dd.textContent = how;
        el.helpList.append(dt, dd);
      }
    }
    function openHelp(fromMenu) {
      helpFromMenu = fromMenu;
      selectHelpTab(sourceTab());
      showOverlay('help');
    }
    function back() {
      if (openName === 'help' && helpFromMenu) openMenu();
      else showOverlay(null);
    }
    el.menu.addEventListener('click', (e) => {
      if (e.target === el.menu) { showOverlay(null); return; }
      const b = e.target.closest('button');
      if (!b) return;
      sfx.tick();
      if (b.dataset.preset) { loadPreset(b.dataset.preset); showOverlay(null); return; }
      switch (b.dataset.act) {
        case 'resume': showOverlay(null); break;
        case 'help': openHelp(true); break;
        case 'clear': clearBoard(); showOverlay(null); break;
        case 'cycle': cycle = !cycle; refreshMenu(); markSave(); break;
        case 'sound': toggleMute(); break;
        case 'view': resetView(); showOverlay(null); break;
        case 'settings': kit.menu.open(); break;
      }
    });
    el.help.addEventListener('click', (e) => {
      if (e.target === el.help) { back(); return; }
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.tab) { selectHelpTab(b.dataset.tab); sfx.tick(); return; }
      if (b.dataset.act === 'close') back();
    });
    el.undo.addEventListener('click', () => undo());
    el.time.addEventListener('click', () => nextTime());
    el.menuBtn.addEventListener('click', () => openMenu());

    /** Menus work with a gamepad and the keyboard: stick / D-pad / arrows move, A confirms, B or Start goes back. */
    function overlayInput(dt) {
      const node = OVERLAYS[openName];
      if (input.pressed('pause') || input.pressed('remove') || (openName === 'help' && input.pressed('help'))) {
        back();
        return;
      }
      if (input.pressed('place')) {
        const f = document.activeElement;
        if (f && node.contains(f) && f.tagName === 'BUTTON') f.click();
        else focusFirst(node);
        return;
      }
      const v = input.vector('move');
      const dir = Math.abs(v.y) > 0.5 ? (v.y > 0 ? -1 : 1) : Math.abs(v.x) > 0.5 ? (v.x > 0 ? 1 : -1) : 0;
      if (!dir) { navHeld = 0; navWait = 0; return; }
      if (navHeld !== dir) { navHeld = dir; navWait = 0.38; moveFocus(node, dir); return; }
      navWait -= dt;
      if (navWait <= 0) { navWait = 0.12; moveFocus(node, dir); }
    }
    function moveFocus(node, dir) {
      const list = overlayButtons(node);
      if (!list.length) return;
      const i = list.indexOf(document.activeElement);
      const next = i < 0 ? list[0] : list[(i + dir + list.length) % list.length];
      next.focus();
      sfx.tick();
    }

    // ------------------------------------------------------------------ camera
    function stepCamera(dt) {
      const k = 1 - Math.exp(-14 * dt);
      camNow.yaw += (camGoal.yaw - camNow.yaw) * k;
      camNow.pitch += (camGoal.pitch - camNow.pitch) * k;
      camNow.zoom *= Math.pow(camGoal.zoom / camNow.zoom, k);
      camNow.target.lerp(camGoal.target, k);
      // Land exactly on the goal, so a resting camera stops re-picking the hover every frame.
      if (Math.abs(camGoal.yaw - camNow.yaw) < 1e-5) camNow.yaw = camGoal.yaw;
      if (Math.abs(camGoal.pitch - camNow.pitch) < 1e-5) camNow.pitch = camGoal.pitch;
      if (Math.abs(camGoal.zoom - camNow.zoom) < 1e-5) camNow.zoom = camGoal.zoom;
      if (camNow.target.distanceToSquared(camGoal.target) < 1e-10) camNow.target.copy(camGoal.target);
      if (camNow.zoom !== frustumZoom) updateFrustum();
      const r = Math.cos(camNow.pitch) * RADIUS;
      camera.position.set(
        camNow.target.x + Math.sin(camNow.yaw) * r,
        camNow.target.y + Math.sin(camNow.pitch) * RADIUS,
        camNow.target.z + Math.cos(camNow.yaw) * r
      );
      camera.lookAt(camNow.target);
      camera.updateMatrixWorld();
      const moved = camNow.yaw !== lastCam.yaw || camNow.pitch !== lastCam.pitch || camNow.zoom !== lastCam.zoom ||
        camNow.target.x !== lastCam.x || camNow.target.z !== lastCam.z || projVersion !== lastCam.proj;
      if (moved) {
        lastCam.yaw = camNow.yaw; lastCam.pitch = camNow.pitch; lastCam.zoom = camNow.zoom;
        lastCam.x = camNow.target.x; lastCam.z = camNow.target.z; lastCam.proj = projVersion;
        hoverDirty = true;
      }
    }
    function cameraAxes() {
      const y = camNow.yaw;
      _right.set(Math.cos(y), 0, -Math.sin(y));
      _fwd.set(-Math.sin(y), 0, -Math.cos(y));
    }
    function clampTarget() {
      camGoal.target.x = clamp(camGoal.target.x, -PAN_LIMIT, PAN_LIMIT);
      camGoal.target.z = clamp(camGoal.target.z, -PAN_LIMIT, PAN_LIMIT);
    }

    // ------------------------------------------------------------------ play input
    function playInput(dt, now) {
      if (input.pressed('pause')) { openMenu(); return; }
      if (input.pressed('help')) { openHelp(false); return; }
      if (input.pressed('mute')) toggleMute();
      if (input.pressed('dragMode')) setTouchPan(!touchPan);
      for (let i = 0; i < TOOLS.length; i++) if (input.pressed(`tool${i + 1}`)) setTool(i);
      if (input.pressed('tool')) setTool(toolIndex + 1);
      if (input.pressed('time')) nextTime();
      if (input.pressed('undo')) undo();
      if (input.pressed('center')) resetView();
      if (input.pressed('rotL')) { camGoal.yaw = snapYaw(camGoal.yaw) + Math.PI / 2; sfx.tick(); }
      if (input.pressed('rotR')) { camGoal.yaw = snapYaw(camGoal.yaw) - Math.PI / 2; sfx.tick(); }

      cameraAxes();
      const src = input.source;

      // Click or tap (no drag) builds or clears on the tile under the pointer.
      const p = input.pointer;
      let zoomIn = input.zoom();
      if (p.justDown) {
        press.active = true;
        press.x = p.x; press.y = p.y; press.t = now; press.moved = 0;
        press.cancel = input.down('panMod');
      }
      let tapped = false;
      if (press.active) {
        press.moved = Math.max(press.moved, Math.hypot(p.x - press.x, p.y - press.y));
        if (zoomIn) press.cancel = true; // a pinch is not a tap
        if (p.justUp) {
          press.active = false;
          tapped = !press.cancel && press.moved < 9 && now - press.t < 0.65;
        }
      }

      // Drag: orbit (as the boilerplate did), or pan with right-drag / Shift / the touch Pan mode.
      // A press that has not moved a few pixels yet is still a click, so it does not nudge the view.
      const lk = input.look('look');
      const holdDrag = src !== 'gamepad' && press.active && press.moved < 4;
      if ((lk.x || lk.y) && !holdDrag) {
        const dragPan = src !== 'gamepad' && (input.down('panMod') || (src === 'touch' && touchPan));
        if (dragPan) {
          const s = kit.settings.get();
          const per = (src === 'touch' ? TOUCH_LOOK : MOUSE_LOOK) * (s.lookSensitivity || 1);
          const px = lk.x / per;
          const py = lk.y / (per * (s.invertY ? -1 : 1));
          const wpp = (2 * viewHalfH) / Math.max(1, kit.size.height); // world units per CSS pixel
          camGoal.target.addScaledVector(_right, -px * wpp);
          camGoal.target.addScaledVector(_fwd, (py * wpp) / Math.max(0.3, Math.sin(camNow.pitch)));
          clampTarget();
        } else {
          const ky = src === 'gamepad' ? 0.8 : src === 'touch' ? 1.1 : 2.5;
          const kp = src === 'gamepad' ? 0.5 : src === 'touch' ? 0.73 : 1.667;
          camGoal.yaw -= lk.x * ky;
          camGoal.pitch = clamp(camGoal.pitch + lk.y * kp, PITCH_MIN, PITCH_MAX);
        }
      }
      const mv = input.vector('move');
      if (mv.x || mv.y) {
        const sp = (9 / camNow.zoom) * dt;
        camGoal.target.addScaledVector(_right, mv.x * sp);
        camGoal.target.addScaledVector(_fwd, mv.y * sp);
        clampTarget();
      }
      if (input.down('zoomIn')) zoomIn += 3 * dt;
      if (input.down('zoomOut')) zoomIn -= 3 * dt;
      if (zoomIn) camGoal.zoom = clamp(camGoal.zoom * Math.pow(1.1, zoomIn), ZOOM_MIN, ZOOM_MAX);

      if (tapped && TOOLS[toolIndex].id !== 'view') {
        pickAt(p.nx, p.ny);
        act('place');
      }
      if (input.pressed('place') || input.pressed('remove')) {
        if (hoverMode() !== 'pointer') pickAt(0, 0);
        act(input.pressed('place') ? 'place' : 'remove');
      }
    }

    // ------------------------------------------------------------------ hover and cursor
    function hoverMode() {
      const src = input.source;
      if (src === 'gamepad') return 'center';
      if (src === 'keyboard' && input.pointer.over) return 'pointer';
      return 'none';
    }
    function pickAt(nx, ny) {
      hover.valid = false;
      hover.tile = false;
      hover.piece = null;
      ndc.set(nx, ny);
      ray.setFromCamera(ndc, camera);
      hits.length = 0;
      ray.intersectObjects(PICKABLE, false, hits);
      for (const h of hits) {
        const k = h.object === blocks ? 'b' : h.object === trees ? 't' : 'l';
        const piece = byKind[k][h.instanceId];
        if (piece && live(piece)) { hover.piece = piece; break; }
      }
      if (!ray.ray.intersectPlane(groundPlane, groundHit)) return;
      hover.valid = true;
      hover.px = groundHit.x;
      hover.pz = groundHit.z;
      const ix = Math.round(groundHit.x / TILE + TILE_MID);
      const iz = Math.round(groundHit.z / TILE + TILE_MID);
      if (ix >= 0 && ix < TILE_N && iz >= 0 && iz < TILE_N) {
        hover.tile = true;
        hover.ix = ix;
        hover.iz = iz;
        hover.x = tileX(ix);
        hover.z = tileX(iz);
      }
    }
    function updateHover() {
      const mode = openName ? 'none' : hoverMode();
      const p = input.pointer;
      hoverDirty ||= mode !== lastPtr.mode || (mode === 'pointer' && (p.x !== lastPtr.x || p.y !== lastPtr.y));
      lastPtr.mode = mode;
      lastPtr.x = p.x;
      lastPtr.y = p.y;
      if (mode === 'none') {
        // Touch has no hover: a tap picks, acts and leaves no cursor behind.
        hover.valid = false;
        hover.piece = null;
        hover.tile = false;
      } else if (hoverDirty) {
        if (mode === 'pointer') pickAt(p.nx, p.ny);
        else pickAt(0, 0);
      }
      hoverDirty = false;
    }
    function updateCursor(t) {
      const tool = TOOLS[toolIndex];
      for (const g of GHOST_LIST) g.visible = false;
      cursor.visible = false;
      highlight.visible = false;
      if (!hover.valid || tool.id === 'view') return;
      const pulse = 0.5 + 0.5 * Math.sin(t * 5);
      if (tool.id === 'bulldoze') {
        const target = hover.piece || (hover.tile ? nearestPiece(hover.px, hover.pz, 0.35) : null);
        if (target) {
          const w = HALF[target.k] * 2 + 0.12;
          const hgt = target.k === 'b' ? HEIGHTS[target.h] + 0.12 : target.k === 't' ? 1.45 * TREE_SCALE[target.v] : 1.4;
          highlight.position.set(target.x, BASE_Y - 0.04, target.z);
          highlight.scale.set(w, hgt, w);
          highlightMat.opacity = 0.22 + 0.14 * pulse;
          highlight.visible = true;
        } else if (hover.tile) {
          cursor.position.set(hover.x, 0.075, hover.z);
          cursorMat.color.setHex(0x9fb4d8);
          cursorMat.opacity = 0.45;
          cursor.visible = true;
        }
        return;
      }
      if (hover.piece) {
        cursor.position.set(hover.piece.x, 0.075, hover.piece.z);
        cursorMat.color.setHex(0xff6b5c);
        cursorMat.opacity = 0.6 + 0.3 * pulse;
        cursor.visible = true;
        return;
      }
      if (!hover.tile) return;
      const ok = canPlace(tool.kind, hover.x, hover.z);
      cursor.position.set(hover.x, 0.075, hover.z);
      cursorMat.color.setHex(ok ? 0x8fe9ff : 0xff6b5c);
      cursorMat.opacity = 0.65 + 0.3 * pulse;
      cursor.visible = true;
      const g = ghosts[tool.kind];
      g.position.set(hover.x, BASE_Y, hover.z);
      g.scale.set(1, tool.kind === 'b' ? HEIGHTS[tool.h] : 1, 1);
      ghostMat.color.setHex(ok ? 0x7dffc0 : 0xff6b5c);
      ghostMat.opacity = 0.3 + 0.12 * pulse;
      g.visible = true;
    }

    // ------------------------------------------------------------------ time of day
    function applyTod(pos) {
      const n = TOD.length;
      const base = Math.floor(pos);
      const f = pos - base;
      const a = TOD[((base % n) + n) % n];
      const b = TOD[(((base + 1) % n) + n) % n];
      const u = f * f * (3 - 2 * f);
      scene.background.lerpColors(a.bg, b.bg, u);
      scene.fog.color.copy(scene.background);
      hemi.color.lerpColors(a.sky, b.sky, u);
      hemi.groundColor.lerpColors(a.ground, b.ground, u);
      hemi.intensity = lerp(a.hemi, b.hemi, u);
      sun.color.lerpColors(a.sun, b.sun, u);
      sun.intensity = lerp(a.sunI, b.sunI, u);
      sun.position.lerpVectors(a.sunPos, b.sunPos, u);
      fill.color.lerpColors(a.fill, b.fill, u);
      fill.intensity = lerp(a.fillI, b.fillI, u);
      windowMat.emissiveIntensity = lerp(a.win, b.win, u);
      const night = lerp(a.night, b.night, u);
      uNight.value = night;
      bulbMat.emissiveIntensity = 0.35 + 2.8 * night;
      flySize = lerp(a.fly, b.fly, u);
    }
    function stepTod(dt, running) {
      if (running && cycle) todPos += dt / 40;
      if (todGoal !== null) {
        const d = todGoal - todPos;
        const step = dt * 0.9;
        if (Math.abs(d) <= step) { todPos = todGoal; todGoal = null; }
        else todPos += Math.sign(d) * step;
      }
      if (todGoal === null && todPos >= 3) todPos -= 3;
      if (todPos !== todApplied) {
        applyTod(todPos);
        todApplied = todPos;
      }
      const phase = ((Math.round(todGoal ?? todPos) % 3) + 3) % 3;
      const key = phase + (cycle ? 3 : 0);
      if (key !== timeKey) {
        timeKey = key;
        setText(el.time, `${TOD[phase].glyph} ${TOD[phase].name}${cycle ? ' ↻' : ''}`);
      }
    }

    // ------------------------------------------------------------------ sparkles
    function stepFlies(t) {
      const a = flies.positions.array;
      for (let i = 0; i < flyCount; i++) {
        const u = (flySeed[i] + t * 0.035) % 1;
        const ang = u * Math.PI * 2 + i * 0.021;
        const r = 4.2 + Math.sin(i * 1.7) * 2.8;
        a[i * 3] = Math.cos(ang) * r;
        a[i * 3 + 1] = 0.35 + Math.sin(u * Math.PI) * 2.3;
        a[i * 3 + 2] = Math.sin(ang) * r;
      }
      flies.positions.needsUpdate = true;
      flies.material.size = flySize * Math.sqrt(camNow.zoom);
    }

    // ------------------------------------------------------------------ HUD
    const HINTS = {
      keyboard: {
        view: 'Drag to orbit · Right-drag or WASD to pan · Wheel to zoom · Q/E rotate · 2–6 to build · H help',
        build: 'Click a tile to build · X removes · Z undo · T time of day · Esc menu',
        bulldoze: 'Click a piece to clear it · Z undo · 1 back to View',
      },
      gamepad: {
        view: 'Left stick pan · Right stick orbit · LB/RB zoom · LT/RT rotate · X pick a tool',
        build: 'A build at the cursor · B remove · X next tool · Y time of day · L3 undo',
        bulldoze: 'A clear the piece at the cursor · X next tool · L3 undo',
      },
      touch: {
        view: 'Drag to orbit · Pinch to zoom · Pick a tool below to build',
        build: 'Tap a tile to build · Orbit pill switches drag to Pan',
        bulldoze: 'Tap a piece to clear it · Undo at the top left',
      },
    };
    const SOURCES = ['keyboard', 'gamepad', 'touch'];
    function updateHud() {
      if (statsDirty) {
        statsDirty = false;
        setText(el.stats, `${liveCount('b')} blocks · ${liveCount('t')} trees · ${liveCount('l')} lamps`);
      }
      if (hintFlashUntil && performance.now() > hintFlashUntil) {
        hintFlashUntil = 0;
        hintKey = -1;
        el.hint.classList.remove('flash');
      }
      if (hintFlashUntil) return;
      const tab = sourceTab();
      const key = toolIndex * 4 + SOURCES.indexOf(tab);
      if (key === hintKey) return;
      hintKey = key;
      const tool = TOOLS[toolIndex];
      const group = HINTS[tab];
      setText(el.hint, tool.id === 'view' ? group.view : tool.id === 'bulldoze' ? group.bulldoze : group.build);
    }
    function onSource(src) {
      const root = document.documentElement;
      root.classList.toggle('src-keyboard', src === 'keyboard');
      root.classList.toggle('src-gamepad', src === 'gamepad');
      root.classList.toggle('src-touch', src === 'touch');
      hoverDirty = true;
    }
    input.onSourceChange(onSource);
    onSource(input.source);

    // ------------------------------------------------------------------ save and continue
    function markSave() { saveDue = performance.now() + 450; }
    function saveNow() {
      saveDue = 0;
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          v: 1,
          pieces: pieces.filter(live).map(snapshot),
          tod: ((Math.round(todGoal ?? todPos) % 3) + 3) % 3,
          cycle,
          muted: sfx.muted,
          tool: toolIndex,
        }));
      } catch {
        /* private mode or full storage: the diorama still works */
      }
    }
    function loadSave() {
      try {
        const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
        if (!raw || raw.v !== 1 || !Array.isArray(raw.pieces)) return null;
        return raw;
      } catch {
        return null;
      }
    }

    // ------------------------------------------------------------------ start
    const saved = loadSave();
    setLayout(saved ? saved.pieces.slice(0, CAP * 3) : presetOriginal(), !saved);
    if (saved) {
      todPos = clampInt(saved.tod, 0, 2);
      cycle = saved.cycle === true;
      sfx.setMuted(saved.muted === true);
      toolIndex = clampInt(saved.tool, 0, TOOLS.length - 1);
    }
    toolButtons.forEach((b, j) => b.setAttribute('aria-pressed', j === toolIndex ? 'true' : 'false'));
    stepPieces(0);
    stepCamera(1);
    stepTod(0, false);
    stepFlies(0);
    refreshMenu();
    updateHud();

    // Pre-warm every pipeline the diorama can show (previews, cursor, lamps, bursts) so the
    // first click does not stutter on a shader compile.
    {
      const shown = [...GHOST_LIST, cursor, highlight];
      const counts = BATCHES.map((m) => m.count);
      for (const m of shown) m.visible = true;
      for (const m of BATCHES) if (m.count === 0) m.count = 1;
      try {
        await renderer.compileAsync(scene, camera);
      } catch (err) {
        console.warn('[iso] pre-warm skipped:', err);
      }
      for (const m of shown) m.visible = false;
      BATCHES.forEach((m, i) => (m.count = counts[i]));
    }

    kit.start((dt, t) => {
      if (openName) overlayInput(dt);
      else playInput(dt, t);
      const running = !openName;
      if (running) simT += dt;
      stepPieces(dt);
      stepCamera(dt);
      updateHover();
      updateCursor(simT);
      stepTod(dt, running);
      if (running) stepFlies(simT);
      stepPuffs(dt);
      updateHud();
      if (saveDue && performance.now() > saveDue) saveNow();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
