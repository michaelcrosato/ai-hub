async function init(){try{if(!inHub&&matchMedia('(pointer: coarse)').matches&&!matchMedia('(pointer: fine)').matches){$('loading').style.display='none';touchHTML();return}if(!navigator.gpu)throw new Error('WebGPU is required. Use a WebGPU-capable browser and GPU.');await RAPIER.init();renderer=new THREE.WebGPURenderer({antialias:true});await renderer.init();if(!renderer.backend.isWebGPUBackend)throw new Error('A WebGPU adapter is required; WebGL fallback is disabled.');renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;view.appendChild(renderer.domElement);build();HUB?.probe?.(()=>({scene:state==='playing'?'play':state==='end'?'over':state==='paused'?'menu':'title',menu:state!=='playing',world:elapsed,input:{x:Math.max(-1,Math.min(1,((keys.KeyD?1:0)-(keys.KeyA?1:0))+(navigator.getGamepads?.()[0]?.axes[0]||0))),y:Math.max(-1,Math.min(1,((keys.KeyS?1:0)-(keys.KeyW?1:0))+(navigator.getGamepads?.()[0]?.axes[1]||0))),fire:!!keys.Mouse0||!!navigator.getGamepads?.()[0]?.buttons[7]?.pressed}}));$('loading').style.display='none';if(inHub){HUB.on('time-up',()=>end(false,true));HUB.on('end',()=>{state='end';audio?.suspend();keys={}});let info=await HUB.connect({mode:'parallel',seats:[1,4]});if(info){startGame();HUB.ready()}else{inHub=false;menuHTML()}}else menuHTML();last=performance.now();frame()}catch(e){console.error(e);$('loading').innerHTML='UNABLE TO START<br><br>'+String(e.message||e)+'<br><br>WEBGPU AND AN INTERNET CONNECTION ARE REQUIRED.';HUB?.fail?.(String(e.message||e))}}
