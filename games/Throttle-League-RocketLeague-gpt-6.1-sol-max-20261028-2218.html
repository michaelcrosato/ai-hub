<!-- 
THROTTLE LEAGUE

SOURCE INFORMATION
Date: 2026-10-28 22:18 America/Vancouver (session start)
Source: Rocket League
Game title: Throttle League
Tech: Three.js r180 (0.180.0), WebGPU only; Rapier 0.19.3; PeerJS 1.5.5 / WebRTC; Web Audio API; Gamepad API; vanilla JavaScript, CSS, HTML.
Art Direction: Original procedural cel-shaded stadium, three arena palettes, inked low-poly cars, stepped toon lighting, comic typography, geometric particles, and handmade field markings. No source-game assets.
Animation: Fixed-step rigid-body simulation; quaternion camera and network interpolation; procedural wheel, antenna, flag, exhaust and particle animation; recorded transform goal replays.
Audio: Original live Web Audio synth soundtrack at 112 BPM; synthesized engine, boost, impacts, jump, pulse, crowd wash and goal stingers. No recorded voice work.
Online: Up to four players in six-digit WebRTC rooms through PeerJS public signaling and STUN. Host-authoritative Rapier simulation, input validation, snapshots, interpolation, ready state, drop-in bot replacement and quick chat. No TURN relay is bundled; restrictive NATs may prevent direct connections. Local split screen supports up to four players, including keyboard plus controllers.
Testing parameters: 46 automated checks passed: 26 WebGPU/gameplay/controller/attract checks, 9 checks with four real WebRTC peers on one machine, and 11 final standalone-file, credits, controller-menu, touch-notice, and no-WebGPU checks. Also verified direct file opening, saved garage/settings, night arena, and a 40-second AI match that produced three goals. Headless Chromium 141.0.7390.37 with software Vulkan WebGPU; no FPS target or optimization testing. Physical PS5 controller, four physical controllers, and cross-network NAT tests: unknown.
Environment: Codex CLI (headless); Linux / WSL2; end-user browser unknown. Test browser: Chromium 141.0.7390.37, headless, software Vulkan WebGPU.
Model: OpenAI, gpt-6.1-sol, reasoning effort max
Usage: Estimated API cost in USD: unknown. Total token use and breakdown: unknown. Session time: approximately 1 hour (measured wall-clock).

TESTING FEEDBACK
issues: Four game issues caught and fixed: inward-facing stadium roofs, missed head-on demolitions, wall-to-ceiling adhesion, and vertically swapped split-screen player views. Test-harness and browser-configuration failures were corrected separately.
critical: One game issue was critical: swapped split-screen views assigned the wrong camera to each player. Early QA was also blocked by Chromium 154 software-compositor output; the compatible bundled Chromium 141 WebGPU adapter rendered correctly. No critical issue remains in verified paths.
helpful: The scripted Rapier contact tests exposed demolition and ceiling failures, while four-view screenshots caught the viewport-origin mistake. The four-browser WebRTC test verified actual input, score and disconnect flows.
least: Static bundle/syntax checking caught no gameplay issues; it only confirmed that the single-file build could be assembled.

ENGINE FEEDBACK
liked: Three.js node toon materials and Rapier’s compact rigid-body API made a stylized, physical arena practical in one portable page.
stuck: I initially assumed WebGL-style bottom-left viewport coordinates, which swapped split-screen rows. WebGPURenderer also enables a WebGL fallback by default; its fallback callback had to be explicitly disabled. The installed Chromium 154 software compositor failed in headless QA; bundled Chromium 141 worked.
built: The wall-aware arcade car controller, match and replay flow, split-screen renderer, controller navigation, AI, and host-authoritative networking.
hardest: Keeping wall and ceiling adhesion, aerial control, replays, camera behavior, and network snapshots coherent across four viewpoints.
overhaul: Replace the renderer’s implicit backend fallback with an explicit backend policy.
change: Provide a documented WebGPU-only initialization option and explicit viewport-origin examples.

PROMPT FEEDBACK
liked: The concrete engine versions, single-file deliverable, attract mode and controller-first requirements defined a useful vertical slice.
confusing: “All modes that make sense” is open-ended; the slice focuses on standard soccer, Blitz, Moonball, and seven training activities.
hardest: Combining polished car physics, four-player split screen and real online rooms within a standalone page.
extraTest: A four-player session using physical PS5 controllers across two separate home networks, including restrictive NAT and disconnect recovery.
 -->

@keyframes load {
	0% {
		transform: translateX(-100%);
	}
	100% {
		transform: translateX(350%);
	}
}
@keyframes breathe {
	50% {
		opacity: 0.5;
	}
}
@keyframes announce {
	0% {
		opacity: 0;
		transform: scale(0.6) rotate(-4deg);
	}
	100% {
		opacity: 1;
		transform: scale(1) rotate(0);
	}
}
@keyframes slidein {
	from {
		opacity: 0;
		transform: translateX(-10px);
	}
	to {
		opacity: 1;
		transform: translateX(0);
	}
}

		font-size: 35px;
	}
	.hero-desc {
		font-size: 15px;
	}
	.home-bottom {
		font-size: 12px;

        4500

  }
  launchOnline() {
    if (this.online.role !== "host" || !this.online.peer?.open) return;
    const cfg = {

      localPlayers: 1,
      format: "doubles",
      skin: { ...this.skin },
      ballCam: this.settings.ballCam

    this.online.start(cfg);
    this.startMatch(cfg, true);
  }
  beginOnlineClient(config, roster, slot) {
    if (!this.gpuReady) return;
    this.online.roster = roster;
    this.active = true;
    this.attract = false;
    this.paused = false;
    this.result = null;
    this.localSlots = [slot];
    this.lastMatch = config;
    this.matchSaved = false;
    this.input.layout = "auto";

      local: r.slot === slot ? 0 : null,
      name: r.name

    this.arena.target.visible = true;
    this.arena.ballShadow.visible = true;

    this.ui.buildHUD();
    this.input.block();
    this.ui.clearAnnouncement();
  }
  playerJoined(slot) {
    if (this.active && this.online.role === "host") {

      const r = this.online.roster.find((x) => x.slot === slot);

  }
  finish(result) {
    if (this.attract) {
      this.startAttract();

    }

    this.paused = false;
    this.sim.phase = "finished";
    this.sound.event("win");
    this.ui.clearAnnouncement();

      const c = result.cars.find((c2) => c2.slot === this.localSlots[0]), win = c && c.team === result.winner;

      if (win) this.career.wins++;
      this.career.xp += this.lastXP;
      persist("career", this.career);

    this.ui.show("results");
    if (this.online.role === "host") this.online.finish(result);
  }
  pause() {
    if (!this.active || this.attract || this.sim.phase === "finished") return;
    this.paused = true;
    this.input.block();
    this.ui.show("pause");
  }
  resume() {
    this.paused = false;
    this.accumulator = 0;
    this.ui.show("game");
    this.input.block();
    this.ui.buildHUD();
  }
  nextDrill() {
    if (!this.sim?.training) return;
    this.sim.resetDrill((this.sim.drill + 1) % DRILLS.length);
    this.ui.buildHUD();
  }
  handleEvent(e, fromNetwork = false) {
    if (!this.active && e.type !== "start") return;
    if (!fromNetwork && this.online?.role === "host" && [
      "count",
      "go",
      "goal",
      "replay",
      "overtime",
      "hit",
      "pulse",
      "demo",
      "save",
      "chat",
      "respawn"

      this.online.event(e);

      this.sound.event("count");
    }

      this.sound.event("go");
    }
    if (e.type === "goal") {
      this.sound.event("goal");
      this.shake = this.settings.shake && !this.settings.reduced ? 0.8 : 0;
      this.ui.announce(
        (e.scorer || "THE HOUSE") + " SCORES!",
        e.ownGoal ? "OWN GOAL \xB7 IT HAPPENS TO THE BEST OF US" : e.assist ? "ASSIST BY " + e.assist : "ABSOLUTE SCENES.",
        e.team ? "orange" : "blue",
        1900
      );
      if (fromNetwork) this.arena.goalBurst(this.arena.ball.position, e.team);
      this.input.rumble(0, 0.8, 450);
    }
    if (e.type === "overtime") {
      this.ui.announce("OVERTIME", "NEXT GOAL TAKES IT.", "orange", 2200);
      this.sound.event("go");
    }
    if (e.type === "replay") this.ui.clearAnnouncement();
    if (e.type === "finish" && !fromNetwork) this.finish(e.result);
    if (e.type === "hit") {
      this.sound.event("hit", 0.6);
      if (local) {
        this.shake = this.settings.shake && !this.settings.reduced ? 0.18 : 0;
        this.input.rumble(this.sim.cars[e.slot]?.local || 0, 0.25, 80);
      }
      if (fromNetwork && e.position)
        this.arena.particles(e.position, 16768941, 9, 9);
    }
    if (e.type === "pulse") {
      this.sound.event("pulse");
      if (local) this.input.rumble(this.sim.cars[e.slot]?.local || 0, 0.6, 220);
      if (fromNetwork) {
        const c = this.sim.cars[e.slot];
        if (c) this.arena.pulse(c.visual.root.position, TEAM[c.team]);
      }
    }
    if (e.type === "jump" || e.type === "dodge") {
      if (local) {
        this.sound.event(e.type);
        this.input.rumble(this.sim.cars[e.slot]?.local || 0, 0.2, 80);
      }
    }
    if (e.type === "pad" && local) this.sound.event("pad");
    if (e.type === "demo") {
      this.sound.event("demo");
      if (local || this.localSlots.includes(e.victim))
        this.ui.toast(
          this.sim.cars[e.slot].name + " demolished " + this.sim.cars[e.victim].name
        );
      if (fromNetwork && e.position)
        this.arena.particles(e.position, 16754282, 40, 20);
    }
    if (e.type === "save" && local) {
      this.ui.toast("WHAT A SAVE! +50");
      this.sound.event("success");
    }
    if (e.type === "chat") {
      this.ui.addChat(e.slot, e.message);
      this.sound.event("chat");
    }
    if (e.type === "drill") {
      this.ui.toast(
        DRILLS[e.index].name + " \xB7 " + DRILLS[e.index].objective,
        2800
      );
    }
    if (e.type === "tutorialStage") {
      this.sound.event("pad");
      this.ui.toast(this.sim.tutorialText(), 3200);
    }
    if (e.type === "drillSuccess") {
      this.sound.event("success");
      this.ui.announce(
        e.text,
        e.time.toFixed(1) + " SECONDS \xB7 FULL SEND APPROVED",
        "blue",
        1900
      );
      if (!this.career.best[e.drill] || e.time < this.career.best[e.drill])
        this.career.best[e.drill] = e.time;
      this.career.xp += 25;
      persist("career", this.career);
    }
  }
  startAttract() {
    if (!this.gpuReady) return;
    this.attractTime = 0;
    this.lastShowcase = 0;
    const cfg = {
      ...this.config,
      mode: "classic",
      format: "doubles",
      localPlayers: 1,
      arena: ["solar", "night", "lunar"][Math.floor(Math.random() * 3)],
      attract: true,
      skin: { ...this.skin }
    };
    this.startMatch(cfg);
    this.attract = true;
    this.sim.attract = true;
    this.sim.phase = "play";
    for (const c of this.sim.cars) {
      c.human = false;
      c.local = null;
      this.arena.label(
        c.visual,
        ["ROOK", "NOVA", "AXEL", "JUNO"][c.slot] + " \u2022 AI"
      );
    }
    this.ui.clearAnnouncement();
    this.ui.buildHUD();
  }
  stopAttract() {
    this.attract = false;
    this.active = false;
    this.setHero();
    this.ui.show("home");
    this.lastActivity = performance.now();
  }
  showcase(dt) {
    this.attractTime += dt;
    if (this.attractTime > 58) {
      this.startAttract();
      return;
    }
    const stage = Math.floor(this.attractTime / 9);
    if (stage !== this.lastShowcase) {
      this.lastShowcase = stage;
      const c = this.sim.cars[0];
      if (stage === 1) {
        c.body.setTranslation({ x: 32.5, y: 7, z: -8 }, true);
        c.body.setRotation(
          new THREE3.Quaternion().setFromEuler(
            new THREE3.Euler(0, Math.PI, -Math.PI / 2)
          ),
          true
        );
        c.body.setLinvel({ x: 0, y: 7, z: 18 }, true);
      }
      if (stage === 2) {
        c.body.setTranslation({ x: -3, y: 10, z: -5 }, true);
        c.body.setRotation(
          new THREE3.Quaternion().setFromEuler(new THREE3.Euler(0.5, Math.PI, 0)),
          true
        );
        c.body.setLinvel({ x: 0, y: 9, z: 19 }, true);
        this.sim.ball.setTranslation({ x: 0, y: 12, z: 10 }, true);
        this.sim.ball.setLinvel({ x: 0, y: 1, z: 6 }, true);
      }
      if (stage === 3) {
        c.pulse = 0;
        this.arena.pulse(c.visual.root.position);
        this.sound.event("pulse");
      }
      if (stage === 4) {
        this.sim.ball.setTranslation({ x: 0, y: 3, z: 42 }, true);
        this.sim.ball.setLinvel({ x: 0, y: 3, z: 26 }, true);
      }
    }
  }
  viewports() {
    const count = this.attract ? 1 : this.localSlots.length;
    if (count <= 1) return [{ x: 0, y: 0, w: 1, h: 1 }];
    if (count === 2)
      return this.settings.split === "horizontal" ? [
        { x: 0, y: 0, w: 1, h: 0.5 },
        { x: 0, y: 0.5, w: 1, h: 0.5 }
      ] : [
        { x: 0, y: 0, w: 0.5, h: 1 },
        { x: 0.5, y: 0, w: 0.5, h: 1 }
      ];
    return [
      { x: 0, y: 0, w: 0.5, h: 0.5 },
      { x: 0.5, y: 0, w: 0.5, h: 0.5 },
      { x: 0, y: 0.5, w: 0.5, h: 0.5 },
      { x: 0.5, y: 0.5, w: 0.5, h: 0.5 }
    ];
  }
  makeCameras() {
    this.cameras = this.viewports().map(() => {
      const c = new THREE3.PerspectiveCamera(this.settings.fov, 1, 0.12, 450);
      c.position.set(0, 10, -43);
      c.userData.look = new THREE3.Vector3(0, 1, 0);
      c.userData.initial = true;
      return c;
    });
  }
  resize() {
    if (!this.renderer) return;
    this.renderer.setSize(innerWidth, innerHeight);
    this.mainCamera.aspect = innerWidth / innerHeight;
    this.mainCamera.updateProjectionMatrix();
    if (this.active) {
      this.makeCameras();
      this.ui.buildHUD();
    }
  }
  cameraFor(c, car, dt, viewport, index) {
    const ball = this.arena.ball.position, activeReplay = this.sim.phase === "replay" || this.sim.phase === "goal";
    let targetPos, look;
    if (!car || this.attract) {
      const angle = this.elapsed * 0.055;
      targetPos = new THREE3.Vector3(
        Math.sin(angle) * 24 + ball.x * 0.45,
        25,
        Math.cos(angle) * 34 + ball.z * 0.45
      );
      look = ball.clone().setY(Math.max(2, ball.y * 0.7));
    } else if (activeReplay) {
      targetPos = ball.clone().add(new THREE3.Vector3(18, 12, ball.z > 0 ? -21 : 21));
      look = ball.clone().add(new THREE3.Vector3(0, 1, 0));
    } else {
      const p = car.visual.root.position, q = car.visual.root.quaternion, forward = new THREE3.Vector3(0, 0, -1).applyQuaternion(q);
      forward.y = 0;
      if (forward.lengthSq() < 0.01) forward.set(0, 0, car.team === 0 ? 1 : -1);
      forward.normalize();
      const toBall = ball.clone().sub(p).setY(0).normalize();
      let direction = car.ballCam ? toBall : forward;
      if (direction.lengthSq() < 0.1) direction = forward;
      const inp = this.input.player(index);
      car.camOrbit += inp.lookX * dt * 1.9;
      if (Math.abs(inp.lookX) < 0.1) car.camOrbit *= Math.exp(-dt * 3);
      direction.applyAxisAngle(new THREE3.Vector3(0, 1, 0), car.camOrbit);
      const dist = this.settings.distance + (car.speed > 35 ? 1.5 : 0), height = 6.3 + clamp2(ball.y - p.y, 0, 15) * 0.2 - inp.lookY * 3;
      targetPos = p.clone().addScaledVector(direction, -dist).add(new THREE3.Vector3(0, height, 0));
      look = p.clone().addScaledVector(
        direction,
        car.ballCam ? Math.min(8, p.distanceTo(ball) * 0.2) : 5
      ).add(new THREE3.Vector3(0, 2, 0));
      if (car.ballCam) look.y += clamp2(ball.y - p.y, 0, 16) * 0.3;
    }
    targetPos.x = clamp2(targetPos.x, -37, 37);
    targetPos.z = clamp2(targetPos.z, -61, 61);
    targetPos.y = Math.max(3, targetPos.y);
    const ease = c.userData.initial ? 1 : 1 - Math.exp(-dt * (activeReplay ? 3.5 : 7.5));
    c.position.lerp(targetPos, ease);
    c.userData.look.lerp(look, ease);
    c.userData.initial = false;
    if (this.shake > 0 && this.settings.shake && !this.settings.reduced)
      c.position.add(
        new THREE3.Vector3(
          (Math.random() - 0.5) * this.shake,
          (Math.random() - 0.5) * this.shake,
          0
        )
      );

    c.up.set(0, 1, 0);
    c.fov = this.settings.fov + (car ? Math.min(car.speed, 50) * 0.12 : 0);

    c.updateMatrixWorld();

      const pt = ball.clone().project(c), arrow = document.getElementById("pointer-" + index);
      if (arrow) {
        const off = pt.z > 1 || Math.abs(pt.x) > 0.9 || Math.abs(pt.y) > 0.85;
        arrow.style.display = off ? "block" : "none";
        if (off) {
          arrow.style.left = clamp2((pt.x + 1) * 50, 10, 83) + "%";
          arrow.style.top = clamp2((-pt.y + 1) * 50, 18, 79) + "%";
          arrow.textContent = (pt.x < 0 ? "\u25C0 " : "\u25B6 ") + "BALL";
        }
      }
    }
  }
  frame(time) {
    if (!this.gpuReady) return;
    const dt = this.lastFrame ? Math.min((time - this.lastFrame) / 1e3, 0.09) : 1 / 60;
    this.lastFrame = time;
    this.elapsed += dt;
    this.input.poll(time);
    if (this.ui.screen === "game") {
      if (this.input.pausePressed()) this.pause();
      const inp = this.input.player(0);
      if (this.sim.training && inp.chat === 3 && this.trainingNavOld !== 3)
        this.nextDrill();
      this.trainingNavOld = inp.chat;
      if ((this.sim.phase === "replay" || this.sim.phase === "goal") && (this.input.pressed.has("Enter") || this.input.pressed.has("Space") || this.input.pads.some((p) => this.input.edgePad(p, 0)))) {
        if (this.online.role !== "client") this.sim.skipReplay();

    } else if (!this.attract) this.ui.nav(this.input.menu(time));
    const isGame = this.active, networked = !!this.online.role && this.online.started;
    const playing = isGame && (!this.paused || networked) && this.sim.phase !== "finished";
    if (playing) {
      const inputs = this.localSlots.map(
        (_, i) => this.paused ? zero() : this.input.player(i)
      );
      if (this.sim.training) for (const inp of inputs) inp.chat = -1;
      if (this.online.role === "client") {
        const inp = inputs[0] || zero();
        if (inp.cam && !this.clientCamOld)
          this.sim.cars[this.localSlots[0]].ballCam = !this.sim.cars[this.localSlots[0]].ballCam;
        this.clientCamOld = inp.cam;
        if (inp.chat >= 0 && inp.chat !== this.clientChatOld)
          this.online.chat(inp.chat);
        this.clientChatOld = inp.chat;

        this.sim.syncVisuals(1 - Math.exp(-dt * 17));

        this.accumulator += dt;

        while (this.accumulator >= 1 / 120 && steps++ < 16) {
          this.sim.step(1 / 120, inputs);
          this.accumulator -= 1 / 120;

        this.sim.syncVisuals(1);
      }
      if (this.attract) this.showcase(dt);
      if (this.online.role === "host" && time - this.lastNetwork > 45) {
        this.lastNetwork = time;
        this.online.snapshot(this.sim.snapshot());
      }
      if (time - this.lastBoard > 900) {
        this.arena.updateScore(
          this.sim.score,
          (this.sim.overtime ? "+" : "") + formatTime(this.sim.clock)
        );
        this.lastBoard = time;
      }
    }
    if (!isGame) {
      const garage = this.ui.screen === "garage";
      if (garage !== this.heroGarage) this.setHero(garage);
      this.sim.syncVisuals(1);
      if (this.heroCar) {
        this.heroCar.visual.root.position.y = 1.75 + (this.settings.reduced ? 0 : Math.sin(this.elapsed * 1.8) * 0.035);
        this.heroCar.visual.name.visible = false;
      }
      if (garage) {
        for (const c of this.sim.cars)
          if (c !== this.heroCar) {
            c.visual.root.visible = false;
            c.visual.shadow.visible = false;
          }
      }
      const target = garage ? new THREE3.Vector3(10, 2.4, -5) : new THREE3.Vector3(9, 1, 6);
      const pos = garage ? new THREE3.Vector3(19, 9, 24) : new THREE3.Vector3(34 + Math.sin(this.elapsed * 0.08) * 1.5, 15, 38);
      this.mainCamera.position.copy(pos);
      this.mainCamera.lookAt(target);
      this.mainCamera.fov = garage ? 43 : 53;
      this.mainCamera.aspect = innerWidth / innerHeight;
      this.mainCamera.updateProjectionMatrix();
      if (this.ui.screen === "home" && time - this.lastActivity > 1e4)
        this.startAttract();
    }
    for (const c of this.sim.cars) {
      this.arena.animateCar(
        c.visual,
        dt,
        isGame ? c.speed : 0,
        c.input?.steer || 0,
        isGame && c.boosting,
        this.elapsed
      );
      if (!isGame) c.visual.name.visible = false;
    }
    this.arena.tick(dt, this.elapsed, this.sim);
    this.shake = Math.max(0, this.shake - dt * 1.8);
    if (isGame && this.cameras.length) {
      const vps = this.viewports();
      if (vps.length !== this.cameras.length) this.makeCameras();
      this.renderer.setScissorTest(true);
      vps.forEach((v, i) => {
        const cam = this.cameras[i], car2 = this.sim.cars[this.localSlots[i]];
        this.cameraFor(cam, car2, dt, v, i);
        const x = Math.floor(v.x * innerWidth), y = Math.floor(v.y * innerHeight), w = Math.ceil(v.w * innerWidth), h = Math.ceil(v.h * innerHeight);
        this.renderer.setViewport(x, y, w, h);
        this.renderer.setScissor(x, y, w, h);
        if (car2) car2.visual.name.visible = false;
        this.renderer.render(this.scene, cam);
        if (car2) car2.visual.name.visible = true;
      });
      this.renderer.setScissorTest(false);
      this.renderer.setViewport(0, 0, innerWidth, innerHeight);
    } else {
      this.renderer.setScissorTest(false);
      this.renderer.setViewport(0, 0, innerWidth, innerHeight);
      this.renderer.render(this.scene, this.mainCamera);
    }
    this.ui.updateHUD(time);
    const car = this.sim.cars[this.localSlots[0]];
    this.sound.tick(playing, car?.speed || 0, car?.boosting || false, dt);
    this.input.endFrame();
  }
  debugSnapshot() {
    return {
      ready: this.gpuReady,
      backend: this.renderer?.backend?.isWebGPUBackend ? "webgpu" : "unknown",
      screen: this.ui.screen,
      phase: this.sim?.phase,
      score: this.sim?.score,
      clock: this.sim?.clock,
      localSlots: this.localSlots,
      ball: this.sim?.ball?.translation(),
      cars: this.sim?.cars.map((c) => ({
        slot: c.slot,
        pos: c.body.translation(),
        velocity: c.body.linvel(),
        grounded: c.grounded,
        boost: c.boost,
        pulse: c.pulse,
        stats: c.stats
      })),
      online: {
        role: this.online.role,
        code: this.online.code,
        roster: this.online.roster
      },
      career: this.career
    };
  }
};
new Game();
</script>
