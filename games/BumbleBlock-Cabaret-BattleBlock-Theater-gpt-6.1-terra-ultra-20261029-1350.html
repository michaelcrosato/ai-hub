function textMenu(html){panel.innerHTML=html;menuButtons=[...panel.querySelectorAll('button[data-action]')];choice=Math.min(choice,Math.max(0,menuButtons.length-1));highlight()}

function showMenu(which){menu=which;choice=0;veil.style.display='grid';if(which==='title'){gameState='title';attract=false;hud.style.display='none';textMenu(`<div class="eyebrow">A tiny catastrophe in three acts</div><h1>BumbleBlock<br>Cabaret</h1><p class="sub">The doors are locked. The audience is hungry.<br>Fortunately, you are extremely throwable.</p><div class="buttons">${button('▶  Play','play')}${button('⚑  Online','online')}${button('⚙  Settings','settings')}${button('★  About','about')}</div><p class="hint">LEFT STICK / D-PAD to choose　 •　 ✕ / ENTER to select</p>`)}

}
function act(action){lastInput=performance.now();beep(420,.06);if(action==='play'){start(false,false)}else if(action==='online'){start(false,true)}else if(action==='settings'||action==='about'){showMenu(action)}else if(action==='back'){showMenu(gameState==='paused'?'pause':'title')}else if(action==='quit'){hub=null;showMenu('title')}else if(action==='resume'){gameState='playing';veil.style.display='none'}else if(action==='restart'){loadLevel(level);gameState='playing';veil.style.display='none'}else if(action in settings){settings[action]=!settings[action];localStorage.setItem('bumble-settings',JSON.stringify(settings));showMenu('settings')}}
panel.addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(b)act(b.dataset.action)});
function beep(freq,duration=.1,type='square',volume=.035){if(!settings.sfx)return;try{audio??=new AudioContext();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function music(){if(!settings.music||!audio||audio.state!=='running'||gameState!=='playing')return;if(audio.currentTime>nextNote){let notes=[220,330,440,330,262,392,523,392,196,294,392,294,247,370,494,370];let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=notes[noteIndex++%notes.length];g.gain.setValueAtTime(.025,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.18);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.19);nextNote=audio.currentTime+.23}}
function formatTime(n){return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')}
function say(s,t=3){toast.textContent=s;showTime=t}
function makeActor(color){let group=new THREE.Group();let head=cube(0,.42,0,.85,.78,.65,color,group);head.rotation.z=.05;cube(-.19,.5,.34,.13,.16,.05,0x251b34,group);cube(.19,.5,.34,.13,.16,.05,0x251b34,group);cube(0,.25,.35,.19,.06,.05,0x251b34,group);cube(-.25,-.08,0,.2,.35,.25,0x34203d,group);cube(.25,-.08,0,.2,.35,.25,0x34203d,group);return group}
async function init(){if(!navigator.gpu){panel.innerHTML='<h2>WebGPU required</h2><p class="sub">This show needs a browser with WebGPU enabled. Try a current Chromium-based browser on a supported device.</p><div class="buttons"><button onclick="showMenu(\'settings\')">Settings</button></div>';return false}try{await RAPIER.init();renderer=new THREE.WebGPURenderer({antialias:true});await renderer.init();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.querySelector('#stage').appendChild(renderer.domElement);scene=new THREE.Scene();scene.background=new THREE.Color(0x49354f);camera=new THREE.OrthographicCamera(-11,11,6.2,-6.2,.1,100);camera.position.set(0,4,22);scene.add(new THREE.HemisphereLight(0xfff2ce,0x67415d,2.4));let light=new THREE.DirectionalLight(0xffeac5,2);light.position.set(4,8,10);scene.add(light);world=new RAPIER.World({x:0,y:-25,z:0});window.addEventListener('resize',resize);resize();showMenu('title');return true}catch(e){panel.innerHTML=`<h2>Show unavailable</h2><p>WebGPU could not start: ${String(e.message||e).replace(/[<>]/g,'')}</p>`;console.error(e);return false}}
function resize(){if(!renderer)return;renderer.setSize(innerWidth,innerHeight);let aspect=innerWidth/innerHeight;camera.left=-6.2*aspect;camera.right=6.2*aspect;camera.top=6.2;camera.bottom=-6.2;camera.updateProjectionMatrix()}
function loadLevel(index){if(levelGroup)scene.remove(levelGroup);world=new RAPIER.World({x:0,y:-25,z:0});levelGroup=new THREE.Group();scene.add(levelGroup);objects=[];enemies=[];platforms=[];particles=[];gems=0;checkpoint={x:1,y:2};let a=acts[index];for(let [x,y,w,h] of a.platforms){cube(x,y,0,w,h,2,0x66435c);cube(x,y+h/2+.06,0,w,.12,2.05,0xe9a07c);for(let xx=x-w/2+.6;xx<x+w/2;xx+=1.4)cube(xx,y-.05,1.02,.08,.55,.03,0x9e6e79);let rb=world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(x,y,0));world.createCollider(RAPIER.ColliderDesc.cuboid(w/2,h/2,1),rb);platforms.push({x,y,w,h})}for(let [x,y,w] of a.spikes){for(let i=0;i<w;i+=.6){let m=new THREE.Mesh(new THREE.ConeGeometry(.32,.6,4),mat(0xff8290));m.position.set(x-w/2+i+.3,y+.3,0);m.rotation.y=Math.PI/4;levelGroup.add(m)}objects.push({type:'spike',x,y,w})}for(let [x,y] of a.gems){let m=new THREE.Mesh(new THREE.OctahedronGeometry(.38),mat(0xffd65e));m.position.set(x,y,0);levelGroup.add(m);objects.push({type:'gem',x,y,mesh:m,taken:false})}let flag=cube(a.checkpoint,1.3,0,.12,2.5,.12,0xffe9b0);cube(a.checkpoint+.38,2.15,0,.7,.45,.12,0xff7189);objects.push({type:'checkpoint',x:a.checkpoint,active:false});cube(a.exit,1.2,-.4,1.6,2.8,.5,0x291d36);cube(a.exit,1.3,-.1,1,2.1,.1,0xffd964);objects.push({type:'exit',x:a.exit});for(let [x,y] of a.cats){let mesh=makeActor(0x9bd5b3);mesh.position.set(x,y,0);levelGroup.add(mesh);enemies.push({x,y,origin:x,mesh,alive:true,dir:1})}player=makeActor(0xf5dd9a);levelGroup.add(player);body=world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(1,2,0).lockRotations().setEnabledTranslations(true,true,false));world.createCollider(RAPIER.ColliderDesc.cuboid(.36,.46,.35).setFriction(0),body);document.querySelector('#act').textContent=index+1;say(a.name+' — '+a.tag,5);camera.position.x=3;deathLock=0;jumps=0}
function start(isAttract,isOnline){if(!renderer)return;try{audio??=new AudioContext();audio.resume()}catch{}attract=isAttract;online=isOnline;level=0;totalGems=0;lives=3;elapsed=0;finished=false;hub=null;if(online&&window.AIHub){hub=window.AIHub;hub.connect({mode:'parallel',seats:[1,4]}).then(info=>{if(info)hub.ready()}).catch(()=>{hub=null});}loadLevel(0);gameState='playing';veil.style.display='none';hud.style.display='block';document.querySelector('#attract').style.display=attract?'block':'none'}
function die(){if(deathLock>0)return;deathLock=1;beep(100,.3,'sawtooth');if(!attract)lives--;if(lives<=0){lives=3;totalGems=Math.max(0,totalGems-gems);loadLevel(level);say('Out of hearts! This act gets another take.',3)}else{body.setTranslation({x:checkpoint.x,y:checkpoint.y,z:0},true);body.setLinvel({x:0,y:0,z:0},true);invincible=1.5;say('Back to the checkpoint! The crowd pretends not to notice.',2)}}
function inputAction(name){lastInput=performance.now();if(attract){showMenu('title');return}if(gameState==='playing'){if(name==='jump')jumpQueued=true;if(name==='attack')attackQueued=true;if(name==='dash'&&dash<=0){dash=.22;beep(150,.12,'sawtooth')}if(name==='pause')showMenu('pause')}else{if(name==='up'||name==='down'){let direction=name==='up'?-1:1;if(settings.invertY)direction*=-1;choice=(choice+direction+menuButtons.length)%menuButtons.length;highlight();beep(300,.04)}if(name==='select'&&menuButtons[choice])act(menuButtons[choice].dataset.action);if(name==='pause'&&gameState==='paused')act('resume')}}
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;keys[e.code]=true;let map={Space:'jump',KeyW:'jump',ArrowUp:gameState==='playing'?'jump':'up',ArrowDown:'down',KeyS:'down',Enter:'select',KeyJ:'attack',KeyK:'dash',ShiftLeft:'dash',Escape:'pause'};if(map[e.code])inputAction(map[e.code]);else{lastInput=performance.now();if(attract)showMenu('title')}});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('pointerdown',()=>{lastInput=performance.now();if(attract)showMenu('title')});
function gamepad(){let pad=navigator.getGamepads?.()[0];if(!pad)return 0;let b=pad.buttons,axis=pad.axes[0]||0,vertical=pad.axes[1]||0;let states={jump:b[0]?.pressed,select:b[0]?.pressed,attack:b[2]?.pressed,dash:b[5]?.pressed,pause:b[9]?.pressed,up:b[12]?.pressed||vertical<-.6,down:b[13]?.pressed||vertical>.6};for(let k in states){if(states[k]&&!lastPad[k]){if((k==='select')===(gameState!=='playing')||!['select','jump'].includes(k))inputAction(k)}lastPad[k]=states[k]}let dx=Math.abs(axis)>.2?axis:0;if(b[14]?.pressed)dx=-1;if(b[15]?.pressed)dx=1;if((dx||Math.abs(vertical)>.2)&&attract){attract=false;showMenu('title');return 0}if(dx)lastInput=performance.now();return dx}
function update(dt){let pad=gamepad();if(gameState==='title'&&performance.now()-lastInput>10000)start(true,false);if(gameState!=='playing')return;elapsed+=dt;music();world.timestep=dt;let p=body.translation(),v=body.linvel();let move=pad+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);if(settings.invertX)move=-move;if(attract){move=1;let near=platforms.some(q=>q.x+q.w/2-p.x<1.7&&q.x+q.w/2-p.x>-.1&&Math.abs(p.y-(q.y+q.h/2+.46))<.7);if((near||enemies.some(e=>e.alive&&Math.abs(e.x-p.x)<2))&&jumps<2)jumpQueued=true;if(p.y<-1&&jumps<2)jumpQueued=true;if(enemies.some(e=>e.alive&&Math.abs(e.x-p.x)<1.6))attackQueued=true}move=Math.max(-1,Math.min(1,move));grounded=platforms.some(q=>p.x>q.x-q.w/2-.3&&p.x<q.x+q.w/2+.3&&Math.abs(p.y-(q.y+q.h/2+.46))<.16&&v.y<=.5);if(grounded)jumps=0;if(jumpQueued&&jumps<2){body.setLinvel({x:v.x,y:jumps===0?10.2:9,z:0},true);jumps++;beep(550+jumps*130,.1); }jumpQueued=false;dash=Math.max(0,dash-dt);body.setLinvel({x:move*(dash>0?13:6),y:body.linvel().y,z:0},true);world.step();p=body.translation();player.position.set(p.x,p.y-.25,0);player.rotation.z=move?Math.sin(elapsed*12)*.08:0;invincible=Math.max(0,invincible-dt);deathLock=Math.max(0,deathLock-dt);player.visible=invincible<=0||Math.floor(elapsed*12)%2===0;
for(let o of objects){if(o.type==='gem'&&!o.taken){o.mesh.rotation.y+=dt*3;o.mesh.position.y=o.y+Math.sin(elapsed*3+o.x)*.12;if(Math.abs(p.x-o.x)<.65&&Math.abs(p.y-o.y)<.8){o.taken=true;o.mesh.visible=false;gems++;totalGems++;beep(750,.12,'sine');if(hub)hub.progress({score:totalGems})}}else if(o.type==='spike'&&Math.abs(p.x-o.x)<o.w/2&&p.y<o.y+.8&&p.y>o.y-1&&invincible<=0)die();else if(o.type==='checkpoint'&&!o.active&&Math.abs(p.x-o.x)<.8&&p.y<4){o.active=true;checkpoint={x:o.x,y:3};beep(500,.25,'sine');say('Checkpoint! A surprisingly humane workplace policy.',3)}else if(o.type==='exit'&&Math.abs(p.x-o.x)<.9&&p.y<3){if(gems>=3){if(level<2){level++;loadLevel(level)}else if(!finished){finished=true;if(hub){hub.result({score:totalGems,time:elapsed})}if(attract){level=0;loadLevel(0)}else showMenu('win')}}else if(showTime<=0)say('The door demands at least 3 gems. Very particular door.',2)}}
for(let enemy of enemies){if(!enemy.alive)continue;enemy.x+=enemy.dir*dt*1.3;if(Math.abs(enemy.x-enemy.origin)>2)enemy.dir*=-1;enemy.mesh.position.x=enemy.x;enemy.mesh.rotation.z=Math.sin(elapsed*5)*.1;if(attackQueued&&Math.abs(p.x-enemy.x)<1.6&&Math.abs(p.y-enemy.y)<1.3){enemy.alive=false;enemy.mesh.visible=false;beep(230,.15,'sawtooth');say('A very convincing punch!',1)}else if(Math.abs(p.x-enemy.x)<.65&&Math.abs(p.y-enemy.y)<.9&&invincible<=0)die()}attackQueued=false;if(p.y<-5)die();camera.position.x=THREE.MathUtils.lerp(camera.position.x,p.x+3,Math.min(1,dt*3));camera.position.y=THREE.MathUtils.lerp(camera.position.y,Math.max(3,p.y+1),Math.min(1,dt*2));camera.lookAt(camera.position.x,camera.position.y,0);document.querySelector('#gems').textContent=gems;document.querySelector('#hearts').textContent=lives;document.querySelector('#clock').textContent=formatTime(elapsed);showTime-=dt;toast.style.opacity=showTime>0?'1':'0'}
showMenu('title');if(matchMedia('(pointer:coarse)').matches&&!matchMedia('(any-pointer:fine)').matches)document.body.classList.add('touch');init().then(ok=>{if(!ok)return;renderer.setAnimationLoop(()=>{let dt=Math.min(clock.getDelta(),.033);update(dt);renderer.render(scene,camera)})});
