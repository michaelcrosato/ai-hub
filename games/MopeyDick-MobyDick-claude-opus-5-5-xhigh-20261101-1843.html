<!--
Mopey Dick; or, The Melancholy Whale

Source Information
- Date: 2026-11-01 18:43 (started); built 2026-11-01 21:44
- Source: Moby-Dick; or, The Whale, by Herman Melville (1851). Public domain.
- Game: Mopey Dick; or, The Melancholy Whale. Title drawn by a cryptographic RNG (Python secrets) from 50 brainstormed riffs on the book’s name.
- Genre and Perspective: Naval whaling action-adventure: a four-chapter story campaign, a versus party mode (A Gam), and online play. Main view: third-person Chase camera (three.js PerspectiveCamera). Switch with R3 / V to a first-person Bow view or an orthographic top-down Chart view (OrthographicCamera); the story adds a first-person Mast-Head view.
- Tech: three.js r180 (WebGPURenderer: WebGPU with its automatic WebGL 2 fallback; TSL node materials; PostProcessing with BloomNode), Rapier 0.19.3 (@dimforge/rapier3d-compat) for boats, irons, collisions and buoyancy forces, Web Audio API, Gamepad API, PeerJS 1.5.4 for Gam Online, AI Hub session client 1.3.0. Bundled with Bun 1.3.14; libraries load from the jsDelivr CDN.
- Art Direction: Engine-native three.js look: physically based materials, procedural geometry, a Gerstner-wave ocean and procedural sky written in TSL, real-time shadows, fog, bloom and a vignette.
- Animation: Engine-native: THREE.AnimationMixer playing AnimationClips (quaternion and vector keyframe tracks) on skinned whales (SkinnedMesh bone chains), rowing crews, oars, sails and albatross wings, cross-faded by state; simulation-driven motion on top.
- Audio: All code-written with Web Audio: a small tracker playing original shanty-style tunes on synthesized concertina, fiddle, whistle, bass, bodhrán, bells and choir; synthesized effects (oars, spouts, the running line, thunder, breaches, bells); an ocean, wind and rain bed; whale-song notes; Animalese-style gibberish voices with a timbre per character.
- Online: AI Hub Session Protocol v1 in versus mode (the host runs whales and score; each copy steers its own boat; 15 Hz snapshots with interpolation; standings, stats and awards; server-hosted rounds). Standalone: Gam Online over PeerJS (four-letter room code, host relays, clock sync). No chat, no custom names.
- Testing: Chromium 153 through Playwright. Software rendering (SwiftShader) for most runs, plus the real GPU, an NVIDIA RTX 4070 SUPER: WebGPU in headless Windows Chrome 156 (144 fps, 95th-percentile frame 7 ms) and WebGL 2 through ANGLE/D3D12 at 1920x1080 (steady 60 fps). Audio recorded from the game’s own output and measured (voice pitch and syllables, musical key, effects), with WAVs kept for listening. build checks, physics traces, an autopilot that plays every story chapter and both endings, AI-vs-AI gams, UI and touch-device screenshots, a two-page PeerJS online test, and the AI Hub harness (1, 2, 3 and 4 players, bad network, host leaving, server-hosted). No human play-test; no physical controller (keyboard and emulated input only); a 39-point feature checklist (tools/features.py) covers TASK.md item by item.
- Research: No web research. Read the AI Hub protocol README, harness and arena example from the ai-hub repository, and the three.js r180 and Rapier 0.19.3 packages for API details. The book from memory.
- Environment: Claude Code CLI (headless); Linux (Ubuntu on WSL2); browser unknown (the player’s browser; tested in Chromium 153 headless).
- Model: Anthropic, claude-opus-5-5, reasoning effort xhigh.
- Usage: Estimate from this session’s transcript, priced at Claude Opus 5.5 list rates ($4 input, $20 output, $0.20 cache read, $8 one-hour cache write per million tokens): about $45 USD for about 136 M tokens (134.2 M cache reads, 0.85 M cache writes, 0.58 M output, under 0.001 M uncached input) over 245 API calls up to 21:44. Session time about 3 h 1 min (18:43 to 21:44).

Testing Feedback
- Issues caught by testing: 36, counted from the session’s test log (tools/TESTLOG.md): physics (torques never reset, sinking buoyancy), story scripts that stalled (steps done out of order, the gam ship’s collider left at the origin, an uncatchable White Whale, a ship-ram that never reached the ship), AI Hub conformance (late hello, late ready, a world that stalled when frames were slow), a lost PeerJS welcome, audio-node overload, and UI and visual faults.
- Critical or game-breaking: 12: the two physics faults, the five story stalls (including Ahab’s crew able to spawn under the ship’s hull), the three hub-session failures, the audio overload that stalled the page, and the online join.
- Most helpful test: The autopilot play-through of every chapter: a computer crew plays the story with the real game loop, and it found all four story-breaking stalls.
- Least helpful test: Early screenshots taken on wall-clock waits: the idle timer would start the attract demo, or the camera had not settled, so the pictures misled more than they showed.

Engine Feedback
- Liked most: TSL. The Gerstner ocean is written once as JavaScript-shaped shader code that matches the CPU wave function driving buoyancy, and the same materials run on WebGL 2 when WebGPU is missing.
- Stuck or guessed wrong: Rapier’s resetForces does not clear torques, so buoyancy torques piled up and launched the boat until resetTorques was added. I also had to read the r180 source to learn that material.normalNode is in view space.
- Most important thing built: One sea for physics and pictures: a CPU Gerstner model matching the TSL one, Rapier buoyancy and tow-line forces on top, and a host-run whale simulation that every mode (story, gam, hub, online, demo) shares.
- Hardest part: Checking a WebGPU game headlessly: blank WebGPU screenshots, seconds-long shader compiles in software rendering, and slow frames that starved a requestAnimationFrame-only loop.
- Remove or overhaul: Rapier JS’s persistent-force model (add, step, remember to reset forces and torques separately). A per-step impulse API would have avoided the worst bug.
- Change one thing: three.js should ship a documented way to precompile node materials for a scene before the first frame, so a game can be ready without a long first-render stall.

Prompt Feedback
- Liked most: A free choice of book and genre, a fixed tech stack, and an AI Hub harness that checks the multiplayer for real.
- Confusing: The source slot was left literal ("a spiritual successor to Pick a famous book"). "Multiplayer … as well as for the game on its own" could mean the hub only or standalone multiplayer too, so both were built. "Engine native style" is vague for three.js, a library with no house style. Cost and token usage are not visible to the agent.
- Hardest: Making the book’s voice and its whaling into game mechanics (the line, the law of Fast-Fish and Loose-Fish, the gam, the three-day chase) while keeping every feature finished and verified without a human player.
- One test I wish I could run: A real hub session on real hardware: four friends with DualSense controllers and GPUs, timed from load to the final bell.

-->

<script>/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);

      return fullscreenOn ? root.document.documentElement || null : null;
    };

      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */

    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */

    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };

    post('send', fields);
    return true;
  };

  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

    var h = 2166136261;
    var s = String(label === undefined ? '' : label);

      h = Math.imul(h, 16777619);
    }

  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */

    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */

      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};

      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

n",cost:15,desc:"Another harpoon in the crotch, for the whale that wants two.",apply:(s)=>{s.irons+=1}}];function boatStats(owned=[]){let s={...BOAT_STATS};for(let u of UPGRADES)if(owned.includes(u.id))u.apply(s);return s}var TEAM=[{color:15221818,css:"#e8443a",mate:"Starbuck"},{color:3900150,css:"#3b82f6",mate:"Stubb"},{color:2278750,css:"#22c55e",mate:"Flask"},{color:16103168,css:"#f5b700",mate:"Ahab"}],PEOPLE={ishmael:{name:"Ishmael",role:"Narrator, an oarsman",voice:"ishmael",tint:"#6d8aa6"},ahab:{name:"Captain Ahab",role:"Master of the Pequod",voice:"ahab",tint:"#3c3c46"},starbuck:{name:"Starbuck",role:"Chief mate",voice:"starbuck",tint:"#8a2f2a"},stubb:{name:"Stubb",role:"Second mate",voice:"stubb",tint:"#2f4a6b"},flask:{name:"Flask",role:"Third mate",voice:"flask",tint:"#5c6b3a"},queequeg:{name:"Queequeg",role:"Harpooneer",voice:"queequeg",tint:"#7a4d33"},boomer:{name:"Captain Boomer",role:"Of the Samuel Enderby",voice:"boomer",tint:"#9c7a3c"},gabriel:{name:"Gabriel",role:"A prophet of the Jeroboam",voice:"gabriel",tint:"#4b3b5c"},pip:{name:"Pip",role:"Ship-keeper",voice:"pip",tint:"#3a5a5a"},crew:{name:"The Crew",role:"",voice:"crew",tint:"#7a6a4f"},rival:{name:"Rival Mate",role:"",voice:"stubb",tint:"#444"}},CODEX=[{id:"sperm",title:"The Cachalot",kind:"Folio",text:"Of all the folio whales, the Sperm Whale is the largest in bulk and the most formidable in fight, and the most valuable in commerce; his head a great blind bluff, his jaw a slender ivory saw. He spouts slantingly forward, in one bushy jet, which is how the man at the mast-head knows him from all his cousins."},{id:"bull",title:"The Old Bull",kind:"Folio",text:"An aged bull goes solitary, as old kings will, and grows wise in the ways of boats. He does not always run. Sometimes he turns, and that is a thing the boat-header remembers for the rest of his days, if he is let to have any."},{id:"right",title:"The Right Whale",kind:"Folio",text:"So called because he is the right whale to hunt: slow, fat, and given to floating when killed. He has no teeth but a vast curtain of whalebone, and on his head a crusted bonnet, which the sailors liken to a crown, or to a barnacled roof, as their mood inclines."},{id:"calf",title:"The Calves",kind:"Duodecimo",text:"In the nursery of the herd the young keep close beside their mothers, and look up at you from the water with the mild unwonted curiosity of a thing that has never yet been afraid. No decent boat strikes a calf. The law says nothing; the stomach says enough."},{id:"porpoise",title:"The Huzza Porpoise",kind:"Duodecimo",text:"The common porpoise, found almost all over the globe; always in hilarious shoals, which upon the broad sea keep tossing themselves to heaven like caps in a Fourth-of-July crowd. Their appearance is generally hailed with delight by the mariner. Do not lower for them; it is beneath you, and they are faster."},{id:"moby",title:"Mopey Dick",kind:"Folio, and then some",text:"A white whale, wrinkled of brow and crooked of jaw, with a hump like a snow-hill, and old irons rusting in his flanks. Sailors say he is ubiquitous, and immortal, and malicious. Those who have heard him sing say something stranger still: that he is only very, very sad."},{id:"fastloose",title:"Fast-Fish and Loose-Fish",kind:"Law",text:"I. A Fast-Fish belongs to the party fast to it. II. A Loose-Fish is fair game for anybody who can soonest catch it. Thus the whole code of the fishery, which a man may learn in a breath and argue about for a lifetime. Cut your line, and your whale is any man’s."},{id:"line",title:"The Line",kind:"Gear",text:"Two hundred fathoms of hemp coiled in a tub amidships, run aft to the loggerhead, then forward the whole length of the boat. When the whale runs, it whips through the boat so swift that it smokes in the groove, and must be wetted, or it will burn. Sit wrong of it and it will take your leg along."},{id:"lance",title:"The Lance",kind:"Gear",text:"The harpoon only fastens; it is the lance that kills, darted again and again by the mate when the boat is hauled close upon the tired whale. Feel for the life; it is a thing a man finds by the rhythm of the beast, as a smith finds the heat of his iron."},{id:"waif",title:"The Waif",kind:"Gear",text:"A pole with a little flag at its end, planted upright in a dead whale, to say to all the world: this one is ours. A waif is respected the ocean over, by all but the dishonest, and the dishonest are many."},{id:"gallied",title:"Gallied",kind:"Usage",text:"A very old Saxon word, still in use among whalemen, meaning flurried and frightened. A gallied whale runs, or sounds, and is not seen again by that boat that day. Rowing hard is loud. Paddling soft is quiet. A sail is quietest of all."},{id:"hearken",title:"Hearkening",kind:"Usage",text:"The old harpooneers will tell you, if you give them tobacco, that every whale has a song, and that a crew that stills its oars and hums it back will find the whale grown easy, and near, and strangely willing. Queequeg believes it. Stubb pretends not to."},{id:"trywork",title:"The Try-Works",kind:"Ship",text:"Amidships stands the brick furnace where the blubber is boiled into oil, night and day, until the whole ship seems a burning thing, and the smoke is horrible to inhale. Every barrel is a share of every man’s lay. It is the reason, if reasons are wanted, for all the rest."},{id:"doubloon",title:"The Doubloon",kind:"Ship",text:"Nailed to the mainmast, an Ecuadorian ounce of gold, promised by Ahab to whosoever first raises a white-headed whale with a wrinkled brow and a crooked jaw. Each man who passes it reads it differently, as each man reads the sea."},{id:"gam",title:"The Gam",kind:"Usage",text:"A social meeting of two or more whale-ships, generally on a cruising-ground; when, after exchanging hails, they exchange visits by boats’ crews, and news, and tobacco, and lies, and sometimes, if the captains are agreeable, a fine dinner."},{id:"squid",title:"The Squid",kind:"Omen",text:"A vast pulpy mass, furlongs in length, of a glancing cream-colour, lay floating on the water, innumerable long arms radiating from its centre. Few whale-ships ever beheld it and returned into their ports to tell of it. Starbuck, seeing it, wished it had been the White Whale instead."},{id:"corpusants",title:"The Candles",kind:"Omen",text:"In a typhoon the yard-arms take fire with a pale flame, three tapering white flames on every mast, which the sailors call corpusants and take for the spirits of drowned men. They are harmless. That is the worst thing about them."},{id:"ambergris",title:"Ambergris",kind:"Treasure",text:"Who would think that such fine ladies and gentlemen should regale themselves with an essence found in the inglorious bowels of a sick whale! Yet so it is. It floats, it is grey and waxy, it smells of nothing and then of everything, and it is worth a guinea an ounce."},{id:"coffin",title:"Queequeg's Coffin",kind:"Relic",text:"Made for a fever that passed, then made into a sea-chest, then caulked and pitched into a life-buoy, with the hieroglyphics of his tattooing carved upon its lid: a complete theory of the heavens and the earth, which he himself could not read."},{id:"iron",title:"An Old Iron",kind:"Relic",text:"A harpoon-head rusted to the colour of dried blood, its shank bent like a question. Some boat struck the White Whale with it, long ago, and lost it, and him. The mark on the socket is from a Nantucket smith who died in ’41."}],CODEX_BY_ID=Object.fromEntries(CODEX.map((c)=>[c.id,c])),SAYINGS=["Better to sleep with a sober cannibal than a drunken Christian.","There is a wisdom that is woe; and there is a woe that is madness.","A whale-ship was my Yale College and my Harvard.","Paddle soft. The whale hears a rowing boat a mile off, and a paddling one hardly at all.","Wet the line when it smokes, or it will burn through and your whale is a Loose-Fish.","Keep her bow on the line when fast. A boat dragged broadside is a boat upset.","Hold the hea or, The Whale, by Herman Melville (1851). Public domain."],["Game","Mopey Dick; or, The Melancholy Whale. Title drawn by a cryptographic RNG (Python secrets) from 50 brainstormed riffs on the book’s name."],["Genre and Perspective","Naval whaling action-adventure: a four-chapter story campaign, a versus party mode (A Gam), and online play. Main view: third-person Chase camera (three.js PerspectiveCamera). Switch with R3 / V to a first-person Bow view or an orthographic top-down Chart view (OrthographicCamera); the story adds a first-person Mast-Head view."],["Tech","three.js r180 (WebGPURenderer: WebGPU with its automatic WebGL 2 fallback; TSL node materials; PostProcessing with BloomNode), Rapier 0.19.3 (@dimforge/rapier3d-compat) for boats, irons, collisions and buoyancy forces, Web Audio API, Gamepad API, PeerJS 1.5.4 for Gam Online, AI Hub session client 1.3.0. Bundled with Bun 1.3.14; libraries load from the jsDelivr CDN."],["Art Direction","Engine-native three.js look: physically based materials, procedural geometry, a Gerstner-wave ocean and procedural sky written in TSL, real-time shadows, fog, bloom and a vignette."],["Animation","Engine-native: THREE.AnimationMixer playing AnimationClips (quaternion and vector keyframe tracks) on skinned whales (SkinnedMesh bone chains), rowing crews, oars, sails and albatross wings, cross-faded by state; simulation-driven motion on top."],["Audio","All code-written with Web Audio: a small tracker playing original shanty-style tunes on synthesized concertina, fiddle, whistle, bass, bodhrán, bells and choir; synthesized effects (oars, spouts, the running line, thunder, breaches, bells); an ocean, wind and rain bed; whale-song notes; Animalese-style gibberish voices with a timbre per character."],["Online","AI Hub Session Protocol v1 in versus mode (the host runs whales and score; each copy steers its own boat; 15 Hz snapshots with interpolation; standings, stats and awards; server-hosted rounds). Standalone: Gam Online over PeerJS (four-letter room code, host relays, clock sync). No chat, no custom names."],["Testing","Chromium 153 through Playwright. Software rendering (SwiftShader) for most runs, plus the real GPU, an NVIDIA RTX 4070 SUPER: WebGPU in headless Windows Chrome 156 (144 fps, 95th-percentile frame 7 ms) and WebGL 2 through ANGLE/D3D12 at 1920x1080 (steady 60 fps). Audio recorded from the game’s own output and measured (voice pitch and syllables, musical key, effects), with WAVs kept for listening. build checks, physics traces, an autopilot that plays every story chapter and both endings, AI-vs-AI gams, UI and touch-device screenshots, a two-page PeerJS online test, and the AI Hub harness (1, 2, 3 and 4 players, bad network, host leaving, server-hosted). No human play-test; no physical controller (keyboard and emulated input only); a 39-point feature checklist (tools/features.py) covers TASK.md item by item."],["Research","No web research. Read the AI Hub protocol README, harness and arena example from the ai-hub repository, and the three.js r180 and Rapier 0.19.3 packages for API details. The book from memory."],["Environment","Claude Code CLI (headless); Linux (Ubuntu on WSL2); browser unknown (the player’s browser; tested in Chromium 153 headless)."],["Model","Anthropic, claude-opus-5-5, reasoning effort xhigh."],["Usage","Estimate from this session’s transcript, priced at Claude Opus 5.5 list rates ($4 input, $20 output, $0.20 cache read, $8 one-hour cache write per million tokens): about $45 USD for about 136 M tokens (134.2 M cache reads, 0.85 M cache writes, 0.58 M output, under 0.001 M uncached input) over 245 API calls up to 21:44. Session time about 3 h 1 min (18:43 to 21:44)."]],testing:[["Issues caught by testing","36, counted from the session’s test log (tools/TESTLOG.md): physics (torques never reset, sinking buoyancy), story scripts that stalled (steps done out of order, the gam ship’s collider left at the origin, an uncatchable White Whale, a ship-ram that never reached the ship), AI Hub conformance (late hello, late ready, a world that stalled when frames were slow), a lost PeerJS welcome, audio-node overload, and UI and visual faults."],["Critical or game-breaking","12: the two physics faults, the five story stalls (including Ahab’s crew able to spawn under the ship’s hull), the three hub-session failures, the audio overload that stalled the page, and the online join."],["Most helpful test","The autopilot play-through of every chapter: a computer crew plays the story with the real game loop, and it found all four story-breaking stalls."],["Least helpful test","Early screenshots taken on wall-clock waits: the idle timer would start the attract demo, or the camera had not settled, so the pictures misled more than they showed."]],engine:[["Liked most","TSL. The Gerstner ocean is written once as JavaScript-shaped shader code that matches the CPU wave function driving buoyancy, and the same materials run on WebGL 2 when WebGPU is missing."],["Stuck or guessed wrong","Rapier’s resetForces does not clear torques, so buoyancy torques piled up and launched the boat until resetTorques was added. I also had to read the r180 source to learn that material.normalNode is in view space."],["Most important thing built","One sea for physics and pictures: a CPU Gerstner model matching the TSL one, Rapier buoyancy and tow-line forces on top, and a host-run whale simulation that every mode (story, gam, hub, online, demo) shares."],["Hardest part","Checking a WebGPU game headlessly: blank WebGPU screenshots, seconds-long shader compiles in software rendering, and slow frames that starved a requestAnimationFrame-only loop."],["Remove or overhaul","Rapier JS’s persistent-force model (add, step, remember to reset forces and torques separately). A per-step impulse API would have avoided the worst bug."],["Change one thing","three.js should ship a documented way to precompile node materials for a scene before the first frame, so a game can be ready without a long first-render stall."]],prompt:[["Liked most","A free choice of book and genre, a fixed tech stack, and an AI Hub harness that checks the multiplayer for real."],["Confusing",'The source slot was left literal ("a spiritual successor to Pick a famous book"). "Multiplayer … as well as for the game on its own" could mean the hub only or standalone multiplayer too, so both were built. "Engine native style" is vague for three.js, a library with no house style. Cost and token usage are not visible to the agent.'],["Hardest","Making the book’s voice and its whaling into game mechanics (the line, the law of Fast-Fish and Loose-Fish, the gam, the three-day chase) while keeping every feature finished and verified without a human player."],["One test I wish I could run","A real hub session on real hardware: four friends with DualSense controllers and GPUs, timed from load to the final bell."]]},esc2=(s)=>String(s).replace(/[&<>]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;"})[c]),sec=(title,rows)=>`<div class="sec">${esc2(title)}</div><ul>${rows.map(([k,v2])=>`<li><b>${esc2(k)}:</b> ${esc2(v2)}</li>`).join("")}</ul>`;var ABOUT={html:`${sec("Source Information",INFO.source)}${sec("Testing",INFO.testing)}${sec("Engine Feedback",INFO.engine)}${sec("Prompt Feedback",INFO.prompt)}${`<div class="sec">Credits</div><ul>
