// ---- Persistent save (localStorage, failure tolerant) ----
const SAVE_KEY = 'crash-bandicute-save-v1';

  unlocked: 1, cleared: {}, gems: {}, relics: {}, best: {}, seenIntro: false,
  settings: { master: 0.8, music: 0.6, sfx: 0.85, shake: true, rumble: true, hud: 'auto', assist: false, hints: true },

  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { const d = JSON.parse(raw); SAVE = Object.assign(defaultSave(), d); SAVE.settings = Object.assign(defaultSave().settings, d.settings || {}); }

}

function hasProgress() { return SAVE.unlocked > 1 || Object.keys(SAVE.cleared).length > 0; }

function fmtTime(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${m}:${s < 10 ? '0' : ''}${s.toFixed(2)}`;

// ---- 01_audio.js ----
// ===== Audio: procedural Web Audio music + SFX =====
const AudioSys = (() => {
  let ctx = null, master, musicBus, sfxBus, noiseBuf, comp;
  let track = null, trackName = '', nextT = 0, step = 0, timer = null, melody = null;

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return ctx; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    master = ctx.createGain(); musicBus = ctx.createGain(); sfxBus = ctx.createGain();
    musicBus.connect(master); sfxBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applyVolumes();
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function applyVolumes() {
    if (!ctx) return; const s = SAVE.settings;
    master.gain.value = s.master; musicBus.gain.value = s.music * 0.55; sfxBus.gain.value = s.sfx;
  }
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function env(g, t, a, peak, dur, rel = 0.05) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);

function playerStep(dt) {

  const speedH = Math.hypot(s.vel.x, s.vel.z);

  if (crouchPressed && s.grounded && speedH > 4 && s.slideT <= 0) { s.slideT = 0.5; const d = speedH > 0.1 ? V3(s.vel.x, 0, s.vel.z).normalize() : V3(Math.sin(s.yaw), 0, Math.cos(s.yaw)); s.slideDir = d; AudioSys.sfx('slide'); spawnDust(s.pos, 6); }

function crateUnderfoot() {

      else if (c.type === 'tnt') { if (c.fuse < 0) { c.fuse = 3; AudioSys.sfx('tick'); } }

function attackChecks() {

  for (const c of W.crates) {

    const dx = c.x - cx, dz = c.z - cz, d = Math.hypot(dx, dz);
    const vOver = s.pos.y < c.y + 1.05 && s.pos.y + 1.7 > c.y;
    if (!vOver) continue;
    if (c.type === 'nitro' && Math.abs(dx) < 0.95 && Math.abs(dz) < 0.95) { explodeCrate(c); continue; }
    if ((spinning && d < 1.35) || (sliding && d < 1.15)) hitCrate(c, spinning ? 'spin' : 'slide');
  }
  // wumpa
  for (const w of W.wumpas) {

    if (Math.abs(w.x - cx) < 0.8 && Math.abs(w.z - cz) < 0.8 && Math.abs(w.mesh.position.y - (s.pos.y + 0.75)) < 1.0) { w.got = true; w.mesh.visible = false; addWumpa(1, w.mesh.position); }

      if (e.type === 'turtle' && e.state === 'flipped') { s.vy = 16.5; s.bounceLock = 0.25; s.jumpHeld = Input.held('jump'); AudioSys.sfx('bounce'); e.squish = 1; continue; }
      if (e.type === 'turtle') { e.state = 'flipped'; e.timer = 6; s.vy = 12; s.bounceLock = 0.25; AudioSys.sfx('stomp'); continue; }

    }

    if (d < e.r + 0.3 && (e.type !== 'turtle' || e.state !== 'flipped')) {

    }
  }
  // hazards
  for (const h of W.hazards) {

    if (h.type === 'spikes' && h.up > 0.6 && Math.abs(h.x - cx) < h.w / 2 + 0.2 && Math.abs(h.z - cz) < h.d / 2 + 0.2 && s.pos.y < h.y + 0.55 && s.pos.y > h.y - 0.3) hurtPlayer('spike', V3(h.x, h.y, h.z));

function crateStep(dt) {

function fxStep(dt) {

// ---------- Hazards & movers ----------
function hazardStep(dt) {
  for (const m of W.movers) updateMover(m, W.time);
  for (const h of W.hazards) {
    const ph = ((W.time + h.phase) % h.period) / h.period;
    if (h.type === 'fire') {
      const st = ph < 0.45 ? 'idle' : ph < 0.6 ? 'warn' : 'on';
      h.state = st;
      if (st === 'on' && h.lastState !== 'on' && Math.hypot(h.x - P.pos.x, h.z - P.pos.z) < 14) AudioSys.sfx('fire');
      h.lastState = st;
      h.flame.visible = st !== 'idle';
      const s = st === 'warn' ? 0.25 : 1;
      h.flame.scale.set(s * (1 + Math.sin(W.time * 30) * 0.08), s, s * (1 + Math.cos(W.time * 27) * 0.08));
      h.light.intensity = st === 'on' ? 25 + Math.sin(W.time * 40) * 6 : st === 'warn' ? 6 : 0;
    } else if (h.type === 'spikes') {
      const target = ph > 0.55 ? 1 : 0;
      if (target && h.up < 0.05 && Math.hypot(h.x - P.pos.x, h.z - P.pos.z) < 10) AudioSys.sfx('stomp');
      h.up = damp(h.up, target, target ? 30 : 8, dt);
      h.sp.position.y = -0.6 + h.up * 0.6;

  if (W.boulder) boulderStep(dt);
}
function boulderStep(dt) {

  if (!b.active) { b.delay -= dt; if (b.delay <= 0 && P.state === 'play') { b.active = true; if (!W.attract) UI.toast('RUN!'); AudioSys.sfx('rumble'); } }
  else if (P.state === 'play') {
    const gap = P.pos.z - b.z;
    const base = SAVE.settings.assist ? 6.6 : 7.3;
    const sp = base + clamp((gap - 9) * 0.45, 0, 7);
    if (b.z < b.endZ) { b.z += sp * dt; b.rot += sp * dt / b.r; }
    else { b.y -= dt * 8; if (b.y < -20) { b.active = false; b.mesh.visible = false; } }
    b.rumbleT = (b.rumbleT || 0) - dt; if (b.rumbleT <= 0) { b.rumbleT = 0.9; AudioSys.sfx('rumble'); }
    W.shake = Math.max(W.shake, clamp(0.25 - gap * 0.012, 0.03, 0.2));

}

const CAM = { pos: V3(0, 5, 10), look: V3(), y: 0, inited: false };
function currentZone(p) {
  for (const z of W.zones) if (p.x >= z.x0 && p.x <= z.x1 && p.z >= z.z0 && p.z <= z.z1) return z;
  return W.zones[0];
}
function cameraStep(dt, snap = false) {
  const p = P.pos, z = currentZone(p) || { mode: 'corridor' };
  W.zoneMode = z.mode;
  const groundY = P.state === 'dead' && P.deathKind === 'fall' ? P.lastGroundY : (P.grounded || p.y < CAM.y ? p.y : Math.min(p.y, CAM.y + Math.max(0, p.y - CAM.y - 2.0)));
  CAM.y = snap ? groundY : damp(CAM.y, groundY, 3, dt);
  let pos, look;
  const cy = CAM.y;
  if (z.mode === 'side') { pos = V3(p.x + 2, cy + 3.4, (z.zc ?? (z.z0 + z.z1) / 2) + 13); look = V3(p.x + 2, cy + 1.3, z.zc ?? (z.z0 + z.z1) / 2); }
  else if (z.mode === 'chase') { pos = V3(p.x * 0.45, cy + 3.9, p.z + 8.2); look = V3(p.x * 0.5, cy + 0.9, p.z - 6); }
  else if (z.mode === 'arena') { pos = V3(p.x * 0.45, 12.5, p.z * 0.45 + 17); look = V3(p.x * 0.6, 0.6, p.z * 0.6 - 1.5); }
  else { const cx = z.cx ?? p.x; pos = V3(lerp(cx, p.x, 0.55), cy + 4.7, p.z + 9.0); look = V3(lerp(cx, p.x, 0.75), cy + 1.0, p.z - 5); }
  if (snap || !CAM.inited) { CAM.pos.copy(pos); CAM.look.copy(look); CAM.inited = true; }
  else { CAM.pos.x = damp(CAM.pos.x, pos.x, 4, dt); CAM.pos.y = damp(CAM.pos.y, pos.y, 4, dt); CAM.pos.z = damp(CAM.pos.z, pos.z, 6, dt); CAM.look.lerp(look, 1 - Math.exp(-6 * dt)); }
  const cam = GFX.camera; cam.position.copy(CAM.pos);
  W.shake = Math.max(0, W.shake - dt);
  if (W.shake > 0 && SAVE.settings.shake) cam.position.add(V3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(W.shake * 0.5));
  cam.lookAt(CAM.look);

}

  clearProjectiles() {
    for (const o of this.orbs) W.group.remove(o.mesh);
    for (const b of this.bombs) { W.group.remove(b.mesh); W.group.remove(b.marker); }
    for (const r of this.rings) W.group.remove(r.mesh);
    this.orbs = []; this.bombs = []; this.rings = [];
  },
  plan() {
    const p = this.phase;
    const seq = p === 1 ? ['orbs', 'bombs', 'orbs'] : p === 2 ? ['orbs', 'shock', 'bombs', 'orbs'] : ['bombs', 'orbs', 'shock', 'orbs', 'shock'];
    this.queue = seq.slice();
  },
  spawnMinions(n) {
    for (let i = 0; i < n; i++) { const a = rand(0, TAU); const e = B.enemy('crab', Math.cos(a) * 8, 0, Math.sin(a) * 8 - 2, {}); e.minion = true; this.minions.push(e); spawnRing(e.mesh.position, 1.5, 0xff5050); }
  },
  restockCrates() {
    if (!W.crates.some((c) => c.type === 'mask' && !c.broken)) {
      const c = W.crates.find((c) => c.type === 'mask');
      if (c) { c.broken = false; c.y = 0; c.mesh.visible = true; c.mesh.position.set(c.x, 0.5, c.z); addCrateBody(c); W.broken = Math.max(0, W.broken - 1); }
    }
  },
  muzzle() { const c = this.mesh.getObjectByName(Math.random() < 0.5 ? 'canL' : 'canR'); const v = V3(); c.getWorldPosition(v); return v; },
  step(dt) {
    this.t += dt; this.stateT -= dt;
    const m = this.mesh;
    // hover motion along the back arc
    if (this.state !== 'dying' && this.state !== 'dead') {
      this.a = Math.sin(this.t * (0.25 + this.phase * 0.07)) * 1.1;
      const R = this.state === 'stagger' ? 11 : 14;
      const tgt = V3(Math.sin(this.a) * R, (this.state === 'stagger' ? 3.2 : 5) + Math.sin(this.t * 2) * 0.35, -Math.cos(this.a) * R);
      this.pos.lerp(tgt, 1 - Math.exp(-2.5 * dt));
      m.position.copy(this.pos);
      m.rotation.y = Math.atan2(P.pos.x - this.pos.x, P.pos.z - this.pos.z);
      m.rotation.z = this.state === 'stagger' ? Math.sin(this.t * 25) * 0.25 : Math.sin(this.t * 1.7) * 0.06;
      const pilot = m.getObjectByName('pilot');
      pilot.rotation.y = Math.sin(this.t * 3) * 0.2;
      m.getObjectByName('armL').rotation.x = Math.sin(this.t * 6) * 0.5; m.getObjectByName('armR').rotation.x = -Math.sin(this.t * 6) * 0.5;
      m.getObjectByName('flame').scale.y = 1 + Math.sin(this.t * 30) * 0.2;
    }
    if (W.coils) W.coils.forEach((c, i) => c.scale.setScalar(0.9 + Math.sin(this.t * 9 + i) * 0.12));
    this.hurtT = Math.max(0, this.hurtT - dt);
    m.visible = !(this.hurtT > 0 && Math.floor(this.hurtT * 20) % 2 === 0);
    switch (this.state) {
      case 'intro':
        if (this.stateT < -0.01 && this.t > 0.2 && !this.introShown) { this.introShown = true; this.stateT = 2.4; if (!W.attract) UI.toast('PROFESSOR GRUMBOLT', '“You’ll never get my Sun Gems, you fuzzy pest!”'); }
        else if (this.introShown && this.stateT <= 0) { this.state = 'idle'; this.stateT = 0.8; }
        break;
      case 'idle':
        if (this.stateT <= 0) {
          if (!this.queue.length) this.plan();
          const atk = this.queue.shift();
          this.startAttack(atk);
        }
        break;
      case 'orbs':
        if (this.stateT <= 0 && this.left > 0) {
          this.left--; this.stateT = this.phase === 3 ? 0.55 : this.phase === 2 ? 0.7 : 0.85;
          const green = this.left === 0 || this.left % 3 === 1;
          this.fireOrb(green);
        } else if (this.left <= 0 && this.stateT <= 0) { this.state = 'idle'; this.stateT = 1.2; }
        break;
      case 'bombs':
        if (this.stateT <= 0 && this.left > 0) { this.left--; this.stateT = 0.35; this.lobBomb(); }
        else if (this.left <= 0 && this.stateT <= 0) { this.state = 'idle'; this.stateT = 1.6; }
        break;
      case 'shock':
        if (this.stateT <= 0 && this.left > 0) { this.left--; this.stateT = 1.2; this.rings.push(this.makeRing()); AudioSys.sfx('shock'); W.shake = 0.3; }
        else if (this.left <= 0 && this.stateT <= 0) { this.state = 'idle'; this.stateT = 1.0; }
        break;
      case 'stagger':
        if (this.stateT <= 0) { this.state = 'idle'; this.stateT = 0.8; }
        break;
      case 'dying':
        m.position.y -= dt * 1.2; m.rotation.z += dt * 2; m.rotation.x += dt * 0.7;
        if (Math.random() < dt * 10) { const p = this.pos.clone().add(V3(rand(-1.5, 1.5), rand(-1, 1.5), rand(-1.5, 1.5))); spawnBlast(p, 0xffa030); AudioSys.sfx('explode'); W.shake = 0.4; }
        this.pos.copy(m.position);
        if (this.stateT <= 0) { this.state = 'dead'; m.visible = false; spawnBlast(this.pos.clone(), 0xfff0a0); W.shake = 0.8; Input.rumble(1, 1, 600); UI.bossBar(false); Boss.victory(); }
        break;
    }
    this.stepProjectiles(dt);
  },
  startAttack(atk) {
    this.state = atk; this.stateT = 0.4;
    if (atk === 'orbs') this.left = 4 + this.phase;
    if (atk === 'bombs') { this.left = 1 + this.phase * 2; AudioSys.sfx('bomb'); }
    if (atk === 'shock') this.left = this.phase >= 3 ? 2 : 1;
  },
  fireOrb(green) {
    const from = this.muzzle();
    const to = V3(P.pos.x, P.pos.y + 0.9, P.pos.z);
    const sp = 6.5 + this.phase * 1.6;
    const vel = to.sub(from).normalize().multiplyScalar(sp);
    const mesh = new THREE.Mesh(GEO.sphere, green ? FXM.orbGreen : FXM.orbRed); mesh.scale.setScalar(green ? 0.42 : 0.36); mesh.position.copy(from); W.group.add(mesh);
    this.orbs.push({ mesh, vel, green, reflected: false, t: 0 });
    AudioSys.sfx('orb');
  },
  lobBomb() {
    const from = this.muzzle();
    const to = V3(P.pos.x + rand(-1.8, 1.8), 0, P.pos.z + rand(-1.8, 1.8));
    if (Math.hypot(to.x, to.z) > 11) to.setLength(10.5).setY(0);
    const mesh = new THREE.Mesh(GEO.sphere, FXM.bomb); mesh.scale.setScalar(0.38); W.group.add(mesh);
    part(GEO.cyl, toon(0xffd23f), 0.06, 0.25, 0.06, 0, 1.05, 0, mesh, false);
    const marker = new THREE.Mesh(GEO.ring, FXM.target); marker.rotation.x = Math.PI / 2; marker.position.set(to.x, 0.06, to.z); marker.scale.setScalar(1.6); W.group.add(marker);
    this.bombs.push({ mesh, marker, from, to, t: 0, dur: 1.35 - this.phase * 0.1 });
  },
  makeRing() {
    const mesh = new THREE.Mesh(new THREE.TorusGeometry(1, 0.22, 8, 64), FXM.shock); mesh.geometry.userData.own = true;
    mesh.rotation.x = Math.PI / 2; mesh.position.set(0, 0.3, 0); W.group.add(mesh);
    return { mesh, r: 1, sp: 5.5 + this.phase };
  },
  stepProjectiles(dt) {
    const pc = V3(P.pos.x, P.pos.y + 0.9, P.pos.z);
    for (let i = this.orbs.length - 1; i >= 0; i--) {
      const o = this.orbs[i]; if (!o) continue; o.t += dt;
      if (o.reflected) { const to = this.pos.clone().sub(o.mesh.position); const d = to.length(); o.vel.lerp(to.normalize().multiplyScalar(18), 1 - Math.exp(-6 * dt)); if (d < 1.9) { this.hit(); W.group.remove(o.mesh); this.orbs.splice(i, 1); continue; } }
      o.mesh.position.addScaledVector(o.vel, dt);
      o.mesh.rotation.y += dt * 6;
      const dist = o.mesh.position.distanceTo(pc);
      if (!o.reflected && P.spinT > 0 && dist < 1.7) {
        if (o.green) { o.reflected = true; AudioSys.sfx('reflect'); spawnSpark(o.mesh.position.clone(), 0x9fff9f, 10); Input.rumble(0.5, 0.5, 100); continue; }
      }
      if (!o.reflected && dist < 0.65) { hurtPlayer('enemy', o.mesh.position); W.group.remove(o.mesh); this.orbs.splice(i, 1); continue; }
      if (o.t > 6 || o.mesh.position.y < -3) { W.group.remove(o.mesh); this.orbs.splice(i, 1); }
    }
    for (let i = this.bombs.length - 1; i >= 0; i--) {
      const b = this.bombs[i]; if (!b) continue; b.t += dt; const k = Math.min(1, b.t / b.dur);
      b.mesh.position.lerpVectors(b.from, b.to, k); b.mesh.position.y += Math.sin(k * Math.PI) * 6;
      b.marker.scale.setScalar(1.6 - k * 0.6 + Math.sin(b.t * 20) * 0.06);
      if (k >= 1) { W.group.remove(b.mesh); W.group.remove(b.marker); this.bombs.splice(i, 1); explosion(b.to.clone().setY(0.5), 0xffa030, 2.0); }
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i]; if (!r) continue; r.r += r.sp * dt; r.mesh.scale.set(r.r, r.r, 1);
      const pd = Math.hypot(P.pos.x, P.pos.z);
      if (Math.abs(pd - r.r) < 0.45 && P.pos.y < 0.55 && P.state === 'play') hurtPlayer('enemy', V3(0, 0, 0));
      if (r.r > 13) { W.group.remove(r.mesh); this.rings.splice(i, 1); }
    }
  },
  hit() {
    if (this.state === 'dying' || this.state === 'dead') return;
    this.hp--; this.hurtT = 1.0; AudioSys.sfx('bosshit'); W.shake = 0.45; Input.rumble(0.8, 0.6, 250);
    spawnBlast(this.pos.clone(), 0x9fff9f);
    UI.bossBar(true, this.hp / this.max);
    if (this.hp <= 0) { this.state = 'dying'; this.stateT = 3; this.clearProjectiles(); for (const m of this.minions) defeatEnemy(m, 'kick'); if (!W.attract) UI.toast('GOTCHA!'); return; }
    this.state = 'stagger'; this.stateT = 1.4; this.queue = [];
    const np = this.hp > 4 ? 1 : this.hp > 2 ? 2 : 3;
    if (np !== this.phase) {
      this.phase = np; this.phaseStartHp = this.hp; this.clearProjectiles();
      if (!W.attract) UI.toast(np === 2 ? 'HE’S ANGRY!' : 'FINAL PHASE!', np === 2 ? 'Minions incoming — and watch for shockwaves' : 'Faster orbs, double shockwaves!');
      this.spawnMinions(np); this.restockCrates();
      W.checkpoint = { pos: V3(0, 0, 7) };
    }
  },
  victory() {
    if (W.attract) { later(1500, () => Game.attractNext()); return; }
    W.done = true; P.state = 'warp'; P.warpT = -2;
    AudioSys.stopMusic(); later(300, () => AudioSys.sfx('clear'));
    later(2600, () => Game.finishLevel());
  },
};

// ===== UI: 10-foot, controller-first menus + HUD =====
const UI = (() => {
  const screens = ['s-boot', 's-title', 's-map', 's-pause', 's-settings', 's-controls', 's-about', 's-results', 's-story', 's-gameover', 's-msg'];
  let active = null, stack = [], items = [], focus = 0, onBack = null, menuEl = null, mapSel = 0, toastT = 0, tipT = 0, storyNext = null, hintsFor = '';
  const hudTimers = { wumpa: 0, crates: 0, lives: 0, masks: 0 };

  function show(id) { for (const s of screens) $('#' + s).classList.toggle('on', s === id); active = id; }
  function hideAll() { for (const s of screens) $('#' + s).classList.remove('on'); active = null; }

  function buildMenu(el, list, back) {
    menuEl = el; items = list; focus = Math.max(0, list.findIndex((i) => !i.disabled)); onBack = back;
    el.innerHTML = '';
    list.forEach((it, i) => {
      const d = document.createElement('div'); d.className = 'mi' + (it.disabled ? ' disabled' : ''); it.el = d;
      d.addEventListener('mouseenter', () => { if (!it.disabled && focus !== i) { focus = i; refresh(); AudioSys.sfx('move'); } });
      d.addEventListener('click', (e) => {
        if (it.disabled) return; focus = i;
        if (it.type === 'slider' || it.type === 'choice' || it.type === 'toggle') { const r = d.getBoundingClientRect(); adjust(it, e.clientX < r.left + r.width / 3 ? -1 : 1); }
        else activate(it);
        refresh(); Input.resetIdle();
      });
      el.appendChild(d);
    });
    refresh();
  }
  function itemHTML(it) {
    if (it.type === 'slider') { const v = it.get(); return `${it.label}<span class="val">${Math.round(v * 100)}%<span class="bar"><i style="width:${v * 100}%"></i></span></span>`; }
    if (it.type === 'toggle') return `${it.label}<span class="val">${it.get() ? 'ON' : 'OFF'}</span>`;
    if (it.type === 'choice') return `${it.label}<span class="val">‹ ${it.get()} ›</span>`;
    return it.label;
  }
  function refresh() { items.forEach((it, i) => { it.el.innerHTML = itemHTML(it); it.el.classList.toggle('focus', i === focus); }); }
  function adjust(it, d) {
    if (it.type === 'slider') { it.set(clamp(Math.round((it.get() + d * 0.1) * 10) / 10, 0, 1)); AudioSys.sfx('move'); }
    else if (it.type === 'toggle') { it.set(!it.get()); AudioSys.sfx('move'); }
    else if (it.type === 'choice') { it.set(d); AudioSys.sfx('move'); }
    refresh();
  }
  function activate(it) {
    if (it.type === 'toggle' || it.type === 'choice') { adjust(it, 1); return; }
    AudioSys.sfx('ok'); it.act && it.act();
  }

  function setHints(list) {
    const key = Input.device + list.join('|'); if (key === hintsFor) return; hintsFor = key;
    $('#hints').innerHTML = list.map((h) => { const [a, t] = h.split(':'); return `<span class="h">${glyph(a)} ${t}</span>`; }).join('');
  }
  function fillTokens(t) { return t.replace(/\{(\w+)\}/g, (_, a) => glyph(a)); }

  // ----- screens -----
  function title() {
    show('s-title'); stack = [];
    const list = [];
    if (hasProgress()) list.push({ label: 'Continue', act: () => Game.toMap() });
    list.push({ label: hasProgress() ? 'New Adventure' : 'Start Adventure', act: () => { if (hasProgress()) confirmNew(); else Game.newGame(); } });
    list.push({ label: 'Settings', act: () => push(settings) });
    list.push({ label: 'Controls', act: () => push(controls) });
    list.push({ label: 'About & Credits', act: () => push(about) });
    buildMenu($('#m-title'), list, null);
    setHints(['nav:Select', 'ok:Confirm']);
  }
  function confirmNew() {
    message('NEW ADVENTURE?', 'This erases your saved gems, relics and progress.', [{ label: 'Erase & start', act: () => { const s = SAVE.settings; SAVE = defaultSave(); SAVE.settings = s; writeSave(); Game.newGame(); } }, { label: 'Cancel', act: () => title() }], () => title());
  }
  function message(t, body, list, back) { show('s-msg'); $('#msgtitle').textContent = t; $('#msg').innerHTML = body; buildMenu($('#m-msg'), list, back); setHints(['nav:Select', 'ok:Confirm', 'back:Back']); }
  function push(fn) { stack.push({ id: active, items, focus, onBack, menuEl, hints: hintsFor }); fn(); }
  function pop() {
    const s = stack.pop(); if (!s) return;
    show(s.id); items = s.items; focus = s.focus; onBack = s.onBack; menuEl = s.menuEl; hintsFor = '';
    if (s.id === 's-title') title(); else if (s.id === 's-pause') pause(); else if (s.id === 's-map') map(); else if (s.id === 's-msg' && touchBlock.on) touchBlocked(); else refresh();
  }
  function settings() {

  function controls() {

    $('#ctrlgrid').innerHTML = rows.map((r, i) => r.map((c) => `<div class="${i === 0 ? 'hd' : ''}">${c}</div>`).join('')).join('');

// ---- 08_main.js ----
// ===== Game state machine, loop, attract mode =====
const Game = {
  state: 'boot', acc: 0, last: 0, attractIdx: 0, attractT: 0, menuT: 0, errors: 0,
  applyTheme(t) {
    GFX.skyTop.value.setHex(t.top); GFX.skyBot.value.setHex(t.bot);
    GFX.scene.fog.color.setHex(t.fog); GFX.scene.fog.near = t.fogN; GFX.scene.fog.far = t.fogF;
    GFX.hemi.color.setHex(t.hemiS); GFX.hemi.groundColor.setHex(t.hemiG); GFX.hemi.intensity = t.hemiI;
    GFX.sun.color.setHex(t.sun); GFX.sun.intensity = t.sunI;
  },
  build(i, { tt = false, attract = false } = {}) {
    const L = LEVELS[i];
    clearWorld();
    W.def = L; W.levelIndex = i; W.tt = tt; W.attract = attract; W.killY = -10; W.coils = null; W.bonusPath = null; W.aiIdx = 0; W.aiBIdx = 0; W.tipShown = new Set();
    this.applyTheme(L.theme);
    L.build();
    spawnPlayer(L.spawn.clone());
    P.masks = SAVE.settings.assist || attract ? 1 : 0; P.wumpaTotal = 0; P.moved = false;
    CAM.inited = false; cameraStep(DT, true);
  },
  startLevel(i, opts = {}) {
    UI.fade(true, () => {
      this.build(i, opts);
      UI.hideAll(); UI.hud(true); UI.setHints([]); UI.bossBar(!!W.boss, 1);
      AudioSys.music(LEVELS[i].music);
      this.state = 'play';
      if (opts.tt) UI.toast('TIME TRIAL', 'The clock starts when you move');
      else UI.toast(LEVELS[i].name.toUpperCase(), LEVELS[i].short);
      UI.fade(false);
    });
  },
  newGame() {
    P.lives = 5;
    UI.story('WUMPA ISLE', `<p>The island’s three <b>Sun Gems</b> keep Wumpa Isle warm, green and delicious.</p><p>But the bald, brilliant and very grumpy <b>Professor Grumbolt</b> wants them to power his spinning Gyro-Lab!</p><p>Only one hero is fast, fuzzy and cute enough to stop him: <b>Kiki the Bandicute</b>.</p>`, () => { SAVE.seenIntro = true; writeSave(); this.startLevel(0); });
    this.state = 'menu';
  },
  toTitle() {
    this.exitAttract(false);
    this.menuScene();
    UI.hud(false); UI.bossBar(false); UI.title(); this.state = 'menu'; AudioSys.music('title'); Input.resetIdle();
  },
  toMap() {
    this.exitAttract(false);
    if (!W.def || this.state === 'play' || this.state === 'paused' || this.state === 'results') this.menuScene();
    UI.hud(false); UI.bossBar(false); UI.map(); this.state = 'menu'; AudioSys.music('map'); Input.resetIdle();
  },
  menuScene() {
    this.build(0, { attract: false });
    P.model.root.position.copy(P.pos); P.yaw = 0;
    this.menuT = 0;
  },
  pause() { if (this.state !== 'play') return; this.state = 'paused'; UI.pause(); AudioSys.sfx('back'); },
  resume() { UI.hideAll(); UI.setHints([]); this.state = 'play'; },
  restartCheckpoint() { UI.hideAll(); this.state = 'play'; UI.fade(true, () => { respawn(); UI.fade(false); }); },
  gameOver() { this.state = 'menu'; UI.hud(false); AudioSys.music('map'); UI.gameOver(); UI.fade(false); },
  finishLevel() {
    if (W.attract) { this.attractNext(); return; }
    const L = W.def, r = { broken: W.broken, total: W.totalCrates, wumpa: P.wumpaTotal || 0, boss: !!L.boss, tt: W.tt };
    r.gem = !L.boss && W.broken >= W.totalCrates;
    r.newGem = r.gem && !SAVE.gems[L.id];
    if (r.gem) SAVE.gems[L.id] = true;
    SAVE.cleared[L.id] = true;
    SAVE.unlocked = Math.max(SAVE.unlocked, Math.min(LEVELS.length, W.levelIndex + 2));
    if (W.tt) {
      r.time = W.timer;
      const [sa, go, pl] = L.relic;
      r.relic = r.time <= pl ? 'Platinum' : r.time <= go ? 'Gold' : r.time <= sa ? 'Sapphire' : null;
      if (!SAVE.best[L.id] || r.time < SAVE.best[L.id]) { SAVE.best[L.id] = r.time; r.newBest = true; }
      const rank = { Sapphire: 1, Gold: 2, Platinum: 3 };
      if (r.relic && (!SAVE.relics[L.id] || rank[r.relic] > rank[SAVE.relics[L.id]])) SAVE.relics[L.id] = r.relic;
    }
    writeSave();
    this.state = 'results'; UI.hud(false); AudioSys.music('map');
    UI.results(r);
    if (r.newGem) setTimeout(() => AudioSys.sfx('gem'), 400);
  },
  ending() {
    const gems = LEVELS.filter((l) => SAVE.gems[l.id]).length, relics = Object.keys(SAVE.relics).length;
    UI.story('WUMPA ISLE IS SAVED!', `<p>Grumbolt’s Gyro-Lab sputters into the sea, and the Sun Gems shine over the island once more.</p><p>Clear Gems found: <b>${gems} / 3</b> · Relics earned: <b>${relics} / 3</b></p><p>${gems < 3 ? 'Go back and smash every crate to collect all the gems!' : 'Every gem recovered — what a bandicute!'} Try <b>Time Trials</b> from the map for Sapphire, Gold and Platinum relics.</p><p style="opacity:.8">Thanks for playing this demo.</p>`, () => this.toMap());
    this.state = 'menu';
  },
  // ---- attract mode ----
  startAttract() {
    this.state = 'attract'; this.attractIdx = 0; Input.virt.active = true; UI.hideAll(); UI.setHints([]);
    $('#attract-banner').classList.add('on');
    this.attractLoad();
  },
  attractLoad() {
    const i = this.attractIdx % LEVELS.length;
    this.build(i, { attract: true });
    UI.hud(true); UI.bossBar(!!W.boss, 1);
    AudioSys.music(LEVELS[i].music);
    this.attractT = i === 3 ? 45 : 38; W.aiStuck = 0; W.aiBest = 1e9;
  },
  attractNext() {
    if (this.state !== 'attract') return;
    this.attractIdx++;
    UI.fade(true, () => { if (this.state === 'attract') this.attractLoad(); UI.fade(false); });
  },
  exitAttract(goTitle = true) {
    if (this.state !== 'attract') return;
    Input.virt.active = false; Input.setVirt({}); W.attract = false;
    $('#attract-banner').classList.remove('on');
    this.state = 'menu';
    if (goTitle) this.toTitle();
  },
};

// ---- attract-mode AI pilot (cheats: invincible, teleports when stuck) ----
function aiRescue() {
  const path = W.inBonus && W.bonusPath ? W.bonusPath : W.path;
  if (W.inBonus) { exitBonus(true); return; }
  const idx = Math.min(path.length - 1, W.aiIdx);
  const t = path[idx];
  resetPlayerAt(V3(t.x, t.y + 0.5, t.z)); P.invuln = 0;
  W.aiIdx = Math.min(path.length - 1, idx + 1); W.aiStuck = 0; W.aiBest = 1e9;
}
function aiStep(dt) {
  const st = { mx: 0, my: 0, jump: false, spin: false, crouch: false };
  if (P.state !== 'play') { Input.setVirt(st); return; }
  const bonus = W.inBonus && W.bonusPath;
  const path = bonus ? W.bonusPath : W.path;
  let idx = bonus ? W.aiBIdx : W.aiIdx;
  const loop = !!W.boss;
  let tgt = path[idx % path.length];
  const dx = tgt.x - P.pos.x, dz = tgt.z - P.pos.z, dist = Math.hypot(dx, dz);
  if (dist < 1.1 && Math.abs(tgt.y - P.pos.y) < 1.2) { idx = loop ? (idx + 1) % path.length : Math.min(path.length - 1, idx + 1); W.aiStuck = 0; W.aiBest = 1e9; }
  if (bonus) W.aiBIdx = idx; else W.aiIdx = idx;
  tgt = path[idx % path.length];
  // boss: intercept the nearest incoming green orb instead of following the loop
  if (W.boss) { let best = null, bd = 1e9; for (const o of W.boss.orbs) { if (!o.green || o.reflected) continue; const d = o.mesh.position.distanceTo(P.pos); if (d < bd) { bd = d; best = o; } } if (best) { tgt = V3(best.mesh.position.x, 0, best.mesh.position.z); W.aiStuck = 0; W.aiBest = 1e9; } }
  const dir = V3(tgt.x - P.pos.x, 0, tgt.z - P.pos.z); const dl = dir.length(); if (dl > 0.001) dir.divideScalar(dl);
  const { f, r } = camBasis();
  const spd = dl > 0.4 ? 1 : dl / 0.4;
  st.mx = dir.dot(r) * spd; st.my = -dir.dot(f) * spd;
  // progress / stuck detection
  if (dl < W.aiBest - 0.2) { W.aiBest = dl; W.aiStuck = 0; } else W.aiStuck += dt;
  if (W.aiStuck > 3.2) { if (bonus) { W.aiBIdx = Math.min(path.length - 1, idx + 1); resetPlayerAt(V3(tgt.x, tgt.y + 0.5, tgt.z)); W.aiStuck = 0; W.aiBest = 1e9; } else { W.aiIdx = idx; aiRescue(); } Input.setVirt(st); return; }
  if (P.pos.y < Math.min(tgt.y, P.lastGroundY) - 3) { if (!bonus) { W.aiIdx = idx; aiRescue(); Input.setVirt(st); return; } }
  // jump logic
  const ahead = (d) => groundBelow(P.pos.x + dir.x * d, P.pos.y + 0.6, P.pos.z + dir.z * d, 3);
  const ray = (h, len) => W.rw.castRay(new RAPIER.Ray({ x: P.pos.x, y: P.pos.y + h, z: P.pos.z }, { x: dir.x, y: 0, z: dir.z }), len, true, undefined, G_PLAYERQ, P.col);
  const holdJump = W.aiHold > 0; W.aiHold = Math.max(0, (W.aiHold || 0) - dt);
  if (P.grounded) {
    const gapAhead = ahead(1.1) === null || ahead(1.1) < P.pos.y - 1.0;
    const low = ray(0.35, 1.2), high = ray(1.4, 1.4);
    const climb = tgt.y > P.pos.y + 0.8 && dl < 3.2;
    if (high && !low && Math.hypot(P.vel.x, P.vel.z) > 4) st.crouch = !W.aiPrevCrouch;
    else if (gapAhead || low || climb) { st.jump = true; W.aiHold = 0.35; }
  } else if (holdJump) st.jump = true;
  // boss: jump shockwaves, hop around
  if (W.boss) {
    for (const rg of W.boss.rings) { const pd = Math.hypot(P.pos.x, P.pos.z); if (rg.r < pd && pd - rg.r < 1.6 && P.grounded) { st.jump = true; W.aiHold = 0.3; } }
  }
  // spin when anything breakable is close
  let near = false;
  for (const c of W.crates) if (!c.broken && c.col && c.type !== 'iron' && c.type !== 'arrow' && Math.hypot(c.x - P.pos.x, c.z - P.pos.z) < 1.5 && Math.abs(c.y - P.pos.y) < 1.2) near = true;
  for (const e of W.enemies) if (e.alive && e.state !== 'kicked' && e.mesh.position.distanceTo(P.pos) < 1.8) near = true;
  if (W.boss) for (const o of W.boss.orbs) if (o.green && !o.reflected && o.mesh.position.distanceTo(V3(P.pos.x, P.pos.y + 0.9, P.pos.z)) < 1.9) near = true;
  if (near && P.spinCD <= 0) st.spin = true;
  W.aiPrevCrouch = st.crouch;
  Input.setVirt(st);
}

// ---- main loop ----
function tick(dt) {
  W.time += dt;
  if (Game.state === 'attract') aiStep(dt);
  playerStep(dt);
  crateStep(dt);
  enemyStep(dt);
  hazardStep(dt);
  if (W.boss) Boss.step(dt);
  W.rw.step();
  fxStep(dt);
  if (W.tt && P.moved && !W.done && P.state === 'play') { if (W.freeze > 0) W.freeze = Math.max(0, W.freeze - dt); else W.timer += dt; }
}
function frame() {
  Game.frames = (Game.frames || 0) + 1;
  const now = performance.now();
  let dt = Math.min(0.1, (now - (Game.last || now)) / 1000); Game.last = now;
  try {
    Input.poll();
    const s = Game.state;
    if (UI.touchBlock.on && Input.anyPress && UI.active === 's-msg') { UI.touchBlock.on = false; Game.toTitle(); }
    if (s === 'play') {
      if (Input.realPressed('pause')) Game.pause();
      else {
        Game.acc += dt; let n = 0;
        while (Game.acc >= DT && n < 5) { tick(DT); Game.acc -= DT; n++; }
        if (n === 5) Game.acc = 0;
      }
      syncPlayerModel(dt); propsStep(dt); cameraStep(dt); UI.hudUpdate(dt);
    } else if (s === 'attract') {
      if (Input.anyPress) { Game.exitAttract(true); }
      else {
        Game.acc += dt; let n = 0;
        while (Game.acc >= DT && n < 5) { tick(DT); Game.acc -= DT; n++; }
        if (n === 5) Game.acc = 0;
        syncPlayerModel(dt); propsStep(dt); cameraStep(dt); UI.hudUpdate(dt);
        Game.attractT -= dt; if (Game.attractT <= 0) { Game.attractT = 99; Game.attractNext(); }
      }
    } else {
      UI.update(dt);
      if (W.rw && s !== 'paused') {
        W.time += dt; propsStep(dt);
        for (const m of W.movers) updateMover(m, W.time);
        enemyStep(dt);
        if (Game.state === 'menu' && P.model) {
          Game.menuT += dt;
          syncPlayerModel(dt);
          const a = Game.menuT * 0.12;
          GFX.camera.position.set(P.pos.x + Math.sin(a) * 6.5, P.pos.y + 2.6 + Math.sin(Game.menuT * 0.3) * 0.4, P.pos.z + Math.cos(a) * 6.5);
          GFX.camera.lookAt(P.pos.x, P.pos.y + 1.2, P.pos.z);
          GFX.sun.position.set(P.pos.x + 10, P.pos.y + 22, P.pos.z + 8); GFX.sun.target.position.copy(P.pos);
        }
      }
      if (s === 'paused' && Input.realPressed('pause')) Game.resume();
      if (s === 'menu' && (UI.active === 's-title' || UI.active === 's-map') && Input.idle > 10) Game.startAttract();
    }
    GFX.post.render();
  } catch (e) {
    Game.errors++; console.error(e);
    if (Game.errors > 50) GFX.renderer.setAnimationLoop(null);
  }
}

document.addEventListener('visibilitychange', () => { if (document.hidden && Game.state === 'play') Game.pause(); });
window.addEventListener('gamepaddisconnected', () => { if (Game.state === 'play') Game.pause(); });

async function boot() {
  loadSave();
  window.__game = { Game, W, P, Input, LEVELS, SAVE: () => SAVE, UI };
  UI.show('s-boot');
  const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches && navigator.maxTouchPoints > 0;
  try { await Promise.race([document.fonts.load('64px "Lilita One"'), new Promise((r) => setTimeout(r, 2500))]); } catch (e) { /* fonts optional */ }
  try { await initGfx(); }
  catch (e) { console.warn('WebGPU unavailable', e); UI.noWebGPU(); window.__game.bootError = 'nogpu'; return; }
  buildTextures(); buildGeos(); buildFxMats();
  $('#bootmsg').textContent = 'WARMING UP PHYSICS…';
  await initPhysics();
  Game.menuScene();
  Game.state = 'menu';
  if (touchOnly && !(navigator.getGamepads && [...navigator.getGamepads()].some((p) => p))) UI.touchBlocked();
  else { UI.title(); AudioSys.music('title'); }
  window.__game.ready = true;
  GFX.renderer.setAnimationLoop(frame);
}
boot();
