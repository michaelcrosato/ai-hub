$('#screen').addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'&&mode==='flight'){const [x,y]=game.screen.clientToScreen(e.clientX,e.clientY);if(x>348&&y+270<30)cycleWeapon();}});
game.input.bindButtons($('#touch-controls'));
game.start({pausable:false,update,draw});showTitle();writeTelemetry();registerTools();
