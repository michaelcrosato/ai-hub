<!DOCTYPE html>
<!--
BATA BATA 7 — Source Information
Date: 2026-10-29 05:05
Source: Waku Waku 7 (Sunsoft, 1996, Neo Geo / arcade) — original spiritual successor; no assets reused
Tech: Three.js r180 (three@0.180.0, WebGPURenderer, WebGPU only — no WebGL fallback, TSL node materials, PostProcessing + BloomNode); Rapier 3D 0.19.3 (@dimforge/rapier3d-compat) for prop, debris and star-shard physics; Gamepad API (standard mapping, rumble); Web Audio API; AI Hub Session Protocol v1 client 1.3.0 (session.js, unmodified); plain ES modules bundled into one HTML file by a small Node script
Art Direction: Stylized cel shading — MeshToonNodeMaterial with a 3-step ramp, inverted-hull outlines extruded in TSL, flat-shaded skies, bloom glow, comic onomatopoeia pop-ups, anime cut-ins
Animation: Procedural pose system — primitive-built hierarchical rigs (12 joints), hand-keyed pose library blended with exponential damping, layered procedural walk/breathe/squash-stretch, secondary motion (ears, capes, scarves, tails), hit-stop, slow-motion and camera cut-ins
Audio: All code-written Web Audio — a data-driven step sequencer with 11 songs (seeded motif melodies, chords, bass, drums), ~40 synthesized sound effects, and Animalese-style gibberish voices (formant-filtered blips per letter, per-character pitch/timbre) for every line of dialogue and the narrator
Online: AI Hub Session Protocol v1 — side-by-side ("parallel") Bata Bata Gauntlet: seeded fighter and rival deal via AIHub.rng('deal'), progress/result/awards reporting, time-up and end handling, probe, settings menu via Esc/Options. Local 2-player versus on one device (two pads or split keyboard). No other network features.
Testing: Chrome (Playwright, headed under Xvfb) with WebGPU on SwiftShader (about 3 FPS, so no frame-rate or feel judgement). Ran: CPU-vs-CPU matches for all 9 fighters stepped in-page (no exceptions, every move type used, KOs happen); screenshot passes of every screen and the main combat moments; emulated gamepad (menu navigation, Options pause, Create+Options passthrough, invert X); touch-only device emulation; AI Hub harness (auto) at 1 and 2 players: all checks pass. Lightweight by request: no real GPU, no real controller, no audio listening.
Environment: Claude Code CLI (headless); Linux; browser unknown
Model: Anthropic, claude-opus-5-5, reasoning effort medium
Usage: unknown — no token or cost meter is visible to the model in this headless session; session time approx. 55 minutes of wall clock (05:05 to about 06:00)

Testing Feedback
- How many issues did testing catch? 11 game issues: a crash when a human fired a super (rumble lookup on a wildcard device list), combo counters only resetting in the render path, overexposed lighting and bloom, white-out hit flashes, an attract-mode heal cheat that dragged demos out, and six layout problems (title menu overflow, select cards under the info panel, stage cards overflowing, settings showing 3 rows, HUD score/hint/subtitle overlaps, no on-screen close for touch/mouse in overlays).
- How many would be considered critical issues / game breaking? 1 — the super crash (it threw every frame and stalled the match).
- What was the most helpful test you ran? The in-page CPU-vs-CPU run that steps all 9 fighters through full matches without rendering: it covered every move, super, Harahara, throw, guard cancel and KO path in seconds, and found the crash and the combo-reset bug.
- What was the least helpful test you ran? Timed key-press scripts at SwiftShader's ~3 FPS: game time ran slower than wall time, so inputs landed in the wrong screens and produced false alarms.

Engine Feedback
- What did you like most about the engine? TSL. The inverted-hull outline is one line (positionNode = positionLocal + normalLocal * w). MeshToonNodeMaterial with a ramp texture and PostProcessing + BloomNode gave the cel look with almost no shader code.
- Did you get stuck or guess wrong? Briefly. I checked the r180 build to confirm PostProcessing (not a renamed pipeline class) and BloomNode exist. WebGPURenderer quietly falls back to WebGL2, so to honour "no fallback" I had to check backend.isWebGPUBackend myself. Rapier-compat 0.19.3 warns about deprecated init parameters. New headless Chrome screenshots the WebGPU canvas as black, so captures needed headed Chrome under Xvfb.
- What was the most important thing you had to build yourself? The fighting game simulation: a fixed 60 Hz step with frame data, hit/hurt boxes, input buffer and motion detection, chains and cancels, juggles and damage scaling, guard levels, armor, throws and techs, hit-stop, plus the Harahara and super systems. Close behind: the procedural pose-blending rig, since there are no skinned assets.
- What was the hardest part about using the engine? Verifying it. Without a real GPU, SwiftShader ran at about 3 FPS, and the first time a stage or material appears, pipeline compiles stall frames for seconds.
- If you had to remove or overhaul one thing from engine, what would that be? The silent WebGL2 fallback in WebGPURenderer. A WebGPU-only project should fail loudly by default (or with one flag), not degrade quietly.
- If you could change one thing about the engine, what would it be? A built-in, documented pipeline warm-up (precompile every material for a scene during loading), so the first use of a stage or effect doesn't hitch.

Prompt Feedback
- What did you like most about this prompt? The deliverable is concrete (single file, name pattern, required sections) while animation, audio and genre adaptation are left open. The attract mode and the inverted-axis fix are specific, testable asks.
- What was confusing? The hub protocol recommends a WebGL 2 fallback while the tech stack says WebGPU with no fallback; I resolved it with <meta name="hub:webgpu" content="required">. Which hub mode fits a 1v1 fighter was left to judgement (I chose side by side, since a fighter over 30–250 ms of latency needs rollback). "Testing Feedback" sits under Source Information but isn't in the CRITICAL list of sections; I included it everywhere.
- What was the hardest thing to do? Scope: seven distinct fighters plus a boss and a secret mascot, an arcade story, versus, training, a bonus stage, attract mode, settings and hub integration, all in one pass, while keeping it a polished vertical slice.
- If there was one test you could of run, what would that test be? A 60 FPS playtest on a real GPU with a real DualSense, to tune feel: frame data, hit-stop, dash and jump arcs, camera framing and audio mix.

-->

<script>
/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

.panel.wide { width: min(1180px, 94vw); }
h1, h2, h3 { margin: 0; }
h2 { font-family: 'Bungee', 'Impact', sans-serif; font-size: calc(var(--u) * 3.6); letter-spacing: 0.04em; color: var(--yellow); text-shadow: 3px 3px 0 var(--ink); }
h2 small { font-size: 0.45em; color: #fff; opacity: 0.7; margin-left: 0.6em; }
h3 { font-size: calc(var(--u) * 2); color: var(--cyan); }
p { font-size: calc(var(--u) * 2); line-height: 1.4; margin: 0; }
.dim { opacity: 0.72; font-size: calc(var(--u) * 1.7); }
.logo { font-family: 'Bungee', 'Impact', sans-serif; color: #fff; letter-spacing: 0.02em; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 6px 6px 0 var(--pink), 12px 12px 0 var(--ink); line-height: 1; }
.logo em { font-style: normal; color: var(--yellow); display: inline-block; transform: rotate(-8deg) scale(1.25); text-shadow: 6px 6px 0 var(--cyan), 12px 12px 0 var(--ink); }
.logo.big { font-size: calc(var(--u) * 13); animation: bob 2.4s ease-in-out infinite; }
.logo.mid { font-size: calc(var(--u) * 6); }
.menuwrap .logo.mid { font-size: calc(var(--u) * 5.4); margin-bottom: 1vh; }
.logo.small { font-size: calc(var(--u) * 4.2); text-shadow: 3px 3px 0 var(--pink), 6px 6px 0 var(--ink); }
@keyframes bob { 50% { transform: translateY(-1.2vh) rotate(-1deg); } }
.titlewrap { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2); margin-top: -6vh; }
.titlewrap.menuwrap { margin-top: 0; gap: calc(var(--u) * 1.2); }
.menuwrap { align-items: flex-start; margin: 0 0 0 6vw; align-self: center; justify-self: flex-start; width: 100%; }
.s-title { justify-content: flex-start; background: linear-gradient(90deg, rgba(18, 10, 26, 0.55), transparent 55%); }
.s-title .titlewrap:not(.menuwrap) { margin: -6vh auto 0; }
.tagline { font-family: 'Bungee', sans-serif; font-size: calc(var(--u) * 2.8); color: var(--yellow); -webkit-text-stroke: 1px var(--ink); text-shadow: 3px 3px 0 var(--ink); }
.press { font-family: 'Bungee', sans-serif; font-size: calc(var(--u) * 3.4); margin-top: 6vh; color: #fff; text-shadow: 3px 3px 0 var(--pink); cursor: pointer; pointer-events: auto; }
.copy { position: fixed; bottom: 3vh; font-size: calc(var(--u) * 1.5); opacity: 0.8; text-shadow: 2px 2px 0 var(--ink); }
.blink { animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.tipline { font-size: calc(var(--u) * 2); min-height: 2em; opacity: 0.9; text-shadow: 2px 2px 0 var(--ink); }
.menu { display: flex; flex-direction: column; gap: calc(var(--u) * 0.9); width: 100%; overflow-y: auto; overflow-x: hidden; max-height: 56vh; padding: 6px 18px 6px 6px; }
.menu.main { width: min(520px, 40vw); max-height: none; gap: calc(var(--u) * 0.7); }
.menu.main .mi { padding: calc(var(--u) * 0.55) calc(var(--u) * 1.6); }
.menu.main .mi b { font-size: calc(var(--u) * 2.1); }
.menu.main .mi small { display: none; }
.menu.row { flex-direction: row; justify-content: center; }
.mi { pointer-events: auto; font: inherit; color: #fff; background: rgba(255, 255, 255, 0.08); border: 3px solid rgba(255, 255, 255, 0.25); border-radius: 18px; padding: calc(var(--u) * 1.2) calc(var(--u) * 2); text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 1em; transition: transform 0.12s, background 0.12s; }
.mi b { font-size: calc(var(--u) * 2.4); font-weight: 800; }
.mi small { font-size: calc(var(--u) * 1.5); opacity: 0.7; }
.mi.focus { background: linear-gradient(90deg, var(--pink), #ff8a3d); border-color: #fff; transform: translateX(10px) scale(1.03); box-shadow: 0 6px 0 var(--ink); }
.mi.focus small { opacity: 1; }
.menu.main .mi { flex-direction: row; }
.mi.disabled { opacity: 0.35; }
.val { font-style: normal; font-size: calc(var(--u) * 2.1); font-weight: 800; display: flex; align-items: center; gap: 0.5em; white-space: nowrap; }
.val.on { color: var(--yellow); } .val.off { opacity: 0.6; }
.slider { width: calc(var(--u) * 18); height: calc(var(--u) * 1.4); background: rgba(0, 0, 0, 0.45); border-radius: 99px; overflow: hidden; border: 2px solid #fff; }
.slider i { display: block; height: 100%; background: var(--yellow); }
.arrow { opacity: 0.6; font-size: 0.8em; }
.footer { position: fixed; bottom: 2.4vh; right: 3vw; display: flex; gap: 2.2em; font-size: calc(var(--u) * 1.9); text-shadow: 2px 2px 0 var(--ink); pointer-events: none; }
.panel .footer { position: static; justify-content: center; margin-top: calc(var(--u) * 1.6); }
.key { display: inline-flex; align-items: center; justify-content: center; min-width: 1.7em; height: 1.7em; padding: 0 0.45em; border-radius: 0.45em; background: #fff; color: var(--ink); font-weight: 800; font-size: 0.9em; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.5); vertical-align: middle; }
.key.face { border-radius: 50%; padding: 0; width: 1.8em; height: 1.8em; background: #222; color: #fff; font-size: 1em; }
.key.f0 { color: #7fb4ff; } .key.f1 { color: #ff6b7a; } .key.f2 { color: #ff8fd8; } .key.f3 { color: #5ff0c0; }
.key.dir { background: var(--yellow); }
.key.big { font-size: 1.4em; }
.spinner { width: 64px; height: 64px; border: 8px solid rgba(255, 255, 255, 0.2); border-top-color: var(--yellow); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* character select */
.sel { position: absolute; inset: 0; }
.hdr { position: absolute; top: 3vh; left: 4vw; font-family: 'Bungee', sans-serif; font-size: calc(var(--u) * 4); color: #fff; text-shadow: 4px 4px 0 var(--pink), 7px 7px 0 var(--ink); }
.hdr small { display: block; font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 0.45em; color: var(--yellow); text-shadow: 2px 2px 0 var(--ink); }
.cards { position: absolute; bottom: 9vh; left: 0; right: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 1.2); max-width: 92vw; }
.card { pointer-events: auto; cursor: pointer; width: calc(var(--u) * 9.5); padding: calc(var(--u) * 0.8); border-radius: 18px; background: rgba(27, 15, 36, 0.8); border: 4px solid rgba(255, 255, 255, 0.25); text-align: center; position: relative; transition: transform 0.12s; }
.card b { display: block; font-family: 'Bungee', sans-serif; font-size: calc(var(--u) * 1.6); margin-top: 0.3em; }
.card.c1 { border-color: var(--pink); transform: translateY(-8px) scale(1.08); box-shadow: 0 0 0 4px var(--ink), 0 0 30px var(--pink); }
.card.c2 { border-color: var(--cyan); transform: translateY(-8px) scale(1.08); box-shadow: 0 0 0 4px var(--ink), 0 0 30px var(--cyan); }
.card.c1.c2 { border-image: linear-gradient(90deg, var(--pink), var(--cyan)) 1; }
.card.c1::before { content: 'P1'; position: absolute; top: -1.4em; left: 0; font-family: 'Bungee'; color: var(--pink); text-shadow: 2px 2px 0 var(--ink); font-size: calc(var(--u) * 1.6); }
.card.c2::after { content: 'P2'; position: absolute; top: -1.4em; right: 0; font-family: 'Bungee'; color: var(--cyan); text-shadow: 2px 2px 0 var(--ink); font-size: calc(var(--u) * 1.6); }
.card.locked1, .card.locked2 { filter: saturate(1.4) brightness(1.15); }
.portrait { width: calc(var(--u) * 6.5); height: calc(var(--u) * 6.5); margin: 0 auto; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 8%, var(--c) 9% 70%, #1b0f24 71%); display: flex; align-items: center; justify-content: center; border: 4px solid #fff; }
.portrait span { font-family: 'Bungee'; font-size: calc(var(--u) * 2.5); color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
.portrait.big { width: calc(var(--u) * 14); height: calc(var(--u) * 14); }
.portrait.big span { font-size: calc(var(--u) * 5.5); }
.info { position: absolute; top: 15vh; max-height: 52vh; overflow: hidden; width: min(30vw, 440px); background: var(--panel); border: 4px solid #fff; border-radius: 22px; padding: calc(var(--u) * 2); }
.info.p1 { left: 3vw; box-shadow: 8px 8px 0 var(--pink); }
.info.p2 { right: 3vw; box-shadow: -8px 8px 0 var(--cyan); }
.info:empty { display: none; }
.info h2 { color: var(--c); font-size: calc(var(--u) * 2.4); }
.info h3 { font-size: calc(var(--u) * 1.8); margin-bottom: 0.4em; }
.info p { font-size: calc(var(--u) * 1.55); margin-bottom: 0.6em; }
.tag { display: inline-block; background: var(--c); color: #fff; font-family: 'Bungee'; padding: 0.15em 0.6em; border-radius: 8px; font-size: calc(var(--u) * 1.5); margin-bottom: 0.4em; text-shadow: 2px 2px 0 var(--ink); }
.stats > div { display: flex; justify-content: space-between; align-items: center; margin: 0.3em 0; font-size: calc(var(--u) * 1.5); font-weight: 800; }
.pips { display: flex; gap: 6px; }
.pips i { width: calc(var(--u) * 2.2); height: calc(var(--u) * 1.2); border-radius: 4px; background: rgba(255, 255, 255, 0.2); }
.pips i.on { background: var(--yellow); box-shadow: 0 2px 0 var(--ink); }
.joinhint { position: absolute; bottom: 4vh; left: 4vw; font-size: calc(var(--u) * 2); text-shadow: 2px 2px 0 var(--ink); }
.stagecards { position: absolute; bottom: 14vh; left: 0; right: 0; justify-content: center; display: flex; flex-direction: row !important; gap: calc(var(--u) * 1.2); max-height: none !important; width: auto !important; }
.stagecards .mi { flex-direction: column; align-items: flex-start; width: calc(var(--u) * 20); }
.stagecards .mi.focus { transform: translateY(-10px) scale(1.04); }
.stagename { position: absolute; top: 14vh; left: 0; right: 0; text-align: center; font-family: 'Bungee'; font-size: calc(var(--u) * 3); text-shadow: 3px 3px 0 var(--ink); }
/* episode / vs cards */
.vs { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 2); background: radial-gradient(circle at 50% 50%, rgba(255, 79, 154, 0.55), rgba(18, 10, 26, 0.94) 70%); text-align: center; padding: 4vw; }
.ep { font-family: 'Bungee'; font-size: calc(var(--u) * 3); color: var(--yellow); letter-spacing: 0.1em; text-shadow: 3px 3px 0 var(--ink); }
.eptitle { font-family: 'Bungee'; font-size: calc(var(--u) * 4.4); max-width: 80vw; line-height: 1.15; color: #fff; text-shadow: 4px 4px 0 var(--pink), 8px 8px 0 var(--ink); animation: slam 0.4s cubic-bezier(.2, 1.6, .5, 1); }
@keyframes slam { from { transform: scale(2.2) rotate(-6deg); opacity: 0; } }
.vsrow { display: flex; align-items: center; gap: 5vw; }
.side { display: flex; flex-direction: column; align-items: center; gap: 0.4em; }
.side b { font-family: 'Bungee'; font-size: calc(var(--u) * 2.6); color: var(--c); text-shadow: 3px 3px 0 var(--ink); }
.side small { font-size: calc(var(--u) * 1.6); }
.side.l { animation: inL 0.5s ease-out; } .side.r { animation: inR 0.5s ease-out; }
@keyframes inL { from { transform: translateX(-60vw); } } @keyframes inR { from { transform: translateX(60vw); } }
.vsx { font-family: 'Bungee'; font-size: calc(var(--u) * 8); color: var(--yellow); -webkit-text-stroke: 3px var(--ink); text-shadow: 6px 6px 0 var(--ink); animation: slam 0.5s 0.3s both cubic-bezier(.2, 1.6, .5, 1); }
.tip { font-size: calc(var(--u) * 2); opacity: 0.9; max-width: 70vw; }
.narr { font-size: calc(var(--u) * 2.6); max-width: 70vw; min-height: 3em; text-shadow: 2px 2px 0 var(--ink); }
.narr.big { font-size: calc(var(--u) * 3.2); }
.score { font-family: 'Bungee'; font-size: calc(var(--u) * 2.4); color: var(--yellow); text-shadow: 3px 3px 0 var(--ink); }
.score.big { font-size: calc(var(--u) * 6); }
.stars { display: flex; gap: calc(var(--u) * 1); }
.stars i { font-style: normal; font-size: calc(var(--u) * 4.4); color: rgba(255, 255, 255, 0.18); -webkit-text-stroke: 2px var(--ink); }
.stars i.on { color: var(--yellow); text-shadow: 0 0 20px #ffb000; animation: twinkle 1.6s ease-in-out infinite; }
@keyframes twinkle { 50% { transform: scale(1.15) rotate(10deg); } }
.count { font-family: 'Bungee'; font-size: calc(var(--u) * 16); color: var(--yellow); text-shadow: 8px 8px 0 var(--ink); }
.cont .mi { width: auto; }
.ending { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; background: linear-gradient(90deg, rgba(18, 10, 26, 0.9), rgba(18, 10, 26, 0.3)); }
.wish { display: flex; flex-direction: column; justify-content: center; gap: 2vh; padding: 6vw; }
.wish p { font-size: calc(var(--u) * 2.5); text-shadow: 2px 2px 0 var(--ink); }
.roll { overflow: hidden; position: relative; mask-image: linear-gradient(transparent, #000 15%, #000 85%, transparent); }
.rollin { position: absolute; width: 100%; text-align: center; animation: roll 36s linear forwards; }
.rollin p { font-size: calc(var(--u) * 2.4); margin: 0.6em 0; text-shadow: 2px 2px 0 var(--ink); }
@keyframes roll { from { top: 100%; } to { top: -160%; } }
.attract { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 15vh; gap: 1vh; pointer-events: none; }
.attract .logo { position: absolute; top: 17vh; }
.demo { font-family: 'Bungee'; font-size: calc(var(--u) * 3); text-shadow: 3px 3px 0 var(--pink), 6px 6px 0 var(--ink); }
.attract .tip { background: var(--panel); padding: 0.4em 1em; border-radius: 14px; border: 3px solid #fff; }
/* tabs, move list, how-to, about */
.tabs { display: flex; gap: 0.6em; justify-content: center; }
.tab { pointer-events: auto; cursor: pointer; font: inherit; font-weight: 800; font-size: calc(var(--u) * 2); color: #fff; background: rgba(255, 255, 255, 0.1); border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 14px; padding: 0.3em 1em; }
.tab.on { background: var(--cyan); color: var(--ink); border-color: #fff; }
.movelist .mlhead { display: flex; align-items: center; gap: 1.5em; }
.movelist .mlhead h2 { color: var(--c); }
.moves { width: 100%; max-height: 54vh; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 0.6em 1.4em; padding: 4px; text-align: left; }
.mvr { background: rgba(255, 255, 255, 0.07); border-radius: 14px; padding: 0.55em 0.9em; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.1em 0.8em; }
.mvr b { font-size: calc(var(--u) * 1.9); }
.mvr .inp { font-size: calc(var(--u) * 1.9); grid-row: span 2; white-space: nowrap; }
.mvr small { font-size: calc(var(--u) * 1.45); opacity: 0.75; }
.ctrlgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1em; width: 100%; }
.ctrlgrid > div { background: rgba(255, 255, 255, 0.07); border-radius: 16px; padding: 0.8em; display: flex; flex-direction: column; align-items: center; gap: 0.4em; font-size: calc(var(--u) * 2.4); }
.ctrlgrid > div:first-child { grid-column: span 5; flex-direction: row; justify-content: center; gap: 1em; }
.ctrlgrid p { font-size: calc(var(--u) * 1.6); }
.big-card { background: rgba(255, 255, 255, 0.06); border-radius: 22px; padding: 1.2em 2em; display: flex; flex-direction: column; gap: 0.8em; align-items: center; max-width: 900px; }
.big-card.hara > b { font-family: 'Bungee'; font-size: calc(var(--u) * 5); color: #ff3a6a; text-shadow: 4px 4px 0 var(--ink); }
.scrollbox { max-height: 62vh; overflow-y: auto; text-align: left; width: 100%; padding-right: 1em; }
.scrollbox h3 { margin-top: 1em; color: var(--yellow); font-family: 'Bungee'; font-size: calc(var(--u) * 2.2); }
.scrollbox p { font-size: calc(var(--u) * 1.75); margin: 0.25em 0; }
.credits { text-align: center; margin-bottom: 1em; }
/* HUD */
#hud { opacity: 0; transition: opacity 0.3s; font-family: 'Bungee', sans-serif; }
#hud.on { opacity: 1; }
.hpbar { position: absolute; top: 3vh; width: 40vw; }
.hpbar.p1 { left: 3vw; } .hpbar.p2 { right: 3vw; }
.hp { height: calc(var(--u) * 3.2); background: #2a1830; border: 4px solid #fff; border-radius: 12px; position: relative; overflow: hidden; box-shadow: 0 5px 0 var(--ink); transform: skewX(-12deg); }
.hpbar.p2 .hp { transform: skewX(12deg); }
.hp i { position: absolute; inset: 0; transform-origin: left; }
.hpbar.p2 .hp i { transform-origin: right; }
.hp .lag { background: #ff3a3a; }
.hp .fill { background: linear-gradient(180deg, #fff27a, #ffb000 60%, #ff8a00); }
.hp .fill.low { background: linear-gradient(180deg, #ff9a9a, #ff3a3a); animation: blink 0.4s steps(2) infinite; }
.nm { font-size: calc(var(--u) * 2.4); color: #fff; text-shadow: 3px 3px 0 var(--c), 5px 5px 0 var(--ink); margin-bottom: 0.2em; }
.nm small { font-family: 'M PLUS Rounded 1c'; font-weight: 800; font-size: 0.55em; margin-left: 0.6em; opacity: 0.85; text-shadow: 2px 2px 0 var(--ink); }
.hpbar.p2 .nm { text-align: right; }
.wins { margin-top: 0.3em; display: flex; gap: 0.2em; }
.hpbar.p2 .wins { justify-content: flex-end; }
.wins i { font-style: normal; font-size: calc(var(--u) * 2.4); color: rgba(255, 255, 255, 0.2); -webkit-text-stroke: 2px var(--ink); }
.wins i.on { color: var(--yellow); }
.timer { position: absolute; top: 2.5vh; left: 50%; transform: translateX(-50%); font-size: calc(var(--u) * 6); color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); }
.timer.low { color: #ff5a5a; }
.meter { position: absolute; bottom: 4vh; width: 30vw; display: flex; align-items: center; gap: 0.6em; }
.meter.p1 { left: 3vw; } .meter.p2 { right: 3vw; flex-direction: row-reverse; }
.meter label { font-size: calc(var(--u) * 1.4); color: var(--yellow); text-shadow: 2px 2px 0 var(--ink); }
.meter .lv { width: calc(var(--u) * 5); height: calc(var(--u) * 5); border-radius: 50%; background: #2a1830; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; font-size: calc(var(--u) * 3); box-shadow: 0 4px 0 var(--ink); }
.meter .lv.ready { background: var(--pink); animation: pulse 0.8s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.mb { flex: 1; height: calc(var(--u) * 2); background: #2a1830; border: 3px solid #fff; border-radius: 99px; position: relative; overflow: hidden; }
.mb i { position: absolute; inset: 0; background: linear-gradient(90deg, var(--cyan), var(--pink), var(--yellow)); transform-origin: left; }
.meter.p2 .mb i { transform-origin: right; }
.mb span { position: absolute; top: 0; bottom: 0; width: 3px; background: #fff; }
.mb span:nth-of-type(1) { left: 33.3%; } .mb span:nth-of-type(2) { left: 66.6%; }
.combo { position: absolute; top: 22vh; font-size: calc(var(--u) * 3); color: #fff; text-shadow: 3px 3px 0 var(--ink); transition: opacity 0.3s; opacity: 0; }
.combo b { font-size: 1.9em; color: var(--yellow); -webkit-text-stroke: 2px var(--ink); }
.combo small { display: block; font-size: 0.55em; color: var(--cyan); }
.combo.p1 { left: 4vw; } .combo.p2 { right: 4vw; text-align: right; }
.combo.pop { animation: cpop 0.25s ease-out; }
@keyframes cpop { from { transform: scale(1.5); } }
.hscore { position: absolute; top: 16vh; font-family: 'Bungee'; color: var(--yellow); text-shadow: 3px 3px 0 var(--ink); left: 50%; transform: translateX(-50%); font-size: calc(var(--u) * 1.8); white-space: nowrap; }
.banner { position: absolute; top: 38vh; left: 0; right: 0; text-align: center; opacity: 0; }
.banner span { display: inline-block; font-size: calc(var(--u) * 10); color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 8px 8px 0 var(--pink), 14px 14px 0 var(--ink); }
.banner.show { animation: banner 1.4s ease-out forwards; }
.banner.fight span { color: var(--yellow); }
.banner.ko span { color: #ff4a4a; font-size: calc(var(--u) * 14); }
.banner.hara span { color: #ff3a6a; text-shadow: 8px 8px 0 var(--yellow), 14px 14px 0 var(--ink); }
.banner.perfect span { color: var(--cyan); }
@keyframes banner { 0% { opacity: 0; transform: scale(2.6) rotate(-8deg); } 12% { opacity: 1; transform: scale(1) rotate(-3deg); } 80% { opacity: 1; transform: scale(1.05) rotate(-3deg); } 100% { opacity: 0; transform: scale(1.2) rotate(-3deg); } }
.callouts { position: absolute; top: 30vh; display: flex; flex-direction: column; gap: 0.3em; }
.callouts.c1 { left: 4vw; } .callouts.c2 { right: 4vw; align-items: flex-end; }
.callout { font-size: calc(var(--u) * 2.6); color: var(--yellow); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); animation: callout 1.5s ease-out forwards; }
.callout.hara { color: #ff3a6a; font-size: calc(var(--u) * 3.2); }
.callout.perfect { color: var(--cyan); }

const SOURCE_INFO = "BATA BATA 7 — Source Information\nDate: 2026-10-29 05:05\nSource: Waku Waku 7 (Sunsoft, 1996, Neo Geo / arcade) — original spiritual successor; no assets reused\nTech: Three.js r180 (three@0.180.0, WebGPURenderer, WebGPU only — no WebGL fallback, TSL node materials, PostProcessing + BloomNode); Rapier 3D 0.19.3 (@dimforge/rapier3d-compat) for prop, debris and star-shard physics; Gamepad API (standard mapping, rumble); Web Audio API; AI Hub Session Protocol v1 client 1.3.0 (session.js, unmodified); plain ES modules bundled into one HTML file by a small Node script\nArt Direction: Stylized cel shading — MeshToonNodeMaterial with a 3-step ramp, inverted-hull outlines extruded in TSL, flat-shaded skies, bloom glow, comic onomatopoeia pop-ups, anime cut-ins\nAnimation: Procedural pose system — primitive-built hierarchical rigs (12 joints), hand-keyed pose library blended with exponential damping, layered procedural walk/breathe/squash-stretch, secondary motion (ears, capes, scarves, tails), hit-stop, slow-motion and camera cut-ins\nAudio: All code-written Web Audio — a data-driven step sequencer with 11 songs (seeded motif melodies, chords, bass, drums), ~40 synthesized sound effects, and Animalese-style gibberish voices (formant-filtered blips per letter, per-character pitch/timbre) for every line of dialogue and the narrator\nOnline: AI Hub Session Protocol v1 — side-by-side (\"parallel\") Bata Bata Gauntlet: seeded fighter and rival deal via AIHub.rng('deal'), progress/result/awards reporting, time-up and end handling, probe, settings menu via Esc/Options. Local 2-player versus on one device (two pads or split keyboard). No other network features.\nTesting: Chrome (Playwright, headed under Xvfb) with WebGPU on SwiftShader (about 3 FPS, so no frame-rate or feel judgement). Ran: CPU-vs-CPU matches for all 9 fighters stepped in-page (no exceptions, every move type used, KOs happen); screenshot passes of every screen and the main combat moments; emulated gamepad (menu navigation, Options pause, Create+Options passthrough, invert X); touch-only device emulation; AI Hub harness (auto) at 1 and 2 players: all checks pass. Lightweight by request: no real GPU, no real controller, no audio listening.\nEnvironment: Claude Code CLI (headless); Linux; browser unknown\nModel: Anthropic, claude-opus-5-5, reasoning effort medium\nUsage: unknown — no token or cost meter is visible to the model in this headless session; session time approx. 55 minutes of wall clock (05:05 to about 06:00)\n\nTesting Feedback\n- How many issues did testing catch? 11 game issues: a crash when a human fired a super (rumble lookup on a wildcard device list), combo counters only resetting in the render path, overexposed lighting and bloom, white-out hit flashes, an attract-mode heal cheat that dragged demos out, and six layout problems (title menu overflow, select cards under the info panel, stage cards overflowing, settings showing 3 rows, HUD score/hint/subtitle overlaps, no on-screen close for touch/mouse in overlays).\n- How many would be considered critical issues / game breaking? 1 — the super crash (it threw every frame and stalled the match).\n- What was the most helpful test you ran? The in-page CPU-vs-CPU run that steps all 9 fighters through full matches without rendering: it covered every move, super, Harahara, throw, guard cancel and KO path in seconds, and found the crash and the combo-reset bug.\n- What was the least helpful test you ran? Timed key-press scripts at SwiftShader's ~3 FPS: game time ran slower than wall time, so inputs landed in the wrong screens and produced false alarms.\n\nEngine Feedback\n- What did you like most about the engine? TSL. The inverted-hull outline is one line (positionNode = positionLocal + normalLocal * w). MeshToonNodeMaterial with a ramp texture and PostProcessing + BloomNode gave the cel look with almost no shader code.\n- Did you get stuck or guess wrong? Briefly. I checked the r180 build to confirm PostProcessing (not a renamed pipeline class) and BloomNode exist. WebGPURenderer quietly falls back to WebGL2, so to honour \"no fallback\" I had to check backend.isWebGPUBackend myself. Rapier-compat 0.19.3 warns about deprecated init parameters. New headless Chrome screenshots the WebGPU canvas as black, so captures needed headed Chrome under Xvfb.\n- What was the most important thing you had to build yourself? The fighting game simulation: a fixed 60 Hz step with frame data, hit/hurt boxes, input buffer and motion detection, chains and cancels, juggles and damage scaling, guard levels, armor, throws and techs, hit-stop, plus the Harahara and super systems. Close behind: the procedural pose-blending rig, since there are no skinned assets.\n- What was the hardest part about using the engine? Verifying it. Without a real GPU, SwiftShader ran at about 3 FPS, and the first time a stage or material appears, pipeline compiles stall frames for seconds.\n- If you had to remove or overhaul one thing from engine, what would that be? The silent WebGL2 fallback in WebGPURenderer. A WebGPU-only project should fail loudly by default (or with one flag), not degrade quietly.\n- If you could change one thing about the engine, what would it be? A built-in, documented pipeline warm-up (precompile every material for a scene during loading), so the first use of a stage or effect doesn't hitch.\n\nPrompt Feedback\n- What did you like most about this prompt? The deliverable is concrete (single file, name pattern, required sections) while animation, audio and genre adaptation are left open. The attract mode and the inverted-axis fix are specific, testable asks.\n- What was confusing? The hub protocol recommends a WebGL 2 fallback while the tech stack says WebGPU with no fallback; I resolved it with <meta name=\"hub:webgpu\" content=\"required\">. Which hub mode fits a 1v1 fighter was left to judgement (I chose side by side, since a fighter over 30–250 ms of latency needs rollback). \"Testing Feedback\" sits under Source Information but isn't in the CRITICAL list of sections; I included it everywhere.\n- What was the hardest thing to do? Scope: seven distinct fighters plus a boss and a secret mascot, an arcade story, versus, training, a bonus stage, attract mode, settings and hub integration, all in one pass, while keeping it a polished vertical slice.\n- If there was one test you could of run, what would that test be? A 60 FPS playtest on a real GPU with a real DualSense, to tune feel: frame data, hit-stop, dash and jump arcs, camera framing and audio mix.\n";

// ---------- input ----------
// Abstract buttons, modelled on a standard (DualSense) pad. Keyboard maps onto the same model.
const BTN = ['jump', 'special', 'light', 'heavy', 'dash', 'super', 'guard', 'harahara', 'create', 'start'];

    jump: ['Space'], light: ['KeyJ'], heavy: ['KeyK'], special: ['KeyL'],
    harahara: ['KeyI'], dash: ['KeyU'], super: ['KeyO'], guard: ['ShiftLeft', 'KeyH'], start: ['Escape'],
    confirm: ['Enter', 'Space', 'KeyJ'], back: ['Backspace', 'KeyK'], tabL: ['KeyQ'], tabR: ['KeyE'],
  },
  kb2: {
    up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'],
    jump: ['Numpad0', 'ShiftRight'], light: ['Numpad1', 'Comma'], heavy: ['Numpad2', 'Period'], special: ['Numpad3', 'Slash'],
    harahara: ['Numpad5', 'Quote'], dash: ['Numpad4', 'Semicolon'], super: ['Numpad6', 'BracketRight'], guard: ['NumpadAdd', 'BracketLeft'],
    start: ['NumpadEnter', 'Backquote'], confirm: ['NumpadEnter', 'Numpad0'], back: ['NumpadDecimal'],
  },

function blankState() {

  for (const a of ALL_ACTIONS) { s.held[a] = false; s.pressed[a] = false; s.released[a] = false; }
  return s;
}

const Input = {
  keys: new Set(),
  keyQueue: [],
  devices: {}, // id -> state ('kb1','kb2','pad0'..)
  prevHeld: {},
  lastActivity: performance.now(),
  anyPressed: false,
  menuRepeat: { dir: null, t: 0 },
  menu: { up: false, down: false, left: false, right: false, confirm: false, back: false, start: false, any: false, tabL: false, tabR: false },
  padsSeen: 0,
  keyboardSeen: false,
  rumbleEnabled: true,
  lastType: 'kb',
  init() {
    const down = (e) => {
      const code = e.code || e.key;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Backspace'].includes(code)) e.preventDefault();
      if (!this.keys.has(code)) this.keyQueue.push(code);
      this.keys.add(code);
      if (e.key === 'd' || e.key === 'D') this.keys.add('KeyD');
      this.keyboardSeen = true;
      this.lastActivity = performance.now();
    };
    const up = (e) => {
      const code = e.code || e.key;
      this.keys.delete(code);
      if (e.key === 'd' || e.key === 'D') this.keys.delete('KeyD');
    };
    window.addEventListener('keydown', down, true);
    window.addEventListener('keyup', up, true);
    window.addEventListener('blur', () => this.keys.clear());
    window.addEventListener('pointerdown', () => { this.lastActivity = performance.now(); });
    window.addEventListener('pointermove', () => { this.lastActivity = performance.now(); });
    window.addEventListener('gamepadconnected', () => { this.lastActivity = performance.now(); });
  },
  readKb(id) {

      const codes = map[a];

    }
    return held;
  },
  readPad(p) {
    const held = {};
    const b = (i) => !!(p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.5));
    for (const a of BTN) held[a] = b(PAD_INDEX[a]);
    let ax = p.axes[0] || 0;
    let ay = p.axes[1] || 0;
    let dl = b(14), dr = b(15), du = b(12), dd = b(13);
    if (S().invertX) { ax = -ax; [dl, dr] = [dr, dl]; }
    if (S().invertY) { ay = -ay; [du, dd] = [dd, du]; }
    const DZ = 0.45;
    held.left = dl || ax < -DZ;
    held.right = dr || ax > DZ;
    held.up = du || ay < -DZ;
    held.down = dd || ay > DZ;

      this.padObjs['pad' + p.index] = p;
    }
    this.padsSeen = Math.max(this.padsSeen, padCount);

        st.held[a] = held[a];
        st.pressed[a] = held[a] && !prev[a];

      this.prevHeld[id] = held;

  buildMenu() {

      const d = this.devices[id];

      if (d.pressed.back || (id.startsWith('pad') && d.pressed.special)) m.back = true;
      if (d.pressed.start) m.start = true;
      if (id.startsWith('pad') && d.pressed.dash) m.tabL = true;

    if (k1 && k1.pressed.tabR) m.tabR = true;

  /** Combined state for one fighter from a list of device ids (or all when ids is '*'). */
  combine(ids) {
    const out = blankState();
    const list = ids === '*' ? Object.keys(this.devices) : ids;
    for (const id of list) {
      const d = this.devices[id];
      if (!d) continue;
      for (const a of ALL_ACTIONS) {
        out.held[a] = out.held[a] || d.held[a];
        out.pressed[a] = out.pressed[a] || d.pressed[a];
      }

    out.x = (out.held.right ? 1 : 0) - (out.held.left ? 1 : 0);
    out.y = (out.held.up ? 1 : 0) - (out.held.down ? 1 : 0);

      const d = this.devices[id];
      if (d.pressed[action] || (id.startsWith('pad') && action === 'confirm' && d.pressed.jump)) return id;
    }
    return null;

    if (!S().rumble || !this.padObjs) return;
    for (const id of ids === '*' ? Object.keys(this.padObjs) : ids) {
      const p = this.padObjs[id];
      const act = p && p.vibrationActuator;
      if (act && act.playEffect) {
        act.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong, weakMagnitude: weak }).catch(() => {});
      }
    }
  },
  hasGamepad() { return Object.keys(this.devices).some((k) => k.startsWith('pad')); },

Input.init();

// ----- cel shading -----
let toonRamp = null;
function ramp() {
  if (toonRamp) return toonRamp;
  const data = new Uint8Array([70, 70, 70, 255, 160, 160, 160, 255, 255, 255, 255, 255]);
  toonRamp = new THREE.DataTexture(data, 3, 1, THREE.RGBAFormat);
  toonRamp.minFilter = THREE.NearestFilter; toonRamp.magFilter = THREE.NearestFilter;
  toonRamp.generateMipmaps = false; toonRamp.needsUpdate = true;
  return toonRamp;
}
const matCache = new Map();
function toon(col, opt = {}) {
  const key = col + '|' + (opt.emissive || 0) + '|' + (opt.ei || 0) + '|' + (opt.transparent ? opt.opacity : 1);
  if (!opt.unique && matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonNodeMaterial({ color: col, gradientMap: ramp() });
  if (opt.emissive) { m.emissive = new THREE.Color(opt.emissive); m.emissiveIntensity = opt.ei || 1; }
  if (opt.transparent) { m.transparent = true; m.opacity = opt.opacity; m.depthWrite = false; }
  if (!opt.unique) matCache.set(key, m);
  return m;
}
const flatCache = new Map();
function flat(col, opt = {}) {
  const key = col + '|' + (opt.opacity ?? 1) + '|' + (opt.side || 0) + '|' + (opt.add ? 1 : 0);
  if (!opt.unique && flatCache.has(key)) return flatCache.get(key);
  const m = new THREE.MeshBasicNodeMaterial({ color: col });
  if (opt.opacity != null && opt.opacity < 1) { m.transparent = true; m.opacity = opt.opacity; m.depthWrite = false; }
  if (opt.side) m.side = opt.side;
  if (opt.add) { m.blending = THREE.AdditiveBlending; m.transparent = true; m.depthWrite = false; }
  if (!opt.unique) flatCache.set(key, m);
  return m;
}
// Inverted-hull outlines: the hull is pushed out along normals in the vertex stage (TSL).
const outlineCache = new Map();
function outlineMat(w) {
  const k = w.toFixed(4);
  if (outlineCache.has(k)) return outlineCache.get(k);
  const m = new THREE.MeshBasicNodeMaterial({ color: OUTLINE, side: THREE.BackSide });
  m.positionNode = positionLocal.add(normalLocal.mul(float(w)));
  outlineCache.set(k, m);
  return m;
}
function addOutline(mesh, w = 0.03) {
  const geo = mesh.geometry;
  let o;
  if (geo.type === 'BoxGeometry') {
    const p = geo.parameters;
    o = new THREE.Mesh(geo, flat(OUTLINE, { side: THREE.BackSide }));
    o.scale.set(1 + (2 * w) / p.width, 1 + (2 * w) / p.height, 1 + (2 * w) / p.depth);
  } else {
    o = new THREE.Mesh(geo, outlineMat(w));
  }
  o.castShadow = false; o.receiveShadow = false;
  o.userData.isOutline = true;
  mesh.add(o);
  return mesh;
}
// geometry helpers
const G = {
  box: (w, h, d) => new THREE.BoxGeometry(w, h, d),
  sph: (r, s = 20) => new THREE.SphereGeometry(r, s, Math.round(s * 0.75)),
  cyl: (rt, rb, h, s = 16) => new THREE.CylinderGeometry(rt, rb, h, s),
  cap: (r, l) => new THREE.CapsuleGeometry(r, l, 6, 14),
  cone: (r, h, s = 16) => new THREE.ConeGeometry(r, h, s),
  tor: (r, t) => new THREE.TorusGeometry(r, t, 10, 28),
};
function mk(geo, mat, x = 0, y = 0, z = 0, opt = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = opt.cast !== false;
  m.receiveShadow = opt.receive !== false;
  if (opt.outline !== false) addOutline(m, opt.ow || 0.03);
  return m;
}

// ----- sky -----
function skyDome(bottom, top, horizon) {
  const m = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide, fog: false });
  const y = positionLocal.normalize().y;
  const lower = mix(color(bottom), color(horizon), smoothstep(float(-0.2), float(0.05), y));
  m.colorNode = mix(lower, color(top), smoothstep(float(0.04), float(0.55), y));
  const s = new THREE.Mesh(new THREE.SphereGeometry(180, 32, 16), m);
  s.castShadow = false; s.receiveShadow = false;
  return s;
}

function lightRig(g, o) {

  sun.castShadow = true;

// ----- camera -----
function updateCamera(dt, focus) {
  const c = R.cam;
  let tx, ty, tz, ly, fov = 34;
  if (c.override) {
    const o = c.override;
    tx = o.x; ty = o.y; tz = o.z; ly = o.ly; fov = o.fov || 30;
    o.t -= dt; if (o.t <= 0) c.override = null;
  } else {
    const spread = focus.spread;
    tx = clamp(focus.x, -STAGE_BOUND + 3.2, STAGE_BOUND - 3.2);
    tz = clamp(5.4 + spread * 0.55, 6.4, 10.5);
    ty = 1.7 + Math.max(0, focus.y * 0.45) + (tz - 6.4) * 0.1;
    ly = 1.15 + Math.max(0, focus.y * 0.5);
  }
  const k = c.override ? 7 : 4;
  c.x = damp(c.x, tx, k, dt); c.y = damp(c.y, ty, k, dt); c.z = damp(c.z, tz, k, dt); c.lookY = damp(c.lookY, ly, k, dt);
  c.fov = damp(c.fov, fov, 5, dt);
  c.lx = damp(c.lx ?? tx, c.override && c.override.lx != null ? c.override.lx : tx, k, dt);
  c.shake = Math.max(0, c.shake - dt * 2.5);
  const sh = S().shake ? c.shake : 0;
  const sx = (Math.random() - 0.5) * sh * 0.5, sy = (Math.random() - 0.5) * sh * 0.5;
  R.camera.position.set(c.x + sx, c.y + sy, c.z);
  R.camera.lookAt(c.lx + sx * 0.5, c.lookY + sy, 0);
  if (Math.abs(R.camera.fov - c.fov) > 0.01) { R.camera.fov = c.fov; R.camera.updateProjectionMatrix(); }
  // dimmer for supers
  R.dim.material.opacity = damp(R.dim.material.opacity, R.dimTarget, 10, dt);
  R.dim.position.x = c.x;
}
function shake(amount) { R.cam.shake = Math.min(1.5, R.cam.shake + amount); }

  R.clock += dt;
  updateAmbient(dt);
  updateFx(dt);
  const want = S().bloom;
  if (want !== R.bloomOn) { R.bloomOn = want; R.post.outputNode = want ? R.postWithBloom : R.postPlain; R.post.needsUpdate = true; }

    const eL = mk(eyeG, dark, 0.1 * k, 0, 0, { outline: false }); const eR = mk(eyeG, dark, -0.1 * k, 0, 0, { outline: false });
    face.add(eL, eR); face.userData.eyes = [eL, eR];
    const mouth = mk(G.tor(0.06 * k, 0.015 * k), dark, 0, -0.12 * k, 0, { outline: false }); face.add(mouth); face.userData.mouth = mouth;
  }
  // hair / hats / ears
  const hy = hr * 0.75;
  const hairStyle = look.hairStyle || 'none';
  if (hairStyle === 'spiky') {
    part(G.sph(hr * 1.04, 16), hair, 0, hy + hr * 0.08, -hr * 0.08, J.head).scale.set(1, 0.9, 1);
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2;
      const sp = part(G.cone(hr * 0.28, hr * 0.9, 8), hair, Math.cos(a) * hr * 0.6, hy + hr * 0.6, Math.sin(a) * hr * 0.5 - hr * 0.25, J.head);
      sp.rotation.set(Math.sin(a) * -0.9 - 0.3, 0, Math.cos(a) * -0.9);
    }
  } else if (hairStyle === 'bob' || hairStyle === 'long') {
    part(G.sph(hr * 1.08, 16), hair, 0, hy + hr * 0.1, -hr * 0.1, J.head).scale.set(1.04, 0.95, 1);
    part(G.box(hr * 1.6, hr * 0.35, hr * 0.5), hair, 0, hy + hr * 0.62, hr * 0.55, J.head).rotation.x = 0.4; // bangs
    if (hairStyle === 'long') { const p = part(G.cap(hr * 0.55, hr * 1.4), hair, 0, hy - hr * 0.6, -hr * 0.5, J.head); p.rotation.x = 0.2; }
    else { part(G.sph(hr * 0.55, 12), hair, hr * 0.85, hy - hr * 0.3, -hr * 0.1, J.head); part(G.sph(hr * 0.55, 12), hair, -hr * 0.85, hy - hr * 0.3, -hr * 0.1, J.head); }
  } else if (hairStyle === 'slick') {
    part(G.sph(hr * 1.05, 16), hair, 0, hy + hr * 0.12, -hr * 0.15, J.head).scale.set(1, 0.85, 1.05);
    const fl = part(G.cone(hr * 0.5, hr * 1.4, 8), hair, 0, hy + hr * 0.4, -hr * 0.9, J.head); fl.rotation.x = -2.0;
  } else if (hairStyle === 'bun') {
    part(G.sph(hr * 1.05, 16), hair, 0, hy + hr * 0.1, -hr * 0.1, J.head);
    part(G.sph(hr * 0.42, 12), hair, hr * 0.7, hy + hr * 0.75, -hr * 0.2, J.head);
    part(G.sph(hr * 0.42, 12), hair, -hr * 0.7, hy + hr * 0.75, -hr * 0.2, J.head);
  }
  const ex = look.extras || [];
  if (ex.includes('bunnyEars')) {
    for (const s of [1, -1]) {
      const e = part(G.cap(hr * 0.2, hr * 1.5), M(0xffffff, { keep: true }), s * hr * 0.4, hy + hr * 1.6, -hr * 0.1, J.head);
      e.rotation.z = -s * 0.2;
      e.add(mk(G.cap(hr * 0.1, hr * 1.1), M(0xff9ab8, { keep: true }), 0, 0, hr * 0.12, { outline: false }));
      e.userData.ear = s;
    }
  }
  if (ex.includes('fedora')) {
    part(G.cyl(hr * 1.6, hr * 1.6, hr * 0.08, 20), acc, 0, hy + hr * 0.75, 0, J.head);
    part(G.cyl(hr * 0.85, hr * 1.0, hr * 0.7, 18), acc, 0, hy + hr * 1.05, 0, J.head);
    part(G.cyl(hr * 1.01, hr * 1.01, hr * 0.15, 18), dark, 0, hy + hr * 0.82, 0, J.head);
  }
  if (ex.includes('maidCap')) {
    part(G.box(hr * 1.4, hr * 0.3, hr * 0.2), white, 0, hy + hr * 1.0, hr * 0.15, J.head).rotation.x = -0.3;
  }
  if (ex.includes('catEars') || ex.includes('beastEars')) {
    const col = ex.includes('beastEars') ? top : hair;
    for (const s of [1, -1]) { const e = part(G.cone(hr * 0.35, hr * 0.7, 6), col, s * hr * 0.6, hy + hr * 0.95, 0, J.head); e.rotation.z = -s * 0.35; }
  }
  if (ex.includes('horns')) {
    for (const s of [1, -1]) { const e = part(G.cone(hr * 0.25, hr * 1.4, 8), M(0xf4e6c8, { keep: true }), s * hr * 0.7, hy + hr * 0.9, -hr * 0.2, J.head); e.rotation.z = -s * 0.6; e.rotation.x = -0.4; }
  }
  if (ex.includes('crown')) {
    const c = part(G.cyl(hr * 0.7, hr * 0.6, hr * 0.4, 8, 1, true), M(0xffd23a, { keep: true, emissive: 0x6a4a00, ei: 0.6 }), 0, hy + hr * 1.05, 0, J.head);
    c.material.side = THREE.DoubleSide;
  }
  if (ex.includes('scarf')) {
    part(G.tor(0.15 * k, 0.05 * k), acc, 0, 0.0, 0, J.head).rotation.x = Math.PI / 2;
    const tail = part(G.box(0.08 * k, 0.4 * k, 0.03 * k), acc, 0.08 * k, -0.15 * k, -0.18 * k, J.head);
    tail.userData.scarf = true; tail.rotation.x = 0.6;
  }
  if (ex.includes('cape')) {
    const cape = part(G.box(0.52 * k, 0.95 * k, 0.03), acc, 0, -0.4 * k, -0.2 * k, J.chest, { ow: 0.015 });
    cape.userData.cape = true;
  }
  if (ex.includes('tail')) {
    const t = part(G.cone(0.14 * k, 0.9 * k, 10), top, 0, 0, -0.35 * k, J.hips);
    t.rotation.x = -2.2; t.userData.tail = true;
  }
  if (ex.includes('rider')) { // tiny kid riding on the fluffy spirit's head
    const kid = new THREE.Group();
    kid.add(mk(G.sph(0.11, 14), skin, 0, 0.3, 0));
    kid.add(mk(G.sph(0.115, 12), M(0x4a2a1a, { keep: true }), 0, 0.33, -0.02));
    kid.add(mk(G.cap(0.07, 0.1), M(0xffd23a, { keep: true }), 0, 0.12, 0));
    kid.add(mk(G.sph(0.022, 6), dark, 0.04, 0.3, 0.1, { outline: false }));
    kid.add(mk(G.sph(0.022, 6), dark, -0.04, 0.3, 0.1, { outline: false }));
    kid.position.set(0, hy + hr * 0.8, -0.05);
    kid.userData.rider = true;
    J.head.add(kid);
  }
  if (ex.includes('apron')) part(G.box(0.3 * k, 0.45 * k, 0.03), white, 0, -0.1 * k, 0.17 * k, J.hips);
  if (ex.includes('vest')) part(G.box(0.36 * gt * k, 0.34 * k, 0.32 * k), acc, 0, 0.2 * k, 0, J.spine);

  // ----- arms -----
  const armR = (type === 'fluff' ? 0.13 : type === 'boss' ? 0.11 : 0.065) * k * (look.armThick || 1);
  for (const s of ['L', 'R']) {
    const sleeve = look.sleeves === false ? skin : top;
    if (type === 'robot') {
      part(G.box(armR * 2.4, ua * 0.9, armR * 2.4), sleeve, 0, -ua * 0.5, 0, J['uarm' + s]);
      part(G.sph(armR * 1.6, 10), M(0x9aa4b8, { keep: true }), 0, 0, 0, J['uarm' + s]);
    } else {
      part(G.cap(armR, ua * 0.7), sleeve, 0, -ua * 0.5, 0, J['uarm' + s]);
    }
    const isDrill = look.weapon === 'drill' && s === 'R';
    const isCannon = look.weapon === 'cannon' && s === 'R';
    if (isDrill) {
      part(G.cyl(armR * 2.2, armR * 1.6, ua * 0.6, 14), M(0x9aa4b8, { keep: true }), 0, -ua * 0.3, 0, J.farmR);
      const d = part(G.cone(armR * 2.2, ua * 1.3, 10), M(0xffc02a, { keep: true }), 0, -ua * 1.2, 0, J.farmR);
      d.rotation.x = Math.PI; d.userData.drill = true;
    } else if (isCannon) {
      part(G.cyl(armR * 1.8, armR * 1.8, ua * 1.0, 14), M(0x5a6070, { keep: true }), 0, -ua * 0.55, 0, J.farmR);
      part(G.cyl(armR * 1.2, armR * 1.2, 0.05, 14), M(0x22eaff, { keep: true, emissive: 0x22eaff, ei: 2 }), 0, -ua * 1.06, 0, J.farmR);
    } else {
      if (type === 'robot') part(G.box(armR * 2.2, ua * 0.9, armR * 2.2), sleeve, 0, -ua * 0.5, 0, J['farm' + s]);
      else part(G.cap(armR * 0.92, ua * 0.7), look.gloves ? acc : skin, 0, -ua * 0.5, 0, J['farm' + s]);
      const handCol = look.gloves ? acc : type === 'fluff' ? top : skin;
      part(G.sph(armR * (type === 'fluff' ? 1.5 : 1.35), 12), handCol, 0, 0, 0, J['hand' + s]);
      if (type === 'boss' || ex.includes('claws')) {
        for (let i = -1; i <= 1; i++) { const c = part(G.cone(armR * 0.3, armR * 1.4, 6), M(0xf4e6c8, { keep: true }), i * armR * 0.6, -armR * 1.2, armR * 0.4, J['hand' + s]); c.rotation.x = Math.PI; }
      }
    }
  }
  // weapons held in the right hand
  const W = new THREE.Group(); J.handR.add(W); J.weapon = W;
  W.rotation.x = -0.35;
  if (look.weapon === 'bat') {
    part(G.cyl(0.045 * k, 0.025 * k, 0.75 * k, 10), M(0xd9a86a, { keep: true }), 0, -0.36 * k, 0, W);
    part(G.cyl(0.03 * k, 0.03 * k, 0.12 * k, 8), M(0x2a6ad8, { keep: true }), 0, -0.02, 0, W);
  } else if (look.weapon === 'mallet') {
    part(G.cyl(0.025 * k, 0.025 * k, 0.6 * k, 8), M(0x8a5a3a, { keep: true }), 0, -0.3 * k, 0, W);
    const h = part(G.cone(0.13 * k, 0.42 * k, 12), M(0xff8a2a, { keep: true }), 0, -0.62 * k, 0, W); h.rotation.z = Math.PI / 2;
    const leaf = part(G.cone(0.08 * k, 0.18 * k, 6), M(0x3ac24a, { keep: true }), -0.24 * k, -0.62 * k, 0, W); leaf.rotation.z = Math.PI / 2;
  } else if (look.weapon === 'sword') {
    part(G.box(0.05 * k, 0.85 * k, 0.012 * k + 0.02), M(0xdfe8ff, { keep: true, emissive: 0x6a4aff, ei: 0.35 }), 0, -0.5 * k, 0, W);
    part(G.box(0.2 * k, 0.04 * k, 0.06 * k), M(0x3a2a4a, { keep: true }), 0, -0.07 * k, 0, W);
  } else if (look.weapon === 'whip') {
    const wh = part(G.cyl(0.018 * k, 0.012 * k, 1.0 * k, 6), M(0x6a3a1a, { keep: true }), 0, -0.5 * k, 0, W, { ow: 0.01 });
    wh.userData.whip = true;
  }
  // legs
  const legR = (type === 'fluff' ? 0.16 : type === 'boss' ? 0.14 : 0.085) * k * (look.legThick || 1);
  for (const s of ['L', 'R']) {
    if (type === 'robot') {
      part(G.box(legR * 2, tl * 0.9, legR * 2), bottom, 0, -tl * 0.5, 0, J['thigh' + s]);
      const tread = part(G.box(legR * 2.6, tl * 0.75, tl * 1.4), M(0x2a2a34, { keep: true }), 0, -tl * 0.55, 0.05, J['shin' + s]);
      for (let i = 0; i < 3; i++) tread.add(mk(G.cyl(tl * 0.18, tl * 0.18, legR * 2.7, 10), M(0x8a8a9a, { keep: true }), 0, -tl * 0.15, (i - 1) * tl * 0.45, { outline: false })).children;
      tread.children.forEach((c) => { if (c.geometry && c.geometry.type === 'CylinderGeometry') c.rotation.z = Math.PI / 2; });
    } else {
      part(G.cap(legR, tl * 0.6), look.shorts ? bottom : bottom, 0, -tl * 0.5, 0, J['thigh' + s]);
      part(G.cap(legR * 0.9, tl * 0.6), look.bareLegs ? skin : bottom, 0, -tl * 0.5, 0, J['shin' + s]);
      const foot = part(G.box(legR * 2.1, legR * 1.3, legR * 3.2), shoe, 0, -tl, legR * 0.7, J['shin' + s]);
      foot.userData.foot = true;
    }
  }
  // drop shadow blob helps read height in the 2.5D view
  const blob = new THREE.Mesh(new THREE.CircleGeometry(0.45 * gt * k * (type === 'fluff' ? 1.6 : 1), 20), flat(0x000000, { opacity: 0.25 }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.012;
  root.add(blob);
  root.traverse((o) => { if (o.isMesh && !o.userData.isOutline) o.castShadow = true; });
  blob.castShadow = false; blob.receiveShadow = false;

  const rig = { root, body, J, mats, face, blob, look, k, hipY, cur: {}, time: Math.random() * 10, blink: 2 };
  for (const j of JOINTS) rig.cur[j] = [0, 0, 0];
  rig.cur.y = 0; rig.cur.rx = 0; rig.cur.rz = 0; rig.cur.by = 0;
  return rig;
}

/**
 * Drive a rig toward a pose. extra: { walk, speed, breathe, lean, squash, flash, eyes }.
 */
function animateRig(rig, pose, dt, ex = {}) {
  rig.time += dt;
  const k = ex.speed || 16;
  const t = rig.time;
  const tgt = {};
  for (const j of JOINTS) {
    const v = pose[j] || [0, 0, 0];
    tgt[j] = [v[0], v[1], v[2]];
  }
  let y = pose.y || 0;
  // procedural layers
  if (ex.breathe) {
    tgt.chest[0] += Math.sin(t * 3) * 0.04;
    tgt.uarmR[0] += Math.sin(t * 3 + 0.5) * 0.06;
    tgt.uarmL[0] += Math.sin(t * 3 + 0.8) * 0.06;
    y += Math.sin(t * 3) * 0.015;
  }
  if (ex.walk) {
    const ph = t * 9 * Math.abs(ex.walk);
    const dir = sign(ex.walk);
    tgt.thighL[0] = -0.2 + Math.sin(ph) * 0.55 * dir;
    tgt.thighR[0] = -0.2 - Math.sin(ph) * 0.55 * dir;
    tgt.shinL[0] = 0.35 + Math.max(0, Math.cos(ph)) * 0.9;
    tgt.shinR[0] = 0.35 + Math.max(0, -Math.cos(ph)) * 0.9;
    y += Math.abs(Math.sin(ph)) * 0.04 - 0.04;
    tgt.spine[0] += 0.08 * dir;
  }
  for (const j of JOINTS) {
    const c = rig.cur[j];
    for (let i = 0; i < 3; i++) c[i] = damp(c[i], tgt[j][i], k, dt);
    rig.J[j].rotation.set(c[0], c[1], c[2]);
  }
  rig.cur.y = damp(rig.cur.y, y, k, dt);
  rig.cur.rx = damp(rig.cur.rx, pose.rx || 0, k * 0.6, dt);
  rig.J.hips.position.y = rig.hipY + rig.cur.y * rig.k;
  rig.body.rotation.x = rig.cur.rx;
  if (pose.rx) rig.body.position.y = Math.abs(Math.sin(rig.cur.rx)) * 0.25 * rig.k; else rig.body.position.y = 0;
  // squash & stretch
  const sq = ex.squash || 0;
  rig.body.scale.set(1 + sq * 0.5, 1 - sq, 1 + sq * 0.5);
  // flash (hit / super)
  const fl = ex.flash || 0;
  if (fl !== rig.lastFlash) {
    for (const m of rig.mats) {
      if (!m.userData.baseE) m.userData.baseE = { c: m.emissive.clone(), i: m.emissiveIntensity };
      if (fl > 0) { m.emissive.set(ex.flashColor || 0xffffff); m.emissiveIntensity = fl; }
      else { m.emissive.copy(m.userData.baseE.c); m.emissiveIntensity = m.userData.baseE.i; }
    }
    rig.lastFlash = fl;
  }
  // blink / expressions
  if (rig.face && rig.face.userData.eyes) {
    rig.blink -= dt;
    let ey = 1;
    if (rig.blink < 0) { ey = 0.1; if (rig.blink < -0.12) rig.blink = 2 + Math.random() * 3; }
    if (ex.eyes === 'hurt') ey = 0.25;
    for (const e of rig.face.userData.eyes) e.scale.y = damp(e.scale.y, ey, 30, dt);
    const mo = rig.face.userData.mouth;
    if (mo) { const ms = ex.mouth || 1; mo.scale.y = damp(mo.scale.y, ms, 20, dt); }
  }
  // secondary motion
  rig.root.traverse((o) => {
    const u = o.userData;
    if (u.ear) o.rotation.x = Math.sin(t * 4 + u.ear) * 0.12 + (ex.walk ? 0.3 : 0);
    else if (u.cape) o.rotation.x = 0.15 + Math.abs(ex.walk || 0) * 0.5 + Math.sin(t * 5) * 0.06;
    else if (u.scarf) o.rotation.x = 0.6 + Math.sin(t * 7) * 0.2 + Math.abs(ex.walk || 0) * 0.4;
    else if (u.tail) o.rotation.z = Math.sin(t * 2.5) * 0.3;
    else if (u.drill) o.rotation.y += dt * (ex.drill ? 40 : 4);
    else if (u.siren) o.material.emissiveIntensity = 1 + Math.sin(t * 12) * 1;
    else if (u.rider) o.rotation.z = Math.sin(t * 3) * 0.1;
    else if (u.whip) o.scale.y = ex.whip ? 2.6 : 1;
  });
}

// ---------- fight engine: fixed 60 Hz simulation ----------
const DT = 1 / 60;
const GRAV = 36;
const MAX_GAP = 9.6;
const BUFFER = 10;
const METER_MAX = 300;

// ----- Rapier: stage props, debris and star shards -----
let rapierReady = false;
async function initPhysics() {
  if (rapierReady) return;
  await RAPIER.init();
  rapierReady = true;
}
class Phys {
  constructor(stage) {
    this.world = new RAPIER.World({ x: 0, y: -22, z: 0 });
    this.world.timestep = DT;
    this.items = [];
    const W = this.world;
    const fix = (x, y, z, hx, hy, hz) => W.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setTranslation(x, y, z).setFriction(0.8).setRestitution(0.2));
    fix(0, -0.5, 0, 40, 0.5, 20);
    fix(0, 5, -4.2, 40, 6, 0.2);
    fix(0, 5, 4.5, 40, 6, 0.2);
    fix(-11.5, 5, 0, 0.3, 6, 6);
    fix(11.5, 5, 0, 0.3, 6, 6);
    // fighters are kinematic slabs spanning the depth lane, so walking or flying into props shoves them
    this.fBodies = [0, 1].map(() => {
      const b = W.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(0, -5, 0));
      W.createCollider(RAPIER.ColliderDesc.cuboid(0.35, 0.85, 2.6), b);
      return b;
    });
    for (const p of stage.props) this.addProp(p);
  }
  addProp(p, life = Infinity) {
    const W = this.world;
    let mesh, cd;
    const s = p.s;
    if (p.shape === 'box') { mesh = mk(G.box(s, s, s), toon(p.color)); cd = RAPIER.ColliderDesc.cuboid(s / 2, s / 2, s / 2); }
    else if (p.shape === 'ball') { mesh = mk(G.sph(s, 16), toon(p.color)); cd = RAPIER.ColliderDesc.ball(s).setRestitution(0.7); }
    else if (p.shape === 'barrel') { mesh = mk(G.cyl(s, s, s * 2.2, 14), toon(p.color)); cd = RAPIER.ColliderDesc.cylinder(s * 1.1, s); }
    else if (p.shape === 'lantern') {
      mesh = mk(G.sph(s, 14), toon(p.color, { emissive: p.color, ei: 0.8 }));
      mesh.scale.y = 1.3; cd = RAPIER.ColliderDesc.ball(s);
    } else if (p.shape === 'star') {
      mesh = mk(new THREE.OctahedronGeometry(s, 0), toon(0xffe14a, { emissive: 0xffb000, ei: 1.2 }), 0, 0, 0, { ow: 0.02 });
      cd = RAPIER.ColliderDesc.ball(s * 0.8).setRestitution(0.8);
    } else { mesh = mk(G.box(s, s, s), toon(p.color), 0, 0, 0, { ow: 0.015 }); cd = RAPIER.ColliderDesc.cuboid(s / 2, s / 2, s / 2).setRestitution(0.4); }
    const y = p.y ?? s + 0.05;
    const body = W.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(p.x, y, p.z).setLinearDamping(0.15).setAngularDamping(0.3));
    W.createCollider(cd.setDensity(p.density ?? 0.6).setFriction(0.7), body);
    R.scene.add(mesh);
    const item = { body, mesh, life, kind: p.shape };
    this.items.push(item);
    return item;
  }
  blast(x, y, power, radius = 3.2) {
    for (const it of this.items) {
      const t = it.body.translation();
      const dx = t.x - x, dy = t.y - y;
      const d = Math.hypot(dx, dy, t.z * 0.3);
      if (d > radius) continue;
      const f = power * (1 - d / radius) * it.body.mass();
      it.body.wakeUp();
      it.body.applyImpulse({ x: sign(dx) * f * 0.9, y: f * 1.1, z: (Math.random() - 0.5) * f * 0.4 }, true);
      it.body.applyTorqueImpulse({ x: (Math.random() - 0.5) * f * 0.3, y: (Math.random() - 0.5) * f * 0.3, z: (Math.random() - 0.5) * f * 0.3 }, true);
    }
  }
  debris(x, y, n, col, speed = 6) {
    for (let i = 0; i < n; i++) {
      const it = this.addProp({ shape: 'chip', s: 0.1 + Math.random() * 0.12, x: x + (Math.random() - 0.5) * 0.5, y: y + Math.random() * 0.4, z: (Math.random() - 0.5) * 0.8, color: col, density: 0.3 }, 2.5 + Math.random());
      it.body.setLinvel({ x: (Math.random() - 0.5) * speed, y: 3 + Math.random() * speed, z: (Math.random() - 0.5) * speed * 0.6 }, true);
      it.body.setAngvel({ x: Math.random() * 10, y: Math.random() * 10, z: Math.random() * 10 }, true);
    }
  }
