        if (r() < blockP) {
          if (r() < 0.3 && L >= 3) this.queue = [{ hold: ['up', fwd], f: 4 }, { wait: 14 }, { press: 'heavy' }];
          else { this.guardUntil = me.frame + 24; this.guardLow = false; this.queue = []; }
        }
      }
    }
    if (this.seenProj.size > 20) this.seenProj.clear();
    // just-guard timing for harahara: release then press back right before impact
    if (this.justGuard && me.frame < this.justGuard) { this.applyHold(s, [], fwd, back); return s; }
    if (me.frame < this.guardUntil && !this.queue.length) {
      s.held[back] = true; if (this.guardLow) s.held.down = true;
      if (me.state === 'blockstun' && me.meter >= 50 && L >= 4 && r() < 0.02) s.pressed.dash = true;
      return s;
    }
    this.justGuard = 0;
    // knockdown: mash quick-rise sometimes
    if (me.state === 'knockdown' && me.sf <= 1 && r() < L * 0.15) { s.pressed.light = true; return s; }
    // ---- run the current plan ----
    if (this.queue.length) {
      const step = this.queue[0];
      if (step.wait != null) { if (--step.wait <= 0) this.queue.shift(); return s; }
      this.applyHold(s, step.hold || [], fwd, back);
      if (step.press && !step.done) { s.pressed[step.press] = true; s.held[step.press] = true; if (step.press2) s.pressed[step.press2] = true; step.done = true; }
      step.f = (step.f ?? 1) - 1;
      if (step.f <= 0) this.queue.shift();
      return s;
    }
    if (--this.wait > 0) return s;
    this.wait = [0, 26, 16, 10, 6, 3][L] + Math.floor(r() * 10);
    this.decide(me, o, match, dist, fwd, back);
    return s;
  }
  applyHold(s, hold, fwd, back) {
    for (const h of hold) {
      const k = h === 'fwd' ? fwd : h === 'back' ? back : h;
      s.held[k] = true; if (k === 'up') s.pressed.up = true;
    }
  }
  plan(name, me, o) {
    const Q = (...a) => { this.queue = a; };
    switch (name) {
      case 'super': Q({ press: 'super', f: 2 }); break;
      case 'harahara': Q({ press: 'harahara', f: 2 }); break;
      case 'sp_n': Q({ hold: [], press: 'special', f: 3 }); break;
      case 'sp_f': Q({ hold: ['down'], f: 2 }, { hold: ['down', 'fwd'], f: 2 }, { hold: ['fwd'], press: 'special', f: 3 }); break;
      case 'sp_u': Q({ hold: ['up'], press: 'special', f: 2 }); break;
      case 'sp_d': Q({ hold: ['down'], press: 'special', f: 3 }); break;
      case 'jabChain': Q({ press: 'light' }, { wait: 7 }, { press: 'light' }, { wait: 7 }, { press: 'light' }, { wait: 8 }, { hold: ['fwd'], press: 'special', f: 3 }); break;
      case 'crouchChain': Q({ hold: ['down'], press: 'light', f: 6 }, { hold: ['down'], f: 2 }, { hold: ['down'], press: 'light', f: 8 }); break;
      case 'launcher': Q({ hold: ['down'], press: 'heavy', f: 14 }, { hold: ['up', 'fwd'], f: 6 }, { wait: 6 }, { press: 'light' }, { wait: 9 }, { press: 'heavy' }); break;
      case 'throw': Q({ hold: ['fwd'], f: 6 }, { press: 'light', press2: 'heavy' }); break;
      case 'heavySp': Q({ press: 'heavy' }, { wait: 12 }, { press: 'special', f: 2 }); break;
      case 'jumpIn': Q({ hold: ['up', 'fwd'], f: 4 }, { wait: 16 }, { press: 'heavy' }, { wait: 14 }, { press: 'light' }, { wait: 7 }, { press: 'light' }); break;
      case 'dash': Q({ press: 'dash', f: 2 }, { wait: 8 }, { press: 'light' }); break;
      case 'walk': Q({ hold: ['fwd'], f: 14 + Math.floor(Math.random() * 18) }); break;
      case 'backoff': Q({ hold: ['back'], f: 14 + Math.floor(Math.random() * 10) }); break;
      case 'overhead': Q({ hold: ['fwd'], press: 'heavy', f: 2 }); break;
      case 'airdash': Q({ hold: ['up', 'fwd'], f: 4 }, { wait: 12 }, { press: 'dash' }, { wait: 6 }, { press: 'heavy' }); break;
      default: Q({ wait: 10 });
    }
  }
  decide(me, o, match, dist, fwd, back) {
    const r = Math.random;
    const L = this.level;
    if (!GROUNDED_NEUTRAL.has(me.state) && me.state !== 'dash') return;
    const hasProj = !!(me.def.sp.n && me.def.sp.n.proj);
    if (this.style === 'bonus') {
      if (dist > 1.6) this.plan(r() < 0.2 ? 'sp_f' : 'walk', me, o);
      else this.plan(r() < 0.5 ? 'jabChain' : r() < 0.5 ? 'sp_d' : 'backoff', me, o);
      return;
    }
    if (this.style === 'attract' && r() < 0.45) {
      const pick = SHOWCASE[this.show++ % SHOWCASE.length];
      if ((pick === 'super' && dist < 4.5) || pick === 'harahara' || dist < 2.5 || pick.startsWith('sp_') || pick === 'jumpIn' || pick === 'dash') { this.plan(pick, me, o); return; }
    }
    if (o.state === 'dizzy') { this.plan(me.meter >= 100 ? 'super' : dist < 2 ? 'harahara' : 'walk', me, o); return; }
    if (o.state === 'knockdown' || o.state === 'getup') { this.plan(dist > 2 ? 'walk' : r() < 0.5 ? 'backoff' : 'walk', me, o); return; }
    if (o.airborne && o.state === 'air' && dist < 3 && r() < [0, 0.15, 0.35, 0.6, 0.8, 0.9][L]) { this.plan(r() < 0.6 ? 'sp_u' : 'launcher', me, o); return; }
    if (me.meter >= 100 && dist < 3 && r() < 0.06 * L) { this.plan('super', me, o); return; }
    if (dist > 4.2) {
      const c = r();
      if (hasProj && c < 0.35) this.plan('sp_n', me, o);
      else if (c < 0.5) this.plan('dash', me, o);
      else if (c < 0.6 && L >= 3) this.plan('airdash', me, o);
      else this.plan('walk', me, o);
    } else if (dist > 2.2) {
      const c = r();
      if (c < 0.4) this.plan('walk', me, o);
      else if (c < 0.58) this.plan('jumpIn', me, o);
      else if (c < 0.72) this.plan('sp_f', me, o);
      else if (c < 0.82 && hasProj) this.plan('sp_n', me, o);
      else if (c < 0.9) this.plan('dash', me, o);
      else this.plan(me.def.boss ? 'sp_u' : 'sp_d', me, o);
    } else {
      const c = r();
      if (c < 0.3) this.plan('jabChain', me, o);
      else if (c < 0.42) this.plan('crouchChain', me, o);
      else if (c < 0.52) this.plan('throw', me, o);
      else if (c < 0.62) this.plan('launcher', me, o);
      else if (c < 0.7) this.plan('heavySp', me, o);
      else if (c < 0.76) this.plan('overhead', me, o);
      else if (c < 0.8) this.plan('harahara', me, o);
      else if (c < 0.88) this.plan(me.def.boss ? 'sp_d' : 'sp_u', me, o);
      else this.plan('backoff', me, o);
    }
  }
}

// ---------- UI: screens, overlays, menus and HUD (controller-first, 10-foot) ----------
const GLYPH = {
  pad: { jump: '✕', special: '○', light: '□', heavy: '△', dash: 'L1', super: 'R1', guard: 'L2', harahara: 'R2', start: 'OPTIONS', confirm: '✕', back: '○', tabL: 'L1', tabR: 'R1', move: 'L-Stick' },
  kb: { jump: 'Space', special: 'L', light: 'J', heavy: 'K', dash: 'U', super: 'O', guard: 'Shift', harahara: 'I', start: 'Esc', confirm: 'Enter', back: 'Backspace', tabL: 'Q', tabR: 'E', move: 'WASD' },
};
const glyph = (a) => {
  const t = Input.lastType === 'pad' ? 'pad' : 'kb';
  const g = GLYPH[t][a];
  const cls = t === 'pad' && ['✕', '○', '□', '△'].includes(g) ? ' face f' + '✕○□△'.indexOf(g) : '';
  return `<span class="key${cls}">${esc(g)}</span>`;
};
const footer = (pairs) => `<div class="footer">${pairs.map(([a, t]) => `<span>${glyph(a)} ${esc(t)}</span>`).join('')}</div>`;

// ----- generic focusable menu -----
class Menu {
  constructor(host, items, opt = {}) {
    this.host = host; this.items = items; this.i = opt.start || 0; this.opt = opt;
    this.render();
  }
  render() {
    this.host.innerHTML = '';
    this.els = this.items.map((it, idx) => {
      const e = el('button', 'mi' + (it.type ? ' t-' + it.type : '') + (it.disabled ? ' disabled' : ''));
      e.addEventListener('mouseenter', () => { if (this.i !== idx) { this.i = idx; this.paint(); Sound.sfx('menuMove'); } });
      e.addEventListener('click', (ev) => {
        ev.preventDefault();
        this.i = idx;
        if (it.type === 'slider' || it.type === 'choice' || it.type === 'toggle') {
          const r = e.getBoundingClientRect();
          this.adjust(it.type === 'toggle' ? 1 : ev.clientX < r.left + r.width * 0.6 ? -1 : 1);
        } else this.activate();
      });
      this.host.appendChild(e);
      return e;
    });
    this.paint();
  }
  label(it) {
    const v = it.get ? it.get() : null;
    if (it.type === 'toggle') return `<b>${esc(it.label)}</b><em class="val ${v ? 'on' : 'off'}">${v ? 'ON' : 'OFF'}</em>`;
    if (it.type === 'slider') { const p = Math.round(v * 100); return `<b>${esc(it.label)}</b><em class="val"><span class="arrow">◀</span><span class="slider"><i style="width:${p}%"></i></span><span class="arrow">▶</span></em>`; }
    if (it.type === 'choice') { const o = it.options.find((x) => x[0] === v) || it.options[0]; return `<b>${esc(it.label)}</b><em class="val"><span class="arrow">◀</span> ${esc(o[1])} <span class="arrow">▶</span></em>`; }
    return `<b>${esc(it.label)}</b>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}`;
  }
  paint() {
    this.items.forEach((it, idx) => {
      const e = this.els[idx];
      e.innerHTML = this.label(it);
      e.classList.toggle('focus', idx === this.i);
    });
    const it = this.items[this.i];
    if (this.opt.onFocus) this.opt.onFocus(it, this.i);
    if (this.els[this.i]) this.els[this.i].scrollIntoView({ block: 'nearest' });
  }
  adjust(d) {
    const it = this.items[this.i];
    if (it.disabled) return;
    if (it.type === 'toggle') it.set(!it.get());
    else if (it.type === 'slider') it.set(clamp(Math.round((it.get() + d * 0.1) * 10) / 10, 0, 1));
    else if (it.type === 'choice') { const opts = it.options; let k = opts.findIndex((x) => x[0] === it.get()); k = (k + d + opts.length) % opts.length; it.set(opts[k][0]); }
    else return;
    Sound.sfx('menuMove', { pitch: 1.2 });
    this.paint();
  }
  activate() {
    const it = this.items[this.i];
    if (it.disabled) { Sound.sfx('menuBack'); return; }
    if (it.type === 'toggle' || it.type === 'choice') { this.adjust(1); return; }
    if (it.type === 'slider') return;
    Sound.sfx('menuOk');
    if (it.action) it.action();
  }
  update() {
    const m = Input.menu;
    const vertical = this.opt.horizontal ? ['left', 'right'] : ['up', 'down'];
    if (m[vertical[0]]) { this.i = (this.i - 1 + this.items.length) % this.items.length; Sound.sfx('menuMove'); this.paint(); }
    if (m[vertical[1]]) { this.i = (this.i + 1) % this.items.length; Sound.sfx('menuMove'); this.paint(); }
    if (!this.opt.horizontal) { if (m.left) this.adjust(-1); if (m.right) this.adjust(1); }
    if (m.confirm) this.activate();
  }
}

// ----- screen manager -----
const UI = {

  show(name, params = {}) {

    this.screen.enter(params);
  },
  push(name, params = {}) {
    const o = Object.create(SCREENS[name]);
    const host = el('div', 'overlay s-' + name);
    this.root.appendChild(host);
    o.host = host; o.name = name;
    this.overlays.push(o);
    o.enter(params);
    const x = el('button', 'xbtn', '✕');
    x.title = 'Close';
    x.addEventListener('click', () => { Sound.sfx('menuBack'); if (name === 'pause') App.closePause(); else if (this.overlays[this.overlays.length - 1] === o) this.pop(); });

    return o;
  },
  pop() {
    const o = this.overlays.pop();

    o.host.remove();
    if (o.onClose) o.onClose();
  },
  menuOpen() { return this.overlays.length > 0; },
  update(dt) {
    const top = this.overlays[this.overlays.length - 1] || this.screen;

  },
  updateSoundHint() {
    let h = $('#soundhint');

    if (!show && h) h.remove();
  },
  // ----- HUD -----
  buildHud(match) {
    const h = this.hudEl;
    h.innerHTML = '';
    h.className = 'on' + (match.mode === 'training' ? ' training' : '') + (match.mode === 'bonus' ? ' bonus' : '');
    const side = (i) => {
      const f = match.f[i];
      return `<div class="hpbar p${i + 1}"><div class="nm" style="--c:${f.def.color}">${esc(f.def.short)}<small>${esc(match.ctrl[i].type === 'human' ? (match.ctrl[i].label || 'P' + (i + 1)) : match.ctrl[i].type === 'cpu' ? 'CPU' : 'DUMMY')}</small></div>
        <div class="hp"><i class="lag"></i><i class="fill"></i></div><div class="wins"></div></div>
        <div class="meter p${i + 1}"><div class="lv">0</div><div class="mb"><i></i><span></span><span></span></div><label>BATA</label></div>
        <div class="combo p${i + 1}"></div>`;
    };
    h.innerHTML = `${side(0)}<div class="timer">60</div>${side(1)}
      <div class="hscore"></div><div class="banner"></div><div class="callouts c1"></div><div class="callouts c2"></div>
      <div class="subtitle"></div><div class="cutin"></div><div class="tinfo"></div><div class="hints"></div>`;
    this.hud = {
      hp: [$('.hpbar.p1 .fill', h), $('.hpbar.p2 .fill', h)], lag: [$('.hpbar.p1 .lag', h), $('.hpbar.p2 .lag', h)],
      wins: [$('.hpbar.p1 .wins', h), $('.hpbar.p2 .wins', h)], meter: [$('.meter.p1 .mb i', h), $('.meter.p2 .mb i', h)],
      lv: [$('.meter.p1 .lv', h), $('.meter.p2 .lv', h)], combo: [$('.combo.p1', h), $('.combo.p2', h)], timer: $('.timer', h),
      score: $('.hscore', h), tinfo: $('.tinfo', h), hints: $('.hints', h), lagV: [1, 1], lastCombo: [0, 0], comboT: [0, 0], lastW: '',
    };

  paintHints() {

    this.hud.hints.innerHTML = show ? ['light', 'heavy', 'special', 'jump', 'harahara', 'super', 'dash'].map((a) => `<span>${glyph(a)} ${{ light: 'Light', heavy: 'Heavy', special: 'Special', jump: 'Jump', harahara: 'Harahara', super: 'Super', dash: 'Dash' }[a]}</span>`).join('') : '';

  },
  hideHud() { this.hudEl.className = ''; this.hudEl.innerHTML = ''; this.hud = null; },
  updateHud(dt) {

    }

    }
  },
  banner(text, cls = '') {

function typewriter(node, text, speed = 28) {

SCREENS.select = {
  enter(p) {
    this.p = p;
    this.mode = p.mode;
    this.roster = [...FIGHTERS];
    if (this.mode === 'versus' || this.mode === 'training') this.roster.push(BONUS);
    const pvp = !!p.pvp;
    this.cur = [{ i: 0, done: false, devs: null }, { i: 1, done: false, devs: null, cpu: !pvp }];
    this.p1dev = Input.lastDevice || 'kb1';
    this.watch = !!p.watch;
    this.need2 = this.mode === 'versus' || this.mode === 'training';
    if (!this.need2) this.cur[1].done = true;
    this.active = 0;
    Sound.play('select');
    this.host.innerHTML = `<div class="sel"><h1 class="hdr">${esc({ arcade: 'Arcade Story', versus: 'Versus', training: 'Training', bonus: 'Bonus Challenge' }[this.mode])} <small>Choose your fighter</small></h1>
      <div class="cards" id="cards"></div>
      <div class="info p1" id="i1"></div><div class="info p2" id="i2"></div>
      <div class="joinhint" id="jh"></div></div>${footer([['confirm', 'Choose'], ['back', 'Back'], ['tabR', 'Move list']])}`;
    const cards = $('#cards', this.host);
    this.cardEls = this.roster.map((d, idx) => {
      const c = el('div', 'card', `${portrait(d)}<b>${esc(d.short)}</b>`);
      c.style.setProperty('--c', d.color);
      c.addEventListener('mouseenter', () => { const k = this.mouseCursor(); if (k >= 0 && this.cur[k].i !== idx) { this.cur[k].i = idx; Sound.sfx('menuMove'); this.paint(); } });
      c.addEventListener('click', () => { const k = this.mouseCursor(); if (k >= 0) { this.cur[k].i = idx; this.choose(k); } });
      cards.appendChild(c);
      return c;
    });
    this.paint();
  },
  mouseCursor() { if (!this.cur[0].done) return 0; if (this.need2 && !this.cur[1].done) return 1; return -1; },
  paint() {
    this.cardEls.forEach((c, idx) => {
      c.classList.toggle('c1', this.cur[0].i === idx);
      c.classList.toggle('c2', this.need2 && this.cur[1].i === idx);
      c.classList.toggle('locked1', this.cur[0].done && this.cur[0].i === idx);
      c.classList.toggle('locked2', this.need2 && this.cur[1].done && this.cur[1].i === idx);
    });
    for (let k = 0; k < 2; k++) {
      const box = $('#i' + (k + 1), this.host);
      if (k === 1 && !this.need2) { box.innerHTML = ''; continue; }
      const d = this.roster[this.cur[k].i];
      const who = k === 0 ? (this.watch ? 'CPU 1' : 'P1') : this.cur[1].cpu || this.watch ? 'CPU' : this.cur[1].devs ? 'P2' : 'P2 (not joined — CPU until someone joins)';
      box.innerHTML = `<div class="tag" style="--c:${d.color}">${esc(who)}${this.cur[k].done ? ' ✔' : ''}</div><h2 style="--c:${d.color}">${esc(d.name)}</h2><h3>${esc(d.title)}</h3><p>${esc(d.blurb)}</p>
        <div class="stats">${['power', 'speed', 'range', 'ease'].map((s) => `<div><span>${s.toUpperCase()}</span><div class="pips">${pips(d.stats[s])}</div></div>`).join('')}</div>`;
    }
    const jh = $('#jh', this.host);
    if (this.need2 && !this.cur[1].cpu && !this.watch && !this.cur[1].devs) jh.innerHTML = `Player 2: press ${Input.lastType === 'pad' ? '<span class="key face f0">✕</span> on another controller' : '<span class="key">Numpad Enter</span> / <span class="key">✕</span> on another controller'} to join`;
    else if (this.need2 && this.cur[0].done && !this.cur[1].done) jh.innerHTML = this.cur[1].cpu || this.watch ? 'Now choose the opponent' : 'Player 2, choose your fighter';
    else jh.innerHTML = '';
    Showcase.select(this.roster[this.cur[0].i], this.need2 ? this.roster[this.cur[1].i] : null, this.cur.map((c) => c.done), this.alt);
  },
  choose(k) {
    this.cur[k].done = true;
    Sound.sfx('select');
    const d = this.roster[this.cur[k].i];
    Sound.ensure(); Sound.speak(d.short.toLowerCase() + '!', d.voice);
    this.paint();
    if (this.cur[0].done && this.cur[1].done) setTimeout(() => this.finish(), 450);
  },
  finish() {
    if (this.finished) return;
    this.finished = true;
    const p1 = this.roster[this.cur[0].i];
    const p2 = this.roster[this.cur[1].i];
    App.afterSelect(this.mode, p1, this.need2 ? p2 : null, { p1devs: this.cur[0].devs, p2devs: this.cur[1].devs, pvp: !this.cur[1].cpu && !this.watch, watch: this.watch });
  },
  update() {
    if (UI.menuOpen()) return;
    const C = this.cur;
    // player 2 joins by pressing confirm on a device player 1 isn't using
    if (this.need2 && !C[1].cpu && !this.watch && !C[1].devs) {
      const p1 = this.p1dev || 'kb1';
      for (const id in Input.devices) {
        const d = Input.devices[id];
        if (!(d.pressed.confirm || (id.startsWith('pad') && d.pressed.jump)) || id === p1) continue;
        let a, b;
        if (p1.startsWith('kb') && id.startsWith('kb')) { a = [p1]; b = [id]; }
        else if (id.startsWith('kb')) { a = [p1]; b = ['kb1', 'kb2']; }
        else { a = p1.startsWith('kb') ? ['kb1', 'kb2'] : [p1]; b = [id]; }
        C[0].devs = a; C[1].devs = b; Sound.sfx('menuOk'); this.paint(); return;
      }
    }
    const k = !C[0].done ? 0 : !C[1].done ? 1 : -1;
    const devs = k >= 0 && C[0].devs && C[1].devs ? C[k].devs : null;
    const by = (a) => (devs ? devs.some((id) => { const d = Input.devices[id]; return d && (d.pressed[a] || (a === 'confirm' && id.startsWith('pad') && d.pressed.jump) || (a === 'back' && id.startsWith('pad') && d.pressed.special)); }) : Input.menu[a]);
    if (by('back')) {
      Sound.sfx('menuBack');
      if (k === 1 || k === -1) { if (C[1].done) C[1].done = false; else C[0].done = false; this.finished = false; this.paint(); return; }
      if (k === 0 && !this.need2 || k === 0) { App.toTitle(true); return; }
    }
    if (k < 0) return;
    const n = this.roster.length;
    const cols = n > 7 ? 4 : n;
    let i = C[k].i;
    if (by('left')) i = (i - 1 + n) % n;
    if (by('right')) i = (i + 1) % n;
    if (by('up') && n > cols) i = (i - cols + n) % n;
    if (by('down') && n > cols) i = (i + cols) % n;
    if (i !== C[k].i) { C[k].i = i; Sound.sfx('menuMove'); this.paint(); }
    if (by('confirm')) this.choose(k);
    else if (Input.menu.tabL || Input.menu.tabR) UI.push('movelist', { def: this.roster[C[k].i] });
  },
};

// ===== main.js =====
// ---------- app flow, showcase scene, modes, AI Hub session, main loop ----------
const STAGE_OF = { jin: 'rooftop', momo: 'carnival', mofu: 'shrine', bot: 'rooftop', rex: 'shrine', nana: 'carnival', kuro: 'shrine', punchy: 'dojo', giga: 'volcano' };

// menus show fighters posing in a live 3D stage
const Showcase = {
  cache: new Map(), shown: [], t: 0, mode: 'title', poses: [],
  rig(def, slot) {
    const key = def.id + ':' + slot;
    if (!this.cache.has(key)) this.cache.set(key, buildRig(def.look, slot === 1 && false));
    return this.cache.get(key);
  },
  ensureStage(id) { if (R.stageId !== id) { loadStage(id); } },
  set(list) {
    for (const r of this.shown) R.scene.remove(r.rig.root);
    this.shown = list.map((s) => { const rig = this.rig(s.def, s.slot || 0); R.scene.add(rig.root); rig.root.position.set(s.x, 0, s.z || 0); rig.root.rotation.y = s.ry || 0; return { rig, ...s }; });
  },
  hide() { for (const r of this.shown) R.scene.remove(r.rig.root); this.shown = []; },
  title() {
    this.mode = 'title';
    this.ensureStage('rooftop');
    this.set([
      { def: FIGHTERS[0], x: -1.6, z: 0.3, ry: 0.5, pose: 'win' },
      { def: FIGHTERS[1], x: 0.2, z: 0.8, ry: 0.1, pose: 'win2' },
      { def: FIGHTERS[6], x: 2.0, z: 0, ry: -0.6, pose: 'taunt' },
      { def: FIGHTERS[2], x: -3.8, z: -0.8, ry: 0.6, pose: 'stance' },
      { def: FIGHTERS[3], x: 4.2, z: -0.8, ry: -0.6, pose: 'stance' },
    ]);
  },
  select(a, b, done) {
    this.mode = 'select';
    this.ensureStage(R.stageId && R.stageId !== 'volcano' ? R.stageId : 'shrine');
    const list = [{ def: a, x: b ? -1.2 : 0, z: 0.4, ry: b ? 0.55 : 0.2, pose: done[0] ? 'win' : 'stance', slot: 0 }];
    if (b) list.push({ def: b, x: 1.2, z: 0.4, ry: -0.55, pose: done[1] ? 'win2' : 'stance', slot: 1 });
    const same = this.shown.length === list.length && this.shown.every((s, i) => s.def === list[i].def);
    if (same) this.shown.forEach((s, i) => (s.pose = list[i].pose));
    else this.set(list);
  },
  stage(id) { this.ensureStage(id); this.mode = 'stage'; },
  ending(def) { this.ensureStage('shrine'); this.mode = 'ending'; this.set([{ def, x: 0, z: 0.5, ry: 0, pose: 'win2' }]); },
  update(dt) {
    this.t += dt;
    for (const s of this.shown) animateRig(s.rig, resolvePose(s.pose), dt, { breathe: true, speed: 6, mouth: 1 });
    const c = R.camera;
    let x, y, z, lx = 0, ly = 1.2;
    if (this.mode === 'title') { const a = Math.sin(this.t * 0.15) * 0.35; x = Math.sin(a) * 9; z = Math.cos(a) * 9; y = 2.2; ly = 1.6; }
    else if (this.mode === 'select') { x = 0; y = 1.5; z = 5.2; ly = 1.35; }
    else if (this.mode === 'stage') { const a = this.t * 0.1; x = Math.sin(a) * 4; z = 10; y = 3; ly = 1.5; }
    else { const a = this.t * 0.2; x = Math.sin(a) * 4; z = 6 + Math.cos(a); y = 1.8; ly = 1.3; }
    c.position.set(damp(c.position.x, x, 3, dt), damp(c.position.y, y, 3, dt), damp(c.position.z, z, 3, dt));
    c.lookAt(lx, ly, 0);
    if (c.fov !== 34) { c.fov = 34; c.updateProjectionMatrix(); }
    R.dim.material.opacity = 0;
  },
};

const App = {
  match: null, acc: 0, world: 0, titleIndex: 0, pending: null, arcade: null, gauntlet: null, sessionEnded: false, attract: null,
  later(fn) { this.pending = fn; },
  toTitle(menu = false) {
    this.endMatch();
    this.attract = null;
    UI.hideHud();
    if (this.touchOnly) { Showcase.title(); UI.show('touch'); return; }
    UI.show('title', { menu });
  },
  endMatch() { if (this.match) { this.match.dispose(); this.match = null; } this.acc = 0; },
  startSelect(mode, opts = {}) { this.endMatch(); UI.hideHud(); UI.show('select', { mode, ...opts }); },
  afterSelect(mode, p1, p2, o) {
    if (mode === 'arcade') this.startArcade(p1, o);
    else if (mode === 'bonus') this.startBonus(p1, o);
    else UI.show('stageSel', { mode, p1, p2, ...o });
  },
  humanCtrl(devs, label) { return { type: 'human', devices: devs && devs.length ? devs : '*', label }; },
  startVersus(p, stageId) {
    const training = p.mode === 'training';
    const c1 = p.watch ? { type: 'cpu', level: S().difficulty + 1 } : this.humanCtrl(p.pvp ? p.p1devs : null, 'P1');
    let c2;
    if (training) c2 = { type: 'dummy', dummy: 'stand' };
    else if (p.pvp && p.p2devs) c2 = this.humanCtrl(p.p2devs, 'P2');
    else c2 = { type: 'cpu', level: S().difficulty + (p.watch ? 1 : 0) };
    const cfg = {
      mode: training ? 'training' : 'versus', p1: p.p1, p2: p.p2, c1, c2, stage: stageId,
      roundsToWin: training ? 1 : S().rounds, roundTime: training ? 999 : S().roundTime, skipIntro: training,
      onEnd: (res) => this.later(() => this.versusEnd(res, cfg)),
    };
    UI.show('vs', { p1: p.p1, p2: p.p2, episode: training ? 'TRAINING' : 'VERSUS', title: training ? 'Practice makes bata-bata perfect!' : `${p.p1.name} vs. ${p.p2.name}!`, go: () => this.startMatch(cfg) });
  },
  versusEnd(res, cfg) {
    const m = this.match;
    const w = res.winner === 0 ? cfg.p1 : cfg.p2;
    UI.hideHud();
    this.endMatch();
    UI.show('preview', { stars: 0, text: `${w.name} wins! ${w.lines.win}`, nextTitle: 'Rematch? Of course! Heroes never sleep!', score: m ? m.score : 0, go: () => this.startSelect(cfg.mode, { pvp: cfg.c2.type === 'human', watch: cfg.c1.type === 'cpu' }) });
  },
  startMatch(cfg) {
    this.endMatch();
    Showcase.hide();
    UI.show('fight');
    this.match = new Match(cfg);
    UI.buildHud(this.match);
  },
  openPause() { if (this.match && !UI.menuOpen()) UI.push('pause'); },
  closePause() { while (UI.overlays.length) UI.pop(); if (this.match) this.match.paused = false; },
  restart() { const cfg = this.match.cfg; this.closePause(); this.startMatch(cfg); },
  quitToTitle() { this.closePause(); this.arcade = null; this.toTitle(true); },
  setDummy(v) {
    const m = this.match;
    if (v === 'cpu') { m.ctrl[1] = { type: 'cpu', level: S().difficulty }; m.ai[1] = new CPU(m.f[1], S().difficulty); }
    else { m.ctrl[1] = { type: 'dummy', dummy: v }; m.ai[1] = null; }
  },
  // ----- arcade story -----
  startArcade(def, o) {
    const rivals = shuffle(FIGHTERS.filter((f) => f.id !== def.id)).slice(0, 3);
    this.arcade = {
      def, devices: o.p1devs || '*', idx: 0, stars: 0, score: 0, continues: 0,
      ladder: [{ type: 'fight', opp: rivals[0], stars: 2 }, { type: 'fight', opp: rivals[1], stars: 2 }, { type: 'bonus', opp: BONUS, stars: 0 }, { type: 'fight', opp: rivals[2], stars: 2 }, { type: 'boss', opp: BOSS, stars: 1 }],
    };
    UI.show('prologue', { lines: STORY.prologue, go: () => this.nextArcade() });
  },
  nextArcade() {
    const A = this.arcade;
    const L = A.ladder[A.idx];
    const bonus = L.type === 'bonus', boss = L.type === 'boss';
    const stage = bonus ? 'dojo' : boss ? 'volcano' : STAGE_OF[L.opp.id];
    const lvl = clamp(S().difficulty + (A.idx >= 3 ? 1 : 0), 1, 5);
    const cfg = {
      mode: bonus ? 'bonus' : 'arcade', p1: A.def, p2: L.opp, c1: this.humanCtrl(A.devices, 'P1'), c2: { type: 'cpu', level: lvl, style: bonus ? 'bonus' : boss ? 'boss' : 'normal' },
      stage, roundsToWin: bonus ? 1 : S().rounds, roundTime: bonus ? 30 : Math.min(99, S().roundTime), scoreBase: A.score, scoreLabel: '★ ' + A.stars + '/7', ladderIndex: A.idx,
      music: boss ? 'boss' : undefined,
      onEnd: (res, m) => this.later(() => this.arcadeEnd(res, m)),
    };
    UI.show('vs', { p1: A.def, p2: L.opp, episode: boss ? 'FINAL EPISODE' : bonus ? 'BONUS EPISODE' : 'EPISODE ' + (A.idx + 1), title: bonus ? BONUS.epTitle : boss ? BOSS.epTitle.replace('FINAL EPISODE: ', '') : L.opp.epTitle, stars: A.stars, go: () => this.startMatch(cfg) });
  },
  arcadeEnd(res, m) {
    const A = this.arcade;
    const L = A.ladder[A.idx];
    const gained = m.score;
    UI.hideHud();
    this.endMatch();
    if (L.type === 'bonus' || res.winner === 0) {
      A.score += gained;
      A.stars += L.stars;
      A.idx++;
      if (A.idx >= A.ladder.length) { UI.show('ending', { def: A.def, score: A.score }); this.arcade = null; return; }
      const N = A.ladder[A.idx];
      const text = N.type === 'bonus' ? STORY.bonusIntro : N.type === 'boss' ? STORY.bossIntro : STORY.next(A.def.name, A.stars);
      UI.show('preview', { stars: A.stars, newStars: L.stars > 0, text, nextTitle: (N.type === 'boss' ? '' : N.type === 'bonus' ? '' : 'Episode ' + (A.idx + 1) + ': ') + N.opp.epTitle, score: A.score, go: () => this.nextArcade() });
    } else {
      UI.show('cont', {
        yes: () => { A.score = 0; A.continues++; this.nextArcade(); },
        no: () => { const sc = A.score; this.arcade = null; UI.show('gameover', { score: sc }); },
      });
    }
  },
  // ----- bonus challenge -----
  startBonus(def, o) {
    const cfg = {
      mode: 'bonus', p1: def, p2: BONUS, c1: this.humanCtrl(o.p1devs, 'P1'), c2: { type: 'cpu', level: 1, style: 'bonus' }, stage: 'dojo', roundsToWin: 1, roundTime: 30, scoreBase: 0,
      onEnd: (res, m) => this.later(() => {
        const pts = m.score; let best = 0;
        try { best = Math.max(pts, +(localStorage.getItem('bb7.bonusBest') || 0)); localStorage.setItem('bb7.bonusBest', best); } catch (e) { best = pts; }
        const dmg = m.stats[0].dmg, combo = m.stats[0].maxCombo;
        UI.hideHud(); this.endMatch();
        UI.show('bonusResult', { pts, best, dmg, combo });
      }),
    };
    UI.show('vs', { p1: def, p2: BONUS, episode: 'BONUS CHALLENGE', title: BONUS.epTitle, go: () => this.startMatch(cfg) });
  },
  // ----- attract mode: CPU vs CPU showcase with cheats on -----
  startAttract() {
    const ids = shuffle(FIGHTERS);
    const a = ids[0], b = Math.random() < 0.2 ? BOSS : ids[1];
    const stage = b === BOSS ? 'volcano' : pick(['rooftop', 'shrine', 'carnival', 'dojo']);
    this.attract = { n: (this.attract ? this.attract.n : 0) + 1 };
    const cfg = {
      mode: 'versus', attract: true, p1: a, p2: b, c1: { type: 'cpu', level: 4, style: 'attract' }, c2: { type: 'cpu', level: 4, style: 'attract' },
      stage, roundsToWin: 1, roundTime: 60, skipIntro: true, oneRound: true,
      onEnd: () => this.later(() => { if (this.attract) { this.endMatch(); this.startAttract(); } }),
    };
    this.endMatch();
    Showcase.hide();
    UI.show('attract');
    this.match = new Match(cfg);
    UI.buildHud(this.match);
    UI.name = 'attract';
  },
  stopAttract() { this.attract = null; Sound.sfx('menuOk'); this.toTitle(false); },
};

SCREENS.prologue = {
  enter(p) {
    this.p = p; this.i = -1; this.t = 0;
    Sound.play('select');
    this.host.innerHTML = `<div class="vs"><div class="ep">PROLOGUE</div>${starsRow(7)}<p class="narr big" id="pl"></p></div>${footer([['confirm', 'Next'], ['back', 'Skip']])}`;
    this.next();
  },
  next() {
    this.i++;
    if (this.i >= this.p.lines.length) { if (!this.gone) { this.gone = true; this.p.go(); } return; }
    const line = this.p.lines[this.i];
    typewriter($('#pl', this.host), line, 26);
    this.t = 0; this.len = 1.2 + line.length * 0.05;
    Sound.speak(line, NARRATOR);
  },
  update(dt) {
    this.t += dt;
    if (Input.menu.back) { this.i = 99; this.next(); return; }
    if ((this.t > 0.4 && Input.menu.confirm) || this.t > this.len) this.next();
  },
};

// ----- AI Hub session: the Bata Bata Gauntlet (side by side) -----
const Gauntlet = {
  setup() {
    const rng = AIHub.rng('deal');
    const def = FIGHTERS[Math.floor(rng() * FIGHTERS.length) % FIGHTERS.length];
    const others = FIGHTERS.filter((f) => f !== def);
    for (let i = others.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [others[i], others[j]] = [others[j], others[i]]; }
    const seq = [others[0], others[1], others[2], BONUS, others[3], BOSS, others[4], others[5], others[0], BOSS];
    this.g = { def, seq, idx: 0, score: 0, kos: 0, maxCombo: 0, supers: 0, hara: 0, perfects: 0, boss: false, haraFinish: false, over: false, dmg: 0 };
    return this.g;
  },
  cfgFor(i) {
    const G = this.g;
    const opp = G.seq[i % G.seq.length];
    const bonus = opp === BONUS, boss = opp === BOSS;
    return {
      mode: bonus ? 'bonus' : 'arcade', session: true, p1: G.def, p2: opp, c1: { type: 'human', devices: '*', label: 'YOU' },
      c2: { type: 'cpu', level: clamp(1 + Math.floor(i / 2), 1, 5), style: bonus ? 'bonus' : boss ? 'boss' : 'normal' },
      stage: bonus ? 'dojo' : boss ? 'volcano' : STAGE_OF[opp.id], roundsToWin: 1, oneRound: true, roundTime: bonus ? 20 : 45, skipIntro: true,
      music: boss ? 'boss' : undefined, scoreBase: G.score, scoreLabel: 'FIGHT ' + (i + 1), ladderIndex: i,
      onEnd: (res, m) => App.later(() => this.fightEnd(res, m)),
    };
  },
  start() { App.startMatch(this.cfgFor(this.g.idx)); },
  fightEnd(res, m) {
    const G = this.g;
    if (G.over) return;
    const st = m.stats[0];
    G.score += m.score; G.dmg += st.dmg; G.maxCombo = Math.max(G.maxCombo, st.maxCombo); G.supers += st.supers; G.hara += st.hara; G.perfects += st.perfectGuards;
    const bonus = m.mode === 'bonus';
    if (bonus || res.winner === 0) {
      if (!bonus) { G.kos++; if (m.cfg.p2 === BOSS) G.boss = true; if (res.finisher === 'hara') G.haraFinish = true; }
      G.idx++;
      this.report();
      UI.hideHud(); App.endMatch();
      UI.show('sessionWait', { def: G.def, line: `${G.kos} down! Next up: ${G.seq[G.idx % G.seq.length].name}!` });
      setTimeout(() => { if (!G.over && !App.sessionEnded) this.start(); }, 1800);
    } else {
      this.finish('KNOCKED OUT!');
    }
  },
  live() { const G = this.g; return G.score + (App.match && !G.over ? App.match.score : 0); },
  report() { const G = this.g; AIHub.progress({ score: this.live(), label: `Fight ${G.idx + 1} · ${G.kos} KO` }); },
  finish(title) {
    const G = this.g;
    if (G.over) return;
    G.over = true;
    if (App.match) { G.score += App.match.score; G.dmg += App.match.stats[0].dmg; }
    const awards = [];
    if (G.boss) awards.push({ title: 'Tyrant Toppler', detail: 'Defeated Emperor Gigadoom' });
    if (G.haraFinish) awards.push({ title: 'HARAHARA!!', detail: 'Finished a rival with a Harahara Attack' });
    if (G.maxCombo >= 8) awards.push({ title: 'Combo Maniac', detail: G.maxCombo + '-hit combo' });
    AIHub.result({
      score: G.score,
      stats: { 'rivals KO': G.kos, damage: G.dmg, 'best combo': G.maxCombo, supers: G.supers, harahara: G.hara, fighter: G.def.short },
      awards: awards.slice(0, 3),
    });
    if (App.match) App.match.paused = true;
    UI.hideHud();
    UI.show('sessionOver', { score: G.score, title, detail: `${G.def.name} · ${G.kos} rival${G.kos === 1 ? '' : 's'} KO'd · best combo ${G.maxCombo}` });
  },
};

async function startSession() {
  const info = await AIHub.connect({ mode: 'parallel', seats: [1, 4] });
  if (!info) return false;
  App.inSession = true;
  const G = Gauntlet.setup();
  AIHub.on('start', () => Sound.ensure());
  AIHub.on('time-up', () => { if (!G.over) Gauntlet.finish('TIME UP!'); });
  AIHub.on('end', () => {
    App.sessionEnded = true;
    if (App.match) App.match.paused = true;
    Sound.stopMusic(); Sound.silence(true);
    if (!G.over) { G.over = true; UI.hideHud(); UI.show('sessionOver', { score: Gauntlet.live(), title: 'ROUND OVER' }); }
  });
  Gauntlet.start();
  App.match.paused = false;
  App.sessionHold = true; // no stepping until AIHub.time() >= 0
  const ready = () => AIHub.ready();
  if (info.splash) ready();
  else {
    UI.push('sessionReady', { def: G.def, go: ready });
  }
  return true;
}
SCREENS.sessionReady = {
  enter(p) {
    this.p = p;
    const names = (AIHub.players || []).map((x) => x.name);
    this.host.innerHTML = `<div class="panel narrow center"><h2>${esc(p.def.name)}</h2><p class="dim" id="roster"></p><p>Press any key, click or tap when you are ready</p></div>`;
    $('#roster', this.host).textContent = names.join(' · ');
    this.click = () => this.go();
    window.addEventListener('pointerdown', this.click);
  },
  go() { if (this.done) return; this.done = true; window.removeEventListener('pointerdown', this.click); this.p.go(); UI.pop(); },
  update() { if (Input.anyPressed || Input.menu.any) this.go(); },
};

// ----- probe for the hub's harness -----
function probeState() {
  const inp = Input.combine('*');
  let scene = 'menu';
  const n = UI.name;
  if (n === 'title' || n === 'attract' || n === 'touch') scene = 'title';
  else if (n === 'fight') scene = App.sessionHold && AIHub.time() < 0 ? 'ready' : 'play';
  else if (n === 'sessionOver' || n === 'gameover' || n === 'ending' || n === 'bonusResult') scene = 'over';
  else if (n === 'sessionWait') scene = 'ready';
  return {
    scene, menu: UI.menuOpen(), world: Math.round(App.world * 1000) / 1000,
    input: { x: inp.x, y: inp.y, fire: !!(inp.held.light || inp.held.heavy || inp.held.special || inp.held.jump || inp.held.harahara || inp.held.super || inp.held.dash || inp.held.guard) },
  };
}

// ----- main loop -----
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  try {
    Input.update();
    if (App.sessionEnded) { for (const id in Input.devices) { const d = Input.devices[id]; for (const k in d.pressed) d.pressed[k] = false; } for (const k in Input.menu) Input.menu[k] = false; }
    UI.update(dt);
    const m = App.match;
    if (m) {
      const hold = App.sessionHold && AIHub.time() < 0;
      if (App.sessionHold && !hold) App.sessionHold = false;
      if (hold && m.phase === 'roundcall' && m.pf === 0) UI.banner('GET READY', 'call');
      const run = !m.paused && !hold && !App.sessionEnded;
      const ts = m.slow > 0 ? 0.35 : 1;
      if (run) {
        m.feedInputs();
        App.acc += dt * ts;
        let n = 0;
        while (App.acc >= DT && n < 5) { m.step(); App.acc -= DT; n++; if (App.match !== m) break; }
        if (n >= 5) App.acc = 0;
        App.world += dt * ts;
      }
      if (App.match === m) m.sync(run ? dt * ts : 0.0001);
      if (App.inSession && !Gauntlet.g.over) Gauntlet.report();
    } else {
      Showcase.update(dt);
      App.world += dt;
    }
    if (App.pending) { const f = App.pending; App.pending = null; f(); }
    if (Input.anyPressed && !App.sessionEnded) Sound.ensure();
    renderFrame(dt);
  } catch (e) {
    console.error(e);
  }
  requestAnimationFrame(frame);
}

async function boot() {
  window.__bb7 = { R, App, UI, Input, Sound, S, FIGHTERS, BOSS, BONUS, Gauntlet };
  UI.init();
  UI.show('loading');
  AIHub.probe(probeState);
  for (const ev of ['keydown', 'pointerdown']) window.addEventListener(ev, () => { if (!App.sessionEnded) Sound.ensure(); });
  try {
    await initRenderer();
  } catch (e) {
    console.error(e);
    UI.show('error', { message: e && e.message === 'no-webgpu' ? 'This browser or device does not support WebGPU.' : String(e && e.message || e) });
    if (SESSION) AIHub.fail('WebGPU is not available');
    return;
  }
  await initPhysics();
  Showcase.title();
  requestAnimationFrame(frame);
  if (SESSION) {
    const ok = await startSession();
    if (ok) return;
  }
  const coarse = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches && (navigator.maxTouchPoints || 0) > 0;
  App.touchOnly = coarse && !Input.hasGamepad();
  App.toTitle(false);
}
boot();

</script>
