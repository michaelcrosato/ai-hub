<!--
CHAINFELD — an original spiritual successor to Seinfeld (TV Show)

Source Information
- Date: 2026-11-01 18:43
- Source: Seinfeld (TV Show)
- Genre and Perspective: Third-person ensemble comedy adventure (a "sitcom sandbox"): four switchable friends,
  interlocking petty quest threads, physics chain reactions and mini-games (stand-up timing, a strict soup
  line, a rhythm dance, a dialogue standoff), plus a race mode. Main camera: third-person perspective;
  switchable to a Studio Audience multi-cam view and first person.
- Tech: Three.js r180 (WebGPURenderer: WebGPU with automatic WebGL 2 fallback, TSL sky gradient, PCF soft
  shadows, ACES tone mapping), Rapier 3D 0.19.3 (rapier3d-compat: rigid bodies, kinematic character
  controller, collision events, ray casts), Web Audio API, Gamepad API, AI Hub Session Protocol v1 client
  1.3.0; vanilla ES modules bundled with Bun 1.3.14 into one HTML file (Three.js and Rapier load from the
  jsDelivr CDN).
- Art Direction: Three.js engine-native: primitive geometry (boxes, capsules, spheres, cylinders, tori),
  MeshStandardMaterial PBR, canvas-drawn textures and signage, instanced windows, real-time shadows from the
  sun and a roaming key light, time-of-day lighting from afternoon to dusk, sound-stage sets with a missing
  fourth wall.
- Animation: Three.js AnimationMixer with AnimationClips authored in code (QuaternionKeyframeTrack /
  VectorKeyframeTrack) on THREE.Bone rigs: a crossfaded locomotion blend (idle, walk, run, sneak), 20 full-
  body clips (shove, dance, observe, entrance, sit, knocked...), additive overlays (carrying), mixer-driven
  pigeons and studio audience; procedural face (blinks, mouth flaps synced to voice).
- Audio: All code-written with Web Audio: Karplus-Strong slap bass, mouth pops, finger snaps, FM electric
  piano and brass stabs in a step sequencer (title, four character themes, soup line, stand-up jazz, dance,
  finale, race, results) and "Cut to:" bass stings; a synthesized studio audience (chuckles, laughs, big
  laughs, applause, ooh, aww, gasp) rendered with OfflineAudioContext; procedural SFX; gibberish formant-
  synthesis voices per character.
- Online: AI Hub Session Protocol v1 in race mode ("The Errand Run", 1-4 players): seeded errands and pickups,
  15 Hz unreliable state, interpolated rivals, solid contact, victim-decides shoves and specials, claimable
  pickups, progress/result/stats/awards, leave and time-up handling. No other network features; the standalone
  game is single-player with computer rivals in the race mode.
- Testing: Headless Chromium (Playwright) with SwiftShader WebGPU; render-target readback captures; a fast-
  forward hook that runs the real update loop without drawing; scripted playthroughs of all four threads, the
  finale, verdict, closing stand-up and results; menus, settings toggles, notebook, pause, camera modes;
  standalone race with computer rivals; attract mode (all 9 beats, exit on input); a touch-only device
  profile; the AI Hub harness.html at 1, 2 (with and without the splash), 3 and 4 players on a 150 ms / 50 ms
  jitter / 5% loss network, plus host-leave, with an emulated DualSense in every frame (24/24 checks). No real
  GPU, no physical controller, no human playtest.
- Research: Read the AI Hub Session Protocol README, session.js, harness.html and retrofit notes from GitHub;
  inspected the Three.js r180 and Rapier 0.19.3 package APIs locally. No web research on the show: tone and
  structure come from general knowledge, and all writing is original.
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort xhigh
- Usage: API cost: unknown; tokens: unknown; session time: about 2 hours 45 minutes (18:43 to about 21:28
  local, from file timestamps)

Testing Feedback
- Issues caught by testing: 22: a white screen from too many shadow-casting lights (WebGPU's 16 sampled
  textures per shader stage), sets built inside the distant skyline, a dash-through-the-door check that only
  ran at render rate, pigeon bait reading stale mesh positions, a finale chain that never counted, nav-graph
  edges through walls (built before Rapier's first step) and waypoints inside street furniture, quick key
  presses merging on slow frames (wrong menu item), a stale laugh counter after Continue, leftover toasts
  between scenes, a whole-scene shader recompile whenever a light was added or removed at runtime, a frozen
  world and late ready-up under the hub harness, and several camera placements (inside a lamp post, outside
  the apartment through the door, a blocked soup-line shot, the standoff framing).
- Critical / game-breaking: 4: the white screen; the hub world freezing while a menu was open (rAF stalls
  during shader compiles); copies missing the hub's 20-second ready window at 4 players; computer rivals stuck
  forever in the Errand Run.
- Most helpful test: The AI Hub harness under software rendering with 4 players and an emulated pad: it
  exposed that requestAnimationFrame stops while the GPU compiles, which led to the simulation watchdog, async
  pipeline warm-up and building the round before the GPU starts.
- Least helpful test: Screenshots of the WebGPU canvas via page.screenshot (always blank) and captures taken
  right after a fast-forward (stale camera and frozen animation) — they cost runs before I switched to
  readback plus a draw call.

Engine Feedback
- Liked most: Three.js r180's WebGPURenderer runs the same scene on WebGPU or WebGL 2 with no code changes,
  and AnimationMixer happily drives hand-built Bone rigs with clips authored in code. Rapier's kinematic
  character controller (autostep, snap-to-ground, pushing dynamic props) gave solid character physics in a few
  lines, and switching a capsule to dynamic made a cheap, funny knockdown ragdoll.
- Stuck or guessed wrong: Yes: every material samples every shadow map in WebGPU, so a handful of shadow-
  casting lights silently exceeded the 16-texture limit (validation warnings, white frame).
  readRenderTargetPixelsAsync pads rows to 256 bytes. Rapier scene queries don't see new colliders until the
  first step(). First-use pipeline compiles block the main thread long enough to stall requestAnimationFrame
  under software rendering.
- Most important thing built by hand: The game layer: a fixed-step loop with a watchdog that keeps simulating
  when frames stall, the actor (kinematic capsule + controller + bone rig + temporary ragdoll), chain-reaction
  scoring from collision events, a controller-first DOM UI with focus navigation, and every sound (slap-bass
  sequencer, synthesized laugh track, gibberish voices).
- Hardest part: Making behavior independent of frame rate and GPU compile stalls (the hub's checks run under
  software WebGPU), and debugging WebGPU validation errors that produce no visible error, only a blank frame.
- Remove or overhaul: The implicit shadow-map binding model: I'd overhaul shadows into a budgeted shadow atlas
  (or at least a clear error) so adding a lamp can't break every material.
- Change one thing: Make compileAsync cover shadow and post-processing pipelines and report progress, so a
  game can show a loading bar instead of freezing on the first frame of a new set.

Prompt Feedback
- Liked most: An objective finish line: the Done criteria plus the AI Hub harness give a test you can actually
  pass, and the open genre choice let a sitcom become a game about chain reactions.
- Confusing: "Follow lib/hub ... as well as for the game on its own" (standalone online play, or just the
  hub's control and settings rules? I read it as the latter, with computer rivals offline); "engine native
  perspective / style / animation" for Three.js, which has no house style; and whether the [brackets] are part
  of the file and folder names (I kept them, as written).
- Hardest thing: Turning a show about nothing into a complete vertical slice with real verbs — four
  interlocking threads, a finale and a closing stand-up — and then proving it all works headless, in software
  WebGPU, without a human at the controller.
- The one test I'd have run: A human playtest on real hardware with a DualSense at couch distance: stand-up
  and dance timing feel, camera comfort, and whether the text reads at ten feet.

-->

<script>
/*! aihub-session 1.4.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.4.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null, card: opts.card === true });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  /** On the game's own card (connect({ card: true })): this player is 'ready', or asks for 'more' time (again takes it back). */
  hub.answer = function (what) {
    if (!welcomed || ended || goAt !== null) return;
    if (what !== 'ready' && what !== 'more') return warn('answer is ready or more');
    post('answer', { answer: what });
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

.nb { display: grid; grid-template-columns: repeat(2, minmax(14em, 1fr)); gap: .9em; width: min(60em, 94vw); }
.nb .th { background: rgba(255,255,255,.06); border-radius: .9em; padding: .8em 1em; border-top: .35em solid #888; }
.nb .th h4 { margin: 0; font-size: 1.1em; display: flex; justify-content: space-between; }
.nb .th .sub { color: var(--dim); font-size: .75em; margin-bottom: .4em; }
.nb .st { font-size: .88em; padding: .15em 0; color: var(--dim); }
.nb .st.done { color: #66e3b5; }
.nb .st.cur { color: var(--ink); font-weight: bold; }
.nb .st.cur::before { content: '▸ '; color: var(--accent); }
.nb .st.done::before { content: '✓ '; }
.nb .st.next::before { content: '· '; }
.material { width: min(60em, 94vw); margin-top: .8em; font-size: .8em; color: var(--dim); }

/* attract + notices */
.attract { position: absolute; inset: 0; pointer-events: none; }
.attract .badge { position: absolute; top: 1.4em; left: 50%; transform: translateX(-50%); background: #c8261c; color: #fff; padding: .25em 1em; border-radius: .4em; font-family: var(--display); letter-spacing: .15em; animation: blink 1.6s infinite; }
.attract .press { position: absolute; bottom: 7%; left: 50%; transform: translateX(-50%); font-size: 1.3em; background: var(--bg); padding: .4em 1.2em; border-radius: 2em; animation: blink 1.6s infinite; white-space: nowrap; }
.attract .cap { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); font-size: 1.1em; color: var(--accent); text-shadow: 0 2px 4px #000; white-space: nowrap; }
.attract .mini { position: absolute; top: 4.5em; left: 2em; font-size: 2.6em; }
@keyframes blink { 50% { opacity: .55 } }
.touch-note { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1em; background: rgba(5,4,10,.82); pointer-events: auto; text-align: center; padding: 2em; }
.touch-note .big { font-family: var(--display); font-size: 1.8em; }
.touch-note button, .bigbtn { font-size: 1.1em; padding: .6em 1.4em; border-radius: 2em; background: var(--accent); color: #1a1208; border: 0; font-weight: bold; pointer-events: auto; cursor: pointer; }
.loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1em; background: #0a0810; }
.loading .logo { font-size: 4.5em; }
.loading .msg { color: var(--dim); }
.countdown { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-family: var(--display); font-size: 7em; color: var(--accent); text-shadow: 0 .1em .4em #000; }
.racehud { position: absolute; top: 1.4em; left: 1.6em; background: var(--bg); padding: .6em 1em; border-radius: .8em; min-width: 15em; }
.racehud .t { font-family: var(--display); font-size: 1.4em; }
.racehud .e { font-size: .85em; padding: .1em 0; color: var(--dim); }
.racehud .e.done { color: #66e3b5; text-decoration: line-through; }
.racehud .e.cur { color: var(--ink); font-weight: bold; }
.ring { position: absolute; transform: translate(-50%, -50%); width: 3em; height: 3em; border-radius: 50%; }
.wrap-card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
.standings { margin-top: .6em; font-size: 1.05em; }
.standings div { padding: .2em 0; }
.subtitle-sm { font-size: .8em; color: var(--dim); }

function tickTraffic(W, dt) {
  const actors = G.actors;
  for (const car of W.traffic) {
    car.prevX = car.x;
    let blocked = false;
    for (const a of actors) {
      if (!a.enabled)
        continue;
      if (Math.abs(a.pos.z) < 2.4 && a.pos.x > car.x && a.pos.x - car.x < car.L / 2 + 5)
        blocked = true;
    }
    for (const o of W.traffic) {
      if (o !== car && o.x > car.x && o.x - car.x < car.L + 3.5)
        blocked = true;
    }
    const target = blocked ? 0 : car.max;
    car.speed += (target - car.speed) * Math.min(1, dt * (blocked ? 5 : 1.2));
    if (blocked && car.speed < 1) {
      car.honkT -= dt;
      if (car.honkT <= 0) {
        car.honkT = 2.5 + Math.random() * 2;
        G.audio.sfx("horn", { x: car.x, y: 1, z: 0 }, 0.7);
        if (G.onHonk)
          G.onHonk(car);
      }
    } else
      car.honkT = 0.6;
    car.x += car.speed * dt;
    if (car.x > 80)
      car.x = -80;
    car.body.setNextKinematicTranslation({ x: car.x, y: 0.85, z: 0 });
  }
}
function renderTraffic(W, alpha) {
  for (const car of W.traffic) {
    let x = car.prevX + (car.x - car.prevX) * alpha;
    if (Math.abs(car.x - car.prevX) > 20)
      x = car.x;
    car.mesh.position.x = x;
  }
}

function updateWorld(W, dt) {
  W.time += dt;
  tickTraffic(W, dt);
  for (const d of W.doors) {
    let near = false;
    for (const a of G.actors)
      if (a.enabled && Math.abs(a.pos.x - d.x) < 1.6 && Math.abs(a.pos.z - d.z) < 1.8)
        near = true;
    d.open += ((near ? 1 : 0) - d.open) * Math.min(1, dt * 6);
    d.pivot.rotation.y = d.swing * d.open * 1.4;
  }
  const ad = W.aptDoor;
  if (ad) {
    let near = false;
    for (const a of G.actors)
      if (a.enabled && Math.abs(a.pos.x - (APT.x + 6.6)) < 1.6 && Math.abs(a.pos.z - (APT.z + 1)) < 1.6)
        near = true;
    if (ad.slam > 0) {
      ad.slam -= dt;
      ad.open = Math.min(1.25, ad.open + dt * 14);
    } else
      ad.open += ((near ? 1 : 0) - ad.open) * Math.min(1, dt * 5);
    ad.pivot.rotation.y = -ad.open * 1.5;
  }
}
function renderWorld(W, dt, alpha) {
  renderTraffic(W, alpha);
  for (const f2 of W.fans)
    f2.rotation.y += dt * 3;
  for (const p of W.steam || []) {
    p.userData.t += dt * 0.25;
    if (p.userData.t > 1)
      p.userData.t -= 1;
    const t = p.userData.t;
    p.position.set(p.userData.x + Math.sin(t * 9 + p.userData.x) * 0.3 * t, t * 3.2, -1.8 + Math.cos(t * 7) * 0.2 * t);
    p.scale.setScalar(0.4 + t * 1.6);
  }
  if (W.marqueeBulbs) {
    const k2 = Math.floor(W.time * 6);
    W.marqueeBulbs.forEach((b, i) => b.visible = (i + k2) % 3 !== 0);
  }
  if (W.trafficLights) {
    const ph = W.time % 20 / 20;
    const state = ph < 0.55 ? 2 : ph < 0.65 ? 1 : 0;
    for (const set of W.trafficLights)
      set.forEach((m, i) => m.material.emissiveIntensity = i === state ? 3 : 0.08);
  }
  W.applause = Math.max(0, W.applause - dt * 0.5);
  for (const s of W.applauseSigns)
    s.material.emissiveIntensity = 0.15 + W.applause * 3;
  for (const m of W.audience) {
    const a = m.userData.action;
    if (W.applause > 0.15) {
      if (!a.isRunning())
        a.play();
    } else if (a.isRunning())
      a.stop();
    m.userData.mixer.update(dt);
  }
  const f = W.focus;
  const zone = W.zoneAt(f);
  const key = W.keyLight;
  const KEYS = {
    apt: [[APT.x + 1, 6.2, APT.z + 8], [APT.x, 0.5, APT.z - 2], 90],
    stage: [[STAGE.x, 6.5, STAGE.z + 8], [STAGE.x, 1.2, STAGE.z - 1.5], 160],
    cell: [[CELL.x, 3.2, CELL.z + 5], [CELL.x, 0.5, CELL.z - 2], 60]
  };
  let k = KEYS[zone.id];
  if (!k && zone.interior)
    k = [[f.x, 3.9, (zone.z0 + zone.z1) / 2 + zone.side * 2], [f.x, 0, (zone.z0 + zone.z1) / 2], 70];
  if (k) {
    key.position.set(k[0][0], k[0][1], k[0][2]);
    key.target.position.set(k[1][0], k[1][1], k[1][2]);
    key.intensity += (k[2] - key.intensity) * Math.min(1, dt * 4);
  } else
    key.intensity += (0 - key.intensity) * Math.min(1, dt * 4);
  W.sun.position.set(f.x + W.sunDir.x * 90, f.y + W.sunDir.y * 90, f.z + W.sunDir.z * 90);
  W.sun.target.position.copy(f);
}

class Score {
  constructor() {
    this.reset();
    G.physics.onCollision((a, b) => this.onContact(a, b));
  }
  reset() {
    this.laughs = 0;
    this.shown = 0;
    this.comeuppance = 0;
    this.stats = { observations: 0, lies: 0, shoves: 0, knockdowns: 0, bestChain: 0, chains: 0, tidied: 0, pratfalls: 0, bagels: 0, dances: 0, inverses: 0, spills: 0, threads: 0 };
    this.chain = null;
    this.applauseT = 0;
    this.awards = [];
    this.recent = [];
    this.muted = false;
  }
  laugh(amount, reason, { pos = null, size = null, toast = true } = {}) {
    if (this.muted || amount <= 0)
      return;
    this.laughs += amount;
    const s = size ?? Math.min(1.3, amount / 220);
    G.audio.laugh(s);
    if (G.world)
      G.world.applause = Math.min(1, G.world.applause + s * 0.8 + 0.2);
    this.applauseT = Math.max(this.applauseT, 0.6 + s * 1.6);
    if (toast && G.ui)
      G.ui.toast(reason, amount);
  }
  comeup(amount, reason = null) {
    if (this.muted)
      return;
    this.comeuppance = Math.max(0, Math.min(100, this.comeuppance + amount));
    if (reason && G.ui && amount > 0)
      G.ui.toast(`Comeuppance: ${reason}`, null, true);
  }
  excite(entity, source = "player") {
    if (!entity)
      return;
    const now = G.simTime;
    if (!this.chain || now - this.chain.last > 2.2)
      this.chain = { n: 0, last: now, members: new Set, source, started: now };
    this.chain.members.add(entity);
    entity.excitedUntil = now + 2.6;
    this.chain.last = now;
  }
  link(entity) {
    const now = G.simTime;
    if (!this.chain || now - this.chain.last > 2.2)
      this.chain = { n: 0, last: now, members: new Set, source: "scene", started: now };
    if (this.chain.members.has(entity))
      return;
    this.chain.members.add(entity);
    this.chain.n++;
    this.chain.last = now;
    if (entity)
      entity.excitedUntil = now + 2;
    G.audio.sfx("chain", null, 0.6);
    if (this.chain.n >= 2 && G.ui)
      G.ui.callout(`CHAIN ×${this.chain.n + 1}`, null, false, 900);
  }
  onContact(a, b) {
    if (!this.chain)
      return;
    const now = G.simTime;
    const ea = a && a.excitedUntil > now;
    const eb = b && b.excitedUntil > now;
    if (ea === eb)
      return;
    const hitter = ea ? a : b;
    const target = ea ? b : a;
    if (!target || target.kind === "car" || target.held)
      return;
    if (this.chain.members.has(target))
      return;
    const hb = hitter.body || hitter.actor && hitter.actor.body;
    let speed = 0;
    if (hb) {
      const v = hb.linvel();
      speed = Math.hypot(v.x, v.y, v.z);
    }
    if (speed < 1.6)
      return;
    this.chain.members.add(target);
    this.chain.n++;
    this.chain.last = now;
    target.excitedUntil = now + 2;
    if (target.lastHit !== undefined)
      target.lastHit = now;
    G.audio.sfx("chain", null, 0.6);
    if (target.knock && target.state === "free" && target !== G.player) {
      const dx = target.pos.x - (hb ? hb.translation().x : target.pos.x);
      const dz = target.pos.z - (hb ? hb.translation().z : target.pos.z);
      const l = Math.hypot(dx, dz) || 1;
      if (target.knock({ x: dx / l * 220, y: 120, z: dz / l * 220 }, { by: "chain" })) {
        this.stats.knockdowns++;
        if (target.onKnocked)
          target.onKnocked("chain");
      }
    }
    if (this.chain.n >= 2 && G.ui)
      G.ui.callout(`CHAIN ×${this.chain.n + 1}`, null, false, 900);
  }
  tick(dt) {
    if (this.chain && G.simTime - this.chain.last > 1.6) {
      const n = this.chain.n;
      if (n >= 1) {
        const pts = Math.round(30 * Math.pow(n + 1, 1.55));
        this.stats.chains++;
        this.stats.bestChain = Math.max(this.stats.bestChain, n + 1);
        this.laugh(pts, n >= 4 ? `Chain reaction ×${n + 1}!` : `Chain ×${n + 1}`, { size: Math.min(1.4, 0.2 + n * 0.22) });
        if (n >= 4 && G.ui)
          G.ui.callout("CHAIN REACTION!", `${n + 1} links`, false, 1800);
      }
      this.chain = null;
    }
    this.applauseT -= dt;
    if (G.ui)
      G.ui.applause(this.applauseT > 0);
    if (this.shown !== this.laughs) {
      const d = this.laughs - this.shown;
      this.shown += Math.sign(d) * Math.max(1, Math.abs(d) * Math.min(1, dt * 6));
      if (Math.abs(this.laughs - this.shown) < 1)
        this.shown = this.laughs;
      if (G.ui)
        G.ui.setLaughs(this.shown);
    }
    if (G.ui)
      G.ui.setComeuppance(this.comeuppance);
  }
  rating() {
    const l = this.laughs;
    const t = [1200, 2600, 4400, 6600, 9000];
    let stars = 0;
    for (const x of t)
      if (l >= x)
        stars++;
    return Math.max(1, stars);
  }
  verdict() {
    const c = this.comeuppance;
    if (c < 35)
      return { tier: 0, title: "ACQUITTED", text: "Acquitted on a technicality. Pruitt is charged with mail fraud." };
    if (c < 70)
      return { tier: 1, title: "COMMUNITY SERVICE", text: "Forty hours of community service: pigeon cleanup, the entire block." };
    return { tier: 2, title: "GUILTY OF CRIMINAL PETTINESS", text: 'Guilty. One year. The judge called it "a symphony of small offenses."' };
  }
  computeAwards() {
    const s = this.stats;
    const a = [];
    if (s.bestChain >= 5)
      a.push({ title: "Rube Goldberg", detail: `${s.bestChain}-link chain reaction` });
    if (s.observations >= 6)
      a.push({ title: "Observational", detail: `${s.observations} observations` });
    if (s.lies >= 3)
      a.push({ title: "Master of His Domain", detail: `${s.lies} lies, zero regrets` });
    if (s.shoves >= 5)
      a.push({ title: "Get OUT!", detail: `${s.shoves} shoves` });
    if (s.tidied >= 6)
      a.push({ title: "Neat Freak", detail: `${s.tidied} things tidied` });
    if (s.pratfalls >= 2)
      a.push({ title: "Pratfall Professional", detail: `${s.pratfalls} pratfalls` });
    if (this.comeuppance < 15)
      a.push({ title: "Good Samaritan?", detail: "Barely any comeuppance" });
    if (this.comeuppance >= 85)
      a.push({ title: "Repeat Offender", detail: "Maximum comeuppance" });
    if (s.spills === 0 && s.threads >= 4)
      a.push({ title: "Steady Hands", detail: "Not one drop of bisque spilled" });
    this.awards = a;
    return a;
  }
}

async function brothLine(host, { auto = false, queue = 3 } = {}) {

      if (Math.random() < 0.6 || auto) {
        const talk = pick(BROTH_SMALLTALK);

async function danceOff(host, { auto = false, notes = 12 } = {}) {
  auto = auto || !!G.flags.autoplay;
  const ov = new Overlay("THE DANCE", `Hit each button as it crosses the line. Commit. Total commitment.`);
  const track = el("div", "beats", ov.el);
  el("div", "hit", track);
  const delia = G.cast.delia;
  G.audio.playMusic("dance");
  delia.anim.play("dance", { loop: true });
  const spb = 0.5;
  const lead = 1.6;
  const chart = [];
  for (let i = 0;i < notes; i++)
    chart.push({ t: lead + i * spb * 2 + (i % 3 === 2 ? spb : 0), b: FACE[(i * 7 + 3) % 4], el: null, judged: false });
  for (const n of chart) {
    const d = el("div", "note", track);
    d.innerHTML = G.ui.glyph(n.b);
    n.el = d;
  }
  let t = 0;
  let hits = 0;
  let perfects = 0;
  let combo = 0;
  let bestCombo = 0;
  const end = chart[chart.length - 1].t + 1.2;
  await new Promise((res) => {
    G.minigame = {
      update(dt, input) {
        t += dt;
        for (const n of chart) {
          const x = 18 + (n.t - t) * 26;
          n.el.style.left = `${x}%`;
          n.el.style.opacity = x > 100 || n.judged ? "0" : "1";
          if (!n.judged && t - n.t > 0.28) {
            n.judged = true;
            combo = 0;
            showGrade(ov, "MISS", "#ff5a6e");
          }
        }
        const pressed = FACE.filter((f) => input.pressed(f));
        let want = chart.find((n) => !n.judged && Math.abs(n.t - t) < 0.28);
        if (auto && want && Math.abs(want.t - t) < 0.03)
          pressed.push(want.b);
        if (pressed.length && want) {
          want.judged = true;
          if (pressed.includes(want.b)) {
            const err = Math.abs(want.t - t);
            hits++;
            combo++;
            bestCombo = Math.max(bestCombo, combo);
            if (err < 0.1) {
              perfects++;
              showGrade(ov, "PERFECT", "#66e3b5");
            } else
              showGrade(ov, "GOOD", "#ffcf4a");
            if (combo % 4 === 0)
              G.audio.laugh(0.3);
            for (const o of host.danceWatchers ? host.danceWatchers() : [])
              if (Math.random() < 0.25)
                o.anim.play(Math.random() < 0.5 ? "facepalm" : "cower");
          } else {
            combo = 0;
            showGrade(ov, "WRONG", "#ff5a6e");
          }
        }
        if (t > end) {
          G.minigame = null;
          res();
        }
      }
    };
  });
  ov.close();
  delia.anim.stop("dance");
  const score = Math.round(hits / notes * 100);
  const pts = 120 + hits * 30 + perfects * 20 + bestCombo * 10;
  G.score.stats.dances++;
  G.score.laugh(pts, `The Dance: ${score}% (${perfects} perfect)`, { size: 1.2 });
  G.audio.crowd("applause", 0.8);
  if (host.musicFor)
    G.audio.playMusic(host.musicFor());
  return { hits, perfects, score };
}

class Animator {
  constructor(rig) {
    this.rig = rig;
    this.mixer = new THREE12.AnimationMixer(rig.root);
    const clips = getClips();
    this.actions = {};
    for (const [name, clip] of Object.entries(clips)) {
      const a = this.mixer.clipAction(clip);
      if (clip.userData && clip.userData.additive)
        a.blendMode = THREE12.AdditiveAnimationBlendMode;
      a.enabled = true;
      a.setEffectiveWeight(0);
      this.actions[name] = a;
    }
    for (const n of ["idle", "walk", "run", "sneak"]) {
      this.actions[n].play();
      this.actions[n].time = Math.random() * this.actions[n].getClip().duration;
    }
    this.loco = { idle: 1, walk: 0, run: 0, sneak: 0 };
    this.target = { idle: 1, walk: 0, run: 0, sneak: 0 };
    this.state = null;
    this.stateWeight = 0;
    this.stateTarget = 0;
    this.stateTimer = 0;
    this.stateLoop = false;
    this.overlays = { carry: 0, talk: 0 };
    this.overlayTarget = { carry: 0, talk: 0 };
    this.actions.carry.play();
    this.actions.talk.play();
    this.speed = 0;
  }
  setLocomotion(speed, { sneak = false, hurry = false } = {}) {
    this.speed = speed;
    const t = this.target;
    t.idle = t.walk = t.run = t.sneak = 0;
    if (speed < 0.15)
      t.idle = 1;
    else if (sneak)
      t.sneak = 1;
    else if (speed > 4.2 || hurry) {
      const k = Math.min(1, Math.max(0, (speed - 3.2) / 1.6));
      t.run = k;
      t.walk = 1 - k;
    } else
      t.walk = 1;
    this.actions.walk.timeScale = Math.max(0.6, speed / 1.9);
    this.actions.run.timeScale = Math.max(0.8, speed / 5.5);
    this.actions.sneak.timeScale = Math.max(0.5, speed / 1.3);
  }
  play(name, { loop = false, fade = 0.12, timeScale = 1, hold = 0 } = {}) {
    const a = this.actions[name];
    if (!a)
      return 0;
    if (this.state && this.state !== name) {
      const prev = this.actions[this.state];
      prev.fadeOut && prev.setEffectiveWeight(0);
      prev.stop();
    }
    a.reset();
    a.setLoop(loop ? THREE12.LoopRepeat : THREE12.LoopOnce, loop ? Infinity : 1);
    a.clampWhenFinished = true;
    a.timeScale = timeScale;
    a.play();
    this.state = name;
    this.stateLoop = loop;
    this.stateTarget = 1;
    this.fade = fade;
    const dur = a.getClip().duration / timeScale;
    this.stateTimer = loop ? Infinity : dur + hold;
    return dur;
  }
  stop(name = null, fade = 0.2) {
    if (name && this.state !== name)
      return;
    this.stateTarget = 0;
    this.fade = fade;
    this.stateTimer = 0;
  }
  is(name) {
    return this.state === name && this.stateTarget > 0;
  }
  overlay(name, on) {
    this.overlayTarget[name] = on ? 1 : 0;
  }
  update(dt) {
    const k = 1 - Math.exp(-dt * 10);
    for (const n of ["idle", "walk", "run", "sneak"])
      this.loco[n] += (this.target[n] - this.loco[n]) * k;
    if (this.state) {
      this.stateTimer -= dt;
      if (this.stateTimer <= 0 && !this.stateLoop)
        this.stateTarget = 0;
      const rate = dt / Math.max(0.01, this.fade || 0.12);
      if (this.stateWeight < this.stateTarget)
        this.stateWeight = Math.min(this.stateTarget, this.stateWeight + rate);
      else
        this.stateWeight = Math.max(this.stateTarget, this.stateWeight - rate);
      if (this.stateWeight <= 0 && this.stateTarget === 0) {
        this.actions[this.state].stop();
        this.state = null;
      } else
        this.actions[this.state].setEffectiveWeight(this.stateWeight);
    } else
      this.stateWeight = 0;
    const base = 1 - this.stateWeight;
    for (const n of ["idle", "walk", "run", "sneak"])
      this.actions[n].setEffectiveWeight(this.loco[n] * base);
    for (const n of ["carry", "talk"]) {
      this.overlays[n] += (this.overlayTarget[n] - this.overlays[n]) * k;
      this.actions[n].setEffectiveWeight(this.overlays[n] * (n === "talk" ? base * 0.8 : 1));
    }
    this.mixer.update(dt);
  }
}

import * as THREE14 from "three/webgpu";
var tmp = new THREE14.Vector3;
function steer(actor, tx, tz, speedScale = 1, arrive = 0.25) {
  const dx = tx - actor.pos.x;
  const dz = tz - actor.pos.z;
  const d = Math.hypot(dx, dz);
  const it = actor.intent;
  if (d < arrive) {
    it.x = it.z = 0;
    return true;
  }
  let nx = dx / d;
  let nz = dz / d;
  const p = G.player;
  if (p && p !== actor && p.enabled) {
    const px = p.pos.x - actor.pos.x;
    const pz = p.pos.z - actor.pos.z;
    const pd = Math.hypot(px, pz);
    if (pd < 1.6 && px * nx + pz * nz > 0) {
      const side = px * nz - pz * nx > 0 ? 1 : -1;
      nx += -nz * side * 0.9;
      nz += nx * side * 0.9;
      const l = Math.hypot(nx, nz);
      nx /= l;
      nz /= l;
    }
  }
  const b = actor.brain;
  if (b) {
    const moving = Math.hypot(actor.vel.x, actor.vel.z);
    if (moving < 0.15)
      b.stuck = (b.stuck || 0) + G.fixedDt;
    else
      b.stuck = Math.max(0, (b.stuck || 0) - G.fixedDt);
    if (b.stuck > 0.7) {
      b.sidestep = b.sidestep || (Math.random() < 0.5 ? 1 : -1);
      nx += -nz * b.sidestep * 1.5;
      nz += nx * b.sidestep * 1.5;
      const l = Math.hypot(nx, nz);
      nx /= l;
      nz /= l;
      if (b.stuck > 2.2) {
        b.stuck = 0;
        b.sidestep = -b.sidestep;
      }
    }
  }
  const s = Math.min(1, d / 0.8) * speedScale;
  it.x = nx * s;
  it.z = nz * s;
  return false;
}

class Brain {
  constructor(actor, opts = {}) {
    this.actor = actor;
    this.opts = opts;
    this.home = opts.home || { x: actor.pos.x, z: actor.pos.z, yaw: actor.yaw };

    this.fleeFrom = null;
    this.react = 0;

  }
  tick(dt) {
    const a = this.actor;
    if (a.state !== "free")
      return;
    if (this.paused) {
      a.intent.x = a.intent.z = 0;
      return;
    }
    if (this.fleeT > 0) {
      this.fleeT -= dt;
      const dx = a.pos.x - this.fleeFrom.x;
      const dz = a.pos.z - this.fleeFrom.z;
      const d = Math.hypot(dx, dz) || 1;
      a.intent.x = dx / d;
      a.intent.z = dz / d;
      a.intent.hurry = true;
      a.intent.face = null;
      if (this.fleeT <= 0)
        a.intent.hurry = false;
      return;
    }
    if (this.stareT > 0) {
      this.stareT -= dt;
      a.intent.x = a.intent.z = 0;
      if (this.stareAt)
        a.intent.face = Math.atan2(this.stareAt.x - a.pos.x, this.stareAt.z - a.pos.z);

        a.intent.face = null;

    this.fleeFrom = { x: from.x, z: from.z };
    this.fleeT = t;
  }
  stare(at, t = 2.5, anim = "facepalm") {
    this.stareAt = { x: at.x, z: at.z };
    this.stareT = t;
    if (anim)
      this.actor.anim.play(anim);
  }
}

class Walker extends Brain {
  constructor(actor, opts) {
    super(actor, opts);
    this.path = opts.path;
    this.i = opts.start || 0;
    this.dir = 1;
    this.speed = opts.speed || rand(0.65, 0.9);
    this.wait = 0;
    this.pingpong = opts.pingpong !== false;
  }
  think(dt) {
    const a = this.actor;
    a.intent.face = null;
    if (this.wait > 0) {
      this.wait -= dt;
      a.intent.x = a.intent.z = 0;
      return;
    }
    const p = this.path[this.i];
    if (steer(a, p.x, p.z, this.speed, 0.6)) {
      if (Math.random() < (this.opts.pauseChance ?? 0.15))
        this.wait = rand(1, 4);
      if (this.pingpong) {
        if (this.i + this.dir >= this.path.length || this.i + this.dir < 0)
          this.dir = -this.dir;
        this.i += this.dir;
      } else
        this.i = (this.i + 1) % this.path.length;
    }
  }
}

class Idler extends Brain {
  constructor(actor, opts) {
    super(actor, opts);
    this.loopAnim = opts.anim || null;
    this.faceYaw = opts.face ?? actor.yaw;
    this.animT = rand(0, 3);
  }
  think(dt) {
    const a = this.actor;
    const h = this.home;

        this.animT -= dt;
        if (this.animT <= 0)
          a.anim.play(this.loopAnim, { loop: true, fade: 0.3 });
      }
    } else {
      a.intent.face = null;
      if (this.loopAnim && a.anim.is(this.loopAnim))
        a.anim.stop(this.loopAnim);
      this.animT = 0.5;
    }
  }
}

class Patrol extends Brain {
  constructor(actor, opts) {
    super(actor, opts);
    this.points = opts.points;
    this.i = 0;
    this.dwell = 0;
    this.fov = opts.fov ?? 1.1;

class Flock {
  constructor() {
    this.pigeons = [];
    this.baits = [];

    this.captured = 0;
    this.onCaptureCb = null;
  }
  spawn(n, home) {
    for (let i = 0;i < n; i++)
      this.pigeons.push(new Pigeon(home.x + rand(-home.r, home.r), home.z + rand(-1, 1), home));
  }
  threats() {
    return G.actors.filter((a) => a.enabled && a.state !== "knocked");
  }
  addBait(entity) {
    this.baits.push(entity);
  }
  nearestBait(p, maxD) {
    let best = null;
    let bd = maxD;
    for (const b of this.baits) {
      if (!b.mesh || !b.body || !b.resting)
        continue;
      const bp = b.body.translation();
      const d = Math.hypot(bp.x - p.x, bp.z - p.z);
      if (d < bd) {
        bd = d;
        best = b;
      }
    }
    return best;
  }
  onCapture(pg) {
    this.captured++;
    if (this.onCaptureCb)
      this.onCaptureCb(pg, this.captured);
  }
  scareAll(from, r = 8) {
    for (const p of this.pigeons)
      if (Math.hypot(p.g.position.x - from.x, p.g.position.z - from.z) < r)
        p.scare(from);
  }
  release() {
    for (const p of this.pigeons) {
      if (p.captured) {
        p.captured = false;
        p.scare({ x: p.g.position.x, z: p.g.position.z + 1 });
      }
    }
    this.captured = 0;
  }
  update(dt) {
    for (const b of this.baits) {
      if (!b.body || !b.mesh)
        continue;
      const v = b.body.linvel();
      b.resting = Math.hypot(v.x, v.y, v.z) < 0.4 && b.body.translation().y < 2.5;
      if (this.crate && b.resting) {
        const c = this.crate;
        const bp = b.body.translation();
        b.inCrate = Math.abs(bp.x - c.x) < c.hx + 0.35 && Math.abs(bp.z - c.z) < c.hz + 0.3 && bp.y < c.y + 0.5;

    for (const p of this.pigeons)
      p.update(dt, this);
  }

    for (const p of this.pigeons)
      p.dispose();

  }

  observeTarget(a) {

    cam.getWorldDirection(fwd);
    for (const o of this.observables()) {

      const score = Math.max(dot2, facing) * 2 - d * 0.05;

  objectiveTarget() {

        return { ...W.portals.find((x) => x.id === "stageDoor").at, label: "Exit" };
      if (zone !== "apt" && pt.z < -400 && pt.x > -20 && pt.x < 20)
        return { ...W.portals.find((x) => x.id === "wexler").at, label: "3C" };
      return pt;
    };
    if (this.finaleReady)
      return toStreet({ ...P.dinerBooth, label: "Corner Booth" });
    const t = this.threads[p.id];
    if (t.done)
      return null;
    const step = t.step;
    switch (p.id) {
      case "marty":
        if (step === 0) {
          let best = null;
          let bd = Infinity;
          for (const o of this.observables()) {
            if (this.material.includes(o.id) || !o.pos)
              continue;
            const d = dist2(o.pos, p.pos);
            if (d < bd) {
              bd = d;
              best = o;
            }
          }
          return best ? toStreet({ x: best.pos.x, y: best.pos.y - 1.6, z: best.pos.z, label: "Something absurd" }) : null;
        }
        if (step === 1) {
          if (zone !== "apt")
            return toStreet({ x: APT.x, y: 0, z: APT.z, label: "3C" });
          let best = null;
          let bd = Infinity;
          for (const pr of W.tidyHomes) {
            if (displacement(pr) < 0.2 || !pr.mesh)
              continue;
            const d = dist2(pr.mesh.position, p.pos);
            if (d < bd) {
              bd = d;
              best = pr;
            }
          }
          if (W.poster && Math.abs(W.poster.rotation.z) > 0.05 && !best) {
            const wp = W.poster.getWorldPosition(new THREE16.Vector3);
            return { x: wp.x, y: wp.y - 2, z: wp.z, label: "Crooked poster" };
          }
          return best ? { x: best.mesh.position.x, y: best.mesh.position.y - 1.2, z: best.mesh.position.z, label: best.label } : null;

        return toStreet({ ...G.npcBy.sal.pos, label: "Sal" });
      case "lenny":
        if (step === 0)
          return toStreet({ ...G.npcBy.kaplan.pos, label: "Kaplan" });

          return toStreet({ x: 31, y: SY2, z: 6, label: "Meter" });

      case "delia":
        if (step === 0)
          return toStreet({ ...this.brothEnd(), label: "The line" });

      case "zablocki":
        if (step === 0)
          return toStreet({ ...P.crate, label: "Crate" });
        if (step === 1)
          return toStreet({ ...P.stoopDoor, label: "Make an Entrance" });
        return toStreet({ ...G.cast.marty.pos, label: "Marty" });
    }
    return null;
  }

var SY3 = SIDEWALK_Y;
var LANE_X = [-55, -49, -43, -37, -31, -26, -20, -14, -8, -2, 4, 10, 16, 22, 28, 33, 38, 44, 50, 55];

class NavGraph {
  constructor() {
    const n = [];
    for (const x of LANE_X) {
      n.push({ x, z: -6.2, y: SY3 });
      n.push({ x, z: 6.3, y: SY3 });
      n.push({ x, z: 0, y: 0 });
    }
    const extra = [
      [-47, -8.9, SY3],
      [-47, -12.2, SY3],
      [-48, -14.3, SY3],
      [33, -8.9, SY3],
      [33, -12.8, SY3],
      [40, -13.6, SY3],
      [46, -13.6, SY3],
      [50.8, -13.1, SY3],
      [44, -18.4, SY3],
      [38, -18.4, SY3],
      [-44, 8.9, SY3],
      [-44, 12.2, SY3],
      [-42.4, 15.5, SY3],
      [-43.5, 18.4, SY3],
      [-49.5, 13.5, SY3],
      [-26, -7.4, SY3],
      [-26, -9.5, 1.1],
      [-2, 8.9, SY3],
      [16, -8.8, SY3],
      [50, 6.95, SY3],
      [6, -6, SY3],
      [-22, 8.1, SY3],
      [31, 6, SY3],
      [-19.6, -6.6, SY3]
    ];
    for (const [x, z, y] of extra)
      n.push({ x, z, y });
    G.physics.step();
    const free = [];
    for (const p of n) {
      const spot = this.roomAt(p);
      if (spot)
        free.push(spot);
    }
    this.nodes = free.map((p, i) => ({ ...p, i, edges: [] }));
    this.build();
  }
  blocked(x, y, z) {
    const R = G.physics.R;
    const ball = new R.Ball(0.36);
    return !!G.physics.world.intersectionWithShape({ x, y: y + 0.9, z }, { x: 0, y: 0, z: 0, w: 1 }, ball, undefined, groups(65535, GROUP.STATIC));
  }
  roomAt(p) {
    const y = p.y || 0;
    if (!this.blocked(p.x, y, p.z))
      return p;
    for (const r of [0.6, 1, 1.5]) {
      for (const [dx, dz] of [[0, 1], [0, -1], [1, 0], [-1, 0], [0.7, 0.7], [-0.7, 0.7], [0.7, -0.7], [-0.7, -0.7]]) {
        const q = { x: p.x + dx * r, y, z: p.z + dz * r };
        if (!this.blocked(q.x, y, q.z))
          return q;
      }
    }
    return null;
  }
  clear(a, b, h = 0.75) {
    const dx = b.x - a.x;
    const dz = b.z - a.z;
    const dy = (b.y || 0) - (a.y || 0);
    const len = Math.hypot(dx, dz);
    if (len < 0.01)
      return true;
    const px = -dz / len;
    const pz = dx / len;
    for (const off of [-0.32, 0, 0.32]) {
      const o = { x: a.x + px * off, y: (a.y || 0) + h, z: a.z + pz * off };
      const l3 = Math.hypot(dx, dy, dz);
      const dir = { x: dx / l3, y: dy / l3, z: dz / l3 };
      const hit = G.physics.ray(o, dir, l3, { filterGroups: groups(65535, GROUP.STATIC) });
      if (hit)
        return false;
    }
    return true;
  }
  build() {
    const N = this.nodes;
    for (let i = 0;i < N.length; i++) {
      for (let j = i + 1;j < N.length; j++) {
        const a = N[i];
        const b = N[j];
        const d = Math.hypot(a.x - b.x, a.z - b.z);
        if (d > 13 || d < 0.1)
          continue;
        if (this.clear(a, b)) {
          a.edges.push({ to: j, d });
          b.edges.push({ to: i, d });
        }
      }
    }
  }
  nearest(p, needClear = true) {
    let best = null;
    let bd = Infinity;
    for (const n of this.nodes) {
      const d = Math.hypot(n.x - p.x, n.z - p.z) + Math.abs((n.y || 0) - (p.y || 0)) * 3;
      if (d < bd && (!needClear || d < 1 || this.clear(p, n))) {
        bd = d;
        best = n;
      }
    }
    return best || (needClear ? this.nearest(p, false) : null);
  }
  path(from, to) {
    const s = this.nearest(from);
    const t = this.nearest(to);
    if (!s || !t)
      return [to];
    const N = this.nodes;
    const g = new Map([[s.i, 0]]);
    const came = new Map;
    const open = new Set([s.i]);
    const h = (i) => Math.hypot(N[i].x - t.x, N[i].z - t.z);
    while (open.size) {
      let cur = null;
      let cf = Infinity;
      for (const i of open) {
        const f = g.get(i) + h(i);
        if (f < cf) {
          cf = f;
          cur = i;
        }
      }
      if (cur === t.i)
        break;
      open.delete(cur);
      for (const e of N[cur].edges) {
        const ng = g.get(cur) + e.d;
        if (ng < (g.get(e.to) ?? Infinity)) {
          g.set(e.to, ng);
          came.set(e.to, cur);
          open.add(e.to);
        }
      }
    }
    const out = [];
    let c = t.i;
    if (!came.has(c) && c !== s.i)
      return [to];
    while (c !== undefined && c !== s.i) {
      out.unshift(N[c]);
      c = came.get(c);
    }
    out.unshift(s);
    out.push(to);
    const sm = [];
    let anchor = from;
    for (let i = 0;i < out.length; i++) {
      const next = out[i + 1];
      if (next && Math.abs((next.y || 0) - (anchor.y || 0)) < 0.3 && this.clear(anchor, next))
        continue;
      sm.push(out[i]);
      anchor = out[i];
    }
    return sm.length ? sm : [to];
  }
}

class Driver {
  constructor(actor, nav, { cheat = false, speed = 1, hurry = false } = {}) {
    this.a = actor;
    this.nav = nav;
    this.cheat = cheat;
    this.speed = speed;
    this.hurry = hurry;
    this.path = null;
    this.goal = null;
    this.stuck = 0;
    this.arrived = true;
  }
  goTo(p, { arrive = 0.5 } = {}) {
    this.stuckPlans = 0;
    this.goal = { x: p.x, y: p.y ?? 0, z: p.z };
    this.arriveR = arrive;
    this.path = this.nav.path(this.a.pos, this.goal);
    this.arrived = false;
    this.stuck = 0;
  }
  stop() {
    this.path = null;
    this.arrived = true;
    this.a.intent.x = this.a.intent.z = 0;
    this.a.intent.hurry = false;
  }
  tick(dt) {
    const a = this.a;
    if (!this.path || this.arrived || a.state !== "free")
      return;
    let tgt = this.path[0];
    let d = Math.hypot(tgt.x - a.pos.x, tgt.z - a.pos.z);
    while (d < (this.path.length === 1 ? this.arriveR : 0.7) && this.path.length) {
      this.path.shift();
      if (!this.path.length) {
        this.stop();
        return;
      }
      tgt = this.path[0];
      d = Math.hypot(tgt.x - a.pos.x, tgt.z - a.pos.z);
    }
    let nx = (tgt.x - a.pos.x) / d;
    let nz = (tgt.z - a.pos.z) / d;
    const sp = Math.hypot(a.vel.x, a.vel.z);
    if (sp < 0.3)
      this.stuck += dt;
    else
      this.stuck = Math.max(0, this.stuck - dt * 2);
    if (this.stuck > 0.6) {
      const side = Math.sin(G.simTime * 1.7) > 0 ? 1 : -1;
      nx += -nz * side * 1.2;
      nz += nx * side * 1.2;
      const l = Math.hypot(nx, nz);
      nx /= l;
      nz /= l;
    }
    this.replanT = (this.replanT || 0) + dt;
    if (this.stuck > 1.2 || this.replanT > 3) {
      this.replanT = 0;
      if (this.stuck > 1.2)
        this.stuckPlans = (this.stuckPlans || 0) + 1;
      this.path = this.nav.path(a.pos, this.goal);
      this.stuck = 0;
      if (this.stuckPlans > (this.cheat ? 1 : 3)) {
        const nxt = this.path[0];
        const dd = Math.hypot(nxt.x - a.pos.x, nxt.z - a.pos.z) || 1;
        const step = Math.min(dd, 1.2);
        const to = { x: a.pos.x + (nxt.x - a.pos.x) / dd * step, y: a.pos.y, z: a.pos.z + (nxt.z - a.pos.z) / dd * step };
        if (this.cheat || this.nav.clear(a.pos, to))
          a.teleport(to.x, Math.max(a.pos.y, nxt.y ?? a.pos.y), to.z, a.yaw);
        this.stuckPlans = 0;
      }
      return;
    }
    a.intent.x = nx * this.speed;
    a.intent.z = nz * this.speed;
    a.intent.hurry = this.hurry && d > 2;
    a.intent.face = null;
  }
}

// src/game/attract.js
var SY4 = SIDEWALK_Y;

class Attract {
  constructor() {
    this.ep = new Episode({ attract: true });
    this.stopped = false;
    this.drivers = [];
  }
  start() {
    G.flags.autoDialogue = true;
    this.ep.setup();
    this.nav = new NavGraph;
    for (const k of ["marty", "lenny", "delia", "zablocki"]) {
      const d = new Driver(G.cast[k], this.nav, { cheat: true, speed: 0.75 });
      G.cast[k].driver = d;
      this.drivers.push(d);
    }
    this.overlay = el("div", "attract", G.ui.fxEl);
    const logo = makeLogo();
    logo.classList.add("mini");
    this.overlay.appendChild(logo);
    el("div", "badge", this.overlay, "DEMO");
    this.cap = el("div", "cap", this.overlay, "");
    const press = el("div", "press", this.overlay);
    press.innerHTML = G.ui.touchOnly ? "Controller or keyboard required to play" : `Press any button`;
    G.ui.hud(true);
    G.ui.hudEl.querySelector(".who").classList.add("hidden");
    this.loop();
  }
  caption(t) {
    this.cap.textContent = t;
  }
  wait(s) {
    return G.dialogue.wait(s);
  }
  use(key) {
    const a = G.cast[key];
    G.player = a;
    a.brain = null;
    return a;
  }
  async walk(a, p, timeout = 6) {
    a.driver.goTo(p, { arrive: 0.6 });
    const t0 = G.simTime;
    while (!a.driver.arrived && G.simTime - t0 < timeout && !this.stopped)
      await this.wait(0.1);
    a.driver.stop();
  }
  async loop() {
    const beats = [
      () => this.beatEntrance(),
      () => this.beatShove(),
      () => this.beatCannon(),
      () => this.beatObserve(),
      () => this.beatInverse(),
      () => this.beatDance(),
      () => this.beatBroth(),
      () => this.beatStandup(),
      () => this.beatChain()
    ];
    while (!this.stopped) {
      for (const b of beats) {
        if (this.stopped)
          return;
        try {
          await b();
        } catch (e) {
          console.warn("attract beat failed", e);
        }
        G.cam.release();
        G.cutscene = false;
      }
      if (!this.stopped && G.restartAttract) {
        G.restartAttract();
        return;
      }
    }
  }
  async beatEntrance() {
    this.caption("Zablocki never knocks. He makes an ENTRANCE.");
    const z = this.use("zablocki");
    z.teleport(-26, SY4, -2.4, Math.PI);
    G.cam.setMode("third");
    await this.walk(z, { x: -26, y: SY4, z: -6.9 });
    z.yaw = Math.PI;
    G.cam.setMode("audience");
    this.ep.ctl.ability(z, "square");
    await this.wait(0.15);
    if (G.world.zoneAt(z.pos).id !== "apt")
      this.ep.teleportVia(z, G.world.portals.find((p) => p.id === "wexler"), true);
    await this.wait(3.2);
  }
  async beatShove() {
    this.caption("Delia does not wait in line behind line cutters.");
    const d = this.use("delia");
    const nate = G.npcBy.nate;
    G.cam.setMode("third");
    d.teleport(nate.pos.x + 3.2, SY4, nate.pos.z + 0.2, -Math.PI / 2);
    G.cam.yaw = d.yaw + Math.PI;
    await this.walk(d, { x: nate.pos.x + 1.2, y: SY4, z: nate.pos.z });
    d.yaw = Math.atan2(nate.pos.x - d.pos.x, nate.pos.z - d.pos.z);
    this.ep.ctl.ability(d, "square");
    await this.wait(3);
  }
  async beatCannon() {
    this.caption("The Bagel Cannon. The pigeons approve.");
    const z = this.use("zablocki");
    z.teleport(-13.5, SY4, -6.6, -Math.PI / 2);
    G.cam.setMode("third");
    G.cam.yaw = z.yaw + Math.PI;
    const crate = G.world.points.crate;
    this.ep.cannonAim = () => {
      const dx = crate.x - z.pos.x + (Math.random() - 0.5) * 0.6;
      const dz = crate.z - z.pos.z;
      return { yaw: Math.atan2(dx, dz), pitch: 0.42 };
    };
    this.ep.cannonSpeed = () => 6.2 + Math.random() * 0.4;
    for (let i = 0;i < 5 && !this.stopped; i++) {
      this.ep.ctl.ability(z, "triangle");
      await this.wait(0.7);
    }
    this.ep.cannonAim = null;
    this.ep.cannonSpeed = () => 11;
    G.cam.setMode("audience");
    await this.wait(3.5);
  }
  async beatObserve() {
    this.caption(`Marty notices everything. "What's the deal with...?"`);
    const m = this.use("marty");
    m.teleport(2.4, SY4, -5.4, Math.PI / 2 + 0.5);
    G.cam.setMode("first");
    G.cam.yaw = m.yaw + Math.PI;
    G.cam.pitch = -0.1;
    await this.wait(0.8);
    const o = G.world.observables.find((x) => x.id === "news");
    m.yaw = Math.atan2(o.pos.x - m.pos.x, o.pos.z - m.pos.z);
    G.cam.yaw = m.yaw + Math.PI;
    this.ep.ctl.ability(m, "square");
    await this.wait(3.2);
    G.cam.setMode("third");
    await this.wait(1);
  }
  async beatInverse() {
    this.caption("Lenny tries The Inverse: every instinct, reversed.");
    const l = this.use("lenny");
    const pr = G.npcBy.pruitt;
    pr.teleport(41, SY4, 6.6, -Math.PI / 2);
    l.teleport(36.5, SY4, 6.6, Math.PI / 2);
    G.cam.setMode("audience");
    await this.wait(0.6);
    this.ep.ctl.ability(l, "triangle");
    await this.wait(1.4);
    this.ep.ctl.ability(l, "square");
    await this.wait(2);
    await this.walk(l, { x: 30, y: SY4, z: 7.2 }, 3);
    await this.wait(1);
    this.ep.ctl.endInverse();
  }
  async beatDance() {
    this.caption("The Dance. Nobody who sees it is ever the same.");
    const d = this.use("delia");
    d.teleport(-2, SY4, -7.4, 0);
    let i = 0;
    for (const n of G.npcs) {
      if (!n.key.startsWith("ped") || i > 4)
        continue;
      n.teleport(-2 + Math.cos(i * 1.3) * 3, SY4, -7.4 + Math.sin(i * 1.3) * 1.4, 0);
      i++;
    }
    G.cam.setMode("third");
    G.cam.yaw = Math.PI * 0.85;
    await this.wait(0.5);
    this.ep.ctl.ability(d, "triangle");
    for (let k = 0;k < 30 && !this.stopped; k++) {
      G.cam.yaw += 0.04;
      await this.wait(0.1);
    }
  }
  async beatBroth() {
    this.caption("The Broth Baron. No small talk. Step to the LEFT.");
    const d = this.use("delia");
    G.cutscene = true;
    this.ep.brothLayout(1);
    const s = G.world.brothSlots[1];
    d.teleport(s.x, SY4, s.z, -Math.PI / 2);
    this.ep.deliaFollowsLine = true;
    G.cam.cut({ x: -15.8, y: 2.8, z: 3.4 }, { x: -20.2, y: 1.2, z: 8.7 });
    await brothLine(this.ep, { auto: true, queue: 1 });
    this.ep.deliaFollowsLine = false;
    G.cutscene = false;
    G.cam.release();
    await this.wait(0.5);
  }
  async beatStandup() {
    this.caption("Stand-up at The Punchline Pit: hit the pause.");
    const m = this.use("marty");
    const mic = G.world.points.stageMic;
    m.teleport(mic.x, mic.y, mic.z, 0);
    m.state = "scripted";
    m.intent.face = 0;
    G.world.focus.set(mic.x, 1, mic.z);
    G.cutscene = true;
    G.cam.cut({ x: STAGE.x + 0.3, y: 1.9, z: STAGE.z + 3.6 }, { x: mic.x, y: 1.8, z: mic.z });
    await standUp([COLD_OPEN[0]], { attract: true, title: "STAND-UP" });
    m.state = "free";
    G.cutscene = false;
    G.cam.release();
  }
  async beatChain() {
    this.caption("Chain reactions are worth big laughs.");
    const z = this.use("zablocki");
    z.teleport(40.5, SY4, 7.9, Math.PI / 2);
    G.cam.setMode("third");
    G.cam.yaw = -Math.PI / 2 + 0.6;
    await this.wait(0.6);
    this.ep.ctl.ability(z, "square");
    await this.wait(1);
    this.ep.ctl.ability(z, "triangle");
    await this.wait(3);
  }
  frame() {
    const p = G.player;
    if (p) {
      G.ui.setAbilities([]);
      G.ui.prompt(null);
      const tags = this.ep.ctl.bubbles.filter((b) => b.actor.enabled).map((b) => {
        const hp = b.actor.headPos(new THREE17.Vector3);
        return { id: "b-" + b.actor.id, pos: { x: hp.x, y: hp.y + 0.45, z: hp.z }, text: `“${b.text}”`, color: b.actor.color || "#999" };
      });
      G.ui.setTags(tags);
      G.ui.setMarkers([]);
    }
  }
  tick(dt) {
    for (const d of this.drivers)
      d.tick(dt);
    this.ep.tick(dt);
  }
  render(dt) {
    this.ep.render(dt);
  }
  dispose() {
    this.stopped = true;
    G.flags.autoDialogue = false;
    if (this.overlay)
      this.overlay.remove();
    G.ui.hudEl.querySelector(".who").classList.remove("hidden");
    this.ep.dispose();
  }
}

// src/game/race.js
import * as THREE18 from "three/webgpu";
var SY5 = SIDEWALK_Y;
var SEND_EVERY = 1 / 15;
var SEAT_COLORS = ["#e8443a", "#3b82f6", "#22c55e", "#f5b700"];
var ERRANDS = [
  { id: "news", label: "Buy a paper at Kaplan's", pos: { x: 6, y: SY5, z: -6 } },
  { id: "broth", label: "Grab a broth to go", pos: { x: -22, y: SY5, z: 8.2 } },
  { id: "bakery", label: "Pick up rye at Gelman's", pos: { x: -48, y: SY5, z: -14.3 } },
  { id: "mail", label: "Mail the chain letter", pos: { x: 50, y: SY5, z: 6.95 } },
  { id: "meter", label: "Feed a meter", pos: { x: 25, y: SY5, z: 6 } },
  { id: "video", label: "Return a video to Reel Deal", pos: { x: 16, y: SY5, z: -8.8 } },
  { id: "club", label: "Sign up for Open Mic", pos: { x: -2, y: SY5, z: 8.9 } },
  { id: "office", label: "Drop a manuscript at Pendergast", pos: { x: -44, y: SY5, z: 12.2 } }
];
var FINAL = { id: "booth", label: "Slide into the Corner Booth", pos: { x: 50.8, y: SY5, z: -13.1 } };
var SIG = { marty: "What's the deal?", lenny: "The Inverse", delia: "The Dance", zablocki: "Entrance" };

class Race {
  constructor({ session = null, info = null } = {}) {
    this.session = session;
    this.info = info;
    this.state = "ready";
    this.errIdx = 0;
    this.hold = 0;
    this.sendT = 0;
    this.rivals = new Map;
    this.done = new Map;
    this.claims = new Map;
    this.boostT = 0;
    this.stats = { shoves: 0, hits: 0, pickups: 0, bumps: 0 };
    this.cpu = [];
    this.startWall = null;
    this.localTime = 0;
    this.ctl = new PlayerControl(this);
    this.stunT = 0;
    this.lastProgress = -1;
  }
  now() {
    if (this.session)
      return this.session.time();
    return this.localTime * 1000 - (this.countdownMs || 0);
  }
  setup() {
    const rng = this.session ? this.session.rng("course") : Math.random;
    const pool = [...ERRANDS];
    for (let i = pool.length - 1;i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    this.errands = [...pool.slice(0, 4), FINAL];
    this.pickups = [];
    const spots = [{ x: -8, z: 0.8 }, { x: 22, z: -0.8 }, { x: 40, z: 0.6 }, { x: -36, z: -0.6 }, { x: 5, z: 8.6 }, { x: 30, z: -8.6 }];
    for (let i = 0;i < 3; i++) {
      const s = spots[Math.floor(rng() * spots.length)];
      spots.splice(spots.indexOf(s), 1);
      this.pickups.push(this.makePickup("bagel" + i, s.x, s.z < 0 && Math.abs(s.z) > 5 ? SY5 : s.z > 5 ? SY5 : 0, s.z, "gold"));
    }
    this.pickups.push(this.makePickup("cookie", -46.5, SY5 + 1.15, -15.5, "cookie"));
    const fs = friendSpecs();
    G.friendInfo = fs;
    G.npcBy = {};
    const players = this.session ? this.info.players : [{ id: 0, name: "You", color: SEAT_COLORS[0] }, { id: 1, name: "CPU Lenny", color: SEAT_COLORS[1] }, { id: 2, name: "CPU Delia", color: SEAT_COLORS[2] }, { id: 3, name: "CPU Zablocki", color: SEAT_COLORS[3] }];
    this.players = players;
    this.me = this.session ? this.info.me : 0;
    for (const p of players) {
      const key = FRIENDS[p.id % 4];
      const f = fs[key];
      const isMe = p.id === this.me;
