    }
    if (!info.server && info.players.some((p) => p.id === info.me)) {
      const sp = this.seatPos[info.players.findIndex((p) => p.id === info.me)];
      spawnBoat(sp.x, sp.z, sp.yaw);
      this.tint(Game.boat.group, this.colorOf(info.me));
      Game.control = 'boat';
    } else {
      Game.control = 'none';
      Game.camOverride = (cam, dt) => { const t = Game.simTime * 0.08; cam.position.lerp(_v1.set(Math.sin(t) * 160, 70, Math.cos(t) * 160), 1 - Math.exp(-dt)); cam.lookAt(W.x, 0, W.z); };
    }
    UI.hud(true); UI.boss('THE WHITE WHALE', 1);
    UI.objective('Together, bring down the White Whale');
    UI.prompts([['move', 'Row & steer'], ['aim', 'Aim'], ['fire', 'Dart!'], ['back', 'Dodge'], ['alt', 'Lance (close)']]);
    Game.inputLocked = true;
    Game.onStove = () => { this.respawnT = 4; UI.bigText('STOVE! Back in 4…', 2); };
    Game.chapterUpdate = (dt) => this.update(dt);
  },
  colorOf(id) { const p = this.info.players.find((q) => q.id === id); return p ? p.color : '#ffffff'; },
  nameOf(id) { const p = this.info.players.find((q) => q.id === id); return p ? p.name : '?'; },
  tint(group, color) { group.traverse((o) => { if (o.isMesh && o.parent === group && o.geometry && o.geometry.type === 'TorusGeometry') { o.material = o.material.clone(); o.material.color.set(color); o.material.emissive = new THREE.Color(color); o.material.emissiveIntensity = 0.4; o.scale.z = 3; } }); },
  addRemote(p) {

    r.label = lbl; this.remote.set(p.id, r);
  },
  removePlayer(id) {

  },
  // ------------------------------------------------------------ per-frame
  update(dt) {

      const w = nearestWhale(Game.boat.pos, 16);
      if (w) { Game.lanceCd = 1.6; this.reportHit(w, 30); Audio.play('lance'); FX.splash(w.x, w.z, 0.6); Game.stats.lances++; }

    }

      r.group.position.set(x, y, z); r.group.rotation.set(0, yaw, 0); r.yaw = yaw;
      r.body.setNextKinematicTranslation({ x, y, z }); const q = r.group.quaternion; r.body.setNextKinematicRotation({ x: q.x, y: q.y, z: q.z, w: q.w });

      r.label.style.display = p.z > 1 ? 'none' : ''; r.label.style.transform = `translate(${(p.x * 0.5 + 0.5) * innerWidth}px, ${(-p.y * 0.5 + 0.5) * innerHeight}px) translate(-50%,-100%)`;
    }

    if (this.isHost) {
      this.targetT = (this.targetT || 0) - dt;
      if (this.targetT <= 0) {
        this.targetT = 3;
        const boats = [...this.remote.values()]; if (Game.boat) boats.push(Game.boat);
        for (const w of Game.whales) { if (!boats.length) { w.target = null; continue; } let best = null, bd = Infinity; for (const b of boats) { const d = dist2(w.x, w.z, b.pos.x, b.pos.z); if (d < bd) { bd = d; best = b; } } w.target = w.white && Math.random() < 0.5 ? pick(boats) : best; }

      else if (Game.boat) HUB.send({ t: 'me', at: Math.round(now), p: [Math.round(Game.boat.pos.x * 10) / 10, Math.round(Game.boat.pos.z * 10) / 10, Math.round(Game.boat.yaw * 100) / 100, Math.round(Game.boat.hp)] }, { to: this.info.host, reliable: false });
    }
    const W = Game.boss && Game.boss.whale;

  snapshot() {

  onMessage(m, from) {

  // non-host whales ease toward the host's snapshot
  steerRemoteWhales(dt) {

      w.setPose('thrash', 0, dt); w.setPose('dive', w.state === 'sound' || w.state === 'deep' || w.state === 'dive' ? 1 : 0, dt); w.setPose('breach', w.state === 'breach' ? 1 : 0, dt);

      if (w.state === 'deep' && Math.random() < 0.3) FX.ring(w.x + rand(-3, 3), w.z + rand(-3, 3), 0xffffff, rand(4, 12));
      if (w.state === 'brow' && Math.random() < 0.2 && Game.boat) FX.ring(Game.boat.pos.x, Game.boat.pos.z, 0xff3020, 5);

  reportHit(w, dmg) {
    if (this.isHost) this.applyHit(w, dmg, this.info.me);
    else { HUB.send({ t: 'hit', w: w.id, d: Math.round(dmg) }, { to: this.info.host }); UI.hitText(w.pos, String(Math.round(dmg))); this.score[this.info.me] = (this.score[this.info.me] || 0) + dmg; }
  },
  applyHit(w, dmg, by) {
    this.score[by] = (this.score[by] || 0) + dmg;
    const wasAlive = w.alive;

    if (wasAlive && !w.alive) { this.score[by] += w.white ? 200 : 50; }
  },
  onThrow(h, o, v) { if (!this.info) return; HUB.send({ t: 'throw', o: [o.x, o.y, o.z].map((n) => Math.round(n * 100) / 100), v: [v.x, v.y, v.z].map((n) => Math.round(n * 100) / 100) }); },
  areaHit(x, z, r, d) { slamHit(x, z, r, d); if (this.isHost) HUB.send({ t: 'fx', k: 'slam', x: Math.round(x * 10) / 10, z: Math.round(z * 10) / 10, r, d }); },
  finish(won) {
    if (this.over) return; this.over = true;
    const ids = this.info.players.map((p) => p.id).filter((id) => id === this.info.me || this.remote.has(id));
    const sorted = ids.slice().sort((a, b) => (this.score[b] || 0) - (this.score[a] || 0));
    const standings = []; for (const id of sorted) { const last = standings[standings.length - 1]; if (last && Math.round(this.score[last[0]] || 0) === Math.round(this.score[id] || 0)) last.push(id); else standings.push([id]); }

    const top = sorted[0];
    const awards = top != null && scores[top] > 0 ? [{ id: top, title: 'Master Harpooneer', detail: `${scores[top]} damage dealt` }] : [];
    try { HUB.finish({ standings, scores, won: !!won, awards }); } catch (e) { console.warn(e); }

  },
  showOver(won) { UI.bigText(won ? 'MOBY DICK IS DONE!' : 'HE ESCAPES…', 5); Game.inputLocked = true; if (won && Game.boss) { const W = Game.boss.whale; W.alive = false; W.state = 'dead'; } },
};

// ============================================================================
// MAIN — boot, title, pause, the frame loop, the hub probe
// ============================================================================
function setLoading(text) { window.__mobyBoot = text; const l = $('#loading'); if (l) l.querySelector('.msg').textContent = text; }

function toTitle() {
  Script.cancel(); Attract.stop();
  Game.mode = 'title'; Game.paused = false; UI.menuOpen = false; Game.cheats.god = false;
  stage({ harbor: true, weather: 'dawn', ship: [90, 120, 0.6], song: 'title' });
  Game.sailLevel = 0.7; Game.inputLocked = true;
  Game.ship.autopilot = (dt) => { Game.ship.rudder = 0.25; };
  spawnPod(260, 380, 2, { calm: true });
  Game.camOverride = (cam, dt) => {
    const s = Game.ship.pos, t = Game.simTime * 0.05;
    cam.position.lerp(_v1.set(s.x + Math.sin(t) * 95, s.y + 22 + Math.sin(t * 0.7) * 6, s.z + Math.cos(t) * 95), 1 - Math.exp(-1.5 * dt));
    cam.lookAt(s.x - Math.cos(t) * 18, s.y + 12, s.z + Math.sin(t) * 18);
  };
  UI.hud(false); UI.fade(0, 800);
  UI.dlg = null; UI.dlgEl.classList.add('hidden'); UI.cardState = null; UI.cardEl.classList.add('hidden');
  UI.showScreen(isTouchOnly() && !Input.pad ? 'touch' : 'title');
  Input.lastInputTime = performance.now();
  Input.releaseLock();
}
function startFromSave() {
  Game.flags = { doubloon: Save.data.chapter > 3 };
  Game.stats = newStats();
  startChapter(clamp(Save.data.chapter, 0, CHAPTERS.length - 1));
}
function openPause(screen = 'pause') {
  if (UI.menuOpen) return;
  UI.menuOpen = true; if (Game.mode === 'play') Game.paused = true;
  UI.showScreen(screen); Input.releaseLock(); Audio.play('uiSelect');
}
function closePause() {
  UI.menuOpen = false; Game.paused = false; UI.showScreen(null); Audio.play('uiBack');
}

let lastFrame = performance.now(), lastTick = performance.now();
function tick(dt) {
  lastTick = performance.now();
  Input.poll();
  if (Input.anyPressed) Audio.ensure();
  Input.mouseGame = (Game.mode === 'play' || Game.mode === 'session') && !UI.current && !UI.dlg && !UI.cardState;
  // attract: any real input returns to the title
  if (Attract.active && (Input.anyPressed || Input.keys.size)) { toTitle(); Input.edges = {}; }
  if (Game.mode === 'title') {
    if (UI.current && UI.current.id === 'touch' && Input.pad) UI.showScreen('title');
    if (performance.now() - Input.lastInputTime > 10000 && !UI.dlg) Attract.start();
  }
  // Options / Esc: pause & settings
  if ((Game.mode === 'play' || Game.mode === 'session') && !Attract.active) {
    const shopOpen = UI.current && UI.current.id === 'shop';
    if (Input.edges.menu && !shopOpen) {
      if (UI.menuOpen) closePause(); else openPause('pause');
      Input.edges.cancel = false; Input.edges.confirm = false; Input.edges.nav = null;
    } else if (Input.edges.map && !UI.menuOpen && !UI.current && !UI.dlg && !UI.cardState && Game.mode === 'play') {
      openPause('journal'); Input.edges.cancel = false; Input.edges.map = false;
    }
  }
  UI.update(dt);
  if (!Game.paused) simStep(dt);
  if (Game.mode === 'session' && Hub.ended) Audio.setMuted(true);
  updateAudioAmbience();
}
function renderFrame(dt) {
  const focus = controlled() ? controlled().pos : World.camera.position;
  if (!Game.paused) {
    updateOcean(dt, World.activeCam.position.x, World.activeCam.position.z);
    updateWeather(dt, focus);
    updateParticles(dt);
    updateProps(dt);
  }
  updateCamera(dt);
  World.renderer.render(World.scene, World.activeCam);
}
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000)); lastFrame = now;
  try { tick(dt); renderFrame(dt); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
// a shared world never pauses: keep simulating when the tab is hidden
setInterval(() => {
  if (Game.mode !== 'session') return;
  const now = performance.now(); const gap = now - lastTick;
  if (gap > 250) { try { tick(Math.min(0.25, gap / 1000)); updateOcean(gap / 1000, 0, 0); } catch (e) { console.error(e); } }
}, 100);

function registerProbe() {
  if (!HUB || !HUB.probe) return;
  HUB.probe(() => {
    let scene = 'play';
    if (Game.mode === 'title' || Game.mode === 'boot') scene = UI.current && UI.current.id !== 'title' ? 'menu' : 'title';
    else if (Game.mode === 'attract') scene = 'title';
    else if (Game.mode === 'ending') scene = 'over';
    else if (Game.mode === 'session') { const t = HUB.time(); scene = Hub.over || Hub.ended ? 'over' : (!Hub.started || t < 0) ? 'ready' : 'play'; }
    return {
      scene, menu: !!UI.menuOpen, world: Math.round(Game.simTime * 1000) / 1000,
      input: { x: Math.round(Input.state.moveX * 100) / 100, y: Math.round(Input.state.moveY * 100) / 100, fire: !!(Input.held.act || Input.held.alt || Input.held.back || Input.state.fire > 0.5 || Input.state.aim > 0.5 || Input.edges.r1) },
    };
  });
}

async function boot() {
  // say hello to the hub at once; load while it answers
  if (IN_SESSION) Hub.connectP = HUB.connect({ mode: 'co-op', seats: [1, 4] }).catch(() => null);
  UI.build();
  registerProbe();
  if (IN_SESSION) { setLoading('Hailing the other boats…'); Hub.preInfo = await Hub.connectP; if (!Hub.preInfo) Hub.connectP = Promise.resolve(null); }
  setLoading('Rigging the ship…');
  // the physics engine compiles while the renderer starts
  const physP = Phys.init().then(() => true, (e) => { console.error(e); return false; });
  try { await initWorld(); } catch (e) {
    console.error(e); setLoading('This browser could not start WebGPU or WebGL 2. Moby-Hike needs one of them.');
    if (IN_SESSION) HUB.fail('No WebGPU or WebGL 2'); return;
  }
  setLoading('Wetting the lines…');
  if (!(await physP)) { setLoading('The physics engine failed to load.'); if (IN_SESSION) HUB.fail('Rapier failed to load'); return; }
  Game.line = new WhaleLine(); Game.stats = newStats();
  applyQuality();
  $('#loading').classList.add('gone');
  if (IN_SESSION) {
    if (Game.ship) Game.ship.autopilot = null;
