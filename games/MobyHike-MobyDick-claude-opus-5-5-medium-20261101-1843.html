<!--
MOBY-HIKE — A Voyage After the White Whale

== Source Information ==
- Date: 2026-11-01 18:43
- Source: Moby-Dick; or, The Whale — Herman Melville (1851). Game title "Moby-Hike" picked by a real RNG (Python secrets.randbelow) from 50 brainstormed riffs.
- Genre and Perspective: naval action-adventure / whale-hunt with story chapters. Main view: third-person chase camera (PerspectiveCamera). Switchable: first-person (helm / bow), top-down Chart view (OrthographicCamera), plus the mast-head lookout and an over-the-shoulder harpoon aim view.
- Tech: three.js r180 (WebGPURenderer with automatic WebGL 2 fallback, TSL node materials, SkyMesh, PMREM environment), Rapier 0.19.3 (@dimforge/rapier3d-compat: buoyant rigid bodies, kinematic whales, CCD harpoons, collision events), Web Audio API, Gamepad API (standard mapping, DualSense glyphs, rumble), AI Hub Session Protocol v1 client 1.3.0. Plain ES modules from the jsDelivr CDN; no build framework (a small Python script concatenates the modules).
- Art Direction: engine-native three.js look: physically based MeshStandard / node materials, a TSL Gerstner-style ocean shaded per pixel, the analytic SkyMesh atmosphere, PMREM image-based lighting, PCF soft shadows, fog, additive glow particles. All models are built from engine primitives and lofted geometry in code.
- Animation: the native three.js animation system — AnimationMixer with KeyframeTrack / AnimationClip (skinned SkinnedMesh whales with 9-bone skeletons: swim, thrash, dive and breach clips blended by weight; rowing crews and oars; harpooneer aim/throw; gull wing flaps), plus morph targets for billowing sails.
- Audio: all code-written in Web Audio — a lookahead sequencer playing seven original pieces (title air, voyage jig, hunt, storm, White Whale, calm, ending hymn) on synthesized accordion, fiddle, drone, bass, bell, brass and drums; synthesized SFX (splashes, harpoon, line reel and snap, thunder, creaks, whale song, spouts, gulls, UI); Animalese-style gibberish voices with per-character pitch and formant filters for every speaking part.
- Online: AI Hub co-op session "The Gam of Boats" (1–4 players): the host copy (or a server with no player) runs the whales and sends 15 Hz snapshots; each copy rows its own boat, sends its state, harpoon throws and hit claims; host finishes with standings by damage dealt. Outside a session the game is single-player and makes no network calls beyond loading its CDN libraries and fonts.
- Testing: headless Chromium (Playwright) with SwiftShader WebGPU and WebGL 2; scripted runs of every chapter, both endings, attract mode, pause/settings/journal menus and the touch-only notice through a debug step hook; screenshots through the WebGL backend; the AI Hub harness (auto conformance) passing at 1, 2, 3 and 4 players with 150 ms latency, 50 ms jitter and 5% loss, with the host leaving, and hosted by a server with no player; plus a co-op sync check (whale positions and hit credit across copies). Kept lightweight per the brief; no real gamepad hardware. Controller verified with an emulated standard-mapping DualSense (menus, settings, inversion, story, sailing, hunt) and an emulated vibration actuator (rumble events and the Rumble setting); no physical pad. Full record in TESTING.md.
- Research: read the AI Hub lib/hub README, session.js, harness.html and the arena example; checked three.js r180 and Rapier 0.19.3 package sources for API details. The novel's chapters, characters and quotations come from memory of the public-domain text; no web research on the book.
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort medium
- Usage: estimated ~US$14.90 at Opus 5.5 list prices ($4 in / $20 out / $0.20 cache read per MTok; cache writes assumed at the 1-hour rate of $8). Tokens from the session transcript: 32.44M total — 31.78M cache read, 384.9K cache write, 271.9K output, 236 uncached input — over 113 API calls; session time 2 h 01 min.

== Testing Feedback ==
- Issues caught by testing: 16 — whales out-ran the boat on any approach; harpoons sailed over moving whales (aim assist checked pitch); one White Whale charge registered several hits; the storm's ship bar and swell warning leaked into the last chapter; settings sliders collapsed (CSS class clash); the journal's balance marker rendered as a block; the journal closed in the frame it opened; sub-frame key taps missed menu navigation; wake particles too large and opaque; crest foam too bright from the mast-head; the camera spawned inside the Pequod beside the boat; the line-strain panel overlapped the HUD at small widths; a jib mesh without normals; four hub copies on one thread missed the 10 s hello window (fixed by handshaking before the heavy load); menus too wide on phones; the over-dense title camera framing.
- Critical / game-breaking: 3 — the fleeing whales (no hunt could be won), the harpoon misses (nearly unwinnable), and the late hello that dropped two of four players from a hub round under load.
- Most helpful test: driving each chapter headlessly through a debug step hook (scripted AI input, teleports, reading state back) — it walked the whole campaign to both endings and exposed the balance bugs; the per-throw trajectory log pinpointed the harpoon problem.
- Least helpful test: real-time keyboard taps through Playwright against a ~1 fps software renderer — the results reflected test timing, not the game, until replaced by synchronous key dispatch.

== Engine Feedback ==
- Liked most: TSL let one wave formula drive both the GPU ocean and the CPU buoyancy, so boats ride exactly the waves you see; WebGPURenderer falls back to WebGL 2 by itself.
- Stuck / guessed wrong: which space material.normalNode expects (view space, via transformNormalToView), and that Rapier forces persist across steps until resetForces is called.
- Most important thing built by hand: buoyancy and keel physics on top of Rapier, plus the skinned whale generator with its own skeleton and clips.
- Hardest part: verifying WebGPU visuals headlessly — screenshots of a WebGPU canvas come back blank, so visual checks go through the WebGL backend.
- Would remove or overhaul: the split between three.js classic materials and node materials — two parallel ways to do everything makes it unclear which features apply where.
- Would change: ship a water/buoyancy helper and a simple skinned-mesh-from-curve builder; a built-in 'sample height at x,z' for procedural surfaces would save much code.

== Prompt Feedback ==
- Liked most: the freedom of 'pick a famous book' with a strict tech stack — a clear box to be creative inside.
- Confusing: 'use the engine native style/perspective' for three.js, which has no single native style; and whether multiplayer must exist outside the hub too.
- Hardest: fitting a feature-complete, polished vertical slice, attract mode and hub co-op into one file within one session.
- One test I would have run: a real DualSense on real hardware through a full playthrough, to judge the 10-foot feel and rumble.

<script>window.__MOBY_ABOUT = [["Source Information", ["Date: 2026-11-01 18:43", "Source: Moby-Dick; or, The Whale \u2014 Herman Melville (1851). Game title \"Moby-Hike\" picked by a real RNG (Python secrets.randbelow) from 50 brainstormed riffs.", "Genre and Perspective: naval action-adventure / whale-hunt with story chapters. Main view: third-person chase camera (PerspectiveCamera). Switchable: first-person (helm / bow), top-down Chart view (OrthographicCamera), plus the mast-head lookout and an over-the-shoulder harpoon aim view.", "Tech: three.js r180 (WebGPURenderer with automatic WebGL 2 fallback, TSL node materials, SkyMesh, PMREM environment), Rapier 0.19.3 (@dimforge/rapier3d-compat: buoyant rigid bodies, kinematic whales, CCD harpoons, collision events), Web Audio API, Gamepad API (standard mapping, DualSense glyphs, rumble), AI Hub Session Protocol v1 client 1.3.0. Plain ES modules from the jsDelivr CDN; no build framework (a small Python script concatenates the modules).", "Art Direction: engine-native three.js look: physically based MeshStandard / node materials, a TSL Gerstner-style ocean shaded per pixel, the analytic SkyMesh atmosphere, PMREM image-based lighting, PCF soft shadows, fog, additive glow particles. All models are built from engine primitives and lofted geometry in code.", "Animation: the native three.js animation system \u2014 AnimationMixer with KeyframeTrack / AnimationClip (skinned SkinnedMesh whales with 9-bone skeletons: swim, thrash, dive and breach clips blended by weight; rowing crews and oars; harpooneer aim/throw; gull wing flaps), plus morph targets for billowing sails.", "Audio: all code-written in Web Audio \u2014 a lookahead sequencer playing seven original pieces (title air, voyage jig, hunt, storm, White Whale, calm, ending hymn) on synthesized accordion, fiddle, drone, bass, bell, brass and drums; synthesized SFX (splashes, harpoon, line reel and snap, thunder, creaks, whale song, spouts, gulls, UI); Animalese-style gibberish voices with per-character pitch and formant filters for every speaking part.", "Online: AI Hub co-op session \"The Gam of Boats\" (1\u20134 players): the host copy (or a server with no player) runs the whales and sends 15 Hz snapshots; each copy rows its own boat, sends its state, harpoon throws and hit claims; host finishes with standings by damage dealt. Outside a session the game is single-player and makes no network calls beyond loading its CDN libraries and fonts.", "Testing: headless Chromium (Playwright) with SwiftShader WebGPU and WebGL 2; scripted runs of every chapter, both endings, attract mode, pause/settings/journal menus and the touch-only notice through a debug step hook; screenshots through the WebGL backend; the AI Hub harness (auto conformance) passing at 1, 2, 3 and 4 players with 150 ms latency, 50 ms jitter and 5% loss, with the host leaving, and hosted by a server with no player; plus a co-op sync check (whale positions and hit credit across copies). Kept lightweight per the brief; no real gamepad hardware. Controller verified with an emulated standard-mapping DualSense (menus, settings, inversion, story, sailing, hunt) and an emulated vibration actuator (rumble events and the Rumble setting); no physical pad. Full record in TESTING.md.", "Research: read the AI Hub lib/hub README, session.js, harness.html and the arena example; checked three.js r180 and Rapier 0.19.3 package sources for API details. The novel's chapters, characters and quotations come from memory of the public-domain text; no web research on the book.", "Environment: Claude Code CLI (headless); Linux; browser unknown", "Model: Anthropic, claude-opus-5-5, reasoning effort medium", "Usage: estimated ~US$14.90 at Opus 5.5 list prices ($4 in / $20 out / $0.20 cache read per MTok; cache writes assumed at the 1-hour rate of $8). Tokens from the session transcript: 32.44M total \u2014 31.78M cache read, 384.9K cache write, 271.9K output, 236 uncached input \u2014 over 113 API calls; session time 2 h 01 min."]], ["Testing Feedback", ["Issues caught by testing: 16 \u2014 whales out-ran the boat on any approach; harpoons sailed over moving whales (aim assist checked pitch); one White Whale charge registered several hits; the storm's ship bar and swell warning leaked into the last chapter; settings sliders collapsed (CSS class clash); the journal's balance marker rendered as a block; the journal closed in the frame it opened; sub-frame key taps missed menu navigation; wake particles too large and opaque; crest foam too bright from the mast-head; the camera spawned inside the Pequod beside the boat; the line-strain panel overlapped the HUD at small widths; a jib mesh without normals; four hub copies on one thread missed the 10 s hello window (fixed by handshaking before the heavy load); menus too wide on phones; the over-dense title camera framing.", "Critical / game-breaking: 3 \u2014 the fleeing whales (no hunt could be won), the harpoon misses (nearly unwinnable), and the late hello that dropped two of four players from a hub round under load.", "Most helpful test: driving each chapter headlessly through a debug step hook (scripted AI input, teleports, reading state back) \u2014 it walked the whole campaign to both endings and exposed the balance bugs; the per-throw trajectory log pinpointed the harpoon problem.", "Least helpful test: real-time keyboard taps through Playwright against a ~1 fps software renderer \u2014 the results reflected test timing, not the game, until replaced by synchronous key dispatch."]], ["Engine Feedback", ["Liked most: TSL let one wave formula drive both the GPU ocean and the CPU buoyancy, so boats ride exactly the waves you see; WebGPURenderer falls back to WebGL 2 by itself.", "Stuck / guessed wrong: which space material.normalNode expects (view space, via transformNormalToView), and that Rapier forces persist across steps until resetForces is called.", "Most important thing built by hand: buoyancy and keel physics on top of Rapier, plus the skinned whale generator with its own skeleton and clips.", "Hardest part: verifying WebGPU visuals headlessly \u2014 screenshots of a WebGPU canvas come back blank, so visual checks go through the WebGL backend.", "Would remove or overhaul: the split between three.js classic materials and node materials \u2014 two parallel ways to do everything makes it unclear which features apply where.", "Would change: ship a water/buoyancy helper and a simple skinned-mesh-from-curve builder; a built-in 'sample height at x,z' for procedural surfaces would save much code."]], ["Prompt Feedback", ["Liked most: the freedom of 'pick a famous book' with a strict tech stack \u2014 a clear box to be creative inside.", "Confusing: 'use the engine native style/perspective' for three.js, which has no single native style; and whether multiplayer must exist outside the hub too.", "Hardest: fitting a feature-complete, polished vertical slice, attract mode and hub co-op into one file within one session.", "One test I would have run: a real DualSense on real hardware through a full playthrough, to judge the 10-foot feel and rumble."]]];

<body>
<div id="stage"></div>
<div id="ui"></div>
<div id="loading"><div class="logo">MOBY-HIKE</div><div class="msg">Loading…</div></div>
<script type="module">
// ============================================================================
// MOBY-HIKE — core: imports, math helpers, settings, saves, input
// ============================================================================
import * as THREE from 'three/webgpu';
import {
  Fn, uniform, vec2, vec3, vec4, float, sin, cos, mix, smoothstep, clamp as tslClamp,
  positionLocal, positionWorld, normalize, transformNormalToView, varying, cameraPosition,
  dot, max as tslMax, pow, length as tslLength, abs as tslAbs, exp, fract, floor as tslFloor,
} from 'three/tsl';
import { SkyMesh } from 'three/addons/objects/SkyMesh.js';
import RAPIER from '@dimforge/rapier3d-compat';

const GAME = {
  title: 'Moby-Hike',
  version: '1.0.0',
  build: '2026-11-01 18:43',
};

// ---------------------------------------------------------------- math utils
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, rate, dt) => lerp(a, b, 1 - Math.exp(-rate * dt));
const wrapAngle = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const dampAngle = (a, b, rate, dt) => a + wrapAngle(b - a) * (1 - Math.exp(-rate * dt));
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const smooth01 = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const dist2 = (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz);
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion();
const _e1 = new THREE.Euler();
const UP = new THREE.Vector3(0, 1, 0);
const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// Seeded generator (mulberry32) for content that must match between copies.
function makeRng(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// ---------------------------------------------------------------- session flag
const HUB = window.AIHub || null;
const IN_SESSION = !!(HUB && HUB.active);

// ---------------------------------------------------------------- settings
const SETTINGS_KEY = 'mobyhike.settings.v1';
const DEFAULT_SETTINGS = {
  master: 0.8, music: 0.6, sfx: 0.8, voice: 0.8,
  invertX: false, invertY: false, invertLookY: false,
  lookSens: 1.0, camShake: true, rumble: true,
  textSpeed: 1, // 0 slow, 1 normal, 2 fast, 3 instant
  difficulty: 1, // 0 Becalmed (story), 1 Able Seaman, 2 Harpooneer (hard)
  quality: 1, // 0 low, 1 high
  subtitles: true,
};
const Settings = {
  data: { ...DEFAULT_SETTINGS },
  load() {
    try { const raw = localStorage.getItem(SETTINGS_KEY); if (raw) Object.assign(this.data, JSON.parse(raw)); } catch (e) { /* storage unavailable */ }
  },
  save() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(this.data)); } catch (e) { /* storage unavailable */ } },
  get(k) { return this.data[k]; },
  set(k, v) { this.data[k] = v; this.save(); Settings.onChange.forEach((f) => f(k, v)); },
  onChange: [],
};
Settings.load();

// ---------------------------------------------------------------- save game
const SAVE_KEY = 'mobyhike.save.v1';
const NEW_SAVE = () => ({
  chapter: 0, unlocked: 1, oil: 0, upgrades: { iron: 0, line: 0, cedar: 0, glass: 0 },
  resolve: 50, monomania: 50, stats: { thrown: 0, hits: 0, whales: 0, playSeconds: 0, stoves: 0 }, ending: null,
});
const Save = {
  data: NEW_SAVE(),
  has() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } },
  load() { try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { this.data = Object.assign(NEW_SAVE(), JSON.parse(raw)); return true; } } catch (e) { /* none */ } return false; },
  write() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* none */ } },
  reset() { const unlocked = this.data.unlocked; this.data = NEW_SAVE(); this.data.unlocked = Math.max(1, unlocked); },
};
Save.load();

// ---------------------------------------------------------------- input
// Controller-first. Keyboard & mouse map onto the controller's model.
const PAD = { CROSS: 0, CIRCLE: 1, SQUARE: 2, TRIANGLE: 3, L1: 4, R1: 5, L2: 6, R2: 7, CREATE: 8, OPTIONS: 9, L3: 10, R3: 11, UP: 12, DOWN: 13, LEFT: 14, RIGHT: 15 };
const Input = {
  keys: new Set(), keysPrev: new Set(), keyPressedBuf: new Set(),
  mouse: { dx: 0, dy: 0, b: [false, false, false], bPrev: [false, false, false], bBuf: [false, false, false], locked: false },
  pad: null, padButtons: new Array(17).fill(0), padPrev: new Array(17).fill(0), padAxes: [0, 0, 0, 0],
  lastDevice: 'kb', mouseGame: false, lastInputTime: performance.now(), anyPressed: false,
  virtual: null, // AI / attract override: { moveX, moveY, lookX, lookY, act, back, alt, look, aim, fire, cam, map }
  navRepeat: { dir: null, t: 0 },
  state: { moveX: 0, moveY: 0, lookX: 0, lookY: 0, aim: 0, fire: 0 },
  edges: {},
  held: {},
  init() {
    const blockKeys = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab']);
    window.addEventListener('keydown', (e) => {
      const code = e.code || e.key;
      if (blockKeys.has(code)) e.preventDefault();
      if (!this.keys.has(code)) this.keyPressedBuf.add(code);
      this.keys.add(code);
      if (e.key && e.key.length === 1) { const k = 'Key' + e.key.toUpperCase(); if (!this.keys.has(k) && /^Key[A-Z]$/.test(k)) { this.keyPressedBuf.add(k); } this.keys.add(k); }
      this.touch('kb');
    });
    window.addEventListener('keyup', (e) => {
      const code = e.code || e.key; this.keys.delete(code);
      if (e.key && e.key.length === 1) this.keys.delete('Key' + e.key.toUpperCase());
    });
    window.addEventListener('blur', () => { this.keys.clear(); this.mouse.b = [false, false, false]; });
    window.addEventListener('mousemove', (e) => {
      if (this.mouse.locked || (this.mouseGame && (this.mouse.b[2] || this.mouse.b[0]))) { this.mouse.dx += e.movementX || 0; this.mouse.dy += e.movementY || 0; this.touch('kb'); }
    });
    window.addEventListener('mousedown', (e) => { if (e.button < 3) { this.mouse.b[e.button] = true; this.mouse.bBuf[e.button] = true; } this.touch('kb'); });
    window.addEventListener('mouseup', (e) => { if (e.button < 3) this.mouse.b[e.button] = false; });
    window.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('pointerdown', () => this.touch('pointer'));
    document.addEventListener('pointerlockchange', () => { this.mouse.locked = document.pointerLockElement != null; });
    window.addEventListener('gamepadconnected', () => this.touch('pad'));
  },
  touch(dev) {
    if (dev !== 'pointer') this.lastDevice = dev === 'pad' ? 'pad' : 'kb';
    this.lastInputTime = performance.now(); this.anyPressed = true;
  },
  requestLock(canvas) {
    if (IN_SESSION) return; // the hub owns the page; no pointer lock in session iframes unless gesture — skip.
    if (!this.mouse.locked && canvas.requestPointerLock) { try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ } }
  },
  releaseLock() { if (document.pointerLockElement) document.exitPointerLock(); },
  dz(v, d = 0.18) { const a = Math.abs(v); if (a < d) return 0; return Math.sign(v) * (a - d) / (1 - d); },
  poll() {
    this.anyPressed = false;
    // gamepad
    let pad = null;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of pads) { if (p && p.connected) { pad = p; break; } }
    this.pad = pad;
    this.padPrev = this.padButtons.slice();
    if (pad) {
      for (let i = 0; i < 17; i++) { const b = pad.buttons[i]; this.padButtons[i] = b ? (typeof b === 'object' ? (b.pressed ? Math.max(b.value, 0.5) : b.value) : b) : 0; }
      const ax = [0, 1, 2, 3].map((i) => this.dz(pad.axes[i] || 0));
      const ix = Settings.get('invertX') ? -1 : 1, iy = Settings.get('invertY') ? -1 : 1;
      this.padAxes = [ax[0] * ix, ax[1] * iy, ax[2] * ix, ax[3] * iy];
      for (let i = 0; i < 17; i++) if (this.padButtons[i] > 0.5 && !(this.padPrev[i] > 0.5)) { this.touch('pad'); }
      if (this.padAxes.some((a) => Math.abs(a) > 0.3)) this.touch('pad');
    } else { this.padButtons.fill(0); this.padAxes = [0, 0, 0, 0]; }

    const K = (c) => this.keys.has(c);
    const KP = (c) => this.keyPressedBuf.has(c);
    const PB = (i) => this.padButtons[i] > 0.5;
    const PP = (i) => this.padButtons[i] > 0.5 && !(this.padPrev[i] > 0.5);
    const create = PB(PAD.CREATE);
    const MB = (i) => this.mouse.b[i];
    const MP = (i) => this.mouse.bBuf[i];

    let mx = (K('KeyD') || K('ArrowRight') ? 1 : 0) - (K('KeyA') || K('ArrowLeft') ? 1 : 0);
    let my = (K('KeyW') || K('ArrowUp') ? 1 : 0) - (K('KeyS') || K('ArrowDown') ? 1 : 0);
    mx += this.padAxes[0]; my += -this.padAxes[1];
    if (PB(PAD.LEFT)) mx -= 1; if (PB(PAD.RIGHT)) mx += 1;
    if (PB(PAD.UP)) my += 1; if (PB(PAD.DOWN)) my -= 1;
    const sens = Settings.get('lookSens');
    const lyInv = Settings.get('invertLookY') ? -1 : 1;
    let lx = this.padAxes[2] * 2.6 * sens + this.mouse.dx * 0.0032 * sens * 60;
    let ly = (this.padAxes[3] * 2.0 * sens + this.mouse.dy * 0.0032 * sens * 60) * lyInv;
    const keyLook = (K('KeyL') ? 1 : 0) - (K('KeyJ') ? 1 : 0);
    const keyLookY = (K('KeyK') ? 1 : 0) - (K('KeyI') ? 1 : 0);
    lx += keyLook * 2.2; ly += keyLookY * 1.8 * lyInv;
    this.mouse.dx = 0; this.mouse.dy = 0;

    const aim = Math.max(this.padButtons[PAD.L2], MB(2) ? 1 : 0, K('ShiftLeft') || K('ShiftRight') ? 1 : 0);
    const fire = Math.max(this.padButtons[PAD.R2], MB(0) && this.mouseGame ? 1 : 0, K('KeyR') ? 1 : 0);

    this.state = { moveX: clamp(mx, -1, 1), moveY: clamp(my, -1, 1), lookX: lx, lookY: ly, aim, fire };
    this.held = {
      act: PB(PAD.CROSS) || K('Space') || K('KeyE') || K('Enter'),
      back: PB(PAD.CIRCLE) || K('KeyQ'),
      alt: PB(PAD.SQUARE) || K('KeyF'),
      look: PB(PAD.TRIANGLE) || K('Tab'),
    };
    this.edges = {
      act: PP(PAD.CROSS) || KP('Space') || KP('KeyE') || KP('Enter') || (MP(0) && this.mouseGame),
      back: PP(PAD.CIRCLE) || KP('KeyQ'),
      alt: PP(PAD.SQUARE) || KP('KeyF'),
      look: PP(PAD.TRIANGLE) || KP('Tab'),
      cam: PP(PAD.R3) || KP('KeyV'),
      map: PP(PAD.L1) || KP('KeyM'),
      r1: PP(PAD.R1) || KP('KeyC'),
      menu: (PP(PAD.OPTIONS) && !create) || KP('Escape') || KP('KeyP'),
      fire: (this.padButtons[PAD.R2] > 0.5 && !(this.padPrev[PAD.R2] > 0.5)) || (MP(0) && this.mouseGame) || KP('KeyR'),
      // menu navigation
      confirm: PP(PAD.CROSS) || KP('Space') || KP('Enter') || KP('KeyE'),
      cancel: PP(PAD.CIRCLE) || KP('Escape') || KP('Backspace') || KP('KeyQ'),
      tabL: PP(PAD.L1), tabR: PP(PAD.R1),
    };
    // nav with repeat (dpad / left stick / arrows / WASD)
    const navY = (PB(PAD.UP) || K('ArrowUp') || K('KeyW') || this.padAxes[1] < -0.55) ? -1 : (PB(PAD.DOWN) || K('ArrowDown') || K('KeyS') || this.padAxes[1] > 0.55) ? 1 : 0;
    const navX = (PB(PAD.LEFT) || K('ArrowLeft') || K('KeyA') || this.padAxes[0] < -0.55) ? -1 : (PB(PAD.RIGHT) || K('ArrowRight') || K('KeyD') || this.padAxes[0] > 0.55) ? 1 : 0;
    let dir = navY ? (navY < 0 ? 'up' : 'down') : navX ? (navX < 0 ? 'left' : 'right') : null;
    // taps shorter than a frame still count
    const tapped = KP('ArrowUp') || KP('KeyW') ? 'up' : KP('ArrowDown') || KP('KeyS') ? 'down' : KP('ArrowLeft') || KP('KeyA') ? 'left' : KP('ArrowRight') || KP('KeyD') ? 'right' : null;
    if (tapped && !dir) { this.edges.nav = tapped; }
    const now = performance.now();
    if (!(tapped && !dir)) this.edges.nav = null;
    if (dir !== this.navRepeat.dir) { this.navRepeat.dir = dir; this.navRepeat.t = now + 380; if (dir) this.edges.nav = dir; }
    else if (dir && now > this.navRepeat.t) { this.navRepeat.t = now + 120; this.edges.nav = dir; }

    if (this.keyPressedBuf.size || MP(0) || MP(1) || MP(2)) this.anyPressed = true;
    this.keysPrev = new Set(this.keys);
    this.keyPressedBuf.clear();
    this.mouse.bBuf = [false, false, false];

    // AI override (attract mode / autopilot)
    if (this.virtual) {
      const v = this.virtual;
      this.state = { moveX: v.moveX || 0, moveY: v.moveY || 0, lookX: v.lookX || 0, lookY: v.lookY || 0, aim: v.aim || 0, fire: v.fire || 0 };
      this.held = { act: !!v.act, back: !!v.back, alt: !!v.alt, look: !!v.look };
      const ve = v.edges || {};
      for (const k of ['act', 'back', 'alt', 'look', 'cam', 'map', 'r1', 'fire']) this.edges[k] = !!ve[k];
      v.edges = {};
    }
  },
  rumble(strong = 0.5, weak = 0.5, ms = 150) {
    if (!Settings.get('rumble') || !this.pad || this.virtual) return;
    const act = this.pad.vibrationActuator;
    if (act && act.playEffect) { try { act.playEffect('dual-rumble', { duration: ms, strongMagnitude: clamp(strong, 0, 1), weakMagnitude: clamp(weak, 0, 1) }).catch(() => {}); } catch (e) { /* unsupported */ } }
  },
  // glyph for a logical action on the last-used device
  glyph(action) {
    const pad = this.lastDevice === 'pad';
    const map = {
      act: pad ? '✕' : 'Space', back: pad ? '○' : 'Q', alt: pad ? '□' : 'F', look: pad ? '△' : 'Tab',
      aim: pad ? 'L2' : 'RMB', fire: pad ? 'R2' : 'LMB', cam: pad ? 'R3' : 'V', map: pad ? 'L1' : 'M', menu: pad ? 'Options' : 'Esc',
      move: pad ? 'L-Stick' : 'WASD', lookAround: pad ? 'R-Stick' : 'Mouse', r1: pad ? 'R1' : 'C',
    };
    return map[action] || action;
  },
};
Input.init();

const isTouchOnly = () => {
  const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  const fine = window.matchMedia && matchMedia('(any-pointer: fine)').matches;
  return ('ontouchstart' in window || navigator.maxTouchPoints > 0) && coarse && !fine;
};

// ============================================================================
// AUDIO — everything written in code: music sequencer, SFX, Animalese voices
// ============================================================================
const Audio = {
  ctx: null, master: null, music: null, sfx: null, voice: null, amb: null,
  noiseBuf: null, started: false, muted: false,
  song: null, songName: null, nextNoteTime: 0, step: 0, schedTimer: null,
  ambient: {},
  ensure() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain();
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    this.master.connect(comp); comp.connect(c.destination);
    this.music = c.createGain(); this.sfx = c.createGain(); this.voice = c.createGain(); this.amb = c.createGain();
    this.music.connect(this.master); this.sfx.connect(this.master); this.voice.connect(this.master); this.amb.connect(this.sfx);
    // reverb send for music + voice (convolver with generated impulse)
    this.reverb = c.createConvolver(); this.reverb.buffer = this.makeImpulse(2.4, 2.2);
    this.revGain = c.createGain(); this.revGain.gain.value = 0.28; this.reverb.connect(this.revGain); this.revGain.connect(this.master);
    this.noiseBuf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.applyVolumes();
    this.startAmbient();
    this.started = true;
    if (this.pendingSong) { const s = this.pendingSong; this.pendingSong = null; this.playSong(s); }
  },
  makeImpulse(sec, decay) {
    const c = this.ctx, len = Math.floor(c.sampleRate * sec), buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return buf;
  },
  applyVolumes() {
    if (!this.ctx) return;
    const s = Settings.data, t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(this.muted ? 0 : s.master, t, 0.05);
    this.music.gain.setTargetAtTime(s.music * 0.55, t, 0.05);
    this.sfx.gain.setTargetAtTime(s.sfx, t, 0.05);
    this.voice.gain.setTargetAtTime(s.voice * 0.9, t, 0.05);
  },
  setMuted(m) { this.muted = m; this.applyVolumes(); },
  now() { return this.ctx ? this.ctx.currentTime : 0; },

  // ------------------------------------------------------------ primitives
  noise(dur, { type = 'lowpass', freq = 1000, q = 1, gain = 0.5, attack = 0.005, release = null, at = 0, dest = null, freqEnd = null } = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + at;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (freqEnd) f.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (release ?? dur));
    src.connect(f); f.connect(g); g.connect(dest || this.sfx);
    src.start(t, Math.random() * 1.5); src.stop(t + (release ?? dur) + 0.05);
  },
  tone(freq, dur, { type = 'sine', gain = 0.3, attack = 0.01, at = 0, dest = null, freqEnd = null, detune = 0, filter = null, rev = 0 } = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + at;
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t); o.detune.value = detune;
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o;
    if (filter) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filter; o.connect(f); node = f; }
    node.connect(g); g.connect(dest || this.sfx);
    if (rev) { const rg = c.createGain(); rg.gain.value = rev; g.connect(rg); rg.connect(this.reverb); }
    o.start(t); o.stop(t + dur + 0.05);
  },

  // ------------------------------------------------------------ SFX bank
  play(name, opt = {}) {
    if (!this.ctx) return;
    const v = opt.vol ?? 1;
    switch (name) {
      case 'uiMove': this.tone(660, 0.06, { type: 'triangle', gain: 0.08 * v }); break;
      case 'uiSelect': this.tone(523, 0.08, { type: 'triangle', gain: 0.12 * v }); this.tone(784, 0.14, { type: 'triangle', gain: 0.1 * v, at: 0.06 }); break;

// Waves shared by the GPU ocean and the CPU buoyancy so boats ride what you see.
const WAVES = [
  { dx: 0.8, dz: 0.6, len: 96, amp: 0.95, ph: 0.0 },
  { dx: -0.45, dz: 0.89, len: 52, amp: 0.5, ph: 1.7 },

  { dx: 0.17, dz: 0.98, len: 14, amp: 0.08, ph: 0.6 },
].map((w) => { const k = TAU / w.len; const n = Math.hypot(w.dx, w.dz); return { ...w, dx: w.dx / n, dz: w.dz / n, k, om: Math.sqrt(9.81 * k) }; });
const DETAIL_WAVES = [
  { dx: 0.7, dz: 0.7, len: 6.1, amp: 0.05 }, { dx: -0.9, dz: 0.4, len: 4.3, amp: 0.035 },
  { dx: 0.2, dz: -1, len: 3.1, amp: 0.025 }, { dx: -0.3, dz: -0.95, len: 2.2, amp: 0.018 },
  { dx: 1, dz: 0.1, len: 8.7, amp: 0.06 }, { dx: -0.6, dz: -0.8, len: 1.6, amp: 0.012 },
].map((w) => { const k = TAU / w.len; const n = Math.hypot(w.dx, w.dz); return { ...w, dx: w.dx / n, dz: w.dz / n, k, om: Math.sqrt(9.81 * k) }; });

function waveHeight(x, z, t = World.time) {
  let h = 0;
  for (const w of WAVES) h += w.amp * Math.sin(w.k * (w.dx * x + w.dz * z) - w.om * t + w.ph);
  return h * World.amp;
}
function waveSlope(x, z, t = World.time) { // returns [dh/dx, dh/dz]
  let sx = 0, sz = 0;
  for (const w of WAVES) { const c = w.amp * w.k * Math.cos(w.k * (w.dx * x + w.dz * z) - w.om * t + w.ph); sx += c * w.dx; sz += c * w.dz; }
  return [sx * World.amp, sz * World.amp];
}

// ---------------------------------------------------------------- ocean
function buildOcean() {
  const U = {
    time: uniform(0), amp: uniform(1), off: uniform(new THREE.Vector2()),
    deep: uniform(new THREE.Color(0x0b3550)), shallow: uniform(new THREE.Color(0x2c8a9a)), foamCol: uniform(new THREE.Color(0xe8f2f4)),
    foam: uniform(1), detail: uniform(1),
  };
  World.oceanU = U;
  const segs = IN_SESSION ? 160 : 300; World.oceanSegs = segs;
  const geo = new THREE.PlaneGeometry(2600, 2600, segs, segs); geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshStandardNodeMaterial({ roughness: 0.14, metalness: 0.0 });
  const heightAt = (x, z) => {
    let h = float(0);
    for (const w of WAVES) h = h.add(sin(x.mul(w.k * w.dx).add(z.mul(w.k * w.dz)).sub(U.time.mul(w.om)).add(w.ph)).mul(w.amp));
    return h.mul(U.amp);
  };
  const wx = positionLocal.x.add(U.off.x), wz = positionLocal.z.add(U.off.y);
  const h = heightAt(wx, wz);
  mat.positionNode = vec3(positionLocal.x, h, positionLocal.z);
  const vXZ = varying(vec2(wx, wz), 'vOceanXZ');
  const vH = varying(h, 'vOceanH');
  mat.normalNode = Fn(() => {
    const x = vXZ.x, z = vXZ.y;
    let sx = float(0), sz = float(0);
    for (const w of WAVES) {
      const c = cos(x.mul(w.k * w.dx).add(z.mul(w.k * w.dz)).sub(U.time.mul(w.om)).add(w.ph)).mul(w.amp * w.k).mul(U.amp);
      sx = sx.add(c.mul(w.dx)); sz = sz.add(c.mul(w.dz));
    }
    for (const w of DETAIL_WAVES) {
      const c = cos(x.mul(w.k * w.dx).add(z.mul(w.k * w.dz)).sub(U.time.mul(w.om))).mul(w.amp * w.k).mul(U.detail);
      sx = sx.add(c.mul(w.dx)); sz = sz.add(c.mul(w.dz));
    }
    return transformNormalToView(normalize(vec3(sx.negate(), 1, sz.negate())));
  })();
  mat.colorNode = Fn(() => {
    const rel = vH.div(U.amp.mul(1.6).add(0.001));
    const base = mix(U.deep, U.shallow, smoothstep(-0.6, 1.0, rel));
    // streaky foam on crests, broken up by a cheap hash pattern
    const n = sin(vXZ.x.mul(0.31).add(sin(vXZ.y.mul(0.17)).mul(3.0)).add(U.time.mul(0.4))).mul(0.5).add(0.5);
    const crest = smoothstep(0.78, 1.1, rel.add(n.mul(0.18))).mul(U.foam);
    return mix(base, U.foamCol, crest.mul(0.7));
  })();
  mat.roughnessNode = Fn(() => mix(float(0.2), float(0.55), smoothstep(0.7, 1.1, vH.div(U.amp.mul(1.6).add(0.001)))))();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true; mesh.frustumCulled = false;
  World.scene.add(mesh); World.ocean = mesh;
  // far skirt to the horizon
  const skirt = new THREE.Mesh(new THREE.RingGeometry(1250, 7000, 64, 1).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x0b3550, roughness: 0.2 }));
  skirt.position.y = -0.4; World.scene.add(skirt); World.skirt = skirt;
}

function updateOcean(dt, focusX, focusZ) {
  World.time += dt;
  const U = World.oceanU; U.time.value = World.time; U.amp.value = World.amp;
  const snap = 2600 / World.oceanSegs * 4;
  const ox = Math.round(focusX / snap) * snap, oz = Math.round(focusZ / snap) * snap;
  World.ocean.position.set(ox, 0, oz); U.off.value.set(ox, oz);
  World.skirt.position.x = ox; World.skirt.position.z = oz;
}

function buildRain() {

function updateRain(dt, cx, cy, cz) {
  const R = World.rain; if (!R.mesh.visible) return;
  const wx = Math.cos(World.windDir) * 8, wz = Math.sin(World.windDir) * 8;
  for (let i = 0; i < R.N; i++) {
    const d = R.drops[i]; d[1] -= 38 * dt; d[0] += wx * dt; d[2] += wz * dt;
    if (d[1] < -2) { d[0] = rand(-60, 60); d[1] = rand(40, 60); d[2] = rand(-60, 60); }
    if (d[0] > 60) d[0] -= 120; if (d[0] < -60) d[0] += 120; if (d[2] > 60) d[2] -= 120; if (d[2] < -60) d[2] += 120;
    const o = i * 6; R.pos[o] = d[0]; R.pos[o + 1] = d[1]; R.pos[o + 2] = d[2]; R.pos[o + 3] = d[0] - wx * 0.05; R.pos[o + 4] = d[1] + 1.6; R.pos[o + 5] = d[2] - wz * 0.05;
  }
  R.mesh.position.set(cx, cy - 20, cz);
  R.mesh.geometry.attributes.position.needsUpdate = true;
}

// ---------------------------------------------------------------- particles
class Particles {

    if (this.p.length >= this.max) this.p.shift();

  }
  burst(n, x, y, z, spread, up, opt) {
    for (let i = 0; i < n; i++) { const a = rand(0, TAU), s = rand(0.2, 1) * spread; this.spawn(x + rand(-0.5, 0.5), y, z + rand(-0.5, 0.5), Math.cos(a) * s, up * rand(0.6, 1.2), Math.sin(a) * s, { ...opt, size: (opt.size || 1) * rand(0.6, 1.3) }); }
  }
  update(dt) {

      if (q.floatOnWater) { const h = waveHeight(q.x, q.z) + 0.1; if (q.y < h) { q.y = h; q.vy = 0; } }

}
function buildParticles() {

function updateParticles(dt) { for (const k in World.particles) World.particles[k].update(dt); }

function setWeather(name, instant = false) {
  const w = WEATHER[name] || WEATHER.fair;
  World.weather = name; World.wTarget = w;
  if (instant) World.amp = w.amp;
  const el = THREE.MathUtils.degToRad(w.sunElev), az = THREE.MathUtils.degToRad(w.sunAz);
  World.sunDir.set(Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)).normalize();
  World.sky.sunPosition.value.copy(World.sunDir);
  World.sky.turbidity.value = w.turb; World.sky.rayleigh.value = w.ray;
  World.scene.fog.color.set(w.fog); World.scene.fog.near = w.fogNear; World.scene.fog.far = w.fogFar;
  World.renderer.toneMappingExposure = w.exposure;
  World.hemi.intensity = w.hemi; World.sun.intensity = w.sunI;
  World.sun.color.set(w.sunElev < 10 ? 0xffc89a : 0xfff1dc);
  if (w.sunElev < 0) World.sun.color.set(0x9fb4e0);
  World.cloudDome.material.opacity = w.dome; World.cloudDome.material.color.set(name === 'night' ? 0x02060c : 0x1a1f26);
  World.oceanU.deep.value.set(w.deep); World.oceanU.shallow.value.set(w.shallow);
  World.skirt.material.color.set(w.deep);
  World.rain.mesh.visible = w.rain;
  World.stars.material.opacity = w.stars; World.moon.visible = w.moon;
  World.moon.position.set(-1400, 900, -1800);
  World.cloudMat.emissive.set(w.cloud); World.cloudMat.color.set(name === 'storm' || name === 'night' ? 0x3a4048 : 0xffffff);
  World.windStrength = w.wind;
  World.lightningCooldown = 4;
  refreshEnvironment();
}
async function refreshEnvironment() {
  if (IN_SESSION) { World.scene.environment = null; return; } // keep session loads light: hemisphere light only
  try {
    if (!World.pmrem) World.pmrem = new THREE.PMREMGenerator(World.renderer);
    const envScene = new THREE.Scene();
    const sky2 = new SkyMesh(); sky2.scale.setScalar(900);
    sky2.turbidity.value = World.sky.turbidity.value; sky2.rayleigh.value = World.sky.rayleigh.value;
    sky2.mieCoefficient.value = 0.005; sky2.mieDirectionalG.value = 0.8; sky2.sunPosition.value.copy(World.sunDir);
    envScene.add(sky2);
    if (World.cloudDome.material.opacity > 0) { const d = World.cloudDome.clone(); d.scale.setScalar(0.2); envScene.add(d); }
    const rt = await World.pmrem.fromSceneAsync(envScene, 0.04, 1, 2000);
    if (World.envRT) World.envRT.dispose();
    World.envRT = rt; World.scene.environment = rt.texture;
    World.scene.environmentIntensity = World.weather === 'night' ? 0.25 : World.weather === 'storm' ? 0.35 : 0.8;
  } catch (e) { console.warn('env map failed', e); }
}
function updateWeather(dt, focus) {
  const w = World.wTarget;
  World.amp = damp(World.amp, w.amp, 0.5, dt);
  World.focus.copy(focus);
  // sun & shadow follow the focus
  World.sun.position.copy(focus).addScaledVector(World.sunDir.y > 0.05 ? World.sunDir : _v1.set(0.3, 0.8, 0.2).normalize(), 250);
  World.sun.target.position.copy(focus);
  World.sky.position.copy(World.activeCam.position); World.cloudDome.position.copy(World.activeCam.position);
  World.stars.position.copy(World.activeCam.position);
  // lightning
  if (World.weather === 'storm') {
    World.lightningCooldown -= dt;
    if (World.lightningCooldown <= 0) { World.lightningCooldown = rand(3, 9); strikeLightning(); }
  }
  if (World.lightning > 0) {
    World.lightning -= dt;
    const f = World.lightning > 0 ? (Math.random() < 0.6 ? 1 : 0.3) * World.lightning * 3 : 0;
    World.flash.intensity = f * 9000; World.cloudDome.material.color.setRGB(0.1 + f * 0.25, 0.12 + f * 0.27, 0.15 + f * 0.32);
  } else World.flash.intensity = 0;
  // slow wind drift
  World.windDir += Math.sin(World.time * 0.05) * 0.004 * dt;

}
function strikeLightning(x, z) {
  World.lightning = 0.45;
  const fx = x ?? World.focus.x + rand(-300, 300), fz = z ?? World.focus.z + rand(-300, 300);
  World.flash.position.set(fx, 260, fz);
  // bolt geometry: jagged line
  const pts = []; let px = fx, py = 400, pz = fz;
  while (py > 0) { pts.push(new THREE.Vector3(px, py, pz)); px += rand(-14, 14); pz += rand(-14, 14); py -= rand(18, 40); }
  pts.push(new THREE.Vector3(px, 0, pz));
  const bolt = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xe8f0ff, fog: false }));
  World.scene.add(bolt); setTimeout(() => { World.scene.remove(bolt); bolt.geometry.dispose(); }, 180);
  const d = Math.hypot(fx - World.focus.x, fz - World.focus.z);
  setTimeout(() => Audio.play('thunder', { vol: clamp(1.4 - d / 600, 0.3, 1.2) }), Math.min(2500, d * 3));
  if (Settings.get('camShake')) Game.shake(clamp(0.6 - d / 1000, 0.05, 0.6));
}

const G_BOAT = 1, G_WHALE = 2, G_HARPOON = 4, G_STATIC = 8, G_SHIP = 16;
const groups = (member, filter) => ((member & 0xffff) << 16) | (filter & 0xffff);

const Phys = {
  world: null, events: null, acc: 0, step: 1 / 60, byHandle: new Map(), statics: [],
  async init() {
    await RAPIER.init();
    this.world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
    this.world.timestep = this.step;
    this.events = new RAPIER.EventQueue(true);
  },
  register(collider, entity) { this.byHandle.set(collider.handle, entity); },
  remove(body) { if (!body) return; const n = body.numColliders(); for (let i = 0; i < n; i++) this.byHandle.delete(body.collider(i).handle); this.world.removeRigidBody(body); },
  addStaticCylinder(x, z, r, h = 40) {
    const b = this.world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(x, 0, z));
    const c = this.world.createCollider(RAPIER.ColliderDesc.cylinder(h / 2, r).setCollisionGroups(groups(G_STATIC, G_BOAT | G_SHIP | G_HARPOON)).setActiveEvents(RAPIER.ActiveEvents.COLLISION_EVENTS), b);

  },
  addStaticBox(x, z, hx, hz, h = 20) {
    const b = this.world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(x, 0, z));
    const c = this.world.createCollider(RAPIER.ColliderDesc.cuboid(hx, h / 2, hz).setCollisionGroups(groups(G_STATIC, G_BOAT | G_SHIP | G_HARPOON)), b);
    this.register(c, { kind: 'static' }); this.statics.push(b); return b;
  },
  clearStatics() { for (const b of this.statics) this.remove(b); this.statics = []; },
  tick(dt, preStep, onEvent) {
    this.acc = Math.min(this.acc + dt, this.step * 5);
    let n = 0;
    while (this.acc >= this.step) {
      preStep(this.step);
      this.world.step(this.events);
      this.events.drainCollisionEvents((h1, h2, started) => { if (started) onEvent(this.byHandle.get(h1), this.byHandle.get(h2)); });
      this.acc -= this.step; n++;
    }
    return n;
  },
};

// ---------------------------------------------------------------- geometry builders
function makeHullGeometry(L, B, D, sheer = 0.6, sections = 24, ring = 14) {
  const pos = [], idx = [], deckOutline = [];
  const profile = (t) => { // t: 0 stern .. 1 bow
    const w = t < 0.12 ? lerp(0.72, 0.95, t / 0.12) : t > 0.62 ? Math.pow(Math.cos((t - 0.62) / 0.38 * Math.PI / 2), 0.75) : 1;
    const d = t > 0.85 ? lerp(1, 0.65, (t - 0.85) / 0.15) : t < 0.08 ? lerp(0.75, 1, t / 0.08) : 1;
    return [Math.max(w, 0.02), d];
  };
  for (let s = 0; s <= sections; s++) {
    const t = s / sections, z = (t - 0.5) * L;
    const [w, d] = profile(t);
    const top = sheer * Math.pow(2 * t - 1, 2) + (t > 0.9 ? (t - 0.9) * 6 : 0);
    for (let r = 0; r <= ring; r++) {
      const a = (r / ring) * Math.PI; // 0 = starboard deck edge, PI = port deck edge
      const x = Math.cos(a) * (B / 2) * w;
      const y = top - Math.pow(Math.sin(a), 0.6) * D * d;
      pos.push(x, y, z);
    }
    deckOutline.push([(B / 2) * w, top, z]);
  }
  const rw = ring + 1;
  for (let s = 0; s < sections; s++) for (let r = 0; r < ring; r++) {
    const a = s * rw + r, b = a + 1, c = a + rw, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  // transom cap & bow cap
  const capCenter = (s) => { const base = s * rw; const c = pos.length / 3; let cx = 0, cy = 0, cz = 0; for (let r = 0; r <= ring; r++) { cx += pos[(base + r) * 3]; cy += pos[(base + r) * 3 + 1]; cz += pos[(base + r) * 3 + 2]; } pos.push(cx / rw, cy / rw, cz / rw); return c; };
  const c0 = capCenter(0); for (let r = 0; r < ring; r++) idx.push(c0, r + 1, r);
  const cN = capCenter(sections); const bN = sections * rw; for (let r = 0; r < ring; r++) idx.push(cN, bN + r, bN + r + 1);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  // deck
  const dp = [], di = [];
  for (const [x, y, z] of deckOutline) { dp.push(-x, y - 0.12, z, x, y - 0.12, z); }
  for (let s = 0; s < sections; s++) { const a = s * 2; di.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  const deck = new THREE.BufferGeometry(); deck.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3)); deck.setIndex(di); deck.computeVertexNormals();
  return { hull: g, deck, deckOutline };
}

function makeSailGeometry(w, h, billow) {
  const g = new THREE.PlaneGeometry(w, h, 8, 6);
  const p = g.attributes.position; const morph = [];
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i);
    const bx = Math.cos((x / w) * Math.PI), by = Math.cos((y / h) * Math.PI * 0.9);
    morph.push(x, y, bx * by * billow);
  }
  g.morphAttributes.position = [new THREE.Float32BufferAttribute(morph, 3)];
  return g;
}

// ---------------------------------------------------------------- Vessel: buoyant rigid body
class Vessel {
  constructor({ group, length, beam, depth, mass, x = 0, z = 0, yaw = 0, thrust, turn, kind, member = G_BOAT, freeboard = 0.3 }) {
    this.group = group; this.kind = kind; this.length = length; this.beam = beam; this.depth = depth; this.mass = mass;
    this.thrust = thrust; this.turn = turn; this.throttle = 0; this.rudder = 0; this.hp = 100; this.maxHp = 100;
    this.points = [];
    for (const zz of [-0.4, -0.13, 0.13, 0.4]) for (const xx of [-0.5, 0.5]) this.points.push(new THREE.Vector3(xx * beam * 0.8, -depth * 0.35 - freeboard, zz * length));
    const q = new THREE.Quaternion().setFromAxisAngle(UP, yaw);
    const bd = RAPIER.RigidBodyDesc.dynamic().setTranslation(x, waveHeight(x, z), z).setRotation({ x: q.x, y: q.y, z: q.z, w: q.w }).setLinearDamping(0.05).setAngularDamping(2.2).setCanSleep(false);
    this.body = Phys.world.createRigidBody(bd);
    const cd = RAPIER.ColliderDesc.cuboid(beam / 2, depth / 2, length / 2).setTranslation(0, -depth * 0.1, 0).setMass(mass).setFriction(0.3).setRestitution(0.25)
      .setCollisionGroups(groups(member, G_BOAT | G_WHALE | G_STATIC | G_SHIP)).setActiveEvents(RAPIER.ActiveEvents.COLLISION_EVENTS);
    this.collider = Phys.world.createCollider(cd, this.body);
    Phys.register(this.collider, this);
    World.scene.add(group);
    this.wakeT = 0; this.prevPos = new THREE.Vector3(x, 0, z);
    this.speed = 0; this.yaw = yaw; this.forward = new THREE.Vector3(); this.extraForce = new THREE.Vector3();
  }
  get pos() { return this.group.position; }
  physics(dt) {
    const b = this.body, m = this.mass, n = this.points.length;
    b.resetForces(true); b.resetTorques(true);
    const t = b.translation(), r = b.rotation(); _q1.set(r.x, r.y, r.z, r.w);
    const lv = b.linvel(), av = b.angvel();
    for (const p of this.points) {
      _v1.copy(p).applyQuaternion(_q1); // offset
      const wx = t.x + _v1.x, wy = t.y + _v1.y, wz = t.z + _v1.z;
      const h = waveHeight(wx, wz);
      const sub = clamp((h - wy) / (this.depth * 0.7), 0, 1.6);
      if (sub <= 0) continue;
      const pvy = lv.y + (av.z * _v1.x - av.x * _v1.z);

    const right = _v3.set(fwd.z, 0, -fwd.x);
    const vf = lv.x * fwd.x + lv.z * fwd.z, vr = lv.x * right.x + lv.z * right.z;
    const dragF = -vf * m * 0.18 - Math.sign(vf) * vf * vf * m * 0.012, dragR = -vr * m * 1.6;
    b.addForce({ x: fwd.x * (dragF + this.throttle * this.thrust * m) + right.x * dragR + this.extraForce.x, y: this.extraForce.y, z: fwd.z * (dragF + this.throttle * this.thrust * m) + right.z * dragR + this.extraForce.z }, true);
    // rudder: more bite with speed
    const bite = 0.35 + Math.min(1, Math.abs(vf) / 4) * 0.9;
    const yawT = -this.rudder * this.turn * m * bite * (vf < -0.3 ? -1 : 1);
    // self-righting
    const up = _v1.set(0, 1, 0).applyQuaternion(_q1);
    const k = m * (this.kind === 'ship' ? 26 : 14);
    b.addTorque({ x: -up.z * k, y: yawT, z: up.x * k }, true);
    this.extraForce.set(0, 0, 0);

    const t = this.body.translation(), r = this.body.rotation();
    this.group.position.set(t.x, t.y, t.z); this.group.quaternion.set(r.x, r.y, r.z, r.w);

const WHALE_BONES = 9;

    for (let k = 0; k <= 8; k++) { const t = (k / 8) * swimT; times.push(t); vals.push(...Q(Math.sin((k / 8) * TAU - b * 0.6) * amp, 0, 0)); }

    for (let k = 0; k <= 8; k++) { const t = (k / 8) * 0.6; tt.push(t); tv.push(...Q(0, Math.sin((k / 8) * TAU - b * 0.9) * amp * 2.2, Math.sin((k / 8) * TAU) * 0.05)); }

const Script = {
  token: 0, waiters: [],
  start(fn) { this.token++; this.waiters = []; const tok = this.token; Promise.resolve().then(() => fn(tok)).catch((e) => console.error(e)); },

  wait(sec) { const end = Game.simTime + sec; return this.until(() => Game.simTime >= end); },
  tick() {
    for (let i = this.waiters.length - 1; i >= 0; i--) {
      const w = this.waiters[i];
      if (w.tok !== this.token) { this.waiters.splice(i, 1); continue; }
      let ok = false; try { ok = w.cond(); } catch (e) { console.error(e); }
      if (ok) { this.waiters.splice(i, 1); w.res(); }

  alive(tok) { return tok === this.token; },
  say(lines) { const tok = this.token; return new Promise((res) => UI.dialogue(lines, () => { if (tok === this.token) res(); })); },
  choose(speaker, text, options) { const tok = this.token; return new Promise((res) => UI.choice(speaker, text, options, (i) => { if (tok === this.token) res(i); })); },

};

}

  if (!locked) {

    s.rudder = damp(s.rudder, I.moveX, 3, dt);
  } else if (!s.autopilot) s.rudder = damp(s.rudder, 0, 2, dt);

  Game.windFill = wf.a > 160 ? -0.2 : wf.f;

}

// ---------------------------------------------------------------- masthead lookout & sightings
function updateMasthead(dt) {
  if (Game.control !== 'masthead') { UI.sighting(null); return; }
  const cam = World.camera; const dir = cam.getWorldDirection(_v1);
  const range = 650 + Save.data.upgrades.glass * 250;
  let best = null, bestAng = 1;
  for (const w of Game.whales) {
    if (w.sighted || !w.alive || w.depth < -3) continue;
    const to = _v2.set(w.x - cam.position.x, 0, w.z - cam.position.z); const d = to.length(); if (d > range) continue;
    to.y = w.y + 3 - cam.position.y; to.normalize();
    const ang = Math.acos(clamp(dir.dot(to), -1, 1));
    const tol = Game.mastLook.zoom > 0.5 ? 0.09 : 0.05;
    if (ang < tol && ang < bestAng) { best = w; bestAng = ang; }
  }
  if (best) {
    Game.sightProgress += dt * (Game.mastLook.zoom > 0.5 ? 1.2 : 0.6);
    if (Game.sightProgress >= 1) {
      Game.sightProgress = 0;
      for (const w of Game.whales) if (w.pod === best.pod || w === best) w.sighted = true;
      Audio.play('sight'); Audio.shout('ishmael', 'Thar she blows'); best.spout();
      UI.bigText('THAR SHE BLOWS!'); Input.rumble(0.4, 0.8, 300);
      Game.stats.sightings = (Game.stats.sightings || 0) + 1;
      if (Game.onSight) Game.onSight(best);
    }
  } else Game.sightProgress = Math.max(0, Game.sightProgress - dt * 0.8);
  UI.sighting(best ? Game.sightProgress : 0);
}

// ---------------------------------------------------------------- the main simulation step
function simStep(dt) {
  Game.simTime += dt;
  Script.tick();
  const playing = Game.mode === 'play' || Game.mode === 'attract' || Game.mode === 'session';
  if (!playing) return;
  // context actions
  if (!Game.inputLocked) {
    if (Input.edges.cam && Game.control !== 'masthead') cycleCamera();
    if (Input.edges.look && Game.ship && (Game.control === 'ship' || Game.control === 'masthead') && Game.allowMasthead) {
      Game.control = Game.control === 'masthead' ? 'ship' : 'masthead'; Game.mastLook.yaw = 0; Game.mastLook.pitch = -0.05; Audio.play('creak', { vol: 2 });
      UI.toast(Game.control === 'masthead' ? 'You climb to the mast-head.' : 'You descend to the deck.', 1.4);
    }
  }
  if (Game.ship) controlShip(dt);
  if (Game.boat) { controlBoat(dt); updateAiming(dt); }
  if (Game.fast) updateTow(dt);
  for (const w of Game.whales) updateWhaleAI(w, dt);
  if (Game.session) Hub.steerRemoteWhales(dt);
  if (Game.npc && Game.npc.autopilot) Game.npc.autopilot(dt);
  Phys.tick(dt, (st) => {
    if (Game.ship) Game.ship.physics(st);
    if (Game.boat) Game.boat.physics(st);
    if (Game.npc) Game.npc.physics(st);
    for (const w of Game.whales) w.sync(0);
  }, onCollision);
  if (Game.ship) { Game.ship.sync(dt); animateShip(Game.ship.group, dt, Game.sailLevel, Game.windFill || 0, World.weather === 'night' || World.weather === 'dusk' || Game.flags.tryworks); }
  if (Game.npc) { Game.npc.sync(dt); animateShip(Game.npc.group, dt, 0.7, 0.8, World.weather === 'dusk'); }
  if (Game.boat) { Game.boat.sync(dt); animateBoat(Game.boat.group, dt, Game.boat.rowRate || 0.1, Game.aiming); }
  for (const w of Game.whales) w.sync(dt);
  for (let i = Game.harpoons.length - 1; i >= 0; i--) { const h = Game.harpoons[i]; h.update(dt); if (!h.alive) Game.harpoons.splice(i, 1); }
  if (Game.boss && Game.boss.update) Game.boss.update(dt);
  updateMasthead(dt);
  if (Game.chapterUpdate) Game.chapterUpdate(dt);
  if (Game.mode === 'play') { Save.data.stats.playSeconds += dt; Game.stats.time += dt; }
}

function updateAudioAmbience() {
  const c = controlled();
  const storm = World.weather === 'storm';
  Audio.setAmbient({
    sea: storm ? 1 : 0.45, wind: (storm ? 1 : 0.25 + World.windStrength * 0.3) * (Game.control === 'masthead' ? 1.6 : 1),
    rain: storm ? 1 : 0, wake: c ? clamp(Math.abs(c.speed) / 8, 0, 1) : 0, windFreq: storm ? 900 : 600,
  });
}

function newStats() { return { thrown: 0, hits: 0, whales: 0, time: 0, stoves: 0, lances: 0, dodges: 0, sightings: 0, braced: 0 }; }

// ---------------------------------------------------------------- stage helpers
function stage({ harbor = false, weather = 'fair', ship = [0, 0, 0], song = 'voyage', boat = null }) {
  clearActors();
  setHarborVisible(harbor);
  setWeather(weather, true);
  const s = ensureShip(); s.teleport(ship[0], ship[1], ship[2]); s.hp = s.maxHp = 100; s.autopilot = null;
  Game.ship.group.userData.doubloon.visible = !!Game.flags.doubloon;
  for (const c of Game.ship.group.userData.corposants) c.visible = false;
  Game.flags.tryworks = false;
  if (boat) { spawnBoat(boat[0], boat[1], boat[2]); Game.control = 'boat'; } else Game.control = 'ship';
  Game.camMode = 0; Game.camYaw = 0; Game.camPitch = 0.28; Game.aiming = false; Game.stove = false; Game.wrecked = false;
  Game.onWhaleDeath = null; Game.onWhaleHit = null; Game.onSight = null; Game.onStove = null; Game.onWreck = null; Game.onFast = null; Game.onThrow = null;
  Game.chapterUpdate = null; Game.camOverride = null; Game.inputLocked = false; Game.allowMasthead = false;
  World.windDir = Math.atan2(1, 0.25); // wind blowing roughly toward +z (east-north-east)
  setGullCenter(ship[0], ship[1], harbor);
  Audio.playSong(song);
  UI.objective(null);
  // snap the camera behind the focus
  const f = controlled(); if (f) { const yaw = f.yaw + Math.PI; World.camera.position.set(f.pos.x + Math.sin(yaw) * 40, f.pos.y + 15, f.pos.z + Math.cos(yaw) * 40); }
}
function objective(text, target = null, label = '') { Game.objective = text; UI.objective(text); Game.marker = target; UI.marker(target, label); }
function near(a, b, r) { return a && b && dist2(a.x, a.z, b.x, b.z) < r; }
function spawnPod(cx, cz, n, opts = {}) {
  const pod = Math.random();
  const out = [];
  for (let i = 0; i < n; i++) { const w = spawnWhale({ x: cx + rand(-30, 30), z: cz + rand(-30, 30), yaw: rand(0, TAU), ...opts }); w.pod = pod; w.home = { x: cx, z: cz, r: 90 }; out.push(w); }
  return out;
}
function startChapter(i, opts = {}) {
  Game.chapterIndex = i; Save.data.chapter = i; Save.data.unlocked = Math.max(Save.data.unlocked, i + 1); Save.write();
  const ch = CHAPTERS[i];
  if (!opts.continuing || !Game.stats) Game.stats = newStats();
  Game.mode = 'play'; Game.paused = false;
  UI.showScreen(null); UI.hud(true);
  Script.start((tok) => ch.run(tok, opts));
}
async function chapterDone(i) {
  Save.data.chapter = Math.min(i + 1, CHAPTERS.length - 1); Save.data.unlocked = Math.max(Save.data.unlocked, i + 2); Save.write();
  UI.objective(null); UI.marker(null);
  await UI.fadeAsync(1, 900);
  if (i + 1 < CHAPTERS.length) startChapter(i + 1, { continuing: true });
}
function controlsHint(list) { UI.prompts(list); }

// ---------------------------------------------------------------- I. Loomings — tutorial: sailing
async function chLoomings() {
  stage({ harbor: true, weather: 'dawn', ship: [110, 20, 0], song: 'calm' });
  Game.sailLevel = 0; Game.inputLocked = true;
  await UI.fadeAsync(0, 600);
  await Script.card('Chapter I', 'Loomings', TEXT.loomings);
  await Script.say([
    ['starbuck', 'Mr. Ishmael. The Captain keeps his cabin, and Captain Peleg says you have the tiller till we clear the bar. Mind her well; she is old, and proud, and has a temper.'],
    ['queequeg', 'Queequeg pull halyard. Ishmael make sail. Sea very big — but Queequeg bigger. Ha!'],
  ]);
  Game.inputLocked = false;
  objective('Make sail: push UP to raise canvas');
  controlsHint([['move', 'Up/Down: sail · Left/Right: tiller'], ['lookAround', 'Look'], ['cam', 'Change view']]);
  await Script.until(() => Game.sailLevel > 0.55);
  Audio.play('sail');
  UI.bark('starbuck', 'Well done. Now through the channel — between the red buoy and the green, three times, and we are clear of Nantucket.');
  const gates = [placeBuoyGate(100, 140, 0), placeBuoyGate(40, 260, -0.3), placeBuoyGate(110, 380, 0.3)];
  for (const [gi, g] of gates.entries()) {
    objective(`Sail between the buoys (${gi + 1} of 3)`, new THREE.Vector3(g.x, 2, g.z), 'Channel');
    await Script.until(() => { const p = Game.ship.pos; return Math.abs(p.z - g.z) < 10 && Math.abs(p.x - g.x) < g.width / 2 + 4; });
    Audio.play('bell', { vol: 0.6 });
    if (gi === 0) { UI.bark('ishmael', 'The wind is out of the north, at our backs — see the blue arrow on the compass. A ship runs fastest with it on her beam, and dies in irons if she turns into it.'); controlsHint([['move', 'Sail & steer'], ['cam', 'Change view'], ['map', 'Journal']]); }
    if (gi === 1) UI.bark('queequeg', 'Good! Ishmael steer like harpooneer. Almost.');
  }
  objective('Clear the harbour: stand out to the open sea', new THREE.Vector3(80, 2, 520), 'Open sea');
  UI.bark('starbuck', 'Clear of the bar. Now she is ours, and the sea\'s.');
  await Script.until(() => Game.ship.pos.z > 480);
  await Script.say([
    ['ahab', 'Starbuck. Ishmael. Look ye — d\'ye see the open sea? There is a thing in it I mean to find. Keep her steady. We are bound around the Horn.'],
    ['ishmael', 'It was the first I ever heard his voice. It was like the scrape of an anchor-chain across a reef.'],
  ]);
  await chapterDone(0);
}

  await Script.until(() => { if (Game.simTime - hintT > 40 && !Game.flags.mastHint) { Game.flags.mastHint = true; UI.bark('stubb', 'Off the starboard bow, ye dreamer! Two points off the bow!'); pod.forEach((w) => { w.spoutT = Math.min(w.spoutT, 1); }); } return pod.some((w) => w.sighted); });
  Game.flags.mastHint = false;

  const c = new THREE.Vector3(); const center = () => { c.set(0, 2, 0); for (const w of pod) { c.x += w.x / pod.length; c.z += w.z / pod.length; } return c; };

// ---------------------------------------------------------------- III. The First Lowering — hunting, the sleigh ride, the lance

  Game.sailLevel = 0.1;
  const podPos = Game.flags.podFromMasthead && opts.continuing ? Game.flags.podFromMasthead : null;
  const pod = [];
  for (let i = 0; i < 3; i++) {
    const pp = podPos ? podPos[i] : null;
    const w = spawnWhale({ x: pp ? sx + 9 + Math.sin(0.4) * 120 + (pp.x - podPos[0].x) * 0.5 : Math.sin(0.4) * 120 + rand(-25, 25), z: pp ? sz + Math.cos(0.4) * 120 + (pp.z - podPos[0].z) * 0.5 : Math.cos(0.4) * 120 + rand(-25, 25), yaw: rand(0, TAU) });
    w.home = { x: Math.sin(0.4) * 130, z: Math.cos(0.4) * 130, r: 110 }; w.pod = 1; w.sighted = true; pod.push(w);
  }
  Game.ship.autopilot = (dt) => { Game.ship.rudder = damp(Game.ship.rudder, 0.15, 1, dt); };
  Game.inputLocked = true;
  await UI.fadeAsync(0, 500);
  await Script.card('Chapter III', 'The First Lowering', TEXT.lowering);
  Game.inputLocked = false;
  const resetBoat = async () => {
    Game.inputLocked = true; cutLine(); await UI.fadeAsync(1, 600);
    spawnBoat(Game.ship.pos.x + 16, Game.ship.pos.z + 6, Game.ship.yaw); Game.stove = false; Game.control = 'boat';
    for (const w of pod) if (w.alive) { w.hp = Math.max(w.hp, w.maxHp * 0.6); w.stamina = 100; w.state = 'wander'; }
    await UI.fadeAsync(0, 600); Game.inputLocked = false;
  };
  Game.onStove = async () => {
    Game.inputLocked = true;
    await Script.card('Stove Boat!', 'The whale has the better of you', 'The boat is splintered to staves, and the crew are fished from the sea, coughing, by the Pequod\'s waist-boat. "There is no shame in a stove boat," says Starbuck, "only in a second one." Back to the oars.');

  controlsHint([['move', 'Row & steer'], ['aim', 'Stand up & aim'], ['fire', 'Dart!'], ['back', 'Back water / brace']]);
  UI.bark('stubb', 'Pull, my little ones! Softly, softly — easy, now — then give it to her, Queequeg, give it to her!');

    if (!firstFast) return; firstFast = false;

    UI.tutorial('THE LINE', 'Haul in (R2 / left mouse) to close the distance; pay out (L2 / right mouse) when the whale surges. Too much strain and the line parts; too little and the whale recovers. Keep the strain in the green and she will tire.');
  };
  let killed = 0;

  Game.chapterUpdate = () => {
    if (!Game.fast && Game.objective && Game.objective.startsWith('Sleigh') && killed === 0) objective('Pull for the whales — and dart the iron', nearestWhale(Game.boat.pos) ? nearestWhale(Game.boat.pos).pos : null, 'Whales');
    if (Game.lance && !Game.flags.lanceTut) { Game.flags.lanceTut = true; UI.tutorial('THE LANCE', 'She tires! When the ring closes over the gold mark, strike with □ / F. A true thrust goes deep; a hasty one only glances.'); }

    ['stubb', 'Fin out! Hurrah! That\'s a whale for the books, Ishmael — ye\'ll be a Nantucketer yet!'],

// ---------------------------------------------------------------- the White Whale's mind
function setupWhiteAI(W) {
  W.state = 'circle'; W.stateT = 6; W.circleDir = 1; W.exposeT = 10;
  W.whiteAI = (w, dt, tp, dT) => {
    const boss = Game.boss; if (!boss) return;
    // the old irons glow while he rolls, exposing his back
    w.exposeT -= dt;
    const exposing = w.exposeT < 0 && w.exposeT > -5;
    if (w.exposeT < -5) w.exposeT = rand(9, 14);
    w.roll = damp(w.roll, exposing ? 0.5 : 0, 1.5, dt);
    for (const iron of w.oldIrons) iron.userData.glow.material.opacity = exposing ? 0.6 + Math.sin(Game.simTime * 8) * 0.3 : 0;
    if (exposing && !w.exposeBark) { w.exposeBark = true; UI.bark('starbuck', 'He rolls! The old irons — see them shine in his back! Strike there!'); }
    if (!exposing) w.exposeBark = false;
    switch (w.state) {
      case 'circle': {
        w.targetDepth = -0.6; w.targetSpeed = 6;
        if (tp) { const ang = Math.atan2(w.x - tp.x, w.z - tp.z) + w.circleDir * 0.5; const gx = tp.x + Math.sin(ang) * 55, gz = tp.z + Math.cos(ang) * 55; w.turnToward(gx, gz, 0.9, dt); }
        if (w.stateT <= 0) {
          if (boss.day === 2 && !w.noDive && Math.random() < 0.6) { w.state = 'sound'; w.stateT = 3; }
          else { w.state = 'brow'; w.stateT = 1.6; Audio.play('whiteRoar', { vol: 0.7 }); Audio.play('warn'); UI.bigText('HE CHARGES!', 1); }
        }
        break;
      }
      case 'brow': { // telegraph: he lowers his brow and turns on you
        w.targetSpeed = 2; if (tp) w.turnToward(tp.x, tp.z, 2.5, dt);
        if (Math.random() < 0.5) FX.wake(w.x + Math.sin(w.yaw) * w.L * 0.5, w.z + Math.cos(w.yaw) * w.L * 0.5, 2);
        if (tp && Math.random() < 0.3) FX.ring(tp.x, tp.z, 0xff3020, 5);
        if (w.stateT <= 0) { w.state = 'charge'; w.stateT = 3.2; if (tp) { const lv = Game.boat && tp === Game.boat.pos ? Game.boat.body.linvel() : { x: 0, z: 0 }; w.chargeAt = { x: tp.x + lv.x * 1.2, z: tp.z + lv.z * 1.2 }; } }
        break;
      }
      case 'charge': {
        w.targetSpeed = 15; w.speed = Math.max(w.speed, 10);
        if (w.chargeAt) w.turnToward(w.chargeAt.x, w.chargeAt.z, 0.8, dt);
        FX.wake(w.x + Math.sin(w.yaw) * w.L * 0.5, w.z + Math.cos(w.yaw) * w.L * 0.5, 2.5);
        if (Math.random() < 0.4) World.particles.spray.spawn(w.x + Math.sin(w.yaw) * w.L * 0.5, w.y + 1, w.z + Math.cos(w.yaw) * w.L * 0.5, rand(-3, 3), rand(3, 6), rand(-3, 3), { life: 1, size: 0.4, gravity: -12 });
        if (w.stateT <= 0) { w.state = 'circle'; w.stateT = rand(5, 8) / (boss.day === 3 ? 1.5 : 1); w.circleDir *= -1; }
        break;
      }
      case 'sound': { // dive deep
        w.targetDepth = -30; w.targetSpeed = 4;
        if (w.stateT <= 0) { w.state = 'deep'; w.stateT = 4.5; const b = w.target || Game.boat; w.breachAt = b ? { x: b.pos.x + Math.sin(b.yaw) * 6, z: b.pos.z + Math.cos(b.yaw) * 6 } : { x: w.x, z: w.z }; Audio.play('whale', { pitch: 50, vol: 1.2 }); UI.bark('flask', 'He\'s sounded! Watch the water, watch it!'); }
        break;
      }
      case 'deep': { // rising rings mark the breach
        w.targetSpeed = 0; w.x = damp(w.x, w.breachAt.x, 2, dt); w.z = damp(w.z, w.breachAt.z, 2, dt);
        if (Math.random() < 0.35) { FX.ring(w.breachAt.x + rand(-3, 3), w.breachAt.z + rand(-3, 3), 0xffffff, rand(4, 12)); World.particles.wake.spawn(w.breachAt.x + rand(-6, 6), waveHeight(w.breachAt.x, w.breachAt.z) + 0.1, w.breachAt.z + rand(-6, 6), 0, 0, 0, { life: 1.5, size: 1, grow: 3, gravity: 0, drag: 0, floatOnWater: true }); }
        if (w.stateT <= 0) { w.state = 'breach'; w.stateT = 2.6; w.depth = -14; w.targetDepth = 9; w.extraPitch = -1.1; Audio.play('bigSplash'); FX.splash(w.x, w.z, 3); }
        break;
      }
      case 'breach': {
        w.targetSpeed = 3;
        if (w.stateT < 1.4 && !w.breachHit) { w.breachHit = true; w.targetDepth = -0.6; w.extraPitch = 0.3; }
        if (w.stateT <= 0) {
          w.breachHit = false; w.extraPitch = 0; FX.splash(w.x, w.z, 3.5); Audio.play('bigSplash'); Game.shake(0.9); Input.rumble(1, 1, 500);
          areaHit(w.x, w.z, 15, 40);
          w.state = 'dazed'; w.stateT = 9; w.exposeT = 0;
          UI.bark('starbuck', 'He lies dazed! Now, Ishmael — now — dart!');
        }
        break;
      }
      case 'dazed': {
        w.targetSpeed = 0.6; w.targetDepth = -0.4;
        if (w.stateT <= 0) { w.state = 'circle'; w.stateT = 5; }
        break;
      }
      case 'ramShip': {
        const s = Game.ship; w.targetDepth = -0.5; w.targetSpeed = 13; w.turnToward(s.pos.x, s.pos.z, 1.4, dt);
        FX.wake(w.x + Math.sin(w.yaw) * w.L * 0.5, w.z + Math.cos(w.yaw) * w.L * 0.5, 3);
        if (dist2(w.x, w.z, s.pos.x, s.pos.z) < w.L * 0.6 + 6 && !w.rammed) {
          w.rammed = true; damageShip(30); FX.debris(s.pos.x, s.pos.y + 2, s.pos.z, 30); Audio.play('crash'); Audio.play('whiteRoar');
          s.impulse(Math.sin(w.yaw) * 3, 2, Math.cos(w.yaw) * 3); Game.shake(1.2); s.hp = 25;
          w.stateT = Math.min(w.stateT, 2.5);
        }
        if (w.stateT <= 0) { w.state = 'circle'; w.stateT = 4; w.rammed = false; }
        break;
      }
      case 'still': { w.targetSpeed = 0; w.targetDepth = -0.3; w.roll = damp(w.roll, 0.15, 1, dt); break; }
      default: w.state = 'circle';
    }
  };
}

// ---------------------------------------------------------------- endings
async function ending(kind) {
  Save.data.ending = kind; Save.data.unlocked = CHAPTERS.length; Save.write();
  const W = Game.boss && Game.boss.whale;
  Game.inputLocked = true;
  if (kind === 'strike') {
    Audio.play('lance'); Audio.play('whiteRoar');
    if (W) { W.state = 'sinking'; W.whiteAI = (w, dt) => { w.targetDepth = -40; w.targetSpeed = 3; w.extraPitch = 0.6; }; }
    Game.shake(1); FX.splash(W.x, W.z, 3);
    setTimeout(() => { if (Game.ship) { FX.debris(Game.ship.pos.x, Game.ship.pos.y + 3, Game.ship.pos.z, 40); Game.ship.extraSink = true; } }, 2500);
  } else {
    Audio.play('snap');
    if (W) { W.state = 'leaving'; W.whiteAI = (w, dt) => { w.targetDepth = -20; w.targetSpeed = 3; }; }
  }
  Game.camOverride = (cam, dt) => { const b = Game.boat ? Game.boat.pos : Game.ship.pos; cam.position.lerp(_v1.set(b.x + 30, 18, b.z - 30), 1 - Math.exp(-0.6 * dt)); cam.lookAt(b.x, 0, b.z); };
  await Script.wait(4);
  Audio.playSong('ending');
  await UI.fadeAsync(1, 1500);
  Game.mode = 'ending';
  UI.hud(false);
  await Script.card('Epilogue', kind === 'strike' ? '"And I only am escaped alone to tell thee."' : 'The Line, Cut', (kind === 'strike' ? TEXT.endingStrike : TEXT.endingCut) + ' ' + ENDING_BY_STATE());
  UI.showEnding(kind, Game.stats);
}

  // ------------------------------------------------------------ menus (generic, focus-driven)
  makeScreen(id, title, cls = '') {
    const s = document.createElement('div'); s.className = 'screen hidden ' + cls; s.id = 'scr-' + id;
    if (title) { const t = el('h2', 'scrTitle', title); s.appendChild(t); }
    const list = el('div', 'menuList'); s.appendChild(list);
    const footer = el('div', 'menuFooter'); s.appendChild(footer);
    this.root.appendChild(s);
    const scr = { id, el: s, list, footer, items: [], index: 0, onBack: null, onShow: null };
    this.screens[id] = scr; return scr;
  },
  addItem(scr, item) {
    const row = el('div', 'item t-' + (item.type || 'button'));
    const lbl = el('span', 'ilbl', item.label); row.appendChild(lbl);
    if (item.type === 'slider' || item.type === 'toggle' || item.type === 'choice') { const v = el('span', 'ival'); row.appendChild(v); item.valEl = v; }
    if (item.desc) { const d = el('div', 'idesc', item.desc); row.appendChild(d); item.descEl = d; }
    item.el = row; scr.list.appendChild(row); scr.items.push(item);
    row.addEventListener('mouseenter', () => { if (item.disabled) return; scr.index = scr.items.indexOf(item); this.refresh(scr); });
    row.addEventListener('click', (e) => {
      if (item.disabled) return; scr.index = scr.items.indexOf(item);
      if (item.type === 'slider') { const r = row.getBoundingClientRect(); const f = clamp((e.clientX - r.left - r.width * 0.45) / (r.width * 0.5), 0, 1); item.set(Math.round(f * 20) / 20); Audio.play('uiMove'); }
      else this.activate(scr, item);
      this.refresh(scr);
    });
    this.renderItem(item);
    return item;
  },
  renderItem(item) {
    if (item.labelFn) item.el.querySelector('.ilbl').textContent = item.labelFn();
    if (item.type === 'slider') { const v = item.get(); item.valEl.innerHTML = `<span class="slider"><i style="width:${Math.round(v * 100)}%"></i></span> ${Math.round(v * 100)}`; }
    if (item.type === 'toggle') item.valEl.textContent = item.get() ? 'On' : 'Off';
    if (item.type === 'choice') item.valEl.textContent = '‹ ' + item.options[item.get()] + ' ›';
    item.el.classList.toggle('disabled', !!item.disabled);
  },
  refresh(scr) {
    scr.items.forEach((it, i) => { it.el.classList.toggle('focus', i === scr.index); this.renderItem(it); });
    const f = scr.items[scr.index]; if (f && f.el.scrollIntoView) f.el.scrollIntoView({ block: 'nearest' });
  },
  activate(scr, item) {
    if (item.disabled) return;
    if (item.type === 'toggle') { item.set(!item.get()); Audio.play('uiMove'); }
    else if (item.type === 'choice') { item.set((item.get() + 1) % item.options.length); Audio.play('uiMove'); }
    else if (item.action) { Audio.play('uiSelect'); item.action(); }
    this.refresh(scr);
  },
  showScreen(id, push = false) {
    if (this.current && !push) this.current.el.classList.add('hidden');
    if (push && this.current) { this.stack.push(this.current); this.current.el.classList.add('hidden'); }
    if (!push) this.stack = [];
    const scr = id ? this.screens[id] : null;
    this.current = scr;
    if (scr) {
      if (scr.onShow) scr.onShow();
      scr.el.classList.remove('hidden');
      scr.index = Math.max(0, scr.items.findIndex((it) => !it.disabled));
      if (scr.keepIndex != null) { scr.index = scr.keepIndex; scr.keepIndex = null; }
      this.refresh(scr);
    }
    document.body.classList.toggle('menu-open', !!scr && (Game.mode === 'play' || Game.mode === 'session'));
    this.updateGlyphs();
  },
  back() {
    const cur = this.current;
    if (cur && cur.onBack) { cur.onBack(); return; }
    if (this.stack.length) { cur.el.classList.add('hidden'); this.current = this.stack.pop(); this.current.el.classList.remove('hidden'); this.refresh(this.current); Audio.play('uiBack'); }
  },
  menuInput() {
    const scr = this.current; if (!scr) return false;
    const e = Input.edges;
    if (scr.custom) { scr.custom(e); return true; }
    const n = scr.items.length;
    const step = (d) => { if (!n) return; let i = scr.index; for (let k = 0; k < n; k++) { i = (i + d + n) % n; if (!scr.items[i].disabled) break; } scr.index = i; Audio.play('uiMove'); this.refresh(scr); };
    if (e.nav === 'up') step(-1);
    if (e.nav === 'down') step(1);
    const it = scr.items[scr.index];
    if (it && (e.nav === 'left' || e.nav === 'right')) {
      const d = e.nav === 'left' ? -1 : 1;
      if (it.type === 'slider') { it.set(clamp(Math.round((it.get() + d * 0.05) * 100) / 100, 0, 1)); Audio.play('uiMove'); this.refresh(scr); }
      else if (it.type === 'toggle') { it.set(!it.get()); Audio.play('uiMove'); this.refresh(scr); }
      else if (it.type === 'choice') { it.set((it.get() + d + it.options.length) % it.options.length); Audio.play('uiMove'); this.refresh(scr); }
    }
    if (e.confirm && it) this.activate(scr, it);
    else if (e.cancel) this.back();
    return true;
  },

  renderHowto() {

  },
};

// ============================================================================
// AI HUB — co-op session: "The Gam of Boats" (1-4 whaleboats, one White Whale)
// The host's copy (or a server with no player) runs the whales; every copy
// rows its own boat and tells the host where it is and what it struck.
// ============================================================================
const STATE_CODES = ['wander', 'flee', 'dive', 'tow', 'attack', 'slamUp', 'dead', 'circle', 'brow', 'charge', 'sound', 'deep', 'breach', 'dazed', 'still'];

  info: null, remote: new Map(), score: {}, started: false, over: false, ended: false, sendT: 0, lastSnap: -Infinity,
  respawnT: 0, labels: new Map(), seatPos: [],
  get isHost() { return !!(this.info && this.info.isHost); },
  async begin() {
    Game.mode = 'session'; Game.session = true;
    let info = null;

    if (!info) { Game.session = false; Game.mode = 'boot'; return false; }

    this.build();

    HUB.on('leave', ({ id }) => this.removePlayer(id));
    HUB.on('time-up', () => { if (this.isHost) this.finish(false); });
    HUB.on('end', () => { this.ended = true; Game.inputLocked = true; Audio.setMuted(true); UI.bigText('THE ROUND IS DONE', 4); });
    HUB.ready();
    return true;
  },
  build() {
    const info = this.info;
    stage({ harbor: false, weather: 'line', ship: [-230, -160, 0.8], song: 'calm' });
    Game.ship.autopilot = () => { Game.sailLevel = 0; };
    Game.stats = newStats(); Game.flags = {};
    const rng = HUB.rng('pod');
    // the White Whale and a pod, the same on every copy (ids in order)
    WHALE_ID = 0;
    const W = spawnWhale({ id: 0, x: 0, z: 0, yaw: rng() * TAU, white: true });
    W.hp = W.maxHp = 260 + info.players.length * 140;
    Game.boss = { whale: W, day: 2, allowTow: false };
    setupWhiteAI(W); W.state = 'circle'; W.stateT = 12;
    for (let i = 0; i < 3; i++) {
      const a = rng() * TAU, r = 120 + rng() * 80;
      const w = spawnWhale({ id: i + 1, x: Math.sin(a) * r, z: Math.cos(a) * r, yaw: rng() * TAU }); w.home = { x: w.x, z: w.z, r: 70 };
    }
