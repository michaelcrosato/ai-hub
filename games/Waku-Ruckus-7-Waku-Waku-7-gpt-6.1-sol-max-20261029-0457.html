<!-- WAKU RUCKUS 7 — SOURCE INFORMATION
Date: 2026-10-29 04:57 (America/Vancouver)
Source: Waku Waku 7
Tech: Three.js r180 (0.180.0), WebGPURenderer, WebGPU required with fallback disabled; Rapier 3D 0.19.3; native Gamepad API; Web Audio API; vanilla JavaScript, HTML and CSS.
Art Direction: procedural cel-shaded 3D with four-tone ramps, ink silhouettes, paper textures and a festival-poster interface. Geometry and graphics authored in code.
Animation: hierarchical procedural rigs, combat state poses, squash, secondary motion, particles, hitstop and a tracking camera.
Audio: original code-written 132 BPM music, synthesized sound effects, oscillator-based Animalese-style gibberish voices. Audio starts with an input gesture.
Online: AI Hub Session Protocol v1, unmodified client 1.3.0; versus 1-4 seats, compact 15 Hz snapshots, local prediction, host-owned damage / projectiles / results, server host support. Standalone 2-4 player rooms use PeerJS 1.5.5 / WebRTC and the public PeerJS signaling service. No chat or voice communication.
Testing parameters allowed: efficient and lightweight. Focused functional browser / combat checks, controller emulation, rendered WebGPU captures and multiplayer conformance. No FPS benchmarks or optimization targets.
Environment: Codex CLI (headless); Linux. Tested browser: Google Chrome 154.0.8037.57, SwiftShader WebGPU; Xvfb for visual captures. Player browser: unknown.
Model: OpenAI, gpt-6.1-sol, reasoning effort max.
Usage: estimated API cost USD unknown; total tokens unknown; token breakdown unknown; session time about 1 hour.

TESTING FEEDBACK
How many game issues did testing catch? 2, both fixed: Rapier body-descriptor API mismatch and attract-stage label mismatch. A separate headless GPU presentation issue was resolved in the test setup.
Critical / game-breaking issues? 1: the Rapier mismatch prevented startup.
Most helpful test? Browser smoke test with a rendered WebGPU frame.
Least helpful test? Syntax-only validation, which passed despite the Rapier API mismatch.
Coverage: combat, seven character traits, campaign / bonus / ending, dojo, 10-second idle attract and exit, controller UI / axis settings, touch notice, 1-4 hub players, server hosting, departures and real PeerJS room play. Physical controllers across separate home networks: unknown.

ENGINE FEEDBACK
What did I like most? Three.js toon node materials, direct scene composition and WebGPU shadows.
Did I get stuck or guess wrong? Yes: a rigid-body method was used on a Rapier descriptor; headless Chrome presentation also needed corrected GPU flags and Xvfb visual capture.
Most important thing built myself? The combat state machine, hit volumes, cancels and recovery rules.
Hardest part? Combining predicted local movement with host-owned combat and physics.
What would I remove or overhaul? Implicit renderer fallback.
One thing I would change? Add an explicit public WebGPU-only initialization option.

PROMPT FEEDBACK
What did I like most? The single-file deliverable, controller-first UX, attract mode and provenance requirements.
What was confusing? Exact roster / campaign size was open; this demo chooses seven playable fighters, three stage settings, seven arcade bouts and a bonus intermission.
What was hardest? Completing combat, campaign, controller UX and two multiplayer transports together.
One additional test I would run? Two physical DualSense controllers on separate home networks, including connection loss.

ATTRIBUTION
Three.js: MIT. Rapier: Apache-2.0. PeerJS: MIT. Fonts: Bungee, Barlow Condensed and Nunito Sans, Google Fonts / SIL OFL. AI Hub session client is included unmodified from the user-specified repository. All characters, writing, geometry, music and sound synthesis are original to this demo. Waku Waku 7 belongs to its respective owners; this is an unofficial spiritual successor.

<script>/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

class Soundtrack {
	constructor() {

		this.started = false;
		this.beat = 0;
		this.next = 0;
		this.music = null;
		this.fx = null;
		this.voices = null;
		this.noise = null;
		this.lastVoice = -10;
		this.paused = false;

	init() {

				this.fx = this.ctx.createGain();
				this.voices = this.ctx.createGain();
				this.master = this.ctx.createGain();
				this.master.gain.value = 0.48;
				const comp = this.ctx.createDynamicsCompressor();
				comp.threshold.value = -12;
				comp.ratio.value = 5;
				this.master.connect(comp);
				comp.connect(this.ctx.destination);
				for (const a of [this.music, this.fx, this.voices])
					a.connect(this.master);
				this.noise = this.ctx.createBuffer(
					1,
					this.ctx.sampleRate * 0.5,
					this.ctx.sampleRate,
				);
				const d = this.noise.getChannelData(0);
				for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
				this.next = this.ctx.currentTime + 0.1;
				this.update();
			} catch {
				return;
			}
		}
		this.ctx.resume().catch(() => {});
		this.started = true;
	}
	update() {
		if (!this.ctx) return;
		this.music.gain.setTargetAtTime(
			(settings.music / 100) * 0.36,
			this.ctx.currentTime,
			0.1,
		);
		this.fx.gain.setTargetAtTime(
			(settings.sfx / 100) * 0.6,
			this.ctx.currentTime,
			0.05,
		);
		this.voices.gain.setTargetAtTime(
			(settings.voice / 100) * 0.5,
			this.ctx.currentTime,
			0.05,
		);
	}
	tone(
		freq,
		duration = 0.12,
		type = "sine",
		gain = 0.2,
		bus = this.fx,
		at = 0,
		slide = 0,

				Math.max(20, slide),

		e.gain.exponentialRampToValueAtTime(Math.max(0.001, gain), t + 0.008);
		e.gain.exponentialRampToValueAtTime(0.0001, t + duration);

		o.start(t);
		o.stop(t + duration + 0.02);

	sfx(kind) {

		} else if (kind === "shot") {
			this.tone(720, 0.19, "square", 0.12, this.fx, t, 200);
			this.hiss(0.1, 0.09, 2000);

			[784, 659, 523, 392].forEach((f, i) => {
				this.tone(f, 0.28, "triangle", 0.25, this.fx, t + i * 0.12);
			});

		} else if (kind === "bell") {
			[1046, 1568, 2093].forEach((f, i) => {
				this.tone(f, 0.6, "sine", 0.17, this.fx, t + i * 0.08);

			this.tone(f * 2.1, 0.06, "sine", 0.05, this.voices, t + 0.008);

	tick() {
		if (!this.ctx || this.paused || G.ended) return;
		const t = this.ctx.currentTime;
		if (this.next < t - 0.3) this.next = t + 0.03;

			const b = this.beat++,
				step = b % 16,
				bar = Math.floor(b / 16) % 4,
				root = [48, 53, 55, 53][bar],
				scale = [0, 4, 7, 9, 12, 9, 7, 4, 2, 5, 9, 12, 14, 12, 9, 7],
				midi = (n) => 440 * 2 ** ((n - 69) / 12),
				at = this.next;
			if (step % 4 === 0) {
				this.tone(120, 0.16, "sine", 0.7, this.music, at, 35);
				this.tone(midi(root - 12), 0.19, "triangle", 0.34, this.music, at);
			}
			if (step % 4 === 2) {
				this.hissMusic(at);
				this.tone(180, 0.07, "triangle", 0.06, this.music, at);
			}
			if (step % 2 === 0)
				this.tone(9000, 0.025, "square", 0.018, this.music, at);
			if (step % 2 === 0 || step === 7 || step === 15)
				this.tone(
					midi(root + 12 + scale[step]),
					0.12,
					"triangle",
					0.18,
					this.music,
					at,
				);
			if (step % 4 === 1)
				[0, 4, 7].forEach((n) => {
					this.tone(midi(root + n), 0.1, "sine", 0.08, this.music, at);
				});
			this.next += 60 / 132 / 4;
		}
	}
	hissMusic(at) {
		if (!this.ctx) return;
		const n = this.ctx.createBufferSource(),
			e = this.ctx.createGain(),
			f = this.ctx.createBiquadFilter();

		f.type = "highpass";
		f.frequency.value = 1800;

		e.gain.exponentialRampToValueAtTime(0.0001, at + 0.075);
		n.connect(f);
		f.connect(e);
		e.connect(this.music);

function textTexture(
	text,

		h = 256,
		border = true,
	} = {},
) {
	const c = document.createElement("canvas");

	c.height = h;
	const ctx = c.getContext("2d");
	ctx.fillStyle = bg;
	ctx.fillRect(0, 0, w, h);
	if (border) {
		ctx.strokeStyle = fg;
		ctx.lineWidth = 12;
		ctx.strokeRect(8, 8, w - 16, h - 16);
	}
	ctx.fillStyle = fg;
	ctx.textAlign = "center";
	ctx.textBaseline = "middle";
	ctx.font = `900 ${size}px "Barlow Condensed",sans-serif`;
	text.split("\n").forEach((s, i, a) => {
		ctx.fillText(
			s,
			w / 2,
			h / 2 + (i - (a.length - 1) / 2) * size * 1.05,
			w - 30,
		);
	});

	t.colorSpace = THREE.SRGBColorSpace;
	return t;
}

		} else if (a.type === "rush") {
			m.torso.rotation.z = -0.5;
			m.armF.rotation.z = 1.7;
			m.legF.rotation.z = walk;

			m.armF.rotation.z = 2.7;

		if (m.index === 0 && i < 2)
			m.extra[i].rotation.z =
				(i === 0 ? 0.22 : -0.2) + Math.sin(t * 5 + i) * 0.07;
		if (m.index === 6 && i > 0) m.extra[i].rotation.y = t;

}

		} else if (settings.dummy === 2) {
			inp.guard = true;
			inp.y = player.attack === "sweep" ? 0.8 : 0;
		} else if (settings.dummy === 1 && (G.dojoDone || lesson === "burst")) {
			if (dist > 2.1) inp.x = dir * 0.6;
			if (f.aiTime <= 0) {
				inp.actions.push(Math.random() < 0.5 ? "jab" : "heavy");
				f.aiTime = 1;
			}
		}
		return inp;
	}
	if (f.down > 0) {
		inp.x = Math.random() < 0.5 ? dir : -dir;
		inp.y = -1;
		return inp;
	}
	if (o.attack === "super" && o.attackTime < 1.2) {
		inp.x = dir;
		if (dist > 3 && f.aiTime <= 0) {
			inp.actions.push("special");
			f.aiTime = 0.4;
		} else if (dist < 3 && f.aiTime <= 0) {
			inp.actions.push("jab");
			f.aiTime = 0.3;
		}
		return inp;
	}
	const danger =
		o.attack && o.attackTime < MOVES[o.attack].start + 0.08 && dist < 3;
	if (danger && Math.random() < dt * (diff === 2 ? 12 : diff === 1 ? 6 : 2)) {
		f.aiGuard = 0.3;
		inp.y = MOVES[o.attack].level === "low" ? 1 : 0;
	}
	if (f.aiGuard > 0) {
		inp.guard = true;
		inp.y = o.attack && MOVES[o.attack].level === "low" ? 1 : 0;
	}
	if (dist > 2.1) inp.x = dir * (dist > 6 ? 1 : 0.8);
	else if (dist < 1 && Math.random() < dt * 2) inp.x = -dir;
	if (f.aiGuard > 0) inp.x = 0;
	if (f.aiTime <= 0) {
		f.aiTime =
			(diff === 0 ? 0.5 : diff === 1 ? 0.28 : 0.13) + Math.random() * 0.35;
		const r = Math.random();
		if (f.stun > 0.1 && f.energy >= 1 && r < 0.3) inp.actions.push("burst");
		else if ((attract || diff > 0) && f.energy >= 2 && dist > 3 && r < 0.17) {
			inp.actions.push("super");
			if (attract) f.invul = 0.8;
		} else if (dist > 4) {
			if (r < 0.45)
				inp.actions.push(f.energy >= 1 && r < 0.18 ? "ex" : "special");
			else if (r < 0.65) inp.actions.push("jump");
			else inp.actions.push("dash");
		} else if (dist < 1.65 && r < 0.18) inp.actions.push("throw");
		else if (o.y > 0.9) {
			inp.y = 1;
			inp.actions.push("special");
		} else if (r < 0.15) {
			inp.y = 0;
			inp.actions.push("special");
		} else if (r < 0.25 && f.energy >= 1) inp.actions.push("ex");
		else if (r < 0.39) inp.actions.push("jump");
		else
			inp.actions.push(
				["jab", "kick", "heavy", "sweep"][Math.floor(Math.random() * 4)],
			);
	}
	if (attract) {
		gain(f, dt * 0.5);
		if (
			Math.sin(G.attract * 0.6 + f.id) > 0.8 &&
			f.energy >= 2 &&
			!f.attack &&
			f.aiTime < 0.2
		)
			inp.actions = ["super"];
	}
	return inp;
}

function knockout(att, def) {
	testStats.knockouts++;
	att.kos++;
	def.deaths++;
	audio.sfx("ko");
	eventFX("heavy", def.x, def.y + 1.4, att.id, "KNOCKOUT!");
	if (G.state === "attract") {
		def.hp = def.maxHp;
		return;
	}
	if (G.mode === "dojo") {
		G.trainRespawn = 1;
		def.hp = 1;
		def.invul = 1;
		def.down = 1;
		def.stun = 1;
		return;
	}
	if (G.net) {
		def.respawn = 2.4;
		def.body.setEnabled(false);
		def.attack = "";
		def.stun = 0;
		def.down = 0;
		if (att.kos >= 5 && G.net.isHost) finishNetwork();
		return;
	}
	if (G.mode === "bonus") {
		G.score += 15000;
		G.roundWinner = 0;
		endRound(0);
		return;
	}
	endRound(G.fighters.indexOf(att));
}
function endRound(winner) {
	if (G.roundEnd > 0) return;
	G.roundWinner = winner;
	G.roundEnd = 3.1;
	G.fighters.forEach((f) => {
		f.guard = false;
		f.attack = "";
	});
	if (G.mode !== "bonus" && winner >= 0) {
		G.wins[winner]++;
		if (winner === 0) G.score += 2000 + Math.round(G.timer) * 50;
	}
	shout(
		G.timer <= 0 ? "TIME!" : "KNOCKOUT!",
		winner >= 0
			? `${G.fighters[winner].d.name} TAKES THE ROUND`

}
function newRound() {
	G.timer = G.mode === "bonus" ? 22 : 75;

		teleport(f, i === 0 ? -4 : 4);

		f.blockStun = 0;

			shout(
				"MAKE A RUCKUS!",

function nextAfterRound() {
	if (G.mode === "bonus") {
		G.bonusDone = true;
		G.arcade = 3;
		G.mode = "arcade";
		startArcadeBout();
		return;
	}
	const won = G.wins[0] >= 2 || G.wins[1] >= 2;
	if (!won) {
		G.round++;
		newRound();
		return;
	}
	if (G.mode === "local") {
		showResults(G.wins[0] >= 2, "local");
		return;
	}
	if (G.wins[0] >= 2) {
		G.bells++;
		G.arcade++;
		eventFX("bell", G.fighters[0].x, 3, 0);
		if (G.arcade >= 7) {
			saveProgress.best = Math.max(saveProgress.best, G.score);
			saveProgress.clears++;
			saveRecord();
			showEnding();
			return;
		}
		showBoutVictory();

async function loadPeer() {

function makePeerAdapter(isHost, me) {
	return {
		me,
		isHost,
		players: G.roomPlayers,
		send(data, opts = {}) {
			if (isHost) {
				for (const [id, c] of G.connections)
					if (c.open && (opts.to == null || opts.to === id))
						c.send({ t: "game", d: data });
			} else {
				const c = G.connections.get(0);
				if (c?.open) c.send({ t: "game", d: data });
			}
		},
		host: 0,
	};
}
async function hostRoom() {
	if (G.hub) return;
	disconnectNet();
	G.roomStatus = "Opening the room…";
	G.roomPlayers = [{ id: 0, name: "Host", color: "#e8443a" }];
	G.roomCode = String(
		(crypto.getRandomValues(new Uint32Array(1))[0] % 900000) + 100000,
	);
	G.net = makePeerAdapter(true, 0);
	renderLobby();
	try {
		await loadPeer();
		const peer = new Peer(`waku-ruckus-7-${G.roomCode}`, { debug: 0 });
		G.peer = peer;
		peer.on("open", () => {
			if (G.peer !== peer) return;
			G.roomStatus = "Room open. Send the code to your friends.";
			renderLobby();
		});
		peer.on("error", (e) => {
			if (G.peer !== peer) return;
			G.roomStatus =
				"Connection problem: " +
				(e.type === "unavailable-id"
					? "This code is in use. Leave and create another room."
					: `${e.type}. Try another network or create a new room.`);
			if (G.state === "lobby") renderLobby();
			else toast(G.roomStatus, 5);
		});
		peer.on("connection", (conn) => {
			const used = new Set(G.roomPlayers.map((p) => p.id));
			const id = [1, 2, 3].find((n) => !used.has(n));
			if (id === undefined || G.state !== "lobby") {
				conn.on("open", () => {
					conn.send({
						t: "reject",
						reason: "This festival is full or already fighting.",
					});
					setTimeout(() => conn.close(), 200);
				});
				return;
			}
			G.connections.set(id, conn);
			const p = {
				id,
				name: `Rival ${id + 1}`,
				color: ["#e8443a", "#3b82f6", "#22c55e", "#f5b700"][id],
			};
			G.roomPlayers.push(p);
			conn.on("open", () => {
				conn.send({
					t: "welcome",
					me: id,
					players: G.roomPlayers,
					code: G.roomCode,
				});
				broadcastLobby();
				audio.sfx("bell");
				renderLobby();
			});
			conn.on("data", (m) => {
				if (m?.t === "game") receiveNet(m.d, id);
			});
			conn.on("close", () => {
				G.connections.delete(id);
				G.roomPlayers = G.roomPlayers.filter((p) => p.id !== id);
				if (G.state === "lobby") {
					broadcastLobby();
					renderLobby();
				} else networkLeave(id);
			});
		});
	} catch (e) {
		G.roomStatus = e.message;
		renderLobby();
	}
}
function broadcastLobby() {
	G.net.players = G.roomPlayers;
	for (const c of G.connections.values())
		if (c.open) c.send({ t: "lobby", players: G.roomPlayers });
}
async function joinRoom() {
	if (G.hub) return;
	const code = G.roomDigits.join("");
	disconnectNet();
	G.roomCode = code;
	G.roomStatus = `Finding room ${code}…`;
	renderJoin();
	try {
		await loadPeer();
		const peer = new Peer(undefined, { debug: 0 });
		G.peer = peer;
		let welcomed = false;
		const timeout = setTimeout(() => {
			if (!welcomed && G.peer === peer) {
				G.roomStatus = "No room answered. Check the code and your connection.";
				renderJoin();
				peer.destroy();
			}
		}, 12000);
		peer.on("open", () => {
			if (G.peer !== peer) return;
			const conn = peer.connect(`waku-ruckus-7-${code}`, { reliable: true });
			G.connections.set(0, conn);
			conn.on("data", (m) => {
				if (m?.t === "reject") {
					clearTimeout(timeout);
					G.roomStatus = m.reason;
					renderJoin();
					return;
				}
				if (m?.t === "welcome") {
					welcomed = true;
					clearTimeout(timeout);
					G.roomPlayers = m.players;
					G.net = makePeerAdapter(false, m.me);
					G.localId = m.me;
					G.roomStatus = "Connected. The host will ring the bell.";
					renderLobby();
				} else if (m?.t === "lobby") {
					G.roomPlayers = m.players;
					if (G.net) G.net.players = m.players;
					if (G.state === "lobby") renderLobby();
				} else if (m?.t === "setup") {
					createNetworkMatch(m.info);
					G.peerStart = m.start;
					G.ended = false;
				} else if (m?.t === "game") receiveNet(m.d, 0);
			});
			conn.on("close", () => {
				if (G.peer !== peer) return;
				clearTimeout(timeout);
				if (G.state === "fight" || G.state === "about") {
					G.ended = true;
					showNetworkResults([], "The host left the festival.");
				} else {
					G.roomStatus = "The host closed this room.";
					G.net = null;
					renderJoin();
				}
			});
		});
		peer.on("error", (e) => {
			if (G.peer !== peer) return;
			clearTimeout(timeout);
			G.roomStatus =
				"Could not join: " +
				e.type +
				". Check the code or try another network.";
			renderJoin();
		});
	} catch (e) {
		G.roomStatus = e.message;
		renderJoin();
	}
}
function startPeerGame() {
	if (!G.net?.isHost || G.roomPlayers.length < 2) return;
	const seed = crypto.getRandomValues(new Uint32Array(1))[0],
		start = Date.now() + 2000,
		info = { players: G.roomPlayers, seed, me: 0, isHost: true };
	for (const [id, c] of G.connections)
		if (c.open)
			c.send({ t: "setup", info: { ...info, me: id, isHost: false }, start });

	G.peerStart = start;
}
function disconnectNet() {
	if (G.peer) {
		const p = G.peer;
		G.peer = null;
		p.destroy();
	}
	G.connections.clear();
	G.net = null;
	G.pendingActions = [];

function createNetworkMatch(info) {

	G.stage = info.seed % 3;
	G.timer = 150;

	G.netSend = 0;
	G.netClock = 0;
	G.netSeq = 0;

		const f = createFighter(
			((info.seed % 7) + p.id * 2) % 7,
			p.id,
			players.length === 1
				? -4
				: -7 + (14 * i) / Math.max(1, players.length - 1),
			false,
			p.name,
		);
		f.energy = 3;
	});
	if (players.length === 1)
		createFighter((info.seed + 3) % 7, 100, 4, true, "FESTIVAL RIVAL");

	shout("THE BELLS ARE READY", "FIRST TO FIVE KNOCKOUTS", 1.4);

function rounded(v) {
	return Math.round(v * 100) / 100;
}
function packFighter(f) {
	return [
		f.id,
		rounded(f.x),
		rounded(f.y),
		rounded(f.vx),
		rounded(f.vy),
		Math.round(f.hp),
		rounded(f.energy),
		f.facing,
		f.attack,
		rounded(f.attackTime),
		rounded(f.stun),
		rounded(f.down),
		rounded(f.invul),
		rounded(f.burst),
		f.kos,
		rounded(f.respawn),
		Math.round(f.totalDamage),
		f.guard ? 1 : 0,
		f.crouch ? 1 : 0,
	];
}
function applyFighter(a) {
	const f = G.fighters.find((f) => f.id === a[0]);
	if (!f) return;
	const own = f.id === G.localId;
	f.hp = a[5];
	f.energy = a[6];
	f.stun = a[10];
	f.blockStun = a[17] && f.stun > 0 ? f.stun + 0.03 : 0;
	f.down = a[11];
	f.invul = a[12];
	f.burst = a[13];
	f.kos = a[14];
	f.respawn = a[15];
	f.body.setEnabled(f.respawn <= 0 && !f.departed);
	f.totalDamage = a[16];
	if (!own) {
		f.x = a[1];
		f.y = a[2];
		f.vx = a[3];
		f.vy = a[4];
		f.facing = a[7];
		f.attack = a[8];
		f.attackTime = a[9];
		f.guard = !!a[17];
		f.crouch = !!a[18];
		f.body.setTranslation({ x: f.x, y: f.y + 1.015, z: 0 }, true);
		setMotion(f, 0, 0);
	} else if (
		f.stun > 0.1 ||
		f.down > 0 ||
		f.respawn > 0 ||
		Math.abs(f.x - a[1]) > 3
	) {
		f.x = a[1];
		f.y = a[2];
		f.body.setTranslation({ x: f.x, y: f.y + 1.015, z: 0 }, true);
		setMotion(f, a[3], a[4]);
		f.attack = a[8];
		f.attackTime = a[9];
	}
}
function receiveNet(data, from) {
	if (!data || !G.net) return;
	if (data.t === "p" && G.net.isHost) {
		const f = G.fighters.find((f) => f.id === from);
		if (
			!f ||
			from === G.localId ||
			f.cpu ||
			!Array.isArray(data.p) ||
			!Number.isFinite(data.at)
		)
			return;
		if (data.at <= (netLastAt.get(from) ?? -Infinity)) return;
		netLastAt.set(from, data.at);
		f.remoteInput = {
			x: clamp(Number(data.x) || 0, -1, 1),
			y: clamp(Number(data.y) || 0, -1, 1),
			guard: !!data.g,
			actions: [],
		};
		for (const a of data.a || []) {
			if (
				a[0] > f.seq &&
				typeof a[1] === "string" &&
				[
					"jump",
					"jab",
					"kick",
					"heavy",
					"sweep",
					"special",
					"ex",
					"throw",
					"dash",
					"burst",
					"super",
				].includes(a[1])
			) {
				f.remoteActions ??= [];
				f.remoteActions.push(a[1]);
				f.seq = a[0];
			}
		}
		if (
			f.stun <= 0 &&
			f.down <= 0 &&
			f.respawn <= 0 &&
			data.p.every(Number.isFinite)
		) {
			const [x, y, vx, vy] = data.p;
			f.body.setTranslation(
				{ x: clamp(x, -10.8, 10.8), y: clamp(y, 0, 12) + 1.015, z: 0 },
				true,
			);
			setMotion(f, clamp(vx, -20, 20), clamp(vy, -20, 20));
		}
	} else if (
		data.t === "s" &&
		!G.net.isHost &&
		from === (G.hub ? AIHub.host : 0)
	) {
		if (data.at <= G.lastSnapshot) return;
		G.lastSnapshot = data.at;
		G.timer = data.time;
		for (const a of data.f || []) applyFighter(a);
		for (const e of data.fx || []) {
			if (e.id > G.lastFxSeen) {
				playFX(e);
				G.lastFxSeen = e.id;
			}
		}
		const incoming = new Set();
		for (const a of data.p || []) {
			incoming.add(a[0]);
			let p = G.projectiles.find((p) => p.id === a[0]);
			if (!p) {
				const mesh = new THREE.Group();
				shape(mesh, "oct", ROSTER[a[2]].accent, 0, 0, 0, 0.3, 0.3, 0.3);
				shape(mesh, "torus", C.paper, 0, 0, 0, 0.43, 0.43, 0.43, false);
				fxRoot.add(mesh);
				p = {
					id: a[0],
					owner: a[1],
					index: a[2],
					mesh,
					x: a[3],
					y: a[4],
					vx: a[5],
					vy: 0,
					life: 0.5,
					delay: 0,
					kind: "star",
				};
				G.projectiles.push(p);
			}
			p.x = a[3];
			p.y = a[4];
			p.vx = a[5];
			p.life = 0.5;
		}
		for (let i = G.projectiles.length - 1; i >= 0; i--)
			if (!incoming.has(G.projectiles[i].id)) {
				fxRoot.remove(G.projectiles[i].mesh);
				G.projectiles.splice(i, 1);
			}
	} else if (data.t === "finish" && !G.net.isHost) {
		G.ended = true;
		showNetworkResults(
			data.standings || [],
			data.reason || "The final bell has rung.",
		);
	} else if (data.t === "left") {
		const f = G.fighters.find((f) => f.id === data.id);
		if (f) {
			f.hp = 0;
			f.respawn = 999;
			f.departed = true;
			f.body.setEnabled(false);
			f.model.root.visible = false;
		}
		buildHUD();
	}
}
function networkTick(dt, input) {
	if (!G.net || G.ended) return;
	G.netSend += dt;
	if (G.netSend < 1 / 15) return;
	G.netSend %= 1 / 15;
	const at = G.hub ? AIHub.time() : Date.now() - G.peerStart;
	if (G.net.isHost) {
		G.net.send(
			{
				t: "s",
				at: rounded(at),
				time: rounded(G.timer),
				f: G.fighters.map(packFighter),
				p: G.projectiles
					.slice(-12)
					.map((p) => [
						p.id,
						p.owner,
						p.index,
						rounded(p.x),
						rounded(p.y),
						rounded(p.vx),
					]),
				fx: G.fxEvents.slice(-6),
			},
			{ reliable: false },
		);
	} else {
		const f = G.fighters.find((f) => f.id === G.localId);
		if (f)
			G.net.send(
				{
					t: "p",
					at: rounded(at),
					x: input.x,
					y: input.y,
					g: input.guard,
					p: [rounded(f.x), rounded(f.y), rounded(f.vx), rounded(f.vy)],
					a: G.pendingActions.slice(-12),
				},
				{ to: G.hub ? AIHub.host : 0, reliable: false },
			);
	}
}
function finishNetwork() {

			G.net.players.some((p) => p.id === f.id),
		),
		sorted = [...humans].sort(
			(a, b) => b.kos - a.kos || b.totalDamage - a.totalDamage,
		),
		standings = sorted.map((f) => [f.id]),
		scores = Object.fromEntries(
			sorted.map((f) => [f.id, f.kos * 100000 + Math.round(f.totalDamage)]),
		),
		stats = Object.fromEntries(
			sorted.map((f) => [
				f.id,
				{
					Knockouts: f.kos,
					Damage: Math.round(f.totalDamage),
					Deaths: f.deaths,
				},

		);

			scores,

function networkLeave(id) {

async function connectHub() {

		me: info.me,
		isHost: info.isHost,
		players: info.players,
		send: (d, o) => AIHub.send(d, o),
	};

					? "The host left the festival."
					: "The hub has ended this round.",
			);

	});
	createNetworkMatch(info);
	AIHub.ready();
}

		const hemi = new THREE.HemisphereLight(0xe7ffff, 0xb58b79, 1.3);
		scene.add(hemi);
		keyLight = new THREE.DirectionalLight(0xfff1d2, 2.6);
		keyLight.position.set(-8, 14, 9);
		keyLight.castShadow = true;
		keyLight.shadow.mapSize.set(2048, 2048);
		Object.assign(keyLight.shadow.camera, {
			left: -19,
			right: 19,
			top: 17,
			bottom: -12,
			near: 1,
			far: 55,
		});
		keyLight.shadow.normalBias = 0.04;
		keyLight.shadow.bias = -0.0005;
		scene.add(keyLight);
		scene.add(new THREE.AmbientLight(0xffffff, 0.3));
		fxRoot = new THREE.Group();
		scene.add(fxRoot);
		$("loadStatus").textContent = "Teaching gravity some manners…";
		await RAPIER.init();
		world = new RAPIER.World({ x: 0, y: -28, z: 0 });
		world.timestep = 1 / 60;
		world.createCollider(
			RAPIER.ColliderDesc.cuboid(14, 0.15, 6)
				.setTranslation(0, -0.15, 0)
				.setFriction(0)
				.setCollisionGroups(0x00010002),
		);
		for (const x of [-11.45, 11.45])
			world.createCollider(
				RAPIER.ColliderDesc.cuboid(0.2, 10, 4)
					.setTranslation(x, 9, 0)
					.setFriction(0)
					.setCollisionGroups(0x00010002),
			);
		if (sessionConnect) await connectHub();
		else showTitle();
		await renderer.compileAsync(scene, camera);
		ready = true;
		lastFrame = performance.now();
		$("loading").hidden = true;
		const touchOnly =
			matchMedia("(pointer:coarse)").matches &&
			!(navigator.getGamepads?.() || []).some((p) => p);
		$("touchNotice").hidden = !touchOnly;
		requestAnimationFrame(frame);
		setInterval(() => {
			if (document.hidden && G.net && !G.ended) tick(performance.now());
		}, 50);
		window.WakuRuckus = {
			version: BUILD,
			roster: ROSTER,
			stages: STAGES,
			moves: MOVES,
			lessons: LESSONS,
			inspect: () => ({
				state: G.state,
				mode: G.mode,
				stage: G.stage,
				round: G.round,
				timer: G.timer,
				dojo: G.dojo,
				bells: G.bells,
				score: G.score,
				stats: { ...testStats },
				fighters: G.fighters.map((f) => ({
					id: f.id,
					char: f.d.id,
					x: rounded(f.x),
					y: rounded(f.y),
					hp: f.hp,
					energy: f.energy,
					attack: f.attack,
					stun: f.stun,
					down: f.down,
					kos: f.kos,
				})),
				webgpu: renderer.backend.isWebGPUBackend,
				rapier: RAPIER.version(),
			}),
			design: {
				setFighter: (id, patch) => Object.assign(ROSTER[id], patch),
				setMove: (id, patch) => Object.assign(MOVES[id], patch),
			},
		};
		if (QA)
			window.WakuRuckus.qa = {
				G,
				settings,
				command,
				beginMove,
				hit,
				teleport,
				setMotion,
				advance,
				emptyInput,
				performAction,
				showTitle,
				openSelect,
				startDojo,
				startLocal,
				beginAttract,
				cycleAttract,
				endRound,
				nextAfterRound,
				startArcadeBout,
				finishNetwork,
				renderer,
				scene,
				camera,
				world,
				renderOnce: () => {
					drawEnabled = true;
					renderFrame(1 / 60);
					drawEnabled = false;
				},
			};
	} catch (error) {
		fatal(error);
	}
}
boot();
</script>
</body>
</html>
