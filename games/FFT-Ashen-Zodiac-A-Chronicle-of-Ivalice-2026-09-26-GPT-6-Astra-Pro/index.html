<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#182838" />
    <meta
      name="description"
      content="Ashen Zodiac. A brick-built tactical chronicle inspired by Final Fantasy Tactics for PlayStation."
    />
    <title>Ashen Zodiac · A Chronicle of Ivalice</title>
    <!-- The shared 3D stack. Every 3D game carries this block unchanged. -->
    <script type="importmap">
      {
        "imports": {
          "three": "/lib/three/three.webgpu.js",
          "three/webgpu": "/lib/three/three.webgpu.js",
          "three/tsl": "/lib/three/three.tsl.js",
          "three/addons/": "/lib/three/addons/",
          "kit/": "/lib/kit/"
        }
      }
    </script>
    <link rel="modulepreload" href="/lib/three/three.core.js" />
    <link rel="modulepreload" href="/lib/three/three.webgpu.js" />
    <link rel="preload" href="./data/catalog.json" as="fetch" type="application/json" crossorigin />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="stage" aria-label="3D tactical battlefield"></div>
    <main id="app">
      <section class="loading">
        <span class="crest">✧</span>
        <h1>Ashen Zodiac</h1>
        <p>Opening the chronicle…</p>
      </section>
    </main>
    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="diagnostics">Preparing renderer…</div>
    <input id="save-file" type="file" accept="application/json,.json" hidden />
    <script type="module" src="./main.js"></script>
  </body>
</html>
