<head>

<title>Greywater</title>
<style>

  :root {
    color-scheme: dark;
    --ground: #0b0d12;        /* the dark behind the canvas: harbour night */
    --ink: #e9e4d6;           /* chalk white of the in-game type */
    --dim: #8a968f;
    --teal: #4fc0bc;          /* Vance Livery teal */
    --amber: #f0c84a;         /* sodium lamp, mission yellow */
    --panel: #151920;
    --ui: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; overscroll-behavior: none; }

  #stage { position: fixed; inset: 0; background: var(--ground); }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; background: #000; touch-action: none; outline: none; cursor: crosshair; }
  #hint { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); padding: 7px 12px; background: var(--panel); border: 1px solid var(--teal); color: var(--ink); letter-spacing: .04em; text-transform: uppercase; font-size: 11px; pointer-events: none; z-index: 5; }
  #hint b { color: var(--amber); font-weight: 600; }
</style>

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

      made = spawnCar('cab', x, y, L.heading, {}); made.npc = npcDriver(); made.body.vx = L.dx * 80; made.body.vy = L.dy * 80;
    }
    if (!made) { G.dialog.say([['cabbie', 'Nothing free. Try again in a minute.']], { phone: true }); return; }
    G.dialog.say([['cabbie', 'Harbour Cabs. A car is on its way. Stand where it can see you.']], { phone: true });
    made.keep = true; made.forPlayer = true; this.car = made; this.state = 'coming'; this.t = 50; this.comeT = 0; this.hopped = false;
    this.send(made, pp);
  },
  send(c, pp) { const n = ROADNET.nearest(pp.x, pp.y); aiGoto(c, n.x, n.y, { speed: 140, stopDist: 30, onArrive: k => { k.ai = { mode: 'hold' }; if (this.car === k) { this.state = 'waiting'; this.t = 30; snd('horn', k.x, k.y, .6); } } }); },
  hail(car) { if (this.car && this.car !== car) this.release(); car.forPlayer = true; car.keep = true; car.ai = { mode: 'hold' }; this.car = car; this.state = 'waiting'; this.t = 25; say(car, pick(BARKS.cabbie), 2.4); },
  release() { const c = this.car; if (c && !c.dead && !c.wreck && c.npc) { c.forPlayer = false; c.keep = false; const n = ROADNET.nearest(c.x, c.y, c.a); aiTraffic(c, n.lane, n.s); } this.car = null; this.ride = null; this.state = null; },

/* driving a cab for money: a fare, a clock, a tip for a smooth ride */

  toggle() { if (this.on) this.stop('Off the clock.'); else { this.on = true; this.n = 0; this.next(); HUD.toast('On the clock. Fares pay by the block and tip by the clock.', MARK.t); } },
  stop(msg) { this.on = false; if (this.ped && !this.ped.gone) { if (this.ped.car) leaveCar(this.ped, true); this.ped.keep = false; this.ped.brain = 'civ'; this.ped.state = 'walk'; } this.ped = null; this.st = null; HUD.timer = null; if (msg) HUD.toast(msg); HUD.setObjective(''); },
  spot(minD, from) { for (let k = 0; k < 40; k++) { const r = pick(world.rings.filter(q => q.name === 'block' || q.name === 'boardwalk')), q = ringPoint(r, rand(r.len)), n = ROADNET.nearest(q[0], q[1]); if (n.d > 60) continue; if (hyp(q[0] - from.x, q[1] - from.y) < minD) continue; return { x: q[0], y: q[1], kx: n.x, ky: n.y, ring: r }; } return null; },
  next() {
    const pp = playerPos(), s = this.spot(260, pp); if (!s) { this.stop('No fares about.'); return; }
    this.pick = s; this.st = 'pickup'; const p = spawnPed({ x: s.x, y: s.y, keep: true }); p.brain = 'script'; p.task = { type: 'wait', pose: 'wave', look: G.player }; this.ped = p;
    HUD.setObjective('Pick up the ~b~fare~w~.');
  },
  update(dt) {

  sprint: ['ShiftLeft', 'ShiftRight', 'Pad0'], handbrake: ['Space', 'Pad0'], dodge: ['Space', 'Pad1'], enter: ['KeyF', 'Pad3'], use: ['KeyE', 'Pad2'], cover: ['KeyQ', 'Pad4'], reload: ['KeyR', 'Pad11'],
  phone: ['ArrowUp', 'KeyT', 'Pad12'], phoneUp: ['ArrowUp', 'Pad12'], phoneDown: ['ArrowDown', 'Pad13'], phoneLeft: ['ArrowLeft', 'Pad14'], phoneRight: ['ArrowRight', 'Pad15'], phoneClose: ['KeyT'],
  confirm: ['Enter', 'NumpadEnter', 'Pad0'], cancel: ['Backspace', 'Pad1'], pause: ['Escape', 'KeyP', 'Pad9'], map: ['KeyM', 'Pad8'], start: ['Enter', 'NumpadEnter', 'Pad9', 'Mouse0'],
  nextW: ['WheelDown', 'BracketRight'], prevW: ['WheelUp', 'BracketLeft'], radioNext: ['KeyX'], radioPrev: ['KeyZ'], horn: ['KeyH', 'Pad10'], mute: ['KeyN'],
  w1: ['Digit1'], w2: ['Digit2'], w3: ['Digit3'], w4: ['Digit4'], w5: ['Digit5'], w6: ['Digit6']

// the frame: about 360 pixels on the short side, whatever the shape. A phone held upright gets a tall picture, held

game = new E.Game({ view: VIEW, minH: 300, minW: 480, maxW: 880, maxH: 405, portrait: { minW: 330, minH: 560, maxW: 520, maxH: 920 }, bg: '#22323c', input: KEYS });
game.cam.smooth = .16; game.fadeTime = .3;
game.cam.bounds = v => { const a = v.p(0, 0, 0), b = v.p(WORLD_W, WORLD_H, 0); return { x0: a[0], y0: a[1] - 60, x1: b[0], y1: b[1] }; };
game.lights.dark = [9, 11, 30]; game.lights.darkness = .86; game.lights.tint = .22; game.lights.res = 2;
game.r.glowMask = false;   // glows are drawn over the dark without a cut mask (the mask costs more than the whole rest of a night frame)
RADIO.init();
TOUCH.init();

/* ---- time of day and weather ---- */
function nightAt(h) { h = ((h % 24) + 24) % 24; if (h >= 7.2 && h <= 17.6) return 0; if (h > 17.6 && h < 20.4) return (h - 17.6) / 2.8; if (h >= 20.4 || h <= 4.8) return 1; return 1 - (h - 4.8) / 2.4; }
function updateEnv(dt) {
  G.clock += dt / 60; if (G.clock >= 24) { G.clock -= 24; G.day++; }
  G.night = nightAt(G.clock); G.env.night = G.night; G.env.t = G.time;
  G.weatherT -= dt; if (G.weatherT <= 0) { G.weatherT = rand(100, 220); G.rainTarget = G.forceRain !== undefined ? G.forceRain : chance(.32) ? rand(.5, 1) : 0; }
  G.rain = approach(G.rain, G.rainTarget, dt * .04);
  if (G.rain > .6 && chance(dt * .02)) { game.flash('#cfe0ff', .18, .5); snd('thunder', null, null, .6); }
}
/** the colour of the hour, laid over the picture */
function gradeColor() {
  const h = G.clock, n = G.night;
  if (h > 4.6 && h < 8) { const u = 1 - Math.abs(h - 6.3) / 1.7; return ['#ffc8a8', clamp(u, 0, 1) * .34]; }
  if (h > 16.6 && h < 20.6) { const u = 1 - Math.abs(h - 18.6) / 2; return ['#ff9c62', clamp(u, 0, 1) * .4]; }
  if (n < .1) return ['#f4e6cc', .1];

}

/* ---- the camera ---- */
function updateCamera(dt) {
  const p = G.player, o = p.car ? p.car.body : p; let lx = 0, ly = 0;
  if (G.camTarget) { G.cam.lx = lerp(G.cam.lx, 0, dt * 4); G.cam.ly = lerp(G.cam.ly, 0, dt * 4); game.focus(G.camTarget.x, G.camTarget.y, 8); G.listener.x = G.camTarget.x; G.listener.y = G.camTarget.y; return; }
  if (p.car) { lx = clamp(o.vx * .46, -120, 120); ly = clamp(o.vy * .5, -92, 92); }
  else if (p.aiming && !G.aim.pad) { lx = clamp((G.aim.x - p.x) * .28, -60, 60); ly = clamp((G.aim.y - p.y) * .28, -46, 46); }
  else { lx = p.vx * .16; ly = p.vy * .16; }
  G.cam.lx = lerp(G.cam.lx, lx, dt * 2.6); G.cam.ly = lerp(G.cam.ly, ly, dt * 2.6);
  game.cam.offset = TOUCH.on && TOUCH.lay && TOUCH.lay.portrait ? [0, -Math.round(game.H * .08)] : null;   // upright phone: keep Jonah clear of the thumbs
  game.focus(o.x + G.cam.lx, o.y + G.cam.ly, 8); G.listener.x = o.x; G.listener.y = o.y;
}

/* ---- fades and the places you wake up ---- */
function fadeThen(fn, hold = .25) { if (G.fadeFn) return; G.fadeTo = 1; G.fadeFn = fn; G.fadeHold = hold; }
function placePlayer(x, y, facing) { const p = G.player; if (p.car) leaveCar(p, true); p.x = x; p.y = y; p.vx = p.vy = 0; if (facing !== undefined) p.facing = facing; p.down = 0; p.downT = 0; p.dead = false; p.busting = 0; p.cover = null; p.hidden = false; p.crouch = false; p.enter = null; game.cam.snap = true; G.cam.lx = G.cam.ly = 0; }
function onPlayerDeath(src, cause) { if (G.mode !== 'play' && G.mode !== 'cutscene') return; G.mode = 'dead'; G.modeT = 0; G.stats.died++; G.phone.close(); G.dialog.clear(); snd('fail', null, null, .7); void src; void cause; }
function respawn(kind) {
  const p = G.player, where = kind === 'dead' ? world.poi.hospital.spawn : world.poi.police.spawn;
  for (const c of G.cars) if (c.spec.police && !c.keep) { c.siren = false; }
  WANTED.clear(true);
  for (let i = G.peds.length - 1; i >= 0; i--) { const q = G.peds[i]; if (q.kind === 'cop' && !q.keep) removePed(q); }
  placePlayer(where.x, where.y, Math.PI / 2); p.hp = p.hpMax; p.armor = 0; p.deadT = 0;
  const fee = Math.min(kind === 'dead' ? 250 : 400, Math.round(G.cash * .1)); if (fee > 0) addCash(-fee, kind);
  if (kind === 'busted') { for (const w in p.inv) if (w !== 'fist') delete p.inv[w]; p.setWeapon('fist'); }
  G.clock = (G.clock + (kind === 'dead' ? 5 : 3)) % 24; G.mode = 'play'; game.timeScale = 1;
  HUD.toast(kind === 'dead' ? "St. Brendan's patched you up." + (fee ? '  -' + fmtMoney(fee) : '') : 'Released. They kept your weapons.' + (fee ? '  -' + fmtMoney(fee) : ''));
  if (MISSIONS.cur) MISSIONS.fail(kind === 'dead' ? 'You were killed.' : 'You were arrested.');

/* ---- saving (the browser may refuse; the game carries on regardless) ---- */
const SAVE_KEY = 'greywater:save1';
function saveGame() {
  const p = G.player, data = { v: 1, cash: G.cash, clock: G.clock, day: G.day, flags: G.flags, stats: G.stats, opts: G.opts, inv: Object.keys(p.inv), ammo: p.ammo, clip: p.clip, armor: p.armor, weapon: p.weapon, contacts: G.phone.contacts, texts: G.phone.texts.slice(0, 12).map(t => ({ from: t.from, body: t.body, read: true })), tokens: world.tokens.map(t => t.got ? 1 : 0), radio: RADIO.st };
  const ok = E.store.set(SAVE_KEY, data); try { G.memSave = JSON.parse(JSON.stringify(data)); } catch (e) { /* keep the old one */ }
  return ok;
}
function loadSave() { return E.store.get(SAVE_KEY, null) || G.memSave || null; }
function applySave(d) {
  const p = G.player; G.cash = d.cash; G.clock = d.clock; G.day = d.day || 1; G.flags = d.flags || {}; Object.assign(G.stats, d.stats || {}); Object.assign(G.opts, d.opts || {});
  p.inv = {}; for (const w of d.inv || ['fist']) p.inv[w] = true; p.inv.fist = true; p.ammo = d.ammo || {}; p.clip = d.clip || {}; p.armor = d.armor || 0; p.setWeapon(p.inv[d.weapon] ? d.weapon : 'fist');

}

/* ---- the set-up of a fresh city ---- */
function resetCity() {
  G.cars.length = 0; G.peds.length = 0; G.pickups.length = 0; G.skids.length = 0; G.stains.length = 0; G.tracers.length = 0; G.jets.length = 0; G.bubbles.length = 0;

  for (const v of world.vendors) { const q = spawnPed({ x: v.x - 14, y: v.y - 4, look: Object.assign({}, LOOKS.vendor, { colors: Object.assign({}, LOOKS.vendor.colors, { skin: pick(SKINS) }) }), keep: true, kind: 'civ', brain: 'civ' }); q.state = 'vendor'; q.vendor = v; q.invincible = false; v.ped = q; }

function newGame() {

  for (const t of world.tokens) t.got = false; G.phone.contacts = []; G.phone.texts = []; G.phone.unread = 0;

function continueGame() {

  resetCity(); MISSIONS.reset(); applySave(d);
  const s = world.poi.safehouse.door; placePlayer(s.x, s.y + 10, Math.PI / 2);
  G.mode = 'play'; HUD.hidden = false; G.camTarget = null; G.rain = 0; G.rainTarget = 0;
  if (G.flags.done_m3) { /* Deke stays reachable */ }

/* ---- prompts: what E (or F) would do right now ---- */
function findPrompt() {
  const p = G.player; if (p.dead || G.lock) return null;
  const mp = MISSIONS.prompt(); if (mp) return mp;
  if (p.car) {
    if (p.seat !== 0 && TAXI.ride) return { key: 'ENT', text: 'Skip the trip', act: 'confirm', fn: () => TAXI.skip() };
    return null;
  }
  const act = ACTIVITY_PROMPT(p); if (act) return act;
  const car = nearestCar(p, 30);
  if (car) {
    if (car.forPlayer && car.npc) return { key: 'F', text: 'Ride in the cab', act: 'enterAlt', fn: () => enterCar(p, car, 2) };
    if (car.spec.cab && car.npc && car.speed < 40 && !WANTED.stars) return { key: 'E', text: 'Hail the cab  (F: take it)', fn: () => TAXI.hail(car) };
    return { key: 'F', text: (car.npc || (car.driver && car.driver !== p) ? 'Take the ' : car.locked ? 'Break into the ' : 'Drive the ') + car.name, passive: true };
  }
  return null;
}
function ACTIVITY_PROMPT(p) {
  for (const v of world.vendors) if (v.ped && !v.ped.dead && hyp(v.x - p.x, v.y - p.y) < 24) return { key: 'E', text: p.hp >= p.hpMax ? v.name + ': not hungry' : v.name + ' ($5)', fn: () => { if (p.hp >= p.hpMax) return; if (G.cash < 5) { say(v.ped, 'No money, no eel.', 2); return; } addCash(-5, 'food'); p.hp = p.hpMax; snd('heal', null, null, .6); bark(v.ped, 'vendor', 1, 2.4); } };
  const s = world.poi.safehouse.door; if (G.flags.safehouse && hyp(s.x - p.x, s.y - p.y) < 16 && !MISSIONS.cur) return { key: 'E', text: 'Your room: sleep and save', fn: () => sleepAndSave() };
  if (DEALER.ped && !DEALER.ped.gone && hyp(DEALER.ped.x - p.x, DEALER.ped.y - p.y) < 26) return { key: 'E', text: 'See what Deke has', fn: () => { G.phone.show('shop'); } };
  if (G.flags.done_m3 && !MISSIONS.cur) { const d = world.poi.deke; if (hyp(d.x - p.x, d.y - p.y) < 22) return { key: 'E', text: "Deke's counter", fn: () => G.phone.show('shop') }; }
  return null;
}

  G.lock = true;

}
function tryRespray() {
  const p = G.player, car = p.car; if (!car || p.seat !== 0 || G.lock || G.mode !== 'play') return;
