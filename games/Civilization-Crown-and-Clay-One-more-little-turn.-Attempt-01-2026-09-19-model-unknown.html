class Realm {
  constructor(seed = 4927, difficulty = 'standard') {
    this.seed = seed;
    this.difficulty = difficulty;
    this.turn = 1;
    this.nextId = 1;
    this.tiles = [];
    this.cities = [];
    this.units = [];
    this.notes = [];
    this.seen = Array(W * H).fill(false);
    this.visible = Array(W * H).fill(false);
    this.outcome = null;
    this.sandbox = false;
    this.pendingEvent = null;
    this.eventId = null;
    this.eventsDone = [];
    this.tidingsSeen = [];
    this.recorded = false;
    this.stats = { ruins: 0, battles: 0, founded: 1, improved: 0 };
    this.nations = [0, 1, 2].map((i) => ({ gold: i ? 45 : 55, culture: 0, science: 0, techs: [], rp: {}, research: i === 2 ? 'mining' : 'pottery' }));
    this.diplomacy = [null, { met: false, war: false, trade: false, relation: 45, truce: 0 }, { met: false, war: false, trade: false, relation: 10, truce: 0 }];
    const r = rng(seed);
    for (let z = 0; z < H; z++)
      for (let x = 0; x < W; x++) {
        const shape = Math.min(((x - 6.5) / 6.6) ** 2 + ((z - 8.7) / 6.5) ** 2, ((x - 12.5) / 5.9) ** 2 + ((z - 6.5) / 5.5) ** 2);
        let type = shape < 1 + (r() - 0.5) * 0.23 ? 'grass' : 'water';
        if (type !== 'water') {
          const v = r();
          type = v < 0.24 ? 'forest' : v < 0.4 ? 'plain' : v < 0.51 ? 'hill' : v < 0.56 ? 'mountain' : v < 0.6 && x > 10 ? 'sand' : 'grass';
        }
        this.tiles.push({ x, z, type, owner: -1, improvement: null, resource: null, ruin: false, camp: false });
      }
    // One connected continent. The long river is a visual and economic feature, not a sea barrier.
    const capitals = [
      { x: 5, z: 10 },
      { x: 13, z: 4 },
      { x: 15, z: 11 },
    ];
    for (const c of capitals)
      for (let dz = -1; dz <= 1; dz++)
        for (let dx = -1; dx <= 1; dx++) {
          const t = this.tile(c.x + dx, c.z + dz);
          if (t) t.type = Math.abs(dx) + Math.abs(dz) === 0 ? 'grass' : r() < 0.5 ? 'plain' : 'grass';
        }
    for (let x = 5; x <= 15; x++) this.tile(x, 9).type = x % 3 === 0 ? 'plain' : 'grass';
    for (let z = 4; z <= 11; z++) this.tile(12, z).type = z % 3 === 0 ? 'forest' : 'grass';
    for (let x = 6; x <= 12; x++) this.tile(x, 5).type = 'grass';
    const set = (x, z, type, res) => {
      const t = this.tile(x, z);
      t.type = type;
      t.resource = res;
    };
    set(4, 10, 'plain', 'wheat');
    set(6, 10, 'hill', 'ore');
    set(5, 9, 'grass', 'wheat');
    set(4, 8, 'forest', null);
    set(7, 9, 'grass', null);
    set(7, 10, 'plain', 'wheat');
    set(6, 7, 'forest', null);
    set(8, 6, 'hill', 'ore');
    for (const t of this.tiles) {
      if (t.type === 'water' || t.type === 'mountain') continue;
      if (!t.resource && r() < 0.09) t.resource = t.type === 'hill' ? 'ore' : r() < 0.5 ? 'wheat' : 'gold';
      t.river = t.x === Math.round(8.2 + Math.sin(t.z * 0.57) * 1.25) && t.z > 2 && t.z < 14;
    }
    for (const [x, z] of [
      [7, 7],
      [3, 6],
      [10, 4],
      [10, 12],
      [15, 7],
      [17, 5],
    ]) {
      const t = this.tile(x, z);
      t.type = 'grass';
      t.ruin = true;
      t.resource = null;
    }
    for (const [x, z] of [
      [10, 10],
      [11, 2],
    ]) {
      const t = this.tile(x, z);
      t.type = 'plain';
      t.camp = true;
      t.ruin = false;
    }
    this.addCity(0, 5, 10, 'Aster', true);
    this.addCity(1, 13, 4, 'Mossgate', true);
    this.addCity(2, 15, 11, 'Cinderhold', true);
    this.cities[0].pop = 2;
    this.cities[0].buildings = ['monument'];

class Layer {

      b.n = 0;

    for (const p of prims) {
      const b = this.batch(p);
      b.write(b.n++, p, offset ? offset(p) : null);
    }
    for (const b of this.batches.values()) b.commit();

    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const notes =
      kind === 'discover'
        ? [392, 493.88, 587.33, 783.99]

function drawMinimap() {
  const cv = $('minimap'),
    c = cv.getContext('2d'),
    w = cv.width,
    h = cv.height,
    sx = w / W,
    sz = h / H;
  c.fillStyle = '#82b0ac';
  c.fillRect(0, 0, w, h);
  for (const t of game.tiles) {
    if (t.type === 'water') continue;
    c.fillStyle = !game.seen[key(t.x, t.z)] ? '#b5c5b3' : t.owner >= 0 ? mixColor(PALETTE[t.type], CIV[t.owner].color, 0.55) : PALETTE[t.type];
    c.fillRect(t.x * sx, t.z * sz, sx + 0.5, sz + 0.5);
  }
  for (const city of game.cities) {
    if (!game.seen[key(city.x, city.z)]) continue;
    c.fillStyle = city.owner === 0 ? '#fff1c5' : CIV[city.owner].dark;
    c.fillRect((city.x + 0.25) * sx, (city.z + 0.25) * sz, sx * 0.5, sz * 0.5);
  }
  c.fillStyle = '#fff4cc';
  for (const u of game.units) {
    if (u.owner !== 0) continue;
    c.beginPath();
    c.arc((u.x + 0.5) * sx, (u.z + 0.5) * sz, 2.1, 0, 7);
    c.fill();
  }
  if (!view) return;
  const bounds = [
    [0, 0],
    [view.w, 0],
    [view.w, view.h],
    [0, view.h],
  ].map((p) => view.unproject(...p));
  c.strokeStyle = '#f9f9d4b0';
  c.lineWidth = 2;
  c.beginPath();
  bounds.forEach((p, i) => (i ? c.lineTo((p.x / TILE + 0.5) * sx, (p.z / TILE + 0.5) * sz) : c.moveTo((p.x / TILE + 0.5) * sx, (p.z / TILE + 0.5) * sz)));

}

      refresh();

      (important.length ? important : turnMessages).slice(0, 2).forEach((n) => toast(n.text, n.icon));

    refresh();
    toast('Your chronicle is restored.', 'save');
    if (game.pendingEvent && !game.outcome) showEvent();
    if (game.outcome && !game.sandbox) showOutcome();
  } catch (err) {
    toast(err.message || 'This save could not be read.', 'info', 6500);
  }
  e.target.value = '';
});
let miniDrag = false;
$('minimap').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  miniDrag = true;
  try {
    e.currentTarget.setPointerCapture(e.pointerId);
  } catch {
    /* synthetic */
  }
  miniFocus(e.clientX, e.clientY);
});
$('minimap').addEventListener('pointermove', (e) => {
  if (miniDrag) miniFocus(e.clientX, e.clientY);
});
for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) $('minimap').addEventListener(t, () => (miniDrag = false));
// Keep keyboard focus inside an open panel.
addEventListener('keydown', (e) => {
  if (e.key !== 'Tab' || !dialog) return;
  const focusable = [...$('dialogRoot').querySelectorAll('button:not(:disabled),select,input')];
  if (!focusable.length) return;
  const i = focusable.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0) {
    e.preventDefault();
    focusable.at(-1).focus();
  } else if (!e.shiftKey && (i === focusable.length - 1 || i < 0)) {
    e.preventDefault();
    focusable[0].focus();
  }
});
addEventListener('pointerdown', unlockAudio, true);
addEventListener('keydown', unlockAudio, true);

try {
  const p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
  prefs.sound = p?.sound === true;
} catch {
  /* defaults */
}
try {
  const r = JSON.parse(localStorage.getItem(RECORD_KEY) || 'null');
  if (r && typeof r === 'object') {
    records.played = Number.isInteger(r.played) && r.played > 0 ? r.played : 0;
    records.wins = Number.isInteger(r.wins) && r.wins > 0 ? r.wins : 0;
    for (const d of Object.keys(DIFFICULTY_NAME)) if (Number.isFinite(r.best?.[d]) && r.best[d] > 0) records.best[d] = Math.floor(r.best[d]);
  }
} catch {
  /* no records yet */
}
try {
  localStorage.removeItem(OLD_ENGINE_KEY);
} catch {
  /* storage blocked */
}
try {
  const s = localStorage.getItem(SAVE_KEY);
  if (s) {
    game = Realm.load(s);
    hasSave = true;
  }
} catch (e) {
  console.warn('Save could not be read:', e.message);
  saveError = 'Your old save could not be read. A new realm begins.';
}
if (!game) game = new Realm(4927);
bindGame();
for (const e of document.querySelectorAll('[data-icon]')) e.innerHTML = icon(e.dataset.icon);

kit = await boot({
  title: 'Crown & Clay',
  mount: $('world'),
  gear: 'none',
  accent: '#d9b866',
  background: '#263f36',
  touch: { hint: false },
  input: ACTIONS,
});
kit.canvas.id = 'gameCanvas';
kit.canvas.setAttribute('aria-label', 'Map of the Sunreach Basin. Use touch, a mouse, or a controller to choose tiles.');
kit.loading.progress(0.75, 'Shaping the basin…');
view = new WorldView(kit, game);
post = createPost(kit, view.scene, view.camera);
kit.onPause((paused) => {
  if (!audioCtx) return;
  if (paused) audioCtx.suspend().catch(() => {});
  else if (prefs.sound) audioCtx.resume().catch(() => {});
});
kit.input.onSourceChange(onSourceChange);
onSourceChange();
renderHud();
renderSelection();
renderLabels();
drawMinimap();
if (prefs.sound) startAmbient();
if (saveError) setTimeout(() => toast(saveError, 'info', 6000), 900);
kit.loading.progress(0.9, 'Lighting the hearths…');
// Warm the shaders the first selection and the first sparks use, so the first click does not hitch.
const warmUnit = game.units.find((u) => u.owner === 0);
if (warmUnit) {
  const t = game.tile(warmUnit.x, warmUnit.z),
    n = game.neighbours(t).find((q) => q.type !== 'water') || t;
  view.setSelection(t, { [key(n.x, n.z)]: 1 });
  view.setHover(n);
}
view.burst(0, 0);
view.updateSparks(0);
try {
  await kit.renderer.compileAsync(view.scene, view.camera);
} catch (err) {
  console.warn(err);
}
view.particles.length = 0;
view.updateSparks(0);
view.setHover(null);
updateSelectionView();
kit.start(frame);

window.CrownClay = {
  get game() {
    return game;
  },
  get view() {
    return view;
  },
  get selected() {
    return selected;
  },
  start,
  selectUnit,
  selectCity,
  moveTo,
  nextTurn,
  refresh,
  showBuild,
  showResearch,
  showEmpire,
  showDiplomacy,
  showGoals,
  showSettings,
  showOutcome,
  showEvent,
  forceClose,
  save,
  renderHud,
  get started() {
    return started;
  },
  version: '1.1.0',
};
</script>
</body></html>
