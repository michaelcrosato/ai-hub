<script>/* Crown & Clay — original game rules. No external game assets. */
const W=20,H=16,LAST_TURN=60;
const TECH={
 pottery:{name:'Pottery',cost:20,pre:[],icon:'pot',desc:'Store food. Build farms and granaries.'},

 writing:{name:'Writing',cost:34,pre:['pottery'],icon:'book',desc:'Build libraries. Share what you learn.'},

 currency:{name:'Currency',cost:58,pre:['writing'],icon:'gold',desc:'Build markets, trade posts, and a Council Hall.'},
 philosophy:{name:'Philosophy',cost:65,pre:['writing'],icon:'culture',desc:'Build temples. Your culture grows faster.'},

const UNIT={
 scout:{name:'Scout',cost:22,move:3,str:2,hp:9,icon:'compass',desc:'Moves fast. Sees farther. Finds ancient ruins.'},
 warrior:{name:'Warrior',cost:28,move:2,str:5,hp:15,icon:'sword',desc:'A strong early unit. Protect cities and attack rivals.'},
 worker:{name:'Worker',cost:24,move:2,str:0,hp:8,icon:'pick',desc:'Build farms, mines, and trade posts on your land.'},
 settler:{name:'Settler',cost:42,move:2,str:0,hp:8,icon:'flag',desc:'Found a city at least 4 tiles from other cities.'},
 spearman:{name:'Spearman',cost:42,move:2,str:7,hp:18,tech:'bronze',icon:'shield',desc:'A tough soldier. Strong in attack and defense.'},
 catapult:{name:'Catapult',cost:58,move:1,str:9,hp:12,tech:'engineering',icon:'siege',desc:'Deals double damage to cities. Weak in open combat.'}

const BUILD={
 granary:{name:'Granary',cost:32,tech:'pottery',icon:'food',desc:'+3 food each turn. Your city grows faster.'},
 monument:{name:'Monument',cost:30,icon:'culture',desc:'+2 culture each turn. Your borders grow.'},
 library:{name:'Library',cost:42,tech:'writing',icon:'book',desc:'+4 science each turn.'},
 walls:{name:'City Walls',cost:36,tech:'masonry',icon:'wall',desc:'+16 city health and +2 defense strength.'},
 workshop:{name:'Workshop',cost:46,tech:'masonry',icon:'gear',desc:'+3 production each turn.'},
 market:{name:'Market',cost:44,tech:'currency',icon:'gold',desc:'+5 gold each turn.'},
 temple:{name:'Temple',cost:48,tech:'philosophy',icon:'culture',desc:'+4 culture each turn.'},
 council:{name:'Council Hall',cost:100,tech:'currency',icon:'peace',desc:'Win through peace: 3 cities, 2 trade pacts, and friendly rivals.'},
 sunspire:{name:'The Sunspire',cost:150,tech:'astronomy',icon:'sun',desc:'Win through culture: finish this wonder and reach 120 culture.'}
};
const TERRAIN={grass:{name:'Grassland',food:2,prod:1,gold:0,cost:1},plain:{name:'Plains',food:1,prod:2,gold:0,cost:1},forest:{name:'Forest',food:1,prod:2,gold:0,cost:2},hill:{name:'Hills',food:0,prod:3,gold:1,cost:2},sand:{name:'Desert',food:0,prod:1,gold:1,cost:1},mountain:{name:'Mountains',food:0,prod:0,gold:0,cost:99},water:{name:'Sea',food:1,prod:0,gold:1,cost:99}};
const CIV=[{name:'The Sunward Crown',short:'Sunward',color:'#e8b855',dark:'#8c661b',capital:'Aster',motto:'From small seeds, great stories.'},{name:'The Jade League',short:'Jade',color:'#66ae9a',dark:'#267664',capital:'Mossgate',motto:'A shared table is better than a wall.'},{name:'The Ember Clan',short:'Ember',color:'#de8068',dark:'#ab4b35',capital:'Cinderhold',motto:'The horizon belongs to the bold.'},{name:'Free Raiders',short:'Raiders',color:'#7b738d',dark:'#534b66',capital:'',motto:''}];
const CITY_NAMES=['Aster','Goldleaf','Larkspur','Sunhaven','Claybank','Fairwind','Highgrove','Dawnrest','Brightwater'];
const dist=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.z-b.z));
const key=(x,z)=>z*W+x;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function rng(seed){let a=seed|0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
class Realm {
 constructor(seed=4927,difficulty='standard'){
  this.seed=seed;this.difficulty=difficulty;this.turn=1;this.nextId=1;this.tiles=[];this.cities=[];this.units=[];this.notes=[];this.seen=Array(W*H).fill(false);this.visible=Array(W*H).fill(false);this.outcome=null;this.sandbox=false;this.pendingEvent=null;this.eventsDone=[];this.stats={ruins:0,battles:0,founded:1,improved:0};
  this.nations=[0,1,2].map(i=>({gold:i?45:55,culture:0,science:0,techs:[],rp:{},research:i===2?'mining':'pottery'}));
  this.diplomacy=[null,{met:false,war:false,trade:false,relation:45,truce:0},{met:false,war:false,trade:false,relation:10,truce:0}];
  const r=rng(seed);
  for(let z=0;z<H;z++)for(let x=0;x<W;x++){
   const shape=Math.min(((x-6.5)/6.6)**2+((z-8.7)/6.5)**2,((x-12.5)/5.9)**2+((z-6.5)/5.5)**2);
   let type=shape<1+(r()-.5)*.23?'grass':'water';
   if(type!=='water') {const v=r();type=v<.24?'forest':v<.40?'plain':v<.51?'hill':v<.56?'mountain':v<.60&&x>10?'sand':'grass';}
   this.tiles.push({x,z,type,owner:-1,improvement:null,resource:null,ruin:false,camp:false});
  }
  // One connected continent. The long river is a visual and economic feature, not a sea barrier.
  const capitals=[{x:5,z:10},{x:13,z:4},{x:15,z:11}];
  for(const c of capitals)for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){let t=this.tile(c.x+dx,c.z+dz);if(t)t.type=Math.abs(dx)+Math.abs(dz)===0?'grass':r()<.5?'plain':'grass';}
  for(let x=5;x<=15;x++)this.tile(x,9).type=x%3===0?'plain':'grass';
  for(let z=4;z<=11;z++)this.tile(12,z).type=z%3===0?'forest':'grass';
  for(let x=6;x<=12;x++)this.tile(x,5).type='grass';
  const set=(x,z,type,res)=>{let t=this.tile(x,z);t.type=type;t.resource=res;};
  set(4,10,'plain','wheat');set(6,10,'hill','ore');set(5,9,'grass','wheat');set(4,8,'forest',null);set(7,9,'grass',null);set(7,10,'plain','wheat');set(6,7,'forest',null);set(8,6,'hill','ore');
  for(const t of this.tiles){if(t.type==='water'||t.type==='mountain')continue;if(!t.resource&&r()<.09)t.resource=t.type==='hill'?'ore':r()<.5?'wheat':'gold';t.river=t.x===Math.round(8.2+Math.sin(t.z*.57)*1.25)&&t.z>2&&t.z<14;}
  for(const [x,z] of [[7,7],[3,6],[10,4],[10,12],[15,7],[17,5]]){let t=this.tile(x,z);t.type='grass';t.ruin=true;t.resource=null;}
  for(const [x,z] of [[10,10],[11,2]]){let t=this.tile(x,z);t.type='plain';t.camp=true;t.ruin=false;}
  this.addCity(0,5,10,'Aster',true);this.addCity(1,13,4,'Mossgate',true);this.addCity(2,15,11,'Cinderhold',true);
  this.cities[0].pop=2;this.cities[0].buildings=['monument'];this.cities[0].project='scout';
  this.addUnit(0,'scout',6,9);this.addUnit(0,'warrior',5,11);this.addUnit(0,'worker',4,10);
  this.addUnit(1,'warrior',12,4);this.addUnit(1,'scout',13,5);this.addUnit(2,'warrior',14,11);this.addUnit(2,'warrior',15,10);
  this.addUnit(3,'warrior',10,10);this.addUnit(3,'warrior',11,2);
  this.claim();this.reveal();this.log('Aster is founded. Your story begins.','sun');
 }
 tile(x,z){return x>=0&&z>=0&&x<W&&z<H?this.tiles[key(x,z)]:null;}
 at(x,z){return this.units.filter(u=>u.x===x&&u.z===z);}
 cityAt(x,z){return this.cities.find(c=>c.x===x&&c.z===z);}
 nation(o){return this.nations[o];}
 has(o,t){return !t||!!this.nations[o]?.techs.includes(t);}
 war(a,b){if(a===b)return false;if(a===3||b===3)return true;if(a===0||b===0)return this.diplomacy[a||b].war;return false;}
 neighbours(t){const out=[];for(let z=-1;z<=1;z++)for(let x=-1;x<=1;x++){if(!x&&!z)continue;const n=this.tile(t.x+x,t.z+z);if(n)out.push(n);}return out;}
 pass(t){return t&&t.type!=='water'&&t.type!=='mountain';}
 addUnit(owner,type,x,z){const d=UNIT[type],u={id:this.nextId++,owner,type,x,z,hp:d.hp,moves:d.move,fortified:false,kills:0};this.units.push(u);return u;}
 addCity(owner,x,z,name,capital=false){const c={id:this.nextId++,owner,x,z,name:name||CITY_NAMES[this.stats.founded%CITY_NAMES.length],capital,origin:owner,pop:1,food:0,culture:0,hp:30,buildings:[],project:owner===0?'monument':'warrior',progress:{},lastHit:-1};this.cities.push(c);let t=this.tile(x,z);t.type='grass';t.ruin=false;t.camp=false;t.improvement=null;return c;}
 log(text,icon='info'){this.notes.unshift({turn:this.turn,text,icon});this.notes=this.notes.slice(0,60);if(this.onLog)this.onLog(text,icon);}
 claim(){for(const t of this.tiles)t.owner=-1;const distances=Array(W*H).fill(100);for(const c of this.cities){const radius=c.culture>=42?3:c.culture>=10?2:1;for(const t of this.tiles){let d=dist(c,t);if(d<=radius&&d<distances[key(t.x,t.z)]&&t.type!=='water'){t.owner=c.owner;distances[key(t.x,t.z)]=d;}}}for(const c of this.cities)this.tile(c.x,c.z).owner=c.owner;}
 reveal(){this.visible.fill(false);let eyes=[...this.units.filter(u=>u.owner===0).map(u=>({...u,range:u.type==='scout'?3:2})),...this.cities.filter(c=>c.owner===0).map(c=>({...c,range:4}))];for(const e of eyes)for(const t of this.tiles)if(dist(e,t)<=e.range){this.seen[key(t.x,t.z)]=true;this.visible[key(t.x,t.z)]=true;}for(let o=1;o<=2;o++)if(!this.diplomacy[o].met&&(this.cities.some(c=>c.owner===o&&this.visible[key(c.x,c.z)])||this.units.some(u=>u.owner===o&&this.visible[key(u.x,u.z)]))){this.diplomacy[o].met=true;this.log('You meet '+CIV[o].name+'.','peace');}}
 yield(t){const b=TERRAIN[t.type];let y={food:b.food,prod:b.prod,gold:b.gold};if(t.resource==='wheat')y.food+=2;if(t.resource==='ore')y.prod++;if(t.resource==='gold')y.gold+=2;if(t.improvement==='farm')y.food+=2;if(t.improvement==='mine')y.prod+=2;if(t.improvement==='post')y.gold+=3;if(t.river){y.food++;y.gold++;}return y;}
 worked(c){return this.tiles.filter(t=>t.owner===c.owner&&dist(c,t)<=2&&!this.cityAt(t.x,t.z)&&this.pass(t)&&!this.cities.some(other=>other.id!==c.id&&other.owner===c.owner&&(dist(other,t)<dist(c,t)||dist(other,t)===dist(c,t)&&other.id<c.id))).sort((a,b)=>{let x=this.yield(a),y=this.yield(b);return(y.food*1.4+y.prod+y.gold*.6)-(x.food*1.4+x.prod+x.gold*.6)}).slice(0,c.pop+1);}
 yields(c){let y={food:3,prod:3,gold:3,science:2+c.pop,culture:1};for(const t of this.worked(c)){const q=this.yield(t);y.food+=q.food;y.prod+=q.prod;y.gold+=q.gold;}y.food=Math.max(1,y.food-c.pop*2);if(c.buildings.includes('granary'))y.food+=3;if(c.buildings.includes('workshop'))y.prod+=3;if(c.buildings.includes('market'))y.gold+=5;if(c.buildings.includes('library'))y.science+=4;if(c.buildings.includes('monument'))y.culture+=2;if(c.buildings.includes('temple'))y.culture+=4;if(c.buildings.includes('sunspire'))y.culture+=6;return y;}
 income(o){let y={food:0,prod:0,gold:0,science:0,culture:0};for(const c of this.cities.filter(c=>c.owner===o)){let q=this.yields(c);for(const k in y)y[k]+=q[k];if(!c.project)y.gold+=Math.floor(q.prod/2);}y.gold-=Math.max(0,this.units.filter(u=>u.owner===o).length-3);if(o===0){for(let i=1;i<3;i++)if(this.diplomacy[i].trade&&!this.diplomacy[i].war){y.gold+=4;y.science++;}}else if(this.diplomacy[o].trade){y.gold+=4;y.science++;}return y;}
 score(o){return this.cities.filter(c=>c.owner===o).reduce((s,c)=>s+25+c.pop*7+(c.buildings.includes('sunspire')?70:0),0)+this.nation(o).techs.length*12+Math.floor(this.nation(o).culture/4)+Math.floor(this.nation(o).gold/15);}
 strength(u){return UNIT[u.type].str+(u.type==='warrior'&&this.has(u.owner,'bronze')?1:0)+Math.floor(u.kills/2);}
 moveCost(u,t){return u.type==='scout'?1:TERRAIN[t.type].cost;}
 paths(u,max=u.moves,attack=true){let start=key(u.x,u.z),D={[start]:0},P={},queue=[start];while(queue.length){queue.sort((a,b)=>D[a]-D[b]);const k=queue.shift(),t=this.tiles[k];for(const n of this.neighbours(t)){if(!this.pass(n))continue;const k2=key(n.x,n.z);const cost=D[k]+this.moveCost(u,n);if(cost>max||D[k2]!==undefined&&D[k2]<=cost)continue;const city=this.cityAt(n.x,n.z);const enemies=this.at(n.x,n.z).filter(e=>e.owner!==u.owner);const blockedPeace=enemies.some(e=>!this.war(u.owner,e.owner))||(city&&city.owner!==u.owner&&!this.war(u.owner,city.owner));if(blockedPeace)continue;const hostile=enemies.some(e=>this.war(u.owner,e.owner))||city&&this.war(u.owner,city.owner);if(hostile&&(!attack||!this.strength(u)))continue;const own=this.at(n.x,n.z).filter(e=>e.owner===u.owner&&e.id!==u.id);if(own.length&&!city)continue;D[k2]=cost;P[k2]=k;if(!hostile)queue.push(k2);}}
  return{D,P};}
 pathTo(u,t,max=300,attack=true){const{D,P}=this.paths(u,max,attack),end=key(t.x,t.z);if(D[end]===undefined)return null;let k=end,path=[];while(k!==key(u.x,u.z)){path.unshift(this.tiles[k]);k=P[k];if(k===undefined)return null;}return path;}
 move(u,t){if(!u||u.moves<=0)return{ok:false,msg:'This unit has no moves left.'};const path=this.pathTo(u,t,u.moves);if(!path||!path.length)return{ok:false,msg:'That tile is out of reach.'};const e=this.at(t.x,t.z).find(e=>this.war(u.owner,e.owner));const c=this.cityAt(t.x,t.z);if(e||c&&this.war(u.owner,c.owner))return{ok:false,combat:true,unit:e,city:c};const before={x:u.x,z:u.z};for(const p of path){u.moves-=this.moveCost(u,p);u.x=p.x;u.z=p.z;this.visit(u,p);}u.fortified=false;this.reveal();return{ok:true,from:before,path};}
 visit(u,t){if(t.ruin){t.ruin=false;if(u.owner===0){const type=(t.x+t.z)%3;if(type===0){this.nation(0).gold+=30;this.log('Ancient ruins: you find 30 gold.','gold');}else if(type===1){this.nation(0).culture+=15;this.log('Ancient ruins: a lost story gives 15 culture.','culture');}else{this.grantScience(0,20);this.log('Ancient ruins: old records give 20 science.','book');}this.stats.ruins++;}else if(u.owner<3)this.nation(u.owner).gold+=20;}
 if(t.camp&&u.owner!==3&&this.strength(u)){t.camp=false;if(u.owner<3)this.nation(u.owner).gold+=35;if(u.owner===0)this.log('Raider camp cleared. You gain 35 gold.','sword');}}
 combatPreview(u,t){const e=this.at(t.x,t.z).filter(e=>this.war(u.owner,e.owner)).sort((a,b)=>this.strength(b)-this.strength(a))[0];const c=this.cityAt(t.x,t.z);const city=!e&&c&&this.war(u.owner,c.owner)?c:null;if(!e&&!city)return null;const ds=city?5+(city.buildings.includes('walls')?2:0):Math.max(1,this.strength(e));const terr=t.type==='forest'||t.type==='hill'?1.2:1;const as=Math.max(1,this.strength(u));let damage=clamp(Math.round(6*as/(ds*terr)*(city&&u.type==='catapult'?2:1)),3,18);let counter=clamp(Math.round(4*ds/as),2,10);if(e?.fortified)damage=Math.round(damage*.8);if(e&&this.strength(e)===0)counter=0;return{target:e||city,isCity:!!city,damage,counter,name:city?city.name:UNIT[e.type].name};}
 attack(u,t){if(!u||u.moves<1||!this.strength(u))return{ok:false,msg:'This unit cannot attack now.'};const path=this.pathTo(u,t,u.moves);if(!path)return{ok:false,msg:'Move closer before you attack.'};const p=this.combatPreview(u,t);if(!p)return{ok:false,msg:'There is no enemy here.'};for(const step of path.slice(0,-1)){u.x=step.x;u.z=step.z;this.visit(u,step);}u.moves=0;u.fortified=false;p.target.hp-=p.damage;if(p.isCity)p.target.lastHit=this.turn;if(p.target.hp>0||p.isCity)u.hp-=p.counter;const alive=u.hp>0;
  if(p.target.hp<=0){if(p.isCity){const old=p.target.owner;if(!alive){p.target.hp=1;}else if(u.owner===3){this.cities=this.cities.filter(c=>c.id!==p.target.id);this.log('Raiders destroy '+p.target.name+'.','sword');this.claim();}else{p.target.owner=u.owner;p.target.hp=18;p.target.pop=Math.max(1,p.target.pop-1);p.target.project=null;p.target.progress={};if(u.owner===0)this.log(p.target.name+' joins your crown!','flag');else if(old===0)this.log(p.target.name+' has fallen!','sword');this.claim();}}else{this.units=this.units.filter(e=>e.id!==p.target.id);u.kills++;if(u.owner===0)this.stats.battles++;if(u.owner===0||p.target.owner===0)this.log(CIV[p.target.owner].short+' '+UNIT[p.target.type].name.toLowerCase()+' defeated.','sword');}
   const city=this.cityAt(t.x,t.z);if(alive&&(!city||city.owner===u.owner)&&!this.at(t.x,t.z).some(e=>this.war(u.owner,e.owner))){u.x=t.x;u.z=t.z;this.visit(u,t);}}
  if(!alive){this.units=this.units.filter(e=>e.id!==u.id);if(u.owner===0)this.log('Your '+UNIT[u.type].name.toLowerCase()+' was lost.','sword');}this.reveal();this.checkVictory();return{ok:true,preview:p,alive};}

function selectUnit(id,focus=false){const u=game.units.find(u=>u.id===+id);if(!u)return;started=true;selected={kind:'unit',id:u.id};combatTarget=null;document.body.classList.remove('select-collapsed');if(focus)view.focus(u.x,u.z);updateSelectionView();renderSelection();renderLabels();sound();}
function selectCity(id,focus=false){const c=game.cities.find(c=>c.id===+id);if(!c)return;started=true;selected={kind:'city',id:c.id};combatTarget=null;document.body.classList.remove('select-collapsed');if(focus)view.focus(c.x,c.z-1);updateSelectionView();renderSelection();renderLabels();sound();}
function start(){started=true;closeDialog();const u=game.units.find(u=>u.owner===0&&u.type==='scout')||game.units.find(u=>u.owner===0);if(u)selectUnit(u.id);else if(game.cities.some(c=>c.owner===0))selectCity(game.cities.find(c=>c.owner===0).id);renderHud();save();if(game.outcome&&!game.sandbox)showOutcome();else if(game.pendingEvent)showEvent();else if(game.turn===1)toast('Select your scout. Tap a lit tile near the old columns.','compass',5100);sound('discover');}
function cycleUnit(){const units=game.units.filter(u=>u.owner===0&&u.moves>0);if(!units.length){toast('All units have orders. End the turn to continue.','clock');return;}const i=units.findIndex(u=>u.id===selected?.id),next=units[(i+1)%units.length];closeDialog();selectUnit(next.id,true);}
function moveTo(t){if(!started||busy||dialog)return;let u=selectedUnit();if(u?.owner===0){if(u.x===t.x&&u.z===t.z)return;const ally=game.at(t.x,t.z).find(v=>v.owner===0);if(ally&&!game.cityAt(t.x,t.z)){selectUnit(ally.id);return;}const enemy=game.at(t.x,t.z).find(v=>v.owner!==0&&game.visible[key(t.x,t.z)]);const city=game.cityAt(t.x,t.z);if((enemy&&!game.war(0,enemy.owner))||(city&&city.owner!==0&&!game.war(0,city.owner))){if(city)selectCity(city.id);else selectUnit(enemy.id);return;}let res=game.move(u,t);if(res.combat){combatTarget={x:t.x,z:t.z};document.body.classList.remove('select-collapsed');renderSelection();sound('fight');return;}if(!res.ok){toast(res.msg,'move');return;}combatTarget=null;view.rebuild();view.animateMove(u.id,res.from,u);updateSelectionView();renderHud();renderSelection();renderLabels();drawMinimap();save();sound('move');game.checkVictory();if(game.outcome&&!game.sandbox)showOutcome();return;}
 const units=game.at(t.x,t.z).filter(v=>v.owner===0||game.visible[key(t.x,t.z)]);if(units.length){selectUnit(units[0].id);return;}const c=game.cityAt(t.x,t.z);if(c&&game.seen[key(t.x,t.z)]){selectCity(c.id);return;}selected={kind:'tile',x:t.x,z:t.z};combatTarget=null;updateSelectionView();renderSelection();}
function renderLabels(){const root=$('mapLabels');let html='';for(const c of game.cities){if(!game.seen[key(c.x,c.z)])continue;let p=UNIT[c.project]||BUILD[c.project],pc=p?(c.progress[c.project]||0)/p.cost*100:0;html+=`<button class="city-label ${c.owner?'enemy':''} ${game.war(0,c.owner)?'war':''}" data-act="city" data-id="${c.id}" data-label-city="${c.id}" aria-label="View ${esc(c.name)}">${icon(c.capital?'crown':'city')}<span>${esc(c.name)}</span><span class="pop">${c.pop}</span>${c.owner===0?`<span class="label-track"><i style="width:${pc}%"></i></span>`:''}</button>`;}
 for(const u of game.units){if(u.owner!==0&&!game.visible[key(u.x,u.z)])continue;html+=`<button class="unit-label ${selected?.kind==='unit'&&selected.id===u.id?'selected':''} ${u.owner?'enemy-unit':''} ${!u.moves?'spent':''}" data-act="unit" data-id="${u.id}" data-label-unit="${u.id}" style="--unit-color:${CIV[u.owner].color}" aria-label="${CIV[u.owner].short} ${UNIT[u.type].name}">${icon(UNIT[u.type].icon)}${u.owner===0&&u.moves?'<i class="unit-dot"></i>':''}</button>`;}

function positionLabels(){if(!view)return;const placed=[];for(const el of document.querySelectorAll('[data-label-city]')){const c=game.cities.find(c=>c.id===+el.dataset.labelCity);if(!c)continue;const p=view.point(c.x,c.z,height(game.tile(c.x,c.z))+1.95);el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.display=p.x<-80||p.x>view.w+80||p.y<85||p.y>view.h+30?'none':'flex';placed.push({x:p.x,y:p.y});}
 for(const el of document.querySelectorAll('[data-label-unit]')){const u=game.units.find(u=>u.id===+el.dataset.labelUnit);if(!u)continue;const t=game.tile(u.x,u.z);let x=u.x*TILE,z=u.z*TILE;const same=game.at(u.x,u.z).filter(e=>e.owner===u.owner),i=same.findIndex(e=>e.id===u.id);if(same.length>1){x+=(i%2-.5)*.45;z+=Math.floor(i/2)*.4;}if(game.cityAt(u.x,u.z)){x+=.30;z+=.55;}if(view.moveAnim?.id===u.id){let f=clamp((performance.now()-view.moveAnim.start)/view.moveAnim.duration,0,1),e=f*f*(3-2*f);x+=(view.moveAnim.from.x-view.moveAnim.to.x)*(1-e);z+=(view.moveAnim.from.z-view.moveAnim.to.z)*(1-e);}const p=view.project(x,height(t)+1.50,z);el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.display=p.x<5||p.x>view.w-5||p.y<83||p.y>view.h-64?'none':'grid';}
 for(const el of document.querySelectorAll('[data-label-ruin]')){const t=game.tiles[+el.dataset.labelRuin],p=view.point(t.x,t.z,height(t)+1.15);el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.display=p.x<0||p.x>view.w||p.y<85||p.y>view.h-70?'none':'grid';}drawMinimap();}
function drawMinimap(){const cv=$('minimap'),c=cv.getContext('2d'),w=cv.width,h=cv.height,sx=w/W,sz=h/H;c.fillStyle='#82b0ac';c.fillRect(0,0,w,h);for(const t of game.tiles){if(t.type==='water')continue;c.fillStyle=!game.seen[key(t.x,t.z)]?'#b5c5b3':t.owner>=0?mixColor(PALETTE[t.type],CIV[t.owner].color,.55):PALETTE[t.type];c.fillRect(t.x*sx,t.z*sz,sx+.5,sz+.5);}for(const city of game.cities){if(!game.seen[key(city.x,city.z)])continue;c.fillStyle=city.owner===0?'#fff1c5':CIV[city.owner].dark;c.fillRect((city.x+.25)*sx,(city.z+.25)*sz,sx*.5,sz*.5);}for(const u of game.units.filter(u=>u.owner===0)){c.fillStyle='#fff4cc';c.beginPath();c.arc((u.x+.5)*sx,(u.z+.5)*sz,2.1,0,7);c.fill();}const bounds=[[0,0],[view.w,0],[view.w,view.h],[0,view.h]].map(p=>view.unproject(...p));c.strokeStyle='#f9f9d4b0';c.lineWidth=2;c.beginPath();bounds.forEach((p,i)=>i?c.lineTo((p.x/TILE+.5)*sx,(p.z/TILE+.5)*sz):c.moveTo((p.x/TILE+.5)*sx,(p.z/TILE+.5)*sz));c.closePath();c.stroke();}

function showSettings(){openDialog('settings','A moment to plan',`<div class="setting-row"><span><strong>Sound</strong><small>Soft notes and action sounds.</small></span><button class="btn small" data-act="sound">${icon(prefs.sound?'audio':'mute')} ${prefs.sound?'On':'Off'}</button></div><div class="setting-row"><span><strong>Visual quality</strong><small>Balanced is made for phones.</small></span><select id="qualitySelect" aria-label="Visual quality">${['low','balanced','high'].map(v=>`<option value="${v}" ${prefs.quality===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></div><div class="setting-row"><span><strong>Renderer</strong><small>${view.engine==='three'?'Three.js r'+view.T.REVISION+' · WebGL 2':esc(engineState)}</small></span>${view.engine==='three'?'<span class="pill">3D</span>':`<button class="btn small" data-act="retryEngine" ${engineLoading?'disabled':''}>${engineLoading?'Loading…':'Load 3D'}</button>`}</div><div class="settings-grid"><button class="btn" data-act="help">${icon('help')} How to play</button><button class="btn" data-act="goals">${icon('trophy')} Victory goals</button><button class="btn" data-act="export">${icon('save')} Export save</button><button class="btn" data-act="import">${icon('upload')} Import save</button><button class="btn" data-act="journal">${icon('book')} Chronicle</button><button class="btn" data-act="offlineCopy">${icon('save')} Offline 3D copy</button></div><div class="actions"><button class="btn danger wide" data-act="newConfirm">${icon('rotate')} Start a new realm</button></div><p class="credits">CROWN & CLAY · THE FIRST KINGDOM<br>An original, single-player game inspired by classic empire strategy games. All game art and sound are made in code. No accounts, ads, or analytics.<br><br>Your game saves in this browser. Keep an exported save when you change browsers or files. The 3D engine loads from a public CDN, then stays in this browser when storage is available. Light mode needs no network function showEvent(){const turn=game.pendingEvent;openDialog('event',turn===12?'The first great harvest':turn===25?'A day for your people':'A season to remember',`<div class="event-art">${icon('food')}</div><p class="lead">The fields are full. Your people ask how to mark this good season. Choose a gift for your realm.</p><div class="actions"><button class="btn gold wide" data-act="event" data-choice="0">${icon('culture')} Hold a festival · +20 culture</button><button class="btn wide" data-act="event" data-choice="1">${icon('gold')} Store the harvest · +35 gold, +12 food</button></div>`,{eyebrow:'A MOMENT IN HISTORY · TURN '+turn,narrow:true,locked:true});}
function showOutcome(){const o=game.outcome;if(!o||game.sandbox)return;const texts={culture:'A bright tower rises above the basin. Long after this age, people will tell the story of your crown.',peace:'Three nations share a table. Your realm will be remembered for the bridges it built.',conquest:'From the first small city to the far edge of the basin, one banner now flies.',score:o.win?'Your people have left the strongest mark on this age. A small beginning became a great story.':'Another nation leads this age. Your cities, discoveries, and choices still tell a story worth keeping.',defeat:'Your last city has fallen. Every crown starts with a small hope. A new world is ready for another story.'};openDialog('outcome',o.win?'An age to remember':'The end of an age',`<div class="win-body"><div class="win-seal">${icon(o.win?'crown':'sun')}</div><div class="eyebrow" style="justify-content:center;margin-bottom:13px">${o.win?'VICTORY':'YOUR CHRONICLE IS COMPLETE'}</div><h1>${esc(o.title)}</h1><p>${texts[o.kind]}</p><div class="win-stats"><span><strong>${game.score(0)}</strong><small>FINAL SCORE</small></span><span><strong>${game.turn}</strong><small>TURNS</small></span><span><strong>${game.nation(0).techs.length}</strong><small>DISCOVERIES</small></span></div><div class="actions">${o.kind!=='defeat'?`<button class="btn primary wide" data-act="keepPlaying">Keep building ${icon('arrow')}</button>`:''}<button class="btn wide" data-act="newConfirm">${icon('rotate')} A new realm</button><button class="btn ghost wide" data-act="export">${icon('save')} Keep this story</button></div></div>`,{eyebrow:'CROWN & CLAY',narrow:true,locked:true});}
function showNewConfirm(){forceClose();openDialog('new','A new beginning',`<p class="lead">This replaces the save in this browser. Export your current save first to keep this realm.</p><div class="setting-row"><span><strong>Choose the challenge</strong><small>A new map has a new shape.</small></span><select id="difficultySelect" aria-label="Game difficulty"><option value="calm">Calm</option><option value="standard" selected>Standard</option><option value="bold">Bold</option></select></div><p class="hint">Calm has no new raiders. Bold brings the Ember Clan to war sooner. Gifts and trade can prevent war.</p><div class="actions"><button class="btn" data-act="export">${icon('save')} Export first</button><button class="btn primary flex" data-act="restart">Start a new realm ${icon('arrow')}</button></div>`,{eyebrow:'TURN THE PAGE',narrow:true});}
function nextTurn(){if(!started||busy)return;if(game.pendingEvent){showEvent();return;}if(game.outcome&&!game.sandbox){showOutcome();return;}busy=true;turnMessages=[];$('endTurn').classList.add('busy');renderHud();sound();setTimeout(()=>{try{const res=game.nextTurn();if(!res.ok)toast(res.msg);combatTarget=null;busy=false;$('endTurn').classList.remove('busy');refresh();const important=turnMessages.filter(n=>['book','sword','flag'].includes(n.icon));(important.length?important:turnMessages).slice(0,2).forEach(n=>toast(n.text,n.icon));if(turnMessages.some(n=>n.icon==='book'))sound('discover');if(game.pendingEvent&&!game.outcome)showEvent();if(game.outcome&&!game.sandbox){showOutcome();if(game.outcome.win)sound('win');}}catch(e){busy=false;$('endTurn').classList.remove('busy');console.error(e);toast('The turn could not finish. Export your save before you reload.','info',8000);renderHud();}},120);}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function exportSave(){downloadBlob(new Blob([game.serialize()],{type:'application/json'}),'Crown-and-Clay-Turn-'+game.turn+'.json');toast('Your chronicle is ready to save.','save');}
async function makeOfflineCopy(){if(!enginePack){toast('Load the 3D engine online once, then make an offline 3D copy. Light mode already works offline.','info',8000);return;}const clone=document.documentElement.cloneNode(true);clone.querySelector('#engine-pack').textContent=JSON.stringify(enginePack).replaceAll('<','\\u003c');clone.querySelectorAll('#gameCanvas').forEach(e=>e.remove());['mapLabels','resources','dateBox','researchStrip','goalCard','selection','toastArea','dialogRoot'].forEach(id=>{clone.querySelector('#'+id).innerHTML='';});clone.querySelector('body').className='';downloadBlob(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'}),'Crown-and-Clay-Offline-3D.html');toast('Your single-file 3D game is ready.','save');}
function action(btn){const a=btn.dataset.act;if(btn.disabled)return;if(a!=='map'&&a!=='home')sound();switch(a){
 case'start':start();break;case'helpDone':forceClose();if(!started)start();break;
 case'home':view.home();break;case'zoomIn':view.zoomBy(.82);break;case'zoomOut':view.zoomBy(1.22);break;case'rotate':view.rotate(Math.PI/4);break;case'minimap':$('miniWrap').classList.toggle('open');break;
 case'map':if(!dialog?.locked)closeDialog();break;case'clear':selected=null;combatTarget=null;updateSelectionView();renderSelection();renderLabels();break;case'collapse':document.body.classList.toggle('select-collapsed');break;
 case'unit':if(!started)return;selectUnit(btn.dataset.id);break;case'city':if(!started)return;selectCity(btn.dataset.id);break;case'focusUnit':forceClose();selectUnit(btn.dataset.id,true);break;case'focusCity':forceClose();selectCity(btn.dataset.id,true);break;
 case'nextUnit':if(started)cycleUnit();break;case'endTurn':nextTurn();break;
 case'fortify':{const u=selectedUnit();if(u&&u.moves){u.fortified=true;u.moves=0;toast('Your unit will heal 4 health each turn.','shield');refresh();}break;}
 case'wait':{const u=selectedUnit();if(u){u.moves=0;refresh(false);}break;}
 case'settle':{const u=selectedUnit();if(!u)break;const res=game.settle(u);if(res.ok){selected={kind:'city',id:res.city.id};view.burst(res.city.x,res.city.z);sound('discover');refresh();}else toast(res.msg);break;}
 case'improve':{const u=selectedUnit();if(u){const r=game.improve(u,btn.dataset.type);if(!r.ok)toast(r.msg);refresh();}break;}
 case'cancelAttack':combatTarget=null;renderSelection();break;
 case'attack':{const u=selectedUnit();if(!u||!combatTarget)break;const t=game.tile(combatTarget.x,combatTarget.z),r=game.attack(u,t);combatTarget=null;if(!r.ok)toast(r.msg);else{view.burst(t.x,t.z,'#ecd292');sound('fight');if(!r.alive)selected=null;}refresh();break;}
 case'build':showBuild(btn.dataset.id);break;case'buildTab':showBuild(btn.dataset.id,btn.dataset.tab);break;
 case'chooseBuild':{const c=game.cities.find(c=>c.id===+btn.dataset.id),id=btn.dataset.project;if(c){const r=game.production(c,id);if(r.ok){forceClose();selectCity(c.id);refresh(false);toast(c.name+' will build '+(UNIT[id]||BUILD[id]).name+'.','gear');}else toast(r.msg);}break;}
 case'rush':{const c=game.cities.find(c=>c.id===+btn.dataset.id);if(!c?.project)break;const p=UNIT[c.project]||BUILD[c.project],price=Math.max(0,p.cost-(c.progress[c.project]||0))*3;openDialog('rush','Finish '+p.name+'?',`<p class="lead">Spend <b>${price} gold</b> to finish this project in ${esc(c.name)} now. You have ${game.nation(0).gold} gold.</p><button class="btn gold wide" data-act="rushConfirm" data-id="${c.id}" ${game.nation(0).gold<price?'disabled':''}>${icon('gold')} Spend ${price} gold</button>`,{eyebrow:'CITY PRODUCTION',narrow:true});break;}
 case'rushConfirm':{const c=game.cities.find(c=>c.id===+btn.dataset.id);if(c){const r=game.rush(c);forceClose();if(!r.ok)toast(r.msg);refresh();}break;}
 case'research':showResearch();break;case'chooseResearch':{const r=game.chooseResearch(0,btn.dataset.tech);if(r.ok){forceClose();renderHud();save();toast('Your people begin '+TECH[btn.dataset.tech].name+'.','book');}else toast(r.msg);break;}
 case'empire':showEmpire();break;case'empireTab':showEmpire(btn.dataset.tab);break;case'diplomacy':showDiplomacy();break;
 case'diploAction':{const o=+btn.dataset.owner,r=game.diplomacyAction(o,btn.dataset.action);if(!r.ok)toast(r.msg);if(!game.outcome)showDiplomacy();refresh(false);break;}
 case'warConfirm':{const o=+btn.dataset.owner;openDialog('war','Declare war?',`<p class="lead">You will go to war with <b>${CIV[o].name}</b>. Any trade pact ends. Their units can attack your people and cities.</p><button class="btn danger wide" data-act="war" data-owner="${o}">${icon('sword')} Declare war on ${CIV[o].short}</button>`,{eyebrow:'THE COUNCIL WARNS YOU',narrow:true});break;}
 case'war':game.diplomacyAction(+btn.dataset.owner,'war');showDiplomacy();refresh();break;
 case'goals':showGoals();break;case'help':showHelp();break;case'settings':showSettings();break;case'journal':showJournal();break;case'closeDialog':closeDialog();break;case'sound':setSound();break;
 case'export':exportSave();break;case'import':$('importFile').click();break;case'offlineCopy':makeOfflineCopy();break;case'retryEngine':loadThree();break;
 case'event':game.event(+btn.dataset.choice);forceClose();refresh();break;
 case'keepPlaying':game.sandbox=true;game.pendingEvent=null;forceClose();refresh(false);toast('The story is yours. Keep building.','sun');break;
 case'newConfirm':showNewConfirm();break;
 case'restart':{const difficulty=$('difficultySelect')?.value||'standard';game=new Realm(Math.floor(Math.random()*900000)+1000,difficulty);bindGame();forceClose();view.setGame(game);view.home();selected=null;combatTarget=null;started=true;document.body.classList.remove('select-collapsed');selectUnit(game.units.find(u=>u.owner===0&&u.type==='scout').id);refresh();toast('A new realm. A new story.','sun');break;}
 }}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){e.stopPropagation();action(b);}else if(e.target.dataset.shade&&!dialog?.locked)closeDialog();});
document.addEventListener('change',e=>{if(e.target.id==='qualitySelect'){prefs.quality=e.target.value;view.setQuality(prefs.quality);savePrefs();}});
$('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>1500000)throw Error('This save file is too large.');const g=Realm.load(await f.text());game=g;bindGame();started=true;selected=null;combatTarget=null;forceClose();view.setGame(game);view.home();refresh();toast('Your chronicle is restored.','save');if(game.pendingEvent&&!game.outcome)showEvent();if(game.outcome&&!game.sandbox)showOutcome();}catch(err){toast(err.message||'This save could not be read.','info',6500);}e.target.value='';});
const pointers=new Map();let lastPointer=null,pointerStart=null,pinched=false,dragged=false;
$('world').addEventListener('pointerdown',e=>{if(dialog||!started)return;if(e.button!==0&&e.button!==1&&e.button!==2)return;e.preventDefault();$('world').setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){lastPointer={x:e.clientX,y:e.clientY};pointerStart={x:e.clientX,y:e.clientY};dragged=false;pinched=false;}else{pinched=true;dragged=true;}});
$('world').addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();const old=[...pointers.values()];pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2){const now=[...pointers.values()],d1=Math.hypot(old[0].x-old[1].x,old[0].y-old[1].y),d2=Math.hypot(now[0].x-now[1].x,now[0].y-now[1].y);if(d1>2&&d2>2)view.zoomBy(d1/d2);view.pan((now[0].x+now[1].x-old[0].x-old[1].x)/2,(now[0].y+now[1].y-old[0].y-old[1].y)/2);pinched=true;dragged=true;}else if(lastPointer){const dx=e.clientX-lastPointer.x,dy=e.clientY-lastPointer.y;if(pointerStart&&Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y)>5)dragged=true;if(dragged)view.pan(dx,dy);}lastPointer={x:e.clientX,y:e.clientY};});
function releasePointer(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(!dragged&&!pinched&&e.type==='pointerup'){const t=view.pick(e.clientX,e.clientY);if(t)moveTo(t);}if(pointers.size===1)lastPointer={...pointers.values().next().value};if(!pointers.size){lastPointer=null;pointerStart=null;}}
$('world').addEventListener('pointerup',releasePointer);$('world').addEventListener('pointercancel',releasePointer);$('world').addEventListener('lostpointercapture',e=>pointers.delete(e.pointerId));$('world').addEventListener('contextmenu',e=>e.preventDefault());$('world').addEventListener('wheel',e=>{if(dialog)return;e.preventDefault();view.zoomBy(Math.exp(e.deltaY*.0011));},{passive:false});
$('minimap').addEventListener('pointerdown',e=>{e.preventDefault();const b=e.currentTarget.getBoundingClientRect(),x=clamp((e.clientX-b.left)/b.width*W,0,W-1),z=clamp((e.clientY-b.top)/b.height*H,0,H-1);view.focus(x,z);});
window.addEventListener('resize',()=>{view.resize();positionLabels();});window.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(dialog){if(e.key==='Escape'){e.preventDefault();closeDialog();}if(e.key==='Tab'){const focusable=[...$('dialogRoot').querySelectorAll('button:not(:disabled),select,input')];if(focusable.length){let i=focusable.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();focusable.at(-1).focus();}else if(!e.shiftKey&&i===focusable.length-1){e.preventDefault();focusable[0].focus();}}}return;}if(!started){if(e.key==='Enter')start();return;}let k=e.key.toLowerCase();if([' ','n','h','1','2','3','q','e','escape','+','-','='].includes(k))e.preventDefault();if(k===' ')nextTurn();if(k==='n')cycleUnit();if(k==='h')view.home();if(k==='1')showEmpire();if(k==='2')showResearch();if(k==='3')showDiplomacy();if(k==='q')view.rotate(-Math.PI/8);if(k==='e')view.rotate(Math.PI/8);if(k==='+'||k==='=')view.zoomBy(.86);if(k==='-')view.zoomBy(1.16);if(k==='escape'){selected=null;combatTarget=null;updateSelectionView();renderSelection();renderLabels();}});

async function unpackEngine(s){if(s.startsWith('raw:'))return s.slice(4);const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();}
async function packEngine(s){if(!window.CompressionStream)return'raw:'+s;const buf=new Uint8Array(await new Response(new Blob([s]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());let str='';for(let i=0;i<buf.length;i+=8192)str+=String.fromCharCode(...buf.subarray(i,i+8192));return btoa(str);}
async function loadThree(){
 if(engineLoading||view.engine==='three')return;engineLoading=true;if(dialog?.type==='settings')showSettings();
 let coreURL,renderURL;
 try{
  let core,render;try{enginePack=JSON.parse($('engine-pack').textContent)||JSON.parse(localStorage.getItem(ENGINE_KEY)||'null');}catch{enginePack=null;}
  if(enginePack){try{[core,render]=await Promise.all([unpackEngine(enginePack.core),unpackEngine(enginePack.render)]);}catch{enginePack=null;try{localStorage.removeItem(ENGINE_KEY);}catch{}}}
  if(!enginePack){
   const sources=['https://cdn.jsdelivr.net/npm/three@0.186.0/build/','https://unpkg.com/three@0.186.0/build/','https://raw.githubusercontent.com/mrdoob/three.js/r186/build/'];
   for(const base of sources){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),6500);try{[core,render]=await Promise.all(['three.core.js','three.module.js'].map(async n=>{const r=await fetch(base+n,{signal:ctrl.signal,cache:'force-cache'});if(!r.ok)throw Error('Engine download failed.');return r.text();}));if(!core.includes('REVISION')||!render.includes('WebGLRenderer'))throw Error('Invalid engine response.');break;}catch(e){core=null;render=null;ctrl.abort();}finally{clearTimeout(timer);}}
   if(!core||!render)throw Error('The 3D engine is not available.');
   enginePack={core:await packEngine(core),render:await packEngine(render)};try{localStorage.setItem(ENGINE_KEY,JSON.stringify(enginePack));}catch{}
  }
  coreURL=URL.createObjectURL(new Blob([core],{type:'text/javascript'}));renderURL=URL.createObjectURL(new Blob([render.replaceAll('./three.core.js',coreURL)],{type:'text/javascript'}));
  const T=await import(renderURL);await view.useThree(T);engineState=view.engine==='three'?'Three.js r'+T.REVISION:'The light renderer is ready. WebGL 2 is not available.';
 }catch(e){engineState='Offline-ready light renderer. Connect for full 3D.';console.info('Crown & Clay: light renderer active. Full gameplay is available.');}
 finally{engineLoading=false;setTimeout(()=>{if(coreURL)URL.revokeObjectURL(coreURL);if(renderURL)URL.revokeObjectURL(renderURL);},1000);if(dialog?.type==='settings')showSettings();}
}
renderHud();renderSelection();renderLabels();drawMinimap();requestAnimationFrame(()=>setTimeout(loadThree,120));
