<style>
:root {
  --ink: #1b1026;
  --paper: #fff6e0;
  --wumpa: #ff9a2a;
  --wumpa-deep: #e2641a;
  --sky: #5ad1ff;
  --blue: #2d6fd6;
  --panel: rgba(20, 10, 36, 0.86);
  --focus: #ffd84a;
  --muted: #c9b8e6;
  --danger: #ff5a6e;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --panel: rgba(20, 10, 36, 0.9); }
}
:root[data-theme="dark"] { --panel: rgba(20, 10, 36, 0.9); }
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: #0d0716;
  color: var(--paper);
  font-family: "Nunito", system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
#view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; }
#ui { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
[hidden] { display: none !important; }

/* HUD */
#hud { position: absolute; inset: 0; }
.hud-stat { position: absolute; font-weight: 900; text-shadow: 0 3px 0 var(--ink), 0 0 12px rgba(0,0,0,.4); }
#hud-top-left { position: absolute; top: 22px; left: 26px; display: flex; flex-direction: column; gap: 8px; }
#hud-top-right { position: absolute; top: 22px; right: 26px; text-align: right; display: flex; flex-direction: column; gap: 6px; }
.stat-row { display: flex; align-items: center; gap: 14px; font-size: clamp(30px, 3.4vw, 46px); }
.ico { width: 42px; height: 42px; border-radius: 50%; border: 4px solid var(--ink); display: inline-block; box-shadow: 0 4px 0 var(--ink); }
.ico.wumpa { background: radial-gradient(circle at 35% 35%, #ffd08a, var(--wumpa) 55%, var(--wumpa-deep)); }
.ico.life { background: radial-gradient(circle at 35% 35%, #ffe2b8, #f28c2b 60%, #a85414); }
#h-masks { font-size: clamp(22px, 2.2vw, 30px); color: #fff3a6; }
#h-invul { font-size: clamp(22px, 2.2vw, 30px); color: #9ef0ff; }
#h-crates { font-size: clamp(20px, 2vw, 28px); color: var(--muted); }
#h-timer { font-size: clamp(30px, 3vw, 42px); font-variant-numeric: tabular-nums; }
#h-gems { position: absolute; left: 26px; bottom: 26px; display: flex; gap: 12px; }
#h-gems .gem { width: 30px; height: 30px; transform: rotate(45deg); background: #3c2c55; border: 4px solid var(--ink); box-shadow: 0 4px 0 var(--ink); border-radius: 4px; }
#h-gems .gem.got { background: var(--c); box-shadow: 0 0 16px var(--c), 0 4px 0 var(--ink); }
#h-level { position: absolute; top: 30%; left: 0; right: 0; text-align: center; }
#h-level .tag { font-size: clamp(22px, 2.4vw, 32px); color: var(--focus); font-weight: 900; letter-spacing: 0.15em; text-transform: uppercase; animation: fadeOut 3s forwards; }
#h-level .name { font-family: "Luckiest Guy", "Nunito", cursive; font-size: clamp(56px, 8vw, 110px); line-height: 1; text-shadow: 0 6px 0 var(--ink), 0 0 30px rgba(0,0,0,.5); animation: fadeOut 3s forwards; }
@keyframes fadeOut { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
#h-boss { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); width: min(60vw, 720px); text-align: center; }
#h-boss .name { font-family: "Luckiest Guy", cursive; font-size: 36px; text-shadow: 0 3px 0 var(--ink); color: #ffb7d6; }
#h-boss .bar { height: 26px; border: 4px solid var(--ink); border-radius: 14px; background: #2b1d3f; overflow: hidden; box-shadow: 0 4px 0 var(--ink); }
#h-boss-fill { display: block; height: 100%; width: 100%; background: linear-gradient(#ffb7d6, #ff5a9e); transition: width .3s; }
#h-attract { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); font-family: "Luckiest Guy", cursive; font-size: clamp(26px, 3vw, 40px); color: var(--focus); text-shadow: 0 3px 0 var(--ink); animation: blink 1.2s steps(2) infinite; text-align: center; }
#h-attract small { display: block; font-family: "Nunito", sans-serif; font-weight: 900; color: var(--paper); font-size: clamp(18px, 1.8vw, 24px); }
@keyframes blink { 50% { opacity: .35; } }
#h-toasts { position: absolute; left: 0; right: 0; top: 46%; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
.toast { font-family: "Luckiest Guy", cursive; text-shadow: 0 5px 0 var(--ink), 0 0 20px rgba(0,0,0,.4); animation: pop 1.6s ease-out forwards; }
.toast.big { font-size: clamp(54px, 7vw, 96px); color: #fff3a6; }
.toast.small { font-size: clamp(30px, 3.2vw, 44px); color: #fff; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 12% { transform: scale(1.12); opacity: 1; } 22% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }

/* Menus */
#menu {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 4vh 5vw; pointer-events: auto;
  background: radial-gradient(ellipse at center, rgba(13,7,22,.15), rgba(13,7,22,.7));
}
.panel {
  width: min(1040px, 100%); max-height: 92vh; overflow: auto;
  background: var(--panel); border: 6px solid var(--ink); border-radius: 26px;
  box-shadow: 0 10px 0 var(--ink), 0 30px 60px rgba(0,0,0,.5);
  padding: clamp(22px, 3vw, 44px) clamp(22px, 4vw, 56px);
}
.panel header h1 { margin: 0; font-family: "Luckiest Guy", cursive; font-weight: 400; font-size: clamp(44px, 5.4vw, 74px); line-height: 1.02; color: var(--wumpa); text-shadow: 0 6px 0 var(--ink); }
.panel .subtitle { margin: 8px 0 0; font-size: clamp(20px, 2vw, 26px); color: var(--muted); font-weight: 800; }
.panel.title { text-align: center; }
.panel.title header h1 { font-size: clamp(64px, 9vw, 130px); background: linear-gradient(#fff3a6, var(--wumpa) 55%, var(--wumpa-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 var(--ink)); }
.panel .body { margin: 22px 0 6px; font-size: clamp(20px, 2vw, 26px); line-height: 1.45; color: var(--paper); }
.panel .body p { margin: 0 0 12px; }
.panel .hint { color: var(--muted); }
.panel .capture { color: var(--focus); font-size: clamp(24px, 2.6vw, 32px); font-weight: 900; }
.panel .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin: 6px 0 10px; }
.panel .stats div { background: rgba(255,255,255,.06); border: 3px solid var(--ink); border-radius: 18px; padding: 14px 16px; text-align: center; }
.panel .stats b { display: block; font-size: clamp(38px, 4vw, 54px); font-variant-numeric: tabular-nums; color: var(--focus); }
.panel .stats span { font-size: clamp(16px, 1.6vw, 20px); color: var(--muted); font-weight: 800; }
.panel dl.info { display: grid; grid-template-columns: max-content 1fr; gap: 10px 22px; font-size: clamp(16px, 1.6vw, 20px); margin: 0 0 16px; }
.panel dl.info dt { color: var(--focus); font-weight: 900; }
.panel dl.info dd { margin: 0; color: var(--paper); }
.items { list-style: none; margin: 22px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.item {
  display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
  padding: 16px 24px; border-radius: 18px; border: 4px solid transparent;
  background: rgba(255,255,255,.05); cursor: pointer;
  font-size: clamp(26px, 2.8vw, 36px); font-weight: 900; transition: transform .08s, background .12s;
}
.item .label { flex: 1 1 auto; }
.item .value { font-variant-numeric: tabular-nums; color: var(--focus); font-size: .8em; }
.item .sub { font-size: clamp(17px, 1.7vw, 22px); color: var(--muted); font-weight: 800; flex-basis: 100%; }
.item.focus { background: linear-gradient(90deg, rgba(255,216,74,.22), rgba(255,154,42,.12)); border-color: var(--focus); transform: translateX(8px); }
.item.focus .label { color: #fff; }
.item.disabled { opacity: .45; cursor: default; }
.panel.title .items { max-width: 620px; margin-left: auto; margin-right: auto; text-align: left; }
.panel footer { margin-top: 26px; font-size: clamp(16px, 1.6vw, 20px); color: var(--muted); font-weight: 800; text-align: center; }

/* Touch gate */
#touch { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6vh 6vw; pointer-events: auto; background: radial-gradient(ellipse at center, rgba(13,7,22,.2), rgba(13,7,22,.85)); }
#touch .card { background: var(--panel); border: 6px solid var(--ink); border-radius: 26px; padding: 40px 48px; max-width: 780px; box-shadow: 0 10px 0 var(--ink); }
#touch h1 { font-family: "Luckiest Guy", cursive; font-weight: 400; font-size: clamp(40px, 6vw, 72px); color: var(--wumpa); margin: 0 0 14px; text-shadow: 0 5px 0 var(--ink); }
#touch p { font-size: clamp(20px, 2.2vw, 28px); line-height: 1.45; margin: 0 0 26px; color: var(--paper); }
#touch button { font: inherit; font-size: clamp(24px, 2.6vw, 32px); font-weight: 900; color: var(--ink); background: var(--focus); border: 4px solid var(--ink); border-radius: 18px; padding: 14px 34px; box-shadow: 0 6px 0 var(--ink); cursor: pointer; }

#fatal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8vh 8vw; background: #0d0716; z-index: 3; }
#fatal p { font-size: clamp(22px, 2.6vw, 32px); max-width: 900px; line-height: 1.5; }
#fatal h1 { font-family: "Luckiest Guy", cursive; font-weight: 400; color: var(--wumpa); font-size: clamp(48px, 6vw, 80px); }
@media (max-width: 720px) {
  #hud-top-left { left: 16px; top: 16px; }
  #hud-top-right { right: 16px; top: 16px; }
  .panel { padding: 18px; }
  .item { padding: 12px 16px; }
}
@media (prefers-reduced-motion: reduce) { .toast, #h-attract, #h-level .tag, #h-level .name { animation: none; } }
</style>
