<section id="screen-about" class="screen panel-screen" aria-label="About and credits"><div class="menu-panel about-panel"><div class="panel-top"><div><div class="eyebrow">INDEPENDENT FLIGHT / ORIGINAL UNIVERSE</div><h2>FLIGHT LOG<span>.</span></h2></div><button class="back-button" data-action="back">\u25CB BACK</button></div><p class="panel-description">A love letter to the thrilling, strange skies of arcade space flight.</p><div class="report-scroll" tabindex="0"><h3>Source Information</h3><dl><dt>Date</dt><dd>2026-10-21 11:23 UTC</dd><dt>Source</dt><dd>StarFox 64</dd><dt>Game title</dt><dd>Star Corsair 64 \u2014 Operation Dustfall. Selected using Python secrets.randbelow from 50 silently brainstormed names.</dd><dt>Tech</dt><dd>Three.js 0.180.0 (r180), native WebGL, Web Audio API, HTML5/CSS/JavaScript (ES2022 bundle); esbuild 0.25.12 build tool. Embedded Barlow Condensed and Space Grotesk fonts under SIL OFL 1.1.</dd><dt>Art Direction</dt><dd>Original procedural low-poly 3D space western: faceted starfighters, warm sandstone canyons and ruined foundries transitioning to deep-blue orbit, emissive turquoise engines, a ringed moon, and a bold cream/lime cockpit interface.</dd><dt>Animation</dt><dd>Delta-time transform animation, procedural formation flight and steering, interpolated camera tracking, barrel-roll rotations, guided projectiles, particle/debris physics, shader sky transition, streaming scenery, and a three-phase animated boss.</dd><dt>Testing</dt><dd>Two text-only Playwright 1.63.0 runs in headless Google Chrome 154.0.8037.57: 19 checks in the first run and 22 in the final run, 41 passed check executions. Verified standalone boot, keyboard and simulated standard gamepad mappings, both inversion axes, boost/brake, firing, seekers, bombs, rolls, pause, ten-second attract entry, input exit, five-act AI play and looping. Found 0 issues, 0 browser errors, and 0 critical issues. No screenshots, image inspection, rendering review, or review subagents. Physical controller verification: unknown.</dd><dt>Environment</dt><dd>Codex CLI; Ubuntu 26.04.1 LTS on WSL2 (6.18.33.2-microsoft-standard-WSL2); headless Google Chrome 154.0.8037.57 with software WebGL for text checks.</dd><dt>Model</dt><dd>OpenAI. Requested model: gpt-6.1-sol; requested reasoning effort: ultra; runner: codex. Actual serving model: unknown.</dd></dl><h3>Engine Feedback</h3><h4>What did you like most about the engine?</h4><p>Three.js makes procedural geometry, materials, lighting, and a self-contained WebGL scene straightforward without an asset pipeline.</p><h4>Did you get stuck or guess wrong?</h4><p>No engine blocker. During integration I corrected mismatched UI visibility conventions, roll angle wrapping, and instructions that described mechanics differently from their implementation.</p><h4>What was the most important thing you had to build yourself?</h4><p>The controller-first flight and mission runtime: input and menu focus, combat, mission events, route selection, wingmate rescues, checkpoint recovery, the boss, and AI attract play.</p><h4>What was the hardest part about using the engine?</h4><p>Keeping screen-space targeting, world-space projectile collision, camera motion, and temporary GPU resource ownership consistent.</p><h4>If you had to remove or overhaul one thing from the engine, what would that be?</h4><p>Overhaul manual geometry, texture, and material lifetime management with scoped automatic disposal.</p><h4>If you could change one thing about the engine, what would it be?</h4><p>Add a first-class gamepad action and accessible menu-focus layer with dependable device remapping.</p><h3>Prompt Feedback</h3><p>Prompt version: 404299fcd4</p><h4>What did you like most about this prompt?</h4><p>The concrete single-file deliverable, controller-first direction, mandatory attract mode, and explicit text-only testing boundary.</p><h4>What was confusing?</h4><p>Feature-complete does not define a fixed list of required mechanics or a specific demo duration, so the vertical-slice boundaries required judgment.</p><h4>What was the hardest thing to do?</h4><p>Integrating a complete mission, combat systems, menus, audio, and credits into a coherent standalone game.</p><h4>If there was one test you could have run, what would that test be?</h4><p>A physical DualSense playthrough from title to boss to assess stick polarity, control feel, vibration, and couch-distance readability. This was not performed.</p><h3>Credits &amp; licenses</h3><p>Original game design, code, procedural art, and synthesized score created for this run. Inspiration: StarFox 64. No source game assets used. Three.js: the Three.js authors, MIT. Barlow Condensed: The Barlow Project Authors. Space Grotesk: The Space Grotesk Project Authors. Fonts: SIL Open Font License 1.1. Full license texts are included in the HTML source comment.</p><div class="usage-line"><span data-gpt-hub-usage>Usage: Session time 24m 19s; tokens 2,326,991 total (2,276,763 input including 2,217,856 cached and 0 cache-write; 50,228 output including 16,539 reasoning); API cost $0.841880 USD (Estimated standard API token cost; not subscription billing).</span></div></div><div class="panel-foot">LEFT STICK / \u2191 \u2193 SCROLL \xB7 \u25CB / ESC BACK \xB7 ORIGINAL WORLD, GEOMETRY, MUSIC & SOUND</div></div></section>
