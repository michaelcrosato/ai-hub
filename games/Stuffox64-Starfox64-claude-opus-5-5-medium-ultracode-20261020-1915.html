<!--
STUFFOX 64: an original spiritual successor to Starfox 64 (N64)

== Stuffox 64 ==
  An original spiritual successor to Star Fox 64. A squadron of plush pilots defends the patchwork planet Quiltara from Baron Ratchet's wind-up tin-toy armada.
  Pilots: Tod Patchwell (fox), Bramble (badger), Pippa (bunny), Gizmo (owl). Command: Gen. Woolsey. Villains: Baron Ratchet and the Tin Jackals (Vex, Snarl, Quill).
  All characters, levels, models, music, sound and voices are original and procedurally generated in code. No assets from the source game are used.

== Source Information ==
  Date: 2026-10-20 19:15
  Source: Starfox 64 for N64
  Tech: Three.js r180 (three@0.180.0: WebGPURenderer, TSL node materials, ToonOutlinePassNode, BloomNode), WebGPU only with no WebGL fallback, Rapier 0.19.3 (@dimforge/rapier3d-compat) physics, Web Audio API (synthesized music, SFX and voice chatter), Gamepad API (standard mapping, dual-rumble). Vanilla JavaScript ES modules bundled with esbuild 0.25 into a single HTML file. Three.js and Rapier load from the jsDelivr CDN.
  Art Direction: Stylized cel-shading: MeshToonNodeMaterial with a 4-step hard light ramp, screen-space ink outlines (toonOutlinePass), HDR emissive glows with bloom, quilt-patchwork vertex-colored terrain. Plush-toy heroes with button eyes and stitches against glossy tin wind-up enemies.
  Animation: Procedural, code-driven animation (hierarchical transforms, sine-phase walk cycles for the boss legs, exponential damping for flight feel, barrel-roll/somersault/U-turn maneuver curves). Physics-driven debris, toppling towers and asteroids via Rapier. Scripted camera cutscenes. No skeletal or keyframe assets.
  Testing: The prompt said "Write no tests, do no tests, testing will be done separately." No tests were written or run. The only check was building the bundle with esbuild.
  Environment: Claude Code CLI (headless); Linux; browser unknown
  Model: Anthropic, claude-opus-5-5, reasoning effort medium-ultracode
  Usage: unknown (no cost, token or session-time estimates were available to the model)

== Engine Feedback ==
  What did you like most about the engine? Three.js r180's TSL node system and built-in toonOutlinePass. Cel-shading plus ink outlines plus bloom took a few lines, and per-material node graphs (animated water, sky gradient, waterfalls) needed no GLSL/WGSL.
  Did you get stuck or guess wrong? Mostly I had to check things against the package source: which post-processing nodes ship in r180, the toonOutlinePass signature, and Rapier 0.19's interaction-group rules for scene queries. Queries need their own membership bit, or sensor hitboxes that collide with nothing also become invisible to raycasts.
  What was the most important thing you had to build yourself? The game layer: a rail/all-range flight model, a data-driven level-event system, actor patterns and boss state machines, and a sensor-collider hitbox layer over Rapier for laser raycasts, lock-on and splash damage.
  What was the hardest part about using the engine? WebGPU-only rendering means no way to inspect the result here, and node materials fail at shader-build time rather than at the call site. Errors surface late and far from the cause.
  If you had to remove or overhaul one thing from the engine, what would that be? The silent automatic WebGL2 fallback in WebGPURenderer. For a "WebGPU, no fallback" target, it has to be detected and blocked by hand.
  If you could change one thing about the engine, what would it be? Ship a small, documented "game kit" layer: pooled particles, instanced outline-friendly props and a physics-sync helper for Rapier bodies. Every action game rebuilds these.

== Prompt Feedback ==
  What did you like most about this prompt? It sets a clear bar ("feature-complete vertical slice", with concrete reference demos) plus specific, testable UX rules: attract mode after 10 seconds, inverted-axis toggles, the touch-only message.
  What was confusing? The tension between "performance unlimited / out of scope" and a playable real-time game, and between the global instruction to visually test UI and this prompt's "do no tests". The usage/cost line asks for figures the model cannot observe.
  What was the hardest thing to do? Fitting the full Star Fox 64 move set (rails and all-range, barrel roll deflects, charged lock-on, bombs, somersault/U-turn, wingmate rescues, branching route, bosses with weak points, medals) into one coherent, self-contained build without being able to run it.
  If there was one test you could have run, what would that test be? A scripted Playwright run in a WebGPU-enabled Chromium. Boot the file, let attract mode start, and assert no console errors while it cycles through all three demo segments (rail stage, boss, all-range). That covers shader compilation, physics and most game systems in one pass.

== Controls (quick reference) ==
  Controller: L-Stick steer · ✕ fire/charge · □ bomb · R2 boost · L2 brake · L1/R1 bank, double-tap to barrel roll · △ somersault (L2+△ U-turn) · OPTIONS pause.
  Keyboard: WASD/Arrows · Space/J fire · K bomb · Shift boost · Ctrl brake · Q/E bank · R somersault · Esc pause.

var TitleScene = class {
  constructor(app) {
    this.app = app;
    this.physics = new Physics(-30);
    this.world = new RailWorld(app.scene, this.physics, () => "A");
    this.d = 1450;
    this.t = 0;
    this.root = new THREE8.Group();
    app.scene.add(this.root);
    this.ships = ["tod", "bramble", "pippa", "gizmo"].map((k, i) => {
      const f = makeFighter(k);
      this.root.add(f.root);
      return { f, off: [[0, 0, 0], [-12, -2, 9], [12, -3, 8], [0, 6, 16]][i], ph: i * 1.3 };
    });
    app.sun.color.setHex(16773596);
    app.sun.intensity = 3;
    app.hemi.color.setHex(13625599);
    app.hemi.groundColor.setHex(6978122);
    app.hemi.intensity = 1.4;
  }
  update(dt) {
    this.t += dt;
    this.d += 45 * dt;
    const base = new THREE8.Vector3(0, 34, -this.d);
    for (const s of this.ships) {
      s.f.root.position.set(base.x + s.off[0] + Math.sin(this.t * 0.8 + s.ph) * 2, base.y + s.off[1] + Math.sin(this.t * 1.1 + s.ph) * 1.5, base.z + s.off[2]);
      s.f.root.rotation.set(Math.sin(this.t + s.ph) * 0.05, 0, Math.sin(this.t * 0.8 + s.ph) * 0.25);
      s.f.flame.scale.y = 0.9 + Math.random() * 0.3;
    }
    const cam = this.app.camera, a = this.t * 0.12;
    cam.position.set(base.x + Math.sin(a) * 34 + 10, base.y + 6 + Math.sin(this.t * 0.2) * 4, base.z + Math.cos(a) * 30 - 8);
    cam.lookAt(base.x - 4, base.y + 2, base.z + 2);
    cam.fov = 55;
    cam.updateProjectionMatrix();
    this.app.sun.target.position.copy(base);
    this.app.sun.position.copy(base).add(new THREE8.Vector3(-140, 240, -120));
    this.app.sun.target.updateMatrixWorld();
    this.world.update(this.d, cam.position);
  }
  dispose() {
    this.app.scene.remove(this.root);
    this.world.dispose();
    this.physics.free();
  }
};
var App = class {
  async boot() {
    loadSettings();
    loadSave();
    this.input = new Input();
    this.audio = new Audio();
    const status = document.getElementById("boot-status");
    if (!navigator.gpu) return this.fatal("WebGPU is not available in this browser.", "Use a current Chrome, Edge, or Safari 26+ / Firefox with WebGPU enabled.");
    let adapter = null;
    try {
      adapter = await navigator.gpu.requestAdapter();
    } catch (e) {
      adapter = null;
    }
    if (!adapter) return this.fatal("No WebGPU adapter found.", "Your GPU or browser configuration does not expose WebGPU.");
    status.textContent = "Winding up the physics...";
    await initPhysics();
    status.textContent = "Stitching the renderer...";
    const renderer = this.renderer = new THREE8.WebGPURenderer({ antialias: true, forceWebGL: false });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE8.PCFSoftShadowMap;
    renderer.toneMapping = THREE8.NeutralToneMapping;
    renderer.toneMappingExposure = 1;
    document.getElementById("app").appendChild(renderer.domElement);
    await renderer.init();
    if (!renderer.backend || !renderer.backend.isWebGPUBackend) return this.fatal("WebGPU initialisation failed.", "This game requires WebGPU and has no WebGL fallback.");
    const scene = this.scene = new THREE8.Scene();
    this.camera = new THREE8.PerspectiveCamera(70, innerWidth / innerHeight, 0.5, 6e3);
    const sun = this.sun = new THREE8.DirectionalLight(16773596, 3);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const sc = sun.shadow.camera;
    sc.left = -160;
    sc.right = 160;
    sc.top = 160;
    sc.bottom = -160;
    sc.near = 10;
    sc.far = 800;
    sun.shadow.bias = -6e-4;
    sun.shadow.normalBias = 0.6;
    scene.add(sun);
    scene.add(sun.target);
    this.hemi = new THREE8.HemisphereLight(13625599, 6978122, 1.4);
    scene.add(this.hemi);
    this.post = new THREE8.PostProcessing(renderer);
    const scenePass = toonOutlinePass(scene, this.camera, new THREE8.Color(1315358), 32e-4, 1);
    const bloomPass = bloom(scenePass, 0.55, 0.35, 0.92);
    this.post.outputNode = scenePass.add(bloomPass);
    this.ui = new UI(this);
    addEventListener("resize", () => this.resize());
    this.input.on((type) => {
      if (type === "pad" && this.state === "touch" && this.input.padConnected) this.toTitle();
    });
    const unlock = () => this.audio.ensure();
    addEventListener("keydown", unlock);
    addEventListener("mousedown", unlock);
    addEventListener("touchstart", unlock);
    document.getElementById("boot").remove();
    this.clock = new THREE8.Timer();
    this.state = "boot";
    const touchOnly = navigator.maxTouchPoints > 0 && matchMedia("(hover: none) and (pointer: coarse)").matches && !matchMedia("(any-pointer: fine)").matches;
    if (touchOnly && !this.input.getPad()) {
      this.state = "touch";
      this.title = new TitleScene(this);
      this.ui.open("touch");
      addEventListener("keydown", () => {
        if (this.state === "touch") this.toTitle();
      }, { once: true });
    } else this.toTitle();
    renderer.setAnimationLoop((t) => this.frame(t));
  }
  fatal(msg, sub) {
    const b = document.getElementById("boot");
    b.innerHTML = `<div class="fatal"><div class="logo small">STUFFOX<span>64</span></div><h2>${msg}</h2><p>${sub}</p><p class="muted">This game needs WebGPU and has no fallback renderer.</p></div>`;
  }
  resize() {
    this.camera.aspect = innerWidth / innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(innerWidth, innerHeight);
  }
  // ---------------- state transitions ----------------
  ensureTitleScene() {
    if (!this.title) this.title = new TitleScene(this);
  }
  disposeGame() {
    if (this.game) {
      this.game.disposed = true;
      this.game.dispose();
      this.game = null;
    }
    this.ui.showHud(false);
    this.ui.clearTransient();
  }
  toTitle() {
    this.disposeGame();
    this.ensureTitleScene();
    this.state = "title";
    this.ui.stack.length = 0;
    this.ui.open("title");
    this.audio.playSong("title");
    this.input.touch();
  }
  toMain() {
    this.state = "menu";
    this.ui.stack.length = 0;
    this.ui.open("main");
    this.input.touch();
  }
  startStage(index, carry, campaign) {
    this.campaign = campaign;
    this.stageIndex = index;
    this.carry = carry || null;
    this.disposeGame();
    this.ensureTitleScene();
    this.state = "briefing";
    this.ui.stack.length = 0;
    this.ui.open("briefing", { stage: STAGES[index] });
    this.audio.voice("woolsey", STAGES[index].briefing[0][1]);
  }
  launch() {
    if (this.title) {
      this.title.dispose();
      this.title = null;
    }
    this.ui.close();
    this.game = new Game(this, this.stageIndex, { carry: this.carry });
    this.ui.showHud(true);
    this.state = "playing";
  }
  startAttract(i = 0) {
    if (this.title) {
      this.title.dispose();
      this.title = null;
    }
    this.disposeGame();
    this.ui.close();
    const seg = ATTRACT_SEQ[i % ATTRACT_SEQ.length];
    this.attractIdx = i;
    this.attractT = 0;
    this.attractSeg = seg;
    const opts = { attract: true, startD: seg.startD || 0, skipIntro: seg.skipIntro };
    this.game = new Game(this, seg.stage, opts);
    if (seg.startStep) {
      const idx = STAGES[seg.stage].steps.findIndex((s) => s.do === seg.startStep);
      this.game.stepIdx = Math.max(0, idx);
    }
    this.ai = new AIPilot();
    this.ui.showHud(true);
    this.state = "attract";
    this.attractStart = performance.now();
  }
  pause() {
    if (this.state !== "playing") return;
    this.state = "paused";
    this.audio.chargeStop();
    this.ui.open("pause");
    this.ui.stack.length = 0;
  }
  resume() {
    this.ui.close();
    this.state = "playing";
    this.resumeGuard = 0.2;
  }
  showResults() {
    const r = this.game.finalStats();
    const id = r.stage.id;
    save.best[id] = Math.max(save.best[id] || 0, r.carry.score);
    if (r.medal) save.medals[id] = true;
    save.cleared[id] = true;
    writeSave();
    this.lastResults = r;
    this.disposeGame();
    this.ensureTitleScene();
    this.state = "results";
    this.ui.open("results", r);
    this.audio.playSong("title");
    const el = document.querySelector("#menu .count");
    if (el) {
      const to = +el.dataset.to;
      let v = 0;
      const iv = setInterval(() => {
        v = Math.min(to, v + Math.max(1, Math.ceil(to / 40)));
        el.textContent = v;
        this.audio.menuMove();
        if (v >= to) clearInterval(iv);
      }, 35);
    }
  }
  menuAction(act, data, screen) {
    switch (screen) {
      case "touch":
        if (act === "settings") this.ui.push("settings");
        break;
      case "title":
        if (act !== "back") this.toMain();
        break;
      case "main":
        if (act === "new") this.startStage(0, null, true);
        else if (act === "select") this.ui.push("select");
        else if (act === "howto") this.ui.push("howto", { tab: 0 });
        else if (act === "settings") this.ui.push("settings");
        else if (act === "about") this.ui.push("about");
        else if (act === "back") this.toTitle();
        break;
      case "select":
        if (act === "stage") this.startStage(+data.stage, null, true);
        else if (act === "back") this.ui.pop();
        break;
      case "briefing":
        if (act === "launch") this.launch();
        else if (act === "back") {
          this.toTitle();
          this.toMain();
        }
        break;
      case "settings":
        if (act === "reset") {
          resetSettings();
          this.audio.applyVolumes();
          this.ui.render();
        } else if (act === "back") {
          if (!this.ui.pop()) this.toTitle();
        }
        break;
      case "howto":
      case "about":
        if (act === "back") {
          if (!this.ui.pop()) this.toTitle();
        }
        break;
      case "pause":
        if (act === "resume" || act === "back") this.resume();
        else if (act === "restart") {
          const c = this.game.carry;
          this.disposeGame();
          this.carry = c;
          this.launch();
        } else if (act === "howto") this.ui.push("howto", { tab: 0 });
        else if (act === "settings") this.ui.push("settings");
        else if (act === "quit") this.toTitle();
        break;
      case "results":
        if (act === "next" || act === "back") {
          const r = this.lastResults;
          if (r.stage.id === 1) this.startStage(1, r.carry, true);
          else {
            this.state = "demoend";
            this.ui.open("demoend", { score: r.carry.score });
            this.audio.playSong("clear");
          }
        }
        break;
      case "gameover":
        if (act === "continue") {
          this.startStage(this.stageIndex, null, this.campaign);
        } else if (act === "quit" || act === "back") this.toTitle();
        break;
      case "demoend":
        if (act === "credits") this.ui.push("about");
        else this.toTitle();
        break;
    }
  }
  humanCtl() {
    const i = this.input;
    return {
      lx: i.lx,
      ly: i.ly,
      fire: i.down.fire,
      firePressed: i.pressed.fire,
      fireReleased: i.released.fire,
      autoFire: false,
      bombPressed: i.pressed.bomb,
      boost: i.boostAxis,
      brake: i.brakeAxis,
      bankL: i.down.bankL,
      bankR: i.down.bankR,
      rollEvent: i.rollEvent,
      loopPressed: i.pressed.loop
    };
  }
  frame() {
    this.clock.update();
    const dt = Math.min(0.05, this.clock.getDelta());
    const input = this.input;
    input.update(dt);
    if (input.anyPressed) this.audio.ensure();
    switch (this.state) {
      case "touch":
        this.title && this.title.update(dt);
        this.ui.updateMenu(input, dt);
        break;
      case "title":
      case "menu":
        this.title.update(dt);
        this.ui.updateMenu(input, dt);
        if ((this.ui.screen === "title" || this.ui.screen === "main") && input.idleSeconds() > 10) this.startAttract(0);
        break;
      case "briefing":
      case "results":
      case "demoend":
      case "gameover":
        if (this.title) this.title.update(dt);
        this.ui.updateMenu(input, dt);
        break;
      case "playing": {
        this.resumeGuard = (this.resumeGuard || 0) - dt;
        if (input.pressed.pause && this.resumeGuard <= 0) {
          this.pause();
          break;
        }
        const g = this.game;
        g.update(dt, this.resumeGuard > 0 ? { ...this.humanCtl(), firePressed: false, bombPressed: false } : this.humanCtl());
        this.ui.updateHud(g.hudState(), this.camera, dt);
        if (g.result) {
          if (g.result.type === "clear") this.showResults();
          else if (g.result.type === "gameover") {
            this.disposeGame();
            this.ensureTitleScene();
            this.state = "gameover";
            this.ui.open("gameover");
            this.audio.playSong("gameover");
          }
        }
        break;
      }
      case "paused":
        this.ui.updateMenu(input, dt);
        if (this.state === "paused" && input.pressed.pause && this.ui.screen === "pause" && !input.pressed.back) this.resume();
        break;
      case "attract": {
        const g = this.game;
        this.attractT += dt;
        g.update(dt, this.ai.update(dt, g));
        this.ui.updateHud(g.hudState(), this.camera, dt);
        if (input.lastInput > this.attractStart + 400) {
          this.toTitle();
          break;
        }
        if (this.attractT > this.attractSeg.dur || g.result) {
          if (this.attractIdx + 1 >= ATTRACT_SEQ.length) this.toTitle();
          else this.startAttract(this.attractIdx + 1);
        }
        break;
      }
    }
    this.post.render();
  }
};
new App().boot().catch((e) => {
  console.error(e);
  const b = document.getElementById("boot");
  if (b) b.innerHTML = `<div class="fatal"><h2>Something came unstitched.</h2><p>${String(e && e.message || e)}</p></div>`;
});

</script>
</body>
