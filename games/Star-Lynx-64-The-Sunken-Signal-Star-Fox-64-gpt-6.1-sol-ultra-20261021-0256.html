  buttons() {

  markFocus(move = true) {
    const list = this.buttons();

    list.forEach((b, i) => b.classList.toggle("selected", i === this.focusIndex));

      } else {
        mode = e.success ? "debrief" : "gameover";
        showScreen(e.success ? "debrief" : "gameover", { ...sim.debrief, checkpoint: !!sim.checkpoint });
        if (e.success) {
          audio.sfx("victory");
          if (sim.score > best) {
            best = sim.score;
            try {
              localStorage.setItem("star-lynx-best", String(best));
            } catch {
            }
          }
        } else audio.sfx("alarm");
      }
    }
  }
}
function steerMenu(dt) {
  menuRepeat -= dt;
  let dir = null;
  for (const k of ["up", "down", "left", "right"]) if (input.pressed.has(k) || input.held.has(k) && menuRepeat <= 0) {
    dir = k;
    break;
  }
  if (dir) {
    ui.navigate(dir);
    audio.sfx("menu", 0.8);
    menuRepeat = 0.18;
  }
  if (input.pressed.has("confirm")) ui.confirm();
  if (input.pressed.has("back")) {
    if (currentScreen === "pause") action("resume");
    else ui.back();
  }
}
function syncVisuals(dt) {
  const active = ["playing", "attract", "paused", "debrief", "gameover"].includes(mode);
  const p = sim.player;
  const reduced = ui.settings.reducedMotion;
  if (active) {
    playerMesh.position.set(p.x, p.y, p.z);
    playerMesh.rotation.set(-input.y * 0.13, -input.x * 0.12, -input.x * 0.45);
    if (sim.attract) {
      playerMesh.rotation.z = -Math.sin(sim.time * 2) * 0.2;
    }
    if (p.roll > 0) playerMesh.rotation.z += Math.PI * 2 * (1 - p.roll / 0.65);
    if (p.special > 0) {
      const f = 1 - p.special / 1.2;
      playerMesh.rotation.x -= f * Math.PI * 2;
      playerMesh.position.y += Math.sin(f * Math.PI) * 6;
    }
    playerMesh.visible = !(p.invulnerable > 0 && Math.floor(sim.time * 15) % 2 === 0 && !sim.attract) && p.hp > 0;
    if (cockpit) playerMesh.visible = false;
    for (let i = 0; i < wingMeshes.length; i++) {
      const w = wingMeshes[i], status = sim.wingmates[i];
      w.visible = status.hp > 0;
      const s = i === 0 ? -1 : 1;
      w.position.set(p.x + s * (sim.command === "attack" ? 10 : 6) + Math.sin(sim.time + i) * 0.8, p.y + 1.5 + i * 0.6, p.z + 3 + i * 2);
      w.rotation.z = -input.x * 0.3 + s * 0.08;
    }
    for (const [id, o] of objects) {
      const a = sim.actors.get(id);
      if (!a) continue;
      o.position.set(a.x, a.y, a.z);
      if (a.kind === "relay" || a.type === "pickup") o.rotation.z += dt * (a.kind === "ring" ? 0.25 : 0.9);
      if (a.type === "enemy" && a.kind !== "core" && a.kind !== "relay") {
        o.rotation.z = Math.sin(a.age * 1.6) * 0.2;
        o.rotation.y = Math.sin(a.age) * 0.1;
      }
      if (a.kind === "core") {
        o.scale.setScalar(sim.boss?.shielded ? 1.12 : 1 + Math.sin(sim.time * 6) * 0.04);
        o.visible = !(sim.boss?.shielded && Math.floor(sim.time * 4) % 2);
      }
      if (o.userData.flash > 0) {
        o.userData.flash -= dt;
        o.scale.multiplyScalar(1.03);
      } else if (a.kind !== "core") o.scale.lerp(new THREE2.Vector3(1, 1, 1), 0.3);
      if (a.type === "shot" || a.type === "hostile") o.lookAt(a.x + a.vx, a.y + a.vy, a.z + a.vz);
    }
    if (bossMesh && sim.core) {
      bossMesh.position.set(sim.core.x, sim.core.y, sim.core.z);
      bossMesh.rotation.z = Math.sin(sim.time * 0.6) * 0.025;
      if (sim.boss?.defeated) {
        bossMesh.rotation.z += sim.extraction * 0.12;
        bossMesh.position.y -= sim.extraction * 3;
        bossMesh.position.z -= sim.extraction * 2;
      }
    }
    if (mode === "playing" || mode === "attract") {
      const targetPos = new THREE2.Vector3(p.x * (cockpit ? 0.4 : 0.22), cockpit ? p.y + 1 : 8 + p.y * 0.16, cockpit ? p.z - 1 : 28 + (sim.boost ? -2 : 0));
      camera.position.lerp(targetPos, 1 - Math.exp(-dt * 4));
      const look = new THREE2.Vector3(p.x * 0.4, p.y * 0.45 + 2, -70);
      camera.lookAt(look);
      camera.fov = THREE2.MathUtils.lerp(camera.fov, sim.boost ? 72 : brakeHeld() ? 57 : 63, dt * 3);
      camera.updateProjectionMatrix();
      if (shake > 0 && !reduced) {
        camera.position.x += (Math.random() - 0.5) * shake;
        camera.position.y += (Math.random() - 0.5) * shake;
      }
    }
    const state = sim.state;
    const target = sim.actors.get(p.lockId);
    if (target) {
      screenPoint.set(target.x, target.y, target.z).project(camera);
      state.target = { x: (screenPoint.x * 0.5 + 0.5) * 100, y: (-screenPoint.y * 0.5 + 0.5) * 100, visible: screenPoint.z < 1 };
    } else {
      screenPoint.set(p.x + input.x * 10, p.y + input.y * 7, -85).project(camera);
      state.target = { x: clamp4((screenPoint.x * 0.5 + 0.5) * 100, 10, 90), y: clamp4((-screenPoint.y * 0.5 + 0.5) * 100, 12, 85), visible: true };
    }
    ui.update(state);
    art.update(dt, { time: sim.time, distance: sim.distance, phase: sim.phase === "extraction" ? "sunset" : sim.phase, route: sim.route, boost: sim.boost, player: p });
    if ((mode === "playing" || mode === "attract") && Math.random() < 0.65 && !reduced) art.trail(new THREE2.Vector3(p.x, p.y, p.z + 2.6), sim.boost ? 16762495 : 8323042);
  } else {
    titleDistance += dt * 14;
    playerMesh.visible = true;
    playerMesh.position.set(8 + Math.sin(backdropTime * 0.3) * 1.5, 8 + Math.sin(backdropTime * 0.6) * 0.6, -2);
    playerMesh.rotation.set(0.06, -0.25 + Math.sin(backdropTime * 0.2) * 0.14, -0.12 + Math.sin(backdropTime * 0.4) * 0.06);
    wingMeshes.forEach((w) => w.visible = false);
    camera.position.lerp(new THREE2.Vector3(0, 8, 28), 0.04);
    camera.lookAt(1, 5, -60);
    camera.fov = 63;
    camera.updateProjectionMatrix();
    art.update(dt, { time: backdropTime, distance: titleDistance, phase: "coast", route: "", boost: false, player: { x: 8, y: 8, z: -2 } });
    ui.update({ mode: "title", attract: false });
  }
  shake = Math.max(0, shake - dt * 1.2);
  bombFlash = Math.max(0, bombFlash - dt * 1.6);
  document.getElementById("flash").style.opacity = String(bombFlash * 0.65);
  cinematic = Math.max(0, cinematic - dt);
}
function brakeHeld() {
  return input.held.has("brake");
}
function frame(now) {
  const dt = Math.min((now - lastFrame) / 1e3, 0.05);
  lastFrame = now;
  backdropTime += dt;
  input.poll(dt, ui.settings);
  if (ui.settings.vibration === false) input.vibrationEnabled = false;
  else input.vibrationEnabled = true;
  ui.setInput(input.gamepad);
  if (mode === "paused" && currentScreen === "pause" && input.pressed.has("pause")) action("resume");
  else if (mode === "playing") {
    if (input.pressed.has("pause")) pause();
    if (input.pressed.has("view")) {
      cockpit = !cockpit;
      ui.toast(cockpit ? "COCKPIT CAMERA" : "CHASE CAMERA", "V / \u25B3 to switch", 2);
    }
  } else if (mode !== "attract") steerMenu(dt);
  if (mode === "title" && ready && now - lastActivity >= 1e4) start(true);
  if (mode === "playing" || mode === "attract") {
    for (const edge of input.pressed) pendingPressed.add(edge);
    for (const edge of input.released) pendingReleased.add(edge);
    accumulator += dt;
    while (accumulator >= 1 / 60) {
      sim.update(1 / 60, { x: input.x, y: input.y, held: input.held, pressed: pendingPressed, released: pendingReleased });
      pendingPressed.clear();
      pendingReleased.clear();
      consumeEvents();
      accumulator -= 1 / 60;
    }
  }
  syncVisuals(dt);
  audio.update(dt, { phase: sim.phase === "extraction" ? "clear" : sim.phase, intensity: sim.phase === "boss" ? 0.9 : 0.4, boost: sim.boost, health: sim.player.hp, attract: mode === "attract" });
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
async function init() {
  ui = new UI({ action });
  ui.setMetadata(metadataHTML());
  applySettings();
  input = new Input(activity);
  let pointerX = 0, pointerY = 0;
  window.addEventListener("pointermove", (e) => {
    if (Math.hypot(e.clientX - pointerX, e.clientY - pointerY) > 5) {
      pointerX = e.clientX;
      pointerY = e.clientY;
      activity();
    }
  }, { passive: true });
  window.addEventListener("keydown", () => audio.unlock(), { passive: true });
  window.addEventListener("pointerdown", () => audio.unlock(), { passive: true });
  window.addEventListener("blur", () => {
    if (mode === "playing") pause();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && mode === "playing") pause();
  });
  showScreen("title", { best });
  if (!navigator.gpu) throw new Error("WebGPU is unavailable. Open on HTTPS or localhost in a WebGPU-capable browser.");
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error("A WebGPU graphics adapter is required.");
  renderer = new THREE2.WebGPURenderer({ antialias: true, alpha: false });
  renderer._getFallback = null;
  await renderer.init();
  if (!renderer.backend.isWebGPUBackend) throw new Error("A WebGPU backend could not be initialized.");
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(7848397);
  renderer.outputColorSpace = THREE2.SRGBColorSpace;
  renderer.toneMapping = THREE2.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.domElement.id = "viewport";
  document.body.prepend(renderer.domElement);
  scene = new THREE2.Scene();
  scene.background = new THREE2.Color(8177103);
  scene.fog = new THREE2.Fog(9160396, 140, 670);
  camera = new THREE2.PerspectiveCamera(63, innerWidth / innerHeight, 0.1, 1800);
  camera.position.set(0, 8, 28);
  camera.lookAt(0, 5, -60);
  const light = new THREE2.DirectionalLight(16768946, 3);
  light.position.set(-80, 100, 30);
  scene.add(light);
  scene.add(new THREE2.HemisphereLight(11069676, 6636896, 2));
  await RAPIER.init({});
  sim = new Simulation(RAPIER, ui.settings);
  art = createVisuals(scene);
  playerMesh = art.ship("player");
  scene.add(playerMesh);
  wingMeshes = [art.ship("mica"), art.ship("rook")];
  wingMeshes.forEach((w) => {
    w.scale.setScalar(0.7);
    scene.add(w);
  });
  window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  ready = true;
  bootEl.remove();
  lastActivity = performance.now();
  lastFrame = performance.now();
  requestAnimationFrame(frame);
}
init().catch((error) => {
  console.error(error);
  bootEl.innerHTML = `<div class="boot-mark">SL / 64</div><h1>Flight systems unavailable</h1><p>${String(error.message).replace(/[<>]/g, "")}</p><p>This game requires WebGPU and an internet connection for its pinned engine modules.</p><button id="retryBoot">Retry initialization</button><button id="bootSettings">Settings & controls</button>`;
  bootEl.classList.add("failed");
  document.getElementById("retryBoot").onclick = () => location.reload();
  document.getElementById("bootSettings").onclick = () => {
    bootEl.style.display = "none";
    showScreen("settings");
  };
});

</script>
