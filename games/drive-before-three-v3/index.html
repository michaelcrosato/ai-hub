gy.</p><button class="icon-button" data-action="goto" data-id="lunch" aria-label="Go to lunch">${BT.icon('chevron')}</button></section>`;

        change(e) {

                    this.draft.tone = el.value;

                    this.draft.palette = el.value;
                if (el.name === 'format')
                    this.draft.format = el.value;
                if (el.id === 'headline')
                    this.draft.headline = Number(el.value);
                this.updatePreview();
            }
            if (el.id === 'romance-setting') {
                this.game.state.romanceEnabled = el.checked;
                this.game.changed();
            }
            if (el.id === 'import-file' && el.files?.[0]) {
                if (el.files[0].size > 256000) {
                    this.toast('That file is too large.', 'Choose a Before Three JSON save under 250 KB.');
                    el.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const value = JSON.parse(String(reader.result));
                        if (!BT.Game.validate(value))
                            throw Error('invalid');
                        this.game.job = null;
                        this.game.state = BT.Game.upgrade(value);
                        this.game.started = true;
                        this.game.paused = false;
                        this.close();
                        this.lastPhase = '';
                        this.refresh();
                        this.game.save();
                        this.toast('Your story made the trip.', 'Save imported successfully.');
                    }
                    catch {
                        this.toast('That save couldn’t be read.', 'Please choose an unmodified Before Three JSON save. Your current game is unchanged.');
                    }
                    el.value = '';
                };
                reader.readAsText(el.files[0]);
            }
        }

                    t.detour = Number(d.id);

                    t.penalty += t.detour === 1 ? 2 : 5;
                    this.junctionOpen = false;
                    this.g.modal = false;
                    this.feedback = t.detour === 1 ? 'Signed connection taken. +2 game min.' : 'Stayed on the route. +5 game min.';
                    this.g.save();
                    this.renderTransit();
                    return true;
                }
                case 'my-life':
                    this.progress();
                    return true;
                case 'plans':
                    this.plans();
                    return true;
                case 'weekend-action':
                    if (d.id === 'shop') {
                        this.storeBoard();
                        return true;
                    }
                    if (d.id === 'date') {
                        this.plans();
                        return true;
                    }
                    break;
                case 'story-start':
                    this.app.close();
                    if (BT.startStory(this.g, d.id)) {
                        this.renderStory();
                    }
                    return true;
                case 'story-answer': {
                    const e = this.g.state.growth.event;
                    if (!e || this.storyReply)
                        return true;
                    const choice = Number(d.id), node = BT.storyLines(e.person, e.chapter)[e.step];
                    if (!node || !node.choices[choice])
                        return true;
                    const reply = node.choices[choice].reply;
                    if (BT.storyAnswer(this.g, choice)) {
                        this.storyReply = reply;
                        this.storySelected = 0;
                        this.renderStory();
                    }
                    return true;
                }
                case 'story-next': {
                    const e = this.g.state.growth.event;
                    if (!e)
                        return true;
                    this.storyReply = null;
                    if (e.step >= 3) {
                        this.app.close();
                        BT.finishStory(this.g);
                    }
                    else
                        this.renderStory();
                    return true;
                }
                case 'story-finish':
                    this.app.close();
                    BT.finishStory(this.g);
                    return true;
                case 'story-leave':
                    this.app.modal('End this outing?', 'YOUR CHOICE', `<p class="lead">You can leave at any time. Money and the activity slot stay used. You do not earn the story reward.</p>`, '<button class="button subtle" data-action="close">Keep talking</button><button class="button primary" data-action="story-leave-confirm">Head home</button>', false, 'leave-story');
                    return true;
                case 'story-leave-confirm':
                    this.app.close();
                    BT.finishStory(this.g, true);
                    return true;
                case 'close':
                    if (this.g.state.growth.event) {
                        this.app.close();
                        this.renderStory();
                        return true;
                    }
                    break;
                case 'end-romance':
                    this.app.modal('Choose how to move forward.', 'A CLEAR CONVERSATION', '<p class="lead">Ending the relationship removes exclusivity and romance. Your shared memories remain.</p>', `<button class="button subtle" data-action="plans">Keep the relationship</button><button class="button primary" data-action="end-romance-confirm" data-id="${BT.h(d.id)}">Stay friends instead</button>`, false, 'relationship');
                    return true;
                case 'end-romance-confirm': {
                    const p = this.g.state.people.find(p => p.id === d.id), r = this.g.state.growth.stories[d.id];
                    if (p && r) {
                        r.exclusive = false;
                        r.friendOnly = true;
                        p.romance = 0;
                        this.g.log('You and ' + p.name + ' chose to stay friends.');
                        this.g.changed();
                        this.plans();
                    }
                    return true;
                }
            }
            return super.action(a, d);
        }
        key(e) {
            const k = e.key.toLowerCase();
            if (this.g.state.growth.event) {
                if (this.app.modalName === 'leave-story') {
                    if (k === 'escape') {
                        this.app.close();
                        this.renderStory();
                        e.preventDefault();
                        return true;
                    }
                    return false;
                }
                const ev = this.g.state.growth.event;
                if (k === 'escape') {
                    this.action('story-leave', {});
                    e.preventDefault();
                    return true;
                }
                if (this.storyReply || ev.step >= 3) {
                    if (k === 'enter' || k === ' ') {
                        this.action(this.storyReply ? 'story-next' : 'story-finish', {});
                        e.preventDefault();
                    }
                    return true;
                }
                if (k === 'arrowup' || k === 'arrowdown') {
                    this.storySelected = (this.storySelected + (k === 'arrowdown' ? 1 : 2)) % 3;
                    document.querySelectorAll('[data-story-index]').forEach(el => el.classList.toggle('selected', Number(el.dataset.storyIndex) === this.storySelected));
                    e.preventDefault();
                }
                if (k === 'enter' || ['1', '2', '3'].includes(k)) {
                    this.action('story-answer', { id: String(k === 'enter' ? this.storySelected : Number(k) - 1) });
                    e.preventDefault();
                }
                return true;
            }
            if (this.mode === 'edit') {
                if ((e.ctrlKey || e.metaKey) && k === 'z') {
                    e.preventDefault();
                    this.history(e.shiftKey);
                    return true;
                }
                if ((e.ctrlKey || e.metaKey) && k === 'y') {
                    e.preventDefault();
                    this.history(true);
                    return true;
                }
                if (k === 'escape' && this.drag) {
                    e.preventDefault();
                    this.cancelDrag();
                    return true;
                }
                if (k === 'r')
                    this.previewKey = '';
            }
            if (this.junctionOpen && this.g.state.trip) {
                if (['1', '2'].includes(k)) {
                    this.action('route-detour', { id: k });
                    e.preventDefault();
                }
                return true;
            }
            return super.key(e);
        }
    }
    BT.CityLife = CityLife;
})(BT || (BT = {}));
</script></head><body><main id="app"></main><noscript>This game needs JavaScript enabled in your browser. No internet connection or account is required.</noscript></body></html>
