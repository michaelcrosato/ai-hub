        target = living.length ? {x:living[0].group.position.x,y:1.65,z:living[0].group.position.z} : {x:0,y:2.2,z:beacons[stage].group.position.z};
      } else target = {x:0,y:1.5,z:-119};
      const dx=target.x-player.x, dz=target.z-player.z, distance=Math.hypot(dx,dz);
      player.yaw=Math.atan2(-dx,-dz); player.pitch=Math.atan2(target.y-(player.y+.65),Math.max(.1,distance));
      input={moveX:0,moveY:distance>(stage===3?1.5:10)?-1:0,fire:stage<3&&distance<24,interact:stage===3&&distance<2, sprint:true};
    }
    player.yaw -= (input.lookX || 0) * dt * 2.2; player.pitch = THREE.MathUtils.clamp(player.pitch - (input.lookY || 0) * dt * 1.8, -1.25, 1.25);
    camera.rotation.set(player.pitch, player.yaw, 0);
    const mx = input.moveX || 0, my = input.moveY || 0, speed = input.sprint ? 8.5 : 6.2;
    const vx = (Math.cos(player.yaw)*mx + Math.sin(player.yaw)*my)*speed;
    const vz = (-Math.sin(player.yaw)*mx + Math.cos(player.yaw)*my)*speed;
    if (input.jump && grounded) { velocityY = 7.5; grounded = false; fx('jump'); }
    velocityY -= 20 * dt;
    controller.computeColliderMovement(capsule, {x:vx*dt,y:velocityY*dt,z:vz*dt});
    const move=controller.computedMovement(); grounded=controller.computedGrounded(); if (grounded && velocityY < 0) velocityY=0;

    const now=body.translation(); player.x=now.x; player.y=now.y; player.z=now.z;
    bob += Math.hypot(mx,my)*dt*9; camera.position.set(player.x, player.y+.65+Math.sin(bob)*.035*Math.min(1,Math.hypot(mx,my)), player.z);

      if (Math.hypot(player.x-p.group.position.x,player.z-p.group.position.z)<1.3) {

        p.active=false; p.group.visible=false; if(p.kind==='health') player.health=Math.min(100,player.health+35); else {player.ammo+=45;player.shells+=12;} fx('pickup'); notify(p.kind==='health'?'Vitality restored.':'Ammunition recovered.');
      }
    }

    let hint='';

    else if (beacons[stage] && Math.abs(player.z-beacons[stage].group.position.z)<12) hint=enemies.some(e=>e.alive&&e.zone===stage)?'CLEAR THE GUARDIANS':'SHOOT THE EXPOSED SEED';
    const remaining=enemies.filter(e=>e.alive&&e.zone===Math.min(stage,2)).length;
    hudTimer-=dt; if(hudTimer<=0) { hudTimer=.1; onHud({health:player.health, ammo:player.weapon?player.shells:player.ammo, weapon:player.weapon?'BONE SCATTERER':'SUN CARBINE', shards:player.shards, kills:enemies.filter(e=>!e.alive).length, enemies:remaining, objective:player.shards===3?'REACH THE FAR GATE':remaining?`SILENCE THE GUARDIANS • ${remaining} REMAIN`:'SHATTER THE EXPOSED SEED', hint, location:['THE VERDANT APPROACH','THE BROKEN COURT','THE ASHEN SANCTUM','THE FAR GATE'][stage]}); }
  }
  function reset() {
    player.x=0;player.y=.85;player.z=8;player.yaw=0;player.pitch=0;player.health=100;player.ammo=90;player.shells=28;player.weapon=0;player.shards=0;

    beacons.forEach(b=>{b.hp=60;b.alive=true;b.group.visible=true;}); pickups.forEach(p=>{p.active=true;p.group.visible=true;});
    gates.forEach((g,i)=>{g.group.visible=true;if(g.open){g.collider=solid(30,6,.8,0,3,[-43,-82,-122][i]);g.open=false;}});
    projectiles.forEach(p=>scene.remove(p.mesh));projectiles.length=0;
    camera.position.set(0,1.5,8); camera.rotation.set(0,0,0);
  }
  function setPeer(id, state) {
    if (!state || !Number.isFinite(state.x) || !Number.isFinite(state.z)) return;
    let p = peers.get(id);
    if (!p) {
      p=new THREE.Group(); const bodyMesh=mesh(new THREE.CylinderGeometry(.42,.5,1,6),M.aqua,0,1.1,0,p); bodyMesh.material=M.aqua;
      mesh(new THREE.SphereGeometry(.35,8,6),M.bone,0,1.9,0,p); box(.25,.75,.25,M.dark,-.25,.35,0,p); box(.25,.75,.25,M.dark,.25,.35,0,p); scene.add(p); peers.set(id,p);
    }

  }
  function removePeer(id) { const p=peers.get(id); if(p){scene.remove(p);peers.delete(id);} }
  reset();
  return {scene,camera,player,update,reset,setAttract(v){attract=v;},setPeer,removePeer,render(){return renderer.renderAsync(scene,camera);},dispose(){world.free();}};
}

import * as THREE from 'three/webgpu';
import RAPIER from '@dimforge/rapier3d-compat';

const aboutHTML = `
<h2>Source information</h2><p>Date: 2026-10-29 09:20. Source: Turok 2: Seeds of Evil. Original game: Raptor: Garden of Ruin.</p>
<p>Tech: Three.js R180 WebGPU, Rapier 0.19.3, Gamepad API, Web Audio, PeerJS 1.5.5 / WebRTC, AI Hub session client 1.3.0. Art: procedural cel-shaded geometry. Animation: procedural transforms and character motion. Audio: synthesized music, effects and gibberish voice. Online: independent-world room-code play and AI Hub parallel sessions.</p>
<p>Testing: lightweight headless browser and syntax checks. Environment: Codex CLI (headless); Linux; browser unknown for deployment. Model: OpenAI, gpt-6.1-terra, reasoning effort ultra. Usage: unknown.</p>
<h2>Testing feedback</h2><p>Four implementation issues were found and fixed; two could block or obscure progress. The complete autonomous run through Rapier combat, gates and the finale was the most helpful test. Syntax checks were the least informative. Headless Chrome WebGPU, menu, settings, movement and pause were also checked; physical controller and cross-device networking remain untested.</p>
<h2>Engine feedback</h2><p>Three.js makes assembling and lighting a procedural world approachable. WebGPU initialization and material compatibility required care. The character, combat, level and interface systems were built for this demo. The hardest part was bringing renderer, physics and browser input together. The renderer's implicit fallback deserves a clearer explicit opt-out and capability error.</p>
<h2>Prompt feedback</h2><p>The strongest part was the specific controller-first and attract-mode direction. The requested scope of a complete engine in a single file was broad. The hardest part was integrating combat, physics, presentation and networking coherently. A full physical-controller and cross-device multiplayer playthrough would be the most valuable additional test.</p>`;
const sound = new Sound();
const input = createInput();
let game, ui, net, renderer, running = false, inAttract = false, last = performance.now(), attractStamp = 0, score = 0, lastNetwork = 0, hubWaiting = false, hubStarted = false;
const status = text => ui?.setStatus(text, 3500);
function stopAttract() { if (!inAttract) return; inAttract=false; running=false; game?.setAttract(false); game?.reset(); ui.showTitle(); input.mark(); }
function begin() { stopAttract(); game.reset(); game.setAttract(false); running=true; hubWaiting=false; score=0; ui.showHUD(); sound.start(); sound.voice(); status('Silence the guardians. Shatter the seeds.'); }
function startRequested() { sound.start(); if (AIHub.active && !hubStarted) { hubWaiting=true; AIHub.ready(); ui.showHUD(); status('Waiting for the other hunters…'); } else begin(); }
function finish(won) { if (inAttract) { game.reset(); game.setAttract(true); return; } running=false; if (AIHub.active) AIHub.result({score: score + (won ? 5000 : 0)}); ui.showEnd(won); }
ui = createUI({title:'Raptor: Garden of Ruin',aboutHTML,
  onStart:startRequested,onRestart:startRequested,onResume:()=>{running=true;sound.resume();},
  onQuit:()=>{running=false;inAttract=false;game?.setAttract(false);sound.stop();},
  onSettings:s=>{sound.musicEnabled=s.music;},
  onInput:()=>{input.mark(); if(inAttract)stopAttract();},
  onHost:async()=>{try { await net.host(); } catch(e) {ui.setOnlineStatus(e.message);} },
  onJoin:async code=>{try { await net.join(code); } catch(e) {ui.setOnlineStatus(e.message);} },
  onDisconnect:()=>{net.close();ui.setOnlineStatus('Disconnected.');}
});
net = new Net({onStatus:s=>ui.setOnlineStatus(s),onState:(id,s)=>game?.setPeer(id,s),onLeave:id=>game?.removePeer(id)});
function fail(message) { running=false; AIHub.fail(message); const box=document.createElement('div'); box.className='fatal'; box.textContent=message; document.body.appendChild(box); }
async function init() {
  try {
    if (!navigator.gpu || !await navigator.gpu.requestAdapter()) throw new Error('WebGPU is required. Use a browser and device with WebGPU enabled.');
    await RAPIER.init();
    renderer=new THREE.WebGPURenderer({antialias:true}); await renderer.init();
    if (!renderer.backend?.isWebGPUBackend) throw new Error('WebGPU is required; this device could not start a WebGPU renderer.');
    renderer.backend.device?.lost.then(info=>fail('WebGPU device lost: '+(info.message || info.reason || 'unknown reason')+'. Reload to retry.'));
    renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); document.body.prepend(renderer.domElement);
    renderer.domElement.addEventListener('click',()=>{ if(ui.mode==='game') renderer.domElement.requestPointerLock?.(); });
    game=createGame({THREE,RAPIER,renderer,audio:sound,onHud:data=>{ui.updateHUD(data);score=Math.max(score,(data.shards||0)*1000+(data.kills||0)*40);if(AIHub.active)AIHub.progress({score,label:data.location||'The hunt'});},onMessage:status,onWin:()=>finish(true),onDeath:()=>finish(false)});
    window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);game.camera.aspect=innerWidth/innerHeight;game.camera.updateProjectionMatrix();});
    AIHub.probe(()=>({scene:ui.mode,menu:ui.mode,world:game?{x:game.player.x,z:game.player.z,health:game.player.health,shards:game.player.shards,score}:null,input:'gamepad and keyboard'}));
    AIHub.on('start',()=>{hubStarted=true;hubWaiting=true;});
    AIHub.on('time-up',()=>{AIHub.result({score});running=false;ui.showEnd(false,'Time has run out. Your hunt has been recorded.');});
    AIHub.on('end',()=>{running=false;});
    const session=await AIHub.connect({mode:'parallel',seats:[1,4]});
    if(session?.splash){hubWaiting=true;AIHub.ready();ui.showHUD();status('The hunt begins shortly…');}

}
async function frame(now) {
  const dt=Math.min(.05,(now-last)/1000);last=now;
  ui.tickGamepad(); const controls=input.poll(ui.settings);
  if(inAttract && controls.activity>attractStamp) stopAttract();
  if(ui.mode==='title' && !AIHub.active && !inAttract && now-input.activity>=10000){inAttract=true;attractStamp=input.activity;game.reset();game.setAttract(true);running=true;ui.showAttract();}
  if(hubWaiting && hubStarted && AIHub.time()>=0) begin();
  if(running){
    if(!inAttract && controls.pause){running=false;document.exitPointerLock?.();ui.showPause();}
    else game.update(dt,controls);
    sound.update();
    if(now-lastNetwork>100){lastNetwork=now;net.send(game.player);}
  }
  try { await game.render(); } catch(e) { console.error(e); fail('Rendering failed: '+e.message); return; }
  requestAnimationFrame(frame);
}
init();
</script></body></html>
