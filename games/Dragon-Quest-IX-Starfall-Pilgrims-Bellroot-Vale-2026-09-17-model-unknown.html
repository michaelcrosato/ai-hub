  <style>
:root {
  color-scheme: light;
  --ink: #25323a;
  --cream: #fff8dc;

  --sky: #8ed7f0;
  --blue: #2f7db9;

}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--sky); font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif; color: var(--ink); }
button { font: inherit; }
#game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#game-canvas:focus { outline: none; }
#fx-vignette { pointer-events: none; position: fixed; inset: 0; z-index: 3; background: radial-gradient(circle at 50% 45%, transparent 48%, rgba(18,43,57,.15) 100%); mix-blend-mode: multiply; }
#ui-root { position: fixed; inset: 0; z-index: 5; pointer-events: none; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.panel { background: var(--paper); border: 3px solid var(--edge); border-radius: 16px; box-shadow: 0 5px 0 rgba(87,63,47,.25), 0 12px 30px var(--shadow); }
/* The right inset leaves room for the settings gear in the top-right corner. */
.hud { position: absolute; inset: max(10px, env(safe-area-inset-top)) calc(max(10px, env(safe-area-inset-right)) + 46px) auto max(10px, env(safe-area-inset-left)); display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.stats { min-width: 174px; padding: 9px 11px; font-weight: 800; letter-spacing: .01em; }
.stats-row { display: grid; grid-template-columns: auto 1fr auto; gap: 7px; align-items: center; font-size: 12px; }
.bar { height: 9px; background: #d9cfb8; border: 2px solid #573f2f; border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 50%; background: var(--green); }
.bar.mp > i { background: var(--blue); }
.status-small { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; }
.quest { max-width: min(44vw, 330px); padding: 10px 12px; }
.quest strong { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #7a573b; }
.quest span { display: block; margin-top: 3px; font-weight: 800; font-size: 13px; line-height: 1.2; }
.backend { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 96px; padding: 5px 9px; border-radius: 999px; background: rgba(22,40,48,.66); color: white; font: 700 10px/1 system-ui; letter-spacing: .08em; }
.toast-stack { position: absolute; left: 50%; top: 17%; transform: translateX(-50%); display: grid; gap: 8px; width: min(90vw, 420px); }
.toast { padding: 10px 14px; border-radius: 999px; background: rgba(37,50,58,.88); color: white; text-align: center; font-weight: 800; font-size: 13px; animation: toastIn .25s ease-out; }
@keyframes toastIn { from { transform: translateY(-8px); opacity: 0; } }
.dialogue { position: absolute; left: 50%; bottom: max(16px, calc(env(safe-area-inset-bottom) + 8px)); transform: translateX(-50%); width: min(92vw, 700px); padding: 14px 16px 13px; pointer-events: auto; }
.dialogue .speaker { font-size: 12px; font-weight: 900; color: #7a573b; text-transform: uppercase; letter-spacing: .1em; }
.dialogue p { margin: 5px 0 10px; font-size: 16px; font-weight: 750; line-height: 1.32; }
.dialogue .hint { text-align: right; font-size: 11px; opacity: .7; }
.combat { position: absolute; left: 50%; bottom: max(12px, calc(env(safe-area-inset-bottom) + 6px)); transform: translateX(-50%); width: min(94vw, 760px); padding: 12px; pointer-events: auto; }
.combat-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 8px; }
.enemy-name { font-weight: 950; font-size: 18px; }

.combat-log { min-height: 42px; background: rgba(64,46,34,.08); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; font-weight: 750; font-size: 13px; line-height: 1.25; }
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.actions button, .primary-btn, .small-btn { border: 3px solid var(--edge); background: #fff6d4; color: var(--ink); border-radius: 12px; box-shadow: 0 4px 0 #9c785b; padding: 10px 7px; font-weight: 900; min-height: 46px; pointer-events: auto; cursor: pointer; }
.actions button:active, .primary-btn:active, .small-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #9c785b; }

.actions small { display:block; font-size: 10px; opacity:.65; }
.title-screen { pointer-events: auto; position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: linear-gradient(rgba(84,159,198,.12), rgba(18,61,83,.34)); }
.title-card { width: min(92vw, 520px); padding: 24px 22px 20px; text-align: center; }
.title-kicker { text-transform: uppercase; letter-spacing: .22em; font-size: 11px; font-weight: 950; color: #7a573b; }
.title-card h1 { margin: 5px 0 0; font-size: clamp(34px, 9vw, 58px); line-height: .88; color: #2e668f; text-shadow: 0 3px 0 white, 0 5px 0 #573f2f; }
.title-card h2 { margin: 10px 0 14px; font-size: 19px; color: #5b8a3b; }

.shop h3 { margin: 0 0 3px; font-size: 22px; }
.shop p { margin: 0 0 12px; font-size: 12px; font-weight: 700; }
.shop-list { display: grid; gap: 8px; }
.shop-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; border: 2px solid #b69b73; border-radius: 12px; padding: 9px; background: rgba(255,255,255,.48); }
.shop-item strong { display:block; }
.shop-item span { font-size: 11px; }
.shop-buttons { display:flex; gap:8px; justify-content:flex-end; margin-top: 12px; }
.small-btn { min-height: 38px; padding: 7px 10px; }
.small-btn:disabled { opacity: .55; cursor: default; }
.complete { position:absolute; inset:0; display:grid; place-items:center; background:rgba(32,62,79,.48); pointer-events:auto; padding:18px; }
.complete-card { width:min(92vw,560px); padding:22px; text-align:center; }
.complete h2 { margin:0; font-size:30px; color:#2e668f; }
.complete p { font-weight:700; line-height:1.35; }
.hidden { display: none !important; }
.screen-flash { position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 20; transition: opacity .12s; }
.screen-flash.on { opacity: .78; }
/* Menu cursor for keyboard and gamepad; touch players tap instead. */
#ui-root button.is-focus { outline: 3px solid var(--blue); outline-offset: 3px; }
body.nav-touch #ui-root button.is-focus { outline: none; }
/* The kit's big touch button keeps the game's gold action-button look. */
.kit-touch .kit-touch__btn[data-action="act"] { background: #f4c857; color: #4d382c; border: 4px solid var(--edge); box-shadow: 0 6px 0 #9c785b, 0 10px 24px rgba(0,0,0,.2); font-weight: 950; backdrop-filter: none; -webkit-backdrop-filter: none; }
.kit-touch .kit-touch__btn[data-action="act"].is-down { background: #e2b545; box-shadow: 0 2px 0 #9c785b; }
@media (max-width: 520px) {
  .hud { gap: 6px; }
  .stats { min-width: 151px; padding: 8px 9px; }
  .quest { max-width: 42vw; padding: 8px 9px; }
  .quest span { font-size: 11px; }
  .backend { top: 90px; left: max(10px, env(safe-area-inset-left)); right: auto; }
  .actions { grid-template-columns: repeat(2, 1fr); }
  .combat { padding: 10px; }
  .dialogue p { font-size: 14px; }
}

<body>
  <canvas id="game-canvas" aria-label="Starfall Pilgrims game view"></canvas>

  <script type="module">
import * as THREE from 'three/webgpu';
import { color, time } from 'three/tsl';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { boot } from 'kit/boot.js';
import { createPost } from 'kit/post.js';

const canvas = document.getElementById('game-canvas');
const uiRoot = document.getElementById('ui-root');
const clamp = THREE.MathUtils.clamp;
const lerp = THREE.MathUtils.lerp;

const kit = await boot({
  title: 'Starfall Pilgrims: Bellroot Vale',
  canvas,
  accent: '#f0b94d',
  background: '#173646',
  input: {
    move: { type: 'vector', keys: 'wasd+arrows', gamepad: 'leftStick+dpad', touch: 'stick' },
    look: { type: 'look', mouse: 'drag', gamepad: 'rightStick', touch: 'drag' },
    act: { keys: ['KeyE', 'Space', 'Enter', 'NumpadEnter'], gamepad: ['A', 'X'], touch: 'Look' },
    back: { keys: ['Escape', 'Backspace', 'KeyK'], gamepad: ['B'] },
    zoomIn: { keys: ['Equal', 'NumpadAdd'], gamepad: ['RB'] },
    zoomOut: { keys: ['Minus', 'NumpadSubtract'], gamepad: ['LB'] },
    attack: { keys: ['Digit1'] },
    skill: { keys: ['Digit2'] },
    guard: { keys: ['Digit3'] },
    herb: { keys: ['Digit4'] },
    // Touch players open the same settings panel with the gear button.
    pause: { keys: ['Escape', 'KeyP'], gamepad: ['Start'] },
  },
});
const input = kit.input;
kit.loading.progress(0.75, 'Building Bellroot Vale…');

uiRoot.innerHTML = `
  <div class="hud hidden" id="hud">
    <div class="panel stats">
      <div class="stats-row"><b id="level">Lv 1</b><div class="bar"><i id="hpbar"></i></div><span id="hptext">34/34</span></div>
      <div class="stats-row"><b>MP</b><div class="bar mp"><i id="mpbar"></i></div><span id="mptext">12/12</span></div>
      <div class="status-small"><span id="xptext">XP 0</span><span id="goldtext">12G</span><span id="herbtext">Herb ×2</span></div>
    </div>
    <div class="panel quest"><strong>Moonbell Errand</strong><span id="questtext">Speak with Elder Nessa by the fountain.</span></div>
  </div>
  <div class="backend hidden" id="backend">BOOTING</div>
  <div class="toast-stack" id="toasts"></div>
  <div class="panel dialogue hidden" id="dialogue">
    <div class="speaker" id="speaker"></div><p id="dialogueText"></p><div class="hint">Tap / E / A to continue</div>
  </div>
  <div class="panel combat hidden" id="combat">
    <div class="combat-top"><div><div class="enemy-name" id="enemyName"></div><div class="enemy-hp" id="enemyHp"></div></div><b id="turnTag">Your turn</b></div>
    <div class="combat-log" id="combatLog">Choose an action.</div>
    <div class="actions" id="combatActions"></div>
  </div>
  <div class="title-screen" id="titleScreen">
    <div class="panel title-card">
      <div class="title-kicker">An original browser JRPG slice</div>
      <h1>Starfall<br>Pilgrims</h1>
      <h2>Bellroot Vale</h2>
      <p>A cheerful toy-like quest through a tiny village, a monster road, and the old Moonbell Shrine.</p>
      <button class="primary-btn" id="beginButton">Begin Pilgrimage</button>
      <div class="controls-note">Mobile: left thumb moves, right side rotates the camera, pinch zooms, gold button interacts. Desktop: WASD/arrow keys, E/Space, mouse drag, wheel. Gamepad: left stick moves, right stick turns, A interacts, LB/RB zoom.</div>
    </div>
  </div>
  <div class="panel shop hidden" id="shop"></div>
  <div class="complete hidden" id="complete">
    <div class="panel complete-card">
      <div class="title-kicker">Vertical slice complete</div>
      <h2>The Moonbell Rings Again</h2>
      <p id="completeText"></p>
      <button class="primary-btn" id="restartButton">Play Again</button>
    </div>
  </div>
  <div class="screen-flash" id="flash"></div>
`;

const $ = (id) => document.getElementById(id);
const hud = $('hud');
const backendBadge = $('backend');
const dialogueEl = $('dialogue');
const speakerEl = $('speaker');
const dialogueTextEl = $('dialogueText');
const combatEl = $('combat');
const combatLogEl = $('combatLog');
const combatActionsEl = $('combatActions');
const enemyNameEl = $('enemyName');
const enemyHpEl = $('enemyHp');
const turnTagEl = $('turnTag');
const shopEl = $('shop');
const titleScreen = $('titleScreen');
const completeEl = $('complete');
const flashEl = $('flash');
const beginButton = $('beginButton');
const restartButton = $('restartButton');
const hudEls = {
  level: $('level'), hpbar: $('hpbar'), mpbar: $('mpbar'), hptext: $('hptext'), mptext: $('mptext'),
  xptext: $('xptext'), goldtext: $('goldtext'), herbtext: $('herbtext'), questtext: $('questtext'),
};
const COMBAT_BUTTONS = `<button data-action="attack">Attack<small>Reliable strike</small></button><button data-action="skill">Star Slash<small>4 MP · heavy hit</small></button><button data-action="guard">Guard<small>½ damage this turn</small></button><button data-action="herb">Herb<small>Restore 20 HP</small></button>`;
combatActionsEl.innerHTML = COMBAT_BUTTONS;

// DOM writes only when a value changes (the HUD refreshes every frame).
const setText = (el, v) => { if (el._v !== v) { el._v = v; el.textContent = v; } };
const setWidth = (el, v) => { if (el._w !== v) { el._w = v; el.style.width = v; } };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91d9f1);
scene.fog = new THREE.Fog(0x91d9f1, 28, 63);

const camera = kit.fitCamera(new THREE.PerspectiveCamera(48, 1, 0.08, 120));
camera.position.set(0, 10, 12);

const renderer = kit.renderer;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.setClearColor(0x91d9f1, 1);

backendBadge.textContent = `${kit.backendLabel.toUpperCase()} · THREE r${THREE.REVISION}`;

function material(color, opts = {}) {
  const m = new THREE.MeshStandardNodeMaterial({
    color,
    roughness: opts.roughness ?? 0.86,
    metalness: opts.metalness ?? 0,
    flatShading: opts.flatShading ?? true,
  });
  if (opts.emissive != null) {
    m.emissive = new THREE.Color(opts.emissive);
    m.emissiveIntensity = opts.emissiveIntensity ?? 1;
  }
  if (opts.transparent != null) m.transparent = opts.transparent;
  if (opts.opacity != null) m.opacity = opts.opacity;
  return m;
}

const pulse = time.mul(2.1).sin().mul(0.5).add(0.5);
const starWarm = new THREE.MeshStandardNodeMaterial({ color: 0xffe599, roughness: .42, metalness: .08, flatShading: true });
starWarm.emissiveNode = color(0xffbd56).mul(pulse.mul(0.9).add(0.12));
const starCool = new THREE.MeshStandardNodeMaterial({ color: 0xa6e4ff, roughness: .42, metalness: .05, flatShading: true });
starCool.emissiveNode = color(0x58cfff).mul(pulse.mul(0.7).add(0.1));

const MAT = {
  grass: material(0x78b95b),
  grassDark: material(0x5c984b),
  path: material(0xd8b77d),
  stone: material(0x9ba0a0),
  stoneLight: material(0xc9c4ae),
  wood: material(0x7d5032),
  woodLight: material(0xa86c3d),
  roof: material(0xc85c4c),
  cream: material(0xf7e4ae),
  blue: material(0x4f8fc2),
  navy: material(0x345b80),
  gold: material(0xe7b64f, { metalness: .08, roughness: .48 }),
  leaf: material(0x4d9c51),
  leaf2: material(0x76b34c),
  trunk: material(0x6d4b31),
  black: material(0x242b2e),
  white: material(0xf8f3df),
  skin: material(0xe8b68d),
  hair: material(0x61422f),
  water: new THREE.MeshPhysicalNodeMaterial({ color: 0x4aaed0, roughness: .2, metalness: 0, transparent: true, opacity: .72, transmission: .08 }),
  danger: material(0xc7584e),
  moss: material(0x6cab50),
  lavender: material(0x8d75b6),
};

function mesh(geo, mat, parent = scene, cast = true, receive = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast;
  m.receiveShadow = receive;
  parent.add(m);
  return m;
}

function box(size, mat, pos, parent = scene, cast = true, receive = true) {
  const m = mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), mat, parent, cast, receive);
  m.position.set(pos[0], pos[1], pos[2]);
  return m;
}

function cyl(radiusTop, radiusBottom, height, segments, mat, pos, parent = scene) {
  const m = mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments), mat, parent);
  m.position.set(pos[0], pos[1], pos[2]);
  return m;
}

function sphere(radius, mat, pos, parent = scene, width = 8, height = 5) {
  const m = mesh(new THREE.SphereGeometry(radius, width, height), mat, parent);
  m.position.set(pos[0], pos[1], pos[2]);
  return m;
}

function cone(radius, height, segments, mat, pos, parent = scene) {
  const m = mesh(new THREE.ConeGeometry(radius, height, segments), mat, parent);
  m.position.set(pos[0], pos[1], pos[2]);
  return m;
}

function makePerson({ coat = MAT.blue, hair = MAT.hair, scarf = MAT.gold, hat = false } = {}) {
  const g = new THREE.Group();
  box([.72, .72, .45], coat, [0, .92, 0], g);
  box([.24, .62, .28], MAT.navy, [-.2, .32, 0], g);
  box([.24, .62, .28], MAT.navy, [.2, .32, 0], g);
  box([.24, .26, .4], MAT.wood, [-.2, .02, .04], g);
  box([.24, .26, .4], MAT.wood, [.2, .02, .04], g);
  sphere(.36, MAT.skin, [0, 1.48, 0], g, 8, 5);
  sphere(.37, hair, [0, 1.62, .02], g, 8, 4).scale.set(1, .7, 1);
  box([.82, .12, .48], scarf, [0, 1.2, .01], g);
  const eyeGeo = new THREE.BoxGeometry(.055, .075, .03);
  const eye1 = mesh(eyeGeo, MAT.black, g, false, false); eye1.position.set(-.12,1.5,-.34);
  const eye2 = mesh(eyeGeo, MAT.black, g, false, false); eye2.position.set(.12,1.5,-.34);
  if (hat) {
    cone(.48, .42, 6, MAT.roof, [0, 1.94, 0], g);
    cyl(.54,.54,.08,12,MAT.roof,[0,1.78,0],g);
  }
  return g;
}

function makeHero() {
  const g = makePerson({ coat: MAT.blue, scarf: MAT.gold });
  const sword = box([.09, 1.05, .08], MAT.stoneLight, [.38, .86, .18], g);
  sword.rotation.z = -.35;
  box([.34,.08,.12], MAT.gold, [.2,1.22,.18], g);
  return g;
}

function makeTree(x, z, scale = 1) {
  const g = new THREE.Group();
  g.position.set(x,0,z);
  cyl(.22*scale,.3*scale,1.7*scale,6,MAT.trunk,[0,.85*scale,0],g);
  const a = sphere(1.03*scale,MAT.leaf,[0,1.95*scale,0],g,7,4);
  a.scale.y=.82;
  const b = sphere(.72*scale,MAT.leaf2,[.45*scale,2.2*scale,.1*scale],g,7,4);
  b.scale.y=.8;
  scene.add(g);
  return g;
}

function makeHouse(x,z,rot=0,roofMat=MAT.roof) {
  const g = new THREE.Group();
  g.position.set(x,0,z); g.rotation.y=rot;
  box([4.7,2.8,4.1],MAT.cream,[0,1.4,0],g);
  const roof = cone(3.8,2.2,4,roofMat,[0,3.35,0],g); roof.rotation.y=Math.PI/4;
  box([1.1,1.8,.18],MAT.wood,[0,.9,-2.08],g);
  box([.75,.72,.12],MAT.blue,[-1.45,1.55,-2.1],g);
  box([.75,.72,.12],MAT.blue,[1.45,1.55,-2.1],g);
  box([1.1,.18,.2],MAT.woodLight,[0,1.92,-2.16],g);
  scene.add(g);
  return g;
}

function makeFence(x,z,length,alongX=true) {
  const g = new THREE.Group();
  g.position.set(x,0,z);
  const step=1.6;
  const count=Math.floor(length/step);
  for(let i=0;i<=count;i++){
    const o=-length/2+i*(length/count);
    box([.16,1,.16],MAT.wood,[alongX?o:0,.5,alongX?0:o],g);
  }
  box(alongX?[length,.12,.12]:[.12,.12,length],MAT.woodLight,[0,.72,0],g);
  box(alongX?[length,.1,.1]:[.1,.1,length],MAT.woodLight,[0,.32,0],g);
  scene.add(g); return g;
}

function makeSign(x,z,rotation) {
  const g = new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rotation;
  box([.16,1.2,.16],MAT.wood,[0,.6,0],g);
  box([1.45,.72,.14],MAT.woodLight,[0,1.24,0],g);
  box([1.1,.08,.16],MAT.gold,[0,1.24,-.08],g,false,false);
  scene.add(g); return g;
}

function makeFountain(x,z) {
  const g=new THREE.Group(); g.position.set(x,0,z);
  cyl(1.9,2.1,.42,12,MAT.stone,[0,.21,0],g);
  cyl(1.45,1.55,.2,12,MAT.water,[0,.45,0],g);
  cyl(.3,.45,2,8,MAT.stoneLight,[0,1.35,0],g);
  sphere(.28,MAT.gold,[0,2.42,0],g,6,4);
  scene.add(g); return g;
}

/**
 * Bake everything that never moves into one mesh per material and shadow
 * setting. The village is ~600 small meshes; merged it is a few dozen draw
 * calls, which matters on phones (and twice over with the shadow pass).
 */
function mergeStatic(keep) {
  scene.updateMatrixWorld(true);
  const buckets = new Map();
  const merged = [];
  for (const child of scene.children) {
    if (keep.has(child) || child.isLight) continue;
    child.traverse((o) => {
      if (!o.isMesh) return;
      const key = `${o.material.id}|${o.castShadow}|${o.receiveShadow}`;
      let b = buckets.get(key);
      if (!b) buckets.set(key, (b = { material: o.material, cast: o.castShadow, receive: o.receiveShadow, geos: [] }));
      b.geos.push(o.geometry.clone().applyMatrix4(o.matrixWorld));
    });
    merged.push(child);
  }
  for (const child of merged) {
    scene.remove(child);
    child.traverse((o) => o.geometry?.dispose());
  }
  for (const b of buckets.values()) {
    let geos = b.geos;
    if (geos.some((g) => !g.index)) geos = geos.map((g) => (g.index ? g.toNonIndexed() : g));
    const geo = mergeGeometries(geos, false);
    b.geos.forEach((g) => g.dispose());
    const m = new THREE.Mesh(geo, b.material);
    m.castShadow = b.cast;
    m.receiveShadow = b.receive;
    m.matrixAutoUpdate = false;
    scene.add(m);
  }
}

class AudioKit {
  constructor(){ this.ctx=null; this.enabled=true; }
  unlock(){
    if(!this.enabled) return;
    try {
      if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      if(this.ctx.state==='suspended' && !kit.paused) this.ctx.resume();
    } catch { this.enabled=false; }
  }
  pause(on){
    if(!this.ctx) return;
    if(on) this.ctx.suspend().catch(()=>{}); else this.ctx.resume().catch(()=>{});
  }
  tone(freq=440,dur=.08,type='square',vol=.025,delay=0){
    if(!this.ctx||!this.enabled||this.ctx.state!=='running') return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=0;
    o.connect(g); g.connect(this.ctx.destination);
    const t=this.ctx.currentTime+delay;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t); o.stop(t+dur+.02);
  }
  click(){ this.tone(520,.07,'square',.018); }
  hit(){ this.tone(130,.09,'sawtooth',.03); this.tone(90,.11,'square',.018,.02); }
  heal(){ [523,659,784].forEach((f,i)=>this.tone(f,.16,'sine',.025,i*.07)); }
  win(){ [392,494,587,784].forEach((f,i)=>this.tone(f,.22,'triangle',.03,i*.09)); }
  quest(){ [330,440,554].forEach((f,i)=>this.tone(f,.22,'triangle',.025,i*.1)); }
}

/**
 * Keyboard and gamepad cursor for the game's own DOM menus (title, combat,
 * shop, ending): move picks the nearest button in that direction, act presses it.
 */
const nav = { el: null, dir: null, repeatAt: 0, mem: {} };
const usable = (b) => !b.disabled && b.isConnected;
function setFocus(el, mode, all) {
  if (nav.el === el) return;
  nav.el?.classList.remove('is-focus');
  nav.el = el;
  if (el) { el.classList.add('is-focus'); nav.mem[mode] = all.indexOf(el); }
}
function syncFocus(mode, all) {
  if (nav.el && all.includes(nav.el) && usable(nav.el)) return;
  const remembered = all[nav.mem[mode] ?? 0];
  setFocus(remembered && usable(remembered) ? remembered : all.find(usable) || null, mode, all);
}
function navStep(dir, mode, all) {
  if (!nav.el) return;
  const r = nav.el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bestScore = Infinity;
  for (const b of all) {
    if (b === nav.el || !usable(b)) continue;
    const q = b.getBoundingClientRect();
    const dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy;
    const along = dir === 'right' ? dx : dir === 'left' ? -dx : dir === 'down' ? dy : -dy;
    const across = dir === 'left' || dir === 'right' ? Math.abs(dy) : Math.abs(dx);
    if (along <= 4) continue;
    const score = along + across * 2;
    if (score < bestScore) { bestScore = score; best = b; }
  }
  if (best) { setFocus(best, mode, all); audio.click(); }
}
function navUpdate(mode, all, t) {
  syncFocus(mode, all);
  const mv = input.vector('move');
  let dir = null;
  if (Math.hypot(mv.x, mv.y) > 0.5) dir = Math.abs(mv.x) > Math.abs(mv.y) ? (mv.x > 0 ? 'right' : 'left') : (mv.y > 0 ? 'up' : 'down');
  if (nav.dir === 'held') {
    // A direction still held from walking waits for release before it moves the cursor.
    if (!dir) nav.dir = null;
  } else {
    if (dir && dir !== nav.dir) { navStep(dir, mode, all); nav.repeatAt = t + 0.4; }
    else if (dir && t > nav.repeatAt) { navStep(dir, mode, all); nav.repeatAt = t + 0.15; }
    nav.dir = dir;
  }
  if (input.pressed('act') && nav.el && usable(nav.el)) nav.el.click();
}
const syncNavSource = (src) => document.body.classList.toggle('nav-touch', src === 'touch');
input.onSourceChange(syncNavSource);
syncNavSource(input.source);

    const e=this.interactables.find(i=>i.id==='elder');
    if(e?.marker) e.marker.visible=this.questStage===0||this.questStage===3;
    this.bossGroup.visible=this.questStage>=2&&this.questStage<3;
    this.bossMarker.visible=this.bossGroup.visible;
  }

  openChest(){
    if(this.chestOpened){ this.say('Road Chest',["Empty. Someone already took the sensible supplies. (It was you.)"]); return; }
    this.chestOpened=true; this.gold+=16; this.herbs+=1; if(this.chestMarker) this.chestMarker.visible=false;
    this.chest.rotation.z=.04;
    this.say('Road Chest',["You found 16G and a Medicinal Herb.","That is enough money to make a meaningful gear choice at Mara's shop."],()=>{this.toast('+16G · Herb +1');this.updateUI();});
  }

  say(speaker,lines,onDone=null){
    if(this.mode==='combat') return;
    this.mode='dialogue'; this.dialogueQueue=lines.map(t=>({speaker,text:t})); this.dialogueDone=onDone; this.advanceDialogue(true);
  }

  advanceDialogue(first=false){
    if(this.mode!=='dialogue') return;
    if(!first) audio.click();
    const next=this.dialogueQueue.shift();
    if(next){ speakerEl.textContent=next.speaker||''; dialogueTextEl.textContent=next.text; dialogueEl.classList.remove('hidden'); }
    else {
      dialogueEl.classList.add('hidden'); const done=this.dialogueDone; this.dialogueDone=null; this.mode='world'; if(done) done();
    }
  }

  openShop(){
    if(this.mode!=='world'&&this.mode!=='shop') return;
    this.mode='shop';
    const items=[
      {id:'saber',name:'Copper Saber',desc:'+5 ATK (replaces Pilgrim Blade)',cost:24,owned:this.weapon==='Copper Saber'},
      {id:'coat',name:'Wayfarer Coat',desc:'+5 DEF (replaces Traveler Vest)',cost:26,owned:this.armor==='Wayfarer Coat'},
      {id:'herb',name:'Medicinal Herb',desc:'Restore 20 HP in battle',cost:6,owned:false}
    ];
    shopEl.innerHTML=`<h3>Mara's Road Gear</h3><p>You have <b>${this.gold}G</b>. The slice is tuned so one upgrade helps, but neither is mandatory.</p><div class="shop-list">${items.map(i=>`<div class="shop-item"><div><strong>${i.name}</strong><span>${i.desc}</span></div><button class="small-btn" data-buy="${i.id}" ${i.owned?'disabled':''}>${i.owned?'Equipped':i.cost+'G'}</button></div>`).join('')}</div><div class="shop-buttons"><button class="small-btn" id="closeShop">Done</button></div>`;
    shopEl.classList.remove('hidden');
  }

  buy(id){
    if(this.mode!=='shop') return;
    const data={saber:{cost:24},coat:{cost:26},herb:{cost:6}}[id]; if(!data) return;
    if(id==='saber'&&this.weapon==='Copper Saber') return; if(id==='coat'&&this.armor==='Wayfarer Coat') return;
    if(this.gold<data.cost){this.toast('Not enough gold');audio.tone(110,.1,'square',.02);return;}
    this.gold-=data.cost;
    if(id==='saber'){this.weapon='Copper Saber';this.weaponBonus=5;this.toast('Copper Saber equipped · ATK up');}
    if(id==='coat'){this.armor='Wayfarer Coat';this.armorBonus=5;this.toast('Wayfarer Coat equipped · DEF up');}
    if(id==='herb'){this.herbs++;this.toast('Medicinal Herb +1');}
    audio.quest(); this.updateUI(); this.openShop();
  }

  closeShop(){ if(this.mode!=='shop') return; shopEl.classList.add('hidden'); this.mode='world'; }

  handleAction(){
    audio.unlock();
    if(this.mode==='dialogue'){this.advanceDialogue();return;}
    if(this.mode!=='world') return;
    if(this.nearest){ audio.click(); this.nearest.action(); }
    else this.toast('Nothing to inspect here');
  }

  canMove(x,z){
    const r=.42;
    for(const c of this.colliders){
      if(c.type==='circle'){
        const dx=x-c.x,dz=z-c.z;if(dx*dx+dz*dz<(c.r+r)*(c.r+r)) return false;
      }else{
        if(x+r>c.x-c.hx&&x-r<c.x+c.hx&&z+r>c.z-c.hz&&z-r<c.z+c.hz) return false;
      }
    }
    return true;
  }

  groundHeight(x,z){
    if(z<-27){ const t=clamp((-z-27)/3,0,1); return lerp(0,.8,t); }
    if(z<-15.3&&z>-20.7&&Math.abs(x)<3.1) return .18;
    return 0;
  }

  updateMovement(dt){
    if(this.mode!=='world'||!this.started) return;
    const mv=input.vector('move');
    const l=Math.hypot(mv.x,mv.y);
    const hero=this.hero;
    if(l>.05){
      // Camera-relative: forward is away from the camera, right is 90° clockwise of it.
      const s=Math.sin(this.cameraYaw), c=Math.cos(this.cameraYaw);
      let dx=-s*mv.y+c*mv.x, dz=-c*mv.y-s*mv.x;
      const dl=Math.hypot(dx,dz)||1; dx/=dl; dz/=dl;
      const speed=5.25*Math.min(1,l); const nx=hero.position.x+dx*speed*dt, nz=hero.position.z+dz*speed*dt;
      if(this.canMove(nx,hero.position.z)) hero.position.x=nx;
      if(this.canMove(hero.position.x,nz)) hero.position.z=nz;
      const targetRot=Math.atan2(-dx,-dz); let d=targetRot-hero.rotation.y; d=Math.atan2(Math.sin(d),Math.cos(d)); hero.rotation.y+=d*Math.min(1,dt*12);
      this.walk+=dt*10*Math.min(1,l); hero.position.y=this.groundHeight(hero.position.x,hero.position.z)+Math.abs(Math.sin(this.walk))*.035;
    } else hero.position.y=lerp(hero.position.y,this.groundHeight(hero.position.x,hero.position.z),Math.min(1,dt*10));
  }

  updateNearby(){
    if(this.mode!=='world'){this.nearest=null;return;}
    let best=null,bestD=Infinity; const px=this.hero.position.x,pz=this.hero.position.z;
    for(const i of this.interactables){ if(!i.active) continue; const d=Math.hypot(px-i.x,pz-i.z); if(d<i.radius&&d<bestD){best=i;bestD=d;} }
    this.nearest=best;
    const label=best?best.label:'Look';
    if(label!==this.actLabel){ this.actLabel=label; kit.touch?.setLabel('act',label); }
    // Enemy touch triggers.
    for(const e of this.enemies){ if(!e.active) continue; const d=Math.hypot(px-e.model.position.x,pz-e.model.position.z); if(d<1.28){this.startCombat(e);return;} }
    if(this.questStage>=2&&this.questStage<3&&this.bossGroup.visible&&Math.hypot(px-this.bossGroup.position.x,pz-this.bossGroup.position.z)<2.45){
      this.startCombat({type:'boss',name:'Moonbell Guardian',maxHp:66,hp:66,atk:10,def:3,xp:38,gold:34,model:this.bossGroup,active:true,boss:true});
    }
  }

  startCombat(enemy){
    if(this.mode!=='world') return;
    this.mode='combat'; this.battle=enemy; this.battle.hp=enemy.hp??enemy.maxHp; this.battle.turn=0; this.battleBusy=false; this.guarding=false;
    combatActionsEl.innerHTML=COMBAT_BUTTONS;
    combatEl.classList.remove('hidden'); enemyNameEl.textContent=enemy.name; this.setCombatLog(`${enemy.name} blocks the road!`); this.updateCombatUI(); audio.hit();
    input.rumble(0.35,120);
  }

  setCombatLog(text){ combatLogEl.textContent=text; }

  updateCombatUI(){
    if(!this.battle) return;
    enemyHpEl.textContent=`HP ${Math.max(0,this.battle.hp)} / ${this.battle.maxHp}`;
    turnTagEl.textContent=this.battleBusy?'Resolving…':'Your turn';
    combatActionsEl.querySelectorAll('button[data-action]').forEach(b=>{
      if(b.dataset.action==='continue') return;
      let disabled=this.battleBusy||this.battle.hp<=0;
      if(b.dataset.action==='skill'&&this.mp<4) disabled=true;
      if(b.dataset.action==='herb'&&(this.herbs<=0||this.hp>=this.maxHP)) disabled=true;
      b.disabled=disabled;
    });
    this.updateUI();
  }

  combatAction(action){
    if(this.mode!=='combat'||this.battleBusy||!this.battle||this.battle.hp<=0) return;
    audio.unlock(); this.battleBusy=true; this.battle.turn++;
    let log='';
    if(action==='attack'){
      const dmg=Math.max(1,Math.round(this.attack+Math.random()*3-1-this.battle.def*.45)); this.battle.hp-=dmg; log=`You strike for ${dmg} damage.`; audio.hit(); this.punchEnemy();
    } else if(action==='skill'){
      if(this.mp<4){this.battleBusy=false;this.battle.turn--;return;} this.mp-=4;
      const dmg=Math.max(3,Math.round(this.attack*1.35+4+Math.random()*3-this.battle.def*.25)); this.battle.hp-=dmg; log=`Star Slash flashes for ${dmg} damage!`; audio.tone(760,.12,'sawtooth',.025); audio.tone(980,.11,'triangle',.02,.05); this.punchEnemy(true);
    } else if(action==='guard'){
      this.guarding=true; log='You brace behind your gear.'; audio.tone(220,.08,'triangle',.018);
    } else if(action==='herb'){
      if(this.herbs<=0||this.hp>=this.maxHP){this.battleBusy=false;this.battle.turn--;return;} this.herbs--; const heal=Math.min(20,this.maxHP-this.hp); this.hp+=heal; log=`The herb restores ${heal} HP.`; audio.heal();
    } else { this.battleBusy=false; this.battle.turn--; return; }
    this.setCombatLog(log); this.updateCombatUI();
    if(this.battle.hp<=0){ setTimeout(()=>this.victory(),520); }
    else setTimeout(()=>this.enemyTurn(),620);
  }

  punchEnemy(strong=false){
    if(!this.battle?.model) return; const m=this.battle.model;
    m.userData.baseScale ??= m.scale.clone();
    const base=m.userData.baseScale;
    m.scale.copy(base).multiplyScalar(strong?1.18:1.1); setTimeout(()=>m.scale.copy(base),140);
  }

  enemyTurn(){
    if(this.mode!=='combat'||!this.battle) return;
    const heavy=this.battle.boss&&this.battle.turn%3===0;
    let dmg=Math.max(1,Math.round(this.battle.atk+(heavy?3:0)+Math.random()*2-this.defense*.55));
    if(this.guarding) dmg=Math.max(1,Math.ceil(dmg*.5)); this.guarding=false;
    this.hp-=dmg; this.hp=Math.max(0,this.hp); this.flashDamage(); audio.hit(); input.rumble(heavy?0.8:0.5,heavy?260:140);
    this.setCombatLog(heavy?`The guardian rings a Bellquake for ${dmg} damage!`:`${this.battle.name} hits for ${dmg} damage.`);
    if(this.hp<=0){ this.updateUI(); setTimeout(()=>this.faint(),700); return; }
    this.battleBusy=false; this.updateCombatUI();
  }

  flashDamage(){ flashEl.classList.add('on'); setTimeout(()=>flashEl.classList.remove('on'),90); }

  victory(){
    if(!this.battle) return;
    const b=this.battle; b.hp=0; audio.win();
    const reward=`Victory! +${b.xp} XP · +${b.gold}G`;
    this.xp+=b.xp; this.gold+=b.gold;
    if(b.boss){ this.questStage=3; this.bossGroup.visible=false; this.bossMarker.visible=false; this.updateQuestMarker(); }
    else { b.active=false; b.model.visible=false; this.kills++; if(this.questStage===1&&this.kills>=1){this.questStage=2;this.updateQuestMarker();this.toast('Road proven · Moonbell Shrine unlocked');} }
    const leveled=this.checkLevel();
    this.setCombatLog(reward+(leveled?` · Level ${this.level}!`:'')); enemyHpEl.textContent='Defeated'; turnTagEl.textContent='Victory';
    combatActionsEl.innerHTML=`<button data-action="continue" style="grid-column:1/-1">Continue<small>Return to the road</small></button>`;
    this.battleBusy=true; this.updateUI();
  }

  checkLevel(){
    const thresholds=[0,20,52,92,140]; let target=1; for(let i=1;i<thresholds.length;i++) if(this.xp>=thresholds[i]) target=i+1;
    if(target>this.level){ this.level=target; this.hp=this.maxHP; this.mp=this.maxMP; this.toast(`Level ${this.level}! HP, MP, ATK and DEF increased`); audio.quest(); return true; }
    return false;
  }

  endCombat(){
    if(this.mode!=='combat') return;
    combatEl.classList.add('hidden');
    combatActionsEl.innerHTML=COMBAT_BUTTONS;
    this.battle=null; this.battleBusy=false; this.mode='world'; this.hero.position.z+=.7;
    if(this.questStage===3) this.toast('Return to Elder Nessa');
  }

  faint(){
    this.setCombatLog('You faint. Bellroot villagers haul you home before the monsters can brag about it.');
    setTimeout(()=>{
      if(this.battle&&!this.battle.boss){this.battle.model.visible=true;this.battle.active=true;this.battle.hp=this.battle.maxHp;}
      if(this.battle?.boss){this.bossGroup.visible=true;this.bossMarker.visible=true;}
      this.gold=Math.max(0,this.gold-Math.ceil(this.gold*.2)); this.hp=this.maxHP; this.mp=this.maxMP; this.hero.position.set(0,0,24); combatEl.classList.add('hidden');
      combatActionsEl.innerHTML=COMBAT_BUTTONS;
      this.battle=null;this.battleBusy=false;this.mode='world';this.toast('Recovered in Bellroot Vale · lost 20% gold');this.updateUI();
    },1100);
  }

  complete(){
    this.mode='complete'; hud.classList.add('hidden'); backendBadge.classList.add('hidden');
    $('completeText').textContent=`Final level ${this.level} · ${this.weapon} · ${this.armor} · ${this.gold}G remaining. You cleared the full exploration, combat, gear, progression, boss, and return loop.`;
    completeEl.classList.remove('hidden'); audio.win();
  }

  toast(text){
    const t=document.createElement('div');t.className='toast';t.textContent=text;$('toasts').appendChild(t);setTimeout(()=>t.remove(),2500);
  }

  updateEnemies(dt){
    for(const e of this.enemies){ if(!e.active) continue; e.phase+=dt*(e.type==='mossling'?1.6:1.2); const r=e.type==='mossling'?.75:.52;
      e.model.position.x=e.homeX+Math.sin(e.phase*.7)*r; e.model.position.z=e.homeZ+Math.cos(e.phase*.6)*r; e.model.position.y=Math.abs(Math.sin(e.phase*2.2))*.08; e.model.rotation.y=Math.sin(e.phase*.5)*.5;
    }
    if(this.bossGroup.visible) this.bossGroup.rotation.y=Math.sin(this.elapsed*.45)*.14;
    for(const m of this.motes){ m.mesh.position.set(Math.cos(this.elapsed*.65+m.phase)*m.r,m.h+.3*Math.sin(this.elapsed*1.4+m.phase*2),-34+Math.sin(this.elapsed*.65+m.phase)*m.r); m.mesh.rotation.y+=dt*1.8; m.mesh.rotation.x+=dt*.7; }
    if(this.elder) this.elder.position.y=Math.sin(this.elapsed*2)*.025;
  }

  updateCamera(dt){
    const target=_camTarget;
    if(this.battle?.model&&this.mode==='combat') target.addVectors(this.hero.position,this.battle.model.position).multiplyScalar(.5).setY(1.2);
    else target.set(this.hero.position.x,this.hero.position.y+1.05,this.hero.position.z);
    this.cameraTarget.lerp(target,1-Math.exp(-dt*7));
    const battleZoom=this.mode==='combat'?Math.min(this.zoom,9.5):this.zoom;
    _camOffset.set(Math.sin(this.cameraYaw)*battleZoom*.72,battleZoom*.68,Math.cos(this.cameraYaw)*battleZoom*.72).add(this.cameraTarget);
    camera.position.lerp(_camOffset,1-Math.exp(-dt*6)); camera.lookAt(this.cameraTarget);
  }

  updateUI(){
    const hpPct=clamp(this.hp/this.maxHP*100,0,100),mpPct=clamp(this.mp/this.maxMP*100,0,100);
    setText(hudEls.level,`Lv ${this.level}`); setWidth(hudEls.hpbar,`${hpPct}%`); setWidth(hudEls.mpbar,`${mpPct}%`); setText(hudEls.hptext,`${this.hp}/${this.maxHP}`); setText(hudEls.mptext,`${this.mp}/${this.maxMP}`);
    setText(hudEls.xptext,`XP ${this.xp}`); setText(hudEls.goldtext,`${this.gold}G`); setText(hudEls.herbtext,`Herb ×${this.herbs}`); setText(hudEls.questtext,this.questText());
  }

  menuButtons(){
    if(this.mode==='title') return [beginButton];
    if(this.mode==='complete') return [restartButton];
    if(this.mode==='combat') return [...combatActionsEl.querySelectorAll('button')];
    if(this.mode==='shop') return [...shopEl.querySelectorAll('button')];
    return null;
  }

  handleInput(dt,t){
    const mode=this.mode;
    if(mode!==this.lastMode){
      const mv=input.vector('move'); nav.dir=Math.hypot(mv.x,mv.y)>0.5?'held':null;
      this.lastMode=mode;
    }
    if(this.started){
      const z=input.zoom();
      const zk=(input.down('zoomOut')?1:0)-(input.down('zoomIn')?1:0);
      if(z||zk) this.zoom=clamp(this.zoom-z*.8+zk*7*dt,8.2,17);
    }
    if(mode==='world'){
      const lk=input.look('look');
      // Match the original feel: 0.008 rad per dragged pixel with mouse or finger.
      const p=input.pointer;
      const k=p.down?(p.type==='touch'?1.45:3.33):1;
      this.cameraYaw-=lk.x*k;
      if(input.pressed('act')) this.handleAction();
      else if(input.pressed('pause')) kit.menu.open();
      return;
    }
    if(mode==='dialogue'){
      if(input.pressed('act')||input.pointer.justDown) this.advanceDialogue();
      else if(input.pressed('pause')) kit.menu.open();
      return;
    }
    if(mode==='shop'&&input.pressed('back')){ this.closeShop(); return; }
    if(input.pressed('pause')){ kit.menu.open(); return; }
    if(mode==='combat'){
      for(const a of ['attack','skill','guard','herb']) if(input.pressed(a)){ this.combatAction(a); return; }
    }
    const buttons=this.menuButtons();
    if(buttons) navUpdate(mode,buttons,t);
  }

  tick(dt,t){
    this.elapsed+=dt;
    this.handleInput(dt,t);
    this.applyTouch();
    this.updateMovement(dt); this.updateEnemies(dt); this.updateNearby(); this.updateCamera(dt); this.updateUI();
    // Quest marker bob/rotate.
    for(const i of this.interactables){ if(i.marker&&i.marker.visible){ i.marker.rotation.y+=dt*1.8; i.marker.position.y=2.75+Math.sin(this.elapsed*3)*.18; }}
    if(this.bossMarker.visible){this.bossMarker.rotation.y+=dt*1.4;this.bossMarker.position.y=4.4+Math.sin(this.elapsed*2.7)*.2;}
  }
}

const game=new Game();
game.applyTouch();

// Anti-aliasing per tier: MSAA on high, FXAA on medium (the kit's standard chain).
const post=createPost(kit,scene,camera);
await renderer.compileAsync(scene,camera);

kit.start((dt,t)=>{ game.tick(dt,t); post.render(); });
  </script>
</body>
