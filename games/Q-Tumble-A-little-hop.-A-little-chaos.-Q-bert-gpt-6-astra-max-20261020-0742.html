	function pulse() {

	function rescue(disc = false) {

			return;

			fromC: p.c,
			t: 0,

	function takeHit(fell = false) {

		p.c = 0;

	function collision() {

			if (e.hop || e.born > 0 || e.r !== p.r || e.c !== p.c) continue;
			if (e.type === "cleaner" || e.stunned > 0 || game.frozen > 0) {
				game.enemies.splice(game.enemies.indexOf(e), 1);

					e.r,
					e.c,
					e.type === "cleaner" ? "CAUGHT +200" : "+100",

				0,
				Math.round((LEVELS[game.level].par - game.elapsed) * 10),

			game.lastBonus = bonus;
			game.score += bonus;

				(game.levelDeaths === 0 ? 1 : 0) +
				(game.elapsed < LEVELS[game.level].par ? 1 : 0);

			audio.play("clear");

	function nextStage() {

				return;

			game.mode = "victory";
			records.wins++;
			recordBest();
			game.menuIndex = 0;
			renderUI();
			return;
		}
		game.level++;
		game.lives = Math.min(
			settings.difficulty === "Gentle" ? 5 : 4,
			game.lives + 1,

	function spawnEnemy() {

			return;

			type = config.enemies[game.enemySequence++ % config.enemies.length];
		if (type === "chaser" && game.enemies.some((e) => e.type === "chaser"))
			return;

		const c = type === "cleaner" ? (Math.random() < 0.5 ? 0 : 6) : 0;

			r,
			c,

			timer: 1.7,

			hop: null,
			born: 1.2,

			);

			game.enemySequence % 2 === 0 &&
			!game.pickups.length

	function moveEnemy(e) {

				e.remove = true;
				burst(e.r, e.c, "#f29c9f", 6);
				return;
			}
		} else if (e.type === "cleaner") {
			options.sort(
				(a, b) =>
					getTile(b.r, b.c).value - getTile(a.r, a.c).value ||
					a.r - b.r ||
					Math.random() - 0.5,
			);
		} else {
			options.sort(
				(a, b) => gridDistance(a, game.player) - gridDistance(b, game.player),
			);
		}
		const target =
			e.type === "roller"
				? options[Math.floor(Math.random() * options.length)]
				: options[0];
		if (!target) return;
		e.facing = target.dir;
		e.hop = { fromR: e.r, fromC: e.c, t: 0, duration: 0.35 };
		e.r = target.r;
		e.c = target.c;

	function updateEnemies(dt) {

			e.born = Math.max(0, (e.born || 0) - dt);
			if (e.stunned > 0) {
				e.stunned -= dt;
				continue;
			}
			if (game.frozen > 0) continue;
			if (e.hop) {
				e.hop.t += dt * speed;
				if (e.hop.t >= e.hop.duration) {
					e.hop = null;
					if (e.type === "cleaner") {
						const t = getTile(e.r, e.c);
						if (!t.sealed && !t.beacon) {
							t.value = Math.max(0, t.value - 1);
							t.bounce = 0.5;
						}
					}
					collision();
				}
			} else if (!e.born) {
				e.timer -= dt * speed;
				if (e.timer <= 0) {
					e.timer =
						e.type === "chaser" ? 0.82 : e.type === "cleaner" ? 1.2 : 0.92;
					moveEnemy(e);
				}
			}

		game.enemies = game.enemies.filter((e) => !e.remove);
	}
	function updateBoss(dt) {

			game.sweep.time -= dt;
			if (game.sweep.time <= 0) {
				game.sweep = null;
				game.bossTimer = 5.5;
				return;
			}
			if (game.sweep.time < 0.55 && !game.sweep.fired) {
				game.sweep.fired = true;
				for (const t of game.tiles.filter(
					(t) => t.c === game.sweep.lane || t.r - t.c === game.sweep.lane,
				))
					burst(t.r, t.c, "#ff9fc8", 10);
				if (
					!game.player.hop &&
					(game.player.c === game.sweep.lane ||
						game.player.r - game.player.c === game.sweep.lane)

					takeHit();
				audio.play("warning");
			}
		} else {
			game.bossTimer -= dt;
			if (game.bossTimer <= 0) {

					lane: Math.min(4, game.player.c),
					time: 2.5,
					fired: false,

				audio.play("warning");
			}

	}
	function autoPlay(dt) {

			game.autoTimer > 0 ||
			game.player.hop ||
			game.player.rescue ||
			game.clearDelay > 0

			return;

		game.autoSteps++;

			pulse();

		if (game.autoSteps === 18 && game.level === 3) {
			rescue();
			return;
		}
		const p = game.player;
		let targets = game.tiles.filter(
			(t) => t.value < t.goal || (t.beacon && !t.lit),
		);
		if (!targets.length) {
			checkClear();
			return;
		}
		// Detour during the daydream so pickups and edge-disc escapes are visible.
		const showcaseDisc = game.discs[1];
		if (game.level === 3 && game.autoSteps >= 8 && !showcaseDisc.used) {
			if (p.r === showcaseDisc.r && p.c === showcaseDisc.c) {
				hop(1);
				return;

			targets = [showcaseDisc];

			targets = [...game.pickups];

				path = node.path;
				break;
			}
			for (const n of neighbors(node.r, node.c)) {
				const route = [...node.path, n.dir];
				// The entry cube is painted before the portal moves us.
				if (targets.some((t) => t.r === n.r && t.c === n.c)) {
					path = route;
					break search;

				const entry = getTile(n.r, n.c);
				const exit = entry.portal
					? game.tiles.find((t) => t.portal && t !== entry)
					: null;
				const arrival = exit || n;
				const key = tileKey(arrival.r, arrival.c);
				if (visited.has(key)) continue;
				visited.add(key);
				queue.push({ r: arrival.r, c: arrival.c, path: route });
			}
		}
		if (!path) path = [neighbors(p.r, p.c)[0].dir];
		if (LEVELS[game.level].toggle) {
			const t = getTile(p.r, p.c);

	function update(dt) {
		worldTime += dt;
		if (
			["title", "settings", "guide", "about", "select"].includes(game.mode) &&
			game.previous !== "pause" &&
			performance.now() - lastInput >= 10000
		)
			startRun(true);
		game.flash = Math.max(0, game.flash - dt);
		game.shake = Math.max(0, game.shake - dt);
		if (game.mode !== "play") return;
		game.introTime += dt;
		if (game.toastTime > 0) game.toastTime -= dt;
		for (const t of game.tiles) t.bounce = Math.max(0, t.bounce - dt * 3);
		for (const particle of game.particles) {
			particle.life -= dt;
			particle.x += particle.vx * dt;
			particle.y += particle.vy * dt;
			particle.vy += dt * 150;
		}
		game.particles = game.particles.filter((p) => p.life > 0);
		for (const ring of game.rings) ring.life -= dt;
		game.rings = game.rings.filter((r) => r.life > 0);
		for (const floater of game.floaters) floater.life -= dt;
		game.floaters = game.floaters.filter((f) => f.life > 0);
		if (game.clearDelay > 0) {
			game.clearDelay -= dt;
			if (game.clearDelay <= 0) {
				if (game.attract) nextStage();
				else {
					game.mode = "clear";
					game.menuIndex = 0;
					renderUI();
				}
			}
			return;
		}
		game.elapsed += dt;
		game.totalTime += dt;
		game.comboTimer = Math.max(0, game.comboTimer - dt);
		if (!game.comboTimer) game.combo = 0;
		game.frozen = Math.max(0, game.frozen - dt);
		game.portalCooldown = Math.max(0, game.portalCooldown - dt);
		const p = game.player;
		p.invincible = Math.max(0, p.invincible - dt);
		p.squash = Math.max(0, p.squash - dt * 6);
		p.rescue = Math.max(0, p.rescue - dt);
		if (p.falling > 0) {
			p.falling += dt;
			if (p.falling > 0.6) takeHit(true);
		} else if (p.hop) {
			p.hop.t += dt;
			if (p.hop.t >= p.hop.duration) {
				const off = p.hop.off;
				p.hop = null;
				if (off) p.falling = 0.01;
				else land();
			}
		}
		if (!p.hop && !p.falling && bufferedDirection >= 0 && !game.attract) {
			const dir = bufferedDirection;
			bufferedDirection = -1;
			hop(dir);
		}

		if (game.spawnTimer <= 0) {
			spawnEnemy();
			game.spawnTimer = game.attract ? 4.5 : LEVELS[game.level].interval;
		}
		updateEnemies(dt);
		updateBoss(dt);
		collision();
		if (game.attract) autoPlay(dt);
	}

	// Procedural Canvas 2D art: every shape and sound is contained in this file.
	function path(points, fill, stroke = null, width = 1) {
		ctx.beginPath();
		ctx.moveTo(points[0][0], points[0][1]);
		for (let i = 1; i < points.length; i++)
			ctx.lineTo(points[i][0], points[i][1]);
		ctx.closePath();
		if (fill) {
			ctx.fillStyle = fill;
			ctx.fill();
		}
		if (stroke) {
			ctx.strokeStyle = stroke;
			ctx.lineWidth = width;
			ctx.stroke();
		}
	}
	function ellipse(x, y, rx, ry, fill, stroke = null, width = 1) {
		ctx.beginPath();
		ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), 0, 0, TAU);
		if (fill) {
			ctx.fillStyle = fill;
			ctx.fill();
		}
		if (stroke) {
			ctx.strokeStyle = stroke;
			ctx.lineWidth = width;
			ctx.stroke();
		}
	}
	function line(points, stroke, width = 1) {
		ctx.beginPath();
		ctx.moveTo(...points[0]);
		for (const p of points.slice(1)) ctx.lineTo(...p);

		ctx.lineWidth = width;
		ctx.lineCap = "round";
		ctx.lineJoin = "round";
		ctx.stroke();
	}

			points.push([x + Math.cos(a) * radius, y + Math.sin(a) * radius]);
		}
		path(points, color);
	}

				? "♥ ♥ ♥ ∞"
				: "♥ ".repeat(Math.max(0, game.lives)) +
					"♡ ".repeat(Math.max(0, 3 - game.lives));
		const done = game.tiles.filter((t) => t.value >= t.goal).length;
		if ($("progress-text"))
			$("progress-text").textContent = `${done} / ${game.tiles.length}`;
		if ($("progress-bar"))
			$("progress-bar").style.width =
				`${(done / Math.max(1, game.tiles.length)) * 100}%`;
		if ($("charge"))
			$("charge").innerHTML = Array.from(
				{ length: 6 },
				(_, i) => `<i class="${game.charge > i ? "on" : ""}"></i>`,
			).join("");
		if ($("charge-note"))
			$("charge-note").textContent =
				game.charge >= 6
					? "Ready · paint & stun nearby"
					: `${game.charge} / 6 sparks · light cubes to refill`;
		if ($("recalls")) $("recalls").textContent = `· ${game.rescues}`;
		if ($("combo"))
			$("combo").innerHTML =
				game.combo >= 2
					? `<b>×${1 + Math.min(3, Math.floor(game.combo / 6))}</b><span>${game.combo} color flow</span>`
					: game.frozen > 0
						? `<b>❄</b><span>${Math.ceil(game.frozen)}s frozen</span>`
						: "";
		if ($("toast")) {
			$("toast").hidden = game.toastTime <= 0;
			$("toast").textContent = game.toast;
		}
		if ($("title-idle"))
			$("title-idle").textContent =
				`A daydream begins in ${Math.max(0, Math.ceil(10 - (performance.now() - lastInput) / 1000))}s`;
	}

	function activity() {
		lastInput = performance.now();
		if (game.attract) {
			suppressPointerUntil = performance.now() + 250;
			returnTitle();
			return true;
		}
		return false;
	}
	function activate() {
		if (menuItems[game.menuIndex] && !menuButtons[game.menuIndex]?.disabled)
			menuItems[game.menuIndex].action();
	}
	function back() {
		if (game.mode === "play") pause();
		else if (game.mode === "pause" || game.mode === "quit") resume();
		else if (["settings", "guide", "about"].includes(game.mode)) closePanel();
		else if (
			["select", "intro", "clear", "gameover", "victory"].includes(game.mode)
		) {
			if (game.mode === "intro") {
				game.mode = "play";
				pause();
			} else returnTitle();
		}
	}
	function keyboardDirection(code) {
		return (
			{
				ArrowLeft: 0,
				KeyA: 0,
				ArrowUp: 1,
				KeyW: 1,
				ArrowDown: 2,
				KeyS: 2,
				ArrowRight: 3,
				KeyD: 3,
				KeyQ: 0,
				KeyE: 1,
				KeyZ: 2,
				KeyC: 3,
			}[code] ?? -1
		);
	}
	function vectorDirection(x, y) {
		if (settings.invertX) x *= -1;
		if (settings.invertY) y *= -1;
		if (Math.hypot(x, y) < 0.3) return -1;
		if (Math.abs(x) > 0.3 && Math.abs(y) > 0.3)
			return y < 0 ? (x < 0 ? 0 : 1) : x < 0 ? 2 : 3;
		if (Math.abs(x) > Math.abs(y)) return x < 0 ? 0 : 3;
		return y < 0 ? 1 : 2;
	}
	window.addEventListener("keydown", (event) => {
		const wasBlocked = touchBlocked();
		hasKeyboard = true;
		if (activity()) {
			event.preventDefault();
			return;
		}
		audio.unlock();
		if (inputKind !== "keyboard" || wasBlocked) {
			inputKind = "keyboard";
			renderUI();
		}
		if (event.code === "Tab") {
			event.preventDefault();
			selectButton(game.menuIndex + (event.shiftKey ? -1 : 1));
			return;
		}
		if (
			[
				"ArrowLeft",
				"ArrowRight",
				"ArrowUp",
				"ArrowDown",
				"Space",
				"Enter",
				"Escape",
			].includes(event.code)
		)
			event.preventDefault();
		if (event.repeat) return;
		keyHeld.add(event.code);
		if (event.code === "KeyF") {
			toggleFullscreen();
			return;
		}
		if (event.code === "Escape" || event.code === "KeyP") {
			back();
			return;
		}
		if (game.mode === "play") {
			if (event.code === "Space") pulse();
			else if (event.code === "KeyR") rescue();
			else if (event.code === "KeyH") {
				pause();
				openPanel("guide");
			} else {
				const dir = keyboardDirection(event.code);
				if (dir >= 0) {
					lastKeyDirection = dir;
					nextKeyRepeat = performance.now() + 270;
					hop(dir);
				}
			}
		} else {
			if (event.code === "Enter" || event.code === "Space") activate();
			else if (event.code === "ArrowUp" || event.code === "KeyW")
				selectButton(game.menuIndex - 1);
			else if (event.code === "ArrowDown" || event.code === "KeyS")
				selectButton(game.menuIndex + 1);
			else if (event.code === "ArrowLeft" || event.code === "KeyA") {
				if (menuItems[game.menuIndex]?.adjust)
					menuItems[game.menuIndex].adjust(-1);
				else selectButton(game.menuIndex - 1);
			} else if (event.code === "ArrowRight" || event.code === "KeyD") {
				if (menuItems[game.menuIndex]?.adjust)
					menuItems[game.menuIndex].adjust(1);
				else selectButton(game.menuIndex + 1);
			}
		}
	});
	window.addEventListener("keyup", (event) => {
		keyHeld.delete(event.code);
		if (keyboardDirection(event.code) === lastKeyDirection) {
			lastKeyDirection = -1;
			bufferedDirection = -1;
		}
	});
	window.addEventListener(
		"pointerdown",
		(event) => {
			if (activity()) {
				event.preventDefault();
				event.stopPropagation();
			} else audio.unlock();
		},
		true,
	);
	window.addEventListener(
		"pointermove",
		(event) => {
			if (
				!pointerPosition ||
				event.clientX !== pointerPosition.x ||
				event.clientY !== pointerPosition.y
			)
				activity();
			pointerPosition = { x: event.clientX, y: event.clientY };
		},
		{ passive: true },
	);
	window.addEventListener("wheel", () => activity(), { passive: true });
	window.addEventListener("blur", () => {
		keyHeld.clear();
		lastKeyDirection = -1;
		bufferedDirection = -1;
		if (game.mode === "play" && !game.attract) pause();
	});
	document.addEventListener("visibilitychange", () => {
		if (document.hidden) {
			keyHeld.clear();
			if (game.mode === "play" && !game.attract) pause();
		}
		lastFrame = performance.now();
	});
	window.addEventListener("gamepadconnected", () => {
		audio.unlock();
	});
	function toggleFullscreen() {
		try {
			const promise = document.fullscreenElement
				? document.exitFullscreen()
				: document.documentElement.requestFullscreen();
			promise?.catch(() => {});
		} catch {}
	}
	function pollInput(now) {
		try {
			pad =
				Array.from(navigator.getGamepads?.() || []).find((p) => p?.connected) ||
				null;
		} catch {
			pad = null;
		}
		if (padWasPresent && !pad) {
			if (game.mode === "play" && !game.attract) {
				pause();
				announce("Controller disconnected. Game paused.");
			}
			prevPadButtons = [];
			padDirection = -1;
			inputKind = "keyboard";
			renderUI();
		}
		padWasPresent = Boolean(pad);
		if (pad) {
			const buttons = pad.buttons.map((b) => b.pressed || b.value > 0.5);
			const pressed = (index) => buttons[index] && !prevPadButtons[index];
			let x = pad.axes[0] || 0,
				y = pad.axes[1] || 0;
			if (buttons[14] || buttons[15] || buttons[12] || buttons[13]) {
				x = Number(Boolean(buttons[15])) - Number(Boolean(buttons[14]));
				y = Number(Boolean(buttons[13])) - Number(Boolean(buttons[12]));
			}
			const dir = vectorDirection(x, y);
			const input = buttons.some((b, i) => b && !prevPadButtons[i]) || dir >= 0;
			if (input) {
				if (activity()) {
					prevPadButtons = buttons;
					padNextRepeat = now + 300;
					padDirection = dir;
					return;
				}
				audio.unlock();
				if (inputKind !== "gamepad") {
					inputKind = "gamepad";
					renderUI();
				}
			}
			if (game.mode === "play") {
				if (pressed(9) || pressed(1)) pause();
				else if (pressed(0)) pulse();
				else if (pressed(2)) rescue();
				else if (pressed(3)) {
					pause();
					openPanel("guide");
				} else if (dir >= 0 && (dir !== padDirection || now >= padNextRepeat)) {
					hop(dir);
					padNextRepeat = now + 260;
				}
			} else {
				if (pressed(1)) back();
				else if (pressed(0) || pressed(9)) activate();
				else if (dir >= 0 && (dir !== padDirection || now >= padNextRepeat)) {
					// Menus use physical directions; inversion only affects play.
					if (Math.abs(y) > Math.abs(x))
						selectButton(game.menuIndex + (y < 0 ? -1 : 1));
					else if (menuItems[game.menuIndex]?.adjust)
						menuItems[game.menuIndex].adjust(x < 0 ? -1 : 1);
					else selectButton(game.menuIndex + (x < 0 ? -1 : 1));
					padNextRepeat = now + 260;
				}
			}
			prevPadButtons = buttons;
			padDirection = dir;
		}
		if (
			game.mode === "play" &&
			!game.attract &&
			lastKeyDirection >= 0 &&
			now >= nextKeyRepeat &&
			[...keyHeld].some((code) => keyboardDirection(code) === lastKeyDirection)
		) {
			hop(lastKeyDirection);
			nextKeyRepeat = now + 260;
		}
	}
	function resize() {
		W = innerWidth;
		H = innerHeight;
		dpr = window.devicePixelRatio || 1;
		canvas.width = Math.round(W * dpr);
		canvas.height = Math.round(H * dpr);
	}
	window.addEventListener("resize", resize);
	let hudTimer = 0;
	function frame(now) {
		const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
		lastFrame = now;
		pollInput(now);
		if (!document.hidden) {
			update(dt);
			audio.update();
			render();
		}
		hudTimer += dt;
		if (hudTimer > 0.1) {
			updateHud();
			hudTimer = 0;
		}
		requestAnimationFrame(frame);
	}
	resize();
	initBoard(0, true);
	renderUI();
	requestAnimationFrame(frame);
	// Read-only diagnostics support reproducible verification without gameplay cheats.
	Object.defineProperty(window, "QTumble", {
		value: Object.freeze({
			snapshot: () => ({
				mode: game.mode,
				attract: game.attract,
				level: game.level,
				score: game.score,
				lives: game.lives,
				elapsed: game.elapsed,
				player: game.player
					? {
							r: game.player.r,
							c: game.player.c,
							moving: Boolean(game.player.hop),
							invincible: game.player.invincible,
						}
					: null,
				charge: game.charge,
				rescues: game.rescues,
				frozen: game.frozen,
				deaths: game.deaths,
				menuIndex: game.menuIndex,
				enemies: game.enemies.map((e) => ({
					type: e.type,
					r: e.r,
					c: e.c,
					stunned: e.stunned,
				})),
				tiles: game.tiles.map(
					({ r, c, value, goal, toggle, sealed, portal, beacon, lit }) => ({
						r,
						c,
						value,
						goal,
						toggle,
						sealed,
						portal,
						beacon,
						lit,
					}),
				),
				discs: game.discs.map((d) => ({ ...d })),
				pickups: game.pickups.map((p) => ({ ...p })),
				sweep: game.sweep ? { ...game.sweep } : null,
				settings: { ...settings },
				records: { ...records },
				input: inputKind,
				stars: [...game.stars],
			}),
		}),
		writable: false,
	});
})();
</script>
  </body>
</html>
