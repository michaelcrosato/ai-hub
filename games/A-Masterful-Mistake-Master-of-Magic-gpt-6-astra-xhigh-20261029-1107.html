<!-- A MASTERFUL MISTAKE — SOURCE INFORMATION
Date: 2026-10-29 12:15 PDT (America/Vancouver). Session began 11:07 PDT.
Source: Master of Magic. Original spiritual successor with original writing and procedural art.
Title selection: Cryptographic random draw 5 from 50 privately brainstormed titles.
Tech: Three.js r180 (0.180.0); WebGPU only, with the WebGL fallback explicitly disabled; Rapier 0.19.3; Gamepad API; Web Audio API; JavaScript ES modules; HTML/CSS; localStorage. AI Hub client 1.3.0, Session Protocol v1. Pinned CDN dependencies require an internet connection.
Art Direction: Stylized cel shading, sculpted low-poly hex dioramas, ink outlines, warm parchment, and a controller-first interface.
Animation: Procedural transform animation, eased unit movement, attack lunges, orbiting runes, flags, and projectile arcs; Rapier rigid-body spell debris with ground collisions.
Audio: Original code-written sequenced harp/bass music, synthesized effects, and formant-filtered gibberish wizard voices. No recorded voices, music files, or source-game assets.
Online: AI Hub parallel score challenges for 1–4 players, seeded starts, shared clock, renown updates, result reporting, and lifecycle handling. Standalone solo plus 2–4-player local pass-and-play. No standalone internet lobby or direct player networking.
Testing parameters allowed: Efficient, lightweight functional and visual checks; no FPS target or optimization benchmark. Unattended browser checks, an emulated standard/DualSense controller, the official AI Hub harness, and accelerated tests of the actual campaign and combat rules.
Environment: Codex CLI (headless); Linux (Ubuntu/WSL2); target browser unknown. Validated with Chromium 153.0.8010.12 under Xvfb and a WebGPU SwiftShader adapter. Initial Google Chrome 154 headless captures were unsuitable; a minimal-scene diagnostic established the working capture configuration.
Model: OpenAI, gpt-6-astra, reasoning effort xhigh.
Usage: Estimated API cost in USD unknown. Total tokens and token breakdown unknown. Estimated session time approximately 70 minutes.

TESTING FEEDBACK
Issues caught: Six game issues found through tests and review, all fixed: premature GPU resource disposal; controller polling coupled to rendering; low focused-button contrast; overflowing unit buttons; controller-inaccessible credits scrolling; seal indicators bound in count order rather than by seal identity. Test-environment and test-script faults are excluded from this count.
Critical/game-breaking: Two — GPU resource disposal could stop rendering, and slow rendering could miss short controller inputs.
Validation: 34 campaign/local-challenge assertions; 15 controller/attract checks; 72 official harness checks across one-player, two-player, and player-departure scenarios; seven touch-entry, keyboard-entry, deadline-loss, and unavailable-WebGPU checks. The successful campaign won six battles and completed the Great Mending in season 13 with 2,874 renown. Final validated runs have no uncaught JavaScript errors. The pinned Rapier WASM wrapper emits a nonfatal initialization deprecation warning.
Most helpful test: A complete campaign with real WebGPU scene transitions, including battle, save/reload, and victory. It exposed the GPU lifetime failure that rule-only checks missed.
Least helpful test: Syntax-only checking; it passed while runtime rendering and input timing still needed repair.
Unverified: A physical DualSense and real remote AI Hub clients. The official local harness and emulated standard mapping were used.

ENGINE FEEDBACK
Liked most: Three.js's scene graph and node toon materials made a coherent procedural world straightforward to author.
Got stuck or guessed wrong: Initial visual corruption looked like a shader problem but came from the headless compositor setup. Releasing geometry during transitions also conflicted with cached GPU/shadow resources; bounded immutable geometry and label pools fixed it.
Most important system built here: The data-driven campaign and tactical state model, with controller focus, interface, audio, saves, and session adaptation.
Hardest part: Keeping scene transitions, GPU resource lifetimes, input, and session lifecycle consistent.
Remove or overhaul: The renderer's implicit WebGL fallback behavior; this game explicitly disables it.
One engine change: Clear lifecycle validation for resources still referenced by cached rendering and shadow passes.

PROMPT FEEDBACK
Liked most: The specific cel-shaded art direction, code-written audio, and controller-first constraints gave the game a clear identity.
Confusing: The boundary between a feature-complete successor and a vertical slice. This build is a complete bounded campaign with reusable, data-driven content.
Hardest: Making empire management and tactical combat readable and fully operable through the same controller interaction model in a single-file release.
One additional test: An uninterrupted physical-DualSense campaign in a two-client AI Hub session on separate devices.
 -->

<script>/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

			state.buildings.push(b.id);

		if (state.pact) {
			log("The pact holds. Veyra’s riders pass you by.");
		} else {
			const loss = Math.min(state.gold, 8 + Math.floor(state.turn / 5) * 2);
			state.gold -= loss;
			log(`Cinder raiders took ${loss} gold. A pact would stay their hands.`);
			notify(`Cinder raiders · −${loss} gold`);

	}
	AudioFX.sfx("turn");
	if (localSeries && state.turn > 12) {
		finishRun(false, "Twelve seasons are written. Let the next magister try.");
		return;
	}
	if (state.turn > state.deadline && !state.rivalDefeated) {
		finishRun(false, "The last star guttered. Veyra’s unmaking is complete.");
		return;
	}
	if (
		[4, 8, 13, 19].includes(state.turn) &&

			score: renown(),
			seals: state.seals,
			wins: state.wins,

			awards: won

// Procedural audio: original harp ostinato, low strings, percussion, and formant speech.
const AudioFX = {
	ctx: null,
	master: null,
	musicBus: null,
	sfxBus: null,
	voiceBus: null,
	next: 0,
	beat: 0,
	start() {
		if (hubEnded) return;
		try {
			if (!this.ctx) {
				this.ctx = new AudioContext();
				this.master = this.ctx.createGain();
				this.master.gain.value = 0.66;
				this.master.connect(this.ctx.destination);
				for (const k of ["music", "sfx", "voice"]) {
					this[k + "Bus"] = this.ctx.createGain();
					this[k + "Bus"].connect(this.master);
				}
				this.apply();
				this.next = this.ctx.currentTime + 0.12;
			}
			if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
		} catch {}
	},
	apply() {
		if (!this.ctx) return;
		for (const k of ["music", "sfx", "voice"])
			this[k + "Bus"].gain.setTargetAtTime(
				settings[k] / 100,
				this.ctx.currentTime,
				0.08,
			);
	},
	tone(f, d = 0.25, type = "sine", gain = 0.13, delay = 0, bus = "sfx") {
		if (!this.ctx || hubEnded) return;
		const t = this.ctx.currentTime + delay,
			o = this.ctx.createOscillator(),
			g = this.ctx.createGain();
		o.type = type;
		o.frequency.value = f;
		g.gain.setValueAtTime(0.0001, t);
		g.gain.exponentialRampToValueAtTime(Math.max(0.001, gain), t + 0.015);
		g.gain.exponentialRampToValueAtTime(0.0001, t + d);
		o.connect(g).connect(this[bus + "Bus"]);
		o.start(t);
		o.stop(t + d + 0.03);
	},
	tick() {
		if (!this.ctx || this.ctx.state !== "running" || hubEnded) return;
		const t = this.ctx.currentTime;
		if (t > this.next) {
			const scale = [
					0, 7, 12, 15, 19, 15, 12, 7, 3, 10, 15, 19, 22, 19, 15, 10,
				],
				b = this.beat++,
				base = battle ? 130.81 : 146.83,
				f = base * 2 ** (scale[b % 16] / 12);
			this.tone(f, 0.95, "triangle", 0.08, 0, "music");
			this.tone(f * 2, 0.38, "sine", 0.025, 0.08, "music");
			if (b % 8 === 0) {
				this.tone(base / 2, 3.8, "sine", 0.12, 0, "music");
				this.tone(base * 0.75, 3.5, "triangle", 0.025, 0, "music");
			}
			if (battle && b % 2 === 0) {
				this.tone(75, 0.16, "triangle", 0.11, 0, "music");
			}
			this.next = t + (battle ? 0.25 : 0.36);
		}
	},
	sfx(n) {
		if (n === "move") {
			this.tone(220, 0.08, "triangle", 0.1);
			this.tone(330, 0.12, "triangle", 0.09, 0.07);
		} else if (n === "hit") {
			this.tone(95, 0.18, "sawtooth", 0.15);
			this.tone(42, 0.25, "sine", 0.18);
		} else if (n === "spell" || n === "portal") {
			[293.66, 440, 587.33, 880].forEach((f, i) =>
				this.tone(f, 0.5, "sine", 0.11, i * 0.075),
			);
		} else if (n === "reward" || n === "research" || n === "victory") {
			[293.66, 369.99, 440, 587.33, 739.99].forEach((f, i) =>
				this.tone(f, 0.8, "triangle", 0.12, i * 0.1),
			);
		} else if (n === "turn") {
			this.tone(146.83, 0.5, "triangle", 0.12);
			this.tone(220, 0.6, "sine", 0.08, 0.12);
		} else this.tone(440, 0.09, "sine", 0.075);
	},
	voice(mood = "soft") {
		if (!this.ctx || hubEnded) return;
		const seq =
			mood === "joy"
				? [360, 460, 400, 550, 470]
				: [220, 290, 250, 335, 275, 205];
		seq.forEach((f, i) => {
			const t = this.ctx.currentTime + i * 0.105,
				o = this.ctx.createOscillator(),
				filter = this.ctx.createBiquadFilter(),
				g = this.ctx.createGain();
			o.type = "sawtooth";
			o.frequency.setValueAtTime(f, t);
			o.frequency.exponentialRampToValueAtTime(f * 0.8, t + 0.08);
			filter.type = "bandpass";
			filter.frequency.value = [800, 1300, 600, 1700][i % 4];
			filter.Q.value = 5;
			g.gain.setValueAtTime(0.0001, t);
			g.gain.exponentialRampToValueAtTime(0.09, t + 0.012);
			g.gain.exponentialRampToValueAtTime(0.0001, t + 0.095);
			o.connect(filter).connect(g).connect(this.voiceBus);
			o.start(t);
			o.stop(t + 0.1);
		});
	},
	stop() {
		if (this.master)
			this.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.08);
	},
};

function reachable(u) {

		const a = q.shift();
		if (a.d >= u.speed) continue;
		for (const [dx, dz] of [
			[1, 0],
			[-1, 0],
			[0, 1],
			[0, -1],
		]) {
			const x = a.x + dx,
				z = a.z + dz,
				k = `${x},${z}`;
			if (!blocked(x, z) && !occupied(x, z, u.id) && !result.has(k)) {
				result.set(k, a.d + 1);
				q.push({ x, z, d: a.d + 1 });

function castBattleSpell(id, target) {
	if (!battle || battle.spellUsed) {
		notify("One wizard spell may be cast each round.");
		spellTarget = null;
		return;
	}
	const cost = { bolt: 6, heal: 8, storm: 12, ward: 10 }[id];
	if (state.mana < cost) {
		notify("Your mana is insufficient.");
		spellTarget = null;
		return;
	}
	if (id === "ward") {
		if (battle.ward) {
			notify("Stone covenant already protects the warband.");
			return;
		}
		state.mana -= cost;
		battle.ward = true;
		battle.units.filter((u) => u.side === 0).forEach((u) => (u.def += 2));
		battleLog("Stone covenant: every ally gains +2 defense.");
	} else {
		if (!target || target.hp <= 0 || target.side !== (id === "heal" ? 0 : 1)) {
			notify(
				id === "heal"
					? "Choose a friendly unit, then Cross / Enter."
					: "Choose an enemy, then Cross / Enter.",
			);
			return;
		}
		state.mana -= cost;
		if (id === "heal") {
			const amount = Math.min(14, target.maxHp - target.hp);
			target.hp += amount;
			floating(
				"+" + amount,
				boardPos(target.x, target.z).add(new THREE.Vector3(0, 1, 0)),
			);

		} else {
			dealDamage(target, id === "storm" ? 10 : 11);
			if (id === "storm")

					(u) =>
						u.side === 1 &&
						u.hp > 0 &&
						u.id !== target.id &&
						bdist(target, u) <= 1,
				))
					dealDamage(u, 5);
			battleLog(
				id === "storm"
					? "Stars fall where you point."
					: "A cinder finds its mark.",
			);
		}
	}
	battle.spellUsed = true;
	spellTarget = null;
	AudioFX.sfx("spell");
	checkBattleEnd();
	if (battle) updateBattleHighlight();
	refresh();
}

function menuMove(dx, dy) {
	const b = menuButtons();
	if (!b.length) return;
	const current = b[menuFocus].getBoundingClientRect(),
		cx = current.x + current.width / 2,
		cy = current.y + current.height / 2;
	const options = b
		.map((el, i) => {
			const r = el.getBoundingClientRect(),
				x = r.x + r.width / 2 - cx,
				y = r.y + r.height / 2 - cy,
				forward = x * dx + y * dy,
				side = Math.abs(x * dy - y * dx);
			return { i, forward, score: forward + side * 3 };
		})
		.filter((o) => o.i !== menuFocus && o.forward > 5)
		.sort((a, b) => a.score - b.score);
	menuFocus = options.length
		? options[0].i
		: (menuFocus + (dx || dy) + b.length) % b.length;
	updateMenuFocus();
	b[menuFocus].scrollIntoView({ block: "nearest", behavior: "instant" });
	AudioFX.sfx("ui");
}

			if (!m.visible) continue;
			m.position.lerp(boardPos(u.x, u.z), Math.min(1, dt * 9));
			m.userData.health.scale.x = 0.68 * Math.max(0, u.hp / u.maxHp);
			m.userData.team.visible = u.id === battle.active || u.side === 1;
			if (m.userData.lunge) {
				const a = m.userData.lunge,
					l = Math.max(0, (a.until - now) / 330);
				m.userData.body.position.copy(
					a.to.clone().multiplyScalar(Math.sin(l * Math.PI) * 0.35),
				);
				if (now > a.until) {
					m.userData.lunge = null;
					m.userData.body.position.set(0, 0, 0);
				}
			} else
				m.userData.body.position.y = settings.motion
					? Math.sin(now * 0.003 + u.id) * 0.025
					: 0;
		}
	}
	for (let i = flights.length - 1; i >= 0; i--) {
		const f = flights[i];
		f.t += dt * 3;
		f.mesh.position.lerpVectors(f.start, f.end, Math.min(f.t, 1));
		f.mesh.position.y += Math.sin(Math.min(f.t, 1) * Math.PI) * 0.4;
		if (f.t >= 1) {
			scene.remove(f.mesh);
			flights.splice(i, 1);
		}
	}
	physics.timestep = Math.min(dt, 1 / 30);
	physics.step();
	for (let i = debris.length - 1; i >= 0; i--) {
		const p = debris[i];
		p.life -= dt;
		if (p.life <= 0) {
			scene.remove(p.mesh);
			physics.removeRigidBody(p.body);
			debris.splice(i, 1);
		} else {
			const pos = p.body.translation(),
				rot = p.body.rotation();
			p.mesh.position.set(pos.x, pos.y, pos.z);
			p.mesh.quaternion.set(rot.x, rot.y, rot.z, rot.w);
			p.mesh.scale.setScalar(0.1 * Math.min(1, p.life * 2));
		}
	}
}
let nextHubProgress = 0,
	lastWaiting = -999,
	nextUISecond = 0;
function frame(now) {
	const dt = Math.min((now - lastFrame) / 1000 || 0.016, 0.05);
	lastFrame = now;
	if (!started) return;
	updateInputs(now);
	if (!hubEnded) {
		AudioFX.tick();
		if (
			!modal &&
			mode !== "title" &&
			mode !== "over" &&
			(!AIHub.active || AIHub.time() >= 0)
		)
			simSeconds += dt;
		if (mode === "title" && !modal && !AIHub.active && now - lastInput >= 10000)
			startAttract();
		tickAttract(now);
		if (
			battle &&
			!modal &&
			(!AIHub.active || AIHub.time() >= 0) &&
			(battle.side === 1 || autoBattle) &&
			now > battle.nextAI
		) {
			battle.nextAI = now + (attract ? 230 : 520);
			aiAct(battle.side);
		}
		animateWorld(now, dt);
		updateCamera();
		if (AIHub.active) {
			if (now > nextHubProgress && state) {
				nextHubProgress = now + 1000;
				AIHub.progress({
					score: renown(),
					label: `${state.seals}/3 seals · Season ${state.turn}`,
				});
			}
			if (AIHub.time() < 0) {
				const n = Math.ceil(AIHub.time() / 1000);
				if (n !== lastWaiting) {
					lastWaiting = n;
					refresh();
				}
			} else if (lastWaiting !== 1) {
				lastWaiting = 1;
				refresh();
			} else if (now > nextUISecond && !modal) {
				nextUISecond = now + 1000;
				refresh();
			}
		}
	}
	if (toastUntil && now > toastUntil) {
		$("#toast").classList.remove("visible");
		toastUntil = 0;
	}
	renderer.render(scene, camera);
	requestAnimationFrame(frame);
}
AIHub.probe(() => ({
	scene:
		hubEnded || mode === "over"
			? "over"
			: AIHub.active && AIHub.time() < 0
				? "ready"
				: mode === "title"
					? "title"
					: modal
						? "menu"
						: "play",
	menu: modal?.type === "settings",
	world: simSeconds,
	input: inputProbe,
}));
AIHub.on("start", () => {
	AudioFX.start();
	refresh();
});
AIHub.on("time-up", () => {
	if (state && !state.ended)
		finishRun(
			false,
			"The shared hourglass is empty. Your deeds have become your score.",
		);
});
AIHub.on("end", () => {
	if (state && !state.ended) {
		state.ended = true;
		mode = "over";
		modal = null;
	}
	hubEnded = true;
	inputProbe = { x: 0, y: 0, fire: false };
	AudioFX.stop();
	refresh();
});
window.Mistake = {
	get state() {
		return clone(state);
	},
	get battle() {
		return clone(battle);
	},
	get mode() {
		return mode;
	},
	get modal() {
		return modal?.type;
	},
	get settings() {
		return { ...settings };
	},
	get renderer() {
		return renderer?.backend.isWebGPUBackend ? "WebGPU" : "unknown";
	},
	get attract() {
		return attract;
	},
	inspect: () => ({
		mode,
		modal: modal?.type,
		attract,
		viewPlane,
		selection,
		cursor,
		simSeconds,
		frame: lastFrame,
		renown: renown(),
	}),
};
try {
	if (AIHub.active)
		hubInfo = await AIHub.connect({ mode: "parallel", seats: [1, 4] });
	await setupRenderer();
	started = true;
	$("#loading").remove();
	if (hubInfo) {
		startGame(false, { seed: hubInfo.seed });
		if (hubInfo.splash) {
			hubReady = true;
			AIHub.ready();
		}
	} else {
		mode = "title";
		lastInput = performance.now();
		refresh();
	}
	requestAnimationFrame(frame);
} catch (error) {
	console.error(error);
	$("#loading-text").className = "error";
	$("#loading-text").textContent =
		error.message + " This game intentionally has no WebGL fallback.";
	$("#loading h2").textContent = "The realm could not awaken";
	if (AIHub.active) AIHub.fail(error.message);
}
</script>
