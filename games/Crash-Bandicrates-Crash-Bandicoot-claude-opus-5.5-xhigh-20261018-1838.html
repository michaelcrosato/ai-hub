var KEY = "crash-bandicrates-save-v1";
var defaults = () => ({
  settings: { music: 7, sfx: 8, rumble: true, shake: true, hud: "auto", helpMasks: true, hints: true, flashes: true },
  levels: {},
  lives: 5,
  fruit: 0,
  started: false,
  finished: false,
  hints: {}
});
var Save = {
  data: defaults(),
  load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        const base = defaults();
        this.data = { ...base, ...d, settings: { ...base.settings, ...d.settings || {} } };
      }
    } catch (e) {
      this.data = defaults();
    }
    return this.data;
  },
  write() {
    try {
      localStorage.setItem(KEY, JSON.stringify(this.data));
    } catch (e) {
    }
  },
  level(id) {
    if (!this.data.levels[id]) this.data.levels[id] = { cleared: false, gem: false, bestCrates: 0, bestTime: null, relic: null };
    return this.data.levels[id];
  },
  resetProgress() {
    const s = this.data.settings;
    this.data = defaults();
    this.data.settings = s;
    this.write();
  }
};

          lv.breakCrate(cr, "explosion");
        }
      }
      if (cr.age > 13 && !cr.broken) {
        cr.breakIt();
        lv.fx.puff(cr.center.clone(), 16777215, 5, 0.5, 2);
      }
      if (cr.broken) {
        this.tempCrates.splice(i, 1);
        const k = lv.crates.indexOf(cr);
        if (k >= 0) lv.crates.splice(k, 1);
        cr.dispose();
        if (cr.mesh.parent) cr.mesh.parent.remove(cr.mesh);
      }
    }
    for (let i = this.markers.length - 1; i >= 0; i--) {
      const m = this.markers[i];
      m.t -= dt;
      m.mesh.scale.setScalar(0.6 + (1 - Math.max(0, m.t) / 0.8) * 0.5);
      if (m.t <= 0) {
        m.mesh.parent && m.mesh.parent.remove(m.mesh);
        this.markers.splice(i, 1);
        const kinds = this.phase >= 2 ? ["tnt", "tnt", "nitro", "basic", "question", "mask", "basic"] : ["tnt", "basic", "question", "basic", "mask", "tnt"];
        const kind = kinds[Math.floor(Math.random() * kinds.length)];
        const cr = new Crate(lv, kind, m.pos.clone().setY(c.y + 12), 0, {});
        cr.path = lv.path;
        const pp = lv.path.project(m.pos, null);
        cr.s = pp.s;
        cr.x = pp.x;
        cr.counts = false;
        cr.falling = true;
        cr.vy = -6;
        lv.crates.push(cr);
        this.tempCrates.push(cr);
      }
    }
    this.yaw = dampAngle(this.yaw, faceYaw, 5, dt);
    this.group.position.copy(P);
    this.group.rotation.y = this.yaw;
    this.stars.position.set(P.x, P.y + 2.4, P.z);
    this.stars.rotation.y += dt * 4;
    this.model.anim(dt, this.t, this.st);
    this.delta.subVectors(P, this.prev);
    this.body.setNextKinematicTranslation(this._colliderPos());
  }
  _muzzle() {
    const fwd = new THREE21.Vector3(Math.sin(this.yaw), 0, Math.cos(this.yaw));
    return this.pos.clone().addScaledVector(fwd, 1.5).add(new THREE21.Vector3(0, 0.1, 0));
  }
  _dropCrate(player) {
    const lv = this.level;
    const c = this.center;
    let p;
    for (let k = 0; k < 8; k++) {
      const a = Math.random() * Math.PI * 2;
      const nearPlayer = Math.random() < 0.55;
      const r = nearPlayer ? 2 + Math.random() * 3 : Math.random() * 8.5;
      const base = nearPlayer ? player.pos : c;
      p = new THREE21.Vector3(base.x + Math.cos(a) * r, c.y, base.z + Math.sin(a) * r);
      if (Math.hypot(p.x - c.x, p.z - c.z) < 9) break;
    }
    const m = new THREE21.Mesh(torus(0.7, 0.06, 6, 28), glow(16731469, 2.5));
    m.rotation.x = Math.PI / 2;
    m.position.copy(p).setY(c.y + 0.05);
    lv.dynRoot.add(m);
    this.markers.push({ mesh: m, pos: p, t: 0.8 });
    lv.audio("appear", p, { pitch: 0.6 });
  }
};

      body: () => el("div", "msg", `The mad inventor <b>Dr. Nitrox Noggin</b> is crating up every Mumba fruit on the island to power his towering <b>Crate-O-Tron</b>.<br><br>Only one bandicoot is fast enough, bouncy enough and spin-happy enough to stop him: <b>Kip!</b><br><br>Smash crates, collect fruit, and find every gem on the way to Noggin Works.`),
      items: [{ label: "Let's go!", action: () => {
        ui.pop();
        s.el.remove();
        this.goMap(0);
      } }],
      onBack: () => {
        ui.pop();
        s.el.remove();
      },
      hints: [["A", "Start"], ["B", "Back"]]

    ui.addScreen("story" + Math.random(), s);
    ui.push(s);
  }
  async goMap(idx = 0, ttFocus = false) {
    if (this.busy) return;
    this.busy = true;
    this._persist();
    await this.ui.fade(1, 0.35);
    this.disposeScene();
    this.ui.clear();
    this.ui.hud.setVisible(false);
    this.ui.hud.demo(false);
    this.ui.clearHint();
    this.audio.setOverride(null);
    this.dio = new MapScene(this, LEVELS, idx);
    this.dio.refresh(Save);
    this.mode = "map";
    this.ttFocus = ttFocus;
    this.ui.push("map");
    this.renderMapCard();
    this.audio.playMusic("map");
    await this.ui.fade(0, 0.45);
    this.busy = false;
  }
  renderMapCard() {
    const map = this.dio;
    const i = map.sel;
    const def = LEVELS[i];
    const st = Save.level(def.id);
    const unlocked = map.isUnlocked(Save, i);
    const gems = LEVELS.filter((l) => Save.level(l.id).gem).length;
    const relics = LEVELS.filter((l) => Save.level(l.id).relic).length;
    const relicIcon = st.relic ? `relic${st.relic}` : "relicNone";
    const canTT = st.cleared && def.id !== "boss";
    const ui = this.ui;
    this.mapScreen.el.innerHTML = `
      <div class="maptitle">Bandicrate Isle</div>
      <div class="maptotals"><span><img src="${iconURL("gem")}"> ${gems}/4</span><span><img src="${iconURL("relicG")}"> ${relics}/4</span><span><img src="${iconURL("fruit")}"> ${this.fruit}</span><span><img src="${iconURL("kip")}"> ${this.lives}</span></div>
      <div class="mcard panel">
        <div class="lvn">LEVEL ${def.num}${def.id === "boss" ? " \xB7 BOSS" : ""}</div>
        <div class="lvt">${def.name}</div>
        <div class="desc">${def.desc}</div>
        ${unlocked ? `<div class="icons">
          ${def.id !== "boss" ? `<span><img src="${iconURL(st.gem ? "gem" : "gemEmpty")}"> ${st.gem ? "Gem!" : `Crates ${st.bestCrates || 0}`}</span>
          <span><img src="${iconURL(relicIcon)}"> ${st.bestTime != null ? fmtTime(st.bestTime) : "--:--.--"}</span>` : `<span>${st.cleared ? "\u2605 Defeated" : "The final showdown"}</span>`}
        </div>` : `<div class="lock">\u{1F512} Clear the previous level to unlock</div>`}
      </div>
      ${ui.hintsBar([["DPAD", "Move"], ...unlocked ? [["A", "Play"]] : [], ...canTT ? [["Y", "Time Trial"]] : [], ["B", "Menu"]]).outerHTML}`;
    const card = this.mapScreen.el.querySelector(".mcard");
    card.addEventListener("click", () => {
      if (unlocked) this.playLevel(i, "normal");
    });
  }
  mapInput(input) {
    const map = this.dio;
    if (!map || this.busy || !(map instanceof MapScene)) return;
    let d = 0;
    if (input.nav === "right" || input.nav === "up") d = 1;
    if (input.nav === "left" || input.nav === "down") d = -1;
    if (d) {
      const r = map.move(d, Save);
      if (r === true) {
        this.audio.play("jump", { pitch: 1.2, vol: 0.6 });
        setTimeout(() => this.renderMapCard(), 10);
      } else if (r === "locked") {
        this.audio.play("clank", { vol: 0.5 });
        this.ui.toast("LOCKED", "red");
      }
    }
    const i = map.sel;
    const def = LEVELS[i];
    if (input.pressed("A") && map.isUnlocked(Save, i) && !map.hop) {
      this.audio.play("menuSelect");
      this.playLevel(i, "normal");
    } else if (input.pressed("Y") && Save.level(def.id).cleared && def.id !== "boss" && !map.hop) {
      this.audio.play("menuSelect");
      this.playLevel(i, "timetrial");
    } else if (input.pressed("B") || input.pressed("START")) {
      this.audio.play("menuBack");
      this.toTitle().then(() => this.ui.push("main"));
    }
  }
  async playLevel(idx, mode) {
    await this.loadLevel(LEVELS[idx], mode);
  }
  async loadLevel(def, mode = "normal", opts = {}) {
    if (this.busy) return;
    this.busy = true;
    this.mode = "loading";
    this.ui.hud.setVisible(false);
    await this.ui.fade(1, 0.3);
    this.ui.clear();
    this.disposeScene();
    if (mode !== "attract") {
      this.card.innerHTML = `<div class="num">${mode === "timetrial" ? "TIME TRIAL \xB7 " : ""}LEVEL ${def.num}</div><div class="name">${def.name}</div><div class="tip">${this.ui.fmt(def.tip)}</div><div class="spinner"></div>`;
      this.card.classList.add("on");
      this.ui.fadeInstant(0);
    }
    await nextFrame();
    const lv = new Level(this, def, { mode });
    lv.build();
    if (mode === "attract") {
      lv.ai = new AttractAI(lv);
      const s = opts.s ?? def.attract?.s ?? lv.spawnS;
      lv.checkpoint = { path: lv.path, s, x: 0, epoch: 0 };
      lv._placeAtCheckpoint();
      lv.player.masks = 3;
      this.ui.hud.demo(true, `Level ${def.num} \xB7 ${def.name}`);
    } else {
      this.ui.hud.demo(false);
    }
    this.level = lv;
    lv.ui.hud.statusHTML = () => statusHTML(this, lv);
    for (let i = 0; i < 3; i++) await nextFrame();
    await nextFrame();
    this.audio.setOverride(null);
    this.audio.playMusic(def.music, { restart: true });
    if (mode !== "attract") {
      if (lv.timeTrial) this.ui.toast("GO!", "gold");
      await this.ui.fade(1, 0.2);
      this.card.classList.remove("on");
    }
    this.mode = mode === "attract" ? "attract" : "level";
    this.paused = false;
    this.ui.hud.setVisible(true);
    this.ui.hud.peek(3);
    this.attractT = 0;
    this.input.consume();
    await this.ui.fade(0, 0.45);
    this.busy = false;
  }
  pause() {
    if (this.paused || !this.level || this.level.state !== "play") return;
    this.paused = true;
    this.audio.play("pause");
    this.audio.duck(true);
    this.ui.push("pause");
    this.ui.screens.pause.render();
    this.ui.screens.pause.onOpen();
  }
  resume() {
    if (!this.paused) return;
    this.ui.clear();
    this.paused = false;
    this.audio.duck(false);
    this.input.consume();
  }
  restartCheckpoint() {
    const lv = this.level;
    if (!lv) return;
    this.ui.clear();
    this.paused = false;
    this.audio.duck(false);
    lv.respawning = true;
    this.ui.fade(1, 0.25).then(() => {
      if (lv.timeTrial) {
        lv.restartFull();
        return;
      }
      lv._rollback();
      lv.player.reset();
      lv.player.masks = 0;
      lv._placeAtCheckpoint();
      lv.respawning = false;
      this.ui.fade(0, 0.3);
    });
  }
  restartLevel() {
    const lv = this.level;
    if (!lv) return;
    this.paused = false;
    this.loadLevel(lv.def, lv.mode);
  }
  onGameOver(level) {
    const ui = this.ui;
    this.audio.play("gameover");
    this.audio.setOverride(null);
    const s = new MenuScreen(ui, {
      title: "Game Over",
      body: () => el("div", "msg", "Kip ran out of lives!"),
      items: [
        { label: "Continue", sub: "Restart from the last checkpoint with 4 lives", action: () => {
          ui.pop();
          s.el.remove();
          this.lives = 4;
          this._persist();
          level.respawnContinue();
        } },
        { label: "Quit to Map", action: () => {
          ui.pop();
          s.el.remove();
          this.lives = 4;
          this._persist();
          this.goMap(LEVELS.indexOf(level.def));
        } }
      ],
      onBack: () => {
      },
      startBack: false
    });
    ui.addScreen("gameover" + Math.random(), s);
    ui.push(s);
    ui.fade(0, 0.3);
  }
  _persist() {
    Save.data.fruit = this.fruit;
    Save.data.lives = this.lives;
    Save.write();
  }
  onLevelComplete(level, res) {
    if (this.mode === "attract") {
      this.nextAttract();
      return;
    }
    const def = level.def;
    const st = Save.level(def.id);
    const firstClear = !st.cleared;
    st.cleared = true;
    if (res.gem) st.gem = true;
    st.bestCrates = Math.max(st.bestCrates || 0, res.crates);
    let relic = null;
    if (res.timeTrial) {
      const r = def.relic;
      relic = res.time <= r.p ? "P" : res.time <= r.g ? "G" : res.time <= r.s ? "S" : null;
      const rank = { S: 1, G: 2, P: 3 };
      if (relic && (!st.relic || rank[relic] > rank[st.relic])) st.relic = relic;
    }
    if (res.time && (res.timeTrial || st.bestTime == null)) st.bestTime = st.bestTime == null ? res.time : Math.min(st.bestTime, res.time);
    if (def.id === "boss") Save.data.finished = true;
    this._persist();
    this.showResults(level, res, relic, firstClear);
  }
  showResults(level, res, relic, firstClear) {
    const ui = this.ui;
    const def = level.def;
    const idx = LEVELS.indexOf(def);
    const boss = def.id === "boss";
    const rows = [];
    if (!boss) rows.push(`<div class="row"><span><img src="${iconURL("crate")}">Crates</span><span class="v">${res.crates} / ${res.total}</span></div>`);
    rows.push(`<div class="row"><span><img src="${iconURL("fruit")}">Fruit collected</span><span class="v">${res.fruit}</span></div>`);
    rows.push(`<div class="row"><span><img src="${iconURL(relic ? "relic" + relic : "relicNone")}">${res.timeTrial ? "Time Trial" : "Time"}</span><span class="v">${fmtTime(res.time)}</span></div>`);
    rows.push(`<div class="row"><span><img src="${iconURL("kip")}">Lives</span><span class="v">${this.lives}</span></div>`);
    let award = "";
    if (!boss && res.gem) award = `<div class="award"><img src="${iconURL("gem")}">CLEAR GEM! Every crate smashed!</div>`;
    else if (!boss) award = `<div class="award" style="color:#ffd6a8">${res.total - res.crates} crate${res.total - res.crates === 1 ? "" : "s"} missed \u2014 find them all for the gem!</div>`;
    if (relic) award += `<div class="award"><img src="${iconURL("relic" + relic)}">${RELIC_NAMES[relic]} Relic!</div>`;
    else if (res.timeTrial) award += `<div class="award" style="color:#ffd6a8">Relic times: Sapphire ${fmtTime(def.relic.s)} \xB7 Gold ${fmtTime(def.relic.g)} \xB7 Platinum ${fmtTime(def.relic.p)}</div>`;
    const items = [{ label: boss ? "Continue" : "Continue to Map", action: () => {
      ui.pop();
      s.el.remove();
      if (boss) this.goEnding();
      else this.goMap(Math.min(LEVELS.length - 1, firstClear ? idx + 1 : idx)).then(() => {
        if (firstClear) {
          this.ui.toast("NEW LEVEL UNLOCKED!", "gold");
          this.audio.play("token");
        }
      });
    } }];
    if (res.timeTrial) items.push({ label: "Retry Time Trial", action: () => {
      ui.pop();
      s.el.remove();
      this.loadLevel(def, "timetrial");
    } });
    const s = new MenuScreen(ui, {
      title: boss ? "Boss Defeated!" : res.timeTrial ? "Time Trial Complete" : "Level Complete!",
      className: "results",
      body: () => el("div", "res", rows.join("") + award),
      items,
      onBack: () => {
      },
      startBack: false,
      hints: [["A", "Continue"]]
    });
    ui.addScreen("results" + Math.random(), s);
    ui.push(s);
    ui.hud.setVisible(false);
    const rowEls = s.el.querySelectorAll(".row, .award");
    rowEls.forEach((r, i) => setTimeout(() => {
      r.classList.add("in");
      this.audio.play(r.classList.contains("award") ? res.gem || relic ? "gem" : "pop" : "pop", { pitch: 1 + i * 0.1 });
    }, 300 + i * 260));
    if (res.gem && !boss) this.audio.play("relic");
  }
  async goEnding() {
    await this.ui.fade(1, 0.6);
    this.disposeScene();
    this.ui.clear();
    this.ui.hud.setVisible(false);
    this.dio = new EndingScene(this);
    this.mode = "ending";
    this.audio.playMusic("title", { restart: true });
    const roll = { el: el("div", "screen", "") };
    roll.el.innerHTML = `<div class="credits-roll">${creditsHTML()}</div>`;
    const inner = roll.el.querySelector(".credits-roll");
    roll.t = 0;
    roll.update = (input, dt) => {
      roll.t += dt;
      const h = inner.scrollHeight + window.innerHeight;
      const y = Math.min(h, roll.t * 55 * (input.down("A") ? 4 : 1));
      inner.style.transform = `translateY(${-y}px)`;
      if (roll.t > 3 && (input.pressed("START") || input.pressed("B")) || y >= h) {
        if (!roll.done) {
          roll.done = true;
          this.toTitle();
        }
      }
    };
    this.ui.addScreen("roll" + Math.random(), roll);
    this.ui.push(roll);
    this.ui.toast("THE END", "gold");
    await this.ui.fade(0, 0.8);
  }
  // ================================================================ attract mode
  startAttract() {
    this.attractIdx = this.attractIdx ?? 0;
    this.nextAttract(true);
  }
  async nextAttract(first = false) {
    if (this.busy) return;
    if (!first) this.attractIdx = (this.attractIdx + 1) % LEVELS.length;
    const def = LEVELS[this.attractIdx];
    await this.loadLevel(def, "attract");
    this.attractT = 0;
    this.attractGrace = 0.8;
  }
  exitAttract() {
    if (this.busy) return;
    this.ui.hud.demo(false);
    this.toTitle();
  }
  // ================================================================ main loop
  frame() {
    const now = performance.now();
    let dt = (now - this.last) / 1e3;
    this.last = now;
    dt = Math.min(Math.max(dt, 0), 1 / 20);
    this.input.update(dt);
    if (this.input.anyPressed) this.audio.unlock();
    if (this.touchBlocked && (this.input.device === "keyboard" || this.input.device === "gamepad") && this.input.anyPressed) {
      this.touchBlocked = false;
      this.ui.clear();
      this.ui.push("title");
      this.input.consume();
    }
    switch (this.mode) {
      case "title": {
        this.dio && this.dio.update(dt);
        const top = this.ui.top;
        const idleOK = top && ["title", "main", "settings", "controls", "about"].includes(top.id);
        if (idleOK && !this.touchBlocked && this.input.idleSeconds() > 10 && !this.busy) this.startAttract();
        break;
      }
      case "attract": {
        const lv = this.level;
        this.attractGrace -= dt;
        if (this.attractGrace <= 0 && (this.input.activity || this.input.anyPressed)) {
          this.exitAttract();
          break;
        }
        if (lv) {
          lv.update(dt);
          this.attractT += dt;
          const dur = lv.def.attract?.dur ?? 40;
          if (this.attractT > dur && !this.busy) this.nextAttract();
        }
        break;
      }
      case "level": {
        const lv = this.level;
        if (!lv) break;
        if (!this.paused && this.ui.stack.length === 0) {
          if (this.input.pressed("START") && lv.state === "play" && !lv.player.dead) this.pause();
          else lv.update(dt);
        } else if (!this.paused && this.ui.stack.length) {
          lv.fx.update(dt);
        }
        break;
      }
      case "map":
      case "ending":
        this.dio && this.dio.update(dt);
        break;
      default:
        break;
    }
    this.ui.update(dt);
    document.body.classList.toggle("hide-cursor", this.mode === "level" && !this.paused && this.ui.stack.length === 0 || this.mode === "attract");
    if (this.post) this.post.render();
  }
};
