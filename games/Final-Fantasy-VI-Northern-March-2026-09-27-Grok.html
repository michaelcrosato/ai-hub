# CO55 engine: API card (v0.4.0)

CO55 makes crisp pixel-art games in any 2D camera view. Characters are 3D skeletons, posed by math every step and drawn as pixel shapes, so motion is fluid and one game renders as isometric, three-quarter, top-down, brawler or side view.

## Make a game from this file
1. Keep the engine script unchanged. Replace only the code between `GAME START` and `GAME END`.
2. Create `new CO55.Game({ canvas, view })`, build a `TileMap`, create rigs, then call `game.start({ update, draw })`.
3. In `update(dt)`, read input, move things in world units, collide them, and update rigs. World axes: x points east, y points south, z points up. One tile is 16 units.
4. In `draw(r)`, call `map.drawFloor(r)`, then `r.shadow(...)`, then `map.queueWalls(r)`. Add characters with `r.actor(...)`, props and effects with `r.queue(...)`, and lights with `game.lights.add(...)`.
5. Check the result in every view (`game.setView(id)`) and with the skeleton overlay on (`rig.debug(r)`).

## Rules
- Keep all game logic in world units. Never store screen pixels.
- Draw only with `CO55.px.*`. Never use `ctx.arc`, `stroke`, `fillText` or gradients on the game buffer; they anti-alias.
- Fade things with dithering (`px.polyDither`, `px.ddisc`, `r.glowDisc`), not with alpha.
- Anything that can overlap something else must go through `r.queue` or `r.actor`, which sort by depth.
- Use `dt` everywhere. `update` runs in fixed steps of about 1/120 s.
- Animate with continuous math (phases, easing, springs), never frame lists.

## Game: `new CO55.Game({ canvas, view, minH=190, maxW=560, maxH=330, bg, input })`
- `view` is one of `'iso'`, `'threequarter'`, `'topdown'`, `'brawler'` or `'side'`.
- Methods:
  - `start({ update(dt), draw(r) })`
  - `setView(id)`
  - `focus(x, y, z)`: the camera target; call it every update.
  - `freeze(seconds)`: hit-stop.
  - `shake(n)`
  - `mouseGround()`: returns `[x, y]` or `null`.
  - `enableGPU({ map })`: returns `gpu`.
- Fields: `timeScale`, `time`, `stats` (`{ updateMs, renderMs, actors, items }`), `particles`, `lights`, `input`, `view`, `cam` (`{ smooth, bounds(view) }`), and `screen.setOptions({ minH, minW, maxW, maxH })`. `CO55.current` is the latest game.

## Input: `game.input`
- `down(a)`: is the action held?
- `buffered(a, win = .15)` then `consume(a)`: forgiving presses.
- `move()`: returns screen-direction intent `[x, y]`. Convert it with `view.screenDirToGround(x, y)`.
- `aimSource` (`'mouse'`, `'pad'` or `'move'`) and `padAim`.
- Default actions: `up`, `down`, `left`, `right`, `attack`, `dash`, `skill`, `jump`.
- Codes are `KeyboardEvent.code`, `Mouse0` and `Mouse2`, and `Pad0` to `Pad15`. `input.bindButtons(root)` wires `data-act="action"` elements as touch buttons.

## View: `game.view`
- `p(x, y, z)` returns `[sx, sy]`. `toGround(sx, sy)` returns `[x, y]`. `screenDirToGround(dx, dy)`. `depth(x, y, z)`.
- Fields: `id`, `label`, `scale`, `inv` (null in side view).
- Custom views: `new CO55.View(id, label, yawDeg, pitchDeg, scale, zBoost)`. Presets live in `CO55.VIEWS` and `CO55.VIEW_ORDER`.

## Renderer: `r`, passed to `draw`
- `r.w(x, y, z)` gives buffer pixel coordinates. Also available: `r.ctx`, `r.W`, `r.H`, and `r.ix`, `r.iy` (pass these to dither functions so patterns don't swim), plus `r.gpu`.
- `r.queue(x, y, z, g => {...}, { bias, occluder })`
- `r.actor(x, y, z, (g, ox, oy) => {...}, { outline = true, rim, flash, alpha, xray, ghost: { color, life }, emissive })`. Characters off screen are skipped automatically. `outline: false` draws directly, which is much cheaper for crowds.
- `r.decal(fn, { emissive })` draws on the floor before the queue. `r.overlay(fn)` draws unlit on top (health bars, text, debug).
- `r.shadow(x, y, radius, alpha)` and `r.visible(x, y, z)`
- Ground shapes, correct in every view: `r.groundDisc(x, y, rad, color, alpha, z)`, `r.groundRing(...)`, `r.groundArc(x, y, r0, r1, a0, a1, color, alpha)`, `r.groundPts(x, y, rad, n, z)`.
- `r.box(g, x0, y0, z0, x1, y1, z1, topColor, sideColor)` for props, and `r.glowDisc(g, x, y, rad, color, alpha)`.

## Pixels: `CO55.px`
- `rect(g, x, y, w, h, c)`, `dot(g, x, y, c)`, `line(g, x0, y0, x1, y1, c, w)`, `disc(g, x, y, r, c)`, `ell(g, x, y, rx, ry, c)`, `poly(g, pts, c)`
- `polyDither(g, pts, c, a, r.ix, r.iy)` and `ddisc(g, x, y, r, c, a, wx, wy)`
- `glow(g, 0..1)` marks what follows as glowing for GPU lighting, and does nothing otherwise.
- Font: `CO55.font.text(g, str, x, y, color, outline)` and `width(str)`. Glyphs are 3×5 and cover A to Z, 0 to 9 and `+ - ! . : /`.

## Humanoid rig: `new CO55.Humanoid(opts)`
- Options: `cape: { len, width, seg }`, `weapon: 'sword'` or `null`, `hood`, `eyeGlow`, `hunch`, `lean`, `stride`, `swing`, `speedRef`, `headR`, `bladeLen`, and `colors: { skin, hair, cloth, pants, boot, belt, cape, capeIn, metal, metalDk, hilt, eye }`.
- `update(dt, { x, y, z, vx, vy, facing, dash, hurt, attack })`. `attack` is `{ spec, phase: 'wind' | 'active' | 'recover', u: 0..1 }` or `null`.
- Attack spec: `{ a0, a1, z0, z1, reach, blade, spin }`. Angles are relative to facing, and positive means the right-hand side, so a horizontal slash runs from `1.7` to `-1.9`. `blade: 0` disables the smear; `spin: true` swings a full circle.
- `draw(g, ox, oy, view)`, `drawSmear(r)`, `debug(r)`, and `kick(v)` for squash (negative) or stretch.
- `J` holds the joints. `_w(localPoint)` converts a local point to a world offset.

## Blob rig: `new CO55.Blob({ R, colors: { dk, base, lt, spec, eye, pupil } })`
`update(dt, { squash, look: [dx, dy], squint })`, `kick(v)`, `draw(g, ox, oy, view)`.

## TileMap: `new CO55.TileMap({ w, h, tile: 16, cells, types, floorTex })`
- `cells` uses `0` for floor and a type id for walls. `types[id]` accepts `h` (height), `top`, `side`, `line`, `course`, and `cut` / `cutH` (lower the wall when it blocks the camera).
- `floorTex(x, y)` returns `[r, g, b]`, or `[r, g, b, glow]` for glowing details.
- `drawFloor(r)`, `queueWalls(r)`, `collide({ x, y, r })`, `solidAt(x, y)`, `cell(cx, cy)`, `set(cx, cy, id)`, `los(x0, y0, x1, y1)`, `bounds(view)`.
- `CO55.tex.flagstone(x, y, { stones: [rgb, ...], mortar, hi, lo, speck })` is a ready-made stone floor.

## Other systems
- **FlowField:** `new CO55.FlowField(map)`, then `update(targetX, targetY)` and `dir(x, y, targetX, targetY)`, which returns `[dx, dy]` for walking around walls.
- **Particles (`game.particles`):** `dust(x, y, z, n, { speed, size, color })`, `sparks(x, y, z, n, angle, { color })`, `bits(x, y, z, n, colors)`, `ring(x, y, r0, r1, color, duration)`, `text(x, y, z, str, color)`, `add({ kind, ... })`, and the `max` cap.
- **Lights (`game.lights`):**
  - `add(x, y, z, radius, intensity, { color, shadow })`
  - `caster(x, y, r, top)` for things that block light.
  - `heat(x, y, z, width, strength)` for shimmer.
  - Fields: `enabled`, `ambient`.
- **GPU lighting (`game.enableGPU({ map })`):** fields `enabled`, `shadows`, `bands`, `ambient`, `wrap`, `spill`, `glow`, and `status()`, which returns `'loading'`, `'on'`, `'off'` or `'unavailable'`, plus `onStatus`. It falls back to Canvas lighting on its own.
- **Math:** `CO55.clamp`, `lerp`, `approach`, `ease.{ outCubic, outQuad, inQuad, inOut, outBack }`, `angDiff`, `lerpAng`, `approachAng`, `rng(seed)`, `hash2`, `noise2`, `bayer`, `smoothDamp`, `hex`, `shade`, `mix`, `V3`, `ik3`.

## Recipes
- **Enemy:** a factory returning `{ x, y, z, vx, vy, r, hp, rig }`. In update: steer with `flow.dir`, move, `map.collide(e)`, then `e.rig.update`. In draw: `r.shadow`, then `r.actor(e.x, e.y, 0, (g, ox, oy) => e.rig.draw(g, ox, oy, r.view), { flash })`. Give every attack a wind-up plus an `r.decal` telegraph.
- **Hit:** during the `active` phase, test distance and angle. On a hit, subtract hp, apply knockback, then call `game.freeze(.05)`, `game.shake(2)`, `particles.sparks` and `particles.text`.
- **Glowing prop:** call `px.glow(g, 1)` at the start of its queue function, add `lights.add(..., { color, shadow: true })`, and add `lights.caster(...)` for its solid base.
- **ASCII maps:** write the level as strings (`#` wall, `.` floor, letters for spawns) and convert them to `cells`, as the starter game does.
- **Crowds:** use `outline: false`, skip work with `r.visible` checks, and separate monsters with a spatial hash.
- **Side-view platformer:** use `view: 'side'`, treat z as height with your own gravity, and collide against your own grid of (x, z) tiles.

<script type="text/plain" id="docsrc">
NORTHERN MARCH
A vertical slice of the opening of Final Fantasy VI (Square, 1994) for the Super Nintendo.
Generation date: 27 September 2026
Model: Grok (xAI)
Engine: CO55 0.4.0 (MIT) — https://github.com/michaelcrosato/2D-co55-engine
The engine script in this file is unmodified. The API card is the element id co55-api.

HOW TO LAUNCH
Open this HTML file in a current desktop or phone browser. It does not need a server, a build, or a network connection. Audio starts on the first click or key. Saves stay in this browser under the key northern-march-v1.

CONTROLS
Field: W A S D or arrows. A is screen-left (west), D is screen-right (east), W is north (up the screen). Hold Shift to run. Z, Enter, or Space examines, talks, and opens chests. C, M, or Tab opens the menu. Click the ground to walk there.
Battle: gauges fill on their own (Active Time Battle). Z confirms, X or Esc backs out. Commands: Fight, Magitek or Fire, Defend, Item, Steal (Locke), Dance (Mog), Row, Run when the fight allows it. Defend halves the next hit. Use it when the Whelk head withdraws.
Gamepad: left stick moves, A confirms, B cancels, Y opens the menu, right bumper runs.
Touch: stick on the left half of the screen. Run, Talk, and Menu sit on the right.

CONFIG
Quality Auto, High, or Balanced. Auto watches frame time and switches between High and Balanced. It never changes enemy counts, attack timing, or collision. GPU lighting is optional and off by default; if WebGPU is missing the game stays on canvas lighting. Volume, mute, fullscreen, diagnostics, and a skeleton overlay live in Config. Battle mode is Wait or Active. Battle speed is 1 to 6.

AUDIO MANIFEST
window.AUDIO_MANIFEST is the only music and sound bus.
Tracks (original chiptune, synthesized in the page, not recordings): title, field, town, mine, danger, battle, boss, esper, house, moogle, victory, fanfare, gameover.
Sound ids: cursor, confirm, cancel, hit, spell, heal, chest, save, hurt, level, victory, die, buzzer, run, esper, blip.
To replace a track, set AUDIO_MANIFEST.buffers[id] to an AudioBuffer. To replace a sound, set AUDIO_MANIFEST.buffers['sfx:' + id]. Gameplay code does not change.
These are original placeholders composed for this demo. They are not the Square Enix soundtrack. The brief asked for rips from sounds.spriters-resource.com and zophar.net. Those sites host the copyrighted score. This file does not embed it. Drop licensed or original buffers into the manifest if you have them.

SOURCE
Final Fantasy VI, the Raid on Narshe: the march, the town fights, the north mines, the Whelk, the frozen esper, Arvis, the south-mine escape, and the moogle defense.
SNES / later-release names used in dialogue and this report: Whelk (Ymir), Spritzer (Vaporite), Bandit (Repo Man), Megalodoth (Vomammoth), Tritoch (Valigarmanda), Bolt Beam (Thunder Beam), Tek Missile, Potion (Tonic), Phoenix Down (Fenix Down).

CHECKLIST — IN THE DEMO
- Snow march with Biggs, Wedge, and the silent woman in magitek armor. North into Narshe.
- Scripted town line: two Guards (cannot run; ATB tutorial).
- Optional grate ambush (lobo, guard, lobo) if you walk the grate. The street can be walked around.
- Alley guard who sics a Silver Lobo if you talk to him while still armored.
- Pincer of lobos and a guard. Back row does not help.
- Mine mouth: two Guards and two Megalodoths. Cannot run.
- North mines. Random wererats, and wererat plus bandit.
- Save crystal in the west alcove. Sleeping Bag can be used there or from the item menu.
- Gate. Biggs and Wedge explain the Whelk, then the bars open.
- Whelk: hit the head. The head withdraws. Hitting the shell is answered with Megavolt. Lightning heals the shell. Killing the shell as well awards an extra Ether.
- Frozen esper. The crown breaks. Biggs and Wedge are gone. Armor comes off.
- Arvis's house. He asks your name (eight letters, default Terra). Rest, a dirk, potions, a Phoenix Down. Elixir in the clock. South door warning, then the escape.
- Bridge: guards spot you. South passage.
- South mine: Phoenix Down and Sleeping Bag off the main tunnel. Random spritzers, bandits, wererats. Cave-in.

function hasStatus(u, id) { return u.statuses.some(s => s.id === id && s.t > 0); }
function addStatus(u, id, dur) {
  if (u.statusImmune && u.statusImmune.includes(id)) return false;
  if (u.hp <= 0) return false;
  const s = u.statuses.find(x => x.id === id);
  if (s) s.t = Math.max(s.t, dur); else u.statuses.push({ id, t: dur });
  return true;
}
function tickStatuses(u, dt) {
  if (u.hp <= 0) return;
  let dot = false;
  u._dotAcc = u._dotAcc || 0;
  for (const s of u.statuses) {
    if (s.id === 'poison' || s.id === 'sap') {
      dot = true;
      const rate = s.id === 'poison' ? 0.012 : 0.008;
      u._dotAcc += u.maxHp * rate * dt;
    }
    s.t -= dt;
  }
  if (!dot) u._dotAcc = 0;
  else {
    const whole = Math.floor(u._dotAcc);
    if (whole > 0) { u.hp = Math.max(0, u.hp - whole); u._dotAcc -= whole; }
  }
  u.statuses = u.statuses.filter(s => s.t > 0);
  if (u.hp <= 0) u.statuses = [];
}

function variance(rnd) { return 0.88 + rnd() * 0.24; }

function physicalDamage(user, target, power, battle, rnd, ignoreDef) {
  let raw = (user.atk * power) / 13 + user.level * 1.15;
  let mit = (target.def || 0) * 0.2;
  if (ignoreDef) mit *= (1 - ignoreDef);
  let d = Math.max(1, raw - mit) * variance(rnd);
  if (!battle.pincer) {
    if (target.row === 'back') d *= 0.62;
    if (user.row === 'back') d *= 0.68;
  }
  let crit = false;
  if (rnd() < 0.07) { d *= 1.55; crit = true; }
  return { dmg: Math.max(1, Math.round(d)), crit, heal: false };
}
function magicDamage(user, target, skill, rnd) {
  const power = skill.power || 0;
  let raw = (user.mag * 0.62 + user.atk * 0.22 + user.level) * (power / 14);
  const elem = skill.elem;
  const absorb = target.absorb || [];
  const weak = target.weak || [];
  const resist = target.resist || [];
  if (elem && absorb.includes(elem)) return { dmg: Math.max(1, Math.round(raw * 0.8)), crit: false, heal: true, absorb: true };
  if (elem && weak.includes(elem)) raw *= 1.55;
  if (elem && resist.includes(elem)) raw *= 0.5;
  raw *= variance(rnd);
  return { dmg: Math.max(1, Math.round(raw)), crit: false, heal: false };
}
function healAmount(user, power) {
  return Math.round((user.mag * 0.45 + user.level) * (power / 16) + 28);
}

function living(list) { return list.filter(u => u.hp > 0 && !u.removed && !u.hidden); }
function livingAll(list) { return list.filter(u => u.hp > 0 && !u.removed); }

function outcome(b) {
  const pAlive = b.party.some(u => u.hp > 0 && !u.removed);
  if (!pAlive) return 'defeat';
  if (b.form === 'whelk') {
    const head = b.enemies.find(e => e.kind === 'whelkHead');
    if (head && head.hp <= 0) return 'victory';
    return 'fight';
  }
  if (!b.enemies.some(e => e.hp > 0 && !e.removed)) return 'victory';
  return 'fight';
}

function applyHit(target, amount, heal) {
  if (!heal && amount > 0 && target.guard) {
    amount = Math.max(1, Math.round(amount * 0.5));
    target.guard = 0;
  }
  if (heal) target.hp = Math.min(target.maxHp, target.hp + amount);
  else target.hp = Math.max(0, target.hp - amount);
  return amount;
}

function resolveAction(b, user, skill, target, rnd, log) {
  if (!skill) return;
  if (skill.run) {
    if (!b.canRun) { log.push("Can't escape!"); return; }
    const spd = user.spd, es = Math.max(...b.enemies.map(e => e.spd));
    const chance = Math.max(0.35, Math.min(0.92, 0.55 + (spd - es) * 0.02));
    if (rnd() < chance) { b.phase = 'run'; log.push(user.name + ' escaped.'); }
    else log.push(user.name + ' is cut off!');
    return;
  }
  if (skill.defend || skill.wait) {
    if (skill.defend) user.guard = 1;
    log.push(user.name + (skill.defend ? ' defends.' : ' waits.'));
    return;
  }
  if (skill.steal) {
    if (!target || target.hp <= 0) { log.push('Nothing to steal.'); return; }
    if (target.stolen) { log.push('Nothing left to take.'); return; }
    target.stolen = true;
    const rate = target.stealRate || 0;
    if (target.steal && rnd() < rate) {
      b.loot.push(target.steal);
      log.push('Stole ' + ITEMS[target.steal].name + '!');
    } else log.push("Couldn't steal.");
    return;
  }
  if (skill.dance) {
    const roll = rnd();
    let picked;
    if (roll < 0.4) picked = { name: 'Cave-In', all: true, elem: 'earth', power: 18 };
    else if (roll < 0.65) picked = { name: 'Poison Powder', all: true, status: 'poison', power: 8, elem: 'poison' };
    else if (roll < 0.85) picked = { name: 'Rock Slide', all: false, elem: 'earth', power: 28 };
    else picked = { name: 'Snare', all: false, death: 0.42 };
    log.push('Twilight Requiem — ' + picked.name + '!');
    b.learnedDance = true;
    const foes = picked.all ? livingAll(b.enemies) : [target || living(b.enemies)[0] || livingAll(b.enemies)[0]];
    for (const f of foes) {
      if (!f) continue;
      if (picked.death) {
        if (!f.boss && rnd() < picked.death) { f.hp = 0; log.push(f.name + ' is ensnared!'); }
        else log.push(f.name + ' resists.');
        continue;
      }
      if (picked.power) {
        const fake = { mag: user.mag + 8, atk: user.atk, level: user.level };
        const hit = magicDamage(fake, f, { power: picked.power, elem: picked.elem }, rnd);
        const dealt = applyHit(f, hit.dmg, hit.heal);
        log.push(f.name + (hit.heal ? ' absorbs ' : ' takes ') + dealt + '.');
      }
      if (picked.status) addStatus(f, picked.status, 12);
    }
    return;
  }
  if (skill.banish) {
    if (!target || target.boss || (target.statusImmune || []).includes('banish')) { log.push('No effect.'); return; }
    if (rnd() < 0.38) { target.removed = true; target.hp = 0; log.push(target.name + ' is banished!'); }
    else log.push('The magitek field misses.');
    return;
  }
  const targets = skill.target === 'allEnemies' ? livingAll(b.enemies).filter(e => !e.hidden)
    : skill.target === 'ally' ? [target]
    : [target];
  if (skill.heal) {
    const t = target;
    if (!t) return;
    const n = healAmount(user, skill.power);
    const was = t.hp;
    t.hp = Math.min(t.maxHp, t.hp + n);
    if (skill.cleanse) t.statuses = t.statuses.filter(s => s.id !== 'poison' && s.id !== 'sap');
    log.push(user.name + ' heals ' + t.name + ' for ' + (t.hp - was) + '.');
    return;
  }
  for (let t of targets) {
    if (!t) continue;
    if (t.hidden && t.kind === 'whelkHead') {
      const shell = b.enemies.find(e => e.kind === 'whelkShell' && e.hp > 0);
      if (shell) { log.push('The head is gone. The blow strikes the shell!'); t = shell; }
      else continue;
    }
    if (t.hp <= 0 || t.removed) { log.push('Miss.'); continue; }
    if (skill.status && !skill.power) {
      const ok = rnd() < (skill.statusChance || 1);
      if (ok && addStatus(t, skill.status, skill.status === 'confuse' ? 8 : 12)) log.push(t.name + ' is ' + skill.status + 'd.');
      else log.push(t.name + ' resists.');
      continue;
    }
    if (skill.physical && rnd() < 0.05) { log.push('Miss.'); continue; }
    const hit = skill.physical
      ? physicalDamage(user, t, skill.power, b, rnd, skill.ignoreDef || 0)
      : magicDamage(user, t, skill, rnd);
    const dealt = applyHit(t, hit.dmg, hit.heal);
    log.push(t.name + (hit.heal ? ' absorbs ' : (hit.crit ? ' CRITICAL ' : ' takes ')) + dealt + '!');
    if (!hit.heal && skill.status && rnd() < (skill.statusChance || 0)) addStatus(t, skill.status, 10);
    if (!hit.heal && t.kind === 'whelkShell' && skill.elem !== 'lightning' && t.hp > 0) {
      b.counters.push({ from: t, to: user, power: 20 });
    }
  }
}

function resolveCounters(b, rnd, log) {
  const cs = b.counters.splice(0);
  for (const c of cs) {
    if (!c.to || c.to.hp <= 0) continue;
    const fakeUser = { mag: 20, atk: 10, level: 8, row: 'front' };
    const hit = magicDamage(fakeUser, c.to, { power: c.power, elem: 'lightning' }, rnd);
    const dealt = applyHit(c.to, hit.dmg, false);
    log.push('Megavolt strikes ' + c.to.name + ' for ' + dealt + '!');
  }
}

function chooseEnemySkill(e, b, rnd) {
  if (e.kind === 'spritzer' && rnd() < 0.45) {
    return { skill: { id: 'venom', name: 'Poison', power: 10, elem: 'poison', target: 'enemy', status: 'poison', statusChance: 0.75, time: 0.4 }, target: pickPlayer(b, rnd) };
  }
  if (e.ai === 'whelkHead') {
    if (rnd() < 0.35) return { skill: { id: 'slime', name: 'Slime', physical: true, power: 12, target: 'enemy', status: 'slow', statusChance: 1, time: 0.4 }, target: pickPlayer(b, rnd) };
    return { skill: SKILLS.fight, target: pickPlayer(b, rnd) };
  }
  if (e.ai === 'marshal') {
    e.aiN++;
    if (e.aiN % 2 === 0 && b.enemies.some(x => x.kind === 'lobo' && x.hp > 0)) {
      return { skill: { id: 'net', name: 'Net', physical: true, power: 8, target: 'enemy', status: 'stop', statusChance: 0.85, time: 0.45 }, target: pickPlayer(b, rnd) };
    }
    return { skill: SKILLS.fight, target: pickPlayer(b, rnd) };
  }
  if (e.ai === 'bandit' && rnd() < 0.3) return { skill: { id: 'mug', name: 'Mug', physical: true, power: 14, target: 'enemy', mug: true, time: 0.36 }, target: pickPlayer(b, rnd) };
  return { skill: SKILLS.fight, target: pickPlayer(b, rnd) };
}
function pickPlayer(b, rnd) {

}
function pickEnemyTarget(b, rnd, preferHead) {

function playerPlan(p, b, strategy, rnd) {
  const low = b.party.filter(x => x.hp > 0 && x.hp < x.maxHp * 0.45);
  const armor = strategy.armor;
  if (hasStatus(p, 'confuse')) return { skill: SKILLS.fight, target: pickPlayer(b, rnd) };
  if (hasStatus(p, 'stop')) return null;
  if (p.id === 'mog') {
    const foe = pickEnemyTarget(b, rnd, false);
    return { skill: SKILLS.dance, target: foe };
  }
  if (p.id === 'locke' && strategy.stealOnce && !b._stole) {
    b._stole = true;
    return { skill: SKILLS.steal, target: pickEnemyTarget(b, rnd, false) };
  }
  if (armor && p.id === 'biggs' && low.length && p.mp >= 4 && rnd() < 0.65) {
    return { skill: SKILLS.heal, target: low[0] };
  }
  let skill = SKILLS.fight;
  if (armor && p.id === 'terra' && p.mp >= 6) skill = SKILLS.tek;
  else if (armor && p.mp >= 3) {
    const foe = pickEnemyTarget(b, rnd, strategy.headOnly);
    if (foe && foe.weak.includes('fire') && p.mp >= 3) skill = SKILLS.fire;
    else skill = SKILLS.bolt;
  } else if (!armor && p.id === 'terra' && p.mp >= 4) skill = SKILLS.fire2;
  const foe = skill.target === 'ally' ? low[0] : pickEnemyTarget(b, rnd, strategy.headOnly);
  if (strategy.headOnly && b.form === 'whelk') {
    const head = b.enemies.find(e => e.kind === 'whelkHead');
    if (head && head.hidden) {
      if (low.length && p.mp >= 4 && armor) return { skill: SKILLS.heal, target: low[0] };
      return { skill: { id: 'wait', name: 'Wait', target: 'none', time: 0.2, wait: true }, target: null };
    }
  }
  if (skill.mp && p.mp < skill.mp) skill = SKILLS.fight;
  return { skill, target: foe };
}

function spendMp(user, skill) {
  if (skill.mp) {
    if ((user.mp || 0) < skill.mp) return false;
    user.mp -= skill.mp;
  }
  return true;
}

function simulate(formId, party, strategy, seed) {
  let s = seed || 1;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };

  let guard = 0;

    if (head && head.hp > 0 && b.whelkT <= 0) {
      head.hidden = !head.hidden;
      b.whelkT = head.hidden ? 3 : 5;

    for (const u of [...b.party, ...b.enemies]) tickStatuses(u, 2.2);
    if (outcome(b) !== 'fight') { b.phase = outcome(b); break; }
    for (const p of b.party) {

      if (!spendMp(p, plan.skill)) continue;
      const log = [];
      resolveAction(b, p, plan.skill, plan.target, rnd, log);
      if (plan.skill.mug) {}
      resolveCounters(b, rnd, log);
      b.log.push(...log);
      if (outcome(b) !== 'fight') { b.phase = outcome(b); break; }
    }
    if (b.phase !== 'fight') break;
    for (const e of b.enemies) {
      if (e.hp <= 0 || e.removed || e.hidden || e.immobile || e.ai === 'none') continue;
      const plan = chooseEnemySkill(e, b, rnd);
      if (!plan || !plan.target) continue;
      const log = [];
      if (plan.skill.mug) b.mugged = (b.mugged || 0) + 15;
      resolveAction(b, e, plan.skill, plan.target, rnd, log);
      resolveCounters(b, rnd, log);
      b.log.push(...log);

function musicUpdate() {

  if (!tr) return;
  const eighth = 60 / tr.bpm / 2;
  const n = tr.lead.length;
  while (AC.timer < AC.ctx.currentTime + 0.28) {
    if (!AC.loop && AC.index >= n) { AC.id = null; return; }
    const i = AC.index % n;

    note(tr.lead[i], when, eighth * 0.92, tr.waveL || 'triangle', 0.09);
    note(tr.bass[i % tr.bass.length], when, eighth * 0.95, 'square', 0.045);

function sfx(id) {

  else if (id === 'save') beep(400, 0.1, 'triangle', 0.06);
  else if (id === 'victory') { beep(523, 0.08, 'square', 0.06); beep(659, 0.08, 'square', 0.05); beep(784, 0.14, 'square', 0.06); }
  else if (id === 'die') beep(200, 0.25, 'triangle', 0.07);

function burst(dur, freq, gain) {

function floorFn(kind) {
  if (kind === 'snow') return (x, y) => {
    const n = E.noise2(x * 0.07, y * 0.07);
    const h = E.hash2((x * 2) | 0, (y * 2) | 0);
    let r = 206 + n * 36, g = 216 + n * 30, b = 228 + n * 22;
    if (h > 0.985) return [255, 255, 255];
    if (h < 0.03) return [168, 184, 200];
    return [r, g, b];
  };
  if (kind === 'mine') return (x, y) => {
    const c = E.tex.flagstone(x, y, STONE, 16);
    if (E.hash2((x / 3) | 0, (y / 3) | 0) > 0.992) return [120, 230, 210, 0.85];
    return c;
  };
  if (kind === 'den') return (x, y) => E.tex.flagstone(x, y, DEN, 16);
  if (kind === 'ice') return (x, y) => {
    const n = E.noise2(x * 0.05, y * 0.05);
    if (Math.abs(Math.sin(x * 0.18) + Math.cos(y * 0.15)) < 0.12) return [230, 255, 255, 0.7];
    return [150 + n * 40, 200 + n * 40, 220 + n * 20, n > 0.72 ? 0.35 : 0];
  };
  return (x, y) => {
    const plank = Math.floor(x / 10);
    const base = E.hash2(plank, 1);
    let r = 110 + base * 40, g = 74 + base * 24, b = 46;
    if ((x % 10) < 0.7 || (y % 18) < 0.6) { r *= 0.72; g *= 0.72; b *= 0.72; }
    return [r, g, b];
  };
}

function placeFollowers() {

}
function syncFieldPos(dt) {
  if (!party.length) return;
  const step = dt || 1 / 120;
  party[0].wx = leader.x; party[0].wy = leader.y; party[0].wf = leader.facing; party[0].wv = hypot(leader.vx, leader.vy);
  followers.forEach((f, i) => {
    const idx = Math.max(0, trail.length - 1 - (i + 1) * 8);
    const goal = trail[idx] || { x: leader.x, y: leader.y };
    const k = 1 - Math.exp(-28 * step);
    f.x += (goal.x - f.x) * k;
    f.y += (goal.y - f.y) * k;
    const dx = goal.x - f.x, dy = goal.y - f.y;
    if (hypot(dx, dy) > 0.6) f.facing = Math.atan2(dy, dx);
    const p = party[i + 1];
    if (p) { p.wx = f.x; p.wy = f.y; p.wf = f.facing; p.wv = hypot(dx, dy) * 6; }
  });
}

  if (areaId === 'defense') {

    if (ms) ms.all.forEach((p, i) => npcs.push({
      id: 'moog' + i, x: p.x, y: p.y, kind: 'mog', name: i ? 'Kupo' : 'Moglin', solid: true,
      lines: [{ who: i ? 'Kupo' : 'Moglin', text: i ? 'East tunnel is still ours, kupo. Probably.' : 'We hold the side doors. You hold this one, kupo!' }]

}

function pickItemTarget(id, inBattle) {
  const it = NM.ITEMS[id];
  if (it.kind === 'camp') {
    if (inBattle) { toast('Not in battle.'); sfx('buzzer'); return; }
    for (const p of party) { p.hp = p.maxHp; p.mp = p.maxMp; p.statuses = []; }
    bag.bag--; sfx('heal'); toast('The party rests.'); closePanel(true); checkpoint(); return;
  }
  const list = party.filter(p => it.kind === 'revive' ? p.hp <= 0 : p.hp > 0);
  if (!list.length) { sfx('buzzer'); toast('No one.'); return; }
  openPanel(it.name, '<div class="col">' + list.map(p => '<button type="button" class="act" data-cmd="who" data-arg="' + p.id + '">' + displayName(p) + '  ' + p.hp + '/' + p.maxHp + '</button>').join('') + '</div>', () => {}, { keep: true });
  panelCmd = (cmd, arg) => {
    if (cmd === 'close') { openItems(inBattle); return; }
    if (cmd !== 'who') return;
    const p = party.find(x => x.id === arg);
    if (!p || !bag[id]) return;
    if (it.kind === 'heal') p.hp = Math.min(p.maxHp, p.hp + it.hp);
    else if (it.kind === 'mp') p.mp = Math.min(p.maxMp, p.mp + it.mp);
    else if (it.kind === 'full') { p.hp = p.maxHp; p.mp = p.maxMp; p.statuses = []; }
    else if (it.kind === 'revive') { p.hp = Math.max(1, (p.maxHp / 4) | 0); p.statuses = []; }
    else if (it.kind === 'cure') p.statuses = p.statuses.filter(s => s.id !== 'poison' && s.id !== 'sap');
    bag[id]--; sfx(it.kind === 'heal' || it.kind === 'revive' || it.kind === 'full' ? 'heal' : 'confirm');
    if (inBattle && battle) {
      closePanel(true);
      const actor = battle.actor;
      if (actor) { actor.gauge = 0; actor.anim = 'strike'; }
      battle.pages = []; battle.actor = null;
      battleMessage(displayName(p) + ' — ' + it.name + '.');
      if (actor) battle.queue = battle.queue.filter(q => q !== actor);
    } else openItems(false);
  };
}

function nearestInteract(x, y, rad) {
  let best = null, bd = rad;
  const consider = (px, py, d0, use) => {
    const d = hypot(px - x, py - y);
    if (d < bd) { bd = d; best = { use, d }; }
  };
  for (const n of npcs) consider(n.x, n.y, 18, () => say(n.lines, n.id === 'alley' ? alleyFight : null));
  if (areaId === 'north') {
    const gates = [];
    for (let y = 0; y < area.h; y++) for (let x = 0; x < area.w; x++) if (area.rows[y][x] === 'G') gates.push([(x + .5) * T, (y + .5) * T]);
    if (!flags.gateOpen) for (const g of gates) consider(g[0], g[1], 22, () => openGate());
  }
  const save = markWorld('s'); if (save) consider(save.x, save.y, 16, () => openSave());
  const clock = markWorld('k'); if (clock && !flags.gotElixir) consider(clock.x, clock.y, 16, () => takeElixir());
  const bagC = markWorld('C'); if (bagC && !flags.chestBag) consider(bagC.x, bagC.y, 16, () => takeChest('chestBag', 'bag', 'Sleeping Bag'));
  const ph = markWorld('P'); if (ph && !flags.chestPhoenix) consider(ph.x, ph.y, 16, () => takeChest('chestPhoenix', 'phoenix', 'Phoenix Down'));
  const heal = markWorld('H'); if (heal && !flags.healedSpring) consider(heal.x, heal.y, 16, () => useSpring());
  return best;
}

function collideCircle(b, x, y, r) {
  const dx = b.x - x, dy = b.y - y, d = hypot(dx, dy), m = b.r + r;
  if (d < m && d > 0.01) { b.x = x + dx / d * m; b.y = y + dy / d * m; }
}
function collideProps(b) {
  for (const n of npcs) if (n.solid) collideCircle(b, n.x, n.y, 6);
  for (const ch of ['C', 'P', 's', 'k', 'H']) {
    const m = markWorld(ch); if (!m) continue;
    for (const p of m.all) collideCircle(b, p.x, p.y, ch === 's' || ch === 'H' ? 4 : 6);
  }
  if (areaId === 'esper') { const k = markWorld('K'); if (k) for (const p of k.all) collideCircle(b, p.x, p.y, 8); }
}
function updateField(dt) {
  const mv = game.input.move();
  let md = game.view.screenDirToGround(mv[0], mv[1]);
  if (heldInject.size) {
    let x = (heldInject.has('KeyD') || heldInject.has('ArrowRight') ? 1 : 0) - (heldInject.has('KeyA') || heldInject.has('ArrowLeft') ? 1 : 0);
    let y = (heldInject.has('KeyS') || heldInject.has('ArrowDown') ? 1 : 0) - (heldInject.has('KeyW') || heldInject.has('ArrowUp') ? 1 : 0);
    md = game.view.screenDirToGround(x, y);
  }
  const keyed = hypot(md[0], md[1]) > 0.12;
  if (keyed) dest = null;
  let ax = 0, ay = 0;
  if (keyed) { ax = md[0]; ay = md[1]; }
  else if (dest && flow) {
    flow.update(dest.x, dest.y);
    const d = flow.dir(leader.x, leader.y, dest.x, dest.y);
    if (hypot(dest.x - leader.x, dest.y - leader.y) < 7) dest = null;
    else { ax = d[0]; ay = d[1]; }
  }
  const run = game.input.down('run') || touchRun || heldInject.has('ShiftLeft');
  const spd = (flags.armor ? 52 : 48) * (run ? 1.62 : 1);
  leader.vx = E.approach(leader.vx, ax * spd, 820 * dt);
  leader.vy = E.approach(leader.vy, ay * spd, 820 * dt);
  const ox = leader.x, oy = leader.y;
  leader.x += leader.vx * dt; leader.y += leader.vy * dt;
  const body = { x: leader.x, y: leader.y, r: leader.r };
  map.collide(body); collideProps(body);
  leader.x = body.x; leader.y = body.y;
  const moved = hypot(leader.x - ox, leader.y - oy);
  if (hypot(leader.vx, leader.vy) > 10) leader.facing = Math.atan2(leader.vy, leader.vx);
  if (moved > 0.3) {
    trail.push({ x: leader.x, y: leader.y });
    if (trail.length > 90) trail.shift();
    travel += moved;
    if (preset().embers > 1 && Math.random() < dt * 6) game.particles.dust(leader.x, leader.y, 0, 1, { speed: 10, color: area.weather === 'snow' ? '#e8eef5' : '#6a6058', size: 1 });
  }
  syncFieldPos(dt);
  poseParty(dt, false);
  game.focus(leader.x + Math.cos(leader.facing) * 10, leader.y + Math.sin(leader.facing) * 10, 8);
  if (area.encounters && travel - encAt > 170 && encCD <= 0 && hypot(leader.vx, leader.vy) > 12) {
    encAt = travel;
    if (Math.random() < 0.62) beginBattle(NM.rollEnc(area.table, Math.random), () => {});
  }
  encCD -= dt;
  poisonClock += dt;
  if (poisonClock > 1) {
    poisonClock = 0;
    for (const p of party) NM.tickStatuses(p, 1);
  }
  checkLines(oy);
  checkZones();
  const near = nearestInteract(leader.x, leader.y, 20);
  $('hint').textContent = near ? 'Z  Examine' : '';
  $('obj').textContent = objective();
}
function checkLines(prevY) {
  if (areaId === 'town') {
    const lines = [
      { y: 21.5 * T, flag: 'fight1', form: 'guards2' },
      { y: 11.5 * T, flag: 'fightP', form: 'pincer' },
      { y: 2.6 * T, flag: 'fightM', form: 'megas' }
    ];
    for (const L of lines) {
      if (flags[L.flag]) continue;
      if (prevY > L.y && leader.y <= L.y) {
        leader.y = L.y + 6;
        beginBattle(L.form, () => { flags[L.flag] = true; if (L.form === 'guards2') say([{ who: 'Wedge', text: 'They fight like people who live here. Keep moving.' }]); });
        return;
      }
    }
  }
  if (areaId === 'escape' && !flags.spotted && leader.y < 6 * T) {
    flags.spotted = true;
    leader.y = 6 * T + 4;
    say([
      { who: 'Guard', text: 'On the bridge! That is her — the one from the armor!' },
      { who: playerName, text: 'The south mine. Arvis said the south mine.' }
    ], () => enterArea('south'));
  }
  if (areaId === 'defense' && flags.briefed && flags.wave < 3 && !flags.defenseDone) {
    const line = 5.5 * T;
    if (prevY > line && leader.y <= line) {
      leader.y = line + 8;
      const forms = ['wave1', 'wave2', 'marshal'];
      const form = forms[flags.wave];
      beginBattle(form, () => {
        flags.wave++;
        if (flags.wave < 3) {
          for (const p of party) if (p.hp > 0) p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp * 0.35));
          toast('A breath. The next rush is already in the tunnel.');
        } else ending();
      });
    }
  }
}
function checkZones() {

    const g = markWorld('g');
    if (g && g.all.some(p => hypot(p.x - leader.x, p.y - leader.y) < 9)) {
      leader.y += 12;
      beginBattle('grate', () => { flags.grate = true; });
      return;
    }
  }
  if (areaId === 'town' && flags.fightM) {
    const n = markWorld('N');
    if (n && hypot(n.x - leader.x, n.y - leader.y) < 16 && leader.y < 1.2 * T) enterArea('north');
  }
  if (areaId === 'snow') {
    const n = markWorld('N');
    if (n && leader.y < n.y + 8) enterArea('town');
  }
  if (areaId === 'north' && flags.gateOpen && !flags.whelk && leader.y < 10.2 * T) {
    leader.y = 12 * T;
    beginBattle('whelk', () => {
      flags.whelk = true;
      say(flags.whelkShell
        ? [{ who: 'Biggs', text: 'Head and shell. I did not think we had that in us. Take the extra ether and move.' }]

    });
  }
  if (areaId === 'north' && flags.whelk) {
    const x = markWorld('X');
    if (x && hypot(leader.x - x.x, leader.y - x.y) < 18) enterArea('esper');
  }
  if (areaId === 'esper' && !flags.esper) {
    const k = markWorld('K');
    if (k && hypot(leader.x - k.x, leader.y - k.y) < 28) esperScene();

  if (areaId === 'house') {
    const d = markWorld('D');
    if (d && leader.y > d.y - 6) {
      leader.y = d.y - 14;
      if (!flags.gotElixir && !flags.doorWarn) {

  }
  if (areaId === 'south' && !flags.caveIn) {
    const z = markWorld('Z');
    if (z && hypot(leader.x - z.x, leader.y - z.y) < 20) caveIn();
  }
}

      vy: inBattle ? 0 : Math.sin(p.wf || 0) * (p.wv || 0),

}

        '<div class="bars"><i class="' + hpBand(p) + '" style="width:' + (hp * 100) + '%"></i></div>' +
        '<div class="mp"><i style="width:' + Math.min(100, p.gauge) + '%;background:#e6c36a"></i></div>' +
        '<small>' + tags + '</small></div>';
    }).join('');
  }
  if (battle.phase === 'intro') {
    if (battleSig !== 'intro') {
      battleSig = 'intro';
      $('bMenu').innerHTML = '<p><b>Active Time Battle</b></p><p class="tiny">Gauges fill by themselves. When one is full, pick a command. Wait mode pauses them while you choose. Defend halves the next hit. This fight cannot be run from.</p><button type="button" class="act" id="tutOk">Begin</button>';
      $('tutOk').onclick = () => { battle.phase = 'fight'; sfx('confirm'); };
    }
    return;
  }
  if (battle.phase !== 'fight' || !battle.pages.length) {
    const wsig = 'wait:' + battle.enemies.filter(e => e.hp > 0 && !e.hidden).map(e => e.kind + e.hp + wound(e)).join('|');
    if (battleSig !== wsig) {
      battleSig = wsig;
      $('bMenu').innerHTML = '<p class="tiny">' + battle.enemies.filter(e => e.hp > 0 && !e.hidden).map(e => e.name + ' (' + wound(e) + ')').join(' · ') + '</p>';
    }
    return;
  }
  const items = page().items;
  const sig = battle.pages.length + ':' + battle.cursor + ':' + items.map(i => i.name || i.id).join('|') + ':' + battle.actor.id;
  if (sig === battleSig) return;
  battleSig = sig;
  $('bMenu').innerHTML = '<div class="tiny">' + (page().target ? 'Choose a target' : displayName(battle.actor)) + '</div><div class="cmds">' +
    items.map((it, i) => '<button type="button" class="act' + (i === battle.cursor ? ' on' : '') + '" data-i="' + i + '">' + (it.name || '—') + (it.mp ? '  ' + it.mp + 'MP' : '') + '</button>').join('') + '</div>';
  $('bMenu').querySelectorAll('button').forEach(b => b.onclick = () => { battle.cursor = +b.dataset.i; activateBattle(); });
}
function autoQuality(dt) {
  if (!game || settings.quality !== 'auto') return;
  const f = game.stats.frameMs || 16;
  if (f > 21) { autoBad += dt; autoGood = 0; } else if (f > 0 && f < 16.5) { autoGood += dt; autoBad = 0; }
  if (autoBad > 1.1 && autoTier === 'high') { autoTier = 'balanced'; autoBad = 0; }
  if (autoGood > 2.2 && autoTier === 'balanced') { autoTier = 'high'; autoGood = 0; }
}
function update(dt) {
  if (mode !== 'title') playTime += dt;
  musicUpdate();
  pump(dt);
  if (mode === 'title') updateTitle(dt);
  else if (mode === 'field') updateField(dt);
  else if (mode === 'battle') updateBattle(dt);
  else if (mode === 'dialogue') updateDlg(dt);
  else poseParty(dt, !!(battle && mode === 'battle'));
  updateFx(dt);
  autoQuality(dt);
  syncDom();
}
function draw(r) {
  game.lights.ambient = area ? area.ambient : 0.5;
  game.lights.enabled = true;
  if (gpu) { gpu.enabled = !!settings.gpu; gpu.shadows = preset().heat; }
  if (mode === 'battle') drawBattle(r);
  else drawField(r);
  drawWeather(r);
}
function newGame(opts) {
  opts = opts || {};
  if (mode !== 'title' && mode !== 'gameover' && mode !== 'results' && !opts.force) return;
  closePanel(true);
  resetState();
  hideTitle();
  mode = 'field';
  if (opts.skip) flags.talkedSnow = true;
  enterArea('snow');
  inputLock = 0.2;
}
function continueGame() {
  const s = readSave(); if (!s) return;
  hideTitle(); applySave(s); inputLock = 0.2;
}

function boot() {
  loadSettings();
  const canvas = $('screen');
  game = new E.Game({
    canvas, view: 'threequarter', minH: 200, minW: 280, maxW: 480, maxH: 300, bg: '#141c28', input: INPUT
  });
  gpu = game.enableGPU({ ambient: [.2, .22, .28], wrap: 0.5 });
  gpu.enabled = !!settings.gpu;
  game.lights.enabled = true;
  game.input.bindButtons(document);
  resetState();
  flags.armor = true;
  mode = 'title';
  enterArea('snow', null, { quiet: true });
  mode = 'title';
  showTitle();
  canvas.addEventListener('pointerdown', e => {
    try { audio(); } catch (err) {}
    if (mode !== 'field' || e.pointerType !== 'mouse' || e.button !== 0) return;
    const gnd = game.mouseGround(); if (!gnd || map.solidAt(gnd[0], gnd[1])) return;
    const hit = nearestInteract(gnd[0], gnd[1], 12);
    if (hit) { hit.use(); return; }
    dest = { x: gnd[0], y: gnd[1] };
  });
  $('btnNew').onclick = () => { try { audio(); } catch (e) {} newGame(); };
  $('btnContinue').onclick = () => continueGame();
  $('btnHelp').onclick = () => openHelp();
  $('btnOpt').onclick = () => openOptions();
  $('btnAbout').onclick = () => openAbout();
  $('runBtn').onclick = () => { touchRun = !touchRun; $('runBtn').setAttribute('aria-pressed', String(touchRun)); };
  $('panel').addEventListener('click', e => {
    const b = e.target.closest('[data-cmd]'); if (!b) return;
    panelCmd(b.dataset.cmd, b.dataset.arg);
  });
  $('dlg').addEventListener('pointerdown', e => { e.stopPropagation(); if (mode === 'dialogue') advanceDlg(); });
  window.addEventListener('error', ev => { const el = $('err'); el.style.display = 'block'; el.textContent = ev.message || 'Error'; });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && AC.ctx && AC.ctx.state === 'suspended') AC.ctx.resume();
  });
  window.__game = {
    newGame: o => newGame(Object.assign({ force: true, skip: true }, o || {})),
    continueGame, get mode() { return mode; }, get x() { return leader.x; }, get y() { return leader.y; },
    get area() { return areaId; }, get flags() { return flags; }, get party() { return party; },
    battle: form => { if (mode === 'title') newGame({ force: true, skip: true }); beginBattle(form, () => {}); },
    jump(id) {
      if (mode === 'title') newGame({ force: true, skip: true });
      battle = null; battleThen = null; dlg = null;
      $('dlg').hidden = true; $('battleUi').hidden = true;
      closePanel(true);
      mode = 'field';
      if (id === 'defense') { flags.caveIn = true; flags.armor = false; party = [NM.freshMember('locke', 'Locke'), NM.freshMember('mog', 'Mog'), NM.freshMember('molulu', 'Molulu')]; flags.briefed = true; }
      if (id === 'house') { flags.armor = false; flags.spark = true; flags.esper = true; party = [party.find(p => p.id === 'terra') || NM.freshMember('terra', playerName)]; }
      enterArea(id);
    }
  };
  window.__controlsTest = {
    setKeys(codes) {
      heldInject.clear();
      for (const c of ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ShiftLeft']) game.input.held.delete(c);
      for (const c of codes || []) { heldInject.add(c); game.input.held.add(c); }
    },
    getX: () => leader.x, getY: () => leader.y, getYaw: () => leader.facing,
    getSpeed: () => hypot(leader.vx, leader.vy)
  };
  game.start({ update, draw });
}
boot();
})();
/* =============================== GAME END =============================== */
</script>
</body>
</html>
