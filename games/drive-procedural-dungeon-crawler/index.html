<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Procedural Dungeon Fluid Crawler</title>
<style>
  html,body{margin:0;height:100%;background:#0c0d12;color:#d9dde8;font-family:ui-monospace,Consolas,monospace;overflow:hidden}
  #wrap{height:100%;display:grid;place-items:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0c10;border:1px solid #303442;
    width:min(96vw,1280px);height:auto;max-height:92vh;aspect-ratio:16/9}
  #hint{position:fixed;left:10px;bottom:8px;font-size:12px;opacity:.8;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="320" height="180"></canvas></div>
<div id="hint">WASD move · mouse aim · click / Space slash · E spill fluid · R new seed</div>
<script>
"use strict";
const C=document.getElementById("c"),X=C.getContext("2d"); X.imageSmoothingEnabled=false;
const W=C.width,H=C.height,T=8,GW=40,GH=22;
const keys={}, mouse={x:W/2,y:H/2,down:false};
addEventListener("keydown",e=>{keys[e.code]=1;if(e.code==="KeyR")reset();});
addEventListener("keyup",e=>keys[e.code]=0);
C.addEventListener("mousemove",e=>{let r=C.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});
C.addEventListener("mousedown",()=>{mouse.down=true;audio();});
addEventListener("mouseup",()=>mouse.down=false);

let seed=0,rng,tiles,rooms,fluids,fluidType,sources,enemies,player,parts,slashes,tick=0,last=0,spillLatch=false;
function R(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function RI(a,b){return a+Math.floor(R()*(b-a+1))}
function hash(x,y,n=0){let h=(x*374761393+y*668265263+n*1442695041)>>>0;h=(h^(h>>13))*1274126177>>>0;return((h^(h>>16))>>>0)/4294967296}
function id(x,y){return y*GW+x}
function inside(x,y){return x>0&&y>0&&x<GW-1&&y<GH-1}
function carve(x,y){if(inside(x,y))tiles[id(x,y)]=0}
function corridor(a,b){
  let x=a.cx,y=a.cy, tx=b.cx,ty=b.cy;
  if(R()<.5){while(x!==tx){carve(x,y);x+=Math.sign(tx-x)} while(y!==ty){carve(x,y);y+=Math.sign(ty-y)}}
  else {while(y!==ty){carve(x,y);y+=Math.sign(ty-y)} while(x!==tx){carve(x,y);x+=Math.sign(tx-x)}}
  carve(tx,ty)
}
function reset(){
  seed=(Date.now()^(Math.random()*0xffffffff))>>>0; rng=R;
  tiles=new Uint8Array(GW*GH); tiles.fill(1); rooms=[]; sources=[]; parts=[]; slashes=[]; enemies=[];
  fluids=new Float32Array(GW*GH); fluidType=new Uint8Array(GW*GH);
  for(let k=0;k<70&&rooms.length<11;k++){
    let w=RI(5,10),h=RI(4,7),x=RI(1,GW-w-2),y=RI(1,GH-h-2),ok=true;
    for(let r of rooms)if(x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y){ok=false;break}
    if(!ok)continue;
    let r={x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)}; rooms.push(r);
    for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)carve(xx,yy);
    if(rooms.length>1)corridor(rooms[rooms.length-2],r)
  }
  // extra loops
  for(let k=0;k<3&&rooms.length>2;k++){let a=rooms[RI(0,rooms.length-1)],b=rooms[RI(0,rooms.length-1)];corridor(a,b)}
  let s=rooms[0]||{cx:2,cy:2};
  player={x:s.cx*T+4,y:s.cy*T+4,hp:100,cd:0,hit:0};
  for(let i=1;i<rooms.length;i++){
    let r=rooms[i];
    if(R()<.85)enemies.push({x:r.cx*T+4,y:r.cy*T+4,hp:2,cd:R(),phase:R()*6.28});
    if(R()<.48){
      let x=RI(r.x+1,r.x+r.w-2),y=RI(r.y+1,r.y+r.h-2),typ=R()<.72?1:2;
      sources.push({x,y,t:typ,rate:.08+R()*.08});
      fluids[id(x,y)]=1;fluidType[id(x,y)]=typ;
    }
  }
}
function pass(px,py){
  let x=Math.floor(px/T),y=Math.floor(py/T);
  return inside(x,y)&&tiles[id(x,y)]===0
}
function moveBody(o,dx,dy){
  let nx=o.x+dx,ny=o.y;
  if(pass(nx-2,ny-2)&&pass(nx+2,ny+2))o.x=nx;
  nx=o.x;ny=o.y+dy;
  if(pass(nx-2,ny-2)&&pass(nx+2,ny+2))o.y=ny;
}
function fluidStep(){
  // sources
  for(let s of sources){let i=id(s.x,s.y);fluids[i]=Math.min(1.4,fluids[i]+s.rate);fluidType[i]=s.t}
  let next=new Float32Array(fluids), nt=new Uint8Array(fluidType);
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let y=1;y<GH-1;y++)for(let x=1;x<GW-1;x++){
    let i=id(x,y),a=fluids[i]; if(a<.015||tiles[i])continue;
    let typ=fluidType[i]||1;
    let order=dirs.slice().sort((A,B)=>hash(x+A[0],y+A[1],tick)-hash(x+B[0],y+B[1],tick));
    let budget=Math.min(a*.32,.24);
    for(let d of order){
      let j=id(x+d[0],y+d[1]);if(tiles[j])continue;
      if(fluidType[j]&&fluidType[j]!==typ)continue; // fluids do not mix in this compact demo
      let diff=a-fluids[j];
      if(diff>.03&&budget>0){
        let q=Math.min(budget,diff*.12+.008*hash(x,y,j+tick));
        next[i]-=q;next[j]+=q;nt[j]=typ;budget-=q;
      }
    }
  }
  for(let i=0;i<next.length;i++){
    if(next[i]<.01){next[i]=0;nt[i]=0}
    else next[i]=Math.min(1.5,next[i]);
  }
  fluids=next;fluidType=nt;
}
function spill(){
  let x=Math.floor(player.x/T),y=Math.floor(player.y/T),typ=keys["ShiftLeft"]?2:1;
  if(inside(x,y)&&!tiles[id(x,y)]){let i=id(x,y);fluids[i]=Math.min(1.5,fluids[i]+1);fluidType[i]=typ}
}
function slash(){
  if(player.cd>0)return;
  player.cd=.23; let ang=Math.atan2(mouse.y-player.y,mouse.x-player.x);
  slashes.push({x:player.x,y:player.y,a:ang,t:.14});
  beep(140,.035,.05);
  for(let e of enemies){
    let dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy),da=Math.atan2(dy,dx)-ang;
    da=Math.atan2(Math.sin(da),Math.cos(da));
    if(d<16&&Math.abs(da)<1.05){e.hp--;e.x+=Math.cos(ang)*5;e.y+=Math.sin(ang)*5;burst(e.x,e.y,5);beep(70,.02,.03)}
  }
}
function burst(x,y,n){for(let i=0;i<n;i++){let a=R()*6.28,s=.2+R()*.6;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.4+R()*.3})}}
function update(dt){
  tick++;
  if(player.cd>0)player.cd-=dt;if(player.hit>0)player.hit-=dt;
  let cx=Math.floor(player.x/T),cy=Math.floor(player.y/T),fi=id(cx,cy),wet=fluids[fi]||0,typ=fluidType[fi];
  let sp=38*dt*(wet>.25?.62:1),dx=(keys["KeyD"]?1:0)-(keys["KeyA"]?1:0),dy=(keys["KeyS"]?1:0)-(keys["KeyW"]?1:0);
  if(dx||dy){let l=Math.hypot(dx,dy);moveBody(player,dx/l*sp,dy/l*sp)}
  if((mouse.down||keys["Space"])&&player.cd<=0)slash();
  if(keys["KeyE"]&&!spillLatch){spill();spillLatch=true} if(!keys["KeyE"])spillLatch=false;
  if(typ===2&&wet>.3&&player.hit<=0){player.hp-=3;player.hit=.35;burst(player.x,player.y,3)}
  for(let e of enemies){
    if(e.hp<=0)continue;e.cd-=dt;e.phase+=dt;
    let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
    let ex=Math.floor(e.x/T),ey=Math.floor(e.y/T),ew=fluids[id(ex,ey)]||0,es=(ew>.3?9:17)*dt;
    if(d<90&&d>7)moveBody(e,dx/d*es,dy/d*es);
    if(d<8&&e.cd<=0){player.hp-=7;e.cd=.8;player.hit=.25;burst(player.x,player.y,4);beep(45,.06,.05)}
  }
  enemies=enemies.filter(e=>e.hp>0);
  for(let p of parts){p.x+=p.vx*60*dt;p.y+=p.vy*60*dt;p.vx*=.94;p.vy*=.94;p.t-=dt}
  parts=parts.filter(p=>p.t>0);for(let s of slashes)s.t-=dt;slashes=slashes.filter(s=>s.t>0);
  if(tick%3===0)fluidStep();
  if(player.hp<=0)reset();
}
function rect(x,y,w,h,c){X.fillStyle=c;X.fillRect(x|0,y|0,w|0,h|0)}
function draw(){
  rect(0,0,W,H,"#090a0e");
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    let i=id(x,y),px=x*T,py=y*T;
    if(tiles[i]){
      let v=hash(x,y,1)>.72?"#252937":"#20232f";rect(px,py,T,T,v);
      if(!tiles[id(Math.max(0,x),Math.min(GH-1,y+1))])rect(px,py+6,T,2,"#343949");
      if(hash(x,y,2)>.87)rect(px+2,py+2,2,1,"#151722");
    }else{
      rect(px,py,T,T,hash(x,y,3)>.86?"#181b25":"#151820");
      if(hash(x,y,4)>.94)rect(px+RIx(x,y,2,5),py+RIx(y,x,2,5),1,1,"#2b3040");
    }
  }
  // fluids
  for(let y=1;y<GH-1;y++)for(let x=1;x<GW-1;x++){
    let i=id(x,y),a=fluids[i];if(a<=.01)continue;let t=fluidType[i],px=x*T,py=y*T;
    let col=t===2?"#65d64a":"#3185d8", hi=t===2?"#a7f06f":"#6bc6ff";
    X.globalAlpha=Math.min(.8,.22+a*.5);rect(px,py,T,T,col);X.globalAlpha=1;
    let yy=py+((tick+x*3+y*7)&3);rect(px+1,yy,Math.max(1,Math.min(6,a*5)),1,hi);
  }
  // sources
  for(let s of sources){let c=s.t===2?"#b8ff79":"#7fd7ff";rect(s.x*T+2,s.y*T+2,4,4,c);rect(s.x*T+3,s.y*T+1,2,1,c)}
  for(let e of enemies){
    let bob=Math.sin(e.phase*7)>0?0:1,px=(e.x-4)|0,py=(e.y-4+bob)|0;
    rect(px+1,py+2,6,5,"#922d4d");rect(px+2,py+1,4,1,"#c04668");rect(px+2,py+3,1,1,"#ffdeea");rect(px+5,py+3,1,1,"#ffdeea");
  }
  for(let p of parts){rect(p.x,p.y,2,2,"#e85d75")}
  // player
  let px=(player.x-4)|0,py=(player.y-5)|0;
  rect(px+1,py+1,6,7,player.hit>0?"#ffffff":"#d7c37c");rect(px+2,py,4,2,"#7bb5d9");rect(px+2,py+3,1,1,"#171a22");rect(px+5,py+3,1,1,"#171a22");
  // sword aim
  let a=Math.atan2(mouse.y-player.y,mouse.x-player.x),sx=player.x+Math.cos(a)*7,sy=player.y+Math.sin(a)*7;
  X.strokeStyle="#e7eaf1";X.lineWidth=2;X.beginPath();X.moveTo(player.x,player.y);X.lineTo(sx,sy);X.stroke();
  for(let s of slashes){X.strokeStyle="#f5e8a4";X.lineWidth=2;X.beginPath();X.arc(s.x,s.y,12,s.a-1,s.a+1);X.stroke()}
  // HUD
  rect(6,6,74,9,"#11131a");rect(7,7,Math.max(0,72*player.hp/100),7,"#ad3f55");
  X.fillStyle="#f0f1f4";X.font="6px monospace";X.fillText("HP "+Math.max(0,player.hp|0),9,13);
  X.fillText("SEED "+seed.toString(16).toUpperCase().padStart(8,"0"),207,11);
  X.fillText("OOZE:"+enemies.length,269,19);
}
function RIx(a,b,m,n){return m+Math.floor(hash(a,b,8)*(n-m+1))}
function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
let AC;
function audio(){if(!AC)AC=new (AudioContext||webkitAudioContext)()}
function beep(f,d,v){if(!AC)return;let o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
