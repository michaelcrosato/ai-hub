<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The last light over the frontier</title>
  <desc id="desc">An original cinematic Western landscape. A lone rider and horse stand on a sage-covered bluff above a winding river, terracotta mesas and a distant frontier settlement beneath an amber sun.</desc>
