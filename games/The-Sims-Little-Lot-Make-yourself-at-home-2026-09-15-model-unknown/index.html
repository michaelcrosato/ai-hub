<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1e5"><meta name="description" content="Little Lot: a complete, offline, block-built home-life game. Make a friend. Make a home. Make a little mess.">
<title>Little Lot — Make yourself at home</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 38 50'%3E%3Cpath d='M19 1 35 24 19 49 3 24Z' fill='%23689a64'/%3E%3Cpath d='M19 1 19 49 3 24Z' fill='%238db879'/%3E%3Cpath d='M19 1 35 24 19 23Z' fill='%23b8d493'/%3E%3Cpath d='M3 24 19 23 19 49Z' fill='%23447d58'/%3E%3C/svg%3E">
<script type="importmap">
{
  "imports": {
    "three": "/lib/three/three.webgpu.js",
    "three/webgpu": "/lib/three/three.webgpu.js",
    "three/tsl": "/lib/three/three.tsl.js",
    "three/addons/": "/lib/three/addons/",
    "kit/": "/lib/kit/"
  }
}
</script>
<link rel="modulepreload" href="/lib/three/three.core.js" />
<link rel="modulepreload" href="/lib/three/three.webgpu.js" />
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="world" aria-label="Your home. Click objects to use them. Drag to move the view."></canvas>
<canvas id="overlay" class="overlay-canvas" aria-hidden="true"></canvas>
<header class="topbar">
  <div class="brand"><svg class="brand-mark" viewBox="0 0 38 50" aria-hidden="true"><path d="M19 1 35 24 19 49 3 24Z" fill="#689a64"/><path d="M19 1 19 49 3 24Z" fill="#8db879"/><path d="M19 1 35 24 19 23Z" fill="#b8d493"/><path d="M3 24 19 23 19 49Z" fill="#447d58"/><path d="m10 21 9-13 9 13-9 15Z" fill="none" stroke="#eff7cf" stroke-width="1.1" opacity=".8"/></svg><div><div class="wordmark">little lot<span style="color:#76a365">.</span></div><div class="tagline">Make yourself at home</div></div></div>
  <div class="address">21 Clover Lane<span>BRAMBLE BAY · YOUR LITTLE CORNER</span></div>
  <div class="top-actions">
    <button class="pill-btn" id="save-btn" title="Save your game"><i class="saved-dot"></i><span id="save-label">Saved locally</span></button>
    <button class="round-btn" id="sound-btn" title="Turn sound on" aria-label="Turn sound on"></button>
    <button class="round-btn" id="help-btn" title="How to play (H)" aria-label="How to play"></button>
    <button class="round-btn" id="settings-btn" title="Game settings" aria-label="Game settings"></button>
    <button class="round-btn" id="menu-btn" title="Menu (Esc)" aria-label="Menu"></button>
  </div>
</header>
<section class="side-left"><div class="card chapter" id="story-card"></div><div class="hint-card" id="hint-card"></div></section>
<section class="side-right">
  <div class="card time-card"><div class="date-row"><span id="day-label">MONDAY · DAY 1</span><span class="sun-icon" id="weather-icon"></span></div><div class="clock"><span id="clock">08:00</span><small id="clock-period">AM</small></div><div class="speed-row" id="speed-row"></div></div>
  <button class="card neighbor" id="neighbor-btn" title="Meet June, your neighbor"><canvas id="neighbor-portrait" class="neighbor-avatar" width="72" height="72"></canvas><div><div class="neighbor-title">June is nearby</div><div class="neighbor-sub" id="neighbor-status">A friend in the making</div></div><i class="neighbor-dot"></i></button>
</section>
<div class="lot-label"><i></i><span id="lot-label-text">LIVE MODE · THE BLOOM HOUSEHOLD</span></div>
<div class="camera-tools" id="camera-tools"></div>
<div class="hud">
  <div class="hud-main">
    <section class="resident"><div class="portrait-wrap"><canvas id="portrait" width="152" height="192"></canvas></div><div class="resident-info"><div class="mood-label" id="mood-label"></div><h2 id="resident-name">Mara Bloom</h2><div class="traits">Creative soul · People person</div><div class="money" id="money"></div></div></section>
    <section class="needs"><div class="section-heading">A little care goes a long way<span class="small-note" id="needs-note">Click a need for help</span></div><div class="need-grid" id="needs"></div></section>
    <section class="queue-panel" id="queue-panel"></section>
  </div>
  <div class="hud-bottom"><div class="mode-group"><button class="mode-btn active" id="live-btn"></button><button class="mode-btn" id="buy-btn"></button><button class="mode-btn" id="life-btn"></button></div><div class="bottom-tip" id="bottom-tip"><kbd>Space</kbd> pause &nbsp;·&nbsp; <kbd>1–3</kbd> speed &nbsp;·&nbsp; Drag to explore</div><button class="autonomy" id="autonomy-btn" title="Let Mara take care of low needs"><span class="toggle"><i></i></span>Free will <b id="autonomy-label">off</b></button></div>
</div>
<div id="catalog" class="catalog hidden"></div><div id="build-status" class="build-status hidden"></div><div id="context" class="context hidden"></div><div id="tooltip" class="tooltip hidden"></div><div id="toasts" class="toast-stack"></div>
<div id="pad-cursor" class="pad-cursor hidden" aria-hidden="true"><i></i></div>
<div id="modal-wrap" class="modal-wrap hidden"><div id="modal" class="modal" role="dialog" aria-modal="true"></div></div>
<div id="party-banner" class="party-banner hidden"></div><canvas class="confetti-canvas" id="confetti"></canvas>
<script type="module" src="./game.js"></script>
</body>
</html>
