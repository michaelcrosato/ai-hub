<!DOCTYPE html>
<!--
# Source Information
Date: 2026-10-29 07:48
Source game: Rock n' Roll Racing (1993). Original spiritual successor; no assets, code or names reused.
Game: Rock n Roll Rockets (title picked by a random number generator from 50 brainstormed riffs)
Tech: Three.js r180 (WebGPURenderer, no fallback; TSL for ink outlines), Rapier 3D 0.19.3 (rapier3d-compat), WebAudio, Gamepad API, AI Hub session.js 1.3.0 (race mode). Plain ES modules bundled into one HTML file by a small Node script.
Art Direction: Cel-shaded: toon gradient materials, inverted-hull ink outlines, hard sun shadows, flat-lit props.
Animation: Procedural rigid-part animation (wheel spin, suspension bob, body pitch/roll, head sway, flame flicker), pooled particle system, camera shake and hit-stop. No skeletal clips.
Audio: Everything code-written with WebAudio: 4 rock songs (distorted power chords, bass, drums, lead), synthesised sound effects, and Animalese-style gibberish voices for the announcer and drivers. No samples.
Online: AI Hub Session Protocol v1, race mode, 1 to 4 players, computer rivals fill empty seats. Nothing else touches the network.
Testing: Efficient and lightweight: headless Chrome with WebGPU (SwiftShader), the AI Hub harness, scripted screenshots.
Environment: Claude Code CLI (headless); Linux; browser unknown
Model: Anthropic, claude-sonnet-5-5, reasoning effort medium
Usage: unknown (the agent cannot see token or cost counters)
# Testing Feedback
Issues caught by testing: 3 real (key taps lost between frames at low frame rates; a HUD cache bug and a rival-taunt crash caught on review before the first run) plus 1 false alarm (blank WebGPU screenshots are a headless capture limit, not a rendering bug). Critical / game-breaking: 1 (the lost-input bug made menus unusable at low fps). Most helpful: the AI Hub harness plus a fast-forward hook that steps the whole race simulation headlessly. Least helpful: plain page screenshots of the WebGPU canvas, which come back white.
# Engine Feedback
Liked most: Three.js WebGPU plus TSL makes cel shading easy (toon material plus an inverted-hull node material), and Rapier gives stable car-vs-wall and car-vs-car contact for free.
Stuck or guessed wrong: I guessed the white headless screenshots were over-bright lighting; it was the capture path. Render-target readback fixed it.
Had to build myself: arcade car handling, the track/spline builder, AI drivers, weapons, particles, audio synthesis, the whole menu/HUD layer and the AI Hub netcode.
Hardest part: testing WebGPU headlessly (software adapter, about 1 fps).
Remove or overhaul: nothing in the engines; the automatic WebGL fallback inside WebGPURenderer needs a clearer off switch.
One change: an official headless screenshot helper for WebGPU canvases.
# Prompt Feedback
Liked most: a clear goal, controller-first UX rules and the explicit attract-mode spec.
Confusing: Source information is requested in three places with slightly different lists; the hub README says WebGL fallback is welcome while this prompt says none.
Hardest: fitting a complete game with career, shop, AI and netcode into one pass.
One test I wish I had run: a real DualSense on a real GPU for feel and frame rate.
-->

<script>
/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

      this.f = ctx.createBiquadFilter(); this.f.type = 'lowpass'; this.f.frequency.value = 500;

      this.p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      this.o1.connect(this.f); this.o2.connect(this.f); this.f.connect(this.g);
      if (this.p) { this.g.connect(this.p); this.p.connect(sfxBus); } else this.g.connect(sfxBus);

    menu: { bpm: 126, root: 40, prog: [0, 0, 5, 7, 0, 0, 3, 7], gtr: 'X.xx.xx.X.xx.x.x', bass: [0, 0, 12, 0, 0, 12, 0, 7, 0, 0, 12, 0, 0, 12, 7, 5],
      kick: 'x...x...x..xx...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.xx',
      lead: [0, -1, 7, -1, 10, 7, -1, 5, 3, -1, 5, 7, -1, -1, 3, 0, 0, -1, 7, -1, 12, 10, -1, 7, 5, -1, 7, 10, -1, 12, 10, 7], leadBars: [4, 5, 6, 7] },
    scrap: { bpm: 142, root: 38, prog: [0, 0, 3, 5, 0, 0, 7, 5], gtr: 'X.xxX.xxX.xxX.x.', bass: [0, 0, 0, 12, 0, 0, 12, 0, 0, 0, 0, 12, 0, 12, 10, 7],
      kick: 'x..xx..xx..xx...', snare: '....x.......x..x', hat: 'xxxxxxxxxxxxxxxx',
      lead: [12, -1, 15, -1, 17, 15, -1, 12, 10, -1, 12, 15, -1, 17, 19, -1, 17, -1, 15, -1, 12, -1, 10, 12, 15, -1, -1, 12, 10, -1, 7, -1], leadBars: [2, 3, 6, 7] },
    glacier: { bpm: 152, root: 45, prog: [0, 8, 3, 7, 0, 8, 5, 7], gtr: 'X.x.xxX.x.xxx.x.', bass: [0, 12, 0, 12, 0, 12, 0, 12, 8, 20, 8, 20, 7, 19, 7, 19],
      kick: 'x...x..xx.x.x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.',
      lead: [24, -1, 19, 22, 24, -1, 27, -1, 26, -1, 22, 19, 22, -1, -1, -1, 24, 26, 27, -1, 31, -1, 27, 26, 24, -1, 22, -1, 19, -1, -1, -1], leadBars: [0, 1, 2, 3, 4, 5, 6, 7] },
    magma: { bpm: 164, root: 37, prog: [0, 0, 1, 0, 0, 0, 6, 5], gtr: 'XxxXxxXxXxxXxxXx', bass: [0, 0, 12, 0, 0, 12, 0, 0, 0, 0, 12, 0, 1, 1, 13, 1],
      kick: 'x.xxx.xxx.xxx.x.', snare: '....x.......x.x.', hat: 'x.x.x.x.x.x.xxxx',
      lead: [12, 13, 12, -1, 8, 12, -1, 13, 12, -1, 8, 7, -1, 8, 12, -1, 15, 13, 12, -1, 13, 12, 8, -1, 12, -1, 13, 15, 17, -1, 13, -1], leadBars: [4, 5, 6, 7] },
  };

  function drum(kind, t, vol) {

      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.22);
    } else {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf;
      const f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = kind === 's' ? 'bandpass' : 'highpass'; f.frequency.value = kind === 's' ? 1800 : 7000;
      const dur = kind === 's' ? 0.16 : 0.04;
      g.gain.setValueAtTime(vol * (kind === 's' ? 1 : 0.4), t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(f); f.connect(g); g.connect(musicBus); src.start(t, Math.random()); src.stop(t + dur + 0.02);
    }
  }
  function note(type, midi, t, dur, vol, dist, cut) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = mtof(midi);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    last.connect(g); g.connect(musicBus); o.start(t); o.stop(t + dur + 0.05);
  }
  function scheduleStep(s, t) {
    const so = song, bar = Math.floor(s / 16) % 8, i = s % 16, sd = 60 / so.bpm / 4;
    const root = so.root + so.prog[bar];
    if (so.kick[i] === 'x') drum('k', t, 0.75);
    if (so.snare[i] === 'x') drum('s', t, 0.5);
    if (so.hat[i] === 'x') drum('h', t, 0.3);
    const gx = so.gtr[i];
    if (gx !== '.') {
      const d = gx === 'X' ? sd * 3.2 : sd * 0.9, v = gx === 'X' ? 0.1 : 0.07;
      note('sawtooth', root + 12, t, d, v, true); note('sawtooth', root + 19, t, d, v, true); note('square', root + 24, t, d, v * 0.5, true);

  function tick() {
    if (!ctx || !song) return;

  const VOICES = {
    mc: { base: 105, type: 'sawtooth', rate: 0.062, form: 800, name: 'MC MEGAPHONE', color: '#ffd23f' },
    vex: { base: 215, type: 'square', rate: 0.052, form: 1400, name: 'VEX VOLT', color: '#ff4d6d' },
    granny: { base: 140, type: 'sawtooth', rate: 0.075, form: 600, name: 'GRANNY GRINDSTONE', color: '#b8f2e6' },
    chip: { base: 300, type: 'triangle', rate: 0.046, form: 1900, name: 'CHIP HAVOC', color: '#4cc9f0' },
    rival: { base: 170, type: 'square', rate: 0.058, form: 1000, name: 'RIVAL', color: '#c77dff' },
  };
  function say(voice, text) {
    const v = VOICES[voice] || VOICES.rival;
    if (!ensure()) return 0;
    let t = Math.max(ctx.currentTime + 0.02, voiceFree);
    if (t - ctx.currentTime > 6) return 0;

      if ('.!?'.includes(c)) { t += v.rate * 4; continue; }
      if (code < 0 || code > 25) continue;
      const vowel = 'aeiou'.includes(c);
      const semis = ((code * 7) % 12) - 5 + (vowel ? 2 : 0) + (chars[i + 1] === '?' ? 4 : 0);
      const f = v.base * Math.pow(2, semis / 12), dur = v.rate * (vowel ? 1.5 : 0.9);
      const o = ctx.createOscillator(), bp = ctx.createBiquadFilter(), g = ctx.createGain();

      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(bp); bp.connect(g); g.connect(voiceBus); o.start(t); o.stop(t + dur + 0.03);
      t += v.rate * (vowel ? 1.1 : 0.85);
    }
    voiceFree = t + 0.15;
    return t - start;
  }
  const voiceBusy = () => ctx && voiceFree > ctx.currentTime + 1.2;

  return {
    ensure, applyVolumes, sfx, tone, noise, playSong, stopSong, say, voiceBusy, Engine, VOICES,
    mute() { muted = true; stopSong(); if (ctx) { try { master.gain.setTargetAtTime(0, ctx.currentTime, 0.4); } catch (e) { /* ignore */ } } },
    get ctx() { return ctx; },
    get now() { return ctx ? ctx.currentTime : 0; },
  };
})();

// ===== 02_input.js — controller-first input (Gamepad API) with keyboard/mouse mapped onto the same model =====
const Input = (() => {
  const keys = new Set(), prevKeys = new Set(), latch = new Set();
  let prevBtn = [], lastActivity = performance.now(), device = 'kb', padName = '';
  const rep = {}; // menu repeat timers
  const nav = { up: false, down: false, left: false, right: false, ok: false, back: false, menu: false, x: false, y: false, l: false, r: false };
  const act = { steer: 0, throttle: 0, brake: 0, missile: false, mine: false, nitro: false, jump: false, taunt: false };
  const GAMEKEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'Escape']);
  let pad = null, padSeen = false;

  addEventListener('keydown', (e) => {
    if (GAMEKEYS.has(e.code) || e.code === 'Backspace') e.preventDefault();
    keys.add(e.code); latch.add(e.code); lastActivity = performance.now(); device = 'kb';
  });
  addEventListener('keyup', (e) => { keys.delete(e.code); });
  addEventListener('blur', () => keys.clear());
  addEventListener('mousedown', () => { lastActivity = performance.now(); Aud.ensure(); });
  addEventListener('mousemove', () => { lastActivity = performance.now(); });
  addEventListener('gamepadconnected', (e) => { padSeen = true; padName = e.gamepad.id; });

  const kd = (...c) => c.some((k) => keys.has(k) || latch.has(k));
  const kp = (...c) => c.some((k) => (keys.has(k) && !prevKeys.has(k)) || latch.has(k));

  function dz(x, y) {
    const m = Math.hypot(x, y), d = S.deadzone;
    if (m < d) return [0, 0];
    const k = (m - d) / (1 - d) / m; return [x * k, y * k];
  }

  function readPad() {
    pad = null;
    const list = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of list) if (p && p.connected) { pad = p; break; }
    return pad;
  }
  const down = (i) => !!(pad && pad.buttons[i] && pad.buttons[i].pressed);
  const edge = (i) => down(i) && !prevBtn[i];

  function update(dt) {
    readPad();
    let ax = 0, ay = 0;
    if (pad) {
      [ax, ay] = dz(pad.axes[0] || 0, pad.axes[1] || 0);
      if (S.invertH) ax = -ax;
      if (S.invertV) ay = -ay;
      let any = Math.abs(ax) + Math.abs(ay) > 0.5 || Math.hypot(pad.axes[2] || 0, pad.axes[3] || 0) > 0.6;
      for (let i = 0; i < pad.buttons.length; i++) if (edge(i)) any = true;
      if (any) { lastActivity = performance.now(); device = 'pad'; padName = pad.id; }
    }
    const dpad = { u: down(12), d: down(13), l: down(14), r: down(15) };
    // ---- menu navigation with auto-repeat ----
    const want = {
      up: kd('ArrowUp', 'KeyW') || dpad.u || ay < -0.6,
      down: kd('ArrowDown', 'KeyS') || dpad.d || ay > 0.6,
      left: kd('ArrowLeft', 'KeyA') || dpad.l || ax < -0.6,
      right: kd('ArrowRight', 'KeyD') || dpad.r || ax > 0.6,
    };
    for (const k of ['up', 'down', 'left', 'right']) {
      nav[k] = false;
      if (want[k]) {
        if (rep[k] === undefined) { rep[k] = 0.38; nav[k] = true; }
        else { rep[k] -= dt; if (rep[k] <= 0) { rep[k] = 0.1; nav[k] = true; } }
      } else rep[k] = undefined;
    }
    nav.ok = kp('Enter', 'Space', 'NumpadEnter') || edge(0);
    nav.back = kp('Backspace') || edge(1);
    nav.x = kp('KeyX', 'KeyE') || edge(2);
    nav.y = kp('KeyY', 'KeyQ') || edge(3);
    nav.l = kp('KeyQ', 'PageUp') || edge(4);
    nav.r = kp('KeyE', 'PageDown') || edge(5);
    // Options opens/closes the menu; ignored while Create (button 8) is held (that chord belongs to the hub)
    nav.menu = kp('Escape') || (edge(9) && !down(8));
    // ---- driving ----
    const trig = (i) => (pad && pad.buttons[i] ? Math.max(pad.buttons[i].value || 0, pad.buttons[i].pressed ? 1 : 0) : 0);
    let steer = (kd('ArrowLeft', 'KeyA') ? 1 : 0) - (kd('ArrowRight', 'KeyD') ? 1 : 0);
    if (pad) { steer = steer || -ax || ((dpad.l ? 1 : 0) - (dpad.r ? 1 : 0)); }
    let thr = Math.max(kd('ArrowUp', 'KeyW') ? 1 : 0, trig(7), trig(0));
    let brk = Math.max(kd('ArrowDown', 'KeyS') ? 1 : 0, trig(6));
    if (pad && thr === 0 && brk === 0) { if (ay < -0.6) thr = 1; else if (ay > 0.6) brk = 1; }
    act.steer = clamp(steer, -1, 1); act.throttle = thr; act.brake = brk;
    act.missile = kd('KeyJ', 'KeyZ', 'ControlLeft') || down(2);
    act.mine = kd('KeyK', 'KeyX') || down(1);
    act.nitro = kd('ShiftLeft', 'ShiftRight', 'KeyL') || down(5);
    act.jump = kd('Space') || down(4);
    act.taunt = kd('KeyT') || down(3);
    for (const k of prevKeys) if (!keys.has(k)) prevKeys.delete(k);
    for (const k of keys) prevKeys.add(k);
    latch.clear();
    prevBtn = pad ? pad.buttons.map((b) => b.pressed) : [];
  }

  function rumble(strong, weak, ms) {
    if (!S.rumble || !pad || !pad.vibrationActuator) return;
    try { pad.vibrationActuator.playEffect('dual-rumble', { startDelay: 0, duration: ms, weakMagnitude: weak, strongMagnitude: strong }); } catch (e) { /* unsupported */ }
  }

  return {
    nav, act, update, rumble, kd, anyHeld: () => keys.size > 0 || !!(pad && pad.buttons.some((b) => b.pressed)),
    get idleMs() { return performance.now() - lastActivity; },
    poke() { lastActivity = performance.now(); },
    get device() { return device; },
    get hasPad() { return !!pad; }, get padSeen() { return padSeen; }, get padName() { return padName; },
    get raw() { return { keys: [...keys], pad: !!pad }; },
  };
})();

// ----- path: closed Catmull-Rom spline resampled at uniform arc length -----
function buildPath(def) {

    for (let k = 0; k < 24; k++) { const t = k / 24; raw.push([cr(a[0], b[0], c[0], d[0], t), cr(a[1], b[1], c[1], d[1], t)]); }
  }

    const s = i * ds;

    pts.push({ x: lerp(p[0], q[0], f), z: lerp(p[1], q[1], f), s });

    const a = pts[(i + N - 1) % N], b = pts[(i + 1) % N];
    let tx = b.x - a.x, tz = b.z - a.z; const m = Math.hypot(tx, tz) || 1; tx /= m; tz /= m;
    pts[i].tx = tx; pts[i].tz = tz;
    pts[i].rx = -tz; pts[i].rz = tx; // right-of-travel normal in x/z (positive lat = right)
  }
  for (let i = 0; i < N; i++) { // signed curvature (heading change per metre), smoothed
    const a = pts[i], b = pts[(i + 3) % N];

    .map((_, i, b) => { let t = 0; for (let o = -4; o <= 4; o++) t += b[(i + o + N) % N]; return t / 9; });
  const swl = soft(wl), swr = soft(wr);

}
// nearest sample to (x,z): windowed around a hint, or global when hint < 0

// ----- pickups: deterministic from the track seed so every networked copy agrees -----
function makePickups(def, path) {
  const r = mulberry(def.seed * 7919), out = [];
  const types = ['cash', 'ammo', 'cash', 'repair', 'cash', 'nitro', 'ammo', 'cash', 'mine', 'repair'];

    const s = ((c + 0.5) / clusters + (r() - 0.5) * 0.02) * path.L;

      out.push({ id: out.length, type: base, x: p.x, z: p.z, alive: true, back: 0 });

}

  const out = [];

  }

}

// ===== 04_world.js — renderer, cel-shading toolkit, and the track-to-world builder (visuals + Rapier colliders) =====
const Gfx = {
  renderer: null, grad: null, outMats: new Map(),
  async init(canvas) {
    if (!navigator.gpu) throw new Error('WebGPU is not available in this browser.');
    const r = new THREE.WebGPURenderer({ canvas, antialias: true, forceWebGL: false });
    this.test = new URLSearchParams(location.search).has('test');
    r.setPixelRatio(this.test ? 0.3 : Math.min(devicePixelRatio || 1, 2));
    r.setSize(innerWidth, innerHeight, false);
    await r.init();

    r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;

    addEventListener('resize', () => { r.setPixelRatio(this.test ? 0.3 : Math.min(devicePixelRatio || 1, 2)); r.setSize(innerWidth, innerHeight, false); Gfx.onResize && Gfx.onResize(); });
    return r;
  },
  toon(color, o = {}) {

  outlineMat(t, color = 0x120a1a) {

      const m = new MeshBasicNodeMaterial({ color, side: THREE.BackSide });

  },
  // inverted-hull ink outline, the signature of the cel look
  ink(mesh, t = 0.06, color) {

function disposeScene(root) {
  root.traverse((o) => {
    if (o.geometry && !o.userData.keepGeo) o.geometry.dispose();

    this.cd = { m: 0, mi: 0, jump: 0, ramp: 0, taunt: 0 };

    this.grounded = true; this.gripMul = 1; this.slickT = 0; this.flash = 0; this.lastSpeed = 0; this.steerVis = 0; this.smokeT = 0;
    this.prog = 0; this.lapCount = -1; this.lastS = 0; this.idx = 0; this.lat = 0; this.finished = false; this.finishT = 0; this.laps = []; this.lapStart = 0; this.bestLap = Infinity;
    this.kills = 0; this.deaths = 0; this.cash = 0; this.wrongT = 0; this.stuckT = 0; this.reverseT = 0; this.lane = 0; this.prev = { nitro: false, missile: false, mine: false, jump: false, taunt: false };
    this.rank = 1; this.lastHitBy = -1; this.sweepCd = 0; this.input = { steer: 0, throttle: 0, brake: 0, missile: false, mine: false, nitro: false, jump: false, taunt: false };
    this.samples = []; this.remoteDead = false; this.remoteBoost = false;

  }
  initBody(local) {
    const R = RAPIER, race = this.race;
    if (local) {
      this.body = race.phys.createRigidBody(R.RigidBodyDesc.dynamic().setTranslation(this.pos.x, 0.6, this.pos.z).enabledRotations(false, true, false).setLinearDamping(0.05).setAngularDamping(0.5).setCcdEnabled(true).setCanSleep(false));

    } else {
      this.body = race.phys.createRigidBody(R.RigidBodyDesc.kinematicPositionBased().setTranslation(this.pos.x, 0.6, this.pos.z));
      this.col = race.phys.createCollider(R.ColliderDesc.cuboid(1.05, 0.5, 1.95).setFriction(0.0).setRestitution(0.28), this.body);
    }
    this.body.setRotation({ x: 0, y: Math.sin(this.yaw / 2), z: 0, w: Math.cos(this.yaw / 2) }, true);
  }
  // a computer rival whose host left is adopted by this copy: swap the kinematic stand-in for a real driven body
  makeLocal() {

    const l = this.samples[this.samples.length - 1];
    this.race.phys.removeRigidBody(this.body);
    this.local = true; this.ai = true; this.owner = this.race.net ? this.race.net.me : this.owner;

// ----- AI driver: follows the racing line, brakes for corners, hunts with weapons -----
function aiDrive(car, race, dt) {
  const path = race.path, inp = car.input, st = car.st;
  const sp = Math.max(0, car.vF), sk = car.skill * (race.attract ? 1.0 : race.aiLevel);
  const curS = path.pts[car.idx].s;
  const look = 9 + sp * 0.33;
  // lane preference with a lazy weave; head for nearby pickups
  let lane = car.lane + Math.sin(race.clock * 0.4 + car.uid) * 2.2;
  for (const p of race.pickups) {
    if (!p.alive) continue;
    const pn = Math.hypot(p.x - car.pos.x, p.z - car.pos.z);
    if (pn < 38 && pn > 8 && (p.type !== 'mine' || car.ammo.mi < 3)) {
      const dx = p.x - car.pos.x, dz = p.z - car.pos.z, fwd = dx * Math.sin(car.yaw) + dz * Math.cos(car.yaw);
      if (fwd > 6) { const m = nearestOnPath(path, p.x, p.z, car.idx); lane = m.lat * 0.9; break; }
    }
  }
  const lim = path.half - 4.2; lane = clamp(lane, -lim, lim);
  const tgt = pathAt(path, curS + look, lane);
  const dx = tgt.x - car.pos.x, dz = tgt.z - car.pos.z;
  const want = Math.atan2(dx, dz), diff = angDiff(car.yaw, want);
  let steer = clamp(diff * 2.4, -1, 1);
  // corner speed from curvature ahead
  let kmax = 0;
  for (let d = 4; d < 28 + sp * 1.2; d += 5) kmax = Math.max(kmax, Math.abs(pathAt(path, curS + d, 0).k));
  const vCorner = kmax > 0.003 ? Math.max(15, (1 / kmax) * st.turn * 0.78) : 999;
  const vTar = Math.min(st.vmax * (0.84 + 0.14 * sk), vCorner * (0.9 + 0.12 * sk));
  inp.steer = steer;
  if (car.reverseT > 0) { car.reverseT -= dt; inp.throttle = 0; inp.brake = 1; inp.steer = -steer; }
  else {
    inp.throttle = sp < vTar ? 1 : 0; inp.brake = sp > vTar + 7 ? clamp((sp - vTar) / 25, 0.3, 1) : 0;
    if (race.clock > 1.5 && car.speed < 2.5 && !car.frozen) { car.stuckT += dt; if (car.stuckT > 1.1) { car.stuckT = 0; car.reverseT = 0.9; } } else car.stuckT = 0;
  }
  inp.nitro = false; inp.missile = false; inp.mine = false; inp.jump = false; inp.taunt = false;
  if (car.cheat) { car.ammo.m = 9; car.ammo.mi = 9; car.ammo.n = 4; car.ammo.j = 3; }
  // weapons
  let tgtCar = null, best = 1e9;
  for (const o of race.cars) {
    if (o === car || !o.alive) continue;
    const ox = o.pos.x - car.pos.x, oz = o.pos.z - car.pos.z, d = Math.hypot(ox, oz), fwd = ox * Math.sin(car.yaw) + oz * Math.cos(car.yaw);
    const ang = Math.abs(angDiff(car.yaw, Math.atan2(ox, oz)));
    if (fwd > 6 && d < 62 && ang < 0.16 && d < best) { best = d; tgtCar = o; }
    if (fwd < -4 && d < 14 && Math.abs(ox * Math.cos(car.yaw) - oz * Math.sin(car.yaw)) < 5 && car.ammo.mi > 0 && car.cd.mi <= 0 && Math.random() < 0.05) inp.mine = true;
  }
  if (tgtCar && car.cd.m <= 0 && car.ammo.m > 0 && Math.random() < 0.06 * (0.5 + sk)) inp.missile = true;
  if (kmax < 0.004 && car.ammo.n > 0 && car.boostT <= 0 && sp > 25 && Math.random() < 0.012 && car.reverseT <= 0) inp.nitro = true;

  for (const h of race.hazards) {
    if (h.type !== 'lava') continue;
    const hx = h.x - car.pos.x, hz = h.z - car.pos.z, d = Math.hypot(hx, hz), fwd = hx * Math.sin(car.yaw) + hz * Math.cos(car.yaw);
    if (fwd > 0 && d < h.r + 7 && d > h.r - 1 && car.ammo.j >= 1 && car.grounded) inp.jump = true;
  }
  if (Math.random() < 0.0007 * dt * 60 && car.cd.taunt <= 0) inp.taunt = true;
}

  wrecked: ['And the crowd goes wild, you are toast!', 'That car is now a very expensive paperweight!'],

const REMOTE_DELAY = 0.13;

class FX {
  constructor(scene) {
    this.max = 900;
    this.mesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.5, 0), new THREE.MeshBasicMaterial({ color: 0xffffff }), this.max);
    this.mesh.frustumCulled = false; this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.p = []; this.cursor = 0; this.d = new THREE.Object3D(); this.c = new THREE.Color();
    for (let i = 0; i < this.max; i++) { this.p.push({ life: 0 }); this.d.position.set(0, -999, 0); this.d.scale.setScalar(0); this.d.updateMatrix(); this.mesh.setMatrixAt(i, this.d.matrix); this.mesh.setColorAt(i, this.c.set(0xffffff)); }

    this.shells = [];

      const m = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), new THREE.MeshBasicMaterial({ color: 0xffa51f, transparent: true, opacity: 0.8, depthWrite: false }));
      m.visible = false; scene.add(m); this.shells.push({ m, t: 0, dur: 0.5, r: 5 });
    }
    this.flash = new THREE.PointLight(0xffa040, 0, 90, 2); scene.add(this.flash); this.flashT = 0;
  }
  spawn(x, y, z, vx, vy, vz, life, color, size, grav = 0, drag = 0) {
    const p = this.p[this.cursor]; this.cursor = (this.cursor + 1) % this.max;
    p.x = x; p.y = y; p.z = z; p.vx = vx; p.vy = vy; p.vz = vz; p.life = p.max = life; p.size = size; p.grav = grav; p.drag = drag; p.color = color;
  }
  burst(x, y, z, n, speed, life, colors, size, grav = 9) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, e = Math.random() * 1.2, s = speed * (0.3 + Math.random() * 0.8);
      this.spawn(x, y, z, Math.cos(a) * Math.cos(e) * s, Math.sin(e) * s + speed * 0.3, Math.sin(a) * Math.cos(e) * s, life * (0.5 + Math.random() * 0.7), colors[i % colors.length], size * (0.5 + Math.random()), grav, 0.4);
    }
  }
  explosion(x, z, R) {
    this.burst(x, 1, z, 46, 22, 0.9, [0xffe08a, 0xff9f1c, 0xff4a12, 0x3a2a30], 0.9, 12);
    const s = this.shells.find((q) => !q.m.visible) || this.shells[0]; s.t = 0; s.dur = 0.45; s.r = R; s.m.visible = true; s.m.position.set(x, 1.2, z);

  update(dt) {

      if (p.life <= 0) { if (p.dead) continue; p.dead = true; d.position.set(0, -999, 0); d.scale.setScalar(0); d.updateMatrix(); this.mesh.setMatrixAt(i, d.matrix); continue; }

    }

  }
}

class Race {
  constructor(o) {
    this.opts = o; this.def = TRACKS[o.track]; this.laps = o.laps || this.def.laps; this.mode = o.mode || 'solo';
    this.attract = this.mode === 'attract'; this.online = !!o.net; this.net = o.net || null; this.aiLevel = o.aiLevel ?? 0.92;
    this.path = buildPath(this.def); this.world = buildWorld(this.def, this.path);
    this.scene = this.world.scene; this.phys = this.world.phys; this.hazards = this.world.hazards; this.pickups = this.world.pickups;
    this.camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 2, 1800);
    this.fx = new FX(this.scene);
    this.clock = this.online ? -9 : -3.4; this.acc = 0; this.cars = []; this.missiles = []; this.mines = []; this.uid = 0;
    this.paused = false; this.over = false; this.overT = 0; this.ended = false; this.focus = null; this.human = null;
    this.camPos = new THREE.Vector3(); this.camTgt = new THREE.Vector3(); this.shake = 0; this.hitStop = 0; this.countInt = 99;
    this.feed = []; this.popups = []; this.time = 0; this.lastLeader = -1; this.netT = 0; this.finishOrder = []; this.stats = { shots: 0, hits: 0, mines: 0, jumps: 0, boosts: 0 };
    this.lapNote = null; this.banner = null; this.padCd = new Map();
    this.cam = { dist: 1 };
    o.grid.forEach((cfg, i) => {
      const car = new Car(this, cfg); this.cars.push(car);
      const row = Math.floor(i / 2), col = i % 2, p = pathAt(this.path, this.path.L - 8 - row * 8.5 - col * 3, (col ? 1 : -1) * 4.4);
      car.setPose(p.x, p.z, p.yaw); car.trackUpdate(true); car.lapCount = -1; car.prog = car.lastS - this.path.L; car.lastSpeed = 0;
      car.input.throttle = 0;
      if (cfg.human) { this.human = car; this.focus = car; }
    });
    if (!this.focus) this.focus = this.cars[0];
    const f = this.focus; this.camTgt.set(f.pos.x, 0, f.pos.z); this.updateCamera(1, true);
    if (!this.attract && this.mode !== 'show') {

  }
  get playing() { return this.clock >= 0; }
  carById(id) { return this.cars.find((c) => c.id === id); }

  // ----- announcer / feed -----
  say(voice, text, who) {
    if (this.attract && Math.random() < 0.5) return;
    const dur = Aud.say(voice, text);
    HUD.subtitle(who || (Aud.VOICES[voice] || {}).name || 'MC MEGAPHONE', text, (Aud.VOICES[voice] || {}).color || '#ffd23f', Math.max(2.4, dur + 1.1));
  }

  // ----- the frame -----
  update(dt) {

      t.style.display = 'block'; t.style.left = ((v.x * 0.5 + 0.5) * W) + 'px'; t.style.top = ((-v.y * 0.5 + 0.5) * H) + 'px';
      t.firstChild.style.color = car.seat >= 0 ? SEAT_COLORS[car.seat % 4] : '#fff';
      t.querySelector('i').style.width = (clamp(car.hp / car.st.hp, 0, 1) * calcPx(5)) + 'px';
    }
  },
};
const calcPx = (u) => u * Math.min(innerWidth / 100, innerHeight / 56.2);

// ----- generic controller-first menu -----
const UI = {
  root: null, cur: null, stack: [], toastT: 0,
  init() { this.root = $('ui'); },
  show(def, opts = {}) {
    if (!opts.push) this.stack = []; else if (this.cur) this.stack.push(this.cur);
    this.cur = { def, idx: def.start || 0, el: null };
    this.render(true);
    Input.poke();
  },
  pop() { const prev = this.stack.pop(); if (prev) { this.cur = prev; this.render(true); } else this.hide(); },
  hide() { this.cur = null; this.stack = []; this.root.innerHTML = ''; },
  get active() { return !!this.cur; },
  items() { const d = this.cur.def; return d.items ? d.items() : []; },
  render(anim) {
    const s = this.cur, d = s.def, items = this.items(), g = glyph();
    if (s.idx >= items.length) s.idx = Math.max(0, items.length - 1);
    const rows = items.map((it, i) => {
      let val = '';
      if (it.t === 'slider') { const v = it.get(), f = (v - it.min) / (it.max - it.min); val = `<span class="sl"><i style="width:${f * 100}%"></i></span>${it.fmt ? it.fmt(v) : Math.round(v * 100) + '%'}`; }
      else if (it.t === 'toggle') val = it.get() ? '◀ ON ▶' : '◀ OFF ▶';
      else if (it.t === 'choice') val = `◀ ${esc(it.opts[it.get()])} ▶`;
      else if (it.val !== undefined) val = typeof it.val === 'function' ? it.val() : it.val;
      const body = it.html ? it.html() : `<span>${esc(it.label)}${it.desc ? `<small>${esc(typeof it.desc === 'function' ? it.desc() : it.desc)}</small>` : ''}</span>`;
      return `<div class="row ${i === s.idx ? 'sel' : ''} ${it.dis ? 'dis' : ''}" data-i="${i}">${body}<span class="val">${val}</span></div>`;
    }).join('');
    const hints = (d.hints || [`<b>${g.ok}</b> Select`, d.onBack ? `<b>${g.back}</b> Back` : '', `<b>▲▼</b> Move`, items.some((i) => i.t) ? '<b>◀▶</b> Adjust' : '']).filter(Boolean).join('</span><span>');
    const html = d.raw ? d.raw() : `<div class="panel ${d.cls || ''}">${d.title ? `<h1>${esc(d.title)}</h1>` : ''}${d.sub ? `<h2>${esc(typeof d.sub === 'function' ? d.sub() : d.sub)}</h2>` : ''}${d.body ? d.body() : ''}${rows ? `<div class="list">${rows}</div>` : ''}<div class="hint"><span>${hints}</span></div></div>${d.side ? d.side() : ''}`;
    this.root.innerHTML = `<div class="scr ${anim ? 'fade' : ''}">${html}</div>`;
    this.root.querySelectorAll('.row').forEach((el) => {
      el.addEventListener('mouseenter', () => { if (s.idx !== +el.dataset.i) { s.idx = +el.dataset.i; Aud.sfx('move'); this.render(); } });
      el.addEventListener('click', () => { s.idx = +el.dataset.i; this.activate(); });
    });
    if (d.after) d.after(this.root.firstChild);
    const sel = this.root.querySelector('.row.sel'); if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
  },
  move(dir) {
    const s = this.cur, items = this.items(); if (!items.length) return;
    let i = s.idx;
    for (let k = 0; k < items.length; k++) { i = (i + dir + items.length) % items.length; if (!items[i].dis || items.every((x) => x.dis)) break; }
    if (i !== s.idx) { s.idx = i; Aud.sfx('move'); this.render(); }
  },
  adjust(dir) {
    const it = this.items()[this.cur.idx]; if (!it) return;
    if (it.t === 'slider') { const st = it.step || 0.1; it.set(clamp(Math.round((it.get() + dir * st) / st * 1000) / 1000 * st, it.min, it.max)); Aud.sfx('move'); this.render(); }
    else if (it.t === 'toggle') { it.set(!it.get()); Aud.sfx('move'); this.render(); }
    else if (it.t === 'choice') { it.set((it.get() + dir + it.opts.length) % it.opts.length); Aud.sfx('move'); this.render(); }
  },
  activate() {
    const it = this.items()[this.cur.idx]; if (!it) return;
    if (it.dis) { Aud.sfx('deny'); return; }
    if (it.t === 'toggle' || it.t === 'choice') { this.adjust(1); return; }
    if (it.t === 'slider') { this.adjust(1); return; }
    Aud.sfx('ok'); if (it.fn) it.fn();
  },
  refresh() { if (this.cur) this.render(); },
  update(dt) {
    const s = this.cur; if (!s) return;
    const n = Input.nav, d = s.def;
    if (d.tick) d.tick(dt);
    if (d.onNav && d.onNav(n)) return;
    if (n.up) this.move(-1);
    if (n.down) this.move(1);
    if (n.left) this.adjust(-1);
    if (n.right) this.adjust(1);
    if (n.ok) this.activate();
    if (n.back && d.onBack) { Aud.sfx('back'); d.onBack(); }
  },
  toast(text, ms = 2200) {
    const t = $('toast'); t.textContent = text; t.style.display = 'block'; clearTimeout(this.toastT); this.toastT = setTimeout(() => { t.style.display = 'none'; }, ms);
  },
};

// ----- the 3D showroom behind the menus -----
class Showroom {
  constructor() {
    this.def = TRACKS[0]; this.path = buildPath(this.def); this.world = buildWorld(this.def, this.path); this.scene = this.world.scene;
    this.camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 1, 1800); this.t = 0; this.car = null; this.key = '';
    const p = this.path.pts[Math.floor(this.path.N * 0.16)]; this.cx = p.x; this.cz = p.z;
    const plat = Gfx.mesh(new THREE.CylinderGeometry(6.5, 7, 0.6, 28), Gfx.toon(0x2a1d44), { ink: 0.08 }); plat.position.set(this.cx, 0.3, this.cz); this.scene.add(plat);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(6.6, 0.18, 6, 40), new THREE.MeshBasicMaterial({ color: 0xffd23f })); ring.rotation.x = Math.PI / 2; ring.position.set(this.cx, 0.62, this.cz); this.scene.add(ring);
    this.fx = new FX(this.scene);
  }
  setDriver(key, ups) {
    const sig = key + JSON.stringify(ups || 0); if (sig === this.key) return; this.key = sig;
    if (this.car) this.scene.remove(this.car);
    const d = DRIVERS[key]; this.car = buildCarModel(d.shape, d.color, d.accent); this.car.position.set(this.cx, 1.25, this.cz);
    this.car.traverse((o) => { if (o.isMesh && !o.userData.isInk) o.castShadow = true; });
    this.scene.add(this.car);
  }
  update(dt) {
    this.t += dt;
    const a = this.t * 0.35 + 0.6, r = 21;
    if (this.car) { this.car.rotation.y = this.t * 0.5; this.car.userData.wheels.forEach((w) => { w.spin.rotation.x += dt * 6; }); this.car.userData.head.rotation.y = Math.sin(this.t * 1.3) * 0.4; }
    this.camera.aspect = innerWidth / innerHeight; this.camera.updateProjectionMatrix();
    this.camera.position.set(this.cx + Math.cos(a) * r, 9, this.cz + Math.sin(a) * r);
    this.camera.lookAt(this.cx, 1.8, this.cz);
    this.camera.setViewOffset(innerWidth, innerHeight, -innerWidth * 0.17, 0, innerWidth, innerHeight);
    this.world.update(0, this.t, { x: this.cx, z: this.cz });
    Gfx.renderer.render(this.scene, this.camera);
  }
}

// ----- shared helpers -----
const careerDriver = () => DRIVERS[App.career ? App.career.driver : App.qr.driver];
const bar = (n, max = 5, next = -1) => `<span class="pips">${Array.from({ length: max }, (_, i) => `<i class="${i < n ? 'on' : i === next ? 'nx' : ''}"></i>`).join('')}</span>`;

function leaveRace() {
  if (App.race) { App.race.dispose(); App.race = null; }

function rivalGrid(raceIdx, season, aiLevel) {
  const r = mulberry(raceIdx * 31 + season * 7 + 3), pool = [...RIVALS];
  const sel = []; while (sel.length < 3) sel.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
  const lvl = clamp(Math.floor(raceIdx * 0.7 + season * 1.4 + 0.5), 0, 5), keys = Object.keys(DRIVERS);
  return sel.map((rv, i) => ({ name: rv.name, drv: DRIVERS[keys[(raceIdx + i) % 3]], color: rv.color, accent: rv.accent, shape: rv.shape, voice: rv.voice, skill: rv.skill * (aiLevel / 0.92),
    ups: { engine: lvl, tires: lvl, armor: lvl, missile: lvl, mine: lvl, nitro: lvl }, ai: true, local: true }));
}
function startRace(o) {
  App.lastOpts = o; leaveRace(); UI.hide(); HUD.show(true); HUD.clear();
  const rv = rivalGrid(o.track + (o.seed || 0), o.season || 0, o.aiLevel ?? 0.92);
  const dk = o.driver, d = DRIVERS[dk];
  const me = { name: o.attract ? 'DEMO ' + d.name : d.name, drv: d, color: d.color, accent: d.accent, shape: d.shape, voice: d.voice, ups: o.ups, ai: !!o.attract, human: !o.attract, cheat: !!o.attract, local: true };
  const grid = [rv[0], rv[1], me, rv[2]].map((c, i) => ({ ...c, id: i }));
  const race = new Race({ track: o.track, laps: o.laps, grid, mode: o.attract ? 'attract' : 'solo', aiLevel: o.aiLevel ?? 0.92 });
  race.ctx = o; App.race = race; App.state = o.attract ? 'attract' : 'race';
  if (o.attract) { race.focus = race.cars[2]; race.cars.forEach((c) => { c.ups = null; }); }
  race.onOver = onRaceOver; Aud.playSong(race.def.song);
  if (o.attract) { race.cars.forEach((c) => { if (c.cheat) { c.st.hp = 400; c.hp = 400; } }); }
}

function onRaceOver(race) {
  if (App.state === 'attract') { attractNext(); return; }
  const o = race.ctx, me = race.human, order = race.order, place = me.rank;
  const pts = [10, 6, 3, 1], season = o.season || 0, mult = 1 + 0.5 * season;
  const res = { track: race.def.name, place, rows: order.map((c, i) => ({ name: c.name, me: c === me, color: c.color, time: c.finished ? c.finishT : null, kills: c.kills, best: c.bestLap, pts: pts[i] || 0 })), prize: 0, cash: Math.round(me.cash), kills: me.kills, career: !!o.career };
  if (o.career) {
    res.prize = Math.round([1000, 600, 350, 150][place - 1] * mult); res.total = res.prize + res.cash;
    const cr = App.career; cr.money += res.total; cr.raceNo++; order.forEach((c, i) => { cr.pts[c.name] = (cr.pts[c.name] || 0) + (pts[i] || 0); });

    cls: 'wide', title: 'CHOOSE YOUR DRIVER', sub: 'Left and right to look, ' + g.ok + ' to sign the waiver', onBack: () => mainMenu(),
    body: () => `<div class="cards">${keys.map((k, n) => { const d = DRIVERS[k]; return `<div class="card ${n === i ? 'sel' : ''}"><div class="nm">${esc(d.name)}</div><div class="cr">${esc(d.car)} — ${esc(d.perk)}</div>${Object.entries(d.stats).map(([s, v]) => `<div class="stat"><span>${s}</span>${bar(v)}</div>`).join('')}<div class="bio">${esc(d.bio)}</div></div>`; }).join('')}</div>`,
    hints: [`<b>${g.ok}</b> Choose`, `<b>${g.back}</b> Back`, '<b>◀▶</b> Look'],
    onNav: (n) => {
      if (n.left || n.right) { i = (i + (n.right ? 1 : keys.length - 1)) % keys.length; Aud.sfx('move'); showroomFor(keys[i]); Aud.say(DRIVERS[keys[i]].voice, DRIVERS[keys[i]].taunts[0]); UI.render(); return true; }
      if (n.ok) {
        Aud.sfx('ok'); App.career = { driver: keys[i], money: 600, ups: noUps(), raceNo: 0, season: 0, pts: {}, hist: [], wins: 0 }; saveCareer(); App.qr.driver = keys[i];
        careerHub(); return true;
      }
      return false;
    },
    after: (el) => el.querySelectorAll('.card').forEach((c, n) => c.addEventListener('click', () => { if (n === i) { App.career = { driver: keys[i], money: 600, ups: noUps(), raceNo: 0, season: 0, pts: {}, hist: [], wins: 0 }; saveCareer(); careerHub(); } else { i = n; UI.render(); showroomFor(keys[i]); } })),
  };
  UI.show(def); showroomFor(keys[0]);
}

function careerHub() {
  const cr = App.career, g = glyph(); App.state = 'menu';
  const next = TRACKS[Math.min(cr.raceNo, TRACKS.length - 1)];
  showroomFor(cr.driver);
  UI.show({
    title: SEASON_NAMES[cr.season % SEASON_NAMES.length].toUpperCase(), sub: `${careerDriver().name} · Bank ${money(cr.money)} · Wins ${cr.wins}`, onBack: () => mainMenu(),
    body: () => `<div class="info" style="flex:none;margin-bottom:.8em"><p>${TRACKS.map((t, n) => `${n < cr.raceNo ? '✔' : n === cr.raceNo ? '➤' : '○'} <b>${esc(t.name)}</b>${cr.hist[n] ? ' — placed ' + cr.hist[n] : ''}`).join('<br>')}</p></div>`,
    items: () => [
      { label: `RACE: ${next.name.toUpperCase()}`, desc: next.blurb, fn: () => briefing({ track: cr.raceNo, laps: 3, driver: cr.driver, ups: cr.ups, aiLevel: 0.9 + 0.04 * cr.season, season: cr.season, seed: cr.season * 5, career: true, back: careerHub }), dis: cr.raceNo >= TRACKS.length },
      { label: 'GARAGE', desc: 'Spend money. Add horsepower. Subtract rivals.', fn: () => garage(() => careerHub()) },
      { label: 'STANDINGS', fn: standings },
      ...(cr.raceNo >= TRACKS.length ? [{ label: 'SEASON FINALE', fn: championScreen }] : []),
      { label: 'MAIN MENU', fn: () => mainMenu() },
    ],
    hints: [`<b>${g.ok}</b> Select`, `<b>${g.back}</b> Menu`, '<b>▲▼</b> Move'],
  });
}
function standings() {
  const cr = App.career, rows = Object.entries(cr.pts).sort((a, b) => b[1] - a[1]), me = careerDriver().name;
  UI.show({ title: 'STANDINGS', sub: 'Points: 10 / 6 / 3 / 1', onBack: () => careerHub(),
    body: () => rows.length ? `<table class="table"><tr><th></th><th>DRIVER</th><th class="r">PTS</th></tr>${rows.map(([n, p], i) => `<tr class="${n === me ? 'me' : ''}"><td>${i + 1}</td><td>${esc(n)}</td><td class="r">${p}</td></tr>`).join('')}</table>` : '<div class="info"><p>No races run yet. Everybody is equally undefeated.</p></div>',
    items: () => [{ label: 'Back', fn: () => careerHub() }] });
}

function garage(back) {
  const cr = App.career, d = DRIVERS[cr.driver];
  const stat = () => carStats(d, cr.ups);
  UI.show({
    cls: 'wide', title: 'GARAGE', sub: () => `Bank ${money(cr.money)} — ${d.car}`, onBack: back,
    items: () => [...UPGRADES.map((u) => {
      const lv = cr.ups[u.key], cost = UP_COST[lv];
      return { label: u.name, desc: u.desc, html: () => `<span>${u.icon} ${u.name}<small>${esc(u.desc)}</small></span>${bar(lv, UP_MAX, lv < UP_MAX && cr.money >= cost ? lv : -1)}`, val: lv >= UP_MAX ? 'MAXED' : money(cost), dis: false,
        fn: () => { if (lv >= UP_MAX) { Aud.sfx('deny'); UI.toast('Already maxed. Show-off.'); return; } if (cr.money < cost) { Aud.sfx('deny'); UI.toast('Not enough cash. Go wreck somebody.'); return; } cr.money -= cost; cr.ups[u.key]++; saveCareer(); Aud.sfx('buy'); Aud.say('mc', 'Sweet upgrade!'); UI.refresh(); } };
    }), { label: 'Done', fn: back }],
    body: () => { const s = stat(); return `<div class="info" style="flex:none;margin-bottom:.6em"><p>Top speed <b>${Math.round(s.vmax * 2.237)} mph</b> · Armor <b>${s.hp}</b> · Missile dmg <b>${Math.round(s.mDmg)}</b> (${s.mCap} rack) · Mines <b>${s.nCap}</b> · Nitro tanks <b>${s.bCap}</b></p></div>`; },
  });
  showroomFor(cr.driver, cr.ups);
}

function howTo() {
  const g = glyph();
  UI.show({
    cls: 'full', title: 'HOW TO PLAY', sub: 'The camera never turns. You do.', onBack: () => mainMenu(),
    body: () => `<div class="split"><div class="info"><h3>CONTROLLER (DUALSENSE)</h3><ul><li><kbd>R2</kbd> / <kbd>✕</kbd> gas &nbsp; <kbd>L2</kbd> brake & reverse</li><li><kbd>Left stick</kbd> / <kbd>D-pad</kbd> steer</li><li><kbd>□</kbd> fire missile &nbsp; <kbd>○</kbd> drop mine</li><li><kbd>R1</kbd> nitro boost &nbsp; <kbd>L1</kbd> jump jets</li><li><kbd>△</kbd> taunt &nbsp; <kbd>OPTIONS</kbd> pause / settings</li></ul><h3>KEYBOARD</h3><ul><li><kbd>W A S D</kbd> or arrows: drive</li><li><kbd>J</kbd> missile · <kbd>K</kbd> mine · <kbd>Shift</kbd> nitro · <kbd>Space</kbd> jump · <kbd>T</kbd> taunt · <kbd>Esc</kbd> pause</li></ul><h3>WEAPONS</h3><ul><li><b>Missiles</b> fly straight and hit hard. Jump jets hop you over incoming ones.</li><li><b>Mines</b> drop behind you and arm after a second. They do not care who drives over them.</li><li><b>Nitro</b> is a short, violent burst of speed. Tanks are finite.</li></ul></div>
    <div class="info"><h3>PICKUPS</h3><ul><li>🪙 <b>Cash</b> — pays for upgrades.</li><li>🔧 <b>Wrench</b> — repairs armor.</li><li>🚀 <b>Crate</b> — missiles. 💣 <b>Mine</b> — mines. 🔵 <b>Canister</b> — nitro.</li></ul><h3>TRACK HAZARDS</h3><ul><li><b>Boost pads</b> shove you forward. <b>Ramps</b> launch you — good for air time and dodging missiles.</li><li><b>Oil and ice</b> wreck your grip. Steer gently.</li><li><b>Ice crystals</b> and <b>sweepers</b> hit back. <b>Lava</b> burns: jump over it.</li></ul><h3>RACING</h3><ul><li>Finish all laps. Placings pay prize money; wrecks pay $100 bounties.</li><li>At zero armor you explode and respawn behind. Still counts as a kill for the other guy.</li><li>Garage upgrades carry through your career. Online rounds start everyone equal.</li></ul></div></div>`,
    items: () => [{ label: 'Back', fn: () => mainMenu() }], hints: [`<b>${g.ok}</b> Back`],
  });
}
function about() {
  const g = glyph();
  UI.show({
    cls: 'full', title: 'ABOUT & CREDITS', sub: 'Rock n Roll Rockets — a spiritual successor to Rock n\' Roll Racing', onBack: () => mainMenu(),
    body: () => `<div class="info">${ABOUT_LINES.map((l) => (l.startsWith('# ') ? `<h3>${esc(l.slice(2))}</h3>` : l ? `<p>${esc(l)}</p>` : '')).join('')}</div>`,
    items: () => [{ label: 'Back', fn: () => mainMenu() }], hints: [`<b>${g.ok}</b> Back`],
  });
}
function pauseMenu() {
  const g = glyph(), r = App.race;
  r.paused = r.mode === 'solo'; Input.poke();
  UI.show({
    title: 'PAUSED', sub: r.def.name, onBack: () => resumeRace(),
    items: () => [{ label: 'RESUME', fn: () => resumeRace() }, { label: 'SETTINGS', fn: pushSettings }, { label: 'RESTART RACE', fn: () => { const o = r.ctx; startRace(o); } }, { label: 'QUIT TO MENU', fn: () => { toMenu(); } }],
    hints: [`<b>${g.ok}</b> Select`, `<b>${g.menu}</b> Resume`],
  });
}
function resumeRace() { UI.hide(); if (App.race) App.race.paused = false; }

// ----- attract mode: kiosk loop of AI-driven races and a garage montage -----
const ATTRACT_CAPS = ['Fire MISSILES at anything that moves', 'Drop MINES behind you — rivals love surprises', 'NITRO: hit the gas harder than the gas pedal', 'Grab cash, repairs and ammo as you race', 'Jump jets hop you over lava and rockets', 'Win cash. Upgrade your car. Wreck better.'];
function startAttract() {
  App.attractIdx = (App.attractIdx + 1) % TRACKS.length; App.state = 'attract'; UI.hide();
  App.attractRaceT = 0;
  startRace({ track: App.attractIdx, laps: 2, driver: Object.keys(DRIVERS)[App.attractIdx % 3], ups: { engine: 2, tires: 2, armor: 2, missile: 2, mine: 2, nitro: 2 }, attract: true, aiLevel: 0.95, season: 0, seed: 40 });
  App.state = 'attract';
}
function attractNext() {
  // garage montage: buy a few upgrades on screen, then the next track
  const fake = { driver: Object.keys(DRIVERS)[App.attractIdx % 3], money: 99999, ups: noUps() };
  leaveRace(); App.state = 'attractGarage'; App.attractGarageT = 0;
  const saved = App.career; App.career = fake; App.demoSaved = saved;
  garage(() => {}); UI.cur.def.onBack = null; UI.cur.def.hints = ['<b>DEMO</b> Press any button to play'];
  UI.cur.def.tick = (dt) => {
    App.attractGarageT += dt;
    if (App.attractGarageT > 0.9 * (UI.cur.idx + 1) && UI.cur.idx < 5) { fake.ups[UPGRADES[UI.cur.idx].key] = 2 + Math.floor(Math.random() * 2); Aud.sfx('buy'); UI.cur.idx++; UI.render(); showroomFor(fake.driver, { ...fake.ups }); }
    if (App.attractGarageT > 7) { App.career = App.demoSaved; UI.hide(); startAttract(); }
  };
}
function exitAttract() {
  if (App.state === 'attractGarage') { App.career = App.demoSaved; }
  leaveRace(); UI.hide(); toTitle(); Aud.playSong('menu');
}

// ----- AI Hub session (race mode) -----
function ownerOfBots() { const ids = App.sess.players.filter((p) => !App.sess.left.has(p.id)).map((p) => p.id); return ids.length ? Math.min(...ids) : AIHub.me; }
async function startSession() {
  App.session = true;
  const info = await AIHub.connect({ mode: 'race', seats: [1, 4] });
  if (!info) { App.session = false; return false; }
  App.sess = { info, players: info.players, left: new Set(), finished: false, doneSent: false };
  const rng = AIHub.rng('track'), ti = Math.floor(rng() * TRACKS.length) % TRACKS.length;
  const keys = Object.keys(DRIVERS), me = info.me, bots = ownerOfBots();
  const net = { me, send: (d, o) => AIHub.send(d, o) };
  const total = 4, grid = [];
  const rv = rivalGrid(ti, 0, 0.9);
  for (let id = 0; id < total; id++) {
    const pl = info.players.find((p) => p.id === id);
    if (pl) {
      const d = DRIVERS[keys[id % 3]];
      grid.push({ id, name: pl.name, drv: d, color: new THREE.Color(pl.color).getHex(), accent: d.accent, shape: d.shape, voice: d.voice, ups: noUps(), local: id === me, human: id === me, owner: id, seat: id, ai: false });
    } else {
      const r = rv[(id - info.players.length) % 3];
      grid.push({ ...r, id, owner: bots, local: bots === me, ai: true, ups: noUps() });
    }
  }
  UI.hide(); HUD.show(true); HUD.clear();
  const race = new Race({ track: ti, laps: 3, grid, mode: 'net', net, aiLevel: 0.9 });
  race.ctx = { track: ti }; App.race = race; App.state = 'race';
  race.humanLocked = false; race.inputBlocked = false;
  race.onHumanFinish = (c) => { sessionResult(c); };
  AIHub.on('message', (d, from) => { if (App.race) App.race.onNetMessage(d, from); });
  AIHub.on('leave', ({ id }) => {
    App.sess.left.add(id);
    const c = race.carById(id); if (c && !c.gone) { c.gone = true; c.alive = false; c.model.visible = false; c.body.setEnabled(false); race.rankCars(); race.note(`${c.name} left the race`, '#cccccc'); }
    const o = ownerOfBots();
    for (const b of race.cars) if (!info.players.find((p) => p.id === b.id) && !b.local && o === me && !b.gone) { b.makeLocal(); }
  });
  AIHub.on('start', () => { Aud.ensure(); Aud.playSong(race.def.song); });
  AIHub.on('time-up', () => { if (!App.sess.doneSent) sessionResult(race.human, true); });
  AIHub.on('end', () => { App.ended = true; race.inputBlocked = true; Aud.mute(); HUD.banner('ROUND OVER', '#ffd23f'); });
  AIHub.ready();
  return true;
}
function sessionResult(c, timeUp) {
  if (App.sess.doneSent || !c) return; App.sess.doneSent = true;
  const stats = { 'wrecks': c.kills, 'best lap': isFinite(c.bestLap) ? fmtTime(c.bestLap).slice(0, 8) : '-', 'cash': Math.round(c.cash), 'deaths': c.deaths };
  const awards = []; if (c.kills >= 2) awards.push({ title: 'Wrecking crew', detail: `${c.kills} rivals wrecked` }); if (isFinite(c.bestLap) && c.laps.length) awards.push({ title: 'Quick lap', detail: fmtTime(c.bestLap) });
  if (c.finished && !timeUp) AIHub.result({ time: Math.round(c.finishT), stats, awards });
  else AIHub.result({ score: Math.max(0, Math.round(c.prog)), stats, awards });
}

// ----- main loop -----
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  try { tick(dt); } catch (e) { console.error(e); App.lastError = String(e && e.stack || e); }
}
function tick(dt) {
  Input.update(dt);
  const n = Input.nav, st = App.state;
  if (App.ended) return;
  // gate for touch-only devices
  if (App.gate) { if (Input.padSeen || Input.hasPad || Input.anyHeld()) { $('gate').style.display = 'none'; $('ui').style.zIndex = ''; App.gate = false; } else { UI.update(dt); return; } }
  // idle -> attract
  if ((st === 'title' || st === 'menu') && !App.session && Input.idleMs > 10000) { startAttract(); }
  if ((st === 'attract' || st === 'attractGarage') && Input.idleMs < 400) { exitAttract(); return; }
  // global menu key
  if (n.menu) {
    if (st === 'race') {
      if (!UI.active) { if (App.race.mode === 'net') UI.show(settingsScreen(() => UI.hide()), {}); else pauseMenu(); }
      else if (UI.cur.def.onBack) { Aud.sfx('back'); UI.cur.def.onBack(); }
    } else if (UI.active) {
      if (UI.cur.def.title === 'SETTINGS') { Aud.sfx('back'); UI.cur.def.onBack(); }
      else if (st === 'title' || st === 'menu' || st === 'results') { Aud.sfx('ok'); Aud.ensure(); pushSettings(); }
    }
  }
  UI.update(dt);
  const r = App.race;
  if (r && (st === 'race' || st === 'attract')) {
    if (r.mode === 'net') r.inputBlocked = UI.active || App.ended;
    if (r.mode === 'attract') attractCaption(r, dt);
    r.update(dt); HUD.update(r, dt);
    if (r.mode === 'net' && App.sess && r.human) {
      AIHub.progress({ score: Math.max(0, Math.round(r.human.prog)), label: `Lap ${clamp(r.human.lapCount + 1, 1, r.laps)} of ${r.laps}` });
      if (r.human.finished) { $('hubmsg').style.display = 'block'; $('hubmsg').textContent = 'FINISHED — waiting for the others'; }
    }
  } else if (App.show) App.show.update(dt);
}
function attractCaption(r, dt) {
  r.capT = (r.capT || 0) + dt;
  HUD.els.demoCap.textContent = ATTRACT_CAPS[Math.floor(r.capT / 5) % ATTRACT_CAPS.length];
  if (!r.camT || r.capT > r.camT) { r.camT = r.capT + 9; const alive = r.cars.filter((c) => c.alive); r.focus = (r.order && r.order[0] && Math.random() < 0.5) ? r.order[0] : (alive[Math.floor(Math.random() * alive.length)] || r.cars[2]); }
  if (r.focus && !r.focus.alive) r.focus = r.cars[2];
  if (r.clock > 70 && !r.over) { r.over = true; r.finalize(); }
}

AIHub.probe(() => {
  const r = App.race, st = App.state;
  const scene = App.ended || (r && r.ended) ? 'over' : r ? (r.clock < 0 ? 'ready' : 'play') : st === 'title' ? 'title' : 'menu';
  const a = Input.act;
  return { scene, menu: !!(UI.active && (st === 'race' || UI.cur.def.title === 'SETTINGS')), world: r ? r.time : App.show ? App.show.t : 0, input: { x: +(a.steer || 0).toFixed(2), y: +(a.throttle - a.brake).toFixed(2), fire: !!a.missile } };
});

// ----- boot -----
async function boot() {
  HUD.init(); UI.init();
  const touchOnly = navigator.maxTouchPoints > 0 && matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (touchOnly && !AIHub.active) {
    App.gate = true; const g = $('gate'); g.style.display = 'flex';
    g.innerHTML = `<h1 class="st">CONTROLLER OR KEYBOARD REQUIRED</h1><div style="font-size:calc(var(--u)*2.4);max-width:calc(var(--u)*60)">Rock n Roll Rockets is a 10-foot, controller-first racer. Connect a gamepad or keyboard to play — or fiddle with the settings.</div><button id="gateSet">SETTINGS</button>`;
    $('gateSet').onclick = () => { $('ui').style.zIndex = '70'; UI.show(settingsScreen(() => UI.hide()), {}); };
  }
  try {
    await RAPIER.init({});
    await Gfx.init($('c'));
  } catch (e) {
    const er = $('err'); er.style.display = 'flex';
    er.innerHTML = `<h1 class="st">WEBGPU REQUIRED</h1><div>${esc(e.message || e)}</div><div style="font-size:.7em;opacity:.8">Rock n Roll Rockets needs a WebGPU browser (current Chrome / Edge). There is intentionally no fallback.</div>`;
    if (AIHub.active) AIHub.fail('WebGPU is not available');
    return;
  }
  if (AIHub.active) {
    const ok = await startSession();
    if (ok) { App.show = null; requestAnimationFrame(frame); return; }
  }
  App.show = new Showroom();
  App.show.setDriver(App.career ? App.career.driver : 'vex', App.career ? App.career.ups : 0);
  toTitle();
  requestAnimationFrame(frame);
}
boot();
window.__rr = { Gfx, App, UI, HUD, Input, S, TRACKS, startRace, DRIVERS };
window.__rr.THREE = THREE; window.__rr.cur = () => (App.race ? { scene: App.race.scene, camera: App.race.camera } : App.show ? { scene: App.show.scene, camera: App.show.camera } : null);

window.__rr.ff = (sec) => { const r = App.race; if (!r) return; for (let i = 0; i < sec * 60; i++) { r.fixed(1 / 60); r.time += 1 / 60; if (r.over) break; } };

</script>
</body>
