<!--
SPARFOX 64 — Verdant Reach Demo (single-file build)

Source Information
- Date: 2026-10-20 19:15
- Source: Starfox 64 for N64 (Nintendo, 1997) — this is an original spiritual successor, "Sparfox 64", with original characters, world, music and code.
- Tech: Three.js r180 (0.180.0) WebGPURenderer, WebGPU only with no fallback; TSL node materials; built-in toonOutlinePass + BloomNode post-processing; Rapier 3D 0.19.3 (@dimforge/rapier3d-compat) for collision queries, sensors and rigid-body debris; Web Audio API (procedural synth SFX, voice chatter and a step sequencer for music); Gamepad API (standard mapping, DualSense glyphs, dual-rumble); vanilla ES modules bundled into one HTML file; Google Fonts (Russo One, Rajdhani) via CDN.
- Art Direction: Stylised cel-shading — MeshToonMaterial with a 3-step gradient map, flat-shaded low-poly procedural models, screen-space inverted-hull ink outlines, banded gradient sky, banded animated toon water, HDR emissives with bloom, saturated per-zone palettes (sea, city, canyon, dusk arena).
- Animation: Fully procedural, code-driven animation — spring/damped transforms for banking, barrel rolls, somersaults and U-turns (quaternion composition), sine-based formation flight patterns, pooled particle explosions, Rapier-simulated debris, canvas-drawn talking comms portraits, scripted camera cutscenes.
- Testing: The prompt directed "Write no tests, do no tests, testing will be done separately." No tests or browser runs were performed; the build was not executed in a browser.
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort medium
- Usage: cost and token totals unknown (no meter available inside the session); session time approx. 35 minutes (19:15 to about 19:50 local)

Engine Feedback
- What did you like most about the engine? Three.js r180's WebGPU stack ships toonOutlinePass and bloom as TSL nodes, so the whole cel-shaded look (toon ramp + ink lines + glow) is a few lines; Rapier's query API (castRay, intersectionsWithShape, collision groups) made a clean hit-scan/sensor layer.
- Did you get stuck or guess wrong? I guessed ToonOutlinePassNode was an addon (its examples path 404s; it lives in the core three.webgpu build). I had to check Rapier's d.ts for timeOfImpact vs toi. Without being allowed to run it, several API behaviours (sensors in ray casts, compileAsync with post-processing) remain educated guesses.
- What was the most important thing you had to build yourself? The rail-space system: a parametric flight path with per-route branches, rail-relative enemy coordinates, and a distance-keyed event timeline — plus all models, music and sound procedurally.
- What was the hardest part about using the engine? Keeping WebGPU shader permutations stable (fixed light pool instead of spawning lights) and reasoning about outline cracks on flat-shaded geometry without visual feedback.
- If you had to remove or overhaul one thing from engine, what would that be? The split between the three.webgpu.js build, three.tsl.js and examples/jsm addons that all need a hand-written import map; one ESM entry would remove a whole class of loading errors.
- If you could change one thing about the engine, what would it be? Per-material outline thickness/colour for toonOutlinePass (currently one global value), and in Rapier an explicit "refresh query pipeline" call for body-less colliders moved between steps.

Prompt Feedback
- What did you like most about this prompt? The concrete bar for "feature-complete demo" (MGS2 Tanker, Doom E1, THPS Warehouse) and the specific, testable UX requirements: controller-first 10-foot UI, an attract mode, and the axis-inversion quick fix.
- What was confusing? "Write no tests, do no tests" conflicts with the machine-wide instructions to verify UI in many viewports; "single html file" vs "dependencies can be downloaded"; and the literal [PROMPT] placeholder under Prompt Feedback.
- What was the hardest thing to do? Building a whole vertical slice — rail + all-range flight, two routes, mid-boss, boss, wingmen, menus, attract mode, music — without running it a single time.
- If there was one test you could of run, what would that test be? Load the HTML in a WebGPU browser with a DualSense, let attract mode loop once, then play title → checkpoint → hidden canyon → boss → results while watching the console for shader/TSL compile errors.
-->

const Gfx = {
  renderer: null, scene: null, camera: null, post: null, sun: null, hemi: null, fxLights: [],
  shake: 0, shakeT: 0, fovKick: 0,
  async init() {
    if (!navigator.gpu) throw new Error('This browser does not expose WebGPU (navigator.gpu is missing).');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('No WebGPU adapter is available on this device.');
    const renderer = this.renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: false });
    await renderer.init();

    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    renderer.domElement.classList.add('gl');
    document.getElementById('app').prepend(renderer.domElement);

    const scene = this.scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8fd3ff);
    scene.fog = new THREE.Fog(0xa8dcff, 300, 1500);
    const camera = this.camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 6000);
    scene.add(camera);

    this.hemi = new THREE.HemisphereLight(0xdff3ff, 0x5a6a3a, 1.1); scene.add(this.hemi);
    const sun = this.sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
    sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
    const sc = sun.shadow.camera; sc.left = -220; sc.right = 220; sc.top = 220; sc.bottom = -220; sc.near = 10; sc.far = 900;
    sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.6;
    scene.add(sun); scene.add(sun.target);

    for (let i = 0; i < 6; i++) { const l = new THREE.PointLight(0xffa040, 0, 120, 1.6); scene.add(l); this.fxLights.push({ l, t: 0, life: 1, peak: 0 }); }

    const post = this.post = new THREE.PostProcessing(renderer);
    const scenePass = toonOutlinePass(scene, camera, new THREE.Color(0x0a0a18), 0.0032, 1);
    const bloomPass = bloom(scenePass, 0.9, 0.35, 0.92);
    this.bloomPass = bloomPass;

    addEventListener('resize', () => this.resize());
  },
  resize() { this.renderer.setSize(innerWidth, innerHeight); this.camera.aspect = innerWidth / innerHeight; this.camera.updateProjectionMatrix(); HUD.resize(); },
  buildSky() {
    const top = uniform(new THREE.Color(0x2f7fe0)), hor = uniform(new THREE.Color(0xbfe7ff)), sunC = uniform(new THREE.Color(0xfff6d8));
    this.skyU = { top, hor, sunC };
    const m = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide, depthWrite: false, fog: false });
    const dir = normalize(positionLocal);
    const h = dir.y.max(0).pow(0.55);
    // banded (cel) sky gradient
    const banded = h.mul(5).floor().div(5);
    m.colorNode = mix(hor, top, banded.add(h).mul(0.5));

    const sd = new THREE.Mesh(new THREE.CircleGeometry(140, 32), new THREE.MeshBasicMaterial({ color: new THREE.Color(2.2, 2.0, 1.5), fog: false }));
    this.sunDisc = sd; this.scene.add(sd);
  },
  setSkyColors(top, hor, fog, near, far) {
    this.skyU.top.value.set(top); this.skyU.hor.value.set(hor);
    this.scene.fog.color.set(fog); this.scene.fog.near = near; this.scene.fog.far = far; this.scene.background.set(fog);
  },
  flashLight(pos, intensity = 60, life = 0.5, col = 0xffa040) {
    let best = this.fxLights[0];
    for (const f of this.fxLights) if (f.t >= f.life) { best = f; break; } else if (f.t / f.life > best.t / best.life) best = f;
    best.l.position.copy(pos); best.l.color.set(col); best.t = 0; best.life = life; best.peak = intensity;
  },
  addShake(a) { this.shake = Math.min(2.5, this.shake + a * Settings.shake); },
  update(dt, focus) {
    for (const f of this.fxLights) { f.t += dt; const k = clamp(1 - f.t / f.life, 0, 1); f.l.intensity = f.peak * k * k; }

      this.sun.position.set(focus.x + 200, focus.y + 260, focus.z - 380);
      this.sun.target.position.copy(focus);
      this.sky.position.copy(this.camera.position);
      this.sunDisc.position.copy(this.camera.position).add(_v1.set(200, 260, -380).normalize().multiplyScalar(3800));
      this.sunDisc.lookAt(this.camera.position);
    }
  },
  applyShake(t) {

  render() { this.post.render(); },

function waterMaterial() {
  const m = new THREE.MeshBasicNodeMaterial();
  const p = positionWorld;
  const w1 = sin(p.x.mul(0.035).add(p.z.mul(0.02)).add(time.mul(1.3)));
  const w2 = sin(p.z.mul(0.05).sub(p.x.mul(0.013)).add(time.mul(0.9)));

const FX = {

  get(kind) {

    p.col = col; p.mesh.material.color.copy(col); p.mesh.material.opacity = o.opacity ?? 1; p.op = o.opacity ?? 1; p.drag = o.drag ?? 1.5; p.grav = o.grav ?? 0;

        this.debris.push(Physics.debris(pos, v, rand(0.3, 0.8) * Math.sqrt(size), pick(this.debrisMats)));

  sparks(pos, n = 5, col = new THREE.Color(4, 3.5, 1.2)) {

  },
  splash(pos) {

  clear() {

    for (const d of this.debris) { Physics.world.removeRigidBody(d.body); Gfx.scene.remove(d.mesh); d.mesh.geometry.dispose(); }

  },

    if (this.phase === 'dying') {

      if (this.dieT > 1.6) Game.timeScale = damp(Game.timeScale, 1, 2, dt);

    }
  },
};

const Comms = {
  queue: [], cur: null, t: 0, used: new Set(), shown: 0, lastBlip: 0,
  el: null, nameEl: null, textEl: null, ctx: null,
  init() {
    this.el = document.getElementById('comms'); this.nameEl = this.el.querySelector('.cname'); this.textEl = this.el.querySelector('.ctext');
    this.ctx = document.getElementById('portrait').getContext('2d');
  },
  say(who, text, dur = 3, tag = null, priority = false) {
    if (tag) { if (this.used.has(tag)) return; this.used.add(tag); }
    const m = { who, text, dur };
    if (priority) this.queue.unshift(m); else this.queue.push(m);
    if (this.queue.length > 5) this.queue.length = 5;
  },
  update(dt) {
    if (!this.cur && this.queue.length) { this.cur = this.queue.shift(); this.t = 0; this.shown = 0; this.nameEl.textContent = CAST[this.cur.who].name; this.el.classList.add('show'); Audio_.setDuck(0.6); }
    if (!this.cur) return;

    const c = this.cur, n = Math.min(c.text.length, Math.floor(this.t * 48));
    if (n !== this.shown) { this.shown = n; this.textEl.textContent = c.text.slice(0, n); if (n < c.text.length && c.text[n - 1] !== ' ') Audio_.voice(c.who); }
    const talking = n < c.text.length;
    drawPortrait(this.ctx, c.who, talking, this.t, this.t < 0.18 ? 1 - this.t / 0.18 : 0);
    if (this.t > c.dur + c.text.length / 48) { this.cur = null; if (!this.queue.length) { this.el.classList.remove('show'); Audio_.setDuck(1); } }
  },
  skip() { if (this.cur) this.t = 999; },
  clear() { this.queue.length = 0; this.cur = null; this.el.classList.remove('show'); Audio_.setDuck(1); },
};

nutes (19:15 to about 19:50 local)</li></ul><h3>Engine Feedback</h3><ul><li>What did you like most about the engine? Three.js r180&#x27;s WebGPU stack ships toonOutlinePass and bloom as TSL nodes, so the whole cel-shaded look (toon ramp + ink lines + glow) is a few lines; Rapier&#x27;s query API (castRay, intersectionsWithShape, collision groups) made a clean hit-scan/sensor layer.</li><li>Did you get stuck or guess wrong? I guessed ToonOutlinePassNode was an addon (its examples path 404s; it lives in the core three.webgpu build). I had to check Rapier&#x27;s d.ts for timeOfImpact vs toi. Without being allowed to run it, several API behaviours (sensors in ray casts, compileAsync with post-processing) remain educated guesses.</li><li>What was the most important thing you had to build yourself? The rail-space system: a parametric flight path with per-route branches, rail-relative enemy coordinates, and a distance-keyed event timeline \u2014 plus all models, music and sound procedurally.</li><li>What was the hardest part about using the engine? Keeping WebGPU shader permutations stable (fixed light pool instead of spawning lights) and reasoning about outline cracks on flat-shaded geometry without visual feedback.</li><li>If you had to remove or overhaul one thing from engine, what would that be? The split between the three.webgpu.js build, three.tsl.js and examples/jsm addons that all need a hand-written import map; one ESM entry would remove a whole class of loading errors.</li><li>If you could change one thing about the engine, what would it be? Per-material outline thickness/colour for toonOutlinePass (currently one global value), and in Rapier an explicit &quot;refresh query pipeline&quot; call for body-less colliders moved between steps.</li></ul><h3>Prompt Feedback</h3><ul><li>What did you like most about this prompt? The concrete bar for &quot;feature-complete demo&quot; (MGS2 Tanker, Doom E1, THPS Warehouse) and the specific, testable UX requirements: controller-first 10-foot UI, an attract mode, and the axis-inversion quick fix.</li><li>What was confusing? &quot;Write no tests, do no tests&quot; conflicts with the machine-wide instructions to verify UI in many viewports; &quot;single html file&quot; vs &quot;dependencies can be downloaded&quot;; and the literal [PROMPT] placeholder under Prompt Feedback.</li><li>What was the hardest thing to do? Building a whole vertical slice \u2014 rail + all-range flight, two routes, mid-boss, boss, wingmen, menus, attract mode, music \u2014 without running it a single time.</li><li>If there was one test you could of run, what would that test be? Load the HTML in a WebGPU browser with a DualSense, let attract mode loop once, then play title \u2192 checkpoint \u2192 hidden canyon \u2192 boss \u2192 results while watching the console for shader/TSL compile errors.</li></ul><h3>Cast</h3><ul><li>Vale (fox) \u2014 you, team leader</li><li>Tusk (boar) \u2014 veteran wingman</li><li>Wren (bird) \u2014 hotshot wingman</li><li>Moss (toad) \u2014 engineer, reads boss shields</li><li>Admiral Hollis (hound) \u2014 command</li><li>Overseer Kraag (lizard) \u2014 Varn Dominion</li></ul><h3>Libraries</h3><ul><li>three.js r180 \u2014 MIT License</li><li>Rapier 0.19.3 by Dimforge \u2014 Apache-2.0</li><li>Russo One &amp; Rajdhani fonts \u2014 SIL Open Font License</li></ul>"};
const UI = {
  root: null, stack: [], sel: 0, el: null, scrollY: 0,
  init() { this.root = document.getElementById('screens'); },
  get top() { return this.stack[this.stack.length - 1]; },
  open(def, replace = false) { if (replace) this.stack.length = 0; this.stack.push(def); this.sel = def.startSel || 0; this.scrollY = 0; this.render(); },
  back() {
    const t = this.top; if (!t) return;
    if (t.onBack) { Audio_.play('menuBack'); t.onBack(); return; }
    if (this.stack.length > 1) { Audio_.play('menuBack'); this.stack.pop(); this.sel = 0; this.render(); }
  },
  closeAll() { this.stack.length = 0; this.root.innerHTML = ''; },
  onPadChange() { if (this.top) this.render(); Game.updateTouchGate(); },
  render() {
    const t = this.top; this.root.innerHTML = ''; if (!t) return;
    const el = document.createElement('div'); el.className = 'screen' + (t.dim !== false ? ' dim' : '');
    let html = t.head ? t.head() : '';
    const items = t.items ? t.items() : [];
    t._items = items;
    if (items.length) {
      html += '<div class="menu">' + items.map((it, i) => `<div class="item${i === this.sel ? ' sel' : ''}${it.disabled ? ' disabled' : ''}" data-i="${i}"><span class="label">${it.label}</span>${this.valueHtml(it)}</div>`).join('') + '</div>';
      const d = items[this.sel] && items[this.sel].desc; html += `<div class="desc">${d || '&nbsp;'}</div>`;
    }
    if (t.body) html += t.body();
    html += `<div class="footer">${t.footer ? t.footer() : this.defaultFooter(items)}</div>`;
    el.innerHTML = html;
    el.querySelectorAll('.item').forEach(n => {
      const i = +n.dataset.i;
      n.addEventListener('mouseenter', () => { if (this.sel !== i) { this.sel = i; this.render(); } });
      n.addEventListener('click', e => { this.sel = i; const it = items[i]; if (it.kind === 'range' || it.kind === 'choice') { const r = n.getBoundingClientRect(); this.adjust(it, e.clientX > r.left + r.width / 2 ? 1 : -1); } else this.activate(it); });
    });
    this.root.appendChild(el); this.el = el;
    // keep the selection visible in long lists
    const menu = el.querySelector('.menu'), selEl = menu && menu.querySelector('.sel');
    if (selEl) { const top = selEl.offsetTop - menu.offsetTop, h = menu.clientHeight; if (top + selEl.offsetHeight > h) menu.scrollTop = top + selEl.offsetHeight - h + 8; }
    const sc = el.querySelector('.scroll .inner'); if (sc) sc.style.transform = `translateY(${-this.scrollY}px)`;
  },
  valueHtml(it) {
    if (it.kind === 'toggle') return `<span class="val">${it.get() ? 'ON' : 'OFF'}</span>`;
    if (it.kind === 'range') { const v = it.get(), f = (v - it.min) / (it.max - it.min); return `<span class="val"><span class="bar"><i style="width:${Math.round(f * 100)}%"></i></span>${it.fmt ? it.fmt(v) : Math.round(f * 100) + '%'}</span>`; }
    if (it.kind === 'choice') return `<span class="val">◀ ${it.options[it.get()]} ▶</span>`;
    return '';
  },
  defaultFooter(items) {
    const hasAdjust = items.some(i => i.kind === 'range' || i.kind === 'choice');
    return `<span>${G('confirm')} Select</span>${hasAdjust ? `<span>${G('change')} Adjust</span>` : ''}${this.stack.length > 1 || (this.top && this.top.onBack) ? `<span>${G('back')} Back</span>` : ''}`;
  },
  activate(it) {
    if (!it || it.disabled) return;
    if (it.kind === 'toggle') { it.set(!it.get()); Audio_.play('menuOk'); saveSettings(); this.render(); return; }
    if (it.kind === 'range' || it.kind === 'choice') { this.adjust(it, 1); return; }
    Audio_.play('menuOk'); it.act && it.act();
  },
  adjust(it, dir) {
    if (it.kind === 'range') { it.set(clamp(Math.round((it.get() + dir * it.step) * 100) / 100, it.min, it.max)); }
    else if (it.kind === 'choice') { const n = it.options.length; it.set((it.get() + dir + n) % n); }
    else if (it.kind === 'toggle') it.set(!it.get());
    else return;
    Audio_.play('menuMove'); saveSettings(); this.render();
  },
  update(dt) {
    const t = this.top; if (!t) return;
    if (t.update) t.update(dt);
    if (this.top !== t) return;

    if (items.length) {
      if (Input.nav.up) { this.sel = (this.sel - 1 + items.length) % items.length; Audio_.play('menuMove'); this.render(); }
      if (Input.nav.down) { this.sel = (this.sel + 1) % items.length; Audio_.play('menuMove'); this.render(); }
      const it = items[this.sel];
      if (it && (it.kind === 'range' || it.kind === 'choice' || it.kind === 'toggle')) { if (Input.nav.left) this.adjust(it, -1); if (Input.nav.right) this.adjust(it, 1); }

    } else if (t.scroll) {
      const sc = this.el && this.el.querySelector('.scroll'), inner = sc && sc.querySelector('.inner');

  sim(dt, ctl) {

  },
  checkGates() {
    for (const g of World.gates) {
      if (g.passed || g.missed || this.d < g.d) continue;
      if (Player.pos.distanceTo(g.mesh.position) < 11.5) { g.passed = true; g.mesh.userData.glow.material.color.setRGB(0.6, 4, 1.2); Audio_.play('gate'); const n = World.gates.filter(x => x.passed).length; HUD.toast(n === 5 ? 'ALL GATES CLEARED!' : `Gate ${n}/5`); }

  updateCut(dt) {

  },
  applyCamera(dt) {

  updateSky(dt) {

    const d = this.d, beta = this.route === 'beta';
    if (this.mode === 'allrange') { a = b = SKY.arena; }

  },
  touchGateShown: false, kbSeen: false,
  updateTouchGate() {

    const show = coarseOnly && !Input.getPad() && !this.kbSeen && !this.gateSuppressed;

addEventListener('keydown', () => { if (!Game.kbSeen) { Game.kbSeen = true; Game.updateTouchGate(); } });

// ---------- attract-mode pilot (cheats freely: invincible, infinite boost/bombs, wide aim assist) ----------
const AI = {
  t: 0, fireCycle: 0, bombCD: 4, rollCD: 0, loopCD: 0, prevFire: false, boostT: 0,
  control(dt) {
    this.t += dt; this.fireCycle += dt; this.bombCD -= dt; this.rollCD -= dt; this.loopCD -= dt;
    const P = Player, c = { ...ZERO_CTL };
    let tgt = null, best = 1e9;
    for (const e of Enemies.list) {
      if (!e.alive || !e.lockable) continue;
      _v1.copy(e.pos).sub(P.pos); const dist = _v1.length();
      const ahead = _v1.dot(P.fwd);
      if (Game.mode === 'rail' && (ahead < 25 || ahead > 380)) continue;
      const score = dist - (e.boss ? 200 : 0) - (e.type === 'hauler' ? 150 : 0);
      if (score < best) { best = score; tgt = e; }
    }
    let goal = null;
    if (Game.mode === 'rail') {
      const gate = World.gates.find(g => !g.passed && !g.missed && g.d > Game.d && g.d - Game.d < 260);
      const item = Items.list.find(i => { const r = -i.pos.z - Game.d; return r > 20 && r < 200; });
      goal = gate ? gate.mesh.position : item ? item.pos : tgt ? tgt.pos : null;
      Rail.frame(Game.d, Game.route);
      let dx = 0, dy = 10;
      if (goal) { _v1.copy(goal).sub(Rail.pos); dx = _v1.dot(Rail.right); dy = _v1.dot(Rail.up); if (!gate && !item) dy += 2; }
      else { dx = Math.sin(this.t * 0.5) * 20; dy = 10 + Math.sin(this.t * 0.7) * 8; }
      c.mx = clamp((dx - P.ox) / 10, -1, 1);
      const climb = clamp((dy - P.oy) / 10, -1, 1); c.my = Settings.pilotPitch ? climb : -climb;
      if (HUD.behindWarn > 0 && this.loopCD <= 0) { c.loop = true; this.loopCD = 6; }
      this.boostT -= dt; if (!tgt && this.boostT < 0 && Math.random() < dt * 0.3) this.boostT = 1.5;
      c.boost = this.boostT > 0;
    } else {
      goal = tgt ? tgt.pos : Boss.active ? Boss.group.position : L.ARENA;
      _v1.copy(goal).sub(P.pos);
      const dist = _v1.length();
      const desiredYaw = Math.atan2(-_v1.x, -_v1.z);
      let dyaw = angleWrap(desiredYaw - P.yaw);

    else { c.fire = cyc < 3.1; c.firePressed = !this.prevFire && c.fire; c.fireReleased = this.prevFire && !c.fire; }

};

// ===== 13_main.js — boot sequence and main loop =====
function showError(title, msg) {
  document.getElementById('loading').style.display = 'none';
  const e = document.getElementById('error'); e.style.display = 'flex';
  e.innerHTML = `<h1>${title}</h1><div>${msg}</div><div style="opacity:.7;font-size:.8em">Sparfox 64 renders exclusively with WebGPU (no WebGL fallback). Try a current Chrome, Edge, or Safari 26+ with hardware acceleration enabled.</div>`;
}
function progress(f, txt) { document.getElementById('loadbar').style.width = Math.round(f * 100) + '%'; if (txt) document.getElementById('loadtxt').textContent = txt; }
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

async function boot() {
  applySettings();
  try { progress(0.05, 'Starting WebGPU…'); await Gfx.init(); }
  catch (err) { showError('WebGPU required', String(err && err.message || err)); return; }
  try {
    progress(0.1, 'Loading Rapier physics…'); await Physics.init();
    Input.init(); FX.init(); Projectiles.init(); HUD.init(); Comms.init(); UI.init();
    await nextFrame();
    World.build((f, t) => progress(0.1 + f * 0.8, t));
    Player.init(); Wingmen.init(); Carrier.build(); Boss.build();
    progress(0.9, 'Compiling cel shaders…'); await nextFrame();
    Game.toTitle(true);
    Gfx.camera.position.set(0, 40, 40); Gfx.camera.lookAt(0, 30, -100);
    try { await Gfx.renderer.compileAsync(Gfx.scene, Gfx.camera); } catch (e) { /* compile happens lazily on first render instead */ }
  } catch (err) { console.error(err); showError('Failed to start', String(err && err.stack || err)); return; }
  progress(1, 'Ready');
  document.getElementById('loading').style.display = 'none';
  document.getElementById('touchSettings').addEventListener('click', () => {
    Game.gateSuppressed = true; Game.updateTouchGate();
    const def = Screens.settings(); def.onBack = () => { Game.gateSuppressed = false; Game.toTitle(true); };
    UI.open(def, true);
  });
  let last = performance.now() / 1000;
  Gfx.renderer.setAnimationLoop(nowMs => {
    const now = nowMs / 1000, dt = clamp(now - last, 0, 0.05); last = now;
    Input.update(dt, now);
    UI.update(dt);
    Game.frame(dt);
    HUD.update(dt); HUD.draw();
    Gfx.render();
  });
}
boot();
