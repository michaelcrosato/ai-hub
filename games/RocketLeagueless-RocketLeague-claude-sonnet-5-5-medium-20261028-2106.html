<!--
ROCKET LEAGUELESS  -  a spiritual successor to Rocket League
(Title picked by RNG from 50 brainstormed riffs on the source's name.)

SOURCE INFORMATION
- Date: 2026-10-28 21:06
- Source game: Rocket League
- Tech: Three.js r180 (three/webgpu WebGPURenderer + TSL node materials, WebGPU only, no fallback); Rapier 0.19.3 (rapier3d-compat, WASM physics); Web Audio API; Gamepad API; PeerJS 1.5.4 (WebRTC) for online play; plain ES modules bundled into one HTML file (libraries load from CDN)
- Art Direction: Stylized cel-shading - MeshToonNodeMaterial with a 4-step gradient ramp, inverted-hull ink outlines, flat-lit stadium, translucent glass walls, additive glow FX
- Animation: Procedural - spring-based squash/stretch, suspension lean, wheel spin and steering, antenna/topper secondary motion, flame flicker, instanced crowd bounce; GPU-less particle system on instanced meshes; goal replays via a ring-buffer recorder
- Audio: 100% procedural. Music: generative step-sequenced synth tracks (menu, match, mayhem, overtime, results). SFX: oscillator/noise synthesis (engines, boost, hits, pads, goals, crowd). Voice: browser speechSynthesis announcer with Rocket-League-style quips, plus subtitles
- Online: Peer-to-peer WebRTC via PeerJS cloud broker (4-letter room codes). Host-authoritative: host simulates physics, clients send inputs at 30 Hz and receive 30 Hz snapshots (interpolated). Up to 4 humans, bots fill remaining seats, bot takes over if someone drops. Local split-screen for 1-4 players (controllers + 2 keyboard layouts)
- Testing: Lightweight only - headless Chrome 154 (WebGPU, software-class adapter, about 6 fps) driven by Playwright; a fast-forward sim hook for full match flows in all four modes; a two-browser online test against a local PeerJS server; fake-DualSense injection for menu nav and axis-invert checks; render-target screenshots. No real GPU, real gamepad, or real-audio listening tests.
- Environment: Claude Code CLI (headless); Linux; browser unknown (dev tests used headless Chrome 154)
- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium
- Usage: unknown (no cost/token/session-time estimates were available to the agent)

TESTING FEEDBACK
- Issues caught by testing: about 10 (split-screen viewport wipe, key taps lost at low frame rate, edge-key state cleared before the lobby read it so keyboard-2 could not join, bots never scoring / never grabbing power-ups, Hoops unscoreable for the demo AI, shadow acne stipple, garage ball overlapping the car, HUD showing during replays, attract mode able to fire inside an online room, bot jump-hold/dodge bugs).
- Critical / game-breaking: 2 (WebGPU clear ignores scissor so only the last split-screen viewport survived; second-keyboard join impossible).
- Most helpful test: render-target composite screenshots (3D readback + transparent DOM overlay) combined with the fast-forward sim hook, then the two-browser online test.
- Least helpful test: plain page screenshots of the WebGPU canvas (blank in headless) and real-time driving at about 6 fps.

ENGINE FEEDBACK
- Liked most: TSL node materials and MeshToonNodeMaterial make cel-shading cheap; WebGPURenderer is near drop-in for WebGL code; Rapier gives CCD, trimesh colliders and ray casts, so an arcade vehicle controller on a rigid body was straightforward.
- Stuck / guessed wrong: assumed renderer.setViewport applies to render targets (it does not - set it on the target), assumed scene.background was harmless in split-screen (WebGPU clears ignore scissor), and guessed WebGL's bottom-left viewport origin (WebGPU is top-left).
- Most important thing built myself: the arcade car controller (ray-cast ground detection, wall sticking, air control, flips) plus all menus, netcode, bots and audio.
- Hardest part: debugging WebGPU rendering with no GPU inspector or reliable canvas capture, and sparse TSL documentation.
- Overhaul/remove one thing: the dual classic-vs-node material split in three/webgpu (easy to mix up).
- Change one thing: first-class split-screen / multi-viewport rendering that preserves earlier viewports (load-op aware).

PROMPT FEEDBACK
- Liked most: concrete, testable scope (10-foot controller UX, attract mode, 4-player online, replays, infrastructure over content) and the playful axis-inversion trap.
- Confusing: the bracketed filename pattern vs SOURCE token, what counts as "root", how to do online play with no backend allowed, and the same feedback being requested in three places.
- Hardest thing: shipping physics, netcode, split-screen, audio, menus and AI in one pass with no real GPU, gamepad or second machine.
- One test I would have run: two real machines on the internet, each with a physical DualSense on a real GPU, playing a full 4-player match to judge latency and feel.

CONTROLS (DualSense): R2/L2 accelerate/brake, left stick steer + air pitch/yaw, X jump (twice = flip), O boost, Square powerslide, L1 air roll, R1 power-up (Mayhem), Triangle ball cam, R3 rear view, D-pad quick chat, Options pause.
Keyboard: W/S/A/D, Space jump, Shift boost, C slide, Q air roll, E power-up, R ball cam, V rear view, 1-4 chat, Esc pause. Second keyboard player: arrows, Enter, Right Shift, Right Ctrl.
-->

function makeTutorial(session) {
  const car = () => session.locals[0].car;
  const T_ = { idx: 0, flags: {}, acc: 0, done: false, yaw: 0, prevYaw: null, boostT: 0, driveT: 0, wallT: 0, airT: 0, airRoll: 0 };
  const steps = [
    { t: () => `Hold ${gl('accel')} to accelerate. ${gl('brake')} brakes and reverses.`, ok: (dt) => { T_.driveT += car().speed > 8 ? dt : 0; return T_.driveT > 1.5; } },
    { t: () => `Steer with ${gl('steer')}. Make a full turn.`, ok: (dt) => { const y = 2 * Math.atan2(car().quat.y, car().quat.w); if (T_.prevYaw != null) { let d = y - T_.prevYaw; d = Math.atan2(Math.sin(d), Math.cos(d)); T_.yaw += Math.abs(d); } T_.prevYaw = y; return T_.yaw > 5.5; } },
    { t: () => `Hold ${gl('boost')} to boost. Boost is limited — grab pads to refill!`, ok: (dt) => { T_.boostT += car().boosting ? dt : 0; return T_.boostT > 1.5; } },
    { t: () => `Grab a glowing boost pad. Small ones give 12, big orbs give 100.`, ok: () => !!T_.flags.pad },
    { t: () => `Press ${gl('jump')} to jump. Hold it for a higher hop.`, ok: () => !!T_.flags.jump },
    { t: () => `Press ${gl('jump')} twice for a double jump.`, ok: () => !!T_.flags.dbl },
    { t: () => `Flip! Jump, then tilt ${gl('steer')} and press ${gl('jump')} again to dodge.`, ok: () => !!T_.flags.dodge },
    { t: () => `Drive up a wall — the car sticks to any surface. Hit the wall at speed.`, ok: (dt) => { const c = car(); T_.wallT += c.grounded && c.groundN.y < 0.5 ? dt : 0; return T_.wallT > 1.2; } },
    { t: () => `In the air, tilt ${gl('steer')} to pitch and yaw. Hold ${gl('air')} and tilt to roll.`, ok: (dt) => { const c = car(); if (!c.grounded) { T_.airT += dt; if (c.input.air && Math.abs(c.input.steer) > 0.4) T_.airRoll += dt; } return T_.airT > 1 && T_.airRoll > 0.4; } },
    { t: () => `Toggle ball cam with ${gl('ballcam')}. Hold ${gl('rear')} to look behind.`, ok: () => !!T_.flags.ballcam },
    { t: () => `Hit the ball!`, ok: () => !!T_.flags.hit },
    { t: () => `Score a goal! Aim for the glowing net.`, ok: () => !!T_.flags.goal },
  ];
  T_.update = (dt) => {
    if (T_.done) return; const s = steps[T_.idx];
    HUD.tut.innerHTML = `<div class="tn">LESSON ${T_.idx + 1} / ${steps.length}</div><div class="tt">${s.t()}</div><div class="tb"><i style="width:${(T_.idx / steps.length) * 100}%"></i></div>`;
