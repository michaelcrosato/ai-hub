<!--
=====================================================================================
  NITRO NIBBLERS — a cel-shaded critter kart Grand Prix
  An original spiritual successor to Mario Kart 64.

  Source Information
  - Initial Date: 2026-10-18
  - SOURCE: Mario Kart 64 (Nintendo, Nintendo 64, 1996)
  - Tech/Engine: Custom renderer written directly against the WebGPU API with WGSL shaders
                 (no engine, no WebGL fallback). Vanilla JavaScript (ES2022 module),
                 Web Audio API (procedural synth music + SFX), Gamepad API (standard mapping,
                 PS5 DualSense layout), HTML/CSS overlay UI, Google Fonts (Lilita One, Fredoka).
  - Art Direction: Stylized cel-shading — 3-tone toon ramp with cool hemisphere shadow tint,
                 4096² PCF shadow map, inverted-hull ink outlines, toon rim light + specular
                 pip, banded toon sky with procedural clouds, flat-shaded low-poly terrain,
                 chunky disc particles. Inspired by Wind Waker, Lil Gator Game, Untitled Goose
                 Game, Sable and Jet Set Radio.
  - Environment: Claude Code CLI on Linux (Ubuntu 26.04, WSL2). Runs in any WebGPU browser
                 (Chrome/Edge 113+, Safari 26+, Firefox with WebGPU).
  - Model and Effort Level: Anthropic — Claude Opus 5.5 (claude-opus-5-5); reasoning effort: unknown
=====================================================================================
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nitro Nibblers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1d3a; --ink2:#4a3760; --cream:#fff6e0; --paper:#fffaf0; --sun:#ffd23f; --sun2:#ffb703;
  --hot:#ff5d73; --sea:#3ec1d3; --leaf:#7bd389; --sky:#8fd3ff; --grape:#9b5de5;
  --u:1vmin;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#140c24;color:var(--ink);
  font-family:'Fredoka',system-ui,sans-serif;user-select:none;-webkit-user-select:none;cursor:default}
body.hidecursor{cursor:none}
canvas#gpu{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(20,8,40,.38) 100%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;
  animation:scrIn .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes scrIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.dim{background:linear-gradient(180deg,rgba(30,12,60,.55),rgba(30,12,60,.2) 40%,rgba(30,12,60,.55))}
.dimmer{background:rgba(26,10,48,.7)}

/* ---------- typography ---------- */
.logo{font-family:'Lilita One',sans-serif;font-size:calc(var(--u)*15);line-height:.86;text-align:center;letter-spacing:.02em;
  color:var(--sun);-webkit-text-stroke:calc(var(--u)*1.1) var(--ink);paint-order:stroke fill;
  text-shadow:0 calc(var(--u)*1.4) 0 var(--ink),0 calc(var(--u)*2.2) calc(var(--u)*2) rgba(0,0,0,.35);transform:rotate(-4deg);
  animation:bob 3s ease-in-out infinite}
.logo .l2{color:#ff7b9c;display:block;font-size:.92em}
@keyframes bob{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-2deg) translateY(calc(var(--u)*-1))}}
.tagline{margin-top:calc(var(--u)*3.4);font-size:calc(var(--u)*3);font-weight:700;color:var(--paper);
  text-shadow:0 .35vmin 0 var(--ink);letter-spacing:.06em}
.press{margin-top:calc(var(--u)*7);font-size:calc(var(--u)*3.6);font-weight:700;color:#fff;
  text-shadow:0 .4vmin 0 var(--ink);animation:blink 1.2s ease-in-out infinite;display:flex;align-items:center;gap:1.4vmin}
@keyframes blink{50%{opacity:.35}}
.press.focus{background:none!important;box-shadow:none;transform:none}
.h1{font-family:'Lilita One',sans-serif;font-size:calc(var(--u)*7.2);color:#fff;-webkit-text-stroke:calc(var(--u)*.7) var(--ink);
  paint-order:stroke fill;text-shadow:0 calc(var(--u)*.8) 0 var(--ink);margin:0 0 calc(var(--u)*2.2);letter-spacing:.02em;text-align:center}
.h2{font-family:'Lilita One',sans-serif;font-size:calc(var(--u)*4);color:var(--ink);margin:0 0 1.4vmin}
.sub{font-size:calc(var(--u)*2.5);font-weight:600;color:#fff;text-shadow:0 .3vmin 0 var(--ink);margin:-1vmin 0 2.6vmin;text-align:center}

/* ---------- buttons ---------- */
.menu-col{display:flex;flex-direction:column;gap:calc(var(--u)*1.7);align-items:stretch;min-width:calc(var(--u)*52)}
.btn{font-family:'Fredoka',sans-serif;font-weight:700;font-size:calc(var(--u)*3.5);color:var(--ink);background:var(--paper);
  border:calc(var(--u)*.55) solid var(--ink);border-radius:999px;padding:calc(var(--u)*1.25) calc(var(--u)*4.5);
  box-shadow:0 calc(var(--u)*.8) 0 var(--ink);transition:transform .14s cubic-bezier(.3,1.6,.5,1),background .12s;
  display:flex;align-items:center;justify-content:space-between;gap:2vmin;cursor:pointer;white-space:nowrap}
.btn .ic{width:calc(var(--u)*4.4);height:calc(var(--u)*4.4);flex:none}
.btn .lbl{flex:1;text-align:left}
.btn .hint{font-size:.55em;font-weight:600;opacity:.7}
.focus{transform:scale(1.07) translateY(calc(var(--u)*-.4));background:var(--sun)!important;
  box-shadow:0 calc(var(--u)*1.1) 0 var(--ink),0 0 0 calc(var(--u)*.6) #fff;z-index:2}
.btn.focus::before{content:'';position:absolute;left:calc(var(--u)*-4);width:0;height:0;border-top:1.6vmin solid transparent;
  border-bottom:1.6vmin solid transparent;border-left:2.2vmin solid var(--sun);filter:drop-shadow(.4vmin .4vmin 0 var(--ink));
  animation:nudge .6s ease-in-out infinite}
.btn{position:relative}
@keyframes nudge{50%{transform:translateX(.8vmin)}}

/* option rows */
.opt{display:flex;align-items:center;justify-content:space-between;gap:3vmin;font-weight:700;font-size:calc(var(--u)*3);
  background:var(--paper);border:calc(var(--u)*.5) solid var(--ink);border-radius:2.2vmin;padding:1.1vmin 2.4vmin 1.1vmin 3vmin;
  box-shadow:0 .7vmin 0 var(--ink);min-width:calc(var(--u)*78);cursor:pointer;transition:transform .14s cubic-bezier(.3,1.6,.5,1)}
.opt .val{display:flex;align-items:center;gap:1.6vmin;min-width:calc(var(--u)*30);justify-content:center}
.opt .arr{font-size:.8em;opacity:.25}
.opt.focus .arr{opacity:1}
.opt .vtxt{min-width:calc(var(--u)*20);text-align:center;background:var(--ink);color:#fff;border-radius:999px;padding:.4vmin 2vmin}
.bar{display:flex;gap:.6vmin}
.bar i{display:block;width:2vmin;height:3vmin;border-radius:.6vmin;background:#d8cdb8;border:.35vmin solid var(--ink)}
.bar i.on{background:var(--hot)}

/* cards */
.cards{display:flex;gap:2.6vmin;flex-wrap:wrap;justify-content:center}
.card{width:calc(var(--u)*30);background:var(--paper);border:calc(var(--u)*.55) solid var(--ink);border-radius:3vmin;
  padding:2.2vmin;box-shadow:0 1vmin 0 var(--ink);transition:transform .14s cubic-bezier(.3,1.6,.5,1);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1vmin;text-align:center}
.card .big{font-family:'Lilita One';font-size:calc(var(--u)*7);line-height:1;color:var(--ink)}
.card .nm{font-family:'Lilita One';font-size:calc(var(--u)*3.6)}
.card .ds{font-size:calc(var(--u)*2.1);font-weight:500;opacity:.8;line-height:1.25}
.card .swatch{width:100%;height:calc(var(--u)*13);border-radius:2vmin;border:.45vmin solid var(--ink);position:relative;overflow:hidden}
.card .best{font-size:calc(var(--u)*2.3);font-weight:700}
.pill{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:.3vmin 1.6vmin;font-size:calc(var(--u)*2);font-weight:700}

/* character select */
.cs{position:absolute;inset:0;display:grid;grid-template-columns:auto 1fr;align-items:center;padding:0 5vmin;gap:4vmin}
.cs-grid{display:grid;grid-template-columns:repeat(4,calc(var(--u)*15.5));gap:1.8vmin}
.cface{background:var(--paper);border:calc(var(--u)*.55) solid var(--ink);border-radius:2.6vmin;box-shadow:0 .8vmin 0 var(--ink);
  padding:1vmin;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .14s cubic-bezier(.3,1.6,.5,1)}
.cface svg{width:100%;height:auto}
.cface .n{font-family:'Lilita One';font-size:calc(var(--u)*2.5);margin-top:.2vmin}
.cs-info{justify-self:end;align-self:end;margin-bottom:12vmin;background:var(--paper);border:calc(var(--u)*.55) solid var(--ink);
  border-radius:3vmin;box-shadow:0 1vmin 0 var(--ink);padding:2.4vmin 3.4vmin;min-width:calc(var(--u)*46)}
.cs-info .nm{font-family:'Lilita One';font-size:calc(var(--u)*6);line-height:1}
.cs-info .sp{font-size:calc(var(--u)*2.6);font-weight:600;opacity:.75;margin-bottom:1.4vmin}
.stat{display:flex;align-items:center;justify-content:space-between;gap:2vmin;font-weight:700;font-size:calc(var(--u)*2.5);margin:.7vmin 0}

/* prompts */
#prompts{position:fixed;left:0;right:0;bottom:2.6vmin;display:flex;justify-content:center;gap:4vmin;z-index:8;pointer-events:none;
  font-weight:700;font-size:calc(var(--u)*2.5);color:#fff;text-shadow:0 .3vmin 0 var(--ink)}
#prompts span.p{display:flex;align-items:center;gap:1.1vmin}
.g{display:inline-flex;align-items:center;justify-content:center;min-width:calc(var(--u)*4);height:calc(var(--u)*4);border-radius:50%;
  background:#1d1430;border:.35vmin solid #fff;font-size:calc(var(--u)*2.3);font-weight:700;color:#fff;text-shadow:none;padding:0 .4vmin;line-height:1}
.g.k{border-radius:1vmin;padding:0 1.2vmin;background:#fff;color:var(--ink);border-color:var(--ink);box-shadow:0 .4vmin 0 var(--ink);font-size:calc(var(--u)*2)}
.g.cross{color:#8fb4ff}.g.circle{color:#ff7b7b}.g.square{color:#ff9fe0}.g.tri{color:#4fe3a7}
.g.sh{border-radius:1vmin;padding:0 1vmin;font-size:calc(var(--u)*1.9)}

/* panels */
.panel{background:var(--paper);border:calc(var(--u)*.6) solid var(--ink);border-radius:3.4vmin;box-shadow:0 1.2vmin 0 var(--ink);
  padding:3vmin 4vmin;max-width:92vw}
.tabs{display:flex;gap:1.6vmin;margin-bottom:2vmin;justify-content:center}
.tab{font-weight:700;font-size:calc(var(--u)*2.8);padding:.8vmin 3vmin;border-radius:999px;border:.5vmin solid var(--ink);background:#efe4cc;cursor:pointer;
  transition:transform .14s cubic-bezier(.3,1.6,.5,1)}
.tab.on{background:var(--hot);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1.2vmin 3vmin;font-size:calc(var(--u)*2.6);align-items:center}
.kv b{font-weight:700;text-align:right;white-space:nowrap}
.items-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.4vmin 3vmin}
.itemrow{display:flex;gap:1.6vmin;align-items:center;font-size:calc(var(--u)*2.15);line-height:1.2}
.itemrow svg{width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);flex:none}
.itemrow b{display:block;font-size:1.12em}
.about p{font-size:calc(var(--u)*2.4);margin:.6vmin 0;line-height:1.35}
.about .kv{font-size:calc(var(--u)*2.2)}

/* results */
.res{display:flex;flex-direction:column;gap:1vmin;min-width:calc(var(--u)*80)}
.rrow{display:grid;grid-template-columns:calc(var(--u)*8) calc(var(--u)*6) 1fr auto auto;align-items:center;gap:2vmin;background:var(--paper);
  border:.5vmin solid var(--ink);border-radius:2vmin;padding:.7vmin 2.4vmin;font-size:calc(var(--u)*2.9);font-weight:700;box-shadow:0 .5vmin 0 var(--ink);
  animation:rowIn .4s cubic-bezier(.2,1.4,.4,1) both}
.rrow.me{background:var(--sun)}
.rrow .pl{font-family:'Lilita One';font-size:1.3em}
.rrow svg{width:calc(var(--u)*6);height:calc(var(--u)*6)}
.rrow .pts{min-width:calc(var(--u)*12);text-align:right;font-family:'Lilita One'}
.rrow .add{color:#2a9d4a;font-size:.8em;margin-left:1vmin}
@keyframes rowIn{from{opacity:0;transform:translateX(-6vmin)}to{opacity:1;transform:none}}
.btnrow{display:flex;gap:2.4vmin;margin-top:3vmin;justify-content:center}
.btnrow .btn .lbl{text-align:center}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;display:none;font-family:'Lilita One',sans-serif;color:#fff}
#hud.on{display:block}
.stroke{-webkit-text-stroke:calc(var(--u)*.55) var(--ink);paint-order:stroke fill;text-shadow:0 calc(var(--u)*.6) 0 var(--ink)}
#hLapWrap{position:absolute;left:3vmin;top:2.6vmin}
#hLap{font-size:calc(var(--u)*5.4);line-height:1}
#hLap small{font-size:.6em}
#hTime{font-size:calc(var(--u)*3);margin-top:.6vmin;font-family:'Fredoka';font-weight:700;letter-spacing:.04em}
#hSplits{font-family:'Fredoka';font-weight:700;font-size:calc(var(--u)*2.1);margin-top:.4vmin;opacity:.95}
#hItem{position:absolute;left:50%;top:2.4vmin;transform:translateX(-50%);width:calc(var(--u)*14);height:calc(var(--u)*14);
  background:rgba(255,250,240,.92);border:calc(var(--u)*.7) solid var(--ink);border-radius:3.4vmin;box-shadow:0 1vmin 0 var(--ink);
  display:flex;align-items:center;justify-content:center}
#hItem svg{width:82%;height:82%}
#hItem.roll svg{animation:roll .09s linear infinite}
@keyframes roll{from{transform:translateY(-12%)}to{transform:translateY(12%)}}
#hItem.empty{background:rgba(255,250,240,.35)}
#hItemN{position:absolute;right:-1.6vmin;bottom:-1.6vmin;font-size:calc(var(--u)*3.6)}
#hItemT{position:absolute;left:0;right:0;bottom:-4.6vmin;text-align:center;font-family:'Fredoka';font-weight:700;font-size:calc(var(--u)*1.9);
  white-space:nowrap}
#hPlace{position:absolute;right:4vmin;bottom:3vmin;font-size:calc(var(--u)*17);line-height:.8;transition:transform .2s}
#hPlace sup{font-size:.4em;vertical-align:top;margin-left:.4vmin}
#hPlace.p1{color:#ffd23f}#hPlace.p2{color:#dfe7f2}#hPlace.p3{color:#ffad66}
#hPlace.pop{transform:scale(1.25) rotate(-6deg)}
#hMap{position:absolute;right:2vmin;top:2vmin;width:calc(var(--u)*30);height:calc(var(--u)*30)}
#hRanks{position:absolute;left:2.4vmin;top:22vmin;display:flex;flex-direction:column;gap:.5vmin}
.rk{display:flex;align-items:center;gap:.8vmin;font-size:calc(var(--u)*2.2);transition:transform .3s}
.rk .num{width:calc(var(--u)*3.4);text-align:center}
.rk svg{width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);filter:drop-shadow(0 .3vmin 0 var(--ink))}
.rk.me svg{width:calc(var(--u)*5.8);height:calc(var(--u)*5.8)}
.rk.me .num{color:var(--sun)}
.rk.fin{opacity:.75}
#hSpeed{position:absolute;left:3vmin;bottom:3vmin;font-size:calc(var(--u)*5.6);line-height:1}
#hSpeed small{font-size:.42em;font-family:'Fredoka';font-weight:700}
#hBoost{position:absolute;left:3vmin;bottom:10vmin;display:flex;gap:.8vmin}
#hBoost i{width:4.2vmin;height:1.6vmin;border-radius:1vmin;border:.4vmin solid var(--ink);background:rgba(255,255,255,.3)}
#hCenter{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:calc(var(--u)*16);line-height:1}
#hCenter.pop{animation:cpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes cpop{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
#hMsg{position:absolute;left:0;right:0;top:56%;text-align:center;font-size:calc(var(--u)*5.4)}
#hToast{position:absolute;left:50%;top:24vmin;transform:translateX(-50%);font-family:'Fredoka';font-weight:700;font-size:calc(var(--u)*2.8);
  background:rgba(43,29,58,.8);padding:.8vmin 2.4vmin;border-radius:999px;opacity:0;transition:opacity .25s;white-space:nowrap}
#hDemo{position:absolute;left:0;right:0;bottom:4vmin;text-align:center;display:none}
#hDemo .t{font-size:calc(var(--u)*6.4);color:var(--sun)}
#hDemo .s{font-family:'Fredoka';font-weight:700;font-size:calc(var(--u)*2.8);animation:blink 1.2s infinite}
#hBalloons{position:absolute;left:3vmin;top:22vmin;display:none;flex-direction:column;gap:1vmin}
.bl{display:flex;align-items:center;gap:1vmin}
.bl svg{width:calc(var(--u)*5);height:calc(var(--u)*5)}
.bl .b{width:2.6vmin;height:3.2vmin;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;border:.35vmin solid var(--ink)}
.bl .b.off{opacity:.18}
.bl.out{opacity:.5}
#hFlash{position:absolute;inset:0;background:#fff;opacity:0}
#hLines{position:absolute;inset:-10%;opacity:0;transition:opacity .2s;
  background:repeating-conic-gradient(from 0deg at 50% 55%,rgba(255,255,255,.0) 0deg 5deg,rgba(255,255,255,.28) 5.5deg 6deg,rgba(255,255,255,0) 6.5deg 11deg);
  -webkit-mask:radial-gradient(ellipse at 50% 55%,transparent 34%,#000 70%);mask:radial-gradient(ellipse at 50% 55%,transparent 34%,#000 70%);
  animation:lines .25s linear infinite}
@keyframes lines{to{transform:rotate(3deg)}}
#hLook{position:absolute;left:50%;top:20vmin;transform:translateX(-50%);font-size:calc(var(--u)*3);display:none}
#hDrift{position:absolute;left:50%;bottom:6vmin;transform:translateX(-50%);display:flex;gap:1vmin;opacity:0;transition:opacity .2s}
#hDrift i{width:6vmin;height:1.6vmin;border-radius:1vmin;border:.4vmin solid var(--ink);background:rgba(255,255,255,.25)}

#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;
  background:radial-gradient(circle at 50% 40%,#3a2370,#140c24);color:#fff;font-family:'Lilita One';font-size:5vmin;gap:3vmin;text-align:center}
#boot .spin{width:8vmin;height:8vmin;border-radius:50%;border:1.2vmin solid rgba(255,255,255,.2);border-top-color:var(--sun);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#boot p{font-family:'Fredoka';font-weight:600;font-size:2.6vmin;max-width:80vw;margin:0;opacity:.9}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Lilita One';font-size:6vmin;color:#fff;
  background:rgba(20,12,36,.8);-webkit-text-stroke:.5vmin var(--ink);paint-order:stroke fill;z-index:30;pointer-events:none}
.trophy{width:calc(var(--u)*22);height:calc(var(--u)*22);filter:drop-shadow(0 1vmin 0 var(--ink))}
</style>
</head>
<body>
<canvas id="gpu"></canvas>
<div id="vignette"></div>
<div id="ui">
  <div id="hud">
    <div id="hLines"></div>
    <div id="hLapWrap"><div id="hLap" class="stroke">LAP 1<small>/3</small></div><div id="hTime" class="stroke">0:00.000</div><div id="hSplits" class="stroke"></div></div>
    <div id="hItem" class="empty"><div id="hItemIc"></div><div id="hItemN" class="stroke"></div><div id="hItemT" class="stroke"></div></div>
    <canvas id="hMap" width="400" height="400"></canvas>
    <div id="hRanks"></div>
    <div id="hBalloons"></div>
    <div id="hPlace" class="stroke">8<sup>th</sup></div>
    <div id="hBoost"></div>
    <div id="hSpeed" class="stroke">0<small> km/h</small></div>
    <div id="hDrift"><i></i><i></i><i></i></div>
    <div id="hCenter" class="stroke"></div>
    <div id="hMsg" class="stroke"></div>
    <div id="hLook" class="stroke">◀ REAR VIEW ▶</div>
    <div id="hToast"></div>
    <div id="hDemo"><div class="t stroke">DEMO PLAY</div><div class="s stroke">Press any button</div></div>
    <div id="hFlash"></div>
  </div>
</div>
<div id="prompts"></div>
<div id="boot"><div class="spin"></div><div>NITRO NIBBLERS</div><p>Warming up the engines…</p></div>
<script type="module">
'use strict';
// =====================================================================================
//  CORE: math, utilities, mesh builder
// =====================================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, r, dt) => lerp(a, b, 1 - Math.exp(-r * dt));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapA = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const dampA = (a, b, r, dt) => a + wrapA(b - a) * (1 - Math.exp(-r * dt));
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function rng(seed) {
  let s = seed | 0;

const cr = (a, b, c, d, t) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (-a + 3 * b - 3 * c + d) * t * t * t);

function segBox(mb, a, b, w, h, col, yOff = 0) {
  const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2], len = Math.hypot(dx, dy, dz);

function cylBetween(mb, a, b, r0, r1, col, seg = 8) {

// ---------- track world ----------
function buildTrackWorld(def, mirror) {
  const W = { def, id: def.id, name: def.name, theme: def.theme, isArena: false, mirror, env: ENVS[def.theme], music: def.music, laps: 3 };
  const P = def.pts.map((p) => {
    let f = p[3] || '';
    if (mirror) f = f.replace(/L/g, '#').replace(/R/g, 'L').replace(/#/g, 'R');
    return { x: (mirror ? -1 : 1) * p[0], z: p[1], y: p[2] || 0, f };
  });
  const n = P.length, S = [];
  for (let i = 0; i < n; i++) {
    const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
    const len = Math.hypot(p2.x - p1.x, p2.z - p1.z, p2.y - p1.y), steps = Math.max(2, Math.round(len / 2));
    for (let s = 0; s < steps; s++) {
      const t = s / steps;
      S.push({ p: [cr(p0.x, p1.x, p2.x, p3.x, t), cr(p0.y, p1.y, p2.y, p3.y, t), cr(p0.z, p1.z, p2.z, p3.z, t)], f: p1.f, first: s === 0, w: def.width });
    }
  }
  const N = S.length;
  let dacc = 0;
  for (let i = 0; i < N; i++) {
    const a = S[(i - 1 + N) % N].p, b = S[(i + 1) % N].p;
    const t = vsub(b, a), hl = Math.hypot(t[0], t[2]) || 1;
    const th = [t[0] / hl, 0, t[2] / hl];
    const s = S[i];
    s.t = th; s.r = [-th[2], 0, th[0]]; s.yaw = Math.atan2(th[0], th[2]); s.slope = t[1] / hl;
    if (i > 0) dacc += Math.hypot(s.p[0] - S[i - 1].p[0], s.p[2] - S[i - 1].p[2]);
    s.d = dacc;
    const wf = /[LRO]/.test(s.f) ? s.f : def.walls;
    s.wallL = wf.includes('L'); s.wallR = wf.includes('R');
    s.sl = def.sh; s.sr = def.sh; s.ice = s.f.includes('I');
  }
  W.length = dacc + Math.hypot(S[0].p[0] - S[N - 1].p[0], S[0].p[2] - S[N - 1].p[2]);
  for (let i = 0; i < N; i++) {
    const a = S[(i - 3 + N) % N], b = S[(i + 3) % N];
    S[i].curv = wrapA(b.yaw - a.yaw) / 12;
  }
  const raw = S.map((s) => clamp(s.curv * def.bankK, -0.24, 0.24));
  for (let i = 0; i < N; i++) { let acc = 0; for (let k = -6; k <= 6; k++) acc += raw[(i + k + N) % N]; S[i].bank = acc / 13; }
  for (let i = 0; i < N; i++) if (S[i].first && S[i].f.includes('B')) for (let k = 0; k < 4; k++) S[(i + k) % N].boost = true;
  W.S = S; W.N = N;

  W.query = function (x, y, z, hint) {
    let best = 0, bd = 1e18;
    if (hint == null || hint < 0) {
      for (let i = 0; i < N; i++) { const p = S[i].p, dx = x - p[0], dz = z - p[2], dy = y - p[1], d = dx * dx + dz * dz + dy * dy * 3; if (d < bd) { bd = d; best = i; } }
    } else {
      for (let k = -14; k <= 14; k++) { const i = (hint + k + N) % N, p = S[i].p, dx = x - p[0], dz = z - p[2], dy = y - p[1], d = dx * dx + dz * dz + dy * dy * 3; if (d < bd) { bd = d; best = i; } }
    }
    let i0 = best, i1 = (best + 1) % N, a = S[i0].p, b = S[i1].p;
    let abx = b[0] - a[0], abz = b[2] - a[2], t = ((x - a[0]) * abx + (z - a[2]) * abz) / (abx * abx + abz * abz || 1);
    if (t < 0) { i1 = i0; i0 = (best - 1 + N) % N; a = S[i0].p; b = S[i1].p; abx = b[0] - a[0]; abz = b[2] - a[2]; t = ((x - a[0]) * abx + (z - a[2]) * abz) / (abx * abx + abz * abz || 1); }
    t = clamp(t, 0, 1);
    const s0 = S[i0], s1 = S[i1];
    const cx = a[0] + abx * t, cz = a[2] + abz * t, cy = lerp(a[1], b[1], t);
    const rx = lerp(s0.r[0], s1.r[0], t), rz = lerp(s0.r[2], s1.r[2], t), rl = Math.hypot(rx, rz) || 1;
    const lat = ((x - cx) * rx + (z - cz) * rz) / rl;
    const bank = lerp(s0.bank, s1.bank, t), hw = lerp(s0.w, s1.w, t) / 2;
    const alat = Math.abs(lat), sh = lat >= 0 ? s0.sr : s0.sl, wall = lat >= 0 ? s0.wallR : s0.wallL;
    const res = { idx: i0, t, lat, hw, bank, prog: i0 + t, h: cy + clamp(lat, -(hw + s0.sl), hw + s0.sr) * bank, cy };
    res.surf = alat <= hw ? (s0.ice ? 'ice' : 'road') : alat <= hw + sh ? 'off' : (wall ? 'off' : 'void');
    res.boost = !!s0.boost && alat < 3.4;
    if (wall) {
      const lim = hw + sh - 0.9;
      if (alat > lim) { const sg = Math.sign(lat) || 1; res.pen = alat - lim; res.wn = [-rx / rl * sg, 0, -rz / rl * sg]; }
    }
    res.edgeOpen = !wall;
    return res;
  };
  W.heightAt = (x, z, hint, y = 0) => { const q = W.query(x, y, z, hint); return q.surf === 'void' ? -999 : q.h; };
  W.startPose = (slot, count) => {
    const row = Math.floor(slot / 2), col = slot % 2;
    const idx = (N - 3 - Math.round(row * 2.8) - col + N) % N, s = S[idx];
    const lat = (col ? 1 : -1) * Math.min(4.2, s.w * 0.24) * (count === 1 ? 0 : 1);
    return { pos: [s.p[0] + s.r[0] * lat, s.p[1] + lat * s.bank + 0.05, s.p[2] + s.r[2] * lat], yaw: s.yaw, idx };
  };
  W.boxSpots = [];
  for (const f of def.boxes) {
    const idx = Math.floor(f * N), s = S[idx];
    for (const l of [-0.36, -0.12, 0.12, 0.36]) {
      const lat = l * s.w;
      W.boxSpots.push({ pos: [s.p[0] + s.r[0] * lat, s.p[1] + lat * s.bank + 1.25, s.p[2] + s.r[2] * lat], idx });
    }
  }
  if (def.railX != null) W.railX = (mirror ? -1 : 1) * def.railX;
  buildTrackMeshes(W);
  return W;
}

function terrainHeight(theme, x, z, base, e, W) {
  if (e <= 0) return base;
  if (theme === 'beach') {
    let h = e < 10 ? base - e * 0.1 : base - 1 - (e - 10) * 0.45;
    h = Math.max(h, -7);
    const nn = fbm2(x * 0.011 + 3, z * 0.011 - 7);
    if (e > 45 && nn > 0.58) h = Math.max(h, -1.8 + (nn - 0.58) * 34);
    return Math.min(h, 3.5) + (noise2(x * 0.2, z * 0.2) - 0.5) * 0.3;
  }
  if (theme === 'desert') {
    const r = Math.min(e, 55);
    let h = base + r * 0.34 * (0.55 + 0.9 * fbm2(x * 0.02, z * 0.02)) + Math.max(0, e - 40) * 0.2;
    h += Math.sin(x * 0.06 + z * 0.03) * 1.3 * sstep(5, 20, e);
    if (W.railX != null) { const d = Math.abs(x - W.railX); h = lerp(h, -0.35, sstep(10, 5.5, d)); }
    return h;
  }
  if (theme === 'snow') {
    const r = Math.min(e, 80);
    return base + Math.pow(r, 1.18) * 0.42 * (0.6 + 0.8 * fbm2(x * 0.015, z * 0.015)) + (noise2(x * 0.25, z * 0.25) - 0.5) * 0.6 * sstep(2, 10, e);
  }
  return base;
}
function terrainColor(theme, h, ny, x, z) {
  const v = noise2(x * 0.05, z * 0.05);
  if (theme === 'beach') {
    if (h > 1.0) return mixC(C(0x7fcf62), C(0x96dc6e), v);
    if (h < -1.3) return C(0xd9b880);
    return mixC(C(0xf7dfa6), C(0xf0d293), v);
  }
  if (theme === 'desert') {
    if (ny < 0.8) { const band = ((Math.floor(h / 2.3) % 3) + 3) % 3; return [C(0xd9824a), C(0xeaa565), C(0xc4693c)][band]; }
    return mixC(C(0xf3c27e), C(0xe8ad6a), v);
  }
  if (theme === 'snow') {
    if (ny < 0.66) return mixC(C(0x8a90ab), C(0x737a98), v);
    return mixC(C(0xf6f9ff), C(0xe0e9ff), v * 0.8);
  }
  return WHITE;
}

function buildTrackMeshes(W) {
  const S = W.S, N = W.N, def = W.def, theme = W.theme, R = rng(def.seed);
  const ground = new MB(), props = new MB(), glow = new MB(), emis = new MB(), road = new MB();
  const edge = (s, l, dy = 0) => [s.p[0] + s.r[0] * l, s.p[1] + l * s.bank + dy, s.p[2] + s.r[2] * l];
  const roadCol = { beach: C(0x8a8a9c), desert: C(0x9a8a84), snow: C(0x8d93ad), sky: WHITE }[theme];
  const offCol = { beach: C(0xf3d79c), desert: C(0xe0a66a), snow: C(0xf2f6ff), sky: WHITE }[theme];
  const curbA = { beach: C(0xff5d73), desert: C(0xff7a3c), snow: C(0x3a8dff), sky: WHITE }[theme];
  // road surface
  for (let i = 0; i < N; i++) {
    const a = S[i], b = S[(i + 1) % N], hwa = a.w / 2, hwb = b.w / 2;
    if (theme === 'sky') {

const Cam = { pos: [0, 20, -30], target: [0, 0, 0], fov: 1.08, yawS: 0, cutT: 0, kind: 'chase', snap: true, tv: null, orbitA: 0 };
function camGroundClamp(p) {

function updateCamera(dt) {
  const W = G.world, k = G.focus;
  let pos, tgt, fov = 1.08, rate = 10;
  if (G.scene === 'showroom') {
    const a = Math.PI * 0.82;
    pos = [Math.sin(a) * 9.5, 3.6, Math.cos(a) * 9.5]; tgt = [2.4, 1.2, 0];
    Cam.pos = pos; Cam.target = tgt; Cam.fov = 0.8; return;
  }

    Cam.orbitA += dt * 0.25;
    const c = G.podium.center;
    Cam.pos = [c[0] + Math.sin(Cam.orbitA) * 15, c[1] + 6, c[2] + Math.cos(Cam.orbitA) * 15]; Cam.target = [c[0], c[1] + 3, c[2]]; Cam.fov = 0.95; return;
  }

  if (G.phase === 'intro' && !cinematic) {
    const t = clamp(G.t / 3.2, 0, 1), e = sstep(0, 1, t);

      pos = [Math.sin(a) * lerp(90, 30, e), lerp(50, 14, e), Math.cos(a) * lerp(90, 30, e)]; tgt = [0, 2, 0];
    } else {
      const N = W.N, i0 = (k.idx + Math.floor(lerp(N * 0.25, 10, e))) % N, s = W.S[i0];
      pos = [s.p[0] + s.r[0] * 14, s.p[1] + lerp(32, 8, e), s.p[2] + s.r[2] * 14];
      tgt = vlerp(W.S[(i0 + 4) % N].p, k.pos, e);
    }

  }
  if ((G.phase === 'finish' || G.phase === 'done') && !cinematic && G.mode !== 'battle') {
    Cam.orbitA += dt * 0.35;
    pos = [k.pos[0] + Math.sin(k.yaw + Cam.orbitA + 2.6) * 8, k.pos[1] + 3, k.pos[2] + Math.cos(k.yaw + Cam.orbitA + 2.6) * 8];

    const s = G.world.S[k.idx], side = k.lat >= 0 ? 1 : -1, open = side > 0 ? !s.wallR : !s.wallL, edge = s.w / 2 + (side > 0 ? s.sr : s.sl);

}
function updateProgress(k) {

}

function simulate(dt) {

function onRaceComplete() {

// podium ceremony at the end of a Grand Prix
function startPodium() {
  const gp = G.gp;
  const order = CHARS.slice().sort((a, b) => gp.pts[b.id] - gp.pts[a.id]);
  const W = G.world, s = W.S ? W.S[Math.floor(W.N * 0.04)] : null;
  const center = s ? [s.p[0], s.p[1], s.p[2]] : [0, 0, 0];
  G.scene = 'podium';
  G.podium = { order, center, yaw: s ? s.yaw + Math.PI : 0, t: 0 };
  G.karts = []; G.proj = []; PS.clear();
  HUD.show(false); UI.hide();
  Music.play('results');
  AU.sfx('finish'); AU.sfx('cheer');
  Cam.orbitA = 0;
  setTimeout(() => { if (G.scene === 'podium') UI.show('gpEnd'); }, 6500);
}

function drawKart(k, o = {}) {

  let alpha = o.alpha ?? 1;

  if (k.out && !k.bomb && G.world && G.world.isArena) alpha = 0.35;
  const flash = (k.invulnT > 0 && k.starT <= 0 && k.respawnT <= 0 && Math.floor(G.time * 16) % 2 === 0) ? 0.55 : 0;
  let tint = [1, 1, 1, 1];

  if (k.bomb) tint = Math.floor(G.time * 6) % 2 ? [1.3, 0.5, 0.4, 1] : [0.5, 0.45, 0.5, 1];

  const steerA = -k.steerVis * 0.45;

  }
  PS.fill();
}

          [0, 1, 2].map((j) => `<span class="b ${j < o.balloons ? '' : 'off'}" style="background:${cssC(o.ch.kart)};display:inline-block;margin-right:.4vmin"></span>`).join('');

const h = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
const UI = {
  root: null, cur: null, items: [], fi: 0, name: '',
  show(name, arg) {
    if (this.cur) this.cur.el.remove();
    const s = Screens[name](arg);
    this.cur = s; this.name = name;
    s.el.classList.add('screen');
    this.root.appendChild(s.el);
    this.items = [...s.el.querySelectorAll('[data-f]')];
    this.items.forEach((el, i) => {
      el.addEventListener('mouseenter', () => { if (this.fi !== i) this.setFocus(i); });
      el.addEventListener('click', (e) => { e.stopPropagation(); this.setFocus(i, true); this.activate(); });
    });
    this.fi = clamp(s.focus ?? 0, 0, Math.max(0, this.items.length - 1));
    this.setFocus(this.fi, true);
    G.idleT = 0;
    updatePrompts();
  },
  hide() { if (this.cur) this.cur.el.remove(); this.cur = null; this.items = []; this.name = ''; updatePrompts(); },
  refresh() { if (this.cur && this.cur.rerender) { const f = this.fi; this.show(this.name, this.cur.arg); this.setFocus(f, true); } },
  setFocus(i, silent) {
    if (!this.items.length) return;
    this.items.forEach((e) => e.classList.remove('focus'));
    this.fi = clamp(i, 0, this.items.length - 1);
    const el = this.items[this.fi]; el.classList.add('focus');
    if (!silent) AU.sfx('move');
    if (this.cur.onFocus) this.cur.onFocus(el.dataset.f, el);
  },
  activate() {
    const el = this.items[this.fi]; if (!el || !this.cur.handle) return;
    if (el.dataset.opt !== undefined) { this.cur.handle(el.dataset.f, 'right'); AU.sfx('move'); return; }
    AU.sfx('select');
    this.cur.handle(el.dataset.f, 'ok');
  },
  move(dx, dy) {
    const el = this.items[this.fi]; if (!el) return;
    if (dx && el.dataset.opt !== undefined) { this.cur.handle(el.dataset.f, dx < 0 ? 'left' : 'right'); AU.sfx('move'); return; }
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let best = -1, bs = 1e9;
    this.items.forEach((e, i) => {
      if (i === this.fi) return;
      const q = e.getBoundingClientRect(), ex = q.left + q.width / 2, ey = q.top + q.height / 2, vx = ex - cx, vy = ey - cy;
      const along = dx ? vx * dx : vy * dy; if (along <= 4) return;
      const score = along + (dx ? Math.abs(vy) : Math.abs(vx)) * 2.4;
      if (score < bs) { bs = score; best = i; }

    if (best < 0 && dy) {
      let ext = -1, ev = dy > 0 ? 1e9 : -1e9;
      this.items.forEach((e, i) => { const q = e.getBoundingClientRect(), y = q.top + q.height / 2; if ((dy > 0 && y < ev) || (dy < 0 && y > ev)) { ev = y; ext = i; } });
      best = ext;

    if (best >= 0 && best !== this.fi) this.setFocus(best);
  },
  update(dt) {
    if (!this.cur) return;
    const U = Input.ui;
    if (this.cur.anyStart && (U.anyBtn || U.confirm)) { AU.sfx('select'); this.cur.anyStart(); return; }
    if (U.up) this.move(0, -1); if (U.down) this.move(0, 1);
    if (U.left) this.move(-1, 0); if (U.right) this.move(1, 0);
    if (U.confirm) this.activate();
    if (U.back && this.cur.back) { AU.sfx('back'); this.cur.back(); return; }
    if (this.cur && this.cur.tab) { if (U.tabL) this.cur.tab(-1); if (U.tabR) this.cur.tab(1); }
    if (this.cur && this.cur.update) this.cur.update(dt);
  },
};

      <p style="margin-top:2vmin;opacity:.75">All characters, tracks, music and sound are original and generated procedurally in code. Not affiliated with Nintendo.</p>
      </div><div class="btnrow">${btn('back', 'Back')}</div></div>`);
    return { el, back: () => UI.show('main'), handle: () => UI.show('main') };
  },
  pause() {
    G.paused = true;
    const el = h(`<div class="dimmer"><div class="h1">Paused</div><div class="sub">${G.world.name}${G.mode === 'gp' ? ' · Race ' + (G.gp.race + 1) + ' of 4' : ''}</div><div class="menu-col">
      ${btn('resume', 'Resume')}${btn('restart', 'Restart')}${btn('howto', 'How to Play')}${btn('settings', 'Settings')}${btn('quit', 'Quit to Menu')}</div></div>`);
    const resume = () => { G.paused = false; UI.hide(); Input.suppressT = 0.15; };
    return { el, back: resume, prompts: [['confirm', 'Select'], ['back', 'Resume']],
      handle: (f) => {
        if (f === 'resume') resume();
        else if (f === 'restart') { G.paused = false; UI.hide(); if (G.mode === 'gp') startGPRace(); else if (G.mode === 'tt') startTT(Sel.tt); else startBattle(); }
        else if (f === 'howto') UI.show('howto', { back: 'pause' });
        else if (f === 'settings') UI.show('settings', { back: 'pause' });
        else if (f === 'quit') { G.paused = false; toMenu('main'); }
      } };
  },
  results() {
    const gp = G.gp, pts = gpPoints();
    const order = G.karts.slice().sort((a, b) => a.place - b.place);
    for (const k of order) { const add = pts[k.place - 1] || 0; gp.last[k.ch.id] = add; gp.pts[k.ch.id] += add; }
    const el = h(`<div class="dimmer"><div class="h1">Race ${gp.race + 1} Results</div><div class="sub">${G.world.name}</div><div class="res">
      ${order.map((k, i) => `<div class="rrow ${k.human || k === G.player ? 'me' : ''}" style="animation-delay:${i * 0.06}s"><span class="pl">${ordinal(k.place)}</span>${faceSVG(k.ch)}<span>${k.ch.name}</span><span>${k.estimated ? '<span style="opacity:.55">' + fmtTime(k.finishTime) + '</span>' : fmtTime(k.finishTime)}</span><span class="pts">+${gp.last[k.ch.id]}</span></div>`).join('')}
      </div><div class="btnrow">${btn('next', 'Continue')}</div></div>`);
    return { el, prompts: [['confirm', 'Continue']], handle: () => UI.show('standings') };
  },
  standings() {
    const gp = G.gp;
    const order = CHARS.slice().sort((a, b) => gp.pts[b.id] - gp.pts[a.id]);
    const last = gp.race === CUP.tracks.length - 1;
    const el = h(`<div class="dimmer"><div class="h1">${last ? 'Final Standings' : 'Cup Standings'}</div><div class="sub">${CUP.name} · after race ${gp.race + 1} of 4</div><div class="res">
      ${order.map((c, i) => `<div class="rrow ${c === CHARS[gp.playerChar] ? 'me' : ''}" style="animation-delay:${i * 0.06}s"><span class="pl">${ordinal(i + 1)}</span>${faceSVG(c)}<span>${c.name}</span><span class="add">+${gp.last[c.id] || 0}</span><span class="pts">${gp.pts[c.id]} pts</span></div>`).join('')}
      </div><div class="btnrow">${btn('next', last ? 'Trophy Ceremony' : 'Next Race')}${btn('quit', 'Quit')}</div></div>`);
    return { el, prompts: [['confirm', 'Select']],
      handle: (f) => {
        if (f === 'quit') { toMenu('main'); return; }
        if (last) startPodium(); else { gp.race++; startGPRace(); }
      } };
  },
  gpEnd() {
    const gp = G.gp, order = CHARS.slice().sort((a, b) => gp.pts[b.id] - gp.pts[a.id]), rank = order.indexOf(CHARS[gp.playerChar]) + 1;
    const col = rank === 1 ? '#ffd23f' : rank === 2 ? '#dfe7f2' : rank === 3 ? '#ffad66' : '#9a8fb0';
    const title = rank === 1 ? 'Champion!' : rank <= 3 ? 'On the podium!' : 'Better luck next cup!';
    const el = h(`<div class="dimmer"><svg class="trophy" viewBox="0 0 100 100"><path d="M28 12 H72 V40 Q72 62 50 64 Q28 62 28 40Z" fill="${col}" stroke="#2b1d3a" stroke-width="5"/><path d="M28 18 Q10 18 12 32 Q14 44 30 46" fill="none" stroke="#2b1d3a" stroke-width="5"/><path d="M72 18 Q90 18 88 32 Q86 44 70 46" fill="none" stroke="#2b1d3a" stroke-width="5"/><rect x="44" y="62" width="12" height="14" fill="${col}" stroke="#2b1d3a" stroke-width="5"/><rect x="30" y="76" width="40" height="12" rx="3" fill="#7a4a2a" stroke="#2b1d3a" stroke-width="5"/><text x="50" y="44" text-anchor="middle" font-family="Lilita One" font-size="22" fill="#2b1d3a">${rank}</text></svg>
      <div class="h1">${title}</div><div class="sub">${CHARS[gp.playerChar].name} finished ${ordinal(rank).replace(/<\/?sup>/g, '')} in the ${CUP.name} (${gp.mirror ? 'Mirror' : gp.cc + 'cc'}) with ${gp.pts[CHARS[gp.playerChar].id]} points.</div>
      <div class="btnrow">${btn('again', 'Race Again')}${btn('menu', 'Main Menu')}</div></div>`);
    return { el, prompts: [['confirm', 'Select']], handle: (f) => { if (f === 'again') { Sel.char = gp.playerChar; startGP(); } else toMenu('main'); } };
  },
  ttResults() {
    const k = G.player, W = G.world, key = 'tt_' + W.id, rec = Records[key];
    const total = k.finishTime, best = Math.min(...k.lapTimes);
    const newTotal = !rec || total < rec.total, newLap = !rec || best < rec.lap;
    if (newTotal || newLap) {
      Records[key] = { total: newTotal ? total : rec.total, lap: newLap ? best : rec.lap, char: newTotal ? CHARS.indexOf(k.ch) : rec.char, ghost: newTotal ? G.ghostRec : rec.ghost };
      saveRecords();
    }
    const el = h(`<div class="dimmer"><div class="h1">${newTotal ? 'New Record!' : 'Time Trial'}</div><div class="sub">${W.name}</div>
      <div class="panel" style="min-width:60vmin"><div class="kv" style="font-size:3.2vmin">
        ${k.lapTimes.map((t, i) => `<b>Lap ${i + 1}</b><span>${fmtTime(t)}${t === best ? ' ⭐' : ''}</span>`).join('')}
        <b>Total</b><span style="font-family:'Lilita One'">${fmtTime(total)}</span>
        <b>Record</b><span>${fmtTime(Records[key].total)}${newTotal ? ' — ghost saved!' : ''}</span>
      </div></div>
      <div class="btnrow">${btn('retry', 'Retry')}${btn('track', 'Change Track')}${btn('menu', 'Main Menu')}</div></div>`);
    return { el, prompts: [['confirm', 'Select']], handle: (f) => { if (f === 'retry') startTT(Sel.tt); else if (f === 'track') { toMenu('ttTrack'); } else toMenu('main'); } };
  },
  battleResults() {
    const win = G.battleWinner, rank = [win, ...G.karts.filter((k) => k !== win && !k.out).sort((a, b) => b.balloons - a.balloons), ...G.elim.slice().reverse().filter((k) => k !== win)];
    const seen = new Set(), order = rank.filter((k) => k && !seen.has(k) && seen.add(k));
    const el = h(`<div class="dimmer"><div class="h1">${win === G.player ? 'Victory!' : win.ch.name + ' Wins!'}</div><div class="sub">Picnic Panic · Balloon Battle</div><div class="res">
      ${order.map((k, i) => `<div class="rrow ${k === G.player ? 'me' : ''}" style="animation-delay:${i * 0.08}s"><span class="pl">${ordinal(i + 1)}</span>${faceSVG(k.ch)}<span>${k.ch.name}</span><span>${k.out ? 'Popped' : k.balloons + ' 🎈'}</span><span class="pts">${k.score} hits</span></div>`).join('')}
      </div><div class="btnrow">${btn('again', 'Rematch')}${btn('menu', 'Main Menu')}</div></div>`);
    return { el, prompts: [['confirm', 'Select']], handle: (f) => (f === 'again' ? startBattle() : toMenu('main')) };
  },
  touch() {
    const el = h(`<div class="dimmer"><div class="logo" style="font-size:12vmin">Nitro<span class="l2">Nibblers</span></div>
      <div class="panel" style="margin-top:5vmin;text-align:center"><div class="h2">Controller or keyboard required</div>
      <p style="font-size:2.6vmin;margin:0 0 2vmin">Connect a PS5 / Xbox controller or a keyboard to race. Touch controls are not supported.</p>
      <div class="btnrow" style="margin-top:0">${btn('settings', 'Settings')}</div></div></div>`);
    return { el, prompts: [], handle: () => UI.show('settings', { back: 'touch' }) };
  },
};

// =====================================================================================
//  BOOT + MAIN LOOP
// =====================================================================================
let GPU = null;
let firstGesture = false;
function onFirstGesture() {
  if (firstGesture) return;
  firstGesture = true;
  AU.init();
  Music.resumePending();
  if (G.mode === 'ambient' && UI.name) Music.play('title');
}
function showFatal(msg) {
  const b = $('boot');
  b.style.display = 'flex';
  b.innerHTML = `<div style="font-size:7vmin">Nitro Nibblers</div><p style="font-size:3vmin">${msg}</p><p>This game renders exclusively with <b>WebGPU</b> (no fallback). Please use a current Chrome, Edge, Safari or Firefox with WebGPU enabled.</p>`;
}
async function boot() {
  Input.init();
  UI.root = $('ui');
  GPU = new Renderer();
  try { await GPU.init($('gpu')); }
  catch (e) { showFatal(e.message || String(e)); return; }
  const status = (t) => { const p = $('boot').querySelector('p'); if (p) p.textContent = t; };
  const tick = () => new Promise((r) => setTimeout(r, 16));
  status('Sculpting critters…'); await tick();
  buildProjectileMeshes(); buildHazardMeshes();
  MESH.critter = GPU.createMesh(Props.critter());
  G.boxMesh = buildItemBox('?');
  for (const c of CHARS) kartMeshes(c);
  {
    const b = new MB();
    b.cyl(3.4, 3.6, 0.6, C(0xfff6e0), 0, 0, 0, 40);
    for (let i = 0; i < 20; i++) { const a = i / 20 * TAU; b.box(0.6, 0.62, 0.3, i % 2 ? C(0xff5d73) : C(0xffd23f), Math.cos(a) * 3.45, 0.3, Math.sin(a) * 3.45); }
    b.cyl(2.6, 2.6, 0.62, C(0x9b5de5), 0, 0.01, 0, 40, true);
    TURNTABLE = GPU.createMesh(b);
    const p = new MB();
    const blk = (x, hgt, col, n) => { p.box(3, hgt, 3, col, x, hgt / 2, 0); p.box(0.8, 0.8, 0.1, WHITE, x, hgt * 0.55, 1.55); void n; };
    blk(0, 3, C(0xffd23f), 1); blk(-3.2, 2, C(0xdfe7f2), 2); blk(3.2, 1.2, C(0xffad66), 3);
    p.box(10, 0.3, 4.5, C(0xff5d73), 0, 0.15, 0);
    PODIUM = GPU.createMesh(p);
  }
  for (let i = 0; i < TRACKS.length; i++) { status(`Paving ${TRACKS[i].name}… (${i + 1}/5)`); await tick(); getWorld(i, false); }
  status('Spreading the picnic blanket… (5/5)'); await tick(); getWorld('arena');
  addEventListener('resize', () => GPU.resize());
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.phase === 'race' && G.player && !G.paused && (G.mode === 'gp' || G.mode === 'tt' || G.mode === 'battle') && !UI.cur) UI.show('pause'); });
  $('boot').style.display = 'none';
  startAmbient();
  Input.touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches && (navigator.maxTouchPoints || 0) > 0;
  UI.show(Input.touchOnly ? 'touch' : 'title');
  let last = performance.now();
  G.idleT = 0;
  const frame = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    try { loop(dt); } catch (e) { console.error(e); }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
function loop(dt) {
  Input.poll(dt);
  const anyIn = Input.consumeAny();
  if (Input.touchOnly && anyIn && Input.last === 'pad') { Input.touchOnly = false; if (UI.name === 'touch') UI.show('title'); }
  // attract mode entry / exit
  if (G.mode === 'attract') {
    if (anyIn) { stopAttract(); }
  } else if (UI.cur && UI.cur.idle && !Input.touchOnly) {
    G.idleT = anyIn ? 0 : (G.idleT || 0) + dt;
    if (G.idleT > 10) { G.idleT = 0; startAttract(); }
  }
  // pause
  if ((G.mode === 'gp' || G.mode === 'tt' || G.mode === 'battle') && G.scene === 'world' && !UI.cur && Input.drive.pause && G.phase !== 'done') { AU.sfx('select'); UI.show('pause'); Input.ui = {}; }
  UI.update(dt);
  if (!G.paused && G.world) {
    if (G.scene === 'world') simulate(dt);
    else { G.time += dt; PS.update(dt); }
  }
  // audio: engine + drift screech for focused human/demo kart
  const fk = G.focus;
  const engOn = !G.paused && G.scene === 'world' && fk && G.mode !== 'ambient' && G.mode !== 'none' && (G.phase === 'race' || G.phase === 'countdown' || G.phase === 'finish');
  if (AU.ctx) {
    AU.engine(engOn && fk.respawnT <= 0, fk ? clamp(Math.abs(fk.speed) / (G.cc.speed * 1.3), 0, 1.2) : 0, fk && fk.boostT > 0, fk ? (fk.shrinkT > 0 ? 1.6 : 1) * (0.8 + 0.2 * (fk.ch.voice || 1)) : 1);
    AU.screech(engOn && fk.drift && fk.grounded ? 1 : 0, fk ? 1 + fk.driftTier * 0.15 : 1);
    AU.musicG && (AU.musicG.gain.value = (Settings.music / 10) * 0.5 * (G.paused ? 0.35 : 1));
  }
  updateCamera(dt);
  HUD.update(dt);
  drawScene();
  const env = G.scene === 'showroom' ? ENVS.arena : G.world.env;
  env.time = G.time;
  env.shadowCenter = G.scene === 'showroom' ? [0, 0, 0] : G.scene === 'podium' ? G.podium.center : (G.focus ? G.focus.pos : Cam.target);
  env.shadowRadius = G.scene === 'showroom' ? 12 : 95;
  GPU.render(Cam, env);
}
boot();
</script>
