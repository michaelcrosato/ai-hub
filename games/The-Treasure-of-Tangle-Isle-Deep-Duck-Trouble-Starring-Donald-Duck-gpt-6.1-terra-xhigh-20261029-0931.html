  var ended = false;

  var goAt = null;

  var reported = false;

  var pending = {};

  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();

  function warn(text) {

for(let i=particles.length-1;i>=0;i--){const a=particles[i];a.life-=dt;a.mesh.position.x+=a.vx*dt;a.mesh.position.y+=a.vy*dt;a.vy-=12*dt;a.mesh.scale.setScalar(Math.max(0,a.life/.6));if(a.life<=0){scene.remove(a.mesh);particles.splice(i,1)}}
if(p.x>115&&gems>=3&&!boss.alive)endGame(true);if(p.x>114&&(gems<3||boss.alive)&&!attract){main.body.setTranslation({x:113.5,y:p.y,z:0},true);textToast(gems<3?'The crown needs all three moonstones!':'Bump the crab with a kicked crate!')}
if(attract&&clock>60)start(true);let target=players.length>1?(p.x+players[1].body.translation().x)/2:p.x;camera.position.x+=(target+3-camera.position.x)*Math.min(1,dt*3);camera.position.y+=(Math.max(6,p.y+4)-camera.position.y)*Math.min(1,dt*2);camera.lookAt(camera.position.x,camera.position.y-5,0);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').style.opacity=0}}
function resize(){const a=innerWidth/innerHeight;camera.left=-7.5*a;camera.right=7.5*a;camera.top=7.5;camera.bottom=-7.5;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function anyInput(){idle=performance.now();if(attract){titleScreen();return true}return false}
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;if(touchOnly){touchOnly=false;$('touch').style.display='none';if(state==='title')showPage('title')}keys[e.code]=true;if(anyInput())return;if(e.code==='Escape'){settings();return}if(overlay.style.display!=='none'){if(['ArrowDown','KeyS'].includes(e.code))moveMenu(1);if(['ArrowUp','KeyW'].includes(e.code))moveMenu(-1);if(['Enter','Space','KeyZ'].includes(e.code))selectMenu();if(['Backspace','KeyX'].includes(e.code)){if(page==='settings')closeSettings();else if(page!=='title')showPage('title')}}else sound()});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('pointerdown',()=>{if(anyInput())return;sound()});
$('touchSettings').onclick=()=>settings();if(touchOnly)$('touch').style.display='block';
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.033,(now-last)/1000);last=now;for(let i=0;i<2;i++){const pad=pollPad(i);if(pad){const activity=pad.buttons.some((b,j)=>b.pressed&&!padPrev[i][j])||pad.axes.some(a=>Math.abs(a)>.4);if(activity){if(touchOnly){touchOnly=false;$('touch').style.display='none';if(state==='title')showPage('title')}if(attract){anyInput();padPrev[i]=pad.buttons.map(b=>b.pressed);continue}idle=now}if(i===1&&state==='play'&&!localTwo&&padPress(pad,i,9)&&!AIHub.active){players.push(createDuck(players[0].body.translation().x-1,0xe97d75));localTwo=true;textToast('A friend joins the expedition!')}else if(i===0){if(padPress(pad,i,9)&&!pad.buttons[8]?.pressed)settings();else if(overlay.style.display!=='none'){if(padPress(pad,i,12)||((pad.axes[1]<(-0.6))&&!padPrev[i][20]))moveMenu(invertY?1:-1);if(padPress(pad,i,13)||((pad.axes[1]>(.6))&&!padPrev[i][21]))moveMenu(invertY?-1:1);if(padPress(pad,i,0))selectMenu();if(padPress(pad,i,1)){if(page==='settings')closeSettings();else if(page!=='title')showPage('title')}}}padPrev[i]=pad.buttons.map(b=>b.pressed);padPrev[i][20]=pad.axes[1]<-.6;padPrev[i][21]=pad.axes[1]>.6}}
if(state==='title'&&page==='title'&&now-idle>10000&&!AIHub.active&&!touchOnly)start(true);if(state==='play'&&!gameEnded&&(!AIHub.active||AIHub.time()>=0))step(dt);renderer.render(scene,camera)}
AIHub.probe(()=>({scene:state==='pause'?'menu':state==='title'?'title':state==='over'?'over':AIHub.active&&AIHub.time()<0?'ready':'play',menu:page==='settings'&&overlay.style.display!=='none',world:clock,input:inputProbe}));
async function init(){try{if(!navigator.gpu)throw Error('WebGPU is unavailable. Use a current WebGPU-enabled browser on a supported device.');await RAPIER.init();renderer=new THREE.WebGPURenderer({antialias:true});await renderer.init();if(!renderer.backend.isWebGPUBackend)throw Error('A WebGPU device could not be started.');renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);makeWorld();resize();addEventListener('resize',resize);$('loading').style.display='none';titleScreen();if(touchOnly)overlay.style.display='none';requestAnimationFrame(frame);if(AIHub.active){const info=await AIHub.connect({mode:'parallel',seats:[1,4]});if(info){sessionConnected=true;start(false);AIHub.on('time-up',()=>endGame(false));AIHub.on('end',()=>{gameEnded=true;state='over';if(audio)audio.suspend();showPage('over')});AIHub.ready()}}}catch(e){console.error(e);$('loading').style.display='none';$('error').style.display='block';$('error').innerHTML='<strong>Oh, feathers!</strong><p>'+String(e.message||e)+'</p>';AIHub.fail(String(e.message||e))}}
init();
</script></body></html>
