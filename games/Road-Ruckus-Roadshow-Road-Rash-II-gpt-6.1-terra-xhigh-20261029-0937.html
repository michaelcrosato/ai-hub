/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

function howto(){state='menu';menu(`<div class="overlay"><div class="card"><div class="label">FIELD GUIDE / 01</div><h2>Ride fast.<br>Fight dirty.</h2><div class="columns"><div><p><b>LEFT STICK</b> steer<br><b>R2 / CROSS</b> gas<br><b>L2</b> brake</p><p><b>SQUARE / CIRCLE</b> hit left / right<br><b>R1</b> spend boost</p></div><div><p><b>ARROWS / WASD</b> steer & gas<br><b>Q / E</b> hit left / right<br><b>SHIFT</b> boost</p><p>Pass the pack, dodge traffic and finish. Hit rivals twice to knock them down. Pick up yellow nitro and white repair crates.</p></div></div><p>Off-road slows you down. Wrecks cost bike health; a tow gets you rolling again. There’s always another road.</p><div class="menu"><button class="choice">Back to garage <small>○ / ESC</small></button></div></div></div>`,[title])}
function openSettings(){if(state==='settings')return;settingsReturn=state;state='settings';settingsMenu()}
function settingsMenu(){let ret=settingsReturn;menu(`<div class="overlay"><div class="card"><div class="label">YOUR RIDE / SETTINGS</div><h2>Make it yours.</h2><p>Changes apply immediately and stay on this device.</p><div class="menu"><button class="choice">Invert horizontal <small>${settings.invertX?'ON':'OFF'}</small></button><button class="choice">Invert vertical <small>${settings.invertY?'ON':'OFF'}</small></button><button class="choice">Sound level <small>${Math.round(settings.volume*100)}%</small></button><button class="choice">${ret==='play'?'Resume ride':'Back'}</button></div><div class="foot">↑ ↓ / D-PAD TO CHOOSE &nbsp; • &nbsp; ✕ / ENTER TO CHANGE<br>OPTIONS / ESC OR ○ TO CLOSE</div></div></div>`,[()=>{settings.invertX=!settings.invertX;saveSettings();settingsMenu();select(0)},()=>{settings.invertY=!settings.invertY;saveSettings();settingsMenu();select(1)},()=>{settings.volume=settings.volume>=1?0:Math.round((settings.volume+.25)*100)/100;saveSettings();settingsMenu();select(2)},closeSettings])}
function closeSettings(){state=settingsReturn;if(state==='play'||state==='attract'){screen.innerHTML='';renderHUD()}else if(state==='menu')howto();else if(state==='over')showOver('finish');else title()}
function about(){state='menu';menu(`<div class="overlay"><div class="card"><div class="label">THE FINE PRINT / 02</div><h2>About the roadshow</h2><div class="about">SOURCE INFORMATION
2026-10-29 09:37 • Source: Road Rash II
Tech: Three.js r180 WebGPU, Rapier 0.19.3, Gamepad API, Web Audio, BroadcastChannel and AI Hub Session Protocol v1.
Art: original cel-shaded comic-book highway. Animation: procedural rigid-part motion and camera easing. Audio: code-generated music, effects and gibberish voices.
Online: AI Hub side-by-side sessions; same-origin browser tabs see each other as riders outside the hub. No remote game server.
Testing: lightweight syntax and headless browser checks; physical controller, multi-device and production GPU tests unknown.
Environment: Codex CLI (headless); Linux; browser: Chrome headless. Model: OpenAI gpt-6.1-terra, xhigh. Usage: unknown.

TESTING FEEDBACK
Issues caught: 1; critical: 1. Headless Chrome lost its WebGPU device, so the 3D presentation could not be verified there. Most helpful: browser smoke test. Least helpful: syntax checking alone.

ENGINE FEEDBACK
Most liked: Three.js scene construction. Got stuck: headless WebGPU presentation. Built here: procedural road, race, AI, combat and audio. Hardest: validating the renderer headlessly. Overhaul: automatic renderer fallback when WebGPU is mandatory. Change: add an explicit WebGPU-only initialization option.

PROMPT FEEDBACK
Most liked: controller-first arcade direction. Confusing: standalone multiplayer scope. Hardest: combining a complete race with networking. Desired test: real multi-device, physical-controller playtest.</div><div class="menu"><button class="choice">Back <small>○ / ESC</small></button></div></div></div>`,[title])}
function showOver(reason){shade.style.display='';let text=reason==='finish'?`YOU FINISHED ${ordinal(game.place)}!`:'TIME CALLED!';let message=game.place===1?'The highway has a new problem. It’s you.':'You made it to the end. The pack will be talking about this one.';let buttons=AIHub.active?[]:[()=>startRun(),title];menu(`<div class="overlay"><div class="card"><div class="label">THE DUSTY COAST / RESULTS</div><h2>${text}</h2><p>${message}</p><div class="columns"><p><b>${formatTime(game.elapsed)}</b><br>RACE TIME</p><p><b>${game.knockouts}</b> KNOCKOUTS<br><b>${game.crashes}</b> WIPEOUTS</p></div><div class="menu">${AIHub.active?'Waiting for the hub…':'<button class="choice">Race again</button><button class="choice">Back to garage</button>'}</div></div></div>`,buttons)}
function ordinal(n){return n+(n===1?'ST':n===2?'ND':n===3?'RD':'TH')}
function formatTime(s){return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}.${Math.floor(s*10)%10}`}
function renderHUD(){screen.innerHTML=`<div class="hud"><div class="hudtop"><div class="hudbox"><div class="hudlabel">POSITION</div><div class="hudbig" id="place">8TH</div></div><div class="hudbox hudright"><div class="hudlabel">DISTANCE LEFT</div><div class="hudbig" id="distance">2.6 <span style="font-size:.3em">KM</span></div></div></div><div class="progress"><div id="progress"></div></div><div class="callout" id="callout"></div><div class="hudbottom"><div class="meters"><div class="meterline">BIKE <div class="meter"><div class="fill" id="health"></div></div></div><div class="meterline">NITRO<div class="meter"><div class="fill boost" id="boost"></div></div></div></div><div class="speed"><span id="speed">0</span> <small>KM/H</small></div></div><div class="hint">□ / Q HIT LEFT &nbsp; • &nbsp; ○ / E HIT RIGHT &nbsp; • &nbsp; R1 / SHIFT BOOST</div>${state==='attract'?'<div class="attract">ATTRACT MODE • PRESS ANY BUTTON</div>':''}</div>`}
function updateHUD(){if(!$('#place'))return;$('#place').textContent=ordinal(game.place);$('#distance').innerHTML=(Math.max(0,CFG.length-game.z)/1000).toFixed(2)+' <span style="font-size:.3em">KM</span>';$('#speed').textContent=Math.round(game.speed*3.6);$('#health').style.width=game.health+'%';$('#boost').style.width=game.boost+'%';$('#progress').style.width=clamp(game.z/CFG.length*100,0,100)+'%';$('#callout').textContent=callTime>0?callText:''}
function control(){let p=[...navigator.getGamepads?.()||[]].find(Boolean),b=p?.buttons||[],a=p?.axes||[];let down=i=>!!b[i]?.pressed,edge=i=>down(i)&&!lastPad[i];let steer=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+(Math.abs(a[0]||0)>.18?a[0]:0);steer=clamp(steer,-1,1)*(settings.invertX?-1:1);let vert=(Math.abs(a[1]||0)>.18?a[1]:0)*(settings.invertY?-1:1);axis={x:steer,y:vert,fire:!!(keys.KeyQ||keys.KeyE||down(1)||down(2))};let anyEdge=b.some((x,i)=>x.pressed&&!lastPad[i]);if(state==='attract'&&(anyEdge||Math.abs(a[0]||0)>.25||Math.abs(a[1]||0)>.25)){title();lastPad=b.map(x=>x.pressed);return {}}if(edge(9)&&!down(8)){if(state==='settings')closeSettings();else openSettings()}
if(['title','menu','settings','over'].includes(state)){let dir=(down(13)||vert>.6?1:0)-(down(12)||vert<-.6?1:0);if(dir&&dir!==padDir){select(menuIndex+dir);idle=0;tone(330,.04,'square',.04)}padDir=dir;if(edge(0)){menuItems[menuIndex]?.click()}if(edge(1)){if(state==='settings')closeSettings();else if(state==='menu')title()} }
let out={steer,gas:Math.max(down(7)?b[7].value:0,down(0)?1:0,keys.ArrowUp||keys.KeyW?1:0,vert<-.3?-vert:0),brake:Math.max(down(6)?b[6].value:0,keys.ArrowDown||keys.KeyS?1:0,vert>.3?vert:0),boost:down(5)||!!keys.ShiftLeft||!!keys.ShiftRight,left:edge(2),right:edge(1)};lastPad=b.map(x=>x.pressed);return out}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Shift'].includes(e.key))e.preventDefault();let first=!keys[e.code];keys[e.code]=true;idle=0;if(!first)return;sound();if(state==='attract'){title();return}if(e.code==='Escape'){if(state==='settings')closeSettings();else if(state==='menu')title();else openSettings();return}if(['title','menu','settings','over'].includes(state)){if(e.code==='ArrowDown'||e.code==='KeyS')select(menuIndex+1);else if(e.code==='ArrowUp'||e.code==='KeyW')select(menuIndex-1);else if(e.code==='Enter'||e.code==='Space')menuItems[menuIndex]?.click()}else if(state==='play'){if(e.code==='KeyQ')attack(-1);if(e.code==='KeyE')attack(1)}});
window.addEventListener('keyup',e=>{keys[e.code]=false});window.addEventListener('blur',()=>{keys={}});window.addEventListener('pointerdown',()=>{idle=0;if(state==='attract')title()});window.addEventListener('pointermove',e=>{if(e.movementX||e.movementY){idle=0;if(state==='attract')title()}});$('#touchSettings').onclick=()=>{sound();openSettings()};if(matchMedia('(pointer:coarse)').matches&&!matchMedia('(pointer:fine)').matches)document.body.classList.add('touch');
const clientId=Math.random().toString(36).slice(2);try{channel=new BroadcastChannel('road-ruckus-roadshow-v1');channel.onmessage=e=>{let m=e.data;if(!m||m.id===clientId||AIHub.active)return;if(m.t==='leave'){let r=remote.get(m.id);if(r){scene.remove(r.mesh);remote.delete(m.id)}return}if(m.t==='rider'&&game&&state==='play'){let r=remote.get(m.id);if(!r){let mesh=bike(0xf2c84b);scene.add(mesh);r={mesh,z:m.z,x:m.x,last:0};remote.set(m.id,r)}r.z=m.z;r.x=m.x;r.last=performance.now()}}}catch{}
function update(dt,inp){if(!game)return;clock+=dt;game.elapsed+=dt;game.hitCooldown=Math.max(0,game.hitCooldown-dt);game.attackCooldown=Math.max(0,game.attackCooldown-dt);game.attackAnim=Math.max(0,game.attackAnim-dt);game.crashTimer=Math.max(0,game.crashTimer-dt);if(callTime>0)callTime-=dt;
if(state==='attract'){inp={gas:1,steer:Math.sin(game.z/85)*.4,boost:game.boost>15,left:false,right:false};if(Math.floor(game.elapsed*2)%8===0)attack(Math.random()<.5?-1:1);game.health=100}
if(inp.left)attack(-1);if(inp.right)attack(1);let off=Math.abs(game.x)>6;let boosting=inp.boost&&game.boost>1&&game.speed>12&&!off;let max=off?22:boosting?56:CFG.cruise;game.speed+=((inp.gas||0)*15-(inp.brake||0)*24-3.4)*dt;if(!inp.gas)game.speed-=5*dt;if(game.speed>max)game.speed-=18*dt;game.speed=clamp(game.speed,0,boosting?58:48);if(boosting)game.boost=Math.max(0,game.boost-18*dt);else game.boost=Math.min(100,game.boost+2.2*dt);game.x=clamp(game.x+(inp.steer||0)*dt*(4+game.speed*.12),-14,14);game.z+=game.speed*dt;let px=curve(game.z)+game.x;playerBody.setNextKinematicTranslation({x:px,y:.8,z:game.z});world.timestep=dt;world.step(events);events.drainCollisionEvents((a,b,started)=>{if(!started)return;let h=a===playerCollider.handle?b:b===playerCollider.handle?a:null;if(h===null)return;let o=objects.find(x=>x.c.handle===h);if(o)collect(o)});
playerBike.position.set(px,0,game.z);playerBike.rotation.y=heading(game.z);playerBike.userData.lean.rotation.z=-(inp.steer||0)*.27+(game.crashTimer>0?Math.sin(game.crashTimer*10)*.45:0);playerBike.userData.torso.rotation.z=game.attackAnim>0?-game.attackSide*.65:0;
for(let r of racers){if(r.down>0){r.down-=dt;r.speed=Math.max(12,r.speed-3*dt)}else r.speed=mix(r.speed,31+(r.name.length%4)*1.7,dt*.3);r.z+=r.speed*dt;r.x=clamp(r.x+Math.sin(clock*.6+r.z*.01)*dt*.45,-5,5);r.mesh.position.set(curve(r.z)+r.x,0,r.z);r.mesh.rotation.y=heading(r.z);r.mesh.userData.lean.rotation.z=r.down>0?1.1:Math.sin(clock+r.z)*.08;if(r.down<=0&&Math.abs(r.z-game.z)<1.8&&Math.abs(r.x-game.x)<1.1&&game.hitCooldown===0){game.hitCooldown=1.2;game.speed*=.83;game.health=Math.max(5,game.health-5);game.x+=r.x>game.x?-1:1;tone(90,.12,'sawtooth',.09,.7);if(r.police)say('THE LAW WANTS A WORD!',1)}if(r.down<=0&&Math.abs(r.z-game.z)<3&&Math.abs(r.x-game.x)<2.5&&game.hitCooldown===0&&Math.random()<dt*.13){game.health-=7;game.hitCooldown=1.3;voice();say(r.name+' SAYS HELLO!',1)}}
for(let [id,r] of remote){if(performance.now()-r.last>3000){scene.remove(r.mesh);remote.delete(id);continue}r.mesh.position.lerp(new THREE.Vector3(curve(r.z)+r.x,0,r.z),Math.min(1,dt*8));r.mesh.rotation.y=heading(r.z)}
game.place=1+racers.filter(r=>r.z>game.z).length+[...remote.values()].filter(r=>r.z>game.z).length;let lookZ=game.z+24;let target=new THREE.Vector3(curve(game.z)+game.x*.65,5.1,game.z-10);camera.position.lerp(target,1-Math.exp(-dt*4));camera.lookAt(curve(lookZ)+game.x*.3,1,lookZ);updateHUD();networkTimer-=dt;if(networkTimer<=0){networkTimer=.1;if(channel&&!AIHub.active&&state==='play')channel.postMessage({t:'rider',id:clientId,z:game.z,x:game.x});if(AIHub.active)AIHub.progress({score:Math.round(game.z),label:`${Math.round(game.z)} m`})}if(game.z>=CFG.length){if(state==='attract')startRun(true);else endRun()}}
async function init(){try{if(!navigator.gpu)throw Error('This game needs a WebGPU-capable browser and graphics device. Enable WebGPU or try a supported desktop browser.');const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('No WebGPU adapter was found. Check browser and graphics settings.');await RAPIER.init();world=new RAPIER.World({x:0,y:0,z:0});events=new RAPIER.EventQueue(true);renderer=new THREE.WebGPURenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));await renderer.init();if(!renderer.backend.isWebGPUBackend)throw Error('WebGPU could not initialize. This game does not use a WebGL fallback.');renderer.backend.device.lost.then(info=>{if(info.reason!=='destroyed'){sessionStopped=true;muted=true;$('#error').style.display='flex';$('#errorText').textContent='The WebGPU device was lost. Reload the page or check your browser and graphics driver.';if(AIHub.active)AIHub.fail('WebGPU device lost')}});document.body.prepend(renderer.domElement);terrain();makeRoad();camera.position.set(0,5,-10);camera.lookAt(0,1,30);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
AIHub.probe(()=>({scene:state==='attract'?'play':state==='settings'?'menu':state==='over'?'over':state==='play'?'play':state==='title'?'title':'menu',menu:state==='settings',world:clock,input:axis}));
if(AIHub.active){let info=await AIHub.connect({mode:'parallel',seats:[1,4]});if(info){startRun();AIHub.on('time-up',()=>{if(game&&!game.finished)endRun('time')});AIHub.on('end',()=>{sessionStopped=true;muted=true;if(game&&!game.finished){game.finished=true;state='over';showOver('time')}});AIHub.ready()}else title()}else title();renderer.setAnimationLoop(frame)}catch(e){console.error(e);$('#error').style.display='flex';$('#errorText').textContent=e.message||String(e);if(AIHub.active)AIHub.fail(String(e.message||e))}}
function frame(now){let dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;let inp=control();if(state==='title'){idle+=dt;if(idle>=10&&!document.body.classList.contains('touch'))startRun(true)}if((state==='play'||state==='attract')&&!sessionStopped&&(!AIHub.active||AIHub.time()>=0))update(dt,inp);else if(state==='title'||state==='menu'||state==='settings'||state==='over'){if(!game){clock+=dt;camera.position.set(Math.sin(clock*.15)*4,5,-10);camera.lookAt(curve(40),1,40)}}updateAudio(dt);renderer.render(scene,camera)}
init();
