<!--
ROCKET TEAGUE — a Rocket League spiritual successor

== Source Information ==

Date: 2026-10-28 22:38

Source: Rocket League (Psyonix) — Rocket Teague is an original, unaffiliated spiritual successor.

Tech: Three.js r180 (three.webgpu.js, WebGPURenderer, TSL node materials — WebGPU only, no fallback) · Rapier 3D 0.19.3 (@dimforge/rapier3d-compat, WASM) for physics · Web Audio API (all music & SFX synthesized at runtime) · Web Speech API (announcer) · Gamepad API (+ vibration) · PeerJS 1.5.5 / WebRTC data channels for online · plain ES modules, no framework, bundled into one HTML file by a small Node script.

Art Direction: Stylized cel-shading: MeshToonNodeMaterial with a 4-step hard gradient ramp, inverted-hull ink outlines on cars, ball, goals and props, saturated team colours, procedural canvas textures (field, hex walls, ball), gradient sky domes, toon clouds / stars / snowmen / trees per arena.

Animation: Code-driven procedural animation: physics-driven car bodies with raycast suspension (wheel travel, steering, spin), boost-flame flicker, antenna sway, GPU (TSL vertex shader) crowd bouncing that reacts to excitement, instanced particle system (boost trails, sparks, dust, demolition explosions, goal explosions, confetti), shock rings, camera shake and FOV kick, recorded-transform instant replays with slow-motion.

Audio: Procedural Web Audio: two looping synth tracks plus a victory sting (sequenced drums, bass, arps, pads, lead), per-car engine synths with stereo panning, boost hiss, hits, bounces, jumps, flips, pad pickups, demolitions, goal horn, crowd ambience and cheers, UI blips. Voice: browser speech synthesis announcer ("What a save!", "Overtime!"), plus RL-style quick chat text.

Online: Private online lobbies via 4-letter room codes, WebRTC peer-to-peer data channels with PeerJS public signaling; host-authoritative simulation, 30 Hz snapshots with client interpolation, input streaming, synced FX events, quick chat, team switching, bot takeover on disconnect. Mixed online + local split-screen on the host (up to 4 humans total).

Testing: Lightweight: headless Chrome 154 (Playwright-core) with SwiftShader WebGPU, scripted smoke tests that boot the game, step through menus, run each mode and the attract mode, inject inputs and check physics/state invariants and console errors, plus screenshots for visual checks. No real GPU, gamepad or second machine was available, so online play was tested with two headless pages on the same machine.

Environment: Claude Code CLI (headless); Linux; browser unknown

Model: Anthropic, claude-opus-5-5, reasoning effort medium

Usage: unknown — no token or cost meter is exposed to the model in this session. Rough estimate only: ~3–5M total tokens processed (overwhelmingly cached context re-reads; roughly 90–110K output tokens), roughly $15–35 USD; session time about 1 hour 5 minutes (22:38 → ~23:45).

== How to Play ==

Controller (PS5 layout): R2 drive · L2 brake/reverse · Left stick steer / air pitch & yaw · ✕ jump (twice = double jump; with stick = dodge-flip) · ○ boost · □ powerslide / free air roll · L1/R1 directional air roll · △ ball cam · R3 use Rumble item · D-pad quick chat · Options pause · Create scoreboard (Free Play: reset ball).

Keyboard & mouse: W/S drive & pitch · A/D steer · Space or RMB jump · Shift or LMB boost · Ctrl powerslide / air roll · Q/E air roll · C ball cam · F item · 1-4 quick chat · Tab scoreboard · R reset ball · Esc pause. Second keyboard player: arrows · / jump · . boost · , slide · M ball cam · K/L air roll · N item.

Modes: Soccar · Heatseeker · Rumble · Moon Ball · Mega Ball · Free Play · Rookie Camp. Exhibition supports 1v1 to 4v4 with bots, up to 4 local split-screen players, and private online matches.

== Testing Feedback ==

How many issues did testing catch? 19 — big boost pads placed on the curved wall ramps (Rookie Camp's pad step could stall); the Rookie Camp double-jump target too strict to hit reliably; boost too weak for aerials (acceleration only 1.38× gravity, raised to ~1.54×); a torn-down match still accepting update calls; sub-frame key taps dropped; Esc-to-resume instantly re-pausing; a pause-button race (pause read from car controls, resume from menu events, so one press could act twice); sound effects crashing before the AudioContext existed (goal in attract mode); dodge-flips leaving residual spin so cars landed on their roofs; weak air damping; soft ball hits; clients not noticing the host leaving; duplicate online names; main-menu, exhibition, garage, About and post-match layouts overflowing at 720p; player HUD showing during replays.

Critical / game-breaking: 2 — the audio crash (killed the frame loop the first time a goal was scored before any input) and the pause handling (keyboard players could get stuck paused; fixed by routing pause and resume through one menu event stream).

Most helpful test: deterministic mechanics runs that step the match at a fixed 1/60 s with injected controller states (throttle, steer, jump, flip, aerial, wall-drive, demolition, ball hit) and print measured speeds/heights/orientation.

Least helpful test: plain page screenshots — headless Chrome cannot composite a WebGPU canvas, so they came back white; captures had to be rendered to a render target and read back instead.

== Engine Feedback ==

Liked most: Three.js r180's WebGPU path is close to a drop-in for the classic API — MeshToonNodeMaterial plus a TSL positionNode gave cel shading and a GPU-animated crowd in a few lines. Rapier's compat build (WASM inlined) loads from a CDN with zero setup and its castRayAndGetNormal + collision-group filtering made raycast suspension easy.

Stuck / guessed wrong: WebGPU viewport/scissor conventions and clearing behaviour for split-screen (solved with autoClear=false + one manual clear); Rapier addForce being persistent (used impulses instead); jump frames being eaten by the suspension (needed a short "jump grace" window).

Most important thing built myself: the arcade car controller — raycast suspension, wall/ceiling sticking, grip and powerslide, jump/double-jump/dodge-flip, air control, flip resets — on top of a generic rigid body; plus the swept rounded-arena trimesh shared by renderer and physics.

Hardest part: making a dynamic rigid body feel like an arcade car (stable on curved walls, crisp jumps) without a built-in vehicle model that fits Rocket League's rules.

Remove or overhaul: Three's dual material system (classic vs. Node materials) — it is unclear which classic materials auto-convert and which features (e.g. outlines, post FX with multiple viewports) only work in the node world.

Change one thing: first-class multi-viewport rendering in WebGPURenderer (per-viewport clear and post-processing) and an official cel/outline material — split-screen + toon outlines is a common game need.

== Prompt Feedback ==

Liked most: Clear deliverable shape (one HTML file, named exactly) and the explicit 10-foot / controller-first UX direction with concrete edge cases (stick inversion toggles, touch-only message, attract mode).

Confusing: "Online multiplayer" without a provided server — a fully serverless option needs public signaling (PeerJS) that cannot be guaranteed. "Performance: unlimited" vs. a single-file web deliverable. Testing Feedback is requested in the list but not in the "Done" condition.

Hardest: Fitting every system (physics car, 7 modes, AI, replays, split-screen, online, training, attract mode, audio) into one coherent, polished single file in one session.

One test I wish I could run: a real two-machine online match with physical PS5 controllers on a GPU-backed browser, to judge latency, game feel and controller glyph/haptics end to end.

== Credits ==

Design, code, art, music and sound: generated in-session by Claude (claude-opus-5-5). Libraries: Three.js (MIT), Rapier (Apache-2.0), PeerJS (MIT). Fonts: Russo One & Exo 2 (Google Fonts, OFL). Rocket League is a trademark of Psyonix; this is an unaffiliated homage.
-->

const ABOUT_HTML = "<h3>Source Information</h3>\n<p><b>Date:</b> 2026-10-28 22:38</p>\n<p><b>Source:</b> Rocket League (Psyonix) — Rocket Teague is an original, unaffiliated spiritual successor.</p>\n<p><b>Tech:</b> Three.js r180 (three.webgpu.js, WebGPURenderer, TSL node materials — WebGPU only, no fallback) · Rapier 3D 0.19.3 (@dimforge/rapier3d-compat, WASM) for physics · Web Audio API (all music &amp; SFX synthesized at runtime) · Web Speech API (announcer) · Gamepad API (+ vibration) · PeerJS 1.5.5 / WebRTC data channels for online · plain ES modules, no framework, bundled into one HTML file by a small Node script.</p>\n<p><b>Art Direction:</b> Stylized cel-shading: MeshToonNodeMaterial with a 4-step hard gradient ramp, inverted-hull ink outlines on cars, ball, goals and props, saturated team colours, procedural canvas textures (field, hex walls, ball), gradient sky domes, toon clouds / stars / snowmen / trees per arena.</p>\n<p><b>Animation:</b> Code-driven procedural animation: physics-driven car bodies with raycast suspension (wheel travel, steering, spin), boost-flame flicker, antenna sway, GPU (TSL vertex shader) crowd bouncing that reacts to excitement, instanced particle system (boost trails, sparks, dust, demolition explosions, goal explosions, confetti), shock rings, camera shake and FOV kick, recorded-transform instant replays with slow-motion.</p>\n<p><b>Audio:</b> Procedural Web Audio: two looping synth tracks plus a victory sting (sequenced drums, bass, arps, pads, lead), per-car engine synths with stereo panning, boost hiss, hits, bounces, jumps, flips, pad pickups, demolitions, goal horn, crowd ambience and cheers, UI blips. Voice: browser speech synthesis announcer (\"What a save!\", \"Overtime!\"), plus RL-style quick chat text.</p>\n<p><b>Online:</b> Private online lobbies via 4-letter room codes, WebRTC peer-to-peer data channels with PeerJS public signaling; host-authoritative simulation, 30 Hz snapshots with client interpolation, input streaming, synced FX events, quick chat, team switching, bot takeover on disconnect. Mixed online + local split-screen on the host (up to 4 humans total).</p>\n<p><b>Testing:</b> Lightweight: headless Chrome 154 (Playwright-core) with SwiftShader WebGPU, scripted smoke tests that boot the game, step through menus, run each mode and the attract mode, inject inputs and check physics/state invariants and console errors, plus screenshots for visual checks. No real GPU, gamepad or second machine was available, so online play was tested with two headless pages on the same machine.</p>\n<p><b>Environment:</b> Claude Code CLI (headless); Linux; browser unknown</p>\n<p><b>Model:</b> Anthropic, claude-opus-5-5, reasoning effort medium</p>\n<p><b>Usage:</b> unknown — no token or cost meter is exposed to the model in this session. Rough estimate only: ~3–5M total tokens processed (overwhelmingly cached context re-reads; roughly 90–110K output tokens), roughly $15–35 USD; session time about 1 hour 5 minutes (22:38 → ~23:45).</p>\n\n<h3>How to Play</h3>\n<p><b>Controller (PS5 layout):</b> R2 drive · L2 brake/reverse · Left stick steer / air pitch &amp; yaw · ✕ jump (twice = double jump; with stick = dodge-flip) · ○ boost · □ powerslide / free air roll · L1/R1 directional air roll · △ ball cam · R3 use Rumble item · D-pad quick chat · Options pause · Create scoreboard (Free Play: reset ball).</p>\n<p><b>Keyboard &amp; mouse:</b> W/S drive &amp; pitch · A/D steer · Space or RMB jump · Shift or LMB boost · Ctrl powerslide / air roll · Q/E air roll · C ball cam · F item · 1-4 quick chat · Tab scoreboard · R reset ball · Esc pause. <b>Second keyboard player:</b> arrows · / jump · . boost · , slide · M ball cam · K/L air roll · N item.</p>\n<p><b>Modes:</b> Soccar · Heatseeker · Rumble · Moon Ball · Mega Ball · Free Play · Rookie Camp. Exhibition supports 1v1 to 4v4 with bots, up to 4 local split-screen players, and private online matches.</p>\n\n<h3>Testing Feedback</h3>\n<p><b>How many issues did testing catch?</b> 19 — big boost pads placed on the curved wall ramps (Rookie Camp's pad step could stall); the Rookie Camp double-jump target too strict to hit reliably; boost too weak for aerials (acceleration only 1.38× gravity, raised to ~1.54×); a torn-down match still accepting update calls; sub-frame key taps dropped; Esc-to-resume instantly re-pausing; a pause-button race (pause read from car controls, resume from menu events, so one press could act twice); sound effects crashing before the AudioContext existed (goal in attract mode); dodge-flips leaving residual spin so cars landed on their roofs; weak air damping; soft ball hits; clients not noticing the host leaving; duplicate online names; main-menu, exhibition, garage, About and post-match layouts overflowing at 720p; player HUD showing during replays.</p>\n<p><b>Critical / game-breaking:</b> 2 — the audio crash (killed the frame loop the first time a goal was scored before any input) and the pause handling (keyboard players could get stuck paused; fixed by routing pause and resume through one menu event stream).</p>\n<p><b>Most helpful test:</b> deterministic mechanics runs that step the match at a fixed 1/60 s with injected controller states (throttle, steer, jump, flip, aerial, wall-drive, demolition, ball hit) and print measured speeds/heights/orientation.</p>\n<p><b>Least helpful test:</b> plain page screenshots — headless Chrome cannot composite a WebGPU canvas, so they came back white; captures had to be rendered to a render target and read back instead.</p>\n\n<h3>Engine Feedback</h3>\n<p><b>Liked most:</b> Three.js r180's WebGPU path is close to a drop-in for the classic API — MeshToonNodeMaterial plus a TSL positionNode gave cel shading and a GPU-animated crowd in a few lines. Rapier's compat build (WASM inlined) loads from a CDN with zero setup and its castRayAndGetNormal + collision-group filtering made raycast suspension easy.</p>\n<p><b>Stuck / guessed wrong:</b> WebGPU viewport/scissor conventions and clearing behaviour for split-screen (solved with autoClear=false + one manual clear); Rapier addForce being persistent (used impulses instead); jump frames being eaten by the suspension (needed a short \"jump grace\" window).</p>\n<p><b>Most important thing built myself:</b> the arcade car controller — raycast suspension, wall/ceiling sticking, grip and powerslide, jump/double-jump/dodge-flip, air control, flip resets — on top of a generic rigid body; plus the swept rounded-arena trimesh shared by renderer and physics.</p>\n<p><b>Hardest part:</b> making a dynamic rigid body feel like an arcade car (stable on curved walls, crisp jumps) without a built-in vehicle model that fits Rocket League's rules.</p>\n<p><b>Remove or overhaul:</b> Three's dual material system (classic vs. Node materials) — it is unclear which classic materials auto-convert and which features (e.g. outlines, post FX with multiple viewports) only work in the node world.</p>\n<p><b>Change one thing:</b> first-class multi-viewport rendering in WebGPURenderer (per-viewport clear and post-processing) and an official cel/outline material — split-screen + toon outlines is a common game need.</p>\n\n<h3>Prompt Feedback</h3>\n<p><b>Liked most:</b> Clear deliverable shape (one HTML file, named exactly) and the explicit 10-foot / controller-first UX direction with concrete edge cases (stick inversion toggles, touch-only message, attract mode).</p>\n<p><b>Confusing:</b> \"Online multiplayer\" without a provided server — a fully serverless option needs public signaling (PeerJS) that cannot be guaranteed. \"Performance: unlimited\" vs. a single-file web deliverable. Testing Feedback is requested in the list but not in the \"Done\" condition.</p>\n<p><b>Hardest:</b> Fitting every system (physics car, 7 modes, AI, replays, split-screen, online, training, attract mode, audio) into one coherent, polished single file in one session.</p>\n<p><b>One test I wish I could run:</b> a real two-machine online match with physical PS5 controllers on a GPU-backed browser, to judge latency, game feel and controller glyph/haptics end to end.</p>\n\n<h3>Credits</h3>\n<p>Design, code, art, music and sound: generated in-session by Claude (claude-opus-5-5). Libraries: Three.js (MIT), Rapier (Apache-2.0), PeerJS (MIT). Fonts: Russo One &amp; Exo 2 (Google Fonts, OFL). Rocket League is a trademark of Psyonix; this is an unaffiliated homage.</p>\n";

const Input = {
  keys: new Set(), keysPrev: new Set(), tapped: new Set(), mouse: { l: false, r: false },
  devices: {}, lastActivity: performance.now(), gpPrev: {}, navRepeat: {}, events: [], anyPressed: false,
  init() {

    });

    addEventListener('blur', () => this.keys.clear());

  },
  touch() { this.lastActivity = performance.now(); },
  // taps shorter than a frame still register for one poll (latched in `tapped`)

  keyPressed(c) { return this.tapped.has(c) || (this.keys.has(c) && !this.keysPrev.has(c)); },
  // Called once per rendered frame.
  poll(dt) {
    this.events.length = 0; this.anyPressed = false;
    const k = (c) => this.key(c), kp = (c) => this.keyPressed(c);
    // ---- keyboard set A (+ mouse) ----

class ParticlePool {

  }
  emit(p, v, { life = 1, s0 = 0.5, s1 = 0, color = 0xffffff, g = 0, drag = 1 } = {}) {
    const i = this.cursor; this.cursor = (this.cursor + 1) % this.max;

    this.mesh.setColorAt(i, this.tmpC.set(color)); this.mesh.instanceColor.needsUpdate = true;
  }

      o.life += dt; if (o.life >= o.max) { o.alive = false; this.mesh.setMatrixAt(i, this.zero); continue; }

}

  const S = buildArenaSurface(), all = new Uint32Array([...S.idx[0], ...S.idx[1], ...S.idx[2]]);

  fixed(RAPIER.ColliderDesc.trimesh(cv, ci), 0, 0, 0);

    fixed(RAPIER.ColliderDesc.cuboid(1, GH / 2 + 1, GD / 2 + 1), -(GW / 2 + 1), GH / 2, zs * (hz + GD / 2));

// ---------------------------------------------------------------- flow helpers
function makeBots(players, size) {
  const used = new Set(players.map(p => p.name)), names = DATA.botNames.filter(n => !used.has(n));
  for (const t of [0, 1]) {
    const have = players.filter(p => p.team === t).length;
    for (let k = have; k < size; k++) players.push({ name: names.splice((Math.random() * names.length) | 0, 1)[0] || 'Bot', team: t, kind: 'bot', cfg: randomCfg(), skill: MATCH_OPTS.skill });
  }
  return players;
}
function randomCfg() { return { body: (Math.random() * DATA.bodies.length) | 0, paint: 0, accent: (Math.random() * DATA.paints.length) | 0, wheels: (Math.random() * DATA.wheels.length) | 0, trail: Math.random() < 0.5 ? 4 : (Math.random() * 4) | 0, topper: Math.random() < 0.5 ? 0 : (Math.random() * DATA.toppers.length) | 0 }; }
function optsToMatch(o) { const mode = DATA.modes.filter(m => m.timed)[o.mode]; return { mode: mode.id, arena: DATA.arenas[o.arena].id, duration: DURS[o.duration], botSkill: o.skill, teamSize: o.size + 1 }; }
function startLocalMatch() {
  const humans = UI.joined.map((j, i) => ({ name: i === 0 ? Settings.playerName : 'Player ' + (i + 1), team: j.team, kind: 'local', device: j.device, cfg: i === 0 ? { ...Profile } : { ...randomCfg(), paint: 0 } }));
  const mo = optsToMatch(MATCH_OPTS);
  startMatch({ ...mo, players: makeBots(humans, mo.teamSize) });
}
function startSolo(mode) {
  const players = [{ name: Settings.playerName, team: 0, kind: 'local', device: UI.p1, cfg: { ...Profile } }];
  if (mode === 'rookie') players.push({ name: 'Dummy', team: 1, kind: 'bot', dummy: true, cfg: randomCfg() });
  startMatch({ mode, arena: mode === 'rookie' ? 'park' : DATA.arenas[MATCH_OPTS.arena].id, duration: 5, botSkill: 1, players });
}
function startHostMatch() {
  const mo = optsToMatch(MATCH_OPTS);
  const humans = Net.lobby.players.map(p => ({ name: p.name, team: p.team, kind: p.owner === 'host' ? 'local' : 'remote', device: p.device, owner: p.owner, cfg: p.cfg || { ...Profile } }));
  const players = makeBots(humans, Math.max(mo.teamSize, ...[0, 1].map(t => humans.filter(h => h.team === t).length)));
  Net.hostStart(players);
  startMatch({ ...mo, players, net: 'host' });
}
function startClientMatch(d) {
  const mo = optsToMatch(d.opts), me = Net.peer && Net.peer.id;
  const players = d.players.map(p => ({ name: p.name, team: p.team, cfg: sanitizeCfg(p.cfg), kind: p.owner === me ? 'local' : 'remote', device: p.owner === me ? UI.p1 : null }));
  if (MATCH) endMatchToMenu(false);
  startMatch({ ...mo, players, net: 'client' });
}
function startMatch(opts) {
  UI.go(''); $('screens').innerHTML = ''; Menu3D.hide();
  new Match(opts);
}
function endMatchToMenu(toMain) {
  if (MATCH) { if (MATCH.training) MATCH.training.dispose(); MATCH.dispose(); }
  if (speechSynthesis) speechSynthesis.cancel();
  Sound.Music.play('menu'); Sound.Music.intensity = 1;
  Menu3D.show();
  if (toMain) UI.go('main');
}
function resumeMatch() { if (MATCH) MATCH.paused = false; UI.resumeAt = performance.now(); UI.go(''); $('screens').innerHTML = ''; }
Bus.on('pause', () => { if (!MATCH || UI.name === 'pause' || MATCH.opts.attract || performance.now() - (UI.resumeAt || 0) < 350) return; if (!MATCH.net) MATCH.paused = true; UI.go('pause'); });
Bus.on('matchEnded', (m) => { if (m.opts.attract) { Game.nextAttract(); return; } if (m.training) return; if (m.humans[0]) { const won = m.score[m.humans[0].team] > m.score[1 - m.humans[0].team]; if (won) Profile.wins++; Profile.goals += m.humans.reduce((s, c) => s + c.stats.goals, 0); saveProfile(); } $('hud').classList.remove('on'); UI.go('post', { m }); });
Bus.on('trainingDone', () => endMatchToMenu(true));
Bus.on('netClosed', (msg) => { toast('🌐 ' + msg, 3500); if (MATCH && MATCH.net) endMatchToMenu(true); else if (['clientLobby', 'join', 'hostLobby'].includes(UI.name)) UI.go('online'); });

const Menu3D = {
  mode: 'menu', t: 0, car: null, visible: true, boostDemo: 0,
  show() { this.visible = true; buildArena(DATA.arenas[0]); this.rebuildCar(0); this.platform.visible = true; },
  hide() { this.visible = false; if (this.car) { R.scene.remove(this.car.root); this.car = null; } this.platform.visible = false; },
  init() {
    this.platform = new THREE.Group();
    const disc = mesh(new THREE.CylinderGeometry(6, 6.6, 0.5, 40), toon(0x22284a), { outline: 0.08 }); disc.position.y = 0.25; this.platform.add(disc);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(6.3, 0.15, 6, 48), new THREE.MeshBasicNodeMaterial({ color: 0xffe14d })); ring.rotation.x = Math.PI / 2; ring.position.y = 0.52; this.platform.add(ring);
    R.scene.add(this.platform); this.show();
  },
  rebuildCar(team) {
    if (this.car) R.scene.remove(this.car.root);
    this.car = buildCarModel(Profile, team); this.car.root.position.set(0, 1.5, 0); R.scene.add(this.car.root);
  },
  update(dt) {
    if (!this.visible) return;
    this.t += dt; const cam = R.menuCam;
    if (this.car) {
      this.car.root.rotation.y = this.t * 0.5; this.car.root.position.y = 1.48 + Math.sin(this.t * 2) * 0.03;
      this.car.wheels.forEach(w => w.spin.rotation.x += dt * 3);
      this.boostDemo -= dt; const on = this.boostDemo > 0 || (this.mode === 'menu' && Math.sin(this.t * 0.8) > 0.7);
      this.car.flame.visible = on; if (on) this.car.flame.scale.z = 0.8 + Math.random() * 0.5;
      if (on && Math.random() < 0.6) { const p = new V3(0, 0.07, -2.4).applyQuaternion(this.car.root.quaternion).add(this.car.root.position); FX.glow.emit(p, new V3(0, 0, -8).applyQuaternion(this.car.root.quaternion), { life: 0.4, s0: 0.4, s1: 0, color: Math.random() < 0.5 ? this.car.colors.t1 : this.car.colors.t2, drag: 2 }); }
    }
    if (this.mode === 'garage') { cam.position.lerp(new V3(-9.5, 4.2, 9.5), 1 - Math.exp(-4 * dt)); cam.lookAt(-5.6, 1.0, 1.8); }
    else { const a = this.t * 0.08; cam.position.lerp(new V3(Math.cos(a) * 26, 9 + Math.sin(this.t * 0.2) * 2, Math.sin(a) * 26), 1 - Math.exp(-2 * dt)); cam.lookAt(0, 3, 0); }
    cam.aspect = innerWidth / innerHeight; cam.fov = 50; cam.updateProjectionMatrix();
    if (R.spinners) for (const s of R.spinners) s.rotation.z += s.userData.spin * dt;
    FX.update(dt); Sound.updateCrowd(dt);
  },
  render() { const r = R.renderer; r.setRenderTarget(R.captureRT || null); r.setScissorTest(false); r.clear(); r.setViewport(0, 0, innerWidth, innerHeight); r.render(R.scene, R.menuCam); },
};

// ---- 90_main.js ----
// ============================================================================
// MAIN — boot, attract mode, frame loop
// ============================================================================
const Game = {
  attractIdx: 0, attractOn: false, attractStart: 0,
  startAttract() {
    const modes = ['soccar', 'rumble', 'heatseeker', 'moonball', 'megaball'], sizes = [2, 3, 2, 3, 2];
    const k = this.attractIdx++ % modes.length;
    UI.go(''); $('screens').innerHTML = ''; Menu3D.hide();
    const players = makeBots([], sizes[k]).map(p => ({ ...p, skill: 2 }));
    this.attractOn = true; this.attractStart = performance.now(); $('attract').classList.add('on');
    new Match({ mode: modes[k], arena: DATA.arenas[k % DATA.arenas.length].id, duration: 1.5, botSkill: 2, players, attract: true });
  },
  stopAttract() { this.attractOn = false; $('attract').classList.remove('on'); endMatchToMenu(false); UI.go('title'); Input.touch(); },
  nextAttract() { endMatchToMenu(false); this.startAttract(); },
};
function fatal(title, msg) {
  const f = $('fatal'); f.style.display = 'flex'; $('loading').style.display = 'none';
  f.innerHTML = `<div class="logo" style="font-size:8vh">ROCKET<br>TEAGUE</div><h2>${esc(title)}</h2><p style="max-width:60ch;font-size:1.2em;color:#a9b4e8">${esc(msg)}</p>`;
}
function setLoad(p) { const b = $('loadbar'); if (b) b.style.width = Math.round(p * 100) + '%'; }
let lastT = performance.now();
function frame() {
  const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  Input.poll(dt);
  if (Game.attractOn) {
    if (Input.lastActivity > Game.attractStart + 400) Game.stopAttract();
  } else {
    UI.handle();
    if (!MATCH && (UI.name === 'title' || UI.name === 'main') && now - Input.lastActivity > 10000) Game.startAttract();
  }
  if (MATCH) { MATCH.update(dt); MATCH.renderFrame(); }
  else { Menu3D.update(dt); Menu3D.render(); }
}
async function boot() {
  setLoad(0.1);
  try { await initRenderer(); }
  catch (e) { fatal('WebGPU required', (e && e.message ? e.message + ' ' : '') + 'Rocket Teague renders exclusively with WebGPU (no fallback). Try a current Chrome or Edge, Safari 26+, or Firefox with WebGPU enabled.'); return; }
  setLoad(0.4);
  await RAPIER.init();
  setLoad(0.7);
  Input.init(); FX.init(); Menu3D.init();
  addEventListener('resize', () => { if (MATCH) MATCH.layoutViews(); });
  setLoad(1);
  if (document.fonts) await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]);
  updateScreens(0, 0, '5:00', 'ROCKET TEAGUE');
  $('loading').style.display = 'none';
  UI.go('title');
  R.renderer.setAnimationLoop(frame);
  window.__RT = { THREE, Bus, Sound, Game, UI, Input, start: (o) => startMatch(o), get MATCH() { return MATCH; }, DATA, Settings, Net, R };
}
boot().catch(e => { console.error(e); fatal('Something went wrong', String(e && e.stack || e)); });
