<!--
COMMAND & COCOA — a spiritual successor to Command & Conquer
Game title picked by RNG from 50 brainstormed titles: "Command & Cocoa".

SOURCE INFORMATION
- Date: 2026-10-29 07:53 (session start)
- Source: Command & Conquer
- Tech: Three.js r180 (three@0.180.0, WebGPURenderer + TSL, no fallback), Rapier 3D 0.19.3 (rapier3d-compat), Gamepad API, WebAudio, AI Hub session client 1.3.0 (parallel mode). Plain ES modules bundled into one HTML file; Three.js and Rapier load from the jsDelivr CDN.
- Art Direction: stylised cel shading: toon gradient materials, inverted-hull ink outlines, flat candy palette, crisp tile-coloured terrain, all models built procedurally from primitives.
- Animation: procedural, code-driven transform animation (walk cycles, wheel/tread spin, recoil, turrets, rotating dishes, build-up rise, sell sink) plus hand-drawn canvas talking-head portraits driven by the voice envelope. No skeletal clips.
- Audio: all synthesized at runtime with WebAudio. Music: sequenced original tracks (menu, calm base theme, industrial march battle theme, briefing, score) and win/lose stingers. SFX: synthesized oscillator/noise effects. Voice: Animalese / Simlish-style gibberish formant voice for General Gram Cracker, E.L.L.A., Brother Cane, EVA announcements and unit barks (text is always shown as subtitles). No audio files.
- Online: AI Hub Session Protocol v1, side-by-side (parallel) mode: seeded Skirmish round, hub-reported score and result, no game networking. Plays normally on its own.
- Testing: lightweight: Playwright + headless Chromium (SwiftShader WebGPU), scripted sim stepping, emulated DualSense, and the AI Hub harness automatic check (1 and 2 players: pass).
- Verification limits: audio was verified by measuring non-silent output on every channel (SFX, voices, EVA, music) but not by ear; no human-speed playthrough on a real GPU was done.
- Environment: Claude Code CLI (headless); Linux (WSL2); browser unknown (tested in headless Chromium).
- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium
- Usage: cost and token totals unknown (not available to the agent); wall-clock session about 4 h 25 min (07:53 to 12:18).

WHAT IT IS
Build a Bakery HQ from a Mobile Cake Van, harvest spreading cacao (the Tiberium analogue), manage power, raise a base with the classic sidebar (structures and units, progressive cost drain, ready-to-place structures), command infantry and vehicles under fog of war, capture neutral radio towers with Sous-Chefs, grab crates, repair or sell structures, and call down the Sprinkle Cannon. Three campaign missions with animated FMV-style briefings, a Skirmish mode, an attract-mode demo after 10 idle seconds, and an AI Hub round.
Factions: Global Dessert Initiative (you) vs the Brotherhood of Nougat (Brother Cane).
Controls are listed in the Controls screen. Controller first (DualSense), keyboard and mouse mapped to the same model. Settings include invert horizontal and invert vertical for the gamepad.

TESTING FEEDBACK
- How many issues did testing catch? About 9: TSL vec4 argument error on the terrain material; stale simulation reference after starting a mission from a menu; Esc opening and instantly closing the menu in the same frame; HUD drawn over menus; low-contrast focused menu row; overflowing hint bar; cacao crystals visible inside the shroud; wrong "skip briefing" hint on keyboard; unaligned readback rows in the test snapshot helper.
- How many were critical / game breaking? 2: the terrain shader error (black terrain) and the stale-simulation crash when starting a skirmish or mission from a menu.
- Most helpful test: the AI Hub harness automatic check plus an emulated-gamepad script that drove the real menus, selection, deploy, build palette and placement end to end.
- Least helpful test: raw DOM screenshots in headless WebGPU, since the canvas is blank; the render-target readback hook was needed instead.

ENGINE FEEDBACK
- What did you like most about the engine? Three.js WebGPURenderer converts classic toon materials automatically and TSL makes small custom effects (fog-of-war terrain, ink outlines, animated water) a few lines. Rapier's character controller, heightfield collider and event queue were drop-in.
- Did you get stuck or guess wrong? Yes: TSL vertexColor() is a vec4, so wrapping it in vec4(x, 1) throws at runtime; the Rapier heightfield column-major layout needed care; readRenderTargetPixelsAsync needs 256-byte-aligned row widths.
- Most important thing built myself: the whole RTS layer (pathfinding, fog of war, production and power economy, AI commander, controller cursor and command UI) plus procedural audio and portraits.
- Hardest part: validating WebGPU output headlessly (blank canvas screenshots, software rendering) and keeping lights, shadows and materials stable so shaders do not recompile.
- Remove or overhaul one thing: the deprecated-parameter warning in Rapier compat init, and the split between three/webgpu and classic material naming.
- Change one thing: a built-in screenshot and readback helper for WebGPU canvases, and TSL error messages that name the offending node.

PROMPT FEEDBACK
- What did you like most? A concrete, testable definition of done, the hub protocol link, and the explicit 10-foot controller philosophy with the inverted-axis quick fix.
- What was confusing? Hub guidance recommends a WebGL fallback while the task says no fallback; the file-name brackets and the "SOURCE" placeholder naming; "Engine Feedback" for a no-engine stack.
- Hardest thing to do: delivering a feature-complete RTS (economy, AI, campaign, briefings, audio, multiplayer hook) in one pass while keeping every system controller-playable.
- One test I would have run: a long soak of the real gamepad path in a real GPU browser (full mission, human-speed), including frame-time capture.

-->

/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

less Chromium).\n- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium\n- Usage: cost and token totals unknown (not available to the agent); wall-clock session about 4 h 25 min (07:53 to 12:18).\n\nWHAT IT IS\nBuild a Bakery HQ from a Mobile Cake Van, harvest spreading cacao (the Tiberium analogue), manage power, raise a base with the classic sidebar (structures and units, progressive cost drain, ready-to-place structures), command infantry and vehicles under fog of war, capture neutral radio towers with Sous-Chefs, grab crates, repair or sell structures, and call down the Sprinkle Cannon. Three campaign missions with animated FMV-style briefings, a Skirmish mode, an attract-mode demo after 10 idle seconds, and an AI Hub round.\nFactions: Global Dessert Initiative (you) vs the Brotherhood of Nougat (Brother Cane).\nControls are listed in the Controls screen. Controller first (DualSense), keyboard and mouse mapped to the same model. Settings include invert horizontal and invert vertical for the gamepad.\n\nTESTING FEEDBACK\n- How many issues did testing catch? About 9: TSL vec4 argument error on the terrain material; stale simulation reference after starting a mission from a menu; Esc opening and instantly closing the menu in the same frame; HUD drawn over menus; low-contrast focused menu row; overflowing hint bar; cacao crystals visible inside the shroud; wrong \"skip briefing\" hint on keyboard; unaligned readback rows in the test snapshot helper.\n- How many were critical / game breaking? 2: the terrain shader error (black terrain) and the stale-simulation crash when starting a skirmish or mission from a menu.\n- Most helpful test: the AI Hub harness automatic check plus an emulated-gamepad script that drove the real menus, selection, deploy, build palette and placement end to end.\n- Least helpful test: raw DOM screenshots in headless WebGPU, since the canvas is blank; the render-target readback hook was needed instead.\n\nENGINE FEEDBACK\n- What did you like most about the engine? Three.js WebGPURenderer converts classic toon materials automatically and TSL makes small custom effects (fog-of-war terrain, ink outlines, animated water) a few lines. Rapier's character controller, heightfield collider and event queue were drop-in.\n- Did you get stuck or guess wrong? Yes: TSL vertexColor() is a vec4, so wrapping it in vec4(x, 1) throws at runtime; the Rapier heightfield column-major layout needed care; readRenderTargetPixelsAsync needs 256-byte-aligned row widths.\n- Most important thing built myself: the whole RTS layer (pathfinding, fog of war, production and power economy, AI commander, controller cursor and command UI) plus procedural audio and portraits.\n- Hardest part: validating WebGPU output headlessly (blank canvas screenshots, software rendering) and keeping lights, shadows and materials stable so shaders do not recompile.\n- Remove or overhaul one thing: the deprecated-parameter warning in Rapier compat init, and the split between three/webgpu and classic material naming.\n- Change one thing: a built-in screenshot and readback helper for WebGPU canvases, and TSL error messages that name the offending node.\n\nPROMPT FEEDBACK\n- What did you like most? A concrete, testable definition of done, the hub protocol link, and the explicit 10-foot controller philosophy with the inverted-axis quick fix.\n- What was confusing? Hub guidance recommends a WebGL fallback while the task says no fallback; the file-name brackets and the \"SOURCE\" placeholder naming; \"Engine Feedback\" for a no-engine stack.\n- Hardest thing to do: delivering a feature-complete RTS (economy, AI, campaign, briefings, audio, multiplayer hook) in one pass while keeping every system controller-playable.\n- One test I would have run: a long soak of the real gamepad path in a real GPU browser (full mission, human-speed), including frame-time capture.\n";

/* ================= WORLD: terrain, cacao, pathfinding, fog of war, physics ================= */
const T_GRASS = 0, T_DIRT = 1, T_WATER = 2, T_ROCK = 3, T_TREE = 4;
const GROUP = { GROUND: 0x1, BLDG: 0x2, UNIT: 0x4, DEBRIS: 0x8, SHELL: 0x10 };
const groups = (mem, filt) => ((mem << 16) | filt) >>> 0;

let toonGradient = null;
function getToonGradient() {
  if (toonGradient) return toonGradient;
  const d = new Uint8Array([70, 70, 70, 255, 150, 150, 150, 255, 215, 215, 215, 255, 255, 255, 255, 255]);
  toonGradient = new THREE.DataTexture(d, 4, 1, THREE.RGBAFormat);
  toonGradient.minFilter = toonGradient.magFilter = THREE.NearestFilter;
  toonGradient.needsUpdate = true;
  return toonGradient;
}
const toonMats = new Map();
function toon(color, emissive = 0x000000, opts = {}) {
  const key = `${color}|${emissive}|${opts.transparent ? 1 : 0}|${opts.opacity ?? 1}`;
  let m = toonMats.get(key);
  if (!m) {
    m = new THREE.MeshToonMaterial({ color, emissive, gradientMap: getToonGradient(), transparent: !!opts.transparent, opacity: opts.opacity ?? 1 });
    toonMats.set(key, m);
  }
  return m;
}
const outlineGeoCache = new Map();
const outlineMat = new THREE.MeshBasicNodeMaterial({ color: 0x24110a, side: THREE.BackSide });
outlineMat.positionNode = positionLocal.add(normalLocal.mul(0.045));
const outlineMatThin = new THREE.MeshBasicNodeMaterial({ color: 0x24110a, side: THREE.BackSide });
outlineMatThin.positionNode = positionLocal.add(normalLocal.mul(0.028));
function outlineGeometry(g) {
  let o = outlineGeoCache.get(g.uuid);
  if (o) return o;
  o = g.clone();
  o.deleteAttribute('normal'); o.deleteAttribute('uv');
  o = mergeVertices(o, 1e-3);
  o.computeVertexNormals();
  outlineGeoCache.set(g.uuid, o);
  return o;
}
/** add inverted-hull cel outlines to every mesh below root */
function addOutlines(root, thin = false) {
  const meshes = [];
  root.traverse((c) => { if (c.isMesh && !c.userData.noOutline) meshes.push(c); });
  for (const m of meshes) {
    const o = new THREE.Mesh(outlineGeometry(m.geometry), thin ? outlineMatThin : outlineMat);
    o.userData.noOutline = true; o.castShadow = false; o.receiveShadow = false;
    m.add(o);
  }
}

class World {
  constructor(opts) {
    this.opts = opts;
    this.seed = opts.seed;
    this.rng = mulberry32(opts.seed);
    const N = MAP_N;
    this.N = N;
    this.ter = new Uint8Array(N * N);
    this.occ = new Uint8Array(N * N);          // structure occupancy
    this.cacao = new Float32Array(N * N);
    this.vis = new Uint8Array(N * N);
    this.fogData = new Uint8Array(N * N);
    this.h = new Float32Array((N + 1) * (N + 1));
    this.bases = opts.bases;                    // [{tx,tz}]
    this.fields = [];
    this.decor = [];                            // {mesh, tx, tz}
    this.cacaoDirty = true;
    this.growTimer = 0;
    this.generate();
  }
  idx(tx, tz) { return tz * this.N + tx; }
  inMap(tx, tz) { return tx >= 0 && tz >= 0 && tx < this.N && tz < this.N; }
  cellOf(x, z) { return [clamp(Math.floor(x / TILE), 0, this.N - 1), clamp(Math.floor(z / TILE), 0, this.N - 1)]; }
  hv(i, j) { return this.h[j * (this.N + 1) + i]; }
  heightAt(x, z) {
    const fx = clamp(x / TILE, 0, this.N - 0.001), fz = clamp(z / TILE, 0, this.N - 0.001);
    const i = Math.floor(fx), j = Math.floor(fz), tx = fx - i, tz = fz - j;
    const a = lerp(this.hv(i, j), this.hv(i + 1, j), tx), b = lerp(this.hv(i, j + 1), this.hv(i + 1, j + 1), tx);
    return lerp(a, b, tz);
  }
  isBlocked(tx, tz) { if (!this.inMap(tx, tz)) return true; const i = this.idx(tx, tz); const t = this.ter[i]; return t === T_WATER || t === T_ROCK || t === T_TREE || this.occ[i] > 0; }
  isBlockedTerrain(tx, tz) { if (!this.inMap(tx, tz)) return true; const t = this.ter[this.idx(tx, tz)]; return t === T_WATER || t === T_ROCK || t === T_TREE; }

  noise(x, z, s) {
    const hash = (a, b) => { let h = (a * 374761393 + b * 668265263 + this.seed * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
    const gx = x / s, gz = z / s, i = Math.floor(gx), j = Math.floor(gz);
    const fx = gx - i, fz = gz - j, ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
    return lerp(lerp(hash(i, j), hash(i + 1, j), ux), lerp(hash(i, j + 1), hash(i + 1, j + 1), ux), uz);
  }

  generate() {
    const N = this.N, rng = this.rng, o = this.opts;
    // base heights
    for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
      let hgt = (this.noise(i, j, 9) * 1.6 + this.noise(i, j, 4) * 0.5 + this.noise(i, j, 18) * 1.8) - 1.0;
      for (const b of this.bases) { const d = dist(i, j, b.tx, b.tz); hgt = lerp(0.35, hgt, smoothstepJS(8, 15, d)); }
      this.h[j * (N + 1) + i] = hgt;
    }
    // river along the NW-SE diagonal with fords
    if (o.river) {
      const fords = [0.24, 0.5, 0.76];
      for (let tz = 0; tz < N; tz++) for (let tx = 0; tx < N; tx++) {
        const t = (tx + tz) / (2 * N);
        const off = Math.sin(t * 9 + this.seed) * 2.6;
        const d = ((tx - tz) - off) / Math.SQRT2;
        const ford = fords.some((f) => Math.abs(t - f) < 0.04);
        if (Math.abs(d) < 2.4 && !ford) this.ter[this.idx(tx, tz)] = T_WATER;
        else if (Math.abs(d) < 3.6) this.ter[this.idx(tx, tz)] = T_DIRT;
      }
      for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
        const near = [[0, 0], [-1, 0], [0, -1], [-1, -1]].some(([a, b]) => this.inMap(i + a, j + b) && this.ter[this.idx(i + a, j + b)] === T_WATER);
        const t = (i + j) / (2 * N);
        const ford = [0.24, 0.5, 0.76].some((f) => Math.abs(t - f) < 0.04);
        if (near) this.h[j * (N + 1) + i] = -0.55;
        else if (ford) this.h[j * (N + 1) + i] = Math.min(this.h[j * (N + 1) + i], 0.05);
      }
    }
    // cleared dirt around bases
    for (const b of this.bases) for (let tz = b.tz - 7; tz <= b.tz + 7; tz++) for (let tx = b.tx - 7; tx <= b.tx + 7; tx++) {
      if (!this.inMap(tx, tz)) continue;
      const d = dist(tx, tz, b.tx, b.tz);
      if (d < 6.5 && this.ter[this.idx(tx, tz)] !== T_WATER) this.ter[this.idx(tx, tz)] = rng() < 0.85 ? T_DIRT : T_GRASS;
    }
    // cacao fields
    const fieldSpec = o.fields || [];
    for (const f of fieldSpec) {
      this.fields.push(f);
      for (let tz = Math.floor(f.tz - f.r - 1); tz <= f.tz + f.r + 1; tz++) for (let tx = Math.floor(f.tx - f.r - 1); tx <= f.tx + f.r + 1; tx++) {
        if (!this.inMap(tx, tz)) continue;
        const d = dist(tx + 0.5, tz + 0.5, f.tx, f.tz) + (rng() - 0.5) * 1.2;
        if (d < f.r && this.ter[this.idx(tx, tz)] !== T_WATER) { this.cacao[this.idx(tx, tz)] = 70 + rng() * 80; this.ter[this.idx(tx, tz)] = T_DIRT; }
      }
    }
    // scatter trees + rocks
    const free = (tx, tz, m) => {
      if (!this.inMap(tx, tz) || this.ter[this.idx(tx, tz)] === T_WATER || this.cacao[this.idx(tx, tz)] > 0) return false;
      for (const b of this.bases) if (dist(tx, tz, b.tx, b.tz) < (m ?? 11)) return false;
      return true;
    };
    const clusters = o.clusters ?? 16;
    for (let c = 0; c < clusters; c++) {

    if (surplus < 35 && c('power') < 9) return 'power';
    if (c('refinery') < 1) return 'refinery';
    if (c('barracks') < 1) return 'barracks';
    if (c('factory') < 1) return 'factory';
    if (c('refinery') < 2 && this.t > 60) return 'refinery';

  }

/* ================= SCENARIOS: map layouts, base presets, mission scripts ================= */
const BASE_LAYOUT = [
  ['yard', 0, 0, 0], ['power', 4, -2, 1], ['refinery', -1, 4, 1], ['barracks', 4, 4, 1], ['power', 4, 1, 2], ['factory', -5, -1, 2],
  ['radar', 8, 1, 3], ['tower', 8, -3, 3], ['tower', 4, 8, 3], ['tower', -3, 8, 3], ['power', 8, 4, 3], ['uplink', 8, -6, 4], ['power', 4, -5, 4],
];
const ENEMY_BASE_POS = { tx: 50, tz: 12 }, PLAYER_BASE_POS = { tx: 12, tz: 49 };
function mapConfig(seed, river, extra = {}) {
  const jr = mulberry32(seed ^ 0x5bd1e995), j = () => Math.round((jr() - 0.5) * 3);
  return {
    seed, river, bases: [{ tx: PLAYER_BASE_POS.tx + 1, tz: PLAYER_BASE_POS.tz + 1 }, { tx: ENEMY_BASE_POS.tx + 1, tz: ENEMY_BASE_POS.tz + 1 }],
    fields: [{ tx: 22 + j(), tz: 43 + j(), r: 3.6 }, { tx: 9 + j(), tz: 38 + j(), r: 2.8 }, { tx: 42 + j(), tz: 20 + j(), r: 3.6 }, { tx: 54 + j(), tz: 26 + j(), r: 2.8 }, { tx: 36 + j(), tz: 40 + j(), r: 3.1 }, { tx: 28 + j(), tz: 24 + j(), r: 3.1 }], ...extra,
  };
}
/** place a base preset for a team up to the given tier, fully built */
function placeBase(sim, team, tier, bx, bz, opts = {}) {
  const made = {};
  for (const [type, dx, dz, t] of BASE_LAYOUT) {
    if (t > tier) continue; if (opts.skip && opts.skip.includes(type)) continue;
    const d = STRUCTS[type]; if (type === 'uplink' && team === 1) continue;
    const [w, h] = d.size; const tx = team === 0 ? bx + dx : bx + 3 - dx - w, tz = team === 0 ? bz + dz : bz + 3 - dz - h;
    if (!sim.world.footprintFree(tx, tz, w, h)) continue;
    const s = sim.spawnStruct(type, team, tx, tz, { instant: true }); (made[type] = made[type] || []).push(s);
    if (type === 'refinery') { const f = sim.world.nearestFree(tx + 1, tz + 3, 6) || [tx, tz]; sim.spawnUnit('harvester', team, (f[0] + 0.5) * TILE, (f[1] + 0.5) * TILE); }
  }
  return made;
}
function scatterUnits(sim, team, list, cx, cz) {
  list.forEach((t, i) => { const a = i * 2.4, r = 3 + (i % 5) * 1.2; const f = sim.world.nearestFree(Math.floor((cx + Math.cos(a) * r) / TILE), Math.floor((cz + Math.sin(a) * r) / TILE), 8); if (f) sim.spawnUnit(t, team, (f[0] + 0.5) * TILE, (f[1] + 0.5) * TILE); });
}
function structAt(sim, type, team) { return sim.structs.find((s) => s.type === type && s.team === team && s.alive); }

/** Build a scenario: returns {sim cfg, setup(sim, game)} */
function buildScenario(id, o = {}) {
  const pb = PLAYER_BASE_POS, eb = ENEMY_BASE_POS;
  if (id === 'm1' || id === 'm2' || id === 'm3') {
    const M = MISSIONS.find((m) => m.id === id);
    const cfg = { world: mapConfig(M.seed, M.river), viewTeam: 0, fog: SET.fog, crates: id !== 'm1' };
    return {
      cfg, mission: M, setup(sim) {
        const T0 = sim.teams[0], T1 = sim.teams[1]; T0.credits = M.credits; T1.credits = 1500;
        T0.allowedStructs = M.structs; T0.allowedUnits = M.units; T1.allowedStructs = null; T1.allowedUnits = null;
        if (id === 'm1') {
          const mcv = sim.spawnUnit('mcv', 0, (pb.tx + 1.5) * TILE, (pb.tz + 1.5) * TILE, { yaw: 0.8 });
          scatterUnits(sim, 0, ['grunt', 'grunt', 'grunt', 'rocketeer'], mcv.x + 4, mcv.z - 2);
          placeBase(sim, 1, 1, eb.tx, eb.tz, { skip: ['refinery'] });
          scatterUnits(sim, 1, ['grunt', 'grunt', 'grunt', 'grunt', 'flamer'], (eb.tx + 2) * TILE, (eb.tz + 6) * TILE);
          sim.spawnStruct('tower', 1, eb.tx - 3, eb.tz + 5, { instant: true });
          T1.ai = new AI(sim, 1, 0, { wave: 8 });
          sim.cfg.startCam = { x: (pb.tx + 4) * TILE, z: (pb.tz - 2) * TILE };
        } else if (id === 'm2') {
          placeBase(sim, 0, 2, pb.tx, pb.tz);
          scatterUnits(sim, 0, ['grunt', 'grunt', 'grunt', 'rocketeer', 'buggy', 'buggy', 'engineer'], (pb.tx + 5) * TILE, (pb.tz + 9) * TILE);
          placeBase(sim, 1, 3, eb.tx, eb.tz);
          scatterUnits(sim, 1, ['grunt', 'grunt', 'flamer', 'flamer', 'tank', 'tank', 'buggy', 'tank'], (eb.tx - 4) * TILE, (eb.tz + 8) * TILE);
          sim.spawnStruct('tech', 2, 25, 24, { instant: true }); sim.spawnStruct('tech', 2, 37, 41, { instant: true });
          T1.ai = new AI(sim, 1, 0, { wave: 10 });
          sim.cfg.startCam = { x: (pb.tx + 2) * TILE, z: (pb.tz + 2) * TILE };
        } else {
          placeBase(sim, 0, 3, pb.tx, pb.tz);
          scatterUnits(sim, 0, ['grunt', 'grunt', 'rocketeer', 'rocketeer', 'tank', 'tank', 'tank', 'engineer'], (pb.tx + 5) * TILE, (pb.tz + 9) * TILE);
          placeBase(sim, 1, 3, eb.tx, eb.tz);
          scatterUnits(sim, 1, ['grunt', 'grunt', 'flamer', 'flamer', 'tank', 'tank', 'tank', 'tank', 'mortar', 'buggy'], (eb.tx - 4) * TILE, (eb.tz + 8) * TILE);
          sim.spawnStruct('tower', 1, eb.tx - 3, eb.tz + 4, { instant: true }); sim.spawnStruct('tower', 1, eb.tx - 3, eb.tz + 8, { instant: true });
          sim.spawnStruct('silo', 1, eb.tx + 6, eb.tz + 7, { instant: true });
          sim.spawnStruct('tech', 2, 25, 24, { instant: true }); sim.spawnStruct('tech', 2, 37, 41, { instant: true });
          T1.ai = new AI(sim, 1, 0, { wave: 12, econ: 1.2 });
          sim.cfg.startCam = { x: (pb.tx + 2) * TILE, z: (pb.tz + 2) * TILE };
        }
      },
    };
  }
  if (id === 'skirmish') {
    const cfg = { world: mapConfig(o.seed, o.river, { clusters: o.clusters ?? 16 }), viewTeam: 0, fog: o.fog !== false && SET.fog, crates: o.crates !== false };
    return {
      cfg, mission: null, setup(sim) {
        sim.teams[0].credits = o.credits; sim.teams[1].credits = o.credits;
        sim.spawnUnit('mcv', 0, (pb.tx + 1.5) * TILE, (pb.tz + 1.5) * TILE, { yaw: 0.8 }); scatterUnits(sim, 0, ['grunt', 'grunt', 'rocketeer'], (pb.tx + 5) * TILE, (pb.tz + 1) * TILE);
        sim.spawnUnit('mcv', 1, (eb.tx + 1.5) * TILE, (eb.tz + 1.5) * TILE, { yaw: 3.9 }); scatterUnits(sim, 1, ['grunt', 'grunt', 'flamer'], (eb.tx - 2) * TILE, (eb.tz + 4) * TILE);
        sim.teams[1].ai = new AI(sim, 1, o.ai ?? 1, {});
        if (o.tech) { sim.spawnStruct('tech', 2, 25, 24, { instant: true }); sim.spawnStruct('tech', 2, 37, 41, { instant: true }); }
        sim.cfg.startCam = { x: (pb.tx + 2) * TILE, z: (pb.tz + 2) * TILE };
      },
    };

    return {
      cfg, mission: null, setup(sim) {
        sim.teams[0].credits = 5000; sim.teams[1].credits = 3000;
        placeBase(sim, 0, 3, pb.tx, pb.tz); scatterUnits(sim, 0, ['grunt', 'grunt', 'rocketeer', 'tank', 'engineer'], (pb.tx + 5) * TILE, (pb.tz + 9) * TILE);
        placeBase(sim, 1, 2, eb.tx, eb.tz); scatterUnits(sim, 1, ['grunt', 'grunt', 'flamer', 'tank'], (eb.tx - 4) * TILE, (eb.tz + 8) * TILE);
        sim.spawnStruct('tech', 2, 25, 24, { instant: true }); sim.spawnStruct('tech', 2, 37, 41, { instant: true });
        sim.teams[1].ai = new AI(sim, 1, 1, { wave: 7 });
        sim.cfg.startCam = { x: (pb.tx + 2) * TILE, z: (pb.tz + 2) * TILE };
      },
    };
  }
  // attract / title diorama
  const cfg = { world: mapConfig(o.seed ?? 4242, o.river ?? true), viewTeam: null, fog: false, crates: !!o.live };
  return {
    cfg, mission: null, setup(sim) {
      placeBase(sim, 0, 4, pb.tx, pb.tz); placeBase(sim, 1, 3, eb.tx, eb.tz);
