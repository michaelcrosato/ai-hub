'use strict';
                                                                           
const { stadium,dynamicGeometry }=require("./world.js");
const { v3,normalize }=require("./math.js");
const sub=(a     ,b     )=>v3(a.x-b.x,a.y-b.y,a.z-b.z);
const dot=(a     ,b     )=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross=(a     ,b     )=>v3(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);

class PreviewGraphics                     {
 backend='CANVAS PREVIEW';canvas                  ;        ctx                         ;
         cache                  ;        cacheKey='';        world=stadium();        w=0;        h=0;        dpr=1;
         camera           ={eye:v3(91,89,108),at:v3(0,0,-35),fov:43};        fwd=v3();        right=v3();        up=v3();        focal=1;
 constructor(canvas                  ){this.canvas=canvas;const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)throw new Error('Canvas unavailable');this.ctx=ctx;this.cache=document.createElement('canvas');}

         setup(camera           )     {this.camera=camera;this.fwd=normalize(sub(camera.at,camera.eye));this.right=normalize(cross(this.fwd,v3(0,1,0)));this.up=cross(this.right,this.fwd);this.focal=Math.min(this.h/(2*Math.tan(camera.fov*Math.PI/360)),this.w*1.1);}

         shade(hex       ,n     ,unlit=false)       {if(unlit)return hex;const intensity=.7+.32*Math.max(0,dot(n,normalize(v3(-.45,.9,.6))));const val=parseInt(hex.slice(1),16);const r=Math.min(255,Math.round((val>>16)*intensity)),g=Math.min(255,Math.round(((val>>8)&255)*intensity)),b=Math.min(255,Math.round((val&255)*intensity));return `rgb(${r},${g},${b})`;}
         faces(objects            )       {
  const result       =[];
  for(const o of objects){let verts       =[];let sides           =[];
   const [w,h,d]=[o.s.x/2,o.s.y/2,o.s.z/2];
   if(o.kind==='box'){verts=[v3(-w,-h,-d),v3(w,-h,-d),v3(w,h,-d),v3(-w,h,-d),v3(-w,-h,d),v3(w,-h,d),v3(w,h,d),v3(-w,h,d)];sides=[[0,3,2,1],[4,5,6,7],[0,4,7,3],[1,2,6,5],[3,7,6,2],[0,1,5,4]];}

   else if(o.kind==='label'){verts=[v3(-w,-h,0),v3(w,-h,0),v3(w,h,0),v3(-w,h,0)];sides=[[0,1,2,3]];}
   else if(o.kind==='sphere'){verts=[v3(0,h,0),v3(-w,0,0),v3(0,0,d),v3(w,0,0),v3(0,0,-d),v3(0,-h,0)];sides=[[0,1,2],[0,2,3],[0,3,4],[0,4,1],[5,2,1],[5,3,2],[5,4,3],[5,1,4]];}
   else{const n=o.segments||10;for(let i=0;i<n;i++){const a=i*Math.PI*2/n;verts.push(v3(Math.cos(a)*w,-h,Math.sin(a)*d));}for(let i=0;i<n;i++){const a=i*Math.PI*2/n;verts.push(v3(Math.cos(a)*(o.kind==='cone'?0:w),h,Math.sin(a)*(o.kind==='cone'?0:d)));}sides.push(Array.from({length:n},(_,i)=>n*2-i-1));for(let i=0;i<n;i++)sides.push([i,(i+1)%n,(i+1)%n+n,i+n]);}
   verts=verts.map(p=>{let x=p.x,y=p.y,z=p.z;if(o.rx){const a=o.rx;[y,z]=[y*Math.cos(a)-z*Math.sin(a),y*Math.sin(a)+z*Math.cos(a)];}if(o.rz){const a=o.rz;[x,y]=[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)];}if(o.ry){const a=o.ry;[x,z]=[x*Math.cos(a)+z*Math.sin(a),-x*Math.sin(a)+z*Math.cos(a)];}return v3(x+o.p.x,y+o.p.y,z+o.p.z);});

         draw(ctx                         ,faces       )     {
  for(const face of faces){const p=face.p.map(p=>this.project(p));if(p.every(q=>q.x<-60)||p.every(q=>q.x>this.w+60)||p.every(q=>q.y<-60)||p.every(q=>q.y>this.h+60))continue;

 render(frame      )     {
  this.setup(frame.camera);const key=JSON.stringify(frame.camera)+this.w+this.h;
  if(key!==this.cacheKey){this.cacheKey=key;const c=this.cache.getContext('2d') ;c.setTransform(this.dpr,0,0,this.dpr,0,0);const g=c.createLinearGradient(0,0,0,this.h);g.addColorStop(0,'#b6dfdc');g.addColorStop(.55,'#cee7d7');g.addColorStop(1,'#d7e7c5');c.fillStyle=g;c.fillRect(0,0,this.w,this.h);// Ground polygons must stay below the structures: centroid-only sorting

   for(const o of this.world.filter(o=>o.p.y<.5&&o.kind!=='label'))this.draw(c,this.faces([o]));

   this.draw(c,this.faces(this.world.filter(o=>o.kind==='label')));}

}
