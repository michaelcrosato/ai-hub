const audio={ctx:null,amb:null};

/** Soft surf: looped brown noise through a low-pass filter, swelling slowly like waves. */
function syncAmbience(){
  const want=!!state.settings.ambience;
  if(want&&!audio.amb){
    const c=getAudio();if(!c)return;
    const len=c.sampleRate*4,fade=Math.floor(c.sampleRate*.25),noise=new Float32Array(len+fade);let last=0;
    for(let i=0;i<noise.length;i++){last=(last+.02*(Math.random()*2-1))/1.02;noise[i]=last*3.2;}
    const b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=i<fade?noise[i]*(i/fade)+noise[len+i]*(1-i/fade):noise[i];
    const src=c.createBufferSource(),filter=c.createBiquadFilter(),gain=c.createGain(),lfo=c.createOscillator(),depth=c.createGain();

const hudCache={kind:'',label:'',ready:null,touchLabel:'',wpShown:null,wpLeft:'',wpTop:'',wpHtml:''};
function setInteractUi(kind,label,ready,touchLabel){
  if(hudCache.kind!==kind){hudCache.kind=kind;$('#interact-icon').innerHTML=icon(kind);}
  if(hudCache.ready!==ready){hudCache.ready=ready;$('#interact').classList.toggle('ready',ready);kit?.touch?.button('interact')?.classList.toggle('is-ready',ready);}
  if(hudCache.label!==label){hudCache.label=label;$('#interact-label').textContent=label;}

function setWaypoint(shown,left='',top='',html=''){
  const wp=$('#waypoint');
  if(hudCache.wpShown!==shown){hudCache.wpShown=shown;wp.style.display=shown?'block':'none';}
  if(!shown)return;
  if(hudCache.wpLeft!==left){hudCache.wpLeft=left;wp.style.left=left;}
  if(hudCache.wpTop!==top){hudCache.wpTop=top;wp.style.top=top;}
  if(hudCache.wpHtml!==html){hudCache.wpHtml=html;wp.innerHTML=html;}

function updateTargetUi(){
  if(state.active||modal||!world)return;

  if(!t){
    const p=world.camera.position,home=Math.hypot(p.x-PLACES.home.x,p.z-PLACES.home.z)<4;
    setWaypoint(false);setInteractUi(home?'home':'sparkle',home?'MY LIFE':'EXPLORE',false,home?'Home':'Explore');return;
  }
  const dist=Math.round(t.distance),ready=t.distance<3.15;
  setInteractUi(ready?'chat':'pin',ready?`MEET ${t.name.toUpperCase()}`:`${dist} M AWAY`,ready,ready?`Meet ${t.name}`:`${dist} m`);
  if(t.visible)setWaypoint(true,`${(t.screenX*100).toFixed(1)}%`,`${(t.screenY*100).toFixed(1)}%`,`<span>${esc(t.name)} <small>${dist} m</small></span>`);

function choices(options,action){return `<div class="dialogue-choices">${options.map((o,i)=>`<button class="dialogue-choice" data-action="${action}" data-choice="${i}"><small>${i+1}</small><span>${o}</span></button>`).join('')}</div>`;}
/** The greeting answers, best first, turned by one place each completed date. Returns the buttons and each one's score. */

  const shift=state.completed%3,arranged=opts.slice(shift).concat(opts.slice(0,shift));

/** What a client talks about: their topic, with a second story on every other return visit. */

/** The boundary moment for this date, with the answers in an order that changes from date to date. */

function measureMini(){
  mini.marker=$('#rhythm-marker');mini.trackW=mini.marker?.parentElement?.clientWidth||0;
  mini.cam=$('#photo-camera');const area=$('#photo-area');mini.areaW=area?.clientWidth||0;mini.areaH=area?.clientHeight||0;

function advanceDate(stage){state.active.stage=stage;commit();renderDate();}
/** Mini-games run in the shared loop, so they pause with the settings panel and the game's own panels. */
function updateMini(dt){
  const stage=state.active?.stage;if(!stage||modal)return;
  if(stage==='timing'){
    mini.phase+=dt;const speed=state.settings.assist?1.25:2.15;const pos=(Math.sin(mini.phase*speed)+1)/2;
    mini.timingPos=pos;if(mini.marker)mini.marker.style.transform=`translateX(${(pos*(mini.trackW-5)).toFixed(1)}px)`;
  }else if(stage==='photo'){
    mini.phase+=dt;const drift=state.settings.assist?0:Math.sin(mini.phase*1.4)*.018;
    mini.actualX=clamp(mini.photoX+drift,.06,.94);mini.actualY=clamp(mini.photoY+drift*.5,.12,.88);
    if(mini.cam)mini.cam.style.transform=`translate(${(mini.actualX*mini.areaW-23).toFixed(1)}px,${(mini.actualY*mini.areaH-23).toFixed(1)}px)`;
  }
}
function bindPhoto(){
  const area=$('#photo-area');let dragging=false;
  const set=e=>{const r=area.getBoundingClientRect();mini.photoX=clamp((e.clientX-r.left)/r.width,.06,.94);mini.photoY=clamp((e.clientY-r.top)/r.height,.12,.88);};
  area.addEventListener('pointerdown',e=>{dragging=true;area.setPointerCapture(e.pointerId);set(e);});
  area.addEventListener('pointermove',e=>{if(dragging)set(e);});
  area.addEventListener('pointerup',()=>dragging=false);area.addEventListener('pointercancel',()=>dragging=false);
}
function timingHit(){
  if(modal||state.active?.stage!=='timing')return;
  const a=state.active;const diff=Math.abs((mini.timingPos??0)-.5);
  const score=clamp(Math.round(100-diff*(state.settings.assist?150:230)),15,100);
  a.timing.hits.push(score);tone(score>=65);if(score>=65)rumble(.25,60);
  if(a.timing.hits.length===3){const average=a.timing.hits.reduce((p,c)=>p+c,0)/3;addScore(state,'Good timing',average);advanceDate('boundary');toast(average>=70?'A natural rhythm. You gave them space to speak.':'You found a rhythm. Listening gets easier with practice.');}
  else{$('#timing-feedback').textContent=score>=80?'Just right. That felt natural.':score>=60?'A good moment. Keep listening.':'A little early or late. Try the next pass.';$$('.round-dots i').forEach((el,i)=>el.classList.toggle('hit',i<a.timing.hits.length));commit();}
}
function photoHit(){

function showResult(r){

function route(action,d,el){

/* ---------- Panels with a controller or the keyboard: move between buttons, press, go back ---------- */
const NAV_SEL='button:not(:disabled),input:not([type=hidden]):not([type=file]):not(:disabled),select:not(:disabled),textarea:not(:disabled)';
const nav={dir:null,armed:true,next:0};
function navScope(){if(modal)return $('#sheet');if(state.active&&!$('#date-layer').hidden)return $('#date-layer');return null;}
function navItems(scope){return [...scope.querySelectorAll(NAV_SEL)].filter(el=>el.getClientRects().length&&getComputedStyle(el).visibility!=='hidden');}
function padFocus(el){
  if(!el)return;
  for(const old of $$('.pad-focus'))old.classList.remove('pad-focus');
  el.classList.add('pad-focus');el.focus({preventScroll:true});el.scrollIntoView({block:'nearest',inline:'nearest'});
}
document.addEventListener('focusout',e=>e.target.classList?.remove('pad-focus'));
/** A stable description of a button, so focus can find its twin after a panel re-renders. */
function focusKey(el){
  const d=el.dataset,parts=[`[data-action="${d.action}"]`];
  for(const k of ['id','slot','place','kind','skill','model','drink','choice'])if(d[k]!==undefined)parts.push(`[data-${k}="${CSS.escape(d[k])}"]`);
  return parts.join('');
}
function restoreFocus(key){
  const scope=navScope();if(!scope)return;
  const el=scope.querySelector(key)||null;
  if(el&&!el.disabled)padFocus(el);
}
/** Where focus lands first: the panel's main button, else its first control (not the close button or tabs). */
function primaryItem(items){
  const body=items.filter(el=>!el.closest('.sheet-head, .sheet-tabs, .date-header'));
  return body.find(el=>el.classList.contains('primary')&&el.dataset.action!=='close')||body.find(el=>el.classList.contains('primary'))||body[0]||items[0];
}
/** Range and select controls take left/right as a value change; everything else moves focus. */
function adjustControl(el,dir){
  if(el.tagName==='SELECT'){
    const n=el.options.length;if(!n)return true;el.selectedIndex=(el.selectedIndex+dir+n)%n;
    el.dispatchEvent(new Event('change',{bubbles:true}));return true;
  }
  if(el.type==='range'||el.type==='number'){
    const step=Number(el.step)||1,min=Number(el.min),max=Number(el.max);
    let v=Number(el.value)+dir*step;if(Number.isFinite(min))v=Math.max(min,v);if(Number.isFinite(max))v=Math.min(max,v);
    el.value=String(Math.round(v*1000)/1000);el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));return true;
  }
  return false;
}
function navStep(dir){
  const scope=navScope();if(!scope)return;
  const items=navItems(scope);if(!items.length)return;
  const cur=items.includes(document.activeElement)?document.activeElement:null;
  if(!cur){padFocus(primaryItem(items));return;}
  if((dir==='left'||dir==='right')&&adjustControl(cur,dir==='right'?1:-1))return;
  const a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;
  let best=null,bestScore=Infinity;
  for(const el of items){
    if(el===cur)continue;
    const b=el.getBoundingClientRect(),dx=b.left+b.width/2-ax,dy=b.top+b.height/2-ay;
    let main,cross;
    if(dir==='down'){if(dy<=4)continue;main=dy;cross=Math.abs(dx);}
    else if(dir==='up'){if(dy>=-4)continue;main=-dy;cross=Math.abs(dx);}
    else if(dir==='right'){if(dx<=4||Math.abs(dy)>Math.max(a.height,b.height))continue;main=dx;cross=Math.abs(dy);}
    else{if(dx>=-4||Math.abs(dy)>Math.max(a.height,b.height))continue;main=-dx;cross=Math.abs(dy);}
    const score=main+cross*2.5;if(score<bestScore){bestScore=score;best=el;}
  }
  if(best)padFocus(best);
  else if(dir==='right'||dir==='left'){const i=items.indexOf(cur);padFocus(items[(i+(dir==='right'?1:-1)+items.length)%items.length]);}
}
function navConfirm(){
  const scope=navScope();if(!scope)return;
  const items=navItems(scope),el=document.activeElement;
  if(!items.includes(el)){padFocus(primaryItem(items));return;}
  if(el.tagName==='SELECT'){adjustControl(el,1);return;}
  if(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!['checkbox','radio','button','submit'].includes(el.type)))return;
  el.click();
}
function navDirection(){
  const v=kit.input.vector('move');
  if(Math.abs(v.y)>.55&&Math.abs(v.y)>=Math.abs(v.x))return v.y>0?'up':'down';
  if(Math.abs(v.x)>.55)return v.x>0?'right':'left';
  return null;
}
/** Hold a direction to repeat. A direction already held when a panel opens waits for a release. */
function navTick(now){
  const d=navDirection();
  if(!nav.armed){if(!d)nav.armed=true;nav.dir=d;return;}
  if(d!==nav.dir){nav.dir=d;if(d){navStep(d);nav.next=now+380;}}
  else if(d&&now>=nav.next){navStep(d);nav.next=now+130;}
}
function sheetBack(){
  const parent={client:'requests',regions:'business',cancel:'schedule',reset:'settings',import:'settings',settings:'menu'}[modal];
  if(modal==='welcome')return;
  if(parent)route(parent,{});else if(modal==='morning')route('start-day',{});else closeSheet();
}
function switchTab(dir){
  const tabsEls=$$('#sheet .sheet-tabs button');if(!tabsEls.length)return;
  const i=Math.max(0,tabsEls.findIndex(b=>b.classList.contains('active')));
  const next=tabsEls[(i+dir+tabsEls.length)%tabsEls.length];next.click();
  restoreFocus(`.sheet-tabs [data-action="${next.dataset.action}"]`);
}

/* ---------- The loop ---------- */
let lastScope='',renderWait=0,forceRender=true,perfAt=0;
function handleInput(scope,dt,now){
  const input=kit.input,pad=input.source==='gamepad';
  if(scope==='sheet'){
    navTick(now);
    if(input.pressed('act')&&pad)navConfirm();
    else if(input.pressed('back'))sheetBack();
    else if(input.pressed('pause'))closeSheet();
    else if(input.pressed('tabPrev'))switchTab(-1);
    else if(input.pressed('tabNext'))switchTab(1);
    if(pad){const lk=input.look('look');if(lk.y)$('#sheet .sheet-body')?.scrollBy(0,lk.y*420);}
    return;
  }
  if(scope==='date'){
    const stage=state.active.stage;
    if(input.pressed('pause')||input.pressed('back')){leaveConfirm();return;}
    for(let i=1;i<=4;i++)if(input.pressed(`choice${i}`)){$$('#date-layer .dialogue-choice, #date-layer .drink-choice')[i-1]?.click();return;}
    if(stage==='timing'||stage==='photo'){
      if(input.pressed('act')||input.pressed('interact')){
        if(pad&&document.activeElement?.dataset?.action==='leave-confirm')document.activeElement.click();
        else if(stage==='timing')timingHit();else photoHit();
        return;
      }
      if(stage==='photo'){const mv=input.vector('move');if(mv.x||mv.y){mini.photoX=clamp(mini.photoX+mv.x*dt*.55,.06,.94);mini.photoY=clamp(mini.photoY-mv.y*dt*.55,.12,.88);}}
      return;
    }
    navTick(now);
    if(input.pressed('act')&&pad)navConfirm();
    return;
  }
  // Walking around the bay.
  if(input.pressed('pause')){showMenu();return;}
  if(input.pressed('phone')){selectedQuote=null;selectedSlot=null;showRequests();return;}
  if(input.pressed('map')){showMap();return;}
  if(input.pressed('interact')||input.pressed('act')){interact();return;}
  if(input.pressed('lock'))input.lockPointer();
  const lk=input.look('look'),sens=state.settings.sensitivity||1;
  // The original drag look ran a little faster than the shared default; touch a little slower.
  const k=input.source==='touch'?.75:input.source==='gamepad'?1:input.pointerLocked?.85:1.4;
  world.look(lk.x*sens*k,lk.y*sens*k);
  const turn=input.value('turn');if(turn){world.yaw-=turn*1.6*dt;world.turnTarget=null;}
  if(input.pointer.justDown&&world.autoWalk){world.autoWalk=null;}
  const mv=input.vector('move');
  world.walk(mv.x,-mv.y,dt,state.settings.reducedMotion);
}
function samplePerf(now){
  if(now-perfAt<1000)return;perfAt=now;
  const info=kit.renderer.info.render;
  statsData={fps:window.__kit?.fps||0,calls:info.drawCalls,triangles:info.triangles};
  if(!$('#perf').hidden)$('#perf').textContent=`${statsData.fps} fps · ${statsData.calls} calls · ${statsData.triangles.toLocaleString()} triangles · ${kit.backendLabel}`;
}
function frame(dt){
  const now=performance.now();
  const scope=modal?'sheet':state.active?'date':'world';
  if(scope!==lastScope){lastScope=scope;nav.armed=false;nav.dir=null;}
  handleInput(scope,dt,now);
  updateMini(dt);
  world.update(dt);
  updateTargetUi();
  // Behind a panel the town only needs a few frames a second; during a date, thirty.
  renderWait+=dt;
  const interval=scope==='sheet'?1/12:scope==='date'?1/30:0;
  if(forceRender||renderWait>=interval){renderWait=0;forceRender=false;post.render();samplePerf(now);}
}
