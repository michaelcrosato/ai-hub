<!--
GOOF SWOOP: an original spiritual successor to Goof Troop (single-file build)

SOURCE INFORMATION
- Date: 2026-10-29 02:01
- Source: Goof Troop (Capcom, SNES, 1993)
- Tech: Three.js r180 (WebGPURenderer + TSL node materials, WebGPU only, no fallback), Rapier 0.19.3 (@dimforge/rapier3d-compat), Gamepad API, Web Audio API, AI Hub session client 1.3.0; ES modules from jsDelivr CDN
- Art Direction: stylized cel shading (MeshToonNodeMaterial, 3-step ramp, inverted-hull ink outlines, comic word pops)
- Animation: procedural hierarchical rigs (walk cycles, squash and stretch, carry/throw/kick/dance poses, spin-launch slapstick) plus particles
- Audio: code-written music (Web Audio step sequencer: calypso steel drum, puzzle and boss themes), synthesized SFX, Animalese-style gibberish voices
- Online: AI Hub Session Protocol v1, co-op mode (1-4 players, host-authoritative shared world, server-hosted rounds supported); local 2-player co-op
- Testing: Lightweight: node syntax check of the bundle; level-grid validation; Playwright + headless Chrome. WebGPU initialised under SwiftShader but frames could not be presented headless (even a minimal three.js page lost its device), so visuals were checked with a test-only copy forced onto three.js's WebGL2 backend. Plus a scripted mechanics test of every puzzle, item and the boss, a fast-forwarded attract-mode run, and the AI Hub harness (1, 2 and 4 players, 150 ms latency, 50 ms jitter, 5% loss, host-leave, server-hosted, emulated DualSense).
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort medium
- Usage: Session time about 1 h 20 min (02:01 to about 03:20). API cost and token counts: unknown (no usage meter available in this headless session).

TESTING FEEDBACK
- How many issues did testing catch? 15: a crash while building the level, the dig list being overwritten so the key never spawned, a brute too wide to leave his corridor, input edges not cleared after a failed frame (menu re-toggling), two attract-mode stalls, frame-rate-dependent idle and co-op timers, a misleading co-op hint, an overflowing Settings menu, ship masts hiding the boss, palms hiding the beach, a toast over the spawn point, over-bright torches, a material warning and a missing favicon.
- How many were critical / game breaking? 3: the level-build crash, the missing key (softlock at the locked door) and the menu re-toggle after a failed frame.
- Most helpful test The scripted mechanics run that drives the real world API through every room (lift, throw, kick puzzle, hook zip, plank, dig, key and lock, bell lure, KO, boss phases and win). It found the two worst bugs in one pass.
- Least helpful test Headless WebGPU screenshots: SwiftShader created a device and then lost it, so every capture came back blank.

ENGINE FEEDBACK
- What did you like most? TSL node materials: the ink outline is a one-line positionNode on a back-face material and the animated cel water is a few lines. Rapier's character controller and collision groups gave clean wall-sliding and selective collisions (pirates avoid pits, thrown barrels fly over water).
- Did you get stuck or guess wrong? Yes: MeshToonNodeMaterial ignores flatShading in its constructor, readRenderTargetPixelsAsync failed on a fresh RenderTarget, and headless WebGPU kept losing its device. WebGPURenderer also falls back to WebGL2 silently, so 'no fallback' needs an explicit backend check.
- Most important thing built myself The cel pipeline glue (toon ramp, outline hulls including instanced ones), every model and procedural rig, the tile-grid level format, the host-authoritative netcode and the Web Audio sequencer.
- Hardest part Verifying WebGPU output without a real GPU, and keeping Rapier queries, standalone colliders and the fixed-step simulation in sync across host and client copies.
- Remove or overhaul one thing The silent automatic WebGL fallback in WebGPURenderer: make it opt-in.
- Change one thing Ship an official toon outline pass that works with instanced meshes, and a simpler Rapier JS character-controller API for collider-only (bodiless) characters.

PROMPT FEEDBACK
- What did you like most? A concrete deliverable name, a clear controller-first 10-foot UX brief, and specific asks such as attract mode and the invert-axis toggles.
- What was confusing? 'Online' points at the AI Hub protocol, which asks for a WebGL 2 fallback and short rounds, while the prompt says WebGPU with no fallback and a long demo. I resolved it with hub:webgpu=required and one full-length co-op round. 'Testing parameters allowed' was also unclear.
- Hardest thing to do Fitting a complete vertical slice (7 rooms, 4 items, puzzles, boss, story, attract mode, local co-op and 4-player hub co-op) into one pass while keeping it verifiable.
- One test you wish you could run A real GPU browser playthrough with a DualSense on a TV, plus a real 4-device AI Hub session, to tune feel, readability and netcode smoothness.

-->

<script>
/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

class AudioEngine {
  constructor() { this.ctx = null; this.track = null; this.step = 0; this.nextTime = 0; this.voiceAt = 0; this.timer = null; }

  /** Create or resume the context. Called on the first gesture and again on hub `start`. */
  unlock() {
    try {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        const c = this.ctx;
        this.master = c.createGain(); this.master.gain.value = 0.9;
        const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
        this.master.connect(comp).connect(c.destination);
        this.musicBus = c.createGain(); this.sfxBus = c.createGain(); this.voiceBus = c.createGain();
        for (const b of [this.musicBus, this.sfxBus, this.voiceBus]) b.connect(this.master);
        this.noise = c.createBuffer(1, c.sampleRate, c.sampleRate);
        const d = this.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        this.applyVolumes();
        this.timer = setInterval(() => this.schedule(), 25);
        if (this.wanted) this.play(this.wanted, true);
      }
      if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
    } catch { this.ctx = null; }
  }
  applyVolumes() {
    if (!this.ctx) return;
    this.musicBus.gain.value = settings.music * 0.55;
    this.sfxBus.gain.value = settings.sfx;
    this.voiceBus.gain.value = settings.voice * 0.7;
  }
  get now() { return this.ctx ? this.ctx.currentTime : 0; }

  // ------------------------------------------------------------------ music
  play(name, force) {
    this.wanted = name;
    if (!this.ctx) return;
    if (this.trackName === name && !force) return;
    this.trackName = name;
    const t = TRACKS[name];
    if (!t) { this.track = null; return; }
    this.track = { ...t, notes: t.melody.split(/\s+/), chordList: t.chords.split(' ') };
    this.step = 0; this.nextTime = this.ctx.currentTime + 0.08;
    this.musicBus.gain.cancelScheduledValues(this.ctx.currentTime);
    this.musicBus.gain.setValueAtTime(0, this.ctx.currentTime);
    this.musicBus.gain.linearRampToValueAtTime(settings.music * 0.55, this.ctx.currentTime + 0.4);
  }
  stopMusic(fade = 0.6) {
    this.wanted = null; this.trackName = null; this.track = null;
    if (!this.ctx) return;
    const g = this.musicBus.gain; g.cancelScheduledValues(this.now); g.setValueAtTime(g.value, this.now); g.linearRampToValueAtTime(0, this.now + fade);
    setTimeout(() => { if (!this.track && this.ctx) { g.cancelScheduledValues(this.now); g.value = settings.music * 0.55; } }, fade * 1000 + 50);
  }
  schedule() {
    const t = this.track; if (!t || !this.ctx) return;
    const spb = 60 / t.bpm / 2; // seconds per 8th
    while (this.nextTime < this.ctx.currentTime + 0.15) {
      const s = this.step, at = this.nextTime + (s % 2 ? (t.swing || 0) * spb : 0);
      const n = t.notes.length;
      if (t.once && s >= n) { this.track = null; this.trackName = null; return; }
      const i = s % n;
      const tok = t.notes[i];
      if (tok !== '.' && tok !== '-') {
        let len = 1; while (t.notes[(i + len) % n] === '-' && len < 8) len++;
        this.lead(t.lead, NOTE(tok), at, len * spb);
      }
      const bar = Math.floor(i / 8) % t.chordList.length, beat = i % 8;
      const ch = CHORD[t.chordList[bar]] || CHORD.C;
      this.bassLine(t.bass, ch, beat, at, spb);
      if (beat % 2 === 1 && t.bass !== 'none') for (let k = 1; k < 4; k++) this.stab(NOTE(ch[k]), at, spb * 0.7);
      const dr = t.drums[beat % t.drums.length];
      if (dr === 'k' || dr === 'x') this.kick(at, 0.5);
      if (dr === 's') this.snare(at, 0.28);
      if (dr === 'h' || dr === 'x' || (t.bpm > 120 && beat % 2 === 1)) this.hat(at, 0.08);
      this.step++; this.nextTime += spb;
    }
  }
  bassLine(kind, ch, beat, at, spb) {
    const root = NOTE(ch[0]);
    if (kind === 'none') return;
    if (kind === 'calypso') { if (beat === 0 || beat === 3 || beat === 4) this.bass(beat === 3 ? root * 1.5 : root, at, spb * 1.4); if (beat === 6) this.bass(root * 2, at, spb); }
    else if (kind === 'walk') { if (beat % 2 === 0) this.bass(root * [1, 1.189, 1.335, 1.498][beat / 2], at, spb * 1.6); }
    else if (kind === 'drive') this.bass(beat % 4 === 3 ? root * 2 : root, at, spb * 0.8);

    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * 0.4), at + Math.max(a + 0.01, dur));

      const o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
      o.type = 'square'; o.frequency.value = f; lp.type = 'lowpass'; lp.frequency.value = 2400;
      const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 6; lg.gain.value = f * 0.012; lfo.connect(lg).connect(o.frequency);

    }

  bass(f, at, dur) { this.osc('triangle', f, at, dur * 0.8, 0.32, this.musicBus, 0.005, 0.06); this.osc('sine', f / 2, at, dur * 0.8, 0.18, this.musicBus, 0.005, 0.06); }
  stab(f, at, dur) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = f; lp.type = 'lowpass'; lp.frequency.value = 1300;
    this.env(g, at, 0.005, 0.035, dur * 0.5, 0.05); o.connect(lp).connect(g).connect(this.musicBus); o.start(at); o.stop(at + dur + 0.1);
  }
  noiseHit(at, dur, peak, type, freq, bus = this.sfxBus, q = 1) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = type; f.frequency.setValueAtTime(freq, at); f.Q.value = q;

  sfx(name, opt = {}) {

      case 'slide': { const f = this.noiseHit(t, 0.35, 0.18 * v, 'bandpass', 300, B, 3); f.frequency.linearRampToValueAtTime(180, t + 0.35); break; }

      case 'fruit': sweep('square', 500, 900, 0.06, 0.12); this.osc('square', 1200, t + 0.07, 0.08, 0.1 * v, B); break;
      case 'key': [880, 1320, 1760, 2640].forEach((f, i) => this.osc('triangle', f, t + i * 0.06, 0.12, 0.18 * v, B)); break;

    const w = sin(p.x.mul(0.33).add(time.mul(1.1))).add(sin(p.y.mul(0.47).sub(time.mul(0.8)))).add(sin(p.x.add(p.y).mul(0.21).add(time.mul(0.6))));
    const foam = smoothstep(1.55, 1.7, w);
    const deep = smoothstep(-1.2, -1.0, w);
    return mix(mix(tslColor(0x138fb0), tslColor(0x1fb5c9), deep), tslColor(0xd8fbff), foam);
  })();
  const water = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), mat);
  water.rotation.x = -Math.PI / 2; water.position.set(40, -0.45, -10);
  G.scene.add(water);
}

function buildSkyDecor() {

    G.scene.add(g); G.gulls.push(g);
  }
}

/**
 * A procedural cartoon critter rig. Limbs hang from pivot groups so the animator can swing them.
 * def: { fur, outfit, pants, hat, hatType, ears, scale, belly, eyepatch, beard, hookHand, bulk }
 */
function makeCritter(def) {
  const root = new THREE.Group();
  const rig = new THREE.Group(); root.add(rig);
  const s = def.scale || 1, bulk = def.bulk || 1;
  rig.scale.setScalar(s);
  const fur = def.fur, outfit = def.outfit, pants = def.pants || 0x334;
  const hip = new THREE.Group(); hip.position.y = 0.55; rig.add(hip);
  const legs = [-1, 1].map((side) => {
    const pv = new THREE.Group(); pv.position.set(0.15 * side * bulk, 0, 0); hip.add(pv);
    pv.add(tmesh(GEO.capsule, pants, { scale: [0.11, 0.17, 0.11], pos: [0, -0.22, 0] }));
    pv.add(tmesh(GEO.sphere, def.shoe || 0x5a3a22, { scale: [0.15, 0.11, 0.26], pos: [0, -0.47, 0.08] }));
    return pv;
  });
  const torso = new THREE.Group(); torso.position.y = 0.55; rig.add(torso);
  const body = tmesh(GEO.capsule, outfit, { scale: [0.3 * bulk, 0.2, 0.26 * bulk], pos: [0, 0.38, 0] });
  torso.add(body);
  if (def.belly) torso.add(tmesh(GEO.sphere, def.belly, { scale: [0.24 * bulk, 0.25, 0.12], pos: [0, 0.34, 0.17 * bulk], outline: 0.02 }));
  if (def.stripes) for (let i = 0; i < 3; i++) torso.add(tmesh(GEO.cyl, def.stripes, { scale: [0.305 * bulk, 0.04, 0.265 * bulk], pos: [0, 0.22 + i * 0.13, 0], outline: 0 }));
  const arms = [-1, 1].map((side) => {
    const pv = new THREE.Group(); pv.position.set(0.34 * side * bulk, 0.62, 0); torso.add(pv);
    pv.add(tmesh(GEO.capsule, def.sleeve || outfit, { scale: [0.085, 0.16, 0.085], pos: [0, -0.2, 0] }));
    if (def.hookHand && side === 1) pv.add(tmesh(GEO.torus, 0xcfd6e0, { scale: [0.12, 0.12, 0.12], pos: [0, -0.48, 0.05], rot: [0, Math.PI / 2, 0] }));
    else pv.add(tmesh(GEO.sphere, def.glove || 0xffffff, { scale: 0.12, pos: [0, -0.42, 0] }));
    return pv;
  });
  const head = new THREE.Group(); head.position.y = 0.95; torso.add(head);
  head.add(tmesh(GEO.sphere, fur, { scale: [0.3, 0.29, 0.29], pos: [0, 0.25, 0] }));
  head.add(tmesh(GEO.sphere, def.muzzle || fur, { scale: [0.17, 0.14, 0.24], pos: [0, 0.15, 0.24] }));
  head.add(tmesh(GEO.sphere, def.nose || 0x1d1530, { scale: def.pig ? [0.09, 0.07, 0.04] : 0.065, pos: [0, 0.2, 0.47] }));
  const eyes = [-1, 1].map((side) => {
    const e = new THREE.Group(); e.position.set(0.1 * side, 0.36, 0.22); head.add(e);
    if (def.eyepatch && side === -1) { e.add(tmesh(GEO.cyl, 0x111111, { scale: [0.08, 0.03, 0.08], rot: [Math.PI / 2, 0, 0], pos: [0, 0, 0.04], outline: 0 })); return e; }
    e.add(tmesh(GEO.sphere, 0xffffff, { scale: [0.075, 0.11, 0.05], outline: 0.015 }));
    e.add(tmesh(GEO.sphere, 0x111111, { scale: [0.035, 0.05, 0.03], pos: [0, -0.01, 0.04], outline: 0 }));
    return e;
  });
  if (def.eyepatch) head.add(tmesh(GEO.torus, 0x111111, { scale: [0.3, 0.3, 0.12], pos: [0, 0.33, 0], rot: [0.3, 0, 0.5], outline: 0 }));
  const ears = [-1, 1].map((side) => {
    const pv = new THREE.Group(); pv.position.set(0.24 * side, 0.42, -0.02); head.add(pv);
    const ec = def.earColor || 0x3a2a20;
    if (def.ears === 'long') pv.add(tmesh(GEO.sphere, ec, { scale: [0.08, 0.3, 0.14], pos: [0.05 * side, -0.24, 0] }));
    else if (def.ears === 'flop') pv.add(tmesh(GEO.sphere, ec, { scale: [0.08, 0.2, 0.13], pos: [0.06 * side, -0.14, 0] }));
    else if (def.ears === 'pig') pv.add(tmesh(GEO.cone, fur, { scale: [0.1, 0.16, 0.06], pos: [0.02 * side, 0.06, 0], rot: [0, 0, -0.5 * side] }));
    else if (def.ears === 'cat') pv.add(tmesh(GEO.cone, fur, { scale: [0.1, 0.18, 0.08], pos: [0, 0.08, 0], rot: [0, 0, -0.3 * side] }));
    else if (def.ears === 'round') pv.add(tmesh(GEO.sphere, ec, { scale: [0.12, 0.12, 0.05], pos: [0.02 * side, 0.02, 0] }));
    return pv;
  });
  if (def.beard) head.add(tmesh(GEO.sphere, def.beard, { scale: [0.24, 0.18, 0.2], pos: [0, 0.02, 0.14] }));
  if (def.whiskers) head.add(tmesh(GEO.box, 0x222222, { scale: [0.5, 0.01, 0.01], pos: [0, 0.16, 0.36], outline: 0 }));
  // Hats
  const hat = new THREE.Group(); hat.position.y = 0.5; head.add(hat);
  const hc = def.hat;
  if (def.hatType === 'fisher') { hat.add(tmesh(GEO.cyl, hc, { scale: [0.38, 0.03, 0.38], pos: [0, 0, 0] })); hat.add(tmesh(GEO.cyl, hc, { scale: [0.24, 0.2, 0.24], pos: [0, 0.1, 0] })); }
  else if (def.hatType === 'cap') { hat.add(tmesh(GEO.sphere, hc, { scale: [0.27, 0.17, 0.27], pos: [0, -0.02, 0] })); hat.add(tmesh(GEO.box, hc, { scale: [0.3, 0.03, 0.22], pos: [0, -0.05, 0.25] })); }
  else if (def.hatType === 'bow') { hat.add(tmesh(GEO.sphere, hc, { scale: [0.1, 0.08, 0.06], pos: [-0.1, -0.02, 0.05] })); hat.add(tmesh(GEO.sphere, hc, { scale: [0.1, 0.08, 0.06], pos: [0.1, -0.02, 0.05] })); }
  else if (def.hatType === 'flat') { hat.add(tmesh(GEO.cyl, hc, { scale: [0.3, 0.07, 0.32], pos: [0, -0.03, 0.03] })); hat.add(tmesh(GEO.box, hc, { scale: [0.3, 0.03, 0.12], pos: [0, -0.06, 0.28] })); }
  else if (def.hatType === 'bandana') { hat.add(tmesh(GEO.sphere, hc, { scale: [0.31, 0.16, 0.31], pos: [0, -0.08, 0] })); hat.add(tmesh(GEO.sphere, hc, { scale: [0.06, 0.1, 0.06], pos: [0.12, -0.08, -0.3] })); }
  else if (def.hatType === 'tricorn') {
    hat.add(tmesh(GEO.cyl, hc, { scale: [0.46, 0.06, 0.46], pos: [0, -0.02, 0] }));
    hat.add(tmesh(GEO.cone, hc, { scale: [0.3, 0.3, 0.3], pos: [0, 0.14, 0] }));
    for (let i = 0; i < 3; i++) { const a = (i / 3) * Math.PI * 2 + Math.PI / 2; hat.add(tmesh(GEO.box, hc, { scale: [0.36, 0.16, 0.05], pos: [Math.cos(a) * 0.3, 0.06, Math.sin(a) * 0.3], rot: [0, -a + Math.PI / 2, 0] })); }
    if (def.skull) hat.add(tmesh(GEO.sphere, 0xffffff, { scale: [0.08, 0.08, 0.03], pos: [0, 0.07, 0.42], outline: 0.01 }));
    if (def.feather) hat.add(tmesh(GEO.sphere, def.feather, { scale: [0.06, 0.32, 0.1], pos: [-0.25, 0.3, -0.1], rot: [0, 0, 0.6] }));
  }
  root.userData.rig = { rig, hip, legs, torso, body, arms, head, eyes, ears, hat, scale: s };
  return root;
}

const Particles = {
  max: 900, list: [], mesh: null,
  init() {
    const mat = new THREE.MeshBasicNodeMaterial();
    this.mesh = new THREE.InstancedMesh(GEO.ico, mat, this.max);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    for (let i = 0; i < this.max; i++) { this.mesh.setColorAt(i, new THREE.Color(1, 1, 1)); }
    this.mesh.count = 0;
    G.scene.add(this.mesh);
    this.tmp = new THREE.Object3D(); this.col = new THREE.Color();
  },
  emit(x, y, z, o = {}) {
    const n = o.n || 8;
    for (let i = 0; i < n; i++) {
      if (this.list.length >= this.max) this.list.shift();
      const a = Math.random() * Math.PI * 2, sp = (o.speed ?? 4) * (0.4 + Math.random() * 0.8);
      this.list.push({
        x: x + (Math.random() - 0.5) * (o.spread ?? 0.4), y: y + (Math.random() - 0.5) * (o.spread ?? 0.4), z: z + (Math.random() - 0.5) * (o.spread ?? 0.4),
        vx: Math.cos(a) * sp, vy: (o.up ?? 4) * (0.5 + Math.random()), vz: Math.sin(a) * sp,
        life: 0, max: (o.life ?? 0.7) * (0.6 + Math.random() * 0.8), size: (o.size ?? 0.18) * (0.6 + Math.random() * 0.8),
        g: o.gravity ?? 12, drag: o.drag ?? 1.5, color: Array.isArray(o.color) ? pick(o.color) : (o.color ?? 0xffffff), spin: Math.random() * 6,
      });
    }
  },
  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i]; p.life += dt;
      if (p.life >= p.max) { L.splice(i, 1); continue; }
      p.vy -= p.g * dt; const d = Math.exp(-p.drag * dt); p.vx *= d; p.vz *= d; p.vy *= p.g ? 1 : d;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.y < 0.05 && p.g > 0) { p.y = 0.05; p.vy *= -0.3; p.vx *= 0.6; p.vz *= 0.6; }
    }
    const m = this.mesh; m.count = L.length;
    for (let i = 0; i < L.length; i++) {
      const p = L[i], k = 1 - p.life / p.max;
      this.tmp.position.set(p.x, p.y, p.z); this.tmp.rotation.set(p.spin * p.life, p.spin * p.life * 0.7, 0);
      this.tmp.scale.setScalar(p.size * (0.3 + 0.7 * k)); this.tmp.updateMatrix();
      m.setMatrixAt(i, this.tmp.matrix); m.setColorAt(i, this.col.set(p.color));
    }
    m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true;
  },
  clear() { this.list.length = 0; },
};

/** Comic-book word pops ("BONK!") anchored to a world point, drawn in the DOM. */
function popText(text, x, y, z, color = '#ffd34d', size = 4.2) {
  const el = document.createElement('div');
  el.textContent = text;
  el.style.cssText = `position:fixed;pointer-events:none;font-family:'Luckiest Guy',sans-serif;font-size:calc(var(--u)*${size});color:${color};-webkit-text-stroke:calc(var(--u)*.35) #1d1530;text-shadow:0 4px 0 #1d1530;transform:translate(-50%,-50%) rotate(${(Math.random() - 0.5) * 20}deg);white-space:nowrap;z-index:5`;
  document.body.appendChild(el);
  G.popups.push({ el, x, y, z, t: 0 });
}
function updatePopups(dt) {
  const v = new THREE.Vector3();
  for (let i = G.popups.length - 1; i >= 0; i--) {
    const p = G.popups[i]; p.t += dt;
    if (p.t > 0.9) { p.el.remove(); G.popups.splice(i, 1); continue; }
    v.set(p.x, p.y + p.t * 1.6, p.z).project(G.camera);
    const s = p.t < 0.12 ? 0.5 + p.t * 5 : 1;
    p.el.style.left = ((v.x + 1) / 2) * innerWidth + 'px';
    p.el.style.top = ((1 - v.y) / 2) * innerHeight + 'px';
    p.el.style.opacity = String(p.t > 0.6 ? 1 - (p.t - 0.6) / 0.3 : 1);
    p.el.style.scale = String(s);
  }
}

// ============================================================================
// World: tiles, Rapier physics, entities and their views. The simulation lives in 05-sim.js.
// ============================================================================
const GRP = { WALL: 1, WATER: 2, PIT: 4, BLOCK: 8, PLAYER: 16, ENEMY: 32, PROJ: 64, OBJ: 128 };
const groups = (member, filter = 0xffff) => ((member & 0xffff) << 16) | (filter & 0xffff);
const Q_PLAYER = groups(GRP.PLAYER, GRP.WALL | GRP.WATER | GRP.BLOCK | GRP.OBJ);
const Q_ENEMY = groups(GRP.ENEMY, GRP.WALL | GRP.WATER | GRP.PIT | GRP.BLOCK | GRP.OBJ);
const Q_BOSS = groups(GRP.ENEMY, GRP.WALL | GRP.WATER | GRP.PIT | GRP.BLOCK);

const KINDS = ['block', 'barrel', 'pot', 'grunt', 'crab', 'bomber', 'brute', 'boss', 'gem', 'redgem', 'fruit', 'key', 'bomb', 'bell', 'parrot'];
const STATES = ['idle', 'carried', 'thrown', 'gone', 'slide', 'sunk', 'walk', 'chase', 'stun', 'dance', 'lured', 'launched', 'dead', 'attack',
  'hurt', 'lit', 'ring', 'stalk', 'volley', 'charge', 'dizzy', 'intro', 'defeated', 'return', 'fly', 'pulled', 'scuttle', 'wait', 'swoop'];
const ENEMY_KINDS = new Set(['grunt', 'crab', 'bomber', 'brute', 'boss']);
const LIFTABLE = new Set(['barrel', 'pot', 'bomb']);
const PICKUPS = new Set(['gem', 'redgem', 'fruit', 'key']);
const CHAR_ENT = { G: 'grunt', C: 'crab', M: 'bomber', R: 'brute', Q: 'boss', B: 'block', b: 'barrel', p: 'pot', f: 'fruit', d: 'gem', D: 'redgem', K: 'key' };
const SOLID_CH = new Set(['#', 't', 'T', 'H', 'N', 'c']);

const tkey = (gx, gz) => (gx + 512) * 4096 + (gz + 512);
const tileX = (gx) => (gx + 0.5) * TILE;
const toG = (x) => Math.floor(x / TILE);
const DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]]; // cardinal by facing quadrant: +z, +x, -z, -x
const faceToDir = (face) => DIRS[((Math.round(face / (Math.PI / 2)) % 4) + 4) % 4];

class World {
  /**
   * opts: { authority, mode: 'solo'|'local'|'hub'|'attract', startRoom, players:[{ id, crew, name, color, local, device, bot }] }
   */
  constructor(opts) {
    this.opts = opts;
    this.authority = opts.authority;
    this.mode = opts.mode;
    this.tiles = new Map();
    this.ents = new Map();
    this.players = new Map();
    this.nextId = 1;
    this.time = 0;
    this.events = [];
    this.group = new THREE.Group();
    this.team = { items: [], keys: 0, score: 0, lives: 3, plankPlaced: null, bell: null, gemsTotal: 0, nextLife: 5000 };
    this.rooms = ROOMS.map((r, i) => ({ ...r, index: i, gx0: r.at[0] * RW, gz0: r.at[1] * RH, solved: false, visited: false, chestOpened: false, switches: [], gates: [], digTiles: [], pressed: 0 }));
    this.stats = { bonks: 0, gems: 0, deaths: 0, items: 0, startedAt: performance.now(), secrets: 0 };
    this.boss = null; this.won = false;
    this.fxOut = [];
  }

  async build() {
    this.physics = new RAPIER.World({ x: 0, y: -24, z: 0 });
    this.eventQueue = new RAPIER.EventQueue(true);
    this.cc = this.physics.createCharacterController(0.02);
    this.cc.setSlideEnabled(true);
    this.cc.setApplyImpulsesToDynamicBodies(false);
    this.handleToEnt = new Map();
    G.scene.add(this.group);
    for (const room of this.rooms) this.buildRoom(room);
    this.buildDecor();
    for (const p of this.opts.players) this.addPlayer(p);
  }

  dispose() {
    G.scene.remove(this.group);
    for (const p of this.players.values()) if (p.tag) p.tag.remove();
    try { this.physics.free(); } catch { /* already freed */ }
    Particles.clear();
  }

  // ------------------------------------------------------------------ tiles
  tile(gx, gz) { return this.tiles.get(tkey(gx, gz)); }
  tileAt(x, z) { return this.tile(toG(x), toG(z)); }
  roomOf(x, z) {
    const gx = toG(x), gz = toG(z);
    for (const r of this.rooms) if (gx >= r.gx0 && gx < r.gx0 + RW && gz >= r.gz0 && gz < r.gz0 + RH) return r.index;
    return -1;
  }
  roomCenter(i) { const r = this.rooms[i]; return { x: (r.gx0 + RW / 2) * TILE, z: (r.gz0 + RH / 2) * TILE }; }
  /** Walkable for a player standing there (not solid, not water). Pits are walkable (and deadly). */
  walkable(t) { return t && (t.type === 'floor' || t.type === 'pit' || (t.type === 'gate' && t.open) || (t.type === 'lock' && t.open)); }
  isPitHole(t) { return t && t.type === 'pit' && !t.bridged && !t.filled; }
  /** Can a sliding block enter this tile? */
  blockFree(gx, gz, room, ignore) {
    const t = this.tile(gx, gz);
    if (!t || t.room !== room) return false;
    if (!(t.type === 'floor' || t.type === 'pit' || ((t.type === 'gate' || t.type === 'lock') && t.open))) return false;
    for (const e of this.ents.values()) {
      if (e === ignore || !e.alive) continue;
      if (e.kind === 'block' && e.st !== 'sunk' && e.gx === gx && e.gz === gz) return false;
      if ((e.kind === 'barrel' || e.kind === 'pot') && e.st === 'idle' && toG(e.x) === gx && toG(e.z) === gz) return false;
    }
    return true;
  }

  staticCollider(x, z, member, hx = TILE / 2, hy = 1.5, cy = 1.5) {
    const c = this.physics.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hx).setTranslation(x, cy, z).setCollisionGroups(groups(member)));
    return c;
  }

  buildRoom(room) {
    const theme = room.theme;
    const rand = mulberry(1234 + room.index * 97);
    const floorPal = { beach: [0xf2d49b, 0xead09a, 0xf5dcaa], stone: [0xc9c2b5, 0xbcb5a8, 0xd2ccc0], wood: [0xb47c4c, 0xa8703f, 0xbb8452], ship: [0xc08a55, 0xb57f4a, 0xc79260] }[theme];
    const floors = [], walls = [], sign = [];
    let signIdx = 0, digIdx = 0;
    for (let r = 0; r < RH; r++) {
      for (let c = 0; c < RW; c++) {
        const ch = room.grid[r][c];
        const gx = room.gx0 + c, gz = room.gz0 + r, x = tileX(gx), z = tileX(gz);
        const t = { gx, gz, x, z, room: room.index, ch, type: 'floor', open: false };
        this.tiles.set(tkey(gx, gz), t);
        if (ch !== '~' && ch !== 'o') floors.push(t);
        if (ch === '#') { t.type = 'wall'; walls.push(t); t.col = this.staticCollider(x, z, GRP.WALL); }
        else if (ch === 't') { t.type = 'wall'; t.col = this.staticCollider(x, z, GRP.WALL, 0.7); { const tree = theme === 'ship' ? this.makeMast() : this.makePalm(rand); tree.position.set(x, 0, z); this.group.add(tree); } }
        else if (ch === 'T') { t.type = 'wall'; t.col = this.staticCollider(x, z, GRP.WALL, 0.4); const m = makeTorch(); m.position.set(x, 0, z); this.group.add(m); t.view = m; (this.torches ||= []).push(m); }
        else if (ch === 'H') { t.type = 'post'; t.col = this.staticCollider(x, z, GRP.WALL, 0.5); const m = makePost(); m.position.set(x, 0, z); this.group.add(m); }
        else if (ch === 'N') { t.type = 'sign'; t.sign = (room.signs || [])[signIdx++]; t.col = this.staticCollider(x, z, GRP.WALL, 0.6); const m = makeSign(); m.position.set(x, 0, z); this.group.add(m); sign.push(t); }
        else if (ch === 'c') { t.type = 'chest'; t.item = room.chest; t.col = this.staticCollider(x, z, GRP.WALL, 0.8); const m = makeChest(); m.position.set(x, 0, z); this.group.add(m); t.view = m; }
        else if (ch === '~') { t.type = 'water'; t.col = this.staticCollider(x, z, GRP.WATER, TILE / 2, 1, 0.5); }
        else if (ch === 'o') {
          t.type = 'pit'; t.col = this.staticCollider(x, z, GRP.PIT, TILE / 2, 1, 0.5);
          const hole = new THREE.Mesh(GEO.box, unlit(0x0b0716)); hole.scale.set(TILE, 2, TILE); hole.position.set(x, -1.06, z); this.group.add(hole);
        } else if (ch === 'g') { t.type = 'gate'; t.col = this.staticCollider(x, z, GRP.WALL); const m = makeGate(); m.position.set(x, 0, z); m.rotation.y = c === 0 || c === RW - 1 ? Math.PI / 2 : 0; this.group.add(m); t.view = m; room.gates.push(t); }
        else if (ch === 'L') { t.type = 'lock'; t.col = this.staticCollider(x, z, GRP.WALL); const m = makeLockDoor(); m.position.set(x, 0, z); this.group.add(m); t.view = m; room.gates.push(t); }
        else if (ch === 'S') { t.switch = true; const m = makeSwitch(); m.position.set(x, 0, z); this.group.add(m); t.view = m; room.switches.push(t); }
        else if (ch === 'r') { t.rune = true; const m = makeRune(); m.position.set(x, 0, z); this.group.add(m); t.view = m; room.rune = t; }
        else if (ch === 'X') { t.dig = (room.digs || [])[digIdx++] || 'gem'; const m = makeDig(); m.position.set(x, 0, z); this.group.add(m); t.view = m; room.digTiles.push(t); }
        else if (ch === '1') { (room.spawns ||= []).push({ x, z }); }
        else if (CHAR_ENT[ch]) this.spawn(CHAR_ENT[ch], x, z, { room: room.index, home: true });
      }
    }
    // Floor tiles: one instanced mesh per room, gently varied.
    const fm = new THREE.InstancedMesh(GEO.box, toon(0xffffff), floors.length);
    const o = new THREE.Object3D(), col = new THREE.Color();
    floors.forEach((t, i) => {
      o.position.set(t.x, -0.3, t.z); o.scale.set(TILE, 0.6, TILE); o.rotation.set(0, 0, 0); o.updateMatrix(); fm.setMatrixAt(i, o.matrix);
      const pal = floorPal[(t.gx + t.gz) % 2 === 0 ? 0 : 1 + ((rand() * 2) | 0) % 2];
      fm.setColorAt(i, col.set(pal).offsetHSL(0, 0, (rand() - 0.5) * 0.03));
    });
    fm.receiveShadow = true; this.group.add(fm);
    if (theme === 'wood' || theme === 'ship') {
      // plank seams
      const seams = new THREE.InstancedMesh(GEO.box, unlit(theme === 'ship' ? 0x8a5a30 : 0x7a4f2e), floors.length * 2);
      let n = 0;
      for (const t of floors) for (const dz of [-0.33, 0.33]) { o.position.set(t.x, 0.005, t.z + dz * TILE); o.scale.set(TILE, 0.01, 0.06); o.updateMatrix(); seams.setMatrixAt(n++, o.matrix); }
      this.group.add(seams);
    }
    // Walls

// ============================================================================
// Simulation. The authority (solo, local co-op, hub host) runs everything shared;
// every copy moves its own players. Remote copies send actions; the authority resolves them.
// ============================================================================
const SCORE = { gem: 10, redgem: 50, fruit: 25, key: 50, bonk: 100, boss: 2000, bossHit: 250 };

Object.assign(World.prototype, {
  emit(type, data = {}) { this.events.push({ type, ...data }); },
  /** A cosmetic effect at a point: played here and forwarded to the other copies by the host. */
  fx(name, x, y, z, extra) {
    playFx(this, name, x, y, z, extra);
    if (this.mode === 'hub' && this.authority) this.fxOut.push([name, r1(x), r1(y), r1(z), extra ?? 0]);
  },

  // ------------------------------------------------------------------ the step
  step(dt) {
    this.time += dt;
    for (const p of this.players.values()) if (p.local) this.controlPlayer(p, dt);
    if (this.authority) {
      this.simEntities(dt);
      this.physics.step(this.eventQueue);
      this.eventQueue.drainCollisionEvents((h1, h2, started) => {
        if (!started) return;
        for (const h of [h1, h2]) { const e = this.projByHandle?.get(h); if (e && e.st === 'thrown') e.hitWall = true; }
      });
      this.simGoals(dt);
      this.simPlayersHost(dt);
      if (this.boss && this.boss.alive) this.simBoss(this.boss, dt);
    } else {
      this.physics.step(this.eventQueue);
      this.eventQueue.clear();
      this.interpolate(dt);
    }
    for (const p of this.players.values()) if (!p.local) {
      p.x = damp(p.x, p.tx, 14, dt); p.z = damp(p.z, p.tz, 14, dt);
      if (Math.abs(p.x - p.tx) > 8 || Math.abs(p.z - p.tz) > 8) { p.x = p.tx; p.z = p.tz; }
      p.room = this.roomOf(p.x, p.z);
    }
  },

  // ------------------------------------------------------------------ players
  controlPlayer(p, dt) {
    const inp = p.pend || { x: 0, z: 0 };
    p.pend = { x: inp.x, z: inp.z, actionHeld: inp.actionHeld, itemHeld: inp.itemHeld };
    p.felt = { x: r1(inp.x), y: r1(inp.z), fire: !!(inp.actionHeld || inp.action) };
    p.invuln = Math.max(0, p.invuln - dt); p.dashCd = Math.max(0, p.dashCd - dt);
    p.kickT = Math.max(0, p.kickT - dt); p.throwT = Math.max(0, p.throwT - dt); p.itemT = Math.max(0, (p.itemT || 0) - dt);
    if (p.frozen) { p.speed = 0; return; }
    if (p.st === 'ko') {
      p.timer -= dt;
      if (p.timer <= 0) { p.st = 'normal'; p.hp = p.maxHp; p.invuln = 2; p.x = p.checkpoint.x; p.z = p.checkpoint.z; p.y = 0; this.fx('poof', p.x, 1, p.z); this.syncCol(p); }
      return;
    }
    if (p.st === 'fall') {
      p.timer -= dt; p.y -= dt * 6;
      if (p.timer <= 0) {
        p.st = 'normal'; p.y = 0; p.x = p.safe.x; p.z = p.safe.z; this.syncCol(p);
        this.applyHurt(p, p.x, p.z, true);
      }
      return;
    }
    if (p.st === 'zip') {
      const dx = p.zipX - p.x, dz = p.zipZ - p.z, d = Math.hypot(dx, dz), sp = 24 * dt;
      p.y = Math.sin(clamp(1 - d / p.zipLen, 0, 1) * Math.PI) * 1.2;
      if (d <= sp) { p.x = p.zipX; p.z = p.zipZ; p.y = 0; p.st = 'normal'; this.syncCol(p); p.safe = { x: p.x, z: p.z }; }
      else { p.x += (dx / d) * sp; p.z += (dz / d) * sp; this.syncCol(p); }
      return;
    }
    const carrying = this.carriedView(p.id);
    let vx, vz;
    const base = p.crew.id === 'rex' ? 7.8 : p.crew.id === 'duffy' ? 7.0 : 7.3;
    if (p.dashT > 0) { p.dashT -= dt; vx = p.dashX * 17; vz = p.dashZ * 17; if (Math.random() < 0.5) FX.dust(p.x, p.z, 1); }
    else if (p.knockT > 0) { p.knockT -= dt; vx = p.knockX; vz = p.knockZ; p.knockX *= 0.9; p.knockZ *= 0.9; }
    else { const sp = base * (carrying ? 0.86 : 1); vx = inp.x * sp; vz = inp.z * sp; }
    const mag = Math.hypot(inp.x, inp.z);
    if (mag > 0.2 && p.dashT <= 0 && !(p.knockT > 0)) p.face = dampAngle(p.face, Math.atan2(inp.x, inp.z), 18, dt);
    this.moveBody(p, vx * dt, vz * dt, Q_PLAYER, p.noclip);
    p.speed = Math.hypot(vx, vz);
    // Pits and safe ground
    const t = this.tileAt(p.x, p.z);
    if (t && this.isPitHole(t) && p.dashT <= 0 && !p.noclip) {
      const cx = Math.abs(p.x - t.x), cz = Math.abs(p.z - t.z);
      if (cx < 0.75 && cz < 0.75) { p.st = 'fall'; p.timer = 0.75; audio.sfx('fall'); this.dropCarriedRequest(p); return; }
    } else if (t && t.type === 'floor' && !p.noclip) {
      const near = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => this.isPitHole(this.tile(t.gx + a, t.gz + b)));
      if (!near || (Math.abs(p.x - t.x) < 0.5 && Math.abs(p.z - t.z) < 0.5)) p.safe = { x: near ? t.x : p.x, z: near ? t.z : p.z };
    }
    // Room tracking (own players set their own checkpoints)
    const room = this.roomOf(p.x, p.z);
    if (room >= 0 && room !== p.room) { p.room = room; p.checkpoint = { x: p.x, z: p.z }; const e = this.entryPoint(room, p.id); if (Math.hypot(e.x - p.x, e.z - p.z) < 6) p.checkpoint = e; this.emit('playerRoom', { id: p.id, room }); }
    // Verbs
    if (inp.swap || inp.swapBack) {
      const n = this.team.items.length;
      if (n > 1) { p.item = (p.item + (inp.swapBack ? n - 1 : 1)) % n; audio.sfx('tick'); this.emit('swap', { id: p.id }); }
    }
    if (inp.dash) {
      if (carrying) this.request(p, 'drop');
      else if (p.dashCd <= 0) { p.dashT = 0.18; p.dashCd = 0.55; p.dashX = Math.sin(p.face); p.dashZ = Math.cos(p.face); p.invuln = Math.max(p.invuln, 0.2); audio.sfx('dash'); FX.dust(p.x, p.z, 6); }
    }
    if (inp.action) {

  simProjectile(e, dt) {

  // ------------------------------------------------------------------ authority: goals & rooms

  damageBoss(b, by) {

    this.fx('squawk', parrot.x, 6, parrot.z);
  },
  simParrot(e, dt) {
    if (!this.boss) { e.y += dt * 4; e.x += dt * 8; if (e.y > 16) this.removeEnt(e); return; }
    const c = this.roomCenter(e.room);
    e.timer -= dt;
    if (e.st === 'fly') {
      e.ang += dt * 0.8;
      const tx = c.x + Math.cos(e.ang) * 11, tz = c.z + Math.sin(e.ang) * 7;
      e.x = damp(e.x, tx, 2, dt); e.z = damp(e.z, tz, 2, dt); e.y = damp(e.y, 7, 2, dt);
      e.rot = Math.atan2(-Math.sin(e.ang), Math.cos(e.ang));
      if (e.timer <= 0) {
        e.timer = 5.5;
        let n = 0; for (const o of this.ents.values()) if (o.alive && o.kind === 'barrel' && o.room === e.room && o.st !== 'gone') n++;
        if (n < 4) {
          const room = this.rooms[e.room];
          for (let k = 0; k < 20; k++) {
            const gx = room.gx0 + 2 + ((Math.random() * (RW - 4)) | 0), gz = room.gz0 + 2 + ((Math.random() * (RH - 4)) | 0);
            const t = this.tile(gx, gz);
            if (t && t.type === 'floor' && this.blockFree(gx, gz, e.room) && !this.playerNear(t.x, t.z, 1.6) && (!this.boss || dist2(t.x, t.z, this.boss.x, this.boss.z) > 9)) { e.st = 'swoop'; e.drop = { x: t.x, z: t.z }; e.swoopT = 0; this.fx('squawk', e.x, e.y, e.z); break; }
          }
        }

    } else if (e.st === 'swoop') {
      e.swoopT += dt;
      e.x = damp(e.x, e.drop.x, 4, dt); e.z = damp(e.z, e.drop.z, 4, dt); e.y = damp(e.y, 4, 3, dt);
      e.rot = Math.atan2(e.drop.x - e.x, e.drop.z - e.z);
      if (e.swoopT > 1.0) {
        const bar = this.spawn('barrel', e.drop.x, e.drop.z, { id: this.dynId(), room: e.room });
        bar.y = 3.5; bar.vy = 0;
        e.st = 'fly'; e.timer = 5.5;
      }
    }
  },
  win() {
    if (this.won) return;
    this.won = true;
    this.fx('splash', this.cage.position.x, 0, this.cage.position.z);
    this.emit('win');
    if (this.mode === 'hub') Net.event({ t: 'win' });
  },

  // ------------------------------------------------------------------ remote copies
  interpolate(dt) {
    for (const e of this.ents.values()) {
      if (e.st === 'carried') {
        const c = this.players.get(e.carrier);
        if (c) { e.x = c.x; e.z = c.z; e.y = 2.0 + c.y; continue; }
      }
      const k = e.st === 'thrown' || e.st === 'launched' ? 20 : 12;
      e.x = damp(e.x, e.tx, k, dt); e.z = damp(e.z, e.tz, k, dt); e.y = damp(e.y, e.ty, k, dt);
      e.rot = dampAngle(e.rot, e.trot, 10, dt);
      if (e.col && e.kind === 'brute') e.col.setTranslation({ x: e.x, y: 1.0, z: e.z });
      if (e.col && (e.kind === 'block' || e.kind === 'barrel' || e.kind === 'pot')) {
        const solid = e.kind === 'block' ? e.st !== 'sunk' : e.st === 'idle';
        if (e.col.isEnabled() !== solid) e.col.setEnabled(solid);
        e.col.setTranslation({ x: e.x, y: e.kind === 'block' ? 1 : 0.7, z: e.z });
      }
    }
  },
});

const camFocus = new THREE.Vector3();

function playFx(world, name, x, y, z, extra) {
  const d = Math.hypot(x - camFocus.x, z - camFocus.z);
  const v = clamp(1.15 - d / 34, 0.2, 1);
  const s = (n) => audio.sfx(n, { v });
  switch (name) {
    case 'lift': s('lift'); break;
    case 'throw': s('throw'); break;
    case 'thud': s('thud'); FX.dust(x, z, 5); break;
    case 'break': s('break'); FX.splinters(x, y, z); popText(pick(['CRASH!', 'KRAK!', 'SMASH!']), x, y + 1, z, '#ffc93c', 3.6); break;
    case 'shatter': s('shatter'); FX.shards(x, y, z); popText('KRSSH!', x, y + 1, z, '#ff9d3c', 3.4); break;
    case 'kick': s('kick'); FX.dust(x, z, 8); popText('WHAM!', x, y + 1.5, z, '#5ef0ff', 3.6); break;
    case 'slide': s('slide'); break;
    case 'bonk': s('bonk'); FX.stars(x, y, z); popText(pick(['BONK!', 'POW!', 'WHACK!', 'BOINK!']), x, y + 0.8, z); G.shake = Math.max(G.shake, 0.25); break;
    case 'launch': s('launch'); break;
    case 'poof': s('poof'); FX.poof(x, y, z); break;
    case 'explode': s('explode'); FX.boom(x, z); popText('KA-BOOM!', x, 2.4, z, '#ff6b4a', 5); G.shake = Math.max(G.shake, 0.8); break;
    case 'gem': s('gem'); FX.sparkle(x, y, z); popText('+10', x, y + 0.6, z, '#4fd1ff', 3); break;
    case 'biggem': s('biggem'); FX.sparkle(x, y, z, 0xff4d6d); popText('+50', x, y + 0.6, z, '#ff4d6d', 3.6); break;
    case 'fruit': s('fruit'); FX.hearts(x, y, z); popText('YUM!', x, y + 0.6, z, '#ff9db0', 3.2); break;
    case 'key': s('key'); FX.sparkle(x, y, z, 0xffc93c); popText('KEY!', x, y + 0.6, z, '#ffc93c', 3.6); break;
    case 'chest': s('chest'); FX.sparkle(x, y + 0.6, z, 0xffc93c); break;
    case 'unlock': s('unlock'); break;
    case 'gate': s('gate'); FX.dust(x, z, 10); break;
    case 'solve': s('solve'); FX.sparkle(x, y, z, 0x5ef0ff); break;
    case 'switch': s('switch'); break;
    case 'clink': s('clink'); Particles.emit(x, y, z, { n: 5, color: 0xffffff, speed: 3, up: 2, life: 0.3, size: 0.1 }); break;
    case 'stun': s('stun'); FX.stars(x, y, z); popText('DIZZY!', x, y + 0.5, z, '#ffd34d', 3); break;
    case 'hook': s('hook'); if (Array.isArray(extra)) world.hookFx(x, z, extra[0], extra[1], extra[2]); break;
    case 'zip': s('zip'); break;
    case 'dig': s('dig'); FX.sand(x, z); break;
    case 'plank': s('plank'); FX.dust(x, z, 8); break;
    case 'bell': s('bell'); FX.notes(x, z); break;
    case 'notes': FX.notes(x, z); break;
    case 'dust': FX.dust(x, z, 2); break;
    case 'splash': s('splash'); FX.splash(x, z); popText('SPLOOSH!', x, 2, z, '#bff6ff', 4.4); break;
    case 'bosshit': s('bosshit'); FX.stars(x, y, z); popText(pick(['KER-BONK!', 'KA-POW!', 'THWACK!']), x, y + 1, z, '#ff6b4a', 5); break;
    case 'squawk': s('squawk'); break;
    case 'oneup': s('oneup'); popText('1-UP!', x, y + 1, z, '#4cc46a', 4.4); break;
    case 'dash': s('dash'); break;
    case 'warp': s('warp'); FX.sparkle(x, y, z, 0x5ef0ff); break;
    case 'nope': s('back'); break;
  }
}

/** Swing limbs from movement and state. Every critter (heroes, pirates, captain) shares this. */
function animCritter(view, o, dt) {
  const R = view.userData.rig; if (!R) return;
  R.phase = (R.phase || 0) + dt * (4 + o.move * 9);
  const ph = R.phase, t = o.t, m = clamp(o.move, 0, 1);
  const sw = Math.sin(ph) * 0.85 * m;
  let legL = sw, legR = -sw, armL = -sw * 0.9, armR = sw * 0.9, armLz = 0.12, armRz = -0.12;
  let bodyX = 0, bodyZ = 0, bodyY = Math.abs(Math.sin(ph)) * 0.09 * m, headX = 0, headZ = 0;
  if (o.carry) { armL = armR = -2.9; armLz = 0.25; armRz = -0.25; }
  if (o.throwT > 0) { const k = o.throwT / 0.3; armL = armR = -2.9 + (1 - k) * 2.2; }
  if (o.kickT > 0) { const k = Math.sin((1 - o.kickT / 0.35) * Math.PI); legR = -1.5 * k; bodyX = -0.15 * k; }
  if (o.dash) { bodyX = 0.45; armL = armR = 1.0; }
  if (o.zip) { armL = armR = -1.6; legL = 0.6; legR = 0.3; }
  if (o.dance) { bodyZ = Math.sin(t * 9) * 0.3; armL = -2.6 + Math.sin(t * 9) * 0.4; armR = -2.6 - Math.sin(t * 9) * 0.4; legL = Math.max(0, Math.sin(t * 9)) * 0.7; legR = Math.max(0, -Math.sin(t * 9)) * 0.7; bodyY = Math.abs(Math.sin(t * 9)) * 0.15; }
  if (o.stun) { headZ = Math.sin(t * 7) * 0.3; bodyZ = Math.sin(t * 7) * 0.1; armL = armR = 0.3; }
  if (o.attack) { armR = -2.6 + Math.sin(t * 20) * 0.2; bodyX = -0.2; }
  if (o.windup) { bodyX = -0.35 + Math.sin(t * 30) * 0.05; armL = armR = 0.8; }
  if (o.hurt) { headX = -0.3; armL = armR = -1.2; armLz = 0.9; armRz = -0.9; }
  const idle = 1 - m;
  R.legs[0].rotation.x = damp(R.legs[0].rotation.x, legL, 20, dt);
  R.legs[1].rotation.x = damp(R.legs[1].rotation.x, legR, 20, dt);
  R.arms[0].rotation.x = damp(R.arms[0].rotation.x, armL, 16, dt);
  R.arms[1].rotation.x = damp(R.arms[1].rotation.x, armR, 16, dt);
  R.arms[0].rotation.z = damp(R.arms[0].rotation.z, armLz, 12, dt);
  R.arms[1].rotation.z = damp(R.arms[1].rotation.z, armRz, 12, dt);
  R.torso.rotation.x = damp(R.torso.rotation.x, bodyX, 12, dt);
  R.torso.rotation.z = damp(R.torso.rotation.z, bodyZ, 12, dt);
  R.torso.position.y = 0.55 + bodyY + Math.sin(t * 2.6) * 0.015 * idle;
  R.head.rotation.x = damp(R.head.rotation.x, headX, 10, dt);
  R.head.rotation.z = damp(R.head.rotation.z, headZ + Math.sin(t * 1.3) * 0.04 * idle, 10, dt);
  for (const e of R.ears) e.rotation.x = damp(e.rotation.x, -o.move * 0.5 + Math.sin(ph * 2) * 0.2 * m, 8, dt);
  // Blink now and then.
  const blink = (t % 3.7) < 0.1 ? 0.15 : 1;
  for (const e of R.eyes) e.scale.y = blink;
  // Squash & stretch on landing (y velocity proxy).
  const sq = o.squash || 0;
  R.rig.scale.set(R.scale * (1 + sq * 0.25), R.scale * (1 - sq * 0.3), R.scale * (1 + sq * 0.25));
}

Object.assign(World.prototype, {
  hookFx(x0, z0, x1, z1, pid) {
    const line = new THREE.Mesh(GEO.cylLo, toon(0x6a6a7a)); line.castShadow = false;
    const head = makeHookHead();
    this.group.add(line, head);
    (this.hooks ||= []).push({ line, head, x0, z0, x1, z1, pid, t: 0 });
  },
  /** Per-frame view sync. `dt` is real frame time. */
  animate(dt) {
    const t = this.time;
    // Players
    for (const p of this.players.values()) {
      const v = p.view; if (!v) continue;
      v.position.set(p.x, Math.max(-3, p.y), p.z);
      v.rotation.y = p.face;
      const carry = !!this.carriedView(p.id);
      const R = v.userData.rig;
      v.visible = !(p.invuln > 0 && p.st === 'normal' && Math.floor(t * 16) % 2 === 0);
      if (p.st === 'ko') { R.rig.rotation.x = damp(R.rig.rotation.x, -Math.PI / 2, 10, dt); R.rig.position.y = 0.35; v.visible = true; }
      else { R.rig.rotation.x = damp(R.rig.rotation.x, 0, 12, dt); R.rig.position.y = 0; }
      const sc = p.st === 'fall' ? Math.max(0.05, p.timer / 0.75) : 1;
      v.scale.setScalar(sc);
      if (p.lastY !== undefined && p.lastY > 0.2 && p.y <= 0.01) p.squash = 1;
      p.squash = Math.max(0, (p.squash || 0) - dt * 5); p.lastY = p.y;
      animCritter(v, { move: p.st === 'normal' ? p.speed / 7.5 : 0, t, carry, throwT: p.throwT, kickT: p.kickT, dash: p.dashT > 0, zip: p.st === 'zip', hurt: p.knockT > 0, squash: Math.sin(p.squash * Math.PI) * p.squash }, dt);
      if (p.local && p.st === 'normal' && p.speed > 1 && Math.floor(R.phase / Math.PI) !== p.lastStep) { p.lastStep = Math.floor(R.phase / Math.PI); if (Math.random() < 0.5) audio.sfx('step', { v: 0.6 }); }
    }
    // Entities
    for (const e of this.ents.values()) {
      const v = e.view; if (!v) continue;
      v.visible = e.st !== 'gone';
      let x = e.x, y = e.y, z = e.z;
      if (e.st === 'carried') { const c = this.players.get(e.carrier); if (c) { x = c.x; z = c.z; y = (c.crew.id === 'rex' ? 1.75 : c.crew.id === 'duffy' ? 2.15 : 1.95) + c.y; v.rotation.y = c.face; } }
      v.position.set(x, y, z);
      if (e.kind === 'block') {
        e.wobble = Math.max(0, (e.wobble || 0) - dt);
        v.position.x += Math.sin(t * 60) * e.wobble * 0.15;
        continue;
      }
      if (e.kind === 'barrel' || e.kind === 'pot' || e.kind === 'bomb') {
        if (e.st === 'thrown') { v.rotation.x += dt * 14; } else if (e.st !== 'carried') { v.rotation.x = damp(v.rotation.x, 0, 10, dt); }
        if (e.kind === 'bomb') {
          const fuse = e.fuse ?? 2;
          const flash = fuse < 1.1 && Math.floor(t * (fuse < 0.5 ? 20 : 10)) % 2 === 0;
          v.children[0].material = toon(flash ? 0xe8443a : 0x22222a);
          v.scale.setScalar(1 + (flash ? 0.12 : 0));
          v.userData.spark.visible = Math.floor(t * 30) % 2 === 0;
          if (Math.random() < 0.4) Particles.emit(x, y + 1.1, z, { n: 1, color: [0xffd34d, 0xff8a3c], speed: 1, up: 2, life: 0.3, size: 0.08, gravity: 2 });
        }
        continue;
      }
      if (PICKUPS.has(e.kind)) { const sp = v.userData.spin; if (sp) { sp.rotation.y = t * 3 + e.id; sp.position.y = (e.kind === 'fruit' ? 0.6 : 0.8) + Math.sin(t * 4 + e.id) * 0.12; } continue; }
      if (e.kind === 'bell') { v.userData.swing.rotation.z = Math.sin(t * 9) * 0.5; continue; }
      if (e.kind === 'parrot') {
        v.rotation.y = e.rot;
        const R = v.userData.rig; const f = Math.sin(t * 16) * 0.8; R.wings[0].rotation.z = f; R.wings[1].rotation.z = -f; R.rig.position.y = Math.sin(t * 4) * 0.2;
        continue;
      }
      if (ENEMY_KINDS.has(e.kind)) this.animEnemy(e, v, dt, t);
    }
    // Hooks
    if (this.hooks) for (let i = this.hooks.length - 1; i >= 0; i--) {
      const h = this.hooks[i]; h.t += dt;
      const ext = h.t < 0.14 ? h.t / 0.14 : h.t < 0.24 ? 1 : 1 - (h.t - 0.24) / 0.2;
      const p = this.players.get(h.pid);
      const ox = p ? p.x : h.x0, oz = p ? p.z : h.z0;
      const ex = lerp(ox, h.x1, ext), ez = lerp(oz, h.z1, ext);
      const len = Math.max(0.01, Math.hypot(ex - ox, ez - oz));
      h.line.position.set((ox + ex) / 2, 1.4, (oz + ez) / 2); h.line.scale.set(0.05, len, 0.05);
      h.line.rotation.set(Math.PI / 2, 0, 0); h.line.rotation.order = 'YXZ'; h.line.rotation.y = Math.atan2(ex - ox, ez - oz);
      h.head.position.set(ex, 1.4, ez); h.head.rotation.y = Math.atan2(ex - ox, ez - oz);
      if (h.t > 0.44) { this.group.remove(h.line, h.head); this.hooks.splice(i, 1); }
    }
    // Tiles with state
    for (const room of this.rooms) {
      for (const g of room.gates) if (g.view) g.view.position.y = damp(g.view.position.y, g.open ? -2.75 : 0, 5, dt);
      for (const s of room.switches) { const on = this.switchPressed(s); s.view.userData.plate.material = toon(on ? 0x4cc46a : 0xe8443a); s.view.userData.plate.position.y = damp(s.view.userData.plate.position.y, on ? 0.04 : 0.12, 14, dt); }
      if (room.rune) { const r = room.rune.view.userData.ring; r.rotation.z = t * 1.5; const k = room.solved ? 0.4 : 0.9 + Math.sin(t * 4) * 0.1; r.scale.set(0.7 * k, 0.7 * k, 0.3); room.rune.view.visible = !room.solved; }
    }
    for (const tl of this.tiles.values()) if (tl.type === 'chest' && tl.view) { const lid = tl.view.userData.lid; lid.rotation.x = damp(lid.rotation.x, tl.opened ? -1.9 : 0, 6, dt); }
    if (this.torches) for (const m of this.torches) { const f = 1 + Math.sin(t * 17 + m.position.x) * 0.12 + Math.sin(t * 29) * 0.06; m.userData.flame.scale.set(0.24 * f, 0.6 * f, 0.24 * f); if (m.userData.light) m.userData.light.intensity = 9 * f; }
    if (this.palms) for (const pm of this.palms) { pm.userData.sway.rotation.z = Math.sin(t * 1.2 + pm.position.x) * 0.06; pm.userData.sway.rotation.x = Math.cos(t * 0.9 + pm.position.z) * 0.05; }
    if (this.masts) for (const m of this.masts) { m.userData.sail.rotation.y = Math.sin(t * 3 + m.position.x) * 0.35; }
    for (const c of G.clouds) { c.position.x += dt * 0.6; if (c.position.x > 150) c.position.x = -50; }
    for (const g of G.gulls) { const u = g.userData; const a = t * u.s + u.ph; g.position.set(u.cx + Math.cos(a) * u.r, u.h + Math.sin(a * 2) * 1.5, u.cz + Math.sin(a) * u.r * 0.6); g.rotation.y = -a; g.rotation.z = Math.sin(a * 2) * 0.3; const f = Math.sin(t * 7 + u.ph) * 0.5; u.wl.rotation.z = f; u.wr.rotation.z = -f; }
    // Mort and his cage
    if (this.cage) {
      const bars = this.cage.userData.bars;
      bars.position.y = damp(bars.position.y, this.won ? -3.1 : 0, 3, dt);
      const R = this.mort.userData.rig;
      if (this.won) { this.mort.position.y = Math.abs(Math.sin(t * 6)) * 0.6; animCritter(this.mort, { move: 0, t, dance: true }, dt); }
      else { this.mort.rotation.y = Math.sin(t * 0.7) * 0.5; animCritter(this.mort, { move: 0, t, attack: Math.sin(t * 0.8) > 0.6 }, dt); }
      void R;
    }
    // Name tags (hub)
    if (this.mode === 'hub') {
      const v3 = new THREE.Vector3();
      for (const p of this.players.values()) if (p.tag) {
        v3.set(p.x, 3.1 * (p.crew.id === 'rex' ? 0.85 : 1), p.z).project(G.camera);
        p.tag.style.left = ((v3.x + 1) / 2) * innerWidth + 'px'; p.tag.style.top = ((1 - v3.y) / 2) * innerHeight + 'px';
        p.tag.style.display = v3.z < 1 && p.room === this.camRoom ? '' : 'none';
      }
    }
  },
  animEnemy(e, v, dt, t) {
    const st = e.st;
    if (st === 'launched' || st === 'defeated') { v.rotation.x += dt * 14; v.rotation.y += dt * 9; if (e.stars) e.stars.visible = false; return; }
    if (st === 'carried') { v.rotation.x = Math.PI + Math.sin(t * 20) * 0.2; }
    else if (st === 'thrown') { v.rotation.x += dt * 16; }
    else { v.rotation.x = damp(v.rotation.x, 0, 12, dt); v.rotation.y = e.kind === 'crab' ? damp(v.rotation.y, 0, 8, dt) : e.rot; }
    const stunned = st === 'stun' || st === 'dizzy' || st === 'carried';
    if (e.stars) { e.stars.visible = stunned; if (stunned) { e.stars.rotation.y = t * 5; e.stars.children.forEach((s, i) => { const a = (i / 3) * Math.PI * 2; s.position.set(Math.cos(a) * 0.5, Math.sin(t * 6 + i) * 0.05, Math.sin(a) * 0.5); s.rotation.y = t * 4; }); } }
    // Speed estimate from motion (works on host and on remote copies).
    const sp = Math.hypot(e.x - (e.px ?? e.x), e.z - (e.pz ?? e.z)) / Math.max(dt, 1e-3);
    e.px = e.x; e.pz = e.z; e.vis = damp(e.vis || 0, sp, 10, dt);
    if (e.kind === 'crab') {
      const R = v.userData.rig;
      R.legs.forEach((l, i) => { l.rotation.x = Math.sin(t * 22 + i) * 0.5 * clamp(e.vis / 3, 0, 1); });
      R.claws.forEach((c, i) => { c.rotation.x = Math.sin(t * 6 + i * 2) * 0.3 - (st === 'dance' ? 1 : 0); c.position.y = 0.5 + (st === 'dance' ? Math.abs(Math.sin(t * 9 + i)) * 0.4 : 0); });
      R.rig.position.y = st === 'dance' ? Math.abs(Math.sin(t * 9)) * 0.2 : 0;
      R.rig.rotation.z = st === 'dance' ? Math.sin(t * 9) * 0.3 : stunned ? Math.sin(t * 7) * 0.2 : 0;
      return;
    }
    const isBoss = e.kind === 'boss';
    const hurtFlash = isBoss && (e.inv > 0 || st === 'hurt') && Math.floor(t * 18) % 2 === 0;
    v.visible = !hurtFlash;
    animCritter(v, {
      move: clamp(e.vis / (isBoss ? 6 : 4), 0, 1.3), t: t + e.id, dance: st === 'dance', stun: stunned, attack: st === 'attack' && !isBoss || st === 'volley',
      windup: isBoss && st === 'attack', hurt: st === 'hurt', dash: isBoss && st === 'charge',
    }, dt);
  },
});

// ---- 07-net.js
// ============================================================================
// AI Hub co-op netcode. The host runs the shared world and sends ~13 snapshots/s;
// every copy moves its own player and sends it to the host; actions go reliable.
// ============================================================================
const PSTATES = ['normal', 'fall', 'ko', 'zip', 'dash'];
const Net = {
  on: false, world: null, info: null, sendT: 0, lastSnap: -Infinity,

  start(world, info) {
    this.on = true; this.world = world; this.info = info;
    HUB.on('message', (data, from) => this.onMessage(data, from));
  },
  stop() { this.on = false; },
  me() { return this.world && this.world.players.get(this.info.me); },

  /** A non-host asks the host to do something for its player. */
  action(p, verb, arg) {
    if (!this.on) return;
    HUB.send({ t: 'act', v: verb, a: arg ?? 0, x: r1(p.x), z: r1(p.z), f: Math.round(p.face * 100) / 100 }, { to: this.info.host });
  },
  /** A reliable event, to one player or to everyone else. */
  event(msg, to) {
    if (!this.on) return;
    if (to != null) { if (to !== this.info.me) HUB.send(msg, { to }); }
    else HUB.send(msg);
  },

  tick(dt) {
    if (!this.on || !this.world) return;
    if (HUB.time() < -1000) return;
    this.sendT -= dt;
    if (this.sendT > 0) return;
    this.sendT = 1 / 13;
    const w = this.world;
    if (this.info.isHost) HUB.send(this.snapshot(), { reliable: false });
    else {
      const p = this.me(); if (!p) return;
      const s = p.dashT > 0 ? 'dash' : p.st;
      HUB.send({ t: 'me', at: Math.round(HUB.time()), x: r1(p.x), z: r1(p.z), y: r1(p.y), f: Math.round(p.face * 100) / 100, s: Math.max(0, PSTATES.indexOf(s)), hp: p.hp, sp: r1(p.speed) }, { to: this.info.host, reliable: false });
    }
    void w;
  },

  snapshot() {
    const w = this.world;
    const rooms = [...new Set([...w.players.values()].filter((p) => !p.gone).map((p) => p.room))].filter((r) => r >= 0);
    const ents = [];
    for (const e of w.ents.values()) {
      if (!e.alive || !(rooms.includes(e.room) || e.st === 'carried' || e.st === 'thrown')) continue;
      ents.push([e.id, KINDS.indexOf(e.kind), Math.round(e.x * 10), Math.round(e.z * 10), Math.round(e.y * 10), Math.round((e.rot || 0) * 100), STATES.indexOf(e.st), e.carrier, e.kind === 'bomb' ? Math.round((e.fuse || 0) * 10) : 0]);
    }
    const players = [...w.players.values()].filter((p) => !p.gone).map((p) => [p.id, Math.round(p.x * 10), Math.round(p.z * 10), Math.round(p.y * 10), Math.round(p.face * 100), Math.max(0, PSTATES.indexOf(p.dashT > 0 ? 'dash' : p.st)), p.hp, p.score, r1(p.speed)]);
    const tiles = [...(w.dirtyTiles || [])].map((t) => [t.gx, t.gz, w.tileBits(t)]);
    const t = w.team;
    const items = ITEM_ORDER.reduce((m, it, i) => m | (t.items.includes(it) ? 1 << i : 0), 0);
    const order = t.items.map((it) => ITEM_ORDER.indexOf(it));
    const solved = w.rooms.reduce((m, r, i) => m | (r.solved ? 1 << i : 0) | (r.visited ? 1 << (i + 8) : 0), 0);
    const fx = w.fxOut.splice(0, 14);
    if (w.fxOut.length > 40) w.fxOut.length = 0;
    return { t: 's', at: Math.round(HUB.time()), r: rooms, e: ents, p: players, tl: tiles, tm: [t.score, t.keys, t.plankPlaced ?? -1, t.bell ?? -1, items, solved, w.boss ? w.boss.hp : 0, w.won ? 1 : 0], io: order, fx };
  },

  applySnapshot(s) {
    if (s.at < this.lastSnap) return;
    this.lastSnap = s.at;
    const w = this.world;
    const seen = new Set();
    for (const row of s.e) {
      const [id, k, x, z, y, rot, st, carrier, aux] = row;
      let e = w.ents.get(id);
      const kind = KINDS[k];
      if (!e) { e = w.spawn(kind, x / 10, z / 10, { id }); e.x = x / 10; e.z = z / 10; e.y = y / 10; }
      seen.add(id);
      e.tx = x / 10; e.tz = z / 10; e.ty = y / 10; e.trot = rot / 100; e.st = STATES[st] || 'idle'; e.carrier = carrier;
      if (kind === 'bomb') e.fuse = aux / 10;
      if (kind === 'block') { e.gx = toG(e.tx); e.gz = toG(e.tz); }
      e.room = w.roomOf(e.tx, e.tz);
      if (Math.abs(e.x - e.tx) > 10 || Math.abs(e.z - e.tz) > 10) { e.x = e.tx; e.z = e.tz; }
    }
    for (const e of [...w.ents.values()]) if (!seen.has(e.id) && (s.r.includes(e.room) || e.dynamic) && (e.dynamic || s.r.includes(e.room))) {
      if (s.r.includes(e.room)) w.removeEnt(e);
    }
    for (const [id, x, z, y, f, st, hp, score, sp] of s.p) {
      const p = w.players.get(id); if (!p) continue;
      p.score = score;
      if (p.local) continue;
      p.tx = x / 10; p.tz = z / 10; p.y = y / 10; p.face = f / 100; const ps = PSTATES[st] || 'normal'; p.st = ps === 'dash' ? 'normal' : ps; p.dashT = ps === 'dash' ? 0.05 : 0; p.hp = hp; p.speed = sp;
    }
    for (const [gx, gz, bits] of s.tl) { const t = w.tile(gx, gz); if (t) w.applyTileBits(t, bits); }
    const [score, keys, plank, bell, , solved, bossHp, won] = s.tm;
    const t = w.team;
    t.score = score; t.keys = keys; t.plankPlaced = plank < 0 ? null : plank; t.bell = bell < 0 ? null : bell;
    const items = (s.io || []).map((i) => ITEM_ORDER[i]).filter(Boolean);
    if (items.length !== t.items.length) { t.items = items; const me = this.me(); if (me) me.item = Math.max(0, items.length - 1); }
    w.rooms.forEach((r, i) => { r.solved = !!(solved & (1 << i)); r.visited = r.visited || !!(solved & (1 << (i + 8))); });
    if (w.boss) w.boss.hp = bossHp;
    if (won && !w.won) { w.won = true; w.emit('win'); }
    for (const [name, x, y, z, extra] of s.fx || []) playFx(w, name, x, y, z, extra);
  },

  onMessage(d, from) {
    const w = this.world; if (!w || !d) return;
    if (this.info.isHost) {
      const p = w.players.get(from);
      if (!p) return;
      if (d.t === 'me' && d.at > p.at) {
        p.at = d.at; p.tx = +d.x || 0; p.tz = +d.z || 0; p.y = +d.y || 0; p.face = +d.f || 0;
        const ps = PSTATES[d.s] || 'normal'; p.st = ps === 'dash' ? 'normal' : ps; p.dashT = ps === 'dash' ? 0.05 : 0; p.hp = d.hp; p.speed = +d.sp || 0;
      } else if (d.t === 'act') {
        p.x = p.tx = +d.x || p.x; p.z = p.tz = +d.z || p.z; p.face = +d.f || 0; p.room = w.roomOf(p.x, p.z);
        w.act(from, d.v, d.a);
      } else if (d.t === 'ko') w.onKo(from);
      return;
    }
    if (from !== this.info.host) return;
    if (d.t === 's') this.applySnapshot(d);
    else if (d.t === 'pe') { const me = this.me(); if (me && d.id === this.info.me) w.applyPlayerEvent(me, d.ev); }
    else if (d.t === 'item') { if (!w.team.items.includes(d.item)) w.team.items.push(d.item); const me = this.me(); if (me) me.item = w.team.items.length - 1; w.emit('item', { item: d.item, id: d.id }); }
    else if (d.t === 'scene') w.emit('scene', { name: d.name, room: d.room });
    else if (d.t === 'solved') { const r = w.rooms[d.room]; if (r) r.solved = true; w.emit('solved', { room: d.room }); }
    else if (d.t === 'cap') w.emit('caption', { id: d.id, what: d.what });
    else if (d.t === 'win') { if (!w.won) { w.won = true; w.emit('win'); } }
    else if (d.t === 'over') w.emit('hubOver', d);
  },
};
