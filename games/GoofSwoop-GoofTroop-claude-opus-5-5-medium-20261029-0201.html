const UI = {
  stack: [], focus: 0, screen: null, panel: null, onBack: null,
  hudCache: {},
  init() { this.panel = $('panel'); },

  // ------------------------------------------------------------------ menus
  /** screen: { id, title?, sub?, logo?, items:[{label, value?, adjust?, action?, disabled?}], html?, back?, clear?, hint?, onTick? } */
  show(screen, keepStack) {
    if (!keepStack) this.stack = [];
    this.screen = screen; this.focus = screen.focus ?? Math.max(0, screen.items ? screen.items.findIndex((i) => !i.disabled) : 0);
    this.render();
    this.panel.classList.remove('hidden');
    this.panel.classList.toggle('clear', !!screen.clear);
    this.panel.classList.toggle('compact', (screen.items || []).length > 7);
  },
  push(screen) { if (this.screen) this.stack.push({ screen: this.screen, focus: this.focus }); this.show(screen, true); },
  pop() {
    const prev = this.stack.pop();
    if (prev) { this.screen = prev.screen; this.focus = prev.focus; this.render(); this.panel.classList.toggle('clear', !!this.screen.clear); this.panel.classList.toggle('compact', (this.screen.items || []).length > 7); return true; }
    return false;
  },
  hide() { this.closedAt = performance.now(); this.screen = null; this.stack = []; this.panel.classList.add('hidden'); this.panel.innerHTML = ''; },
  get open() { return !!this.screen; },
  render() {
    const s = this.screen; if (!s) return;
    const items = s.items || [];
    let h = '';
    if (s.logo) h += `<div class="logo">GOOF SWOOP<small>A Barnacle Isle Misadventure</small></div>`;
    if (s.title) h += `<h1 class="ptitle">${s.title}</h1>`;
    if (s.sub) h += `<p class="psub">${s.sub}</p>`;
    if (s.html) h += typeof s.html === 'function' ? s.html() : s.html;
    if (items.length) {
      h += '<div class="menu">';
      items.forEach((it, i) => {
        const val = it.value ? it.value() : '';
        const v = it.adjust ? `<span class="val"><span class="arr">◀</span>${val}<span class="arr">▶</span></span>` : val ? `<span class="val">${val}</span>` : '';
        h += `<div class="item${i === this.focus ? ' focus' : ''}${it.disabled ? ' disabled' : ''}" data-i="${i}"><span>${it.label}</span>${v}</div>`;
      });
      h += '</div>';
    }
    const hint = s.hint ?? (items.length ? `<span>${glyph('confirm')} Select</span>${s.noBack ? '' : `<span>${glyph('back')} Back</span>`}` : '');
    if (hint) h += `<div class="hint">${hint}</div>`;
    this.panel.innerHTML = h;
    this.panel.querySelectorAll('.item').forEach((el) => {
      const i = +el.dataset.i;
      el.addEventListener('mouseenter', () => { if (this.focus !== i) { this.focus = i; audio.sfx('tick'); this.render(); } });
      el.addEventListener('click', (ev) => {
        const it = items[i]; if (!it || it.disabled) return;
        this.focus = i;
        if (it.adjust) { const r = el.getBoundingClientRect(); it.adjust(ev.clientX > r.left + r.width / 2 ? 1 : -1); audio.sfx('tick'); this.render(); }
        else if (it.action) { audio.sfx('confirm'); it.action(); }
      });
    });
    this.lastGlyph = Input.last;
  },
  /** Drive the open menu from Input.nav. Returns true if it consumed input. */
  update(dt) {
    const s = this.screen; if (!s) return false;
    if (this.lastGlyph !== Input.last) this.render();
    if (s.onTick) s.onTick(dt);
    if (!this.screen) return true;
    const n = Input.nav, items = this.screen.items || [];
    const move = (d) => {
      if (!items.length) return;
      let i = this.focus;
      for (let k = 0; k < items.length; k++) { i = (i + d + items.length) % items.length; if (!items[i].disabled) break; }
      if (i !== this.focus) { this.focus = i; audio.sfx('tick'); this.render(); }
    };
    if (n.up) move(-1);
    if (n.down) move(1);
    const it = items[this.focus];
    if ((n.left || n.right) && this.screen.onLR) this.screen.onLR(n.right ? 1 : -1);
    else if ((n.left || n.right) && it && it.adjust) { it.adjust(n.right ? 1 : -1); audio.sfx('tick'); this.render(); }
    if (n.confirm && it && !it.disabled) { if (it.action) { audio.sfx('confirm'); it.action(); } else if (it.adjust) { it.adjust(1); audio.sfx('tick'); this.render(); } }
    else if (n.confirm && this.screen && this.screen.onConfirm) this.screen.onConfirm();
    if ((n.back || (n.pause && this.screen && this.screen.pauseCloses)) && this.screen && !this.screen.noBack) {
      audio.sfx('back');
      if (this.screen.back) this.screen.back(); else if (!this.pop()) this.hide();
    }
    return true;
  },

  // ------------------------------------------------------------------ dialogue (blocking)
  dlg: null,
  playScene(lines, done) {
    if (!lines || !lines.length) { if (done) done(); return; }
    this.dlg = { lines, i: -1, done, shown: 0, text: '' };
    $('dialog').classList.remove('hidden');
    this.nextLine();
  },
  nextLine() {
    const d = this.dlg; d.i++;
    if (d.i >= d.lines.length) return this.endScene();
    const [who, text] = d.lines[d.i];
    const sp = SPEAKERS[who] || SPEAKERS.NARRATOR;
    d.sp = sp; d.text = text; d.shown = 0;
    $('dlg-name').textContent = sp.name; $('dlg-name').style.color = sp.color;
    const por = $('dlg-portrait'); por.textContent = sp.glyph; por.style.background = sp.color;
    $('dlg-text').textContent = '';
    $('dlg-next').innerHTML = `${glyph('confirm')}`;
  },
  endScene() {
    const d = this.dlg; this.dlg = null; this.closedAt = performance.now();
    $('dialog').classList.add('hidden');
    if (d && d.done) d.done();
  },
  get talking() { return !!this.dlg; },
  updateDialog(dt) {
    const d = this.dlg; if (!d) return;
    const rate = [22, 40, 80][settings.textSpeed] || 40;
    if (d.shown < d.text.length) {
      const before = Math.floor(d.shown);
      d.shown = Math.min(d.text.length, d.shown + rate * dt);
      const now = Math.floor(d.shown);
      for (let i = before; i < now; i++) audio.voice(d.sp, d.text[i]);
      $('dlg-text').textContent = d.text.slice(0, now);
    }
    const n = Input.nav;
    const adv = n.confirm || Input.mouse.actionEdge || Input.read('any').action;
    if (n.pause) { this.endScene(); return; }
    if (adv) { if (d.shown < d.text.length) { d.shown = d.text.length; $('dlg-text').textContent = d.text; } else { audio.sfx('tick'); this.nextLine(); } }
  },

  // ------------------------------------------------------------------ captions (never block)
  caps: [], capT: 0,
  caption(lines) { for (const l of lines) this.caps.push(l); },
  updateCaptions(dt) {
    const el = $('caption');
    if (this.capT > 0) { this.capT -= dt; const c = this.capCur; if (c) { const shown = Math.floor(c.shown += dt * 45); if (shown <= c.text.length) { if (shown > c.prev) { for (let i = c.prev; i < shown; i++) audio.voice(c.sp, c.text[i]); c.prev = shown; } el.lastChild.textContent = c.text.slice(0, shown); } } if (this.capT <= 0) el.classList.add('hidden'); return; }
    const next = this.caps.shift(); if (!next) return;
    const [who, text] = next, sp = SPEAKERS[who] || SPEAKERS.NARRATOR;
    el.innerHTML = ''; const b = document.createElement('b'); b.textContent = sp.name; b.style.color = sp.color; el.appendChild(b); el.appendChild(document.createTextNode(''));
    el.classList.remove('hidden');
    this.capCur = { text, sp, shown: 0, prev: 0 };
    this.capT = 1.6 + text.length * 0.045;
  },
  clearCaptions() { this.caps = []; this.capT = 0; $('caption').classList.add('hidden'); },

  // ------------------------------------------------------------------ toasts
  toastT: 0,
  toast(big, small, secs = 3.2) {
    const el = $('toast');
    el.innerHTML = ''; const b = document.createElement('big'); b.textContent = big; el.appendChild(b);
    if (small) el.appendChild(document.createTextNode(small));
    el.classList.remove('hidden'); el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
    this.toastT = secs;
  },
  updateToast(dt) { if (this.toastT > 0) { this.toastT -= dt; if (this.toastT <= 0) $('toast').classList.add('hidden'); } },
  roomBanner(name) { const el = $('hud-room'); el.textContent = name; el.classList.add('show'); clearTimeout(this.roomTimer); this.roomTimer = setTimeout(() => el.classList.remove('show'), 2600); },

  // ------------------------------------------------------------------ HUD
  showHud(on) { $('hud').classList.toggle('hidden', !on); },
  updateHud(world, ctx) {
    const locals = [...world.players.values()].filter((p) => (ctx.hubAll ? true : p.local) && !p.gone);
    // Player cards (rebuilt only when their content changes)
    let html = '';
    for (const p of locals) {
      const items = world.team.items;
      const it = items.length ? items[p.item % items.length] : null;
      const info = it ? ITEMS[it] : null;
      const dim = it === 'plank' && world.team.plankPlaced != null || it === 'bell' && world.team.bell != null;
      let hearts = '';
      for (let i = 0; i < p.maxHp; i++) hearts += `<i class="heart${i < p.hp ? '' : ' empty'}"></i>`;
      const next = items.length > 1 ? `<span class="next">${glyph('swap', p.local ? p.device : undefined)} swap</span>` : '';
      html += `<div class="pcard" style="border-color:${ctx.hubAll || world.mode === 'local' ? p.color : 'var(--ink)'}"><div><div class="who"></div><div class="hearts">${hearts}</div></div>`
        + `<div class="slot" style="${dim ? 'opacity:.45' : ''}">${info ? info.icon : '·'}${next}${info && p.local ? `<span class="glyph">${glyph('item', p.device)}</span>` : ''}</div></div>`;
    }
    const key = html + locals.map((p) => p.name).join();
    if (this.hudCache.cards !== key) {
      this.hudCache.cards = key;
      $('hud-players').innerHTML = html;
      $('hud-players').querySelectorAll('.who').forEach((el, i) => { el.textContent = locals[i].name; });
    }
    const set = (id, v) => { if (this.hudCache[id] !== v) { this.hudCache[id] = v; $(id).textContent = v; } };
    set('hud-score', String(world.team.score));
    set('hud-keys', String(world.team.keys));
    set('hud-lives', String(world.team.lives));
    $('hud-lives-pill').classList.toggle('hidden', world.mode === 'hub');
    const secs = ctx.clock;
    set('hud-clock', `${Math.floor(secs / 60)}:${String(Math.floor(secs % 60)).padStart(2, '0')}`);
    // Boss bar
    const b = world.boss;
    const bossOn = !!(b && b.alive && b.st !== 'intro' && ctx.camRoom === b.room);
    $('hud-boss').classList.toggle('hidden', !bossOn);
    if (bossOn) $('hud-boss-fill').style.width = `${(Math.max(0, b.hp) / (b.maxHp || 6)) * 100}%`;
    // Context prompts
    let ph = '';
    if (!ctx.hidePrompts) for (const p of world.players.values()) {
      if (!p.local || p.bot || p.gone) continue;
      const tag = world.mode === 'local' ? `<b style="color:${p.color}">${escapeText(p.name)}</b>` : '';
      const c = world.contextFor(p);
      const labels = { throw: 'Throw', lift: 'Lift', kick: 'Kick', open: 'Open', read: 'Read', unlock: 'Unlock', locked: 'Locked' };
      if (c) ph += `<div class="prompt">${glyph('action', p.device)}${tag} ${labels[c.verb]}</div>`;
      const ic = world.itemContext(p);
      if (ic && settings.hints) ph += `<div class="prompt" style="${ic.dim ? 'opacity:.55' : ''}">${glyph('item', p.device)}${tag} ${ic.label}</div>`;
    }
    if (this.hudCache.prompts !== ph) { this.hudCache.prompts = ph; $('hud-prompts').innerHTML = ph; }
  },
};

// ---------------------------------------------------------------------------- screens

const Game = {

// ---------------------------------------------------------------------------- starting worlds
async function startWorld(mode, players, startRoom = 0, saved) {
  Game.backdropToken = (Game.backdropToken || 0) + 1;
  if (Game.world) { Game.world.dispose(); Game.world = null; }
  const w = new World({ authority: mode !== 'hub' || HUB.isHost, mode, startRoom, players });
  await w.build();
  if (saved) prepareContinue(w, saved);
  Game.world = w; Game.acc = 0; Game.playTime = 0; Game.paused = false; Game.blocking = false;
  Game.camRoom = -1;
  UI.clearCaptions();
  return w;
}
function prepareContinue(w, saved) {
  for (const r of w.rooms) {
    if (r.index >= saved.room) continue;
    r.visited = true; r.solved = true;
    for (const g of r.gates) w.setTile(g, 'open', true);
    for (const t of w.tiles.values()) if (t.room === r.index && t.type === 'chest') w.setTile(t, 'opened', true);
    for (const e of [...w.ents.values()]) if (e.room === r.index && ENEMY_KINDS.has(e.kind)) w.removeEnt(e);
  }
  w.team.items = (saved.items || []).filter((i) => ITEMS[i]);
  w.team.score = saved.score || 0;
  for (const p of w.players.values()) { const sp = w.entryPoint(saved.room, p.id); p.x = p.tx = sp.x; p.z = p.tz = sp.z; p.checkpoint = { ...sp }; p.safe = { ...sp }; p.room = saved.room; w.syncCol(p); }
}
function crewPlayers(devices) {
  return devices.map((device, i) => ({ id: i, crew: i, name: CREW[i].name, color: SEAT_COLORS[i], local: true, device }));
}

function regroup() {
  const w = Game.world; if (!w) return;
  const locals = [...w.players.values()].filter((p) => p.local && !p.gone);
  for (const p of locals) {
    const other = [...w.players.values()].find((q) => q !== p && !q.gone);
    if (!other) continue;
    w.applyPlayerEvent(p, { e: 'warp', x: other.x + 1.2, z: other.z });
    p.room = w.roomOf(p.x, p.z); p.checkpoint = { x: p.x, z: p.z };

function restartRoom() {
  const w = Game.world; const room = w.rooms[Game.camRoom]; if (!room) return;
  for (const e of w.ents.values()) if (e.kind === 'block' && e.room === room.index && e.st !== 'sunk') { e.gx = e.home.gx; e.gz = e.home.gz; e.x = tileX(e.gx); e.z = tileX(e.gz); e.st = 'idle'; e.col?.setTranslation({ x: e.x, y: 1, z: e.z }); }
  for (const p of w.players.values()) { w.dropCarried(p, true); w.applyPlayerEvent(p, { e: 'warp', x: p.checkpoint.x, z: p.checkpoint.z }); p.hp = p.maxHp; }
  audio.sfx('warp');
}

// ---------------------------------------------------------------------------- events from the world
function handleEvents() {
  const w = Game.world; if (!w) return;
  const nonBlocking = w.mode === 'hub' || w.mode === 'attract';
  while (w.events.length) {
    const ev = w.events.shift();
    switch (ev.type) {
      case 'scene': {
        const lines = SCRIPT[ev.name]; if (!lines) break;
        if (nonBlocking) UI.caption(lines.slice(0, w.mode === 'attract' ? 3 : lines.length));
        else { Game.blocking = true; UI.playScene(lines, () => { Game.blocking = false; if (ev.name === 'intro' && settings.hints) UI.toast('Bonk the pirates!', 'Lift barrels with Action, throw them at baddies. Clear the beach to open the gate.', 5); }); }
        if (ev.room != null && w.mode !== 'hub' && w.mode !== 'attract' && ev.room > 0) Store.set('save', { room: ev.room, items: w.team.items.slice(), score: w.team.score });
        break;
      }
      case 'read': {
        const lines = SCRIPT[ev.script]; if (!lines) break;
        if (nonBlocking) UI.caption(lines); else { Game.blocking = true; UI.playScene(lines, () => { Game.blocking = false; }); }
        break;
      }
      case 'item': {
        const it = ITEMS[ev.item];
        UI.toast(`Got the ${it.name}!`, it.got, 4.5);
        const lines = SCRIPT[ITEM_HINT[ev.item]];
        if (lines) { if (nonBlocking) UI.caption(lines); else { Game.blocking = true; UI.playScene([['NARRATOR', `${it.icon} You got the ${it.name.toUpperCase()}! ${it.got}`], ...lines], () => { Game.blocking = false; }); } }
        break;
      }
      case 'caption': if (QUIPS[ev.what]) UI.caption(QUIPS[ev.what]); break;
      case 'solved': UI.toast('Gate open!', null, 2); break;
      case 'gameover': setTimeout(() => showGameOver(), 1500); break;
      case 'win': onWin(); break;
      case 'playerRoom': break;
    }
  }
}
function showGameOver() {
  const w = Game.world; if (!w || Game.state !== 'play') return;
  Game.state = 'gameover'; audio.play('gameover'); UI.showHud(false);
  UI.show({ id: 'gameover', title: 'Uh-oh! Game Over', sub: 'Duffy tripped over his own feet one too many times.', noBack: true, items: [
    { label: 'Continue from this room', action: () => {

      for (const p of w.players.values()) { p.hp = p.maxHp; p.st = 'normal'; w.applyPlayerEvent(p, { e: 'warp', x: p.checkpoint.x, z: p.checkpoint.z }); p.invuln = 2; }

// ---------------------------------------------------------------------------- attract-mode bot
/** The demo crew cheat freely (noclip, god mode, auto-solve) so the demo shows every room, item and the boss. */
function botThink(w, p, dt) {
  const B = p.bot; B.t += dt; B.roomT += dt;
  const inp = { x: 0, z: 0 };
  const room = w.rooms[p.room]; if (!room) return inp;
  const lead = w.players.get(0);
  const go = (x, z, near = 0.5) => { const dx = x - p.x, dz = z - p.z, d = Math.hypot(dx, dz); if (d > near) { inp.x = dx / d; inp.z = dz / d; return false; } return true; };
  const faceTo = (x, z) => { p.face = Math.atan2(x - p.x, z - p.z); };
  B.rooms ||= {};
  if (B.roomId !== room.index) { B.roomId = room.index; B.rooms[room.index] ||= { t: 0, did: {} }; B.did = B.rooms[room.index].did; }
  B.rooms[room.index].t += dt; B.roomT = B.rooms[room.index].t;
  if (p.id === 1) {
    // The follower tags along and throws whatever it finds.
    const c = w.carried(p.id);
    const target = [...w.ents.values()].find((e) => e.alive && ENEMY_KINDS.has(e.kind) && e.kind !== 'brute' && e.room === p.room && e.st !== 'launched' && e.st !== 'intro' && e.st !== 'defeated');
    if (c && target) { faceTo(target.x, target.z); if (Math.hypot(target.x - p.x, target.z - p.z) < 9) inp.action = true; else go(target.x, target.z, 6); return inp; }
    if (!c && target && B.t > 2) {
      const lift = nearestLiftable(w, p);
      if (lift && Math.hypot(lift.x - p.x, lift.z - p.z) < 10) { if (go(lift.x - Math.sin(p.face) * 1.2, lift.z - Math.cos(p.face) * 1.2, 0.4)) { faceTo(lift.x, lift.z); inp.action = true; } return inp; }
    }
    if (lead && lead.room !== p.room) { p.x = lead.x - 1.5; p.z = lead.z; return inp; }
    if (lead) go(lead.x - 2, lead.z + 1, 1.5);
    return inp;
  }
  // The leader: one showcase beat per room, then the exit.
  const enemies = [...w.ents.values()].filter((e) => e.alive && ENEMY_KINDS.has(e.kind) && e.kind !== 'brute' && e.room === p.room && e.st !== 'launched' && e.st !== 'defeated');
  const carrying = w.carried(p.id);
  const timeout = B.roomT > (room.goal === 'boss' ? 60 : 22);
  if (timeout && !B.did.cheat) {
    // The demo cheats past anything that stalls it: bonk the stragglers and move on.
    B.did.cheat = true;
    if (carrying) w.dropCarried(p, true);
    for (const e of [...w.ents.values()]) if (e.alive && e.room === room.index && (e.kind === 'grunt' || e.kind === 'crab' || e.kind === 'bomber') && e.st !== 'launched') w.launchEnemy(e, Math.random() - 0.5, -1, 0);
  }
  if (carrying && timeout && room.goal !== 'boss') { inp.dash = true; return inp; }
  if (carrying) {
    const target = enemies.find((e) => e.kind === 'boss') || enemies[0];
    if (target) { faceTo(target.x, target.z); if (Math.hypot(target.x - p.x, target.z - p.z) < 8) inp.action = true; else go(target.x, target.z, 7); return inp; }
    inp.dash = true; return inp;
  }
  const chest = [...w.tiles.values()].find((t) => t.room === p.room && t.type === 'chest' && !t.opened);
  if (chest && !timeout) { if (go(chest.x, chest.z + 1.8, 0.4)) { p.face = Math.PI; inp.action = true; } return inp; }
  const demo = { chasm: 'hook', pier: 'plank', dunes: 'shovel', hold: 'bell' }[room.id];
  if (demo && !B.did.item && w.team.items.includes(demo)) {
    p.item = w.team.items.indexOf(demo);
    let tx = p.x, tz = p.z, face = p.face;
    if (demo === 'hook') { tx = tileX(room.gx0 + 5); tz = tileX(room.gz0 + 4); face = Math.PI; }
    if (demo === 'plank') { tx = tileX(room.gx0 + 7); tz = tileX(room.gz0 + 8); face = Math.PI; }
    if (demo === 'shovel') { const x = room.digTiles.find((d) => !d.dug); if (x) { tx = x.x; tz = x.z; } }
    if (demo === 'bell') { tx = tileX(room.gx0 + 6); tz = tileX(room.gz0 + 5); }
    if (go(tx, tz, 0.4)) { p.face = face; inp.item = true; B.did.item = true; }
    return inp;
  }
  if (enemies.length && !timeout) {
    const boss = enemies.find((e) => e.kind === 'boss');
    if (boss && boss.st === 'intro') { go(boss.x - 8, boss.z, 1); return inp; }
    const lift = nearestLiftable(w, p);
    if (lift) { if (go(lift.x - Math.sin(B.approach || 0) * 1.3, lift.z - Math.cos(B.approach || 0) * 1.3, 0.35)) { faceTo(lift.x, lift.z); inp.action = true; } else B.approach = Math.atan2(lift.x - p.x, lift.z - p.z); return inp; }
  }
  if (room.switches.length && !room.solved && !B.did.kick) {
    const blk = [...w.ents.values()].find((e) => e.kind === 'block' && e.room === p.room && e.st === 'idle');
    if (blk) { if (go(blk.x + 1.5, blk.z, 0.3)) { p.face = -Math.PI / 2; inp.action = true; B.did.kick = true; } return inp; }
  }
  if (B.roomT > 4 || timeout) {
    if (!room.solved && room.goal !== 'boss') w.solveRoom(room);
    for (const g of room.gates) if (g.type === 'lock') w.setTile(g, 'open', true);
    if (room.goal === 'boss' && w.boss && w.boss.alive && timeout) w.damageBoss(w.boss, 0);
    const ex = w.exitPoint(room.index);
    if (ex) go(ex.x, ex.z, 0.3);
  }
  return inp;
}
function nearestLiftable(w, p) {
  let best = null, bd = Infinity;
  for (const e of w.ents.values()) {
    if (!e.alive || e.room !== p.room) continue;
    const ok = (LIFTABLE.has(e.kind) && (e.st === 'idle' || e.st === 'lit') && e.y < 0.3) || ((e.st === 'stun' || e.st === 'dance') && e.kind !== 'boss' && e.kind !== 'brute' && ENEMY_KINDS.has(e.kind));
    if (!ok) continue;
    const d = dist2(p.x, p.z, e.x, e.z); if (d < bd) { bd = d; best = e; }
  }
  return best;
}

// ---------------------------------------------------------------------------- hub sessions
async function startHub() {
  const info = await HUB.connect({ mode: 'co-op', seats: [1, 4] });
  if (!info) return false;
  Game.hub = info;
  const players = info.players.map((pl) => ({ id: pl.id, crew: pl.id % 4, name: pl.name, color: pl.color || SEAT_COLORS[pl.id % 4], local: pl.id === info.me && !info.server, device: 'any', slot: pl.id }));
  await startWorld('hub', players);
  Net.start(Game.world, info);
  HUB.on('start', () => { audio.unlock(); Game.state = 'hub-count'; });
  HUB.on('leave', ({ id }) => { if (Game.world) Game.world.removePlayer(id); });
  HUB.on('time-up', () => { if (HUB.isHost) hubFinish(false); });
  HUB.on('end', ({ reason }) => {
    Game.hubOver = true; Game.state = 'hub-over'; Net.stop(); audio.stopMusic(1.2);
    if (UI.open) UI.hide();
    UI.showHud(false);
    $('banner').classList.remove('hidden'); $('banner').style.animation = 'none';
    $('banner').textContent = reason === 'finished' ? (Game.world?.won ? 'Captain Squall sunk! Round over.' : 'Round over!') : reason === 'sat-out' ? 'You sat this one out.' : 'Round cancelled.';
  });
  UI.showHud(!info.server);
  if (info.splash || info.server) { Game.state = 'hub-wait'; HUB.ready(); }
  else {
    Game.state = 'hub-ready';
    UI.show({ id: 'ready', title: 'Goof Swoop', noBack: true, items: [],
      html: () => `<div class="roster">${info.players.map((p) => `<span style="background:${p.color}">${escapeText(p.name)}</span>`).join('')}</div>`,
      sub: 'Press any key, click or tap when you are ready', hint: '' });
    const ready = () => { if (Game.state !== 'hub-ready') return; audio.unlock(); HUB.ready(); Game.state = 'hub-wait'; UI.hide(); removeEventListener('keydown', ready); removeEventListener('pointerdown', ready); };
    addEventListener('keydown', ready); addEventListener('pointerdown', ready);
    Game.readyPoll = ready;
  }
  return true;
}
function hubFinish(won) {
  if (Game.finished || !Game.world) return;
  Game.finished = true;
  const w = Game.world;
  const live = [...w.players.values()].filter((p) => !p.gone).sort((a, b) => b.score - a.score);
  const standings = [];
  for (const p of live) { const last = standings[standings.length - 1]; if (last && last.s === p.score) last.ids.push(p.id); else standings.push({ s: p.score, ids: [p.id] }); }
  const scores = {}, stats = {}, awards = [];
  for (const p of w.players.values()) { scores[p.id] = p.score; stats[p.id] = { bonks: p.stats.bonks, gems: p.stats.gems, 'knock-outs': p.stats.kos }; }
  const topB = live.slice().sort((a, b) => b.stats.bonks - a.stats.bonks)[0];
  if (topB && topB.stats.bonks > 0) awards.push({ id: topB.id, title: 'Bonk Champion', detail: `${topB.stats.bonks} pirates bonked` });
  const topG = live.slice().sort((a, b) => b.stats.gems - a.stats.gems)[0];
  if (topG && topG.stats.gems > 0) awards.push({ id: topG.id, title: 'Treasure Nose', detail: `${topG.stats.gems} gems` });
  if (won) for (const p of live) awards.push({ id: p.id, title: 'Squall Sinker', detail: 'Beat Captain Squall' });
  HUB.finish({ standings: standings.map((g) => g.ids), scores, won: !!won, stats, awards: awards.slice(0, 8) });
}

// ---------------------------------------------------------------------------- camera
function updateCamera(dt) {
  const w = Game.world;
  let focusPlayers;
  if (!w || w.mode === 'backdrop') {
    // Title: slow orbit over the sea.
    const t = performance.now() / 1000;
    Game.camPos.set(15 + Math.sin(t * 0.07) * 10, 15, 34 + Math.cos(t * 0.07) * 3); Game.camLook.set(17, 0, 9);
    G.camera.position.copy(Game.camPos); G.camera.lookAt(Game.camLook);
    camFocus.copy(Game.camLook);
    return;
  }
  const players = [...w.players.values()].filter((p) => !p.gone);
  focusPlayers = w.mode === 'hub' ? players.filter((p) => p.local) : w.mode === 'attract' ? players.filter((p) => p.id === 0) : players;
  if (!focusPlayers.length) focusPlayers = players;
  const lead = focusPlayers.find((p) => p.room >= 0 && p.room !== Game.camRoom && p.st === 'normal') || null;
  if (Game.camRoom < 0 && focusPlayers[0]) Game.camRoom = Math.max(0, focusPlayers[0].room);
  if (lead && lead.room >= 0) {
    const prev = Game.camRoom;
    Game.camRoom = lead.room;
    const room = w.rooms[Game.camRoom];
    if (prev !== Game.camRoom) {
      UI.roomBanner(room.name);
      audio.play(room.goal === 'boss' && (!w.boss || !w.boss.alive) && w.won ? 'victory' : room.music);
      // Local co-op: the partner is whisked along through the door.
      if (w.mode === 'local' || w.mode === 'attract') for (const p of players) if (p !== lead && p.room !== Game.camRoom) {
        w.dropCarried(p, true);
        w.applyPlayerEvent(p, { e: 'warp', x: lead.x - Math.sin(lead.face) * 1.4 + 0.6, z: lead.z - Math.cos(lead.face) * 1.4 });
        p.room = Game.camRoom; p.checkpoint = { ...lead.checkpoint }; w.fx('poof', p.x, 1, p.z);
      }
    }
  }
  w.camRoom = Game.camRoom;
  const c = w.roomCenter(Math.max(0, Game.camRoom));
  let ax = 0, az = 0, n = 0;
  for (const p of focusPlayers) if (p.room === Game.camRoom) { ax += p.x; az += p.z; n++; }
  if (n) { ax /= n; az /= n; } else { ax = c.x; az = c.z; }
  const close = settings.camera === 1;
  const follow = close ? 0.75 : 0.14;
  const tx = c.x + (ax - c.x) * follow, tz = c.z + (az - c.z) * follow + 0.5;
  const hf = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(G.camera.fov / 2)) * G.camera.aspect);
  let dist = Math.max(29, 16.5 / Math.tan(hf / 2) + 6);
  if (close) dist *= 0.68;
  const ang = THREE.MathUtils.degToRad(57);
  const k = 1 - Math.exp(-5 * dt);
  Game.camLook.lerp(new THREE.Vector3(tx, 0, tz), k);
  Game.camPos.lerp(new THREE.Vector3(tx, Math.sin(ang) * dist, tz + Math.cos(ang) * dist), k);
  G.camera.position.copy(Game.camPos);
  if (settings.shake && G.shake > 0) G.camera.position.add(new THREE.Vector3((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake));
  G.shake = Math.max(0, G.shake - dt * 2.2);
  G.camera.lookAt(Game.camLook);
  camFocus.copy(Game.camLook);
  G.sun.position.set(Game.camLook.x + 14, 34, Game.camLook.z + 18); G.sun.target.position.copy(Game.camLook);
}

// ---------------------------------------------------------------------------- loop
function gatherInputs(w, allowInput) {
  for (const p of w.players.values()) {
    if (!p.local) continue;
    let inp;
    if (p.bot) inp = botThink(w, p, 1 / 60);
    else inp = allowInput ? Input.read(p.device) : { x: 0, z: 0 };
    const q = p.pend || { x: 0, z: 0 };
    p.pend = { x: inp.x, z: inp.z, actionHeld: inp.actionHeld, itemHeld: inp.itemHeld, action: q.action || inp.action, item: q.item || inp.item, swap: q.swap || inp.swap, swapBack: q.swapBack || inp.swapBack, dash: q.dash || inp.dash };
  }
}
function simulate(dt) {
  const w = Game.world; if (!w) return;
  const hub = w.mode === 'hub';
  const running = hub ? (Game.state === 'play' || Game.state === 'hub-count' && HUB.time() >= 0) : (Game.state === 'play' || Game.state === 'attract') && !Game.paused && !Game.blocking;
  if (hub && Game.state === 'hub-count' && HUB.time() >= 0) { Game.state = 'play'; $('countdown').classList.add('hidden'); audio.play(w.rooms[0].music); }
  if (!running) { for (const p of w.players.values()) if (p.local) p.pend = { x: 0, z: 0 }; return; }
  gatherInputs(w, !UI.open && !UI.talking && performance.now() - (UI.closedAt || 0) > 160);
  Game.acc += dt;
  let steps = 0;
  while (Game.acc >= STEP && steps < 5) { w.step(STEP); Game.acc -= STEP; steps++; }
  if (steps === 5) Game.acc = 0;
  Game.playTime += dt;
}
function frame(now) {
  const dt = Math.min((now - Game.lastFrame) / 1000, 0.1);
  Game.lastFrame = now;
  Game.lastRaf = performance.now();
  try { tick(dt, true); } catch (err) { console.error(err); Input.endFrame(); }
  requestAnimationFrame(frame);
}
function tick(dt, draw) {
  Input.poll(dt);
  const w = Game.world;
  // Global pause / menu toggle.
  if (Input.nav.pause && !UI.talking && w && (Game.state === 'play' || Game.state === 'hub-count' || Game.state === 'hub-wait') && !UI.open) openPause();
  else if (UI.talking) UI.updateDialog(dt);
  else if (UI.open) UI.update(dt);
  // Title idle → attract; any input ends attract.
  if (Game.state === 'title') {
    const now = performance.now();
    if (Input.anyEdge || Input.nav.up || Input.nav.down || Input.nav.left || Input.nav.right || !Game.idleSince || !(UI.screen && UI.screen.id === 'title')) Game.idleSince = now;
    if (now - Game.idleSince > 10000) { Game.idleSince = 0; startAttract(); }
  } else if (Game.state === 'attract') {
    Game.attractT += dt;
    if (!Game.attractStart) Game.attractStart = performance.now();
    const moved = Input.pads.some((p) => Math.abs(p.axes[0]) > 0.5 || Math.abs(p.axes[1]) > 0.5) || Input.down.size > 0;
    if (Input.anyEdge || moved || performance.now() - Game.attractStart > 150000) { Game.attractStart = 0; toTitle(); Input.endFrame(); return; }
  }
  if (w && w.mode === 'backdrop') { w.time += dt; w.animate(dt); }
  else if (w) {
    simulate(dt);
    Net.tick(dt);
    handleEvents();
    if (Game.world) {
      Game.world.animate(dt);
      if (Game.state === 'hub-count') { const s = Math.ceil(-HUB.time() / 1000); const el = $('countdown'); if (Number.isFinite(s) && s > 0) { el.classList.remove('hidden'); el.textContent = String(s); } }
      const hub = Game.world.mode === 'hub';
      const clock = hub && Number.isFinite(HUB.time()) ? Math.max(0, ((HUB.limitMs || 0) - Math.max(0, HUB.time())) / 1000) : Game.playTime;
      if (Game.state !== 'hub-over' && !(hub && HUB.server)) UI.updateHud(Game.world, { camRoom: Game.camRoom, clock, hubAll: false, hidePrompts: Game.state === 'attract' || UI.open || UI.talking });
      if (Game.world.boss && Game.world.boss.alive && Game.world.boss.st !== 'intro' && Game.world.rooms[Game.camRoom]?.goal === 'boss' && audio.trackName !== 'boss') audio.play('boss');
    }
  }
  UI.updateCaptions(dt); UI.updateToast(dt);
  if (draw) {
    updateCamera(dt);
    Particles.update(dt); updatePopups(dt);
    if (!(Game.world && Game.world.mode === 'hub' && HUB.server)) { try { G.renderer.render(G.scene, G.camera); } catch (err) { if (!G.renderWarned) { G.renderWarned = true; console.warn('render failed', err); } } }
  }
  Input.endFrame();
}
// The shared world never pauses: if the tab is hidden and rAF stops, keep stepping on a timer.
setInterval(() => {
  if (!Game.world || Game.world.mode !== 'hub') return;
  const now = performance.now();
  if (now - (Game.lastRaf || 0) > 250) { const dt = Math.min((now - (Game.lastTimer || now)) / 1000, 0.25); Game.lastTimer = now; try { tick(dt || 0.05, false); } catch (e) { console.error(e); Input.endFrame(); } }
  else Game.lastTimer = now;
}, 50);

HUB.probe(() => {
  const w = Game.world;
  const me = w && [...w.players.values()].find((p) => p.local && !p.bot);
  const scene = { title: 'title', attract: 'title', boot: 'title', play: 'play', 'hub-count': 'ready', 'hub-wait': 'ready', 'hub-ready': 'ready', gameover: 'over', results: 'over', 'hub-over': 'over' }[Game.state] || 'menu';
  return { scene: UI.screen && Game.state === 'title' && UI.screen.id !== 'title' ? 'menu' : scene, menu: !!(UI.open && UI.screen && UI.screen.id !== 'title' && Game.state !== 'title'), world: w ? Math.round(w.time * 1000) / 1000 : 0, input: me ? me.felt : { x: 0, y: 0, fire: false } };
});

// ---------------------------------------------------------------------------- boot
async function boot() {
  Input.init(); UI.init();
  try {
    await RAPIER.init();
    await initGraphics();
  } catch (err) {
    console.error(err);
    const el = $('fatal'); el.classList.remove('hidden');
    el.innerHTML = `<div><h1>Goof Swoop needs WebGPU</h1><p>This game runs on WebGPU only. Please open it in a browser with WebGPU enabled (recent Chrome, Edge, or Safari 26+).</p><p style="opacity:.7">${escapeText(err.message || err)}</p></div>`;
    if (HUB.active) { try { await HUB.connect({ mode: 'co-op', seats: [1, 4] }); } catch { /* no hub */ } HUB.fail('WebGPU unavailable: ' + (err.message || err)); }
    return;
  }
  requestAnimationFrame(frame);
  if (HUB.active) {
    try { if (await startHub()) return; } catch (err) { console.error(err); HUB.fail(String(err.message || err)); return; }
  }
  toTitle();
}
boot();
window.__gs = {
  G, Game, Input, tick, updateCamera, startAttract,
  // Debug readback (headless test runs): render into a target and return a PNG data URL.
  snap: async () => { if (!G.renderer.backend.isWebGPUBackend) { G.renderer.render(G.scene, G.camera); return G.renderer.domElement.toDataURL('image/png'); }
    G.renderer.render(G.scene, G.camera);
    const dev = G.renderer.backend.device, ctx = G.renderer.domElement.getContext('webgpu');
    const tex = ctx.getCurrentTexture(), w = tex.width, h = tex.height, bpr = Math.ceil((w * 4) / 256) * 256;
    const buf = dev.createBuffer({ size: bpr * h, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const enc = dev.createCommandEncoder(); enc.copyTextureToBuffer({ texture: tex }, { buffer: buf, bytesPerRow: bpr }, [w, h]); dev.queue.submit([enc.finish()]);
    await buf.mapAsync(GPUMapMode.READ);
    const src = new Uint8Array(buf.getMappedRange()), bgra = tex.format.startsWith('bgra');
    const c = document.createElement('canvas'); c.width = w; c.height = h; const c2 = c.getContext('2d'); const img = c2.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = y * bpr + x * 4, o = (y * w + x) * 4; img.data[o] = src[i + (bgra ? 2 : 0)]; img.data[o + 1] = src[i + 1]; img.data[o + 2] = src[i + (bgra ? 0 : 2)]; img.data[o + 3] = 255; }
    c2.putImageData(img, 0, 0); buf.unmap(); buf.destroy();
    return c.toDataURL('image/png');
  },
};
