/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {

  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */

    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */

    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */

      },

      },

      getOwnPropertyDescriptor: function (t, k) {

      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.

      } catch (e) {

      }

  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.

  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);

  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */

      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);

      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {

      var list = handlers[type] || [];
      var at = list.indexOf(fn);

    };
  };

    opts = opts || {};

    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };

    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */

    return goAt === null ? -Infinity : now() - goAt;
  };

  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims

  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');

    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */

    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;

  if(key==='escape'){openSettings();return;}

    if(currentScreen==='roomjoin'&&/^[a-z2-9]$/.test(key)){const c=key.toUpperCase();if('ABCDEFGHJKLMNPQRSTUVWXYZ23456789'.includes(c)&&roomCode.length<5){roomCode+=c;renderScreen();}return;}
    if(currentScreen==='roomjoin'&&key==='backspace'){roomCode=roomCode.slice(0,-1);renderScreen();return;}
    if(key==='arrowup')moveFocus(currentScreen==='roomjoin'?-9:-1);
    else if(key==='arrowdown')moveFocus(currentScreen==='roomjoin'?9:1);
    else if(key==='arrowleft'||key==='arrowright'){if(currentScreen==='roomjoin')moveFocus(key==='arrowleft'?-1:1);else if(currentScreen==='settings')activateFocus();}
    else if(key==='enter'||key===' ')activateFocus();else if(key==='backspace')back();
    return;
  }
  if(key==='z')attack(-1);if(key==='x')attack(1);
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
window.addEventListener('pointerdown',()=>{activity();if(currentScreen==='hubready'){AIHub.ready();setScreen('race');}});
window.addEventListener('pointermove',e=>{if(e.movementX||e.movementY){lastInput=performance.now();if(state.attract)stopAttract();}});
window.addEventListener('gamepadconnected',()=>{touchOnly=false;if(currentScreen==='title')renderScreen();});
window.addEventListener('blur',()=>{keys=Object.create(null);});
function frame(now){requestAnimationFrame(frame);tick(now);}
function tick(now){
  if(!renderer)return;
  const dt=clamp((now-lastFrame)/1000,0,.05);lastFrame=now;frameCount++;
  const pad=pollGamepad();
  if(currentScreen==='title'&&!touchOnly&&!AIHub.active&&now-lastInput>10000&&!state.attract)startRace(true,93421,0);
  if(game?.restartAt&&now>game.restartAt){startRace(true,93421,0);}
  const live=(state.scene==='play'||state.scene==='ready')&&!state.ended&&!game?.finished;
  if(live){
    let t=AIHub.active?AIHub.time():(now-game.startAt);
    if(!game.started&&t>=0){game.started=true;state.scene='play';audio.fx('go');setCallout('GO! GIVE ’EM A SHOW.',1.3);}
    if(game.started){
      const paused=currentScreen==='settings'&&!AIHub.active&&!net?.ready;
      if(!paused){
        let input=state.attract?scriptedInput():readInput(pad);
        if(currentScreen==='settings')input={x:0,y:0,gas:false,brake:false,boost:false,fire:false};
        state.input={x:input.x,y:input.y,fire:input.fire};
        state.world+=dt;game.elapsed=AIHub.active?Math.max(0,AIHub.time()/1000):game.elapsed+dt;
        updateActors(dt);updatePhysics(dt,input);
        game.lastSend+=dt;if(game.lastSend>=1/12){game.lastSend=0;publishState();}
      }
    }
    updateCamera(dt);
  }else if(state.scene==='title'){
    state.input={x:0,y:0,fire:false};updateCamera(dt);
  }
  if(now-lastHud>90){lastHud=now;updateHud();}
  audio.update(game?.speed||0,live&&game?.started&&currentScreen!=='settings');
  if(!document.hidden)renderer.render(scene,camera);
}
setInterval(()=>{if(document.hidden&&renderer)tick(performance.now());},250);
function resize(){if(!renderer)return;camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);}
async function boot(){
  ui.innerHTML=panel('Warming <em>up.</em>','<p>Loading the coast…</p>');
  try{
    if(!navigator.gpu)throw new Error('WebGPU is required. Open this game in a current WebGPU-enabled browser on a supported device.');
    const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw new Error('No WebGPU adapter is available on this device.');
    const [T,physics]=await Promise.all([import('/lib/vendor/three/0.180.0/build/three.webgpu.js'),import('/lib/vendor/rapier/0.19.3/rapier3d-compat/rapier.mjs')]);
    THREE=T;RAPIER=physics.default||physics;await RAPIER.init();
    renderer=new THREE.WebGPURenderer({antialias:true,alpha:false});await renderer.init();
    if(!renderer.backend?.isWebGPUBackend)throw new Error('The WebGPU renderer could not start. This game does not use a WebGL fallback.');
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(window.innerWidth,window.innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;view.appendChild(renderer.domElement);
    scene=new THREE.Scene();scene.background=new THREE.Color(0x99d9d1);scene.fog=new THREE.Fog(0x99d9d1,150,430);
    camera=new THREE.PerspectiveCamera(53,window.innerWidth/window.innerHeight,.1,800);
    scene.add(new THREE.HemisphereLight(0xd6f8df,0xb16d55,2));const sun=new THREE.DirectionalLight(0xffedbf,2.5);sun.position.set(-80,130,40);scene.add(sun);
    buildCourse();touchOnly=matchMedia('(pointer: coarse)').matches&&!matchMedia('(any-pointer: fine)').matches;
    resetRun(false,true,93421);state.scene='title';lastInput=performance.now();setScreen('title');window.addEventListener('resize',resize);
    AIHub.on('message',(data,from)=>incoming(data,from));
    AIHub.on('leave',({id})=>removeRemote(id));
    AIHub.on('start',()=>{audio.start();if(currentScreen==='hubready')setScreen('race');});
    AIHub.on('time-up',()=>{if(game&&!game.finished)finishRace(false,'TIME IS UP');});
    AIHub.on('end',()=>{state.ended=true;state.input={x:0,y:0,fire:false};keys=Object.create(null);audio.quiet();if(game&&!game.finished){game.finished=true;game.success=false;game.finishReason='ROUND COMPLETE';}state.scene='over';setScreen('result');});
    if(AIHub.active){
      const info=await AIHub.connect({mode:'race',seats:[1,4]});
      if(info){sessionInfo=info;resetRun(false,false,info.seed);game.startAt=Infinity;state.scene='ready';setScreen('race');initHud();if(info.splash){AIHub.ready();}else{setScreen('hubready');}}
      else {state.scene='title';setScreen('title');}
    }
    lastFrame=performance.now();requestAnimationFrame(frame);
  }catch(err){
    console.error(err);if(AIHub.active)AIHub.fail(err.message||'Could not start WebGPU');
    touchOnly=matchMedia('(pointer: coarse)').matches&&!matchMedia('(any-pointer: fine)').matches;
    ui.innerHTML='';fatal.innerHTML=`<div class="fatal-panel"><h2>${touchOnly?'Controller or keyboard required':'Can’t start the ride'}</h2><p>${safe(err.message||err)}</p><p>WebGPU and an internet connection for the engine libraries are required.</p>${touchOnly?'<button class="choice" id="fatal-settings">Settings</button>':''}</div>`;
    if(touchOnly)$('fatal-settings').onclick=()=>{fatal.style.display='none';settingsReturn='fatal';setScreen('settings');};
  }
}
boot();
