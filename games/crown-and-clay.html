class Game{

 if(saved){this.validate(saved);this.s=JSON.parse(JSON.stringify(saved));this.refreshVisibility();return;}
 this.s={version:1,seed,turn:1,gold:40,culture:0,research:'agriculture',researchBank:{},techs:[],civic:'tradition',tiles:map(seed),units:[],cities:[],nextId:1,everFounded:false,ended:null,keepPlaying:false,ruins:0,log:[],relations:[null,{met:false,status:'peace',favor:10,trade:false,warTurn:0},{met:false,status:'peace',favor:20,trade:false,warTurn:0}],ai:[null,{gold:35,culture:0,techs:['agriculture'],research:'mining',researchBank:{},civic:'tradition'},{gold:35,culture:0,techs:['agriculture'],research:'pottery',researchBank:{},civic:'tradition'}],tutorial:0};
 this.addUnit(0,'settler',5,10);this.addUnit(0,'scout',6,10);this.addUnit(0,'warrior',5,11);
 this.addCity(1,13,5,FACTIONS[1].capital,true);this.addCity(2,16,11,FACTIONS[2].capital,true);

 }
 validate(s){if(!s||s.version!==1||!Array.isArray(s.tiles)||s.tiles.length!==W*H||!Array.isArray(s.units)||!Array.isArray(s.cities)||!Number.isInteger(s.turn)||s.turn<1||s.turn>10000||!Array.isArray(s.techs)||!s.relations||!s.ai||!s.researchBank||!Number.isFinite(s.gold))throw Error('This is not a valid Crown & Clay save.');
 if(s.units.length>500||s.cities.length>100)throw Error('This save is too large.');
 const ids=new Set();for(const o of [...s.units,...s.cities]){if(!Number.isInteger(o.x)||!Number.isInteger(o.z)||o.x<0||o.x>=W||o.z<0||o.z>=H||!Number.isInteger(o.id)||ids.has(o.id)||!Number.isInteger(o.owner)||o.owner<0||o.owner>3)throw Error('The save contains an invalid piece.');ids.add(o.id);}

 const factionOK=f=>f&&Array.isArray(f.techs)&&f.techs.length<=9&&new Set(f.techs).size===f.techs.length&&f.techs.every(k=>known(TECHS,k))&&(f.research===null||known(TECHS,f.research))&&isRecord(f.researchBank)&&Object.entries(f.researchBank).every(([k,v])=>known(TECHS,k)&&finite(v))&&finite(f.gold)&&finite(f.culture)&&['tradition','industry','council'].includes(f.civic);
 if(!factionOK(s)||!factionOK(s.ai[1])||!factionOK(s.ai[2])||!Number.isInteger(s.nextId)||s.nextId<=Math.max(0,...ids)||!Number.isInteger(s.seed)||!finite(s.ruins)||typeof s.everFounded!=='boolean'||typeof s.keepPlaying!=='boolean'||!Array.isArray(s.log)||s.log.length>100||s.log.some(l=>!l||typeof l.text!=='string'||l.text.length>2000||!Number.isInteger(l.turn)))throw Error('The save contains invalid realm data.');

 }else if(type==='journey'){title='A little empire. A lasting story.';kicker='Three paths to victory';let caps=game.s.cities.filter(c=>(c.capital===1||c.capital===2)&&c.owner===0).length;body=`<p class="modal-intro">Lead the Dawnfolk through 60 turns of the First Dawn. Your choices decide how this age ends.</p><div class="goal-grid"><div class="goal-card">${icon('sunspire')}<h3>Build a wonder</h3><p>Found 2 cities. Discover Engineering and Philosophy. Complete the Sunspire in one city.</p><small>${game.has('engineering')?'✓':'○'} Engineering · ${game.has('philosophy')?'✓':'○'} Philosophy</small></div><div class="goal-card">${icon('crown')}<h3>Unite the land</h3><p>Capture Cinderhold and Pearlwatch, the two rival capitals. You must defeat their defenders first.</p><small>${caps} / 2 capitals held</small></div><div class="goal-card">${icon('culture')}<h3>Leave a legacy</h3><p>Have the highest score after turn 60. Grow cities, learn ideas, build, and gather culture.</p><small>${game.score()} legacy points · ${Math.max(0,61-game.s.turn)} turns left</small></div></div><div class="section-head"><h3>Your first steps</h3><span class="kicker">A guide, not a limit</span></div>${[[game.cities().length>0,'Found your capital','A home for your people'],[game.s.ruins>0,'Explore ancient ruins','Move a unit onto the ruins'],[game.s.techs.length>0,'Make your first discovery','End turns to gather science'],[game.cities().length>=2,'Found a second city','Train and move a settler']].map(([done,n,d])=>`<div class="check-row ${done?'done':''}">${icon(done?'check':'circle')}<span>${n}</span><small>${done?'Complete':d}</small></div>`).join('')}<div class="section-head"><h3>The balance of power</h3></div>${scoreTable()}<p class="context-note">Score: 40 per city, 12 per person, 15 per discovery, 5 per building, 1 per 3 culture, 1 per 10 gold, and 8 per ruin explored.</p><div class="section-head"><h3>The record of your age</h3></div>${game.s.log.length?game.s.log.slice(0,12).map(l=>`<div class  }else if(type==='council'){title='The council of realms';kicker='A word can open a border. Or close it.';body=`<p class="modal-intro">Trade brings gold and knowledge to both realms. Gifts improve goodwill. The Ember Court may attack a weak realm after turn 24 if goodwill is below 30.</p><div class="rival-grid">${[1,2].map(o=>{const r=game.s.relations[o],alive=game.cities(o).length>0;if(!r.met)return `<div class="rival-card unknown-rival">${icon('compass')}<h3>Beyond the horizon</h3><p>Explore the map to meet this realm.<br>A scout sees farther than other units.</p></div>`;return `<div class="rival-card"><div class="rival-top"><div class="rival-portrait">${ruler(o)}</div><div><div class="kicker">${FACTIONS[o].leader}</div><h3>${FACTIONS[o].name}</h3><span class="badge ${r.status==='war'?'danger':''}">${!alive?'REALM FALLEN':r.status==='war'?'AT WAR':r.trade?'TRADE PARTNERS':'AT PEACE'}</span></div></div><p>${o===1?'“Strong walls make fine neighbours. Strong armies make better ones.”':'“Let our roads carry goods, not soldiers.”'}</p><div class="goodwill between"><span>Goodwill</span><span>${r.favor} / 100</span></div><div class="progress"><i style="width:${clamp(r.favor,0,100)}%"></i></div>${alive?`<div class="rival-actions">${r.status==='war'?`<button class="primary" data-action="diplomacy" data-owner="${o}" data-key="peace" ${game.s.gold<30?'disabled':''}>${icon('leaf')}Peace · 30 gold</button>`:`<button class="secondary" data-action="diplomacy" data-owner="${o}" data-key="gift" ${game.s.gold<20?'disabled':''}>${icon('coin')}Gift · 20 gold</button><button class="secondary" data-action="diplomacy" data-owner="${o}" data-key="trade" ${!game.has('writing')||r.trade||game.s.gold<20?'disabled':''} title="Requires Writing. Costs 20 gold. Adds 3 gold and 1 science per turn.">${icon('road')}${r.trade?'Pact active':'Trade · 20 gold'}</button><button class="secondary" data-action="diplomacy" data-owner="${o}" data-key="maps" ${r.favor<25||game.s.gold<15?'disabled':''} title=  }else if(type==='menu'){title='A moment to consider';kicker='Crown & Clay · The First Dawn';body=`<div class="setting-row"><div><h3>Sound & music</h3><p>Soft notes and sounds for your actions.</p></div><button class="toggle ${settings.audio?'on':''}" data-action="audio">${settings.audio?'On':'Off'}</button></div><div class="setting-row"><div><h3>Graphics</h3><p>Battery mode removes shadows.</p></div><div class="quality-options">${['auto','high','battery'].map(q=>`<button data-action="quality" data-key="${q}" class="${q===settings.quality?'active':''}">${q[0].toUpperCase()+q.slice(1)}</button>`).join('')}</div></div><div class="setting-row"><div><h3>Tile grid</h3><p>Show the square map tiles.</p></div><button class="toggle ${settings.grid?'on':''}" data-action="grid">${settings.grid?'On':'Off'}</button></div><div class="setting-row"><div><h3>Tile yields</h3><p>Show food, production, and gold on the map.</p></div><button class="toggle ${settings.yields?'on':''}" data-action="yields">${settings.yields?'On':'Off'}</button></div><div class="menu-actions"><button class="secondary" data-action="export">${icon('export')}Export save</button><button class="secondary" data-action="import">${icon('import')}Import save</button></div><p class="save-status">${esc(saveStatus)}</p><div class="menu-actions"><button class="secondary" data-action="help">${icon('help')}How to play</button><button class="danger-btn" data-action="new-confirm">${icon('rotate')}New age</button></div><div class="rule"></div><p class="tiny muted" style="line-height:1.65">An original, independent tribute to the joy of turn-based empire games. All models and sounds are made by code. No online services, accounts, or downloads are required during play.</p><p class="tiny muted" style="margin-top:9px">WebGL 2 · single-file edition · v1.0</p>`;
 }else if(type==='help'){title='Every great story starts small';kicker='How to play';body=`<div class="help-grid"><div class="help-block"><h3>1. Settle, then explore</h3><p>Select the settler and press <b>Found capital</b>. Select your scout. Tap a tile, then press <b>Move here</b>. Gold dots show reachable tiles. Ruins give a one-time gift.</p><p>Drag the map to pan. Pinch to zoom on a touch screen. Use the mouse wheel on desktop. Tap the small map to jump to that area.</p><h3>2. Build your home</h3><p>Select a city and choose <b>Change production</b>. Workers build improvements. Settlers found cities. Soldiers protect your land.</p><p>A city works one nearby tile per person. Food grows the population. Production completes projects. Gold pays for upkeep and treaties. Culture expands borders at 10 and 50 local culture.</p></div><div class="help-block"><h3>3. Learn and improve</h3><p>Tap the research card to choose a discovery. End turns to gather science. Move a worker onto land inside your borders. Farms need Agriculture; mines need Mining. Each job takes 2 turns.</p><p>Roads cost half a movement point when both tiles have roads. Hills and forests cost 2 points. Scouts ignore these extra costs. Water and mountains are not passable in this age.</p><h3>4. Trade or take a stand</h3><p>Meet rivals by exploring. Use the Council for trade, gifts, peace, or war. Gifts raise goodwill by 25. Trade costs 20 gold and adds 3 gold and 1 science each turn.</p><p>To attack, select a soldier and tap an enemy. Review the damage, then press <b>Attack</b>. Melee troops attack adjacent tiles. Catapults attack from 2 tiles. Fortified troops gain 30% defence. Resting heals 12 health; fortifying heals 22.</p></div></div><div class="rule"></div><div class="help-block"><h3>Winning the First Dawn</h3><p>Complete the Sunspire with 2 cities and both Engineering and Philosophy. Or capture both rival capitals. Or have the highest score after turn 60. You lose if your last city falls and you have no settler.</p><p>Units regain their movement each turn. <b>End turn does not move your units for you.</b> You may skip unused moves. Auto-save keeps each order on this device. Export a save from the menu for a separate copy.</p></div><div class="rule"></div><p class="tiny muted" style="line-height:2"><span class="key">Enter</span> End turn &nbsp; <span class="key">Space</span> Next unit &nbsp; <span class="key">F</span> Found / fortify &nbsp; <span class="key">W A S D</span> Pan<br><span class="key">Q E</span> Rotate &nbsp; <span class="key">+ −</span> Zoom &nbsp; <span class="key">H</span> Home &nbsp; <span class="key">G</span> Grid &nbsp; <span class="key">Y</span> Yields &nbsp; <span class="key">Esc</span> Close</p>`;

 }else if(type==='new'){title='Turn a fresh page';kicker='Start a new age';body=`<p class="modal-intro">Start with a settler, a scout, and a warrior. This replaces the local auto-save. Export your current save first to keep it.</p><label class="kicker" for="world-seed">World seed</label><input class="seed-input" id="world-seed" type="number" min="1" max="999999" value="${Math.floor(Math.random()*99900)+100}" inputmode="numeric"><p class="context-note">The First Dawn keeps its main landmarks. The seed changes the smaller terrain details and resources.</p><div class="menu-actions"><button class="secondary" data-action="export">${icon('export')}Export current save</button><button class="primary gold-btn" data-action="new-game">${icon('sun')}Begin a new age</button></div>`;
 }else if(type==='victory'){const end=game.s.ended;if(!end)return closeModal();const won=end.winner===0;title=won?'Your name will be remembered.':'Every ending holds a beginning.';kicker='The First Dawn · Final record';body=`<div class="victory-hero"><div class="victory-seal">${icon(won?'sunspire':'leaf')}</div><div class="kicker">${won?end.type+' victory':end.type==='Defeat'?'Your realm has fallen':FACTIONS[end.winner]?.name+' wins'}</div><h3>${won?'A small realm.<br>A great legacy.':'The sun will<br>rise again.'}</h3><p>${esc(end.text)}</p><div class="victory-stats"><div><strong>${game.cities().length}</strong><span>Cities</span></div><div><strong>${game.s.techs.length}</strong><span>Discoveries</span></div><div><strong>${game.score()}</strong><span>Legacy</span></div></div></div>${scoreTable(true)}<div class="menu-actions"><button class="secondary" data-action="keep-playing">Continue this world</button><button class="primary gold-btn" data-action="new-confirm">${icon('sun')}A new beginning</button></div>`;

function scoreTable(all=false){return `<table class="score-table"><thead><tr><th>Realm</th><th>Cities</th><th>Legacy</th></tr></thead><tbody>${[0,1,2].sort((a,b)=>game.score(b)-game.score(a)).map(o=>{let known=all||o===0||game.s.relations[o].met;return `<tr><td><span class="realm-dot" style="background:${known?FACTIONS[o].color:'#afb89e'}"></span>${known?FACTIONS[o].name:'Unknown realm'}${o===0?' · You':''}</td><td>${known?game.cities(o).length:'—'}</td><td>${known?game.score(o):'—'}</td></tr>`;}).join('')}</tbody></table>`;}
function result(r){if(!r?.ok){toast(r?.msg||'That order is not available.');return false;}return true;}
function currentUnit(){return selection?.type==='unit'?game.unit(selection.id):null;}
function nextUnit(){const all=game.units(),ready=all.filter(u=>u.moves>0&&!u.fortified&&!u.job),list=ready.length?ready:all;if(!list.length){toast('Train a unit in one of your cities.');return;}let i=list.findIndex(u=>u.id===selection?.id);select('unit',list[(i+1)%list.length].id,true);}
function explore(){const u=currentUnit();if(!u||u.moves<=0)return;const r=game.reachable(u),targets=[...r.keys()].map(k=>game.tiles[k]).filter(t=>!(t.x===u.x&&t.z===u.z));if(!targets.length){toast('No open route. Wait for the next turn.');return;}const unknown=game.tiles.filter(t=>!t.explored);function val(t){let n=game.tiles.filter(a=>!a.explored&&dist(t,a)<=3).length;let nd=unknown.length?Math.min(...unknown.map(a=>dist(t,a))):0;let danger=game.s.units.some(v=>game.hostile(u.owner,v.owner)&&dist(v,t)<=1)?45:0;return n*3+(t.ruin?100:0)-nd*4-danger-r.get(t.z*W+t.x)*.2;}
 targets.sort((a,b)=>val(b)-val(a));const t=targets[0];target=null;result(game.move(u.id,t.x,t.z));render.focus(t.x,t.z);sound.cue('move');}
function exportSave(){try{const blob=new Blob([JSON.stringify(game.s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`crown-and-clay-turn-${game.s.turn}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Your save has been exported.');}catch{toast('The browser could not export this save.','danger');}}
function startNew(seed){game=new Game(null,clamp(Math.trunc(Number(seed))||417,1,999999));attachGame();render.game=game;render.unitPos.clear();render.span=innerWidth<720?25:26;render.yaw=.5;selection={type:'unit',id:game.units()[0].id};target=null;lastVictory=null;closeModal();$('toasts').innerHTML='';render.home();refresh(true);sound.cue('city');}
async function act(action,data={}){if(busy&&action!=='close-modal')return;const u=currentUnit(),id=Number(data.id),key=data.key,owner=Number(data.owner);
 switch(action){
 case 'research':openModal('research');break;case 'journey':openModal('journey');break;case 'council':openModal('council');break;case 'menu':openModal('menu');break;case 'help':openModal('help');break;
 case 'close-modal':closeModal();break;case 'production':openModal('production',{id:id||selection?.id});break;case 'city-detail':openModal('city',{id:id||selection?.id});break;
 case 'set-research':if(result(game.setResearch(key))){closeModal();toast('Your people will study '+TECHS[key].name+'.');sound.cue('move');}break;
 case 'set-build':if(result(game.setBuild(id,key))){closeModal();select('city',id);toast(game.city(id).name+' begins '+BUILDS[key].name+'.');}break;
 case 'focus':if(result(game.setFocus(id,key)))paintModal();break;
 case 'select-unit':select('unit',id);break;case 'select-city':select('city',id);break;case 'enemy-target':{let enemy=game.unit(id);if(enemy){if(u){target=game.tile(enemy.x,enemy.z);syncSelection();updateContext();}else select('tile',game.tile(enemy.x,enemy.z));}break;}
 case 'deselect':selection=null;target=null;syncSelection();updateContext();updateLabels();break;
 case 'next-unit':closeModal();nextUnit();break;
 case 'clear-target':target=null;syncSelection();updateContext();break;
 case 'found':if(u){let x=u.x,z=u.z,r=game.found(u.id);if(result(r)){select('city',r.city);render.burst(x,z);sound.cue('city');}}break;
 case 'move':if(u&&target){let t=target;target=null;if(result(game.move(u.id,t.x,t.z))){syncSelection();updateContext();sound.cue('move');}else{target=t;syncSelection();updateContext();}}break;
 case 'attack':if(u&&target){let t=target;target=null;if(result(game.attack(u.id,t.x,t.z))){render.burst(t.x,t.z,'#dfaa66');sound.cue('battle');}syncSelection();updateContext();}break;
 case 'wait':case 'stop-job':if(u)result(game.wait(u.id,false));break;
 case 'fortify':if(u)result(game.wait(u.id,true));break;

 case 'home':render.home();break;case 'zoom-in':render.zoom(.85);break;case 'zoom-out':render.zoom(1.18);break;case 'rotate-left':render.rotate(-Math.PI/4);break;case 'rotate-right':render.rotate(Math.PI/4);break;

 }
}

 const k=e.key.toLowerCase(),bindings={'enter':'end-turn',' ':'next-unit','h':'home','g':'grid','y':'yields','q':'rotate-left','e':'rotate-right','+':'zoom-in','=':'zoom-in','-':'zoom-out'};if(bindings[k]){e.preventDefault();act(bindings[k]);return;}if(k==='escape'){e.preventDefault();act(target?'clear-target':'deselect');}if(k==='f'){e.preventDefault();act(currentUnit()?.type==='settler'?'found':'fortify');}if(['w','a','s','d','arrowleft','arrowright','arrowup','arrowdown'].includes(k)){e.preventDefault();const dx=k==='a'||k==='arrowleft'?70:k==='d'||k==='arrowright'?-70:0,dy=k==='w'||k==='arrowup'?70:k==='s'||k==='arrowdown'?-70:0;render.pan(dx,dy);}});
