/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

const ERAS = [
 {name:'The first sparks',short:'First sparks',start:1948,end:1955,step:1,unit:'year',tag:'FOUNDATIONS',color:'#b7a5ee',icon:'spark',headline:'Small lab. Big possibilities.',desc:'A few curious people. A room full of circuits. Build a research company before AI has its name.',mechanic:'Experiments & research grants',architectures:['Logic circuit','Artificial neuron'],tech:['Boolean logic','Repeatable experiments','Neural foundations'],lesson:'A machine can represent a logical rule. An early artificial neuron is a mathematical model, not a tiny human brain. In this era, make a narrow claim and show that others can repeat your result.',question:'Your prototype works on three hand-picked examples. What should you do next?',answers:['Promise human-level intelligence','Test new examples and record failures','Buy more office furniture'],correct:1,explain:'New examples help test whether the result extends beyond the demonstration. Repeatable tests are better evidence than a polished display.',sources:['dartmouth','history'],challenge:'Build and test a repeatable prototype.',special:'evaluation'},
 {name:'Rules, symbols & search',short:'Symbols & search',start:1956,end:1969,step:1,unit:'year',tag:'SYMBOLIC AI',color:'#89b7ef',icon:'branch',headline:'Teach a machine the rules.',desc:'Symbolic programs solve defined problems. Search can explore possibilities, but the number of paths can grow very fast.',mechanic:'Search budget & rule coverage',architectures:['Symbolic search','Perceptron'],tech:['Heuristic search','Symbolic representation','Search pruning'],lesson:'A symbolic system uses explicit representations and rules. Search explores possible steps. A heuristic guides the search, but does not make every problem easy. Perceptrons are a separate early learning approach.',question:'A search program becomes too slow when the problem gets larger. What can help?',answers:['Use a useful heuristic and limit scope','Add more possible moves','Remove all tests'],correct:0,explain:'A heuristic can reduce the part of the search space that must be explored. Test it: some shortcuts can miss good solutions.',sources:['dartmouth','history'],challenge:'Control search cost without overstating the result.',special:'evaluation'},
 {name:'The first AI winter',short:'Reality check',start:1970,end:1979,step:1,unit:'year',tag:'LIMITS & RESILIENCE',color:'#9caec7',icon:'snow',headline:'Good science survives the hype.',desc:'Funding becomes less certain. Trade broad promises for smaller projects that customers can verify.',mechanic:'Funding cuts & narrow contracts',architectures:['Rule-based system','Heuristic planner'],tech:['Narrow problem scope','Failure analysis','Maintainable rules'],lesson:'AI winters describe periods of reduced confidence and investment. They did not stop all research. A company must match claims to evidence and keep enough cash to survive delayed contracts.',question:'A funder cuts support after an ambitious demonstration. What is a sound response?',answers:['Double the promise','Stop measuring results','Reduce scope and deliver a useful testable system'],correct:2,explain:'A narrow useful system can make progress with limited resources. In the game, a grant cut tests your cash reserve and product income.',sources:['history'],challenge:'Keep public trust at 65 or more.',special:'trust'},
 {name:'The expert-system boom',short:'Expert systems',start:1980,end:1986,step:1,unit:'year',tag:'KNOWLEDGE ENGINEERING',color:'#e9b56c',icon:'book',headline:'Expertise, one rule at a time.',desc:'Turn expert knowledge into rules. Pay for interviews, resolve conflicts, and maintain the knowledge base.',mechanic:'Expert interviews & rule maintenance',architectures:['Expert system','Rule-based planner'],tech:['Knowledge elicitation','Conflict resolution','Explanation trails'],lesson:'An expert system applies a knowledge base and an inference process. Acquiring accurate rules takes skilled people. Rules need updates when the domain changes. The explanation of a rule chain is not proof that the rules are right.',question:'Two experts provide conflicting rules. What should your team do?',answers:['Keep only the cheaper expert','Resolve the conflict and test edge cases','Let the system choose at random'],correct:1,explain:'Knowledge quality depends on how conflicts, exceptions, and updates are managed. A larger rule base can cost more to maintain.',sources:['history'],challenge:'Prepare a clean knowledge base.',special:'clean'},
 {name:'The statistical turn',short:'Statistical AI',start:1987,end:1999,step:1,unit:'year',tag:'LEARNING FROM EVIDENCE',color:'#79c4b0',icon:'chart',headline:'Let evidence change the model.',desc:'Specialized systems face pressure. Data, probability, and measured performance create new paths.',mechanic:'Train / test split & uncertainty',architectures:['Decision tree','Probabilistic classifier'],tech:['Held-out evaluation','Probabilistic models','Cross-validation'],lesson:'A statistical model estimates relationships from examples. Testing on training examples can hide overfitting. Keep test data separate, and check whether it represents the users and cases that matter.',question:'Training accuracy is high, but test accuracy is low. What is a likely problem?',answers:['The model may have overfit the training data','The test set must be deleted','More parameters always solve this'],correct:0,explain:'Overfitting occurs when a model fits training details that do not generalize. A held-out set reveals the gap.',sources:['history'],challenge:'Hold back data for a valid evaluation.',special:'split'},
 {name:'Data becomes a business',short:'Data at scale',start:2000,end:2011,step:1,unit:'year',tag:'APPLIED MACHINE LEARNING',color:'#7cbfcc',icon:'database',headline:'Find the signal in the data.',desc:'Build classifiers, rankers, and recommendations. Useful features and sound product metrics matter.',mechanic:'Feature quality & data drift',architectures:['Feature-based classifier','Tree ensemble'],tech:['Feature engineering','Data pipelines','Drift monitoring'],lesson:'A useful feature makes relevant information available to a model. A successful product also needs a good data pipeline, a suitable business metric, and tests after launch. User behavior can change, causing data drift.',question:'Your model worked last year, but customer behavior has changed. What should you check?',answers:['Only the logo','Data drift and performance on current examples','Only training speed'],correct:1,explain:'The data distribution can change after deployment. Compare current data and outcomes, then validate any update.',sources:['history'],challenge:'Deploy a model with valid held-out tests.',special:'split'},
 {name:'The deep-learning leap',short:'Deep learning',start:2012,end:2016,step:1,unit:'year',tag:'GPUs & NEURAL NETWORKS',color:'#f2a99b',icon:'layers',headline:'More layers. New possibilities.',desc:'Neural networks learn useful representations. Graphics processors make larger experiments practical.',mechanic:'Accelerator capacity & regularization',architectures:['Convolutional network','Recurrent network'],tech:['GPU training','Regularization','Learned representations'],lesson:'Deep networks use multiple layers to learn representations. GPUs help execute many calculations in parallel. Larger networks still need suitable data, careful validation, and controls against overfitting.',question:'What does a GPU mainly provide for model training?',answers:['A guarantee of correct answers','Permission to use any data','More parallel computation'],correct:2,explain:'Compute makes experiments possible. It does not remove data, evaluation, or product risks.',sources:['alexnet'],challenge:'Build additional compute capacity.',special:'compute'},
 {name:'The Transformer foundations',short:'Transformers',start:2017,end:2019,step:0.25,unit:'quarter',tag:'LLM ERA · 01',color:'#ab9bea',icon:'network',headline:'Attention changes the architecture.',desc:'Select tokens, prepare a corpus, and train an attention-based model. Learn what pretraining does—and does not do.',mechanic:'Tokens, attention & pretraining',architectures:['Decoder Transformer','Encoder Transformer'],tech:['Self-attention','Tokenization','Pretraining pipeline'],lesson:'A token is a unit of model input, often a word part. Attention mixes information across tokens. Pretraining learns patterns from an objective such as next-token prediction. This alone does not ensure factual or helpful answers.',question:'A pretrained model predicts plausible next tokens. What is still needed for a reliable product?',answers:['Evaluation and controls for the intended use','Nothing: plausible text is enough','Only a longer context window'],correct:0,explain:'A training objective is not a product quality guarantee. Evaluate actual tasks, failures, and user needs.',sources:['attention'],challenge:'Train a Transformer and test unseen data.',special:'split'},
 {name:'Scale & few-shot learning',short:'The scaling race',start:2020,end:2021,step:0.25,unit:'quarter',tag:'LLM ERA · 02',color:'#af94e9',icon:'cpu',headline:'Scale with purpose, not just size.',desc:'Balance parameters, tokens, and compute. Choose between building a model, adapting weights, or buying an API.',mechanic:'Build / adapt / buy & compute balance',architectures:['Dense Transformer','Sparse expert model'],tech:['Few-shot prompting','Compute budgeting','Model adaptation'],lesson:'Few-shot prompts give a model examples without changing its weights. Training changes weights. A bigger model trained on too little data can waste a fixed budget. Hosted APIs reduce initial work but add usage costs and supplier dependence.',question:'You have a fixed training budget. Which plan deserves comparison?',answers:['Only the model with the most parameters','Several model sizes and data amounts','A model with no test budget'],correct:1,explain:'Model size and data volume interact. A smaller, well-trained model can be a better use of a fixed budget. The game shows a simple 6ND work estimate.',sources:['gpt3','scaling'],challenge:'Prepare data before you scale.',special:'clean'},
 {name:'Instruction & human feedback',short:'Alignment',start:2022,end:2022,step:1/12,unit:'month',tag:'LLM ERA · 03',color:'#c596df',icon:'heart',headline:'Make the model useful to people.',desc:'Collect demonstrations, perform supervised fine-tuning, and learn from human preferences. Better behavior is not perfect safety.',mechanic:'SFT → preference training → evaluation',architectures:['Instruction Transformer','Dense Transformer'],tech:['Supervised fine-tuning','Human preference data','Alignment evaluation'],lesson:'Supervised fine-tuning (SFT) learns from demonstrations of useful answers. Preference training uses comparisons. RLHF often trains a reward model, then optimizes the language model. Preferences can be biased, and these steps do not remove every failure.',question:'Human preference training improves ratings. What can you safely conclude?',answers:['Every answer is now true','The model cannot be misused','Behavior improved on the measured distribution; further tests remain necessary'],correct:2,explain:'Human ratings provide useful signals, not universal truth. Test other groups, tasks, and failure modes.',sources:['rlhf'],challenge:'Complete supervised fine-tuning.',special:'sft'},
 {name:'From chat to useful products',short:'RAG & products',start:2023,end:2023,step:1/12,unit:'month',tag:'LLM ERA · 04',color:'#9dacec',icon:'rocket',headline:'A model is not yet a product.',desc:'Add retrieval, access checks, evaluation, and a release plan. Price the service against real serving costs.',mechanic:'RAG, permissions & unit economics',architectures:['Retrieval-ready Transformer','Instruction Transformer'],tech:['Retrieval pipelines','Preference optimization','Release monitoring'],lesson:'Retrieval-augmented generation (RAG) supplies external material at answer time. It can improve access to current information, but retrieval can fail. Respect document permissions and test both retrieval and final answers. RAG research predates this product era.',question:'Your system retrieves a document the user is not allowed to read. What should happen?',answers:['The document must be excluded before answer generation','The model may show it with a warning','The document can be used because it is indexed'],correct:0,explain:'Retrieval needs access control. An index is not permission to disclose its contents.',sources:['rag','dpo','risk'],challenge:'Add a licensed retrieval source to a model.',special:'rag'},
 {name:'Beyond text',short:'Multimodal AI',start:2024,end:2024,step:1/12,unit:'month',tag:'LLM ERA · 05',color:'#7dc7c1',icon:'eye',headline:'See, hear, and test again.',desc:'Combine images, sound, and text. Pay for consent, modality-specific tests, storage, and response time.',mechanic:'Multimodal data & cross-modal tests',architectures:['Vision-language model','Text-audio model'],tech:['Cross-modal representation','Modality evaluation','Efficient serving'],lesson:'A multimodal system uses more than one kind of input or output. Good text performance does not prove that image or audio performance is good. Use suitable paired data, check consent, and test each modality and their combinations.',question:'Your text model gains image input. What must your release process add?',answers:['Only a larger icon','Image and cross-modal tests, plus data-rights checks','No new tests'],correct:1,explain:'Each modality creates new errors and data risks. Validate the full task, not just text output.',sources:['multimodal','risk'],challenge:'Acquire paired, licensed media data.',special:'media'},
 {name:'Reasoning & tool-using agents',short:'Reasoning & agents',start:2025,end:2026,step:0.25,unit:'quarter',tag:'LLM ERA · 06',color:'#e6b07b',icon:'branch',headline:'More steps. More responsibility.',desc:'Allocate inference time, connect tools, set limits, and keep humans in control of consequential actions.',mechanic:'Inference budget & bounded tool use',architectures:['Reasoning model','Tool-using model'],tech:['Reasoning evaluation','Tool orchestration','Permission boundaries'],lesson:'A tool-using agent can select actions using feedback. Additional reasoning and tool calls cost time and money. Errors can compound across steps. Use limited permissions, action budgets, logging, and approval for consequential actions.',question:'An agent can modify a customer account. Which control is strongest?',answers:['A friendly instruction alone','Unlimited retries','Narrow tool permissions and human approval for sensitive changes'],correct:2,explain:'Technical permission limits restrict what the system can do. Approval adds a checkpoint. Neither makes every output correct.',sources:['agents','reasoning','risk'],challenge:'Enable human approval and complete a test-and-fix cycle.',special:'agents'},
 {name:'Accountable autonomy',short:'Accountable autonomy',start:2027,end:2039,step:1,unit:'year',tag:'POSSIBLE FUTURE · FICTION',color:'#a4c9b5',icon:'shield',headline:'Earn the right to do more.',desc:'In this imagined future, customers buy verified outcomes. Design audits, appeal routes, and clear responsibility.',mechanic:'Outcome contracts & auditability',architectures:['Bounded autonomous system','Verified workflow'],tech:['Outcome verification','Independent audits','Human appeal routes'],lesson:'This era is fiction, not a forecast. Explore a company that sells verified outcomes instead of generated text. Someone must define success, review disputed results, and remain responsible when automation fails.',question:'An automated system meets its metric but harms a user. What should be available?',answers:['No appeal: the metric passed','Human review and an appeal process','A larger model only'],correct:1,explain:'A narrow metric can miss real harm. Accountability needs a route to review and correct decisions.',sources:['risk'],challenge:'Maintain trust and active human approval.',special:'agents',future:true},
 {name:'Intelligence in the world',short:'Embodied AI',start:2040,end:2069,step:2,unit:'cycle',tag:'POSSIBLE FUTURE · FICTION',color:'#dfb394',icon:'bot',headline:'Move carefully. Build trust.',desc:'Bring systems into workshops and public spaces. Simulated success is only the start of physical validation.',mechanic:'Simulation gaps & fail-safe design',architectures:['Embodied controller','World-model planner'],tech:['Simulation validation','Safe shutdown','Field monitoring'],lesson:'This future is imagined. A simulated environment cannot capture every physical condition. A company that deploys robots would need field tests, maintenance, limits, and a safe response when sensors or plans fail.',question:'A robot succeeds in simulation. What is the next safe step?',answers:['Controlled physical testing with a safe stop','Unlimited public release','Remove human supervision immediately'],correct:0,explain:'Real conditions can differ from simulation. Controlled tests help discover gaps before wider use.',sources:['risk'],challenge:'Complete test-and-fix work and protect public trust.',special:'agents',future:true},
 {name:'Planetary intelligence',short:'Planetary systems',start:2070,end:2119,step:5,unit:'cycle',tag:'POSSIBLE FUTURE · FICTION',color:'#89bfbb',icon:'globe',headline:'Optimize for a living planet.',desc:'In this scenario, useful computation competes for energy, water, and shared infrastructure.',mechanic:'Energy limits & public benefit',architectures:['Distributed planning system','Efficient world model'],tech:['Resource accounting','Distributed resilience','Public-interest metrics'],lesson:'This is a fictional design problem. Useful AI still needs physical resources. Optimizing only a model score can ignore energy, water, and affected communities. Measure more than one outcome.',question:'Two systems give similar useful results. One uses much less energy. What should you compare?',answers:['Only parameter count','Only the marketing claim','Total resource use, reliability, and social impact'],correct:2,explain:'A whole-system comparison includes resources and people, not only a benchmark.',sources:['risk'],challenge:'Use clean power and improve cooling.',special:'energy',future:true},
 {name:'The long horizon',short:'The long horizon',start:2120,end:2199,step:10,unit:'cycle',tag:'POSSIBLE FUTURE · FICTION',color:'#bba6e5',icon:'orbit',headline:'Build something worth inheriting.',desc:'Across generations, protect knowledge and serve changing human needs. Your legacy is more than your balance sheet.',mechanic:'Long-term stewardship & succession',architectures:['Intergenerational knowledge system','Resilient intelligence network'],tech:['Knowledge preservation','Plural human oversight','Long-term resilience'],lesson:'This future is a thought experiment. Needs, institutions, and technologies can change over generations. A lasting company should make decisions understandable and correctable by the people who inherit them.',question:'Which legacy is strongest?',answers:['A system no one can question','Preserved knowledge, clear records, and accountable human control','A high score with no context'],correct:1,explain:'A useful legacy lets later people understand, review, and change what came before.',sources:['risk'],challenge:'Preserve trust and use resource-aware infrastructure.',special:'energy',future:true},
 {name:'Beyond the horizon',short:'Beyond 2200',start:2200,end:2500,step:25,unit:'cycle',tag:'OPEN-ENDED FUTURE · FICTION',color:'#baa7db',icon:'spark',headline:'The next chapter is yours.',desc:'Continue the company in an open-ended fictional future. There is no final intelligence score that settles every question.',mechanic:'Endless stewardship',architectures:['Adaptive knowledge network','Human-directed intelligence'],tech:['Institutional memory','Open-ended evaluation','Resilient infrastructure'],lesson:'No one can establish the detailed course of this distant future. This sandbox lets you explore competing values. Keep the company useful, solvent, resource-aware, and open to correction.',question:'What is the best reason to change a successful system?',answers:['New evidence shows it no longer serves people well','Change always helps','A competitor has a larger number'],correct:0,explain:'Good stewardship responds to evidence and changing needs, not only to scale.',sources:['risk'],challenge:'Continue to build a company worth trusting.',special:'energy',future:true}

const GLOSSARY = [
 ['Artificial intelligence (AI)','A broad field of methods for tasks such as learning, perception, reasoning, and planning. It is not one single technology.'],
 ['Large language model (LLM)','A language model with many learned parameters. It works with tokens and can generate text. Size alone does not ensure quality.'],
 ['Parameter','A value learned during training. Parameters are not database rows or exact copies of every fact.'],
 ['Token','A unit processed by a model. It can be a word part, punctuation mark, or other encoded unit. Tokens are not always words.'],
 ['Pretraining','The main learning stage on a broad dataset. Its objective may be to predict the next token.'],
 ['SFT','Supervised fine-tuning. Additional training on examples of desired behavior.'],
 ['RLHF','Reinforcement learning from human feedback. A family of methods that uses human feedback as a training signal.'],
 ['DPO','Direct preference optimization. A preference-training method that avoids a separate explicit reward-model training stage in its basic form.'],
 ['RAG','Retrieval-augmented generation. Relevant external material is retrieved and supplied to a model at answer time.'],
 ['Inference','Using a trained model to produce an output. It has ongoing compute, memory, and operating costs.'],
 ['Data leakage','Information from evaluation data or unavailable future data enters training or the decision process. It can make results misleading.'],
 ['Held-out set','Examples kept out of training and tuning for evaluation. Repeated tuning against a test set can still compromise it.'],
 ['Hallucination','A generated claim that is not supported by the relevant evidence. Fluent text can still be incorrect.'],
 ['Data drift','A change in input data or its distribution after a system is deployed. It can reduce useful performance.'],
 ['Quantization','Using lower-precision values to reduce memory or compute needs. It can change model quality and must be tested.'],
 ['Distillation','Training a smaller model using signals from a larger model. The result must be evaluated for the intended use.'],
 ['Latency','The time from a request to the relevant response. More reasoning steps or tool calls can increase latency.'],
 ['Unit economics','Revenue and variable costs for one unit of service. Positive revenue is not the same as positive profit.'],
 ['Gross margin','Revenue minus direct service costs, divided by revenue. It does not include every company expense.'],
 ['Runway','How many turns current cash can cover at the present net cash loss. It is an estimate, not a guarantee.'],
 ['Compute unit (CU)','A fictional capacity unit used only by this game. It is not a FLOP, a GPU, or a market price.'],
 ['Power unit','A fictional infrastructure unit. The energy display teaches limits but is not an engineering estimate.'],
 ['Alignment','Work to make model behavior better match intended goals and constraints. It does not establish perfect safety.'],
 ['Agent','A system that can select steps or tools using feedback. Its permissions and stopping conditions matter.']
];
function researchNodes(era) {
 return ERAS[era].tech.map((title,i)=>({id:`e${era}t${i}`,title,cost:18+i*14,cash:2000+i*1500,requires:i?`e${era}t${i-1}`:null,desc:[`Study the core method for this era. Unlocks new model work.`,`Improve experiments and product quality. +4 quality for new models in this era.`,`Apply the lesson to operations. +4 more quality for new models in this era.`][i]}));
}

const FOCUSABLE='button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])';
const safeMatches=(el,sel)=>{try{return el.matches(sel);}catch(e){return false;}};
function focusables(root){return root?[...root.querySelectorAll(FOCUSABLE)].filter(el=>el.getClientRects().length>0&&el!==office.renderer?.domElement&&!el.closest('.hidden')):[];}
function focusElement(el){if(!el)return false;el.focus({preventScroll:true});el.scrollIntoView?.({block:'nearest',inline:'nearest'});return true;}
/** What arrows, the D-pad and the stick can move between right now: the open dialog, or every visible part of the screen. */
function navRoots(){const c=$('#confirm-root .confirm-dialog');if(c)return [c];if(panel){const p=$('#modal-root .panel');return p?[p]:[];}return ['.sidebar','#topbar','.playground','#right-rail','.journey'].map(q=>$(q)).filter(Boolean);}
function focusInUi(){const el=document.activeElement;if(!el||el===document.body||el===office.renderer?.domElement)return false;return navRoots().some(r=>r.contains(el));}
/** Focus that came from Tab, the arrows or a controller (not from a click or a tap): arrows and A then move through the buttons. */
function uiFocused(){return focusInUi()&&(input.source==='gamepad'||safeMatches(document.activeElement,':focus-visible'));}
function focusKey(el){const d=el.dataset||{};return [el.tagName,el.id,d.do,d.ui,d.p,d.form,d.setting,d.policy,d.select,d.product,d.id].join('|');}
/** Re-rendering replaces buttons; keyboard and controller focus comes back to the same control afterwards. */
function snapFocus(){const el=document.activeElement;if(!el||el===document.body||el===office.renderer?.domElement)return null;if(input.source!=='gamepad'&&!safeMatches(el,':focus-visible'))return null;const sel=el.closest('#confirm-root')?'#confirm-root':el.closest('#modal-root')?'#modal-root':el.closest('#app')?'#app':null;if(!sel)return null;return {sel,key:focusKey(el),index:focusables($(sel)).indexOf(el)};}
function restoreFocus(snap){if(!snap)return;const ae=document.activeElement;if(ae&&ae!==document.body&&ae.isConnected)return;const list=focusables($(snap.sel));if(!list.length)return;focusElement(list.find(x=>focusKey(x)===snap.key)||list[Math.max(0,Math.min(list.length-1,snap.index))]);}
function moveFocus(direction){
 const candidates=navRoots().flatMap(r=>focusables(r));if(!candidates.length)return;
 const current=document.activeElement;if(!candidates.includes(current)){focusElement(candidates[0]);return;}
 const a=current.getBoundingClientRect(),vertical=direction==='down'||direction==='up';let best=null,bestScore=Infinity;
 for(const el of candidates){
  if(el===current)continue;const b=el.getBoundingClientRect();
  const along=vertical?(direction==='down'?1:-1)*(b.top+b.height/2-(a.top+a.height/2)):(direction==='right'?1:-1)*(b.left+b.width/2-(a.left+a.width/2));
  if(along<=4)continue;
  const gap=vertical?Math.max(0,b.left-a.right,a.left-b.right):Math.max(0,b.top-a.bottom,a.top-b.bottom);
  if(gap>along*1.8)continue;
  const score=along+gap*2.5+(vertical?Math.abs(b.left-a.left):Math.abs(b.top-a.top))*.05;
  if(score<bestScore){bestScore=score;best=el;}
 }
 if(best)focusElement(best);
}

function activateFocused(){const el=document.activeElement;if(!el||el===document.body||el===office.renderer?.domElement)return false;if(el.tagName==='SELECT')return stepField(el,1);if((el.tagName==='INPUT'&&el.type!=='checkbox')||el.tagName==='TEXTAREA')return true;el.click();return true;}

 if(learnTab==='glossary')return head+`<label class="field-label" for="glossary-search">Find a term</label><input class="search-input" id="glossary-search" placeholder="Try RAG, tokens, inference, or runway…" value="${esc(glossaryQuery)}"><div id="glossary-results" class="section">${glossaryHTML()}</div>`;
 if(learnTab==='sources')return head+`<div class="card soft"><h3>What this game teaches—and what it simplifies</h3><p>The chapters group overlapping methods for learning. A chapter date is not a claim that a method began or ended exactly then. The 1948 start is a fictional company founding date, before the 1956 Dartmouth workshop.</p><p>Historical chapters draw on the sources below. The 2025–2026 chapter teaches established methods and uses a compressed date range. It is not a complete record of every event through 2026.</p><p>Every chapter from 2027 onward is fiction. Model scores, costs, staff output, hardware capacity, power units, customer demand, and funding rules are simplified. No model is trained and no external AI service is called.</p><p>This is not a compliance checklist, real financial plan, or complete map of AI research. Biological, evolutionary, probabilistic, and symbolic methods have more depth than one game can show.</p></div><div class="grid2 section">${SOURCES.map(x=>`<div class="card source-card"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)} ↗</a><small>${esc(x.by)}</small><p>${esc(x.note)}</p></div>`).join('')}</div><div class="section">${note('The game makes no external requests: three.js r186 (MIT license) is served with this site. Source links open the web only when you select them. No account, API key, analytics, or paid service is used.')}</div>`;
 const e=ERAS[selectedEra],done=s.lessons.includes(selectedEra),result=lastQuiz?.era===selectedEra?lastQuiz:null;return head+`<div class="lesson-hero"><div class="between"><span class="eyebrow">CHAPTER ${String(selectedEra+1).padStart(2,'0')} · ${rangeLabel(selectedEra)}</span>${tag(e.future?'FICTIONAL FUTURE':e.tag,e.future?'gold-tag':'')}</div><h2>${esc(e.name)}</h2><p>${esc(e.mechanic)}</p></div>${e.future?note('This chapter is an imagined scenario. It is not a forecast or a statement of future fact.','warning'):''}<div class="lesson-copy section">${esc(e.lesson)}</div>${llmNotes[selectedEra]?`<div class="grid2 section">${llmNotes[selectedEra].map(([h,p])=>`<div class="card"><h4>${h}</h4><p>${p}</p></div>`).join('')}</div>`:''}<div class="card section"><div class="between"><h3>A decision to think through</h3>${tag(done?'FIELD NOTE COMPLETE':'+10 RP ON FIRST CORRECT ANSWER',done?'green-tag':'')}</div><p>${esc(e.question)}</p><div class="quiz-options">${e.answers.map((a,i)=>`<button class="quiz-option" data-ui="quiz" data-p='{"era":${selectedEra},"answer":${i}}'><span class="quiz-letter">${String.fromCharCode(65+i)}</span><span>${esc(a)}</span>${done&&i===e.correct?icon('check','sm'):''}</button>`).join('')}</div>${result?`<div class="quiz-result">${note(`${result.correct?'Correct.':'Try again.'} ${esc(e.explain)}`,result.correct?'good':'warning')}</div>`:done?`<div class="quiz-result">${note(esc(e.explain),'good')}</div>`:''}</div><div class="section"><h4>Read the evidence</h4>${e.sources.map(id=>{const source=SOURCES.find(x=>x.id===id);return source?`<a class="source-line" href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.title)} · ${esc(source.by)} ↗</a>`:'';}).join('')}</div><div class="actions">${selectedEra>0?ui('Previous chapter','lesson',{era:selectedEra-1},'button small'):''}${selectedEra<17?ui('Next chapter','lesson',{era:selectedEra+1},'button small','arrow'):''}${selectedEra===s.era?ui('Apply the idea','panel',{name:'research'},'button small primary','flask'):ui('Start a scenario here','scenario',{era:selectedEra},'button small primary')}</div>`;
}
function glossaryHTML(){const list=GLOSSARY.filter(([a,b])=>(a+' '+b).toLowerCase().includes(glossaryQuery.toLowerCase()));return list.length?list.map(([a,b])=>`<div class="glossary-entry"><h4>${esc(a)}</h4><p>${esc(b)}</p></div>`).join(''):note('No matching term. Try another word.');}
function renderBuild(){const d=derive(s);return `<div class="grid3">${stat('Campus spaces',`${s.rooms.length} / 12`,'Every room uses one floor space.')}${stat('Compute capacity',`${d.compute} <small>CU</small>`,'Shared by training and serving.')}${stat('Power use / capacity',`${d.powerUsed.toFixed(0)} / ${d.powerCapacity}`,d.cooling<1?'Overload slows training and serving.':'Your power capacity is sufficient.')}</div><div class="section">${note('Choose a room. Then select an empty floor space in the 3D office. You can also place rooms with the space buttons below. Room upgrades add capacity without using another space.')}</div><div class="grid3 section">${Object.entries(ROOM_TYPES).map(([key,r])=>{const locked=s.era<r.minEra;return `<div class="card build-card" style="--tile:${r.color}"><div class="tile-icon">${icon(r.icon)}</div><h3>${r.name}</h3><p>${r.desc}</p><div class="actions"><div><strong>${money(r.cost)}</strong><small>${money(r.upkeep)} / turn</small></div>${locked?`<span class="tag gray-tag">FROM ${ERAS[r.minEra].start}</span>`:ui('Place room','buildMode',{type:key},`button small ${key===buildType?'primary':''}`)}</div></div>`;}).join('')}</div><div class="section"><div class="section-title"><h3>Accessible floor plan</h3><span class="tiny muted">${buildType?`Placing: ${ROOM_TYPES[buildType].name}`:'Choose a room type to place.'}</span></div><div class="form-group"><label class="field-label" for="floor-type">Room type for the floor plan</label><select id="floor-type" data-select="buildType"><option value="">Select a room…</option>${Object.entries(ROOM_TYPES).filter(([,r])=>s.era>=r.minEra).map(([k,r])=>`<option value="${k}" ${buildType===k?'selected':''}>${r.name} · ${money(r.cost)}</option>`).join('')}</select></div><div class="slot-grid">${Array.from({length:12},(_,slot)=>{const room=s.rooms.find(r=>r.slot===slot);return `<button class="${room?'occupied':''}" data-ui="floorSlot" data-p='{"slot":${slot}}' aria-label="Space ${slot+1}: ${room?ROOM_TYPES[room.type].name:'empty'}"><strong>Space ${slot+1}</strong><br>${room?ROOM_TYPES[room.type].name:'Empty space'}</button>`;}).join('')}</div></div>`;}
function renderRoom(){const room=s.rooms.find(r=>r.slot===selectedSlot);if(!room)return empty('Room to grow.','This floor space is available. Choose a room to give it a purpose.','build','Choose a room');const r=ROOM_TYPES[room.type];return `<div class="lesson-hero"><span class="eyebrow">SPACE ${selectedSlot+1} · LEVEL ${room.level}</span><h2>${r.name}</h2><p>${r.desc}</p></div><div class="grid3">${stat('Level',`${room.level} / 3`,'Upgrades increase capacity and upkeep.')}${stat('Running cost',money(r.upkeep*room.level),'Per turn, before power and staff.')}${stat('Staff seats',`${(r.seats||0)*room.level}`,'Work capacity is shared by the company.')}</div><div class="actions section">${btn(`Upgrade · ${money(r.cost*.75)}`,'upgrade',{slot:selectedSlot},{cls:'primary',disabled:room.level>=3||s.cash<r.cost*.75,icon:'plus'})}${ui('Remove room','removeRoom',{slot:selectedSlot},'button danger')}</div><div class="section">${note('Removing a room returns 35% of its base cost per level. It must leave enough team seats. Finish model work before you remove infrastructure.')}</div>`;}
function renderHelp(){return `<div class="lesson-hero"><span class="eyebrow">WELCOME TO BRIGHT MINDS</span><h2>A little lab. A long horizon.</h2><p>You lead the company. Your team does the work. Start in 1948, or choose a later era from the atlas.</p></div><div class="stack">${[
 ['Read the field note','Learn the main idea for this era. Answer the question to earn research points.','learn'],
 ['Research the first method','Fund the first research card. Use “Next turn” twice to finish it.','research'],
 ['Prepare data before development','Clean your founding collection, then reserve a held-out split. Finish each task before the next.','data'],
 ['Build a small system','Open the Model lab. Choose a method and a small project. End turns until the work is complete.','models'],
 ['Test, then launch','Run an evaluation. Open Products, choose the pilot market, and launch at 25%. End a turn to see revenue and costs.','products'],
 ['Meet the chapter milestones','Complete the extra task for the era. Finish active work, then continue to the next chapter.','overview']
 ].map(([h,p,n],i)=>`<div class="card tutorial-step"><span class="step-number">${i+1}</span><div class="grow"><h3>${h}</h3><p>${p}</p></div>${ui('Open','panel',{name:n},'button small')}</div>`).join('')}</div><div class="grid2 section">${controlsCard()}<div class="card"><h3>How time works</h3><p>A turn advances company work once. Early chapters use years. LLM chapters use quarters or months. Future chapters use longer cycles.</p><p>Milestones control era progress. Time stops at a chapter’s last year until you continue. Costs are game values per turn, not historical prices.</p></div></div><div class="section">${note('Your game saves on this device after each action. Export a save in Settings to keep a separate copy or move to another device. No account or connection is needed.','good')}</div>`;}
function renderSettings(){return `<div class="card"><h3>Company identity</h3><div class="form-group section"><label class="field-label" for="company-name-input">Company name</label><input id="company-name-input" maxlength="32" minlength="2" value="${esc(s.name)}"></div>${ui('Save name','rename',{},'button small primary')}</div><div class="grid2 section"><div class="card"><h3>Your game, on your device.</h3><p>The game saves after each successful action. A downloaded save is a separate copy. Keep one before starting a new scenario.</p><div class="actions">${ui('Export save','export',{},'button small primary','download')}${ui('Import save','import',{},'button small','upload')}</div></div><div class="card"><h3>Start a new chapter</h3><p>Begin a fresh company in 1948, or open the atlas to choose another era. The current company is replaced only after confirmation.</p><div class="actions">${ui('New 1948 campaign','scenario',{era:0},'button small')}${ui('Choose an era','learnTab',{value:'atlas'},'button small')}</div></div></div><div class="card section"><h3>Graphics, sound & controls</h3><p>Quality, resolution, frame rate, and controller or touch options are shared by every 3D game on this site. Press F9 at any time.</p><div class="actions">${ui('Graphics & controls','kitMenu',{},'button small primary','settings')}${ui(sound.on?'Sound: on':'Sound: off','sound',{},'button small',sound.on?'sound':'mute')}</div><p class="tiny section">${kit?`${esc(kit.backendLabel)} · three.js r${THREE.REVISION}`:'The 3D view is unavailable in this browser.'}</p></div><div class="card section"><h3>View and recovery</h3><div class="actions">${ui('Reset camera','resetView',{},'button small')}${ui('Toggle room labels','labels',{},'button small')}${ui('Restore previous company','restoreBackup',{},'button small')}</div><p>A local backup is made before a new scenario or imported save replaces a company. Browser storage can be cleared. Export is the best way to keep your own copy.</p>${storageProblem||s.storageWarning?note('The browser cannot save this game here. Export a save now. A local file opened from a new path may use separate browser storage.','warning'):''}</div><div class="section">${note('Bright Minds v1.1 · Playable prototype. All characters and the company are fictional. The game makes no external requests. Built with three.js r186 on the shared 3D kit. Models, data, customers, and tests are simulated.')}</div>`;}
function confirmBox(title,body,fn){confirmAction=fn;$('#confirm-root').innerHTML=`<div class="confirm-overlay"><section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title"><h2 id="confirm-title">${esc(title)}</h2><p>${esc(body)}</p><div class="actions">${ui('Cancel','confirmNo',{},'button')}${ui('Continue','confirmYes',{},'button primary')}</div></section></div>`;$('#confirm-root [data-ui="confirmNo"]').focus();}
function replaceCompany(next){try{localStorage.setItem(SAVE_KEY+'-backup',serializeSave(s));}catch(e){}s=next;storageProblem=false;playing=false;buildType=null;selectedEra=s.era;selectedModel=null;productForms={};trainingForm={name:'',architecture:ERAS[s.era].architectures[0],scale:'balanced',method:'scratch'};lastReport=null;office.setCursor(null);office.setBuildMode(null);$('#build-hint').classList.add('hidden');closePanel();persist();refresh({rebuild:true,scroll:true});office.reset();toast(`Welcome to ${s.name}, ${ERAS[s.era].start}.`);}
function downloadSave(){const blob=new Blob([serializeSave(s)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${s.name.replace(/[^a-z0-9]+/gi,'-')}-${Math.floor(gameYear(s))}-save.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Save exported. Keep the file to restore this company later.');}
function startBuild(type,close=true){if(!ROOM_TYPES[type]||s.era<ROOM_TYPES[type].minEra)return;buildType=type;office.setBuildMode(type);$('#build-hint').innerHTML=`${icon(ROOM_TYPES[type].icon)}<span>Select an empty space for a <strong>${ROOM_TYPES[type].name.toLowerCase()}</strong> · ${money(ROOM_TYPES[type].cost)}</span>${ui('Cancel','cancelBuild',{},'button small')}`;$('#build-hint').classList.remove('hidden');if(input.source==='gamepad'&&office.cursorSlot==null){const free=[5,6,1,2,9,10,0,3,4,7,8,11].find(i=>!s.rooms.some(r=>r.slot===i));if(free!=null)office.setCursor(free);}updateViewHelp();if(close&&!office.failed)closePanel();else renderPanel();}
function cancelBuild(){buildType=null;office.setBuildMode(null);$('#build-hint').classList.add('hidden');}
function selectSlot(slot){if(buildType&&!s.rooms.some(r=>r.slot===slot)){const r=apply('build',{type:buildType,slot});if(r.ok)cancelBuild();return;}if(buildType&&s.rooms.some(r=>r.slot===slot)){toast('This space has a room. Choose an empty space.',true);return;}selectedSlot=slot;openPanel(s.rooms.some(r=>r.slot===slot)?'room':'build');}
function uiAction(action,p={}){switch(action){
 case 'panel': if(p.name==='learn'){learnTab='lesson';selectedEra=s.era;}openPanel(p.name);break;
 case 'close':closePanel();break;
 case 'play': if(s.event){openPanel('governance');toast('Resolve the decision before you run time.',true);}else if(s.cash<0){openPanel('finance');toast('Cash is below zero. Choose a recovery plan in Finance first.',true);}else{playing=!playing;turnClock=0;renderHUD();if(playing&&panel==='menu')closePanel();else if(panel==='menu')renderPanel();}break;
 case 'speed':speed=p.value;turnClock=0;renderHUD();if(panel==='menu')renderPanel();break;
 case 'rotate':office.rotate(Math.PI/4);break;
 case 'zoom':office.setZoom(p.value);break;
 case 'resetView':office.reset();break;
 case 'labels':toggleLabels();break;
 case 'lesson':beginPanel();selectedEra=p.era;learnTab='lesson';panel='learn';renderPanel();renderHUD();$('.panel-body').scrollTop=0;requestAnimationFrame(focusPanelStart);break;
 case 'learnTab':beginPanel();learnTab=p.value;panel='learn';renderPanel();renderHUD();$('.panel-body').scrollTop=0;requestAnimationFrame(focusPanelStart);break;
 case 'quiz':lastQuiz={era:p.era,correct:p.answer===ERAS[p.era].correct};if(apply('quiz',p,true).ok)sound.play('ok');persist();renderPanel();break;
 case 'scenario':confirmBox(`Start in ${ERAS[p.era].start}?`,'This starts a new company. Your current company will be replaced. A local backup is kept, but export a save to keep a separate file.',()=>replaceCompany(createGame(p.era)));break;
 case 'source':{const src=SOURCES.find(x=>x.id===p.id);if(src)window.open(src.url,'_blank','noopener,noreferrer');break;}
 case 'buildMode':startBuild(p.type);break;
 case 'cancelBuild':cancelBuild();break;
 case 'floorSlot':if(s.rooms.some(r=>r.slot===p.slot)){selectedSlot=p.slot;openPanel('room');}else if(buildType){const r=apply('build',{type:buildType,slot:p.slot});if(r.ok){cancelBuild();renderPanel();}}else toast('Select a room type above the floor plan first.',true);break;
 case 'removeRoom':confirmBox('Remove this room?','This removes the room and returns 35% of its base value per level. Running capacity will decrease.',()=>{const r=apply('removeRoom',p);if(r.ok)closePanel();});break;
 case 'startModel':{const result=apply('train',trainingForm);if(result.ok){trainingForm.name='';renderPanel();}break;}
 case 'cancelWork':confirmBox('Cancel model work?','The active model job will stop. Initial setup costs are not refunded.',()=>apply('cancelJob'));break;
 case 'archiveModel':confirmBox('Archive this model?','This removes the model from your assets. Pause a live product first. Export a save to keep a copy of this company state.',()=>apply('archive',p));break;
 case 'inspectModel':selectedModel=p.id;openPanel('models');setTimeout(()=>$('.model-card')?.scrollIntoView({block:'start'}),0);break;
 case 'modelProducts':selectedModel=p.id;openPanel('products');break;
 case 'rename':{const result=apply('rename',{name:$('#company-name-input')?.value||''});if(result.ok)office.rebuild(s);break;}
 case 'export':downloadSave();break;
 case 'import':$('#save-input').click();break;
 case 'restoreBackup':try{const raw=localStorage.getItem(SAVE_KEY+'-backup');if(!raw){toast('There is no previous-company backup on this device.',true);break;}const old=parseSave(raw);confirmBox('Restore the previous company?',`Restore ${old.name} in ${Math.floor(gameYear(old))}. The current company becomes the new backup.`,()=>replaceCompany(old));}catch(e){toast(`Backup could not be restored: ${e.message}`,true);}break;
 case 'confirmNo':confirmAction=null;$('#confirm-root').innerHTML='';if(panel)focusElement($('#panel-close'));break;
 case 'confirmYes':{const fn=confirmAction;confirmAction=null;$('#confirm-root').innerHTML='';fn?.();break;}
 case 'panelForce':openPanel(p.name,true);break;
 case 'kitMenu':if(kit)kit.menu.open();else toast('Graphics settings need the 3D view, which could not start here.',true);break;
 case 'sound':sound.set(!sound.on);sound.unlock();if(panel)renderPanel();break;
}}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-do],[data-ui]');if(!el||el.disabled)return;let p={};try{p=JSON.parse(el.dataset.p||'{}');}catch(e){return;}if(el.dataset.do)apply(el.dataset.do,p);else{if(!['panel','panelForce','close','lesson','learnTab','quiz','play','sound'].includes(el.dataset.ui))sound.play('tap');uiAction(el.dataset.ui,p);}});
document.addEventListener('click',ev=>{if(ev.target.classList.contains('overlay'))closePanel();});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.form){trainingForm[el.dataset.form]=el.value;}if(el.id==='glossary-search'){glossaryQuery=el.value;$('#glossary-results').innerHTML=glossaryHTML();}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.form){trainingForm[el.dataset.form]=el.value;if(el.dataset.form!=='name')renderPanel();}if(el.dataset.setting){const key=el.dataset.setting,value=Number(el.value),r=apply('setting',{key,value},true);if(r.ok&&r.message&&r.message!=='Operating setting updated.')toast(r.message);}if(el.dataset.policy)apply('policy',{key:el.dataset.policy,value:el.checked},true);if(el.dataset.select==='model'){selectedModel=el.value;renderPanel();}if(el.dataset.select==='buildType'){buildType=el.value||null;if(buildType)startBuild(buildType,false);else cancelBuild();}if(el.dataset.product){const f=productForms[el.dataset.id]||(productForms[el.dataset.id]={segment:'pilot',release:25});f[el.dataset.product]=el.dataset.product==='release'?Number(el.value):el.value;renderPanel();}});
$('#save-input').addEventListener('change',async ev=>{const file=ev.target.files?.[0];ev.target.value='';if(!file)return;try{if(file.size>2000000)throw new Error('The save file must be smaller than 2 MB.');const imported=parseSave(await file.text());confirmBox('Import this company?',`Replace the current company with ${imported.name} in ${Math.floor(gameYear(imported))}? A backup of your current game will be kept.`,()=>replaceCompany(imported));}catch(e){toast(`Save was not imported. ${e.message}`,true);}});
// Keep Tab inside an open dialog (the kit's own settings dialog manages its focus itself).
document.addEventListener('focusin',ev=>{if(kit?.menu?.isOpen||ev.target.closest?.('.kit-menu'))return;const dialog=$('#confirm-root .confirm-dialog')||$('#modal-root .panel');if(!dialog)return;if(dialog.contains(ev.target)){lastInside=ev.target;return;}const list=focusables(dialog);if(!list.length)return;(lastInside===list[0]?list.at(-1):list[0]).focus();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;renderHUD();}sound.pause(document.hidden||!!kit?.paused);});
window.addEventListener('beforeunload',()=>persist());
window.addEventListener('pagehide',()=>persist());
// Browsers only start audio after a real click or key press.
addEventListener('pointerdown',()=>sound.unlock(),true);
addEventListener('keydown',()=>sound.unlock(),true);
kit?.onPause(p=>sound.pause(p||document.hidden));
input.onSourceChange(src=>{document.documentElement.classList.toggle('pad-nav',src==='gamepad');if(src==='touch'&&office.cursorSlot!=null)office.setCursor(null);updateViewHelp();if(panel==='help'||panel==='menu')renderPanel();});

// ---- One step of play: the kit's actions drive the office, the panels and time.
/** Arrows / D-pad pick a floor space, Enter / A opens it, View jumps to the buttons. */
function cursorControls(dir){
 if(dir){office.moveCursor(dir);updateViewHelp();}
 if(input.pressed('confirm')){if(office.cursorSlot==null){office.setCursor(selectedSlot);updateViewHelp();}else selectSlot(office.cursorSlot);}
 if(input.pressed('focusUi'))focusUi();
}
/** Rotate, zoom, pan and camera shortcuts: available whenever no dialog is open. */
function cameraControls(dt){
 if(shortcut('rotL'))office.rotate(-Math.PI/4);
 if(shortcut('rotR'))office.rotate(Math.PI/4);
 if(shortcut('resetView'))office.reset();
 const zv=input.value('zoom');if(zv)office.setZoom(zv*1.1*dt,true);
 const lk=input.look('look');
 if(lk.x||lk.y){
  if(input.source==='gamepad')office.rotateNow(lk.x*.6);
  else if(input.down('pan')){const st=kit?kit.settings.get():{},k=1/(MOUSE_LOOK*(st.lookSensitivity||1));office.dragPan(lk.x*k,lk.y*k*(st.invertY?-1:1));}
  else office.rotateNow(lk.x*(input.source==='touch'?.008/TOUCH_LOOK:.008/MOUSE_LOOK));
 }
}
/** Clicks and taps on the office floor, hover highlight, wheel and pinch zoom. */
function pointerControls(){
 const p=input.pointer;
 if(p.justDown){pressX=p.x;pressY=p.y;pressMoved=false;pressGesture=false;if(office.cursorSlot!=null){office.setCursor(null);updateViewHelp();}}
 if(p.down&&!pressMoved&&Math.abs(p.x-pressX)+Math.abs(p.y-pressY)>6)pressMoved=true;
 const z=input.zoom();if(z){if(p.down)pressGesture=true;office.setZoom(z*.075,input.source==='touch');}
 if(p.justUp&&!pressMoved&&!pressGesture){const slot=office.pick(p.nx,p.ny);if(slot!=null)selectSlot(slot);}
 if(p.type==='mouse'&&p.over&&!p.down){if(p.x!==hoverX||p.y!==hoverY){hoverX=p.x;hoverY=p.y;office.setHover(office.pick(p.nx,p.ny));}}
 else if(!p.over&&office.hoverSlot!=null){office.setHover(null);hoverX=hoverY=-1;}
}
/** Running time ends a turn every 6 s at 1× (3 s at 2×, 1.5 s at 4×), paused by any open panel or decision. */
function autoTurn(dt,confirmOpen){
 if(!playing||panel||s.event||confirmOpen||document.hidden){turnClock=0;return;}
 turnClock+=dt;if(turnClock>=6/speed){turnClock=0;const r=apply('turn',{},true);if(!r.ok){playing=false;renderHUD();}}
}
function updateTurnMeter(){const q=playing&&!panel&&!s.event?Math.round(Math.min(1,turnClock/(6/speed))*40):0;if(q===meterShown)return;meterShown=q;const el=$('#turn-meter');if(el)el.style.transform=`scaleX(${q/40})`;}
const MODIFIERS=['ControlLeft','ControlRight','MetaLeft','MetaRight','AltLeft','AltRight'];
/** A game shortcut: skipped while Ctrl, Cmd or Alt is held, so browser shortcuts (Ctrl+N, Cmd+R, Ctrl+P) never also act in the game. */
function shortcut(name){return input.pressed(name)&&!MODIFIERS.some(k=>input.keys?.has(k));}
function step(dt){
 clockMs+=dt*1000;
 const confirmOpen=!!$('#confirm-root').firstElementChild;
 if(shortcut('menu')){if(!confirmOpen){if(panel==='menu')closePanel();else openPanel('menu');}}
 else if(input.pressed('back'))handleBack();
 if(!confirmOpen){
  if(shortcut('turn'))nextTurn();
  if(shortcut('build'))openPanel('build');
  if(shortcut('research'))openPanel('research');
  if(shortcut('help'))openPanel('help');
  if(shortcut('navPrev'))cyclePanel(-1);
  if(shortcut('navNext'))cyclePanel(1);
  if(!panel&&shortcut('play'))uiAction('play');
 }
 const modal=confirmOpen||!!panel,dir=navStep(clockMs);
 if(modal||uiFocused()){
  if(dir&&!((dir==='left'||dir==='right')&&stepField(document.activeElement,dir==='right'?1:-1)))moveFocus(dir);
  if(input.pressed('confirm'))activateFocused();
  if(!modal&&input.pressed('focusUi'))blurUi();
  if(panel){const sv=input.value('zoom');if(sv){const b=$('#modal-root .panel-body');if(b)b.scrollTop-=sv*900*dt;}}
 }else cursorControls(dir);
 if(!modal){cameraControls(dt);pointerControls();}
 autoTurn(dt,confirmOpen);
 updateTurnMeter();
}

refresh({scroll:true});
if(initialWarning)toast(initialWarning,true);else persist();
// Read-only diagnostics let automated tests check real state without a hidden cheat menu.
window.BrightMinds={version:'1.1.0',getState:()=>JSON.parse(serializeSave(s)).state,getMetrics:()=>derive(s),getView:()=>({webgl:!office.failed,backend:kit?.backend||null,drawCalls:office.renderer?.info.render.calls,triangles:office.renderer?.info.render.triangles,era:s.era,panel}),exportSave:()=>serializeSave(s)};

// Side by side: play runs from the hub's go until time-up or end; the score is the company's net funds.
let hubOver=false;
function hubTick(dt){
 if(!hubInfo)return step(dt);
 if(hubOver||AIHub.time()<0)return;
 step(dt);
 AIHub.progress({score:Math.round(s.cash-s.debt),label:`Chapter ${s.era+1} · ${dateLabel(s)}`});
}
if(hubInfo){
 AIHub.on('time-up',()=>{if(hubOver)return;hubOver=true;AIHub.result({score:Math.round(s.cash-s.debt)});});
 AIHub.on('end',()=>{hubOver=true;playing=false;sound.pause(true);});
 AIHub.ready();
}
if(kit){
 // The office is drawn when something changed (camera, rooms, size), and at 30 fps while time runs.
 let lastRatio=0,animClock=0;
 kit.start(dt=>{
  hubTick(dt);
  office.update(dt);
  const ratio=kit.renderer.getPixelRatio();if(ratio!==lastRatio){lastRatio=ratio;office.dirty=true;}
  animClock+=dt;
  if(office.dirty||(office.animating&&animClock>=1/30)){animClock=0;office.render();}
 });
}else{
 let last=performance.now();
 setInterval(()=>{const t=performance.now();hubTick(Math.min(.25,(t-last)/1000));last=t;},100);
}
</script></body></html>
