const map=document.getElementById('map'),vp=document.getElementById('viewport'),detail=document.getElementById('detail'),results=document.getElementById('results');
let V={x:0,y:0,w:M.width,h:M.height};let selected=null;let drag=null;let moved=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rect=()=>vp.getBoundingClientRect();
function apply(){map.setAttribute('viewBox',`${V.x} ${V.y} ${V.w} ${V.h}`);document.getElementById('zoomRead').textContent=Math.round(rect().width/V.w*100)+'%'}
function fitBox(b){let R=rect(),aspect=R.width/R.height;let w=b.w+60,h=b.h+60;if(w/h<aspect)w=h*aspect;else h=w/aspect;V={x:b.x+b.w/2-w/2,y:b.y+b.h/2-h/2,w,h};apply()}
function fit(){fitBox({x:0,y:0,w:M.width,h:M.height})}
function gotoStart(b){let aspect=rect().width/rect().height;V={x:b[0],y:b[1],w:b[2],h:b[2]/aspect};apply()}
function zoom(f,cx,cy){const R=rect();cx=cx??R.width/2;cy=cy??R.height/2;let nw=Math.max(220,Math.min(M.width*2,V.w*f)),scale=nw/V.w;let ax=V.x+cx/R.width*V.w,ay=V.y+cy/R.height*V.h;V={x:ax-(ax-V.x)*scale,y:ay-(ay-V.y)*scale,w:nw,h:V.h*scale};apply()}
function reveal(){document.body.classList.remove('hidden-side','mobile-closed')}
function sources(keys){return (keys||'Q').split(',').map(k=>M.data.sources[k]?`<a href="${esc(M.data.sources[k].url)}" target="_blank" rel="noopener">[${esc(k)}] ${esc(M.data.sources[k].path)}</a>`:'').join('<br>')}
function field(title,value){return value?`<h3>${esc(title)}</h3><pre>${esc(value)}</pre>`:''}
function selectAction(id,focus=false){let r=M.actions[id];if(!r)return;selected=id;map.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));const node=map.querySelector(`[data-id="${CSS.escape(id)}"]`);if(node)node.classList.add('selected');let a=r.data;let flags=[...(r.kind==='main'||r.quest==='CROSS'?[]:[r.common_output]),...(a.flags||[])].filter(Boolean);flags=[...new Set(flags)];reveal();detail.innerHTML=`<span class="section-tag">${esc(r.quest)} / ${esc(r.stage)}</span><h2>${esc(a.label)}</h2><code>${esc(id)}</code><button class="navbtn" id="focusAction">Zoom to this action</button><button class="navbtn" id="focusStage">Show its stage</button>`+field('Scene',a.scene||M.cards[r.stage]?.data.scene)+field('Stage requirements',r.common_required)+field('Additional action requirements',a.needs||'No additional condition in this action.')+field('Flags set to true',flags.join('\n').replaceAll('\\n','\n'))+field('Markers added',(a.markers||[]).join('\n').replaceAll('\\n','\n'))+field('Faction changes',Object.entries(a.reputation||{}).map(([k,v])=>`${k} ${v>=0?'+':''}${v}`).join('\n').replaceAll('\\n','\n'))+field('Items',a.items)+field('Ending identity',a.ending)+(a.note?`<h3>Source note</h3><p>${esc(a.note)}</p>`:'')+`<h3>Fixed-revision source</h3><p class="muted">${sources(r.source)}</p><p class="warning">Faction values are changes, not final standing. Ambient effects and travel costs are outside this quest map.</p>`;document.getElementById('focusAction').onclick=()=>fitBox(r);document.getElementById('focusStage').onclick=()=>fitBox(M.cards[r.stage]);if(focus)fitBox(r)}
function stageInfo(id,focus=true){let r=M.cards[id];if(!r)return;let s=r.data;reveal();detail.innerHTML=`<span class="section-tag">${esc(r.quest||'MAP')}</span><h2>${esc(s.title||id)}</h2>`+field('Scene',s.scene)+field('Requirements',s.required)+field('Stage output',s.output)+(s.note?`<p class="warning">${esc(s.note)}</p>`:'')+(s.notes?'<p>'+s.notes.map(esc).join('</p><p>')+'</p>':'')+(s.actions||[]).map(a=>`<button class="navbtn" data-action="${esc(a.id)}"><strong>${esc(a.label)}</strong><code>${esc(a.id)}</code></button>`).join('')+`<h3>Source</h3><p class="muted">${sources(s.source)}</p>`;detail.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>selectAction(b.dataset.action,true));if(focus)fitBox(r)}
function home(){detail.innerHTML=`<span class="section-tag">READING GUIDE</span><h2>Start with a quest</h2><p>Use the jump menu to open the first stage at a readable scale. Select an action to inspect its exact state changes.</p><div class="facts"><strong>All 11 quest lines are on this canvas.</strong><br>The first row is the continental campaign. The next rows contain five local quests and five intrigue quests. The lower section maps shared-state access.</div><div class="key"><span class="swatch"></span>Solid: required quest state</div><div class="key"><span class="swatch purple"></span>Dashed: shared marker or reputation</div><div class="key"><span class="swatch gray"></span>Dotted: journal order, not a world gate</div><div class="key"><span class="swatch amber"></span>Amber: defined but not connected</div><h3>Important limits</h3><p class="warning">The three continental endings are defined, but no world action that selects them was found. Generic travel rooms and unrelated systems are collapsed.</p><p>Only actual action-level faction changes are shown. Declared stage rewards are not automatically granted.</p><h3>Quick access</h3>`+M.data.quests.map(q=>`<button class="navbtn" data-quest="${q.id}"><strong>${esc(q.id+' '+q.title)}</strong></button>`).join('')+`<button class="navbtn" data-quest="CROSS"><strong>Cross-province access</strong></button><p class="muted">Revision ${esc(M.data.revision)}<br>Static source review; no new full campaign playthrough.</p>`;detail.querySelectorAll('[data-quest]').forEach(b=>b.onclick=()=>gotoQuest(b.dataset.quest))}
function gotoQuest(qid){let p=M.panels[qid];if(!p)return;gotoStart(p);let q=M.data.quests.find(q=>q.id===qid);if(q){if(q.kind==='main'){stageInfo('M1',false);gotoStart([M.cards.M1.x-25,M.cards.M1.y-55,M.cards.M1.w+50,1000])}else stageInfo(q.stages[0].id,false)}else stageInfo('GS',false)}
let jump=document.getElementById('jump');M.data.quests.forEach(q=>{let op=document.createElement('option');op.value='Q:'+q.id;op.textContent=q.id+' '+q.title;jump.appendChild(op);q.stages.forEach(s=>{let o=document.createElement('option');o.value='S:'+s.id;o.textContent='   '+s.id+' — '+s.title;jump.appendChild(o)})});let op=document.createElement('option');op.value='Q:CROSS';op.textContent='Cross-province dependencies';jump.appendChild(op);jump.onchange=()=>{let[t,id]=jump.value.split(':');if(t==='Q')gotoQuest(id);else if(t==='S')stageInfo(id)};
document.getElementById('fit').onclick=fit;document.getElementById('plus').onclick=()=>zoom(.72);document.getElementById('minus').onclick=()=>zoom(1.38);document.getElementById('toggleSide').onclick=()=>{if(innerWidth<=650)document.body.classList.toggle('mobile-closed');else document.body.classList.toggle('hidden-side');setTimeout(()=>{V.h=V.w*rect().height/rect().width;apply()},0)};document.getElementById('closeSide').onclick=()=>document.body.classList.add('mobile-closed');
map.addEventListener('wheel',e=>{e.preventDefault();const r=rect();zoom(Math.exp(e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});map.addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;drag={x:e.clientX,y:e.clientY,v:{...V},target:e.target};moved=false;map.setPointerCapture(e.pointerId);map.classList.add('dragging')});map.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4)moved=true;let r=rect();V.x=drag.v.x-dx/r.width*drag.v.w;V.y=drag.v.y-dy/r.height*drag.v.h;apply()});map.addEventListener('pointerup',e=>{if(!drag)return;let t=drag.target;if(!moved){let a=t.closest('.action-node');if(a)selectAction(a.dataset.id);else {let c=t.closest('.stage-card');if(c)stageInfo(c.dataset.id,false)}}drag=null;map.classList.remove('dragging')});map.addEventListener('pointercancel',()=>{drag=null;map.classList.remove('dragging')});map.addEventListener('keydown',e=>{if(e.key==='Enter'){let a=e.target.closest('.action-node');if(a)selectAction(a.dataset.id)}});
const index=[...Object.entries(M.cards).map(([id,r])=>({id,type:'stage',title:r.data.title||id,text:JSON.stringify(r.data).toLowerCase()})),...Object.entries(M.actions).map(([id,r])=>({id,type:'action',title:r.data.label,text:JSON.stringify(r).toLowerCase()}))];let matches=[];
function runSearch(){let v=document.getElementById('search').value.trim().toLowerCase();results.innerHTML='';if(!v)return;reveal();matches=index.filter(r=>r.text.includes(v));results.innerHTML=`<h3>${matches.length} matches</h3>`+matches.slice(0,25).map((r,i)=>`<button data-result="${i}"><strong>${esc(r.title)}</strong><br><code>${esc(r.id)}</code></button>`).join('')+(matches.length>25?'<p class="muted">Refine the search to show fewer matches.</p>':'');results.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>openResult(matches[+b.dataset.result]))}
function openResult(r){if(r.type==='action')selectAction(r.id,true);else stageInfo(r.id)}document.getElementById('search').addEventListener('input',runSearch);document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'&&matches.length)openResult(matches[0])});document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='+')zoom(.75);else if(e.key==='-')zoom(1.33);else if(e.key==='0')fit();else if(e.key==='/'){e.preventDefault();document.getElementById('search').focus()}});window.addEventListener('resize',()=>{V.h=V.w*rect().height/rect().width;apply()});home();requestAnimationFrame(fit);if(innerWidth<=650)document.body.classList.add('mobile-closed');
</script></body></html>
