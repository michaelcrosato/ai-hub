<!--
Star Furrow — an original spiritual successor to Starfox 64 (N64)

SOURCE INFORMATION
- Date: 2026-10-20 19:15
- Source: Starfox 64 for N64
- Tech: Three.js r180 (three/webgpu WebGPURenderer, TSL node materials, PostProcessing + BloomNode) · Rapier 0.19.3 (@dimforge/rapier3d-compat, WASM) · Web Audio API (fully procedural SFX, engine, voice babble and sequenced music) · Gamepad API (DualSense-first, with rumble) · vanilla ES-module JavaScript + DOM/CSS UI · single HTML file, dependencies from the jsDelivr CDN via an import map
- Art Direction: Stylized cel-shading: 4-band toon gradient ramp on MeshToonNodeMaterial, inverted-hull ink outlines (smooth-normal hull geometry), flat gradient skies, additive particle bursts, soft bloom, chunky ink-outlined UI.
- Animation: Procedural, code-driven animation: damped-spring steering and banking, sinusoidal rigs on named model parts (wings, flames, legs, turrets, boss plates), per-enemy state machines, Rapier rigid-body debris, CSS keyframes for HUD/UI.
- Testing: The prompt said: "Write no tests, do no tests, testing will be done separately." No tests or play-throughs were written or run; the only check was a syntax-only parse (node - -check) of the bundled script as a build step, and CDN file paths were confirmed to exist. The game has never been executed by its author. Performance and FPS were declared out of scope.
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-sonnet-5-5, reasoning effort medium
- Usage: unknown (no token or cost counters were exposed to the session)

ENGINE FEEDBACK
- What did you like most about the engine?
  Three.js TSL and the ready-made node materials: MeshToonNodeMaterial gave real cel-shading in a few lines, and TSL let me write the sky gradient and the ink-outline vertex push without hand-written shaders. Rapier's query pipeline (intersectionsWithShape) was a perfect fit for swept shot tests, pickups and ramming.
- Did you get stuck or guess wrong?
  Yes — because testing was forbidden, every API detail was recalled from memory or checked against the CDN type files: the Rapier package has no rapier.es.js (it is rapier.mjs), PostProcessing/BloomNode import paths, per-instance colour on InstancedMesh with node materials, and whether mutating the Rapier world inside a query callback is safe (it is not, so hits are gathered first).
- What was the most important thing you had to build yourself?
  The whole game framework on top of the renderer: the rail runtime and distance-keyed event timeline, entity/AI/boss systems, lock-on charge shots, controller-first menu navigation with glyph switching, and the entire procedural audio + music engine.
- What was the hardest part about using the engine?
  Cel-shaded outlines. The WebGPU renderer has no drop-in OutlineEffect, so I built inverted-hull outlines with merged-vertex smooth normals, and had to manage unique-geometry disposal for streamed scenery.
- If you had to remove or overhaul one thing from engine, what would that be?
  The split between three, three/webgpu and three/tsl entry points plus the addons that only work with one of them — it is easy to import the wrong build, and the naming (PostProcessing, later renamed) is unstable.
- If you could change one thing about the engine, what would it be?
  A first-class, documented TSL toon/outline pipeline (cel ramp, edge detection or hull outlines) for WebGPURenderer.

PROMPT FEEDBACK
- What did you like most about this prompt?
  The "feature-complete vertical slice" framing with concrete reference demos, the 10-foot controller-first philosophy, and the very specific quirks (attract mode after 10 s, invert-axis toggles, touch-only message) that turn into checkable features.
- What was confusing?
  The [PROMPT] placeholder under Prompt Feedback is empty; "SOURCE" is used as a variable in several places; "Dependencies that can be downloaded do not have to be included" sits next to "single html file"; and "Usage" cost/tokens cannot be known from inside the session.
- What was the hardest thing to do?
  Delivering a very large game with no testing allowed: balance, camera feel and API correctness all had to be reasoned out blind.
- If there was one test you could have run, what would that test be?
  A headless Chromium WebGPU smoke test: load the file, let attract mode run for 60 seconds across both stages, fail on any console error, and screenshot the title, a mid-stage frame and a boss frame.
-->

// ===== 01_input: unified controller-first input (Gamepad API primary, keyboard/mouse mapped onto it) =====
const KEYMAP = {
  up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'], left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
  fire: ['Space', 'KeyJ'], bomb: ['KeyK', 'KeyX'], boost: ['ShiftLeft', 'ShiftRight'],
  brake: ['ControlLeft', 'ControlRight', 'KeyC'], rollL: ['KeyQ'], rollR: ['KeyE'],
  confirm: ['Enter', 'Space', 'KeyJ'], back: ['Escape', 'Backspace'], pause: ['Escape', 'KeyP'], skip: ['Tab'],
};
const PADMAP = {
  fire: [0], bomb: [1, 2], boost: [7], brake: [6], rollL: [4], rollR: [5],
  confirm: [0], back: [1], pause: [9], up: [12], down: [13], left: [14], right: [15], skip: [3],
};
const GLYPHS = {
  ps: { confirm: '✕', back: '○', fire: '✕', bomb: '○', boost: 'R2', brake: 'L2', roll: 'L1 / R1', pause: 'OPTIONS', move: 'Left Stick', skip: '△', rollL: 'L1', rollR: 'R1' },
  xbox: { confirm: 'A', back: 'B', fire: 'A', bomb: 'B', boost: 'RT', brake: 'LT', roll: 'LB / RB', pause: 'MENU', move: 'Left Stick', skip: 'Y', rollL: 'LB', rollR: 'RB' },
  kb: { confirm: 'Enter', back: 'Esc', fire: 'Space', bomb: 'K', boost: 'Shift', brake: 'Ctrl', roll: 'Q / E', pause: 'Esc', move: 'WASD / Arrows', skip: 'Tab', rollL: 'Q', rollR: 'E' },
};

const Input = {
  keys: new Set(),
  mouseBtn: [false, false, false],
  h: new Set(), prevH: new Set(),
  move: { x: 0, y: 0 },        // y positive = up
  rawStick: { x: 0, y: 0 },
  device: 'kb',                // 'kb' | 'ps' | 'xbox'
  padConnected: false,
  padId: '',
  lastActivity: performance.now(),
  activity: false,             // any "real" input since last frame
  anyKeyboard: false,
  navHold: {}, navFire: new Set(),
  tapTime: { '-1': -9, '1': -9 }, tapPrevSide: 0,
  rollQueue: 0,                // -1 left, 1 right, 0 none (consumed by gameplay)
  boostAxis: 0, brakeAxis: 0,
  pad: null,

  init() {
    addEventListener('keydown', (e) => {
      if (e.repeat) { if (this.isGameKey(e.code)) e.preventDefault(); return; }
      this.keys.add(e.code); this.anyKeyboard = true; this.device = this.device === 'kb' ? 'kb' : 'kb';
      this.markActivity();
      if (this.isGameKey(e.code)) e.preventDefault();
      Sfx.resume();
    });
    addEventListener('keyup', (e) => { this.keys.delete(e.code); });
    addEventListener('blur', () => { this.keys.clear(); this.mouseBtn = [false, false, false]; });
    addEventListener('mousedown', (e) => { this.mouseBtn[e.button] = true; this.markActivity(); Sfx.resume(); });
    addEventListener('mouseup', (e) => { this.mouseBtn[e.button] = false; });
    addEventListener('contextmenu', (e) => e.preventDefault());
    let lx = 0, ly = 0;
    addEventListener('mousemove', (e) => { if (Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly) > 6) { this.markActivity(); } lx = e.clientX; ly = e.clientY; });
    addEventListener('wheel', () => this.markActivity(), { passive: true });
    addEventListener('touchstart', () => { this.markActivity(); }, { passive: true });
    addEventListener('gamepadconnected', (e) => { this.padConnected = true; this.setPadDevice(e.gamepad); this.markActivity(); });
    addEventListener('gamepaddisconnected', () => { this.padConnected = false; });
  },
  isGameKey(c) { return /^(Arrow|Space|Tab|Enter|Escape)/.test(c) || ['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(c); },
  markActivity() { this.activity = true; this.lastActivity = performance.now(); },
  setPadDevice(p) {
    this.padId = p.id || '';
    this.device = /xbox|xinput|microsoft/i.test(this.padId) ? 'xbox' : 'ps';
  },
  dz(v) {
    const d = S().deadzone;
    const a = Math.abs(v);
    if (a < d) return 0;
    return Math.sign(v) * (a - d) / (1 - d);
  },

  // Called once per frame, before the game update.
  poll(dt) {
    this.prevH = this.h;
    const h = new Set();
    // --- gamepad
    let pad = null;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of pads) { if (p && p.connected) { pad = p; break; } }
    this.pad = pad;
    let sx = 0, sy = 0, dpadX = 0, dpadY = 0;
    if (pad) {
      if (!this.padConnected) { this.padConnected = true; this.setPadDevice(pad); }
      const b = pad.buttons;
      for (const act in PADMAP) {
        for (const i of PADMAP[act]) { if (b[i] && (b[i].pressed || b[i].value > 0.4)) { h.add(act); } }
      }
      this.boostAxis = b[7] ? b[7].value : 0; this.brakeAxis = b[6] ? b[6].value : 0;
      sx = this.dz(pad.axes[0] || 0); sy = this.dz(pad.axes[1] || 0);
      // radial deadzone on the pair
      const mag = Math.hypot(pad.axes[0] || 0, pad.axes[1] || 0);
      if (mag < S().deadzone) { sx = 0; sy = 0; }
      // Settings: the intermittent inverted-stick workaround
      if (S().invertH) sx = -sx;
      if (S().invertV) sy = -sy;
      sy = -sy; // pad axis down is +; make up positive
      if (h.has('left')) dpadX -= 1; if (h.has('right')) dpadX += 1;
      if (h.has('up')) dpadY += 1; if (h.has('down')) dpadY -= 1;
      // activity detection
      let act = false;
      for (let i = 0; i < b.length; i++) if (b[i].pressed) act = true;
      if (Math.abs(pad.axes[0]) > 0.5 || Math.abs(pad.axes[1]) > 0.5) act = true;
      if (act) { this.markActivity(); this.setPadDevice(pad); Sfx.resume(); }
    } else { this.boostAxis = 0; this.brakeAxis = 0; }
    this.rawStick.x = sx; this.rawStick.y = sy;

    // --- keyboard / mouse
    let kx = 0, ky = 0;
    for (const act in KEYMAP) {
      for (const c of KEYMAP[act]) if (this.keys.has(c)) h.add(act);
    }
    if (this.mouseBtn[0]) h.add('fire');
    if (this.mouseBtn[2]) h.add('bomb');
    if (this.keys.has(KEYMAP.left[0]) || this.keys.has(KEYMAP.left[1])) kx -= 1;
    if (this.keys.has(KEYMAP.right[0]) || this.keys.has(KEYMAP.right[1])) kx += 1;
    if (this.keys.has(KEYMAP.up[0]) || this.keys.has(KEYMAP.up[1])) ky += 1;
    if (this.keys.has(KEYMAP.down[0]) || this.keys.has(KEYMAP.down[1])) ky -= 1;
    if (this.keys.size && !pad) this.device = 'kb';
    else if (this.keys.size && this.activityKeyboardRecent()) this.device = 'kb';

    let mx = clamp(sx + dpadX + kx, -1, 1), my = clamp(sy + dpadY + ky, -1, 1);
    if (this.boostAxis > 0.4) h.add('boost');
    if (this.brakeAxis > 0.4) h.add('brake');
    this.move.x = mx; this.move.y = my;
    this.h = h;

    // --- double-tap roll detection (stick or keys)
    const now = performance.now() / 1000;
    const side = mx > 0.85 ? 1 : mx < -0.85 ? -1 : 0;
    if (side !== 0 && side !== this.tapPrevSide) {
      if (now - this.tapTime[side] < 0.28) { this.rollQueue = side; this.tapTime[side] = -9; } else this.tapTime[side] = now;
    }
    this.tapPrevSide = side;
    if (this.pressed('rollL')) this.rollQueue = -1;
    if (this.pressed('rollR')) this.rollQueue = 1;

    // --- menu navigation with auto-repeat (stick, d-pad, keys)
    this.navFire.clear();
    const dirs = {
      up: h.has('up') || sy > 0.6, down: h.has('down') || sy < -0.6,
      left: h.has('left') || sx < -0.6, right: h.has('right') || sx > 0.6,
    };
    for (const d in dirs) {
      if (dirs[d]) {
        const st = this.navHold[d];
        if (st === undefined) { this.navHold[d] = 0.42; this.navFire.add(d); }
        else { this.navHold[d] = st - dt; if (this.navHold[d] <= 0) { this.navHold[d] = 0.09; this.navFire.add(d); } }
      } else delete this.navHold[d];
    }
  },
  activityKeyboardRecent() { return performance.now() - this.lastActivity < 3000; },
  held(a) { return this.h.has(a); },
  pressed(a) { return this.h.has(a) && !this.prevH.has(a); },
  released(a) { return !this.h.has(a) && this.prevH.has(a); },
  nav(d) { return this.navFire.has(d); },
  consumeRoll() { const r = this.rollQueue; this.rollQueue = 0; return r; },
  consumeActivity() { const a = this.activity; this.activity = false; return a; },
  idleSeconds() { return (performance.now() - this.lastActivity) / 1000; },
  glyph(a) { return (GLYPHS[this.device] || GLYPHS.kb)[a] || a; },
  rumble(strong, weak, ms) {
    if (!S().rumble || !this.pad) return;
    const act = this.pad.vibrationActuator;
    if (!act || !act.playEffect) return;
    try { act.playEffect('dual-rumble', { startDelay: 0, duration: ms, strongMagnitude: clamp(strong, 0, 1), weakMagnitude: clamp(weak, 0, 1) }); } catch (e) { /* unsupported */ }
  },
  hasController() { return !!this.pad; },
};

const Sfx = {
  ctx: null, engine: null, charge: null, voiceTimer: 0,
  init() {
    if (this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const c = this.ctx = new C();
    this.master = c.createGain();
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -14; this.comp.ratio.value = 6;
    this.master.connect(this.comp); this.comp.connect(c.destination);
    this.sfxBus = c.createGain(); this.musicBus = c.createGain(); this.voiceBus = c.createGain();
    this.sfxBus.connect(this.master); this.musicBus.connect(this.master); this.voiceBus.connect(this.master);
    const len = c.sampleRate * 2; const buf = c.createBuffer(1, len, c.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    this.applyVolumes();
    Settings.listeners.push(() => this.applyVolumes());
  },
  resume() {
    this.init();
    if (this.ctx && this.ctx.state !== 'running') this.ctx.resume();
  },
  applyVolumes() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(S().masterVol, t, 0.02);
    this.sfxBus.gain.setTargetAtTime(S().sfxVol, t, 0.02);
    this.musicBus.gain.setTargetAtTime(S().musicVol * 0.55, t, 0.02);
    this.voiceBus.gain.setTargetAtTime(S().voiceVol, t, 0.02);
  },
  ok() { return this.ctx && this.ctx.state === 'running'; },
  // oscillator with pitch sweep + envelope

    if (!this.ok()) return;
    const c = this.ctx; const t = c.currentTime + (o.delay || 0);
    const g = c.createGain(); const osc = c.createOscillator();
    osc.type = type; osc.frequency.setValueAtTime(Math.max(20, f0), t);
    if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const a = o.attack || 0.004;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a);

    let node = osc;
    if (o.filter) { const f = c.createBiquadFilter(); f.type = o.filter; f.frequency.value = o.ff || 1000; f.Q.value = o.q || 1; osc.connect(f); node = f; }
    node.connect(g); g.connect(o.bus || this.sfxBus);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  noise(dur, vol, ftype, f0, f1, q = 1, o = {}) {

    const c = this.ctx; const t = c.currentTime + (o.delay || 0);
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = ftype; f.Q.value = q;
    f.frequency.setValueAtTime(Math.max(20, f0), t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.bus || this.sfxBus);
    src.start(t, Math.random()); src.stop(t + dur + 0.05);

const Music = {

    if (!Sfx.ctx) return;

  },
  stop() { this.stopped = true; this.name = ''; clearInterval(this.timer); },
  tick() {
    const c = Sfx.ctx; if (!c || c.state !== 'running' || !this.track) { if (c && this.track) this.next = c.currentTime + 0.1; return; }
    const sd = 60 / this.track.bpm / 4;
    while (this.next < c.currentTime + 0.25) { this.sched(this.step, this.next, sd); this.next += sd; this.step++; }
  },
  sched(step, t, sd) {

    const bar = barN % T.prog.length;

    const chordDeg = T.prog[bar];
    const dly = t - Sfx.ctx.currentTime;
    // drums
    const useDrums = barN >= T.drumFrom;
    if (useDrums) {
      if (T.drums.k[s] === 'x') this.kick(dly);
      if (T.drums.s[s] === 'x') this.snare(dly);
      if (T.drums.h[s] === 'x') this.hat(dly, s % 4 === 2);
    }
    // bass
    const bp = T.bass[barN % T.bass.length];
    if (bp[s] === 'x') this.note(T.bassWave, NOTE(degNote(root - 12, sc, chordDeg)), sd * 0.9, 0.16, dly, 520);

    if (s === 0) for (const k of [0, 2, 4]) this.note('triangle', NOTE(degNote(root, sc, chordDeg + k)), sd * 15, 0.045, dly, 1400, 0.08);

    const ap = T.arp[barN % T.arp.length]; const av = CH(ap[s]);
    if (av !== null) this.note('square', NOTE(degNote(root + 12, sc, chordDeg + av)), sd * 1.5, 0.03, dly, 2600);

  },
  note(type, f, dur, vol, delay, cutoff, attack = 0.005, vib = false) {

  },
  kick(delay) { Sfx.osc('sine', 150, 42, 0.18, 0.5, { delay, bus: Sfx.musicBus }); },
  snare(delay) { Sfx.noise(0.14, 0.22, 'highpass', 1800, 1200, 0.7, { delay, bus: Sfx.musicBus }); Sfx.osc('triangle', 220, 140, 0.08, 0.12, { delay, bus: Sfx.musicBus }); },
  hat(delay, open) { Sfx.noise(open ? 0.12 : 0.04, 0.08, 'highpass', 7000, 7000, 0.5, { delay, bus: Sfx.musicBus }); },
  // one-shot melodic stinger: notes as [midi, startBeat, beats]
  sting(notes, bpm = 120, wave = 'square', vol = 0.1) {
    if (!Sfx.ok()) return;
    const bd = 60 / bpm;
    for (const [m, s, d] of notes) this.note(wave, NOTE(m), d * bd, vol, s * bd, 3500, 0.01, true);
  },
  victory() { this.sting([[72, 0, 0.5], [76, 0.5, 0.5], [79, 1, 0.5], [84, 1.5, 1.5], [79, 3, 0.5], [84, 3.5, 2]], 132, 'square', 0.09); this.sting([[48, 0, 1], [55, 1, 1], [60, 2, 1.5], [53, 3, 1], [60, 4, 2.5]], 132, 'sawtooth', 0.06); },
  defeat() { this.sting([[67, 0, 0.8], [63, 0.8, 0.8], [60, 1.6, 0.8], [55, 2.4, 2.5]], 70, 'triangle', 0.12); },
};

const OUTLINE_COLOR = 0x120b22;
const _hullCache = new WeakMap();
const _outMats = new Map();
const _toonMats = new Map();

}

// Mesh factory: toon material + optional inked outline hull.
function mk(geo, mat, o = {}) {

  groups(cat) { return (((cat << 16) | 0xffff) >>> 0); },
  qgroups(mask) { return (((0xffff << 16) | mask) >>> 0); },
  ball(r) {

  },

  attach(ent, shape, cat) {

    const cd = shape.r !== undefined ? RAPIER.ColliderDesc.ball(shape.r) : RAPIER.ColliderDesc.cuboid(shape.hx, shape.hy, shape.hz);
    cd.setCollisionGroups(this.groups(cat));

    this.byHandle.set(col.handle, ent);
  },
  // Fixed (static) collider
  attachFixed(ent, shape, cat) {
    const o = ent.anchor || ent.group; o.updateWorldMatrix(true, false);
    const p = o.getWorldPosition(new THREE.Vector3());
    const cd = shape.r !== undefined ? RAPIER.ColliderDesc.ball(shape.r) : RAPIER.ColliderDesc.cuboid(shape.hx, shape.hy, shape.hz);
    cd.setTranslation(p.x, p.y, p.z).setCollisionGroups(this.groups(cat));

  spawnDebris(pos, n, o = {}) {

    }
  },
  killDebris(d) {
    try { this.world.removeRigidBody(d.rb); } catch (e) { /* ignore */ }

  step(dt) {
    if (!this.world) return;
    this.world.timestep = Math.min(dt, 1 / 30);
    this.world.step();
    for (let i = this.debris.length - 1; i >= 0; i--) {
      const d = this.debris[i]; d.life -= dt;
      if (d.life <= 0) { this.killDebris(d); continue; }

      d.mesh.position.set(t.x, t.y, t.z); d.mesh.quaternion.set(r.x, r.y, r.z, r.w);
      const k = Math.min(1, d.life / 0.5); d.mesh.scale.setScalar(d.base * k);
      if (d.trail && Math.random() < 0.5) Fx.emit(d.mesh.position, new THREE.Vector3(), 0.3, 0.3, 0xff8030, 0, 1);
    }
  },
};

const Hazards = {

  wave(z) {

class Boss extends Ent {

}

function buildBiodome() {
  const g = new THREE.Group();
  g.add(mk(sph(8, 18, 12), toon(0x9ae8ff, 0x60c0ff, 0.3, { transparent: true, opacity: 0.55 }), { shadow: false }));
  g.add(mk(cyl(7, 8, 2, 12), toon(0x6a5a80), { outline: 0.15, pos: [0, -7.5, 0] }));
  for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; g.add(mk(cone(0.9, 4, 5), toon(0x5ac860, 0x40a040, 0.2), { outline: 0.06, pos: [Math.cos(a) * 3.4, -4.2, Math.sin(a) * 3.4], rot: [-Math.PI / 2, 0, 0] })); }
  const ring = mk(tor(12, 0.5, 6, 32), toon(0xffd040, 0xffb020, 0.4), { outline: 0.1 }); ring.rotation.x = Math.PI / 2.3; g.add(ring);
  return g;
}

const Scenery = {
  group: null, chunks: new Map(), kind: 'space', CH: 80, env: null,
  init(scene) { this.group = new THREE.Group(); scene.add(this.group); },
  reset(kind, env) {
    for (const [, c] of this.chunks) { disposeTree(c); this.group.remove(c); }
    this.chunks.clear(); this.kind = kind; this.env = env;
  },
  update(pz) {
    const CH = this.CH; const cur = Math.floor(-pz / CH);
    for (let i = Math.max(0, cur - 1); i <= cur + Math.ceil(940 / CH); i++) if (!this.chunks.has(i)) this.build(i);
    for (const [i, c] of this.chunks) if (i < cur - 2) { disposeTree(c); this.group.remove(c); this.chunks.delete(i); }
  },
  build(i) {
    const CH = this.CH; const g = new THREE.Group(); const z0 = -i * CH;
    if (this.kind === 'canyon') {
      const col = this.env.rock; const floorCol = this.env.floor;
      g.add(ownBox(300, 2, CH, i % 2 ? floorCol : (floorCol & 0xfefefe) + 0x0c0804, { recv: true, pos: [0, -1, z0 - CH / 2], outline: 0 }));
      for (const side of [-1, 1]) {
        for (let k = 0; k < 3; k++) {
          const w = rr(14, 30), h = rr(28, 78), d = rr(22, 42);
          const rock = buildRock(w, h, d, col); rock.position.set(side * (rr(40, 54) + w / 2 + k * 2), 0, z0 - (k + 0.5) * CH / 3 + rr(-6, 6)); g.add(rock);
        }
        const far = buildRock(rr(30, 50), rr(70, 120), rr(50, 80), (col & 0xfefefe) + 0x181008); far.position.set(side * rr(95, 130), 0, z0 - rr(10, CH - 10)); g.add(far);
      }
      for (let k = 0; k < 4; k++) {
        const s = rr(1, 2.6); const b = mk(ico(1, 0), toon((col & 0xfefefe) + 0x181008), { outline: 0.05, recv: true, pos: [rr(-36, 36), s * 0.3, z0 - rr(0, CH)], scl: [s, s * 0.7, s * rr(0.8, 1.3)] }); b.rotation.y = rr(0, 6); g.add(b);
      }
      for (let k = 0; k < 3; k++) {  // dry shrubs
        const sh = mk(cone(0.5, rr(1.5, 3), 5), toon(0x7a8a3a), { outline: 0.05, pos: [rr(-38, 38), 1, z0 - rr(0, CH)] }); sh.rotation.x = -Math.PI / 2; g.add(sh);
      }
    } else {
      for (let k = 0; k < 3; k++) {
        const size = rr(6, 20); const a = buildAsteroid(size, ri(0, 3), this.env.rock || 0x6e6272);
        const side = Math.random() < 0.5 ? -1 : 1;
        a.position.set(side * rr(48, 150), rr(-70, 70), z0 - rr(0, CH)); g.add(a);
      }
      if (i % 3 === 1) { const b = buildBiodome(); b.position.set((Math.random() < 0.5 ? -1 : 1) * rr(60, 110), rr(-30, 40), z0 - CH / 2); b.scale.setScalar(rr(0.8, 1.5)); g.add(b); }
    }
    this.chunks.set(i, g); this.group.add(g);
  },
};

    if (this.pos.x !== this.ox) this.vx = 0; if (this.pos.y !== this.oy) this.vy = 0;
    // ---- speed: boost / brake
    const wantBoost = c.boost && !this.boostLock && this.boost > 0 && !c.brake && !intro;
    const wantBrake = c.brake && !wantBoost;
    if (wantBoost && !this.boosting) { Sfx.boost(); Input.rumble(0.2, 0.5, 250); }

    this.boosting = wantBoost; this.braking = wantBrake;
    let target = 52;
    if (wantBoost) { target = 98; this.boost -= 38 * dt; Game.stats.boostTime += dt; if (this.boost <= 0) { this.boost = 0; this.boostLock = true; } }
    else { this.boost = Math.min(100, this.boost + (wantBrake ? 40 : 18) * dt); if (this.boostLock && this.boost > 35) this.boostLock = false; }
    if (wantBrake) { target = 28; Game.stats.brakeTime += dt; }
    if (outro) target = 160;
    this.speed = damp(this.speed, target, 3.2, dt);
    this.vel.set(this.vx, this.vy, -this.speed);
    // ---- roll
    this.rollCd = Math.max(0, this.rollCd - dt);
    const rq = c.roll;
    if (rq && this.rolling <= 0 && this.rollCd <= 0 && !intro) { this.rolling = 0.62; this.rollDir = rq; Sfx.roll(); Game.stats.rolls++; Game.tipEvent('roll'); }
    if (this.rolling > 0) { this.rolling -= dt; if (this.rolling <= 0) { this.rolling = 0; this.rollCd = 0.15; } }

    U.flames.forEach((f) => { f.scale.set(1, 1, (this.boosting ? 1.9 : this.braking ? 0.35 : 1) * (0.85 + Math.random() * 0.3)); });
    g.position.copy(this.pos);

  weapons(dt, c) {

    if (c.fire) {

  shoot() {
    if (this.fireCd > 0.04) return;
    this.fireCd = 0.15; Game.stats.shots++; Game.tipEvent('fire');

  },
  release() {

    if (!Game.cheat) this.bombs--; this.bombCd = 1.2; Game.stats.bombsUsed++; Game.tipEvent('bomb');
    Game.novaBomb(this.pos.clone());
  },
};

// ---------- Wingmen ----------
class Wingman {
  constructor(id, castKey, pal, slot) {
    this.id = id; this.cast = castKey; this.group = buildShip(pal, 0.82); this.slot = slot; this.pos = this.group.position;
    this.hp = 80; this.maxHp = 80; this.state = 'fly'; this.t = rr(0, 6); this.assistT = rr(2, 4); this.chasers = []; this.out = 0; this.bank = 0; this.saved = false;
    this.group.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  }
  reset() {
    this.hp = this.maxHp; this.state = 'fly'; this.chasers = []; this.out = 0; this.group.visible = true; this.saved = false;
    this.pos.set(Player.pos.x + this.slot.x, Player.pos.y + this.slot.y, Player.pos.z + 20);
  }
  hit(n) {
    if (this.state === 'gone') return;
    this.hp -= n; Fx.burst(this.pos, 3, { speed: 6, life: 0.3, size: 0.25, color: 0xff7040 });
    if (this.hp <= 0 && this.state !== 'gone') {
      this.state = 'gone'; this.out = 0;
      for (const c of this.chasers) if (c.alive) c.st = 'flee';
      Game.say(this.cast, pick(["I'm hit bad! Pulling out!", 'Engines failing — heading home!', 'Sorry, Hazel... I have to bail!']), 3, true);
      Game.stats.alliesLost++; Game.onAllyLost(this);
    }
  }
  update(dt) {
    this.t += dt; const P = Player; const g = this.group, U = g.userData;
    if (this.state === 'gone') {
      this.out += dt; this.pos.x += this.slot.x * 0.4 * dt * 3; this.pos.y += 6 * dt; this.pos.z += 30 * dt;
      if (Math.random() < 0.5) Fx.emit(this.pos, V3(0, 0, 8), 0.8, 0.5, 0x606060, 0, 1);
      g.rotation.z += dt * 2; if (this.out > 4) g.visible = false; return;
    }
    let tx = P.pos.x + this.slot.x + Math.sin(this.t * 0.8 + this.id) * 2.5, ty = P.pos.y + this.slot.y + Math.cos(this.t * 0.6 + this.id * 2) * 1.5, tz = P.pos.z + this.slot.z;
    if (this.state === 'chased') { tx = P.pos.x + Math.sin(this.t * 1.5) * 15; ty = P.pos.y + 2 + Math.cos(this.t * 1.1) * 5; tz = P.pos.z - 46 + Math.sin(this.t * 0.7) * 6; }
    const ox = this.pos.x;
    this.pos.x = damp(this.pos.x, tx, 2.2, dt); this.pos.y = damp(this.pos.y, ty, 2.2, dt); this.pos.z = damp(this.pos.z, tz, 2.0, dt);
    const vx = (this.pos.x - ox) / Math.max(dt, 1e-3);
    this.bank = damp(this.bank, -vx * 0.04, 5, dt);
    U.pivot.rotation.z = this.bank + (this.state === 'chased' ? Math.sin(this.t * 4) * 0.4 : 0); U.pivot.rotation.x = Math.sin(this.t * 1.3) * 0.04;
    U.flames.forEach((f) => f.scale.set(1, 1, 0.8 + Math.random() * 0.4));
    // assist fire
    this.assistT -= dt;
    if (this.assistT <= 0 && this.state === 'fly') {
      this.assistT = rr(2.4, 4.2);
      let best = null, bd = 1e9;
      for (const e of Game.ents) {
        if (!e.alive || !e.targetable || e.invuln || e.kind === 'part' || e.kind === 'ring') continue;
        const ep = e.wpos(_a); const dz = this.pos.z - ep.z;
        if (dz < 20 || dz > 200 && e.st !== 'tail') { if (e.st !== 'tail') continue; }
        const d = ep.distanceToSquared(this.pos); if (d < bd) { bd = d; best = e; }
      }
      // tailers behind the player are handled here too
      for (const e of Game.ents) { if (e.alive && e.st === 'tail') { best = e; break; } }
      if (best) {
        const bp = best.wpos(V3());
        const s = Shots.player(this.pos.clone(), bp.clone().sub(this.pos).normalize().multiplyScalar(250), 1, 1);
        s.assist = false; s.tgt = null; s.dmg = 0; s.from = 'p'; s.wing = true; s.life = bp.distanceTo(this.pos) / 250;
        Sfx.laser(1);
        if (Math.random() < 0.55) best.damage(best.kind === 'boss' ? 0 : 1, { from: 'w' });
      }
    }
    // return to formation when chasers gone
    if (this.state === 'chased') {
      this.chasers = this.chasers.filter((c) => c.alive && c.st === 'chase');
      if (this.chasers.length === 0) {
        this.state = 'fly'; Game.stats.alliesSaved++; this.saved = true;
        Game.say(this.cast, pick(['Thanks, Hazel! That was too close!', 'You got him! I owe you a basket of apples!', 'Phew — back in formation!']), 3, true);
        Game.addScore(500, 'ALLY SAVED +500');
      }
    }
  }
}

// ---------- Autopilot used by Attract Mode (cheats freely: invulnerable, infinite bombs) ----------
const Autopilot = {
  t: 0, fireT: 0, hold: 0, rollT: 4, target: null, retarget: 0,
  reset() { this.t = 0; this.hold = 0; this.rollT = rr(3, 6); this.target = null; },
  controls(dt) {
    const P = Player; this.t += dt;
    const c = { mx: 0, my: 0, fire: false, firePressed: false, bombPressed: false, boost: false, brake: false, roll: 0 };
    this.retarget -= dt;
    if (this.retarget <= 0 || !this.target || !this.target.alive) {
      this.retarget = 0.4; let best = null, bd = 1e9;
      for (const e of Game.ents) {
        if (!e.alive || (!e.targetable && e.kind !== 'ring' && e.kind !== 'crate')) continue;
        if (e.invuln) continue;
        const ep = e.wpos(_a); const dz = P.pos.z - ep.z;
        if (dz < 15 || dz > 300) continue;
        const score = dz + (e.kind === 'ring' ? -60 : 0) + (e.kind === 'crate' ? -80 : 0);
        if (score < bd) { bd = score; best = e; }
      }
      this.target = best;
    }
    const B = P.bounds();
    let tx = 0, ty = (B.yMin + B.yMax) / 2;
    if (this.target) { const tp = this.target.wpos(_a); tx = tp.x; ty = tp.y; }
    else { tx = Math.sin(this.t * 0.6) * 10; ty = ty + Math.sin(this.t * 0.9) * 5; }
    c.mx = clamp((tx - P.pos.x) * 0.5, -1, 1); c.my = clamp((ty - P.pos.y) * 0.5, -1, 1);
    // fire: rhythmic taps; hold for lock-on when several targets are present
    let count = 0; for (const e of Game.ents) if (e.alive && e.targetable && P.pos.z - e.p.z > 20 && P.pos.z - e.p.z < 280) count++;
    this.fireT -= dt;
    if (count >= 3 && this.hold <= 0 && Math.random() < dt * 0.5) this.hold = 1.6;
    if (this.hold > 0) { this.hold -= dt; c.fire = true; }
    else if (this.fireT <= 0) { c.fire = true; c.firePressed = true; this.fireT = 0.2; }
    this.rollT -= dt; if (this.rollT <= 0) { this.rollT = rr(4, 8); c.roll = Math.random() < 0.5 ? -1 : 1; }
    if (count >= 6 && P.bombs > 0 && P.bombCd <= 0 && Math.random() < dt * 0.6) c.bombPressed = true;
    P.bombs = Math.max(P.bombs, 2);
    c.boost = this.target && P.pos.z - this.target.p.z > 150 && P.boost > 30 && Math.sin(this.t * 0.3) > 0.5;
    return c;
  },
};

const LEAD = { say: 0, tip: 0, music: 0, gunship: 60, crawler: 60, help: 0 };
const DIFF = [{ name: 'Easy', e: 0.65, p: 0.7 }, { name: 'Normal', e: 1, p: 1 }, { name: 'Hard', e: 1.4, p: 1.4 }];

const newStats = () => ({ score: 0, hits: 0, kills: 0, enemiesTotal: 0, alliesSaved: 0, alliesLost: 0, deflected: 0, rolls: 0, shots: 0, volleys: 0, bombsUsed: 0, boostTime: 0, brakeTime: 0, damageTaken: 0, rings: 0, deaths: 0 });

const Game = {
  mode: 'menu',        // 'menu' | 'play' | 'attract'

  paused: false, cheat: false, attract: false,
  root: null, lvl: null, lvlIdx: 0, dist: 0, startAt: 0, time: 0, introT: 0, outroT: 0, nextEv: 0, checkpoint: 0,
  ents: [], pending: [], wingmen: [], squads: {}, boss: null, stats: newStats(), continues: 2,
  combo: 0, comboT: 0, bombFx: null, tipActive: null, tipFlags: {}, tipClock: 0, moveAcc: 0, deadShown: false, showT: 0,
  camPos: V3(), camLook: V3(), fov: 62, camInit: false, startMusic: null,

  init() {
    this.root = new THREE.Group(); Gfx.scene.add(this.root);
    Phys.scene = this.root;
    Scenery.init(Gfx.scene);
    Player.init();
    this.wingmen = [

    ];

  },
  eDmg() { return DIFF[S().difficulty].e; },
  eDmgPlayer() { return DIFF[S().difficulty].p; },
  levelCount() { return LEVELS.length; },

  clearWorld() {
    for (const e of this.ents) { if (e.group && e.group.parent) e.group.parent.remove(e.group); disposeTree(e.group); }
    this.ents.length = 0; this.pending.length = 0; this.squads = {}; this.boss = null;
    Shots.clear(); Hazards.clear(); Fx.clear();
    while (this.root.children.length) { const c = this.root.children[0]; this.root.remove(c); }
    for (const d of [...Phys.debris]) { /* world replaced below */ }
    this.bombFx = null; this.tipActive = null; UI.clearTip && UI.clearTip(); UI.hideBoss && UI.hideBoss();
    Sfx.chargeUpdate(0, false);
  },

  // ---------- stage lifecycle ----------
  startLevel(idx, o = {}) {
    this.clearWorld();
    const L = this.lvl = LEVELS[idx]; this.lvlIdx = idx;
    Phys.newWorld(L.gravity || 0); if (L.ground !== null) Phys.setGround(L.ground);
    Gfx.setEnv(L.env); Scenery.reset(L.scenery, L.env);
    this.dist = o.startAt || 0; this.startAt = this.dist; this.nextEv = 0; this.time = 0; this.checkpoint = this.dist;
    this.startMusic = L.music;
    this.attract = !!o.attract; this.cheat = !!o.attract; this.mode = o.attract ? 'attract' : 'play';
    this.paused = false; this.deadShown = false; this.combo = 0; this.comboT = 0; this.tipFlags = {}; this.tipActive = null; this.moveAcc = 0;
    if (!o.keepStats) { this.stats = newStats(); this.continues = 2; }
    this.root.add(Player.group);
    if (!o.keepStats || o.fresh) { Player.maxHp = 100; Player.bombs = 3; Player.laserLv = 1; }
    else { Player.bombs = Math.max(3, Player.bombs); Player.laserLv = 1; }
    Player.reset(Player.maxHp);
    for (const w of this.wingmen) { this.root.add(w.group); }
    Player.pos.z = -this.dist;
    for (const w of this.wingmen) { w.reset(); }
    Autopilot.reset();
    this.phase = o.noIntro ? 'play' : 'intro'; this.introT = 0; this.camInit = false;
    Sfx.engineStart();
    // fast-forward: apply music/env events before startAt
    for (const ev of L.events) { if (ev.at < this.startAt - 1 && ev.t === 'music') this.startMusic = ev.name; }
    Music.play(this.startMusic);
    UI.onLevelStart(L, o);
    Input.consumeRoll();

  startShowcase() {
    this.clearWorld();
    const L = this.lvl = LEVELS[0]; this.lvlIdx = 0; this.mode = 'menu'; this.phase = 'none'; this.attract = false; this.cheat = false;

    for (const w of this.wingmen) { this.root.add(w.group); w.reset(); }

  showcaseUpdate(dt) {
    this.showT += dt; const t = this.showT;
    this.dist += 46 * dt; Player.speed = 46;
    Player.pos.set(Math.sin(t * 0.45) * 5, Math.sin(t * 0.7) * 2.2, -this.dist); Player.vel.set(0, 0, -46);
    const U = Player.group.userData;
    U.pivot.rotation.set(Math.sin(t * 0.7) * 0.06, 0, Math.sin(t * 0.45) * 0.3 + (Math.sin(t * 0.2) > 0.97 ? t * 8 : 0));
    U.flames.forEach((f) => f.scale.set(1, 1, 0.9 + Math.random() * 0.3));
    Player.group.position.copy(Player.pos);
    for (const w of this.wingmen) w.update(dt);
    Scenery.update(Player.pos.z);
    Gfx.updateDust(Player.pos.x, Player.pos.y, Player.pos.z, 46, dt);
    const a = t * 0.14 + 0.9, r = 17;
    const cp = V3(Player.pos.x + Math.sin(a) * r, Player.pos.y + 3.4 + Math.sin(t * 0.3) * 1.6, Player.pos.z + Math.cos(a) * r * 0.9 - 4);
    Gfx.camera.position.copy(cp); Gfx.camera.lookAt(Player.pos.x, Player.pos.y + 1.2, Player.pos.z - 4);
    Gfx.camera.fov = 52; Gfx.camera.updateProjectionMatrix();
    Gfx.updateSky(Gfx.camera.position, t); Gfx.updateSun(Player.pos);
    if (Math.random() < 0.6) for (const sx of [-0.55, 0.55]) Fx.emit(_a.set(Player.pos.x + sx, Player.pos.y, Player.pos.z + 2.4), V3(0, 0, 12), 0.35, 0.28, 0x7fe8ff, 0, 1.5);
  },

  // ---------- entities ----------
  add(ent, shape, noGroup) {
    if (!noGroup) this.root.add(ent.group);
    if (shape) { if (ent.fixedBody) Phys.attachFixed(ent, shape, ent.cat); else Phys.attach(ent, shape, ent.cat); }
    this.ents.push(ent);
    if (ent.score > 0 && !ent.noCount && ent.cat === CAT.ENEMY && ent.kind !== 'missile') this.stats.enemiesTotal++;
    if (ent.squad) { const q = this.squads[ent.squad] || (this.squads[ent.squad] = { total: 0, left: 0, broken: false }); q.total++; q.left++; }
    return ent;
  },
  removeEnt(e, killed = false) {
    if (e.removed) return;
    e.removed = true; e.alive = false; this.pending.push(e);
    if (!killed && e.squad && this.squads[e.squad]) this.squads[e.squad].broken = true;
    if (Player.locks.includes(e)) Player.locks.splice(Player.locks.indexOf(e), 1);
  },
  flushRemovals() {
    if (!this.pending.length) return;
    for (const e of this.pending) {
      Phys.detach(e);
      if (e.group && e.group.parent) e.group.parent.remove(e.group);
      if (e.group) disposeTree(e.group);
      const i = this.ents.indexOf(e); if (i >= 0) this.ents.splice(i, 1);
    }
    this.pending.length = 0;
  },
  registerHit() { this.comboT = 2.4; },
  addScore(n, label) { this.stats.score += Math.round(n); if (label) UI.banner(label, '#ffe060', 1.1); },
  onKill(e, src) {
    const st = this.stats;
    if (e.score > 0 && !e.noCount) {
      st.kills++; st.hits++; this.combo++; this.comboT = 2.4;
      const mult = 1 + Math.min(4, Math.floor(this.combo / 6)) * 0.25;
      st.score += Math.round(e.score * mult);
    }
    if (e.squad && this.squads[e.squad]) {
      const q = this.squads[e.squad]; q.left--;
      if (q.left <= 0 && !q.broken && q.total > 1) { this.addScore(q.total * 100); UI.banner(`SQUAD CLEARED  +${q.total * 100}`, '#7fffd4', 1.6); Sfx.clear(); Player.heal(5); }
    }
    if (e.partName && e.partName !== 'core' && e.anchor) e.anchor.visible = false;
    if (e.kind === 'pylon' && e.parent) e.parent.disable();
    if (e.partName === 'core') { /* boss AI notices */ }
    if (e.kind === 'flyer' && Math.random() < 0.06) this.spawnPickup('crate-laser-or-bomb', e.p.x, e.p.y, e.p.z);
    Input.rumble(0.1, 0.4, 70);
  },
  spawnPickup(kind, x, y, z) {
    if (kind === 'ring') {
      const e = new Ent('ring', buildRing('silver'), { cat: CAT.PICKUP, hp: 1, r: 3.8, targetable: false, keep: false, params: { kind: 'silver' } });
      e.p.set(x, y, z); e.pickup = 'silver'; this.add(e, { r: 3.8 }); return;
    }
    const k = Math.random() < 0.5 ? 'bomb' : 'laser';
    const e = new Ent('crate', buildCrate(k), { cat: CAT.PICKUP, hp: 1, r: 2.2, targetable: false, params: { kind: k } });
    e.p.set(x, y, z); e.pickup = k; this.add(e, { r: 2.2 });
  },
  spawnMissile(pos, speed = 40, turn = 1.3) {
    const e = new Ent('missile', buildMissile(), { hp: 1, r: 1.2, score: 60, contact: 18, targetable: true, keep: true, params: { speed, turn }, colors: [0xe8e0d0, 0xe2562f, 0xffc040] });
    e.p.copy(pos); e.vel.set(0, 0, speed * 0.4); this.add(e, { r: 1.2 });
  },
  spawnScout(x, y, z, o = {}) {
    const swoop = o.t === 'swooper';
    const e = new Ent('flyer', swoop ? buildSwooper() : buildScout(o.color), {
      hp: o.hp ?? 2, r: 1.9, score: swoop ? 150 : 100, act: o.act ?? 260, squad: o.squad,
      colors: swoop ? [0xe2562f, 0x7a2418, 0xffc040] : [0x6a2f9a, 0x3c1d66, 0xff3a4a],
      params: { pattern: o.pattern || 'weave', speed: o.speed ?? 38, amp: o.amp ?? 9, fireRate: o.fireRate ?? (swoop ? 1.4 : 1.9), burst: o.burst ?? (swoop ? 2 : 1), tail: o.tail, dmg: o.dmg ?? 9, freq: o.freq, dir: o.dir },
    });
    e.p.set(x, y, z); faceFlip(e.group); this.add(e, { r: 1.9 }); return e;
  },
  warnTail(e) {
    if (e.warned) return; e.warned = true;
    UI.warn('TAILED!  Roll, bomb or let wingmen help'); Sfx.warn();
    this.say('marrow', 'Hazel, you have one on your tail! Hang on!', 2.8, true);
  },
  onDeflect() { this.addScore(25); Input.rumble(0.2, 0.6, 80); },
  onAllyLost() { UI.warn('WINGMAN DOWN'); },
  onPlayerDown() {
    this.phase = 'dead'; this.stats.deaths++; this.deadShown = false;
    Music.stop(); Music.defeat();
  },
  say(who, text, dur = 3.4, quick = false) { UI.say(who, text, dur, quick); },
  banner(text, color, dur) { UI.banner(text, color, dur); },
  tipEvent(id) { this.tipFlags[id] = true; },

  novaBomb(pos) {
    Sfx.bomb(); Input.rumble(1, 1, 500); Fx.trauma = 1; UI.flash('#fff6d8', 0.8);
    Fx.shockwave(_a.copy(pos).add(V3(0, 0, -10)), 150, 0xffe0a0, false); Fx.shockwave(_a.copy(pos).add(V3(0, 0, -30)), 100, 0xffffff, false);
    this.bombFx = { t: 0, pos: pos.clone(), ticks: 0 };
    this.bombPulse(14, 1.0);
  },
  bombPulse(dmg, k) {
    const P = Player;
    for (const e of [...this.ents]) {
      if (!e.alive) continue;
      const ep = e.wpos(V3()); const dz = P.pos.z - ep.z;
      if (dz < -10 || dz > 280) continue;
      if (Math.hypot(ep.x - P.pos.x, ep.y - P.pos.y) > 110) continue;
      if (e.cat !== CAT.ENEMY || e.kind === 'boss') continue;
      Fx.explosion(ep.clone(), 0.5, { shake: 0.1 });
      e.damage(e.kind === 'part' ? dmg * 0.6 : dmg, { from: 'p' });
    }
    for (let i = Shots.list.length - 1; i >= 0; i--) {
      const s = Shots.list[i]; if (s.from !== 'e') continue;
      Fx.burst(s.pos, 4, { speed: 8, life: 0.4, size: 0.4, color: 0xffd080 }); s.mesh.parent && s.mesh.parent.remove(s.mesh); Shots.list.splice(i, 1);
    }
    for (let i = 0; i < 8 * k; i++) Fx.explosion(V3(P.pos.x + rr(-40, 40), P.pos.y + rr(-25, 25), P.pos.z - rr(30, 160)), rr(0.5, 1.2), { shake: 0.05 });
  },

  // ---------- timeline ----------
  processEvents() {
    const evs = this.lvl.events;
    while (this.nextEv < evs.length) {
      const ev = evs[this.nextEv];
      const lead = LEAD[ev.t] ?? 420;
      if (ev.at - lead > this.dist) break;
      this.nextEv++;
      if (ev.at < this.startAt - 1) continue; // already passed (checkpoint restart)
      this.fire(ev);
    }
  },
  fire(ev) {
    const f = Spawn[ev.t]; if (f) f(ev, this);
  },

  // ---------- tutorial ----------
  updateTips(dt) {
    const T = this.tipActive; if (!T) return;
    T.t += dt;
    if (!T.done) {
      let ok = !!this.tipFlags[T.def.done];
      if (T.id === 'move') { this.moveAcc += (Math.abs(Input.move.x) + Math.abs(Input.move.y) > 0.5 ? dt : 0); ok = this.moveAcc > 0.8; }
      if (T.id === 'boost') ok = this.stats.boostTime - T.b0 > 0.8;
      if (T.id === 'brake') ok = this.stats.brakeTime - T.k0 > 0.6;
      if (ok || T.t > 18) { T.done = true; T.t = 0; if (ok) { Sfx.clear(); } UI.tipDone(ok); }
    } else if (T.t > 1.3) { this.tipActive = null; UI.clearTip(); }
  },

  readControls() {
    return { mx: Input.move.x, my: Input.move.y, fire: Input.held('fire'), firePressed: Input.pressed('fire'), bombPressed: Input.pressed('bomb'), boost: Input.held('boost'), brake: Input.held('brake'), roll: Input.consumeRoll() };
  },

  // ---------- main per-frame update ----------
  update(dt) {
    const P = Player;
    this.time += dt;
    const ctl = this.attract ? Autopilot.controls(dt) : this.readControls();
    if (this.attract) { const r = ctl.roll; if (r) Input.rollQueue = 0; }

    if (this.phase === 'intro') {
      this.introT += dt;
      if (this.introT > 3.2) { this.phase = 'play'; UI.banner('GO!', '#7fffd4', 1.0); Sfx.go(); }
    }
    P.update(dt, ctl);
    if (P.state === 'alive') { this.dist += P.speed * dt; }
    P.pos.z = -this.dist; P.group.position.copy(P.pos);

    if (this.phase === 'play' || this.phase === 'intro') this.processEvents();
    for (let i = 0; i < this.ents.length; i++) {
      const e = this.ents[i]; if (!e.alive) continue;
      const f = AI[e.kind]; if (f) f(e, dt);
      if (e.pulse > 0) { e.pulse -= dt; if (e.kind !== 'asteroid' && e.kind !== 'mine' && e.group && e.kind !== 'boss' && e.kind !== 'part') e.group.scale.setScalar(1 + Math.max(0, e.pulse) * 0.7); }
    }
    for (const w of this.wingmen) w.update(dt);
    Shots.update(dt); Hazards.update(dt);
    this.playerCollisions();
    if (this.bombFx) { this.bombFx.t += dt; if (this.bombFx.ticks === 0 && this.bombFx.t > 0.35) { this.bombFx.ticks = 1; this.bombPulse(10, 0.6); } if (this.bombFx.t > 1.2) this.bombFx = null; }
    this.comboT -= dt; if (this.comboT <= 0) this.combo = 0;
    // checkpoints
    for (const c of this.lvl.checkpoints) if (this.dist >= c && c > this.checkpoint) this.checkpoint = c;
    if (!this.attract && this.tipActive) this.updateTips(dt);
    // outro & death
    if (this.phase === 'outro') { this.outroT += dt; if (this.outroT > 4.2 && !this.doneShown) { this.doneShown = true; this.completeLevel(); } }
    if (this.phase === 'dead' && P.deadT > 2.4 && !this.deadShown) { this.deadShown = true; UI.showGameOver(); }
    // sync physics bodies
    for (const e of this.ents) if (e.alive) Phys.sync(e);
    this.flushRemovals();
    // world visuals
    Scenery.update(P.pos.z);
    Gfx.updateDust(P.pos.x, P.pos.y, P.pos.z, P.speed, dt);
    Gfx.updateSun(P.pos);
    this.updateCamera(dt);
    Gfx.updateSky(Gfx.camera.position, this.time);
  },

  updateCamera(dt) {
    const P = Player, cam = Gfx.camera;
    let tp, tl, fov = 62 + (P.boosting ? 14 : 0) - (P.braking ? 4 : 0);
    if (this.phase === 'intro') {
      const k = sstep(0, 3.2, this.introT);
      tp = V3(lerp(16, P.pos.x * 0.62, k), lerp(7, P.pos.y * 0.62 + 3.1, k), lerp(P.pos.z + 34, P.pos.z + 11.5, k));
      tl = V3(P.pos.x * 0.4, P.pos.y * 0.4 + 1, P.pos.z - lerp(-4, 45, k));
      this.camInit = true; this.camPos.copy(tp); this.camLook.copy(tl); fov = lerp(48, 62, k);
    } else if (this.phase === 'outro') {
      tp = V3(P.pos.x * 0.4 + 6, P.pos.y * 0.4 + 5, P.pos.z + 22); tl = V3(P.pos.x, P.pos.y, P.pos.z - 30); fov = 70;
    } else if (P.state === 'dead') {
      tp = this.camPos.clone(); tl = V3(P.pos.x, P.pos.y, P.pos.z - 10);
    } else {
      tp = V3(P.pos.x * 0.62, P.pos.y * 0.62 + 3.1, P.pos.z + 11.5); tl = V3(P.pos.x * 0.38, P.pos.y * 0.38 + 1.2, P.pos.z - 45);
    }
    if (!this.camInit) { this.camPos.copy(tp); this.camLook.copy(tl); this.camInit = true; }
    const kp = this.phase === 'intro' ? 1 : 1 - Math.exp(-9 * dt);
    this.camPos.lerp(tp, kp); this.camLook.lerp(tl, 1 - Math.exp(-12 * dt));
    cam.position.copy(this.camPos);
    const sh = Fx.shakeAmount();
    if (sh > 0.0005) cam.position.add(_a.set(rr(-1, 1) * sh * 1.6, rr(-1, 1) * sh * 1.6, rr(-1, 1) * sh));
    cam.lookAt(this.camLook);
    if (P.state === 'alive') cam.rotateZ(-P.vx * 0.0035);
    this.fov = damp(this.fov, fov, 5, dt); cam.fov = this.fov; cam.updateProjectionMatrix();
  },

  playerCollisions() {
    const P = Player; if (P.state !== 'alive') return;
    const hits = [];
    Phys.overlap(P.pos, 1.5, CAT.ENEMY | CAT.OBST | CAT.PICKUP, (e) => { hits.push(e); return true; });
    for (const e of hits) {
      if (!e.alive) continue;
      if (e.cat === CAT.PICKUP) { this.collect(e); continue; }
      if (e.cat === CAT.OBST) {
        if (e.kind === 'laserGate' && !e.beamOn) continue;
        P.hurt(e.kind === 'laserGate' ? 18 : 22, 'ram');
        const ep = e.wpos(V3());
        P.vx += Math.sign(P.pos.x - ep.x || 1) * 18; P.vy += Math.sign(P.pos.y - ep.y || 1) * 10;
        Fx.burst(P.pos, 8, { speed: 12, life: 0.4, size: 0.35, color: [0xffa040, 0xffffff] });
        continue;
      }
      if (e.kind === 'boss' || e.parent) { P.hurt(26, 'ram'); P.vx += Math.sign(P.pos.x - e.p.x || 1) * 16; P.vy += 6; continue; }
      P.hurt(e.contact, 'ram');
      P.vx += Math.sign(P.pos.x - e.p.x || 1) * 12;
      e.damage(e.kind === 'missile' || e.kind === 'mine' ? 99 : 6, { from: 'ram' });
    }
  },
  collect(e) {
    const P = Player; const p = e.p;
    Fx.burst(p, 16, { speed: 14, life: 0.7, size: 0.4, color: e.pickup === 'gold' ? [0xffe080, 0xffffff] : [0xbfe6ff, 0xffffff] });
    if (e.kind === 'ring') {
      this.stats.rings++;
      if (e.pickup === 'gold') { P.maxHp = Math.min(160, P.maxHp + 20); P.hp = P.maxHp; UI.banner('GOLD RING!  SHIELD MAX UP', '#ffd040', 1.6); this.addScore(1000); }
      else { P.heal(28); UI.banner('SHIELD +28', '#9affff', 1.0); this.addScore(300); }
      Sfx.ring();
    } else if (e.kind === 'crate') {
      if (e.pickup === 'bomb') { P.bombs = Math.min(6, P.bombs + 1); UI.banner('NOVA BOMB +1', '#ffa060', 1.1); Sfx.bombPickup(); }
      else { if (P.laserLv < 3) { P.laserLv++; UI.banner(P.laserLv === 2 ? 'TWIN LASERS!' : 'HYPER LASERS!', '#9affc8', 1.3); } else { this.addScore(500, 'LASER MAX  +500'); } Sfx.pickup(); }
    }
    this.removeEnt(e, true);
  },

  // ---------- boss / stage flow ----------
  onBossDefeated(b) {
    UI.hideBoss(); Music.stop();
    Sfx.alarm(); this.addScore(b.type === 'crawler' ? 8000 : 5000);
    this.say('granny', b.type === 'crawler' ? 'The Crawler is going down! Magnificent flying, Furrow Squadron!' : 'The gunship is breaking up! Great shooting, Furrow Squadron!', 4, true);
    for (const e of [...this.ents]) { if (e.parent === b && e.alive) { e.alive = false; this.removeEnt(e, true); } }
    for (let i = Shots.list.length - 1; i >= 0; i--) if (Shots.list[i].from === 'e') { Shots.list[i].mesh.parent && Shots.list[i].mesh.parent.remove(Shots.list[i].mesh); Shots.list.splice(i, 1); }
    Hazards.clear();
  },
  onBossGone() {
    this.boss = null; this.phase = 'outro'; this.outroT = 0; this.doneShown = false;
    Music.victory(); UI.banner('STAGE CLEAR!', '#7fffd4', 3);
    Player.invuln = 99;
  },
  completeLevel() {
    if (this.attract) { Attract.next(); return; }
    const st = this.stats;
    const killPct = st.enemiesTotal ? st.kills / st.enemiesTotal : 1;
    const ally = (3 - st.alliesLost) / 3; const hpPct = Player.hp / Player.maxHp;
    const val = killPct * 0.55 + ally * 0.2 + hpPct * 0.15 + (st.deaths === 0 ? 0.1 : 0);
    const medal = val >= 0.9 ? 'S' : val >= 0.75 ? 'A' : val >= 0.55 ? 'B' : 'C';
    st.bonus = Math.round(val * 5000); st.score += st.bonus;
    SaveData.record(this.lvl.id, st.score, medal);
    SaveData.data.unlocked = Math.max(SaveData.data.unlocked, this.lvlIdx + 2); SaveData.save();
    this.phase = 'done';
    UI.showResults({ stats: st, medal, killPct, level: this.lvl, hasNext: this.lvlIdx + 1 < LEVELS.length, best: SaveData.data.scores[this.lvl.id] });
  },
  retryFromCheckpoint() {
    this.continues--;
    const cp = this.checkpoint; const keep = this.stats;
    this.startLevel(this.lvlIdx, { startAt: cp, keepStats: true, noIntro: false });
    this.stats = keep;
  },
  restartStage() { this.startLevel(this.lvlIdx, { fresh: true }); },
  exitToTitle() {
    this.attract = false; this.cheat = false; this.mode = 'menu'; this.paused = false;
    this.startShowcase(); Music.play('title'); UI.hideHud();
  },
};

// ---------- spawners: one function per event type ----------
const Spawn = {
  say: (ev) => Game.say(ev.who, ev.text, ev.dur),
  tip: (ev) => {
    if (!S().tutorial || Game.attract) return;
    const def = TIPS[ev.id]; if (!def) return;
    Game.tipActive = { id: ev.id, def, t: 0, done: false, b0: Game.stats.boostTime, k0: Game.stats.brakeTime };
    UI.showTip(ev.id, def.text);
  },
  banner: (ev) => UI.banner(ev.text, ev.color, ev.dur),
  music: (ev) => Music.play(ev.name),
  scout: (ev) => Game.spawnScout(ev.x ?? 0, ev.y ?? 0, -ev.at, ev),
  swooper: (ev) => Game.spawnScout(ev.x ?? 0, ev.y ?? 0, -ev.at, ev),
  drone: (ev) => {
    const e = new Ent('drone', buildDrone(), { hp: ev.hp ?? 1, r: 1.9, score: 100, act: ev.act ?? 300, params: { fire: ev.fire, bob: true }, squad: ev.squad, colors: [0x5a5a78, 0xff4060, 0xffb030] });
    e.p.set(ev.x ?? 0, ev.y ?? 0, -ev.at); Game.add(e, { r: 1.9 });
  },
  turret: (ev) => {
    const m = buildTurret(Game.lvl.scenery === 'canyon' ? 0x7a5a48 : 0x5a5470);
    const e = new Ent('turret', m, { hp: ev.hp ?? 3, r: 1.8, score: 150, act: ev.act ?? 240, params: { fireRate: ev.fireRate }, anchor: m.userData.head, colors: [0x5a5470, 0x8a3a4a, 0xff4060] });
    e.p.set(ev.x ?? 0, ev.y ?? 0, -ev.at); Game.add(e, { r: 1.8 });
  },
  mine: (ev) => {
    const e = new Ent('mine', buildMine(), { hp: 1, r: 1.9, score: 120, contact: 22, act: ev.act ?? 270, colors: [0x4a2a5a, 0xffd040, 0xff3050] });
    e.p.set(ev.x ?? 0, ev.y ?? 0, -ev.at); Game.add(e, { r: 1.9 });
  },
  asteroid: (ev) => {
    const size = ev.size ?? 4; const g = buildAsteroid(size, ev.variant ?? 0, Game.lvl.env.rock || 0x8a7d78);
    if (ev.solid) {
      const e = new Ent('asteroid', g, { cat: CAT.OBST, hp: 999, r: size, targetable: false, params: {} });
      e.fixedBody = true; e.p.set(ev.x ?? 0, ev.y ?? 0, -ev.at); Game.add(e, { r: size * 0.88 });
      // static colliders cannot move: asteroid spin only
    } else {
      const e = new Ent('asteroid', g, { cat: CAT.ENEMY, hp: ev.hp ?? 3, r: size * 0.9, score: 0, targetable: false, contact: 18, params: {} });
      e.p.set(ev.x ?? 0, ev.y ?? 0, -ev.at); Game.add(e, { r: size * 0.88 });
    }
  },
  ring: (ev) => {
    const e = new Ent('ring', buildRing(ev.kind || 'silver'), { cat: CAT.PICKUP, hp: 1, r: 3.8, targetable: false, params: { kind: ev.kind } });
    e.pickup = ev.kind || 'silver'; e.p.set(ev.x ?? 0, ev.y ?? 0, -ev.at); Game.add(e, { r: 3.8 });
  },

function drawPortrait(ctx, key, t, talk) {
  const c = CAST[key]; if (!c) return; const W = 128;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, W);
  const g = ctx.createLinearGradient(0, 0, 0, W); g.addColorStop(0, c.accent); g.addColorStop(1, '#2a1a56'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, W);
  ctx.save(); ctx.translate(64, 78);
  for (let i = 0; i < 12; i++) { ctx.rotate(TAU / 12); ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.03)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(120, -18); ctx.lineTo(120, 18); ctx.fill(); }
  ctx.restore();
  ctx.translate(0, Math.sin(t * 3) * 1.5);
  ctx.lineWidth = 4.5; ctx.strokeStyle = '#140c26'; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const blob = (x, y, rx, ry, fill, rot = 0) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); };
  const col = c.color; const sp = c.species;
  // species back-layer
  if (sp === 'hare') { blob(44, 24, 9, 30, col, -0.12); blob(44, 26, 4.5, 21, '#ffa0c0', -0.12); blob(84, 24, 9, 30, col, 0.12); blob(84, 26, 4.5, 21, '#ffa0c0', 0.12); }
  if (sp === 'goat') { ctx.strokeStyle = '#140c26'; ctx.lineWidth = 11; for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(64 + s * 22, 48); ctx.quadraticCurveTo(64 + s * 44, 18, 64 + s * 30, 6); ctx.stroke(); } ctx.strokeStyle = '#e8d8a0'; ctx.lineWidth = 6; for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(64 + s * 22, 48); ctx.quadraticCurveTo(64 + s * 44, 18, 64 + s * 30, 6); ctx.stroke(); } ctx.strokeStyle = '#140c26'; ctx.lineWidth = 4.5; }
  if (sp === 'tortoise') blob(64, 100, 50, 38, '#6aa050');
  if (sp === 'moth') { ctx.beginPath(); ctx.moveTo(52, 40); ctx.quadraticCurveTo(34, 8, 22, 14); ctx.moveTo(76, 40); ctx.quadraticCurveTo(94, 8, 106, 14); ctx.stroke(); }
  if (sp === 'sheep') { for (const [x, y] of [[38, 52], [52, 36], [70, 34], [88, 50], [64, 30], [30, 70], [98, 70]]) blob(x, y, 17, 15, '#ffffff'); }
  // head
  blob(64, 76, sp === 'sheep' ? 28 : 38, sp === 'sheep' ? 32 : 34, sp === 'sheep' ? '#4a3a58' : col);
  if (sp === 'goat') { ctx.beginPath(); ctx.moveTo(52, 104); ctx.lineTo(64, 126); ctx.lineTo(76, 104); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke(); }
  if (sp === 'mole') { blob(64, 88, 13, 10, '#ff90a8'); }
  if (sp === 'sheep') { blob(40, 76, 8, 12, '#4a3a58', -0.5); blob(88, 76, 8, 12, '#4a3a58', 0.5); }
  // eyes
  const blink = (t % 3.4) < 0.12;
  const eye = (x, y) => {
    if (sp === 'mole') { ctx.fillStyle = '#140c26'; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, TAU); ctx.fill(); return; }
    if (blink) { ctx.beginPath(); ctx.moveTo(x - 8, y); ctx.lineTo(x + 8, y); ctx.stroke(); return; }
    blob(x, y, 9, 10, sp === 'moth' ? '#ff3a5a' : '#ffffff');
    ctx.fillStyle = '#140c26';
    if (sp === 'goat') ctx.fillRect(x - 5, y - 2, 10, 4); else { ctx.beginPath(); ctx.arc(x + 1, y + 1, 4.2, 0, TAU); ctx.fill(); }
  };
  eye(49, 68); eye(79, 68);
  if (sp === 'tortoise') { ctx.beginPath(); ctx.arc(49, 68, 13, 0, TAU); ctx.moveTo(92, 68); ctx.arc(79, 68, 13, 0, TAU); ctx.moveTo(62, 68); ctx.lineTo(66, 68); ctx.stroke(); }
  if (sp === 'moth') { ctx.beginPath(); ctx.moveTo(38, 56); ctx.lineTo(58, 64); ctx.moveTo(90, 56); ctx.lineTo(70, 64); ctx.stroke(); }
  // nose + mouth
  if (sp !== 'mole') { ctx.fillStyle = '#ff8aa8'; ctx.beginPath(); ctx.arc(64, 82, 4, 0, TAU); ctx.fill(); }
  const open = talk ? Math.abs(Math.sin(t * 17)) : 0;
  if (open > 0.15) { blob(64, 96, 10, 4 + open * 8, '#5a1a30'); if (sp === 'moth') { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(56, 92); ctx.lineTo(59, 99); ctx.lineTo(62, 92); ctx.moveTo(66, 92); ctx.lineTo(69, 99); ctx.lineTo(72, 92); ctx.fill(); } }
  else { ctx.beginPath(); ctx.arc(64, 92, 10, 0.2, Math.PI - 0.2); ctx.stroke(); }
}

    ...(Game.continues > 0 ? [{ label: `Retry from checkpoint  (${Game.continues} continue${Game.continues > 1 ? 's' : ''} left)`, onSelect: () => { UI.close(); Game.retryFromCheckpoint(); } }] : []),
    { label: 'Restart stage', onSelect: () => { UI.close(); Game.restartStage(); } },
    { label: 'Quit to Title', onSelect: () => { UI.close(); Game.exitToTitle(); UI.set('title'); } },
  ],
});
SCREENS.results = (r) => {
  const st = r.stats;
  return {
    dim: true, root: true, delay: 1.0,
    header: `<h1 class="menu-title disp ink">Stage Clear!</h1><div class="menu-sub">${r.level.name}</div><div class="bigmedal disp ink">${r.medal}</div>`,
    body: `<div class="stats"><span>Score</span><span class="v">${st.score.toLocaleString()}</span><span>Enemies downed</span><span class="v">${st.kills} (${Math.round(r.killPct * 100)}%)</span><span>Wingmen saved / lost</span><span class="v">${st.alliesSaved} / ${st.alliesLost}</span><span>Shots reflected</span><span class="v">${st.deflected}</span><span>Rings · Bombs used</span><span class="v">${st.rings} · ${st.bombsUsed}</span><span>Rating bonus</span><span class="v">+${(st.bonus || 0).toLocaleString()}</span><span>Best</span><span class="v">${(r.best || st.score).toLocaleString()}</span></div>`,
    items: [
      ...(r.hasNext ? [{ label: 'Next Stage', onSelect: () => UI.go('briefing', { idx: Game.lvlIdx + 1 }) }] : [{ label: 'Finish Demo', onSelect: () => UI.set('ending') }]),
      { label: 'Replay Stage', onSelect: () => { UI.close(); Game.restartStage(); } },
      { label: 'Quit to Title', onSelect: () => { UI.close(); Game.exitToTitle(); UI.set('title'); } },
    ],
  };
};
SCREENS.ending = () => ({
  dim: true, root: true, header: '<h1 class="menu-title disp ink">Demo Complete!</h1><div class="menu-sub">The Blight retreats… for now.</div>',
  body: `<div style="padding:3vh 5vh;font-size:3vh;line-height:1.45;max-width:min(70vw,900px);text-align:center">Thank you for flying with Furrow Squadron.<br>The Orchard Belt and Dustbowl Gorge are safe, but Baron Blight's fleet is still out there. More harvest worlds await in the full game.</div>`,
  items: [{ label: 'Back to Title', onSelect: () => { UI.close(); Game.exitToTitle(); UI.set('title'); } }],
});


// ---------------- 12_main.js ----------------
// ===== 12_main: boot, main loop, attract mode (AI-played kiosk demo), idle detection =====
const Attract = {
  active: false, idx: 0, t: 0, dur: 50,
  // Looping playlist: [stage, start distance, seconds]. The AI cheats freely (invulnerable, infinite bombs).
  list: [
    { lvl: 0, start: 0, dur: 52 }, { lvl: 0, start: 3000, dur: 40 }, { lvl: 0, start: 6200, dur: 90 },
    { lvl: 1, start: 0, dur: 52 }, { lvl: 1, start: 1450, dur: 40 }, { lvl: 1, start: 5800, dur: 100 },
  ],
  start() {
    if (this.active) return;
    this.active = true; this.idx = 0; UI.close(); this.run();
  },
  run() {
    const e = this.list[this.idx % this.list.length];
    this.t = 0; this.dur = e.dur;
    Game.startLevel(e.lvl, { startAt: e.start, attract: true, noIntro: true, fresh: true });
    Player.bombs = 3;
  },
  next() { this.idx++; this.run(); },
  stop(silent) {
    if (!this.active) return;
    this.active = false;
    if (!silent) { Game.exitToTitle(); UI.set('title'); }
  },
  update(dt) {
    if (!this.active) return;
    this.t += dt;
    if (this.t > this.dur) this.next();
  },
};

let _frameErr = 0;
let _last = 0;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - (_last || now)) / 1000)); _last = now;
  try {
    Input.poll(dt);
    const act = Input.consumeActivity();
    if (Attract.active && act) { Attract.stop(); }
    UI.update(dt);
    if (Game.mode === 'play' && !UI.cur && !Game.paused && Input.pressed('pause') && Game.phase !== 'done') UI.openPause();
    if (Game.mode === 'menu') Game.showcaseUpdate(dt);
    else if (!Game.paused) Game.update(dt);
    Attract.update(dt);
    if (!Game.paused) { Fx.update(dt); Phys.step(dt); }
    // kiosk idle: 10 s without input on the title / menu screens starts the attract loop
    if (!Attract.active && Game.mode === 'menu' && UI.cur && !UI.touchOnly && Input.idleSeconds() > 10) Attract.start();
    Gfx.render();
  } catch (e) {
    if (_frameErr++ < 5) console.error('Frame error', e);
    try { Gfx.render(); } catch (e2) { /* ignore */ }
  }
}

async function boot() {
  Settings.load(); SaveData.load();
  UI.build();
  Input.init();
  if (!navigator.gpu) {
    UI.fatal('WebGPU is required', `${GAME_TITLE} uses Three.js WebGPURenderer with no fallback.<br>Please use a recent Chrome, Edge or Safari with WebGPU enabled.`);
    return;
  }
  try {
    UI.loadProgress(0.2, 'Warming up the renderer…');
    await Gfx.init($('#gl'));
    UI.loadProgress(0.55, 'Loading physics…');
    await RAPIER.init();
    UI.loadProgress(0.8, 'Planting the stage…');
    Game.init();
    Game.startShowcase();
    UI.loadProgress(1, 'Ready');
  } catch (e) {
    console.error(e);
    UI.fatal('Could not start', `Initialization failed: ${e && e.message ? e.message : e}`);
    return;
  }
  UI.hideLoading();
  UI.set('title');
  Music.play('title');
  Gfx.renderer.setAnimationLoop(frame);
}

boot();
</script>
