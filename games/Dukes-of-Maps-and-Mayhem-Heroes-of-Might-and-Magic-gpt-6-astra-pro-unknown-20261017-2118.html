 *    E.Mover on a TileMap of roofs climbs, vaults and leaps; E.ACTIONS, and E.sees / E.Suspicion for guards (17b-17d).
 * 8. SOUND, TEXT, MENUS. game.audio.sfx('jump'), game.audio.music(song);
 *    E.font.text(...) (5x7 proportional font), E.font.title(...), E.ui.box/bar/hearts,
 *    new E.Dialog(game), new E.Menu(game, items). An HTML interface (title, pause, settings, help, results, map
 *    screens and a HUD with a minimap) from data: new E.Shell(game, {...}) (21d).
 * 8a. STANDARD FEATURES come with every game (10b): a pause menu with settings and controls the player rebinds, saved
 *    per game (game.settings), full screen (game.fullscreen; a phone's first tap), pausing when the page is hidden, and
 *    input.label(action) for prompts, and a boot (10c): heavy setup in game.start({ boot: { steps } }) runs behind a

 *    game.flash, and E.tones(hex) / E.ramp(hex) for hue-shifted shading.

 *    plays it back headless, exactly, and stops where it differs (game.stateHash = () => [...] sharpens that).

 *    steps at once, game.input.tap('jump') and hold('right') script input, game.debug = { snapshot() { ... } } is
 *    your game's handle for tests and tools; game.stop(), start() and dispose() stop, resume and end it.
 * Errors in your game are shown on screen and in the console (game.errors).
 * THE HANDOFF PACKAGE holds this file and what it needs (dist/handoff/ in the repo, my-3d2dge.vercel.app/handoff/):

function battleForecast(){const b=S.battle,u=B.active(b),target=battleTarget();if(!u)return ['Battle complete','The field falls silent.'];if(u.side==='enemy')return ['Enemy turn','The Ash host is giving its orders.'];if(S.spell){if(S.spell==='bolt')return ['Sun bolt · 45 damage','Select an enemy. Costs 3 mana.'];return target?['Mend · +'+Math.min(54,target.maxHp-target.hp)+' health',unitName(target.kind)+(target.dead?' · restore this fallen stack':' · 3 mana')]:['Mend · up to 54 health','Choose an allied stack. Tab / L1 cycles valid targets.'];}

 const reach=(B.actions(b,u).reachable||[]).some(p=>p.col===b.selected.col&&p.row===b.selected.row);return reach?['Move here','Movement uses this stack’s turn.']:['Tile unavailable','Choose an open tile within your movement range.'];}

}
function renderUI(){renderPending=false;menuItems=[];const screens={title:renderTitle,map:renderMap,town:renderTown,briefing:renderBriefing,battle:renderBattle,reward:renderReward,win:renderOutcome,lose:renderOutcome};ui.innerHTML=(screens[S.scene]||renderTitle)();if(S.modal)overlay.innerHTML=renderModal();else overlay.innerHTML='';document.body.classList.toggle('touch-only',touchOnly);$('gate-icon').innerHTML=ico('controller');writeSnapshot();}
function writeSnapshot(){const b=S.battle;$('state-data').textContent=JSON.stringify({version:VERSION,scene:S.scene,modal:S.modal,demo:S.demo,day:S.day,gold:S.gold,wood:S.wood,ore:S.ore,mana:b?b.mana:S.mana,army:S.army,node:S.hero.node,selectedNode:S.selectedNode,move:S.move,seals:S.seals,defeated:S.defeated,upgrades:S.upgrades,focus:focusIndex,townTab,view:game.view.id,round:b?.round,activeId:b?.activeId,activeSide:b?B.active(b)?.side:null,selected:b?.selected,battle:b?{outcome:b.outcome,units:b.units.map(u=>({id:u.id,kind:u.kind,side:u.side,hp:u.hp,count:u.count,col:u.col,row:u.row,dead:u.dead})),spellUsed:b.spellRound===b.round,legal:B.actions(b,B.active(b)),spell:S.spell}:null,busy:!!busy,route:!!S.route,errors:game.errors.map(e=>String(e.message||e)),inputDevice:game.input.lastDevice,gamepadConnected:lastPadActive,touchOnly,options,saveAvailable:hasSave});}
function action(name){if(S.demo){exitDemo();return;}if(performance.now()<swallowUntil)return;switch(name){case'interact':interact();break;case'end-day':openModal('end-day');break;case'pause':if(S.modal)closeModal();else openModal(S.scene==='title'?'settings':'pause');break;case'tab-recruit':townTab='recruit';focusIndex=0;changed();break;case'tab-build':townTab='build';focusIndex=0;changed();break;case'battle-confirm':battleConfirm();break;case'guard':guard();break;case'spells':openSpells();break;}}
function realInput(kind,event){lastRealInput=performance.now();if(kind==='keyboard'||kind==='gamepad'){if(touchOnly){touchOnly=false;changed();}}
 if(S.demo){exitDemo();if(event){event.preventDefault?.();event.stopImmediatePropagation?.();}return true;}return false;}
function exitDemo(){returnTitle();toast('Your adventure is ready. Choose Begin adventure.',2.5);}
document.addEventListener('keydown',e=>{if(realInput('keyboard',e))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','Tab','Backspace'].includes(e.code))e.preventDefault();if(performance.now()<swallowUntil){e.preventDefault();e.stopImmediatePropagation();}},true);
document.addEventListener('pointerdown',e=>realInput(e.pointerType==='touch'?'touch':'mouse',e),true);
document.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&(e.movementX||e.movementY))realInput('mouse',e);},true);
document.addEventListener('wheel',e=>realInput('mouse',e),{passive:false,capture:true});
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',()=>{if(!S.demo&&!['title','win','lose'].includes(S.scene)&&!S.modal)openModal('pause');});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!S.demo&&!['title','win','lose'].includes(S.scene)&&!S.modal)openModal('pause');lastRealInput=performance.now();});
window.addEventListener('gamepaddisconnected',()=>{if(!S.demo&&!['title','win','lose'].includes(S.scene)){openModal('pause');toast('Controller disconnected. Connect it again or use the keyboard.');}});
function wireClicks(root){root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(performance.now()<swallowUntil)return;if(S.demo){exitDemo();return;}if(b.dataset.menu!==undefined){focusIndex=Number(b.dataset.menu);activate();}else if(b.dataset.action)action(b.dataset.action);});root.addEventListener('pointerover',e=>{if(S.demo)return;const b=e.target.closest('[data-menu]');if(b){focusIndex=Number(b.dataset.menu);root.querySelectorAll('[data-menu]').forEach(el=>el.classList.toggle('focused',Number(el.dataset.menu)===focusIndex));}});}
wireClicks(ui);wireClicks(overlay);
$('mobile-settings').addEventListener('click',()=>{touchSettings=true;document.body.classList.add('touch-settings');openModal('settings');});
$('screen').addEventListener('click',e=>{if(S.modal||S.demo||S.route||busy)return;const rect=$('screen').getBoundingClientRect(),sc=game.screen;const px=((e.clientX-rect.left)*sc.dpr-sc.OX)/sc.S,py=((e.clientY-rect.top)*sc.dpr-sc.OY)/sc.S;const r=game.r||game.renderer;
 if(S.scene==='map'&&r){let best=null,dist=Infinity;for(const id of availableNodes()){const p=Art.nodeScreen(id,r);if(!p)continue;const d=Math.hypot(px-p[0],py-p[1]);if(d<dist){best=id;dist=d;}}if(best&&dist<30){if(S.selectedNode===best)interact();else{S.selectedNode=best;changed();sound('select');}}}
 if(S.scene==='battle'&&r){let best=null,dist=Infinity;for(let row=0;row<5;row++)for(let col=0;col<7;col++){const p=Art.battleCellScreen(col,row,r);const d=Math.hypot(px-p[0],py-p[1]);if(d<dist){best={col,row};dist=d;}}if(best&&dist<30){const was=S.battle.selected;S.targetId=null;S.battle.selected=best;if(was.col===best.col&&was.row===best.row)battleConfirm();else changed();}}
});
function handleInput(){const I=game.input;if(performance.now()<swallowUntil){I.consumeAll();return;}if(I.pressed('fullscreen'))fullscreen();if(touchOnly&&!touchSettings)return;
 if(I.pressed('pause')){if(S.modal)closeModal();else openModal(S.scene==='title'?'settings':'pause');return;}
 if(S.modal){if(I.pressed('cancel')){closeModal();return;}if(I.repeat('up'))moveFocus(-1);else if(I.repeat('down'))moveFocus(1);else if(I.repeat('left')){if(S.modal==='settings'){if(focusIndex===2){options.volume=Math.max(0,options.volume-.1);applyOptions();changed();}else activate();}else moveFocus(-1);}else if(I.repeat('right')){if(S.modal==='settings'){if(focusIndex===2){options.volume=Math.min(1,options.volume+.1);applyOptions();changed();}else activate();}else moveFocus(1);}if(I.pressed('confirm'))activate();return;}
 if(S.scene==='map'){if(S.route)return;if(I.repeat('left')||I.repeat('up'))chooseNode(-1);else if(I.repeat('right')||I.repeat('down'))chooseNode(1);if(I.pressed('confirm'))interact();else if(I.pressed('square'))openModal('army');else if(I.pressed('triangle'))openModal('end-day');else if(I.pressed('cancel'))openModal('pause');else if(I.pressed('view'))toggleView();}
 else if(S.scene==='battle'){if(I.pressed('view'))toggleView();if(I.pressed('cancel')){if(S.spell){S.spell=null;changed();}else openModal('pause');return;}if(busy||B.active(S.battle)?.side!=='ally')return;if(I.repeat('left'))moveBattleCursor(-1,0);else if(I.repeat('right'))moveBattleCursor(1,0);else if(I.repeat('up'))moveBattleCursor(0,-1);else if(I.repeat('down'))moveBattleCursor(0,1);if(I.pressed('previous'))cycleTarget();else if(I.pressed('confirm'))battleConfirm();else if(I.pressed('square'))guard();else if(I.pressed('triangle'))openSpells();}
 else{if(I.repeat('up')||I.repeat('left'))moveFocus(-1);else if(I.repeat('down')||I.repeat('right'))moveFocus(1);if(I.pressed('confirm'))activate();else if(I.pressed('cancel')){if(S.scene==='town')townLeave();else if(S.scene==='briefing')setScreen('map');else if(['win','lose'].includes(S.scene))returnTitle();}else if(S.scene==='town'&&I.pressed('previous')){townTab=townTab==='recruit'?'build':'recruit';focusIndex=0;changed();}else if(S.scene==='town'&&I.pressed('triangle'))openModal('end-day');}
}
const DEMO_PLAN=[['build','barracks'],['recruit','warden'],['recruit','ranger'],['travel','mill'],['travel','mine'],['travel','mill'],['travel','home'],['day'],['build','roost'],['travel','cache'],['travel','home'],['recruit','griffin'],['recruit','griffin'],['recruit','ranger'],['recruit','warden'],['travel','cache'],['travel','shrine'],['travel','bridge'],['travel','grove'],['travel','bridge'],['travel','spire'],['travel','bridge'],['travel','shrine'],['travel','bridge'],['travel','spire'],['travel','keep']];
function demoTick(dt){demoWait-=dt;if(demoWait>0||busy||S.route)return;
 if(S.modal){if(S.modal==='cache'){C.chooseCache(S,'gold');closeModal();}else closeModal();demoWait=1.5;return;}
 if(S.scene==='battle'){if(B.active(S.battle)?.side==='ally'){performBattle(null,true);demoWait=.6;}return;}
 if(S.scene==='briefing'){startBattle();demoWait=1.2;return;}
 if(S.scene==='reward'){leaveReward();demoWait=1.4;return;}
 if(S.scene==='win'||S.scene==='lose'){resetGame(true);return;}
 const task=DEMO_PLAN[demoIndex];if(!task){resetGame(true);return;}
 const [op,id]=task;
 if(op==='travel'){if(S.scene==='town'){townLeave();demoWait=1;return;}if(S.move===0){endDayNow();demoWait=1.5;return;}S.selectedNode=id;changed();interact();demoIndex++;demoWait=1.5;}
 else if(op==='build'||op==='recruit'){if(S.scene!=='town'&&S.hero.node==='home')setScreen('town');townTab=op==='build'?'build':'recruit';townPurchase(op,id);demoIndex++;demoWait=1.2;changed();}
 else if(op==='day'){endDayNow();demoIndex++;demoWait=1.5;}
}
let rawPadPrev=[];
function pollRealPads(){let pads=[];try{pads=Array.from(navigator.getGamepads?.()||[]).filter(Boolean);}catch(_){}let any=false;for(const p of pads){if(p.buttons.some(b=>b.pressed||b.value>.5)||p.axes.some(v=>Math.abs(v)>.32)){any=true;break;}}
 lastPadActive=pads.length>0;if(any){realInput('gamepad');if(game.audio.ctx?.state==='suspended')game.audio.ctx.resume().catch(()=>{});}rawPadPrev=pads;}
function update(dt){clock+=dt;pollRealPads();if(oldDevice!==game.input.lastDevice){oldDevice=game.input.lastDevice;changed();}
 if(S.scene==='title'&&performance.now()-lastRealInput>=10000&&!touchOnly){resetGame(true);return;}
 if(!S.demo)handleInput();if(!S.modal){busy=Math.max(0,busy-dt);if(S.route){S.route.t+=dt;const a=Math.min(1,S.route.t/S.route.duration),u=a*a*(3-2*a);S.hero.x=S.route.from.x+(S.route.to.x-S.route.from.x)*u;S.hero.y=S.route.from.y+(S.route.to.y-S.route.from.y)*u;if(a===1)finishTravel();}
 if(S.scene==='battle'){const b=S.battle;for(const fx of b.effects||[])fx.time+=dt;b.effects=(b.effects||[]).filter(fx=>fx.time<fx.duration);if(!busy){if(B.finished(b)){finishBattle();}else{syncBattleCursor();if(B.active(b)?.side==='enemy')performBattle(null,true);}}}
 }
 if(S.demo)demoTick(dt);
 const zoom=S.scene==='town'?1.3:S.scene==='title'?1:game.view.id==='topdown'?(S.scene==='battle'?.77:.62):game.view.id==='threequarter'?(S.scene==='battle'?.85:.78):1;if(game.zoom!==zoom)game.setZoom(zoom);game.cam.offset=S.scene==='town'?[140,10]:S.scene==='battle'?[48,-8]:[20,-5];
 const camera=Art.camera?Art.camera(S):{x:170,y:130,z:0};if(Array.isArray(camera))game.focus(camera[0],camera[1],camera[2]||0);else if(camera)game.focus(camera.x,camera.y,camera.z||0);
 Art.update(dt,S);if(renderPending)renderUI();if(toastUntil&&performance.now()>toastUntil){$('toast').classList.remove('on');toastUntil=0;}
 if(S.scene==='title'){const el=$('idle-label');if(el)el.textContent='A living story begins in '+Math.max(0,Math.ceil((10000-(performance.now()-lastRealInput))/1000))+' seconds';}
 snapshotClock+=dt;if(snapshotClock>.25){snapshotClock=0;writeSnapshot();}}
try{Art.init(game);game.debug={snapshot:()=>JSON.parse($('state-data').textContent||'{}')};game.start({scene:'adventure',scenes:{adventure:{pausable:false,update,draw:r=>Art.draw(r,S,clock)}}});music('calm');renderUI();}catch(error){$('fatal-message').textContent=String(error.message||error);$('fatal').style.display='block';console.error(error);}
window.DukesGame={version:VERSION,game,snapshot:()=>JSON.parse($('state-data').textContent||'{}')};
})();
</script>
