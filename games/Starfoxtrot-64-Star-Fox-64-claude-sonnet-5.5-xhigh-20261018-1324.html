/* ---------------- 53_arena.js ---------------- */
/* ============================================================================
   53_arena.js — all-range (free flight) mode: player flight model, U-turn, wingmen AI.
   Orientation: yaw about +Y (0 = facing -Z), pitch about +X (positive = nose up).
   ========================================================================== */
function updateArenaFrame(g, dt, ctl) {
  const P = g.player, S = g.stage;
  if (g.state === 'dead') {
    updateDeadState(g, dt);
    return;
  }
  // scripted events keyed on stage time
  if (g.state === 'play') {
    while (g.evIdx < g.events.length && g.events[g.evIdx].s <= g.t) {
      const ev = g.events[g.evIdx++];
      try { ev.fn(g); } catch (e) { console.error('event error', e); }
    }
  }
  if (g.state === 'clear') {
    // victory: cruise + gentle climb
    P.pitch = damp(P.pitch, 0.12, 1.5, dt);
    P.fwd = fwdFromAngles(P.yaw, P.pitch);
    P.x += P.fwd[0] * 50 * dt; P.y += P.fwd[1] * 50 * dt; P.z += P.fwd[2] * 50 * dt;
    P.q = qFromYPR(P.yaw, P.pitch, 0);
    return;
  }
  updatePlayerArena(g, dt, ctl);
  void S;
}

function updatePlayerArena(g, dt, ctl) {
  const P = g.player, S = g.stage;
  if (!ctl) ctl = Input._blankCtl();
  const intro = g.state === 'intro';
  if (P.invuln > 0) P.invuln -= dt;
  if (P.hurtT > 0) P.hurtT -= dt;
  if (P.rollCd > 0) P.rollCd -= dt;

  // ---- boost / brake ----
  let target = 1;
  const wasBoost = P.boosting, wasBrake = P.braking;
  P.boosting = false;
  P.braking = false;
  if (!intro) {
    if (P.heat > 0) P.heat -= dt;
    if (ctl.boost && P.boostG > 0.02 && P.heat <= 0) {
      target = 1.7;
      P.boosting = true;
      P.boostG = Math.max(0, P.boostG - dt * 0.34);
      if (P.boostG <= 0.02) P.heat = 1.6;
    } else if (ctl.brake && P.boostG > 0.02 && P.heat <= 0) {
      target = 0.55;
      P.braking = true;
      P.boostG = Math.max(0, P.boostG - dt * 0.15);
    } else P.boostG = Math.min(1, P.boostG + dt * (P.heat > 0 ? 0.08 : 0.22));
    if (g.attract) P.boostG = 1;
    if (P.boosting && !wasBoost) Sound.play('boost');
    if (P.braking && !wasBrake) Sound.play('brake');
  }
  g.speedMul = damp(g.speedMul, target, 4, dt);
  P.speed = S.speed * g.diff.spd * g.speedMul;

  // ---- steering ----
  const mx = intro ? 0 : ctl.mx, my = intro ? 0 : ctl.my;
  if (!P.loop) {
    P.yaw += -mx * 1.65 * dt;
    P.pitch += my * 1.3 * dt;
    if (Math.abs(my) < 0.05) P.pitch = damp(P.pitch, 0, 0.35, dt);
    P.pitch = clamp(P.pitch, -1.2, 1.2);
  }
  P.bankA = damp(P.bankA, -mx * 0.95, 7, dt);

  // ---- barrel roll (deflector) ----
  if (!intro && P.rollT <= 0 && P.rollCd <= 0 && (ctl.rollL || ctl.rollR)) {
    P.rollDir = ctl.rollR ? 1 : -1;
    P.rollT = P.rollDur;
    Sound.play('roll');
  }
  if (P.rollT > 0) {
    P.rollT -= dt;
    P.rollAng = -P.rollDir * TAU * easeIO(clamp(1 - P.rollT / P.rollDur, 0, 1));
    if (P.rollT <= 0) { P.rollAng = 0; P.rollCd = 0.22; }
  } else P.rollAng = 0;

  // ---- U-turn (Immelmann) ----
  let pitchTot = P.pitch, rollOff = 0;
  if (!intro && !P.loop && ctl.uturn) {
    P.loop = { t: 0, dur: 1.05, p0: P.pitch };
    Sound.play('uturn');
  }
  if (P.loop) {
    const L = P.loop;
    L.t += dt;
    const p = clamp(L.t / L.dur, 0, 1);
    pitchTot = L.p0 + PI * easeIO(p);
    rollOff = PI * easeIO(clamp((p - 0.3) / 0.7, 0, 1));
    if (L.t >= L.dur) {
      P.yaw = wrapPi(P.yaw + PI);
      P.pitch = -L.p0;
      P.loop = null;
      pitchTot = P.pitch;
      rollOff = 0;
    }
  }

  // ---- arena limits ----
  const B = S.arena || 380;
  const cz = S.arenaCz || 0;
  const out = Math.abs(P.x) > B || Math.abs(P.z - cz) > B;
  if (out) {
    P.outT += dt;
    if (P.outT > 2.5 && !P.loop) {
      const dx = -P.x, dz = cz - P.z;
      const des = Math.atan2(-dx, -dz);
      const diff = wrapPi(des - P.yaw);
      P.yaw += clamp(diff, -2.4 * dt, 2.4 * dt);
    }
  } else P.outT = Math.max(0, P.outT - dt * 2);

  P.fwd = fwdFromAngles(P.yaw, pitchTot);
  P.x += P.fwd[0] * P.speed * dt;
  P.y += P.fwd[1] * P.speed * dt;
  P.z += P.fwd[2] * P.speed * dt;
  P.q = qFromYPR(P.yaw, pitchTot, P.bankA + rollOff + P.rollAng);
  P.upv = qRotate(qFromYPR(P.yaw, pitchTot, rollOff), [0, 1, 0]);

  // ---- ground + ceiling + buildings ----
  const gy = (S.groundY || 0) + 3.2;
  if (P.y < gy) {
    P.y = gy;
    if (!P.loop) P.pitch = Math.max(P.pitch, 0.06);
    if (Math.random() < 0.3) FX.hitSpark(P.x, gy - 2, P.z, [1, 0.8, 0.4]);
  }
  const ceil = S.ceiling || 170;
  if (P.y > ceil) { P.y = ceil; if (!P.loop) P.pitch = Math.min(P.pitch, -0.05); }
  if (g.state === 'play' && P.alive && S.collide) {
    const c = S.collide(P.x, P.y, P.z, 2.0);
    if (c) {
      P.x += c.nx * c.d; P.y += c.ny * c.d; P.z += c.nz * c.d;
      if (hurtPlayer(g, 22)) {
        FX.explosion(P.x, P.y, P.z, 1.1);
        g.speedMul = 0.6;
        if (!P.loop) { P.yaw += (c.nx * P.fwd[2] - c.nz * P.fwd[0]) * 0.8; }
      }
    }
  }

  // ---- aim & weapons ----
  const aimOn = Settings.freeAim || g.attract;
  P.aimX = damp(P.aimX, aimOn ? clamp(ctl.ax, -1, 1) : 0, 12, dt);
  P.aimY = damp(P.aimY, aimOn ? clamp(ctl.ay, -1, 1) : 0, 12, dt);
  const f = P.fwd;
  let right = vcross(f, [0, 1, 0]);
  if (vlen(right) < 1e-4) right = [1, 0, 0];
  right = vnorm(right);
  const upv = vcross(right, f);
  const ad = vnorm([f[0] + right[0] * P.aimX * 0.28 + upv[0] * P.aimY * 0.18, f[1] + right[1] * P.aimX * 0.28 + upv[1] * P.aimY * 0.18, f[2] + right[2] * P.aimX * 0.28 + upv[2] * P.aimY * 0.18]);
  P.aimDir = ad;
  P.reticle = [P.x + ad[0] * 130, P.y + ad[1] * 130, P.z + ad[2] * 130];
  P.nearRet = [P.x + ad[0] * 55, P.y + ad[1] * 55, P.z + ad[2] * 55];
  if (!intro) updateWeapons(g, dt, ctl);
  P.killedBy = null;
}

function updateWingArena(g, w, dt) {
  const P = g.player;
  w.fireCd -= dt;
  w.tgtT -= dt;
  if (w.turn === undefined) w.turn = 1.7;
  const chased = !!(w.chasedBy && w.chasedBy.alive);
  if (chased) {
    w.helpT -= dt;
    if (w.helpT <= 0) {
      const lines = { waltz: 'Ember! I have a bandit on my tail!', tango: 'Somebody scrape this guy off me!', jive: 'Help! He is all over me!' };
      say(w.id, lines[w.id], 2.2);
      w.helpT = 5;
    }
  } else w.chasedBy = null;
  if (!w.target || !w.target.alive || w.tgtT <= 0) {
    let best = null, bd = 1e9;
    for (const e of g.enemies) {
      if (!e.alive || e.def.boss || e.def.lockable === false) continue;
      const d = Math.hypot(e.x - w.x, e.y - w.y, e.z - w.z) - (e.tgt === P ? 40 : 0) - (w.chasedBy === e ? 200 : 0);
      if (d < bd) { bd = d; best = e; }
    }
    w.target = best;
    w.tgtT = rnd(2.5, 5);
  }
  let tx, ty, tz;
  let spd = 66;
  const t = w.target;
  if (t && !chased) {
    const d = Math.hypot(t.x - w.x, t.y - w.y, t.z - w.z);
    const tf = t.fwd || [0, 0, -1];
    const lead = clamp(d / 140, 0, 0.8) * (t.spd || 40) * 0.5;
    tx = t.x + tf[0] * lead; ty = t.y + tf[1] * lead; tz = t.z + tf[2] * lead;
    spd = 74;
    if (d < 24) { tx = w.x + w.fwd[0] * 50 + rnd(-30, 30); tz = w.z + w.fwd[2] * 50; ty = w.y + 10; }
  } else {
    // formation slot behind/beside the player
    const f = P.fwd;
    let right = vcross(f, [0, 1, 0]);
    if (vlen(right) < 1e-4) right = [1, 0, 0];
    right = vnorm(right);
    const s = w.info.slot;
    tx = P.x - f[0] * 24 + right[0] * s[0] * 1.5; ty = P.y - f[1] * 24 + s[1]; tz = P.z - f[2] * 24 + right[2] * s[0] * 1.5;
    const d = Math.hypot(tx - w.x, ty - w.y, tz - w.z);
    spd = clamp(P.speed * 0.9 + d * 0.9, 50, 130);
    if (chased) {
      // evasive jinks
      w.jinkT = (w.jinkT || 0) - dt;
      if (w.jinkT <= 0) { w.jinkT = rnd(0.7, 1.4); w.jink = [rnd(-1, 1), rnd(-0.5, 0.8), rnd(-1, 1)]; }
      tx = w.x + (w.jink ? w.jink[0] : 0) * 90 + w.fwd[0] * 60; ty = w.y + (w.jink ? w.jink[1] : 0) * 50; tz = w.z + (w.jink ? w.jink[2] : 0) * 90 + w.fwd[2] * 60;
      spd = 84;
    }
  }
  const ang = steerTo(w, tx, ty, tz, dt, w.turn * (chased ? 1.25 : 1));
  avoidWorld(w, g, dt);
  w.speed = damp(w.speed || spd, spd, 2, dt);
  w.x += w.fwd[0] * w.speed * dt; w.y += w.fwd[1] * w.speed * dt; w.z += w.fwd[2] * w.speed * dt;
  arenaOrient(w, dt);
  w.y = Math.max(w.y, (g.stage.groundY || 0) + 6);
  if (g.stage.collide) {
    const c = g.stage.collide(w.x, w.y, w.z, 2);
    if (c) { w.x += c.nx * c.d; w.y += c.ny * c.d; w.z += c.nz * c.d; }
  }
  if (t && !chased && g.state === 'play' && w.fireCd <= 0 && ang < 0.16) {
    const d = Math.hypot(t.x - w.x, t.y - w.y, t.z - w.z);
    if (d < 170) {
      const dd = vnorm([t.x - w.x + rnd(-2.5, 2.5), t.y - w.y + rnd(-2.5, 2.5), t.z - w.z + rnd(-2.5, 2.5)]);
      g.pb.push({ kind: 'wing', x: w.x + w.fwd[0] * 3, y: w.y + w.fwd[1] * 3, z: w.z + w.fwd[2] * 3, vx: dd[0] * 300, vy: dd[1] * 300, vz: dd[2] * 300, life: 0.8, dmg: 1.0, r: 0.8, sty: STY.bolt1, col: [0.5, 1, 0.5] });
      Sound.play('laser', clamp((w.x - g.cam.ex) / 60, -0.6, 0.6), 0.3);
      w.fireCd = rnd(0.35, 0.7);
    }
  }
  if (w.hp < 40 && Math.random() < 0.3) FX.smokeTrail(w.x, w.y, w.z, 0.7);
}

/* helper used by arena stages: spawn point on the arena rim, away from the player */
function arenaSpawnPoint(g, minDist) {
  const S = g.stage, P = g.player;
  const B = (S.arena || 380) * 0.85;
  for (let i = 0; i < 8; i++) {
    const a = rnd(0, TAU);
    const r = rnd(0.5, 1) * B;
    const x = Math.cos(a) * r, z = (S.arenaCz || 0) + Math.sin(a) * r;
    const y = rnd(35, 100);
    if (S.solidAt && S.solidAt(x, y, z, 12)) continue;
    if (Math.hypot(x - P.x, y - P.y, z - P.z) > (minDist || 220)) return [x, y, z];
  }
  return [rnd(-B, B) * 0.5, 160, (S.arenaCz || 0) - B * 0.9];
}


/* ---------------- 54_bosses.js ---------------- */
/* ============================================================================
   54_bosses.js — five bosses: Tempo Walker, Fermata Fortress, Contrabass Wyrm,
   Viper Virtuoso (all-range rival), Maestro Dissonant (final).
   Bosses keep their own "parts" (hit spheres in e.hs with ids) and manage e.hp / e.maxHp
   as the sum of part health so the HUD bar is simple.
   ========================================================================== */
function startBoss(g, type, x, y, rel, o) {
  if (g.mode === 'rails') g.cp = { s: Math.max(0, g.s - 1.5), ev: Math.max(0, g.evIdx - 1), kills: g.hits, boss: true };
  else g.cp = { s: 0, kills: g.hits, boss: true };
  const e = spawnEnemy(type, x, y, g.mode === 'rails' ? g.player.z - rel : (o && o.z !== undefined ? o.z : 0), Object.assign({ rel }, o || {}));
  g.boss = e;
  g.bossActive = true;
  g.bossBar = { name: e.name, e };
  Music.start(g.stage.bossMusic || 'boss');
  Sound.play('warn');
  return e;
}

function bossSum(e) {
  let hp = 0, mx = 0;
  for (const k of Object.keys(e.parts)) {
    const p = e.parts[k];
    if (p.x === undefined) { p.x = e.x; p.y = e.y; p.z = e.z; }
    hp += Math.max(0, p.hp);
    mx += p.max;
  }
  e.hp = hp;
  e.maxHp = mx;
}

function bossPartHit(g, e, id, dmg, src) {
  const p = e.parts[id];
  if (!p || p.dead) return false;
  p.hp -= dmg;
  p.flash = 0.09;
  if (PLAYER_KILL_SRC.has(src)) g.hitMark = 0.2;
  Sound.play('hit', panOf(g, e));
  if (Math.random() < 0.4) FX.hitSpark(p.x || e.x, p.y || e.y, p.z || e.z);
  if (p.hp <= 0) {
    p.dead = true;
    p.hp = 0;
    const hs = e.hs.find((h) => h.id === id);
    if (hs) hs.dead = true;
    FX.explosion(p.x || e.x, p.y || e.y, p.z || e.z, 2.2);
    FX.chunks(p.x || e.x, p.y || e.y, p.z || e.z, 8, PAL.steel, 20);
    FX.addShake(0.5);
    Sound.play('explodeBig', panOf(g, e));
    addScore(p.score || 800);
    addChain(2);
    g.hits++;
    return true;
  }
  return false;
}

function deflectSpark(g, e, idx) {
  const h = e.hs[idx];
  FX.hitSpark(h ? h.x : e.x, h ? h.y : e.y, h ? h.z : e.z, [0.7, 0.85, 1]);
  Sound.play('deflect', panOf(g, e), 0.7);
}

function bossDeath(g, e) {
  if (e.dying) return;
  e.dying = true;
  e.deathT = 0;
  e.invuln = true;
  g.bossBar = { name: e.name, e, dying: true };
  g.eb.length = 0; // clear the field of bullets
  for (const x of g.enemies) if (x !== e && x.alive && !x.def.boss) { x.noCredit = true; x.noDrop = true; killEnemy(g, x, 'self'); }
  g.timeScale = 0.35;
  FX.flash = 0.8;
  Sound.play('explodeBig');
  after(1.0, () => { g.timeScale = 1; });
  Music.fadeOut(1.5);
}

function bossDeathTick(g, e, dt, sz) {
  e.deathT += dt;
  if (Math.random() < dt * 14) {
    const x = e.x + rnd(-sz, sz), y = e.y + rnd(-sz * 0.4, sz * 0.8), z = e.z + rnd(-sz * 0.4, sz * 0.4);
    FX.explosion(x, y, z, rnd(1.3, 2.6));
    FX.addShake(0.25);
    if (Math.random() < 0.4) Sound.play('explode', panOf(g, e));
  }
  if (e.deathT > 3.3) finishBoss(g, e);
}

function finishBoss(g, e) {
  if (g.bossDefeated) return;
  e.alive = false;
  g.bossActive = false;
  g.bossBar = null;
  g.bossDefeated = true;
  FX.explosion(e.x, e.y, e.z, 7);
  FX.chunks(e.x, e.y, e.z, 24, PAL.steel, 34);
  FX.shockwave(e.x, e.y, e.z, 60, [1, 0.9, 0.7]);
  FX.flash = 1;
  FX.addShake(1.4);
  Sound.play('explodeBig');
  addScore(e.def.score || 10000);
  g.hits += 5;
  after(0.8, () => Sound.play('explodeBig'));
  after(1.6, () => {
    if (g.state === 'over') return;
    if (!g.player.alive) {
      g.player.alive = true;
      g.player.shield = g.player.maxShield;
    }
    g.timeScale = 1;
    Sound.chargeUpdate(0, false);
    g.player.charge = 0;
    g.player.locks.length = 0;
    g.state = 'clear';
    g.stateT = 0;
    g.clearT = 0;
    g.eb.length = 0;
    Music.start('victory');
    say('waltz', g.stage.victoryLine || 'That is the way, Ember! Well flown!', 3);
    if (g.stage.onClear) g.stage.onClear(g);
  });
}
function bossDown(g) { // legacy hook: killEnemy() path
  if (g.boss && g.boss.alive === false && !g.bossDefeated) finishBoss(g, g.boss);
}

/* ===================================================================
   BOSS 1 — TEMPO WALKER  (stage 1)
   =================================================================== */
EDEF.walker = {
  mesh: 'wTorso', r: 16, hp: 1, noScale: true, score: 12000, boom: 4, boss: true, big: true, persist: true, contact: false, sty: STY.ship, noDrop: true, bombDmg: 7,
  lockPos(e) {
    if (e.phase === 1) {
      for (const id of ['armL', 'armR']) if (!e.parts[id].dead) return [e.parts[id].x, e.parts[id].y, e.parts[id].z];
    }
    return [e.parts.head.x, e.parts.head.y, e.parts.head.z];
  },
  init(e, g) {
    const m = g.diff.enemyHp;
    e.parts = {
      armL: { hp: 24 * m, max: 24 * m, dead: false, flash: 0, score: 1000 },
      armR: { hp: 24 * m, max: 24 * m, dead: false, flash: 0, score: 1000 },
      head: { hp: 80 * m, max: 80 * m, dead: false, flash: 0 },
    };
    e.hs = [
      { id: 'armL', r: 3.8 }, { id: 'armR', r: 3.8 }, { id: 'head', r: 5.2 }, { id: 'torso', r: 9 }, { id: 'legL', r: 4.2 }, { id: 'legR', r: 4.2 },
    ];
    for (const h of e.hs) { h.x = e.x; h.y = e.y; h.z = e.z; }
    bossSum(e);
    e.name = 'TEMPO WALKER';
    e.phase = 1;
    e.atk = 2.5; e.missT = 6; e.waveT = 7; e.orbT = 3; e.curtT = 5;
    e.waves = [];
    e.armTurn = 0;
    e.rel = e.rel || 270;
    e.baseX = e.x;
    e.invuln = false;
  },
  update(e, dt, g) {
    const P = g.player;
    const bob = Math.sin(e.t * 1.7) * 0.5;
    e.rel = approach(e.rel, 138, dt * 42);
    e.z = P.z - e.rel;
    e.x = e.baseX + Math.sin(e.t * 0.35) * 8;
    e.y = 0;
    const T = e.parts;
    T.armL.x = e.x - 9; T.armL.y = 28.7 + bob; T.armL.z = e.z + 6;
    T.armR.x = e.x + 9; T.armR.y = 28.7 + bob; T.armR.z = e.z + 6;
    T.head.x = e.x; T.head.y = 40.4 + bob; T.head.z = e.z + 4.2;
    const set = (id, x, y, z) => { const h = e.hs.find((q) => q.id === id); h.x = x; h.y = y; h.z = z; };
    set('armL', T.armL.x, T.armL.y, T.armL.z);
    set('armR', T.armR.x, T.armR.y, T.armR.z);
    set('head', T.head.x, T.head.y, T.head.z);
    set('torso', e.x, 31 + bob, e.z);
    set('legL', e.x - 8, 12, e.z);
    set('legR', e.x + 8, 12, e.z);
    for (const k of Object.keys(T)) if (T[k].flash > 0) T[k].flash -= dt;
    // phase logic
    if (e.phase === 1 && T.armL.dead && T.armR.dead) {
      e.phase = 2;
      say('waltz', 'Its arms are gone — the visor is opening! Hit the eye!', 3);
      FX.flash = 0.4;
      Sound.play('warn');
    }
    if (e.phase === 2 && T.head.hp < T.head.max * 0.4) {
      e.phase = 3;
      say('tango', 'It is going wild! Keep moving, fox!', 2.6);
      Sound.play('warn');
    }
    if (e.dying) { bossDeathTick(g, e, dt, 14); return; }
    bossSum(e);
    if (g.state !== 'play' || e.rel > 150) return;
    // ---- attacks ----
    e.atk -= dt;
    if (e.phase === 1 && e.atk <= 0) {
      const arm = !T.armL.dead && (T.armR.dead || e.armTurn % 2 === 0) ? T.armL : T.armR;
      e.armTurn++;
      if (!arm.dead) {
        for (let k = 0; k < 3; k++) {
          after(k * 0.14, () => {
            if (!e.alive) return;
            const A = leadPoint(arm.x, arm.y, arm.z + 5, 66, true);
            ebShot(arm.x, arm.y, arm.z + 5, A[0] + rnd(-3, 3), A[1] + rnd(-2, 2), A[2], 66, 9, {});
            Sound.play('enemyShot', panOf(g, e), 0.7);
          });
        }
      }
      e.atk = 1.5 / g.diff.fire;
    }
    if (e.phase >= 2) {
      e.orbT -= dt;
      if (e.orbT <= 0) {
        const n = e.phase === 3 ? 2 : 1;
        for (let k = 0; k < n; k++) {
          const A = leadPoint(T.head.x, T.head.y, T.head.z + 4, 44, true);
          ebShot(T.head.x, T.head.y, T.head.z + 4, A[0] + (k ? 8 : -8) * (n - 1), A[1], A[2], 44, 18, { r: 2.2, big: 2.2, sty: STY.eshot2 });
        }
        Sound.play('missile', panOf(g, e), 0.8);
        e.orbT = (e.phase === 3 ? 2.4 : 3.6) / g.diff.fire;
      }
    }
    e.missT -= dt;
    if (e.missT <= 0 && (e.phase === 1 || e.phase === 3)) {
      for (const s of [-1, 1]) spawnEnemy('missile', e.x + s * 9, 34, e.z + 4, {});
      Sound.play('missile', panOf(g, e));
      e.missT = (e.phase === 3 ? 4 : 6.5) / g.diff.fire;
    }
    e.waveT -= dt;
    if (e.waveT <= 0 && e.phase >= 2) {
      e.waves.push({ z: e.z + 12 });
      FX.addShake(0.35);
      Sound.play('explode', panOf(g, e), 0.9);
      for (const s of [-1, 1]) FX.puff(e.x + s * 8, 2, e.z + 5, 4, [0.9, 0.95, 1]);
      e.waveT = (e.phase === 3 ? 5 : 8) / g.diff.fire;
    }
    e.curtT -= dt;
    if (e.curtT <= 0 && e.phase === 3) {
      const gap = rndi(0, 8);
      for (let i = 0; i < 9; i++) {
        if (Math.abs(i - gap) <= 0) continue;
        for (const yy of [6, 14, 22]) {
          const b = ebShot(e.x + (i - 4) * 7.5, yy, e.z + 10, e.x + (i - 4) * 7.5, yy, P.z + 50, 36, 8, { r: 0.9 });
          void b;
        }
      }
      Sound.play('warn');
      e.curtT = 6 / g.diff.fire;
    }
    // shock waves
    for (let i = e.waves.length - 1; i >= 0; i--) {
      const w = e.waves[i];
      w.z += 46 * dt;
      if (P.alive && Math.abs(P.z - w.z) < 2.4 && P.y < 9.6 && P.rollT <= 0.02 && Math.abs(P.x - e.x) < 70) {
        if (hurtPlayer(g, 15)) FX.explosion(P.x, P.y, P.z, 0.8);
      }
      if (w.z > P.z + 30) e.waves.splice(i, 1);
    }
  },
  hit(e, dmg, idx, src, g) {
    if (e.dying) return;
    const h = e.hs[idx];
    if (!h) return;
    if (h.id === 'armL' || h.id === 'armR') bossPartHit(g, e, h.id, dmg, src);
    else if (h.id === 'head' && e.phase >= 2) {
      bossPartHit(g, e, 'head', dmg, src);
      if (e.parts.head.dead) {
        bossSum(e);
        bossDeath(g, e);
      }
    } else deflectSpark(g, e, idx);
    bossSum(e);
  },
  draw(e, R, g) {
    const T = e.parts;
    const bob = Math.sin(e.t * 1.7) * 0.5;
    const f = (k) => (T[k] && T[k].flash > 0 ? 0.9 : 0);
    const ds = e.dying ? 0.25 + 0.25 * Math.sin(e.t * 40) : 0;

/* ===================================================================
   BOSS 2A — FERMATA FORTRESS (stage 2A)
   =================================================================== */
EDEF.fortress = {
  mesh: 'fCore', r: 14, hp: 1, noScale: true, score: 14000, boom: 4, boss: true, big: true, persist: true, contact: false, sty: STY.ship, noDrop: true, bombDmg: 7,
  lockPos(e) {
    if (e.phase === 1) for (let i = 0; i < 4; i++) if (!e.parts['pod' + i].dead) return [e.parts['pod' + i].x, e.parts['pod' + i].y, e.parts['pod' + i].z];
    return [e.x, e.y, e.z + 5];
  },
  init(e, g) {
    const m = g.diff.enemyHp;
    e.parts = { core: { hp: 90 * m, max: 90 * m, dead: false, flash: 0 } };
    for (let i = 0; i < 4; i++) e.parts['pod' + i] = { hp: 14 * m, max: 14 * m, dead: false, flash: 0, score: 900 };
    e.hs = [{ id: 'core', r: 6.8 }];
    for (let i = 0; i < 4; i++) e.hs.push({ id: 'pod' + i, r: 3.6 });
    for (const h of e.hs) { h.x = e.x; h.y = e.y; h.z = e.z; }
    bossSum(e);
    e.name = 'FERMATA FORTRESS';
    e.phase = 1;
    e.rel = e.rel || 260;
    e.baseX = e.x; e.baseY = e.y;
    e.spin = 0;
    e.atk = 2; e.spiral = 0; e.droneT = 6; e.ringT = 4;
  },
  update(e, dt, g) {
    const P = g.player;
    e.rel = approach(e.rel, 140, dt * 40);
    e.z = P.z - e.rel;
    e.x = e.baseX + Math.sin(e.t * 0.4) * 10;
    e.y = e.baseY + Math.sin(e.t * 0.6) * 4;
    const spinV = e.phase === 1 ? 0.55 : e.phase === 2 ? 0.85 : 1.35;
    e.spin += spinV * dt;
    const T = e.parts;
    for (let i = 0; i < 4; i++) {
      const a = e.spin + (i * PI) / 2;
      const p = T['pod' + i];
      p.x = e.x + Math.cos(a) * 15; p.y = e.y + Math.sin(a) * 15; p.z = e.z + 1;
      const h = e.hs.find((q) => q.id === 'pod' + i);
      h.x = p.x; h.y = p.y; h.z = p.z;
      if (p.flash > 0) p.flash -= dt;
    }
    const hc = e.hs[0];
    hc.x = e.x; hc.y = e.y; hc.z = e.z + 2;
    T.core.x = e.x; T.core.y = e.y; T.core.z = e.z + 3;
    if (T.core.flash > 0) T.core.flash -= dt;
    const podsAlive = [0, 1, 2, 3].filter((i) => !T['pod' + i].dead).length;
    if (e.phase === 1 && podsAlive === 0) {
      e.phase = 2;
      say('jive', 'The pods are down! Its shield is off — hit the core!', 3);
      FX.flash = 0.4;
      Sound.play('warn');
    }
    if (e.phase === 2 && T.core.hp < T.core.max * 0.45) {
      e.phase = 3;
      say('waltz', 'It is overloading! Spiral pattern — find the gaps!', 3);
      Sound.play('warn');
    }
    if (e.dying) { bossDeathTick(g, e, dt, 14); return; }
    bossSum(e);
    if (g.state !== 'play' || e.rel > 152) return;
    e.atk -= dt;
    if (e.phase === 1 && e.atk <= 0) {
      for (let i = 0; i < 4; i++) {
        const p = T['pod' + i];
        if (p.dead) continue;
        after(i * 0.12, () => {
          if (!e.alive) return;
          const A = leadPoint(p.x, p.y, p.z + 3, 66, true);
          ebShot(p.x, p.y, p.z + 3, A[0], A[1], A[2], 66, 9, {});
          Sound.play('enemyShot', panOf(g, e), 0.6);
        });
      }
      e.atk = 2.0 / g.diff.fire;
    }
    if (e.phase >= 2 && e.atk <= 0) {
      // spiral arms
      const arms = e.phase === 3 ? 6 : 4;
      e.spiral += 0.35;
      for (let k = 0; k < arms; k++) {
        const a = e.spiral + (k * TAU) / arms;
        ebShot(e.x, e.y, e.z + 6, e.x + Math.cos(a) * 12, e.y + Math.sin(a) * 12, e.z + 6 + 70, 50, 8, { r: 0.85 });
      }
      if (Math.random() < 0.4) {
        const A = leadPoint(e.x, e.y, e.z + 6, 52, true);
        ebShot(e.x, e.y, e.z + 6, A[0], A[1], A[2], 52, 8, { r: 0.9 });
      }
      Sound.play('enemyShot', panOf(g, e), 0.5);
      e.atk = (e.phase === 3 ? 0.28 : 0.42) / g.diff.fire;
    }
    e.droneT -= dt;
    if (e.droneT <= 0 && e.phase >= 2) {
      for (let k = 0; k < 3; k++) spawnEnemy('drone', e.x + (k - 1) * 10, e.y + rnd(-6, 6), e.z + 12, { speed: 34, amp: 7, bx: e.x + (k - 1) * 10, by: e.y });
      e.droneT = 8;
    }
    e.ringT -= dt;
    if (e.ringT <= 0 && e.phase === 3) {
      for (let k = 0; k < 18; k++) {
        const a = (k / 18) * TAU;
        ebShot(e.x, e.y, e.z + 5, e.x + Math.cos(a) * 7, e.y + Math.sin(a) * 7, e.z + 5 + 44, 38, 8, { r: 0.8 });
      }
      for (let k = 0; k < 3; k++) {
        const A = leadPoint(e.x, e.y, e.z + 5, 44, true);
        ebShot(e.x, e.y, e.z + 5, A[0] + rnd(-5, 5), A[1] + rnd(-4, 4), A[2], 44, 8, { r: 0.9 });
      }
      e.ringT = 5;
      Sound.play('warn');
    }
  },
  hit(e, dmg, idx, src, g) {
    if (e.dying) return;
    const h = e.hs[idx];
    if (!h) return;
    if (h.id.startsWith('pod')) bossPartHit(g, e, h.id, dmg, src);
    else if (h.id === 'core' && e.phase >= 2) {
      bossPartHit(g, e, 'core', dmg, src);
      if (e.parts.core.dead) {
        bossSum(e);
        bossDeath(g, e);
      }
    } else deflectSpark(g, e, idx);
    bossSum(e);
  },
  draw(e, R) {
    const T = e.parts;
    const ds = e.dying ? 0.25 + 0.25 * Math.sin(e.t * 40) : 0;
    R.draw(M.fCore, e.x, e.y, e.z, null, 1, 1, 1, STY.ship, T.core.flash > 0 ? 0.9 : ds);
    R.draw(M.fRing, e.x, e.y, e.z + 1, qFromYPR(0, 0, e.spin), 1, 1, 1, STY.ship, ds);
    for (let i = 0; i < 4; i++) {
      const p = T['pod' + i];
      if (p.dead) {
        if (Math.random() < 0.15) FX.smokeTrail(p.x, p.y, p.z, 0.8);
        continue;
      }
      R.draw(M.fPod, p.x, p.y, p.z, qFromYPR(0, 0, e.spin + (i * PI) / 2 + PI / 2), 1, 1, 1, STY.ship, p.flash > 0 ? 0.9 : 0);
    }
    const open = e.phase >= 2;
    const sty = mkStyle({ mat: MAT.EMIT, r: 1, g: open ? 0.4 : 0.8, b: open ? 0.9 : 0.3, em: open ? 1.8 : 0.5, ol: 0.5, sh: 0 });
    R.draw(M.sphere, e.x, e.y, e.z + 6.3, null, 2.1, 2.1, 1.0, sty, T.core.flash > 0 ? 0.9 : 0);
    glow(e.x, e.y, e.z + 7.2, open ? 9 : 4, 1, open ? 0.4 : 0.7, open ? 0.9 : 0.3, 0.6);
  },
};

/* ===================================================================
   BOSS 2B — CONTRABASS WYRM (canyon)
   =================================================================== */
EDEF.wyrm = {
  mesh: 'wyHead', r: 6, hp: 1, noScale: true, score: 13000, boom: 4, boss: true, big: true, persist: true, contactDmg: 16, sty: STY.ship, noDrop: true, bombDmg: 6,
  lockPos(e) { return [e.x, e.y, e.z + 3]; },
  init(e, g) {
    const m = g.diff.enemyHp;
    e.parts = { head: { hp: 110 * m, max: 110 * m, dead: false, flash: 0 } };
    e.hs = [{ id: 'head', r: 5.4 }];
    for (let i = 0; i < 10; i++) e.hs.push({ id: 'seg' + i, r: 3.4, noContact: false });
    bossSum(e);
    e.name = 'CONTRABASS WYRM';
    e.rel = e.rel || 250;
    e.relT = 130;
    e.baseX = e.x; e.baseY = e.y;
    e.trail = [];
    e.trT = 0;
    e.atk = 2.5; e.spitT = 4; e.diveT = 9; e.phase = 1; e.diving = 0;
    e.phaseX = 0;
  },
  update(e, dt, g) {
    const P = g.player;
    const frac = e.parts.head.hp / e.parts.head.max;
    e.phase = frac < 0.35 ? 3 : frac < 0.7 ? 2 : 1;
    const spd = 0.7 + (e.phase - 1) * 0.25;
    e.phaseX += dt * spd;
    // dive logic
    e.diveT -= dt;
    if (!e.dying && e.diveT <= 0 && g.state === 'play') {
      e.diving = 1.6;
      e.diveT = 8.5 - e.phase;
      say('jive', 'Look out! It is diving at you!', 1.8);
      Sound.play('warn');
    }
    if (e.diving > 0) {
      e.diving -= dt;
      const k = Math.sin(clamp(1 - e.diving / 1.6, 0, 1) * PI);
      e.relT = lerp(130, 5, k);
    } else e.relT = 130;
    e.rel = approach(e.rel, e.relT, dt * (e.diving > 0 ? 170 : 45));
    const ampX = 13, ampY = 7;
    const baseX = railCenter(g.s + e.rel);
    const tx = baseX + Math.sin(e.phaseX * 1.3) * ampX + (e.diving > 0 ? (P.x - baseX) * 1.0 * Math.sin(clamp(1 - e.diving / 1.6, 0, 1) * PI) : 0);
    const ty = e.baseY + Math.sin(e.phaseX * 1.9 + 1) * ampY + (e.diving > 0 ? (P.y - e.baseY) * 1.0 * Math.sin(clamp(1 - e.diving / 1.6, 0, 1) * PI) : 0);
    e.x = tx; e.y = ty;
    e.z = P.z - e.rel;
    // trail in rail-relative coords
    e.trT -= dt;
    if (e.trT <= 0) {
      e.trail.unshift({ x: e.x, y: e.y, rel: e.rel });
      if (e.trail.length > 90) e.trail.pop();
      e.trT = 0.05;
    }
    const segPos = [];
    for (let i = 0; i < 10; i++) {
      const tr = e.trail[Math.min(e.trail.length - 1, (i + 1) * 3 + 1)] || { x: e.x, y: e.y, rel: e.rel + (i + 1) * 6 };
      const rel = Math.max(tr.rel, e.rel + (i + 1) * 3.0) + (i + 1) * 3.2;
      segPos.push({ x: tr.x, y: tr.y, z: P.z - rel });
      const h = e.hs[i + 1];
      h.x = tr.x; h.y = tr.y; h.z = P.z - rel;
    }
    e.segPos = segPos;
    const hh = e.hs[0];
    hh.x = e.x; hh.y = e.y; hh.z = e.z + 2;
    e.parts.head.x = e.x; e.parts.head.y = e.y; e.parts.head.z = e.z + 2;
    if (e.parts.head.flash > 0) e.parts.head.flash -= dt;
    // tail segments hurt on contact (handled by framework with hs) — head included
    if (e.dying) { bossDeathTick(g, e, dt, 9); return; }
    bossSum(e);
    if (g.state !== 'play' || e.rel > 140) return;
    e.atk -= dt;
    if (e.atk <= 0) {
      const n = 3 + e.phase;
      for (let k = 0; k < n; k++) {
        const a = (k - (n - 1) / 2) * 0.22;
        const A = leadPoint(e.x, e.y - 1, e.z + 6, 62, true);
        const b = ebShot(e.x, e.y - 1, e.z + 6, A[0], A[1], A[2], 62, 9, {});
        if (b) b.vx += Math.sin(a) * 62;
      }
      Sound.play('enemyShot', panOf(g, e), 0.8);
      e.atk = (2.2 - e.phase * 0.25) / g.diff.fire;
    }
    e.spitT -= dt;
    if (e.spitT <= 0) {
      // spines: spawn missiles from random segments
      const sp = pick(segPos);
      spawnEnemy('missile', sp.x, sp.y, sp.z, {});
      Sound.play('missile', panOf(g, e));
      e.spitT = (e.phase === 3 ? 2.5 : 4.5) / g.diff.fire;
    }
  },
  hit(e, dmg, idx, src, g) {
    if (e.dying) return;
    const h = e.hs[idx];
    if (!h) return;
    if (h.id === 'head') {
      bossPartHit(g, e, 'head', dmg, src);
      if (e.parts.head.dead) {
        bossSum(e);
        bossDeath(g, e);
      }
    } else {
      // armored segments take a tiny scratch
      deflectSpark(g, e, idx);
      e.parts.head.hp = Math.max(1, e.parts.head.hp - dmg * 0.08);
    }
    bossSum(e);
  },
  draw(e, R, g) {
    const ds = e.dying ? 0.25 + 0.25 * Math.sin(e.t * 40) : 0;
    const P = g.player;
    // face the player: head model faces +Z
    const tilt = qLook(vnorm([P.x - e.x, (P.y - e.y) * 0.5, -(e.z - P.z)]), [0, 1, 0]);
    void tilt;
    R.draw(M.wyHead, e.x, e.y, e.z, qFromYPR(0, Math.sin(e.t * 1.3) * 0.12, Math.sin(e.t * 0.9) * 0.15), 1, 1, 1, STY.ship, e.parts.head.flash > 0 ? 0.9 : ds);
    glow(e.x, e.y + 1.4, e.z + 5.3, 4, 1, 0.8, 0.2, 0.55);
    if (e.segPos) {
      for (let i = 0; i < e.segPos.length; i++) {
        const s = e.segPos[i];
        const sc = 1 - i * 0.045;
        R.draw(M.wySeg, s.x, s.y, s.z, qFromYPR(0, 0, e.t * 0.6 + i), sc, sc, sc, STY.ship, ds);
      }
    }
  },
};

/* ===================================================================
   BOSS 3 — VIPER VIRTUOSO  (all-range rival ace)
   =================================================================== */
EDEF.ace = Object.assign({}, EDEF.fighter, {
  mesh: 'ace', r: 3.0, hp: 1, noScale: true, score: 9000, boom: 3, boss: true, big: true, persist: true, contactDmg: 18, noDrop: true, bombDmg: 12,
  lockPos(e) { return [e.x, e.y, e.z]; },
  init(e, g) {
    EDEF.fighter.init(e, g);
    const m = g.diff.enemyHp;
    e.parts = { hull: { hp: 70 * m, max: 70 * m, dead: false, flash: 0 } };
    bossSum(e);
    e.name = 'VIPER VIRTUOSO';
    e.spd = 80 * g.diff.spd;
    e.turn = 1.9;
    e.evadeT = 3;
    e.volleyT = 4;
    e.shieldT = 0;
    e.hs = null;
  },
  update(e, dt, g) {
    if (e.dying) {
      e.deathT += dt;
      e.fwd = vnorm([e.fwd[0], e.fwd[1] - dt * 0.6, e.fwd[2]]);
      e.x += e.fwd[0] * 40 * dt; e.y += e.fwd[1] * 40 * dt; e.z += e.fwd[2] * 40 * dt;
      e.rollSpin = (e.rollSpin || 0) + dt * 9;
      arenaOrient(e, dt);
      FX.smokeTrail(e.x, e.y, e.z, 1.2);
      if (Math.random() < dt * 12) FX.explosion(e.x + rnd(-2, 2), e.y + rnd(-2, 2), e.z + rnd(-2, 2), rnd(1, 2));
      if (e.deathT > 2.4 || e.y < 5) finishBoss(g, e);
      return;
    }
    EDEF.fighter.update(e, dt, g);
    if (!e.alive) return;
    const P = g.player;
    if (e.parts.hull.flash > 0) e.parts.hull.flash -= dt;
    // dancing evasion: occasional barrel-roll jink
    e.evadeT -= dt;
    if (e.evadeT <= 0) {
      e.evadeT = rnd(2.5, 4.5);
      e.rollSpin = 0.001;
      e.jinkT = 0.7;
      e.fwd = vnorm([e.fwd[0] + rnd(-0.5, 0.5), e.fwd[1] + rnd(-0.3, 0.3), e.fwd[2] + rnd(-0.5, 0.5)]);
    }
    if (e.jinkT > 0) {
      e.jinkT -= dt;
      e.rollSpin = (e.rollSpin || 0) + dt * 9;
      if (e.jinkT <= 0) e.rollSpin = 0;
    }
    e.volleyT -= dt;
    if (e.volleyT <= 0 && g.state === 'play') {
      const d = Math.hypot(P.x - e.x, P.y - e.y, P.z - e.z);
      if (d < 220) {
        for (let i = 0; i < 2; i++) spawnEnemy('arMissile', e.x + (i ? 4 : -4), e.y, e.z, { fwd: e.fwd.slice() });
        Sound.play('missile', panOf(g, e));
        say('tango', 'Missiles on the Viper — pop flares… I mean, roll!', 2);
      }
      e.volleyT = 7 / g.diff.fire;
    }
    glow(e.x - e.fwd[0] * 3, e.y - e.fwd[1] * 3, e.z - e.fwd[2] * 3, 2.2, 1, 0.8, 0.3, 0.7);
    bossSum(e);
    g.bossBar = { name: e.name, e };
  },
  hit(e, dmg, idx, src, g) {
    if (e.dying) return;
    e.parts.hull.hp -= dmg;
    e.parts.hull.flash = 0.08;
    e.flash = 0.08;
    if (PLAYER_KILL_SRC.has(src)) g.hitMark = 0.2;
    Sound.play('hit', panOf(g, e));
    if (e.parts.hull.hp <= 0) {
      e.parts.hull.hp = 0;
      bossSum(e);
      e.dying = true;
      e.deathT = 0;
      e.invuln = true;
      e.hs = null;
      g.bossBar = { name: e.name, e, dying: true };
      g.eb.length = 0;
      for (const x of g.enemies) if (x !== e && x.alive) { x.noCredit = true; x.noDrop = true; killEnemy(g, x, 'self'); }
      g.timeScale = 0.4;
      after(0.9, () => { g.timeScale = 1; });
      FX.flash = 0.6;
      Music.fadeOut(1.5);
      Sound.play('explodeBig');
    }
    bossSum(e);
  },
  onDeath() { /* handled through finishBoss */ },
});

/* ===================================================================

EDEF.maestro = {

      core: { hp: 70 * m, max: 70 * m, dead: false, flash: 0 },
    };
    e.hs = [{ id: 'fistL', r: 6 }, { id: 'fistR', r: 6 }, { id: 'head', r: 11 }, { id: 'core', r: 4.2, dead: true }];
    for (const h of e.hs) { h.x = e.x; h.y = e.y; h.z = e.z; }
    bossSum(e);
    e.name = 'MAESTRO DISSONANT';
    e.phase = 1;
    e.rel = e.rel || 280;
    e.baseX = e.x; e.baseY = e.y;
    e.fist = {
      L: { s: 'idle', t: 0, x: e.x - 26, y: e.y - 6, z: e.z + 8, tx: 0, ty: 0 },
      R: { s: 'idle', t: 0, x: e.x + 26, y: e.y - 6, z: e.z + 8, tx: 0, ty: 0 },
    };
    e.slamT = 3.5; e.atk = 2; e.beamT = 8; e.dronesT = 9; e.batonA = 0; e.ringT = 4; e.sweep = null;
    e.haloA = 0;
  },
  update(e, dt, g) {
    const P = g.player;
    const T = e.parts;
    e.rel = approach(e.rel, 150, dt * 40);
    e.z = P.z - e.rel;
    e.x = e.baseX + Math.sin(e.t * 0.3) * 8;
    e.y = e.baseY + Math.sin(e.t * 0.5) * 3;
    e.haloA += dt * (e.phase === 3 ? 1.4 : 0.5);
    const dzRail = e.zPrev === undefined ? 0 : e.z - e.zPrev;
    e.zPrev = e.z;
    T.head.x = e.x; T.head.y = e.y; T.head.z = e.z + 6;
    T.core.x = e.x; T.core.y = e.y - 2; T.core.z = e.z + 8;
    for (const k of Object.keys(T)) if (T[k].flash > 0) T[k].flash -= dt;
    // fists
    for (const side of ['L', 'R']) {
      const F = e.fist[side];
      const part = T['fist' + side];
      const sgn = side === 'L' ? -1 : 1;
      if (F.s !== 'slam') F.z += dzRail; // the arena scrolls with the rail; fists ride along
      const homeX = e.x + sgn * 26, homeY = e.y - 6 + Math.sin(e.t * 1.3 + (side === 'L' ? 0 : 2)) * 3, homeZ = e.z + 8;
      if (F.s === 'idle') {
        F.x = damp(F.x, homeX, 4, dt); F.y = damp(F.y, homeY, 4, dt); F.z = damp(F.z, homeZ, 4, dt);
      } else if (F.s === 'aim') {
        F.t += dt;
        F.x = damp(F.x, F.tx, 5, dt); F.y = damp(F.y, F.ty, 5, dt); F.z = damp(F.z, e.z + 14, 4, dt);
        if (F.t > 0.85) { F.s = 'slam'; F.t = 0; Sound.play('whoosh', panOf(g, e)); }
      } else if (F.s === 'slam') {
        F.t += dt;
        F.z += 190 * dt;
        if (F.z > P.z - 6 || F.t > 1.1) { F.s = 'stuck'; F.t = 0; FX.addShake(0.5); FX.explosion(F.x, F.y, F.z, 1.4); Sound.play('explode', panOf(g, e)); }
      } else if (F.s === 'stuck') {
        F.t += dt;
        if (F.t > 1.0) { F.s = 'return'; F.t = 0; }
      } else if (F.s === 'return') {
        F.x = damp(F.x, homeX, 4, dt); F.y = damp(F.y, homeY, 4, dt); F.z = damp(F.z, homeZ, 5, dt);
        if (Math.abs(F.z - homeZ) < 4) F.s = 'idle';
      }
      part.x = F.x; part.y = F.y; part.z = F.z;
      const h = e.hs.find((q) => q.id === 'fist' + side);
      h.x = F.x; h.y = F.y; h.z = F.z;
      // contact damage from a slamming fist
      if ((F.s === 'slam' || F.s === 'stuck') && !part.dead && !e.dying && P.alive && g.state === 'play') {
        if (Math.hypot(F.x - P.x, F.y - P.y, F.z - P.z) < 7.5) {
          if (hurtPlayer(g, 22)) FX.explosion(P.x, P.y, P.z, 1.0);
        }
      }
    }
    const hh = e.hs.find((q) => q.id === 'head');
    hh.x = T.head.x; hh.y = T.head.y; hh.z = T.head.z;
    const hc = e.hs.find((q) => q.id === 'core');
    hc.x = T.core.x; hc.y = T.core.y; hc.z = T.core.z;
    // phases
    if (e.phase === 1 && T.fistL.dead && T.fistR.dead) {
      e.phase = 2;
      say('maestro', 'You... you dare silence my hands? Then LISTEN to my crescendo!', 3.2);
      Music.start('boss');
      FX.flash = 0.5;
      Sound.play('warn');
    }
    if (e.phase === 2 && T.head.hp < T.head.max * 0.35) {
      T.head.dead = true; // head breaks apart: exposes the core
      T.head.hp = 0;
      e.hs.find((q) => q.id === 'head').dead = true;
      e.phase = 3;
      hc.dead = false;
      FX.explosion(e.x, e.y + 4, e.z + 8, 5);
      FX.flash = 0.9;
      say('tango', 'The core is exposed — end this symphony, Ember!', 3);
      Sound.play('explodeBig');
    }
    if (e.dying) { bossDeathTick(g, e, dt, 18); return; }
    bossSum(e);
    if (g.state !== 'play' || e.rel > 162) return;

    // ---- attacks ----
    if (e.phase === 1) {
      e.slamT -= dt;
      if (e.slamT <= 0) {
        const side = !T.fistL.dead && (T.fistR.dead || Math.random() < 0.5) ? 'L' : 'R';
        const F = e.fist[side];
        if (F.s === 'idle') {
          F.s = 'aim'; F.t = 0; F.tx = P.x; F.ty = P.y;
          Sound.play('warn');
        }
        e.slamT = 3.8 / g.diff.fire;
      }
      e.atk -= dt;
      if (e.atk <= 0) {
        for (let k = 0; k < 5; k++) {
          const a = (k - 2) * 0.22;
          const A = leadPoint(e.x, e.y + 4, e.z + 12, 58, true);
          const b = ebShot(e.x, e.y + 4, e.z + 12, A[0], A[1], A[2], 58, 9, {});
          if (b) b.vx += Math.sin(a) * 58;
        }
        Sound.play('enemyShot', panOf(g, e), 0.8);
        e.atk = 2.4 / g.diff.fire;
      }
    } else {
      // conductor: beat-synced bullet rings
      e.ringT -= dt;
      if (e.ringT <= 0) {
        const n = e.phase === 3 ? 22 : 16;
        const off = Math.random() * TAU;
        for (let k = 0; k < n; k++) {
          const a = off + (k / n) * TAU;
          ebShot(e.x, e.y, e.z + 10, e.x + Math.cos(a) * 7, e.y + Math.sin(a) * 7, e.z + 10 + 44, 42, 8, { r: 0.85 });
        }
        for (let k = 0; k < 2; k++) {
          const A = leadPoint(e.x, e.y, e.z + 10, 46, true);
          ebShot(e.x, e.y, e.z + 10, A[0] + rnd(-4, 4), A[1] + rnd(-3, 3), A[2], 46, 8, { r: 0.9 });
        }
        Sound.play('enemyShot', panOf(g, e), 0.9);
        e.ringT = (e.phase === 3 ? 1.6 : 2.4) / g.diff.fire;
      }
      e.atk -= dt;
      if (e.atk <= 0) {
        for (const s of [-1, 1]) {
          const A = leadPoint(e.x + s * 5, e.y + 2, e.z + 12, 72, true);
          ebShot(e.x + s * 5, e.y + 2, e.z + 12, A[0], A[1], A[2], 72, 10, { sty: STY.eshot2 });
        }
        e.atk = 0.55 / g.diff.fire;
      }
      e.dronesT -= dt;
      if (e.dronesT <= 0) {
        for (let k = 0; k < 4; k++) spawnEnemy('drone', e.x + (k - 1.5) * 12, e.y + rnd(-8, 8), e.z + 14, { speed: 38, amp: 8, bx: e.x + (k - 1.5) * 12, by: e.y });
        e.dronesT = e.phase === 3 ? 7 : 10;
      }
      e.beamT -= dt;
      if (e.beamT <= 0 && !e.sweep) {
        e.sweep = { t: 0, y: rnd(P.y - 4, P.y + 4), dir: Math.random() < 0.5 ? -1 : 1 };
        Sound.play('warn');
        say('maestro', 'Hold this note!', 1.4);
        e.beamT = (e.phase === 3 ? 7 : 10) / g.diff.fire;
      }
      if (e.sweep) {
        const S = e.sweep;
        S.t += dt;
        if (S.t > 1.2 && S.t < 3.0) {
          const bx = e.x + S.dir * lerp(-45, 45, (S.t - 1.2) / 1.8);
          const bz = e.z + 14;
          // vertical beam sweeping sideways
          if (!e.dying && P.alive && P.rollT <= 0.02 && Math.abs(P.x - bx) < 2.6 && Math.abs(P.z - bz) < 200) {
            if (hurtPlayer(g, 16)) FX.explosion(P.x, P.y, P.z, 0.8);
          }
          S.bx = bx;
        }
        if (S.t > 3.2) e.sweep = null;
      }
    }
  },
  hit(e, dmg, idx, src, g) {
    if (e.dying) return;
    const h = e.hs[idx];
    if (!h) return;
    if (h.id === 'fistL' || h.id === 'fistR') bossPartHit(g, e, h.id, dmg, src);
    else if (h.id === 'head' && e.phase === 2) bossPartHit(g, e, 'head', dmg, src);
    else if (h.id === 'core' && e.phase === 3) {
      bossPartHit(g, e, 'core', dmg, src);
      if (e.parts.core.dead) {
        bossSum(e);
        bossDeath(g, e);
      }
    } else deflectSpark(g, e, idx);
    bossSum(e);
  },
  draw(e, R, g) {
    const T = e.parts;
    const ds = e.dying ? 0.25 + 0.25 * Math.sin(e.t * 40) : 0;
    const f = (k) => (T[k].flash > 0 ? 0.9 : 0);
    if (!T.head.dead || e.phase < 3) R.draw(M.mHead, e.x, e.y, e.z, null, 1, 1, 1, STY.ship, f('head') || ds);
    else {
      // broken head: draw jittered
      R.draw(M.mHead, e.x + rnd(-0.3, 0.3), e.y + 1, e.z, qFromYPR(0, 0, rnd(-0.03, 0.03)), 1, 1, 1, STY.ship, ds);
    }
    R.draw(M.mHalo, e.x, e.y, e.z - 2, qFromYPR(0, 0, e.haloA), 1, 1, 1, STY.ship, ds);
    for (const side of ['L', 'R']) {
      const F = e.fist[side];
      const part = T['fist' + side];
      if (part.dead) { if (Math.random() < 0.2) FX.smokeTrail(F.x, F.y, F.z, 1.2); continue; }
      const warn = F.s === 'aim' ? 0.4 + 0.4 * Math.sin(e.t * 30) : 0;
      R.draw(side === 'L' ? M.mFistL : M.mFistR, F.x, F.y, F.z, null, 1, 1, 1, STY.ship, f('fist' + side) || warn);
      if (F.s === 'aim') glow(F.x, F.y, F.z + 5, 10, 1, 0.3, 0.3, 0.5);
    }
    // eyes
    const eyeSty = mkStyle({ mat: MAT.EMIT, r: 1, g: 0.5, b: 0.15, em: e.phase >= 2 ? 1.9 : 0.8, ol: 0.5, sh: 0 });
    for (const s of [-1, 1]) {
      if (!T.head.dead) R.draw(M.sphere, e.x + s * 5, e.y + 2, e.z + 10.2, null, 1.8, 1.8, 0.7, eyeSty, 0);
      if (!T.head.dead) glow(e.x + s * 5, e.y + 2, e.z + 11, e.phase >= 2 ? 6 : 3, 1, 0.5, 0.2, 0.6);
    }
    // baton conducting
    const ba = Math.sin(e.t * (e.phase === 3 ? 6 : 3)) * 0.5;
    if (e.phase >= 2 && !T.head.dead) R.draw(M.mBaton, e.x + 18, e.y - 6, e.z + 14, qFromYPR(0.6, 0.2, ba), 1, 1, 1, STY.ship, 0);
    if (e.phase === 3) {
      const cs = mkStyle({ mat: MAT.EMIT, r: 1, g: 0.35, b: 0.8, em: 1.5, ol: 0.6, sh: 0 });
      R.draw(M.mCore, e.x, e.y - 2, e.z + 8, qFromYPR(e.t * 1.5, 0, 0), 1, 1, 1, cs, f('core'));
      glow(e.x, e.y - 2, e.z + 8, 14, 1, 0.4, 0.8, 0.5);
    }
    // sweeping beam
    if (e.sweep) {
      const S = e.sweep;
      if (S.t < 1.2) {
        const px = e.x + S.dir * -45;
        glow(px, g.player.y, e.z + 14, 6 + S.t * 8, 1, 0.3, 0.9, 0.6);
      } else if (S.t < 3.0 && S.bx !== undefined) {
        const sty = mkStyle({ mat: MAT.EMIT, r: 1, g: 0.35, b: 0.95, em: 1.6, ol: 0.5, sh: 0 });
        const z0 = e.z + 14, z1 = g.player.z + 30;
        R.draw(M.cube, S.bx, g.player.y, (z0 + z1) / 2, null, 3.0, 60, Math.abs(z1 - z0), sty, 0);
        glow(S.bx, g.player.y, g.player.z, 8, 1, 0.4, 0.9, 0.5);
      }
    }
  },
};

const STAGES = {};
const PROP_BACK = 320;

const _styleCache = new Map();
function cs(col, mat, o) {
  const key = col.join(',') + '|' + (mat || 0) + '|' + (o ? JSON.stringify(o) : '');
  let s = _styleCache.get(key);
  if (!s) {
    s = mkStyle(Object.assign({ r: col[0], g: col[1], b: col[2], mat: mat || 0 }, o || {}));
    _styleCache.set(key, s);
  }
  return s;
}

function ev(g, s, fn) {
  g.events.push({ s, fn });
}

/* register a static prop: stored by progress distance s = -z */
function prop(g, mesh, x, y, z, sx, sy, sz, sty, o) {
  const p = Object.assign({ mesh, x, y, z, s: -z, sx, sy, sz, sty, q: null }, o || {});
  if (p.ry !== undefined || p.rx !== undefined || p.rz !== undefined) p.q = qFromYPR(p.ry || 0, p.rx || 0, p.rz || 0);
  g.props.push(p);
  return p;
}

function drawProps(g, R, far) {
  const lo = lowerBound(g.props, 's', g.s - 60 - PROP_BACK);
  const hi = g.s + far;
  for (let i = lo; i < g.props.length; i++) {
    const p = g.props[i];
    if (p.s > hi) break;
    if (p.hide) continue;
    if (p.hx !== undefined || p.r !== undefined) {
      // never render a solid prop from the inside (the ink hull would blacken the screen)
      const cm = g.cam;
      const py = p.cy !== undefined ? p.cy : p.y;
      if (p.hx !== undefined ? Math.abs(cm.ex - p.x) < p.hx + 0.8 && Math.abs(cm.ey - py) < p.hy + 0.8 && Math.abs(cm.ez - p.z) < p.hz + 0.8 : Math.hypot(cm.ex - p.x, cm.ey - py, cm.ez - p.z) < p.r + 0.8) continue;
    }
    R.draw(M[p.mesh], p.x, p.y, p.z, p.q, p.sx, p.sy, p.sz, p.sty, p.flash || 0);
    if (p.glow) glow(p.x, p.gy !== undefined ? p.gy : p.y, p.z, p.glow[0], p.glow[1], p.glow[2], p.glow[3], p.glow[4] || 0.6);
  }
}

/* ground plane that follows the camera */
function drawGroundPlane(R, camPos, sty, y, size) {
  R.draw(M.plane, camPos[0], y, camPos[2] - size * 0.28, null, size, 1, size, sty, 0);
}

/* ---- formation spawner (rails) ---- */
function wave(g, type, n, o) {
  o = o || {};
  const P = g.player;
  const dist = o.dist || 240;
  const gap = o.gap || 9;
  const pattern = o.pattern || 'vee';
  const out = [];
  for (let i = 0; i < n; i++) {
    const c = i - (n - 1) / 2;
    let lx = o.lx || 0, ly = o.ly !== undefined ? o.ly : 12, zo = 0;
    if (pattern === 'line') lx += c * gap;
    else if (pattern === 'vee') { lx += c * gap; zo = Math.abs(c) * gap * 0.8; }
    else if (pattern === 'col') { zo = i * gap * 1.7; lx += Math.sin(i * 0.9) * (o.sway || 0); }
    else if (pattern === 'rand') { lx += rnd(-(o.w || 20), o.w || 20); ly += rnd(-(o.h || 7), o.h || 7); zo = rnd(0, gap * n * 0.6); }
    else if (pattern === 'wall') { lx += c * gap; ly += ((i % 2) ? 1 : -1) * (o.h || 3); }
    else if (pattern === 'stair') { lx += c * gap; ly += c * (o.h || 2.4); zo = i * 4; }
    const z = P.z - dist - zo - (o.zExtra || 0);
    const cx = railCenter(-z);
    const x = cx + lx;
    const opts = Object.assign({}, o.opts || {});
    if (o.fromSide) {
      const spd = Math.abs(opts.vx !== undefined ? opts.vx : (o.sideSpeed || 44));
      opts.vx = o.fromSide * spd;
    }
    if (opts.bx === undefined) opts.bx = x;
    if (opts.by === undefined) opts.by = ly;
    const xx = o.fromSide ? cx - o.fromSide * (o.sideX || 60) + (o.fromSide ? c * (o.stagger || 0) : 0) : x;
    if (o.fromSide) opts.bx = xx;
    const e = spawnEnemy(type, xx, ly, z, opts);
    if (e) out.push(e);
  }
  return out;
}

function ringsArc(g, n, lx0, ly0, lx1, ly1, dist, spacing, o) {
  o = o || {};
  const P = g.player;
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0 : i / (n - 1);
    const lx = lerp(lx0, lx1, t) + Math.sin(t * PI) * (o.bulge || 0);
    const ly = lerp(ly0, ly1, t) + Math.sin(t * PI * 2) * (o.wave || 0);
    const z = P.z - dist - i * spacing;
    const type = o.goldLast && i === n - 1 ? 'gold' : (o.type || 'silver');
    spawnItem(type, railCenter(-z) + lx, ly, z);
  }
}
function itemAt(g, type, lx, ly, dist) {
  const z = g.player.z - dist;
  spawnItem(type, railCenter(-z) + lx, ly, z);
}

function chaseWing(g, ids) {
  const list = Array.isArray(ids) ? ids : [ids];
  for (const id of list) {
    const w = g.wing.find((q) => q.id === id && q.alive && !q.leaving && !q.chasedBy);
    if (w) {
      const e = spawnEnemy('chaser', w.x, w.y, w.z + 15, { chaseTarget: w });
      w.chasedBy = e;
      w.helpT = 0;
      return true;
    }
  }
  return false;
}

/* standard rails-stage scenery drawing wrapper */
function railScenery(g, R, camPos, cfg) {
  const S = g.stage;
  if (cfg.ground) cfg.ground(g, R, camPos);
  drawProps(g, R, cfg.far || 760);
  if (S.sceneryExtra) S.sceneryExtra(g, R, camPos);
}

/* ============================================================================
   57_stage2.js — STAGE 2A: STACCATO BELT (asteroids, space) and
                  STAGE 2B: CRESCENDO CANYON (winding canyon, laser gates).
   ========================================================================== */
function asteroidField(G, n, o) {
  o = o || {};
  const P = G.player;
  for (let i = 0; i < n; i++) {
    const z = P.z - (o.dist || 250) - i * (o.spacing || 20) - rnd(0, 12);
    const rad = rnd(o.rMin || 2.6, o.rMax || 5.2);
    spawnEnemy('asteroid', railCenter(-z) + rnd(-(o.w || 26), o.w || 26), (o.cy || 0) + rnd(-(o.h || 15), o.h || 15), z, {
      r: rad, speed: o.speed !== undefined ? o.speed : rnd(0, 6), hp: Math.max(3, rad * 1.3), mi: rndi(0, 3),
    });
  }
}

/* ============================================================================
   58_stage34.js — STAGE 3: DANCEFLOOR DOGFIGHT (all-range arena, rival ace)
                   STAGE 4: DISCORD CORE (final run + Maestro Dissonant)

/* ---------------------------------------------------------------- 3 */
STAGES.s3 = {
  id: 's3', name: 'DANCEFLOOR DOGFIGHT', planet: 'RHUMBA CITY', mode: 'allrange', speed: 72, medalHits: 30, quota: 26, rivalAt: 20,
  blurb: 'All-range combat over a neon dance floor. Clear the skies, then face the rival ace, Viper Virtuoso.',
  tips: ['Press {uturn} for a quick U-turn.', 'Enemies on your tail? Barrel-roll to reflect shots.', 'Use the radar — red dots are enemies.'],
  arena: 380, arenaCz: 0, groundY: 0, ceiling: 170, spawn: [0, 52, 210], spawnYaw: 0,
  bounds: { x0: -1, x1: 1, y0: 0, y1: 1 },
  env: ENV.arena, music: 'arena', bossMusic: 'boss', introTime: 3.0, wingmen: true,
  victoryLine: 'The Viper is grounded! Rhumba City is free — nice flying, Ember!',

  build(g) {
    const rng = mkRng(4421);
    const r = (a, b) => a + rng() * (b - a);
    g.bld = [];
    g.spawnT = 3;
    g.itemT = 12;
    g.arenaSpawned = 0;
    g.rivalOn = false;
    const cols = [[0.2, 0.18, 0.38], [0.14, 0.2, 0.4], [0.28, 0.14, 0.38], [0.12, 0.16, 0.3], [0.3, 0.2, 0.42]];
    const neon = [[1.0, 0.3, 0.8], [0.3, 0.95, 1.0], [1.0, 0.8, 0.3], [0.6, 0.4, 1.0]];
    for (let gx = -360; gx <= 360; gx += 80) {
      for (let gz = -360; gz <= 360; gz += 80) {
        const x = gx + r(-14, 14), z = gz + r(-14, 14);
        if (Math.hypot(x, z - 40) < 95 || Math.hypot(x, z - 210) < 80 || Math.hypot(x, z - 130) < 60) continue;
        if (rng() < 0.42) continue;
        const w = r(18, 38), d = r(18, 38);
        const h = rng() < 0.2 ? r(90, 130) : r(24, 74);
        g.bld.push({ x, z, hx: w / 2, hz: d / 2, h, hy: h / 2, col: pick(cols), neon: pick(neon), w, d, spire: rng() < 0.3, speaker: rng() < 0.18 });
      }
    }
    // a few floating "disco" orbs well above the action
    g.orbs = [];
    for (let i = 0; i < 5; i++) g.orbs.push({ x: r(-300, 300), y: r(150, 190), z: r(-300, 300), r: r(10, 20), ph: r(0, TAU) });

    const E = (t, fn) => ev(g, t, fn);
    E(0.5, () => say('lento', 'Foxtrot Flight, Rhumba City is a Static Fleet landing zone. Clear the dance floor.', 4));
    E(5.5, () => say('waltz', 'This is all-range combat. Fly free! {uturn} flips you around in a heartbeat.', 4));
    E(11, () => say('jive', 'Watch the radar in the corner — red dots are bandits.', 3.2));
    setObjective('Destroy the Static Fleet');
  },

  intro(g) {
    for (const w of g.wing) {
      w.fwd = fwdFromAngles(g.player.yaw, 0);
      w.speed = 70;
      w.x = g.player.x + w.info.slot[0] * 1.5;
      w.y = g.player.y + w.info.slot[1];
      w.z = g.player.z + 14 + w.info.slot[2];
    }
  },

  onStart(g) {
    // opening wave
    for (let i = 0; i < 4; i++) {
      const p = arenaSpawnPoint(g, 220);
      spawnEnemy('fighter', p[0], p[1], p[2], {});
      g.arenaSpawned++;
    }
  },

  onRespawn(g) {
    g.spawnT = 3;
    if (g.rivalOn && !g.bossDefeated) {
      const p = arenaSpawnPoint(g, 260);
      startBoss(g, 'ace', p[0], p[1], 0, { z: p[2] });
    }
    // wingmen return to formation
    for (const w of g.wing) {
      w.x = g.player.x + w.info.slot[0] * 1.5; w.y = g.player.y + w.info.slot[1]; w.z = g.player.z + 14 + w.info.slot[2];
      w.fwd = fwdFromAngles(g.player.yaw, 0);
    }
  },

  solidAt(x, y, z, r) {
    const B = G.bld;
    for (let i = 0; i < B.length; i++) {
      const b = B[i];
      if (Math.abs(x - b.x) < b.hx + r && Math.abs(z - b.z) < b.hz + r && y < b.h + r) return true;
    }
    return false;
  },
  collide(x, y, z, r) {
    const B = G.bld;
    for (let i = 0; i < B.length; i++) {
      const b = B[i];
      const dx = x - b.x, dz = z - b.z;
      const ox = b.hx + r - Math.abs(dx), oz = b.hz + r - Math.abs(dz), oy = b.h + r - y;
      if (ox > 0 && oz > 0 && oy > 0) {
        if (oy <= ox && oy <= oz) return { nx: 0, ny: 1, nz: 0, d: oy + 0.2 };
        if (ox <= oz) return { nx: Math.sign(dx) || 1, ny: 0, nz: 0, d: ox + 0.2 };
        return { nx: 0, ny: 0, nz: Math.sign(dz) || 1, d: oz + 0.2 };
      }
    }
    return null;
  },

  update(g, dt) {
    if (g.state !== 'play' || g.bossDefeated || (g.boss && g.boss.dying)) return;
    const S = g.stage;
    const P = g.player;
    const live = g.enemies.filter((e) => e.alive && (e.type === 'fighter' || e.type === 'heavy')).length;
    g.spawnT -= dt;
    const kills = g.arenaKills;
    const wantMax = g.rivalOn ? 2 : kills < 6 ? 5 : kills < 14 ? 6 : 7;
    if (g.spawnT <= 0 && live < wantMax && (g.rivalOn || g.arenaKills + live < S.rivalAt + 6)) {
      const p = arenaSpawnPoint(g, 230);
      const heavy = !g.rivalOn && g.arenaSpawned > 6 && g.arenaSpawned % 7 === 0;
      spawnEnemy(heavy ? 'heavy' : 'fighter', p[0], p[1], p[2], {});
      g.arenaSpawned++;
      g.spawnT = g.rivalOn ? 7 : rnd(1.8, 3.2);
    }
    // halfway talk
    if (kills >= 12 && !g.said12) {
      g.said12 = true;
      say('tango', 'Halfway through the guest list. Keep it up, fox!', 2.6);
    }
    // rival appears
    if (!g.rivalOn && kills >= S.rivalAt) {
      g.rivalOn = true;
      const p = arenaSpawnPoint(g, 260);
      startBoss(g, 'ace', p[0], p[1], 0, { z: p[2] });
      say('maestro', 'Enough warm-up. Viper Virtuoso — take the stage.', 3);
      after(3.4, () => say('tango', 'That ace is fast... Ember, he is yours. We will cover you!', 3));
      setObjective('Defeat the Viper Virtuoso');
    }
    // supplies
    g.itemT -= dt;
    if (g.itemT <= 0) {
      g.itemT = rnd(12, 18);
      const roll = Math.random();
      const type = roll < 0.55 ? 'silver' : roll < 0.8 ? 'bomb' : roll < 0.92 ? 'gold' : 'laser';
      for (let tries = 0; tries < 8; tries++) {
        const a = rnd(0, TAU), rr = rnd(60, 240);
        const ix = Math.cos(a) * rr, iy = rnd(30, 80), iz = Math.sin(a) * rr;
        if (S.solidAt(ix, iy, iz, 8)) continue;
        spawnItem(type, ix, iy, iz, { ttl: 40 });
        break;
      }
    }
    void P;
  },

  drawScenery(g, R, camPos) {
    const floor = cs([0.12, 0.05, 0.24], MAT.NEON, { sh: 0, ol: 0 });
    R.draw(M.plane, camPos[0], 0, camPos[2], null, 2000, 1, 2000, floor, 0);
    const beat = Music.beat;
    for (const b of g.bld) {
      const dx = b.x - camPos[0], dz = b.z - camPos[2];
      if (dx * dx + dz * dz > 900 * 900) continue;
      R.draw(M.cubeB, b.x, 0, b.z, null, b.w, b.h, b.d, cs(b.col, MAT.BLD), 0);
      // neon roof cap
      R.draw(M.cubeB, b.x, b.h, b.z, null, b.w + 1.4, 1.6, b.d + 1.4, cs(b.neon, MAT.EMIT, { em: 0.9 + (Math.round(beat * 6) / 6) * 0.8, ol: 0.6, sh: 0 }), 0);
      glow(b.x, b.h + 2.4, b.z, 18 + beat * 8, b.neon[0], b.neon[1], b.neon[2], 0.28);
      if (b.spire) R.draw(M.antenna, b.x, b.h + 1.6, b.z, null, 1.4, 22, 1.4, cs(PAL.grey), 0);
      if (b.speaker) {
        const sc = 7 + beat * 0.8;
        R.draw(M.speaker, b.x, b.h + 1.6, b.z, null, sc, sc * 1.3, sc, cs(PAL.white), 0);
      }
    }
    for (const o of g.orbs) {
      const y = o.y + Math.sin(g.time * 0.5 + o.ph) * 3;
      R.draw(M.sphere, o.x, y, o.z, qFromYPR(g.time * 0.3, 0, 0), o.r, o.r, o.r, cs([0.85, 0.88, 1.0], MAT.STD, { em: 0.35 }), 0);
      glow(o.x, y, o.z, o.r * 3, 0.8, 0.7, 1, 0.16);
    }
  },

  drawExtra(g) {
    // searchlight beams swaying over the arena
    const beat = Music.beat;
    const cols = [[1.0, 0.3, 0.8], [0.3, 0.95, 1.0], [1.0, 0.8, 0.3], [0.6, 0.4, 1.0]];
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * TAU + g.time * 0.05;
      const x = Math.cos(a) * 300, z = Math.sin(a) * 300;
      const c = cols[i % cols.length];
      streak(x, 90, z, 3.2 + beat * 2, Math.sin(g.time * 0.6 + i) * 70, 190, Math.cos(g.time * 0.5 + i * 2) * 70, c[0], c[1], c[2], 0.2 + beat * 0.15);
    }
  },
};

EDEF.gate.draw = function (e, R) {
  const hw = e.w;
  const y0 = e.y0 || 0;
  const on = e.on;
  for (const s of [-1, 1]) {
    R.draw(M.pylon, e.x + s * hw, y0, e.z, null, 2.4, e.hgt, 2.4, STY.ship, 0);
    if (on) glow(e.x + s * hw, y0 + e.hgt + 0.5, e.z, 5, 1, 0.3, 0.3, 0.7);
  }
  if (on) {
    const gap0 = e.gapNow - e.gapH / 2, gap1 = e.gapNow + e.gapH / 2;
    const sty = mkStyle({ mat: MAT.EMIT, r: 1, g: 0.3, b: 0.35, em: 1.4, ol: 0.5, sh: 0 });
    const beam = (a, b) => {

    beam(gap1, y0 + e.hgt);

/* ---------------- 59_hud.js ---------------- */
/* ============================================================================
   59_hud.js — in-game HUD on a 2D canvas (design space ≈ 1920×1080, scaled), comm window
   with hand-drawn character portraits, reticles, lock-on brackets, radar.
   ========================================================================== */
const SPEAKERS = {
  lento: { name: 'LENTO', role: 'MISSION CONTROL', base: 640, kind: 'bot', color: '#9fc4ff' },
  waltz: { name: 'WALTZ', role: 'FOXTROT 2', base: 300, kind: 'norm', color: '#7fe08f' },
  tango: { name: 'TANGO', role: 'FOXTROT 3', base: 430, kind: 'norm', color: '#ff7b7b' },
  jive: { name: 'JIVE', role: 'FOXTROT 4', base: 760, kind: 'norm', color: '#c3f26a' },
  ember: { name: 'EMBER', role: 'FOXTROT LEAD', base: 520, kind: 'norm', color: '#ffb067' },
  maestro: { name: 'MAESTRO', role: 'STATIC FLEET', base: 150, kind: 'villain', color: '#d29bff' },
};

const Comms = {
  queue: [],
  cur: null,
  reset() {
    this.queue.length = 0;
    this.cur = null;
  },
  say(who, text, dur) {
    if (!Settings.comms) return;
    const sp = SPEAKERS[who];
    if (!sp) return;
    const t = text.replace(/\{(\w+)\}/g, (m, k) => Input.label(k));
    const m = { who, text: t, dur: dur || 2.5 + t.length * 0.03, shown: 0, t: 0, done: false };
    // drop stale queued lines from the same speaker when the queue gets long
    if (this.queue.length >= 3) this.queue.shift();
    this.queue.push(m);
  },
  update(dt) {
    if (!this.cur && this.queue.length) {
      this.cur = this.queue.shift();
      Sound.play('tick');
    }
    const c = this.cur;
    if (!c) return;
    c.t += dt;
    const rate = this.queue.length ? 70 : 42;
    const before = Math.floor(c.shown);
    c.shown = Math.min(c.text.length, c.shown + dt * rate);
    const after = Math.floor(c.shown);
    if (after > before && after % 2 === 0) {
      const sp = SPEAKERS[c.who];
      const ch = c.text[after - 1] || 'a';
      if (ch !== ' ') Sound.voiceBlip(sp.base, ch, sp.kind);
    }
    if (c.shown >= c.text.length) {
      c.done = true;
      c.hold = (c.hold || 0) + dt;
      const need = this.queue.length ? 0.5 : Math.max(1.2, c.dur - c.text.length / rate);
      if (c.hold > need) this.cur = null;
    }
  },
};

const Hud = {
  canvas: null,
  ctx: null,
  w: 0,
  h: 0,
  sc: 1,
  vw: 1920,
  vh: 1080,
  tmp: {},
  tmp2: {},

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.resize();
  },
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(2, Math.floor(window.innerWidth * dpr));
    const h = Math.max(2, Math.floor(window.innerHeight * dpr));
    if (this.canvas.width !== w || this.canvas.height !== h) {
      this.canvas.width = w;
      this.canvas.height = h;
    }
    this.w = w;
    this.h = h;
  },
  begin() {
    this.resize();
    const c = this.ctx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, this.w, this.h);
    this.sc = Math.min(this.w / 1920, this.h / 1080) * Settings.hudScale;
    this.vw = this.w / this.sc;
    this.vh = this.h / this.sc;
    c.setTransform(this.sc, 0, 0, this.sc, 0, 0);
  },
  clear() {
    this.resize();
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.ctx.clearRect(0, 0, this.w, this.h);
  },

  /* ------------ small drawing helpers ------------ */
  text(str, x, y, size, color, align, weight) {
    const c = this.ctx;
    c.font = (weight || '800') + ' ' + size + 'px "Trebuchet MS", "Segoe UI", system-ui, sans-serif';
    c.textAlign = align || 'left';
    c.textBaseline = 'alphabetic';
    c.lineJoin = 'round';
    c.lineWidth = Math.max(3, size * 0.16);
    c.strokeStyle = 'rgba(8,6,28,0.92)';
    c.strokeText(str, x, y);
    c.fillStyle = color || '#fff';
    c.fillText(str, x, y);
  },
  panel(x, y, w, h, r, fill, stroke, lw) {
    const c = this.ctx;
    c.beginPath();
    c.roundRect(x, y, w, h, r);
    c.fillStyle = fill || 'rgba(14,10,40,0.72)';
    c.fill();
    if (stroke) {
      c.lineWidth = lw || 3;
      c.strokeStyle = stroke;
      c.stroke();
    }
  },
  wrap(str, maxW, size) {
    const c = this.ctx;
    c.font = '700 ' + size + 'px "Trebuchet MS", "Segoe UI", system-ui, sans-serif';
    const words = str.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (c.measureText(t).width > maxW && line) {
        lines.push(line);
        line = w;
      } else line = t;
    }
    if (line) lines.push(line);
    return lines;
  },
  proj(x, y, z, out) {
    projectPoint(GPU.viewProj, x, y, z, 1, 1, out);
    out.x *= this.vw;
    out.y *= this.vh;
    return out;
  },

  /* ------------ main draw ------------ */
  draw(g, time) {
    this.begin();
    const c = this.ctx;
    const P = g.player;
    const vw = this.vw, vh = this.vh;
    const M0 = 64;

    if (g.state !== 'over') this.drawReticles(g, time);
    this.drawVitals(g, M0, vh - M0, time);
    this.drawScore(g, vw - M0, M0, time);
    this.drawWingStatus(g, vw - M0, 250);
    if (g.mode === 'allrange') this.drawRadar(g, vw - M0 - 150, vh - M0 - 150, 150);
    if (g.bossBar) this.drawBossBar(g, vw / 2, M0 + 8);
    else if (g.mode === 'allrange' && g.stage.quota && !g.rivalOn) this.drawQuota(g, vw / 2, M0 + 8);
    this.drawComm(g, M0, g.bossBar || (g.mode === 'allrange' && g.stage.quota && !g.rivalOn) ? M0 + 96 : M0);
    this.drawFlash(g, vw / 2, vh * 0.3);
    if (g.state === 'intro') this.drawIntroCard(g, vw / 2, vh * 0.42);
    if (g.state === 'clear') this.drawClear(g, vw / 2, vh * 0.4);
    if (g.state === 'dead') this.drawDead(g, vw / 2, vh * 0.45);
    if (g.mode === 'allrange' && P.outT > 0.3) {
      const a = 0.6 + 0.4 * Math.sin(time * 10);
      c.globalAlpha = a;
      this.text('RETURN TO THE COMBAT AREA', vw / 2, vh * 0.7, 46, '#ffd24a', 'center');
      c.globalAlpha = 1;
    }
    if (P.alive && P.shield < P.maxShield * 0.28 && g.state === 'play' && !g.attract) {
      c.globalAlpha = 0.55 + 0.45 * Math.sin(time * 12);
      this.text('! SHIELD CRITICAL !', vw / 2, vh - 150, 44, '#ff5a5a', 'center');
      c.globalAlpha = 1;
    }
    if (g.objective && !g.attract && g.state === 'play') {
      c.globalAlpha = 0.85;
      this.text('OBJECTIVE  ' + g.objective.toUpperCase(), vw / 2, vh - 36, 24, '#cfd6ff', 'center', '700');
      c.globalAlpha = 1;
    }
    if (g.attract) this.drawAttract(time);
    c.setTransform(1, 0, 0, 1, 0, 0);
  },

  drawAttract(time) {
    const c = this.ctx;
    const vw = this.vw, vh = this.vh;
    this.panel(vw / 2 - 210, vh - 150, 420, 86, 18, 'rgba(10,6,34,0.7)', 'rgba(255,255,255,0.25)', 2);
    c.globalAlpha = 0.65 + 0.35 * Math.sin(time * 4);
    this.text('PRESS ANY BUTTON', vw / 2, vh - 92, 38, '#ffffff', 'center');
    c.globalAlpha = 1;
    this.text('DEMO PLAY', vw / 2, 78, 40, '#ffd24a', 'center');
  },

  drawReticles(g, time) {
    const P = g.player;
    if (!P.alive || g.state === 'intro') return;
    const c = this.ctx;
    const far = this.proj(P.reticle[0], P.reticle[1], P.reticle[2], this.tmp);
    const near = this.proj(P.nearRet[0], P.nearRet[1], P.nearRet[2], this.tmp2);
    const ch = P.charge;
    // lock-on brackets
    for (let i = 0; i < P.locks.length; i++) {
      const e = P.locks[i];
      const lp = e.lockPos ? e.lockPos(e) : [e.x, e.y, e.z];
      const s = this.proj(lp[0], lp[1], lp[2], { x: 0, y: 0 });
      if (!s.vis) continue;
      const pxPerUnit = this.vh / (2 * Math.tan(GPU.fov / 2) * Math.max(s.w, 1));
      const sz = clamp(e.r * 1.5 * pxPerUnit, 22, 120);
      this.brackets(s.x, s.y, sz, time + i, '#ff5a5a');
      if (far.vis) {
        c.beginPath();
        c.moveTo(far.x, far.y);
        c.lineTo(s.x, s.y);
        c.strokeStyle = 'rgba(255,90,90,0.35)';
        c.lineWidth = 2;
        c.stroke();
      }
    }
    if (far.vis) {
      const hit = g.hitMark > 0;
      const col = ch > 0.2 ? '#7cf5ff' : hit ? '#ffffff' : '#7bffb0';
      if (ch > 0.16) {
        c.beginPath();
        c.setLineDash([10, 12]);
        c.arc(far.x, far.y, 190 * (this.vh / 1080), 0, TAU);
        c.lineWidth = 2;
        c.strokeStyle = 'rgba(124,245,255,0.35)';
        c.stroke();
        c.setLineDash([]);
      }
      c.save();
      c.translate(far.x, far.y);
      c.lineWidth = 4;
      c.strokeStyle = 'rgba(8,6,28,0.8)';
      c.beginPath();
      c.arc(0, 0, 30, 0, TAU);
      c.stroke();
      c.lineWidth = 2.5;
      c.strokeStyle = col;
      c.beginPath();
      c.arc(0, 0, 30, 0, TAU);
      c.stroke();
      for (let k = 0; k < 4; k++) {
        c.save();
        c.rotate((k * PI) / 2 + (ch > 0.2 ? time * 2 : 0));
        c.beginPath();
        c.moveTo(0, -30);
        c.lineTo(0, -44);
        c.lineWidth = 4;
        c.strokeStyle = 'rgba(8,6,28,0.8)';
        c.stroke();
        c.lineWidth = 2.5;
        c.strokeStyle = col;
        c.stroke();
        c.restore();
      }
      if (ch > 0.02) {
        c.beginPath();
        c.arc(0, 0, 40, -PI / 2, -PI / 2 + TAU * ch);
        c.lineWidth = 6;
        c.strokeStyle = ch >= 1 ? '#fff27a' : '#7cf5ff';
        c.stroke();
      }
      if (hit) {
        c.beginPath();
        c.moveTo(-14, -14); c.lineTo(14, 14); c.moveTo(14, -14); c.lineTo(-14, 14);
        c.lineWidth = 5;
        c.strokeStyle = '#fff';
        c.stroke();
      }
      c.restore();
    }
    if (near.vis && g.mode === 'rails') {
      c.save();
      c.translate(near.x, near.y);
      c.rotate(PI / 4);
      c.lineWidth = 5;
      c.strokeStyle = 'rgba(8,6,28,0.8)';
      c.strokeRect(-9, -9, 18, 18);
      c.lineWidth = 2.5;
      c.strokeStyle = '#7bffb0';
      c.strokeRect(-9, -9, 18, 18);
      c.restore();
    }
    // charge hint for brand-new players
    if (g.t > 6 && g.t < 26 && g.stage.id === 's1' && ch < 0.02 && !g.attract) {
      c.globalAlpha = 0.6;
      this.text('Hold ' + Input.label('charge') + ' to lock on', far.vis ? far.x : this.vw / 2, (far.vis ? far.y : this.vh / 2) + 86, 28, '#cfeaff', 'center');
      c.globalAlpha = 1;
    }
  },

  brackets(x, y, s, t, col) {
    const c = this.ctx;
    const k = 1 + Math.sin(t * 8) * 0.06;
    const h = s * k;
    c.lineWidth = 6;
    c.strokeStyle = 'rgba(8,6,28,0.85)';
    c.beginPath();
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      c.moveTo(x + sx * h, y + sy * h * 0.45);
      c.lineTo(x + sx * h, y + sy * h);
      c.lineTo(x + sx * h * 0.45, y + sy * h);
    }
    c.stroke();
    c.lineWidth = 3;
    c.strokeStyle = col;
    c.stroke();
  },

  drawVitals(g, x, yBottom, time) {
    const c = this.ctx;
    const P = g.player;
    const w = 470;
    const h = 28;
    const y = yBottom - 150;
    this.panel(x - 14, y - 52, w + 28, 214, 22, 'rgba(12,8,38,0.62)', 'rgba(255,255,255,0.14)', 2);
    this.text('SHIELD', x, y - 14, 30, '#ffffff', 'left');
    const frac = clamp(P.shield / P.maxShield, 0, 1);
    const low = frac < 0.28;
    const n = 20;
    const gap = 4;
    const cw = (w - gap * (n - 1)) / n;
    for (let i = 0; i < n; i++) {
      const on = (i + 1) / n <= frac + 0.0001 || (i / n < frac && frac - i / n > 0.5 / n);
      let col = frac > 0.6 ? '#5dff9a' : frac > 0.3 ? '#ffd84a' : '#ff5a5a';
      c.fillStyle = on ? col : 'rgba(255,255,255,0.12)';
      if (on && low && Math.sin(time * 14) > 0) c.fillStyle = '#ffffff';
      c.beginPath();
      c.roundRect(x + i * (cw + gap), y, cw, h, 5);
      c.fill();
    }
    // lives
    this.text('×' + Math.max(0, g.lives), x + w - 8, y - 14, 34, '#ffd24a', 'right');
    this.text('LIVES', x + w - 70, y - 14, 20, '#cfd6ff', 'right');
    // bombs
    this.text('BOMBS', x, y + 66, 22, '#cfd6ff', 'left');
    const bombs = g.attract ? 9 : g.bombCount;
    for (let i = 0; i < Math.min(9, bombs); i++) {
      c.beginPath();
      c.arc(x + 108 + i * 34, y + 58, 11, 0, TAU);
      c.fillStyle = '#ffb347';
      c.fill();
      c.lineWidth = 3;
      c.strokeStyle = 'rgba(8,6,28,0.9)';
      c.stroke();
      c.beginPath();
      c.arc(x + 108 + i * 34 + 3, y + 54, 3.5, 0, TAU);
      c.fillStyle = '#fff6d6';
      c.fill();
    }
    // boost gauge
    this.text('BOOST', x, y + 108, 22, '#cfd6ff', 'left');
    const bg = P.boostG;
    c.fillStyle = 'rgba(255,255,255,0.13)';
    c.beginPath(); c.roundRect(x + 108, y + 92, w - 108, 16, 8); c.fill();
    c.fillStyle = P.heat > 0 ? ((Math.sin(time * 18) > 0) ? '#ff5a5a' : '#802a2a') : '#58b8ff';
    c.beginPath(); c.roundRect(x + 108, y + 92, (w - 108) * bg, 16, 8); c.fill();
    if (P.heat > 0) this.text('OVERHEAT', x + w, y + 108, 20, '#ff8a8a', 'right');
    // laser level
    const lvl = g.laser;
    this.text('LASER', x, y + 144, 22, '#cfd6ff', 'left');
    for (let i = 0; i < 3; i++) {
      c.fillStyle = i < lvl ? ['#5dff9a', '#6ad6ff', '#ffe36a'][i] : 'rgba(255,255,255,0.14)';
      c.beginPath(); c.roundRect(x + 108 + i * 50, y + 128, 42, 14, 7); c.fill();
    }
    void time;
  },

  drawScore(g, xr, y, time) {
    const c = this.ctx;
    this.panel(xr - 380, y - 30, 394, 168, 22, 'rgba(12,8,38,0.62)', 'rgba(255,255,255,0.14)', 2);
    this.text('SCORE', xr - 360, y + 4, 22, '#cfd6ff', 'left');
    this.text(String(Math.floor(g.score)).padStart(8, '0'), xr, y + 8, 48, '#ffffff', 'right');
    this.text('HITS', xr - 360, y + 52, 22, '#cfd6ff', 'left');
    this.text(String(g.hits), xr, y + 56, 34, '#ffe27a', 'right');
    // groove
    this.text('GROOVE', xr - 360, y + 100, 22, '#cfd6ff', 'left');
    const mult = g.mult;
    const col = mult >= 6 ? '#ff7ad9' : mult >= 3 ? '#7cf5ff' : '#ffffff';
    this.text('×' + mult, xr, y + 108, 40, col, 'right');
    const f = clamp(g.chainT / 3.2, 0, 1);
    c.fillStyle = 'rgba(255,255,255,0.14)';
    c.beginPath(); c.roundRect(xr - 360, y + 118, 340, 8, 4); c.fill();
    c.fillStyle = col;
    c.beginPath(); c.roundRect(xr - 360, y + 118, 340 * f, 8, 4); c.fill();
    void time;
  },

  drawWingStatus(g, xr, y) {
    const c = this.ctx;
    const ids = ['waltz', 'tango', 'jive'];
    let i = 0;
    for (const id of ids) {
      const w = g.wing.find((q) => q.id === id);
      const info = WING_INFO[id];
      const yy = y + i * 62;
      i++;
      this.panel(xr - 250, yy, 264, 52, 14, 'rgba(12,8,38,0.55)', 'rgba(255,255,255,0.12)', 2);
      const col = '#' + [info.tint[0], info.tint[1], info.tint[2]].map((v) => Math.round(clamp(v, 0, 1) * 255).toString(16).padStart(2, '0')).join('');
      c.beginPath(); c.arc(xr - 226, yy + 26, 10, 0, TAU); c.fillStyle = col; c.fill();
      c.lineWidth = 3; c.strokeStyle = 'rgba(8,6,28,0.9)'; c.stroke();
      this.text(info.name, xr - 206, yy + 21, 20, '#fff', 'left');
      if (!w) {
        this.text('OUT', xr, yy + 36, 22, '#ff8a8a', 'right');
        continue;
      }
      const f = clamp(w.hp / 100, 0, 1);
      c.fillStyle = 'rgba(255,255,255,0.14)';
      c.beginPath(); c.roundRect(xr - 206, yy + 30, 168, 10, 5); c.fill();
      c.fillStyle = f > 0.5 ? '#5dff9a' : f > 0.25 ? '#ffd84a' : '#ff5a5a';
      c.beginPath(); c.roundRect(xr - 206, yy + 30, 168 * f, 10, 5); c.fill();
      if (w.chasedBy && w.chasedBy.alive) {
        c.globalAlpha = 0.6 + 0.4 * Math.sin(g.time * 14);
        this.text('HELP!', xr, yy + 40, 24, '#ff5a5a', 'right');
        c.globalAlpha = 1;
      }
    }
  },

  drawBossBar(g, cx, y) {
    const c = this.ctx;
    const bb = g.bossBar;
    const e = bb.e;
    const w = 900;
    const f = clamp(e.hp / e.maxHp, 0, 1);
    this.panel(cx - w / 2 - 20, y - 10, w + 40, 76, 20, 'rgba(12,8,38,0.7)', 'rgba(255,170,90,0.5)', 3);
    this.text(bb.name, cx, y + 26, 30, '#ffd9a0', 'center');
    c.fillStyle = 'rgba(255,255,255,0.14)';
    c.beginPath(); c.roundRect(cx - w / 2, y + 36, w, 18, 9); c.fill();
    const grd = c.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
    grd.addColorStop(0, '#ff5a5a');
    grd.addColorStop(1, '#ffb347');
    c.fillStyle = grd;
    c.beginPath(); c.roundRect(cx - w / 2, y + 36, Math.max(0, w * f), 18, 9); c.fill();
  },

  drawQuota(g, cx, y) {
    const S = g.stage;
    const w = 520;
    this.panel(cx - w / 2, y - 8, w, 66, 18, 'rgba(12,8,38,0.62)', 'rgba(255,255,255,0.14)', 2);
    this.text('STATIC FLEET', cx - w / 2 + 24, y + 18, 20, '#cfd6ff', 'left');
    const need = S.rivalAt || S.quota;

    const f = clamp(g.arenaKills / need, 0, 1);

    c.beginPath(); c.roundRect(cx - w / 2 + 24, y + 38, w - 48, 8, 4); c.fill();
    c.fillStyle = '#ff7ad9';
    c.beginPath(); c.roundRect(cx - w / 2 + 24, y + 38, (w - 48) * f, 8, 4); c.fill();
  },

  drawComm(g, x, y) {
    const cm = Comms.cur;
    if (!cm) return;
    const c = this.ctx;
    const sp = SPEAKERS[cm.who];

    const w = 800, h = 176;
