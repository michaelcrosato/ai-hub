  drawRadar(g, cx, cy, R) {
    const c = this.ctx;
    const P = g.player;
    c.save();
    c.translate(cx, cy);
    c.beginPath(); c.arc(0, 0, R, 0, TAU);
    c.fillStyle = 'rgba(10,8,40,0.6)'; c.fill();
    c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,0.3)'; c.stroke();
    c.beginPath(); c.arc(0, 0, R * 0.5, 0, TAU);
    c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,0.15)'; c.stroke();
    c.beginPath(); c.moveTo(-R, 0); c.lineTo(R, 0); c.moveTo(0, -R); c.lineTo(0, R); c.strokeStyle = 'rgba(255,255,255,0.1)'; c.stroke();
    const range = 360;
    const hx = P.fwd[0], hz = P.fwd[2];
    const hl = Math.hypot(hx, hz) || 1;
    const fx = hx / hl, fz = hz / hl; // forward on XZ
    const rx = -fz, rz = fx; // right-hand vector on XZ: (f.z, -f.x) mirrored for -Z-forward convention
    const plot = (x, z, col, r, tri) => {
      const dx = x - P.x, dz = z - P.z;
      // rotate so forward is up on the radar
      const fwd = dx * fx + dz * fz;
      const right = dx * rx + dz * rz;
      let px = right / range * R, py = -fwd / range * R;
      const d = Math.hypot(px, py);
      if (d > R - 6) { px *= (R - 6) / d; py *= (R - 6) / d; }
      c.fillStyle = col;
      c.beginPath();
      if (tri) { c.moveTo(px, py - r); c.lineTo(px + r, py + r); c.lineTo(px - r, py + r); c.closePath(); } else c.arc(px, py, r, 0, TAU);
      c.fill();
      c.lineWidth = 2; c.strokeStyle = 'rgba(8,6,28,0.9)'; c.stroke();
    };
    for (const e of g.enemies) if (e.alive && (e.def.boss || e.type === 'fighter' || e.type === 'heavy')) plot(e.x, e.z, e.def.boss ? '#ffb347' : '#ff5a5a', e.def.boss ? 9 : 6, false);
    for (const w of g.wing) if (w.alive) plot(w.x, w.z, '#6ab8ff', 6, false);
    for (const it of g.items) plot(it.x, it.z, '#ffe27a', 4, false);
    c.beginPath();
    c.moveTo(0, -12); c.lineTo(9, 10); c.lineTo(0, 5); c.lineTo(-9, 10); c.closePath();
    c.fillStyle = '#ffffff'; c.fill();
    c.lineWidth = 2.5; c.strokeStyle = 'rgba(8,6,28,0.9)'; c.stroke();
    c.restore();
  },

  /* ------------ character portraits ------------ */
  portrait(who, cx, cy, S, talking, t) {
    const c = this.ctx;
    c.save();
    c.translate(cx, cy);
    const k = S / 130;
    c.scale(k, k);
    c.lineJoin = 'round';
    c.lineCap = 'round';
    const ink = 'rgba(14,8,34,1)';
    const mouth = talking ? Math.abs(Math.sin(t * 16)) : 0.05;
    const blink = Math.sin(t * 1.7 + 1) > 0.97 ? 0.1 : 1;
    const ell = (x, y, rx, ry, fill, lw) => {
      c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU);
      if (fill) { c.fillStyle = fill; c.fill(); }
      const lwv = lw === undefined ? 4 : lw;
      if (lwv > 0) { c.lineWidth = lwv; c.strokeStyle = ink; c.stroke(); }
    };
    const poly = (pts, fill) => {
      c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
      c.closePath(); c.fillStyle = fill; c.fill(); c.lineWidth = 4; c.strokeStyle = ink; c.stroke();
    };
    const eye = (x, y, r) => { ell(x, y, r, r * 1.15 * blink + 0.5, '#fff', 3); ell(x + 1, y + 1, r * 0.55, r * 0.7 * blink + 0.3, '#16102c', 0); ell(x - 2, y - 2, 2.2, 2.2, '#fff', 0); };
    const mouthDraw = (x, y, w) => { ell(x, y, w, 3 + mouth * 9, '#4a1530', 3); };
    switch (who) {
      case 'waltz': { // hare
        ell(-20, -44, 12, 42, '#aebbd6'); ell(20, -44, 12, 42, '#aebbd6');
        ell(-20, -42, 5, 32, '#ffb6c9', 0); ell(20, -42, 5, 32, '#ffb6c9', 0);
        ell(0, 6, 50, 46, '#c9d3e8');
        ell(0, 22, 30, 24, '#f2f5ff', 0);
        eye(-19, -2, 9); eye(19, -2, 9);
        c.beginPath(); c.arc(19, -2, 14, 0, TAU); c.lineWidth = 3.5; c.strokeStyle = '#e8b93a'; c.stroke();
        poly([[-6, 14], [6, 14], [0, 22]], '#ff8fb0');
        mouthDraw(0, 34, 11);
        break;
      }
      case 'tango': { // falcon
        poly([[-44, -6], [-10, -52], [10, -52], [44, -6], [38, 40], [0, 54], [-38, 40]], '#c9573d');
        poly([[-14, -52], [0, -66], [14, -52]], '#8c3a2c');
        ell(0, 8, 34, 34, '#f4d9b8', 0);
        eye(-19, -6, 10); eye(19, -6, 10);
        c.beginPath(); c.moveTo(-32, -22); c.lineTo(-8, -12); c.moveTo(32, -22); c.lineTo(8, -12); c.lineWidth = 6; c.strokeStyle = ink; c.stroke();
        poly([[-12, 8], [12, 8], [0, 40 + mouth * 6]], '#ffcf3d');
        c.beginPath(); c.moveTo(-40, -30); c.lineTo(40, -30); c.lineWidth = 8; c.strokeStyle = '#ff4a4a'; c.stroke();
        break;
      }
      case 'jive': { // frog
        ell(0, 10, 54, 44, '#8fe05a');
        ell(-28, -26, 20, 20, '#8fe05a'); ell(28, -26, 20, 20, '#8fe05a');
        eye(-28, -26, 12); eye(28, -26, 12);
        ell(0, 30, 36, 6 + mouth * 14, '#4a1530', 3);
        c.beginPath(); c.arc(0, -4, 56, PI * 1.05, PI * 1.95); c.lineWidth = 7; c.strokeStyle = '#555c78'; c.stroke();
        ell(-56, 0, 10, 16, '#555c78'); c.beginPath(); c.moveTo(-54, 14); c.lineTo(-30, 38); c.lineWidth = 4; c.strokeStyle = '#555c78'; c.stroke();
        ell(-28, 40, 5, 5, '#555c78');
        break;
      }
      case 'ember': { // fox
        poly([[-48, -8], [-40, -58], [-14, -28]], '#f08a2a'); poly([[48, -8], [40, -58], [14, -28]], '#f08a2a');
        poly([[-40, -42], [-36, -52], [-26, -34]], '#2c1f33'); poly([[40, -42], [36, -52], [26, -34]], '#2c1f33');
        ell(0, 6, 50, 44, '#f08a2a');
        poly([[-50, 14], [-8, 20], [-14, 44], [-36, 38]], '#fff5e6'); poly([[50, 14], [8, 20], [14, 44], [36, 38]], '#fff5e6');
        eye(-20, -4, 9); eye(20, -4, 9);
        ell(0, 22, 8, 6, '#2c1f33', 0);
        mouthDraw(0, 36, 9);
        c.beginPath(); c.moveTo(-36, -14); c.lineTo(36, -14); c.lineWidth = 6; c.strokeStyle = '#6fe4ff'; c.stroke();
        break;
      }
      case 'maestro': { // villain
        poly([[-50, -40], [50, -40], [54, 30], [26, 54], [-26, 54], [-54, 30]], '#6a3fb4');
        poly([[-42, -40], [-34, -70], [-24, -40]], '#e8b93a'); poly([[42, -40], [34, -70], [24, -40]], '#e8b93a');
        c.beginPath(); c.moveTo(-34, -10); c.lineTo(-10, -2); c.moveTo(34, -10); c.lineTo(10, -2); c.lineWidth = 7; c.strokeStyle = ink; c.stroke();
        ell(-22, 6, 11, 8, '#ff9a2a', 3); ell(22, 6, 11, 8, '#ff9a2a', 3);
        c.fillStyle = ink;
        for (let i = -3; i <= 3; i++) c.fillRect(i * 9 - 3, 30, 6, 10 + mouth * 12);
        break;
      }
      default: { // lento (robot)
        poly([[-46, -40], [46, -40], [46, 40], [-46, 40]], '#aeb9d6');
        c.beginPath(); c.moveTo(0, -40); c.lineTo(0, -62); c.lineWidth = 5; c.strokeStyle = ink; c.stroke();
        ell(0, -66, 7, 7, '#ff6a6a', 3);
        poly([[-36, -18], [36, -18], [36, 6], [-36, 6]], '#10183a');
        c.fillStyle = '#6fe4ff';
        c.fillRect(-28, -12, 22 * blink + 2, 12); c.fillRect(6, -12, 22 * blink + 2, 12);
        c.fillStyle = '#10183a'; c.fillRect(-28, 18, 56, 14);
        c.fillStyle = '#6fe4ff';
        for (let i = 0; i < 5; i++) c.fillRect(-25 + i * 11, 20 + (talking ? (1 - Math.abs(Math.sin(t * 14 + i))) * 8 : 6), 8, talking ? 2 + Math.abs(Math.sin(t * 14 + i)) * 8 : 2);
      }
    }
    c.restore();
  },
};


/* ---------------- 60_ai.js ---------------- */
/* ============================================================================
   60_ai.js — autopilot used by Attract / Store-Demo mode. It plays with "cheats"
   (invulnerable, infinite bombs, unlimited boost) and simply aims, shoots, rolls and bombs.
   ========================================================================== */
const AI = {
  s: null,
  reset() {
    this.s = { chargeT: 0, charging: false, chargeCool: 2, bombT: 6, rollCd: 0, uturnCd: 3, t: 0, wob: rnd(0, 6), lockPulse: 0 };
  },

  update(g, dt) {
    if (!this.s) this.reset();
    const s = this.s;
    s.t += dt;
    const ctl = Input._blankCtl();
    if (g.state !== 'play') {
      ctl.fire = g.state === 'intro';
      return ctl;
    }
    if (g.mode === 'rails') this.rails(g, dt, ctl, s);
    else this.arena(g, dt, ctl, s);
    return ctl;
  },

  pickRailsTarget(g) {
    const P = g.player;
    let best = null, bs = 1e9;
    for (const e of g.enemies) {
      if (!e.alive || e.def.lockable === false) continue;
      const ah = P.z - e.z;
      if (ah < 12 || ah > 300) continue;
      let sc = ah + Math.abs(e.x - P.x) * 0.5;
      if (e.def.boss) sc -= 160;
      if (e.type === 'chaser') sc -= 140;
      if (e.type === 'missile') sc -= 40;
      if (e.hs && e.def.boss) sc -= 20;
      if (sc < bs) { bs = sc; best = e; }
    }
    return best;
  },

  rails(g, dt, ctl, s) {
    const P = g.player, S = g.stage;
    const b = S.boundsAt ? S.boundsAt(g.s) : S.bounds;
    const cx = railCenter(g.s);
    const tgt = this.pickRailsTarget(g);
    let wantX = P.x, wantY = P.y;
    let aimX = 0, aimY = 0;
    let count = 0;
    for (const e of g.enemies) if (e.alive && P.z - e.z > 10 && P.z - e.z < 280 && e.def.lockable !== false) count++;
    // pickups worth grabbing
    let item = null;
    for (const it of g.items) {
      const ah = P.z - it.z;
      if (ah > 8 && ah < 150 && (!item || ah < P.z - item.z)) item = it;
    }
    if (tgt) {
      const lp = tgt.lockPos ? tgt.lockPos(tgt) : [tgt.x, tgt.y, tgt.z];
      const ah = Math.max(10, P.z - lp[2]);
      wantX = lp[0] + (tgt.def.boss ? Math.sin(s.t * 0.8) * 8 : 0);
      wantY = lp[1];
      const k = 78 / ah;
      aimX = clamp((lp[0] - P.x) * k / 40 + (tgt.vx || 0) * ah / 340 / 40, -1, 1);
      aimY = clamp((lp[1] - P.y) * k / 23, -1, 1);
      ctl.fire = true;
    } else {
      wantX = cx + Math.sin(s.t * 0.6 + s.wob) * 16;
      wantY = (b.y0 + b.y1) / 2 + Math.sin(s.t * 0.9) * 6;
    }
    if (item && (!tgt || P.z - tgt.z > 70 || tgt.def.boss !== true)) {
      wantX = item.x;
      wantY = item.y;
    }
    if (!isFinite(wantX) || !isFinite(wantY) || !isFinite(aimX) || !isFinite(aimY)) { wantX = P.x; wantY = P.y; aimX = 0; aimY = 0; }
    ctl.mx = clamp((wantX - P.x) * 0.16, -1, 1);
    ctl.my = clamp((wantY - P.y) * 0.2, -1, 1);
    ctl.ax = aimX;
    ctl.ay = aimY;
    // charge / lock
    s.chargeCool -= dt;
    if (!s.charging && s.chargeCool <= 0 && (count >= 2 || (tgt && tgt.def.boss))) { s.charging = true; s.chargeT = 0; }
    if (s.charging) {
      s.chargeT += dt;
      ctl.charge = true;
      if (s.chargeT > 1.05) { s.charging = false; ctl.charge = false; s.chargeCool = 3.2; }
    }
    // bombs
    s.bombT -= dt;
    const bossHot = g.boss && g.boss.alive && g.boss.rel !== undefined && g.boss.rel < 175;
    if (s.bombT <= 0 && (count >= 7 || bossHot)) { ctl.bomb = true; s.bombT = bossHot ? 9 : 14; }
    // barrel roll when bullets are close
    s.rollCd -= dt;
    if (s.rollCd <= 0) {
      for (const bu of g.eb) {
        const ah = P.z - bu.z;
        if (ah > 0 && ah < 30 && Math.abs(bu.x - P.x) < 6 && Math.abs(bu.y - P.y) < 6) {
          if (Math.random() < 0.5) ctl.rollR = true; else ctl.rollL = true;
          s.rollCd = 1.2;
          break;
        }
      }
    }
    // keep a bit of speed in boss fights
    ctl.boost = false;
    void b;
  },

  arena(g, dt, ctl, s) {
    const P = g.player, S = g.stage;
    // target selection
    let best = null, bs = 1e9;
    for (const e of g.enemies) {
      if (!e.alive || e.def.lockable === false) continue;
      const dx = e.x - P.x, dy = e.y - P.y, dz = e.z - P.z;
      const d = Math.hypot(dx, dy, dz);
      const dot = (dx * P.fwd[0] + dy * P.fwd[1] + dz * P.fwd[2]) / Math.max(d, 1);
      let sc = d - dot * 140;
      if (e.def.boss) sc -= 120;
      if (e.tgtW && e.tgtW.chasedBy === e) sc -= 100;
      if (sc < bs) { bs = sc; best = e; }
    }
    let tx = 0, ty = 40, tz = 0;
    let dist = 0;
    if (best) {
      const dx0 = best.x - P.x, dy0 = best.y - P.y, dz0 = best.z - P.z;
      dist = Math.hypot(dx0, dy0, dz0);
      const bsp = 340;
      const tt = dist / bsp;
      const bf = best.fwd || [0, 0, 0];
      const bspd = best.spd || 0;
      tx = best.x + bf[0] * bspd * tt; ty = best.y + bf[1] * bspd * tt; tz = best.z + bf[2] * bspd * tt;
    } else {
      tx = Math.sin(s.t * 0.1) * 120; ty = 50; tz = 0;
      dist = Math.hypot(tx - P.x, tz - P.z);
    }
    const dx = tx - P.x, dy = ty - P.y, dz = tz - P.z;
    const desYaw = Math.atan2(-dx, -dz);
    const yawErr = wrapPi(desYaw - P.yaw);
    const desPitch = Math.atan2(dy, Math.hypot(dx, dz));
    const pitchErr = desPitch - P.pitch;
    ctl.mx = -clamp(yawErr * 2.6, -1, 1);
    ctl.my = clamp(pitchErr * 2.6, -1, 1);
    s.uturnCd -= dt;
    if (Math.abs(yawErr) > 2.4 && s.uturnCd <= 0 && !P.loop) { ctl.uturn = true; s.uturnCd = 5; }
    const aligned = Math.abs(yawErr) < 0.1 && Math.abs(pitchErr) < 0.1;
    ctl.fire = best && dist < 280 && Math.abs(yawErr) < 0.2 && Math.abs(pitchErr) < 0.2;
    ctl.ax = 0; ctl.ay = 0;
    // avoid skyscrapers
    if (S.solidAt) {
      const f = P.fwd;
      if (S.solidAt(P.x + f[0] * 60, P.y + f[1] * 60, P.z + f[2] * 60, 8)) { ctl.my = 1; ctl.mx = 0.3; ctl.fire = false; }
    }
    if (P.y < 22) ctl.my = Math.max(ctl.my, 0.8);
    // lock-on volleys
    s.chargeCool -= dt;
    let near = 0;
    for (const e of g.enemies) if (e.alive && Math.hypot(e.x - P.x, e.y - P.y, e.z - P.z) < 260) near++;
    if (!s.charging && s.chargeCool <= 0 && near >= 2 && aligned) { s.charging = true; s.chargeT = 0; }
    if (s.charging) {
      s.chargeT += dt;
      ctl.charge = true;
      if (s.chargeT > 1.0) { s.charging = false; ctl.charge = false; s.chargeCool = 3.5; }
    }
    s.bombT -= dt;
    if (s.bombT <= 0 && near >= 5) { ctl.bomb = true; s.bombT = 15; }
    s.rollCd -= dt;
    if (s.rollCd <= 0) {
      for (const bu of g.eb) {
        if (Math.hypot(bu.x - P.x, bu.y - P.y, bu.z - P.z) < 26) {
          if (Math.random() < 0.5) ctl.rollR = true; else ctl.rollL = true;
          s.rollCd = 1.3;
          break;
        }
      }
    }
    // stay in the arena
    const B = S.arena || 380;
    if (Math.abs(P.x) > B * 0.85 || Math.abs(P.z) > B * 0.85) {
      const des = Math.atan2(P.x, P.z);
      const err = wrapPi(des - P.yaw);
      ctl.mx = -clamp(err * 2.5, -1, 1);
    }
  },
};

function h(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

const UI = {
  root: null,
  stack: [],
  _dev: '',
  init(root) {
    this.root = root;
  },
  get cur() {
    return this.stack.length ? this.stack[this.stack.length - 1] : null;
  },
  open(scr) {
    const prev = this.cur;
    if (prev) prev.el.style.display = 'none';
    this.stack.push(scr);
    this.root.appendChild(scr.el);
    if (scr.onShow) scr.onShow();
    this.refreshFooters();
    return scr;
  },
  pop() {
    const s = this.stack.pop();
    if (s) {
      if (s.onClose) s.onClose();
      if (s.el.parentNode) s.el.parentNode.removeChild(s.el);
    }
    const c = this.cur;
    if (c) {
      c.el.style.display = '';
      if (c.onShow) c.onShow();
    }
    this.refreshFooters();
  },
  closeAll() {
    while (this.stack.length) {
      const s = this.stack.pop();
      if (s.onClose) s.onClose();
      if (s.el.parentNode) s.el.parentNode.removeChild(s.el);
    }
  },
  replaceAll(scr) {
    this.closeAll();
    this.open(scr);
  },
  update(nav) {
    const c = this.cur;
    if (Input.device !== this._dev) {
      this._dev = Input.device;
      this.refreshFooters();
    }
    if (c && c.update) c.update(nav);
  },
  refreshFooters() {
    for (const s of this.stack) if (s.renderFooter) s.renderFooter();
  },
};

/* ---------- footer prompts ---------- */
function footerEl(items) {
  const f = h('div', 's-foot');
  const render = () => {
    f.innerHTML = '';
    for (const it of items) {
      const p = h('span', 'pr');
      p.innerHTML = Input.glyph(it.a) + '<b>' + it.t + '</b>';
      f.appendChild(p);
    }
  };
  render();
  f.render = render;
  return f;
}

/* ---------- generic list menu ---------- */
function makeMenu(o) {
  const el = h('div', 'screen ' + (o.cls || 'dim'));
  if (o.title) {
    const head = h('div', 's-head');
    head.appendChild(h('div', 's-title', o.title));
    if (o.sub) head.appendChild(h('div', 's-sub', o.sub));
    el.appendChild(head);
  }
  const body = h('div', 's-body' + (o.center ? ' center' : ''));
  const menu = h('div', 'menu');
  body.appendChild(menu);
  if (o.side) body.appendChild(o.side);
  el.appendChild(body);
  const foot = footerEl(o.footer || [{ a: 'nav', t: 'Move' }, { a: 'accept', t: 'Select' }, { a: 'back', t: 'Back' }]);
  el.appendChild(foot);

  const scr = { el, items: [], focus: 0, onBack: o.onBack, renderFooter: foot.render };
  const items = o.items;
  const enabled = (it) => it.kind !== 'header' && !(it.disabled && it.disabled());
  const refresh = () => {
    items.forEach((it, i) => {
      const n = scr.items[i];
      n.classList.toggle('focus', i === scr.focus);
      n.classList.toggle('disabled', !!(it.disabled && it.disabled()));
      if (it.kind === 'slider') {
        const v = it.get();
        n.querySelector('.bar i').style.width = ((v - it.min) / (it.max - it.min)) * 100 + '%';
        n.querySelector('.val').textContent = it.fmt ? it.fmt(v) : String(v);
      } else if (it.kind === 'choice') {
        const v = it.get();
        const opt = it.options.find((q) => q.v === v) || it.options[0];
        n.querySelector('.val').textContent = opt.t;
      } else if (it.kind === 'toggle') {
        n.querySelector('.val').textContent = it.get() ? 'ON' : 'OFF';
      } else if (it.kind === 'dyn') {
        n.querySelector('.lbl').textContent = it.label();
      } else if (typeof it.desc === 'function') {
        n.querySelector('.desc').textContent = it.desc();
      }
    });
  };
  const setFocus = (i, quiet) => {
    if (i === scr.focus) return;
    scr.focus = i;
    if (!quiet) Sound.play('select');
    refresh();
  };
  const move = (d) => {
    let i = scr.focus;
    for (let k = 0; k < items.length; k++) {
      i = (i + d + items.length) % items.length;
      if (enabled(items[i])) break;
    }
    setFocus(i);
  };
  const adjust = (d) => {
    const it = items[scr.focus];
    if (!it) return;
    if (it.kind === 'slider') {
      const v = clamp(it.get() + d * it.step, it.min, it.max);
      if (v !== it.get()) {
        it.set(Math.round(v * 1000) / 1000);
        Sound.play('slider');
      }
    } else if (it.kind === 'choice') {
      const idx = it.options.findIndex((q) => q.v === it.get());
      const ni = (idx + d + it.options.length) % it.options.length;
      it.set(it.options[ni].v);
      Sound.play('slider');
    } else if (it.kind === 'toggle') {
      it.set(!it.get());
      Sound.play('slider');
    }
    Save.store();
    refresh();
  };
  const activate = (i) => {
    const it = items[i];
    if (!it || !enabled(it)) {
      if (it && it.disabled && it.disabled()) Sound.play('deny');
      return;
    }
    if (it.kind === 'button' || it.kind === 'dyn') {
      Sound.play(it.sfx || 'confirm');
      it.onSelect && it.onSelect();
    } else if (it.kind === 'toggle' || it.kind === 'choice') adjust(1);
    refresh();
  };
  items.forEach((it, i) => {
    const n = h('div', 'item' + (it.kind === 'header' ? ' header' : ''));
    if (it.kind === 'header') n.textContent = it.label;
    else if (it.kind === 'slider') {
      n.innerHTML = '<span class="lbl"></span><span style="display:flex;align-items:center;gap:1rem"><span class="arrows">◀</span><span class="bar"><i></i></span><span class="val"></span><span class="arrows">▶</span></span>';
      n.querySelector('.lbl').textContent = it.label;
      const bar = n.querySelector('.bar');
      bar.addEventListener('click', (e) => {
        const r = bar.getBoundingClientRect();
        const t = clamp((e.clientX - r.left) / r.width, 0, 1);
        let v = it.min + t * (it.max - it.min);
        v = Math.round(v / it.step) * it.step;
        it.set(clamp(v, it.min, it.max));
        Sound.play('slider');
        Save.store();
        refresh();
        e.stopPropagation();
      });
    } else if (it.kind === 'choice' || it.kind === 'toggle') {
      n.innerHTML = '<span class="lbl"></span><span style="display:flex;align-items:center;gap:0.8rem"><span class="arrows">◀</span><span class="val"></span><span class="arrows">▶</span></span>';
      n.querySelector('.lbl').textContent = it.label;
    } else {
      n.innerHTML = '<span class="lbl"></span>' + (it.desc ? '<span class="desc"></span>' : '');
      n.querySelector('.lbl').textContent = it.kind === 'dyn' ? it.label() : it.label;
      if (it.desc) n.querySelector('.desc').textContent = typeof it.desc === 'function' ? it.desc() : it.desc;
    }
    n.addEventListener('mousemove', (e) => {
      if ((e.movementX || e.movementY) && enabled(it)) setFocus(i);
    });
    n.addEventListener('click', () => {
      if (it.kind === 'header') return;
      if (!enabled(it)) {
        Sound.play('deny');
        return;
      }
      setFocus(i, true);
      activate(i);
    });
    menu.appendChild(n);
    scr.items.push(n);
  });
  scr.focus = Math.max(0, items.findIndex(enabled));
  if (o.focus !== undefined) scr.focus = o.focus;
  refresh();
  scr.refresh = refresh;
  scr.update = (nav) => {
    if (nav.up) move(-1);
    else if (nav.down) move(1);
    else if (nav.left) adjust(-1);
    else if (nav.right) adjust(1);
    if (nav.accept) activate(scr.focus);
    else if (nav.back && scr.onBack) {
      Sound.play('back');
      scr.onBack();
    }
    if (o.update) o.update(nav, scr);
  };
  return scr;
}

      { kind: 'button', label: 'SETTINGS', onSelect: () => UI.open(screenSettings()) },
      { kind: 'button', label: 'CONTROLS', onSelect: () => UI.open(screenControls()) },
      { kind: 'button', label: 'QUIT TO TITLE', onSelect: () => UI.open(screenConfirm('Quit to the title screen? Progress in this stage is lost.', 'QUIT', 'KEEP PLAYING', () => App.quitToTitle())) },
    ],
    onBack: () => App.resume(),
    update: (nav) => {
      if (nav.menu) App.resume();
    },
    footer: [{ a: 'nav', t: 'Move' }, { a: 'accept', t: 'Select' }, { a: 'back', t: 'Resume' }],
  });
  return scr;
}

/* ---------- route map ---------- */
const MAP_NODES = {
  s1: { x: 12, y: 52, col: '#2c9be0', n: '1' },
  s2a: { x: 38, y: 28, col: '#7d4fe0', n: '2A' },
  s2b: { x: 38, y: 76, col: '#e0743a', n: '2B' },
  s3: { x: 64, y: 52, col: '#e03aa8', n: '3' },
  s4: { x: 88, y: 52, col: '#5a3a9c', n: '4' },
};
const MAP_LINKS = [['s1', 's2a'], ['s1', 's2b'], ['s2a', 's3'], ['s2b', 's3'], ['s3', 's4']];

function stageUnlocked(id) {
  const c = Progress.cleared;
  switch (id) {
    case 's1': return true;
    case 's2a': return !!c.s1;
    case 's2b': return !!c.s1 && Progress.routeB;
    case 's3': return !!(c.s2a || c.s2b);
    case 's4': return !!c.s3;
    default: return false;
  }
}

function medalSpan(m) {
  if (!m || !MEDALS[m]) return '';
  return '<span style="color:' + MEDALS[m][0] + '">★ ' + MEDALS[m][1] + '</span>';
}

/* mode 'campaign': choices = stages reachable next. mode 'select': any unlocked stage */
function screenMap(mode, choices, onPick, onBack) {
  const el = h('div', 'screen dim');
  const head = h('div', 's-head');
  head.appendChild(h('div', 's-title', mode === 'select' ? 'STAGE SELECT' : 'ROUTE MAP'));
  head.appendChild(h('div', 's-sub', mode === 'select' ? 'Replay any stage you have reached' : 'Choose your route'));
  el.appendChild(head);
  const map = h('div', 'map');
  let svg = '<svg viewBox="0 0 100 100" preserveAspectRatio="none">';
  for (const [a, b] of MAP_LINKS) {
    const A = MAP_NODES[a], B = MAP_NODES[b];
    const ok = (mode === 'select' ? stageUnlocked(b) : true);
    svg += '<line x1="' + A.x + '" y1="' + A.y + '" x2="' + B.x + '" y2="' + B.y + '" stroke="' + (ok ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.15)') + '" stroke-width="0.5" stroke-dasharray="1.6 1.2" vector-effect="non-scaling-stroke" style="stroke-width:3px"/>';
  }
  svg += '</svg>';
  map.innerHTML = svg;
  const nodeEls = {};
  const info = h('div', 'map-info');
  const infoT = h('div', 't');
  const infoD = h('div', 'd');
  const left = h('div', '');
  left.appendChild(infoT);
  left.appendChild(infoD);
  info.appendChild(left);
  const infoM = h('div', '');
  info.appendChild(infoM);
  const reach = new Set(choices);
  let focusId = choices[0] || 's1';
  const doneSet = new Set(mode === 'campaign' ? (Run ? Run.route : []) : Object.keys(Progress.cleared));
  for (const id of Object.keys(MAP_NODES)) {
    const N = MAP_NODES[id];
    const st = STAGES[id];
    const available = reach.has(id);
    const n = h('div', 'node' + (available ? '' : ' locked') + (doneSet.has(id) ? ' done' : ''));
    n.style.left = N.x + '%';
    n.style.top = N.y + '%';
    const best = Progress.cleared[id];
    n.innerHTML = '<div class="orb" style="background:radial-gradient(circle at 35% 30%, #fff8 0%, ' + N.col + ' 45%, #0e0826 140%)">' + N.n + '</div><div class="nm">' + st.name + '</div><div class="pl">' + st.planet + '</div><div class="medal">' + (best ? medalSpan(best.medal) : '') + '</div>';
    n.addEventListener('mousemove', (e) => { if ((e.movementX || e.movementY) && available) setFocus(id); });
    n.addEventListener('click', () => {
      if (!available) { Sound.play('deny'); return; }
      setFocus(id, true);
      Sound.play('confirm');
      onPick(id);
    });
    map.appendChild(n);
    nodeEls[id] = n;
  }
  el.appendChild(map);
  el.appendChild(info);
  const foot = footerEl([{ a: 'nav', t: 'Choose' }, { a: 'accept', t: 'Select' }, { a: 'back', t: 'Back' }]);
  el.appendChild(foot);
  const setFocus = (id, quiet) => {
    if (id !== focusId && !quiet) Sound.play('select');
    focusId = id;
    for (const k of Object.keys(nodeEls)) nodeEls[k].classList.toggle('focus', k === id);
    const st = STAGES[id];
    infoT.textContent = st.name + '  —  ' + st.planet;
    infoD.textContent = st.blurb;
    const best = Progress.cleared[id];
    infoM.innerHTML = best ? '<div style="text-align:right;font-size:1.2rem">BEST ' + String(best.score).padStart(8, '0') + '<br>' + medalSpan(best.medal) + '</div>' : '<div style="text-align:right;color:var(--dim);font-size:1.1rem">' + (id === 's2b' ? 'ENCORE ROUTE' : 'NEW') + '</div>';
  };
  setFocus(focusId, true);
  const lockedMsg = h('div', '');
  void lockedMsg;
  return {
    el, renderFooter: foot.render,
    update(nav) {
      const list = choices;
      if (nav.left || nav.right || nav.up || nav.down) {
        const cur = MAP_NODES[focusId];
        let best = null, bd = 1e9;
        for (const id of list) {
          if (id === focusId) continue;
          const N = MAP_NODES[id];
          const dx = N.x - cur.x, dy = N.y - cur.y;
          let ok = false;
          if (nav.right && dx > 3) ok = true;
          if (nav.left && dx < -3) ok = true;
          if (nav.down && dy > 3 && Math.abs(dx) < 20) ok = true;
          if (nav.up && dy < -3 && Math.abs(dx) < 20) ok = true;
          if (!ok) continue;
          const d = Math.hypot(dx, dy);
          if (d < bd) { bd = d; best = id; }
        }
        if (best) setFocus(best);
      }
      if (nav.accept) {
        if (reach.has(focusId)) {
          Sound.play('confirm');
          onPick(focusId);
        } else Sound.play('deny');
      } else if (nav.back && onBack) {
        Sound.play('back');
        onBack();
      }
    },
  };
}

function rankFor(hits, target) {
  const r = hits / Math.max(1, target);
  return r >= 1.15 ? 'S' : r >= 0.9 ? 'A' : r >= 0.6 ? 'B' : 'C';
}
function medalFor(hits, target) {
  const r = hits / Math.max(1, target);
  return r >= 1 ? 'gold' : r >= 0.7 ? 'silver' : r >= 0.45 ? 'bronze' : null;
}

function screenResults(res, onContinue) {
  const el = h('div', 'screen dim');
  const head = h('div', 's-head');
  head.appendChild(h('div', 's-title', 'MISSION COMPLETE'));
  head.appendChild(h('div', 's-sub', res.stage.name + ' — ' + res.stage.planet));
  el.appendChild(head);
  const body = h('div', 's-body');
  body.style.gap = '4rem';
  body.style.alignItems = 'center';
  const left = h('div', 'stat-list');
  const rows = [
    ['SCORE', String(res.score).padStart(8, '0'), true],
    ['HITS', res.hits + '  /  ' + res.stage.medalHits, false],
    ['ALLIES SAVED', String(res.saved), false],
    ['ALLIES LOST', String(res.lost), false],
    ['BEST GROOVE', '×' + Math.max(1, Math.min(8, 1 + Math.floor(res.maxChain / 6))), false],
    ['TIME', Math.floor(res.time / 60) + ':' + String(Math.floor(res.time % 60)).padStart(2, '0'), false],
  ];
  const vals = [];
  rows.forEach((r) => {
    const d = h('div', 'stat' + (r[2] ? ' big' : ''));
    d.innerHTML = '<span>' + r[0] + '</span><b>' + r[1] + '</b>';
    left.appendChild(d);
    vals.push(d.querySelector('b'));
  });
  const right = h('div', '');
  right.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:1rem;flex:1';
  right.innerHTML = '<div style="font-size:1.3rem;letter-spacing:0.3em;color:var(--dim)">RANK</div><div class="rank">' + res.rank + '</div><div class="medal-big">' + (res.medal ? medalSpan(res.medal) : '<span style="color:var(--dim);font-size:1.5rem">no medal</span>') + '</div>' + (res.newBest ? '<div style="color:var(--grn);font-size:1.6rem;font-weight:900;letter-spacing:0.15em">NEW BEST!</div>' : '') + (res.unlock ? '<div style="color:var(--yel);font-size:1.4rem;font-weight:800;text-align:center;max-width:26rem">' + res.unlock + '</div>' : '');
  body.appendChild(left);
  body.appendChild(right);
  el.appendChild(body);
  const foot = footerEl([{ a: 'accept', t: 'Continue' }]);
  el.appendChild(foot);
  // count-up animation on the score
  let t0 = performance.now();
  const target = res.score;
  const anim = () => {
    const k = clamp((performance.now() - t0) / 1200, 0, 1);
    const v = Math.floor(target * (1 - Math.pow(1 - k, 3)));
    vals[0].textContent = String(v).padStart(8, '0');
    if (k < 1 && el.isConnected !== false) requestAnimationFrame(anim);
  };
  requestAnimationFrame(anim);
  Sound.play('medal');
  const born = performance.now();
  const go = () => {
    if (performance.now() - born < 900) return;
    Sound.play('confirm');
    onContinue();
  };
  el.addEventListener('click', go);
  return {
    el, renderFooter: foot.render,
    update(nav) {
      if (nav.accept) go();
    },
  };
}

/* ---------- ending + credit roll ---------- */
function screenEnding(run, onDone) {
  const el = h('div', 'screen dimmer');
  el.style.overflow = 'hidden';
  const roll = h('div', 'credits-roll');
  const totalScore = run.score;
  const rank = rankFor(run.totalHits, 330);
  let html = '<h2>THE MUSIC PLAYS ON</h2>';
  html += '<p>Maestro Dissonant is silenced. Across the galaxy, speakers crackle — and then, one by one, they sing.</p>';
  html += '<h4>FINAL SCORE</h4><p style="font-size:3rem;font-weight:900;color:#fff">' + String(totalScore).padStart(8, '0') + '</p>';
  html += '<p>Total hits ' + run.totalHits + ' · Allies saved ' + run.saved + ' · Allies lost ' + run.lost + '</p><p style="font-size:2.2rem">CAMPAIGN RANK <b style="color:var(--yel)">' + rank + '</b></p>';
  html += '<h2>STARFOXTROT 64</h2>';
  html += '<h4>FOXTROT FLIGHT</h4><p>Ember · Waltz · Tango · Jive</p>';
  html += '<h4>DESIGN, CODE, MODELS, MUSIC &amp; SOUND</h4><p>Claude Sonnet 5.5 (Anthropic)</p>';
  html += '<h4>INSPIRED BY</h4><p>Star Fox 64 (Nintendo, 1997)</p>';
  html += '<h4>SOURCE INFORMATION</h4>';
  for (const [k, v] of SRC_INFO) html += '<p style="font-size:1.15rem;line-height:1.5;max-width:60rem;margin:0.6rem auto"><b style="color:var(--cyan)">' + k + ':</b> ' + v + '</p>';
  html += '<h2>THANKS FOR FLYING</h2><p>Keep the beat.</p>';
  roll.innerHTML = html;
  el.appendChild(roll);
  const foot = footerEl([{ a: 'accept', t: 'Skip' }]);
  foot.style.position = 'absolute';
  foot.style.bottom = '4vh';
  foot.style.left = '50%';
  foot.style.transform = 'translateX(-50%)';
  el.appendChild(foot);
  let y = window.innerHeight;
  let last = performance.now();
  let alive = true;
  const step = () => {
    if (!alive) return;
    const now = performance.now();
    y -= (now - last) * 0.055;
    last = now;
    roll.style.transform = 'translateY(' + y + 'px)';
    if (y < -roll.scrollHeight - 40) {
      alive = false;
      onDone();
      return;
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  return {
    el, renderFooter: foot.render,
    onClose() { alive = false; },
    update(nav) {
      if (nav.accept || nav.back) {
        alive = false;
        onDone();
      }
    },
  };
}

const App = {
  mode: 'boot', // 'menu' | 'play' | 'paused' | 'attract'
  ctx: 'title', // 'title' | 'campaign' | 'single'
  idle: 0,
  attractIdx: 0,
  ignoreNav: 0,
  gate: false,
  busy: false,
  gameOverShown: false,
  errCount: 0,
  fadeEl: null,

  fade(fn) {
    if (!this.fadeEl) { fn(); return; }
    clearTimeout(this._fadeT1);
    clearTimeout(this._fadeT2);
    this.busy = true;
    this.fadeEl.classList.add('on');
    this._fadeT1 = setTimeout(() => {
      try {
        fn();
      } catch (e) {
        console.error(e);
        try {
          UI.closeAll();
          this.showTitle();
        } catch (e2) { /* ignore */ }
      }
      this._fadeT2 = setTimeout(() => {
        this.fadeEl.classList.remove('on');
        this.busy = false;
      }, 60);
    }, 380);
  },

  /* ---------------- menus ---------------- */
  showTitle() {
    Run = null;
    G = null;
    Sound.engineStop();
    Sound.chargeUpdate(0, false);
    Music.start('title');
    UI.replaceAll(screenTitle());
    this.mode = 'menu';
    this.ctx = 'title';
    this.idle = 0;
    Diorama.kind = 'title';
    this.ignoreNav = 1;
    this.idleFrom = performance.now() / 1000;
  },
  openDifficulty() {
    UI.open(screenDifficulty());
  },
  startCampaign() {
    this.fade(() => {
      Run = newRun();
      this.ctx = 'campaign';
      Diorama.kind = 'space';
      this.goMap();
    });
  },
  nextChoices() {
    if (!Run.route.length) return ['s1'];
    const last = Run.route[Run.route.length - 1];
    if (last === 's1') return Progress.routeB ? ['s2a', 's2b'] : ['s2a'];
    if (last === 's2a' || last === 's2b') return ['s3'];
    if (last === 's3') return ['s4'];
    return [];
  },
  goMap() {
    const choices = this.nextChoices();
    UI.replaceAll(
      screenMap('campaign', choices, (id) => this.openBriefing(id), () => UI.open(screenConfirm('Abandon this run and return to the title?', 'QUIT', 'STAY', () => this.quitToTitle())))
    );
    this.mode = 'menu';
  },
  openStageSelect() {
    const ids = Object.keys(STAGES).filter((id) => stageUnlocked(id));
    Diorama.kind = 'space';
    this.ctx = 'single';
    UI.open(
      screenMap('select', ids, (id) => {
        Run = newRun();
        Run.single = true;
        Run.route = [];
        this.openBriefing(id);
      }, () => { this.ctx = 'title'; Diorama.kind = 'title'; UI.pop(); })
    );
  },
  openBriefing(id) {
    UI.open(screenBriefing(STAGES[id], () => this.beginStage(id), () => UI.pop()));
  },

  /* ---------------- play ---------------- */
  beginStage(id) {
    this.fade(() => {
      UI.closeAll();
      Run.currentStage = id;
      Run.snap = { score: Run.score, lives: Run.lives, bombs: Run.bombs, laser: Run.laser };
      if (!Run.single && Run.route.indexOf(id) >= 0) Run.route.length = Run.route.indexOf(id);
      G = newGame(STAGES[id], Run, {});
      G.startScore = Run.score;
      this.mode = 'play';
      this.gameOverShown = false;
      Input.endFrame();
      this.ignoreNav = 1;
    });
  },
  pause() {
    if (this.mode !== 'play' || !G || G.attract) return;
    this.mode = 'paused';
    Sound.engineUpdate(0, 0, false);
    Sound.chargeUpdate(0, false);
    Sound.play('select');
    FX.shake = 0;
    UI.open(screenPause());
  },
  resume() {
    if (this.mode !== 'paused') return;
    UI.closeAll();
    this.mode = 'play';
    this.ignoreNav = 1;
  },
  restartStage() {
    const id = Run.currentStage;
    Object.assign(Run, Run.snap);
    this.beginStage(id);
  },
  quitToTitle() {
    this.fade(() => {
      UI.closeAll();
      this.showTitle();
    });
  },
  openGameOver() {
    this.gameOverShown = true;
    this.mode = 'menu';
    Sound.engineStop();
    UI.open(
      screenGameOver(
        () => {
          Run.lives = 3;
          Run.score = G && G.startScore !== undefined ? G.startScore : Run.score;
          Run.bombs = 3;
          this.fade(() => { UI.closeAll(); this.beginStageNow(Run.currentStage); });
        },
        () => this.quitToTitle()
      )
    );
  },
  beginStageNow(id) {
    Run.snap = { score: Run.score, lives: Run.lives, bombs: Run.bombs, laser: Run.laser };
    G = newGame(STAGES[id], Run, {});
    G.startScore = Run.score;
    this.mode = 'play';
    this.gameOverShown = false;
    this.ignoreNav = 1;
  },

  stageComplete() {
    const g = G;
    const S = g.stage;
    Sound.engineStop();
    Sound.chargeUpdate(0, false);
    const time = g.t;
    const hits = g.hits;
    const medal = medalFor(hits, S.medalHits);
    const rank = rankFor(hits, S.medalHits);
    const prev = Progress.cleared[S.id];
    const newBest = !prev || g.score > prev.score;
    let unlock = '';
    if (!prev || g.score > prev.score || (medal && (!prev.medal || ['bronze', 'silver', 'gold'].indexOf(medal) > ['bronze', 'silver', 'gold'].indexOf(prev.medal)))) {
      Progress.cleared[S.id] = {
        score: Math.max(g.score, prev ? prev.score : 0),
        hits: Math.max(hits, prev ? prev.hits : 0),
        medal: (() => {
          const order = ['bronze', 'silver', 'gold'];
          const a = prev && prev.medal ? order.indexOf(prev.medal) : -1;
          const b = medal ? order.indexOf(medal) : -1;
          return a >= b ? (a >= 0 ? order[a] : null) : order[b];
        })(),
        allies: g.saved,
      };
    }
    if (S.id === 's1' && hits >= 60 && !Progress.routeB) {
      Progress.routeB = true;
      unlock = 'ENCORE ROUTE UNLOCKED\nCrescendo Canyon';
    }
    if (g.score > Progress.hiscore) Progress.hiscore = Math.floor(g.score);
    Progress.plays++;
    Save.store();
    const res = { stage: S, score: Math.floor(g.score), hits, saved: g.saved, lost: g.lost, maxChain: g.maxChain, time, rank, medal, newBest, unlock: unlock.replace('\n', ' — ') };
    // fold into the run
    Run.score = g.score;
    Run.lives = Math.min(9, g.lives);
    Run.bombs = Math.max(3, g.bombCount);
    Run.laser = g.laser;
    Run.totalHits += hits;
    Run.saved += g.saved;
    Run.lost += g.lost;
    if (!Run.single) Run.route.push(S.id);
    this.mode = 'menu';
    Diorama.kind = 'space';
    Music.start('victory');
    UI.open(screenResults(res, () => this.afterResults(S.id)));
  },
  afterResults(id) {
    if (Run.single) {
      this.fade(() => { UI.closeAll(); this.showTitle(); });
      return;
    }
    if (id === 's4') {
      this.fade(() => {
        UI.closeAll();
        Music.start('title');
        UI.open(screenEnding(Run, () => this.fade(() => { UI.closeAll(); this.showTitle(); })));
      });
      return;
    }
    this.fade(() => {
      UI.closeAll();
      Music.start('title');
      this.goMap();
    });
  },

  /* ---------------- attract / store-demo ---------------- */
  enterAttract() {
    const order = ['s1', 's2a', 's3', 's2b', 's4'];
    const id = order[this.attractIdx % order.length];
    this.attractIdx++;
    UI.closeAll();
    const run = newRun();
    run.lives = 9;
    run.bombs = 9;
    run.laser = 2;
    Run = null;
    AI.reset();
    G = newGame(STAGES[id], run, { attract: true });
    this.mode = 'attract';
    this.idle = 0;
  },
  beginAttract() {
    this.idle = 0;
    this.attractPending = true;
    this.attractCancel = false;
    this.fade(() => {
      this.attractPending = false;
      if (this.attractCancel) {
        this.idle = 0;
        this.ignoreNav = 2;
        return;
      }
      this.enterAttract();
    });
  },
  attractNext() {
    this.mode = 'attractWait';
    this.wantExit = false;
    this.fade(() => {
      Sound.engineStop();
      if (this.wantExit) {
        this.showTitle();
        this.ignoreNav = 2;
      } else this.enterAttract();
    });
  },
  exitAttract() {
    Sound.engineStop();
    Sound.chargeUpdate(0, false);
    this.mode = 'exiting';
    this.fade(() => {
      this.showTitle();
      this.ignoreNav = 2;
      this.idle = 0;
    });
  },

  /* ---------------- per-frame ---------------- */
  tick(raw, now) {
    GPU.resize();
    Input.poll(raw, now);
    if (Input.activity) Sound.ensure();
    Music.update(now);
    const sh = document.getElementById('sndHint');
    if (sh) sh.classList.toggle('hide', !!(Sound.ctx && Sound.ctx.state === 'running'));

    // touch-only gate
    if (this.gate) {
      if (Input.hasPad || Input.keyboardSeen) {
        this.gate = false;
        this.ignoreNav = 2;
        const tg = document.getElementById('touchgate');
        if (tg) tg.hidden = true;
        document.getElementById('ui').classList.remove('over-gate');
      }
    }
    if (this.attractPending && Input.activity) this.attractCancel = true;
    const playing = this.mode === 'play' || this.mode === 'attract';
    if (playing !== this._playing) {
      this._playing = playing;
      document.body.classList.toggle('playing', playing);
    }
    let nav = Input.nav;
    if (this.ignoreNav > 0) {
      this.ignoreNav--;
      nav = Input._blankNav();
    }
    if (this.busy) nav = Input._blankNav();

    switch (this.mode) {
      case 'menu': {
        if (!this.busy && UI.stack.length === 0) {
          this.showTitle(); // nothing to show: never leave the player without a screen
          break;
        }
        UI.update(nav);
        Diorama.render(now, raw);
        Hud.clear();
        // attract mode: 10 s of no input on the title screen itself
        const onTitle = this.ctx === 'title' && !this.gate && !this.busy && UI.stack.length === 1 && UI.cur && UI.cur.title;
        if (onTitle) {
          if (Input.activity) this.idleFrom = now;
          if (now - this.idleFrom >= 10) this.beginAttract();
        } else this.idleFrom = now;
        break;
      }
      case 'play': {
        const g = G;
        const ctl = this.busy ? Input._blankCtl() : Input.ctl;
        if (ctl.pause && !this.busy && (g.state === 'play' || g.state === 'intro')) {
          this.pause();
          renderGame(g, now);
          Hud.draw(g, now);
          break;
        }
        updateGame(g, raw * g.timeScale, ctl, raw);
        renderGame(g, now);
        Hud.draw(g, now);
        if (g.state === 'clear' && g.clearT > 4.6 && !this.busy) this.stageComplete();
        else if (g.state === 'over' && g.stateT > 1.8 && !this.gameOverShown) this.openGameOver();
        break;
      }
      case 'paused': {
        UI.update(nav);
        renderGame(G, now);
        Hud.draw(G, now);
        break;
      }
      case 'attract': {
        const g = G;
        if (Input.activity) {
          this.exitAttract();
          break;
        }
        const ctl = AI.update(g, raw);
        updateGame(g, raw * g.timeScale, ctl, raw);
        renderGame(g, now);
        Hud.draw(g, now);
        if ((g.state === 'clear' && g.clearT > 3.6) || g.t > 540) {
          this.mode = 'attractWait';
          this.attractNext();
        }
        break;
      }
      case 'attractWait':
      case 'exiting': {
        // frozen on the last frame while the fade plays
        if (G) {
          renderGame(G, now);
          Hud.draw(G, now);
        } else {
          Diorama.render(now, raw);
          Hud.clear();
        }
        if (this.mode === 'attractWait' && Input.activity) this.wantExit = true;
        break;
      }
      default:
        break;
    }
  },
};


/* ---------------- 99_main.js ---------------- */
/* ============================================================================
   99_main.js — boot sequence + main loop
   ========================================================================== */
function showFatal(title, lines) {
  const f = document.getElementById('fatal');
  const boot = document.getElementById('boot');
  if (boot) boot.hidden = true;
  if (!f) return;
  f.hidden = false;
  f.innerHTML = '<div class="fatal-card"><h2></h2></div>';
  f.querySelector('h2').textContent = title;
  const card = f.querySelector('.fatal-card');
  for (const l of lines) {
    const p = document.createElement('p');
    p.textContent = l;
    card.appendChild(p);
  }
}

async function bootGame() {
  const bootMsg = document.getElementById('bootMsg');
  const say2 = (m) => { if (bootMsg) bootMsg.textContent = m; };
  try {
    Save.load();
    Input.init();
    const canvas = document.getElementById('gpu');
    GPU = new Renderer(canvas);
    GPU.renderScale = Settings.renderScale;
    try {
      await GPU.init(say2);
    } catch (e) {
      console.error(e);
      showFatal('WebGPU is required', [String(e && e.message ? e.message : e), 'Starfoxtrot 64 renders exclusively with WebGPU (no fallback). Please open it in a current desktop Chrome or Edge, or another browser with WebGPU enabled.']);
      return;
    }
    say2('Sculpting low-poly ships…');
    buildModels(GPU);
    Hud.init(document.getElementById('hud'));
    UI.init(document.getElementById('ui'));
    App.fadeEl = document.getElementById('fade');

    // touch-only devices: no touch controls — ask for a controller or keyboard
    const coarse = window.matchMedia && window.matchMedia('(any-pointer: coarse)').matches;
    const fine = window.matchMedia && window.matchMedia('(any-pointer: fine)').matches;
    const hover = window.matchMedia && window.matchMedia('(any-hover: hover)').matches;
    const touchOnly = coarse && !fine && !hover;
    const gateEl = document.getElementById('touchgate');
    if (touchOnly) {
      App.gate = true;
      gateEl.hidden = false;
      document.getElementById('tgSettings').addEventListener('click', () => {
        document.getElementById('ui').classList.add('over-gate');
        if (UI.stack.length > 1) return;
        UI.open(screenSettings());
      });
      App.onSettingsClosed = () => {
        if (App.gate) document.getElementById('ui').classList.remove('over-gate');
      };
    }

  } catch (e) {
    console.error(e);
    showFatal('Startup failed', [String(e && e.message ? e.message : e), 'Please reload the page. If this keeps happening, make sure your browser supports WebGPU.']);
    return;
  }

  try {
    document.getElementById('boot').hidden = true;
    App.showTitle();
    lastT = performance.now() / 1000;
    requestAnimationFrame(frame);
  } catch (e) {
    console.error(e);
    showFatal('Startup failed', [String(e && e.message ? e.message : e), 'Please reload the page.']);
  }
}

let lastT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const now = ts / 1000;
  const raw = Math.min(0.05, Math.max(0.0005, now - lastT));
  lastT = now;
  try {
    App.tick(raw, now);
    App.errCount = Math.max(0, App.errCount - 0.05);
  } catch (e) {
    App.errCount += 1;
    if (App.errCount < 4) console.error('frame error', e);
    if (App.errCount > 90 && App.mode !== 'menu') {
      // a soft-lock guard: bail to the title screen instead of looping on an error forever
      App.errCount = 0;
      try {
        UI.closeAll();
        App.showTitle();
      } catch (e2) { /* ignore */ }
    }
  }
  Input.endFrame();
}

window.addEventListener('resize', () => {
  if (GPU && GPU.device) GPU.resize();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && App.mode === 'play') App.pause();
});
window.addEventListener('pagehide', () => Save.store());
window.addEventListener('unhandledrejection', (e) => console.error('unhandled rejection', e.reason));
window.addEventListener('error', (e) => {
  console.error('window error', e.message);
});

bootGame();


})();
