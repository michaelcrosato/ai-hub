/* ============================================================================
   50_fx.js — CPU particle system, debris chunks, dynamic lights, screen shake.
   Kinds: 0 soft glow, 1 cel disc, 2 ring, 3 streak, 4 star spark, 5 cel smoke puff
   ========================================================================== */
let GPU = null; // the Renderer instance (set at boot)

const FX = {
  parts: [],
  debris: [],
  lights: [],
  shake: 0,
  flash: 0,
  flashColor: [1, 1, 1],
  hurt: 0,

  reset() {
    this.parts.length = 0;
    this.debris.length = 0;
    this.lights.length = 0;
    this.shake = 0;
    this.flash = 0;
    this.hurt = 0;
  },

  addShake(a) {
    this.shake = Math.min(1.5, this.shake + a);
  },

  p(o) {
    if (this.parts.length > 3500) return;
    // o: x,y,z, vx,vy,vz, life, size, size1, c0:[r,g,b], c1, a, kind, add, drag, grav, dir
    const c0 = o.c0 || [1, 1, 1];
    this.parts.push({
      x: o.x, y: o.y, z: o.z, vx: o.vx || 0, vy: o.vy || 0, vz: o.vz || 0,
      life: o.life, max: o.life, s0: o.size, s1: o.size1 === undefined ? o.size : o.size1,
      c0, c1: o.c1 || c0, a: o.a === undefined ? 1 : o.a, kind: o.kind || 0, add: o.add !== false,
      drag: o.drag || 0, grav: o.grav || 0, stretch: o.stretch || 0, fade: o.fade === undefined ? 1 : o.fade,
    });
  },

  light(x, y, z, r, g, b, radius, intensity, life) {
    this.lights.push({ x, y, z, r, g, b, radius, intensity, life, max: life });
  },

  /* ---- ready-made effects ---- */
  explosion(x, y, z, s, palette) {
    const hot = (palette && palette[0]) || [1.0, 0.85, 0.35];
    const mid = (palette && palette[1]) || [1.0, 0.42, 0.12];
    const cold = (palette && palette[2]) || [0.25, 0.14, 0.2];
    this.p({ x, y, z, life: 0.22, size: 4 * s, size1: 9 * s, c0: [1, 1, 0.9], a: 1, kind: 0 });
    const n = 6 + Math.floor(s * 3);
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), b = rnd(-1, 1), sp = rnd(3, 11) * s;
      this.p({
        x: x + rnd(-0.4, 0.4) * s, y: y + rnd(-0.4, 0.4) * s, z: z + rnd(-0.4, 0.4) * s,
        vx: Math.cos(a) * Math.sqrt(1 - b * b) * sp, vy: b * sp, vz: Math.sin(a) * Math.sqrt(1 - b * b) * sp,
        life: rnd(0.45, 0.9), size: rnd(1.3, 2.4) * s, size1: rnd(2.6, 4.2) * s,
        c0: hot, c1: mid, kind: 1, add: false, drag: 2.2, a: 1,
      });
    }
    this.p({ x, y, z, life: 0.5, size: 1.5 * s, size1: 11 * s, c0: [1, 0.95, 0.8], a: 0.9, kind: 2 });
    const ns = 10 + Math.floor(s * 5);
    for (let i = 0; i < ns; i++) {
      const a = rnd(0, TAU), b = rnd(-1, 1), sp = rnd(12, 36) * Math.sqrt(s);
      const vx = Math.cos(a) * Math.sqrt(1 - b * b) * sp, vy = b * sp, vz = Math.sin(a) * Math.sqrt(1 - b * b) * sp;
      this.p({ x, y, z, vx, vy, vz, life: rnd(0.25, 0.6), size: 0.22 * s + 0.1, size1: 0.05, c0: [1, 0.9, 0.5], c1: [1, 0.4, 0.1], kind: 3, stretch: 0.07, drag: 1.2, a: 1 });
    }
    for (let i = 0; i < 3 + Math.floor(s); i++) {
      this.p({
        x: x + rnd(-1, 1) * s, y: y + rnd(-1, 1) * s, z: z + rnd(-1, 1) * s, vx: rnd(-2, 2), vy: rnd(0.5, 3), vz: rnd(-2, 2),
        life: rnd(0.9, 1.6), size: rnd(1.5, 2.5) * s, size1: rnd(3.5, 5.5) * s, c0: [0.35, 0.3, 0.38], c1: cold, kind: 5, add: false, drag: 1.4, a: 0.85,
      });
    }
    this.light(x, y, z, 1.0, 0.6, 0.25, 26 * s + 8, 2.2, 0.35);
  },
  chunks(x, y, z, n, col, speed) {
    for (let i = 0; i < n; i++) {
      this.debris.push({
        x, y, z, vx: rnd(-1, 1) * speed, vy: rnd(-0.4, 1) * speed, vz: rnd(-1, 1) * speed,
        rx: rnd(0, TAU), ry: rnd(0, TAU), vrx: rnd(-6, 6), vry: rnd(-6, 6), sz: rnd(0.3, 0.9), life: rnd(0.9, 1.8), max: 1.8, col,
      });
    }
  },
  hitSpark(x, y, z, col) {
    const c = col || [1, 0.9, 0.5];
    this.p({ x, y, z, life: 0.12, size: 1.1, size1: 2.2, c0: [1, 1, 1], kind: 4, a: 1 });
    for (let i = 0; i < 4; i++) {
      this.p({ x, y, z, vx: rnd(-18, 18), vy: rnd(-18, 18), vz: rnd(-18, 18), life: 0.22, size: 0.14, size1: 0.04, c0: c, kind: 3, stretch: 0.05, drag: 2, a: 1 });
    }
  },
  muzzle(x, y, z, col) {
    this.p({ x, y, z, life: 0.07, size: 0.9, size1: 0.2, c0: col || [0.5, 1, 1], kind: 0, a: 1 });
  },
  puff(x, y, z, s, col) {
    this.p({ x, y, z, vx: rnd(-1, 1), vy: rnd(0, 2), vz: rnd(-1, 1), life: 0.9, size: s, size1: s * 2.2, c0: col || [0.4, 0.4, 0.45], kind: 5, add: false, drag: 1.5, a: 0.8 });
  },
  smokeTrail(x, y, z, s) {
    this.p({ x, y, z, vx: rnd(-0.5, 0.5), vy: rnd(0, 1), vz: rnd(-0.5, 0.5), life: 0.8, size: s, size1: s * 2.4, c0: [0.28, 0.27, 0.32], kind: 5, add: false, drag: 1, a: 0.8 });
    this.p({ x, y, z, life: 0.25, size: s * 1.1, size1: s * 0.3, c0: [1, 0.6, 0.2], kind: 0, a: 0.9 });
  },
  shockwave(x, y, z, size, col) {
    this.p({ x, y, z, life: 0.7, size: size * 0.1, size1: size, c0: col || [1, 1, 1], kind: 2, a: 0.9 });
  },
  confetti(x, y, z) {
    const cols = [PAL.yellow, PAL.magenta, PAL.glass, PAL.lime, PAL.orange, PAL.white];
    for (let i = 0; i < 18; i++) {
      this.p({ x, y, z, vx: rnd(-14, 14), vy: rnd(2, 16), vz: rnd(-14, 14), life: rnd(0.8, 1.6), size: 0.35, size1: 0.2, c0: pick(cols), kind: 1, add: true, drag: 1.2, grav: 12, a: 1 });
    }
  },

  update(dt) {
    const P = this.parts;
    for (let i = P.length - 1; i >= 0; i--) {
      const q = P[i];
      q.life -= dt;
      if (q.life <= 0) {
        P[i] = P[P.length - 1];
        P.pop();
        continue;
      }
      if (q.drag) {
        const k = Math.max(0, 1 - q.drag * dt);
        q.vx *= k; q.vy *= k; q.vz *= k;
      }
      q.vy -= q.grav * dt;
      q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
    }
    const D = this.debris;
    for (let i = D.length - 1; i >= 0; i--) {
      const d = D[i];
      d.life -= dt;
      if (d.life <= 0) {
        D[i] = D[D.length - 1];
        D.pop();
        continue;
      }
      d.vy -= 9 * dt;
      d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
      d.rx += d.vrx * dt; d.ry += d.vry * dt;
    }
    const L = this.lights;
    for (let i = L.length - 1; i >= 0; i--) {
      L[i].life -= dt;
      if (L[i].life <= 0) {
        L[i] = L[L.length - 1];
        L.pop();
      }
    }
    this.shake = Math.max(0, this.shake - dt * 1.6);
    this.flash = Math.max(0, this.flash - dt * 2.5);
    this.hurt = Math.max(0, this.hurt - dt * 1.5);
  },

  draw() {
    const R = GPU;
    for (const q of this.parts) {
      const t = 1 - q.life / q.max;
      const s = q.s0 + (q.s1 - q.s0) * t;
      const r = q.c0[0] + (q.c1[0] - q.c0[0]) * t;
      const g = q.c0[1] + (q.c1[1] - q.c0[1]) * t;
      const b = q.c0[2] + (q.c1[2] - q.c0[2]) * t;
      const a = q.a * Math.pow(1 - t, q.fade);
      if (q.kind === 3) {
        const st = q.stretch || 0.06;
        let dx = q.vx * st, dy = q.vy * st, dz = q.vz * st;
        if (dx === 0 && dy === 0 && dz === 0) dz = 0.5;
        R.particle(q.add, q.x, q.y, q.z, s, r, g, b, a, 3, dx, dy, dz);
      } else {
        R.particle(q.add, q.x, q.y, q.z, s, r, g, b, a, q.kind, 0, 0, 0);
      }
    }
    for (const d of this.debris) {
      const k = Math.min(1, d.life / 0.5);
      GPU.draw(M.cube, d.x, d.y, d.z, qFromYPR(d.ry, d.rx, 0), d.sz * k, d.sz * k * 0.7, d.sz * k, FX.debrisStyle(d.col), 0);
    }
    // push the brightest lights to the GPU
    const L = this.lights.slice().sort((a, b) => b.intensity * b.life / b.max - a.intensity * a.life / a.max);
    for (let i = 0; i < Math.min(L.length, 10); i++) {
      const l = L[i];
      R.light(l.x, l.y, l.z, l.r, l.g, l.b, l.radius, l.intensity * (l.life / l.max));
    }
  },
  _dstyles: new Map(),
  debrisStyle(col) {
    const key = col.join(',');
    let s = this._dstyles.get(key);
    if (!s) {
      s = mkStyle({ r: col[0], g: col[1], b: col[2], sh: 0 });
      this._dstyles.set(key, s);
    }
    return s;
  },
};

/* immediate-mode helpers used during draw */
function glow(x, y, z, size, r, g, b, a) {
  GPU.particle(true, x, y, z, size, r, g, b, a === undefined ? 1 : a, 0, 0, 0, 0);
}
function streak(x, y, z, width, dx, dy, dz, r, g, b, a) {
  GPU.particle(true, x, y, z, width, r, g, b, a === undefined ? 1 : a, 3, dx, dy, dz);
}


/* ---------------- 51_game.js ---------------- */
/* ============================================================================
   51_game.js — game state, difficulty, run (campaign) data, frame update + camera.
   ========================================================================== */
const DIFF = [
  { name: 'CADET', enemyHp: 0.75, dmg: 0.6, shield: 130, rings: 1.6, fire: 0.7, spd: 0.9 },
  { name: 'PILOT', enemyHp: 1.0, dmg: 1.0, shield: 100, rings: 1.0, fire: 1.0, spd: 1.0 },
  { name: 'ACE', enemyHp: 1.35, dmg: 1.5, shield: 80, rings: 0.6, fire: 1.35, spd: 1.12 },
];

const WING_INFO = {
  waltz: { name: 'WALTZ', mesh: 'ship_waltz', slot: [-9, 3.5, 7], tint: PAL.forest },
  tango: { name: 'TANGO', mesh: 'ship_tango', slot: [9.5, 2.0, 4], tint: PAL.crimson },
  jive: { name: 'JIVE', mesh: 'ship_jive', slot: [0, 8.5, 11], tint: PAL.lime },
};

let _guardWarn = 0;
/* run a piece of per-frame logic without letting one faulty entity take the whole frame down */
function guard(f) {
  try {
    f();
  } catch (e) {
    if (_guardWarn++ < 8) console.error('guarded error:', e);
  }
}

let G = null; // current game session
let Run = null; // current campaign run

function newRun() {
  return {
    score: 0, lives: 3, bombs: 3, laser: 1,
    allies: { waltz: true, tango: true, jive: true },
    saved: 0, lost: 0, totalHits: 0, results: [], route: [], gold: 0, started: performance.now(),
  };
}

function lowerBound(arr, key, val) {
  let lo = 0, hi = arr.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid][key] < val) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}

function newGame(stage, run, opts) {
  opts = opts || {};
  const diff = DIFF[opts.attract ? 1 : Settings.difficulty];
  const g = {
    stage, mode: stage.mode, attract: !!opts.attract, run, diff,
    time: 0, t: 0, s: 0, speedMul: 1, timeScale: 1,
    state: 'intro', stateT: 0,
    player: null,
    enemies: [], pb: [], eb: [], items: [], wing: [], timers: [],
    props: [], propLo: 0, events: [], evIdx: 0,
    score: run.score, hits: 0, chain: 0, chainT: 0, mult: 1, maxChain: 0,
    lives: run.lives, bombCount: run.bombs, laser: run.laser, gold: 0,
    deaths: 0, saved: 0, lost: 0,
    cp: null, boss: null, bossActive: false, bossDefeated: false, bossBar: null,
    cam: { x: 0, y: 8, z: 12, fov: 1.08, roll: 0, fwd: [0, 0, -1], ex: 0, ey: 0, ez: 0 },
    clearT: 0, objective: null, arenaKills: 0,
    flashMsg: null, flashT: 0,
    hitMark: 0, bossHitMark: 0,
    muteBeep: 0, lowAlarm: 0,
    introSkippable: true,
  };
  G = g;
  FX.reset();
  const P = makePlayer(g, stage);
  g.player = P;
  // wingmen
  if (stage.wingmen !== false) {
    for (const id of ['waltz', 'tango', 'jive']) if (run.allies[id]) g.wing.push(makeWingman(g, id));
  }
  stage.build(g);
  if (stage.cps) {
    for (const cs0 of stage.cps) {
      g.events.push({
        s: cs0,
        fn: (gg) => {
          if (gg.cp && gg.cp.boss) return;
          gg.cp = { s: gg.s, ev: gg.evIdx, kills: gg.hits };
          flashMessage('CHECKPOINT', 1.4);
        },
      });
    }
  }
  g.events.sort((a, b) => a.s - b.s);
  g.props.sort((a, b) => a.s - b.s);
  g.cp = { s: 0, ev: 0, kills: 0 };
  initCamera(g);
  Comms.reset();
  Sound.engineStart();
  Music.start(stage.music);
  if (stage.intro) stage.intro(g);
  return g;
}

function makePlayer(g, stage) {
  const b = stage.bounds || { x: 24, y0: 3, y1: 24 };
  const P = {
    x: 0, y: stage.startY !== undefined ? stage.startY : (b.y0 + b.y1) / 2, z: 0,
    lx: 0, ly: stage.startY !== undefined ? stage.startY : (b.y0 + b.y1) / 2,
    vx: 0, vy: 0, r: 1.5,
    bank: 0, pitchV: 0, yawV: 0, rollAng: 0, rollT: 0, rollDur: 0.62, rollDir: 1, rollCd: 0,
    shield: g.diff.shield, maxShield: g.diff.shield, invuln: 0, alive: true, respawn: 0,
    boostG: 1, heat: 0, boosting: false, braking: false,
    charge: 0, locks: [], lockT: 0, fireCd: 0, chargeFiring: [],
    aimX: 0, aimY: 0, reticle: [0, 0, -60], nearRet: [0, 0, -30],
    q: [0, 0, 0, 1], hurtT: 0, flashT: 0,
    // all-range
    yaw: 0, pitch: 0, speed: 0, loop: null, fwd: [0, 0, -1], bankA: 0, outT: 0,
    killedBy: null,
  };
  if (stage.mode === 'allrange') {
    P.x = stage.spawn ? stage.spawn[0] : 0;
    P.y = stage.spawn ? stage.spawn[1] : 40;
    P.z = stage.spawn ? stage.spawn[2] : 120;
    P.yaw = stage.spawnYaw || 0;
    P.speed = stage.speed;
  }
  return P;
}

function makeWingman(g, id) {
  const info = WING_INFO[id];
  const P = g.player;
  return {
    id, info, x: P.x + info.slot[0], y: P.y + info.slot[1], z: P.z - info.slot[2], vx: 0, vy: 0, vz: 0,
    hp: 100, alive: true, chasedBy: null, helpT: 0, fireCd: rnd(0.2, 1), phase: rnd(0, TAU), r: 1.6,
    leaving: false, savedT: 0, q: [0, 0, 0, 1], bank: 0, retreat: 0,
    // all-range
    fwd: [0, 0, -1], speed: 60, target: null, tgtT: 0, flashT: 0,
  };
}

/* ---------- shared helpers ---------- */
function say(who, text, dur) {
  if (!G) return;
  Comms.say(who, text, dur);
}
function addScore(base) {
  if (!G) return;
  G.score += Math.round(base * G.mult);
}
function addChain(n) {
  if (!G) return;
  G.chain += n;
  G.chainT = 3.2;
  if (G.chain > G.maxChain) G.maxChain = G.chain;
  G.mult = Math.min(8, 1 + Math.floor(G.chain / 6));
}
function after(t, fn) {
  G.timers.push({ t: G.time + t, fn });
}
function flashMessage(text, dur) {
  G.flashMsg = text;
  G.flashT = dur || 2.2;
}
function setObjective(text) {
  G.objective = text;
}
function railCenter(s) {
  const st = G.stage;
  return st.curve ? st.curve(s) : 0;
}

/* ---------- camera ---------- */
/* where the rails camera wants to sit: follows the ship across most of the lane so it never leaves the frame */
function railCamGoal(g) {
  const P = g.player;
  const b = g.stage.boundsAt ? g.stage.boundsAt(g.s) : g.stage.bounds;
  const dz = 11.5 + Math.max(0, g.speedMul - 1) * 1.6;
  const cxr = railCenter(g.s - dz);
  const hx = (b.x1 - b.x0) / 2, hy = (b.y1 - b.y0) / 2, yc = (b.y0 + b.y1) / 2;
  const kx = clamp(1 - 4.5 / hx, 0.75, 0.9), ky = clamp(1 - 2.4 / hy, 0.78, 0.92);
  return [cxr + (P.x - cxr) * kx + P.vx * 0.1, yc + (P.y - yc) * ky + 1.9, P.z + dz];
}
function initCamera(g) {
  const P = g.player;
  const c = g.cam;
  c.up = [0, 1, 0];
  if (g.mode === 'rails') {
    const goal = railCamGoal(g);
    c.ex = goal[0];
    c.ey = goal[1];
    c.ez = goal[2];
  } else {
    const f = P.fwd = fwdFromAngles(P.yaw, P.pitch);
    c.fwd = f.slice();
    c.ex = P.x - f[0] * 15;
    c.ey = P.y - f[1] * 15 + 4.5;
    c.ez = P.z - f[2] * 15;
  }
}
function fwdFromAngles(yaw, pitch) {
  const cp = Math.cos(pitch);
  return [-Math.sin(yaw) * cp, Math.sin(pitch), -Math.cos(yaw) * cp];
}

function updateCamera(g, dt) {
  const P = g.player, c = g.cam;
  const k = 1 - Math.exp(-dt * 8);
  let fovT = 1.08;
  if (g.mode === 'rails') {
    const bossLook = g.stage.camBias ? g.stage.camBias(g) : 0;
    const goal = railCamGoal(g);
    c.ex += (goal[0] - c.ex) * k;
    c.ey += (goal[1] - c.ey) * k;
    c.ez = goal[2];
    fovT = 1.08 + Math.max(0, g.speedMul - 1) * 0.26 + (P.rollT > 0 ? 0.05 : 0);
    c.roll = damp(c.roll, P.vx * 0.003, 4, dt);
    c.bias = damp(c.bias || 0, bossLook, 2, dt);
  } else {
    const f = P.fwd;
    const sf = c.fwd;
    const k2 = 1 - Math.exp(-dt * (P.loop ? 2.5 : 4.5));
    sf[0] += (f[0] - sf[0]) * k2; sf[1] += (f[1] - sf[1]) * k2; sf[2] += (f[2] - sf[2]) * k2;
    const n = vnorm(sf);
    c.fwd = n;
    const back = 15 + (g.speedMul - 1) * 4;
    const upGoal = P.loop && P.upv ? P.upv : [0, 1, 0];
    const ku = 1 - Math.exp(-dt * (P.loop ? 6 : 3));
    const cu = c.up || [0, 1, 0];
    c.up = vnorm([cu[0] + (upGoal[0] - cu[0]) * ku, cu[1] + (upGoal[1] - cu[1]) * ku, cu[2] + (upGoal[2] - cu[2]) * ku]);
    const tx = P.x - n[0] * back, ty = Math.max((g.stage.groundY || 0) + 2.5, P.y - n[1] * back + 4.2), tz = P.z - n[2] * back;
    c.ex += (tx - c.ex) * (1 - Math.exp(-dt * 9));
    c.ey += (ty - c.ey) * (1 - Math.exp(-dt * 9));
    c.ez += (tz - c.ez) * (1 - Math.exp(-dt * 9));
    fovT = 1.12 + (g.speedMul - 1) * 0.22;
    c.roll = damp(c.roll, -P.bankA * 0.18, 4, dt);
  }
  c.fov = damp(c.fov, fovT, 5, dt);
}

/* ---------- main per-frame update for an active stage ---------- */
function updateGame(g, dt, ctl, rawDt) {
  g.time += dt;
  if (g.flashT > 0) g.flashT -= rawDt;
  if (g.hitMark > 0) g.hitMark -= rawDt;
  g.stateT += dt;

  // scripted timers
  for (let i = g.timers.length - 1; i >= 0; i--) {
    if (g.time >= g.timers[i].t) {
      const f = g.timers[i].fn;
      g.timers.splice(i, 1);
      f();
    }
  }

  if (g.state === 'intro') {
    // camera fly-in; auto-start when done
    if (g.stateT > (g.stage.introTime || 2.6) || (ctl && ctl.firePressed)) {
      g.state = 'play';
      g.stateT = 0;
      if (g.stage.onStart) g.stage.onStart(g);
    }
  }
  const active = g.state === 'play' || g.state === 'dead' || g.state === 'clear' || g.state === 'intro';
  if (active) {
    if (g.state === 'play' || g.state === 'intro') g.t += dt;
    if (g.chainT > 0) {
      g.chainT -= dt;
      if (g.chainT <= 0) {
        g.chain = 0;
        g.mult = 1;
      }
    }
    if (g.mode === 'rails') guard(() => updateRailsFrame(g, dt, ctl));
    else guard(() => updateArenaFrame(g, dt, ctl));
    guard(() => updateWingmen(g, dt));
    guard(() => updateEnemies(g, dt));
    guard(() => updateBullets(g, dt));
    guard(() => updateItems(g, dt));
    if (g.stage.update) guard(() => g.stage.update(g, dt));
  }
  guard(() => FX.update(rawDt));
  guard(() => Comms.update(rawDt));
  guard(() => updateCamera(g, dt));
  if (g.state === 'clear') {
    g.clearT += rawDt;
  }
  // low-shield alarm
  const P = g.player;
  if (g.state === 'play' && P.alive && P.shield < P.maxShield * 0.28 && !g.attract) {
    g.lowAlarm -= rawDt;
    if (g.lowAlarm <= 0) {
      Sound.play('alarm');
      g.lowAlarm = 0.55;
    }
  }
  const sp = g.mode === 'rails' ? g.speedMul : P.speed / (g.stage.speed || 70);
  Sound.engineUpdate(sp * 0.8, clamp(g.speedMul - 1, 0, 1), g.state === 'play' || g.state === 'intro');
}

function updateRailsFrame(g, dt, ctl) {
  const P = g.player, S = g.stage;
  const playing = g.state === 'play' || g.state === 'intro' || g.state === 'clear';
  if (g.state === 'intro') {
    // slow glide in
    g.speedMul = damp(g.speedMul, 0.5, 3, dt);
  }
  if (playing && g.state !== 'dead') {
    const sv = g.state === 'clear' ? 1.4 : 1;
    const frozen = g.stage.freezeRail && g.stage.freezeRail(g);
    const base = S.speed * g.diff.spd * (S.speedAt ? S.speedAt(g.s) : 1);
    if (!frozen) g.s += base * g.speedMul * sv * dt;
  }
  P.z = -g.s;
  // events
  if (g.state === 'play') {
    while (g.evIdx < g.events.length && g.events[g.evIdx].s <= g.s) {
      const ev = g.events[g.evIdx++];
      try { ev.fn(g); } catch (e) { console.error('event error', e); }
    }
  }
  if (g.state === 'play' || g.state === 'intro') updatePlayerRails(g, dt, ctl);
  else if (g.state === 'clear') {
    // victory fly-away
    P.vx = damp(P.vx, 0, 2, dt);
    P.ly += dt * 2.2;
    P.lx = damp(P.lx, 0, 1.5, dt);
    P.x = railCenter(g.s) + P.lx;
    P.y = P.ly;
    P.bank = damp(P.bank, 0, 3, dt);
    P.q = qFromYPR(0, 0.2, P.bank);
  } else if (g.state === 'dead') {
    updateDeadState(g, dt);
  }
}

function updateDeadState(g, dt) {
  const P = g.player;
  P.respawn -= dt;
  if (P.respawn <= 0) {
    if (g.lives > 0) respawnPlayer(g);
    else {
      g.state = 'over';
      g.stateT = 0;
    }
  }
}

function killPlayer(g) {
  const P = g.player;
  if (!P.alive) return;
  P.alive = false;
  P.shield = 0;
  g.lives--;
  g.deaths++;
  g.chain = 0; g.mult = 1;
  g.state = 'dead';
  g.stateT = 0;
  P.respawn = 2.6;
  FX.explosion(P.x, P.y, P.z, 2.6);
  FX.chunks(P.x, P.y, P.z, 10, PAL.white, 18);
  FX.addShake(1.2);
  FX.flash = 0.9;
  Sound.play('explodeBig');
  Input.rumble(1, 1, 500);
  P.charge = 0; P.locks.length = 0;
  Sound.chargeUpdate(0, false);
  say('jive', g.lives > 0 ? 'Ember! Hang on — retry!' : 'Ember! No... no!', 2.4);
}

function respawnPlayer(g) {
  const P = g.player;
  const cp = g.cp;
  g.timeScale = 1;
  if (g.bossDefeated || (g.boss && g.boss.alive && g.boss.dying)) {
    // the boss fell (or is falling) while we were down: keep the victory instead of replaying the fight
    P.alive = true;
    P.shield = P.maxShield;
    P.invuln = 5;
    g.stateT = 0;
    if (g.bossDefeated) {
      g.state = 'clear';
      g.clearT = 0;
      Music.start('victory');
    } else g.state = 'play';
    return;
  }
  // wipe volatile entities
  g.enemies.length = 0; g.eb.length = 0; g.pb.length = 0; g.items.length = 0;
  g.timers.length = 0;
  g.boss = null; g.bossActive = false; g.bossBar = null;
  FX.parts.length = 0;
  if (g.mode === 'rails') {
    g.s = cp.s;
    g.evIdx = cp.ev !== undefined ? cp.ev : lowerBound(g.events, 's', cp.s - 0.001);
    g.propLo = 0;
    P.lx = 0;
    P.ly = (g.stage.bounds.y0 + g.stage.bounds.y1) / 2;
    if (g.stage.startY !== undefined && cp.s === 0) P.ly = g.stage.startY;
    P.vx = P.vy = 0;
    P.z = -g.s;
    P.x = railCenter(g.s) + P.lx;
    P.y = P.ly;
    g.speedMul = 1;
    if (g.stage.onRespawn) g.stage.onRespawn(g);
  } else {
    P.x = g.stage.spawn[0]; P.y = g.stage.spawn[1]; P.z = g.stage.spawn[2];
    P.yaw = g.stage.spawnYaw || 0; P.pitch = 0; P.loop = null; P.speed = g.stage.speed;
    P.fwd = fwdFromAngles(P.yaw, P.pitch);
    if (g.stage.onRespawn) g.stage.onRespawn(g);
  }
  P.alive = true;
  P.shield = P.maxShield;
  P.invuln = 3.2;
  P.boostG = 1; P.heat = 0;
  g.bombCount = Math.max(g.bombCount, 2);
  g.laser = Math.max(1, g.laser - 1);
  for (const w of g.wing) {
    if (w.alive && !w.leaving) {
      w.chasedBy = null;
      w.hp = Math.max(w.hp, 60);
      if (g.mode === 'rails') {
        w.x = P.x + w.info.slot[0];
        w.y = P.y + w.info.slot[1];
        w.z = P.z - w.info.slot[2];
        w.pz = undefined;
        w.pcx = undefined;
      }
    }
  }
  g.state = 'play';
  g.stateT = 0;
  initCamera(g);
  Music.start(g.cp.boss ? (g.stage.bossMusic || 'boss') : g.stage.music);
  flashMessage('CHECKPOINT', 1.6);
  Sound.play('pickup');
}

/* ---------- rendering of one game frame ---------- */
function renderGame(g, time) {
  const R = GPU;
  R.begin();
  const S = g.stage;
  const P = g.player;
  const c = g.cam;

  // camera shake
  const sh = FX.shake * FX.shake * (Settings.shake) * 1.2;
  const camPos = [c.ex + rnd(-sh, sh), c.ey + rnd(-sh, sh), c.ez + rnd(-sh, sh)];
  let target, up = [Math.sin(c.roll), Math.cos(c.roll), 0];
  if (g.mode !== 'rails') {
    let ub = c.up || [0, 1, 0];
    ub = vnorm(vsub(ub, vscale(c.fwd, vdot(ub, c.fwd))));
    const rt = vnorm(vcross(c.fwd, ub));
    up = vnorm([ub[0] * Math.cos(c.roll) + rt[0] * Math.sin(c.roll), ub[1] * Math.cos(c.roll) + rt[1] * Math.sin(c.roll), ub[2] * Math.cos(c.roll) + rt[2] * Math.sin(c.roll)]);
  }
  if (g.mode === 'rails') {
    // dramatic intro offset
    let intro = 0;
    if (g.state === 'intro') intro = Math.max(0, 1 - g.stateT / (S.introTime || 2.6));
    camPos[1] += intro * intro * 5;
    camPos[2] += intro * intro * 12;
    target = [railCenter(g.s + 40) + (c.ex - railCenter(g.s - (c.ez - P.z))) + (c.bias || 0), c.ey - 3.0, P.z - 40];
  } else {
    target = [c.ex + c.fwd[0] * 40, c.ey + c.fwd[1] * 40 - 3, c.ez + c.fwd[2] * 40];
  }
  const env = S.env;
  const beat = Music.beat;

  // scenery + entities
  guard(() => S.drawScenery(g, R, camPos));
  guard(() => drawPlayer(g, R));
  guard(() => drawWingmen(g, R));
  guard(() => drawEnemies(g, R));
  guard(() => drawBullets(g, R));
  guard(() => drawItems(g, R));
  guard(() => FX.draw());
  if (S.drawExtra) guard(() => S.drawExtra(g, R));

  const hurt = FX.hurt;
  const post = {
    vignette: 0.5 + (P.shield < P.maxShield * 0.28 ? 0.25 : 0),
    aberration: 0.0 + hurt * 0.04 + Math.max(0, g.speedMul - 1) * 0.02,
    bloom: Settings.bloom ? 0.6 : 0.0,
    flash: [FX.flashColor[0], FX.flashColor[1], FX.flashColor[2], clamp(FX.flash, 0, 1) * 0.8],
    speed: clamp((g.speedMul - 1.15) * 1.4, 0, 1),
    hurt: clamp(hurt, 0, 1),
    fade: g.fade || 0,
  };
  const shadowCenter = g.mode === 'rails' ? [P.x, 0, P.z - 28] : [P.x, 10, P.z];
  R.render({
    eye: camPos, target, up, fov: c.fov, time, beat, env, post,
    shadowCenter, shadowRadius: g.mode === 'rails' ? 78 : 120,
    outline: Settings.outline ? 1 : 0, near: 0.4, far: 2400,
  });
}


/* ---------------- 51b_player.js ---------------- */
/* ============================================================================
   51b_player.js — rails-mode player control, weapons (lasers / charged lock-on / bombs),
   damage, ring pickups and drawing of the player's ship.
   ========================================================================== */
const MAT = { STD: 0, WATER: 1, EMIT: 2, GRASS: 3, NEON: 4, STRATA: 5, BLD: 6 };
const easeIO = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);

const STY = {
  ship: mkStyle({}),
  bolt1: mkStyle({ mat: MAT.EMIT, r: 0.35, g: 1.0, b: 0.55, em: 1.6, ol: 0.5, sh: 0 }),
  bolt2: mkStyle({ mat: MAT.EMIT, r: 0.3, g: 0.85, b: 1.0, em: 1.7, ol: 0.5, sh: 0 }),
  bolt3: mkStyle({ mat: MAT.EMIT, r: 1.0, g: 0.9, b: 0.45, em: 1.8, ol: 0.5, sh: 0 }),
  homing: mkStyle({ mat: MAT.EMIT, r: 0.5, g: 0.8, b: 1.0, em: 2.0, ol: 0.5, sh: 0 }),
  plasma: mkStyle({ mat: MAT.EMIT, r: 0.7, g: 1.0, b: 1.0, em: 2.0, ol: 0.4, sh: 0 }),
  eshot: mkStyle({ mat: MAT.EMIT, r: 1.0, g: 0.35, b: 0.45, em: 1.6, ol: 0.6, sh: 0 }),
  eshot2: mkStyle({ mat: MAT.EMIT, r: 1.0, g: 0.75, b: 0.2, em: 1.6, ol: 0.6, sh: 0 }),
  reflect: mkStyle({ mat: MAT.EMIT, r: 0.9, g: 1.0, b: 1.0, em: 2.0, ol: 0.5, sh: 0 }),
  bomb: mkStyle({ mat: MAT.EMIT, r: 1.0, g: 0.8, b: 0.3, em: 1.8, ol: 0.8, sh: 0 }),
  ringS: mkStyle({ mat: MAT.EMIT, r: 0.85, g: 0.95, b: 1.0, em: 0.6, ol: 0.9, sh: 0 }),
  ringG: mkStyle({ mat: MAT.EMIT, r: 1.0, g: 0.85, b: 0.25, em: 0.9, ol: 0.9, sh: 0 }),
  item: mkStyle({ em: 0.35 }),
  glowy: mkStyle({ mat: MAT.EMIT, em: 1.5, ol: 0, sh: 0 }),
};

function updatePlayerRails(g, dt, ctl) {
  const P = g.player, S = g.stage;
  const b = S.boundsAt ? S.boundsAt(g.s) : S.bounds;
  if (P.invuln > 0) P.invuln -= dt;
  if (P.hurtT > 0) P.hurtT -= dt;
  if (P.rollCd > 0) P.rollCd -= dt;
  const intro = g.state === 'intro';
  if (!ctl) ctl = Input._blankCtl();

  // ---- boost / brake ----
  let target = 1;
  const wasBoost = P.boosting, wasBrake = P.braking;
  P.boosting = false;
  P.braking = false;
  if (!intro) {
    if (P.heat > 0) P.heat -= dt;
    if (ctl.boost && P.boostG > 0.02 && P.heat <= 0 && !(g.stage.noBoost && g.stage.noBoost(g))) {
      target = 1.75;
      P.boosting = true;
      P.boostG = Math.max(0, P.boostG - dt * 0.4);
      if (P.boostG <= 0.02) P.heat = 1.6;
    } else if (ctl.brake && P.boostG > 0.02 && P.heat <= 0) {
      target = 0.5;
      P.braking = true;
      P.boostG = Math.max(0, P.boostG - dt * 0.18);
    } else {
      P.boostG = Math.min(1, P.boostG + dt * (P.heat > 0 ? 0.08 : 0.24));
    }
    if (g.attract) P.boostG = 1;
    if (P.boosting && !wasBoost) Sound.play('boost');
    if (P.braking && !wasBrake) Sound.play('brake');
    g.speedMul = damp(g.speedMul, target, 4.5, dt);
  }

  // ---- lateral flight ----
  const maxV = 31;
  const mx = intro ? 0 : ctl.mx, my = intro ? 0 : ctl.my;
  P.vx = damp(P.vx, mx * maxV, 7.5, dt);
  P.vy = damp(P.vy, my * maxV * 0.85, 7.5, dt);
  P.lx += P.vx * dt;
  P.ly += P.vy * dt;
  if (P.lx > b.x1) { P.lx = b.x1; P.vx = Math.min(P.vx, 0); }
  if (P.lx < b.x0) { P.lx = b.x0; P.vx = Math.max(P.vx, 0); }
  if (P.ly > b.y1) { P.ly = b.y1; P.vy = Math.min(P.vy, 0); }
  if (P.ly < b.y0) { P.ly = b.y0; P.vy = Math.max(P.vy, 0); }
  P.x = railCenter(g.s) + P.lx;
  P.y = P.ly;
  P.z = -g.s;

  // ---- barrel roll ----
  if (!intro && P.rollT <= 0 && P.rollCd <= 0 && (ctl.rollL || ctl.rollR)) {
    P.rollDir = ctl.rollR ? 1 : -1;
    P.rollT = P.rollDur;
    P.vx += P.rollDir * 16;
    Sound.play('roll');
  }
  if (P.rollT > 0) {
    P.rollT -= dt;
    const p = clamp(1 - P.rollT / P.rollDur, 0, 1);
    P.rollAng = -P.rollDir * TAU * easeIO(p);
    if (P.rollT <= 0) {
      P.rollAng = 0;
      P.rollCd = 0.22;
    }
  } else P.rollAng = 0;
  P.bank = damp(P.bank, (-P.vx / maxV) * 0.8, 9, dt);
  P.pitchV = damp(P.pitchV, (P.vy / maxV) * 0.4, 9, dt);
  P.yawV = damp(P.yawV, (-P.vx / maxV) * 0.22, 9, dt);
  P.q = qFromYPR(P.yawV, P.pitchV, P.bank + P.rollAng);

  // ---- aiming ----
  const aimOn = Settings.freeAim || g.attract;
  P.aimX = damp(P.aimX, aimOn ? clamp(ctl.ax, -1, 1) : 0, 13, dt);
  P.aimY = damp(P.aimY, aimOn ? clamp(ctl.ay, -1, 1) : 0, 13, dt);
  P.reticle = [P.x + P.aimX * 40, P.y + P.aimY * 23, P.z - 78];
  P.nearRet = [P.x + P.aimX * 16.4, P.y + P.aimY * 9.4, P.z - 32];

  if (!intro) updateWeapons(g, dt, ctl);

  // ---- ground / prop collisions ----
  if (g.state === 'play') railCollisions(g, dt);
}

/* ---------- weapons shared between rails and all-range ---------- */
function updateWeapons(g, dt, ctl) {
  const P = g.player;
  if (!P.alive) return;
  P.fireCd -= dt;
  if (ctl.fire && P.fireCd <= 0) {
    fireLasers(g);
    P.fireCd = Math.max(P.fireCd, -0.02) + (g.laser >= 3 ? 0.11 : 0.135);
  }
  updateCharge(g, dt, ctl);
  if (ctl.bomb) fireBomb(g);
}

function muzzlePoints(g) {
  const P = g.player;
  const pts = [];
  const offs = g.laser >= 2 ? [[-1.55, -0.04, -1.1], [1.55, -0.04, -1.1]] : [[0, -0.12, -3.0]];
  for (const o of offs) {
    const r = qRotate(P.q, o);
    pts.push([P.x + r[0], P.y + r[1], P.z + r[2]]);
  }
  return pts;
}

function aimDirFrom(g, mx, my, mz) {
  const P = g.player;
  const R = P.reticle;
  let d = vnorm([R[0] - mx, R[1] - my, R[2] - mz]);
  // aim assist: gently bend the shot toward the enemy nearest to the aim line
  const assist = Settings.aimAssist;
  if (assist > 0) {
    let best = null, bestScore = 1e9, bestP = null;
    for (const e of g.enemies) {
      if (!e.alive || e.def.noAssist) continue;
      const alp = e.lockPos ? e.lockPos(e) : null;
      const ax0 = alp ? alp[0] : e.x, ay0 = alp ? alp[1] : e.y, az0 = alp ? alp[2] : e.z;
      const dx = ax0 - mx, dy = ay0 - my, dz = az0 - mz;
      const dist = Math.hypot(dx, dy, dz);
      if (dist < 12 || dist > 330) continue;
      const dot = (dx * d[0] + dy * d[1] + dz * d[2]) / dist;
      if (dot < 0.97) continue;
      const lat = Math.sqrt(Math.max(0, 1 - dot * dot)) * dist;
      if (lat < (e.hs ? 5.5 : e.r) + (assist === 2 ? 7 : 3.5) && lat < bestScore) {
        bestScore = lat;
        best = e;
        bestP = [ax0, ay0, az0];
      }
    }
    if (best) {
      const td = vnorm([bestP[0] - mx, bestP[1] - my, bestP[2] - mz]);
      const k = assist === 2 ? 0.9 : 0.55;
      d = vnorm([d[0] + (td[0] - d[0]) * k, d[1] + (td[1] - d[1]) * k, d[2] + (td[2] - d[2]) * k]);
    }
  }
  return d;
}

function fireLasers(g) {
  const P = g.player;
  const pts = muzzlePoints(g);
  const lvl = g.laser;
  const spd = 340;
  const sty = lvl >= 3 ? STY.bolt3 : lvl === 2 ? STY.bolt2 : STY.bolt1;
  const col = lvl >= 3 ? [1, 0.9, 0.5] : lvl === 2 ? [0.4, 0.9, 1] : [0.4, 1, 0.6];
  for (const m of pts) {
    const d = aimDirFrom(g, m[0], m[1], m[2]);
    g.pb.push({ kind: 'laser', x: m[0], y: m[1], z: m[2], vx: d[0] * spd, vy: d[1] * spd, vz: d[2] * spd, life: 1.1, dmg: lvl >= 3 ? 1.6 : 1, r: 0.7, sty, col });
    FX.muzzle(m[0] + d[0], m[1] + d[1], m[2] + d[2], col);
  }
  Sound.play(lvl >= 3 ? 'laser3' : lvl === 2 ? 'laser2' : 'laser', clamp((P.x - g.cam.ex) / 60, -0.6, 0.6));
}

function reticleScreen(g) {
  const P = g.player;
  return projectPoint(GPU.viewProj, P.reticle[0], P.reticle[1], P.reticle[2], GPU.width, GPU.height, {});
}

function findLockTarget(g) {
  const P = g.player;
  const rs = reticleScreen(g);
  if (!rs.vis) return null;
  const radius = (GPU.height / 1080) * 190;
  let best = null, bestD = 1e9;
  const tmp = {};
  for (const e of g.enemies) {
    if (!e.alive || e.def.lockable === false || P.locks.includes(e)) continue;
    if (g.mode === 'rails') {
      if (e.z > P.z - 8 || e.z < P.z - 380) continue;
    } else {
      const dx = e.x - P.x, dy = e.y - P.y, dz = e.z - P.z;
      const dist = Math.hypot(dx, dy, dz);
      if (dist > 420 || (dx * P.fwd[0] + dy * P.fwd[1] + dz * P.fwd[2]) / dist < 0.55) continue;
    }
    const lp = e.lockPos ? e.lockPos(e) : [e.x, e.y, e.z];
    projectPoint(GPU.viewProj, lp[0], lp[1], lp[2], GPU.width, GPU.height, tmp);
    if (!tmp.vis) continue;
    const d = Math.hypot(tmp.x - rs.x, tmp.y - rs.y);
    if (d < radius && d < bestD) {
      bestD = d;
      best = e;
    }
  }
  return best;
}

function updateCharge(g, dt, ctl) {
  const P = g.player;
  if (ctl.charge) {
    P.charge = Math.min(1, P.charge + dt / 0.95);
    if (P.charge > 0.16) {
      P.lockT -= dt;
      if (P.lockT <= 0 && P.locks.length < 1 + Math.floor(P.charge * 7.99)) {
        const t = findLockTarget(g);
        if (t) {
          P.locks.push(t);
          P.lockT = 0.085;
          Sound.play('lock');
          Input.rumble(0.0, 0.25, 40);
        } else P.lockT = 0.05;
      }
    }
    Sound.chargeUpdate(P.charge, true);
  } else {
    if (P.charge > 0.2) fireCharged(g);
    P.charge = 0;
    P.locks.length = 0;
    Sound.chargeUpdate(0, false);
  }
  for (let i = P.locks.length - 1; i >= 0; i--) if (!P.locks[i].alive) P.locks.splice(i, 1);
}

function fireCharged(g) {
  const P = g.player;
  const lvl = P.charge;
  const muz = muzzlePoints(g);
  const m0 = muz[0];
  const n = P.locks.length;
  if (n > 0) {
    const dmg = 2.6 + lvl * 3.4;
    for (let i = 0; i < n; i++) {
      const t = P.locks[i];
      const copies = n === 1 && t.maxHp > 14 ? 1 + Math.round(lvl * 2) : 1;
      for (let k = 0; k < copies; k++) {
        const a = rnd(0, TAU);
        const sp = 90;
        const d = vnorm([Math.cos(a) * 0.7 + (m0[0] < P.x ? -0.2 : 0.2), Math.sin(a) * 0.7 + 0.2, -1]);
        const sx = P.x + (i - n / 2) * 0.3;
        g.pb.push({
          kind: 'homing', x: sx, y: P.y, z: P.z - 2, vx: d[0] * sp, vy: d[1] * sp, vz: d[2] * sp * (g.mode === 'rails' ? 1 : 1) + (g.mode === 'rails' ? 0 : 0),
          life: 3.2, dmg, r: 1.4, target: t, sty: STY.homing, speed: 190 + lvl * 40, delay: 0.06 + i * 0.045, age: 0, col: [0.5, 0.8, 1],
        });
        if (g.mode !== 'rails') {
          const b = g.pb[g.pb.length - 1];
          const f = P.fwd;
          const j = [rnd(-1, 1), rnd(-0.6, 1), rnd(-1, 1)];
          b.vx = f[0] * sp + j[0] * 40; b.vy = f[1] * sp + j[1] * 40; b.vz = f[2] * sp + j[2] * 40;
          b.x = P.x + f[0] * 2; b.y = P.y + f[1] * 2; b.z = P.z + f[2] * 2;
        }
      }
    }
    Sound.play('chargeShot');
    Input.rumble(0.5, 0.6, 140);
  } else if (lvl > 0.55) {
    const d = aimDirFrom(g, m0[0], m0[1], m0[2]);
    g.pb.push({ kind: 'plasma', x: m0[0], y: m0[1], z: m0[2], vx: d[0] * 200, vy: d[1] * 200, vz: d[2] * 200, life: 1.5, dmg: 6, r: 2.6, aoe: 7, sty: STY.plasma, col: [0.6, 1, 1] });
    Sound.play('chargeShot');
    Input.rumble(0.6, 0.4, 160);
  }
}

function fireBomb(g) {
  const P = g.player;
  if (!P.alive || g.state !== 'play') return;
  if (g.bombCount <= 0 && !g.attract) {
    Sound.play('deny');
    return;
  }
  if (P.bombCd > 0) return;
  if (!g.attract) g.bombCount--;
  P.bombCd = 0.8;
  const f = g.mode === 'rails' ? [0, 0, -1] : P.fwd;
  const sp = 130;
  const railV = g.mode === 'rails' ? g.stage.speed * g.diff.spd * g.speedMul * (g.stage.speedAt ? g.stage.speedAt(g.s) : 1) : 0;
  g.pb.push({ kind: 'bomb', x: P.x + f[0] * 3, y: P.y + f[1] * 3, z: P.z + f[2] * 3, vx: f[0] * sp, vy: f[1] * sp, vz: f[2] * sp - railV, life: 1.0, dmg: 0, r: 1.3, sty: STY.bomb, col: [1, 0.8, 0.3] });
  Sound.play('bombLaunch');
}

function detonateBomb(g, x, y, z) {
  const radius = 62;
  FX.flash = 1;
  FX.flashColor = [1, 0.95, 0.8];
  FX.addShake(1.0);
  FX.p({ x, y, z, life: 0.9, size: 12, size1: 70, c0: [1, 0.95, 0.7], c1: [1, 0.5, 0.2], a: 0.9, kind: 0 });
  FX.p({ x, y, z, life: 0.8, size: 6, size1: 62, c0: [1, 1, 1], a: 1, kind: 2 });
  FX.p({ x, y, z, life: 1.1, size: 4, size1: 84, c0: [1, 0.7, 0.3], a: 0.8, kind: 2 });
  for (let i = 0; i < 40; i++) {
    const a = rnd(0, TAU), b = rnd(-1, 1), sp = rnd(30, 80);
    const k = Math.sqrt(1 - b * b);
    FX.p({ x, y, z, vx: Math.cos(a) * k * sp, vy: b * sp, vz: Math.sin(a) * k * sp, life: rnd(0.4, 0.9), size: 0.35, size1: 0.1, c0: [1, 0.9, 0.5], c1: [1, 0.4, 0.1], kind: 3, stretch: 0.08, drag: 1, a: 1 });
  }
  FX.light(x, y, z, 1, 0.85, 0.5, 120, 3, 0.7);
  Sound.play('bomb');
  Input.rumble(1, 0.8, 380);
  for (const e of g.enemies) {
    if (!e.alive) continue;
    const d = Math.hypot(e.x - x, e.y - y, e.z - z);
    if (e.hs && e.def.boss) {
      for (let i = 0; i < e.hs.length; i++) {
        const hsp = e.hs[i];
        if (!hsp.dead && Math.hypot(hsp.x - x, hsp.y - y, hsp.z - z) < radius + hsp.r) damageEnemy(g, e, e.def.bombDmg || 9, i, 'bomb');
      }
    } else if (d < radius + e.r) {
      damageEnemy(g, e, e.def.boss ? e.def.bombDmg || 9 : 15, 0, 'bomb');
    }
  }
  for (let i = g.eb.length - 1; i >= 0; i--) {
    const b = g.eb[i];
    if (Math.hypot(b.x - x, b.y - y, b.z - z) < radius + 14) {
      FX.hitSpark(b.x, b.y, b.z);
      g.eb.splice(i, 1);
    }
  }
}

function hurtPlayer(g, dmg) {
  const P = g.player;
  if (!P.alive || g.state !== 'play') return false;
  if (g.attract || P.invuln > 0) return false;
  P.shield -= dmg * g.diff.dmg;
  P.invuln = 1.1;
  P.hurtT = 0.3;
  FX.hurt = 1;
  FX.addShake(0.55);
  Sound.play('hurt');
  Input.rumble(0.9, 0.6, 180);
  g.chain = 0;
  g.mult = 1;
  if (P.shield <= 0) killPlayer(g);
  return true;
}

function healPlayer(g, amt) {
  const P = g.player;
  P.shield = Math.min(P.maxShield, P.shield + amt);
}

/* ---------- world collisions for rails: solid props + ground ---------- */
function railCollisions(g, dt) {
  const P = g.player;
  if (!P.alive) return;
  const S = g.stage;
  // props flagged solid (boxes: hx,hy,hz half-extents; sphere: r)
  const lo = lowerBound(g.props, 's', g.s - 50);
  for (let i = lo; i < g.props.length; i++) {
    const p = g.props[i];
    if (p.s > g.s + 20) break;
    if (!p.solid) continue;
    if (p.hit) continue;
    let hit = false;
    if (p.hx !== undefined) {
      const py = p.cy !== undefined ? p.cy : p.y;
      hit = Math.abs(P.x - p.x) < p.hx + 1.2 && Math.abs(P.y - py) < p.hy + 0.9 && Math.abs(P.z - p.z) < p.hz + 1.2;
    } else {
      hit = Math.hypot(P.x - p.x, P.y - (p.cy !== undefined ? p.cy : p.y), P.z - p.z) < p.r + 1.3;
    }
    if (hit) {
      if (hurtPlayer(g, p.dmg || 18)) {
        P.vx = -P.vx * 0.5 + (P.x < p.x ? -14 : 14);
        P.vy = P.vy * 0.3 + (P.y < p.y ? -10 : 10);
        FX.explosion(P.x, P.y, P.z - 1, 0.8);
      }
    }
  }
}

/* ---------- drawing ---------- */
function drawPlayer(g, R) {
  const P = g.player;
  if (!P.alive) return;
  if (P.invuln > 0 && !g.attract && g.state === 'play' && Math.floor(g.time * 16) % 2 === 0) return;
  const flash = P.hurtT > 0 ? clamp(P.hurtT / 0.3, 0, 1) * 0.7 : 0;
  R.draw(M.ship_ember, P.x, P.y, P.z, P.q, 1, 1, 1, STY.ship, flash);
  const boostK = clamp(g.speedMul - 1, 0, 1) + (g.mode === 'rails' ? 0 : (P.boosting ? 0.8 : 0));
  const brakeK = P.braking ? 1 : 0;
  for (const s of [-1, 1]) {
    const o = qRotate(P.q, [s * 0.58, -0.04, 2.3]);
    const ex = P.x + o[0], ey = P.y + o[1], ez = P.z + o[2];
    const back = qRotate(P.q, [0, 0, 1]);
    const len = (1.4 + boostK * 3.6 - brakeK * 0.7) * (0.85 + 0.15 * Math.sin(g.time * 60 + s));
    glow(ex, ey, ez, 0.85 + boostK * 0.9, 0.35, 0.75, 1.0, 0.95);
    streak(ex + back[0] * len * 0.5, ey + back[1] * len * 0.5, ez + back[2] * len * 0.5, 0.26 + boostK * 0.2, back[0] * len, back[1] * len, back[2] * len, 0.4, 0.85, 1.0, 0.95);
  }
  if (P.charge > 0.08) {
    const m = muzzlePoints(g)[0];
    const k = P.charge;
    glow(m[0], m[1], m[2] - 0.6, 0.8 + k * 3.2, 0.45, 1, 1, 0.5 + k * 0.5);
    glow(m[0], m[1], m[2] - 0.6, 0.4 + k * 1.6, 1, 1, 1, 0.9);
  }
  if (P.shield < P.maxShield * 0.3 && Math.random() < 0.25) {
    FX.smokeTrail(P.x + rnd(-1.5, 1.5), P.y + rnd(0, 0.5), P.z + 1.5, 0.45);
  }
  if (P.rollT > 0) {
    // deflector bubble while rolling
    const a = Math.sin((1 - P.rollT / P.rollDur) * PI);
    GPU.particle(true, P.x, P.y, P.z, 5.5 * a + 1, 0.5, 0.85, 1, 0.5 * a, 2, 0, 0, 0);
  }
}


/* ---------------- 51c_entities.js ---------------- */
/* ============================================================================
   51c_entities.js — enemies (spawn / damage / kill), bullets, pickups, wingmen.
   Enemy type behaviour lives in 52_enemies.js (EDEF table).
   ========================================================================== */
const PLAYER_KILL_SRC = new Set(['laser', 'homing', 'plasma', 'bomb', 'reflect']);

function spawnEnemy(type, x, y, z, o) {
  const def = EDEF[type];
  if (!def) {
    console.warn('unknown enemy type', type);
    return null;
  }
  o = o || {};
  const base = o.hp !== undefined ? o.hp : def.hp;
  const e = Object.assign(
    {
      type, def, x, y, z, vx: 0, vy: 0, vz: 0, r: def.r, t: 0, flash: 0, alive: true,
      fireT: rnd(0.5, 1.5), bx: x, by: y, ph: rnd(0, TAU), q: null, fx: 0, fy: 0, fz: 1,
    },
    o
  );
  if (def.lockPos && !e.lockPos) e.lockPos = def.lockPos;
  e.hp = base * (def.noScale ? 1 : G.diff.enemyHp);
  e.maxHp = e.hp;
  if (def.init) def.init(e, G);
  G.enemies.push(e);
  return e;
}

function hitTest(e, x0, y0, z0, x1, y1, z1, r) {
  if (e.hs) {
    for (let i = 0; i < e.hs.length; i++) {
      const h = e.hs[i];
      if (h.dead) continue;
      if (segSphere(x0, y0, z0, x1, y1, z1, h.x, h.y, h.z, h.r + r)) return i;
    }
    return -1;
  }
  return segSphere(x0, y0, z0, x1, y1, z1, e.x, e.y, e.z, e.r + r) ? 0 : -1;
}

function damageEnemy(g, e, dmg, idx, src) {
  if (!e.alive) return;
  const d = e.def;
  if (d.hit) {
    d.hit(e, dmg, idx, src, g);
    return;
  }
  if (e.invuln) {
    FX.hitSpark(e.x, e.y, e.z, [0.6, 0.8, 1]);
    Sound.play('deflect');
    return;
  }
  e.hp -= dmg;
  e.flash = 0.1;
  if (PLAYER_KILL_SRC.has(src)) g.hitMark = 0.18;
  if (e.hp <= 0) killEnemy(g, e, src);
  else Sound.play('hit', clamp((e.x - g.cam.ex) / 80, -0.7, 0.7));
}

function killEnemy(g, e, src) {
  if (!e.alive) return;
  e.alive = false;
  const d = e.def;
  const pan = clamp((e.x - g.cam.ex) / 80, -0.8, 0.8);
  FX.explosion(e.x, e.y, e.z, d.boom || 1, d.palette);
  FX.chunks(e.x, e.y, e.z, d.chunks === undefined ? 4 : d.chunks, d.chunkCol || PAL.steel, 12 + (d.boom || 1) * 3);
  Sound.play((d.boom || 1) >= 2 ? 'explodeBig' : 'explode', pan);
  FX.addShake(0.08 * (d.boom || 1));
  if (PLAYER_KILL_SRC.has(src) && !e.noCredit) {
    addChain(1);
    addScore(d.score || 100);
    g.hits++;
    if (src === 'reflect') addScore(150);
  }
  if (d.onDeath) d.onDeath(e, g, src);
  if (!d.noDrop && !e.noDrop && PLAYER_KILL_SRC.has(src)) {
    const P = g.player;
    const want = P.shield < P.maxShield * 0.7 ? 0.08 : 0.025;
    if (Math.random() < want * g.diff.rings) spawnItem('silver', e.x, e.y, e.z, {});
    else if (Math.random() < 0.015) spawnItem('bomb', e.x, e.y, e.z, {});
  }
  if (e === g.boss) bossDown(g);
}

function ebShot(x, y, z, tx, ty, tz, speed, dmg, o) {
  const g = G;
  if (g.eb.length > 110) return null;
  o = o || {};
  let dx = tx - x, dy = ty - y, dz = tz - z;
  const l = Math.hypot(dx, dy, dz) || 1;
  dx /= l; dy /= l; dz /= l;
  const sp = speed * (o.noSpd ? 1 : g.diff.spd);
  const b = {
    x, y, z, vx: dx * sp, vy: dy * sp, vz: dz * sp, life: o.life || 6, dmg: dmg === undefined ? 10 : dmg, r: o.r || 0.95,
    shootable: o.shootable !== false, reflectable: o.reflectable !== false, sty: o.sty || STY.eshot, big: o.big || 1, owner: o.owner || null,
  };
  g.eb.push(b);
  return b;
}
/* Where must a bullet of the given speed (before difficulty scaling) be aimed to meet the player?
   Rails: the player flies straight down -Z at rail speed; arena: along its heading. Exact quadratic intercept. */
function leadPoint(sx, sy, sz, speed, lateralLead) {
  const g = G, P = g.player;
  const sp = speed * g.diff.spd;
  let vx = 0, vy = 0, vz = 0;
  if (g.mode === 'rails') {
    const frozen = g.stage.freezeRail && g.stage.freezeRail(g);
    vz = frozen ? 0 : -g.stage.speed * g.diff.spd * g.speedMul * (g.stage.speedAt ? g.stage.speedAt(g.s) : 1);
    if (lateralLead) { vx = P.vx * 0.5; vy = P.vy * 0.5; }
  } else {
    vx = P.fwd[0] * P.speed; vy = P.fwd[1] * P.speed; vz = P.fwd[2] * P.speed;
  }
  const rx = P.x - sx, ry = P.y - sy, rz = P.z - sz;
  const a = vx * vx + vy * vy + vz * vz - sp * sp;
  const b = 2 * (rx * vx + ry * vy + rz * vz);
  const c = rx * rx + ry * ry + rz * rz;
  let t = Math.sqrt(c) / sp;
  if (Math.abs(a) < 1e-6) {
    if (Math.abs(b) > 1e-6) t = Math.max(0.01, -c / b);
  } else {
    const disc = b * b - 4 * a * c;
    if (disc >= 0) {
      const sq = Math.sqrt(disc);
      const t1 = (-b - sq) / (2 * a), t2 = (-b + sq) / (2 * a);
      const cand = [t1, t2].filter((q) => q > 0.01);
      if (cand.length) t = Math.min(...cand);
    }
  }
  t = clamp(t, 0.01, 8);
  let tx = P.x + vx * t, ty = P.y + vy * t, tz = P.z + vz * t;
  if (g.mode === 'rails' && g.stage.curve) tx += railCenter(-tz) - railCenter(g.s);
  return [tx, ty, tz];
}
/* aimed shot at the player's predicted position */
function aimedShot(e, speed, dmg, spread, o) {
  const A = leadPoint(e.x, e.y, e.z, speed, true);
  const s = spread || 0;
  return ebShot(e.x, e.y, e.z, A[0] + rnd(-s, s), A[1] + rnd(-s, s), A[2] + rnd(-s, s), speed, dmg, o);
}

function spawnItem(type, x, y, z, o) {
  const it = Object.assign({ type, x, y, z, t: 0, r: type === 'silver' || type === 'gold' ? 3.6 : 2.4, alive: true, ph: rnd(0, TAU) }, o || {});
  G.items.push(it);
  return it;
}

/* ---------------- bullets ---------------- */
function nearestEnemyAhead(g, x, y, z, fwd, maxD) {
  let best = null, bd = 1e9;
  for (const e of g.enemies) {
    if (!e.alive || e.def.lockable === false) continue;
    const dx = e.x - x, dy = e.y - y, dz = e.z - z;
    const d = Math.hypot(dx, dy, dz);
    if (d > maxD || d < 3) continue;
    if (fwd && (dx * fwd[0] + dy * fwd[1] + dz * fwd[2]) / d < 0.3) continue;
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function updateBullets(g, dt) {
  const P = g.player;
  const arena = g.mode !== 'rails';
  if (P.bombCd > 0) P.bombCd -= dt;
  // ---- player bullets ----
  for (let i = g.pb.length - 1; i >= 0; i--) {
    const b = g.pb[i];
    b.life -= dt;
    b.age = (b.age || 0) + dt;
    const px = b.x, py = b.y, pz = b.z;
    if (b.kind === 'homing') {
      if (!b.target || !b.target.alive) {
        b.target = nearestEnemyAhead(g, b.x, b.y, b.z, null, 260);
      }
      if (b.age > (b.delay || 0) && b.target) {
        const t = b.target;
        const lp = t.lockPos ? t.lockPos(t) : [t.x, t.y, t.z];
        const dx = lp[0] - b.x, dy = lp[1] - b.y, dz = lp[2] - b.z;
        const l = Math.hypot(dx, dy, dz) || 1;
        const sp = b.speed || 180;
        const cur = Math.hypot(b.vx, b.vy, b.vz) || 1;
        const k = Math.min(1, dt * 7);
        const nx = b.vx / cur + (dx / l - b.vx / cur) * k;
        const ny = b.vy / cur + (dy / l - b.vy / cur) * k;
        const nz = b.vz / cur + (dz / l - b.vz / cur) * k;
        const nl = Math.hypot(nx, ny, nz) || 1;
        const ns = Math.min(sp, cur + sp * dt * 3);
        b.vx = (nx / nl) * ns; b.vy = (ny / nl) * ns; b.vz = (nz / nl) * ns;
      }
      if (Math.random() < 0.7) FX.p({ x: b.x, y: b.y, z: b.z, life: 0.3, size: 0.5, size1: 0.1, c0: [0.5, 0.85, 1], c1: [0.3, 0.4, 1], kind: 0, a: 0.8 });
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    let gone = b.life <= 0;
    if (b.kind === 'bomb') {
      let blow = gone;
      if (!blow) {
        for (const e of g.enemies) {
          if (e.alive && !e.def.noBombTrigger && Math.hypot(e.x - b.x, e.y - b.y, e.z - b.z) < e.r + 6) { blow = true; break; }
        }
      }
      if (blow) {
        detonateBomb(g, b.x, b.y, b.z);
        g.pb.splice(i, 1);
      }
      continue;
    }
    if (!gone) {
      for (const e of g.enemies) {
        if (!e.alive || e.def.bulletsPass) continue;
        const idx = hitTest(e, px, py, pz, b.x, b.y, b.z, b.r);
        if (idx < 0) continue;
        if (b.kind === 'plasma') {
          explodePlasma(g, b, e, idx);
        } else {
          FX.hitSpark(b.x, b.y, b.z, b.col);
          damageEnemy(g, e, b.dmg, idx, b.kind === 'reflect' ? 'reflect' : b.kind);
        }
        gone = true;
        break;
      }
    }
    if (!gone && b.kind === 'laser') {
      for (let j = g.eb.length - 1; j >= 0; j--) {
        const eb = g.eb[j];
        if (!eb.shootable) continue;
        if (segSphere(px, py, pz, b.x, b.y, b.z, eb.x, eb.y, eb.z, eb.r + b.r + 0.3)) {
          FX.hitSpark(eb.x, eb.y, eb.z, [1, 0.5, 0.5]);
          g.eb.splice(j, 1);
          gone = true;
          addScore(10);
          break;
        }
      }
    }
    if (gone) g.pb.splice(i, 1);
  }

  // ---- enemy bullets ----
  for (let i = g.eb.length - 1; i >= 0; i--) {
    const b = g.eb[i];
    b.life -= dt;
    const bx0 = b.x, by0 = b.y, bz0 = b.z;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    let remove = b.life <= 0;
    if (!remove && !arena && b.z > P.z + 40) remove = true;
    if (!remove && P.alive && g.state === 'play') {
      const d = Math.hypot(b.x - P.x, b.y - P.y, b.z - P.z);
      if (P.rollT > 0.02 && d < 7.5 && b.reflectable) {
        // barrel-roll deflect: bullet becomes ours
        const tgt = nearestEnemyAhead(g, b.x, b.y, b.z, arena ? P.fwd : [0, 0, -1], 300);
        let dx = 0, dy = 0, dz = arena ? 0 : -1;
        if (tgt) {
          dx = tgt.x - b.x; dy = tgt.y - b.y; dz = tgt.z - b.z;
          const l = Math.hypot(dx, dy, dz) || 1;
          dx /= l; dy /= l; dz /= l;
        } else if (arena) {
          dx = P.fwd[0]; dy = P.fwd[1]; dz = P.fwd[2];
        }
        g.pb.push({ kind: 'reflect', x: b.x, y: b.y, z: b.z, vx: dx * 200, vy: dy * 200, vz: dz * 200, life: 1.5, dmg: 4, r: 1.2, sty: STY.reflect, col: [0.8, 1, 1], target: tgt });
        FX.hitSpark(b.x, b.y, b.z, [0.7, 1, 1]);
        Sound.play('deflect', clamp((b.x - g.cam.ex) / 60, -0.7, 0.7));
        addScore(25);
        remove = true;
      } else if (b.dmg > 0 && (d < P.r + b.r || segSphere(bx0, by0, bz0, b.x, b.y, b.z, P.x, P.y, P.z, P.r + b.r))) {
        hurtPlayer(g, b.dmg);
        FX.hitSpark(b.x, b.y, b.z, [1, 0.4, 0.4]);
        remove = true;
      }
    }
    if (!remove && g.mode === 'allrange' && g.stage.solidAt && g.stage.solidAt(b.x, b.y, b.z, b.r)) {
      FX.hitSpark(b.x, b.y, b.z, [1, 0.6, 0.3]);
      remove = true;
    }
    if (remove) g.eb.splice(i, 1);
  }
}

function explodePlasma(g, b, hitE, hitIdx) {
  FX.explosion(b.x, b.y, b.z, 1.6, [[0.7, 1, 1], [0.2, 0.6, 1], [0.1, 0.15, 0.3]]);
  FX.shockwave(b.x, b.y, b.z, 14, [0.5, 0.9, 1]);
  Sound.play('explode');
  for (const e of g.enemies) {
    if (!e.alive) continue;
    if (e.hs && e.def.boss) {
      for (let i = 0; i < e.hs.length; i++) {
        const h = e.hs[i];
        if (!h.dead && (e === hitE && i === hitIdx || Math.hypot(h.x - b.x, h.y - b.y, h.z - b.z) < (b.aoe || 6) + h.r)) damageEnemy(g, e, e === hitE && i === hitIdx ? b.dmg : b.dmg * 0.7, i, 'plasma');
      }
    } else if (Math.hypot(e.x - b.x, e.y - b.y, e.z - b.z) < (b.aoe || 6) + e.r) damageEnemy(g, e, e === hitE ? b.dmg : b.dmg * 0.7, 0, 'plasma');
  }
}

/* ---------------- enemies ---------------- */
function updateEnemies(g, dt) {
  const P = g.player;
  for (let i = g.enemies.length - 1; i >= 0; i--) {
    const e = g.enemies[i];
    if (!e.alive) {
      g.enemies.splice(i, 1);
      continue;
    }
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;
    try {
      e.def.update(e, dt, g);
    } catch (err) {
      console.error('enemy update error', e.type, err);
      e.alive = false;
      continue;
    }
    if (!e.alive) continue;
    if (g.mode === 'rails' && !e.def.persist && !e.persist && e.z > P.z + 50) {
      e.alive = false;
      if (e.onEscape) e.onEscape(e, g);
      continue;
    }
    if (P.alive && g.state === 'play' && e.def.contact !== false && !e.noContact) {
      let hit = false;
      if (e.hs) {
        for (const h of e.hs) {
          if (!h.dead && !h.noContact && Math.hypot(h.x - P.x, h.y - P.y, h.z - P.z) < h.r + P.r) { hit = true; break; }
        }
      } else hit = Math.hypot(e.x - P.x, e.y - P.y, e.z - P.z) < e.r + P.r;
      if (hit) {
        if (hurtPlayer(g, e.def.contactDmg === undefined ? 16 : e.def.contactDmg)) {
          if (!e.def.big && !e.hs) killEnemy(g, e, 'ram');
          else {
            P.vx += (P.x < e.x ? -22 : 22);
            P.vy += (P.y < e.y ? -12 : 12);
            FX.explosion(P.x, P.y, P.z, 0.9);
          }
        }
      }
    }
  }
}

function enemyQuat(e) {
  if (e.q) return e.q;
  let f = [e.fx, e.fy, e.fz];
  if (Math.abs(f[0]) + Math.abs(f[1]) + Math.abs(f[2]) < 1e-4) f = [0, 0, 1];
  return qLook(f, [0, 1, 0]);
}

function drawEnemies(g, R) {
  for (const e of g.enemies) {
    if (!e.alive) continue;
    const d = e.def;
    if (d.draw) guard(() => d.draw(e, R, g));
    else {
      const pop = e.t < 0.45 ? 1 - Math.pow(1 - e.t / 0.45, 3) : 1; // ease-in so enemies don't pop into view
      const s = (d.scale || 1) * (0.25 + 0.75 * pop);
      R.draw(M[d.mesh], e.x, e.y, e.z, enemyQuat(e), s, s, s, d.sty || STY.ship, e.flash > 0 ? 1 : 0);
    }
    if (d.glowCol) glow(e.x, e.y, e.z, d.glowSize || 2, d.glowCol[0], d.glowCol[1], d.glowCol[2], 0.35);
  }
}

function drawBullets(g, R) {
  for (const b of g.pb) {
    if (b.kind === 'plasma') {
      const s = b.r * (0.9 + 0.15 * Math.sin(g.time * 40));
      R.draw(M.sphere, b.x, b.y, b.z, null, s, s, s, STY.plasma, 0);
      glow(b.x, b.y, b.z, b.r * 3.2, 0.4, 0.9, 1, 0.8);
      continue;
    }
    if (b.kind === 'bomb') {
      const s = 1.2;
      R.draw(M.sphere, b.x, b.y, b.z, null, s, s, s, STY.bomb, 0);
      glow(b.x, b.y, b.z, 5, 1, 0.7, 0.2, 0.9);
      continue;
    }
    const sp = Math.hypot(b.vx, b.vy, b.vz) || 1;
    const f = [b.vx / sp, b.vy / sp, b.vz / sp];
    const q = qLook(f, [0, 1, 0]);
    const sc = b.kind === 'homing' ? 1.2 : b.kind === 'reflect' ? 0.9 : 1;
    R.draw(b.kind === 'homing' ? M.pbolt : M.bolt, b.x, b.y, b.z, q, sc, sc, sc, b.sty, 0);
    glow(b.x, b.y, b.z, b.kind === 'homing' ? 2.2 : 1.5, b.col[0], b.col[1], b.col[2], 0.55);
  }
  for (const b of g.eb) {
    const s = b.r * 0.95 * b.big;
    R.draw(M.sphereLo, b.x, b.y, b.z, null, s, s, s, b.sty, 0);
    glow(b.x, b.y, b.z, b.r * 3.4 * b.big, 1, 0.4, 0.5, 0.5);
  }
}

/* ---------------- pickups ---------------- */
function updateItems(g, dt) {
  const P = g.player;
  for (let i = g.items.length - 1; i >= 0; i--) {
    const it = g.items[i];
    it.t += dt;
    if (it.vx) { it.x += it.vx * dt; it.y += (it.vy || 0) * dt; it.z += (it.vz || 0) * dt; }
    if (g.mode === 'rails' && it.z > P.z + 30) {
      g.items.splice(i, 1);
      continue;
    }
    if (it.ttl !== undefined) {
      it.ttl -= dt;
      if (it.ttl <= 0) {
        g.items.splice(i, 1);
        continue;
      }
    }
    if (P.alive && g.state === 'play') {
      const d = Math.hypot(it.x - P.x, it.y - P.y, it.z - P.z);
      if (d < it.r + 1.4) {
        collectItem(g, it);
        g.items.splice(i, 1);
      }
    }
  }
}

function collectItem(g, it) {
  const P = g.player;
  FX.confetti(it.x, it.y, it.z);
  switch (it.type) {
    case 'silver':
      healPlayer(g, 22);
      addScore(50);
      Sound.play('ring');
      flashMessage('SHIELD +', 0.9);
      break;
    case 'gold':
      healPlayer(g, 40);
      addScore(120);
      g.gold++;
      Sound.play('goldRing');
      if (g.gold % 3 === 0) {
        g.lives++;
        Sound.play('extraLife');
        flashMessage('EXTRA LIFE!', 2);
      } else flashMessage('GOLD RING ' + (g.gold % 3) + ' / 3', 1.2);
      break;
    case 'bomb':
      g.bombCount = Math.min(9, g.bombCount + 1);
      Sound.play('pickup');
      flashMessage('BOMB +1', 1.2);
      break;
    case 'laser':
      if (g.laser < 3) {
        g.laser++;
        flashMessage(g.laser === 2 ? 'TWIN LASERS!' : 'HYPER LASERS!', 2);
      } else {
        addScore(500);
        flashMessage('LASER MAXED  +500', 1.5);
      }
      Sound.play('pickup');
      break;
    default:
      break;
  }
  Input.rumble(0.0, 0.5, 90);
  void P;
}

function drawItems(g, R) {
  for (const it of g.items) {
    const bob = Math.sin(it.t * 3 + it.ph) * 0.4;
    switch (it.type) {
      case 'silver':
        R.draw(M.ringSilver, it.x, it.y + bob, it.z, qFromYPR(0, 0, it.t * 1.6), 1, 1, 1, STY.ringS, 0);
        glow(it.x, it.y + bob, it.z, 6, 0.6, 0.85, 1, 0.18);
        break;
      case 'gold':
        R.draw(M.ringGold, it.x, it.y + bob, it.z, qFromYPR(0, 0, it.t * 1.6), 1, 1, 1, STY.ringG, 0);
        glow(it.x, it.y + bob, it.z, 7, 1, 0.8, 0.2, 0.25);
        break;
      case 'bomb':
        R.draw(M.crate, it.x, it.y + bob, it.z, qFromYPR(it.t * 1.4, 0.3, 0), 1.3, 1.3, 1.3, STY.item, 0);
        glow(it.x, it.y + bob, it.z, 4.5, 1, 0.6, 0.2, 0.3);
        break;
      case 'laser':

/* ---------------- wingmen ---------------- */
function damageWing(g, w, dmg) {
  if (!w.alive || w.leaving) return;
  w.hp -= dmg;
  w.flashT = 0.12;
  if (w.hp <= 0) {
    w.leaving = true;
    w.hp = 0;
    w.retreat = 0;
    g.lost++;
    if (w.chasedBy) w.chasedBy.chaseTarget = null;
    w.chasedBy = null;
    const lines = { waltz: 'I am hit! Falling back, Ember!', tango: 'Tch — I am out! Do not die on me!', jive: 'Mayday! Systems failing — retreating!' };
    say(w.id, lines[w.id], 3);
    FX.explosion(w.x, w.y, w.z, 0.9);
    Sound.play('explode');
  }
}

function wingSaved(g, w) {
  g.saved++;
  w.chasedBy = null;
  w.hp = Math.min(100, w.hp + 25);
  addScore(300);
  flashMessage('ALLY SAVED  +300', 1.8);
  const lines = { waltz: 'Well shot, Ember. Old bones thank you!', tango: 'Hmph. I had it. ...Thanks.', jive: 'Whew! Thanks, Ember! You are the best!' };
  say(w.id, lines[w.id], 2.4);
}

function updateWingmen(g, dt) {
  const P = g.player;
  for (const w of g.wing) {
    if (w.flashT > 0) w.flashT -= dt;
    if (w.leaving) {
      w.retreat += dt;
      w.y += dt * 8;
      w.x += dt * (w.x < P.x ? -9 : 9);
      w.z += (g.mode === 'rails' ? 40 : 0) * dt;
      if (Math.random() < 0.6) FX.smokeTrail(w.x, w.y, w.z + 1, 0.9);
      if (w.retreat > 3.5) w.alive = false;
      continue;
    }
    if (!w.alive) continue;
    if (g.mode === 'rails') updateWingRails(g, w, dt);
    else updateWingArena(g, w, dt);
  }
  // remove fully gone wingmen from active list but keep run flags
  for (let i = g.wing.length - 1; i >= 0; i--) if (!g.wing[i].alive) g.wing.splice(i, 1);
}

function updateWingRails(g, w, dt) {
  const P = g.player;
  const info = w.info;
  const chased = !!(w.chasedBy && w.chasedBy.alive);
  let tx, ty, tz;
  if (chased) {
    tx = P.x + Math.sin(g.time * 1.2 + w.phase) * 26;
    ty = P.y + 6 + Math.sin(g.time * 1.7 + w.phase) * 6;
    tz = P.z - 74;
  } else {
    tx = P.x + info.slot[0] + Math.sin(g.time * 0.7 + w.phase) * 2.4;
    ty = P.y + info.slot[1] + Math.cos(g.time * 0.9 + w.phase) * 1.3;
    tz = P.z - info.slot[2];
    if (g.state === 'clear') { ty += 8; tz -= 20; }
  }
  const b = g.stage.boundsAt ? g.stage.boundsAt(g.s) : g.stage.bounds;
  const cx = railCenter(g.s);
  tx = clamp(tx, cx + b.x0, cx + b.x1);
  ty = clamp(ty, b.y0 + 1, b.y1 + 4);
  // ride along with the rail so the damping lag does not push wingmen behind the camera
  if (w.pz !== undefined) w.z += P.z - w.pz;
  w.pz = P.z;
  const cxn = railCenter(g.s);
  if (w.pcx !== undefined) w.x += cxn - w.pcx;
  w.pcx = cxn;
  const ox = w.x;
  w.x = damp(w.x, tx, chased ? 2.5 : 3.2, dt);
  w.y = damp(w.y, ty, chased ? 2.5 : 3.2, dt);
  w.z = damp(w.z, tz, 3.2, dt);
  w.vx = (w.x - ox) / Math.max(dt, 1e-4);
  w.bank = damp(w.bank, clamp(-w.vx * 0.04, -0.9, 0.9), 6, dt);
  w.q = qFromYPR(0, 0, w.bank);
  if (chased) {
    w.helpT -= dt;
    if (w.helpT <= 0) {
      const lines = { waltz: 'Ember! One on my tail — shake him!', tango: 'Get this clown off me, Ember!', jive: 'Help! Somebody get him off me!' };
      say(w.id, lines[w.id], 2.2);
      w.helpT = 4.2;
    }
  }
  // wingmen take pot-shots at enemies ahead
  w.fireCd -= dt;
  if (w.fireCd <= 0 && !chased && g.state === 'play') {
    let best = null, bd = 1e9;
    for (const e of g.enemies) {
      if (!e.alive || e.def.lockable === false || e.def.boss) continue;
      const dz = w.z - e.z;
      if (dz < 8 || dz > 170) continue;
      const lat = Math.hypot(e.x - w.x, e.y - w.y);
      if (lat < 26 && lat + dz * 0.1 < bd) { bd = lat + dz * 0.1; best = e; }
    }
    if (best) {
      const d = vnorm([best.x - w.x, best.y - w.y, best.z - w.z]);
      g.pb.push({ kind: 'wing', x: w.x, y: w.y, z: w.z - 2, vx: d[0] * 280, vy: d[1] * 280, vz: d[2] * 280, life: 0.9, dmg: 0.7, r: 0.7, sty: STY.bolt1, col: [0.5, 1, 0.5] });
      Sound.play('laser', clamp((w.x - g.cam.ex) / 60, -0.6, 0.6), 0.35);
      w.fireCd = rnd(0.3, 0.6);
    } else w.fireCd = 0.3;
  }
}

function drawWingmen(g, R) {
  for (const w of g.wing) {
    if (!w.alive) continue;
    const q = w.q || [0, 0, 0, 1];
    R.draw(M[w.info.mesh], w.x, w.y, w.z, q, 1, 1, 1, STY.ship, w.flashT > 0 ? 0.8 : 0);
    for (const s of [-1, 1]) {
      const o = qRotate(q, [s * 0.58, -0.04, 2.3]);
      glow(w.x + o[0], w.y + o[1], w.z + o[2], 0.8, 0.4, 0.8, 1, 0.8);
    }
    if (w.hp < 40 && !w.leaving && Math.random() < 0.3) FX.smokeTrail(w.x, w.y, w.z + 1.5, 0.5);
  }
}

/* ============================================================================
   52_enemies.js — enemy type table (EDEF) and shared flight helpers.
   ========================================================================== */
const panOf = (g, e) => clamp((e.x - g.cam.ex) / 80, -0.7, 0.7);
const aheadOf = (g, e) => g.player.z - e.z; // rails: distance in front of the player (>0 = ahead)

/* orient along actual motion with smoothing + bank */
function orientByMotion(e, dt, bankK) {
  const nx = e.x, ny = e.y, nz = e.z;
  if (e.px === undefined) { e.px = nx; e.py = ny; e.pz = nz; }
  const d = Math.max(dt, 1e-4);
  const vx = (nx - e.px) / d, vy = (ny - e.py) / d, vz = (nz - e.pz) / d;
  e.px = nx; e.py = ny; e.pz = nz;
  const sp = Math.hypot(vx, vy, vz);
  if (sp > 0.5) {
    const k = 1 - Math.exp(-dt * 7);
    e.hx = (e.hx === undefined ? vx / sp : e.hx + (vx / sp - e.hx) * k);
    e.hy = (e.hy === undefined ? vy / sp : e.hy + (vy / sp - e.hy) * k);
    e.hz = (e.hz === undefined ? vz / sp : e.hz + (vz / sp - e.hz) * k);
  }
  const f = vnorm([e.hx === undefined ? 0 : e.hx, e.hy === undefined ? 0 : e.hy, e.hz === undefined ? 1 : e.hz]);
  e.bankS = damp(e.bankS || 0, clamp(-vx * (bankK || 0.04), -1.1, 1.1), 6, dt);
  e.q = qMul(qLook(f, [0, 1, 0]), qAxisAngle(0, 0, 1, e.bankS));
}

/* steer a free-flying body (e.fwd, e.spd) toward a point with limited turn rate; returns angle error */
function steerTo(e, tx, ty, tz, dt, turn) {
  let dx = tx - e.x, dy = ty - e.y, dz = tz - e.z;
  const l = Math.hypot(dx, dy, dz) || 1;
  dx /= l; dy /= l; dz /= l;
  const f = e.fwd;
  const dot = clamp(f[0] * dx + f[1] * dy + f[2] * dz, -1, 1);
  const ang = Math.acos(dot);
  const maxA = turn * dt;
  let nf;
  if (ang <= maxA || ang < 1e-4) nf = [dx, dy, dz];
  else {
    // rotate f toward the target by exactly maxA (so `turn` really is rad/s)
    let px = dx - f[0] * dot, py = dy - f[1] * dot, pz = dz - f[2] * dot;
    let pl = Math.hypot(px, py, pz);
    if (pl < 1e-4) { px = -f[2]; py = 0; pz = f[0]; pl = Math.hypot(px, pz) || 1; }
    const cs0 = Math.cos(maxA), sn0 = Math.sin(maxA);
    nf = vnorm([f[0] * cs0 + (px / pl) * sn0, f[1] * cs0 + (py / pl) * sn0, f[2] * cs0 + (pz / pl) * sn0]);
  }
  const cy = f[2] * nf[0] - f[0] * nf[2]; // signed yaw change
  e.bankT = clamp(cy / Math.max(dt, 1e-4) * 0.55, -1.2, 1.2);
  e.fwd = nf;
  return ang;
}

function arenaOrient(e, dt) {
  e.bankS = damp(e.bankS || 0, e.bankT || 0, 5, dt);
  e.q = qMul(qLook(e.fwd, [0, 1, 0]), qAxisAngle(0, 0, 1, e.bankS + (e.rollSpin || 0)));
}

/* avoid ground + buildings: returns a corrected target */
function avoidWorld(e, g, dt) {
  const f = e.fwd;
  const S = g.stage;
  let upPush = 0;
  const gy = S.groundY || 0;
  if (e.y < gy + 16 && f[1] < 0.15) upPush = 1;
  if (e.y > (S.ceiling || 170) - 12 && f[1] > -0.1) upPush = -1;
  if (S.solidAt) {
    const la = 38;
    if (S.solidAt(e.x + f[0] * la, e.y + f[1] * la, e.z + f[2] * la, 6)) upPush = 1.3;
  }
  if (upPush !== 0) {
    e.fwd = vnorm([f[0], f[1] + upPush * dt * 3.5, f[2]]);
  }
  // arena bounds: steer back toward the middle
  const B = S.arena || 380;
  if (Math.abs(e.x) > B || Math.abs(e.z - (S.arenaCz || 0)) > B) {
    const tx = -e.x, tz = (S.arenaCz || 0) - e.z;
    const l = Math.hypot(tx, tz) || 1;
    const k = Math.min(1, dt * 1.6);
    const f2 = e.fwd;
    e.fwd = vnorm([f2[0] + (tx / l - f2[0]) * k, f2[1], f2[2] + (tz / l - f2[2]) * k]);
  }
}

/* ---------------------------------------------------------------------------
   ALL-RANGE enemies
   --------------------------------------------------------------------------- */
function pickArenaTarget(e, g) {
  const cands = [g.player];
  for (const w of g.wing) if (w.alive && !w.leaving) cands.push(w, w);
  // weights: player preferred, wingmen otherwise; closer is better
  let best = null, bs = -1e9;
  for (const c of cands) {
    const d = Math.hypot(c.x - e.x, c.y - e.y, c.z - e.z);
    const sc = -d + (c === g.player ? 70 : 0) + rnd(0, 120);
    if (sc > bs) { bs = sc; best = c; }
  }
  return best;
}
