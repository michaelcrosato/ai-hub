// dynamic bodies for debris, fixed colliders for obstacles/ground.
const GRP = { PLAYER: 1, ENEMY: 2, OBST: 4, PICKUP: 8, DEBRIS: 16, GROUND: 32, WING: 64, Q: 0x8000 };
const grp = (m, f) => ((m & 0xffff) << 16) | (f & 0xffff);
const Phys = {
  world: null, byHandle: new Map(), debrisList: [], ground: null, gravScale: 1, ready: false,
  async init() { await RAPIER.init(); this.ready = true; },
  newWorld(gravY = -22, groundOn = true) {
    if (this.world) { try { this.world.free(); } catch (e) { /* ignore */ } }
    this.world = new RAPIER.World({ x: 0, y: gravY, z: 0 }); this.byHandle.clear(); this.debrisList.length = 0; this.ground = null; this.gravScale = gravY === 0 ? 0.04 : 1;
    if (groundOn) {

      this.ground = b; this.world.createCollider(RAPIER.ColliderDesc.cuboid(500, 1, 500).setCollisionGroups(grp(GRP.GROUND, GRP.DEBRIS | GRP.Q)).setFriction(0.8).setRestitution(0.3), b);

  moveGround(x, z) { if (this.ground) this.ground.setTranslation({ x, y: -1, z }, true); },
  // attach a collider to an entity; kind 'kin' (moves) or 'fixed'

    const body = w.createRigidBody(bd);
    const cd = o.half ? RAPIER.ColliderDesc.cuboid(o.half[0], o.half[1], o.half[2]) : RAPIER.ColliderDesc.ball(o.r);
    cd.setCollisionGroups(grp(o.group, GRP.Q)); if (o.offset) cd.setTranslation(o.offset[0], o.offset[1], o.offset[2]);

  },
  detach(ent) { if (!ent.body || !this.world) return; this.byHandle.delete(ent.col.handle); try { this.world.removeRigidBody(ent.body); } catch (e) { /* ignore */ } ent.body = null; ent.col = null; },
  sync(ent) { if (ent.body) ent.body.setNextKinematicTranslation({ x: ent.pos.x, y: ent.pos.y, z: ent.pos.z }); },
  step(dt) {
    this.world.timestep = clamp(dt, 1 / 240, 1 / 30); this.world.step();
    for (let i = this.debrisList.length - 1; i >= 0; i--) {
      const d = this.debrisList[i]; d.life -= dt; const t = d.body.translation(), q = d.body.rotation();
      d.mesh.position.set(t.x, t.y, t.z); d.mesh.quaternion.set(q.x, q.y, q.z, q.w);

  ray(from, to, mask) {

    const hit = this.world.castRay(new RAPIER.Ray({ x: from.x, y: from.y, z: from.z }, { x: dir.x, y: dir.y, z: dir.z }), len, true, undefined, grp(GRP.Q, mask));

    st.brief.forEach(([who, text]) => { const row = h('div', 'brief'); row.style.marginBottom = '1.6vh'; row.appendChild(UI.portrait(who, 100)); const t = h('div', '', `<h3>${WHO[who].name}</h3><p>${text}</p>`); row.appendChild(t); panel.appendChild(row); });
    const scr = { el }; scr.onEvent = (ev) => { if (ev.a === 'ok' || ev.a === 'start') { A.play('ui_ok'); UI.show('controls', { launch: true }, true); } else if (ev.a === 'back') { A.play('ui_back'); UI.back(); } };
    scr.hints = [['ok', 'Continue'], ['back', 'Back']]; return scr;
  },
  controls(params) {
    const el = h('div', 'screen dim'); el.appendChild(h('h2', 'title', 'Flight Controls')); const panel = h('div', 'panel');
    const rows = [['move', 'Steer your ship'], ['aim', 'Move the reticle (fine aim)'], ['fire', 'Lasers (hold for auto-fire)'], ['charge', 'Hold to charge and lock on, release to fire'], ['bomb', 'Nova bomb'], ['rollL', 'Barrel roll left (reflects shots)'], ['rollR', 'Barrel roll right'], ['boost', 'Boost (hold). With stick down: U-turn. Up: loop'], ['brake', 'Brake'], ['advice', 'Ask for advice'], ['pause', 'Pause']];
    const render = () => { panel.innerHTML = rows.map(([a, t]) => `<div class="stat"><span>${Input.label(a)}</span><b style="color:#fff4d6;font-size:.8em">${t}</b></div>`).join(''); }; render(); el.appendChild(panel);
    const scr = { el, refresh: render }; scr.onEvent = (ev) => { if (ev.a === 'ok' || ev.a === 'start') { if (params.launch) { A.play('ui_ok'); Flow.launch(); } else { A.play('ui_back'); UI.back(); } } else if (ev.a === 'back') { A.play('ui_back'); UI.back(); } };
    scr.hints = [['ok', params.launch ? 'Launch!' : 'Back'], ['back', 'Back']]; return scr;
  },
  settings(params) {
    const scr = UI.list({ title: 'Settings', tabs: ['Audio', 'Controls', 'Gameplay', 'Access'], items: () => settingsItems(UI.tabIdx), onBack: () => closeSettings(), hints: [['nav', 'Move'], ['ok', 'Change'], ['tabL', 'Tab'], ['back', 'Back']],
      onTab: () => scr.refresh(), after: (el, sc) => { const t = h('div', 'pad-test hidden'); t.innerHTML = '<canvas width="220" height="220"></canvas><div><b>Controller test</b><br>Move your sticks: the dots show where the game thinks they point.<br>If up/left feel flipped, switch the invert toggles above.<div id="padtxt"></div></div>'; el.appendChild(t); sc.testEl = t; } });
    const baseRender = scr.render; scr.render = () => { baseRender(); if (scr.testEl) scr.testEl.classList.toggle('hidden', UI.tabIdx !== 1); }; scr.refresh = scr.render; scr.render();
    scr.update = () => { if (UI.tabIdx !== 1 || !scr.testEl) return; const cv = scr.testEl.querySelector('canvas'), x = cv.getContext('2d'); x.clearRect(0, 0, 220, 220); const id = Input.lastPadId, ax = Input.rawAxes[id] || { lx: 0, ly: 0, rx: 0, ry: 0 };
      [[55, ax.lx, ax.ly, '#38e8ff'], [165, ax.rx, ax.ry, '#ff9ae0']].forEach(([cx, px, py, col]) => { x.strokeStyle = '#5d4aa8'; x.lineWidth = 3; x.beginPath(); x.arc(cx, 110, 48, 0, TAU); x.stroke(); x.fillStyle = col; x.beginPath(); x.arc(cx + px * 44, 110 + py * 44, 9, 0, TAU); x.fill(); });
      const d = (v, neg, pos) => (Math.abs(v) < 0.25 ? '·' : v < 0 ? neg : pos); const tx = $('#padtxt'); if (tx) tx.innerHTML = id ? `Left: ${d(ax.ly, '↑', '↓')}${d(ax.lx, '←', '→')} &nbsp; Right: ${d(ax.ry, '↑', '↓')}${d(ax.rx, '←', '→')}` : 'No controller detected.'; };
    return scr;
  },
  pause() {
    return UI.list({ bg: 'dim', title: 'Paused', hints: [['nav', 'Move'], ['ok', 'Select'], ['start', 'Resume']], onBack: () => Flow.resume(), onEvent: (ev) => { if (ev.a === 'start') Flow.resume(); },
      items: [{ label: 'Resume', action: () => Flow.resume() }, { label: 'Controls', action: () => UI.show('controls', {}, true) }, { label: 'Settings', action: () => UI.show('settings', {}, true) }, { label: 'Restart Stage', action: () => Flow.restart() }, { label: 'Quit To Title', action: () => Flow.quit() }] });
  },
  results() {
    const r = Game.results, el = h('div', 'screen dim'); el.appendChild(h('h2', 'title', 'Mission Complete')); const panel = h('div', 'panel'); el.appendChild(panel);
    const mm = Math.floor(r.time / 60), ss = Math.floor(r.time % 60).toString().padStart(2, '0');
    let html = `<div class="stat"><span>${r.stage.name}</span><b>${r.kills} / ${r.total} downed</b></div><div class="stat"><span>Time</span><b>${mm}:${ss}</b></div>`;
    r.pilots.forEach((p) => { html += `<div class="stat"><span style="color:${PLAYER_COLORS[p.slot].hex}">P${p.slot + 1}</span><b>${String(Math.floor(p.score)).padStart(7, '0')} pts · ${p.kills} hits</b></div>`; });
    if (r.pipSaved !== null && r.pipSaved !== undefined) html += `<div class="stat"><span>Pip</span><b>${r.pipSaved ? 'Rescued!' : 'Shot down'}</b></div>`;
    html += `<div class="medal">${r.gold ? '★ GOLD PAW MEDAL ★' : 'Downed ' + Math.ceil(r.total * r.stage.medalAt) + ' for a Gold Paw medal'}</div>`; panel.innerHTML = html; if (r.gold) A.play('medal');
    const scr = { el }; const go = () => { A.play('ui_ok'); Game.nextStage(); if (!Game.paused) UI.hide(); }; scr.onEvent = (ev) => { if (ev.a === 'ok' || ev.a === 'start') go(); };
    scr.hints = [['ok', r.last ? 'Finish' : 'Next Mission']]; return scr;
  },
  finale() {
    const el = h('div', 'screen dim'); el.appendChild(h('div', 'big', 'DEMO COMPLETE!')); const panel = h('div', 'panel'); panel.style.marginTop = '2vh'; el.appendChild(panel);
    const total = Game.pilots.reduce((s, p) => s + p.score, 0); const golds = Game.runStats.filter((r) => r.gold).length;
    let html = `<p>General Gnarl's mutt militia is scattered, and the Pawlon System is safe. For now. Thanks for flying with the Star Paw Squadron!</p>`;
    Game.pilots.forEach((p) => { html += `<div class="stat"><span style="color:${p.color.hex}">P${p.slot + 1}</span><b>${String(Math.floor(p.score)).padStart(7, '0')} pts</b></div>`; }); html += `<div class="stat"><span>Squad total</span><b>${String(Math.floor(total)).padStart(8, '0')}</b></div><div class="medal">${golds ? '★'.repeat(golds) + ' Gold Paw medals: ' + golds : 'Try for a Gold Paw medal next time!'}</div>`; panel.innerHTML = html;
    const scr = { el }; scr.onEvent = (ev) => { if (ev.a === 'ok' || ev.a === 'start' || ev.a === 'back') { A.play('ui_ok'); Flow.quit(); } }; scr.hints = [['ok', 'Back to Title']]; Music.play('calm'); return scr;
  },
  gameover() {
    return UI.list({ bg: 'dim', title: 'Mission Failed', hints: [['nav', 'Move'], ['ok', 'Select']], items: [{ label: 'Try Again', sub: 'Restart this stage with fresh lives', action: () => Flow.restart() }, { label: 'Quit To Title', action: () => Flow.quit() }] });
  },
  about() {
    const el = h('div', 'screen dim'); el.appendChild(h('h2', 'title', 'About & Credits')); const panel = h('div', 'panel scroll'); panel.tabIndex = -1;
    panel.innerHTML = ABOUT_TEXT.split(/\n\n+/).map((blk) => { const lines = blk.split('\n'); const first = lines[0]; if (/^[A-Z][A-Za-z ]+$/.test(first) && lines.length > 1) return `<h3>${first}</h3>` + lines.slice(1).map((l) => `<p>${l.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</p>`).join(''); return lines.map((l) => `<p>${l.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</p>`).join(''); }).join(''); el.appendChild(panel);
    const scr = { el }; scr.onEvent = (ev) => { if (ev.a === 'up') panel.scrollBy({ top: -90, behavior: 'smooth' }); else if (ev.a === 'down') panel.scrollBy({ top: 90, behavior: 'smooth' }); else if (ev.a === 'back' || ev.a === 'ok') { A.play('ui_back'); UI.back(); } };
    scr.hints = [['nav', 'Scroll'], ['back', 'Back']]; return scr;
  },
  attract() { const el = h('div', 'screen'); el.style.pointerEvents = 'none'; el.innerHTML = `<div class="attract-tag">DEMO PLAY &nbsp;·&nbsp; PRESS ANY BUTTON</div>`; el.style.justifyContent = 'flex-start'; const lg = h('div', 'logo', 'STAR PAW <b>64</b>'); lg.style.fontSize = 'calc(var(--u)*6)'; lg.style.marginTop = 'calc(var(--u)*30)'; lg.style.alignSelf = 'flex-end'; lg.style.marginRight = 'calc(var(--u)*4)'; lg.style.transform = 'rotate(-3deg)'; el.insertBefore(lg, el.firstChild); return { el }; },
});

// ==== 90_main.js ====
// ---------------------------------------------------------------- App flow, attract mode, 3D menu backdrop, boot, main loop
const Flow = {
  launch() {
    const players = UI.slots.map((s, i) => (s ? { dev: s.dev, slot: i } : null)).filter(Boolean); UI.hide(); Menu3D.leave(); Music.stop(true);
    Game.start({ stageIds: UI.mission.stages, players }); App.mode = 'play';
  },
  pause() { if (!Game.active || Game.paused || Game.over) return; Game.paused = true; A.loopStop('charge'); for (const p of Game.pilots) p.charging = false; A.play('ui_ok'); UI.show('pause'); },
  resume() { Game.paused = false; UI.hide(); },
  restart() { UI.hide(); Game.retryStage(); },
  quit() { Game.end(); UI.hide(); App.toTitle(); },
};
const App = {
  mode: 'menu', idleLimit: 10000,
  toTitle() { this.mode = 'menu'; Menu3D.enter(); UI.show('title'); Music.play('title'); },
};
const Attract = {
  active: false, actCount: 0, t: 0,
  start() {
    this.active = true; this.actCount = Input.activityCount; this.t = 0; UI.hide(); Menu3D.leave(); Music.stop(true); UI.show('attract'); this.ui = UI.cur;
    Game.start({ stageIds: ['catnip', 'belt'], players: [{ slot: 0, ai: {} }, { slot: 1, ai: {} }], attract: true }); App.mode = 'attract'; Music.play('stage1');
  },
  stop() { this.active = false; Game.end(); UI.hide(); App.toTitle(); Input.note(); },
  tick(dt) {
    if (!Game.active || Game.paused) return; this.t += dt;
    if (Game.kind === 'rail') { const a = Game.a; if (Game.time > 75 && a.s < 5300 && !Game.boss) Game.skipTo(5400); if (Game.boss && Game.boss.t > 50 && !Game.boss.dead) { for (const p of Game.boss.parts) if (p.part === 'core') { p.hp = Math.min(p.hp, 3); p.active = true; p.armor = false; } Game.boss.cannonL.hp = Game.boss.cannonR.hp = 1; } }
    else if (Game.arPhase === 0 && Game.arT > 32) Game.arKills = Math.max(Game.arKills, Game.st.quota);
    else if (Game.rival && Game.rival.t > 40) Game.rival.hp = Math.min(Game.rival.hp, 3);
  },
};
Game.skipTo = function (s) { this.a.s = s; Comms.reset(); while (this.evIdx < this.evs.length && this.evs[this.evIdx].trig < s) this.evIdx++; };

// 3D backdrop for the front-end: formation of cel-shaded ships orbiting in the asteroid belt
const Menu3D = {
  active: false, t: 0, ships: [], env: null,
  enter() {
    this.leave(); R.clearWorld(); FX.reset(); Phys.clearDebris(); Phys.newWorld(0, false); R.setPalette(STAGES.belt.palette); this.env = buildSpaceEnv(mulberry(9)); this.ships = [];
    const defs = [{ body: 0xeaf2ff, accent: 0x2f7bff, p: [0, 0, 0] }, { body: 0xf4f4ea, accent: 0x4cc36b, ears: true, p: [-11, 1, 7] }, { body: 0x4a4263, accent: 0xb35cff, p: [11, 1.5, 8] }, { body: 0xe8ffd8, accent: 0xffd33d, p: [0, 4, 13] }];
    for (const d of defs) { const s = buildShip(d); s.position.set(...d.p); R.world.add(s); this.ships.push({ s, base: V3(...d.p), ph: rr(0, 6) }); }
    this.active = true; this.t = 0; if (!R.cams.length) R.cams = [R.cam];
  },
  leave() { this.active = false; this.ships = []; },
  update(dt) {
    if (!this.active) return; this.t += dt; const t = this.t;
    this.ships.forEach((o, i) => { const p = o.base.clone(); p.y += Math.sin(t * 0.8 + o.ph) * 0.8; p.x += Math.sin(t * 0.5 + o.ph) * 1.2; o.s.position.copy(p); o.s.rotation.set(Math.sin(t * 0.6 + o.ph) * 0.06, 0.2, Math.sin(t * 0.7 + o.ph) * 0.3, 'YXZ'); for (const g of o.s.userData.glows) g.scale.set(1, 1.3 + Math.sin(t * 40 + i) * 0.2, 1); });
    for (const r of this.env.rocks) { r.m.rotation.x += r.spin.x * dt; r.m.rotation.y += r.spin.y * dt; }
    const cam = R.cams[0]; const ang = -0.9 + Math.sin(t * 0.12) * 0.45, rad = 30 - Math.sin(t * 0.07) * 4; cam.position.set(Math.sin(ang) * rad - 6, 5 + Math.sin(t * 0.2) * 2, Math.cos(ang) * rad + 5); cam.up.set(0, 1, 0); cam.lookAt(5, 2, 6); cam.fov = 55; cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
    this.env.stars.position.copy(cam.position); R.followSun(V3(0, 0, 0));
    if (Math.random() < dt * 8) FX.spark(V3(rr(-40, 40), rr(-15, 15), rr(-60, 20)).add(cam.position.clone().multiplyScalar(0.0)), V3(0, 0, 55), 0xbfe9ff, 1.2, 0.35);
  },
};

addEventListener('blur', () => { if (Game.active && !Game.paused && !Attract.active && !UI.visible()) Flow.pause(); });
function fatal(msg) { $('#boot').classList.add('hidden'); const f = $('#fatal'); f.classList.remove('hidden'); f.innerHTML = `<div><div class="big" style="font-size:calc(var(--u)*6)">Could not take off</div><p style="margin-top:2vh">${msg}</p><p style="margin-top:2vh;opacity:.7;font-size:.7em">Star Paw 64 requires a WebGPU-capable browser (recent Chrome, Edge or Safari Technology Preview).</p></div>`; }

let lastT = 0;
function frame(now) {
  requestAnimationFrame(frame); const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016); lastT = now;
  try {
    Input.poll(dt); const events = Input.drain();
    const playing = Game.active && !Game.paused && !Attract.active && !UI.visible();
    if (Attract.active) { if (Input.activityCount !== Attract.actCount) Attract.stop(); }
    else for (const ev of events) { if (playing) { if (ev.a === 'pausekey') { Flow.pause(); break; } } else if (ev.a !== 'pausekey') UI.handle(ev); }
    if (!Attract.active && !Game.active && UI.cur && UI.cur.name !== 'attract' && !Input.touchOnly && performance.now() - Input.activity > App.idleLimit) Attract.start();
    UI.update(dt); if (Attract.active) Attract.tick(dt);
    if (Game.active) Game.update(dt); else Menu3D.update(dt);
    if (!Game.active) { Tweens.update(dt); FX.update(dt); Hud.update(dt); Comms.update(dt); }
    const views = Game.active ? Game.views() : [{ cam: R.cams[0], x: 0, y: 0, w: innerWidth, h: innerHeight, pi: -1 }];
    if (Game.active && Game.kind === 'rail') Game.followCamera(0, false);
    R.draw(views); Hud.draw(views);
  } catch (e) { console.error('frame error', e); if (!frame.err) { frame.err = true; UI.toast('Error: ' + e.message); } }
}
async function boot() {
  try {
    Input.init(); UI.init(); Hud.init();
    $('#tb-settings').addEventListener('click', () => { UI.root.classList.add('raised'); UI.show('settings', { touch: true }); });
    await R.init($('#gl')); await Phys.init(); FX.init(); R.resize();
    if (Input.touchOnly) $('#touchblock').classList.remove('hidden');
    Menu3D.enter(); UI.show('title'); Music.play('title'); const b = $('#boot'); b.style.opacity = 0; setTimeout(() => b.classList.add('hidden'), 600);
    window.StarPaw = { Game, UI, Flow, App, Attract, Settings, STAGES, ENEMY_DEFS, COMMS, TRACKS, Input, A, R, Phys, FX, Hud, Comms, Menu3D, INFO, THREE, ready: true };
    requestAnimationFrame(frame);
  } catch (e) { console.error(e); fatal(String(e.message || e)); window.StarPaw = { error: String(e.message || e) }; }
}
boot();
