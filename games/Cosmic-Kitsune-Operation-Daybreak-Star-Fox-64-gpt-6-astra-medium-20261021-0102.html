function hud(){let scale=clamp(W/1200,.65,1.3),m=32*scale;ctx.save();let barW=Math.min(240*scale,W*.25);panel(m,m,barW,65*scale);text('KX–7  /  SHIELDS',m+14*scale,m+21*scale,12*scale,'#bcd9d8');text(String(Math.max(0,Math.ceil(player.hp))).padStart(3,'0'),m+barW-13*scale,m+23*scale,18*scale,player.hp<30?'#ff8c77':'#eaffcd','right');ctx.fillStyle='#294951';ctx.fillRect(m+14*scale,m+38*scale,barW-28*scale,8*scale);ctx.fillStyle=player.hp<30?'#ff8068':'#d6ff71';ctx.fillRect(m+14*scale,m+38*scale,(barW-28*scale)*Math.max(0,player.hp)/100,8*scale);
text(String(score).padStart(6,'0'),W-m,m+24*scale,31*scale,'#f2f7dd','right');text(combo>1?`${combo} CHAIN  /  ×${(1+Math.min(combo,20)*.1).toFixed(1)}`:'OPERATION DAYBREAK',W-m,m+47*scale,12*scale,combo>1?'#d6ff71':'#a8cecd','right');let chapter=time<50?'01 / SUNLIT APPROACH':time<105?'02 / '+(routeChosen?route:'GLASS CANYON'):time<135?'03 / STORM FRONT':'04 / BREAK THE BLOCKADE';text(chapter,W/2,m+13*scale,12*scale,'#d4e7d5','center');let progress=Math.min(time/135,1),pw=Math.min(240,W*.22);ctx.fillStyle='#b5d7ce33';ctx.fillRect(W/2-pw/2,m+24*scale,pw,3);ctx.fillStyle='#d6ff71';ctx.fillRect(W/2-pw/2,m+24*scale,pw*progress,3);
let ret=proj(...Object.values(targetPosition())),s=22*scale;ctx.strokeStyle=lock?'#d6ff71':'#d6fff2aa';ctx.lineWidth=1.5;for(let a=0;a<4;a++){ctx.save();ctx.translate(ret.x,ret.y);ctx.rotate(a*Math.PI/2);ctx.beginPath();ctx.moveTo(-s,-s/2);ctx.lineTo(-s,-s);ctx.lineTo(-s/2,-s);ctx.stroke();ctx.restore()}circle(ret.x,ret.y,2,'#efffd9');let near=proj(player.x*1.7,8+(player.y-8)*1.7,45);ctx.strokeStyle='#d5ffec44';ctx.strokeRect(near.x-12,near.y-12,24,24);if(lock){let p=proj(lock.x,lock.y,lock.z),size=clamp(p.s*(lock.node?5:3.6),18,70);ctx.strokeStyle='#d6ff71';ctx.strokeRect(p.x-size,p.y-size,size*2,size*2);ctx.beginPath();ctx.arc(p.x,p.y,size+8,-Math.PI/2,-Math.PI/2+Math.min(1,lockTime)*Math.PI*2);ctx.stroke();text(lockTime>.65?'LOCKED':'ACQUIRING',p.x,p.y-size-14,11*scale,'#d6ff71','center')}
let by=H-m-50*scale;panel(m,by,210*scale,50*scale);text('NOVA',m+12*scale,by+20*scale,11*scale,'#aacdce');for(let i=0;i<5;i++){let x=m+75*scale+i*24*scale;poly([{x,y:by+11*scale},{x:x+7*scale,y:by+19*scale},{x,y:by+27*scale},{x:x-7*scale,y:by+19*scale}],i<bombs?'#d6ff71':'#35525b',null)}text('□ / B',m+12*scale,by+39*scale,10*scale,'#c9dcce');text('GOLD '+player.rings,m+75*scale,by+40*scale,10*scale,'#ffe19a');let ew=170*scale,ex=W-m-ew;text('THRUST RESERVE',W-m,by+10*scale,11*scale,'#c7ddcf','right');ctx.fillStyle='#294b55';ctx.fillRect(ex,by+22*scale,ew,5*scale);ctx.fillStyle='#87e7df';ctx.fillRect(ex,by+22*scale,ew*energy/100,5*scale);text(rollCooldown>0?'ROLL RECHARGING':'L1 / R1  •  ROLL READY',W-m,by+44*scale,11*scale,rollCooldown>0?'#aac1c5':'#d6ff71','right');if(!attract)text('✕ FIRE   □ NOVA   ○ BOOST   L2 BRAKE   OPTIONS PAUSE',W/2,H-m+2*scale,10*scale,'#cce6df88','center');if(boss&&!boss.dead){let w=W*.35,x=(W-w)/2,y=m+60*scale;panel(x-12,y-15,w+24,48);text('HALCYON  /  '+(boss.nodes.some(n=>n.hp>0)?'SHIELD PODS':'CORE EXPOSED'),W/2,y,11*scale,'#ffbf9e','center');let hp=boss.nodes.some(n=>n.hp>0)?boss.nodes.reduce((s,n)=>s+Math.max(0,n.hp),0)/90:boss.hp/boss.max;ctx.fillStyle='#3d4b5e';ctx.fillRect(x,y+10,w,6);ctx.fillStyle=boss.nodes.some(n=>n.hp>0)?'#89f7e5':'#ff8b70';ctx.fillRect(x,y+10,w*Math.max(0,hp),6)}ctx.restore()}
function render(){ctx.save();if(shake>0&&!settings.calm)ctx.translate(rand(-1,1)*shake*9,rand(-1,1)*shake*6);background();if(mode==='title'||mode==='settings'&&previousMenu==='title'||mode==='manual'&&previousMenu==='title'||mode==='about'&&previousMenu==='title'){let z=20,xx=W/H>1.3?6.5:4;for(let i=0;i<3;i++)drawShip(14+i*7,10+i*3,70+i*25,.8,.1,true,false);let shadow=proj(xx,0,z);ctx.fillStyle='#123e5333';ctx.beginPath();ctx.ellipse(shadow.x,shadow.y,160,16,-.1,0,Math.PI*2);ctx.fill();drawShip(xx,7+Math.sin(clock*.8)*.35,z,1.25,-.16+Math.sin(clock*.6)*.08);let p=proj(xx,4,z);text('KX–7 / KITSUNE',p.x+60,p.y,11,'#d8f4de88');line({x:p.x+40,y:p.y-5},{x:p.x-10,y:p.y-40},'#cbf4d755')}else if(player){drawEntities();let bank=player.bank+(rollTimer>0?player.rollDir*(1-rollTimer/.7)*Math.PI*2:0);if(invuln<=0||Math.floor(clock*15)%2===0||attract)drawShip(player.x,player.y+Math.sin(clock*3)*.06,18,.68,bank);if(rollTimer>0){let p=proj(player.x,player.y,18);ctx.strokeStyle='#b6fff588';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(p.x,p.y,p.s*3.5,p.s,clock*15,0,Math.PI*1.7);ctx.stroke()}if((keys.ShiftLeft||padBoost)&&energy>3){for(let i=0;i<20;i++){let a=i*2.4,r=H*(.35+((clock*1.5+i*.17)%1)*.5),x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r;line({x,y},{x:x+Math.cos(a)*40,y:y+Math.sin(a)*40},'#c8fff344',2)}}if(mode==='play'||mode==='pause')hud()}
ctx.restore();if(flash>0&&!settings.calm){ctx.fillStyle=`rgba(221,255,225,${Math.min(.55,flash)})`;ctx.fillRect(0,0,W,H)}let vignette=ctx.createRadialGradient(W/2,H*.45,H*.28,W/2,H*.45,Math.max(W,H)*.7);vignette.addColorStop(0,'#02152300');vignette.addColorStop(1,'#02152388');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H)}
let last=performance.now();function frame(now){let d=Math.min(.04,(now-last)/1000);last=now;clock+=d;gamepad();if(mode==='title'){world+=d*18;if(now-lastInput>10000)start(true)}update(d);if(mode==='play'||mode==='title'){for(let p of particles){p.x+=p.vx*d;p.y+=p.vy*d;p.z+=p.vz*d;p.vy-=d*9;p.life-=d}particles=particles.filter(p=>p.life>0);shake=Math.max(0,shake-d);flash=Math.max(0,flash-d)}music(d);if(+document.getElementById('toast').dataset.until<clock)document.getElementById('toast').style.opacity=0;render();requestAnimationFrame(frame)}showMenu('title');requestAnimationFrame(frame);
