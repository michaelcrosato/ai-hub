function shoot(s,t){const T=BASIC[s.type],p=position(s),tp=position(t);const heavy=['tank','stug','at'].includes(s.type);if(s.type==='mortar'){startShell(p,tp.x+(rand()-.5)*25,tp.y+(rand()-.5)*25,68,37,s);s.fire=6.2;return;}

function ability(kind,p){const s=lead();if(!s){notify('Select a squad first.');return;}if(kind in BUILD){startBuild(kind,p);return;}if(kind==='artillery'){if(!S.doctrine.artillery){notify('Unlock Off-map Artillery in Command doctrine.');return;}if(S.artyCooldown>0){notify('Artillery reloading: '+Math.ceil(S.artyCooldown)+'s');return;}if(!visiblePoint(p)){notify('Artillery requires a visible target.');return;}if(!pay([0,90,0]))return;S.artyCooldown=45;S.artillery.push({x:p.x,y:p.y,t:0,n:0,team:0,source:s.id});audio('radio');notify('FIRE MISSION CONFIRMED. Keep friendlies clear.');return;}
 if(kind==='repair'){const t=S.units.find(t=>t.team===0&&!t.dead&&(BASIC[t.type].vehicle||BASIC[t.type].fixed)&&dist(t,p)<30),b=S.buildings.find(b=>!b.dead&&b.team===0&&Math.abs(b.x-p.x)<b.w/2+10&&Math.abs(b.y-p.y)<b.h/2+10);if(s.type!=='engineer'){notify('Engineers repair vehicles, defenses and buildings.');return;}if(t)issue(s,{kind:'repair',target:t.id,x:t.x,y:t.y});else if(b)issue(s,{kind:'repair',building:b.id,x:b.entrance.x,y:b.entrance.y});else notify('Choose a damaged allied vehicle or building.');return;}
 const costs={grenade:[0,25,0],satchel:[0,50,0],barrage:[0,20,0]};if(!costs[kind])return;if(s.cooldowns[kind]>0){notify('Ability recharging: '+Math.ceil(s.cooldowns[kind])+'s');return;}if((kind==='barrage'&&s.type!=='mortar')||(kind!=='barrage'&&!['rifle','para','engineer'].includes(s.type))){notify('This squad cannot use that ability.');return;}
 const range=kind==='barrage'?340:kind==='satchel'?95:130;if(dist(position(s),p)>range){notify('Out of range. Move the squad closer.');return;}if(s.suppression>=1){notify('Pinned! Retreat or relieve the squad before using abilities.');return;}if(!pay(costs[kind]))return;s.cooldowns[kind]=kind==='barrage'?18:12;
 if(kind==='barrage'){for(let i=0;i<4;i++)startShell(position(s),p.x+(rand()-.5)*46,p.y+(rand()-.5)*46,65,36,s,'shell',1.4+i*.8);}
 else{s.throwTime=.55;startShell(position(s),p.x,p.y,kind==='satchel'?200:80,kind==='satchel'?45:34,s,kind,kind==='satchel'?3:1.3);const m=live(s)[0];if(m)m.rig.update(.01,{x:m.x,y:m.y,z:0,facing:s.facing,attack:E.move('throw',.15,'wind')});}audio('order');}
function primaryAbility(){const s=lead();if(!s)return notify('Select a squad.');const type=s.type;if(type==='at'||type==='tank'){if(s.ap>0)return notify('Armor-piercing ammunition is already active.');if(pay([0,30,0])){s.ap=20;notify('ARMOR-PIERCING: +60% penetration for 20 seconds.');audio('build');}return;}
 if(type==='sniper'){s.cloak=!s.cloak;notify(s.cloak?'Camouflage enabled. Moving slowly; firing reveals you.':'Camouflage disabled.');return;}
 if(type==='jeep'){s.reveal=0;updateVision();notify('Recon jeep detects camouflaged infantry within 175 units.');targetMode='move';return;}
 targetMode=type==='engineer'?'repair':type==='mortar'?'barrage':type==='mg'||type==='nest'?'face':'grenade';notify('TARGET: '+targetMode.toUpperCase()+' / click ground, E or RT.');}
function train(type){const picked=selectedBuilding?getBuilding(selectedBuilding):null;const b=picked&&!picked.dead&&['church','hall'].includes(picked.id)?picked:S.buildings.filter(b=>!b.dead&&(b.id==='hall'||b.id==='church')).sort((a,b)=>(a.id==='church'?-1:1))[0];if(!b||b.dead||!['hall','church'].includes(b.id)){notify('Select an operational headquarters.');return;}if(b.queue.length>=4){notify('Training queue is full (four units).');return;}if(friendlies().length+S.buildings.reduce((n,b)=>n+b.queue.length,0)>=22){notify('Company limit reached: 22 squads / vehicles.');return;}const T=BASIC[type];if(pay(T.cost)){b.queue.push({type,t:0,total:T.time*(S.doctrine.rapid?.6:1)});audio('order');notify(T.name+' training at '+(b.id==='church'?'the church.':'the town hall.'));}}

 const types=['rifle','rifle','rifle',n%3===2?'engineer':'rifle'];
 if(n===4||n===8)types[3]='mg';

 if(won){const score=Math.round(S.stats.kills*10+S.stats.armor*130+healthHQ()*1.5-S.stats.lost*90);const r={score,time:S.time,bronze:S.stats.kills>=200,date:META.date,kills:S.stats.kills,armor:S.stats.armor};if(!record||r.score>record.score){record=r;E.store.set('ibells:record',r);}E.store.remove('ibells:save');saveState=null;say('The armor is burning. Carentan holds. You bought the road to Normandy, company.',true);song('after');}

function updateMission(dt){S.phaseT+=dt;if(S.phase===0){if(S.phaseT>=S.prep)beginAssault();return;}
 S.waveT-=dt;if(S.phase===1&&S.wave<8&&S.waveT<=0){spawnWave();S.waveT=22.2;}

  S.bombardT-=dt;if(S.bombardT<=0&&S.phaseT<42){S.bombardT=7;const p={x:430+rand()*184,y:309+rand()*98};S.artillery.push({x:p.x,y:p.y,t:0,n:0,team:1,source:0,bombard:true});}

function updateProjectiles(dt){S.shots.update(dt,S.map);const all=S.units.filter(s=>!s.dead&&!s.garrison);for(const team of[0,1])S.shots.hit(all.filter(s=>s.team!==team),(b,t)=>{const source=byId(b.data.source)||{team,x:b.x-b.vx*.1,y:b.y-b.vy*.1,vet:0,ap:0};hurtUnit(t,b.data.damage,source,b.data.kind,b.data.sup);if(b.data.kind==='cannon'||b.data.kind==='rocket'){blastFx(b.x,b.y,.45);if(!BASIC[t.type].vehicle&&!BASIC[t.type].fixed)for(let i=0;i<2&&!t.dead;i++)hurtUnit(t,b.data.damage*.5,source,'shell',0);}else if(game.r.visible(b.x,b.y,b.z)&&options.effects)P.sparks(b.x,b.y,10,1);},team===0?'allied':'axis');
 for(const q of S.shells){q.t+=dt;if(q.t>=q.delay){q.dead=true;const source=byId(q.source)||{team:q.team,x:q.x0,y:q.y0,vet:0};explodeAt(q.x,q.y,q.radius,q.dmg,source,q.kind);}}
 E.prune(S.shells,q=>q.dead);
 for(const q of S.artillery){q.t+=dt;const wait=q.bombard?4.2:2.8;q.smokeT=(q.smokeT||0)-dt;if(q.t<wait&&q.smokeT<=0&&options.effects){q.smokeT=actualQuality==='High'?.2:.45;P.smoke(q.x,q.y,2,1,{size:5,color:q.team===1?'#bb7362':'#bab080',dark:q.team===1?'#874f46':'#807c57',light:q.team===1?'#d18b77':'#d1c893'});}if(q.t>wait+q.n*.58&&q.n<6){const source=byId(q.source)||{team:q.team,x:q.x,y:q.y-100,vet:0};const x=q.x+(rand()-.5)*94,y=q.y+(rand()-.5)*75;startShell({x:x+25,y:y-150},x,y,q.bombard?95:135,38,source,'shell',.7);q.n++;}if(q.t>wait+5)q.dead=true;}
 E.prune(S.artillery,q=>q.dead);
 for(const m of S.mines){if(m.dead)continue;const t=S.units.find(s=>!s.dead&&s.team===1&&s.type!=='engineer'&&dist(s,m)<19);if(t){m.dead=true;S.stats.built+=0;explodeAt(m.x,m.y,38,175,{team:0,x:m.x,y:m.y+15,vet:0},'mine');if(BASIC[t.type].vehicle)t.engineDamage=8;else t.suppression=1.5;notify('Minefield triggered at '+(m.x<270?'A':m.x<520?'B':'C')+'.');}}
 E.prune(S.mines,m=>m.dead);E.prune(S.wire,m=>m.hp<=0);E.prune(S.sites,m=>m.done);E.prune(S.cover,c=>c.hp<=0);
}
function capturePoints(dt){for(const n of S.nodes){if(n.base)continue;let team=-1,rate=0;const units=S.units.filter(s=>!s.dead&&BASIC[s.type].n&&!s.garrison&&s.suppression<1&&dist(s,n)<36);const a=units.some(s=>s.team===0),b=units.some(s=>s.team===1);n.contested=a&&b;if(n.contested)continue;if(a)team=0;else if(b)team=1;if(team<0)continue;rate=dt/8;
 if(n.owner===team){n.cap=Math.min(1,n.cap+rate);continue;}n.cap-=rate;if(n.cap<=0){n.owner=team;n.cap=1;if(team===0){S.stats.captured++;S.res.mu+=15;audio('capture');notify(n.name+' secured. +15 munitions.');}else say('Enemy forces have cut '+n.name.toLowerCase()+'. Reconnect the supply line.');updateSupply();}}

function simulation(dt){if(S.completed){S.endT+=dt;if(S.endT>2.8){game.timeScale=1;game.go('results');}return;}S.time+=dt;S.fogT-=dt;S.autoSaveT+=dt;S.artyCooldown=Math.max(0,S.artyCooldown-dt);
 updateMission(dt);for(const k of['mp','mu','fuel'])S.res[k]=Math.min(9999,S.res[k]+S.income[k]*dt);
 S.hash.build(S.units);for(const s of S.units)updateSquad(s,dt);updateProjectiles(dt);capturePoints(dt);
 for(const b of S.buildings){if(b.dead||!b.queue.length)continue;const q=b.queue[0];q.t+=dt;if(q.t>=q.total){b.queue.shift();const p=nearWalk(b.entrance.x+(rand()-.5)*34,b.entrance.y+12);const s=spawn(q.type,0,p.x,p.y);s.reinforce=true;audio('capture',.6);notify(BASIC[q.type].name+' ready at '+(b.id==='church'?'church':'town hall')+'.');}}

function commonUpdate(dt){if(game.input._touchEl)game.input._touchEl.style.display=game.sceneName==='battle'&&!menu&&!game.paused&&document.getElementById('documentation').hidden?'flex':'none';toast.left=Math.max(0,toast.left-dt);for(const t of radio)t.left-=dt;E.prune(radio,t=>t.left<=0);for(const t of orderFlash)t.left-=dt;E.prune(orderFlash,t=>t.left<=0);officer.update(dt,{x:0,y:0,z:0,facing:.5,pose:'hips'});
 perfClock+=dt;perfMean=lerp(perfMean,game.stats.frameMs,.014);if(options.quality==='Auto'&&perfClock>3){perfClock=0;setQuality(perfMean>21?'Balanced':perfMean<18?'High':actualQuality);}

function groundAtCursor(p=cursor){const q=game.view.toGround(p.x+game.screen.ix,p.y+game.screen.iy);return{x:q[0],y:q[1]};}
function selectUnit(s,add=false){if(!s||s.dead||s.team!==0)return;if(add){if(selection.includes(s.id))selection=selection.filter(id=>id!==s.id);else selection.push(s.id);}else selection=[s.id];selectedBuilding=null;audio('select');targetMode=null;rosterPage=Math.floor(friendlies().findIndex(t=>t.id===s.id)/U.slots);}

function unitAt(p,team=null){let found=null,bd=30;for(const s of S.units){if(s.dead||s.team!==0&&!s.seen||team!==null&&s.team!==team)continue;const pos=position(s),q=game.r.w(pos.x,pos.y,0);const d=Math.hypot(q[0]-p.x,(q[1]-16)-p.y);if(d<bd){bd=d;found=s;}if(!s.garrison)for(const m of live(s)){const q=game.r.w(m.x,m.y,17),d=Math.hypot(q[0]-p.x,q[1]-p.y);if(d<bd){bd=d;found=s;}}}return found;}
function buildingAtScreen(p){let best=null,bd=1e9;for(const b of S.buildings){if(b.dead)continue;const q=game.r.w(b.x,b.y,23),d=Math.hypot((p.x-q[0])/(b.w*.55*game.view.scale),(p.y-q[1])/(b.h*.45*game.view.scale));if(d<1&&d<bd){bd=d;best=b;}}return best;}

function targetOrder(p,append=false){const s=lead();if(!s)return notify('Select a squad or a roster card first.');const world=groundAtCursor(p),enemy=unitAt(p,1);if(targetMode&&targetMode!=='move'&&targetMode!=='attack'){

 const w=S.weapons.find(w=>!w.got&&dist(w,world)<24);if(w){issueSelected({kind:'salvage',weapon:w.id,x:w.x,y:w.y},append);return;}

function processPointers(battle){for(const ev of pointerQueue){const p=hudPoint(ev.x,ev.y);cursor.x=p.x;cursor.y=p.y;virtualCursor=false;const hit=getUi(p);hover=hit&&hit.id;

IRON BELLS — HOLD AT CARENTAN
Completion report / build 1.0.0
Generated: 2026-09-29
AI model: GPT-6 Astra Pro
Source: Company of Heroes for PC (2006), mission 4: Carentan Counterattack
Engine: supplied my-3D2dge v0.6.0
Internal, non-commercial testing build. Unofficial; not endorsed by Relic or SEGA.

LAUNCH
Save this HTML locally, then open it in a desktop Chromium-based browser. No installation, server, network, account, assets folder, or build step is needed. Choose DEPLOY COMPANY. Browser audio starts after the first interaction. Landscape orientation is recommended on phones. An actual gamepad must use the browser's standard gamepad mapping. Canvas lighting is the default and all gameplay is independent of WebGPU.

HOW TO WIN
Prepare the three river crossings. Re-crew the two abandoned AT guns with Airborne, then replenish the original squads near an HQ. Deploy the Engineers initially inside both headquarters. Build mines and MG emplacements, place infantry behind cover, and purchase upgrades. Keep a second AT line on the roads around the church, not only at the crossings. Do not send your last Engineers into tank fire. After 120 seconds (or BEGIN ASSAULT), hold for 180 seconds. Red smoke marks the bombardment: retreat west and defend the church for another 75 seconds. The forward headquarters collapses. Three Shermans and two rifle squads arrive with supplies. Destroy every remaining StuG and halftrack to finish. The church must survive throughout. The optional Bronze Star requires 200 Axis infantry casualties.

There are twelve finite assault groups, plus initial sentries, supporting mortars, and the final armor reserve. Enemy infantry do not respawn indefinitely. Field difficulty reduces received damage; Veteran is harsher. Keeping a reserve AT line and preserving Engineers for repairs still matters. Difficulty changes apply to the next operation.

CONTROLS
Mouse / keyboard:
Left-click selects a squad or headquarters; drag to select a group. Shift adds to selection and queues movement orders. Right-click or E gives a context order: move, attack, capture, garrison, or crew an abandoned weapon. Select 1–8 within the current roster page; Tab / backquote cycle squads; F selects the company. WASD / arrows pan, Home centers selection, wheel / plus / minus zoom. Q selects attack-move, R retreats, G activates the unit-specific ability. H stops, T toggles reinforcement, X targets a satchel, U opens upgrades, V targets repairs. C or B opens all orders. M opens the tactical map. P / Escape pauses. N mutes, F3 toggles diagnostics, F11 toggles fullscreen. Menus use arrows, Enter / Space, and Escape. The same controls are explained in four in-game manual pages.

Gamepad:
Left stick moves the cursor, right stick pans. A / Pad0 selects or confirms; RT / Pad7 issues the context order. X / Pad2 selects attack-move, Y / Pad3 activates the primary ability, B / Pad1 retreats or cancels. LB / Pad4 and RB / Pad5 cycle squads. LT / Pad6 opens the complete order palette; d-pad and A navigate it. L3 / Pad10 selects the company, R3 / Pad11 centers selection. View / Pad8 opens the map; Start / Pad9 pauses. Zoom, training, defenses, upgrades, specialist abilities, audio and display settings are all reachable through menus. Specialist keyboard shortcuts have a context-sensitive Pad0 counterpart in those menus; the pad is not expected to provide dozens of distinct simultaneous buttons.

Touch:
Tap a soldier or roster card to select. Tap ground, an enemy, a sector flag or a building to give an order. The lower-left battlefield region uses the engine's move stick for camera panning. SQUAD cycles and centers units, ORDER commands at the tactical cursor, ABILITY uses the primary action, and ORDERS opens every specialist action. Select a targeted action, then tap its destination. Tap the minimap to pan. PAUSE opens settings and saves. A dedicated compact 400×250 interface is chosen for coarse pointers, versus 720×450 on desktop. These are layout decisions, not quality decisions based on device names.

TACTICAL SYSTEMS IMPLEMENTED
Squads contain individual soldiers, individual health, animated HD Humanoid rigs, casualties, and replacement soldiers. Combat strength decreases with manpower. Squad selection, additive / box selection, formation movement, queued orders, attack-move, focus targeting, stopping, retreat and roster cycling are usable.

Movement uses E.Body and E.TileMap collision, with E.FlowField routes around the river and buildings. E.SpatialHash finds combat targets. E.Bullets simulates direct projectiles; mortar, grenade, satchel and artillery arcs use x/y ground positions and z height. All simulation changes occur in engine update substeps, no larger than 1/120 second. Pointer DOM callbacks only enqueue intent.

Cover is directional: stone walls and sandbags protect the correct side; rubble and wrecks provide additional cover. Roads expose infantry. MGs have setup time and firing arcs. Sustained MG fire causes suppression, then pinning. Retreat clears suppression and reduces incoming fire while returning survivors to an HQ. Reinforcement is a per-soldier manpower transaction, and aid stations heal near the headquarters.

Buildings can be entered and exited, house two squads, provide cover, block sight and fire, take damage and collapse into traversable rubble. Collapse ejects surviving occupants. Engineers build sandbags, wire, mines and MG nests, repair vehicles / buildings, and can upgrade to flamethrowers. Pioneers clear mines; heavy tracked vehicles crush wire. Abandoned MG, AT and mortar weapons can be re-crewed; dropped rocket launchers can be recovered. A crew transfer takes three living soldiers while preserving the original squad.

Manpower, munitions and fuel accrue through a connected sector graph. Capturing points changes ownership and income; cut-off sectors stop producing. HQs train infantry and support weapons with real queues, durations, costs, cancellation refunds and population limits. AT guns and armor use directional penetration and rear-armor bonuses. Shermans have independently rotating turrets and a reverse-movement option. Snipers camouflage; jeeps detect them. Weapon upgrades, grenades, satchels, mortar barrages, AP ammunition, veterancy, Off-map Artillery and Rapid Response are operational.

SELECTED LEVEL CHECKLIST — SOURCE TO DEMO
[The following compact source checklist is paraphrased from Gamepressure's mission guide.]
• Establish a defensive perimeter → preparation across A, B and C.
• Engineers, two HQs, paratroopers and jeep → initial roster and garrisons.
• Abandoned MG42, two AT guns, Panzerschrecks → labeled recovery sites.
• Mines, wire, sandbags, MG emplacements and repairs → Engineer Works.
• HQ MG/sniper/mortar/AT production, reinforcement and weapon upgrades → order menus.
• Off-map Artillery and Rapid Response → Command Doctrine.
• Infantry, StuGs, halftracks, motorcycles and mine-clearing pioneers → authored assaults.
• Mortar bombardment, red warning smoke and town hall loss → fallback phase.
• Defend the church → persistent failure condition and survival phase.
• Sherman and infantry relief → counterattack reinforcements.
• Destroy all Axis armor → victory objective.
• Inflict 200 infantry casualties → optional Bronze Star.

The level's functional areas are the northern assembly farms, three bridge approaches, southern quayside buildings, central forward HQ, western church HQ, connecting streets and resource depots. There is no loading transition inside the battlefield; phase transitions are playable, with radio orders and a results scene at the end.

Player-feedback-informed priorities: make simultaneous fronts easier to manage, preserve cover / flanking decisions, provide a readable roster and warnings, and avoid menu searching during combat. Direct community discussions informed these priorities; they are not presented as statistically representative consensus.

SAVES / OPTIONS

QUALITY / ACCESSIBILITY
Canvas is the initial lighting backend. WebGPU is opt-in in Options, with an availability check and Canvas fallback. High permits 500 particles, full colored lights, emissive occlusion and GPU shadows when GPU is selected. Balanced permits 190 particles, fewer effects and detail passes, reduced light tint / lamp count and no optional GPU shadows. Auto starts Balanced and chooses from measured game.stats.frameMs with smoothing and hysteresis, not device names. Diagnostics show backend, effective preset, frame time, actor / particle counts and game.errors length. Screen shake, reduced motion, effects, music, SFX, master volume and mute are adjustable. Reduced motion suppresses shake through the engine and skips extra hit-stop / slow-motion presentation. Fullscreen uses #stage's Fullscreen API.

HUB MIGRATION NOTES
File order: HTML shell and #stage / #screen, unmodified engine script, explicitly labeled engine extensions, one strict-mode game IIFE beginning with const E = My3D2dge, then this non-executable report block. There is no module loader or build tool.

Engine extension: E.installPausedUpdate(game). The engine normally returns from _step before a paused scene can process a settings panel. This instance-level adapter runs scene.updatePaused(dt) after the original step only while paused. It does not advance mission simulation; it supplies pause-menu input, options and save handling. Consider a documented paused-UI hook for the shared engine. The original engine text is not patched. The adapter depends on _step, an internal method, and must be reviewed when the hub updates engine versions.

Engine extension: E.WorldPaintCache. The base engine caches its own tiles and props but has no general cache for game-authored static world geometry. This bounded cache rasterizes static buildings, ruins, bridge rails, walls and vehicle wrecks once per geometry / quality / view key, converts the result into an E.sprite, and queues it through the normal renderer. Living characters remain animated E.Humanoid rigs; they are never converted into sprites. The cache does offscreen getImageData readback and temporarily adjusts renderer ix / iy inside a try/finally while baking. It initializes the GPU material target through the internal _infoVert method before replaying the original geometric painter for the material pass. This is an explicit internal-renderer dependency for hub review. Consider upstreaming a supported static-world-painter cache API. The core script is unchanged.

Cosmetic rig poses are sampled at approximately 30 Hz with accumulated simulation dt and visibility culling; bodies, orders, combat, collision and mission rules retain the engine's fixed substeps. A cached/static painter is bounded to 280 entries. Shared-hub teardown should release this game-owned cache as well as the ordinary scene state.

All battlefield and canvas HUD art uses E.px, E.font, E.ui, E.Backdrop, E.Humanoid and renderer calls. Custom world buildings, crewed weapons and vehicles are queued, with world coordinates and hue-shifted tones. E.TileMap supplies the floor bake, obstacles and collision; buildings are painted as coherent custom depth-queued geometry rather than using its per-tile wall painter. No game drawing uses ctx.arc, ctx.stroke, ctx.fillText or gradients.

DOM exceptions: engine-created touch controls are restyled and relabeled; the engine move stick is gated to the lower-left battlefield; canvas pointer events enqueue touch taps / drag-selection intent; wheel events enqueue zoom intent. #documentation is an HTML text panel for long-form reports outside the pixel game buffer. Fullscreen is a guarded browser API call on #stage. A window.IronBells inspection interface exposes current state, same-path orders and UI activation for QA; remove or gate it in a production hub. Engine GPULighting internally owns its optional GPU canvas.

All saved keys are namespaced. Custom E.songs and audio effects use ib: names. Both extensions are guarded against duplicate installation. The game publishes no generic global functions apart from window.IronBells; the core publishes My3D2dge as supplied. For migration, remove the copied engine script and use the hub's central matching engine. Retain or upstream both the paused-UI hook and static-painter cache, mount the stage shell, load the IIFE, and use a hub teardown wrapper for game-loop / event-listener ownership. The current core's perpetual requestAnimationFrame and listeners do not expose a general destroy() method; the standalone game does not pretend one exists. A hub mount/unmount lifecycle is needed before hot-swapping games within one live document.
