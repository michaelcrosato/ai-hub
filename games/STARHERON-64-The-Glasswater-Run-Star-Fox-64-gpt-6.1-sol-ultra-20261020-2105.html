function updateEffects(dt) {

    p.mesh.position.addScaledVector(p.vel, dt);
    if (p.shock) {
      const scale = 1 + (1 - p.life / p.max) * p.size;
      p.mesh.scale.setScalar(scale);
      if (p.sphere)
        p.mesh.material.opacity = 0.36 * Math.max(0, p.life / p.max);
    } else {
      p.mesh.rotation.x += dt * (p.spin || 2);

  for (let i = effects.length - 1; i >= 0; i--)
    if (effects[i].life <= 0) {
      scene.remove(effects[i].mesh);
      if (effects[i].dispose) {
        effects[i].mesh.geometry.dispose();
        effects[i].mesh.material.dispose();

function finish() {

    localStorage.setItem("starheron.best.v1", String(best));

  }

    kills,
    rings,
    accuracy,
    rank,
    best,

    health: Math.round(health),

function updateScenery(dt) {

  if (active() || mode === "paused" || mode === "debrief" || mode === "gameover") {

    cameraGoal.set(
      player.position.x * 0.26,
      18 + player.position.y * 0.2,
      player.position.z + 32 + (speed - 74) * 0.04

    lookGoal.set(player.position.x * 0.35, 14, player.position.z - 90);
    camera.position.lerp(cameraGoal, 1 - Math.exp(-Math.max(dt, 0.016) * 6));
    if (!settings.reducedMotion && shake > 0) {
      camera.position.x += (Math.random() - 0.5) * shake;
      camera.position.y += (Math.random() - 0.5) * shake;
    }
    camera.lookAt(lookGoal);
    camera.fov = lerp(
      camera.fov,
      speed > 100 && !settings.reducedMotion ? 65 : 58,
      Math.min(1, dt * 4)
    );
    camera.updateProjectionMatrix();

    player.scale.setScalar(1.9);
    player.visible = true;
    player.position.set(
      22 + Math.sin(time * 0.2) * 2,
      17 + Math.sin(time * 0.8) * 0.7,
      -distance

    player.rotation.set(
      Math.sin(time * 0.4) * 0.03,
      -0.28,
      Math.sin(time * 0.5) * 0.08 - 0.09

    camera.lookAt(-5, 14, -distance - 13);
    camera.fov = 52;

var hudClock = 0;
