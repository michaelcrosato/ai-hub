const PCOL = ['#ff5d73', '#4fc3ff', '#5ee08a', '#ffd23f'];

const UI = {
  root: null, cur: null, el: null, focusEl: null, lastType: null, lastDev: 'kb', toastT: 0,
  init() {
    this.root = document.getElementById('ui');
    this.toastEl = document.getElementById('toast');
  },
  hints(list) {
    return `<div class="hints">${list.map(([a, label]) => `<span>${Input.glyph(a)} ${label}</span>`).join('')}</div>`;
  },
  toast(msg) { this.toastEl.textContent = msg; this.toastEl.classList.add('on'); this.toastT = 2.4; },
  go(id, params = {}) {
    if (this.cur && this.cur.leave) this.cur.leave();
    this.root.innerHTML = '';
    this.cur = null; this.el = null; this.focusEl = null;
    if (!id) return;
    const scr = SCREENS[id](params);
    scr.id = id;
    this.cur = scr;
    const el = document.createElement('div');
    el.className = 'screen ' + (scr.cls ?? 'dim');
    el.innerHTML = scr.html();
    this.root.appendChild(el);
    this.el = el;
    this.lastType = Input.lastType;
    this.bindMouse();
    if (scr.mount) scr.mount(el);
    const first = el.querySelector('.f.default') || el.querySelector('.f:not(.disabled)');
    if (first && !scr.noFocus) this.setFocus(first, true);
  },
  refresh() { if (!this.cur) return; const id = this.cur.id; const keep = this.focusEl && this.focusEl.dataset.key; const sc = this.cur; this.el.innerHTML = sc.html(); this.bindMouse(); if (sc.mount) sc.mount(this.el); const f = (keep && this.el.querySelector(`.f[data-key="${keep}"]`)) || this.el.querySelector('.f:not(.disabled)'); if (f && !sc.noFocus) this.setFocus(f, true); return id; },
  bindMouse() {
    this.el.querySelectorAll('.f').forEach((f) => {
      f.addEventListener('mouseenter', () => { if (!f.classList.contains('disabled')) this.setFocus(f); });
      f.addEventListener('click', (e) => { e.stopPropagation(); Sound.init(); this.setFocus(f, true); this.activate(f); });
    });
    const bb = this.el.querySelector('.backbtn');
    if (bb) bb.addEventListener('click', (e) => { e.stopPropagation(); Sound.init(); if (this.cur && this.cur.back) { Sound.play('menuBack'); this.cur.back(); } });
  },
  setFocus(el, silent) {
    if (this.focusEl === el) return;
    if (this.focusEl) this.focusEl.classList.remove('focus');
    this.focusEl = el;
    if (el) { el.classList.add('focus'); if (!silent) Sound.play('menuMove'); if (this.cur && this.cur.onFocus) this.cur.onFocus(el); }
  },
  activate(el) {
    if (!el || el.classList.contains('disabled')) { Sound.play('menuDeny'); return; }
    const act = el.dataset.act;
    if (this.cur && this.cur.act) { Sound.play('menuSelect'); this.cur.act(act, el); }
  },
  nav(dir) {
    const els = [...this.el.querySelectorAll('.f:not(.disabled)')];
    if (!this.focusEl) { if (els[0]) this.setFocus(els[0]); return; }
    const r = this.focusEl.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let best = null, bd = 1e9;
    for (const e of els) {
      if (e === this.focusEl) continue;
      const q = e.getBoundingClientRect();
      const x = q.left + q.width / 2, y = q.top + q.height / 2;
      const dx = x - cx, dy = y - cy;
      let p, s;
      if (dir === 'right') { p = dx; s = Math.abs(dy); } else if (dir === 'left') { p = -dx; s = Math.abs(dy); } else if (dir === 'down') { p = dy; s = Math.abs(dx); } else { p = -dy; s = Math.abs(dx); }
      if (p <= 4) continue;
      const score = p + s * 2.2;
      if (score < bd) { bd = score; best = e; }
    }
    if (best) this.setFocus(best);
  },
  update(dt) {
    if (this.toastT > 0) { this.toastT -= dt; if (this.toastT <= 0) this.toastEl.classList.remove('on'); }
    const scr = this.cur;
    if (!scr) return;
    if (this.lastType !== Input.lastType) { this.lastType = Input.lastType; const hb = this.el.querySelector('.hints'); if (hb && scr.hintList) hb.outerHTML = this.hints(scr.hintList()); }
    if (scr.update) scr.update(dt);
    if (scr.customInput) { scr.customInput(dt); }
    else {
      const m = Input.menuAll();
      if (m.dev) this.lastDev = m.dev;
      const f = this.focusEl;
      for (const d of ['up', 'down', 'left', 'right']) {
        if (!m[d]) continue;
        if (f && f._adj && (d === 'left' || d === 'right')) { f._adj(d === 'left' ? -1 : 1); Sound.play('menuMove'); }
        else if (scr.onDir && scr.onDir(d)) { /* handled */ }
        else this.nav(d);
      }
      if (m.ok && f) this.activate(f);
      if (m.back && scr.back) { Sound.play('menuBack'); scr.back(); }
      if ((m.l1 || m.r1) && scr.onTab) scr.onTab(m.l1 ? -1 : 1);
      if (m.alt && scr.onAlt) scr.onAlt();
      if (m.start && scr.onStart) scr.onStart();
      if (m.opts && scr.onOptions) scr.onOptions();
    }
    // Attract mode after 10 s idle on menu screens
    if (scr.idle && !App.race && performance.now() - Input.lastInput > 10000) App.startAttract();
  },
};

          .map(([id, t, d, c], i) => `<div class="tile f ${i === 0 ? 'default' : ''}" data-act="${id}" data-key="${id}" style="--c:${c}">${ICON[id]}<h3>${t}</h3><p>${d}</p></div>`).join('')}

          .map(([id, t, c]) => `<div class="tile small f" data-act="${id}" data-key="${id}" style="--c:${c}">${ICON[id]}<h3>${t}</h3></div>`).join('')}

        <div class="joins">${Array.from({ length: max }, (_, i) => {

        <div class="mlist hbtns" style="margin-top:calc(var(--u)*4)"><div class="mbtn f default" data-act="go">Continue</div></div>
        ${UI.hints(scr.hintList())}`,

  bootMsg.textContent = info.splash ? 'Building the track…' : 'Building the track… press any key, click or tap when you are ready';
  try { await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1200))]); } catch (e) { /* fonts optional */ }
  await new Promise((r) => setTimeout(r, 30));
  makeArt(true);
  await new Promise((r) => setTimeout(r, 0));
  if (net.ended) { bootMsg.textContent = net.ended === 'sat-out' ? 'You sat this one out' : 'Round over'; return; }
  App.race = net.build();
  window.__mgk = { race: App.race, net }; // session-only handle for automated tests (harness / hub-check)
  UI.go('race');
  document.getElementById('boot').remove();
  requestAnimationFrame(frame);
}

  ['Date', '2026-10-18 15:58 (PDT)'],
  ['Source', 'Mario Kart 64 (Nintendo 64 · Nintendo EAD · 1996) — used as inspiration only. Every character, track, item name, model, tune and sound here is original.'],

const App = {
  race: null, backdrop: null, podium: null, session: null, attract: false, attractIdx: 0, backIdx: 0, lastStart: null,
  felt: null, world: 0, // the local player's controls as read this frame, and seconds the world has run (for the probe)
  startBackdrop() {
    if (this.backdrop) return;
    const ids = ['sunny', 'coconut', 'neon', 'frosty', 'canyon', 'prism', 'fortress', 'boardwalk'];
    const id = ids[this.backIdx++ % ids.length];
    this.backdrop = new Race({ mode: 'backdrop', trackId: id, cc: 100, humans: [], cpuCount: 8 });
  },
  stopBackdrop() { if (this.backdrop) { this.backdrop.dispose(); this.backdrop = null; } },
  disposeRace() { if (this.race) { this.race.dispose(); this.race = null; } },
  loading(title, sub, fn) {
    const L = document.getElementById('loading');
    document.getElementById('loadT').textContent = title;
    document.getElementById('loadS').textContent = sub;
    L.classList.add('on');
    UI.go(null);
    setTimeout(() => { try { fn(); } finally { L.classList.remove('on'); } }, 60);
  },
  startRace(o) {
    this.stopBackdrop(); this.disposeRace(); this.podium = null;
    const def = o.mode === 'battle' ? ARENAS.find((a) => a.id === o.trackId) : TRACKS.find((t) => t.id === o.trackId);
    const sub = o.mode === 'battle' ? 'Battle Arena' : `${o.mirror ? 'Mirror · ' : ''}${o.cc}cc · ${def.laps} laps`;
    this.lastStart = o;
    if (Music.gain && Sound.ctx) Music.gain.gain.setTargetAtTime(1, Sound.ctx.currentTime, 0.05);
    this.loading(def.name, sub, () => {
      this.race = new Race(o);
      UI.go('race');
      Input.lastInput = performance.now();
    });
  },
  humans() { return this.session.players.map((p) => ({ charId: p.charId, dev: p.dev, pidx: p.pidx })); },
  startSingle(trackId) {
    const S = this.session;
    if (S.mode === 'tt') this.startRace({ mode: 'tt', trackId, cc: 150, humans: this.humans(), cpuCount: 0, onFinish: (r) => this.finishSingle(r) });
    else if (S.mode === 'battle') this.startRace({ mode: 'battle', trackId, cc: 100, humans: this.humans(), cpuCount: S.cpu ? Math.max(0, 6 - S.players.length) : 0, onFinish: (r) => this.finishSingle(r) });
    else this.startRace({ mode: 'vs', trackId, cc: S.cc, mirror: S.mirror, humans: this.humans(), cpuCount: S.cpu ? 8 - S.players.length : 0, onFinish: (r) => this.finishSingle(r) });
  },
  finishSingle(res) {
    const S = this.session;
    Save.data.races++;
    if (res.order[0] && res.order[0].human) Save.data.wins++;
    Save.save();
    if (S.mode === 'vs' || S.mode === 'battle') { const w = res.order[0]; if (w && w.human) S.wins[w.pidx] = (S.wins[w.pidx] || 0) + 1; }
    Music.play('results');
    UI.go('results', { res });
  },
  startGP(cupId) {
    const S = this.session;
    S.cup = cupId; S.raceIdx = 0; S.points = {}; S.lastGain = {};
    const humanIds = S.players.map((p) => p.charId);
    const cpus = CHARACTERS.map((c) => c.id).filter((id) => !humanIds.includes(id)).sort(() => Math.random() - 0.5).slice(0, 8 - humanIds.length);
    for (const id of [...humanIds, ...cpus]) S.points[id] = 0;
    S.grid = [...cpus, ...humanIds];
    this.startGPRace();
  },
  startGPRace() {
    const S = this.session, cup = CUPS.find((c) => c.id === S.cup);
    this.startRace({ mode: 'gp', trackId: cup.tracks[S.raceIdx], cc: S.cc, mirror: S.mirror, humans: this.humans(), grid: S.grid, cpuChars: S.grid.filter((id) => !S.players.some((p) => p.charId === id)), onFinish: (r) => this.finishGP(r) });
  },
  finishGP(res) {
    const S = this.session;
    S.lastGain = {};
    res.order.forEach((r, i) => { const g = GP_POINTS[i] || 0; S.points[r.charId] = (S.points[r.charId] || 0) + g; S.lastGain[r.charId] = g; });
    // Next grid: standings order, leader starts at the front (pole = first grid slot)
    S.grid = Object.keys(S.points).sort((a, b) => S.points[b] - S.points[a]);
    Save.data.races++; Save.save();
    Music.play('results');
    UI.go('results', { res });
  },
  nextGPRace() { this.session.raceIdx++; this.startGPRace(); },
  ceremony(rows) {
    const S = this.session, cup = CUPS.find((c) => c.id === S.cup);
    const top = rows.slice(0, 3).map((r) => r.id);
    const humanPlace = rows.findIndex((r) => r.human) + 1;
    const ccKey = S.mirror ? 'mirror' : S.cc;
    const kind = ['gold', 'silver', 'bronze'][humanPlace - 1];
    if (kind) {
      const key = `${cup.id}_${ccKey}`, rank = { gold: 3, silver: 2, bronze: 1 };
      if (!Save.data.trophies[key] || rank[kind] > rank[Save.data.trophies[key]]) Save.data.trophies[key] = kind;
      Save.save();
    }
    this.disposeRace();
    this.podium = new Podium(top, humanPlace, cup.name, S.cc);
    Music.play('podium');
    const champ = charById(top[0]).name;
    const headline = kind ? `${ordinal(humanPlace)} place — ${kind[0].toUpperCase() + kind.slice(1)} Trophy!` : `${ordinal(humanPlace)} place · ${champ} takes the cup`;
    UI.go('podium', { cupName: cup.name, ccLabel: S.mirror ? 'Mirror' : S.cc + 'cc', headline });
  },
  endCeremony() { this.podium = null; this.quitToMenu(); },
  pauseRace(dev) {
    if (!this.race || this.race.paused || this.race.net || this.attract || !UI.cur || UI.cur.id !== 'race' || this.race.phase === 'done') return;
    this.race.paused = true;
    Sound.play('pause');
    if (Music.gain && Sound.ctx) Music.gain.gain.setTargetAtTime(0.3, Sound.ctx.currentTime, 0.05);
    UI.go('pause', { dev });
  },
  resume() {
    if (!this.race) return;
    this.race.paused = false;
    if (Music.gain && Sound.ctx) Music.gain.gain.setTargetAtTime(1, Sound.ctx.currentTime, 0.05);
    // swallow the button edge that closed the pause menu so it can't immediately re-pause
    Input.pressed.clear();
    for (const p of Object.values(Input.pads)) p.pb = p.b.slice();
    UI.go('race');
  },
  // The settings or pause menu over a race: the pause menu on its own, the settings in a session (which never pause)
  menuOpen() { return !!(this.race && !this.attract && UI.cur && ['pause', 'options', 'howto'].includes(UI.cur.id)); },
  hubMenu(open) {
    if (!this.race || !this.race.net) return;
    if (open) {
      if (this.race.net.ended || this.menuOpen()) return;
      Sound.play('pause');
      UI.go('options', { from: 'session' });
    } else if (this.menuOpen()) {
      Sound.play('menuBack');
      UI.go('race');
      // swallow the button edge that closed the menu so it can't immediately reopen it
      Input.pressed.clear();
      for (const p of Object.values(Input.pads)) p.pb = p.b.slice();
    }
  },
  restart() { if (this.lastStart) this.startRace(this.lastStart); },
  quitToMenu() {
    this.disposeRace(); this.podium = null; this.attract = false;
    this.startBackdrop();
    Music.play('menu');
    UI.go('main');
  },
  startAttract() {
    if (this.race) return;
    this.stopBackdrop();
    const list = [...TRACKS.map((t) => ({ id: t.id, battle: false })), ...ARENAS.map((a) => ({ id: a.id, battle: true }))];
    const pickA = list[this.attractIdx++ % list.length];
    this.attract = true;
    this.race = new Race({ mode: pickA.battle ? 'battle' : 'attract', trackId: pickA.id, cc: 150, mirror: false, humans: [], cpuCount: pickA.battle ? 6 : 8, onFinish: () => { if (this.attract) { this.disposeRace(); this.startAttract(); } } });
    if (pickA.battle) { this.race.attract = true; this.race.demo = true; this.race.cine = new CineCam(this.race, false); }
    UI.go('demo');
  },
  stopAttract() {
    this.attract = false;
    this.disposeRace();
    this.startBackdrop();
    Music.play('title');
    Input.lastInput = performance.now();
    UI.go('title');
  },
  showTouch() {
    if (!isTouchOnly || Input.padCount() > 0) return;
    document.getElementById('touch').classList.add('on');
  },
};

// ── Boot-time generated art (portraits, item icons, track thumbnails) ──
function makeArt(lite = false) {
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1);
  r.setSize(256, 256);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7aaa, 1.3));
  const dl = new THREE.DirectionalLight(0xffffff, 2.4); dl.position.set(3, 5, 4); scene.add(dl);
  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const cam = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
  const snap = (size) => { const c = document.createElement('canvas'); c.width = c.height = size; c.getContext('2d').drawImage(r.domElement, 0, 0, size, size); return c; };
  for (const ch of lite ? [] : CHARACTERS) {
    const m = buildKart(ch);
    m.root.rotation.y = -0.6;
    m.driver.head.rotation.y = 0.35;
    m.driver.arms[0].rotation.x = -2.4; m.driver.arms[0].rotation.z = 0.5;
    scene.add(m.root);
    cam.position.set(2.2, 2.4, 6.6); cam.lookAt(0, 1.05, 0);
    r.render(scene, cam);
    G.portraits[ch.id] = r.domElement.toDataURL('image/png');
    scene.remove(m.root);
  }
  G.itemIconURL = {};
  for (const id of ITEM_ORDER) {
    const g = new THREE.Group();
    const triple = id.endsWith('3');
    const base = triple ? id.slice(0, -1) : id;
    const n = triple ? 3 : 1;
    for (let i = 0; i < n; i++) {
      const m = buildItemModel(base);
      if (triple) { m.position.set((i - 1) * 0.75, i === 1 ? 0.25 : 0, i === 1 ? -0.3 : 0); m.scale.setScalar(0.62); }
      g.add(m);
    }
    if (id === 'fakebox') g.scale.setScalar(0.85);
    g.rotation.y = -0.5;
    scene.add(g);
    cam.position.set(0, 2.2, 4.4); cam.lookAt(0, 0.55, 0);
    r.render(scene, cam);
    G.itemIcons[id] = snap(128);
    G.itemIconURL[id] = r.domElement.toDataURL('image/png');
    scene.remove(g);
  }
  r.dispose();
  r.forceContextLoss();
  if (lite) return; // a session race needs only the item icons
  // Track thumbnails (2D)
  const THC = { meadow: ['#6ad462', '#3a9a4a'], beach: ['#2ccbe8', '#f4dca4'], desert: ['#f5b86f', '#c8643a'], snow: ['#e8f4ff', '#9fb6d6'], city: ['#2a1c5a', '#ff5fa8'], fortress: ['#4a0f12', '#ff6a1a'], spooky: ['#1d1538', '#5a7ad0'], rainbow: ['#0e0838', '#d46bff'], arena: ['#7ad86a', '#ffd23f'], plaza: ['#ff9ac8', '#ffe2b8'] };
  const thumb = (pts2, theme, closed = true, extra) => {
    const c = document.createElement('canvas'); c.width = 400; c.height = 230;
    const x = c.getContext('2d');
    const [a, b] = THC[theme];
    const gr = x.createLinearGradient(0, 0, 400, 230); gr.addColorStop(0, a); gr.addColorStop(1, b);
    x.fillStyle = gr; x.fillRect(0, 0, 400, 230);
    if (extra) extra(x);
    if (pts2) {
      let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
      for (const p of pts2) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); z0 = Math.min(z0, p[1]); z1 = Math.max(z1, p[1]); }
      const sc = Math.min(340 / (x1 - x0), 180 / (z1 - z0));
      const ox = 200 - ((x0 + x1) / 2) * sc, oz = 115 - ((z0 + z1) / 2) * sc;
      const path = () => { x.beginPath(); pts2.forEach((p, i) => (i ? x.lineTo(ox + p[0] * sc, oz + p[1] * sc) : x.moveTo(ox + p[0] * sc, oz + p[1] * sc))); if (closed) x.closePath(); };
      x.lineJoin = 'round'; x.lineCap = 'round';
      path(); x.strokeStyle = '#1b1030'; x.lineWidth = 20; x.stroke();
      path(); x.strokeStyle = '#ffffff'; x.lineWidth = 11; x.stroke();
      path(); x.strokeStyle = theme === 'rainbow' ? '#ffe14d' : '#ffd23f'; x.lineWidth = 3; x.setLineDash([10, 12]); x.stroke(); x.setLineDash([]);
      const p0 = pts2[0];
      x.fillStyle = '#1b1030'; x.fillRect(ox + p0[0] * sc - 9, oz + p0[1] * sc - 9, 18, 18);
      x.fillStyle = '#ff5d73'; x.fillRect(ox + p0[0] * sc - 6, oz + p0[1] * sc - 6, 12, 12);
    }
    return c.toDataURL('image/png');
  };
  for (const t of TRACKS) {
    const curve = new THREE.CatmullRomCurve3(t.pts.map((p) => new THREE.Vector3(p[0], 0, p[1])), true, 'centripetal');
    const pts = curve.getPoints(220).map((p) => [p.x, p.z]);
    G.trackThumbs[t.id] = thumb(pts, t.theme);
  }
  for (const a of ARENAS) {
    G.trackThumbs[a.id] = thumb(null, a.theme, true, (x) => {
      const sc = 1.25, ox = 200, oz = 115;
      x.strokeStyle = '#1b1030'; x.lineWidth = 6;
      x.fillStyle = 'rgba(255,255,255,0.55)';
      if (a.bound.type === 'ring') { x.beginPath(); x.arc(ox, oz, a.bound.r * sc, 0, TAU); x.fill(); x.stroke(); }
      else { x.fillRect(ox - a.bound.half * sc, oz - a.bound.half * sc, a.bound.half * 2 * sc, a.bound.half * 2 * sc); x.strokeRect(ox - a.bound.half * sc, oz - a.bound.half * sc, a.bound.half * 2 * sc, a.bound.half * 2 * sc); }
      for (const b of a.boxes) { x.fillStyle = b.color; x.fillRect(ox + b.x0 * sc, oz + b.z0 * sc, (b.x1 - b.x0) * sc, (b.z1 - b.z0) * sc); x.strokeRect(ox + b.x0 * sc, oz + b.z0 * sc, (b.x1 - b.x0) * sc, (b.z1 - b.z0) * sc); }
      for (const cy of a.cyls) { x.fillStyle = cy.color || '#ffd23f'; x.beginPath(); x.arc(ox + cy.x * sc, oz + cy.z * sc, cy.r * sc, 0, TAU); x.fill(); x.stroke(); }
    });
  }
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  G.width = w; G.height = h;
  G.dpr = Math.min(window.devicePixelRatio || 1, 2);
  G.renderer.setPixelRatio(G.dpr);
  G.renderer.setSize(w, h, false);
  G.hud.width = Math.round(w * G.dpr); G.hud.height = Math.round(h * G.dpr);
}

let lastT = performance.now(), mouseT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0.0001, (now - lastT) / 1000));
  lastT = now;
  G.time += dt;
  Input.poll(dt);
  const touch = document.getElementById('touch');
  if (touch.classList.contains('on') && (Input.padCount() > 0 || Input.pressed.size > 0)) touch.classList.remove('on');
  UI.update(dt);
  const R = G.renderer;
  App.felt = null;
  if (App.podium) { App.podium.update(dt); App.podium.render(R); HUD.draw(null, []); }
  else if (App.race) { App.race.update(dt); const views = App.race.render(R); HUD.draw(App.race, views); }
  else if (App.backdrop) { App.backdrop.update(dt); App.backdrop.render(R); HUD.draw(null, []); }
  else { R.setClearColor(0x2a1c4a, 1); R.clear(); HUD.draw(null, []); }
  if (App.race ? !App.race.paused : App.backdrop || App.podium) App.world += dt;
  Input.endFrame();
  mouseT += dt;
  document.body.classList.toggle('hidecursor', mouseT > 2.5 && !!App.race && !App.race.paused);
}

// For the AI Hub harness (AIHub.probe), in a session and on its own: where the game is, whether its settings or
// pause menu is open, a clock that runs with the world, and the local player's controls as read this frame
function probe() {
  const net = App.net, id = UI.cur && UI.cur.id;
  let scene;
  if (net) scene = net.ended ? 'over' : net.started && App.race ? 'play' : 'ready';
  else if (App.attract || id === 'title' || id === 'demo') scene = 'title';
  else if (App.race && (!id || ['race', 'pause', 'options', 'howto'].includes(id))) scene = 'play';
  else if (['results', 'standings', 'podium'].includes(id)) scene = 'over';
  else scene = 'menu';
  const c = App.felt || Input.drive('any'), n = (v) => Math.round(v * 100) / 100;
  return { scene, menu: App.menuOpen(), world: Math.round(App.world * 1000) / 1000, input: { steer: n(c.steer), gas: n(c.throttle), brake: n(c.brake), hop: !!c.hop, item: !!c.item } };
}

async function boot() {
  const bootMsg = document.getElementById('bootMsg');
  try {
    G.canvas = document.getElementById('gl');
    G.hud = document.getElementById('hud');
    G.hudCtx = G.hud.getContext('2d');
    const renderer = new THREE.WebGLRenderer({ canvas: G.canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    G.renderer = renderer;
    resize();
    addEventListener('resize', resize);
    addEventListener('mousemove', () => { mouseT = 0; });
    document.addEventListener('visibilitychange', () => { if (document.hidden && App.race && !App.attract && App.race.humans.length) App.pauseRace(null); });
    Toon.init();
    Input.init();
    UI.init();
    const info = SESSION ? await HubBoot.info : null;
    if (info) { await bootSession(info, bootMsg); return; }
    try { await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 2500))]); } catch (e) { /* fonts optional */ }
    bootMsg.textContent = 'Painting racers…';
    await new Promise((r) => setTimeout(r, 30));
    makeArt();
    bootMsg.textContent = 'Building the first track…';
    await new Promise((r) => setTimeout(r, 30));
    App.startBackdrop();
    document.getElementById('touchSettings').addEventListener('click', () => { document.getElementById('touch').classList.remove('on'); Sound.init(); UI.go('options', { from: 'touch' }); });
    UI.go('title');
    Music.play('title');
    App.showTouch();
    document.getElementById('boot').remove();
    AIHub.probe(probe);
    requestAnimationFrame(frame);
  } catch (err) {
    console.error(err);
    bootMsg.textContent = 'Could not start: ' + (err && err.message ? err.message : err) + ' — a WebGL2-capable browser is required.';
    if (SESSION) AIHub.fail('Could not start: ' + (err && err.message ? err.message : err));
  }
}
boot();
