      if (it.charges <= 0) kart.item = null;
      if (kart.isPlayer && !race.attract) race.banner = { text: "SPROUT", time: 0.7, kind: "boost" };
      cue("boost");
      return;
    }
    if (type === "comet") {
      kart.star = 6.4;
      kart.item = null;
      giveBoost(kart, 6.4, 1.16);
      if (kart.isPlayer && !race.attract) race.banner = { text: "COMET", time: 1.2, kind: "star" };
      cue("star");
      return;
    }
    if (type === "storm") {
      kart.item = null;
      doStorm(race, kart);
      return;
    }
    if (type === "wisp") {
      doWisp(race, kart);
      return;
    }
    if (type === "bunch" && !it.behind) {
      const n = it.charges || 3;
      for (let i = 0; i < n; i++) spawnFruit(race, kart, 2.1 + i * 1.65, (i - 1) * 1.15, false);
      kart.item = null;
      cue("item");
      return;
    }
    if (type === "blue") {
      spawnBlue(race, kart);
      kart.item = null;
      cue("item");
      return;
    }
    if (type === "green" || type === "red") {
      spawnShell(race, kart, type);
      kart.item = null;
      cue("item");
      return;
    }
    if (type === "fruit" || (type === "bunch" && it.behind)) {
      spawnFruit(race, kart, 1.6, 0, true);
      if (type === "bunch") {
        it.charges -= 1;
        it.behind = false;
        if (it.charges <= 0) kart.item = null;
      } else kart.item = null;
      cue("item");
      return;
    }
    if (type === "decoy") {
      spawnDecoy(race, kart);
      kart.item = null;
      cue("item");
    }
  }

  function holdItem(kart) {
    if (!kart.item || kart.spin > 0) return;
    const info = MK.ITEM_INFO[kart.item.type];
    if (!info || !info.trail) return;
    kart.item.behind = true;
  }

  function nearestGap(race, kart, dir) {
    const len = race.track.length;
    const p0 = progressOf(kart, len);
    let best = null;
    for (let i = 0; i < race.karts.length; i++) {
      const o = race.karts[i];
      if (o === kart) continue;
      const d = progressOf(o, len) - p0;
      if (dir > 0 && d <= 1) continue;
      if (dir < 0 && d >= -1) continue;
      const ad = Math.abs(d);
      const dist = Math.hypot(o.x - kart.x, o.z - kart.z);
      if (!best || ad < best.gap) best = { kart: o, gap: ad, dist: dist };
    }
    return best;
  }

  function aiControl(race, kart, dt) {
    const track = race.track;
    const len = track.length;
    const skill = kart.skill;
    const inp = { accel: true, brake: false, steer: 0, hop: false, use: false, hold: false };
    const look = 7 + skill * 14 + Math.max(0, kart.speed) * 0.42;
    const samp = MK.sampleAt(track, kart.s + look);
    const here = MK.sampleAt(track, kart.s);
    const ahead = MK.sampleAt(track, kart.s + 14);
    const cross = here.tx * ahead.tz - here.tz * ahead.tx;
    const inside = MK.clamp(cross * 8, -1, 1);
    const maxOff = Math.max(0.6, here.width * 0.22);
    const latTarget = MK.clamp(inside * (0.7 + skill * 0.9) + kart.lineBias * 0.12, -maxOff, maxOff);
    let tx = samp.x + samp.rx * latTarget;
    let tz = samp.z + samp.rz * latTarget;
    const phi = MK.headingFromDir(tx - kart.x, tz - kart.z);
    const diff = MK.wrapAngle(phi - kart.heading);
    /* heading decreases when steer > 0 (a right turn). diff > 0 means turn left. */
    let steer = Math.abs(diff) < 0.04 ? 0 : MK.clamp(diff / (race.attract ? -0.4 : -0.55), -1, 1);
    const edge = here.width * 0.5;
    if (Math.abs(kart.lat) > edge * 0.45) {
      const pull = MK.clamp(-kart.lat / edge, -1, 1);
      steer = MK.clamp(steer * 0.3 + pull, -1, 1);
    }
    for (let i = 0; i < race.hazards.length; i++) {
      const h = race.hazards[i];
      if (h.type !== "boulder" && h.type !== "sweeper" && h.type !== "block") continue;
      const ds = forwardDist(kart.s, h.s, len);
      if (ds > 0 && ds < 18) {
        const side = (h.latNow || 0) >= 0 ? -1 : 1;
        steer = MK.clamp(steer + side * 0.7 * (1 - ds / 18), -1, 1);
      }
    }
    steer = (kart.prevSteer || 0) * 0.3 + steer * 0.7;
    kart.prevSteer = steer;
    inp.steer = steer;
    const facing = MK.headingFromDir(here.tx, here.tz);
    const faceErr = MK.wrapAngle(facing - kart.heading);
    if (Math.abs(faceErr) > 1.15 && kart.speed < 10) inp.steer = MK.clamp(-faceErr / 0.45, -1, 1);
    if (kart.driftCd > 0) kart.driftCd -= dt;
    if (kart.aiDrift > 0) kart.aiDrift -= dt;
    const nearEdge = Math.abs(kart.lat) > here.width * 0.2;
    if (kart.drifting) {
      inp.hop = kart.driftCharge < 1.35 && Math.abs(diff) > 0.15;
    } else if (kart.aiDrift > 0 && !nearEdge) {
      inp.hop = true;
    } else if (!kart.air && !nearEdge && kart.driftCd <= 0 && Math.abs(diff) > 0.48 && kart.speed > 14 && (skill > 0.5 || race.attract)) {
      inp.hop = true;
      kart.aiDrift = 0.42;
      kart.driftCd = race.attract ? 0.85 : 1.5;
    }
    if (Math.abs(diff) > 1.05 && kart.speed > 22 && skill < 0.48 && !kart.drifting) {
      inp.accel = false;
      inp.brake = true;
    }
    if (kart.speed < 0) {
      inp.brake = false;
      inp.accel = true;
    }
    if (!kart.roulette && kart.item) {
      kart.itemCd = (kart.itemCd || 0) - dt;
      if (kart.itemCd <= 0) {
        const t = kart.item.type;
        const aheadK = nearestGap(race, kart, 1);
        const behindK = nearestGap(race, kart, -1);
        if (t === "sprout" || t === "sprouts") {
          if (kart.speed < kart.stats.top * kart.pace * 0.92 || (aheadK && aheadK.dist < 18)) {
            inp.use = true;
            kart.itemCd = 0.7;
          }
        } else if (t === "green" || t === "red" || t === "blue") {
          if (aheadK && aheadK.dist < 32 && aheadK.dist > 3) {
            inp.use = true;
            kart.itemCd = 1.1;
          } else if (behindK && behindK.dist < 8) {
            inp.hold = true;
            kart.itemCd = 0.4;
          }
        } else if (t === "fruit" || t === "bunch" || t === "decoy") {
          if (behindK && behindK.dist < 10) {
            inp.hold = true;
            kart.itemCd = 0.45;
          } else if (t === "bunch" || (aheadK && aheadK.dist < 16)) {
            inp.use = true;
            kart.itemCd = 0.9;
          }
        } else {
          inp.use = true;
          kart.itemCd = 0.8;
        }
      }
    } else if (kart.roulette) {
      const shown = kart.roulette.seq[kart.roulette.index];
      const tasty = shown === "storm" || shown === "blue" || shown === "comet" || shown === "sprouts" || shown === "wisp";
      if ((tasty && kart.roulette.index > 4 && Math.random() < skill * 0.25) || kart.roulette.index > 18) inp.use = true;
    }
    return inp;
  }

  function stepKart(race, kart, dt, inp) {
    const track = race.track;
    const len = track.length;
    const stats = kart.stats;
    const pace = kart.pace;
    if (kart.spin > 0) kart.spin -= dt;
    if (kart.spin < 0) kart.spin = 0;
    if (kart.invuln > 0) kart.invuln -= dt;
    if (kart.shrink > 0) kart.shrink -= dt;
    if (kart.phase > 0) kart.phase -= dt;
    if (kart.star > 0) kart.star -= dt;
    if (kart.boost > 0) {
      kart.boost -= dt;
      if (kart.boost <= 0) {
        kart.boost = 0;
        kart.boostMul = 1;
      }
    }
    if (kart.padKick > 0) kart.padKick -= dt;
    if (kart.hitFlash > 0) kart.hitFlash -= dt;

    const accelEdge = !!inp.accel && !kart.prevAccel;
    kart.prevAccel = !!inp.accel;
    const hopEdge = !!inp.hop && !kart.prevHop;
    kart.prevHop = !!inp.hop;
    let useEdge = !!inp.use && !kart.prevUse;
    kart.prevUse = !!inp.use;
    const holdEdge = !!inp.hold && !kart.prevHold;
    kart.prevHold = !!inp.hold;

    if (kart.roulette) {
      if (tickRoulette(kart, dt, useEdge)) useEdge = false;
    }
    if (kart.spin > 0) useEdge = false;
    if (useEdge && kart.item && !kart.roulette) useItem(race, kart);
    if (holdEdge && kart.item) holdItem(kart);

    const locked = kart.spin > 0;
    const steerInput = locked ? 0 : inp.steer || 0;
    const spFactor = MK.clamp(Math.abs(kart.speed) / (stats.top * pace + 0.01), 0, 1);
    const steerRate = stats.handle * (1.1 - 0.55 * spFactor) * (kart.shrink > 0 ? 1.12 : 1);
    if (!locked) {
      kart.heading = MK.wrapAngle(kart.heading - steerInput * steerRate * dt);
      if (kart.drifting) kart.heading = MK.wrapAngle(kart.heading - kart.driftSign * 0.22 * dt);
    }
    if (kart.drifting) {
      const vmag = Math.hypot(kart.vx, kart.vz);
      if (vmag > 4) {
        const vHead = MK.headingFromDir(kart.vx, kart.vz);
        const slip = MK.wrapAngle(kart.heading - vHead);
        const maxSlip = 0.62;
        if (Math.abs(slip) > maxSlip) kart.heading = MK.wrapAngle(vHead + Math.sign(slip) * maxSlip);
      }
    }

    if (kart.drifting) {
      if (kart.spin > 0) {
        kart.drifting = false;
        kart.driftCharge = 0;
      } else if (!inp.hop || Math.abs(steerInput) < 0.16) {
        const charge = kart.driftCharge;
        kart.drifting = false;
        kart.driftCharge = 0;
        if (charge > 1.5) {
          giveBoost(kart, 1.65, 1.4);
          if (kart.isPlayer && !race.attract) race.banner = { text: "BIG TURBO", time: 0.85, kind: "boost" };
          cue("boost");
        } else if (charge > 0.75) {
          giveBoost(kart, 0.74, 1.22);
          if (kart.isPlayer && !race.attract) race.banner = { text: "MINI TURBO", time: 0.75, kind: "boost" };
          cue("boost");
        }
      } else {
        kart.driftCharge = Math.min(2.25, kart.driftCharge + dt * (0.72 + Math.abs(steerInput) * 0.85));
      }
    }

    if (hopEdge && !kart.air && kart.support && kart.spin <= 0 && kart.speed > 7) {
      kart.air = true;
      kart.vy = 8.4;
      kart.hopFresh = true;
      kart.hopHeld = true;
    }
    if (!inp.hop) kart.hopHeld = false;

    let fwd = MK.headingForward(kart.heading);
    let right = MK.headingRight(kart.heading);
    let forwardSpeed = kart.vx * fwd.x + kart.vz * fwd.z;
    let lateralSpeed = kart.vx * right.x + kart.vz * right.z;
    if (kart.kick) {
      forwardSpeed += kart.kick;
      kart.kick = 0;
    }

    const surf = kart.surface;
    const offGrass = surf === "grass";
    const offSand = surf === "sand";
    const offMud = surf === "mud";
    let grip = 8.2;
    if (offGrass || offSand || offMud) grip = 2.8;
    if (kart.drifting) grip = 2.6;
    if (kart.air || !kart.support) grip = 0.32;
    if (kart.spin > 0) grip = 1.8;
    lateralSpeed *= Math.exp(-grip * dt);
    if (kart.drifting) lateralSpeed -= kart.driftSign * 2.4 * dt;

    let topSpeed = stats.top * pace;
    if (kart.boost > 0) topSpeed *= kart.boostMul || 1;
    if (kart.star > 0) topSpeed *= 1.18;
    if (kart.shrink > 0) topSpeed *= 0.68;
    if (kart.rubber) topSpeed *= 1 + kart.rubber;
    topSpeed = Math.min(topSpeed, stats.top * pace * 1.75);
    if (offGrass) topSpeed *= 0.54;
    if (offSand) topSpeed *= 0.46;
    if (offMud) topSpeed *= 0.58;

    let accel = 0;
    if (!locked) {
      if (inp.accel) accel += stats.accel * pace * (kart.shrink > 0 ? 0.8 : 1) * (kart.boost > 0 || kart.star > 0 ? 1.32 : 1);
      if (inp.brake) accel -= forwardSpeed > 1.4 ? 48 : 20;
    }
    let drag = stats.drag;
    if (offGrass) drag += 1.35;
    if (offSand) drag += 1.7;
    if (offMud) drag += 1.2;
    if (kart.boost > 0 || kart.star > 0) drag *= 0.42;
    forwardSpeed += accel * dt;
    forwardSpeed -= forwardSpeed * drag * dt;
    if (kart.spin > 0) forwardSpeed *= Math.exp(-3.4 * dt);
    if (kart.star > 0 && forwardSpeed < topSpeed * 0.8) forwardSpeed += stats.accel * pace * dt;
    if (forwardSpeed > topSpeed) {
      const bleed = offGrass || offSand || offMud ? 8 : 3.4;
      forwardSpeed -= (forwardSpeed - topSpeed) * Math.min(1, dt * bleed);
    }
    const revMax = 12 * pace;
    if (forwardSpeed < -revMax) forwardSpeed = -revMax;

    kart.speed = forwardSpeed;
    kart.vx = fwd.x * forwardSpeed + right.x * lateralSpeed;
    kart.vz = fwd.z * forwardSpeed + right.z * lateralSpeed;

    for (let i = 0; i < race.hazards.length; i++) {
      const h = race.hazards[i];
      if (h.type !== "gust") continue;
      if (kart.s >= h.s0 && kart.s <= h.s1) {
        const smpG = MK.sampleAt(track, kart.s);
        kart.vx += smpG.rx * h.sign * h.force * dt;
        kart.vz += smpG.rz * h.sign * h.force * dt;
      }
    }

    kart.x += kart.vx * dt;
    kart.z += kart.vz * dt;

    let pr = MK.project(track, kart.x, kart.y, kart.z, kart.s);
    let smp = pr.sample;
    let lat = pr.lat;
    const radius = kart.radius * (kart.shrink > 0 ? 0.68 : 1);
    kart.radiusNow = radius;
    if (smp.wall && Math.abs(lat) > smp.width * 0.5 - radius * 0.8) {
      const sign = Math.sign(lat) || 1;
      const limit = smp.width * 0.5 - radius * 0.8;
      const push = lat - sign * limit;
      kart.x -= smp.rx * push;
      kart.z -= smp.rz * push;
      lat = sign * limit;
      const outward = (kart.vx * smp.rx + kart.vz * smp.rz) * sign;
      if (outward > 0) {
        kart.vx -= smp.rx * outward * sign;
        kart.vz -= smp.rz * outward * sign;
        kart.speed = kart.vx * fwd.x + kart.vz * fwd.z;
        kart.speed *= 0.92;
      }
    }
    kart.s = pr.s;
    kart.lat = lat;
    /* A charged drift stays on the asphalt so the release can become a turbo. */
    const roadHalf = smp.width * 0.5;
    if (kart.drifting && !smp.wall && !smp.gap && Math.abs(lat) <= roadHalf + smp.shoulder) {
      const hold = roadHalf * 0.78;
      if (Math.abs(lat) > hold) {
        const sign = Math.sign(lat) || 1;
        const push = lat - sign * hold;
        kart.x -= smp.rx * push;
        kart.z -= smp.rz * push;
        lat = sign * hold;
        kart.lat = lat;
        const outward = (kart.vx * smp.rx + kart.vz * smp.rz) * sign;
        if (outward > 0) {
          kart.vx -= smp.rx * outward * sign;
          kart.vz -= smp.rz * outward * sign;
        }
      }
    }

    const half = smp.width * 0.5;
    const absLat = Math.abs(lat);
    let surface = smp.surface || "road";
    let support = true;
    if (smp.gap) {
      surface = "gap";
      support = false;
    } else if (absLat > half + smp.shoulder) {
      surface = "void";
      support = false;
    } else if (absLat > half) {
      surface = smp.shoulderKind || "grass";
      support = true;
    }
    kart.surface = surface;
    kart.support = support;

    if (race.attract && (!support || surface === "void" || surface === "gap")) {
      const back = MK.sampleAt(track, kart.s);
      kart.x = back.x + back.rx * MK.clamp(lat, -1.2, 1.2);
      kart.z = back.z + back.rz * MK.clamp(lat, -1.2, 1.2);
      kart.y = back.y;
      kart.air = false;
      kart.vy = 0;
      kart.support = true;
      kart.surface = back.surface || "road";
      support = true;
      surface = kart.surface;
    }

    const roadY = smp.y + smp.bank * MK.clamp(lat, -half, half);
    if (!support) {
      if (!kart.air) {
        kart.air = true;
        if (smp.lip || surface === "gap") kart.vy = Math.max(kart.vy, 11 + Math.max(0, kart.speed) * 0.06);
      }
      kart.vy -= 32 * dt;
      kart.y += kart.vy * dt;
      if (!race.attract && kart.y < roadY - 12) respawn(race, kart);
    } else if (kart.air) {
      kart.vy -= 32 * dt;
      kart.y += kart.vy * dt;
      if (kart.y <= roadY) {
        if (kart.y < roadY - 7 && !race.attract) respawn(race, kart);
        else {
          kart.y = roadY;
          kart.vy = 0;
          kart.air = false;
          if (kart.hopFresh && kart.hopHeld && Math.abs(steerInput) > 0.3 && kart.speed > 8 && kart.spin <= 0) {
            kart.drifting = true;
            kart.driftSign = Math.sign(steerInput) || 1;
            kart.driftCharge = 0;
          }
          kart.hopFresh = false;
        }
      }
    } else {
      kart.y = roadY;
      kart.vy = 0;
      kart.hopFresh = false;
    }

    if (kart.support && kart.surface !== "void" && kart.surface !== "gap" && !kart.air) kart.safeS = kart.s;

    if (kart.surface === "boost" && kart.support && !kart.air && kart.padKick <= 0 && kart.spin <= 0) {
      giveBoost(kart, 0.8, 1.26);
      kart.padKick = 0.95;
      if (kart.isPlayer && !race.attract) race.banner = { text: "BOOST", time: 0.55, kind: "boost" };
    }

    for (let i = 0; i < race.hazards.length; i++) {
      const h = race.hazards[i];
      if (h.type === "gust" || h.x == null) continue;
      const dx = kart.x - h.x;
      const dz = kart.z - h.z;
      const d = Math.hypot(dx, dz);
      const min = radius + h.radius;
      if (d < min && kart.star <= 0 && kart.phase <= 0) {
        const nx = d > 0.001 ? dx / d : 1;
        const nz = d > 0.001 ? dz / d : 0;
        kart.x += nx * (min - d + 0.02);
        kart.z += nz * (min - d + 0.02);
        if (kart.invuln <= 0 && Math.abs(kart.speed) > 8) spinKart(race, kart, h.type === "block" ? 0.48 : 0.7);
        kart.speed *= 0.45;
        syncSpeed(kart);
      }
    }

    const along = kart.vx * smp.tx + kart.vz * smp.tz;
    kart.wrong = race.phase === "racing" && along < -5;

    if (!kart.justRespawned && !kart.finished && race.phase === "racing") {
      const prev = kart.prevS;
      const now = kart.s;
      if (prev > len * 0.84 && now < len * 0.16 && along > 3) {
        kart.laps += 1;
        if (kart.laps >= 3 && !kart.finished) {
          kart.finished = true;
          race.finishCount += 1;
          kart.finishPlace = race.finishCount;
          if (kart.isPlayer && !race.attract) {
            race.banner = { text: placeWord(kart.finishPlace), time: 2.6, kind: "finish" };
            cue("lap");
          }
        } else if (kart.isPlayer && !race.attract && kart.laps === 2) {
          race.banner = { text: "FINAL LAP", time: 1.6, kind: "lap" };
          cue("lap");
        } else if (kart.isPlayer && !race.attract) {
          race.banner = { text: "LAP " + (kart.laps + 1) + " / 3", time: 1.05, kind: "lap" };
          cue("lap");
        }
      } else if (prev < len * 0.16 && now > len * 0.84 && kart.laps > 0) {
        kart.laps -= 1;
      }
    }
    kart.justRespawned = false;
    kart.prevS = kart.s;
    kart.steerVisual = steerInput;

    if (race.phase === "racing" && kart.spin <= 0 && Math.abs(kart.speed) < 1.3 && !kart.air) {
      kart.stuckT += dt;
      const limit = kart.isPlayer && !race.attract && !kart.ai ? 4.2 : 1.8;
      if (kart.stuckT > limit) {
        placeKart(kart, track, kart.s, 0);
        kart.speed = 16 * kart.pace;
        const f2 = MK.headingForward(kart.heading);
        kart.vx = f2.x * kart.speed;
        kart.vz = f2.z * kart.speed;
        kart.stuckT = 0;
        kart.justRespawned = true;
        if (kart.isPlayer && !race.attract) race.banner = { text: "NUDGED FORWARD", time: 0.7, kind: "info" };
      }
    } else if (Math.abs(kart.speed) >= 1.3) kart.stuckT = 0;

    /* Rocket edges are read by the countdown block via prevAccel. Stash the edge. */
    kart._accelEdge = accelEdge;
  }

  function updateHazards(race, time) {
    for (let i = 0; i < race.hazards.length; i++) {
      const h = race.hazards[i];
      if (h.type !== "boulder" && h.type !== "sweeper" && h.type !== "block") continue;
      const smp = MK.sampleAt(race.track, h.s);
      let lat = h.lat || 0;
      if (h.type !== "block") {
        const span = Math.max(1.2, smp.width * 0.5 - h.radius - 0.25);
        lat = Math.sin((time / h.period) * Math.PI * 2 + (h.phase || 0)) * span;
      }
      h.latNow = lat;
      h.x = smp.x + smp.rx * lat;
      h.y = smp.y + (h.type === "boulder" ? 1.15 : 0.8);
      h.z = smp.z + smp.rz * lat;
    }
  }

  function separateKarts(race) {
    const karts = race.karts;
    for (let i = 0; i < karts.length; i++) {
      for (let j = i + 1; j < karts.length; j++) {
        const a = karts[i];
        const b = karts[j];
        if (a.phase > 0 || b.phase > 0) continue;
        let dx = b.x - a.x;
        let dz = b.z - a.z;
        let d = Math.hypot(dx, dz);
        const min = (a.radiusNow || a.radius) + (b.radiusNow || b.radius);
        if (d >= min) continue;
        if (d < 0.0008) {
          dx = 1;
          dz = 0;
          d = 1;
        }
        const nx = dx / d;
        const nz = dz / d;
        const pen = min - d;
        const inv = 1 / (a.mass + b.mass);
        a.x -= nx * pen * (b.mass * inv);
        a.z -= nz * pen * (b.mass * inv);
        b.x += nx * pen * (a.mass * inv);
        b.z += nz * pen * (a.mass * inv);
        if (a.star > 0 && b.star <= 0) {
          spinKart(race, b, 0.75);
          b.vx += nx * 20;
          b.vz += nz * 20;
        } else if (b.star > 0 && a.star <= 0) {
          spinKart(race, a, 0.75);
          a.vx -= nx * 20;
          a.vz -= nz * 20;
        } else {
          const push = 6;
          a.vx -= nx * push * (b.mass * inv);
          a.vz -= nz * push * (b.mass * inv);
          b.vx += nx * push * (a.mass * inv);
          b.vz += nz * push * (a.mass * inv);
        }
      }
    }
  }

  function updateShields(race) {
    for (let i = 0; i < race.karts.length; i++) {
      const kart = race.karts[i];
      if (!kart.item || !kart.item.behind) {
        kart.shieldX = null;
        continue;
      }
      const tp = trailPos(kart);
      kart.shieldX = tp.x;
      kart.shieldY = tp.y;
      kart.shieldZ = tp.z;
      for (let j = 0; j < race.karts.length; j++) {
        const o = race.karts[j];
        if (o === kart || o.phase > 0 || o.star > 0 || o.invuln > 0) continue;
        const dx = o.x - tp.x;
        const dz = o.z - tp.z;
        const rad = 1.25 + (o.radiusNow || o.radius);
        if (dx * dx + dz * dz < rad * rad) {
          consumeShield(kart);
          spinKart(race, o, 0.95);
          break;
        }
      }
    }
  }

  function hitThing(race, thing, kart, radius) {
    if (kart.id === thing.owner && thing.age < (thing.arm || 0)) return false;
    if (thing.hit[kart.id]) return false;
    if (kart.phase > 0 || kart.star > 0 || kart.invuln > 0) return false;
    const dx = kart.x - thing.x;
    const dz = kart.z - thing.z;
    const rad = radius + (kart.radiusNow || kart.radius);
    if (dx * dx + dz * dz > rad * rad) return false;
    thing.hit[kart.id] = true;
    if (shieldBlocks(kart, thing.x, thing.z)) {
      consumeShield(kart);
      if (thing.kind !== "blue") thing.life = 0;
      return true;
    }
    spinKart(race, kart, thing.kind === "decoy" ? 1.2 : thing.kind === "blue" ? 0.95 : 1.02);
    if (thing.kind !== "blue") thing.life = 0;
    return true;
  }

  function blockedByShield(race, thing) {
    for (let k = 0; k < race.karts.length; k++) {
      const kart = race.karts[k];
      if (kart.id === thing.owner && thing.age < (thing.arm || 0)) continue;
      if (thing.hit[kart.id]) continue;
      if (!shieldBlocks(kart, thing.x, thing.z)) continue;
      consumeShield(kart);
      thing.hit[kart.id] = true;
      if (thing.kind !== "blue") thing.life = 0;
      return true;
    }
    return false;
  }

  function updateThings(race, dt) {
    const track = race.track;
    const len = track.length;
    const pace = race.classDef.pace;
    for (let i = 0; i < race.things.length; i++) {
      const thing = race.things[i];
      thing.age += dt;
      thing.life -= dt;
      if (thing.kind === "green" || thing.kind === "red") {
        if (thing.kind === "red") {
          let target = null;
          let bestD = 1e9;
          for (let k = 0; k < race.karts.length; k++) {
            const kart = race.karts[k];
            if (kart.id === thing.owner && thing.age < 0.4) continue;
            const d = forwardDist(thing.s || 0, kart.s, len);
            if (d > 1.5 && d < bestD) {
              bestD = d;
              target = kart;
            }
          }
          if (target) {
            const dx = target.x - thing.x;
            const dz = target.z - thing.z;
            const mag = Math.hypot(dx, dz) || 1;
            const sp = 44 * pace;
            const wx = (dx / mag) * sp;
            const wz = (dz / mag) * sp;
            const blend = 1 - Math.exp(-dt * 4.2);
            thing.vx += (wx - thing.vx) * blend;
            thing.vz += (wz - thing.vz) * blend;
          }
        }
        thing.x += thing.vx * dt;
        thing.z += thing.vz * dt;
        const pr = MK.project(track, thing.x, thing.y || 0, thing.z, thing.s);
        thing.s = pr.s;
        thing.y = pr.sample.y + 0.55;
        const smp = pr.sample;
        if (smp.wall && Math.abs(pr.lat) > smp.width * 0.5 - 0.15) {
          const sign = Math.sign(pr.lat) || 1;
          const nx = smp.rx * sign;
          const nz = smp.rz * sign;
          const dot = thing.vx * nx + thing.vz * nz;
          if (dot > 0) {
            thing.vx -= 2 * dot * nx;
            thing.vz -= 2 * dot * nz;
          }
          const limit = smp.width * 0.5 - 0.35;
          thing.x = smp.x + smp.rx * sign * limit;
          thing.z = smp.z + smp.rz * sign * limit;
        } else if (!smp.wall && Math.abs(pr.lat) > smp.width * 0.5 + smp.shoulder + 0.4) {
          thing.life = 0;
        }
        if (thing.life > 0 && !blockedByShield(race, thing)) {
          for (let k = 0; k < race.karts.length && thing.life > 0; k++) hitThing(race, thing, race.karts[k], 1.15);
        }
      } else if (thing.kind === "blue") {
        const sp = 72 * pace;
        thing.s = MK.wrapS(thing.s + sp * dt, len);
        thing.traveled += sp * dt;
        const smp = MK.sampleAt(track, thing.s);
        thing.x = smp.x;
        thing.y = smp.y + 2.55;
        thing.z = smp.z;
        if (!blockedByShield(race, thing)) {
          for (let k = 0; k < race.karts.length; k++) hitThing(race, thing, race.karts[k], 1.7);
        }
        if (race.order && race.order.length && thing.traveled > 16) {
          const leader = race.order[0];
          const d = forwardDist(thing.s, leader.s, len);
          if (d < 5.5) {
            race.booms.push({ x: leader.x, y: leader.y + 1.4, z: leader.z, life: 0.7, kind: "crown" });
            for (let k = 0; k < race.karts.length; k++) {
              const kart = race.karts[k];
              const near = kart === leader || Math.hypot(kart.x - leader.x, kart.z - leader.z) < 6.5;
              if (!near || thing.hit[kart.id]) continue;
              thing.hit[kart.id] = true;
              if (kart.phase > 0 || kart.star > 0) continue;
              if (shieldBlocks(kart, thing.x, thing.z)) consumeShield(kart);
              else spinKart(race, kart, 1.15);
            }
            if (!race.attract) race.banner = { text: "CROWN SHELL", time: 1.3, kind: "hit" };
            thing.life = 0;
            cue("hit");
          }
        }
      } else if (thing.kind === "fruit" || thing.kind === "decoy") {
        if (!thing.settled) {
          thing.x += thing.vx * dt;
          thing.z += thing.vz * dt;
          thing.vx *= Math.exp(-dt * 2.4);
          thing.vz *= Math.exp(-dt * 2.4);
          if (thing.vx * thing.vx + thing.vz * thing.vz < 6) thing.settled = true;
        }
        const pr = MK.project(track, thing.x, thing.y || 0, thing.z, null);
        thing.y = pr.sample.y + (thing.kind === "decoy" ? 0.85 : 0.4);
        thing.s = pr.s;
        if (Math.abs(pr.lat) > pr.sample.width * 0.5 + pr.sample.shoulder + 3) thing.life = 0;
        const rad = thing.kind === "decoy" ? 1.45 : 1.05;
        if (thing.life > 0 && !blockedByShield(race, thing)) {
          for (let k = 0; k < race.karts.length && thing.life > 0; k++) hitThing(race, thing, race.karts[k], rad);
        }
      }
    }
    race.things = race.things.filter(function (t) { return t.life > 0; });
    if (race.things.length > 40) race.things.splice(0, race.things.length - 40);
    for (let i = race.booms.length - 1; i >= 0; i--) {
      race.booms[i].life -= dt;
      if (race.booms[i].life <= 0) race.booms.splice(i, 1);
    }
  }

  function updateBoxes(race, dt) {
    for (let i = 0; i < race.boxes.length; i++) {
      const b = race.boxes[i];
      if (b.alive) continue;
      b.respawn -= dt;
      if (b.respawn <= 0) b.alive = true;
    }
    for (let k = 0; k < race.karts.length; k++) {
      const kart = race.karts[k];
      if (kart.item || kart.roulette || kart.spin > 0) continue;
      for (let i = 0; i < race.boxes.length; i++) {
        const b = race.boxes[i];
        if (!b.alive) continue;
        const smp = MK.sampleAt(race.track, b.s);
        const dx = kart.x - smp.x;
        const dz = kart.z - smp.z;
        if (dx * dx + dz * dz < 2.4 * 2.4 && Math.abs(kart.y - smp.y) < 3.2) {
          b.alive = false;
          b.respawn = 5;
          startRoulette(kart);
          break;
        }
      }
    }
  }

  function rank(race) {
    const len = race.track.length;
    const list = race.karts.slice();
    list.sort(function (a, b) {
      if (a.finished && b.finished) return a.finishPlace - b.finishPlace;
      if (a.finished) return -1;
      if (b.finished) return 1;
      return progressOf(b, len) - progressOf(a, len);
    });
    race.order = list;
    for (let i = 0; i < list.length; i++) {
      list[i].place = i + 1;
      list[i].progress = progressOf(list[i], len);
    }
  }

  function applyRubber(race) {
    const len = race.track.length;
    if (race.attract) {
      let sum = 0;
      for (let i = 0; i < race.karts.length; i++) sum += progressOf(race.karts[i], len);
      const mid = sum / race.karts.length;
      for (let i = 0; i < race.karts.length; i++) {
        const gap = mid - progressOf(race.karts[i], len);
        race.karts[i].rubber = MK.clamp(gap / 80, -0.2, 0.45);
      }
      return;
    }
    const pp = progressOf(race.player, len);
    for (let i = 0; i < race.karts.length; i++) {
      const kart = race.karts[i];
      if (!kart.ai) {
        kart.rubber = 0;
        continue;
      }
      const gap = pp - progressOf(kart, len);
      if (gap > 16) kart.rubber = Math.min(0.18, (gap - 16) / 210);
      else if (gap < -48) kart.rubber = -Math.min(0.09, (-gap - 48) / 260);
      else kart.rubber = 0;
    }
  }

  function attractDirector(race, dt) {
    race.showT += dt;
    while (race.showEvents.length && race.showEvents[0].t <= race.showT) {
      const ev = race.showEvents.shift();
      const kart = race.karts[ev.slot % race.karts.length];
      kart.roulette = null;
      kart.item = makeItem(ev.type);
      if (ev.act === "hold") kart.item.behind = true;
      else useItem(race, kart);
    }
    const slot = Math.floor(race.showT / 8) % race.karts.length;
    race.camKart = race.karts[slot];
    if (race.showT > 50) race.attractDone = true;
  }

  function blank() {
    return { accel: false, brake: false, steer: 0, hop: false, use: false, hold: false };
  }

  function gridOrder(playerDriver, standings) {
    const order = [0, 1, 2, 3, 4, 5, 6, 7];
    if (standings) {
      order.sort(function (a, b) {
        const ds = (standings[b] || 0) - (standings[a] || 0);
        if (ds) return ds;
        return a - b;
      });
      return order;
    }
    const rest = order.filter(function (i) { return i !== playerDriver; });
    rest.splice(Math.min(4, rest.length), 0, playerDriver);
    return rest;
  }

  function createKart(race, driverIndex, slot, isPlayer) {
    const driver = MK.DRIVERS[driverIndex];
    const stats = MK.WEIGHT[driver.weight];
    const kart = {
      id: slot,
      driver: driverIndex,
      ai: !isPlayer || !!race.attract,
      isPlayer: isPlayer,
      skill: race.attract ? 1 : isPlayer ? 0 : race.classDef.ai * (0.84 + ((driverIndex * 37) % 10) / 45),
      lineBias: ((driverIndex * 13) % 7) - 3,
      stats: stats,
      mass: stats.mass,
      radius: stats.radius,
      pace: race.classDef.pace,
      laps: 0,
      finished: false,
      finishPlace: 0,
      resultPlace: 0,
      points: 0,
      place: slot + 1,
      progress: 0,
      item: null,
      roulette: null,
      boost: 0,
      boostMul: 1,
      kick: 0,
      star: 0,
      shrink: 0,
      phase: 0,
      spin: 0,
      invuln: 0,
      air: false,
      support: true,
      surface: "road",
      vy: 0,
      drifting: false,
      driftSign: 1,
      driftCharge: 0,
      hopFresh: false,
      hopHeld: false,
      prevHop: false,
      prevUse: false,
      prevHold: false,
      prevAccel: false,
      prevSteer: 0,
      aiDrift: 0,
      driftCd: 0,
      itemCd: 0,
      stuckT: 0,
      padKick: 0,
      rubber: 0,
      hitFlash: 0,
      wrong: false,
      justRespawned: false,
      rocketArm: false,
      earlyAccel: false,
      rocketChecked: false,
      shieldX: null,
      speed: 0,
      vx: 0,
      vz: 0,
    };
    return kart;
  }

  MK.placeWord = placeWord;
  MK.placeKart = placeKart;
  MK.rollItem = rollItem;

  MK.chaseDesired = function (kart, heading, dist, height) {
    const f = MK.headingForward(heading);
    return {
      x: kart.x - f.x * dist,
      y: kart.y + height,
      z: kart.z - f.z * dist,
      lookX: kart.x + f.x * 5.5,
      lookY: kart.y + 1.25,
      lookZ: kart.z + f.z * 5.5,
    };
  };

  MK.createCup = function (opts) {
    return {
      classId: opts.classId,
      playerDriver: opts.playerDriver,
      scores: [0, 0, 0, 0, 0, 0, 0, 0],
      raceIndex: 0,
      history: [],
    };
  };

  MK.createRace = function (opts) {
    const classDef = MK.classById(opts.classId || "piston");
    const countdown = opts.countdown == null ? 3 : opts.countdown;
    const race = {
      track: opts.track,
      classDef: classDef,
      classId: classDef.id,
      attract: !!opts.attract,
      phase: countdown <= 0 ? "racing" : "countdown",
      countdownDur: countdown,
      elapsed: 0,
      time: 0,
      banner: null,
      things: [],
      booms: [],
      stormFlash: 0,
      finishWait: 0,
      finishCount: 0,
      results: null,
      showT: 0,
      attractDone: false,
      showEvents: opts.attract ? [
        { t: 2.0, slot: 1, type: "green", act: "use" },
        { t: 4.4, slot: 2, type: "red", act: "use" },
        { t: 6.6, slot: 3, type: "fruit", act: "hold" },
        { t: 8.4, slot: 5, type: "bunch", act: "use" },
        { t: 10.6, slot: 4, type: "decoy", act: "use" },
        { t: 12.8, slot: 0, type: "sprout", act: "use" },
        { t: 15.2, slot: 6, type: "sprouts", act: "use" },
        { t: 17.8, slot: 0, type: "comet", act: "use" },
        { t: 24.5, slot: 7, type: "storm", act: "use" },
        { t: 28.0, slot: 2, type: "wisp", act: "use" },
        { t: 31.5, slot: 4, type: "blue", act: "use" },
        { t: 36.0, slot: 1, type: "green", act: "use" },
        { t: 39.0, slot: 0, type: "sprout", act: "use" },
        { t: 42.5, slot: 3, type: "red", act: "hold" },
        { t: 46.0, slot: 5, type: "fruit", act: "use" },
      ] : [],
      boxes: opts.track.boxes.map(function (b) { return { s: b.s, alive: true, respawn: 0 }; }),
      hazards: opts.track.hazards.map(function (h) {
        return {
          type: h.type, s: h.s, s0: h.s0, s1: h.s1, lat: h.lat, radius: h.radius,
          period: h.period, force: h.force, sign: h.sign, phase: h.phase, latNow: h.lat || 0,
        };
      }),
    };
    const order = gridOrder(opts.playerDriver, opts.standings || null);
    race.karts = [];
    for (let i = 0; i < order.length; i++) {
      const isPlayer = order[i] === opts.playerDriver;
      const kart = createKart(race, order[i], i, isPlayer);
      const row = Math.floor(i / 2);
      const col = i % 2;
      /* Just past the line, pole furthest ahead, so the first return counts as lap 1. */
      const s = 30 - row * 4.6;
      const lat = col === 0 ? -1.7 : 1.7;
      placeKart(kart, opts.track, s, lat);
      kart.progress = progressOf(kart, opts.track.length);
      race.karts.push(kart);
      if (isPlayer) race.player = kart;
    }
    race.camKart = race.player;
    rank(race);
    return race;
  };

  MK.finishRace = function (race) {
    if (!race || race.phase === "done") return;
    const len = race.track.length;
    const pending = race.karts.filter(function (k) { return !k.finished; });
    pending.sort(function (a, b) { return progressOf(b, len) - progressOf(a, len); });
    for (let i = 0; i < pending.length; i++) {
      race.finishCount += 1;
      pending[i].finished = true;
      pending[i].finishPlace = race.finishCount;
    }
    const ordered = race.karts.slice().sort(function (a, b) { return a.finishPlace - b.finishPlace; });
    for (let i = 0; i < ordered.length; i++) {
      ordered[i].resultPlace = i + 1;
      ordered[i].points = MK.POINTS[i];
    }
    race.results = ordered;
    race.phase = "done";
    rank(race);
  };

  MK.awardCup = function (cup, race) {
    if (!race.results) MK.finishRace(race);
    for (let i = 0; i < race.results.length; i++) {
      const k = race.results[i];
      cup.scores[k.driver] += k.points;
    }
    cup.history.push(race.results.map(function (k) {
      return { driver: k.driver, place: k.resultPlace, points: k.points };
    }));
    cup.raceIndex += 1;
  };

  MK.standings = function (cup) {
    const last = cup.history.length ? cup.history[cup.history.length - 1] : null;
    function lastPlace(driver) {
      if (!last) return 99;
      for (let i = 0; i < last.length; i++) if (last[i].driver === driver) return last[i].place;
      return 99;
    }
    const rows = [];
    for (let i = 0; i < 8; i++) rows.push({ driver: i, points: cup.scores[i], name: MK.DRIVERS[i].name, species: MK.DRIVERS[i].species, color: MK.DRIVERS[i].color });
    rows.sort(function (a, b) {
      if (b.points !== a.points) return b.points - a.points;
      return lastPlace(a.driver) - lastPlace(b.driver);
    });
    return rows;
  };

  MK.updateRace = function (race, dt, input) {
    if (!race || race.phase === "done") return race;
    dt = MK.clamp(dt, 0, 0.05);
    race.time += dt;
    if (race.banner) {
      race.banner.time -= dt;
      if (race.banner.time <= 0) race.banner = null;
    }
    if (race.stormFlash > 0) race.stormFlash -= dt;

    if (race.phase === "countdown") {
      race.elapsed += dt;
      const windowStart = Math.max(0, race.countdownDur - 0.45);
      const player = race.player;
      if (!race.attract && input && player) {
        const accel = !!input.accel;
        const edge = accel && !player.prevAccel;
        player.prevAccel = accel;
        if (edge && race.elapsed < windowStart) player.earlyAccel = true;
        if (edge && race.elapsed >= windowStart && race.elapsed < race.countdownDur) player.rocketArm = true;
        if (input.steer) {
          player.heading = MK.wrapAngle(player.heading - input.steer * 1.4 * dt);
          const smp = MK.sampleAt(race.track, player.s);
          const f = MK.headingForward(player.heading);
          /* Keep the nose free, but don't let a spin face them off the grid. */
          void f;
          void smp;
        }
      }
      for (let i = 0; i < race.karts.length; i++) {
        const kart = race.karts[i];
        if (kart === player && !race.attract) continue;
        if (!kart.rocketChecked && race.elapsed >= windowStart && race.elapsed < race.countdownDur) {
          kart.rocketChecked = true;
          if (race.attract || Math.random() < kart.skill * 0.9) kart.rocketArm = true;
        }
      }
      if (race.elapsed >= race.countdownDur) {
        race.phase = "racing";
        for (let i = 0; i < race.karts.length; i++) {
          const kart = race.karts[i];
          if (kart.rocketArm) {
            giveBoost(kart, 1.28, 1.34);
            if (kart.isPlayer && !race.attract) race.banner = { text: "ROCKET START", time: 1.3, kind: "boost" };
            if (kart.isPlayer) cue("rocket");
          } else if (kart.isPlayer && kart.earlyAccel && !race.attract) {
            race.banner = { text: "TOO EARLY", time: 1.1, kind: "info" };
          }
        }
      } else {
        rank(race);
        race.camKart = race.attract ? race.karts[0] : race.player;
        return race;
      }
    }

    applyRubber(race);
    updateHazards(race, race.time);
    const deferredUse = [];
    for (let i = 0; i < race.karts.length; i++) {
      const kart = race.karts[i];
      let inp;
      const human = kart.isPlayer && !race.attract && !kart.ai;
      if (human) {
        inp = input || blank();
        if (race.phase !== "racing") inp = blank();
      } else {
        inp = aiControl(race, kart, dt);
        /* Player items resolve first, so a wisp still finds what rivals are holding. */
        deferredUse.push({ kart: kart, use: !!inp.use, hold: !!inp.hold });

    }
    if (s === "between") {
      if (state.cup.raceIndex >= 4) { state.screen = "standings"; state.focus = 0; MK.ui.invalidate(); }
      else startRaceAt(state.cup.raceIndex);
      return;
    }
    if (s === "standings") {
      state.cup = null;
      state.race = null;
      go("title");
    }
  }

  function back() {
    const s = state.screen;
    if (s === "driver") go("title");
    else if (s === "class") go("driver");
    else if (s === "brief") go("class");
    else if (s === "controls" || s === "about" || s === "settings") {
      if (s === "settings") saveSettings();
      go(state.returnTo || "title");
    } else if (s === "pause") {
      state.paused = false;
      state.screen = "race";
      MK.ui.invalidate();
    }
  }

  function nudgeSettings(dir) {
    const s = state.settings;
    if (state.focus === 0) s.music = cycle(["off", "low", "high"], s.music, dir);
    else if (state.focus === 1) s.sfx = cycle(["off", "low", "high"], s.sfx, dir);
    else if (state.focus === 2) s.cam = cycle(["near", "classic", "far"], s.cam, dir);
    else if (state.focus === 3) s.invert = !s.invert;
    else if (state.focus === 4) s.rumble = !s.rumble;
    applyMix();
    MK.ui.invalidate();
  }

  function settingsKey() {
    const s = state.settings;
    return [s.music, s.sfx, s.cam, s.invert, s.rumble].join();
  }

  let last = performance.now();
  let rumbleLatch = false;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000) || 0;
    last = now;
    const touch = isTouch();
    if (!state.booted) {
      state.booted = true;
      if (touch) state.screen = "gate";
    } else if (touch && state.screen === "title" && !state.attract) {
      state.screen = "gate";
    } else if (!touch && state.screen === "gate") {
      go("title");
    }

    const inp = MK.input.poll(state.settings.invert);
    if (inp.fresh || inp.activity) MK.audio.resume();

    if (state.attract && MK.shouldExitAttract(inp)) {
      stopAttract();
      requestAnimationFrame(frame);
      return;
    }

    const menu = !!MENU[state.screen] || state.paused || state.screen === "between" || state.screen === "standings" || state.screen === "pause" || state.screen === "gate";
    if (!state.attract && menu && state.screen !== "race") {
      if (!inp.activity && !inp.fresh) state.idle += dt;
      else state.idle = 0;
      if (state.idle > 10 && MENU[state.screen] && state.screen !== "gate") startAttract();
    }

    if (!state.attract && state.screen !== "race") {
      if (inp.pointer.click) {
        const hit = MK.ui.rowAt(inp.pointer.x, inp.pointer.y);
        if (hit != null && !isNaN(hit)) {
          state.focus = hit;
          confirm();
        }
      } else if (inp.navY > 0) state.focus = Math.min(rowCount() - 1, state.focus + inp.navY);
      else if (inp.navY < 0) state.focus = Math.max(0, state.focus + inp.navY);
      if (state.screen === "driver" && inp.navX) {
        state.driver = (state.driver + inp.navX + MK.DRIVERS.length) % MK.DRIVERS.length;
        MK.audio.cue("ui");
      } else if (state.screen === "class" && inp.navX) {
        const ids = MK.CLASSES.map(function (c) { return c.id; });
        state.classId = cycle(ids, state.classId, inp.navX > 0 ? 1 : -1);
        state.focus = ids.indexOf(state.classId);
        MK.audio.cue("ui");
      } else if (state.screen === "class" && inp.navY) {
        const ids = MK.CLASSES.map(function (c) { return c.id; });
        state.classId = ids[MK.clamp(state.focus, 0, 2)];
      } else if (state.screen === "settings" && inp.navX) nudgeSettings(inp.navX > 0 ? 1 : -1);
      if (inp.confirmEdge) confirm();
      else if (inp.backEdge || inp.pauseEdge) back();
    } else if (state.screen === "race" && state.paused) {
      if (inp.navY > 0) state.focus = Math.min(3, state.focus + inp.navY);
      else if (inp.navY < 0) state.focus = Math.max(0, state.focus + inp.navY);
      if (inp.confirmEdge) confirm();
      else if (inp.backEdge || inp.pauseEdge) back();
    } else if (state.screen === "race" && state.race && !state.attract) {
      if (inp.pauseEdge) {
        state.paused = true;
        state.screen = "pause";
        state.focus = 0;
        MK.ui.invalidate();
      } else {
        MK.updateRace(state.race, dt, {
          accel: inp.accel, brake: inp.brake, steer: inp.steer,
          hop: inp.hop, use: inp.use, hold: inp.hold,
        });
        if (state.race.player && state.race.player.finished && inp.confirmEdge) MK.finishRace(state.race);
        if (state.race.phase === "done") finishToBoard();
        const flash = state.race.player && state.race.player.hitFlash > 0.35;
        if (flash && !rumbleLatch && state.settings.rumble) MK.input.rumble(140, 0.6, 0.3);
        rumbleLatch = flash;
      }
    } else if (state.attract && state.race) {
      MK.updateRace(state.race, dt, null);
      if (state.race.attractDone || state.race.phase === "done") {
        state.attractTrack = (state.attractTrack + 1) % state.tracks.length;
        state.race = MK.createRace({
          track: state.tracks[state.attractTrack],
          classId: "turbine",
          playerDriver: state.attractTrack % 8,
          countdown: 1.1,
          attract: true,
        });
      }
    }

    if (state.screen === "between") {
      state.idle = 0;
    }

    const preview = { title: 1, driver: 1, class: 1, brief: 1, gate: 1 };
    const viewMode = state.race && !preview[state.screen] ? "race" : "show";
    MK.render.draw({
      mode: viewMode,
      race: state.race,
      driver: state.driver,
      settings: state.settings,
    }, dt);
    const speed = state.screen === "race" && state.race && !state.paused ? state.race.player.speed : null;
    MK.audio.tick(state.attract ? (state.race && state.race.camKart ? state.race.camKart.speed : 20) : speed);
    state.settingsKey = settingsKey();
    MK.ui.paint(state);
    requestAnimationFrame(frame);
  }

  function boot() {
    loadSettings();
    state.tracks = MK.buildTracks();
    MK.ui.mount();
    const canvas = document.getElementById("view");
    const ok = MK.render.init(canvas);
    if (!ok) {
      document.getElementById("ui").insertAdjacentHTML("beforeend", '<div class="panel stack" style="position:absolute;left:4vmin;bottom:4vmin">3D view failed to start. Reload with WebGL available.</div>');
    }
    applyMix();
    MK.ui.paint(state);
    requestAnimationFrame(frame);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
</html>
