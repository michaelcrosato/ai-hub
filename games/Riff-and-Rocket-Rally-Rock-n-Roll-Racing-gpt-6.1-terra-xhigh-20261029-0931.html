function aiControls(c){let p=c.body.translation(),a=Math.atan2(p.x/RX,-p.z/RZ),target=point(a+.20,c.aiLane),desired=Math.atan2(target.x-p.x,target.z-p.z),diff=Math.atan2(Math.sin(desired-c.yaw),Math.cos(desired-c.yaw));return {steer:clamp(diff*2.5,-1,1),gas:true,brake:false,fire:Math.random()<.012,mine:Math.random()<.001,boost:Math.abs(diff)<.22&&Math.random()<.02}}
function stepCar(c,dt){if(c.finished)return;c.fireCd-=dt;c.mineCd-=dt;c.invuln-=dt;let input=c.human?controls(c):aiControls(c);if(screen==='settings')input={steer:0,gas:false,brake:false,fire:false,mine:false,boost:false};let p=c.body.translation(),rad=Math.sqrt((p.x/RX)**2+(p.z/RZ)**2),off=Math.abs(rad-1)>.20;let max=off?8:16;if(input.boost&&c.boost>1&&input.gas){max=22;c.boost=Math.max(0,c.boost-22*dt);if(Math.random()<.25){let m=mesh(new THREE.BoxGeometry(.25,.25,.25),mat(0x5ff9ff),p.x-Math.sin(c.yaw)*2,.5,p.z-Math.cos(c.yaw)*2);sparks.push({mesh:m,vx:0,vz:0,vy:0,life:.25})}}else c.boost=Math.min(100,c.boost+4*dt);let target=input.gas?max:input.brake?-4:0;c.speed=lerp(c.speed,target,Math.min(1,dt*(input.brake?3:1.1)));c.yaw+=input.steer*dt*1.9*clamp(Math.abs(c.speed)/5,0,1)*(c.speed<0?-1:1);let vel=c.body.linvel(),dx=Math.sin(c.yaw),dz=Math.cos(c.yaw),blend=Math.min(1,dt*4);c.body.setLinvel({x:lerp(vel.x,dx*c.speed,blend),y:0,z:lerp(vel.z,dz*c.speed,blend)},true);if(input.fire)fire(c);if(input.mine)dropMine(c);let a=Math.atan2(p.x/RX,-p.z/RZ),delta=Math.atan2(Math.sin(a-c.lastAngle),Math.cos(a-c.lastAngle));if(Math.abs(delta)<.3&&Math.abs(rad-1)<.45)c.progress+=delta;c.lastAngle=a;c.lap=clamp(Math.floor(Math.max(0,c.progress)/(Math.PI*2))+1,1,LAPS);if(c.progress>=Math.PI*2*LAPS){c.finished=true;c.finishTime=race.time;c.score+=Math.max(0,2500-c.rank*300);if(c.i===0&&!race.attract)finishRace()}}
function updateObjects(dt){for(let b of [...bullets]){b.life-=dt;b.x+=b.vx*dt;b.z+=b.vz*dt;b.mesh.position.set(b.x,1,b.z);let victim=cars.find(c=>c!==b.owner&&c.invuln<=0&&Math.hypot(c.body.translation().x-b.x,c.body.translation().z-b.z)<1.5);if(victim){hit(victim,35,b.owner);b.life=0}if(b.life<=0){scene.remove(b.mesh);bullets.splice(bullets.indexOf(b),1)}}for(let m of [...mines]){m.life-=dt;m.arm-=dt;m.mesh.rotation.y+=dt*2;let victim=m.arm<=0&&cars.find(c=>c!==m.owner&&c.invuln<=0&&Math.hypot(c.body.translation().x-m.x,c.body.translation().z-m.z)<1.8);if(victim){hit(victim,45,m.owner);m.life=0}if(m.life<=0){scene.remove(m.mesh);mines.splice(mines.indexOf(m),1)}}for(let p of pickups){p.t-=dt;p.mesh.rotation.y+=dt*2;p.mesh.position.y=1+Math.sin(gameTime*3)*.2;p.mesh.visible=p.t<=0;if(p.t<=0){let c=cars.find(c=>Math.hypot(c.body.translation().x-p.x,c.body.translation().z-p.z)<1.7);if(c){p.t=12;if(p.type===0)c.hp=Math.min(100,c.hp+40);if(p.type===1){c.ammo=Math.min(12,c.ammo+3);c.mine=Math.min(5,c.mine+1)}if(p.type===2)c.boost=100;if(c.i===0)message(['HULL PATCHED!','AMMO LOADED!','BOOST JUICED!'][p.type],1.2);sound(660,.15,'triangle',.07,1.5)}}}for(let s of [...sparks]){s.life-=dt;s.mesh.position.x+=s.vx*dt;s.mesh.position.z+=s.vz*dt;s.mesh.position.y+=s.vy*dt;s.vy-=9*dt;s.mesh.scale.setScalar(Math.max(.01,s.life));if(s.life<=0){scene.remove(s.mesh);sparks.splice(sparks.indexOf(s),1)}}}
function finishRace(){if(race.over)return;race.over=true;let c=cars[0];if(AIHub.active)AIHub.result({score:Math.round(c.score+Math.max(0,1200-race.time*5)),stats:{place:c.rank,takedowns:c.kills}});screen='results';shade.classList.remove('play');panel.style.display='block';hud.style.display='none';selected=0;let rankings=[...cars].sort((a,b)=>b.progress-a.progress);makeMenu('Finish line!',`<p><b>${ordinal(c.rank)} PLACE</b> · ${race.time.toFixed(1)} seconds · ${c.kills} takedowns</p><p>${c.rank===1?'You rocked the road!':'The crowd wants an encore. Get back out there!'}</p><div class="list">${rankings.map((r,i)=>`<div class="row"><strong>${ordinal(i+1)}</strong> &nbsp; ${r.i===0?'YOU':localTwo&&r.i===1?'PLAYER 2':names[r.i]} ${r.finished?'· FINISHED':`· LAP ${r.lap}`}</div>`).join('')}</div>`,AIHub.active?[]:[['Race again',()=>garage(localTwo)],['Main menu',title]]);if(AIHub.active)panel.insertAdjacentHTML('beforeend','<p class="hint">WAITING FOR THE HUB</p>')}
function updateHUD(){let c=cars[0],ranking=[...cars].sort((a,b)=>b.progress-a.progress);ranking.forEach((v,i)=>v.rank=i+1);$('position').textContent=ordinal(c.rank);$('lap').textContent=`${c.lap} / ${LAPS}`;$('health').textContent=Math.ceil(c.hp);$('healthbar').style.width=c.hp+'%';$('ammo').textContent=c.ammo;$('mines').textContent=c.mine;$('boost').textContent=Math.ceil(c.boost);$('boostbar').style.width=c.boost+'%';$('callout').textContent=race.countdown>0?Math.ceil(race.countdown):race.msgTime>0?race.msg:'';$('ticker').textContent=localTwo?'P2: WASD · F FIRE · G MINE · Q BOOST':`✕ GAS  ·  □ ROCKET  ·  ○ MINE  ·  △ BOOST     ${race.time.toFixed(1)} SEC`;if(AIHub.active)AIHub.progress({score:Math.round(c.progress*100+c.score),label:`Lap ${c.lap} / ${LAPS}`})}
function handlePad(){let p=getPad(0);if(!p)return;let btn=n=>!!p.buttons[n]?.pressed,edge=n=>btn(n)&&!padPrev[n];if(race?.attract&&(p.buttons.some(b=>b.pressed)||p.axes.some(a=>Math.abs(a)>.35))){title();padPrev=Array.from({length:16},(_,i)=>btn(i));return}if(screen==='title'&&(p.buttons.some(b=>b.pressed)||p.axes.some(a=>Math.abs(a)>.35)))lastInput=performance.now();let axis=p.axes[1]||0;if(settings.invertY)axis=-axis;let up=edge(12)||(axis<-.6&&!padPrev[100]),down=edge(13)||(axis>.6&&!padPrev[101]);if(btn(8)&&btn(9)){}else if(edge(9)){lastInput=performance.now();if(screen==='settings')closeSettings();else openSettings(screen)}if(screen!=='play'){if(up||down){lastInput=performance.now();selected=(selected+(down?1:-1)+menuActions.length)%Math.max(1,menuActions.length);highlight();sound(220,.04,'square',.03)}if(edge(0))activate();if(edge(1)){if(screen==='settings')closeSettings();else if(screen!=='title')title()}}else if(race?.attract&&p.buttons.some(b=>b.pressed)){title()}padPrev=Array.from({length:16},(_,i)=>btn(i));padPrev[100]=axis<-.6;padPrev[101]=axis>.6}
window.addEventListener('keydown',e=>{keys[e.code]=true;lastInput=performance.now();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','ShiftLeft'].includes(e.code))e.preventDefault();if(e.repeat)return;if(race?.attract){title();return}if(e.code==='Escape'){if(screen==='settings')closeSettings();else openSettings(screen);return}if(screen!=='play'){if(e.code==='ArrowUp'||e.code==='KeyW'){selected=(selected-1+menuActions.length)%Math.max(1,menuActions.length);highlight()}if(e.code==='ArrowDown'||e.code==='KeyS'){selected=(selected+1)%Math.max(1,menuActions.length);highlight()}if(e.code==='Enter'||e.code==='Space')activate();if(e.code==='Backspace'){if(screen==='settings')closeSettings();else title()}}});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('pointerdown',()=>{lastInput=performance.now();unlockAudio();if(race?.attract)title()});$('touchSettings').onclick=()=>{ $('touch').style.display='none';openSettings('title') };
function resize(){if(!renderer)return;renderer.setSize(innerWidth,innerHeight);let aspect=innerWidth/innerHeight;camera.left=-31*aspect;camera.right=31*aspect;camera.top=31;camera.bottom=-31;camera.updateProjectionMatrix()}
async function frame(now){let dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;handlePad();if(screen==='title'&&!AIHub.active&&now-lastInput>10000)startRace(true);if(race&&!hubStopped&&(screen==='play'||(screen==='settings'&&AIHub.active))){if(AIHub.active&&AIHub.time()<0){}else if(race.countdown>0){race.countdown-=dt}else if(!race.over){gameTime+=dt;race.time+=dt;for(let c of cars)stepCar(c,dt);world.timestep=dt;world.step();updateObjects(dt);race.msgTime-=dt;if(race.attract&&race.time>100){startRace(true)}}if(race&&!race.over){updateHUD();for(let c of cars){let p=c.body.translation();c.mesh.position.set(p.x,0,p.z);c.mesh.rotation.y=c.yaw;c.mesh.visible=c.invuln<=0||Math.floor(c.invuln*10)%2===0}}}music(dt);await renderer.renderAsync(scene,camera);requestAnimationFrame(frame)}
AIHub.probe(()=>({scene:screen==='play'?'play':screen==='results'?'over':screen==='title'?'title':screen==='settings'?'menu':'menu',menu:screen==='settings',world:race?.time||0,input:lastProbe}));
async function init(){try{if(!navigator.gpu)throw Error('WebGPU is unavailable. Use a WebGPU-capable browser and device.');let adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('No WebGPU adapter was found.');await RAPIER.init();renderer=new THREE.WebGPURenderer({antialias:true});await renderer.init();if(!renderer.backend.isWebGPUBackend)throw Error('WebGPU initialization failed. This game requires WebGPU.');$('game').appendChild(renderer.domElement);buildWorld();resize();window.addEventListener('resize',resize);title();if(touchOnly)$('touch').style.display='grid';if(AIHub.active){let info=await AIHub.connect({mode:'parallel',seats:[1,4]});if(info){localTwo=false;startRace(false);AIHub.on('time-up',()=>{if(!race.over)finishRace()});AIHub.on('end',()=>{hubStopped=true;if(audio)audio.suspend()});AIHub.ready()}}requestAnimationFrame(frame)}catch(e){console.error(e);AIHub.fail(e.message);panel.innerHTML=`<div class="eyebrow">Engine unavailable</div><div class="screenTitle">Can't start the show</div><div class="copy"></div>`;panel.querySelector('.copy').textContent=e.message;shade.classList.remove('play')}}
init();
</script>
