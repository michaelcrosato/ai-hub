    // 3. Check if near a Carryable Item (Pot, Barrel, Coconut Bomb, Plank, Key) -> PICK IT UP!
    let nearestItem = null;
    let nearestItemDist = 1.9;
    for (const ci of this.carryItems) {
      if (ci.removed || ci.carriedBy !== null || ci.thrown) continue;
      const d = Math.hypot(ci.x - p.x, ci.z - p.z);
      if (d < nearestItemDist) {
        nearestItemDist = d;
        nearestItem = ci;
      }
    }

    if (nearestItem) {
      this.pickupCarryItem(p, nearestItem);
      return;
    }

    // 4. Even if nothing is right in front, do a snappy boot kick swing!
    p.kickAnimTimer = 0.25;
    this.sound.sfx('throw');
  }

  kickStarBlock(sb, kx, kz, player) {
    if (sb.sliding || sb.removed) return;
    const speed = 16.5 * (player?.charDef?.kickSpeedMul || 1.0);
    sb.vx = kx * speed;
    sb.vz = kz * speed;
    sb.sliding = true;
    sb.kickedBy = player ? player.id : 0;

    if (player) {
      player.kickAnimTimer = 0.32;
      player.yaw = Math.atan2(kx, kz);
      player.stats.blocksKicked++;
      player.score += 25;
    }

    this.sound.sfx('kickBlock');
    this.spawnBurst(sb.x, 0.4, sb.z, 0xfbbf24, 8);

    if (this.net && !this.net.isHost) {
      this.net.send({ t: 'act', kind: 'kick', id: sb.id, kx, kz });
    }
  }

  pickupCarryItem(p, ci) {
    p.carryingId = ci.id;
    ci.carriedBy = p.id;
    ci.thrown = false;
    if (ci.kind === 'bomb') ci.fuseTimer = 3.2; // generous timer while held
    if (ci.mesh && p.mesh?.userData?.parts?.carryMount) {
      p.mesh.userData.parts.carryMount.add(ci.mesh);
      ci.mesh.position.set(0, 0, 0);
    }
    this.sound.sfx('pickup');
  }

  // ---- Goof Troop 2-Slot Utility Tool Belt ----
  useEquippedTool(p) {
    const toolId = p.tools[p.activeToolSlot] || 'hookshot';

    if (toolId === 'hookshot') {
      // Fire Grapple Hookshot!
      p.hookTimer = 0.36;
      this.sound.sfx('hookshot');
      const dirX = Math.sin(p.yaw);
      const dirZ = Math.cos(p.yaw);

      // Check if ray hits a Hookshot Anchor Post across a chasm
      for (const hp of this.hookPosts) {
        const toX = hp.x - p.x;
        const toZ = hp.z - p.z;
        const dist = Math.hypot(toX, toZ);
        if (dist > 1.2 && dist < 12.5) {
          const dotProd = (toX / dist) * dirX + (toZ / dist) * dirZ;
          if (dotProd > 0.72) {
            p.hookTarget = { x: hp.x, z: hp.z };
            p.hookTimer = 0.55;
            p.score += 40;
            this.spawnBurst(hp.x, 1.2, hp.z, 0xfacc15, 10);
            return;
          }
        }
      }

      // Check if Hookshot hits a Pirate or Captain Cragbeard -> Stun them!
      for (const en of this.enemies) {
        if (en.dead) continue;
        const toX = en.x - p.x;
        const toZ = en.z - p.z;
        const dist = Math.hypot(toX, toZ);
        if (dist < 9.5) {
          const dotProd = (toX / Math.max(0.01, dist)) * dirX + (toZ / Math.max(0.01, dist)) * dirZ;
          if (dotProd > 0.68) {
            en.stunTimer = 3.0;
            en.whirlwindTimer = 0;
            p.score += 60;
            this.sound.sfx('enemyStun');
            this.spawnBurst(en.x, 1.0, en.z, 0xfacc15, 10);
            return;
          }
        }
      }

      // Check if Hookshot snatches a Carryable Key/Item or Collectible
      for (const ci of this.carryItems) {
        if (ci.removed || ci.carriedBy !== null) continue;
        const toX = ci.x - p.x;
        const toZ = ci.z - p.z;
        const dist = Math.hypot(toX, toZ);
        if (dist < 10.0 && (toX / dist) * dirX + (toZ / dist) * dirZ > 0.7) {
          if (!p.carryingId) {
            this.pickupCarryItem(p, ci);
            return;
          }
        }
      }
    } else if (toolId === 'shovel') {
      // Dig X-Marks-The-Spot!
      this.sound.sfx('shovel');
      p.kickAnimTimer = 0.25;
      for (const ds of this.digSpots) {
        if (!ds.dug && Math.hypot(ds.x - p.x, ds.z - p.z) < 2.4) {
          ds.dug = true;
          if (ds.mesh) ds.mesh.visible = false;
          this.spawnBurst(ds.x, 0.3, ds.z, 0xd97706, 14);
          this.sound.sfx('switchOn');
          p.score += 120;
          if (ds.reward === 'key' || ds.reward === 'bossKey') {
            this.spawnCarryItem({ id: 'dug_' + ds.id, x: ds.x, z: ds.z, kind: ds.reward });
          } else {
            this.spawnCollectible({ id: 'dug_' + ds.id, x: ds.x, z: ds.z, kind: 'gem' });
          }
          return;
        }
      }
    } else if (toolId === 'plank') {
      // Build a Plank Bridge over a bridgeable chasm!
      for (const ch of this.chasms) {
        if (ch.bridgeable && !ch.bridged && Math.hypot(ch.x - p.x, ch.z - p.z) < 4.5) {
          ch.bridged = true;
          if (ch.bridgeMesh) ch.bridgeMesh.visible = true;
          this.sound.sfx('switchOn');
          this.spawnBurst(ch.x, 0.3, ch.z, 0xfacc15, 14);
          p.score += 150;
          return;
        }
      }
      this.sound.sfx('throw');
    } else if (toolId === 'lantern') {
      // Light nearby Skull Braziers!
      this.sound.sfx('lantern');
      this.spawnBurst(p.x, 1.2, p.z, 0xf97316, 10);
      for (const brz of this.braziers) {
        if (!brz.lit && Math.hypot(brz.x - p.x, brz.z - p.z) < 3.2) {
          brz.lit = true;
          if (brz.mesh?.userData?.flame) brz.mesh.userData.flame.visible = true;
          this.sound.sfx('switchOn');
          p.score += 120;
        }
      }
    } else if (toolId === 'bell') {
      // Ring Pirate Decoy Bell to lure Spiked Ironclads into Star-Block lanes!
      this.sound.sfx('bell');
      this.decoyBellTarget = { x: p.x, z: p.z, until: performance.now() + 5000 };
      this.spawnBurst(p.x, 1.4, p.z, 0xfde047, 14);
    }
  }

  toggleBuddyCommand(p) {
    this.buddyStayMode = !this.buddyStayMode;
    // Snap Buddy target to nearest Co-op Switch if one is close, otherwise current spot
    let target = { x: p.x, z: p.z };
    for (const sw of this.switches) {
      if (sw.kind === 'coop' && Math.hypot(sw.x - p.x, sw.z - p.z) < 6.0) {
        target = { x: sw.x, z: sw.z };
        break;
      }
    }
    this.buddyStayPos = target;
    this.sound.sfx('bell');
    this.queueDialogue([
      {
        speaker: 'kip',
        name: 'Cpl. Kip',
        text: this.buddyStayMode
          ? 'Roger that, Cap’n! I’ll hold this spot / switch right here!'
          : 'On your six, Cap’n Barnaby! Let’s roll!'
      }
    ]);
  }

  // ---- Sliding Star-Blocks & 45-Degree Bumper Deflection Logic ----
  updateStarBlocks(dt, isAuthoritative) {
    for (const sb of this.starBlocks) {
      if (sb.removed) continue;
      if (!sb.sliding) {
        if (sb.mesh) sb.mesh.position.set(sb.x, 0, sb.z);
        continue;
      }

      const nextX = sb.x + sb.vx * dt;
      const nextZ = sb.z + sb.vz * dt;

      // 1. Check 45-Degree Angled Bumpers!
      for (const bmp of this.bumpers) {
        if (Math.hypot(nextX - bmp.x, nextZ - bmp.z) < 0.72) {
          sb.x = bmp.x;
          sb.z = bmp.z;
          const speed = Math.hypot(sb.vx, sb.vz);
          if (bmp.deflect === 'N_TO_E') {
            if (sb.vz < 0) { sb.vx = speed; sb.vz = 0; }
            else if (sb.vx < 0) { sb.vx = 0; sb.vz = speed; }
          } else if (bmp.deflect === 'N_TO_W') {
            if (sb.vz < 0) { sb.vx = -speed; sb.vz = 0; }
            else if (sb.vx > 0) { sb.vx = 0; sb.vz = speed; }
          }
          // Step slightly out of bumper so it doesn't re-trigger
          sb.x += Math.sign(sb.vx) * 0.75;
          sb.z += Math.sign(sb.vz) * 0.75;
          this.sound.sfx('bumperHit');
          this.spawnBurst(bmp.x, 0.8, bmp.z, 0x38bdf8, 12);
          break;
        }
      }

      // 2. Check Pirate Enemy & Boss Collisions (Bowls them over!)
      for (const en of this.enemies) {
        if (en.dead) continue;
        if (Math.hypot(nextX - en.x, nextZ - en.z) < (en.type === 'boss' ? 1.85 : 1.35)) {
          const kicker = this.players.find((p) => p.id === sb.kickedBy) || this.players[0];
          if (en.type === 'boss') {
            en.hp -= sb.isBomb ? 3 : 2;
            en.stunTimer = 2.0;
            this.sound.sfx(sb.isBomb ? 'explode' : 'enemyKO');
            this.triggerCameraShake(0.35, 0.35);
            this.spawnBurst(en.x, 1.2, en.z, 0xef4444, 20);
            if (kicker) kicker.score += 300;
            // Remove block after hitting boss so new ones drop
            sb.removed = true;
            if (sb.mesh) sb.mesh.visible = false;
            if (en.hp <= 0) {
              this.killEnemy(en, kicker);
            }
            break;
          } else {
            this.killEnemy(en, kicker);
            if (sb.isBomb) {
              this.explodeAt(sb.x, sb.z, sb.kickedBy);
              sb.removed = true;
              if (sb.mesh) sb.mesh.visible = false;
              break;
            }
          }
        }
      }
      if (sb.removed) continue;

      // 3. Friendly-Fire Slapstick Bonk on Co-op Partner!
      for (const p of this.players) {
        if (p.gone || p.id === sb.kickedBy || p.stunTimer > 0) continue;
        if (Math.hypot(nextX - p.x, nextZ - p.z) < 1.05) {
          p.stunTimer = 1.1;
          this.sound.sfx('playerHit');
          this.spawnBurst(p.x, 1.2, p.z, 0xfacc15, 10);
        }
      }

      // 4. Check if reaching a Star Switch or hitting an obstacle / stopper / wall
      let hitObstacle = false;
      const halfW = this.stageDef.bounds.w / 2 - 1.5;
      const halfD = this.stageDef.bounds.d / 2 - 1.5;
      if (nextX < -halfW || nextX > halfW || nextZ < -halfD || nextZ > halfD) {
        hitObstacle = true;
      }

      for (const w of this.walls) {
        if (Math.abs(nextX - w.x) < w.w / 2 + 0.72 && Math.abs(nextZ - w.z) < w.d / 2 + 0.72) {
          hitObstacle = true;
          break;
        }
      }
      for (const bs of this.blockStoppers) {
        if (Math.hypot(nextX - bs.x, nextZ - bs.z) < 1.1) {
          hitObstacle = true;
          break;
        }
      }
      for (const ch of this.chasms) {
        if (!ch.bridged && Math.abs(nextX - ch.x) < ch.w / 2 + 0.4 && Math.abs(nextZ - ch.z) < ch.d / 2 + 0.4) {
          hitObstacle = true;
          break;
        }
      }
      for (const other of this.starBlocks) {
        if (other !== sb && !other.removed && Math.hypot(nextX - other.x, nextZ - other.z) < 1.45) {
          hitObstacle = true;
          break;
        }
      }

      // Also check if crossing directly onto an unactivated Star Switch
      for (const sw of this.switches) {
        if (sw.kind === 'star' && !sw.active && Math.hypot(nextX - sw.x, nextZ - sw.z) < 0.85) {
          sb.x = sw.x;
          sb.z = sw.z;
          hitObstacle = true;
          break;
        }
      }

      if (hitObstacle) {
        sb.vx = 0;
        sb.vz = 0;
        sb.sliding = false;
        // Snap to clean 2-unit grid or nearest Star Switch
        sb.x = Math.round(sb.x / 2) * 2;
        sb.z = Math.round(sb.z / 2) * 2;
        for (const sw of this.switches) {
          if (sw.kind === 'star' && Math.hypot(sb.x - sw.x, sb.z - sw.z) < 1.35) {
            sb.x = sw.x;
            sb.z = sw.z;
          }
        }
        this.sound.sfx('blockStop');
        this.triggerCameraShake(0.12, 0.12);
      } else {
        sb.x = nextX;
        sb.z = nextZ;
      }

      if (sb.body) sb.body.setNextKinematicTranslation({ x: sb.x, y: 0.8, z: sb.z });
      if (sb.mesh) sb.mesh.position.set(sb.x, 0, sb.z);
    }
  }

  // ---- Update Carryable & Thrown Props ----
  updateCarryItems(dt, isAuthoritative) {
    for (const ci of this.carryItems) {
      if (ci.removed) continue;

      // Bomb fuse countdown
      if (ci.kind === 'bomb' && ci.fuseTimer > 0) {
        ci.fuseTimer -= dt;
        if (ci.mesh?.userData?.spark) {
          const s = 1 + Math.sin(performance.now() * 0.04) * 0.4;
          ci.mesh.userData.spark.scale.set(s, s, s);
        }
        if (ci.fuseTimer <= 0) {
          // Drop from carrier if still held
          const holder = this.players.find((p) => p.id === ci.carriedBy);
          if (holder) holder.carryingId = null;
          if (ci.mesh && this.stageRoot) this.stageRoot.attach(ci.mesh);
          this.explodeAt(ci.x, ci.z, ci.thrownBy ?? ci.carriedBy);
          ci.removed = true;
          if (ci.mesh) ci.mesh.visible = false;
          continue;
        }
      }

      if (ci.carriedBy !== null) {
        const holder = this.players.find((p) => p.id === ci.carriedBy);
        if (holder && !holder.gone) {
          ci.x = holder.x;
          ci.z = holder.z;
          // Auto-unlock gate if carrying Key / BossKey near locked gate!
          if (ci.kind === 'key' || ci.kind === 'bossKey') {
            for (const g of this.gates) {
              if (g.requiresKey && !g.keyInserted && Math.hypot(g.x - holder.x, g.z - holder.z) < 3.4) {
                g.keyInserted = true;
                if (g.lockMesh) g.lockMesh.visible = false;
                holder.carryingId = null;
                ci.removed = true;
                if (ci.mesh) ci.mesh.visible = false;
                this.sound.sfx('gateOpen');
                this.spawnBurst(g.x, 1.4, g.z, 0xfacc15, 18);
                holder.score += 200;
              }
            }
          }
          // Auto-lay Bridge Plank if walking up to a bridgeable chasm!
          if (ci.kind === 'plank') {
            for (const ch of this.chasms) {
              if (ch.bridgeable && !ch.bridged && Math.hypot(ch.x - holder.x, ch.z - holder.z) < 3.6) {
                ch.bridged = true;
                if (ch.bridgeMesh) ch.bridgeMesh.visible = true;
                holder.carryingId = null;
                ci.removed = true;
                if (ci.mesh) ci.mesh.visible = false;
                this.sound.sfx('switchOn');
                this.spawnBurst(ch.x, 0.3, ch.z, 0xfacc15, 16);
                holder.score += 150;
              }
            }
          }
        }
        continue;
      }

      if (ci.thrown) {
        ci.x += ci.vx * dt;
        ci.y += ci.vy * dt;
        ci.z += ci.vz * dt;
        ci.vy -= 18.0 * dt;

        if (ci.mesh) {
          ci.mesh.position.set(ci.x, Math.max(0, ci.y), ci.z);
          ci.mesh.rotation.x += dt * 10;
        }

        // Check if thrown Key hits locked gate
        if (ci.kind === 'key' || ci.kind === 'bossKey') {
          for (const g of this.gates) {
            if (g.requiresKey && !g.keyInserted && Math.hypot(g.x - ci.x, g.z - ci.z) < 3.2) {
              g.keyInserted = true;
              if (g.lockMesh) g.lockMesh.visible = false;
              ci.removed = true;
              if (ci.mesh) ci.mesh.visible = false;
              this.sound.sfx('gateOpen');
              this.spawnBurst(g.x, 1.4, g.z, 0xfacc15, 18);
              break;
            }
          }
        }

        // Check if thrown Plank lands near bridgeable chasm
        if (ci.kind === 'plank') {
          for (const ch of this.chasms) {
            if (ch.bridgeable && !ch.bridged && Math.hypot(ch.x - ci.x, ch.z - ci.z) < 3.8) {
              ch.bridged = true;
              if (ch.bridgeMesh) ch.bridgeMesh.visible = true;
              ci.removed = true;
              if (ci.mesh) ci.mesh.visible = false;
              this.sound.sfx('switchOn');
              this.spawnBurst(ch.x, 0.3, ch.z, 0xfacc15, 16);
              break;
            }
          }
        }

        // Check enemy hits
        for (const en of this.enemies) {
          if (en.dead) continue;
          if (Math.hypot(ci.x - en.x, ci.z - en.z) < (en.type === 'boss' ? 1.7 : 1.25)) {
            if (ci.kind === 'bomb') {
              this.explodeAt(ci.x, ci.z, ci.thrownBy);
              ci.removed = true;
              if (ci.mesh) ci.mesh.visible = false;
            } else if (ci.kind === 'pot' || ci.kind === 'barrel') {
              const thrower = this.players.find((p) => p.id === ci.thrownBy) || this.players[0];
              if (en.type === 'ironclad') {
                // Spiked Ironclad bounces pots off its armor!
                en.stunTimer = 0.8;
                this.sound.sfx('bumperHit');
              } else {
                en.hp -= 1;
                en.stunTimer = 2.4;
                if (en.hp <= 0) this.killEnemy(en, thrower);
                else this.sound.sfx('enemyStun');
              }
              this.sound.sfx('potSmash');
              this.spawnBurst(ci.x, 0.8, ci.z, 0xea580c, 12);
              if (ci.kind === 'pot') {
                ci.removed = true;
                if (ci.mesh) ci.mesh.visible = false;
              } else {
                ci.thrown = false;
                ci.y = 0;
                if (ci.mesh) ci.mesh.rotation.set(0, 0, 0);
              }
            }
            break;
          }
        }

        // Ground landing
        if (!ci.removed && ci.y <= 0) {
          ci.y = 0;
          ci.vx = 0;
          ci.vy = 0;
          ci.vz = 0;
          ci.thrown = false;
          if (ci.mesh) {
            ci.mesh.position.set(ci.x, 0, ci.z);
            ci.mesh.rotation.set(0, 0, 0);
          }
          if (ci.kind === 'pot') {
            this.sound.sfx('potSmash');
            this.spawnBurst(ci.x, 0.5, ci.z, 0xc2410c, 10);
            ci.removed = true;
            if (ci.mesh) ci.mesh.visible = false;
          } else if (ci.kind === 'bomb') {
            this.explodeAt(ci.x, ci.z, ci.thrownBy);
            ci.removed = true;
            if (ci.mesh) ci.mesh.visible = false;
          }
        }
      }
    }
  }

  explodeAt(x, z, sourcePlayerId = 0) {
    this.sound.sfx('explode');
    this.triggerCameraShake(0.32, 0.35);
    this.spawnBurst(x, 0.8, z, 0xf97316, 22);
    const attacker = this.players.find((p) => p.id === sourcePlayerId) || this.players[0];

    // Blast cracked cave walls!
    for (const cw of this.crackedWalls) {
      if (!cw.broken && Math.hypot(cw.x - x, cw.z - z) < 3.6) {
        cw.broken = true;
        if (cw.mesh) cw.mesh.visible = false;
        this.sound.sfx('gateOpen');
        this.spawnBurst(cw.x, 1.2, cw.z, 0xfacc15, 18);
        if (attacker) attacker.score += 200;
        if (cw.reward === 'gem') {
          this.spawnCollectible({ id: 'cw_gem_' + cw.id, x: cw.x, z: cw.z, kind: 'gem' });
        }
      }
    }

    // Damage enemies in blast radius (including Spiked Ironclads & Captain Cragbeard!)
    for (const en of this.enemies) {
      if (en.dead) continue;
      if (Math.hypot(en.x - x, en.z - z) < 3.6) {
        en.hp -= 3;
        en.stunTimer = 2.5;
        if (en.hp <= 0) this.killEnemy(en, attacker);
      }
    }
  }

  // ---- Collectibles & Tool Pickups ----
  updateCollectibles(now, dt) {
    for (const col of this.collectibles) {
      if (col.taken) continue;
      if (col.mesh) {
        col.mesh.rotation.y += dt * 2.4;
        col.mesh.position.y = Math.sin(now * 0.004 + col.x) * 0.12;
      }

      for (const p of this.players) {
        if (p.gone) continue;
        if (Math.hypot(col.x - p.x, col.z - p.z) < 1.45) {
          col.taken = true;
          if (col.mesh) col.mesh.visible = false;

          if (col.kind === 'tool' && col.toolId) {
            if (!p.tools.includes(col.toolId)) {
              if (p.tools.length < 2) p.tools.push(col.toolId);
              else p.tools[p.activeToolSlot] = col.toolId;
            }
            p.activeToolSlot = p.tools.indexOf(col.toolId);
            this.sound.sfx('switchOn');
            p.score += 100;
          } else if (col.kind === 'cherry') {
            p.cherries = Math.min(5, p.cherries + 1);
            p.hp = Math.min(p.maxHp, p.hp + 1);
            p.score += 50;
            this.sound.sfx('collectFruit');
          } else if (col.kind === 'banana') {
            p.bananas += 1;
            p.hp = p.maxHp;
            p.score += 100;
            this.sound.sfx('collectFruit');
          } else if (col.kind === 'gem') {
            p.score += 250;
            this.sound.sfx('collectGem');
          }
          this.spawnBurst(col.x, 0.6, col.z, 0xfacc15, 10);
          this.updateHUD();
          break;
        }
      }
    }
  }

  // ---- Switches, Braziers, Gates & Stage Transitions ----
  updateSwitchesAndGates(dt, isAuthoritative) {
    let anyNewSwitch = false;
    for (const sw of this.switches) {
      const wasActive = sw.active;
      if (sw.kind === 'star') {
        sw.active = this.starBlocks.some((sb) => !sb.removed && Math.hypot(sb.x - sw.x, sb.z - sw.z) < 0.95);
      } else {
        // Co-op pressure plate: held down by any Player, AI Buddy, Barrel, or Star-Block!
        const playerOn = this.players.some((p) => !p.gone && Math.hypot(p.x - sw.x, p.z - sw.z) < 1.25);
        const barrelOn = this.carryItems.some(
          (ci) => !ci.removed && ci.carriedBy === null && Math.hypot(ci.x - sw.x, ci.z - sw.z) < 1.25
        );
        const blockOn = this.starBlocks.some((sb) => !sb.removed && Math.hypot(sb.x - sw.x, sb.z - sw.z) < 1.15);
        // In 1-player AIHub session with no buddy, keep coop switch latched once stepped on so solo session rounds can always progress
        if (this.net && this.players.filter((p) => !p.gone).length <= 1) {
          sw.active = sw.active || playerOn || barrelOn || blockOn;
        } else {
          sw.active = playerOn || barrelOn || blockOn;
        }
      }

      if (sw.active && !wasActive) {
        anyNewSwitch = true;
        if (this.players[0]) {
          this.players[0].score += 150;
          this.players[0].stats.switches++;
        }
        if (sw.mesh?.userData?.plate) {
          sw.mesh.userData.plate.material = this.art.getCelMaterial(0x22c55e, { emissive: 0x15803d });
        }
      }
    }
    if (anyNewSwitch) this.sound.sfx('switchOn');

    // Check Gates
    const allSwitchesOn = this.switches.every((sw) => sw.active);
    const allBraziersLit = this.braziers.every((b) => b.lit);
    const bossDead = !this.enemies.some((en) => en.type === 'boss' && !en.dead);

    for (const g of this.gates) {
      if (g.open) continue;
      const swOk = !g.requiresSwitches || allSwitchesOn;
      const keyOk = !g.requiresKey || g.keyInserted;
      const brzOk = !g.requiresBraziers || allBraziersLit;
      const bossOk = !g.requiresBossDefeat || bossDead;

      if (swOk && keyOk && brzOk && bossOk) {
        g.open = true;
        if (g.mesh) g.mesh.visible = false;
        this.sound.sfx('gateOpen');
        this.spawnBurst(g.x, 1.2, g.z, 0x4ade80, 22);
      }
    }

    // Check if any player walks through the open North Exit Portal!
    if (isAuthoritative && this.stageDef.exitPortal && this.gates.every((g) => g.open)) {
      const ep = this.stageDef.exitPortal;
      const reachedExit = this.players.some((p) => !p.gone && Math.hypot(p.x - ep.x, p.z - ep.z) < 2.2);
      if (reachedExit) {
        if (this.stageIndex < STAGES.length - 1) {
          this.advanceToNextStage();
        } else {
          this.completeCampaignVictory();
        }
      }
    }
  }

  advanceToNextStage() {
    for (const p of this.players) p.score += 400;
    const nextIdx = (this.stageIndex + 1) % STAGES.length;
    this.loadStage(nextIdx, { sessionPlayers: this.net ? this.net.players : null });
    if (this.net && this.net.isHost) {
      this.net.send({ t: 'stage', idx: nextIdx });
    }
  }

  completeCampaignVictory() {
    this.sound.setTheme('victory');
    this.sound.sfx('gateOpen');
    if (this.net && this.net.isHost && window.AIHub?.active) {
      this.finishCoopRound(true);
    } else if (!this.attractMode) {
      this.phase = 'over';
      this.endMessage = 'VICTORY! Mayor Bellyache Rescued & Captain Cragbeard Foiled!';
      this.updateUI();
    }
  }

  // ---- Pirate Enemies & Captain Cragbeard Boss AI ----
  updateEnemies(now, dt) {
    const lureActive = this.decoyBellTarget && now < this.decoyBellTarget.until;

    // On Stage 5 (Boss), keep replenishing Kickable Star-Blocks & Bomb-Blocks on the deck!
    if (this.stageDef.id === 'quarterdeck') {
      const activeBlocks = this.starBlocks.filter((b) => !b.removed).length;
      if (activeBlocks < 2) {
        this.bossSpawnBlockTimer += dt;
        if (this.bossSpawnBlockTimer > 2.2) {
          this.bossSpawnBlockTimer = 0;
          const bx = [-6, 0, 6][Math.floor(Math.random() * 3)];
          this.spawnStarBlock({
            id: 'sb_boss_' + Math.floor(now),
            x: bx,
            z: 4,
            isBomb: Math.random() < 0.65
          });
          this.spawnBurst(bx, 1.0, 4, 0xfacc15, 12);
        }
      }
    }

    for (const en of this.enemies) {
      if (en.dead) continue;
      if (en.stunTimer > 0) {
        en.stunTimer = Math.max(0, en.stunTimer - dt);
        continue;
      }

      // Find target: Decoy Bell if ringing, otherwise nearest live player
      let target = null;
      if (lureActive) {
        target = this.decoyBellTarget;
      } else {
        let bestD = 999;
        for (const p of this.players) {
          if (p.gone) continue;
          const d = Math.hypot(p.x - en.x, p.z - en.z);
          if (d < bestD) {
            bestD = d;
            target = p;
          }
        }
      }
      if (!target) continue;

      const dx = target.x - en.x;
      const dz = target.z - en.z;
      const dist = Math.hypot(dx, dz) || 0.01;
      en.yaw = Math.atan2(dx, dz);

      if (en.type === 'boss') {
        // Captain Cragbeard Boss Logic
        en.attackTimer -= dt;
        if (en.hp <= 6 && en.whirlwindTimer <= 0 && en.attackTimer <= 0) {
          en.whirlwindTimer = 3.2;
          en.attackTimer = 4.5;
        }
        const bossSpeed = en.whirlwindTimer > 0 ? 5.2 : 2.6;
        if (en.whirlwindTimer > 0) {
          en.whirlwindTimer -= dt;
          en.yaw += dt * 16;
          if (en.whirlwindTimer <= 0) {
            // Dizzy after whirlwind spin!
            en.stunTimer = 2.4;
          }
        }
        if (dist > 1.8) {
          en.x += (dx / dist) * bossSpeed * dt;
          en.z += (dz / dist) * bossSpeed * dt;
        }
        // Boss cannonball / bomb lob
        if (en.attackTimer <= 0 && en.whirlwindTimer <= 0) {
          en.attackTimer = 3.4;
          this.spawnCarryItem({
            id: 'boss_bomb_' + Math.floor(now),
            x: en.x + (dx / dist) * 1.6,
            z: en.z + (dz / dist) * 1.6,
            kind: 'bomb'
          });
        }
      } else if (en.type === 'lobber') {
        // Barrel Lobber keeps medium distance and throws pots/barrels
        if (dist < 4.5) {
          en.x -= (dx / dist) * 2.2 * dt;
          en.z -= (dz / dist) * 2.2 * dt;
        } else if (dist > 8.5) {
          en.x += (dx / dist) * 2.4 * dt;
          en.z += (dz / dist) * 2.4 * dt;
        }
        en.attackTimer -= dt;
        if (en.attackTimer <= 0 && dist < 11) {
          en.attackTimer = 3.6;
          this.projectiles.push({
            x: en.x,
            y: 1.1,
            z: en.z,
            vx: (dx / dist) * 7.5,
            vz: (dz / dist) * 7.5,
            life: 2.2,
            mesh: this.stageRoot ? this.art.celMesh(new THREE.SphereGeometry(0.32, 8, 8), 0x1e293b, 0.025) : null
          });
          if (this.projectiles.at(-1).mesh) {
            this.stageRoot.add(this.projectiles.at(-1).mesh);
          }
        }
      } else {
        // Swashbuckler & Spiked Ironclad Brute chase target
        const spd = en.type === 'ironclad' ? 2.45 : 3.25;
        const nx = en.x + (dx / dist) * spd * dt;
        const nz = en.z + (dz / dist) * spd * dt;
        if (this.canPlayerWalkTo(nx, en.z)) en.x = nx;
        if (this.canPlayerWalkTo(en.x, nz)) en.z = nz;
      }

      // Check contact damage against players
      for (const p of this.players) {
        if (p.gone || p.invulnTimer > 0) continue;
        if (Math.hypot(p.x - en.x, p.z - en.z) < (en.type === 'boss' ? 1.55 : 1.05)) {
          this.damagePlayer(p, en);
        }
      }
    }
  }

  damagePlayer(p, sourceEnemy) {
    if (this.attractMode || p.invulnTimer > 0) return;
    p.invulnTimer = 1.4;
    if (p.cherries >= 5) {
      // Cherry Stun-Shield absorbs hit!
      p.cherries = 0;
      this.sound.sfx('bumperHit');
      return;
    }
    p.hp = Math.max(0, p.hp - 1);
    this.sound.sfx('playerHit');
    this.triggerCameraShake(0.22, 0.22);
    this.spawnBurst(p.x, 1.0, p.z, 0xef4444, 10);

    // Knockback
    if (sourceEnemy) {
      const dx = p.x - sourceEnemy.x;
      const dz = p.z - sourceEnemy.z;
      const d = Math.hypot(dx, dz) || 1;
      const kx = p.x + (dx / d) * 1.4;
      const kz = p.z + (dz / d) * 1.4;
      if (this.canPlayerWalkTo(kx, kz)) {
        p.x = kx;
        p.z = kz;
      }
    }

    // Auto-revive with Golden Banana or Buddy Heart Share!
    if (p.hp <= 0) {
      if (p.bananas > 0) {
        p.bananas--;
        p.hp = p.maxHp;
        this.sound.sfx('collectFruit');
      } else {
        // Respawn at stage entrance after brief stun
        p.hp = 4;
        p.stunTimer = 1.2;
      }
    }
    this.updateHUD();
  }

  killEnemy(en, killerPlayer) {
    if (en.dead) return;
    en.dead = true;
    if (en.mesh) en.mesh.visible = false;
    this.sound.sfx('enemyKO');
    this.spawnBurst(en.x, 1.0, en.z, 0xfacc15, 18);

    if (killerPlayer) {
      killerPlayer.score += en.type === 'boss' ? 1000 : en.type === 'ironclad' ? 300 : 150;
      killerPlayer.stats.piratesKO++;
    }

    // Drop Cherry or Banana!
    this.spawnCollectible({
      id: 'drop_' + en.id,
      x: en.x,
      z: en.z,
      kind: Math.random() < 0.35 ? 'banana' : 'cherry'
    });

    // If Captain Cragbeard was defeated in Stage 5, trigger victory!
    if (en.type === 'boss') {
      this.queueDialogue([
        {
          speaker: 'cragbeard',
          name: 'Capt. Cragbeard',
          text: 'YAA-HOO-HOO-HOOEY! Me proud galleon! Take Mayor Bellyache, ye meddling Buffoon Platoon!'
        },
        {
          speaker: 'mayor',
          name: 'Mayor Bellyache',
          text: 'Hooray! Captain Barnaby and the Buffoon Platoon saved the day! Walk through the North Quarterdeck Arch to celebrate!'
        }
      ]);
    }
    this.updateHUD();
  }

  // ---- Smart AI Buddy & Attract Mode AI ----
  computeAIControls(p, now, dt, isAttract) {
    const out = {
      x: 0,
      y: 0,
      actionHeld: false,
      actionPressed: false,
      toolHeld: false,
      toolPressed: false,
      cyclePressed: false,
      buddyPressed: false
    };

    // 1. In Solo Mode, if Buddy is ordered to Hold Switch / Stay, stand on nearest Co-op Plate!
    if (!isAttract && this.buddyStayMode) {
      const dx = this.buddyStayPos.x - p.x;
      const dz = this.buddyStayPos.z - p.z;
      const d = Math.hypot(dx, dz);
      if (d > 0.35) {
        out.x = dx / d;
        out.y = dz / d;
      }
      return out;
    }

    // 2. If there is an unactivated Co-op Foot Switch in the stage and this is Player 2 (Buddy), stand on it!
    const coopSw = this.switches.find((sw) => sw.kind === 'coop' && !sw.active);
    if (coopSw && (p.id === 1 || isAttract)) {
      const dx = coopSw.x - p.x;
      const dz = coopSw.z - p.z;
      const d = Math.hypot(dx, dz);
      if (d > 0.45) {
        out.x = dx / d;
        out.y = dz / d;
        return out;
      }
    }

    // 3. In Attract Mode (or AI Buddy helper), look for unactivated Star Switches & Star-Blocks, or Pirates!
    if (isAttract || p.id === 1) {
      // If carrying an item and an enemy is near, throw it!
      const nearEnemy = this.enemies.find((en) => !en.dead && Math.hypot(en.x - p.x, en.z - p.z) < 6.5);
      if (p.carryingId && nearEnemy) {
        const dx = nearEnemy.x - p.x;
        const dz = nearEnemy.z - p.z;
        const d = Math.hypot(dx, dz) || 1;
        out.x = dx / d;
        out.y = dz / d;
        if (Math.random() < 0.12) out.actionPressed = true;
        return out;
      }

      // In Attract mode, seek out the nearest unsliding Star-Block or Pot or Enemy to show off mechanics!
      const targetBlock = this.starBlocks.find((sb) => !sb.removed && !sb.sliding);
      if (isAttract && targetBlock && p.id === 0) {
        const targetX = targetBlock.x;
        const targetZ = targetBlock.z + 1.35; // stand south of block to kick it north!
        const dx = targetX - p.x;
        const dz = targetZ - p.z;
        const d = Math.hypot(dx, dz);
        if (d > 0.45) {
          out.x = dx / d;
          out.y = dz / d;
        } else {
          out.x = 0;
          out.y = -1;
          out.actionPressed = true;
        }
        return out;
      }

      // Follow Player 0 at a comfortable buddy distance & throw pots / fire hookshot at enemies
      const leader = this.players[0];
      if (leader && p !== leader) {
        const dx = leader.x + 2.2 - p.x;
        const dz = leader.z + 1.2 - p.z;
        const d = Math.hypot(dx, dz);
        if (d > 1.6) {
          out.x = dx / d;
          out.y = dz / d;
        } else if (nearEnemy && Math.random() < 0.04) {
          out.toolPressed = true;
        }
        return out;
      }
    }

    return out;
  }

  // ---- Projectiles & Cel Particle Bursts ----
  spawnBurst(x, y, z, hexColor, count = 10) {
    if (!this.stageRoot) return;
    const geo = new THREE.OctahedronGeometry(0.16, 0);
    const mat = this.art.getCelMaterial(hexColor, { emissive: hexColor });
    for (let i = 0; i < count; i++) {
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      const ang = (i / count) * Math.PI * 2 + Math.random() * 0.4;
      const spd = 2.5 + Math.random() * 4.5;
      this.stageRoot.add(mesh);
      this.particles.push({
        mesh,
        vx: Math.cos(ang) * spd,
        vy: 3.0 + Math.random() * 3.5,
        vz: Math.sin(ang) * spd,
        life: 0.45 + Math.random() * 0.25
      });
    }
  }

  updateProjectilesAndParticles(dt) {
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const pr = this.projectiles[i];
      pr.life -= dt;
      pr.x += pr.vx * dt;
      pr.z += pr.vz * dt;
      if (pr.mesh) pr.mesh.position.set(pr.x, pr.y, pr.z);

      let hit = pr.life <= 0;
      for (const p of this.players) {
        if (!p.gone && Math.hypot(p.x - pr.x, p.z - pr.z) < 0.85) {
          this.damagePlayer(p, null);
          hit = true;
          break;
        }
      }
      if (hit) {
        if (pr.mesh && this.stageRoot) this.stageRoot.remove(pr.mesh);
        this.projectiles.splice(i, 1);
      }
    }

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.life -= dt;
      pt.vy -= 12 * dt;
      pt.mesh.position.x += pt.vx * dt;
      pt.mesh.position.y += pt.vy * dt;
      pt.mesh.position.z += pt.vz * dt;
      pt.mesh.scale.setScalar(Math.max(0.01, pt.life * 2));
      if (pt.life <= 0) {
        if (this.stageRoot) this.stageRoot.remove(pt.mesh);
        this.particles.splice(i, 1);
      }
    }
  }

  // ---- Procedural Character & Prop Skeletal Animations ----
  animateEntitiesVisuals(now, dt) {
    if (!this.stageRoot) return;

    for (const p of this.players) {
      if (!p.mesh || p.gone) continue;
      p.mesh.position.set(p.x, 0, p.z);
      p.mesh.rotation.y = p.yaw;

      const parts = p.mesh.userData.parts;
      if (!parts) continue;

      const moving = Math.hypot(p.vx, p.vz) > 0.25;
      const walkSwing = moving ? Math.sin(p.animPhase) * 0.65 : Math.sin(now * 0.004 + p.id) * 0.06;

      // Leg & Big-Boot Kick cycle
      if (p.kickAnimTimer > 0) {
        parts.rightLeg.rotation.x = -1.35;
        parts.leftLeg.rotation.x = 0.25;
      } else {
        parts.leftLeg.rotation.x = walkSwing;
        parts.rightLeg.rotation.x = -walkSwing;
      }

      // Arms (Overhead Carry pose vs Normal swing)
      if (p.carryingId) {
        parts.leftArm.rotation.x = Math.PI * 0.92;
        parts.rightArm.rotation.x = Math.PI * 0.92;
      } else {
        parts.leftArm.rotation.x = -walkSwing * 0.8;
        parts.rightArm.rotation.x = walkSwing * 0.8;
      }

      // Bouncy cartoon torso squash & stretch + floppy Goof ears
      parts.torso.position.y = (0.86 + Math.abs(Math.sin(p.animPhase)) * (moving ? 0.09 : 0.02)) * parts.scaleY;
      parts.leftEar.rotation.z = 0.28 + Math.sin(p.animPhase * 1.2) * 0.16;
      parts.rightEar.rotation.z = -0.28 - Math.sin(p.animPhase * 1.2) * 0.16;

      // Dizzy Stun Stars
      parts.stunRing.visible = p.stunTimer > 0;
      if (p.stunTimer > 0) {
        parts.stunRing.rotation.y += dt * 6.5;
      }

      // Hookshot visual chain
      parts.hookGroup.visible = p.hookTimer > 0;
      if (p.hookTimer > 0) {
        const ext = Math.sin((1 - p.hookTimer / 0.36) * Math.PI) * 6.5 + 1.5;
        parts.chainMesh.scale.set(1, 1, Math.max(0.5, ext));
        parts.clawMesh.position.set(0, 0, Math.max(0.5, ext));
      }

      // Glow Lantern light
      const hasLantern = p.tools[p.activeToolSlot] === 'lantern';
      parts.lanternLight.intensity = hasLantern ? 2.5 : 0;
    }

    for (const en of this.enemies) {
      if (!en.mesh || en.dead) continue;
      en.mesh.position.set(en.x, 0, en.z);
      en.mesh.rotation.y = en.yaw;
      const parts = en.mesh.userData.parts;
      if (!parts) continue;
      const swing = en.stunTimer > 0 ? 0 : Math.sin(now * 0.01 + en.x) * 0.5;
      parts.leftLeg.rotation.x = swing;
      parts.rightLeg.rotation.x = -swing;
      parts.leftArm.rotation.x = -swing;
      parts.rightArm.rotation.x = swing - 0.4;
      parts.stunRing.visible = en.stunTimer > 0;
      if (en.stunTimer > 0) parts.stunRing.rotation.y += dt * 6;
    }
  }

  triggerCameraShake(duration = 0.2, intensity = 0.25) {
    if (!this.cameraShakeEnabled) return;
    this.shakeTime = duration;
    this.shakeIntensity = intensity;
  }

  updateCamera(dt) {
    if (!this.camera) return;
    // Dynamically frame active players
    const live = this.players.filter((p) => !p.gone);
    let cx = 0;
    let cz = 1.5;
    if (live.length > 0) {
      cx = live.reduce((acc, p) => acc + p.x, 0) / live.length;
      cz = live.reduce((acc, p) => acc + p.z, 0) / live.length;
    }
    cx = Math.max(-5, Math.min(5, cx * 0.45));
    cz = Math.max(-4, Math.min(5, cz * 0.45));

    let shakeX = 0;
    let shakeY = 0;
    if (this.shakeTime > 0) {
      this.shakeTime = Math.max(0, this.shakeTime - dt);
      shakeX = (Math.random() * 2 - 1) * this.shakeIntensity;
      shakeY = (Math.random() * 2 - 1) * this.shakeIntensity;
    }

    this.camera.position.x += (cx + shakeX - this.camera.position.x) * Math.min(1, dt * 6);
    this.camera.position.y += (18.5 + shakeY - this.camera.position.y) * Math.min(1, dt * 6);
    this.camera.position.z += (cz + 15.5 - this.camera.position.z) * Math.min(1, dt * 6);
    this.camera.lookAt(cx * 0.6, 0, cz * 0.6);
  }

  // ---- Shared-World Network Sync (AIHub Session & Standalone Room) ----
  sendNetworkSync() {
    if (!this.net) return;
    const tNow = Math.round(this.net.time());

    // Report progress to AIHub scoreboard
    if (window.AIHub && window.AIHub.active) {
      const teamScore = this.players.reduce((s, p) => s + (p.score || 0), 0);
      window.AIHub.progress({
        score: teamScore,
        label: `Stage ${this.stageIndex + 1}/5`
      });
    }

    if (this.net.isHost) {
      // Host sends compact authoritative snapshot of players, Star-Blocks, switches, enemies & gates
      const snap = {
        t: 's',
        at: tNow,
        stg: this.stageIndex,
        p: this.players
          .filter((p) => !p.gone)
          .map((p) => [
            p.id,
            Math.round(p.x * 20) / 20,
            Math.round(p.z * 20) / 20,
            Math.round(p.yaw * 20) / 20,
            p.score,
            p.hp
          ]),
        sb: this.starBlocks.map((b) => [
          Math.round(b.x * 10) / 10,
          Math.round(b.z * 10) / 10,
          b.sliding ? 1 : 0,
          b.removed ? 1 : 0
        ]),
        sw: this.switches.map((s) => (s.active ? 1 : 0)),
        en: this.enemies.map((e) => [
          Math.round(e.x * 10) / 10,
          Math.round(e.z * 10) / 10,
          e.hp,
          e.dead ? 1 : 0,
          e.stunTimer > 0 ? 1 : 0
        ]),
        g: this.gates.map((g) => (g.open ? 1 : 0))
      };
      this.net.send(snap, { reliable: false });
    } else {
      // Non-host sends local player state to host
      const me = this.players.find((p) => p.id === this.net.me);
      if (me) {
        this.net.send(
          {
            t: 'me',
            at: tNow,
            x: Math.round(me.x * 20) / 20,
            z: Math.round(me.z * 20) / 20,
            yaw: Math.round(me.yaw * 20) / 20,
            score: me.score
          },
          { to: this.net.host, reliable: false }
        );
      }
    }
  }

  onNetworkMessage(data, from) {
    if (!data || !this.net) return;
    if (this.net.isHost) {
      if (data.t === 'me') {
        const p = this.players.find((q) => q.id === from);
        if (p && !(data.at < p.at)) {
          p.at = data.at;
          p.tx = p.x = Number(data.x) || 0;
          p.tz = p.z = Number(data.z) || 0;
          p.yaw = Number(data.yaw) || 0;
          if (typeof data.score === 'number' && data.score > p.score) p.score = data.score;
        }
      } else if (data.t === 'act') {
        const p = this.players.find((q) => q.id === from);
        if (data.kind === 'kick') {
          const sb = this.starBlocks.find((b) => b.id === data.id);
          if (sb) this.kickStarBlock(sb, data.kx, data.kz, p);
        }
      }
    } else if (from === this.net.host) {
      if (data.t === 'stage' && data.idx !== this.stageIndex) {
        this.loadStage(data.idx, { sessionPlayers: this.net.players });
        return;
      }
      if (data.t === 's') {
        if (data.at < this.lastSnapAt) return;
        this.lastSnapAt = data.at;
        if (typeof data.stg === 'number' && data.stg !== this.stageIndex) {
          this.loadStage(data.stg, { sessionPlayers: this.net.players });
        }
        if (Array.isArray(data.p)) {
          for (const [id, x, z, yaw, score, hp] of data.p) {
            const p = this.players.find((q) => q.id === id);
            if (!p) continue;
            p.score = score;
            p.hp = hp;
            if (id !== this.net.me) {
              p.tx = x;
              p.tz = z;
              p.yaw = yaw;
            }
          }
        }
        if (Array.isArray(data.sb)) {
          data.sb.forEach(([x, z, sliding, removed], idx) => {
            const b = this.starBlocks[idx];
            if (!b) return;
            b.x = x;
            b.z = z;
            b.sliding = !!sliding;
            b.removed = !!removed;
            if (b.mesh) b.mesh.visible = !b.removed;
          });
        }
        if (Array.isArray(data.sw)) {
          data.sw.forEach((act, idx) => {
            if (this.switches[idx]) this.switches[idx].active = !!act;
          });
        }
        if (Array.isArray(data.en)) {
          data.en.forEach(([x, z, hp, dead, stunned], idx) => {
            const e = this.enemies[idx];
            if (!e) return;
            e.x = x;
            e.z = z;
            e.hp = hp;
            e.dead = !!dead;
            if (e.mesh) e.mesh.visible = !e.dead;
            if (stunned && e.stunTimer <= 0) e.stunTimer = 0.5;
          });
        }
        if (Array.isArray(data.g)) {
          data.g.forEach((open, idx) => {
            if (this.gates[idx]) {
              this.gates[idx].open = !!open;
              if (this.gates[idx].mesh) this.gates[idx].mesh.visible = !open;
            }
          });
        }
        if (data.over) {
          this.phase = 'over';
          this.endMessage = 'Platoon Round Complete!';
          this.updateUI();
        }
        this.updateHUD();
      }
    }
  }

  finishCoopRound(won = true) {
    if (this.phase === 'over' || !this.net || !this.net.isHost) return;
    // Send final reliable snapshot
    this.net.send({ t: 's', at: Math.round(this.net.time()), over: 1 }, { reliable: true });

    const present = this.players.filter((p) => !p.gone).sort((a, b) => b.score - a.score);
    const standings = [];
    for (const p of present) {
      const last = standings[standings.length - 1];
      if (last && last.score === p.score) last.ids.push(p.id);
      else standings.push({ score: p.score, ids: [p.id] });
    }
    const finalStandings = standings.length ? standings.map((g) => g.ids) : [this.players.map((p) => p.id)];
    const scores = Object.fromEntries(this.players.map((p) => [p.id, p.score || 0]));
    const stats = Object.fromEntries(
      this.players.map((p) => [
        p.id,
        {
          score: p.score || 0,
          stage: `${this.stageIndex + 1}/5`,
          blocks: p.stats?.blocksKicked || 0,
          pirates: p.stats?.piratesKO || 0
        }
      ])
    );
    const awards = [];
    if (present[0]) {
      awards.push({
        id: present[0].id,
        title: 'Chief Buffoon Star-Kicker',
        detail: `${present[0].score} pts`
      });
    }

    this.net.finish({
      standings: finalStandings,
      scores,
      won: !!won,
      stats,
      awards
    });
    this.phase = 'over';
    this.endMessage = won ? 'Platoon Victory!' : 'Round Time Up!';
    this.updateUI();
  }

  // ---- Dialogue & Animalese Speech System ----
  queueDialogue(lines) {
    this.dialogueQueue.push(...lines);
    if (!this.activeDialogue) {
      this.advanceDialogue();
    }
  }

  advanceDialogue() {
    if (!this.dialogueQueue.length) {
      this.activeDialogue = null;
      this.updateHUD();
      return;
    }
    this.activeDialogue = this.dialogueQueue.shift();
    this.dialogueTimer = 5.2;
    this.sound.speakAnimalese(this.activeDialogue.text, this.activeDialogue.speaker);
    this.updateHUD();
  }

  // ---- Title Screen, Attract Mode & 10-Foot Controller Menus ----
  showTitleScreen() {
    this.phase = 'title';
    this.attractMode = false;
    this.settingsOpen = false;
    this.stageSelectOpen = false;
    this.lobbyOpen = false;
    this.creditsOpen = false;
    this.input.lastInputAt = performance.now();
    this.updateUI();
  }

  startAttractMode() {
    this.attractMode = true;
    this.attractStageTimer = 0;
    this.loadStage(0, { previewOnly: true });
    this.updateUI();
  }

  exitAttractMode() {
    this.attractMode = false;
    this.phase = 'title';
    this.input.lastInputAt = performance.now();
    this.loadStage(0, { previewOnly: true });
    this.updateUI();
  }

  startStandaloneGame(stageIdx = 0, localPlayers = 1) {
    this.sound.unlock();
    this.localCoopCount = localPlayers;
    this.attractMode = false;
    this.stageSelectOpen = false;
    this.lobbyOpen = false;
    this.creditsOpen = false;
    this.phase = 'playing';
    this.loadStage(stageIdx);
    this.updateUI();
  }

  toggleSettingsMenu() {
    this.settingsOpen = !this.settingsOpen;
    this.settingsIndex = 0;
    this.sound.sfx(this.settingsOpen ? 'uiConfirm' : 'uiBack');
  }

  handleTitleInput(now, uiInput) {
    // Check 10-second idle timer for Attract Mode
    if (!this.attractMode && now - this.input.lastInputAt > 10000) {
      this.startAttractMode();
      return;
    }
    const itemCount = 6;
    if (uiInput.uiUp) {
      this.titleIndex = (this.titleIndex + itemCount - 1) % itemCount;
      this.sound.sfx('uiMove');
      this.updateUI();
    } else if (uiInput.uiDown) {
      this.titleIndex = (this.titleIndex + 1) % itemCount;
      this.sound.sfx('uiMove');
      this.updateUI();
    } else if (uiInput.uiConfirm) {
      this.sound.unlock();
      this.sound.sfx('uiConfirm');
      this.activateTitleOption(this.titleIndex);
    }
  }

  activateTitleOption(idx) {
    if (idx === 0) {
      this.startStandaloneGame(0, 1);
    } else if (idx === 1) {
      this.startStandaloneGame(0, 2);
    } else if (idx === 2) {
      this.stageSelectOpen = true;
      this.stageSelectIndex = 0;
      this.updateUI();
    } else if (idx === 3) {
      this.lobbyOpen = true;
      this.lobbyIndex = 0;
      this.updateUI();
    } else if (idx === 4) {
      this.settingsOpen = true;
      this.settingsIndex = 0;
      this.updateUI();
    } else if (idx === 5) {
      this.creditsOpen = true;
      this.updateUI();
    }
  }

  handleSettingsInput(uiInput) {
    const items = this.getSettingsItems();
    if (uiInput.uiUp) {
      this.settingsIndex = (this.settingsIndex + items.length - 1) % items.length;
      this.sound.sfx('uiMove');
      this.updateUI();
    } else if (uiInput.uiDown) {
      this.settingsIndex = (this.settingsIndex + 1) % items.length;
      this.sound.sfx('uiMove');
      this.updateUI();
    } else if (uiInput.uiConfirm || uiInput.uiLeft || uiInput.uiRight) {
      this.sound.sfx('uiConfirm');
      items[this.settingsIndex].act(uiInput.uiLeft ? -1 : 1);
      this.updateUI();
    } else if (uiInput.uiBack) {
      this.settingsOpen = false;
      this.sound.sfx('uiBack');
      this.updateUI();
    }
  }

  getSettingsItems() {
    return [
      {
        label: `Audio Mute: ${this.sound.muted ? 'MUTED' : 'ACTIVE'}`,
        act: () => this.sound.setMuted(!this.sound.muted)
      },
      {
        label: `Music Volume: ${Math.round(this.sound.musicVol * 100)}%`,
        act: (dir) => {
          this.sound.musicVol = Math.max(0, Math.min(1, Math.round((this.sound.musicVol + dir * 0.2) * 10) / 10));
          this.sound.updateVolumes();
        }
      },
      {
        label: `SFX & Voice Volume: ${Math.round(this.sound.sfxVol * 100)}%`,
        act: (dir) => {
          this.sound.sfxVol = Math.max(0, Math.min(1, Math.round((this.sound.sfxVol + dir * 0.2) * 10) / 10));
          this.sound.voiceVol = this.sound.sfxVol;
          this.sound.updateVolumes();
        }
      },
      {
        label: `Invert Gamepad Horizontal Axis: ${this.input.invertHorizontal ? 'ON (Inverted)' : 'OFF (Normal)'}`,
        act: () => {
          this.input.invertHorizontal = !this.input.invertHorizontal;
        }
      },
      {
        label: `Invert Gamepad Vertical Axis: ${this.input.invertVertical ? 'ON (Inverted)' : 'OFF (Normal)'}`,
        act: () => {
          this.input.invertVertical = !this.input.invertVertical;
        }
      },
      {
        label: `Cel Ink Outlines: ${['Off', 'Standard Comic', 'Extra Bold'][this.outlineMode]}`,
        act: () => {
          this.outlineMode = (this.outlineMode + 1) % 3;
          if (this.art) this.art.setOutlineScale([0, 1.0, 1.65][this.outlineMode]);
        }
      },
      {
        label: `Camera Impact Shake: ${this.cameraShakeEnabled ? 'ON' : 'OFF'}`,
        act: () => {
          this.cameraShakeEnabled = !this.cameraShakeEnabled;
        }
      },
      {
        label: 'About / Credits & Feedback Report',
        act: () => {
          this.settingsOpen = false;
          this.creditsOpen = true;
        }
      },
      {
        label: 'Resume Game (Esc / Options / Circle)',
        act: () => {
          this.settingsOpen = false;
        }
      }
    ];
  }

  handleStageSelectInput(uiInput) {
    const count = STAGES.length + 1;
    if (uiInput.uiUp) {
      this.stageSelectIndex = (this.stageSelectIndex + count - 1) % count;
      this.sound.sfx('uiMove');
      this.updateUI();
    } else if (uiInput.uiDown) {
      this.stageSelectIndex = (this.stageSelectIndex + 1) % count;
      this.sound.sfx('uiMove');
      this.updateUI();
    } else if (uiInput.uiConfirm) {
      this.sound.sfx('uiConfirm');
      if (this.stageSelectIndex < STAGES.length) {
        this.startStandaloneGame(this.stageSelectIndex, this.localCoopCount);
      } else {
        this.stageSelectOpen = false;
        this.updateUI();
      }
    } else if (uiInput.uiBack) {
      this.stageSelectOpen = false;
      this.sound.sfx('uiBack');
      this.updateUI();
    }
  }

  handleLobbyInput(uiInput) {
    const count = 4;
    if (uiInput.uiUp) {
      this.lobbyIndex = (this.lobbyIndex + count - 1) % count;
      this.sound.sfx('uiMove');
      this.updateUI();
    } else if (uiInput.uiDown) {
      this.lobbyIndex = (this.lobbyIndex + 1) % count;
      this.sound.sfx('uiMove');
      this.updateUI();
    } else if (uiInput.uiConfirm) {
      this.sound.sfx('uiConfirm');
      this.activateLobbyOption(this.lobbyIndex);
    } else if (uiInput.uiBack) {
      this.lobbyOpen = false;
      this.sound.sfx('uiBack');
      this.updateUI();
    }
  }

  activateLobbyOption(idx) {
    if (idx === 0) {
      if (this.net) this.net.close();
      this.net = createStandaloneRoomNet({
        roomCode: this.roomCode,
        isHost: true,
        onRosterChange: () => this.updateUI()
      });
      this.net.onMessage((d, f) => this.onNetworkMessage(d, f));
      this.updateUI();
    } else if (idx === 1) {
      if (this.net) this.net.close();
      this.net = createStandaloneRoomNet({
        roomCode: this.roomCode,
        isHost: false,
        onRosterChange: () => this.updateUI()
      });
      this.net.onMessage((d, f) => this.onNetworkMessage(d, f));
      this.updateUI();
    } else if (idx === 2) {
      this.lobbyOpen = false;
      this.phase = 'playing';
      this.loadStage(0, { sessionPlayers: this.net ? this.net.players : null });
      this.updateUI();
    } else {
      this.lobbyOpen = false;
      this.updateUI();
    }
  }

  // ---- 10-Foot Controller-First UI Construction & Rendering ----
  buildDOMUI() {
    const uiRoot = document.getElementById('ui-layer');
    if (!uiRoot) return;

    uiRoot.innerHTML = `
      <!-- Touch-only device warning overlay -->
      <div id="touch-warning" class="modal-backdrop" style="display:none;">
        <div class="comic-card">
          <h2>Controller or keyboard required</h2>
          <p>Buffoon Platoon is designed for a 10-foot DualSense controller or keyboard experience.</p>
          <button id="touch-settings-btn" class="comic-btn is-selected">⚙ Open Settings</button>
        </div>
      </div>

      <!-- Attract Mode Top Banner -->
      <div id="attract-banner" style="display:none;">
        <span>★ ATTRACT DEMO REPLAY — PRESS ANY BUTTON OR KEY TO PLAY ★</span>
      </div>

      <!-- Top Gameplay HUD -->
      <div id="hud-bar" style="display:none;">
        <div class="hud-left">
          <div class="hud-badge" id="hud-stage-title">Stage 1</div>
          <div class="hud-hearts" id="hud-hearts"></div>
          <div class="hud-fruits" id="hud-fruits"></div>
        </div>
        <div class="hud-center">
          <div class="hud-tools" id="hud-tools"></div>
        </div>
        <div class="hud-right">
          <div class="hud-score" id="hud-score">0 PTS</div>
          <button id="hud-settings-btn" class="hud-mini-btn" title="Settings (Esc / Options)">⚙ Options</button>
        </div>
      </div>

      <!-- Bottom Comic Dialogue & Controls Prompt Bar -->
      <div id="dialogue-box" style="display:none;">
        <div class="dialogue-speaker" id="dialogue-speaker">Capt. Barnaby</div>
        <div class="dialogue-text" id="dialogue-text"></div>
      </div>

      <div id="controls-strip" style="display:none;">
        <span><b>[L-Stick / WASD]</b> Move</span>
        <span><b>[Cross / Space]</b> Kick Star-Block · Pick Up · Throw</span>
        <span><b>[Square / E]</b> Use Tool</span>
        <span><b>[L1 / Q]</b> Swap Tool</span>
        <span><b>[Triangle / R]</b> Buddy Hold Switch</span>
        <span><b>[Options / Esc]</b> Settings</span>
      </div>

      <!-- 10-Foot Title Screen -->
      <div id="title-screen" class="modal-backdrop" style="display:none;">
        <div class="comic-card title-card">
          <div class="badge-pill">A Playful Riff on Goof Troop · WebGPU Cel-Shaded Action-Puzzle</div>
          <h1 class="game-logo">BUFFOON PLATOON</h1>
          <p class="game-tagline">Kick Star-Blocks, Toss Coconut Bombs & Rescue Mayor Bellyache from Captain Cragbeard!</p>
          <div id="title-menu-list" class="menu-list"></div>
          <div class="controller-footer">
            <span>🎮 PS5 DualSense / Gamepad: <b>D-Pad / Stick</b> Select · <b>Cross (✕)</b> Confirm · <b>Options</b> Settings</span>
            <span>⌨ Keyboard: <b>W/S / Arrows</b> · <b>Enter / Space</b> · Idle 10s for Attract Demo</span>
          </div>
        </div>
      </div>

      <!-- Ready / Countdown Screen (AIHub non-splash or countdown) -->
      <div id="ready-screen" class="modal-backdrop" style="display:none;">
        <div class="comic-card">
          <h2 id="ready-title">Get Ready!</h2>
          <p id="ready-subtitle">Press any key, click or tap when you are ready</p>
        </div>
      </div>

      <!-- Stage Select Modal -->
      <div id="stage-modal" class="modal-backdrop" style="display:none;">
        <div class="comic-card">
          <h2>Select Island Stage</h2>
          <div id="stage-menu-list" class="menu-list"></div>
        </div>
      </div>

      <!-- Standalone Co-op Room Lobby Modal -->
      <div id="lobby-modal" class="modal-backdrop" style="display:none;">
        <div class="comic-card">
          <h2>Co-op Room Lobby (Code: <span id="lobby-code">GOOF</span>)</h2>
          <p id="lobby-roster">Open another tab or join on your network to play together!</p>
          <div id="lobby-menu-list" class="menu-list"></div>
        </div>
      </div>

      <!-- Settings Modal (Never pauses shared world!) -->
      <div id="settings-modal" class="modal-backdrop" style="display:none;">
        <div class="comic-card">
          <h2>Settings & Controller Options</h2>
          <div id="settings-menu-list" class="menu-list"></div>
        </div>
      </div>

      <!-- About / Credits & Feedback Modal -->
      <div id="credits-modal" class="modal-backdrop" style="display:none;">
        <div class="comic-card credits-card">
          <h2>About Buffoon Platoon & Engineering Report</h2>
          <div id="credits-content" class="credits-scroll"></div>
          <button id="credits-close-btn" class="comic-btn is-selected">Back (Circle / Esc / Enter)</button>
        </div>
      </div>

      <!-- Round Over / Victory Screen -->
      <div id="over-modal" class="modal-backdrop" style="display:none;">
        <div class="comic-card">
          <h2 id="over-title">Mission Complete!</h2>
          <div id="over-standings" class="menu-list"></div>
          <button id="over-return-btn" class="comic-btn is-selected">Return to Title (Cross / Enter)</button>
        </div>
      </div>
    `;

    // Wire mouse/click fallbacks onto menu buttons
    document.getElementById('hud-settings-btn')?.addEventListener('click', () => {
      this.toggleSettingsMenu();
      this.updateUI();
    });
    document.getElementById('touch-settings-btn')?.addEventListener('click', () => {
      this.settingsOpen = true;
      this.updateUI();
    });
    document.getElementById('credits-close-btn')?.addEventListener('click', () => {
      this.creditsOpen = false;
      this.updateUI();
    });
    document.getElementById('over-return-btn')?.addEventListener('click', () => {
      if (!window.AIHub || !window.AIHub.active) {
        this.showTitleScreen();
      }
    });

    // Populate Credits content once
    const credEl = document.getElementById('credits-content');
    if (credEl) {
      credEl.innerHTML = CREDITS_SECTIONS.map(
        (sec) => `
          <div class="cred-sec">
            <h3>${sec.title}</h3>
            <ul>${sec.items.map((it) => `<li>${it}</li>`).join('')}</ul>
          </div>
        `
      ).join('');
    }
  }

  updateUI() {
    const show = (id, vis) => {
      const el = document.getElementById(id);
      if (el) el.style.display = vis ? '' : 'none';
    };

    show('touch-warning', this.input.isTouchOnly && !this.settingsOpen);
    show('attract-banner', this.attractMode);
    show('hud-bar', this.phase === 'playing' || this.attractMode);
    show('controls-strip', (this.phase === 'playing' || this.attractMode) && !this.settingsOpen);

    // Title Screen
    const onTitle = this.phase === 'title' && !this.attractMode && !this.stageSelectOpen && !this.lobbyOpen && !this.creditsOpen && !this.settingsOpen;
    show('title-screen', onTitle);
    if (onTitle) {
      const opts = [
        '▶ Start 1P + AI Buddy Campaign (Capt. Barnaby & Cpl. Kip)',
        '👥 Start 2-Player Local Couch Co-op',
        '🗺 Stage Select (All 5 Island Stages & Boss)',
        '🌐 Co-op Room Lobby (Multi-Tab / Network Room)',
        '⚙ Settings (Audio, Invert Gamepad Axes, Cel Outlines)',
        '📜 About, Credits & Engine/Prompt Feedback'
      ];
      const list = document.getElementById('title-menu-list');
      if (list) {
        list.innerHTML = opts
          .map(
            (label, i) =>
              `<button class="comic-btn ${i === this.titleIndex ? 'is-selected' : ''}" data-idx="${i}">${label}</button>`
          )
          .join('');
        list.querySelectorAll('button').forEach((btn) => {
          btn.onclick = () => this.activateTitleOption(Number(btn.dataset.idx));
        });
      }
    }

    // Ready Screen (AIHub non-splash)
    show('ready-screen', this.phase === 'ready');

    // Stage Select
    show('stage-modal', this.stageSelectOpen);
    if (this.stageSelectOpen) {
      const list = document.getElementById('stage-menu-list');
      if (list) {
        const items = [
          ...STAGES.map((s) => `${s.name} — ${s.subtitle}`),
          '← Back to Title Screen'
        ];
        list.innerHTML = items
          .map(
            (label, i) =>
              `<button class="comic-btn ${i === this.stageSelectIndex ? 'is-selected' : ''}" data-idx="${i}">${label}</button>`
          )
          .join('');
        list.querySelectorAll('button').forEach((btn) => {
          btn.onclick = () => {
            const idx = Number(btn.dataset.idx);
            if (idx < STAGES.length) this.startStandaloneGame(idx, this.localCoopCount);
            else {
              this.stageSelectOpen = false;
              this.updateUI();
            }
          };
        });
      }
    }

    // Lobby Modal
    show('lobby-modal', this.lobbyOpen);
    if (this.lobbyOpen) {
      const rosterEl = document.getElementById('lobby-roster');
      if (rosterEl) {
        rosterEl.textContent = this.net
          ? `Connected Platoon (${this.net.players.length}/4): ${this.net.players.map((p) => p.name).join(', ')}`
          : 'Choose Host or Join Room below to link tabs/devices:';
      }
      const list = document.getElementById('lobby-menu-list');
      if (list) {
        const opts = [
          'Host Room "GOOF" (As Capt. Barnaby)',
          'Join Room "GOOF" (As Co-op Partner)',
          'Launch Co-op Mission Now!',
          '← Back to Title Screen'
        ];
        list.innerHTML = opts
          .map(
            (label, i) =>
              `<button class="comic-btn ${i === this.lobbyIndex ? 'is-selected' : ''}" data-idx="${i}">${label}</button>`
          )
          .join('');
        list.querySelectorAll('button').forEach((btn) => {
          btn.onclick = () => this.activateLobbyOption(Number(btn.dataset.idx));
        });
      }
    }

    // Settings Modal
    show('settings-modal', this.settingsOpen);
    if (this.settingsOpen) {
      const list = document.getElementById('settings-menu-list');
      if (list) {
        const items = this.getSettingsItems();
        list.innerHTML = items
          .map(
            (it, i) =>
              `<button class="comic-btn ${i === this.settingsIndex ? 'is-selected' : ''}" data-idx="${i}">${it.label}</button>`
          )
          .join('');
        list.querySelectorAll('button').forEach((btn) => {
          btn.onclick = () => {
            const idx = Number(btn.dataset.idx);
            this.settingsIndex = idx;
            items[idx].act(1);
            this.updateUI();
          };
        });
      }
    }

    // Credits Modal
    show('credits-modal', this.creditsOpen);

    // Over Modal
    show('over-modal', this.phase === 'over');
    if (this.phase === 'over') {
      const t = document.getElementById('over-title');
      if (t) t.textContent = this.endMessage || 'Round Over';
      const st = document.getElementById('over-standings');
      if (st) {
        st.innerHTML = this.players
          .map(
            (p, idx) =>
              `<div class="standing-row" style="border-left:6px solid ${p.color};">${idx + 1}. <b>${p.name}</b> — ${p.score} PTS (Blocks: ${p.stats?.blocksKicked || 0}, Pirates KO: ${p.stats?.piratesKO || 0})</div>`
          )
          .join('');
      }
      const retBtn = document.getElementById('over-return-btn');
      if (retBtn) retBtn.style.display = window.AIHub && window.AIHub.active ? 'none' : '';
    }

    this.updateHUD();
  }

  updateHUD() {
    const p = this.players.find((q) => q.id === (this.net ? this.net.me : this.activePlayerSlot)) || this.players[0];
    if (!p) return;

    const stgEl = document.getElementById('hud-stage-title');
    if (stgEl) {
      const swLeft = this.switches.filter((s) => !s.active).length;
      const boss = this.enemies.find((e) => e.type === 'boss' && !e.dead);
      stgEl.textContent = boss
        ? `${this.stageDef.name} · CRAGBEARD HP: ${boss.hp}/${boss.maxHp}`
        : swLeft > 0
        ? `${this.stageDef.name} · Switches Left: ${swLeft}`
        : `${this.stageDef.name} · GATE OPEN! Enter North Arch!`;
    }

    const heartsEl = document.getElementById('hud-hearts');
    if (heartsEl) {
      heartsEl.textContent = '❤️'.repeat(Math.max(0, p.hp)) + '🖤'.repeat(Math.max(0, p.maxHp - p.hp));
    }

    const fruitsEl = document.getElementById('hud-fruits');
    if (fruitsEl) {
      fruitsEl.textContent = `🍒 ${p.cherries}/5 · 🍌 ${p.bananas}`;
    }

    const toolsEl = document.getElementById('hud-tools');
    if (toolsEl) {
      toolsEl.innerHTML = p.tools
        .map((tid, idx) => {
          const def = TOOL_DEFS[tid] || TOOL_DEFS.hookshot;
          const active = idx === p.activeToolSlot;
          return `<span class="tool-slot ${active ? 'is-active' : ''}">${def.icon} ${def.name}</span>`;
        })
        .join('');
    }

    const scoreEl = document.getElementById('hud-score');
    if (scoreEl) {
      const total = this.players.reduce((s, q) => s + (q.score || 0), 0);
      scoreEl.textContent = `${total} PTS`;
    }

    const dlgBox = document.getElementById('dialogue-box');
    if (dlgBox) {
      if (this.activeDialogue && !this.settingsOpen) {
        dlgBox.style.display = '';
        document.getElementById('dialogue-speaker').textContent = this.activeDialogue.name;
        document.getElementById('dialogue-text').textContent = this.activeDialogue.text;
      } else {
        dlgBox.style.display = 'none';
      }
    }
  }
}


const canvas = document.getElementById('game-canvas');
const app = new BuffoonPlatoonGame(canvas);
window.__buffoonPlatoon = app;
app.init();
</script>
