<body>
<canvas id="game-canvas" aria-label="Buffoon Platoon 3D WebGPU Game"></canvas>
<div id="ui-layer"></div>
<div id="webgpu-error">
  <div class="comic-card">
    <h2>WebGPU Required</h2>
    <p>Buffoon Platoon requires a browser with WebGPU enabled (Three.js r180 WebGPU renderer, no fallback).</p>
    <p class="err-detail" style="color:#f87171;"></p>
  </div>
</div>
<script type="module">
import * as THREE from 'three/webgpu';
import {
  color,
  normalLocal,
  positionLocal,
  normalView,
  positionViewDirection,
  dot,
  max,
  step,
  mix,
  float,
  uniform
} from 'three/tsl';
import RAPIER from '@dimforge/rapier3d-compat';

// ============================================================================
// MODULE: audio.js
// ============================================================================
// src/audio.js — Code-written procedural music, sound effects, and Animalese voice acting

class SoundSystem {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.musicGain = null;
    this.sfxGain = null;
    this.voiceGain = null;

    this.muted = false;
    this.masterVol = 0.8;
    this.musicVol = 0.55;
    this.sfxVol = 0.85;
    this.voiceVol = 0.85;

    this.currentTheme = 'beach';
    this.musicPlaying = false;
    this.stepIndex = 0;
    this.musicTimer = null;
    this.voiceTimers = [];
  }

  unlock() {
    if (!this.ctx) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.musicGain = this.ctx.createGain();
        this.sfxGain = this.ctx.createGain();
        this.voiceGain = this.ctx.createGain();

        this.musicGain.connect(this.masterGain);
        this.sfxGain.connect(this.masterGain);
        this.voiceGain.connect(this.masterGain);
        this.masterGain.connect(this.ctx.destination);
        this.updateVolumes();
      } catch {
        this.ctx = null;
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
    if (this.ctx && !this.musicPlaying) {
      this.startMusic();
    }
  }

  updateVolumes() {
    if (!this.ctx || !this.masterGain) return;
    const t = this.ctx.currentTime;
    this.masterGain.gain.setTargetAtTime(this.muted ? 0 : this.masterVol, t, 0.02);
    this.musicGain.gain.setTargetAtTime(this.musicVol * 0.35, t, 0.03);
    this.sfxGain.gain.setTargetAtTime(this.sfxVol, t, 0.02);
    this.voiceGain.gain.setTargetAtTime(this.voiceVol, t, 0.02);
  }

  setMuted(m) {
    this.muted = !!m;
    this.updateVolumes();
  }

  setTheme(theme) {
    if (this.currentTheme !== theme) {
      this.currentTheme = theme;
      this.stepIndex = 0;
    }
  }

  stopAll() {
    this.musicPlaying = false;
    if (this.musicTimer) {
      clearInterval(this.musicTimer);
      this.musicTimer = null;
    }
    this.clearVoice();
    if (this.ctx && this.masterGain) {
      try {
        this.masterGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.05);
      } catch {}
    }
  }

  startMusic() {
    if (this.musicPlaying || !this.ctx) return;
    this.musicPlaying = true;
    this.updateVolumes();

    // 16th-note sequencer at ~136 BPM (110ms per 16th step)
    const stepMs = 115;
    this.musicTimer = setInterval(() => {
      if (!this.musicPlaying || this.muted || !this.ctx || this.ctx.state !== 'running') return;
      this.playMusicStep(this.stepIndex++);
    }, stepMs);
  }

  midiToFreq(m) {
    return 440 * Math.pow(2, (m - 69) / 12);
  }

  playMusicStep(step) {
    const s = step % 32;
    const bar = Math.floor(step / 32) % 4;
    const t = this.ctx.currentTime;

    // Theme palettes inspired by 16-bit SNES Goof Troop island/grotto/boss music
    const themes = {
      beach: {
        // Sunny tropical calypso marimba + bouncy tuba bass
        lead: [
          72, 0, 76, 79, 84, 0, 79, 76, 74, 0, 77, 81, 79, 0, 76, 0,
          72, 0, 76, 79, 84, 86, 84, 79, 77, 0, 74, 71, 72, 0, 0, 0
        ],
        bass: [
          48, 0, 0, 48, 55, 0, 55, 0, 50, 0, 0, 50, 55, 0, 43, 0,
          48, 0, 0, 48, 52, 0, 55, 0, 53, 0, 50, 0, 48, 0, 43, 0
        ],
        chord: [60, 64, 67],
        leadWave: 'triangle',
        bassWave: 'sine'
      },
      grotto: {
        // Sneaky minor-key cavern xylophone & pizzicato bass
        lead: [
          69, 0, 72, 0, 76, 0, 75, 76, 81, 0, 76, 0, 72, 0, 69, 0,
          68, 0, 71, 0, 74, 0, 76, 0, 72, 0, 71, 68, 69, 0, 0, 0
        ],
        bass: [
          45, 0, 52, 0, 45, 0, 52, 0, 45, 0, 52, 0, 48, 0, 45, 0,
          40, 0, 47, 0, 40, 0, 47, 0, 45, 0, 47, 0, 45, 0, 0, 0
        ],
        chord: [57, 60, 64],
        leadWave: 'sine',
        bassWave: 'triangle'
      },
      fortress: {
        // Brassy courtyard march
        lead: [
          67, 67, 0, 74, 0, 72, 71, 69, 67, 0, 71, 74, 79, 0, 74, 0,
          76, 0, 74, 72, 71, 0, 69, 67, 69, 0, 66, 0, 67, 0, 0, 0
        ],
        bass: [
          43, 0, 50, 0, 43, 0, 50, 0, 43, 0, 47, 0, 50, 0, 43, 0,
          48, 0, 43, 0, 47, 0, 43, 0, 45, 0, 50, 0, 43, 0, 50, 0
        ],
        chord: [55, 59, 62],
        leadWave: 'sawtooth',
        bassWave: 'triangle'
      },
      boss: {
        // Captain Cragbeard's fast sea-shanty boss battle
        lead: [
          74, 74, 77, 74, 81, 0, 79, 0, 77, 76, 74, 72, 74, 0, 69, 0,
          74, 74, 77, 81, 86, 0, 84, 81, 79, 77, 76, 73, 74, 0, 0, 0
        ],
        bass: [
          50, 50, 62, 50, 53, 53, 60, 53, 48, 48, 55, 48, 50, 0, 45, 0,
          50, 50, 58, 50, 55, 55, 62, 55, 57, 0, 49, 0, 50, 0, 45, 48
        ],
        chord: [50, 53, 57],
        leadWave: 'square',
        bassWave: 'sawtooth'
      },
      victory: {
        lead: [
          72, 76, 79, 84, 0, 84, 88, 0, 86, 84, 79, 76, 79, 0, 0, 0,
          72, 76, 79, 84, 0, 88, 91, 0, 84, 0, 79, 0, 84, 0, 0, 0
        ],
        bass: [
          48, 0, 55, 0, 60, 0, 55, 0, 53, 0, 55, 0, 48, 0, 0, 0,
          48, 0, 52, 0, 55, 0, 60, 0, 48, 0, 55, 0, 48, 0, 0, 0
        ],
        chord: [60, 64, 67],
        leadWave: 'triangle',
        bassWave: 'triangle'
      }
    };

    const cfg = themes[this.currentTheme] || themes.beach;
    const transpose = bar === 2 ? 2 : bar === 3 ? -2 : 0;

    // Lead melody
    const note = cfg.lead[s];
    if (note > 0) {
      this.tone(this.midiToFreq(note + transpose), 0.13, cfg.leadWave, 0.22, this.musicGain, 0.008);
      // Marimba harmonic overtone
      if (this.currentTheme === 'beach' || this.currentTheme === 'grotto') {
        this.tone(this.midiToFreq(note + transpose + 12), 0.06, 'sine', 0.09, this.musicGain, 0.005);
      }
    }

    // Bouncy tuba / bassline
    const bNote = cfg.bass[s];
    if (bNote > 0) {
      this.tone(this.midiToFreq(bNote + transpose), 0.16, cfg.bassWave, 0.3, this.musicGain, 0.01);
    }

    // Offbeat island skank / chord stab
    if (s % 4 === 2) {
      for (const c of cfg.chord) {
        this.tone(this.midiToFreq(c + transpose), 0.06, 'triangle', 0.06, this.musicGain, 0.005);
      }
    }

    // Percussion (kick on 0, 8, 16, 24; rim/snare on 4, 12, 20, 28; shaker on odd steps)
    if (s % 8 === 0) {
      this.drumKick(t);
    } else if (s % 8 === 4) {
      this.drumSnare(t, 0.12);
    } else if (s % 2 === 1) {
      this.drumHihat(t, 0.035);
    }
  }

  tone(freq, dur, type = 'sine', gainVal = 0.2, dest = null, attack = 0.005, endFreq = null) {
    if (!this.ctx || this.muted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(30, freq), now);
    if (endFreq !== null) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(30, endFreq), now + dur);
    }
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(gainVal, now + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g);
    g.connect(dest || this.sfxGain);
    osc.start(now);
    osc.stop(now + dur + 0.01);
  }

  noiseBurst(dur, gainVal = 0.2, bandpassFreq = 1200, dest = null) {
    if (!this.ctx || this.muted) return;
    const now = this.ctx.currentTime;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    const src = this.ctx.createBufferSource();
    src.buffer = buf;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(bandpassFreq, now);
    filter.Q.setValueAtTime(1.4, now);

    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gainVal, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    src.connect(filter);
    filter.connect(g);
    g.connect(dest || this.sfxGain);
    src.start(now);
    src.stop(now + dur + 0.01);
  }

  drumKick(t) {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.frequency.setValueAtTime(130, t);
    osc.frequency.exponentialRampToValueAtTime(38, t + 0.09);
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    osc.connect(g).connect(this.musicGain);
    osc.start(t);
    osc.stop(t + 0.1);
  }

  drumSnare(t, vol = 0.12) {
    this.noiseBurst(0.07, vol, 1800, this.musicGain);
    this.tone(190, 0.05, 'triangle', vol * 0.7, this.musicGain, 0.002, 110);
  }

  drumHihat(t, vol = 0.04) {
    this.noiseBurst(0.03, vol, 6500, this.musicGain);
  }

  // ---- Gameplay Sound Effects ----
  sfx(name) {
    if (!this.ctx || this.muted) return;
    switch (name) {
      case 'kickBlock':
        this.tone(180, 0.11, 'square', 0.35, this.sfxGain, 0.002, 70);
        this.tone(280, 0.16, 'triangle', 0.28, this.sfxGain, 0.01, 520);
        this.noiseBurst(0.08, 0.22, 900);
        break;
      case 'blockStop':
        this.tone(110, 0.09, 'triangle', 0.35, this.sfxGain, 0.002, 55);
        this.noiseBurst(0.06, 0.25, 600);
        break;
      case 'bumperHit':
        this.tone(320, 0.15, 'sine', 0.35, this.sfxGain, 0.003, 640);
        this.tone(480, 0.12, 'triangle', 0.25, this.sfxGain, 0.01, 880);
        break;
      case 'switchOn':
        this.tone(523.25, 0.1, 'triangle', 0.3, this.sfxGain, 0.005);
        setTimeout(() => this.tone(659.25, 0.1, 'triangle', 0.3, this.sfxGain, 0.005), 60);
        setTimeout(() => this.tone(783.99, 0.18, 'triangle', 0.35, this.sfxGain, 0.005), 120);
        break;
      case 'gateOpen':
        this.noiseBurst(0.35, 0.3, 350);
        [523, 659, 784, 1046].forEach((f, i) => {
          setTimeout(() => this.tone(f, 0.22, 'triangle', 0.32, this.sfxGain, 0.01), i * 75);
        });
        break;
      case 'pickup':
        this.tone(300, 0.12, 'sine', 0.3, this.sfxGain, 0.005, 680);
        break;
      case 'throw':
        this.tone(520, 0.14, 'sine', 0.28, this.sfxGain, 0.005, 200);
        this.noiseBurst(0.08, 0.18, 1600);
        break;
      case 'potSmash':
        this.noiseBurst(0.18, 0.4, 2400);
        this.tone(240, 0.1, 'sawtooth', 0.28, this.sfxGain, 0.002, 90);
        break;
      case 'explode':
        this.noiseBurst(0.45, 0.55, 420);
        this.tone(140, 0.38, 'sawtooth', 0.45, this.sfxGain, 0.004, 32);
        break;
      case 'hookshot':
        this.tone(420, 0.16, 'sawtooth', 0.25, this.sfxGain, 0.004, 880);
        this.noiseBurst(0.1, 0.2, 3200);
        break;
      case 'shovel':
        this.noiseBurst(0.15, 0.32, 1400);
        this.tone(220, 0.12, 'triangle', 0.25, this.sfxGain, 0.005, 440);
        break;
      case 'bell':
        this.tone(880, 0.25, 'sine', 0.35, this.sfxGain, 0.003);
        this.tone(1760, 0.2, 'triangle', 0.2, this.sfxGain, 0.003);
        setTimeout(() => {
          this.tone(987.77, 0.28, 'sine', 0.35, this.sfxGain, 0.003);
          this.tone(1975.5, 0.2, 'triangle', 0.2, this.sfxGain, 0.003);
        }, 120);
        break;
      case 'lantern':
        this.noiseBurst(0.16, 0.22, 900);
        this.tone(660, 0.22, 'sine', 0.28, this.sfxGain, 0.01, 990);
        break;
      case 'enemyStun':
        // Classic cartoon boing + tweet
        this.tone(240, 0.22, 'sine', 0.35, this.sfxGain, 0.005, 620);
        setTimeout(() => this.tone(740, 0.12, 'sine', 0.22, this.sfxGain, 0.005, 920), 90);
        break;
      case 'enemyKO':
        // Goof Troop style bowling strike + comical Doppler holler ("Yaa-hoo-hoo-hooey!")
        this.noiseBurst(0.14, 0.35, 1500);
        this.tone(360, 0.14, 'sawtooth', 0.3, this.sfxGain, 0.005, 680);
        setTimeout(() => this.tone(680, 0.14, 'sawtooth', 0.28, this.sfxGain, 0.005, 520), 110);
        setTimeout(() => this.tone(520, 0.25, 'sawtooth', 0.25, this.sfxGain, 0.005, 980), 220);
        break;
      case 'playerHit':
        // Slapstick bongo bonk
        this.tone(310, 0.12, 'triangle', 0.38, this.sfxGain, 0.002, 140);
        setTimeout(() => this.tone(220, 0.16, 'sine', 0.32, this.sfxGain, 0.002, 420), 70);
        break;
      case 'collectGem':
        this.tone(880, 0.08, 'sine', 0.28, this.sfxGain, 0.003);
        setTimeout(() => this.tone(1174.66, 0.14, 'sine', 0.3, this.sfxGain, 0.003), 55);
        break;
      case 'collectFruit':
        [587.33, 783.99, 1046.5].forEach((f, i) => {
          setTimeout(() => this.tone(f, 0.1, 'triangle', 0.28, this.sfxGain, 0.003), i * 45);
        });
        break;
      case 'uiMove':
        this.tone(440, 0.045, 'triangle', 0.18, this.sfxGain, 0.002, 520);
        break;
      case 'uiConfirm':
        this.tone(523.25, 0.07, 'triangle', 0.24, this.sfxGain, 0.002);
        setTimeout(() => this.tone(783.99, 0.11, 'triangle', 0.26, this.sfxGain, 0.002), 50);
        break;
      case 'uiBack':
        this.tone(480, 0.08, 'triangle', 0.22, this.sfxGain, 0.002, 310);
        break;
    }
  }

  // ---- Animalese / Simlish Gibberish Voice Synthesizer ----
  clearVoice() {
    while (this.voiceTimers.length) {
      clearTimeout(this.voiceTimers.pop());
    }
  }

  speakAnimalese(text, speaker = 'barnaby') {
    this.clearVoice();
    if (!this.ctx || this.muted || !text) return;

    const profiles = {
      barnaby: { baseFreq: 145, wave: 'sawtooth', formant1: 650, formant2: 1200, rateMs: 58, wobble: 35 },
      kip:     { baseFreq: 265, wave: 'triangle', formant1: 950, formant2: 1950, rateMs: 46, wobble: 48 },
      daisy:   { baseFreq: 310, wave: 'sine',     formant1: 1100, formant2: 2200, rateMs: 48, wobble: 42 },
      pokey:   { baseFreq: 118, wave: 'sawtooth', formant1: 520, formant2: 980,  rateMs: 64, wobble: 28 },
      cragbeard: { baseFreq: 95, wave: 'sawtooth', formant1: 480, formant2: 920,  rateMs: 66, wobble: 25 },
      mayor:   { baseFreq: 235, wave: 'triangle', formant1: 880, formant2: 1650, rateMs: 52, wobble: 55 }
    };
    const p = profiles[speaker] || profiles.barnaby;
    const chars = String(text).replace(/[^a-zA-Z!?]/g, '').slice(0, 36).split('');

    chars.forEach((ch, idx) => {
      const timer = setTimeout(() => {
        if (!this.ctx || this.muted) return;
        const code = ch.toLowerCase().charCodeAt(0) || 97;
        const isExclaim = ch === '!' || ch === '?';
        const semiOffset = ((code * 7 + idx * 3) % 9) - 4 + (isExclaim ? 5 : 0);
        const f0 = p.baseFreq * Math.pow(2, semiOffset / 12);
        const fEnd = f0 * (isExclaim ? 1.32 : (idx % 2 === 0 ? 1.12 : 0.91));
        this.playVowelFormant(f0, fEnd, p.wave, p.formant1 + ((code % 5) * 90), p.rateMs * 0.0011);
      }, idx * p.rateMs);
      this.voiceTimers.push(timer);
    });
  }

  playVowelFormant(f0, fEnd, wave, formantFreq, dur) {
    if (!this.ctx || this.muted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const filter = this.ctx.createBiquadFilter();
    const g = this.ctx.createGain();

    osc.type = wave;
    osc.frequency.setValueAtTime(Math.max(55, f0), now);
    osc.frequency.linearRampToValueAtTime(Math.max(55, fEnd), now + dur);

    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(formantFreq, now);
    filter.Q.setValueAtTime(2.6, now);

    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.28, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);

    osc.connect(filter);
    filter.connect(g);
    g.connect(this.voiceGain);
    osc.start(now);
    osc.stop(now + dur + 0.01);
  }
}

class CelArtFactory {
  constructor() {
    this.outlineScaleUniform = uniform(1.0);
    this.gradientMap = this.createSteppedGradientTexture();
    this.matCache = new Map();
    this.outlineMatCache = new Map();
  }

  setOutlineScale(scale) {
    this.outlineScaleUniform.value = scale;
  }

  createSteppedGradientTexture() {
    // Crisp 4-band cartoon cel-shading ramp: deep shadow, mid shadow, main flat tone, bright highlight
    const data = new Uint8Array([
      75,  68,  98, 255,
      145, 138, 165, 255,
      228, 224, 235, 255,
      255, 255, 255, 255
    ]);
    const tex = new THREE.DataTexture(data, 4, 1, THREE.RGBAFormat);
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    tex.generateMipmaps = false;
    tex.needsUpdate = true;
    return tex;
  }

  getCelMaterial(hexColor, opts = {}) {
    const key = `${hexColor}_${opts.emissive || 0}_${opts.rim || 0.22}`;
    if (this.matCache.has(key)) return this.matCache.get(key);

    const baseCol = new THREE.Color(hexColor);
    const rimCol = baseCol.clone().lerp(new THREE.Color(0xfff6d6), 0.65);

    const mat = new THREE.MeshToonNodeMaterial({
      color: baseCol,
      gradientMap: this.gradientMap
    });

    // TSL rim highlight for unmistakable comic-book cel pop
    const nDotV = max(float(0.0), dot(normalView, positionViewDirection));
    const rimFactor = step(float(0.72), float(1.0).sub(nDotV)).mul(float(opts.rim ?? 0.24));
    if (opts.emissive) {
      mat.emissiveNode = color(opts.emissive);
    } else {
      mat.emissiveNode = mix(color(0x000000), color(rimCol), rimFactor);
    }

    this.matCache.set(key, mat);
    return mat;
  }

  getOutlineMaterial(thickness = 0.042, inkHex = 0x160e24) {
    const key = `${thickness}_${inkHex}`;
    if (this.outlineMatCache.has(key)) return this.outlineMatCache.get(key);

    const mat = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide });
    mat.colorNode = color(inkHex);
    mat.positionNode = positionLocal.add(
      normalLocal.mul(float(thickness).mul(this.outlineScaleUniform))
    );
    this.outlineMatCache.set(key, mat);
    return mat;
  }

  celMesh(geometry, hexColor, outlineThickness = 0.04, opts = {}) {
    const mat = this.getCelMaterial(hexColor, opts);
    const mesh = new THREE.Mesh(geometry, mat);
    mesh.castShadow = opts.castShadow !== false;
    mesh.receiveShadow = opts.receiveShadow !== false;

    if (outlineThickness > 0) {
      const outMat = this.getOutlineMaterial(outlineThickness, opts.inkColor || 0x160e24);
      const outMesh = new THREE.Mesh(geometry, outMat);
      outMesh.castShadow = false;
      outMesh.receiveShadow = false;
      mesh.add(outMesh);
    }
    return mesh;
  }

  // ---- Playable Hero Model (Barnaby, Kip, Daisy, Pokey) ----

    const root = new THREE.Group();

    // Shadow blob on floor

    const shadowMat = new THREE.MeshBasicNodeMaterial({
      color: 0x0b0714,

    });
    const shadowBlob = new THREE.Mesh(shadowGeo, shadowMat);
    shadowBlob.position.y = 0.03;
    root.add(shadowBlob);

    // Legs & Big Goof Boots
    const leftLeg = new THREE.Group();

    for (const leg of [leftLeg, rightLeg]) {

    // Vest / Stripes detail

    // Arms & White Cartoon Gloves

      leftLeg,

      carryMount,

  // ---- Pirate Enemies & Captain Cragbeard Boss ----
  createEnemyModel(type = 'swashbuckler') {

    const isBoss = type === 'boss';

    // Shadow
    const shadowGeo = new THREE.CircleGeometry(0.6 * scale, 16);
    shadowGeo.rotateX(-Math.PI / 2);
    const shadowMesh = new THREE.Mesh(
      shadowGeo,
      new THREE.MeshBasicNodeMaterial({ color: 0x0b0714, transparent: true, opacity: 0.4 })

    shadowMesh.position.y = 0.03;

    const legGeo = new THREE.CylinderGeometry(0.12 * scale, 0.1 * scale, 0.38 * scale, 8);
    for (let i = 0; i < 2; i++) {
      const leg = i === 0 ? leftLeg : rightLeg;
      const isPegLeg = isBoss && i === 1;
      const mesh = this.celMesh(

    const rightEye = this.celMesh(eyeGeo, 0x111111, 0.015); // Eyepatch!
    rightEye.scale.set(1.3, 1.3, 0.6);
    rightEye.position.set(0.12 * scale, 0.08 * scale, 0.29 * scale);
    head.add(leftEye, rightEye);

    // Pirate Headgear
    if (isBoss) {
      // Giant Captain Bicorne Hat + Skull Emblem

      hatBrim.position.y = 0.32 * scale;
      const skull = this.celMesh(new THREE.SphereGeometry(0.12 * scale, 8, 8), 0xf8fafc, 0.02);
      skull.position.set(0, 0.34 * scale, 0.24 * scale);
      const plume = this.celMesh(new THREE.SphereGeometry(0.18 * scale, 8, 8), 0xef4444, 0.025);
      plume.position.set(-0.28 * scale, 0.52 * scale, 0);

    } else if (isIronclad) {
      // Horned Viking/Pirate Iron Helmet
      const helm = this.celMesh(new THREE.SphereGeometry(0.37 * scale, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), 0x334155, 0.03);
      helm.position.y = 0.06 * scale;
      const hornGeo = new THREE.ConeGeometry(0.08 * scale, 0.32 * scale, 6);
      const hL = this.celMesh(hornGeo, 0xfef3c7, 0.02);

      hL.rotation.z = 0.6;
      const hR = this.celMesh(hornGeo, 0xfef3c7, 0.02);

      bandana.position.y = 0.05 * scale;

    torso.add(head);

    leftArm.position.set(-0.46 * scale, 0.18 * scale, 0);

      const blade = this.celMesh(bladeGeo, 0xe2e8f0, 0.02 * scale);

      const ang = (i / 4) * Math.PI * 2;
      st.position.set(Math.cos(ang) * 0.5 * scale, 0, Math.sin(ang) * 0.5 * scale);
      stunRing.add(st);
    }
    torso.add(stunRing);

    root.userData.parts = { rig, torso, head, leftArm, rightArm, leftLeg, rightLeg, stunRing, scale };
    return root;
  }

  // ---- Signature Goof Troop Kickable Star-Block (and Bomb-Block) ----
  createStarBlockModel(isBombBlock = false) {
    const group = new THREE.Group();
    const blockColor = isBombBlock ? 0x3b1d2e : 0xd97706;
    const trimColor = isBombBlock ? 0xef4444 : 0xfbbf24;

    const cubeGeo = new THREE.BoxGeometry(1.52, 1.52, 1.52);
    const cube = this.celMesh(cubeGeo, blockColor, 0.06);
    cube.position.y = 0.78;
    group.add(cube);

    // Embossed 5-pointed / 8-pointed Star Emblem on top and 4 sides
    const starGroup = new THREE.Group();
    const starPartA = new THREE.BoxGeometry(0.76, 0.14, 0.76);
    const starPartB = new THREE.BoxGeometry(0.76, 0.14, 0.76);
    starPartB.rotateY(Math.PI / 4);

    const topA = this.celMesh(starPartA, trimColor, 0.025, { emissive: isBombBlock ? 0x7f1d1d : 0x451a03 });
    const topB = this.celMesh(starPartB, trimColor, 0.025, { emissive: isBombBlock ? 0x7f1d1d : 0x451a03 });
    topA.position.y = 0.76;
    topB.position.y = 0.76;
    starGroup.add(topA, topB);

    // Side stars
    const sideGeo = new THREE.OctahedronGeometry(0.38, 0);
    for (const [dx, dz] of [[0.78, 0], [-0.78, 0], [0, 0.78], [0, -0.78]]) {
      const s = this.celMesh(sideGeo, trimColor, 0.02);
      s.position.set(dx, 0, dz);
      s.scale.set(dx !== 0 ? 0.25 : 1, 1, dz !== 0 ? 0.25 : 1);
      starGroup.add(s);
    }
    cube.add(starGroup);

    if (isBombBlock) {
      const fuse = this.celMesh(new THREE.CylinderGeometry(0.06, 0.06, 0.4, 8), 0xfef08a, 0.015, { emissive: 0xf97316 });
      fuse.position.y = 0.96;
      cube.add(fuse);
    }

    group.userData.cube = cube;
    return group;
  }

  // ---- Floor Switches (Star Block Switch & Co-op Foot Switch) ----
  createSwitchPlateModel(kind = 'star') {
    const group = new THREE.Group();
    const frameColor = kind === 'star' ? 0x475569 : 0x1e3a8a;
    const plateColor = kind === 'star' ? 0xf59e0b : 0x38bdf8;

    const baseGeo = new THREE.BoxGeometry(1.76, 0.12, 1.76);
    const base = this.celMesh(baseGeo, frameColor, 0.035);
    base.position.y = 0.06;
    group.add(base);

    const innerGeo = new THREE.BoxGeometry(1.36, 0.16, 1.36);
    const plate = this.celMesh(innerGeo, plateColor, 0.03);
    plate.position.y = 0.12;
    group.add(plate);

    // Star / Foot emblem
    const emblemGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.06, kind === 'star' ? 5 : 12);
    const emblem = this.celMesh(emblemGeo, 0xfef08a, 0.015);
    emblem.position.y = 0.21;
    group.add(emblem);

    group.userData.plate = plate;
    group.userData.emblem = emblem;
    group.userData.kind = kind;
    return group;
  }

  // ---- Angled 45-Degree Bumper Post (Redirects Sliding Star-Blocks!) ----
  createBumperModel(orientation = 0) {
    // orientation 0..3: deflects sliding blocks around corners
    const group = new THREE.Group();
    const postGeo = new THREE.CylinderGeometry(0.55, 0.62, 1.25, 6);
    const post = this.celMesh(postGeo, 0xb45309, 0.05);
    post.position.y = 0.62;

    const bandGeo = new THREE.CylinderGeometry(0.64, 0.64, 0.32, 12);
    const band = this.celMesh(bandGeo, 0xfacc15, 0.035, { emissive: 0x78350f });
    band.position.y = 0.62;

    // Direction arrow chevron on top
    const arrowGeo = new THREE.ConeGeometry(0.32, 0.55, 4);
    arrowGeo.rotateX(Math.PI / 2);
    const arrow = this.celMesh(arrowGeo, 0x38bdf8, 0.025);
    arrow.position.y = 1.32;
    arrow.rotation.y = (orientation * Math.PI) / 2 + Math.PI / 4;

    group.add(post, band, arrow);
    return group;
  }

  // ---- Carryable & Interactive Props (Pots, Barrels, Coconut Bombs, Planks, Keys) ----
  createCarryItemModel(kind = 'pot') {
    const group = new THREE.Group();
    if (kind === 'pot') {
      const belly = this.celMesh(new THREE.SphereGeometry(0.5, 12, 10), 0xc2410c, 0.04);
      belly.scale.set(1, 1.05, 1);
      belly.position.y = 0.48;
      const rim = this.celMesh(new THREE.CylinderGeometry(0.38, 0.3, 0.22, 12), 0xea580c, 0.03);
      rim.position.y = 0.92;
      const stripe = this.celMesh(new THREE.CylinderGeometry(0.51, 0.51, 0.14, 12), 0xfde047, 0.015);
      stripe.position.y = 0.5;
      group.add(belly, rim, stripe);
    } else if (kind === 'barrel') {
      const cyl = this.celMesh(new THREE.CylinderGeometry(0.46, 0.46, 1.05, 12), 0x92400e, 0.045);
      cyl.position.y = 0.52;
      const hoop1 = this.celMesh(new THREE.CylinderGeometry(0.48, 0.48, 0.1, 12), 0x334155, 0.02);
      hoop1.position.y = 0.78;
      const hoop2 = hoop1.clone();
      hoop2.position.y = 0.26;
      group.add(cyl, hoop1, hoop2);
    } else if (kind === 'bomb') {
      const orb = this.celMesh(new THREE.SphereGeometry(0.46, 12, 12), 0x1e1b4b, 0.045);
      orb.position.y = 0.46;
      const cap = this.celMesh(new THREE.CylinderGeometry(0.16, 0.2, 0.16, 8), 0xf59e0b, 0.02);
      cap.position.y = 0.92;
      const spark = this.celMesh(new THREE.OctahedronGeometry(0.16, 0), 0xfef08a, 0.02, { emissive: 0xef4444 });
      spark.position.y = 1.1;
      group.add(orb, cap, spark);
      group.userData.spark = spark;
      group.userData.orb = orb;
    } else if (kind === 'plank') {
      const board = this.celMesh(new THREE.BoxGeometry(1.4, 0.2, 2.2), 0xb45309, 0.04);
      board.position.y = 0.18;
      const cleat1 = this.celMesh(new THREE.BoxGeometry(1.44, 0.24, 0.24), 0x78350f, 0.02);
      cleat1.position.set(0, 0.18, -0.75);
      const cleat2 = cleat1.clone();
      cleat2.position.z = 0.75;
      group.add(board, cleat1, cleat2);
    } else if (kind === 'key' || kind === 'bossKey') {
      const isBossKey = kind === 'bossKey';
      const col = isBossKey ? 0xfacc15 : 0xf59e0b;
      const bow = this.celMesh(new THREE.TorusGeometry(0.28, 0.09, 8, 12), col, 0.03, { emissive: 0x78350f });
      bow.rotation.x = Math.PI / 2;
      bow.position.set(0, 0.55, -0.25);
      const stem = this.celMesh(new THREE.CylinderGeometry(0.08, 0.08, 0.65, 8), col, 0.025);
      stem.rotation.x = Math.PI / 2;
      stem.position.set(0, 0.55, 0.22);
      const teeth = this.celMesh(new THREE.BoxGeometry(0.22, 0.12, 0.22), col, 0.02);
      teeth.position.set(0.12, 0.55, 0.42);
      group.add(bow, stem, teeth);
    }
    return group;
  }

  // ---- Collectibles (Cherries, Bananas, Gems, Tool Pickups) ----
  createCollectibleModel(kind = 'cherry') {
    const group = new THREE.Group();
    if (kind === 'cherry') {
      const c1 = this.celMesh(new THREE.SphereGeometry(0.24, 10, 10), 0xef4444, 0.03, { emissive: 0x7f1d1d });
      c1.position.set(-0.16, 0.35, 0);
      const c2 = this.celMesh(new THREE.SphereGeometry(0.24, 10, 10), 0xef4444, 0.03, { emissive: 0x7f1d1d });
      c2.position.set(0.16, 0.35, 0.06);
      const leaf = this.celMesh(new THREE.BoxGeometry(0.36, 0.08, 0.16), 0x22c55e, 0.02);
      leaf.position.set(0, 0.72, 0);
      group.add(c1, c2, leaf);
    } else if (kind === 'banana') {
      const b1 = this.celMesh(new THREE.CapsuleGeometry(0.14, 0.48, 4, 8), 0xfacc15, 0.03, { emissive: 0x713f12 });
      b1.rotation.z = 0.45;
      b1.position.set(0, 0.48, 0);
      group.add(b1);
    } else if (kind === 'gem') {
      const gem = this.celMesh(new THREE.OctahedronGeometry(0.36, 0), 0x38bdf8, 0.035, { emissive: 0x0284c7 });
      gem.position.y = 0.55;
      group.add(gem);
    } else {
      // Tool pickup (hookshot, shovel, lantern, bell, plank)
      const ped = this.celMesh(new THREE.CylinderGeometry(0.52, 0.62, 0.24, 10), 0x6366f1, 0.035);
      ped.position.y = 0.12;
      const icon = this.celMesh(new THREE.OctahedronGeometry(0.38, 1), 0xfacc15, 0.035, { emissive: 0xd97706 });
      icon.position.y = 0.68;
      group.add(ped, icon);
      group.userData.icon = icon;
    }
    return group;
  }

  // ---- Island Environment Props ----
  createPalmTreeModel(seed = 0.5) {
    const group = new THREE.Group();
    const trunkH = 3.2 + (seed % 1) * 1.1;
    const trunkGeo = new THREE.CylinderGeometry(0.24, 0.42, trunkH, 8);
    const trunk = this.celMesh(trunkGeo, 0x92400e, 0.05);
    trunk.position.y = trunkH / 2;
    trunk.rotation.z = (seed - 0.5) * 0.22;
    group.add(trunk);

    const crown = new THREE.Group();
    crown.position.set(Math.sin(trunk.rotation.z) * (-trunkH * 0.45), trunkH, 0);
    const frondGeo = new THREE.BoxGeometry(0.55, 0.12, 1.95);
    frondGeo.translate(0, 0, 0.9);
    for (let i = 0; i < 6; i++) {
      const frond = this.celMesh(frondGeo, i % 2 === 0 ? 0x22c55e : 0x16a34a, 0.04);
      frond.rotation.y = (i / 6) * Math.PI * 2;
      frond.rotation.x = 0.38;
      crown.add(frond);
    }
    // Coconuts under fronds
    for (let i = 0; i < 3; i++) {
      const coco = this.celMesh(new THREE.SphereGeometry(0.22, 8, 8), 0x451a03, 0.025);
      const a = (i / 3) * Math.PI * 2;
      coco.position.set(Math.cos(a) * 0.3, -0.15, Math.sin(a) * 0.3);
      crown.add(coco);
    }
    group.add(crown);
    return group;
  }

  createHookPostModel() {
    const group = new THREE.Group();
    const post = this.celMesh(new THREE.CylinderGeometry(0.32, 0.38, 1.45, 10), 0x78350f, 0.045);
    post.position.y = 0.72;
    const ring = this.celMesh(new THREE.TorusGeometry(0.34, 0.09, 8, 12), 0xfacc15, 0.03, { emissive: 0x854d0e });
    ring.position.y = 1.25;
    group.add(post, ring);
    return group;
  }

  createDigSpotModel() {
    const group = new THREE.Group();
    const mound = this.celMesh(new THREE.CylinderGeometry(0.65, 0.85, 0.14, 12), 0xd97706, 0.03);
    mound.position.y = 0.07;
    const barA = this.celMesh(new THREE.BoxGeometry(0.95, 0.08, 0.22), 0xef4444, 0.02);
    barA.position.y = 0.15;
    barA.rotation.y = Math.PI / 4;
    const barB = barA.clone();
    barB.rotation.y = -Math.PI / 4;
    group.add(mound, barA, barB);
    return group;
  }

  createBrazierModel(lit = false) {
    const group = new THREE.Group();
    const stand = this.celMesh(new THREE.CylinderGeometry(0.42, 0.55, 1.1, 10), 0x334155, 0.04);
    stand.position.y = 0.55;
    const bowl = this.celMesh(new THREE.SphereGeometry(0.52, 10, 8, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), 0x1e293b, 0.035);
    bowl.position.y = 1.15;
    const flame = this.celMesh(new THREE.ConeGeometry(0.34, 0.75, 8), 0xf97316, 0.03, { emissive: 0xfacc15 });
    flame.position.y = 1.45;
    flame.visible = lit;
    group.add(stand, bowl, flame);
    group.userData.flame = flame;
    return group;
  }
}

// ============================================================================
// MODULE: input.js
// ============================================================================
// src/input.js — 10-Foot Controller-First Input System (DualSense / Standard Gamepad + Keyboard/Mouse)

const PAD = {
  cross: 0,
  circle: 1,
  square: 2,
  triangle: 3,
  l1: 4,
  r1: 5,
  l2: 6,
  r2: 7,
  create: 8,
  options: 9,
  l3: 10,
  r3: 11,
  up: 12,
  down: 13,
  left: 14,
  right: 15
};

class InputManager {
  constructor() {
    this.keys = new Set();
    this.justKeys = new Set();
    this.mouseDown = false;
    this.rightMouseDown = false;
    this.justMouse = false;
    this.justRightMouse = false;

    this.padsNow = [];
    this.padsWas = [];
    this.latchedPadEdges = []; // Latches short button presses between render frames
    this.connectedPads = [];

    // Gamepad axis inversion quick-fix toggles (Settings menu)
    this.invertHorizontal = false;
    this.invertVertical = false;

    this.lastInputAt = performance.now();
    this.hasKeyboardOrGamepad = false;
    this.isTouchOnly = this.detectTouchOnly();

    this.probeInput = { x: 0, y: 0, action: false, tool: false };
    this.anyInputEdge = false;

    this.bindEvents();
    // High-frequency 16ms gamepad sampler so short synthetic or real presses are never missed
    this.fastSampler = setInterval(() => this.sampleGamepadsFast(), 16);
  }

  detectTouchOnly() {
    try {
      return !!(
        window.matchMedia &&
        window.matchMedia('(pointer: coarse) and (hover: none)').matches
      );
    } catch {
      return false;
    }
  }

  bindEvents() {
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (!this.keys.has(k)) {
        this.justKeys.add(k);
        this.justKeys.add(e.key);
      }
      this.keys.add(k);
      this.keys.add(e.key);
      this.lastInputAt = performance.now();
      this.hasKeyboardOrGamepad = true;
      this.isTouchOnly = false;
      this.anyInputEdge = true;
    });

    window.addEventListener('keyup', (e) => {
      this.keys.delete(e.key.toLowerCase());
      this.keys.delete(e.key);
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse') {
        this.hasKeyboardOrGamepad = true;
        this.isTouchOnly = false;
      }
      if (e.button === 2) {
        this.rightMouseDown = true;
        this.justRightMouse = true;
      } else {
        this.mouseDown = true;
        this.justMouse = true;
      }
      this.lastInputAt = performance.now();
      this.anyInputEdge = true;
    });

    window.addEventListener('pointerup', (e) => {
      if (e.button === 2) this.rightMouseDown = false;
      else this.mouseDown = false;
    });

    window.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('gamepadconnected', () => {
      this.hasKeyboardOrGamepad = true;
      this.isTouchOnly = false;
      this.lastInputAt = performance.now();
    });
  }

  readRawPads() {
    const navPads = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter((p) => p && p.connected) : [];
    return navPads.map((p) => ({
      buttons: p.buttons.map((b) => !!(b && (b.pressed || b.value > 0.5))),
      axes: p.axes ? p.axes.slice() : [0, 0, 0, 0]
    }));
  }

  sampleGamepadsFast() {
    const snapshots = this.readRawPads();
    if (!snapshots.length) return;
    this.hasKeyboardOrGamepad = true;
    this.isTouchOnly = false;

    for (let pi = 0; pi < snapshots.length; pi++) {
      const cur = snapshots[pi];
      const prev = this.padsFastPrev?.[pi];
      if (!this.latchedPadEdges[pi]) this.latchedPadEdges[pi] = {};
      cur.buttons.forEach((pressed, bi) => {
        if (pressed && (!prev || !prev.buttons[bi])) {
          // Ignore Options edge if Create (button 8) is held!
          if (bi === PAD.options && cur.buttons[PAD.create]) return;
          this.latchedPadEdges[pi][bi] = true;
          this.lastInputAt = performance.now();
          if (bi !== PAD.create && bi !== PAD.options) {
            this.anyInputEdge = true;
          }
        }
      });
    }
    this.padsFastPrev = snapshots;
  }

  poll(menuOpen = false) {
    this.sampleGamepadsFast();
    const snapshots = this.readRawPads();
    this.padsWas = this.padsNow;
    this.padsNow = snapshots;

    for (let pi = 0; pi < this.padsNow.length; pi++) {
      const cur = this.padsNow[pi];
      if (Math.hypot(cur.axes[0] || 0, cur.axes[1] || 0) > 0.35) {
        this.lastInputAt = performance.now();
        this.anyInputEdge = true;
      }
    }

    const p0 = this.padsNow[0];
    const p0Was = this.padsWas[0];

    // Menu toggle check: Esc or Options (button 9), EXCEPT when Create (button 8) is held!
    const padOptionsEdge = !!(
      this.consumePadEdge(0, PAD.options) &&
      !(p0 && p0.buttons[PAD.create])
    );
    const escEdge = this.justKeys.has('Escape') || this.justKeys.has('escape');
    const menuToggle = padOptionsEdge || escEdge;

    // UI Navigation edges
    const stickUpEdge = !!(p0 && (p0.axes[1] || 0) < -0.55 && (!p0Was || (p0Was.axes[1] || 0) >= -0.55));
    const stickDownEdge = !!(p0 && (p0.axes[1] || 0) > 0.55 && (!p0Was || (p0Was.axes[1] || 0) <= 0.55));
    const stickLeftEdge = !!(p0 && (p0.axes[0] || 0) < -0.55 && (!p0Was || (p0Was.axes[0] || 0) >= -0.55));
    const stickRightEdge = !!(p0 && (p0.axes[0] || 0) > 0.55 && (!p0Was || (p0Was.axes[0] || 0) <= 0.55));

    const uiUp =
      this.justKeys.has('ArrowUp') ||
      this.justKeys.has('w') ||
      this.consumePadEdge(0, PAD.up) ||
      stickUpEdge;
    const uiDown =
      this.justKeys.has('ArrowDown') ||
      this.justKeys.has('s') ||
      this.consumePadEdge(0, PAD.down) ||
      stickDownEdge;
    const uiLeft =
      this.justKeys.has('ArrowLeft') ||
      this.justKeys.has('a') ||
      this.consumePadEdge(0, PAD.left) ||
      stickLeftEdge;
    const uiRight =
      this.justKeys.has('ArrowRight') ||
      this.justKeys.has('d') ||
      this.consumePadEdge(0, PAD.right) ||
      stickRightEdge;
    const uiConfirm =
      this.justKeys.has('Enter') ||
      this.justKeys.has(' ') ||
      (menuOpen && this.consumePadEdge(0, PAD.cross));
    const uiBack =
      this.justKeys.has('Backspace') ||
      (menuOpen && this.consumePadEdge(0, PAD.circle));

    // Primary local player controls (still while menuOpen is true!)
    const p1 = this.readPlayerControls(0, menuOpen, true);

    this.probeInput = {
      x: Math.round(p1.x * 100) / 100,
      y: Math.round(p1.y * 100) / 100,
      action: p1.actionHeld,
      tool: p1.toolHeld
    };

    const hadAnyInput = this.anyInputEdge;

    // Clear frame edge sets
    this.justKeys.clear();
    this.latchedPadEdges = [];
    this.justMouse = false;
    this.justRightMouse = false;
    this.anyInputEdge = false;

    return {
      menuToggle,
      uiUp,
      uiDown,
      uiLeft,
      uiRight,
      uiConfirm: uiConfirm || (!menuOpen && p1.actionPressed),
      uiBack,
      hadAnyInput,
      p1
    };
  }

  consumePadEdge(padIdx, btnIdx) {
    const latched = !!(this.latchedPadEdges[padIdx] && this.latchedPadEdges[padIdx][btnIdx]);
    if (latched) delete this.latchedPadEdges[padIdx][btnIdx];
    const cur = this.padsNow[padIdx];
    const prev = this.padsWas[padIdx];
    const frameEdge = !!(cur && cur.buttons[btnIdx] && (!prev || !prev.buttons[btnIdx]));
    return latched || frameEdge;
  }

  padButtonHeld(padIdx, btnIdx) {
    const cur = this.padsNow[padIdx];
    return !!(cur && cur.buttons[btnIdx]);
  }

  readPlayerControls(slot = 0, menuOpen = false, allowKeyboard = true) {
    if (menuOpen) {
      return {
        x: 0,
        y: 0,
        actionHeld: false,
        actionPressed: false,
        toolHeld: false,
        toolPressed: false,
        cyclePressed: false,
        buddyPressed: false
      };
    }

    let x = 0;
    let y = 0;

    if (allowKeyboard && slot === 0) {
      if (this.keys.has('arrowleft') || this.keys.has('a')) x -= 1;
      if (this.keys.has('arrowright') || this.keys.has('d')) x += 1;
      if (this.keys.has('arrowup') || this.keys.has('w')) y -= 1;
      if (this.keys.has('arrowdown') || this.keys.has('s')) y += 1;
    } else if (allowKeyboard && slot === 1 && this.padsNow.length < 2) {
      if (this.keys.has('j')) x -= 1;
      if (this.keys.has('l')) x += 1;
      if (this.keys.has('i')) y -= 1;
      if (this.keys.has('k')) y += 1;
    }

    const pad = this.padsNow[slot];
    if (pad) {
      const invX = this.invertHorizontal ? -1 : 1;
      const invY = this.invertVertical ? -1 : 1;
      if (Math.abs(pad.axes[0] || 0) > 0.2) x = pad.axes[0] * invX;
      if (Math.abs(pad.axes[1] || 0) > 0.2) y = pad.axes[1] * invY;
      if (pad.buttons[PAD.left]) x = -1 * invX;
      if (pad.buttons[PAD.right]) x = 1 * invX;
      if (pad.buttons[PAD.up]) y = -1 * invY;
      if (pad.buttons[PAD.down]) y = 1 * invY;
    }

    const len = Math.hypot(x, y);
    if (len > 1) {
      x /= len;
      y /= len;
    }

    const kbActionHeld = allowKeyboard && slot === 0 && (this.keys.has(' ') || this.keys.has('enter') || this.keys.has('z') || this.mouseDown);
    const kbActionPressed = allowKeyboard && slot === 0 && (this.justKeys.has(' ') || this.justKeys.has('Enter') || this.justKeys.has('z') || this.justMouse);

    const kbToolHeld = allowKeyboard && slot === 0 && (this.keys.has('e') || this.keys.has('x') || this.rightMouseDown);
    const kbToolPressed = allowKeyboard && slot === 0 && (this.justKeys.has('e') || this.justKeys.has('x') || this.justRightMouse);

    const kbCyclePressed = allowKeyboard && slot === 0 && (this.justKeys.has('q') || this.justKeys.has('Tab'));
    const kbBuddyPressed = allowKeyboard && slot === 0 && (this.justKeys.has('r') || this.justKeys.has('c'));

    const actionHeld =
      kbActionHeld ||
      this.padButtonHeld(slot, PAD.cross) ||
      this.padButtonHeld(slot, PAD.r2) ||
      this.padButtonHeld(slot, PAD.r1);
    const actionPressed =
      kbActionPressed ||
      this.consumePadEdge(slot, PAD.cross) ||
      this.consumePadEdge(slot, PAD.r2) ||
      this.consumePadEdge(slot, PAD.r1);

    const toolHeld =
      kbToolHeld ||
      this.padButtonHeld(slot, PAD.square) ||
      this.padButtonHeld(slot, PAD.circle) ||
      this.padButtonHeld(slot, PAD.l2);
    const toolPressed =
      kbToolPressed ||
      this.consumePadEdge(slot, PAD.square) ||
      this.consumePadEdge(slot, PAD.circle) ||
      this.consumePadEdge(slot, PAD.l2);

    const cyclePressed =
      kbCyclePressed ||
      this.consumePadEdge(slot, PAD.l1);

    const buddyPressed =
      kbBuddyPressed ||
      this.consumePadEdge(slot, PAD.triangle) ||
      this.consumePadEdge(slot, PAD.r3);

    return {
      x,
      y,
      actionHeld,
      actionPressed,
      toolHeld,
      toolPressed,
      cyclePressed,
      buddyPressed
    };
  }
}

function hubNet(info) {
  return {
    kind: 'aihub',
    me: info.me,
    host: info.host,
    isHost: info.isHost,
    server: !!info.server,
    splash: !!info.splash,
    players: info.players.map((p, idx) => ({
      id: p.id,
      name: p.name,
      color: p.color || CHARACTERS[idx % 4].color
    })),
    seed: info.seed >>> 0,
    time: () => window.AIHub.time(),
    rng: (label) => window.AIHub.rng(label),
    send: (data, opts) => window.AIHub.send(data, opts),
    onMessage: (fn) => window.AIHub.on('message', fn),
    onLeave: (fn) => window.AIHub.on('leave', ({ id, reason }) => fn(id, reason)),
    finish: (outcome) => window.AIHub.finish(outcome),
    close: () => {}
  };
}

/**
 * Standalone Room Multiplayer Adapter (BroadcastChannel across tabs + optional PeerJS WebRTC)
 * Never used when AIHub.active is true.
 */
function createStandaloneRoomNet({ roomCode = 'GOOF', isHost = true, onRosterChange = () => {} }) {
  if (window.AIHub && window.AIHub.active) return null;

  const code = String(roomCode || 'GOOF').toUpperCase().trim().slice(0, 8);
  const startTime = performance.now();
  const msgHandlers = [];
  const leaveHandlers = [];
  let closed = false;

  const players = [
    {
      id: 0,
      name: CHARACTERS[0].name,
      color: CHARACTERS[0].color
    }
  ];

  let myId = isHost ? 0 : -1;
  const bcName = `buffoon_platoon_room_${code}`;
  const channel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(bcName) : null;

  const deliver = (data, from) => {
    for (const fn of msgHandlers) {
      try {
        fn(data, from);
      } catch {}
    }
  };

  if (channel) {
    channel.onmessage = (ev) => {
      if (closed || !ev.data) return;
      const m = ev.data;
      if (isHost && m.sys === 'join_req') {
        let assigned = players.find((p) => p.clientKey === m.clientKey);
        if (!assigned && players.length < 4) {
          const newId = players.length;
          assigned = {
            id: newId,
            clientKey: m.clientKey,
            name: CHARACTERS[newId % 4].name,
            color: CHARACTERS[newId % 4].color
          };
          players.push(assigned);
        }
        if (assigned) {
          channel.postMessage({
            sys: 'welcome_room',
            targetKey: m.clientKey,
            assignedId: assigned.id,
            players: players.map(({ id, name, color }) => ({ id, name, color }))
          });
          onRosterChange(players.slice());
        }
        return;
      }

      if (!isHost && m.sys === 'welcome_room') {
        if (m.targetKey === clientKey && myId === -1) {
          myId = m.assignedId;
        }
        players.splice(0, players.length, ...m.players);
        onRosterChange(players.slice());
        return;
      }

      if (m.sys === 'leave_room') {
        const idx = players.findIndex((p) => p.id === m.from);
        if (idx !== -1) players.splice(idx, 1);
        for (const fn of leaveHandlers) fn(m.from, 'left');
        onRosterChange(players.slice());
        return;
      }

      if (m.sys === 'game_pkt') {
        if (m.from === myId) return;
        if (m.to !== undefined && m.to !== null && m.to !== myId) return;
        deliver(m.data, m.from);
      }
    };
  }

  const clientKey = 'c_' + Math.floor(Math.random() * 1e9);
  if (!isHost && channel) {
    channel.postMessage({ sys: 'join_req', clientKey });
  } else {
    onRosterChange(players.slice());
  }

  return {
    kind: 'standalone-room',
    roomCode: code,
    get me() {
      return myId === -1 ? 1 : myId;
    },
    host: 0,
    isHost,
    server: false,
    splash: false,
    get players() {
      return players;
    },
    seed: 133742,
    time: () => performance.now() - startTime,
    rng: () => Math.random,
    send: (data, opts = {}) => {
      if (closed || !channel) return false;
      channel.postMessage({
        sys: 'game_pkt',
        from: myId === -1 ? 1 : myId,
        to: opts.to ?? null,
        data
      });
      return true;
    },
    onMessage: (fn) => {
      msgHandlers.push(fn);
      return () => {
        const i = msgHandlers.indexOf(fn);
        if (i !== -1) msgHandlers.splice(i, 1);
      };
    },
    onLeave: (fn) => {
      leaveHandlers.push(fn);
    },
    finish: () => {},
    close: () => {
      if (closed) return;
      closed = true;
      if (channel) {
        try {
          channel.postMessage({ sys: 'leave_room', from: myId });
          channel.close();
        } catch {}
      }
    }
  };
}

class BuffoonPlatoonGame {
  constructor(canvas) {
    this.canvas = canvas;
    this.sound = new SoundSystem();
    this.input = new InputManager();
    this.art = null;
    this.renderer = null;
    this.scene = null;
    this.camera = null;
    this.rapierReady = false;
    this.physicsWorld = null;

    // High-level state
    this.phase = 'title'; // 'title' | 'ready' | 'waiting' | 'playing' | 'over'
    this.attractMode = false;
    this.attractStageTimer = 0;
    this.worldTime = 0;

    // Menus & Modals (10-foot controller navigable)
    this.titleIndex = 0;
    this.settingsOpen = false;
    this.settingsIndex = 0;
    this.stageSelectOpen = false;
    this.stageSelectIndex = 0;
    this.lobbyOpen = false;
    this.lobbyIndex = 0;
    this.creditsOpen = false;

    // Settings state
    this.cameraShakeEnabled = true;
    this.outlineMode = 1; // 0: Off, 1: Normal, 2: Bold
    this.localCoopCount = 1; // 1 = 1P + AI Buddy, 2 = 2P Couch Co-op

    // Multiplayer / AIHub state
    this.net = null;
    this.lastNetSent = 0;
    this.lastSnapAt = -Infinity;
    this.standings = null;
    this.endMessage = '';
    this.roomCode = 'GOOF';

    // Stage & Entities
    this.stageIndex = 0;
    this.stageDef = STAGES[0];
    this.stageRoot = null;
    this.waterMesh = null;
    this.players = [];
    this.starBlocks = [];
    this.switches = [];
    this.bumpers = [];
    this.blockStoppers = [];
    this.walls = [];
    this.chasms = [];
    this.gates = [];
    this.digSpots = [];
    this.hookPosts = [];
    this.braziers = [];
    this.crackedWalls = [];
    this.carryItems = [];
    this.collectibles = [];
    this.enemies = [];
    this.projectiles = [];
    this.particles = [];
    this.decoyBellTarget = null;

    // Dialogue & Camera
    this.dialogueQueue = [];
    this.activeDialogue = null;
    this.dialogueTimer = 0;
    this.shakeTime = 0;
    this.shakeIntensity = 0;
    this.activePlayerSlot = 0; // allows swapping between Barnaby & Kip in 1P mode
    this.buddyStayMode = false;
    this.buddyStayPos = { x: 0, z: 0 };
    this.bossSpawnBlockTimer = 0;

    this.registerProbe();
    this.buildDOMUI();
  }

  registerProbe() {
    if (window.AIHub && typeof window.AIHub.probe === 'function') {
      window.AIHub.probe(() => ({
        scene:
          this.phase === 'title'
            ? 'title'
            : this.phase === 'playing'
            ? 'play'
            : this.phase === 'over'
            ? 'over'
            : 'ready',
        menu: this.settingsOpen,
        world: Math.round(this.worldTime * 1000) / 1000,
        input: this.input.probeInput
      }));
    }
  }

  async init() {
    // Initialize Rapier 0.19.3 first
    await RAPIER.init({});
    this.rapierReady = true;

    // Connect to AIHub if launched inside an AIHub session
    if (window.AIHub && window.AIHub.active) {
      const info = await window.AIHub.connect({ mode: 'co-op', seats: [1, 4] });
      if (info) {
        this.net = hubNet(info);
        await this.initRenderer(!this.net.server);
        this.setupSessionRun(info);
        this.startLoop();
        return;
      }
    }

    // Normal standalone startup
    await this.initRenderer(true);
    this.loadStage(0, { previewOnly: true });
    this.showTitleScreen();
    this.startLoop();
  }

  async initRenderer(needsGpu = true) {
    if (!needsGpu) return;
    if (!navigator.gpu) {
      if (window.AIHub && window.AIHub.active) window.AIHub.fail('WebGPU is required');
      this.showFatalWebGPUError('WebGPU is not available in this browser.');
      return;
    }
    try {
      this.art = new CelArtFactory();
      this.renderer = new THREE.WebGPURenderer({
        canvas: this.canvas,
        antialias: !(window.AIHub && window.AIHub.active),
        powerPreference: 'high-performance'
      });
      await this.renderer.init();
      const dpr = window.AIHub && window.AIHub.active ? 1 : Math.min(window.devicePixelRatio || 1, 2);
      this.renderer.setPixelRatio(dpr);
      this.renderer.setSize(window.innerWidth, window.innerHeight, false);

      this.scene = new THREE.Scene();
      this.scene.background = new THREE.Color(0x38bdf8);

      this.camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.5, 120);
      this.camera.position.set(0, 18.5, 16.5);
      this.camera.lookAt(0, 0, 1);

      // Lights
      this.ambientLight = new THREE.HemisphereLight(0xfffbeb, 0x312e81, 1.35);
      this.scene.add(this.ambientLight);

      this.sunLight = new THREE.DirectionalLight(0xfff7ed, 2.2);
      this.sunLight.position.set(12, 24, 14);
      this.scene.add(this.sunLight);

      window.addEventListener('resize', () => {
        if (!this.renderer || !this.camera) return;
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight, false);
      });
    } catch (err) {
      if (window.AIHub && window.AIHub.active) window.AIHub.fail('WebGPU initialization failed');
      this.showFatalWebGPUError(err?.message || String(err));
    }
  }

  showFatalWebGPUError(msg) {
    const el = document.getElementById('webgpu-error');
    if (el) {
      el.style.display = 'flex';
      el.querySelector('.err-detail').textContent = msg;
    }
  }

  // ---- AIHub Session Setup ----
  setupSessionRun(info) {
    this.attractMode = false;
    this.stageSelectOpen = false;
    this.lobbyOpen = false;
    this.creditsOpen = false;

    this.loadStage(0, { sessionPlayers: this.net.players });

    if (info.splash || info.server) {
      this.phase = 'waiting';
      window.AIHub.ready();
    } else {
      this.phase = 'ready';
    }

    window.AIHub.on('start', () => {
      this.phase = 'playing';
      this.sound.unlock();
      this.updateUI();
    });

    this.net.onMessage((data, from) => this.onNetworkMessage(data, from));

    this.net.onLeave((id) => {
      const p = this.players.find((q) => q.id === id);
      if (p) {
        p.gone = true;
        if (p.mesh) p.mesh.visible = false;
      }
    });

    window.AIHub.on('time-up', () => {
      if (this.net && this.net.isHost) {
        this.finishCoopRound(false);
      }
    });

    window.AIHub.on('end', ({ reason, standings }) => {
      this.phase = 'over';
      this.standings = standings;
      this.endMessage =
        reason === 'finished'
          ? 'Platoon Mission Complete!'
          : reason === 'sat-out'
          ? 'You sat this round out'
          : 'Round Ended';
      this.sound.stopAll();
      this.updateUI();
    });

    this.updateUI();
  }

  // ---- Stage Loading & Rapier 0.19.3 Physics Construction ----
  loadStage(stageIdx, opts = {}) {
    this.stageIndex = stageIdx % STAGES.length;
    this.stageDef = STAGES[this.stageIndex];
    this.sound.setTheme(this.stageDef.theme);

    // Create fresh Rapier 3D physics world
    this.physicsWorld = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
    // Ground collider
    const groundBody = this.physicsWorld.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(0, -0.5, 0));
    this.physicsWorld.createCollider(RAPIER.ColliderDesc.cuboid(20, 0.5, 20), groundBody);

    // Clear previous 3D stage group
    if (this.scene) {
      if (this.stageRoot) this.scene.remove(this.stageRoot);
      this.stageRoot = new THREE.Group();
      this.scene.add(this.stageRoot);
      this.scene.background = new THREE.Color(this.stageDef.skyColor);

      // Build tropical water plane & sandy/stone island floor
      const waterGeo = new THREE.PlaneGeometry(90, 90);
      waterGeo.rotateX(-Math.PI / 2);
      const waterMat = this.art.getCelMaterial(this.stageDef.waterColor, { rim: 0.15 });
      this.waterMesh = new THREE.Mesh(waterGeo, waterMat);
      this.waterMesh.position.y = -0.35;
      this.stageRoot.add(this.waterMesh);

      const floorGeo = new THREE.BoxGeometry(this.stageDef.bounds.w, 0.6, this.stageDef.bounds.d);
      const floorMesh = this.art.celMesh(floorGeo, this.stageDef.groundColor, 0.04);
      floorMesh.position.y = -0.3;
      this.stageRoot.add(floorMesh);

      // Decorative checkerboard puzzle tiles in the center
      const tileGeo = new THREE.BoxGeometry(1.92, 0.05, 1.92);
      for (let gx = -8; gx <= 8; gx += 2) {
        for (let gz = -6; gz <= 6; gz += 2) {
          if ((Math.abs(gx / 2) + Math.abs(gz / 2)) % 2 === 0) {
            const tile = new THREE.Mesh(
              tileGeo,
              this.art.getCelMaterial(this.stageDef.groundColor, { rim: 0.05 })
            );
            tile.position.set(gx, 0.01, gz);
            this.stageRoot.add(tile);
          }
        }
      }
    }

    // Reset arrays
    this.walls = [];
    this.chasms = [];
    this.gates = [];
    this.switches = [];
    this.starBlocks = [];
    this.bumpers = [];
    this.blockStoppers = this.stageDef.blockStoppers ? this.stageDef.blockStoppers.map((b) => ({ ...b })) : [];
    this.digSpots = [];
    this.hookPosts = [];
    this.braziers = [];
    this.crackedWalls = [];
    this.carryItems = [];
    this.collectibles = [];
    this.enemies = [];
    this.projectiles = [];
    this.particles = [];
    this.decoyBellTarget = null;

    // 1. Walls
    for (const w of this.stageDef.walls) {
      const body = this.physicsWorld.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(w.x, 1.0, w.z));
      this.physicsWorld.createCollider(RAPIER.ColliderDesc.cuboid(w.w / 2, 1.0, w.d / 2), body);
      let mesh = null;
      if (this.stageRoot) {
        mesh = this.art.celMesh(new THREE.BoxGeometry(w.w, 2.1, w.d), this.stageDef.wallColor, 0.055);
        mesh.position.set(w.x, 1.05, w.z);
        this.stageRoot.add(mesh);
      }
      this.walls.push({ ...w, body, mesh });
    }

    // 2. Chasms & Plank Bridge Slots
    for (const ch of this.stageDef.chasms) {
      const item = { ...ch, bridged: !!ch.bridged, mesh: null, bridgeMesh: null };
      if (this.stageRoot) {
        const holeGeo = new THREE.BoxGeometry(ch.w, 0.65, ch.d);
        const holeMesh = new THREE.Mesh(holeGeo, this.art.getCelMaterial(this.stageDef.waterColor));
        holeMesh.position.set(ch.x, -0.25, ch.z);
        this.stageRoot.add(holeMesh);
        item.mesh = holeMesh;

        if (ch.bridgeable) {
          const bMesh = this.art.createCarryItemModel('plank');
          bMesh.scale.set(2.4, 1, 1.5);
          bMesh.position.set(ch.x, 0.02, ch.z);
          bMesh.visible = item.bridged;
          this.stageRoot.add(bMesh);
          item.bridgeMesh = bMesh;
        }
      }
      this.chasms.push(item);
    }

    // 3. Gates & Exit Portal
    for (const g of this.stageDef.gates) {
      const gateObj = {
        ...g,
        open: false,
        keyInserted: !g.requiresKey,
        mesh: null
      };
      if (this.stageRoot) {
        const gGroup = new THREE.Group();
        const barGeo = new THREE.BoxGeometry(g.w, 2.5, g.d);
        const barMesh = this.art.celMesh(barGeo, 0x78350f, 0.055);
        barMesh.position.y = 1.25;
        gGroup.add(barMesh);

        if (g.requiresKey) {
          const lockMesh = this.art.celMesh(new THREE.BoxGeometry(0.8, 0.9, 1.4), 0xfacc15, 0.035);
          lockMesh.position.set(0, 1.25, 0);
          gGroup.add(lockMesh);
          gateObj.lockMesh = lockMesh;
        }
        gGroup.position.set(g.x, 0, g.z);
        this.stageRoot.add(gGroup);
        gateObj.mesh = gGroup;
      }
      this.gates.push(gateObj);
    }

    if (this.stageRoot && this.stageDef.exitPortal) {
      const archGeo = new THREE.TorusGeometry(1.8, 0.22, 8, 16, Math.PI);
      const arch = this.art.celMesh(archGeo, 0xfacc15, 0.04, { emissive: 0xd97706 });
      arch.position.set(this.stageDef.exitPortal.x, 0.1, this.stageDef.exitPortal.z);
      this.stageRoot.add(arch);
    }

    // 4. Switches (Star Block Switches & Co-op Foot Pressure Plates)
    for (const sw of this.stageDef.switches) {
      let mesh = null;
      if (this.stageRoot) {
        mesh = this.art.createSwitchPlateModel(sw.kind);
        mesh.position.set(sw.x, 0, sw.z);
        this.stageRoot.add(mesh);
      }
      this.switches.push({ ...sw, active: false, mesh });
    }

    // 5. Star-Blocks & Bomb-Blocks (with Rapier RigidBody)
    for (const sb of this.stageDef.starBlocks) {
      this.spawnStarBlock(sb);
    }

    // 6. 45-Degree Angled Bumpers
    for (const bmp of this.stageDef.bumpers) {
      let mesh = null;
      if (this.stageRoot) {
        const orient = bmp.deflect === 'N_TO_E' ? 0 : bmp.deflect === 'N_TO_W' ? 1 : 2;
        mesh = this.art.createBumperModel(orient);
        mesh.position.set(bmp.x, 0, bmp.z);
        this.stageRoot.add(mesh);
      }
      this.bumpers.push({ ...bmp, mesh });
    }

    // 7. Dig Spots (X-Marks-The-Spot)
    for (const ds of this.stageDef.digSpots) {
      let mesh = null;
      if (this.stageRoot) {
        mesh = this.art.createDigSpotModel();
        mesh.position.set(ds.x, 0, ds.z);
        this.stageRoot.add(mesh);
      }
      this.digSpots.push({ ...ds, dug: false, mesh });
    }

    // 8. Hookshot Anchor Posts
    for (const hp of this.stageDef.hookPosts) {
      let mesh = null;
      if (this.stageRoot) {
        mesh = this.art.createHookPostModel();
        mesh.position.set(hp.x, 0, hp.z);
        this.stageRoot.add(mesh);
      }
      this.hookPosts.push({ ...hp, mesh });
    }

    // 9. Skull Braziers
    for (const brz of this.stageDef.braziers) {
      let mesh = null;
      if (this.stageRoot) {
        mesh = this.art.createBrazierModel(brz.lit);
        mesh.position.set(brz.x, 0, brz.z);
        this.stageRoot.add(mesh);
      }
      this.braziers.push({ ...brz, mesh });
    }

    // 10. Cracked Bombable Walls
    for (const cw of this.stageDef.crackedWalls) {
      let mesh = null;
      if (this.stageRoot) {
        mesh = this.art.celMesh(new THREE.BoxGeometry(cw.w, 2.2, cw.d), 0x7c2d12, 0.055);
        mesh.position.set(cw.x, 1.1, cw.z);
        this.stageRoot.add(mesh);
      }
      this.crackedWalls.push({ ...cw, broken: false, mesh });
    }

    // 11. Carryable Items (Pots, Barrels, Coconut Bombs, Planks, Keys)
    for (const ci of this.stageDef.carryItems) {
      this.spawnCarryItem(ci);
    }

    // 12. Collectibles & Tools
    for (const col of this.stageDef.collectibles) {
      this.spawnCollectible(col);
    }

    // 13. Palm Trees
    if (this.stageRoot && this.stageDef.palms) {
      for (const pm of this.stageDef.palms) {
        const tree = this.art.createPalmTreeModel(pm.seed);
        tree.position.set(pm.x, 0, pm.z);
        this.stageRoot.add(tree);
      }
    }

    // 14. Pirate Enemies & Boss
    for (const en of this.stageDef.enemies) {
      this.spawnEnemy(en);
    }

    // 15. Players
    this.setupPlayersForStage(opts.sessionPlayers);

    // Queue Stage Intro Banter (unless inside silent preview)
    if (!opts.previewOnly && this.stageDef.introDialogue && (!this.net || !this.net.server)) {
      this.queueDialogue(this.stageDef.introDialogue);
    }

    this.updateUI();
  }

  spawnStarBlock(sb) {
    const body = this.physicsWorld.createRigidBody(
      RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(sb.x, 0.8, sb.z)
    );
    this.physicsWorld.createCollider(RAPIER.ColliderDesc.cuboid(0.75, 0.75, 0.75), body);

    let mesh = null;
    if (this.stageRoot) {
      mesh = this.art.createStarBlockModel(sb.isBomb);
      mesh.position.set(sb.x, 0, sb.z);
      this.stageRoot.add(mesh);
    }
    this.starBlocks.push({
      id: sb.id,
      x: sb.x,
      z: sb.z,
      vx: 0,
      vz: 0,
      sliding: false,
      kickedBy: null,
      isBomb: !!sb.isBomb,
      removed: false,
      body,
      mesh
    });
  }

  spawnCarryItem(ci) {
    let mesh = null;
    if (this.stageRoot) {
      mesh = this.art.createCarryItemModel(ci.kind);
      mesh.position.set(ci.x, 0, ci.z);
      this.stageRoot.add(mesh);
    }
    this.carryItems.push({
      id: ci.id || 'item_' + Math.random().toString(36).slice(2, 7),
      kind: ci.kind,
      x: ci.x,
      y: 0,
      z: ci.z,
      vx: 0,
      vy: 0,
      vz: 0,
      carriedBy: null,
      thrown: false,
      thrownBy: null,
      fuseTimer: 0,
      removed: false,
      mesh
    });
  }

  spawnCollectible(col) {
    let mesh = null;
    if (this.stageRoot) {
      mesh = this.art.createCollectibleModel(col.kind);
      mesh.position.set(col.x, 0, col.z);
      this.stageRoot.add(mesh);
    }
    this.collectibles.push({
      ...col,
      taken: false,
      mesh
    });
  }

  spawnEnemy(en) {
    let mesh = null;
    if (this.stageRoot) {
      mesh = this.art.createEnemyModel(en.type);
      mesh.position.set(en.x, 0, en.z);
      this.stageRoot.add(mesh);
    }
    this.enemies.push({
      id: en.id,
      type: en.type,
      x: en.x,
      z: en.z,
      vx: 0,
      vz: 0,
      yaw: 0,
      hp: en.hp || 2,
      maxHp: en.maxHp || en.hp || 2,
      stunTimer: 0,
      attackTimer: 1.5 + Math.random() * 1.5,
      whirlwindTimer: 0,
      dead: false,
      mesh
    });
  }

  setupPlayersForStage(sessionPlayers = null) {
    const existingScores = new Map(this.players.map((p) => [p.id, { score: p.score, stats: p.stats, tools: p.tools }]));
    this.players = [];

    let roster = [];
    if (sessionPlayers && sessionPlayers.length) {
      roster = sessionPlayers.map((p, idx) => ({
        id: p.id,
        name: p.name,
        color: p.color || CHARACTERS[idx % 4].color,
        isAI: false,
        charDef: CHARACTERS[idx % 4]
      }));
    } else if (this.net && this.net.players.length) {
      roster = this.net.players.map((p, idx) => ({
        id: p.id,
        name: p.name,
        color: p.color || CHARACTERS[idx % 4].color,
        isAI: false,
        charDef: CHARACTERS[idx % 4]
      }));
    } else {
      // Standalone mode: Player 1 (Barnaby) + Player 2 (Kip, either AI Buddy or 2P Local Couch Co-op!)
      roster = [
        {
          id: 0,
          name: CHARACTERS[0].name,
          color: CHARACTERS[0].color,
          isAI: false,
          charDef: CHARACTERS[0]
        },
        {
          id: 1,
          name: CHARACTERS[1].name,
          color: CHARACTERS[1].color,
          isAI: this.localCoopCount < 2,
          charDef: CHARACTERS[1]
        }
      ];
    }

    roster.forEach((r, idx) => {
      const sp = this.stageDef.spawns[idx % this.stageDef.spawns.length] || { x: -4 + idx * 2, z: 8 };
      const prev = existingScores.get(r.id);

      const body = this.physicsWorld.createRigidBody(
        RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(sp.x, 0.8, sp.z)
      );
      this.physicsWorld.createCollider(RAPIER.ColliderDesc.ball(0.48), body);

      let mesh = null;
      if (this.stageRoot) {
        mesh = this.art.createHeroModel(idx, r.color);
        mesh.position.set(sp.x, 0, sp.z);
        this.stageRoot.add(mesh);
      }

      this.players.push({
        id: r.id,
        name: r.name,
        color: r.color,
        charDef: r.charDef,
        isAI: r.isAI,
        gone: false,
        x: sp.x,
        z: sp.z,
        tx: sp.x,
        tz: sp.z,
        vx: 0,
        vz: 0,
        yaw: 0,
        hp: 6,
        maxHp: 6,
        cherries: 0,
        bananas: 1,
        score: prev ? prev.score : 0,
        stats: prev ? prev.stats : { blocksKicked: 0, piratesKO: 0, switches: 0 },
        tools: prev ? prev.tools : ['hookshot', idx % 2 === 0 ? 'shovel' : 'plank'],
        activeToolSlot: 0,
        carryingId: null,
        stunTimer: 0,
        invulnTimer: 0,
        kickAnimTimer: 0,
        hookTimer: 0,
        hookTarget: null,
        animPhase: 0,
        at: -Infinity,
        body,
        mesh
      });
    });

    this.buddyStayMode = false;
  }

  // ---- Main Frame Loop ----
  startLoop() {
    let last = performance.now();
    this.lastRenderAt = 0;
    const stepNow = () => {
      const now = performance.now();
      const dt = Math.min((now - last) / 1000, 0.1);
      if (dt < 0.004) return;
      last = now;
      this.stepFrame(now, dt);
    };
    const tick = () => {
      stepNow();
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    // Keep simulation advancing even if tab is hidden or rAF is throttled under multi-iframe load
    setInterval(() => {
      if (performance.now() - last > 40) stepNow();
    }, 32);
  }

  stepFrame(now, dt) {
    const uiInput = this.input.poll(this.settingsOpen || this.stageSelectOpen || this.lobbyOpen || this.creditsOpen);

    // Handle Esc / Options settings toggle
    if (uiInput.menuToggle) {
      if (this.creditsOpen) {
        this.creditsOpen = false;
        this.sound.sfx('uiBack');
      } else if (this.stageSelectOpen) {
        this.stageSelectOpen = false;
        this.sound.sfx('uiBack');
      } else if (this.lobbyOpen) {
        this.lobbyOpen = false;
        this.sound.sfx('uiBack');
      } else {
        this.toggleSettingsMenu();
      }
      this.updateUI();
    }

    // Handle active modal navigation via Controller / Keyboard
    if (this.settingsOpen) {
      this.handleSettingsInput(uiInput);
    } else if (this.creditsOpen) {
      if (uiInput.uiBack || uiInput.uiConfirm) {
        this.creditsOpen = false;
        this.sound.sfx('uiBack');
        this.updateUI();
      }
    } else if (this.stageSelectOpen) {
      this.handleStageSelectInput(uiInput);
    } else if (this.lobbyOpen) {
      this.handleLobbyInput(uiInput);
    } else if (this.phase === 'title') {
      this.handleTitleInput(now, uiInput);
    } else if (this.phase === 'ready') {
      if (uiInput.hadAnyInput) {
        this.sound.unlock();
        if (window.AIHub && window.AIHub.active) {
          window.AIHub.ready();
          this.phase = 'waiting';
          this.updateUI();
        }
      }
    } else if (this.phase === 'over' && (!window.AIHub || !window.AIHub.active)) {
      if (uiInput.uiConfirm) {
        this.sound.sfx('uiConfirm');
        this.showTitleScreen();
      }
    }

    // Exit Attract Mode immediately on any user input!
    if (this.attractMode && uiInput.hadAnyInput) {
      this.exitAttractMode();
      return;
    }

    // Advance the simulation whenever playing (and in AIHub mode once AIHub.time() >= 0).
    // IMPORTANT: Never pause in shared world even when Settings menu is open!
    const canSimulate =
      (this.phase === 'playing' && (!window.AIHub?.active || window.AIHub.time() >= 0)) ||
      this.attractMode ||
      this.phase === 'title';

    if (canSimulate) {
      if (this.phase === 'playing' && (!window.AIHub?.active || window.AIHub.time() >= 0)) {
        this.worldTime += dt;
      }
      this.updateSimulation(now, dt, uiInput);
    }

    // Render 3D WebGPU scene (unless running as a headless AIHub server with no player of its own)
    if (this.renderer && this.scene && this.camera && !this.net?.server) {
      const minRenderInterval = window.AIHub && window.AIHub.active ? 42 : 0;
      if (now - (this.lastRenderAt || 0) >= minRenderInterval) {
        this.lastRenderAt = now;
        this.updateCamera(dt);
        this.renderer.render(this.scene, this.camera);
      }
    }
  }

  // ---- Core Gameplay & Physics Step ----
  updateSimulation(now, dt, uiInput) {
    if (this.physicsWorld) {
      this.physicsWorld.step();
    }

    // Animate water waves subtly
    if (this.waterMesh) {
      this.waterMesh.position.y = -0.35 + Math.sin(now * 0.0025) * 0.05;
    }

    // Dialogue box timer
    if (this.activeDialogue) {
      this.dialogueTimer -= dt;
      if (this.dialogueTimer <= 0) {
        this.advanceDialogue();
      }
    }

    // Title background preview idle animation
    if (this.phase === 'title' && !this.attractMode) {
      this.animateEntitiesVisuals(now, dt);
      return;
    }

    // Attract Mode stage cycler
    if (this.attractMode) {
      this.attractStageTimer += dt;
      if (this.attractStageTimer > 18) {
        this.attractStageTimer = 0;
        this.loadStage((this.stageIndex + 1) % STAGES.length, { previewOnly: true });
      }
    }

    // 1. Update Local & AI Players
    const isAuthoritative = !this.net || this.net.isHost;
    const localPlayerId = this.net ? this.net.me : this.activePlayerSlot;

    for (let i = 0; i < this.players.length; i++) {
      const p = this.players[i];
      if (p.gone) continue;

      if (p.stunTimer > 0) p.stunTimer = Math.max(0, p.stunTimer - dt);
      if (p.invulnTimer > 0) p.invulnTimer = Math.max(0, p.invulnTimer - dt);
      if (p.kickAnimTimer > 0) p.kickAnimTimer = Math.max(0, p.kickAnimTimer - dt);
      if (p.hookTimer > 0) p.hookTimer = Math.max(0, p.hookTimer - dt);

      if (this.attractMode) {
        // Attract Mode AI drives all players with infinite health/abilities
        p.hp = p.maxHp;
        const aiCtrl = this.computeAIControls(p, now, dt, true);
        this.applyPlayerControls(p, aiCtrl, dt);
      } else if (!this.net) {
        // Standalone mode: local player(s) + AI Buddy
        if (i === this.activePlayerSlot) {
          this.applyPlayerControls(p, uiInput.p1, dt);
        } else if (!p.isAI && this.localCoopCount >= 2 && i === 1) {
          const p2Ctrl = this.input.readPlayerControls(1, this.settingsOpen, true);
          this.applyPlayerControls(p, p2Ctrl, dt);
        } else {
          const buddyCtrl = this.computeAIControls(p, now, dt, false);
          this.applyPlayerControls(p, buddyCtrl, dt);
        }
      } else {
        // Networked mode (AIHub session or Room Code)
        if (p.id === localPlayerId && !this.net.server) {
          this.applyPlayerControls(p, uiInput.p1, dt);
        } else {
          // Smoothly interpolate remote players toward their latest network position
          const k = 1 - Math.pow(0.0005, dt);
          const dx = p.tx - p.x;
          const dz = p.tz - p.z;
          p.x += dx * k;
          p.z += dz * k;
          if (Math.hypot(dx, dz) > 0.03) {
            p.yaw = Math.atan2(dx, dz);
            p.animPhase += dt * 10;
          }
        }
      }

      if (p.body) {
        p.body.setNextKinematicTranslation({ x: p.x, y: 0.8, z: p.z });
      }
    }

    // 2. Update Sliding Star-Blocks & Bomb-Blocks
    this.updateStarBlocks(dt, isAuthoritative);

    // 3. Update Carried & Thrown Items (Pots, Barrels, Coconut Bombs, Planks, Keys)
    this.updateCarryItems(dt, isAuthoritative);

    // 4. Update Collectibles
    this.updateCollectibles(now, dt);

    // 5. Update Switches & Gates
    this.updateSwitchesAndGates(dt, isAuthoritative);

    // 6. Update Pirate Enemies & Captain Cragbeard Boss
    if (isAuthoritative) {
      this.updateEnemies(now, dt);
    }

    // 7. Update Projectiles & Particles
    this.updateProjectilesAndParticles(dt);

    // 8. Network Sync (~15 Hz, well within AIHub's 20 msg/s rate limit)
    if (this.net && this.phase === 'playing' && (!window.AIHub?.active || window.AIHub.time() >= 0)) {
      if (now - this.lastNetSent > 68) {
        this.lastNetSent = now;
        this.sendNetworkSync();
      }
    }

    // 9. Update 3D Skeletal / Hierarchical Character Animations
    this.animateEntitiesVisuals(now, dt);
  }

  applyPlayerControls(p, ctrl, dt) {
    if (p.stunTimer > 0) return;

    // If grappling with Hookshot toward an Anchor Post, zip smoothly to target!
    if (p.hookTimer > 0 && p.hookTarget) {
      const dx = p.hookTarget.x - p.x;
      const dz = p.hookTarget.z - p.z;
      const dist = Math.hypot(dx, dz);
      if (dist > 0.35) {
        const stepDist = Math.min(dist, 18 * dt);
        p.x += (dx / dist) * stepDist;
        p.z += (dz / dist) * stepDist;
      } else {
        p.hookTarget = null;
        p.hookTimer = 0;
      }
      return;
    }

    const baseSpeed = 6.8 * (p.charDef?.speedMul || 1.0) * (p.carryingId ? 0.86 : 1.0);
    const vx = ctrl.x * baseSpeed;
    const vz = ctrl.y * baseSpeed;
    p.vx = vx;
    p.vz = vz;

    if (Math.hypot(ctrl.x, ctrl.y) > 0.08) {
      p.yaw = Math.atan2(ctrl.x, ctrl.y);
      p.animPhase += dt * 11;
      const nextX = p.x + vx * dt;
      const nextZ = p.z + vz * dt;
      if (this.canPlayerWalkTo(nextX, p.z)) p.x = nextX;
      if (this.canPlayerWalkTo(p.x, nextZ)) p.z = nextZ;
    }

    // Cycle Tool Belt Slot (L1 / Q / Tab)
    if (ctrl.cyclePressed && p.tools.length > 1) {
      p.activeToolSlot = (p.activeToolSlot + 1) % p.tools.length;
      this.sound.sfx('uiMove');
      this.updateHUD();
    }

    // Buddy Order / Character Swap (Triangle / R / C) in Standalone Mode
    if (ctrl.buddyPressed && !this.net && !this.attractMode) {
      this.toggleBuddyCommand(p);
    }

    // Main Action (Cross / Space / R2): Kick Star-Block, Pick Up Item, or Throw Carried Item!
    if (ctrl.actionPressed) {
      this.performPrimaryAction(p);
    }

    // Secondary Action (Square / Circle / E): Use Equipped Tool!
    if (ctrl.toolPressed) {
      this.useEquippedTool(p);
    }
  }

  canPlayerWalkTo(x, z) {
    const halfW = this.stageDef.bounds.w / 2 - 1.3;
    const halfD = this.stageDef.bounds.d / 2 - 1.3;
    if (x < -halfW || x > halfW || z < -halfD || z > halfD) return false;

    // Check walls
    for (const w of this.walls) {
      if (Math.abs(x - w.x) < w.w / 2 + 0.48 && Math.abs(z - w.z) < w.d / 2 + 0.48) {
        return false;
      }
    }
    // Check unbroken cracked walls
    for (const cw of this.crackedWalls) {
      if (!cw.broken && Math.abs(x - cw.x) < cw.w / 2 + 0.48 && Math.abs(z - cw.z) < cw.d / 2 + 0.48) {
        return false;
      }
    }
    // Check closed gates
    for (const g of this.gates) {
      if (!g.open && Math.abs(x - g.x) < g.w / 2 + 0.45 && Math.abs(z - g.z) < g.d / 2 + 0.45) {
        return false;
      }
    }
    // Check unbridged chasms
    for (const ch of this.chasms) {
      if (!ch.bridged && Math.abs(x - ch.x) < ch.w / 2 + 0.25 && Math.abs(z - ch.z) < ch.d / 2 + 0.25) {
        return false;
      }
    }
    // Check stationary Star-Blocks
    for (const sb of this.starBlocks) {
      if (!sb.removed && !sb.sliding && Math.abs(x - sb.x) < 1.12 && Math.abs(z - sb.z) < 1.12) {
        return false;
      }
    }
    return true;
  }

  // ---- Goof Troop Primary Action: Throw / Pick Up / Kick Star-Block ----
  performPrimaryAction(p) {
    // 1. If already carrying an item overhead, THROW it in facing direction!
    if (p.carryingId) {
      const item = this.carryItems.find((ci) => ci.id === p.carryingId);
      p.carryingId = null;
      if (item) {
        item.carriedBy = null;
        item.thrown = true;
        item.thrownBy = p.id;
        const dirX = Math.sin(p.yaw);
        const dirZ = Math.cos(p.yaw);
        item.x = p.x + dirX * 0.9;
        item.y = 1.35;
        item.z = p.z + dirZ * 0.9;
        item.vx = dirX * 13.5;
        item.vy = 2.8;
        item.vz = dirZ * 13.5;
        if (item.kind === 'bomb') item.fuseTimer = 1.5;
        if (item.mesh && this.stageRoot) {
          this.stageRoot.attach(item.mesh);
        }
        this.sound.sfx('throw');
        if (this.net && !this.net.isHost) {
          this.net.send({ t: 'act', kind: 'throw', itemId: item.id, x: p.x, z: p.z, yaw: p.yaw });
        }
      }
      return;
    }

    // 2. Check if facing or adjacent to a Star-Block -> KICK IT!
    const faceX = Math.sin(p.yaw);
    const faceZ = Math.cos(p.yaw);
    let bestBlock = null;
    let bestDist = 2.15;
    for (const sb of this.starBlocks) {
      if (sb.removed || sb.sliding) continue;
      const d = Math.hypot(sb.x - p.x, sb.z - p.z);
      if (d < bestDist) {
        bestDist = d;
        bestBlock = sb;
      }
    }

    if (bestBlock) {
      // Snap kick direction to cardinal axis (+X, -X, +Z, -Z) from player to block
      const dx = bestBlock.x - p.x;
      const dz = bestBlock.z - p.z;
      let kx = 0;
      let kz = 0;
      if (Math.abs(dx) > Math.abs(dz)) {
        kx = dx >= 0 ? 1 : -1;
      } else {
        kz = dz >= 0 ? 1 : -1;
      }
      this.kickStarBlock(bestBlock, kx, kz, p);
      return;
    }
