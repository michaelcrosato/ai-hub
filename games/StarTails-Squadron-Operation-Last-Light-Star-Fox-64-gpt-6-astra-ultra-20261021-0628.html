/*!
my-3D2dge AGENT EDITION v0.59.1: the essential engine in one file, for AI coding agents
https://github.com/michaelcrosato/my-3d2dge (MIT License)

Retro-modern 2D games drawn entirely by code: no image or sound files, no dependencies, no network.
This is a curated subset of the full engine (dist/my-3d2dge.js). A game written against this file runs
unchanged on the full engine, which adds the pause, settings and controls menus, lighting (game.lights,
game.enableGPU), props, parallax backdrops, touch controls, camera zoom and turn, dialog portraits, x-ray silhouettes,
replayable sessions, and more.

AGENTS: this header is the whole manual. Build games from it; you do not need to read the code below.
Read a section only to debug: each starts with "// ---- N. NAME" (grep "// ---- 10." for the Humanoid). With the
handoff package, grep API-INDEX.md for a name first: one line each (a † marks the full engine's only).

## Host it
<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}

For a single-file game, paste both scripts inline. Start every game with: const E = My3D2dge;

## Mental model
- The world is 3D: x east, y south, z up; one tile = 16 units. Game logic uses world units and dt, never pixels.
- A view projects the world to the screen. 'iso' (Diablo), 'threequarter' (Zelda), 'topdown', 'brawler' (Final
  Fight), 'side' (Mario: x right, z up, y = 0), 'overhead' (shmups, puzzles: world x/y = screen pixels once you call
  game.focus(W / 2, H / 2)). The same game runs in every view. In ground views, turn the stick or keys into a world
  direction with game.view.screenDirToGround(mx, my).
- update(dt) runs in exact fixed steps: 1/120 s of real time each, dt = 1/120 * timeScale, the same steps at any
  refresh rate. Read input only there.
- Tests: new E.Game({ headless: true }) (the default in Node) has no screen; game.advance(seconds) runs fixed steps at
  once, game.input.tap('jump') / hold('right', on) script input, game.debug = { snapshot() {...} } is the game's handle.
- draw(r) order: backgrounds first (r.sky, map.drawFloor + map.queueWalls, level.draw), then everything that can
  overlap through r.actor / r.sprite / r.queue (depth sorted), then the HUD through r.text / r.overlay (screen pixels).
- Characters are procedural rigs posed every step (E.Humanoid, E.Blob) or string sprites (E.sprite).
- Draw only with E.px, E.font, E.ui and r.*: they snap to whole pixels. ctx.arc / stroke / fillText and canvas
  gradients blur the pixel look.
- Errors show in a red box on screen and in the console; warnings start with "my-3D2dge:". Fix the first one first.

## Quick start: a complete game (title, play, win or lose)
```js quickstart
(() => {
const E = My3D2dge;
const game = new E.Game({ canvas: 'screen', res: 'ps1', view: 'threequarter', views: ['threequarter', 'iso', 'topdown'] });
const map = new E.TileMap({
  rows: ['################',
         '#@.....#.......#',
         '#......#...s...#',
         '#..s.......##..#',
         '#......~~.....s#',
         '################'],
  legend: { '#': 1, '@': 'hero', s: 'slime', '~': { floor: 'water', block: true } },   // number = wall type, string = spawn tag
  types: { 1: { h: 28, top: '#7a7090', side: '#4a4560', cut: true } },   // cut: walls in front of the floor drop low
  floorTex: (x, y, tag) => tag === 'water' ? E.tex.water(x, y) : E.tex.grass(x, y)
});
const flow = new E.FlowField(map);
let hero, rig, sword, slimes, hp, msg = '';
const title = {
  update() { if (game.input.pressed('start')) game.go('play'); },
  draw(r) {
    r.sky(['#101848', '#5a3a80']);
    r.overlay(g => E.font.title(g, 'SLIME FIELD', r.W / 2, 70, { scale: 3, align: 'center' }));
    r.text('PRESS ENTER', r.W / 2, 150, '#ffffff', { align: 'center', shadow: '#000', outline: false });
  }
};
const play = {
  pausable: true,
  enter() {
    const s = map.find('hero');
    hero = new E.Body({ x: s.x, y: s.y, r: 5 }); hero.facing = 0; hero.hurt = 0; hp = 3;
    rig = new E.Humanoid({ size: 1.3, outfit: 'tunic', hat: 'cap', colors: { cloth: '#3a8a4a', hair: '#e0b040' } });
    sword = new E.Attack('slash');
    slimes = map.findAll('slime').map(p => ({ body: new E.Body({ x: p.x, y: p.y, r: 6 }), rig: new E.Blob(), hp: 3, hit: 0 }));
    game.cam.bounds = v => map.bounds(v); game.follow(hero);
    game.audio.music('adventure');
  },
  update(dt) {
    const inp = game.input, m = inp.move(), d = game.view.screenDirToGround(m[0], m[1]);   // screen push -> ground direction
    hero.vx = d[0] * 85; hero.vy = d[1] * 85; hero.update(dt, map);
    if (Math.hypot(d[0], d[1]) > .1) hero.facing = Math.atan2(d[1], d[0]);
    if (inp.buffered('attack') && sword.start()) { inp.consume('attack'); game.audio.sfx('swing'); }
    sword.update(dt);
    sword.hits(slimes, s => E.inArc(hero, hero.facing, s.body, 24, 1.3), s => {
      s.hp--; s.hit = .15; E.knockback(hero, s.body, 200, 80);
      game.hitFx(s.body.x, s.body.y, 8, { damage: 1, angle: hero.facing });
    });
    flow.update(hero.x, hero.y); hero.hurt -= dt;
    for (const s of slimes) {
      const dir = flow.dir(s.body.x, s.body.y, hero.x, hero.y);
      s.body.vx = E.approach(s.body.vx, dir[0] * 30, 300 * dt); s.body.vy = E.approach(s.body.vy, dir[1] * 30, 300 * dt);
      s.body.update(dt, map); s.hit -= dt;
      s.rig.update(dt, { look: dir, squash: Math.sin(game.time * 9 + s.body.x) * .15 });
      if (E.overlap(hero, s.body) && hero.hurt <= 0) { hp--; hero.hurt = 1; E.knockback(s.body, hero, 220); game.audio.sfx('hurt'); game.shake(3); }
      if (s.hp <= 0) game.particles.explosion(s.body.x, s.body.y, 6, .7);
    }
    E.prune(slimes, s => s.hp <= 0);
    rig.update(dt, { x: hero.x, y: hero.y, z: hero.z, vx: hero.vx, vy: hero.vy, facing: hero.facing, attack: sword.state, hurt: hero.hurt > .7 });
    if (hp <= 0) game.go('end', 'GAME OVER'); else if (!slimes.length) game.go('end', 'YOU WIN');
  },
  draw(r) {
    map.drawFloor(r); map.queueWalls(r);                                   // background first, then depth-sorted things
    r.shadow(hero.x, hero.y, 6);
    r.actor(hero.x, hero.y, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view), { alpha: hero.hurt > 0 ? .6 : 1 });
    for (const s of slimes) {
      r.shadow(s.body.x, s.body.y, 6);
      r.actor(s.body.x, s.body.y, s.body.z, (g, ox, oy) => s.rig.draw(g, ox, oy, r.view), { flash: s.hit > 0 && '#ffffff' });
    }
    r.overlay(g => E.ui.hearts(g, 6, 6, hp, 3));                        // HUD in screen pixels
  }
};
const end = {
  enter(text) { msg = text; game.audio.music(null); game.audio.sfx(text === 'YOU WIN' ? 'powerup' : 'die'); },
  update() { if (game.input.pressed('start')) game.go('title'); },
  draw(r) { r.sky(['#000000', '#301830']); r.text(msg, r.W / 2, 100, '#ffe08a', { align: 'center', scale: 2 }); }
};
game.start({ scene: 'title', scenes: { title, play, end } });
})();
```

## API
Game: new E.Game({ canvas: 'screen', res, expand, view, views, input, bg })
  res: 'nes' 256x240 | 'snes' 256x224 | 'genesis' 320x224 | 'gb' 160x144 | 'gba' 240x160 | 'ps1' 320x240 | 'wide' 400x225 | [w, h]
  expand: true fills any window with no bars: res is the least it shows, r.W x r.H grows; anchor the HUD to r.W and r.H
  input: 'DEFAULT' | 'PLATFORMER' | 'SHMUP' | your own { action: ['KeyQ', 'Pad0', 'Mouse0'] }
  start({ update(dt), draw(r) }) or start({ scene: 'title', scenes: { title: {...}, play: {...} } })
  scene: { enter(data), exit(), update(dt), draw(r), pausable, view, views, input, res, expand }; go(name, data, { fade: .22 })
  camera: follow(obj, { z: 16, lead }) once, or focus(x, y, z) every update; cam.bounds = v => map.bounds(v);
    cam.room = [w, h] for screen-by-screen rooms (cam.moving is true while it slides); cam.smooth = .18 (0 = locked)
  juice: hitFx(x, y, z, { power: 1, damage, angle, color, sound }), freeze(s), shake(n), flash(color, s), timeScale = .25
  timers in game time: after(s, fn), every(s, fn) -> { cancel() }, cleared on scene change
  also: setView(id), nextView() (cycles views), note(text, s), mouseGround() -> [x, y] or null
  fields: W, H, time, real, paused, input, audio, particles, view, cam, errors
Input (game.input): down(a) held, pressed(a) this step only, released(a), repeat(a, delay .3, rate .08) for menus,

## Recipes
Side-scroller (Mario, Mega Man): PlatformMap + Platformer + Humanoid, view 'side'.
```js platformer
(() => {
const E = My3D2dge;
const game = new E.Game({ canvas: 'screen', res: 'snes', view: 'side', views: ['side', 'brawler'], input: 'PLATFORMER' });
const level = new E.PlatformMap({
  rows: ['                                  ',
         '               ?                  ',
         '        ===             ==        ',
         '  @           g     ^^       g  F ',
         '#################  ###############'],
  legend: { '#': 1, '=': 2, '?': 3, '^': 4, '@': 'hero', g: 'walker', F: 'flag' },
  types: { 1: { style: 'ground', side: '#8a5a32' }, 2: { kind: 'oneway' }, 3: { style: 'bonus', side: '#e8a830' }, 4: { kind: 'hazard' } }
});
const start = level.find('hero'), flag = level.find('flag');
const hero = new E.Platformer({ x: start.x, z: start.z });
const rig = new E.Humanoid({ hat: 'cap', weapon: null, colors: { cloth: '#d83a2a', pants: '#3050c0' } });
const foes = level.findAll('walker').map(p => ({ x: p.x, z: p.z, w: 12, h: 12, vx: 0, vz: 0, dir: -1, rig: new E.Blob({ feet: true, colors: { base: '#a06030', dk: '#5a3018', lt: '#d09060' } }) }));
game.cam.bounds = v => level.bounds(v);
game.particles.ground = (x, y, z) => level.groundBelow(x, z);           // sparks and debris land on platforms
game.start({
  update(dt) {
    hero.update(dt, level, game.input);
    if (hero.jumped) game.audio.sfx('jump');
    if (hero.bumped && level.types[hero.bumped.id].style === 'bonus') { level.set(hero.bumped.cx, hero.bumped.cz, 1); game.audio.sfx('coin'); game.particles.glints(hero.x, 0, hero.z + 30, 6); }
    if (level.touching(hero, 'hazard') || hero.z < -40) { Object.assign(hero, { x: start.x, z: start.z, vx: 0, vz: 0 }); game.audio.sfx('hurt'); }
    for (const f of foes) {
      f.vz -= 800 * dt; f.vx = f.dir * 25; level.move(f, dt);
      const ahead = level.groundBelow(f.x + f.dir * 8, f.z);
      if (f.hitWall || ahead === null || ahead < f.z - 4) f.dir = -f.dir;   // turn at walls and ledges
      f.rig.update(dt, { look: [f.dir, 0], walk: 1 });
      if (!f.dead && E.overlapBox(hero, f)) {
        if (hero.vz < 0 && hero.z > f.z + f.h / 2) { f.dead = true; hero.vz = 220; game.audio.sfx('stomp'); game.particles.dust(f.x, 0, f.z, 8); }
        else { hero.knock(hero.x < f.x ? -1 : 1); game.audio.sfx('hurt'); }
      }
    }
    E.prune(foes, f => f.dead);
    if (Math.abs(hero.x - flag.x) < 8) { game.audio.sfx('powerup'); Object.assign(hero, { x: start.x, z: start.z }); }
    rig.update(dt, hero.rigState());
    game.focus(hero.x, 0, hero.z + 24);                                   // side view: y = 0, z is up
  },
  draw(r) {
    r.sky(['#5c94fc', '#a8c8ff']);
    level.draw(r);
    r.queue(flag.x, 0, flag.z, g => { const [x, y] = r.w(flag.x, 0, flag.z); E.px.rect(g, x, y - 40, 2, 40, '#e8e8e8'); E.px.poly(g, [[x + 2, y - 40], [x + 14, y - 35], [x + 2, y - 30]], '#40c040'); });
    for (const f of foes) r.actor(f.x, 0, f.z, (g, ox, oy) => f.rig.draw(g, ox, oy, r.view));
    r.actor(hero.x, 0, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view));
  }
});
})();
```
Shoot-'em-up (1942): view 'overhead', sprites, Bullets, a starfield.
```js shmup
(() => {
const E = My3D2dge, W = 224, H = 256;
const game = new E.Game({ canvas: 'screen', res: [W, H], view: 'overhead', views: ['overhead'], input: 'SHMUP' });
const SHIP = E.sprite(['...w...', '..wbw..', '.wwbww.', 'wwrwrww', 'w..r..w'], { w: '#e8f0ff', b: '#3a7aff', r: '#ff5030' }, 2);
const FOE = E.sprite(['r.....r', '.rrrrr.', 'rryyyrr', '.r.r.r.'], { r: '#d03040', y: '#ffd040' }, 2);
const shots = new E.Bullets(game), ship = { x: W / 2, y: H - 30, r: 4 }, foes = [];
let score = 0, cool = 0, spawn = 0;
game.start({
  update(dt) {
    game.focus(W / 2, H / 2);                                            // overhead: world x/y = screen pixels
    const m = game.input.move();
    ship.x = E.clamp(ship.x + m[0] * 120 * dt, 8, W - 8); ship.y = E.clamp(ship.y + m[1] * 120 * dt, 8, H - 8);
    if ((cool -= dt) <= 0 && game.input.down('fire')) { cool = .12; shots.fire({ x: ship.x, y: ship.y - 10, vy: -300, team: 'player' }); game.audio.sfx('shoot'); }
    if ((spawn -= dt) <= 0) { spawn = .9; foes.push({ x: E.rand(20, W - 20), y: -10, r: 7, hp: 3, t: 0 }); }
    for (const f of foes) {
      f.t += dt; f.y += 40 * dt; f.x += Math.sin(f.t * 3) * 40 * dt;
      if (E.chance(dt * .6)) shots.burst({ x: f.x, y: f.y, team: 'foe', color: '#ff6080' }, [E.pattern.aim(f, ship, 90)]);
    }
    shots.update(dt);
    shots.hit(foes, (b, f) => { f.hp--; game.particles.sparks(b.x, b.y, 0, 4); }, 'player');
    for (const f of foes) if (f.hp <= 0) { score += 100; game.particles.explosion(f.x, f.y, 0, .8); }
    E.prune(foes, f => f.hp <= 0 || f.y > H + 20);
    if (shots.hit([ship], () => {}, 'foe')) { game.flash('#ff4040', .2); game.audio.sfx('hurt'); score = 0; }
  },
  draw(r) {
    r.sky(['#000010', '#101040']); r.starfield({ dir: 'down', speed: 40 });
    for (const f of foes) r.sprite(f.x, f.y, 0, FOE, { anchor: 'center' });
    r.sprite(ship.x, ship.y, 0, SHIP, { anchor: 'center' });
    shots.draw(r);
    r.text('SCORE ' + score, 4, 4, '#ffffff', { shadow: '#000', outline: false });
  }
});
})();
```

## Rules
1. World units and dt everywhere. Feel numbers (units per second, tile = 16): walk 70-90, run 95-140, jump 250-320
   with gravity 800, dash 200-260, player bullets 250-320, enemy bullets 70-120, enemies 25-45.
2. At 320x240, heroes are 40-60 px tall (Humanoid size 1.2-1.4), bosses size 1.8-2.4; hitboxes smaller than the art.
3. Every hit gets game.hitFx; deaths get particles.explosion; sounds on jump, hit, pickup and death; music per scene.
4. A title scene, play scenes with pausable: true, and a game-over or win path back to the title.
5. Dress every character (outfit, hat, colors) and give each its own moves; enemies wind up slower than the hero.
6. Nothing on screen? The camera looks elsewhere: game.follow(hero) or game.focus(...) every update (side: y = 0).

## More, outside this file: animation and examples to take from
In the repo (github.com/michaelcrosato/my-3d2dge; every clip is free to use). Its files are large: search them and take
only what the game needs; never read one whole. All of it runs at https://my-3d2dge.vercel.app/labs.
- Motion clips: 325 curated (idles, walks, runs, jumps, fights, hits, deaths, chores, dances) and 2,548 motion-capture
  takes, as readable key poses that play on any Humanoid (either engine; the full one also turns the face and hair).
    find  src/mocap/catalogs/quaternius.json, mesh2motion.json, cmu.json: each clip's name, tags and description;
          node tools/cmu.mjs ledger kick (or grep src/mocap/catalogs/cmu-takes.tsv): the takes, one a line
    take  node tools/anim-set.mjs src/mocap/sets/quaternius.js examples/cmu-lib/CMU_10.js --clips Idle_Loop,10_01
          --name MINE --out mine.js     (take NN_xx is in examples/cmu-lib/CMU_NN.js; curated sets: src/mocap/sets/)
    play  load src/mocap/readable.js, src/mocap/mocap.js and mine.js after the engine, then
          const lib = Mocap.load(MOCAP.MINE); Mocap.drive(rig, lib);
          and each step rig.mocap = lib.sample(lib.clip(name), t) (rig.mocapW 0..1 fades it over the rig's own motion;
          rig.mocapMask = 'upper' keeps the rig's own legs)
    docs/MOCAP.md: the format, retargeting, and where every clip came from.
- Objects and materials as data (full engine): r.shape('barrel', x, y, 0, { facing }) draws a still object from any
  view; materials dress floors, walls and tiles. docs/ASSETS.md: the format, the library, tools/asset-sheet.mjs.
- Worked examples: Emberdeep (src/emberdeep/), a whole game on the full engine, one line per part:

 state.player={x:0,y:0,z:70,yaw:0,bank:0,roll:0,health:100,maxHealth:100,energy:100,bombs:3,laser:1,invuln:3,fireTimer:0,rollTimer:0,rollCool:0,flipTimer:0,flipCool:0,boost:false,brake:false,vx:0,vz:0,speed:85};

 game.input.clear();STUI.hide();audio.setPaused(false);audio.setMode(state.stage>=3?'boss':state.stage===2?'arena':'canyon');lastActivity=performance.now();state.camera={x:state.player.x,y:state.player.y-58,z:state.player.z+18,yaw:state.player.yaw,pitch:-.12};
 if(state.stage===3)spawnBoss();else if(state.stage===2)spawnArenaWave();else if(state.stage===1){state.routeChosen=false;notice('THE FORK','Fly RIGHT to rescue PIP • LEFT to raid the relay',6);}

function retry(){start(false,state.mode!=='debrief'||!state.win);}
function pause(reason='Flight paused'){if(!active()||state.attract)return;audio.setPaused(true);STUI.show('pause',{reason});game.input.clear();}

STUI.init({start:()=>start(false),retry,resume,title,setting,fullscreen:()=>game.fullscreen.toggle(),settings});
applySettings();
function activity(ev){
 if(ev?.isTrusted!==false){lastActivity=performance.now();if(ev?.type!=='pointermove')audio.unlock();}
 if(state.attract){ev?.preventDefault?.();ev?.stopImmediatePropagation?.();title();exitLatch=.3;}
}
for(const ev of ['keydown','pointerdown','wheel'])window.addEventListener(ev,activity,{capture:true,passive:false});
window.addEventListener('pointermove',e=>{if(e.movementX||e.movementY)activity(e);},{capture:true});
window.addEventListener('gamepadconnected',()=>{lastActivity=performance.now();});
window.addEventListener('gamepaddisconnected',()=>pause('Controller disconnected'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause('Flight paused while away');});
function spawnEnemy(o={}){const p=state.player,type=o.type||'scout',hp=type==='gunship'?70:type==='interceptor'?28:18;const e={id:++uid,x:o.x??p.x,y:p.y+(o.ahead||600),z:o.z||70,yaw:Math.PI,bank:0,type,hp,maxHp:hp,r:type==='gunship'?16:9,fireTimer:rand(1,3.5),age:0,seed:rand(0,TAU),hit:0,...o};state.enemies.push(e);return e;}
function spawnWave(w){const count=w.count||4;for(let i=0;i<count;i++){const spacing=w.spacing||30,ox=(i-(count-1)/2)*spacing;spawnEnemy({type:w.type||'scout',x:clamp((w.x||0)+ox,-115,115),z:clamp((w.z||70)+(w.formation==='spiral'?Math.sin(i*1.6)*28:0),30,125),ahead:600+(w.formation==='vee'?Math.abs(i-(count-1)/2)*35:i*20)});}}
function spawnArenaWave(){const p=state.player;for(let i=0;i<4;i++){const a=p.yaw+(i-1.5)*.44;spawnEnemy({type:'interceptor',x:p.x+Math.sin(a)*(350+i*35),y:p.y+Math.cos(a)*(350+i*35),z:clamp(p.z+rand(-30,30),25,145),yaw:ang(a+Math.PI),arena:true});}}
function chooseRoute(route){state.route=route;state.routeChosen=true;state.relays=0;for(let i=0;i<3;i++)spawnEnemy({type:'gunship',x:route==='rescue'?55:-55,z:55+i*22,ahead:430+i*230,objective:true,static:true,hp:45,maxHp:45});notice(route==='rescue'?'RESCUE VECTOR':'ASSAULT VECTOR',route==='rescue'?'Destroy three jammers to free PIP.':'Destroy three relays to upgrade your weapons.');say(route==='rescue'?'PIP':'ROOK',route==='rescue'?'They’ve jammed my drives! Three signal ships ahead. I owe you one.':'Those relays feed their armor. Knock all three out and take their power.');}
function transition(stage){
 state.stage=stage;state.stageStart=state.clock;state.enemies=[];state.bullets=[];state.pickups=[];state.charge=0;state.target=null;state.warp=1;state.player.invuln=3;state.player.energy=100;
 if(stage===1){state.wingB=70;snapshotCheckpoint();notice('THE FORK','Fly RIGHT to rescue PIP • LEFT to raid the relay',6);state.routeChosen=false;say('PIP','I’m trapped on the right fork! The left route leads straight to their relays.');}
 if(stage===2){
  const rescued=state.route==='rescue'&&state.relays>=3;state.stats.rescued=rescued;
  if(rescued){state.wingB=100;state.player.health=Math.min(state.player.maxHealth,state.player.health+40);say('PIP','Clear skies! I’ll keep your shields topped up. Let’s finish this.');}
  else if(state.route==='assault'&&state.relays>=3){state.player.laser=2;state.player.bombs=Math.min(5,state.player.bombs+2);state.wingB=40;say('ROOK','Relay power acquired. Twin plasma and two novas. Make them count.');}
  else{state.wingB=0;say('PIP','I’m pulling out. You can do this without me.');}
  state.player.x=0;state.player.y=0;state.player.yaw=0;state.stats.arenaKills=0;state.ambientSpawn=0;state.arenaAnchor={x:0,y:0};audio.setMode('arena');spawnArenaWave();snapshotCheckpoint();notice('ALL-RANGE MODE','360° steering • △ / F reverses your heading',5);
 }
 if(stage===3){state.player.x=0;state.player.y=0;state.player.yaw=0;state.player.z=75;state.player.bombs=Math.max(1,state.player.bombs);audio.setMode('boss');spawnBoss();snapshotCheckpoint();notice('THE NIGHTJAR','Break the engine pods. Expose the star cannon.',5);say('ROOK','Two engines are shielding that core. Take them apart.');}
 state.camera={x:state.player.x,y:state.player.y-58,z:state.player.z+18,yaw:0,pitch:-.12};
}
function spawnBoss(){state.boss={id:++uid,x:0,y:state.player.y+380,z:90,yaw:0,phase:0,hp:960,maxHp:960,left:180,right:180,core:600,fireTimer:2,telegraph:0,age:0,hit:0,phaseHealth:300};}
function bossTargets(){const b=state.boss;if(!b)return[];if(b.phase===0)return[['left',-48],['right',48]].filter(([k])=>b[k]>0).map(([k,x])=>({id:'boss-'+k,x:b.x+x,y:b.y-24,z:b.z+2,r:18,boss:true,key:k}));return[{id:'boss-core',x:b.x,y:b.y-39,z:b.z+4,r:22,boss:true,key:'core'}];}
function aimTarget(cone=.32){const p=state.player,forward={x:Math.sin(p.yaw),y:Math.cos(p.yaw)};let best=null,bestD=Infinity;for(const e of [...state.enemies,...bossTargets()]){if(e.dead)continue;const dx=e.x-p.x,dy=e.y-p.y,dz=e.z-p.z,d=Math.hypot(dx,dy,dz),along=dx*forward.x+dy*forward.y,side=dx*forward.y-dy*forward.x;if(along<20||d>950)continue;const off=Math.hypot(side,dz)/along;if(off<cone){const weight=off*650+d*.15;if(weight<bestD){bestD=weight;best=e;}}}return best;}
function shoot(kind='laser',target=null){const p=state.player,missile=kind==='missile';if(missile)state.stats.missiles++;else state.stats.shots++;
 for(const side of missile?[0]:[-1,1]){const ox=Math.cos(p.yaw)*side*7,oy=-Math.sin(p.yaw)*side*7,b={x:p.x+ox,y:p.y+oy,z:p.z,life:missile?5:2.5,team:'player',kind,speed:missile?260:470,dmg:missile?55:p.laser===2?8:5,target:target?.id,r:missile?10:3};let dx=Math.sin(p.yaw),dy=Math.cos(p.yaw),dz=0;if(target){dx=target.x-b.x;dy=target.y-b.y;dz=target.z-b.z;}const d=Math.hypot(dx,dy,dz)||1;Object.assign(b,{vx:dx/d*b.speed,vy:dy/d*b.speed,vz:dz/d*b.speed});state.bullets.push(b);}
 audio.sfx(missile?'missile':'laser');if(missile){rumble(.22,130);notice('SEEKER AWAY','Lock-on splash damages nearby targets.',1.8);}
}
function enemyShot(e,spread=0){const available=state.wingmen.filter(w=>w.active);const p=available.length&&Math.random()<.15?available[Math.floor(Math.random()*available.length)]:state.player;let dx=p.x-e.x+rand(-spread,spread),dy=p.y-e.y,dz=p.z-e.z+rand(-spread*.4,spread*.4),d=Math.hypot(dx,dy,dz)||1;state.bullets.push({x:e.x,y:e.y,z:e.z,vx:dx/d*155,vy:dy/d*155,vz:dz/d*155,life:8,team:'enemy',kind:'orb',dmg:10,r:3});}
function burst(x,y,z,size=1,color='#ffaf64'){for(let i=0;i<22*size;i++){const life=rand(.3,1.2);state.particles.push({x,y,z,vx:rand(-55,55)*size,vy:rand(-45,45)*size,vz:rand(-25,55)*size,size:rand(1,4)*size,color:i%4===0?'#fff3cf':color,life,maxLife:life,kind:i%5===0?'smoke':'spark'});}state.particles.push({x,y,z,vx:0,vy:0,vz:0,size:22*size,color,life:.45,maxLife:.45,kind:'explosion'});audio.sfx('explosion');}
function killEnemy(e){if(e.dead)return;e.dead=true;state.stats.kills++;if(state.stage===2)state.stats.arenaKills++;if(e.objective){state.relays++;notice('SIGNAL SHIP DESTROYED',state.relays+' / 3 objectives cleared');}const points=e.type==='gunship'?300:100;state.score+=points*state.combo;state.combo=Math.min(8,state.combo+1);state.stats.maxCombo=Math.max(state.stats.maxCombo||1,state.combo);state.comboTimer=4.5;burst(e.x,e.y,e.z,e.type==='gunship'?1.5:1);if(state.stats.kills%6===0)state.pickups.push({x:e.x,y:e.y,z:e.z,type:state.stats.kills%12===0?'upgrade':'shield',rot:0});}
function damageEnemy(e,dmg){if(e.boss){const b=state.boss;if(!b)return;if(b.phase===1&&b.age%7<2.2){if(state.lockHint!=='CORE SHIELDED'){state.lockHint='CORE SHIELDED';}return;}b[e.key]=Math.max(0,b[e.key]-dmg);b.hit=.12;state.stats.hits++;b.hp=b.left+b.right+b.core;
 if(b.phase===0&&b.left<=0&&b.right<=0){b.phase=1;b.age=0;notice('CORE EXPOSED','Fire when its shield drops.');say('CONTROL','Engine shields down. Core cycles: wait for the amber opening.');}
 if(b.phase===1&&b.core<=300){b.phase=2;b.age=0;b.fireTimer=1;notice('STAR CANNON / OVERDRIVE','Roll through the volleys. Move away from the charge beam.');say('ROOK','It’s overloading! Finish the core before it fires again.');}
 if(b.core<=0){burst(b.x,b.y,b.z,5);state.score+=5000;state.boss=null;finish(true);}return;}
 e.hp-=dmg;e.hit=.1;state.stats.hits++;if(e.hp<=0)killEnemy(e);
}
function damage(amount){const p=state.player;if(state.attract||p.invuln>0||p.rollTimer>0||p.flipTimer>0)return;const mult=settings.difficulty==='Cadet'?.55:settings.difficulty==='Ace'?1.35:1;p.health=Math.max(0,p.health-amount*mult);p.invuln=1.1;state.stats.damage+=amount*mult;state.combo=1;audio.sfx('hit');game.shake(3);rumble(.55,180);if(p.health<=0){burst(p.x,p.y,p.z,2);finish(false);}else if(p.health<30&&!state.wingWarn){state.wingWarn=true;say('ROOK','Shields critical. Find a blue repair cell. Keep rolling!','#ff8d70');}}
function bomb(){const p=state.player;if(p.bombs<=0){notice('NOVA EMPTY','Collect amber ammunition capsules.',2);return;}p.bombs--;state.bombFlash=1;p.invuln=1.5;state.bullets=state.bullets.filter(b=>b.team==='player');for(const e of state.enemies)if(dist(p,e)<1000)damageEnemy(e,95);for(const t of bossTargets())damageEnemy(t,95);audio.sfx('bomb');rumble(.8,260);notice('NOVA DETONATED','Incoming fire cleared.',2);}
function roll(dir){const p=state.player;if(p.rollCool>0||p.energy<18)return;p.rollTimer=.68;p.rollCool=.9;p.rollDir=dir;p.energy-=18;state.stats.rolls=(state.stats.rolls||0)+1;audio.sfx('roll');rumble(.15,90);}
function flip(){const p=state.player;if(p.flipCool>0||p.energy<32)return;p.flipTimer=1.15;p.flipCool=2;p.flipYaw=p.yaw;p.energy-=32;audio.sfx('warp');notice(state.stage===2?'U-TURN':'SOMERSAULT','Incoming fire evaded.',1.5);}
function segmentDistance(b,e){const dx=b.x-b.px,dy=b.y-b.py,dz=b.z-b.pz,n=dx*dx+dy*dy+dz*dz,t=clamp(((e.x-b.px)*dx+(e.y-b.py)*dy+(e.z-b.pz)*dz)/(n||1),0,1);return Math.hypot(b.px+dx*t-e.x,b.py+dy*t-e.y,b.pz+dz*t-e.z);}
function botInput(dt){const p=state.player;const candidates=[...state.enemies,...bossTargets()].filter(e=>!e.dead);let target=candidates.sort((a,b)=>dist(p,a)-dist(p,b))[0];let mx=0,my=0;if(target){if(state.stage===2)mx=clamp(ang(Math.atan2(target.x-p.x,target.y-p.y)-p.yaw)*2.2,-1,1);else mx=clamp((target.x-p.x)*.06,-1,1);my=clamp((p.z-target.z)*.07,-1,1);}else{mx=Math.sin(state.clock*.4)*.3;my=Math.sin(state.clock*.22)*.25;}
 if(state.stage===1&&!state.routeChosen)mx=1;
 const phase=state.clock%7;return{mx,my,fire:phase>1.4,charge:phase<1.4,bomb:Math.floor(state.clock/21)!==state.botBomb,rollL:Math.floor(state.clock/6)!==state.botRoll,rollR:false,boost:!target&&state.clock%14<3,brake:false,flip:state.stage===2&&Math.floor(state.clock/19)!==state.botFlip};}
function updatePlayer(dt){const p=state.player,inp=game.input;let input;if(state.attract){input=botInput(dt);state.botBomb=Math.floor(state.clock/21);state.botRoll=Math.floor(state.clock/6);state.botFlip=Math.floor(state.clock/19);p.health=p.maxHealth;p.bombs=5;p.energy=100;}else{let [mx,my]=inp.move();input={mx:mx*(settings.invertX?-1:1),my:my*(settings.invertY?-1:1),fire:inp.down('fire'),charge:inp.down('charge'),bomb:inp.pressed('bomb'),rollL:inp.pressed('rollLeft'),rollR:inp.pressed('rollRight'),boost:inp.down('boost'),brake:inp.down('brake'),flip:inp.pressed('flip')};}
 const {mx,my}=input;p.invuln=Math.max(0,p.invuln-dt);p.rollCool=Math.max(0,p.rollCool-dt);p.flipCool=Math.max(0,p.flipCool-dt);p.rollTimer=Math.max(0,p.rollTimer-dt);p.flipTimer=Math.max(0,p.flipTimer-dt);
 if(input.rollL)roll(-1);if(input.rollR)roll(1);if(input.flip)flip();if(input.bomb)bomb();
 p.roll=p.rollTimer>0?p.rollDir*(1-p.rollTimer/.68)*TAU:0;p.flip=p.flipTimer>0?1-p.flipTimer/1.15:0;
 const wasBoost=p.boost;p.boost=!!(input.boost&&p.energy>1&&!input.brake);if(p.boost&&!wasBoost)audio.sfx('boost');p.brake=!!input.brake;
 p.energy=clamp(p.energy+(p.boost?-27:18)*dt,0,100);p.speed=E.lerp(p.speed,p.boost?150:p.brake?40:85,1-Math.exp(-dt*5));
 p.vz=E.lerp(p.vz,-my*88,1-Math.exp(-dt*8));p.z=clamp(p.z+p.vz*dt,18,150);
 if(state.stage===2){if(p.flipTimer>0)p.yaw=p.flipYaw+Math.PI*Math.min(1,p.flip*1.5);else p.yaw=ang(p.yaw+mx*1.18*dt);p.x+=Math.sin(p.yaw)*p.speed*dt;p.y+=Math.cos(p.yaw)*p.speed*dt;
 if(Math.hypot(p.x,p.y)>1500){p.yaw=E.approachAng(p.yaw,Math.atan2(-p.x,-p.y),dt*1.5);state.lockHint='RETURNING TO COMBAT ZONE';}
 }else{p.vx=E.lerp(p.vx,mx*95,1-Math.exp(-dt*8));p.x=clamp(p.x+p.vx*dt,-132,132);p.y+=p.speed*dt;p.yaw=0;}
 p.bank=E.lerp(p.bank,-mx*.55,1-Math.exp(-dt*8));state.energy=p.energy;
 if(p.z<=18&&my>.25&&state.clock%2<dt)damage(8);
 state.target=aimTarget(input.charge?.45:settings.assist?.26:.08);if(state.target)state.target.locked=state.charge>=.95;
 if(input.charge){state.charge=clamp(state.charge+dt/1.1,0,1);if(state.charge>=.95&&!state.wasLocked&&state.target){audio.sfx('lock');state.wasLocked=true;}}
 else{if(state.wasCharge&&state.charge>=.65){shoot('missile',state.target);state.player.fireTimer=.2;}state.charge=0;state.wasLocked=false;}
 state.wasCharge=input.charge;p.fireTimer-=dt;
 if(input.fire&&!input.charge&&p.fireTimer<=0){p.fireTimer=.14;shoot('laser',settings.assist?state.target:null);}
 state.lockHint=input.charge?(state.target?(state.charge>=.95?'LOCKED / RELEASE L2':'ACQUIRING TARGET'):'SEEKING TARGET'):'';
}
function updateEnemies(dt){const p=state.player;
 for(const e of state.enemies){e.age+=dt;e.hit=Math.max(0,e.hit-dt);if(e.dead)continue;
 if(e.arena){const desired=Math.atan2(p.x-e.x,p.y-e.y),d=dist(e,p);e.yaw=E.approachAng(e.yaw,d<110?desired+.9:desired,dt*.65);e.x+=Math.sin(e.yaw)*65*dt;e.y+=Math.cos(e.yaw)*65*dt;e.z+=clamp(p.z-e.z,-15,15)*dt*.3;e.bank=Math.sin(e.age)*.35;}
 else if(!e.static){e.y-=e.type==='interceptor'?30*dt:12*dt;e.x+=Math.sin(e.age*1.3+e.seed)*dt*12;e.bank=Math.cos(e.age*1.3+e.seed)*.25;}
 e.fireTimer-=dt;const d=dist(p,e);if(e.fireTimer<0&&d<650&&d>45){e.fireTimer=e.type==='gunship'?1.7:settings.difficulty==='Ace'?2.2:3.6;enemyShot(e,35);if(e.type==='gunship'){enemyShot({...e,x:e.x-12},25);enemyShot({...e,x:e.x+12},25);}}
 if(d<e.r+9){damage(24);if(!e.objective){damageEnemy(e,50);}}
 if((state.stage!==2&&e.y<p.y-100)||d>2100)e.dead=true;
 }
 state.enemies=state.enemies.filter(e=>!e.dead);
}
function updateBullets(dt){const p=state.player;
 for(const b of state.bullets){b.px=b.x;b.py=b.y;b.pz=b.z;b.life-=dt;
 if(b.kind==='missile'&&b.target){const t=[...state.enemies,...bossTargets()].find(e=>e.id===b.target);if(t){const d=dist(t,b)||1,k=1-Math.exp(-dt*7);b.vx=E.lerp(b.vx,(t.x-b.x)/d*b.speed,k);b.vy=E.lerp(b.vy,(t.y-b.y)/d*b.speed,k);b.vz=E.lerp(b.vz,(t.z-b.z)/d*b.speed,k);}}
 b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;
 if(b.team==='enemy'){
  if(p.rollTimer>0&&segmentDistance(b,p)<28){b.team='player';b.vx=-b.vx;b.vy=-b.vy;b.vz=-b.vz;b.life=4;b.dmg=35;state.stats.reflections++;state.score+=25;audio.sfx('pickup');}
  else if(segmentDistance(b,p)<9){damage(b.dmg);b.life=0;}
  if(b.life>0)for(let i=0;i<state.wingmen.length;i++){const w=state.wingmen[i],k=i?'wingB':'wingA';if(w.active&&segmentDistance(b,w)<8){state[k]=Math.max(0,state[k]-5);b.life=0;if(state[k]===0)say(i?'PIP':'ROOK','My wing is gone. Returning to base. You’ve got this.','#ff9e79');break;}}
 }else{for(const e of [...state.enemies,...bossTargets()]){if(e.dead)continue;if(segmentDistance(b,e)<e.r+(b.r||3)){damageEnemy(e,b.dmg);b.life=0;if(b.kind==='missile'){burst(b.x,b.y,b.z,.8,'#9ef9df');for(const other of state.enemies)if(other!==e&&!other.dead&&dist(e,other)<65)damageEnemy(other,35);}break;}}}
 }
 state.bullets=state.bullets.filter(b=>b.life>0);
}
function updateBoss(dt){const b=state.boss;if(!b)return;const p=state.player;b.age+=dt;b.y=p.y+380;b.x=Math.sin(b.age*.24)*24;b.hit=Math.max(0,b.hit-dt);b.fireTimer-=dt;
 if(b.fireTimer<=0){b.fireTimer=b.phase===2?.85:b.phase===1?1.6:2.3;for(let i=-2;i<=2;i++)enemyShot({x:b.x+i*25,y:b.y-12,z:b.z+Math.sin(i+b.age)*15},b.phase===2?70:40);}
 const cycle=b.age%10;b.telegraph=b.phase===2&&cycle>7?(cycle-7)/3:0;
 if(b.phase===2&&cycle<dt&&b.age>1){if(Math.abs(p.x-b.x)<35)damage(35);state.bombFlash=.3;audio.sfx('bomb');}
 if(state.attract&&b.age>20){const targets=bossTargets();if(targets.length)damageEnemy(targets[0],dt*22);}
 state.lockHint=b.phase===1&&b.age%7<2.2?'CORE SHIELD ACTIVE':state.lockHint;
}
function collect(q){const p=state.player;audio.sfx('pickup');rumble(.15,70);if(q.type==='ring'){state.stats.rings++;state.ringCount++;state.score+=150;if(state.ringCount===3){p.maxHealth=125;p.health=Math.min(125,p.health+40);notice('SHIELD CAPACITY +25','Three flight rings collected.');}else{p.health=Math.min(p.maxHealth,p.health+8);notice('FLIGHT RING',state.ringCount+' collected • +150',1.5);}}
 if(q.type==='shield'){p.health=Math.min(p.maxHealth,p.health+30);notice('SHIELDS REPAIRED','+30 integrity',1.5);}
 if(q.type==='bomb'){p.bombs=Math.min(5,p.bombs+1);notice('NOVA REPLENISHED','Area blast ready.',1.5);}
 if(q.type==='upgrade'){p.laser=2;notice('TWIN PLASMA ONLINE','Laser damage increased.',2);}}
function updateWorld(dt){
 const p=state.player;state.clock+=dt;state.bombFlash=Math.max(0,state.bombFlash-dt*1.8);state.warp=Math.max(0,state.warp-dt*.6);state.comboTimer-=dt;if(state.comboTimer<0)state.combo=1;
 updatePlayer(dt);if(state.mode!=='play')return;updateEnemies(dt);updateBoss(dt);updateBullets(dt);
 for(const q of state.pickups){q.rot=(q.rot||0)+dt;if(dist(q,p)<23){collect(q);q.dead=true;}if(state.stage!==2&&q.y<p.y-65)q.dead=true;}state.pickups=state.pickups.filter(q=>!q.dead);
 for(const q of state.particles){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;}state.particles=state.particles.filter(q=>q.life>0);
 state.wingmen=[{x:p.x-32,y:p.y+32,z:p.z+4,yaw:p.yaw,bank:p.bank,active:state.wingA>0},{x:p.x+32,y:p.y+44,z:p.z+10,yaw:p.yaw,bank:p.bank,active:state.wingB>0}];
 if(state.stage===2){state.wingmen.forEach((w,i)=>{const s=i?1:-1;w.x=p.x+Math.sin(p.yaw)*32+Math.cos(p.yaw)*s*32;w.y=p.y+Math.cos(p.yaw)*32-Math.sin(p.yaw)*s*32;});}
 state.supportTimer-=dt;if(state.supportTimer<=0){state.supportTimer=state.stats.rescued?3:5;if(state.wingA>0&&state.enemies.length){const e=state.enemies[0];state.bullets.push({x:p.x-30,y:p.y+20,z:p.z,vx:(e.x-p.x)/2,vy:(e.y-p.y)/2,vz:(e.z-p.z)/2,life:2.2,team:'player',kind:'laser',dmg:6,r:4});}if(state.stats.rescued)p.health=Math.min(p.maxHealth,p.health+1.5);}
 if(state.clock>=state.nextDrop&&state.stage<3){state.nextDrop=state.clock+13;state.pickups.push({x:state.stage===2?p.x+Math.sin(p.yaw)*230:Math.sin(state.clock*.09)*88,y:p.y+Math.cos(p.yaw)*430,z:clamp(p.z+Math.sin(state.clock)*30,35,125),type:state.clock%39<13?'ring':state.clock%39<26?'shield':'bomb',rot:0});}
 const waves=M.waves||[];while(state.waveIndex<waves.length&&waves[state.waveIndex].at<state.clock){const w=waves[state.waveIndex++];if(w.at>state.clock-dt*2&&state.stage<2)spawnWave(w);}
 const chatter=M.chatter||[];while(state.chatterIndex<chatter.length&&chatter[state.chatterIndex].at<state.clock){const c=chatter[state.chatterIndex++];if(c.at>state.clock-dt*2&&state.stage<3)say(c.name,c.text,c.color,5.5);}
 if(state.stage===0&&state.clock>=M.stages[0].until)transition(1);
 if(state.stage===1&&!state.routeChosen&&state.clock>=76)chooseRoute(p.x>0?'rescue':'assault');
 if(state.stage===1&&state.clock>=M.stages[1].until)transition(2);
 if(state.stage===2){state.ambientSpawn-=dt;if(state.enemies.length<3&&state.ambientSpawn<=0){state.ambientSpawn=6;spawnArenaWave();}if((state.stats.arenaKills>=M.stages[2].targetKills&&state.clock-state.stageStart>M.stages[2].minDuration)||state.clock>=M.stages[2].until)transition(3);}
 const cam=state.camera,cyaw=E.approachAng(cam.yaw,p.yaw,dt*4),sx=p.x-Math.sin(cyaw)*58,sy=p.y-Math.cos(cyaw)*58,k=1-Math.exp(-dt*6);cam.yaw=cyaw;cam.x=E.lerp(cam.x,sx,k);cam.y=E.lerp(cam.y,sy,k);cam.z=E.lerp(cam.z,p.z+18,k);cam.pitch=-.12;
 if(state.radioLife>0){state.radioLife-=dt;if(state.radioLife<=0)state.radio=null;}
 if(state.noticeLife>0){state.noticeLife-=dt;if(state.noticeLife<=0){state.notice='';state.noticeSub='';}}
}
function finish(win){if(state.mode!=='play')return;state.mode='debrief';state.endTimer=0;state.enemies=[];state.bullets=[];state.pickups=[];state.player.destroyed=!win;state.player.boost=win;audio.setMode(win?'victory':'failure');state.win=win;
 const accuracy=state.stats.shots?Math.min(100,Math.round(state.stats.hits/(state.stats.shots*2+state.stats.missiles)*100)):0;
 const rank=!win?'SORTIE LOST':state.score>24000?'S':state.score>16000?'A':state.score>9000?'B':'C';
 const best=E.store.get('startails.best',0);if(win&&!state.attract&&state.score>best)E.store.set('startails.best',state.score);
 state.result={score:state.score,rank,maxCombo:state.stats.maxCombo||1,wingA:state.wingA,wingB:state.wingB,kills:state.stats.kills,accuracy,rings:state.stats.rings,reflections:state.stats.reflections,rescued:state.stats.rescued,route:state.route,time:Math.floor(state.clock),best:Math.max(best,state.score),damage:Math.round(state.stats.damage),checkpoint:stages[state.stage][0]};
 if(!state.attract)STUI.show(win?'victory':'failure',state.result);
}
function hud(){const p=state.player,stage=stages[state.stage];let objective=stage[1];if(state.stage===1&&state.routeChosen)objective=(state.route==='rescue'?'Free PIP: ': 'Disable the relay: ')+state.relays+' / 3 signal ships';if(state.stage===2)objective='INTERCEPTORS  '+state.stats.arenaKills+' / 8  •  360° FLIGHT';if(state.stage===3&&state.boss)objective=state.boss.phase===0?'ENGINE PODS  '+(state.boss.left>0?'●':'○')+'  '+(state.boss.right>0?'●':'○'):state.boss.phase===1?'CORE EXPOSED  /  WAIT FOR SHIELD OPENING':'OVERDRIVE  /  EVADE THE CANNON';
 STUI.update({playing:state.mode==='play'||state.attract,attract:state.attract,stage:stage[0],objective,health:p?Math.round(p.health/(p.maxHealth||100)*100):100,energy:p?.energy??100,bombs:p?.bombs??3,score:state.score||0,combo:state.combo||1,charge:state.charge,locked:state.target&&state.charge>=.95,wingA:state.wingA??100,wingB:state.wingB??100,radio:state.radio,notice:state.notice,noticeSub:state.noticeSub,phase:state.boss?.phase,progress:state.boss?state.boss.hp/state.boss.maxHp:Math.min(1,state.clock/280),branch:state.route,lockHint:state.lockHint||'',controller:game.input.lastDevice==='gamepad',idle:state.idle||0});
}
const portraits={PIP:new E.Blob({R:15,ears:'cat',tail:true,mouth:true,colors:{dk:'#784839',base:'#d69b67',lt:'#f4c896',spec:'#ffedce',eye:'#102d3c',pupil:'#08202c'}}),ROOK:new E.Humanoid({size:2,weapon:null,hat:'helmet',outfit:'coat',armor:true,colors:{skin:'#bf9a85',cloth:'#264a5a',coat:'#355f6d',metal:'#81b3b9',plate:'#81b3b9',trim:'#efb77c'}}),CONTROL:new E.Humanoid({size:2,weapon:null,hair:'short',hat:'cap',outfit:'coat',colors:{skin:'#cba783',hair:'#d2d6c7',cloth:'#384552',coat:'#384552',trim:'#f4a16b'}})};
const portraitView=new E.View('portrait','Portrait',0,20,1.2,1);
function drawPortrait(dt){if(!state.radio)return;const c=document.getElementById('radio-portrait');if(!c)return;const g=c.getContext('2d');c.width=96;c.height=96;const rig=portraits[state.radio.name]||portraits.CONTROL;E.px.rect(g,0,0,96,96,'#143541');for(let y=4;y<96;y+=5)E.px.rect(g,0,y,96,1,'#1a3c47');if(rig===portraits.PIP){rig.update(dt,{look:[Math.sin(state.time)*.3,-.1],squash:Math.sin(state.time*3)*.025});rig.draw(g,48,70,portraitView);}else{rig.update(dt,{facing:Math.PI/2,expr:'smile',pose:'hips'});rig.draw(g,48,112,portraitView);}E.px.rect(g,4,4,4,4,'#80e6de');}
function update(dt){
 state.time+=dt;state.reducedMotion=settings.motion;exitLatch=Math.max(0,exitLatch-dt);const inp=game.input;
 if(inp.anyPressed()||Math.hypot(...inp.padMove)>.22){lastActivity=performance.now();audio.unlock();if(state.attract){title();return;}}
 if(inp.padLost)pause('Controller disconnected');
 if(inp.pressed('fullscreen'))game.fullscreen.toggle();
 if(exitLatch<=0){if(STUI.mode){for(const d of ['up','down','left','right'])if(inp.repeat(d,.32,.14)){STUI.navigate(d);audio.sfx('select');}if(inp.pressed('confirm')||inp.pressed('start')){STUI.activate();audio.sfx('confirm');}else if(inp.pressed('cancel'))STUI.back();}else if(inp.pressed('pause')){pause();}}
 if(state.mode==='title'){state.idle=(performance.now()-lastActivity)/1000;if(STUI.mode==='title'&&state.idle>=10){start(true);state.botBomb=0;state.botRoll=0;state.botFlip=0;}}
 else if(state.mode==='play'&&!STUI.mode)updateWorld(dt*(state.attract?1.4:1));
 else if(state.mode==='debrief'){state.endTimer+=dt;if(state.win){state.player.y+=dt*100;state.camera.y+=dt*100;for(const w of state.wingmen)w.y+=dt*100;}for(const q of state.particles){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;}state.particles=state.particles.filter(q=>q.life>0);if(state.attract&&state.endTimer>7)start(true);}
 audio.update(dt,{speed:state.player?.speed||0,charge:state.charge,health:state.player?.health||100});
 uiClock+=dt;if(uiClock>.05){hud();drawPortrait(uiClock);uiClock=0;}
 game.focus(game.W/2,game.H/2,0);
}
game.debug={snapshot(){return{title:'StarTails Squadron',engine:E.version,mode:state.mode,menu:STUI.mode,attract:state.attract,stage:state.stage,clock:+state.clock.toFixed(2),route:state.route,player:{...state.player},enemies:state.enemies.length,bullets:state.bullets.length,pickups:state.pickups.length,boss:state.boss?{phase:state.boss.phase,hp:state.boss.hp,left:state.boss.left,right:state.boss.right,core:state.boss.core}:null,stats:{...state.stats},score:state.score,settings:{...settings},errors:game.errors.length};}};
window.StarTails={game,get state(){return state;},controls,start:()=>start(false),title,settings,setting};
game.start({scene:'flight',scenes:{flight:{pausable:false,update,draw(r){art.draw(r,state);}}}});
title();
})();
/* GAME END */

</script>
