/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

function panelHTML(){let content='';if(panel==='settings'){let opts=[`Music <span class="value">${settings.music?'ON':'OFF'}</span>`,`Sound effects <span class="value">${settings.sfx?'ON':'OFF'}</span>`,`Invert horizontal <span class="value">${settings.invertX?'ON':'OFF'}</span>`,`Invert vertical <span class="value">${settings.invertY?'ON':'OFF'}</span>`,'How to play','Resume / Back'];if(!hub&&state!=='title')opts.splice(5,0,'Quit to title');content=`<h2>Settings</h2><p class="sub">Make it yours</p>${menuMarkup(opts,panelIndex)}`}else if(panel==='controls'){content=`<h2>How to play</h2><p class="sub">Read the fight. Find your opening.</p><div class="controls-grid"><div>Move / jump / crouch <b>STICK / D-PAD</b></div><div>Light attack <b>□ / J</b></div><div>Heavy attack <b>△ / K</b></div><div>Thunder shot <b>○ / L</b></div><div>Super · full meter <b>R1 / I</b></div><div>Dash <b>R2 / SHIFT</b></div><div>Guard <b>HOLD BACK</b></div><div>Settings <b>OPTIONS / ESC</b></div></div><p>Keyboard: arrows move, up jumps, down crouches. Chain light into heavy, then launch a thunder shot. Holding away from your opponent blocks standing attacks; crouch + away blocks low attacks. A full blue meter unlocks your super.</p><p>Local player 2: A/D move, W jump, S crouch, F light, G heavy, H shot, T super, R dash. A second controller also works.</p>${menuMarkup(['Back'],panelIndex)}`}else if(panel==='about'){content=`<h2>About / Credits</h2><p class="sub">Street Thunder Alpha · an original tribute</p><p>“One rooftop. Three rivals. A whole lot of thunder.”</p><p class="tiny">SOURCE INFORMATION<br>Date: 2026-10-29 09:39 · Source: Street Fighter Alpha 2<br>Tech: Three.js r180 WebGPU; Rapier 0.19.3; Web Audio API; Gamepad API; AI Hub Session Protocol v1 client 1.3.0.<br>Art: original cel-shaded 2.5D. Animation: procedural articulated poses. Audio: code-generated music, effects and gibberish voices. Online: AI Hub parallel score challenge; local versus. Testing: lightweight headless checks. Environment: Codex CLI (headless); Linux; browser unknown. Model: OpenAI gpt-6.1-terra, xhigh. Usage: unknown.</p><p class="tiny">TESTING FEEDBACK<br>Issues caught: 1. Critical: 1 (invalid initial physics input, fixed). Most helpful: WebGPU combat smoke test. Least helpful: static syntax check.</p><p class="tiny">ENGINE FEEDBACK<br>Liked: expressive Three.js stage and lighting. Got stuck: WebGPU depends on browser support. Built: combat, character animation, AI and interface. Hardest: async WebGPU initialization. Overhaul: clearer Rapier initialization. Change: better WebGPU diagnostics.</p><p class="tiny">PROMPT FEEDBACK<br>Liked: controller-first direction. Confusing: standalone online transport was unspecified. Hardest: combining fighting mechanics and hub sessions. Desired test: real controllers and multi-device online play.</p>${menuMarkup(['Back'],panelIndex)}`}else if(panel==='result'){content=`<h2>${wins[0]>=2?'You win!':wins[1]>=2?'Rival wins!':'Time!'}</h2><p class="sub">${mode==='arcade'&&wins[0]>=2?'The city has another challenger waiting.':'The rooftop remembers every punch.'}</p><p>Score ${score} &nbsp; · &nbsp; ${wins[0]} — ${wins[1]} rounds</p>${menuMarkup(mode==='arcade'&&wins[0]>=2&&rival<1?['Next challenger','Return to title']:['Play again','Return to title'],panelIndex)}`}return `<div class="panel-wrap"><div class="panel">${content}</div></div>`}
function openPanel(p){panel=p;panelIndex=0;updateUI()}
function activateMenu(){tone(500,.08);if(menuIndex===0)startGame('arcade');else if(menuIndex===1)startGame('versus');else if(menuIndex===2)startGame('training');else if(menuIndex===3)openPanel('controls');else if(menuIndex===4)openPanel('settings');else openPanel('about')}
function activatePanel(){tone(500,.08);if(panel==='settings'){if(panelIndex<4){let k=['music','sfx','invertX','invertY'][panelIndex];settings[k]=!settings[k];try{localStorage.setItem('sta-settings',JSON.stringify(settings))}catch{}updateUI()}else if(panelIndex===4)openPanel('controls');else if(!hub&&state!=='title'&&panelIndex===5){panel='';state='title';titleFighters();lastInput=performance.now();updateUI()}else{panel='';updateUI()}}else if(panel==='result'){let i=panelIndex;panel='';if(i===0){if(mode==='arcade'&&wins[0]>=2&&rival<1){rival++;round=1;wins=[0,0];startFight()}else startGame(mode)}else{state='title';titleFighters();lastInput=performance.now();updateUI()}}else{panel='';updateUI()}}
function goBack(){if(panel){panel='';updateUI()}else openPanel('settings')}
function action(f,name,low=false){if(f.stun>0||f.actTime>0||roundDelay>0)return;if(name==='super'&&f.meter<100)return;if(name==='super')f.meter=0;f.low=low;f.action=name;f.actTime=moves[name].duration;f.hit=false;tone(name==='heavy'?160:260,.10,'sawtooth',.035,.5);if(name==='special'||name==='super')voice()}
function burst(x,y,color,count=10){for(let i=0;i<count;i++){let m=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.12),mat(color));m.position.set(x,y,.55);scene.add(m);particles.push({mesh:m,vx:(Math.random()-.5)*7,vy:Math.random()*5,vz:(Math.random()-.5)*3,life:.25+Math.random()*.3})}}
function damage(a,b,m){if(b.stun>0&&b.hp<=0)return;let blocked=b.block&&b.grounded&&(!a.low||b.crouch);let amount=blocked?Math.max(1,Math.floor(m.damage*.15)):m.damage;b.hp=Math.max(0,b.hp-amount);b.stun=blocked?.12:m.stun;b.rb.setLinvel({x:a.facing*(blocked?1.5:m.push),y:blocked?0:1,z:0},true);a.meter=Math.min(100,a.meter+m.meter);b.meter=Math.min(100,b.meter+4);burst(b.rb.translation().x,1.5,blocked?0x70e9ef:0xffd564,blocked?6:14);flash=.1;tone(blocked?440:110,blocked?.12:.18,'square',.08,blocked?1.2:.35);if(a===fighters[0]&&!blocked){score+=amount*100;comboCount=comboTimer>0?comboCount+1:1;comboTimer=1.2;if(comboCount>1)score+=comboCount*100;if(hub)AIHub.progress({score,label:`Rival ${rival+1} · ${score} pts`})}}
function shoot(f,superMove){let mesh=sphere(superMove?.38:.23,mat(superMove?0xffce4b:0x65eaff),f.rb.translation().x+f.facing*.8,1.35,.2);projectiles.push({mesh,owner:f,dir:f.facing,life:2,superMove});tone(superMove?140:320,.25,'sawtooth',.04,1.8)}
function simFighter(f,op,c,dt){c.x=c.x||0;let pos=f.rb.translation(),vel=f.rb.linvel();f.facing=pos.x<op.rb.translation().x?1:-1;f.grounded=pos.y<1.05&&vel.y<.3;f.stun=Math.max(0,f.stun-dt);if(f.actTime>0){let prev=f.actTime;f.actTime-=dt;let m=moves[f.action];if(!f.hit&&prev>m.duration-m.active&&f.actTime<=m.duration-m.active){f.hit=true;if(f.action==='special'||f.action==='super')shoot(f,f.action==='super');else if(Math.abs(pos.x-op.rb.translation().x)<m.range&&Math.abs(pos.y-op.rb.translation().y)<1.2)damage(f,op,m)}if(f.actTime<=0)f.action='idle'}f.crouch=!!c.down;f.block=c.x===-f.facing&&f.grounded&&f.actTime<=0;let vx=vel.x;if(f.stun<=0&&roundDelay<=0){vx=(f.actTime>0?0:c.x*4.2);if(c.dash&&f.grounded){vx=(c.x||f.facing)*9;tone(150,.1,'sawtooth',.02,2)}if(c.jump&&f.grounded){f.rb.setLinvel({x:vx,y:8.5,z:0},true);tone(220,.12,'sine',.03,1.6)}else f.rb.setLinvel({x:vx,y:vel.y,z:0},true);if(c.light)action(f,'light',c.down);else if(c.heavy)action(f,'heavy',c.down);else if(c.special)action(f,'special');else if(c.super)action(f,'super')}if(pos.x<-7.2||pos.x>7.2)f.rb.setTranslation({x:THREE.MathUtils.clamp(pos.x,-7.2,7.2),y:pos.y,z:0},true);
let t=worldTime;f.root.position.set(pos.x,pos.y-1.0,0);f.root.rotation.y=f.facing===1?Math.PI/2:-Math.PI/2;f.body.position.y=c.down&&f.grounded?-.35:Math.sin(t*6)*.025;f.body.rotation.z=f.stun>0?-.16:0;let walk=Math.abs(vx)>1&&f.grounded?Math.sin(t*12)*.5:0;f.ll.rotation.x=walk;f.rl.rotation.x=-walk;f.la.rotation.x=-.7-walk*.5;f.ra.rotation.x=-1+walk*.5;f.la.rotation.z=-.25;f.ra.rotation.z=.25;if(!f.grounded){f.ll.rotation.x=.6;f.rl.rotation.x=-.6}if(f.actTime>0){let phase=1-f.actTime/moves[f.action].duration;f.ra.rotation.x=-1.4-Math.sin(phase*Math.PI)*1.3;if(f.action==='heavy')f.rl.rotation.x=-Math.sin(phase*Math.PI)*1.7;if(f.action==='special'||f.action==='super')f.la.rotation.x=-1.8}if(f.block){f.la.rotation.x=-1.8;f.ra.rotation.x=-1.8}}
function ai(f,op,dt){f.aiTimer-=dt;if(f.aiTimer<=0){f.aiTimer=.16+Math.random()*.35;let d=Math.abs(f.rb.translation().x-op.rb.translation().x);f.aiDir=d>1.6?f.facing:(Math.random()<.35?-f.facing:0);let attack=Math.random();f.aiAction=d<2?(attack<.38?'light':attack<.6?'heavy':''):attack<.22?'special':'';if(f.meter>=100&&Math.random()<.5)f.aiAction='super';f.aiJump=Math.random()<.08}let c={x:f.aiDir,jump:f.aiJump};if(f.aiAction){c[f.aiAction]=true;f.aiAction=''}f.aiJump=false;return c}
function finishRound(){if(roundDelay>0)return;roundDelay=2.3;let a=fighters[0],b=fighters[1],winner=a.hp===b.hp?-1:a.hp>b.hp?0:1;if(winner>=0)wins[winner]++;banner=winner<0?'DRAW':`${names[fighters[winner].idx]} WINS`;bannerTime=2.2;if(winner===0){score+=1000+Math.ceil(timer)*10;if(hub)AIHub.progress({score,label:`Rival ${rival+1} · ${score} pts`})}tone(220,.4,'sawtooth',.06,1.8);voice()}
function nextRound(){if(wins[0]>=2||wins[1]>=2){if(hub){if(wins[0]>=2&&rival<1){rival++;wins=[0,0];round=1;startFight()}else finishHub()}else if(attract){rival=(rival+1)%2;wins=[0,0];round=1;startFight()}else{state='over';openPanel('result')}}else{round++;startFight()}}
function finishHub(){if(hubDone)return;hubDone=true;state='over';banner='CHALLENGE COMPLETE';bannerTime=100;AIHub.result({score,stats:{rivals:rival+1}});updateUI()}
function step(dt,c1,c2){if(state!=='play'||ended||hub&&(!hubStarted||AIHub.time()<0)||panel&&!hub&&!attract)return;worldTime+=dt;comboTimer=Math.max(0,comboTimer-dt);bannerTime=Math.max(0,bannerTime-dt);if(roundDelay>0){roundDelay-=dt;if(roundDelay<=0){nextRound();return}}else if(mode!=='training'){timer-=dt;if(timer<=0)finishRound()}let a=fighters[0],b=fighters[1];if(!a||!b)return;simFighter(a,b,attract?ai(a,b,dt):c1,dt);simFighter(b,a,(localTwo&&!attract)?c2:ai(b,a,dt),dt);world.timestep=dt;world.step();for(let i=projectiles.length-1;i>=0;i--){let p=projectiles[i];p.mesh.position.x+=p.dir*7*dt;p.mesh.rotation.z+=dt*8;p.life-=dt;let target=p.owner===a?b:a;if(Math.abs(p.mesh.position.x-target.rb.translation().x)<.55&&Math.abs(target.rb.translation().y-1.0)<1.1){damage(p.owner,target,p.superMove?moves.super:moves.special);p.life=0}if(p.life<=0){scene.remove(p.mesh);projectiles.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;p.vy-=12*dt;p.mesh.rotation.z+=dt*8;if(p.life<=0){scene.remove(p.mesh);particles.splice(i,1)}}if(mode==='training'){a.hp=Math.min(100,a.hp+dt*4);b.hp=Math.min(100,b.hp+dt*4);a.meter=Math.min(100,a.meter+dt*5)}else if((a.hp<=0||b.hp<=0)&&roundDelay<=0)finishRound();flash=Math.max(0,flash-dt);uiClock-=dt;if(uiClock<=0){updateUI();uiClock=.08}}
function pressed(code){return !!keyPressed[code]}function held(code){return !!keys[code]}
function readPad(index){let pad=navigator.getGamepads?.()[index];if(!pad)return {buttons:[],axes:[0,0],edges:[]};let old=prevPads[index]||[];let buttons=pad.buttons.map(b=>b.pressed),edges=buttons.map((v,i)=>v&&!old[i]);prevPads[index]=buttons;let x=pad.axes[0]||0,y=pad.axes[1]||0;if(settings.invertX)x=-x;if(settings.invertY)y=-y;return {buttons,edges,axes:[x,y]}}
let navHeld=0;function readInputs(dt){let pads=[readPad(0),readPad(1)],p=pads[0],q=pads[1];let anyKey=Object.keys(keyPressed).length>0,anyPad=pads.some(z=>z.edges.some(Boolean)||z.axes.some(v=>Math.abs(v)>.6));if(anyKey||anyPad){lastInput=performance.now();unlock();if(attract){attract=false;state='title';titleFighters();panel='';updateUI();keyPressed={};return [{},{}]}}
let nav=0;if(pressed('ArrowDown')||pressed('KeyS')||p.edges[13])nav=1;if(pressed('ArrowUp')||pressed('KeyW')||p.edges[12])nav=-1;if(Math.abs(p.axes[1])>.6){navHeld-=dt;if(navHeld<=0){nav=p.axes[1]>0?1:-1;navHeld=.24}}else navHeld=0;
let confirm=pressed('Enter')||pressed('Space')||p.edges[0],back=pressed('Escape')||(p.edges[1]&&(panel||state==='title'))||(p.edges[9]&&!p.buttons[8]);if(back){goBack();keyPressed={};return [{},{}]}
if(panel){if(nav){let count=ui.querySelectorAll('.panel button[data-index]').length;panelIndex=(panelIndex+nav+count)%count;updateUI();tone(380,.04)}if(confirm)activatePanel();keyPressed={};return [{},{}]}
if(state==='title'){if(nav){menuIndex=(menuIndex+nav+6)%6;updateUI();tone(380,.04)}if(confirm)activateMenu();keyPressed={};return [{},{}]}
const axis=(a,neg,pos,lb,rb)=>Math.abs(a)>.25?Math.sign(a):(held(neg)||lb?-1:held(pos)||rb?1:0);
let c1={x:axis(p.axes[0],'ArrowLeft','ArrowRight',p.buttons[14],p.buttons[15]),down:held('ArrowDown')||p.axes[1]>.5||p.buttons[13],jump:pressed('ArrowUp')||p.edges[12]||(p.axes[1]<-.6&&!(window._up1))||p.edges[0],light:pressed('KeyJ')||p.edges[2],heavy:pressed('KeyK')||p.edges[3],special:pressed('KeyL')||p.edges[1],super:pressed('KeyI')||p.edges[5],dash:pressed('ShiftLeft')||p.edges[7]};window._up1=p.axes[1]<-.6;
let c2={x:axis(q.axes[0],'KeyA','KeyD',q.buttons[14],q.buttons[15]),down:held('KeyS')||q.axes[1]>.5||q.buttons[13],jump:pressed('KeyW')||q.edges[12]||(q.axes[1]<-.6&&!window._up2)||q.edges[0],light:pressed('KeyF')||q.edges[2],heavy:pressed('KeyG')||q.edges[3],special:pressed('KeyH')||q.edges[1],super:pressed('KeyT')||q.edges[5],dash:pressed('KeyR')||q.edges[7]};window._up2=q.axes[1]<-.6;input={x:c1.x,y:c1.down?1:c1.jump?-1:0,fire:!!(c1.light||c1.heavy||c1.special)};keyPressed={};return [c1,c2]}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Escape'].includes(e.code))e.preventDefault();if(!keys[e.code])keyPressed[e.code]=true;keys[e.code]=true});window.addEventListener('keyup',e=>{keys[e.code]=false});window.addEventListener('pointerdown',()=>{lastInput=performance.now();if(attract){attract=false;state='title';titleFighters();panel='';updateUI()}},{passive:true});
window.addEventListener('pointermove',()=>{lastInput=performance.now();if(attract){attract=false;state='title';titleFighters();panel='';updateUI()}},{passive:true});
window.addEventListener('resize',()=>{if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
window.STADebug=()=>fighters.map(f=>({position:f.rb.translation(),velocity:f.rb.linvel(),hp:f.hp}));
AIHub.probe(()=>({scene:state==='title'?'title':state==='over'?'over':hub&&!hubStarted?'ready':'play',menu:!!panel,world:worldTime,input}));
async function init(){try{if(!navigator.gpu)throw Error('This browser does not expose WebGPU.');let adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('No WebGPU adapter is available.');await RAPIER.init();renderer=new THREE.WebGPURenderer({antialias:true});await renderer.init();if(!renderer.backend.isWebGPUBackend)throw Error('A WebGPU backend is required.');renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;view.appendChild(renderer.domElement);stage();titleFighters();updateUI();if(AIHub.active){const info=await AIHub.connect({mode:'parallel',seats:[1,4]});if(info){hub=true;mode='arcade';rival=0;round=1;wins=[0,0];score=0;startFight();state='ready';AIHub.on('start',()=>{hubStarted=true;state='play';updateUI()});AIHub.on('time-up',()=>finishHub());AIHub.on('end',()=>{ended=true;panel='';state='over';banner='SESSION COMPLETE';bannerTime=100;updateUI()});AIHub.ready()}else updateUI()}requestAnimationFrame(frame)}catch(e){console.error(e);document.querySelector('#loading')?.remove();document.querySelector('#fatal').classList.remove('hidden');document.querySelector('#fatal-detail').textContent=e.message;AIHub.fail(e.message)}}
function frame(now){let dt=Math.min(.04,(now-lastFrame)/1000);lastFrame=now;let [c1,c2]=readInputs(dt);if(state==='title'&&!panel&&!hub&&now-lastInput>10000){mode='arcade';rival=0;round=1;wins=[0,0];score=0;attract=true;startFight();lastInput=now}music(dt);step(dt,c1,c2);if(state==='title'){camera.position.x=Math.sin(now*.00025)*.7;camera.lookAt(0,2,0);for(let i=0;i<fighters.length;i++){let f=fighters[i];f.body.position.y=Math.sin(now*.004+i)*.05;f.la.rotation.x=-.8+Math.sin(now*.003+i)*.14;f.ra.rotation.x=-1.4;f.ll.rotation.x=.15;f.rl.rotation.x=-.15}}else{camera.position.x=THREE.MathUtils.lerp(camera.position.x,0,.03);camera.lookAt(0,2,0)}renderer.render(scene,camera);requestAnimationFrame(frame)}
init();
