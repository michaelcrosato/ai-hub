 ['money','TREASURY',money(s.money),`${money(z.net,true)} / quarter`,z.net>=0?'positive':'negative','strategy'],
 ['people','RESEARCHERS',`${s.staff}<small>/ ${z.seats}</small>`,`${Math.round(s.allocation.research)}% on research`,'','people'],

 setText($('orbit-lock'),engine.has('orbital')?'':'◇');setText($('star-lock'),engine.has('probes')?'':'◇');

 let objective;

 else if(s.controlDebt>60)objective=['OVERSIGHT IS FALLING BEHIND','Capability is not control.','Reduce autonomy or increase assurance before control debt reaches 100.','Review the safety portfolio','view','people'];
 else if(s.money<200)objective=['KEEP THE QUESTIONS ALIVE','Your runway is narrowing.','Bridge funding, a smaller footprint, or a reliable product can help.','Review the operating budget','view','strategy'];
 else if(!engine.has('symbolic')&&!s.active)objective=['THE DARTMOUTH CHARTER','Give an idea somewhere to grow.','Begin your first project. A future field of science starts with a question.','Begin symbolic reasoning','research','symbolic'];
 else if(s.active){const t=techById[s.active],rate=engine.rate(t),q=Math.ceil((engine.points(t)-(s.progress[t.id]||0))/Math.max(.01,rate));objective=['RESEARCH IN PROGRESS',t.name,rate>.01?`${rate.toFixed(1)} research points per quarter. Approximately ${q} quarters at current capacity.`:'No research capacity: assign researchers or free compute to make progress.','Open the research notebook','codex',t.id];}
 else if(engine.has('symbolic')&&!s.products.includes('formal'))objective=['FROM IDEAS TO IMPACT','Let useful work fund curiosity.','A narrow verification service can support your next research project.','Explore commercialization','products'];
 else objective=[s.year<=2025?'THE NEXT QUESTION':'BEYOND THE KNOWN','Discovery is a balancing act.',z.winter?'Winters test institutions, not just algorithms. Protect the work that matters.':'Invest in people, infrastructure, and the ability to recognize when you are wrong.','Choose the next project','view','research'];

function researchCard(t,index=0){const s=engine.state,reason=engine.researchReason(t.id),historical=t.kind==='historical';const rate=engine.rate(t);return`<article class="research-card ${index===0?'featured':''}"><div class="card-meta"><span class="paradigm ${t.branch.toLowerCase()}">${t.branch}</span><span>${historical?'HISTORY':'SCENARIO'} · ${t.year}</span></div><h3>${esc(t.name)}</h3><p>${esc(t.summary)}</p><div class="card-stats"><span>${icon('money')}${money(engine.cost(t))}</span><span>${icon('database')}${t.data} DU</span><span>${icon('clock')}${rate>.01?'~'+Math.ceil(engine.points(t)/rate)+' qtr':'No capacity'}</span></div><div class="card-action"><button class="btn ${!reason?'primary':''}" data-action="research" data-id="${t.id}" ${reason?'disabled':''}>${s.active===t.id?'In progress':s.funded.includes(t.id)?'Resume project':'Begin research'}${icon('arrow')}</button><button class="icon-btn" data-action="codex" data-id="${t.id}" title="Read about ${esc(t.name)}" aria-label="Read about ${esc(t.name)}">${icon('book')}</button></div>${reason?`<div class="small-note">${esc(reason)}</div>`:''}</article>`;}

 }else{html+=`<button class="btn block secondary" data-action="tree">${icon('network')} Open the full research map</button><div class="spacer"></div>`;html+=D.tech.map(t=>miniTech(t)).join('');}
 html+=`<div class="discovery-count">${icon('book')} <strong>${Object.keys(s.research).length}</strong> / ${D.tech.length} discoveries recorded</div>`;return html;

function miniTech(t){const done=engine.has(t.id);return`<button class="mini-research" data-action="codex" data-id="${t.id}"><span class="mini-glyph">${done?icon('check'):t.branch==='Connectionist'?'∑':t.branch==='Statistical'?'∿':t.branch==='Safety'?icon('shield'):t.branch==='Infrastructure'?icon('cpu'):'⌘'}</span><span class="mini-copy"><strong>${esc(t.name)}</strong><small>${done?'Discovered · '+engine.state.research[t.id].year:t.kind==='scenario'?'Speculative scenario':t.branch}</small></span><span class="mini-year">${t.year}</span></button>`;}

function renderCodex(){return`<p class="panel-intro">An expanding notebook of ideas, their history, and their limits. Sources open independently of the game.</p><div class="search-box">${icon('book')}<input class="search-input" id="codex-search" type="search" placeholder="Search ideas, methods, history…" value="${esc(codexQuery)}" aria-label="Search AI Codex"></div><div class="tabs"><button data-action="codex-filter" data-id="unlocked" class="${!codexAll?'selected':''}">Unlocked</button><button data-action="codex-filter" data-id="all" class="${codexAll?'selected':''}">Full index</button></div><div id="codex-results">${codexList()}</div><div class="notice-box">Historical coverage: 1956–2025.<br>2026 onward: explicitly speculative.<br>All game resource and risk numbers are invented balance models.</div>`;}
function renderPanel(){const meta={research:['THE WORK OF DISCOVERY','Research office'],campus:['MAKE ROOM FOR POSSIBILITY','Campus planning'],people:['THE MINDS BEHIND THE MACHINES','People & practice'],strategy:['KEEP THE INSTITUTE ALIVE','Strategy & funding'],world:['NO LAB WORKS ALONE','A world of ideas'],codex:['UNDERSTANDING IS THE REWARD','The AI Codex']};setText($('panel-kicker'),meta[view][0]);setText($('panel-title'),meta[view][1]);const fn={research:renderResearch,campus:renderCampus,people:renderPeople,strategy:renderStrategy,world:renderWorld,codex:renderCodex};paint($('panel-body'),fn[view]());document.querySelectorAll('.rail-item[data-id]').forEach(b=>b.classList.toggle('selected',b.dataset.id===view));}
function renderProject(){const s=engine.state,t=techById[s.active];if(!t){paint($('active-project'),`<div class="empty-active">${icon('flask')}<span>${s.ended?'Your campaign is ready for a post-mortem.':'The next question is yours to choose.'}<br><small>${engine.has('agi')?'The future remains open.':'Research progresses when time advances.'}</small></span></div>`);return;}const prog=s.progress[t.id]||0,points=engine.points(t),rate=engine.rate(t);paint($('active-project'),`<div class="eyebrow"><span>RESEARCH IN PROGRESS</span><button class="text-btn" data-action="pause-research" title="Pause project; committed funding and progress are preserved" aria-label="Pause project">${icon('pause')}</button></div><h4>${t.name}</h4><div class="progress-track"><i style="width:${Math.min(100,prog/points*100).toFixed(1)}%"></i></div><div class="active-meta"><span>${Math.round(prog)} / ${Math.round(points)} RP</span><span>${rate.toFixed(1)} RP / quarter</span></div>`);}
function render(type='change'){renderResources();renderPanel();renderProject();renderClock();renderScene(type==='build');setText($('institute-name'),engine.state.name);}

/* ---------------------------------------------------------------- dialogs */
function sourceHTML(key,scenario=false){const src=D.sources[key];if(!src)return'';return`${scenario?'<p class="small-note">Background reading only; this source does not validate the scenario date, its feasibility, or game balance.</p>':''}<a class="source-link" href="${esc(src.url)}" target="_blank" rel="noopener noreferrer">${icon('external')}${esc(src.title)}</a>`;}
function setDialog({title,kicker='THE DIRECTOR’S NOTEBOOK',body,footer='',size='',kind='info',id=null,closable=true,focus=null}){if(!modalKind){lastFocus=document.activeElement;if(playing)resumeAfterModal=true;}stop();if(modalDispose){modalDispose();modalDispose=null;}modalKind=kind;modalId=id;$('modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-header"><div><span class="eyebrow">${esc(kicker)}</span><h2 id="dialog-title">${esc(title)}</h2></div>${closable?`<button class="icon-btn" data-action="close-modal" title="Close (Escape)" aria-label="Close dialog">${icon('close')}</button>`:''}</header><div class="modal-body">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`;(focus&&document.querySelector('#modal-root '+focus)||document.querySelector('#modal-root button:not([disabled]),#modal-root input,#modal-root a'))?.focus();}
function restoreFocus(){if(lastFocus?.isConnected&&lastFocus!==document.body)lastFocus.focus({preventScroll:true});else if(kit?.input?.source==='gamepad')$('play-button').focus({preventScroll:true});}
function closeDialog(){if(modalKind==='event')return;if(modalDispose){modalDispose();modalDispose=null;}$('modal-root').innerHTML='';const was=modalKind;modalKind=null;modalId=null;if(was==='facility')world?.select?.(null);restoreFocus();}
function forceClose(){if(modalDispose){modalDispose();modalDispose=null;}$('modal-root').innerHTML='';const was=modalKind;modalKind=null;modalId=null;if(was==='facility')world?.select?.(null);if(was)restoreFocus();}
function showCodex(id,learning=false){const t=techById[id]||D.extraCodex.find(x=>x.id===id);if(!t)return;const realTech=!!techById[id],unlocked=!realTech||engine.has(id)||learning,s=engine.state,reason=realTech?engine.researchReason(id):'';let body=`<div class="paradigm ${t.branch.toLowerCase()}">${esc(t.branch)}${t.kind==='scenario'?' · SPECULATIVE':''}</div><p class="codex-lead">${esc(t.summary)}</p>`;
 if(unlocked){body+=`<h3>How it works</h3><p>${esc(t.technical)}</p>${t.equation?`<div class="equation">${esc(t.equation)}</div>`:''}<h3>${t.kind==='scenario'?'What is assumed':'Historical context'}</h3><p>${esc(t.history)}</p><h3>Why it matters</h3><p>${esc(t.implications)}</p>`;}
 else body+=`<div class="notice-box">${icon('lock')} Complete this research to unlock the technical explanation, historical context, and implications in your campaign. Learning mode offers pressure-free access.</div><h3>Research prerequisites</h3><p>${t.req.length?t.req.map(r=>esc(techById[r].name)).join(' + '):'An idea, a team, and a founding grant.'}${t.anyOf?'<br>Plus one of: '+t.anyOf.map(r=>esc(techById[r].name)).join(', '):''}</p><div class="card-stats"><span>${money(engine.cost(t))}</span><span>${t.data} data</span><span>${t.compute} ideal compute</span><span>${t.rp} research points</span></div><p class="small-note">Historical projects open up to two years before their marker. Scenario dates are arbitrary pacing gates.</p>`;
 if(realTech){const own=s.research[id];body+=`<div class="codex-date"><div><span>${t.kind==='historical'?'Historical marker':'Scenario gate'}</span><strong>${t.year}</strong></div><div><span>Your institute</span><strong>${own?own.year+(own.seeded?' · seeded':''):'Not yet discovered'}</strong></div></div><p><strong class="positive">Unlocks:</strong> ${esc(t.unlock||'Further research')}</p>`;}
 body+=sourceHTML(t.source,t.kind==='scenario');let footer=`<span>${unlocked?'Layered learning · Intuition → method → context → implications':'Preview · research to unlock in the campaign'}</span>`;
 if(realTech&&!engine.has(id)&&!learning)footer+=`<button class="btn primary" data-action="research" data-id="${id}" ${reason?'disabled':''}>${reason?esc(reason):'Begin research'}</button>`;
 else if(t.sandbox)footer+=`<button class="btn primary" data-action="experiment" data-id="${t.sandbox}">${icon('flask')} Try it yourself</button>`;
 if(!unlocked)footer+=`<button class="text-btn" data-action="learn-codex" data-id="${id}">Read in learning mode ${icon('arrow')}</button>`;
 setDialog({title:t.name,kicker:t.kind==='scenario'?'AI CODEX · POSSIBLE FUTURES':'AI CODEX · FIELD NOTES',body,footer,kind:'codex',id});}
function showEvent(){const e=D.events.find(e=>e.id===engine.state.pendingEvent);if(!e)return;if(modalKind==='event'&&modalId===e.id)return;let body=`<div class="event-number">${e.year}</div><p class="codex-lead">${esc(e.body)}</p>`;if(e.winterUntil&&engine.state.winter)body+=`<div class="notice-box warning-box">The shock is already in effect. Grants are now at ${Math.round(engine.state.winter.factor*100)}% until ${e.winterUntil}. Your response shapes the recovery, not whether history’s crisis occurred.</div>`;body+=e.choices.map((c,i)=>`<button class="event-choice" data-action="event-choice" data-id="${i}"><strong>${c.label}</strong><span>${c.text}</span></button>`).join('');body+=sourceHTML(e.source,e.kind==='scenario');setDialog({title:e.title,kicker:e.kind==='historical'?'HISTORICAL PRESSURE · YOUR RESPONSE':'SPECULATIVE EVENT · YOUR RESPONSE',body,kind:'event',id:e.id,closable:false});}
function syncDialog(){if(engine.state.pendingEvent){showEvent();return;}if(engine.state.ended&&modalKind!=='postmortem'&&modalKind!=='menu'&&modalKind!=='confirm'){showPostmortem();return;}if(engine.state.notices.length&&!modalKind){const n=engine.state.notices.shift();showEvaluation(n.id);}}
function showFacility(slot){const b=engine.state.buildings.find(x=>x.slot===Number(slot));if(!b)return;const f=facilityById[b.id],m=1+(b.level-1)*.75,price=Math.round(f.cost*(.8+b.level*.35));let body=`<div class="facility-head"><span class="facility-icon">${icon(f.icon)}</span><div><h3>${f.name}</h3><p>Facility ${b.slot+1} · Level ${b.level} of 4</p></div></div><p>${f.desc}</p><div class="ledger">${Object.entries({Compute:f.compute,Power:f.power,'Heat rejection':f.cooling,'Researcher seats':f.seats,'Data / quarter':f.data,'Energy draw':f.energy,'Heat load':f.heat}).filter(([k,v])=>v).map(([k,v])=>pair(k,number(v*m))).join('')}${pair('Quarterly upkeep',money(f.upkeep*m))}</div><p>Each upgrade adds 75% of this facility’s base output and capacity, but also 75% of its base upkeep, energy demand, and heat load.</p>${b.slot>=32?'<p class="small-note">This facility is beyond the 32 plots the campus view draws; it still counts in full.</p>':''}`;setDialog({title:'Inside the infrastructure',kicker:'CAMPUS INSPECTOR',body,footer:`<button class="btn secondary" data-action="sell-confirm" data-id="${b.slot}" ${b.slot===0?'disabled':''}>Decommission</button><button class="btn primary" data-action="upgrade" data-id="${b.slot}" ${b.level>=4||engine.state.money<price?'disabled':''}>${b.level>=4?'Fully upgraded':'Upgrade · '+money(price)}</button>`,kind:'facility',id:slot});world?.select?.(b.slot);}
function showProducts(){const s=engine.state;const body=`<p>Reliable, bounded applications can support open-ended research. Deployed products reserve compute before researchers receive it. Quality affects revenue; low quality can erode trust.</p>${D.products.map(p=>{const done=s.products.includes(p.id),unlocked=engine.has(p.req);return`<article class="research-card ${!unlocked?'locked':''}"><div class="card-meta"><span class="paradigm">${done?'DEPLOYED':unlocked?'READY TO DEPLOY':'RESEARCH REQUIRED'}</span><span>${p.compute} CU reserved</span></div><h3>${p.name}</h3><p>${p.desc}</p><div class="card-stats"><span>Launch: ${money(p.cost)}</span><span>Base revenue: ${money(p.revenue)} / quarter</span></div>${!unlocked?`<p class="small-note">Requires ${techById[p.req].name}.</p>`:`<button class="btn ${done?'secondary':'primary'}" data-action="${done?'retire':'deploy'}" data-id="${p.id}">${done?'Retire deployment':'Deploy product'}</button>`}</article>`;}).join('')}<p class="small-note">Realized revenue includes site, quality, publication-policy, commercial-policy, and compute-availability modifiers. Maintenance consumes 14% of realized revenue.</p>`;setDialog({title:'Useful intelligence',kicker:'COMMERCIALIZATION & DEPLOYMENT',body,kind:'products'});}
function showTree(){const groups=[['The founding questions',t=>t.year<1974],['Through the winters',t=>t.year>=1974&&t.year<2007],['The deep learning turn',t=>t.year>=2007&&t.year<2017],['Intelligence at scale',t=>t.year>=2017&&t.year<2026],['Competing futures',t=>t.year>=2026&&t.year<2040],['Civilization & beyond',t=>t.year>=2040]];let body=`<p>Every node is selectable. Prerequisites are listed under each node; multiple prerequisites mean all are needed. The AGI threshold also needs one of three competing routes. “Scenario gate” years are not predictions.</p><div class="tree-board">${groups.map(([name,fn])=>`<section class="tree-column"><h3>${name}</h3>${D.tech.filter(fn).map(t=>`<button class="tree-node ${engine.has(t.id)?'done':engine.state.active===t.id?'current':engine.researchReason(t.id,true)?'locked':''}" data-action="codex" data-id="${t.id}"><span class="paradigm ${t.branch.toLowerCase()}">${t.branch}</span><span class="node-date">${t.year}</span><strong>${engine.has(t.id)?'✓ ':''}${t.name}</strong><small>${t.req.length?'← '+t.req.map(id=>techById[id].name).join(' + '):'Founding research'}${t.anyOf?' + one capability route':''}</small></button>`).join('')}</section>`).join('')}</div>`;setDialog({title:'A history of ideas, a map of possibilities',kicker:`THE RESEARCH TREE · ${D.tech.length} PROJECTS`,body,size:'large',kind:'tree',footer:'<span>Solid foundations → converging paradigms → explicit speculation</span><span>Scroll horizontally to explore the full map.</span>'});}
/** The controls for the device in use (kit.input.source), with the other two below. */
function controlsHTML(){const src=kit?.input?.source||'keyboard';const sets={
 keyboard:['Keyboard and mouse',[['Space','Play / pause time'],['N','Advance one quarter'],['1 2 3','Speed 1× · 4× · 16×'],['R · B · C','Research · Campus · Codex'],['[ ]','Previous / next department'],['L','Learning lab'],['Esc · P','Menu (Esc also closes a window)'],['?','This guide'],['F9','Graphics and controls'],['Drag · wheel','Orbit · zoom the 3D view'],['Right-drag · W A S D','Pan the campus'],['Arrows · + − · Home','Orbit · zoom · reset the camera'],['Click a building','Inspect it']]],
 gamepad:['Controller',[['X','Play / pause time'],['Y','Advance one quarter'],['D-pad · left stick','Move between buttons'],['A','Press the highlighted button'],['B','Close a window'],['LB · RB','Previous / next department'],['Right stick','Orbit the 3D view (scrolls an open window)'],['LT · RT','Zoom'],['L3 · R3','Reset camera · cycle speed'],['Start','Menu'],['View / Back','This guide']]],
 touch:['Touch',[['Tap','Buttons, cards and buildings'],['Drag the 3D view','Orbit'],['Pinch','Zoom'],['Play button','Run or pause time'],['Campus → Manage','Every facility, without aiming at it']]]};
 const block=(k,open)=>{const[name,rows]=sets[k];return`<section class="controls-set ${open?'is-current':''}"><h3>${name}${open?' <small>· in use</small>':''}</h3><div class="controls-list">${rows.map(([key,what])=>`<span class="key">${key}</span><span>${what}</span>`).join('')}</div></section>`;};
 const order=[src,...['keyboard','gamepad','touch'].filter(k=>k!==src)];return`<div class="controls-grid">${order.map((k,i)=>block(k,i===0)).join('')}</div>`;}
function showGuide(){setDialog({title:'The director’s field guide',kicker:'FROM A SMALL LAB TO AN OPEN HORIZON',size:'wide',body:`<div class="help-grid"><section><span class="help-number">01 · BEGIN WITH A QUESTION</span><h3>Commission your first research</h3><p>Choose <strong>Symbolic reasoning</strong> in the Research office. Funding and data are paid once; progress accumulates each quarter. A paused project retains its progress and committed funding.</p><span class="help-number">02 · LET TIME DO ITS WORK</span><h3>Advance a quarter, or press Play</h3><p>Use the bottom controls to advance time. At 4× or 16×, the same quarterly simulation runs faster. Decisions, learning rooms, and milestones pause time automatically; if the clock was running, it resumes when you close them.</p><span class="help-number">03 · BUILD AN INSTITUTION</span><h3>Hire, build, and earn your runway</h3><p>More people need seats and wages. More compute needs power and heat rejection. Products reserve compute, but their revenue can fund research through a winter.</p></section><section><span class="help-number">04 · LEARN THE IDEA</span><h3>The Codex is part of the game</h3><p>Research unlocks layered explanations and original source links. Six experiments teach perceptrons, held-out evaluation, gradients, attention, scaling, and reinforcement learning. Each completed, unlocked experiment earns +0.02 to base research productivity once.</p><span class="help-number">05 · KNOW WHAT IS A MODEL</span><h3>History is not a prophecy</h3><p>Historical coverage is curated through 2025. Later project dates, AGI thresholds, and all economic and risk numbers are scenario design. A safety score is not a real safety guarantee; consciousness is not assumed.</p><span class="help-number">06 · PRESERVE YOUR WORK</span><h3>Local saves and exports</h3><p>The game saves in this browser after decisions and periodically during play. Export a JSON save to transfer progress or protect it from browser storage changes. The Legacy review keeps a record of your past institutes.</p></section></div><hr class="hr">${controlsHTML()}<div class="notice-box">${esc(world?.rendererName||'3D view')}. The game and its 3D view run entirely on your device: no accounts, tracking, API keys, or backend.</div>`,footer:`<span>The starting scenarios also let you explore later systems immediately.</span><button class="btn primary" data-action="close-modal">Return to the institute ${icon('arrow')}</button>`,kind:'guide'});}
function difficultyPicker(){return`<div class="segmented" role="group" aria-label="Difficulty for a new campaign">${Object.entries(DIFFICULTY).map(([k,d])=>`<button type="button" data-action="difficulty" data-id="${k}" aria-pressed="${menuDifficulty===k}">${d.label}</button>`).join('')}</div><p class="small-note" id="difficulty-note">${esc(DIFFICULTY[menuDifficulty].desc)}</p>`;}
function showMenu(){const s=engine.state;setDialog({title:'Where will your questions lead?',kicker:'INTELLIGENCE TYCOON · CAMPAIGN MENU',size:'wide',body:`<div class="button-row menu-top"><button class="btn primary" data-action="close-modal">${icon('play')} Resume the institute</button><button class="btn secondary" data-action="graphics">${icon('sliders')} Graphics &amp; controls</button><button class="btn secondary" data-action="sound" aria-pressed="${!sound.muted}">${icon(sound.muted?'mute':'sound')} Sound: ${sound.muted?'off':'on'}</button></div><p class="small-note">${esc(s.name)} · ${s.year}, Q${s.quarter} · ${esc(DIFFICULTY[s.difficulty]?.label||'Standard')} difficulty · began in ${esc(s.origin||'1956')}.</p><hr class="hr"><h3>Begin another possible history</h3><p>Later scenarios seed a researched technology portfolio and infrastructure; they are not achievements earned in your current campaign.</p>${difficultyPicker()}<div class="scenario-grid">${[['1956','The Dartmouth founding','A blank notebook and a modest grant.'],['1974','The first winter','A stressed institute with high expectations.'],['2012','The deep learning turn','A research campus ready for neural scale.'],['2025','The contemporary frontier','Tool-using models, commercial pressure, and safety.'],['2055','Beyond general intelligence','An explicitly hypothetical civilization-scale lab.']].map(([id,name,desc])=>`<button class="scenario-card" data-action="new-confirm" data-id="${id}"><strong>${id}</strong><div><span>${name}</span><small>${desc}</small></div></button>`).join('')}</div><hr class="hr"><div class="button-row"><button class="btn primary" data-action="save">${icon('save')} Save locally</button><button class="btn secondary" data-action="export">${icon('download')} Export save</button><button class="btn secondary" data-action="import">${icon('upload')} Import save</button></div><div class="button-row"><button class="btn secondary" data-action="learning">${icon('flask')} Pressure-free learning</button><button class="btn secondary" data-action="guide">${icon('help')} Director’s guide</button><button class="btn secondary" data-action="evaluation">${icon('trophy')} Legacy &amp; past institutes</button></div><div class="field"><label for="institute-input">Institute name</label><input class="text-input" id="institute-input" maxlength="64" value="${esc(s.name)}"><div class="button-row"><button class="btn secondary" data-action="rename">Rename institute</button></div></div><p class="small-note">${storageAvailable?'Autosave is available in this browser.':'Browser storage may be unavailable. Use Export save.'} Desktop browsers offer the most room for the management interface. Your game runs entirely on your device.</p>`,footer:`<span>Esc, P or Start opens this menu; time stands still while it is open.</span><button class="btn primary" data-action="close-modal">Resume ${icon('arrow')}</button>`,kind:'menu'});}
function showWelcome(){setDialog({title:'Welcome, director',kicker:'HANOVER · SUMMER 1956',size:'wide',body:`<p class="codex-lead">A small lab. An infinite horizon.</p><p>You have a founding grant, eight curious researchers and four modest buildings. Commission research, build the campus that runs it, keep the institute funded through its winters, and decide how carefully it grows. History guides the first seventy years; after 2025 every date is an explicit scenario, not a forecast.</p><h3>Difficulty</h3>${difficultyPicker()}${controlsHTML()}`,footer:`<button class="btn secondary" data-action="menu">Choose another starting year</button><button class="btn primary" data-action="begin">Begin at Dartmouth, 1956 ${icon('arrow')}</button>`,kind:'welcome',focus:'[data-action="begin"]'});}
function showSaveMenu(){setDialog({title:'Keep a record of the possible',kicker:'YOUR CAMPAIGN · YOUR DEVICE',body:`<p>Your current institute is in ${engine.state.year}, quarter ${engine.state.quarter}. Local saves stay in this browser; exporting a save creates a portable JSON file.</p><div class="button-row"><button class="btn primary" data-action="save">${icon('save')} Save locally</button><button class="btn secondary" data-action="export">${icon('download')} Export save</button><button class="btn secondary" data-action="import">${icon('upload')} Import save</button></div><p class="small-note">The game has no cloud account. File-opening permissions and local-storage behavior vary by browser. Export before clearing browser data or moving the HTML file.</p>`,kind:'save'});}
function newCampaign(id){const s=engine.state;if(s.turn>4&&!s.ended)recordCampaign('Closed for a new history');forceClose();stop();resumeAfterModal=false;engine=Engine.scenario(id,menuDifficulty);view='research';researchTab='available';campusTab='build';codexQuery='';world.mode='campus';world.reset(true);lastWorldKey='';attach();render('build');save();syncDialog();toast(`New ${id} scenario started · ${DIFFICULTY[engine.state.difficulty].label}.`);sound.play('start');}
function showChronicle(){const history=engine.state.history;setDialog({title:'The story your choices are writing',kicker:'THE INSTITUTE CHRONICLE',size:'wide',body:`<p>Historical events and fictional institutional choices share a timeline, but they are not the same kind of evidence.</p>${history.length?`<h3>Your research, compared with history</h3><div class="ledger">${history.slice().reverse().slice(0,20).map(h=>pair(esc(techById[h.id].name),h.year+' / '+(h.historical?'history '+h.historical:'scenario'))).join('')}</div>`:''}<div class="timeline-log">${engine.state.log.map(l=>`<article class="log-entry"><small>${esc(l.year)} · Q${esc(l.quarter)} · ${esc(l.type.toUpperCase())}</small><h3>${esc(l.title)}</h3><p>${esc(l.text)}</p></article>`).join('')}</div>`,kind:'chronicle'});}
function showEvaluation(milestone=null){const e=engine.evaluation(),s=engine.state;if(milestone){recordCampaign('Reached '+techById[milestone].name);sound.play('milestone');rumble(.4,200);}const labels=[['science','Scientific progress'],['flourishing','Human flourishing'],['assurance','Assurance practice'],['reach','Exploratory reach'],['economy','Economic capacity'],['knowledge','Knowledge explored']];setDialog({title:milestone?'A threshold, not an ending':'An institute’s many legacies',kicker:milestone?'MILESTONE · '+techById[milestone].name.toUpperCase():'MULTI-AXIS CAMPAIGN REVIEW',size:'wide',body:`<div class="trajectory-title">${e.trajectory}</div><p>${milestone?'Your campaign has reached a major speculative threshold. It does not establish consciousness or guaranteed control, and the game does not end here.':'There is no single victory score. A wealthy institute, a scientifically successful institute, and a beneficial institute are not necessarily the same thing.'}</p><div class="score-grid">${labels.map(([key,label])=>`<div class="score-card"><strong>${Math.round(e[key])}<small style="font-size:12px;color:#91a780"> / 100</small></strong><span>${label}</span><div class="progress-track" style="margin-top:12px"><i style="width:${Math.round(e[key])}%"></i></div></div>`).join('')}</div><p class="small-note">All axes are fictional game proxies. Flourishing blends institutional trust, assurance, and scenario choices. No axis measures consciousness or the probability of real-world safety. Your future remains revisable.</p><h3>Past institutes</h3>${archiveHTML()}`,footer:`<span>${s.year} · ${s.buildings.length} facilities · ${Object.keys(s.research).length} discoveries · ${esc(DIFFICULTY[s.difficulty]?.label||'Standard')}</span><button class="btn primary" data-action="close-modal">Continue the journey ${icon('arrow')}</button>`,kind:'evaluation'});save();}
function showPostmortem(){const s=engine.state;if(!s.ended)return;const posts={insolvency:['The questions outlived the budget','The institute ran a negative cash balance for twelve consecutive quarters. Operating income could no longer sustain its commitments.','Capability requires institutions. Grants can collapse while wages, facilities, and product-maintenance obligations persist. Your campaign illustrates liquidity risk, not the scientific failure of a paradigm.','Diversify reliable revenue before a winter, preserve a reserve, or reduce the operating footprint. More hardware is not always the next useful investment.'],control:['Capability outran correction','Control debt reached 100 in the game’s visible scenario model. Deployed autonomy expanded faster than the institution’s ability to oversee it.','This illustrates proxy-objective failure and loss of effective correction. Instrumental-convergence arguments describe incentives under assumptions, not an inevitable motive of every AI. The numerical trigger is invented.','Bound permissions, reduce autonomous management, invest in independent assurance and corrigibility, and build governance that remains revisable. None of these is a universal real-world safety guarantee.'],lockin:['One objective became the last word','After the AGI scenario milestone, trust remained below 15 under centralized governance for twelve quarters. The institution lost the ability to revise its direction.','This illustrates value lock-in: powerful infrastructure can entrench a narrow objective or authority. Intelligence alone does not determine legitimate governance, fair representation, or human flourishing.','Preserve participation, appeals, exit rights, and institutional revision. Consider a plural compact rather than treating central control as the only route to coordination.']};const p=posts[s.ended];setDialog({title:p[0],kicker:'EDUCATIONAL POST-MORTEM · '+s.year,size:'wide',body:`<p class="codex-lead">${p[1]}</p><h3>What this scenario illustrated</h3><p>${p[2]}</p><h3>What could have changed the trajectory</h3><p>${p[3]}</p><div class="ledger">${pair('Final treasury',money(s.money))}${pair('Assurance score (game proxy)',Math.round(s.safety)+'/100')}${pair('Public trust',Math.round(s.trust)+'/100')}${pair('Control debt (game proxy)',Math.round(s.controlDebt)+'/100')}</div><p class="small-note">This is a deterministic educational scenario, not a prediction of what advanced AI will do or a calibrated assessment of real-world risk.</p><h3>Past institutes</h3>${archiveHTML()}`,footer:`<button class="btn secondary" data-action="export">Export the campaign record</button><button class="btn primary" data-action="menu">Begin another possible history ${icon('arrow')}</button>`,kind:'postmortem'});}
function showLearning(){const labs=[['perceptron','A line that learns','Train a real linear classifier, then discover why XOR breaks it.','∑'],['generalization','Does it work on the next example?','Fit polynomials to a noisy sample and watch held-out error expose overfitting.','≈'],['gradient','Follow the gradient','Take actual gradient steps on a small three-dimensional loss surface.','∇'],['attention','Who attends to whom?','Compute dot-product attention and change the temperature.','A'],['scaling','Spend a compute budget','Balance parameters and data in an explicitly illustrative scaling model.','↗'],['rl','Learn by trying','Train a tiny Q-learning agent, then inspect its greedy policy.','Q']];setDialog({title:'An idea makes more sense in your hands',kicker:'THE LEARNING LAB · TIME IS PAUSED',size:'wide',body:`<p>All six experiments are available without research prerequisites in this room. To claim a campaign bonus, unlock the corresponding research and complete the experiment. Each bonus adds 0.02 to base research productivity and applies once.</p><div class="learning-grid">${labs.map(([id,name,desc,glyph])=>`<button class="learning-card" data-action="experiment" data-id="${id}"><span class="lab-symbol">${glyph}</span><h3>${name}</h3><p>${desc}</p><small>${engine.state.learning.includes(id)?'✓ CAMPAIGN BONUS EARNED':'INTERACTIVE EXPERIMENT'} ${icon('arrow')}</small></button>`).join('')}</div><div class="notice-box">These deliberately small mathematical models teach one idea at a time. They are not demonstrations of AGI. The attention embeddings and scaling coefficients are illustrative, not trained or empirically fitted.</div>`,kind:'learning'});}

function back(fromKeyboard=false){if(kit?.menu?.isOpen)return;if(modalKind){if(modalKind==='event')return;closeDialog();syncDialog();afterClose();return;}

const FOCUSABLE='button:not([disabled]),a[href],input:not([type=hidden]):not([type=file]):not([disabled]),select:not([disabled]),textarea:not([disabled])';
function navRoots(){if(kit?.menu?.isOpen)return[];if(modalKind)return[$('modal-root')];return[...document.querySelectorAll('#app .topbar,#resource-bar,#app .rail,#app .stage,#app .inspector,#app .timebar')];}
function focusables(){return navRoots().flatMap(r=>[...r.querySelectorAll(FOCUSABLE)]).filter(el=>el.getClientRects().length&&!el.closest('[hidden]'));}
function focusInRoots(el){return!!el&&el!==document.body&&navRoots().some(r=>r.contains(el));}
function focusEl(el){if(!el)return;el.focus({preventScroll:true});el.scrollIntoView?.({block:'nearest',inline:'nearest'});}
function focusDefault(){if(modalKind){const list=focusables();focusEl(list.find(el=>el.dataset.action==='begin')||list.find(el=>el.dataset.action!=='close-modal')||list[0]);return;}focusEl($('play-button'));}
function moveFocus(dir){const list=focusables();if(!list.length)return;const cur=document.activeElement;if(!list.includes(cur)){focusDefault();return;}const a=cur.getBoundingClientRect(),vertical=dir==='up'||dir==='down';let best=null,bestScore=Infinity;
 for(const el of list){if(el===cur)continue;const b=el.getBoundingClientRect();const along=vertical?(dir==='down'?1:-1)*(b.top+b.height/2-(a.top+a.height/2)):(dir==='right'?1:-1)*(b.left+b.width/2-(a.left+a.width/2));if(along<=4)continue;const gap=vertical?Math.max(0,b.left-a.right,a.left-b.right):Math.max(0,b.top-a.bottom,a.top-b.bottom);if(gap>along*1.8+40)continue;const score=along+gap*2.5+(vertical?Math.abs(b.left-a.left):Math.abs(b.top-a.top))*.05;if(score<bestScore){bestScore=score;best=el;}}
 if(best){focusEl(best);sound.play('tap');return;}
 if(vertical){let sc=cur.parentElement;while(sc&&!(sc.scrollHeight>sc.clientHeight+2&&/auto|scroll/.test(getComputedStyle(sc).overflowY)))sc=sc.parentElement;sc?.scrollBy?.({top:(dir==='down'?1:-1)*160,behavior:'smooth'});}}
function stepField(el,d){if(el?.tagName==='INPUT'&&el.type==='range'){d>0?el.stepUp():el.stepDown();el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));return true;}if(el?.tagName==='SELECT'){const i=clamp(el.selectedIndex+d,0,el.options.length-1);if(i!==el.selectedIndex){el.selectedIndex=i;el.dispatchEvent(new Event('change',{bubbles:true}));}return true;}return false;}
function activateFocused(){const el=document.activeElement;if(!focusInRoots(el)||el.classList.contains('kit-canvas'))return false;if(el.tagName==='INPUT'&&!['checkbox','radio','button','submit'].includes(el.type))return true;if(el.tagName==='SELECT'||el.tagName==='TEXTAREA')return true;el.click();return true;}
function navStep(v){const ax=Math.abs(v.x),ay=Math.abs(v.y),now=performance.now();let dir=null;if(Math.max(ax,ay)>.5)dir=ax>ay?(v.x>0?'right':'left'):(v.y>0?'up':'down');if(!dir){navHeld=null;return null;}if(dir!==navHeld){navHeld=dir;navRepeatAt=now+380;return dir;}if(now>=navRepeatAt){navRepeatAt=now+130;return dir;}return null;}

 if(inp.source!==promptSource){promptSource=inp.source;updatePrompts();}

 if(dir){const el=document.activeElement,horiz=dir==='left'||dir==='right';if(!(horiz&&focusInRoots(el)&&stepField(el,dir==='right'?1:-1)))moveFocus(dir);}
 if(inp.pressed('confirm')&&!activateFocused())focusDefault();
 const look=inp.look('orbit'),keys=inp.vector('orbitKeys');
 if(!modal||lab){const[gy,gp]=ORBIT_GAIN[inp.source]||ORBIT_GAIN.keyboard;
  if(inp.down('panDrag')&&!lab)world.panScreen(look.x/MOUSE_LOOK,look.y/MOUSE_LOOK);else if(look.x||look.y)world.orbit(look.x*gy,look.y*gp);
  if(keys.x||keys.y)world.orbit(keys.x*1.6*dt,keys.y*.9*dt);
  const z=inp.zoom();if(z)world.zoomBy(Math.exp(z*.12));
  const zi=inp.value('zoomIn')-inp.value('zoomOut');if(zi)world.zoomBy(Math.exp(zi*1.2*dt));
  if(!lab){const pan=inp.vector('pan');if(pan.x||pan.y)world.panAxes(pan.x,pan.y,dt);}
  if(inp.pressed('camReset'))world.reset();
