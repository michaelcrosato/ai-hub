<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101b20">
  <meta name="description" content="Lead a company through the Salt March. An original isometric tactical role-playing game with a full campaign, flexible jobs, and a world to explore.">
  <title>The Ashen Compact</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="stage" aria-label="Tactical battlefield">
      <canvas id="screen" tabindex="0" aria-label="Isometric battlefield. Use the arrow keys to select a tile. Press Enter to confirm."></canvas>
      <div id="scene-shade"></div>
    </div>
    <div id="interface"></div>
    <div id="dialog-layer"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="announcement" class="sr-only" aria-live="polite"></div>
  </div>
  <noscript>This game needs JavaScript. Enable JavaScript and reload the page.</noscript>
  <script src="my-3d2dge.js"></script>
  <script src="compact.bundle.js"></script>
</body>
</html>
