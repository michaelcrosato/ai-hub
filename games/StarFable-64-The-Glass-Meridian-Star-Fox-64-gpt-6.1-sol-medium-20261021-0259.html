if((mode==='playing'||mode==='paused')&&mission.phase===1){for(let i=0;i<3;i++){let z=((260+i*150-travel*.5)%480+480)%480+45;let x=i%2?-48:48;cube(x,9,z,12,6,30,'#4a5871');cube(x,15,z+8,6,8,12,'#708190');for(let j=-2;j<=2;j++)billboard(x+j*4,10,z-31,.45,'#ffd49a',true)}}

if((mode==='title'||mode==='guide'||mode==='settings'||mode==='about')){fighter(15+Math.sin(clock*.4)*2,5+Math.cos(clock*.5),29,2.1,Math.sin(clock*.4)*.1,-.18);fighter(28,9,53,1.3,.12,-.1);fighter(7,12,74,1.3,-.05,0)}
}
function bossDraw(){if(!boss)return;let x=boss.x,y=boss.y,z=boss.z;cube(x,y-6,z,23,9,14,'#536177');cube(x,y+3,z+5,12,10,9,'#63788a');cube(x-23,y-3,z,7,5,8,'#3a4f68');cube(x+23,y-3,z,7,5,8,'#3a4f68');for(let i=-3;i<=3;i++)cube(x+i*5,y+1,z-15,1,1,1,'#a7e4d1');for(let n of boss.nodes){if(n.hp<=0){billboard(n.x,n.y,n.z,.9,'#4b3b4d');continue}let color=n.type==='core'?(boss.exposed?'#ff7a71':'#668da0'):'#ffd584';let vv=[];for(let i=0;i<6;i++){let a=i*Math.PI/3+clock;vv.push([n.x+Math.cos(a)*3,n.y+Math.sin(a)*3,n.z])}poly(vv,color);billboard(n.x,n.y,n.z,1.2,'#fff0bf',true);if(n.type==='core'&&!boss.exposed){for(let i=0;i<3;i++)ringMesh({x:n.x,y:n.y,z:n.z-1-i,r:5+i,type:'danger'})}}
}
function render(){focal=Math.min(W,H)*1.08;ctx.save();if(shake>0&&!settings.reduced&&(mode==='playing'))ctx.translate(rand(-shake*10,shake*10),rand(-shake*7,shake*7));background();drawlist=[];sceneryDraw();if(mode==='playing'||mode==='paused'||mode==='results'){
for(let r of rings)ringMesh(r);for(let e of enemies){if(e.kind==='turret'){cube(e.x,e.y-1.7,e.z,2.3,3.4,3,'#9b6d82');billboard(e.x,e.y+2,e.z-3,.5,'#ffb97c',true)}else fighter(e.x,e.y,e.z,1.15,Math.sin(e.age+e.seed)*.25,Math.PI,true)}bossDraw();for(let s of shots){line3([s.x,s.y,s.z],[s.x,s.y,s.z-(s.missile?7:4)],s.missile?'#ffd58a':p.level>1?'#9affcf':'#c5ffef',s.missile?4:2);billboard(s.x,s.y,s.z,s.missile?.22:.11,'#fff4d8',true)}for(let s of hostile)billboard(s.x,s.y,s.z,s.r,'#ff9b7c',true);for(let s of pickups){cube(s.x,s.y-1,s.z,.8,1.6,.8,'#9ce5da');line3([s.x-1,s.y,s.z-1],[s.x+1,s.y,s.z-1],'#fff',2)}for(let q of particles)billboard(q.x,q.y,q.z,q.r*q.life,q.color,true);
// Wingmates flank the player and peel away under boost.
for(let i of [-1,1])fighter(p.x*.3+i*(12+Math.sin(clock*.7)*2),p.y*.25+3+Math.sin(clock+i),34+Math.sin(clock*.8+i)*3,.75,-p.vx*.01,0);
let bank=-p.vx*.018+(mission.roll>0?(1-mission.roll/.7)*Math.PI*2:0);fighter(p.x,p.y,13,.83,bank,-p.vx*.004);if(p.inv>0&&Math.floor(clock*18)%2===0)ringMesh({x:p.x,y:p.y,z:12,r:2.8,type:'normal'});let engine=project(p.x,p.y,11.6);if(engine){ctx.globalAlpha=.3;billboard(p.x,p.y,11.5,keys.KeyR?1.1:.55,'#7fffe6',true);ctx.globalAlpha=1;}
}
drawlist.sort((a,b)=>b.z-a.z);for(let d of drawlist){ctx.fillStyle=d.color;ctx.strokeStyle=d.color;if(d.ps){ctx.beginPath();ctx.moveTo(d.ps[0].x,d.ps[0].y);for(let v of d.ps.slice(1))ctx.lineTo(v.x,v.y);ctx.closePath();ctx.fill();if(d.outline){ctx.strokeStyle='#0c233652';ctx.lineWidth=.8;ctx.stroke()}}else if(d.line){ctx.lineWidth=d.width;ctx.beginPath();ctx.moveTo(d.line[0].x,d.line[0].y);ctx.lineTo(d.line[1].x,d.line[1].y);ctx.stroke()}else{ctx.beginPath();ctx.arc(d.point.x,d.point.y,d.r,0,Math.PI*2);ctx.fill();if(d.glow){ctx.globalAlpha=.18;ctx.beginPath();ctx.arc(d.point.x,d.point.y,d.r*2.7,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}}
if(mode==='playing'||mode==='paused'){let aim=project(p.x,p.y,75);if(aim){ctx.strokeStyle='#c2f4df';ctx.lineWidth=1.5;let a=24;for(let i of [-1,1])for(let j of [-1,1]){ctx.beginPath();ctx.moveTo(aim.x+i*a,aim.y+j*(a-7));ctx.lineTo(aim.x+i*a,aim.y+j*a);ctx.lineTo(aim.x+i*(a-7),aim.y+j*a);ctx.stroke()}ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(aim.x,aim.y,4,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;let ship=project(p.x,p.y,19);ctx.strokeStyle='#baf2d355';ctx.beginPath();ctx.arc(ship.x,ship.y,8,0,Math.PI*2);ctx.stroke()}
let lock=mission.lock;if(lock&&p.charge>0){let l=project(lock.x,lock.y,lock.z);if(l){let size=23+Math.max(0,.65-mission.lockTime)*35;ctx.strokeStyle=mission.lockTime>.65?'#ffd081':'#bfffe3';ctx.lineWidth=2;ctx.save();ctx.translate(l.x,l.y);ctx.rotate(Math.PI/4);ctx.strokeRect(-size/2,-size/2,size,size);ctx.restore();ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillStyle=ctx.strokeStyle;ctx.fillText(mission.lockTime>.65?'LOCK / RELEASE':'ACQUIRING',l.x,l.y+34)}}
// Threat indicators remain visible when an enemy leaves the forward view.
for(let e of enemies.filter(e=>e.z<80)){let v=project(e.x,e.y,e.z);if(v&&(v.x<20||v.x>W-20||v.y<20||v.y>H-20)){ctx.fillStyle='#ffb58a';let x=clamp(v.x,25,W-25),y=clamp(v.y,80,H-75);ctx.beginPath();ctx.moveTo(x,y-6);ctx.lineTo(x-5,y+4);ctx.lineTo(x+5,y+4);ctx.fill()}}
}
ctx.restore();let vignette=ctx.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,W*.7);vignette.addColorStop(0,'transparent');vignette.addColorStop(1,'#06101e77');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);if(flash>0&&!settings.reduced){ctx.fillStyle='rgba(221,255,235,'+Math.min(.45,flash*.5)+')';ctx.fillRect(0,0,W,H)}
}
function loop(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;clock+=dt;frame++;let c=gamepad(dt);if(mode==='playing')update(dt,c);else if(mode==='title'&&performance.now()-lastInput>10000)start(true);shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt*1.5);if(clock>radioUntil)$('radio').style.opacity=0;if(clock>bannerUntil)$('banner').textContent='';if(mode==='playing')music();render();pressed.clear();requestAnimationFrame(loop)}title();requestAnimationFrame(loop);
