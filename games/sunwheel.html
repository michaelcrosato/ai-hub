<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#11131c" />
  <meta name="description" content="Sunwheel: Relic Run — a low-poly 2.5D action platformer vertical slice in one HTML file." />
  <title>Sunwheel: Relic Run</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%23d9a441%22/><circle cx=%2250%22 cy=%2250%22 r=%2218%22 fill=%22%2311131c%22/><path d=%22M50 4v20M50 76v20M4 50h20M76 50h20M18 18l14 14M68 68l14 14M82 18L68 32M32 68L18 82%22 stroke=%22%23f6d77c%22 stroke-width=%228%22 stroke-linecap=%22round%22/></svg>" />
  <style>
:root {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #f8edcf;
  background: #10131a;
  font-synthesis: none;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

* { box-sizing: border-box; }
html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { overscroll-behavior: none; user-select: none; }
button { font: inherit; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.game-shell { position: relative; width: 100%; height: 100%; overflow: hidden; background: #11131c; }
.game-shell::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 45%, transparent 48%, rgba(7, 8, 12, .48) 110%);
  mix-blend-mode: multiply;
}

.topbar {
  position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left));
  right: max(10px, env(safe-area-inset-right)); z-index: 12; display: flex; gap: 8px; align-items: flex-start;
  pointer-events: none;
}
.panel {
  background: linear-gradient(180deg, rgba(28, 29, 39, .9), rgba(14, 15, 23, .82));
  border: 1px solid rgba(239, 201, 103, .25); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.22);
  backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
}
.hud-main { padding: 9px 11px; min-width: min(390px, calc(100vw - 88px)); }
.hud-row { display: flex; align-items: center; gap: 8px; height: 16px; }
.hud-row + .hud-row { margin-top: 7px; }
.hud-label { width: 42px; font-size: 10px; letter-spacing: .16em; color: #dfca96; font-weight: 800; }
.meter { position: relative; flex: 1; height: 9px; overflow: hidden; border-radius: 20px; background: #232631; box-shadow: inset 0 0 0 1px rgba(255,255,255,.04); }
.meter > i { display: block; height: 100%; width: 50%; background: linear-gradient(90deg, #be4c3f, #ed7b50); border-radius: inherit; transition: width .15s ease; }
#xpFill { background: linear-gradient(90deg, #d09639, #f3d983); }
#furyFill { background: linear-gradient(90deg, #448aa3, #7fe2df); }
.hud-stat { min-width: 50px; font-size: 11px; font-weight: 800; text-align: right; color: #fff3cf; }

.objective { margin-left: auto; max-width: 330px; padding: 10px 12px; text-align: right; }
.objective b { display: block; font-size: 10px; letter-spacing: .18em; color: #e4c36c; }
.objective span { font-size: 12px; color: #f6edd9; }

.small-button {
  pointer-events: auto; width: 42px; height: 42px; border-radius: 12px; border: 1px solid rgba(239,201,103,.28);
  background: rgba(17,18,27,.82); color: #f6e5bd; font-weight: 900; box-shadow: 0 6px 18px rgba(0,0,0,.22);
}
.small-button:active { transform: translateY(1px) scale(.97); }

.bossbar { position: absolute; z-index: 13; top: max(92px, calc(env(safe-area-inset-top) + 92px)); left: 50%; transform: translateX(-50%); width: min(520px, calc(100vw - 40px)); padding: 8px 12px; display: none; }
.bossbar.show { display: block; }
.bossbar .name { font-size: 11px; font-weight: 900; text-align: center; letter-spacing: .18em; color: #f2d27a; margin-bottom: 6px; }
.bossbar .meter { height: 11px; }
.bossbar .meter i { background: linear-gradient(90deg, #7d2e32, #cf5d42); }

.toast { position: absolute; z-index: 15; left: 50%; top: 23%; transform: translate(-50%, -10px); max-width: min(620px, calc(100vw - 40px));
  padding: 9px 14px; border-radius: 10px; color: #ffe9b1; background: rgba(18,18,26,.88); border: 1px solid rgba(232,196,100,.25); font-weight: 800; font-size: 13px; letter-spacing: .02em; text-align: center; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.mobile-controls { display: none; position: absolute; inset: 0; z-index: 20; pointer-events: none; }
.joystick-zone { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(18px, calc(env(safe-area-inset-bottom) + 12px)); width: 134px; height: 134px; pointer-events: auto; touch-action: none; }
.joystick-base { position: absolute; inset: 13px; border-radius: 50%; border: 2px solid rgba(255,232,177,.2); background: rgba(10,11,18,.34); box-shadow: inset 0 0 0 7px rgba(255,255,255,.025); }
.joystick-knob { position: absolute; left: 46px; top: 46px; width: 42px; height: 42px; border-radius: 50%; background: rgba(236,198,105,.48); border: 2px solid rgba(255,240,201,.48); box-shadow: 0 8px 18px rgba(0,0,0,.25); transform: translate(0,0); }
.action-cluster { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(18px, calc(env(safe-area-inset-bottom) + 10px)); width: 178px; height: 142px; pointer-events: auto; }
.action {
  position: absolute; border-radius: 50%; border: 2px solid rgba(255,236,186,.28); color: #fff1c5; background: rgba(22,23,32,.66);
  box-shadow: inset 0 0 16px rgba(255,255,255,.03), 0 8px 20px rgba(0,0,0,.2); font-weight: 950; touch-action: none;
}
.action:active, .action.pressed { transform: scale(.94); background: rgba(118,79,34,.72); }
.action.attack { width: 70px; height: 70px; right: 0; bottom: 28px; font-size: 23px; }
.action.jump { width: 60px; height: 60px; right: 78px; bottom: 0; font-size: 17px; }
.action.special { width: 50px; height: 50px; right: 76px; bottom: 70px; font-size: 12px; color: #aef2ef; }

.modal-layer { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; padding: 18px; background: radial-gradient(circle at 50% 40%, rgba(17,18,25,.24), rgba(8,9,14,.82)); }
.modal-layer.hidden { display: none; }
.card { width: min(720px, 100%); border: 1px solid rgba(242,202,100,.28); border-radius: 18px; background: linear-gradient(180deg, rgba(25,26,36,.96), rgba(12,13,20,.96)); padding: clamp(20px, 5vw, 40px); box-shadow: 0 22px 80px rgba(0,0,0,.55); }
.brand-kicker { font-size: 11px; font-weight: 900; letter-spacing: .28em; color: #deb85b; }
h1 { margin: 8px 0 10px; font-size: clamp(38px, 8vw, 74px); line-height: .92; letter-spacing: -.05em; color: #ffe3a2; text-shadow: 0 8px 30px rgba(214,143,50,.18); }
.lead { margin: 0; max-width: 590px; color: #d8d2c1; line-height: 1.5; font-size: 14px; }
.start-grid { display: grid; grid-template-columns: 1.3fr .7fr; gap: 18px; margin-top: 26px; }
.instructions { padding: 15px; border-radius: 12px; background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.05); }
.instructions b { color: #f0cf7a; font-size: 11px; letter-spacing: .12em; }
.instructions p { margin: 6px 0 0; font-size: 12px; color: #c9c4b6; line-height: 1.5; }
.primary { width: 100%; border: 0; border-radius: 12px; padding: 14px 18px; color: #17120b; background: linear-gradient(180deg, #f1d178, #ca8f35); font-weight: 950; letter-spacing: .04em; box-shadow: 0 10px 30px rgba(177,115,33,.24); cursor: pointer; }
.primary:active { transform: translateY(1px); }
.secondary { margin-top: 10px; width: 100%; border-radius: 12px; padding: 11px; border: 1px solid rgba(255,255,255,.1); background: #1a1c26; color: #dcd6c8; font-weight: 800; cursor: pointer; }
.mode-note { margin-top: 9px; font-size: 10px; color: #8f918d; text-align: center; }

.upgrade-card h2, .finish-card h2 { margin: 0 0 8px; color: #f2d27a; }
.upgrade-card > p, .finish-card > p { color: #cfc9bb; margin: 0 0 18px; }
.upgrade-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.upgrade-option { min-height: 128px; border: 1px solid rgba(239,201,103,.18); border-radius: 12px; background: rgba(255,255,255,.035); color: #f7edda; padding: 13px; text-align: left; cursor: pointer; }
.upgrade-option:hover { border-color: rgba(239,201,103,.46); background: rgba(239,201,103,.07); }
.upgrade-option b { display: block; color: #f0c969; margin-bottom: 8px; }
.upgrade-option span { font-size: 12px; color: #c9c5bb; line-height: 1.4; }
.finish-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 18px 0; }
.finish-stat { padding: 12px; text-align: center; border-radius: 10px; background: rgba(255,255,255,.035); }
.finish-stat b { display: block; font-size: 22px; color: #f4d582; }
.finish-stat small { color: #9fa09a; text-transform: uppercase; letter-spacing: .1em; }

.damage-flash { position: absolute; inset: 0; z-index: 14; pointer-events: none; background: radial-gradient(circle, transparent 55%, rgba(170,35,31,.55)); opacity: 0; transition: opacity .12s; }
.damage-flash.show { opacity: 1; }
.scanlines { position: absolute; inset: 0; z-index: 11; pointer-events: none; opacity: .05; background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(255,255,255,.2) 4px); }

.fatal { display: grid; place-items: center; min-height: 100%; padding: 30px; text-align: center; background: #11131c; color: #eee; }
.fatal h1 { font-size: 32px; }

@media (pointer: coarse), (max-width: 900px) {
  .mobile-controls { display: block; }
  .objective { max-width: 44vw; padding: 8px 10px; }
  .objective span { font-size: 10px; }
  .hud-main { min-width: 46vw; }
  .hud-label { width: 34px; font-size: 9px; }
  .hud-stat { min-width: 40px; font-size: 9px; }
  .start-grid { grid-template-columns: 1fr; }
  .instructions.desktop-only { display: none; }
  .upgrade-grid { grid-template-columns: 1fr; }
  .upgrade-option { min-height: 90px; }
  .finish-stats { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 520px) {
  .topbar { gap: 5px; }
  .hud-main { padding: 8px; min-width: 52vw; }
  .objective { display: none; }
  .small-button { width: 38px; height: 38px; }
  .toast { top: 18%; font-size: 12px; }
  .joystick-zone { transform: scale(.9); transform-origin: left bottom; }
  .action-cluster { transform: scale(.9); transform-origin: right bottom; }
  .card { padding: 20px; }
  h1 { font-size: 44px; }
}

  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.186.0/build/three.webgpu.js",
      "three/webgpu": "https://unpkg.com/three@0.186.0/build/three.webgpu.js",
      "three/tsl": "https://unpkg.com/three@0.186.0/build/three.tsl.js",
      "three/addons/": "https://unpkg.com/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import * as THREE from 'three/webgpu';
    import { pass } from 'three/tsl';
    import { bloom } from 'three/addons/tsl/display/BloomNode.js';

    function hasWebGL(version = 2) {
      try {
        const canvas = document.createElement('canvas');
        const gl = version === 2
          ? canvas.getContext('webgl2', { failIfMajorPerformanceCaveat: false })
          : (canvas.getContext('webgl', { failIfMajorPerformanceCaveat: false }) || canvas.getContext('experimental-webgl'));
        return !!gl;
      } catch {
        return false;
      }
    }

    async function runModern() {
const root = document.querySelector('#app');
const isTouch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
const isMobile = isTouch || innerWidth < 900;

root.innerHTML = `
  <div class="game-shell" id="shell">
    <div class="topbar">
      <div class="panel hud-main">
        <div class="hud-row"><span class="hud-label">VIGOR</span><span class="meter"><i id="hpFill"></i></span><span class="hud-stat" id="hpText">4 / 4</span></div>
        <div class="hud-row"><span class="hud-label">XP</span><span class="meter"><i id="xpFill"></i></span><span class="hud-stat" id="levelText">LV 1</span></div>
        <div class="hud-row"><span class="hud-label">FLARE</span><span class="meter"><i id="furyFill"></i></span><span class="hud-stat" id="gearText">BRONZE I</span></div>
      </div>
      <div class="panel objective"><b>OBJECTIVE</b><span id="objectiveText">Reach the Skyforge Shrine</span></div>
      <button class="small-button" id="pauseBtn" aria-label="Pause">Ⅱ</button>
      <button class="small-button" id="soundBtn" aria-label="Sound">♪</button>
    </div>
    <div class="panel bossbar" id="bossbar"><div class="name">THE HORNED WARDEN</div><span class="meter"><i id="bossFill"></i></span></div>
    <div class="toast" id="toast"></div>
    <div class="damage-flash" id="damageFlash"></div>
    <div class="scanlines"></div>
    <div class="mobile-controls" id="mobileControls">
      <div class="joystick-zone" id="joystickZone"><div class="joystick-base"></div><div class="joystick-knob" id="joystickKnob"></div></div>
      <div class="action-cluster">
        <button class="action special" id="specialBtn">FLARE</button>
        <button class="action jump" id="jumpBtn">JUMP</button>
        <button class="action attack" id="attackBtn">◎</button>
      </div>
    </div>
    <div class="modal-layer" id="startLayer">
      <div class="card">
        <div class="brand-kicker">A LOW-POLY RELIC RUN</div>
        <h1>SUNWHEEL:<br>RELIC RUN</h1>
        <p class="lead">Cross the Bronzewind ruins, choose a route through the old shrine, grow stronger, and break the Horned Warden with a returning sunwheel.</p>
        <div class="start-grid">
          <div class="instructions"><b>MOBILE</b><p>Left thumb: move. JUMP and ◎ can be held by separate fingers. Pinch the play area to change camera distance. FLARE spends a full blue meter.</p></div>
          <div class="instructions desktop-only"><b>DESKTOP</b><p>A/D or ←/→ move · Space/W jump · J attack · K flare · mouse wheel zoom · Esc pause.</p></div>
        </div>
        <div class="start-grid" style="grid-template-columns:1fr .7fr;align-items:end">
          <button class="primary" id="startBtn">ENTER THE RIDGE</button>
          <div class="mode-note" id="renderMode">Initializing renderer…</div>
        </div>
      </div>
    </div>
    <div class="modal-layer hidden" id="upgradeLayer">
      <div class="card upgrade-card">
        <div class="brand-kicker">SUNWHEEL AWAKENED</div>
        <h2>Choose one upgrade</h2>
        <p>Level gains are intentionally small. Exploration helps, but the boss does not require grinding.</p>
        <div class="upgrade-grid">
          <button class="upgrade-option" data-upgrade="edge"><b>SHARP EDGE</b><span>+35% strike power. Best for shorter boss phases.</span></button>
          <button class="upgrade-option" data-upgrade="reach"><b>LONG CHAIN</b><span>+1.4 throw range. Safer against flyers and the Warden.</span></button>
          <button class="upgrade-option" data-upgrade="grit"><b>IRON GRIT</b><span>+1 maximum vigor and restore 2 vigor now.</span></button>
        </div>
      </div>
    </div>
    <div class="modal-layer hidden" id="pauseLayer">
      <div class="card" style="max-width:440px;text-align:center"><div class="brand-kicker">PAUSED</div><h2 style="color:#f2d27a">The ridge waits.</h2><button class="primary" id="resumeBtn">RESUME</button><button class="secondary" id="restartBtn">RESTART RUN</button></div>
    </div>
    <div class="modal-layer hidden" id="finishLayer">
      <div class="card finish-card">
        <div class="brand-kicker">SKYFORGE SECURED</div><h2>Relic run complete</h2><p>The Horned Warden is down and the eastern seal is open.</p>
        <div class="finish-stats"><div class="finish-stat"><b id="timeStat">0:00</b><small>time</small></div><div class="finish-stat"><b id="levelStat">1</b><small>level</small></div><div class="finish-stat"><b id="deathStat">0</b><small>falls</small></div><div class="finish-stat"><b id="upgradeStat">0</b><small>upgrades</small></div></div>
        <button class="primary" id="againBtn">RUN IT AGAIN</button>
      </div>
    </div>
  </div>`;

const ui = Object.fromEntries([
  'hpFill','hpText','xpFill','levelText','furyFill','gearText','objectiveText','pauseBtn','soundBtn','bossbar','bossFill','toast','damageFlash',
  'mobileControls','joystickZone','joystickKnob','specialBtn','jumpBtn','attackBtn','startLayer','startBtn','renderMode','upgradeLayer','pauseLayer',
  'resumeBtn','restartBtn','finishLayer','timeStat','levelStat','deathStat','upgradeStat','againBtn'
].map(id => [id, document.getElementById(id)]));

// ---------- Renderer ----------
const renderer = new THREE.WebGPURenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isMobile ? 1.35 : 1.8));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.domElement.id = 'gameCanvas';
document.querySelector('.game-shell').prepend(renderer.domElement);
await renderer.init();
const backendName = renderer.backend?.constructor?.name || (navigator.gpu ? 'WebGPU' : 'WebGL2');
ui.renderMode.textContent = `${backendName.replace('Backend','')} · three.js r186 · ${isMobile ? 'mobile quality' : 'desktop quality'}`;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8f8a7f);
scene.fog = new THREE.Fog(0x9c9181, 24, 72);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 160);
let cameraDistance = isMobile ? 18.5 : 16.5;
let cameraTargetDistance = cameraDistance;
camera.position.set(4, 7.2, cameraDistance);

const hemi = new THREE.HemisphereLight(0xf8dba7, 0x273845, 2.1);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xffe0a0, 4.0);
sunLight.position.set(-10, 24, 15);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
sunLight.shadow.camera.left = -18;
sunLight.shadow.camera.right = 18;
sunLight.shadow.camera.top = 15;
sunLight.shadow.camera.bottom = -10;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 70;
sunLight.shadow.bias = -0.00035;
scene.add(sunLight);
scene.add(sunLight.target);

const renderPipeline = new THREE.RenderPipeline(renderer);
const scenePass = pass(scene, camera);
const sceneColor = scenePass.getTextureNode('output');
const bloomPass = bloom(sceneColor, isMobile ? 0.22 : 0.32, 0.32, 0.92);
if (bloomPass.setResolutionScale) bloomPass.setResolutionScale(isMobile ? 0.45 : 0.6);
renderPipeline.outputNode = sceneColor.add(bloomPass);

// ---------- Materials / geometry helpers ----------
const mat = {
  stone: new THREE.MeshStandardMaterial({ color: 0x6e6558, roughness: 0.9, metalness: 0.02, flatShading: true }),
  stoneLight: new THREE.MeshStandardMaterial({ color: 0x91836c, roughness: 0.86, flatShading: true }),
  stoneDark: new THREE.MeshStandardMaterial({ color: 0x494743, roughness: 1, flatShading: true }),
  moss: new THREE.MeshStandardMaterial({ color: 0x596c4d, roughness: 1, flatShading: true }),
  bronze: new THREE.MeshStandardMaterial({ color: 0x9e6e32, roughness: 0.55, metalness: 0.55, flatShading: true }),
  gold: new THREE.MeshStandardMaterial({ color: 0xd9a441, emissive: 0x3a2105, emissiveIntensity: 0.8, roughness: 0.4, metalness: 0.5, flatShading: true }),
  cyan: new THREE.MeshStandardMaterial({ color: 0x5bc2bf, emissive: 0x0d5756, emissiveIntensity: 1.8, roughness: 0.25, flatShading: true }),
  ember: new THREE.MeshStandardMaterial({ color: 0xeb754b, emissive: 0x8a2511, emissiveIntensity: 2.4, roughness: 0.35, flatShading: true }),
  dark: new THREE.MeshStandardMaterial({ color: 0x232630, roughness: 0.8, flatShading: true }),
  leather: new THREE.MeshStandardMaterial({ color: 0x533a2e, roughness: 0.95, flatShading: true }),
  bone: new THREE.MeshStandardMaterial({ color: 0xd6c9a4, roughness: 0.9, flatShading: true }),
  red: new THREE.MeshStandardMaterial({ color: 0x9d3f35, roughness: 0.8, flatShading: true }),
};

function mesh(geometry, material, cast = true, receive = true) {
  const m = new THREE.Mesh(geometry, material);
  m.castShadow = cast;
  m.receiveShadow = receive;
  return m;
}

function box(w, h, d, material = mat.stone) {
  return mesh(new THREE.BoxGeometry(w, h, d), material);
}

function addBox(parent, w, h, d, x, y, z, material = mat.stone) {
  const m = box(w, h, d, material);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}

function lowSphere(radius, material, detail = 1) {
  return mesh(new THREE.IcosahedronGeometry(radius, detail), material);
}

const world = new THREE.Group();
scene.add(world);
const deco = new THREE.Group();
scene.add(deco);

// ---------- World and traversal ----------
const platforms = [];
function addPlatform(x1, x2, y, thickness = 1.0, material = mat.stone) {
  platforms.push({ x1, x2, y });
  const top = box(x2 - x1, thickness, 5.5, material);
  top.position.set((x1 + x2) / 2, y - thickness / 2, 0);
  world.add(top);
  const lip = box(x2 - x1, 0.14, 5.68, mat.moss);
  lip.position.set((x1 + x2) / 2, y + 0.02, 0);
  world.add(lip);
}

addPlatform(-2, 32, 0);
addPlatform(35, 48, 0);
addPlatform(48, 74, 0);
addPlatform(76, 122, 0);
addPlatform(124, 153, 0);
// Stairs to upper ruin route.
for (let i = 0; i < 4; i++) addPlatform(39 + i * 2, 41 + i * 2, i + 1, 0.8, mat.stoneLight);
addPlatform(47, 68, 5, 0.8, mat.stoneLight);
for (let i = 0; i < 3; i++) addPlatform(68 + i * 2, 70 + i * 2, 4 - i, 0.8, mat.stoneLight);
// Optional ledges and bridge rhythm.
addPlatform(20, 25, 1.5, 0.6, mat.stoneLight);
addPlatform(27, 30.5, 2.8, 0.6, mat.stoneLight);
addPlatform(103, 108, 1.5, 0.7, mat.stoneLight);
addPlatform(110, 114, 2.8, 0.7, mat.stoneLight);

// ---------- Audio ----------
class AudioSystem {
  constructor() { this.ctx = null; this.enabled = true; this.nextNote = 0; this.step = 0; }
  async unlock() {
    try {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) { this.enabled = false; return; }
      if (!this.ctx) this.ctx = new AudioCtor();
      if (this.ctx.state === 'suspended') await this.ctx.resume();
      this.nextNote = this.ctx.currentTime + 0.05;
    } catch {
      this.enabled = false;
    }
  }
  tone(freq, duration = 0.08, type = 'square', volume = 0.03, slide = 0) {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); const gain = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + duration);
    gain.gain.setValueAtTime(volume, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    o.connect(gain); gain.connect(this.ctx.destination); o.start(t); o.stop(t + duration + 0.02);
  }
  sfx(name) {
    const map = {
      jump: [210, .09, 'square', .025, 140], attack: [520, .07, 'sawtooth', .022, -250], hit: [120, .08, 'square', .035, -40],
      hurt: [95, .18, 'sawtooth', .05, -45], pickup: [740, .15, 'triangle', .035, 420], level: [440, .22, 'square', .03, 440],
      flare: [130, .38, 'sawtooth', .04, 650], checkpoint: [330, .24, 'triangle', .03, 220], boss: [72, .45, 'sawtooth', .045, -18], win: [523, .4, 'triangle', .04, 260]
    };
    const a = map[name]; if (a) this.tone(...a);
  }
  tickMusic() {
    if (!this.enabled || !this.ctx || !state.started || state.paused || state.finished) return;
    const now = this.ctx.currentTime;
    const scale = boss.aggro && !boss.dead ? [73, 87, 98, 110, 98, 87, 82, 73] : [110, 131, 147, 165, 147, 131, 123, 98];
    while (this.nextNote < now + 0.12) {
      const freq = scale[this.step % scale.length] * (this.step % 4 === 0 ? 1 : 2);
      const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(freq, this.nextNote);
      g.gain.setValueAtTime(0.012, this.nextNote); g.gain.exponentialRampToValueAtTime(0.0001, this.nextNote + 0.12);
      o.connect(g); g.connect(this.ctx.destination); o.start(this.nextNote); o.stop(this.nextNote + 0.13);
      this.nextNote += 0.18; this.step++;
    }
  }
}

function updateJoy(e) {

  const len = Math.hypot(dx, dy); const max = 42; const s = len > max ? max / len : 1;
  const nx = dx * s; const ny = dy * s;
  ui.joystickKnob.style.transform = `translate(${nx}px,${ny}px)`;
  input.axis = Math.abs(nx / max) < 0.12 ? 0 : nx / max;
}
