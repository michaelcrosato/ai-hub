	);
	mask: radial-gradient(transparent 64%, #fff 65%, #fff 69%, transparent 70%);
	-webkit-mask: radial-gradient(
		transparent 64%,
		#fff 65%,
		#fff 69%,
		transparent 70%
	);
}
.reticle.charged {
	color: var(--gold);
}
.target-lock {
	position: absolute;
	transform: translate(-50%, -50%);
	width: 70px;
	height: 70px;
	color: var(--gold);
	filter: drop-shadow(0 1px 3px #182c34);
}
.target-lock.locked {
	color: var(--coral);
}
.target-lock > span {
	position: absolute;
	top: calc(100% + 8px);
	left: 50%;
	transform: translateX(-50%);
	font-size: 8px;
	letter-spacing: 1.5px;
	white-space: nowrap;
	font-weight: 800;
}
.target-lock.locked:before {
	content: "";
	position: absolute;
	inset: 8px;
	border: 1px dashed currentColor;
	border-radius: 50%;
}
.flight-toast {
	position: absolute;
	top: 26%;
	left: 50%;
	transform: translateX(-50%);
	font-size: 16px;
	font-weight: 800;
	letter-spacing: 2px;
	text-align: center;
	color: var(--gold);
	padding: 12px 20px;
	background: linear-gradient(90deg, transparent, #0b273a88, transparent);
	white-space: nowrap;
}
.route-choice {
	position: absolute;
	top: 25%;
	left: 50%;
	transform: translateX(-50%);
	min-width: 540px;
	text-align: center;
	background: linear-gradient(
		90deg,
		transparent,
		rgba(12, 35, 43, 0.8),
		transparent
	);
	padding: 20px 35px 24px;
}
.route-choice .eyebrow {
	justify-content: center;
	font-size: 8px;
	color: var(--gold);
	margin: 0 0 8px;
}
.route-choice h2 {
	font-size: 25px;
	letter-spacing: -0.5px;
	font-weight: 500;
	margin: 0 0 18px;
}
.route-choice > div {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 25px;
}
.route-choice > div > span {
	font-size: 14px;
	letter-spacing: 2px;
	line-height: 1.6;
}
.route-choice b {
	font-size: 10px;
	letter-spacing: 1.4px;
}
.route-choice small {
	display: block;
	font-size: 9px;
	font-weight: 400;
	letter-spacing: 0.3px;
	opacity: 0.7;
}
.route-choice i {
	font-size: 8px;
	opacity: 0.5;
	font-style: normal;
}
.communications {
	position: absolute;
	left: 4%;
	bottom: 10%;
	max-width: min(560px, 51vw);
	display: flex;
	align-items: stretch;
	gap: 0;
	min-height: 91px;
	background: linear-gradient(
		90deg,
		rgba(11, 35, 42, 0.88),
		rgba(11, 35, 42, 0.82) 80%,
		rgba(11, 35, 42, 0.4)
	);

	border-top: 1px solid #d5ebce29;
	border-bottom: 1px solid #d5ebce29;
}
.portrait {

	min-width: 91px;
	background: linear-gradient(135deg, #2f5962, #183b43);
	overflow: hidden;
}
.portrait svg {
	width: 100%;
	height: 100%;
	display: block;
}
.comms-copy {
	padding: 13px 18px 14px;
	flex: 1;
}
.comms-heading {
	display: flex;
	gap: 25px;
	align-items: center;
	justify-content: space-between;
}
.comms-heading strong {
	font-size: 10px;
	letter-spacing: 2px;
	color: var(--mint);
}
.comms-heading > span {
	font-size: 6px;
	letter-spacing: 1.1px;
	white-space: nowrap;
	color: var(--mint);
	opacity: 0.7;
}
.comms-heading i {
	display: inline-block;
	width: 3px;
	height: 3px;
	border-radius: 50%;
	background: currentColor;
	margin-right: 3px;
}
.communications p {
	font-size: 14px;
	line-height: 1.5;
	font-weight: 400;
	color: var(--paper);
	margin: 9px 0 0;
	max-width: 410px;
}
.communications[data-speaker="brim"] {
	border-color: var(--coral);
}
.communications[data-speaker="brim"] .comms-heading strong {
	color: var(--coral);
}
.lesson-card {
	position: absolute;
	right: 4%;
	bottom: 12%;
	width: 320px;
	border-top: 2px solid var(--gold);
	background: rgba(11, 35, 42, 0.86);
	padding: 18px 21px;
}
.lesson-marker {
	font-size: 8px;
	font-weight: 800;
	letter-spacing: 1.7px;
	color: var(--gold);
}
.lesson-card h3 {
	font-size: 20px;
	margin: 10px 0 9px;
	font-weight: 500;
}
.lesson-card p {
	font-size: 13px;
	line-height: 1.6;
	color: var(--mint);
	margin: 0;
}
.flight-bottom {
	position: absolute;
	bottom: 3.5%;
	left: 4%;
	right: 4%;
	display: flex;
	justify-content: space-between;
	align-items: center;
}
.flight-controls {
	display: flex;
	gap: 18px;
}
.flight-controls > span {
	font-size: 7px;
	letter-spacing: 1px;
	display: flex;
	align-items: center;
	gap: 6px;
	color: var(--mint);
}
.flight-controls kbd {
	font-size: 7px;
	min-height: 18px;
	min-width: 21px;
}
.altitude-label {
	font-size: 7px;
	letter-spacing: 1.5px;
	color: var(--mint);
	opacity: 0.6;
}
.altitude-label b {
	font-weight: 400;
	font-size: 14px;
	margin-left: 18px;
}
.attract-banner {
	position: absolute;
	bottom: 4%;
	left: 50%;
	transform: translateX(-50%);
	display: flex;
	align-items: center;
	gap: 14px;
	padding: 13px 23px;
	border: 1px solid #c7e2c966;
	background: #102f35e8;
	color: var(--mint);
	font-size: 9px;
	letter-spacing: 1.6px;
	white-space: nowrap;
	z-index: 8;
}
.attract-banner b {
	font-size: 9px;
	letter-spacing: 2px;
}
.attract-banner > span:not(.live-dot) {
	font-size: 8px;
	opacity: 0.6;
	padding-left: 16px;
	border-left: 1px solid var(--line);
}
.attract-banner strong {
	font-size: 8px;
	font-weight: 500;
	color: var(--paper);
	margin-left: 15px;
}
.live-dot {
	width: 5px;
	height: 5px;
	border-radius: 50%;
	background: var(--coral);
	box-shadow: 0 0 10px #f5917366;
}
.attract .flight-bottom {
	display: none;
}
/* Shared cockpit panels */
.modal-screen {
	display: flex;
	align-items: center;
	justify-content: center;
	background: rgba(8, 27, 34, 0.67);
	backdrop-filter: blur(9px);
	-webkit-backdrop-filter: blur(9px);
	pointer-events: auto;
	padding: 8vh 5vw;
}
.panel {
	width: 660px;
	max-height: 85vh;
	overflow: auto;
	position: relative;
	background: rgba(17, 44, 49, 0.94);
	border: 1px solid rgba(187, 220, 196, 0.26);
	box-shadow: 0 20px 100px #071e2955;
	padding: 35px 42px 25px;
	scrollbar-width: thin;
	scrollbar-color: #628980 transparent;
}
.panel:before {
	content: "";
	position: absolute;
	top: 0;
	left: 42px;
	width: 65px;
	height: 3px;
	background: var(--mint);
}
.panel h2 {
	font-size: 45px;
	letter-spacing: -1.7px;
	line-height: 1.05;
	font-weight: 500;
	margin: 0;
	color: var(--paper);
}
.panel .eyebrow {
	font-size: 8px;
	letter-spacing: 2px;
	margin-bottom: 13px;
}
.panel-intro {
	font-size: 13px;
	line-height: 1.65;
	color: var(--muted);
	margin: 16px 0 25px;
	max-width: 500px;
}
.panel-header {
	display: flex;
	align-items: flex-start;
	justify-content: space-between;
	gap: 20px;
}
.panel-index {
	font-size: 9px;
	letter-spacing: 2px;
	color: var(--mint);
	opacity: 0.5;
	margin-top: 8px;
}
.compact-panel {
	width: 470px;
	padding: 39px 42px 30px;
}
.compact-panel h2 {
	font-size: 50px;
	letter-spacing: -1.7px;
	line-height: 1.07;
}
.button-stack {
	display: flex;
	flex-direction: column;
	gap: 7px;
	margin-top: 25px;
}
.panel-button {
	padding: 13px 17px;
	min-height: 47px;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 25px;
	border: 1px solid var(--line);
	font-size: 10px;
	letter-spacing: 1.3px;
	font-weight: 800;
	transition:
		background 0.15s,
		color 0.15s;
}
.panel-button svg {
	width: 20px;
	height: 20px;
}
.panel-button.accent {
	background: var(--mint);
	color: var(--ink);
	border-color: var(--mint);
}
.panel-button.is-focused,
.panel-button:hover {
	background: var(--paper);
	color: var(--ink);
	border-color: var(--paper);
}
.panel-button.quiet {
	border-color: transparent;
	color: var(--muted);
}
.panel-button.quiet.is-focused,
.panel-button.quiet:hover {
	color: var(--ink);
}
.panel-footer {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 10px;
	border-top: 1px solid var(--line);
	margin-top: 23px;
	padding-top: 17px;
}
.panel-footer > span {
	font-size: 7px;
	letter-spacing: 1px;
	color: var(--muted);
	opacity: 0.7;
}
.back-button {
	font-size: 9px;
	letter-spacing: 1.4px;
	font-weight: 700;
	padding: 8px 10px;
	border: 1px solid transparent;
	color: var(--mint);
}
.back-button:hover,
.back-button.is-focused {
	background: var(--mint);
	color: var(--ink);
}
.settings-panel {
	width: 690px;
}
.settings-panel .panel-intro {
	margin: 13px 0 18px;
}
.settings-list {
	display: flex;
	flex-direction: column;
}
.setting-row {
	display: flex;
	justify-content: space-between;
	align-items: center;
	gap: 25px;
	padding: 12px 12px;
	border: 1px solid transparent;
	border-bottom-color: var(--line);
	text-align: left;
	min-height: 54px;
}
.setting-row > span {
	font-size: 13px;
	letter-spacing: 0.2px;
	line-height: 1.3;
}
.setting-row small {
	display: block;
	font-size: 9px;
	line-height: 1.4;
	margin-top: 4px;
	color: var(--muted);
}
.setting-row > b {
	font-size: 11px;
	letter-spacing: 1.1px;
	color: var(--mint);
	white-space: nowrap;
	min-width: 95px;
	text-align: center;
}
.setting-row > b i {
	font-size: 17px;
	font-style: normal;
	font-weight: 400;
	margin: 0 10px;
	opacity: 0.5;
}
.setting-row:hover,
.setting-row.is-focused {
	background: var(--mint);
	color: var(--ink);
	border-color: var(--mint);
}
.setting-row:hover b,
.setting-row.is-focused b {
	color: var(--ink);
}
.setting-row:hover small,
.setting-row.is-focused small {
	color: #29534f;
}
.manual-panel {
	width: 640px;
}
.manual-rows {
	display: flex;
	flex-direction: column;
	border-top: 1px solid var(--line);
}
.manual-rows > div {
	display: flex;
	align-items: center;
	gap: 30px;
	min-height: 57px;
	border-bottom: 1px solid var(--line);
	font-size: 13px;
	color: var(--paper);
}
.manual-rows kbd {
	width: 140px;

	border: none;
	background: rgba(173, 208, 190, 0.08);
	font-size: 11px;
	min-height: 30px;
	color: var(--mint);
	font-weight: 600;
	flex-shrink: 0;
}
.manual-foot {
	font-size: 12px;
	line-height: 1.7;
	color: var(--muted);
	border-left: 2px solid var(--coral);
	padding-left: 16px;
	margin-top: 22px;
}
.page-nav {
	display: flex;
	align-items: center;
	gap: 14px;
}
.page-nav button {
	width: 35px;
	height: 35px;
	color: var(--mint);
	border: 1px solid var(--line);
}
.page-nav button.is-focused,
.page-nav button:hover {
	background: var(--mint);
	color: var(--ink);
}
.manual-page-number {
	font-size: 10px;
	letter-spacing: 2px;
	color: var(--muted);
}
.about-panel {
	width: 730px;
}
.about-fox {
	width: 47px;
	height: 47px;
	color: var(--mint);
	opacity: 0.9;
}
.about-tabs {
	display: flex;
	gap: 20px;
	border-bottom: 1px solid var(--line);
	margin-top: 26px;
}
.about-tabs button {
	font-size: 9px;
	font-weight: 700;
	letter-spacing: 1.3px;
	padding: 10px 4px 14px;
	color: var(--muted);
	border-bottom: 2px solid transparent;
}
.about-tabs button.active {
	color: var(--mint);
	border-bottom-color: var(--mint);
}
.about-tabs button.is-focused,
.about-tabs button:hover {
	background: rgba(197, 225, 202, 0.14);
	color: var(--paper);
}
.about-content {
	overflow: auto;
	max-height: 43vh;
	min-height: 280px;
	scrollbar-width: thin;
	scrollbar-color: #628980 transparent;
	font-size: 12px;
	line-height: 1.7;
	color: var(--muted);
	padding: 4px 10px 0 0;
}
.about-content p {
	margin: 14px 0;
}
.about-content .about-lead {
	font-size: 20px;
	line-height: 1.4;
	color: var(--paper);
	margin: 22px 0 9px;
	letter-spacing: -0.4px;
}
.about-content h3 {
	font-size: 9px;
	letter-spacing: 1.6px;
	color: var(--mint);
	margin: 24px 0 10px;
}
.about-content b,
.about-content strong {
	color: var(--paper);
	font-weight: 600;
}
.metadata-text {
	font-size: 11px;
	line-height: 1.7;
}
.metadata-text p {
	margin: 8px 0;
}
.metadata-text ul {
	padding-left: 16px;
}
.metadata-text li {
	margin: 7px 0;
}
.metadata-text a {
	color: var(--mint);
}
.prompt-version {
	font-size: 8px;
	letter-spacing: 1.4px;
}
.usage-line {
	font-size: 10px;
	color: var(--muted);
	padding-top: 13px;
	border-top: 1px solid var(--line);
}
.results-panel {
	width: 710px;
}
.results-heading {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 20px;
}
.results-heading h2 {
	font-size: 44px;
}
.results-heading .panel-intro {
	margin-bottom: 15px;
}
.rank-badge {
	width: 133px;
	height: 133px;
	border: 1px solid var(--gold);
	border-radius: 50%;
	display: flex;
	align-items: center;
	justify-content: center;
	flex-direction: column;
	color: var(--gold);
	flex-shrink: 0;
	transform: rotate(7deg);
	position: relative;
}
.rank-badge:after {
	content: "";
	inset: 6px;
	position: absolute;
	border: 1px solid #e9c58955;
	border-radius: 50%;
}
.rank-badge small {
	font-size: 7px;
	letter-spacing: 1.4px;
}
.rank-badge strong {
	font-size: 62px;
	line-height: 1.1;
	font-weight: 500;
}
.rank-badge > span {
	font-size: 6px;
	letter-spacing: 1px;
	max-width: 95px;
	text-align: center;
}
.result-score {
	display: flex;
	align-items: baseline;
	gap: 20px;
	margin: 16px 0 25px;
	border-top: 1px solid var(--line);
	border-bottom: 1px solid var(--line);
	padding: 18px 0;
}
.result-score > span {
	font-size: 8px;
	letter-spacing: 1.4px;
	color: var(--mint);
}
.result-score > strong {
	font-size: 43px;
	font-weight: 400;
	letter-spacing: 1px;
	margin-left: auto;
}
.result-score > b {
	font-size: 7px;
	letter-spacing: 1px;
	background: var(--gold);
	color: var(--ink);
	padding: 5px 7px;
}
.result-stats {
	display: grid;
	grid-template-columns: repeat(4, 1fr);
	gap: 15px;
}
.result-stats > div {
	display: flex;
	flex-direction: column;
	border-right: 1px solid var(--line);
	gap: 9px;
}
.result-stats > div:last-child {
	border: 0;
}
.result-stats b {
	font-size: 24px;
	font-weight: 500;
	color: var(--paper);
}
.result-stats > div:last-child b {
	font-size: 15px;
	line-height: 28px;
}
.result-stats span {
	font-size: 7px;
	letter-spacing: 1px;
	color: var(--muted);
}
.result-note {
	font-size: 12px;
	color: var(--muted);
	margin: 26px 0;
}
.results-actions {
	display: flex;
	gap: 10px;
}
.results-actions .panel-button {
	flex: 1;
}
.recovery-tip {
	font-size: 10px;
	color: var(--muted);
	line-height: 1.7;
	margin: 25px 0 0;
}
.sf-ui.reduce-motion * {
	transition: none !important;
	animation: none !important;
}
