          if (this.state === 'play' && input.source === 'keyboard' && !kit.menu.isOpen) this.openPause();
        });

        kit.onPause((paused) => {
          if (paused && this.state === 'play') this.openPause();
          this.updateAudio();
        });

        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) return;
          if (this.state === 'play' || this.state === 'craft') this.openPause();
          this.saveGame();
        });
        addEventListener('pagehide', () => this.saveGame());
      }

      bindMenus() {
        const $ = (id) => document.getElementById(id);
        this.el = {
          title: $('title'), titleMain: $('title-main'), titleNew: $('title-new'),
          btnContinue: $('btn-continue'), btnPlay: $('btn-play'), newWarning: $('new-warning'),
          titleControls: $('title-controls'),
          pause: $('pause'), taskList: $('task-list'), tasksCount: $('tasks-count'), pauseNote: $('pause-note'),
          btnHelp: $('btn-help'), btnDebug: $('btn-debug'), btnSound: $('btn-sound'),
          craft: $('craft'), recipeList: $('recipe-list'), benchNote: $('bench-note'), invList: $('inv-list'),
          craftMsg: $('craft-msg'),
        };
        const on = (id, fn) => $(id).addEventListener('click', fn);

        on('btn-continue', () => this.beginPlay());
        on('btn-play', () => this.startNew(0));
        on('btn-new', () => this.showNewWorld(true));
        on('btn-new-back', () => this.showNewWorld(false));
        on('btn-classic', () => this.startNew(0));
        on('btn-random', () => this.startNew(1 + Math.floor(Math.random() * 0x7ffffffe)));
        on('btn-title-settings', () => this.kit.menu.open());

        on('btn-resume', () => this.resume());
        on('btn-craft', () => this.openCraft());
        on('btn-help', () => {
          this.setHelp(!this.options.help);
          this.refreshPause();
        });
        on('btn-debug', () => {
          this.toggleDebug();
          this.refreshPause();
        });
        on('btn-clear', () => {
          this.bodies.clear();
          this.charges.clear();
          this.el.pauseNote.textContent = 'Crates and debris cleared.';
        });
        on('btn-reset', () => {
          this.respawn();
          this.flash('Player reset.');
          this.resume();
        });
        on('btn-sound', () => {
          this.options.sound = !this.options.sound;
          this.sfx.setEnabled(this.options.sound);
          this.saveOptions();
          this.refreshPause();
        });
        on('btn-settings', () => this.kit.menu.open());
        on('btn-quit', () => {
          this.saveGame();
          this.showTitle();
        });

        this.recipeButtons = RECIPE_LIST.map((recipe) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'recipe';
          const out = recipe.outputs[0];
          button.innerHTML = `
            <span class="r-name">${recipe.name} ×${out.amount}</span>
            <span class="r-tag">${recipe.bench ? 'Workbench' : 'Anywhere'}</span>
            <span class="r-cost">${recipe.inputs.map((i) => `${i.amount} ${nameOf(i.block)}`).join(' + ')}</span>`;
          button.addEventListener('click', () => this.craftRecipe(recipe));
          this.el.recipeList.append(button);
          return { recipe, button };
        });
        on('btn-craft-close', () => this.closeCraft());
      }

      // ---------------------------------------------------------------- save

      readSave() {
        const s = readJSON(SAVE_KEY);
        if (!s || s.v !== 1 || !Number.isInteger(s.seed) || s.seed < 0) return null;
        return s;
      }

      loadSaveState(save) {
        this.inventory.load(save.inv, save.slot);
        this.stats = { ...freshStats(), ...(save.stats && typeof save.stats === 'object' ? save.stats : {}) };
        if (!this.stats.crafted || typeof this.stats.crafted !== 'object') this.stats.crafted = {};
        this.tasksDone = TASKS.map((t) => !!t.done(this.stats));
        const p = save.p;
        if (Array.isArray(p) && p.length === 3 && p.every(Number.isFinite)) {
          this.player.setPosition(
            clamp(p[0], X0 + 0.5, X0 + WORLD - 0.5),
            clamp(p[1], 1, 60),
            clamp(p[2], X0 + 0.5, X0 + WORLD - 0.5),
          );
        } else {
          this.respawn();
        }
        this.player.yaw = Number.isFinite(save.yaw) ? save.yaw : 0;
        this.player.pitch = Number.isFinite(save.pitch) ? clamp(save.pitch, -1.5, 1.5) : 0;
        this.started = true;
      }

      saveGame() {
        if (!this.started) return false;
        const p = this.player.curr;
        const data = {
          v: 1,
          seed: this.world.seed,
          edits: this.world.collectEdits(),
          inv: this.inventory.toJSON(),
          slot: this.inventory.selectedSlot,
          p: [Math.round(p.x * 100) / 100, Math.round(p.y * 100) / 100, Math.round(p.z * 100) / 100],
          yaw: this.player.yaw,
          pitch: this.player.pitch,
          stats: this.stats,
          savedAt: Date.now(),
        };
        if (!writeJSON(SAVE_KEY, data)) return false;
        this.save = data;
        return true;
      }

      saveOptions() { writeJSON(OPTIONS_KEY, this.options); }

      // -------------------------------------------------------------- screens

      setScreen(which) {
        for (const key of ['title', 'pause', 'craft']) this.el[key].hidden = key !== which;
        const menuOpen = !!which;
        this.kit.touch?.suspend(menuOpen, 'game');
        if (menuOpen) this.input.unlockPointer();
        this.hud.show(this.state !== 'title');
        this.selection.visible = false;
        if (which) this.nav.open(this.el[which]);
        else this.nav.close();
        this.input.settle();
        this.updateAudio();
        this.hud.updateCapture();
      }

      updateAudio() {
        this.sfx.setActive(!this.kit.paused && (this.state === 'play' || this.state === 'craft'));
      }

      updateTitleControls() {
        if (!this.el) return;
        this.el.titleControls.textContent = TITLE_CONTROLS[this.input.source] || TITLE_CONTROLS.keyboard;
      }

      showTitle() {
        this.state = 'title';
        // A live or saved session continues; "Play" only starts a first world.
        const hasSave = this.started;
        this.el.btnContinue.hidden = !hasSave;
        this.el.btnPlay.hidden = hasSave;
        this.el.titleMain.hidden = false;
        this.el.titleNew.hidden = true;
        this.el.newWarning.textContent = hasSave ? 'Starting a new world replaces your saved one.' : '';
        this.updateTitleControls();
        this.setScreen('title');
      }

      showNewWorld(on) {
        this.el.titleMain.hidden = on;
        this.el.titleNew.hidden = !on;
        this.nav.open(this.el.title);
      }

      startNew(seed) {
        removeKey(SAVE_KEY);
        this.save = null;
        if (seed !== this.world.seed || this.world.edited) this.world.generate(seed);
        this.bodies.clear();
        this.particles.clear();
        this.charges.clear();
        this.inventory.reset();
        this.stats = freshStats();
        this.tasksDone = TASKS.map(() => false);
        this.player.yaw = 0;
        this.player.pitch = 0;
        this.respawn();
        this.started = true;
        this.flash(seed ? `A random world (seed ${seed}).` : 'The classic valley.');
        this.beginPlay();
        this.saveGame();
      }

      beginPlay() {
        this.state = 'play';
        this.setScreen(null);
        this.autosave = 30;
        this.mouseGuard = false;
        if (this.input.source === 'keyboard') this.input.lockPointer();
        if (this.input.source === 'touch' && !this.toldTouch) {
          this.toldTouch = true;
          this.flash('Tap II for lab tasks, help and settings.');
        }
      }

      openPause() {
        if (this.state === 'title') return;
        this.state = 'pause';
        this.pauseOpenedAt = this.time;
        this.el.pauseNote.textContent = '';
        this.refreshPause();
        this.setScreen('pause');
        this.el.pauseNote.textContent = this.saveGame()
          ? 'Your world is saved on this device.'
          : 'Saving is unavailable here (storage is blocked); Continue still works until you close the page.';
      }

      refreshPause() {
        this.el.btnHelp.textContent = `Controls help: ${this.options.help ? 'shown' : 'hidden'}`;
        this.el.btnDebug.textContent = `Physics debug: ${this.debug.enabled ? 'on' : 'off'}`;
        this.el.btnSound.textContent = `Sound: ${this.options.sound ? 'on' : 'off'}`;
        const list = this.el.taskList;
        list.replaceChildren();
        const current = this.tasksDone.indexOf(false);
        TASKS.forEach((task, i) => {
          const li = document.createElement('li');
          li.textContent = task.text;
          if (this.tasksDone[i]) li.className = 'done';
          else if (i === current) li.className = 'current';
          list.append(li);
        });
        this.el.tasksCount.textContent = `${this.tasksDone.filter(Boolean).length}/${TASKS.length}`;
      }

      resume() {
        this.state = 'play';
        this.setScreen(null);
        if (this.input.source === 'keyboard') this.input.lockPointer();
      }

      openCraft() {
        if (this.state !== 'play' && this.state !== 'pause') return;
        this.state = 'craft';
        this.el.craftMsg.textContent = '';
        this.refreshCraft();
        this.setScreen('craft');
      }

      closeCraft() {
        this.state = 'play';
        this.setScreen(null);
        if (this.input.source === 'keyboard') this.input.lockPointer();
      }

      nearWorkbench() {
        const p = this.player.curr;
        const bx = Math.floor(p.x);
        const by = Math.floor(p.y);
        const bz = Math.floor(p.z);
        for (let y = by - BENCH_RANGE; y <= by + BENCH_RANGE; y += 1) {
          for (let z = bz - BENCH_RANGE; z <= bz + BENCH_RANGE; z += 1) {
            for (let x = bx - BENCH_RANGE; x <= bx + BENCH_RANGE; x += 1) {
              if (this.world.getBlock(x, y, z) === BlockId.Workbench) return true;
            }
          }
        }
        return false;
      }

      refreshCraft() {
        const near = this.nearWorkbench();
        this.el.benchNote.textContent = near
          ? 'A Workbench is in reach: every recipe is open.'
          : `Stand within ${BENCH_RANGE} blocks of a placed Workbench for Stone Bricks, Glass and Blast Charges.`;
        for (const { recipe, button } of this.recipeButtons) {
          const ok = !this.crafting.missing(recipe) && (!recipe.bench || near);
          button.classList.toggle('missing', !ok);
        }
        const chips = [];
        for (const id of [...HOTBAR_BLOCKS, ItemId.Coal]) {
          const n = this.inventory.count(id);
          chips.push(`<span><i style="background:${cssColor(colorOf(id))}"></i>${nameOf(id)} ${n}</span>`);
        }
        this.el.invList.innerHTML = chips.join('');
      }

      craftRecipe(recipe) {
        if (recipe.bench && !this.nearWorkbench()) {
          this.flash(`Stand within ${BENCH_RANGE} blocks of a placed Workbench.`);
          this.sfx.deny();
          return false;
        }
        const missing = this.crafting.missing(recipe);
        if (missing) {
          this.flash(`Need ${missing.amount} ${nameOf(missing.block)}.`);
          this.sfx.deny();
          return false;
        }
        this.crafting.craft(recipe);
        this.stats.crafted[recipe.id] = (this.stats.crafted[recipe.id] || 0) + 1;
        const out = recipe.outputs[0];
        this.flash(`Crafted ${out.amount} ${nameOf(out.block)}.`);
        this.sfx.craft();
        this.input.rumble(0.2, 60);
        if (this.state === 'craft') this.refreshCraft();
        return true;
      }

      flash(message) {
        this.hud.flash(message);
        if (this.state === 'craft') this.el.craftMsg.textContent = message;
      }

      setHelp(on) {
        this.options.help = on;
        this.hud.setHelp(on);
        this.saveOptions();
      }

      toggleDebug() {
        const on = this.debug.toggle();
        this.flash(on ? 'Physics debug enabled.' : 'Physics debug disabled.');
        return on;
      }

      checkTasks() {
        if (this.state === 'title') return;
        let newest = null;
        for (let i = 0; i < TASKS.length; i += 1) {
          if (!this.tasksDone[i] && TASKS[i].done(this.stats)) {
            this.tasksDone[i] = true;
            newest = TASKS[i];
          }
        }
        if (!newest) return;
        const all = this.tasksDone.every(Boolean);
        this.flash(all ? 'All lab tasks complete. The lab is yours!' : `Task complete: ${newest.text}.`);
        this.sfx.task();
        this.input.rumble(0.35, 140);
      }

      // ----------------------------------------------------------- the frame

      frame(dt) {
        this.time += dt;
        switch (this.state) {
          case 'title':
            this.nav.update(dt);
            if (this.input.pressed('back') && !this.el.titleNew.hidden) this.showNewWorld(false);
            this.updateTitleCamera(dt);
            break;
          case 'play':
            this.updatePlay(dt);
            break;
          case 'craft':
            this.nav.update(dt);
            if (this.input.pressed('craft') || this.input.pressed('back') || this.input.pressed('pause')) this.closeCraft();
            this.player.move.x = this.player.move.y = 0;
            this.player.move.sprint = false;
            this.simulate(dt);
            break;
          case 'pause':
            this.nav.update(dt);
            if ((this.input.pressed('pause') || this.input.pressed('back')) && this.time - this.pauseOpenedAt > 0.25) this.resume();
            break;
          default:
            break;
        }
        this.hud.update(dt);
        this.kit.renderer.render(this.scene, this.camera);
      }

      updateTitleCamera(dt) {
        this.titleAngle += dt * 0.06;
        const r = 46;
        this.camera.position.set(WORLD_CENTER + Math.cos(this.titleAngle) * r, 26, WORLD_CENTER + Math.sin(this.titleAngle) * r);
        this.camera.lookAt(WORLD_CENTER, 6, WORLD_CENTER);
        this.placeSun(WORLD_CENTER, WORLD_CENTER);
        this.setFov(this.baseFov);
      }

      setFov(fov) {
        if (Math.abs(this.camera.fov - fov) < 0.01) return;
        this.camera.fov = fov;
        this.camera.updateProjectionMatrix();
      }

      updatePlay(dt) {
        const { input, player } = this;
        if (input.pressed('pause')) {
          this.openPause();
          return;
        }
        if (input.pressed('craft')) {
          this.openCraft();
          return;
        }

        const look = input.look('look');
        player.look(look.x, look.y);

        const mv = input.vector('move');
        const touchSprint = input.source === 'touch' && Math.hypot(mv.x, mv.y) > 0.92;
        player.move.x = mv.x;
        player.move.y = mv.y;
        player.move.sprint = input.down('sprint') || touchSprint;
        if (input.pressed('jump') || (input.down('jump') && player.grounded)) player.queueJump();

        this.updateTarget();
        this.processOneShotInput(dt);
        this.simulate(dt);

        if (player.grounded) {
          const feet = player.curr.y - 0.9;
          if (feet > this.stats.height) this.stats.height = Math.floor(feet * 10) / 10;
        }
        this.autosave -= dt;
        if (this.autosave <= 0) {
          this.autosave = 30;
          this.saveGame();
        }
      }

      processOneShotInput(dt) {
        const { input } = this;
        for (let index = 0; index < HOTBAR_BLOCKS.length; index += 1) {
          if (input.pressed(`slot${index + 1}`)) this.selectSlot(index);
        }
        if (input.pressed('slotNext')) this.cycleSlot(1);
        if (input.pressed('slotPrev')) this.cycleSlot(-1);
        if (input.source !== 'touch') {
          this.wheel += input.zoom();
          while (this.wheel <= -1) { this.cycleSlot(1); this.wheel += 1; }
          while (this.wheel >= 1) { this.cycleSlot(-1); this.wheel -= 1; }
        }

        if (input.pressed('quickPlanks')) this.craftRecipe(RECIPES.planks);
        if (input.pressed('quickBench')) this.craftRecipe(RECIPES.workbench);

        if (input.pressed('crate')) {
          const forward = this.forward();
          const c = this.eye();
          this.bodies.spawnCrate(c.x + forward.x * 3, c.y + forward.y * 3 + 1.5, c.z + forward.z * 3);
          this.stats.crates += 1;
          this.flash('Spawned a dynamic Rapier crate.');
          this.sfx.crate();
          input.rumble(0.2, 50);
        }

        if (input.pressed('stack')) {
          const forward = this.forward();
          const c = this.eye();
          const x = c.x + forward.x * 4;
          const z = c.z + forward.z * 4;
          const y = Math.max(c.y + forward.y * 4, 12);
          for (let i = 0; i < 7; i += 1) this.bodies.spawnCrate(x, y + i * 0.86, z);
          this.stats.stacks += 1;
          this.flash('Spawned a rigid-body stack.');
          this.sfx.crate();
          input.rumble(0.3, 80);
        }

        if (input.pressed('debug')) this.toggleDebug();
        if (input.pressed('help')) this.setHelp(!this.options.help);

        if (input.pressed('reset')) {
          this.respawn();
          this.flash('Player reset.');
        }

        // Mouse buttons count only while the mouse is captured (the capturing click is not a dig).
        if (this.mouseGuard && !input.down('mineClick') && !input.down('placeClick')) this.mouseGuard = false;
        const mouseOk = input.pointerLocked && !this.mouseGuard;
        const minePressed = input.pressed('mine') || (mouseOk && input.pressed('mineClick'));
        const mineHeld = input.down('mine') || (mouseOk && input.down('mineClick'));
        const placePressed = input.pressed('place') || (mouseOk && input.pressed('placeClick'));
        const placeHeld = input.down('place') || (mouseOk && input.down('placeClick'));

        // Holding the button keeps working, like creative mode.
        if (minePressed) {
          this.breakTargetBlock();
          this.mineRepeat = 0.35;
        } else if (mineHeld) {
          this.mineRepeat -= dt;
          if (this.mineRepeat <= 0) {
            this.mineRepeat = 0.22;
            this.breakTargetBlock();
          }
        }
        if (placePressed) {
          this.placeTargetBlock();
          this.placeRepeat = 0.35;
        } else if (placeHeld) {
          this.placeRepeat -= dt;
          if (this.placeRepeat <= 0) {
            this.placeRepeat = 0.22;
            this.placeTargetBlock();
          }
        }
      }

      selectSlot(index) {
        if (index === this.inventory.selectedSlot) return;
        this.inventory.selectSlot(index);
        this.sfx.tone(520 + index * 40, 0.04, 'sine', 0.06);
      }

      cycleSlot(d) {
        const n = HOTBAR_BLOCKS.length;
        this.selectSlot((this.inventory.selectedSlot + d + n) % n);
      }

      forward() {
        const { yaw, pitch } = this.player;
        const cp = Math.cos(pitch);
        this._forward ??= { x: 0, y: 0, z: 0 };
        this._forward.x = -Math.sin(yaw) * cp;
        this._forward.y = Math.sin(pitch);
        this._forward.z = -Math.cos(yaw) * cp;
        return this._forward;
      }

      /** The player's eye, without camera shake or landing dip (the camera can still be on the title orbit). */
      eye() {
        const v = this.player.view;
        this._eye ??= { x: 0, y: 0, z: 0 };
        this._eye.x = v.x;
        this._eye.y = v.y + 0.58;
        this._eye.z = v.z;
        return this._eye;
      }

      updateTarget() {
        const f = this.forward();
        const c = this.eye();
        const t = this.target;
        if (this.world.raycast(c.x, c.y, c.z, f.x, f.y, f.z, 6, t)) {
          this.selection.position.set(t.x + 0.5, t.y + 0.5, t.z + 0.5);
          this.selection.visible = true;
        } else {
          this.selection.visible = false;
        }
      }

      breakTargetBlock() {
        const t = this.target;
        if (!t.hit) return;
        const block = this.world.getBlock(t.x, t.y, t.z);
        if (block === BlockId.Air) return;
        if (block === BlockId.Bedrock) {
          this.flash('Bedrock is the lab floor; it cannot be mined.');
          this.sfx.deny();
          return;
        }
        if (!this.world.setBlock(t.x, t.y, t.z, BlockId.Air)) return;

        const defused = block === BlockId.Charge && this.charges.disarm(t.x, t.y, t.z);
        const drop = dropFor(block);
        if (drop != null) this.inventory.add(drop, 1);
        this.stats.mined += 1;
        if (block === BlockId.Wood) this.stats.wood += 1;
        if (block === BlockId.CoalOre) this.stats.coal += 1;
        if (block === BlockId.Sand) this.stats.sand += 1;

        if (defused) this.flash('Charge defused and collected.');
        else if (drop === ItemId.Coal) this.flash(`Collected Coal (${this.inventory.count(ItemId.Coal)}).`);
        else if (drop == null) this.flash(`Cleared ${BLOCKS[block].name}.`);
        else this.flash(`Collected ${nameOf(drop)}.`);

        const k = block * 3;
        this.particles.emit(t.x + 0.5, t.y + 0.5, t.z + 0.5, LIN[k], LIN[k + 1], LIN[k + 2], this.kit.detail(10, 4));
        this.sfx.dig(block);
        this.input.rumble(0.25, 45);
      }

      placeTargetBlock() {
        const t = this.target;
        if (!t.hit) return;
        const { px, py, pz } = t;
        const block = this.inventory.selectedBlock;

        if (!this.world.inBounds(px, py, pz)) {
          this.flash('That spot is outside the lab.');
          return;
        }
        if (this.world.getBlock(px, py, pz) !== BlockId.Air) return;
        if (this.player.overlapsBlock(px, py, pz)) {
          this.flash('Cannot place a block inside the player.');
          return;
        }
        if (this.bodyInCell(px, py, pz)) {
          this.flash('A crate is in the way.');
          return;
        }
        if (!this.inventory.remove(block, 1)) {
          this.flash(`No ${BLOCKS[block].name} available.`);
          this.sfx.deny();
          return;
        }
        if (!this.world.setBlock(px, py, pz, block)) {
          this.inventory.add(block, 1);
          return;
        }

        this.stats.placed += 1;
        if (block === BlockId.Workbench) this.stats.benchPlaced += 1;
        if (block === BlockId.Charge) {
          this.charges.arm(px, py, pz, 3);
          this.flash('Blast charge armed: 3 seconds!');
        }
        this.sfx.place(block);
        this.input.rumble(0.15, 35);
      }

      bodyInCell(x, y, z) {
        for (const e of this.bodies.list) {
          const h = e.size * 0.5;
          if (e.x + h > x && e.x - h < x + 1 && e.y + h > y && e.y - h < y + 1 && e.z + h > z && e.z - h < z + 1) return true;
        }
        return false;
      }

      respawn() {
        let top = -1;
        for (const [x, z] of [[-1, -1], [0, -1], [-1, 0], [0, 0]]) top = Math.max(top, this.world.topY(x, z));
        this.player.setPosition(0, Math.max(14, top + 2.1), 0);
      }

      // ------------------------------------------------------- simulation

      simulate(dt) {
        const { player } = this;
        const alpha = this.step.advance(dt, () => {
          // Step first so colliders rebuilt this frame are in the broad phase before the player moves.
          this.physicsWorld.step();
          player.fixedUpdate(this.step.dt);
        });
        if (player.fell) {
          this.respawn();
          this.flash('Fell out of the lab: back to the start.');
        }

        this.bodies.sync(dt);
        this.collectDebris();
        const expired = this.charges.update(dt, () => this.sfx.tick());
        for (let i = 0; i < expired.length; i += 3) this.detonate(expired[i], expired[i + 1], expired[i + 2]);
        this.particles.update(dt);
        this.debug.update(dt, this.physicsWorld, this.debugFilter ??= (collider) => {
          const chunk = this.world.colliderChunk.get(collider.handle);
          return !chunk || chunk === this.world.chunkAt(Math.floor(player.curr.x), Math.floor(player.curr.z));
        });

        if (player.landed > 0) {
          this.sfx.land(player.landed);
          this.dip = Math.max(this.dip, player.landed * 0.16);
          this.input.rumble(0.3 * player.landed, 80);
          player.landed = 0;
        }
        this.syncCamera(dt, alpha);
        this.placeSun(player.curr.x, player.curr.z);
      }

      syncCamera(dt, alpha) {
        const { player, camera } = this;
        player.view.lerpVectors(player.prev, player.curr, alpha);
        this.dip *= Math.exp(-10 * dt);
        this.shake *= Math.exp(-5 * dt);
        const s = this.shake > 0.01 ? this.shake * 0.22 : 0;
        camera.position.set(
          player.view.x + (Math.random() - 0.5) * s,
          player.view.y + 0.58 - this.dip + (Math.random() - 0.5) * s,
          player.view.z + (Math.random() - 0.5) * s,
        );
        camera.rotation.set(player.pitch, player.yaw, 0);
        const moving = Math.abs(player.move.x) + Math.abs(player.move.y) > 0.2;
        const targetFov = player.move.sprint && moving ? this.baseFov + 6 : this.baseFov;
        this.setFov(camera.fov + (targetFov - camera.fov) * (1 - Math.exp(-8 * dt)));
      }

      collectDebris() {
        const p = this.player.curr;
        const list = this.bodies.list;
        for (let i = list.length - 1; i >= 0; i -= 1) {
          const e = list[i];
          if (e.kind !== 'debris' || e.age < 0.5) continue;
          const dx = e.x - p.x;
          const dy = e.y - (p.y - 0.2);
          const dz = e.z - p.z;
          if (dx * dx + dy * dy + dz * dz > 1.6 * 1.6) continue;
          this.inventory.add(e.drop, 1);
          this.stats.debris += 1;
          if (e.drop === BlockId.Sand) this.stats.sand += 1;
          this.bodies.removeAt(i);
          this.flash(`+1 ${nameOf(e.drop)}`);
          this.sfx.pickup();
        }
      }

      detonate(cx, cy, cz) {
        const world = this.world;
        if (world.getBlock(cx, cy, cz) !== BlockId.Charge) return;
        world.edit(cx, cy, cz, BlockId.Air);
        const removed = this.removed;
        removed.length = 0;
        const R2 = 3 * 3;
        for (let dy = -3; dy <= 3; dy += 1) {
          for (let dz = -3; dz <= 3; dz += 1) {
            for (let dx = -3; dx <= 3; dx += 1) {
              if (dx * dx + dy * dy + dz * dz > R2) continue;
              const x = cx + dx;
              const y = cy + dy;
              const z = cz + dz;
              const b = world.getBlock(x, y, z);
              if (b === BlockId.Air || b === BlockId.Bedrock) continue;
              if (b === BlockId.Charge) {
                this.charges.arm(x, y, z, 0.18 + Math.random() * 0.12); // chain reaction
                continue;
              }
              world.edit(x, y, z, BlockId.Air);
              removed.push(x, y, z, b);
            }
          }
        }
        world.flush();

        const ox = cx + 0.5;
        const oy = cy + 0.5;
        const oz = cz + 0.5;
        const n = removed.length / 4;
        const debris = Math.min(n, this.kit.detail(16, 6));
        for (let i = 0; i < n && i < Math.max(debris, 12); i += 1) {
          // Partial shuffle: a random pick of the removed blocks becomes debris.
          const j = i + Math.floor(Math.random() * (n - i));
          for (let k = 0; k < 4; k += 1) {
            const tmp = removed[i * 4 + k];
            removed[i * 4 + k] = removed[j * 4 + k];
            removed[j * 4 + k] = tmp;
          }
          const x = removed[i * 4] + 0.5;
          const y = removed[i * 4 + 1] + 0.5;
          const z = removed[i * 4 + 2] + 0.5;
          const b = removed[i * 4 + 3];
          const c = b * 3;
          this.particles.emit(x, y, z, LIN[c], LIN[c + 1], LIN[c + 2], 3, 4, 0.18, 3);
          const drop = dropFor(b);
          if (i >= debris || drop == null) continue;
          const dx = x - ox;
          const dy = y - oy;
          const dz = z - oz;
          const len = Math.hypot(dx, dy, dz) || 1;
          const speed = 4.5 + Math.random() * 3.5;
          this.bodies.spawn({
            x, y, z, size: 0.42, r: LIN[c], g: LIN[c + 1], b: LIN[c + 2], kind: 'debris', drop,
            vx: (dx / len) * speed, vy: (dy / len) * speed + 3.5, vz: (dz / len) * speed, spin: 8,
          });
        }
        this.particles.emit(ox, oy, oz, 1, 0.55, 0.15, this.kit.detail(14, 6), 6, 0.3, 3, 1.2);
        this.particles.emit(ox, oy, oz, 0.25, 0.25, 0.26, this.kit.detail(10, 4), 4, 0.36, 4, 1.4);

        // Shove nearby crates and debris (but not the pieces this blast just threw).
        for (const e of this.bodies.list) {
          if (e.age === 0) continue;
          const dx = e.x - ox;
          const dy = e.y - oy;
          const dz = e.z - oz;
          const d = Math.hypot(dx, dy, dz);
          if (d > 7) continue;
          const k = 1 - d / 7;
          const m = e.body.mass();
          const inv = 1 / (d || 1);
          e.body.applyImpulse({ x: dx * inv * 9 * k * m, y: (dy * inv * 9 * k + 4 * k) * m, z: dz * inv * 9 * k * m }, true);
        }

        const p = this.player.curr;
        const px = p.x - ox;
        const pz = p.z - oz;
        const d = Math.hypot(px, p.y - oy, pz);
        if (d < 6) {
          const k = 1 - d / 6;
          const flat = Math.hypot(px, pz) || 1;
          this.player.push((px / flat) * 11 * k, 6 * k + 2, (pz / flat) * 11 * k);
        }
        const near = clamp(1 - d / 40, 0.3, 1);
        this.shake = Math.min(1.2, this.shake + Math.max(0, 1 - d / 20));
        this.sfx.boom(near);
        this.input.rumble(0.9 * near, 380);
        this.stats.blasts += 1;
      }
    }

    // -------------------------------------------------------------------------
    // Boot
    // -------------------------------------------------------------------------

    const SLOT_ACTIONS = {};
    for (let i = 1; i <= HOTBAR_BLOCKS.length; i += 1) SLOT_ACTIONS[`slot${i}`] = { keys: [`Digit${i}`, `Numpad${i}`] };

    const kit = await boot({
      title: 'VoxelCraft Engine Lab',
      physics: true,
      accent: '#6b9f48',
      background: '#111820',
      input: {
        move: { type: 'vector', keys: 'wasd+arrows', gamepad: 'leftStick+dpad', touch: 'stick' },
        look: { type: 'look', mouse: 'drag', gamepad: 'rightStick', touch: 'drag' },
        jump: { keys: ['Space'], gamepad: ['A'], touch: 'Jump' },
        mine: { keys: ['KeyJ'], gamepad: ['RT'], touch: 'Mine' },
        place: { keys: ['KeyK'], gamepad: ['LT'], touch: 'Place' },
        crate: { keys: ['KeyG'], gamepad: ['X'], touch: 'Crate' },
        stack: { keys: ['KeyT'], gamepad: ['RS'], touch: { label: 'Stack', slot: 'top' } },
        craft: { keys: ['KeyE'], gamepad: ['Y'], touch: { label: 'Craft', slot: 'top' } },
        pause: { keys: ['Escape', 'KeyP'], gamepad: ['Start'], touch: { label: 'II', slot: 'top' } },
        sprint: { keys: ['ShiftLeft', 'ShiftRight'], gamepad: ['LS'] },
        mineClick: { mouse: [0] },
        placeClick: { mouse: [2] },
        slotPrev: { gamepad: ['LB'] },
        slotNext: { gamepad: ['RB'] },
        ...SLOT_ACTIONS,
        quickPlanks: { keys: ['KeyC'] },
        quickBench: { keys: ['KeyV'] },
        debug: { keys: ['F3'] },
        reset: { keys: ['KeyR'] },
        help: { keys: ['KeyH'], gamepad: ['Back'] },
        confirm: { keys: ['Enter', 'NumpadEnter'], gamepad: ['A'] },
        back: { keys: ['Backspace'], gamepad: ['B'] },
      },
    });

    kit.loading.progress(0.8, 'Generating voxel world…');
    const game = new Game(kit);
    window.voxelGame = game;
    kit.start((dt) => game.frame(dt));
  </script>
</body>
</html>
