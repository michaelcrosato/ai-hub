function command(a){if(!playerReady())return;sound.play('click');target=null;inspected=null;menu=null;const u=battle.active;if(a==='move'){if(u.moved)return;mode='move';}if(a==='attack'){if(u.acted)return;mode='attack';skill='strike';if(!battle.targetTiles('strike').length)toast('No enemy is in weapon range. Move closer first.');}if(a==='arts'||a==='items'){if(u.acted)return;menu=a;mode=a;}if(a==='wait')mode='wait';paint();}

function processEvents(){for(const e of battle.drainEvents()){if(e.type==='move'){if(settings.motion)diorama.moveUnit(e.id,e.from,e.path,settings.speed==='fast'?.4:1);sound.play('move');}if(e.type==='impact'){if(settings.motion)diorama.impact(e);sound.play(e.skill==='toll'?'toll':['heal','revive','buff','ether'].includes(SKILLS[e.skill].kind)?'heal':'hit');}if(e.type==='rise'){if(settings.motion)diorama.impact({skill:'grip',x:e.x,z:e.z,area:0,rise:true});sound.play('rise');kit?.input.rumble(.35,160);}if(e.type==='down'){sound.play('down');const v=battle.units.find(q=>q.id===e.id);kit?.input.rumble(v?.team==='player'?.8:.45,v?.team==='player'?260:150);}if(e.type==='number'){const n=document.createElement('div');n.className='damage-text '+(e.good?'good ':'')+(e.text.length>6?'long':'');n.textContent=e.text;const m=diorama.models.get(e.id);if(m){const p=diorama.camera.project([m.root.p[0],m.root.p[1]+1.25,m.root.p[2]]),rect=$('viewport').getBoundingClientRect();n.style.left=(p.x+rect.left)+'px';n.style.top=(p.y+rect.top)+'px';$('app').appendChild(n);setTimeout(()=>n.remove(),1400);}}if(e.type==='hit'){diorama.hitUntil.set(e.id,diorama.time+.30);const v=battle.units.find(q=>q.id===e.id);kit?.input.rumble(v?.team==='enemy'?.25:.55,v?.team==='enemy'?70:140);}if(e.type==='banner')banner(e.text);if(e.type==='turn'){$('announcer').textContent=battle.active?.name+"'s turn.";}}}

 target=next;const at=battle.unitAt(t.x,t.z,true);inspected=!next&&at?at.id:null;paint();}
function startCursor(){const u=battle.active;if(!u||!playerReady())return;cursor={x:u.x,z:u.z};if(['attack','skill'].includes(mode)&&!u.acted){const ts=battle.targetTiles(mode==='attack'?'strike':skill);if(ts.length){ts.sort((a,b)=>distance(a,u)-distance(b,u));cursor={x:ts[0].x,z:ts[0].z};}}hoverCursor();}
function undoMove(){if(!playerReady()||!battle.undoMove())return;processEvents();mode='move';target=null;cursor=null;paint();save();}
function modalBack(){if(!modal||['dialogue','result'].includes(modal))return;if(['confirm-new','confirm-retry'].includes(modal))openModal('settings');else closeModal();}
// Back steps out one layer at a time: the target, the menu, the inspected unit, then the command.
function cancelStep(){if(target){target=null;paint();return true;}if(menu){menu=null;mode='idle';paint();return true;}if(inspected){inspected=null;paint();return true;}if(playerReady()&&mode!=='idle'){mode='idle';cursor=null;paint();return true;}return false;}
function confirmAction(scope){
 if(scope){const el=document.activeElement;if(el&&el!==scope&&scope.contains(el)&&!el.disabled){if(el.tagName==='SELECT')cycleSelect(el,1);else el.click();return;}
  if(scope===$('selection')&&mode==='wait'&&playerReady()){face(battle.active.dir);return;}
  const primary=scope.querySelector('.primary:not(:disabled)');if(primary&&(scope===$('modal-root')||screen!=='battle')){primary.click();return;}
  const d=defaultFocus(scope);if(d){navActive=true;d.focus({preventScroll:true});}return;}
 if(!playerReady())return;if(target){confirmTarget();return;}if(cursor){tileClick(battle.tile(cursor.x,cursor.z));return;}startCursor();}
function handleInput(dt){const input=kit.input,c=diorama.camera,P=input.pointer;
 // The camera: drag or right stick turns and tilts, wheel / pinch / bumpers zoom, quarter turns glide.
 if(P.justDown){dragStart={x:P.x,y:P.y};dragMoved=false;}
 if(P.down&&dragStart&&!dragMoved&&Math.hypot(P.x-dragStart.x,P.y-dragStart.y)>7)dragMoved=true;
 const z=input.zoom();
 if(z&&!modal){if(P.down&&P.type==='touch'){dragMoved=true;c.zoom=c.goalZoom=Math.min(2.3,Math.max(.65,c.zoom*Math.exp(z*.25)));}else c.goalZoom=Math.min(2.3,Math.max(.65,c.goalZoom+z*.1));}
 const lk=input.look('look');
 if((lk.x||lk.y)&&!modal&&!(P.down&&!dragMoved)){const src=input.source,kx=src==='touch'?1.45:src==='gamepad'?.55:3.33,ky=src==='touch'?.73:src==='gamepad'?.35:1.67;c.theta-=lk.x*kx;c.goalTheta-=lk.x*kx;c.elevation=Math.max(.37,Math.min(1.12,c.elevation+lk.y*ky));}
 // A tap or click that did not drag picks a tile or unit.
 if(P.justUp){if(dragStart&&!dragMoved&&!modal&&battle){cursor=null;tileClick(diorama.pick(P.x,P.y,mode!=='move'));}dragStart=null;}
 if(!modal){if(input.pressed('turnLeft'))cameraAction('left');if(input.pressed('turnRight'))cameraAction('right');if(input.pressed('zoomIn'))cameraAction('in');if(input.pressed('zoomOut'))cameraAction('out');if(input.pressed('home'))cameraAction('home');}
 if(input.pressed('pause')){if(modal==='settings')closeModal();else if(modal)modalBack();else openModal('settings');}
 if(input.pressed('escape')){if(modal)modalBack();else if(!cancelStep())openModal('settings');}
 if(input.pressed('cancel')){if(modal)modalBack();else cancelStep();}
 if(battle!==lastBattle||battle.activeId!==lastActiveId){lastBattle=battle;lastActiveId=battle.activeId;cursor=null;}
 if(playerReady()){
  if(input.pressed('cmdMove'))command('move');if(input.pressed('cmdAttack'))command('attack');if(input.pressed('cmdArts'))command('arts');if(input.pressed('cmdItems'))command('items');
  if(input.pressed('wait')){if(mode==='wait')face(battle.active.dir);else command('wait');}
  else if(input.pressed('undo'))undoMove();
 }
 if(mode!==lastMode){lastMode=mode;if(cursor&&['attack','skill'].includes(mode))startCursor();}
 const scope=navScope();
 // Leaving a panel for the field drops its button focus, so Enter / Space reach the field again.
 if(scope!==lastScope){const el=document.activeElement;if(lastScope&&!scope&&el&&lastScope.contains(el))el.blur();lastScope=scope;}
 // With a controller, menus always hold a focused button and the field always shows the cursor.
 if(scope&&input.source==='gamepad'&&!scope.contains(document.activeElement)){const d=defaultFocus(scope);if(d){navActive=true;d.focus({preventScroll:true});}}
 if(!scope&&!cursor&&input.source==='gamepad'&&playerReady())startCursor();
 const v=input.vector('cursor'),dir=Math.hypot(v.x,v.y)<.5?null:Math.abs(v.x)>Math.abs(v.y)?(v.x>0?'R':'L'):(v.y>0?'U':'D');let step=null;
 if(dir!==navDir){navDir=dir;navHold=0;step=dir;}else if(dir){navHold+=dt;if(navHold>.34){navHold-=.11;step=dir;}}
 if(step){if(scope)moveFocus(scope,step);else if(playerReady())moveCursor(step);}
 if(input.pressed('confirm'))confirmAction(scope);
 diorama.setCursor(cursor&&!navScope()&&playerReady()?battle.tile(cursor.x,cursor.z):null);
}
function frame(dt,t){handleInput(dt);const c=diorama.camera;c.ease(dt);diorama.update(t,settings.motion);c.update();renderer.render(diorama.world,c);positionLabels();const deg=Math.round(-(c.theta-.66)*1800/Math.PI)/10;if(deg!==compassDeg){compassDeg=deg;$('compass-rose').style.transform=`rotate(${deg}deg)`;}}
async function init(){applyStaticIcons();diorama.load(battle);battle.drainEvents();paint();
 kit=await boot({title:'Bannerbound — The Hollow Bell',mount:$('viewport'),canvas:$('game-canvas'),renderer:{alpha:true,antialias:true},gear:'none',background:'#2e514b',accent:'#d3ad5e',input:INPUT});
 renderer=new DioramaRenderer(kit);$('renderer-badge').textContent=renderer.label;
 kit.onResize((w,h)=>{diorama.camera.w=w;diorama.camera.h=h;diorama.camera.update();positionLabels();});
 kit.onPause(p=>sound.hold(p));
 const padNav=src=>document.documentElement.classList.toggle('pad-nav',src==='gamepad');padNav(kit.input.source);
 kit.input.onSourceChange(src=>{padNav(src);paint();if(modal==='help')renderModal();});
 $('compass-rose').style.display='block';
 // Warm up the shaders (one for the baked scenery, one shared by every instanced batch) before the first frame.
 renderer.prepare(diorama.world);diorama.camera.update();renderer.syncCamera(diorama.camera);
 try{await kit.renderer.compileAsync(renderer.scene,renderer.cam);}catch(e){console.warn('Shader warm-up skipped:',e?.message||e);}
 kit.start(frame);paint();
 if(screen==='camp')openModal('camp');if(screen==='ending')openModal('ending');if(screen==='battle')driveAI();save();
 // Deliberately exposed read-only diagnostics plus real input routes for automated tests.
 window.Bannerbound={get state(){return {screen,mode,modal,activeId:battle.activeId,busy,result:battle.result,renderer:renderer.label,chapter:battle.stage};},get snapshot(){return battle.serialize();},get campaign(){return structuredClone(campaign);},get diagnostics(){return {objects:diorama.world.flatten().length,drawCalls:renderer.calls,batches:renderer.batches.size,canvas:[renderer.canvas.width,renderer.canvas.height]};},get projection(){return battle.tiles.map(t=>({tileX:t.x,tileZ:t.z,...diorama.camera.project(diorama.point(t.x,t.z,t.h))}));},selectTile:(x,z)=>tileClick(battle.tile(x,z)),command,confirm:confirmTarget,endTurn:face};
}
init().catch(e=>console.error(e));
</script></body></html>
