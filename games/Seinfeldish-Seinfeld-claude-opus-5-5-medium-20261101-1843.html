<!--
SEINFELD-ISH — "A game about nothing. Mostly."
An original spiritual successor to Seinfeld (TV Show). Parody tribute; original characters; not affiliated with the show.

SOURCE INFORMATION
- Date: 2026-11-01 18:43
- Source: Seinfeld (TV Show)
- Genre and Perspective: Third-person social-comedy adventure (errands, conversation banter, social stealth, physics slapstick, stand-up rhythm finale). Main camera: third-person chase; switchable (R3 / V) to Sitcom Multi-Cam (fixed set cameras) and First-Person.
- Tech: Three.js r180 (three/webgpu WebGPURenderer, automatic WebGL 2 fallback), Rapier 0.19.3 (@dimforge/rapier3d-compat: dynamic bodies, kinematic character controller, ray casts), Web Audio API, Gamepad API, AI Hub Session Protocol v1 client 1.3.0; ES modules from the jsDelivr CDN; single HTML file.
- Art Direction: engine-native three.js look: lit MeshStandardMaterial primitives, real-time shadow maps, point/spot lights, canvas-texture signage, three-walled sitcom sets that cut away when you walk in.
- Animation: three.js AnimationMixer with keyframe AnimationClips (Quaternion/Vector keyframe tracks) on primitive rigs, cross-faded: idle, walk, run, sneak, push, carry, talk, sit, shrug, laugh, slide, shove, stagger, wave, bow, mic; pigeon flap/peck.
- Audio: all code-written Web Audio: slap-bass funk sequencer per location plus original bass-riff scene stingers; synthesized laugh track and applause; SFX; Animalese-style gibberish voices with per-character pitch and formants.
- Online: AI Hub Session Protocol v1, side-by-side ("parallel") mode for 1-4 players (seeded start, live progress = laughs, result with stats/awards). No other networking. Single-player on its own.
- Testing: headless Chromium via Playwright (SwiftShader WebGL 2 / WebGPU), stepped simulation through a test hook, the attract-mode AI driven through the whole episode, scripted feature checks (menus, invert toggles, idle→attract→exit, wheel physics, stealth, soup ban, banter), an emulated standard gamepad, an emulated touch-only phone, offscreen-render screenshots, and the AI Hub harness (parallel; 1 and 2 players; player-leave scenario): all passing.
- Research: read the AI Hub lib/hub README, session.js, retrofit.md and harness.html. No research on the show itself (written from general knowledge of its tone and structure).
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort medium
- Usage: unknown (no cost/token/session-time estimates available in-session)

TESTING FEEDBACK
- How many issues did testing catch? 13: a frozen pay timer in the soup line, key taps lost at low frame rates, stale probe input, Norbert blinded by a stale 'inside' flag, a near-black road from over-long shadows, a stale HUD behind the results, open sky over the sets, a caption overlapping the bit cards, a menu left open when an episode started, an opening objective that stalled if you skipped the answering machine, the demo-exit press also starting a new episode, scene-card timers from a reset episode firing later, and two quick taps of the same key counting as one.
- How many were critical / game-breaking? 2: the soup-line pay timer never advanced (soft-locked the Lentil thread and the demo), and leaving the demo dropped you into a stand-up set with no menu. Lost key taps (menus not opening at low FPS) were serious.
- Most helpful test? Letting the attract-mode AI play the whole episode with stepped simulation. It found the soft-lock and proved every thread, the set and the tag scene connect.
- Least helpful test? Offscreen-render screenshots after the first capture. Headless rAF stops after a readback, so later shots showed a frozen camera.

ENGINE FEEDBACK
- Liked most: three.js r180's WebGPURenderer takes ordinary materials, shadows and AnimationMixer unchanged and falls back to WebGL 2 by itself. Rapier's character controller pushes dynamic bodies for free, which is the whole Gouda-wheel thread.
- Stuck / guessed wrong: Rapier 0.19 argument order for castRay filters and the character-controller API needed care. Headless WebGPU canvases screenshot blank, so tests render offscreen and read the pixels back.
- Most important thing built: the dialogue/banter runner with per-character tastes, the stand-up timing system, and the attract-mode AI director that plays the real game loop.
- Hardest part: cameras inside cut-away sets: fixed sitcom cameras, two-shot dialogue framing, and camera collision that ignores the hidden facade.
- Remove/overhaul one thing: the split between three/webgpu and three entry points, which complicates import maps and bundling.
- Change one thing: a documented headless capture path for WebGPU canvases.

PROMPT FEEDBACK
- Liked most: firm UX rules (controller-first, attract mode, invert toggles, touch fallback) with full creative freedom on genre.
- Confusing: what "engine native style/animation" means for a library like three.js, and where a TV-show source sits against the rule about not recreating specific existing games.
- Hardest thing: giving a game "about nothing" goals, a score and a finish that fit a hub round.
- One test I wish I could run: a real DualSense on real hardware, to check feel, dead zones and the intermittent axis-inversion issue.

-->

(function (root) {

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */

  var framed = false;

    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {

    var api = {
      getItem: function (k) {

      removeItem: function (k) {

      clear: function () {

      },
      has: function (t, k) {

      },
      deleteProperty: function (t, k) {

      },
      ownKeys: function () {

      getOwnPropertyDescriptor: function (t, k) {

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */

      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.

    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

    };
  };

    opts = opts || {};

    } catch (e) {

      return false;
    }

    if (text.length > limits.maxBytes) {

      return false;

      return false;

    return true;
  };

    return goAt === null ? -Infinity : now() - goAt;

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */

    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON

      return null;

      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;

<script type="module">
// ============================================================================
// Seinfeld-ish — core: utilities, settings, input, audio
// ============================================================================
import * as THREE from 'three/webgpu';
import RAPIER from '@dimforge/rapier3d-compat';

const Q = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const wrapAng = (a) => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const dampAng = (a, b, l, dt) => a + wrapAng(b - a) * (1 - Math.exp(-l * dt));
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// ---------------------------------------------------------------------------
// Settings (device-only; in a hub session the client hands us an empty storage)
// ---------------------------------------------------------------------------
const SETTINGS_KEY = 'seinfeldish.settings.v1';
const DEFAULTS = {
  master: 0.8, music: 0.55, sfx: 0.8, voice: 0.75, laugh: 0.8,
  invertX: false, invertY: false, camInvertY: false, sens: 1.0,
  camera: 'third', shadows: 'high', shake: true, textSize: 1.0, dayLength: 8, prompts: 'auto',
};
const Settings = Object.assign({}, DEFAULTS);
try { Object.assign(Settings, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')); } catch (e) { /* fresh */ }
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(Settings)); } catch (e) { /* storage off */ } }

// ---------------------------------------------------------------------------
// Input: keyboard + mouse + standard gamepad, folded into one controller model
// ---------------------------------------------------------------------------
const BTN = ['cross', 'circle', 'square', 'triangle', 'l1', 'r1', 'l2', 'r2', 'create', 'options', 'l3', 'r3', 'up', 'down', 'left', 'right', 'touchpad'];
const KEYMAP = {
  cross: ['KeyE', 'Enter', 'Space', 'NumpadEnter'], circle: ['Backspace', 'KeyB'], square: ['KeyF'], triangle: ['KeyQ'],
  l1: ['KeyZ'], r1: ['KeyX'], l2: ['ControlLeft', 'ControlRight', 'KeyC'], r2: ['ShiftLeft', 'ShiftRight'],
  create: ['Tab', 'KeyN'], options: ['Escape', 'KeyP'], l3: [], r3: ['KeyV'],
  up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], touchpad: ['KeyM'],
};
const KEYLABEL = { cross: 'E', circle: 'Bksp', square: 'F', triangle: 'Q', l1: 'Z', r1: 'X', l2: 'Ctrl', r2: 'Shift', create: 'Tab', options: 'Esc', r3: 'V', l3: '—', up: '↑', down: '↓', left: '←', right: '→', touchpad: 'M' };
const Input = {
  down: new Set(), latch: new Set(), fresh: new Set(), padMove: { x: 0, y: 0 }, mdx: 0, mdy: 0, mouseHeld: false, wheel: 0,
  last: 'kb', lastAt: performance.now(), anyPressed: false,
  held: {}, pressed: {}, released: {}, prev: {},
  move: { x: 0, y: 0 }, look: { x: 0, y: 0 }, nav: { x: 0, y: 0 }, navRepeat: 0, navPrev: { x: 0, y: 0 },
  padConnected: false, createHeldWithOptions: false, createChord: false, touchOnly: false,
  r2v: 0, l2v: 0,
  init() {
    const kd = (e) => {
      if (e.code === 'Tab' || e.code === 'Space' || e.code.startsWith('Arrow') || e.code === 'Backspace') e.preventDefault();
      this.down.add(e.code || e.key); this.latch.add(e.code || e.key);
      if (!e.repeat) { this.fresh.add(e.code || e.key); if (e.key && e.key.length === 1) this.fresh.add('Key' + e.key.toUpperCase()); }
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'ArrowDown') this.down.add(e.key);
      if (e.key && e.key.length === 1) { this.down.add('Key' + e.key.toUpperCase()); this.latch.add('Key' + e.key.toUpperCase()); }
      if (e.key === 'Escape') { this.down.add('Escape'); this.latch.add('Escape'); }
      if (e.key && e.key.startsWith('Arrow')) this.latch.add(e.key);
      this.mark('kb');
    };
    const ku = (e) => {
      this.down.delete(e.code || e.key);
      if (e.key && e.key.length === 1) this.down.delete('Key' + e.key.toUpperCase());
      if (e.key && e.key.startsWith('Arrow')) this.down.delete(e.key);
      if (e.key === 'Escape') this.down.delete('Escape');
    };
    window.addEventListener('keydown', kd, true);
    window.addEventListener('keyup', ku, true);
    window.addEventListener('blur', () => this.down.clear());
    window.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement || this.mouseHeld) { this.mdx += e.movementX || 0; this.mdy += e.movementY || 0; }
      if (Math.abs(e.movementX) + Math.abs(e.movementY) > 2) this.mark('kb');
    });
    window.addEventListener('mousedown', (e) => { if (e.button === 2 || e.button === 0) this.mouseHeld = e.button === 2 ? true : this.mouseHeld; this.mark('kb'); });
    window.addEventListener('mouseup', (e) => { if (e.button === 2) this.mouseHeld = false; });
    window.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('wheel', (e) => { this.wheel += Math.sign(e.deltaY); }, { passive: true });
    window.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'touch') this.mark('kb'); else this.lastAt = performance.now(); });
    window.addEventListener('gamepadconnected', () => { this.padConnected = true; });
    const coarse = matchMedia('(pointer: coarse)').matches, fine = matchMedia('(any-pointer: fine)').matches;

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); draw(x, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function signTex(text, { w = 512, h = 128, bg = '#222', fg = '#fff', font = 'bold 72px Georgia, serif', border = null, glow = null, sub = null, subFont = 'bold 30px sans-serif' } = {}) {
  return canvasTex(w, h, (x) => {
    x.fillStyle = bg; x.fillRect(0, 0, w, h);
    if (border) { x.strokeStyle = border; x.lineWidth = 10; x.strokeRect(8, 8, w - 16, h - 16); }
    x.fillStyle = fg; x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';
    if (glow) { x.shadowColor = glow; x.shadowBlur = 24; }
    x.fillText(text, w / 2, sub ? h * 0.4 : h / 2);
    if (sub) { x.font = subFont; x.fillText(sub, w / 2, h * 0.78); }
  });
}

// --- physics helpers --------------------------------------------------------
function colBox(x, y, z, hx, hy, hz, rotY = 0, opts = {}) {
  const d = RAPIER.ColliderDesc.cuboid(hx, hy, hz).setTranslation(x, y, z).setFriction(opts.friction ?? 0.7);
  if (rotY) { const q = new THREE.Quaternion().setFromAxisAngle(_up, rotY); d.setRotation({ x: q.x, y: q.y, z: q.z, w: q.w }); }
  const c = W.phys.createCollider(d, W.fixed);
  if (opts.facade) W.facadeColliders.add(c.handle);
  if (opts.camIgnore) W.facadeColliders.add(c.handle);
  return c;
}
/** A visible box with an optional static collider. Position is the box centre. */
function block(x, y, z, w, h, d, m, o = {}) {
  const me = mesh(GEO.box, m, x, y, z, o.cast !== false); me.scale.set(w, h, d);
  if (o.rotY) me.rotation.y = o.rotY;
  (o.parent || W.scene).add(me);
  if (o.collide !== false) colBox(x, y, z, w / 2, h / 2, d / 2, o.rotY || 0, o);
  return me;
}
function cylinder(x, y, z, r, h, m, o = {}) {
  const me = mesh(GEO.cyl, m, x, y, z, o.cast !== false); me.scale.set(r, h, r); (o.parent || W.scene).add(me);
  if (o.collide !== false) W.phys.createCollider(RAPIER.ColliderDesc.cylinder(h / 2, r).setTranslation(x, y, z), W.fixed);
  return me;
}
/** Dynamic prop: mesh + rigid body; shape 'box' {hx,hy,hz} or 'cyl' {r,hh} or 'ball' {r}. */
function dynProp(obj, shape, x, y, z, o = {}) {
  const bd = RAPIER.RigidBodyDesc.dynamic().setTranslation(x, y, z).setLinearDamping(o.ld ?? 0.3).setAngularDamping(o.ad ?? 0.4).setCanSleep(true);
  if (o.rotY) { const q = new THREE.Quaternion().setFromAxisAngle(_up, o.rotY); bd.setRotation({ x: q.x, y: q.y, z: q.z, w: q.w }); }
  const body = W.phys.createRigidBody(bd);
  let cd;
  if (shape.type === 'box') cd = RAPIER.ColliderDesc.cuboid(shape.hx, shape.hy, shape.hz);
  else if (shape.type === 'cyl') cd = RAPIER.ColliderDesc.cylinder(shape.hh, shape.r);
  else cd = RAPIER.ColliderDesc.ball(shape.r);
  cd.setDensity(o.density ?? 1).setFriction(o.friction ?? 0.6).setRestitution(o.rest ?? 0.15);
  if (o.cylAxisZ) { const q = new THREE.Quaternion().setFromAxisAngle(V3(1, 0, 0), Math.PI / 2); cd.setRotation({ x: q.x, y: q.y, z: q.z, w: q.w }); }
  const col = W.phys.createCollider(cd, body);
  W.scene.add(obj); obj.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
  const p = { obj, body, col, home: V3(x, y, z), homeRot: o.rotY || 0, kind: o.kind || 'prop', throwable: !!o.throwable, name: o.name || 'thing', held: false, flying: 0, lastSpeed: 0 };
  W.dynamics.push(p); if (p.throwable) W.throwables.push(p);
  return p;
}
function syncDynamics() {
  for (const p of W.dynamics) {
    const t = p.body.translation(), r = p.body.rotation();
    p.obj.position.set(t.x, t.y, t.z); p.obj.quaternion.set(r.x, r.y, r.z, r.w);
    if (t.y < -5) resetProp(p);
  }
}
function resetProp(p) {
  p.body.setTranslation({ x: p.home.x, y: p.home.y + 0.3, z: p.home.z }, true);
  p.body.setLinvel({ x: 0, y: 0, z: 0 }, true); p.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
  const q = new THREE.Quaternion().setFromAxisAngle(_up, p.homeRot); p.body.setRotation({ x: q.x, y: q.y, z: q.z, w: q.w }, true);
}

  colBox(-54, 3, 0, 0.5, 6, 20); colBox(54, 3, 0, 0.5, 6, 20);

/** One north-side building with an enterable ground floor, cut away while you're inside. */
function makeBuilding({ name, x0, x1, z1, h, wall, trim, door, interiorWall, floorMat, upper = true, windows = true }) {
  const fac = new THREE.Group(); fac.name = name + '-facade'; W.scene.add(fac);
  const inner = new THREE.Group(); inner.name = name + '-interior'; W.scene.add(inner);
  const zf = -9, cx = (x0 + x1) / 2, wdt = x1 - x0;
  // front wall split around the door (door: [dx0, dx1])
  const [d0, d1] = door, dh = 3.2, fh = 4.6;
  block((x0 + d0) / 2, fh / 2, zf - 0.15, d0 - x0, fh, 0.3, wall, { parent: fac, facade: true });
  block((d1 + x1) / 2, fh / 2, zf - 0.15, x1 - d1, fh, 0.3, wall, { parent: fac, facade: true });
  block((d0 + d1) / 2, (dh + fh) / 2, zf - 0.15, d1 - d0, fh - dh, 0.3, wall, { parent: fac, facade: true });
  // door frame + awning + step
  block(d0 - 0.08, dh / 2, zf + 0.02, 0.16, dh, 0.12, trim, { parent: fac, collide: false });
  block(d1 + 0.08, dh / 2, zf + 0.02, 0.16, dh, 0.12, trim, { parent: fac, collide: false });
  block((d0 + d1) / 2, dh + 0.08, zf + 0.02, d1 - d0 + 0.32, 0.16, 0.12, trim, { parent: fac, collide: false });
  // upper floors (also the ceiling of the set)
  if (upper) {
    block(cx, fh + (h - fh) / 2, (zf + z1) / 2 - 0.15, wdt, h - fh, zf - z1 + 0.3, wall, { parent: fac, facade: true });
    block(cx, h + 0.25, zf - 0.1, wdt + 0.4, 0.5, 0.6, trim, { parent: fac, collide: false });
    if (windows) {
      const geo = new THREE.BoxGeometry(1.3, 1.7, 0.1);
      const n = Math.floor((wdt - 2) / 3), rows = Math.floor((h - fh - 1) / 3.2);
      const lit = new THREE.InstancedMesh(geo, PAL.winLit, n * rows), dark = new THREE.InstancedMesh(geo, PAL.winDark, n * rows);
      let li = 0, di = 0; const m4 = new THREE.Matrix4();
      for (let r = 0; r < rows; r++) for (let i = 0; i < n; i++) {
        const x = x0 + 1.5 + (i + 0.5) * ((wdt - 3) / n), y = fh + 1.6 + r * 3.2;
        m4.makeTranslation(x, y, zf + 0.04);
        if (Math.random() < 0.25) lit.setMatrixAt(li++, m4); else dark.setMatrixAt(di++, m4);
        block(x, y - 0.95, zf + 0.12, 1.5, 0.12, 0.25, trim, { parent: fac, collide: false, cast: false });
      }
      lit.count = li; dark.count = di; fac.add(lit); fac.add(dark);
      W.litWindows = W.litWindows || []; W.litWindows.push(lit);
    }
  }
  // interior: floor, side and back walls
  const ix0 = x0 + 0.3, ix1 = x1 - 0.3, iz1 = z1 + 0.3;
  block(cx, 0.06, (zf + z1) / 2, wdt - 0.6, 0.12, zf - z1 - 0.3, floorMat, { parent: inner, cast: false });
  block(ix0 - 0.15, fh / 2, (zf + z1) / 2, 0.3, fh, zf - z1, interiorWall, { parent: inner });
  block(ix1 + 0.15, fh / 2, (zf + z1) / 2, 0.3, fh, zf - z1, interiorWall, { parent: inner });
  block(cx, fh / 2, iz1 - 0.15, wdt, fh, 0.3, interiorWall, { parent: inner });
  // the set's own ceiling (stays when the cut-away hides the upper floors)
  const ceil = block(cx, fh + 0.1, (zf + z1) / 2, wdt - 0.6, 0.2, zf - z1 - 0.3, mat(0x2a2430, { roughness: 1 }), { parent: inner, cast: false });
  ceil.receiveShadow = false;
  // outer side walls (seen from the street when not inside)
  block(x0 + 0.1, h / 2, (zf + z1) / 2, 0.2, h, zf - z1, wall, { parent: fac, collide: false });
  block(x1 - 0.1, h / 2, (zf + z1) / 2, 0.2, h, zf - z1, wall, { parent: fac, collide: false });
  const b = { name, x0: ix0, x1: ix1, z0: zf - 0.3, z1: iz1, fac, inner, door: V3((d0 + d1) / 2, 0, zf), cx, inside: false };
  W.buildings.push(b);

const ACTORS = [];
class Actor {
  constructor(id, look, x, z, yaw = 0, o = {}) {
    this.id = id; this.rig = makeRig(look); W.scene.add(this.rig.root);
    this.pos = V3(x, o.y || 0.12, z); this.yaw = yaw; this.speed = o.speed || 1.4; this.path = []; this.pose = o.pose || 'idle';
    this.voice = o.voice || 'ped'; this.name = o.name || id; this.talking = 0; this.lookAt = null; this.solid = o.solid !== false; this.visible = true;
    if (this.solid) {
      this.body = W.phys.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(x, this.pos.y + 0.85, z));
      this.col = W.phys.createCollider(RAPIER.ColliderDesc.capsule(0.5, 0.3), this.body);
    }
    this.rig.root.position.copy(this.pos); this.rig.root.rotation.y = yaw;
    ACTORS.push(this);
  }
  goTo(pts, speed) { this.path = pts.map((p) => (p.isVector3 ? p.clone() : V3(p[0], this.pos.y, p[1]))); if (speed) this.speed = speed; }
  face(p) { this.yaw = Math.atan2(p.x - this.pos.x, p.z - this.pos.z); }
  setVisible(v) { this.visible = v; this.rig.root.visible = v; if (this.col) this.col.setEnabled(v); }
  teleport(x, z, yaw) { this.pos.set(x, this.pos.y, z); if (yaw != null) this.yaw = yaw; this.path = []; this.rig.root.position.copy(this.pos); if (this.body) this.body.setTranslation({ x, y: this.pos.y + 0.85, z }, true); }
  update(dt) {
    let moving = false;
    if (this.path.length) {
      const t = this.path[0], dx = t.x - this.pos.x, dz = t.z - this.pos.z, d = Math.hypot(dx, dz);
      if (d < 0.12) { this.path.shift(); if (!this.path.length && this.onArrive) { const f = this.onArrive; this.onArrive = null; f(); } }
      else {
        const s = Math.min(d, this.speed * dt); this.pos.x += (dx / d) * s; this.pos.z += (dz / d) * s; moving = true;
        this.yaw = dampAng(this.yaw, Math.atan2(dx, dz), 10, dt);
      }
    } else if (this.lookAt) {
      const want = Math.atan2(this.lookAt.x - this.pos.x, this.lookAt.z - this.pos.z);
      this.yaw = dampAng(this.yaw, want, 5, dt);
    }
    this.moving = moving;
    if (this.talking > 0) this.talking -= dt;
    let anim = this.pose;
    if (moving) anim = this.speed > 3 ? 'run' : this.walkAnim || 'walk';
    else if (this.talking > 0 && this.pose === 'idle') anim = 'talk';
    else if (this.talking > 0 && this.pose === 'sit') anim = 'sitTalk';
    if (!this.oneShot || this.oneShot.t <= 0) { this.oneShot = null; this.rig.play(anim, 0.25, moving ? this.speed / 1.4 : 1); }
    else this.oneShot.t -= dt;
    this.rig.root.position.copy(this.pos); this.rig.root.rotation.y = this.yaw;
    if (this.body && this.visible) this.body.setNextKinematicTranslation({ x: this.pos.x, y: this.pos.y + 0.85, z: this.pos.z });
    if (this.visible) this.rig.update(dt);
  }
  once(clip, t) { this.oneShot = { t: t || CLIPS[clip].duration }; this.rig.cur = null; this.rig.play(clip, 0.12); }
}

const P = {
  rig: null, pos: V3(), yaw: 0, vy: 0, body: null, col: null, ctrl: null, grounded: true, hiding: false, sprint: false, held: null,

function initPlayer(x, z, yaw) {

  if (c.setCharacterMass) c.setCharacterMass(80);

function placePlayer(x, z, yaw) {
  P.pos.set(x, 0.12, z); if (yaw != null) P.yaw = yaw; P.vy = 0; P.knock.set(0, 0, 0);
  P.body.setTranslation({ x, y: 0.12 + 0.85, z }, true); P.body.setNextKinematicTranslation({ x, y: 0.97, z });
  P.rig.root.position.copy(P.pos); P.rig.root.rotation.y = P.yaw;
}
const _mv = V3();
function updatePlayer(dt, mx, my, camYaw, fp) {
  // input → desired velocity relative to the camera
  const sprint = P.sprint && !P.hiding && !P.held;
  let sp = P.hiding ? 1.6 : sprint ? 6.2 : 3.3;
  if (P.slowT > 0) { sp *= 0.45; P.slowT -= dt; }
  if (G.attract) sp *= 1.6;
  if (P.locked) { mx = 0; my = 0; }
  const s = Math.sin(camYaw), c = Math.cos(camYaw);
  // camera looks along (-sin, -cos); right is (cos, -sin)
  _mv.set(mx * c + my * s, 0, -mx * s + my * c);
  const mag = Math.min(1, _mv.length());
  if (mag > 0.01) _mv.normalize().multiplyScalar(sp * mag);
  P.speedNow = damp(P.speedNow, _mv.length(), 12, dt);
  P.vy = P.grounded ? -2 : P.vy - 22 * dt;
  const kx = P.knock.x, kz = P.knock.z; P.knock.multiplyScalar(Math.exp(-5 * dt));
  const want = { x: (_mv.x + kx) * dt, y: P.vy * dt, z: (_mv.z + kz) * dt };
  const t = P.body.translation();
  let nx, ny, nz;
  if (P.noclip) { nx = t.x + want.x; ny = 0.97; nz = t.z + want.z; P.grounded = true; }
  else {
    const heldH = P.held ? P.held.col.handle : -1;
    P.ctrl.computeColliderMovement(P.col, want, RAPIER.QueryFilterFlags.EXCLUDE_SENSORS, undefined, (col) => col.handle !== heldH);
    const m = P.ctrl.computedMovement(); P.grounded = P.ctrl.computedGrounded();
    nx = t.x + m.x; ny = t.y + m.y; nz = t.z + m.z;
    if (ny < 0.9) ny = 0.97;
  }
  P.body.setNextKinematicTranslation({ x: nx, y: ny, z: nz });
  P.pos.set(nx, ny - 0.85, nz);
  if (fp) P.yaw = camYaw + Math.PI;
  else if (mag > 0.05 && !P.locked) P.yaw = dampAng(P.yaw, Math.atan2(_mv.x, _mv.z), 12, dt);
  // animation
  const moving = P.speedNow > 0.4;
  let anim = 'idle';
  if (P.hiding) anim = moving ? 'sneak' : 'sneakIdle';
  else if (P.held) anim = moving ? 'carry' : 'carryIdle';
  else if (moving) anim = P.pushing ? 'push' : P.speedNow > 4.5 ? 'run' : 'walk';
  else if (P.talkT > 0) anim = 'talk';
  if (P.stage) anim = P.stageAnim || 'mic';
  if (!P.oneShot || P.oneShot.t <= 0) { P.oneShot = null; P.rig.play(anim, 0.2, moving ? clamp(P.speedNow / (anim === 'run' ? 6 : 3.3), 0.6, 1.6) : 1); }
  else P.oneShot.t -= dt;
  P.newspaper.visible = P.hiding;
  P.rig.root.position.copy(P.pos); P.rig.root.rotation.y = P.yaw;
  P.rig.update(dt);
  if (moving && P.grounded) { P.stepT -= dt * P.speedNow; if (P.stepT <= 0) { P.stepT = 1.6; Sound.sfx('step', { vol: P.hiding ? 0.3 : 1 }); } }
}
function playerOnce(clip) { P.oneShot = { t: CLIPS[clip].duration }; P.rig.cur = null; P.rig.play(clip, 0.1); }

function bark(actor, text, dur = 1.5) {
  if (BARKS.length > 6) { const o = BARKS.shift(); o.el.remove(); }
  const el = document.createElement('div'); el.className = 'bark'; el.textContent = text; document.body.appendChild(el);
  BARKS.push({ actor, el, t: dur, y: actor.rig ? 2.25 * (actor.rig.o.height || 1) : 1.8 });
  if (actor.voice) { let k = 0; const it = setInterval(() => { if (k >= text.length) return clearInterval(it); if (/[a-z]/i.test(text[k])) Sound.blip(text[k], actor.voice, 1); k += 2; }, 55); }
}
const _bp = V3();
function updateBarks(dt) {
  for (let i = BARKS.length - 1; i >= 0; i--) {
    const b = BARKS[i]; b.t -= dt;
    _bp.set(b.actor.pos.x, b.actor.pos.y + b.y, b.actor.pos.z).project(W.camera);
    const vis = _bp.z < 1 && b.t > 0 && G.mode !== 'title';
    b.el.style.display = vis ? 'block' : 'none';
    b.el.style.left = ((_bp.x + 1) / 2) * innerWidth + 'px'; b.el.style.top = ((1 - _bp.y) / 2) * innerHeight + 'px';
    b.el.style.opacity = Math.min(1, b.t * 3);
    if (b.t <= 0) { b.el.remove(); BARKS.splice(i, 1); }
  }
}

const Dlg = { on: false, q: [], node: null, text: '', shown: 0, done: false, who: null, onEnd: null, choices: null, auto: 0, thought: false, thoughtT: 0 };
function talk(script, onEnd) {
  Dlg.q = script.slice(); Dlg.onEnd = onEnd || null; Dlg.on = true; Dlg.thought = false;
  G.prevMode = G.mode === 'dialog' ? G.prevMode : G.mode; G.mode = 'dialog';
  dlgNext();
}
function think(text) {
  // a non-blocking inner monologue line
  Dlg.thought = true; Dlg.thoughtT = 4 + text.length / 30; Dlg.who = 'think'; Dlg.text = text; Dlg.shown = 0; Dlg.done = false; Dlg.choices = null;
  UI.showDialog();
}
function dlgNext() {
  for (const a of ACTORS) a.talking = 0;
  P.talkT = 0;
  if (!Dlg.q.length) return dlgEnd();
  const n = Dlg.q.shift();
  if (typeof n === 'function') { const r = n(); if (r === 'stop') return; return dlgNext(); }
  if (Array.isArray(n)) {
    Dlg.who = n[0]; Dlg.text = n[1]; Dlg.shown = 0; Dlg.done = false; Dlg.choices = null; Dlg.auto = 0;
    const sp = SPEAKERS[Dlg.who]; const act = sp && sp.actor();
    if (act && act !== P) { act.talking = 99; act.lookAt = P.pos; }
    if (act === P) P.talkT = 99;
    Dlg.focus = act && act !== P ? act : Dlg.focus;
    UI.showDialog();
    return;
  }
  if (n.banter) { startBanter(n.banter); return; }
  if (n.wait) { Dlg.waitT = n.wait; Dlg.who = null; UI.hideDialog(); return; }
}
function dlgEnd() {
  Dlg.on = false; Dlg.choices = null; UI.hideDialog(); P.talkT = 0;
  for (const a of ACTORS) { a.talking = 0; if (a !== N.a) a.lookAt = null; }
  if (G.mode === 'dialog') G.mode = G.prevMode === 'dialog' || !G.prevMode ? 'free' : G.prevMode;
  Dlg.focus = null;
  const f = Dlg.onEnd; Dlg.onEnd = null; if (f) f();
}
function startBanter(b) {
  Dlg.choices = b; Dlg.who = b.who; Dlg.text = b.line; Dlg.shown = b.line.length; Dlg.done = true;
  const act = SPEAKERS[b.who].actor(); if (act && act !== P) { act.talking = 1.5; Dlg.focus = act; }
  UI.showDialog();
  // speak the prompt line in gibberish
  let k = 0; const it = setInterval(() => { if (k >= b.line.length || !Dlg.choices) return clearInterval(it); if (/[a-z]/i.test(b.line[k])) Sound.blip(b.line[k], SPEAKERS[b.who].voice); k += 2; }, 40);
}
function chooseBanter(tone) {
  const b = Dlg.choices; if (!b) return;
  const opt = b.opts.find((o) => o.tone === tone); if (!opt) return;
  Dlg.choices = null; Sound.sfx('select');
  const t = (G.tastes[b.who] = G.tastes[b.who] || {});
  const res = opt.res;
  const after = [];
  after.push(['barry', opt.text]);
  after.push(() => {
    if (res === 'like') { t.like = tone; G.likes++; Sound.laugh(0.85, 2.2); addLaughs(80, `${SPEAKERS[b.who].name} loved it`); const a = SPEAKERS[b.who].actor(); if (a && a.once && a.pose !== 'sit') a.once('laugh', 1.2); }
    else if (res === 'dislike') { t.dislike = tone; addAwk(`${SPEAKERS[b.who].name} didn't like that.`); }
    else { Sound.laugh(0.3, 1.2); addLaughs(30, 'A chuckle'); if (!t.meh) t.meh = []; if (!t.meh.includes(tone)) t.meh.push(tone); }
    if (opt.fx) opt.fx();
  });
  after.push([b.who, opt.reply]);
  Dlg.q = after.concat(Dlg.q);
  dlgNext();
}
function updateDialog(dt, IN) {
  if (Dlg.waitT > 0) { Dlg.waitT -= dt; if (Dlg.waitT <= 0) { Dlg.waitT = 0; dlgNext(); } return; }
  if (Dlg.thought) {
    Dlg.thoughtT -= dt; typeStep(dt);
    if (Dlg.thoughtT <= 0) { Dlg.thought = false; if (!Dlg.on) UI.hideDialog(); }
    return;
  }
  if (!Dlg.on) return;
  if (Dlg.choices) {
    for (const [tone, d] of Object.entries(TONES)) if (IN.pressed[d.btn]) return chooseBanter(tone);
    if (G.attract) { Dlg.auto += dt; if (Dlg.auto > 1.6) { const best = Dlg.choices.opts.find((o) => o.res === 'like'); Dlg.auto = 0; chooseBanter(best.tone); } }
    return;
  }
  typeStep(dt);
  const adv = IN.pressed.cross || IN.pressed.circle || (G.attract && Dlg.done && (Dlg.auto += dt) > 1.0);
  if (adv) {
    if (!Dlg.done) { Dlg.shown = Dlg.text.length; Dlg.done = true; UI.updateDialogText(); }
    else { Sound.sfx('ui'); dlgNext(); }
  }
}
function typeStep(dt) {
  if (Dlg.done) return;
  const before = Math.floor(Dlg.shown);
  Dlg.shown += dt * 48;
  const now = Math.floor(Dlg.shown);
  const sp = SPEAKERS[Dlg.who];
  for (let i = before; i < now && i < Dlg.text.length; i++) if (i % 2 === 0 && /[a-z]/i.test(Dlg.text[i])) Sound.blip(Dlg.text[i], sp ? sp.voice : 'ped', /[A-Z]/.test(Dlg.text[i]) ? 1.08 : 1);
  if (Dlg.shown >= Dlg.text.length) { Dlg.shown = Dlg.text.length; Dlg.done = true; const a = sp && sp.actor(); if (a && a !== P) a.talking = 0.5; }
  UI.updateDialogText();
}

function updateBits(dt) {

// Stand-up: pick a bit, deliver the setup, nail the pause, land the punchline
// ---------------------------------------------------------------------------
const Stand = {
  on: false, cold: false, phase: 'none', t: 0, jokes: [], idx: 0, heat: 0, meter: 0, hand: [], deck: [], current: null, slots: 5, heckled: false, needle: 0, total: 0,
  begin(cold) {
    this.on = true; this.cold = cold; this.idx = 0; this.heat = 0; this.meter = 0.25; this.total = 0; this.heckled = false; this.results = [];
    G.mode = 'standup'; P.stage = true; P.locked = true; placePlayer(21, -24.3, 0); P.pos.y = 0.65;
    W.club.inside = true;
    Sound.play('club');
    if (cold) { this.deck = COLD_OPEN.slice(); this.slots = 2; }
    else {
      this.deck = [];
      for (const k of ['broth', 'wheel', 'env']) if (G.threads[k].stage >= 3) this.deck.push(Object.assign({ cb: true }, CALLBACKS[k]));
      for (const b of BITS) if (G.bits.has(b.id)) this.deck.push(Object.assign({}, b));
      for (const f of FILLER) this.deck.push(Object.assign({ filler: true }, f));
      this.slots = 5;
      this.meter = clamp(0.3 - G.awk * 0.04 + G.likes * 0.02, 0.1, 0.5);
    }
    UI.stageShow(true);
    this.phase = 'intro'; this.t = 1.2;
    UI.stageText(cold ? '' : 'The lights come up. The crowd is… a crowd.');
  },
  drawHand() {
    // 4 cards: best callbacks and bits first, filler fills the gaps
    const sorted = this.deck.slice().sort((a, b) => (b.stars + (b.cb ? 1 : 0)) - (a.stars + (a.cb ? 1 : 0)) + (Math.random() - 0.5) * 0.8);
    this.hand = sorted.slice(0, 4);
  },
  update(dt, IN) {
    this.t -= dt;
    UI.laughMeter(this.meter);
    this.meter = Math.max(0.05, this.meter - dt * 0.01);
    if (this.phase === 'intro') {
      if (this.t <= 0) this.nextJoke();
    } else if (this.phase === 'pick') {
      const btns = ['cross', 'circle', 'square', 'triangle'];
      let i = btns.findIndex((b) => IN.pressed[b]);
      if (G.attract && this.t < 0) i = 0;
      if (i >= 0 && this.hand[i]) {
        Sound.sfx('select'); this.current = this.hand[i]; this.deck = this.deck.filter((c) => c !== this.current); UI.bitCards(null);
        this.startSetup();
      }
    } else if (this.phase === 'setup') {
      this.typed += dt * 34;
      const n = Math.floor(this.typed), txt = this.current.setup;
      for (let k = this.lastTyped; k < n && k < txt.length; k++) if (k % 2 === 0 && /[a-z]/i.test(txt[k])) Sound.blip(txt[k], 'barry');
      this.lastTyped = n;
      UI.stageText(esc(txt.slice(0, n)));
      if (n >= txt.length || IN.pressed.circle) { UI.stageText(esc(txt)); this.phase = 'beat'; this.t = 0; this.needle = 0; UI.timing(0); UI.timingLbl(`${Input.glyph('cross')} Hit the pause, then the punchline!`); }
    } else if (this.phase === 'beat') {
      this.needle = Math.min(1.05, -this.t / 1.6);
      UI.timing(this.needle);
      const auto = G.attract && this.needle > 0.66;
      if (IN.pressed.cross || auto || this.needle >= 1.05) this.deliver(this.needle >= 1.05 ? 1.1 : this.needle);
    } else if (this.phase === 'punch') {
      if (this.t <= 0) { UI.verdict(''); this.idx++; if (!this.cold && this.idx === 2 && !this.heckled) this.startHeckle(); else this.nextJoke(); }
    } else if (this.phase === 'heckle') {
      UI.qteBar(this.t / 4.5);
      const btns = ['cross', 'circle', 'square'];
      let i = btns.findIndex((b) => IN.pressed[b]);
      if (G.attract && this.t < 3.2) i = 1;
      if (i >= 0 || this.t <= 0) this.resolveHeckle(i);
    } else if (this.phase === 'heckleDone') {
      if (this.t <= 0) { UI.verdict(''); UI.stageText(''); this.nextJoke(); }
    } else if (this.phase === 'outro') {
      if (this.t <= 0) this.finish();
    }
  },
  nextJoke() {
    if (this.idx >= this.slots || (!this.cold && !this.deck.length)) {
      this.phase = 'outro'; this.t = 3.2; UI.timing(null); UI.timingLbl('');
      UI.stageText(this.cold ? "Thank you! You've been… a room!" : "That's my time! You've been great. Mostly the left side. Goodnight!");
      Sound.applause(clamp(this.meter + 0.3, 0.4, 1.2), 3); audienceReact(this.meter); playerOnce('bow');
      return;
    }
    if (this.cold) { this.current = COLD_OPEN[this.idx]; this.startSetup(); return; }
    this.drawHand(); this.phase = 'pick'; this.t = 2.4;
    UI.stageText(`Bit ${this.idx + 1} of ${this.slots} — pick your material`);
    UI.bitCards(this.hand);
  },
  startSetup() { this.phase = 'setup'; this.typed = 0; this.lastTyped = 0; UI.timing(null); UI.timingLbl(''); },
  deliver(n) {
    let grade, mult;
    if (n >= 0.6 && n <= 0.76) { grade = 'PERFECT TIMING!'; mult = 1.5; this.heat++; G.perfects++; }
    else if (n >= 0.46 && n <= 0.88) { grade = 'GOOD'; mult = 1.0; this.heat++; }
    else if (n < 0.46) { grade = 'STEPPED ON IT'; mult = 0.4; this.heat = 0; }
    else { grade = 'DEAD AIR…'; mult = 0.35; this.heat = 0; }
    const c = this.current;
    const base = c.cb ? 220 : [0, 60, 110, 170, 220][c.stars] || 80;
    const crowd = clamp(1 - G.awk * 0.06, 0.6, 1.1);
    const pts = Math.round(base * mult * (1 + Math.min(this.heat, 5) * 0.1) * crowd * (this.cold ? 0.5 : 1));
    const inten = clamp((pts / 260) * (mult > 0.5 ? 1 : 0.4), 0.15, 1.4);
    this.meter = clamp(this.meter + (mult > 0.5 ? 0.12 + inten * 0.1 : -0.12), 0.05, 1);
    UI.timing(null); UI.timingLbl(''); UI.verdict(grade);
    UI.stageText(`<b>${esc(c.punch)}</b>`);
    Sound.sfx('mic');
    let k = 0; const it = setInterval(() => { if (k >= c.punch.length) return clearInterval(it); if (/[a-z]/i.test(c.punch[k])) Sound.blip(c.punch[k], 'barry', 1.1); k += 2; }, 32);
    later(() => { if (mult > 0.5) { Sound.laugh(inten, 1.8 + inten * 1.4); audienceReact(inten); if (inten > 0.9) Sound.applause(inten * 0.6, 1.5); } else Sound.sfx('crickets'); }, 650);
    G.jokesTold++; this.total += pts; G.laughs += pts;
    if (!G.bestJoke || pts > G.bestJoke.pts) G.bestJoke = { title: c.title || 'Cold open', pts };
    if (G.session && AIHub.active) AIHub.progress({ score: G.laughs, label: `On stage · bit ${this.idx + 1}` });
    playerOnce(mult > 0.5 ? 'shrug' : 'stagger');
    this.phase = 'punch'; this.t = 3.4;
  },
  startHeckle() {
    this.heckled = true; this.phase = 'heckle'; this.t = 4.5;
    const lines = ['You call that a JOKE? My mailman is funnier!', 'Boooo! Do the one about the soup!', "Hey Feld! What's the deal with your SHIRT?"];
    UI.verdict('HECKLER!'); Sound.sfx('gasp');
    UI.stageText(`<i>HECKLER (SMUG):</i> "${esc(pick(lines))}"`);
    UI.qteOpts('Comeback!', [['cross', '"Sir, I\'m sorry you feel that way."'], ['circle', '"I remember my first beer too."'], ['square', '"What IS the deal with my shirt?"']], true);
  },
  resolveHeckle(i) {
    UI.qteHide();
    if (i === 1) { UI.verdict('DESTROYED HIM!'); UI.stageText('The heckler sits down. He orders a third drink. Respect.'); Sound.laugh(1.2, 3); Sound.applause(0.8, 2); audienceReact(1.2); this.meter = clamp(this.meter + 0.25, 0, 1); G.laughs += 200; this.total += 200; this.heat++; }
    else if (i === 2) { UI.verdict('DECENT SAVE'); UI.stageText("You riff on your own shirt. It's… fine. Shirt-adjacent."); Sound.laugh(0.5, 1.6); audienceReact(0.5); G.laughs += 80; this.total += 80; }
    else { UI.verdict('OOF.'); UI.stageText(i === 0 ? 'Sincerity. At a comedy club. The crowd winces in unison.' : 'You froze. The heckler takes a bow.'); Sound.sfx('crickets'); this.meter = clamp(this.meter - 0.15, 0.05, 1); this.heat = 0; }
    this.phase = 'heckleDone'; this.t = 2.8;
  },
  finish() {
    this.on = false; UI.stageShow(false); P.stage = false; P.locked = false;
    if (this.cold) { coldOpenDone(); return; }
    tagScene();
  },
};

function coldOpenDone() {
  G.laughs = Math.round(G.laughs);
  sceneCard('Seinfeld-ish', 'Episode 1 · "The Gouda, the Lentil and the Letter"', () => {
    W.club.inside = false;
    G.intro = 'apt'; G.clock = DAY_START;
    placePlayer(-41.2, -16.2, Math.PI / 2); G.mode = 'free';
    Cam.snap = true; Sound.play('apartment');
    sceneCard("Barry's Apartment", 'Tuesday · 9:00 AM', () => { aptIntro(); }, 2.2, true);
  }, 3.2);
}
function aptIntro() {
  G.mode = 'cutscene';
  talk([['think', 'Nine A.M. A whole day with absolutely nothing planned. This is the dream.']], () => {
    G.mode = 'cutscene';
    // Krebs bursts in
    Sound.sfx('door'); Sound.stinger(0);
    const d = W.aptDoor; d.userData.open = 1;
    NPC.krebs.setVisible(true); NPC.krebs.teleport(-24.9, -15.8, -Math.PI / 2);
    NPC.krebs.once('slide', 1.4); NPC.krebs.goTo([[-28.2, -15.8]], 3.0);
    Sound.laugh(0.6, 1.6);
    later(() => {
      NPC.krebs.lookAt = P.pos;
      talk(S.kreb(), () => {
        G.threads.wheel.stage = 1; threadToast('The Wheel', "Roll Krebs's 100-lb Gouda from the truck (east end) to the building door.");
        NPC.krebs.goTo([[-28.2, -15.8], [-25.0, -15.8]], 2.4);
        NPC.krebs.onArrive = () => { NPC.krebs.setVisible(false); W.aptDoor.userData.open = 0; Sound.sfx('door'); NPC.krebs.teleport(-35.4, -7.6, Math.PI); NPC.krebs.setVisible(true); };
        G.intro = 'machine'; G.mode = 'free';
        later(() => { Sound.sfx('phone'); toast('The answering machine is blinking.'); }, 1500);
      });
    }, 1500);
  });
}
function startFinale(forced) {
  if (G.mode === 'standup' || G.over || G.finaleStarted) return;
  G.finaleStarted = true;
  Soup.phase !== 'none' && Soup.end();
  if (Dlg.on) dlgEnd();
  G.mode = 'cutscene';
  sceneCard('The Chuckle Cellar', forced ? '6:00 PM · Showtime. Ready or not.' : `${clockStr().join(' ')} · Showtime`, () => {
    Stand.begin(false); Sound.applause(0.7, 2.5);
    talk(S.intro(), () => { G.mode = 'standup'; });
  }, 2.6);
}
function tagScene() {
  G.mode = 'cutscene';
  sceneCard("Pete's", 'Later that night', () => {
    W.club.inside = false;
    placePlayer(-5, -20.4, Math.PI); P.yaw = Math.PI; Cam.snap = true;
    NPC.krebs.setVisible(true); NPC.krebs.teleport(-3.0, -19.6, -2.4); NPC.krebs.pose = 'idle';
    Sound.play('diner');
    const T = G.threads, lines = [];
    lines.push(T.broth.stage >= 3 ? ['stanley', 'Marcy believed me! She brought ME soup. Now I have two soups. I\'m a soup baron.'] : ['stanley', "No soup. Marcy figured it out. She says I'm not sick, I'm 'sick in the head.' Which — fair."]);
    lines.push(T.env.stage >= 3 ? ['elena', 'My boss got a lovely letter from me. Well, he will never get it. But it exists. Spiritually.'] : ['elena', 'My boss read the letter. He shaved the mustache. Now he wants to PROMOTE me. I hate everything.']);
    lines.push(T.wheel.stage >= 3 ? ['krebs', "The Gouda's in my closet. She's not leaving. I'm thinking of giving her a name. Something strong. Brenda."] : ['krebs', 'The Gouda rolled into the river. A tugboat has her now. Good for the tugboat.']);
    lines.push(['barry', Stand.total > 700 ? 'I killed tonight, by the way. Nobody asked, but I killed.' : 'The set went… fine. A man in the back laughed. At something. Possibly me.']);
    lines.push(['elena', 'So the whole day was about…']);
    lines.push(['stanley', 'Nothing.']);
    lines.push(['barry', 'Absolutely nothing.']);
    lines.push(['krebs', 'Best day of my life!']);
    talk(lines, () => { Sound.stinger(0); later(() => endEpisode(), 900); });
  }, 2.2);
}
function endEpisode() {
  G.over = true; G.mode = 'results'; UI.hud(false); UI.prompt('');
  if (G.session && AIHub.active) reportResult();
  UI.results();
  Sound.play('finale');
}
function reportResult() {
  if (G.reported) return; G.reported = true;
  const awards = [];
  if (threadsDone() === 3) awards.push({ title: 'Tied It All Together', detail: 'Finished all three threads' });
  if (G.perfects >= 3) awards.push({ title: 'Impeccable Timing', detail: `${G.perfects} perfect punchlines` });
  if (G.bits.size >= 10) awards.push({ title: 'Noticer of Things', detail: `${G.bits.size} observations` });
  AIHub.result({ score: G.laughs, stats: { threads: threadsDone(), bits: G.bits.size, 'perfect beats': G.perfects, awkward: G.awk, 'best bit': G.bestJoke ? String(G.bestJoke.title).slice(0, 16) : '—' }, awards: awards.slice(0, 3) });
}

  if (T.broth.stage === 2) list.push(o('THE LENTIL', 'Bring the soup to Stanley at Pete\'s', V3(-5, 0, -20.5)));

de and stranded the player in a stand-up set with no menu.\n- **Stale timers could fire after a reset.** Scene-card timers from a reset episode kept running; they're now tied to the episode that set them.\n- **Skipping the answering machine stalled the opening.** The first objective never advanced if you went straight to Stanley and Elena.\n- **Keys could be missed at very low frame rates.** Short taps were lost, and two quick taps of the same key counted as one.\n\n**How it plays:** one day on one city block, 9 AM to a 6 PM stand-up set.\n- **Three errands for friends:**\n  - **The Lentil:** get soup for Stanley from the Broth Baron, who enforces strict ordering rules; break one and you're banned for an hour.\n  - **The Wheel:** roll Krebs's 100-lb Gouda down the street with real physics.\n  - **The Letter:** sneak Elena's letter out of Norbert's mail cart. Norbert, the postman, has a visible view cone; you can hide behind a newspaper or throw things to distract him.\n- **Banter:** conversations offer four tones on the four face buttons, and each character likes and hates different ones.\n- **Bits:** 13 odd things to notice around the block; each becomes a joke for the finale.\n- **The set:** pick jokes from your hand and press on the pause before the punchline; a heckler interrupts mid-set.\n- **Cameras:** third-person by default; you can switch to a fixed sitcom multi-cam or first-person.\n- **Attract demo:** an AI plays the real game after 10 s idle on the title.\n- **Online:** AI Hub side-by-side mode for 1–4 players, ranked by laughs.\n\n## Source Information\n- **Date:** 2026-11-01 18:43\n- **Source:** Seinfeld (TV Show)\n- **Genre and Perspective:** Third-person social-comedy adventure (errands, banter, social stealth, physics slapstick, stand-up timing finale). Main camera: third-person chase; switchable (R3 / V) to Sitcom Multi-Cam and First-Person.\n- **Tech:** Three.js r180 (`three/webgpu` WebGPURenderer, automatic WebGL 2 fallback), Rapier 0.19.3 (rapie the indoor sets.\n  - A caption overlapping the joke cards.\n  - The title menu left open when an episode started.\n  - The opening objective stalling if you skipped the answering machine.\n  - The demo-exit press also starting a new episode.\n  - Scene-card timers from a reset episode firing later.\n  - Two quick taps of the same key counting as one.\n- **Critical:** 2. The pay timer soft-locked the soup errand and the demo, and leaving the demo stranded you in a stand-up set with no menu.\n- **Most helpful test:** letting the attract AI play the whole episode with stepped simulation.\n- **Least helpful test:** offscreen screenshots. After the first capture, headless Chromium stops firing animation frames, so later shots showed a frozen camera.\n\n## Engine Feedback\n- **Liked most:** the WebGPU renderer takes ordinary materials, shadows and AnimationMixer unchanged and falls back to WebGL 2 by itself. Rapier's character controller pushes dynamic bodies for free, which is the entire Gouda-wheel errand.\n- **Stuck or guessed wrong:** Rapier 0.19's raycast filter arguments and character-controller API needed care. WebGPU canvases screenshot blank headless, so tests render offscreen and read the pixels back.\n- **Most important thing I built:** the dialogue and banter system with each character's tastes, the stand-up timing system, and the attract AI that plays the real game loop.\n- **Hardest part:** cameras inside the cut-away sets: fixed sitcom angles, two-person framing during conversations, and camera collision that ignores the hidden front wall.\n- **Remove or overhaul:** the split between the `three` and `three/webgpu` entry points, which complicates import maps and bundling.\n- **Change one thing:** a documented way to capture WebGPU canvases headless.\n\n## Prompt Feedback\n- **Liked most:** firm UX rules (controller-first, attract mode, invert toggles, touch fallback) combined with full freedom on genre.\n- **Confusing:** what \"engine native style/animation
