<script type="module">
import * as THREE from 'three/webgpu';
import { boot } from 'kit/boot.js';
import { createPoints } from 'kit/points.js';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------- helpers
const $ = (id) => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
/** Keep the items that pass, in place (no new array every step). */
function prune(list, keep) {
  let n = 0;
  for (let i = 0; i < list.length; i++) if (keep(list[i])) list[n++] = list[i];
  list.length = n;
}
const shakeScale = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.35 : 1;

// ---------------------------------------------------------------- save data: best hits, unlocks, options
const SAVE_KEY = 'vector-vulpine.skybreak-run.v1';
const save = { best: {}, unlocked: 1, diff: 1, muted: false, retro: true };
try {
  const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (raw && typeof raw === 'object') {
    if (raw.best && typeof raw.best === 'object') for (const [k, v] of Object.entries(raw.best)) if (Number.isFinite(v)) save.best[k] = v;
    save.unlocked = raw.unlocked === 2 ? 2 : 1;
    if ([0, 1, 2].includes(raw.diff)) save.diff = raw.diff;
    save.muted = !!raw.muted;
    save.retro = raw.retro !== false;
  }
} catch {
  /* private mode or bad data: start fresh */
}
function persist() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch {
    /* storage blocked: progress lasts for this visit */
  }
}

// ---------------------------------------------------------------- boot
const kit = await boot({
  title: 'Vector Vulpine: Skybreak Run',
  gear: 'none', // the title and pause menus have a Settings button (F9 works too)
  accent: '#7ef0ff',
  background: '#030714',
  // The original drew into a 640 × 360 canvas scaled up with hard pixels; RETRO keeps that look.
  pixelHeight: save.retro ? 360 : 0,
  touch: { top: 'center', topOffset: 10 },
  input: {
    move: { type: 'vector', keys: 'wasd+arrows', gamepad: 'leftStick+dpad', touch: 'stick', clamp: false },
    fire: { keys: ['Space', 'KeyJ'], mouse: [0], gamepad: ['A', 'RT'], touch: 'Fire' },
    boost: { keys: ['ShiftLeft', 'ShiftRight', 'KeyK'], mouse: [2], gamepad: ['B', 'LT'], touch: 'Boost' },
    roll: { touch: 'Roll' },
    rollL: { keys: ['KeyQ'], gamepad: ['LB'] },
    rollR: { keys: ['KeyE'], gamepad: ['RB'] },
    pause: { keys: ['Escape', 'KeyP'], gamepad: ['Start'], touch: { label: 'II', slot: 'top' } },
    confirm: { keys: ['Enter', 'NumpadEnter'] },
    restart: { keys: ['KeyR'] },
    mute: { keys: ['KeyM'] },
  },
});
const input = kit.input;
kit.canvas.setAttribute('aria-label', 'Vector Vulpine rail shooter');

// ---------------------------------------------------------------- content
const DIFFS = [
  { id: 'cadet', name: 'CADET', dmg: 0.65, fire: 1.3, spread: 7, kite: 40, pod: 10, core: 22, note: 'Cadet: softer hits, slower and looser enemy fire, lighter bosses.' },
  { id: 'pilot', name: 'PILOT', dmg: 1, fire: 1, spread: 4.5, kite: 50, pod: 14, core: 30, note: 'Pilot: the standard run.' },
  { id: 'ace', name: 'ACE', dmg: 1.3, fire: 0.8, spread: 2.5, kite: 62, pod: 18, core: 38, note: 'Ace: harder hits, faster and sharper enemy fire, tougher bosses.' },
];
const THEMES = [
  { sky: [[0, '#142b72'], [0.54, '#47a3b8'], [0.56, '#9ad0be'], [1, '#23353a']], fog: '#7cc3c0', grid: '#8ed6c4', star: '#d8f7ff', base: '#263d45', win: '#7fe7dc', hemiSky: '#dff4ff', hemiGround: '#40606a' },
  { sky: [[0, '#1b1240'], [0.54, '#a8507a'], [0.56, '#eea27a'], [1, '#262036']], fog: '#b9707c', grid: '#ffb38a', star: '#ffe9d6', base: '#2b2a40', win: '#ffcf7a', hemiSky: '#ffd8c8', hemiGround: '#3e3050' },
];
const MISSIONS = [
  {
    name: 'AERIS CORRIDOR', sector: 'SECTOR AERIS', theme: 0, bossAt: 33, boss: 'kite', bossName: 'DREAD KITE', storm: false,
    intro: 'CONTROL: SKYBREAK-1, corridor is hot. Clear the route!',
    music: [110, 147, 165, 196, 165, 147, 123, 147],
    winMsg: 'DREAD KITE DESTROYED — AERIS CORRIDOR SECURE', winSub: 'AERIS CORRIDOR SECURE',
    text: 'Mission: break the raider corridor over Aeris City and destroy the Dread Kite carrier. Fly through cyan gate arches for shield repair. Your fighter advances automatically.',
    // The original authored pacing, step for step.
    script: [
      [1.2, () => { spawnEnemy(-18, -4, 155); spawnEnemy(20, 8, 165); }],
      [5, () => { for (let i = 0; i < 4; i++) spawnEnemy(-42 + i * 28, -14 + Math.abs(i - 1.5) * 8, 170 + i * 8); }],
      [8, () => { spawnArch(180); spawnArch(225); }],
      [12, () => { for (let i = 0; i < 5; i++) spawnEnemy(rnd(-55, 55), rnd(-20, 24), 160 + i * 16, i === 4 ? 'heavy' : 'dart'); }],
      [18, () => { spawnArch(170); for (let i = 0; i < 4; i++) spawnEnemy((i - 1.5) * 25, rnd(-18, 10), 190 + i * 12); }],
      [25, () => { for (let i = 0; i < 7; i++) spawnEnemy(rnd(-58, 58), rnd(-24, 26), 150 + i * 14, i % 3 === 0 ? 'heavy' : 'dart'); say('WING: Raider carrier is dropping into the avenue!', 2.7); }],
      [33, () => startBoss()],
    ],
  },
  {
    name: 'CIRRUS STORMLINE', sector: 'SECTOR CIRRUS', theme: 1, bossAt: 38, boss: 'heron', bossName: 'STORM HERON', storm: true,
    intro: 'CONTROL: SKYBREAK-1, storm cells over Cirrus. Raiders are mining the lane!',
    music: [98, 131, 147, 175, 147, 131, 110, 131],
    winMsg: 'STORM HERON DOWN — CIRRUS STORMLINE CLEAR', winSub: 'CIRRUS STORMLINE CLEAR',
    text: 'Mission 2: chase the raiders into the dusk storm over Cirrus Harbor. Shrikes cut across the lane, flak mines burst when they get close, and the Storm Heron bomber guards its core behind two engine pods.',
    script: [
      [1, () => { spawnEnemy(0, -6, 150); spawnEnemy(-16, 0, 160); spawnEnemy(16, 0, 160); }],
      [3.5, () => { spawnShrike(-1, 120); spawnShrike(1, 135); say('SHRIKES: fast flankers crossing the lane!', 2.4); }],
      [6.5, () => { spawnArch(185); for (let i = 0; i < 3; i++) spawnEnemy(rnd(-50, 50), rnd(-18, 20), 170 + i * 12); }],
      [10, () => { for (let i = 0; i < 4; i++) spawnMine(-36 + i * 24, rnd(-14, 18), 160 + i * 10); say('FLAK MINES: shoot them before they burst!', 2.6); }],
      [14, () => { spawnEnemy(-30, -10, 165, 'heavy'); spawnEnemy(30, -10, 165, 'heavy'); for (let i = 0; i < 4; i++) spawnEnemy(rnd(-55, 55), rnd(-20, 24), 175 + i * 12); }],
      [18.5, () => { spawnShrike(-1, 110); spawnShrike(1, 125); spawnShrike(-1, 145); spawnArch(200); }],
      [22.5, () => { for (let i = 0; i < 5; i++) spawnMine(rnd(-50, 50), rnd(-18, 22), 155 + i * 12); spawnEnemy(0, -15, 190, 'heavy'); }],
      [26.5, () => { for (let i = 0; i < 6; i++) spawnEnemy(rnd(-58, 58), rnd(-24, 26), 150 + i * 13, i % 3 === 0 ? 'heavy' : 'dart'); spawnShrike(1, 130); say('WING: Storm front ahead, the Heron is close!', 2.6); }],
      [31, () => { spawnArch(180); spawnArch(222); spawnShrike(-1, 120); }],
      [34.5, () => { for (let i = 0; i < 3; i++) spawnMine((i - 1) * 30, -4, 170 + i * 8); for (let i = 0; i < 3; i++) spawnEnemy((i - 1) * 30, 14, 185); }],
      [38, () => startBoss()],
    ],
  },
];
const HELP = {
  keyboard: [['WASD / ARROWS', 'steer'], ['SPACE / CLICK', 'pulse cannon'], ['Q / E', 'barrel roll'], ['SHIFT / RIGHT CLICK', 'boost'], ['MOUSE MOVE', 'steer toward cursor'], ['P / M / R', 'pause, mute, restart'], ['F9', 'settings']],
  gamepad: [['L STICK / D-PAD', 'steer'], ['A / RT', 'pulse cannon'], ['LB / RB', 'barrel roll'], ['B / LT', 'boost'], ['START', 'pause'], ['A / B', 'choose / back in menus']],
  touch: [['LEFT THUMB', 'steer'], ['FIRE', 'pulse cannon (hold)'], ['ROLL', 'barrel roll'], ['BOOST', 'boost'], ['II', 'pause']],
};
// World layout (the old units: x right, y down, z ahead of the camera).
const SHIP_Z = 12; // the fighter flies this far ahead of the camera (where the old shots started)
const CAM_UP = 6.5; // the camera rides this far above it, so the ship sits low on screen as in the old sprite
const SHIP_PITCH = 0.95; // tipped toward the camera so the old top-down silhouette reads
const ROLL_TIME = 0.52, ROLL_CD = 0.45;
const MAX_SHOTS = 128, MAX_ESHOTS = 160, MAX_SPARKS = 480, MAX_BUILDINGS = 64;

// ---------------------------------------------------------------- audio (starts on the first gesture)
let ac = null, master = null, noiseBuf = null;
function initAudio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
    } catch {
      return;
    }
    master = ac.createGain();
    master.gain.value = save.muted ? 0 : 1;
    master.connect(ac.destination);
    // One shared noise buffer for every blast (the old code built a new one per explosion).
    const len = Math.floor(ac.sampleRate * 0.7);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac.state !== 'running' && !kit.paused && !document.hidden) ac.resume().catch(() => {});
}
for (const type of ['pointerdown', 'keydown', 'touchend']) addEventListener(type, initAudio, true);
// A suspended context would replay queued sounds later, so nothing is scheduled then.
const audible = () => !!ac && !save.muted && ac.state === 'running';
function tone(freq, dur = 0.08, type = 'square', vol = 0.04, slide = 0, delay = 0) {
  if (!audible()) return;
  const now = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, now);
  if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, freq + slide), now + dur);
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g).connect(master);
  o.start(now);
  o.stop(now + dur + 0.02);
}
function noise(dur = 0.15, vol = 0.06) {
  if (!audible()) return;
  const now = ac.currentTime;
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = noiseBuf;
  g.gain.setValueAtTime(vol, now);
  g.gain.linearRampToValueAtTime(0.0001, now + dur);
  s.connect(g).connect(master);
  s.start(now, Math.random() * Math.max(0, noiseBuf.duration - dur), dur);
}
const soundLabel = () => 'SOUND: ' + (save.muted ? 'OFF' : 'ON');
const pixelLabel = () => 'PIXELS: ' + (save.retro ? 'RETRO' : 'SHARP');

// ---------------------------------------------------------------- scene and camera
// The old renderer drew a point at screen (W/2 + (x - player.x)·F/z, 0.48·H + (y - player.y)·F/z) with
// F = 210 on a 360-line canvas. three.js looks down -z with y up, so a game point sits at (x, -y, -z);
// the field of view reproduces F and a view offset keeps the horizon 48 % down the screen.
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x7cc3c0, 170, 400); // light haze only: softens the pop-in at the spawn line
const camera = new THREE.PerspectiveCamera(80, 16 / 9, 0.5, 420);
const view = { W: 1, H: 1, F: 210, fullH: 1, offY: 0, px: 1, fov: 80, sx: 0, sy: 0, retX: 0, retY: 0, retW: 26, retH: 18 };
const MAX_HALF_VFOV = Math.tan((55 * Math.PI) / 180);

// Screen-space sky gradient (the old canvas fill), repainted per mission.
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 2;
bgCanvas.height = 256;
const bgTex = new THREE.CanvasTexture(bgCanvas);
bgTex.colorSpace = THREE.SRGBColorSpace;
bgTex.generateMipmaps = false;
bgTex.minFilter = THREE.LinearFilter;
scene.background = bgTex;

// Faces turned to the light show close to the old flat fill colours; the rest shade darker.
const hemi = new THREE.HemisphereLight(0xdff4ff, 0x40606a, 1.5);
const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.position.set(0.35, 0.8, 1);
scene.add(hemi, sun);

// ---------------------------------------------------------------- materials (few, shared)
const matSolid = new THREE.MeshLambertMaterial({ vertexColors: true });
const matGlow = new THREE.MeshBasicMaterial({ vertexColors: true }); // unlit painted parts: cores, eyes, nozzles
const matFlash = new THREE.MeshBasicMaterial({ color: 0xffffff });
const matLine = new THREE.LineBasicMaterial({ vertexColors: true });
const matArch = new THREE.MeshLambertMaterial({ color: '#42f3f0', emissive: '#0d5553' });
const matArchUsed = new THREE.MeshLambertMaterial({ color: '#4b6170' });
const matBolt = new THREE.MeshBasicMaterial({ color: '#baffff' });
const matEShot = new THREE.MeshBasicMaterial({ color: '#ff6b4a' });
const matSpark = new THREE.MeshBasicMaterial({ color: 0xffffff });
const matFlame = new THREE.MeshBasicMaterial({ color: '#ff7a4a' });
const matGrid = new THREE.LineBasicMaterial({ color: '#8ed6c4', transparent: true, opacity: 0.28, depthWrite: false });
const FLAME = new THREE.Color('#ff7a4a'), FLAME_BOOST = new THREE.Color('#fff1a8');

// Building windows: the old single lit column of stripes, on every wall (roofs stay dark).
const winCanvas = document.createElement('canvas');
winCanvas.width = 16;
winCanvas.height = 64;
{
  const g = winCanvas.getContext('2d');
  g.fillStyle = '#000';
  g.fillRect(0, 0, 16, 64);
  g.fillStyle = '#fff';
  for (let y = 3; y < 62; y += 5) g.fillRect(4, y, 2, 1);
}
const winTex = new THREE.CanvasTexture(winCanvas);
winTex.colorSpace = THREE.SRGBColorSpace;
winTex.magFilter = THREE.NearestFilter;
const matBuilding = new THREE.MeshLambertMaterial({ color: '#263d45', emissive: '#7fe7dc', emissiveMap: winTex });

// ---------------------------------------------------------------- low-poly models (flat colours per part, like the old polygons)
const _c = new THREE.Color();
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
/** Flat normals and one colour on a non-indexed geometry. */
function paint(geo, hex) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  if (g !== geo) geo.dispose();
  g.clearGroups();
  if (g.attributes.uv) g.deleteAttribute('uv');
  g.computeVertexNormals();
  const n = g.attributes.position.count, col = new Float32Array(n * 3);
  _c.set(hex);
  for (let i = 0; i < n; i++) {
    col[i * 3] = _c.r;
    col[i * 3 + 1] = _c.g;
    col[i * 3 + 2] = _c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}
/** A flat polygon (x, y with y up) extruded along z and centred on z = 0. */
function slab(points, depth) {
  const shape = new THREE.Shape(points.map(([x, y]) => new THREE.Vector2(x, y)));
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
  g.translate(0, 0, -depth / 2);
  return g;

  if (Math.abs(b.x - e.x) < 46 && Math.abs(b.y - e.y) < 9) {

    burst(b.x, b.y, e.z - 3, 2, WHITE, WHITE, 8, 0.08, 0.18);
    return true;
  }
  return false;
}
function music(dt) {
  musicT -= dt;
  if (musicT > 0) return;
  musicT += 0.5;
  const seq = MISSIONS[mission].music, f = seq[musicStep % seq.length];
  tone(f, 0.12, 'sawtooth', 0.012);
  if (boss && musicStep % 2 === 0) tone(f * 2, 0.06, 'square', 0.006);
  musicStep++;
}

// ---------------------------------------------------------------- simulation (fixed 60 Hz)
const shotAlive = (b) => !b.dead && b.z < 260;
const eshotAlive = (b) => !b.dead && b.z > -4;
const towerAlive = (b) => b.z > -15;
const sparkAlive = (p) => p.life > 0;
function controlShip(dt) {
  const P = player;
  P.vx += (ctl.dx * 62 - P.vx) * Math.min(1, dt * 5);
  P.vy += (ctl.dy * 46 - P.vy) * Math.min(1, dt * 5);
  P.x = clamp(P.x + P.vx * dt, -65, 65);
  P.y = clamp(P.y + P.vy * dt, -33, 35);
  // Boost runs on a gauge (the old one never ran out); an empty gauge must refill a third first.
  if (ctl.boost && !P.boostLock && P.boost > 0) {
    if (!P.boosting) tone(180, 0.15, 'sawtooth', 0.02, 120);
    P.boosting = true;
    P.boost = Math.max(0, P.boost - 55 * dt);
    if (P.boost <= 0) P.boostLock = true;
  } else {
    P.boosting = false;
    P.boost = Math.min(100, P.boost + 22 * dt);
    if (P.boostLock && P.boost >= 35) P.boostLock = false;
  }
  // Barrel roll: one per press, with a short cooldown (holding Q used to chain rolls into permanent invulnerability).
  if (P.roll > 0) {
    P.roll -= dt;
    if (P.roll <= 0) {
      P.roll = 0;
      P.rollCd = ROLL_CD;
    }
  } else if (P.rollCd > 0) P.rollCd -= dt;
  // A press during a roll or its cooldown is kept for 0.2 s, so a slightly early tap still rolls.
  if (ctl.rollTap) {
    if (P.roll <= 0 && P.rollCd <= 0) {
      P.roll = ROLL_TIME;
      P.rollDir = ctl.rollTap;
      ctl.rollTap = 0;
      tone(250, 0.2, 'sawtooth', 0.025, 300);
      input.rumble(0.2, 80);
    } else if ((ctl.rollAge += dt) > 0.2) ctl.rollTap = 0;
  }
  P.fireCd -= dt;
  if (ctl.fire) shoot();
  alarmT -= dt;
  if (P.shield < 30 && alarmT <= 0) {
    alarmT = 1.1;
    tone(880, 0.07, 'square', 0.016);
  }
}

function update(dt) {
  const P = player, M = MISSIONS[mission];
  t += dt;
  if (msgT > 0) msgT -= dt;
  if (outro) {
    outro.t -= dt;
    if (outro.t <= 0) {
      finish(outro.won);
      return;
    }
  }
  if (!save.muted) music(dt);
  P.inv -= dt;
  if (P.alive && !outro) controlShip(dt);
  else {
    P.boosting = false;
    ctl.rollTap = 0;
  }
  if (P.roll > 0 && !P.alive) P.roll = 0;
  const speed = worldSpeed();

  const script = M.script;
  while (cursor < script.length && t >= script[cursor][0]) script[cursor++][1]();
  if (M.storm) {
    stormT -= dt;
    if (stormT <= 0) {
      stormT = rnd(6, 11);
      flash = Math.max(flash, 0.14);
      noise(0.6, 0.025);
    }
  }

  const firing = P.alive && !outro;
  for (const o of objs) {
    if (o.dead) continue;
    if (o.hitT > 0) o.hitT -= dt;
    o.phase += dt;
    switch (o.kind) {
      case 'arch':
        o.z -= speed * dt;
        if (!o.passed && o.z < SHIP_Z + 4) gateCheck(o);
        break;
      case 'mine':
        o.z -= speed * o.sp * dt;
        o.x += Math.sin(o.phase * 1.3) * 3 * dt;
        o.y += Math.cos(o.phase * 1.7) * 2 * dt;
        if (o.z < 48 && firing) detonate(o);
        break;
      case 'shrike':
        o.z -= speed * 0.55 * dt;
        o.x += o.vx * dt;
        o.y += Math.sin(o.phase * 2) * 4 * dt;
        o.shot -= dt;
        if (o.shot < 0 && o.z < 140 && o.z > 30 && Math.abs(o.x) < 70 && firing) {
          o.shot = rnd(0.9, 1.5) * diff.fire;
          enemyShot(o.x, o.y, o.z);
          tone(220, 0.06, 'square', 0.014, -70);
        }
        break;
      default: // the original raiders: dart and heavy
        o.z -= speed * dt;
        o.x += Math.sin(o.phase * 2.4) * 7 * dt;
        o.y += Math.cos(o.phase * 1.8) * 3 * dt;
        o.shot -= dt;
        if (o.shot < 0 && o.z < 135 && o.z > 35 && firing) {
          o.shot = rnd(1.1, 2.3) * diff.fire;
          enemyShot(o.x, o.y, o.z);
          tone(180, 0.07, 'square', 0.015, -50);
        }
    }
    // Raiders that reach the ship ram it (the old ones flew straight through).
    if (!o.dead && !o.checked && o.z < SHIP_Z + 2) {
      o.checked = true;
      if (firing && Math.abs(o.x - P.x) < 8 && Math.abs(o.y - P.y) < 6 && damage(10)) {
        o.dead = true;
        explode(o.x, o.y, o.z, 8);
      }
    }
  }

  for (const b of bullets) {
    b.z += 150 * dt;
    for (const o of objs) {
      if (o.dead || o.kind === 'arch') continue;
      const hx = o.kind === 'mine' ? 5.5 : 7, hy = o.kind === 'mine' ? 5.5 : 6;
      if (Math.abs(b.z - o.z) < 10 && Math.abs(b.x - o.x) < hx && Math.abs(b.y - o.y) < hy) {
        b.dead = true;
        landed++;
        o.hp--;
        o.hitT = 0.08;
        if (o.hp <= 0) killEnemy(o);
        else {
          burst(b.x, b.y, o.z, 3, WHITE, CYAN, 12, 0.1, 0.3);
          tone(240, 0.03, 'square', 0.015);
        }
        break;
      }
    }
    if (b.dead || !boss) continue;
    if (boss.kind === 'kite') {
      if (Math.abs(b.z - boss.z) < 13 && Math.abs(b.x - boss.x) < 24 && Math.abs(b.y - boss.y) < 15) {
        b.dead = true;
        landed++;
        boss.hp--;
        boss.hitT = 0.06;
        tone(110, 0.04, 'square', 0.02, 40);
        if (boss.hp <= 0) killBoss();
      }
    } else heronHit(b);
  }
  prune(bullets, shotAlive);

  for (const b of ebullets) {
    b.z -= 95 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (!b.checked && b.z < SHIP_Z + 2) {
      b.checked = true;
      if (firing && Math.abs(b.x - P.x) < 7 && Math.abs(b.y - P.y) < 7) {
        b.dead = true;
        if (P.roll > 0) {
          // The roll turns shots aside, with a spark to show it.
          burst(b.x, b.y, b.z, 5, CYAN, WHITE, 14, 0.15, 0.35);
          tone(520, 0.04, 'square', 0.02);
        } else damage(9);
      }
    }
  }
  prune(ebullets, eshotAlive);

  if (boss) {
    const e = boss;
    e.phase += dt;
    if (e.hitT > 0) e.hitT -= dt;
    if (e.kind === 'kite') {
      e.z = Math.max(72, e.z - speed * 0.34 * dt);
      e.x = Math.sin(e.phase * 0.7) * 34;
      e.y = -7 + Math.sin(e.phase * 1.2) * 7;
      e.shot -= dt;
      if (e.shot < 0 && e.z < 130 && firing) {
        e.shot = 0.55 * diff.fire;
        for (let a = -1; a <= 1; a++) enemyShot(e.x + a * 13, e.y + 7, e.z - 5, a * 16);
        tone(140, 0.08, 'square', 0.02, -30);
      }
    } else {
      e.z = Math.max(80, e.z - speed * 0.34 * dt);
      e.x = Math.sin(e.phase * 0.55) * 30;
      e.y = -6 + Math.sin(e.phase * 1.1) * 6;
      for (const p of e.pods) if (p.hitT > 0) p.hitT -= dt;
      if (e.open) e.openT = Math.min(1, e.openT + dt * 2.5);
      e.shot -= dt;
      if (e.shot < 0 && e.z < 140 && firing) {
        if (!e.open) {
          let p = e.pods[e.next];
          if (p.hp <= 0) {
            e.next ^= 1;
            p = e.pods[e.next];
          }
          e.next ^= 1;
          enemyShot(e.x + p.ox, e.y, e.z - 5);
          e.shot = 0.5 * diff.fire;
          tone(200, 0.06, 'square', 0.016, -60);
        } else {
          for (let k = -2; k <= 2; k++) enemyShot(e.x, e.y - 1.6, e.z - 5, k * 22, 1);
          e.shot = 0.9 * diff.fire;
          tone(130, 0.1, 'sawtooth', 0.025, -40);
        }
      }
      if (e.open && firing) {
        e.mineT -= dt;
        if (e.mineT <= 0) {
          e.mineT = 3.2 * diff.fire;
          spawnMine(e.x + rnd(-8, 8), e.y + 4, e.z - 8, 0.45); // dropped mines drift: about a second to shoot them
        }
      }
    }
  }

  // Remove what is gone; meshes go back to their pools.
  let n = 0;
  for (let i = 0; i < objs.length; i++) {
    const o = objs[i];
    if (!o.dead && o.z > -15 && Math.abs(o.x) < 115) objs[n++] = o;
    else release(o.kind, o.mesh);
  }
  objs.length = n;
}

/** Scenery, sparks and stars keep moving on the title and results screens; a pause freezes them. */
let scroll = 0, buildT = 0, clock = 0;
function spawnBuildings(z) {
  for (const side of [-1, 1]) {
    if (buildings.length >= MAX_BUILDINGS) return;
    const h = rnd(10, 40);
    // The old towers floated 8 units above the grid; now they stand on it with the same rooftops.
    buildings.push({ x: side * rnd(76, 115), z, w: rnd(8, 18), h: h + 8, d: rnd(8, 18), yc: GROUND - (h + 8) / 2 });
  }
}
for (let z = 0; z < 180; z += 52 / 3) spawnBuildings(z);
function scenery(dt) {
  clock += dt;
  const speed = worldSpeed();
  scroll += speed * dt;
  buildT += (dt * speed) / 52;
  while (buildT >= 1 / 3) {
    buildT -= 1 / 3;
    spawnBuildings(180);
  }
  for (const b of buildings) b.z -= speed * dt;
  prune(buildings, towerAlive);
  for (const p of particles) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    p.vy += 10 * dt;
  }
  prune(particles, sparkAlive);
  if (flash > 0) flash = Math.max(0, flash - dt * 4);
  if (shake > 0) shake = Math.max(0, shake - dt);
}

// ---------------------------------------------------------------- flow: start, pause, results
const panel = $('panel'), card = $('card'), topBtns = $('topBtns'), pauseBtn = $('pauseBtn');
let panelShown = false, panelAt = 0, acc = 0;
let camX = 0, camY = -CAM_UP, camRoll = 0, boostK = 0;

function clearWorld(keepSparks = false) {
  for (const o of objs) release(o.kind, o.mesh);
  objs.length = bullets.length = ebullets.length = 0;
  if (!keepSparks) particles.length = 0;
  boss = null;
  outro = null;
}
function startMission(i) {
  initAudio();
  mission = i;
  diff = DIFFS[save.diff];
  clearWorld();
  player = basePlayer();
  t = hits = shake = flash = msgT = 0;
  fired = landed = gates = dmgTaken = 0;
  cursor = 0;
  bossStarted = false;
  won = false;
  musicT = musicStep = alarmT = 0;
  stormT = 6;
  Object.assign(ctl, { dx: 0, dy: 0, fire: false, boost: false, rollTap: 0, rollAge: 0 });
  mouseSteer = false;
  acc = 0;
  applyTheme(MISSIONS[i].theme);
  state = 'play';
  paused = false;
  hidePanel();
  say(MISSIONS[i].intro, 3);
  input.settle();
}
function goTitle() {
  clearWorld();
  state = 'title';
  paused = false;
  player = basePlayer();
  applyTheme(0);
  renderTitle('start0');
}
function openPause() {
  if (state !== 'play' || paused) return;
  paused = true;
  const M = MISSIONS[mission];
  showPanel(
    `<h1>PAUSED</h1><div class="sub">MISSION ${mission + 1} // ${M.name} · ${diff.name}</div>
    <div class="col"><button class="primary" data-act="resume">RESUME</button><button data-act="restart">RESTART MISSION</button><button data-act="settings">SETTINGS</button><button data-act="pixels">${pixelLabel()}</button><button data-act="mute">${soundLabel()}</button><button data-act="title">QUIT TO TITLE</button></div>
    <div class="controls" id="keys"></div>
    <div class="small">P / ESC / START or RESUME to continue.</div>`,
    'resume'
  );
}
function resume() {
  if (state !== 'play' || !paused) return;
  paused = false;
  hidePanel();
  input.settle();
}
function finish(win) {
  const M = MISSIONS[mission];
  const time = t;
  clearWorld(true);
  state = 'end';
  won = win;
  const key = `${mission}-${diff.id}`;
  const prev = save.best[key] || 0;
  const isBest = hits > prev;
  if (isBest) save.best[key] = hits;
  const unlockedNow = win && mission === 0 && save.unlocked < 2;
  if (win && mission === 0) save.unlocked = 2;
  persist();
  const accuracy = fired ? Math.round((landed / fired) * 100) : 0;
  const next = win && mission === 0;
  const pad = (v) => String(v).padStart(3, '0');
  showPanel(
    `<h1 class="${win ? 'won' : 'lost'}">${win ? 'MISSION COMPLETE' : 'MISSION FAILED'}</h1>
    <div class="sub">${win ? M.winSub : 'FIGHTER DOWN'} · ${diff.name}</div>
    <div class="stats"><span>Hits</span><b>${pad(hits)}</b><span>Accuracy</span><b>${accuracy}%</b><span>Gates synced</span><b>${gates}</b><span>Shield left</span><b>${Math.round(Math.max(0, player.shield))}%</b><span>Flight time</span><b>${time.toFixed(1)} s</b><span>Best · ${diff.name}</span><b>${pad(Math.max(hits, prev))}${isBest && hits > 0 ? ' <em class="new">NEW BEST</em>' : ''}</b></div>
    ${unlockedNow ? '<div class="new">MISSION 2 · CIRRUS STORMLINE UNLOCKED</div>' : ''}
    <div class="btns">${next ? '<button class="primary" data-act="next">CONTINUE · MISSION 2</button><button data-act="again">REPLAY</button>' : `<button class="primary" data-act="again">${win ? 'REPLAY' : 'RETRY'}</button>`}<button data-act="title">TITLE</button></div>
    <div class="small">HITS ${pad(hits)} — PRESS R TO REPLAY</div>`,
    next ? 'next' : 'again'
  );
  if (win) {
    tone(330, 0.22, 'square', 0.04, 220);
    tone(495, 0.3, 'square', 0.04, 220, 0.18);
  } else tone(180, 0.7, 'sawtooth', 0.05, -140);
}
function renderTitle(focusAct) {
  const d = DIFFS[save.diff];
  const best = (i) => String(save.best[`${i}-${d.id}`] || 0).padStart(3, '0');
  showPanel(
    `<h1>VECTOR VULPINE</h1><div class="sub">SKYBREAK RUN</div>
    <div class="controls" id="keys"></div>
    <div class="small">${MISSIONS[0].text}</div>
    <div class="mission"><button class="primary" data-act="start0">LAUNCH · MISSION 1 · AERIS CORRIDOR</button><span class="best">BEST ${best(0)}</span></div>
    <div class="mission">${save.unlocked >= 2 ? `<button data-act="start1">LAUNCH · MISSION 2 · CIRRUS STORMLINE</button><span class="best">BEST ${best(1)}</span>` : '<div class="locked">MISSION 2 · CIRRUS STORMLINE · clear Mission 1 to unlock</div>'}</div>
    <div class="btns"><button data-act="diff">DIFFICULTY: ${d.name}</button><button data-act="pixels">${pixelLabel()}</button><button data-act="settings">SETTINGS</button><button data-act="mute">${soundLabel()}</button></div>
    <div class="small">${d.note} Best hits are saved on this device.</div>`,
    focusAct
  );
}
function fillKeys() {
  const keys = card.querySelector('#keys');
  if (!keys) return;
  const rows = HELP[input.source] || HELP.keyboard;
  keys.innerHTML = rows.map(([k, v]) => `<div><span class="key">${k}</span> — ${v}</div>`).join('');
}
input.onSourceChange(() => {
  if (panelShown) fillKeys();
});
function showPanel(html, focusAct) {
  card.innerHTML = html;
  panel.hidden = false;
  panelShown = true;
  panelAt = performance.now();
  kit.touch?.suspend(true, 'panel');
  fillKeys();
  panel.scrollTop = 0;
  if (input.source !== 'touch') {
    const b = card.querySelector(`[data-act="${focusAct}"]`) || card.querySelector('.primary');
    b?.focus({ preventScroll: true });
  }
}
function hidePanel() {
  panel.hidden = true;
  panelShown = false;
  kit.touch?.suspend(false, 'panel');
  if (panel.contains(document.activeElement)) document.activeElement.blur();
}
function toggleMute() {
  save.muted = !save.muted;
  persist();
  if (master) master.gain.value = save.muted ? 0 : 1;
  if (!save.muted) {
    initAudio();
    tone(440, 0.05, 'square', 0.02);
  }
  for (const b of card.querySelectorAll('[data-act="mute"]')) b.textContent = soundLabel();
}
function retroLines() {
  // Keep the old pixel size: 360 lines on a 16:9 or wider screen, more on tall ones.
  return Math.round(Math.max(360, (640 * view.H) / Math.max(1, view.W)));
}
function applyPixels() {
  kit.setPixelHeight(save.retro ? retroLines() : 0);
}
function togglePixels() {
  save.retro = !save.retro;
  persist();
  applyPixels();
  for (const b of card.querySelectorAll('[data-act="pixels"]')) b.textContent = pixelLabel();
}
function act(a) {
  switch (a) {
    case 'start0': startMission(0); break;
    case 'start1': if (save.unlocked >= 2) startMission(1); break;
    case 'next': startMission(1); break;
    case 'restart': case 'again': startMission(mission); break;
    case 'resume': resume(); break;
    case 'title': goTitle(); break;
    case 'settings': kit.menu.open(); break;
    case 'mute': toggleMute(); break;
    case 'pixels': togglePixels(); break;
    case 'diff':
      save.diff = (save.diff + 1) % DIFFS.length;
      persist();
      renderTitle('diff');
      break;
  }
}
card.addEventListener('click', (e) => {
  const b = e.target.closest?.('button[data-act]');
  if (b && card.contains(b)) act(b.dataset.act);
});
pauseBtn.addEventListener('click', openPause);
// A fire key held through the last blast must not click the results or pause card: key repeats (and
// presses in the first moments) on a focused menu button do nothing; menus answer fresh presses.
addEventListener(
  'keydown',
  (e) => {
    if (!/^(Space|Enter|NumpadEnter)$/.test(e.code) || !card.contains(e.target)) return;
    if (e.repeat || performance.now() - panelAt < 450) e.preventDefault();
  },
  true
);
// The menus' own focus ring for stick / D-pad navigation (focus-visible does not follow a gamepad).
addEventListener('focusout', (e) => e.target.classList?.remove('navfocus'));

// Settings opened mid-flight, a lost window or a hidden tab: drop into the pause menu and hold the sound.
kit.onPause((p) => {
  if (p && state === 'play' && !paused) openPause();
  if (!ac) return;
  if (p) ac.suspend().catch(() => {});
  else if (!document.hidden) ac.resume().catch(() => {});
});
addEventListener('blur', () => {
  if (state === 'play' && !paused) openPause();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play' && !paused) openPause();
});

// ---------------------------------------------------------------- controls (every device through kit.input actions)
let navHeld = false, mouseSteer = false, lastPX = -1, lastPY = -1, lastDirX = 1;
function menuInput() {
  const mv = input.vector('move');
  if (Math.max(Math.abs(mv.x), Math.abs(mv.y)) < 0.5) navHeld = false;
  else if (!navHeld) {
    navHeld = true;
    const list = [...card.querySelectorAll('button')];
    if (list.length) {
      const dir = Math.abs(mv.y) >= Math.abs(mv.x) ? (mv.y > 0 ? -1 : 1) : mv.x > 0 ? 1 : -1;
      const i = list.indexOf(document.activeElement);
      const b = list[i < 0 ? 0 : (i + dir + list.length) % list.length];
      for (const o of card.querySelectorAll('.navfocus')) o.classList.remove('navfocus');
      b.classList.add('navfocus');
      b.focus();
    }
  }
  if (performance.now() - panelAt < 450) return; // fire held through the last blast must not skip the results
  if (state === 'play' && paused && (input.pressed('pause') || input.pressed('boost'))) {
    resume();
    return;
  }
  const padStart = input.source === 'gamepad' && input.pressed('pause') && state !== 'play';
  if (input.pressed('confirm') || input.pressed('fire') || padStart) {
    const f = document.activeElement;
    const b = f && f.tagName === 'BUTTON' && card.contains(f) ? f : card.querySelector('.primary');
    b?.click();
  }
}
function controls() {
  if (input.pressed('mute')) toggleMute();
  if (input.pressed('restart')) {
    startMission(state === 'title' ? 0 : mission);
    return;
  }
  if (panelShown) {
    menuInput();
    return;
  }
  if (state !== 'play' || paused) return;
  if (input.pressed('pause')) {
    openPause();
    return;
  }
  const mv = input.vector('move');
  let dx = mv.x, dy = -mv.y; // the game's y points down
  // Mouse steering, as before: the cursor's offset from the aim point steers (full at 180 × 120 old
  // pixels). It switches on when the mouse moves over the view and gives way to keys, pad or stick.
  const p = input.pointer;
  if (p.type === 'touch' || !p.over) mouseSteer = false;
  else if (p.x !== lastPX || p.y !== lastPY) mouseSteer = true;
  lastPX = p.x;
  lastPY = p.y;
  if (Math.abs(dx) + Math.abs(dy) > 0.05) mouseSteer = false;
  else if (mouseSteer) {
    const mx = clamp((p.x - view.retX) / (180 * view.px), -1, 1) * 0.8;
    const my = clamp((p.y - view.retY) / (120 * view.px), -1, 1) * 0.8;
    dx = Math.abs(mx) < 0.05 ? 0 : mx;
    dy = Math.abs(my) < 0.05 ? 0 : my;
  }
  ctl.dx = dx;
  ctl.dy = dy;
  if (Math.abs(dx) > 0.2) lastDirX = Math.sign(dx);
  ctl.fire = input.down('fire');
  ctl.boost = input.down('boost');
  let tap = 0;
  if (input.pressed('rollL')) tap = -1;
  if (input.pressed('rollR')) tap = 1;
  if (input.pressed('roll')) tap = lastDirX;
  if (tap) {
    ctl.rollTap = tap;
    ctl.rollAge = 0;
  }
}

// ---------------------------------------------------------------- rendering
const _m = new THREE.Matrix4(), _v = new THREE.Vector3();
let warmFrames = 3;
const warmObjs = POOL_KINDS.map((kind) => [kind, acquire(kind)]);
const warmExtra = [new THREE.Mesh(shipGeo, matFlash), new THREE.Mesh(archGeo, matArchUsed)];
for (const m of warmExtra) scene.add(m);

function render3D(dt) {
  const P = player, live = state === 'play' && !paused;

  // Camera: rides above the fighter with a little lag and lean, and never lets it leave the view.
  const tx = P.x, ty = P.y - CAM_UP;
  if (!(state === 'play' && paused)) {
    const k = 1 - Math.exp(-14 * dt);
    camX += (tx - camX) * k;
    camY += (ty - camY) * k;
    camRoll += (clamp(-P.vx * 0.0006, -0.04, 0.04) - camRoll) * k;
    boostK += ((live && P.boosting ? 1 : 0) - boostK) * (1 - Math.exp(-6 * dt));
    if (boostK < 0.001) boostK = 0;
  }
  const halfX = Math.max(0, (view.W / 2 / view.F) * SHIP_Z - 3.5);
  camX = clamp(camX, tx - halfX, tx + halfX);
  camY = clamp(camY, ty - 3, ty + 3);
  camera.position.set(camX, -camY, 0);
  camera.rotation.set(0, 0, camRoll);
  let sx = 0, sy = 0;
  if (live && shake > 0) {
    const a = 3 * view.px * shakeScale * Math.min(1, shake / 0.35);
    sx = rnd(-a, a);
    sy = rnd(-a, a);
  }
  const fov = view.fov * (1 + 0.07 * boostK);
  if (sx !== view.sx || sy !== view.sy || fov !== camera.fov) {
    view.sx = sx;
    view.sy = sy;
    camera.fov = fov;
    camera.setViewOffset(view.W, view.fullH, sx, view.offY + sy, view.W, view.H); // also updates the projection
  }
  camera.updateMatrixWorld();
  starGroup.position.copy(camera.position);
  starGroup.rotation.y = clock * 0.004;
  crossGrid.position.z = scroll % 15;

  // The fighter.
  const showShip = state === 'title' || (P.alive && (state === 'play' || (state === 'end' && won)));
  shipRoot.visible = showShip;
  if (showShip) {
    const bob = state === 'title' ? Math.sin(clock * 1.4) * 0.6 : 0;
    shipRoot.position.set(P.x, -(P.y + bob), -SHIP_Z);
    shipRoot.rotation.set(0, -clamp(P.vx * 0.003, -0.2, 0.2), 0);
    shipPitch.rotation.x = SHIP_PITCH - clamp(P.vy * 0.004, -0.2, 0.2);
    const spin = P.roll > 0 ? P.rollDir * (1 - P.roll / ROLL_TIME) * Math.PI * 2 : 0;
    shipModel.rotation.z = -clamp(P.vx * 0.008, -0.5, 0.5) - spin;
    shipBody.material = P.inv > 0 && Math.floor(clock * 18) % 2 ? matFlash : matSolid;
    const boosting = live && P.boosting;
    if (!(state === 'play' && paused)) flame.scale.set(1, 1, (boosting ? 30 : 21) + rnd(0, 8));
    matFlame.color.copy(boosting ? FLAME_BOOST : FLAME);
  }

  // Raiders, mines and gates.
  for (const o of objs) {
    const m = o.mesh;
    m.position.set(o.x, -o.y, -o.z);
    switch (o.kind) {
      case 'dart':
      case 'heavy':
        m.scale.setScalar(7);
        m.rotation.set(0, Math.sin(o.phase * 1.2) * 0.3, -Math.sin(o.phase * 2.4) * 0.25);
        break;
      case 'shrike':
        m.scale.setScalar(6.5);
        m.rotation.set(0, Math.sign(o.vx) * 0.45, -Math.sign(o.vx) * 0.55 + Math.sin(o.phase * 2) * 0.1);
        break;
      case 'mine':
        m.scale.setScalar(3.2);
        m.userData.body.rotation.set(o.phase * 0.6, o.phase * 0.9, 0);
        m.userData.eye.visible = Math.sin(clock * (o.z < 75 ? 16 : 5)) > 0;
        break;
    }
    if (o.kind !== 'arch') m.userData.body.material = o.hitT > 0 ? matFlash : matSolid;
  }

  // Bosses.
  const b = boss;
  kiteObj.visible = !!b && b.kind === 'kite';
  heronObj.visible = !!b && b.kind === 'heron';
  if (b) {
    const o = b.kind === 'kite' ? kiteObj : heronObj;
    o.position.set(b.x, -b.y, -b.z);
    if (b.kind === 'kite') {
      o.rotation.set(0, Math.sin(b.phase * 0.7) * 0.15, -Math.cos(b.phase * 0.7) * 0.06);
      kiteCore.material = b.hitT > 0 ? matFlash : matGlow;
    } else {
      o.rotation.set(0, Math.sin(b.phase * 0.55) * 0.12, -Math.cos(b.phase * 0.55) * 0.05);
      for (let i = 0; i < 2; i++) {
        heronPods[i].visible = b.pods[i].hp > 0;
        heronPods[i].material = b.pods[i].hitT > 0 ? matFlash : matSolid;
      }
      shutL.position.x = -0.14 - b.openT * 0.3;
      shutR.position.x = 0.14 + b.openT * 0.3;
      heronCore.material = b.hitT > 0 ? matFlash : matGlow;
    }
  }

  // Bolts, enemy shots, sparks and towers.
  let n = 0;
  for (const s of bullets) {
    if (n >= MAX_SHOTS) break;
    _m.makeTranslation(s.x, -s.y, -s.z - 2);
    boltMesh.setMatrixAt(n++, _m);
  }
  boltMesh.count = n;
  boltMesh.instanceMatrix.needsUpdate = true;
  n = 0;
  for (const s of ebullets) {
    if (n >= MAX_ESHOTS) break;
    _m.makeScale(1.3, 1.3, 3).setPosition(s.x, -s.y, -s.z);
    eshotMesh.setMatrixAt(n++, _m);
  }
  eshotMesh.count = n;
  eshotMesh.instanceMatrix.needsUpdate = true;
  n = 0;
  for (const p of particles) {
    if (n >= MAX_SPARKS) break;
    const w = 4 * clamp(p.life * 2.5, 0.35, 1);
    _m.makeScale(w, w, 1).setPosition(p.x, -p.y, -p.z);
    sparkMesh.setMatrixAt(n, _m);
    sparkMesh.setColorAt(n, p.life > 0.4 ? p.hot : p.cool);
    n++;
  }
  sparkMesh.count = n;
  sparkMesh.instanceMatrix.needsUpdate = true;
  sparkMesh.instanceColor.needsUpdate = true;
  n = 0;
  for (const t0 of buildings) {
    _m.makeScale(t0.w, t0.h, t0.d).setPosition(t0.x, -t0.yc, -t0.z);
    buildingMesh.setMatrixAt(n++, _m);
  }
  buildingMesh.count = n;
  buildingMesh.instanceMatrix.needsUpdate = true;

  // The first frames draw one of everything, tiny and far off, so no shader compiles mid-flight.
  if (warmFrames > 0) {
    warmFrames--;
    const far = (o) => {
      o.visible = true;
      o.position.set(0, 0, -300);
      o.scale.setScalar(0.001);
    };
    for (const [, o] of warmObjs) far(o);
    for (const o of warmExtra) far(o);
    if (!boss) {
      far(kiteObj);
      far(heronObj);
    }
    _m.makeScale(0.001, 0.001, 0.001).setPosition(0, 0, -300);
    for (const m of [boltMesh, eshotMesh, sparkMesh]) {
      if (m.count === 0) {
        m.setMatrixAt(0, _m);
        m.count = 1;
      }
    }
    if (warmFrames === 0) {
      for (const [kind, o] of warmObjs) release(kind, o);
      for (const o of warmExtra) scene.remove(o);
      kiteObj.scale.setScalar(20);
      heronObj.scale.setScalar(16);
    }
  }
}

// ---------------------------------------------------------------- HUD (DOM, written only when a value changes)
const hudEl = $('hud'), flashEl = $('flash'), reticle = $('reticle');
const E = { hits: $('hits'), dist: $('dist'), sector: $('sector'), shieldFill: $('shieldFill'), shieldBar: $('shieldBar'), boostFill: $('boostFill'), boostBar: $('boostBar'), bossBox: $('bossBox'), bossName: $('bossName'), bossFill: $('bossFill'), msg: $('msg') };
const last = {};
const changed = (key, v) => (last[key] !== v ? ((last[key] = v), true) : false);
function setBar(key, el, f) {
  f = Math.round(clamp(f, 0, 1) * 400) / 400;
  if (changed(key, f)) el.style.transform = `scaleX(${f})`;
}
function drawHud() {
  const playing = state === 'play';
  if (changed('hud', playing)) hudEl.hidden = !playing;
  if (changed('btns', playing && !paused)) topBtns.hidden = !(playing && !paused);
  const fo = Math.round(clamp(flash, 0, 1) * 100) / 100;
  if (changed('flash', fo)) flashEl.style.opacity = fo;
  if (!playing) return;
  const P = player, M = MISSIONS[mission];
  if (changed('hits', hits)) E.hits.textContent = String(hits).padStart(3, '0');
  if (changed('sector', mission)) E.sector.textContent = M.sector;
  const run = Math.min(100, Math.floor((t / M.bossAt) * 100));
  if (changed('dist', run)) E.dist.textContent = run + '%';
  setBar('shield', E.shieldFill, P.shield / 100);
  if (changed('low', P.shield < 30)) E.shieldBar.classList.toggle('low', P.shield < 30);
  setBar('boost', E.boostFill, P.boost / 100);
  if (changed('lock', P.boostLock)) E.boostBar.classList.toggle('locked', P.boostLock);
  if (changed('boss', !!boss)) E.bossBox.hidden = !boss;
  if (boss) {
    if (changed('bossName', mission)) E.bossName.textContent = M.bossName;
    setBar('bossHp', E.bossFill, boss.hp / boss.max);
  }
  const m = msgT > 0 ? msg : '';
  if (changed('msg', m)) {
    E.msg.textContent = m;
    E.msg.hidden = !m;
  }
  // The reticle marks where the bolts meet a target 90 units out (it follows the 3D view).
  const showRet = P.alive && !outro;
  if (changed('ret', showRet)) reticle.hidden = !showRet;
  _v.set(P.x, -P.y, -90).project(camera);
  view.retX = ((_v.x + 1) / 2) * view.W;
  view.retY = ((1 - _v.y) / 2) * view.H;
  if (showRet) {
    const rx = Math.round(view.retX - view.retW / 2), ry = Math.round(view.retY - view.retH / 2);
    if (changed('rx', rx) | changed('ry', ry)) reticle.style.transform = `translate(${rx}px,${ry}px)`;
  }
}

// ---------------------------------------------------------------- sizing
kit.onResize((w, h) => {
  view.W = w;
  view.H = h;
  view.fullH = h * 1.04;
  view.offY = h * 0.04;
  // The old focal length on a 16:9 view; wider screens see more to the sides, tall ones more above and below.
  view.F = Math.max(Math.min((h * 210) / 360, (w * 210) / 640), view.fullH / 2 / MAX_HALF_VFOV);
  view.px = view.F / 210;
  view.fov = (2 * Math.atan(view.fullH / 2 / view.F) * 180) / Math.PI;
  camera.fov = view.fov;
  view.sx = view.sy = 0;
  camera.setViewOffset(w, view.fullH, 0, view.offY, w, h); // also sets the aspect and the projection
  view.retW = Math.round(26 * view.px);
  view.retH = Math.round(18 * view.px);
  reticle.style.width = view.retW + 'px';
  reticle.style.height = view.retH + 'px';
  last.rx = last.ry = undefined;
  // Stars stay one old pixel wide.
  stars.material.size = Math.max(1.5, h / 360);
  if (save.retro) kit.setPixelHeight(retroLines());
});

// ---------------------------------------------------------------- the loop
const STEP = 1 / 60;
kit.start((dt) => {
  controls();
  if (state === 'play' && !paused) {
    acc = Math.min(acc + dt, STEP * 6);
    while (acc >= STEP) {
      update(STEP);
      acc -= STEP;
      if (state !== 'play' || paused) {
        acc = 0;
        break;
      }
    }
  }
  if (!(state === 'play' && paused)) scenery(dt);
  render3D(dt);
  drawHud();
  kit.renderer.render(scene, camera);
});

renderTitle('start0');

// Tiny state hooks for verification without affecting play.
window.__VECTOR_VULPINE_TEST__ = () => ({
  state: paused ? 'paused' : state === 'end' ? (won ? 'won' : 'lost') : state,
  mission: mission + 1,
  t,
  hits,
  shield: player.shield,
  boss: boss ? boss.hp : null,
  objects: objs.length,
  bullets: bullets.length,
  audio: !!ac,
  muted: save.muted,
});
window.__VECTOR_VULPINE_FORCE_WIN__ = () => {
  if (state !== 'play') startMission(mission);
  if (!boss) startBoss();
  killBoss();
  update(STEP);
};
window.__VECTOR_VULPINE_FORCE_LOSE__ = () => {
  if (state !== 'play') startMission(mission);
  player.roll = player.inv = 0;
  player.shield = 1;
  damage(9);
};
</script>
</body>
</html>
