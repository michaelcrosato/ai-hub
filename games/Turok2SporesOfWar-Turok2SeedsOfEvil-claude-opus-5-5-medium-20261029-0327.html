<!--
Turok 2: Spores of War — single-file build

Source Information
- Date: 2026-10-29 03:27
- Source: Turok 2: Seeds of Evil (Iguana Entertainment / Acclaim, 1998). Original spiritual successor; no assets, names or text from the source are used.
- Title: Turok 2: Spores of War (picked by crypto.randomInt from 50 brainstormed riffs)
- Tech: Three.js r180 (WebGPURenderer, TSL node materials, PostProcessing, ToonOutlinePassNode, BloomNode), WebGPU only with no fallback; Rapier 0.19.3 (@dimforge/rapier3d-compat) for collision, kinematic character controllers, ray queries and rigid-body gibs and crates; Gamepad API (standard mapping, DualSense rumble); Web Audio API; Pointer Lock; Canvas 2D for the map; bundled with esbuild 0.25 into one HTML file, three and rapier loaded from the jsDelivr CDN through an import map.
- Art Direction: Stylised cel-shading: MeshToonMaterial with a hard 4-step ramp, screen-space ink outlines, bloom on emissive spores and fire, vertex-coloured terrain zones, flat-band TSL water and acid, outlined blob clouds, colour grading for damage, water and blight.
- Animation: Fully procedural. Every creature is a hierarchy of primitives; gait cycles, attack, pain, charge, lunge and death poses are driven by code each frame. Physics gibs on headshots and explosions. Viewmodel bob, sway, recoil, draw and switch animations are procedural.
- Audio: All code-written with Web Audio: a step-sequenced tribal score (kick, toms, shaker, saw bass, pads, vibrato flute) with combat-intensity layers and separate title, exploration, boss and victory tracks; every sound effect synthesised from oscillators and filtered noise; Animalese-style gibberish voices (formant-filtered blips per letter, pitch per speaker) for all dialogue, with subtitles.
- Online: Two adapters behind one netcode interface, as the AI Hub guide describes. In a session: AI Hub Session Protocol v1, client 1.3.0, side-by-side (parallel) mode with a seeded start, progress, result, time-up and end handling, and the probe (no game traffic, as that mode requires). On its own: Rival Hunt, online rooms for up to 4 players over PeerJS 1.5.5 (WebRTC data channels, PeerJS cloud broker), joined by a four-letter code. Everyone plays their own hunt on a shared 6-minute clock, sees the others as ghost hunters with name tags, and shares a live scoreboard and final standings. No chat and no custom names.
- Testing: Headless Chrome via Playwright on a SwiftShader WebGPU adapter (about 1-4 fps): boot/title/attract/intro/play/pause smoke run with console capture, frames read back from the render target, scripted sim runs of combat, Totems, gate, boss, victory and game over, the AI Hub harness (1 and 2 players, host-leave): 20/20 checks pass. Also an emulated DualSense through the menus and play, an emulated touch-only device, and a two-page Rival Hunt run (host, join by code, synced countdown, ghosts, scoreboard, results). No GPU hardware or physical controller was available.
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort medium
- Usage: unknown: no token or cost meter is visible to the model in this session

Testing Feedback
- Issues caught: 10: score popups crashing on boss hits; Enter swallowed on the room-code screen; a queued Enter pressing Leave in the new lobby after a fast join; the boss heart hidden inside the trunk collider; null-player errors before the hub connected; Esc ignored during the session countdown and on slow frames; attract bot skipping objectives and aiming through walls; attract camera clipping into walls; ink outlines too thin; bow viewmodel oversized.
- Critical / game-breaking: 3: the popup crash and the hidden heart each made the Mother Bloom unkillable; the null-player errors failed the AI Hub check.
- Most helpful test: Scripted runs that step the real game (fights, all three Totems, the gate, every boss phase, victory, game over) plus the AI Hub harness at 1 and 2 players and with a player leaving.
- Least helpful test: Plain headless screenshots: WebGPU canvases come back blank, so frames had to be read back from the outline pass instead.

Engine Feedback
- Liked most: Three.js TSL: post-processing, toon outlines and animated water are a few lines of node code; Rapier's kinematic character controller gives solid FPS movement with autostep and slope limits for free.
- Stuck / guessed wrong: Guessed some r180 WebGPU names (PostProcessing versus the newer RenderPipeline, toonOutlinePass) and checked them against the npm build; Rapier renamed toi to timeOfImpact.
- Built myself: The whole gameplay layer: enemy AI and steering, procedural animation rigs, weapon system, boss state machine, input abstraction, menus and the audio synthesiser.
- Hardest part: Keeping the WebGPU-only path testable without a GPU, and knowing which materials the outline pass supports (only toon materials).
- Remove / overhaul: The custom vertexNode in the toon outline pass, which ignores instancing and skinning.
- Change one thing: A first-party navmesh / pathfinding module next to the character controller.

Prompt Feedback
- Liked most: Clear deliverable, explicit tech pins, and a strong steer toward controller-first 10-foot UX.
- Confusing: The [GameTitle-SOURCE-...] filename pattern (whether SOURCE is the full source name), and "Dependencies that can be downloaded" alongside "single html file".
- Hardest: Scope: a full vertical slice (arsenal, bestiary, boss, attract mode, hub session, menus, audio) in one pass with lightweight testing.
- One test to run: A real DualSense on real GPU hardware through a whole playthrough, with frame timing.

<script>
/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

function releaseLockSoft() {
}
function statsHTML() {

function onVictory() {

    return;
  }
  if (hub?.active && M.session) {
    finishSession("won");
    return;
  }

  showScreen(`<div class="end"><h1>THE BLOOM IS BROKEN</h1>${lines.map((l) => `<p>${l}</p>`).join("")}${statsHTML()}</div>`, "victory");

}
function onGameOver() {

    return;
  }

    finishSession("fallen");
    return;
  }

}
function sessionStats() {
  return { kills: S.kills, headshots: S.headshots, totems: S.totems.filter((t) => !t.alive).length, children: S.rescued, secrets: S.secrets, "best chain": S.bestChain || S.chain };
}
function finishSession(why) {

  if (S.headshots >= 10) awards.push({ title: "Head Hunter", detail: `${S.headshots} headshots` });
  if (S.rescued === S.children.length) awards.push({ title: "Guardian", detail: "Freed every captive child" });

  hub.result({ score: S.score, stats: sessionStats(), awards: awards.slice(0, 3) });
  showScreen(`<div class="end"><h1>${why === "won" ? "THE BLOOM IS BROKEN" : why === "time" ? "TIME" : "THE HUNT IS OVER"}</h1>${statsHTML()}</div>`, "victory");
}
async function startSession() {
  M.state = "session-wait";
  const info = await hub.connect({ mode: "parallel", seats: [1, 4] });
  if (!info) {
    goTitle();
    return;
  }
  M.session = info;
  newGame({ mode: "session", difficulty: "normal" });
  bindGame(S);
  showHUD(true);
  hub.on("start", () => {
    audioInit();
    audioResume();
    playMusic("explore");
  });
  hub.on("time-up", () => {
    if (!M.sessionDone) finishSession("time");
  });
  hub.on("end", () => {
    M.ended = true;
    S.paused = true;
    muteAll(true);
    releaseLock();
    closeMenus();
  });
  if (info.splash) hub.ready();

    const names = (info.players || []).map((p) => `<li style="color:${p.color}"></li>`).join("");
    showScreen(`<div class="end"><h1>${GAME.short}</h1><ul class="roster">${names}</ul><p>Press any key, click or tap when you are ready</p></div>`, "victory");
    const lis = UI.screen.querySelectorAll(".roster li");
    (info.players || []).forEach((p, i) => {
      lis[i].textContent = p.name;
    });
    const ready = () => {

      removeEventListener("pointerdown", ready);
      M.readyPad = false;
      audioInit();
      hub.ready();

    addEventListener("keydown", ready);
    addEventListener("pointerdown", ready);
    M.readyPad = ready;
  }
}
function updateSession(dt) {

    return;
  }
  if (M.readyPad && input.anyPressed) M.readyPad();

  } else if (input.menu.pause) pause();
  const t = hub.time();
  if (t < 0 || !isFinite(t)) {

    hudFrame(0);
    if (isFinite(t)) {
      const n = Math.ceil(-t / 1e3);
      if (n !== M.countN) {
        M.countN = n;
        toast(String(n), "", "big");
      }

    return;
  }

}
function blocked(title, msg, withSettings) {
  showScreen(`<div class="end blocked"><h1>${title}</h1><p>${msg}</p>${withSettings ? '<div class="btnrow"><button id="bSettings">Settings</button></div>' : ""}</div>`, "victory");
  if (withSettings) UI.screen.querySelector("#bSettings").addEventListener("click", () => {
    openMenu(settingsMenu);
  });
}
var last = performance.now();

  const dt = Math.min(0.05, (now2 - last) / 1e3);
  last = now2;
  pollInput(dt);
  if (input.anyPressed) {
    audioInit();
    audioResume();
  }
  switch (M.state) {
    case "title":
      updateTitle(dt);
      break;
    case "attract":
      updateAttract(dt);
      break;
    case "intro":
      updateIntro(dt);
      break;
    case "play":
      if (!M.ended) updatePlay(dt);
      break;
    case "session-wait":
      updateSession(dt);
      break;
    case "touch":
      if (menuOpen()) updateMenus();
      if (input.anyPressed && input.device === "pad" || input.keys.size) {
        closeMenus();
        goTitle();
      }
      break;
  }

}
async function boot() {

  input.onKeyDown = onKeyDown;
  hub?.probe(() => ({
    scene: M.state === "title" || M.state === "attract" ? "title" : M.state === "intro" ? "menu" : M.state === "session-wait" ? "ready" : S.over || S.won || M.sessionDone ? "over" : "play",

    await initPhysics();
    await initGfx(canvas);
  } catch (e) {
