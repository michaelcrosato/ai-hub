<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7c873" />
  <meta name="description" content="Datecraft — a bright, systems-driven professional companion management and life simulator." />
  <title>Datecraft — Standalone</title>
  <script type="importmap">
  {
    "imports": {
      "three": "/lib/three/three.webgpu.js",
      "three/webgpu": "/lib/three/three.webgpu.js",
      "three/tsl": "/lib/three/three.tsl.js",
      "three/addons/": "/lib/three/addons/",
      "kit/": "/lib/kit/"
    }
  }
  </script>
  <link rel="modulepreload" href="/lib/three/three.core.js" />
  <link rel="modulepreload" href="/lib/three/three.webgpu.js" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-build="standalone-html">
  <a class="skip-link" href="#game-ui">Skip to game controls</a>
  <canvas id="render-canvas" aria-label="Isometric Brightside City"></canvas>
  <div id="world-tint" aria-hidden="true"></div>

  <main id="game-ui" class="game-ui is-hidden" tabindex="-1">
    <header id="top-bar" class="top-bar panel" aria-label="Current game status">
      <button class="brand-button" data-action="open-menu" aria-label="Open game menu"><span class="brand-icon" aria-hidden="true">◆</span><span>Datecraft</span></button>
      <div class="status-cluster">
        <div class="status-item"><span class="status-label">Day</span><strong id="hud-day">1 · Monday</strong></div>
        <div class="status-item"><span class="status-label">Time</span><strong id="hud-slot">Morning</strong></div>
        <div class="status-item"><span class="status-label">Cash</span><strong id="hud-cash">$0</strong></div>
        <div class="status-item"><span class="status-label">Reputation</span><strong id="hud-reputation">New</strong></div>
        <div class="status-item risk-status"><span class="status-label">Risk</span><strong id="hud-risk">Low</strong></div>
      </div>
      <div class="time-controls" role="group" aria-label="Time controls">
        <button class="icon-button" data-action="time-pause" title="Pause (Space)" aria-label="Pause time">Ⅱ</button>
        <button class="icon-button" data-action="time-play" title="Play (Space)" aria-label="Run time">▶</button>
        <button class="icon-button" data-action="time-fast" title="Fast time" aria-label="Run time faster">▶▶</button>
      </div>
    </header>

    <aside id="needs-panel" class="needs-panel panel" aria-label="Character wellbeing">
      <div class="panel-heading-row"><div><span class="eyebrow">Wellbeing</span><h2 id="player-name-label">Alex</h2></div><button class="icon-button compact" data-action="open-character" aria-label="Open character and skills">✦</button></div>
      <div id="needs-list" class="needs-list"></div>
      <div class="mini-stat-grid">
        <div><span>Level</span><strong id="hud-level">1</strong></div><div><span>XP</span><strong id="hud-xp">0/100</strong></div>
        <div><span>Safety</span><strong id="hud-safety">70</strong></div><div><span>Exposure</span><strong id="hud-exposure">5</strong></div>
      </div>
    </aside>

    <aside id="phone-panel" class="phone-panel panel" aria-label="Business phone">
      <div class="phone-header"><div><span class="eyebrow">Brightline</span><h2 id="phone-title">Leads</h2></div><button class="icon-button compact" data-action="toggle-phone" aria-label="Close phone">×</button></div>
      <nav id="phone-tabs" class="phone-tabs" aria-label="Phone sections">
        <button class="phone-tab is-active" data-tab="leads"><span aria-hidden="true">◎</span>Leads <b id="lead-badge">0</b></button>
        <button class="phone-tab" data-tab="calendar"><span aria-hidden="true">▦</span>Plan</button>
        <button class="phone-tab" data-tab="business"><span aria-hidden="true">◇</span>Business</button>
        <button class="phone-tab" data-tab="network"><span aria-hidden="true">⌁</span>Network</button>
        <button class="phone-tab" data-tab="goals"><span aria-hidden="true">☆</span>Growth</button>
      </nav>
      <section id="phone-content" class="phone-content" aria-live="polite"></section>
    </aside>

    <section id="venue-card" class="venue-card panel is-hidden" aria-live="polite"></section>
    <footer id="action-dock" class="action-dock panel" aria-label="Quick actions">
      <button data-action="quick-activity" data-id="rest"><span aria-hidden="true">☾</span><b>Rest</b><small>Recover energy</small></button>
      <button data-action="quick-activity" data-id="marketing"><span aria-hidden="true">✦</span><b>Market</b><small>Generate interest</small></button>
      <button data-action="quick-activity" data-id="training"><span aria-hidden="true">↑</span><b>Train</b><small>Build skill</small></button>
      <button data-action="quick-activity" data-id="social"><span aria-hidden="true">♥</span><b>Connect</b><small>Reduce stress</small></button>
      <button data-action="quick-activity" data-id="admin"><span aria-hidden="true">✓</span><b>Admin</b><small>Lower exposure</small></button>
      <button class="primary-dock" data-action="advance-slot"><span aria-hidden="true">→</span><b>Next slot</b><small id="next-slot-label">Afternoon</small></button>
    </footer>
    <button id="phone-toggle" class="floating-button is-hidden" data-action="toggle-phone" aria-label="Open business phone">◎<span id="floating-badge">0</span></button>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  </main>

  <div id="modal-layer" class="modal-layer is-hidden" aria-live="polite"></div>
  <div id="tooltip" class="tooltip is-hidden" role="tooltip"></div>
  <noscript>Datecraft requires JavaScript.</noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
