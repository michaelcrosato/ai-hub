<script>
'use strict';
/* ===== Anchovy 1800 — core: constants, settings, audio, input ===== */
const W = 1920, H = 1080;
const MW = 38, MH = 28;
const TW = 96, TH = 48;
const INK = '#1d1a2b';
const FONT = '"Trebuchet MS","Segoe UI",Verdana,sans-serif';
const SERIF = 'Georgia,"Palatino Linotype","Book Antiqua",serif';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const now = () => performance.now() / 1000;

function hash2(x, y, seed) {
  let h = (x * 374761393 + y * 668265263 + seed * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const s = t => t * t * (3 - 2 * t);
  const a = hash2(xi, yi, seed), b = hash2(xi + 1, yi, seed), c = hash2(xi, yi + 1, seed), d = hash2(xi + 1, yi + 1, seed);
  const u = s(xf), v = s(yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

/* ---------- settings ---------- */
const SAVE_KEY = 'anchovy1800.settings.v1';
const S = { music: 0.6, sfx: 0.8, hints: true, fullscreen: false };
try { Object.assign(S, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) { /* storage unavailable */ }

/* ---------- audio (Web Audio, fully synthesised) ---------- */
const A = { ctx: null, mus: null, sfx: null, next: 0, step: 0 };
function audioInit() {
  if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume().catch(() => {}); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    A.ctx = new C();
    A.mus = A.ctx.createGain(); A.sfx = A.ctx.createGain();
    A.mus.connect(A.ctx.destination); A.sfx.connect(A.ctx.destination);
    applyVol();
    A.next = A.ctx.currentTime + 0.15;
    if (A.ctx.state === 'suspended') A.ctx.resume().catch(() => {});
  } catch (e) { A.ctx = null; }
}
function applyVol() { if (!A.ctx) return; A.mus.gain.value = S.music * 0.35; A.sfx.gain.value = S.sfx * 0.9; }
function audioOn() { return A.ctx && A.ctx.state === 'running'; }
function tone(f, t, d, type, v, dest, f2) {
  const o = A.ctx.createOscillator(), g = A.ctx.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v || 0.2, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(dest || A.sfx); o.start(t); o.stop(t + d + 0.05);
}
function noise(t, d, v, freq) {
  const n = Math.floor(A.ctx.sampleRate * d), buf = A.ctx.createBuffer(1, n, A.ctx.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = A.ctx.createBufferSource(); s.buffer = buf;
  const f = A.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 800;
  const g = A.ctx.createGain(); g.gain.value = v || 0.3;
  s.connect(f); f.connect(g); g.connect(A.sfx); s.start(t);
}
function sfx(name) {
  if (!audioOn()) return;
  const t = A.ctx.currentTime;
  switch (name) {
    case 'move': tone(520, t, 0.04, 'triangle', 0.05); break;
    case 'click': tone(660, t, 0.07, 'triangle', 0.15); tone(990, t + 0.04, 0.08, 'triangle', 0.1); break;
    case 'back': tone(440, t, 0.09, 'triangle', 0.14, null, 300); break;
    case 'place': tone(196, t, 0.12, 'square', 0.1); tone(392, t + 0.05, 0.14, 'triangle', 0.18); noise(t, 0.08, 0.15, 1200); break;
    case 'road': tone(300, t, 0.05, 'square', 0.06); break;
    case 'err': tone(150, t, 0.18, 'sawtooth', 0.12); tone(120, t + 0.08, 0.2, 'sawtooth', 0.1); break;
    case 'coin': tone(988, t, 0.08, 'square', 0.07); tone(1318, t + 0.07, 0.18, 'square', 0.07); break;
    case 'up': [392, 494, 587, 784].forEach((f, i) => tone(f, t + i * 0.07, 0.2, 'triangle', 0.16)); break;
    case 'demo': tone(220, t, 0.1, 'square', 0.05); break;
    case 'cannon': noise(t, 0.35, 0.5, 500); tone(110, t, 0.3, 'sine', 0.3, null, 40); break;
    case 'splash': noise(t, 0.25, 0.25, 2200); break;
    case 'horn': tone(110, t, 0.8, 'sawtooth', 0.14); tone(165, t, 0.8, 'sawtooth', 0.1); tone(110, t + 0.9, 0.8, 'sawtooth', 0.14); break;
    case 'sunk': tone(300, t, 0.6, 'triangle', 0.18, null, 60); noise(t, 0.5, 0.3, 900); break;
    case 'win': [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, t + i * 0.13, 0.3, 'triangle', 0.2)); break;
    case 'lose': [392, 349, 311, 262].forEach((f, i) => tone(f, t + i * 0.25, 0.5, 'sawtooth', 0.12)); break;
    case 'pause': tone(330, t, 0.1, 'triangle', 0.12); tone(247, t + 0.08, 0.14, 'triangle', 0.12); break;
  }
}
/* gentle 6/8 sea-shanty loop in D dorian */
const MEL = [
  [0, -1, 2, 3, -1, 5, 7, -1, 5, 3, -1, 2], [3, -1, 5, 7, -1, 8, 10, -1, 8, 7, -1, 5],
  [0, -1, 2, 3, -1, 5, 7, -1, 10, 12, -1, 10], [8, -1, 7, 5, -1, 3, 2, -1, 3, 2, -1, 0]];
const ROOTS = [50, 48, 43, 45];
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function musicTick() {
  if (!audioOn()) return;
  const stepDur = 0.19;
  while (A.next < A.ctx.currentTime + 0.25) {
    const st = A.step % 48, ph = Math.floor(st / 12), i = st % 12;
    const n = MEL[ph][i];
    if (n >= 0) tone(mf(62 + n), A.next, 0.3, 'triangle', 0.42, A.mus);
    if (i % 6 === 0) tone(mf(ROOTS[ph] - 12 + (i === 6 ? 7 : 0)), A.next, 0.5, 'sine', 0.55, A.mus);
    if (i === 0) { tone(mf(ROOTS[ph] + 12), A.next, 1.9, 'sine', 0.12, A.mus); tone(mf(ROOTS[ph] + 19), A.next, 1.9, 'sine', 0.09, A.mus); }
    if (i === 3 || i === 9) tone(mf(ROOTS[ph]), A.next, 0.12, 'square', 0.05, A.mus);
    A.next += stepDur; A.step++;
  }
}

/* ---------- input: keyboard + gamepad + pointer unified into actions ---------- */
const KEYMAP = {
  up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'], left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
  accept: ['Enter', 'Space', 'NumpadEnter'], back: ['Escape', 'Backspace'], swap: ['KeyX'], speed: ['Tab', 'KeyR'],
  pause: ['KeyP'], prev: ['KeyQ'], next: ['KeyE'], zoomIn: ['Equal', 'NumpadAdd'], zoomOut: ['Minus', 'NumpadSubtract']
};
const PADMAP = { accept: 0, back: 1, speed: 2, swap: 3, prev: 4, next: 5, zoomOut: 6, zoomIn: 7, pause: 9, up: 12, down: 13, left: 14, right: 15 };
const ACTIONS = Object.keys(KEYMAP);
const Inp = {
  dev: 'kb', keys: new Set(), tapped: new Set(), held: {}, prev: {}, press: {}, ix: 0, iy: 0, stick: { x: 0, y: 0 },
  rt: 0, rfirst: true, activity: now(), padOn: false, anyPressed: false,
  mouse: { x: W / 2, y: H / 2, moved: false, down: false, clicked: false, right: false, wheel: 0, inside: false, px: -1, py: -1 },
  pointerActive: false, keyboardSeen: false
};
const view = { s: 1, ox: 0, oy: 0, dpr: 1, q: 1 };
function toVirt(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - view.ox) / view.s, y: (e.clientY - r.top - view.oy) / view.s };
}
function pollInput() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (const p of pads) { if (p && p.connected) { gp = p; break; } }
  const h = {};
  for (const a of ACTIONS) h[a] = KEYMAP[a].some(k => Inp.keys.has(k) || Inp.tapped.has(k));
  Inp.tapped.clear();
  let sx = 0, sy = 0, padAny = false;
  if (gp) {
    Inp.padOn = true;
    for (const a of ACTIONS) {
      const b = gp.buttons[PADMAP[a]];
      if (b && (b.pressed || b.value > 0.6)) { h[a] = true; padAny = true; }
    }
    for (const b of gp.buttons) if (b && b.pressed) padAny = true;
    sx = gp.axes[0] || 0; sy = gp.axes[1] || 0;
    const m = Math.hypot(sx, sy);
    if (m < 0.35) { sx = 0; sy = 0; } else if (m > 0.6) padAny = true;
  } else Inp.padOn = false;
  Inp.stick.x = sx; Inp.stick.y = sy;
  Inp.press = {};
  let any = false;
  for (const a of ACTIONS) { Inp.press[a] = h[a] && !Inp.prev[a]; if (Inp.press[a]) any = true; }
  Inp.prev = h; Inp.held = h;
  // direction vector (screen space) from keys/dpad + stick
  let ix = (h.right ? 1 : 0) - (h.left ? 1 : 0), iy = (h.down ? 1 : 0) - (h.up ? 1 : 0);
  if (!ix && !iy) { ix = sx; iy = sy; }
  Inp.ix = ix; Inp.iy = iy;
  if (padAny) { Inp.dev = 'pad'; Inp.activity = now(); }
  Inp.anyPressed = any || padAny;
  if (any && !padAny) { Inp.dev = 'kb'; }
}
/* repeating discrete direction events for cursor / menu navigation */
function dirRepeat(dt) {
  const x = Inp.ix, y = Inp.iy, mag = Math.hypot(x, y);
  if (mag < 0.35) { Inp.rt = 0; Inp.rfirst = true; return null; }
  Inp.rt -= dt;
  if (Inp.rt > 0) return null;
  Inp.rt = Inp.rfirst ? 0.3 : lerp(0.15, 0.05, clamp((mag - 0.35) / 0.65, 0, 1));
  Inp.rfirst = false;
  return { x: x / mag, y: y / mag, mag };
}
function bindInput(cv) {
  addEventListener('keydown', e => {
    if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace'].includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    Inp.keys.add(e.code); Inp.tapped.add(e.code); Inp.dev = 'kb'; Inp.keyboardSeen = true; Inp.activity = now(); audioInit();
    if (e.code === 'F11') { /* browser handles fullscreen */ }
  });
  addEventListener('keyup', e => { Inp.keys.delete(e.code); });
  addEventListener('blur', () => { Inp.keys.clear(); });
  cv.addEventListener('pointermove', e => {
    const v = toVirt(e), m = Inp.mouse;
    if (Math.abs(v.x - m.px) + Math.abs(v.y - m.py) > 3) { Inp.activity = now(); if (e.pointerType === 'mouse') { m.moved = true; Inp.dev = 'kb'; } }
    m.x = v.x; m.y = v.y; m.px = v.x; m.py = v.y; m.inside = true;
  });
  cv.addEventListener('pointerleave', () => { Inp.mouse.inside = false; });
  cv.addEventListener('pointerdown', e => {
    audioInit(); Inp.activity = now();
    const v = toVirt(e), m = Inp.mouse; m.x = v.x; m.y = v.y; m.inside = true;
    if (e.button === 2) { m.right = true; } else { m.clicked = true; m.down = true; }
    if (e.pointerType === 'mouse') Inp.dev = 'kb';
    Inp.pointerType = e.pointerType;
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  const up = e => { if (e.button !== 2) Inp.mouse.down = false; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('wheel', e => { e.preventDefault(); Inp.mouse.wheel += Math.sign(e.deltaY); Inp.activity = now(); }, { passive: false });
  addEventListener('gamepadconnected', () => { Inp.dev = 'pad'; Inp.activity = now(); });
}

/* ===== Anchovy 1800 — world: definitions, map, simulation ===== */
const T = { DEEP: 0, SHAL: 1, SAND: 2, GRASS: 3, FOREST: 4, ROCK: 5 };
const GOODS = ['wood', 'plank', 'fish', 'grain', 'bread'];
const GOOD_NAME = { wood: 'Wood', plank: 'Planks', fish: 'Fish', grain: 'Grain', bread: 'Bread' };
const STOCK_CAP = 200;
const TOOLS = ['inspect', 'road', 'house', 'lumber', 'sawmill', 'fisher', 'market', 'farm', 'bakery', 'chapel', 'tower', 'post', 'demolish'];
const DEFS = {
  inspect: { name: 'Look Around', desc: 'Inspect buildings. Select a hut to upgrade it.' },
  demolish: { name: 'Demolish', desc: 'Clear a building or road. Refunds half the cost.' },
  road: { name: 'Cobble Road', cost: { c: 2 }, upkeep: 0, desc: 'Links buildings to the Kontor. Hold Accept to paint.' },
  house: { name: 'Pioneer Hut', cost: { c: 25, p: 2 }, upkeep: 0, desc: 'Homes for citizens. Needs a road, a Market and fish.' },
  lumber: { name: "Lumberjack's Lodge", cost: { c: 30, p: 2 }, upkeep: 2, prod: 'wood', period: 8, desc: 'Fells trees within 4 tiles for Wood.' },
  sawmill: { name: 'Sawmill', cost: { c: 60, p: 4 }, upkeep: 3, prod: 'plank', period: 5, inp: 'wood', inpN: 1, desc: 'Saws Wood into Planks.' },
  fisher: { name: "Fisher's Shack", cost: { c: 40, p: 3 }, upkeep: 2, prod: 'fish', period: 6.5, desc: 'Hauls in fish. Build beside the water.' },
  market: { name: 'Market Square', cost: { c: 80, p: 6 }, upkeep: 4, radius: 6.5, desc: 'Brings goods to every home within 6 tiles.' },
  farm: { name: 'Wheat Farm', cost: { c: 50, p: 4 }, upkeep: 2, prod: 'grain', period: 7, desc: 'Grows Grain on open fields.' },
  bakery: { name: 'Bakery', cost: { c: 70, p: 5 }, upkeep: 3, prod: 'bread', period: 7, inp: 'grain', inpN: 2, desc: 'Bakes Grain into Bread for Settlers.' },
  chapel: { name: 'Chapel', cost: { c: 90, p: 8 }, upkeep: 5, radius: 7.5, desc: 'Settlers want a chapel within 7 tiles.' },
  tower: { name: 'Cannon Tower', cost: { c: 100, p: 10 }, upkeep: 6, radius: 7.5, desc: 'Sinks pirates within 7 tiles. No road needed.' },
  post: { name: 'Trading Post', cost: { c: 120, p: 10 }, upkeep: 4, desc: 'Merchants buy surplus goods. Build on the coast.' },
  kontor: { name: 'Kontor', upkeep: 0, desc: 'Your warehouse and harbour office.' }
};
const NEED_COAST = { fisher: 1, post: 1, tower: 0 };
const UP_COST = { c: 20, p: 3 };
const GOAL_POP = 150, GOAL_COINS = 500, GOAL_P1 = 40, GOAL_SET = 4;

let terrain, occ, road, rc, G;

/* ---------- map ---------- */
function genMap() {
  terrain = new Uint8Array(MW * MH);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const nx = (x + 0.5) / MW * 2 - 1, ny = (y + 0.5) / MH * 2 - 1;
    const d = Math.hypot(nx * 0.92, ny * 1.12);
    const n = vnoise(x * 0.17, y * 0.17, 7) * 0.65 + vnoise(x * 0.4, y * 0.4, 9) * 0.35;
    const e = 1 - Math.pow(d, 1.8) * 1.0 + (n - 0.5) * 0.75;
    let t;
    if (e < 0.1) t = T.DEEP; else if (e < 0.22) t = T.SHAL; else if (e < 0.3) t = T.SAND; else t = T.GRASS;
    if (t === T.GRASS) {
      const f = vnoise(x * 0.26 + 30, y * 0.26 + 11, 3);
      if (e > 0.36 && f > 0.6) t = T.FOREST;
      else if (e > 0.55 && vnoise(x * 0.3 + 5, y * 0.3 + 80, 5) > 0.66) t = T.ROCK;
    }
    terrain[y * MW + x] = t;
  }
}
const inb = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;
const tAt = (x, y) => inb(x, y) ? terrain[y * MW + x] : T.DEEP;
const isWater = t => t <= 1;
const buildable = (x, y) => { const t = tAt(x, y); return t === T.SAND || t === T.GRASS; };
function waterNear(x, y, r) {
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (isWater(tAt(x + i, y + j))) return true;
  return false;
}
function countTrees(x, y, r) {
  let n = 0;
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (i * i + j * j <= r * r + 1 && tAt(x + i, y + j) === T.FOREST) n++;
  return n;
}

/* ---------- game state ---------- */
function newGame(opts) {
  opts = opts || {};
  genMap();
  occ = new Int32Array(MW * MH); road = new Uint8Array(MW * MH); rc = new Uint8Array(MW * MH);
  G = {
    t: 0, accum: 0, sec: 0, coins: 900, stock: { wood: 30, plank: 40, fish: 20, grain: 0, bread: 0 },
    blds: [], nextId: 1, speed: 1, paused: false, tool: 'inspect', lastTool: 'road',
    cx: 0, cy: 0, vx: 0, vy: 0, zoom: 1, cam: { x: 0, y: 0 },
    toasts: [], fx: [], ships: [], pop: 0, popL1: 0, popL2: 0, settlers: 0, income: 0, stage: 0,
    nextRaid: 300, raids: 0, sunk: 0, over: null, overT: 0, demo: !!opts.demo, scenery: !!opts.scenery,
    bot: null, kontor: null, dirty: true, shake: 0, stats: { built: 0 }, hintT: 0
  };
  // place the Kontor on the best coastal 2x2
  let best = null, bs = -1e9;
  for (let y = 2; y < MH - 3; y++) for (let x = 2; x < MW - 3; x++) {
    if (!(buildable(x, y) && buildable(x + 1, y) && buildable(x, y + 1) && buildable(x + 1, y + 1))) continue;
    if (!waterNear(x, y, 2) && !waterNear(x + 1, y + 1, 2)) continue;
    let open = 0;
    for (let j = -7; j <= 8; j++) for (let i = -7; i <= 8; i++) if (buildable(x + i, y + j)) open++;
    const trees = countTrees(x, y, 9);
    const dc = Math.hypot(x - MW / 2, y - MH / 2);
    const s = Math.min(open, 170) * 1.2 + Math.min(trees, 14) * 2 - dc * 0.6;
    if (s > bs) { bs = s; best = [x, y]; }
  }
  const k = addBuilding('kontor', best[0], best[1], 2, 2);
  G.kontor = k; k.conn = true;
  G.cx = best[0] + 2; G.cy = best[1] + 3;
  G.vx = G.cx; G.vy = G.cy;
  const c = P(k.x + 1, k.y + 1);
  G.cam.x = c[0]; G.cam.y = c[1];
  G.zoom = 1;
  updateConn();
  if (!opts.scenery) {
    G.bot = opts.demo ? { wait: 1.2, cur: null, fail: {}, moveT: 0, stepWait: 0 } : null;
    if (!opts.demo) toast('Welcome to Anchovy Bay! Raise a Lumberjack and a Fisher, link them with roads.', 'info', 7);
  }
  return G;
}
function P(fx, fy) { return [(fx - fy) * TW / 2, (fx + fy) * TH / 2]; }

function addBuilding(type, x, y, w, h) {
  w = w || 1; h = h || 1;
  const b = {
    id: G.nextId++, type, x, y, w, h, level: 1, pop: 0, cap: type === 'house' ? 6 : 0, prog: 0, conn: false,
    status: 'ok', working: false, born: G.t, grow: 0, unsat: 0, sat: false, needs: null, trees: 0, fireT: 0, seed: Math.random() * 100,
    up: false, spin: 0
  };
  if (type === 'lumber') b.trees = countTrees(x, y, 4);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) occ[(y + j) * MW + x + i] = b.id;
  G.blds.push(b); G.dirty = true;
  return b;
}
const bldAt = (x, y) => { if (!inb(x, y)) return null; const id = occ[y * MW + x]; return id ? G.blds.find(b => b.id === id) : null; };
const centerOf = b => [b.x + b.w / 2, b.y + b.h / 2];
const count = type => { let n = 0; for (const b of G.blds) if (b.type === type) n++; return n; };

/* ---------- placement ---------- */
function canPlace(type, x, y, ignoreCost) {
  const d = DEFS[type];
  if (!inb(x, y)) return { ok: false, why: 'Out of bounds' };
  const t = tAt(x, y);
  if (type === 'road') {
    if (road[y * MW + x]) return { ok: false, why: 'Already a road' };
  }
  if (occ[y * MW + x]) return { ok: false, why: 'Something is already here' };
  if (road[y * MW + x]) return { ok: false, why: 'Remove the road first' };
  if (t === T.FOREST) return { ok: false, why: 'Trees in the way' };
  if (t === T.ROCK) return { ok: false, why: 'Solid rock' };

  // actions
  if (Inp.press.accept || (m.clicked && !overStrip && m.y > 200 && m.y < 900)) {
    if (m.clicked) { const [tx, ty] = screenToTile(m.x, m.y); if (inb(tx, ty)) { G.cx = tx; G.cy = ty; } }
    doAccept(false);
  } else if (moved && (Inp.held.accept || m.down) && (G.tool === 'road' || G.tool === 'demolish')) {
    if (!overStrip) doAccept(true);
  }
  followCam(dt);
  runSim(dt, G.speed);
  G.hintT += dt; if (G.hintT > 1) { G.hintT = 0; tutorial(); }
}
function updateDemo(dt) {
  const m = Inp.mouse;
  if (Inp.activity > demoStart + 0.05 || Inp.anyPressed || m.clicked) { exitDemo(); return; }
  botUpdate(dt);
  runSim(dt, G.speed);
  followCam(dt);
  if (G.over) { G.overT += dt; if (G.overT > 7) startDemo(); }
  else if (G.t > 1800) startDemo();
}

/* ---- per-screen update ---- */
function frame(dt, tm) {
  pollInput();
  const m = Inp.mouse;
  const blocked = touchOnly && !Inp.keyboardSeen && !Inp.padOn;
  UI.blockHit = null;
  musicTick();
  if (blocked && scr !== 'settings') {
    if (m.clicked && UI.blockHitPrev && m.x >= UI.blockHitPrev.x && m.x <= UI.blockHitPrev.x + UI.blockHitPrev.w && m.y >= UI.blockHitPrev.y && m.y <= UI.blockHitPrev.y + UI.blockHitPrev.h) { scr = 'settings'; retScr = 'title'; sfx('click'); }
    if (scr === 'title') { runSim(dt, 1); }
  } else {
    const titleLike = scr === 'title' || ((scr === 'howto' || scr === 'about' || scr === 'settings') && retScr === 'title');
    if (titleLike && !blocked && now() - Inp.activity > 10) startDemo();
    else switch (scr) {
      case 'title': {
        runSim(dt, 1);
        const a = navMenu('title', TITLE_ITEMS, dirRepeat(dt), null);
        if (a >= 0) {
          const id = TITLE_ITEMS[a].id;
          if (id === 'play') startGame(); else if (id === 'howto') { scr = 'howto'; retScr = 'title'; howPage = 0; } else if (id === 'settings') { scr = 'settings'; retScr = 'title'; Nav.sel.settings = 0; } else if (id === 'about') { scr = 'about'; retScr = 'title'; }
        }
        break;
      }
      case 'settings': {
        const a = navMenu('settings', SET_ITEMS, dirRepeat(dt), () => { scr = retScr; });
        if (a >= 0 && SET_ITEMS[a].id === 'back') { scr = retScr; }
        break;
      }
      case 'howto': {
        const d = dirRepeat(dt);
        if (d && Math.abs(d.x) > Math.abs(d.y)) { howPage = (howPage + (d.x > 0 ? 1 : 2)) % 3; sfx('click'); }
        const a = navMenu('howback', BACK_ITEM, null, () => { scr = retScr; });
        if (a >= 0) scr = retScr;
        break;
      }
      case 'about': {
        const a = navMenu('aboutback', BACK_ITEM, null, () => { scr = retScr; });
        if (a >= 0) scr = retScr;
        break;
      }
      case 'play': updateGame(dt); break;
      case 'demo': updateDemo(dt); break;
      case 'pause': {
        if (Inp.press.pause) { scr = 'play'; sfx('back'); break; }
        const a = navMenu('pause', PAUSE_ITEMS, dirRepeat(dt), () => { scr = 'play'; });
        if (a >= 0) {
          const id = PAUSE_ITEMS[a].id;
          if (id === 'resume') scr = 'play'; else if (id === 'howto') { scr = 'howto'; retScr = 'pause'; howPage = 0; } else if (id === 'settings') { scr = 'settings'; retScr = 'pause'; Nav.sel.settings = 0; }
          else if (id === 'restart') startGame(); else if (id === 'quit') { scr = 'title'; makeScenery(); Inp.activity = now(); }
        }
        break;
      }
      case 'result': {
        G.overT += dt; runSim(dt, 0.5);
        const a = navMenu('result', RESULT_ITEMS, dirRepeat(dt), null);
        if (a >= 0) { if (RESULT_ITEMS[a].id === 'again') startGame(); else { scr = 'title'; makeScenery(); Inp.activity = now(); } }
        break;
      }
    }
  }
  if (scr === 'title' || (retScr === 'title' && (scr === 'howto' || scr === 'about' || scr === 'settings'))) {
    const k = P(G.kontor.x + 1, G.kontor.y + 1);
    G.cam.x = k[0] - 560 + Math.sin(tm * 0.1) * 120; G.cam.y = k[1] - 30 + Math.cos(tm * 0.13) * 50; G.zoom = 1.0;
  }
  if (scr === 'settings' && (retScr === 'pause' || retScr === 'play')) { /* world frozen */ }
  render(tm, blocked);
  m.moved = false; m.clicked = false; m.right = false; m.wheel = 0;
}

function render(tm, blocked) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = INK; ctx.fillRect(0, 0, cv.width, cv.height);
  const k = view.dpr * view.s; ctx.setTransform(k, 0, 0, k, view.ox * view.dpr, view.oy * view.dpr);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  drawWorld(tm, W, H);
  paintOverlay(W, H);
  const game = !G.scenery;
  if (game) {
    drawHUD(tm);
    if (G.tool === 'inspect' && scr !== 'title') drawInspect();
    drawToolStrip();
    if (scr === 'play' || scr === 'demo') drawToasts();
    if (scr === 'play') drawGamePrompts();
  }
  switch (scr) {
    case 'title': drawTitle(tm); break;
    case 'demo':
      if (G.over) drawResult(null, true);
      else drawBanner('DEMONSTRATION — the AI governor is playing', 'Press any button to take the helm', tm);
      break;
    case 'pause': dimBackdrop(0.6); txt('Paused', W / 2, 220, 100, '#fff4d6', 'center', 'bold italic', 14, SERIF); drawMenu(PAUSE_ITEMS, Nav.sel.pause || 0, W / 2, 330, 620); if (S.hints) promptRow([['nav', 'Choose'], ['accept', 'Confirm'], ['pause', 'Resume']], 1040, W / 2); break;
    case 'result': drawResult(RESULT_ITEMS, false); if (S.hints) promptRow([['nav', 'Choose'], ['accept', 'Confirm']], 1040, W / 2); break;
    case 'settings': dimBackdrop(0.55); txt('Settings', W / 2, 190, 100, '#fff4d6', 'center', 'bold italic', 14, SERIF); drawMenu(SET_ITEMS, Nav.sel.settings || 0, W / 2, 290, 900); if (S.hints) promptRow([['nav', 'Choose'], ['adjust', 'Adjust'], ['back', 'Back']], 1040, W / 2); break;
    case 'howto': drawHowTo(howPage); drawMenu(BACK_ITEM, 0, W / 2, 912, 360); break;
    case 'about': drawAbout(); drawMenu(BACK_ITEM, 0, W / 2, 912, 360); break;
  }
  if (blocked && scr !== 'settings') drawBlocker();
  UI.blockHitPrev = UI.blockHit;
  ctx.restore();
}

/* ---- boot ---- */
let booted = false;
let ema = 0.016, slow = 0;
function loop() {
  requestAnimationFrame(loop);
  const t = now(), raw = t - last, dt = Math.min(0.05, raw); last = t;
  // adaptive resolution: if frames stay slow, render fewer backing pixels
  ema = ema * 0.95 + Math.min(raw, 0.2) * 0.05;
  if (ema > 0.036 && view.q > 0.55) { if (++slow > 90) { view.q = Math.max(0.55, view.q - 0.15); slow = 0; ema = 0.016; resize(); } } else slow = 0;
  frame(dt, t);
}
function boot() {
  if (booted) return; booted = true;
  resize(); addEventListener('resize', resize);
  bindInput(cv);
  addEventListener('keydown', e => { const mt = /^Digit([0-9])$/.exec(e.code); if (mt) pendingTool = (+mt[1] + 9) % 10; });
  makeScenery();
  window.__anchovy = { get G() { return G; }, get scr() { return scr; }, set scr(v) { scr = v; }, startGame, startDemo, actPlace, actUpgrade, botPlan, Inp, canPlace, simStep, econSecond, updateConn, get UI() { return UI; } };
  requestAnimationFrame(loop);
}
boot();

</script>
