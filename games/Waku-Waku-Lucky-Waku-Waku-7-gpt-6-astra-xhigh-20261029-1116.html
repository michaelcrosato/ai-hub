<!--
SOURCE INFORMATION, ENGINE FEEDBACK, TESTING FEEDBACK, PROMPT FEEDBACK
SOURCE
Date: 2026-10-29 11:58 America/Vancouver.
Source: Waku Waku 7.
Tech: Three.js 0.180.0 (R180), WebGPU only; Rapier 3D 0.19.3; Gamepad API; Web Audio API; PeerJS 1.5.5; AI Hub session client 1.3.0; vanilla JavaScript/CSS/HTML.
Art Direction: original cel-shaded 3D, stepped toon lighting, ink outlines, pastel carnival scenery.
Animation: procedural hierarchical character rigs, pose blending, squash/stretch and animated scenery.
Audio: code-composed sequencer music, synthesized effects and synthesized gibberish voices.
Online: 2–4 player private PeerJS rooms; AI Hub Protocol v1 versus sessions for 1–4 players; host-authoritative combat, predicted local movement, snapshots and disconnect handling. Local two-player versus also included.
Testing: efficient, lightweight browser and gameplay checks; no performance targets.
Environment: Codex CLI (headless); Linux; browser unknown.
Model: OpenAI, gpt-6-astra, reasoning effort xhigh.
Usage: estimated session time about 42 minutes; API cost unknown; token total and breakdown unknown.
ENGINE
Most liked: Three.js toon node materials, shadows and scene graphs made a coherent stylized cast practical.
Stuck or guessed wrong: initial headless WebGPU flags produced blank captures; explicit SwiftShader Vulkan flags and bundled Chromium resolved the test setup. WebGPURenderer also needed its default fallback disabled.
Most important custom system: the fighting-game state machine, hit timing, cancel rules, input buffers and multiplayer combat synchronization.
Hardest part: coordinating fixed-step physics, combat authority and animation while keeping gameplay independent of rendering.
Remove or overhaul: implicit renderer fallback behavior.
One change: expose a documented strict-WebGPU initialization option.
TESTING
Issues found and fixed during lightweight tests and targeted verification: 13; 3 affected core controls or combo/lesson completion.
Most helpful test: fixed-step combat assertions combined with the AI Hub conformance harness.
Least helpful test: the first screenshot under an incompatible headless WebGPU presentation setup; it showed a blank canvas despite successful initialization.
Passed: 12 combat/attract assertions; controller-only title-to-fight flow; axis inversion; EX, low guard, throw, held recovery, three-hit combo, arcade ending, and title safe areas at 1440×900, 1280×720 and 960×600.
AI Hub passed at 2, 3 and 4 players with 150 ms latency, 50 ms jitter, 5% loss, departures, host departure and a dedicated server. Network checks suppressed drawing after initialization; full WebGPU visuals were inspected separately.
Standalone PeerJS: two browser copies connected, guest movement reached the host, and departure ended the round; no runtime errors.
Test browser: Playwright Chromium 141.0.7390.37; software WebGPU/Vulkan, with Xvfb for visual captures. A physical-controller test across independent networks was not run.
PROMPT
Most liked: the specific source-game identity, controller-first UX and required attract mode give the game a clear design target.
Confusing: “all features” has no fixed size; this demo interprets it as a complete seven-fighter engine with a full arcade route, three stages and a guided mechanics dojo.
Hardest: combining polished fighting mechanics, accessible controls and two multiplayer transports in one portable HTML file.
One additional test: a real four-player session using DualSense controllers on separate networks at 250 ms latency.
-->

				"triangle",
				0.11,
				t,
				0,
				"music",

		f.crouch = input.y > 0.5 && ground && !f.attack;
		if (input.jump && f.stun <= 0 && !f.attack && f.jumps < 2) {
			f.jumps++;
			f.body.setLinvel({ x: v.x, y: f.jumps === 1 ? 10.6 : 9.2, z: 0 }, true);
			sound.fx("jump");
			view.ring(pos.x, pos.y - 0.5, 0xffedaa, 0.5);
			this.lessonEventFor(f, "jump");
		}
		if (input.actions.includes("dash") && !f.attack && !f.stun) {
			f.dash = 0.21;
			f.dashDir = Math.abs(input.x) > 0.3 ? Math.sign(input.x) : f.face;
			f.invuln = Math.max(f.invuln, 0.055);
			sound.fx("dash");
			this.lessonEventFor(f, "dash");
		}
		let act = input.actions.find((a) => a !== "dash" && a !== "burst");
		if (act) {
			if (f.air && ["jab", "kick", "heavy", "sweep"].includes(act)) act = "air";
			f.buffer = { type: act, ex: input.y > 0.5, time: 0.14 };
		}
		if (f.buffer) {
			f.buffer.time -= dt;
			let a = ATTACKS[f.buffer.type],
				cur = ATTACKS[f.attack];
			if (
				!f.stun &&
				(!f.attack ||
					(f.hitConfirm &&
						cur &&
						a.chain > cur.chain &&
						f.at > cur.start + 0.02))
			) {
				this.begin(f, f.buffer.type, f.buffer.ex);
				f.buffer = null;
			} else if (f.buffer.time <= 0) f.buffer = null;
		}
		if (f.attack) {
			let a = ATTACKS[f.attack];
			f.at += dt;
			if (f.at >= a.duration) {
				f.attack = "";
				f.at = 0;
			} else if (!predict) {
				this.processAttack(f, a, dt);
			}
		}
		let vx = f.body.linvel().x,
			vy = f.body.linvel().y;
		if (!f.stun) {
			let speed = CAST[f.char].speed;
			f.move = input.x;
			let desired = input.x * speed * (f.crouch ? 0.3 : f.guard ? 0.32 : 1);
			if (f.attack) desired *= 0.15;
			if (f.dash > 0) desired = f.dashDir * 12;
			if (f.roll > 0) desired = vx;
			if (
				f.attack === "special" &&
				["rush", "spin"].includes(CAST[f.char].special) &&
				f.at > 0.15 &&
				f.at < 0.45
			)
				desired = f.face * (f.ex ? 15 : 11);
			if (f.attack === "super" && f.at > 1.5 && f.at < 1.85)
				desired = f.face * 14;
			vx = ground ? desired : lerp(vx, desired, dt * 7);
			if (Math.abs(input.x) > 0.3) this.lessonEventFor(f, "move", dt);
		} else {
			f.move = 0;
			vx *= Math.exp(-dt * 1.7);
		}

		if (this.mode === "practice") f.meter = Math.min(7, f.meter + dt * 1.3);
		else f.meter = Math.min(7, f.meter + dt * 0.035);

			Math.abs(pos.x) > 9.2 &&
			f.stun > 0 &&
			Math.abs(vx) > 5 &&
			f.wall <= 0
		) {
			f.body.setLinvel({ x: -Math.sign(pos.x) * 8, y: 6, z: 0 }, true);
			f.wall = 0.6;
			f.stun = 0.5;
			view.particles(pos.x, pos.y, 0xffe76d, 20, true);
			this.say("SPECIAL WALL DELIVERY!", "Wall bounce", 0.75);
			let attacker = this.fighters.find((o) => o.id === f.lastHit);
			if (attacker) this.lessonEventFor(attacker, "wall");
		}
	}
	processAttack(f, a, dt) {
		if (f.at < a.start || f.at > a.end) return;
		const kind = CAST[f.char].special,
			pos = f.body.translation();
		if (f.attack === "special" && !f.spawned) {
			f.spawned = true;
			sound.voice(f.char);
			if (["shot", "wave", "orb"].includes(kind)) {
				this.spawnProjectile(f, kind);
				return;
			}
			if (kind === "upper")
				f.body.setLinvel({ x: f.face * 3, y: 9, z: 0 }, true);
		}
		if (f.attack === "special" && ["shot", "wave", "orb"].includes(kind))
			return;
		if (f.attack === "super" && !f.spawned) {
			f.spawned = true;
			view.ring(pos.x, pos.y + 1, CAST[f.char].accent, 2);
			view.particles(pos.x, pos.y + 1, CAST[f.char].accent, 28, true);
			view.shake = 1.4;
			sound.fx("heavy");
		}
		let reach = a.reach * (f.ex ? 1.3 : 1) * (f.char === 7 ? 1.15 : 1),
			damage = a.damage * (f.ex ? 1.3 : 1),
			level = a.level;
		if (f.attack === "special" && kind === "grab") {
			reach = 1.9;
			damage = 23;
			level = "throw";
		}
		for (let o of this.fighters) {
			if (o === f || o.hp <= 0 || o.left || o.respawn > 0 || f.hitSet.has(o.id))
				continue;
			let q = o.body.translation(),
				dx = q.x - pos.x,
				dy = q.y - pos.y;
			if (
				Math.abs(dx) < reach &&
				Math.abs(dy) < (f.attack === "super" ? 3.8 : 1.45) &&
				(dx * f.face > -0.45 || f.attack === "burst" || f.attack === "wake")
			) {
				f.hitSet.add(o.id);

	spawnProjectile(f, kind) {
		let p = f.body.translation(),
			col = CAST[f.char].accent,
			m = ball(
				null,
				col,
				[p.x + f.face * 0.9, kind === "wave" ? 0.45 : p.y + 0.7, 0],
				[0.33, 0.33, 0.33],
			);
		view.scene.add(m);
		let r = mesh(
			new THREE.TorusGeometry(0.43, 0.055, 8, 24),
			CAST[f.char].color,
			m,
			[0, 0, 0],
		);
		let body = this.world.createRigidBody(
			RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(
				m.position.x,
				m.position.y,
				0,
			),
		);
		this.world.createCollider(
			RAPIER.ColliderDesc.ball(0.3).setSensor(true).setCollisionGroups(0),
			body,
		);
		this.projectiles.push({
			mesh: m,
			body,
			owner: f.id,
			x: m.position.x,
			y: m.position.y,
			dir: f.face,
			speed: kind === "orb" ? 5 : 8,
			life: 2.4,
			ex: f.ex,
			kind,
		});
		sound.fx("dash");
	}
	hit(f, o, a) {
		if (o.invuln > 0) return;
		let pos = o.body.translation();
		if (
			o.down > 0 &&
			f.attack !== "sweep" &&
			f.attack !== "super" &&
			f.attack !== "air"
		)
			return;
		const block =
			o.guard &&
			a.level !== "unblockable" &&
			a.level !== "throw" &&
			(a.level === "low" ? o.crouch : a.level === "high" ? !o.crouch : true) &&
			o.face === -f.face;
		if (block) {
			let parry = o.guardTime < 0.13;
			if (parry) {
				o.meter = Math.min(7, o.meter + 0.45);
				o.parries++;
				f.stun = 0.32;
				f.attack = "";
				view.ring(pos.x, pos.y + 0.7, 0xb4f8e1, 0.8);
				sound.fx("parry");
				this.say("LUCKY PARRY!", "Your turn.", 0.65);
				this.lessonEventFor(o, "parry");
			} else {
				o.hp = Math.max(1, o.hp - a.damage * 0.07);
				o.meter = Math.min(7, o.meter + 0.13);
				o.body.setLinvel({ x: f.face * 2, y: 0, z: 0 }, true);
				sound.fx("block");
			}
			view.particles(pos.x, pos.y + 0.8, 0x9decdf, 8);
			this.lessonEventFor(o, "block");
			this.events.push({
				kind: "block",
				x: pos.x,
				y: pos.y + 0.8,
				c: 0x9decdf,
			});
			return;
		}
		let interrupted = o.attack === "super" && o.at < 1.52;
		let damage =
			a.damage * CAST[f.char].power * Math.max(0.45, 1 - f.combo * 0.1);
		if (o.down > 0) damage *= 0.55;
		o.hp = Math.max(0, o.hp - damage);
		o.attack = "";
		o.buffer = null;
		o.stun = a.stun;
		o.guard = false;
		o.lastHit = f.id;
		if (a.down) o.down = a.stun + 0.25;
		o.body.setLinvel({ x: f.face * a.push, y: a.launch || 2, z: 0 }, true);
		f.hitConfirm = true;
		f.combo = f.comboT > 0 ? f.combo + 1 : 1;
		f.comboT = 0.9;
		f.damage += damage;
		f.score += Math.round(damage * 10);
		f.meter = Math.min(7, f.meter + 0.18);
		o.meter = Math.min(7, o.meter + 0.12);
		if (f.attack === "super") f.superHit = true;
		this.freeze = Math.max(
			this.freeze,
			f.attack === "super" ? 0.1 : a.damage > 10 ? 0.055 : 0.025,
		);
		view.shake = a.damage > 10 ? 0.7 : 0.3;
		view.particles(
			pos.x,
			pos.y + 0.7,
			CAST[f.char].accent,
			a.damage > 10 ? 17 : 9,
			a.damage > 20,
		);
		view.ring(pos.x, pos.y + 0.7, 0xfff3c0, 0.35);
		sound.fx(a.damage > 10 ? "heavy" : "hit");
		this.events.push({
			kind: "hit",
			x: pos.x,
			y: pos.y + 0.7,
			c: CAST[f.char].accent,
		});
		if (interrupted) {
			this.say("RETURN TO SENDER!", "Super interrupted", 1);
			f.score += 150;
		}
		this.lessonEventFor(f, f.attack);
		this.lessonEventFor(f, "chain", f.combo);
		if (f.combo > 1) ui.combo(f.combo, o.id === 0 ? -1 : 1);
		if (o.hp <= 0) {
			f.kos++;
			f.score += 1000;
			sound.voice(f.char, true);
			if (this.mode === "network") {
				o.respawn = 2;
				this.say(CAST[f.char].name + " SCORES!", "Back in two shakes.", 1.2);
			} else if (this.mode === "practice") {
				o.hp = o.maxHp;
				f.hp = f.maxHp;
			} else if (this.mode === "attract") {
				o.hp = o.maxHp;
				f.hp = f.maxHp;
			} else this.finishRound(f.id);
		}
	}
	say(big, small = "", duration = 1.5) {
		this.noticeT = duration;
		ui.notice(big, small);
	}
	finishRound(id) {
		if (this.roundEnd || this.over) return;
		this.winner = id;
		this.roundEnd = 2.8;
		this.wins[id]++;
		sound.fx("win");
		this.say(
			id < 0
				? "DRAW!"
				: CAST[this.fighters.find((f) => f.id === id).char].name + " TAKES IT!",
			this.wins[id] >= 2 ? "MATCH COMPLETE" : "ROUND COMPLETE",
			2.8,
		);
	}
	nextRound() {
		if (Math.max(...this.wins) >= 2) {
			this.over = true;
			let winner = this.winner;
			if (this.mode === "arcade" && winner === 0) {
				this.score += this.fighters[0].score + Math.round(this.timer * 10);
				save.best = Math.max(save.best, this.score);
				persist();
				ui.victory(this.bout === 6);
			} else ui.result(winner);
		} else {
			this.round++;
			this.fighters.forEach((f, i) => {
				this.place(f, i ? -4 : 4);
				f.meter = 2;
			});
			this.timer = 60;
			this.countdown = 2;
			this.roundEnd = 0;
			this.winner = null;
		}
	}
	update(dt, inputs) {
		this.time += dt;
		this.noticeT = Math.max(0, this.noticeT - dt);
		if (!this.noticeT) $("#notice").classList.remove("show");
		if (this.ended) return;
		if (this.mode === "title" || this.mode === "select") {
			if (
				!(ui.room && !ui.room.closed) &&
				performance.now() - controls.last >= 10000 &&
				!ui.settingsOpen &&
				!ui.modal
			) {
				this.startAttract();
			}
			return;
		}
		if ((ui.blocking || ui.settingsOpen) && !this.net) return;
		if (this.mode === "attract" && this.time > 24) {
			this.startAttract((this.attractIndex + 1) % 7);
			return;
		}
		if (this.mode === "network" && this.net?.hub && AIHub.time() < 0) {
			this.countdown = 2;
			this.updateHUD();
			return;
		}
		if (this.over) return;
		if (this.countdown > 0) {
			this.countdown -= dt;
			ui.countdown(this.countdown);
			this.updateHUD();
			return;
		} else $("#countdown").classList.remove("show");
		this.sim += dt;
		if (this.roundEnd > 0) {
			this.roundEnd -= dt;
			if (this.roundEnd <= 0) this.nextRound();
			return;
		}
		if (this.freeze > 0) {
			this.freeze -= dt;
			return;
		}
		if (this.net && !this.net.isHost) {
			this.clientStep(dt, inputs);
			return;
		}
		this.timer -= dt;
		if (this.mode === "network" && this.net?.hub)
			this.timer = Math.max(
				0,
				(Math.min(150000, this.net.limitMs) - AIHub.time()) / 1000,
			);
		if (this.timer <= 0) {
			if (this.mode === "network") this.finishNetwork();
			else if (this.mode !== "practice" && this.mode !== "attract") {
				let a = this.fighters[0],
					b = this.fighters[1];
				if (Math.abs(a.hp - b.hp) < 0.01) {
					this.timer = 15;
					this.say("SUDDEN LUCK!", "Fifteen more seconds.", 1);
				} else this.finishRound(a.hp > b.hp ? a.id : b.id);
			}
			return;
		}
		for (let f of this.fighters) {
			let input = f.ai
				? this.aiInput(f, dt)
				: this.net
					? f.id === this.net.me
						? ui.settingsOpen || ui.blocking
							? emptyInput()
							: inputs[0]
						: this.remoteInput(f)
					: inputs[f.id] || emptyInput();
			if (this.mode === "attract" && f.meter < 3) f.meter = 5;
			this.stepFighter(f, input, dt);
		}
		this.stepProjectiles(dt);
		this.world.step();
		this.separate();
		if (this.mode === "practice") {
			for (let f of this.fighters)
				if (f.hp < 50 && !f.stun && !f.attack)
					f.hp = Math.min(f.maxHp, f.hp + dt * 25);
		}
		if (this.net) this.networkTick(dt);
		this.updateHUD();
	}
	separate() {
		for (let i = 0; i < this.fighters.length; i++)
			for (let j = i + 1; j < this.fighters.length; j++) {
				let a = this.fighters[i],
					b = this.fighters[j];
				if (a.left || b.left || a.respawn > 0 || b.respawn > 0) continue;
				let p = a.body.translation(),
					q = b.body.translation(),
					d = q.x - p.x;
				if (Math.abs(d) < 0.86 && Math.abs(p.y - q.y) < 1.3) {
					let push = (0.86 - Math.abs(d)) * 0.5,
						sign = d >= 0 ? 1 : -1;
					a.body.setTranslation(
						{ x: clamp(p.x - push * sign, -9.45, 9.45), y: p.y, z: 0 },
						true,
					);
					b.body.setTranslation(
						{ x: clamp(q.x + push * sign, -9.45, 9.45), y: q.y, z: 0 },
						true,
					);
				}
			}
	}
	stepProjectiles(dt) {
		for (let i = this.projectiles.length - 1; i >= 0; i--) {
			let p = this.projectiles[i];
			p.life -= dt;
			p.x += p.dir * p.speed * dt;
			p.mesh.position.x = p.x;
			p.mesh.rotation.z += dt * 5;
			p.body.setNextKinematicTranslation({ x: p.x, y: p.y, z: 0 });
			let owner = this.fighters.find((f) => f.id === p.owner);
			for (let o of this.fighters) {
				if (!owner || o.id === p.owner || o.hp <= 0 || o.left || o.respawn > 0)
					continue;
				let q = o.body.translation();
				if (Math.abs(q.x - p.x) < 0.7 && Math.abs(q.y + 0.2 - p.y) < 1) {
					this.hit(owner, o, {
						...ATTACKS.special,
						damage: p.ex ? 21 : 14,
						level: p.kind === "wave" ? "low" : "mid",
					});
					this.lessonEventFor(owner, "special");
					p.life = 0;
					break;
				}
			}
			if (p.life <= 0 || Math.abs(p.x) > 11) {
				view.scene.remove(p.mesh);
				this.world.removeRigidBody(p.body);
				this.projectiles.splice(i, 1);
			}
		}
	}
	startAttract(index = 0) {
		this.attractIndex = index;
		this.setup(
			[
				{ char: index, ai: true },
				{ char: (index + 3) % 7, ai: true },
			],
			"attract",
			index % 3,
		);
		this.fighters.forEach((f) => (f.meter = 7));
		ui.attract();
		this.say(
			"A LITTLE LUCK. A LOT OF PUNCH.",
			"Watch the warning. Interrupt the super.",
			3,
		);
	}
	updateHUD(force = false) {
		ui.hud(this, force);
	}
}

// Both transports use the same authoritative combat and locally predicted movement.
function hubTransport(info) {
	return {
		...info,
		hub: true,
		close() {},
		send: (d, o) => AIHub.send(d, o),
		onMessage: (fn) => AIHub.on("message", fn),
		onLeave: (fn) => AIHub.on("leave", ({ id }) => fn(id)),
	};
}
class Room {
	constructor() {
		this.me = 0;
		this.host = 0;
		this.isHost = true;
		this.hub = false;
		this.players = [];
		this.links = new Map();
		this.handlers = [];
		this.leavers = [];
		this.limitMs = 150000;
		this.closed = false;
		this.launched = false;
	}
	async library() {
		if (window.Peer) return;
		await new Promise((ok, no) => {
			let s = document.createElement("script");
			s.src = "https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js";
			s.onload = ok;
			s.onerror = () =>
				no(
					new Error("The room service could not load. Check your connection."),
				);
			document.head.append(s);
		});
	}
	async hostRoom(char) {
		await this.library();
		this.players = [{ id: 0, name: "Player 1", char }];
		this.code = String(
			crypto.getRandomValues(new Uint32Array(1))[0] % 1000000,
		).padStart(6, "0");
		this.peer = new Peer("waku-lucky-v1-" + this.code, { debug: 0 });
		this.errors();
		this.peer.on("open", () => {
			if (!this.closed) ui.roomLobby(this);
		});
		this.peer.on("connection", (conn) => {
			if (this.links.size >= 3 || this.launched) {
				conn.on("open", () => {
					conn.send({
						t: "reject",
						reason: "This room is full or already playing.",
					});
					setTimeout(() => conn.close(), 300);
				});
				return;
			}
			let id = [1, 2, 3].find((i) => !this.links.has(i));
			this.links.set(id, conn);
			conn.on("data", (data) => {
				if (data?.t === "join") {
					this.players.push({
						id,
						name: "Player " + (id + 1),
						char: clamp(Number(data.char) || 0, 0, 6),
					});
					conn.send({
						t: "welcome",
						me: id,
						code: this.code,
						players: this.players,
					});
					this.send({ t: "roster", players: this.players });
					ui.roomLobby(this);
				} else this.handlers.forEach((h) => h(data, id));
			});
			conn.on("close", () => this.depart(id));
			conn.on("error", () => this.depart(id));
		});
	}
	async joinRoom(code, char) {
		await this.library();
		this.isHost = false;
		this.code = code;
		this.peer = new Peer(undefined, { debug: 0 });
		this.errors();
		this.peer.on("open", () => {
			let c = this.peer.connect("waku-lucky-v1-" + code, { reliable: true });
			this.links.set(0, c);
			c.on("open", () => c.send({ t: "join", char }));
			c.on("data", (d) => {
				if (d?.t === "welcome") {
					this.me = d.me;
					this.players = d.players;
					ui.roomLobby(this);
				} else if (d?.t === "roster") {
					this.players = d.players;
					if (!this.launched) ui.roomLobby(this);
				} else if (d?.t === "reject") ui.networkError(d.reason);
				else if (d?.t === "launch") {
					this.launched = true;
					game.startNetwork(this, d.stage);
				} else this.handlers.forEach((h) => h(d, 0));

			}
		}
		if (performance.now() - this.lastHud < 60 && !force) return;
		this.lastHud = performance.now();
		const meter = (v) =>
			Array.from(
				{ length: 7 },
				(_, i) =>
					`<i class="${i < Math.floor(v) ? "full" : ""}" style="${i === Math.floor(v) ? `background:linear-gradient(90deg,#ffda63 ${(v % 1) * 100}%,#fff0d9 ${(v % 1) * 100}%)` : ""}"></i>`,
			).join("");

				? Math.ceil(Math.max(0, g.timer))

			settings[k] = Math.round(clamp(settings[k] + dir * 0.1, 0, 1) * 10) / 10;

		sound.fx("select");
		this.renderSettings();
	}

	networkResults(groups) {
		this.screen(
			`<div class="result-card"><div class="eyebrow">LUCKY RUMBLE COMPLETE</div><h2>WHAT A MESS!</h2>${groups.map((g, i) => `<p><b>${i + 1}.</b> ${g.map((id) => esc(game.fighters.find((f) => f.id === id)?.name || "Player")).join(" + ")}</p>`).join("")}<p style="font-size:15px">Knockouts first. Points break ties.</p>${game.net?.hub ? '<div class="score-line">RESULTS SENT TO AI HUB</div>' : this.btn("back", "BACK TO THE MARKET")}</div>`,
			{ back: () => game.toTitle() },
			{ kind: "result", blocking: false },
		);
	}
	handle(menu) {
		if (menu.pause) {
			this.openSettings();
			return;
		}
		if (this.settingsOpen) {
			if (menu.back) {
				this.closeSettings();
				return;
			}
			let bs = this.buttons();
			if (menu.dir) {
				if (Math.abs(menu.dir) === 2 && bs[this.index]?.dataset.setting)
					this.changeSetting(
						bs[this.index].dataset.setting,
						Math.sign(menu.dir),
					);
				else {
					this.index += Math.sign(menu.dir);
					this.focus();
					sound.fx("select");
				}
			}
			if (menu.confirm) bs[this.index]?.click();
			return;
		}
		if (this.kind === "play" || this.kind === "attract") {
			if (menu.back) this.openSettings();
			return;
		}
		if (this.kind === "credits") {
			if (menu.back) {
				game.toTitle();
				return;
			}
			if (menu.dir) {
				if (Math.abs(menu.dir) === 2)
					this.credits((this.creditPage + Math.sign(menu.dir) + 3) % 3);
				else
					$(".credits-content")?.scrollBy({
						top: Math.sign(menu.dir) * 140,
						behavior: "smooth",
					});
			}
			if (menu.confirm) this.credits((this.creditPage + 1) % 3);
			return;
		}
		if (this.kind === "select") {
			if (menu.back) {
				this.back?.();
				return;
			}
			if (menu.dir) {
				this.selectChar = (this.selectChar + Math.sign(menu.dir) + 7) % 7;
				game.preview(this.selectChar);
				this.renderSelect();
				sound.fx("select");
			}
			if (menu.confirm) this.confirmFighter();
			return;
		}
		if (this.kind === "practice") {
			if (menu.tab) this.cyclePractice();
			if (menu.reset) game.positionLesson();
			if (menu.lessonNext) this.nextLesson(1);
			if (menu.lessonPrev) this.nextLesson(-1);
			if (menu.confirm && game.lessonDone) this.nextLesson();
			if (menu.back) this.openSettings();
			return;
		}
		if (menu.back) {
			if (this.kind === "play") this.openSettings();
			else this.back?.();
			return;
		}
		if (menu.dir) {
			let delta =
				Math.abs(menu.dir) === 2
					? Math.sign(menu.dir)
					: Math.sign(menu.dir) * this.cols;
			this.index += delta;
			this.focus();
			sound.fx("select");
		}
		if (menu.confirm) this.buttons()[this.index]?.click();
	}
}
const ui = new UI();

// main.js
let booted = false,
	lastFrame = 0,
	pendingInputs = [];
$("#settings-button").addEventListener("click", () => {
	sound.unlock();
	ui.openSettings();
});
async function boot() {
	try {
		await Promise.all([view.init(), RAPIER.init()]);
		AIHub.probe(() => ({
			scene:
				game.ended || game.over
					? "over"
					: game.net?.hub && AIHub.time() < 0
						? "ready"
						: game.mode === "title"
							? "title"
							: game.mode === "select"
								? "menu"
								: "play",
			menu: ui.settingsOpen,
			world: game.sim,
			input: {
				x: ui.settingsOpen ? 0 : controls.states[0]?.x || 0,
				y: ui.settingsOpen ? 0 : controls.states[0]?.y || 0,
				fire: ui.settingsOpen ? false : !!controls.states[0]?.fire,
			},
		}));
		if (AIHub.active) {
			let info = await AIHub.connect({ mode: "versus", seats: [1, 4] });
			if (info) {
				game.aiRng = AIHub.rng("computer");
				game.startNetwork(hubTransport(info), info.seed % 3);
				AIHub.on("time-up", () => game.finishNetwork());
				AIHub.on("end", ({ reason }) => {
					game.ended = true;
					game.over = true;
					sound.enabled = false;
					controls.keys.clear();
					if (reason !== "finished")
						ui.notice("ROUND ENDED", reason.replaceAll("-", " "));
				});
				AIHub.ready();
			} else game.toTitle();
		} else game.toTitle();
		await view.renderer.compileAsync(view.scene, view.camera);
		view.update(game, performance.now() / 1000, 1 / 60);
		controls.last = performance.now();
		booted = true;
		$("#loading").remove();
		window.__lucky = {
			game,
			view,
			ui,
			controls,
			sound,
			settings,
			CAST,
			ATTACKS,
			LESSONS,
			version: "1.0.0",
			backend: view.renderer.backend.isWebGPUBackend ? "WebGPU" : "unknown",
		};
		lastFrame = performance.now();
		requestAnimationFrame(frame);
	} catch (e) {
		console.error(e);
		AIHub.fail(e.message);
		$("#loading").innerHTML =
			`<div class="fatal"><div class="load-star">✦</div><h1 class="loading-title">A little more power, please.</h1><p>${esc(e.message)}</p><p>WebGPU is required. Use a compatible browser with hardware acceleration, and serve the file over HTTPS or localhost.</p></div>`;
	}
}
function frame(now) {
	let dt = Math.min(0.1, (now - lastFrame) / 1000);
	lastFrame = now;
	const read = controls.poll();
	const input = read.map((s, i) => ({
		...s,
		actions: [...new Set([...(pendingInputs[i]?.actions || []), ...s.actions])],
		jump: s.jump || pendingInputs[i]?.jump,
	}));
	pendingInputs = input;
	if (!game.ended) {
		ui.handle(controls.menu);
		sound.tick();
	}
	game.acc += dt;
	let n = 0;
	while (game.acc >= 1 / 60 && n++ < 5) {
		game.update(1 / 60, input);
		input.forEach((s) => {
			s.actions = [];
			s.jump = false;
		});
		game.acc -= 1 / 60;
	}
	if (n >= 5) game.acc = 0;
	view.update(game, now / 1000, dt);
	if (matchMedia("(pointer: coarse)").matches)
		$("#touch-notice").classList.toggle("show", !controls.seen);
	requestAnimationFrame(frame);
}
addEventListener("visibilitychange", () => {
	if (
		document.hidden &&
		!game.net &&
		booted &&
		!["title", "select", "attract"].includes(game.mode) &&
		!ui.settingsOpen
	)
		ui.openSettings();
});
boot();
</script></body></html>
