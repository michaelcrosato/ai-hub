- Art Direction: Stylised cel-shading: 4-step toon gradient lighting (MeshToonMaterial), inverted-hull ink outlines on every object, flat saturated palettes, procedural canvas patterns (checker, dots, stripes, bricks, grass), sky-dome gradients, toon clouds, shadow maps.

- Audio: All code-written, no audio files: Web Audio synthesised sound effects, a seeded step-sequencer that composes seven music tracks from data (scale, chord progression, drum style), and Animalese / gibberish voice acting where each typed letter triggers a pitched, formant-filtered blip with a per-character voice profile.
- Online: AI Hub race session (protocol v1, mode "race", 1-4 seats): shared Hyper Hop Rally course built from the hub seed, own-player simulation, 15 Hz unreliable state messages, interpolated rivals in seat colours, hub progress/result/awards. All traffic goes through AIHub.send(); nothing else is networked. Also plays fully on its own.

TESTING FEEDBACK
  - How many issues did testing catch?
    7: GPU read-back rows were padded (garbled captures), title logo overlapped the menu, first-person ears and blaster were oversized, shadow acne on the boss arena floor, attract-mode bot lost hull to falls despite god mode, results panel overflowed and hid its buttons, and my first hub-harness run was polluted by stale files in a shared temp folder.
  - How many would be considered critical issues / game breaking?
    0 in the shipped build. The closest was the harness timing out, which turned out to be a test-setup problem; a clean folder passed.
  - What was the most helpful test you ran?
    Running the real attract-mode bot through all four stages with manual sim stepping: it exercised physics, jumping, enemies, pods, gates and the boss, and printed progress. The AI Hub harness automatic check was a close second.
  - What was the least helpful test you ran?
    Waiting on wall-clock timers (fades) while stepping the sim manually, and a first screenshot approach that returned blank WebGPU canvases; both cost time without finding game bugs.

ENGINE FEEDBACK
  - What did you like most about the engine?
    Three.js WebGPURenderer accepted the usual scene graph, MeshToonMaterial with a gradient map gave a cel look with almost no setup, and Rapier's kinematic character controller delivered solid, moving-platform-friendly movement quickly.
  - Did you get stuck or guess wrong?
    Mildly. I guessed the character controller needs constant slight downward velocity to report grounded, and had to treat snap-to-ground as something to switch on and off around jumps. GPU read-back needed 256-byte-aligned row widths, which the docs do not mention.
  - What was the most important thing you had to build yourself?
    The jump-chain player feel (apex-timed sweet hops, coyote time, buffering, landing guide), plus the UI layer, music sequencer and Animalese voice, none of which an engine provides.
  - What was the hardest part about using the engine?
    Verifying visuals headlessly: WebGPU canvases screenshot blank under SwiftShader, so I built a render-target capture hook, and software rendering is slow enough that tests had to step the simulation manually.
  - If you had to remove or overhaul one thing from engine, what woudl that be?
    The silent WebGPU-to-WebGL2 fallback inside WebGPURenderer. For a no-fallback requirement I had to check the backend myself; an explicit option that throws would be clearer.
  - If you could change one thing about the engine, what would it be?
    A built-in, documented outline/cel post-process (or an outline material) so ink lines do not require duplicated inverted-hull meshes.

PROMPT FEEDBACK
  - What did you like most about this prompt?
    The 10-foot controller-first framing and the explicit inverted-axis toggle requirement: they gave concrete, checkable UX targets, and the AI Hub protocol link made multiplayer integration well specified and testable with its harness.
  - What was confusing?
    Hub guidance says to provide a WebGL2 fallback while this task says WebGPU with no fallback; I resolved it by declaring hub:webgpu required. The source game has no multiplayer, so choosing a mode was open.
  - What was the hardest thing to do?
    Scope: a feature-complete vertical slice (four stages, boss, attract mode, settings, voices, music, hub race) in one sitting while keeping testing lightweight.
  - If there was one test you could of run, what would that be?
    A real DualSense plus real GPU playthrough with a human timing the triple-hop gaps, to tune jump distances and stick feel that the bot and SwiftShader cannot judge.

ightweight testing (headless Chromium via Playwright with SwiftShader WebGPU, scripted sim stepping, the AI Hub harness automatic check).",env:"Claude Code CLI (headless); Linux (WSL2); browser unknown (tested in headless Chromium)",model:"Anthropic, claude-sonnet-5-5, reasoning effort medium",usage:"unknown (the session does not expose token counts or cost; not estimated)"},FEEDBACK={testing:[["How many issues did testing catch?","7: GPU read-back rows were padded (garbled captures), title logo overlapped the menu, first-person ears and blaster were oversized, shadow acne on the boss arena floor, attract-mode bot lost hull to falls despite god mode, results panel overflowed and hid its buttons, and my first hub-harness run was polluted by stale files in a shared temp folder."],["How many would be considered critical issues / game breaking?","0 in the shipped build. The closest was the harness timing out, which turned out to be a test-setup problem; a clean folder passed."],["What was the most helpful test you ran?","Running the real attract-mode bot through all four stages with manual sim stepping: it exercised physics, jumping, enemies, pods, gates and the boss, and printed progress. The AI Hub harness automatic check was a close second."],["What was the least helpful test you ran?","Waiting on wall-clock timers (fades) while stepping the sim manually, and a first screenshot approach that returned blank WebGPU canvases; both cost time without finding game bugs."]],engine:[["What did you like most about the engine?","Three.js WebGPURenderer accepted the usual scene graph, MeshToonMaterial with a gradient map gave a cel look with almost no setup, and Rapier's kinematic character controller delivered solid, moving-platform-friendly movement quickly."],["Did you get stuck or guess wrong?","Mildly. I guessed the character controller needs constant slight downward velocity to report grounded, and had to treat snap-to-ground as something to switch on and off around jumps. GPU read-back needed 256-byte-aligned row widths, which the docs do not mention."],["What was the most important thing you had to build yourself?","The jump-chain player feel (apex-timed sweet hops, coyote time, buffering, landing guide), plus the UI layer, music sequencer and Animalese voice, none of which an engine provides."],["What was the hardest part about using the engine?","Verifying visuals headlessly: WebGPU canvases screenshot blank under SwiftShader, so I built a render-target capture hook, and software rendering is slow enough that tests had to step the simulation manually."],["If you had to remove or overhaul one thing from engine, what woudl that be?","The silent WebGPU-to-WebGL2 fallback inside WebGPURenderer. For a no-fallback requirement I had to check the backend myself; an explicit option that throws would be clearer."],["If you could change one thing about the engine, what would it be?","A built-in, documented outline/cel post-process (or an outline material) so ink lines do not require duplicated inverted-hull meshes."]],prompt:[["What did you like most about this prompt?","The 10-foot controller-first framing and the explicit inverted-axis toggle requirement: they gave concrete, checkable UX targets, and the AI Hub protocol link made multiplayer integration well specified and testable with its harness."],["What was confusing?","Hub guidance says to provide a WebGL2 fallback while this task says WebGPU with no fallback; I resolved it by declaring hub:webgpu required. The source game has no multiplayer, so choosing a mode was open."],["What was the hardest thing to do?","Scope: a feature-complete vertical slice (four stages, boss, attract mode, settings, voices, music, hub race) in one sitting while keeping testing lightweight."],["If there was one test you could of run, what would that be?","A real DualSense plus real GPU playthrough with a human timing the triple-hop gaps, to tune jump distances and stick feel that the bot and SwiftShader ca
