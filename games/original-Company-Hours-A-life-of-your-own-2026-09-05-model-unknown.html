                this.confirm('Restore the previous save?', `Return to ${backup.player.name}’s previous autosave on day ${backup.day}? Your current state will be replaced.`, () => this.start(backup), 'Restore backup', 'book');
            }
            catch (err) {
                this.toast(err.message, true);
            }
            return;
        }
        if (act === 'new-career') {
            this.confirm('A different next chapter?', 'Your current career will stay saved until you start the new one. Export a backup first to keep both stories.', () => this.renderSetup(), 'Create a new career', 'flower');
            return;
        }
    }
    submit(form) {
        const f = new FormData(form), kind = form.dataset.form, s = this.s;
        if (kind === 'start') {
            const opts = { name: f.get('name'), age: Number(f.get('age')), pronouns: f.get('pronouns'), style: f.get('style'), region: f.get('region'), difficulty: f.get('difficulty'), goal: f.get('goal'), ...this.formChoices };
            if (opts.age < 21 || opts.age > 80)
                return;
            this.start(newGame(opts));
            return;
        }
        if (kind === 'book') {
            const result = book(s, form.dataset.id, Number(f.get('day')), Number(f.get('time')));
            if (!result.ok) {
                document.getElementById('modal-error').textContent = result.message;
                this.sound.cue(false);
                return;
            }
            this.modal = null;
            this.panel = 'calendar';
            this.tabs.calendar = Number(f.get('day')) === s.day ? 'today' : Number(f.get('day')) === s.day + 1 ? 'tomorrow' : 'later';
            this.toast(result.message);
            this.save();
            this.refresh();
            return;
        }
        if (kind === 'negotiate') {
            if (this.run(() => negotiate(s, form.dataset.id, Number(f.get('amount'))))) {
                this.openModal('booking', { id: form.dataset.id });
            }
            return;
        }
        if (kind === 'rate') {
            const rate = Math.round(Number(f.get('rate')));
            if (!Number.isFinite(rate) || rate < 60 || rate > 1500) {
                this.toast('Set a rate between $60 and $1,500.', true);
                return;
            }
            s.rate = rate;
            for (const l of s.leads)
                if (!l.negotiated)
                    l.offer = rate;
            this.toast('New enquiries now use your updated rate.');
            this.save();
            this.refresh();
            return;
        }
        if (kind === 'savings') {
            const amount = Number(f.get('amount')) * (f.get('direction') === 'withdraw' ? -1 : 1);
            this.run(() => transfer(s, amount));
            return;
        }
        if (kind === 'notes') {
            const c = s.clients[form.dataset.id];
            if (c) {
                c.notes = String(f.get('notes')).slice(0, 800);
                this.modal = null;
                this.toast('Client notes saved on this device.');
                this.save();
                this.refresh();
            }
            return;
        }
    }
    change(el) {
        if (el.id === 'file-input') {
            this.importSave(el.files[0]);
            return;
        }
        if (el.dataset.bookingDay) {
            const c = this.s.leads.find(l => l.id === el.dataset.bookingDay);
            if (c) {
                const val = Number(el.value) === this.s.day ? Math.ceil((this.s.time + 40) / 30) * 30 : 600;
                document.getElementById('booking-time').innerHTML = this.slotOptions(c, Number(el.value), val);
            }
            return;
        }
        if (el.dataset.support) {
            const key = el.dataset.support;
            if (!['security', 'manager'].includes(key))
                return;
            const enabled = el.checked, cost = key === 'security' ? 35 : 30;
            if (enabled && !pay(this.s, cost, key === 'security' ? 'Hire safety coordinator' : 'Hire booking manager')) {
                this.toast('Not enough available cash to hire support.', true);
                el.checked = false;
                return;
            }
            this.s[key] = enabled;
            fillLeads(this.s);
            this.save();
            this.refresh();
            return;
        }
        const k = el.dataset.setting;
        if (!k)
            return;
        const v = el.type === 'checkbox' ? el.checked : el.value;
        if (k === 'privacy') {
            if (['private', 'balanced', 'public'].includes(v))
                this.s.privacy = v;
        }
        else if (k === 'disclosure') {
            this.run(() => disclosure(this.s, v));
            return;
        }
        else if (['quality', 'textScale', 'volume', 'reduceMotion', 'highContrast', 'showLabels', 'audio'].includes(k)) {
            this.s.settings[k] = ['volume', 'textScale'].includes(k) ? Number(v) : v;
            if (k === 'audio')
                this.sound.enable(v, this.s.settings.volume).catch(() => this.toast('Audio could not be started in this browser.', true));
            this.applySettings();
        }
        this.save();
        this.renderHUD();
    }
    tick(dt, elapsed = dt) {
        if (!this.world)
            return;
        const playing = this.isPlaying();
        if (playing)
            advance(this.s, Math.min(dt, .1) * 2 * this.speed);
        this.world.sampleFrame(elapsed, this.documentHidden);
        this.world.animate(Math.min(dt, .1), playing, this.speed);
        this.sound.update(playing);
        this.autoSaveCounter += elapsed;
        this.lastHUD += elapsed;
        if (this.lastHUD > .65) {
            this.lastHUD = 0;
            this.renderHUD();
        }
        if (this.autoSaveCounter > 25) {
            this.autoSaveCounter = 0;
            this.save();
        }
        if (this.started && this.s.time >= 1320 && this.nightNotified !== this.s.day) {
            this.nightNotified = this.s.day;
            this.toast('It is 22:00. Head home, close out today’s bookings, and get some rest.');
        }
    }
}





/** Bundled distributions need no network. Otherwise try two pinned sources. */
async function loadThree() {
    if (window.__GC_THREE)
        return window.__GC_THREE;
    const sources = [
        'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js',
        'https://unpkg.com/three@0.180.0/build/three.module.min.js',
    ];
    for (const source of sources) {
        let timer;
        try {
            return await Promise.race([
                import(source),
                new Promise((_, reject) => {
                    timer = setTimeout(() => reject(new Error('Renderer download timed out')), 4000);
                }),
            ]);
        }
        catch (error) {
            console.warn('Renderer dependency unavailable:', source, error.message);
        }
        finally {
            clearTimeout(timer);
        }
    }
    return null;
}
async function boot() {
    const state = newGame({ name: 'Rowan', seed: 826061, shirt: '#739780' });
    const ui = new Interface(document.getElementById('app'), state);
    const THREE = await loadThree();
    const world = new Town(document.getElementById('world'), document.getElementById('world-labels'), { state, THREE });
    ui.attach(world);
    let previous = performance.now();
    function frame(now) {
        const elapsed = Math.max(0, (now - previous) / 1000);
        previous = now;
        try {
            // Simulation catch-up is capped; diagnostics retain the actual frame interval.
            ui.tick(Math.min(.15, elapsed), elapsed);
        }
        catch (error) {
            console.error(error);
            ui.error('An unexpected display error occurred. Your last save remains available. Export it from Settings before reloading.');
        }
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    window.CompanyHours = Object.freeze({
        version: '0.6.0',
        getState: () => structuredClone(ui.s),
        metrics: () => world.getMetrics(),
    });
    if (new URLSearchParams(location.search).has('test') || window.__GC_TEST) {
        window.__GC = { ui, world };
    }
}
boot().catch(error => {
    console.error(error);
    const loading = document.getElementById('loading');
    if (loading) {
        loading.innerHTML = '<div><h1>There was a problem opening the town.</h1><p>Reload in a modern browser. Existing saved progress has not been intentionally changed.</p><button onclick="location.reload()">Reload</button></div>';
    }
});
