<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#8ed7f0" />
  <meta name="description" content="Starfall Pilgrims: Bellroot Vale — single-file mobile-first low-poly browser JRPG vertical slice." />
  <title>Starfall Pilgrims: Bellroot Vale</title>
  <style>
:root {
  color-scheme: light;
  --ink: #25323a;
  --cream: #fff8dc;
  --paper: rgba(255, 250, 226, 0.94);
  --edge: #573f2f;
  --sky: #8ed7f0;
  --blue: #2f7db9;
  --green: #47a667;
  --gold: #f0b94d;
  --danger: #d85d54;
  --shadow: rgba(29, 31, 33, 0.28);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--sky); font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif; color: var(--ink); }
button { font: inherit; }
#game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#fx-vignette { pointer-events: none; position: fixed; inset: 0; z-index: 3; background: radial-gradient(circle at 50% 45%, transparent 48%, rgba(18,43,57,.15) 100%); mix-blend-mode: multiply; }
#ui-root { position: fixed; inset: 0; z-index: 5; pointer-events: none; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.panel { background: var(--paper); border: 3px solid var(--edge); border-radius: 16px; box-shadow: 0 5px 0 rgba(87,63,47,.25), 0 12px 30px var(--shadow); }
.hud { position: absolute; inset: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) auto max(10px, env(safe-area-inset-left)); display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.stats { min-width: 174px; padding: 9px 11px; font-weight: 800; letter-spacing: .01em; }
.stats-row { display: grid; grid-template-columns: auto 1fr auto; gap: 7px; align-items: center; font-size: 12px; }
.bar { height: 9px; background: #d9cfb8; border: 2px solid #573f2f; border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 50%; background: var(--green); }
.bar.mp > i { background: var(--blue); }
.status-small { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; }
.quest { max-width: min(44vw, 330px); padding: 10px 12px; }
.quest strong { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #7a573b; }
.quest span { display: block; margin-top: 3px; font-weight: 800; font-size: 13px; line-height: 1.2; }
.backend { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 96px; padding: 5px 9px; border-radius: 999px; background: rgba(22,40,48,.66); color: white; font: 700 10px/1 system-ui; letter-spacing: .08em; }
.toast-stack { position: absolute; left: 50%; top: 17%; transform: translateX(-50%); display: grid; gap: 8px; width: min(90vw, 420px); }
.toast { padding: 10px 14px; border-radius: 999px; background: rgba(37,50,58,.88); color: white; text-align: center; font-weight: 800; font-size: 13px; animation: toastIn .25s ease-out; }
@keyframes toastIn { from { transform: translateY(-8px); opacity: 0; } }
.dialogue { position: absolute; left: 50%; bottom: max(16px, calc(env(safe-area-inset-bottom) + 8px)); transform: translateX(-50%); width: min(92vw, 700px); padding: 14px 16px 13px; pointer-events: auto; }
.dialogue .speaker { font-size: 12px; font-weight: 900; color: #7a573b; text-transform: uppercase; letter-spacing: .1em; }
.dialogue p { margin: 5px 0 10px; font-size: 16px; font-weight: 750; line-height: 1.32; }
.dialogue .hint { text-align: right; font-size: 11px; opacity: .7; }
.combat { position: absolute; left: 50%; bottom: max(12px, calc(env(safe-area-inset-bottom) + 6px)); transform: translateX(-50%); width: min(94vw, 760px); padding: 12px; pointer-events: auto; }
.combat-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 8px; }
.enemy-name { font-weight: 950; font-size: 18px; }
.enemy-hp { font-size: 12px; font-weight: 800; }
.combat-log { min-height: 42px; background: rgba(64,46,34,.08); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; font-weight: 750; font-size: 13px; line-height: 1.25; }
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.actions button, .primary-btn, .small-btn { border: 3px solid var(--edge); background: #fff6d4; color: var(--ink); border-radius: 12px; box-shadow: 0 4px 0 #9c785b; padding: 10px 7px; font-weight: 900; min-height: 46px; pointer-events: auto; cursor: pointer; }
.actions button:active, .primary-btn:active, .small-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #9c785b; }
.actions button:disabled { opacity: .45; filter: grayscale(.5); cursor: default; }
.actions small { display:block; font-size: 10px; opacity:.65; }
.mobile-controls { position: absolute; inset: auto 0 max(16px, calc(env(safe-area-inset-bottom) + 8px)); 0; pointer-events: none; }
.joystick { pointer-events: auto; position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: 0; width: 126px; height: 126px; border-radius: 50%; background: rgba(255,255,255,.26); border: 3px solid rgba(87,63,47,.42); box-shadow: inset 0 0 28px rgba(255,255,255,.38); touch-action: none; }
.joystick::after { content:""; position:absolute; inset:20px; border-radius:50%; border:2px dashed rgba(87,63,47,.25); }
.stick { position: absolute; left: 36px; top: 36px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,248,220,.9); border: 3px solid var(--edge); box-shadow: 0 4px 0 rgba(87,63,47,.25); }
.action-btn { pointer-events: auto; position: absolute; right: max(20px, env(safe-area-inset-right)); bottom: 8px; width: 92px; height: 92px; border-radius: 50%; border: 4px solid var(--edge); background: #f4c857; color: #4d382c; box-shadow: 0 6px 0 #9c785b, 0 10px 24px rgba(0,0,0,.2); font-weight: 950; font-size: 14px; touch-action: none; }
.action-btn small { display: block; font-size: 9px; margin-top: 2px; opacity: .65; }
.action-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9c785b; }
.camera-hint { position: absolute; right: 18px; bottom: 112px; font-size: 10px; font-weight: 800; color: white; text-shadow: 0 2px 3px rgba(0,0,0,.5); opacity:.8; }
.title-screen { pointer-events: auto; position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: linear-gradient(rgba(84,159,198,.12), rgba(18,61,83,.34)); }
.title-card { width: min(92vw, 520px); padding: 24px 22px 20px; text-align: center; }
.title-kicker { text-transform: uppercase; letter-spacing: .22em; font-size: 11px; font-weight: 950; color: #7a573b; }
.title-card h1 { margin: 5px 0 0; font-size: clamp(34px, 9vw, 58px); line-height: .88; color: #2e668f; text-shadow: 0 3px 0 white, 0 5px 0 #573f2f; }
.title-card h2 { margin: 10px 0 14px; font-size: 19px; color: #5b8a3b; }
.title-card p { margin: 8px auto 16px; max-width: 40ch; font-weight: 700; line-height: 1.35; }
.primary-btn { padding: 11px 18px; background: #f4c857; font-size: 16px; }
.controls-note { margin-top: 10px; font-size: 10px; line-height: 1.35; opacity: .7; }
.shop { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 560px); padding: 15px; pointer-events: auto; }
.shop h3 { margin: 0 0 3px; font-size: 22px; }
.shop p { margin: 0 0 12px; font-size: 12px; font-weight: 700; }
.shop-list { display: grid; gap: 8px; }
.shop-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; border: 2px solid #b69b73; border-radius: 12px; padding: 9px; background: rgba(255,255,255,.48); }
.shop-item strong { display:block; }
.shop-item span { font-size: 11px; }
.shop-buttons { display:flex; gap:8px; justify-content:flex-end; margin-top: 12px; }
.small-btn { min-height: 38px; padding: 7px 10px; }
.complete { position:absolute; inset:0; display:grid; place-items:center; background:rgba(32,62,79,.48); pointer-events:auto; padding:18px; }
.complete-card { width:min(92vw,560px); padding:22px; text-align:center; }
.complete h2 { margin:0; font-size:30px; color:#2e668f; }
.complete p { font-weight:700; line-height:1.35; }
.hidden { display: none !important; }
.fatal-card { width:min(90vw,560px); margin:10vh auto; padding:24px; background:#fff8dc; border:3px solid #573f2f; border-radius:16px; }
.screen-flash { position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 20; transition: opacity .12s; }
.screen-flash.on { opacity: .78; }
@media (pointer: fine) and (min-width: 860px) {
  .joystick, .action-btn { opacity: .72; }
  .camera-hint::after { content: " · Mouse drag rotates · wheel zooms"; }
}
@media (max-width: 520px) {
  .hud { gap: 6px; }
  .stats { min-width: 151px; padding: 8px 9px; }
  .quest { max-width: 42vw; padding: 8px 9px; }
  .quest span { font-size: 11px; }
  .backend { top: 90px; }
  .actions { grid-template-columns: repeat(2, 1fr); }
  .combat { padding: 10px; }
  .dialogue p { font-size: 14px; }
}

  <script id="legacy-source" type="text/plain">
const canvas=document.getElementById('game-canvas');
const ui=document.getElementById('ui-root');
const gl=canvas.getContext('webgl',{antialias:true})||canvas.getContext('experimental-webgl');
if(!gl) throw new Error('WebGL1 unavailable');

ui.innerHTML=`
<div class="hud hidden" id="hud"><div class="panel stats"><div class="stats-row"><b id="lv">Lv 1</b><div class="bar"><i id="hpbar"></i></div><span id="hp">34/34</span></div><div class="status-small"><span id="xp">XP 0</span><span id="gold">12G</span><span id="herb">Herb ×2</span></div></div><div class="panel quest"><strong>Moonbell Errand</strong><span id="quest">Speak with Elder Nessa by the fountain.</span></div></div>
<div class="backend hidden" id="backend">WEBGL1 SAFE MODE</div><div class="toast-stack" id="toasts"></div>

<div class="panel combat hidden" id="combat"><div class="combat-top"><div><div class="enemy-name" id="enemyName"></div><div class="enemy-hp" id="enemyHp"></div></div></div><div class="combat-log" id="combatLog"></div><div class="actions"><button id="attack">Attack</button><button id="skill">Star Slash<small>4 MP</small></button><button id="guard">Guard</button><button id="useHerb">Herb</button></div></div>
<div class="mobile-controls hidden" id="controls"><div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><button class="action-btn" id="action"><span id="label">LOOK</span><small>E / SPACE</small></button><div class="camera-hint">WebGL1 reduced visual mode</div></div>
<div class="title-screen" id="title"><div class="panel title-card"><div class="title-kicker">Legacy compatibility renderer</div><h1>Starfall<br>Pilgrims</h1><h2>Bellroot Vale</h2><p>This reduced WebGL1 view keeps the quest, combat, leveling, gear upgrade, boss, and completion loop playable.</p><button class="primary-btn" id="begin">Begin Pilgrimage</button></div></div>
<div class="complete hidden" id="complete"><div class="panel complete-card"><h2>The Moonbell Rings Again</h2><p id="doneText"></p><button class="primary-btn" onclick="location.reload()">Play Again</button></div></div>`;
const $=id=>document.getElementById(id);

const vs=`attribute vec2 p;uniform vec2 center;uniform vec2 aspect;uniform float scale;void main(){vec2 q=(p-center)*scale*aspect;gl_Position=vec4(q.x,q.y,0.,1.);}`;
const fs=`precision mediump float;uniform vec4 color;void main(){gl_FragColor=color;}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);
const buf=gl.createBuffer(), pLoc=gl.getAttribLocation(prog,'p'), centerLoc=gl.getUniformLocation(prog,'center'), aspectLoc=gl.getUniformLocation(prog,'aspect'), scaleLoc=gl.getUniformLocation(prog,'scale'), colorLoc=gl.getUniformLocation(prog,'color');
gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(pLoc);gl.vertexAttribPointer(pLoc,2,gl.FLOAT,false,0,0);

const C={grass:[.33,.62,.28,1],path:[.78,.62,.38,1],river:[.19,.58,.75,1],wood:[.42,.25,.14,1],cream:[.9,.79,.51,1],roof:[.7,.22,.17,1],stone:[.54,.57,.58,1],hero:[.15,.46,.78,1],npc:[.56,.36,.7,1],enemy:[.33,.58,.22,1],enemy2:[.48,.35,.65,1],gold:[.9,.62,.15,1],black:[.08,.1,.11,1]};
function rect(x,z,w,h,c){const a=[x-w/2,z-h/2,x+w/2,z-h/2,x+w/2,z+h/2,x-w/2,z-h/2,x+w/2,z+h/2,x-w/2,z+h/2];draw(a,c);}
function tri(x,z,r,c){draw([x,z-r,x+r,z+r,x-r,z+r],c);}
function draw(a,c){gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(a),gl.DYNAMIC_DRAW);gl.uniform4fv(colorLoc,c);gl.drawArrays(gl.TRIANGLES,0,a.length/2);}

const G={x:0,z:24,mode:'title',stage:0,kills:0,level:1,xp:0,gold:12,hp:34,mp:12,herbs:2,weapon:2,armor:2,guard:false,joy:{x:0,y:0,id:null},keys:new Set(),dialog:[],dialogDone:null,battle:null,enemies:[{x:-4.6,z:-3.8,n:'Mossling',hp:19,max:19,a:6,d:1,xp:11,g:7,c:C.enemy,alive:true},{x:4.8,z:-10.5,n:'Tusklet',hp:27,max:27,a:8,d:2,xp:14,g:9,c:C.enemy2,alive:true},{x:-3.6,z:-24.2,n:'Mossling',hp:19,max:19,a:6,d:1,xp:11,g:7,c:C.enemy,alive:true}],chest:false};
const maxHP=()=>34+(G.level-1)*8, atk=()=>7+(G.level-1)*2+G.weapon, def=()=>3+(G.level-1)+G.armor;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('toasts').append(e);setTimeout(()=>e.remove(),2200);}
function quest(){return G.stage===0?'Speak with Elder Nessa by the fountain.':G.stage===1?'Defeat one road monster, then reach Moonbell Shrine.':G.stage===2?'Cross the bridge and defeat the Moonbell Guardian.':G.stage===3?'Return to Elder Nessa in Bellroot Vale.':'The Moonbell rings again. Quest complete.'}
function updateUI(){$('lv').textContent='Lv '+G.level;$('hp').textContent=`${G.hp}/${maxHP()}`;$('hpbar').style.width=100*G.hp/maxHP()+'%';$('xp').textContent='XP '+G.xp;$('gold').textContent=G.gold+'G';$('herb').textContent='Herb ×'+G.herbs;$('quest').textContent=quest();}
function say(s,lines,done){G.mode='dialog';G.dialog=lines.slice();G.dialogDone=done;$('controls').classList.add('hidden');$('dialogue').classList.remove('hidden');nextLine(s);}
function nextLine(s){if(G.mode!=='dialog')return;const t=G.dialog.shift();if(t){$('speaker').textContent=s||'Bellroot Vale';$('text').textContent=t;}else{$('dialogue').classList.add('hidden');G.mode='world';$('controls').classList.remove('hidden');const d=G.dialogDone;G.dialogDone=null;if(d)d();}}
function talk(){if(G.stage===0)say('Elder Nessa',['The Moonbell has gone quiet, pilgrim. Take 8G, defeat one road monster, then wake the shrine bell.','You do not need to grind. One gear upgrade and careful Guard use are enough.'],()=>{G.stage=1;G.gold+=8;toast('Quest started · +8G');});else if(G.stage===3)say('Elder Nessa',['The bell is ringing again. Take this Skybound Pin and call the errand done.'],()=>finish());else say('Elder Nessa',[G.stage===1?'One monster is enough. Keep north after that.':'The guardian is beyond the bridge.']);}
function action(){if(G.mode==='dialog'){nextLine($('speaker').textContent);return;}if(G.mode!=='world')return;const dE=Math.hypot(G.x-2.7,G.z-18.3),dS=Math.hypot(G.x+5.8,G.z-12),dC=Math.hypot(G.x-6.8,G.z+6.4);if(dE<2.5)talk();else if(dS<2.4){if(G.gold>=20&&G.weapon<5){G.gold-=20;G.weapon=5;toast('Copper Saber equipped · ATK up');}else if(G.gold>=20&&G.armor<5){G.gold-=20;G.armor=5;toast('Wayfarer Coat equipped · DEF up');}else toast('Mara: Save 20G for an ATK or DEF upgrade.');}else if(dC<2.4){if(!G.chest){G.chest=true;G.gold+=16;G.herbs++;toast('+16G · Herb +1');}else toast('The chest is empty.');}else toast('Nothing to inspect here');updateUI();}
function battle(e,boss=false){G.mode='combat';G.battle=boss?{x:0,z:-34,n:'Moonbell Guardian',hp:66,max:66,a:10,d:3,xp:38,g:34,boss:true,c:C.stone}:e;$('controls').classList.add('hidden');$('combat').classList.remove('hidden');updateBattle();}
function updateBattle(msg='Choose an action.'){$('enemyName').textContent=G.battle.n;$('enemyHp').textContent=`HP ${Math.max(0,G.battle.hp)} / ${G.battle.max}`;$('combatLog').textContent=msg;updateUI();}
function playerAct(kind){if(G.mode!=='combat'||!G.battle)return;let msg='';if(kind==='attack'){const d=Math.max(1,Math.round(atk()+Math.random()*2-G.battle.d*.4));G.battle.hp-=d;msg=`You strike for ${d} damage.`;}if(kind==='skill'){if(G.mp<4)return toast('Not enough MP');G.mp-=4;const d=Math.round(atk()*1.35+4-G.battle.d*.2);G.battle.hp-=d;msg=`Star Slash deals ${d} damage!`;}if(kind==='guard'){G.guard=true;msg='You guard.';}if(kind==='herb'){if(!G.herbs)return toast('No herbs');G.herbs--;G.hp=Math.min(maxHP(),G.hp+20);msg='You recover HP.';}updateBattle(msg);if(G.battle.hp<=0)return setTimeout(win,320);setTimeout(enemyTurn,360);}
function enemyTurn(){let d=Math.max(1,Math.round(G.battle.a+Math.random()*2-def()*.5));if(G.guard)d=Math.ceil(d*.5);G.guard=false;G.hp-=d;if(G.hp<=0){G.hp=maxHP();G.mp=12+(G.level-1)*2;G.gold=Math.max(0,G.gold-Math.ceil(G.gold*.2));G.x=0;G.z=24;$('combat').classList.add('hidden');G.mode='world';$('controls').classList.remove('hidden');toast('Recovered in Bellroot Vale · lost 20% gold');}else updateBattle(`${G.battle.n} hits for ${d} damage.`);updateUI();}
function win(){const b=G.battle;G.xp+=b.xp;G.gold+=b.g;if(b.boss)G.stage=3;else{b.alive=false;G.kills++;if(G.stage===1){G.stage=2;toast('Moonbell Shrine unlocked');}}if(G.xp>=20&&G.level<2){G.level=2;G.hp=maxHP();G.mp=14;toast('Level 2! Stats increased');}$('combat').classList.add('hidden');G.mode='world';G.battle=null;$('controls').classList.remove('hidden');toast(`Victory · +${b.xp} XP · +${b.g}G`);updateUI();}
function finish(){G.stage=4;G.mode='complete';$('hud').classList.add('hidden');$('controls').classList.add('hidden');$('complete').classList.remove('hidden');$('doneText').textContent=`WebGL1 safe-mode clear · Level ${G.level} · ${G.gold}G remaining.`;}

$('begin').onclick=()=>{G.mode='world';$('title').classList.add('hidden');$('hud').classList.remove('hidden');$('backend').classList.remove('hidden');$('controls').classList.remove('hidden');toast('WebGL1 compatibility mode');};
$('action').onpointerdown=e=>{e.preventDefault();action();};$('dialogue').onpointerdown=()=>nextLine($('speaker').textContent);$('attack').onclick=()=>playerAct('attack');$('skill').onclick=()=>playerAct('skill');$('guard').onclick=()=>playerAct('guard');$('useHerb').onclick=()=>playerAct('herb');
addEventListener('keydown',e=>{G.keys.add(e.code);if(e.code==='KeyE'||e.code==='Space')action();});addEventListener('keyup',e=>G.keys.delete(e.code));
const joy=$('joystick'),stick=$('stick');joy.onpointerdown=e=>{G.joy.id=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e)};joy.onpointermove=e=>{if(e.pointerId===G.joy.id)moveJoy(e)};joy.onpointerup=e=>{if(e.pointerId===G.joy.id){G.joy={x:0,y:0,id:null};stick.style.transform='translate(0,0)'}};
function moveJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=e.clientX-cx,y=e.clientY-cy,l=Math.hypot(x,y)||1,m=37;if(l>m){x=x/l*m;y=y/l*m}G.joy.x=x/m;G.joy.y=y/m;stick.style.transform=`translate(${x}px,${y}px)`;}
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';gl.viewport(0,0,canvas.width,canvas.height);}
addEventListener('resize',resize);resize();

    }}
    makeHouse(-8.2,20,.08,MAT.roof); this.addRect(-8.2,20,2.55,2.4);

    makeFence(-17,-1,10,true); makeFence(17,-1,10,true);

    for(let x=-2.6;x<=2.6;x+=.65) box([.56,.18,5.2],MAT.woodLight,[x,.18,-18],scene,true,true);
    box([.18,.75,5.4],MAT.wood,[-2.9,.65,-18]); box([.18,.75,5.4],MAT.wood,[2.9,.65,-18]);
    for(let z=-20.3;z<=-15.7;z+=1.1){ box([.22,.72,.22],MAT.wood,[-2.9,.62,z]); box([.22,.72,.22],MAT.wood,[2.9,.62,z]); }
    // Banks and rocks.
    for(let x=-24;x<=24;x+=3){

      const r=sphere(.65+(Math.abs(x)%4)*.08,MAT.stone,[x,.2,-15.2+(x%2)*.3],scene,6,4); r.scale.y=.55;
      const r2=sphere(.6,MAT.stoneLight,[x+.7,.14,-20.7-(x%2)*.22],scene,6,4); r2.scale.y=.5;

    for(let i=0;i<4;i++) box([6.8-i*.7,.2,1],MAT.stoneLight,[0,.1+i*.2,-28.3-i*.72],scene,false,true);
    cyl(.55,.7,4.8,8,MAT.stoneLight,[-4.8,3.2,-36.5]); cyl(.55,.7,4.8,8,MAT.stoneLight,[4.8,3.2,-36.5]);
    box([10.3,.55,.8],MAT.stone,[0,5.25,-36.5]);
    const bell=cyl(.72,1.0,1.2,8,MAT.gold,[0,4.35,-36.6]); bell.rotation.x=Math.PI/2;
    sphere(.22,MAT.gold,[0,3.65,-36.6],scene,6,4);
    // Village trees + meadow trees.
    const trees=[[-14,22,1.1],[14,23,1],[-14,12,.9],[14,11,1.1],[-17,4,1.2],[16,1,.9],[-14,-7,1.1],[13,-6,1],[-16,-26,1.25],[15,-27,1.15],[-10,-35,.8],[10,-37,.9],[-18,-38,1.2],[18,-36,1.25]];
    for(const [x,z,s] of trees){ makeTree(x,z,s); this.addCircle(x,z,.75*s); }

  }

  addRect(x,z,hx,hz){ this.colliders.push({type:'rect',x,z,hx,hz}); }
  addCircle(x,z,r){ this.colliders.push({type:'circle',x,z,r}); }
  addInteractable(id,label,x,z,radius,action,marker=null){ this.interactables.push({id,label,x,z,radius,action,marker,active:true}); }

  spawnEnemy(type,x,z){
    const data=type==='mossling'
      ? {name:'Mossling',maxHp:19,atk:6,def:1,xp:11,gold:7,model:makeMossling()}
      : {name:'Tusklet',maxHp:27,atk:8,def:2,xp:14,gold:9,model:makeTusklet()};
    data.type=type; data.hp=data.maxHp; data.homeX=x; data.homeZ=z; data.phase=Math.random()*Math.PI*2; data.active=true;
    data.model.position.set(x,0,z); scene.add(data.model); this.enemies.push(data);
  }

  bindInput(){
    addEventListener('keydown',(e)=>{
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
      this.keys.add(e.code);
      if(e.repeat) return;
      if(e.code==='KeyE'||e.code==='Space'||e.code==='Enter') this.handleAction();
      if(this.mode==='combat'){
        if(e.code==='Digit1') this.combatAction('attack');
        if(e.code==='Digit2') this.combatAction('skill');
        if(e.code==='Digit3') this.combatAction('guard');
        if(e.code==='Digit4') this.combatAction('herb');
      }
    });
    addEventListener('keyup',(e)=>this.keys.delete(e.code));
    $('beginButton').addEventListener('click',()=>this.start());
    $('restartButton').addEventListener('click',()=>location.reload());
    actionButton.addEventListener('pointerdown',(e)=>{e.preventDefault(); audio.unlock(); this.handleAction();});
    dialogueEl.addEventListener('pointerdown',(e)=>{e.preventDefault(); this.advanceDialogue();});
    combatActionsEl.addEventListener('click',(e)=>{ const b=e.target.closest('button[data-action]'); if(b) this.combatAction(b.dataset.action); });
    joystick.addEventListener('pointerdown',(e)=>{
      if(this.mode!=='world') return;
      this.joy.pointer=e.pointerId; joystick.setPointerCapture(e.pointerId); this.updateJoy(e);
    });
    joystick.addEventListener('pointermove',(e)=>{ if(e.pointerId===this.joy.pointer) this.updateJoy(e); });
    const endJoy=(e)=>{ if(e.pointerId===this.joy.pointer){ this.joy.pointer=null; this.joy.x=this.joy.y=0; stick.style.transform='translate(0px,0px)'; }};
    joystick.addEventListener('pointerup',endJoy); joystick.addEventListener('pointercancel',endJoy);
    canvas.addEventListener('pointerdown',(e)=>{
      if(!this.started || this.mode!=='world') return;
      canvas.setPointerCapture(e.pointerId);
      this.canvasPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(this.canvasPointers.size===1){ this.dragPointer=e.pointerId; this.dragLast={x:e.clientX,y:e.clientY}; }
      if(this.canvasPointers.size===2){ const pts=[...this.canvasPointers.values()]; this.lastPinch=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y); this.dragPointer=null; }
    });
    canvas.addEventListener('pointermove',(e)=>{
      if(!this.canvasPointers.has(e.pointerId)||this.mode!=='world') return;
      this.canvasPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(this.canvasPointers.size>=2){
        const pts=[...this.canvasPointers.values()]; const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
        if(this.lastPinch){ this.zoom=clamp(this.zoom+(this.lastPinch-d)*.018,8.2,17); }
        this.lastPinch=d;
      }else if(e.pointerId===this.dragPointer && this.dragLast){
        const dx=e.clientX-this.dragLast.x; this.cameraYaw-=dx*.008; this.dragLast={x:e.clientX,y:e.clientY};
      }
    });
    const endCanvas=(e)=>{
      this.canvasPointers.delete(e.pointerId);
      if(e.pointerId===this.dragPointer){this.dragPointer=null;this.dragLast=null;}
      if(this.canvasPointers.size<2) this.lastPinch=null;
      if(this.canvasPointers.size===1){ const [id,p]=this.canvasPointers.entries().next().value; this.dragPointer=id; this.dragLast={...p}; }
    };
    canvas.addEventListener('pointerup',endCanvas); canvas.addEventListener('pointercancel',endCanvas);
    canvas.addEventListener('wheel',(e)=>{ e.preventDefault(); this.zoom=clamp(this.zoom+Math.sign(e.deltaY)*.8,8.2,17); },{passive:false});
    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight,false); renderer.setPixelRatio(Math.min(devicePixelRatio,Math.min(innerWidth,innerHeight)<700?1.45:2));
    });
  }

  updateJoy(e){
    const r=joystick.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
    let dx=e.clientX-cx, dy=e.clientY-cy; const max=37, len=Math.hypot(dx,dy)||1; if(len>max){dx=dx/len*max;dy=dy/len*max;}
    this.joy.x=dx/max; this.joy.y=dy/max; stick.style.transform=`translate(${dx}px,${dy}px)`;
  }

  start(){
    audio.unlock(); audio.quest(); this.started=true; this.mode='world'; titleScreen.classList.add('hidden'); hud.classList.remove('hidden'); backendBadge.classList.remove('hidden'); mobileControls.classList.remove('hidden');
    this.toast('Welcome to Bellroot Vale');
  }

  questText(){
    if(this.questStage===0) return 'Speak with Elder Nessa by the fountain.';
    if(this.questStage===1) return 'Defeat a road monster, then reach Moonbell Shrine.';
    if(this.questStage===2) return 'Cross the bridge and defeat the Moonbell Guardian.';
    if(this.questStage===3) return 'Return to Elder Nessa in Bellroot Vale.';
    return 'The Moonbell rings again. Quest complete.';
  }

  talkElder(){
    if(this.questStage===0){
      this.say('Elder Nessa',[
        'There you are, pilgrim! The old Moonbell has gone quiet, and the road sprites are making a sport of the bridge.',
        'Take this 8G travel purse. Defeat one road monster so I know you can handle yourself, then wake the bell at the northern shrine.',
        'No need to clear every monster in the vale. A sensible traveler chooses their battles.'
      ],()=>{this.questStage=this.kills>0?2:1;this.gold+=8;this.toast(this.kills>0?'Quest started · road already proven · +8G':'Quest started · +8G');audio.quest();this.updateQuestMarker();this.updateUI(true);});
    } else if(this.questStage===3){
      this.say('Elder Nessa',[
        'That sound! The Moonbell is singing all the way down the valley.',
        'You did the work of a whole caravan. Keep this Skybound Pin — every proper pilgrim needs one absurdly shiny keepsake.',
        'Bellroot Vale will remember your first little legend.'
      ],()=>{this.questStage=4;this.charm='Skybound Pin';this.charmHP=8;this.hp=this.maxHP;this.complete();});
    } else if(this.questStage===4){
      this.say('Elder Nessa',["The bell is awake, the bridge is open, and the tea is still hot. That's a good day's adventuring."]);
    } else {
      this.say('Elder Nessa',[this.questStage===1?this.kills>0?'You already proved yourself on the road. Keep north for the shrine.':'One road monster is enough. Then keep north for the shrine.':'The guardian should be waiting beyond the bridge. Use Guard and Herbs if it hits hard.']);
    }
  }

  updateQuestMarker(){
    const e=this.interactables.find(i=>i.id==='elder');
    if(e?.marker) e.marker.visible=this.questStage===0||this.questStage===3;
    this.bossGroup.visible=this.questStage>=2&&this.questStage<3;
    this.bossMarker.visible=this.bossGroup.visible;
  }

  openChest(){
    if(this.chestOpened){ this.say('Road Chest',["Empty. Someone already took the sensible supplies. (It was you.)"]); return; }
    this.chestOpened=true; this.gold+=16; this.herbs+=1; if(this.chestMarker) this.chestMarker.visible=false;
    this.chest.rotation.z=.04;
    this.say('Road Chest',["You found 16G and a Medicinal Herb.","That is enough money to make a meaningful gear choice at Mara's shop."],()=>{this.toast('+16G · Herb +1');this.updateUI(true);});
  }

  say(speaker,lines,onDone=null){
    if(this.mode==='combat') return;
    this.mode='dialogue'; this.dialogueQueue=lines.map(t=>({speaker,text:t})); this.dialogueDone=onDone; mobileControls.classList.add('hidden'); this.advanceDialogue(true);
  }

  advanceDialogue(first=false){
    if(this.mode!=='dialogue') return;
    if(!first) audio.click();
    const next=this.dialogueQueue.shift();
    if(next){ speakerEl.textContent=next.speaker||''; dialogueTextEl.textContent=next.text; dialogueEl.classList.remove('hidden'); }
    else {
      dialogueEl.classList.add('hidden'); const done=this.dialogueDone; this.dialogueDone=null; this.mode='world'; mobileControls.classList.remove('hidden'); if(done) done();
    }
  }

  openShop(){
    if(this.mode!=='world') return;
    this.mode='shop'; mobileControls.classList.add('hidden');
    const items=[
      {id:'saber',name:'Copper Saber',desc:'+5 ATK (replaces Pilgrim Blade)',cost:24,owned:this.weapon==='Copper Saber'},
      {id:'coat',name:'Wayfarer Coat',desc:'+5 DEF (replaces Traveler Vest)',cost:26,owned:this.armor==='Wayfarer Coat'},
      {id:'herb',name:'Medicinal Herb',desc:'Restore 20 HP in battle',cost:6,owned:false}
    ];
    shopEl.innerHTML=`<h3>Mara's Road Gear</h3><p>You have <b>${this.gold}G</b>. The slice is tuned so one upgrade helps, but neither is mandatory.</p><div class="shop-list">${items.map(i=>`<div class="shop-item"><div><strong>${i.name}</strong><span>${i.desc}</span></div><button class="small-btn" data-buy="${i.id}" ${i.owned?'disabled':''}>${i.owned?'Equipped':i.cost+'G'}</button></div>`).join('')}</div><div class="shop-buttons"><button class="small-btn" id="closeShop">Done</button></div>`;
    shopEl.classList.remove('hidden');
    shopEl.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>this.buy(b.dataset.buy)));
    shopEl.querySelector('#closeShop').addEventListener('click',()=>this.closeShop());
  }

  buy(id){
    const data={saber:{cost:24},coat:{cost:26},herb:{cost:6}}[id]; if(!data) return;
    if(this.gold<data.cost){this.toast('Not enough gold');audio.tone(110,.1,'square',.02);return;}
    if(id==='saber'&&this.weapon==='Copper Saber') return; if(id==='coat'&&this.armor==='Wayfarer Coat') return;
    this.gold-=data.cost;
    if(id==='saber'){this.weapon='Copper Saber';this.weaponBonus=5;this.toast('Copper Saber equipped · ATK up');}
    if(id==='coat'){this.armor='Wayfarer Coat';this.armorBonus=5;this.toast('Wayfarer Coat equipped · DEF up');}
    if(id==='herb'){this.herbs++;this.toast('Medicinal Herb +1');}
    audio.quest(); this.updateUI(true); this.mode='world'; this.openShop();
  }

  closeShop(){ shopEl.classList.add('hidden'); this.mode='world'; mobileControls.classList.remove('hidden'); }

  handleAction(){
    audio.unlock();
    if(this.mode==='dialogue'){this.advanceDialogue();return;}
    if(this.mode==='shop'||this.mode==='combat'||this.mode==='complete'||this.mode==='title') return;
    if(this.nearest){ audio.click(); this.nearest.action(); }
    else this.toast('Nothing to inspect here');
  }

  canMove(x,z){
    const r=.42;
    for(const c of this.colliders){
      if(c.type==='circle'){
        const dx=x-c.x,dz=z-c.z;if(dx*dx+dz*dz<(c.r+r)*(c.r+r)) return false;
      }else{
        if(x+r>c.x-c.hx&&x-r<c.x+c.hx&&z+r>c.z-c.hz&&z-r<c.z+c.hz) return false;
      }
    }
    return true;
  }

  groundHeight(x,z){
    if(z<-27){ const t=clamp((-z-27)/3,0,1); return lerp(0,.8,t); }
    if(z<-15.3&&z>-20.7&&Math.abs(x)<3.1) return .18;
    return 0;
  }

  updateMovement(dt){
    if(this.mode!=='world'||!this.started) return;
    let sx=this.joy.x, sy=this.joy.y;
    if(this.keys.has('KeyA')||this.keys.has('ArrowLeft')) sx-=1;
    if(this.keys.has('KeyD')||this.keys.has('ArrowRight')) sx+=1;
    if(this.keys.has('KeyW')||this.keys.has('ArrowUp')) sy-=1;
    if(this.keys.has('KeyS')||this.keys.has('ArrowDown')) sy+=1;
    const l=Math.hypot(sx,sy); if(l>.05){ sx/=Math.max(1,l);sy/=Math.max(1,l);
      const fwd=new THREE.Vector3(-Math.sin(this.cameraYaw),0,-Math.cos(this.cameraYaw));
      const right=new THREE.Vector3(Math.cos(this.cameraYaw),0,-Math.sin(this.cameraYaw));
      const dir=fwd.multiplyScalar(-sy).add(right.multiplyScalar(sx)).normalize();
      const speed=5.25; const nx=this.hero.position.x+dir.x*speed*dt, nz=this.hero.position.z+dir.z*speed*dt;
      if(this.canMove(nx,this.hero.position.z)) this.hero.position.x=nx;
      if(this.canMove(this.hero.position.x,nz)) this.hero.position.z=nz;
      const targetRot=Math.atan2(-dir.x,-dir.z); let d=((targetRot-this.hero.rotation.y+Math.PI)%(Math.PI*2))-Math.PI; this.hero.rotation.y+=d*Math.min(1,dt*12);
      this.hero.userData.walk=(this.hero.userData.walk||0)+dt*10; this.hero.position.y=this.groundHeight(this.hero.position.x,this.hero.position.z)+Math.abs(Math.sin(this.hero.userData.walk))*.035;
    } else this.hero.position.y=lerp(this.hero.position.y,this.groundHeight(this.hero.position.x,this.hero.position.z),Math.min(1,dt*10));
  }

  updateNearby(){
    if(this.mode!=='world'){this.nearest=null;return;}
    let best=null,bestD=Infinity; const px=this.hero.position.x,pz=this.hero.position.z;
    for(const i of this.interactables){ if(!i.active) continue; const d=Math.hypot(px-i.x,pz-i.z); if(d<i.radius&&d<bestD){best=i;bestD=d;} }
    this.nearest=best; actionLabel.textContent=best?best.label.toUpperCase():'LOOK';
    // Enemy touch triggers.
    for(const e of this.enemies){ if(!e.active) continue; const d=Math.hypot(px-e.model.position.x,pz-e.model.position.z); if(d<1.28){this.startCombat(e);return;} }
    if(this.questStage>=2&&this.questStage<3&&this.bossGroup.visible&&Math.hypot(px-this.bossGroup.position.x,pz-this.bossGroup.position.z)<2.45){
      this.startCombat({type:'boss',name:'Moonbell Guardian',maxHp:66,hp:66,atk:10,def:3,xp:38,gold:34,model:this.bossGroup,active:true,boss:true});
    }
  }

  startCombat(enemy){
    if(this.mode!=='world') return;
    this.mode='combat'; this.battle=enemy; this.battle.hp=enemy.hp??enemy.maxHp; this.battle.turn=0; this.battleBusy=false; this.guarding=false;
    mobileControls.classList.add('hidden'); combatEl.classList.remove('hidden'); enemyNameEl.textContent=enemy.name; this.setCombatLog(`${enemy.name} blocks the road!`); this.updateCombatUI(); audio.hit();
  }

  setCombatLog(text){ combatLogEl.textContent=text; }

  updateCombatUI(){
    if(!this.battle) return;
    enemyHpEl.textContent=`HP ${Math.max(0,this.battle.hp)} / ${this.battle.maxHp}`;
    turnTagEl.textContent=this.battleBusy?'Resolving…':'Your turn';
    combatActionsEl.querySelectorAll('button').forEach(b=>{
      let disabled=this.battleBusy||this.battle.hp<=0;
      if(b.dataset.action==='skill'&&this.mp<4) disabled=true;
      if(b.dataset.action==='herb'&&(this.herbs<=0||this.hp>=this.maxHP)) disabled=true;
      b.disabled=disabled;
    });
    this.updateUI();
  }

  combatAction(action){
    if(this.mode!=='combat'||this.battleBusy||!this.battle||this.battle.hp<=0) return;
    audio.unlock(); this.battleBusy=true; this.battle.turn++;
    let log='';
    if(action==='attack'){
      const dmg=Math.max(1,Math.round(this.attack+Math.random()*3-1-this.battle.def*.45)); this.battle.hp-=dmg; log=`You strike for ${dmg} damage.`; audio.hit(); this.punchEnemy();
    } else if(action==='skill'){
      if(this.mp<4){this.battleBusy=false;return;} this.mp-=4;
      const dmg=Math.max(3,Math.round(this.attack*1.35+4+Math.random()*3-this.battle.def*.25)); this.battle.hp-=dmg; log=`Star Slash flashes for ${dmg} damage!`; audio.tone(760,.12,'sawtooth',.025); audio.tone(980,.11,'triangle',.02,.05); this.punchEnemy(true);
    } else if(action==='guard'){
      this.guarding=true; log='You brace behind your gear.'; audio.tone(220,.08,'triangle',.018);
    } else if(action==='herb'){
      if(this.herbs<=0||this.hp>=this.maxHP){this.battleBusy=false;return;} this.herbs--; const heal=Math.min(20,this.maxHP-this.hp); this.hp+=heal; log=`The herb restores ${heal} HP.`; audio.heal();
    }
    this.setCombatLog(log); this.updateCombatUI();
    if(this.battle.hp<=0){ setTimeout(()=>this.victory(),520); }
    else setTimeout(()=>this.enemyTurn(),620);
  }

  punchEnemy(strong=false){
    if(!this.battle?.model) return; const m=this.battle.model; const base=m.scale.clone(); m.scale.multiplyScalar(strong?1.18:1.1); setTimeout(()=>m.scale.copy(base),140);
  }

  enemyTurn(){
    if(this.mode!=='combat'||!this.battle) return;
    const heavy=this.battle.boss&&this.battle.turn%3===0;
    let dmg=Math.max(1,Math.round(this.battle.atk+(heavy?3:0)+Math.random()*2-this.defense*.55));
    if(this.guarding) dmg=Math.max(1,Math.ceil(dmg*.5)); this.guarding=false;
    this.hp-=dmg; this.hp=Math.max(0,this.hp); this.flashDamage(); audio.hit();
    this.setCombatLog(heavy?`The guardian rings a Bellquake for ${dmg} damage!`:`${this.battle.name} hits for ${dmg} damage.`);
    if(this.hp<=0){ setTimeout(()=>this.faint(),700); return; }
    this.battleBusy=false; this.updateCombatUI();
  }

  flashDamage(){ flashEl.classList.add('on'); setTimeout(()=>flashEl.classList.remove('on'),90); }

  victory(){
    if(!this.battle) return;
    const b=this.battle; b.hp=0; audio.win();
    const reward=`Victory! +${b.xp} XP · +${b.gold}G`;
    this.xp+=b.xp; this.gold+=b.gold;
    if(b.boss){ this.questStage=3; this.bossGroup.visible=false; this.bossMarker.visible=false; }
    else { b.active=false; b.model.visible=false; this.kills++; if(this.questStage===1&&this.kills>=1){this.questStage=2;this.updateQuestMarker();this.toast('Road proven · Moonbell Shrine unlocked');} }
    const leveled=this.checkLevel();
    this.setCombatLog(reward+(leveled?` · Level ${this.level}!`:'')); enemyHpEl.textContent='Defeated'; turnTagEl.textContent='Victory';
    combatActionsEl.innerHTML=`<button data-action="continue" style="grid-column:1/-1">Continue<small>Return to the road</small></button>`;
    combatActionsEl.querySelector('button').addEventListener('click',()=>this.endCombat()); this.battleBusy=true; this.updateUI(true);
  }

  checkLevel(){
    const thresholds=[0,20,52,92,140]; let target=1; for(let i=1;i<thresholds.length;i++) if(this.xp>=thresholds[i]) target=i+1;
    if(target>this.level){ this.level=target; this.hp=this.maxHP; this.mp=this.maxMP; this.toast(`Level ${this.level}! HP, MP, ATK and DEF increased`); audio.quest(); return true; }
    return false;
  }

  endCombat(){
    combatEl.classList.add('hidden');
    combatActionsEl.innerHTML=`<button data-action="attack">Attack<small>Reliable strike</small></button><button data-action="skill">Star Slash<small>4 MP · heavy hit</small></button><button data-action="guard">Guard<small>½ damage this turn</small></button><button data-action="herb">Herb<small>Restore 20 HP</small></button>`;
    this.battle=null; this.battleBusy=false; this.mode='world'; mobileControls.classList.remove('hidden'); this.hero.position.z+=.7;
    if(this.questStage===3) this.toast('Return to Elder Nessa');
  }

  faint(){
    this.setCombatLog('You faint. Bellroot villagers haul you home before the monsters can brag about it.');
    setTimeout(()=>{
      if(this.battle&&!this.battle.boss){this.battle.model.visible=true;this.battle.active=true;this.battle.hp=this.battle.maxHp;}
      if(this.battle?.boss){this.bossGroup.visible=true;this.bossMarker.visible=true;}
      this.gold=Math.max(0,this.gold-Math.ceil(this.gold*.2)); this.hp=this.maxHP; this.mp=this.maxMP; this.hero.position.set(0,0,24); combatEl.classList.add('hidden');
      combatActionsEl.innerHTML=`<button data-action="attack">Attack<small>Reliable strike</small></button><button data-action="skill">Star Slash<small>4 MP · heavy hit</small></button><button data-action="guard">Guard<small>½ damage this turn</small></button><button data-action="herb">Herb<small>Restore 20 HP</small></button>`;
      this.battle=null;this.battleBusy=false;this.mode='world';mobileControls.classList.remove('hidden');this.toast('Recovered in Bellroot Vale · lost 20% gold');this.updateUI(true);
    },1100);
  }

  complete(){
    this.mode='complete'; mobileControls.classList.add('hidden'); hud.classList.add('hidden'); backendBadge.classList.add('hidden');
    $('completeText').textContent=`Final level ${this.level} · ${this.weapon} · ${this.armor} · ${this.gold}G remaining. You cleared the full exploration, combat, gear, progression, boss, and return loop.`;
    completeEl.classList.remove('hidden'); audio.win();
  }

  toast(text){
    const t=document.createElement('div');t.className='toast';t.textContent=text;$('toasts').appendChild(t);setTimeout(()=>t.remove(),2500);
  }

  updateEnemies(dt){
    for(const e of this.enemies){ if(!e.active) continue; e.phase+=dt*(e.type==='mossling'?1.6:1.2); const r=e.type==='mossling'?.75:.52;
      e.model.position.x=e.homeX+Math.sin(e.phase*.7)*r; e.model.position.z=e.homeZ+Math.cos(e.phase*.6)*r; e.model.position.y=Math.abs(Math.sin(e.phase*2.2))*.08; e.model.rotation.y=Math.sin(e.phase*.5)*.5;
    }
    if(this.bossGroup.visible) this.bossGroup.rotation.y=Math.sin(this.elapsed*.45)*.14;
    for(const m of this.motes){ m.mesh.position.set(Math.cos(this.elapsed*.65+m.phase)*m.r,m.h+.3*Math.sin(this.elapsed*1.4+m.phase*2),-34+Math.sin(this.elapsed*.65+m.phase)*m.r); m.mesh.rotation.y+=dt*1.8; m.mesh.rotation.x+=dt*.7; }
    if(this.elder) this.elder.position.y=Math.sin(this.elapsed*2)*.025;
  }

  updateCamera(dt){
    const target=this.battle?.model&&this.mode==='combat'
      ? new THREE.Vector3().addVectors(this.hero.position,this.battle.model.position).multiplyScalar(.5).setY(1.2)
      : new THREE.Vector3(this.hero.position.x,this.hero.position.y+1.05,this.hero.position.z);
    this.cameraTarget.lerp(target,1-Math.exp(-dt*7));
    const battleZoom=this.mode==='combat'?Math.min(this.zoom,9.5):this.zoom;
    const offset=new THREE.Vector3(Math.sin(this.cameraYaw)*battleZoom*.72,battleZoom*.68,Math.cos(this.cameraYaw)*battleZoom*.72);
    const desired=this.cameraTarget.clone().add(offset);
    camera.position.lerp(desired,1-Math.exp(-dt*6)); camera.lookAt(this.cameraTarget);
  }

  updateUI(force=false){
    const hpPct=clamp(this.hp/this.maxHP*100,0,100),mpPct=clamp(this.mp/this.maxMP*100,0,100);
    $('level').textContent=`Lv ${this.level}`; $('hpbar').style.width=`${hpPct}%`; $('mpbar').style.width=`${mpPct}%`; $('hptext').textContent=`${this.hp}/${this.maxHP}`; $('mptext').textContent=`${this.mp}/${this.maxMP}`;
    $('xptext').textContent=`XP ${this.xp}`; $('goldtext').textContent=`${this.gold}G`; $('herbtext').textContent=`Herb ×${this.herbs}`; $('questtext').textContent=this.questText();
  }

  tick(dt){
    this.elapsed+=dt; this.updateMovement(dt); this.updateEnemies(dt); this.updateNearby(); this.updateCamera(dt); this.updateUI();
    // Quest marker bob/rotate.
    for(const i of this.interactables){ if(i.marker&&i.marker.visible){ i.marker.rotation.y+=dt*1.8; i.marker.position.y=2.75+Math.sin(this.elapsed*3)*.18; }}
    if(this.bossMarker.visible){this.bossMarker.rotation.y+=dt*1.4;this.bossMarker.position.y=4.4+Math.sin(this.elapsed*2.7)*.2;}
  }
}

const game=new Game();
let last=performance.now();
renderer.setAnimationLoop((now)=>{
  const dt=Math.min(.05,(now-last)/1000||.016); last=now; game.tick(dt); renderer.render(scene,camera);
});

console.info(`Starfall Pilgrims ready · ${backendName} · Three.js r186`);

  <script type="module">

    const canvas = document.getElementById('game-canvas');
    const legacySource = document.getElementById('legacy-source').textContent;
    const primarySource = document.getElementById('primary-source').textContent;
    let legacyStarted = false;

    function hasWebGL2() {
      try {
        const c = document.createElement('canvas');
        return !!c.getContext('webgl2', { failIfMajorPerformanceCaveat: false });
      } catch { return false; }
    }
    function hasWebGL1() {
      try {
        const c = document.createElement('canvas');
        return !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
      } catch { return false; }
    }
    function runLegacy(reason) {
      if (legacyStarted) return;
      legacyStarted = true;
      if (reason) console.warn('Starting WebGL1 safe mode.', reason);
      try { (0, eval)(legacySource); }
      catch (error) {
        console.error('Legacy renderer failed.', error);
        canvas?.remove();
        document.body.innerHTML = `<main class="fatal-card"><h1>Starfall Pilgrims</h1><p>The game could not start a compatible graphics renderer.</p><p>Use a current browser with hardware acceleration enabled.</p></main>`;
      }
    }

    const forceLegacy = query.get('legacy') === '1';
    const forceWebGL2 = query.get('webgl2') === '1';
    const webgpu = !forceWebGL2 && !!navigator.gpu;
    const webgl2 = hasWebGL2();

    if (!forceLegacy && (webgpu || webgl2)) {
      const moduleUrl = URL.createObjectURL(new Blob([primarySource], { type: 'text/javascript' }));
      try {
        await import(moduleUrl);
      } catch (error) {
        console.error('Primary renderer failed.', error);
        if (hasWebGL1()) runLegacy(error);
        else {
          canvas?.remove();
          document.body.innerHTML = `<main class="fatal-card"><h1>Starfall Pilgrims</h1><p>This browser does not expose a usable WebGPU, WebGL2, or WebGL1 renderer.</p><p>Use a current browser with hardware acceleration enabled.</p></main>`;
        }
      } finally {
        URL.revokeObjectURL(moduleUrl);
      }
    } else if (hasWebGL1()) {
      runLegacy();
    } else {
      canvas?.remove();
      document.body.innerHTML = `<main class="fatal-card"><h1>Starfall Pilgrims</h1><p>This browser does not expose WebGPU, WebGL2, or WebGL1.</p><p>Use a current browser with hardware acceleration enabled.</p></main>`;
    }
