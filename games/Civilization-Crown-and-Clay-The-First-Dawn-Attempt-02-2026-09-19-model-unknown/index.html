<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#315f51">
<meta name="description" content="Crown & Clay: The First Dawn. An original, offline, turn-based empire game in a single file.">
<title>Crown &amp; Clay — The First Dawn</title>
<script type="importmap">
{
  "imports": {
    "three": "/lib/three/three.webgpu.js",
    "three/webgpu": "/lib/three/three.webgpu.js",
    "three/tsl": "/lib/three/three.tsl.js",
    "three/addons/": "/lib/three/addons/",
    "kit/": "/lib/kit/"
  }
}
</script>
<link rel="modulepreload" href="/lib/three/three.core.js" />
<link rel="modulepreload" href="/lib/three/three.webgpu.js" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<canvas id="world" aria-label="World map. Drag to pan. Select a unit, then tap a tile to move."></canvas>
<div id="sea-label" aria-hidden="true">THE JADE SEA<small>HERE BE SMALL BEGINNINGS</small></div>
<div id="labels"></div>
<header id="topbar" class="paper">
<button class="brand" data-action="journey" aria-label="Crown and Clay. View victory goals."><div class="brand-mark" data-icon="sun"></div><div><h1>CROWN &amp; CLAY</h1><small>THE FIRST DAWN</small></div></button>
<div class="resources" aria-label="Empire resources"><div class="resource" title="Gold and net gold per turn"><span data-icon="coin"></span><div><strong id="gold-value">40</strong><small id="gold-rate">+0</small><span class="resource-name">Treasury</span></div></div><div class="resource science" title="Science per turn"><span data-icon="flask"></span><div><strong id="science-value">0</strong><small>/ turn</small><span class="resource-name">Knowledge</span></div></div><div class="resource culture" title="Culture and culture per turn"><span data-icon="culture"></span><div><strong id="culture-value">0</strong><small id="culture-rate">+0</small><span class="resource-name">Culture</span></div></div></div>
<div class="year-box"><strong id="year">4000 BC</strong><span id="turn-count">TURN 01 / 60</span></div>
<div class="top-tools"><button id="help-top" class="icon-btn" data-action="help" aria-label="How to play" title="How to play"><span data-icon="help"></span></button><button class="icon-btn" data-action="menu" aria-label="Game menu" title="Game menu"><span data-icon="menu"></span></button></div>
</header>
<button id="research-card" class="paper" data-action="research" aria-label="Choose research"></button>
<button id="chapter-card" class="paper" data-action="journey"></button>
<button id="council-button" class="paper" data-action="council" aria-label="Council and diplomacy"><span data-icon="council"></span><span class="council-text">Council</span><span class="realm-dots" id="realm-dots"><i></i><i></i></span></button>
<nav id="map-tools" aria-label="Map controls"><button class="map-tool" data-action="zoom-in" aria-label="Zoom in" title="Zoom in"><span data-icon="plus"></span></button><button class="map-tool" data-action="zoom-out" aria-label="Zoom out" title="Zoom out"><span data-icon="minus"></span></button><div class="tool-space"></div><button id="rotate-left" class="map-tool" data-action="rotate-left" aria-label="Rotate left" title="Rotate left (Q)"><span data-icon="rotate"></span></button><button id="rotate-right" class="map-tool" data-action="rotate-right" aria-label="Rotate right" title="Rotate right (E)"><span data-icon="rotate" style="transform:scaleX(-1)"></span></button><button class="map-tool home-tool" data-action="home" aria-label="Focus your capital" title="Focus capital (H)"><span data-icon="home"></span></button><button id="grid-tool" class="map-tool" data-action="grid" aria-label="Toggle tile grid" title="Tile grid (G)"><span data-icon="grid"></span></button></nav>
<section id="context" class="paper" aria-label="Selected piece"></section>
<div id="minimap-wrap" class="paper"><div class="minimap-title"><span class="kicker">Known world</span><span>N ↑</span></div><canvas id="minimap" width="342" height="216" aria-label="Minimap. Tap to move the camera."></canvas><div class="minimap-bottom">A WORLD WAITING TO BE WRITTEN</div></div>
<div id="turn-controls"><button id="next-unit" class="next-unit" data-action="next-unit" aria-label="Select next unit"><span data-icon="units"></span><div><strong>Next unit</strong><small id="unit-count">3 ready</small></div></button><button id="end-turn" data-action="end-turn" aria-label="End turn"><div><strong>End turn</strong><small id="turn-hint">Your story begins</small></div><span class="turn-orbit" data-icon="arrow"></span></button></div>
<div id="map-hint">Drag to explore <span style="opacity:.5;margin:0 7px">·</span> Scroll to zoom</div><div id="toasts" role="status" aria-live="polite"></div><div id="turn-flash" aria-hidden="true"></div>
<div id="modal-backdrop" class="hidden"><section id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section></div>
<input id="save-file" type="file" accept=".json,application/json" class="hidden">
<script type="module" src="./main.js"></script>
</body>
</html>
