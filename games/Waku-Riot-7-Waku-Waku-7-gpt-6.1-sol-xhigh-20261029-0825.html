    seed: 0,
    limitMs: 0,
    round: 0,

    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */

  // a generator seeded by the hub, so every copy builds the same start.

    hub.seeded = true;
  }

  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.

      };

   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */

    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */

    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }

      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {

          throw e;

    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;

      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';

      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {

      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }

    if (m.type === 'start') {

      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {

      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);

      emit(m.type, [detail]);
    }

    var out = {};

  }

  hub.connect = function (opts) {

    var done;
    var promise = new Promise(function (resolve) {

    });

    if (!hub.active) {

      return promise;
    }

        done(null);
        return;

    return promise;
  };

  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);

    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;

    var fields = outcomeOf(outcome);

  function sendProgress() {

    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

    nextProgress = { score: Number(p.score) };

    try {

		n(v.y),

		n(a.meter),

function receiveNet(data, from) {

function makeNet(options) {

function networkTick(dt) {

	net.sendAt += dt;
	if (net.sendAt < 1 / 12) return;
	net.sendAt %= 1 / 12;
	const at = hubInfo ? AIHub.time() : simTime * 1000;
	if (net.isHost) {
		net.send(
			{
				t: "state",
				at,
				time: Math.ceil(fightTime * 100) / 100,
				phase: roundState,
				round,
				wins: roundWins,
				a: actors.map(actorState),
				s: shots.map((s) => [
					s.id,
					s.owner,
					s.type,
					Math.round(s.x * 100) / 100,
					Math.round(s.y * 100) / 100,
					s.vx,
					s.vy,
					Math.round(s.life * 100) / 100,
				]),
				ack: net.seen,
			},
			{ reliable: false },
		);
	} else {
		const a = actors.find((p) => p.id === net.me);
		if (!a) return;
		const p = a.body.translation(),
			v = a.body.linvel(),
			i = a.input;
		net.send(
			{
				t: "player",
				at,
				p: [p.x, p.y, v.x, v.y],
				i: { x: i.x || 0, y: i.y || 0, guard: !!i.guard },
				a: net.pending.slice(-8),
			},
			{ to: net.host, reliable: false },
		);
	}

function networkAction(input) {

		"lp",
		"lk",
		"hp",
		"hk",
		"special",
		"super",
		"riot",
		"throw",
		"burst",

function finishNetwork() {
	if (!net?.isHost || roundState === "finished") return;
	roundState = "finished";

		ranked = players
			.map((p) => ({
				id: p.id,
				a: actors.find((a) => a.id === p.id) || { kills: 0, damage: 0 },
			}))
			.sort((a, b) => b.a.kills - a.a.kills || b.a.damage - a.a.damage);

	for (let i = 0; i < ranked.length; i++) {
		const p = ranked[i];
		if (
			i &&
			p.a.kills === ranked[i - 1].a.kills &&
			Math.round(p.a.damage) === Math.round(ranked[i - 1].a.damage)
		)
			standings.at(-1).push(p.id);
		else standings.push([p.id]);
	}
	sendEvent({ t: "finished", standings });
	if (hubInfo)
		AIHub.finish({
			standings,
			scores: Object.fromEntries(
				ranked.map((p) => [p.id, p.a.kills * 1000 + Math.round(p.a.damage)]),
			),
			stats: Object.fromEntries(
				ranked.map((p) => [

				]),
			),
		});

async function setupHub() {
	if (!AIHub.active) return false;
	hubInfo = await AIHub.connect({ mode: "versus", seats: [1, 4] });
	if (!hubInfo) return false;
	const rng = AIHub.rng("roster");
	const players = hubInfo.players.map((p) => ({
		...p,
		type: Math.floor(rng() * 3),
	}));
	net = makeNet({
		me: hubInfo.me,
		host: hubInfo.host,
		isHost: hubInfo.isHost,
		players,
		send: (d, o) => AIHub.send(d, o),
	});
	AIHub.on("message", receiveNet);
	AIHub.on("start", () => Audio.start());
	AIHub.on("leave", ({ id }) => {
		if (id === net.host && !net.isHost) {
			ended = true;
			Audio.volumes();
			announce("THE HOST LEFT.", "The hub will take it from here.", 9999);
			return;
		}
		let a = actors.find((a) => a.id === id);
		if (a) {
			scene.remove(a.root);
			world.removeRigidBody(a.body);
			actors = actors.filter((f) => f.id !== id);
		}
		net.players = net.players.filter((p) => p.id !== id);
		if (net.isHost && net.players.length <= 1) finishNetwork();
	});
	AIHub.on("time-up", () => {
		if (net.isHost) finishNetwork();
	});
	AIHub.on("end", () => {
		ended = true;
		settingsOpen = false;
		$("screen").innerHTML = "";
		Audio.volumes();
		roundState = "finished";
		announce("FESTIVAL ROUND COMPLETE", "Thanks for the trouble.", 9999);
	});
	startFight("hub");
	roundState = "ready";
	if (hubInfo.splash) AIHub.ready();
	else {
		announce("FESTIVAL FIGHT CLUB", "Press any key when you are ready.", 9999);
		window._hubNeedsReady = true;
	}
	return true;
}

async function hostRoom() {

	);

		await loadPeer();
		peer = new window.Peer("waku-riot7-" + onlineCode, { debug: 0 });

			showRoom("Room is open. Waiting for your friend to join…", true),
		);
		peer.on("error", (e) =>
			onlineError("Room service: " + e.type + ". Return and try again."),
		);

			if (connection) {
				conn.close();
				return;

				if (d.t === "join") {
					net = makeNet({
						me: 0,
						host: 0,
						isHost: true,
						players: [
							{ id: 0, type: selectedChar },
							{ id: 1, type: d.type % 3 },
						],
						send: (m) => conn.open && conn.send(m),

						round,
						wins: roundWins,

			});

async function joinRoom() {

	showRoom("Calling room " + joinCode + "…");

		await loadPeer();

			onlineError(
				"Could not join: " + e.type + ". Check the code and try again.",
			),
		);

			connection = peer.connect("waku-riot7-" + joinCode, { reliable: true });

				if (d.t === "welcome") {
					connection.send({ t: "join", type: selectedChar });

						host: 0,
						isHost: false,
						players: [

					});

		if (!(await setupHub())) showTitle();
		$("load").style.display = "none";
		window.addEventListener("resize", () => {
			camera.aspect = innerWidth / innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(innerWidth, innerHeight);
		});
		AIHub.probe(() => ({
			scene:
				ended || mode === "result"
					? "over"
					: mode === "title"
						? "title"
						: settingsOpen
							? "play"
							: mode === "network" && roundState === "ready"
								? "ready"
								: ["play", "training", "network", "attract"].includes(mode)
									? "play"
									: "menu",
			menu: settingsOpen,
			world: simTime,
			input: lastProbeInput,
		}));
		window.WakuRiot = {
			get state() {
				return {
					mode,
					gameMode,
					roundState,
					bout,
					score,
					roundWins,
					simTime,
					network: net
						? { me: net.me, isHost: net.isHost, players: net.players }
						: null,
					actors: actors.map((a) => ({
						id: a.id,
						type: a.type,
						x: a.x,
						y: a.y,
						hp: a.hp,
						meter: a.meter,
						lastMove: a.lastMove,
						combo: a.combo,
						stun: a.stun,
					})),
				};
			},
			get renderer() {
				return renderer;
			},
			get physics() {
				return world;
			},
			get settings() {
				return settings;
			},
		};
		setInterval(gameTick, 1000 / 60);
		renderer.setAnimationLoop(animate);
	} catch (e) {
		console.error(e);
		mode = "unsupported";
		AIHub.fail(e.message);
		$("loadText").textContent = e.message;
		$("load").querySelector(".loader").style.display = "none";
		$("load").querySelector("h1").textContent = "THE FESTIVAL NEEDS WEBGPU";
		$("settingsCog").onclick = () => {
			settingsReturn = "unsupported";
			settingsOpen = true;
			settingsMenu();
		};
		$("load").style.pointerEvents = "none";
		$("load").style.zIndex = "10";
		$("screen").style.zIndex = "11";
		function unsupportedFrame() {
			pollPads();
			uiInput(1 / 60);
			pressed.clear();
			requestAnimationFrame(unsupportedFrame);
		}
		requestAnimationFrame(unsupportedFrame);
	}
}
init();
</script>
</body></html>
