<!DOCTYPE html>
<!--
Master of Moss: a spiritual successor to Master of Magic

SOURCE INFORMATION
- Date: 2026-10-29 03:27
- Source: Master of Magic (SimTex / MicroProse, 1994): the inspiration. Master of Moss is an original work; no assets, names or code are taken from it.
- Tech: Three.js r180 (WebGPURenderer, TSL node materials; WebGPU only, no fallback) · Rapier 3D 0.19.3 (@dimforge/rapier3d-compat, WASM) · Gamepad API · Web Audio API · AI Hub session client 1.3.0 · plain JavaScript ES modules from the jsDelivr CDN, bundled into one HTML file.
- Art Direction: Stylised cel shading: MeshToonMaterial with a 4-step hard gradient ramp, inverted-hull ink outlines built in TSL (vertices pushed along their normals, back faces drawn), flat-coloured low-poly primitives, additive glow materials for magic, painted SVG wizard portraits.
- Animation: Procedural code animation: tweened moves and lunges, idle bobbing, wing flaps and spins in the scene graph, TSL vertex waves on the water and pulsing glow shaders, particle bursts, camera shake, and Rapier rigid bodies for toppling casualties, rubble and debris.
- Audio: All code-written with the Web Audio API: a generative modal music sequencer (title, two overworld themes, city, battle, victory, defeat; harp, flute, pad, bass, bell and drum voices with convolution reverb), synthesized sound effects, and Animalese-style gibberish voices for the wizards (formant-filtered blips, one pitch per wizard).
- Online: AI Hub Session Protocol v1, side-by-side ("parallel") mode: the hub seeds the world, every player rules their own copy of the same world, score is reported with AIHub.progress and AIHub.result, plus the probe and the settings menu. Outside a session: local hot-seat for 2–4 human wizards. No other network features.
- Testing: Headless Chromium (Playwright) with WebGPU on SwiftShader, rendering offscreen and reading pixels back for screenshots: boot and title, scripted new game, camera-relative cursor, save/load round trip, four end-turns, city/spellbook/command screens, attract mode with tactical battles, a keyboard-driven battle with the Esc menu and Auto-resolve, a battle-board screenshot, a 45-turn soak with auto battles, a 69-action sweep opening every screen and casting every overland spell, and the AI Hub harness (parallel mode; 1 player, 2 players, 2 players with one leaving: all pass). No real GPU or physical controller was available.
- Environment: Claude Code CLI (headless); Linux; browser unknown
- Model: Anthropic, claude-opus-5-5, reasoning effort medium
- Usage: Session time about 1 h 35 min (03:27 to 05:02 PDT). API cost and token counts: unknown (no usage meter is visible from inside the session).

TESTING FEEDBACK
- How many issues did testing catch?
  Nine in the game: a computer wizard’s city could crash the turn (around turn 19) by picking from a list it had just emptied; quick key taps (shorter than one frame) were ignored; attract mode counted idle time from page load; breath weapons fired at range; HUD panels overlapped the resource bar; fog caps sat lower than mountain props; city population caps were far too generous; choosing Auto-resolve or Retreat stalled the battle; a mutual kill was scored as an attacker win. A tenth problem was the test environment itself: headless Chromium loses the WebGPU device when presenting to a canvas.
- How many would be considered critical issues / game breaking?
  Three: the turn-19 crash in the computer wizards’ city building, ignored key taps (menus could feel dead on fast presses), and the Auto-resolve/Retreat soft-lock in battle.
- What was the most helpful test you ran?
  Rendering into an offscreen render target and reading the pixels back, which turned blind headless runs into real screenshots; and the AI Hub harness, which passed at 1 and 2 players and with a player leaving.
- What was the least helpful test you ran?
  Cycling Chromium GPU flag combinations to make canvas presentation work headless: every one produced a blank page.

ENGINE FEEDBACK
- What did you like most about the engine?
  Three.js r180 WebGPURenderer plus TSL: classic MeshToonMaterial works unchanged, and TSL made the outline hull, water waves and glow pulses one-liners without hand-written WGSL.
- Did you get stuck or guess wrong?
  Yes, in testing rather than in the engine API: headless Chromium has no navigator.gpu on about:blank (it needs a secure origin), and it loses the WebGPU device the moment a canvas frame is presented, even with raw WebGPU. I worked around it with a test-only ?offscreen=1 mode that renders into a RenderTarget and reads the pixels back.
- What was the most important thing you had to build yourself?
  The game layer: hex map, turn engine, economy, spell system, tactical combat rules, AI wizards, and a spatial focus navigator so every DOM screen works with a controller.
- What was the hardest part about using the engine?
  No WebGL fallback by design, so it can only be verified on SwiftShader in headless runs; shadow and outline quality there is not what a real GPU shows.
- If you had to remove or overhaul one thing from engine, what would that be?
  The split between classic materials and NodeMaterials: properties such as positionNode only work on the *NodeMaterial classes, which is easy to miss.
- If you could change one thing about the engine, what would it be?
  A built-in, documented toon outline for WebGPU that works per object, not only as a full-screen pass.

PROMPT FEEDBACK
- What did you like most about this prompt?
  Clear deliverable shape (one file, named exactly), a concrete multiplayer contract with a test harness, and the controller-first UX brief.
- What was confusing?
  The AI Hub rules ask for a WebGL 2 fallback while the prompt forbids one; resolved with the hub:webgpu=required meta. "Feature-complete" for a 4X game is open-ended.
- What was the hardest thing to do?
  Fitting the breadth of a 4X game (two planes, cities, research, spells, heroes, diplomacy, tactical combat, AI) into one session and one file while keeping it controller-navigable.
- If there was one test you could have run, what would that test be?
  A long soak on real hardware with a DualSense: 100 AI-played turns in attract mode while sampling frame time and focus states.
-->

<script>/*! aihub-session 1.3.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.3.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

    AU.vnodes.push(o); o.onended = () => { const k = AU.vnodes.indexOf(o); if (k >= 0) AU.vnodes.splice(k, 1); };
    t += dur * 0.92;
  }
  AU.voiceUntil = t;
  return id;
}
function Voice_stop() { if (!AU.ctx) return; AU.voiceUntil = AU.ctx.currentTime; for (const o of AU.vnodes.splice(0)) { try { o.stop(); } catch (e) { /* already stopped */ } } }

function physDebris(scene, pos, n, col, power = 4, size = 0.12, life = 4) {
  for (let i = 0; i < n; i++) {
    const s = size * (0.6 + Math.random() * 0.8);

function physTopple(scene, obj, push) {

  R.phys.createCollider(RAPIER.ColliderDesc.cuboid(0.12 * sc.x, h, 0.12 * sc.z).setFriction(1).setRestitution(0.1), body);

function stepPhysics(dt) {
  if (!R.phys) return;
  R.phys.timestep = Math.min(dt, 1 / 30);
  R.phys.step();
  for (let i = R.debris.length - 1; i >= 0; i--) {
    const d = R.debris[i];

}

  const col = REALM[s.realm].hex;
  const to = target ? cpos(target.x, target.y) : new THREE.Vector3((side === 'att' ? -3 : 3), 0, 0);
  if (s.ck === 'bolt' || s.ck === 'drain' || casterCU) {
    const from = casterCU ? cpos(casterCU.x, casterCU.y).add(new THREE.Vector3(0, 0.8, 0)) : to.clone().add(new THREE.Vector3(0, 8, 0));
    const m = new THREE.Mesh(geo('bolt', () => new THREE.SphereGeometry(0.16, 10, 8)), glowMat(col, 0.95)); m.scale.setScalar(1.8); R.cscene.add(m);
    await tween(0.4, (k) => { m.position.lerpVectors(from, to.clone().setY(0.5), k); spawnBurst(R.cscene, m.position.clone().setY(m.position.y - 0.3), col, 1, 0.5, 'burst'); });
    R.cscene.remove(m);
    spawnBurst(R.cscene, to, col, 40, 3, 'burst');
    if (s.fx === 'lightning') R.cam.shake = 0.5;
    physDebris(R.cscene, to.clone().setY(0.2), 6, s.fx === 'ice' ? 0xc0e8ff : 0x5a4a3a, 3, 0.08, 2);
  } else {
    spawnBurst(R.cscene, to, col, 40, 1.8, 'swirl');

  }
}
async function animHit(cu, dmg, src, magic) {
  const beforeAlive = cu.objs.filter((o) => o.visible && !o.userData.fallen).length;
  const alive = cuFigs(cu);
  dmgNumber(cu, dmg);
  if (dmg > 0) Sfx('hit'); else Sfx('block');
  const base = cu.group.position.clone();
  await tween(0.2, (k) => { cu.group.position.copy(base).add(new THREE.Vector3((Math.random() - 0.5) * 0.08 * (1 - k), 0, 0)); });
  cu.group.position.copy(base);
  // fallen figures topple with physics
  const push = src ? cpos(cu.x, cu.y).sub(cpos(src.x, src.y)).normalize().multiplyScalar(2) : new THREE.Vector3(0, 0, 0);
  for (let i = alive; i < beforeAlive; i++) {
    const o = cu.objs[i]; if (!o || o.userData.fallen) continue;
    o.userData.fallen = true;
    physTopple(R.cscene, o, push.clone().add(new THREE.Vector3((Math.random() - 0.5), 0, (Math.random() - 0.5))));
    if (magic) spawnBurst(R.cscene, base.clone(), 0xffa040, 8, 1.5, 'burst');
  }
  if (beforeAlive > alive) Sfx('die');
  if (cu.dead && cu.group) { const g = cu.group; setTimeout(() => { if (g.parent) g.parent.remove(g); }, 3500); const ring = g.children.find((c) => c.geometry === GEO.cuRing); if (ring) ring.visible = false; }
}
function dmgNumber(cu, dmg) {
  const p = projectToScreen(cpos(cu.x, cu.y).add(new THREE.Vector3(0, 1.4, 0)), R.ccam);
  const el = document.createElement('div');
  el.className = 'lbl'; el.style.left = p.x + 'px'; el.style.top = p.y + 'px'; el.style.fontSize = '1.6em';
  el.style.color = dmg > 0 ? '#ff7a5a' : '#cfe8ff'; el.textContent = dmg > 0 ? '-' + dmg : 'Blocked';
  el.style.transition = 'transform 1s ease-out, opacity 1s'; $('#labels').appendChild(el);
  requestAnimationFrame(() => { el.style.transform = 'translate(-50%,-160%)'; el.style.opacity = 0; });
  setTimeout(() => el.remove(), 1100);
}
function updateCombatView(dt) {
  if (!CB || !R.cscene) return;
  const c = CB.cam;
  const tgt = CB.active && !CB.active.dead ? cpos(CB.active.x, CB.active.y) : new THREE.Vector3();
  c.tx = lerp(c.tx, tgt.x * 0.4, dt * 2); c.tz = lerp(c.tz, tgt.z * 0.4, dt * 2);
  const sh = R.cam.shake > 0 && SETTINGS.screenShake ? R.cam.shake : 0; R.cam.shake = Math.max(0, R.cam.shake - dt * 1.5);
  R.ccam.position.set(c.tx + Math.sin(c.yaw) * Math.cos(c.pitch) * c.dist + (Math.random() - 0.5) * sh, Math.sin(c.pitch) * c.dist, c.tz + Math.cos(c.yaw) * Math.cos(c.pitch) * c.dist);
  R.ccam.lookAt(c.tx, 0, c.tz);
  CB.cursorMesh.position.copy(cpos(CB.cursor.x, CB.cursor.y)).setY(0.06 + Math.sin(R.t * 5) * 0.02);
  CB.cursorMesh.visible = CB.humanSide === CB.side && !CB.busy;
  if (CB.active && !CB.active.dead) { CB.activeMesh.visible = true; CB.activeMesh.position.copy(CB.active.group ? CB.active.group.position : cpos(CB.active.x, CB.active.y)).setY(0.04); } else CB.activeMesh.visible = false;
  // idle breathing of figures
  for (const cu of CB.units) for (const o of cu.objs) if (!o.userData.fallen && o.parent === cu.group) { o.position.y = Math.max(0, Math.sin(R.t * 2 + o.userData.phase) * 0.015); }
  animateScene(R.cscene, R.t);
}
function drawHighlights() {
  if (!CB.hl) return;
  while (CB.hl.children.length) CB.hl.remove(CB.hl.children[0]);
  const cu = CB.active;
  if (!cu || cu.dead || CB.side !== CB.humanSide || CB.busy) return;
  const sq = geo('hlsq', () => { const g = new THREE.PlaneGeometry(CS * 0.9, CS * 0.9); g.rotateX(-Math.PI / 2); return g; });
  const blue = new THREE.MeshBasicMaterial({ color: 0x5ab0ff, transparent: true, opacity: 0.32, depthWrite: false });
  const red = new THREE.MeshBasicMaterial({ color: 0xff4a3a, transparent: true, opacity: 0.45, depthWrite: false });
  if (!cu.acted) {
    for (const k of reachable(cu).keys()) { const [x, y] = k.split(',').map(Number); if (x === cu.x && y === cu.y) continue; const m = new THREE.Mesh(sq, blue); m.position.copy(cpos(x, y)).setY(0.02); CB.hl.add(m); }
    for (const t of attackableTargets(cu)) { const m = new THREE.Mesh(sq, red); m.position.copy(cpos(t.x, t.y)).setY(0.025); CB.hl.add(m); }
  }
}
function attackableTargets(cu) {
  const foes = CB.units.filter((c) => !c.dead && c.side !== cu.side);
  if (canShoot(cu) || heroCanBolt(cu)) return foes;
  const reach = reachable(cu);
  return foes.filter((f) => cheb(f, cu) === 1 || [...reach.keys()].some((k) => { const [x, y] = k.split(',').map(Number); return Math.max(Math.abs(x - f.x), Math.abs(y - f.y)) === 1; }));
}
function nextHumanUnit(dir = 1) {
  const list = CB.units.filter((c) => c.side === CB.humanSide && !c.dead && !c.acted);
  if (!list.length) return null;
  const i = list.indexOf(CB.active);
  const n = list[(i + dir + list.length) % list.length] || list[0];
  CB.active = n; CB.cursor = { x: n.x, y: n.y };
  return n;
}

function castFromBook(key) {

  };

function maintained(w) {
  const out = [];

}

  ['Your Goal', 'You are a wizard in a world grown over with moss and magic. Two worlds lie atop one another: sunlit <b>Mossgard</b> and twilit <b>Underbough</b>, joined by Towers of Wizardry. Win by banishing every rival wizard (capture their Fortress) or by researching and casting the <b>Spell of Mastery</b>.'],
  ['The Map', `${glyph('dpad')} moves the cursor (the camera follows). ${glyph('rstick')} turns and tilts the camera; ${glyph('l2')}/${glyph('r2')} on a pad (or the mouse wheel) zoom. ${glyph('confirm')} on your army selects it; ${glyph('confirm')} again on a far hex moves there (the dotted path shows turns). ${glyph('square')} jumps to the next army that can move. ${glyph('r3')} views the other world. Mouse: click to select and move, right-drag to pan.`],
  ['Armies', 'Stacks hold up to nine units. Each unit has figures (the little soldiers) that fall one by one as it takes damage. Units gain experience in battle. Press ' + glyph('l1') + ' with an army selected for its actions: found a city with Settlers, meld a Magic Spirit with a mana node, shift worlds at an opened tower, patrol, or split the stack.'],
  ['Cities', 'Open a city with ' + glyph('confirm') + '. Move people between farming and working, choose what to build, or buy it with gold. Buildings unlock troops and raise food, gold, power and research. Unrest rises with taxes; shrines and temples calm it.'],
  ['Magic', 'Power from your fortress, cities and nodes splits three ways (Magic screen): <b>mana</b> to cast, <b>research</b> to learn spells, and <b>casting skill</b>, which limits how much mana you can pour into spells each turn. Big spells take several turns to weave. Spellbooks in a realm unlock its rarer spells.'],
  ['Battle', 'Moving into enemies starts a tactical battle. ' + glyph('dpad') + ' moves the cursor; ' + glyph('confirm') + ' moves the active unit or attacks the red-marked enemy; ' + glyph('triangle') + ' opens battle spells; ' + glyph('square') + ' waits; ' + glyph('back') + ' defends; ' + glyph('l1') + '/' + glyph('r1') + ' switch units; ' + glyph('options') + ' gives Auto and Retreat. First strike, flying, missile immunity and more matter.'],
  ['Wizards & Heroes', 'Rival wizards remember how you treat them. Use Diplomacy to sign pacts, trade spells, pay tribute or declare war. Heroes appear as your fame grows; equip them with items found in lairs and ruins (Heroes & Vault).'],
  ['Turn Flow', 'When your armies are done, end the turn with ' + glyph('r2') + ' (or the Command menu). Rivals move, cities grow, research and spells progress, and your chancellor reports the news. ' + glyph('triangle') + ' opens the Command menu for every screen.'],
];
function showHowTo(page = 0) {
  const [t, body] = HOWTO[page];
  UI.push(`<div class="panel" style="width:860px"><h2 class="center">How to Play · ${page + 1}/${HOWTO.length}</h2><h3>${t}</h3><p class="big" style="line-height:1.45">${body}</p>
    <div class="row center">${page > 0 ? B('◀ Previous', () => { UI.pop(); showHowTo(page - 1); }) : ''}${page < HOWTO.length - 1 ? B('Next ▶', () => { UI.pop(); showHowTo(page + 1); }) : ''}${B('Close', () => UI.pop())}</div></div>`, { onBack: () => UI.pop(), focus: page < HOWTO.length - 1 ? '.btn:nth-last-child(2)' : '.btn:last-child', onButton: (b) => { if (b === 'r1' && page < HOWTO.length - 1) { UI.pop(); showHowTo(page + 1); } if (b === 'l1' && page > 0) { UI.pop(); showHowTo(page - 1); } } });
}

// ---------- end of game ----------
function showGameOver(over) {
  const me = ME(); const win = over.winner === me.id || (G.wizards[over.winner] && G.wizards[over.winner].human && G.wizards.filter((w) => w.human).length > 1);
  const winner = G.wizards[over.winner];
  playMusic(win ? 'victory' : 'defeat'); Sfx(win ? 'victory' : 'defeat');
  const rows = G.wizards.map((w) => `<tr><td>${esc(w.name)}</td><td>${w.alive ? 'Alive' : 'Banished'}</td><td>${G.cities.filter((k) => k.owner === w.id).length}</td><td>${w.known.length}</td><td>${w.fame}</td><td><b>${wizardScore(w)}</b></td></tr>`).join('');
  const text = over.how === 'mastery' ? `${esc(winner.name)} has cast the Spell of Mastery. The world bends the knee, and every other wizard is cast out into the void beyond the stars.` : `${esc(winner.name)} stands alone. The last rival tower lies in ruins; the moss grows quietly over their banners.`;
  UI.clear();
  UI.push(`<div class="panel col center" style="width:900px">${wizPortrait(winner, 1.3)}<h1>${win ? 'Victory' : 'Defeat'}</h1><p class="big">${text}</p>
    <table style="width:100%;text-align:left;font-size:.9em"><tr><th>Wizard</th><th>Fate</th><th>Cities</th><th>Spells</th><th>Fame</th><th>Score</th></tr>${rows}</table>
    <div class="row center" style="margin-top:.6em">${Game.hub ? '' : B('Return to Title', () => showTitle())}</div></div>`, { onBack: () => { if (!Game.hub) showTitle(); } });
}

// ---- 08_main.js ----
// ===== main: loop, map control, turns, battles, attract mode, AI Hub session =====
const Game = { mode: 'boot', hub: null, busy: false, idleT: 0, world: 0, modals: [], inEndTurn: false, attractToken: 0, hints: new Set(), resultSent: false, started: false };

// ---------- map controller ----------
const MapCtl = {
  cursor: { c: 5, r: 5 }, sel: [], path: null, lastPathKey: '',
  select(us) { this.sel = us.filter((u) => !u.dead); this.lastPathKey = ''; if (this.sel.length) { Sfx('select'); this.cursor = { c: this.sel[0].c, r: this.sel[0].r }; } HUD.refresh(); updateSelRing(); },
  clear() { this.sel = []; this.path = null; this.lastPathKey = ''; clearPath(); updateSelRing(); HUD.refresh(); },
  /** move the cursor one hex in a screen direction, relative to where the camera faces */
  moveDir(dir) {
    const { c, r } = this.cursor;
    const yaw = R.cam.yaw, fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const want = dir === 'up' ? [fx, fz] : dir === 'down' ? [-fx, -fz] : dir === 'right' ? [-fz, fx] : [fz, -fx];
    const here = hexToWorld(c, r);
    let best = null, bs = -Infinity, tie = null;
    for (const [nc, nr] of hexNeighbors(c, r, G.W, G.H)) {
      const p = hexToWorld(nc, nr); const dx = p.x - here.x, dz = p.z - here.z; const l = Math.hypot(dx, dz);
      const sc = (dx * want[0] + dz * want[1]) / l;
      if (sc > bs + 0.02) { bs = sc; best = [nc, nr]; tie = null; } else if (Math.abs(sc - bs) <= 0.02) tie = [nc, nr];
    }
    if (tie && (this._zig = !this._zig)) best = tie;
    if (!best || bs < 0.3) return;
    this.cursor = { c: best[0], r: best[1] };
    const p = hexToWorld(best[0], best[1]); R.cam.tx = p.x; R.cam.tz = p.z;
    Sfx('tick');
    this.onCursor();
  },
  onCursor() { HUD.refreshSelection(); this.preview(); },
  preview() {
    const key = this.cursor.c + ',' + this.cursor.r + ':' + this.sel.map((u) => u.id + '@' + u.c + ',' + u.r).join();
    if (key === this.lastPathKey) return; this.lastPathKey = key;
    clearPath();
    if (!this.sel.length) return;
    const u0 = this.sel[0];
    if (u0.c === this.cursor.c && u0.r === this.cursor.r) return;
    const path = findPath(this.sel, u0.plane, u0.c, u0.r, this.cursor.c, this.cursor.r);
    this.path = path;
    if (!path) return;
    let mv = stackMv(this.sel), turn = 0; const ab = stackAbilities(this.sel); const full = Math.min(...this.sel.map((u) => ustats(u).mv));
    path.forEach(([c, r], i) => {
      if (mv <= 0) { turn++; mv = full; }
      mv -= moveCost(tileAt(u0.plane, c, r), ab);
      const last = i === path.length - 1;
      const enemy = last && canEnter(u0.owner, u0.plane, c, r) === 'attack';
      const m = new THREE.Mesh(geo('pathDot', () => new THREE.SphereGeometry(0.11, 8, 6)), new THREE.MeshBasicMaterial({ color: enemy ? 0xff4a3a : turn === 0 ? 0x7dff6a : 0xffd84a }));
      const p = tileWorld(u0.plane, c, r); m.position.set(p.x, p.y + 0.2, p.z); if (last) m.scale.setScalar(1.6);
      R.pathGroup.add(m);
    });
  },
  update(dt) {
    if (!G) return;
    let moved = false;
    for (const d of ['left', 'right', 'up', 'down']) if (navPressed(d, dt)) { this.moveDir(d); moved = true; }
    // mouse hover picks a hex
    if (Input.mouse.moved && !moved && Input.device === 'mouse') { const g = screenToGround(Input.mouse.x, Input.mouse.y); if (g) { const h = worldToHex(g.x, g.z); if (h.c >= 0 && h.r >= 0 && h.c < G.W && h.r < G.H && (h.c !== this.cursor.c || h.r !== this.cursor.r)) { this.cursor = h; this.onCursor(); } } }
    // camera
    const cs = SETTINGS.camSpeed;
    R.cam.yaw += Input.rx * dt * 1.8 * cs;
    R.cam.pitch = clamp(R.cam.pitch - Input.ry * dt * 1.2 * cs, 0.55, 1.35);
    R.cam.dist = clamp(R.cam.dist + (Input.l2v - Input.r2v) * dt * 16 * cs + Input.mouse.wheel * 2, 8, 46);
    if (held('l2') && !Input.l2v) R.cam.dist = clamp(R.cam.dist + dt * 16, 8, 46);
    if (Input.mouse.rdrag) { const k = R.cam.dist * 0.0016; const cy = Math.cos(R.cam.yaw), sy = Math.sin(R.cam.yaw); R.cam.tx -= (Input.mouse.dx * cy + Input.mouse.dy * sy) * k; R.cam.tz -= (-Input.mouse.dx * sy + Input.mouse.dy * cy) * k; }
    if (pressed('confirm')) { consume('confirm'); this.confirm(); }
    else if (pressed('back')) { consume('back'); if (this.sel.length) { Sfx('back'); this.clear(); } }
    else if (pressed('square')) { consume('square'); this.nextArmy(); }
    else if (pressed('triangle')) { consume('triangle'); showCommandMenu(); }
    else if (pressed('l1')) { consume('l1'); if (this.sel.length) showUnitActions(); else UI.toast('Select an army first.'); }
    else if (pressed('r1')) { consume('r1'); this.nextCity(); }
    else if (pressed('r2') && Input.device !== 'pad') { consume('r2'); requestEndTurn(); }
    else if (pressed('r3')) { consume('r3'); togglePlane(); }
    if (Input.device === 'pad' && pressed('r2') && Input.r2v > 0.9 && !this._r2) { this._r2 = true; requestEndTurn(); }
    if (!held('r2')) this._r2 = false;
    if (Input.mouse.click) { Input.mouse.click = false; this.confirm(); }
  },
  async confirm() {
    const { c, r } = this.cursor; const p = G.plane; const me = G.viewer;
    const here = unitsAt(p, c, r);
    const k = cityAt(p, c, r);
    if (this.sel.length) {
      const u0 = this.sel[0];
      if (u0.c === c && u0.r === r) { if (k && k.owner === me) showCity(k); else showUnitActions(); return; }
      if (here.length && here[0].owner === me && hexDist(u0.c, u0.r, c, r) > 1 && !this.path) { this.select(here); return; }
      await moveSelection(c, r);
      return;
    }
    if (here.length && here[0].owner === me) { this.select(here.filter((u) => !u.patrol).length ? here.filter((u) => !u.patrol) : here); return; }
    if (k && k.owner === me) { showCity(k); return; }
    if (k && isExplored(me, p, c, r)) { const ow = G.wizards[k.owner]; UI.toast(`${k.name}: ${k.pop},000 ${RACES[k.race].name}, ${ow ? 'ruled by ' + ow.name : 'independent'}.`); return; }
    Sfx('deny');
  },
  nextArmy() {
    const me = G.viewer;
    const ready = [];
    const seen = new Set();
    for (const u of G.units) { if (u.owner !== me || u.mv <= 0 || u.patrol || u.done) continue; const key = tIdx(u.plane, u.c, u.r); if (seen.has(key)) continue; seen.add(key); ready.push(u); }
    if (!ready.length) { UI.toast(`All armies have moved. ${glyph('r2')} ends the turn.`); return; }
    const cur = this.sel[0];
    let i = cur ? ready.findIndex((u) => u.c === cur.c && u.r === cur.r && u.plane === cur.plane) : -1;
    const n = ready[(i + 1) % ready.length];
    focusTile(n.plane, n.c, n.r);
    this.select(unitsAt(n.plane, n.c, n.r).filter((u) => u.owner === me && !u.patrol && u.mv > 0));
  },
  nextCity() {
    const list = G.cities.filter((k) => k.owner === G.viewer); if (!list.length) return;
    this._ci = ((this._ci ?? -1) + 1) % list.length; const k = list[this._ci];
    this.clear(); focusTile(k.plane, k.c, k.r);
    UI.toast(`${k.name}: ${glyph('confirm')} to open.`, 1800);
  },
};
function clearPath() { while (R.pathGroup && R.pathGroup.children.length) R.pathGroup.remove(R.pathGroup.children[0]); }
function updateSelRing() { if (!R.selRing) return; const s = MapCtl.sel[0]; R.selRing.visible = !!s && s.plane === G.plane; if (s) { const p = tileWorld(s.plane, s.c, s.r); R.selRing.position.set(p.x, p.y + 0.05, p.z); } }
function focusTile(p, c, r) {
  if (G.plane !== p) showPlane(p);
  MapCtl.cursor = { c, r };
  const w = hexToWorld(c, r); R.cam.tx = w.x; R.cam.tz = w.z;
  MapCtl.onCursor(); updateSelRing();
}
function togglePlane() { showPlane(1 - G.plane); if (MapCtl.sel.length && MapCtl.sel[0].plane !== G.plane) MapCtl.clear(); Sfx('cast', { realm: 'sorcery' }); banner(PLANES[G.plane].name, 1200); HUD.refresh(); }
if (typeof window !== 'undefined') window.addEventListener('mousedown', (e) => { if (e.button === 0 && e.target.id === 'gl') Input.mouse.click = true; });

async function moveSelection(c, r) {
  const us = MapCtl.sel.slice(); if (!us.length) return;
  const p = us[0].plane;
  const path = findPath(us, p, us[0].c, us[0].r, c, r);
  if (!path) { Sfx('deny'); UI.toast('No path. Mountains, water or a foreign border bar the way.'); return; }
  if (stackMv(us) <= 0) { for (const u of us) u.goto = [c, r]; UI.toast('These units have no moves left; they will march next turn.'); MapCtl.clear(); return; }
  Game.busy = true;
  clearPath();
  let i = 0;
  for (; i < path.length; i++) {
    const [nc, nr] = path[i];
    const e = canEnter(us[0].owner, p, nc, nr);
    if (e === 'attack') {
      const foes = unitsAt(p, nc, nr); const k = cityAt(p, nc, nr); const ow = foes.length ? foes[0].owner : k ? k.owner : -1;
      const ok = await askAttack(foes, k, ow);
      if (ok) { const b = makeBattle(us, p, nc, nr); for (const u of us) u.mv = 0; await runBattle(b); }
      break;
    }
    R._moveFrom = tIdx(p, us[0].c, us[0].r);
    const res = stepStack(us, nc, nr);
    if (res !== 'moved') break;
    await animateMove(us, [[nc, nr]]);
    refreshWorld();
    if (stackMv(us) <= 0) { i++; break; }
  }
  const alive = us.filter((u) => !u.dead);
  if (alive.length && i < path.length && stackMv(alive) <= 0 && !(alive[0].c === c && alive[0].r === r)) for (const u of alive) u.goto = [c, r];
  else for (const u of alive) u.goto = null;
  Game.busy = false;
  refreshWorld();
  if (alive.length && alive[0].mv > 0) MapCtl.select(alive); else MapCtl.clear();
  hintOnce('moved', 'Armies with moves left stay selected. Press ' + glyph('square') + ' to jump to the next army that can still move.');
  checkGameOver();
}
function askAttack(foes, k, ow) {
  return new Promise((res) => {
    const w = G.wizards[ow];
    const me = ME();
    if (w && w.rel[me.id] && w.rel[me.id].treaty !== 'war') {
      confirmBox(`You have a ${w.rel[me.id].treaty === 'alliance' ? 'n alliance' : ' treaty'} with ${esc(w.name)}. Break it and attack?`, () => { declareWar(me.id, ow); for (const x of G.wizards) if (x.id !== me.id && x.rel[me.id]) adjustRel(x.id, me.id, -10); res(true); }, () => res(false));
      return;
    }
    const names = [...new Set(foes.map((u) => unitDef(u.type).name))].slice(0, 4).join(', ');
    const pw = stackPower(foes), mine = stackPower(MapCtl.sel);
    const odds = pw === 0 ? 'none' : mine / pw > 2 ? 'favourable' : mine / pw > 1 ? 'even' : 'grim';
    confirmBox(`${k ? `Assault ${esc(k.name)}` : 'Attack'}${names ? ` · ${esc(names)}` : ''}${foes.length ? ` (${foes.length})` : ' (undefended)'}? Your captains judge the odds <b>${odds}</b>.`, () => res(true), () => res(false));
  });
}

// ---------- unit actions ----------
function showUnitActions() {
  const us = MapCtl.sel; if (!us.length) return;
  const all = unitsAt(us[0].plane, us[0].c, us[0].r).filter((u) => u.owner === G.viewer);
  const settler = us.find((u) => unitDef(u.type).ab.includes('settle'));
  const spirit = us.find((u) => canMeld(u));
  const render = () => `<div class="panel" style="width:1000px"><h2 class="center">Army Orders</h2>
    <p class="center muted">Toggle units in or out of the moving army.</p>
    <div class="row wrap center">${all.map((u) => unitCard(u, MapCtl.sel.includes(u) ? 'sel' : '', () => { if (MapCtl.sel.includes(u)) { if (MapCtl.sel.length > 1) MapCtl.sel = MapCtl.sel.filter((x) => x !== u); } else MapCtl.sel.push(u); MapCtl.lastPathKey = ''; UI.replace(UI.top(), render()); HUD.refresh(); })).join('')}</div>
    <div class="row wrap center" style="margin-top:.5em">
      ${settler ? B('🏘 Build Outpost', () => { const r0 = settleHere(settler); UI.pop(); if (typeof r0 === 'string') UI.toast(r0); else { MapCtl.clear(); refreshWorld(); buildFeatures(r0.plane); R_rebuildCity(r0); hintOnce('city', 'A new city! Open it with ' + glyph('confirm') + ' to choose what it builds.'); } HUD.refresh(); }) : ''}
      ${spirit ? B('✦ Meld with Node', () => { meld(spirit); UI.pop(); MapCtl.clear(); buildFeatures(G.plane); refreshWorld(); HUD.refresh(); }) : ''}
      ${canShift(MapCtl.sel) ? B('🌗 Shift Worlds', () => { const moved = MapCtl.sel.slice(); planeShift(moved); UI.pop(); showPlane(moved[0].plane); focusTile(moved[0].plane, moved[0].c, moved[0].r); MapCtl.clear(); Sfx('cast', { realm: 'sorcery' }); fx('summon', moved[0].plane, moved[0].c, moved[0].r, 'sorcery'); }) : ''}
