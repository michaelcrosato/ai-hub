<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Signing in — AI Hub</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c0910; color: #f3eef7; font: 16px system-ui, sans-serif; }
      a { color: #ffb43d; }
    </style>
  </head>
  <body>
    <p id="status">Signing you in…</p>
    <script type="module">
      // Google sends the browser here with a one-time code (PKCE). Trade it
      // for a session, keep nothing Google-side, and go back where you were.
      import { client } from '/assets/js/account/cloud.js';
      import { AUTH_KEY, RETURN_KEY } from '/assets/js/account/config.js';
      import { safeReturn } from '/assets/js/account/auth.js';

      const status = document.getElementById('status');
      const params = new URLSearchParams(location.search);
      const back = safeReturn(sessionStorage.getItem(RETURN_KEY) || '/');
      const fail = (text) => {
        status.textContent = `${text} `;
        const link = document.createElement('a');
        link.href = back;
        link.textContent = 'Back to the hub';
        status.append(link);
      };
      try {
        if (params.get('error')) throw new Error(params.get('error_description') || params.get('error'));
        const code = params.get('code');
        if (!code) throw new Error('No sign-in code came back.');
        const sb = await client();
        const { error } = await sb.auth.exchangeCodeForSession(code);
        if (error) throw error;
        // The hub never needs Google's own tokens: don't keep them on a page games share.
        const stored = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
        if (stored) {
          delete stored.provider_token;
          delete stored.provider_refresh_token;
          localStorage.setItem(AUTH_KEY, JSON.stringify(stored));
        }
        sessionStorage.removeItem(RETURN_KEY);
        location.replace(back);
      } catch (error) {
        fail(`Sign-in didn't work: ${error.message || error}.`);
      }
    </script>
  </body>
</html>
